answer: |-
  Let's start by testing the obvious candidates against the specific texture of your experience, because you are right to feel that the standard labels are slightly off. They describe the *shape* of the problem but miss the *mechanism*.

  **Candidate 1: The Death of the Author (Roland Barthes).**
  This suggests the author's intent is irrelevant to meaning.
  *Test:* This fits your observation that you can't control how the book is read. But it fails your political test. Barthes treats all readers as equal liberators of text. Your letters show that readers are *not* equal; one reads from inside the community (negotiated code), one reads from the perspective of how the dominant culture will weaponize the text (oppositional/consequentialist). "Death of the Author" is too neutral; it doesn't account for the *harm* of the second reading.

  **Candidate 2: The Burden of Representation (Kobena Mercer / Stuart Hall).**
  This is the strongest existing contender. It argues that Black artists are forced to represent the "whole race," so negative depictions are seen as betrayals.
  *Test:* This fits the "angels or animals" dichotomy perfectly. However, it describes a *pressure on the artist* before they write. You are describing something that happens *after* the writing, a shifting volatility over time ("honesty in one decade reads as betrayal in the next"). The "Burden" sounds static; your experience is kinetic. It's not just a weight; it's a drift.

  **Candidate 3: Propaganda.**
  *Test:* You already rejected this. Propaganda implies intent. Your problem is that the *effect* becomes propaganda regardless of intent.

  **My Verdict**
  There is no single established term that captures the *temporal volatility* and the *loss of consequential control* you are describing. "The Burden of Representation" is the sociological condition, but it doesn't name the aesthetic mechanism.

  I am going to coin a term for this, grounded in 20th-century speech act theory (J.L. Austin) but modified for post-colonial reception. I call it **Perlocutionary Dispossession**.

  Here is the carving of the concept.

  ### The Concept: Perlocutionary Dispossession

  **What it is:**
  In speech act theory, an *illocution* is what you do *in* saying something (e.g., promising, depicting, asserting). A *perlocution* is what you achieve *by* saying something (e.g., persuading, frightening, inspiring).

  **Perlocutionary Dispossession** occurs when the *perlocutionary force* (the political consequence) of a work is severed from the *illocutionary intent* (the artistic depiction) and seized by a dominant discourse that possesses the power to define reality.

  It is not that the meaning is unstable (as in "Death of the Author"); it is that the *consequence* is expropriated. You intend to depict a complex human (illocution). The dominant culture receives it as evidence of pathology (perlocution). You are "dispossessed" of the consequences of your own speech because you do not own the context in which it lands.

  **What it isn't:**
  *   It isn't **Misinterpretation.** The second letter writer isn't misreading the text; they are accurately predicting how the text will function in a racist society. The "betrayal" is real, even if the "thief" is also real.
  *   It isn't **Censorship.** No one is stopping you from writing. The control is lost *after* publication, in the circulation.
  *   It isn't **Ambiguity.** The text isn't vague. The volatility exists *because* the text is clear.

  **Why this fits your letters:**
  *   **Letter 1 (Internal):** Engages with the *Illocution*. "You showed us as we are." They accept the depiction on the terms of production.
  *   **Letter 2 (External/Protective):** Engages with the *Perlocution*. "You handed them a stick." They are analyzing the deployment of the text in a power dynamic you don't control.
  *   **The Temporal Shift:** This explains why honesty in one decade is betrayal in another. As the political climate shifts, the *perlocutionary potential* changes. In a decade of racial optimism, the thief is a complex individual. In a decade of racial backlash, the thief is proof of a stereotype. The text didn't change; the *field of consequences* did.

  ### Boundary Cases

  To ensure this concept holds, we need to know where it stops.

  **1. When is Perlocutionary Dispossession absent?**
  It is absent when the artist and the audience share **Sovereign Context**.
  *   *Case:* A Caribbean-British novel published by a Black-owned press, distributed solely within community networks, reviewed only by Black critics, in a decade where the community has political autonomy over its own image.
  *   *Why:* Here, the perlocution (consequence) remains within the community's control. The "stick" cannot be handed to "them" because "they" are not holding the microphone. The meaning is fixed by the production context because the reception context is identical.

  **2. A case where both your letters would be wrong.**
  *   *Case:* A work of **Radical Opacity** (inspired by Édouard Glissant).
  *   *Description:* You write a novel where the theft happens, but the narrative structure refuses to explain *why*, refuses to offer psychological realism, and refuses to fit into the genre of "social realism." The style is so dense, poetic, or fragmented that it cannot be easily extracted as "evidence" of anything.
  *   *Why:* Letter 1 is wrong because the community cannot recognize themselves in a mirror that is deliberately cracked (it's not "showing us as we are"). Letter 2 is wrong because the dominant culture cannot use it as a "stick"—it's too confusing to be weaponized as sociological data.
  *   *Verdict:* This is the only escape from Perlocutionary Dispossession: making the art useless as propaganda for *anyone*. But this comes at the cost of accessibility.

  ### A Challenge to Your Conclusion

  You wrote: *"I've got no control over that."*

  As a philosopher of art, I must push back here. Perlocutionary Dispossession is not a total law; it is a gradient. You have more control than you think, but it lies in **Framing**, not **Content**.

  If you believe the political force is *only* what happens later, you surrender the illocution entirely. But you can anchor the perlocution by controlling the **Paratext** (the blurbs, the interviews, the essays surrounding the book).

  *   **The Trap:** Thinking the text stands alone.
  *   **The Fix:** You cannot stop the second letter writer's fear, but you can intervene in the *reception*. If you publicly articulate the stakes of the depiction *before* the dominant culture seizes it, you create a "buffer" of interpretation. You don't fix the meaning, but you complicate the weaponization.

  **Final Position:**
  The phenomenon is **Perlocutionary Dispossession**. It is the specific alienation of the marginalized artist from the consequences of their work. It differs from "The Burden of Representation" because it is dynamic and temporal, not static. It differs from "Death of the Author" because it is rooted in power asymmetry, not just hermeneutics.

  You are not failing to secure the depiction. You are succeeding at the illocution (the art) while being dispossessed of the perlocution (the politics). Recognizing this distinction is the only way to write the third book without being paralyzed by the letters about the second.
