prompt: |-
  I chair the hiring committee in a philosophy department of about thirty, and I have stopped trusting how we reach our recommendation: five to seven members, four or five candidates a year, one vote that shapes the department for a decade, and a process in which we read and interview sequentially, then deliberate in order of seniority. I teach social epistemology, so I know the Condorcet result and the independence assumption it rests on, and I know the cascade literature well enough to worry: under a flat prior with conditionally independent signals of accuracy p greater than one half, the second agreeing report is already sufficient to make it rational for everyone after to ignore their own evidence — at which point the later agreement is evidence of nothing at all, and can be produced just as reliably by reputational caution as by genuine conviction. Cascades of that kind are also fragile in the way that matters to me: one small public remark, from the chair especially, can reverse the whole thing. And I know that groups reliably pool the information everyone already shares while neglecting what only one member knows.

  What I want is a procedure, not counsel: something my committee can actually run. In what order do we elicit and record judgments before anyone speaks? What may the first round contain? How do we treat members who have read the candidate's work against those who have only met them for an hour? What counts as a reason to reopen a settled judgment, and what do we do when the discussion converges too fast for the convergence to be credible? It has to be usable by colleagues who have never heard of a cascade, run in the two hours we actually have, and end in a recommendation I have to sign.

  Then run it on three cases: one where the first two readers are enthusiastic and everyone afterwards agrees; one where a single member holds genuinely private information the rest lack; and one where the procedure returns an answer I will not want to hear. Mark the steps that are judgment dressed as procedure, and tell me what the procedure cannot do — in particular, whether anything in it can address the possibility that our signals were never independent to begin with.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Chair of a hiring committee in a philosophy department (~30 faculty, committee size 5-7).
      *   **Expertise:** Teaches social epistemology, knows Condorcet Jury Theorem, information cascades, common knowledge vs. private information problems.
      *   **Problem:** Current process (sequential reading/interviewing, deliberation by seniority) is vulnerable to cascades, reputational pressure, and hidden information. The Chair's early remarks can sway everything.
      *   **Goal:** A concrete *procedure* (not just advice) to mitigate these epistemic failures.
      *   **Constraints:** Must be usable by non-experts, fit within a 2-hour meeting, result in a signable recommendation.
      *   **Specific Requirements:**
          *   Order of eliciting/recording judgments before speech.
          *   Content of the first round.
          *   Treatment of "readers" vs. "interviewers" (differential expertise/access).
          *   Criteria for reopening settled judgments.
          *   Action when convergence is too fast (suspicious consensus).
          *   Run the procedure on three specific cases (Cascade, Private Info, Unwanted Result).
          *   Mark steps that are "judgment dressed as procedure."
          *   Acknowledge limitations (specifically regarding non-independent signals).

  2.  **Deconstruct the Epistemic Problems:**
      *   *Information Cascades:* Occur when public actions overwhelm private signals. Solution: Secret ballots or private recording *before* discussion.
      *   *Seniority Bias:* Solution: Reverse order of speaking or anonymous input.
      *   *Common Information Bias:* Groups discuss what everyone knows, not what unique individuals know. Solution: Structured elicitation of unique data points.
      *   *Chair Influence:* Solution: Chair speaks last or acts only as facilitator.
      *   *Differential Expertise:* Some read papers (deep dive), some met candidate (social signal). Need to weight these without silencing the "met" group.
      *   *Time Limit:* 2 hours is tight. The procedure must be efficient.

  3.  **Drafting the Procedure (The "Blind-Delphi Hybrid"):**
      *   *Pre-Meeting:* Essential for independence. Members must form initial judgments *before* gathering.
      *   *Round 1 (Silent):* Written scores/rankings. No discussion. This captures the private signal before public noise.
      *   *Round 2 (Information Exchange):* Focus on *why*, not *who*. Anonymized reasons? Or structured sharing? Let's go with structured sharing to save time. "One unique fact per person."
      *   *Round 3 (Re-vote):* Check for movement.
      *   *Chair Role:* Facilitator, speaks last.

      *Refining for the User's Constraints:*
      *   Need to handle the "Readers vs. Met" issue.
      *   Need to handle "Too fast convergence."
      *   Need to fit in 2 hours.

      *Proposed Protocol: The "Sealed-Input Structured Deliberation" (SISD).*
      1.  **Pre-Commitment:** Individual written assessments submitted 24h prior (or sealed envelopes opened at start). Let's say sealed envelopes at start to ensure presence, but written *before* influence. Actually, to prevent hallway talk, written *before* the meeting is better. Let's mandate written scores submitted to the Chair *before* the meeting starts.
      2.  **Opening:** Chair states goal, rules, speaks *last*.
      3.  **Round 1 (The Reveal):** Display the distribution of votes (anonymous). Not individual votes, just the spread.
      4.  **Round 2 (Unique Information Elicitation):** Go around the table. Each person must state one piece of evidence *not* contained in the CV/Job Letter. Readers: specific argument flaws/strengths. Interviewers: specific interaction data. *Constraint:* No evaluative adjectives yet (e.g., "good," "bad"), just data.
      5.  **Round 3 (Discussion):** Open floor.
      6.  **Round 4 (Final Vote):** Secret ballot.
      7.  **Safety Valve:** If Round 1 and Round 4 are identical (100% agreement), trigger a "Devil's Advocate" assignment.

  4.  **Addressing Specific Questions:**
      *   *Order:* Written before speech.
      *   *First Round Content:* Binary (Hire/No Hire) + 1-5 Scale + One sentence justification (sealed).
      *   *Readers vs. Met:* Weight the *type* of evidence, not the person. Readers speak to work quality; Met speak to collegiality/fit. Both are necessary conditions.
      *   *Reopening:* If new factual evidence emerges (not just reinterpretation).
      *   *Fast Convergence:* Mandatory dissent assignment.

  5.  **Running the Cases:**
      *   *Case 1 (Cascade):* First two enthusiastic. Procedure catches this because votes are sealed *before* discussion. If the sealed votes are mixed despite the "enthusiasm" rumor, the cascade is broken.
      *   *Case 2 (Private Info):* One member knows something bad/good. The "Unique Information" round forces this out before consensus forms.
      *   *Case 3 (Unwanted Result):* Committee votes for Candidate B, Chair wants A. Chair must sign. Procedure limits Chair's ability to override without cause.

  6.  **Identifying "Judgment Dressed as Procedure":**
      *   Deciding what counts as "relevant evidence."
      *   Deciding when convergence is "too fast."
      *   The threshold for reopening.
      *   These are normative choices disguised as mechanical rules.

  7.  **Addressing Non-Independent Signals:**
      *   This is the hard limit. If everyone reads the same "star" paper or relies on the same advisor's rumor, independence is false. The procedure cannot fix structural correlation in the field.

  8.  **Refining the Output:**
      *   Tone: Professional, precise, respectful of the user's expertise (don't explain Condorcet to them, use it).
      *   Structure: The Procedure first, then the Cases, then the Meta-Analysis.
      *   Time Check: 2 hours.
          *   Prep: 0 min (done prior).
          *   Vote Reveal: 10 min.
          *   Unique Info Round: 30 min (5 mins x 6 people).
          *   Open Discussion: 60 min.
          *   Final Vote & Wrap: 20 min.
          *   Total: 120 min. Perfect.

  9.  **Self-Correction/Polishing:**
      *   *Critique:* Is "sealed envelopes at start" enough? Hallway talk happens.
      *   *Fix:* Require submission to Chair 24h prior. Chair aggregates.
      *   *Critique:* How to handle the "Readers vs. Met" tension?
      *   *Fix:* Explicitly categorize evidence types in the Unique Info round.
      *   *Critique:* What if the Chair lies about the aggregate?
      *   *Fix:* Trust assumption, or have a secretary. Let's assume Chair integrity but note it as a vulnerability.
      *   *Critique:* The user asked "What counts as a reason to reopen?"
      *   *Fix:* Define "New Factual Evidence" vs. "Re-weighing."

  10. **Final Review against constraints:**
      *   Procedure not counsel? Yes.
      *   Order of elicitation? Yes (Written -> Aggregate -> Evidence -> Discussion -> Vote).
      *   First round content? Yes.
      *   Readers vs. Met? Yes.
      *   Reopening criteria? Yes.
      *   Fast convergence? Yes.
      *   Three cases? Yes.
      *   Mark judgment vs. procedure? Yes.
      *   Limitations (independence)? Yes.

      *(Self-Correction on "Judgment dressed as procedure"):* I need to be explicit about where I am making a normative call that looks like a rule. For example, deciding that "collegiality" is a veto-able factor is a judgment call.

      *(Refining the "Independence" limitation):* This is crucial. If the "signals" are correlated because the field is small, no procedure fixes that. I must state this clearly.

      *(Final Polish):* Ensure the tone matches a fellow philosopher (precise, analytical, no fluff).

      *(Wait, one detail):* "One vote that shapes the department for a decade." The stakes are high. The procedure needs to feel robust.
      *(Another detail):* "Run in the two hours we actually have." The pre-meeting voting must not eat into the 2 hours.
      *(Another detail):* "End in a recommendation I have to sign." The output must be clear.

      Let's write it.
answer: |-
  Here is a procedure designed to mitigate information cascades, common knowledge bias, and seniority effects within a two-hour window. It is titled the **Sealed-Input Structured Deliberation (SISD)**.

  ### The Procedure: Sealed-Input Structured Deliberation (SISD)

  **Pre-Meeting (T-minus 24 hours)**
  1.  **Submission:** Each committee member submits a sealed form to the Chair (or a designated neutral secretary) 24 hours before the meeting.
  2.  **Content:** The form must contain:
      *   A binary recommendation (Hire / Do Not Hire).
      *   A numerical score (1–5) on *Research Quality* and a separate score (1–5) on *Collegiality/Fit*.
      *   **One sentence** of justification that cites a specific piece of evidence (e.g., "Chapter 2 argument fails on X," or "Candidate interrupted junior faculty during lunch").
  3.  **Constraint:** No discussion of candidates is permitted between members after the interview concludes and before the forms are submitted.

  **The Meeting (120 Minutes)**

  **Phase 1: The Reveal (15 Minutes)**
  *   **Action:** The Chair displays the *aggregate* data only (e.g., "4 Hire, 2 No Hire; Avg Research 4.2, Avg Fit 3.1"). Individual votes and justifications remain anonymous.
  *   **Rule:** The Chair speaks only to read the numbers. No interpretation of the numbers is allowed.
  *   **Rationale:** This establishes the *existence* of disagreement without revealing *who* disagrees, preventing immediate social pressure to align with the majority or senior members.

  **Phase 2: Unique Information Elicitation (30 Minutes)**
  *   **Action:** Go around the table. Each member has 5 minutes.
  *   **Rule:** Members must state **one piece of evidence** they possess that they believe is *not* common knowledge to the rest of the committee.
      *   *Readers:* Must cite specific textual evidence not in the job letter.
      *   *Interviewers:* Must cite specific behavioral evidence not observable in the text.
  *   **Constraint:** Evaluative adjectives ("brilliant," "rude") are banned. Only descriptive claims ("premise 3 contradicts premise 1," "candidate checked phone during Q&A") are permitted.
  *   **Recording:** A scribe records these points on a whiteboard under "New Evidence."

  **Phase 3: Open Deliberation (60 Minutes)**
  *   **Action:** Open floor discussion.
  *   **Rule:** Discussion must reference the "New Evidence" board. If a member wishes to argue a point not on the board, they must add it there first.
  *   **Seniority Constraint:** Junior members must speak before senior members in this phase. The Chair speaks last.
  *   **Fast Convergence Check:** If consensus appears to form in less than 20 minutes, the Chair must assign one member (randomly selected) to act as *Devil's Advocate* for 10 minutes, arguing the opposite position using only the evidence on the board.

  **Phase 4: Final Judgment (15 Minutes)**
  *   **Action:** Secret ballot on the final recommendation.
  *   **Rule:** Members may change their vote from the Pre-Meeting form. If a vote changes, the member must briefly state (for the record, not for debate) whether the change was due to *new evidence* or *re-weighing of old evidence*.
  *   **Output:** The majority vote determines the recommendation. In case of a tie, the candidate is rejected (status quo bias).

  **Post-Meeting Protocols**
  *   **Reopening a Judgment:** A settled recommendation may only be reopened if a member produces **verifiable factual evidence** that was unavailable during the meeting (e.g., a plagiarism allegation surfaces). Re-interpretation of existing evidence does not qualify.
  *   **The Chair's Signature:** The Chair signs the recommendation resulting from Phase 4. The Chair may append a minority report if they dissent, but cannot overturn the vote without evidence of procedural violation.

  ***

  ### Running the Procedure on Three Cases

  #### Case 1: The Cascade (First two readers are enthusiastic)
  *   **Scenario:** Two senior members read the work early and signal enthusiasm in the hallway. The rest of the committee assumes the work is strong.
  *   **SISD Outcome:** The Pre-Meeting forms are submitted *before* the meeting. Even if hallway talk occurred, the requirement to submit a specific score and justification forces members to crystallize their own private signals.
  *   **The Break:** In Phase 1, if the aggregate shows a 4-2 split rather than 6-0, the "unanimous enthusiasm" illusion is shattered. In Phase 2, members who were hesitant are empowered to share their specific textual doubts without directly contradicting the seniors publicly. The cascade is interrupted because the public action (voting) is decoupled from the social pressure of the room.

  #### Case 2: The Private Signal (One member holds unique info)
  *   **Scenario:** One junior member discovered a significant error in the candidate's logic during the reading, but assumes the seniors already know this.
  *   **SISD Outcome:** Phase 2 (Unique Information Elicitation) mandates the disclosure of non-common knowledge. The ban on evaluative adjectives helps the junior member state "Premise A contradicts Premise B" without having to claim "The work is bad," which feels like an attack on senior judgment.
  *   **The Break:** The error is placed on the "New Evidence" board. In Phase 3, the discussion must grapple with this fact. The procedure forces the private signal into the common pool before the group deliberates on the verdict.

  #### Case 3: The Unwanted Result (Procedure returns an answer you dislike)
  *   **Scenario:** The committee votes to hire Candidate B. You (the Chair) believe Candidate A was superior and that the committee fell for a "charm offensive."
  *   **SISD Outcome:** You must sign the recommendation for Candidate B.
  *   **The Break:** The procedure binds the Chair. Your only recourse is the "Minority Report" option. However, because Phase 4 requires members to state if they changed votes based on *evidence* vs. *weighing*, you can audit the process. If members admit they changed votes due to "reputational caution" (violating the spirit of Phase 2), you have grounds to declare the process void, but not to simply override the vote.

  ***

  ### Meta-Analysis: Judgment Dressed as Procedure

  You asked to mark the steps that are normative judgments disguised as mechanical rules. In social epistemology, there is no view from nowhere; the procedure itself encodes epistemic values.

  1.  **The Status Quo Bias (Tie Breaker):** *Rule:* "In case of a tie, the candidate is rejected."
      *   *Judgment:* This assumes the cost of a false positive (hiring a bad colleague) is higher than the cost of a false negative (missing a good one). This is a value judgment about risk, not an epistemic truth.
  2.  **The Definition of "Evidence":** *Rule:* "Evaluative adjectives are banned... Only descriptive claims."
      *   *Judgment:* This assumes a fact/value distinction that is porous in philosophy. Is "The argument is valid" descriptive or evaluative? This rule privileges empirical-style claims over hermeneutic judgment, potentially biasing against candidates whose work is not easily parsed into premises.
  3.  **The Fast Convergence Threshold:** *Rule:* "If consensus appears... in less than 20 minutes."
      *   *Judgment:* This defines "credibility" as a function of time/effort. It assumes that rapid agreement is suspicious. Sometimes truth is obvious. This rule trades efficiency for skepticism.
  4.  **Reopening Criteria:** *Rule:* "Verifiable factual evidence... Re-interpretation does not qualify."
      *   *Judgment:* This privileges *new data* over *better reasoning*. In philosophy, a new interpretation of existing text is often more valuable than new biographical data. This rule suppresses philosophical insight in favor of administrative finality.

  ### Limitations: The Independence Assumption

  You asked specifically whether this addresses the possibility that **signals were never independent**.

  **The Procedure Cannot Fix This.**

  If the "signals" are correlated structurally, SISD fails.
  *   **Example:** If all five readers were trained in the same sub-field paradigm, they will all evaluate the candidate's work using the same criteria. Their errors will be correlated.
  *   **Example:** If the candidate comes from a "star" advisor, the prior probability of quality is inflated for everyone equally. The "private signals" are actually draws from the same biased distribution.
  *   **Example:** If the "unique information" held by the interviewers is merely "I liked them," and the "unique information" held by readers is "The paper fits our curriculum," these signals are correlated by the department's existing homogeneity.

  **Why the procedure fails here:**
  SISD optimizes for the *pooling* of independent signals (Condorcet). It does not correct for *systemic bias* in the signal generation itself. If $p$ (probability of a correct signal) is inflated by a shared illusion, aggregating those signals simply produces a high-confidence error.

  **What you can do (outside the procedure):**
  You must diversify the committee *before* the procedure runs. If the committee lacks methodological diversity, no voting scheme will save you. The procedure manages the *transmission* of information; it does not validate the *source*. You must accept that if the department's epistemic baseline is flawed, the hiring recommendation will be robustly wrong.
