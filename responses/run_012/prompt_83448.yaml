      *   **Task 1 (Artifact-Politics View):** Analyze the interlock as a political artifact vs. mere enforcement arm.
      *   **Task 2 (Theory Stress Test):** How does the interlock challenge/refine Winner's theory? (It was loud, reversible, defeated quickly vs. bridges which are quiet, permanent, exclusionary).
      *   **Task 3 (Peltzman Effect):** Incorporate risk compensation (do safety devices make people drive recklessly?).
      *   **Task 4 (Delegation):** Compare enforcement mechanisms (fine vs. buzzer vs. interlock).
