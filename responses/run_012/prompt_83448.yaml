      *   **Part 3: Risk Compensation (Peltzman Effect):**
          *   *Theory:* Sam Peltzman (1975). Safety regulations lead to offsetting behavior.
          *   *Relevance:* If the interlock made people feel safe (once buckled) and drive worse, the "politics" of the artifact shifted. The intended politics (save lives) clashed with the actual outcome (riskier driving).
          *   *Nuance:* The interlock was about *compliance*, not just protection. But the broader safety regime (airbags later) fits Peltzman better.
          *   *Political implication:* If the artifact changes behavior unpredictably, its "politics" are unstable. It claims to govern behavior but actually provokes a reaction (recklessness or rebellion).
      *   **Part 4: Delegation and Enforcement (Fine vs. Buzzer vs. Interlock):**
          *   *Fine:* Post-hoc, human discretion (cop decides), negotiable. Politics of surveillance and punishment.
