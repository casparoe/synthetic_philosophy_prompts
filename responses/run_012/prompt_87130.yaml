answer: |-
  Aristotle would reject the framing of your modern debate almost entirely, primarily because he locates the seat of sensation and cognition in the heart, not the brain. For him, the brain is merely a radiator designed to cool the blood heated by the heart. Consequently, any ethical argument premised on brain mass, neuron density, or encephalization quotients commits a category mistake. He would view modern neuroethics as focusing on the wrong organ entirely, mistaking a cooling mechanism for the command center of the soul.

  Regarding moral status, Aristotle does not have a concept equivalent to modern intrinsic worth. Instead, he operates with a hierarchy of capacities grounded in his biology. Moral consideration is tied to the possession of a rational soul (*logos*). Plants have nutritive souls, animals have perceptive souls, and humans have rational souls. Value is teleological; it depends on what an entity is *for* and what function it can perform. Therefore, the physical size of an organ is morally irrelevant unless it directly enables the specific function of rational activity. Even then, it is the activity itself, not the material precondition, that holds value.

  You are correct that Aristotle notes humans have the largest brain relative to body size among blooded animals. However, he interprets this data through his cardiocentric lens: humans have the hottest hearts and purest blood, requiring maximum cooling to maintain the balance necessary for rational activity. The brain size is a material condition for temperature regulation, not the substrate of thought. To argue that brain size constitutes moral worth would be, for Aristotle, confusing matter with form. His hylomorphism insists that the soul is the form of the body. While the body must be suitable for the soul, the moral weight lies in the formal capacity for reason, not the material dimensions of the cooling apparatus.

  This leads directly to the uncomfortable implications of his *scala naturae*. Aristotle is explicitly committed to graded moral worth based on natural capacity. He argues that some humans lack the full deliberative faculty required for citizenship or autonomy, categorizing them as natural slaves. He would likely view modern findings about cognitive differences across species—or even within human populations—as confirmation of natural hierarchies, provided those differences correlate with the capacity for reason. He would not grant moral status to insects based on consciousness alone; perception without reason places them lower on the chain, existing for the sake of higher beings. To escape this conclusion, he would have to abandon the idea that nature assigns function and rank.

  The single commitment doing the most work here is teleological functionalism—the belief that natural entities have inherent purposes defined by their capacities. This commitment drives his biology, ethics, and politics. Dropping it is prohibitively expensive for his system. Without teleology, his definition of virtue collapses, as virtue is defined by fulfilling one's function. Without the hierarchy of souls, his justification for political rule and natural slavery evaporates. He cannot accept brain size as morally relevant without undermining the primacy of rational function, and he cannot abandon functionalism without destroying the architecture of his entire philosophy.

  \answer{Brain size is irrelevant; rational capacity determines moral status.}
