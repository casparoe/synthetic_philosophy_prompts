  ok so I'm in a personal identity module this term (phil of mind side of things, we did the Parfit stuff last week) and before the seminar I have to hand in a one-page "position statement" of where I've landed. Problem is I think my position might just be incoherent and I'd rather find that out from you than from the guy in my seminar who argues with everything. Can you audit it?

  Here's where I've landed:

  1. Personal identity over time consists in psychological continuity and connectedness, not in bodily or brain continuity.
  2. If my whole brain got transplanted into someone else's body (my old body destroyed), I go with the brain. That's me waking up over there.
  3. Teletransportation — scanner reads me, destroys the original, rebuilds an atom-perfect copy on Mars — is death. The guy on Mars will think he's me and will act like me and nobody will be able to tell, but he isn't me.
  4. Gradual replacement is fine though. If you swap my neurons out one at a time for functionally identical silicon bits, while I'm awake and talking through the whole thing, I survive. Same person at the end, just running on different hardware.
  5. I've basically bought the Parfit line that identity isn't what actually matters in survival — what matters is psychological continuity/connectedness, and "identity" is at best a convenient label we slap on it.
  6. But branching is a dealbreaker. If a perfect duplicate of me gets made while I'm still walking around, that duplicate isn't me, and it doesn't get my stuff, my partner, my promises, my job, any of it.

  And here's what's been bugging me. My seminar partner came up with a variation on (4) that I can't answer. In her version the neurons you take out don't get destroyed — they're kept alive in a vat, and at the end someone reassembles them into a working brain with all my memories and dispositions. So now there are two candidates: the gradual-replacement person (silicon, causally continuous with me the whole way through) and the reassembled person (built from my literal original parts, with my memories). Neither has an obviously better claim than the other. Does (4) plus (6) even tell me what happens here, or have I just described my own view into a corner?

  So: which of the six are genuinely in tension with each other, which only look like they are, and how bad is each one? Please rank them by how much damage they do rather than telling me they're all a bit tense. Then tell me the cheapest way to fix the worst one and what I'd be giving up to fix it that way. And since I have to actually defend this in class — say how confident you are in each verdict, and be honest about which one you're least sure of.
