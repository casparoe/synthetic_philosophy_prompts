answer: |-
  John Dewey would likely view the emergence of citizens' assemblies and deliberative mini-publics with a mixture of methodological appreciation and profound ethical skepticism. While he would recognize in them an attempt to apply intelligent method to political chaos, a close reading of his mature political philosophy suggests he would ultimately judge these institutions as a **betrayal of democracy as a shared way of life**, provided they remain isolated from broader social movements. He would argue that they treat the symptoms of democratic decay without curing the disease, potentially obscuring the necessity of a more pervasive public engagement. To understand why, we must weigh the specific design of these bodies against Dewey's core commitments regarding the nature of the public, the character of inquiry, and the purpose of democratic association.

  First, regarding the constitution of the group, a randomly selected mini-public would not count as a "Public" in Dewey's specific sense. In *The Public and Its Problems*, Dewey defines the public not by its method of selection but by its genesis: a public arises organically when a group of people recognizes that they are jointly affected by the indirect consequences of certain transactions and organize to regulate those consequences. The mini-public is inverted; it is constituted top-down by a legislature or executive, commissioned to study a problem that the state has already identified. Its members are selected by lot to represent a demographic cross-section, not because they have spontaneously organized around a shared perception of consequences. For Dewey, this makes the mini-public a simulacrum of a public rather than the real article. It is a sample, not a body. While Dewey might appreciate sortition as a mechanism to break the stranglehold of party elites and wealth, he would argue that a public summoned by the state remains a creature of the state. A genuine Deweyan public must constitute itself; it cannot be convened. The temporary, commissioned nature of these assemblies further alienates them from Dewey's vision, as they lack the continuity required to develop the shared habits and traditions that sustain a community.

  Second, the procedure of the mini-public falls short of Dewey's account of social inquiry. For Dewey, inquiry begins in an "indeterminate situation" that is genuinely felt as problematic by the inquirers. It is driven by the friction of experience. In contrast, members of a citizens' assembly are handed a pre-framed question (e.g., "Should we change the voting system?"). They do not undergo the problem; they are briefed on it. While they deliberate using evidence and expert testimony, the loop of inquiry remains incomplete. Dewey insists that the warrant of an idea lies in its capacity to resolve the problematic situation when carried forward into action. Because the recommendations of mini-publics carry no legal force and are often ignored by legislatures, the inquiry is severed from the test of consequences. It becomes a sophisticated form of role-play or education rather than genuine social inquiry. Dewey would likely argue that this constrains the procedure so severely that it cannot produce "warranted assertabilities" in the political realm. It produces reports, not resolutions. The participants learn, but the society does not necessarily test the knowledge, leaving the inquiry suspended in a vacuum of advisory impotence.

  Third, on the question of justification, Dewey would almost certainly reject the instrumental case usually made for these institutions. Proponents argue that mini-publics produce better-informed opinions, reduce polarization, and lend legitimacy to difficult decisions. This treats democracy as a technology for producing optimal policy outcomes. Dewey, however, valued democracy primarily as a moral ideal—a mode of associated living that allows for the growth of individuals through shared experience. If the citizens' assembly is justified merely because it yields less polarized results than a referendum, Dewey would classify this as a category mistake. He would ask whether the process contributes to the growth of the participants *and* the wider community. If the ninety-nine members deliberate and grow while the rest of the populace remains passive, consuming the results as spectators, the institution fails the test of democracy as growth. It creates a cognitive elite of the moment, rather than elevating the collective intelligence. Dewey would accept the instrumental benefits only if they were secondary to the primary goal of expanding the capacity for shared judgment across the whole society. Used merely to legitimize elite decisions or bypass legislative gridlock, the instrumental justification would strike him as a technocratic maneuver disguised as populism.

  Fourth, the small scale of these bodies evades rather than answers Dewey's diagnosis of the "eclipse of the public." Dewey argued that the Great Society (complex, industrialized, interconnected) had failed to become a Great Community because the scale of modern life made it impossible for people to trace the consequences of their actions. Communication was blocked by distance and complexity. Mini-publics address this by shrinking the scale artificially. They create a manageable room where communication is possible, facilitated by professionals. But this does not solve the problem of the wider public; it merely creates a lifeboat. Dewey's project was to improve the arts of communication—journalism, education, local association—so that the *entire* public could grasp complex consequences. By retreating to a room of one hundred, the mini-public admits defeat on the larger battlefield of public communication. It accepts that the wider public is incapable of deliberation and substitutes a microcosm. For Dewey, this is an evasion. It manages the complexity rather than empowering the public to master it. It treats the eclipse of the public as a permanent condition to be managed by representatives (even random ones) rather than a problem to be solved by better social organization.

  Fifth, regarding the specter of Lippmann, Dewey's rejection of Walter Lippmann's technocracy does not commit him to opposing these institutions outright, but it demands a strict condition: accountability. Lippmann argued that the public was a "bewildered herd" and that insiders should make decisions based on expert knowledge. Mini-publics attempt a synthesis: citizens deliberate, but they are furnished with expert testimony and facilitated by professionals. Dewey would be wary that this structure replicates the Lippmannian hierarchy. If the agenda is set by the legislature, the experts are chosen by the state, and the facilitation guides the consensus, the "organized intelligence" is not truly accountable to the wider public. It is accountable to the commissioning authority. Dewey would welcome them only if they functioned as organs of a wider public will, transmitting the concerns of the neighborhoods and associations up to the state, rather than transmitting state questions down to a sample of citizens. If they serve to insulate decision-makers from the pressure of an organized public, they are a soft technocracy. If they serve to amplify the public's voice where traditional representation has failed, they are a tool of liberation. Given their current design as advisory bodies convened by the state, they lean toward the former.

  Weighing all this against Dewey's famous maxim that "the cure for the ills of democracy is more democracy," the verdict becomes clear. Mini-publics are not "more democracy" in the expansive sense Dewey required; they are "selected democracy." They concentrate the democratic function into a small group, relieving the rest of the citizenry of the burden of deliberation. While this may produce high-quality deliberation within the room, it risks atrophy outside of it. Dewey believed democratic deficits were remediable only by expanding the habits of cooperation and inquiry into every sphere of life—schools, workplaces, families. An institution that quarantines deliberation to a specific time, place, and group contradicts the impulse to democratize daily life.

  Therefore, the prediction is that Dewey would judge citizens' assemblies as a **betrayal of his account of democracy**, though he would acknowledge them as a pragmatic experiment born of necessity. He would view them as a prosthetic limb for a body that needs to learn to walk on its own. They fulfill the *method* of social inquiry (gathering evidence, deliberating, testing ideas) but betray the *ethos* of democracy as a shared way of life (continuous, pervasive participation). He would argue that they are acceptable only as temporary scaffolding to demonstrate what is possible, with the explicit goal of rendering themselves obsolete by revitalizing the broader public sphere. If they become a permanent feature of the constitutional landscape, they institutionalize the idea that only a few can deliberate, which is antithetical to Dewey's faith in the capacity of every individual to contribute to the common good.

  There is, however, an element of anachronism in this judgment. Dewey wrote in an era before the mass mediation of politics had fragmented the public sphere to the degree seen in the twenty-first century. He could not have anticipated the sheer velocity of disinformation or the polarization that makes traditional town halls impossible. In this context, the mini-public offers a protected space for dialogue that Dewey might have found more necessary than his principles suggest. Furthermore, his commitments genuinely underdetermine the answer regarding *sortition*. Dewey criticized electoral representation for turning citizens into passive voters, but he did not explicitly endorse lotteries. It is possible he would see sortition as a way to ensure that "organized intelligence" is not captured by economic elites, aligning with his desire to break the power of special interests. Yet, even granting this, the fundamental issue remains: for Dewey, democracy is not a mechanism of decision-making but a form of life. By mechanizing deliberation, even benevolently, the mini-public risks confirming the very alienation it seeks to cure. Thus, while he might support a trial, his philosophical balance falls heavily against their institutionalization as a substitute for broad-based public engagement.
