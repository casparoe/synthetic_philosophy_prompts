answer: |-
  Good evening, everyone. For those who do not know me, I am the chair of the department, and I have had the privilege of sharing a hallway with Professor [Name] for [Number] years.

  When I look around this room tonight, I am struck first by the sheer immediacy of it. There is a specific kind of seeing that happens in a moment like this. In the Nyāya tradition, this is *pratyakṣa*—perception. It is the direct encounter with what is present. We see the faces of former students who have traveled from across the country. We see the scientists who have collaborated with her on logic and cognitive science. We see her family, who have tolerated thirty-five years of dinner conversations about epistemic instruments. And, most importantly, we see [Name] herself.

  For three and a half decades, her presence in our department has been a perceptual fact. You did not need to read her papers to know she was here. You knew it by the light in her office late at night, by the sound of her voice in the corridor, by the steadiness she brought to our most chaotic faculty meetings. That immediate presence is what we celebrate tonight. It is the ground upon which everything else stands.

  But, as any philosopher knows, perception is only the beginning. We look at the evidence before us, and we draw conclusions. This is *anumāna*—inference.

  When I look at the record of [Name]'s career, I infer a profound impact. I see the students she has placed in top universities. I see the rigor she brought to our curriculum. I see a department that is respected far beyond its size. From these effects, I infer the quality of the cause.

  Now, this is where those of you who know our faculty lunches might smile. Because if you know my own work, you know that I am a reductionist. When it comes to the philosophy of knowledge, I have always argued that what we call "testimony" is really just a complex form of inference. I have argued that when we learn from another person, we are not receiving knowledge directly; we are observing their reliability and inferring the truth of their claim.

  [Name] has heard this argument from me more times than either of us can count. And thirty-five years ago, she told me I was wrong. Last month, she told me I was wrong. She has always told me this with a patience that I suspect was itself a pedagogical strategy. She argues that *śabda*—testimony—is irreducible. She holds that when a trustworthy person speaks, the knowledge arises immediately, not through a calculation of their reliability, but through the words themselves.

  I stand here tonight, and I must confess: I am still not persuaded. I still suspect that inference is doing the heavy lifting. But I also know that I am standing on the shoulders of someone who has shown me, through the sheer force of her intellect, that my position is not the only rational one. She has forced me to sharpen my own arguments simply by refusing to accept their softness. In this room, the specialists know the technical stakes of that debate. For the rest of you, the stakes are simpler: she demanded precision, and she demanded truth, and she refused to let us settle for easy answers.

  There is a third way we come to know things, which the tradition calls *upamāna*—comparison or analogy. It is understanding something new by relating it to something we already know.

  For many of us in this room, [Name] has been that bridge. For the scientists here, she showed that ancient Indian logic was not merely religious doctrine, but a rigorous toolkit for analyzing knowledge that could speak to modern cognitive science. For the students in other fields, she showed that philosophy was not just abstract theory, but a way of living attentively. She made the unfamiliar familiar. She allowed us to understand the depth of the Nyāya tradition not by treating it as an exotic artifact, but by showing us how its questions mirror our own. How do we know what we know? How do we trust each other? She was the analogy that made the strange intelligible.

  And this brings me to the final instrument, the one that is the heart of her life's work, and the heart of this evening: *śabda*—testimony.

  Tonight, I am asking you to believe me. I am asking you to accept my words not because you have inferred my reliability from data, and not because you perceive the truth of my claim directly, but because I am saying it. I am testifying that [Name] is a scholar of the highest order. I am testifying that she is a colleague of rare integrity. I am testifying that she will be deeply missed.

  Now, there is a certain irony here that I know [Name] will appreciate. I am a skeptic about testimony. I am standing here, using testimony to honor a woman whose central philosophical claim is that testimony is a fundamental source of knowledge. If she is right, then my words tonight carry their own weight. If I am right, then you are all currently making a complex inference about my character based on my position as Chair.

  But perhaps the disagreement itself is the point.

  For thirty-five years, we have not agreed on this. And yet, we have agreed on everything that matters. We agreed on the value of the question. We agreed on the necessity of rigor. We agreed that this conversation was worth having, again and again.

  There is a concept in the later tradition, *arthāpatti*—postulation. It is the means of knowing we use to explain a contradiction. How do we explain the fact that two people can disagree fundamentally on a technical point for decades, yet love and respect each other more deeply for it? We must postulate that the friendship is stronger than the philosophy.

  [Name], you have taught us that words can carry knowledge. Tonight, I hope you accept my words as a token of our affection. I may not agree with you about the status of *śabda-pramāṇa*. But I am relying on it right now. I am asking this room to take my word for it: you have changed us.

  To Professor [Name].
