answer: |-
  # Q&A Sheet: Defense of Lewisian Modal Realism

  ### 1. The "Ontological Rent" Objection (Ersatzist Majority)
  **The Objection:** "You're positing an infinity of concrete universes to do a job that abstract models do for free. An ersatz world—a maximally consistent set of propositions or a state-description—captures all the modal truths we need without the extravagant cost. Why pay ontological rent for concrete entities when a model already does the work?"

  **The Two-Minute Reply:**
  "The charge of extravagance assumes that abstract worlds are ontologically cheap. They aren't. For an ersatz world to represent *possibility*, the representation relation itself must be primitive or modal. You have to say this set of propositions *could* have been instantiated. But if you already accept primitive modality to make your abstract worlds work, you've lost the theoretical advantage. My concrete worlds reduce modality to quantification over concrete existents. There is no primitive 'possibility' left in the base theory; there is only existence and spatiotemporal relation.
  Regarding parsimony: Ockham's Razor warns against multiplying *kinds* of entities, not just headcount. I posit one kind of thing: concrete individuals. You posit two: concrete individuals and abstract representations plus a primitive modal operator. My ontology is qualitatively simpler. The 'cost' is psychological, not theoretical. You find it hard to believe; I find it hard to explain modality without the belief. I choose the theoretical benefit of reduction over the intuitive comfort of actualism."

  **Where the Reply is Soft:**
  It relies on the audience accepting that reducing modality to quantification is worth the concrete cost. Many will still feel that qualitative parsimony doesn't outweigh the sheer absurdity of infinite concrete duplicates. It risks sounding like you value system elegance over common sense.

  ### 2. The "Domain of Quantification" Objection (The Logician)
  **The Objection:** "You quantify over 'all possible worlds.' But if the worlds form a set, Cantor's theorem proves there are more possible combinations of worlds than there are worlds in the set. If they don't form a set, what exactly do your variables range over? You can't quantify over a proper class in standard first-order logic without inviting paradox. So, quantifying over what, exactly?"

  **The Two-Minute Reply:**
  "You are correct that the worlds cannot form a *set*. If they did, we could construct a world containing all worlds as parts, leading to paradox. So, the domain of possible worlds is a proper class, not a set. When we say 'there is a world,' we are quantifying over this class.
  In set theory (like ZFC), we quantify over all sets without requiring a 'set of all sets.' We use a schema or a class theory (like NBG) to handle the quantification rigorously. My modal logic does the same. The variables range over the class of concrete universes. We don't need a container for the domain to quantify into it; we only need a well-defined condition for membership. The condition is 'spatiotemporally isolated concrete sum.' That defines the class. As long as we avoid naive comprehension principles that lead to a 'world of all worlds,' the logic holds. I am not claiming the worlds form a set; I am claiming they exist as a plurality."

  **Where the Reply is Soft:**
  Metaphysical reliance on proper classes is controversial. Some logicians view proper classes as linguistic fictions rather than ontological realities. If your logic requires a domain to have being, and proper classes lack "being" in the same way sets do, you may be accused of quantifying over nothing.

  ### 3. The "Epistemic Access" Objection (General Metaphysician)
  **The Objection:** "If these worlds are causally isolated from us, how can we know anything about them? Knowledge requires a causal connection or some reliable tracking mechanism. If you can't interact with them, your belief in them is unjustified."

  **The Two-Minute Reply:**
  "This assumes a causal theory of knowledge that is too strict for metaphysics. We don't have causal contact with numbers or sets, yet we claim knowledge of them. The justification for modal realism is Inference to the Best Explanation. We have modal beliefs: we know that things *could* have been otherwise. The best explanation for the truth of these claims is that there are ways things could have been, and those ways are concrete realities.
  Furthermore, we don't need to know *which* specific world is which to know *that* they exist. We know the principle of recombination: any pattern of local qualities can be instantiated. From that principle, we deduce the existence of the plurality. We know the system exists even if we can't point to a specific distant world. The causal isolation explains why we can't interact, not why we can't know."

  **Where the Reply is Soft:**
  Comparing worlds to mathematical objects invites Platonist objections. Also, "Inference to the Best Explanation" is weak if the explanation (infinite universes) seems vastly more incredible than the phenomenon (modal talk) it explains.

  ***

  ### Prediction: Which Subsidiary Claim Will They Attack First?

  **They will attack the Indexical Account of Actuality first.**

  **Reasoning:** While the Logician is eager to press the Recombination/Domain issue, the Ersatzist majority cares more about the *significance* of the theory than its technical boundaries. The claim that 'actual' is merely indexical (like 'here' or 'now') undermines their core intuition that 'actual' marks a metaphysical distinction between reality and mere possibility. If they can show that 'actual' is *not* indexical—that there is a privileged ontological status to our world—your entire motivation for Modal Realism collapses. They will argue that it is *not* arbitrary to care about this world because this world is *real* in a way others are not. They will target this before worrying about whether Recombination overgenerates, because if the Indexical defense fails, the overgeneration problem becomes moot.

  ***

  ### The Question You Hope Nobody Asks

  **"If 'actual' is indexical and I have counterparts in better worlds living better lives, why is it rational for me to care more about the future of *this* counterpart than the others? If you can't answer that, your theory dissolves the basis for rational decision-making."**

  **Why you dread it:** This strikes at the junction of your two subsidiary claims. If you say "Because this is *my* world," you concede the Indexical account fails to capture self-concern. If you say "You should care about all counterparts equally," you render practical life impossible. It forces you to admit that Modal Realism might be metaphysically coherent but practically inert.
