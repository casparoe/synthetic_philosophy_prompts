  # JOINT STATEMENT ON INTERPLANETARY CIVILIZATION AND LONG-TERM ETHICS
  **Signed:** The Expansionist & The Restrainer
  **Date:** October 26, 2023
  **Context:** Following six months of adversarial collaboration within the Reading Group.

  ## PART I: SHARED PREMISES
  *We disagree on the prescription, but we agree on the diagnosis. Before debating action, we affirm the following claims as our common ground:*

  1.  **The Stakes are Asymmetric:** The long-term future contains the vast majority of potential value and disvalue. Decisions made in this century regarding space infrastructure will disproportionately shape the trajectory of civilization for millennia.
  2.  **Current Moral Immaturity:** Human civilization currently lacks a coherent, robust ethical framework. Our values are evolving, often contradictory, and historically correlated with high levels of suffering and exploitation. We are not morally "finished."
  3.  **The Lock-In Risk:** Technological systems established in space will likely exhibit high path dependence. Once a settlement structure or governance model is established at interstellar distances, it will be physically and causally difficult to alter or recall.
  4.  **Moral Status of the Non-Existent:** We have obligations regarding future people. However, we disagree on the weighting of *existence* versus *quality of life*. We agree that creating new lives is not an intrinsic good if those lives are net-negative in well-being.
  5.  **The Status of Non-Human Environments:** We acknowledge an unresolved ethical tension regarding non-sentient ecosystems. We agree that reshaping a world destroys information and potential intrinsic value, though we weigh this differently against human needs.
  6.  **Epistemic Humility:** We lack empirical data on how human values drift in isolated, high-stress, resource-scarce off-world environments. Sociological predictions regarding multi-planetary civilization are currently speculative models, not evidence-based forecasts.

  ***

  ## PART II: MAP OF GENUINE DISAGREEMENT
  *We identify the following cruxes where our models diverge. We have stripped away semantic disputes to isolate the empirical and ethical hinges.*

  | Crux | The Neutral Question | The Expansionist's Answer | The Restrainer's Answer | The Case/Model That Would Bear On It | Expansionist's Prediction | Restrainer's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Risk of Bad Endings** | Does permanent off-world presence lower or raise the odds that civilization ends *badly* (including suffering risks, not just extinction)? | **Lowers the risk.** Redundancy prevents total extinction. Diverse evolutionary pressures create a "portfolio" of civilizations; if one fails morally, others survive to learn. | **Raises the risk.** Dispersal makes coordination impossible. It spreads potential tyranny or suffering-risks (s-risks) to jurisdictions where no one can intervene to stop them. | **The Fragmentation Model:** A historical/simulation analysis of whether political fragmentation correlates with reduced atrocity or increased war/suffering over 1000+ year timescales. | Fragmentation correlates with resilience and moral diversity; at least one branch remains free. | Fragmentation correlates with unchecked local tyrannies and inability to enforce baseline rights. |
  | **2. The Seed-Ship Case** | Is a single probe filling the galaxy with copies of a fixed, "decent-enough" society (and nothing else) a net positive? | **Net Positive.** Existence is the prerequisite for value. A "decent-enough" life is better than non-existence. Spreading *any* light is better than darkness. | **Net Negative (or High Risk).** "Decent-enough" frozen forever is value lock-in. It prevents moral progress. A static civilization may contain hidden suffering that cannot be corrected. | **The Stagnation Thought Experiment:** Comparing a universe with 1 billion years of static "7/10" welfare lives vs. a universe that remains empty until a "9/10" welfare civilization is possible. | The 1 billion years of "7/10" lives outweigh the empty wait. Value is additive. | The moral cost of freezing progress outweighs the additive value of the "7/10" lives. |
  | **3. Moral Learning** | Do we learn ethics better by *doing* (expanding) or by *reflecting* (staying)? | **By Doing.** Moral maturity requires the stress-test of survival. We cannot think our way to maturity; we must encounter the unknown to refine our values. | **By Reflecting.** Expansion amplifies power faster than wisdom. We must solve core coordination/ethics problems *before* gaining the power to reshape worlds. | **The Power- Wisdom Gap Metric:** Measuring the ratio of a civilization's transformative capacity to its ethical consensus stability during technological acceleration. | The gap narrows through exposure to novel problems. | The gap widens as power outpaces the slow process of cultural reflection. |
  | **4. Semantic Divergence** | What is the primary unit of value being spread: *Minds* or *Civilization*? | **Minds.** "Colonization" is a loaded term. We are spreading *consciousness*. The specific cultural container is secondary to the existence of the experiencer. | **Civilization.** "Expansion" is a loaded term. We are spreading *norms*. You cannot separate the minds from the social structures that shape their quality of life. | **The Decoupling Analysis:** Determining if it is physically possible to spread biological/substrate minds without also locking in the specific cultural/political values of the launch era. | Yes, minds can flourish under varied systems; the substrate is the value. | No, minds are shaped by their governance; the system is the value. |

  ***

  ## NOTES ON THE SEMANTIC DIVIDE
  *We acknowledge that a significant portion of our prior conflict stemmed from Column 4 (Semantic Divergence).*

  *   **The Expansionist** uses "Colonization" to mean **Biological/Cognitive Continuity**. To them, the horror is the silence of a universe without observers. When they say "spread," they mean "ensure consciousness persists."
  *   **The Restrainer** uses "Colonization" to mean **Political/Cultural Imposition**. To her, the horror is the tyranny of a universe without the ability to dissent or improve. When she says "stay," she means "wait until we know how to build a home worth living in."

  *We agree that future dialogue must distinguish between **Spread of Sentience** (Expansionist priority) and **Spread of Specific Norms** (Restrainer priority).*

  ## CONCLUSION
  We do not agree on the path forward. The Expansionist concludes that the risk of extinction outweighs the risk of lock-in. The Restrainer concludes that the risk of lock-in outweighs the risk of extinction. However, we agree that **any viable path must address both risks.**

  Therefore, we jointly propose that future advocacy from either side must include:
  1.  **For the Expansionist:** A concrete mechanism for value drift and course-correction in off-world settlements (a "right of return" or "constitutional sunset" for space colonies).
  2.  **For the Restrainer:** A concrete threshold for "moral maturity" that, if met, would trigger her support for expansion (defining what "ready" looks like).

  *We sign this not to end the debate, but to ensure the debate is finally about the same thing.*
