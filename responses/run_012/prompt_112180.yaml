prompt: |-
  Two people in my reading group have spent months arguing past eachother about space colonization and I want to force them to write the document they should have written instead. Call them the Expansionist and the Restrainer. The Expansionist thinks we should get humans (or whatever we turn into) off Earth and spread as widely and as fast as we can; a universe with more minds in it, and with more than one home for civilization, seems to him obviously better, and he thinks staying small is the riskier bet. The Restrainer thinks going now is reckless: she says we'd freeze our current half-broken values into structures nobody could ever undo, that we've no business treating other worlds as ours to reshape, and that "more minds" only counts if those lives actually go well, which isn't something we can bank on.

  Draft the joint statement they could both sign after an honest adversarial collaboration. I want two parts. (1) A numbered list of claims they both accept -- about what's really at stake, about what's unknown, about the moral status of places and of people who don't exist yet. (2) A table of the genuine disagreements, with each side's position worded the way that side would word it themselves. Columns: crux | the neutral way to state the question | the Expansionist's answer | the Restrainer's answer | the case, thought experiment or model both agree would bear on it | the Expansionist's prediction | the Restrainer's prediction. If part of their fight is really just about words -- e.g. what counts as "colonization", or whether they mean spreading minds or spreading a particular civilization -- say which part and why.

  Two hinges I specifically want them to fight out, since I think that's where it turns: first, does a permanent off-world presence lower or raise the odds that civilization ends badly, and what would genuinely settle that? Second, the seed-ship case -- one probe that would fill the galaxy with copies of a single fixed, decent-enough society and nothing else, ever. Good or bad, and does the answer come out differently for each of them?
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Characters:** The Expansionist (pro-space colonization, risk-spreading, more minds = good) vs. The Restrainer (anti-premature colonization, value lock-in, ethical imperialism, quality of life > quantity).
      *   **Task:** Draft a joint statement resulting from "honest adversarial collaboration."
      *   **Structure:**
          1.  Numbered list of shared claims (stakes, unknowns, moral status).
          2.  Table of genuine disagreements (Crux, Neutral Question, Expansionist View, Restrainer View, Agreed Test/Model, Expansionist Prediction, Restrainer Prediction).
      *   **Specific Hinges to Address:**
          1.  Does permanent off-world presence lower or raise the odds of civilization ending *badly*? (Existential risk vs. S-risk).
          2.  The "Seed-Ship" case (One probe filling the galaxy with a fixed, decent society).
      *   **Tone:** Collaborative, precise, philosophical but grounded, acknowledging the depth of the disagreement without resolving it artificially.

  2.  **Deconstruct the Positions:**
      *   *Expansionist:* Focus on existential risk (eggs in one basket), potential value of future lives (longtermism), inevitability of expansion (if not us, someone/something else), resilience through diversity.
      *   *Restrainer:* Focus on value lock-in (bad values spreading), moral patienthood of potential aliens/ecosystems, quality of life (suffering risks), irreversibility of mistakes, need for moral maturity before expansion.

  3.  **Drafting Part 1: Shared Claims (The Common Ground):**
      *   Need to find where they overlap. Both care about the long-term future. Both care about reducing suffering. Both agree current tech/values are imperfect. Both agree space is physically possible.
      *   *Claim 1 (Stakes):* The long-term future contains the vast majority of potential value/disvalue.
      *   *Claim 2 (Imperfection):* Current human civilization is morally flawed and technologically immature.
      *   *Claim 3 (Irreversibility):* Space settlement introduces dynamics that are hard or impossible to reverse (lock-in).
      *   *Claim 4 (Moral Status):* Future people matter. Non-sentient environments might matter instrumentally or intrinsically (need to be careful here, find a middle ground). Let's say: We have obligations regarding the *quality* of future lives, not just the *quantity*.
      *   *Claim 5 (Uncertainty):* We lack the empirical data to confidently predict sociological outcomes of multi-planetary civilization.

  4.  **Drafting Part 2: The Table of Disagreements:**
      *   *Constraint:* Needs specific columns (Crux, Neutral Question, Exp Answer, Rest Answer, Agreed Test/Model, Exp Prediction, Rest Prediction).
      *   *Hinge 1: Risk of Bad Endings (Existential vs. S-Risk).*
          *   Neutral: Does dispersal reduce total expected suffering?
          *   Exp: Yes, redundancy prevents total extinction.
          *   Rest: No, dispersal spreads potential tyranny/suffering (S-risk).
          *   Test: Historical analogies of fragmentation vs. centralization? Simulation of value drift.
      *   *Hinge 2: The Seed-Ship Case.*
          *   Neutral: Is a static, "decent-enough" monoculture better than no civilization?
          *   Exp: Yes, existence > non-existence. Decent is good enough.
          *   Rest: No, "decent-enough" might be a trap. Lack of moral progress is a negative.
          *   Test: Thought experiment on value stagnation.
      *   *Hinge 3: Definition of Colonization (The "Word Fight").*
          *   Need to address the prompt's instruction about verbal disputes.
          *   Is it "expansion" or "colonization"? Is it spreading *humans* or *values*?
      *   *Hinge 4: Moral Maturity.*
          *   When are we ready?
          *   Exp: We learn by doing.
          *   Rest: We must know before doing.

  5.  **Refining the Content (Iterative Polish):**
      *   *Tone Check:* Ensure the Expansionist doesn't sound like a caricature villain (just a risk-taker) and the Restrainer doesn't sound like a luddite (just a cautionary ethicist).
      *   *The "Seed-Ship" Nuance:* The prompt asks specifically about this. The Expansionist should see it as a win (life wins). The Restrainer should see it as a potential horror (value lock-in).
      *   *The "Bad Ending" Nuance:* Expansionist focuses on *extinction* (ending period). Restrainer focuses on *lock-in* (ending badly).
      *   *Shared Claims:* Make sure they acknowledge the "moral status of places." The Restrainer cares about alien ecosystems. The Expansionist might care instrumentally. Let's phrase it as "We have insufficient ethical frameworks for non-Earth environments."

  6.  **Addressing the "Word Fight":**
      *   The prompt asks to identify if part of the fight is about words.
      *   *Insight:* They often argue about "Colonization." Expansionist means "Survival/Expansion." Restrainer means "Imposition/Extraction." I should include a row or a note about this semantic divergence. I'll put it in the table as a meta-crux.

  7.  **Final Review against Constraints:**
      *   Two parts? Yes.
      *   Numbered list of shared claims? Yes.
      *   Table with specific columns? Yes.
      *   Hinge 1 (Risk of bad ending) included? Yes.
      *   Hinge 2 (Seed-ship) included? Yes.
      *   Word fight addressed? Yes.
      *   Tone: Joint statement style.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Brief context setting.
      *   *Part 1:* 5-6 strong points.
      *   *Part 2:* 4-5 rows. Ensure the "Agreed Test" is actually something they agree would be relevant, even if they can't do it yet.
      *   *Outro:* Acknowledging the work remains.

      *(Self-Correction during drafting)*: Make sure the "Agreed Test" column isn't just "we wait." It needs to be a specific model or thought experiment they agree *would* settle it if we had the answer. E.g., "A sociological model of value drift in isolated populations."

      *(Refining the Seed Ship)*: The prompt asks "does the answer come out differently for each of them?" Yes, that's the point. Expansionist says Good. Restrainer says Bad/Risky. I need to make sure the table reflects that divergence clearly.

      *(Refining the "Word Fight")*: I will add a specific row in the table about terminology, as requested ("If part of their fight is really just about words... say which part and why").

  9.  **Final Polish:** Check for clarity, voice, and adherence to the prompt's specific philosophical hinges. (The prompt asks for "the document they should have written instead." So it should look like a formal manifesto/statement).

      *Let's write it.*
