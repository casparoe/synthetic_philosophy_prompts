prompt: |-
  I chair a standing research-integrity committee at a mid-sized university — seven voting members, we meet monthly, and every meeting ends with a written decision: a short list of findings plus a single verdict that our charter says must be derivable from those findings. The stakes are real (careers, retractions, occasionally a report to a funder), and our general counsel has warned us that a decision whose findings don't actually support its verdict is vulnerable on appeal, so logical consistency is not just a nicety for us. A colleague from the philosophy department sat in on one meeting and remarked that we seemed to have reinvented something that has a whole formal literature behind it, but she was no help beyond that. Here is the problem we keep hitting: each of us can be individually consistent, and we can still end up with a majority for every finding and a majority against the verdict those findings are supposed to entail — or, just as bad, a verdict that nobody can derive from the findings we actually adopted. I do not want a lecture on social choice; I want a procedure I can run in the room, with the order of the steps, the decision points, and an honest marking of where I am making a judgment call rather than consulting a rule.

  Please write that procedure. It has to cover: how we should decide, case by case, whether to aggregate our votes finding-by-finding and then deduce the verdict, or to vote on the verdict directly and back-fill the findings; how to treat abstentions, recusals, and a member who appears to be voting on the findings in order to steer the verdict rather than because she believes them; who is entitled to set the agenda — that is, which propositions count as findings and which count as the verdict — and why that choice does more work than it looks like it does; and what to do when the two aggregation methods disagree and neither side will move. Mark clearly which steps are genuine procedure and which are values or judgment dressed up as procedure, say where the procedure simply cannot settle the matter and a person has to own the decision, and keep in mind that I am the chair, not a specialist, and that I have to be able to defend the whole thing in writing afterward.

  Then run the procedure on three cases. First, a case where the finding-by-finding and verdict-direct methods agree, so that I can see the procedure staying quiet when it should. Second, a case where they come apart: a majority finds that the data were mishandled and a majority finds that the mishandling was material to the paper's conclusions, yet a majority votes against retracting the paper, with a third question — whether to notify the funder — hanging off the retraction. Third, a case where the procedure yields an outcome I will not like, perhaps because a recusal or an abstention swings it. For each case, give the vote tally, the outcome under each method, and exactly what the procedure tells me to do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Analyze the Request:**
      *   **User:** Chair of a standing research-integrity committee (7 voting members, monthly meetings).
      *   **Problem:** Logical inconsistency between findings and verdicts (Doctrinal Paradox/Discursive Dilemma). Individual consistency $\neq$ Collective consistency. Majority on premises $\neq$ Majority on conclusion.
      *   **Constraint:** Needs a *procedure* to run in the room, not a lecture on social choice theory. Needs clear steps, decision points, and marking of judgment calls vs. rules.
      *   **Specific Requirements:**
          *   How to choose between premise-based (finding-by-finding) vs. conclusion-based (verdict-direct) aggregation.
          *   Handling abstentions, recusals, strategic voting.
          *   Agenda setting (who defines findings vs. verdict).
          *   Resolving disagreements between methods.
          *   Marking where procedure ends and judgment begins.
          *   Defensible in writing.
      *   **Deliverables:**
          1.  The Procedure.
          2.  Three Case Studies (Agreement, Disagreement/Paradox, Unpleasant Outcome).

  2.  **Theoretical Underpinning (Internal Knowledge):**
      *   The problem described is the *Discursive Dilemma* (or Doctrinal Paradox) in Judgment Aggregation Theory.
      *   *Premise-based procedure (PBP):* Vote on findings, derive verdict logically. Ensures consistency, might override majority will on the verdict.
      *   *Conclusion-based procedure (CBP):* Vote on verdict, back-fill findings. Respects majority will on outcome, might result in inconsistent findings.
      *   *Special Majority/Quota:* Sometimes used to mitigate.
      *   *Chair's Role:* Crucial in agenda setting and breaking ties/managing process.
      *   *Legal/Charter Constraint:* Verdict *must* be derivable from findings. This strongly biases towards PBP, but CBP is often politically safer. The procedure needs to navigate this tension.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* Practical, actionable, defensible.
      *   *Step 1: Agenda Setting.* This is the most powerful step. Who defines the logic? The Chair + General Counsel (to ensure charter compliance). *Judgment Call:* Defining the logical connective (AND, OR, etc.).
      *   *Step 2: Recusals/Abstentions.* Need clear rules. Recusal = not present. Abstention = present but no vote (counts for quorum, not majority).
      *   *Step 3: The Choice of Aggregation.* This is the core. How to decide PBP vs. CBP?
          *   *Idea:* Default to PBP because the Charter says verdict must be *derivable*. CBP is risky legally.
          *   *Refinement:* Allow CBP only if PBP leads to an absurdity or if the logical link is disputed. But the prompt says the Charter *requires* derivability. So PBP must be the default for compliance. However, the prompt asks how to decide *case by case*.
          *   *Decision:* Establish a "Logic Check" vote. If the logical link is agreed upon, PBP is mandatory for legal safety. If the link is disputed, resolve the link first.
          *   *Wait, a better approach for the Chair:* The Chair proposes the method. The Committee votes on the *method* before voting on content. This makes the method democratic.
      *   *Step 4: Voting on Findings.* Standard majority.
      *   *Step 5: Deriving the Verdict.* Automatic if PBP.
      *   *Step 6: Conflict Resolution.* What if PBP says "Guilty" but CBP says "Not Guilty"?
          *   *Rule:* Charter compliance trumps. If Charter says "derivable," PBP wins.
          *   *Judgment:* The Chair must certify the logic.
      *   *Step 7: Strategic Voting.* Hard to police. Best remedy is secret ballot or open discussion + recorded rationale. Let's mandate recorded rationale for each vote to discourage strategic inconsistency.
      *   *Step 8: Documentation.* Essential for defense.

      *   *Refining the "Choice of Method":* The prompt asks *how* to decide.
          *   *Rule:* If the logical connection is explicit in the Charter/Policy -> PBP.
          *   *Rule:* If the connection is interpretive -> Vote on Method first.
          *   *Judgment:* Chair determines if the connection is explicit or interpretive.

      *   *Refining "Strategic Voting":* You can't prove intent easily. The procedure should require members to affirm the logical connection *before* voting on findings. "Do you accept that if A and B are true, C follows?"

      *   *Refining "Agenda Setting":* Chair drafts propositions. Committee amends. This prevents manipulation of the logic structure.

  4.  **Developing the Case Studies:**
      *   *Case 1 (Agreement):* Simple. 5/7 find misconduct, 5/7 find material. Verdict: Sanction. Both methods yield Sanction.
      *   *Case 2 (The Paradox):* The classic Discursive Dilemma.
          *   Finding A (Mishandled): 4 Yes, 3 No.
          *   Finding B (Material): 4 Yes, 3 No.
          *   (Note: Need to ensure the 4 Yes on A and 4 Yes on B are not the *same* 4 people, otherwise they would vote Yes on Verdict. To create the paradox, the coalitions must shift.)
          *   *Setup:*
              *   Member 1, 2, 3: Yes on A, No on B -> No on Verdict.
              *   Member 4, 5: No on A, Yes on B -> No on Verdict.
              *   Member 6, 7: Yes on A, Yes on B -> Yes on Verdict.
              *   *Wait, that's 5 Yes on A (1,2,3,6,7), 5 Yes on B (4,5,6,7).*
              *   *Verdict Vote:* Only 6,7 vote Yes. 5 vote No.
              *   *Result:* PBP = Retract. CBP = No Retract.
          *   *Procedure Action:* Charter requires derivability. PBP wins. Verdict = Retract.
          *   *Funder Question:* Dependent on Retraction.
      *   *Case 3 (Unpleasant Outcome):* Recusal/Abstention shifts quorum or majority threshold.
          *   *Setup:* 7 members. 1 Recusal. 6 voting.
          *   *Scenario:* PBP leads to a verdict the Chair thinks is too harsh, or CBP was preferred but PBP forced. Or, an abstention breaks the majority needed for a finding.
          *   *Let's go with Recusal breaking the logical chain.*
          *   Member 1 (Key expert) recuses.
          *   Remaining 6 split 3-3 on a key finding.
          *   Finding fails (no majority).
          *   Verdict derived: Not Guilty.
          *   *Unpleasant:* Evidence was strong, but loss of expert vote killed the finding.
          *   *Procedure Action:* Record the recusal, note the failure of the finding, verdict follows logic. Chair cannot override.

  5.  **Review against Constraints:**
      *   *No lecture on social choice:* Keep theory implicit. Focus on steps.
      *   *Mark Judgment vs. Procedure:* Use bold/italics or specific labels (e.g., [PROCEDURE], [JUDGMENT]).
      *   *Defensible:* Emphasize documentation and Charter compliance.
      *   *Chair's Authority:* Clarify where the Chair acts vs. the Committee.
      *   *Tone:* Professional, authoritative, practical.

  6.  **Final Polish of the Procedure:**
      *   Make sure the "Choice of Aggregation" step is robust. Since the Charter says verdict *must* be derivable, the Procedure *must* prioritize the Premise-Based approach (PBP) as the default for compliance. The Conclusion-Based approach (CBP) is only permissible if the findings are treated as *rationale* rather than *logical prerequisites*. Given the General Counsel's warning, PBP is the safe harbor. I will structure the procedure to default to PBP but allow a supermajority to switch to CBP *if* they accept the legal risk (which the Chair must record).
      *   *Correction:* Actually, if the Charter says "derivable," CBP is technically non-compliant if the findings don't support it. So the procedure should mandate PBP for the *official* record, even if they discuss CBP. I will make PBP the mandatory standard for the written decision to satisfy General Counsel.
      *   *Agenda Setting:* Chair proposes logic. Committee approves. This prevents "gerrymandering" the findings.
      *   *Strategic Voting:* Require "Statement of Logic" before voting.

  7.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Warning:* Don't get bogged down in too much bureaucracy. Keep it to one page of steps if possible, then the explanation.
      *   *Case 2 Detail:* Ensure the vote counts add up correctly for the paradox.
      *   *Case 3 Detail:* Ensure the "unpleasantness" is clear (e.g., a guilty person goes free due to technicality of recusal).

  8.  **Final Review:** Does this answer the prompt's specific pain points?
      *   *Order of steps:* Yes.
      *   *Decision points:* Yes.
      *   *Judgment calls marked:* Yes.
      *   *Agenda setting:* Addressed.
      *   *Strategic voting:* Addressed via rationale requirement.
      *   *Disagreement between methods:* Resolved via Charter priority.
      *   *Cases:* Three distinct scenarios provided.

  (Proceed to generate output based on this plan.)
answer: |-
  # The Integrity Committee Decision Protocol (ICDP)

  **Purpose:** To ensure that committee verdicts are logically derivable from adopted findings, compliant with the University Charter, and defensible against appeal.
  **Authority:** The Chair administers this protocol. Deviations require a recorded vote and General Counsel consultation.

  ---

  ## Part I: The Procedure

  ### Step 1: Agenda and Logic Setting (Pre-Meeting)
  **[PROCEDURE]** The Chair drafts the "Propositions Sheet." This lists every proposed Finding (F1, F2...) and the Verdict (V).
  **[PROCEDURE]** The Chair defines the Logical Connective. (e.g., "V is affirmed IF AND ONLY IF F1 AND F2 are affirmed").
  **[JUDGMENT]** *The Chair decides the structure of the logic.* This is the most critical power. Breaking a complex verdict into too many findings increases the risk of inconsistency; too few reduces precision. The Chair must ensure the connective reflects University Policy, not personal preference.
  **[PROCEDURE]** The General Counsel reviews the Propositions Sheet for Charter compliance before the meeting starts.

  ### Step 2: Recusals and Quorum
  **[PROCEDURE]** Members declare recusals *before* Step 3. Recused members leave the room and are not counted in the quorum or vote totals.
  **[PROCEDURE]** Abstentions are recorded during voting. An abstention counts toward quorum but not toward the majority threshold.
  **[JUDGMENT]** *The Chair determines if a recusal is valid.* If a member claims bias to avoid a tough vote, the Chair may overrule based on prior conflict disclosures, but this risks appeal. Default to allowing the recusal to protect the verdict's integrity.

  ### Step 3: The Method Selection Vote
  **[PROCEDURE]** The Chair presents the Logical Connective defined in Step 1.
  **[PROCEDURE]** The Committee votes on the **Method of Aggregation**.
  *   **Option A (Premise-Based):** We vote on Findings first. The Verdict is calculated automatically based on the Logical Connective.
  *   **Option B (Conclusion-Based):** We vote on the Verdict first. We then attempt to draft Findings that support it.
  **[RULE]** *If the Charter requires the verdict be "derivable" from findings, Option A is the default.* Option B may only be selected if a 2/3 majority votes for it *and* acknowledges in writing that they accept the legal risk of inconsistency.
  **[JUDGMENT]** *The Chair advises on the risk.* If the Committee chooses Option B against Chair advice, the Chair must note this in the minutes as a potential vulnerability.

  ### Step 4: The Logic Affirmation
  **[PROCEDURE]** Before voting on content, every voting member must affirm the Logical Connective. (e.g., "Do you agree that if F1 and F2 are true, V follows?")
  **[PROCEDURE]** If a member votes "No" on the Logic, they must state why. If the logic is policy-mandated, their objection is recorded but does not invalidate the connective.
  **[DEFENSE]** *This step prevents strategic voting.* A member cannot vote "Yes" on findings and "No" on the verdict (or vice versa) later without contradicting their own recorded affirmation.

  ### Step 5: Voting on Findings (If Option A selected)
  **[PROCEDURE]** Vote on each Finding individually. Simple majority of present voting members passes a Finding.
  **[PROCEDURE]** Record the tally for each Finding.
  **[PROCEDURE]** **Derive the Verdict.** Apply the Logical Connective to the passed Findings. No vote is taken on the Verdict itself; it is a mathematical output.
  **[JUDGMENT]** *If the derived Verdict seems absurd.* The Chair may call a "Reconsideration of Findings." Members may change their votes on Findings if they realize the implication was unintended. This is the only time votes can be retaken.

  ### Step 6: Voting on Verdict (If Option B selected)
  **[PROCEDURE]** Vote on the Verdict directly.
  **[PROCEDURE]** Draft Findings to match the Verdict.
  **[RULE]** *If Findings cannot be logically drafted to support the Verdict,* the Verdict is void. The Committee must return to Step 5 (Option A).

  ### Step 7: Conflict Resolution (When Methods Disagree)
  **[SCENARIO]** Option A yields Verdict X. A straw poll on Option B yields Verdict Y.
  **[RULE]** *Charter Compliance Trumps Preference.* If the Charter mandates derivability, Option A (Premise-Based) is binding.
  **[JUDGMENT]** *The Chair owns the outcome.* If the Committee is deadlocked and angry, the Chair certifies the Option A result. The minutes must reflect the dissent but state clearly that the Charter compelled the result.

  ### Step 8: Documentation
  **[PROCEDURE]** The Written Decision must list:
  1.  The Logical Connective used.
  2.  The Tally for each Finding.
  3.  The Derivation statement (e.g., "Since F1 and F2 passed, V is affirmed").
  4.  Any dissents regarding the Logic or Method.

  ---

  ## Part II: Case Studies

  ### Case 1: The Clean Run (Agreement)
  **Context:** Allegation of plagiarism in a journal article.
  **Policy:** Retraction (V) is required IF Plagiarism (F1) AND Significant Portion (F2) are found.
  **Committee:** 7 Members. No recusals.

  **Vote Tally:**
  *   **F1 (Plagiarism):** 6 Yes, 1 No. (Passed)
  *   **F2 (Significant):** 5 Yes, 2 No. (Passed)
  *   **Logical Connective:** IF F1 AND F2 THEN V.

  **Method Outcomes:**
  *   **Premise-Based (Option A):** F1 & F2 Passed $\rightarrow$ **Verdict: Retract.**
  *   **Conclusion-Based (Option B):** Straw poll on Retraction yields 5 Yes, 2 No. $\rightarrow$ **Verdict: Retract.**

  **Procedure Instruction:**
  The methods agree. Proceed with **Option A** as per default protocol.
  **Action:** Record the findings and the derived verdict. No special notation needed. The decision is robust.

  ---

  ### Case 2: The Discursive Dilemma (Disagreement)
  **Context:** Allegation of data mishandling.
  **Policy:** Retraction (V) is required IF Mishandling (F1) AND Materiality (F2) are found.
  **Committee:** 7 Members. No recusals.
  **The Split:** The coalition shifts between questions.
  *   Members 1, 2, 3: Believe data was mishandled (Yes F1), but not material (No F2). $\rightarrow$ Vote No on Retraction.
  *   Members 4, 5: Believe data was clean (No F1), but *if* mishandled, it would be material (Yes F2). $\rightarrow$ Vote No on Retraction.
  *   Members 6, 7: Believe data was mishandled (Yes F1) AND material (Yes F2). $\rightarrow$ Vote Yes on Retraction.

  **Vote Tally:**
  *   **F1 (Mishandling):** 5 Yes (1,2,3,6,7), 2 No. (Passed)
  *   **F2 (Material):** 5 Yes (4,5,6,7 + *wait, need 5*). Let's adjust: Members 4,5,6,7 + Member 1 (concedes materiality). 5 Yes, 2 No. (Passed)
  *   **V (Retraction) Direct Poll:** Only 6 & 7 vote Yes. 5 Vote No. (Failed)

  **Method Outcomes:**
  *   **Premise-Based (Option A):** F1 Passed + F2 Passed $\rightarrow$ **Verdict: Retract.**
  *   **Conclusion-Based (Option B):** Direct Vote Fails $\rightarrow$ **Verdict: No Retraction.**

  **Procedure Instruction:**
  1.  **Check Charter:** The Charter states the verdict *must be derivable* from findings.
  2.  **Apply Step 7:** Charter Compliance Trumps Preference. Option A is binding.
  3.  **Action:** You must issue the **Retraction** verdict.
  4.  **Funder Notification:** This is a secondary verdict (V2). Policy: Notify Funder IF Retraction (V). Since V is affirmed, V2 is automatically affirmed.
  5.  **Defense:** In the written decision, explicitly state: "While a majority expressed hesitation regarding the ultimate sanction, a majority affirmed the necessary predicate findings required by Policy X. The Committee is bound by the logical consequences of its findings."
  6.  **Risk:** High risk of appeal. Ensure the Logic Affirmation (Step 4) was signed by all members to prevent them from claiming the logic was flawed later.

  ---

  ### Case 3: The Recusal Trap (Unpleasant Outcome)
  **Context:** Allegation of fabrication.
  **Policy:** Sanction (V) IF Fabrication (F1) is found.
  **Committee:** 7 Members.
  **Situation:** Member 1 is the only statistician. Member 1 recuses due to a prior collaboration with the respondent.
  **Remaining Voting Members:** 6.
  **Threshold:** Majority of voting members (4 votes) needed to pass F1.

  **Vote Tally:**
  *   **F1 (Fabrication):** 3 Yes, 2 No, 1 Abstention.
  *   **Result:** F1 Fails (3 is not a majority of 6).

  **Method Outcomes:**
  *   **Premise-Based (Option A):** F1 Failed $\rightarrow$ **Verdict: No Sanction.**
  *   **Conclusion-Based (Option B):** If polled directly, the 3 "Yes" voters + the Abstainer (who privately supports sanction) might have passed it, but under strict rules, the Verdict must follow the Findings.

  **Procedure Instruction:**
  1.  **Apply Step 2 & 5:** The recusal reduced the pool. The Abstention broke the majority.
  2.  **Action:** You must issue **No Sanction**.
  3.  **Judgment Call:** You may feel this lets a fabricator go free. However, under Step 2, you cannot invalidate the recusal post-hoc. Under Step 5, you cannot count the Abstention as a Yes.
  4.  **Defense:** The Written Decision must note: "Finding F1 failed to achieve majority threshold due to recusal and abstention. Per Charter, Verdict follows Findings."
  5.  **Mitigation:** You may add a "Note of Concern" to the file that does not constitute a sanction but flags the file for future review, *provided* your Charter allows non-punitive notes. If not, the file is closed.
  6.  **Lesson:** This highlights why Step 1 (Agenda Setting) is vital. Had the Chair defined the threshold as "Majority of *Standing Committee* (7)" rather than "Majority of *Present* (6)," the outcome might differ, but that risks quorum challenges. Stick to the defined quorum rules.

  ---

  ## Chair's Cheat Sheet: Where You Are Exposed

  | Step | Exposure | How to Defend |
  | :--- | :--- | :--- |
  | **1. Agenda** | Accusation of "stacking" the logic to force a verdict. | Show General Counsel sign-off on the Logical Connective *before* the meeting. |
  | **3. Method** | Accusation of ignoring the "will of the committee." | Cite the Charter clause on "derivability." Show the vote count on Method Selection. |
  | **4. Logic** | Member claims they "didn't understand" the implication. | Require signed Logic Affirmation. "You agreed A+B=C before voting on A." |
  | **7. Conflict** | Accusation of autocracy when overriding the direct vote. | Document that Option B was legally vulnerable. You chose compliance over popularity. |

  **Final Note:** You cannot eliminate the tension between individual judgment and collective consistency. This procedure does not solve the paradox; it manages the liability. When the math yields a result the room hates, *you* must stand up and read the derivation aloud, then close the meeting. Do not linger.
