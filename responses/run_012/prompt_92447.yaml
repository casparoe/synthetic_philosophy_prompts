answer: |-
  You have identified a genuine gap in the taxonomy. You are correct that "nudge," "sludge," and "libertarian paternalism" do not capture this specific mechanism. They focus on the *direction* of the default (nudge), the *friction* of the opt-out (sludge), or the *preservation of choice* in the abstract (libertarian paternalism). None of them adequately account for the **temporal restriction on the exercise of agency.**

  There is no single, canonical term in the behavioral public policy literature that isolates this exact phenomenon. The closest existing concepts are **"sticky defaults"** (which describes the *result*—people stay in—but not the *mechanism* of the closing window) and **"lock-in"** (which is usually economic/technological, referring to switching costs, rather than procedural/consent-based). In UX design, this is sometimes called a **"Roach Motel"** dark pattern (easy in, hard out), but that term is too colloquial and commercial for policy analysis.

  Since the literature lacks a precise handle, I will coin one for you to use, define its boundaries, and distinguish it from the neighbors you mentioned.

  ### The Term: **Temporal Lock-in**

  I propose **Temporal Lock-in** (or alternatively, **The One-Shot Default**).

  **Definition:** A choice architecture in which a default option is set, and the agency to opt out is restricted to a specific, early temporal window. Once this window closes, the initial non-decision is treated as perpetual, binding consent, and subsequent attempts to exit are reclassified from standard rights to exceptional requests (requiring petitions, committees, or waiting periods).

  **Why this term?**
  *   **Temporal:** Captures the critical variable (time/timing) that distinguishes it from standard sludge or nudges.
  *   **Lock-in:** Captures the economic/policy reality that the agent is bound to the path, distinguishing it from a mere "sticky" preference.
  *   **Distinction:** It separates the *availability* of the option (which exists) from the *exercisability* of the option (which expires).

  ---

  ### The Carving: Defining the Edges

  You asked for the boundaries of the concept. Here is how **Temporal Lock-in** is carved out from the surrounding conceptual terrain.

  #### 1. Does it require strict irreversibility?
  **No.** It requires **procedural asymmetry.**
  If the opt-out is technically possible after the window but requires a phone call to a committee, a written petition, or a six-month wait, while the opt-in required a single click during onboarding, that is Temporal Lock-in.
  *   **The Boundary:** If the post-window exit cost is *symmetrical* to the entry cost (e.g., you can toggle the setting on or off anytime in the app), it is just a Default. If the post-window exit cost is *asymmetrical* (significantly higher friction or lower probability of success) due to a *rule* about timing, it is Temporal Lock-in.
  *   **Why:** Sludge covers general friction. Temporal Lock-in covers friction that is *triggered by the calendar*.

  #### 2. Does it matter if the default is what most people would pick anyway?
  **No.** The wrong is **procedural, not outcome-based.**
  This is the crucial distinction from standard paternalism defenses. A defender might say, "90% of people want the pension, so locking them in saves them hassle."
  *   **The Boundary:** Temporal Lock-in is defined by the mechanism of consent, not the welfare outcome. Even if the default is objectively beneficial, Temporal Lock-in violates the principle of **ongoing autonomy**. It treats a past self's silence as a future self's voice.
  *   **Why:** If the definition relied on the outcome (i.e., "only counts if the default is bad"), it would collapse into ordinary policy evaluation. The specific ethical hazard here is the *assumption of consent*, which remains hazardous even if the assumption happens to be correct most of the time.

  #### 3. Is the culprit the one-shot structure or the information asymmetry?
  **It is the combination, but the One-Shot Structure is the necessary condition.**
  *   **Information Asymmetry:** You noted the window often closes "before you know anything about what's at stake." This exacerbates the harm, but Temporal Lock-in can exist even if you are fully informed. (e.g., "You have 30 days to opt out of this arbitration clause, forever after you are bound.")
  *   **The Boundary:** The defining feature is the **expiration of the right to choose.** Information asymmetry makes it *exploitative*, but the closing window makes it *Temporal Lock-in*.
  *   **Why:** A reversible choice made in ignorance is just a mistake. An irreversible (or high-cost) choice made in ignorance is a trap. An irreversible choice made with knowledge is still a restriction on future agency (precluding future preference changes). Temporal Lock-in targets the restriction on future agency.

  ---

  ### Distinctions from Neighboring Concepts

  Here is exactly how **Temporal Lock-in** distinguishes itself from the four concepts you listed.

  #### 1. Vs. Libertarian Paternalism (Nudge)
  *   **Libertarian Paternalism** claims to preserve "freedom of choice." It argues that because you *can* opt out, your liberty is intact.
  *   **Temporal Lock-in** demonstrates that "freedom of choice" is not a binary state (present/absent) but a **temporal flow**. By restricting *when* choice can be exercised, it undermines the "libertarian" claim without technically removing the option.
  *   **The Difference:** LP asks "Is the option available?" Temporal Lock-in asks "Is the option available *when I need it*?"

  #### 2. Vs. Sludge
  *   **Sludge** (Thaler et al.) is defined by **excessive friction** (time, effort, stigma, cost).
  *   **Temporal Lock-in** can exist with **zero friction** during the window. The friction is introduced solely by the passage of time.
  *   **The Difference:** Sludge is about *how hard* it is to move. Temporal Lock-in is about *when* you are allowed to move. You can have a frictionless Temporal Lock-in (e.g., a toggle that disappears from the UI after 30 days).

  #### 3. Vs. Hirschman-Style Exit
  *   **Exit** (Hirschman) assumes that if an organization deteriorates, members can leave. It relies on the *threat* of exit to maintain quality.
  *   **Temporal Lock-in** neutralizes the threat of Exit. By making exit difficult or rare after the initial period, it insulates the policy from the feedback loop that Exit provides.
  *   **The Difference:** Exit is a market/organizational discipline mechanism. Temporal Lock-in is a structural barrier that disables that discipline mechanism for the duration of the membership/employment.

  #### 4. Vs. Ulysses Contracts (Self-Binding)
  *   **Ulysses Contracts** are **self-imposed** restrictions on future choice to overcome weakness of will (e.g., I lock away my credit card so I don't spend).
  *   **Temporal Lock-in** is **other-imposed**. The individual did not choose to bind their future self; the architect did.
  *   **The Difference:** Ulysses contracts are an exercise of autonomy (binding oneself to protect oneself). Temporal Lock-in is a suspension of autonomy (binding another to protect the system or assume consent).

  ### Summary for Your Use

  If you are writing or arguing about this, you can frame it thus:

  > "While standard nudge theory focuses on the *direction* of defaults and sludge theory focuses on the *friction* of opt-outs, neither captures the **temporal restriction of agency**. I term this **Temporal Lock-in**: a structure where the right to opt-out expires, converting a temporary non-decision into perpetual consent. Unlike Ulysses contracts, this binding is other-imposed; unlike sludge, the barrier is procedural rather than effort-based. It violates the principle of ongoing autonomy by treating the initial moment of ignorance as a mandate for all future moments."

  This gives you the handle, the definition, and the philosophical carving you need to separate it from the existing literature.
