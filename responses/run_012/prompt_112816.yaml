prompt: |-
  Ok so I've been chewing on this for awhile and I want a straight consistency check before I embarrass myself in a discussion group. Here's more or less where I've landed on human nature and how people get good:

  (1) I think there's a natural moral starting point in us. A little kid will get upset on another kid's behalf before anyone's taught him anything, you wince when someone's about to get hit. I think that thing is real, and I think it's actually a guide to what's right, not just a feeling that happens to be sitting there.

  (2) But it's weak on its own. It gets drowned out, it gets aimed in whatever direction whoever raised you aimed it, and it's nowhere near a finished sense of right and wrong. Whatever real moral competence is, it gets built over years — by habit, by being corrected, by ritual, by alot of stuff that comes at you from the outside, from institutions and traditions you didn't pick.

  (3) And the building usually hurts. I don't buy that you just let a seed unfold. Sometimes it's more like a crooked plank getting steamed and bent straight. I've spent time around people in recovery and that's how they describe it — the old self had to come apart first.

  (4) I also think anybody can get there. Nobody's nature locks them out of becoming good, or even great. It's conditions plus effort.

  (5) So when I'm forced to choose, I don't think character is something that was already inside waiting to come out. I think it's made. And I don't think it's made by the individual alone — the individual is maybe the least of it.

  (6) One more and then I'll shut up: I don't think there's a clean fact of the matter about whether my own decency is really mine or just the community's imprint. From the inside I can't tell, and I don't think there's a hidden answer I'm missing.

  I'm pretty sure this can't all be true at once, but I honestly can't tell which parts are fighting. Some of them might just sound contradictory because I'm being sloppy with words like "natural" and "made." So go through them in pairs. I want to know which pairs actually clash and which only look like they do, and for the ones that really clash, how bad it is. Then tell me the cheapest way to patch each one, and what I'd be giving up by patching it that way. Don't just list everything as a tension — I want you to discriminate.

  Format it like this, please:

  - Readback (2-3 sentences): say back what you take my position to be, so I know you got it.
  - Real clashes, worst first (~250 words): each clash in its own paragraph, with a severity label.
  - Clashes that aren't (~150 words): the pairs that only look like they clash, and why.
  - Cheapest patches and the bill (~200 words): for each real clash, the least costly fix and what it costs.
  - What would change your mind (~150 words): the argument or consideration that would actually move you off your verdict, and where your own reasoning is most likely to be wrong.

  Write it in American English. I don't need cites or a reading list — just the argument.
