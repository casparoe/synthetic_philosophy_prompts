      **For Inner Guide (1/5):** Define "character" strictly as finished habit, distinct from "nature" which is just potential. The guide is a compass, not the map. This preserves the constructionist view while keeping the innate spark. **Cost:** You weaken the claim that the natural guide is truly moral; it becomes merely proto-moral sensitivity, reducing the weight of point (1). It becomes a biological impulse, not a moral truth. You lose the idea that nature teaches us virtue.

