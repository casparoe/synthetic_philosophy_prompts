      **Inner Guide vs. Outer Construction (1 vs 5) — Severity: Medium.** Point (1) posits an internal guide that points to "what's right." Point (5) denies character is "inside waiting to come out." If the innate guide accurately identifies rightness, the blueprint for character is internal. Denying character is "inside" contradicts the existence of an internal normative compass. You risk treating the seed as nothing while claiming it knows the sun. If the guide is real, some part of character is discovered, not just made. This weakens your constructionist claim; if the raw material has direction, the building isn't purely external.

