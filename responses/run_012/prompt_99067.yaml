      *   *Check:* Did I make Elena a dogmatist? She needs to explain *why* aggregation is forbidden, not just say "Scanlon says no." She needs to hit the "separateness of persons" point.
      *   *Check:* The Veil of Ignorance point. Scanlon explicitly distinguishes his view from Harsanyi/Rawlsian VEI in *What We Owe to Each Other*. Elena needs to make sure she clarifies that contractualism is about mutual justification to actual people, not hypothetical betting.
      *   *Check:* The "Rejectable to whom?" line. Marcus should argue that if no *individual* commuter loses out, who is doing the rejecting? The group? But the group isn't an agent.
      *   *Check:* The "Super-person" point. Elena should argue that adding up utilities treats society as a single entity experiencing the sum, which ignores the distribution.

  5.  **Drafting the Content (Mental or Scratchpad):**
