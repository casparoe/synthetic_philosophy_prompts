answer: |-
  **Setting:** *A university philosophy department lounge, late evening. The whiteboard is still covered in diagrams from a seminar on population ethics. Two colleagues, ELENA (Contractualist) and MARCUS (Aggregator), are finishing off cold coffee.*

  **Marcus:** So, run the numbers again. Just to be sure we're not hallucinating the scale.

  **Elena:** Ten million commuters. Thirty seconds saved per person, per day. Permanent activation of the Chronos Device.

  **Marcus:** Right. That's three hundred million seconds daily. Roughly nine and a half years of human life saved every twenty-four hours. In exchange for… what? Arthur's tinnitus?

  **Elena:** Permanent, moderately severe tinnitus. Ringing, difficulty concentrating, sleep disruption. It's a real burden, Marcus. It lowers his quality of life significantly. But it's not life-threatening.

  **Marcus:** Exactly. It's a trade-off. One person's moderate hearing comfort against nine and a half years of aggregated human time every single day. Over a year, that's millennia of life experience returned to the city. To say we can't turn this on feels like moral fetishism.

  **Elena:** It feels like morality to me. Under Scanlon's formulation, the question isn't "What maximizes the good?" It's "Could anyone reasonably reject a principle permitting this?" Arthur can reasonably reject it. His complaint is grounded in a significant impairment to his life.

  **Marcus:** But here's the hole in the boat, Elena. Rejectable to *whom*, exactly? You say Arthur can reject it. Fine. But can any single commuter reject the principle that *turns the machine off*?

  **Elena:** No. Not individually.

  **Marcus:** There it is. If no individual commuter has a complaint strong enough to outweigh Arthur's, then on what grounds do you aggregate them? Scanlon's Individualism Restriction says you can't sum complaints across persons. So, you're left with Arthur's heavy complaint versus… nothing. Ten million nothings. Mathematically, morally, it's absurd. You're letting one person hold the city hostage because the benefits to others are distributed too thinly.

  **Elena:** It's not about the math. It's about justification. To justify imposing this burden on Arthur, you need a reason that speaks to him. You can't say, "Arthur, we're hurting you because the sum of everyone else's tiny benefits is big." That treats the ten million people as a single super-person who experiences the sum of their benefits. But there is no super-person. There are ten million individuals, each of whom gains only thirty seconds.

  **Marcus:** But think about it ex ante. Behind a veil of ignorance. If you didn't know whether you were Arthur or Commuter #4,592,101, would you agree to the rule?

  **Elena:** Scanlon explicitly rejects the veil of ignorance as the foundation for contractualism. That's Harsanyi, that's Rawlsian idealization. This is about *What We Owe to Each Other* as actual people. If I am Arthur, I don't care about the ex ante probability. I care that I am being sacrificed. The veil of ignorance reduces morality to rational prudence—betting on outcomes. Contractualism is about mutual recognition. I cannot justify my action to Arthur by citing benefits others receive that he does not share in.

  **Marcus:** So mutual recognition requires letting the city lose millennia of life so Arthur can sleep slightly better? That's not recognition; that's isolation. You're saying the structure of justification forbids me from counting the commuters' interests collectively. But why? If I ignore the sum, I'm ignoring the fact that there are ten million people here. Their interests don't vanish because they aren't concentrated in one skull.

  **Elena:** Their interests don't vanish, but they don't combine to override a veto. Look at the structure of the complaint. For a principle to be rejected, someone must have a generic reason that is stronger than the generic reasons anyone has to uphold the principle. Each commuter has a generic reason: "I save thirty seconds." Arthur has a generic reason: "I suffer permanent health impairment." Compare the two reasons *individually*. Arthur's reason is weightier. The fact that there are many people with the lighter reason doesn't make the reason itself heavier. It just means there are more of them.

  **Marcus:** But that leads to the Paralysis Problem. Suppose the benefit isn't thirty seconds. Suppose it's thirty minutes. Or suppose it's saving one person from a broken leg per day, distributed across the ten million as time savings. At some point, you have to admit the aggregate matters. If you don't, you're saying the distribution trumps the outcome entirely.

  **Elena:** I'm saying the *separateness of persons* trumps the outcome. Utilitarianism acts as if society is a single entity experiencing pleasure and pain. It doesn't. There is only Arthur, and there is only Commuter #1. You cannot take a piece of Arthur's life to give slices of time to ten million others, because no single other person receives enough to justify taking that piece from Arthur. You're asking Arthur to accept a loss that no single beneficiary matches.

  **Marcus:** I'm asking Arthur to accept a loss that prevents a massive collective waste. Here's the kicker: If you stick to this, you have to admit that if we *didn't* have the machine, and we had the option to build it, you'd forbid it. But what if we frame it differently? What if the principle is: "Everyone accepts a 1-in-10-million risk of tinnitus to guarantee 30 seconds saved"?

  **Elena:** That's a different principle. And yes, that might be acceptable. But that's not the case. The case is identified victims. We know who Arthur is.

  **Marcus:** But why does identification matter morally? If the outcome is the same—one person suffers, millions benefit—why does pointing at Arthur change the calculus? You're letting the "identifiable victim effect" drive the theory.

  **Elena:** It's not psychology, Marcus. It's about standing. When Arthur stands before us, he demands a justification. "Why me?" If you say, "Because the sum of their gains outweighs your loss," you are telling him that he is merely a vessel for utility. You are saying his life is fungible with their time. Scanlon's point is that we owe each other more than that. We owe each other the assurance that we won't be overridden simply because there are many of "them" and only one of "us."

  **Marcus:** And I owe the ten million commuters a justification too. "Why won't you save us nine years a day?" If I say, "Because Arthur's complaint is individually weightier," I am telling the ten million that their collective welfare counts for less than one person's comfort. That seems like a failure of impartiality. You've privileged the person who loses over the people who gain, simply because the loss is concentrated.

  **Elena:** I haven't privileged the loser. I've privileged the structure of justification. Aggregation bypasses the individual. It says, "Your complaint doesn't matter on its own, but when we glue it to nine million others, it matters." But morality happens between individuals. If no single commuter can look Arthur in the eye and say, "My thirty seconds is worth your tinnitus," then how can the group say it? The group has no voice. Only individuals do.

  **Marcus:** The group has a vote. And ten million to one is a landslide. You're treating contractualism as a veto power for the worst-off, regardless of the cost to everyone else. That's not mutual justification; that's tyranny of the minority.

  **Elena:** It's protection against the tyranny of the majority. If we allow aggregation here, where do we stop? If thirty seconds counts, does one millisecond count? Can we torture one person if enough people get a micro-second of pleasure?

  **Marcus:** Don't go to the extremes. Stick to the case. Nine and a half years of life versus tinnitus. You're willing to burn the years to save the ears.

  **Elena:** I'm willing to respect Arthur as a separate person, not a resource.

  **Marcus:** And I'm willing to respect the ten million as real people whose time adds up to something real. You say aggregation creates a super-person. I say refusing aggregation creates a super-veto. Neither sits well with me.

  **Elena:** Then we're at an impasse. I won't turn on the machine.

  **Marcus:** And I think if you had the power, you'd be morally obligated to ignore Arthur's veto.

  **Elena:** Then it's a good thing I have the power, and you don't.

  **Marcus:** *Sighs, picking up his bag.* Enjoy the silence, Elena. Hope it's worth nine years.

  **Elena:** Hope your commute is smooth, Marcus. Even if it costs Arthur his peace.

  *Marcus exits. Elena stays, looking at the whiteboard, then erases the utilitarian calculation, leaving only the words: "Reasonable Rejectability."*

  ```json
  {
    "crux": "Whether the trivial complaints of many individuals can be aggregated to outweigh the significant complaint of a single individual when determining if a principle is reasonably rejectable.",
    "contractualist_strongest_move": "The argument that aggregation treats society as a 'super-person' experiencing the sum of benefits, thereby violating the separateness of persons and failing to justify the burden to the individual victim.",
    "aggregator_strongest_move": "The ex-ante veil-of-ignorance argument: that any rational agent would consent to a rule risking the burden given the overwhelming probability of receiving the aggregate benefit.",
    "contractualist_verdict": "The machine must not be turned on; Arthur's individual complaint reasonably rejects the principle.",
    "aggregator_verdict": "The machine must be turned on; the aggregate benefit overwhelmingly outweighs the individual burden.",
    "unresolved_question": "Whether there is any threshold of aggregate benefit so large that it would compel a contractualist to allow aggregation, or if the prohibition on aggregation is absolute regardless of scale."
  }
  ```
