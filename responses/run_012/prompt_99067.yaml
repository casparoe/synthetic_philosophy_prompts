      *   *Marcus:* But ex-ante, everyone prefers the lottery.
      *   *Elena:* We aren't betting. We are justifying to Arthur.
      *   *Marcus:* That's fetishizing the status quo.
      *   *Elena:* It's respecting the individual.

  6.  **Writing the Dialogue:** (Focusing on natural flow and philosophical precision).
      *   Make sure they interrupt or challenge each other.
