  2.  **Deconstruct the Philosophical Positions:**
      *   **Scanlonian Contractualism:** An act is wrong if it would be disallowed by principles that no one could reasonably reject. "Reasonably reject" is based on individual complaints. Aggregation of small benefits to many usually doesn't outweigh a significant burden to one because the many don't have a *individual* complaint strong enough to override the one's significant complaint. The "Individualism Restriction" (no aggregating across persons to outweigh a single person's burden).
      *   **Utilitarian/Aggregator:** Maximize overall well-being. Small benefits to many can sum to outweigh a large burden to one. Ex ante perspective (behind a veil of ignorance, everyone would agree to the rule because the chance of being the sufferer is low compared to the guaranteed benefit).
      *   **The Case:** 1 person vs. 10 million. Burden: Moderate tinnitus (permanent). Benefit: 30 seconds/day (commute).
