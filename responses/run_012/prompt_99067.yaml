prompt: |-
  Write a dialogue between two people who both know Scanlon's contractualism inside and out. One is a contractualist who thinks the theory's refusal to aggregate is a feature, not a bug; the other is a utilitarian-leaning aggregator who thinks that refusal is an absurdity. Set it around a made-up case so they can't just recite the Transmitter example — say, a city can switch on a machine that gives one specific resident a permanent, moderately bad case of tinnitus, and in exchange each of about ten million other people saves roughly thirty seconds a day on their commute. The aggregator thinks this is a no brainer; the contractualist thinks the tinnitus person's complaint is one that no principle licensing the machine could answer, and that ten million tiny benefits don't show up in anyone's personal complaint. Let them actually go at each other: the aggregator should press the "rejectable to whom, exactly?" line and the ex ante / veil-of-ignorance idea, and the contractualist should explain why Scanlon's view isn't a veil-of-ignorance view and why the aggregator's move quietly treats persons as one big super-person. Neither side should be a strawman, and they should respond to each other's actual points instead of talking past each other. Dont let it end with a tidy handshake.

  After the dialogue, give me a JSON object with these fields: "crux" (the one point where they genuinely disagree, a single sentence), "contractualist_strongest_move", "aggregator_strongest_move", "contractualist_verdict" (what the contractualist says should happen with the machine), "aggregator_verdict", and "unresolved_question".
