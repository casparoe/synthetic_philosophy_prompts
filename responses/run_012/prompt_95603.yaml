answer: |-
  # Material Constitution: The Decision Tree

  **Instructions for the TA:**
  Start the seminar by securing the **Root Intuition**. Do not let anyone deny it yet. Once agreed, move through the nodes. Students answer based on their gut reaction to the question, not based on where they think the "smart" answer lies. At the leaves, run the **Stress Tests** (Topiary & Ice) to see if the position holds.

  ---

  ### ROOT INTUITION
  **The Squash Scenario:** A sculptor makes a statue from a lump of clay. Later, she squashes the statue back into a shapeless lump.
  *   **Consensus:** The clay is still there. The statue is gone.

  ---

  ### NODE 1: The Nihilism Check
  **Question:** Before we talk about statues or lumps, do you believe there are any *composite objects* at all (things made of smaller parts), or is reality just fundamental particles arranged in certain ways?
  *   **No (Only particles exist):** $\rightarrow$ **LEAF A: Nihilism**
  *   **Yes (Composites exist):** $\rightarrow$ Go to Node 2.

  ---

  ### NODE 2: The Counting Question
  **Question:** At the moment *before* the squash (when the statue is finished), is the number of objects on the pedestal a fixed fact about the world, or does the answer depend on the vocabulary/sortal you use to count them?
  *   **Depends on vocabulary (e.g., "1 statue" vs "1 lump" are both correct counts):** $\rightarrow$ **LEAF B: Sortal-Relative Counting**
  *   **Fixed fact (There is a specific number, regardless of how we talk):** $\rightarrow$ Go to Node 3.

  ---

  ### NODE 3: The Co-location Question
  **Question:** Since the clay and the statue are in the exact same place with the exact same parts, can two *distinct* objects share every part and location at the same time?
  *   **No (One place, one object):** $\rightarrow$ Go to Node 4.
  *   **Yes (Two objects can overlap perfectly):** $\rightarrow$ Go to Node 5.

  ---

  ### NODE 4: The Origin Question (Topiary Test)
  **Question:** If there is only one object, did that object exist *before* the sculptor shaped it? (Think of the **Topiary Case**: The bush existed for years before it was trained into a shape. Was the *topiary object* there then, or just the plant?)
  *   **Yes (The object existed before shaping; the statue is just a phase):** $\rightarrow$ **LEAF C: Eliminativism (Clay Only / Phase Sortal)**
  *   **No (The object began when the shape began; the pre-shaped clay was a different object that ceased to exist):** $\rightarrow$ **LEAF D: Annihilation View**

  ---

  ### NODE 5: The Temporal Question (Ice Test)
  **Question:** If there are two objects, what makes them distinct? Is it because they have different lifespans? (Think of the **Ice Sculpture Case**: If it melts and refreezes accidentally, is it the same object? Does the statue have a different "time-shape" than the clay?)
  *   **Yes (They are different sums of temporal parts; they diverge in time):** $\rightarrow$ **LEAF E: Four-Dimensionalism**
  *   **No (They are both fully present at every moment; they just have different modal properties):** $\rightarrow$ **LEAF F: Coincidentalism (Constitution)**

  ---

  ## LEAF DIAGNOSES & STRESS TESTS

  ### LEAF A: Nihilism
  *   **Description:** There are no statues and no lumps. There are only simples (atoms/particles) arranged statue-wise or lump-wise.
  *   **Stress Test (Topiary):** Consistent. There is no "plant" object, only particles arranged plant-wise.
  *   **Stress Test (Ice):** Consistent. Particles scatter (melt) and reassemble (freeze). No identity persists through the gap.
  *   **TA Note:** This view rejects the Root Intuition's ontology (there is no "clay" object to survive), though it accepts the intuition about the matter.

  ### LEAF B: Sortal-Relative Counting
  *   **Description:** The question "How many things?" is incomplete. There is one thing *under the sortal 'lump'* and one thing *under the sortal 'statue'*, and there is no absolute fact about whether they are identical.
  *   **Stress Test (Topiary):** "Is it the same plant?" Yes, relative to 'plant'. "Is it the same topiary?" No, relative to 'topiary'.
  *   **Stress Test (Ice):** "Is it the same ice?" Relative to 'mass of ice', yes. Relative to 'sculpture', no.
  *   **⚠️ COLLAPSE WARNING:** This view is notoriously difficult to distinguish from **LEAF C (Eliminativism/One-Thing-Two-Sortals)**. If a student says "It's one thing that falls under two sortals," they may functionally occupy this leaf. The tree cannot separate "Relative Counting" from "Constitution as Identity" without deeper modal logic.

  ### LEAF C: Eliminativism (Clay Only / Phase Sortal)
  *   **Description:** Only the clay is a real substance. The "statue" is merely a temporary phase or description of the clay, like "adolescence" is a phase of a human.
  *   **Stress Test (Topiary):** The Plant is the substance. The Topiary is a phase. If you clip it into a new shape, the Topiary dies, the Plant survives. (Handles the organic case well).
  *   **Stress Test (Ice):** The Water/Ice mass is the substance. The Sculpture is a phase. If it melts and refreezes accidentally, the *mass* survives, but the *sculpture* does not (since the phase was interrupted).
  *   **TA Note:** This is the most common "common sense" view.

  ### LEAF D: Annihilation View
  *   **Description:** The Statue is the primary substance. When the sculptor began, the "Lump" object ceased to exist (was annihilated) and was replaced by the Statue. When squashed, the Statue dies and a *new* Lump object comes into being.
  *   **Stress Test (Topiary):** The Topiary is the substance. The unshaped Bush was a different object that ceased to exist when training began. (Counter-intuitive for organisms).
  *   **Stress Test (Ice):** The Sculpture is the substance. When it melts, it is annihilated. If it refreezes, it is a *new* sculpture, even if identical.
  *   **⚠️ EMPTY COMBINATION:** It is rare to find this view combined with the Root Intuition that "the clay is still there." Students usually mean the *matter* survives, not the *Lump object*. Ensure they distinguish matter from object.

  ### LEAF E: Four-Dimensionalism
  *   **Description:** Objects are "space-time worms." The Statue and the Lump are different because they have different temporal parts. They coincide now, but diverge in the future (squash) or past (creation).
  *   **Stress Test (Topiary):** The Plant-worm and Topiary-worm share a temporal segment but have different beginnings/ends.
  *   **Stress Test (Ice):** **Crucial Test.** If the ice melts and refreezes, the 4D object is *intermittent*. Some 4Dists say the object stops and starts (gappy existence). Others say the "Statue-worm" ends at melt, and a new one begins at freeze. This node forces a choice on intermittent existence.
  *   **TA Note:** This is the only view that naturally handles the Ice Case as a matter of "temporal mereology."

  ### LEAF F: Coincidentalism (Constitution)
  *   **Description:** Two distinct, fully 3D objects occupy the same space. They are not identical because they have different essential properties (one essentially statue-shaped, the other not).
  *   **Stress Test (Topiary):** The Plant and the Topiary are two coinciding objects. This is often viewed as implausible for living things (too many minds/organisms in one place).
  *   **Stress Test (Ice):** The Ice Mass and the Sculpture coincide. When it melts, the Sculpture goes out of existence. If it refreezes, a *new* Sculpture coincides with the Ice Mass.
  *   **⚠️ EMPTY COMBINATION:** **Node 3 (Yes) + Node 5 (No).** It is virtually impossible to occupy the "Two Objects" view while denying that they differ temporally. If they share all spatial parts and all temporal parts, they are indiscernible. Ensure students who land here accept the temporal divergence.

  ---

  ## TA DIAGNOSTIC KEY

  **1. The Indistinguishable Pair (Leaf B vs. Leaf C)**
  *   **The Problem:** A student who says "There is only one thing, but we count it differently depending on our interests" (Leaf B) is functionally doing the same work as "There is one thing, and 'statue' is just a phase name" (Leaf C).
  *   **The Diagnosis:** If a student lands on **Leaf B**, ask: "Is the difference in counting grounded in the world's structure, or in our language?" If they say "Language/Interests," push them toward **Leaf C**. If they say "The world has different structures for different sortals," keep them at **Leaf B**. Be honest that this boundary is metaphysically porous.

  **2. The Unoccupied Quadrant (Node 3 Yes + Node 5 No)**
  *   **The Problem:** Claiming two objects exist (Node 3) but denying they differ in temporal parts (Node 5) leads to "Brute Coincidence." Most philosophers reject this as magical.
  *   **The Diagnosis:** If a student tries to stay here, ask: "If they share every part in space and time, what makes them two?" If they cannot answer without citing modal properties (which 4Dism handles via temporal parts), they should move to **Leaf E**.

  **3. The Topiary Trap (Leaf D & F)**
  *   **The Problem:** Views that posit two objects (Leaf F) or prioritize the Artifact over the Organism (Leaf D) struggle with the Topiary.
  *   **The Diagnosis:** Ask: "When the bush grows, do two things grow?" If they say yes, they accept coinciding organisms (Leaf F). If they say the Bush died when shaped, they accept Annihilation (Leaf D). Both are high-cost positions for biological cases. Use this to test their commitment.

  **4. The Ice Gap (Leaf E)**
  *   **The Problem:** 4Dism handles the Ice Case best, but only if they accept "gappy existence."
  *   **The Diagnosis:** Ask: "When the ice is water, where is the sculpture?" If they say "It doesn't exist then," they accept gaps. If they say "It exists as water," they collapse into Leaf C (Phase Sortal). This node separates the Perdurantists from the Phase Theorists.
