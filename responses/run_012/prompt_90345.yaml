      *Decision:* The most robust existing framework is **Indexicality** (Semiotics) combined with **Riegl's Age-Value/Historical Value** (Conservation) and **Benjamin's Aura** (Critical Theory), but the specific dynamic is best described as **Relic Value** secularized.
      However, the user asks if they need to invent a name.
