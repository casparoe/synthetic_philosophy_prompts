answer: |-
  You have identified a precise and potent tension that sits at the intersection of semiotics, art history, and economics. While there is no single, universally agreed-upon term that captures exactly this two-way dynamic, the pattern you are circling is a recognized phenomenon discussed under a few different frameworks.

  The most accurate existing concept is **Indexical Value** (rooted in C.S. Peirce's semiotics), often culturally operationalized as **Relic Value**. However, to answer your specific question about the "two directions," it is helpful to frame this as **Witness Value**.

  Here is how the boundaries fall, how it distinguishes itself from its neighbors, and how to handle the intermediate cases.

  ### 1. The Core Mechanism: Indexicality
  To understand why the value moves in two directions, we must first identify what the object *is*. In semiotics, a sign that is physically connected to its object (a footprint, a photograph, a death mask) is an **Index**.
  *   **Symbol:** Arbitrary connection (the word "cat").
  *   **Icon:** Resemblance (a drawing of a cat).
  *   **Index:** Causal connection (a hair from the cat).

  The value you are describing is **Indexical Value**. It is not value derived from beauty (aesthetic), utility (functional), or even simple rarity (scarcity). It is value derived from the object's status as a **physical effect of a specific cause**.

  ### 2. Reconciling the Two Directions
  You asked if the rise (demolition) and the fall (forgery) are the same value moving in opposite directions. **Yes, they are.** They are two variables acting upon the same equation.

  The value is a function of **Access to an Unavailable Origin**.
  *   **Variable A: Integrity of the Link.** (Is the causal chain real?)
  *   **Variable B: Scarcity of the Referent.** (Is the origin accessible by other means?)

  **Direction 1 (The Demolition):**
  When the building is demolished, Variable B shifts. The origin becomes *totally* unavailable. The photograph shifts from being *a* reference to being the *only* access point. The Index becomes the surrogate for the reality. The value rises because the **Witness** becomes the sole survivor.

  **Direction 2 (The Forgery):**
  When the painting is exposed as a fake, Variable A collapses. The causal chain is severed. The object is no longer an index of the master's hand; it is merely an icon of it. The **Witness** is discredited. The value collapses because the access was illusory.

  Both phenomena rely on the **Truth Claim of the Trace**. The value exists only in the tension between "This touched that" (Integrity) and "That is gone" (Absence).

  ### 3. Distinguishing from Neighbors
  You mentioned Aura, Authenticity, Relic Value, and Scarcity. Here is how your pattern divides from them:

  *   **Vs. Aura (Walter Benjamin):**
      *   *Aura* is the "unique phenomenon of a distance, however close it may be." It is an atmospheric quality inherent to the object's presence in time and space.
      *   *Your Pattern:* Is structural, not atmospheric. A blurry, ugly photo of a demolished building has high Indexical Value but low Aura. Aura decays with reproduction; Indexical Value can *increase* with reproduction if the original is lost (e.g., widely circulated photos of a destroyed landmark become historically vital).
  *   **Vs. Authenticity:**
      *   *Authenticity* is often treated as a binary (Real/Fake).
      *   *Your Pattern:* Explains *why* authenticity matters. Authenticity matters specifically because we are seeking Indexical Value. If we only cared about Iconic Value (what it looks like), a perfect forgery would retain its worth. It doesn't, because the Index is broken.
  *   **Vs. Ordinary Scarcity:**
      *   *Scarcity* is about the supply of the object itself (e.g., only 5 prints exist).
      *   *Your Pattern:* Is about the supply of the *Referent*. The object supply hasn't changed (there is still 1 photo), but the referent supply has dropped to zero. This is **Referential Scarcity**, not Object Scarcity.
  *   **Vs. Relic Value:**
      *   This is your closest neighbor. In fact, your pattern is essentially **Secularized Relic Value**. A bone of a saint is valuable because it touched the saint (Index) and the saint is in heaven/gone (Absence). If the bone is fake (Forgery), value drops. If the saint's other relics are destroyed, this bone's value rises. You have identified that this logic applies to photographs and letters just as it does to holy bones.

  ### 4. The Intermediate Cases
  If we accept **Indexical Value** as the framework, we can map your intermediate cases by the strength of the physical connection (the index):

  *   **A cast taken from the original mould:**
      *   *Index Strength:* High. Physical contact occurred.
      *   *Value:* High, but slightly lower than the original sculpture because the mould allows for multiples (diluting the "sole witness" status). It is a **Secondary Index**.
  *   **A freehand copy:**
      *   *Index Strength:* Low/None. It is an Icon (resemblance), not an Index (causal trace).
      *   *Value:* Derives from the skill of the copyist, not the trace of the original. If passed off as the original, it is a forgery (Value collapses when exposed). If known as a copy, it holds **Historical Value** (evidence of the original's appearance) but low **Indexical Value**.
  *   **A forgery of a work that never existed:**
      *   *Index Strength:* Zero. There is no origin to trace.
      *   *Value:* Purely aesthetic or deceptive. Once the deception is known, it has no Indexical Value because there is no "lost origin" to mourn. It is a trace of nothing.
  *   **A photograph of a photograph:**
      *   *Index Strength:* Degraded. It is an index of a print, which is an index of light, which is an index of the building.
      *   *Value:* Depends on the status of the *first* photograph. If the first negative is lost, the copy becomes the primary Index. This is the concept of the **Surrogate Original**.

  ### 5. Proposed Terminology
  If you need a label for this specific dynamic, **"Indexical Value"** is the rigorous philosophical term. However, it can feel dry.

  If you wish to coin a term that captures the emotional and economic movement you described, I suggest **"Witness Value."**

  *   **Why Witness?** A witness is valuable because they were *there* (Integrity) and because they can tell us about something we *cannot see* (Absence).
  *   **The Two Directions:**
      1.  **Sole Witness:** Everyone else dies (building demolished); the witness becomes invaluable.
      2.  **Perjured Witness:** It is revealed they weren't there (forgery); the witness becomes worthless.

  ### Summary
  You do not need to invent the concept, but you may need to refine the label. You are describing the economic and affective modulation of **Indexicality**.

  It is distinct from **Aura** (which is about presence) because it is about **absence**.
  It is distinct from **Scarcity** (which is about the object) because it is about the **referent**.
  It is **Relic Value** applied to the secular archive.

  The two directions are reconciled by understanding that the value is not in the object, but in the **bridge**.
  *   Demolition burns the other side of the bridge, making this side the only crossing (Value Up).
  *   Forgery reveals the bridge is broken, making crossing impossible (Value Down).

  If you require a term for your writing, **"Tracial Value"** or **"Witness Value"** will serve you best, provided you define it as *value contingent on the integrity of a causal link to an inaccessible origin.*
