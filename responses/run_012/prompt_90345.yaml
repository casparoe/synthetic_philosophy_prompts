prompt: |-
  I have been circling a pattern for some time and cannot tell whether it already has a name or whether I need to invent one.

  The pattern is a kind of value that attaches to a thing because of what it is a trace of, and it moves in two directions I cannot reconcile. It rises when the thing traced disappears: a photograph of a building since demolished, a plaster cast of a sculpture since destroyed, a letter in the hand of someone now dead. Nothing about these objects changed, and the value was never located in their perceptible qualities to begin with, yet as the thing they point back to becomes unavailable the value goes up. But it collapses when the relation itself is shown not to hold: a painting loses most of its worth the moment it is exposed as a forgery rather than the work of the hand it was credited to, and here nothing in the world changed at all, only what is known about the object's history.

  Both changes look external to the object, and both look like the same value being moved, which is what I cannot sort out. Is there an established concept for value of this kind, and how does it divide from the neighbours I know of — aura, authenticity, relic value, ordinary scarcity? Is the first phenomenon the same as the second, or are they two different things sharing a surface? And where do the intermediate cases fall — a cast taken from the original mould, a freehand copy, a forgery of a work that never existed, a photograph of a photograph? If no concept exists I would happily take a coined term, but I care more about where the boundaries fall than about the label.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Phenomenon:** A specific type of value attached to an object based on its status as a *trace* of something else.
      *   **Direction 1 (Appreciation):** Value *increases* when the original source disappears (e.g., photo of a demolished building, letter from a dead person). The object remains physically unchanged.
      *   **Direction 2 (Depreciation):** Value *collapses* when the trace relationship is proven false (e.g., forgery exposed). The object remains physically unchanged.
      *   **The Problem:** The user sees these as two directions of the *same* value but can't reconcile them. They want to know if there's an established concept, how it differs from neighbors (aura, authenticity, relic value, scarcity), and how to handle intermediate cases (casts, copies, etc.).
      *   **Goal:** Identify existing philosophical/art historical concepts, distinguish them, and if necessary, propose a framework or term to clarify the boundaries.

  2.  **Initial Brainstorming & Concept Mapping:**
      *   *Walter Benjamin:* "The Work of Art in the Age of Mechanical Reproduction." Key concept: **Aura**. This is the obvious first stop. Aura decays with reproduction but is tied to presence in time and space.
      *   *Authenticity:* Often tied to authorship. A forgery lacks authenticity.
      *   *Indexicality:* Peirce's semiotics. A photograph or footprint is an *index* (physical connection). A forgery breaks the indexical link.
      *   *Relic Value:* Religious/historical context. Bone of a saint. Value comes from contact.
      *   *Scarcity:* Economic term. Demolition creates scarcity, but the user says value isn't in perceptible qualities.
      *   *Provenance:* The history of ownership/creation.
      *   *Hauntology:* Derrida. The trace of what is no longer there.
      *   *Viktor Shklovsky:* Defamiliarization? No.
      *   *Alois Riegl:* "Age Value" vs. "Historical Value". This is a strong candidate from conservation theory.
      *   *Walter Benjamin (again):* "Cult Value" vs. "Exhibition Value".

  3.  **Deconstructing the Two Directions:**
      *   *Direction 1 (Source Disappears -> Value Up):* This is about *uniqueness of the trace* due to the loss of the referent. The object becomes the *only* access point. It's about **Survival** and **Witness**.
      *   *Direction 2 (Link Broken -> Value Down):* This is about **Lineage** and **Origin**. The physical object is the same, but the *narrative* connecting it to the genius/event is severed.

      *Are they the same value?*
      *   Hypothesis: They are two sides of **Indexical Value** (or **Tracial Value**).
      *   Side A: The strength of the index (the causal link). If the link is fake, value = 0.
      *   Side B: The scarcity of the index relative to the referent. If the referent is gone, the index is the *only* remaining evidence, increasing its weight.

  4.  **Evaluating Existing Concepts:**

      *   **Aura (Benjamin):** Close, but Aura is about "presence in time and space." A forgery can have an aura of its own age, but it lacks the *authority* of the original. Aura doesn't fully explain the *increase* when the building is demolished (a photo of a building doesn't necessarily gain "aura" just because the building is gone, though it gains historical importance).
      *   **Authenticity:** Good for Direction 2 (forgery). Less good for Direction 1 (the photo is authentic, the building is gone).
      *   **Relic Value:** Very close. A relic is valuable because it touched the saint. If the saint is forgotten (link broken), value drops. If the saint's body is destroyed but the relic remains, value might rise.
      *   **Alois Riegl's "Age-Value" (Alterswert):** This is crucial. Riegl distinguishes between "Historical Value" (what we know about it) and "Age-Value" (signs of passing time). But there's also **"Intentional Commemorative Value."**
      *   **Indexicality (Peirce):** This is the semiotic backbone. The object is an *index*.
          *   Case 1: Index remains, Referent destroyed -> Index becomes the *substitute* reality.
          *   Case 2: Index remains, Causal Link disproven -> Index becomes a *fake* sign.

  5.  **Synthesizing a Framework:**
      The user is describing **Indexical Value** (or **Tracial Value**), but specifically the tension between **Ontological Scarcity** (the referent is gone) and **Genealogical Integrity** (the link is broken).

