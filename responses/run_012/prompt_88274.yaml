      *   Address the redundancy question.
      *   Address the concession mistake.

      *Let's refine the "Unilateral" point.* If I can secure a Pareto improvement unilaterally, it implies the default state was inefficient in a way that *I* could fix alone. That's rare (usually implies a dominant strategy existed that wasn't taken). SPI usually implies *conditional* unilateralism (I change my strategy space, which induces you to change yours). So the friend is slightly off on "unilateral." It's "unilateral commitment to a conditional strategy."

      *Let's refine the "VoI" point.* VoI is about *selecting* the SPI. There are many Pareto improvements. Which one is "Safe"? The one you'd pick behind a veil. So VoI *does* work to select among Pareto improvements.

