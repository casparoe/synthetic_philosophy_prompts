      *   Need to mention Kahneman on Experienced vs. Decision Utility.
      *   Need to be careful about "Utility is real." In RP, it's a theoretical construct, not necessarily a mental state.
      *   *Self-Correction on Interpersonal Comparison:* The user says their friends "rank policies." They might be using Cost-Benefit Analysis (Kaldor-Hicks) which *pretends* to compare, or they are using a Social Welfare Function with explicit weights. I need to clarify that standard RP *itself* does not permit this.

