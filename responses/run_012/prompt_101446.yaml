      *   *Section 2: Positive Account.* Define Utility as an ordering relation represented by a function. Emphasize the "As If" methodology (Friedman). Distinguish Decision vs. Experienced Utility.
      *   *Section 3: Addressing the Consequences.*
          *   Akrasia: Time inconsistency/Multiple selves.
          *   Paternalism: Choice $\neq$ Welfare.
          *   Interpersonal Comparison: Ordinality constraint.
      *   *Section 4: The Empirical Anomalies.* Choice reversals violate axioms. This motivates Behavioral Econ, not a return to psychological utility.
      *   *Conclusion:* Summarize. The puzzle dissolves when we stop treating RP as a complete theory of human psychology and welfare.

  6.  **Refining the Philosophy:**
      *   Need to mention Samuelson (1938) for the behaviorist origin.
