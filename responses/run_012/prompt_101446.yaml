answer: |-
  This is an exceptionally well-posed question. You have identified the exact fault lines where standard microeconomic theory fractures under philosophical scrutiny. Your discomfort is not a sign of misunderstanding; rather, it suggests you have grasped the implications of the theory more rigorously than many practitioners who employ it casually.

  However, your puzzle relies on conflating three distinct layers of economic discourse: the **axiomatic foundation** (revealed preference theory proper), the **psychological interpretation** (what is happening in the mind), and the **welfare judgment** (what is good for the agent).

  Per your request, I will begin by diagnosing which parts of your framing are faithful to revealed-preference (RP) theory and which are extraneous imports. Then I will provide a positive account of utility in this tradition, and finally, I will show how that account dissolves your three specific worries.

  ### Part I: Diagnostic of Your Framing

  You have assembled a cluster of claims that are often spoken together in hallway conversations but are logically distinct. Here is the breakdown of what is and is not part of standard revealed-preference theory.

  **1. The Ontological Claim: "Utility just consists in the fact that a person chose it."**
  *   **Verdict:** *Technically correct within strict behaviorism, but often overstated in modern practice.*
  *   **Analysis:** In Paul Samuelson's original 1938 formulation, this was indeed the point: to purge economics of "psychological utility" (hedons, satisfaction) and replace it with observable operations. If you choose $A$ over $B$, you reveal a preference for $A$. To say "I prefer $A$ but chose $B$" is, in strict RP terms, meaningless. However, modern decision theory (following Savage, 1954) often treats utility as a **representation theorem**. It says: *If* your choices satisfy certain axioms (transitivity, completeness, etc.), *then* we can represent those choices "as if" you were maximizing a utility function. This is a formal result, not necessarily an ontological claim that the utility function exists as a mental substance.
  *   **Correction:** You are right that RP treats choice as the *data* and preference as the *construction*. But many economists treat this as an "as if" modeling tool, not a metaphysical truth about the mind.

  **2. The Welfare Claim: "A person's welfare is simply whatever she picks."**
  *   **Verdict:** *False. This is not part of revealed-preference theory.*
  *   **Analysis:** This is the most critical error in your framing. Standard RP theory defines **decision utility** (the ordering that explains the choice). It explicitly remains agnostic about **experienced utility** or **welfare** (how well-off the choice makes the person). Amartya Sen has spent decades critiquing the "identification of choice with welfare." While policy economists often *assume* consumer sovereignty for convenience, the formal theory of revealed preference does not entail that a chosen option maximizes the agent's well-being. It only entails that the option ranks highest in the ordering that generated the choice.
  *   **Correction:** You have smuggled in a normative premise (Choice $\rightarrow$ Good) that the positive theory does not support.

  **3. The Aggregation Claim: "We could compare it across persons and add it up."**
  *   **Verdict:** *False. This is technically impossible within standard RP theory.*
  *   **Analysis:** In ordinal revealed preference theory, utility functions are unique only up to a positive monotonic transformation. In von Neumann-Morgenstern (expected utility) theory, they are unique up to a positive affine transformation. In neither case is the zero point or the unit size fixed across individuals. Therefore, adding Person A's utility to Person B's is mathematically meaningless, like adding meters to seconds.
  *   **Correction:** When your friends in the reading group "add up" utilities to rank policies, they are either (a) engaging in a informal heuristic that violates formal theory, (b) using a Cost-Benefit Analysis based on willingness-to-pay (which relies on income weights, not pure utility), or (c) implicitly adopting a specific Social Welfare Function that imposes ethical weights. They are not doing this because RP theory allows it; they are doing it *despite* RP theory forbidding it.

  ### Part II: A Positive Account of Utility in the RP Tradition

  Having cleared the debris, let us construct what utility *is* in this framework.

  **1. What Utility Is:**
  Utility is a numerical representation of a binary relation (preference) over a set of options. It is a mapping $U: X \rightarrow \mathbb{R}$ such that $x \succeq y \iff U(x) \geq U(y)$. Its primary existence is **relational**, not substantive. It tells us about the *structure* of the agent's choices (e.g., are they transitive?), not the *content* of their mental states.

  **2. What Utility Is Not:**
  *   It is not a psychological feeling (like pleasure or pain).
  *   It is not a measure of moral worth or objective well-being.
  *   It is not a cardinal quantity that can be summed across agents.

  **3. What Work It Does:**
  *   **Parsimony:** It compresses complex behavioral data into a manageable function.
  *   **Prediction:** If the axioms hold, we can predict how choices will change when constraints (prices, income) change.
  *   **Consistency Check:** It allows us to test if an agent is behaving consistently (e.g., via the Generalized Axiom of Revealed Preference, or GARP).

  **4. What Work It Does Not Do:**
  *   It does not explain *why* the preference exists (psychology).
  *   It does not validate the preference as "good" for the agent (welfare).
  *   It does not permit interpersonal arithmetic (aggregation).

  ### Part III: Addressing Your Three Consequences

  Now we can address your three worries using this corrected account.

  #### 1. Weakness of Will (Akrasia) and Addiction
  *Your Worry:* If choice = preference, then choosing to smoke means you prefer to smoke. Therefore, you cannot "want to quit" but smoke anyway. Akrasia is impossible.
  *The Resolution:* This worry assumes a **single, time-invariant self**.
  Revealed preference theory can accommodate weakness of will by modeling the agent as a sequence of temporal selves or by allowing for **dynamic inconsistency**.
  *   **Time Inconsistency:** In standard discounted utility models, preferences are consistent over time. However, models of hyperbolic discounting (Strotz, 1955; Ainslie, 1975) show that an agent at $t_1$ prefers (Quit, Smoke later) but at $t_2$ prefers (Smoke now). RP theory handles this by indexing preferences to time: $U_{t1} \neq U_{t2}$. The agent at $t_2$ reveals a preference for smoking *at $t_2$*. This does not contradict the agent at $t_1$'s revealed preference for quitting.
  *   **Multiple Selves:** Thaler and Shefrin (1981) model this as a game between a "Planner" and a "Doer." When the Doer chooses the cigarette, they reveal the Doer's preference. When the Planner buys a nicotine patch, they reveal the Planner's preference.
  *   **Diagnosis of Error:** You assumed RP requires a *single, unified preference ordering* that persists across time. It does not. It only requires consistency *within* a specific choice context. Addiction is modeled as a conflict between these contexts or selves, not a logical contradiction in a single choice act.

  #### 2. Paternalism and Welfare
  *Your Worry:* If utility is just choice, then choosing badly is impossible. Paternalism is conceptually confused.
  *The Resolution:* This relies on the **False Presupposition** identified in the Diagnosis: that *Decision Utility = Welfare*.
  *   **Decision vs. Experienced Utility:** Daniel Kahneman (1994) explicitly distinguished these. Decision utility is what predicts choice. Experienced utility is the actual quality of the outcome (pleasure, pain, health). RP theory measures the former. It makes no claim that the former maximizes the latter.
  *   **Mistakes are Possible:** Modern behavioral welfare economics (e.g., Bernheim & Rangel, 2009) acknowledges that choices can be "mistakes" due to framing, lack of attention, or cognitive bias. If a person chooses $A$ over $B$ only because $A$ was placed at eye level, RP theory records the preference for $A$. But a policy analyst can legitimately argue that $B$ yields higher *welfare* without violating RP theory, provided they admit they are importing a welfare metric *external* to the choice data (e.g., health outcomes, or "clean" preferences under idealized conditions).
  *   **Diagnosis of Error:** You assumed that because economists *use* choice data to proxy for welfare, the *theory* equates them. It is a pragmatic shortcut, not a theoretical identity. Paternalism is conceptually coherent if you define welfare independently of immediate choice (e.g., as "informed, reflective preference").

  #### 3. Interpersonal Comparison and Aggregation
  *Your Worry:* If utility is real, we should be able to add it up to rank policies.
  *The Resolution:* This is a **Category Error** regarding the mathematical status of utility.
  *   **Ordinality:** As noted, standard RP utility is ordinal. If $U(x) = 10$ and $U(y) = 5$, all that means is $x \succ y$. I could transform this to $U'(x) = 100$ and $U'(y) = 1$. The sum changes, but the preference does not. Therefore, the sum contains no information.
  *   **Policy Ranking:** When your friends rank policies by "summing utility," they are implicitly using **Kaldor-Hicks efficiency** (willingness to pay) or a specific **Social Welfare Function** (e.g., Utilitarian with fixed weights). This requires strong ethical assumptions (e.g., "a dollar is worth the same utility to a rich person as a poor person") that are *not* derived from revealed preference theory.
  *   **Diagnosis of Error:** You assumed that because policy analysts perform arithmetic on utility numbers, the *theory* validates that arithmetic. It does not. That is a normative ethical overlay, not a consequence of RP theory.

  ### Part IV: The Choice Reversals (The Attraction Effect)

  You mentioned your friend reverses choices when an inferior option is added.
  *   **The Phenomenon:** This violates the **Independence of Irrelevant Alternatives (IIA)** axiom, which is central to standard RP theory.
  *   **The Implication:** This does not mean "utility is psychological." It means the **standard RP model is empirically insufficient** for that context.
  *   **The Response:** Decision theorists do not ignore this. They develop new models (e.g., context-dependent preferences, salience theory) that modify the axioms. In these new models, utility is still a representation of choice, but the *arguments* of the utility function now include the *choice set* itself, not just the properties of the options.
  *   **Consistency:** This preserves the RP approach (utility represents choice) while abandoning the specific axioms of the 1950s. It acknowledges that the "preference" is not a fixed property of the mind, but a constructed response to a context.

  ### Summary of Corrections

  To answer your final question directly: **The revealed-preference framework accommodates addiction and self-control not by changing the definition of utility, but by expanding the model of the agent.**

  1.  **False Presupposition 1:** *RP claims Choice = Welfare.*
      *   **Correction:** RP claims Choice $\rightarrow$ Decision Preference. Welfare requires an additional normative bridge.
  2.  **False Presupposition 2:** *RP allows Interpersonal Comparison.*
      *   **Correction:** RP utility is ordinal/affine; summation is mathematically invalid without ethical weighting.
  3.  **False Presupposition 3:** *RP requires a single, time-invariant self.*
      *   **Correction:** RP can model dynamic inconsistency and multiple selves to account for akrasia.

  Your puzzle dissolves when you stop treating Revealed Preference as a complete theory of human psychology and morality. It is a **syntax for behavior**. It tells you if the behavior is consistent. It does not tell you if the behavior is wise, healthy, or comparable to your neighbor's. When economists talk as if it does, they are speaking loosely, not theoretically. As a policy scholar, you are justified in demanding they make their welfare assumptions explicit rather than hiding them behind the veil of "revealed utility."
