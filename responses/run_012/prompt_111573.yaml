answer: |-
  ### 1. The Correspondence Table

  Your colleague's thesis rests on a structural isomorphism between contract law and moral promising. Below is the mapping required to sustain that thesis, aligning the legal doctrines with their purported moral equivalents.

  | Contract Doctrine | Colleague's Moral Equivalent | Structural Function |
  | :--- | :--- | :--- |
  | **Offer & Acceptance** | **Communication & Assurance** | One party signals intent; the other accepts the assurance, creating a meeting of minds. |
  | **Consideration** | **Reliance or Benefit** | The "price" of the promise. In contract, it's bargained-for exchange; in promise, it is the promisee's reliance or the benefit conferred. |
  | **Breach** | **Non-Performance** | Failure to do what was committed to when the time arrives. |
  | **Remedy (Damages)** | **Apology & Compensation** | The default cure for breach. Making the promisee whole through apology or material compensation rather than forced performance. |
  | **Defenses (Duress, Mistake)** | **Coercion & Misunderstanding** | Excuses that vitiate the commitment. If coerced or based on false facts, the obligation dissolves. |
  | **Impossibility** | **Inability** | "Ought implies can." If performance becomes physically impossible, the obligation is discharged. |
  | **Pre-existing Duty** | **Prior Obligation** | Promising to do what one is already morally bound to do adds no new moral weight (parallel to no new consideration). |
  | **Promissory Estoppel** | **Detrimental Reliance** | The primary source of bindingness. If reliance occurs, the promise becomes binding to prevent harm. |
  | **Specific Performance** | **Moral Duty to Perform** | An exceptional remedy in law; in ethics, this is either the only true remedy or indistinguishable from damages (per colleague's 2nd conclusion). |

  ### 2. Where the Mapping Breaks

  The analogy holds only so long as one ignores the *source* of the obligation and the *nature* of the remedy. The breaks divide into incidental discrepancies and structural failures.

  **Incidental Breaks (Do not affect the conclusions):**
  *   **Formalities:** Contracts often require writing (Statute of Frauds); promises do not. This is procedural, not normative.
  *   **Jurisdiction:** Contracts are bound by geography; promises follow the agents. This affects enforcement, not bindingness.
  *   **Limitation Periods:** Legal claims expire; moral debts arguably do not. This is a matter of administrative closure, not the nature of the duty.

  **Critical Breaks (Undermine the conclusions):**
  *   **Consideration vs. Gratuitousness:** Contract law generally refuses to enforce gratuitous promises (gifts) absent reliance. Moral promising, however, binds most strongly when gratuitous. If I promise to visit you out of kindness, and you do not rely on it (you had no other plans), I am still morally bound. The colleague's model requires "consideration" (reliance) to generate obligation; moral intuition suggests the *act of promising* generates the obligation.
  *   **Substitutional vs. Specific Remedy:** In contract, damages are often an *alternative* to performance (efficient breach). In promising, compensation is a *supplement* to the breach, not a substitute for the duty. Paying you for the dinner I missed does not fulfill the promise to dine with you. The colleague's map treats damages as a discharge of duty; morality treats them as an acknowledgment of failed duty.
  *   **The Identity of the Parties:** Contract assumes distinct, self-interested entities. Promising often occurs within relationships where interests are shared. The "arm's length" assumption distorts the nature of the commitment.

  ### 3. Imports and Omissions

  The analogy is not neutral; it smuggles in assumptions from the legal domain while leaving out essential features of the moral domain.

  **What the Analogy Imports (Contract → Promise):**
  *   **The Third-Party Enforcer:** Even if the "court" is conscience, the model assumes an adjudicative stance (judging past actions) rather than a constitutive one (shaping future character).
  *   **Substitutability:** It assumes the *value* of the promise is separable from the *act* of the promise. This imports market logic where the object promised is interchangeable with its cash equivalent.
  *   **Strangers at Arm's Length:** It conceives the parties as adversaries whose interests must be balanced via liability, rather than partners in a shared practice of trust.
  *   **Externalization:** It locates the wrong in the *consequence* (harm to promisee) rather than the *act* (violation of integrity).

  **What the Analogy Omits (Promise → Contract):**
  *   **Promises to Oneself:** Contracts require two parties. We make promises to ourselves (resolutions) that feel binding. The contract model cannot account for this without metaphorical stretching.
  *   **Promises to the Dead:** We feel bound by promises to deceased persons who cannot rely on us, sue us, or be compensated. The contract model renders these void for lack of a plaintiff.
  *   **The Duty to Perform:** The model obscures the specific moral requirement to *do the thing*. In contract, the primary duty is often to perform *or* pay. In promising, the primary duty is to perform; payment is only relevant after failure.
  *   **Integrity of the Promisor:** The model ignores the harm done to the *promisor*. Breaking a promise degrades the promisor's integrity, regardless of the promisee's loss.

  ### 4. Verdict on the Conclusions

  **Conclusion 1: "The wrong of breaking a promise is entirely a wrong done to the promisee... a promise no one has relied upon... is only nominally binding."**
  *   **Verdict: False.**
  *   **Reasoning:** This conclusion collapses once the "Promises to the Dead" and "Gratuitous Promises" omissions are acknowledged. If I promise a dying friend to care for their cat, and the cat dies naturally the next day (no reliance, no loss), I may be released from the *action*, but if I simply neglect the promise without cause, I have committed a moral wrong. More sharply: if I promise to meet you for coffee, and you independently decide to stay home anyway (no reliance), I am still wrong to simply not show up without notice. The bindingness arises from the invitation to trust, not the reliance itself. The wrong is not just to the promisee's expectations, but to the practice of trust and the promisor's own integrity.

  **Conclusion 2: "There is no deep difference between keeping a promise and compensating the person to whom it was made."**
  *   **Verdict: False.**
  *   **Reasoning:** This conclusion fails on the "Substitutional Remedy" break. Contract law permits efficient breach because it values economic efficiency over specific performance. Ethics values fidelity. If I promise to attend your wedding, sending a generous gift and an apology is not the *moral equivalent* of attending. It is a remedy for *failing* to attend. The colleague conflates the *remedy for a wrong* with the *discharge of a duty*. In morality, the duty is specific performance; compensation is merely damage control.

  **Survival:** Neither conclusion survives. The first fails because it ignores the constitutive nature of promising (creating an obligation, not just protecting reliance). The second fails because it conflates the value of the performance with the cost of the breach.

  ### 5. A Better Analogy: The Analogy of Assertion (Truth-Telling)

  If the contract analogy treats a promise as a **transaction**, a more structurally sound analogy treats a promise as an **assertion**.

  **The Correspondence:**
  *   **Assertion:** "It is raining." → **Promise:** "I will come."
  *   **Truth Condition:** Matches present fact. → **Truth Condition:** Matches future fact.
  *   **Lying:** Asserting what is false. → **Breaking:** Failing to make the future true.
  *   **Obligation:** Duty to speak truth. → **Obligation:** Duty to keep faith.
  *   **Remedy:** Retraction/Correction. → **Remedy:** Apology/Explanation (but the lie remains a lie).

  **Where it Maps:**
  *   **Bindingness:** An assertion is binding regardless of whether the listener relies on it. If I say "It is raining" when it is not, I have lied, even if you didn't hear me. This maps to the promise: I am bound even if you don't rely.
  *   **Integrity:** The wrong of lying is primarily a corruption of the speaker's integrity and the practice of communication, not just the harm to the listener. This maps to the promisor's self-harm.
  *   **No Substitution:** You cannot "pay damages" for a lie to make it true. You must speak the truth. Similarly, you cannot pay damages to make a promise kept; you must perform.

  **Where it Breaks:**
  *   **Control:** I can control whether I speak, but I cannot always control the future facts (I might be prevented from coming). Assertions are about facts I observe; promises are about facts I must *create*.
  *   **Time:** Assertions are present-tense; promises are future-tense. This introduces the problem of changed circumstances, which the assertion analogy handles poorly (a statement doesn't become false because the world changed, but a promise might be voided).
  *   **Rights:** An assertion gives the listener knowledge. A promise gives the promisee a *right* to my action. The assertion analogy captures the integrity cost but underplays the promisee's claim.

  **Verdict on the Better Analogy:**
  The Assertion Analogy succeeds where the Contract Analogy fails: it grounds the bindingness in the **integrity of the agent** and the **norm of truth**, rather than in reliance or exchange.
  *   **On Conclusion 1:** It supports the view that a promise is binding without reliance (just as a truth-telling duty exists without a listener).
  *   **On Conclusion 2:** It supports the view that performance is non-substitutable (just as truth is non-substitutable).

  However, because it underplays the *transfer of right* to the promisee, it is best used in tandem with a **Property Analogy** (where a promise conveys a right to the promisee). But between the two, the Assertion Analogy is superior for explaining the *ethical* bindingness on the promisor, which is the core of your colleague's error. He treats the promise as a bet on behavior; the Assertion Analogy treats it as a commitment of character.
