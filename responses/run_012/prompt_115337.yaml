answer: |-
  You are right to be suspicious. "Information is physical" is a slogan, not a theorem. It functions as a Rorschach test in physics seminars: everyone sees the justification they want to see in it. When used to resolve Maxwell's Demon, it is often deployed as a rhetorical stopper rather than a mechanical explanation.

  Here is the menu of precise claims hidden behind that slogan, ranked from trivial to radical, with their commitments and their utility against the Demon.

  ### 1. The Embodiment Thesis (Trivial)
  **The Claim:** Information cannot exist in the abstract; it must be instantiated in a physical state (magnetic domains, ink on paper, neural firing patterns). There is no "view from nowhere" for data.
  **Commitment:** You commit to the idea that there are no disembodied minds or platonic databases. Every bit corresponds to a degree of freedom in a physical system.
  **Verdict:** **True, but beside the point.**
  This is the "filing cabinet" version you mentioned. It is undeniably true, but it does not save the Second Law. Merely having a physical memory does not inherently generate entropy. A physical notebook can sit on a table forever without increasing the heat of the universe. If the Demon just writes things down and never wipes the slate, the Embodiment Thesis alone doesn't explain where the entropy cost comes from.

  ### 2. The Measurement Cost Thesis (The Historical Misstep)
  **The Claim:** The act of *acquiring* information (measurement) necessarily dissipates energy. To know the speed of a molecule, you must bounce a photon off it, disturbing the system and paying an energy tax.
  **Commitment:** You commit to the idea that observation is inherently intrusive and thermodynamically irreversible.
  **Verdict:** **False (in principle).**
  This is the "quietly wrong" version you suspected. This was the early solution proposed by Szilard and Brillouin. However, Charles Bennett later showed that measurement *can* be performed reversibly. You can couple the system to a memory register without dissipating heat, provided you don't erase the previous content of that register. If your seminar presented this as the final word, they were relying on a 1950s understanding that was superseded in the 1980s.

  ### 3. The Landauer Principle Thesis (The Workhorse)
  **The Claim:** The thermodynamic cost is not in measuring, but in *erasing*. To reset the Demon's memory to a blank state (so it can measure the next molecule), you must compress the phase space of the memory device. This logical irreversibility necessitates a thermodynamic cost of at least $k_B T \ln 2$ per bit erased.
  **Commitment:** You commit to the equivalence of logical irreversibility (losing the history of a computation) and thermodynamic irreversibility (heat dissipation). Information is physical in the sense that *deleting* it is a physical operation like compressing a gas.
  **Verdict:** **True and does the real work.**
  This is the standard modern resolution. The Demon can sort molecules and decrease entropy in the gas, but it fills up its memory. To continue operating cyclically, it must reset its memory. That reset dumps heat into the environment, exactly compensating for the entropy decrease in the gas. The Second Law is saved, but the cost is paid at the reset button, not the microscope.

  ### 4. The Entropy-as-Ignorance Thesis (Epistemic)
  **The Claim:** Entropy is not a property of the physical system alone, but of the relationship between the system and the observer. The Demon has more information than we do, so the entropy is lower for the Demon. "Information is physical" here means "knowledge changes the thermodynamic accounting."
  **Commitment:** You commit to a Gibbsian/subjective view of entropy rather than a purely Boltzmannian/objective view.
  **Verdict:** **True but dangerous.**
  This is compatible with the Landauer solution but requires careful handling. If you push this too hard, you risk making the Second Law subjective (i.e., "I can violate the 2nd Law if I'm smart enough"). The resolution is that the Demon's memory becomes *correlated* with the gas. The total entropy (Gas + Demon) remains constant during measurement, but the "useful" entropy decreases. The cost comes when those correlations are broken (erasure). If your seminar used this to imply entropy is "just in your head," they were flirting with nonsense. If they used it to explain correlations, they were on solid ground.

  ### 5. The Ontological Thesis (Radical)
  **The Claim:** Information is not just something physical systems *have*; it is what physical systems *are*. Reality is fundamentally computational ("It from Bit").
  **Commitment:** You commit to a metaphysical stance where information is a fundamental constituent of the universe, perhaps more fundamental than matter or energy.
  **Verdict:** **Irrelevant to the Demon.**
  This is Wheeler's territory. It might be true, but it doesn't help you calculate the heat dissipation of a memory reset. You can solve Maxwell's Demon completely using standard statistical mechanics and Landauer's Principle without buying into the idea that the universe is a computer. This is often invoked to sound profound, but it does no mechanical work in the argument.

  ---

  ### Compatibility Check
  *   **1, 3, and 4 hold together well.** Information needs a substrate (1), erasing that substrate costs energy (3), and this process manages the correlations between observer and system (4).
  *   **2 is incompatible with 3.** If measurement *necessarily* costs energy (2), you don't need Landauer's Erasure (3) to save the Second Law. Since 3 is the robust modern proof, 2 is usually discarded as a sufficient explanation.
  *   **5 is orthogonal.** You can be a Landauer-realist (3) without believing the universe is made of bits (5).

  ---

  ### The Verdict on Your Seminar

  Given that they seemed to think the slogan *by itself* closed the case, your seminar was likely leaning on a conflation of **Claim 1 (Embodiment)** and **Claim 3 (Landauer)**, while secretly relying on the intuition of **Claim 2 (Measurement)**.

  Here is the likely rhetorical sleight of hand they performed:
  1.  They invoked **Claim 1** ("Information is Physical") to stop you from treating the Demon's mind as magic.
  2.  They assumed this automatically implied **Claim 3** (that handling that physical information has a thermodynamic price).
  3.  They likely glossed over the specific mechanism (Erasure vs. Measurement).

  **The "Slogan as Solution" Trap:**
  The phrase "Information is Physical" is not the solution; it is the *motivation* for looking for the solution. The actual solution is **Landauer's Principle (Claim 3)**.

  If they presented the slogan as the proof, they were being imprecise. The slogan warns you not to treat the Demon's memory as abstract math. But the *reason* the Demon fails is not simply that its memory is physical (a rock is physical and doesn't generate heat); the reason is that **resetting** that physical memory is a thermodynamic compression operation.

  **Summary:**
  *   **The True Work:** Landauer's Erasure Principle (Claim 3).
  *   **The Quietly Wrong Part:** The idea that Measurement costs energy (Claim 2).
  *   **The Seminar's Likely Error:** Using the Embodiment slogan (Claim 1) as a substitute for the Erasure mechanism (Claim 3). They treated the category warning as the mechanical explanation.

  You weren't missing anything; the slogan is doing too much heavy lifting for its weight. Insist on **Erasure**, not just "Physicality."
