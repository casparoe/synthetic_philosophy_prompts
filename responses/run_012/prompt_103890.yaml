      *   Bottle: Negligible risk. (Fine)
      *   Monitor: Material asset risk. (Not Fine)
      *   Mess (pre-discovery): Reduces immediate risk, hides long term risk. (Fine/Borderline)
      *   Mess (pre-review): Hides critical performance data. (Not Fine)

      This "Information Asymmetry/Risk" model fits better than "Trust" because it explains *why* the trust would break.

      *Wait, let's look at Case 8 again.* "Quietly clean up a mess... so they never find out." User says "Fine, but flip most."
