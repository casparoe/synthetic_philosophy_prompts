      *   *Section 6: The Vulnerability.* The "Benevolent Paternalism" trap.

      *Self-Correction on the Principle:* The user's "Trust Reversibility" is actually very close to **Scanlon's Contractualism** (rules no one could reasonably reject). But for an engineer, **Information Asymmetry** is a more useful mental model.
      Let's frame it as: **"Permissible if it does not create a deceptive information asymmetry that alters the other party's risk profile."**
