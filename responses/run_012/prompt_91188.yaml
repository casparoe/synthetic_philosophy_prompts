          3.  Determine if Neptune was genuinely abductive or merely hypothetico-deductive (HD) from Newton + auxiliary.
          4.  Explain what turns on this distinction.
          5.  Provide an "honest scorecard": What IBE captures, what it misdescribes/silences, and whether Vulcan's failure counts against IBE or background physics.
          6.  **Constraint:** Separate settled facts from contested philosophical interpretations. Do not present a consensus on the truth-conduciveness of abduction (because there isn't one).

  2.  **Initial Knowledge Retrieval & Structuring:**

      *   *Neptune (1846):* Adams & Le Verrier calculated position based on Uranus's orbit. Galle found it. Triumph of Newtonian mechanics.
      *   *Vulcan (1859+):* Le Verrier (again) posited intra-Mercurial planet to explain perihelion precession. Never found. Einstein's GR solved it later (1915).
      *   *Philosophy of Science:* IBE (Lipton, Peirce, etc.) vs. Hypothetico-Deductive (Hempel, Popper). Duhem-Quine thesis (holism of testing).
      *   *Key Distinction:* Is positing a planet a *new entity* (abduction) or a *parameter adjustment* within a fixed theory (HD)?
      *   *User's Need:* They want to know if their work is philosophically sound. They need nuance, not dogma.

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the user's position. Validate the Neptune/Vulcan analogy. Set the stage (Newtonian framework).

      *   **Task 1: Competing Explanations & Grounds:**
          *   *Neptune:*
              *   Exp A: Newton is wrong/limited.
              *   Exp B: Unseen mass (Planet).
              *   Grounds: Newton's track record was stellar. Errors in observation were possible but mass seemed more likely given success with Jupiter/Saturn.
          *   *Vulcan:*
              *   Exp A: Unseen mass (Planet).
              *   Exp B: Newton is wrong/limited.
              *   Grounds: Initially, same as Neptune (Newton is king). Later, failure to observe + coherence of GR made Exp B better.
          *   *Settled vs. Contested:* It's settled *what* the explanations were. It's contested *when* the shift happened (was Vulcan dead before Einstein?).

      *   **Task 2: Abductive vs. Hypothetico-Deductive (HD):**
          *   *HD View:* Theory (Newton) + Auxiliary (Planet exists at X) $\rightarrow$ Prediction (Orbit matches). If match, confirmation.
          *   *Abductive View:* Anomaly exists. Best explanation for anomaly is Planet. Therefore, Planet likely exists.
          *   *The Crux:* In the Newtonian context, "Planet" is an auxiliary hypothesis. But *choosing* that auxiliary over "Modify Gravity" is an abductive step.
          *   *What turns on it:* If HD, it's about logical consistency and prediction. If Abductive, it's about explanatory virtue (simplicity, coherence, mechanism). If it's just HD, Vulcan was a valid hypothesis that turned out false. If it's Abductive, we need to ask why "Planet" was "Best" initially and why it stopped being "Best."

      *   **Task 3: The Honest Scorecard (IBE Analysis):**
          *   *What IBE Captures:* The *choice* between modifying the core theory vs. adding an entity. It highlights the role of background assumptions (Newton is solid).
          *   *What IBE Misdescribes/Silences:* It often ignores the *quantitative* precision. IBE sounds qualitative ("best"), but these were quantitative fits. It also silences the sociological/instrumental limits (could we *see* Vulcan?).
          *   *Vulcan's Failure:* Does it kill IBE? No. IBE selects the best *available* explanation. If the background theory is wrong, IBE picks the best explanation *within that false framework*. It counts against the *background physics*, not the logic of inference itself.
          *   *Settled vs. Contested:* Settled: Vulcan failed, Neptune succeeded. Contested: Whether IBE is a valid rule of inference or just a psychological heuristic.

      *   **Task 4: Relevance to Exoplanets:**
          *   Connect back to the user. Radial velocity/transits are similar to perturbations.
          *   The "Vulcan risk" is now "False Positive" (blending, stellar activity).
          *   The "Neptune success" relies on the robustness of stellar/orbital models.

  4.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Correction:* Make sure not to say "IBE is true." The prompt explicitly says *do not* present a position on truth-conduciveness as consensus.
      *   *Nuance:* The Duhem-Quine problem is central here. You never test a hypothesis in isolation. You test Theory + Auxiliaries. Neptune/Vulcan is the classic example of saving the Theory by tweaking Auxiliaries.
      *   *Tone:* Professional, philosophical, yet grounded in the physics history. Avoid oversimplifying Le Verrier's motivations.
      *   *Check:* Did I distinguish settled from contested? I need to make this explicit in the text or structure. *Decision:* I will use explicit markers or a concluding summary table to ensure this constraint is met.

  5.  **Final Review against Constraints:**
