prompt: |-
  Ok so I need to write a short research proposal — like a two-page thing for a fellowship application — and my idea is only half baked so bear with me.

  Domain is the paradox of deontology. You know the setup: deontological constraints say I can't kill one person even to save five, and then it looks like the theory is telling me to let a worse outcome happen, which seems either irrational or arbitrary. The usual replies say constraints are agent-relative, or that they express a different kind of moral consideration than outcomes do. My hunch is that the whole thing is set up wrong, because it holds everyone else's behavior fixed. In real life a constraint isn't a private rule I apply case by case — its more like a public commitment that other people rely on to predict what I'll do. If constraints work like that, then the supposed counterexample (violate it just this once to prevent a bigger harm) is unstable: the moment I'm allowed to do that, the constraint stops doing the coordinating work that made it worth having in the first place.

  So the question I want stated precisely: does the paradox of deontology survive once constraints are modeled as public, expectation-stabilizing commitments rather than act-by-act prohibitions — and if it doesn't, is that a vindication of deontology or just a sneaky way of smuggling in rule consequentialism?

  Then I need the rest of the proposal filled out: why the existing positions leave this open (I think they mostly just assume the agent's policy is invisible to others, or that only one agent is moving), what method I'd actually use (I want to do it partly by building small game-theoretic toy cases and partly by arguing about what a 'constraint' even is), what a result would look like and what would count as the project failing, and a realistic scope for the time I've got. Also tell me honestly if the game-theoretic version just collapses into rule consequentialism, cause if it does I want to know that before I apply. Don't bother with citations, I'll fill those in myself.
