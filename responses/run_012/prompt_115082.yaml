prompt: |-
  Next Thursday I've got the last session of my intro Chinese philosophy unit and it's the butterfly passage that closes the Qiwulun — 75 minutes, eighteen undergrads, and alot of them did the Descartes meditations in a different course last term so they think they've already had this conversation. Don't explain the passage to me, I know it. Plan the class.

  Order first. I need the sequence the ideas have to arrive in so that when we finally hit the passage the students feel the actual move instead of filing it under ancient skepticism. Tell me what has to be on the table beforehand, what has to not be on the table yet, and why. My instinct is to open with Descartes, since that's the version they already own, and let Zhuangzi be the correction — I have a nagging feeling thats backwards, so say so if it is.

  Then the carrying example. I genuinely can't decide whether the butterfly should be what the whole session is built on or whether it should be the payoff after something else has done the heavy lifting, and if it's the latter, what that something is. Whatever carries it has to do a specific job: two levels, each of which looks like the waking one from the inside; a transition that isn't a switch between two states but a change of kind; and no test available from within either level that would settle which one you're in. And it can't smuggle in an escape hatch — no totem that keeps spinning, no clock, no remembering how you got here. Two candidates I've been kicking around: (a) a nested false awakening, where I dream I've woken up and am telling my partner about the dream, then I actually wake up and tell her, and the version I dreamed I told her doesn't match the one I actually tell; (b) the bit earlier in the same chapter about dreaming of a party and waking up weeping, or dreaming of weeping and going hunting at dawn. Which one, and does your answer change if all I really have from the butterfly passage is the ending — that there must be some distinction between Zhou and the butterfly, and then the naming of the whole business as a transformation?

  Misconceptions, in the order they'll actually surface, with the exact point in the sequence where I should head each one off. Mine so far: (1) this is Descartes with nicer furniture; (2) the conclusion is that we can't know anything; (3) the butterfly stands for freedom and change, because someone always brings the pop version; (4) it's about personal identity — which one is the real me. Tell me what I'm missing and, more importantly, which of those is half right in a way I should preserve rather than kill. Because here's the worry underneath all of it: I want them to see a reading on which the passage isn't a skeptical argument at all, and I don't know what has to be in place before the last line lands for that reading to even be available to them.

  Related: the exchange earlier in the chapter where Confucius and his disciple are both called dreamers, and the speaker adds that in saying so he's dreaming too. I want to use it and I'm afraid it either dissolves the whole question or reads as a cheap gotcha. Where does it belong, and how do I keep it from being a mic drop?

  Then give me one question I can put to them in the last five minutes that shows whether the thing landed rather than whether they enjoyed the vertigo. And tell me what I should openly refuse to do at this level — my instinct is to refuse to adjudicate whether we're dreaming right now, but maybe that's exactly the wrong refusal and something else should get the axe instead.

  Last thing, three sentences max: same passage, same length, but the week after I'm guesting in a colleague's sleep-and-cognition seminar. What changes?
