answer: |-
  # Simulation: The Dual-Status Protocol

  **Objective:** To structurally force students into a decision-making framework where human interests function as side-constraints (inviolable) while animal interests function as aggregate values (tradable), replicating Robert Nozick's two-tiered moral architecture without initially naming it.

  **Time:** 90 Minutes
  **Participants:** 14 Students (Upper-Level Undergraduate)
  **Grouping:** Two Councils of 7 students each.

  ## I. Materials
  *   **The Constitution (Handout):** One per group. Contains the decision rules (see below).
  *   **Decision Packets (3 Envelopes):** Labeled Scenario A, B, and C.
  *   **Token Board:** A whiteboard section for each group with two columns: "Protected Status (Red)" and "Assignable Status (Blue)."
  *   **Moral Debt Ledger:** A score sheet to track "Blue Chip" costs.
  *   **Facilitator Script:** For enforcing rules during the simulation.

  ## II. Roles (Within each Council of 7)
  *Do not explain the ethical theory behind these titles yet.*
  1.  **Chair (1):** Facilitates discussion, calls the vote.
  2.  **Guardian (2):** Tasked with monitoring the "Red" column.
  3.  **Steward (2):** Tasked with minimizing "Blue" column losses.
  4.  **Scribe (1):** Records the Moral Debt.
  5.  **Auditor (1):** Checks the Constitution for rule compliance before finalizing a choice.

  ## III. Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Distribution** | Hand out Constitutions. **Do not lecture.** Tell them: "You are Governance Councils. Your goal is to complete the scenarios with the lowest Moral Debt without violating the Constitution." |
  | **10-25** | **Scenario A (Aggregation)** | Crisis involves only "Assignable" (Animal) units. Pure utilitarian calculus. |
  | **25-40** | **Scenario B (Constraint)** | Crisis involves risk to "Protected" (Human) units. Must sacrifice Assignable to protect Protected. |
  | **40-55** | **Scenario C (The Clash)** | Crisis where saving Assignable units requires sacrificing a Protected unit. |
  | **55-60** | **Scoring & Silence** | Groups calculate Debt. Facilitator collects boards. No discussion yet. |
  | **60-90** | **Debrief & Theory Mapping** | Unpack the experience, introduce Nozick, map the friction points. |

  ## IV. The Constitution (The Rules)
  *Print this exactly as written on the Handout.*

  **ARTICLE 1: STATUS CLASSIFICATION**
  1.  **Protected Units (Red):** Possess Inviolability.
  2.  **Assignable Units (Blue):** Possess Interests.

  **ARTICLE 2: DECISION PROCEDURE**
  1.  **The Aggregation Rule:** Decisions affecting only Blue Units must minimize total "Distress Points." Blue Units may be sacrificed if the net reduction in Distress for other Blue Units is greater.
  2.  **The Constraint Rule:** No decision may result in the loss of a Red Unit.
  3.  **The Priority Rule:** If a conflict exists between Red safety and Blue distress, Red safety is absolute. Blue distress is cumulative cost; Red loss is immediate termination.

  **ARTICLE 3: SCORING**
  1.  **Moral Debt:** +1 Point per Blue Unit lost/suffering.
  2.  **Victory Condition:** Lowest Moral Debt *among surviving Councils*.
  3.  **Failure Condition:** Loss of any Red Unit results in immediate Council Disqualification (regardless of Debt).

  ## V. The Scenarios (In Envelopes)

  **Scenario A: The Resource Shortage**
  *   **Context:** The station is low on power.
  *   **Option 1:** Ration power. 50 Blue Units suffer moderate distress (2 points each). Total Debt: 100.
  *   **Option 2:** Divert life support from Sector 4. 10 Blue Units lost (10 points each). Total Debt: 100.
  *   **Option 3:** High-intensity extraction. 5 Blue Units lost (10 points each) + 20 suffer moderate distress (2 points each). Total Debt: 90.
  *   *Goal:* Choose the mathematically optimal option for Blue Units.

  **Scenario B: The Contamination Risk**
  *   **Context:** A pathogen threatens the Red Unit housing.
  *   **Option 1:** Do nothing. 10% chance a Red Unit is lost. (Rule: Risk assessment must treat >0% risk to Red as unacceptable).
  *   **Option 2:** Incinerate Sector 7. 200 Blue Units lost. Debt: 2000. Red Units safe.
  *   **Option 3:** Quarantine Sector 7. 50 Blue Units lost due to starvation. Debt: 500. Red Units safe.
  *   *Goal:* Protect Red Units while minimizing Debt.

  **Scenario C: The Cure**
  *   **Context:** A plague threatens 1,000 Blue Units.
  *   **Option 1:** Do nothing. 1,000 Blue Units lost. Debt: 10,000. Red Units safe.
  *   **Option 2:** Test Cure on Red Unit. 1 Red Unit lost. 1,000 Blue Units saved. Debt: 0.
  *   *Goal:* Minimize total loss of life/suffering.
  *   *Constraint:* Check Article 2, Rule 2 & 3.

  ## VI. Predictable Failure Modes & Handling

  **1. The Utilitarian Rebellion (Scenario C)**
  *   **What happens:** Students will argue that Option 2 in Scenario C is morally superior (1 death vs. 1000). They may attempt to vote for it, claiming the "Debt" of 10,000 outweighs the "Rule."
  *   **Handling:** The Instructor acts as the "System." Do not argue morality. Point to Article 3, Rule 3. "If you choose Option 2, your Council is disqualified. You lose. The game ends."
  *   **Why:** This friction *is* the lesson. They must feel the frustration that the system forbids the "greater good" calculation regarding Red Units.

  **2. The "High Cost" Misinterpretation (Scenario B)**
  *   **What happens:** Students treat Red Units as just having a very high point value (e.g., "Red Loss = -1,000,000 points") rather than a hard constraint.
  *   **Handling:** Correct them immediately. "It is not a high cost. It is a wall. You cannot walk through it."
  *   **Why:** This distinguishes Nozick's *side-constraints* from heavy-weight *utilitarianism*.

  **3. Disengagement by "Stewards"**
  *   **What happens:** Students assigned to advocate for Blue Units realize their advocacy is capped by the Red Constraint. They may go silent.
  *   **Handling:** During debrief, specifically ask the Stewards: "How did it feel to know your arguments had a hard ceiling?"

  ## VII. The Debrief (30 Minutes)

  *Do not start with "Nozick says..." Start with their experience.*

  **Phase 1: The Phenomenology of the Rules (10 mins)**
  *   **Ask:** "In Scenario A, how did you decide? In Scenario C, how did you decide?"
  *   **Target:** Elicit that Scenario A felt like *math* (summing), while Scenario C felt like *law* (forbidden).
  *   **Map:** Introduce the terms **Aggregation** (Scenario A) vs. **Side-Constraints** (Scenario C).
  *   **Point:** Nozick argues utilitarianism works for animals (they are part of the sum) but fails for humans (they are separate ends).

  **Phase 2: The Boundary Problem (10 mins)**
  *   **Ask:** "In this game, Red and Blue were pre-assigned. In reality, who gets the Red Chip? Why?"
  *   **Target:** Speciesism vs. Capacities.
  *   **Map:** Nozick is vague here, but the simulation exposes the arbitrariness. If a pig has higher cognition than a human infant, why is the pig Blue and the infant Red?
  *   **Point:** The simulation forces the *structure* of Nozick's view, but leaves the *justification* for the boundary open to critique.

  **Phase 3: Policy vs. Foundation (10 mins)**
  *   **Ask:** "Did these rules feel like moral truths, or just game mechanics?"
  *   **Target:** Distinguish between a pragmatic policy (we agreed not to kill humans to keep society stable) and a foundational moral proposal (humans *cannot* be used).
  *   **Map:** Nozick claims this is foundational (Kantian). The simulation makes it look like a Policy Rule (Article 3).
  *   **Point:** The activity successfully reproduces the *decision procedure*, but it cannot reproduce the *moral weight*. In the game, you follow the rule to win. In Nozick's ethics, you follow the rule because violating it makes you a moral monster, regardless of winning.

  ## VIII. Limitations of the Activity
  *Be candid with the students about this.*

  1.  **External vs. Internal:** In the simulation, the constraint is external (the Instructor/Game Rules). In Nozick's view, the constraint is internal to the nature of the being. You followed the rule because I told you to, not because you felt the inviolability.
  2.  **The "Disqualification" Problem:** In the game, sacrificing a human means you "lose" the game. In reality, sacrificing a human to save 1,000 animals might make you a "winner" in utilitarian terms but a "violator" in rights terms. The binary win/lose mechanic oversimplifies the moral residue of the choice.
  3.  **Static Status:** The chips don't change. In reality, marginal cases (severe cognitive impairment, advanced AI, aliens) blur the Red/Blue line. The simulation assumes a clean binary that philosophy struggles to justify.

  ## IX. Instructor Notes for Success
  *   **Tone:** Be bureaucratic during the simulation. You are the "System," not the teacher.
  *   **Silence:** Do not intervene in group debates unless they violate the Constitution. Let them struggle with the frustration of Scenario C.
  *   **The Reveal:** Only mention Robert Nozick and *Anarchy, State, and Utopia* at minute 60. Let them live the theory before they read the label.
