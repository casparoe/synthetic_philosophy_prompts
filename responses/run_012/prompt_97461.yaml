rs solely due to the change in knowledge. This highlights that Encounter is not purely perceptual but cognitive.\n\nThe asymmetry between (a) and (c) reveals the instability of aesthetic value. In (a), the object is different (copy vs. original), and knowledge eventually aligns with this fact. In (c), the object is identical, but knowledge shifts away from the initial attribution. In both instances, the result is a loss of Standing and a modified Encounter. This suggests that Standing is not merely additive but constitutive of the experience. If value supervened solely on Vehicle, the exposure in (c) would not diminish value. Since it does, value must depend on history.\n\nRegarding evidence, scientific analysis can settle Vehicle identity (pigments, age), but it cannot restore Standing if the history is false. Standing relies on testimony and provenance. The crux lies in the viewer\u2019s information state. \u2018Perceptually indistinguishable\u2019 is incomplete without specifying \u2018to whom.\u2019 A surface-supervenience view implies value exists only for someone who does not know what they are looking at. Once knowledge is acquired, that specific value vanishes. This is not a debating trick but a consequence: if aesthetic value requires ignorance of history, it is ephemeral. This is a significant cost, as it renders the mature appreciation of art\u2014which includes knowledge of its origin\u2014inferior to the naive glance. Therefore, the history of production must enter into the aesthetic properties themselves, not merely as external context, to preserve the stability of value across the transition from ignorance to knowledge.",
