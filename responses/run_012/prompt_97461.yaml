  *Question Draft:*
  "Consider the following four loci of artistic value: Vehicle (the perceptible surface); Achievement (the problems solved in making); Standing (the object's causal/institutional history); Encounter (the experience available to a situated viewer).
  Analyze these three cases:
  (a) A perfect copy of an existing painting, indistinguishable by any means.
  (b) A forger's new work in a master's style, never made by the master, undetectable, accepted then exposed.
  (c) The surviving original of a famous work whose attribution is subsequently downgraded; the object is unchanged, only knowledge changes.
