      *(Self-Correction during drafting)*: Make sure I don't sound like a philosophy textbook. Keep it grounded in the housemate dynamic. Ensure the verdict is clear. I need to explicitly state who is more right. I'll side with Owen, but acknowledge Nadia's valid concern about health.

