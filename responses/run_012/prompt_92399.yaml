      *Verdict:* Owen. Why? Because Nadia conflates *competence* with *conclusion*. Owen protects agency.

      *Missing:* The "Leave of Absence" option. The fact that they are debating *for* her.

  7.  **Final Polish:** Check against constraints. "Don't just lay out the two sides... I want an actual verdict." Okay, I will be decisive.

      *(Final thought on the "Verdict")*: Is it fair to say Owen is more right? Nadia is worried Rosa will destroy her future due to temporary pain. Owen is worried Nadia will destroy Rosa's autonomy due to Nadia's bias. In a friendship, autonomy usually trumps optimization. Owen is more right.

      *(Wait, one nuance)*: Nadia's point about "drunk contracts" is legally and ethically sound. We *do* invalidate decisions made under severe impairment. But quitting a PhD isn't signing a contract; it's leaving one. The stakes are different. Leaving a PhD is reversible (mostly). Signing a contract binds you. This weakens Nadia's analogy. I should mention that.

      Okay, ready to write.

