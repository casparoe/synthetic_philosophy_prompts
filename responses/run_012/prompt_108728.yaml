      *   *Check against constraints:* 45 mins? Yes. Uses 3 ideas? Yes. Traps linear ranking? Yes. Avoids simple MCA? Yes (focuses on the structure of the argument).

  4.  **Drafting the Model Answer:**
      *   *Word Count:* ~600 words.
      *   *Structure:*
          1.  Intro: State the thesis (the policy fails on three structural grounds).
          2.  Point 1: Evidence vs. Status (The Proxy Slide). Acknowledge brain data tells us capacities (evidence), but doesn't tell us if those capacities grant rights (status).
