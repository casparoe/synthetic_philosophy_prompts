          *   Student note on brain size metrics (absolute, relative, EQ, neurons, elephants) - don't build the whole answer on this technicality.
          *   Output needed: 1 Essay Question (45 mins), 1 Model Answer (~600 words), 1 Marking Scheme (20 marks, 5 hit points, common errors, A vs B distinction).
