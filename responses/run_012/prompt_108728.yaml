  2.  **Brainstorming Student Errors (The "Where they go wrong" phase):**
      *   *Error 1: Conflating Evidence and Status.* Students often argue "Animals have smaller brains therefore they suffer less" (Evidence) and jump straight to "Therefore they matter less" (Status) without justifying *why* brain size links to moral worth. This is the "Proxy Slide."
      *   *Error 2: Status vs. Weight.* Students treat "having status" as binary (you count or you don't) but then struggle when interests conflict. Or they treat "weight" as the only thing that matters, ignoring that some beings might have status but zero weight (unlikely) or vice versa. The key distinction is *entry* vs. *priority*.
      *   *Error 3: Linear Ranking.* Students assume capacities form a single ladder (IQ-style). They miss the "Different Capacity" point. A bat might not have human reasoning but has echolocation capacities that matter for *its* flourishing, or pain capacity might not scale linearly with cortex size.
      *   *Error 4: Marginal Cases Overuse.* The prompt specifically forbids just reciting the Marginal Cases Argument (MCA). Students love MCA because it's a gotcha. The question needs to force them *past* the gotcha into the structural distinctions the teacher provided.
      *   *Error 5: Brain Size Technicalities.* Students might get bogged down in "Elephants have more neurons" rather than the moral implication of that fact.

  3.  **Drafting the Question:**
