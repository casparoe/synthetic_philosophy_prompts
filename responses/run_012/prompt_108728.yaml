answer: |-
  ### Brainstorming: Where High Schoolers Usually Trip Up

  Before writing the exam material, I need to anticipate where your classmates will lose marks. Based on typical philosophy errors and the specific concepts your teacher highlighted, here are the main traps:

  1.  **The "Science Solves Ethics" Trap:** Students often think that if we prove animals *feel* pain (evidence), we have proven they *matter* (status). They miss the "Proxy Slide." They think finding a neuron count is the same as finding a moral rule.
  2.  **The "All or Nothing" Trap:** When discussing Moral Status vs. Moral Weight, students tend to think it's binary. Either you matter completely or you don't matter at all. They struggle with the idea that a creature can have full status (their interests count) but low weight (their interests might be overridden in a conflict).
  3.  **The "Linear Ladder" Trap:** This is the big one. Students love to rank things. Even if they admit animals matter, they want to put humans at 10, dogs at 5, and bugs at 1. They miss the "Less vs. Different" point. They assume a bat's brain is just a "worse human brain" rather than a "different tool for a different job."
  4.  **The "Marginal Cases" Crutch:** Since you covered the Marginal Cases Argument (MCA), students will try to use it for everything. The prompt needs to force them to put the MCA away and use the *structural* tools (the three distinctions) instead.
  5.  **Getting Bogged Down in Biology:** As you noted, someone mentioned elephant neurons. Students might waste 200 words arguing about whether EQ is accurate. The exam needs to punish this. The philosophy is about what the data *means*, not the data itself.

  ***

  ### 1. The Essay Question

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Prompt:**
  A government advisory committee proposes a new "Moral Hierarchy Index." They argue: *"Total cortical neuron count is an objective measure of cognitive capacity. Therefore, beings with higher scores have greater moral status, and when interests conflict, the higher score always wins."*

  Using the three distinctions from our unit, critique this proposal. Your answer must:
  1.  Explain how the committee commits a "proxy slide" between the evidence question and the status question.
  2.  Distinguish between **moral status** and **moral weight** to show why the committee's rule for conflict resolution is flawed.
  3.  Explain why the idea of a single "Hierarchy" fails when considering the difference between having **less of a capacity** versus having a **different capacity**.

  *Note: Do not rely on the Marginal Cases Argument. Focus on the structural errors in the committee's reasoning.*

  ***

  ### 2. Model Answer (Grade A Standard)

  **Word Count:** approx. 600 words

  The committee's proposal fails because it confuses biological data with moral rules. By treating neuron count as a direct ticket to moral worth, they commit three distinct philosophical errors regarding evidence, weight, and capacity types.

  First, the committee commits what we call a "proxy slide." They answer the evidence question (what does brain size tell us about capacity?) and pretend they have answered the status question (does that capacity grant moral worth?). Even if we accept that neuron count predicts problem-solving skills, that is a scientific fact, not a moral one. To move from "this creature has fewer neurons" to "this creature matters less" requires a moral premise that the committee never provides. They assume that cognitive complexity is the only thing that grants status, ignoring other possibilities like sentience or the capacity to suffer. Sliding from "is" to "ought" without justification invalidates their entire index.

  Second, the proposal collapses moral status into moral weight. The committee argues that a higher score means greater status *and* that the higher score always wins in conflicts. These are separate ledgers. Moral status is about entry: does this being count at all? Moral weight is about priority: whose interests matter more when they clash? A creature could have full moral status (their pain matters) but low moral weight (their interest in eating grass loses to a human's interest in survival). By saying the higher score "always wins," the committee treats status as a scalar quantity rather than a threshold. This implies that beings with lower scores might not have status at all, or that their interests are automatically void, which ignores the possibility that basic interests (like avoiding pain) might have heavy weight regardless of cognitive score.

  Third, the idea of a single "Hierarchy" assumes all brains are trying to do the same thing, just with varying efficiency. This ignores the distinction between having *less* of a capacity and having a *different* capacity. A dolphin's brain is not simply a "less powerful" human brain; it is optimized for echolocation and social navigation in water. If the index measures only cortical neurons related to human-style reasoning, it penalizes creatures for having different tools that serve their own flourishing. If moral status is linked to the ability to live a full life according to one's nature, then a "different" capacity should not be ranked as "less." A single ladder cannot measure diverse forms of consciousness.

  In conclusion, the Moral Hierarchy Index is philosophically unsound. It slides from data to value without justification, confuses who counts with who wins, and imposes a human-centric linear ranking on diverse forms of life. A valid moral framework must separate scientific evidence from moral justification, distinguish status from weight, and recognize qualitative differences in capacity rather than just quantitative ones.

  ***

  ### 3. Marking Scheme (Out of 20 Marks)

  **Five Hit Points (4 marks each)**

  1.  **Identifying the Proxy Slide:**
      *   *Requirement:* Student identifies that the committee moves from brain data (evidence) to moral worth (status) without justification.
      *   *Common Error:* Student argues that neuron count is scientifically inaccurate (e.g., "Elephants have more neurons") rather than philosophically irrelevant.
  2.  **Explaining Evidence vs. Status:**
      *   *Requirement:* Student explains *why* the slide is a mistake (facts do not equal values).
      *   *Common Error:* Student defines the terms but doesn't apply them to the committee's specific claim.
  3.  **Distinguishing Status vs. Weight:**
      *   *Requirement:* Student clearly defines Status as "entry/counting" and Weight as "priority/conflict."
      *   *Common Error:* Student treats them as synonyms (e.g., "Status means how much they matter").
  4.  **Challenging the Single Ladder (Less vs. Different):**
      *   *Requirement:* Student argues that different brains serve different functions, so a single ranking is category error.
      *   *Common Error:* Student argues that animals have "less" intelligence but should be protected anyway (paternalism), missing the "different" point.
  5.  **Structure and Constraint Compliance:**
      *   *Requirement:* Answer is structured (Intro, Body, Conclusion) and does *not* rely on the Marginal Cases Argument.
      *   *Common Error:* Student ignores the prompt's ban on MCA and writes about infants/disabled humans instead of the structural flaws.

  **What Separates an A from a B?**

  *   **The B Answer (12-15 marks):** Correctly defines the three distinctions. They will say "Status is who counts, Weight is priority" and "Evidence isn't Status." However, they treat these as a checklist. They define the terms correctly but apply them generically.
  *   **The A Answer (16-20 marks):** Shows how the distinctions *connect*. For example, they explain that because the committee assumes a "Single Ladder" (Point 3), they are forced to confuse "Status" and "Weight" (Point 2). An A answer dismantles the committee's argument as a cohesive system, whereas a B answer just corrects the vocabulary. The A answer focuses on the *logic* of the proposal, not just the definitions.
