      *   *Prompt:* "Someone argues: 'We know that cortical neuron count correlates with problem-solving skills. Therefore, creatures with fewer neurons simply matter less morally.' Explain why this argument fails by distinguishing between the evidence question and the status question. Then, explain why even if we solve that, we still cannot simply rank creatures on a single ladder of moral weight, using the distinction between 'less capacity' and 'different capacity'."
      *   *Wait, need to incorporate Status vs Weight too.*
