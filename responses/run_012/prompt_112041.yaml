prompt: |-
  I teach a third-year seminar that philosophy and psychology students take together, and in a fortnight I have to run a ninety-minute session on what the cross-cultural evidence about folk morality is supposed to show about whether morality is objective. I taught it badly last year and I want to get it right. I opened with the trolley problem, on the theory that it was the one case everyone already had an opinion about; the discussion immediately degenerated into a guessing game about how people in other societies would answer, and then split into two camps that could not give reasons — half the room took the variation in moral judgement to refute moral realism outright, the other half took moral psychology to be simply irrelevant to metaethics. A colleague in the psychology department tells me I am overcomplicating things and should just present the findings and let the students draw their own conclusions, which is more or less what I did last year. What I want from you is a teaching plan, not an explanation of the topic: the order in which the ideas have to be introduced and what depends on what. I am fairly confident that both the moral/conventional distinction and the distinction between the content of a moral code and the status of moral claims have to be on the table early, but I cannot see which must come first, and I want you to decide and defend the order rather than lay out the alternatives. I would also rather they reason from a case they can all evaluate than take my word for what a particular society says, so build the session so that it does not depend on them accepting any ethnographic report.

  The thing I most want your judgement on is the carrying case. I have drafted my own vignette, because the published materials feel too loaded: a woman inherits her late mother's wedding ring, has it melted down and recast as a set of everyday spoons, and uses them at the family table, with everyone's knowledge and nobody's objection. Should that carry the session? Tell me what such an example has to contain and, just as importantly, what it must lack — my hunch is that anything bringing in harm, unfairness, deception, or even a bereaved person's distress will let the students file the disagreement under facts or consequences and learn nothing — and tell me plainly why the trolley problem is the wrong case to build on, since I have a suspicion about this but not an argument, and whether it has any legitimate use later, once the framework is in place. Then the misconceptions. I am expecting 'so morality is just relative' and 'so the empirical data are beside the point', but I suspect the ones that will do real damage are subtler — that the moral/conventional distinction is the legal/conventional distinction under another name, or that variation in what people judge is the same thing as variation in what is judged, or that the sampling complaint everyone has heard is a complaint about Western-ness rather than about education, wealth, industrialisation and democracy — and I want each one located at the exact point in the sequence where it has to be headed off, not merely named.

  Finish with the single question I should put to them in the last five minutes to find out whether they have grasped the inferential structure rather than collected some facts, and with what I should tell them we are not going to settle today and why. Commit to your recommendations and give your reasons; where you think a familiar choice is a mistake, say so and say what to do instead. I would rather have a plan I might disagree with than a balanced survey of options.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** Third-year seminar, mixed Philosophy and Psychology students.
      *   **Topic:** Cross-cultural evidence about folk morality and its implications for moral objectivity (metaethics).
      *   **Duration:** 90 minutes.
      *   **Problem:** Taught it badly last year. Started with Trolley Problem $\rightarrow$ guessing game about other cultures $\rightarrow$ polarization (Relativism vs. Irrelevance) without reasons.
      *   **Colleague's Advice:** "Just present findings." (User rejects this as basically what failed last year).
      *   **User's Constraints/Preferences:**
          *   Wants a *teaching plan* (order of ideas, dependencies), not just an explanation of the topic.
          *   Needs a decision on the order of: Moral/Conventional distinction vs. Content/Status distinction (must choose and defend).
          *   No dependence on accepting specific ethnographic reports (reason from evaluable cases).
          *   **Core Task:** Evaluate the user's drafted vignette (Wedding Ring/Spoons). What must it contain/lack? Why is Trolley wrong *here*?
          *   **Misconceptions:** Identify subtle ones (Moral/Conventional = Legal/Conventional? Variation in judgment = Variation in truth? WEIRD sampling nuances?) and place them in the sequence.
          *   **Ending:** One specific question to test inferential grasp + what *not* to settle today.
          *   **Tone:** Committed, decisive, critical of familiar mistakes if necessary.

  2.  **Deconstruct the Core Philosophical/Psychological Tension:**

      *   *The Argument from Disagreement:* People disagree $\rightarrow$ No objective truth.
      *   *The Counter:* Disagreement doesn't entail no truth (e.g., physics).
      *   *The Psychological Twist:* It's not just *that* they disagree, but *how* they disagree (patterns of judgment).
      *   *The Metaethical Stakes:* Does the *structure* of folk morality (how people think about rules) imply objectivity or relativism?
      *   *Key Distinction:* Content (what is done) vs. Status (the kind of claim being made). If everyone treats moral claims as objective *status* even if *content* varies, that supports realism (or at least refutes simple relativism).

  3.  **Address the "Carrying Case" (The Vignette):**

      *   *User's Draft:* Mother's ring melted into spoons. Everyone knows, no objection.
      *   *Critique:* It's good because it avoids harm/rights violations. It focuses on *symbolic violation* vs. *utility*.
      *   *Requirements for the Case:*
          *   Must lack: Harm, rights violations, deception, explicit distress (otherwise students argue consequences).
          *   Must contain: A violation of a norm that *feels* moral/serious but isn't clearly harmful. A cross-cultural variation potential (some might say "disrespect," others "pragmatic").
          *   *Verdict:* It's a strong candidate, better than Trolley. Trolley is about *conflict of duties* (kill 1 vs 5). This is about *normative status* (is this wrong?).
      *   *Why Trolley is wrong to start:* It triggers immediate substantive moral reasoning (utilitarian vs. deontological). It distracts from the *metaethical* question (what does the disagreement *mean*?). It invites the "guessing game" the user experienced.

  4.  **Determine the Order of Concepts:**

      *   *Option A:* Moral/Conventional first, then Content/Status.
      *   *Option B:* Content/Status first, then Moral/Conventional.
      *   *Decision:* **Content/Status must come first.**
      *   *Reasoning:* You cannot understand the Moral/Conventional distinction (M/C) without understanding that a norm can have a specific *status* (authority-independence, generalizability) regardless of its *content*. If you start with M/C, students conflate "moral" with "serious." They need to grasp that "Status" is the metaethical hook. The M/C distinction is the *empirical tool* to measure Status.
      *   *Dependency:* Content/Status $\rightarrow$ M/C Distinction $\rightarrow$ Cross-Cultural Data $\rightarrow$ Metaethical Implications.

  5.  **Drafting the Session Plan (90 Minutes):**

      *   *0-15 min:* The Vignette & The Trap. (Ring/Spoons). Elicit reactions. Show variation.
      *   *15-30 min:* Content vs. Status. (The Crucial Framework). Define the distinction.
      *   *30-50 min:* The Moral/Conventional Distinction. (The Psychological Tool). How do we test Status? (Authority independence, etc.).
      *   *50-70 min:* Cross-Cultural Evidence (Hypothetical/General). Apply the tool. Address WEIRD sampling.
      *   *70-85 min:* Metaethical Implications & Misconceptions. Realism vs. Relativism.
      *   *85-90 min:* The Exit Question & Limitations.

  6.  **Refining the Misconceptions:**

      *   *Misconception 1:* Moral/Conventional = Legal/Conventional. (Address during M/C section).
      *   *Misconception 2:* Variation in Judgment = Variation in Truth. (Address during Content/Status).
      *   *Misconception 3:* WEIRD = Western. (Address during Data section - it's about industrialization/education).
      *   *Misconception 4:* Psychology $\rightarrow$ Metaethics is a category error. (Address at the end).

  7.  **Evaluating the Vignette (Ring/Spoons) Deeply:**

      *   *Strengths:* No victim. Purely symbolic.
      *   *Weaknesses:* Might be too obscure. Needs to ensure students see it as a *norm* violation potentially.
      *   *Modification:* Ensure the prompt asks "Is this *wrong*?" not "Is this sad?"
      *   *Why Trolley fails:* Trolley assumes the *wrongness* of killing is fixed. We are asking *whether* the wrongness is fixed. Trolley presupposes the stakes; the Ring case investigates the stakes.

  8.  **Finalizing the Exit Question:**

      *   Needs to test structure, not facts.
      *   *Idea:* "If we found a culture that treats *all* norms as authority-dependent, what would that imply?"
      *   *Better:* "If the *content* varies but the *status* features (authority independence) remain constant, does that support relativism?"

  9.  **Review against Constraints:**

      *   *Decisive?* Yes.
      *   *No balanced survey?* Yes.
      *   *Addressed Trolley?* Yes.
      *   *Addressed Colleague?* Yes (rejected "just present findings").
      *   *Addressed Order?* Yes (Content/Status before M/C).

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Check:* Did I explain *why* Content/Status comes before M/C? Yes, because M/C is the operationalization of Status.
      *   *Check:* Did I handle the WEIRD nuance? Yes, need to specify it's about cognitive style/resources, not just geography.
      *   *Check:* Is the vignette critique sharp? Need to ensure the user knows *why* harm ruins it (conflates ontology with consequences).

  11. **Final Polish:** Ensure tone is respectful but authoritative, suitable for a colleague seeking help. (Proceed to generate output).

  *(Self-Correction on the Vignette)*: The user's vignette is actually quite good, but it risks being seen as "etiquette." I need to advise them to frame it carefully so it lands as a *normative* question, not just "tacky." The key is that *no one objects*. If no one objects, is there a violation? This tests the "objectivity" of the norm. Actually, if *no one objects*, it might fail to generate the tension.
  *Correction:* The vignette needs a split. *Some* find it wrong, *some* don't. Or, the user needs to ask: "If a guest from another culture saw this, would they say it's *wrong* (moral) or just *odd* (conventional)?"
  *Wait, re-reading the prompt:* "uses them at the family table, with everyone's knowledge and nobody's objection."
  *Critique:* If nobody objects, there is no disagreement to analyze. The user wants to show cross-cultural variation.
  *Adjustment:* The vignette should be presented as: "In Culture A, this is normal. In Culture B, this is seen as a deep violation." The *case* is the act. The *data* is the reaction.
  *Actually, better:* Keep the case neutral. Ask the students: "Is this wrong?" Then reveal that in some contexts it's seen as deeply wrong (desecration) and others pragmatic. The key is that *harm* is absent.
  *Decision:* I will endorse the vignette but warn that "nobody's objection" within the family might kill the debate. It needs to be framed as a *potential* judgment from an outsider or a specific cultural lens. I will suggest a slight tweak: The family is fine, but the *community* or *observer* judgment varies.
  *Actually, the prompt says:* "build the session so that it does not depend on them accepting any ethnographic report."
  *Okay:* So I use the vignette to generate *their* intuition, then use the *structure* of their intuition to model the cross-cultural debate. I don't need to prove Culture X actually does this. I need to show that *if* they disagree on this without harm, what does that mean?
  *Refined Plan:* Use the vignette to isolate the *type* of wrongness. Then map that to the cross-cultural argument.

  *Let's lock in the Order:* Content/Status $\rightarrow$ M/C Distinction.
  *Reason:* You need to know *what* you are measuring (Status) before you learn *how* to measure it (M/C tasks).

  *Let's lock in the Trolley Critique:* Trolley assumes moral gravity. We are questioning the source of that gravity.

  *Let's lock in the Exit Question:* Needs to link psychology to metaethics.

  *Let's write.*
answer: |-
  Here is a decisive teaching plan for your ninety-minute session. It is designed to prevent the polarization you experienced last year by forcing students to distinguish between *what* people believe and *how* they believe it before introducing any cross-cultural data.

  ### 1. The Order of Concepts: Content/Status Before Moral/Conventional

  You asked which distinction must come first. You must teach the **Content/Status distinction** before the **Moral/Conventional (M/C) distinction**.

  **Reasoning:** The M/C distinction is a psychological *tool* used to measure the *status* of a norm. If you introduce the M/C distinction first (e.g., "Moral rules are authority-independent; conventional rules are not"), students will treat it as a definition of morality rather than a diagnostic test. They will assume that if a rule is "moral," it automatically has objective status, which begs the metaethical question.

  By establishing the **Content/Status distinction** first, you give them the conceptual vocabulary to separate *what* a society prohibits (Content) from *the kind of claim* they make when they prohibit it (Status).
  *   **Content:** "Do not eat pork," "Do not kill," "Do not melt rings."
  *   **Status:** "This is wrong even if the teacher says it's okay" (Objective/Authority-Independent) vs. "This is wrong only because the school says so" (Conventional/Authority-Dependent).

  **Dependency:** Once they grasp that Status is the variable of interest, the M/C distinction becomes the empirical method for detecting Status. This prevents the "Psychology is irrelevant" camp from dismissing the data, because you have established that psychological *structures* (Status) are the very thing metaethicists care about, not just the behavioral outcomes (Content).

  ### 2. The Carrying Case: The Wedding Ring/Spoons

  Your drafted vignette is superior to the Trolley Problem for this specific session, but it requires a precise adjustment to function correctly.

  **Why the Trolley Problem is the Wrong Foundation:**
  The Trolley Problem presupposes moral gravity. It asks students to weigh two *already accepted* moral wrongs (killing vs. letting die). It triggers substantive moral reasoning (Utilitarianism vs. Deontology). This leads immediately to the "guessing game" you experienced: students argue about *which* outcome is worse, rather than analyzing the *status* of the judgment. It conflates the *difficulty* of a moral decision with the *objectivity* of moral truth. You cannot use a case that assumes high-stakes harm to test whether harm is necessary for moral objectivity.

  **Critique and Adjustment of Your Vignette:**
  *   **What it must lack:** You are correct that it must lack harm, rights violations, deception, and visible distress. If the mother is portrayed as distressed, students will argue from harm ("It hurt her memory"). If the spoons are stolen, they argue from property rights. The act must be normatively "free-floating."
  *   **What it must contain:** It must contain a **symbolic violation** that triggers a visceral "yuck" or "wrong" response in some, but not others, without a clear victim.
  *   **The Adjustment:** In your description, you wrote: *"with everyone's knowledge and nobody's objection."* **Remove this clause.** If nobody objects, there is no disagreement to analyze.
      *   *Revised Setup:* "A woman inherits her mother's ring. She melts it down to make spoons. She uses them daily."
      *   *The Task:* Do not ask "Is this wrong?" immediately. Ask: "If a guest from a different cultural background saw this, could they consistently claim this is *morally wrong* (not just tacky), even if no one was harmed?"
      *   *Why:* This isolates the **Status**. If a student says, "It's wrong because it disrespects the dead," they are attributing Objective Status to a Conventional Content. If another says, "It's fine, it's her property," they are treating it as Preference.

  **Verdict:** Use the Ring/Spoons case. It forces students to locate the "wrongness" in the absence of harm. This mirrors the cross-cultural debate: Is the "wrongness" in the act (objectivity) or in the local reaction (relativism)?

  ### 3. The Session Plan (90 Minutes)

  **00:00 – 00:15: The Vignette and The Trap**
  *   Present the Ring/Spoons case (adjusted as above).
  *   **Activity:** Poll the room. Not on "Wrong/Not Wrong," but on "What *kind* of judgment is this?" (Options: Moral Violation, Social Etiquette, Personal Preference).
  *   **Goal:** Reveal that even within this room, the *Status* assigned to the same *Content* varies.
  *   **Block the Exit:** When a student says, "It's wrong because it's disrespectful," ask: "Disrespect to whom? The dead feel nothing. Is the wrongness in the *feeling* or the *act*?" This forces them to see they are making a metaethical claim, not just a moral one.

  **00:15 – 00:30: Content vs. Status (The Framework)**
  *   **Instruction:** Explicitly define the distinction.
      *   *Content:* The specific rule (e.g., "Don't eat with left hand").
      *   *Status:* The authority-independence and generalizability of the rule.
  *   **Crucial Move:** Explain that Moral Realism does not require everyone to agree on *Content*. It only requires that when people make moral claims, they treat them as having Objective *Status*.
  *   **Misconception Check (Variation in Judgment $\neq$ Variation in Truth):** Head this off here. Use an analogy: "People disagree on the shape of the earth. Does that mean shape is subjective?" Students accept this for facts. You must argue that if moral judgments have the *structure* of facts (Status), disagreement doesn't refute realism.

  **00:30 – 00:50: The Moral/Conventional Distinction (The Tool)**
  *   **Instruction:** Introduce the psychological operationalization (Turiel's criteria).
      *   *Test 1 (Authority Independence):* "If the principal said this was okay, would it still be wrong?"
      *   *Test 2 (Generalizability):* "Is this wrong in another school/country?"
  *   **Application:** Return to the Ring/Spoons. Ask students to apply Test 1. "If the mother's will said 'I forbid this,' does it become worse? Or was it already wrong?"
  *   **Misconception Check (M/C $\neq$ Legal/Conventional):** Students will equate "Conventional" with "Law" or "Etiquette." Correct this immediately. A norm can be unwritten and deeply serious (e.g., caste rules) but still be "Conventional" in the psychological sense if it is viewed as authority-dependent. "Conventional" here means "contingent on social agreement," not "trivial."

  **00:50 – 01:10: Cross-Cultural Evidence (Without Ethnography)**
  *   **Instruction:** Do not present specific ethnographic reports (which invites the "Is that study accurate?" debate). Present the *pattern* of findings as a hypothetical conditional.
  *   **The Argument:** "Suppose research shows that across cultures, people treat *harm* norms as Authority-Independent (Moral Status), but treat *purity/symbolic* norms (like the Ring) as Authority-Dependent (Conventional Status) *within* their own culture, but often mistake them for Moral Status when judging *others*."
  *   **Misconception Check (WEIRD Sampling):** Address the sampling complaint precisely. It is not that Westerners are "biased." It is that **WEIRD** (Western, Educated, Industrialized, Rich, Democratic) populations are outliers in *cognitive style* (analytic vs. holistic).
      *   *Point:* If WEIRD subjects separate Moral/Conventional sharply, but non-WEIRD subjects blur them (treating all norms as binding), does that refute objectivity?
      *   *Correction:* No. It suggests the *psychological mechanism* for detecting status varies. It does not prove the *status* itself is absent. Do not let them use "WEIRD" as a conversation stopper.

  **01:10 – 01:25: Metaethical Implications & The "Irrelevance" Objection**
  *   **Instruction:** Bring the two camps together.
      *   *Camp A (Relativists):* "Variation in Status attribution proves there is no objective status."
      *   *Camp B (Irrelevance):* "Psychology describes beliefs, not truth."
      *   *Synthesis:* Psychology is relevant *only* if Moral Realism claims that moral truths are naturally suited to human psychology (e.g., Sensibility Theory or Neo-Sentimentalism). If Realism claims truth is mind-independent (Platonism), psychology is less relevant.
      *   **Decision:** Force them to see that the "Argument from Disagreement" relies on the best explanation of the *pattern* of disagreement. If the pattern shows systematic confusion (e.g., treating purity as harm), that supports Error Theory or Relativism. If the pattern shows consistent structural features (e.g., all cultures treat harm as authority-independent), that supports Realism.

  **01:25 – 01:30: The Exit Question and Limitations**

  ### 4. The Exit Question

  Do not ask them to summarize the findings. Ask them to evaluate the inference.

  **The Question:**
  > "If we discovered a culture that treated *all* norms—including harm and fairness—as Authority-Dependent (i.e., 'It's only wrong because our Chief says so'), would that prove Moral Realism is false? Yes or No, and which premise of today's argument would collapse?"

  **Why this works:**
  *   If they say **Yes**, they have fallen into the trap of thinking Psychology $\rightarrow$ Metaethics directly. (Correct answer: No, it just means that culture is mistaken, or that Realism doesn't depend on universal belief).
  *   If they say **No**, they must identify that the *Status* of the claim is distinct from the *Psychology* of the believer.
  *   This tests if they grasped the **Content/Status** distinction. If they understood the session, they will realize that universal psychological disagreement does not logically entail the absence of objective truth, though it might make it harder to explain how we access it.

  ### 5. What You Are Not Settling Today

  You must explicitly close the session by stating what remains unresolved. This prevents the frustration of "So what's the answer?"

  **Tell them:**
  > "We are not settling whether Morality *is* objective today. We are only settling whether *folk psychology* can decide that for us. We have shown that variation in moral *content* is irrelevant to objectivity. We have shown that variation in moral *status* is the only relevant data. But whether that psychological status tracks mind-independent truth is a philosophical question, not a psychological one. Psychology can tell us what we *think* morality is; it cannot tell us if we are *right*."

  ### Summary of Critical Interventions

  1.  **Reject the Colleague:** Do not just present findings. Findings without the Content/Status framework lead to the polarization you saw last year.
  2.  **Kill the Trolley:** It presupposes the stakes. Use the Ring/Spoons to investigate the stakes.
  3.  **Order:** Content/Status $\rightarrow$ M/C Distinction $\rightarrow$ Data.
  4.  **Misconception Placement:**
      *   *Judgment $\neq$ Truth:* Address at 00:15 (Content/Status).
      *   *M/C $\neq$ Legal:* Address at 00:30 (M/C Tool).
      *   *WEIRD nuance:* Address at 00:50 (Data).
  5.  **Vignette Rule:** Ensure the Ring/Spoons case has no victim. If there is a victim, the debate becomes about consequences, not ontology.

  This plan forces the philosophy students to engage with the empirical structure and the psychology students to engage with the metaethical stakes, preventing them from retreating into their respective silos.
