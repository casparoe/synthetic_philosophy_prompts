  ### The Prompt

  **Role:** You are an ethicist specializing in moral psychology and animal ethics.

  **Task:** Analyze the 2016 incident involving Harambe the gorilla at the Cincinnati Zoo through the lens of **Moral Attribution and Sentience**.

  **Contextual Facts:**
  *   A 3-year-old child climbed into the gorilla enclosure.
  *   Harambe, a 17-year-old western lowland gorilla, approached the child. Witnesses and video footage conflicted on whether Harambe was aggressive or protective.
  *   Zoo officials shot and killed Harambe to secure the child.
  *   The incident sparked global outrage, memorialization of Harambe, and conspiracy theories blaming the parents.

  **Theoretical Framework:**
  Standard analyses often focus on *cognitive capacity* (e.g., "Was Harambe self-aware?") to determine moral status. **Do not use this standard framing.**

  Instead, apply the niche concept of **"Affective Realism in Moral Status."** This theory suggests that moral standing is often attributed retrospectively based on the *intensity of the observer's emotional response* rather than the entity's intrinsic properties. In this view, Harambe's "sentience" was socially constructed through the magnitude of public grief and outrage, effectively bypassing biological metrics.

  **Instructions:**
  1.  **Describe** how the public narrative shifted Harambe from "dangerous animal" to "moral victim" using the Affective Realism lens.
  2.  **Analyze** the conflicting attributions of intent (was he aggressive or protective?) and explain how this ambiguity fueled the affective response.
  3.  **Critique** the zoo's decision-making not on utilitarian grounds, but on how it failed to account for the *relational sentience* the public had already projected onto the animal.
  4.  **Conclude** with a reflection on how this episode reveals a flaw in human moral attribution systems when faced with "ontological ambiguity" (entities that are neither fully human nor mere objects).

  **Constraints:**
  *   Avoid standard utilitarian or deontological arguments unless contrasting them with the Affective Realism framework.
  *   Maintain an objective, analytical tone.
  *   Ensure the distinction between *biological sentience* and *attributed moral status* is clear throughout.
