answer: |-
  For thirty-five years I modeled ocean circulation. If I ignored viscosity and got the right current, I could always add the viscosity back in to check the mechanism. It was scaffolding.

  Then I read Friedman. He says: "If the prediction holds, the assumption doesn't need to be true. Treat the system *as if* the assumption were true."

  So I tested it. I built a model where I assumed gravity was zero. The water still flowed downhill. It turned out I'd hard-coded the pressure gradient into the boundary conditions.

  The prediction was perfect. The assumption was false. And the assumption was doing all the work—the wrong work.

  Friedman says this distinction is irrelevant. But I still don't know how to tell that apart from actually understanding fluid dynamics.

  I'm looking forward to this workshop because I need to ask the economists: When your representative agent maximizes utility, how do you know you haven't just hard-coded the recession into the boundary conditions?

  ***

  **Note on the Philosophy**
  The joke presupposes the "false engine" objection: that predictive success alone cannot distinguish between a harmless idealization and a false assumption that drives the result incorrectly. While Friedman's instrumentalism (that assumptions need not be realistic) is settled exegesis, its defensibility is not. Realists argue that without true mechanisms, predictions may fail under intervention, while instrumentalists maintain success is sufficient. The joke takes liberties by implying the modeler *checks* the assumption after the fact; strict instrumentalism discourages this as unnecessary. However, the core epistemic worry—that we cannot distinguish luck from law using prediction alone—is a live contest in the literature, not a settled rejection. The punchline relies on the contested view that "walk-backable" idealizations (viscosity) are epistemically superior to "non-walk-backable" ones (representative agents), a distinction many instrumentalists would dispute.
