answer: |-
  You are right to suspect there is no single rule. Your intuitions are actually more sophisticated than the standard "Material Conditional" taught in introductory logic, which is why that system feels like it's breaking. You are intuitively tracking distinctions that philosophers and linguists have spent decades formalizing.

  To save your core verdicts (The Mary Pair, the 2+2 Rejection, and the Die Asymmetry), you cannot have one principle. You need **Two Principles** separated by a **Relevance Constraint**.

  Here is the precise framework that fits your data.

  ### Principle 1: The Indicative (Epistemic Supposition)
  **Applies to:** "If it rains...", "If it's even...", "If you're hungry..."
  **Rule:** An indicative conditional is true if, when you add the antecedent to your *current knowledge state* (without changing the past), the consequent follows via a **relevant connection**.

  *   **Why it saves the Mary Case:** In "If it wasn't Mary... someone did," you are reasoning from your current knowledge that *the memo was leaked*. You hold that fact fixed. You just swap the leaker.
  *   **Why it saves the 2+2 Case:** Adding "2+2=4" to your knowledge does not make "snow is white" follow *relevantly*. They are disjoint facts. The connection is missing.
  *   **Why it saves the Biscuits Case:** The connection here is **pragmatic**, not causal. The truth of the sentence relies on the speaker's knowledge. "If you are hungry [condition for offer], there are biscuits [fact available to satisfy condition]." The relevance is the *availability of information*, not hunger causing biscuits.
  *   **Why it saves the Picnic Case:** This logic is **non-monotonic**. Adding "we move it indoors" changes the background knowledge enough to break the link to "cancelled."

  ### Principle 2: The Counterfactual (Metaphysical Rewrite)
  **Applies to:** "If Mary *hadn't*...", "If it *were* raining..."
  **Rule:** A counterfactual is true if, in the **closest possible world** where the antecedent is true (rewriting history minimally), the consequent is also true.

  *   **Why it saves the Mary Case:** In "If Mary *hadn't* leaked...", you must rewind time. In that nearest world, the motivation to leak might vanish. You don't hold "the memo was leaked" fixed as a fact anymore; you test if it *would be* leaked. Hence, you reject it.
  *   **Why it saves Contraposition (Paris):** "If he's in Paris he's in France" is conceptually necessary. In any world where he is in Paris, he is in France. Contraposition holds because the connection is analytic.
  *   **Why it saves Contraposition (Die):** "If even, not six" (in your context) is contingent. Contraposition fails here because the "closest world" where it is a six is not the same logical space as the "closest world" where it is not even.

  ### The Relevance Constraint (The "2+2" Blocker)
  Both principles require a **relevant connection** between antecedent and consequent. This blocks "If 2+2=4 then snow is white." Even though both are true, there is no dependency, causal link, or informational bridge. This is what separates your view from the "Material Conditional."

  ---

  ### Prediction for a New Case
  Here is a case you didn't list, applying the **Two-Principle** split:

  **The Case:** "If Shakespeare didn't write *Hamlet*, someone else in his company did" (Indicative) vs. "If Shakespeare hadn't written *Hamlet*, someone else in his company would have" (Counterfactual).

  **Prediction:**
  1.  **Indicative:** You should **accept** this. (Given the fact that *Hamlet* exists and was written by the company, if not Will, then it was Burbage or another scribe).
  2.  **Counterfactual:** You should **reject** (or be skeptical of) this. (If Will hadn't written it, maybe the play never gets written at all; the specific genius required might not have been there).

  If your gut matches this prediction, the Two-Principle model is confirmed.

  ---

  ### The Honest Cost: What You Have to Give Up
  You asked me to be honest about which verdicts this principle can't save without modification. Here are the three costs:

  **1. The "Die" Math (Contextual Sacrifice)**
  You said: *"If the die comes up even, it's not a six" — sure, I'd accept that.*
  **The Cost:** On a standard die, 6 is even. To save your intuition, this principle requires that you are implicitly talking about a **restricted context** (e.g., a 4-sided die, or a scenario where 6 is already ruled out). If we treat "die" as a standard 6-sided cube, your verdict is mathematically false, and no logic can make it true. I am assuming you mean "In the context you are imagining, 6 is excluded from 'even'." If you insist 6 is even and the sentence is still true, you are operating on a private definition of "even."

  **2. The Status of "Biscuits" (Semantic Sacrifice)**
  You said: *"If you're hungry there are biscuits" — perfectly fine thing to say, true even.*
  **The Cost:** Strictly speaking, under Principle 1, this isn't a "truth-apt" proposition in the same way "If it rains, the match is off" is. It is a **speech act** (an offer). My principle saves it by calling the relevance "pragmatic," but I have to admit that logically, your hunger has zero bearing on the biscuits' existence. You are accepting this as "true" only because you interpret the sentence as "I am telling you where biscuits are, relevant to your hunger." If you strip the pragmatics, the conditional link is weak.

  **3. Contraposition Consistency (Logical Sacrifice)**
  You said: *Contraposition works for Paris/France but fails for the Die.*
  **The Cost:** You have to accept that **Contraposition is not a universal rule.** It is valid only for *Analytic/Conceptual* connections (Paris/France) but invalid for *Contingent/Empirical* connections (Die/Rain). This means you cannot use contraposition as a general proof tool. You have to check the *type* of connection first.

  ### Summary
  Your gut is splitting because you are trying to force **Epistemic** reasoning (what do I know?), **Metaphysical** reasoning (how could the world have been?), and **Pragmatic** reasoning (what are you offering me?) into one box.

  **The Verdict:** Adopt the **Two-Principle Model** (Indicative vs. Counterfactual) with a **Relevance Constraint**. It saves your strongest intuitions (Mary, 2+2, Picnic) at the cost of admitting that "If P then Q" is not one single logical operator, but two different ones that look the same in English.
