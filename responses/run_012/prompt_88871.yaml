answer: |-
  This is a profound and precisely articulated puzzle. You have identified a structural feature of certain scientific theories that sits uncomfortably between the rigorous demands of falsificationism and the practical reality of causal mechanisms that operate on timescales exceeding human observation.

  You are correct that "right but early" is a slogan, not a concept. It describes the *sociological* fate of the predictor, not the *epistemic* status of the theory.

  There is no single canonical term in the philosophy of science that captures this entire situation, because it sits at the intersection of logic, ontology, and methodology. However, we can carve it out by assembling three established concepts that, when combined, describe exactly the epistemic situation you are in.

  Here is how the situation ought to be carved, the concepts that come closest, and a proposal for how to name the specific edges of this phenomenon.

  ### 1. The Logical Form: Existential Claims over Time
  The most fundamental description of your puzzle comes from Karl Popper's analysis of **existential statements**.

  *   **The Concept:** A statement of the form "There exists a time $t$ such that Collapse occurs" ($\exists t : C(t)$).
  *   **Why it fits:** In formal logic, an existential claim is verifiable (you only need to find one instance of collapse) but **not falsifiable**. No matter how long you wait without a collapse, you have not proven that a collapse *never* happens; you have only proven it hasn't happened *yet*.
  *   **Where it falls short:** Popper generally dismissed such claims as "metaphysical" rather than scientific because they lack empirical risk. But you rightly insist your theory is not vacuous—it names a mechanism (resource limits). Pure logical existentialism doesn't capture the *causal weight* that makes the theory feel scientific despite its logical immunity.

  ### 2. The Ontological Form: Tendency Laws and Capacities
  To capture the "mechanism" aspect (why it's not vacuous), we turn to the philosophy of **Tendency Laws** (J.S. Mill) and **Capacities** (Nancy Cartwright).

  *   **The Concept:** A tendency law does not predict an event; it predicts a *pressure* or a *disposition*. Cartwright argues that fundamental laws describe what a thing *can* do (its capacity), not necessarily what it *will* do in a complex environment where other forces interfere.
  *   **Why it fits:** This explains why the delay does not refute the theory. The "Malthusian pressure" is real and operative (the capacity exists), but it is counteracted by other capacities (technology, substitution). The theory claims the pressure *must* eventually win, but treats the timing as a function of the vector sum of all forces, which is unknown.
  *   **Where it falls short:** Tendency claims are often treated as *ceteris paribus* (all else being equal) laws. Your theory is stronger: it claims the collapse is *inevitable*, not just that the pressure exists. It claims the interfering factors are temporary, while the capacity is permanent.

  ### 3. The Methodological Form: Structural Immunization
  You distinguish this from *ad-hoc* rescue (Lakatos' "protective belt"), and you are right to do so. In an *ad-hoc* rescue, the theory is modified *after* a failure to accommodate the data. In your case, the vagueness was *intrinsic* from the start.

  *   **The Concept:** This is best described as **Intrinsic Temporal Immunity**. It is a form of **Immunization Strategy** (Hans Albert) that is built into the **Hard Core** of the theory (Lakatos) rather than the protective belt.
  *   **Why it fits:** It explains why the theory survives. The parameter (time) required to falsify the theory is structurally excluded from the theory's definition.
  *   **Where it falls short:** "Immunization" usually carries a pejorative connotation of dogmatism. You are asking if this can be a legitimate scientific stance.

  ### A Proposal for Naming: "Temporally Unbounded Existential Prediction"

  If we synthesize these, the epistemic situation you describe is a **Temporally Unbounded Existential Prediction (TUEP)** grounded in a **Causal Capacity**.

  However, to give it a more functional name that distinguishes it from mere vagueness, I propose the term **"Asymptotic Causal Claim."**

  *   **Asymptotic:** The system approaches a limit (collapse) indefinitely; the prediction is about the limit, not the trajectory.
  *   **Causal:** It relies on a mechanism, distinguishing it from a mere statistical trend.
  *   **Claim:** It asserts truth, not just heuristic value.

  ### Carving the Edges: How to Distinguish It

  To determine if this warrants a distinct term, we must distinguish it from its neighbours. Here is how to carve the boundaries:

  #### 1. The Clear Case (Your Fishery Model)
  *   **Structure:** Mechanism identified (biological limit). Outcome specified (collapse). Timescale unspecified.
  *   **Status:** **Asymptotic Causal Claim.**
  *   **Epistemic Value:** High. It identifies a real constraint. The delay is explained by auxiliary factors (tech) that are known to be finite.
  *   **Vindication:** When collapse happens, it confirms the *mechanism*, not the *timing*.

  #### 2. Merely Adjacent: "Tendency Statements" (Cartwright)
  *   **Structure:** "Smoking tends to cause cancer."
  *   **Difference:** A tendency claim allows for exceptions that do not invalidate the law. If a smoker lives to 100, the law stands. In your case, if the fishery *never* collapses (e.g., perfect management forever), the theory is false. Your claim is stronger than a tendency; it is an **inevitability claim**.
  *   **Why it's adjacent:** It shares the "pressure vs. outcome" distinction, but lacks the "eventual necessity."

  #### 3. Merely Adjacent: "Self-Defeating Prophecies" (Reflexivity)
  *   **Structure:** "The bank will fail" $\rightarrow$ Depositors withdraw $\rightarrow$ Bank fails. OR: "The bank will fail" $\rightarrow$ Regulators intervene $\rightarrow$ Bank survives.
  *   **Difference:** This is about **causality flowing from the prediction to the system**. Your puzzle is about **causality flowing from the system to the prediction**. You explicitly noted this distinction. In your case, the delay is caused by *substitutes/tech*, not by the *belief in the theory*.
  *   **Why it's adjacent:** Both involve a gap between prediction and outcome, but the mechanism of the gap is different (Reflexivity vs. Resource Substitution).

  #### 4. The "Different Thing Altogether": Ad-Hoc Rescue (Lakatos)
  *   **Structure:** Theory predicts collapse at $t_1$. Failure occurs. Theorist adds a new clause: "Unless technology X appears."
  *   **Difference:** This is **retrospective patching**. The theory was specific, failed, and was then amended. In your case, the theory was *never* specific about time. The vagueness is a feature, not a bug fix.
  *   **Why it's different:** Ad-hoc rescue degrades a theory's scientific status. Intrinsic temporal indeterminacy *preserves* it (by avoiding falsification) but risks making it metaphysical.

  ### The Core Epistemic Tension

  The reason you cannot get past this is that it highlights a conflict between **Logical Falsifiability** and **Causal Realism**.

  1.  **Logically:** The theory is weak. It is an existential claim that cannot be falsified in finite time. By Popper's strict demarcation, it borders on metaphysics.
  2.  **Causally:** The theory is strong. It identifies a hard constraint of the physical world (carrying capacity). To demand a specific date is to demand knowledge of *innovation rates* and *political will*, which are outside the ecological model.

  Therefore, the theory is **Causally Determinate but Temporally Underdetermined.**

  ### Conclusion: Does it warrant a term?

  Yes. The situation describes a class of theories that are **Robustly Vague**. They are vague on purpose, not out of ignorance, because precision would be dishonest (given the variables involved).

  I suggest the term **"Open-Horizon Causal Prediction."**

  *   **Open-Horizon:** The time parameter is essentially infinite/unbounded.
  *   **Causal:** It is not a curve fit; it relies on a mechanism.
  *   **Prediction:** It claims an event *will* occur, not just that a risk exists.

  **The Definition:** An Open-Horizon Causal Prediction is a theoretical claim that posits a necessary future state resulting from a specific mechanism, where the timing of that state is structurally indeterminate due to the influence of exogenous variables, rendering the claim verifiable only in retrospect but immune to falsification during the delay.

  **Why this matters:**
  Recognizing this category allows us to stop arguing about whether the theory is "scientific" (in the Popperian sense) or "metaphysical." It is a hybrid. It functions as a **Regulative Ideal** (Kant): it guides research and warns of limits, even if it cannot generate a precise calendar date.

  The "vindication" upon collapse is not a standard confirmation. It is what we might call **"Retrospective Mechanism Validation."** The date was wrong (because it didn't exist), but the mechanism is confirmed. The critics who say "it was refuted by the delay" are applying a **Point-Prediction Standard** to an **Asymptotic Claim**. The defenders who say "it was vindicated" are applying a **Mechanism-Standard**.

  Both are right about the logic, but they are judging different objects. Your puzzle arises because the theory presents itself as a Prediction (inviting the Point Standard) but defends itself as a Mechanism (inviting the Asymptotic Standard).

  That switch is the heart of the matter. It is not "right but early." It is **"Mechanism-Right, Timeline-Null."**
