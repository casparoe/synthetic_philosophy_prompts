answer: |-
  The interventionist criterion provides a rigorous framework for evaluating claims about neural representations, demanding covariation, specific causal efficacy, and cross-run stability. While this triad is philosophically attractive, a close examination of current mechanistic interpretability reveals that no component of a standard trained network has been shown to satisfy all three conditions simultaneously. Consequently, ontological realism regarding neural representations—the view that these components genuinely instantiate features in a mind-independent sense—is unwarranted. We should instead adopt an instrumentalist stance, treating talk of "features" as useful shorthand for input-output behaviors rather than descriptions of internal ontological structure.

  ### The Empirical Gap

  Current evidence fails to clear the bar set by the interventionist criterion, particularly on conditions (2) and (3). Condition (1), covariation, is trivially satisfied by probing classifiers and feature visualization; neurons often correlate with human-interpretable concepts. However, correlation is not representation. The failure lies deeper.

  Condition (2) requires that interventions on $C$ change downstream behavior in a way that *tracks X specifically* rather than merely degrading performance. Current techniques like activation steering or causal scrubbing often fail this specificity test. When we intervene on a putative "gender" neuron, we frequently introduce artifacts, blur images, or disrupt syntax, indicating that the component is entangled with other features (polysemanticity). The intervention breaks the network's coherence rather than cleanly swapping the feature value. This suggests $C$ is not a modular carrier of $X$, but a distributed, entangled contributor to a loss-minimizing heuristic.

  Condition (3) requires stability across independently trained networks. This is the most significant hurdle. Neural networks exhibit permutation symmetries and converge to different local minima. A feature represented by neuron 50 in Run A might be represented by a linear combination of neurons 12 and 99 in Run B, or encoded in a completely different subspace. While recent work on "canonical bases" attempts to align these spaces, no robust, architecture-agnostic mapping has been established. If the physical substrate of the "representation" changes entirely between training runs, positing a stable representational entity is metaphysically precarious.

  ### Critique of the Criterion

  In this argument, Condition (1) is dispensable; covariation is a prerequisite for detection but proves nothing about causal status. Condition (2) is the empirical engine; without specific causal control, we cannot distinguish representation from correlation. However, Condition (3) is doing the **real philosophical work** in ruling out realism. It distinguishes between a robust computational kind and an accidental artifact of a specific training trajectory.

  That said, Condition (3) is plausibly too strong. It risks conflating *implementation stability* with *functional stability*. In biological neuroscience, we attribute representations to brains despite significant individual variation in wiring. Similarly, in software engineering, a variable representing `user_id` exists even if compiled to different memory addresses on different machines. Demanding activation-level stability across training runs may reject valid representations simply because the network found a different way to compute them.

  ### The Strongest Realist Reply

  The strongest reply from a realist invokes **Functionalism**. A realist would argue that Condition (3) is mispecified. We should not look for stability in the *weights* or *activation indices*, but in the *causal role*. If Component $C$ in Network 1 and Component $C'$ in Network 2 both mediate the same counterfactual dependencies between input $X$ and output $Y$, they realize the same representation, regardless of physical dissimilarity. The realist argues that our failure to find stable weight alignments is merely a technical limitation of our current "neuroscience" of ANNs, not evidence that the representations don't exist. We should relax Condition (3) to require functional isomorphism rather than structural identity.

  ### Response to the Realist

  This functionalist defense collapses into circularity. To identify a component $C$ solely by its causal role relative to $X$ and $Y$ is to define the representation by the very input-output behavior it is supposed to explain. If we cannot identify $C$ independently of the behavior it produces (which structural stability would allow), then positing $C$ adds no explanatory power beyond the input-output map itself. Realism requires that the internal structure constrain the behavior; if the internal structure is allowed to vary arbitrarily so long as the behavior remains fixed, the "internal representation" becomes an occult posit. Until we can identify components structurally (satisfying a robust version of Condition 3) *before* verifying their function, we have not found representations; we have merely labeled heuristics.

  ### Conclusion

  Because current evidence fails to demonstrate specific, non-degrading interventions (Condition 2) and lacks cross-run structural stability (Condition 3), the interventionist criterion is not met. While Condition 3 may be stringent, relaxing it to pure functionalism undermines the explanatory value of positing internal representations. Therefore, realism is unwarranted.

