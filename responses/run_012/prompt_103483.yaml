prompt: |-
  For this task, adopt the following criterion for when an internal component of a trained neural network represents a feature of the input, and call it the interventionist criterion. A component C represents feature X just in case (1) C's activity covaries with X across the input distribution, (2) some intervention on C's activity, holding the input fixed, changes the network's downstream behavior in a way that tracks X specifically rather than merely degrading performance, and (3) the component-to-behavior mapping induced by such interventions is stable across independently trained networks of the same architecture and objective. Argue for the position that current interpretability evidence does not establish that any component of a standard trained network satisfies all three conditions, and that realism about neural representations is therefore unwarranted. Make the argument as strong as you can, but do not treat the criterion as obviously correct: say which of the three conditions is doing the real work, which is dispensable or plausibly too strong, and give the strongest realist reply along with your response to it. Close with a JSON object containing the fields position (one sentence), key_premises (a list), decisive_condition, strongest_objection, reply, and evidence_that_would_overturn_the_position.
