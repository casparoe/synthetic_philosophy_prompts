answer: |-
  The rain wasn't falling so much as hanging in the air, a suspended threat that smelled of brine and rotting pilings. Inside, the kitchen light hummed, flickering just enough to make the shadow of my hand tremble on the claim form.

  Box 4: *Maximum Claim Cap.*

  I held the pen over the line. Below it, the fine print of the Co-op charter reminded me of the arithmetic. If the average cap across the neighborhood stayed below twenty percent, the flood fund released full coverage for everyone. If the average crept higher, the payout degraded exponentially. But the kicker—the thing that kept us all awake during storm season—was the outlier clause. If I capped at twenty percent while everyone else capped at eighty, I got nothing, and they got the jackpot. If I capped at eighty while everyone else held the line at twenty, I saved my house and bankrupted the collective.

  The rational move, the cold-blooded move, was eighty. Defect. Take the money.

  But we weren't supposed to be cold-blooded. We were supposed to be readers of the Protocol.

  I looked at the mimeographed sheet pinned to the fridge. It was yellowed, smelling of old ink and damp paper. The founder, old man Halloway, had passed them out ten years ago when the insurance market collapsed and left us to each other. He called it *The Mirror Clause*.

  *Section 4, Paragraph 2:* "Do not decide against your neighbor. Decide as though your neighbor is running this same calculation. Your logic is their logic. To defect against them is to defect against yourself."

  It was Halloway's version of superrationality. If we are all identical reasoners, reading the same guide, standing in the same storm, then our decisions aren't independent variables. They are echoes. If I choose Cooperation, I am effectively commanding every other reader to choose Cooperation. If I choose Defection, I condemn us all to the scraps. So, logically, I must cooperate. Not out of kindness, but out of mathematical self-interest.

  I had believed it for years. It felt solid, like a beam load-bearing the roof. Until yesterday.

  I had gone to the town archive to look up the original zoning maps, and I found the box of leftover Protocols. There were two stacks. Most were the yellowed version on my fridge. But there was a smaller stack, crisp white paper, a second printing from three years ago.

  I compared them. Line by line. Everything was identical except Section 4, Paragraph 2.

  The yellow version said: "Your logic *is* their logic."
  The white version said: "Your logic *predicts* their logic."

  *Is* versus *Predicts*.

  Ontology versus probability. Certainty versus guesswork.

  I looked at the pen in my hand. Then I looked at the phone on the counter. Mara's number was speed-dial one. Mara, who lived three houses down, on the slightly higher ground. Mara, who had hosted the last reading group. Mara, who had lent me her copy of the Protocol last week when mine got soaked.

  Mara had the white version.

  I closed my eyes. The room spun. The elegance of Halloway's trap relied on symmetry. It required me to believe that when I sat here at 11 PM, Mara was sitting there at 11 PM, running the exact same algorithm. If we are identical machines, we output the same number. Therefore, I can choose the number that makes us both rich.

  But if Mara is running Version White, she isn't looking for identity. She's looking for prediction. She's asking, "What is the probability Elias defects?"

  If I assume she is me (Version Yellow), I must Cooperate. Because if I Defect, she Defects, and we both drown in the low-payout tier.
  But if she is Version White, she knows I might be Version Yellow. She knows the symmetry is broken. She knows that "Prediction" allows for error. If she thinks there's even a ten percent chance I'll defect, Version White tells her to defect to protect herself.

  And if she defects, and I cooperate... I lose everything. My house goes underwater. My books float.

  I opened my eyes. The shadow of my hand had stopped trembling. It looked like a claw.

  I tried to run the simulation again. I tried to step into Mara's head. I imagined her kitchen, the same hum of the fridge, the same rain. I imagined her looking at her white sheet. *Your logic predicts their logic.*

  She knows I have a Protocol. Does she know there are two versions?

  Probably not. She trusts the text. If she trusts the text, she trusts that our logic is linked. But her text says *predicts*. That word is a leak. It lets doubt in. It turns a logical lock into a statistical wager.

  If I write '20%' (Cooperate), I am betting that her version of *predicts* resolves to *is*. I am betting that she trusts me enough to ignore the probabilistic out.
  If I write '80%' (Defect), I am betting that she will defect too, or that I can steal the surplus if she doesn't.

  But here is the vertigo: If I decide to Defect because I think she has Version White, am I not confirming that Version White was correct? I am acting on the prediction that she will act on prediction.

  But if I decide to Cooperate, I am acting as if Version Yellow is true. I am forcing the symmetry. I am saying, "I don't care what her paper says, I care that she is Mara."

  But is Mara me?

  We grew up on this coast. We learned to read the tide charts together. We both joined the Co-op because we had nowhere else to go. In every meaningful way, we are the same organism. But that single word—*predicts*—inserts a wedge. It suggests that even if we are the same, we are separated by the uncertainty of the other's mind.

  I thought about the reading group. The scrappy little circle above the laundromat. We spent hours talking about this. "If you know the other guy is you, you can't stab him without stabbing yourself," someone had said. Someone who probably had the yellow sheet.

  Mara had been quiet that night. I wondered now if she was reading the white sheet in her lap. If she was already calculating the odds of my betrayal.

  The rain hammered harder against the window. A branch scraped the glass, a dry, skeletal sound.

  If I cooperate, and she defects, I am a fool. A martyr for a symmetry that doesn't exist.
  If I defect, and she cooperates, I am a thief. I save my drywall on the back of her trust.
  If we both defect, we are just two people in a flood, hoarding scraps while the water rises.

  The only way to win is if we both believe we are the same. But the existence of the white sheet proves we aren't. The physical object in her hand is different from the physical object in mine. The medium contradicts the message.

  I picked up the pen. The plastic was warm from my grip.

  I tried to think like Mara again. If I were Mara, holding the white sheet, knowing that I am Elias... what would I do?
  I would know that Elias is thoughtful. Elias worries. Elias wants to do the right thing.
  But Elias also knows about the typo. I found the stack yesterday. She hasn't seen them.

  So I have information she doesn't. I know the symmetry is broken. She thinks it holds.

  If I cooperate, I am exploiting her ignorance. I am counting on her believing in the mirror when I know the glass is cracked.
  If I defect, I am confirming the crack.

  My hand moved closer to the paper. The box for *Maximum Claim Cap* waited.

  There was no algorithm for this. Halloway was dead. The math assumed perfect information, but the information was corrupted by the mimeograph machine thirty years ago. A roller slipped. A letter changed. *Is* became *Predicts*.

  And now, at 11 PM, with the tide rising outside, the fate of my house rested on whether I believed Mara was me, or whether I believed she was a stranger running a simulation of me.

  If I choose Cooperate, I am praying that her prediction matches my identity.
  If I choose Defect, I am accepting that we are alone.

  I looked at the fridge. The yellow paper fluttered slightly in the draft from the window. *Your logic is their logic.*
  I looked at the memory of Mara's white paper. *Your logic predicts their logic.*

  The pen tip touched the paper. The ink bloomed, a tiny black star.

  I didn't know which number I was writing. I only knew that whatever number it was, it would define who I thought she was. And once I wrote it, I could never know if I was right. I would only know if I was dry.

  The pen dragged. The sound was loud in the quiet kitchen. I didn't look up. I couldn't bear to see if the hand shaking was mine or hers.
