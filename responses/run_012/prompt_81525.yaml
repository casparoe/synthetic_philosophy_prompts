answer: |-
  # Q&A Prep Sheet: Survival, Criteria, and Ayer's Verificationism

  **Context:** Departmental Colloquium Defense
  **Core Thesis:** Survival is not an empirical question because identity criteria are settled, not found. Ayer's verificationism, charitably read, supports this. Ayer's 1988 NDE is evidentially inert regarding survival.

  ---

  ### 1. The Parfitian Reductionist (Philosopher of Mind)
  **Objection:** "You are conflating the question of identity with the question of *what matters*. If reductionism is true, there is no 'further fact' of personal identity over and above psychological continuity and connectedness. By framing survival as a matter of choosing a criterion, you imply there is a gap to be bridged. But if identity just *consists* in those relations, your 'choice' is either trivial (we just describe the relations) or false (we pretend there's a decision to be made where there is only a description of causal chains. If Parfit is right, survival isn't a convention; it's a degree of relation. You're reifying a ghost that reductionism exorcised."

  **Reply:** "I agree that there is no 'further fact' in the metaphysical sense. That is precisely why the question cannot be settled by empirical facts alone. The facts give us the causal chains and the psychological connections. But whether *that* counts as 'survival' is not written in the chains themselves. Parfit tells us identity doesn't matter; I am arguing that the concept of 'survival' is the vessel we fill with those relations. Reductionism clears the ground of metaphysical realism, but it leaves us with the linguistic and practical task of deciding how to map our concepts onto the reduced facts. My point is not that there is a gap in the world, but that there is a gap in the logic of the concept 'person' once the metaphysics is settled. We still have to decide whether 'survival' tracks the body, the psychology, or the narrative."

  **Soft Spot:** I am leaning hardest on the premise that **conceptual analysis survives ontological reduction**. If the Parfitian argues that reductionism dissolves the concept of 'person' entirely rather than just reducing it, my talk of 'criteria' looks like I'm smuggling substance back in. If 'person' is eliminated rather than reduced, there is no subject left to survive or not survive.
  **Concession Strategy:** **Refuse to concede.** Hold the line that even reductionists use survival talk and need criteria for it.

  ### 2. The Ayer Historian (Historian of Analytic Philosophy)
  **Objection:** "This is a sophisticated reconstruction, but it risks anachronism. Ayer's verificationism in *Language, Truth and Logic* was semantic, not conventionalist in the later Wittgensteinian or Carnapian sense. He argued that talk of survival is cognitively meaningless because it lacks empirical truth-conditions, not that the truth-conditions are a matter of choice. By 1988, Ayer admitted his NDE didn't prove survival, but he didn't pivot to conventionalism; he remained an empiricist who found the experience psychologically compelling but evidentially null. You are reading a Kripkean 'fixing of reference' back into a text that was concerned with the elimination of nonsense. You are making Ayer more coherent than he was, at the cost of accuracy."

  **Reply:** "I am not claiming Ayer explicitly articulated a conventionalist theory of identity in 1936. I am claiming that the *logic* of his verificationism, when pressed on the specific case of survival, entails conventionalism. If meaning is use, and use is determined by verification conditions, and verification conditions for survival cannot be empirically fixed, then the determination of those conditions must be pragmatic or stipulative. My reading is charitable because it saves the insight from the charge of crude positivism. The 1988 episode supports this: Ayer treats the experience as real but refuses to let it settle the *identity* question. That hesitation is the conventionalist core: the facts are there, the label is the work we do."

  **Soft Spot:** I am leaning on the **charitable reconstruction premise**. If the Historian produces a specific text where Ayer explicitly rejects the idea that criteria are chosen and insists they are discovered empirically, my exegesis collapses.
  **Concession Strategy:** **Concede in part.** Admit Ayer's terminology was often semantic/empiricist, but maintain the *philosophical upshot* is conventionalist regardless of his specific labels.

  ### 3. The Philosopher of Religion
  **Objection:** "If criteria are chosen, then survival becomes stipulable. This renders the hope of immortality absurd. If I can simply choose a criterion under which I survive—say, 'survival is the persistence of my causal influence'—then I have secured immortality by fiat. But religious hope is not a decision; it is a desire for a discovery. It is the hope that *I*, this specific subject, will continue. If you turn this into a linguistic convention, you change the subject. You offer a grammatical consolation prize instead of the metaphysical bread. The stakes of the debate are lost if the answer is 'it depends on how we define our terms.'"

  **Reply:** "I am not saying you can stipulate that *you* survive regardless of the facts. I am saying we must stipulate what 'you' means in this context. The facts of the afterlife (if any) are fixed. The question is whether the subject of those facts bears the right relation to the subject who died to warrant the name 'same person.' Religious hope is often incoherent precisely because it demands a fact of the matter where there is only a concept. My view doesn't destroy hope; it clarifies it. It asks: 'What form of continuity would satisfy your concern?' If the answer is 'psychological continuity,' then we check the facts. If the answer is 'substantial identity,' we may find nothing. The hope shifts from 'Will I survive?' to 'Is there a form of continuity that matters to me?' That is a more honest hope."

  **Soft Spot:** I am leaning on the distinction between **fixing the outcome vs. fixing the criteria**. If the objector argues that for the religious believer, the criterion *is* the discovery (i.e., God guarantees the identity), my view looks like it imposes a secular framework on a theological claim.
  **Concession Strategy:** **Concede in part.** Acknowledge that for theists, God might fix the criterion, but maintain that for philosophy, the criterion remains a human conceptual tool.

  ### 4. The Neurologist (NDE Researcher)
  **Objection:** "You claim Ayer's NDE is evidentially inert. But the empirical literature on cardiac arrest shows that vivid, structured experience can occur when brain function is severely impaired or flatlined. If experience persists without the normal biological substrate, that *is* evidence relevant to survival. You are insulating the question from evidence by defining 'survival' in a way that ignores the data. If consciousness can operate independently of the brain's normal functioning, even for minutes, that challenges the materialist assumption that death ends the person. You are dismissing empirical data because it doesn't fit your conceptual schema."

  **Reply:** "I am not dismissing the data of the experience. I am dismissing its relevance to *personal identity*. Even if we grant that a stream of consciousness persists during cardiac arrest, that does not settle whether the *person* survives death. The 'stream' might be a final neural firing, a hallucination, or a non-local event. But none of that tells us if the *subject* of that stream is the same entity as the one who entered arrest. The neurological evidence speaks to the conditions of *experience*, not the conditions of *identity*. You can have experience without personal survival (e.g., in a dream, or a fragmented state). The gap remains: does that experience belong to *me* in the sense required for survival? The neurology doesn't answer that."

  **Soft Spot:** I am leaning on the **Stream vs. Person distinction**. If the Neurologist argues that 'person' just *means* 'locus of conscious experience,' then evidence of experience *is* evidence of the person.
  **Concession Strategy:** **Concede in part.** Agree that NDEs are evidence of *consciousness* persistence, but hold firm that *personhood* involves more than momentary phenomenology (e.g., memory, agency, narrative).

  ### 5. The Metaphysician (Constraint: No Fact vs. Unknowable)
  **Objection:** "You need to be clearer on your modal claim. Are you saying there is *no fact of the matter* about survival, or merely that we *could never find out*? These are different. If there is a fact but it's epistemically inaccessible, then survival is a real possibility we just can't verify. If there is no fact, then the question is empty. Your talk of 'choosing criteria' suggests the latter, but your defense of Ayer sounds like the former (verificationism is often epistemic). If it's just epistemic, then empirical evidence *could* in principle settle it, you just think it hasn't yet. Which is it?"

  **Reply:** "It is the stronger claim: there is no fact of the matter *independent of the criterion*. This is not skepticism; it is conceptualism. Verificationism, properly understood, isn't just about our ability to know; it's about what constitutes meaning. If no empirical test can distinguish between 'survival' and 'non-survival' in a given scenario, then there is no fact to be known. The 'further step' I mention is not a discovery of a hidden fact, but the application of a rule. To treat it as merely epistemic is to assume there is a 'real' survival hiding behind the phenomena. I am denying that there is anything there to hide."

  **Soft Spot:** I am leaning on the **verificationist principle linking meaning to facts**. If the objector argues that verificationism is outdated and that realism allows for verification-transcendent truths, my whole framework looks like a relic of 1930s positivism.
  **Concession Strategy:** **Refuse to concede.** Maintain that even without strict verificationism, the indeterminacy of identity in borderline cases supports the 'no fact' claim.

  ### 6. The Phenomenologist (Constraint: Stream vs. Person)
  **Objection:** "You distinguish between a 'stream of experience' and a 'person.' But for the subject, these are identical. If I have experiences after my body dies, *I* am having them. To say 'the stream exists but the person does not' is to introduce a third-person abstraction that violates the first-person reality of survival. If the phenomenology continues, the person continues, because the person is nothing over and above the subject of experience. Your distinction allows you to say 'experience survives but you don't,' which is a contradiction in terms for the experiencer."

  **Reply:** "It is not a contradiction; it is a category distinction. Consider split-brain cases or dementia. A stream of experience may continue, but we might hesitate to say the *person* survives if memory and agency are severed. The first-person perspective feels continuous, but the third-person criteria for 'personhood' (legal, moral, biological) may not be met. I am arguing that 'survival' is a term that bridges these perspectives. If we rely solely on the first-person feel, we lose the ability to distinguish between survival and mere replication or hallucination. The 'person' is a construct that requires more than just the raw feel of experience; it requires a structure that the stream alone does not guarantee."

  **Soft Spot:** I am leaning on the **rejection of the Pure Ego**. If the objector successfully argues that the 'person' is *exhausted* by the first-person perspective, my distinction collapses.
  **Concession Strategy:** **Concede in part.** Acknowledge that from the *inside*, the distinction is invisible, but maintain that from the *outside* (which matters for 'survival' claims), the distinction is vital.

  ### 7. The Normative Theorist (Constraint: Constraints on Choice/Registers)
  **Objection:** "If criteria are chosen, what constrains the choice? Can I choose a criterion where everyone survives? Or no one? If nothing constrains you, your view collapses into 'we can say whatever we like.' If something constrains you—say, pragmatic utility or moral coherence—then isn't *that* constraint the real fact of the matter? Furthermore, you seem committed to different answers in different registers: legal, moral, biological. But when we ask 'Do we survive death?', we aren't asking 'Are we legally dead?'. Which register answers the question as asked? If you say 'none,' you've dodged the question. If you say 'all,' you have a contradiction."

  **Reply:** "The choice is constrained by our interests and the point of the concept. We don't choose arbitrarily; we choose to make sense of our practices. And yes, I am committed to the view that 'survival' has different answers in different registers. There is no 'God's eye' register. The question 'Do we survive death?' is ambiguous until we specify the interest. Biologically, no. Narratively, perhaps. Morally, maybe. The error is assuming there is a single, monolithic 'Survival' waiting to be found. My view accepts the plurality. The 'question as asked' is actually a cluster of questions. We must disentangle them rather than force a single answer."

  **Soft Spot:** I am leaning on **Conceptual Pluralism**. If the objector argues that there is a *primary* sense of survival (e.g., biological) that anchors the others, my pluralism looks like evasion.
  **Concession Strategy:** **Concede in part.** Admit biological death is the baseline, but argue that 'survival' in the philosophical/religious sense is not primarily biological.

  ---

  ### Concession Strategy Summary
  *   **Concede:** To the **Historian** that Ayer's specific terminology was semantic/empiricist, not explicitly conventionalist. To the **Neurologist** that NDEs provide evidence of *consciousness*, just not *identity*. To the **Normative Theorist** that biological death is the baseline anchor.
  *   **Refuse:** To the **Parfitian** that reductionism eliminates the need for criteria. To the **Religion Philosopher** that hope requires metaphysical realism. To the **Metaphysician** that there is a verification-transcendent fact of the matter.

  ---

  ### The Dangerous Question
  **The Question:** "If the criterion is a choice constrained only by our interests, and our interests vary, isn't your view just a sophisticated relativism? If I have a vested interest in immortality, and I choose a criterion that secures it, on what grounds can you tell me I am wrong? If you say 'your criterion doesn't match the facts,' I say 'I chose the criterion.' If you say 'your criterion is pragmatically useless,' I say 'it comforts me.' Have you not rendered the debate about survival entirely vacuous?"

  **Why it is dangerous:** It attacks the normative force of the view. If I cannot explain why some criteria are *better* than others without appealing to a fact of the matter, I am left with "might makes right" in conceptual engineering. It threatens to turn my philosophical thesis into a trivial observation that "people define words differently."

  **The Least Bad Answer:** "I can tell you you are wrong not because your criterion fails to match the facts, but because it fails to connect with the *practice* in which the concept is embedded. 'Survival' is not a private comfort; it is a public concept tied to responsibility, memory, and love. A criterion that secures immortality for everyone regardless of psychological or physical continuity severs those ties. It makes 'survival' mean nothing distinct from 'existence.' I am not advocating relativism; I am advocating *responsibility* in our conceptual choices. We must choose criteria that preserve the weight the concept carries in our lives. If your choice empties the concept of its moral and practical significance, you haven't solved the problem of survival; you've dissolved the concept."
