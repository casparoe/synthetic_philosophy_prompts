      *   *Part (c):* **Crucial.** Must explain the difference between synchronic constraints (axioms) and diachronic norms (updating rules). Rigidity is a substantive constraint on *how* experience impacts belief, not a mathematical tautology. Flag the "commutativity" point as correct but dependent on the rigidity assumption, not the axioms.
