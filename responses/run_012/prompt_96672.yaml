          6.  Conclusion on "Bedrock."

      *   *Refining the "Verbal" claim:* It's not *just* verbal. It's conceptual. Dennett rejects the "inner glow." Colleague 2 demands it. They can't agree because they define "real" differently.
      *   *Refining the "Normative" claim:* The fear isn't that the AI suffers; it's that the *user* is harmed by deception, or the *company* is liable for creating a simulacrum of intimacy.
      *   *The "Bedrock" aspect:* Wittgenstein. At some point, you just have to stop arguing and decide. The product *exists*. The team needs to ship with a policy, not a proof.

