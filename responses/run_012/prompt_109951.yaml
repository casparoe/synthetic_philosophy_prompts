answer: |-
  1. Short answer
  No, there is no single standard term that captures this specific nuance without carrying unwanted baggage. I will outline the nearest philosophical concepts, then offer a coined term that carves out the phenomenon you've identified.

  2. The pattern, said back to me
  You're describing a move where a mechanism is asserted, then retroactively redefined as conditional upon encountering counter-evidence. The condition isn't a failed prediction but a retrofitted escape clause. Adjustments seem plausible alone, but collectively allow the theory to absorb any outcome by shifting specificity from the claim to the context after the fact.

  3. The nearest things that already have names
  **Ad hoc hypothesis.** In philosophy of science, this is an assumption added solely to save a theory from falsification. It misses your case because "ad hoc" usually implies the addition is implausible or reduces testability overtly. Your example involves plausible mechanism tweaks that look like sophistication, not desperate patches, making the "ad hoc" label feel too blunt and accusatory for the subtle move you're tracking.

  **Immunizing stratagem.** This refers to modifying definitions or conditions to protect a theory from refutation. It misses because it often implies dogmatic protection of a core belief against reason. Your example looks like legitimate scientific refinement (facultative adaptation), making it harder to distinguish from healthy theory development using this term alone. It lacks the precision to separate good flexibility from bad retrofitting.

  **Degenerating problem shift.** Imre Lakatos used this for research programs that add patches without generating new predictions. It misses because it is a macro-level assessment of a whole field over time, not a label for the specific rhetorical move of retroactive conditionality within a single explanation. It describes the disease of the program, not the specific symptom of the conditional clause itself.

  4. A name and a definition
  I propose **Ex Post Facultativity**. Definition: The retroactive insertion of environmental conditions into a mechanism's description to accommodate counter-evidence without risking prior prediction. This counts when a researcher explains away anomalous data by asserting the mechanism *would have* switched modes if only they'd checked the context earlier, presenting the patch as sophistication. It does not count when the conditional switch is predicted beforehand and tested independently. The distinction lies in timing: genuine facultative adaptation risks being wrong about the condition; ex post facultativity treats the condition as an unlimited reservoir of explanation available only after the data arrives. This captures your "specificity migration" observation precisely. It isolates the cost-free nature of the adjustment.

  5. Confidence
  I am 90% confident that this carving accurately distinguishes the phenomenon from standard theory-patching vocabulary. The single point I am least sure about is whether a niche philosopher of psychology has already coined "Ex Post Facultativity" specifically; while the concept is established, the exact label may exist in obscure literature I cannot access.
