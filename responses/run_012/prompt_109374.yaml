answer: |-
  Here is the plan. I am committing to **The Trading Algorithm** as your central example.

  ### The Defense of the Example
  You rejected the Sunrise (too deterministic) and the Turkey (too narrative/shock-based). The Trading Algorithm works because it isolates the *mathematical structure* of the problem, which is what the No-Free-Lunch (NFL) theorem is actually about.

  *   **What it must have:** It must show that a strategy's strength in one environment is mathematically *purchased* by its weakness in another. It cannot be about a "black swan" event (like a war or pandemic); it must be about the *normal operation* of the strategy failing when the underlying rules shift slightly.
  *   **What it must not have:** It cannot rely on the brother not understanding finance. Keep it to "Up/Down." It must not suggest the market is "broken" when the strategy fails; the market is just *different*.
  *   **Why this over Spam Filters or Self-Driving Cars:** An actuary deals in risk and time. A spam filter is about classification (Is this X or Y?). A trading strategy is about induction (Will X continue?). This matches your brother's error: he thinks because the line went up, it will keep going up. The algorithm example proves that "following the line" is a specific tool that works in specific conditions, not a universal truth.

  ### The Sequence of the Scene
  Do not start with the theorem. Start with the brother's confidence. The logic must flow from **Certainty → Cost → Trade-off → Principle.**

  1.  **The Setup (The Brother's Induction):** The brother argues from history. "The fund has averaged 8% for thirty years. It's the law of averages." He treats the past as a mortgage on the future.
  2.  **The Pivot (The Actuary's Reframe):** She doesn't deny the 8%. She denies the *law*. She introduces the "Trend-Following Algorithm." It buys when things go up. It made millions in the 90s and 2010s.
  3.  **The Trap (The Cost of the Rule):** She describes the "Chop." A market that goes up, then down, then up, then down. The *same* algorithm that made millions in the trend now bleeds money on every turn. It doesn't just fail to win; it actively loses *more* than a random guesser because it commits with confidence.
  4.  **The Trade-off (The NFL Core):** She explains that to fix the "Chop" loss, you have to program the algo to do the opposite (buy low, sell high). But if you do that, you lose the millions in the "Trend." You cannot optimize for both. To be good at one is to be vulnerable to the other.
  5.  **The Line (The Climax):** This is where you land your coined line. It summarizes the trade-off.
  6.  **The Guardrail (Preventing Nihilism):** The brother will try to jump to "So we can't know anything." You must head this off. She must clarify that assumptions are *necessary*, just not *free*. We use them, but we pay for them.
  7.  **The Refusal (The Boundary):** He asks her which model is right for *tomorrow*. She refuses. This is crucial. NFL says you can't know without extra information. If she tells him, she breaks her own argument.
  8.  **The Resolution:** His response.

  ### The Line: "There are no free lunches, and no free assumptions."
  *   **Is it honest?** Yes. In machine learning and optimization, an "assumption" (or inductive bias) is what allows a model to generalize. Without assumptions, all outcomes are equally likely (no learning). With assumptions, you win on some problems and lose on others. The "cost" is the loss on the problems that contradict your assumption.
  *   **Where it lands:** It comes immediately after **Step 5 (The Trade-off)**. She has just explained that fixing the weakness in the "Chop" creates a weakness in the "Trend." She looks him in the eye and says: *"You want a strategy that wins everywhere? That's the free lunch. There are no free lunches, and no free assumptions. Every rule you write buys you safety in one world and exposes you in another."*

  ### Addressing Reader Misconceptions
  *   **Misconception 1: "So everything is arbitrary."**
      *   **The Fix:** In **Step 6 (The Guardrail)**, she must say: *"I'm not saying don't use a map. I'm saying check if the terrain matches the legend. If you assume the ground is solid, you can run. If you assume it's ice, you can slide. But don't pretend you can run on ice."*
  *   **Misconception 2: "So Hume wins/Induction is dead."**
      *   **The Fix:** Make it clear that induction works *if* the environment is stable. The NFL theorem doesn't say induction fails; it says induction *depends* on the environment matching your bias. The brother's error isn't using induction; it's assuming the environment is static without paying for that assumption.

  ### The Refusal
  At the end, the brother will ask: *"Okay, so which one is it? Is the market trending or chopping?"*
  **She must refuse to answer.**
  *   **Why:** If she answers, she implies she has a "free lunch" (inside knowledge or a crystal ball). The point of the scene is that *he* has to take the risk of the assumption.
  *   **Her Line:** *"If I knew that, I wouldn't be talking to you. I'd be trading. That's the bill. You want the upside? You pay the risk."*

  ### The Brother's Closing Lines
  *   **If he gets it (He understands the risk of the assumption):**
      *"So I'm not betting on the numbers. I'm betting on the game staying the same."*
  *   **If he doesn't get it (He slides into nihilism):**
      *"So you're saying we're just guessing. All of it."*

  ### Summary of the Plan
  1.  **Hook:** Brother cites past stability as law.
  2.  **Example:** Trend-Following Algo (wins on trends, bleeds on chops).
  3.  **Trade-off:** Fixing the bleed kills the trend profit. (NFL Core).
  4.  **Line:** "No free lunches, no free assumptions."
  5.  **Guardrail:** Assumptions are tools, not truths.
  6.  **Refusal:** She won't predict the market type.
  7.  **Closer:** Brother's line.

  **Execute this order.** If you move the Line before the Trade-off, it sounds like a platitude. If you move the Refusal before the Line, it sounds like she's hiding something. The Trade-off *earns* the Line, and the Refusal *proves* the Line.
