      Let's finalize the grade. 6/10 seems fair. They know the theory but fail the application which is the heart of causal inference. Maybe 5.5/10? No, the definitions are solid. 6/10.

      Wait, re-reading the student's last sentence: "The only exception is when the subgroups are fixed in advance and are causally relevant, but in that case the sure-thing principle does not apply anyway." This is also confused. If subgroups are causally relevant (confounders), STP *does* apply if we treat the subgroups as the states. The student seems to think STP only applies to aggregates. STP says $E[U|do(A)] > E[U|do(B)]$ if $E[U|do(A), S] > E[U|do(B), S]$ for all $S$. The student misses that the "states" in STP *are* the strata in the causal context.

