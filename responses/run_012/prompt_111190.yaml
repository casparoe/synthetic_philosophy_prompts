      *   The student identifies the tension correctly.
      *   The student identifies the resolution regarding "states of nature" vs. "subgroups" reasonably well.
      *   **However**, the student fails the most critical practical application question: "Discuss whether the correct response to a Simpson reversal is always to prefer the aggregate comparison." The student says "Yes, always." This is fundamentally wrong in causal inference. Usually, Simpson's paradox highlights that the *stratified* data reveals the causal truth while the aggregate is confounded.
      *   This is a significant conceptual error in a causal inference course.
