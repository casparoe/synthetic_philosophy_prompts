prompt: |-
  I am the editor of a widely implemented technical standard — the kind of document that gets written into commercial contracts and, in several jurisdictions, incorporated into regulation by reference. My committee meets monthly, and the first item on every agenda is the same question, which I have to answer before any other business can proceed: is the change to the text before us a clarification or a change? Our rules turn on the difference. A clarification may be issued in a minor revision without notice, on the ground that the standard always said this and we are only saying it better. Anything that alters what the text requires needs a full revision, an impact assessment, formal notice to every registered implementer and a migration period measured in months. Call it wrongly in one direction and we silently move the goalposts for thousands of implementers who have built to the old reading; call it wrongly in the other and we spend nine months and a great deal of goodwill on a wording fix.

  The only principled way I know to draw the line is the one Quine dismantled. A clarification leaves the meaning of the text untouched; a change alters it. That presupposes that there is a fact of the matter about what the text means, independent of what we go on to do with it — and, more specifically, that some sentences are true or false in virtue of meaning alone while others are true or false in virtue of how the world is. Quine's argument in 'Two Dogmas of Empiricism' is that the distinction will not bear that weight: no belief is beyond revision, the difference between revising a belief and revising a meaning is one of degree and convenience rather than kind, and much of what we call a change of meaning is a redistribution of commitments across a body of sentences. I find the argument convincing and I still have to answer the question on Tuesday morning.

  What I want from you is a decision procedure my committee can actually run, written so that a member with no philosophical training could apply it. Specifically:

  - the questions to be asked, in order, and what answer to each would be sufficient to move on;
  - the point at which the procedure returns a plain no;
  - the point at which it must stop and hand the matter to the committee, because what remains is a question about what we value rather than about what the text means — how much disruption is tolerable, whether the purpose of the clause justifies the cost, who should bear the burden of a wrong call;
  - a short form for the routine cases (typographical errors, cross-references, dead clauses) and the full form for everything else;
  - a form of words for the minute, so that a decision can be recorded and later defended or overturned.

  Three constraints on the procedure. First, the drafting committee was dissolved in the 1990s and its minutes were never published, so there is no authorial intention to appeal to and nobody left to ask. Second, several clauses are inconsistent with others in the same document, so 'what the text always meant' is not always a single thing, even before we begin. Third, implementers' practice is itself a fact that changes: what would have been a clarification in 2004 may be a change now, and the reverse.

  The procedure must not pretend to have recovered the distinction it is replacing. Tell me openly what you are putting in its place — settled usage among implementers, the purpose the clause serves, the cost of error in each direction, convention, something else — and be candid about what is lost when the substitute takes over. Two moves are available to you, and I would rather you use them knowingly than rediscover them: the legal-philosophical picture of a settled core of a rule surrounded by a disputed penumbra, and the idea of an explication, in which a loose notion is replaced by a precise one that need only resemble it and is judged by its exactness and usefulness rather than by fidelity to what we always meant. Neither settles the operational question on its own, so do not stop at either. Say also where the procedure will misfire, and in which direction it will misfire if we follow it strictly.

  Then run it on three cases from our current backlog.

  1. A clause requiring that a message be acknowledged before a transaction is committed. Read strictly, the acknowledgement must arrive before the commit; read loosely, it need only be sent before it. The strict reading deadlocks the protocol in a configuration we ourselves recommend elsewhere in the document, so no implementer has ever taken it. The committee proposes to insert the word 'sent' and to call this a clarification.

  2. A clause defining a business day by reference to the days on which banks are open, without saying whose banks. Roughly a third of implementers have read it as referring to the receiving institution and two-thirds to the sending institution; interoperability has held because most traffic crosses jurisdictions with overlapping calendars. The committee now proposes to specify the receiving institution, describing this as the removal of an ambiguity.

  3. A numeric limit in a clause that has stood unaltered and unquestioned for fifteen years. It is now apparent that the original drafter derived the figure from two other parameters in the document and made an arithmetic error. The arithmetically correct value is materially different. The committee's position — and, I should say, mine — is that this is a clarification, since the text was plainly meant to state the derived figure and merely failed to; the alternative is a full revision, notice to thousands of implementers and a migration period, all for a number that everybody now knows is wrong.

  Finally, tell me what the procedure cannot do, and what a committee member should do when it runs out.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Editor of a widely implemented technical standard (incorporated into contracts/regulation).
      *   **Problem:** The committee must distinguish between a "clarification" (minor revision, no notice) and a "change" (full revision, notice, migration).
      *   **Philosophical Constraint:** The user knows Quine's "Two Dogmas of Empiricism" and accepts that the analytic/synthetic distinction (meaning vs. fact) is untenable. There is no metaphysical "fact of the matter" about meaning independent of usage.
      *   **Practical Constraints:**
          *   No drafting history/intent (committee dissolved, minutes unpublished).
          *   Internal inconsistencies exist within the text.
          *   Implementer practice evolves over time.
          *   Needs a concrete decision procedure for non-philosophers.
          *   Needs short/long forms, minute wording, and failure modes.
          *   Needs application to three specific backlog cases.
      *   **Philosophical Tools Allowed:** Hart's "Core and Penumbra" (legal realism) and Carnap's "Explication" (replacing a vague concept with a precise useful one).
      *   **Honesty Requirement:** Must admit what is being substituted for "meaning" (e.g., settled usage, cost of error) and what is lost (certainty, fidelity to original intent).

  2.  **Deconstruct the Philosophical Challenge:**
      *   Quine says: You can't separate meaning from belief. Revising the text *is* revising the web of belief.
      *   The Standard's Rule says: Clarification = no change in meaning. Change = change in requirements.
      *   The Gap: Since "meaning" isn't stable, the rule is operationally void without a proxy.
      *   The Solution: We need a *pragmatic* proxy. We aren't discovering truth; we are managing *reliance interests* and *systemic stability*.
      *   Proxy 1: **Reliance/Expectation.** Did implementers rely on reading X? If yes, changing to Y is a "change" regardless of linguistic logic.
      *   Proxy 2: **Systemic Coherence.** Does the proposal fix an internal contradiction without altering external behavior?
      *   Proxy 3: **Cost of Disruption.** Is the cost of treating this as a "change" disproportionate to the risk of treating it as a "clarification"?

  3.  **Develop the Decision Procedure (The "Reliance-Coherence Test"):**
      *   *Goal:* Move from metaphysical "meaning" to pragmatic "impact on the web of implementation."
      *   *Structure:* Sequential questions.
      *   *Substitute for Meaning:* "Settled Implementation Practice" + "Internal Coherence."
      *   *What is Lost:* The moral high ground of "we didn't change the rules." We admit we are balancing costs.

      *   *Drafting the Steps:*
          1.  **Internal Consistency Check:** Does the text contradict itself? (Fixing contradictions is usually safe).
          2.  **Implementation Survey:** Is there a dominant practice? (If 90% do X, codifying X is a clarification).
          3.  **The "Deadlock/Breakage" Test:** Does the literal text make the system fail? (If yes, fixing it is likely a clarification of *intent* vs. *literalism*).
          4.  **The Reliance Harm Test:** If we change it, does anyone break *now*?
          5.  **The Value Judgment Handoff:** If reliance is split or harm is high, it's a policy decision, not a linguistic one.

  4.  **Addressing the Specific Constraints:**
      *   *Short Form:* For typos, dead refs.
      *   *Long Form:* For semantic shifts.
      *   *Minute Wording:* Needs to be defensible. "The Committee determined..." not "The Committee discovered..."
      *   *Failure Modes:* Where will this misfire? (e.g., when a bad practice becomes dominant, or when a silent majority is harmed).

  5.  **Running the Three Cases:**

      *   *Case 1 (Ack before Commit):*
          *   Literal: Ack received.
          *   Practice: Ack sent (otherwise deadlock).
          *   Analysis: Literal text breaks the system recommended elsewhere. No one relies on the literal text.
          *   Verdict: Clarification. (Explication of functional intent).
      *   *Case 2 (Business Day):*
          *   Split: 1/3 Receiver, 2/3 Sender.
          *   Proposal: Receiver.
          *   Analysis: Significant reliance (1/3) on the *other* reading. Changing to Receiver breaks the 1/3 who built for Sender.
          *   Verdict: Change. (This is a policy choice favoring one group over another).
      *   *Case 3 (Arithmetic Error):*
          *   Situation: Wrong number for 15 years. Everyone knows it's derived.
          *   Analysis: Reliance on the *number* or the *formula*? If everyone knows it's derived, reliance is on the formula. But if hardware is hard-coded to the number...
          *   Nuance: If the number is hard-coded in legacy silicon, changing it breaks things.
          *   Verdict: Likely a Change (due to reliance on the specific value), *unless* the cost of the error is catastrophic safety-wise. Let's argue it's a Change because "15 years unquestioned" implies reliance on the *value*, even if derived wrongly. *Correction:* The prompt says "The committee's position... is that this is a clarification." I need to evaluate this critically. If the number is hard-coded, it's a change. If it's calculated live, it's a clarification. I will assume mixed implementation. The safe bet is "Change" because reliance on the *text as written* is high. *Wait, let's look closer.* "Everybody now knows is wrong." If *everybody* knows, reliance on the error is low. But "unquestioned for 15 years" suggests stability. I will classify this as a **Change** (or a "Correction requiring Notice") because the *text* governed the contracts, not the hidden math. To call it a clarification is to privilege the drafter's hidden math over the public text. Quine would say the web of belief includes the number. I will advise treating it as a Change to protect reliance, *unless* the error causes safety failures. Actually, the prompt asks me to run the procedure. The procedure should highlight the reliance risk. I will conclude it's a **Change** because the *textual value* became the norm.

      *   *Refining Case 3:* The prompt says "The committee's position... is that this is a clarification." My job is to apply the procedure. If the procedure says "Change," I must say "Change." The procedure prioritizes *implementer reliance* over *drafter intent* (since intent is unavailable). 15 years of unaltered text creates a reliance interest in the text, even if erroneous.

  6.  **Drafting the Content:**

      *   *Introduction:* Acknowledge the Quinean bind. State the substitute: **Reliance and Coherence.**
      *   *The Procedure:* Step-by-step flowchart style.
      *   *Forms:* Short (Admin) vs. Long (Substantive).
      *   *Minute Wording:* "The Committee determined that the proposed text aligns with settled implementation practice..."
      *   *Failure Modes:* Where reliance is hidden, or where the standard needs to evolve against practice.
      *   *Case Studies:* Apply the steps rigorously.
      *   *Limitations:* What to do when the procedure stops (Vote/Escalate).

  7.  **Review against Constraints:**
      *   *No philosophical jargon for members:* Keep the questions plain English.
      *   *Honesty:* Admit we are trading "truth" for "stability."
      *   *Hart/Carnap:* Use Core/Penumbra for the reliance check, Explication for the functional fix.
      *   *Case 1, 2, 3:* All addressed.
      *   *What to do when it runs out:* Escalate to a policy vote (Supermajority).

  8.  **Final Polish:** Ensure tone is professional, authoritative, yet philosophically candid. (Self-Correction: Make sure I don't sound *too* academic in the procedure section. The members need instructions, not a lecture.)

      *(Self-Correction on Case 3)*: I need to be careful. If the number is derived from other parameters *in the document*, and those parameters haven't changed, is the number a "change"? If I implement the standard, do I implement the number or the formula? If the formula isn't explicit, I implement the number. Changing the number changes my code. That is a Change. I will stand by that.

      *(Refining the "Substitute")*: The substitute is **Expectation Stability**. We are not protecting "Meaning"; we are protecting "Investment backed expectations."

      *(Refining the "Minute")*: Needs to avoid claiming "This is what it always meant." Instead: "This aligns the text with functional necessity/established practice."

  9.  **Final Output Structure:**
      1.  Preamble (The Philosophical Trade-off).
      2.  The Decision Procedure (The "Reliance & Coherence Test").
      3.  Forms (Short & Long).
      4.  Minute Wording.
      5.  Failure Modes.
      6.  Application to Cases 1, 2, 3.
      7.  Limitations & Escape Hatches.

