answer: |-
  Your friend's objection relies on a classic principle of causal inference: Mill's Method of Difference. If the outcome differs (Industrialisation in Britain, not in China), the cause must differ. If coal is present in both, it cannot, on its own, be the differentiating cause.

  This is a logically sound starting point, but it creates the two troubles you have identified. To resolve them, we need to examine the *logic of historical explanation* rather than the specific historical facts. Here is how a robust account should be shaped to address your concerns.

  ### 1. The Shape of the Explanation (Without Coal)

  If we accept your friend's premise that coal availability is a constant, the search for a "smoking gun" (a single factor present in Britain and absent in China) is likely to fail. A correct account should not look for a single variable, but rather for a **conjunctural configuration**.

  **The Fallacy of the Single Difference**
  Your friend's principle assumes that causes operate in isolation. In complex social systems, causes operate in combinations. A factor $X$ (e.g., coal) might only produce outcome $Y$ (industrialisation) in the presence of factor $Z$ (e.g., cheap water transport or specific property rights).
  *   **The Nuance on Coal:** Even within your friend's framework, the "coal explanation" (specifically Kenneth Pomeranz's) does not argue merely that Britain *had* coal. It argues that Britain had coal *in the right place relative to water transport*, whereas China's coal was geographically distant from its economic core (the Yangtze Delta). Thus, the differentiating factor is not "Coal" vs. "No Coal," but "Accessible Coal" vs. "Inaccessible Coal." This satisfies your friend's principle while saving the coal hypothesis.
  *   **The Configurational Answer:** If we move beyond coal, a good answer should not say "Britain had Institutions, China did not." It should say "Britain had a specific combination of high wages, cheap energy, and fragmented political competition that made capital-substitution profitable, whereas China had a combination of abundant labour, state stability, and land constraints that made labour-intensity rational."
  *   **The "High-Level Equilibrium" Trap:** This leads to a specific shape of explanation known as the Elvin hypothesis. It suggests China did not fail to industrialise; it succeeded too well at labour-intensive methods. The explanation for divergence, therefore, is not a *deficit* in China (something it lacked), but a *success* (something it optimised differently). A good account must explain why the incentive structure favoured machinery in Britain but favoured handicrafts in China, even if both had the technical knowledge.

  **Conclusion for Trouble 1:** A correct account should not look for a binary switch (On/Off). It should look for **price signals and incentive structures**. The shape of the answer is economic and ecological: under what conditions does it become profitable to replace labour with machines? If the answer is "when labour is expensive and energy is cheap," then the explanation is a specific *ratio* of factors present in Britain, not the absolute presence of one factor.

  ### 2. Collapsing the Literatures (Industrial Revolution vs. Great Divergence)

  Your second trouble is whether accepting your friend's principle forces us to treat "Why Britain?" and "Why not China?" as the same question. Logically, your friend is correct; empirically and heuristically, the inference is dangerous.

  **The Logical Symmetry**
  Formally, if $A$ explains $X$ (Britain industrialised) and $\neg A$ explains $\neg X$ (China did not), then the explanation for $X$ and $\neg X$ is indeed the same story told from opposite ends. If you fully explain the Industrial Revolution (IR), you have, by definition, explained the Great Divergence (GD). In this strict sense, the literatures *are* one.

  **Where the Inference Fails: Causal Asymmetry**
  However, the inference fails when we consider the **asymmetry of causation**.
  *   **The "Default State" Problem:** Industrialisation is a rare, high-energy departure from the historical norm (Malthusian stagnation). Non-industrialisation is the default state of human societies. Explaining why a vase broke (IR) requires identifying a specific force (a hammer). Explaining why a vase *didn't* break (GD) does not require identifying a specific force; it merely requires the absence of the hammer, or the presence of any number of protective factors.
  *   **Many Paths to Stagnation:** There is only one way to industrialise (sustained per-capita growth via technological intensification), but there are infinite ways *not* to. China might have failed to industrialise due to culture, or institutions, or geography, or demographic pressure. Britain succeeded due to a specific, narrow conjunction of factors. Therefore, the "Why Britain?" question requires a precise, narrow answer. The "Why not China?" question allows for a broad, diffuse answer. Collapsing them risks imposing a false precision on China's history (implying there was one specific thing stopping it) or a false simplicity on Britain's (implying success was inevitable once one barrier was removed).

  **The Counterfactual Burden**
  The two literatures ask different counterfactual questions.
  *   **IR Literature:** Asks, "Given the world in 1700, what made Britain special?" (Focus on the positive trigger).
  *   **GD Literature:** Asks, "Given that China was ahead or equal in 1700, what changed?" (Focus on the deviation from a trend).
  If you treat them as identical, you risk **teleology**. You assume China was "heading toward" industrialisation and got sidetracked. A good answer must acknowledge that China may never have been on that path to begin with. If China's trajectory was stable and rational for its context, then "The Great Divergence" is a misnomer; it is simply "The British Anomaly."

  **Conclusion for Trouble 2:** The inference that the questions are identical is logically valid but historically misleading. A good answer treats them as **asymmetric**. It treats British industrialisation as the event requiring a specific causal mechanism (the "spark"), and Chinese non-industrialisation as the background condition requiring a explanation of stability (the "equilibrium"). You do not need to find a "lack" in China to explain the divergence; you only need to find a "surplus" of specific conditions in Britain.

  ### Summary: The Shape of a Good Answer

  To commit to a position without falling into your friend's trap or your own doubts, look for an explanation that meets these three criteria:

  1.  **Relational, not Absolute:** It should not argue that Britain had $X$ and China had $\neg X$. It should argue that Britain had a specific *relationship* between factors (e.g., wage-to-energy price ratios) that made innovation profitable, whereas China had a different relationship that made tradition profitable.
  2.  **Asymmetric:** It should accept that explaining the origin of the Industrial Revolution is a harder, more specific task than explaining the continuity of the Chinese economy. It does not need to find a "flaw" in China to explain the divergence.
  3.  **Conjunctural:** It should avoid monocausality. Whether the factors are institutions, culture, or ecology, a good answer admits that any single factor (even coal) is merely a necessary condition, and the sufficient condition is the *combination* of factors that occurred in 18th-century Northwest Europe.

  If your friend insists on a single factor present in one and absent in the other, she is demanding a type of causal clarity that history rarely provides. The "coal" argument survives not because China lacked coal, but because China lacked the *specific geopolitical and geographic configuration* that made British coal useful. That is a difference, and it satisfies her principle without reducing the complexity of the divergence.
