  2.  **Deconstruct Trouble 1: The Shape of the Explanation (Without Coal)**
      *   *The Friend's Principle:* "Method of Difference" (Mill's Methods). To explain a difference in outcome ($O_{UK} \neq O_{CN}$), you need a difference in cause ($C_{UK} \neq C_{CN}$). If Coal is present in both ($Coal_{UK} \approx Coal_{CN}$), it can't be the *differentiating* cause.
      *   *Critique of the Friend:* Is it true China had accessible coal? Pomeranz argues it was in the wrong *place* (North China vs. Yangtze Delta). So, "Coal + Transport" might be the variable, not just "Coal."
