          *   *Cultural:* Work ethic, scientific mindset (McCloskey, Kuran).
          *   *Ecological/Geographic:* Not just coal, but land constraint, New World ghost acres (Pomeranz).
          *   *High-Level Equilibrium Trap:* China was *too* efficient at labor-intensive methods to switch to capital-intensive (Elvin).
      *   *The "Form of Answer" Problem:* Is looking for a single "spark" misconceived? Maybe it's a conjunctural causation (INUS conditions). Maybe it's path dependence. Maybe the question assumes a teleology (that China *should* have industrialized).
      *   *Synthesis for User:* A good answer likely isn't "X vs. No X." It's likely "X + Y + Z in Context A" vs. "X + Q + R in Context B." It involves *combinations* of factors, not just presence/absence.

  3.  **Deconstruct Trouble 2: Collapsing the Literatures (Industrial Revolution vs. Great Divergence)**
      *   *The Inference:* If Explanation(Divergence) = Factor(Britain) - Factor(China), then explaining Britain's rise *is* explaining China's stagnation. Therefore, IR literature = GD literature.
      *   *Is this right?* Logically, it seems sound based on the friend's principle.
      *   *Where it might fail:*
          *   *Asymmetry:* Industrialization might be the "active" event requiring specific causes, while non-industrialization is the "default" state requiring no specific explanation (entropy argument).
          *   *Timing:* The IR literature focuses on the *onset* (1760-1840). The GD literature focuses on the *gap widening* over centuries (1500-1900).
          *   *Counterfactuals:* To explain Britain, we ask "Why did it happen there?" To explain China, we ask "Why did it not happen there?" These involve different counterfactual baselines.
          *   *Multiple Equilibria:* There might be many ways *not* to industrialize, but only one (or few) ways *to* industrialize. Explaining the unique path is different from explaining the aggregate of all other paths.
      *   *Synthesis for User:* The inference is logically tempting but historically risky. It assumes symmetry in causation. A good answer acknowledges they are two sides of the same coin *conceptually*, but distinct *empirically* because "stagnation" isn't a monolith.

