  *(Self-Correction Note on "Collectivism"):* I need to be careful not to swing too far the other way. Confucianism *does* prioritize the group in many ways. The point is that it's not *mere* collectivism; it's role-based moral cultivation. The colleague's error is reducing it to "subordination."

  *(Self-Correction on "Dissent"):* I need to mention specific examples. Confucius leaving a state because the ruler wouldn't listen. Mencius on tyrants. This makes it concrete for the novelist.

  *(Final check on the "Incommensurability" conclusion):* The protagonist *wants* to believe they can't argue. I need to confirm this is an illusion but a *productive* one for the character arc.

