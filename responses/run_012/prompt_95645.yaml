      *   **Task:** Audit a colleague's philosophical account of East vs. West ethics (Collectivism vs. Individualism, Relational vs. Autonomous Self, Dissent/Conscience, Empirical Psychology vs. Philosophical Tradition, Incommensurability).
      *   **Tone:** Intellectual, respectful, nuanced, "plain prose," trusting judgment (like a colleague over dinner, but more rigorous).
      *   **Specific Constraints:**
