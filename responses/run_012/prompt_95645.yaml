      *   **Claim 2: Constituted by Roles vs. Solitary Individual.**
          *   *Status:* Fair Brisk Statement (with caveats).
          *   *Correction:* Confucian "role-ethics" is strong (Ames/Rosemont). But Western "solitary" is a caricature (we are social animals). The contrast is *focus*, not exclusivity.
      *   **Claim 3: No Room for Dissenting Conscience.**
          *   *Status:* Simply Mistaken.
          *   *Deep Dive:* This needs the "strongest form" requested.
          *   *Key Concepts:* *Yi* (Righteousness), *Dao* (The Way), Remonstrance (*Jian*). Confucius says "Do not impose on others," Mencius says right to revolution if ruler fails. The self cultivates itself to *correct* the relationship, not just fit it.
      *   **Claim 4: Psychology Surveys Settle the Question.**
          *   *Status:* Simply Mistaken (Category Error).
          *   *Reasoning:* Is/Ought problem. Self-reporting bias. Cultural scripts vs. deep ontology. Just because someone says "I am a son" doesn't mean the philosophy denies inner moral agency.
