  *(Self-Correction Note)*: I need to be careful about the "Plato" point. Arendt thinks Plato identified the tension, but his solution (Philosopher King) was anti-political. The summary says she's "on Plato's side." That is definitely wrong. She is on the side of the *polis* against the philosopher-king, even while defending truth.

