answer: |-
  The chair is molded polymer, cold enough to bite through the orange jumpsuit. I know the specs because I signed off on the procurement order. I know the tensile strength, the ease of sanitization, the way the legs bolt to the floor to prevent tipping. I didn't know it would feel like this. Like sitting inside a ribcage.

  Across the partition, three board members sit in leather. Behind them, the Hummer. That's what we called it in the lab. The Hemispheric Unrest and Motive Mapping Empathy Reader. It looks like a hairdryer mounted on a articulated arm, black matte finish, no visible lenses. It doesn't look like judgment. It looks like kitchenware.

  I am Dr. Elena Vance. I wrote the kernel code for the Hummer. I am also Inmate 8940, convicted of gross negligence resulting in three deaths. A data error. A calibration drift I ignored because the grant deadline was looming.

  Now I need the Hummer to tell them I am sorry. Not that I say it. Not that I cry. It needs to know I *intend* to never let it happen again. The parole hinges on the intention, not the promise. The scanner reads the neural topology of genuine remorse and the structural integrity of future intent. If it flashes green, I walk. If it flashes red, I serve the full ten.

  The problem is the puzzle. I solved it on paper ten years ago. You cannot intend to drink the toxin if the reward comes before the drinking. You cannot intend to be good if the reward comes before the goodness. The desire for the reward poisons the intention.

  I close my eyes. I try to summon the faces of the dead. I try to feel the weight of them in my stomach. But all I can feel is the itch of the jumpsuit collar and the desperate, clawing need to be outside. I want freedom. I want it so badly it tastes like copper. And because I want it, the Hummer will know. It will see the calculation behind the grief. It will see that I am manufacturing sorrow to buy a ticket out.

  *Stop wanting it,* I tell myself. *Let go of the door.*

  But I am a prisoner. Wanting the door is the definition of my state.

  The board chair, a man named Sterling who used to drink coffee from my mugs, clears his throat. "Dr. Vance. You know the procedure. Step into the booth."

  I stand. My legs are stiff. I walk to the scanning alcove, a glass box tucked into the corner of the hearing room. I sit on the stool. The arm swings down. The Hummer hovers three inches from my forehead. It smells like ozone and static.

  "Begin scan," Sterling says.

  The machine whirs. It is listening to the blood flow in my prefrontal cortex. It is weighing my desire for liberty against my commitment to law. It knows I am trying to trick it. It knows that trying is the same as lying.

  I stop trying. I let the fear come. I let the shame come. I stop fighting the fact that I am a criminal who wants to be free. I accept the ugliness of it. Maybe that's the key. Not purity. Just truth.

  The whirring stops. The light on the console blinks amber. Processing.

  ***

  **The Wait**

  The HVAC system kicks in, a low, throbbing bass note that vibrates in the fillings of the teeth. A fluorescent ballast buzzes overhead, a high-pitched insect whine that starts and stops in irregular intervals. *Bzzzt. Silence. Bzzzt.*

  Outside the thick glass, a gurney wheel squeaks across the linoleum, a rhythmic *chick-chick-chick* that fades down the hall and returns, louder, as someone pushes it back.

  A paper cup crinkles. The sound of liquid being poured into a styrofoam container. A sip. A swallow.

  The chair across the room shifts weight. The leather creaks, a long, exhaled groan of synthetic skin stretching.

  A pen clicks. Once. Twice. Three times.

  The hum of the server rack in the adjacent room rises in pitch, a turbine spinning up, then settles back into a steady drone.

  Someone clears their throat. Dry. Abrasive.

  The clock on the wall ticks. Not a smooth sweep. A mechanical jerk. *Tick. Tick. Tick.*

  The air vent rattles in its frame, a loose screw tapping against metal. *Ting. Ting. Ting.*

  Silence. Heavy. Pressurized.

  The pen clicks again.

  ***

  The light turns green.

  Sterling looks at the readout, then at me. He looks confused. He knows the math. He knows the paradox. "Dr. Vance," he says, voice flat. "The index is solid. Ninety-eight percent alignment. You're cleared for release."

  I stand up. The Hummer arm retracts with a pneumatic hiss. I walk out of the booth. My legs feel like they belong to someone else. I am free. I have won the puzzle.

  But as I sign the release forms, the cold logic of my own creation settles over me, heavier than the jumpsuit.

  I walk through the security doors, into the fresh air of the loading dock. The sky is a bruised purple, evening setting in. I should feel joy. I feel nothing but a hollow clarity.

  The Hummer worked. It let me out. But it didn't *make* me safe. It didn't fix me in that booth. It didn't twist my neurons into a better shape while the ozone smelled up my hair.

  I passed because I am not the person I was five years ago. I passed because the years in the block, the isolation, the endless time to think about the dead, actually changed me. The scanner didn't cause the remorse. It just measured it.

  The system is a sieve, not a forge.

  I light a cigarette—a privilege of the newly freed—and lean against the concrete wall. I watch the other inmates waiting in the holding pen through the chain-link fence. They are pacing. They are praying. They are trying to psych themselves up to feel things they don't feel yet. They are trying to intend goodness because they want the key.

  They will fail. Most of them.

  Because you can't decide to be good on Tuesday morning for a hearing on Wednesday. The scanner selects the people who were already going to go straight. It releases the ones who don't need the release to be good. It keeps the ones who need the threat of prison to behave. It's perfect efficiency. It's also morally bankrupt.

  We sold it as rehabilitation. It's just sorting.

  I take a drag. The smoke burns my throat.

  But then, I stop. I watch a young kid in the pen, hands clasped, eyes closed. He looks terrified. He looks like he's trying to crush his own skull to force the right thoughts out.

  He won't pass today. Maybe not next year.

  But what if he knows? What if the knowledge of the scanner changes the timeline?

  The paradox holds for the moment of the scan. You can't intend to be good *for* the reward. But the reward isn't just the freedom today. The reward is the possibility of freedom *eventually*.

  If the inmates know, truly know, that the only way out is to actually become better—not to pretend, but to restructure their own desires—then the machine exerts pressure backward in time. It doesn't change them in the booth. It changes them in the cell, months before the hearing.

  The existence of the perfect lie detector forces the truth to grow slowly, like a crystal.

  I look at the cigarette in my hand. I want to throw it away. Littering is a step back. I don't throw it away. I am still me. Flawed.

  But I know that if I had known, five years ago, that this was the only way out, I might have started the work sooner. I might have started grieving the dead before I ever entered the booth.

  The system doesn't fix the broken. It filters them. But the filter's reputation might fix the ones who haven't broken yet.

  A guard opens the gate for me. "Move along, Vance. Bus leaves in ten."

  "Thanks," I say.

  I walk toward the bus. I am free because I was already free inside, long before the light turned green. The machine just noticed it before I did.

  I wonder about the kid in the pen. He has five years left on his sentence. If he hears about this—if he hears that trying to trick the machine is the same as failing—maybe he stops trying to trick it. Maybe he starts trying to be the person who passes.

  The scanner can't make him intend to go straight tomorrow. But the *idea* of the scanner can make him intend to go straight today.

  It's a causal loop. The effect (freedom) requires the cause (remorse), but the knowledge of the requirement creates the cause over time.

  I drop the cigarette butt and crush it under my heel. Small thing. But it's a start.

  The bus engine idles, a rough, diesel cough. I climb the steps. The driver doesn't look at me. He just scans my wristband. Green light.

  I take a seat in the back. The vinyl is cracked. I look out the window at the prison block. The lights are coming on in the cells, square yellow eyes in the darkening concrete.

  Thousands of people in there, trying to want what they don't want. Trying to feel what they don't feel. Most will fail. They will come out harder, angrier, convinced the system is rigged.

  But some will listen. Some will realize that the only way to beat the game is to stop playing it. To stop wanting the door enough to lie about it. To start wanting the straight life enough that the door doesn't matter.

  The bus pulls away. The prison disappears around the corner.

  I am out. I am free. And I am terrified that the only reason I am safe is because I no longer care enough about freedom to lie for it.

  The engine hums. The tires hiss on the wet asphalt. I close my eyes and listen to the sound of the road, trying to remember what it feels like to drive without looking in the rearview mirror.

  It feels like nothing. It feels like silence.

  And for the first time in five years, the silence doesn't feel like something I need to fill. It just is.

  Maybe that's what the machine heard. Not the remorse. Not the intention. Just the end of the noise.

  I lean my head against the glass. It's cold. Just like the chair. But outside, the city lights are blurring past, streaks of white and red, moving forward, never looking back.

  I hope the kid in the pen finds the quiet. I hope he has enough time.

  The bus hits a bump. I don't flinch.

  I'm already gone.
