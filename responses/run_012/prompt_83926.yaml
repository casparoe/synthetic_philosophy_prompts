answer: |-
  This is a precise and fertile collision of frameworks. You are asking whether the normative claims of sortition can be reduced to design-based inference properties, or whether the reduction exposes category errors in the political theory.

  Below is the translation of their position into your vocabulary, followed by the residue report, and finally the adjudication of where the friction originates.

  ### I. The Translation

  Here is how the sortitionist argument maps onto your design-based inference framework.

  **1. The Population and Frame**
  *   **Their Claim:** The chamber mirrors the population.
  *   **Your Translation:** Let $U$ be the population of eligible citizens (size $N$). The sampling frame is the voter roll or census registry. They claim the sample $s$ (size $n$, the legislature) is drawn such that the sample distribution of covariates $\mathbf{x}_i$ (demographics, ideology, economic status) converges to the population distribution.
  *   **The Design:** They implicitly propose **Simple Random Sampling (SRS)** without replacement, where first-order inclusion probabilities are $\pi_i = n/N$ for all $i \in U$. To improve "mirroring," they often tacitly rely on **stratified sampling** (quotas for gender, region, ethnicity) to force $\hat{N}_h = N_h$ within strata, reducing sampling variance for those specific margins.

  **2. Selection Bias and Nonresponse**
  *   **Their Claim:** Sortition insulates selection from campaigning and fundraising.
  *   **Your Translation:** Elections are a form of **non-probability sampling** where inclusion probability $\pi_i$ is a function of latent variables $Y_i$ (wealth, charisma, donor access). This induces **selection bias** ($E[\hat{Y}_{elec}] \neq Y$). Sortition sets $\pi_i$ independent of $Y_i$ (exogenous selection).
  *   **The Caveat:** They ignore **unit nonresponse**. If selected units can decline service, the realized inclusion probability becomes $\pi_i^* = \pi_i \times \phi_i$, where $\phi_i$ is the response propensity. If $\phi_i$ correlates with political interest or ideology, the design is no longer self-weighting, requiring **nonresponse adjustment** or **calibration weighting** to restore unbiasedness.

  **3. The Estimand and Deliberation**
  *   **Their Claim:** Mini-publics prove that random citizens can govern.
  *   **Your Translation:** The **estimand** is ambiguous.
      *   *Option A (Descriptive):* The population mean of pre-existing preferences $\bar{Y}$.
      *   *Option B (Causal):* The population mean of preferences *under* a deliberation treatment $\bar{Y}(1)$.
  *   **Deliberation:** This is a **post-treatment** intervention applied to the sample $s$. In the mini-public model, the sample is exposed to information/experts ($T=1$), whereas the population remains at $T=0$.
  *   **Inference:** They argue that $\bar{y}_s(1)$ (the deliberated sample verdict) is a valid estimator for $\bar{Y}(1)$ (what the population *would* decide if deliberated).

  **4. Legitimacy**
  *   **Their Claim:** Sortition is more legitimate.
  *   **Your Translation:** There is no direct counterpart. The closest statistical proxy is **coverage error** (does the frame match the population?) or **design unbiasedness**. They are conflating low Mean Squared Error (MSE) with normative authorization.

  ---

  ### II. The Residue Report

  This is where the translation breaks down. I have categorized the residue by the statistical concepts you provided.

  #### 1. The "Mirroring" Fallacy (Unbiasedness vs. Realization)
  *   **The Claim:** A randomly selected body "mirrors" the population.
  *   **The Statistical Reality:** **Unbiasedness** is a property of the *estimator* over repeated sampling, not a property of a single *realization*. With $N \approx 10^8$ and $n \approx 500$, the **standard error** for a proportion $p$ is $\sqrt{p(1-p)/n}$. For a rare attribute (e.g., a specific minority profession, $p=0.01$), the expected count is 5, but the variance is high. There is a non-negligible probability that the realized sample contains *zero* units with that attribute.
  *   **The Residue:** The sortitionists treat the Law of Large Numbers as if it applies to $n=500$. It does not. To get the "mirroring" they promise, they must abandon pure random sampling for **quota sampling** (stratification with fixed allocation). But quota sampling destroys the ability to calculate design-based **sampling variance** without model assumptions.
  *   **Verdict:** **Defect of Argument.** They are borrowing the prestige of "randomness" to guarantee representativeness that randomness alone cannot provide at that sample size.

  #### 2. The Teleology of Randomization (Inference vs. Fairness)
  *   **The Claim:** Randomization is warranted because it is fair/equal.
  *   **The Statistical Reality:** In survey sampling, randomization is warranted solely for **variance estimation** and **unbiasedness**. We randomize to quantify uncertainty, not because the sample "deserves" to be chosen.
  *   **The Residue:** The political justification is **normative equality of opportunity** ($\pi_i = \pi_j$), not **inferential validity**. While the math is identical ($\pi_i = n/N$), the justification does not transfer. A design can be normatively fair but statistically inefficient (high variance), or statistically unbiased but normatively illegitimate (e.g., excluding children from the frame).
  *   **Verdict:** **Defect of Argument (Tacit Borrowing).** The political claim tacitly borrows the *epistemic* authority of statistics ("science says this is representative") to bolster a *normative* claim ("justice says this is fair"). They are distinct justifications that are being conflated.

  #### 3. The Ill-Defined Estimand (The Will of the People)
  *   **The Claim:** The sample decides what the people would decide.
  *   **The Statistical Reality:** Design-based inference assumes $Y_i$ (the value for unit $i$) is **fixed** prior to sampling. The "Will of the People" implies a fixed $\bar{Y}$.
  *   **The Residue:** In political theory, preferences are often endogenous. If $Y_i$ is not fixed, there is no population total $Y$ to estimate. If the "Will" is constructed *through* the process, the estimand does not exist *ex ante*. You cannot calculate the bias of an estimator if the target parameter is ontologically unstable.
  *   **Verdict:** **Defect of Argument.** The sortitionist claim requires a fixed estimand to make sense of "representation," but their reliance on deliberation implies the estimand is mutable. This is a contradiction in terms.

  #### 4. Deliberation as Post-Treatment (Causal Identification)
  *   **The Claim:** Mini-public verdicts generalize to the population.
  *   **The Statistical Reality:** You have a sample $s$ drawn from $U$. You apply treatment $T=1$ (deliberation) to $s$. You observe $\bar{y}_s(1)$. You wish to infer $\bar{Y}(1)$ (the population mean under treatment).
  *   **The Residue:** This requires **transportability**. You must assume the **treatment effect** $\tau_i = Y_i(1) - Y_i(0)$ is homogeneous or that the sample is representative of the *treatment response*, not just the baseline covariates. If deliberation affects the politically disengaged differently than the engaged, and your sample has nonresponse bias correlated with engagement, $\bar{y}_s(1)$ is a biased estimator for $\bar{Y}(1)$. Furthermore, if the goal is to infer $\bar{Y}(0)$ (what the people want *now*), deliberation is a **confounder** that breaks the link entirely.
  *   **Verdict:** **Defect of Argument.** Weighting cannot paper this over. You can calibrate on observed $\mathbf{x}$, but you cannot calibrate on unobserved heterogeneity in treatment response $\tau_i$. This is a causal identification failure, not a sampling error.

  #### 5. Legitimacy and Authorization
  *   **The Claim:** Sortition is more legitimate.
  *   **The Statistical Reality:** Statistics has no vocabulary for **consent**, **authorization**, or **legitimacy**.
  *   **The Residue:** This is pure residue. A Horvitz-Thompson estimator can be unbiased while being imposed by a dictator. The statistical framework is agnostic to the political status of the sampler.
  *   **Verdict:** **Defect of Vocabulary.** Your framework genuinely cannot express this. It is not a statistical claim; it is a philosophical one.

  ---

  ### III. Adjudication: Vocabulary vs. Argument

  You asked whether the residue is a defect of your vocabulary or evidence that their claim is unclear.

  1.  **Legitimacy/Consent:** **Defect of Vocabulary.** Design-based inference is ontologically silent on normative authority. You cannot translate "legitimacy" into "variance." Do not try.
  2.  **Mirroring/Representativeness:** **Defect of Argument.** They are misusing the statistical concept of unbiasedness. They claim a single realization will look like the population. Statistics says it won't, not without stratification (which kills design-based variance estimation) or a much larger $n$.
  3.  **Deliberation/Generalization:** **Defect of Argument.** This is the strongest point of friction. They claim to estimate the "people's will" while simultaneously altering that will through deliberation. In your terms, they are changing the **estimand** mid-stream and assuming **transportability** of treatment effects without identification strategies. This is not a limitation of your vocabulary; it is a causal inference error on their part.
  4.  **Equality of Chance:** **Mixed.** The math translates ($\pi_i = \pi_j$), but the *reason* does not. They claim the statistical property *confers* the normative good. This is a **Naturalistic Fallacy**.

  ### IV. Confidence and Uncertainty

  **Confidence Levels:**
  *   **95% Confidence:** That the "mirroring" claim relies on a misunderstanding of sampling variance at small $n$. (The math is explicit here).
  *   **90% Confidence:** That the deliberation component constitutes a causal identification problem that weighting cannot solve without strong, untestable assumptions about treatment effect heterogeneity.
  *   **85% Confidence:** That the political theorists are tacitly borrowing epistemic authority from statistics to bolster normative claims (the "Teleology" residue).

  **Point of Least Certainty (The "Uncertainty Marker"):**
  I am least certain (approx. **60% confidence**) about the **transportability of deliberation effects**.
  *   *Why:* There is a sub-literature in political science suggesting that deliberation *converges* preferences (reducing variance $\sigma^2$ among units). If deliberation acts as a variance-reduction mechanism on $Y_i$ rather than a shift in mean $\bar{Y}$, the sample verdict might be *more* stable than the population baseline, potentially making $\bar{y}_s(1)$ a robust estimator for a *normative* estimand (the "informed will"), even if it fails as a *descriptive* estimator for the "current will."
  *   *The Risk:* This requires assuming that the *direction* of the deliberation effect is constant across strata. If the treatment effect $\tau_i$ interacts with unobserved covariates (e.g., education level moderates how one responds to expert testimony), the mini-public verdict is biased for the population verdict. Since we cannot observe $\tau_i$ for non-participants, this is fundamentally untestable within the design-based framework. The sortitionists must rely on a **model-based** assumption (SUTVA-like) that your design-based framework rightly treats with suspicion.

  ### Summary Judgment
  Your suspicion is correct. Much of what they say is a misuse of your vocabulary ("mirroring" = unbiasedness), and the rest is a category error (legitimacy = inference). The deliberation claim is the most sophisticated, but it fails the causal test: you cannot infer the counterfactual population outcome ($\bar{Y}(1)$) from a treated sample without assuming away the very political heterogeneity that makes representation necessary. They are doing estimation, but they are hiding the model assumptions required to make that estimation valid.
