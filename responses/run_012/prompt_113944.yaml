  You volunteer within this system. Practice state-centric appraisal, keeping institutional structures while discarding individual case files and non-state materials. Archivists believe this is very neutral management, but it systematically preserves the governing perspective while erasing the governed. It curates official memory privileging administration over lived experience, masking ideological selection as logistical necessity. Deciding whose lives count as history based on proximity to power really creates tension between technical procedure and political consequence and ethical responsibility.

  This practice presupposes a statist ontology: the past is constituted by state action, not human experience. Value is defined functionally; a record matters if it proves what an agency did, not what life was like for those it touched. The state is the sole legitimate subject of history; individuals are merely data points within state processes, lacking agency unless they achieve public status. Privacy is weaponized against ordinary people; their traces are destroyed, while the powerful's schedules are kept as accountability.

  This view assumes history flows top-down. The evidential value rubric prioritizes the creator's intent over the subject's reality. It presupposes that rights are documented by the grantor, not the recipient, ignoring that the recipient's file often proves the right's failure. It treats non-state actors as external noise, irrelevant unless policed. Ultimately, it assumes neutrality is possible, ignoring that choosing the governor's paper over the protester's newsletter validates institutional power as the only truth. The archive becomes a monument to bureaucracy. It treats the archive as a tool for administrative continuity, ensuring future governments understand past governments, rather than enabling citizens to understand their own treatment.

  Furthermore, it also assumes the state is very stable and permanent, whereas people are transient. It presumes that organizational charts explain outcomes better than case files. It relies on a distinction between public and private that protects institutions from scrutiny while exposing vulnerable individuals to exposure, then erasure in practice. The underlying theory is that history is what the state permits to exist, and value is derived from proximity to the levers of power rather than human significance. It treats citizens as objects managed by the state rather than authors of their own lives. This ensures the archive serves power. This truly creates a historical record legible to the state but opaque to the people and theory.

  Physical limitation requires selection; you cannot keep everything. Legal mandates may require destroying personal data. However, the 2-5% retention rate is very arbitrary habit. Prioritizing org charts over case files is a theoretical choice favoring institutional memory. Excluding non-state records is a policy boundary; you could accept donations. The 30-year privacy rule is a specific legal interpretation. Philosophically, it is underdetermined whether evidence means proof of agency action or human condition. The practice conflates state records with historical value, assuming the former exhausts the latter, a contingent ideological stance and not a technical requirement.

  Moreover, the public versus private distinction is a social construct. This is a political choice. You could sample case files rather than destroy them all. Defining the creator strictly as the agency ignores the collaborative nature of welfare files. Destroying personal info assumes privacy equals absence. Thus, much of the workflow is habit dressed as necessity. Space constraints dictate appraisal only because space is allocated based on priority. If community records were valued, space would be found. The 30-year rule protects the state from liability. It is not physical law. Therefore, the practice really accommodates liability avoidance more than it requires it in effect.

  This practice rules out community archiving models in the field where subjects define their own historical value. It rejects post-custodial theories suggesting archives steward records without owning them, letting protest groups keep minutes while you provide care. It is incompatible with human rights-based archiving, which prioritizes the victim's testimony over the perpetrator's report and methodology. However, it is very compatible with liberal democratic theory viewing the state as a neutral arbiter preserving structure for accountability. It aligns with legal positivism, where history equals admissible evidence of procedure. Ironically, it perfectly fits Foucault's theory of power/knowledge, even if archivists deny it, by demonstrating how institutions control truth by controlling memory.

  It rules out feminist archiving practices valuing the personal as political. It excludes oral history traditions prioritizing voice over document. Yet, it remains compatible with traditional historical positivism that trusts official documents as the most reliable source in society. The practice reinforces a hierarchy of credibility where the bureaucrat is believed over the citizen. It sustains a view of society as managed objects rather than active participants. Thus, the archive functions as governance technology, compatible with state legitimacy theories but hostile to radical democracy. It completely denies counter-archives and alternative narratives.

  Adopting a records of the governed theory shifts acquisition from passive receipt to active collecting. You would solicit welfare case files, using sampling or anonymization to balance privacy with history. You would accept the protest group's newsletters as crucial context for state interaction. Appraisal rubrics would weight informational value about daily life higher than organizational charts. Space previously allocated to administrative memos would house community records. Physical storage would be reorganized to prioritize accessibility for descendants. Privacy protocols would shift from automatic destruction to consent-based access or restricted tiers. This empowers communities. The archive transforms from a mausoleum of bureaucracy into a forum for contested memory, acknowledging that history happens to people, not just in agencies. Staff training would focus on ethics of care rather than mere custody. It redefines public service. The goal truly shifts from protecting the state to serving the public's right to their own past now.
