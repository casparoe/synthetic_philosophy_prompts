  8.  **Final Polish:** Ensure the language is engaging. Use the "ceiling" example throughout to ground the philosophy. (Proceed to generate output based on these thoughts.)

      *   *Key Concept to introduce:* "Performance Legitimacy" is the standard term, but I should refine it to "Responsive Performance."
