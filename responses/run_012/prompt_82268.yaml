  ### Brainstorming & Line Testing

  **The Beats:**
  1.  **The Scenario:** Five embryos, frozen, potential lives (The "Five Sparks").
  2.  **Procreative Beneficence:** The external pressure to maximize welfare/minimize disability ("Choose the spine...").
  3.  **The Counterexample:** My life exists and is good despite the trait ("My body says...").
  4.  **Non-Identity Problem:** The specific child only exists if selected; no harm in non-existence ("No you waiting...").
  5.  **Expressivist Objection:** Selecting against the trait critiques existing disabled people ("Judge my own").
  6.  **Selection vs. Design:** Agency is limited to choice, not creation ("Choose the door").
  7.  **The Knot:** Existence is conditional on the "hard" trait; avoiding pain changes the identity ("Lose your face").

  **Candidate Lines (Testing for Repetition Shift):**
  *   *Line A:* "Five silent sparks wait in the frozen dark." (Neutral start -> Unresolved end).
  *   *Line B:* "Choose the spine that promises to break less." (Advice -> Premise for ethical conflict).
  *   *Line C:* "My body says this break is not the end." (Defense -> Reaffirmation).
  *   *Line D:* "There is no you waiting out in the cold." (Fact -> Moral relief/weight).
  *   *Line E:* "To reject this shape is to judge my own." (Accusation -> Condition).
  *   *Line F:* "I do not build, I only choose the door." (Clarification -> Limitation).
  *   *Line G:* "Only through the hard path do you begin." (Condition -> Origin).
  *   *Line H:* "To spare the pain is to lose your face." (Consequence -> Identity loss).

  **Structure Check (Pantoum):**
  *   Stanza 1: A, B, C, D
  *   Stanza 2: B, E, D, F
