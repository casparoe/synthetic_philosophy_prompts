answer: |-
  The session hinges on revealing that strategy M is irrational not because another single row beats it, but because a probabilistic combination of T and B does.

  **Teaching Plan**

  1.  **Pure Failure (10 mins):** Students verify no pure strategy dominates another for Row. This must happen first to invalidate their existing heuristic and create cognitive dissonance.
  2.  **Mixed Dominance (20 mins):** Introduce mixtures as opponent beliefs. Calculate expected payoff of 0.5T + 0.5B against L, C, R (2.5, 2.5, 6.5). Compare to M (2, 2, 2). Eliminate M. This depends on Step 1 creating the need for a new tool.
  3.  **Iteration (20 mins):** With M gone, R strictly dominates C for Column. Eliminate C. Now T strictly dominates B for Row. Eliminate B. Solution: (T, L). This depends on Step 2; without removing M, C is only weakly dominated.
  4.  **Strict vs. Weak (15 mins):** Note R weakly dominated C initially (due to M's 2=2 payoff). Removing M made it strict. Explain that eliminating strictly dominated strategies never removes Nash equilibria, but eliminating weakly dominated ones might. Order matters for weak, not strict.
  5.  **Synthesis (10 mins):** Connect "strictly dominated" to "never a best response."

  **Single Feature:** Row M. It must contain payoffs that are averages of T and B (containment) but conspicuously lack a single pure strategy that exceeds it in all columns.

  **Misconceptions:**
  1.  "Dominated only by pure": Defuse in Step 2 by showing the calculation.
  2.  "Order invariant": Defuse in Step 4. Clarify that while this game resolves uniquely, weak dominance generally allows order-dependent outcomes that may discard equilibria.

  **Closing Question:** "In the original game, is there any probability distribution over L, C, R that makes M a best response for the Row player?" (Correct answer: No. If a strategy is strictly dominated by a mixture, it is never a best response to any belief.)

  **Refusal:** Do not cover geometric proofs using the simplex or formal theorems on order independence; state that these require convexity analysis beyond this course's scope.

  **End Goals:** Students state: (1) A pure strategy can be dominated by a mixture even if no pure strategy dominates it. (2) Iterated elimination is order-independent for strict dominance but order-dependent for weak dominance. (3) With mixtures allowed, a strategy is strictly dominated if and only if it is never a best response.
