prompt: |-
  I'm giving a colloquium paper next term at a joint session of my department's metaphysics group and its philosophy of physics group, and I need a Q&A prep sheet for the discussion.

  My thesis: modal realism should be rebuilt on quantum branching rather than on spatiotemporal connectedness. The received picture, as I understand it, is that a possible world is a maximal spatiotemporal whole, that worlds are spatiotemporally and causally isolated from one another, and that de re modality is handled by a counterpart relation whose specification is a free semantic choice. I want to replace all three claims. On my account, a world is a maximal branch of the universal quantum state: a maximal set of histories that are mutually decohering. Worlds share a past and then diverge; there is no requirement of isolation; and spatiotemporal connectedness is neither necessary nor sufficient for worldhood. Actuality is indexical, and I mean that as a physical index rather than a semantic one: the actual world is the branch I am on. Finally, the counterpart relation is not a free choice but a fact about how structure is inherited along branching — two things are counterparts when their structural descriptions are continuous across a branching event.

  I advertise three payoffs. First, the plurality of worlds stops being a brute posit and becomes a consequence of physics. Second, the awkwardness about disconnected spatiotemporal regions goes away, because whether such regions are one world or two becomes a question about branch membership rather than a stipulation. Third, counterpart theory stops being the embarrassing appendix of the package, because the counterpart relation is now read off the physics.

  The audience is about twenty people in three groups. (a) Three committed Everettians, who think decoherence plus a decision-theoretic derivation of the Born rule solves the probability problem, and who will not tolerate anyone waving at branches without saying how branches are individuated. (b) Eight or nine ordinary analytic metaphysicians of modality: a couple of ersatzists (worlds are maximal consistent descriptions or representations, not concrete things), a couple of primitivists about modality, and several who think the indispensability argument is the only serious argument for concrete worlds. (c) Three Humeans about laws and chance, for whom a world is nothing but a distribution of local, particular, non-modal facts, with no irreducible laws and no necessary connections.

  Give me the objections I will actually get from these people, ordered by how much damage they do, and say how likely each one is. Phrase each objection the way the person who raises it would phrase it — the Everettian's version of an objection and the ersatzer's version are different objections even when they share a target. For each: what I should concede up front rather than be forced into conceding, a reply I can deliver in about two minutes, and one line on where that reply is soft. Then give me the objection I am hoping nobody asks. Finally, if there is an opening ninety seconds that would defuse two of the top objections without sounding defensive, sketch it.

  No references, no reading list, no as-someone-argues-in-somewhere: the audience knows the literature and I need the arguments themselves, in their own terms. Don't pad the list; if an objection is weak, say so and say why.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Task:** Create a Q&A prep sheet for a colloquium paper.
      *   **Topic:** Rebuilding modal realism on quantum branching (Everettian/Many-Worlds) rather than Lewisian spatiotemporal isolation.
      *   **Thesis:** Worlds = maximal decohering branches of the universal quantum state. Worlds share pasts/diverge. Actuality = indexical (physical). Counterparts = structural continuity across branching.
      *   **Payoffs:** Worlds derived from physics (not brute), spatiotemporal disconnectedness issues resolved, counterpart relation grounded in physics.
      *   **Audience:** ~20 people.
          *   (a) 3 Committed Everettians (care about branch individuation/Born rule).
          *   (b) 8-9 Analytic Metaphysicians (Ersatzists, Primitivists, Indispensability Arg proponents).
          *   (c) 3 Humeans (Laws/Chance = local facts, no necessary connections).
      *   **Format:** Objections ordered by damage/likelihood. Phrased in the objector's voice. Concessions, 2-minute replies, soft spots. The "Hope Nobody Asks" objection. A 90-second opening defuser.
      *   **Constraints:** No references/reading lists. Direct arguments. No padding (identify weak objections).

  2.  **Deconstruct the Thesis & Audience Vulnerabilities:**
      *   *Thesis:* Modal Realism + Everettian QM.
      *   *Vulnerability 1 (Everettians):* The "Fuzzy Branches" problem. Decoherence is approximate, not sharp. If worlds are branches, and branches aren't sharp, worlds aren't sharp. This threatens the ontology. Also, probability (Born Rule) – if modality is just branching, where does probability come from?
      *   *Vulnerability 2 (Metaphysicians):* Identity across branches. If worlds share a past, is it the *same* object before the split? This violates Lewis's "no overlap" rule. Also, Ersatzists will attack the concreteness. Indispensability folks will ask if QM is really indispensable for modality.
      *   *Vulnerability 3 (Humeans):* Modal realism posits necessary connections (branching structure). Humeans hate that. Also, if laws emerge from the wavefunction, is that Humean-friendly?
      *   *Vulnerability 4 (General):* The "Actual" indexical. If I'm on *this* branch, why *this* one? (Self-locating uncertainty).

  3.  **Drafting Objections (Iterative Process):**

      *   *Objection 1 (The Everettian Strike):* Branches aren't real/fundamental. They're emergent/fuzzy.
          *   *Voice:* "You're treating branches as ontological primitives, but decoherence is basis-relative and approximate."
          *   *Damage:* High. If branches aren't well-defined, the whole ontology collapses.
          *   *Likelihood:* Certain (from group A).

      *   *Objection 2 (The Metaphysician's Identity Crisis):* Overlap.
          *   *Voice:* "If worlds share a past, you have trans-world identity, not counterparts. You've broken Lewis's system without fixing the paradoxes."
          *   *Damage:* High. It challenges the core metaphysical innovation.
          *   *Likelihood:* High (from group B).

      *   *Objection 3 (The Humean Attack):* Modality as physical necessity.
          *   *Voice:* "You're smuggling necessary connections into the fabric of reality. Branching *is* a necessary connection."
          *   *Damage:* Medium-High. Hits the Humean contingent hard.
          *   *Likelihood:* Medium (from group C).

      *   *Objection 4 (The Probability/Born Rule Issue):*
          *   *Voice:* "Branching gives you possibility, not probability. Why should I care about the measure on the branch?"
          *   *Damage:* High (for Everettians), Medium (for others).
          *   *Likelihood:* High.

      *   *Objection 5 (Ersatzist):* Why concrete?
          *   *Voice:* "Why do we need real quantum stuff for modality? Representations work fine."
          *   *Damage:* Low. This is a stalemate between realists and ersatzists.
          *   *Likelihood:* Medium.

      *   *Weak Objection:* "QM might be false." (Too easy to dismiss as irrelevant to the conditional claim).

  4.  **Refining and Ordering:**
      *   *Top Damage:* The Fuzzy Branches objection (Everettians). If the ontology isn't well-defined, nothing else matters.
      *   *Second Damage:* The Overlap/Identity objection (Metaphysicians). This challenges the coherence of the modal logic.
      *   *Third Damage:* Probability/Born Rule. Crucial for Everettians, relevant for modality of chance.
      *   *Fourth Damage:* Humean Supervenience.
      *   *Weak:* Ersatzist "why concrete" (just a brute disagreement).

  5.  **Drafting Responses:**
      *   *Fuzzy Branches:* Concede approximate. Reply: Vagueness is acceptable for special sciences/special ontology (like "mountain"). Soft spot: Fundamental ontology shouldn't be vague.
      *   *Overlap:* Concede Lewis was against it. Reply: Sharing a past isn't overlap of *worlds*, it's identity of *history* prior to differentiation. It's a "diverging" model, not "overlapping" in the paradoxical sense. Soft spot: Logic of identity across splits.
      *   *Probability:* Concede branching $\neq$ probability. Reply: Decision-theoretic link (Wallace-style) applies to modal weight. Soft spot: Circularity worries.
      *   *Humean:* Concede necessary connections. Reply: Better than brute modality. Soft spot: Humeans won't buy it.

  6.  **The "Hope Nobody Asks" Objection:**
      *   What kills the project? The idea that QM is contingent. If QM is false, is modality gone? Or: The "Preferred Basis" problem is unsolved. Let's go with the Preferred Basis/Individuation problem being unsolved *in principle*, not just practically. If there is no fact of the matter about where a branch splits, there is no fact of the matter about what is possible.

  7.  **The 90-Second Opening:**
      *   Need to address Fuzzy Branches and Overlap immediately.
      *   Strategy: Frame the view as "Naturalized Metaphysics." We aren't stipulating; we are discovering. Acknowledge the fuzziness but compare it to other accepted vague ontologies. Acknowledge the overlap but frame it as "common history" rather than "shared parts."

  8.  **Review against Constraints:**
      *   No references? Check.
      *   Phrased in objector's voice? Check.
      *   Concession/Reply/Soft Spot? Check.
      *   Ordered by damage? Check.

  9.  **Final Polish:**
      *   Ensure the tone is appropriate for a colloquium (rigorous but conversational).
      *   Make sure the distinction between the Everettian critique and the Metaphysician critique is sharp.
      *   Check the Humean angle (supervenience).

      *(Self-Correction during drafting)*: I initially thought about putting Probability as #1. But the *individuation* of branches is more fundamental. If branches don't exist as discrete entities, probability doesn't get off the ground. So Fuzzy Branches is #1. Overlap is #2 because it challenges the modal logic directly. Probability is #3.

      *(Refining the "Overlap" objection)*: Metaphysicians know Lewis rejected overlapping worlds because of the "accidental intrinsics" problem. I need to make sure the objection cites that specific worry.

      *(Refining the "Humean" objection)*: Humeans care about supervenience. If branching structure doesn't supervene on local matters of fact, they will revolt.

      *(Refining the "Hope Nobody Asks")*: The best killer is: "Is Quantum Mechanics contingent?" If QM is contingent, then your account of *all* modality rests on a contingent truth. That makes the account circular or limited.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Q&A Prep Sheet: Quantum Modal Realism

  **Context:** Joint Metaphysics/Philosophy of Physics Colloquium.
  **Thesis:** Worlds = maximal decohering branches of the universal wavefunction.
  **Audience:** Everettians (3), Analytic Metaphysicians (9), Humeans (3).

  ---

  ### Top Objections (Ordered by Damage)

  #### 1. The "Fuzzy Branches" Objection (Everettians)
  **The Objection:**
  "You're treating branches as the ontological grounds for modality, but branches aren't fundamental. Decoherence is a matter of degree, not a sharp cut. There is no fact of the matter about exactly when a split occurs or how many branches there are. If worlds are branches, and branches are vague, then what is possible is vague. Are you really willing to say there is no fact of the matter about whether a specific outcome is possible?"

  *   **Likelihood:** Certain (Group A).
  *   **Damage:** Critical. If the individuation conditions for worlds fail, the ontology collapses.
  *   **Concession:** Concede immediately that branch structure is emergent and approximate, not fundamental. Do not try to argue decoherence is sharp.
  *   **2-Minute Reply:** "Vagueness in world-counting doesn't entail vagueness in possibility. We accept vague objects (mountains, clouds) without denying their reality. The *fine-grained* structure of the wavefunction is precise; the *coarse-grained* branching we use for modality is interest-relative. Just as 'mountain' is vague but the underlying rock distribution is not, 'possible world' is a coarse-grained description of the precise quantum state. Modality tracks the coarse-grained structure because agents are coarse-grained systems."
  *   **Soft Spot:** Metaphysicians hate vague existence. If existence is vague, logic (specifically bivalence) may be threatened.

  #### 2. The "Trans-World Identity" Objection (Metaphysicians)
  **The Objection:**
  "Lewis rejected overlapping worlds to avoid the problem of accidental intrinsics. If a person exists in two branches prior to a split, they have contradictory properties (e.g., measuring spin-up in one, spin-down in the other). You say you have a new counterpart relation, but if the pre-split segment is numerically identical, you haven't solved the logical contradiction; you've just hidden it behind physics. How can one object have incompatible properties?"

  *   **Likelihood:** High (Group B).
  *   **Damage:** High. Challenges the logical coherence of the modal system.
  *   **Concession:** Concede that you are rejecting Lewis's "no overlap" constraint. Do not try to salvage Lewisian counterpart theory; you are replacing it.
  *   **2-Minute Reply:** "The contradiction only arises if we treat the properties as timeless and unindexed. On my view, properties are indexed to branches. The pre-split individual doesn't have 'spin-up' simpliciter; they have 'spin-up-on-branch-A' and 'spin-down-on-branch-B'. These are compatible properties, like 'being a father' and 'being a son'. The branching structure provides the indices that resolve the contradiction without needing distinct counterparts."
  *   **Soft Spot:** This requires a revision of standard predicate logic or property theory. Lewisans will view this as changing the subject rather than solving the problem.

  #### 3. The "Probability vs. Possibility" Objection (Everettians & Metaphysicians)
  **The Objection:**
  "Branching gives you a plurality of outcomes, but it doesn't give you probabilities. In modal realism, all worlds are equally real. In your view, all branches are equally real. So where does the Born rule come from? If you can't recover objective chance, you haven't explained modal *weight*, just modal *extent*. You've replaced brute modality with brute branching."

  *   **Likelihood:** High (Group A & B).
  *   **Damage:** Medium-High. Undermines the payoff regarding chance and laws.
  *   **Concession:** Concede that branching alone is insufficient for probability.
  *   **2-Minute Reply:** "Branching provides the space of possibilities; the Hilbert space measure provides the weights. I am not deriving probability from branching alone, but from the branching structure *plus* the geometry of the state space. The 'weight' of a world isn't a semantic stipulation; it's the squared amplitude of the branch. This anchors chance in physical structure rather than Humean best systems or primitive propensities."
  *   **Soft Spot:** Decision-theoretic derivations of the Born rule are controversial. If that derivation fails, your account of chance fails.

  #### 4. The "Humean Supervenience" Objection (Humeans)
  **The Objection:**
  "You're positing a branching structure that connects local facts across the universe. This structure doesn't supervene on the distribution of local, particular matters of fact. It's a global, modal constraint on reality. For a Humean, this is just modal realism in disguise. You haven't naturalized modality; you've just given it a wavefunction."

  *   **Likelihood:** Medium (Group C).
  *   **Damage:** Medium. Won't convince Humeans, but might not alienate others.
  *   **Concession:** Concede that your view violates Humean supervenience.
  *   **2-Minute Reply:** "Humean supervenience fails to account for quantum entanglement regardless of modality. If you accept QM, you've already accepted non-local structure. My account just makes explicit that this non-local structure *is* the modal structure. It's better to accept necessary connections that do physical work than to posit brute modal facts that do none."
  *   **Soft Spot:** Humeans will dig in. This is a fundamental worldview clash, not an argument you can win in Q&A.

  #### 5. The "Ersatzist" Objection (Metaphysicians)
  **The Objection:**
  "Why do we need concrete quantum branches? A maximal consistent set of propositions does the job without the ontological expense. Unless you can show that concrete branches explain something ersatz worlds *can't*, you're just multiplying entities."

  *   **Likelihood:** Medium (Group B).
  *   **Damage:** Low. This is a stalemate between realists and anti-realists.
  *   **Concession:** Concede that ersatzism is cheaper ontologically.
  *   **2-Minute Reply:** "Ersatzism treats modality as representational. But physical possibility isn't about representation; it's about capacity. The quantum state *does* the evolving; it doesn't just describe it. If you want modality to explain physical dynamics (like tunneling or interference), you need the concrete structure. Ersatz worlds can't interfere with each other; quantum branches do."
  *   **Soft Spot:** If the audience thinks modality is purely logical/semantic, this physicalist argument won't land.

  ---

  ### The "Hope Nobody Asks" Objection

  **The Objection:**
  "Is Quantum Mechanics contingent? If QM is true only in some worlds, then your account of *what a world is* depends on a contingent truth. If QM is false, do possible worlds cease to exist? You are grounding the nature of possibility on a specific physical theory. That makes your modal realism contingent, which is circular. You need modality to make sense of physical theory, but you're using physical theory to make sense of modality."

  *   **Why it's deadly:** It attacks the foundational priority. If the account of worlds relies on QM being true, it cannot account for the possibility of QM being false. It collapses the distinction between physical and metaphysical necessity.
  *   **Preparation:** If asked, pivot to "Naturalized Metaphysics." Claim you are offering an account of *physical* modality, not *logical* modality, and argue that logical modality is too thin to be interesting. (This is a retreat, but a necessary one).

  ---

  ### 90-Second Opening Defuser

  *Use this at the very start of the Q&A session to preempt Objections 1 (Fuzzy Branches) and 2 (Overlap).*

  "I want to flag two tensions I've built into this view on purpose. First, I am not claiming branches are fundamental. They are emergent, approximate, and vague. If you need sharp boundaries for your ontology, this view isn't for you. I'm arguing that modality is as vague as the macroscopic objects that inhabit it.

  Second, I am explicitly rejecting Lewis's 'no overlap' rule. On my account, worlds share a past. I know this invites the problem of accidental intrinsics. My solution is to treat properties as branch-indexed. I'm not trying to save Lewisian modal realism; I'm trying to save realism about modality by grounding it in physics. If the physics requires overlap and vagueness, then metaphysics should follow the physics, not the other way around."
