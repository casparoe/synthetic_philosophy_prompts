answer: |-
  You and your flatmate have stumbled into one of the deepest rabbit holes in decision theory. You aren't reinventing a worse version of something; you are reenacting a specific, well-documented schism between **Causal Decision Theory (CDT)** (your position) and **Logical/Timeless Decision Theory (LDT/TDT)** (her position), often illustrated by a scenario called the **Twin Prisoner's Dilemma** or **Superrationality**.

  You asked for the map, not the label. So let's put the terminology aside and look at the geometry of the disagreement.

  ### 1. The Map: Two Ways to View "Choice"

  The core of your argument is not about the payoffs (30 vs 10). It is about what a "decision" *is*.

  **Your Map (Causal):**
  You view the universe as a network of physical causes.
  *   **The Setup:** There are two physical brains in two physical rooms.
  *   **The Constraint:** Nothing you do *now* can send a signal back in time or through the wall to change her atoms.
  *   **The Logic:** Since her choice is causally independent of yours, it is a fixed fact (from your perspective) that you must predict. You ask: "Given that her choice is already set (even if I don't know it), which button gives me more?"
  *   **The Result:** Right dominates. If she presses Left, Right gets you 50 (vs 30). If she presses Right, Right gets you 10 (vs 0). Right wins in every causal timeline.

  **Her Map (Logical):**
  She views the decision as a logical function, not a physical event.
  *   **The Setup:** There is one *algorithm* for reasoning, instantiated in two places.
  *   **The Constraint:** $2 + 2 = 4$. If you calculate $2 + 2$ in New York and she calculates $2 + 2$ in London, you don't need to call each other to get the same answer. The results are correlated not because you called, but because the *logic* is identical.
  *   **The Logic:** She argues that "I press Left" and "She presses Left" are not two independent events. They are the same logical output. To imagine "I press Left and she presses Right" is to imagine a logical contradiction (like imagining $2 + 2 = 4$ here and $2 + 2 = 5$ there).
  *   **The Result:** You only have two real options: "We both press Left" (30) or "We both press Right" (10). 30 is better than 10. Press Left.

  **The Seam:** You are arguing about physics (causality); she is arguing about math (logic).

  ### 2. Is it the Golden Rule, Trust, or Team Reasoning?

  You asked if her move is just a dressed-up version of common moral heuristics. It feels like them, but structurally, it is distinct.

  **Is it the Golden Rule? ("Do unto others...")**
  *   **Verdict:** No.
  *   **The Seam:** The Golden Rule is *normative*. It says you *ought* to cooperate because it is moral. Your flatmate is making a *descriptive* claim about rationality. She isn't saying "You should be nice." She is saying "If you are rational, and she is rational, and you are identical, you *will* both press Left to maximize your own payoff." She is claiming Left is the selfishly correct move, not the moral one.

  **Is it Trust? ("I bet she's decent")**
  *   **Verdict:** No.
  *   **The Seam:** Trust is empirical. It relies on probability: "Most people are nice, so I'll risk it." If you trust her and she defects, you get 0. Your flatmate's argument removes the risk. She claims that if you press Left, she *necessarily* presses Left. It's not a bet; it's a logical guarantee (given the premises). Trust accepts the possibility of betrayal; her logic denies the possibility of divergence.

  **Is it Team Reasoning? ("What should *we* do?")**
  *   **Verdict:** Closest, but still distinct.
  *   **The Seam:** Team Reasoning changes the *agent*. It says, "Stop acting as 'I' and start acting as 'We'." Your flatmate keeps the agent as 'I'. She argues that by acting for 'I', she *automatically* acts for 'We' because the 'I's are logically linked.
      *   *Team Reasoner:* "I maximize the group total."
      *   *Flatmate:* "I maximize my total, knowing my decision determines hers."
      *   This is why it feels different. She isn't asking you to be altruistic; she's asking you to acknowledge your logical reach.

  ### 3. The Edges: Where the Logic Breaks

  This is where your argument likely got stuck. Her logic is brittle; it relies on perfect symmetry. Here is how the edges fray.

  **Edge 1: The 90% Problem (Noise)**
  Suppose you are 90% alike. You use the same reasoning, but you had one glass of wine and she didn't.
  *   **Your View:** Nothing changes. She is still causally separate. Press Right.
  *   **Her View:** Now it becomes a math problem.
      *   If I press Left: 90% chance she presses Left (30 pts), 10% chance she presses Right (0 pts). Expected Value = $0.9 \times 30 = 27$.
      *   If I press Right: 90% chance she presses Right (10 pts), 10% chance she presses Left (50 pts). Expected Value = $(0.9 \times 10) + (0.1 \times 50) = 9 + 5 = 14$.
      *   **Result:** Even at 90% similarity, Left (27) crushes Right (14).
  *   **The Breaking Point:** The math flips if similarity drops below roughly **71%**. Below that threshold, the chance of "exploiting" her (getting the 50) outweighs the benefit of matching (getting the 30).
  *   **The Insight:** Her logic survives *some* noise, but it degrades gracefully into probability. Yours does not change at all until communication is possible.

  **Edge 2: Coincidence vs. Common Cause**
  Suppose you aren't twins. You just happen to think alike. There is no "shared code," just a coincidence of upbringing.
  *   **Your View:** It doesn't matter. Without a causal mechanism, the correlation is spurious. Press Right.
  *   **Her View:** It doesn't matter *why* the algorithms are the same, only *that* they are the same. If two calculators from different factories both output "4" for "2+2", the correlation holds.
  *   **The Insight:** This is the hardest philosophical pill. Causal theory says correlation without causation is useless for decision-making. Logical theory says correlation *is* the mechanism. If you truly believe you are identical reasoners, the *cause* of that identity is irrelevant to the *output*.

  **Edge 3: Three People (or a City)**
  Now there are 100 people. All identical.
  *   **Left:** Everyone gets 30.
  *   **Right:** Everyone gets 10.
  *   **Mixed:** If you are the *only* one to press Right while 99 press Left, do you get 50?
      *   If the payoff structure scales (you exploit everyone), Right becomes incredibly tempting.
      *   If the payoff structure requires matching pairs, it gets complex.
  *   **The Insight:** As $N$ grows, the "logical control" one agent feels over the group dilutes *psychologically*, even if the math holds. If I am 1 of 1,000,000, does my decision really determine the output of the other 999,999? Logically, yes (if we are identical). Psychologically, it feels like drop-in-the-ocean causality, which pushes you back to CDT (Right).

  **Edge 4: Simultaneity vs. Causation (Your Gut Check)**
  You said: *"My gut says the trick only works if the two choices are somehow one act."*
  *   **You are right.** This is the crux.
  *   **CDT (You):** Time and space matter. Decisions are events in spacetime. Events are separate unless connected by light/signals.
  *   **LDT (Her):** Time and space do not matter. Decisions are computations. Computations are abstract objects. The calculation of "Prisoner's Dilemma Solution" exists outside of spacetime.
  *   **The Distinction:** Is a decision a *physical firing of neurons* (Your view) or the *resolution of a logical problem* (Her view)?
      *   If it's physical: You are right. You can't move her neurons.
      *   If it's logical: She is right. You can't solve $2+2$ differently than she does if you are both running "Addition."
  *   **Why it feels like rigging:** It feels like rigging because in the real world, we are never *perfectly* identical reasoners. There is always quantum noise, different sensory inputs, or slight cognitive drift. Her argument works perfectly in a world of perfect computers. It works *approximately* in a world of identical twins. It works *poorly* in a world of random strangers.

  ### Summary for the Dinner Table

  You aren't crazy, and she isn't crazy. You are using different operating systems.

  1.  **You are playing the game of Physics.** In physics, actions are local. You cannot affect a distant room without a signal. Therefore, you must protect yourself against the worst-case scenario (her defecting). You press **Right**.
  2.  **She is playing the game of Logic.** In logic, identical inputs to identical functions yield identical outputs. To choose Right is to force the "Right" output on both machines. To choose Left is to force the "Left" output on both. She chooses **Left**.

  **The Verdict:**
  If you are truly identical twins with identical information, **she is mathematically correct** within the framework of Logical Decision Theory. The correlation is real, and ignoring it leaves money on the table (10 instead of 30).

  However, **you are practically correct** for almost any real-world scenario. The moment there is *any* doubt about the similarity (are we *really* thinking the exact same thoughts right now?), the causal safety of "Right" becomes the robust choice. Her strategy requires 100% faith in the symmetry. Yours only requires faith in the payoff matrix.

  **The compromise:** Tell her she wins the argument *if* you accept the premise of "Superrationality" (perfect logical identity). But you win the argument *if* you treat this as a real-world interaction where perfect identity is impossible to verify. The "trick" works only if the two choices are, as your gut said, "one act." If they are two acts, she's wrong. If they are one act, you are. The argument is now metaphysics, not game theory.
