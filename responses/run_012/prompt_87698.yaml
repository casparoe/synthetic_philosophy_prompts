prompt: |-
  ok, so I'm a fourth-year PhD student — officially in phil of science, but I basically live in an applied modeling lab that does contract work for a state natural-resources agency (coupled econ/ecology stuff, fish-stock models, harvest quotas, that kind of thing). And I keep getting the same question from the agency people every time we hand over a model: you assumed X, X obviously isn't true, so can we still use this thing to actually set a quota? Right now I answer case by case and I'm pretty sure I contradict myself between meetings, so I want a procedure I can actually run.

  Background so you know where I'm coming from: this is basically the Friedman thing — unrealistic assumptions are fine as long as the predictions come out right. I definately get the appeal, but it can't be the whole story, because sometimes the assumption is doing the real explanatory work and the prediction is right for the wrong reason, and sometimes two models with contradictory assumptions predict the same number, so predictive success can't pick between them. I don't need you to relitigate the F-twist, I need it turned into something a non-philosopher can execute.

  I've got a half-baked taxonomy I want you to either use or replace with something better. I think every assumption that's actually load-bearing is one of three kinds: a limit case, where the assumption is what the model reduces to as some parameter goes to zero or infinity and it's roughly true in the regime we use it in; a tractability fiction, where we know it's false and we'd fix it if we could solve the fixed model, but we can't; or a stand-in, where the thing in the model doesn't correspond to anything real at all (a representative agent, a 'population' that's just the mean of a distribution), so asking whether it's 'true' might be a category error.

  What I want from you: a decision procedure I can run in maybe an afternoon on a single model, before I sign off on handing it to the agency. The questions in order, what counts as a good enough answer to each, where it stops with don't use this, where it stops with fine to use, and where it stops and hands the call to a human because it's really a value judgment about what we're willing to get wrong. Two steps I care about especially: (1) for any assumption, say which direction the answer will be biased if the assumption fails — I care way more about bias direction than about whether the assumption is realistic in the abstract; and (2) something that catches the case where the model predicts well for the wrong reason, or where predictive success can't distinguish two seperate assumptions.

  Then run it on three cases: (a) a fish-stock model that assumes the population is well mixed and that the fish don't evolve, used to set a harvest quota; (b) an economic model that assumes firms are price-takers and fully rational, used to score a carbon tax for revenue; and (c) your choice of a third where I'm not going to like the answer. Be honest about where the procedure is just judgment dressed up as a checklist, and tell me what it can't do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** 4th-year PhD student in Philosophy of Science, working in an applied modeling lab (econ/ecology, fish stocks, harvest quotas) for a state agency.
      *   **Problem:** Agency stakeholders constantly challenge model assumptions ("You assumed X, X isn't true, can we use this?"). The user's current ad-hoc responses are inconsistent.
      *   **Goal:** A concrete, executable decision procedure (checklist/algorithm) to evaluate model assumptions *before* handing over the model. Needs to be doable in an afternoon.
      *   **Philosophical Stance:** Aware of Friedman's "F-Twist" (instrumentalism) but recognizes its limits (right prediction for wrong reason, underdetermination). Doesn't want a philosophy lecture; wants operationalization.
      *   **User's Taxonomy:** Limit Case, Tractability Fiction, Stand-in. (I should evaluate if this is useful or needs refinement).
      *   **Specific Requirements:**
          1.  Determine bias direction if the assumption fails.
          2.  Catch "right for the wrong reason" or underdetermination issues.
          3.  Clear stop/go/human-judgment criteria.
          4.  Run on three cases: (a) Fish stock (well-mixed, no evolution), (b) Econ (price-takers, rational), (c) A "you won't like this" case.
          5.  Honesty about limitations (where it's just disguised judgment).

  2.  **Deconstruct the Problem:**
      *   The core tension is between *realism* (truth of assumptions) and *reliability* (robustness of output). The agency cares about risk management. If an assumption is false, does it make the quota *dangerous* (overharvest) or *conservative* (underharvest/lost revenue)?
      *   The user's taxonomy is actually quite good but needs to be tied to *consequences*.
      *   The "Bias Direction" requirement is crucial for policy. It turns a philosophical worry into a risk assessment.
      *   The "Right for Wrong Reason" requirement is about *structural validity* vs. *empirical fit*.

  3.  **Develop the Decision Procedure (The "Assumption Stress-Test Protocol"):**
      *   *Name:* Needs to sound professional but practical. "Assumption Robustness Protocol (ARP)"? "Model Assumption Vetting Checklist"? Let's go with "Assumption Risk & Robustness Protocol (ARRP)".
      *   *Structure:*
          1.  **Inventory:** List assumptions.
          2.  **Classification:** Use the user's taxonomy (Limit, Tractability, Stand-in).
          3.  **Sensitivity/Bias Analysis:** The core technical step.
          4.  **Underdetermination Check:** The "right for wrong reason" step.
          5.  **Decision Matrix:** Go/No-Go/Flag.
      *   *Refining the Taxonomy:* The user's three categories are good, but I need to add a fourth: *Negligible Effect* (assumption is false but doesn't change output).
      *   *Addressing Bias:* This requires local sensitivity analysis or theoretical derivation. I need to make sure the procedure acknowledges that this might be hard but is necessary.
      *   *Addressing "Right for Wrong Reason":* This is about *independent validation*. If the model fits past data, does it fit *mechanism* data? Or can we perturb the assumption and see if the fit breaks?

  4.  **Drafting the Steps (Iterative refinement):**
      *   *Step 1: Triage.* Is the assumption load-bearing? If removing it changes nothing, ignore it.
      *   *Step 2: Categorize.* (Limit, Tractability, Stand-in).
      *   *Step 3: Directional Sensitivity.* If Assumption A is false in direction D, does Output O go Up or Down? (Crucial for risk).
      *   *Step 4: The "Coincidence" Check.* (Addressing the "right for wrong reason"). Can a rival model with ~A predict the same? If yes, we have underdetermination.
      *   *Step 5: Risk Tolerance.* Compare Bias Direction to Agency Goals (Conservation vs. Profit).

  5.  **Running the Cases:**
      *   *Case A (Fish Stock):* Well-mixed (Spatial structure ignored), No Evolution.
          *   Well-mixed: False. Bias? If fish cluster, local depletion happens faster. Quota might be too high for specific sub-stocks. Risk: Local collapse.
          *   Evolution: False (fish get smaller). Bias? Harvest selects for small fish. Model assumes stable growth. Quota might be sustainable short-term, collapses long-term.
      *   *Case B (Econ/Carbon Tax):* Price-takers, Rational.
          *   Price-takers: False (market power). Bias? If firms have power, they pass less tax to consumers or absorb it. Revenue estimate might be off.
          *   Rational: False (bounded rationality). Bias? Firms might not switch tech fast enough. Revenue higher short-term, lower long-term?
      *   *Case C (The "Uncomfortable" One):* Needs to be something where the procedure says "Don't Use" or "High Risk" despite common practice. Maybe a *climate integrated assessment model (IAM)* used for immediate policy, or a *recidivism risk algorithm* in criminal justice. Let's go with a **Recidivism Risk Algorithm** (COMPAS-style). It uses proxies (zip code, arrest history) as stand-ins for "risk."
          *   Why they won't like it: The procedure will likely flag the "Stand-in" variables as having biased directions that correlate with protected classes, triggering the "Human Judgment/Value" flag. It exposes the normative load.

  6.  **Refining the Output:**
      *   Tone: Professional, peer-to-peer (PhD to PhD), pragmatic, slightly cynical but constructive.
      *   Format: Clear headings, bold text for actionable items.
      *   Self-Correction on "Afternoon": I need to ensure the steps are actually doable in an afternoon. Full sensitivity analysis takes weeks. I need to frame it as "Theoretical Directional Check" + "Quick Perturbation" rather than full Bayesian calibration.
      *   Addressing the "Right for Wrong Reason": This is the hardest part. I'll suggest a "Rival Mechanism Test." If Model M (with assumption A) and Model M* (with assumption ~A) fit the data equally well, flag it.

  7.  **Final Review against Constraints:**
      *   Decision procedure? Yes.
      *   Afternoon timeframe? Yes (with caveats).
      *   Bias direction? Included.
      *   Right for wrong reason? Included (Rival Mechanism).
      *   Three cases? Yes.
      *   Honesty about limitations? Yes.

  8.  **Constructing the Response:** (Mental Outline)
      *   Intro: Acknowledge the pain point. Validate the taxonomy.
      *   The Protocol (ARRP): 5 Steps.
      *   The Decision Matrix (Go/No-Go/Flag).
      *   Case Studies (Fish, Econ, Recidivism).
      *   Limitations (Where the philosophy bleeds through).

  *(Self-Correction during drafting)*: Wait, the user asked for *their* taxonomy to be used or replaced. Their taxonomy (Limit, Tractability, Stand-in) is solid. I will keep it but add a "Negligible" category for completeness. I need to make sure the "Bias Direction" step is explicit about *policy risk* (e.g., over-harvest vs. under-harvest).

  *(Refining Case C)*: The user said "your choice of a third where I'm not going to like the answer." This implies the procedure should yield a result that is inconvenient or reveals a deep flaw. A Recidivism model is good, but maybe something closer to their field but more controversial? How about an *Ecosystem Service Valuation* model used for cost-benefit analysis? It assumes commensurability of values (Stand-in). The procedure will flag that this is a Value Judgment, not a scientific one. That fits the "Phil of Science" background. Actually, let's stick with the Recidivism/Criminal Justice one or maybe an *Epidemiological Model* used for lockdowns. Let's go with an **Epidemiological SEIR model used for lockdown policy**. Why? Because the "Well-mixed population" assumption (like the fish) has massive ethical consequences if wrong (uneven spread), and the procedure will force an admission of uncertainty that policymakers hate. Or, better yet, a **Cost-Benefit Analysis of a Dam** using "Willingness to Pay." It assumes money = utility (Stand-in). The procedure will flag this as a Value Judgment. Let's go with the **Cost-Benefit Analysis (CBA)**. It's close enough to their econ/ecology work but the "Stand-in" assumption (money = welfare) is the killer.

  *Wait, re-reading the prompt:* "your choice of a third where I'm not going to like the answer." This suggests the *outcome* of the procedure is unpalatable. If I use CBA, the procedure will likely say "This requires a Value Judgment." That fits.

  *Let's finalize the Procedure Steps:*
  1.  **Load-Bearing Check:** Does it change the number?
  2.  **Taxonomy Sort:** Limit, Tractability, Stand-in.
  3.  **Directional Sensitivity:** If False, which way does the number move?
  4.  **Rival Mechanism Check:** Does ~A predict the same?
  5.  **Risk/Value Alignment:** Does the bias direction violate the precautionary principle/mandate?

  *Let's write it.*
answer: |-
  This is a classic "philosophy in the wild" problem. You are being asked to operationalize epistemic humility without paralyzing decision-making. Your taxonomy (Limit Case, Tractability Fiction, Stand-in) is solid; it maps well onto how modelers actually think. I will adopt it but add a fourth category ("Negligible") to allow for quick dismissal.

  Here is the **Assumption Risk & Robustness Protocol (ARRP)**. It is designed to be run in 2–4 hours per model. It shifts the conversation from "Is this true?" to "If this is false, does it break the mandate?"

  ---

  ### The Assumption Risk & Robustness Protocol (ARRP)

  **Time Budget:** 3 Hours
  **Inputs:** Model code/equations, Historical fit data, Agency Mandate (e.g., "Maximize yield subject to <5% collapse risk").

  #### Step 1: The Load-Bearing Filter (30 mins)
  List every explicit assumption. For each, ask: *If I relax this slightly, does the output number change by >5%?*
  *   **Method:** Quick perturbation. Change the parameter associated with the assumption by 10%. If the model crashes or output shifts negligibly, mark as **Negligible**.
  *   **Action:** If Negligible, archive and ignore. If Load-Bearing, proceed to Step 2.

  #### Step 2: Taxonomic Sorting (30 mins)
  Classify each Load-Bearing assumption into one of your four categories:
  1.  **Limit Case:** True in the limit (e.g., frictionless vacuum), approximately true in context.
  2.  **Tractability Fiction:** Known false, kept because the "true" model is unsolvable (e.g., linearizing a non-linear system).
  3.  **Stand-in:** Ontological mismatch (e.g., Representative Agent, "Population" = Mean).
  4.  **Negligible:** (From Step 1).

  *Why this matters:* It tells the agency *why* the assumption exists. Limit Cases are empirical claims; Tractability Fictions are computational costs; Stand-ins are conceptual compressions.

  #### Step 3: Directional Sensitivity Analysis (1 hour)
  **This is your bias requirement.** Do not ask "How wrong is it?" Ask "Which way does the error push the quota?"
  *   **Method:** Theoretical derivation or one-way sensitivity sweep.
  *   **Question:** If the real world violates this assumption in the *likely* direction (e.g., fish *do* cluster, firms *are* bounded rational), does the model output become **Optimistic** (overestimate yield/revenue, underestimate risk) or **Conservative** (underestimate yield, overestimate risk)?
  *   **Output:** Label each assumption: `[Bias: Optimistic]`, `[Bias: Conservative]`, or `[Bias: Unknown/Complex]`.

  #### Step 4: The "Right for Wrong Reason" Check (30 mins)
  **This is your underdetermination requirement.**
  *   **Method:** The Rival Mechanism Test. Can you name a plausible alternative assumption (~A) that fits the historical data *equally well* but implies a different future trajectory under policy intervention?
  *   **Example:** Model assumes "No Evolution." Data fits past 10 years. Rival: "Rapid Evolution." Does the rival fit the past 10 years too? If yes, you have underdetermination.
  *   **Output:** Label: `[Unique Mechanism]` or `[Underdetermined]`.

  #### Step 5: The Mandate Alignment Matrix (30 mins)
  Combine Step 3 and Step 4 with the Agency's legal/ethical mandate.
  *   **Green Light:** Bias is Conservative OR Bias is Optimistic but Mandate is "Maximize Profit" AND Mechanism is Unique.
  *   **Red Light:** Bias is Optimistic AND Mandate is "Prevent Collapse" (Precautionary Principle).
  *   **Yellow Light (Human Judgment):** Bias is Unknown OR Mechanism is Underdetermined.

  ---

  ### Case Studies

  Here is the ARRP applied to your three scenarios.

  #### Case A: Fish-Stock Model (Well-Mixed, No Evolution)
  *   **Assumption 1: Well-Mixed Population.**
      *   **Taxonomy:** Limit Case (Spatial homogeneity).
      *   **Bias Direction:** **[Optimistic]**. In reality, fish cluster. Trawlers target clusters. This leads to local depletion faster than the aggregate model predicts. The model says "10% left globally," but reality is "0% left in the breeding ground."
      *   **Mandate Check:** If the mandate includes "sustainable local fisheries," this is a **Red Light**.
  *   **Assumption 2: No Evolution.**
      *   **Taxonomy:** Tractability Fiction (Adding genetics makes the ODEs PDEs or IBMs).
      *   **Rival Mechanism:** **[Underdetermined]**. A model with rapid size-selection evolution fits the last 20 years of catch data just as well as the static model (because evolution is slow *until* it isn't).
      *   **Bias Direction:** **[Optimistic]**. Harvest selects for smaller/slower-growing fish. The model assumes stable growth rates. Quotas will be too high in the long run.
      *   **Verdict:** **Yellow/Red.** You must disclose that the quota is sustainable only if evolution remains static. If the agency mandate is precautionary, you cannot sign off without a buffer.

  #### Case B: Economic Model (Price-Takers, Rational Firms)
  *   **Assumption 1: Price-Takers.**
      *   **Taxonomy:** Limit Case (Perfect competition).
      *   **Bias Direction:** **[Unknown/Complex]**. If firms have market power, they might absorb the tax (lower revenue than predicted) or pass it on (higher consumer cost).
      *   **Rival Mechanism:** **[Underdetermined]**. Oligopoly models can often be calibrated to match historical price data similarly to perfect competition models.
      *   **Verdict:** **Yellow Light.** The revenue estimate is fragile. You cannot guarantee the revenue number.
  *   **Assumption 2: Full Rationality.**
      *   **Taxonomy:** Stand-in (for "responsive to incentives").
      *   **Bias Direction:** **[Optimistic]**. Firms are boundedly rational/inertial. They will not switch technology as fast as the model predicts. Short-term revenue might be *higher* (less avoidance), but long-term emissions reduction will be *lower*.
      *   **Verdict:** **Yellow Light.** If the goal is *revenue*, the model might be okay (short term). If the goal is *emissions reduction*, the model is Optimistic and dangerous.
      *   **Procedure Output:** You tell the agency: "This model predicts revenue well, but assumes instant adaptation. It will overestimate emissions cuts."

  #### Case C: Cost-Benefit Analysis of a Dam (Willingness-to-Pay = Welfare)
  *This is the one you won't like.*
  *   **Context:** A model determining whether to build a dam based on ecosystem services valuation.
  *   **Assumption: Willingness-to-Pay (WTP) is a valid Stand-in for Social Welfare.**
      *   **Taxonomy:** **Stand-in**. Money is not utility; WTP is constrained by ability to pay.
      *   **Bias Direction:** **[Systemic Bias]**. WTP correlates with wealth. The model will systematically undervalue benefits to poor communities (who rely on the river but have low WTP) and overvalue benefits to wealthy recreational users.
      *   **Rival Mechanism:** **[Underdetermined]**. A "Needs-Based" valuation model could fit historical economic data equally well but produce a opposite recommendation on the dam.
      *   **Mandate Check:** The agency mandate is likely "Public Good."
      *   **Verdict:** **Red Light / Human Judgment.**
      *   **Why you won't like it:** The procedure forces you to admit that this is not a scientific error; it is a **value judgment dressed as a parameter**. You cannot "fix" this with more data. The ARRP flags this as a "Value Load-Bearing Assumption." You must tell the agency: *"The model does not calculate 'benefit'; it calculates 'ability to pay.' Using this to justify the dam is a political choice, not a scientific finding."* This will make your bosses very unhappy.

  ---

  ### Limitations & Honest Confessions

  You asked where this is just judgment dressed up as a checklist. Here is the breakdown:

  1.  **Directional Sensitivity is Often Guesswork:** In complex coupled models (econ/ecology), the bias direction is rarely linear. Step 3 often devolves into "My intuition says Optimistic." I have labeled it "Analysis," but often it is "Expert Elicitation." *Mitigation:* Require a sign-off from a second modeler on the Bias Direction to reduce individual blind spots.
  2.  **The "Rival Mechanism" Test is Infinite:** In Step 4, how many rivals do you need to check to prove uniqueness? You can't check them all. *Mitigation:* Limit the test to "Plausible Rivals currently in the literature." If a rival exists in a published paper, you must flag it.
  3.  **The "Human Judgment" Bucket is a Black Hole:** The Yellow Light category is where the philosophy bleeds through. The procedure identifies the risk, but it cannot resolve it. It kicks the can to the agency director. *This is the feature, not the bug.* Your job is to make the uncertainty visible, not to resolve it.
  4.  **It Cannot Detect Structural Ignorance:** The ARRP evaluates *known* assumptions. It cannot catch "Unknown Unknowns" (e.g., a new pathogen, a black swan market crash). It protects against *model risk*, not *world risk*.

  ### How to Use This with the Agency
  When they ask, "Assumption X is false, can we use this?":
  1.  Pull the ARRP sheet for that model.
  2.  Point to Step 3: "Yes, it's false. We classified it as a Tractability Fiction."
  3.  Point to the Bias: "If it's false, the bias is Conservative. The quota we gave you is lower than the model suggests is safe."
  4.  If the Bias is Optimistic: "Yes, it's false. The bias is Optimistic. We recommend applying a 20% precautionary buffer."

  This moves the conversation from *Truth* (which you can't guarantee) to *Risk Management* (which is their job).
