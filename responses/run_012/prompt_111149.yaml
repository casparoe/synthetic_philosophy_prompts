answer: |-
  Hi there, thanks for pushing on this; it is the right impasse to hit. Here is the case built to your specifications. A municipal water agency aims to maximize Pipeline Integrity, defined structurally as the sum of Pressure Stability and Corrosion Resistance. Pressure Stability is exactly measurable via sensors; Corrosion Resistance is not. The metric adopted is Pressure Stability, a genuine constituent because holding Corrosion Resistance fixed, higher stability implies better integrity. A single engineer sets the chemical dosage for the water supply. Higher dosage stabilizes pressure perfectly but accelerates pipe corrosion. The engineer, acting in good faith to maximize Integrity using the only available exact metric, chooses the high dosage. Pressure Stability reaches its theoretical maximum. However, the unseen corrosion spikes, reducing overall Integrity below the baseline. No staff gaming occurs, citizens are unaware of scoring, and the measurement contains no noise. The degradation follows strictly from the chemical trade-off inherent in the system, not from error or deceit.

  Running this past your four explanations, none apply cleanly. The first fails because the metric tracks its constituent perfectly; there is no tracking error. The second fails because the physics are known, not extrapolated into untested regions. The third fails because the metric is a constituent, not a downstream effect; moving it does move part of the cause. The fourth fails by stipulation; there is no adversarial agent. If the case falls under none, it is because the mechanism is not informational or behavioral but structural. The single feature doing the work is the negative causal coupling between the measured constituent and the unmeasured constituent. When that feature is removed, meaning the two constituents are independent, the case collapses into successful optimization; maximizing the metric maximizes the goal. This leaves you with the skeptic's strongest objection: once bad faith, noise, and selection are excluded, this is just ordinary incomplete specification. You optimized a part and ignored the whole, which is a planning error, not a law of measurement. The obvious remedy of measuring the goal itself would not help here because the goal is latent; Integrity is not directly observable, only its constituents are. Measuring it more completely would require measuring Corrosion Resistance, but if that were possible, you would not be in this bind. The constraint doing the impossible work in your original request is likely the single decision rule; without repeated rounds, there is no dynamic shift where the measure ceases to be good, only a static error in weighting. Best, and let me know if this distinction holds water for the group.
