answer: |-
  Here is the ranking of your six arguments from strongest to weakest as grounds for an **actual right** (meaning a moral claim that imposes a duty on others), rather than just a good idea.

  **1. Argument 2 (Dignity)**
  This lands first because it establishes leisure as a requirement of human status rather than a reward for performance, creating a duty for employers to respect boundaries regardless of profit.
  *Best Objection:* It is difficult to quantify exactly how much leisure is required for dignity, making it hard to enforce without slipping into paternalism.

  **2. Argument 4 (Harm-Prevention)**
  This ranks second because it aligns with established legal frameworks for safety, turning leisure into a negative right to not be physically damaged by work conditions.
  *Best Objection:* It fails to protect the voluntary workaholic who remains healthy, suggesting their 80-hour weeks are permissible if they don't result in immediate injury.

  **3. Argument 3 (Dividend)**
  This takes third place because it grounds the right in distributive justice, arguing that workers have a claim on the specific time-saving value they helped create through technology.
  *Best Objection:* It relies on a contested theory of ownership regarding automation gains, and companies can argue the "dividend" was already paid in wages or lower consumer prices.

  **4. Argument 5 (Anti-Work-Ethic)**
  This comes in fourth because while it correctly identifies leisure as an intrinsic good, it struggles to impose a specific duty on an employer to facilitate your personal conception of the "good life."
  *Best Objection:* It risks collapsing into Argument 2 (Dignity) if pushed, as the reason work shouldn't consume life is ultimately that humans are more than their labor.

  **5. Argument 1 (Productivity)**
  This is fifth because it makes leisure contingent on business outcomes, meaning the "right" disappears the moment a company finds a way to profit from your exhaustion.
  *Best Objection:* It collapses into Argument 4 (Harm) upon inspection, since the primary reason rest boosts productivity is usually that it prevents the health damage outlined in the harm argument.

  **6. Argument 6 (Skeptic)**
  This ranks last as a ground for a right because it is actually an argument against the coherence of the claim, highlighting that without a clear duty-bearer, the language of "rights" is merely aspirational.
  *Best Objection:* It ignores that societies create duty-bearers (like the state or corporations) through law and contract, meaning the lack of a natural duty doesn't preclude creating a legal one.

  ***

  ### Which two to bring to your boss?

  If your goal is to actually win the vote, bring **Argument 4 (Harm-Prevention)** and **Argument 1 (Productivity)**.

  Argument 4 frames the 4-day week as risk management (avoiding burnout, liability, and turnover), which triggers a boss's duty of care. Argument 1 frames it as efficiency, which triggers their fiduciary duty to shareholders. Together, they cover safety and profit, which are the only two languages most management speaks fluently.

  ### Is your framing of a "right to leisure" confused?

  Honestly? **Yes and no.**

  It is not philosophically confused; Arguments 2 and 4 prove you can construct a coherent moral right to leisure that imposes a duty on employers. However, it is **politically confused** in a corporate context. In a business setting, "rights" language often sounds adversarial, like you are demanding something that belongs to you against their interests.

  To get the result you want, you should internally hold the "Right" framing (so you don't accept crumbs) but externally use the "Business Case" framing (Arguments 1 and 4). Don't tell your boss you have a *right* to time off; tell them the company has a *duty of care* to prevent harm and a *strategic interest* in sustainable output. It's the same outcome, but one gets you a signed policy and the other gets you a lecture on market conditions.
