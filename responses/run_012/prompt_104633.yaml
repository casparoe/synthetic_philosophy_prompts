  2.  **Deconstruct the Gut Verdicts & Existing Theory:**
      *   *Case 1 (Money Pump):* Standard economic theory says cyclic preferences violate *Transitivity*, a core axiom of rationality. The "individual steps look fine" intuition is the trap of myopia. The loop reveals the structural defect.
      *   *Case 2 (Non-Trading Cycler):* This challenges the idea that rationality is *only* about choices. If choices are optimal given constraints (avoiding the pump), is the agent rational? Most theorists say the *preferences* are still irrational even if behavior is protected. This supports the "Preferences can be irrational" view.
