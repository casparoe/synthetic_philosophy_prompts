answer: |-
  You have stumbled into one of the deepest rabbit holes in decision theory and moral philosophy. The tension you are feeling is the battle between **Synchronic Rationality** (consistency at a single moment) and **Diachronic Rationality** (consistency across time), and between **Substantive Rationality** (having good preferences) and **Instrumental Rationality** (choosing well given your preferences).

  Your gut verdicts are actually remarkably consistent with a sophisticated view called **Plan-Based Coherence**.

  Here is the principle that saves all six of your verdicts, followed by the verdict on the Fridge Case.

  ### The Principle: Reflective Plan Coherence

  **Rationality is the capacity to form and execute plans that satisfy one's reflectively endorsed preferences without self-sabotage.**

  This principle has three gears that need to mesh:
  1.  **Structural Coherence:** Preferences at any single moment must be logically consistent (transitive, respecting dominance).
  2.  **Diachronic Endorsement:** Preferences across time must either be stable or change in a way your "later self" endorses (no regret).
  3.  **Instrumental Efficacy:** Choices must effectively achieve the goal without unnecessary loss.

  Here is how this principle validates all six of your gut verdicts without contradiction.

  #### Case 1: The Money Pump (Sandwich Cycle)
  *   **Verdict:** Irrational.
  *   **Why:** Violates **Structural Coherence**.
  *   While each *individual* trade maximizes utility at that specific second (Instrumental Efficacy), the *structure* of the preferences makes it impossible to form a coherent plan. You cannot plan a trajectory through that preference set without losing value. The irrationality lies in the **topology of the preferences**, which renders any sequence of choices self-sabotaging.

  #### Case 2: The Non-Trading Cycler
  *   **Verdict:** Irrational Preferences, Rational Choices.
  *   **Why:** Distinguishes **Structure** from **Execution**.
  *   Your gut is right to feel something is "off." Her preference structure is still defective (intransitive), which makes her a "broken" agent in terms of Structural Coherence. However, her *choice* to refuse trade is Instrumentally Efficacious; she recognizes the structural defect and patches it with a rule ("no trading"). She is a rational pilot flying a broken plane. She avoids the *consequence* of irrationality, but she still *has* irrational preferences.

  #### Case 3: Taste Change (Opera)
  *   **Verdict:** Rational.
  *   **Why:** Satisfies **Diachronic Endorsement**.
  *   This is the crucial counterpoint to Case 4. Preferences *are* allowed to change over time. The test is **regret**. If the 60-year-old looks back and says, "I'm glad I loved opera then, even though I hate it now," there is no conflict between her temporal selves. There is no self-sabotage. The "Plan" of her life accommodates growth.

  #### Case 4: Time Inconsistency (Early Rise)
  *   **Verdict:** Irrational (Dynamic Inconsistency).
  *   **Why:** Violates **Diachronic Endorsement**.
  *   Unlike the Opera case, the 8pm self *does not endorse* the 6am self's preferences. The 8pm self views the 6am self's desire to sleep as a threat to be neutralized. This is a civil war between temporal selves. The fact that she needs to pay to precommit proves that her natural preference evolution is self-sabotaging. She is losing the "game" of agency because her future self cannot be trusted by her past self.

  #### Case 5: Hyperbolic Discounting ($100 vs $110)
  *   **Verdict:** Irrational.
  *   **Why:** Violates **Diachronic Endorsement** (Stationarity).
  *   This is the mathematical version of Case 4. If you prefer A over B today, you should prefer A over B tomorrow, provided the *delay* between them remains constant. By flipping preferences just because time has passed, you guarantee a suboptimal outcome (ending up with nothing). It is a failure to treat your future self as the same agent as your current self.

  #### Case 6: Dominance Violation
  *   **Verdict:** Flatly Irrational.
  *   **Why:** Violates **Structural Coherence** (Dominance Principle).
  *   This is worse than Case 1. In Case 1, the agent is choosing what they prefer locally (Turkey > Ham), it just loops badly. In Case 6, the agent is admitting, "I know B is better than A in every way I care about, and I am choosing A." This severs the link between **Value** and **Choice**. It is a breakdown of the very definition of agency.

  ---

  ### The Fridge Lock Case

  Now we apply **Reflective Plan Coherence** to your new case.

  **The Case:** A woman pays a service to lock her fridge. The lock costs more than the diet was ever worth to her. She *would* have stuck to the diet anyway.

  **The Verdict:** This is **Irrational**, but for a different reason than Case 4.

  **The Analysis:**
  1.  **Instrumental Efficacy Failure:** Rationality requires that the cost of the means does not exceed the value of the ends. If the diet success is worth \$100 to her, and the lock costs \$150, she has destroyed \$50 of value. This is a simple accounting error.
  2.  **Epistemic Failure:** She believes she lacks self-control ("I will break the diet"), but the counterfactual is that she *would* have stuck to it. She has false beliefs about her own agency.

  **Difference from Case 4 (The 8pm Precommitter):**
  *   **In Case 4,** the precommitment is the **rational solution to an irrational problem.** The 8pm self knows the 6am self *will* defect. Paying for an alarm clock (assuming cost < value of waking up) is the rational move to salvage the situation. The *need* for the lock is the symptom of irrationality; the *purchase* of the lock is the rational repair.
  *   **In the Fridge Case,** the precommitment is **an irrational solution to a non-existent problem.**
      *   If she would have stuck to the diet anyway, she didn't need the lock.
      *   If the lock costs more than the diet is worth, she shouldn't buy it even if she *did* need it.

  **Does it matter that she would have stuck to the diet anyway?**
  Yes.
  *   **If she would have broken the diet:** She is still irrational for paying *more* than the diet's value. (Overpaying for safety).
  *   **If she would have stuck to the diet:** She is irrational for paying *anything* for a constraint she didn't need. (Buying insurance against a risk that won't happen).

  **Summary of the Difference:**
  *   **Case 4 Woman:** "I know I am weak, so I will bind myself to be strong." (Rational management of known weakness).
  *   **Fridge Woman:** "I think I am weak (but I'm not), and I will overpay to bind myself." (Irrational management of imagined weakness).

  ### The "One Principle" Takeaway

  You asked if there is one principle. It is this:

  **Rationality is the alignment of local choice with a globally coherent, reflectively endorsed life-plan.**

  *   **Cases 1, 2, 6** fail on **Global Coherence** (logic of preferences).
  *   **Cases 4, 5** fail on **Reflective Endorsement** (conflict between temporal selves).
  *   **Case 3** passes because the change is **Endorsed**.
  *   **Fridge Case** fails on **Alignment** (cost exceeds benefit; belief contradicts reality).

  Your gut was right to distinguish Case 3 (Opera) from Case 4 (Early Rise). The difference isn't that preferences changed; it's that in Case 3, the agent remained at peace with her history, while in Case 4, the agent is at war with her future. Rationality is not just about getting what you want; it's about being a single, coherent entity that *wants* consistently enough to get it.
