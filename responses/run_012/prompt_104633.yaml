          *   *Difference from Case 4:* In Case 4, the precommitment allows her to achieve a preference (waking up) that she values more than the cost of the commitment mechanism (usually). If the cost of the alarm clock is less than the value of waking up, it's rational. If she pays $1000 for a $10 alarm, that's irrational.
          *   *So:* The Fridge case is irrational because Cost > Benefit. Case 4 is rational (or at least strategically sound) *if* Cost < Benefit of the goal. The prompt implies Case 4 is "losing a game she could win," suggesting the precommitment is the *solution* to irrationality, whereas the Fridge lock is an *instance* of irrationality (overpaying).

  5.  **Synthesizing the Principle:**
      *   The principle needs to handle the "Preferences vs. Choices" tension.
