      *   *Breakdown:*
          1.  **Synchronic Coherence:** Preferences at time *t* must be transitive and respect dominance (Cases 1, 2, 6).
          2.  **Diachronic Stability/Endorsement:** Preferences across time must either be stable or change in a way the agent reflectively endorses (Case 3 vs. 4 & 5).
