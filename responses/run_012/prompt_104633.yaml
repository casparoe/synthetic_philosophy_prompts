          *   *Wait, re-reading:* "lock costs her more than the diet was ever worth to her." This implies the *value* of the diet success is $X, the lock costs $X + $1.
          *   If she pays $X+$1 to secure a benefit of $X, she is losing value. That is irrational instrumentally.
