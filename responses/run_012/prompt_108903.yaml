answer: |-
  **Project Title:** The Locus of Selection: Reframing Dennett's Ladder for Externalized Cognition

  **1. The Central Question**
  Does the Gregorian category require the *internalization* of cultural tools into the neural architecture, or does functional offloading to external artifacts (where the tool remains outside the skull but coupled to the agent) constitute a distinct cognitive architecture?

  *Determinacy Condition:* The project succeeds if it produces a binary criterion for "internalization" versus "offloading" that maps cleanly onto Dennett's existing selection criteria. If the analysis concludes that the distinction is merely pragmatic (degree of coupling) rather than architectural (locus of selection), the hypothesis is falsified.

  **2. Why the Standard Framework Leaves This Open**
  The ambiguity is not an oversight but a structural feature of the original taxonomy. Dennett's ladder is built on the assumption that the *brain* is the primary environment where cognitive selection occurs.
  *   **Darwinian:** Selection happens in the genome (pre-brain).
  *   **Skinnerian:** Selection happens in behavioral output (post-brain).
  *   **Popperian:** Selection happens in internal models (in-brain).
  *   **Gregorian:** Selection happens in cultural tools, but Dennett explicitly describes these as "installing" tools *into* the brain (memes as viruses).

  The framework treats the skull as the boundary of the cognitive agent. It lacks the vocabulary to describe tools that perform the selection work *outside* the skull while remaining functionally integrated. Consequently, the framework cannot distinguish between a child who memorizes multiplication tables (internalized) and a child who uses a calculator (offloaded), treating both as merely "having access to arithmetic." This collapses two fundamentally different cognitive architectures into one rung.

  **3. Methodology (Three-Month Pilot)**

  *   **Month 1: Textual Archaeology & Definition**
      *   **Goal:** Rigorously define "internalization" within Dennett's corpus versus "coupling" in externalist literature.
      *   **Activity:** Close reading of key texts defining the Gregorian creature. Extract explicit criteria for what counts as "having a tool." Draft a working definition of "Locus of Selection" for each of the four rungs.
      *   **Deliverable:** A glossary of terms and a mapped taxonomy showing exactly where the "internalization" assumption is embedded.

  *   **Month 2: Stress Testing the Taxonomy**
      *   **Goal:** Apply the mapped taxonomy to edge cases to find the breaking point.
      *   **Activity:** Test three cases: (1) Writing/notebooks (classic extended cognition), (2) Calculators (algorithmic offloading), (3) LLMs (generative offloading). For each, ask: Where did the selection happen? Who died—the hypothesis or the user? Is the tool part of the phenotype?
      *   **Deliverable:** A case study matrix identifying where the Gregorian label fails to discriminate between internal and external tool use.

  *   **Month 3: Reconstruction & Verdict**
      *   **Goal:** Propose the reframed taxonomy.
      *   **Activity:** Decide whether the solution is a split within the Gregorian rung (Internal vs. External) or a fifth rung (e.g., "Cybernetic" or "Exo-Gregorian"). Draft the final argument focusing on the shift in the locus of selection.
      *   **Deliverable:** A 10-15 page position paper outlining the reframed ladder and the justification for the split/new rung.

  **4. Success vs. Failure Criteria**

  *   **Success:**
      *   You produce a clear criterion that distinguishes Internal-Gregorian from External-Gregorian based on *where the variation and selection occur*, not just where the tool sits.
      *   You reach a determinate verdict on whether this requires a fifth rung or a bifurcation of the fourth.
      *   The argument holds even if LLMs are removed (i.e., it applies to writing/calculators too, making it robust against tech hype).

  *   **Failure:**
      *   The distinction collapses into "degree of reliance," which is a continuum, not a typology.
      *   You find that Dennett's framework already accounts for this via "vehicles" vs. "content," rendering the reframing redundant.
      *   The project drifts into general philosophy of mind (extended cognition) without tying it back to the specific mechanics of Dennett's ladder.

  **5. Scope Assessment & Critique**

  *   **Is it half-baked?** No. The insight regarding the "locus of selection" is the strongest lever here. It moves the debate from "is AI conscious?" to "where does the evolutionary pressure land?" This is philosophically fertile ground.
  *   **The Risk:** The indecision between "fifth kind" vs. "fault line" is a scope trap. You cannot argue both in three months.
  *   **What to Cut:**
      *   **Cut:** Deep engagement with the broader Extended Mind Thesis (Clark/Chalmers). Use only what is necessary to define "offloading." Do not get bogged down in the "constitution vs. coupling" debate generally; focus strictly on how *Dennett's ladder* handles it.
      *   **Cut:** Empirical claims about AI capabilities. Treat the LLM as a conceptual placeholder for "external generative artifact." Do not try to prove what LLMs can do; assume they function as intended for the sake of the argument.
      *   **Keep:** The focus on *selection*. This is your unique contribution. Most people read the ladder as "levels of intelligence." You are reading it as "levels of evolutionary architecture." Keep that axis rigid.
  *   **Recommendation:** In Month 1, commit to treating it as a **fault line within the Gregorian stage**. It is less ambitious than claiming a fifth rung and easier to defend. If the fault line proves too deep, *then* argue for the fifth rung in Month 3.

  ***

  | Field | Content |
  | :--- | :--- |
  | **Central question** | Does the Gregorian category require internalization of tools, or does external offloading constitute a distinct cognitive architecture? |
  | **The reframe in one sentence** | Shift the ladder's axis from "creature intelligence" to "locus of selection," revealing a split in the Gregorian stage between internalized and externalized tools. |
  | **Why it's open** | Dennett's framework assumes the skull is the boundary of the cognitive agent and treats cultural tools as memes installed *in* the brain, leaving no room for externalized selection. |
  | **Month-by-month** | M1: Define internalization vs. offloading in texts; M2: Stress-test taxonomy against writing/calculators/LLMs; M3: Draft reframed taxonomy (split vs. new rung). |
  | **What success looks like** | A binary criterion for internal vs. external tool use based on selection locus, and a verdict on whether this bifurcates the 4th rung or adds a 5th. |
  | **What failure looks like** | The distinction collapses into a continuum of "reliance," or the project drifts into general extended mind theory without resolving the taxonomy. |
  | **What I should probably cut** | Deep dives into broader extended cognition literature and empirical claims about AI capabilities; treat AI as a conceptual placeholder. |
