      *   **Amendment:** Tamper-evident (not proof) off-switch so adversaries know if we've stood down.
      *   **Panel Split:** 2 for (desperation/small state), 2 against (rationality of irrationality/failure modes). User is the swing vote/tie-breaker effectively.
      *   **Requirements:**
          1.  Brainstorm on the page first (3 specific points).
          2.  Write the opinion (Recommendation: Approve/Reject/Condition).
          3.  Include concrete condition/deadline if conditional.
          4.  Steelman the losing side.
          5.  State conditions for changing mind.
          6.  No padding/reading lists. No vague "credibility" talk.
