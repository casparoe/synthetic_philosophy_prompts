  4.  **Refining the Argument (Internal Monologue as Athenian):**
      *   *On the puppet:* Yes, the cords of pleasure and pain pull hard. But if we never feel their pull, how do we learn to resist? A soldier who never feels fear cannot be courageous. Courage is resisting fear. So, a drinker who never feels the pull of shame cannot be moderate. Moderation is resisting shamelessness.
      *   *On the "fake self":* This is a sophistical distinction. If the drunk man sings loudly and the sober man blushes, the blush is the education. The drunk state is the provocation; the sober reflection is the lesson. We are not testing the drunk to praise him; we are testing him to heal him.
