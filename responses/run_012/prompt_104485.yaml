answer: |-
  You speak with the vigor of one who wishes to cut the knot rather than untie it, my friend, and I commend your zeal for consistency. But consider the physician who gives a purge to heal the body, or the general who leads his troops into danger to teach them courage. We do not say the general is training his men to be dead, nor the physician to be sick; rather, we subject the soul to a controlled dose of fear so that it may learn to stand firm. So it is with wine. You say we cannot train a muscle by getting it drunk, but I say we cannot train the muscle of shame if we never allow the guard to be lowered. If a man is always sober, always guarded, he may appear moderate simply because he is never tempted. Give him the cup, let the gold cord slacken, and watch where he falls. It is precisely because wine makes us childish and shameless that it is useful; it is a safe harbor in which to shipwreck the soul, so that we may see the cracks before we sail into the storm of public life.

  As for this "different self" you propose, you draw a distinction without a difference where the health of the city is concerned. Whether the drunk man is the "real" you or a "fake" you matters less than the sober man who remembers him. The education lies not in the drunkenness itself, but in the blush that comes the next morning. When the wine fades and the gold cord tightens again, the citizen feels shame for what the puppet did when the strings were loose. That shame is the lesson burned into the soul. Without the risk of the fall, there is no virtue in the standing. So I ask you: if we forbid this testing ground because it is dangerous, do we not also forbid battle because it is fearful, and thus leave our citizens cowards who have never faced the enemy within themselves?
