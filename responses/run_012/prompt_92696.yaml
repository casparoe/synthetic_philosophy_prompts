      *(Self-Correction)*: Ensure the LLM objection isn't "settled." Keep it open.

  7.  **Final Polish:** Check tone. Ensure it sounds like advice for a peer/mentor, not a lecture script. (The prompt asks for a *plan*).

      *   *Key Insight:* The Frame Problem isn't about *storage*, it's about *indexing/retrieval* of relevant facts. The plan must highlight *relevance*.

      *   *Example Refinement:* The "Cup" is good. Let's specify: "I pick up this cup."
      *   *Whiteboard usage:* Draw the "State Before" and "State After." The gap is the "Frame."

      *   *Misconception Timing:*
          *   "Computers are slow": When they suggest just listing more facts.
          *   "Robots only": When transitioning to human cognition.
          *   "Halting Problem": At the very end, distinguish undecidability from intractability/relevance.

      *   *LLM Objection:* Place this in the last 10 minutes. It's the "synthesis" phase.

      *   *Closing Question:* "If I tell you I ate a sandwich, what is one thing you now know is *false*?" (Tests inference of change vs. stability). Or better: "When I say 'I walked through the door,' what is the one fact you *didn't* think about, but a computer must?"

      *   *Wait, the prompt asks for ONE question to show if the idea landed.*
