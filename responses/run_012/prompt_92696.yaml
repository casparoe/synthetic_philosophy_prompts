prompt: |-
  I am a junior and I run my school's philosophy club. Next Thursday I have forty-five minutes and a whiteboard to introduce the frame problem to about a dozen members who have read no philosophy and no computer science; last week one of them insisted the whole issue is obsolete, since a model trained on the internet has never needed anyone to write down which facts stay true when something changes. I do not want the explanation itself; I want a plan for giving it. What has to be established first, and what depends on what, so that the problem arrives as a discovery rather than as a puzzle someone invented? Which single example should carry the whole session, and what must it have and lack to do that work? Which misconceptions will they form — I expect at least that it is only about computers being slow, that it is the same thing as the halting problem, and that it concerns robots rather than thinking generally — and at exactly which point in the sequence should I head each one off? Does comparing it with the halting problem help or mislead? How should I treat my friend's objection without settling it for them, and what should I openly decline to explain at this level? Finally, give me one question to ask at the end that would show whether the idea landed.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** High school juniors (approx. 16-17 years old), philosophy club members. No background in philosophy or CS.
      *   **Constraint:** 45 minutes, whiteboard only.
      *   **Topic:** The Frame Problem.
      *   **Specific Challenge:** One member thinks it's obsolete due to LLMs/ML ("models trained on the internet").
      *   **Goal:** A *plan* for teaching, not the explanation itself. Focus on sequencing, dependencies, example selection, misconception management, handling the objection, scope boundaries, and an assessment question.
      *   **Tone:** Pedagogical, strategic, precise.

  2.  **Deconstruct the Frame Problem:**
      *   *What is it?* It's the problem of representing change in logic/AI without having to explicitly state everything that *doesn't* change.
      *   *Why is it hard?* Common sense reasoning assumes inertia (things stay the same unless acted upon). Formal logic requires explicit axioms.
      *   *Why does it matter?* It touches on the nature of relevance, context, and human cognition vs. formal systems.
      *   *The LLM Objection:* "LLMs don't use explicit axioms, so they bypass it." (Counter: They still struggle with causal reasoning and consistency over long contexts, but the *philosophical* point about relevance remains).

  3.  **Drafting the Plan - Step-by-Step:**

      *   **Phase 1: Foundations (What must be established first?)**
          *   Need to establish how we represent knowledge.
          *   Need to establish how we represent *change*.
          *   Need to show the gap between human intuition and formal rules.
          *   *Dependency:* Can't show the problem until they agree on the rules of the game (logic/rules-based thinking).

      *   **Phase 2: The Core Example (Which single example?)**
          *   Classic: The Block World. (Too abstract?)
          *   Classic: The Robot and the Bomb. (Too narrative?)
          *   Classic: Painting a Wall. (Good, but maybe mundane.)
          *   *Selection:* **The "Moving a Cup" Scenario.**
          *   *Why?* Everyone knows what a cup is. Everyone knows moving it doesn't change its color, the time, the location of the moon, etc.
          *   *Requirements:* Must be simple enough to formalize quickly on a whiteboard. Must be complex enough to generate infinite non-changes.
          *   *Must Lack:* Complicated physics or emotional context. Keep it sterile to highlight the logical burden.

      *   **Phase 3: Sequencing & Misconceptions (When to head them off?)**
          *   *Misconception 1: "It's just about speed."* -> Address when introducing the "list of non-changes." Show the list is *infinite*, not just long.
          *   *Misconception 2: "It's the Halting Problem."* -> Address early or late? Better late, as a comparison. Actually, the prompt asks if it helps or misleads. It mostly misleads because Halting is about computability, Frame is about representation/relevance. I should advise *against* deep comparison but acknowledge the "impossibility" vibe.
          *   *Misconception 3: "It's only about robots."* -> Address when generalizing to human thought.
          *   *The LLM Objection:* This is crucial. Don't crush it, but contextualize it. It changes the *implementation*, not the *conceptual* problem of relevance.

      *   **Phase 4: Scope (What to decline explaining?)**
          *   Don't explain circumscription, situation calculus, or non-monotonic logic syntax.
          *   Don't solve it. (It's arguably unsolved or dissolved).
          *   Don't get bogged down in neural net architecture.

      *   **Phase 5: The Closing Question.**
          *   Needs to test if they understand *relevance*, not just *memory*.

  4.  **Refining the Strategy (Self-Correction/Iterative Thinking):**

      *   *Timing:* 45 mins is tight.
          *   0-5: Hook & Setup.
          *   5-15: The Example & The Explosion.
          *   15-25: The Philosophical Pivot (Relevance).
          *   25-35: The LLM Objection & Misconceptions.
          *   35-45: Discussion & Closing Question.
      *   *The LLM Objection:* The student says "models trained on the internet never needed anyone to write down which facts stay true." This is technically true (statistical correlations vs. logical axioms). But the *Frame Problem* is about *cognitive relevance*. Even an LLM has to decide what tokens are relevant to the next token. I need to frame the objection as "Does this solve the problem of *knowing what matters*?"
      *   *Halting Problem:* Comparing them is dangerous. Halting is mathematically proven undecidable. Frame is arguably a category error or a representation issue. I should advise *against* the comparison to avoid confusion, or use it only to distinguish "computational limits" vs. "representational limits."
      *   *The Example:* "Moving a Cup" is good. Let's make it "The Bomb and the Battery" (McDermott's variant) or just "Moving a Block." Let's stick to **"Moving a Block"** but emphasize the *side effects*. Actually, the "Cup of Coffee" is more relatable. Let's go with **"Picking up a Cup."**
      *   *Wait, one example to carry the whole session:* It needs to scale.
      *   *Revised Example:* **The "Open Door" Scenario.**
          *   State 1: Door is Closed.
          *   Action: Open the Door.
          *   Question: Is the door open? (Yes). Is the door painted? (Yes). Is the moon made of cheese? (No).
          *   This highlights the "Frame" (what stays within the frame of unchanged things).
          *   *Actually, the "Robot and the Bomb" is the historical classic, but "Moving a Cup" is better for laypeople.* Let's stick with **"Moving a Cup."** It's physically intuitive.

      *   *Handling the Objection:* The student is right that modern AI doesn't use GOFAI (Good Old-Fashioned AI). But the *philosophical* problem (How do you know what is relevant?) remains. I need to make sure the club sees the Frame Problem as a problem of *mind*, not just code.

  5.  **Finalizing the Plan Structure:**
      *   **Objective:** Make them feel the burden of explicitness.
      *   **Sequence:** Intuition -> Formalization -> Explosion -> Relevance -> Modern Context.
      *   **Misconceptions:** Speed (address at Explosion), Robots (address at Relevance), Halting (address at Modern Context/End).
      *   **LLM Objection:** Validate the tech, challenge the philosophy.
      *   **Closing Question:** Something about relevance.

  6.  **Writing the Response:** (Focusing on the "Plan" aspect, not the "Lecture").
      *   *Structure:*
          1.  Pedagogical Goal.
