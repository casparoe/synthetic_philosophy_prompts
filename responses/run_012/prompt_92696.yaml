answer: |-
  Here is a strategic plan for your 45-minute session.

  ### 1. Pedagogical Dependencies
  To make the Frame Problem arrive as a discovery, you must build a specific chain of assumptions. Do not introduce the "problem" until the chain is complete.

  *   **Step 1 (Establish): Knowledge is a List.** You must first get them to agree that for a computer (or a formal logic system) to "know" something, that fact must be written down explicitly as a rule or a data point.
      *   *Why:* If they think knowledge is implicit or intuitive, the problem vanishes.
  *   **Step 2 (Establish): Change is Editing.** You must establish that for the system to understand an action (e.g., "move the cup"), it must update that List.
      *   *Why:* This sets up the mechanical burden of the system.
  *   **Step 3 (Establish): Non-Change is also Editing.** This is the crux. You must lead them to realize that if the system doesn't *say* a fact stays the same, the logic assumes it *might* have changed.
      *   *Dependency:* This relies entirely on Step 1. If knowledge isn't a list, you don't need to preserve the list items.
  *   **Step 4 (The Discovery): The Explosion.** Once Step 3 is accepted, the problem reveals itself: The list of things that *didn't* change is effectively infinite.
      *   *Result:* The Frame Problem is no longer a puzzle you invented; it is a mathematical consequence of the rules they just agreed to.

  ### 2. The Single Example: "The Cup on the Table"
  Do not use robots, bombs, or blocks. Use a **coffee cup on a desk**.

  *   **What it must have:**
      *   **Physical permanence:** Everyone knows a cup doesn't change color when moved.
      *   **Contextual isolation:** It must be in a room with other objects (a laptop, a window, the moon outside) to generate "non-changes."
      *   **Simplicity:** You must be able to write the "State Before" and "State After" on the whiteboard in under 2 minutes.
  *   **What it must lack:**
      *   **Emotional weight:** Don't make it a precious heirloom.
      *   **Complex physics:** No spilling, breaking, or heat transfer.
      *   **Ambiguity:** The action must be "Pick up the cup." Nothing else.

  **Why this example?** It forces the gap between *human common sense* (obviously the moon didn't move) and *formal requirement* (prove the moon didn't move).

  ### 3. Sequence and Misconception Management
  **0:00–0:10: The Setup (Steps 1 & 2)**
  *   Draw the desk. List 5 facts on the board (Cup is on desk. Cup is blue. Laptop is on desk. Window is closed. It is Tuesday).
  *   Ask: "If I want a machine to know this, where does the info live?" (Write it down).
  *   Action: "I pick up the cup." Update the first fact.
  *   *Check:* Ask, "Did the laptop move?" (No). "Did the cup change color?" (No).

  **0:10–0:20: The Explosion (Step 3 & 4)**
  *   **The Trap:** Ask, "How does the machine know the cup is still blue?"
  *   They will say, "It just knows."
  *   **The Pivot:** Remind them of Step 1. "It only knows what is written. Do we have a rule that says 'Moving things don't change color'?"
  *   If they say "Add that rule," ask: "What about position? What about temperature? What about the distance to the moon?"
  *   **Misconception 1 (Speed/Storage):** Someone will say, "Just list all the things that didn't change. Computers have huge memory."
      *   **Intervention:** Stop immediately. Draw an infinity symbol. Explain the issue isn't *storage*, it's *processing time*. To check a billion "non-change" rules every time you lift a cup means the robot starves to death before it drinks. The problem is **computational tractability**, not capacity.

  **0:20–0:30: The Philosophical Pivot (Relevance)**
  *   Shift from "How do we code this?" to "How do *we* do this?"
  *   Ask: "Why didn't *you* worry about the moon's position?"
  *   **Misconception 2 (Robots only):** Someone will say, "Good thing we aren't computers."
      *   **Intervention:** Challenge this. "If you aren't using a list of rules, what are you using? How does your brain filter out the moon without checking it?" This turns the Frame Problem from a bug in AI into a mystery of human cognition (epistemology).

  **0:30–0:35: The Halting Problem Comparison**
  *   **Verdict:** **Do not compare them.** It misleads.
  *   **Reasoning:** The Halting Problem is about *logical impossibility* (it cannot be done). The Frame Problem is about *practical impossibility* (it's too much work) and *relevance* (what matters?).
  *   **If raised:** If a student brings it up, say: "Halting is about whether a program stops. Frame is about what the program ignores. One is a wall; the other is a fog." Move on.

  **0:35–0:40: The LLM Objection (Your Friend's Point)**
  *   **Strategy:** Validate the tech, isolate the philosophy.
  *   **Script:** "Your friend is right that modern AI (like LLMs) doesn't use explicit lists of rules. They use statistical probabilities. But ask yourself: When the model writes a story, how does it decide that 'opening a door' doesn't imply 'the sun went out'? It still has to predict which facts are **relevant** to the next word."
  *   **The Open Loop:** Do not settle this. Say: "Some say neural nets dissolve the Frame Problem. Others say they just hide it inside a 'black box' where we can't see the errors. We don't know yet." This honors your friend's insight without ending the discussion.

  **0:40–0:45: Scope and Closing**
  *   **What to Decline:** Explicitly state you will not explain *how* logicians tried to fix this (e.g., Situation Calculus, Circumscription). It requires math you don't have time for. The goal is to feel the problem, not solve it.
  *   **The Closing Question:**
      To test if they understand that the problem is about **relevance**, not **memory**, ask this:

      > *"If I tell you 'I painted the wall red,' you instantly know the wall is now red. But what is one specific fact you also know is **still true**, that you didn't consciously think about until right now?"*

      *   **Success Indicator:** If they answer with a specific, irrelevant fact (e.g., "The floor is still under the wall" or "My name hasn't changed"), they get it. If they answer "The wall is wet" or "The paint is dry," they are thinking about *consequences*, not the *Frame*. You want them to identify the background inertia.

  ### Summary of Whiteboard Layout
  1.  **Left Column:** "State Before" (List of 5 facts).
  2.  **Middle:** "Action: Move Cup."
  3.  **Right Column:** "State After" (Only 1 fact changed).
  4.  **Bottom:** A growing list of "Things we must check didn't change" (Color, Moon, Time, Laptop, etc.) that runs off the board.

  This plan ensures the students feel the weight of the "non-changes" before you ever name the problem, making the Frame Problem a realization rather than a definition.
