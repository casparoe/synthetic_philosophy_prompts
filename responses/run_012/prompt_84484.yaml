  **Plan**

  *   **Refrains:** A1: "I say aloud: what he did was wrong." (Assertion of the evaluative clause). A2: "I hold my tone to keep the measure strong." (Expressivist reconciliation: consistency of attitude).
  *   **Evaluative Clause:** "what he did was wrong."
  *   **Embedding:** Stanza 2, Line 1 ("Suppose we grant what he did was wrong").
  *   **Inference:** Stanza 2 enacts the Modus Ponens pressure (Conditional antecedent → Consequent → Flat Verdict).
  *   **Reconciliation:** The closing couplet joins the assertion with the commitment to consistency ("measure"), presenting logic as a constraint on attitudes rather than a description of facts.
  *   **Scene:** Two speakers over coffee; ordinary language throughout.

  ***

  **The Measure**

  I say aloud: what he did was wrong.
  You stir your coffee, look away.
  I hold my tone to keep the measure strong.

  Suppose we grant what he did was wrong.
  Then blame arrives and stays throughout the day.
  I say aloud: what he did was wrong.

  The echo lasts however long.
  The words lie flat upon the tray.
  I hold my tone to keep the measure strong.

  Though careful thought extends along.
  You press me hard to make me say.
  I say aloud: what he did was wrong.

  Where all of our choices belong.
  Does meaning fade or slip away?
  I hold my tone to keep the measure strong.

  We join the parts to sing along.
  To keep the wilder thoughts at bay.
  I say aloud: what he did was wrong.
  I hold my tone to keep the measure strong.

  ***

  **Note for the Handout**

  Line 1 asserts the evaluative clause flatly; Line 4 embeds that identical clause under a supposition, enacting the Frege–Geach problem. Stanza 2 models the inference: the conditional antecedent (Line 4) pressures the verdict (Line 6), demanding identical content in both positions. The B-rhymes ground the abstraction in a scene of dialogue. The closing couplet offers the expressivist reconciliation: moral logic is not about truth but about maintaining consistency ("measure") among our attitudes. The seam remains visible in "hold my tone," marking the normativity as a task we perform, not a fact we find.
