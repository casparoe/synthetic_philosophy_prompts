answer: |-
  There is no single, canonical term in English that captures this configuration exactly, though it sits at a well-populated intersection of political theory, lexical semantics, and rhetoric. You have correctly identified that "false friends" is too linguistic/inter-lingual, "polysemy" is too neutral, and "semantic drift" is too historical.

  The closest established concept is W.B. Gallie's **"Essentially Contested Concept,"** but your observation identifies a specific pathology *within* that category. Where Gallie assumes participants recognize they are fighting over the *same* complex value, your phenomenon describes a state where participants believe they are defending the *only* valid meaning against a corruption.

  Since no single label fits perfectly, I will first outline the nearest established neighbors and why they fall short, and then offer a precise carving for the phenomenon, proposing a term to anchor it.

  ### 1. The Nearest Neighbors (and why they fail)

  **A. Essentially Contested Concepts (Gallie, 1956)**
  *   **What it covers:** Concepts like "democracy," "justice," or "liberalism" where disagreement is inherent to the concept. All parties agree the concept is valuable, but disagree on its best instantiation.
  *   **Where it fails:** Gallie requires **reciprocal recognition**. For a concept to be "essentially contested" in Gallie's sense, Party A must recognize that Party B's usage is a *rival interpretation* of the same ideal. In your "liberal" example, the American does not think the European is offering a rival interpretation; they think the European is *wrong about the word*. The disagreement is not just about the value, but about the semantic authority. Your phenomenon is a **broken contest**: the parties are playing different games on the same board.

  **B. Intra-lingual False Friends**
  *   **What it covers:** Linguists do use "false friends" for dialectal variations (e.g., "biscuit" in US vs. UK English).
  *   **Where it fails:** As you noted, this implies a learner's error or a harmless dialectal quirk. It lacks the **normative stakes**. No one argues that the British usage of "biscuit" is a moral hijacking of the American term. Your phenomenon requires that the divergence matters to the speakers' identities and that they claim exclusive ownership of the signifier.

  **C. Conceptual Dissociation (Perelman & Olbrechts-Tyteca)**
  *   **What it covers:** A rhetorical technique where a speaker splits a unitary concept into two (Concept I vs. Concept II) to resolve a contradiction (e.g., "This is not *true* justice, merely *legal* justice").
  *   **Where it fails:** This describes a *tactic* used by an individual arguer, not a stable *sociological state* between two communities. However, your phenomenon is effectively a **frozen conceptual dissociation** where Community A has adopted Term I and Community B has adopted Term II, and neither acknowledges the split.

  ### 2. The Carving: Defining the Phenomenon

  If we are to carve this out properly, we need a definition that distinguishes it from mere ambiguity. The core of the phenomenon is not that the word has two meanings, but that the two meanings claim **exclusive legitimacy**.

  I propose the term **"Conceptual Schism"** (or more technically, **"Normative Semantic Divergence"**).

  **Definition:**
  A **Conceptual Schism** occurs when a single signifier (word/phrase) sustains two or more synchronous, internally coherent definitions across distinct speech communities within the same language, satisfying four conditions:

  1.  **Systematic Divergence:** The meanings are not random variants but differ along a specific, salient axis (e.g., state power, individual liberty).
  2.  **Normative Sovereignty:** Each community treats its own definition as the "plain" or "true" meaning and the other's as a distortion, euphemism, or hijacking.
  3.  **Opacity:** Fluent speakers in Community A are often unaware that Community B's usage is stable and coherent; they assume it is an error or a lie.
  4.  **Interference:** The divergence materially obstructs substantive agreement, because disputes about the world cannot be separated from disputes about the word.

  **What this excludes (The Boundaries):**
  *   **Ordinary Polysemy:** "Bank" (river vs. money) is excluded because neither side claims the other is misusing the word. There is no normative sovereignty.
  *   **Slang/Jargon:** If doctors use "code" differently than laypeople, this is excluded unless laypeople start claiming the medical usage is "wrong" and try to reclaim the word for public use.
  *   **Historical Drift:** If the old meaning dies out (e.g., "awful" meaning "full of awe"), it is not a schism. A schism requires the competing meanings to be **synchronous** and **live**.
  *   **Strategic Ambiguity:** If a politician uses "freedom" vaguely to please both sides, that is equivocation. A Conceptual Schism exists even when no one is trying to be vague; the speakers are being precise, but their precisions clash.

  ### 3. Addressing Your Edge Cases

  You asked specifically about the edges of this carving. Here is how **Conceptual Schism** applies to them:

  **Case 1: Unfamiliarity vs. Systematic Opposition**
  *   *Question:* Does it apply when the usages are merely unfamiliar, or only when opposed?
  *   *Carving:* It requires **opposition**, not just difference. If two communities use "bug" to mean "insect" and "software error," that is just jargon. It becomes a Schism only when the definitions pull in opposite directions on a valued axis (e.g., "freedom" meaning *from* state vs. *by* state). The friction is essential. If the meanings are orthogonal (unrelated), it's polysemy. If they are contradictory, it's a schism.

  **Case 2: Awareness and Strategic Trading**
  *   *Question:* What if one community knows the other's sense and trades on it, while the other remains oblivious?
  *   *Carving:* This is a **Asymmetric Schism**. This is common in propaganda or culture wars. One side (often the more politically sophisticated or media-literate) knows the word is contested and uses the ambiguity to smuggle in premises. The other side operates in good faith. This still fits the definition because the *structural* conditions (divergence, sovereignty, interference) are met, even if the *epistemic* condition (opacity) is one-sided. The oblivious side still experiences the other's usage as a distortion.

  **Case 3: The Third Sense (e.g., "Liberal Democracy")**
  *   *Question:* How do we handle a third, technical sense circulating simultaneously?
  *   *Carving:* This is a **Multi-Polar Schism**. "Liberal" in "Liberal Democracy" functions as a technical term in political science (constitutionalism), distinct from both the US (left) and EU (market) senses. This complicates the schism but does not dissolve it. It adds a third claimant to sovereignty. The definition holds as long as the claimants view the others as distortions. In fact, the existence of a technical third sense often fuels the schism, as both political sides may try to claim the "technical" mantle to legitimize their "partisan" usage.

  ### 4. Why "Conceptual Schism" fits better than "False Friends"

  You noted you were calling them "two-way false friends." The problem with that label is that "False Friends" implies the speakers *should* be speaking the same language but aren't. In a **Conceptual Schism**, the speakers *are* speaking the same language, but the concept has fractured under political pressure.

  *   **False Friend:** "I thought you meant X, but you meant Y. My mistake for assuming."
  *   **Conceptual Schism:** "You mean Y? That is a corruption of X. You have hijacked the word."

  The emotional and normative temperature is the distinguishing feature.

  ### Summary

  There is no single word in the OED for this. In political theory, it is a **failure of reciprocal recognition within an Essentially Contested Concept**. In linguistics, it is **Intra-lingual Normative Polysemy**.

  If you need a label for your notes that captures the edges correctly, I recommend **"Conceptual Schism."**

  *   **It captures the unity:** It acknowledges there was once (or theoretically is) one concept.
  *   **It captures the break:** It acknowledges the meanings are now mutually exclusive.
  *   **It captures the stakes:** "Schism" implies a religious or ideological split, fitting the "hijacking/sovereignty" dynamic you described.
  *   **It handles the edges:** You can have asymmetric schisms, multi-polar schisms, and dormant schisms, just as you can have schisms in churches.

  It distinguishes itself from **polysemy** (which is cooperative), **drift** (which is temporal), and **false friends** (which are inter-lingual). It isolates the specific pain you are describing: the inability to separate the argument about the world from the argument about who owns the dictionary.
