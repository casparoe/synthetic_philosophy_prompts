answer: |-
  Your intuition is sharper than the standard economic advice, which tends to treat all sunk costs as irrelevant noise. The principle that captures your verdicts is that sunk costs should be ignored when they represent a pure loss, but they become relevant when the past expenditure has created a non-transferable asset, such as a specific identity, a relationship, or a threshold requirement for completion. In the cases of the restaurant, the war, and the novel, the money, lives, and time are gone and have not built a structure that requires further investment to unlock value. They are dead losses. Continuing in those scenarios is simply adding new costs to old ones without any new benefit. However, in the cases where you feel hesitation, the past investment has changed the nature of the present choice. Your uncle is not maximizing profit; he is stewarding a family legacy, which is a current asset that exists only because of the past. A stranger cannot buy that legacy, so the stranger's rational choice differs from your uncle's. Similarly, with the piano, the three years of practice have built an identity as a pianist, and quitting feels like a betrayal because it devalues that identity. The cost isn't just the time; it's the narrative coherence of your life.

  This distinction clarifies why your wake up tomorrow test seems to fail for the hardware store. If your uncle woke up with no memory, he would indeed close the store, because the memory of his father is the actual asset he is preserving. The test works perfectly if you understand that for the uncle, the memory is a current benefit, whereas for the restaurant owner, the memory of the money spent is just a pain. The principle here is that sunk costs count when the memory of the cost is itself a source of utility, either through loyalty, identity, or the requirement of completion. This brings us to the PhD case, which is the most complex. If there is truly no career payoff and you hate the work, finishing is likely still a mistake, but for a different reason than the restaurant. The five years are sunk, but the degree is a threshold good. You only get the credential if you cross the finish line. If the credential has zero value, then finishing is just paying more to validate a loss. However, if the credential has even slight intrinsic value or if the psychological cost of quitting outweighs the cost of finishing, then the past investment matters because it has brought you to the brink of a completed asset. You might need to give up the verdict that the PhD is ambiguous; if the payoff is truly nonexistent, finishing is just a more expensive version of the novel mistake, unless you value the title itself enough to justify the remaining effort.

  Applying this to the cases you haven't listed, the person staying in a town because they moved there for a job that ended years ago is committing the fallacy if the only reason is the move itself. The move is sunk. However, if they are staying because of the friends and community built since the move, that is rational, because those are current assets, not sunk costs. The distinction lies in whether the benefit exists today independent of the past expenditure. For the scientist funding research after a decade of null results, the verdict depends on whether the null results are data. If the decade of work has ruled out certain paths and built specific expertise that makes a breakthrough more likely now than before, then the past is an investment, not a sunk cost. But if the scientist is continuing simply because ten years feels like too much to waste without a discovery, that is the fallacy pure and simple. The past effort only counts if it has increased the probability of future success or created a unique capacity to succeed.

  So the rule you are looking for is that sunk costs are irrelevant unless the past investment has created a present condition where completion yields a disproportionate reward or where abandonment violates a valued identity or commitment. This means you don't have to give up many of your verdicts, but you do need to tighten the PhD case. If the degree is worthless and the work is hated, the five years are just like the pages of the novel; finishing them doesn't build a skill or honor a relationship, it just closes a loop. The hardware store survives this test because it honors a relationship. The piano survives because it honors the self. The restaurant and war fail because they honor nothing but the past itself. Ultimately, the wake up tomorrow test is still the right tool, provided you acknowledge that for some people, waking up with no memory would erase the very reasons they value the choice, like family loyalty or personal identity, whereas for the restaurant owner, waking up with no memory would just reveal a bad business deal.
