answer: |-
  1. The threshold practice presupposes a decision rule where probabilities below a specific cutoff are treated as effectively zero, implying that rational agents may ignore de minimis risks regardless of the magnitude of the potential harm. This commits the institution to a view where continuity in probability space is broken for the sake of administrative feasibility or cognitive limits.

  2. The precautionary practice presupposes that small probabilities of catastrophic harm deserve disproportionate weight compared to linear expected utility, often aligning with maximin reasoning or a lexicographic ordering that prioritizes avoiding irreversible damage. Alternatively, it may function as an epistemic rule shifting the burden of proof rather than a substantive claim about the weight of probabilities.

  3. The threshold rule rules out strict expected utility maximization if the cutoff is non-zero, while the precautionary rule rules out utilitarian trade-offs if it forbids certain harms entirely, yet both are underdetermined because they could be pragmatic heuristics rather than deep normative claims. Consequently, a risk-weighted expected utility model could explain the precautionary stance, whereas a bounded rationality model could explain the threshold stance without invoking distinct normative theories.

  4. The commitments of the three practices are mutually inconsistent if applied to the same case under a single normative theory, as one cannot simultaneously treat a probability as zero, overweight it, and value it linearly. However, they might be reconciled if viewed as context-specific tools within a pluralistic framework where different decision rules apply to different classes of harm or uncertainty.

  5. If replaced by a consistent expected utility view, thresholds would vanish and precautionary bans would require positive net benefits, fundamentally altering regulatory outcomes. I am highly confident in the inconsistency diagnosis but least sure whether the precautionary practice is fundamentally epistemic regarding evidence or substantive regarding risk weights.
