      *   *Nuance:* The "lone dissenter" isn't just ignoring higher-order evidence; they are claiming their first-order evidence *defeats* the higher-order evidence. The implicit theory must allow first-order evidence to have greater weight in discovery contexts.
      *   *Terminology:* Use "higher-order evidence" (HOE) correctly. HOE is evidence about the quality of your first-order reasoning. Consensus is a form of HOE (evidence that I might be mistaken).
      *   *Structure:*
          1.  Intro & Rival Positions.
          2.  Reconstruction of Implicit Theory (Division of Labour).
          3.  Consistency Check.
          4.  Epistemic Akrasia analysis.
          5.  Underdetermination & Counterfactuals.

  8.  **Final Review against constraints:**
      *   British English? Yes.
      *   Sketch rival positions first? Yes.
      *   Address HOE, disagreement, akrasia? Yes.
      *   Address the physicist's specific tension? Yes.
      *   Distinguish strict requirements vs. loose fits? Yes.

