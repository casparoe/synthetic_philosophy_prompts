prompt: |-
  You are an expert in epistemology, especially on higher-order evidence, peer disagreement, and epistemic akrasia; think carefully and deliberately rather than answering off the cuff, and begin by sketching in a few lines the rival positions you might attribute to the practice before committing to one. I am a retired experimental physicist who has lately taken up philosophy, and I keep running into a tension in the norms of my old profession. We were raised on the idea that a single well-controlled experiment can overturn a settled consensus, and that the lone dissenter who is later vindicated is the hero of the method. Yet the same scientific culture, when it addresses the public or a regulator, treats the consensus of the field as an authority that it would be irrational for anyone, layperson or expert, to reject; and in medicine a clinician is now expected to follow a guideline panel's verdict even when her own reading of the primary studies points the other way. What philosophical commitments does this pair of practices presuppose about how a person should weigh the evidence of her own reasoning against evidence about the reliability of that reasoning and about what the wider community has concluded? Reconstruct the implicit theory of higher-order evidence, say whether the two halves of the practice are consistent, and tell me whether the practice leaves room for epistemic akrasia, that is, for believing something while also believing that one's own evidence, or the higher-order evidence, tells against believing it. Distinguish what the practice strictly requires from what it merely happens to fit well, note where it is underdetermined among rival theories, and say what would have to give if we replaced the presupposed view with the opposing one. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Expert in epistemology (specifically higher-order evidence, peer disagreement, epistemic akrasia).
      *   **Task:** Address a tension in scientific practice described by a retired experimental physicist.
      *   **The Tension:**
          1.  *Internal Scientific Norm:* A single well-controlled experiment/lone dissenter can overturn consensus (heroic individualism).
          2.  *External/Regulatory Norm:* Consensus is authoritative; laypeople/experts (e.g., clinicians) should not reject it (deference to authority/guidelines).
      *   **Key Questions:**
          *   What philosophical commitments (implicit theory of higher-order evidence) does this presuppose?
          *   Are the two halves consistent?
          *   Does it leave room for epistemic akrasia?
          *   Distinguish strict requirements from loose fits.
          *   Note underdetermination among rival theories.
          *   What would have to give if the view were replaced?
      *   **Constraint:** Think carefully/deliberately, sketch rival positions first, use British English.
      *   **Audience:** Retired experimental physicist turned philosopher (needs precision, respect for scientific nuance, but philosophical rigour).

  2.  **Initial Brainstorming & Sketching Rival Positions:**
      *   *The Tension:* It looks like a conflict between *First-Order Evidence* (the data from the experiment) and *Higher-Order Evidence* (the fact that everyone else disagrees with you).
      *   *Position A: Steadfastness (First-Orderism).* You should primarily follow your own assessment of the first-order evidence. If the experiment is sound, ignore the consensus. This fits the "lone hero" narrative but struggles with the "follow guidelines" norm.
      *   *Position B: Conciliationism (Higher-Orderism).* The disagreement itself is evidence that you might be wrong. You must downgrade your confidence. This fits the "follow guidelines" norm but makes the "lone hero" narrative look irrational.
      *   *Position C: Dual-Role/Contextualism.* The norms differ based on the *role* (discoverer vs. applier) or the *stakes* (truth-seeking vs. action-guiding).
      *   *Position D: Epistemic Akrasia.* Is it rational to believe $P$ while believing one shouldn't believe $P$? The prompt asks if the practice allows this.

  3.  **Deconstructing the Scientific Practice:**
      *   *Context 1: Research Frontier.* Here, the goal is truth discovery. Error is expected. The "lone dissenter" is valued because consensus can be stuck in a paradigm (Kuhn). The higher-order evidence (consensus) is treated as *defeasible* against strong first-order evidence (replicable experiment).
      *   *Context 2: Clinical/Regulatory Application.* Here, the goal is safe action/policy. Error is costly. The "guideline panel" aggregates evidence to reduce individual bias. The higher-order evidence (consensus) *trumps* individual first-order interpretation.
      *   *Consistency Check:* Are these contradictory? Not necessarily, if the *epistemic goals* differ (truth vs. reliable action) or if the *weighting* of higher-order evidence changes based on expertise/role.

  4.  **Developing the Implicit Theory:**
      *   The practice seems to presuppose a **Weighted Conciliationism** that is sensitive to **Epistemic Role**.
      *   *For the Researcher:* Higher-order evidence (consensus) is a check, but not a veto. First-order evidence (data) can override it if the methodology is robust.
      *   *For the Clinician/Regulator:* Higher-order evidence (guideline) acts as a preemptive reason (Razian exclusionary reason) or a strong defeater. Individual interpretation is deemed less reliable than the aggregate.
      *   *Akrasia:* Does the clinician believe the treatment works while thinking they shouldn't believe it? No, they suspend judgement on the *truth* and follow the *rule*. Or, they adopt the belief *because* of the rule. True akrasia is generally avoided in professional norms (you shouldn't feel conflicted; you should defer). However, the *researcher* might experience akrasia: "I see the data ($P$), but I know everyone says $\neg P$." If they persist, are they akratic? The norm says "No, trust the data." So the practice discourages akrasia for the researcher but mandates a form of deference for the clinician.

  5.  **Refining the Argument (Drafting the Content):**

      *   *Introduction:* Acknowledge the physicist's insight. It's a classic tension between discovery and justification/application.
      *   *Rival Positions:*
          1.  *Total Evidence View:* Weigh first and higher-order together. (Too vague for the specific tension).
          2.  *Conciliationism:* Disagreement requires belief revision. (Fits guidelines, hurts the lone hero).
          3.  *Steadfastness:* Stick to your guns if your reasoning is sound. (Fits lone hero, hurts guidelines).
          4.  *Role-Relative Norms (The likely candidate):* Norms shift based on function.
      *   *Reconstructing the Implicit Theory:* It's not a single monolithic epistemology. It's a **division of epistemic labour**.
          *   *Research:* High tolerance for risk, priority on first-order evidence. Consensus is heuristic, not binding.
          *   *Application:* Low tolerance for risk, priority on aggregated higher-order evidence. Consensus is binding.
      *   *Consistency:* Consistent if viewed as a system of division of labour. Inconsistent if viewed as a universal norm for all agents at all times.
      *   *Akrasia:* The practice generally *forbids* akrasia. The clinician is not asked to believe $P$ while thinking $\neg P$ is supported; they are asked to believe the *guideline* is the correct action, regardless of their private doubt. The researcher is encouraged to resolve the tension by proving the consensus wrong, not by holding conflicting beliefs.
      *   *Underdetermination:* We don't know if the consensus is respected because it's *more likely true* (epistemic reason) or because it coordinates *action* (pragmatic reason).
      *   *What would give?* If we went full Steadfastness, guidelines collapse. If we went full Conciliationism, scientific revolutions become irrational.

  6.  **Polishing the Tone and Language:**
      *   British English (e.g., "programme," "centre," "rigour," "modelling").
      *   Respectful, academic but accessible to a physicist.
      *   Ensure the "sketch rival positions" instruction is followed at the start.
      *   Ensure "think carefully" is reflected in the structure (deliberate pacing).

  7.  **Self-Correction/Refinement during drafting:**
