answer: |-
  You are right to feel unsatisfied by your friend's answer. She is reciting a specific philosophical stance called **instrumentalism**, which is dominant in economics but highly contested in the broader philosophy of science. Her claim that "assumptions don't matter" is a slogan, not a law of nature.

  You hit the nail on the head with the epidemic example. Homogeneous mixing isn't just a simplification; it is a **structural denial** of how the disease spreads.

  Here is the gut-level breakdown of the conceptual issue, the nuance on Friedman, and how to tell the difference between a harmless simplification and a load-bearing lie.

  ---

  ### 1. Is Friedman's View Crude? (The "As If" Doctrine)

  Your friend is referencing Milton Friedman's 1953 essay, *"The Methodology of Positive Economics."* It is arguably the most influential and annoying paper in economic methodology.

  **The Crude Reading (What your friend said):**
  "The truth of assumptions is irrelevant. If the model predicts well, the assumptions are good. If it predicts poorly, they are bad. Asking if assumptions are 'realistic' is naive."

  **The Defensible Reading (What Friedman *meant*):**
  Friedman argued that all theories are **abstractions**. To explain anything, you must ignore almost everything. Therefore, all assumptions are technically "false" (no plane is truly frictionless; no human is perfectly rational). He argued we should judge theories by their **fruitfulness**, not the literal truth of their axioms.

  **Where Friedman Goes Wrong:**
  Friedman conflates two very different types of "unrealistic" assumptions:
  1.  **Subtractive Assumptions:** Removing "noise" to see the signal (e.g., ignoring air resistance to understand gravity).
  2.  **Constitutive Assumptions:** Asserting a mechanism exists that *does not* exist, which drives the result (e.g., assuming agents have perfect information, which removes the possibility of market crashes caused by uncertainty).

  Friedman's defense works for the first type. It fails catastrophically for the second. If your model predicts a bridge won't fall because you assumed gravity doesn't exist, and the bridge doesn't fall (by luck), Friedman would say your model is valid. You know that's absurd.

  **The Verdict:** Friedman was right that we *need* idealizations to do science. He was wrong that we shouldn't care *which* idealizations we use.

  ---

  ### 2. Harmless Idealization vs. Load-Bearing Assumption

  The difference isn't about whether the assumption is "true." It's about **causal role**.

  #### A. Harmless Idealizations (Negligibility Assumptions)
  These are assumptions that remove factors that exist but are **second-order effects** relative to the phenomenon you are studying. They simplify the math without changing the *mechanism*.

  *   **The Test:** If you relax the assumption (make it more realistic), the prediction changes slightly, but the *direction* and *order of magnitude* remain the same. The model is **robust**.
  *   **Example 1: Point Masses in Orbital Mechanics.**
      *   *Assumption:* Planets are single points with mass, not giant spheres.
      *   *Reality:* Planets have size and shape.
      *   *Why it's harmless:* For calculating orbits, the distribution of mass inside the planet matters very little compared to the total mass and distance. If you model Earth as a sphere instead of a point, the orbit calculation changes by a negligible fraction. The *mechanism* (gravity) is preserved.
  *   **Example 2: Frictionless Planes in Intro Physics.**
      *   *Assumption:* No friction.
      *   *Reality:* Friction exists.
      *   *Why it's harmless:* We use this to isolate $F=ma$. We know friction exists and can add it back in later as a correction term. The fundamental relationship between force and acceleration is not *created* by the lack of friction; it is just *obscured* by it.

  #### B. Load-Bearing Assumptions (Constitutive Assumptions)
  These are assumptions that **create the result**. If you remove them, the phenomenon you are trying to explain disappears or inverts. They are not simplifying noise; they are defining the engine.

  *   **The Test:** If you relax the assumption, the model's core prediction collapses or flips. The model is **fragile**.
  *   **Example 1: Homogeneous Mixing in Epidemiology (Your Example).**
      *   *Assumption:* Every person has an equal probability of contacting every other person.
      *   *Reality:* Humans exist in networks (clusters, superspreaders).
      *   *Why it's load-bearing:* The "average behavior" your friend mentioned is a mathematical artifact of the assumption, not a feature of the disease. In a network, the variance *is* the mechanism. If you relax this assumption to include network topology, the $R_0$ (reproduction number) changes fundamentally. You cannot "add networks back in later" as a correction; the differential equations themselves are wrong.
  *   **Example 2: Rational Expectations in Macroecomics.**
      *   *Assumption:* Economic agents make no systematic errors and use all available information perfectly.
      *   *Reality:* Humans have biases, limited info, and herd behavior.
      *   *Why it's load-bearing:* Many economic models rely on this to prove markets clear (supply = demand). If you relax this to allow for systematic panic or bubbles, the model predicts crashes. The assumption of rationality isn't smoothing out noise; it is *assuming away the crash* to make the math work.

  ---

  ### 3. Is There a Principled Way to Tell?

  Your friend says it's just "what the model is for." That's a cop-out. There is a methodological standard used in good science (physics, biology, and the best economics) to distinguish the two. It is called **Sensitivity Analysis** or **Robustness Checking**.

  Here is the principled distinction:

  **1. Derivability (The Limit Test)**
  *   *Harmless:* Can the realistic version be derived from the idealized version as a limiting case?
      *   *Yes:* Newtonian physics is a low-speed limit of Relativity. You can get from one to the other smoothly.
  *   *Load-Bearing:* Is the realistic version fundamentally incompatible?
      *   *Yes:* You cannot derive "market panic" from a "perfect rationality" model by tweaking a variable. You have to change the axioms.

  **2. Causal Isolation vs. Causal Denial**
  *   *Harmless:* The assumption isolates a causal force that is present in reality (Gravity exists; we just ignore air to see it better).
  *   *Load-Bearing:* The assumption denies a causal force that is essential to the phenomenon (Networks exist; assuming they don't removes the cause of the epidemic's shape).

  **3. The "Correction" Test**
  *   *Harmless:* Can you add a "correction term" to fix the error? (e.g., add a drag coefficient for air resistance).
  *   *Load-Bearing:* Does adding the realistic factor require rewriting the governing equations? (e.g., moving from differential equations to agent-based network modeling).

  ### 4. Summary for Your Next Argument

  Your friend is operating under the belief that models are **prediction machines**. If the output is right, the black box doesn't matter.
  You are operating under the belief that models are **explanatory maps**. If the map gets you to the destination but shows the river on the wrong side, it is a bad map, because next time (under slightly different conditions) it will lead you off a cliff.

  **The concrete takeaway:**
  Tell her this: *"Friedman is right that we need abstractions. But there is a difference between assuming a vacuum to test gravity, and assuming gravity doesn't exist to test falling. Homogeneous mixing isn't a vacuum; it's assuming gravity doesn't exist. If the assumption does the heavy lifting for the result, it's not an idealization, it's a tautology."*

  You don't need assumptions to be "realistic" in a photographic sense. But you do need them to be **structurally isomorphic** to the causal mechanisms of the real world. If the assumption changes the *causal structure*, it is load-bearing, and predictive success in one context is just luck that won't hold in another.
