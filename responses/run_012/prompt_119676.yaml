answer: |-
  This is the right hill to die on. The coherence argument (Dutch Book for beliefs, Money Pump for preferences) is the strongest steel trap in decision theory. If you violate the axioms, you seem to invite disaster.

  However, the trap has escape hatches, and some of them are wide enough to drive a truck through without sacrificing ideal rationality. The claim that EU maximization is *constitutive* of rationality rests on specific assumptions about what preferences *are*, how choices unfold in time, and what counts as an "outcome."

  Here are the defeaters, ranked from "sinks the thesis" to "annoying technicality," focusing strictly on ideal agents.

  ### 1. The Triviality Charge (The "Fine-Graining" Retreat)
  **Rank:** Genuinely Sinks the Substantive Thesis
  **Status:** Conceded by many defenders (e.g., Hausman, Sobel)

  This is the most damaging objection. The coherence arguments only work if the "outcomes" in the utility function are individuated correctly. If you prefer $A$ to $B$ in one context but $B$ to $A$ in another (violating Independence or Transitivity), the EU defender says: "Ah, but those aren't the same outcomes. You care about the *process* or the *history*."

  To save the axioms, you must make the description of outcomes sufficiently fine-grained to include everything the agent cares about (e.g., "Having A after having rejected B" vs. "Having A").

  **The Defeater:** If you allow outcomes to be individuated by the agent's entire psychological history and the path taken to get there, *any* pattern of choice can be modeled as EU maximization.
  *   **Why it sinks the thesis:** It renders the claim "Rational agents maximize EU" tautological. It no longer predicts behavior or constrains rationality; it just says "Agents do what they do." If the theory is saved only by making it unfalsifiable, it ceases to be a normative constraint on rationality and becomes a description of behavior.
  *   **Defender Concession:** Most sophisticated decision theorists admit this. They retreat to: "Rational agents act *as if* they maximize EU over a *sufficiently rich* state space." But this is a massive softening. It means EU isn't a deep truth about reason; it's a mathematical mapping we can impose on anything that chooses.

  ### 2. Genuine Incompleteness (The "Set of Orderings" Move)
  **Rank:** Sinks the "Completeness" Axiom (and thus standard EU)
  **Status:** A live, rigorous rival (Levi, Sen, Bales)

  You asked specifically about this. The Money Pump requires a cycle: $A \succ B$, $B \succ C$, $C \succ A$. To get the pump started, the agent must be willing to trade $A$ for $B$ (paying a fee), then $B$ for $C$ (paying a fee), then $C$ for $A$ (paying a fee).

  **The Defeater:** If preferences are genuinely incomplete, the agent may find $A$ and $B$ incomparable ($A \not\succ B$ and $B \not\succ A$).
  *   **The Mechanism:** When offered a trade from $A$ to $B$, the agent does not prefer $B$, so they don't trade. The pump stalls immediately.
  *   **The "Revealed Preference" Counter:** Critics say, "If you choose $A$ over $B$, you revealed $A \succ B$."
  *   **The Reply:** This assumes choice is binary and global. A rational agent can use **contrastive choice**: "I am permitted to choose $A$ from $\{A, B\}$ without $A$ being strictly preferred to $B$ globally." If the agent's preference structure is a *set* of orderings (representing unresolved values), there is no single function to maximize.
  *   **Why it works:** It blocks the pump without requiring the agent to be ignorant. The gap is ontological, not epistemic. If rationality permits value pluralism that cannot be collapsed into a single metric, EU is not required.

  ### 3. Resolute Choice and Dynamic Consistency
  **Rank:** Sinks the "Sequential" Application of EU
  **Status:** Strong, but requires redefining rationality (McClennen, Bratman)

  Money pumps are dynamic; they happen over time. Standard EU relies on **Separability**: your choice at node 2 should depend only on the sub-tree at node 2, not on how you got there.

  **The Defeater:** A rational agent can adopt a **policy** or plan that binds their future selves.
  *   **The Mechanism:** Even if my local preferences at time $t_2$ would dictate trading back (completing the cycle), I can rationally adopt a policy at $t_1$: "I will not trade back." If I am **resolute**, I stick to the plan not because my local preferences changed, but because rationality applies to *plans*, not just momentary acts.
  *   **Why it works:** It avoids the pump without requiring complete preferences. It violates Separability, which is a core component of dynamic EU maximization.
  *   **The Cost:** It requires a theory of agency where "plans" are primitive, not just derived from momentary utilities. But for an ideal agent with perfect memory and will, this is coherent.
  *   **One-Shot vs. Repeated:** You asked if the pump needs trading. Yes, money pumps require sequential choice. A one-shot Dutch Book (betting) applies to *beliefs* (probabilities), but the Money Pump applies to *preferences*. A one-shot choice cannot be pumped. However, life is sequential. The Resolute Choice argument says rationality is about managing the sequence, not maximizing at every node.

  ### 4. The Normative Gap (Why Consistency?)
  **Rank:** Annoying but Survivable
  **Status:** Philosophical quibble

  The coherence argument assumes: "If you are exploitable, you are irrational."
  **The Defeater:** Exploitation is only bad if you value the resource being pumped (usually money or utility units).
  *   **The Mechanism:** An agent might value "not being pushed around" or "maintaining integrity" more than the money lost. If I pay the pump fee to spite the pump-er, or because I refuse to engage in cyclic trading on principle, I am not irrational; I have a lexicographic preference that overrides the monetary loss.
  *   **Why it's weaker:** The EU defender can just say "Include 'spite' in the utility function." (See Defeater #1: Triviality). But it highlights that the *force* of the Dutch Book comes from outside the theory (an independent disvalue of loss), not from rationality itself.

  ### Addressing Your Specific Questions

  **1. Is the "Set of Orderings" model a cheat?**
  No. It is a genuine rival. Standard EU assumes a **Complete** ordering. If the world contains values that are incommensurable (e.g., Justice vs. Mercy), a single real-valued utility function is a distortion. Modeling the agent as having a *set* of admissible orderings (where $A$ is chosen if it is maximal in *some* ordering in the set) preserves rationality without completeness. The pump stalls because there is no single "best" option to trade toward.

  **2. Does a resolute agent only need a policy?**
  Yes. This is the heart of the **Dynamic Choice** critique. If rationality is defined over *strategies* (complete plans of action) rather than *acts* (local choices), an agent can reject a locally preferred trade because it violates their optimal strategy. This violates the **Independence** axiom in dynamic contexts. It survives the "pump" reply because the agent isn't maximizing at every node; they are executing a plan.

  **3. Does the pump need the agent to keep trading?**
  Yes. A Money Pump requires a sequence of opportunities. A one-shot, irrevocable choice cannot be money-pumped. However, Dutch Books (for beliefs/probabilities) can be constructed simultaneously (one-shot). So, coherence arguments for *probabilities* (Bayesianism) are stronger than for *preferences* (EU). You can be a non-EU maximizer in a one-shot world; you cannot be a non-Bayesian in a betting world without sure loss.

  **4. Does the argument presuppose CDT vs. EDT?**
  It presupposes a structure, not the input. However, if you accept **Causal Decision Theory (CDT)** as the standard for EU, you lose in Newcomb problems. If you accept **Evidential Decision Theory (EDT)**, you lose in medical Newcomb problems.
  *   **The Implication:** "Maximize Expected Utility" is an empty slogan without specifying *which* expectation (causal or evidential). Since both lead to counterintuitive results in specific cases, the claim that "EU is constitutive of rationality" is unstable until you solve the CDT/EDT/FDT debate. If the "rational" EU changes depending on the problem, EU isn't the foundation; something deeper is.

  ### The Verdict: Has the Thesis Softened?

  **Yes. Significantly.**

  The hard claim—"Rationality *is* EU maximization"—has largely retreated to the soft claim—"Rational agents can be *modeled as if* they maximize EU over a sufficiently rich description of outcomes."

  *   **Is this a real result?** Mathematically, yes. It's useful for economics.
  *   **Is it a retreat?** Philosophically, absolutely. It means EU is not a constraint on *what* you can value or *how* you can reason. It is merely a representation theorem.

  **What would count against it?**
  To truly kill the thesis, you need to show that **Completeness** is not a requirement of ideal rationality. If an ideal agent can look at two options and say, "Neither is better, nor are they equal, and I am not ignorant," then the representation theorem fails. The agent is not maximizing a function, because no function exists.

  If you accept that **incommensurability** is possible for an ideal mind, the coherence argument fails. The money pump relies on the agent *preferring* the trade. If the agent is rationally permitted to be indifferent *or* undecided, they simply decline the trade. The pump-er walks away, not with your money, but with a stalemate.

  **Summary Ranking:**
  1.  **Triviality/Fine-Graining:** Saves the math, kills the meaning. (Most damaging to the *substance* of the claim).
  2.  **Incompleteness:** Denies the axioms directly. (Most damaging to the *logic* of the claim).
  3.  **Resolute Choice:** Denies the dynamic application. (Damaging to the *process* of the claim).
  4.  **Normative Gap:** Questions the link between loss and irrationality. (Philosophical nuisance).

  If you want to hold the line, you must defend **Completeness** against the possibility of incommensurable values. If you concede that an ideal agent might face genuine trade-offs between incomparable goods, EU maximization is not required; it is merely one way to resolve the tension, perhaps by fiat.
