prompt: |-
  My phil of science proffesor gave this summary of underdetermination last week and I wrote it down, but I'm not sure how much to trust it. He said something like: 'Underdetermination is the thesis that the evidence can never decide between competing theories. Duhem and Quine showed that no hypothesis is ever tested alone -- you always test a whole web of beliefs -- so for any theory you can always construct an empirically equivalent rival by adjusting auxiliary assumptions. Since the rivals fit all possible evidence equally well, theory choice is ultimately a matter of pragmatic taste, and scientific realism is just a metaphysical add-on. Kuhn was right that scientific revolutions are switches between paradigms, not rational inferences.'

  He also threw in a term I hadn't heard: 'contrastive underdetermination,' which he said is the real problem -- evidence can only choose between theories you've already thought of, so it can never rule out a rival you haven't imagined. Is that a real distinction or did he make it up?

  How much of this is right? Go sentence by sentence and tell me what a philosopher of science would accept, what they'd wince at, and what is just wrong -- and whether his conclusion about theory choice and realism follows from anything true in the summary. I'm not asking for a reading list or citations; I can't look stuff up right now, I woudl just like to know what to think. And please take a side: don't just lay out the options, tell me whether underdetermination actually gives you a reason to drop scientific realism or not, and where you come down.
