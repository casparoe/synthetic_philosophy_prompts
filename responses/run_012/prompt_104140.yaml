answer: |-
  **MEMORANDUM**

  **TO:** Clinical Guidelines Committee
  **FROM:** Chair, Clinical Guidelines Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Preventive Treatment Threshold Protocol

  **Purpose**

  This memo serves as the Chair's formal opinion and recommendation regarding the proposed revision to the preventive treatment threshold protocol. We have convened three times to discuss this matter. Despite the high quality of evidence review and argumentation from all members, we remain divided. Specifically, we have encountered a persistent stalemate between two compelling interpretations of the same data: one advocating for a lower threshold to initiate treatment (Proposal A) and one advocating for maintaining the current, higher threshold (Proposal B).

  This document outlines the reasoning for the recommended path forward, addresses the epistemological challenges raised during our deliberations, and establishes a timeline for implementation and review.

  **The Nature of the Disagreement**

  We are faced with a scenario where two of our most knowledgeable committee members disagree fundamentally on how to weigh the available evidence. Proposal A relies on a subgroup analysis suggesting benefit in a broader population, arguing that the risk of withholding treatment outweighs the risk of side effects. Proposal B argues that this subgroup analysis is statistically underpowered and that the mechanistic rationale for broader treatment is insufficient to justify the increased exposure to medication risks.

  This is not merely a disagreement about data; it is a disagreement about how to interpret uncertainty. One side prioritizes the potential for prevented events (sensitivity), while the other prioritizes the avoidance of iatrogenic harm from overtreatment (specificity). Both positions are medically defensible. Neither side has identified a factual error in the other's reasoning.

  **Addressing the Committee's Methodological Concerns**

  During our discussions, two major questions arose regarding how we should resolve this stalemate. I believe it is necessary to address them directly to clarify the foundation of this recommendation.

  First, there was the question of whether we should suspend judgment when experts disagree. Some argued that if our best experts cannot agree, we cannot claim to know the right answer, and therefore should default to caution. Others argued that we must evaluate the arguments themselves, regardless of who makes them, and pick the winner even if experts disagree.

  There is a logical tension here: if we decide to default to caution whenever experts disagree, we must acknowledge that experts also disagree on *whether* to default to caution. Does this undermine the approach? In a purely philosophical context, perhaps. In a clinical context, no. Our mandate is not merely to track truth; it is to manage risk. When evidence is equivocal, the asymmetry of harm becomes the deciding factor. Initiating preventive treatment introduces new risks (side effects, cost, patient burden) that are immediate and certain. The benefit is probabilistic. Withholding treatment preserves the option to treat later if symptoms progress, whereas treating exposes the patient to harm now. Therefore, in the face of genuine equipoise among experts, the precautionary principle is not an admission of ignorance, but a risk-management strategy.

  Second, there was the question of whether norms for individual belief apply to a committee. An individual can hold "uncertainty" as a state of mind. A committee producing a guideline must produce a number for the electronic medical record. We cannot output "maybe." We must convert uncertainty into policy. This transformation requires a tie-breaking rule. Given our role as stewards of patient safety across a heterogeneous population, the tie-breaker must favor the option that preserves future flexibility. Maintaining the higher threshold keeps the option to lower it open as new data emerges; lowering the threshold now commits us to a path that is harder to reverse if harms materialize.

  **The Question of Further Evidence**

  A third proposal suggested that the correct response to unresolvable disagreement is to seek more evidence rather than vote. There is merit to this. However, "seek more evidence" is only a valid strategy if it is bounded. Indefinite delay is a decision to maintain the status quo without admitting it.

  We cannot wait for a new multicenter randomized trial; that is outside our control and timeline. However, we can generate local evidence. We have the capacity to audit outcomes for patients who fall into the contested risk zone. Therefore, deferring a change is not ducking the decision if—and only if—we commit to a strict timeline for re-evaluation based on local data collection. This transforms "waiting" from passivity into active surveillance.

  **Recommendation**

  Based on the reasoning above, I recommend that the committee **maintain the current higher threshold (Proposal B)** for a period of **12 months**.

  This decision is not a rejection of Proposal A's clinical intuition. It is a recognition that in the absence of definitive evidence, the burden of proof lies with the intervention. We should not expand exposure to preventive medication until the benefit signal is clearer.

  However, this maintenance of the status quo is conditional. During this 12-month period, the Quality Improvement team will track outcomes for patients who meet Proposal A's criteria but not Proposal B's. We will monitor for adverse events in those treated off-protocol and disease progression in those untreated. This data will form the sole basis of the review at the 12-month mark.

  **Statement to the Proponents of the Lower Threshold**

  To those advocating for the lower threshold: Your position rests on the strongest possible ethical foundation—the prevention of harm through early intervention. The subgroup data you highlight, while not definitive, suggests a real population that may be suffering preventable events under the current protocol. There is a genuine risk that by maintaining the higher threshold, we are missing opportunities to improve lives. This recommendation does not deny that possibility; it merely asserts that until that possibility is substantiated with greater statistical certainty, we cannot expose the broader patient population to the known risks of overtreatment. Your advocacy has ensured that this population will be specifically monitored over the next year.

  **Conclusion**

  We are operating in a zone of uncertainty. In science, we tolerate ambiguity. In clinical policy, we must resolve it. We resolve it here by prioritizing reversibility and risk mitigation, while committing to a specific timeline to revisit the question with fresh data.

  Verdict: Maintain current threshold for 12 months with mandated data review.
