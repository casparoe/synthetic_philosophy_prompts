answer: |-
  The headcount-times-probability move needs replacing as a foundational step. It treats moral status as a continuous fluid scalable by population, but status may be binary. You cannot multiply until you know what unit you are counting. The arithmetic is the last step, not the first.

  Here is the spec for a theory of moral status. It must deliver five things to be viable:

  1.  **The Phenomenal Threshold:** It must distinguish a beetle from a dog. Why: Morality protects experiences, not mechanics. A system can process damage signals (nociception) without feeling suffering. If a theory counts reflexes as moral claims, it collapses the distinction between having a mind and having a mind that can be hurt.
  2.  **Temporal Persistence:** It must cover the sleeping person and the person under anesthesia. Why: We do not forfeit rights when unconscious. A theory based solely on current experience fails here; it must account for the capacity for experience across time, not just its active presence.
  3.  **Substrate Neutrality:** It must handle non-biological minds. Why: If silicon feels, it matters. If the theory requires carbon, it's biology bias, not ethics. It must isolate the property that generates value, not the material that carries it.
  4.  **Epistemic vs. Ontological Weight:** It must separate "how sure we are there's a mind" from "how much that mind matters." Why: Your friend conflates the probability of existence with the magnitude of value. A 1% chance of a human is not ethically equivalent to 1% of a human's worth. Uncertainty is about our knowledge; moral weight is about their reality.
  5.  **Nervous System Realism:** It must acknowledge facts about small nervous systems (e.g., shrimp vs. fish). Why: Centralization correlates with integration. A theory ignoring neural architecture ignores the machinery of experience. It cannot wave away the difference between a ganglion and a cortex.

  **The Incompatibility**
  The "Threshold vs. Dial" distinction clashes with "Headcount Arithmetic." If moral status is a threshold (you either feel or you don't), then multiplying a tiny probability by a huge headcount is category error. If insects are below the threshold, their probability is irrelevant; the expected value is zero, not tiny. If status is a dial (degrees of feeling), the arithmetic works but demands we quantify the "exchange rate" of insect suffering vs. human suffering, which we cannot do. You cannot hold that status is strictly binary *and* that it scales linearly with population probability.

  **The Deciding Requirement**
  The requirement doing the most work is **The Phenomenal Threshold**. It rules out the arithmetic entirely if insects lack the capacity for subjective experience. If they don't feel, the quintillions don't matter. This single requirement forces you to solve the hard problem of consciousness before you're allowed to do the math. Until you define what generates the "one" in "one in a thousand," the multiplication is meaningless.
