answer: |-
  Here is a teaching plan designed for a 45-minute salon. It prioritizes conceptual clarity over technical precision, ensuring the audience tracks the shift from *coordination* to *obligation*.

  ### 1. Sequence of Ideas and Dependencies

  You must resist the temptation to start with "Norms." If you start with why people get angry about rule-breaking, the audience will assume the rules were always moral. You must build the "amoral" foundation first.

  **Phase 1: The Coordination Problem (Minutes 0–10)**
  *   **Concept:** Interdependence. My best move depends on your move.
  *   **Dependency:** None. This is the foundation.
  *   **Goal:** Establish that we are not trying to be "good" yet; we are trying to avoid crashing into each other.
  *   **Risk:** The audience will conflate *coordination* with *cooperation*. Cooperation is about overcoming selfishness (Prisoner's Dilemma); Coordination is about aligning choices (Driving).
  *   **Correction:** Explicitly state: "In a coordination problem, we *want* the same outcome. We just don't know which path to take to get there."

  **Phase 2: The Lewisian Convention (Minutes 10–20)**
  *   **Concept:** Arbitrary Regularity + Expectations. We pick one solution (A) over another (B), not because A is better, but because we expect *you* to pick A.
  *   **Dependency:** Requires Phase 1. You cannot understand why the solution is "arbitrary" without understanding that multiple solutions would have worked.
  *   **Goal:** Show that the behavior is stable but fragile. It relies on *prediction*, not *morality*.
  *   **Risk:** The audience will assume we sat down and agreed on this.
  *   **Correction:** Emphasize "Spontaneous Order." No meeting was held.

  **Phase 3: Normative Lag (Minutes 20–35)**
  *   **Concept:** The environment changes. The original problem vanishes. The behavior remains, but the *reason* for the behavior shifts from "I expect you to" to "You ought to."
  *   **Dependency:** Requires Phase 2. You cannot identify "Lag" without knowing what the original function was.
  *   **Goal:** Distinguish between *inconvenience* (breaking a convention) and *offense* (breaking a norm).
  *   **Risk:** The audience will think the behavior persists due to "habit" or "inertia."
  *   **Correction:** You must highlight *resentment*. Habit is passive; Norms are active policing. If I don't care when you deviate, it's just habit. If I feel you were *rude*, it's a norm.

  **Phase 4: Implications & Diagnosis (Minutes 35–45)**
  *   **Concept:** Policy relevance. How do we change norms that have lost their function?
  *   **Dependency:** Requires Phase 3.
  *   **Goal:** Leave them with a tool to identify "Zombie Norms."

  **Where the Audience Will Try to Jump Ahead:**
  *   **The Jump:** During Phase 1, they will ask, "But what if someone cheats?" or "What if someone drives on the wrong side on purpose?"
  *   **Why it Breaks the Argument:** This imports *morality* and *enforcement* too early. It collapses the distinction between a coordination problem (we both lose if we mismatch) and a compliance problem (I gain if I cheat).
  *   **The Block:** "Hold that thought. That is exactly what happens in Phase 3. For now, assume we are all trying to succeed together."

  ---

  ### 2. The Carrying Example

  **Do not use Driving on the Road.**
  *   **Why:** It is the classic Lewis example, but it fails your specific goal of explaining *Normative Lag*. Driving on the wrong side still causes crashes. The coordination problem (safety) has *not* vanished. Therefore, the "ought" (you should drive on the right) is still tied to the original function (not dying). It is hard to separate the moral weight from the safety risk.

  **Do not use The Escalator.**
  *   **Why:** It is often tied to efficiency metrics or safety regulations. It feels too much like a rule imposed by an authority, rather than a spontaneous convention.

  **Recommended Example: The Handshake.**
  *   **Why it works:**
      1.  **Coordination:** If I offer my right hand and you offer your left, we collide. We need to match.
      2.  **Arbitrariness:** We could have standardized on the left hand, or a bow, or a nod. Any would work, provided we *all* did the same one.
      3.  **Original Problem:** Historically, it signaled "I hold no weapon." It was a safety coordination mechanism.
      4.  **The Lag:** In a modern boardroom, no one is carrying swords. The safety problem has vanished.
      5.  **The Norm:** If you refuse to shake hands (without a clear alternative like a bow or cultural exemption), it is not just "inefficient"; it is an *insult*. You feel resentment. The behavior has acquired independent normative force.

  **Features the Example Must Have:**
  *   **Physicality:** It helps to demonstrate it live. Extend your hand to a volunteer.
  *   **Symmetry:** Both parties must do the same thing.
  *   **Obsolescence:** You must be able to convincingly argue the original utility is gone.

  **What to Avoid:**
  *   Do not get bogged down in the historical accuracy of the "weapon" theory. Treat it as the *functional story* the convention tells, regardless of historical veracity.
  *   Do not allow exceptions (e.g., "What about hygiene/pandemics?") to derail the main point. Acknowledge them as *new* coordination problems, but return to the baseline.

  ---

  ### 3. Misconceptions Map

  | Misconception | Where it Arises | How to Head It Off |
  | :--- | :--- | :--- |
  | **"Convention = Habit"** | Phase 2. Audience thinks conventions are just things we do out of routine. | **Intervention:** "If I drink coffee every morning, that's a habit. If I drink coffee only because I expect *you* to be drinking coffee with me, that's a convention." Emphasize the *conditional preference*: "I prefer to do X *if and only if* you do X." |
  | **"Convention = Explicit Agreement"** | Phase 2. Audience assumes someone wrote the rule down. | **Intervention:** "Did you hold a meeting to decide which side of the sidewalk to walk on?" Use the term **Tacit Agreement**. It exists in our expectations, not in a contract. |
  | **"Common Knowledge = Everyone Knows"** | Phase 2. This is the technical trap. | **Intervention:** Do not use the term "Common Knowledge" unless you define it immediately. Use **"Publicly Obvious."** Explain: "It's not just that I know the rule. It's that I know *you* know the rule, and I know *you know I know*." Use the analogy of a public announcement in a room vs. passing a note. |
  | **"Norms = Rules + Punishment"** | Phase 3. Policy people especially will think norms require enforcement mechanisms. | **Intervention:** "Punishment is external (a fine). Normative force is internal (resentment)." If you break a law, you fear jail. If you break a norm, people think you are *bad*. The policing is social and emotional, not just institutional. |
  | **"Lag = Biological Evolution"** | Phase 3. Audience thinks "lag" implies genetic slowness. | **Intervention:** "This is cultural, not biological. It happens within a lifetime. It is about the stiffness of social expectations, not the stiffness of our DNA." |

  ---

  ### 4. The Diagnostic Question

  Place this at Minute 38, just before the conclusion. Do not ask for a definition. Ask for a judgment on a scenario.

  **The Question:**
  > "Imagine we invent a technology that allows self-driving cars to negotiate intersections perfectly, regardless of which side of the road they drive on. Collisions are impossible. Traffic flows smoothly even if cars mix sides.
  >
  > In this world, if a car still drives on the 'traditional' right side, it is merely a preference. But if a car drives on the *left*, and you feel a flash of **anger**—not because it's dangerous, but because it feels *wrong* or *rebellious*—what have we witnessed?"

  **What to Listen For:**
  *   **Correct Grasp:** They identify that the *coordination problem* (safety/flow) is gone, but the *normative force* (anger/wrongness) remains. They should identify this as **Normative Lag**.
  *   **Memorized Vocabulary:** If they say "It's a Lewisian Equilibrium," push back. "Lewis explains why they drive on the right. He doesn't explain why you get *angry* when the problem is solved."
  *   **Failure:** If they say "It's still dangerous," they missed the premise of the thought experiment. If they say "It's just habit," they missed the "anger/resentment" cue.

  ---

  ### 5. Deliberate Omissions and Signaling

  To keep this to 45 minutes and accessible, you must cut the following. If you do not signal these cuts, the philosophy buffs in the room will feel you are being sloppy.

  **1. The Formal Game Theory Matrices**
  *   **Omit:** Payoff tables, Nash Equilibrium notation.
  *   **Signal:** "Economists and game theorists model this with matrices to prove the stability. We are going to skip the math to focus on the social psychology. The intuition is what matters for policy."

  **2. The Infinite Hierarchy of Common Knowledge**
  *   **Omit:** The recursive logic ($I$ know that you know that I know...).
  *   **Signal:** "Philosophers argue about how many layers of 'knowing that you know' are required. For our purposes, we just need to agree that it feels like **public fact**. It's in the air."

  **3. The Reductionism Debate**
  *   **Omit:** Whether norms can *fully* be reduced to conventions (the Margaret Gilbert critique, etc.).
  *   **Signal:** "Some philosophers argue that norms are fundamentally different from conventions. I am taking the pragmatic view today: even if they start differently, they *look* the same when they lag. We are tracking the phenomenon, not the metaphysics."

  **4. Terminology Check:**
  *   **"Equilibrium":** Replace with **"Stable State."** "Equilibrium" sounds like physics; "Stable State" sounds like a social situation that isn't changing.
  *   **"Common Knowledge":** Replace with **"Publicly Obvious."** (As noted in misconceptions).
  *   **"Normative Lag":** Keep this term. It is your researcher's contribution and the core hook of the talk. Define it clearly on the spot: *"The persistence of a rule after the reason for the rule has expired."*

  ### Rehearsal Note on Resistance
  The policy people in the room will resist the idea that norms are "arbitrary." They want norms to be rational solutions to social problems.
  *   **Your Counter:** "They *were* rational solutions. That's the tragedy. They solved a problem that no longer exists. Recognizing the arbitrariness is the first step to changing them."
  *   **Your Tone:** Do not be dismissive of norms. Acknowledge that they provide social glue. The problem is not that they exist, but that they become *zombies*—walking around without a brain (function) to guide them.
