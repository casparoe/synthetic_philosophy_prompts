  To sort out the confusion from the first meeting, you should begin by asking each participant whether they understand Kant's 1797 reply to Constant as addressing legal liability or moral permission, keeping in mind that scholars disagree on whether Kant was talking about courtrooms or consciences and this is not a settled matter. If someone says it is about legal liability, they land on the Strict Juridical Liability position, which holds that Kant is only warning you that you might be held responsible for consequences, though its awkward commitment is that it leaves the moral status of the lie itself uncomfortably vague. If they say it is about moral permission, ask next whether the duty not to lie is owed primarily to the murderer, to humanity at large, or to the speaker's own dignity. If they say the duty is owed to the murderer, ask whether the murderer retains a right to the truth despite their intent. If they say the murderer loses this right, you have the Forfeiture View, where the criminal loses the claim to truth, with the awkward commitment that rights can be lost simply by asking a question with bad intent. If they say the murderer keeps the right, you have the Strict Deontology position, where the duty holds regardless, with the awkward commitment that you must respect the killer's right over the victim's life.

  If instead they say the duty is owed to humanity at large, ask whether a single lie actually damages the institution of assertion. If they say yes, this is the Institutional Damage view, awkward because it assumes one private lie undermines public trust, but if they say the damage is irrelevant yet the duty remains, they likely focus on the speaker, leading to Self-Degradation, awkward because it treats the speaker's purity as more important than the victim's survival. You should note here that Strict Deontology and Self-Degradation are two leaves your tree cannot really separate in practice, since both forbid the lie for reasons that ultimately ignore the consequences for the victim. If they say the duty is not about the content but the form of communication, ask whether saying something false counts as a lie if no truthful declaration was owed. If no declaration is owed, you get the Silence or Misleading view, where you may evade without lying, awkward because it relies on linguistic loopholes rather than moral substance.

  Ask next whether the prohibition applies equally across Kant's system. If no, you get the Right versus Virtue Split, where law forbids but ethics permits, awkward because it suggests Kant's system is internally divided on core duties, though you should note this is a contested reading of Kant rather than settled doctrine. If they say the context matters, ask whether the murderer's status matters. If yes, you get the Private versus State Agent view, awkward because it makes moral duty depend on the political identity of the threat. You should tell them that combinations where one claims the duty is owed to the murderer yet the murderer forfeits it yet the lie is still wrong come out empty because the view is incoherent, while combinations where the duty is juridical but the remedy is ethical virtue are empty because they are unexplored in the literature.
