prompt: |-
  I'm writing a paper on Aristotle and money for philosophy class and I think theres a hole in his arguement. He says (in the Politics I think, maybe the Ethics) that two people only exchange things if the things are somehow commensurable, and then a bit later he says money is the thing that makes them commensurable, which seems like explaining why a scale balances by pointing at the scale. Can you give me an example of an actual trade where you can really see that nothing about the two things makes them comparable until somebody just declares a rate? Something from now please, not the shoes-for-a-house one my textbook keeps using. A friend told me the countries where all the prices are written in dollars but people actually pay in the local money are exactly that kind of case, but I dont get why that counts, or whether it shows he's really going in a circle, or if there's something else he says that gets him out of it.
