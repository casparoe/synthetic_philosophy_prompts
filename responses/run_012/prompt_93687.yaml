  My friend and I spent most of last night arguing about where her mind stops, and I want a second opinion before I see her again. Her rulings, which she swears are all really the same ruling: her phone's calendar and notes — part of her memory. The paper notebook she's carried since college — part of her memory. The hearing aid she's worn since she was four — part of her, obviously. Her reading glasses — just a tool, not part of her. The therapist she's seen weekly for six years, whose interpretations she'll quote back at you as her own — not part of her mind, he's a person. The group chat where she actually does her thinking — not part of her mind. A wikipedia page she reads once and forgets — no. Her phone's predictive text — no, she says she fights it. Her dog, whose reactions she reads all day long — he's a dog.

  Last week she got one of those always-on AI earbuds. It's in her ear from waking up to lights out, it pipes up without being asked, she now can't remember a single appointment without it, and she never checks what it says. But she keeps calling it 'it', and when I asked whether it was part of her mind she said no, it's a thing that talks to her.

  The two rules I can get to fit everything else she's said: (a) trust and glue — it's part of your mind if it's there when you need it, you reach for it without deliberating, and you take what it gives you without checking; (b) transparency and ownership — it only counts if you look through it rather than at it, and only if it's yours to revise. She is not going to enjoy being told which one she's actually running. Which is it, what does each rule say about the earbuds, which way would you bet and why, and what case should I put to her next to finally tell the two apart? Also tell me whats the least I'd have to change about the earbud setup to flip her answer.
