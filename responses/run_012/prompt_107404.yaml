answer: |-
  The split you're describing is the gap between *performance* (what gets done) and *competence* (who is allowed to do it). When institutions mandate AI-free credentialing for AI-dependent roles, they are making a specific bet on the architecture of human understanding. Here is the breakdown of what that bet entails, where it's shaky, and whether it holds together.

  ### Strict Presuppositions vs. Good Fits

  To separate what the practice *requires* from what it merely *accommodates*, we have to look at the logic of the test itself.

  **Strict Presuppositions:**
  The practice strictly presupposes that **agency and accountability must reside in the biological human, not the system.** By testing solo, the institution asserts that the human must be a functional fallback. It presupposes that there is a distinct state called "knowing" that exists independently of "accessing." If understanding were purely relational (human + tool), removing the tool during testing would be like testing a swimmer's ability to float by removing the water. The fact that they do remove the tool presupposes that the water (the AI) is not part of the swimmer's buoyancy.

  **Merely Fits Well With:**
  The practice fits well with **internalist epistemology**, which holds that justification for a belief must be internally accessible to the subject. If you can't reconstruct the reasoning without the black box, you don't truly "know" it. However, the practice doesn't *strictly* require internalism. It could also fit with a purely pragmatic safety view: "We don't care if you understand it internally, but we need to know the server might crash." That is externalist reasoning (focused on reliability) that leads to internalist testing. So, internalism is a comfortable fit, but not a logical necessity.

  ### Generative Ability vs. Grasping

  Does the practice presuppose that understanding is generative (producing the answer from scratch)?

  **Yes, operationally.** The test format demands generation. You cannot pass a closed-book exam by merely recognizing a correct answer or explaining why an AI's answer is right. You must produce the output.

  **No, philosophically.** The institution might argue that generation is just the *verification method* for a deeper grasp. They might claim that if you can generate the answer, you *prove* you grasp the underlying principles. However, this conflates the *evidence* of understanding with the *definition* of understanding. The practice treats generative ability as a necessary condition for understanding. If you can only evaluate, the current credentialing system says you are unqualified, even if the job only requires evaluation.

  ### The Extended Mind Challenge

  Does this rule out extended-mind or distributed-cognition views?

  **It operationalizes a rejection of them, but doesn't logically rule them out.**
  A proponent of the extended-mind thesis (that tools are part of the cognitive system) would argue that testing without the AI is measuring a crippled system. It's an invalid metric of the actual cognitive unit (Human + AI).

  However, a clever extended-mind theorist could endorse the practice without inconsistency by arguing for **modularity**. They could claim that for the "Human + AI" system to function, the "Human" module must have specific internal states (calibration data) to interface correctly with the "AI" module. If the human module is empty, the system fails. Therefore, testing the human module in isolation is a quality control check on the component, not a denial that the system is distributed.

  So, the practice doesn't kill the extended-mind view, but it does force it into a corner where the human must retain significant standalone capacity, which dilutes the core idea that the tool is constitutive of the thinking.

  ### Philosophical Underdetermination

  This is where the practice is most interesting. The same closed-book exam is licensed by three completely different theories of understanding, making the practice philosophically underdetermined:

  1.  **The Essentialist View:** Understanding is an internal virtue. You aren't a radiologist unless *you* see the tumor, regardless of the software.
  2.  **The Redundancy View:** Understanding is irrelevant; reliability is key. AI fails. Power goes out. The human is a backup drive. We test the backup to ensure it boots.
  3.  **The Signaling View:** Understanding is a proxy for discipline and intelligence. The exam doesn't test job skills; it tests the ability to endure rigorous cognitive load. It's a hazing ritual to ensure only high-conscientiousness people get the license.

  Because all three theories lead to the same policy (closed-book exams), the practice itself doesn't tell us which theory the institution actually believes. They could be pragmatists (Redundancy) while sounding like essentialists (Essentialist).

  ### The Rival View: Understanding as Evaluation

  Suppose we swap in the rival view: **Understanding is the ability to evaluate and explain a result, regardless of source.**

  If this view were adopted, the current credentialing practice would **fall apart**, or at least lose its primary justification.
  *   **The Mismatch:** A generative test measures production cost. An evaluative role measures verification cost. If the job is to audit the AI, testing the human on their ability to *be* the AI is inefficient. It's like testing a fact-checker by making them write the news articles from memory.
  *   **The Necessary Change:** Credentialing would shift to "Open-Book, Open-AI" exams where the task is to find the errors in AI-generated work. The skill being measured changes from *recall and derivation* to *critique and synthesis*.
  *   **Survival:** The only way the old practice survives under this new view is if you argue that you cannot evaluate a derivation unless you can perform it. That is a strong claim (you must be a chef to taste the food), but it is debatable. If that claim is rejected, the closed-book exam becomes obsolete.

  ### Coherence and the "Fire Drill"

  Is the split coherent? Or does it concede that the tested understanding doesn't matter for the job?

  It is coherent only under a **"Fire Drill" theory of competence.**
  If the split implies that the solo skill is never used, then the testing is incoherent *unless* it is preparing for a low-probability, high-stakes failure mode.
  *   **Coherent:** "We use AI 99% of the time. But for the 1% where the AI hallucinates confidently or the server dies, the human must be able to take the wheel. The exam certifies they can take the wheel."
  *   **Incoherent:** "We use AI 100% of the time, and the AI is never turned off, and we never double-check its work manually." In this scenario, the exam is a lie. It certifies a skill that has zero utility in the actual workflow.

  **The Verdict:**
  The split concedes that the *daily* exercise of understanding doesn't matter, but it insists that the *capacity* for understanding matters. It treats understanding not as a tool you use every day, but as a safety valve you hope you never need.

  However, there is a quiet contradiction here. If the job is structured such that the human *never* reads the scan solo (as you posited), then the human will lose the very skill the exam certified. Competence atrophies. So, the institution is certifying a capacity that their own workflow actively erodes. This suggests the credentialing is less about maintaining a skill and more about **liability management**. It proves that in a lawsuit, the human *could* have known, even if the system didn't let them show it.

  In short: The practice presupposes that the human is the ultimate source of truth, even if they are treated as a mere interface in practice. It is coherent only as a liability shield or a failure-mode safeguard. If the tool never fails and the human never checks, the split is not just incoherent; it is a ritualistic fiction designed to satisfy regulatory bodies rather than reflect cognitive reality.
