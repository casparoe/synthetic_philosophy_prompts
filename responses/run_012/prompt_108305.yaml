prompt: |-
  I'm giving a paper at a departmental seminar next month. It's nominally an economics department, but the paper is on Keynes's conception of the good life, so the room will be mixed: mostly economists who know the General Theory and the Treatise inside out and think of Keynes as a policy theorist with a colourful biography, plus two intellectual historians who have actually read the Memoir Club material, and one philosopher who works on early analytic ethics and has read Moore properly. My thesis is that Keynes held a substantive and fairly stable conception of the good life rather than a set of undergraduate enthusiasms he later outgrew. Roughly: economic activity is instrumental; the point of it is to make possible intrinsically valuable states of mind, friendship, love, aesthetic enjoyment, contemplation; and treating the accumulation of wealth as an end in itself is a corruption rather than a neutral preference. I argue this runs from the memoir he read to the Memoir Club in the late thirties (published posthumously) through to the 1930 essay on economic possibilities for our grandchildren, where the fifteen-hour week and the problem of how to use the resulting leisure are the payoff, and that his later practical work isn't inconsistent with it.

  Draft me a Q&A prep sheet. What I want is the objections I'll actually get from this specific room, not the ones a philosophy blog would raise — ordered by how much damage they'd do to my thesis, each phrased the way that particular objector would phrase it (the historians' objections should sound like historians', the philosopher's like a philosopher's), with a two-minute reply for each and a note on where the reply is soft. Tell me what to concede up front because it costs me nothing, what to hold, and which objection I should refuse to fight on the day. Include the question I'm hoping nobody asks.

  A few things to be careful about. I know the memoir is a late, retrospective, partly ironised document and that this is the obvious line of attack; don't pretend it isn't. I know the fifteen-hour week didn't happen. What I need is a sheet that helps me survive the specific charge that I'm reading a wistful self-portrait as a philosophy, and the specific charge that an ethic of friendship and beautiful objects is just the taste of a privileged Cambridge set dressed up as a theory of value. Also, I probablly lean too hard on the continuity story, so give me the strongest version of the discontinuity objection rather than a strawman.

  And separate out for me what is actually settled among people who know this material from what is genuinely contested. If it's contested whether the early ethic survives into the later work, say so, rather than telling me the scholarship agrees with me. Same for whether the memoir is best read as self-criticism or as nostalgia. I'd rather find out now that I'm defending a contested reading than be told afterwards that I presented a live dispute as a done deal.

  British English throughout, please.
