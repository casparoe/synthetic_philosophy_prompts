          *   *Severity:* High. C1 makes safety a normative constraint on *arrangements*. C2 makes EU a normative constraint on *agents*. If the arrangement requires safety, does it constrain the agent?
      *   **C1 vs. C5:** C1 says a change must leave *every* party at least as well off under *every* way of playing. C5 says a shift toward the weaker party is justified *even if* a party ends up worse off (due to delegate response).
          *   *Tension:* C1 demands Pareto-superiority across all states. C5 explicitly allows someone ending up worse off.
          *   *Severity:* Critical. This looks like a direct contradiction. C1 defines "improvement/justification" via safety (no one worse off). C5 defines "justification" via redistribution (someone might be worse off).
      *   **C2 vs. C3:** C2 asserts EU maximization is *the* fundamental standard. C3 says the criterion must be neutral about rational choice theories (not presuppose EU).
          *   *Tension:* C2 takes a strong substantive stance. C3 demands procedural neutrality.
          *   *Severity:* High. You can't hold EU as *the* fundamental standard while claiming your criterion doesn't presuppose it.
      *   **C1 vs. C6:** C1 relies on comparing outcomes across "every way of playing... compatible with structural assumptions." C6 says there is "no fact of the matter about how the interaction would have gone."
          *   *Tension:* C1 requires evaluating counterfactual plays to determine safety. C6 denies facts about counterfactual plays.
          *   *Severity:* Moderate/High. C1 needs counterfactual truth values to work. C6 denies them.
      *   **C1/C5 vs. C7:** C1/C5 focus on parties. C7 says bystanders count equally.
          *   *Tension:* C1 defines improvement based on *parties*. C7 says party benefit isn't enough.
          *   *Severity:* Moderate. C1 defines "improvement to the arrangement," C7 defines "moral rightness." They might operate at different levels, but C1's focus on parties seems myopic given C7.

  4.  **Deep Dive into the "Single Revision" Candidate:**

