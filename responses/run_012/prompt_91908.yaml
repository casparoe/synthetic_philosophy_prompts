      *   **Goal:** Identify conflicts (genuine vs. apparent), assess severity, determine which item must give way and the cost of doing so, and identify the single most impactful revision.
      *   **Constraints:** No literature survey. Focus on internal consistency and costs. "Audit, not a lecture." Prefer identifying one major source of damage over flagging everything.
      *   **Input:** 7 specific commitments regarding norms governing cooperative arrangements (safety, expected utility, neutrality, preferences, redistribution/weak parties, uncertainty/openness, bystanders).

  2.  **Deconstruct the 7 Commitments:**

      *   **C1 (Safety/Robustness):** A rule change is an improvement only if it leaves *every* party at least as well off under *every* compatible way of playing the new arrangement (structural assumptions only, no behavioral predictions). "Safe" changes are mandatory/justified; unsafe changes are not justified by expected outcomes.
      *   **C2 (Expected Utility - EU):** EU maximization is fundamental. No agent is *required* to forgo an EU-maximizing option for robustness. Robustness is just uncertainty management, not a normative override.
      *   **C3 (Neutrality):** The criterion must not presuppose specific rational choice theories (EU, equilibrium, credences). Usable by disagreeing parties.
      *   **C4 (Preference Sovereignty):** Preferences are inputs. No view on their origin or justification.
      *   **C5 (Redistribution/Weak Parties):** Shifts toward the weaker party are justified even if delegates respond poorly (making the party worse off). Being worse off warrants an argument, not a veto. (Note: This seems to contradict the "every party at least as well off" requirement in C1, or at least reinterprets "well off" or "justified").
      *   **C6 (Openness/Uncertainty):** Safe changes imply certainty of improvement, but actual outcomes are open/indeterminate. No fact of the matter about counterfactual play.
      *   **C7 (Bystanders/Externalities):** Interests of non-parties count equally. An arrangement can be wrong even if all parties benefit.

  3.  **Identify Potential Conflicts:**

      *   **C1 vs. C2:** C1 demands *safety* (robustness across all compatible plays) as a condition for justification/improvement. C2 says no agent is *required* to forgo EU maximization for robustness.
