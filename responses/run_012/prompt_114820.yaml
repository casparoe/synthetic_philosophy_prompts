answer: |-
  **Project Title:** The Reference Class Dependence of Epistemic Modesty

  **Research Question**
  Can the norm of epistemic modesty be formulated as a actionable rule without collapsing into the instruction 'adopt the outside view'? If the outside view relies on an inside-view judgement to select the reference class, does 'be modest' fail to guide action in hard cases?

  **Background and Gap**
  Decision theory standardly posits the 'outside view' (reference class forecasting) as a corrective to the 'inside view' (case-specific evidence). However, selecting the appropriate reference class is itself an inside-view judgement. This creates a circularity: the corrective depends on the very faculty it is meant to correct. Existing literature treats reference class selection as a technical hurdle, not a philosophical wedge. Consequently, the normative force of 'epistemic modesty' remains underspecified. If modesty simply means 'use the outside view', it inherits the reference class problem. If it means 'discount your inside view', it risks discarding unique evidence. There is no current account that resolves this tension without begging the question.

  **Methodology**
  This is a conceptual analysis project. Empirical methods are unsuitable given the scope; the problem is structural, not data-driven. The work will proceed via argument reconstruction and counter-example testing.

  *   **Month 1:** Map existing definitions of the outside view and modesty. Isolate premises where reference class selection is assumed rather than derived.
  *   **Month 2:** Formalise the 'parasitism objection': that outside-view reasoning reduces to inside-view judgement at the selection stage.
  *   **Month 3:** Construct case studies (thought experiments) where inside and outside views diverge sharply based on class selection.
  *   **Month 4:** Draft the 'Modesty Dilemma': proving that standard norms either collapse into outside-view usage or fail to constrain judgement.
  *   **Month 5:** Test potential escapes (e.g., objective similarity metrics, Bayesian priors) against the Dilemma.
  *   **Month 6:** Write-up and dissemination preparation.

  **Why This Method?**
  Modelling or empirical work would require determining *correct* reference classes, which presupposes the solution this project seeks. Philosophical analysis is the only tool capable of interrogating the normative structure within the time budget.

  **Successful Outcome**
  A paper establishing the 'Modesty Dilemma' as a distinct problem in epistemology. Success looks like a proof that current formulations of modesty are either redundant (collapsing into outside view) or inert (failing to guide action). A positive result would offer a refined definition of modesty that acknowledges the inside-view dependence without surrendering normative force.

  **Failure Conditions**
  The project fails if the circularity proves trivial (i.e., already solved in literature I have missed) or if the argument relies on controversial premises that cannot be defended within the word limit. It also fails if I cannot articulate a clear distinction between 'modesty' and 'outside view usage' by Month 4.

  **Scope and Limitations**
  This is a foundational project, not a solution to the reference class problem. Solving reference class selection definitively is a multi-year endeavour. This grant funds a *diagnostic* phase: clarifying why the norm fails, not necessarily fixing it entirely. The output will be a rigorous argument setting the conditions for future empirical or formal work, rather than a unified theory of forecasting. It fits the six-month constraint because it limits itself to mapping the logical space, not populating it with comprehensive data.
