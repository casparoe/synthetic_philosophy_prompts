  **JOINT STATEMENT ON THE LIMITS OF THE CRIMINAL LAW**
  **Regarding the Bill on Irreversible Aesthetic Body Modification**

  **PREAMBLE**

  We, the undersigned, represent two distinct perspectives on the proper relationship between law, morality, and individual liberty. We have engaged in adversarial collaboration to clarify our points of agreement and disagreement regarding the proposed statute criminalizing the licensed, non-medically-indicated performance and procurement of irreversible body modifications (including tongue bifurcation, extensive scarification, and subdermal implants) on consenting adults. We agree that the state's power to punish is grave and requires rigorous justification. We disagree on the source of that justification. This document records our shared findings and the precise contours of our remaining dispute.

  **PART I: POINTS OF AGREEMENT**

  1.  **Legitimate Grounds for Criminalization:** We agree that the state must articulate a legitimate ground before criminalizing conduct. The undersigned Hartian maintains that the *only* legitimate ground is the prevention of harm to others. The undersigned Devlinian maintains that the preservation of the society's shared moral fabric is a legitimate ground independent of tangible harm, provided that fabric is essential to the society's continued existence.
  2.  **Status of the Harm Principle:** We agree that the Harm Principle is a powerful heuristic for limiting state overreach. The Hartian holds it is a *necessary* condition for criminalization; without harm to others, there is no crime. The Devlinian holds it is *not necessary*; while harm to others is sufficient for criminalization, it is not required if the conduct fundamentally undermines the shared ideas that hold the community together.
  3.  **Definition of Harm and Social Erosion:** We agree to distinguish between tangible setbacks to individual welfare and the abstract corrosion of shared standards. The Hartian contends that the alleged "corrosion of shared standards" is not a harm to others in the relevant sense, as it does not set back specific interests of identifiable persons. The Devlinian contends that the disintegration of shared standards *is* a harm to all members, as it destroys the implicit contract of mutual understanding that makes social life possible. We agree that whether "social erosion" counts as "harm" is a substantive dispute, not merely a semantic one.
  4.  **Positive vs. Critical Morality:** We acknowledge the distinction between the morality a society happens to accept (positive morality) and the morality defensible on reasoned reflection (critical morality). We agree that the proposed bill relies primarily on *positive morality*: it cites the widespread feeling that these practices are degrading and the fear that tolerating them corrodes shared standards. The Hartian invokes *critical morality*, arguing that unless the practice can be shown to be rationally wrong (i.e., harmful), the popular feeling is irrelevant. The Devlinian invokes *positive morality*, arguing that the shared feeling itself constitutes the bond that the law must protect, regardless of whether the feeling withstands abstract philosophical scrutiny.
  5.  **Facts of the Case:** We concede the following regarding the specific practices targeted by the bill:
      *   The participants are consenting adults with full capacity.
      *   The procedures are performed in licensed facilities under hygienic conditions.
      *   There is no evidence of coercion, deception, or direct injury to identifiable third parties.
      *   The modifications are irreversible.
      *   A significant majority of the population currently finds these specific practices degrading and offensive to standards of bodily integrity.
  6.  **Scope of Dispute:** This dispute is *not* about public health regulations, age restrictions, consumer protection, or the prevention of coercion. We agree that the state may regulate the safety of the procedures and prohibit them for minors. Our disagreement is strictly about the criminalization of the choice itself for competent adults, based solely on the moral objection to the aesthetic outcome.
  7.  **Conditional Bridging Claim:** We agree on the following conditional implications:
      *   **For the Hartian:** If it were empirically demonstrated that tolerating these modifications causes a measurable, significant increase in non-consensual violence, coercion, or the inability of citizens to cooperate in essential social institutions, the Hartian would concede that criminalization is justified under the Harm Principle.
      *   **For the Devlinian:** If it were empirically demonstrated that tolerating these modifications over a generation produces no detectable weakening of social cohesion, no increase in antisocial behavior, and no loss of mutual trust among citizens, the Devlinian would concede that the shared morality is not sufficiently integral to warrant legal enforcement.

  **PART II: RESIDUAL DISAGREEMENTS**

  | Question at Issue | Hartian Position | Devlinian Position | Crux (Sub-question to settle) | Agreed Argument / Evidence | Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Nature of the Injury** | There is no victim. The conduct is self-regarding. The "injury" is purely emotional or ideological on the part of observers, which is insufficient for criminal law. | Society is the victim. The conduct attacks the symbolic representation of human dignity that binds the community. The injury is to the collective existence, not just individual feelings. | Is the "community" an entity capable of being harmed independently of the sum of its individual members' tangible interests? | Comparative sociological study of societies that permit vs. forbid extreme body modification, measuring rates of social trust, charity, and cooperative behavior. | **Hartian:** No correlation will be found between modification rates and social trust.<br>**Devlinian:** A threshold effect will be found where high visibility of modification correlates with lower social trust. |
  | **2. Mechanism of Social Erosion** | Tolerance of diversity strengthens social adaptability. There is no mechanism by which one person's scarification causes another's moral collapse. | **Mechanism:** Normalization and Desensitization leading to a Threshold Effect. As the practice becomes visible, the shared standard of bodily integrity shifts. Once the standard shifts below a critical threshold, the prohibition against *non-consensual* mutilation loses its moral force. <br>**Indicator:** A rise in public acceptance of non-consensual bodily interference or a decrease in empathy for physical vulnerability. | Does the visibility of consensual deviance causally weaken the prohibition against non-consensual harm? | Longitudinal tracking of public opinion on bodily autonomy and physical assault in jurisdictions where these modifications are legal vs. illegal. | **Hartian:** Public opinion on assault will remain stable regardless of modification laws.<br>**Devlinian:** Acceptance of modification will predict a statistical softening of attitudes toward physical integrity generally. |
  | **3. Sovereignty over the Self** | An individual's right to shape their own body is absolute, provided they do not harm others. The state has no title to the citizen's flesh. | An individual's body is a vessel of social meaning. While one has custody of the body, one does not have the right to use it in ways that negate the shared understanding of what a human being is. | Is the body private property or a public trust? | Philosophical analysis of legal precedents regarding self-harm, suicide, and sale of organs, looking for consistency in the principle of self-ownership. | **Hartian:** Precedents increasingly favor self-ownership.<br>**Devlinian:** Precedents consistently limit self-ownership where it offends public order. |
  | **4. Evidence Against Own Position** | I would abandon my position if data showed that prohibiting these modifications led to *higher* rates of psychological distress, suicide, or underground unsafe procedures that outweighed the alleged social benefits. | I would abandon my position if data showed that societies permitting these modifications maintained *higher* levels of social cohesion and mutual care than those forbidding them. | Does the law produce better outcomes than liberty (Hartian) or does liberty produce better outcomes than the law (Devlinian)? | Cost-benefit analysis including mental health metrics, black market activity, and social cohesion indices. | **Hartian:** Prohibition will cause net harm.<br>**Devlinian:** Tolerance will cause net disintegration. |

  **PART III: DISTINCTION BETWEEN VERBAL AND GENUINE DISAGREEMENT**

  In the course of our collaboration, we identified areas where our language diverges and areas where our values fundamentally conflict.

  **1. Verbal Disagreements (Resolvable by Definition)**
  We identified a potential verbal dispute regarding the word "Harm." The Devlinian prefers to classify "social disintegration" as a form of harm to others. The Hartian reserves "harm" for tangible setbacks to individual interests. We agree this is not *merely* verbal, because the classification dictates the scope of the law. However, we acknowledge that if we adopted the Devlinian's definition of harm, the Hartian would still object to the *evidence* required to prove it. Thus, while the terminology differs, the substantive requirement for empirical proof remains a point of contention, not just semantics.

  **2. Genuine Disagreements (Not Reducible to Test)**
  We identify one fundamental disagreement that cannot be reduced to any empirical test: **The Axiom of Sovereignty.**
  The Hartian holds that individual sovereignty is the primary value of the legal system. The Devlinian holds that social continuity is the primary value. No amount of data can prove which value *ought* to be primary. If the data shows that social cohesion is slightly weakened by liberty, the Hartian will still choose liberty. If the data shows that individual distress is slightly heightened by prohibition, the Devlinian will still choose cohesion. This is a conflict of ultimate ends, not means. We acknowledge that this disagreement cannot be adjudicated by evidence, but only by political choice.

  **Signed,**

  *The Undersigned Hartian*
  *The Undersigned Devlinian*

  *Date: October 26, 2023*
