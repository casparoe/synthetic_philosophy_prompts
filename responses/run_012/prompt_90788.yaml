answer: |-
  # EVIDENCE REVIEW UNIT: DETERMINATION PROCEDURE (v1.0)

  **Purpose:** To distinguish findings derived from evidence from decisions derived by policy, habit, or precaution.
  **Time Limit:** 90 Minutes per case (2 Staffers).
  **Inputs:** Case File only (no new literature search).
  **Constraint:** A hedge (ambiguity regarding the status of the evidence) costs the agency as much as an error. You must determine if the evidence *decides* the matter. If it does not, you must identify who must decide it instead.

  ---

  ## PART I: THE CHECKLIST

  **Instructions:** Answer sequentially. If you answer **NO** to any question in a block, follow the **ARROW (→)** to the corresponding Verdict and Sign-off. Do not proceed to the next block.

  ### BLOCK 1: THE CLAIM AND THE RIVALS
  *Goal: Ensure the question is empirical and that alternatives are specific, not residual.*

  **Q1.1:** Is the claim a statement about the physical world that could, in principle, be false? (e.g., "X causes Y," not "X is dangerous" or "X is unfair.")
  *   **NO** → **VERDICT: QUESTION MALFORMED.** (Go to Sign-off M).
  *   **YES** → Proceed to Q1.2.

  **Q1.2:** Does the Case File identify at least one specific rival hypothesis that fits the data as well as the primary claim? (e.g., "Demographics caused the cluster," not just "Uncertainty exists.")
  *   **NO (No rivals identified):** Stop. **WARNING:** An empty rival list is a defect in the Case File, not support for the claim. Return to File Preparer to name specific rivals or certify none exist. If they certify none exist, proceed to Q1.3.
  *   **YES (Rivals named)** → Proceed to Q1.3.

  **Q1.3:** Does the evidence *eliminate* the named rival(s)? (i.e., Is the data *incompatible* with the rival, not just *compatible* with the claim?)
  *   **NO (Data fits both Claim and Rival)** → **VERDICT: GAP STRUCTURAL** or **GAP CLOSEABLE**. (Go to BLOCK 3).
  *   **YES (Rivals eliminated)** → **VERDICT: SETTLED.** (Go to Sign-off S).

  ### BLOCK 2: THE GAP LOCATION
  *Goal: Locate whether the uncertainty is in the main theory or the supporting assumptions.*

  *(Enter this block only if Q1.3 was NO)*

  **Q2.1:** Is the uncertainty located in an **Auxiliary Assumption**? (e.g., The dose-response model, the exposure estimate, the instrument calibration, the species extrapolation.)
  *   **YES** → Proceed to Q2.2.
  *   **NO (Uncertainty is in the Central Hypothesis itself)** → Proceed to Q2.2.

  **Q2.2:** If the Auxiliary Assumption were corrected, would the Claim be settled?
  *   **NO** → **VERDICT: GAP STRUCTURAL.** (Go to Sign-off G-S).
  *   **YES** → Proceed to BLOCK 3.

  ### BLOCK 3: CLOSEABILITY
  *Goal: Determine if the gap is a temporary lack of data or a permanent limit of the method.*

  **Q3.1:** Can you describe a specific study or measurement that is **feasible** (fundable, ethical, evaluable by this staff) that would eliminate the rival(s)?
  *   **NO (No feasible study exists)** → **VERDICT: GAP STRUCTURAL.** (Go to Sign-off G-S).
  *   **YES (Specific study exists)** → **VERDICT: GAP CLOSEABLE.** (Go to Sign-off G-C).

  ---

  ## PART II: VERDICTS AND SIGN-OFF ROUTING

  | Verdict | Definition | Required Paperwork | Sign-Off Authority |
  | :--- | :--- | :--- | :--- | **STAFF** (2 Scientists) |
  | **SETTLED** | Evidence eliminates rivals. The claim is established or refuted. | Determination Memo. Must cite the specific data point that eliminated the rival. | **STAFF** (2 Scientists) |
  | **GAP CLOSEABLE** | Evidence is ambiguous, but a feasible study could resolve it. | Research Recommendation. Must specify the study design and the rival it kills. | **CHIEF SCIENTIST** |
  | **GAP STRUCTURAL** | Evidence is ambiguous and no feasible study will resolve it. Rivals survive. | Policy Referral. Must state: "Evidence does not decide. Choice rests on [Precaution/Cost/Habit]." | **PUBLIC BOARD** |
  | **QUESTION MALFORMED** | Claim is normative, definitional, or non-empirical. | Return Memo. Must state which term lacks empirical referent. | **CHIEF SCIENTIST** |

  ---

  ## PART III: CASE RUNS

  ### CASE A: Solvent / Rodent / Human
  **Question:** Does the evidence establish that it causes cancer in people at exposures measured near the facility?
  **File:** Rodent tumors at high dose. Human studies null (small N). Exposure near facility is low.

  1.  **Q1.1 (Empirical?):** Yes.
  2.  **Q1.2 (Rivals Named?):** Yes. Rival: "Rodent mechanism does not trigger in humans at low doses."
  3.  **Q1.3 (Rivals Eliminated?):** No. Null human studies are compatible with "Safe" and "Unsafe but undetected." Rodent data is compatible with "Human Risk" and "Species Specific."
  4.  **Q2.1 (Auxiliary?):** Yes. The gap is the *extrapolation* from high-dose rodent to low-dose human (Auxiliary Assumption).
  5.  **Q2.2 (Fix Assumption?):** No. We cannot ethically test high doses on humans.
  6.  **Q3.1 (Feasible Study?):** No. We cannot replicate human exposure conditions experimentally. Observational studies are already null/small.
  **VERDICT:** **GAP STRUCTURAL.**
  **Paperwork:** Policy Referral.
  **Statement:** "The evidence does not establish causation, nor does it rule it out. The choice to regulate as if causal is a precautionary policy decision, not an evidentiary finding."
  **Sign-Off:** Public Board.

  ### CASE B: Cluster / Facility / Demographics
  **Question:** Does the evidence establish the link [between facility and illness]?
  **File:** Agency previously stated "Likely Cause." Review finds exposure estimates too coarse to separate exposed/unexposed. Town age profile/migration explains pattern.

  1.  **Q1.1 (Empirical?):** Yes.
  2.  **Q1.2 (Rivals Named?):** Yes. Rival: "Demographic shift and age profile caused the cluster."
  3.  **Q1.3 (Rivals Eliminated?):** No. Coarse exposure data fits "Facility Cause." Demographic data fits "Population Cause." Both fit the illness pattern.
  4.  **Q2.1 (Auxiliary?):** Yes. The gap is the *exposure estimate* (Auxiliary).
  5.  **Q2.2 (Fix Assumption?):** No. The exposure happened in the past; coarse data cannot be retroactively refined.
  6.  **Q3.1 (Feasible Study?):** No. The event is historical.
  **VERDICT:** **GAP STRUCTURAL.**
  **Paperwork:** Policy Referral.
  **Statement:** "The evidence does not establish the link. The Agency's prior public assertion that the facility is the 'likely cause' exceeds the evidential support. Maintaining that assertion requires a policy choice (e.g., liability assumption or public reassurance), not a scientific determination."
  **Sign-Off:** Public Board.
  *(Note: This contradicts the Agency's prior public stance. The Board must now go on record accepting the uncertainty or reaffirming the claim as policy.)*

  ### CASE C: Safety Margin Adequacy
  **Question:** Is the safety margin we currently require adequate?

  1.  **Q1.1 (Empirical?):** No. "Adequate" is a normative term (value judgment), not a physical state.
  **VERDICT:** **QUESTION MALFORMED.**
  **Paperwork:** Return Memo.
  **Statement:** "Science can determine the margin size (e.g., 100x). It cannot determine if that margin is 'adequate.' Adequacy depends on risk tolerance and cost, which are legislative/policy inputs."
  **Sign-Off:** Chief Scientist.

  ---

  ## PART IV: EXPLANATIONS AND PHILOSOPHICAL REASONING

  **1. The Governing Idea: Underdetermination**
  Scientific evidence rarely forces a single conclusion. Usually, the data is compatible with the claim *and* at least one rival. This procedure forces you to find that rival. If you cannot find one, the Case File is defective, not the science.
  *   **Operational Translation:** We treat "Compatibility" as free. Just because the data *fits* the claim doesn't mean the claim is *true*. It only counts as confirmation if the data *breaks* the rival.
  *   **Distinction to Keep:** The difference between "Data fits Hypothesis" (Compatibility) and "Data breaks Rival" (Confirmation). Drop the idea that a single study proves anything.

  **2. The Location of the Gap (Central vs. Auxiliary)**
  Uncertainty usually hides in the assumptions (auxiliaries) surrounding the test, not the hypothesis itself. (e.g., The hypothesis is "Solvent causes cancer." The auxiliary is "Rodent metabolism matches human metabolism.")
  *   **Operational Translation:** If the uncertainty is in the auxiliary (Q2.1), we ask if fixing that assumption would solve the problem. If the uncertainty is in the central hypothesis, it is harder to close.
  *   **Distinction to Keep:** You must distinguish between "We don't know if the theory is true" and "We don't know if the measurement tool worked."

  **3. Closeable vs. Structural Gaps**
  Some gaps are due to lack of money or time (Closeable). Some are due to the nature of reality or ethics (Structural). We cannot run human challenge trials for carcinogens. We cannot measure past exposures perfectly.
  *   **Operational Translation:** Q3.1 forces you to propose a study. If you can't name a feasible study, the gap is Structural.
  *   **Distinction to Keep:** Do not treat "We haven't studied it yet" the same as "We cannot study it." The former is Closeable (Staff/Chief decision); the latter is Structural (Board decision).

  **4. The Empty Rival List**
  When a Case File presents one hypothesis and a vague "uncertainty," it invites you to confirm the hypothesis by default. This is error.
  *   **Operational Translation:** Q1.2 forces the File Preparer to name the rival. If they say "There are no rivals," they must certify it. If they can't name a rival, you cannot declare the case "Settled" until they do.
  *   **Distinction to Keep:** "No named rival" is a warning sign, not evidence of truth. It usually means the File Preparer has hidden the policy choice inside the science.

  **Why "Hedge Costs as Much as Error"**
  If you issue a "Settled" verdict when the gap is actually "Structural," you have lied about the evidence. If you issue a "Structural" verdict when it is "Settled," you have paralyzed the agency. Both damage credibility. This procedure prevents hedging by forcing a routing decision: either the evidence decides (Staff), or a person must decide (Board). There is no "Inconclusive" box to hide in.

  ---

  ## PART V: FAILURE MODES

  **1. The "Case File Gaming" Failure**
  *   **Risk:** The staff assembling the Case File (not you) omit the rival hypothesis to steer you toward a "Settled" verdict.
  *   **Symptom:** Q1.2 feels easy to answer "No" because the file ignores obvious alternatives.
  *   **Mitigation:** Q1.2 requires you to return the file if the rival list is empty. Do not accept "Uncertainty" as a rival. Demand a named mechanism (e.g., "Confounding by smoking," not "Other factors").

  **2. The "Confident Disguise" Failure**
  *   **Risk:** You issue a "Settled" verdict, but the elimination of the rival relied on an auxiliary assumption you treated as fact (e.g., assuming the exposure model is perfect).
  *   **Symptom:** Q2.1 is answered "No" too quickly.
  *   **Mitigation:** Treat all models in the Case File as Auxiliaries. If the model is wrong, is the verdict wrong? If yes, the gap is Auxiliary, not Central. Route to Chief or Board.

  **3. The "Malformed Dump" Failure**
  *   **Risk:** Using "Question Malformed" to avoid difficult scientific judgments.
  *   **Symptom:** Verdict C is used for questions that are empirical but messy (e.g., "Is this safe?" interpreted as Malformed rather than translating "safe" to "risk < threshold").
  *   **Mitigation:** Only use Malformed for explicitly normative terms (Adequate, Fair, Just). If the term can be operationalized (e.g., "Risk > 1 in 1 million"), it is empirical.

  **4. What This Procedure Cannot Do**
  *   It cannot generate new evidence.
  *   It cannot tell the Board *which* choice to make in a Structural Gap (only that they must make it).
  *   It cannot protect you from political fallout when the Board realizes the science doesn't support their preferred policy (see Case B). This is a feature, not a bug.
