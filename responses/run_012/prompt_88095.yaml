  *   **C6. Criterion-relative conventionalism**

  ---

  ### Detailed Evaluation

  **C5. Four-dimensional worm identity**
  *   **Score:** 9/10
  *   **Most Diagnostic Scenario:** S3 (Fission)
  *   **Explanation:** By treating the ship as a spacetime worm, C5 avoids binary survival verdicts in fission cases, describing overlapping worms instead of forcing a "death" stipulation. It satisfies both constraints by providing a complete ontological map without relying on arbitrary thresholds or external conventions.

  **C3. Pattern identity**
  *   **Score:** 7/10
  *   **Most Diagnostic Scenario:** S2 (Reassembly)
  *   **Explanation:** While C3 handles gradual replacement well, S2 produces two candidates with identical patterns, forcing a stipulation on which pattern counts as *the* ship. This ambiguity introduces a conventional element that weakens its satisfaction of constraint (ii).

  **C2. Causal continuity**
  *   **Score:** 6/10
  *   **Most Diagnostic Scenario:** S3 (Fission)
  *   **Explanation:** C2 provides a strong account of S1 but fails constraint (ii) in S3, where the requirement for a "non-branching" process is a metaphysical stipulation rather than a discovered fact. To return a verdict, one must arbitrarily decree that branching ends identity.

  **C1. Material continuity**
  *   **Score:** 5/10
  *   **Most Diagnostic Scenario:** S5 (Threshold probe)
  *   **Explanation:** C1 satisfies constraint (i) but blatantly violates constraint (ii), as the "majority" rule imposes a sharp 50% threshold that has no non-arbitrary justification in the nature of the object. S5 demonstrates that shifting one plank across this line creates a metaphysical cliff-edge.

  **C4. Institutional designation**
  *   **Score:** 3/10
  *   **Most Diagnostic Scenario:** S1 (Gradual replacement)
  *   **Explanation:** C4 returns clear verdicts but fails constraint (ii) by definition, as it grounds identity entirely in contingent human rules rather than mind-independent facts. It dissolves the metaphysical problem by outsourcing it to bureaucracy, which could reasonably have ruled otherwise.

  **C6. Criterion-relative conventionalism**
  *   **Score:** 2/10
  *   **Most Diagnostic Scenario:** S1 (Gradual replacement)
  *   **Explanation:** C6 explicitly fails constraint (i) by denying that absolute verdicts are possible, rendering it useless for a stress test seeking determinate answers. It also fails constraint (ii) by embracing convention as the final arbiter, making the dispute irresolvable rather than solved.

  ---

  ### Notational Variants
  **C4 (Institutional designation)** and **C6 (Criterion-relative conventionalism)** are notational variants of one another. C6 provides the meta-philosophical thesis that identity is only true relative to a framework, while C4 applies this specifically to artifacts by identifying that framework as institutional rule. Both ground the truth of persistence claims in human stipulation rather than ontological fact, differing only in scope (general vs. artifact-specific).

  ### Implications for Personal Identity
  Adopting the top-ranked criterion (**C5. Four-dimensional worm identity**) would commit the seminar to **perdurantism** regarding persons. It is metaphysically inconsistent to maintain that artifacts are four-dimensional spacetime worms while persons are three-dimensional entities that endure through time, unless one posits a radical dualism between persons and material objects. Therefore, the Ship of Theseus cannot be settled via C5 while leaving personal identity untouched; solving it for ships entails solving it for humans in the same ontological terms.
