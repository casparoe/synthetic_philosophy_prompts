answer: |-
  The debate you are stuck in arises because your students are conflating three independent axes of disagreement: the *scope* of consequences (causal vs. non-causal), the *unit* of evaluation (token act vs. policy), and the *status* of the agent (unbound vs. pre-committed). To map this space, we must first isolate the commitments that vary independently. First, there is the question of **Causal Reach**: does the rationality of an action depend solely on its causal downstream effects, or can it depend on correlations or logical facts it cannot change? Second, there is the **Nature of Dependence**: if non-causal facts matter, are they relevant because they are probabilistic evidence (news) or because they are logically entailed by the agent's decision procedure (functional output)? Third, there is the **Unit of Evaluation**: are we assessing the specific action taken at the moment of choice, or the general algorithm that produced it? Fourth, there is **Counterfactual Scope**: does the calculation include utility from branches of reality where the agent does not exist or deliberate? Finally, there is **Adversarial Sensitivity**: does the rational verdict shift if the correlation is generated by a neutral predictor versus an adversary seeking to exploit the agent's policy?

  By treating these as binary switches, we can generate a decision tree that classifies positions based on their answers rather than their labels. This instrument allows your students to locate their intuitions without needing to know the literature's terminology. Note that some paths lead to positions no one currently holds; these are marked as diagnostic leaves. The following tree begins with the most fundamental metaphysical split and proceeds to increasingly specific structural commitments.

  ### The Decision Tree

  **1. Does the rationality of an act depend on facts the act cannot physically cause?**
  *   **No:** Go to Leaf 1.
  *   **Yes:** Go to Question 2.

  **2. Is the relevant non-causal connection merely probabilistic correlation, or does it involve the act being the output of a function that predicts it?**
  *   **Probabilistic:** Go to Leaf 2.
  *   **Logical/Functional:** Go to Question 3.

  **3. Does the connection require the predictor to be reliable above a specific probability threshold (e.g., >90%)?**
  *   **Yes:** Go to Leaf 3.
  *   **No:** Go to Question 4.

  **4. Is the primary object of evaluation the specific token act or the general policy/procedure?**
  *   **Token Act:** Go to Leaf 4.
  *   **Policy/Procedure:** Go to Question 5.

  **5. Is the verdict valid only if the agent could have irreversibly pre-committed?**
  *   **Yes:** Go to Leaf 5.
  *   **No:** Go to Question 6.

  **6. Does the evaluation include utility from branches where the agent never deliberates (e.g., the coin landed the other way)?**
  *   **No:** Go to Leaf 6.
  *   **Yes:** Go to Question 7.

  **7. Does the rational verdict change if the correlation is created by an adversary seeking to exploit your policy?**
  *   **Yes:** Go to Leaf 7.
  *   **No:** Go to Leaf 8.

  ***

  ### The Leaves

  **Leaf 1: Causal Decision Theory (CDT)**
  *   **Commitment:** You must refuse the mugger and the blackmailer because your current choice cannot causally affect the predictor's past action or the termite status.
  *   **Case Verdicts:** Refuse Mugging, Refuse Blackmail, Refuse 80% Mugging.

  **Leaf 2: Evidential Decision Theory (EDT)**
  *   **Commitment:** You must treat your choice as news about the world, paying whenever doing so is correlated with a better outcome, even without causation.
  *   **Case Verdicts:** Pay Mugging, Pay Blackmail, Pay 80% Mugging (if correlation holds).

  **Leaf 3: Threshold-Dependent View**
  *   **Commitment:** The puzzles have no determinate verdict until a prior over the predictor's reliability is fixed, making the 80% case distinct from the perfect case.
  *   **Case Verdicts:** Pay Perfect Mugging, Refuse 80% Mugging, Verdict on Blackmail depends on threat reliability.

  **Leaf 4: [Diagnosis: Incoherent]**
  *   **Commitment:** This position claims logical dependence matters but evaluates only the token act, ignoring the function that generates it.
  *   **Diagnosis:** Unattractive; logical dependence implies a functional source, making token evaluation inconsistent.

  **Leaf 5: Commitment-Conditional View**
  *   **Commitment:** Only prior commitment matters; without a binding mechanism, you are rationally permitted to deviate from the optimal policy.
  *   **Case Verdicts:** Pay if pre-committed, Refuse if unbound, regardless of predictor type.

  **Leaf 6: Logical Actualism**
  *   **Commitment:** You acknowledge logical dependence but exclude counterfactual branches from the utility sum, evaluating only the actual world.
  *   **Case Verdicts:** Refuse Mugging (since you are in the "ask" branch), Refuse Blackmail; distinct from CDT by acknowledging logic but ignoring counterfactuals.

  **Leaf 7: Split View (Pragmatic Functionalism)**
  *   **Commitment:** An adversary who is deliberately trying to exploit your policy changes the verdict, distinguishing threats from predictions.
  *   **Case Verdicts:** Pay Mugging, Refuse Blackmail, Pay Adversarial Mugging only if exploitation is impossible.

  **Leaf 8: Updateless/Functional Policy (UDT/FDT)**
  *   **Commitment:** You must maximize expected utility across all logical counterfactuals as if choosing your source code before the setup is described.
  *   **Case Verdicts:** Pay Mugging, Pay Blackmail, Pay 80% Mugging, Pay Adversarial Mugging.

  ***

  **Confidence and Uncertainty**
  I am highly confident in this tree as a pedagogical instrument for mapping the logical space of the debate, specifically in how it isolates the "Adversarial Sensitivity" node to distinguish the Split View from the Updateless family. However, I am least sure about the placement of **Leaf 5 (Commitment-Conditional View)**; I have treated it as distinct from Leaf 8, but some proponents of Updateless Decision Theory argue that "acting as if pre-committed" is identical to "being pre-committed," which might collapse Leaf 5 into Leaf 8 depending on whether one views rationality as prescriptive or descriptive of an ideal agent.
