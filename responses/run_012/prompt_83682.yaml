answer: |-
  Here is a specification for a theory of group truth-tracking, designed to handle the specific complexities of your novel while remaining grounded in social epistemology and decision theory.

  ### The Specification: Requirements for a Truth-Tracking Theory

  To adequately predict when a group finds the truth, the theory must satisfy five core requirements. If any one of these is missing, the theory collapses into guesswork.

  **1. The Ontological Anchor**
  The theory must first determine if there is a "truth" to track.
  *   **Requirement:** It must distinguish between *verdicts of fact* (did the stranger poison the well?) and *judgments of value* (is the stranger a good man?).
  *   **Why:** If there is no objective fact (a judgment of value), "accuracy" is undefined. The theory must switch from tracking truth to tracking coherence or satisfaction. In your village, there is a fact (poison or no poison), so this requirement is met, but the theory must not treat moral outrage as evidence of guilt.

  **2. The Competence Baseline**
  The theory must measure the individual's ability to distinguish truth from falsehood *before* they hear anyone else's opinion.
  *   **Requirement:** It must distinguish between *structural competence* (access to evidence, sensory acuity, reasoning skill) and *outcome luck* (guessing right this once).
  *   **Why:** A group of lucky guessers does not become smarter when combined. The theory must assume that without structural competence, aggregation amplifies noise, not signal.

  **3. The Correlation Structure (Independence)**
  The theory must map how much one person's vote depends on another's.
  *   **Requirement:** It must distinguish between *independence of minds* (thinking for oneself) and *independence of votes* (casting a different ballot).
  *   **Why:** Two people can vote differently for the same wrong reason (strategic voting), or vote the same for different right reasons. Crucially, if votes are correlated (people copy each other), the mathematical advantage of the majority evaporates. Ten people who all copied the first person count as one vote, not ten.

  **4. The Aggregation Mechanism**
  The theory must account for *how* the decision is collected.
  *   **Requirement:** It must distinguish between *simultaneous revelation* (secret ballot, show of hands) and *sequential revelation* (speaking in order, public declaration).
  *   **Why:** Sequential revelation allows early voters to set a precedent that later voters feel pressured to follow. Simultaneous revelation protects independence but prevents information sharing.

  **5. The Incentive Compatibility**
  The theory must account for what the voters *want*.
  *   **Requirement:** It must distinguish between *sincere voting* (voting for what you think is true) and *strategic voting* (voting for what keeps you safe or aligns with the powerful).
  *   **Why:** If a voter believes the stranger is innocent but votes "guilty" to avoid being accused themselves, the group's vote no longer tracks the truth; it tracks the group's fear.

  ---

  ### Handling the Specific Cases

  Here is how this spec applies to the four scenarios you mentioned:

  **1. The Confidence-Feedback Village (Your Plot)**
  *   **Verdict:** The theory predicts failure.
  *   **Reasoning:** This violates Requirement 3 (Correlation). If confidence rises with agreement, you have a positive feedback loop. This creates an "information cascade." Once a slight majority appears, confidence spikes, forcing the minority to doubt their own eyes. The group converges on a single answer with high confidence, but the link to reality is broken. The group is tracking *consensus*, not *truth*.

  **2. Ordinary Juries**
  *   **Verdict:** Mixed success.
  *   **Reasoning:** Juries violate Requirement 3 (Independence) because they deliberate. However, they aim to boost Requirement 2 (Competence) through discussion. The theory must weigh whether the gain in individual understanding outweighs the loss of independent data points. Usually, this works only if the jury is instructed to resist social pressure until the final vote.

  **3. Heterogeneous Competence Panel**
  *   **Verdict:** Success, if weighted.
  *   **Reasoning:** If some members are experts and some are novices, a simple majority rule fails Requirement 2. The theory requires a weighted system where the expert's vote counts more, or a system where novices defer to experts *only* on specific evidentiary points, not the final verdict. If novices outvote experts based on numbers alone, accuracy drops.

  **4. No Fact of the Matter**
  *   **Verdict:** Theory Inapplicable.
  *   **Reasoning:** This violates Requirement 1 (Ontological Anchor). If the question is "Is the stranger unwelcome?" there is no truth to track. The theory must declare that "accuracy" is the wrong metric. The goal shifts to "legitimacy" or "conflict resolution." A theory of truth-tracking cannot judge this case.

  ---

  ### Distinctions the Theory Cannot Collapse

  To remain robust, the theory must keep these concepts separate. Merging them causes the model to break:

  *   **Independence of Votes vs. Independence of Minds:** You cannot assume that because people voted differently, they thought differently. They may have colluded. Conversely, they may think differently but vote the same due to fear.
  *   **Competence vs. Getting it Right:** A competent judge can be wrong; an incompetent judge can be right. The theory must judge the *process* that led to the vote, not just the vote's alignment with reality after the fact.
  *   **Sincere vs. Strategic Voting:** A vote for "Guilty" means something totally different if it is sincere belief versus a strategic move to protect one's family from the mob. The theory must treat these as different data inputs.

  ---

  ### The Trade-Offs and Incompatibilities

  This is the part you can steal for the scene. There are fundamental tensions in this spec that cannot be resolved simultaneously.

  **1. The Cohesion-Accuracy Trade-Off**
  *   **Conflict:** You cannot maximize group cohesion (everyone agrees and feels confident) and truth-tracking accuracy at the same time.
  *   **Explanation:** To track truth, you need friction, dissent, and independent verification. To feel cohesive, you need agreement and shared confidence.
  *   **For the Scene:** The more confident and unified your village feels, the less likely they are to be right. If they are truly tracking the truth, the vote should be agonizing, fractured, and leave many people uneasy. If they are united and jubilant, they are likely lynching an innocent man.

  **2. The Deliberation-Independence Trade-Off**
  *   **Conflict:** You cannot allow free discussion (to improve Competence) and maintain statistical Independence (to average out errors).
  *   **Explanation:** Talking helps people understand the evidence (good for Competence), but it makes their votes correlated (bad for Independence).
  *   **For the Scene:** If your villagers talk before voting, they might understand the poison better, but they will all end up voting the same way for the wrong reason. If they vote silently, they preserve independence but might miss key clues.

  **3. The Confidence-Competence Decoupling**
  *   **Conflict:** Individual confidence is not a reliable indicator of individual competence in social settings.
  *   **Explanation:** In your village, confidence is a function of *social validation*, not *evidence*.
  *   **For the Scene:** The loudest, most confident accuser is statistically the least reliable source of truth in a feedback loop system.

  ---

  ### Workload and Negotiability

  **Which requirement does the most work?**
  *   **Requirement 3 (Correlation Structure/Independence).**
  *   **Reason:** This is the fulcrum. If votes are independent, even low-competence voters can find the truth (the standard Wisdom of Crowds). If votes are correlated (as in your village), even high-competence voters will fail. This requirement determines whether the math of the majority holds or collapses.

  **Which requirements are negotiable?**
  *   **Requirement 5 (Incentive Compatibility).**
  *   **Reason:** Depending on the story, you can assume people are mostly sincere. While strategic voting matters in politics, in a village poisoning scare, fear usually drives sincerity (they genuinely believe the threat). You can simplify this without breaking the theory.
  *   **Requirement 1 (Ontological Anchor).**
  *   **Reason:** For the purpose of the scene, you can assume there *is* a truth. You don't need to solve the philosophical problem of objective reality to write the scene, only to assume the characters believe there is one.

  **Which requirements cannot be met at the same time?**
  *   **High Confidence + High Accuracy + Social Influence.**
  *   **Explanation:** If social influence is present (your village mechanic), you must sacrifice either Confidence or Accuracy. You cannot have a group that influences each other, ends up totally sure of themselves, *and* is right. One of those three must break.

  ---

  ### Confidence Levels in Claims

  *   **Claim:** Correlated votes destroy majority accuracy.
      *   **Confidence:** **High (95%)**. This is mathematically robust in network theory and economics.
  *   **Claim:** Confidence feedback loops lead to information cascades (error amplification).
      *   **Confidence:** **High (90%)**. Well-documented in behavioral finance and social psychology.
  *   **Claim:** Deliberation improves competence but destroys independence.
      *   **Confidence:** **Medium (75%)**. This is the **Least Sure** claim. Some research suggests "deliberative polling" can improve accuracy *more* than the loss of independence hurts it, provided the facilitation is perfect. However, in an unmoderated village mob, the loss of independence almost certainly dominates.
  *   **Claim:** Cohesion is inversely related to truth-tracking in real-time.
      *   **Confidence:** **High (85%)**. Groupthink literature strongly supports this.

  **Flagged Uncertainty:**
  I am least sure about the precise tipping point where **Deliberation** stops helping and starts hurting. In your novel, you can set this threshold wherever it serves the drama. The theory says deliberation *risks* destroying independence, but it does not dictate exactly *when* the risk becomes a certainty. That is the gray area where your characters live.
