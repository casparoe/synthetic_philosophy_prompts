      *   *View 2 (Sequence of time-slices):* **Perdurantism** (4D view). The object is a "spacetime worm" composed of temporal parts.
      *   *The User's Proposed View:* Both are valid tools; neither is ontologically privileged; choice is pragmatic.
      *   *Candidate Labels:*
