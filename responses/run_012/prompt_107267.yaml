          2.  *Perdurantism/Sequence:* It's a "stack of versions/snapshots" when debugging or analyzing history.
      *   **Philosophical Assumption:** The user notes philosophers often argue one view must be *the* truth (monism about identity).
      *   **Core Question:** Is there a name for the view that *neither* is fundamental, *both* are legitimate, and the choice depends on context/utility?
