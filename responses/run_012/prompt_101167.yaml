prompt: |-
  I'm a philosophy professor, and I keep getting the ornithology line thrown at me — you know the one, that philosophy of science is to scientists as ornithology is to birds — usually by a physicist colleague who means it as a conversaton-ender. Most recently he used it to dismiss a grad student's question about whether the standards we use to pick between theories (simplicity, naturalness, whatever) are doing empirical work or aesthetic work, as if the very asking were a category error. I've got a response half-written but I keep collapsing alot of different complaints into one, so I want the disambiguation done properly. You're an expert in the philosophy of science and in the rhetoric of science, so please think carefully before you answer.

  Start with a brainstorm: list every distinct precise claim that line could be making — about what philosophy of science is (descriptive vs. normative vs. foundational), about what scientists actually need (tools, results, understanding, nothing), about the analogy itself (do birds need ornithology? is the analogy doing any work?), about the difference between philosophy of science and philosophy in science, about the difference between philosophy helping science and philosophy helping scientists, and anything else you can think of. Then lay them out as a menu for me.

  Please give me the response in these sections, in this order: (1) "Brainstorm" — a short bulleted list, maybe 6-10 bullets, just getting the candidates on the table. (2) "The menu of readings" — the main event, 600-800 words, where each reading gets a name, a one-sentence statement of the precise thesis, and a verdict (trivial / substantive and defensible / false / ambiguous). (3) "Which reading he was using" — short, 100-150 words, saying which reading the line has to be read as if it's going to support his dismissal of the grad student's question, and whether that reading is one of the defensible ones. (4) "What I should say back" — short, 150-200 words, a sketch of a reply that doesn't just deny the slogan but separates the readings and grants whatever is true in it. Don't give me citations or a reading list, I know the literature.
