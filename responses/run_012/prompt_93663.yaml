      *   *Conclusions:* This physical difference breaks his first conclusion that there is no contribution. You are contributing to the stock even if you aren't triggering a tipping point. It also undermines the idea that there is no blame. Even if your car didn't single-handedly create the jam, you are voluntarily participating in a system you know is harmful, which is different from being an unwitting participant in a rush hour you didn't create. Finally, the claim that there is no reason to act fails because while one car leaving might not clear the jam, if everyone decides nothing matters and stays on the road, the jam never clears, whereas if everyone leaves, it does.
