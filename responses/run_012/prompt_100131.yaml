      *   *Key Quote Idea:* "Don't think, but look!" (Look at what biologists *do*).
      *   *Key Distinction:* "Obeying a rule" vs. "Causal regularity."
      *   *Key Warning:* Reifying "Information" as a substance.

  8.  **Final Review against Tone:** Needs to be philosophical, precise, not overly biographical, focusing on the *logic* of his later work. Avoid making him a scientist. He remains a philosopher of language.

  *(Self-Correction during drafting)*: I need to be careful not to say Wittgenstein would call it "false." He would call it "confused" if it leads to philosophical errors, but "useful" if it stays within the lab. The distinction is between *internal* validity (biology) and *external* philosophical overreach.

