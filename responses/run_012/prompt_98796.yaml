answer: |-
  Your observation strikes me as both precise and necessary, and I suspect you are correct that the vocabulary we inherit is insufficient for the distinction you are drawing. The terms you listed, establishment, separation, secularism, and the rest, are indeed tools for describing legal architectures or ideological commitments, but they are poorly calibrated to measure the actual friction between state machinery and religious institutions. In comparative politics and the sociology of religion, there are attempts to bridge this gap, most notably in the literature on church-state regimes, where scholars like Jonathan Fox or Christian Joppke categorize states based on levels of regulation and support. However, even these typologies tend to code for what is on the books rather than what happens in the administrative back offices where tax codes are processed and building permits are signed. You are pointing at something more granular than a regime type and more structural than a cultural attitude. You are pointing at the operational modality of the state vis-a-vis religion, the set of default settings that persist regardless of the constitutional label.

  There is no single canonical term for this specific gap, though you will find fragments of it in discussions of path dependence in historical institutionalism or in the concept of vicarious religion proposed by Grace Davie, which describes how populations use churches without believing in them. Neither of these quite captures the mechanical reality you are describing, which is about how the state administers religion rather than how the populace consumes it. If I were to help you forge a name, I would suggest looking toward the concept of administrative entanglement or functional settlement. The carving you need is between juridical status and operational integration. Juridical status is the constitutional claim, the story the state tells about itself, such as having no established church. Operational integration is the reality of how the state's bureaucracy interacts with religious bodies, such as collecting taxes for them or maintaining their buildings. The distinction matters because juridical status is often a signal of identity, while operational integration is a signal of inertia. When you describe France funding religious schools as neutrality because it funds them all alike, you are describing a juridical logic. When you describe it as underwriting religion, you are describing an operational reality. The thing you are circling is the distance between those two descriptions.

  Regarding your specific uncertainty about the sticky church tax, I believe it belongs under the same concept, and the reason lies in the source of the friction. If the stickiness were purely social, such as community pressure preventing someone from leaving a congregation, that would be a matter of culture or sociology. But when the friction is administrative, requiring a formal declaration at a government office to stop a payment, that is a feature of the state's architecture. It reveals that the default setting of the citizen is to be a contributor to the church, and opting out requires navigating state bureaucracy. This is not merely voluntary practice with inertia; it is a system where the state acts as the collector and the church acts as a beneficiary of state capacity. This fits your concept because it demonstrates that the effective settlement is one of cooperation and default support, regardless of whether the constitution calls it voluntary. The key metric here is not belief, but the transaction cost of exit. A system where exit is legally permitted but administratively costly is functionally different from one where exit is seamless, even if both are legally voluntary. Therefore, the sticky tax is a perfect example of the operational integration you are trying to name, because it shows the state maintaining the religious infrastructure through bureaucratic default rather than through confessional mandate.

  However, I must tell you where my reasoning might fail and what would change my mind about this carving. The primary risk is that you might be grouping together phenomena that have different causal mechanisms. The reason England has an empty established church is historical decay and cultural shift, while the reason Germany collects church tax is a specific political compromise from the nineteenth century designed to preserve church independence from the state after the Kulturkampf. If the causes are fundamentally different, then a single concept like functional settlement might obscure more than it reveals. What would change my mind is evidence that the legal form actually drives the operational reality over a long enough timeline. If we found that countries with strict separation clauses eventually purge their administrative entanglements, while established churches always retain state funding, then the legal form is the true driver and the current gap is just a lagging indicator. In that case, your distinction would be temporary noise rather than a stable category. Additionally, if there were a case where operational integration was high but religious vitality was also high, such as in some religious democracies, and another where integration was high but vitality was low, like England, we would need to know if the concept explains the vitality or just the bureaucracy. If it only explains the bureaucracy, it is a narrower tool than you might hope.

  Another point of failure could be the normative weight of the distinction. You noted that the descriptions do rhetorical work, framing the same fact as either neutrality or establishment. If we adopt a term like administrative entanglement, we risk reifying the bureaucracy as the true reality and dismissing the constitutional claim as mere fiction. But the constitutional claim matters because it sets the boundaries for future litigation and reform. The legal form is the lever activists pull to change the operational reality. If we focus too much on the effective settlement, we might miss how the legal form constrains the state even when it is currently ignored. I would change my carving if I became convinced that the legal form is not just a label but a constraint that shapes the operational reality in ways not immediately visible. For now, though, I agree with you that the field lacks a term for the gap between the map and the territory. You are describing the institutional sediment of history that remains after the ideological battles are settled, the way the state actually touches religion regardless of what it says about the touch. Whether you call it operational integration, functional establishment, or administrative entanglement, the carving is between the story the state tells and the work the state does.
