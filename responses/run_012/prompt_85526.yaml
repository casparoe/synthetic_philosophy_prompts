answer: |-
  ### Seminar Exercise: The Limits of Universalization

  **Question:**
  Construct a single ordinary-life scenario where the agent's maxim is morally permissible (or even kind), yet universalizing it yields a **Contradiction in Conception (CiC)** on the *practical* reading (the practice relies on scarcity/exception and collapses if universalized) while a *strict logical* reading finds no contradiction. 

  Your answer must:
  1.  State the maxim in the standard "I will do X in order to Y" form.
  2.  Defend the level of description by explaining what happens if the maxim is restated one notch narrower and one notch wider.
  3.  Demonstrate the divergence between the logical and practical readings of universalization.
  4.  Identify whether this embarrasses the Formula of Universal Law (FUL) specifically or the Categorical Imperative as a whole, checking the verdict against the Formula of Humanity (FH).
  5.  Conclude with the strongest Kantian reply to this objection and the theoretical cost of that reply.

  *(Note: The standard four examples—false promise, suicide, wasted talents, refusing to help—are strictly off-limits.)*

  ***

  ### Model Answer

  **Scenario:** Organizing a surprise birthday party.
  **Maxim:** "I will conceal my celebratory intentions from a friend in order to produce the delight of a surprise."

  **Level of Description:**
  If stated **wider** ("I will celebrate friends' birthdays"), universalization yields no contradiction; celebration remains possible. If stated **narrower** ("I will hide in a closet at 5 PM"), the maxim becomes too specific to generate a law, rendering universalization trivial. The chosen level captures the essential tension: the reliance on concealed information to generate a specific psychological effect.

  **Logical vs. Practical Contradiction:**
  On a **strict logical reading**, a world where everyone conceals celebratory intentions is conceivable. Concealment is logically compatible with celebration; no concepts contradict. However, on the **practical reading**, the maxim fails. The efficacy of the action depends on the exception. If *everyone* universally adopts this maxim, the expectation shifts: friends will *expect* concealment and surprises. Once a surprise is expected, it ceases to be a surprise. The end (delight of the unexpected) becomes impossible to achieve in a world where the means (concealment) are universalized. The practice destroys its own condition of success.

  **FUL vs. FH:**
  This embarrasses the **FUL specifically**, not necessarily the CI as a whole. FUL suggests the action is forbidden because the universalized practice collapses. However, the **Formula of Humanity (FH)** yields a clean verdict of permission. The agent treats the friend as an end, honoring their worth through celebration and care. The friend's rationality is not undermined; their emotional well-being is supported. Since FH permits what FUL forbids, the tension suggests FUL is an imperfect heuristic for the deeper CI principle.

  **Kantian Reply and Cost:**
  The strongest Kantian reply argues that universalization does not mean "everyone does this to everyone simultaneously," but "everyone adopts this policy when appropriate." In a world where everyone adopts the policy of surprising friends, surprises still occur because agents act at different times toward different recipients. The *practice* survives because the universal law governs the *adoption of the maxim*, not the *frequency of the event*. 
  **Cost:** This defense requires shifting FUL from a test of *consequences* (what happens if everyone does this?) to a test of *volition* (can I will this policy?). This blurs the line between Contradiction in Conception and Contradiction in Will, potentially collapsing the four-fold classification of duties and making FUL dependent on a prior understanding of rational volition that the formula was meant to generate.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **A Range (16–20 Marks): Excellent**
  *   **Maxim Specificity (4 marks):** Clearly articulates the "one notch narrower/wider" defense. Shows understanding that maxim formulation determines the outcome.
  *   **Contradiction Analysis (5 marks):** Precisely distinguishes Logical (conceivable) vs. Practical (self-defeating) contradiction. Identifies that the *efficacy* of the end is thwarted, not the logic of the means.
  *   **FH & Systemic Impact (5 marks):** Correctly identifies that FH saves the case, isolating the problem to FUL as a standalone formula. Nuanced discussion of whether this breaks the CI or just FUL.
  *   **Kantian Reply (4 marks):** Offers the "policy vs. frequency" defense. Clearly articulates the theoretical cost (blurring CiC/CiW or making FUL parasitic on FH).
  *   **Constraint Check:** Uses an original case (not the forbidden four).

  **B Range (11–15 Marks): Good**
  *   **Maxim Specificity (2 marks):** Identifies the maxim but gives a weak or vague defense of the level of description.
  *   **Contradiction Analysis (4 marks):** Distinguishes logical vs. practical but may conflate "impossible" with "difficult."
  *   **FH & Systemic Impact (4 marks):** Mentions FH but treats it as a separate rule rather than analyzing the tension within the CI architecture.
  *   **Kantian Reply (3 marks):** Offers a reply but fails to articulate the theoretical cost clearly.
  *   **Constraint Check:** Uses an original case.

  **C/Pass Range (6–10 Marks): Competent**
  *   **Maxim Specificity (1 mark):** States a maxim but ignores the narrower/wider instruction.
  *   **Contradiction Analysis (3 marks):** Identifies a contradiction but fails to distinguish logical from practical readings (treats them as the same).
  *   **FH & Systemic Impact (2 marks):** Mentions FH superficially or claims the CI is totally broken without nuance.
  *   **Kantian Reply (2 marks):** Generic defense ("Kant would say don't do it") without reconstructing the argument.
  *   **Constraint Check:** Uses an original case.

  **Fail (0–5 Marks)**
  *   Uses a forbidden example (False Promise, Suicide, etc.).
  *   Fails to construct a case where the action is morally permissible/kind.
  *   Confuses Contradiction in Conception with Contradiction in Will entirely.
  *   Plagiarized or incoherent.

  **Common Pitfalls (Notes for Markers):**
  *   **The "Over-Generalization" Cheat:** Students often write maxims like "I will lie." This must be penalized under Maxim Specificity. The maxim must include the *purpose* (in order to Y).
  *   **The "CiW" Confusion:** Many students will argue this is a Contradiction in Will (you can't *will* a world without surprises). While related, the prompt asks for a *Practical Conception* contradiction (the action becomes impossible). Marks should be deducted if they conflate the two without explanation.
  *   **The "FH Rescue":** A competent answer says "FH saves it." An excellent answer explains *why* that creates a hierarchy problem within the CI.
