answer: |-
  **Project Title:** Frame-Relativity and the Transitivity of Betterness: A Structural Analysis of Spectrum Arguments

  **Research Question**
  Can a frame-relative betterness relation be transitive, extensionally adequate to the spectrum cases, and action-guiding, or does the attempt show that any transitive relation either ignores the spectrum or cannot rank the endpoints?

  **Project Summary and Theoretical Motivation**
  Spectrum arguments pose a durable challenge to standard decision theory and axiology. In cases ranging from Parfit's Repugnant Conclusion to spectra of pain intensity or aesthetic value, we encounter a sequence of options $A_1, A_2, ... A_n$ where each adjacent pair $A_i, A_{i+1}$ seems clearly ranked (e.g., $A_i$ is better than $A_{i+1}$), yet the endpoints $A_1$ and $A_n$ seem ranked inversely or incomparably. This creates a pressure to abandon the transitivity of the "better than" relation.

  Existing responses generally fall into three camps: (1) deny transitivity (accepting rational cycles or money-pump vulnerability); (2) deny the intuitive comparisons (claiming vagueness or incommensurability at specific points); or (3) restrict transitivity to "precise" cases while accepting counterintuitive endpoint rankings. All three leave a gap. The first weakens the normative force of rationality; the second relies on contentious metaphysical claims about vagueness; the third demands we accept conclusions that seem to drain "betterness" of its action-guiding content.

  My hypothesis is that these positions miss a structural distinction in how we apply betterness relations. I propose distinguishing between **frame-relative betterness** ($>_F$) and **transitional betterness** ($>_T$).
  *   $>_F$ operates within a fixed evaluative frame (fixed dimensions, scale, and baseline). Within a frame, betterness is strictly transitive.
  *   $>_T$ operates across frames, guiding choice between options that shift the evaluative context itself.

  **Why This Is Not Mere Relabeling**
  A skeptical committee might worry this is simply defining a partial order and labeling the gaps "frames." That is not the claim. A standard partial order assumes a fixed domain where relations are either defined or undefined. My proposal argues that the *metric of evaluation* shifts between adjacent pairs in a spectrum. In a pain spectrum, comparing mild pain to moderate pain uses a hedonic scale; comparing moderate pain to severe pain might use a functional-impairment scale. The "intransitivity" arises not because logic fails, but because the chain links different metrics.

  If we stick with the standard single-relation picture, we are forced to say either that our intuitions about the adjacent pairs are wrong (counterintuitive) or that rationality permits cycles (normatively costly). If the frame-relative view succeeds, it explains *why* the adjacent comparisons feel compelling (they are locally valid) while blocking the inference to the endpoints (they are globally invalid due to metric drift). The loss in sticking to the single-relation picture is the inability to model context-sensitivity without abandoning transitivity.

  **Methodology and Work Plan**
  This project is scoped for one semester. I will not attempt a full axiology but rather a formal sketch and stress test of the frame-relative distinction.

  1.  **Formal Taxonomy (Weeks 1-4):** I will define the formal properties at issue: transitivity, asymmetry, completeness, and context-sensitivity. I will formalize a frame-relative relation $>_F$ where a frame $F$ is a tuple containing a set of dimensions and a weighting function. Transitivity will hold within $F$, but the project will explore the conditions under which one moves from $F_i$ to $F_{i+1}$.
  2.  **Test Cases (Weeks 5-8):** I will apply the model to four distinct spectrum types:
      *   *Population Ethics:* (Repugnant Conclusion style).
      *   *Phenomenal Spectra:* (Pain/pleasure intensity).
      *   *Risk:* (Probabilities vs. magnitudes).
      *   *Aesthetic/Moral:* (Trade-offs between quality and quantity).
      The goal is to see if the "frame shift" occurs at the same structural point in each case.
  3.  **The Arbitrariness Objection (Weeks 9-12):** The critical weakness of this view is that frame selection could be ad hoc. If I can define frames to save transitivity wherever I like, the theory is trivial. I will develop criteria for principled frame selection. If frame selection cannot be constrained by features of the options themselves (e.g., threshold effects in human psychology or logical breaks in the description of goods), the view fails.
  4.  **Money-Pump Analysis (Weeks 13-15):** I will test whether $>_T$ (the cross-frame relation) exposes an agent to diachronic exploitation. If the frame-relative view allows an agent to be money-pumped when moving between frames, it fails as a decision-guiding theory.

  **Possible Conclusions and Decision Criteria**
  There are three likely outcomes:
  1.  **Success:** The model shows that frame shifts are principled (e.g., triggered by qualitative thresholds) and that $>_F$ preserves transitivity without making the endpoints incomparable in a way that blocks choice. *Decision Criterion:* The model handles the test cases without ad hoc frame adjustments.
  2.  **Partial Success (The "Partial Order" Collapse):** The frame-relative relation turns out to be extensionally equivalent to a standard partial order with incompleteness. *Decision Criterion:* If the "frame" adds no explanatory power over simply saying "$A$ and $B$ are incomparable," the project shifts to arguing why the *explanation* for incompleteness matters.
  3.  **Failure:** The frame selection proves arbitrary, or the view succumbs to money-pump arguments. *Decision Criterion:* If I cannot specify a rule for frame selection that is independent of the desired outcome (saving transitivity), or if the agent is exploitable, the hypothesis is rejected.

  **Feasibility and Deliverables**
  This scope is realistic for a summer fellowship. I am not solving the Repugnant Conclusion; I am testing whether the *structure* of the argument relies on an equivocation. The deliverable will be a 15-20 page paper sketching the argument and a formal appendix containing the definitions and the money-pump analysis.

  **Significance**
  If successful, this project offers a way to retain transitivity—a cornerstone of rational choice theory—without denying the intuitive force of spectrum arguments. It suggests that the failure lies not in our rationality or our values, but in the assumption that all value comparisons share a single metric. If it fails, it provides a rigorous proof that frame-relativity cannot rescue transitivity, pushing us back toward incommensurability or intransitivity with greater confidence. Either result clarifies the structural constraints on betterness relations.
