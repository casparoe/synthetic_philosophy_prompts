answer: |-
  The kettle clicked off. Dev poured the water over the tea bags, watching the brown swirl expand. Fi was leaning against the counter, arms folded, staring at the rain streaking the window. The silence since dinner had been heavy, the kind that usually follows a row about politics or money, but this was about your mum's hip.

  'Milk?' Dev asked.

  'Please.' Fi took the mug. 'Look, I know you think I'm being soft. About the ministry.'

  'I think you're being kind,' Dev said, adding milk to his own. 'There's a difference. I'm not saying your mother-in-law isn't off the stick. She is. I'm just saying what we call that matters.'

  'So we're back to Hume.'

  'We're always back to Hume.' Dev took a sip, winced at the heat. 'It's the only coherent way to handle the claim. He says a miracle is a violation of a law of nature. And his test is simple: no testimony is sufficient to establish a miracle unless the falsehood of that testimony would be more miraculous than the event itself.'

  Fi turned from the window. 'And that's where it's rigged, Dev. It's circular. You've already decided the event can't happen. So when someone says "I saw it," you say "Impossible," and when they say "But I saw it," you say "You must be mistaken," because the event is impossible. The conclusion is doing all the work.'

  'It's not circular, it's probabilistic,' Dev said, putting his mug down. 'We don't need a full calculus. It's ordinary reasoning. If you told me you saw a dog in the park, I'd believe you. If you told me you saw a tiger, I'd ask for proof. Not because I've decided tigers don't exist, but because tigers don't belong in Croydon. The likelihood of you being mistaken—or lying—is lower than the likelihood of a tiger being there.'

  'But a law of nature isn't a tiger in Croydon,' Fi said. 'It's a generalisation based on observation. That's my point. In the hospital, I see consultants all the time. They say "This prognosis is terminal," or "This function doesn't return after this kind of damage." Then, occasionally, it does. Do we say the patient is lying? Do we say the doctor was wrong about the specific case, or wrong about the biology?'

  'Wrong about the case,' Dev said. 'Spontaneous remission happens. But that's within the laws. It's statistically unlikely, not a violation.'

  'How do you know?' Fi pressed. 'If a hip joint regenerates cartilage that medical science says cannot regenerate, how is that not a violation? You're drawing a line between "unknown natural cause" and "supernatural cause," but Hume's test assumes you know the boundary perfectly.'

  'Hume assumes uniform experience,' Dev said. 'Every human being who has ever lived has died. Every human being who has ever lived has not walked on water. The evidence for the law is universal.'

  'Until it isn't.' Fi tapped her mug. 'And here's the thing that keeps me up. Hume's test requires you to weigh two probabilities. One: the law was broken. Two: the witness is mistaken. To do that, you need a number. How likely is it that a law of nature would be broken? Nobody has ever explained how you get that number. You can't say "zero," because then it's dogma. If you say "one in a billion," then sure, maybe the witness is lying. But if you can't quantify it, the test is useless.'

  Dev rubbed his chin. 'Fair. We can't quantify it precisely. But we can say it's vanishingly small compared to the error rate of human testimony. People lie. People misremember. People want to believe. Your mum wants to be healed. The ministry wants a success story. The probability of that social pressure producing a report is higher than the probability of gravity taking a holiday.'

  'It's not gravity,' Fi said softly. 'It's biology. It's messy. And that's why the medical analogy holds. If a single well-documented case overturns a medical generalisation, we update the science. We don't say the patient is a fraud. Why is a law of nature treated as more rigid than a clinical guideline?'

  'Because clinical guidelines are inductive,' Dev said. 'Laws of nature are... well, they're the framework.'

  'Who says?' Fi challenged. 'Hume says. But he's assuming what he's trying to prove. That nature is a closed system.'

  Dev sighed, picking up his tea again. 'Okay. Let's look at the structure then. Hume compares his argument to Tillotson's argument against transubstantiation. You know it?'

  'Vaguely. Protestant stuff.'

  'Tillotson said we shouldn't believe in transubstantiation because our senses tell us the bread is still bread. Hume says his argument is the same kind of move. Our uniform experience tells us the law holds. To believe the miracle, you have to reject your own senses and experience in favour of testimony. It's an epistemological check, not a theological one.'

  Fi laughed, a short, dry sound. 'And you think that helps him? Tillotson was arguing against a doctrine that explicitly asks you to override your senses in favour of faith. He was winning a theological argument with theological rules. Hume is trying to use that to shut down empirical inquiry.'

  'He's trying to protect empirical inquiry!' Dev said, voice rising slightly. 'If you allow exceptions based on testimony, you open the door to every superstition ever invented. You lose the ability to distinguish between a healing and a hallucination.'

  'I'm not talking about superstition,' Fi said, her voice steady. 'I'm talking about the limits of what you think you know. As a chaplain, I sit with people when the medicine stops working. I see things that shouldn't happen. Not always miracles. Sometimes just... grace. But if I apply Hume's test, I have to tell them their experience is impossible before I've even listened to it. It shuts down the conversation.'

  'It shuts down the credulity,' Dev corrected. 'It forces the burden of proof where it belongs.'

  'Or it places the burden so high it can never be met,' Fi said. 'You say the falsehood of the testimony must be more miraculous than the event. But if you define the event as "impossible," then any testimony is automatically less miraculous. You've weighted the scales before you step on them.'

  Dev was quiet for a moment. He looked at the steam rising from his mug. 'Maybe. Maybe the definition is the problem. But Fi, if you remove the scepticism, what stops it becoming a free-for-all? Your mum is off the stick. I'm glad. Truly. But if the ministry starts claiming they can cure cancer next week, and people stop chemo because of it... Hume is the shield against that.'

  'I know,' Fi said. 'I'm not saying throw out scepticism. I'm saying Hume's specific formulation is a trick. It pretends to be a balance scale, but there's a magnet under one side.'

  'Maybe,' Dev conceded. 'But it's a useful trick. It keeps us honest.'

  'It keeps us closed,' Fi said. 'There's a difference.'

  They stood there for a while, the rain ticking against the glass. The kitchen felt small, filled with the warmth of the tea and the coldness of the impasse. Dev took a final sip and put the mug in the sink.

  'I'm not saying your mum lied,' he said.

  'I know,' Fi said. 'And I'm not saying gravity broke.'

  'Just that we don't know what happened.'

  'Exactly.' Fi pushed off the counter. 'Pass me a biscuit?'

  Dev opened the tin. 'Digestive or hobnob?'

  'Digestive. Needs to be sturdy.'

  He handed it over. They ate in silence, the argument suspended, not resolved, like so many things between people who love each other enough to keep talking despite the maths not adding up.
