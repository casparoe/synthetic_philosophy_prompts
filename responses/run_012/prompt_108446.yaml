prompt: |-
  I was round at a friend's place last week and we ended up arguing about the Prisoner's Dilemma — he's been bingeing pop game-theory videos — and he gave me his take on superrationality. Roughly what he said: "Superrationality says that in a one-shot Prisoner's Dilemma you should cooperate, because if you're the kind of person who reasons your way to cooperating, then the other player — being rational in the same way you are — will have reasoned to the same conclusion, so you'll both cooperate and clean up against the defectors. It's really just Kant's categorical imperative in game-theory clothing: act only on the rule you'd want everyone to follow. It's also the same thing as one-boxing in Newcomb's problem. The upshot is that superrationality tells you to cooperate in any symmetric game, and it shows cooperation can be rational even with no repetition, no reputation and no enforcement, which is why it knocks out the standard game-theoretic prediction that rational players defect in the one-shot Prisoner's Dilemma." He then said something I couldn't follow about how it means you should cooperate with a total stranger you'll never see again, as long as you know the two of you are "the same type of thinker".

  I'm fairly sure some of that is right and some of it is off, but I honestly can't tell which bits are which, and I don't want to repeat his version to people if it's misleading. Could you go through it claim by claim and tell me what someone who actually works on this stuff would nod along to, what they'd wince at, and what's just wrong? And specifically: does the conclusion he draws — that it refutes the standard prediction and that it generalises to any symmetric game — actually follow from the parts of superrationality that survive scrutiny? I'd also like the honest lay of the land on where the idea sits: is it a fringe hobbyhorse, a mainstream extension of decision theory, or something in between? Please answer in British English.
