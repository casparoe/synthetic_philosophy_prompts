      *   *Claim 5: Cooperate in *any* symmetric game.* -> **Wrong.** Only in games where mutual cooperation yields a better payoff than mutual defection (like PD, Stag Hunt). In a game where symmetry leads to a worse outcome (rare, but possible in coordination failures or zero-sum), it doesn't apply. Actually, in zero-sum, symmetry implies a draw, but "cooperate" isn't the right term. More importantly, in asymmetric games, it doesn't apply. Even in symmetric games, if the Nash Equilibrium is the only stable point, superrationality struggles.
      *   *Claim 6: Rational without repetition/reputation.* -> **Correct (within the framework).** That's the selling point.
      *   *Claim 7: Knocks out standard prediction.* -> **Contentious.** Standard game theory (Nash Equilibrium via CDT) says Defect. Superrationality challenges the *definition* of rationality, not the math of the standard model. It doesn't "refute" standard theory; it proposes an alternative decision theory. Experts would wince at "refutes."
