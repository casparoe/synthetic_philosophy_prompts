answer: |-
  Here is the specification list for a viable expressivist semantics. I have excluded the basic Frege-Geach constraints you already listed (embedding in conditionals, validity, contradiction, truth-aptness) and focused on the extended requirements necessary for a full-dress system.

  ### The Specification List

  **1. Interrogative Embedding**
  *   **The Case:** "I wonder whether lying is wrong." The speaker asserts no moral proposition and expresses no settled moral attitude. Yet the clause "lying is wrong" contributes the same semantic value here as in the assertion "Lying is wrong."
  *   **Requirement:** The semantics must assign a content to moral sentences that can serve as the object of a question operator without requiring the speaker to currently hold the attitude associated with that content.
  *   **Status:** **Non-negotiable.** (Competent speakers use moral terms in questions.)

  **2. Epistemic Modality**
  *   **The Case:** "Lying is probably wrong." The modifier "probably" operates on the moral claim. If the moral claim just *is* an attitude (e.g., disapproval), "probably" would have to modify the attitude itself (e.g., "probably disapproving"). But one can be definitely disapproving while acknowledging the act is only *probably* wrong.
  *   **Requirement:** The account must distinguish the *content* of the moral judgment from the *strength* or *existence* of the attitude, allowing epistemic operators to target the content.
  *   **Status:** **Non-negotiable.** (We make uncertain moral judgments constantly.)

  **3. Cross-Domain Disjunction (Mixed Discourse)**
  *   **The Case:** "Either lying is wrong or the sign is misprinted." One disjunct is ostensibly normative; the other is descriptive. The disjunction is truth-apt and logically valid.
  *   **Requirement:** The semantic value of moral sentences must be of the same logical type as descriptive sentences to allow for univocal disjunction operators. You cannot disjoin an "imperative" with a "statement" in standard logic.
  *   **Status:** **Non-negotiable.** (Mixed inferences are ubiquitous and valid.)

  **4. The Sincerity Gap (Amoralism)**
  *   **The Case:** A speaker says "Lying is wrong" but adds, "but I couldn't care less." They lack the conative state (disapproval) usually linked to the term. We treat this as *insincerity*, not a *linguistic error*.
  *   **Requirement:** The semantics must decouple the *meaning* of the moral term from the *psychological state* of the speaker at the moment of utterance. Meaning cannot be identical to the occurrence of the attitude.
  *   **Status:** **Non-negotiable.** (If you cannot account for lying/insincerity, you do not have a semantics, you have a psychology report.)

  **5. Diachronic Retraction**
  *   **The Case:** A speaker says "Lying is wrong" at $t_1$, then at $t_2$ says "I take that back." They are not saying they were lying at $t_1$; they are saying their previous commitment was incorrect.
  *   **Requirement:** The account must allow for moral claims to be rationally revisable based on new information or reflection, implying a normative standard independent of the current attitude.
  *   **Status:** **Non-negotiable.** (Essential for rational agency.)

  **6. Supervenience**
  *   **The Case:** If Act A and Act B are identical in all natural properties (pain caused, intent, outcome), it is impossible for A to be wrong and B not wrong.
  *   **Requirement:** The semantics must entail that moral properties supervene on natural properties without reducing moral terms to natural terms.
  *   **Status:** **Non-negotiable.** (A structural feature of moral thought; denying this makes moral reasoning impossible.)

  **7. Action Guidance (Internalism)**
  *   **The Case:** If a agent sincerely judges "I ought to $\phi$," they necessarily have *some* motivation to $\phi$ (even if overridden).
  *   **Requirement:** The semantics must explain the necessary connection between moral judgment and motivation without making it an analytic truth that collapses into tautology.
  *   **Status:** **Camp Prejudice.** (Externalists deny this is necessary. However, for *expressivism*, this is usually a core commitment. If you drop this, you lose the main motivation for being an expressivist.)

  **8. Compositionality of Psychological States**
  *   **The Case:** If "Lying is wrong" expresses Disapproval(Lying), then "If lying is wrong, then stealing is wrong" must express a complex psychological state.
  *   **Requirement:** The theory must identify a plausible psychological state corresponding to complex moral sentences (negations, conditionals, disjunctions) that explains why holding the premise and denying the conclusion is a conflict in attitude.
  *   **Status:** **Non-negotiable.** (Without this, the logic is unexplained.)

  ***

  ### The Incompatibilities

  You cannot satisfy all of the above without tension. The specific trilemma that threatens the project is:

  1.  **Semantic Uniformity:** Moral sentences have the same semantic type in asserted and unasserted contexts (Required by Embedding, Mixed Discourse).
  2.  **Expressivist Core:** The meaning of a moral sentence is constituted by the non-cognitive attitude it expresses (Required by Action Guidance/Theory Motivation).
  3.  **Psychological Realism:** There must be an actual, identifiable psychological state corresponding to every meaningful sentence (Required by Compositionality of Psychological States).

  **The Conflict:**
  If you hold (1) and (2), you violate (3). There is no identifiable psychological state corresponding to "If lying is wrong..." that is built out of "Disapproval(Lying)." We do not have "complex attitudes" that mirror the truth-functional operators.
  If you hold (1) and (3), you violate (2). You end up positing cognitive beliefs as the semantic content, collapsing into realism or hybridism.
  If you hold (2) and (3), you violate (1). You must say the meaning changes when embedded (the classic Frege-Geach failure).

  ### The Single Biggest Hurdle

  **The Compositionality of Non-Cognitive States (Requirement #8).**

  This is the specific technical failure point that sinks pure expressivism. It is not enough to say moral sentences *function* like propositions (Quasi-realism); you must explain *what the mind is doing* when it accepts a complex moral sentence.
  Standard logic works because belief states have a "world-to-mind" direction of fit that aligns with truth conditions. Attitudes have a "mind-to-world" direction of fit. There is no established psychology of "being for blaming for not blaming" that mirrors the logical structure of $\neg P$. Until you can specify the psychology of the complex attitude that makes modus ponens a *psychological inconsistency* rather than just a logical rule, the semantics is incomplete.

  ***

  ### Scorecard of Standard Moves

  **Quasi-Realism (Blackburn)**
  *   **Performance:** High on Logic/Embedding (1, 3, 5); High on Sincerity (4).
  *   **Failure Point:** Crashes on **Compositionality of Psychological States (8)**. It mimics realist truth-conditions without providing the underlying psychological architecture to justify why the mimicry works. It solves the logic by fiat, not by mechanism.

  **Hybrid Views (e.g., Copp, Ridge)**
  *   **Performance:** High on Logic/Embedding (1, 3); High on Compositionality (8) (by positing a belief component).
  *   **Failure Point:** Weak on **Action Guidance (7)**. By adding a belief component to handle logic, the necessary connection to motivation becomes contingent. It also struggles with **Sincerity (4)**: if meaning is part-belief, part-attitude, does asserting without the attitude count as semantic error or just insincerity?

  **Minimalism about Truth (Price, deflationary approaches)**
  *   **Performance:** High on Truth-aptness (your "price of entry"); High on Mixed Discourse (3).
  *   **Failure Point:** Sidesteps **Compositionality of Psychological States (8)**. It argues we don't *need* psychological states to match the logic, only linguistic practices. This satisfies the semantic spec but abandons the *expressivist* spec (explaining the mental state). It solves the problem by dissolving the requirement for a psychological counterpart.
