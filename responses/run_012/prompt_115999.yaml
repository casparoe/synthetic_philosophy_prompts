answer: |-
  Here is an analysis of the argumentative moves in *Metaphysics* Delta 2, 1013b11–14, structured to assist your seminar opening.

  ### 1. The Gain of Privation and the Literalness of "Source of Movement"
  Aristotle's primary gain in admitting privation (*sterēsis*) among causes is **explanatory symmetry**. If the presence of the steersman explains safety, the theory of causation is incomplete if it cannot account for the shipwreck without introducing a wholly new agent (e.g., the storm) as the *primary* explanation. By counting privation as a cause, Aristotle allows a single subject (the steersman) to explain opposite outcomes based on its modal status (present or absent). This preserves the unity of the explanation: the steersman is the variable that tracks the change in the ship's state.

  Regarding the closing phrase—"both... are causes as sources of movement" (*archē kinēseōs*)—you should take this **literally within Aristotle's physics, but technically.** In the *Physics*, a cause is defined as a principle (*archē*) of change. An absence is not a "pusher" (an efficient cause in the modern mechanical sense), but it is a principle of change because the removal of a preventing condition allows a natural tendency to proceed. For Aristotle, privation is one of the three fundamental principles of change (along with matter and form). Therefore, the absence of the steersman is a literal *archē* because it is the removal of the form/order that was holding the chaotic potential of the sea at bay. It is not "loose" speech; it is a claim about the metaphysical structure of change.

  ### 2. Imputation ("We Charge") vs. Ontological Causation
  The text contains a tension: Aristotle says "we sometimes charge" (*aitiōmetha*) the absence, yet concludes that privation *is* a cause.
  *   **The Move:** The phrase "we charge" acknowledges the linguistic practice of attribution, but the concluding clause ("both... are causes") ontologically validates that practice. Aristotle is arguing that our habit of blaming the absence reveals a real causal structure.
  *   **Does it establish absences cause?** Yes, but specifically as the cause of the *contrary* outcome. The example establishes that the *status* of the steersman determines the *status* of the ship.
  *   **Does it carry the general claim about contraries?** Yes. The core claim is "the same thing is the cause of contraries." The shipwreck example is not merely about absence; it is about how one entity (the steersman) generates opposite effects (safety/wreck) depending on whether it exists in the situation or is privated. The example succeeds because it shows that the *same subject* is the explanatory locus for both the positive and negative outcome. If Aristotle only meant "we blame absences," the general claim about the "same thing" causing contraries would collapse. He needs the absence to be a genuine causal counterpart to the presence for the symmetry to hold.

  ### 3. The Student Objection: The Storm vs. The Steersman
  **The Objection:** The student argues the storm (a positive force) caused the wreck; the steersman merely failed to prevent it. To call the absence a cause confuses a *sine qua non* condition with an active cause.

  **The Strongest Aristotelian Reply:**
  You should reply by distinguishing between the **cause of the motion** and the **cause of the outcome**. Aristotle would grant that the wind and waves are the efficient causes of the *motion* that damages the hull. However, the *shipwreck* (the failure of the ship to achieve its telos of safe passage) is caused by the lack of governance. In Aristotle's teleological framework, a ship is defined by its function (safety/transport). The steersman is the actualization of that function. When the steersman is absent, the ship reverts to its material potentiality (drifting/sinking). The absence is the cause of the *failure of the end*, even if the storm is the cause of the *physical impact*. The removal of a hinderer is, for Aristotle, a genuine cause of the resulting state (just as removing a pillar is the cause of a roof falling).

  **What to Grant the Student:**
  Grant that Aristotle is expanding the concept of "cause" beyond mere physical impulsion. The student is correct that there is a difference in *kind* between the storm's action and the steersman's absence. Aristotle's framework absorbs this difference by categorizing them under different causes (efficient vs. privative/formal), but he insists both are *archai*. The student is right to feel a disanalogy, but wrong to think that disanalogy excludes the absence from the category of "cause" entirely.

  ***

  **Note on Contemporary Disputes:** This passage anticipates the modern distinction between "doing" and "allowing," suggesting that while the metaphysics of omission differs from commission, both are causally relevant explanations for an outcome.
