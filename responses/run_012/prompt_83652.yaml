prompt: |-
  Two of my mates had a massive row in the canteen today and I somehow ended up as the referee, except I couldnt referee a game of snap. Can you actually settle it? Here's how it went.

  Aisha said eating meat is definately wrong and being vegetarian is the least harm you can do, and beef is the worst of all, because cows are huge, live for years, and you have to grow tonnes of crops to feed them, so it's bad for animals twice over.

  Dan said that's the bit everyone skips — growing the crops kills animals too. Harvesters mince mice and birds and rabbits, so per calorie a field of wheat isnt free either. He said his uncle's farm is all grass and no grain, so those cows eat stuff we can't eat anyway, and that might kill fewer animals per calorie than the vegetarian option.

  Aisha said crop deaths are accidents and nobody wants them, while the meat deaths are the entire point, so they're not the same thing at all. Dan said that's fine if you're scoring intentions, but if you're actually counting suffering then a mouse counts as much as a cow and it doesn't matter whether the farmer meant it. Then he said wild animals starve and get eaten alive constantly and nobody calls that a scandal, so she can't suddenly care about every field mouse.

  Aisha said a cow's whole life is suffering, not just the killing, and a cow lives for years while a mouse is here and gone. Dan said fine, if we're counting suffering per animal per year then chicken might be the worst meat of all, because there's millions of them and they live in filth — and Aisha said that's mad, because a chicken at least converts feed properly, whereas a cow is basically a methane factory.

  They kept going and I completely lost the thread. Who's right about what? Go move by move and rate each one. Say what they're both missing, and be clear about which parts actually need real numbers and which parts you can just reason out. Start with your bottom line in the first sentence, then give the reasoning — no preamble, and don't re-explain the argument back to me.
