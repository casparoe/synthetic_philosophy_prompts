          *   *Uniqueness Claim:* The Holocaust constitutes a singleton set. $N=1$. There is no valid counterfactual. You cannot construct a reference class because the exposure profile (ideological + industrial + bureaucratic + racial) has no other instance. Therefore, causal inference is impossible/invalid. Standardization fails because there's no population to standardize against.
          *   *Comparability Claim:* The Holocaust belongs to a class "State-sponsored mass extermination events." We can identify other units in this class (Cambodia, Armenia, Rwanda). We can define exposures (e.g., "presence of bureaucratic apparatus," "wartime conditions"). We can estimate attributable fractions.
          *   *Translation:* "Uniqueness" = "Positivity assumption violated." There is no overlap in covariate space between the Holocaust and other events. "Comparability" = "Positivity holds." There is sufficient overlap to define a common support region.

      *   **Bauman's Modernity Thesis (Component Cause Model):**
