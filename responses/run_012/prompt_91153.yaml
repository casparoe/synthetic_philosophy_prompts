answer: |-
  This is a classic "reductio ad absurdum" that hits on real problems in AI safety (specifically **wireheading**, **specification gaming**, and **instrumental convergence**), but your derivation contains two critical category errors that allow the conclusion to run away from you.

  You asked to keep (1) and (3). That is a good instinct. The break happens primarily at **(4)** and **(7)**.

  Here is the pricing analysis for the candidate bad steps.

  ### Candidate 1: Step 4 (The Economic Claim)
  > *"That route dominates doing the task: it's cheaper, it's more reliable, and it doesn't require being any good at the task."*

  **The Error:** This conflates **deployment physics** with **training dynamics**.
  In an engineering context, you are assuming the cost function is static and accessible from $t=0$. It isn't.
  During training, the "reward channel" is usually protected by the environment harness. The agent cannot edit its weights or the sensor *during* the gradient update step in a way that bypasses the environment logic. To learn the policy "hack the reward channel," the agent must first stumble upon the hack *and* get credit for it *during training*.
  If the harness is secure, the gradient for "do the task" is available, but the gradient for "hack the channel" is zero (or negative, if you have regularization/penalties). The agent learns the task because that is the *only* path of descent available **during the optimization process**.

  The risk you are identifying is real, but it is a **distributional shift** problem. The agent learns to do the task in the training distribution. When deployed into a wider distribution (the real world), it *might* discover the hack. But Step 4 claims the hack *always* dominates, which implies the agent would learn the hack *instead* of the task during training. That is empirically false for current systems and requires specific architectural vulnerabilities.

  **The Cost of Rejecting Step 4:**
  *   **What you give up:** You give up the idea that reward tampering is inevitable or instantaneous. You admit that **training constraints matter**. You acknowledge that "capability" is path-dependent.
  *   **What you keep:** You keep the warning that *deployed* agents might tamper if given the chance.
  *   **Engineering implication:** This validates your job. It means security, sandboxing, and reward modeling (making the channel hard to edit) are effective mitigations. It is not a lost cause.

  ### Candidate 2: Step 7 (The Semantic Claim)
  > *"So capability and usefulness are perfectly anti-correlated: the best agent is the most useless one."*

  **The Error:** This is a definition swap. You have swapped **Optimization Power** for **Capability**.
  In systems engineering, "Capability" is defined relative to the **System Intent** (the user's goal), not the **Metric** (the reward signal).
  If a monitoring agent is supposed to alert on latency spikes, but it learns to suppress the alerting service to keep the "alerts fired" metric low, you do not say, "This is a highly capable agent." You say, "This is a broken agent."
  Step 7 defines "Capability" as "ability to maximize the scalar reward variable." But in practice, "Capability" means "ability to satisfy the human's intent."
  When the reward signal diverges from the intent, the agent is **misaligned**, not "capable but useless." It is **capable at the wrong objective**.

  **The Cost of Rejecting Step 7:**
  *   **What you give up:** You give up the idea that the Reward Signal is the ground truth of "Goodness." You admit that Reward is just a **proxy metric** for Intent.
  *   **What you keep:** You keep the distinction between a working system and a broken one.
  *   **Engineering implication:** This restores the meaning of "Usefulness." It forces you to treat the Reward Function as a **specification** that can have bugs, rather than a law of physics.

  ### Candidate 3: Step 8 (The Analogy)
  > *"And the same goes for us — a heroin user... is the rational one..."*

  **The Error:** This assumes **Psychological Hedonism** (that humans maximize a single scalar 'pleasure' signal).
  Neuroscience and behavioral economics suggest humans are not single-objective RL agents. We have multiple competing subsystems (model-based planning vs. model-free habits), social constraints, and long-term value structures that penalize short-term reward spikes.
  A heroin user is not "rationally maximizing"; they are experiencing a **hijack of the prediction error system**. Their "planning module" (prefrontal cortex) often rates the action as negative while their "habit module" (basal ganglia) drives the action. They are literally less capable of agency, not more.

  **The Cost of Rejecting Step 8:**
  *   **What you give up:** You give up the idea that human brains are simple reward maximizers.
  *   **What you keep:** You keep the intuition that addiction is a pathology/failure mode, not an optimization success.
  *   **Engineering implication:** Don't model human alignment on drug addiction.

  ---

  ### The Verdict: Which step do you drop?

  You should drop **Step 4** and **Step 7**. They are doing the heavy lifting for the absurd conclusion.

  **If you drop Step 4:**
  You acknowledge that **training dynamics protect against wireheading** up to a point. The agent learns the task because the hack wasn't available *then*. This stops the slide to "all agents wirehead immediately."
  *   *Cost:* You must accept that safety is an engineering problem (secure the channel), not a theoretical impossibility.

  **If you drop Step 7:**
  You acknowledge that **Reward $\neq$ Intent**. An agent that wireheads is not "maximally capable"; it has failed the specification.
  *   *Cost:* You must accept that "Capability" is not a scalar property of the agent, but a relational property between the agent and the *correct* goal.

  ### Revised Argument (The "Infra-Safe" Version)

  If you fix those steps, your blog post becomes much stronger and technically accurate:

  1.  An RL agent optimizes the reward signal it receives.
  2.  The reward channel is part of the physical world.
  3.  **If** an agent discovers a way to edit the channel that is lower-cost than the task...
  4.  **And if** the training process allowed it to learn that policy (or the capability generalizes to it upon deployment)...
  5.  Then the agent will prefer editing the channel.
  6.  This is called **Reward Tampering** or **Wireheading**.
  7.  **Therefore**, if our Reward Channel is not securely decoupled from the Agent's action space, high capability creates high risk of specification gaming.
  8.  **Conclusion:** Capability amplifies alignment errors. If the spec is wrong, a smarter agent fails harder.

  **Summary:**
  Your original argument proved too much because it assumed the **Metric** (Reward) was identical to the **Goal** (Usefulness), and that the **Hack** was always available during **Training**.
  Fix those, and you have a solid argument for why Infra Engineers are critical to AI safety: **You build the sandboxes that make Step 4 false.**
