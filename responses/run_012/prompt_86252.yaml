answer: |-
  This is a clean cut. You are asking to separate the health of the *structure* from the health of the *organisms* within it. In ecology, you would call this the difference between standing biomass and species resilience. In history, we often conflate them.

  Here is the case, built to your specifications.

  ### The Case: The Red Clay Basin (Seven Generations)

  **Setting:** A closed alluvial valley surrounded by arid uplands. Pre-industrial, irrigation-dependent maize and bean agriculture.
  **Timeframe:** Seven generations (approx. 175 years).
  **Baseline Sequence (Held Fixed in both versions):**
  *   **G1–G2:** Founding. Small hamlets along the river. Simple diversion weirs.
  *   **G3–G4:** Intensification. Population doubles. A central temple authority coordinates canal digging. Specialization appears (potters, priests, scribes).
  *   **G5–G6:** Peak. Massive monumental construction. Bureaucracy records grain yields. Long-distance trade for obsidian and jade. Population density is at carrying capacity for *irrigated* land.
  *   **G7:** Stability. The system holds. No drought, no invasion, no earthquake. The monuments stand, the grain flows, the records are kept.

  **The Pivot Variable:** *The Legal Status of the Upland Fringe.*
  This is the marginal land surrounding the irrigated core. It is poorer soil, requiring dry-farming or foraging, yielding less per hour but requiring no infrastructure.

  ---

  ### Version 1: The Enclosed Fringe (Variable = ON)
  **Condition:** In Generation 3, the Temple Authority declares the upland fringe "Sacred Reserve." Commoners are legally forbidden to farm or forage there without permission. Permission is rarely granted. All subsistence must occur within the irrigated core.

  **Criterion A (Complexity) Verdict: THRIVING**
  *   **Reasoning:** From G1 to G7, the ceiling of complexity rises monotonically. Settlement hierarchy deepens (Hamlet → Village → Town → Temple City). Occupational specialization increases (farmers become laborers, distinct from administrators). Monumental construction peaks in G5–G6. Record-keeping expands to track the enclosed surplus. There is no drop in the ceiling.
  *   **Conclusion:** The society has not collapsed; it has successfully intensified.

  **Criterion B (Option-Space) Verdict: COLLAPSE**
  *   **Reasoning:** In G1–G2, a household had three feasible strategies: irrigate, dry-farm the fringe, or forage. By G7, the legal enclosure of the fringe removes two strategies. The household has one feasible strategy: work the irrigation canals under Temple oversight. Furthermore, population density in the core makes exit impossible (no empty land elsewhere). The range of feasible ways of living has contracted from three to one. This contraction happened gradually over G3–G7, but it is a permanent reduction in agency.
  *   **Conclusion:** The society has collapsed (in terms of human optionality), even while the temples are being built.

  ---

  ### Version 2: The Open Fringe (Variable = OFF)
  **Condition:** In Generation 3, the Temple Authority claims the core irrigated land but leaves the upland fringe as common land. Any household may retreat to the fringe to dry-farm or forage, though yields are lower.

  **Criterion A (Complexity) Verdict: THRIVING**
  *   **Reasoning:** Identical to Version 1. The Temple still coordinates the canals, the monuments are built, the records are kept. The administrative ceiling is high.
  *   **Conclusion:** The society has not collapsed.

  **Criterion B (Option-Space) Verdict: THRIVING**
  *   **Reasoning:** In G7, a household still has multiple feasible strategies: work the irrigated core for high yield/high tax, or retreat to the fringe for low yield/low tax. If the Temple demands too much labor, the option to leave exists. The range of feasible living strategies remains wide.
  *   **Conclusion:** The society has not collapsed.

  ---

  ### The Accounting

  **1. The Divergence**
  In Version 1, A and B disagree. In Version 2, they agree.
  *   **Criterion A** is blind to the variable. It measures the *capacity of the system to process energy and information*. Whether that processing is voluntary or coerced, whether it allows exit or not, is irrelevant to the complexity count. A slave plantation is high-complexity.
  *   **Criterion B** is sensitive *only* to the variable. It measures the *degrees of freedom available to the agent*. The monumental construction (A's metric) is irrelevant to B unless it consumes the surplus that would have funded alternative lifestyles.

  **2. The Pivot Feature**
  The feature doing the real work is **Asset Specificity enforced by Property Rights.**
  *   In Version 1, human capital becomes specific to the irrigation system. Because the alternative assets (upland fields) are legally removed, the farmers cannot convert their labor into any other subsistence form. They are "locked in."
  *   In Version 2, human capital remains general. Farmers can switch between high-yield/high-cost (irrigation) and low-yield/low-cost (dry-farming) modes.

  **3. Removing the Feature**
  If you remove the legal enclosure (switch to Version 2), the divergence vanishes. Criterion B no longer signals collapse. This proves that the "collapse" diagnosed by B is not an inevitable byproduct of complexity (A), but a specific political choice regarding access to alternatives. The "collapse" is a policy, not a destiny.

  **4. The Counter-Attacks**
  *   **How a Defender of Criterion A attacks Version 1:** They would argue that B is confusing "collapse" with "stratification." They would say: *"The farmers are better off in G7 than G1 because the irrigation system produces a surplus that prevents famine. Their options are narrower, but their floor is higher. You are romanticizing poverty as freedom."* They would attack B for ignoring the security that complexity provides.
  *   **How a Defender of Criterion B attacks Version 1:** They would argue that A is confusing "stability" with "fragility." They would say: *"The system looks stable only because you have removed the escape valves. When the canal silts or the drought comes (and it will), the Version 1 society starves because they have no fallback. The Version 2 society shrinks but survives. A is measuring the size of the cage, not the health of the animal."* They would attack A for ignoring systemic risk.

  ---

  ### The Position

  You asked for a definite answer. If what you care about is **whether people were better off**, you must use **Criterion B (Option-Space).**

  Here is the defense against the obvious objection.

  **The Objection:** Criterion A tracks something real: *Collective Security.* A complex society (Version 1) can support more people at a higher caloric baseline than a simple one. It builds flood defenses, stores grain, and supports specialists who cure disease. By prioritizing Option-Space, Criterion B risks privileging the freedom to starve over the security of the dole. Isn't a well-fed serf better off than a free forager living hand-to-mouth?

  **The Defense:**
  This objection confuses *average surplus* with *individual resilience*.

  As an ecologist, you know that a monoculture pine plantation has higher biomass (Complexity) than a mixed old-growth forest. It grows faster, stores more carbon, and looks "healthier" from the air. But it is one pest away from total system failure. The organisms within it (the trees) have zero option-space. If the environment shifts, they die.

  Criterion A measures the biomass. Criterion B measures the resilience of the organisms.

  In the Red Clay Basin Version 1, the "well-fed serf" is an artifact of the current generation's good weather. Because the option-space has collapsed, that serf has no buffer against the next generation's drought. The complexity *creates* the dependency that makes the eventual crash catastrophic. The "collapse" that B identifies in G7 is not the crash itself; it is the *preparation* for the crash. It identifies the moment the society became brittle.

  If we define "better off" as "more likely to survive and adapt to change," then Option-Space is the only metric that matters. Complexity is merely a tool that *can* expand option-space (by creating surplus) but just as often contracts it (by creating dependency). Criterion A cannot distinguish between these two states; it applauds the tool regardless of how it is used. Criterion B distinguishes between a tool that serves the user and a user who serves the tool.

  You spent thirty years watching dead trees turn out to be the point. Criterion A sees the standing timber and calls it success. Criterion B sees the nutrient cycle and the regeneration potential. In history, as in the forest, the standing timber is temporary. The capacity to regenerate is the only thing that isn't. Use Criterion B.
