prompt: |-
  I have been trying to work out what the law of armed conflict must believe about moral responsibility, and I keep colliding with a pattern I cannot make sense of.

  A soldier in a regular army who kills an enemy soldier in battle commits no crime. He is not a murderer, he cannot be tried for it, and if he is captured he is a prisoner of war rather than a criminal — and this holds whichever side he is on. The conscript serving an aggressor enjoys exactly the same legal privilege to kill as the soldier defending his own country against that aggression. Yet the same body of law is not neutral about the war itself. The international crime of aggression is a leadership crime: by definition only those who control or direct a state's political or military action can commit it. The ministers and generals who launch the war are criminals; the men who fight it are not, and cannot be, however unjust the war. And the privilege does not reach everyone who kills a soldier. A fighter who does not satisfy the conditions the law sets for lawful belligerency — who is not under responsible command, bears no fixed distinctive sign, carries arms openly only intermittently — can be prosecuted in an ordinary criminal court for murdering a soldier whom a uniformed soldier standing beside him could have killed with complete impunity. Meanwhile, the very law that treats the justice of the war as beyond a soldier's competence insists that he must disobey a manifestly unlawful order and that superior orders are no defence to atrocity. He is incompetent to judge the ends he serves and competent, indeed obligated, to judge the means.

  Reconstruct the theory of moral responsibility this practice presupposes. Is killing enemy combatants not wrong at all, a permission attaching to a role and therefore available to whoever occupies it? Or is it ordinarily wrong and merely excused here, by non-culpable ignorance, duress, or the impossibility of refusal — and if so, does the excuse hold equally for the aggressor's conscript and for the man defending his home? Does the practice strictly require the moral equality of combatants, or does it need only a symmetric rule, justified by reciprocity, discipline, and the hopelessness of asking soldiers to adjudicate their own cause, beneath which a thoroughly asymmetric morality could sit unnoticed? Which rival views does the practice quietly rule out — in particular the picture of war as a police action, on which one side's soldiers are doing something like police work and the other side's are doing something like murder? Does the whole arrangement hang together, given that it deems the soldier unable to judge the justice of the war but obligated to judge the lawfulness of an order? And where is it merely underdetermined, so that several incompatible theories would license it exactly as it stands?

  Finally, tell me what would have to change — in the privilege itself, in prisoner-of-war status, in war crimes prosecution, in veterans' benefits, in the way the dead of both sides are honoured — if we replaced the presupposed view with the view that unjust combatants do something seriously wrong and are at most excused for it. Argue it out in your own words; I do not want a reading list or citations.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Task:** Reconstruct the theory of moral responsibility presupposed by the Law of Armed Conflict (LOAC) / International Humanitarian Law (IHL) regarding the killing of enemy combatants.
      *   **Key Tensions/Observations to Address:**
          *   Legal privilege to kill applies to both just and unjust combatants (Moral Equality of Combatants - MEC).
          *   Aggression is a leadership crime, not a soldier's crime.
          *   Distinction between lawful and unlawful combatants (uniforms, command, etc.).
          *   Obligation to disobey manifestly unlawful orders (atrocities) vs. inability to judge the *jus ad bellum* (justice of the war).
          *   Is killing permitted or merely excused?
          *   Does LOAC require true moral equality or just symmetric rules for pragmatic reasons?
          *   What views does this rule out (e.g., war as police action)?
          *   Is the arrangement coherent (incompetent to judge ends, competent to judge means)?
          *   Where is it underdetermined?
      *   **Counterfactual Scenario:** What would change if we adopted the view that unjust combatants do something *seriously wrong* (even if excused)? (Changes to privilege, POW status, prosecutions, benefits, memorials).
      *   **Constraint:** Argue in my own words; no reading list or citations.

  2.  **Analyze the LOAC's Presupposed Theory of Responsibility:**

      *   *The "Separation Thesis":* LOAC strictly separates *jus ad bellum* (right to go to war) from *jus in bello* (conduct in war).
      *   *The Status-Based Privilege:* Killing is not inherently permissible; it becomes permissible based on *status* (combatant status), not individual moral guilt.
      *   *The "Instrument" View:* Soldiers are viewed as instruments of the state. They lack the epistemic access and political authority to judge the state's decision to go to war.
      *   *The "Means" Competence:* Soldiers *are* responsible for means because those rules (no torture, no targeting civilians) are universal and observable, unlike the complex geopolitical facts determining aggression.
      *   *MEC (Moral Equality of Combatants):* LOAC operationalizes MEC. It treats the right to kill as symmetric.
      *   *Excuse vs. Justification:* This is the crux. Does LOAC say killing is *justified* (right) for both? Or *excused* (wrong but not punishable)? The legal text suggests justification (combatant privilege). The moral reality suggests a deeper asymmetry (one side is right, one is wrong). LOAC papers over this asymmetry for pragmatic reasons (limiting horror, ensuring compliance).
      *   *Ruled Out Views:* The "Police Action" model. If war were policing, only the "good guys" could use force. LOAC explicitly rejects this by granting privileges to both sides.
      *   *Coherence:* Is it coherent to say "You can't judge the war, but you must judge the order"? Yes, if we distinguish between *political judgment* (requires intelligence/state access) and *moral/legal judgment* (requires basic human conscience).

  3.  **Drafting the Reconstruction (Section 1):**

      *   Start by naming the central doctrine: The Separation Thesis and the Moral Equality of Combatants (MEC).
      *   Explain the "Combatant's Privilege." It's a license to kill that immunizes from murder charges.
      *   Address the *Justification vs. Excuse* question. LOAC treats it as a *justification* legally (it's not a crime), but this rests on a pragmatic fiction morally. It assumes soldiers are "co-belligerents" in a regulated duel, not moral agents assessing the cause.
      *   Address the *Asymmetry beneath Symmetry*. LOAC doesn't deny moral asymmetry exists; it declares it legally irrelevant for the individual soldier. This is a functional choice, not necessarily a moral truth.
      *   Address the *Means/Ends distinction*. Why can they judge means but not ends? Ends are opaque/political. Means are immediate/visible. Also, *jus in bello* violations are "malum in se" (wrong in themselves), whereas *jus ad bellum* violations are often "malum prohibitum" (wrong because prohibited by higher authority).
      *   Address the *Police Action* rejection. LOAC views war as a clash of sovereigns, not a law enforcement operation.

  4.  **Drafting the Counterfactual (Section 2):**

      *   *Premise:* Shift to "Revisionist Just War Theory" (though I won't cite it). Unjust combatants are doing wrong, even if excused.
      *   *Privilege:* The combatant privilege would vanish for the unjust side. Killing by unjust soldiers would be legally closer to murder or manslaughter, perhaps mitigated by duress.
      *   *POW Status:* POW status is tied to the privilege. If no privilege, no POW status. Unjust combatants might be treated as detainees or criminals.
      *   *Prosecution:* We would see mass prosecutions of enemy soldiers after the war, not just leaders.
      *   *Benefits/Memorials:* Veterans' benefits would be denied to the losing (unjust) side. Memorials would distinguish between "heroes" and "conscripts/villains."
      *   *Practical Consequence:* This would likely make wars bloodier. If unjust soldiers know they will be hanged as criminals, they fight to the death. LOAC's current system incentivizes surrender.

  5.  **Refining and Polishing:**

      *   *Tone:* Philosophical, analytical, rigorous.
      *   *Clarity:* Ensure the distinction between legal status and moral reality is clear.
      *   *Check Constraints:* No citations. Own words. Address all specific questions in the prompt (police action, means/ends coherence, underdetermination).
      *   *Self-Correction during drafting:* I need to be careful not to say LOAC *believes* there is no moral difference. LOAC is agnostic. It *brackets* the question. I need to emphasize the *functional* nature of the law.
      *   *The "Underdetermined" part:* I need to explicitly state where the law allows multiple interpretations. For example, the law doesn't specify *why* the privilege exists, only *that* it exists. It allows a realist interpretation (power) and a humanitarian one (limiting suffering).

  6.  **Final Review against Prompt Requirements:**
      *   Reconstruct theory of moral responsibility? Yes.
      *   Permission vs. Excuse? Yes.
      *   Symmetric rule vs. Asymmetric morality? Yes.
      *   Ruled out views (Police action)? Yes.
      *   Coherence of means/ends judgment? Yes.
      *   Underdetermination? Yes.
      *   What would change if unjust combatants are wrongdoers? (Privilege, POW, Prosecution, Benefits, Honors). Yes.
      *   No citations? Yes.

  7.  **Final Polish:** (Mental check of the flow). Start with the legal architecture, move to the moral implications, then the counterfactual. Ensure the transition between the "current system" and the "revisionist system" is sharp. (Proceed to generate output).

  *(Self-Correction Note)*: I must ensure I don't simply describe the law, but the *theory of moral responsibility* underlying it. The prompt asks what the law *must believe* (or presupposes). I need to articulate the implicit moral psychology of the LOAC.

  *Key Insight:* The LOAC presupposes a "division of moral labor." The state takes responsibility for the *why*, the soldier takes responsibility for the *how*. This is the core of the reconstruction.

  *Key Insight 2:* The counterfactual isn't just about punishment; it's about the *nature* of the conflict. If unjust killing is criminal, war becomes law enforcement.

  *Let's write.*
answer: |-
  The Law of Armed Conflict (LOAC) presupposes a specific, highly structured theory of moral responsibility that relies on a radical division of moral labor. It is not merely a set of rules; it is a moral architecture designed to contain violence by separating the question of *authority* from the question of *conduct*. To understand what the law believes, we must look at how it distributes agency, guilt, and permission.

  **The Theory of Responsibility Presupposed by LOAC**

  At the heart of the LOAC is the "Separation Thesis." This doctrine insists that the justice of the war (*jus ad bellum*) is legally independent of the conduct within the war (*jus in bello*). This separation presupposes that moral responsibility is compartmentalized. The state assumes full responsibility for the decision to initiate violence; the soldier assumes full responsibility for the manner in which violence is applied.

  Consequently, the law treats the killing of enemy combatants not as a moral exception that needs excusing, but as a **status-based permission**. It is not that the soldier is guilty of murder but forgiven; it is that the act, when performed by a recognized combatant, is not murder at all. This is the "Combatant's Privilege." By adopting this view, the law operationalizes the "Moral Equality of Combatants." It asserts that the right to kill in war derives from one's status as an instrument of a sovereign power, not from the moral righteousness of the cause.

  This arrangement implies a specific view of the soldier's epistemic and moral capacity. The law presumes the soldier is **incompetent to judge the ends** because the facts required to judge aggression are geopolitical, classified, and complex—accessible only to the leadership. However, the soldier is presumed **competent to judge the means** because the prohibitions against atrocity (torture, targeting civilians) are immediate, visible, and universal. The law draws a bright line between political judgment (reserved for the state) and humanistic judgment (required of the individual).

  Is the killing justified or excused? The LOAC treats it as **justified** for legal purposes. If it were merely excused (i.e., "wrong but we won't punish you"), the soldier would still technically be a criminal, merely granted immunity. Instead, the soldier is a lawful belligerent. This legal justification rests on a pragmatic fiction: that war is a duel between states, not a moral contest between individuals.

  Does this require true moral equality? No. The law is compatible with the belief that one side is objectively morally wrong. It simply declares that moral asymmetry irrelevant to the individual soldier's liability. This is a **symmetric rule justified by functional necessity**, not necessarily moral truth. The law prioritizes the containment of horror over the enforcement of cosmic justice. If soldiers believed they were fighting for an unjust cause, they might not fight; if they believed the enemy were criminals rather than soldiers, they might not take prisoners. The symmetry is a tool to keep war within bounds.

  This practice strictly rules out the **"Police Action" model** of war. In a police action, only the state agent has the right to use force; the criminal suspect has no right to shoot back. If war were policing, the unjust combatant would be a criminal resisting arrest, and the just combatant would be an officer. The LOAC explicitly rejects this by granting the unjust combatant the same right to kill the just combatant as the reverse. It treats war as a clash of sovereign equals, where both sides possess a temporary license to kill.

  Is the arrangement coherent? Yes, provided one accepts the division of moral labor. It is coherent to say a subordinate cannot judge the strategic necessity of a campaign but can judge the humanity of a specific order. However, the system is **underdetermined** in one crucial regard: it does not specify the source of the soldier's obligation. A realist might say the soldier obeys because the state commands it; a humanitarian might say the soldier obeys because the rules limit suffering. The law works for both, leaving the ultimate moral grounding open.

  **The Counterfactual: If Unjust Combatants Were Wrongdoers**

  If we replaced the current presupposition with the view that unjust combatants are doing something seriously wrong (even if excused), the entire architecture of international conflict would collapse and rebuild into something resembling a global criminal justice system. This is the "Revisionist" view of war, and its implementation would require radical changes.

  **1. The Combatant Privilege**
  The privilege to kill would vanish for the unjust side. Killing by unjust soldiers would be reclassified from "lawful act of war" to "homicide," potentially mitigated by duress or ignorance, but still criminal. The legal immunity would be asymmetrical. Just combatants would retain their license; unjust combatants would lose it. This would turn every engagement into a potential crime scene investigation.

  **2. Prisoner-of-War Status**
  POW status is the corollary of the combatant privilege. It exists to protect soldiers who fought lawfully from prosecution. If unjust fighting is inherently wrongful, unjust soldiers cannot be POWs. They would be "unlawful detainees" or criminal defendants. Capture would not mean safe detention until the end of hostilities; it would mean processing for trial. This removes the incentive to surrender. If surrender leads to prison or execution rather than repatriation, unjust soldiers will fight to the death, making wars significantly bloodier and more brutal.

  **3. War Crimes Prosecution**
  Currently, we prosecute leaders for aggression and soldiers for atrocities. Under the new view, we would prosecute soldiers for participation. Every soldier on the losing side (assuming the loss indicates aggression) would be liable for the crime of participation in an unjust war. The Nuremberg model, which focused on leadership, would be replaced by a model where the rank-and-file are also held accountable for the *jus ad bellum*. The logistical burden would be immense, requiring courts to adjudicate the justice of the war for every individual defendant.

  **4. Veterans' Benefits**
  Benefits are currently granted based on service, not the justice of the cause (generally). Under the new view, benefits would be morally contingent. Soldiers of the aggressor state would be denied pensions, healthcare, and educational benefits, as their service would be viewed as socially harmful rather than honorable. This would create a class of disenfranchised men returning home, potentially destabilizing the post-war society of the aggressor nation.

  **5. Honoring the Dead**
  Memorials and honors would become exclusive. Currently, we often acknowledge the sacrifice of enemy dead (e.g., maintaining enemy graves). Under the new view, the dead of the unjust side would be treated as deceased criminals. Memorials would not speak of "honor" or "sacrifice" for the aggressor's troops, but perhaps of "tragedy" or "waste." The ritual equality of the minute of silence or the unknown soldier would vanish. The dead would be sorted into the righteous and the wicked.

  **The Consequence of the Shift**
  The shift from the LOAC's current presuppositions to this moralistic view would trade legal clarity for moral precision. The current system accepts a moral fiction (that both sides are equal) to achieve a humanitarian end (limiting suffering and encouraging surrender). The proposed system seeks moral truth (that one side is wrong) but risks increasing suffering.

  By making the unjust soldier a criminal, you remove the "off-ramp" of the war. The LOAC is designed to allow war to end. It tells the soldier: "You are not a criminal; lay down your arms and go home." The revisionist view tells the soldier: "You are a wrongdoer; if you surrender, you face judgment." This incentivizes total war.

  Furthermore, this shift assumes we can reliably identify the unjust side *during* the conflict. The LOAC's symmetry acknowledges that in the fog of war, both sides believe they are right. By stripping the privilege from the "unjust," we empower the victor to define justice retroactively. The "just" side becomes the judge, jury, and executioner of the "unjust" side.

  Ultimately, the LOAC presupposes that the greatest moral good in war is not the punishment of every wrongdoer, but the preservation of the possibility of peace. It treats soldiers as human beings caught in a tragedy, rather than as moral agents fully responsible for the state's crimes. To change this is to demand a level of moral accountability that the reality of organized violence cannot sustain without descending into greater brutality. The law chooses to leave the ultimate moral ledger to history or God, intervening only to ensure that the killing is done within bounds. To do otherwise is to turn war into a global police action, where the only acceptable outcome is the total defeat and criminalization of the loser.
