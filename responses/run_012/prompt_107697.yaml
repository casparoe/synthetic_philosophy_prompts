  Dear Student

  Your intuition is spot on, and you are right to be suspicious of the bumper-sticker version of Goodhart's Law. The problem with the one-liner is that it treats all targets as inherently corrupting, whereas your list shows that targeting sometimes drives genuine improvement. The principle you are looking for needs to distinguish between improving the underlying reality and merely polishing the mirror that reflects it. I propose we call this the Decoupling Principle. It states that gaming occurs when an agent exploits the distinction between a metric and the underlying construct it is intended to proxy, raising the metric through actions that do not contribute to, or actively undermine, the construct. This principle relies on three specific clauses, each forced by a different cluster of cases from your list, and it requires us to be very precise about what we mean by the thing the number is standing in for.

  The first clause is that there must be a gap between the metric and the construct. This is forced by your sprinter case. When a sprinter targets a faster time, the metric is the goal; there is no proxy involved, so there is no gap to exploit. The Decoupling Principle predicts that whenever the metric is identical to the construct, gaming is logically impossible, which saves your verdict that the sprinter is not gaming. The second clause is that the agent must have knowledge of the metric. This is forced by your secret measure case. If the people being measured do not know what is being counted, they cannot strategically alter their behaviour to inflate the count. The principle predicts that secrecy prevents gaming not because the measure is better, but because the feedback loop required for exploitation is broken. This aligns with your instinct that the number stays honest under secrecy, though it suggests the honesty is fragile and dependent on information control rather than metric design.

  The third and most critical clause is that the metric must rise while the construct remains flat or declines. This is the engine that separates your warehouse pickers. When the picker finds a better route, both the metric and the construct of efficiency rise together, so it is not gaming. When the picker slings parcels badly, the metric rises but the construct of useful throughput falls, so it is gaming. This clause also handles your sales teams and the A&E department; in the gaming scenarios, the revenue or wait times are manipulated temporally or procedurally without genuine growth in business health or patient care. However, this clause forces us to adjust two of your verdicts slightly, specifically regarding the surgeon and the lines of code. In the surgeon case, you noted that the number and the thing both move. For the principle to hold, we must define the construct not as the success rate of operated patients, but as the health outcomes of the population needing surgery. If the surgeon turns away risky cases, the metric rises but the construct of population health declines. You were right to feel it was the worst kind of gaming, but the principle requires you to admit that the thing the number was standing in for did not actually improve. Similarly, for the lines of code, you suggested the number never stood for anything real. The principle argues that it was standing in for productivity, however poorly. If verbose code increases lines but decreases maintainability, the metric rises and the construct falls, so it is gaming. You do not need to change your verdict, but you must accept that there was an implied construct that was violated.

  This leaves us with your dashboard case, which the principle treats as an empirical question rather than a philosophical one. If the numbers creep up because people are entering data more diligently without actual performance changes, the metric is decoupled from the construct and it is gaming. If the numbers creep up because the act of being watched motivates genuine effort, known as the Hawthorne effect, then the construct is rising with the metric and it is not gaming. The principle cannot save you from having to investigate the reality behind the dashboard, which is perhaps its most honest feature. It predicts that without knowing whether the underlying value increased, you cannot classify the behaviour. Ultimately, the Decoupling Principle suggests that the politics of measurement lies not in the targeting itself, but in the power to define the construct. If you control the definition of what counts as real value, you can decide whether a rise in the numbers is success or gaming. This fits your gut feeling that some targeting is fine and some is not, but it places the burden on you to argue for the validity of the construct rather than just the integrity of the measure. I hope this gives you something solid to argue with in your seminar.

  Best wishes

  Your Tutor
