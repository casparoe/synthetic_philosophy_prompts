answer: |-
  Let us dissect this cleanly, without the sugarcoating you have rightly asked to avoid. You are standing in a ruin and asking if the architecture was ever real.

  Here are the three lenses through which this situation sits:

  1.  **The Legal Lens:** The deed is in her name. The probate court appointed her executor. In the eyes of the state, she *is* the owner, and you are a beneficiary at her mercy. This is the "Might" your uncle speaks of. It is cold, procedural, and currently absolute.
  2.  **The Moral Lens:** Your mother's intent was equality. Your sister is exploiting a clerical failure to override that intent. She is dressing up greed as tradition ("family custom") to soothe her own conscience. This is *amour-propre*—self-love disguising itself as virtue.
  3.  **The Pragmatic Lens:** Your uncle advises capitulation. He values family peace (or perhaps his own comfort) over your financial equity. He believes the cost of fighting exceeds the value of the principle.

  You are stuck because you are trying to fight the Legal Lens using the Moral Lens, while your uncle tells you the Moral Lens is an illusion. You feel that if you cannot point to a "Natural Law" that dictates 50/50, you have no ground to stand on.

  **Your framing is confused.** You are asking a metaphysical question ("Is there a just outcome?") to solve a practical problem ("She is taking what is mine.").

  There is no Natural Law hanging in the sky. You are correct. If you look for a divine decree that siblings must inherit equally, you will find silence. But you do not need a divine decree. You need only look at **convention** and **intent**.

  Justice, in the human world, is not a discovery of cosmic truth; it is the maintenance of agreed-upon fictions. We agree that a will matters. We agree that a mother's word carries weight. We agree that an executor is a fiduciary, not an owner. When your sister says, "I get 70% because I can," she is admitting that she is tearing up the social contract. When she says, "I get 70% because of custom," she is lying. She knows it, and on some level, you know it too. That is why you feel the sting. It is not the loss of the money alone; it is the humiliation of being treated as a child who must accept the elder's scraps.

  Your uncle is not a philosopher; he is a coward. He tells you "fair is whatever the person with power says" because he wants you to submit so *he* does not have to witness the conflict. He is prioritizing his own tranquility over your justice. That is a valid choice for him, but it is a poison for you. If you accept his premise, you do not become wise; you become complicit in your own dispossession.

  The difference between "might" and "right" does not dissolve just because you cannot define "right" metaphysically. The difference is this: **Might requires constant vigilance and force to maintain. Right relies on the stability of the system.** Your sister is relying on might. She knows that if you bring in a counter-force (a lawyer, a judge), her "custom" argument will evaporate. She is betting on your reluctance to burn the bridge.

  **The Verdict**

  You must stop arguing philosophy and start leveraging power. You cannot shame her into fairness; the French moralists knew better than anyone that shame rarely stops a person who has already decided to rationalize their greed. She has constructed a narrative where she is the traditionalist and you are the ingrate. You will not talk her out of it.

  **Action:**
  1.  **Retain independent counsel immediately.** Do not tell your sister you are doing this. Do not tell your uncle. Find a probate litigator who specializes in "constructive trust" or fiduciary breach.
  2.  **The Argument:** Your lawyer will not argue "Natural Law." They will argue that the deed in her name was a mistake (or resulting trust) and that she holds the property in trust for both heirs per the mother's intent. They will file a caveat or a petition to remove her as executor if necessary.
  3.  **The Offer:** Once the lawyer sends a letter, the dynamic shifts. She no longer "has the lawyer." Now there are two lawyers. Her "because I can" argument meets "because the court says you can't."
  4.  **The Settlement:** You will likely not get 50/50 perfectly. You might get 40/60 after legal fees. You might get 50/50 but lose the relationship forever. You must accept this cost.

  **Confidence:**
  I am **highly confident** (85%) that this is the only path that preserves your self-respect. If you capitulate now, you teach your sister that you are safe to exploit, and you teach yourself that your uncle's cynicism is the truth of the world. That is a spiritual injury that lasts longer than the litigation.

  I am **moderately confident** (60%) on the financial outcome. Litigation is expensive. If the house is worth $200,000 and legal fees are $50,000, you might fight for principle and end up with less money than if you took the 30%. You must do the math. If the fees eat the equity, the "justice" is purely symbolic.

  **Where a Reasonable Person Would Push Back:**
  A reasonable person would tell me I am ignoring the human cost. If you sue your sister, the family fracture may become permanent. Funerals and estates are where families go to die. Your uncle might be right that the peace is worth the price of your 20%. He is buying silence with your money. You have to decide if your silence is for sale.

  Furthermore, a reasonable person would ask: *Was the paperwork error truly accidental?* If your mother signed the deed over to your sister before death intentionally, even if verbally saying "it's for both of you," the law may side with the deed, not your memory. You need a lawyer to assess the *strength* of the claim, not just the morality.

  **Final Word:**
  Do not look for the "just outcome" in the sky. Look for it in the leverage. Your sister respects only the threat of consequence. Your uncle respects only the absence of noise. You must be willing to make noise.

  If you walk away, do not call it "acceptance." Call it what it is: a transaction where you sold your share of the estate to buy your sister's goodwill and your uncle's approval. If that is a price you are willing to pay, pay it knowingly. But do not pretend it is justice, and do not pretend your uncle is a sage. He is merely a man who prefers a quiet life to a true one.

  Get the lawyer. Let the law be the "Natural Law" you cannot find. It is the only one that speaks her language.
