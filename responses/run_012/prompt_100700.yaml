          *   **Goal:** A real answer, not a polite one.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Uncle's Position:* Realpolitik / Thrasymachean view. Justice is the interest of the stronger. If you can't prove an objective moral truth, power dictates reality.
      *   *The User's Block:* If I can't point to a "Natural Law" that says 50/50, am I just whining about power dynamics?
      *   *The Flaw in the Uncle's Logic:* It conflates *ontological* uncertainty (I can't prove 50/50 is divinely ordained) with *pragmatic/social* reality (contracts, laws, expectations).
      *   *The Flaw in the User's Logic:* They are looking for a metaphysical guarantee of justice before acting. They want permission to feel wronged based on an abstract rule, rather than based on the breach of trust/expectation.
      *   *The French Moralist Angle:* Humans are driven by *amour-propre* (self-love/pride). We dress up power grabs in the language of virtue ("family custom"). The sister knows she's being predatory; the uncle knows he's enabling it to keep peace. The user is suffering because they want the world to be rational when it is driven by passion and interest.

  3.  **Drafting - Section by Section:**

      *   **Introduction (Setting the Stage):** Acknowledge the gravity. Lay out the lenses: Legal, Moral/Philosophical, and Pragmatic. Avoid the "stand up for yourself" cliché immediately.
      *   **Critiquing the Framing:** The user is asking, "Is there a difference between might and right if I can't define right?" This is the wrong question. The question isn't about cosmic justice; it's about *conventions* and *betrayal*. The uncle is right that there is no "Natural Law" in the sky, but wrong that this means power is the *only* valid currency.
      *   **The "Custom" Lie:** Address the sister's excuse. "Family custom" is a mask for *amour-propre*. It's a fabrication to soothe her conscience. The uncle knows this but prefers peace over truth.
      *   **The "Can't Name the Just Outcome" Problem:** You don't need a treatise to know a breach of contract occurred. The will (verbal or implied) was equal share. The legal paperwork error does not negate the moral intent. The sister is exploiting an error, not enforcing a right.
