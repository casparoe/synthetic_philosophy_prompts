      *   **Confidence & Pushback:** Be honest about the costs (financial, relational).

  4.  **Refining the Tone (French Moralists):**
      *   *Keywords/Concepts:* *Amour-propre*, self-deception, vanity, the fragility of conventions, the mask of virtue.
      *   *Style:* Aphoristic, sharp, slightly cynical but ultimately humane. Not academic, but deeply thoughtful. Avoid modern therapy speak.
      *   *Reference Points:* Think La Rochefoucauld on how we disguise our interests as virtues. Think Pascal on the weakness of man without recourse. Think Montaigne on the variability of custom.
      *   *Key Insight:* The uncle is not a philosopher; he is a coward. The sister is not a traditionalist; she is a thief using tradition as a cloak.

  5.  **Drafting the Content (Iterative Process):**

      *   *Opening:* You are stuck in a metaphysical trap. You think because you can't prove "Justice" with a capital J, you have no ground to stand on.
