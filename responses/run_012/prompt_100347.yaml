answer: |-
  **TO:** All Residents, Sunnybrook Meadows
  **FROM:** Board of Directors
  **SUBJECT:** Implementation of Metric-Based Governance Protocol

  Per Resolution 2024-09, Sunnybrook Meadows is transitioning to a metric-based decision framework. This FAQ addresses operational changes effective immediately.

  **Q: How are policies selected?**
  A: Residents vote solely on the definition of the Neighborhood Welfare Index (NWI). Once the NWI is set, accredited traders determine policy. Markets will open on conditional outcomes (e.g., "NWI score if Leaf Blowers are Banned" vs. "NWI score if Leaf Blowers are Unrestricted"). The policy with the highest projected NWI score is automatically enacted. Voting on specific policies is discontinued.

  **Q: Why would I trade against a policy I support?**
  A: Rational positioning requires separating preference from probability. If you support the Leaf Blower Ban but believe enforcement costs will lower the NWI, you should short the "Ban" market. Profit is generated by accurate prediction, not policy preference. You may win the market and lose the quiet. This ensures capital is aligned with reality, not desire. Hedging against your own neighborhood is encouraged to stabilize prices.

  **Q: Can large positions skew results?**
  A: Capital deployment is considered information. In thin markets, significant liquidity positions establish price discovery. If a single resident holds sufficient capital to move the "Pool Maintenance" market, their valuation becomes the community valuation. The Board does not intervene in market depth or liquidity concentration. We assume the wealthiest resident has the most accurate data regarding property values.

  **Q: How is the NWI calculated?**
  A: The Index collapses complex community welfare into a single numerical value quarterly. Residents voted to weight Property Values at 60% and Noise Complaints at 40%. If the market determines a policy increases Property Values but destroys community cohesion, the NWI may still rise. The number is binding. Subjective dissatisfaction does not override the resolved index. We acknowledge that a neighborhood can become financially optimal while becoming unlivable. This is a known variance.

  **Q: What if the market resolves incorrectly?**
  A: The market defines correctness. If the market predicts a policy will fail to improve the NWI, that policy is treated as detrimental, regardless of subsequent lived experience. Future markets will adjust for past errors, but past policies remain enacted.

  **Q: What is the status of the community pool?**
  A: The "Fill vs. Maintain" market is currently pending liquidity. Until sufficient volume is reached, the pool remains closed.

  We appreciate your participation in liquidity pools. Remit trading fees to the management office.

