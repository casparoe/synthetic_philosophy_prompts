answer: |-
  1. **Shared Premises and the Specific Allocation Problem**
  We agree that economic efficiency requires allocating scarce resources to their highest-valued uses without systematic waste. We agree that any viable system must handle both static coordination (matching existing supply to existing demand) and dynamic adaptation (responding to shocks and new information). To test our theories, we anchor this statement on a single concrete problem: the monthly allocation of 100,000 units of "Chip X," a specialized processor where demand shifts unpredictably between automotive, medical, and defense sectors. We agree that success is measured by minimizing two metrics over a 12-month period: (a) the volume of unmet orders in high-value sectors (shortages) and (b) the volume of unused inventory in low-value sectors (surpluses). We further agree that if empirical data showed one institutional arrangement consistently producing lower waste on these metrics under identical shock conditions, the losing side would acknowledge a significant theoretical deficit.

  2. **The Precise Points of Disagreement**
  Our disagreement centers on the necessity of private property titles for generating valid economic signals. The Austrian member holds that genuine prices emerge only from the exchange of owned assets, where the owner bears the residual risk of loss; without this, numerical values are merely accounting fiction that cannot guide rational calculation. The Lange member holds that property titles are legal formalities distinct from economic function; a Central Planning Board (CPB) can set prices as parameters based on scarcity indices, and managers can follow rules (minimize cost, equate marginal cost to price) to achieve efficiency without private ownership of the means of production. The Austrian insists the CPB lacks the knowledge to set even initial parameters correctly; the Lange socialist insists the CPB can discover correct parameters through iterative trial and error faster than the market clears through bankruptcy.

  3. **Crux One: The Speed and Cost of Iteration**
  The first sub-question is whether a CPB can adjust prices fast enough to prevent permanent waste during demand shocks. The concrete case is a sudden, unanticipated 30% spike in medical demand for Chip X in Month 3, unrelated to price changes. The Austrian predicts that under the Lange arrangement, the CPB will observe the shortage only after the production cycle closes, leading to a lag of at least two quarters before prices adjust sufficiently to ration demand and signal supply expansion; during this lag, medical projects stall while automotive stocks accumulate. The Lange member predicts that under the Lange arrangement, the CPB monitors inventory levels weekly and adjusts prices within the month, clearing the shortage in under 45 days with negligible project stalls, whereas the Market arrangement may overshoot due to speculative hoarding, creating a price bubble that lasts longer than the physical shortage.

  4. **Crux Two: The Incentive to Discover New Uses**
  The second sub-question is who identifies and funds the deployment of Chip X into novel, unplanned applications. The concrete case is a startup in Month 6 discovering Chip X can optimize agricultural drone swarms, a use not foreseen by existing sector plans. The Austrian predicts that under the Market arrangement, an entrepreneur will bid up the price of Chip X to secure units for drones, pulling resources from lower-valued automotive uses immediately based on expected profit; under the Lange arrangement, the startup must petition the CPB for allocation, and the CPB will reject the request because the drones do not fit the existing quarterly plan, delaying the innovation until the next planning cycle. The Lange member predicts that under the Lange arrangement, managers are rewarded for proposing efficiency gains to the CPB, so the factory manager will flag the drone potential directly to the board for immediate reallocation, whereas the Market arrangement may block the startup due to capital constraints or monopolistic withholding by incumbent chip holders.

  5. **Verbal Disputes and Final Predictive Commitments**
  We identify one partially verbal dispute: the definition of "price." The Austrian defines price strictly as an exchange ratio of property titles; the Lange member defines price functionally as any scalar used to equate supply and demand. We agree this is not *merely* verbal because it implies different mechanisms for generating the number, but we acknowledge that if the Lange scalar produces identical allocation outcomes to the market price, the functional disagreement collapses. To settle the substantive debate, we commit to the following ex-ante predictions for the 12-month Chip X trial: The Austrian predicts the Lange arrangement will accumulate >15% average inventory surplus and >20% unmet demand during shock months due to lag. The Lange member predicts the Market arrangement will exhibit >25% price volatility without corresponding supply changes and will fail to allocate >10% of chips to the highest-value use due to capital barriers. We agree to measure actual inventory backlogs and unmet order volumes monthly to adjudicate these claims.
