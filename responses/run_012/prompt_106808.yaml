answer: |-
  **Project Title:** The Tripartite Ambiguity of Heritability: Variance, Intervention, and Transmission

  **Project Summary**
  This project investigates the conceptual structure of "heritability" in behavioral genetics. While heritability coefficients are standardly reported as single metrics, this project argues that the term is currently asked to perform three distinct conceptual jobs: describing variance ratios within a population, predicting outcomes under intervention, and characterizing intergenerational transmission. I hypothesize that persistent disputes regarding the heritability of traits such as height, educational attainment, and psychiatric conditions arise from conflating these three roles. Specifically, I will examine the gap between interventionist claims and transmission claims, and analyze how the selection of the "range of environments" parameter introduces hidden normative judgments into ostensibly empirical estimates. Over six months, I will produce a conceptual taxonomy and a series of worked case studies demonstrating that fixing these distinctions resolves apparent empirical disagreements.

  **Central Research Question**
  Standard quantitative genetics treats narrow-sense heritability ($h^2$) as a unified statistic describing the proportion of phenotypic variance attributable to additive genetic variance. However, in scientific practice and public discourse, this statistic is used to support three distinct types of inference. The central question of this proposal is: **To what extent does distinguishing between heritability-as-variance, heritability-as-intervention, and heritability-as-transmission resolve apparent empirical disputes in behavioral genetics, and does the selection of the "range of environments" parameter constitute a normative rather than purely empirical choice?**

  This question admits a determinate answer. If the three roles are conceptually distinct, there must be possible cases where the variance ratio is high, but the potential for environmental intervention is also high (Job 1 vs. Job 2), or where intergenerational correlation is high without genetic transmission (Job 3 vs. Job 1). If such cases can be rigorously identified and mapped, the conflation hypothesis is supported. Furthermore, if the boundaries of the "range of environments" cannot be settled by data alone but require value judgments about which environments are "normal" or "relevant," the normative hypothesis is supported.

  **Background and Significance**
  In standard treatments, heritability is defined relative to a specific population and a specific range of environments. However, this relativization is often treated as a technical footnote rather than a conceptual pivot. Critics of behavioral genetics have long argued that heritability estimates do not imply immutability. Yet, the debate often stalls because proponents and critics are using the same term to track different quantities.

  Current literature adequately distinguishes between variance decomposition and causal mechanism in the abstract. However, standard treatments leave open exactly *how* the conflation occurs in practice. There is insufficient analysis on the specific gap between interventionist potential (what happens if we change the environment?) and transmission mechanisms (what is passed from parent to offspring?). A trait can be highly heritable in the variance sense, yet highly responsive to environmental intervention (the "height" paradox: height is highly heritable, yet average height has increased drastically due to nutrition). Conversely, a trait can be transmitted intergenerationally through cultural niches constructed by parents, inflating heritability estimates without direct genetic causation.

  Furthermore, the definition of the "range of environments" is under-theorized. A heritability estimate is only valid within the environmental range sampled. If that range excludes extreme deprivation or enrichment, the heritability estimate will be artificially inflated. The decision to exclude certain environments is often justified as methodological control, but I argue it functions as a normative boundary-setting regarding which social conditions are treated as fixed background rather than manipulable variables.

  **Methodology**
  This project employs methods from the philosophy of science, specifically conceptual analysis and the reconstruction of scientific modeling. I will not generate new empirical data but will re-analyze existing canonical cases to test the tripartite distinction.

  1.  **Conceptual Taxonomy:** I will formally define the three "jobs" of heritability.
      *   *Job 1 (Descriptive):* The variance ratio in Population $P$ given Environment Range $E_R$.
      *   *Job 2 (Interventionist):* The predicted change in phenotype $\Delta Z$ given a specific manipulation of genes $\Delta G$ or environments $\Delta E$.
      *   *Job 3 (Transmission):* The probability of offspring phenotype given parental phenotype, controlling for shared environment.
      I will demonstrate mathematically and conceptually where these quantities diverge.

  2.  **Worked Case Studies:** I will apply this taxonomy to three traits, selected for their varying degrees of controversy and data availability:
      *   *Height:* Used to demonstrate the divergence between Job 1 (high variance ratio) and Job 2 (high environmental sensitivity historically).
      *   *Educational Attainment:* Used to demonstrate the divergence between Job 1 and Job 3, focusing on passive gene-environment correlation and cultural transmission.
      *   *Psychiatric Conditions (e.g., Schizophrenia):* Used to analyze the "range of environments" problem. I will examine how excluding institutionalized or extreme socio-economic environments from study samples alters the heritability coefficient and obscures potential interventions.

  3.  **Normative Analysis of Parameters:** For each case, I will interrogate the justification for the selected environmental range. I will argue that decisions to treat certain environmental variables as "noise" rather than "signal" reflect normative commitments about the stability of social structures.

  **Expected Outcomes and Deliverables**
  The primary output will be a research paper of approximately 8,000 words suitable for publication in a journal specializing in philosophy of science or theoretical biology. The paper will provide:
  1.  A clear conceptual framework distinguishing the three roles of heritability.
  2.  A demonstration that empirical disputes in the selected case studies are partially constituted by ambiguities between these roles.
  3.  An argument that the "range of environments" parameter requires explicit normative justification, not just statistical convenience.

  **Conditions for Success and Failure**
  *   **Success:** The project succeeds if I can identify at least one canonical case where the standard heritability coefficient yields a misleading prediction for intervention or transmission due to the conflation of roles, and if I can show that the environmental range parameter relies on non-empirical assumptions. Success is also defined by the production of a taxonomy that allows researchers to specify *which* heritability they are reporting.
  *   **Failure:** The project would fail if it turns out that the three quantities are mathematically inseparable in all possible modeling frameworks, rendering the distinction merely semantic. It would also fail if the claim regarding the "normative" nature of the environmental range is shown to be reducible to purely empirical constraints (e.g., if the range is determined solely by measurement feasibility with no room for judgment).

  **Scope and Timeline (Six Months)**
  This scope is realistic for a six-month fellowship because it limits the empirical ground to re-analysis of existing, well-documented cases rather than new data collection.

  *   **Months 1–2: Conceptual Framework and Literature Review.**
      *   Refine the definitions of the three "jobs."
      *   Map existing philosophical arguments regarding heritability without getting bogged down in historical exegesis.
      *   Draft the conceptual taxonomy section.
  *   **Months 3–4: Case Study Analysis.**
      *   Conduct the re-analysis of Height, Educational Attainment, and Psychiatric Conditions.
      *   Focus specifically on locating the "range of environments" decisions in the methodology sections of major studies.
      *   Draft the case study section.
  *   **Month 5: Synthesis and Normative Argument.**
      *   Integrate the case studies with the conceptual framework.
      *   Flesh out the argument regarding hidden normative work in parameter selection.
      *   Draft the discussion and conclusion.
  *   **Month 6: Revision and Dissemination.**
      *   Revise the full manuscript based on feedback from colleagues.
      *   Prepare the final proposal for journal submission.
      *   Present findings at a departmental workshop or seminar.

  **Conclusion**
  Disputes over heritability often stall because participants believe they are disagreeing about the data, when they are actually disagreeing about the conceptual role the statistic is playing. By disentangling variance, intervention, and transmission, and by exposing the normative choices inherent in defining environmental ranges, this project aims to clarify the epistemic limits of behavioral genetics. This clarification is essential not only for theoretical precision but for ensuring that genetic data is not misused to justify fatalism regarding social policy.
