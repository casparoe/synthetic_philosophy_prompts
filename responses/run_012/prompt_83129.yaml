answer: |-
  **MEMORANDUM**

  **TO:** Medication-Safety Working Group
  **FROM:** Chair, Medication-Safety Working Group
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Knowledge-Base Conflict Resolution Protocol

  **Recommendation**
  I recommend we **adopt** the proposal to halt automatic resolution of conflicting formulary assertions at import. We will implement the "flagged-pair" design, wherein contradictory assertions at equal evidence tiers suppress automatic alerts, display both sources to the prescriber, and trigger a timed adjudication window.

  This decision is driven by the near-miss incident three weeks ago. Silent ranking of conflicting sources obscured a contraindication. Safety requires visibility, not hidden arbitration. However, adoption requires we settle the logical objections raised in our last session to ensure the specification is sound.

  **On the Question of "True Contradictions"**
  This will be the first question at the table, so I answer it plainly here: **No, this design does not commit us to the view that true contradictions exist.**

  Member A's concern is that storing Assertion P (Contraindicated) and Assertion Not-P (Permitted) asserts that both are true. They are not. The system stores *attributed claims*, not ontological facts. The database holds "Source 1 claims P" and "Source 2 claims Not-P." This is a consistent record of a disagreement, not a contradiction in reality. Member B is correct: the design is epistemically neutral. It concedes we do not know which claim is false, without asserting both are true. We are documenting uncertainty, not paradox.

  **On the Question of Logical "Explosion"**
  Member C warns that in classical logic, a contradiction allows any conclusion to follow (*ex contradictione quodlibet*). If our inference engine were classical, Member C would be right: the system would become useless.

  However, the proposal explicitly changes the inference rule: *"A rule would fire only where an assertion is present and is not contradicted at an equal or higher evidence tier."* This creates a quarantine around the contradiction. The engine is instructed *not* to infer from the contradictory pair. This is a paraconsistent approach. As long as the engineering specification enforces this blocking rule, the "explosion" is structurally impossible. The risk lies only in a mismatch between this policy and the actual code.

  **Clinical Rationale**
  The status quo failed. By silently ranking one source over another, the system pretended certainty where none existed. The proposed design shifts the burden from the algorithm (which cannot judge clinical nuance) to the prescriber (who can), supported by full transparency. The timer ensures the adjudication is not ignored; the side-by-side display ensures it is informed.

  **The Strongest Case Against Adoption**
  The most serious argument against this proposal is not logical, but operational. Surfacing all conflicts to the prescriber increases cognitive load and interrupts workflow. If the formulary sources are frequently misaligned, we risk alert fatigue, where clinicians reflexively dismiss the "adjudication required" prompt without reading the sources. Furthermore, the adjudication timer could delay urgent medication administration if the prescriber is unavailable or unsure how to resolve the tier tie. We mitigate this by monitoring adjudication times and source-alignment rates, but we must accept that safety here trades off against efficiency.

  **Implementation Step**
  To ensure the logical safeguards are real and not just theoretical, I propose the following immediate action:

  *   **Action:** The IT Lead and Pharmacy Informaticist will co-sign a specification document confirming the inference engine's "contradiction blocking" logic matches the proposal's requirements (specifically, that no rule fires from a flagged pair).
  *   **Deadline:** Friday, November 3, 2023.

  We will review this specification at our meeting next Thursday. I ask that you come prepared to discuss the workflow safeguards against alert fatigue, as the logical path is clear.
