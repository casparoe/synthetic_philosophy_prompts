      *   *The "Explosion" Charge (Member C):* In classical logic, $(P \land \neg P) \to Q$ (anything follows). If the inference engine treats the knowledge base as a set of true axioms, and that set contains a contradiction, the system becomes useless. However, the proposal specifically changes *how* rules fire ("a rule would fire only where an assertion is present and is not contradicted"). This is a *paraconsistent* approach (specifically, a form of defeasible logic or prioritization), not classical deduction from a contradictory set. The proposal *prevents* explosion by blocking inference when contradiction exists. So Member C's warning applies to the *old* way (silent ranking) or a naive classical engine, but the proposal explicitly mitigates this.
