answer: |-
  Here is the specification sheet for the problem of hedonic unity. This is not a survey of theories, but a map of the constraints any theory must satisfy to avoid the circularity you are experiencing.

  ### I. The Desiderata: Non-Negotiable vs. Contested

  A theory of pleasure must explicitly state its stance on the following. The "Non-Negotiables" are constraints required to make the concept usable in ethics and psychology. The "Contested" items are where the camps divide.

  #### A. Non-Negotiable Constraints (The Floor)
  *If a theory fails these, it is not a theory of pleasure; it is a theory of something else.*

  1.  **The Distinction from Goodness:** Pleasure cannot be defined *solely* as "that which is good."
      *   *Reason:* We must be able to say, "I took pleasure in this, but it was bad for me" (e.g., smoking, schadenfreude) without contradiction.
      *   *Requirement:* The theory must separate *hedonic tone* from *moral/prudential value*.
  2.  **The Distinction from Desire:** Pleasure cannot be defined *solely* as "that which is desired."
      *   *Reason:* The cigarette case (wanting without enjoying) and the sad song case (enjoying without wanting to repeat).
      *   *Requirement:* The theory must allow for a gap between *liking* (consummatory) and *wanting* (incentive salience).
  3.  **The Possibility of Error:** A subject's report ("I am enjoying this") cannot be incorrigible.
      *   *Reason:* Self-deception, social pressure (the joke you don't get), and retrospective correction (the dream) exist.
      *   *Requirement:* There must be a fact of the matter about pleasure that is distinct from the subject's immediate assertion.
  4.  **Non-Linguistic Applicability:** The theory must apply to creatures without propositional language (infants, dogs).
      *   *Reason:* Dogs clearly experience pleasure (belly rubs) and pain. If pleasure requires conceptualizing a proposition ("I am glad that p"), animals are excluded.
      *   *Requirement:* The mechanism of pleasure cannot rely exclusively on high-level cognitive capacities.

  #### B. Contested Commitments (The Joints)
  *These are the leverage points. Choosing one usually breaks another.*

  1.  **Phenomenal Unity vs. Heterogeneity:**
      *   *Commitment:* Is there a single "felt quality" (a hedonic tone) common to all pleasures?
      *   *Tension:* If **Yes**, it struggles to explain how solving a proof feels like eating ice cream. If **No**, it struggles to explain why we group them under one word and treat them similarly in decision-making.
  2.  **Introspective Accessibility:**
      *   *Commitment:* Must the subject be aware of the pleasure for it to exist?
      *   *Tension:* If **Yes**, background pleasures (boring routine) and unconscious states (dreams) are excluded. If **No**, how do we verify the theory?
  3.  **Attitudinal vs. Sensory:**
      *   *Commitment:* Is pleasure a sensation (like heat) or an attitude toward a state (like approval)?
      *   *Tension:* Sensory accounts handle the sneeze/scratch well but fail the "good news" case. Attitudinal accounts handle "good news" well but struggle with animals/sneeze.
  4.  **Temporal Location:**
      *   *Commitment:* Is pleasure only in the present experience?
      *   *Tension:* If **Yes**, anticipation and memory are not pleasures (but anticipations of them). If **No**, the ontology of pleasure becomes diffuse.

  ---

  ### II. The Test Cases: How the Theory Must Handle Them

  A viable theory cannot just ignore these. It must either **Count** them as pleasure, **Exclude** them (with justification), or **Explain Them Away** (redescribe them).

  | Case | The Challenge | Requirement for Theory |
  | :--- | :--- | :--- |
  | **Sneeze / Scratch** | Sensory, relief-based, involuntary, short-lived. | Must account for **relief pleasure** (cessation of pain) vs. **positive pleasure**. If pleasure is just "positive sensation," how is relief (removal of negative) pleasurable? |
  | **Sour Candy** | "Painful" sensation that is sought and enjoyed. | Must explain **hedonic reversal**. Is the pain part of the pleasure, or does the attitude override the sensation? |
  | **Sad Song** | Negative content (lyrics/theme) + Positive experience. | Must distinguish **object of attitude** (sadness) from **manner of attitude** (enjoying the sadness). If pleasure is a feeling, why isn't the sadness feeling dominant? |
  | **Schadenfreude** | Pleasure in another's pain. Morally suspect. | Must satisfy **Distinction from Goodness**. The theory must allow this to be *pleasure* without validating it as *good*. |
  | **Anticipation** | Pleasure taken in a future event (which may not happen). | Must handle **non-veridical pleasure**. If the event never happens, was the anticipation pleasure? If so, pleasure is not tethered to external facts. |
  | **Boring Routine** | Low-grade, background, unnoticed until interrupted. | Must satisfy **Introspective Accessibility**. Can you enjoy something you aren't attending to? (Threatens Phenomenal Unity). |
  | **Dream Pleasure** | Remembered as pleasant upon waking, but was it felt then? | Must handle **Retrospective Attribution**. Is pleasure a dispositional memory or a concurrent state? |
  | **Social Laughter** | Laughing at a joke you don't understand/don't like. | Must satisfy **Possibility of Error**. Behavior (laughing) $\neq$ State (pleasure). Theory must decouple output from internal state. |
  | **Enjoyed-but-Won't-Repeat** | "I enjoyed that hangover/affair, but never again." | Must satisfy **Distinction from Desire**. Liking does not entail Wanting-to-Repeat. This kills simple Desire-Satisfaction theories. |
  | **Solving a Proof** | Cognitive, no obvious sensory "tingle." | Must satisfy **Heterogeneity**. If pleasure is a sensation, where is it here? If it's an attitude, is it distinct from the satisfaction of success? |

  ---

  ### III. The Joints: Incompatibilities and Tensions

  This is where your seminar is likely stuck. The following pairs of desiderata exert opposing pressures. A theory usually satisfies one by sacrificing the other.

  #### 1. The Heterogeneity vs. Unity Tension
  *   **Pull A:** To cover *Solving a Proof* and *Eating Ice Cream*, the theory must be abstract (e.g., "Desire Satisfaction" or "Attitudinal Approval").
  *   **Pull B:** To cover *Animals* and *Sneeze Relief*, the theory must be concrete/sensory.
  *   **The Conflict:** Abstract theories make animal pleasure mysterious (do dogs have attitudes toward propositions?). Sensory theories make cognitive pleasure mysterious (what is the "tingle" of a proof?).
  *   **Verdict:** **Jointly Unsatisfiable** under a strict Monist framework. You likely cannot have a *single natural kind* that covers both dog belly-rubs and mathematical insight without stretching the definition of "sensation" or "attitude" until it breaks.

  #### 2. The Authority vs. Error Tension
  *   **Pull A:** To respect **Subject Authority**, if someone says "I enjoy this sad song," they do.
  *   **Pull B:** To respect **Possibility of Error** (Social Laughter, Self-Deception), there must be a criterion for pleasure independent of the report.
  *   **The Conflict:** If the criterion is neural (dopamine), the subject might be wrong. If the criterion is phenomenological, the subject is the only judge.
  *   **Verdict:** **Tension.** Most theories privilege one. Phenomenal theories privilege Authority. Naturalist theories privilege Error-possibility.

  #### 3. The Liking vs. Wanting Tension
  *   **Pull A:** To explain **Enjoyed-but-Won't-Repeat**, Pleasure (Liking) must be distinct from Choice (Wanting).
  *   **Pull B:** To explain **Motivation**, Pleasure usually *should* drive action.
  *   **The Conflict:** If you separate them too much (e.g., "Pleasure is just a sensation, Desire is separate"), you lose the normative force of pleasure. Why pursue pleasure if it doesn't track desire?
  *   **Verdict:** **Manageable.** Neuroscience (Berridge et al.) supports this dissociation. A theory *should* separate Liking and Wanting. If your seminar is treating them as identical, that is the error.

  #### 4. The Present vs. Future Tension
  *   **Pull A:** To handle **Anticipation**, pleasure must be able to be about non-existent states.
  *   **Pull B:** To handle **Sneeze/Scratch**, pleasure seems tightly bound to immediate physiological states.
  *   **The Conflict:** If pleasure is an attitude toward a proposition ("I am glad that p"), anticipation works. If pleasure is a sensation, anticipation is just a *cause* of pleasure, not pleasure itself.
  *   **Verdict:** **Theoretical Fork.** You must decide if "anticipatory pleasure" is literal pleasure or a derivative state.

  ---

  ### IV. The Verdict: Is the List Jointly Satisfiable?

  **No.** Not if you insist on **Hedonic Monism** (the claim that there is one single thing common to all cases).

  The requirement doing the most work to rule out candidates is **Non-Linguistic Applicability** combined with **Heterogeneity Coverage**.

  1.  **Sensory Theories** fail *Heterogeneity Coverage* (cannot explain the pleasure of good news/proofs without positing a magical "mental glow").
  2.  **Attitudinal Theories** fail *Non-Linguistic Applicability* (animals cannot hold attitudes toward propositions like "that I am eating").
  3.  **Desire Theories** fail *Distinction from Desire* (the cigarette case and the won't-repeat case).
  4.  **Pluralist Theories** (There is no unity; "pleasure" is a family resemblance term) satisfy all cases but fail the **Unity** desideratum.

  **The Hard Truth for the Seminar:**
  If you demand a *single* common denominator (a "hedonic atom") that exists in a dog, a mathematician, and a masochist listening to sad songs, **no theory will work.**

  You have three options to break the circle:
  1.  **Accept Pluralism:** Admit there is no "pleasure" *simpliciter*, only sensory pleasures, propositional pleasures, and relief pleasures, linked by family resemblance. (Sacrifices Unity).
  2.  **Accept Attitudinal Monism + Error:** Claim animals *do* have primitive proto-attitudes, or that animal pleasure is a different category than human pleasure. (Sacrifices Non-Linguistic Applicability or Unity).
  3.  **Accept Phenomenal Monism + Stretch:** Claim there *is* a common feeling, but it is so abstract (a "raw feel of rightness") that it is barely detectable in complex cases. (Sacrifices Phenomenological Plausibility).

  **Recommendation:** Stop looking for the common denominator. Shift the question from "What is pleasure?" to "What functional role does the attribution of pleasure play?" The unity may not be in the *ontology* (the stuff itself) but in the *economics* (how the brain weights rewards). If the seminar insists on metaphysical unity, point them to the **Heterogeneity vs. Animals** incompatibility. That is the hard stop.
