          *   Option B: Single Number (Use the 85th percentile of the Tech Lead's distribution, not the mean of the Rate distribution).
          *   Option C: The "Discovery Spike" (Buy time to get data).
      *   *Closing:* Reassure the user that their intuition is sound, but the workplace context dictates the answer.

  7.  **Refining the Tone:**
      *   Avoid condescension.
      *   Keep it engineering-focused.
      *   Make sure the "Friday Doc" advice is clear.
      *   *Self-Correction on Log-Uniform:* While Log-Uniform is the "correct" uninformative prior for scale, calculating the *mean* of a log-uniform distribution is less intuitive than the median (geometric mean). For a planning doc, the median (10.4 months) is often more useful than the mean (13.3 months) because the distribution is long-tailed. However, for *budgeting*, you want a high confidence bound (e.g., 80% chance of completion). I should recommend a confidence bound rather than an average.
      *   *Wait, keep it simple.* The user asked "What do I write?" I shouldn't give them a complex Bayesian formula to defend in a meeting. I should tell them to push for a **Range** or a **Discovery Phase**. If forced to pick a number, side with the Tech Lead for safety.

