answer: |-
  (1) **Straight answer**
  There is no single canonical noun for this specific slope, though in military ethics it is discussed under **Hierarchical Complicity** or **Command Responsibility**. The "one thing" stopping those labels from being a perfect fit is that they describe legal liabilities, whereas your pattern describes a moral intuition based on varying **excusing conditions**. If you want the blunt philosophical truth: this isn't a unique phenomenon, it is simply the principle of **"Ought Implies Can"** applied to a chain of command.

  (2) **The neighbours**
  **The Moral Equality of Combatants:** This is the horizontal view you already dismissed, where soldiers on both sides are treated as moral peers regardless of the war's justice. It fails your test because it assumes symmetry between opposing fighters, whereas you are tracking the *asymmetry* between the fighter and the person who sent them.

  **The Problem of Many Hands:** This concept describes how responsibility dissolves or vanishes when too many people contribute to an outcome, making no one individually liable. Your pattern is the exact opposite: you are observing responsibility *concentrating* upstream rather than dissipating into the bureaucracy.

  **Moral Luck:** This covers situations where an agent's moral standing depends on factors outside their control (like whether a bullet hits or misses). While relevant to the soldier's survival, it doesn't explain the *structural* shift in blame; your pattern is about *agency* and *knowledge*, not random outcomes.

  (3) **The carving**
  The precise concept is **The Gradient of Discretionary Agency**. This defines the boundary of blame not by who pulled the trigger, but by who had the power to *not* have the trigger pulled. Inside the boundary are roles with high epistemic access and the volitional capacity to alter policy or strategy (ministers, generals, media shapers). Just outside the boundary are roles where execution is coerced, knowledge is systematically withheld, or the individual's causal impact is negligible without the upstream decision (conscripts, low-level logistics).

  (4) **Test cases**
  *   **The drafted conscript who hated it:** Fits perfectly; maximum coercion, minimum discretion, sits at the bottom of the blame valley.
  *   **The volunteer who enlisted out of conviction:** Slides up the slope; higher initial agency makes the "following orders" excuse thinner, though operational duress remains.
  *   **The drone operator:** High on the slope; they have high epistemic access (live feed) and the technical ability to abort, reducing the "had no choice" defense.
  *   **The engineer who writes the targeting software:** Edge case; they have high knowledge but removed from the specific act, fitting the "out into the public" wing of your pattern rather than the chain of command.
  *   **The voter who now regrets it:** Tricky edge; they have collective agency but negligible individual causality, placing them on the outer rim where blame is diffuse but morally present.
