  **Chaconne**

  The arch sustains the weight of falling sky,
  Where gravity obeys the law of rest.
  In crystal silence, frozen structures lie,
  And matter dreams within the earth's cold breast.
  One blind desire burns under all that shines.

  The green leaf turns to catch the wandering light,
  A silent struggle upward from the root.
  It drinks the day and fears the coming night,
  Yet bears no tongue to speak its bitter fruit.
  One blind desire burns under all that shines.

  The beast runs hot upon the scent of blood,
  With fear and hunger driving through the vein.
  It knows the shadow and the muddy flood,
  But cannot name the source of its own pain.
  One blind desire burns under all that shines.

  The poet paints the sorrow of the king,
  And reason builds a ladder to the sun.
  But concepts clip the metaphysical wing,
  And leave the inner essence still undone.
  One blind desire burns under all that shines.

  One blind desire burns under all that shines.
