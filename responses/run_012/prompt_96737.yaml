answer: |-
  You have stumbled onto one of the most fundamental problems in semiotics, cognitive science, and mathematics, all wrapped up in a letterform. You are describing the visual equivalent of the **phoneme**.

  In linguistics, you can change the pitch, volume, or speed of a spoken /p/ (continuous variables), and it's still a /p/. But if you engage your vocal cords (a binary switch), it becomes a /b/. That switch is called a **distinctive feature**.

  There is no single English noun that perfectly captures "the small set of discrete, non-salient binary switches that determine categorical identity amidst continuous variation." However, there are three precise technical phrases from different fields that, when layered, give you the carving you are looking for.

  ### The Nearest Terms (and why they fall short)

  **1. Distinctive Features (Linguistics/Semiotics)**
  *   **What it is:** Binary oppositions that distinguish meaning (e.g., voiced vs. unvoiceless, nasal vs. oral).
  *   **Why it fits:** It captures the "switch" nature. It explains why changing *this* specific thing changes the identity, while changing other things does not.
  *   **Where it falls short:** It is historically auditory. Applying it to vision requires the modifier "visual" or "graphemic." It also doesn't explain *why* those specific features are the distinctive ones (topology vs. texture).

  **2. Topological Invariants (Mathematics/Geometry)**
  *   **What it is:** Properties of a shape that remain unchanged under continuous deformation (stretching, bending), but change if you tear or glue (e.g., number of holes, connectivity).
  *   **Why it fits:** This describes the *mechanism* of your switches. An 'a' and an 'o' differ topologically (one has a stem attached, one is a closed loop). An 'a' and a 'd' differ by the relative position of the bowl (left vs. right). You can stretch an 'a' infinitely (topology holds), but if you close the counter completely, the topology changes.
  *   **Where it falls short:** Topology is value-neutral. A coffee mug and a donut are topologically identical (one hole). Topology tells you about the structure, but not about the *cultural assignment* of that structure to the meaning "a."

  **3. Categorical Perception (Cognitive Psychology)**
  *   **What it is:** The phenomenon where the brain perceives a continuous physical gradient as discrete categories (e.g., a color gradient is seen as distinct "blue" and "green" chunks).
  *   **Why it fits:** It describes the *effect* you are feeling—the "hard edge" where identity collapses.
  *   **Where it falls short:** It describes the *viewer's brain*, not the *object's properties*. You are asking about the design switches, not the neural firing.

  ### The Carving: What the phenomenon actually is

  If we carve this out precisely, the phenomenon is not just "important features." It is an **Asymmetry of Tolerance** between two dimensions of information.

  **Dimension A: Continuous Parameters (The "Skin")**
  *   **Variables:** Weight, width, contrast, slant, serif shape, x-height.
  *   **Tolerance:** Infinite (within legibility limits).
  *   **Function:** Style, voice, texture, period.
  *   **Mathematical nature:** Analog / Continuous.

  **Dimension B: Discrete Topological Relations (The "Skeleton")**
  *   **Variables:** Connectivity (does the stem touch the bowl?), Enclosure (is there a counter?), Orientation (is the bowl left or right of the stem?), Cotermination (does the stroke end here or cross there?).
  *   **Tolerance:** Zero.
  *   **Function:** Identity, lexical access.
  *   **Mathematical nature:** Digital / Binary.

  **The Phenomenon:**
  The phenomenon is that **Lexical Identity is bound exclusively to Dimension B, while Stylistic Identity is bound exclusively to Dimension A.**

  The "switches" you are noticing are **Topological Distinctive Features**. They are "distinctive" because they carry semantic weight (changing them changes the letter), and "topological" because they rely on connectivity and enclosure rather than metric proportions.

  ### A Name and Definition

  Since no single word exists, I propose you use the phrase **Topological Distinctive Features**.

  **Definition:**
  > *Topological Distinctive Features are the minimal set of discrete, binary structural relations (connectivity, enclosure, relative orientation) that determine the categorical identity of a grapheme, invariant under continuous geometric transformation (scale, weight, style).*

  ### The Boundaries: Are they universal?

  You asked if the boundary is the same for every category or if people can disagree. This is the crux of the "carving."

  **1. The Boundary is Conventional, not Physical**
  The switches are not laws of physics; they are laws of literacy.
  *   **Example:** The single-storey `a` (ɑ) and double-storey `a` (a). Topologically, they are different shapes. In some contexts (handwriting, specific typefaces), they are **allographs** (variations of the same letter). In others, they might be distinct. The "switch" that matters is defined by the community of readers, not the geometry itself.
  *   **Disagreement:** Two people *can* disagree if they come from different orthographic traditions. A Russian speaker looking at a Latin `C` might read it as an `S`. The topology is the same; the distinctive feature mapping is different.

  **2. The Zone of Ambiguity**
  There is a "boundary condition" where the switches are ambiguous.
  *   If you slide the bowl of the `a` slowly to the left, there is a precise pixel where it becomes a `d`. However, human perception has a "fuzzy buffer." In type design, this is the **Zone of Ambiguity**.
  *   If a letterform lands in this zone, the brain creates a "glitch." It slows down reading. Good type design avoids this zone. Bad type design (or experimental art) lives in it.

  **3. Load-Bearing vs. Decorative**
  You asked if two people can disagree about which switches are load-bearing.
  *   **Within a literate community:** No. The load-bearing features are standardized. If you remove the crossbar from a `t`, everyone agrees it is no longer a `t` (it becomes an `l` or `I`).
  *   **Across time:** Yes. The "load-bearing" features of the Latin alphabet have shifted over 2,000 years. The Caroline Minuscule `a` looked different from the Roman Rustic `A`. The "switches" moved.

  ### Summary for your Hobby

  When you are in FontForge, you are manipulating **Continuous Parameters** (curves, handles, metrics). But you are constrained by **Topological Distinctive Features**.

  *   **The Freedom:** You can move the handles anywhere (Continuous).
  *   **The Constraint:** You cannot break the path, close the counter, or cross the stem unless you intend to change the letter (Discrete).

  The frustration you feel is the friction between the **analog tool** (your hand, the bezier curve) and the **digital requirement** (the letter must be read as a specific category).

  You are not just drawing shapes; you are managing **information bandwidth**. The "invisible switches" are the high-bandwidth data channel (meaning), and the "visible style" is the low-bandwidth channel (aesthetic). If you corrupt the high-bandwidth channel by accident, the message fails.

  So, when you are debugging a glyph that "feels wrong," check your **Topological Distinctive Features**. Did a node snap to the wrong side? Did a curve close a counter that should be open? That is where the identity lives. Everything else is just fashion.
