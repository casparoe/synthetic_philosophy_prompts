          3.  *The "Absorptive Capacity" Trap:* A small, local clinic that is "neglected" but actually at max capacity.
          4.  *The "Hidden Failure" Trap:* A global health intervention that looks neglected but failed in RCTs previously.
          5.  *The "Double Count" Trap:* Something highly neglected *because* it's intractable (e.g., changing deep cultural values in a closed regime).
          6.  *The "Safe Bet":* Something boring but reliable (e.g., bednets), low neglectedness, high tractability.
      *   **Scoring:** Need a formula. $Score = I \times T \times N$. Or additive? Multiplicative emphasizes the "zero" problem. Let's use a 1-10 scale for each, multiplied.
