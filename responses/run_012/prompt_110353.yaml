answer: |-
  # Activity: The Allocation Protocol

  **Goal:** To operationalize the Importance/Tractability/Neglectedness (ITN) framework until it breaks, forcing students to confront the hidden moral assumptions, information asymmetries, and "laundering" mechanics inherent in algorithmic philanthropy.

  **Time:** 90 Minutes
  **Participants:** 18 Students (3 Groups of 6)
  **Stakes:** $200 real cash (from group budget) OR "Semester Privilege Points" (e.g., The winning group decides the pizza venue for the remaining meetings *and* picks one reading to skip). *Note: Cash is superior for inducing stress; use cash if administrative hurdles allow.*

  ---

  ## 1. Setup & Materials

  *   **Room:** Three distinct tables/clusters.
  *   **Handouts:**
      1.  **The Cause Menu:** 6 one-paragraph descriptions (see below).
      2.  **The Scorecard:** A grid for rating I, T, and N (1–10 scale) and a formula box.
      3.  **The Envelope:** Sealed, labeled "Update Packet." Do not open until minute 40.
  *   **Roles (Assign within each group of 6):**
      *   **The Treasurer (1):** Holds the pen. Must sign off on the final allocation. Cannot vote, only breaks ties.
      *   **The Auditor (1):** The only one allowed to open the "Update Packet" in Round 2.
      *   **The Advocates (4):** Argue for specific causes.

  ---

  ## 2. The Cause Menu (Invented Scenarios)

  *Print these exactly. Do not allow Googling.*

  1.  **The Local Ladder:** Scholarships for first-gen students at your specific university.
      *   *Pitch:* Direct impact, visible success, high local importance.
  2.  **The Invertebrate Initiative:** Research into pain capacity of farmed insects (crickets/mealworms).
      *   *Pitch:* Astronomical numbers of beings, near-zero current funding, cheap interventions.
  3.  **Project Greenhouse:** Urban agriculture in a specific low-income zip code (15 miles away).
      *   *Pitch:* Food security, community building, neglected neighborhood.
  4.  **Cognitive Boost:** Distributing nootropic supplements to high-performing low-income high schoolers.
      *   *Pitch:* High leverage (changing life trajectories), tractable (pills are cheap), neglected (stigma).
  5.  **Policy Watchdog:** Funding a small NGO that lobbies for transparency in local zoning laws.
      *   *Pitch:* Systemic change, high importance if successful.
  6.  **The Archive:** Digitizing historical philosophical manuscripts at risk of decay.
      *   *Pitch:* Preserving long-term knowledge, highly neglected, zero risk of harm.

  ---

  ## 3. The Rules & Scoring

  **The Formula:** $Priority Score = Importance (1\text{--}10) \times Tractability (1\text{--}10) \times Neglectedness (1\text{--}10)$.
  *   **Importance:** Scale/Severity of the problem.
  *   **Tractability:** Ease of solving/making progress.
  *   **Neglectedness:** How few resources are currently working on it (10 = totally neglected).

  **The Constraint:** You have $200. You must allocate it in $50 chunks. You can fund up to 4 causes, or put all $200 into one. You cannot split $50 chunks.

  **The Laundering Mechanism:** To assign a number, you must write a *one-sentence justification* on the scorecard. (This forces them to commit to a rationale they can later be challenged on).

  ---

  ## 4. Timeline (90 Minutes)

  ### **0:00 – 0:10: Introduction & Stakes**
  *   Explain the rules. Put the $200 (or envelope representing points) on the central table.
  *   Emphasize: "This is not a discussion about what you *like*. This is a calculation based on the ITN framework you know. The math decides."
  *   Assign roles.

  ### **0:10 – 0:40: Round 1 (The Blind Calculation)**
  *   Groups receive the Cause Menu.
  *   They must score all 6 causes using the formula.
  *   They must propose an initial allocation of the $200 based *strictly* on the highest scores.
  *   **Instructor Role:** Circulate. If a group agrees too quickly, ask: "Are you sure that 10/10 on Neglectedness is good? Or does it mean something is wrong?" (Plant seeds of doubt without giving answers).

  ### **0:40 – 0:50: The Update (The Trap Springs)**
  *   Tell the **Auditors** to open the "Update Packet." They read the new info aloud to their group.
  *   **The Hidden Info:**
      *   *Project Greenhouse (Cause 3):* "Board minutes reveal they currently have $50k in reserve they cannot spend due to lack of staff. They cannot absorb more than $500 without hiring an admin." **(Absorptive Capacity Trap)**
      *   *Cognitive Boost (Cause 4):* "A major RCT conducted last year by a reputable university showed no cognitive benefit over placebo, but the results were published in a niche journal." **(Neglectedness as Warning Trap)**
      *   *The Invertebrate Initiative (Cause 2):* "New estimates suggest the probability of insect sentience is lower than previously thought, but the number of insects is higher." **(Moral Weight Uncertainty)**
  *   Groups have 10 minutes to adjust scores and final allocation.

  ### **0:50 – 1:05: Plenary Vote**
  *   Each group announces their final allocation.
  *   If groups disagree (likely), hold a 5-minute "floor debate" to reconcile into one final group decision.
  *   **Predictable Conflict:** One group will likely have scored *Invertebrates* highest mathematically, while another funded *Local Ladder*. The room must decide: Do we follow the aggregate math or the moral consensus?

  ### **1:05 – 1:30: The Debrief (Mapping Mechanics to Theory)**
  *   *Do not let them leave until you map the following:*

  **1. The Laundering Machine (Score Manipulation)**
  *   *Ask:* "Who changed a score in Round 2 not because the facts changed, but because the *outcome* felt wrong?"
  *   *Lesson:* The ITN framework looks objective, but the inputs are subjective. We often reverse-engineer the scores to match our moral intuitions. The math launders the bias.

  **2. Neglectedness as Signal (The Cognitive Boost Trap)**
  *   *Ask:* "Cause 4 looked like a bargain in Round 1. High importance, low competition. Why did it become toxic in Round 2?"
  *   *Lesson:* Neglectedness is ambiguous. It can mean 'untapped opportunity' or 'informed rejection.' If experts fled, why are you entering? (Reference: *Neglectedness as a reason for suspicion*).

  **3. Absorptive Capacity (The Greenhouse Trap)**
  *   *Ask:* "Project Greenhouse still scored high on ITN. But why was funding them actually wasteful?"
  *   *Lesson:* **Room for More Funding.** ITN assumes marginal dollars do work. If an org can't deploy cash, the 'Tractability' score is a lie. This is the counterfactual: What would have happened to this money? (Answer: It would have sat in a bank account).

  **4. The Incommensurability Wall (Invertebrates vs. Local Kids)**
  *   *Ask:* "If the math says insects, but your gut says local kids, what unit is missing?"
  *   *Lesson:* **Moral Weight.** The framework has no way to compare 'number of beings' vs. 'depth of experience' vs. 'species proximity.' The framework dramatizes the conflict but cannot resolve it.

  **5. Cluelessness**
  *   *Ask:* "How confident are you that your 'Importance' score isn't just a guess?"
  *   *Lesson:* **Cluelessness.** We are estimating long-run effects of interventions we barely understand. The precision of the score (1-10) masks the massive uncertainty of the input.

  ---

  ## 5. Predictable Failure Modes & Fixes

  **1. The Moral Refusal**
  *   *Scenario:* A student says, "I won't calculate the value of a human life against a bug. This is immoral."
  *   *Fix:* Remind them of the **Treasurer** role. The Treasurer *must* sign. The framework forces trade-offs whether we acknowledge them or not. By refusing to play, they are implicitly choosing the status quo allocation (which is also a moral choice).
  *   *Instructor Line:* "The money is being spent regardless. The only question is by whose logic. If you opt out, you cede the logic to someone else."

  **2. The Gamer**
  *   *Scenario:* A student realizes that if they score "The Archive" low, their favorite cause wins. They manipulate the 1-10 scale arbitrarily.
  *   *Fix:* This is a feature, not a bug. In the debrief, call them out gently. "You just demonstrated the laundering problem. You used the arithmetic to justify a preference. That is exactly how this framework is misused in the wild."

  **3. The Time Sink**
  *   *Scenario:* The group spends 25 minutes arguing about whether insects feel pain.
  *   *Fix:* Enforce the **Treasurer's Veto**. If debate exceeds 3 minutes per cause, the Treasurer assigns the default score (5) and moves on. Scarcity of time is part of the simulation.

  ---

  ## 6. Honest Limitations (What This Activity Cannot Do)

  *Be explicit about this in your closing remarks. Do not pretend the game solved these problems.*

  1.  **Long-Run Magnitude:** 90 minutes cannot convey the sheer scale of existential risk or long-term future effects. The game compresses time. Real ITN arguments often hinge on effects 100 years from now; this game only simulates immediate allocation.
  2.  **Genuine Estimability:** In the game, the causes are fixed text. In reality, we often don't even know *what* we don't know (unknown unknowns). The game gives them "Update Packets"; real life rarely does.
  3.  **Resolving Moral Weight:** The activity dramatizes the conflict between local humans and farmed animals, but it **does not solve it**. You must tell them: "The framework broke here. That is not a failure of your math; it is a failure of the theory. You will have to bring your own moral philosophy to fix what the ITN framework leaves open."

  ---

  ## 7. Instructor Prep Checklist

  *   [ ] **Cash/Points:** Secure the $200 or formalize the "Pizza Points" contract.
  *   [ ] **Printouts:** 18 Cause Menus, 18 Scorecards, 3 Update Packets (sealed).
  *   [ ] **Timer:** Strict timekeeping is essential to create the pressure that reveals the cracks in the framework.
  *   [ ] **Board Space:** To write the final scores from all 3 groups side-by-side for comparison.

  ## 8. The "Cluelessness" Hook (For the Debrief)

  If the room is quiet during the debrief, use this prompt:
  *"One of you called this 'cluelessness' earlier. Look at your score for Invertebrate Welfare. You assigned it a 'Tractability' number. What data is that number based on? You have no idea if the intervention works. You are dressing up a guess as arithmetic. Why did the formula make you feel more confident than you should have been?"*

  This lands the plane on the core epistemic critique: **Precision does not equal accuracy.**
