          *   **The Conflict:** One cause scores high on ITN but conflicts with moral intuition (e.g., farmed animals vs. local kids), forcing a clash between the "number" and the "gut."
      *   **Learning Outcomes:** Neglectedness as suspicion, non-independence of criteria (double-counting), incommensurability of moral weight (units problem), cluelessness/uncertainty.
      *   **Logistics:** Roles, timeline (90 mins), debrief structure.
      *   **Anticipated Problems:** Moral refusal, gaming the system, time sinks on specific causes.
      *   **Honesty Clause:** Acknowledge what the activity *cannot* teach (long-run magnitude, genuine estimability uncertainty, resolving moral weight).

