      *   *Correction:* The user mentioned "cluelessness." I need to make sure the debrief explicitly names that.
      *   *Correction:* The user wants the "laundering" aspect highlighted. I need to instruct them to *justify* their scores, which is where the laundering happens.

  11. **Final Output Structure:**
      *   Activity Title.
      *   Setup (Stakes, Room, Materials).
