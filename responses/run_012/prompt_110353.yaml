  *(Self-Correction on the "Hidden Failure" cause)*: If I tell them it failed in a study, they will just score Tractability to 0. I need the study to be ambiguous or the failure to be *interpretive*. Better: The failure was due to *implementation*, not theory, so Tractability is debatable. Or, the Neglectedness is *because* of the failure, but the data is obscure. Let's go with: "Previous major funding was withdrawn after 2 years due to lack of measurable impact." This forces them to decide if Neglectedness = Opportunity or Neglectedness = Warning.

