answer: |-
  You have put your finger on one of the oldest and most persistent ghosts in time-series analysis. Your intuition is correct: your friend's defense ("the averaged series is real") is a category error. It conflates the *existence of a number* with the *existence of a mechanism*.

  Here is the name, the mechanism, the methodological sin, and the ontological answer you are looking for.

  ### 1. The Name: The Slutsky-Yule Effect

  The specific statistical phenomenon you are describing—where applying a moving average to random data generates apparent cyclical patterns—has a name: **The Slutsky-Yule Effect** (or Yule-Slutsky Effect).

  In the 1920s and 30s, Eugen Slutsky and G. Udny Yule independently demonstrated that if you take a series of purely random numbers (white noise) and apply a moving average (or sum them), the resulting series will exhibit wavelike behavior. It will look like a business cycle, a climate cycle, or a historical rhythm.

  **Why it happens:** A moving average is a low-pass filter. It suppresses high-frequency noise. But mathematically, convolving random noise with a smoothing window induces autocorrelation. A value at time $t$ becomes dependent on the value at time $t-1$ because they share most of the same inputs in their respective averages. This induced dependency creates the *appearance* of momentum and reversal, which our eyes read as "cycles."

  **The Kicker:** The period of the spurious cycle is determined by the length of the moving average window. As you noted: *"Widen or narrow the averaging window and the period of the wave changes."* This is the smoking gun. If the period of the "cycle" is a function of your smoothing parameter, the cycle is in the filter, not the data.

  ### 2. The Methodological Sin: Researcher Degrees of Freedom

  The Slutsky-Yule effect explains the math, but it doesn't fully capture the human behavior you described (picking weights by hand, choosing the window after looking at the graph). This is a specific subset of **Data Dredging** known as **Researcher Degrees of Freedom** (or the "Garden of Forking Paths").

  In quantitative macrohistory, this often manifests as **Construct Validity Failure**.
  *   **The Index:** When you combine grain prices, wars, and wages into a single index with hand-picked weights, you are asserting they are all manifestations of a single latent variable (e.g., "Social Stress"). Unless you have a prior theoretical model justifying those weights, you are essentially tuning a radio dial until you hear music.
  *   **The Window:** If the window size is chosen *post hoc* to maximize the visual regularity of the wave, you have guaranteed a pattern.

  Your friend says the averaged series is "real." It is *arithmetically* real, but *causally* empty. It is like saying a rainbow is "real" (it is photons hitting water droplets) and therefore proves there is a pot of gold at the end. The wave is a property of the transformation, not the underlying historical process.

  ### 3. Distinguishing Artifact from Signal

  You asked for a principled way to tell a claimed long cycle from an arithmetic artifact. There are three standard tests. If a macrohistorian cannot pass these, the cycle is likely Slutsky-Yule noise.

  **A. Spectral Analysis (The Periodogram)**
  Don't look at the time-domain graph (the wave). Look at the frequency domain. Plot the power spectrum of the *raw* (unsmoothed) data.
  *   **Real Cycle:** You should see a distinct "spike" in power at the specific frequency (e.g., 50 years) that rises significantly above the "noise floor" (usually modeled as red noise or an AR(1) process).
  *   **Artifact:** The power spectrum will be flat or decay smoothly. The "cycle" only appears after smoothing because smoothing *forces* the spectrum to decay, creating a false peak.

  **B. The Null Model Test**
  Generate 1,000 synthetic histories using a random walk or red noise process that matches the variance and autocorrelation of the actual historical data. Apply the *exact same* smoothing and indexing procedure to the fake data.
  *   **Real Cycle:** The historical wave should look significantly more regular than 95% of the fake waves.
  *   **Artifact:** If the fake data produces waves of similar amplitude and regularity (which it usually does with wide smoothing), the historical wave is indistinguishable from noise.

  **C. Robustness to Parameters**
  As you noted, if the period changes when the window changes, it's an artifact. A robust finding should be detectable across a range of reasonable smoothing parameters. If the "50-year cycle" vanishes if you use a 15-year average instead of a 20-year average, it was never there.

  ### 4. The Ontological Question: World vs. Description

  This is the deepest part of your query. *Is there a difference between a real cycle nobody could detect and an artifact?*

  **Yes.** The difference lies in the **Generative Process**, not the **Realization**.

  *   **The World (Generative Process):** A "real" cycle implies a feedback mechanism with a characteristic timescale. (e.g., Predator-prey populations, solar magnetic flipping, debt deleveraging). This mechanism exists regardless of whether we measure it.
  *   **The Description (Realization):** We only have one history. We have one realization of the process.

  The problem you identified is that **long-cycle macrohistory is often non-ergodic.** We have 600 years of data for a 200-year cycle. That is $N=3$. You cannot do statistics on $N=3$.

  When a researcher claims a 200-year cycle based on 600 years of smoothed data, they are claiming to have found a generative mechanism. But if that mechanism is only visible after applying a filter that *itself* has a 200-year impulse response, they have not found the mechanism; they have imposed it.

  **The Verdict:**
  If a cycle disappears when you remove the smoothing, it is not a "hidden real cycle." It is a **filtering artifact**. A real signal must be robust to the method of extraction. If the only way to see the dragon is to look through a kaleidoscope, the dragon is in the glass, not the garden.

  ### Summary for your toolkit

  *   **The Phenomenon:** The **Slutsky-Yule Effect**. (Moving averages induce spurious periodicity in random data).
  *   **The Practice:** **Researcher Degrees of Freedom** / **Post-hoc Filtering**. (Tuning the window to find the wave).
  *   **The Test:** **Spectral Analysis** of raw data vs. **Null Hypothesis testing** with surrogate data.
  *   **The Ontology:** A cycle is a claim about a **generative mechanism**. If the periodicity depends on the **smoothing kernel**, the mechanism is the mathematician, not history.

  You are right to be worried. In time-series analysis, **smoothness is not truth.** It is often just silence where the noise used to be.
