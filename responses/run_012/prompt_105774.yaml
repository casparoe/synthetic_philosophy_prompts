  # Activity Design: The Three Realizations
  **Course:** Upper-Level Philosophy of Mind Seminar
  **Class Size:** 14 Students
  **Duration:** 90 Minutes
  **Goal:** Experiential demonstration of the functionalist squeeze (chauvinism vs. liberalism).

  ## 1. The Functional Specification ("The Blinker")
  Do not use mentalistic terms (want, feel, think) during the activity. Use "Mode," "Signal," and "Response."

  *   **System:** A creature called "The Blinker."
  *   **Inputs:** `Tap Left` (L), `Tap Right` (R).
  *   **Outputs:** `Flash Green` (G), `Flash Red` (B).
  *   **Internal Modes:** `Mode 1` (Resting), `Mode 2` (Active). *Instructor Note: In debrief, reveal Mode 2 = "Wanting."*
  *   **Transition Rules:**
      1.  Start in **Mode 1**.
      2.  If **Mode 1** + `L` $\rightarrow$ Switch to **Mode 2**, Output **G**.
      3.  If **Mode 1** + `R` $\rightarrow$ Stay **Mode 1**, Output **B**.
      4.  If **Mode 2** + `L` $\rightarrow$ Switch to **Mode 1**, Output **B**.
      5.  If **Mode 2** + `R` $\rightarrow$ Stay **Mode 2**, Output **G**.

  *   **The Test Battery (Print 14 copies):**
      1.  Input: `L`. Expected Output: `G`. (System is now Mode 2).
      2.  Input: `R`. Expected Output: `G`. (System stays Mode 2).
      3.  Input: `L`. Expected Output: `B`. (System returns Mode 1).
      4.  Input: `R`. Expected Output: `B`. (System stays Mode 1).

  ## 2. Materials
  *   **For Mechanical Build:** 1 Shoebox, 1 Marble, 2 Index Cards labeled "Mode 1" and "Mode 2" (to place inside box), 2 Flashlights (one with green gel, one red), Tape, Scissors.
  *   **For Human Ensemble:** 4 Large Name Tags ("Mode 1", "Mode 2", "Left Ear", "Right Ear"), 2 Paddles (Green/Red), 1 Bell.
  *   **For Lookup Table:** 1 Large Binder labeled "The Book," containing 8.5x11 prints of the Input-Output mapping for all histories up to length 4.
  *   **For Voting:** Red/Green sticky dots or index cards.
  *   **For Criteria:** Index cards and pushpins/tape for a "Wall of Criteria."

  ## 3. Roles (14 Students)
  *   **Mechanical Team (4 students):** Build and operate the shoebox.
  *   **Human Team (5 students):** 2 Mode Holders, 2 Input Sensors, 1 Output Effector.
  *   **Testers/Judges (5 students):** Run the Test Battery on all three implementations.
  *   *(Roles rotate implicitly; everyone observes everything).*

  ## 4. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Introduction & Specification
  *   **Instructor:** "We are investigating what it takes for a system to occupy a specific internal condition. We will call this condition **Mode 2**. We have a specification for a system called 'The Blinker.' It takes taps, it flashes lights. Your job is to make three different physical things that obey these rules exactly."
  *   Hand out the Specification and Test Battery.
  *   **Constraint:** "Do not use words like 'mind,' 'want,' or 'feel' yet. Just follow the rules."

  ### 00:10 – 00:25: Implementation 1 (The Device)
  *   **Action:** The Mechanical Team builds the "State Box."
      *   *Setup:* The box has two compartments labeled Mode 1 and Mode 2. The marble sits in one.
      *   *Operation:* When `L` is called, they move the marble according to rules. They turn on the corresponding flashlight.
  *   **Testing:** The Testers run the 4-step Test Battery.
  *   **Result:** The box passes. It flashes the correct lights in the correct order.
  *   **Instructor:** "The device obeys the specification. It passes the test."

  ### 00:25 – 00:40: Implementation 2 (The Ensemble)
  *   **Action:** 5 students come to the front.
      *   Two stand apart holding "Mode 1" and "Mode 2" signs. Only one stands "Active" at a time.
      *   Two stand as Ears (Left/Right).
      *   One stands as Light (holds Green/Red paddles).
      *   They pass a token (the "State") between the Mode holders based on the Rules.
  *   **Testing:** The Testers run the *exact same* 4-step Test Battery.
  *   **Result:** The ensemble passes. Behavior is identical to the box.
  *   **Instructor:** "The group obeys the specification. It passes the test."

  ### 00:40 – 00:45: Vote 1 & The Criterion Trap
  *   **Instructor:** "Look at the Device and the Ensemble. They both passed the tests. They both occupy Mode 2 at the same steps."
  *   **Vote 1:** "On your card, write **YES** if you believe the system *really* occupies the condition (Mode 2) in a meaningful way, or **NO** if it is just pretending. Pin it to the board."
      *   *Expected Outcome:* Most will vote **NO** (It's just cardboard/people following scripts).
  *   **Criterion Writing:** "Now, write one sentence on a fresh card explaining *why* you voted that way. What is missing? What would be required for it to *really* be in Mode 2? Pin this next to your vote."
      *   *Instructor Note:* Do not correct them. If they write "It needs biology," let them. If they write "It needs to pass the test," let them.
      *   *Nudge (if needed):* "Make sure your criterion explains why you voted No to the box."

  ### 00:45 – 01:00: Implementation 3 (The Lookup Table)
  *   **Instructor:** "There is a third way to satisfy the specification."
  *   **Reveal:** Bring out "The Book."
  *   **Explanation:** "This book contains every possible history of taps and the correct light response. There are no internal modes. No marbles. No people passing tokens. Just a list: If History = [L], Output = G. If History = [L, R], Output = G."
  *   **Testing:** The Testers call out inputs. The Instructor looks up the history and announces the output.
  *   **Result:** The Book passes the *exact same* Test Battery perfectly.
  *   **Instructor:** "The Book satisfies the specification. The output is indistinguishable from the Box and the People."

  ### 01:00 – 01:05: Vote 2
  *   **Instructor:** "Look at your Criterion cards. Look at The Book. It passed the same tests as the Box."
  *   **Vote 2:** "Write **YES** or **NO** on a new card. Does The Book *really* occupy the condition (Mode 2)? Pin it up."
      *   *Expected Outcome:* Many will feel forced to vote **YES** (because it passed the functional test, and they are in a philosophy seminar), or they will vote **NO** and realize their criterion contradicts their functional commitment.
      *   *Target for Trap:* We want them to vote **YES** to the Table (committing to Functionalism) after voting **NO** to the Box (Chauvinism), or vice versa.
      *   *Correction for Prompt Requirement:* The prompt requires Vote 1 = Deny Mech, Vote 2 = Grant Table.
      *   *Instructor Script to ensure this:* "If your criterion for 'really occupying the condition' was based on *behavioral success* (which the spec defines), you must be consistent."

  ### 01:05 – 01:30: Debrief & Mapping
  *   **Instructor:** "Look at the wall. Compare Vote 1 (Box) to Vote 2 (Table). Compare them to your Criteria."
  *   **The Squeeze:**
      1.  **The Chauvinist Trap (Vote 1):** "Many of you denied the Box. You said it was 'just cardboard.' But it did the job. If you require biology or 'real stuff' for Mode 2, you are being **too demanding**. In philosophy, we call this **Neuro-Chauvinism**. You are denying the state to something that does the work."
      2.  **The Liberal Trap (Vote 2):** "Many of you granted the Table. It passed the test. But it has no insides. No switches. No causation. It's just a list. If you grant Mode 2 to a list, you are being **too permissive**. This is the **Liberal Objection** (or China Brain). You are granting the state to something that does nothing."
      3.  **The Functionalist Reply:** "The standard reply is that the Table lacks **Causal Organization**. The Box and People have states that *cause* the output. The Table just *is* the output history. But defining 'causal organization' without smuggling in 'mind' is the hard part."
      4.  **The Cost:** "If you say the Table doesn't count, you must explain why the Box *does*, without using biology. If you say the Box doesn't count, you must explain why biology matters, without being magical."
  *   **Limitations:** "Note what we did not do. We did not touch **Phenomenal Consciousness**. We did not ask if the Box *felt* like wanting. We only tested functional role. This is an intuition pump, not a proof. It shows the pressure points, not the solution."

  ## 5. Troubleshooting & Predictable Failures

  **Failure 1: The Mechanical Build Fails.**
  *   *Risk:* Students move the marble wrong; Test Battery fails.
  *   *Fix:* Pre-print the Transition Rules on a card taped *inside* the lid of the shoebox. The Instructor circulates during the 15-min build to verify the logic before testing begins. If it fails, pause and debug as a class ("Why did the light flash Red?"). This debugging *strengthens* the functionalist point (we are fixing the logic, not the material).

  **Failure 2: Vote 1 Comes Out "YES".**
  *   *Risk:* Students are too eager and say the Box "wants."
  *   *Fix:* During the build, emphasize the cheapness. "Look, it's a marble in a shoebox. Is the marble *hungry*?" Use skeptical framing. "Does this satisfy *you* that it's real?"
  *   *Contingency:* If Vote 1 is mostly YES, pivot the Trap. "Okay, you granted the Box. Now, does the Table get the same grant?" If they deny the Table, they are caught on the Liberal Objection (Why is a marble better than a list?). The squeeze still works, just inverted.

  **Failure 3: Vote 2 Comes Out "NO".**
  *   *Risk:* Students reject the Table outright.
  *   *Fix:* Remind them of their Criteria. If they wrote "Passing the test defines the state," point to the wall. "Your criterion convicts you. The Table passed." Force them to confront the inconsistency between their written definition and their intuition.

  **Failure 4: Jargon Leakage.**
  *   *Risk:* A student says "Functionalism" during the activity.
  *   *Fix:* Instructor gently interrupts. "Hold that term for the debrief. For now, just talk about the Box, the People, and the Book."

  ## 6. Instructor Script Notes (The "Silence" Constraint)
  *   **DO NOT SAY:** Functionalism, Realization, Multiple Realizability, Chauvinism, Liberal, Qualia, Phenomenal, Causal Role, Intentionality.
  *   **SAY INSTEAD:** The Job, The Spec, The Build, The List, Inside vs. Outside, Doing vs. Being, The Squeeze, The Pressure.
  *   **When revealing "Mode 2" = "Wanting":** Do this only at the start of the Debrief. "For the rest of this hour, 'Mode 2' will be translated as 'Wanting.'"

  ## 7. Why This Works (The Logic of the Trap)
  1.  **Vote 1 (Deny Mech):** Students rely on intuition that "cardboard isn't a mind." This sets up the **Chauvinist** horn.
  2.  **Criterion Writing:** To justify Vote 1, they often write criteria like "Needs physical causation."
  3.  **Vote 2 (Grant Table):** The Table *is* the functional spec. In a philosophy seminar, students feel pressured to accept the Functional Definition (Input/Output match). If they Grant the Table, they contradict their Vote 1 (Why is cardboard worse than a list?). If they Deny the Table, they contradict the Functional Definition they just tested.
  4.  **The Conviction:** The prompt asks for the criterion to convict them.
      *   If they write "Must pass the test," their Vote 1 (Deny Mech) is a lie (Mech passed).
      *   If they write "Must have insides," their Vote 2 (Grant Table) is a lie (Table has no insides).
      *   Either way, they are pinned by their own written commitment.

  ## 8. Limitations Statement (For Debrief)
  "Be frank: This activity bears not at all on **phenomenal consciousness**. A system could pass this test and feel like nothing (zombie). A system could fail this test and feel pain (infant/animal). We have tested *access* and *role*, not *experience*. Also, a working intuition pump is not an argument. It shows where the theory hurts, not where the truth lies."
