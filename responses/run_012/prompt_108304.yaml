answer: |-
  **MEMORANDUM**

  **TO:** Review Panel, Foundation for Computing Foundations
  **FROM:** Chair, Review Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Proposal 1 (Analog Hypercomputation) and Standing Test for Physical Computability Claims

  **1. Purpose and Recommendation**

  This memo circulates ahead of our meeting next Thursday to frame our decision on Proposal 1 ("Tabletop Hypercomputation via Continuous State Measurement") and to establish a standing test for future proposals of this class, including the "Zeno Machine" (Proposal 2) scheduled for the next cycle.

  **Recommendation:** I recommend we **decline Proposal 1** in its current form. I further recommend we adopt a **Standing Test for Physical Computability Claims** that requires a verifiable noise-analysis protocol before funding is considered.

  **2. The Applicants' Case: A Fair Statement**

  Two panel members have argued strongly for funding, and their position deserves precise articulation. The applicants argue that the Church–Turing Thesis (CTT) is not a definition but a contingent hypothesis about the physical world. They contend that by refusing to fund empirical tests of the CTT, we are effectively treating a physical claim as a logical truth.

  Their strongest point is this: If the CTT is a claim about what is physically possible, then a refusal to look for counter-examples is a substantive empirical bet that no such physical process exists. As a foundation dedicated to high-risk work, they argue we should be the exact venue willing to back the possibility that our current understanding of physics—and thus computation—is incomplete. To reject them a priori is to protect a dogma under the guise of methodological rigor.

  **3. Which Version of the Thesis Are We Testing?**

  To address the charge of dogmatism, we must be explicit about which version of the Church–Turing Thesis governs this decision. There are two readings:

  *   **Reading A (Conceptual/Effective Procedure):** The CTT defines what an ideal human agent can calculate using a finite, mechanical procedure. On this reading, "computation" is *defined* by Turing-computability. A physical gadget that outputs non-Turing-computable numbers is not "computing" in this sense; it is performing a physical measurement. A working device would not refute the thesis; it would merely force us to distinguish between *computation* and *physical simulation*.
  *   **Reading B (Physical/Global Limits):** The CTT claims that no physical process whatsoever can generate a function beyond Turing-computability. On this reading, the thesis is an empirical law of nature. A working device would refute it.

  **Panel Position:** To avoid the dogmatism the applicants fear, this panel should adopt **Reading B (Physical Limits)** as the relevant frame for this proposal. We must acknowledge that the applicants are making an empirical claim about the universe, not a category error. If we adopt Reading A, we dismiss the proposal by definition, which validates their complaint that we are shielding the thesis from revision.

  **What Follows for the Money:** Adopting Reading B means we accept, in principle, that the claim is testable. However, it shifts the burden of proof entirely to *verification*. If the CTT is a physical law, violating it requires evidence that survives the scrutiny applied to any other physical law. The decision to decline funding rests not on the impossibility of the claim, but on the impossibility of the *verification* given current constraints.

  **4. The Verification Objection: Is It Fatal?**

  The central technical objection is that no finite experiment can distinguish a device that genuinely computes an uncomputable function (requiring infinite precision on a continuous state) from a device that merely possesses extraordinary, but finite, precision.

  *   **Is this objection fatal?** For the specific claim of "deciding the Halting Problem for *arbitrary* programs," **yes, it is fatal.** To verify the device solves the Halting Problem, one must verify it works for inputs of unbounded size. Any finite set of test cases can be mimicked by a standard Turing machine (e.g., via a lookup table). We cannot empirically confirm the "arbitrary" clause.
  *   **Does a weaker success criterion survive?** Yes. We could fund work that does not claim to solve the Halting Problem outright, but rather demonstrates a physical process whose *noise profile* defies simulation by a Turing machine within a specific energy budget. For example, if the group could show that their device maintains a signal-to-noise ratio that scales in a way prohibited by the Bekenstein bound or standard quantum limits, that would be evidence for Reading B, even if it doesn't solve Halting.

  **Current Proposal Status:** Proposal 1 claims to solve Halting. It offers no protocol for distinguishing its output from high-precision approximation over an unbounded input set. Therefore, it fails the verification requirement.

  **5. Comparison of Routes: Continuous State vs. Infinite Steps**

  Proposal 2 (the "Zeno Machine" completing infinitely many steps in finite time) raises a distinct but related issue.
  *   **Proposal 1 (Continuous State)** fails on **measurement precision**. The barrier is information-theoretic: we cannot read out infinite bits from a finite physical system.
  *   **Proposal 2 (Infinite Steps)** fails on **energy and causality**. The barrier is thermodynamic and relativistic: accelerating steps to complete a supertask generally requires infinite energy density or superluminal signaling.

  **Standing Test Implication:** Our standing test must cover both. It cannot simply ask "Does it compute?" It must ask "What physical resource bounds are you claiming to violate, and how will you measure that violation without assuming the very idealization you are testing?"

  **6. Avoiding Dogmatism: The Empirical Bet**

  The applicants are correct that declining this proposal is an empirical bet. We are betting that the universe respects the Physical CTT (Reading B). However, this is not a dogmatic bet; it is a bet based on the current consensus of physics (Quantum Mechanics and General Relativity), both of which impose fundamental limits on information density and signal propagation.

  We are not treating the CTT as unrevisable. We are treating the *standards of evidence* for revising it as unrevisable. To fund this proposal as written would be to fund a claim that is, by the applicants' own mathematical description, empirically undecidable in a finite timeframe. We can fund high-risk physics, but we cannot fund unfalsifiable claims.

  **7. What Evidence Would Change the Panel's Mind?**

  To be explicit for the record and for the applicants: We would reconsider funding if a proposal provided:
  1.  **A Noise Model:** A rigorous analysis showing how the device distinguishes a true real-valued state from a high-precision rational approximation under thermal/quantum noise.
  2.  **A Finite Prediction:** A specific, finite set of inputs where the device predicts an outcome that a standard Turing simulation (given equivalent energy/resources) cannot, *and* where the result can be independently verified by a non-oracle method (e.g., a mathematical proof for that specific case that the TM cannot derive in the allotted time).
  3.  **Resource Accounting:** A demonstration that the physical resources (energy, space, time) consumed do not scale exponentially with the input size in a way that hides the "hypercomputation" inside a physical impossibility.

  **8. Conclusion and Next Steps**

  **Decision:** Decline Proposal 1. The claim targets Reading B (Physical Limits), but the success criterion relies on an unverifiable idealization (infinite precision).

  **Standing Test:** Adopt the "Physical Verification Protocol." Future proposals in this family must specify a success criterion that is checkable by a hostile reviewer within finite resources. Specifically, they must demonstrate how the physical implementation distinguishes itself from a finite-precision approximation without appealing to the mathematical idealization they are trying to prove.

  **Time Frame:** This standing test applies immediately for the next cycle (Proposal 2). We will invite the Proposal 1 group to resubmit only if they can reformulate their success criterion to meet the Noise Model and Resource Accounting requirements listed above.

  We are not closing the door on hypercomputation. We are closing the door on claims that cannot, even in principle, be distinguished from magic by a finite observer.

  **Action Required:** Please review this reasoning prior to Thursday's call. I am particularly interested in the dissenting members' response to the distinction between "dogmatic refusal" and "evidentiary standards."
