  | **"Ethnic Cleansing" as a substitute label** | Resisted the term as a dangerous euphemism designed to evade liability. | Genocide is a process of pattern destruction, not merely physical expulsion. | Modern law treats it as Crimes Against Humanity, avoiding Genocide Convention obligations. | High (He fought consistently against linguistic dilution of legal responsibility). |
  | **1990s Tribunals' Jurisprudence** | Ambivalent; praised convictions but criticized the high bar for "intent." | Genocide is a coordinated plan (process), not just specific intent to kill bodies. | Courts require proof of intent to destroy physically, ignoring cultural imposition. | Medium (Jurisprudence evolved in ways he didn't foresee, but core tension remains). |
  | **Responsibility to Protect (R2P)** | Welcomed the doctrine in principle; wary of selective enforcement. | Sovereignty cannot shield the destruction of national patterns. | Intervention often triggered only by mass killing (*barbarity*), ignoring early cultural *vandalism*. | Medium (R2P is political; Lemkin was a legalist who distrusted state discretion). |
  | **Cultural Destruction as Genocide** | Welcomed as core genocide; rejected current legal exclusion of pure cultural acts. | "Vandalism" is half of the crime (*Barbarity* + *Vandalism*). | ICC/Convention treat cultural destruction as war crimes, not genocide. | High (Central to his definition in *Axis Rule in Europe*). |
