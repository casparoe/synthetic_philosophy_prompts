prompt: |-
  I run model risk for a mid-sized UK pension scheme — about £4–5bn, so we can't afford our own quants but we're big enough that getting this wrong ruins people's retirements. Every few weeks something lands on my desk with a probability attached: a longevity model that says a buy-in saves us 3% over ten years, a credit model that says a counterparty is 99.5% safe, a climate scenario that says the deficit widens by X by 2050 with 70% confidence. The investment committee treats the number as if the number is the number. I don't think that's right, and I want a procedure I can actually run in maybe half an hour before each paper goes up, which tells me whether the probability in front of me is decision-grade or whether I should be applying some sort of ambiguity penalty to it — and how big a penalty, or at least how to argue for one.

  Here's the raw material I've been chewing on, so you don't have to guess what I mean:

  - The two-urn thing everyone trots out. Urn A has 50 red and 50 black balls. Urn B has 100 balls, red and black in some unknown proportion. Most people will take a bet on red from A over red from B, and also take a bet on black from A over black from B — even though one of the two B bets has to come in, so you can't sensibly rate both of them below their A versions if you're being consistent. The interesting bit isn't that people are silly, it's that they seem to treat the known-odds urn as worth strictly more, per bet, than the unknown-odds one.
  - So people distinguish risk (odds you know) from ambiguity (odds you don't), and will often pay to avoid the second. There's a family of decision rules built on that: act as if the worst probability in your range is the true one and maximise the minimum expected payoff; or take a weighted blend of the best and worst case; or just bung a fudge factor on the discount rate. I don't need the maths, I need the discipline.
  - The counter-argument someone always raises at committee: if you're making hundreds of small independent ambiguous bets, the ambiguity washes out, and being averse to it is a costly emotional tic. That seems right for the trading book and obviously wrong for a one-shot £500m buy-in, and I've no principled way to draw the line between the two.
  - Also, and this is the bit that worries me most: sometimes ambiguity should make you *keener*, not less keen — if the downside is bounded, or if you're the one selling the ambiguous thing to someone else. I've caught our own papers doing this without noticing.

  What I want from you: a decision procedure, in words, that my team and I can run on a paper. The questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and says no (or says: this number isn't usable, come back with a range and a story about where the range comes from), and where it has to hand the decision to the committee because the question is about our risk appetite and not about the numbers at all. Then run it on two or three realistic cases — a longevity hedge priced off a brand-new model, and a novel asset class with no long history — including at least one where your procedure tells me something I won't want to hear, because I'd rather find that out now than in the meeting.

  Please be honest about where the procedure is just my prior dressed up as method, and say plainly what it can't do: cases where the ambiguity is about which model class is right rather than about a parameter, or where the committee is going to ignore it anyway, or where the "worst case in the range" isn't actually well-defined.

  Answer in British English. Plain prose and a list of steps is fine, no diagrams, and don't assume I know the names of any of this stuff.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Model Risk Manager for a mid-sized UK pension scheme (£4-5bn AUM).
      *   **Problem:** Investment Committee (IC) treats model outputs (probabilities, point estimates) as absolute truth ("the number is the number"). The user knows these numbers often carry significant ambiguity (unknown unknowns, model risk, parameter uncertainty) that isn't reflected in the output.
      *   **Goal:** A practical, 30-minute decision procedure to assess whether a probability/number is "decision-grade" or needs an "ambiguity penalty" (or range/story).
      *   **Key Concepts Mentioned:** Ellsberg Paradox (Two Urns), Risk vs. Ambiguity, Maxmin Expected Utility (worst-case), diversification argument (ambiguous bets washing out), asymmetry (ambiguity can be good sometimes).
      *   **Constraints:** British English, plain prose, no diagrams, no jargon without explanation, honest about limitations (where it's just prior dressed up, where it fails).
      *   **Deliverables:** A step-by-step procedure, applied to 2-3 realistic cases (including one unwelcome truth), and a section on limitations.

  2.  **Deconstruct the Core Problem:**
      *   The IC suffers from "illusion of validity." They see $P=0.995$ and think "safe."
      *   The Model Risk Manager sees $P=0.995$ derived from a model with weak data, structural assumptions, and potential regime shifts.
      *   The challenge is to quantify *ambiguity* (uncertainty about the probability itself) without getting bogged down in academic theory.
      *   The procedure needs to distinguish between *Risk* (known distribution) and *Ambiguity* (unknown distribution).
      *   It needs to address the "diversification" counter-argument (does this bet matter in isolation or as part of a book?).
      *   It needs to address the "asymmetry" point (is ambiguity good or bad for *us* specifically?).

  3.  **Drafting the Procedure (The "Ambiguity Stress Test"):**
      *   *Time limit:* Needs to be doable in 30 mins. So, max 5-6 questions.
      *   *Step 1: Provenance.* Where did the number come from? (Data depth, model age).
      *   *Step 2: Sensitivity/Robustness.* If we tweak assumptions, does the number break?
      *   *Step 3: Correlation/Concentration.* Is this a one-shot or part of a book? (Addressing the diversification argument).
      *   *Step 4: Payoff Asymmetry.* Who benefits if the model is wrong? (Addressing the "ambiguity can be good" point).
      *   *Step 5: The "Urns" Test.* Can we define the range of plausible probabilities?
      *   *Decision Rule:* If it fails specific steps, apply a penalty or demand a range.

  4.  **Refining the Steps (Iterative Polish):**
      *   *Step 1 (Data & Model Maturity):* Call it "The Rear-View Mirror Test." Is the data relevant to the future?
      *   *Step 2 (Alternative Specifications):* Call it "The Rival Model Test." Did they check other ways of doing it?
      *   *Step 3 (Exposure Concentration):* Call it "The Idiosyncratic Test." Is this bet unique or diversified?
      *   *Step 4 (Direction of Error):* Call it "The Pain Test." If the model is wrong, does it hurt us or help us?
      *   *Step 5 (The Verdict):* Green (use number), Amber (use range/penalty), Red (reject number).

  5.  **Developing the Case Studies:**
      *   *Case 1: Longevity Buy-in (The classic pension risk).* New model, high stakes. Likely needs a penalty.
      *   *Case 2: Novel Asset Class (e.g., Infrastructure Debt or Crypto-adjacent).* No history. High ambiguity.
      *   *Case 3 (The Unwelcome Truth):* Something where the procedure suggests we *should* take the risk, or where the "safe" option is actually more ambiguous. Let's make it a Counterparty Credit Risk case where the "safe" AAA rated counterparty actually has higher model ambiguity than a smaller, transparent one. Or better, a case where the procedure reveals the IC's "diversification" argument is invalid because the risks are correlated. Let's go with a *Climate Scenario* where the "70% confidence" is meaningless because the model class is wrong.
      *   *Selection:*
          1.  Longevity Swap (High impact, model risk).
          2.  Private Credit/Infrastructure (Novel asset, data scarcity).
          3.  The "Unwelcome Truth": A Sovereign Bond or "Risk-Free" asset where the model assumes stability that doesn't exist, or perhaps a case where the ambiguity *favors* us (selling volatility), but we are treating it as a risk. Let's choose a case where the procedure forces us to admit the "safe" hedge is actually the risky one due to liquidity ambiguity.
          *Decision:* Let's stick to the prompt's suggestion: Longevity, Novel Asset, and one where the answer is "You're wrong about the diversification."

  6.  **Addressing the Limitations (Honesty Check):**
      *   This isn't math; it's governance.
      *   It relies on the team being honest.
      *   It can't solve "Knightian Uncertainty" (unknown unknowns).
      *   It can't force the IC to listen.
      *   It assumes we can define a "worst case" (sometimes we can't).

  7.  **Tone and Style:**
      *   British English (programme, centre, colour, £, "committee", "modelling").
      *   Professional, pragmatic, slightly cynical but constructive.
      *   Avoid academic jargon (no "Maxmin Expected Utility", just "plan for the worst plausible outcome").

  8.  **Drafting the Content (Mental Walkthrough):**
      *   *Intro:* Acknowledge the pressure. £5bn is big money, small team.
      *   *The Procedure:* "The Ambiguity Stress Test." 5 Questions.
      *   *The Scoring:* Green/Amber/Red.
      *   *The Cases:*
          *   Longevity: Model is new. Data is historical, future is medical tech. Verdict: Amber. Apply penalty.
          *   Novel Asset (e.g., Biodiversity Credits): No history. Verdict: Red. Don't use the number.
          *   Unwelcome Truth: A "diversified" book of derivatives where correlation breaks down. The procedure shows the diversification argument fails.
      *   *Limitations:* Model class risk, political reality, false precision.

  9.  **Refining the "Unwelcome Truth":**
      *   The prompt asks for a case where the procedure tells me something I won't want to hear.
      *   Idea: We are selling ambiguity. The procedure says "This looks great, the ambiguity is in our favour." But ethically or reputationally, we shouldn't do it.
      *   Better Idea: The procedure reveals that our "safe" liability matching portfolio relies on a model with *more* ambiguity than the growth assets we criticize. That hurts. Let's go with that. The LDI (Liability Driven Investment) model assumes liquidity that doesn't exist in stress.

  10. **Final Review against Constraints:**
      *   British English? Yes.
      *   Plain prose? Yes.
      *   No diagrams? Yes.
      *   Honest about limitations? Yes.
      *   30-minute feasible? Yes.

  11. **Writing the Response:** (Self-Correction during drafting: Ensure I don't sound like I'm selling a magic bullet. Emphasize that this is a *conversation starter*, not a calculator.) *Make sure to explicitly address the "diversification washes out" argument in the procedure.* *Make sure to address the "ambiguity can be good" point.*

      *(Self-Correction on Case 3)*: Let's make Case 3 about the "Diversification" argument. The IC says "We have 100 small ambiguous bets, so it's fine." The procedure reveals they are all correlated to the same underlying factor (e.g., interest rates), so they aren't independent. That's a hard truth.

      *(Refining the Procedure Steps)*:
      1. Data Relevance (Past vs Future).
      2. Model Disagreement (Range of outputs).
      3. Independence (Diversification check).
      4. Asymmetry (Who loses if wrong?).
      5. The "Urns" Classification (Risk vs Ambiguity).

      Let's finalize the structure.
      - Intro: Validation of the problem.
      - The Procedure: "The Ambiguity Stress Test".
      - The Cases: Longevity, Private Assets, The "Diversification" Lie.
      - The Limitations: Where this breaks.
      - Closing: Encouragement.

      *Wait, one detail:* The prompt asks for "where the procedure stops and says no... and where it has to hand the decision to the committee." I need to make sure the procedure has explicit exit points.

      *Okay, let's write.*
answer: |-
  You are describing the central tension of institutional investment: the gap between the precision of the spreadsheet and the vagueness of the future. You are right to be worried. When a committee sees "99.5%", they see safety. When you see "99.5%", you should see "a number derived from a model that might be structurally broken."

  You do not need more complex mathematics. You need a governance filter. You need a way to force the conversation away from the *value* of the number and towards the *quality* of the number.

  Below is a procedure designed for your constraints. It is not a model; it is a checklist for a 30-minute review. It draws on the logic you described (Ellsberg, ambiguity aversion, asymmetry) but translates it into questions your team can answer without a PhD.

  ### The Ambiguity Stress Test

  **Time required:** 30 minutes per paper.
  **Who runs it:** You and one senior investment analyst (not the person who built the model).
  **Output:** A traffic light rating (Green, Amber, Red) and a specific instruction on how to present the number to the Committee.

  #### Step 1: The Rear-View Mirror Test (Data Relevance)
  **Question:** Is the data used to calibrate this probability drawn from a regime that still exists?
  *   **Look for:** Interest rate environments, mortality trends, or credit cycles that have structurally shifted.
  *   **Pass:** The data covers at least one full stress cycle relevant to the bet (e.g., includes 2008 for credit, includes post-2020 for inflation).
  *   **Fail:** The data is short, or the world has changed fundamentally (e.g., using pre-2020 longevity data for a 2050 projection without adjusting for medical tech acceleration).
  *   **Action:** If Fail, the probability is not usable as a point estimate. It must be presented as a range.

  #### Step 2: The Rival Model Test (Specification Uncertainty)
  **Question:** If we changed the model structure but kept the data, would the number move materially?
  *   **Look for:** Evidence that the proposer has tried a different method (e.g., a different statistical distribution, a different economic driver).
  *   **Pass:** They have run a sensitivity analysis or a rival model, and the results cluster tightly around the headline number.
  *   **Fail:** The number is unique to this specific model class. No alternative specifications were tested.
  *   **Action:** If Fail, apply an "Ambiguity Penalty." You do not need to calculate the exact penalty yet; simply flag that the headline number is the *best case* of the model class, not the *expected* case.

  #### Step 3: The Independence Test (The Diversification Check)
  **Question:** Is this bet truly independent of other ambiguous bets we hold?
  *   **Look for:** The Committee argument that "ambiguity washes out across hundreds of bets."
  *   **Pass:** The risk drivers are idiosyncratic (e.g., specific property tenancy risk).
  *   **Fail:** The ambiguity is driven by a common factor (e.g., all "novel" assets rely on the same liquidity assumptions, or all credit models rely on the same rating agency data).
  *   **Action:** If Fail, the diversification argument is void. Treat this as a concentrated, one-shot bet. The ambiguity does *not* wash out.

  #### Step 4: The Pain Test (Asymmetry)
  **Question:** If the probability is wrong, who loses and how much?
  *   **Look for:** Bounded vs. unbounded downside.
  *   **Pass:** Downside is capped (e.g., we are selling an option where we keep the premium, max loss is known). Here, ambiguity might be acceptable or even favourable.
  *   **Fail:** Downside is open-ended or threatens funding levels (e.g., a longevity swap where we pay if people live longer, and there is no cap).
  *   **Action:** If Fail and Step 1 or 2 was a Fail, the number is Red. Do not use it for decision-making without a capital buffer.

  #### Step 5: The Urn Classification
  **Question:** Are we betting on Urn A (known odds) or Urn B (unknown odds)?
  *   **Synthesis:**
      *   **Green (Urn A):** Steps 1 & 2 Pass. Data is robust, model is stable. Use the number, but disclose confidence intervals.
      *   **Amber (Urn B, Diversified):** Steps 1 or 2 Fail, but Step 3 Pass (independent bets). Use the number but apply a discount rate uplift or hair cut (e.g., reduce expected return by 1–2%).
      *   **Red (Urn B, Concentrated):** Steps 1 or 2 Fail, AND Step 3 Fail (correlated ambiguity) OR Step 4 Fail (unbounded downside). **Stop.** The number is not decision-grade. Return to the proposer with a request for a scenario range (Best/Mid/Worst) and a narrative on why the Mid case is plausible.

  ---

  ### Running the Procedure: Three Cases

  Here is how this plays out on your desk, including the uncomfortable truth.

  #### Case 1: The Longevity Buy-In
  **The Paper:** A proposal to hedge 40% of scheme longevity risk. The insurer's model says there is a 90% probability the hedge saves money over 10 years vs. self-insuring. The model uses 30 years of mortality data.
  **The Review:**
  *   **Step 1 (Rear-View):** Fail. 30 years of mortality data does not capture the risk of a breakthrough in cancer treatment or anti-aging tech over the next 30 years. The past is not a guide to the future here.
  *   **Step 2 (Rival Model):** Amber. They have tested different mortality improvement scales, but all are from the same family of models.
  *   **Step 3 (Independence):** Pass. This is a single large bet, but it's not correlated to our equity ambiguity.
  *   **Step 4 (Pain):** Fail. If people live much longer than expected, the deficit widens significantly. Downside is material to funding.
  *   **Verdict:** **Amber/Red.**
  *   **Instruction:** Do not present "90% probability." Present a range: "Savings between -5% and +8% depending on medical innovation." Tell the Committee: "The model knows the past, not the future. We are paying for certainty we don't have. We must apply a 2% capital buffer against the model price."

  #### Case 2: The Novel Asset (Infrastructure Debt)
  **The Paper:** Investment in a new infrastructure fund. Credit model says 99.5% probability of no default. History of the specific asset class: 5 years.
  **The Review:**
  *   **Step 1 (Rear-View):** Fail. 5 years is not a credit cycle. It is a bull market.
  *   **Step 2 (Rival Model):** Fail. The model is proprietary to the fund manager. No independent validation.
  *   **Step 3 (Independence):** Fail. We hold other private credit. If liquidity dries up, all of them suffer together.
  *   **Step 4 (Pain):** Fail. Default means loss of capital.
  *   **Verdict:** **Red.**
  *   **Instruction:** The "99.5%" is noise. It is scientifically meaningless. Do not put this number in the Committee pack. It misleads. Instead, present a stress test: "If defaults reach 5% (consistent with high-yield stress), what happens to the scheme?" If the scheme survives, invest. If not, pass. The probability number itself is banned.

  #### Case 3: The Unwelcome Truth (The "Diversified" Derivatives Book)
  **The Paper:** A report on our hedging book. We hold 200 small interest rate swaps with different counterparties. The risk model says counterparty risk is negligible because the exposures are small and diversified. The probability of simultaneous failure is near zero.
  **The Review:**
  *   **Step 1 (Rear-View):** Pass. Credit data is long.
  *   **Step 2 (Rival Model):** Pass. Standard credit metrics used.
  *   **Step 3 (Independence):** **Fail.** This is the trap. The ambiguity isn't about whether the banks default; it's about whether we can *collateralise* the positions in a stress. In a 2022-style LDI crisis, correlation goes to one. Everyone needs cash at once. The "independent bets" become a single bet on market liquidity.
  *   **Step 4 (Pain):** Fail. If we cannot post collateral, we are forced to unwind at the bottom.
  *   **Verdict:** **Red.**
  *   **Instruction:** This is the truth you won't want to hear. Your procedure tells you that the Committee's comfort ("it's diversified") is wrong. The ambiguity is systemic. You must recommend a larger liquidity buffer than the model suggests. The model assumes you can trade in a crisis; the ambiguity says you cannot. You have to tell the Committee their "risk-free" hedge carries hidden liquidity risk that the probability number hides.

  ---

  ### Limitations: Where This Procedure Fails

  I must be honest about where this is just your prior dressed up as method, and where it will not save you.

  **1. Model Class Uncertainty (The "Unknown Unknown")**
  This procedure assumes we can identify when a model is weak (Step 2). It cannot detect when the *entire class* of models is wrong. For example, before 2008, almost all credit models agreed with each other. They all passed Step 2. They were all wrong because they assumed housing prices wouldn't fall nationally. This test filters out *sloppy* ambiguity, not *systemic* delusion. If the whole industry is betting on Urn B thinking it is Urn A, this test might still give it an Amber.

  **2. The "Worst Case" Problem**
  In Step 5, I suggest asking for a range. Sometimes, there is no well-defined worst case. In climate modelling or geopolitical risk, the "worst case" might be insolvency of the state. If the worst case is "the scheme ceases to exist," it is not a useful number for decision-making. In these cases, the procedure stops at "Red," but it cannot tell you what to do instead. That is a strategic question, not a risk question.

  **3. Committee Will**
  This is the hardest pill. You can produce the most rigorous Ambiguity Stress Test in the City of London, and if the Committee Chair wants to chase yield, they will treat your "Red" rating as a "Challenge to be overcome." They will ask the consultant to tweak the model until it turns Green. This procedure gives you ammunition to defend yourself ("I told you it was Urn B"), but it does not give you authority to veto. It protects your professional standing, not necessarily the fund.

  **4. The Ambiguity Premium**
  Sometimes, ambiguity *is* the opportunity. If everyone else is ambiguity-averse, they sell cheap. My Step 4 (Pain Test) tries to catch this, but it is crude. If we are selling protection, ambiguity is our friend. The procedure might flag this as Red because the model is unproven, when actually it is a good trade because the price compensates for the ambiguity. You will need to override the test here using commercial judgement. The test is a brake, not the steering wheel.

  ### Final Advice

  Print the five steps. Keep them on one side of A4. When a paper lands on your desk, highlight the answers in yellow.

  When you go to the Committee, do not say "The model is wrong." Say "The model is precise, but the inputs are ambiguous. We are betting on Urn B, not Urn A."

  If they insist on treating Urn B as Urn A, ensure the minutes record that Model Risk advised an ambiguity penalty was required but was not applied. That is the only protection you have when the retirement money is on the line.
