          *   Normative facts disguised as descriptive ('policy makes people worse off').
      *   **Format:** A "menu" with verdicts, not a history lesson.

  2.  **Deconstruct "You Can't Get an Ought from an Is":**
      *   This phrase is a slogan, not a precise theorem. It needs unpacking.
      *   *Claim 1: Logical Entailment.* Purely descriptive premises cannot logically entail a normative conclusion *without* a normative rule.
      *   *Claim 2: Semantics/Meaning.* Moral terms refer to non-natural properties or have a different function than descriptive terms (Non-Cognitivism vs. Naturalism).
      *   *Claim 3: Epistemology.* Empirical observation alone cannot justify moral beliefs.
      *   *Claim 4: Motivation.* Beliefs about facts don't motivate; desires/normative judgments do (Humean Theory of Motivation).

  3.  **Evaluate Each Claim (Drafting the Content):**

      *   **1. Formal Entailment (Logic):**
          *   *Claim:* No set of purely descriptive premises entails a normative conclusion.
          *   *Verdict:* **Trivially True** (in classical logic). If the conclusion contains a operator (Ought) not in the premises, it's invalid *unless* there's a bridge principle.
          *   *Does it help the colleague?* Only if they insist *no* bridge principles exist. But we always use bridge principles (e.g., "If it causes harm, don't do it").
          *   *Loophole:* The "bridge principle" itself might be hidden.

      *   **2. Semantics (Meaning):**
          *   *Claim:* Moral words (*ought*, *good*) mean something fundamentally different from descriptive words (*is*, *red*). (Non-Naturalism or Non-Cognitivism).
          *   *Verdict:* **Contested/False** (depending on meta-ethics). Moral Naturalists say 'good' *just means* 'conducive to flourishing'. If so, you *can* get an ought from an is.
          *   *Does it help the colleague?* Yes, if they assume Non-Naturalism. But that's a substantive philosophical commitment, not a logical truth.

      *   **3. Epistemology (Justification):**
          *   *Claim:* Empirical data alone cannot justify a moral conclusion.
          *   *Verdict:* **False** (too strong). Empirical data + a moral principle = justified conclusion. Data is *necessary* even if not *sufficient*.
          *   *Does it help the colleague?* It shuts down empirical work *if* they pretend principles aren't needed. But the user's argument (biased data -> fix it) relies on a hidden principle (bias is bad/unfair).

      *   **4. Motivation (Psychology):**
          *   *Claim:* Factual beliefs don't motivate action; only desires/normative judgments do.
          *   *Verdict:* **Debatable** (Internalism vs. Externalism).
          *   *Does it help the colleague?* It suggests knowing the bias exists isn't enough to *move* you to fix it. But the user is arguing we *ought* to fix it, not that we *will*.

  4.  **Address the Specific Loopholes/Scenarios:**
      *   *Thick Concepts:* 'Bad friend' looks descriptive but is evaluative. If 'bad friend' entails 'ought not be friends', the gap closes.
      *   *Reverse Direction:* Can you get an Is from an Ought? If 'I ought to pay' implies 'I believe I ought to pay' (psychological fact) or 'There is a reason' (normative fact). Usually, Ought implies Can (Kant), which is an Is.
      *   *Inference vs. Premises:* The gap is often just a missing premise. If you make the premise explicit ("Suffering is bad"), the inference is valid. The slogan hides the premise.
      *   *Normative Descriptions:* 'Makes people worse off'. Is this an Is or an Ought? It's often a "thick" fact. If 'worse off' is purely descriptive (preference satisfaction), you still need "you ought not make people worse off." If 'worse off' is inherently bad, it's already normative.

