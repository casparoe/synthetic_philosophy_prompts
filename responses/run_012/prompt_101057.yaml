answer: |-
  ### Brainstorming: Requirements vs. Prejudices

  Before we codify the axiology, we must filter our intuitions. We are looking for constraints that any theory of *distributive justice* must meet to be intelligible, not constraints that merely secure a victory for one ideological camp.

  **Candidate Desiderata:**
  *   *Maximize Total Welfare:* A substantive commitment, not a formal requirement. (Prejudice: Utilitarian)
  *   *Strict Equality:* A substantive commitment. (Prejudice: Egalitarian)
  *   *Rights Constraints:* Deontological side-constraints, not axiological rankings of states. (Category Error)
  *   *Transitivity/Completeness:* If the theory cannot rank states consistently, it is not a theory. (Genuine Requirement)
  *   *Anonymity:* Justice should not depend on *who* holds a position, only on the pattern. (Genuine Requirement)
  *   *Sensitivity to Well-being:* A distribution of "justice" must track something good for people. (Genuine Requirement)
  *   *The Leveling Down Objection (LDO):* Often treated as a knock-down argument against egalitarianism. However, we must distinguish whether this is a constraint on *action* (don't do it) or *value* (the state isn't better). (Genuine Requirement, but needs specification).
  *   *Person-Affecting Intuition:* Badness must be bad for someone. (Genuine Requirement, but contested).

  **Sorting:**
  We discard "Maximize Total Welfare" and "Strict Equality" as substantive outputs, not input criteria. We retain **Formal Coherence**, **Anonymity**, **Pareto Efficiency**, **The Person-Affecting Restriction**, **The Non-Causal Leveling Down Constraint**, and **The Egalitarian Intuition**. Note that the last three are in tension; retaining them all in the "settled" list is deliberate, as their incompatibility is the engine of the seminar.

  ***

  ### The Settled List: Criteria for a Distributive Axiology

  **1. The Criterion of Formal Coherence**
  *   **Statement:** The theory must generate a complete and transitive ranking of all possible distributions.
  *   **Motivation:** A theory that yields cycles (A is better than B, B better than C, C better than A) or refuses to compare feasible options fails to guide judgment. It must explain the phenomenon of *choice* under constraint.

  **2. The Criterion of Anonymity (Impartiality)**
  *   **Statement:** The evaluation of a distribution must not depend on the specific identities of the individuals occupying the positions within it.
  *   **Motivation:** This captures the fundamental moral idea that justice is blind to status. If we swap the well-being levels of two persons, the value of the distribution remains unchanged. It prevents the theory from collapsing into favoritism or caste-based evaluation.

  **3. The Pareto Principle (Weak)**
  *   **Statement:** If at least one person is better off in Distribution A than in Distribution B, and no one is worse off, then A is better than B.
  *   **Motivation:** This respects the minimal constraint of rational benevolence. A theory that ranks a state where everyone is identical as *worse* than a state where some are better off (and none worse) is disconnected from human good. It ensures the theory respects gains.

  **4. The Person-Affecting Restriction (PAR)**
  *   **Statement:** A distribution cannot be worse (or better) than another unless there is at least one person for whom it is worse (or better).
  *   **Motivation:** This handles your **first distinction** (Worse Off vs. Unequal). It demands that value be grounded in value *for people*. It blocks the claim that a state is bad *merely* because it is unequal if that inequality harms no one relative to the alternative. It forces the theory to explain *who* is victimized by injustice.
  *   **Presupposition:** This presupposes that "badness" must be cashed out in terms of individual welfare comparisons.

  **5. The Non-Causal Leveling Down Constraint (NCLDC)**
  *   **Statement:** A distribution in which some are worse off and no one is better off cannot be ranked as *better* (all-things-considered) than the original distribution.
  *   **Motivation:** This handles your **second distinction** (Causal vs. Non-Causal LDO).
      *   *Causal Reading:* "It is wrong to *act* to level down." (A constraint on agency).
      *   *Non-Causal Reading:* "The resulting *state of affairs* is not better." (A constraint on axiology).
      *   This criterion adopts the **Non-Causal Reading**. If a theory implies that a leveled-down state is *in any way better* (even *pro tanto*), it implies there is value in equality that is independent of human good. This criterion demands the theory deny that the leveled-down state is better in any respect relevant to the all-things-considered ranking. It prevents the theory from positing "floating" value detached from human welfare.

  **6. The Egalitarian Intuition (Distribution Sensitivity)**
  *   **Statement:** All else being equal, a more equal distribution is preferable to a less equal one; transfers from better-off to worse-off persons (preserving rank) constitute an improvement.
  *   **Motivation:** Since this is a seminar on *distributive* justice, a theory that is indifferent to patterns (like strict Utilitarianism) fails to explain the specific phenomena of justice. It must capture the intuition that inequality is a distinctive moral problem, not just a side effect of low total welfare.

  ***

  ### Testing the List: The Plateau Case

  **The Case:** We can raise a badly-off group from 20 to 30, but only by imposing a small loss on a much better-off group, from 90 to 88. There is no other way to help the worse-off.

  **Application of Criteria:**
  *   **Formal Coherence & Anonymity:** The theory must yield a verdict regardless of who is in which group.
  *   **Pareto:** Does not apply. One group gains, one loses. The principle is silent.
  *   **Person-Affecting Restriction:** Satisfied. The move is not "merely unequal"; the worse-off group is genuinely better off. The better-off group is genuinely worse off. The theory must weigh these personal impacts.
  *   **Non-Causal LDO:** Satisfied. This is not a leveling-down case; someone is helped. The constraint does not forbid the move.
  *   **Egalitarian Intuition:** Strongly supports the move. The gap shrinks from 70 to 58.

  **Verdict:** The list does not dictate the outcome, but it structures the debate. A theory satisfying this list must explicitly weigh the **Egalitarian Intuition** (favoring the move) against the **Pareto-sensitive concern** for the loss suffered by the 90s (which Pareto itself doesn't forbid, but which welfarism notes). The list successfully isolates the trade-off: it is a conflict between the magnitude of the loss to the better-off and the moral weight of the gain to the worse-off (amplified by equality). It prevents the debate from stalling on whether the move is "permissible" in a causal sense; it forces a ranking of the states.

  ***

  ### The Impossibility Result

  I must flag that a subset of these desiderata cannot be jointly satisfied. Specifically, **The Person-Affecting Restriction (4)**, **The Non-Causal Leveling Down Constraint (5)**, and **The Egalitarian Intuition (6)** form an inconsistent triad when the Egalitarian Intuition is interpreted as claiming inequality is *intrinsically* bad.

  1.  If **Inequality is Intrinsically Bad** (Strong reading of 6), then a Leveled-Down state (Equal, Lower) is *better* in one respect (Equality) than an Unequal, Higher state.
  2.  If it is better in one respect, a theory must account for that value. If that value is sufficient to make it *all-things-considered* better, it violates the **Non-Causal Leveling Down Constraint (5)**.
  3.  If the theory claims it is *pro tanto* better but all-things-considered worse, it still posits a value (equality) that exists even though **The Person-Affecting Restriction (4)** is violated (no one is better off in the Leveled-Down state).

  **The Exclusionary Requirement:**
  The **Non-Causal Leveling Down Constraint (5)** does the most work in excluding otherwise attractive theories. It is the specific criterion that rules out **Telic Egalitarianism** (the view that inequality is intrinsically bad). It forces egalitarians to become **Deontic Egalitarians** (inequality is only bad if it involves unfair treatment) or **Prioritarians** (we should help the worse off, not because equality is good, but because gains to them matter more). It demands that all value in a distribution be anchorable in someone's good.

  ***

  ### Theoretical Scorecard

  *   **Utilitarianism:** Satisfies PAR and NCLDC easily, as it only values total sums; however, it fails the Egalitarian Intuition, as it is indifferent to distribution patterns unless they affect the total.
  *   **Telic Egalitarianism:** Satisfies the Egalitarian Intuition robustly but fails the Non-Causal Leveling Down Constraint, as it must admit the leveled-down state is better in at least one respect.
  *   **Prioritarianism:** Successfully satisfies PAR and NCLDC while capturing the spirit of the Egalitarian Intuition by weighting gains to the worse off more heavily, without positing intrinsic value in equality itself.
  *   **Sufficientarianism:** Satisfies NCLDC and PAR, but struggles with the Egalitarian Intuition and Pareto in cases above the sufficiency threshold, where it may become indifferent to significant inequalities.
