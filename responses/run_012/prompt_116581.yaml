answer: |-
  ### Brainstorming Mechanics

  Before settling on the final design, I considered three approaches to simulating the tension between branch counting and amplitude weighting.

  1.  **The "Russian Roulette" Elimination:** Students bet on outcomes; those on the losing branch sit down and are "out."
      *   *Rejection:* This reinforces collapse intuitions. In Many-Worlds (MWI), no one is eliminated; everyone persists in some branch. Elimination suggests only one outcome is real, which undermines the specific ontological confusion we want to provoke.
  2.  **The "Coupon Market":** Students trade shares in different outcomes. The price of the share is determined by the group.
      *   *Rejection:* This turns the session into an economics exercise. The friction becomes about market dynamics and negotiation rather than the metaphysical tension of self-location and measure. It adds too much noise.
  3.  **The "Sequential Split" (Tree) Game:** A measurement sequence where one outcome terminates and the other triggers a further split. This creates a mismatch between the *number of final branches* (3) and the *quantum weights* (1/2, 1/4, 1/4).
      *   *Selection:* This is the strongest candidate. It isolates the variable we care about: the count of distinct histories versus the squared modulus of the amplitudes. It allows for a physical representation of "weight" (using the number of students) without revealing it until after the bet is placed.

  **Selected Design:** **The Sequential Split (Tree) Game.**
  **Reasoning:** It requires minimal equipment, relies on physical movement to represent "measure," and creates a mathematical conflict (1/3 vs 1/2) that is immediate and undeniable once the payout is revealed. It forces students to choose between a topological intuition (counting paths) and a dynamical one (unitary evolution).

  ---

  ### Session Plan: The Branching Wager

  **Target:** 16 Final-Year Undergraduates
  **Duration:** 90 Minutes
  **Room:** A seminar room with space for students to move into three distinct corners/groups.

  #### Materials
  *   **Betting Slips:** 16 per student (small cards).
  *   **Quantum Credits (QC):** 100 tokens per student (coloured poker chips or printed paper vouchers).
  *   **Outcome Boxes:** 3 labelled boxes/baskets (Alpha, Gamma, Delta).
  *   **The "Universe" Deck:** A set of cards for the instructor to determine outcomes (rigged to match Born Rule frequencies for the simulation).
  *   **Whiteboard:** To record odds and payouts.

  #### Roles
  *   **The Instructor (The Universe):** You do not lecture. You facilitate the splits, collect bets, and enforce payouts.
  *   **The Students (The Observers):** They are the wavefunction components. They bet, they split, they collect.

  #### Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup & Calibration** | Distribute tokens (100 QC each). Explain the betting rules. **Crucial:** Do not mention MWI, amplitudes, or probability theory. Tell them: *"We are simulating a process where all outcomes occur. You will place bets on which outcome you experience. Your goal is to maximise your final QC."* |
  | **10–25** | **Round 1 (Equal Split)** | **Scenario:** A single measurement with two outcomes (Heads/Tails). <br> **Action:** Students bet. You flip a coin. 50% of students (randomly selected by you) go to "Heads" corner, 50% to "Tails". <br> **Payout:** Winners double their stake. <br> **Goal:** Establish trust in the mechanism. |
  | **25–45** | **Round 2 (The Trap)** | **Scenario:** Sequential Measurement. <br> 1. Measurement 1: Outcome **Alpha** (Stop) or **Beta** (Continue). <br> 2. If Beta: Measurement 2: Outcome **Gamma** or **Delta**. <br> **Instruction:** Tell them: *"Measurement 1 is a 50/50 split. If you land in Beta, Measurement 2 is also a 50/50 split."* <br> **The Bet:** Students must distribute their QC across the three final boxes: **Alpha**, **Gamma**, **Delta**. <br> **The Silence:** Do not tell them how many students will end up in each box yet. Let them reason. |
  | **45–55** | **The Split** | **Action:** Reveal the physical reality. <br> 1. Call out "Alpha": 8 students (50%) must move to the Alpha corner. <br> 2. Call out "Beta": 8 students remain. <br> 3. Split the Beta group: 4 to Gamma, 4 to Delta. <br> **Result:** There are now **3 groups** of students. But the sizes are **8, 4, 4**. |
  | **55–60** | **The Payout** | **Action:** Collect bets. Pay out based on the *number of students* in the group (representing amplitude weight). <br> **Rule:** "The payout multiplier for a box is proportional to the number of observers in it." <br> **Shock:** Those who bet 1/3 on each (counting branches) will see that Alpha paid out double what Gamma/Delta paid out. |
  | **60–90** | **Debrief** | **Discussion:** Unpack the tension. Map the activity to the Born Rule problem. (See detailed guide below). |

  #### Payoff Scheme (No Real Money)
  *   **Currency:** Quantum Credits (QC).
  *   **Prize:** The student with the most QC at the end receives a tangible reward (e.g., a copy of David Wallace's *The Emergent Multiverse*, a bottle of wine, or a voucher).
  *   **Round 2 Payout Logic:**
      *   If a student bet 10 QC on **Alpha**: They receive $10 \times (8/4) = 20$ QC.
      *   If a student bet 10 QC on **Gamma**: They receive $10 \times (4/4) = 10$ QC.
      *   *Note:* This simulates the Born Rule ($| \alpha |^2 = 1/2$, $| \beta |^2 = 1/4$). The "Branch Counters" who bet 33 QC on each will end up with less than those who bet 50 on Alpha and 25 on the others.

  ---

  ### The Debrief Guide (60–90 Minutes)

  This is the most critical section. Do not start by explaining the theory. Start by asking them about their feelings during the bet.

  **1. Eliciting the Intuition (60–70 mins)**
  *   **Ask:** "In Round 2, how many of you treated Alpha, Gamma, and Delta as equally likely? Who put 1/3 of their credits on each?"
  *   **Ask:** "Why did you do that?" (Expect answers like: "There were three boxes," "It was a tree with three ends," "I didn't know which version of me I'd be.")
  *   **Ask:** "When you saw 8 people in Alpha and only 4 in Gamma, how did that feel?"
  *   **Point:** You have just isolated the **Branch Counting Intuition**. You felt that because there were three distinct outcomes, they should count equally.

  **2. Mapping to the Theory (70–80 mins)**
  *   **Name the Problem:** "You have just run into the **Incoherence Problem** of the Many-Worlds Interpretation."
  *   **The Map:**
      *   **The Three Boxes:** These are the "Worlds" or "Branches."
      *   **The Number of Students in Each Corner:** This represents the **Squared Amplitude (Measure)**.
      *   **Your Betting Slip:** This represents your **Credence** (degree of belief).
  *   **The Conflict:** "In a collapse theory, only one box is real. In MWI, *all* boxes are real. If all are real, why shouldn't you care about them equally? Why does the 'number of students' (amplitude) matter if the 'number of boxes' (branches) is what defines reality?"
  *   **The Seduction:** "Your intuition told you: 3 branches = 1/3 probability. This is **Indifference Principle** reasoning. If I don't know which branch I'm in, and they are all real, I should be indifferent."
  *   **The Punishment:** "But the payout rules (the physics) favoured the branch with more 'students' (higher amplitude). If you stick to branch counting, you are **rationally exploitable**. A bookie who knows the Born Rule can take your money every time."

  **3. Candid Limitations (80–90 mins)**
  *   **What this activity DID NOT do:**
      *   **It did not derive the Born Rule:** I (the instructor) *stipulated* the payout ratios based on the number of students. In real quantum mechanics, there is no instructor deciding the payout. The theory must *generate* the probabilities from the deterministic equations alone. This activity smuggled the weights in via the physical grouping of students.
      *   **It assumed discrete branches:** Real unitary evolution doesn't always split into neat integers (1 vs 2 branches). The "number of branches" is often ill-defined in continuous Hilbert space.
      *   **It simulated uncertainty, not ontology:** You felt uncertainty about where you would go. In strict MWI, *all* versions exist. The uncertainty is self-locating ("Which one am I?"). The game forces you to care about *measure*, but it doesn't explain *why* rational agents should care about measure rather than branch count.
  *   **Your Job:** "You must now go away and read the **Deutsch-Wallace Theorem**. It attempts to prove that if you are a rational agent in a branching universe, you *must* bet according to the Born Rule, or you violate decision-theoretic axioms. This game showed you *that* there is a problem; the theorem tries to solve it."

  ---

  ### Troubleshooting: Predictable Failures

  **1. The "Refuser" (The Ontological Objector)**
  *   **Behaviour:** A student refuses to bet, stating, "MWI isn't true, so this is pointless," or "I won't participate in a falsehood."
  *   **Handling:** "I am not asking you to believe MWI is true. I am asking you to test its *internal consistency*. If this interpretation is to work, how must probability function within it? Treat this as a logic puzzle, not a creed."

  **2. The "Spoiler" (The Over-Prepared Student)**
  *   **Behaviour:** A student who has read ahead announces in Round 2: "Alpha is 50%, the others are 25%. I'm betting accordingly."
  *   **Handling:** Do not shame them. Use them. "Excellent. Can you explain to the group *why*? Is it because there are fewer branches? No. It's because of the unitary history. Does everyone agree with their calculation?" This forces the class to articulate the unitary argument vs. the counting argument.

  **3. The "Gambler" (The Frequency Confusion)**
  *   **Behaviour:** "But if we only run this once, the odds don't matter. I'll just bet on Gamma and hope I get lucky."
  *   **Handling:** "In a single trial, yes. But physics is about policy. If you adopt a policy of branch-counting, you will lose resources over repeated interactions. We are testing the rationality of the *policy*, not the luck of the *draw*."

  **4. The "Rigged" Accusation**
  *   **Behaviour:** "You made 8 people go to Alpha. You could have made 4. The game is rigged."
  *   **Handling:** "Exactly. In the real world, the 'rigging' is done by the Schrödinger equation, not me. The question is: why does the equation rig it this way? If the world splits into three, why does the equation put more 'stuff' in one branch than the others? That is the mystery you are holding."

  ### Teacher's Note on Tone
  Maintain a Socratic distance. During the betting phase, if asked "What are the odds?", reply only with: "What do the rules of the universe suggest?" or "Check your unitary evolution notes." Do not validate the branch-counting intuition, but do not correct it until the payout reveals the discrepancy. Let the loss of Quantum Credits do the teaching.
