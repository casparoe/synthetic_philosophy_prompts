      *   *Recommendation:* Drop the universal claim in (1). Keep Synchronic focus, but allow Intransitivity. Re-frame Sophistication as pragmatic prudence rather than rational requirement.

      *   *Wait, check View 3 again:* "The irrationality lives in the preferences they walked in with." If View 4 says some intransitive prefs are rational, then View 3 must be qualified: "The irrationality lives in the preferences... *unless* those intransitivities stem from incommensurability."

