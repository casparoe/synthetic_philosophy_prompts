answer: |-
  # Exam Question: Fairness in Machine Learning (Seminar Final)

  **Question 4 (25 Marks, 60 Minutes)**

  **Stem:**
  Consider a binary outcome $Y \in \{0,1\}$, a binary group attribute $A \in \{0,1\}$, and a risk score $S \in [0,1]$.
  We define the score as **calibrated within groups** if for every score value $s$ in the support, $P(Y = 1 \mid S = s, A = 0) = P(Y = 1 \mid S = s, A = 1) = s$.
  We define a classifier derived from $S$ (via a threshold $t$) as **error-balanced** if the two groups have equal False Positive Rates (FPR) and equal False Negative Rates (FNR).
  The standard impossibility theorem states that if base rates $P(Y=1 \mid A=0)$ and $P(Y=1 \mid A=1)$ differ, a system cannot be both calibrated and error-balanced (unless the classifier is degenerate).

  A student proposes the following fix: *"The impossibility only bites because the two groups' score distributions sit on top of each other. So, require calibration and error-balance on the **common support** only (the set of scores $s$ where both groups have positive probability density), and let the classifier do whatever it wants off it. That's still a real constraint—it stops you treating similarly-scored people from the two groups differently—but it's one you can actually satisfy."*

  **Part A (12 Marks):** Evaluate the student's claim. Does restricting constraints to the common support escape the mathematical impossibility? If it does, does the resulting constraint do any "real work" in ensuring fairness, or does it introduce a new problem?

  **Part B (8 Marks):** If you argue the student's move is a dodge, propose a substantive repair to the framework. Do not simply say "pick one metric." Describe a structural change to the objective or the data pipeline that addresses the tension identified in Part A.

  **Part C (5 Marks):** In one or two sentences, what does this episode reveal about the ontological status of the impossibility result? Is it a failure of the metric, the classifier, or the population?

  ***

  # Model Answer

  **Part A: Evaluation of the Common Support Proposal**
  The student is mathematically correct that restricting constraints to the common support escapes the contradiction, but philosophically naive regarding whether this constitutes fairness. The standard impossibility proof relies on integrating score properties over the entire distribution to link calibration (which ties scores to base rates via expectation) and error balance (which ties thresholds to conditional error rates). If the supports are disjoint—say Group 0 scores lie in $[0, 0.4]$ and Group 1 in $[0.6, 1]$—the common support is empty. The constraints become vacuously true. One can satisfy "calibration on common support" trivially because there are no individuals to compare.

  Even if the supports overlap partially, the move allows the system to "hide" the base rate disparity in the non-overlapping regions. For the constraint to do "real work," the common support must contain a significant mass of both populations. However, if the base rates differ significantly, a calibrated score *must* reflect this in the expectation $E[S|A]$. If we force error balance on the overlap, we may force the non-overlap regions to absorb all the statistical disparity. This effectively permits **score segregation**: the system can assign systematically lower scores to one group and higher to the other, ensuring they rarely land in the common support.

  Consequently, while the student avoids the mathematical contradiction, they fail the normative test. The principle "treat similarly-scored people similarly" loses force if the scoring mechanism ensures people from different groups are rarely similarly scored. The constraint stops discriminating *within* the overlap, but permits discriminating *via* the distribution shape. It escapes impossibility by rendering the fairness constraint too weak to prevent systemic bias.

  **Part B: Substantive Repairs**
  Since the tension arises from demanding statistical parity (error balance) alongside predictive accuracy (calibration) under unequal base rates, a repair must address the source of the base rate difference or the rigidity of the metrics.
  1.  **Causal/Upstream Intervention:** Instead of adjusting the classifier, intervene on the label generation process. If base rates differ due to historical injustice (e.g., policing rates affecting arrest records $Y$), the "impossibility" is a feature of biased data, not math. A repair involves constructing counterfactual labels $Y'$ that represent true risk rather than observed outcomes, aligning base rates causally before optimization.
  2.  **Relaxed Constraints (Cost-Sensitive Fairness):** Abandon strict error balance in favor of minimizing a loss function that penalizes disparity. For example, optimize for calibration while imposing a penalty term on the difference in FPR. This acknowledges the trade-off explicitly rather than pretending it can be defined away by support restrictions. It allows the system to find a Pareto frontier rather than an impossible point.
  3.  **Group-Specific Thresholds:** Allow different thresholds $t_0, t_1$ for each group to achieve error balance while maintaining calibration. This violates "blindness" to group membership but satisfies the error metrics. The repair here is arguing that *equality of opportunity* (error balance) is more morally urgent than *procedural blindness* (same threshold), accepting that fairness may require group-aware post-processing.

  **Part C: Ontological Status**
  The impossibility result is primarily about the **population statistics** (specifically base rates) constraining the available metrics. It demonstrates that fairness metrics are not independent levers a designer can pull; they are mathematically coupled by the underlying reality of the data distribution.

  ***

  # Marking Scheme (25 Marks Total)

  ### Part A: Evaluation of Proposal (12 Marks)
  | Must-Hit Point | Marks | Common Mistake / Note |
  | :--- | :---: | :--- |
  | **Identifies Vacuousness:** Notes that if supports are disjoint, the constraint is trivially satisfied (empty set). | 4 | *Mistake:* Assumes overlap always exists; treats "common support" as non-empty by default. |
  | **Identifies Segregation Risk:** Explains that differing base rates can be "hidden" in non-overlapping regions (score segregation). | 4 | *Mistake:* Focuses only on math proof without addressing the normative "fairness work" question. |
  | **Judgement on "Real Work":** Concludes that while mathematically valid, the constraint is normatively weak/allows bias via distribution shape. | 4 | *Mistake:* Binary "Yes/No" without nuance; fails to distinguish between mathematical possibility and fairness efficacy. |

  ### Part B: Substantive Repairs (8 Marks)
  | Must-Hit Point | Marks | Common Mistake / Note |
  | :--- | :---: |--- |
  | **Proposes Structural Change:** Suggests causal intervention, relaxed optimization, or group-specific thresholds (not just "drop a metric"). | 4 | *Mistake:* Suggests "just use Calibration" without explaining how that resolves the tension or error concerns. |
  | **Justification:** Explains *why* the repair addresses the root cause (e.g., base rate bias vs. classifier constraints). | 4 | *Mistake:* Proposes a fix but fails to link it back to the base rate/calibration tension identified in Part A. |

  ### Part C: Ontological Status (5 Marks)
  | Must-Hit Point | Marks | Common Mistake / Note |
  | :--- | :---: |--- |
  | **Identifies Population/Base Rates:** Explicitly states the constraint comes from the data distribution/population, not the algorithm code. | 3 | *Mistake:* Blames the "metrics" as if they were arbitrary choices unrelated to probability theory. |
  | **Metric Interdependence:** Notes that metrics are coupled/dependent, not independent knobs. | 2 | *Mistake:* Vague philosophical musing without referencing the statistical coupling. |

  **Total:** 25 Marks
