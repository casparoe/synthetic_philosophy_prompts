answer: |-
  Here is the principle that best systematizes your verdicts, followed by the analysis you requested.

  ### The Principle of Diachronic Normative Authority

  **Weakness of will occurs when an agent acts against a normative judgment that retains *agential authority* for them at the time of action.**

  A normative judgment retains **agential authority** if and only if:
  1.  **Current Endorsement:** The agent occurrently endorses the judgment as correct at the moment of action; **OR**
  2.  **Standing Commitment:** The agent holds a standing judgment that has not been legitimately revised (i.e., changed due to new, relevant information or recognized changes in capacity); **OR**
  3.  **Pre-commitment Identification:** The agent previously identified the judgment as authoritative and employed a commitment device specifically to guard against a predicted, disowned shift in preference.

  Agential authority is **lost** (and thus the action is not weakness of will) if:
  1.  **Legitimate Revision:** The agent sincerely revises the judgment based on a perceived change in circumstances that they accept as a valid reason for changing course; **OR**
  2.  **Compulsion:** The action is caused by a psychological or physiological force that bypasses the agent's capacity for choice; **OR**
  3.  **Absence:** No relevant normative judgment was ever held.

  ---

  ### Case Mapping

  Here is how the clauses of the principle handle your specific cases:

  *   **Case (a) [Paradigm]:** Handled by **Current Endorsement**. The agent acts against a judgment they hold *right now*. This is the clearest loss of authority.
  *   **Case (b) [Reconsideration]:** Handled by **Legitimate Revision**. The agent changes their mind due to tiredness. Crucially, they treat this new information as a *valid reason* to update the plan. The earlier judgment loses authority because the agent sincerely believes the conditions for its application have changed.
  *   **Case (c) [No Judgment]:** Handled by **Absence**. There is no normative judgment ("should quit") to violate, only a vague intention. No authority exists to be undermined.
  *   **Case (d) [Compulsion]:** Handled by **Compulsion**. You lean toward "not weakness of will." This clause captures the intuition that if the will is bypassed entirely (addiction as disease/force), the agent is not the author of the action.
  *   **Case (e) [Foreseen Reversal]:** Handled by **Pre-commitment Identification**. This resolves your tension with (b). In (e), the agent *anticipated* the preference shift and labeled it as a failure mode (hence the alarm). By silencing the alarm, they act against the judgment they *trusted* (the 9 PM self), not the one they merely *have* (the 10 PM self). The 9 PM judgment retains authority because the agent explicitly tried to bind themselves to it.
  *   **Case (f) [Autopilot]:** Handled by **Standing Commitment**. This clarifies your uncertainty about occurrent judgment. The principle asserts that a judgment does not need to be "on the screen" to have authority; it only needs to be part of the agent's active normative framework. The "lesser" variety intuition is preserved because the *conflict* is less conscious, but the violation of authority remains.

  ### Addressing the Friend's Objection

  Your friend argues this is merely **hyperbolic discounting**. They are descriptively correct but normatively blind.

  Hyperbolic discounting explains *why* the preference shifts in both (b) and (e). In both cases, the immediate reward (rest/staying) is valued more highly at $t_2$ than at $t_1$. However, your verdicts differ because weakness of will is not a description of preference curves; it is an evaluation of **agential governance**.

  *   In **(b)**, the agent treats the discounting as **information** ("I am more tired than I thought; rest is actually better").
  *   In **(e)**, the agent treats the discounting as **noise** ("I will irrationally value staying; I must stop myself").

  The principle captures this by distinguishing *Legitimate Revision* from *Pre-commitment Identification*. The friend's model cannot distinguish these because it ignores the agent's own stance on their preference shifts.

  ### The New Case: Deliberate Surrender

  **Case:** Someone judges that dieting makes them miserable. They deliberately decide *now* to hand control to their future self, arranging in advance to be swayed by temptation (e.g., they buy cake and leave it on the counter), judging that this surrender is the sensible thing to do. At midnight, they eat the cake.

  **Prediction:** **Not Weakness of Will.**

  **Reasoning:** This falls under **Legitimate Revision** (or rather, a higher-order policy change). The agent's *current* authoritative judgment is: "It is best to let my future self choose based on desire." When the future self eats the cake, they are executing the plan authorized by the earlier self. There is no conflict of authority. The agent has not failed to govern themselves; they have governed themselves to be free.

  ### The Cost of Admission

  To maintain this principle and your current verdicts, you must accept the following costs:

  **1. Verdicts You May Have to Abandon**
  *   **Case (d) [Compulsion]:** This is the most unstable part of your list. If you define weakness of will as "acting against authoritative judgment," addiction often fits. Many addicts *do* retain the judgment "I should not use" (Current Endorsement) but use anyway. To keep (d) as "Not WoW," you must insist that severe craving *destroys* agency entirely. If you admit that addicts still have *some* agency, this principle forces you to call it weakness of will (perhaps a tragic, mitigated variety). You cannot have it both ways: either the will was overborne (not WoW), or it was weak (WoW).
  *   **Case (f) [Autopilot]:** If you push the idea that weakness of will requires a *struggle*, (f) might have to go. The principle says standing judgment is enough. If you believe that without occurrent conflict there is no "will" to be weak, you must reject clause 2 (Standing Commitment) and call (f) mere habit, not akrasia.

  **2. Metaphysical Commitments**
  To make sense of the distinction between (b) and (e), and to defend the principle against your friend, you must believe in a **Temporally Extended Self**.

  *   **Against Time-Slice Theory:** If the self is just a series of momentary time-slices, (b) and (e) are identical. Slice-1 wants X, Slice-2 wants Y. Slice-2 acts on Y. End of story.
  *   **For Governance Theory:** You must believe that the "Self" is a project that stretches across time. The 9 PM self in case (e) has a legitimate claim to authority over the 10 PM self because the 10 PM self *acknowledged* that claim by setting the alarm.
  *   **Judgment as Binding:** You must believe that normative judgments are not just predictions of behavior but **commands** that retain force even when desire shifts.

  **3. The Nature of "Legitimate Revision"**
  The hardest work is done by the distinction between (b) and (e). You must believe that agents can be **wrong about their own reasons**.
  *   In (b), the agent says "I am tired, so resting is better." You accept this as legitimate.
  *   In (e), the agent says "I want to stay, so staying is better." You reject this as weakness.
  *   **Commitment:** You are committed to the view that there is an objective (or at least inter-temporal) standard of rationality that the agent can fail to meet. In (e), the agent's 10 PM judgment is *mistaken* relative to their own endorsed standards, whereas in (b), it is *updated*. This requires a robust realism about practical reason: some preference reversals are rational updates, and others are failures of nerve.

  ### Summary
  Your intuitions add up to a **Governance Model of Agency**. Weakness of will is not merely acting on a stronger desire; it is a failure of the self to maintain authority over its own actions across time. You count an action as weak when the agent violates a rule they still endorse, or a rule they promised themselves to keep, without a reason they accept as valid. To keep this, you must view the self as a single entity persisting through time, capable of binding its future iterations, and capable of distinguishing between a change of mind and a loss of resolve.
