      *   (c) **No Judgment:** Intention (sort of quit) + No Normative Judgment (should quit) + Action (smoke). -> **Not WoW**. (Key: No normative conflict).
      *   (d) **Compulsion:** Judgment (should not) + Craving/Addiction + Action (use). -> **Not WoW** (leans). (Key: Compulsion overrides will).
      *   (e) **Foreseen Reversal:** Preference (leave) + Foreseen Reversal (stay) + Commitment Device (alarm) + Action (stay/silence). -> **WoW**. (Key: Anticipated instability, identification with earlier self).
      *   (f) **Autopilot:** Standing Judgment (should not) + No Occurrent Thought + Action (eat). -> **WoW** (lesser). (Key: Standing commitment suffices).

  3.  **Identify the Core Tension:**
      *   The tension between (b) and (e) is the crux. In both, the agent acts on their *current* preference/judgment.
      *   In (b), the change of mind is treated as legitimate reasoning (tiredness makes rest better).
      *   In (e), the change of mind is treated as a failure (foreseen instability, commitment device violated).
      *   *Difference:* In (e), the agent *identified* with the earlier preference as the "true" one and tried to bind themselves to it. In (b), the agent treats the new judgment as an update based on new conditions (tiredness), not a failure of resolve.
      *   *The Friend's Objection:* Hyperbolic discounting explains the preference shift in both. Why is one WoW and the other not?
      *   *The Answer:* It's about *Normative Authority* and *Identification*. WoW happens when you act against a judgment you still endorse *or* against a prior judgment you identified as authoritative and tried to bind yourself to, without a legitimate reason for the change.

  4.  **Drafting the Principle:**
      *   Need to capture:
          1.  Conflict between action and judgment (a, c).
          2.  Distinction between legitimate reconsideration and weakness (b, e).
          3.  Standing vs. Occurrent judgment (f).
          4.  Compulsion exception (d).
      *   *Candidate Principle:* **The Principle of Diachronic Normative Endorsement.**
      *   *Definition:* Weakness of will occurs when an agent acts against a normative judgment they either (i) currently endorse, or (ii) previously endorsed as authoritative and attempted to bind themselves to, *unless* the change in judgment is due to new relevant information or a recognized change in capacity that the agent accepts as legitimate at the time of action.
      *   *Refining for (b) vs (e):* In (b), the tiredness is treated as a relevant change in condition making rest objectively better (or subjectively acceptable). In (e), the preference shift was *predicted* as a failure mode, not a rational update. The alarm signifies the earlier self didn't trust the later self's judgment.
      *   *Refining for (f):* Standing judgment counts.
      *   *Refining for (d):* Compulsion negates agency/will.

