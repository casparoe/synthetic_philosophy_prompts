      *   **Principle Statement:** Needs to be crisp.
      *   **Clause Mapping:** Map (a)-(f) to the principle.
      *   **New Case:** "Deliberate hands-off." Agent decides *now* to let future self decide, even if future self succumbs to temptation. (e.g., "I'm going to let myself eat the cake tomorrow because dieting makes me miserable").
      *   **Verdict Abandonment:** Which intuition is weakest? Probably (d) or (f). (d) is controversial (is addiction WoW or disease?). (f) is controversial (can you be weak without thinking?).
