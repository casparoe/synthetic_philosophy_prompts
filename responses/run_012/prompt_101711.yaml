      *Wait, (b) vs (e) again.* In (e), the agent *did* revise the judgment (at 10pm they prefer to stay). Why is it WoW? Because they *anticipated* this revision as a failure.
      *   *Crucial distinction:* **Endorsed Revision vs. Disowned Shift.**
      *   In (b), the agent accepts the tiredness as a valid reason to change the plan.
      *   In (e), the agent set an alarm because they *didn't* trust the future judgment. Silencing the alarm is acting against the *trusted* judgment.
