answer: |-
  What's at stake
  The problem asks whether you should switch envelopes when one holds twice the money of the other. Naive calculation suggests switching always increases expected value, implying you should switch back and forth endlessly. The core issue is identifying the hidden assumption that makes this calculation invalid. It challenges how we apply probability and expected value to single decisions under uncertainty, testing whether the flaw lies in the math, the philosophy of probability, or the setup itself.

  Where he's right
  *   He correctly identifies that assuming a 50/50 chance for the other envelope being higher or lower at *every* possible value is mathematically impossible.
  *   He is right that this assumption implicitly requires an infinite range of possible money values, which is unrealistic.
  *   He correctly spots the similarity to the St. Petersburg paradox regarding infinite expectations.

  Where he slips
  His claim that probability requires repeated experiments is a strict frequentist view that most decision theorists reject. In rational choice, probability measures your state of knowledge, not just physical randomness. Even in a one-off event, you are ignorant about which pair of envelopes was prepared, so assigning probabilities to those possibilities is valid and necessary. Dismissing this because the money is physically fixed undermines every decision made under uncertainty, from investing to medical choices. If you cannot use probability for single cases, you cannot use expected value anywhere, which is an overly costly solution to a math puzzle.

  Furthermore, his claim that expected value is unsafe unless amounts are finite is imprecise. Expected value handles infinite outcomes regularly; the issue here is specifically that a uniform probability distribution over an infinite range of money is mathematically impossible. You cannot assign equal likelihood to every possible dollar amount. The error isn't in using expected value, but in assuming the 50/50 split holds regardless of the value you see. The friend notes this requires infinite amounts, but treats it as a flaw in the theory rather than the input. In reality, any realistic scenario implies a maximum possible amount. If you see a value near that maximum, the chance the other envelope holds double is zero, not 50 percent. The 50/50 assumption is therefore always false for some values, breaking the symmetry required for the paradox.

  Finally, declaring expected utility theory inconsistent is too strong. The theory works perfectly when fed valid inputs. The paradox arises from smuggling in an impossible prior distribution, not from a flaw in the utility framework itself. He identifies the symptom—the impossible 50/50 assumption—but misdiagnoses the disease as a failure of probability theory itself. The math doesn't break; the assumption that any amount is equally likely does. By blaming the tool instead of the input, he avoids doing the actual work of specifying a valid probability distribution over the possible money values.

  Does the paradox survive
  The paradox dissolves once you recognize that the 50/50 assumption cannot hold for every possible value you might observe. In any coherent probability model, seeing a very large sum must decrease the likelihood that the other envelope contains double, balancing out the cases where seeing a small sum increases that likelihood. When you use a valid prior distribution rather than an impossible uniform one, the expected gain from switching calculates to zero. The contradiction vanishes without needing to reject expected utility or claim probability doesn't apply to single events.

  Bottom line
  Trust his intuition about the impossible 50/50 assumption, but reject his philosophical justification. He correctly identifies the mathematical impossibility but wrongly blames probability theory itself. His "one-off" argument is a category error that undermines all decision-making, not just this puzzle. You can repeat his math critique, but drop the claim that expected value doesn't apply to single events.
