  This is a fantastic example of a game that *feels* simple but breaks your brain because it sits right on the boundary between a coordination game and a competition.

  Here is the breakdown of what happened, the name of the problem, and who is right about rationality.

  ### 1. What is this game?
  The game you described is a classic **Rent-Seeking Contest**, specifically a **Tullock Contest**.

  In a standard Tullock contest, players spend resources (money, effort, time) to buy "tickets" for a chance to win a prize. The probability of winning is proportional to your share of the total tickets.
  *   **Your Variation:** You removed the *cost* of the tickets.
  *   **The Result:** You created a **Costless Rent-Seeking Game**.

  ### 2. Why Jenna is half-right (and half-wrong)
  Jenna identified a property called **Scale Invariance**.
  In a pro-rata split (where your share = $\frac{\text{Your Tickets}}{\text{Total Tickets}}$), the absolute numbers don't matter if everyone scales up equally.
  *   If everyone claims 1: You get $1/5$ of the pot ($60).
  *   If everyone claims 1,000: You get $1000/5000$ of the pot ($60).

  Jenna is right that the *symmetric outcome* is identical. However, she is wrong that "there's nothing to argue about." In game theory, an outcome isn't stable just because it's fair or symmetric. It has to be a **Nash Equilibrium**—meaning no single person has an incentive to change their move.

  As you noticed, "Everyone claims 1" is **not** a Nash Equilibrium.
  *   If they claim 1 (Total = 4), and you claim 2...
  *   Total tickets = 6.
  *   Your share = $2/6$ (33%).
  *   Their share = $1/6$ (16%).
  *   You just doubled your money at their expense.

  Because there is no cost to claiming more tickets, the "Best Response" to *any* number the others pick is to pick a *higher* number. This creates an **unbounded best-response dynamic**. The only logical "equilibrium" is for everyone to claim infinity (or the maximum number allowed by the paper/pen).

  ### 3. The Mystery of the Missing Money (Important!)
  There is a mathematical contradiction in your story that explains why you're so confused.

  **If the rules were exactly as you described (pro-rata split, zero cost), you should have walked away with $60 each, regardless of whether you wrote 1 or 40.**
  The math of a pro-rata split is scale-invariant. Inflating the ticket count does not dilute the pot; it only dilutes the *value of a single ticket*, but since you hold more tickets, your total share remains $1/5$.

  **The fact that you walked away with $3 implies one of two things:**
  1.  **Hidden Cost:** There was actually a cost to the tickets (e.g., you had to pay $1 per ticket into a separate fee, or the pot was reduced by the total ticket count). If tickets cost money, then inflating the numbers *does* destroy value. This turns it into a standard Tullock Contest where the equilibrium is a specific high number that eats up most of the profit.
  2.  **Different Rule:** The rule was actually "The Pot is divided by Total Tickets, and that is what everyone gets" (i.e., $300 / \text{Total Tickets}$). In this version, claiming more tickets hurts *everyone* equally (including you). This explains the $3 payout ($300 / 100 tickets = $3), but it contradicts your memory that "claiming 2 gets me more."

  **Most likely:** You played a Rent-Seeking game where there was an implicit or explicit cost (even if just social friction or a rule you forgot), which is why the high ticket counts punished you.

  ### 4. Who is right about Rationality?
  **You are right. Your brother is wrong.**

  Your brother is thinking of a **Coordination Game** (like driving on the right side of the road). In those games, "Common Knowledge of Rationality" helps everyone converge on the obvious **Schelling Point** (the focal point). He assumes that because "Claim 1" is the obvious fair spot, rational people will see that and agree on it.

  But this is not a Coordination Game; it is a **Competitive Game**.
  *   **In Coordination Games:** Rationality helps you find the *cooperative* solution.
  *   **In Competitive Games (like this one):** Rationality forces you to find the *exploitative* solution.

  If everyone is perfectly rational, they all realize that "Claim 1" is vulnerable to exploitation. They all realize *everyone else* realizes this. Therefore, a perfectly rational group would instantly jump to the maximum possible number.

  So, paradoxically, **perfect rationality makes the "good" outcome ($60 each at low numbers) impossible to sustain.** It forces the game into the "bad" equilibrium (high numbers). In this specific shape of problem, being "rational" is what causes the disaster.

  ### Summary
  *   **Name:** Costless Rent-Seeking Contest (or Tullock Contest).
  *   **The Trap:** The "Social Optimum" (all claim 1) is not a "Nash Equilibrium." Individual incentives destroy the group benefit.
  *   **The Money:** If the rules were truly pro-rata with zero cost, your ticket numbers shouldn't have changed your payout. The fact that you got $3 suggests there was a cost mechanism you're misremembering, which is what made the high ticket counts dangerous.
  *   **The Brother:** He is applying logic from Coordination Games to a Competitive Game. Rationality doesn't solve this; it escalates it.

  You didn't feel like idiots because you failed game theory; you felt like idiots because you played a game where the rational move is to burn value for no gain. That's not a failure of intelligence; it's a failure of the game design.
