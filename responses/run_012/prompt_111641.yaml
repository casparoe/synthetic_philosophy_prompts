answer: |-
  Here is the breakdown you asked for, followed by a direct verdict on how to use this at your next council meeting.

  ### 1. Subsidiarity vs. The Laboratory of Democracy
  Your gut is correct. These are not the same argument in different clothes. They diverge on *why* local power exists.

  **The Laboratory Argument (Justice Brandeis, 1932)**
  *   **The Logic:** Instrumental and Utilitarian. Local governments are testing sites. The goal is to generate data to find the single best policy for everyone.
  *   **The Implication:** If the state decides it already has enough data, or if the "experiment" creates too much friction for businesses operating across borders, the lab can be closed. The value of the town is in its *output* (policy solutions), not its *authority*.
  *   **The Weakness:** It treats local autonomy as a privilege granted by the state for the state's benefit. If the state says, "We know the answer," the laboratory argument evaporates.

  **Subsidiarity (Catholic Social Teaching / EU Principle)**
  *   **The Logic:** Normative and Ontological. Smaller communities have an inherent right to manage their own affairs because human flourishing happens in small groups. Higher levels exist to *support* (subsidium) the lower levels, not to replace them.
  *   **The Implication:** The burden of proof is on the higher level to demonstrate that the lower level *cannot* achieve the objective. It is not enough for the state to say, "We can do it better." They must prove, "You are incapable of doing it."
  *   **The Strength:** It treats local authority as a matter of dignity and integrity, not just efficiency.

  **Where they come apart:**
  Under the Laboratory argument, the state can preempt you because your ordinance creates a "patchwork" that complicates things for landlords operating statewide. That is a valid reason to close a lab.
  Under Subsidiarity, "complication for the higher level" is not a valid reason to intervene. Only "failure of the lower level" is. Since your town is capable of enforcing the ordinance, Subsidiarity says the state has no business stopping you.

  ### 2. The Trap Door
  You are right to be suspicious. Both concepts have a trap door, but they are located in different places.

  **Subsidiarity's Trap:** *Who defines "adequate"?*
  The principle says the higher level intervenes only if the lower level fails. But who judges the failure? In the EU, the European Commission often decides if a member state is failing. In your case, the State Legislature decides if your town is "capable." If they pass a law saying "Local control creates housing instability," they have defined your effort as inadequate by fiat. The trap door is that the higher level holds the gavel that defines competence.

  **The Laboratory's Trap:** *Who defines "success"?*
  The state can argue that the experiment *itself* is the failure, regardless of the outcome. If the goal of the state is "uniform regulatory environment for landlords," then your ordinance is a failure the moment you pass it, even if it houses more people. The trap door here is easier to trip: the state doesn't need to prove you *can't* do the job; they just need to say they want a different job done.

  **Is one safer?**
  Structurally, **Subsidiarity is harder to bypass,** but only if you can enforce the burden of proof. It demands evidence of local failure. The Laboratory argument only demands a statement of statewide interest. However, in the American legal system, the State holds the keys to the Trap Door in both scenarios. Legally, neither saves you. Politically, Subsidiarity is the harder shield to break.

  ### 3. The Verdict
  You asked for a verdict, not a summary. Here it is:

  **Use the logic of Subsidiarity, but do not use the word.**

  If you stand up and talk about "Laboratories of Democracy," the State's response is already written: *"We have concluded the experiment. Uniformity is now the priority."* You cannot win that argument because the State owns the lab.

  If you argue from **Subsidiarity**, you change the battlefield. You are no longer arguing about *policy effectiveness* (which the State can override); you are arguing about *political authority* (which strikes at the heart of local representation).

  **Here is the argument you make at the next meeting:**

  1.  **Shift the Burden:** Do not defend the ordinance on its merits yet. Defend the *town's right to pass it*. State clearly: "The State has not demonstrated that this Town is incapable of managing its own housing market. They have only demonstrated that they prefer a different policy."
  2.  **Invoke Capacity, Not Just Rights:** Don't just say "It's our right." Say, "We are the body closest to the problem. We have the capacity to solve it. For the State to strip us of this capacity without proof of our failure is a dereliction of *their* duty to support local governance."
  3.  **The "Dignity" Angle:** Frame preemption as disenfranchisement. "When the State preempts us without cause, they are telling the voters who elected me that their judgment on local issues does not count. That damages the integrity of this council."

  **Why this works better:**
  The Laboratory argument admits you are a subordinate unit testing things for the boss. Subsidiarity argues you are a partner with a specific sphere of sovereignty.
  *   **Legal Reality:** Your attorney is right. Under "Dillon's Rule" (which governs most towns), you are legally creatures of the state. You will likely lose in court.
  *   **Political Reality:** You can win in the press and in future elections. Preemption is unpopular when framed as "State bureaucrats overruling local voters."

  **The Trap:**
  Be careful not to sound like you just want power for power's sake. If you sound like you're fighting for "turf," you lose. You must frame it as fighting for the **constituents' ability to solve their own problems.**

  **Final Instruction:**
  Drop the "Laboratory" language. It concedes too much ground. Adopt the Subsidiarity framework: **The State must prove we cannot do the job, not just that they want to do it differently.** This forces them into a defensive position they usually ignore. It won't change the statute, but it changes the narrative from "Rogue Town Disobeys State" to "State Silences Local Voice." That is a fight you can win.
