      *   **Constraint 5 (Limitations):** State plainly what the procedure cannot settle (including a case where the panel must make a call the theory doesn't license) and the cost of a wrong call.
      *   **Constraint 6 (Format):** Lead with the procedure's bottom line (single ordering rule) in one sentence. No preamble. No restatement of the request.

  2.  **Deconstruct Rawlsian Theory for this Context:**
      *   *Two Principles of Justice:*
          1.  Equal Basic Liberties (lexical priority 1).
          2.  Fair Equality of Opportunity (lexical priority 2) + Difference Principle (lexical priority 3).
      *   *Least Advantaged:* Defined by an index of primary social goods (rights, liberties, opportunities, income, wealth, social bases of self-respect), not just income.
      *   *Difference Principle:* Social and economic inequalities are to be arranged so that they are to the greatest benefit of the least advantaged. Crucially, this is about the *basic structure* and long-term expectations, not necessarily every single administrative decision maximizing the minimum immediately. It requires reciprocity.
      *   *Legislative Stage:* The panel is acting at the legislative stage (applying principles to specific policies), not the constitutional convention stage (setting liberties) or the original position (setting principles). However, they must ensure the policy doesn't violate the prior principles.
      *   *Veil of Ignorance:* The justification must be one that someone behind the veil would accept as part of a stable system of cooperation.

  3.  **Drafting the Decision Procedure:**
      *   *Bottom Line:* Needs to be one sentence capturing the lexical ordering.
      *   *Step 1: Basic Liberties.* Does the proposal infringe on equal basic liberties (voting, speech, movement, etc.)? If yes, reject unless it strengthens the overall system of liberty.
      *   *Step 2: Fair Equality of Opportunity.* Does the proposal worsen access to offices/positions for those with similar talents/ambitions? (e.g., school funding, hiring). If yes, reject unless it improves overall opportunity structure.
      *   *Step 3: The Difference Principle (Least Advantaged).* Identify the least advantaged group using an index (income + wealth + powers/premises + social bases of self-respect). Does the proposal improve their long-term expectations compared to the status quo or alternative feasible arrangements?
      *   *Step 4: Reciprocity/Justification.* Can the burden be justified to them as part of a scheme that benefits them overall (not just this transaction)?
      *   *Stop Conditions:* Fail Step 1 or 2 = No. Fail Step 3 = No (unless part of a broader package satisfying it). Step 4 is the justification check.
      *   *Value vs. Fact:* Facts are about impacts (who loses money, who loses access). Values are about weighting the index of goods (is liberty of movement more important than income?).

