  1.  **Analyze the Request:**
      *   **Role:** Equity-review desk for a city council.
      *   **Framework:** Rawlsian Justice (specifically the two principles of justice with lexical priority).
      *   **Constraint 1 (Output):** A decision procedure (questions in order, sufficient answers, stop conditions, value vs. fact distinctions).
      *   **Constraint 2 (Theory):** Must correctly handle "least advantaged" (index of primary social goods, not just income) and the "difference principle" (legislative stage/reciprocity/veil of ignorance, not case-by-case maximin).
      *   **Constraint 3 (Lexical Priority):** Must explicitly identify when Equal Basic Liberties or Fair Equality of Opportunity overrides the Difference Principle.
      *   **Constraint 4 (Application):** Run the procedure on three proposals:
          *   (a) Congestion pricing (funds bus, hurts low-income drivers with no alternative).
          *   (b) Land-value tax (raises poorest decile income, shrinks tax base of poorest school district).
