answer: |-
  Reject any proposal that infringes equal basic liberties or fair equality of opportunity, and among those that remain, approve only those where the resulting inequality maximizes the long-term index of primary social goods for the identified least-advantaged group.

  ### The Decision Procedure

  **Step 1: The Liberty Check (Lexical Priority 1)**
  *   **Question:** Does this proposal restrict any basic liberty (voting, speech, conscience, freedom of movement, security of person) for any citizen?
  *   **Fact vs. Value:** *Fact* is whether the restriction exists (e.g., "does this zone law prevent building a church?"). *Value* is whether the liberty is "basic" (refer to city charter/constitution) versus economic preference.
  *   **Stop Condition:** If **Yes**, reject immediately unless the restriction is necessary to prevent a greater violation of the same liberty for others (e.g., traffic laws restricting movement to preserve security of person).
  *   **Pass Condition:** If **No**, or if the restriction is justified by the broader system of liberty, proceed to Step 2.

  **Step 2: The Opportunity Check (Lexical Priority 2)**
  *   **Question:** Does this proposal worsen access to offices, positions, or education for individuals with similar talents and ambitions?
  *   **Fact vs. Value:** *Fact* is the impact on access (e.g., "does school funding drop by 10%?"). *Value* is whether the impact constitutes a barrier to "fair equality" (e.g., is education a prerequisite for opportunity?).
  *   **Stop Condition:** If **Yes**, reject immediately. Income gains cannot compensate for lost opportunity.
  *   **Pass Condition:** If **No**, or if access is improved, proceed to Step 3.

  **Step 3: The Difference Principle Check (Lexical Priority 3)**
  *   **Question:** Who is the "least-advantaged group" under this policy, and does the policy maximize their long-term index of primary social goods compared to feasible alternatives?
  *   **Definition:** The "least-advantaged" are not merely the lowest income decile. They are those with the lowest index of **primary goods**: income, wealth, powers/premises, and the social bases of self-respect.
  *   **Fact vs. Value:** *Fact* is the distributional impact (e.g., "disposable income rises 5%"). *Value* is weighting the index (e.g., "does a 5% income gain outweigh a loss of community stability?"). The panel must decide the weight; the theory demands the index be used, not income alone.
  *   **Stop Condition:** If the policy lowers the expectations of the least-advantaged group compared to the status quo or a feasible alternative that helps them more, reject. Note: This is not case-by-case maximin administration, but a check on whether the policy contributes to a basic structure that sustains the minimum.
  *   **Pass Condition:** If the policy raises the long-term expectations of the least-advantaged group, proceed to Step 4.

  **Step 4: The Reciprocity Justification**
  *   **Question:** Can the burden imposed on the least-advantaged be justified to them as part of a cooperative scheme from which they benefit?
  *   **Fact vs. Value:** *Fact* is the existence of mitigations (e.g., "are there exemptions?"). *Value* is whether the justification respects them as free and equal citizens.
  *   **Stop Condition:** If the burden is imposed without reciprocity (e.g., sacrifice for the greater good without return), reject.
  *   **Pass Condition:** If the burden is compensated or part of a mutually beneficial structure, hand decision to the panel for final vote.

  ---

  ### Application to Proposals

  **(a) Congestion Pricing with Bus Funding**
  *   **Step 1 (Liberty):** Freedom of movement is restricted for drivers. *Verdict:* Pass, provided it is a reasonable regulation for security/efficiency.
  *   **Step 2 (Opportunity):** Access to downtown jobs is the concern. *Verdict:* Pass, if bus frequency improves overall access.
  *   **Step 3 (Difference Principle):** The least-advantaged group includes low-income drivers with no alternative. Their index of goods (income/wealth) decreases due to costs. Bus riders (also least-advantaged) gain. *Critical Fact:* Is the gain to bus riders sufficient to offset the loss to drivers within the least-advantaged class?
  *   **Step 4 (Reciprocity):** If drivers have *no alternative*, the burden is not reciprocal; they are sacrificed for the benefit of others.
  *   **Verdict:** **Reject** unless an exemption or subsidy is added for low-income drivers. Without it, the policy fails the Difference Principle because it lowers the expectations of a subgroup of the least-advantaged without compensation, violating reciprocity.

  **(b) Land-Value Tax (LVT) Replacing Property Tax**
  *   **Step 1 (Liberty):** No basic liberty infringed. *Verdict:* Pass.
  *   **Step 2 (Opportunity):** The proposal shrinks the tax base of the poorest school district. This directly reduces educational resources for those with similar talents in that district.
  *   **Lexical Priority Check:** Even though Step 3 (Difference Principle) shows the poorest decile gains disposable income, Step 2 (Fair Equality of Opportunity) takes priority. Income cannot trade off against opportunity.
  *   **Verdict:** **Reject.** The procedure stops at Step 2. The gain in income (Difference Principle) is irrelevant because the loss in school funding violates Fair Equality of Opportunity.

  **(c) Suburban Rail Subsidy Funded by Cutting Local Bus Loops**
  *   **Step 1 (Liberty):** No basic liberty infringed. *Verdict:* Pass.
  *   **Step 2 (Opportunity):** Access to jobs changes type (suburban vs. local), but not necessarily fairness. *Verdict:* Pass.
  *   **Step 3 (Difference Principle):** Models show the *average* income of the bottom quintile rises because some poor residents gain higher-paying suburban jobs. However, the *bottom decile* (disabled, elderly, local service workers) loses all mobility via the cut local loops. Their index of goods (access, income, social bases of self-respect) collapses.
  *   **Verdict:** **Reject.** The procedure rejects this because the Difference Principle requires maximizing the position of the *least* advantaged (the bottom decile), not the average of the poor (the bottom quintile). Helping the "better-off poor" at the expense of the "worst-off poor" violates the maximin requirement of the basic structure.

  ---

  ### Limitations and Costs

  **What the Procedure Cannot Settlement:**
  The procedure cannot settle trade-offs *within* the index of primary goods when facts are clear but values differ. For example, if a policy increases income for the least-advantaged but decreases their leisure time or community stability, the theory provides no mathematical weight for "income vs. self-respect." The panel must make a value call here that Rawls's theory does not license; it only demands the index be considered, not how to balance its components.

  **Case of Indeterminacy:**
  If two proposals both satisfy Liberty and Opportunity, and both maximize the expectations of the least-advantaged equally (e.g., Policy X gives \$500 cash, Policy Y gives \$500 in services), the theory is silent on which to choose. The panel must decide based on efficiency or preference, which are outside the scope of justice as fairness.

  **Cost of a Wrong Call:**
  If the panel ignores the lexical priority (e.g., approving Proposal B because the income gain is large), the cost is treating citizens as means rather than ends. This erodes the stability of the basic structure; if the least-advantaged perceive the system as rigged to trade their opportunities for others' wealth, civic trust collapses, and compliance becomes coercive rather than consensual. A wrong call on the index weighting (e.g., ignoring self-respect for income) costs the panel legitimacy, as it fails to justify the policy to those it leaves worst off in terms they can accept as free and equal citizens.
