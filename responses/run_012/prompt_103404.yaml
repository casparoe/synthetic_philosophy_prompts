  5.  **Refining the Procedure Steps:**
      *   Need to ensure the "index of primary goods" is explicit.
      *   Need to ensure "Legislative Stage" nuance (not every admin decision must maximize min, but the *policy* must contribute to a just basic structure).
      *   Need to identify where value judgments enter (weighting the index).

  6.  **Addressing Limitations:**
      *   What can't it settle? Trade-offs within the index (e.g., income vs. leisure vs. self-respect).
