  5.  **Refining the Tone:**
      *   Make sure not to sound condescending to the user or the friend. The friend is a grad student, so they know their stuff, but maybe they are simplifying for an undergrad.
      *   Ensure the distinction between "ontological objectivity" (beauty is in the thing) and "normative universality" (everyone *should* agree) is clear.

  6.  **Self-Correction/Review during drafting:**
