prompt: |-
  I just switched into an MA in philosophy after a law degree and got thrown into a seminar on expressivism, which means I'm presenting on the Frege-Geach problem next week and I'm panicking a bit. I think I've got the basic shape of it: "lying is wrong" has to mean the same thing when I assert it as when it sits unasserted in the antecedent of "if lying is wrong, then telling my little brother to lie is wrong" — otherwise the inference from that conditional plus "lying is wrong" to "telling my little brother to lie is wrong" is just an equivocation and not a valid argument. And the expressivist who says the meaning of "lying is wrong" is the expression of a non-cognitive attitude toward lying can't obviously say that about the antecedent, since nobody in that sentence is actually expressing disapproval of lying, they're only supposing it. Fine, I definately get the sketch.

  What I can't get a grip on is what the actual conceptual issue is once you go past the sketch. My supervisor keeps saying this is really two different problems that people run together — one about how a word can keep its meaning in a context where the attitude isn't expressed, and one about why certain inferences are valid or certain pairs of sentences inconsistent even though nothing in them is truth-apt, which is supposedly a problem about the logic of attitudes rather than about compositionality — and that the second one shows up much more sharply with negation than with conditionals. So: if "lying is wrong" expresses disapproval of lying, what exactly does "lying is not wrong" express? It can't just be the absence of disapproval, because someone who simply doesn't disapprove of lying isn't thereby disagreeing with me; and if it's meant to be some higher-order attitude (disapproval of the approval of lying, or whatever), then it's no longer clear that my "lying is wrong" and their "lying is not wrong" actually contradict each other — they just have different second-order tastes. Could you explain, as concretely as you can, what the expressivist actually has to show here, which of these two problems is the real one, and whether the standard fixes — higher-order attitudes, saying "wrong" picks out a property after all, etc. — solve the thing or just relocate it? I'd especially like to understand why negation is supposed to be harder than the conditional case, because on my reading they look like the same move.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Background:** Law degree, just switched to MA in Philosophy. Smart, understands legal logic/argumentation (equivocation, validity), but new to metaethics/expressivism technicalities.
      *   **Current Situation:** Panicking about a presentation on the Frege-Geach (F-G) problem next week.
      *   **Current Understanding:** Grasps the basic "embedding problem" sketch (asserted vs. unasserted contexts, validity/equivocation).
      *   **Supervisor's Input:** Supervisor claims there are *two* distinct problems often conflated: (1) Compositionality/Meaning in unasserted contexts, and (2) Logic/Consistency of attitudes (especially regarding negation).
      *   **Specific Questions:**
          *   What is the *actual* conceptual issue past the sketch?
          *   Which of the two problems (compositionality vs. logic of attitudes) is the "real" one?
          *   Do standard fixes (higher-order attitudes, quasi-realism, etc.) solve it or relocate it?
          *   **Crucial:** Why is negation harder than the conditional case? (User thinks they look like the same move).

  2.  **Deconstruct the Frege-Geach Problem:**
      *   *Core Issue:* Expressivism says moral sentences express non-cognitive attitudes (boo/hurrah). But moral sentences behave like cognitive sentences in logic (embedding, negation, inference).
      *   *Problem 1 (Embedding/Compositionality):* How does "wrong" mean the same thing in "Lying is wrong" and "If lying is wrong..."? In the latter, no attitude is expressed.
      *   *Problem 2 (Logic/Consistency):* How can "Lying is wrong" and "Lying is not wrong" be contradictory? If one is Boo(Lying) and the other is... what? Not-Boo(Lying)? That's not a contradiction (I can neither boo nor hurrah). If it's Boo(Approval(Lying)), do those contradict?

  3.  **Address the Supervisor's Distinction (The "Two Problems"):**
      *   The supervisor is right. This is a crucial insight for an MA student.
      *   *Problem A: The Embedding Problem (Semantics).* How do we assign semantic content to complex sentences?
      *   *Problem B: The Logical Problem (Validity/Consistency).* How do we preserve logical relations (entailment, contradiction) without truth-conditions?
      *   *Connection:* Solving A often helps B, but not always. You can assign meanings to embedded sentences that still don't generate the right logical relations.

  4.  **Tackle the Negation Question (Why is it harder than conditionals?):**
      *   *Conditional:* "If P then Q." Expressivists (like Blackburn) can treat this as expressing a higher-order attitude (e.g., disapproval of holding P without Q). It's about *consistency of attitudes*.
      *   *Negation:* "Not P." This is the killer.
      *   *The "Absence" Trap:* If "Wrong" = Disapproval, then "Not Wrong" = Absence of Disapproval. But absence of disapproval $\neq$ Disapproval of Approval.
      *   *The Contradiction Requirement:* For logic to work, $P$ and $\neg P$ must be inconsistent (cannot both be held).
      *   *The Expressivist Struggle:* If I Boo(Lying) and you don't Boo(Lying), we don't disagree. We just have different tastes. For genuine moral disagreement (contradiction), our attitudes must clash. But attitudes don't clash like beliefs. Beliefs clash via truth (one is T, one is F). Attitudes clash via... what? Incompatibility?
      *   *Schroeder's Point:* Mark Schroeder (in *Being For*) argues this is the deeper problem. It's not just about embedding; it's about explaining *inconsistency* without truth.

  5.  **Evaluate Standard Fixes:**
      *   *Blackburn's Quasi-Realism (Higher-Order Attitudes):* "Wrong" = Boo. "If Wrong then..." = Disapproval of combining Boo with...
          *   *Pros:* Saves validity by defining validity in terms of attitude consistency.
          *   *Cons:* The "Negation Problem" (Schroeder). It creates too many attitudes. "Not wrong" needs to be distinct from "permissible" and "forbidden." The combinatorial explosion of attitudes.
      *   *Gibbard's Norm-Expressivism:* Plans/Norms instead of emotions.
          *   *Pros:* Handles logic better because planning has a logic (you can't plan to do X and not do X).
          *   *Cons:* Still struggles with the "truth-apt" appearance (we say moral claims are *true*).
      *   *Hybrid Views / Ecumenical Expressivism:* Moral sentences express *both* belief and attitude.
          *   *Pros:* Solves logic via the belief component.
          *   *Cons:* Abandons pure expressivism.
      *   *Truth-Apt Expressivism (Minimalism):* Say moral sentences *are* truth-apt, just in a deflated sense.
          *   *Pros:* Solves F-G easily (logic works on truth).
          *   *Cons:* Is it still expressivism? Or just error theory/cognitivism in disguise?

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Reassuring, academic but accessible, validating the supervisor's hint.
      *   *Structure:*
          1.  Validate the user's grasp (it's good).
          2.  Clarify the Supervisor's Two Problems (Semantics vs. Logic).
          3.  Deep dive into Negation (The "Schroeder Point"). Explain why Conditionals are "easier" (consistency of attitudes) vs. Negation (contradiction).
          4.  Evaluate the Fixes (Blackburn, Gibbard, Minimalism).
          5.  Conclusion/Advice for the presentation.

      *   *Refining the Negation Explanation:* I need to be very precise here.
          *   Case 1: "Lying is wrong" (Boo Lying).
          *   Case 2: "Lying is not wrong."
          *   If Case 2 = "No Boo Lying," then holding Case 1 and Case 2 is not inconsistent. I can Boo Lying and you can Not Boo Lying. That's just difference, not disagreement.
          *   If Case 2 = "Boo (Hurrah Lying)," then holding Case 1 and Case 2 *is* inconsistent (I can't Boo Lying and Boo Approving Lying simultaneously? Maybe? But what about "Lying is permissible"?).
          *   The real issue is that negation creates a *logical* contradiction. Expressivism needs to map logical contradiction to *psychological* inconsistency.
          *   Schroeder's argument: To solve this, expressivists need to posit distinct attitude types for every logical combination. This leads to an explosion of mental states.

      *   *Refining the Conditional vs. Negation:*
          *   Conditional: "If P, then Q." Expressivist says: "I disapprove of holding P-attitude without Q-attitude." This explains why *Modus Ponens* preserves "correctness" of attitudes.
          *   Negation: "Not P." Needs to be the *contradictory* of P. In cognitivism, $\neg P$ is true iff $P$ is false. In expressivism, what is the *incompatible attitude*? It's harder to define incompatibility for desires/emotions than for beliefs.

  7.  **Final Polish:** Check against the user's specific constraints.
      *   "As concretely as you can." (Use examples).
      *   "Which is the real one?" (Argue they are linked, but Logic is the deeper metaphysical worry).
      *   "Do fixes solve or relocate?" (Most relocate to complexity of mental states).
      *   "Why negation harder than conditional?" (Combinatorial explosion/Incompatibility).

  8.  **Self-Correction during drafting:** I initially thought about mentioning Error Theory. No, keep it focused on Expressivism. Make sure to mention Mark Schroeder's *Being For* as it's the standard reference for the "Negation Problem" specifically. Make sure to distinguish Blackburn's early solution vs. the later critique.

  9.  **Final Review of the "Law Degree" angle:** The user knows logic. Use terms like "validity," "equivocation," "contradiction" confidently. They understand that if the meaning shifts, the argument fails. Lean into that.

  (Proceed to generate response based on these thoughts.)
answer: |-
  First, take a deep breath. You have a law degree; you are trained to spot equivocation and analyze the structure of arguments. You actually understand the Frege-Geach (F-G) problem better than half the philosophy undergrads who have been marinating in metaethics for three years. Your supervisor is giving you a very sophisticated hint: the "standard sketch" you learned is the *semantic* version, but the *logical* version is where the bodies are buried.

  Here is the concrete breakdown of the two problems, why negation is the killer, and how the standard fixes attempt (and often struggle) to deal with it.

  ### 1. The Supervisor's Distinction: Two Problems, Not One

  Your supervisor is right. The literature often conflates them, but separating them is key to a good presentation.

  **Problem A: The Embedding Problem (Semantics/Compositionality)**
  *   **The Issue:** If the meaning of "Lying is wrong" is *expressing an attitude*, what is the meaning of "If lying is wrong..."? In the antecedent, you aren't expressing an attitude. You're hypothesizing.
  *   **The Fear:** Equivocation. If "wrong" means *express disapproval* in the premise ("Lying is wrong") but means *something else* in the conditional ("If lying is wrong"), the argument is invalid.
  *   **The Expressivist Goal:** Provide a semantics for complex sentences (conditionals, negations, disjunctions) that doesn't rely on truth-conditions but still assigns a consistent "content" to the moral term across asserted and unasserted contexts.

  **Problem B: The Logical Problem (Validity/Inconsistency)**
  *   **The Issue:** Logic is defined by truth-preservation (in standard logic). $P, P \to Q \vdash Q$ is valid because if $P$ is true and $P \to Q$ is true, $Q$ *must* be true. Expressivists deny moral sentences have truth-conditions. So, what does "validity" even mean for them?
  *   **The Fear:** Without truth, you can't have contradiction. If I say "Lying is wrong" and you say "Lying is not wrong," we are contradicting each other. We can't both be right. But if I am expressing *Disapproval* and you are expressing *Tolerance*, we aren't contradicting; we're just different. Like me liking chocolate and you liking vanilla.
  *   **The Expressivist Goal:** Explain how moral sentences can be *inconsistent* with each other (logically contradictory) solely in virtue of the mental states they express, without appealing to truth.

  **Which is the "Real" One?**
  Problem A is the gateway; Problem B is the fortress. You can solve Problem A (assign meanings to embedded sentences) but still fail Problem B (those meanings don't generate the right logical relations). Most contemporary philosophers think **Problem B (Logic/Inconsistency)** is the deeper metaphysical challenge.

  ### 2. Why Negation is Harder than Conditionals

  This is the crux of your presentation. On the surface, they look similar, but logically, negation is a nightmare for expressivists in a way conditionals are not.

  **The Conditional Case (The "Easier" Problem)**
  Simon Blackburn (the big name in quasi-realism) has a plausible story for conditionals.
  *   **Cognitivist:** "If P then Q" is true unless P is true and Q is false.
  *   **Expressivist:** "If lying is wrong, then getting your brother to lie is wrong."
      *   Blackburn suggests this expresses a **higher-order attitude**. It expresses *disapproval of holding the attitude that lying is wrong without also holding the attitude that getting your brother to lie is wrong.*
      *   **Why it works:** It explains why Modus Ponens feels valid. If you accept the conditional (you disapprove of the mismatch) and you accept the antecedent (you disapprove of lying), consistency demands you accept the consequent. It maps logical validity onto **attitudinal consistency**.

  **The Negation Case (The "Hard" Problem)**
  Negation requires **contradiction**, not just consistency.
  *   **Sentence A:** "Lying is wrong." (Expresses: Disapproval of lying)
  *   **Sentence B:** "Lying is not wrong."

  What mental state does Sentence B express?
  1.  **Option 1: Absence of Attitude.** "Lying is not wrong" = I do not disapprove of lying.
      *   *Failure:* This isn't a contradiction. I can Disapprove of Lying, and you can Not Disapprove of Lying. We just have different tastes. There is no logical clash. But morally, we *are* clashing.
  2.  **Option 2: Opposite Attitude.** "Lying is not wrong" = Approval of lying.
      *   *Failure:* This is too strong. "Not wrong" includes things that are permissible/neutral, not just things that are good. Also, "Lying is not wrong" and "Lying is good" are not the same sentence.
  3.  **Option 3: Higher-Order Attitude (Blackburn's move).** "Lying is not wrong" = Disapproval of disapproving of lying.
      *   *Failure:* This leads to the **Negation Problem** (championed by Mark Schroeder).

  **The Schroeder Objection (The Concrete Logic)**
  Schroeder argues that to make the logic work, expressivists must posit a distinct type of mental state for every logical combination.
  *   Belief that $P$
  *   Belief that $\neg P$
  *   Belief that $P \land Q$
  *   Belief that $P \lor Q$

  For cognitivists, these are all just *beliefs*. They have the same functional role (aiming at truth).
  For expressivists, if "Wrong" is Disapproval, then:
  *   "Wrong" = Disapproval
  *   "Not Wrong" = Disapproval of Disapproval (let's call it *Toleration*)
  *   "Wrong and Wrong" = Disapproval of... both?

  **The Problem:** In standard logic, $P$ and $\neg P$ are inconsistent. For the expressivist, *Disapproval* and *Toleration* must be inconsistent mental states. You cannot simultaneously hold them.
  But why can't I disapprove of lying and also disapprove of disapproving of lying? (Think of a guilt-ridden moral sinner: they disapprove of their sin, but also disapprove of their own harsh judgment of themselves).
  If it is *psychologically possible* to hold both attitudes, then they are not logically inconsistent. If they are not logically inconsistent, then "Lying is wrong" and "Lying is not wrong" are not contradictions. If they aren't contradictions, expressivism fails to capture the nature of moral disagreement.

  **Why Negation is Harder:**
  Conditionals only require you to explain **entailment** (if you have attitude X, you ought to have attitude Y). Negation requires you to explain **incompatibility** (you *cannot* have attitude X and attitude Z). It is much harder to define two non-cognitive attitudes that are mutually exclusive in the way "True" and "False" are mutually exclusive.

  ### 3. Do the Fixes Work or Just Relocate the Problem?

  Here is your evaluation section for the presentation.

  **1. Quasi-Realism (Blackburn)**
  *   **The Fix:** We "earn the right" to talk as if moral sentences are true. We define validity in terms of the consistency of attitudes.
  *   **Verdict:** **Relocates the problem.** It solves the embedding issue elegantly but struggles with the Schroeder Negation Problem. It requires positing an explosion of distinct mental states (Disapproval, Toleration, Disapproval-of-Toleration, etc.) to mirror the truth-tables of logic. It makes the psychology of morality incredibly complex compared to cognitivism.

  **2. Norm-Expressivism (Gibbard)**
  *   **The Fix:** Don't use emotions (Boo/Hurrah). Use **Plans** or **Norms**. "Lying is wrong" = "I plan to blame liars."
  *   **Verdict:** **Partial Solution.** Planning has a logic. You cannot plan to do X and plan to not do X. This handles inconsistency better than emotions. However, it still struggles with the "truth-apt" nature of moral discourse (we say moral claims are *true*, not just *planned*).

  **3. Ecumenical / Hybrid Expressivism**
  *   **The Fix:** Moral sentences express *both* a belief (about natural properties) and an attitude. "Lying is wrong" = "Lying has property N" + "Boo Lying."
  *   **Verdict:** **Solves Logic, Abandons Pure Expressivism.** The belief component handles the logic (beliefs contradict). The attitude component handles the motivation. But critics say this is just Cognitivism with extra steps. If the belief does the logical heavy lifting, why be an expressivist at all?

  **4. Minimalism / Deflationism**
  *   **The Fix:** "True" is just a logical device. To say "'Lying is wrong' is true" is just to say "Lying is wrong." So, expressivists can say moral sentences are truth-apt without positing moral facts.
  *   **Verdict:** **Solves Embedding, Ignores the Metaphysics.** It allows expressivists to use standard logic. But it doesn't explain *why* the attitudes are inconsistent. It essentially says, "Let's pretend they have truth conditions for the sake of logic." Some find this cheating; others find it pragmatic.

  ### 4. How to Structure Your Presentation (Lawyerly Advice)

  Since you are panicking, structure is your friend. Don't try to solve it; try to frame it.

  1.  **Introduction:** State the Expressivist thesis (Meaning = Expression of Attitude). State the F-G challenge (Logic requires Truth/Consistency).
  2.  **The Distinction (The Supervisor's Point):** Explicitly distinguish the **Embedding Problem** (Semantics) from the **Logical Problem** (Inconsistency). Note that early solutions focused on Embedding, but modern critiques (Schroeder) focus on Logic.
  3.  **The Conditional vs. Negation:**
      *   Show how Blackburn handles conditionals (Higher-order attitudes/Consistency).
      *   Show why Negation breaks this (Incompatibility). Use the "Absence of Attitude" vs. "Contradictory Attitude" distinction.
      *   *Concrete Example:* Use the "Guilty Sinner" example. I can Disapprove(Lying) and Disapprove(Disapproving(Lying)). If both are possible, there is no contradiction. If no contradiction, no logic.
  4.  **Evaluation of Fixes:** Briefly run through the options above. Conclude that most fixes **relocate** the problem from "How do we get logic?" to "How do we get a psychology complex enough to mirror logic?"
  5.  **Conclusion:** The F-G problem isn't just about grammar; it's about whether non-cognitive states can bear logical weight. If they can't, Expressivism collapses into Irrationalism. If they can, Expressivism starts looking suspiciously like Cognitivism.

  ### Summary for your peace of mind
  You understand the sketch. The "conceptual issue" past the sketch is **Incompatibility**. Cognitivism gets incompatibility for free (True vs. False). Expressivism has to build it from scratch out of psychological states. Negation is harder than conditionals because conditionals only require linking attitudes, while negation requires making attitudes mutually exclusive.

  You've got this. Your legal training on validity and equivocation is actually the perfect toolkit for this. Just apply it to mental states instead of statutes.
