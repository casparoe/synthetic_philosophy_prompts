  10. **Refining the "Moral Patient" Issue:**
      *   The user asks: "What makes a creature the kind of thing that can be wronged?"
      *   The policy implies: Complexity + Tool Use = Moral Status?
      *   The critique: Behaviorism (Skinner) cannot ground moral status. Only phenomenology or robust teleology can. The policy tries to have it both ways.

  11. **Final Polish:** Check tone (analytical, philosophical, direct). Ensure no reading list is included. Ensure all parts of the prompt are answered. (Self-Correction: Make sure to explicitly address the "graduation" criteria for the stages reading).

  12. **Final Review against constraints:**
      *   Reconstruct commitments? Yes.
