          *   *Reply:* It's a phase transition, not a gradient.
          *   *Soft spot:* Arbitrary threshold.

      *   *Objection 7 (The Killer):* If the loop is representational, what grounds the representation?
          *   *Vocab:* Grounding, symbol grounding problem.
          *   *Reply:* ... (This is the hard one).

  4.  **Refining and Ordering:**
      *   Need to ensure the vocab matches the specific sub-groups (PP, Illusionist, Phenomenologist).
