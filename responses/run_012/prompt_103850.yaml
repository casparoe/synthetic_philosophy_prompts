      *   *Vulnerability 1 (The Definition):* What counts as "representational"? Is this just a magic word to exclude things we don't want to be selves? (PP/Illusionist worry).
      *   *Vulnerability 2 (The Phenomenology):* Does a representational loop explain *what it feels like*? (Phenomenologist worry).
