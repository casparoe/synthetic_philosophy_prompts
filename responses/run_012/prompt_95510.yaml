answer: |-
  Here is the case analysis for your metaontology session, structured according to your five questions.

  ### 1. Map the Parties

  To apply the diagnostic machinery, we must first disentangle the overlapping disagreements. There are three distinct axes of conflict here, and conflating them is what makes the case feel messy.

  **(a) The Dynamical Camp vs. The Structural Camp**
  *   **The Parties:** The IAU majority (Dynamical) versus the minority astronomers who favour geophysics (Structural).
  *   **The Disagreement:** This is not about facts. Both sides agree Pluto is round, orbits the Sun, and shares its neighbourhood with other bodies. The disagreement is over the **purpose of the taxonomy**.
      *   The Dynamical camp believes the category 'planet' should track formation history and orbital dominance (a cosmological purpose).
      *   The Structural camp believes the category 'planet' should track intrinsic physical properties like geology and hydrostatic equilibrium (a geophysical purpose).
  *   **Classification:** This is a substantive disagreement about **theoretical utility**, not a verbal dispute in the shallow sense, though it manifests as a dispute over word extension.

  **(b) Astronomers vs. The Public**
  *   **The Parties:** The scientific community versus laypeople (including schoolchildren and policymakers).
  *   **The Disagreement:** This is a disagreement over the **extension of the word** based on conflicting **linguistic authority**.
      *   Astronomers treat 'planet' as a technical term requiring precision.
      *   The Public treats 'planet' as a cultural kind, fixed by tradition and usage since 1930.
  *   **Classification:** This is largely a **verbal dispute** compounded by a sociological conflict. The public is not arguing about orbital dynamics; they are arguing that the word 'planet' refers to the set of objects they were taught were planets.

  **(c) The IAU as an Institution vs. Everyone Else**
  *   **The Parties:** The IAU General Assembly versus the dissenting astronomers and the public.
  *   **The Disagreement:** This is a disagreement about **standing**.
      *   The IAU acted as though it had the authority to legislate the meaning of a word that belongs to the public language.
      *   The critics (both public and scientific) dispute whether a committee vote can change the reference of a common noun.
  *   **Classification:** This is a **meta-linguistic negotiation** about who has the right to perform conceptual engineering.

  ### 2. Run the Diagnostic

  Let us run the three-step diagnostic you outlined on the core scientific dispute (Dynamical vs. Structural).

  **(i) Identify the disputed term:**
  The term is 'planet'.

  **(ii) Ask whether the parties disagree about any non-linguistic fact:**
  **No.** They agree on Pluto's mass, shape, orbit, and neighbours. They agree on the existence of Eris and the Kuiper Belt. If you handed them a complete physical description of the solar system, they would both sign off on it. Step (ii) fails; there is no factual disagreement about the world.

  **(iii) Ask whether the residual disagreement is substantive or just more words:**
  Here is where the standard machinery often stumbles. The residual disagreement is about **which features are taxonomically relevant**.
  *   Is this factual? No. Nature does not come labelled with 'planet'.
  *   Is this verbal? In the strict sense, yes, because it concerns the intension of a concept.
  *   Is it substantive? **Yes.** It is substantive in a normative or pragmatic sense. The disagreement is about which classification system yields better scientific predictions or clearer theoretical models.

  **Verdict:** The case passes the diagnostic as a verbal dispute, but only if your framework accommodates the idea that verbal disputes can be **substantively normative**. If your machinery assumes "verbal = trivial/shallow", then the Pluto case breaks it. The disagreement is about **conceptual choice**: "Which concept serves our scientific goals better?" That is a real question, even if it isn't a factual one about Pluto's composition. The machinery can accommodate this, but you must explicitly state that 'substantive' includes 'pragmatically useful' and not just 'truth-conditional'.

  ### 3. The Neologism Test

  Your test is: *Suppose the IAU had coined 'helioplanet' for the dynamical category and left 'planet' to ordinary usage. Would anyone still be disagreeing?*

  **Analysis:**
  If the IAU had said, "Pluto is a 'dwarf planet' and also a 'planet', but only the eight large bodies are 'helioplanets'," the **verbal** confusion would vanish. No one would be forced to say "Pluto is not a planet."

  **Does anything survive?**
  Yes. The **theoretical** disagreement survives.
  *   The Dynamical camp would still argue that the 'helioplanet' category is the only one that matters for understanding solar system formation.
  *   The Structural camp would still argue that the 'planet' category (including Pluto) is the only one that matters for understanding geology.

  **Evaluation of the Test:**
  The test is **good**, but it reveals that the original dispute was a hybrid.
  1.  **The Verbal Layer:** The fight over whether to *say* "Pluto is a planet." This dissolves with the neologism.
  2.  **The Theoretical Layer:** The fight over which classification is *scientifically privileged*. This survives.

  If nothing survived the neologism test, the dispute would be purely verbal (like arguing over whether a sofa is a couch). Because residue remains, the dispute was not *merely* verbal. It was a verbal dispute masking a substantive disagreement about **theoretical priority**. The test successfully isolates the non-verbal core: the disagreement over which properties carve nature at its joints.

  ### 4. Reverse Engineering: What the Episode Shows About the Theory

  **The Deflationary Challenge:**
  The deflationary line suggests verbal disputes are shallow and dissolvable. The Pluto dispute was neither shallow nor easily dissolvable; it caused genuine distress and ongoing scientific dissent.

  **Explanation:**
  This is not a counterexample to the theory, provided the theory distinguishes between **verbal** and **trivial**. The persistence of the fight is evidence that the parties care deeply about the **normative question**: "What should our word 'planet' be doing for us?" The theory must acknowledge that conceptual choices have costs and benefits. The fight carried on because the stakes were about **scientific identity and communication**, not just semantics.

  **Whale vs. Tomato:**
  Pluto resembles the **Tomato** case, not the Whale.

  *   **Defense:** In the Whale case, ordinary usage was factually mistaken about biological kind (mammal vs. fish). There was a mind-independent fact of the matter regarding lineage and physiology that settled it. In the Pluto case, there is no mind-independent fact that makes Pluto a planet. Both the dynamical definition and the structural definition are coherent, consistent, and capture real properties. They serve different purposes, just as 'fruit' serves botanists and 'vegetable' serves cooks. The conflict arises only because astronomers demand a single official taxonomy where greengrocers and botanists do not.
  *   **Condition for the Whale:** For Pluto to be a Whale case, 'planet' would have to be a **natural kind** term (like 'water' or 'gold') where science discovers the essential microstructure. If 'planet' referred to a specific formation mechanism that Pluto objectively lacked, the demotion would be a discovery. But 'planet' is a **functional/classificatory** term. For the Whale view to be right, one would have to prove that orbital dominance is the *essential* property of planethood, not just a useful one.

  ### 5. Conceptual Engineering vs. Legitimacy

  **Engineering vs. Analysis:**
  The IAU's move was unequivocally **conceptual engineering**, not conceptual analysis.
  *   **Analysis** would have involved investigating how the word 'planet' was actually used or what natural kind it picked out.
  *   **Engineering** involved stipulating a new definition to serve specific theoretical goals (cleaning up the solar system model), regardless of prior usage.
  They did not discover Pluto wasn't a planet; they changed the rules so that it wasn't.

  **The Public Backlash:**
  The backlash is best read as a complaint about the **legitimacy of the engineer**, not merely a disagreement about the concept.
  *   If a botanist says a tomato is a fruit, the public shrugs because botanists have standing in biology.
  *   When the IAU says Pluto is not a planet, the public resists because 'planet' is a shared cultural asset, not merely technical jargon. The public recognises the engineering attempt and rejects the **authority** of the IAU to legislate common language.

  **Theory Silence:**
  Standard metaontology is often silent on the **sociology of stipulation**. It tells us how to analyse disputes once the meanings are fixed, or how to negotiate meanings between willing parties. It rarely addresses what happens when one group attempts to impose a conceptual change on another without consent. Your reading group should note this gap: the theory explains the *structure* of the dispute (verbal vs. factual), but it lacks the resources to evaluate the *politics* of the definition (who gets to decide).

  **Summary for the Session:**
  The Pluto case is a Tomato-style verbal dispute (competing legitimate classifications) that was mishandled as a Whale-style correction (fixing an error). The verbal-dispute machinery holds up, provided you accept that disputes over concept choice are substantive normative questions, not trivial semantic quibbles. The real philosophical meat lies not in whether Pluto is a planet, but in whether a committee of scientists has the right to engineer the public's concepts without their consent.
