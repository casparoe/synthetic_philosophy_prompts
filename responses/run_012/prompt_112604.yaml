answer: |-
  Your reasoning is muddled because dialetheism posits truth-value gluts rather than gaps, allowing a system like LP to retain the Law of Excluded Middle and classical tautologies while permitting contradictions to be true. The fundamental error lies in treating the third value of LP ("both true and false") as semantically equivalent to the third value of gap theories like Strong Kleene ("neither true nor false"). In LP, the third value is designated, meaning it counts as true for the purposes of logical validity, whereas in gap theories it is undesignated. Consequently, in LP, a sentence of the form $P \lor \neg P$ always takes a designated value (either true or both), so the Law of Excluded Middle remains valid, while $P \land \neg P$ can also take a designated value, meaning contradictions can be true without rendering the system trivial.

  This asymmetry explains why abandoning the classical constraint on contradictions does not require abandoning the Law of Excluded Middle. Logical duality depends on how negation interacts with the set of designated values, not merely on syntactic swapping of connectives; because the "both" value is designated, negation does not swap it into an undesignated status, preserving LEM while allowing true contradictions. Regarding your worry about the collapse of logic, dialetheism preserves the discipline by redefining validity as the preservation of designated values rather than strict classical truth. This change blocks the principle of explosion and invalidates classically valid inference rules like Disjunctive Syllogism, but it leaves classical tautologies intact. Therefore, dialetheism is not merely a metaphysical thesis leaving logic untouched; it is a joint proposal where the metaphysical claim of true contradictions necessitates a paraconsistent logic to prevent triviality while maintaining rational discourse.
