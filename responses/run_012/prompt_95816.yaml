  ## IV. DIAGNOSTICS

  ### 1. Axis Independence and Structure
  The tree relies on five axes. Three are independent; two are dependent.
  *   **Independent Axes:**
      1.  **Immorality as Reason (Q1):** This is the foundational split between Liberalism and Moralism. It is logically prior to all other questions.
      2.  **Standard of Morality (Q6):** Whether we enforce *actual* or *critical* morality is independent of whether we enforce for *retribution* or *cohesion*. (One could theoretically argue for enforcing critical morality for the sake of social cohesion, though rare).
      3.  **Instrument (Q3/Q7/Q9):** The choice of means (criminal vs. non-criminal) is theoretically independent of the ground for action, though political reality often links them.
  *   **Dependent Axes:**
      1.  **Secrecy (Q5/Q8):** This axis only becomes relevant *after* one has accepted immorality as a reason for action (Q1=Yes). If Q1=No, secrecy is irrelevant because the state has no reason to look.
      2.  **Nature of Reason (Q4):** This splits the Moralism branch. It is dependent on Q1=Yes.
  *   **Collapsed Proxies:** The axis "Does the reason survive when conduct is secret?" was split into Q5 (Retributive branch) and Q8 (Cohesionist branch). This is because Retributivists answer based on *desert*, while Cohesionists answer based on *stability*. Treating them as a single node would obscure the different justifications for the same outcome.

  ### 2. Unoccupied Combinations
  The following answer combinations yield no leaf in the tree.

  *   **Combination:** Q1(Yes) + Q4(Inherent) + Q5(No) + Q6(Critical).
      *   **Diagnosis:** **Incoherent.** This position claims acts are inherently wicked (Q4) but only matter if public (Q5), yet the standard of wickedness is philosophical truth not majority belief (Q6). If wickedness is intrinsic, publicity should not mitigate it; if publicity matters, it is likely a social harm view, not an intrinsic wrongness view.
  *   **Combination:** Q1(No) + Q2(Yes) + Q3(No).
      *   **Diagnosis:** **Unattractive.** This permits criminalizing offence (Q2) but forbids non-coercive moral promotion (Q3). It grants the state the power to punish but denies it the power to educate, prioritizing the sword over the book.
  *   **Combination:** Q1(Yes) + Q4(Fabric) + Q6(Actual) + Q8(Existence) + Q9(Criminal) + "Punishment Mandatory".
      *   **Diagnosis:** **Unexplored.** Leaf **I** permits criminalization. A position requiring *mandatory* prosecution of all private immorality (no discretion) is logically possible but politically non-viable; no major theorist argues the state *must* punish every private vice, only that it *may*.

  ### 3. Indistinguishable Leaves
  *   **Leaf H (Public Cohesionism) and Leaf A (Public Offence Principle):**
      *   **Failure:** These leaves cannot be separated by Cases (a), (b), or (d). Both forbid private incest, both permit punishing public desecration, and both ignore majority error if the act is private.
      *   **Explanation:** They converge on all *public* outcomes. They separate only on Case (c) (Secret Majority-Condemned Practice). Leaf A forbids intervention (nobody is offended); Leaf H forbids intervention (nobody knows). To separate them, one needs a case where the public knows of the act but is *not* offended, yet the social fabric is threatened (e.g., a known but tolerated vice that erodes institutions). Without such a case, the practical difference is nil.
  *   **Leaf B (Soft Perfectionism) and Leaf G (Critical Non-Coercivism):**
      *   **Failure:** Both prescribe non-coercive state promotion of morality and forbid criminalization.
      *   **Explanation:** They converge on the *instrument* (education/subsidy). They differ only on the *source* of the morality (Majority preference vs. Philosophical truth). In a democracy where policy reflects majority preference, these positions often result in identical legislation, making them functionally indistinguishable despite theoretical divergence.
