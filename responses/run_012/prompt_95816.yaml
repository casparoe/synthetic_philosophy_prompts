answer: |-
  # SEMINAR HANDOUT: THE MORAL ENFORCEMENT DECISION TREE

  ## I. THE DECISION TREE
  *Answer the following questions in order. Do not skip ahead. Your path determines your jurisprudential position.*

  **1. Is the mere fact that a voluntary act is morally wrong ever a valid reason for the state to consider acting, even if no one is physically harmed?**
  *   **No:** Go to Question 2.
  *   **Yes:** Go to Question 4.

  **2. May the state use criminal law to discourage conduct solely because the majority finds it deeply offensive, even without physical harm?**
  *   **Yes:** **Leaf A (Public Offence Principle)**
  *   **No:** Go to Question 3.

  **3. May the state use non-criminal means (education, subsidies, speech) to promote a specific moral view over another?**
  *   **Yes:** **Leaf B (Soft Perfectionism)**
  *   **No:** **Leaf C (Strict Neutrality)**

  **4. Is the primary reason for intervention that the act is inherently wicked and deserves punishment, or that it weakens the community's shared way of life?**
  *   **Inherently Wicked:** Go to Question 5.
  *   **Weakens Community:** Go to Question 6.

  **5. Does the duty to punish exist even if the act is done in total secrecy?**
  *   **Yes:** **Leaf D (Pure Retributivism)**
  *   **No:** **Leaf E (Public Retributivism)**

  **6. Must the moral standard enforced be the one actually held by the majority, or the one that is philosophically correct?**
  *   **Philosophically Correct:** Go to Question 7.
  *   **Actually Held:** Go to Question 8.

  **7. Is the state permitted to use criminal punishment to enforce this correct morality?**
  *   **Yes:** **Leaf F (Critical Coercivism)**
  *   **No:** **Leaf G (Critical Non-Coercivism)**

  **8. Does the threat to the community require that the public actually know about the conduct, or is the mere existence of the conduct enough?**
  *   **Public Knowledge Required:** **Leaf H (Public Cohesionism)**
  *   **Mere Existence Enough:** Go to Question 9.

  **9. Must the intervention be criminal punishment, or are non-coercive measures sufficient?**
  *   **Criminal Punishment:** **Leaf I (Hard Enforcement)**
  *   **Non-Coercive Measures:** **Leaf J (Soft Enforcement)**

  ***

  ## II. POSITION MAP

  | Leaf | Name | View Statement | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | Public Offence Principle | The state may criminalize conduct only when it causes unavoidable public offence, not mere private immorality. | Must explain why a secret act is harmless but a public one is criminal, even if the moral wrong is identical. |
  | **B** | Soft Perfectionism | The state may encourage virtue through speech and subsidy but may never coerce compliance. | Risks using state power to manipulate culture while claiming to respect individual liberty. |
  | **C** | Strict Neutrality | The state must remain neutral on all conceptions of the good life unless harm to others occurs. | Cannot justify state support for any civic virtue, including those necessary for democracy itself. |
  | **D** | Pure Retributivism | Wrongdoing inherently deserves state punishment regardless of social consequences or publicity. | Requires the state to police private bedrooms to ensure wickedness does not go unpunished. |
  | **E** | Public Retributivism | Wrongdoing deserves punishment only when it violates public order or becomes publicly known. | Makes the *desert* of punishment depend on the luck of being caught rather than the act itself. |
  | **F** | Critical Coercivism | The state may criminalize acts that are truly wrong, even if the majority believes they are permissible. | **UNOCCUPIED:** Requires a state authority capable of knowing moral truth better than the populace. |
  | **G** | Critical Non-Coercivism | The state should promote true morality through education but lacks the authority to coerce it. | Must explain why the state knows the moral truth but lacks the authority to enforce it. |
  | **H** | Public Cohesionism | The state may intervene only when public knowledge of immorality threatens social stability. | Permits the state to suppress truth if knowing the truth would destabilize society. |
  | **I** | Hard Enforcement | The state must criminalize any private immorality that the majority believes threatens social cohesion. | Requires punishing individuals as scapegoats to maintain a collective feeling of security. |
  | **J** | Soft Enforcement | The state may discourage private immorality through regulation or stigma but not criminal law. | Creates a second-class citizenship for those whose lifestyles are officially discouraged but not banned. |

  ***

  ## III. CASE VALIDATION

  *Verdicts indicate whether state intervention is **Justified (J)**, **Forbidden (F)**, or **Discretionary (D)**. Instrument (Criminal/Non-Criminal) noted where distinct.*

  | Leaf | (a) Private Incest | (b) Public Desecration | (c) Secret Majority-Condemned Practice | (d) Majority Wrong / Phil Right |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | F | J (Criminal) | F | F |
  | **B** | D (Non-Crim) | D (Non-Crim) | D (Non-Crim) | D (Non-Crim) |
  | **C** | F | F | F | F |
  | **D** | J (Criminal) | J (Criminal) | J (Criminal) | F (If Phil Right) |
  | **E** | F | J (Criminal) | F | F (If Phil Right) |
  | **F** | J (Criminal) | J (Criminal) | J (Criminal) | F (If Phil Right) |
  | **G** | D (Non-Crim) | D (Non-Crim) | D (Non-Crim) | F (If Phil Right) |
  | **H** | F | J (Criminal) | F | F (If Majority Accepts) |
  | **I** | J (Criminal) | J (Criminal) | J (Criminal) | J (Criminal) |
  | **J** | D (Non-Crim) | D (Non-Crim) | D (Non-Crim) | D (Non-Crim) |

  **Convergence Note:** Leaf **I** (Hard Enforcement) and Leaf **D** (Pure Retributivism) return identical verdicts on all four cases *provided* the act in Case (d) is actually wrong. They separate only if the Majority condemns an act that is actually permissible: Retributivism forbids intervention; Hard Enforcement permits it. Leaf **I** and Leaf **J** (Soft Enforcement) converge on justification (both say Yes to Incest) but diverge on instrument (Criminal vs. Non-Criminal).

