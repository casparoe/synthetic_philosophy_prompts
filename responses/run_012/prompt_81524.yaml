answer: |-
  **Exam Question**

  **Evaluate the following claim: "Adam Smith's critique of empire was merely technical; he objected not to imperialism itself, but to Britain's mismanagement of it."** In your answer, you must explain the specific economic mechanism by which the colonial monopoly harms Britain rather than the colonies, assess whether his defense of the Navigation Acts contradicts his liberal principles, and specify what political remedy he actually proposes for the colonial relationship.

  ***

  **Model Answer**

  The claim that Smith's objection to empire was merely managerial misunderstands the structural nature of his critique. Smith does not argue that Britain is running the empire badly; he argues that the mercantilist structure of the empire is inherently self-defeating for the metropole. His objection is not that the administration is incompetent, but that the system violates the natural allocation of capital, harming Britain's long-term industrial capacity regardless of who manages it.

  Smith's economic mechanism focuses on the diversion of capital. Under the colonial monopoly, profits in the colony trade are artificially higher than in nearby trades. This draws British capital away from frequent, nearby European exchanges toward distant, slow-return colonial ventures. Because capital turns over more slowly in distant trade, the same amount of capital supports less productive labor. This diversion raises the general rate of profit in Britain, which sounds beneficial but actually undermines competitiveness. Higher profits mean higher prices for British manufactures, making them less competitive against other European nations. Consequently, the monopoly shrinks Britain's share of global trade rather than expanding it. The cost is not borne primarily by the colonies, who pay higher prices for imports, but by Britain itself: consumers pay more, and the productive capacity of the nation is stifled because capital is misallocated toward monopoly rents rather than productive industry.

  However, Smith is not a dogmatic laissez-faire absolutist. He defends the Navigation Acts on grounds of defense, famously noting that "defence is of much more importance than opulence." This is not a hole in his theory papered over by convenience, but a principled hierarchy of ends. Security is a prerequisite for wealth; without national survival, economic efficiency is irrelevant. By conceding this, Smith sacrifices pure economic optimality for political sustainability. He acknowledges that the wealth of nations depends on the existence of the nation. The cost of this exception is accepted consciously: Britain pays higher prices for shipping and trade restrictions to maintain naval supremacy. This distinguishes him from later ideologues; he recognizes that markets operate within political containers that must be secured, even at an economic cost.

  Regarding the remedy, Smith does not simply demand immediate abolition of the empire, nor does he advocate for indefinite retention. His proposal is conditional and political. He suggests that if the colonies are to be retained, they should be represented in Parliament and taxed proportionally to share the cost of defense. This would integrate them into the constitutional structure, removing the grievance of taxation without representation. However, he acknowledges this is unlikely. His alternative is gradual emancipation. If the cost of defending the colonies exceeds the revenue gained from the monopoly—which he believes it does—Britain should voluntarily let them go. He argues for a peaceful separation before a violent one is forced, transforming the relationship from master-subject to friendly allies. This is not a call for immediate collapse, but a strategic retreat based on cost-benefit analysis.

  Ultimately, Smith's critique is systemic, not technical. The empire is not failing because of bad management; it is failing because the mercantilist logic requires capital to be used inefficiently to sustain political control that costs more than it yields. While he allows for defense exceptions, his core argument is that the monopoly enriches a few merchants at the expense of the nation's industrial future. The remedy is either full political integration with shared costs or dignified separation. To say he only objected to mismanagement implies the system could work if run well; Smith's entire economic framework demonstrates that within the premises of natural liberty, the mercantilist empire cannot work at all.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Mechanism: Capital Diversion (4 marks)**
  *   **Must hit:** Explanation that monopoly draws capital from nearby/fast trades to distant/slow trades.
  *   **Common mistake:** Vaguely stating "trade was restricted" without explaining the diversion of capital stock.

  **2. Mechanism: Harm to Metropole (4 marks)**
  *   **Must hit:** Identification that Britain pays via higher general profits/lower competitiveness, not just colonial exploitation.
  *   **Common mistake:** Arguing the colonies bear the primary economic burden of the monopoly.

  **3. Defense Exception: Principled Hierarchy (4 marks)**
  *   **Must hit:** Defense of Navigation Acts framed as security > opulence, not as a theoretical inconsistency.
  *   **Common mistake:** Treating the exception as a contradiction or hypocrisy in Smith's liberal theory.

  **4. Remedy: Integration or Gradual Release (4 marks)**
  *   **Must hit:** Specific proposal of representation/taxation OR gradual emancipation, rejecting immediate abolition.
  *   **Common mistake:** Claiming Smith demanded immediate independence or total abolition of the empire.

  **5. Thesis: Structural vs. Managerial (4 marks)**
  *   **Must hit:** Argument refutes the prompt by showing the flaw is in the mercantilist structure, not administration.
  *   **Common mistake:** Agreeing with the prompt that better administration could have saved the mercantilist system.

  **What separates a 16 from a 20:** A 20 connects the economic mechanism to the political remedy, showing how the capital diversion makes the political cost of defense unsustainable, whereas a 16 treats the economics and politics as separate checklist items.
