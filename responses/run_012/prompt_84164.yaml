  2.  **Deconstruct Lexical Threshold Negative Utilitarianism (LTNU):**
      *   *Negative Utilitarianism (NU):* Prioritises the reduction of suffering over the creation of happiness.
      *   *Lexical:* Means "dictionary order" or "lexicographical". Like sorting words: 'A' comes before 'B'. You don't trade letters. One category strictly dominates the other.
      *   *Threshold:* There is a specific level of severity. Suffering *above* this threshold is lexically prior to anything else. Suffering *below* this threshold might be tradeable against pleasure.
      *   *Core Claim:* Preventing extreme suffering (above threshold) is infinitely more important than producing any amount of pleasure. Below the threshold, normal trade-offs might apply (or a milder form of negative utilitarianism).

