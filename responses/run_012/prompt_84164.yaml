  I've been trying to get my head round lexical threshold negative utilitarianism for a philosphy society thing, and I think I've tied myself in knots. As I understand it, the view says there's a threshhold of suffering so bad that no amount of pleasure can ever make up for it, and that this shows pleasure and pain can't be put on the same scale at all. But if they're incommensurable, how can the view say anything about trade-offs in the first place? And doesn't it also mean that if even a tiny bit of suffering is below the threshold, we should still wipe out all sentient life to stop it? I feel like I'm missing something obvious. Could you explain, in British English, what the view actually says and where my reasoning goes wrong? No reading list or citations needed, just the ideas.
