      *   *Mechanism:* It's a hierarchical structure.
          *   Level 1: Prevent extreme suffering (above threshold).
          *   Level 2: Once Level 1 is satisfied (or if no extreme suffering exists), then look at Level 2 (minor suffering vs. pleasure).
      *   *Analogy:* Safety vs. Comfort. You don't trade a guaranteed fatal crash for a more comfortable seat. But you might trade a slightly bumpier ride for a faster journey. The "fatal crash" is lexically prior.
