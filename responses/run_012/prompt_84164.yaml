      *   *Resolution:* The threshold protects against the "world-exploder" conclusion. You only destroy the world if the suffering in it exceeds the threshold *and* cannot be avoided otherwise. But usually, LTNU allows for lives worth living if the suffering stays below the lexical threshold.

