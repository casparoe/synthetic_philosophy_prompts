  Good evening everyone. For those of you who don't know me, I'm the best man, which basically means I'm the friend who knew Dan when he thought ironing was a suggestion rather than a requirement. I want to start by saying how incredibly welcome Priya's family makes us feel today. Looking around this room, seeing both sides here together, it's clear that what we're celebrating isn't just a marriage, but a merger of two wonderful communities. And Dan, you look sharp. I know you're nervous, but try not to stand so stiffly; you're not posing for a mugshot.

  I've been thinking a lot about what to say today, specifically about the last year. Because anyone who knows you two knows that getting to this altar wasn't a straight line. Last year was heavy. Priya had a career opportunity in another city, and Dan's mom got sick at almost the exact same time. For about three months, it looked like life was going to pull them apart. And I want to be honest about that, not to dwell on the hard times, but to honor the weight of the choice they made. Because here is the thing: there was no obvious right answer. It wasn't a case where one path was clearly better and they just had to find the courage to take it. It was worse than that. It was a situation where both options were vital, both were good, and neither could be measured against the other on the same scale.

  My brother, who insists on reminding everyone he has a philosophy degree, tried to explain this to me over beers. He used a big word I won't repeat because it sounds like a diagnosis, but his point was actually quite beautiful. He said that the most important choices in life aren't the ones where you pick the winner. They're the ones where the world doesn't give you a ranking. When you can't compare apples to apples, you have to create your own reason for choosing. And that is exactly what Dan and Priya did. They didn't find the right path hidden in the bushes. They stood in that gap, where logic runs out, and they built a bridge. They decided that being together was the thing that made the choice right, not the other way around. That is a rare kind of love. It's not just about feeling good when things are easy; it's about standing in the uncertainty and saying, we will make this the correct decision by living it together.

  Now, acknowledging that there is no scoreboard in love does not mean there are no rules. For example, Dan, we need to address the dance floor. I know you view dancing as a tactical hazard assessment rather than a celebration. I have seen you move like you are defusing a bomb in a crowded room. But here is my advice: Priya doesn't care if you have rhythm. She cares that you're there holding her hand while the music plays. Just like last year. You didn't need to know the perfect steps; you just needed to stay in the dance with her.

  So, when I look at the two of you, I don't see a couple who got lucky and found the easy road. I see two people who looked at a impossible equation and solved it by adding themselves to the sum. To Priya's family, thank you for welcoming us. To Dan's family, thank you for your strength. And to the couple, may you always find that when the world stops making sense, you make sense to each other. Please raise your glasses. To Dan and Priya.
