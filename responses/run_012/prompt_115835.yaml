answer: |-
  **Setting:** *The hotel bar at the HOPOS conference. 11:30 PM. Empty glasses and a notebook pushed to the side. Marcus (Systematic Hobbesian) and Elena (Historian of Mathematics) are leaning in, voices low but intense.*

  **Elena:** You're dodging the quadrature issue, Marcus. You can't build a system of *scientia* on a foundation that Wallis dismantled in public. Hobbes wasn't just wrong about squaring the circle; he was wrong about what calculation *is*. When he talks about the geometrical method in *De Corpore*, he's borrowing prestige from a discipline he couldn't actually practice.

  **Marcus:** I'm not dodging it. I'm bracketing it. Look, we all know Hobbes couldn't square the circle. He was obsessed, he was stubborn, and Wallis humiliated him. But you're conflating the *success* of the mathematical results with the *normative role* of the method. Hobbes isn't saying, "I am Euclid reborn." He's saying, "Philosophy must proceed the way geometry *ought* to proceed."

  **Elena:** But if the model is broken, the analogy collapses. You want to say civil philosophy is a science because it mimics geometry. But Hobbes's geometry is a caricature. He rejects algebra because it's "symbol-pushing," right? He thinks you need intuitive grasp of magnitudes. But by 1650, the future is algebra. It's analytic. Hobbes is clinging to a synthetic, constructive ideal that was already becoming obsolete. If his model of "science" is based on a rejection of the very tools that make mathematics rigorous, why should we take his political science seriously?

  **Marcus:** Because the rejection of algebra is the point! It's not about computational power; it's about epistemic transparency. For Hobbes, Wallis's algebra is derivation without generation. You manipulate symbols and get a result, but you don't *see* the cause. You don't know *why* it's true, only *that* it's true. Hobbes needs demonstration to be generative. I have to construct the figure to know the figure.

  **Elena:** There's the distinction. Derivation versus Generation. But here's where I press you: that works for a triangle. I can generate a triangle in my mind by stipulating the motion of lines. But you can't generate a commonwealth that way. This is where the historian has to slap the systematicist. You can't generate a state from first principles the way you generate a circle by rotating a line. A circle is necessary; a commonwealth is a mess of human passions, historical contingencies, and power struggles.

  **Marcus:** That begs the question of what the commonwealth *is*. If the commonwealth were a natural organism, you'd be right. We couldn't know it scientifically because we didn't make it. But Hobbes's whole move in *Leviathan* is that the state is an *artifact*. It's an "Artificiall Man." We *do* make it. The Sovereign is the soul, the magistrates are the joints, the rewards and punishments are the nerves. Because we construct it via the Covenant, we know the causes. We know the recipe. Therefore, we can have demonstrative knowledge of it.

  **Elena:** But do we? I mean, really? When I draw a circle, the properties follow necessarily from the construction. When I sign a social contract, does peace follow necessarily? Hobbes thinks it does, but history suggests otherwise. The "generation" in politics isn't a geometric construction; it's a speech act, a performative commitment that can be broken. In geometry, the line doesn't decide to stop rotating. In politics, the subject decides to revolt. The modality is different. You're treating a contingent agreement as if it has the necessity of a geometric proof.

  **Marcus:** Not the agreement itself, but the *obligation*. Once you grant the definition of human nature—motion, appetite, aversion—and you grant the rational necessity of self-preservation, the move to the commonwealth is demonstrative. It's *a priori* in the Hobbesian sense. We deduce the necessity of the Sovereign from the definition of the human material. It's not that the state can't fall; it's that if it falls, it's because the generation was flawed. Just like if your circle is wobbly, you didn't follow the construction. The science is in the causal recipe, not the empirical durability.

  **Elena:** That's a convenient retreat into normativity. But let's go back to the math, because the Wallis fight wasn't just about who got the area right. It was about whether algebra counts as science. Wallis says yes, you can reason with symbols even if you can't visualize the magnitude. Hobbes says no. If Hobbes is right, then political philosophy must be grounded in intuitive, constructive steps. But language—the medium of politics—is algebraic! It's symbolic. It's arbitrary. If Hobbes hates algebra in math because symbols detach from referents, why does he think language in politics can secure demonstration? Words in politics are even slipperier than *x* and *y*.

  **Marcus:** Because we define the terms! That's the first step of the method. "Right Reason" isn't a feeling; it's the agreed-upon definitions. In the commonwealth, the Sovereign fixes the definitions. Just as the geometer stipulates what a "point" is, the Sovereign stipulates what "Justice" is. That's what makes it science. Without that stipulation, you have disputation. With it, you have computation. Hobbes is trying to turn politics into a calculus of obligations.

  **Elena:** But the Sovereign isn't a geometer. And the subjects aren't static magnitudes. You're defending a Hobbes who is incredibly sophisticated about the *structure* of science but naive about the *material*. The historian sees a guy terrified of the new mathematics, trying to force Euclid into a world that had moved on to Viète and Descartes. He wants the certainty of the ancients. When he says "we make the commonwealth," he's trying to bootstrap necessity out of contingency. He wants the political order to be as indisputable as 2+2=4. But the Wallis debate shows he didn't even understand why 2+2=4 works in the new algebra.

  **Marcus:** Okay, fine. He was a bad mathematician. I'll concede that. But you're missing the philosophical payoff. The failure of his math highlights the ambition of his philosophy. He realizes that in the modern world, truth isn't given by God or Nature anymore. It's made. We make truth in geometry by constructing figures. We make truth in politics by constructing States. The fact that he failed at the first doesn't mean the insight into the second is void. The insight is: *Scientia* is only possible where we are the authors of the causes.

  **Elena:** I agree he thinks that. I'm questioning whether the transfer holds. In geometry, the generation is mental. I don't need to physically draw the circle to know its properties. In politics, the generation is physical and violent. It involves swords, and fear, and actual death. You can't "demonstrate" a sword stroke. When Hobbes talks about "generating" the commonwealth, he's using a metaphor that does heavy lifting to hide the blood. If you treat it as a geometric generation, you risk thinking the State is a logical necessity rather than a power grab.

  **Marcus:** But that's why he needs the geometric method! To tame the blood. If we treat the state as just a power grab, we're back in the state of nature. We need to view it as a rational construction to justify obedience. It's not about whether the analogy is perfect; it's about whether it's *normatively effective*. Hobbes needs us to believe the state is demonstrable, because if it's merely probable, civil war returns. The "science" is a peace-keeping device.

  **Elena:** So you're admitting it's rhetorical?

  **Marcus:** I'm admitting it's constitutive. The demonstration creates the object. If we all accept the definitions, the commonwealth holds. If we start arguing about the definitions like Wallis argued about fluxions, it collapses. That's why Hobbes attacked Wallis so viciously. It wasn't ego. It was terror. If algebra wins—if symbol manipulation without intuitive grounding becomes the model of truth—then anyone can manipulate the symbols of law and justice without reference to the "real" motion of human bodies. Algebra is democratic; geometry is authoritarian. You have to see the construction to agree. With algebra, you just trust the calculator. Hobbes doesn't trust the calculator. He trusts the Sovereign.

  **Elena:** Now *that* I can work with. The math feud is a proxy for the political anxiety. But you still have to deal with the fact that his constructivism in politics is circular. We generate the Sovereign to define truth, but the Sovereign is generated by the agreement on truth. It's not a linear derivation from first principles. It's a bootstrapping operation. Geometry doesn't bootstrap. A circle doesn't define its own radius.

  **Marcus:** No, but the *concept* of a circle does. And the concept of the Commonweath is self-referential. That's the Artificial Man. It's a monster, Elena. It's supposed to be weird. It's supposed to be something that shouldn't exist by natural laws but does exist by institutional laws. Hobbes knows it's a stretch. That's why he insists so hard on the method. He knows the material is recalcitrant.

  **Elena:** So the systematic reading saves the philosophy by sacrificing the history. You keep the "Generation" model but admit the "Geometry" is metaphorical.

  **Marcus:** I keep the Geometry as normative. He's telling us how we *ought* to reason, not necessarily how the world *is*. But the Historian in you keeps pointing at the wreckage of *De Corpore* and saying, "This guy shouldn't be teaching us how to reason."

  **Elena:** Because he conflates the map with the territory. He thinks because he can define "Person" in Chapter 16, he's constructed a Person. But the resistance of the world matters. Wallis knew that. The math works because it engages with problems that resist solution. Hobbes's politics often ignores the resistance. He thinks if the logic is tight, the obedience will follow.

  **Marcus:** And yet, here we are, four hundred years later, still arguing about whether the logic holds. Maybe that proves it *is* a science. It generates endless demonstration.

  **Elena:** (Laughs, signals for the check) Or maybe it proves it's a theology of the state dressed up in Euclid's clothes. But fine. Derivation vs. Generation. If you write the chapter, make sure you clarify that for Hobbes, Generation *is* the only valid Derivation. That's where the trap is. If you can't generate it, you can't know it. Which means most of politics isn't science, it's prudence.

  **Marcus:** And that's the chapter. Hobbes wants all of it to be science. But he only gets science where he can claim we made the thing. Geometry: we made the figures. Politics: we made the State. Nature: God made it, so we only have hypotheses.

  **Elena:** Exactly. So the disagreement isn't about whether he was good at math. It's about whether the "making" in politics is the same kind of "making" as in geometry. I say no. You say yes.

  **Marcus:** And the reader has to decide if the Sovereign is a Geometer or a Gamble.

  **Elena:** Cheers to that.

  **Marcus:** Cheers. Now, are you going to finish that whiskey, or can I demonstrate its consumption?

  **Elena:** Don't you dare apply the method to my drink. Some things are just given.
