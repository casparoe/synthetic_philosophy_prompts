answer: |-
  Your question touches on one of the most famous episodes in 20th-century moral philosophy, but it contains a crucial misunderstanding of Anscombe's position.

  The short answer is: **Anscombe did not believe that conventional firebombing was permissible.** She did not object to Truman because he used *atomic* weapons rather than conventional ones; she objected because he intentionally targeted civilians, a policy she believed the Allies had already adopted with conventional firebombing (such as at Dresden and Hamburg).

  To understand why she classified Truman's decision as **murder** rather than a tragic side effect of war, we must look at her specific application of the **Doctrine of Double Effect** and her theory of **intention**.

  ### 1. Correction of Premise: She Condemned Conventional Area Bombing Too
  Your query suggests a contrast: *Why are atomic bombings murder, while conventional firebombing... does not?*

  According to Anscombe, **both** count as murder if they involve the intentional targeting of civilian populations. In her pamphlet *Mr. Truman's Degree* (1958), she explicitly links the atomic bombings to the earlier strategic bombing campaign against Germany. She argued that the moral corruption began earlier, with the British and American policy of "area bombing" (destroying entire cities to break civilian morale).

  She did not let Churchill or the RAF off the hook morally; however, the specific occasion for her protest was Oxford's decision to honor Truman. Her point was that Truman was being honored for an act that was, in her view, a war crime. She wrote:

  > "It is the adoption of the policy of bombing civilians... that is the crime. People say that the atomic bomb is different. It is not different in the relevant moral respect."

  Therefore, her objection was not about the *scale* of death (consequentialism) or the *type* of weapon (nuclear vs. conventional). It was about the **moral nature of the act**.

  ### 2. The Core Argument: Intention vs. Foreseeability
  Anscombe was a Thomist (following Aquinas) and a proponent of the **Doctrine of Double Effect (DDE)**. This doctrine distinguishes between:
  1.  **Intended effects:** What you choose to bring about as a means or an end.
  2.  **Foreseen but unintended side effects:** Consequences you anticipate but do not choose.

  For Anscombe, an act is morally permissible only if the evil effect (e.g., civilian death) is **not intended**.

  *   **Permissible (in her view):** Bombing a munitions factory. You intend to destroy the factory (military target). You foresee that civilians living nearby might die. Their death is tragic, but it is not the *means* by which you achieve victory.
  *   **Impermissible (Murder):** Bombing a city center to "break the will of the people." Here, the terror and death of civilians are the **means** to the end of surrender.

  Anscombe argued that the stated justification for Hiroshima and Nagasaki (and for the firebombing of Tokyo and Dresden) was precisely to shock the Japanese/German government into surrender by demonstrating the vulnerability of their civilian populations. Because the death of civilians was the *mechanism* of victory, it was intentionally chosen. For Anscombe, **intentionally killing the innocent is murder, regardless of whether it happens in war or peace.**

  ### 3. Why Truman Specifically?
  If she opposed the bombing of German cities too, why protest Truman?
  1.  **The Honor:** Oxford was proposing to give Truman an honorary Doctor of Civil Law degree. Anscombe argued that a university should not honor a man who, by her lights, had committed mass murder. It was a protest against the institutional normalization of war crimes.
  2.  **The Clarity of the Act:** The atomic bomb made the nature of the attack undeniable. With conventional bombing, one could hide behind the fog of war or claim (disingenuously) that one was targeting "industrial areas." With the atomic bomb, the target *was* the city. It laid bare the policy of targeting civilians.
  3.  **The Decision Maker:** Truman personally authorized the specific order. Anscombe focused on individual moral responsibility. She wanted to highlight that heads of state are not exempt from moral law.

  ### 4. Addressing the "Scale" Argument
  You surmised that her objection must come down to the *scale* of civilian deaths (disproportionality). This is a common misconception. Anscombe was not a consequentialist. She did not argue that killing 100,000 people is wrong but killing 50,000 is okay.

  She argued that **killing zero innocent civilians intentionally** is the requirement.

  If a conventional bombing raid killed 10,000 civilians because they were living next to a legitimate military target, Anscombe might have deemed it permissible (assuming proportionality). But if a conventional raid killed 10,000 civilians because the goal was to kill them to terrorize the government, she deemed it murder. The atomic bomb was simply the most stark example of the latter policy.

  ### 5. Summary of Her Position
  To answer your specific question on what made Truman's decision murder rather than a tragic but permissible act:

  1.  **Target Selection:** The targets (Hiroshima and Nagasaki) were chosen not primarily for their military utility, but for their psychological impact.
  2.  **Intention:** The deaths of the civilians were not a "side effect"; they were the **means** to force surrender.
  3.  **Immunity of Non-Combatants:** Anscombe held that non-combatants have absolute immunity from direct attack. Violating this immunity is not "war"; it is murder.
  4.  **Consistency:** She applied this same logic to conventional firebombing. She did not believe the firebombing of cities was permissible; she believed the entire Allied strategic bombing campaign had descended into barbarism, and honoring Truman was a way of whitewashing that history.

  In short, Anscombe's protest was not against the *atom bomb* as a technology, but against the **policy of targeting civilians**, which the atom bomb exemplified. She would have objected just as strongly if Truman had firebombed Tokyo with the specific intent of massacring civilians to force surrender—which, historically, he did.
