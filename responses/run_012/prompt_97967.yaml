  5.  **Designing the Roles & Secret Objectives:**
      *   Need conflicting incentives regarding the "Backsliding" label.
      *   *Govt:* Deny backsliding, emphasize stability/legality.
      *   *Opposition:* Claim backsliding, mobilize outrage.
      *   *Judge:* Protect institutional legitimacy, avoid political fight.
      *   *Broadcaster:* Keep funding, maintain independence.
      *   *Election Comm:* Ensure election happens, avoid disqualification.
