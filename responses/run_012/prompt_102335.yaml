answer: |-
  **The Constituent Assembly of Republia**

  **Delegate A:** "Article 1: This Constitution is unamendable."

  **Delegate B:** "Passed by simple majority?"

  **Delegate A:** "Yes. Efficient."

  **Delegate B:** "So a future simple majority could repeal Article 1."

  **Delegate A:** "No. Article 1 forbids repeal."

  **Delegate B:** "But Article 1 *is* the majority vote. You're saying this majority binds that majority. Why does this vote count more than that one?"

  **Delegate A:** "Because it's constitutional."

  **Delegate B:** "Because you say so. It's a performative contradiction. We are the People. At T1 we are sovereign. At T2 we are subjects. But the vote is the same. You're trying to use a statute to kill the statute-maker."

  **Delegate A:** "It's a Ulysses contract. Tying ourselves to the mast."

  **Delegate B:** "Ulysses ordered the crew. But who ordered the crew to obey? If they can ignore him later, the rope is paper. If they can't, *they* are bound, not him. You're creating a regress of binders. Who binds the binders?"

  **Delegate A:** "So we need a precommitment to the precommitment?"

  **Delegate B:** "We need a god. Or just admit Ulysses was sane enough to give the order, but mad enough to need it. We're just sane enough to know we're lying."

  ***

  **Scholarly Note**

  1.  **The Regress:** You are not improvising. This is the standard *pouvoir constituant* vs. *pouvoir constitué* problem (Schmitt/Kelsen). It is settled logic that a sovereign cannot logically bind its successor without invoking a higher norm (the *Grundnorm*). The regress is a canonical objection.
  2.  **Coherence of Precommitment:** This is contested. Elster (*Ulysses and the Sirens*) argues collective diachronic precommitment is conceptually incoherent because collectives lack a single "will" over time (unlike individuals). Constitutional functionalists (Holmes, Sunstein) counter that it works practically via cost imposition, regardless of logical purity.
  3.  **Unamendability:** Legally valid in many jurisdictions (Germany, India, Brazil). Theoretically contested: Democratic theorists (Waldron) argue it violates political equality; Constitutionalists argue it protects democracy from suicide. The real disagreement is whether "dead hand control" is a logical bug or a functional feature.
