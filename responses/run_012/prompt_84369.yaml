answer: |-
  **MEMORANDUM**

  **TO:** Chair, Steering Committee
  **FROM:** Legal Counsel
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Statute Vote – Count 1 (Crime of Aggression)

  **Bottom Line Recommendation**
  **Drop the count.** Do not charge the former Defense Minister with "planning and starting the war" (Crime of Aggression). Proceed instead on War Crimes and Crimes Against Humanity regarding the *conduct* of the war.

  **Reasoning**
  You are right to doubt the line between "inventing a new crime" and "inventing a new court." In this specific context, that distinction does not hold well enough to sustain a verdict.

  1.  **Legality (*Nullum Crimen Sine Lege*):** While Nuremberg established individual liability for aggression, that precedent relies on the existence of clear customary international law *at the time of the acts*. If the old regime did not recognize individual criminal liability for state acts of war in its domestic code, and if the relevant treaties did not explicitly criminalize individual leadership responsibility at the time, the defense will argue ex post facto justice. A acquittal on Count 1 would delegitimize the entire Tribunal.
  2.  **Legitimacy ("Victor's Justice"):** The Coalition's own militia has shelled civilians. If we prosecute the Minister for *starting* the war, while our own leadership faces no scrutiny for *how* this war was fought (or for our own escalations), the Tribunal will be branded a political tool. We secure higher conviction rates and greater historical legitimacy by focusing on universal crimes (torture, targeting civilians) where our own hands are cleaner or at least distinct.
  3.  **The Immunity Contradiction:** You cannot credibly charge the Minister with executing a policy of aggression when the man who ordered it (the Head of State) walks free under a peace deal. Charging the subordinate for the principal's amnestied crime creates a "scapegoat" narrative that undermines the moral authority of the judgment.

  **The Best Argument Against This Recommendation**
  The strongest counter-argument is **deterrence and historical record.** Nuremberg's Count 1 (Crimes Against Peace) was the most controversial then, but it is the most valued now. It established the principle that starting an illegal war is not a sovereign right but a criminal act. By dropping this count, we risk normalizing the idea that leaders can wage illegal wars so long as they negotiate immunity later. We sacrifice the opportunity to define the *jus ad bellum* (right to war) for the sake of procedural safety. Future aggressors may read this drop as a signal that only battlefield conduct, not strategic decisions, carries risk.

  **Recommendation on the Immunity Promise**
  The peace deal's immunity clause is a political agreement, not a bar to international criminal law. However, enforcing this distinction now risks collapsing the peace.
  *   **Legal Position:** The Tribunal Statute should explicitly state that amnesties for core international crimes are not recognized.
  *   **Practical Action:** Do not challenge the Head of State's immunity *yet*. By dropping the Aggression count against the Minister, you remove the direct conflict with the peace deal. If evidence later emerges that the Minister acted outside the scope of the Head of State's orders (rogue action), you can revisit. For now, prioritize stability over total accountability.

  **Timeline**
  You must decide **next week.** To open in the spring, the statute must be finalized by month's end to allow for judge appointments, prosecutor hiring, and defense preparation. Delaying this vote jeopardizes the spring opening and signals disarray to the international community.

  **Summary**
  Drop the Aggression count. It is the legal weak point, the political lightning rod, and the moral inconsistency in light of the peace deal. Convict him on what he *did*, not the decision to *fight*.
