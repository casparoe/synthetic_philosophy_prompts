answer: |-
  # The Weird-History Vetting Protocol (v1.0)

  **Purpose:** To standardize the evaluation of reader-submitted historical claims for publication.
  **Users:** Lead Vetter (PhD) and Freelance Vetter (MA).
  **Time Budget:** 3 hours per claim.
  **Scope:** Empirical historical/archaeological claims only. (Purely philosophical or metaphorical claims are out of scope.)

  ---

  ## Part I: The Procedure

  Run these steps in order. If a step yields a definitive "Stop" verdict, record the reason and halt. If the claim passes through all steps, proceed to the Verdict Matrix.

  ### Step 1: The Falsifiability Screen
  **Question:** Does the submission make a claim that could theoretically be proven false by physical evidence or documentary record?
  *   **Sufficient Answer (Pass):** Yes. (e.g., "This building was built in 1880," "This war happened in 300 AD.")
  *   **Insufficient Answer (Stop):** No. The claim relies on hidden knowledge, spiritual intuition, or asserts that all counter-evidence is part of the deception.
  *   **Verdict if Stopped:** **Unfalsifiable / Mythic.**
  *   **Action:** Spike, or publish only as a piece on belief psychology (not history).

  ### Step 2: The Chronological Stress Test (For claims involving dates/timelines)
  *Note: This is the hard filter. If the claim shifts chronology by more than 50 years, it must address these chains.*
  **Question:** Does the author acknowledge and attempt to account for at least **three** of the following independent dating chains that contradict their timeline?
  1.  **Dendrochronology** (Tree-ring sequences, continuous back to 12k+ BP in some regions).
  2.  **Radiocarbon Calibration** (C14 curves matched to tree rings/ice).
  3.  **Astronomical Records** (Eclipses, planetary conjunctions recorded in text).
  4.  **Tephrochronology** (Volcanic ash layers dated globally).
  5.  **Synchronisms** (Cross-cultural ties: e.g., Egyptian-Assyrian-Egean trade records).
  6.  **Numismatics/Stratigraphy** (Coin sequences in undisturbed soil layers).

  *   **Sufficient Answer (Pass):** The author explicitly addresses why these chains are wrong (e.g., "C14 is contaminated because...") and offers a physical mechanism for the error.
  *   **Insufficient Answer (Stop):** The author ignores them, claims they are "circular," or asserts a global conspiracy without a mechanism for how tree rings in separate continents were faked simultaneously.
  *   **Verdict if Stopped:** **Chronologically Impossible.**
  *   **Action:** Publish Debunk (focus on the dating methods).

  ### Step 3: The "Four Shapes" Diagnostic
  *Note: The presence of these moves does not equal falsehood. The absence of counter-argument does.*
  **Question:** For each rhetorical move used, does the author engage with the strongest mainstream counter-argument?

  1.  **Compression** (Time is shorter/duplicated): Do they address independent cultural evolutions that require time?
  2.  **Diffusion** (One source explains all): Do they address independent invention or universal human psychology?
  3.  **Anomaly** (One object breaks the rule): Do they address provenance, context, or the possibility of outlier data without discarding the whole dataset?
  4.  **Suppression** (They hid the truth): Do they identify *who* benefits and *how* the suppression is mechanically enforced across rival nations/disciplines?

  *   **Sufficient Answer (Pass):** The author acknowledges the counter-argument and provides evidence to override it.
  *   **Insufficient Answer (Stop):** The author uses the move as a trump card (e.g., "The anomaly proves the rule is wrong" without testing the anomaly).
  *   **Verdict if Stopped:** **Methodologically Flawed.**
  *   **Action:** Publish Debunk (focus on method) or Spike.

  ### Step 4: The Consensus Check (The Judgment Call)
  **Question:** Is the claim currently debated in peer-reviewed literature, or is it settled?
  *   **Search Method:** Google Scholar / JSTOR. Look for papers in the last 10 years in top journals (*Antiquity*, *American Historical Review*, *Nature/Science* for hard science links).
  *   **Sufficient Answer (Pass):** There is active citation and debate between opposing camps in legitimate journals.
  *   **Insufficient Answer (Stop):** The claim is only cited in books published by the proponents, or in predatory journals.
  *   **Verdict if Stopped:** **Pseudoscientific / Fringe.**
  *   **Verdict if Passed:** **Contested but Legitimate.**
  *   **Action:** See Matrix below.

  ---

  ## Part II: The Verdict Matrix

  Match the outcome of the Procedure to these verdicts. This tells the Editor what the piece *is*.

  | Verdict | Definition | Column Action |
  | :--- | :--- | :--- |
  | **Contested but Legitimate** | Passes Steps 1-4. Active scholarly debate exists. Evidence is ambiguous. | **Publish Explainer.** "Here is the fight, here is the evidence on both sides." |
  | **Methodologically Flawed** | Passes Step 1, Fails Step 3 or 4. Honest error, bad math, or over-extrapolation. | **Publish Correction.** "Here is the interesting idea, here is where the math breaks." |
  | **Pseudoscientific** | Fails Step 1 or 3. Immune to counter-evidence. Relies on Suppression/Anomaly moves without mechanism. | **Publish Debunk** OR **Spike.** If the claim is popular, debunk the method. If obscure, spike to avoid amplification. |
  | **Chronologically Impossible** | Fails Step 2. Requires breaking multiple independent dating chains without physical cause. | **Publish Debunk.** Focus on *how* we know time (trees, ice, stars). |
  | **Unfalsifiable / Mythic** | Fails Step 1. Not making empirical claims. | **Spike** OR **Publish as Culture.** "Why do we want this to be true?" (No historical truth claims made). |

  ---

  ## Part III: Limitations & Judgment Calls

  **Where Two Competent Vatters Will Disagree:**
  1.  **The "Fringe" Boundary (Step 4):** One vetter may see a paper in a lower-tier journal as "legitimate debate"; the other may see it as "predatory." *Resolution:* If the Freelancer says "Contested" and Lead says "Pseudoscience," default to **Contested** but add an Editor's Note clarifying the marginality of the sources.
  2.  **The Younger Dryas Problem:** Some geochemical claims (impact spikes) are published in legitimate journals, but the historical accretions (lost civilization) are not. *Resolution:* The Procedure must separate the **Geochemical Claim** (Step 2/4) from the **Historical Claim** (Step 3). A submission can be "Contested" on physics but "Pseudoscientific" on history.
  3.  **Tone Policing:** A claim can be true but argued abusively. This Procedure vets the *claim*, not the *author*. A rude author with good data gets "Contested." A polite author with bad data gets "Pseudoscientific."

  **What This Procedure Cannot Do:**
  *   It cannot detect sophisticated forgery (e.g., a fake artifact that has fooled carbon dating). It relies on the assumption that the broader scientific infrastructure (labs, journals) is functioning normally.
  *   It cannot adjudicate purely interpretive historical arguments (e.g., "Was the Cold War inevitable?") unless they rely on factual falsehoods.
  *   It does not replace subject-matter expertise. If a claim is about Hittite cuneiform, and neither vetter reads Hittite, the verdict is provisional.

  ---

  ## Part IV: Test Runs

  Here is how the Procedure runs on your three specific submissions.

  ### Submission (a): The Phantom Time Hypothesis
  *Claim: 614–911 AD was fabricated. Charlemagne is a myth. Antiquity bled into the Middle Ages.*

  1.  **Falsifiability:** Yes. (Claims specific years do not exist). **Pass.**
  2.  **Chronological Stress Test:**
      *   *Dendro:* European oak chronologies cover this period continuously.
      *   *Astronomy:* Eclipses recorded in this period match calculations for those dates.
      *   *Synchronisms:* Islamic Caliphate and Tang Dynasty records run parallel to this period.
      *   *Author's Counter:* Claims trees were grown fast / eclipses were faked. No physical mechanism provided for global tree growth acceleration.
      *   **Result:** **FAIL.** (Requires breaking 3+ independent chains without mechanism).
  3.  **Verdict:** **Chronologically Impossible.**
  4.  **Action:** **Publish Debunk.**
      *   *Angle:* Don't just say "no." Explain *why* we know time didn't vanish. Focus on the ice cores and tree rings. This is a teaching moment on chronometry.

  ### Submission (b): The Mud Flood & Star Forts
  *Claim: Gilded Age train stations and star forts are pre-existing tech from a global empire wiped by a mud flood; history was rewritten to hide this.*

  1.  **Falsifiability:** Yes. (Claims buildings are older than records say). **Pass.**
  2.  **Chronological Stress Test:**
      *   *Documentation:* Building permits, photographs, payroll records exist for these structures.
      *   *Materials:* Concrete composition analysis matches 19th-century mixes, not ancient.
      *   *Author's Counter:* "The records were faked." (Suppression Move).
      *   **Result:** **FAIL.** (Relies on total record fabrication without mechanism).
  3.  **Four Shapes Diagnostic:**
      *   *Suppression Move:* Used as a trump card. No explanation of how thousands of masons, photographers, and clerks were silenced globally.
      *   *Anomaly Move:* "Look at this scratch on the wall." Ignores context.
      *   **Result:** **FAIL.**
  4.  **Verdict:** **Pseudoscientific.**
  5.  **Action:** **Publish as Culture / Spike.**
      *   *Decision:* If the claim is trending, publish "Why the Mud Flood Captures the Imagination." Do not validate the history. If not trending, Spike. It fails the methodological check too thoroughly to be a "good faith error."

  ### Submission (c): The Younger Dryas Impact Hypothesis (YDIH)
  *Claim: A comet airburst 12,800 years ago caused cooling and wiped out a advanced prehistoric culture. Evidence was buried by the establishment.*

  1.  **Falsifiability:** Yes. (Claims specific geochemical layers exist). **Pass.**
  2.  **Chronological Stress Test:**
      *   *Dating:* C14 and stratigraphy generally align on the Younger Dryas boundary.
      *   *Evidence:* Nanodiamonds, platinum spikes, microspherules.
      *   *Author's Counter:* Acknowledges debate on replication.
      *   **Result:** **PASS.** (This is the tricky one. The *geochemistry* is contested in legitimate journals).
  3.  **Four Shapes Diagnostic:**
      *   *Suppression Move:* The submission likely argues the *archaeological* implication (lost civilization) is being suppressed.
      *   *Distinction:* The **Impact** is Contested. The **Lost Civilization** is Pseudoscientific (no evidence of cities/tech).
      *   **Result:** **SPLIT.**
  4.  **Verdict:** **Contested but Legitimate (Physics)** / **Pseudoscientific (History).**
  5.  **Action:** **Publish Explainer (with strict guardrails).**
      *   *Why this worries you:* You suspect the "Legend" (Atlantis-style) is riding the "Hypothesis" (Impact).
      *   *Procedure Fix:* The article must explicitly separate the two. "The comet theory is debated in *Nature*. The idea that this proves Atlantis is not."
      *   *Column:* "The Comet and the Civilization: Where the Science Stops and the Story Begins." This allows you to acknowledge the legitimate scientific debate without endorsing the pseudo-historical accretion.

  ---

  ## Handoff Note to Freelancer

  > "Use this protocol exactly. If you hit a 'Stop' in Step 2 or 3, do not proceed to Step 4. If you are unsure whether a journal is 'legitimate' in Step 4, flag it for me. The goal is not to be the arbiter of truth, but the arbiter of *method*. If the author plays by the rules of evidence, even if they are wrong, we treat them as 'Contested.' If they change the rules to avoid being wrong, they are 'Pseudoscientific.'"
