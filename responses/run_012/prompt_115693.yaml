prompt: |-
  I'm a fourth-year PhD student in history and philosophy of science, and through a series of bad decisions I've become the person who vets the weird-history submissions at a small online history magazine — three or four reader-submited claims a month, each of which turns into a 1,500-word piece under my byline. The editor-in-chief signs off, but she's a Victorianist and has made it clear that the magazine's reputation, and its legal exposure, is mine. I've been improvising, and I write a different piece depending on how tired I am, which is not a method.

  Please write me a procedure I can actually run, and that I can hand to a freelancer with a humanities MA and no archaeology so we get the same verdict twice. I want the questions in order, what counts as a sufficient answer to each, where the procedure stops with a verdict and where it hands the decision back to me because it's a values call or a judgment about credibility, which step is doing the work in each verdict (so a reader who disagrees can attack the right step instead of the whole thing), and an honest statement of what the procedure can't do and where two competent people would run it differently. I also want the verdicts seperated more finely than pseudoscience / not pseudoscience: false but not pseudoscientific, unfalsifiable, contested but legitimate, pseudoscientific, and whatever else you think earns its place. Each verdict has to come with what it means for the column — publish a debunk, publish an explainer, publish something about why people want to believe this, or spike it.

  Some pattern notes to build in, but be careful with them. The submissions come in four shapes: the compression move (real history is shorter than advertised, the Middle Ages were duplicated, the standard chronology was manufactured in the early modern period); the diffusion move (one lost civilization or one lost source explains every resemblance on earth); the anomaly move (one artifact, inscription, or old map the field can't explain, therefore the field is a fraud); and the suppression move (you weren't taught it, and that's the proof). Treat these as diagnostics of argumentative style only, and say plainly that none of them licenses a verdict on its own, because real scholarship does all four sometimes — there's genuine fighting among specialists over whether parts of ancient chronology are stretched by a century or two, diffusion really happens, and anomalies really have overturned fields. The procedure has to say where the difference actually lives.

  Also don't tell me that extraordinary claims require extraordinary evidence; I know, and so does the reader. Give me something specific to chronological claims: which dating chains are genuinely independent of one another (tree rings, calibrated radiocarbon, eclipse and astronomical records, tephra, coin sequences, the synchronisms tying Egypt, Assyria, Anatolia and the Aegean together), and what a claim like this would have to survive before I print anything.

  Run it on three submissions: (a) a reader who says antiquity actually happened in the Middle Ages, citing statistical patterns in lists of rulers and duplicated events; (b) a reader who says the Gilded Age train stations and the star forts are the remains of a lost global empire wiped out by a mud flood and then written out of the record; (c) a reader who says a comet airburst caused the Younger Dryas and that the establishment buried the evidence — that last one worries me, because the hypothesis and the legend riding on it may be two different things, and I suspect the procedure's verdict isn't the one I'd like.

  I've got about three hours per claim and no library. No reading lists or citations — I have the literature, I want the procedure. American English.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** 4th-year PhD student in History & Philosophy of Science (HPS).
      *   **Task:** Vetting "weird history" submissions for an online magazine (3-4/month, 1,500 words each).
      *   **Problem:** Improvising based on fatigue; needs a standardized procedure for themselves and a freelancer (MA Humanities, no archaeology).
      *   **Requirements:**
          *   Ordered questions with sufficiency criteria.
          *   Stop points/verdicts (False, Unfalsifiable, Contested/Legitimate, Pseudoscientific, etc.).
          *   Actionable outcomes (Debunk, Explainer, Belief Psychology, Spike).
          *   Transparency on where judgment calls happen (so critics know what to attack).
          *   Limitations statement (where competent people disagree).
          *   Specific handling of four argument shapes (Compression, Diffusion, Anomaly, Suppression) without prejudging them.
          *   Specific handling of chronological evidence (independent dating chains).
          *   Avoid clichés ("extraordinary claims...").
          *   Test run on three specific submissions (Phantom Time/Geschehen, Mud Flood/Star Forts, Younger Dryas Impact Hypothesis).
          *   Constraints: ~3 hours/claim, no library access (relies on existing knowledge/web), American English.

  2.  **Deconstruct the Core Challenge:**
      *   The user is an HPS scholar. They understand theory, demarcation problems, and evidence structures. The procedure needs to reflect that sophistication but be operationalizable by an MA generalist.
      *   The "Weird History" genre often mixes genuine historical debate with conspiracy theory. The procedure must distinguish *fringe scholarship* from *pseudoscience* without just saying "it's weird."
      *   The four "shapes" (Compression, Diffusion, Anomaly, Suppression) are rhetorical moves. The procedure needs to check if these moves are supported by *method* or just *assertion*.
      *   Chronology is the weak point for generalists. The procedure needs a checklist of "Independent Dating Chains" that must be broken simultaneously for a chronological revision to hold.

  3.  **Drafting the Procedure (The "Vetting Protocol"):**
      *   *Structure:* Phase 1 (Triage), Phase 2 (Evidence Audit), Phase 3 (Argument Structure), Phase 4 (Verdict & Action).
      *   *Phase 1:* Is it even historical? (Unfalsifiable vs. Falsifiable).
      *   *Phase 2:* The Chronological/Archaeological Stress Test. This addresses the specific request about dating chains.
      *   *Phase 3:* The Rhetorical Move Analysis. Addressing the four shapes (Compression, etc.) without bias.
      *   *Phase 4:* The Verdict Matrix. Mapping findings to specific labels and column actions.
      *   *Limitations:* Where does human judgment enter? (Credibility of sources, weighting of consensus).

  4.  **Refining the Verdict Categories:**
      *   Need more nuance than "True/False."
      *   *Proposed:*
          1.  **Mainstream Contested:** Legitimate debate, fringe but methodologically sound.
          2.  **Methodological Error:** False conclusion, but honest mistake/bad math.
          3.  **Pseudoscientific:** Immune to falsification, moves goalposts, relies on suppression narratives.
          4.  **Unfalsifiable/Mythic:** Not making empirical claims, making meaning claims.
          5.  **Fabricated:** Deliberate fraud (rare, but possible).
      *   *Actions:* Publish as Debate, Publish as Correction/Debunk, Publish as Cultural Phenomenon, Spike.

  5.  **Addressing the "Four Shapes":**
      *   Must explicitly state: "Presence of Move $\neq$ Verdict."
      *   The test is: Does the author acknowledge counter-evidence regarding the move?
      *   *Compression:* Do they address dendrochronology/ice cores?
      *   *Diffusion:* Do they address independent invention/psychological universals?
      *   *Anomaly:* Do they address context/provenance?
      *   *Suppression:* Do they provide a mechanism for suppression beyond "they hate truth"?

  6.  **Addressing Chronology (The "Hard" Science bit):**
      *   Need a specific checklist for chronological claims.
      *   *Chains:* Dendro, C14, Astronomy/Eclipses, Tephra, Numismatics, Synchronisms.
      *   *Rule:* To shift chronology by >50 years, you must break *at least three* independent chains. To shift by centuries (Phantom Time), you must break *all* of them simultaneously.

  7.  **Running the Test Cases:**
      *   *(a) Phantom Time (Heribert Illig style):* Claims 300 years (614-911 AD) didn't happen.
          *   *Chronology Check:* Fails Dendro, Fails Astronomy (eclipses), Fails Islamic/Chinese synchronisms.
          *   *Verdict:* Pseudoscientific (Chronological).
          *   *Action:* Debunk/Explainer.
      *   *(b) Mud Flood/Star Forts:* Gilded Age is actually ancient lost tech.
          *   *Chronology Check:* Fails Photography, Fails Paper Records, Fails Concrete dating.
          *   *Argument:* Suppression + Anomaly.
          *   *Verdict:* Pseudoscientific (Conspiracy).
          *   *Action:* Cultural Phenomenon (why people believe) or Spike.
      *   *(c) Younger Dryas Impact Hypothesis (YDIH):* Comet caused cooling + civilization wipe.
          *   *Nuance:* This is the tricky one. It *is* contested in legitimate science.
          *   *Chronology/Geo:* Nanodiamonds, platinum spikes. Some replication, some failure.
          *   *Verdict:* Mainstream Contested (leaning fringe).
          *   *Action:* Explainer (State of the Field).
          *   *User's worry:* The procedure might say "Contested" but the user suspects it's bunk. *Correction:* The procedure must distinguish between the *scientific hypothesis* (impact) and the *mythic accretion* (Atlantis/Gobekli Tepe connection). The procedure should flag the *accretion* as pseudoscience even if the *core* is contested.

  8.  **Review against Constraints:**
      *   *Time:* 3 hours. The procedure needs to be fast. No deep archive digging. Relies on knowing where the consensus lies.
      *   *Freelancer:* Needs clear "If X, then Y" logic.
      *   *Tone:* Professional, direct, American English, HPS-aware (demarcation criteria).
      *   *No Clichés:* Avoid "extraordinary evidence." Focus on "independent corroboration."

  9.  **Final Polish:**
      *   Ensure the "Limitations" section is honest. Two experts *will* disagree on the YDIH case. That's a feature, not a bug.
      *   Make sure the "Verdict" section clearly links to the "Column Action."
      *   Check the "Four Shapes" warning is prominent.

  10. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe include a step for checking peer review.
      *   *Correction:* Predatory journals exist. Better to check *citation networks* and *methodological transparency*.
      *   *Initial thought:* Tell them to Google Scholar everything.
      *   *Correction:* 3-hour limit. They need to know *what* to look for, not read 50 papers. Use "Consensus Checkpoints."
      *   *Refining YDIH:* The prompt says the user suspects the verdict won't match their intuition. I need to make sure the procedure captures the *split* between the geochemical claim (contested) and the historical claim (lost civilization/pseudoscience). The procedure should separate these.

  11. **Final Structure:**
      *   Introduction (Purpose & Scope).
      *   The Protocol (Steps 1-4).
      *   The Verdict Matrix.
      *   Limitations & Judgment Calls.
      *   Test Runs (a, b, c).

