answer: |-
  **COMMITTEE PAPER: INTERPRETATION AND GALLERIES**

  **TO:** Interpretation Committee
  **FROM:** [Your Name/Title]
  **DATE:** 14 October 2023
  **SUBJECT:** Recommendation on Textual Authority for the Near East Flagship Gallery

  **1. Purpose**
  This paper addresses the impasse regarding the three narrative spine-labels in the proposed Ancient Near East gallery. The Committee must balance public engagement (a coherent story) against scholarly integrity (the fragility of the evidence). Below is a recommended course of action, a defined standard of proof, and the reasoning required to minute a decision before the printing deadline.

  **2. Recommendation for the Three Labels**
  We cannot treat these three labels identically. I recommend a differentiated approach based on the specific evidentiary weight of each claim. The curatorial team should redraft according to the following directives:

  *   **Label 1 (The Queen's Reign):** The fragmentary inscription is ambiguous (title vs. name). The late narrative provides the chronology.
      *   *Action:* State the reign dates as *traditional* chronology, not absolute fact. Use phrasing such as: "According to later royal tradition, Queen X reigned from..." Acknowledge the inscription's ambiguity in a parenthetical clause or footnote.
      *   *Status:* Report as Tradition.
  *   **Label 2 (The Siege):** This event is uncorroborated and appears only in the late, flattering source.
      *   *Action:* Do not assert the siege occurred as military fact. Present it as the kingdom's *foundation myth* or *celebrated narrative*. Phrasing: "The kingdom's own histories celebrate a great siege broken by..." This preserves the story's cultural importance without validating its historicity.
      *   *Status:* Report as Legend/Narrative.
  *   **Label 3 (The Treaty):** Treaties are standard diplomatic practice; even if the specific text is lost, the political outcome is likely stable.
      *   *Action:* Assert the political alliance as fact, but qualify the specific terms. "A treaty was concluded, establishing..." is permissible provided we add "recorded in later annals."
      *   *Status:* Assert as Probable Fact.

  **Timeframe:** Redrafted text to be submitted to the Interpretation Lead by close of business next Tuesday. This allows for a final email vote by Thursday week, meeting the printer's deadline without compromising review.

  **3. Standard of Proof**
  One member proposed a bright-line rule: *Nothing may be stated as fact if attested by a single source written more than two centuries after the events without independent corroboration.*

  **Recommendation:** This rule must be rejected as a governing principle for ancient history, though its caution is noted.

  **Reasoning:** In the study of the ancient Near East (and indeed much of antiquity), a single late source is often the *only* source. Applying this rule strictly would require us to remove not only these labels but most of the gallery's content, rendering the history of the period invisible to the public. Ancient historians do not work in binary truths (Fact/Fiction) but in probabilities.

  **Proposed Standard:** We should adopt a **"Gradient of Confidence"** standard.
  *   **High Confidence:** Contemporary archaeological evidence or multiple independent sources. (May be stated as fact).
  *   **Medium Confidence:** Single late source consistent with archaeological context. (May be stated as fact, but qualified by "evidence suggests" or "historians believe").
  *   **Low Confidence:** Single late source with no corroboration or internal contradictions. (Must be stated as "tradition," "legend," or "narrative").

  This allows us to tell the story without misleading the visitor about the solidity of the ground beneath it.

  **4. Argument from Silence and Embarrassment**
  Regarding the siege (Label 2), the fact that no other record mentions it is an *argument from silence*. In this region, where clay tablets are easily destroyed and archives purged, silence does not prove an event did not happen. However, neither does it prove it *did*. Therefore, silence prevents us from asserting the siege as fact, but does not require us to call it a lie.

  Regarding the **Criterion of Embarrassment** (trusting details that damage the teller's case): This is a valid historical tool but must be applied sparingly. If the late narrative admits a near-defeat or a royal error, it is likely more credible. However, since our source is explicitly designed to flatter the dynasty, we cannot assume it contains embarrassing details unless they are obvious. We cannot use this criterion to rescue the siege story unless the stratagem described involves a royal blunder that was later spun as a victory. Without that, the flattering nature of the source remains a liability.

  **5. Reasoning for Trustees**
  The tension before us is not between "boring accuracy" and "exciting stories." It is between **witness testimony** and **hearsay**.

  If a witness takes the stand today, we ask: were you there? If they say, "No, but my grandfather told me," we do not throw them out of court; we simply note their evidence is hearsay. It may be true, but it carries less weight. The late narrative source in question is a grandson speaking for a grandfather.

  The public does not demand fairy tales; they demand authenticity. A museum that hedges appropriately is not showing "scholarly nervelessness"; it is showing respect for the complexity of the past. If we present legend as fact, and future archaeology proves us wrong, we lose public trust. If we present legend as *tradition*, we invite the public into the mystery of how the past remembered itself.

  The two demands before us—a public that wants a story and a record that will not support one—are satisfiable if we change the genre. We are not presenting a court transcript; we are presenting a cultural biography. We can tell the story of the siege as the story the kingdom *told about itself*, which is historically significant regardless of whether the stones actually fell.

  **6. Decision Required**
  The Committee is asked to:
  1.  Approve the "Gradient of Confidence" standard for all gallery text.
  2.  Authorise the curatorial team to redraft the three spine-labels according to the specific actions in Section 2.
  3.  Confirm the Tuesday submission deadline to meet printing schedules.

  **Signed:**
  [Your Name]
  Interpretation Committee Member
