prompt: |-
  I sit on the interpretation committee of a national heritage body — the panel that has to sign off the wording of every label and panel in our permanent galleries before the text goes to the printers — and I have to bring a written opinion to Thursday's meeting. The case is our planned flagship gallery on an ancient kingdom of the Near East, and the trouble is concentrated in the three labels that carry the spine of the story. What visitors will take away — that a particular queen reigned for a particular span, that a particular siege was broken by a particular stratagem, that a particular treaty was concluded — is drawn almost entirely from a single narrative source compiled several centuries after the events, at a court with an evident interest in flattering the dynasty that commissioned it; a second thread rests on a fragmentary inscription whose surviving letters can be read either as a royal title or as a personal name; and for the siege in particular, nothing else in the surviving record mentions it at all. The chair's worry is not really about the facts; it is that half the committee wants the gallery to tell the story straight, on the grounds that it is the only story we have and that a museum which hedges every sentence will lose the public, while the other half wants the labels to say, in effect, that this is legend, and that presenting it otherwise is a failure of scholarly nerve. He has asked me for a recommendation the committee can actually vote on, and for an honest account of the case against it.

  So what I need is a short written opinion — a page or two, the sort of thing that can be minuted and acted upon — that does four things. First, it should recommend a concrete course of action for these three labels specifically, rather than a general philosophy of museums: say what each label may assert as fact, what it may report as tradition without asserting, and what it must leave out, and give a timeframe for redrafting that still lets us meet the printing deadline. Second, it should say what standard of proof our labels ought to meet, and defend that standard against the strongest version of the opposing view — I would far rather have a rule I can apply than a mood. One member has already floated a bright line: nothing may be stated as fact if it is attested by a single source written more than a couple of centuries after the events and not independently corroborated. I am not sure that rule is right, but I cannot yet say why, so please test it against these labels and against the ordinary working practice of ancient historians. Third, it should say how much weight the argument from silence ought to carry when an entire episode goes unmentioned everywhere else, and whether something like the criterion of embarrassment — trusting a detail precisely because it damages the teller's own case — should be allowed to rescue any of this. Fourth, it should set out the underlying reasoning in terms a lay trustee can follow: I want the committee to see why this is not pedantry but the ordinary difference, running from the earliest historians onwards, between what a writer could vouch for himself and what he merely repeated at second or third hand, and why the two demands now before us — a public that wants a story and a record that will not support one — are not equally satisfiable. Please write the opinion in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**

      *   **Role:** Member of an interpretation committee for a national heritage body.
      *   **Task:** Write a short written opinion (1-2 pages) for a meeting on Thursday.
      *   **Subject:** A flagship gallery on an ancient Near Eastern kingdom.
      *   **Problem:** Three key labels rely on shaky evidence (single late source, ambiguous inscription, uncorroborated siege).
      *   **Conflict:** Half the committee wants a straight narrative (public engagement); half wants to label it as legend (scholarly integrity).
      *   **Requirements:**
          1.  Recommend a concrete course of action for the three labels (assert vs. report vs. omit) + timeframe.
          2.  Define a standard of proof and defend it against the "single late source" bright-line rule.
          3.  Address the argument from silence and the criterion of embarrassment.
          4.  Explain the reasoning for lay trustees (distinguishing primary witness vs. hearsay, managing public expectation vs. evidence).
      *   **Tone:** Professional, authoritative, balanced, actionable, British English.
      *   **Format:** Formal committee paper/opinion.

  2.  **Deconstruct the Evidence & Issues:**

      *   *Label 1 (Queen's Reign):* Based on a late narrative source (centuries later, pro-dynasty) + fragmentary inscription (title vs. name).
      *   *Label 2 (Siege):* Based *only* on the late narrative. No other mention (argument from silence).
      *   *Label 3 (Treaty):* Based on the late narrative.
      *   *The "Bright Line" Rule:* No fact if single source >2 centuries later + no corroboration.
      *   *The Counter-Argument:* Ancient history often *only* has single late sources. Banning this empties the gallery.
      *   *The Solution:* Nuance. Distinguish between *historical fact*, *historical tradition*, and *speculation*.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard committee paper format (To, From, Date, Subject).
      *   **Introduction:** Acknowledge the tension (narrative vs. accuracy). State the purpose of the opinion.
      *   **Recommendation (Requirement 1):**
          *   Need specific actions for the three labels.
          *   *Queen:* Assert the tradition, qualify the reign dates.
          *   *Siege:* Present as narrative tradition, not military fact.
          *   *Treaty:* Likely safe to assert if consistent with geopolitical norms, but qualify the source.
          *   *Timeframe:* Needs to be tight for Thursday's meeting + printing. Say 10 days for redraft.
      *   **Standard of Proof (Requirement 2):**
          *   Address the "Bright Line" rule. It's too rigid for ancient history (would delete most of the Bronze/Iron Age).
          *   Propose a "Gradient of Certainty" standard.
          *   Defense: Historians work with probability, not binary truth. The rule confuses *evidence quality* with *historical existence*.
      *   **Silence & Embarrassment (Requirement 3):**
          *   *Argument from Silence:* Weak in this context (loss of records is common). Cannot use silence to disprove the siege, but cannot use the narrative to prove it definitively.
          *   *Criterion of Embarrassment:* Useful if the source admits a failure. If the siege story makes the King look good, it's suspect. If it admits a near-defeat, it's more credible. Apply cautiously.
      *   **Reasoning for Trustees (Requirement 4):**
          *   Analogy: Witness testimony vs. hearsay.
          *   The "Contract with the Public": We offer understanding, not just stories. Hedging isn't weakness; it's accuracy.
          *   Resolving the conflict: We can tell the story *as a story* without claiming it is *the truth*.
      *   **Conclusion:** Summarize the vote recommendation.

  4.  **Refining the Tone and Language (British English):**

      *   Use "programme," "centre," "labelled," "honour."
      *   Tone should be diplomatic but firm. Avoid academic jargon where possible (explain "criterion of embarrassment").
      *   Ensure the distinction between "fact" and "tradition" is clear.

  5.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Is the recommendation too vague?
      *   *Fix:* Make sure I explicitly say "Label A should say X."
      *   *Critique:* Is the standard of proof too academic?
      *   *Fix:* Use the legal analogy (beyond reasonable doubt vs. balance of probabilities) or a traffic light system. Let's go with "Levels of Confidence."
      *   *Critique:* Did I address the "Bright Line" rule specifically?
      *   *Fix:* Yes, explicitly reject it as unworkable for ancient history but accept its spirit (caution).
      *   *Critique:* Is the length right?
      *   *Fix:* Keep it tight. One to two pages.

  6.  **Final Polish:** Check against the four specific requirements one last time.
      1.  Concrete action for 3 labels + timeframe? Yes.
      2.  Standard of proof + defense against bright line? Yes.
      3.  Silence + Embarrassment? Yes.
      4.  Lay reasoning (witness vs. hearsay)? Yes.

  7.  **Final Output Generation** (Proceeding to write the response based on these thoughts). *Note: Ensure the distinction between the 'late narrative' and the 'fragmentary inscription' is clear in the recommendations.*

  *(Self-Correction on the "Bright Line" rule)*: The prompt says one member proposed: "nothing may be stated as fact if it is attested by a single source written more than a couple of centuries after the events and not independently corroborated." I need to explain why this is problematic for *ancient* history specifically (where this is often the *best* we have) without dismissing the need for caution. The solution is to change the *labeling* of the fact, not delete the fact.

  *(Self-Correction on Timeframe)*: The meeting is Thursday. Printing deadline is looming. I need to suggest a turnaround that is realistic but urgent. "Drafts to Interpretation Lead by close of business next Tuesday" allows for a final sign-off before printing.

  *(Self-Correction on Tone)*: Ensure it sounds like a committee paper, not an academic essay. Use headings.

