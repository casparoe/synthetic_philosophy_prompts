answer: |-
  There is no single canonical term in the social theory literature that captures both the rhetorical flip (burden vs. blessing) and the instrumentalization of rest (leisure vs. recovery) in one package. You are right to reject "Protestant Work Ethic"—that describes a duty to labor, not this specific strategic ambiguity. "Hustle culture" is too colloquial.

  The closest established framework is Josef Pieper's concept of **"Total Work"** (from *Leisure: The Basis of Culture*), which describes a society where human value is reduced to function. However, Pieper describes the *condition*, not the *rhetorical move* you're identifying.

  For the specific mechanism—the convenient re-description of the same activity to suit power dynamics—I will coin the term **"Ontological Opportunism."**

  Here is the breakdown of why this fits, where it strains, and the verdict you asked for.

  ### The Concept: Ontological Opportunism

  **Definition:** The strategic re-classification of the *nature* of an activity (its ontology) based solely on the desired economic or moral outcome, without any change to the activity itself.

  **How it fits your cases:**
  1.  **The Burden/Blessing Flip:** When the worker wants pay, the ontology of the work is shifted to "Labor" (external, burdensome, commodity). When the worker wants time, the ontology is shifted to "Calling" (internal, identity-constituting, gift). The activity hasn't changed; its moral category has been swapped to invalidate the claim.
  2.  **The Instrumental Rest Flip:** When rest serves productivity (recovery, networking, upskilling), its ontology is "Maintenance" or "Investment" (valid). When rest serves the human being simply (doing nothing), its ontology is shifted to "Idleness" or "Waste" (shameful).

  **Where it strains:**
  "Ontological Opportunism" implies a conscious agent doing the flipping. Often, this isn't a conscious lie by a manager; it's a structural incoherence embedded in the language itself. The culture *believes* both things simultaneously: work *should* be a calling, and work *is* a burden. The strain appears when you try to pin blame on a specific person versus a systemic contradiction.

  ### The Logic: Special Pleading

  Logically, this is a textbook case of **Special Pleading**.
  *   *Rule:* Work is a burden that deserves compensation.
  *   *Exception:* Unless you love it, then it's its own reward.
  *   *Rule:* Rest is a human necessity.
  *   *Exception:* Unless it produces nothing, then it's laziness.

  The exception is created ad hoc to defeat the claim. It is motivated reasoning dressed up as moral insight.

  ### The Verdict

  **Is the person doing the flipping wrong?**
  Yes. Definitively.

  It is not a "both sides" situation. It is a coercive inconsistency. By refusing to hold the definition of work stable, the authority figure removes the ground on which the worker can stand to make *any* claim. If work is a blessing, you can't ask for more money (you're already paid in meaning). If work is a burden, you can't ask for less time (you're paid to endure it). It is a closed loop designed to extract maximum utility for minimum cost.

  **Is the concept of "Work" incoherent?**
  Yes, under current conditions.

  We are muddling through with a concept that is trying to do three incompatible jobs:
  1.  **Survival:** How we eat and house ourselves (requires stability/pay).
  2.  **Identity:** Who we are and our social value (requires meaning/passion).
  3.  **Value Creation:** How capital grows (requires flexibility/efficiency).

  "Ontological Opportunism" thrives because we refuse to separate these. We demand that jobs provide survival *and* identity, which allows employers to pay in identity when survival is demanded, and demand survival flexibility when identity is claimed.

  **My advice for the novel:**
  Don't treat the characters doing the flipping as villains who know they're lying. Treat them as true believers in the incoherence. The most terrifying version of this argument isn't made by a cynic; it's made by a manager who genuinely believes you *should* love the work enough to take less money, but also loves you enough to worry you're working too hard. That tension—where the exploitation feels like care—is where the Ontological Flip does its real damage.

  Use the term **Ontological Opportunism** if you need a label, but write the scene as **Special Pleading** enacted by people who think they're being consistent. That's the tragedy.
