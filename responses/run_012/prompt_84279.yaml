answer: |-
  **The room**
  The Parfitians hear "normative status" and smell a non-reductive further fact smuggled in through the back door. To them, you're risking a dualism of facts: physical ones and spooky normative ones. The clinicians hear "status conferred in practice" and worry you're making personhood revocable by committee. They hear "capacity" when you say "status." The emeritus hears "answerable" and knows infants aren't. The thesis isn't incoherent, but it walks a razor's edge between pragmatism and circularity. If "practice" confers status, whose practice counts? If you say "ours," you're begging the question. If you say "any," you allow tyranny. You need to ground the normativity without grounding it in metaphysics.

  **Objections, ranked by damage**

  1.  **The Parfitian Trap (Fatal)**
      *   **Who:** Senior Reductionist.
      *   **Objection:** "You've split narrativity from ownership, but if ownership isn't a further fact, what is it? If it's just a social label, it doesn't matter. If it matters, it must be grounded in Relation R. You're trying to have 'what matters' without the reductionist grounds."
      *   **Reply:** Ownership matters because practices matter. Money isn't a further fact, but debt is real. Selfhood is the credit score of the person.
      *   **Soft Spot:** Money relies on collective belief; selfhood feels intrinsic even in isolation.

  2.  **The Clinician's Warning (Fatal)**
      *   **Who:** Psychiatrist.
      *   **Objection:** "You say selfhood can be lost without cognitive loss. In my clinic, that's when we strip capacity. If you make status independent of capacity, you're giving philosophers permission to override medical assessments of competence."
      *   **Reply:** I'm describing accountability, not competence. You can be competent but not held liable (diplomatic immunity).
      *   **Soft Spot:** In law and medicine, competence and liability track too closely to separate cleanly.

  3.  **The Oppression Objection**
      *   **Who:** Political Philosopher / Ethicist.
      *   **Objection:** "If status is conferred by practice, then a society that treats slaves as non-persons makes them non-persons. You've made injustice ontological."
      *   **Reply:** Injustice is ontological violence. They *are* damaged, but the practice is still wrong. We critique the practice from within our own normative framework.
      *   **Soft Spot:** Hard to condemn the oppressor if status is just local practice.

  4.  **The Circularity Charge**
      *   **Who:** Metaphysician.
      *   **Objection:** "Who confers the status? Other selves? Where did *their* status come from? You need a first status-holder."
      *   **Reply:** It's holistic. The community confers it mutually. No first holder needed, just a stable equilibrium.
      *   **Soft Spot:** Risks coherence theory of truth problems.

  5.  **The Emeritus Challenge**
      *   **Who:** Emeritus Professor.
      *   **Objection:** "Infants and dogs aren't answerable. Do they lack selves? If you say yes, you're monstrous. If no, your definition fails."
      *   **Reply:** They have proxy ownership. Guardians answer for them. They are potential status-holders.
      *   **Soft Spot:** Makes selfhood derivative, not intrinsic.

  6.  **The Phenomenological Gap**
      *   **Who:** Phenomenologist / Psychopathologist.
      *   **Objection:** "Schizophrenics lose the *feeling* of ownership (ipseity). You're ignoring the lived experience for a bureaucratic status."
      *   **Reply:** Phenomenology is data, not ontology. You can feel alienated but still be on the hook.
      *   **Soft Spot:** Dismisses the primary data of selfhood.

  7.  **The Dennettian Redundancy**
      *   **Who:** Dennett Follower.
      *   **Objection:** "Ownership is just part of the narrative illusion. The center of gravity includes the attribution of ownership. You've sliced what shouldn't be cut."
      *   **Reply:** The center of gravity predicts; ownership binds. Prediction isn't obligation.
      *   **Soft Spot:** Dennett might argue obligation is just a predictive tool for social behavior.

  8.  **The Subject Change**
      *   **Who:** Skeptic.
      *   **Objection:** "You're talking about persons, not selves. You've changed the subject to avoid the metaphysics."
      *   **Reply:** Self *is* the person under this description. There is no ghost behind the person.
      *   **Soft Spot:** Lexical stipulation doesn't solve the philosophical urge for depth.

  **What I concede up front**
  Concede that this view makes selfhood vulnerable to social error. Concede that I am not solving the hard problem of consciousness, only the problem of accountability. Concede that "normative" doesn't mean "arbitrary," but I don't have a full meta-ethical account ready. I am offering a functional description, not a justification. If I try to justify *why* we confer status, I leave my lane. I stick to *what* happens when we do.

  **Where they agree against me**
  Parfitians and Clinicians both want objective grounds. The Parfitian wants psychological continuity (Relation R); the Clinician wants neural integrity or cognitive capacity. Both will resist "status conferred in practice" because it sounds unstable. For the Parfitian, it risks reintroducing a non-reductive fact. For the Clinician, it risks making medical ethics contingent on social whim rather than patient capability. They agree: you need a fact of the matter independent of what we *say* about the patient. Your view says the fact *is* what we say (and do). This is the real friction point. They will form an unlikely alliance against your pragmatism, demanding a "real" basis for selfhood that exists even if no one is around to hold you accountable. You must deny this without sounding like you're denying reality.

  **The question I'm hoping nobody asks**
  "The Oppression Objection." If selfhood is conferred by practice, then a society that treats slaves as non-persons makes them non-persons. You've made injustice ontological. This is the hardest hit.
  Honest Answer: Yes, injustice is ontological violence. When we strip someone of standing, we aren't just mistaken about their selfhood; we are actively dismantling it. But this doesn't mean the practice is *right*. We can critique the practice from within our own normative framework. The status is real because the consequences are real, even if the distribution is unjust.
  Assessment: It looks bad. It sounds like you're saying the slaves lacked selfhood. You need to distinguish between *having* the status (which they did, inherently, by virtue of being potential participants) and *being recognized*. But if it's conferred, how do they have it inherently? You risk sounding like you're blaming the victim for not securing their status. You must argue that the *obligation* to confer status is universal, even if the *act* is local. If you fumble this, you sound like a collaborator with tyranny.

  **The exchange that has to land**
  Parfitian: "Is this status real or just a useful fiction?"
  You: "It's as real as a promise. A promise isn't a physical object, but breaking it has real consequences. Selfhood is the promise of answerability."
  If this lands, you've moved the debate from metaphysics to ethics. You've shown that "what matters" isn't survival, it's standing. If it fails, you're just a pragmatist hiding from metaphysics. This is the moment you either secure the normative ground or lose the room to reductionism.
