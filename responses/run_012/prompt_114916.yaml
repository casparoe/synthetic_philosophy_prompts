prompt: |-
  I sit on my university's animal ethics committee, and over the past year our remit has quietly expanded from mice and zebrafish to whatever anyone happens to be working on — black soldier fly larvae in a waste-to-feed pilot, a shrimp disease study, a lab growing cultured neural tissue for a drug screen, and one memorable application involving an engineered yeast that a student argued might suffer. We are not philosophers, we meet once a month, and each novel case gets about twenty minutes, so what we need out of this is a procedure rather than a seminar. I have drafted a rough scoring scheme of my own and I suspect it is broken but I cannot see where. It scores an entity on four axes: whether it has internal states that function to track its own bodily condition; whether those states are integrated with other information rather than wired straight to a fixed response; whether its behaviour shows genuine trade-offs, in the sense that it will tolerate damage or pain to pursue something else; and whether what it undergoes can matter to it over time, shaping what it seeks later. The axes pull apart and I have no principled way to aggregate them. Worse, when I tried the scheme on calibration cases, a household thermostat and a colony of chemotaxing bacteria scored respectably on the first two axes while a scallop scored near zero, which either shows that my axes are the wrong ones or that I am asking the wrong question. And I cannot shake the suspicion that treating sentience as a matter of degree has smuggled in an assumption I do not actually hold — that moral standing comes in the same degrees, so that a halfway-sentient creature gets halfway-standing.

  What I want from you is a written decision procedure, one page plus a worked appendix, that my committee could actually run on a submitted protocol. It should be a sequence of questions in the order we should ask them, with what counts as a sufficient answer to each, the points at which the procedure returns a verdict, and the points at which it stops and hands the matter to a person because the question is one of values rather than facts. It must terminate in one of four outcomes — exempt, light-touch (the researcher proceeds under conditions we set), full committee review, or escalation to the university's research governance office — and it has to be candid about which steps are really just my four axes in disguise and which of them should be discarded outright. Then run it, showing your work at each step, on three cases: the black soldier fly larvae reared and killed in bulk for the waste-processing trial, where I suspect the procedure will tell us we have to review a facility the entomology department has run for years without ever filing a protocol; a study on cultured human neural tissue that has begun showing spontaneous activity; and the thermostat, which I am using as a floor test, to see whether the procedure refuses moral status to anything with a feedback loop. Tell me plainly what the procedure cannot do, and whether it can survive being used by a committee that includes two members who think the whole exercise is sentimental nonsense — if it cannot, I would rather know that before I put it in front of them. Positions and arguments can be referred to in your own words; do not bother with references, I will source those myself.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Member of a university animal ethics committee (AEC).
      *   **Context:** The committee's remit has expanded informally beyond traditional vertebrates (mice, zebrafish) to invertebrates (flies, shrimp), novel biological systems (cultured neural tissue), and even borderline cases (engineered yeast).
      *   **Constraints:** Non-philosophers, meet once a month, ~20 minutes per novel case. Need a *procedure*, not a seminar.
      *   **Current Problem:** The user drafted a scoring scheme based on four axes (internal states, integration, trade-offs, temporal mattering). It's broken (thermostat/bacteria score high, scallop scores low). Aggregation is unclear. Worried about the "degrees of sentience = degrees of moral standing" assumption.
      *   **Deliverable:** A written decision procedure (one page + worked appendix).
      *   **Requirements:**
          *   Sequence of questions with sufficient answers.
          *   Verdict points (Exempt, Light-touch, Full Review, Escalation).
          *   Distinction between factual questions and value judgments.
          *   Candid admission of which original axes are kept/discarded.
          *   Worked examples: Black Soldier Fly (BSF) larvae, Cultured Human Neural Tissue, Thermostat.
          *   Plain talk on limitations and political viability (skeptical committee members).
          *   No references needed (user will source them).

  2.  **Diagnose the User's Draft Scheme:**
      *   *Axis 1 (Internal states tracking bodily condition):* Too broad. Thermostats track temperature (a state of the system). Bacteria track chemical gradients.
      *   *Axis 2 (Integration vs. fixed response):* Hard to assess in 20 mins. Thermostats integrate set-point + current temp.
      *   *Axis 3 (Trade-offs/Pain tolerance):* This is the gold standard for sentience (pain vs. gain), but hard to observe in larvae or tissue.
      *   *Axis 4 (Temporal mattering/Learning):* Good, but bacteria learn (habituation).
      *   *The Scallop Problem:* Scallops are bivalves. They have simple nervous systems. If they score low, the test is too cognitive. Sentience is about *feeling*, not *thinking*.
      *   *The Aggregation Problem:* Summing scores implies compensatory logic (high integration makes up for no pain?). That's wrong. Pain trumps integration.
      *   *The "Degrees" Problem:* The user is right to worry. Moral standing is often binary (in/out of protection), even if capacity is graded. The procedure should aim for a binary threshold for protection, with tiers of oversight based on risk/uncertainty.

  3.  **Develop the New Procedure:**
      *   *Goal:* Triage. Filter out the thermostats, catch the likely sentient, flag the uncertain.
      *   *Structure:* Funnel approach. Start with biological definitions, move to nervous system complexity, then behavior, then uncertainty.
      *   *Discarding Axes:*
          *   Keep: Trade-offs (Axis 3) is crucial but needs to be specific to *aversive* stimuli.
          *   Keep: Temporal mattering (Axis 4) as "learning/modification of behavior."
          *   Discard/Modify: Internal states (Axis 1) and Integration (Axis 2) are too functionalist. Replace with *substrate* (nervous system) and *phylogeny*.
      *   *New Core Concept:* The "Precautionary Principle." If we don't know, but it looks like it *could* feel, we treat it as if it does until proven otherwise.
      *   *Outcomes:*
          1.  **Exempt:** Non-living or simple life without nervous systems.
          2.  **Light-touch:** Invertebrates with low probability of sentience, low risk procedures.
          3.  **Full Review:** Vertebrates, cephalopods, decapods, or uncertain cases with high risk of pain.
          4.  **Escalation:** Novel entities (organoids, AI, engineered life) where policy doesn't exist.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Step 1: Is it alive?* (Filters thermostat).
      *   *Step 2: Phylogeny.* (Vertebrates/Cephalopods/Decapods = Full Review. This is standard law in many places).
      *   *Step 3: Nervous System.* (Centralization? Nociceptors?).
      *   *Step 4: Behavior.* (Trade-offs regarding harm?).
      *   *Step 5: Uncertainty.* (If unsure, move up a tier).
      *   *Value vs. Fact:* Science tells us about nerves/behavior. The committee decides the risk threshold (Precautionary Principle).

  5.  **Addressing the "Degrees of Standing" Worry:**
      *   The procedure shouldn't calculate "0.5 standing." It should calculate "Level of Oversight Required."
      *   Exempt = No standing.
      *   Light-touch = Potential standing, low risk.
      *   Full = Presumed standing.
      *   This separates *moral status* (binary: protected or not) from *administrative burden* (scaled to risk/uncertainty).

  6.  **Running the Worked Examples:**
      *   *Thermostat:* Fails Step 1 (Not alive/biological). Exempt.
      *   *Black Soldier Fly:* Insect. No central brain like vertebrates. Evidence of nociception is weak/debated. Trade-offs? Maybe. *Verdict:* Light-touch (due to phylogeny + low complexity) BUT flag the "bulk killing" aspect. Actually, given the user's worry about the entomology dept ignoring them, maybe Full Review is safer to set a precedent? Let's aim for Light-touch with specific conditions, or Full Review if the procedure is painful. Let's go with **Light-touch** but with a note that bulk killing requires humane methods.
      *   *Neural Tissue:* Human origin. Not a whole organism. Uncertain consciousness. *Verdict:* Escalation. This is bioethics/research governance, not just animal ethics.

  7.  **Addressing the Political Reality (The Skeptics):**
      *   The procedure must be defensible to the "sentimental nonsense" crowd.
      *   Argument: It's about risk management and compliance, not "feelings." It prevents reputational damage.
      *   It must be fast.
      *   It must acknowledge that "we don't know" is a valid scientific answer that triggers caution.

  8.  **Refining the Output:**
      *   *Tone:* Professional, direct, bureaucratic but ethically sound.
      *   *Format:* One page procedure + Appendix (Worked Examples).
      *   *Critique:* Explicitly state what the procedure *cannot* do (solve metaphysics).

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I address the "scallop scored low" issue?
      *   *Fix:* The new procedure relies heavily on Phylogeny (Step 2). Scallops are molluscs. Cephalopods are protected; bivalves usually aren't. This aligns with current legislation (e.g., UK, EU, Australia). This solves the "scallop problem" by deferring to scientific consensus on nervous system complexity rather than behavioral tests which are hard to run in 20 mins.
      *   *Critique:* Did I address the "degrees of standing" worry?
      *   *Fix:* Explicitly frame the outcomes as *oversight tiers*, not *moral worth tiers*.
      *   *Critique:* The user's original axes.
      *   *Fix:* I need to explicitly state which are kept. Axis 3 (Trade-offs) is kept as a behavioral marker. Axis 4 (Temporal) is kept as "Learning." Axis 1 & 2 are discarded as too functionalist (thermostat trap).

  10. **Final Polish:** Check constraints. One page + appendix. Four outcomes. Three cases. Candid limitations.

  *(Self-Correction on the BSF case)*: The user suspects they *should* review the facility. If I say "Light-touch," does that validate the entomology dept's neglect? Better to recommend "Full Review" for the *facility* but "Light-touch" for the *protocol*? No, keep it simple. If there's significant risk of suffering (bulk killing), Full Review ensures humane euthanasia standards are met. Let's push BSF to **Full Review** based on the "Precautionary Principle" regarding nociception, even if phylogeny is weak. This protects the committee from future criticism.

  *(Self-Correction on Neural Tissue)*: This is definitely Escalation. It involves human tissue and potential consciousness. Animal committee might not even be the right body.

  *(Self-Correction on Thermostat)*: Must fail early.

  *(Final check on "Skeptics")*: Emphasize that this protects the *University* from scandal, not just the animals. That appeals to administrators/skeptics.

  Let's write it.cw
answer: |-
  # DECISION PROCEDURE: NOVEL ENTITY OVERSIGHT TRIAGE (NEOT)
  **Version 1.0 | For Internal Committee Use Only**

  **Purpose:** To classify research entities into oversight tiers based on biological substrate, nervous system complexity, and behavioral evidence of sentience. This is a risk-management tool, not a metaphysical inquiry. It separates *factual assessment* (biology/behavior) from *value judgment* (precautionary threshold).

  **Outcomes:**
  1.  **EXEMPT:** No oversight required.
  2.  **LIGHT-TOUCH:** Researcher proceeds with standard conditions; annual reporting.
  3.  **FULL REVIEW:** Protocol requires specific modification, justification of harm, and committee approval.
  4.  **ESCALATION:** Referral to Research Governance/Bioethics Office (policy vacuum).

  ---

  ### THE PROCEDURE

  **STEP 1: Substrate Check (Fact)**
  *Q: Is the entity a living biological organism with a metabolic system?*
  *   **No:** (e.g., software, mechanical devices, chemical reactions). → **EXEMPT**. (Stops here).
  *   **Yes:** Proceed to Step 2.
  *   *Note: Discards your original Axis 1 & 2. Thermostats track states, but they are not biological. This solves the thermostat false positive.*

  **STEP 2: Phylogenetic Status (Fact)**
  *Q: Does the entity belong to a taxonomic group currently recognized by national law or scientific consensus as sentient?*
  *   **Yes:** (Vertebrates, Cephalopods, Decapod Crustaceans). → **FULL REVIEW**. (Stops here).
  *   **No:** (Insects, Nematodes, Molluscs other than Cephalopods, Plant, Fungi). → Proceed to Step 3.
  *   *Note: This anchors the procedure in existing law, protecting the committee from accusations of inventing new rules.*

  **STEP 3: Nervous System Architecture (Fact)**
  *Q: Does the entity possess a centralized nervous system or specialized nociceptors (pain receptors)?*
  *   **Yes:** (Evidence of central processing of aversive stimuli). → **FULL REVIEW**.
  *   **No:** (Diffuse nerve nets, ganglia only, or no nervous system). → Proceed to Step 4.
  *   *Note: Retains the spirit of your Axis 1 (internal states) but grounds it in anatomy, not functionalism.*

  **STEP 4: Behavioral Trade-Offs (Fact)**
  *Q: Is there peer-reviewed evidence that this species modifies behavior to avoid harm even when it conflicts with other drives (feeding, mating)?*
  *   **Yes:** (e.g., limping to protect injury, avoiding areas associated with shock). → **FULL REVIEW**.
  *   **No / Uncertain:** → Proceed to Step 5.
  *   *Note: This is your original Axis 3. It is the strongest behavioral marker for sentience.*

  **STEP 5: The Uncertainty Threshold (Value)**
  *Q: Given the ambiguity, does the potential for suffering warrant precaution?*
  *   **Committee Vote:**
      *   *Majority says "No credible risk":* → **LIGHT-TOUCH**. (Apply humane endpoints as best practice).
      *   *Majority says "Plausible risk" OR "Novel Entity":* → **ESCALATION** (if policy is unclear) or **FULL REVIEW** (if animal welfare is the primary concern).
  *   *Note: This is where you admit you are not philosophers. You are applying the Precautionary Principle. This addresses your "degrees of standing" worry by treating uncertainty as a trigger for protection, not a calculation of worth.*

  ---

  ### LIMITATIONS & POLITICAL VIABILITY

  **What this cannot do:** It cannot prove sentience. It cannot resolve the hard problem of consciousness. It cannot satisfy a philosopher who demands ontological precision.
  **Why the skeptics will accept it:** It frames protection as *risk mitigation* for the University. It prevents reputational damage from "bug torture" scandals. It relies on *consensus* and *law*, not individual moral intuition. It is fast.
  **Your Original Axes:**
  *   **Discarded:** Axis 1 (Internal States) and Axis 2 (Integration). These are functionalist and trap you with thermostats.
  *   **Retained:** Axis 3 (Trade-offs) is Step 4. Axis 4 (Temporal Mattering) is folded into Step 5 (Uncertainty/Learning).
  *   **Correction:** Moral standing is treated as binary (Protected/Not Protected) for the sake of the verdict, while oversight is scaled to risk.

  ***

  # APPENDIX: WORKED CASES

  ### CASE 1: The Thermostat (Floor Test)
  *   **Step 1 (Substrate):** Is it a living biological organism? **No.** It is a mechanical/electronic device.
  *   **Verdict:** **EXEMPT**.
  *   **Analysis:** The procedure kills the false positive immediately. Your original axes failed because they measured *function* (feedback loops). This procedure measures *biology*. A thermostat has no metabolism, no evolution, and no nervous system. It cannot suffer.
  *   **Committee Action:** File and close. No further discussion.

  ### CASE 2: Black Soldier Fly (BSF) Larvae (Waste-to-Feed Pilot)
  *   **Step 1 (Substrate):** Living organism? **Yes.**
  *   **Step 2 (Phylogeny):** Recognized sentient group? **No.** (Insects are not currently covered by most animal welfare acts).
  *   **Step 3 (Nervous System):** Centralized/Nociceptors? **Uncertain/No.** Insects have ganglia. Evidence for nociception (pain vs. reflex) is debated but generally considered low probability compared to vertebrates.
  *   **Step 4 (Trade-offs):** Evidence of harm avoidance? **Weak.** Some studies show avoidance of noxious heat, but often indistinguishable from reflex.
  *   **Step 5 (Uncertainty):** Plausible risk? **Yes.** The scale is industrial (bulk killing). Even if individual capacity is low, the volume creates ethical risk.
  *   **Verdict:** **FULL REVIEW**.
  *   **Analysis:** While phylogeny suggests *Light-touch*, the *volume* and the *method of killing* (often heat or composting) trigger the Precautionary Principle. The committee must verify humane euthanasia methods.
  *   **Committee Action:** Do not exempt. The Entomology Department must submit a protocol detailing euthanasia methods. This validates your suspicion that they should have been filing all along.

  ### CASE 3: Cultured Human Neural Tissue (Organoids)
  *   **Step 1 (Substrate):** Living biological? **Yes.**
  *   **Step 2 (Phylogeny):** Human tissue. **Yes.** (But not a whole organism).
  *   **Step 3 (Nervous System):** Neural activity present? **Yes.** Spontaneous activity noted.
  *   **Step 4 (Trade-offs):** N/A. (No body to protect, no behavior to observe).
  *   **Step 5 (Uncertainty):** Plausible risk of consciousness? **High/Unclear.** This is a policy vacuum. Animal Ethics Committees are usually mandated for *animals*, not human tissue.
  *   **Verdict:** **ESCALATION**.
  *   **Analysis:** This falls outside the remit of "Animal" Ethics. It touches on human research ethics and bioethics regarding consciousness in vitro. The committee lacks the mandate to approve this.
  *   **Committee Action:** Refer to the University Research Governance Office. Do not attempt to adjudicate this internally. You lack the jurisdiction and the expertise.

  ***

  ### FINAL NOTE TO THE COMMITTEE MEMBER
  If you present this, expect the skeptics to attack Step 5. They will call it "guilty until proven innocent." Your counter-argument is not moral; it is bureaucratic. *"If we are wrong and the fly feels nothing, we waste 20 minutes. If we are wrong and the fly feels pain, the University faces a scandal. Step 5 is insurance."*

  This procedure will not make you philosophers. It will make you consistent. That is all a committee can be.
