          *   *Assessment:* Partially right, partially wrong. It's true we can't know the *actual* long-term outcome (epistemic limitation). It's false that this makes the standard useless *if* we shift to expected value.
          *   *Philosophical Concept:* Actual Consequentialism vs. Expected Consequentialism. The "Cluelessness Objection."

      *   **Move 2 (Friend 2):** "Confuses certainty with evidence: we maximize expected value... work with our best estimates."
          *   *Assessment:* Strong point. This is the standard rebuttal in modern consequentialism. We act on *foreseeable* consequences, not omniscient ones.
          *   *Philosophical Concept:* Subjective/Expected Utilitarianism.

      *   **Move 3 (Friend 1):** "Expected value needs probabilities and there are none here... tiny chance of astronomically large outcome... arithmetic is captured by whatever speculation you feed it... paralysis or Pascal's Mugging."
          *   *Assessment:* This is the strongest philosophical point Friend 1 makes. It references the "Cluelessness Objection" (Lenman) and "Pascal's Mugging" (Bostrom/Beckstead). If the future is infinite, even tiny probabilities of huge values dominate the calculation.
          *   *Nuance:* However, in *practical* terms (like a bicycle vs. deworming), we usually discount far-future speculation heavily or treat probabilities as effectively zero for decision-making.

      *   **Move 4 (Friend 2):** "Proves too much. If uncertainty... disqualified a standard... it would disqualify every standard... prudence, ordinary kindness..."
          *   *Assessment:* Strong pragmatic point. All normative ethics face the "problem of ignorance." Deontology faces it too (what if lying saves a life?). Virtue ethics faces it (what counts as courageous?).
          *   *Nuance:* Consequentialism is *more* sensitive to this than rule-based systems, but not uniquely disabled by it.

      *   **Move 5 (Friend 1):** "Consequentialism is a criterion of rightness, not a decision procedure."
          *   *Assessment:* Philosophically sound distinction (Smart, Rawls). It saves the theory from being falsified by human limitation, but it risks making the theory action-guiding only in hindsight.
          *   *Risk:* If it never tells you what to do *now*, is it useful? Usually, we pair the criterion with a heuristic decision procedure (e.g., "follow rules that usually maximize utility").

