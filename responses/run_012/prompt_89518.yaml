      *   **Decision Procedures:** Friend 1 is right that Utilitarianism is a *criterion*, but wrong that it can't generate *procedures* (e.g., Rule Utilitarianism or Heuristics).
      *   **Cluelessness:** Friend 1 raises a valid academic objection (Lenman's Cluelessness), but it's often treated as a theoretical boundary condition, not a practical blocker for near-term interventions.

