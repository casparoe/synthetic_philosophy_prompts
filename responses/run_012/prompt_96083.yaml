  6. Regarding the colleague who opposed Melander: why was he wrong? A sentence on how these critics held the field back would clarify the trajectory of the discipline. It helps the reader to know who was an obstacle to progress. Identifying the error in their position allows us to appreciate Melander's advance.
  7. While contextual fidelity is valuable, a history that refuses all evaluation cannot explain why we should care whether Melander's arguments are any good, and so threatens to turn the past into a museum of the inscrutable. We need to know if he was right.
  8. To aid clarity, render Melander's vocabulary in ours—for instance, translating animal spirits as neural signals. However, once translated, it becomes clear Melander is imprecise; he fails to draw distinctions we now take for granted. Please note where his terminology lacks our current rigor. This translation is necessary for comprehension, even if it reveals his limitations. Please mark these gaps explicitly.

