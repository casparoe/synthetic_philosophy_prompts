answer: |-
  This is an exceptionally mature topic for a high school senior. You have correctly identified that the "hard problem" here isn't just measuring happiness, but the metaphysical and epistemic status of comparing distinct minds. Your friend's proposal is a known philosophical move (closely related to John Harsanyi's "Impartial Observer" and Richard Hare's "Ideal Observer" theories), but you are also correct that it is not a settlement. It shifts the burden from "comparing two people" to "imagining one person in two states," which raises its own deep problems about personal identity and the coherence of such an imagination.

  Since you have nine months and must work from the armchair, your goal should not be to solve the problem (philosophers have been failing to do that for a century) but to **map the dependencies**. You want to show *where* the lack of a settled theory of interpersonal comparison (IUC) actually breaks ethical reasoning, and where ethical reasoning manages to limp along without it.

  Here is a breakdown of what is settled versus contested, followed by the prioritized questions for your project.

  ### Part 1: The Landscape (Settled vs. Contested)

  You must be careful not to present orthodoxy as truth. In philosophy, "settled" usually means "there is a dominant working assumption," not "this is proven."

  **What is relatively settled (Orthodoxy):**
  *   **Classical Utilitarianism requires IUC:** If your moral duty is to maximize the sum total of welfare, you *must* be able to add Person A's welfare to Person B's. This requires cardinal comparability (knowing not just who is happier, but by how much).
  *   **Pareto Efficiency does not require IUC:** In welfare economics, a change is an improvement if it makes someone better off and no one worse off. This only requires *intrapersonal* comparison (Person A is better off than Person A was before).
  *   **Behavioral data is insufficient:** You cannot deduce IUC solely from observed choices. (Person A chooses an apple over an orange; Person B chooses an orange over an apple. Who is happier? We don't know.)

  **What is genuinely contested:**
  *   **Meaningfulness (Cognitivism):** Do statements like "A is worse off than B" have truth conditions? Or are they merely expressions of emotional preference (emotivism) or social constructs?
  *   **Epistemic Access:** Even if IUC are *true* (metaphysically real), can we ever *know* them? Some argue they are facts in principle but inaccessible to human judges.
  *   **The Scale:** Do we need a "common unit" (utils) to make moral decisions, or is ranking sufficient?
  *   **The Friend's Test:** Whether "extended preferences" (imagining living another's life) successfully grounds IUC or collapses under the weight of personal identity problems.

  ---

  ### Part 2: Prioritized Questions for Your Paper

  Given your constraints, I recommend prioritizing questions that allow you to analyze *ethical theories* rather than getting bogged down in the metaphysics of consciousness.

  #### Priority 1: The "Ethical Demand" Question
  **Question:** *Which normative ethical theories actually collapse without interpersonal comparisons, and which can function with only ordinal rankings or no comparisons at all?*

  *   **What it is upstream of:** This determines the *stakes*. If most plausible ethical theories (e.g., Contractualism, Deontology, Sufficientarianism) can function without precise IUC, then the metaphysical difficulty of IUC is less practically urgent. If Utilitarianism and Prioritarianism are the only games in town and they both require IUC, the problem is critical.
  *   **Tractability (High):** This is purely conceptual. You can take standard theories (Rawls, Nozick, Singer, Parfit) and analyze their axioms. Do they sum welfare? Do they maximize the minimum? Do they respect rights regardless of welfare?
  *   **Neglectedness (Medium):** Professional philosophers debate this, but it is often glossed over in introductory texts. Beginners often assume *all* morality requires comparing welfare. Showing that some don't is a valuable contribution.
  *   **Why prioritize it:** It scopes your project. If you find that the most robust theories don't need cardinal IUC, your paper can argue that the search for a "common scale" is a wild goose chase driven by a specific (Utilitarian) framework.

  #### Priority 2: The "Scale" Question (Ordinal vs. Cardinal)
  **Question:** *Is it possible to make meaningful moral trade-offs using only ordinal rankings (A is worse off than B) without cardinal magnitudes (A is 10 units worse off than B)?*

  *   **What it is upstream of:** **Prioritarianism.** This is a major view in modern political philosophy (associated with Derek Parfit). It says we should benefit the worse off, giving greater weight to benefits the worse off they are. This *requires* knowing who is worse off (ordinal), but arguably also *how much* worse off (cardinal) to weight the benefit. If IUC are only ordinal, Prioritarianism might be incoherent.
  *   **Tractability (Medium):** You need to understand the difference between ranking and measuring. This is conceptual but requires precision.
  *   **Neglectedness (High):** People often conflate "who is worse off" with "how much worse off." Distinguishing these allows for a nuanced view where we can identify the poor without needing to calculate their exact "utility deficit."
  *   **Why prioritize it:** It addresses your specific interest in whether comparisons need a common scale. You can argue that a "rough" comparability is sufficient for policy, even if a "precise" one is impossible.

  #### Priority 3: The "Basis" Question (Critiquing the Friend)
  **Question:** *Does the "single person living both lives" test (Extended Preferences) solve the metaphysical problem, or does it merely hide it behind a problem of Personal Identity?*

  *   **What it is upstream of:** **Constructivism vs. Realism.** Your friend is a constructivist (we make the comparison true by imagining it). If his test fails, it suggests IUC might be realist (facts exist independent of our imagination) or nihilist (no facts exist).
  *   **Tractability (High):** You have a specific argument to analyze. You can use standard counter-arguments: (1) It is impossible to imagine having another's memories and remaining *you*. (2) If you imagine having their memories, are you comparing *their* life or *your* simulation of their life?
  *   **Neglectedness (Low):** This is a standard debate (Harsanyi vs. Sen vs. Robbins). However, applying it critically is excellent training.
  *   **Why prioritize it:** It gives your paper a concrete antagonist. Rather than waving hands at "IUC is hard," you can say "Proposal X fails because of Y."

  ---

  ### Part 3: Trap Questions (Poor Use of 9 Months)

  Avoid these. They look central but are "black holes" that will consume your time without yielding a conclusion.

  **1. The Metaphysics of Consciousness (Qualia)**
  *   *The Trap:* Trying to solve whether Person A's "pain" is the same as Person B's "pain."
  *   *Why avoid:* This is the "Hard Problem" of consciousness. You will not solve it in nine months. It leads to neuroscience and metaphysics, not ethical reasoning.
  *   *Better approach:* Bracket the metaphysics. Say, "Even if we assume welfare is real, can we compare it?"

  **2. Formal Social Choice Theory (Arrow's Theorem)**
  *   *The Trap:* Trying to mathematically prove whether IUC are possible using voting theory.
  *   *Why avoid:* This requires advanced mathematics. As a philosophical argument, it often becomes a technical dispute about axioms rather than ethical reasoning.
  *   *Better approach:* Discuss the *implications* of impossibility theorems philosophically, without deriving them.

  **3. Defining "Utility" or "Welfare"**
  *   *The Trap:* Spending 6 months deciding if welfare is hedonic, desire-based, or objective list.
  *   *Why avoid:* You are studying *comparison*, not *content*. You can say, "Whatever makes a life go better, can we compare it across people?"
  *   *Better approach:* Pick one theory of welfare (e.g., desire satisfaction) as a working model and stick to it, noting the limitation.

  ---

  ### Part 4: Incomparability and Neutrality

  You mentioned interest in pairs of people who seem "neither better nor worse off." This is the problem of **Incommensurability** (or Imprecise Comparability).

  *   **The Question:** Is it true that for any two people A and B, either A is better off, B is better off, or they are equal? Or is there a fourth option: they are *incomparable*?
  *   **Upstream:** This challenges the logic of **Transitivity**. If A is incomparable to B, and B is incomparable to C, can we make policy choices involving A, B, and C?
  *   **Tractability:** High. This is pure conceptual analysis. Look at the work of **Ruth Chang** (on hard choices) or **Derek Parfit** (on imprecise comparability).
  *   **Verdict:** This is a strong candidate for a specific chapter or section. It allows you to argue that the demand for a "common scale" is a mistake because reality is sometimes vague.

  ---

  ### Part 5: What Would Move Priorities Up or Down?

  Over the next nine months, monitor these signals to adjust your focus:

  **Move Priority 1 (Ethical Demand) UP if:**
  *   You find that the most plausible ethical theories (e.g., those that match your considered moral judgments) all require cardinal IUC. This makes the metaphysical problem urgent.
  *   *Evidence:* You find that "Prioritarianism" is the only view that handles risk correctly, and Prioritarianism requires cardinal IUC.

  **Move Priority 1 DOWN if:**
  *   You find a robust "Non-Comparative" theory. For example, **Contractualism** (T.M. Scanlon) argues we should act on principles no one could reasonably reject. This often relies on *reasons*, not *utility sums*. If this view is strong, the IUC problem matters less for practice.

  **Move Priority 3 (Friend's Test) UP if:**
  *   Your supervisor pushes back hard on the metaphysics. If they think the "constructivist" angle is the most promising path to a solution, focus your energy on refining or refuting that specific mechanism.

  **Move Priority 2 (Scale) UP if:**
  *   You realize that "ranking" people (ordinal) is easy (we know who is poorer), but "measuring the gap" (cardinal) is impossible. If you can argue that ethics only needs ranking, you solve the practical problem without solving the metaphysical one.

  ### Summary Recommendation for a 9-Month Plan

  1.  **Months 1-2 (Literature & Scoping):** Read Harsanyi (Impartial Observer), Sen (Capabilities/Informational Basis), and Parfit (Prioritarianism/Incomparability). Define "Utility" loosely (welfare) and stick to it.
  2.  **Months 3-5 (The Ethical Demand):** Draft the core argument: Which ethical theories break without IUC? Argue that Utilitarianism breaks, but Contractualism or Sufficientarianism might not.
  3.  **Months 6-7 (The Scale & Incomparability):** Argue that even if we need IUC, we only need *ordinal* rankings, not *cardinal* scales. Introduce the possibility of "imprecise comparability" to handle the hard cases.
  4.  **Months 8-9 (Critique & Synthesis):** Use your friend's test as a case study. Show why it fails to provide the *cardinal* scale Utilitarianism needs, but might support the *ordinal* ranking other theories need. Conclude on whether the search for a "common scale" is a category error.

  This approach keeps you in the armchair, focuses on argumentation, and produces a paper that clarifies *why* the problem matters rather than just restating that it is hard.
