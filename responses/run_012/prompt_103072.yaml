prompt: |-
  I'm a third-year student in a seminar on transitional justice, and our final assessment is a simulation. The class is constituted as a national commission of inquiry for an invented country emerging from a twelve-year civil conflict, and I have been assigned to draft the procedure by which the commission will adjudicate applications for amnesty. The mandate we were given is deliberately ugly: eighteen months, roughly forty thousand named alleged perpetrators, and a political settlement that the outgoing security leadership signed only on the assurance that the process would not become a victor's tribunal — while the victims' associations have made equally clear that anything resembling a blanket amnesty will be received as a second betrayal. I do not want an essay on the justice-versus-peace tradeoff; I want the instrument itself, and I want it grounded in what the actual commissions got right and wrong (the conditional amnesty that required full disclosure in South Africa, the oscillation between trials and amnesty laws in Argentina, the community-court route in Rwanda), though please do not give me citations or a reading list — I need this to stand on its own.

  What I need is a decision procedure a case officer with no theory training could run on a single application in about an hour and hand to a panel for signature. Give me the questions in the order they should be asked, what counts as a sufficient answer to each, the point at which the procedure stops with a refusal, and the point at which it must hand the file to a human because the remaining question is one of value rather than fact. It should sort every applicant into a small number of outcome categories — for example referral to prosecution, amnesty conditioned on some act by the applicant, amnesty without condition, or no decision — and it should say what makes a case fall out of the scheme altogether. Two things I find genuinely confusing and would like the procedure to resolve rather than dodge: first, I keep being told that amnesty conditioned on disclosure is a form of accountability rather than its abdication, and I cannot see how a procedure could make that more than a slogan when the commission has no way to verify most disclosures; second, I cannot tell whether the severity of the act, the rank of the perpetrator, or the willingness of the perpetrator to tell the truth should be doing the real work, and I suspect that choosing among those three is already a political decision disguised as a test.

  Please then run the procedure on three applications: a mid-level commander who gives a complete and apparently candid account, names his superiors, and personally ordered two massacres; a conscripted teenager who participated in one killing and has been in therapy since; and a senior architect of the policy who refuses to disclose anything, whose faction's cooperation the settlement still depends on. Tell me plainly which of the three the procedure handles worst, and where it produces an answer I will not like. Finally, be honest about what the procedure cannot do at all, and about which of the theoretical distinctions you had to flatten in order to make it usable — and which ones you refused to flatten, because a case officer who could not see them would get the case wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Third-year student in a transitional justice seminar.
      *   **Task:** Draft a procedural instrument for a National Commission of Inquiry (NCI) to adjudicate amnesty applications.
      *   **Context:** Invented country, 12-year civil conflict, 18-month mandate, 40,000 applicants.
      *   **Constraints:** Political settlement requires no "victor's tribunal" (outgoing security leadership protection); Victims' associations reject blanket amnesty.
      *   **Requirements:**
          *   No essay on justice vs. peace.
          *   No citations/reading list.
          *   Must be a decision procedure for a case officer (no theory training) to run in ~1 hour.
          *   Must include: Questions in order, sufficiency criteria, stop/refusal points, hand-off points (value vs. fact), outcome categories.
          *   Must address two specific confusions: (1) How conditional amnesty = accountability without verification capacity? (2) Weighting of severity vs. rank vs. truth-telling.
          *   Must test the procedure on three specific cases (Mid-level commander, Conscripted teen, Senior architect).
          *   Must identify the worst-handled case and the "unlikeable" answer.
          *   Must be honest about limitations and theoretical flattening/refusals.

  2.  **Deconstruct the Core Tensions:**
      *   *Volume vs. Depth:* 40,000 cases in 18 months is impossible for deep investigation. The procedure *must* be triage-based.
      *   *Truth vs. Verification:* The South African TRC model relied on "full disclosure," but verification was often impossible. The prompt asks how to make this more than a slogan. *Solution:* Shift the burden of proof to the applicant and use "corroboration by consistency" rather than forensic truth.
      *   *Rank vs. Act vs. Truth:* This is the political minefield. If we prioritize rank, it looks like victor's justice (targeting leaders). If we prioritize act severity, we might amnesty the architect who didn't pull the trigger. If we prioritize truth, we might let monsters go free if they talk. *Solution:* A weighted matrix where Truth is the *gateway*, Act Severity determines the *type* of amnesty (if any), and Rank determines the *level of scrutiny*.
      *   *Accountability without Prosecution:* How is disclosure accountability? *Solution:* Public shaming/naming and the creation of an historical record. The procedure must ensure the "amnesty" isn't invisible.

  3.  **Drafting the Procedure (The Instrument):**
      *   *Name:* Procedural Directive 04: Adjudication of Amnesty Applications.
      *   *Structure:* Linear flowchart logic.
      *   *Outcomes:*
          1.  Grant (Conditional).
          2.  Grant (Unconditional - rare).
          3.  Refer to Prosecution.
          4.  Reject/Defer.
      *   *The "Verification" Problem:* I need to build in a mechanism where the *detail* of the disclosure acts as its own verification. Vague stories get rejected. Specific, checkable details that match known patterns get credited.
      *   *The "Rank/Act/Truth" Problem:* I need to make the weighting explicit in the instructions so the officer isn't guessing.
          *   Truth = Gatekeeper (No truth, no amnesty).
          *   Act = Eligibility (Some acts are non-amnestable).
          *   Rank = Scrutiny Level (Higher rank = harder to prove "political objective").

  4.  **Developing the Steps:**
      *   *Step 1: Jurisdiction/Eligibility.* (Timeframe, political motive).
      *   *Step 2: The Disclosure Test.* (Specifics, consistency, new info).
      *   *Step 3: The Severity Filter.* (Excluded crimes vs. amnestable crimes).
      *   *Step 4: The Proportionality/Remediation Check.* (What do they offer back?).
      *   *Step 5: The Hand-off.* (When does it become a value judgment?).

  5.  **Addressing the Two Confusions:**
      *   *Confusion 1 (Verification):* The procedure will treat "corroborative detail" as the currency of truth. If they name victims, locations, times that match existing files, it counts. If they say "I don't remember," it fails. Accountability comes from the *public record* of the admission, not just the legal immunity.
      *   *Confusion 2 (Weighting):* The procedure will explicitly state: Truth is binary (Pass/Fail). Severity determines *if* amnesty is legally possible. Rank determines the *burden of proof* for political motive. This separates the legal test from the political one.

  6.  **Running the Test Cases:**
      *   *Case 1 (Mid-level Commander):* Ordered massacres. Full disclosure. Names superiors.
          *   *Result:* Likely Conditional Amnesty. He passed the truth test. The act is severe, but if the mandate allows amnesty for political acts, he qualifies. Condition: Public testimony + Reparations contribution.
      *   *Case 2 (Conscripted Teen):* One killing. Therapy.
          *   *Result:* Unconditional Amnesty (or minimal condition). Low rank, low severity (relative), high remorse/rehab.
      *   *Case 3 (Senior Architect):* Refuses disclosure. Faction cooperation needed.
          *   *Result:* Refer to Prosecution (Technically). *But* this is the political trap. The procedure *must* reject him based on the rules, even if the political settlement needs him. This highlights the tension.
      *   *Worst Handled:* The Senior Architect. The procedure forces a "No" when the political reality might demand a "Yes" (or a blind eye). This exposes the fragility of the mandate.
      *   *Unlikeable Answer:* The Mid-level Commander getting amnesty because he talked, while the Architect (who might be "more guilty") gets referred (or walks free due to political pressure outside the procedure). Actually, the most unlikeable answer is usually the Commander getting amnesty for ordering massacres just because he spoke. It feels like buying freedom with words.

  7.  **Refining the "Honesty" Section:**
      *   *What it can't do:* It can't verify lies perfectly. It can't satisfy victims who want punishment. It can't stop political interference.
      *   *Flattening:* I have to flatten "political objective" into a checklist. I have to flatten "remorse" into "actions taken."
      *   *Refusal to Flatten:* I cannot flatten the distinction between *ordering* and *doing*. The procedure must treat them differently regarding the "political motive" test.

  8.  **Review against Constraints:**
      *   No citations? Check.
      *   No essay intro? Check.
      *   One hour per case? The steps need to be simple enough.
      *   Outcome categories clear? Check.
      *   Address the two confusions explicitly? Check.

  9.  **Final Polish:**
      *   Tone: Bureaucratic, precise, cold but humane where necessary.
      *   Formatting: Clear headings, bold text for decision points.
      *   Ensure the "Hand-off" point is clear (where the officer stops and the Panel decides).

  *(Self-Correction during drafting)*: I initially thought about making the Senior Architect get amnesty to show the "political settlement" reality. But the prompt asks me to draft the *procedure*, not the political outcome. The procedure should be robust. If the politicians override it, that's outside the instrument. So the procedure must reject the Architect for failing the disclosure test. This highlights the tension the student asked about.

  *(Refining the Verification Issue)*: How to make disclosure = accountability? The procedure needs a step where the applicant must waive privacy rights regarding their testimony. The accountability is the *naming*. I will add a "Public Record" condition.

  *(Refining the Weighting Issue)*: I need to make sure the officer knows that Rank doesn't disqualify, but it raises the bar for "Political Objective." A private killing is a crime; a killing for a political goal *might* be amnestable. High rank implies more agency, so harder to prove they were "just following orders" or acting for a political goal vs personal gain.

  Let's write the instrument.

  *(Final check on the "Unlikeable Answer")*: The Mid-level Commander getting amnesty is the classic TRC critique. "I killed 20 people, here are the names, I walk." The procedure will likely grant this if the mandate allows. I need to be honest that this is the feature, not a bug, but it tastes like ash.

  Okay, ready to generate.cltr
answer: |-
  **NATIONAL COMMISSION OF INQUIRY**
  **PROCEDURAL DIRECTIVE 04: ADJUDICATION OF AMNESTY APPLICATIONS**

  **EFFECTIVE:** Immediately
  **AUTHORITY:** Clause 12 of the National Reconciliation Settlement
  **USER:** Case Officers (Level 1)
  **TIME LIMIT:** 60 Minutes per File

  ### I. PURPOSE AND SCOPE
  This instrument directs the sorting of amnesty applications. It is not a trial. It is an administrative filter designed to separate applicants eligible for immunity under the Settlement from those who must face prosecution or rejection. The goal is not forensic certainty, but procedural consistency.

  **Outcome Categories:**
  1.  **GRANT (Conditional):** Amnesty awarded pending completion of specific acts (testimony, reparations).
  2.  **GRANT (Unconditional):** Amnesty awarded immediately (Rare; reserved for low-severity/duress cases).
  3.  **REFER:** File sent to the Office of the Prosecutor (Non-amnestable acts or failure of disclosure).
  4.  **DEFER:** File sent to the Senior Panel (Value judgment required; political sensitivity).

  ---

  ### II. THE DECISION PROCEDURE

  **STEP 1: JURISDICTIONAL THRESHOLD (5 Minutes)**
  *Question:* Does the alleged conduct fall within the Mandate Period and Scope?
  *   **Check:** Date of act (must be within the 12-year conflict window).
  *   **Check:** Nexus to Conflict (must be linked to a political organization, state security force, or liberation movement).
  *   **Sufficiency:** Applicant must identify the organization they acted for. Private criminal acts (rape for personal pleasure, looting for personal gain) are excluded.
  *   **Stop Point:** If **NO** to either → **REFER** to Prosecutor. End file.
  *   **If YES** → Proceed to Step 2.

  **STEP 2: THE DISCLOSURE TEST (20 Minutes)**
  *Question:* Has the applicant made a full and truthful disclosure of their role?
  *   **Instruction:** You cannot verify truth forensically. You are testing for *specificity* and *consistency*.
  *   **Check A (Specificity):** Does the account include dates, locations, names of victims, names of commanders, and methods?
      *   *Fail:* "I was there." "I don't remember." "It was war."
      *   *Pass:* "On 14 March, at the River Bridge, under order of Colonel X, I fired on Group Y."
  *   **Check B (Consistency):** Does the account contradict known evidence in the Commission's database (e.g., victim statements, exhumation reports)?
      *   *Fail:* Applicant claims they were in Camp A on a date records show they were at Massacre B.
      *   *Pass:* Account aligns with or credibly explains known facts.
  *   **Check C (New Information):** Does the disclosure provide the Commission with information it did not previously possess (e.g., location of remains, identity of hidden commanders)?
      *   *Note:* This is the "Accountability" Mechanism. Truth is the currency.
  *   **Stop Point:** If **FAIL** on Specificity or Consistency → **REFER** to Prosecutor. (Lying voids the settlement).
  *   **If PASS** → Proceed to Step 3.

  **STEP 3: THE SEVERITY AND RANK FILTER (15 Minutes)**
  *Question:* Is the act amnestable given the applicant's rank and the nature of the violence?
  *   **Instruction:** This is where Rank, Act, and Truth are weighted.
      *   **Truth** was the Gatekeeper (Step 2).
      *   **Act Severity** determines Eligibility.
      *   **Rank** determines the Burden of Proof for "Political Objective."
  *   **Check A (Excluded Crimes):** Did the applicant commit torture, sexual violence, or indiscriminate killing of civilians *without* a military objective?
      *   *Rule:* These are presumptively non-amnestable unless the applicant proves they were acting under immediate duress (threat of death).
  *   **Check B (The Rank Adjustment):**
      *   *Low Rank (Conscript/Private):* Presumption of Duress applies. Easy to pass.
      *   *Mid Rank (Commander):* Must prove the act served a specific political/military objective, not personal vendetta.
      *   *High Rank (Architect/General):* Must prove the policy itself was proportionate. (See Step 5).
  *   **Stop Point:** If Act is Excluded (Check A) AND no Duress proven → **REFER** to Prosecutor.
  *   **If Eligible** → Proceed to Step 4.

  **STEP 4: REMEDIATION AND CONDITIONS (10 Minutes)**
  *Question:* What is required to finalize the amnesty?
  *   **Instruction:** Amnesty is not free. It purchases immunity with contribution to the record.
  *   **Determination:**
      *   *If Low Rank/Single Act:* **GRANT (Unconditional)** or Condition: Written apology to victim family.
      *   *If Mid/High Rank/Multiple Acts:* **GRANT (Conditional)**.
  *   **Mandatory Conditions for Mid/High Rank:**
      1.  Public testimony (waiver of anonymity).
      2.  Contribution to Community Reparations Fund (sliding scale based on assets).
      3.  Cooperation with further investigations (naming superiors).
  *   **If Conditions Accepted** → Proceed to Signature.
  *   **If Conditions Refused** → **REFER** to Prosecutor.

  **STEP 5: THE HAND-OFF POINT (Value Judgment)**
  *   **Instruction:** If the applicant is a **Senior Architect (High Rank)** and the act involves **Policy Design** rather than direct killing, the Case Officer cannot adjudicate "Proportionality."
  *   **Trigger:** Applicant claims immunity for creating the *policy* that led to atrocities, rather than executing them.
  *   **Action:** Mark File **DEFER**. Send to Senior Panel.
  *   **Reason:** Deciding whether a "political objective" justifies a "policy of terror" is a political value judgment, not a factual finding. The Case Officer lacks the mandate to legitimize state policy.

  ---

  ### III. APPLICATION OF PROCEDURE TO TEST CASES

  **Case 1: The Mid-Level Commander**
  *   **Profile:** Ordered two massacres. Full disclosure. Names superiors. Candid.
  *   **Step 1 (Jurisdiction):** Pass. Acts during conflict, for political org.
  *   **Step 2 (Disclosure):** Pass. High specificity. Provides new info (names superiors).
  *   **Step 3 (Severity/Rank):** Pass. Acts are severe, but he proves "military objective" (clearing a zone). Rank is Mid, so burden is met by showing chain of command.
  *   **Step 4 (Remediation):** **GRANT (Conditional).**
  *   **Outcome:** He receives amnesty *if* he testifies publicly and pays into the Reparations Fund.
  *   **Analysis:** The procedure works as intended. He trades truth for freedom. Accountability is achieved through the public record and the naming of superiors, not prison.

  **Case 2: The Conscripted Teenager**
  *   **Profile:** One killing. Conscripted. Therapy since.
  *   **Step 1 (Jurisdiction):** Pass.
  *   **Step 2 (Disclosure):** Pass. Likely specific (trauma often fixes details).
  *   **Step 3 (Severity/Rank):** Pass. Low Rank triggers Presumption of Duress. One killing is severe, but duress mitigates.
  *   **Step 4 (Remediation):** **GRANT (Unconditional)** or minimal condition (apology letter).
  *   **Outcome:** Amnesty granted.
  *   **Analysis:** The procedure correctly identifies low culpability. No political value judgment needed.

  **Case 3: The Senior Architect**
  *   **Profile:** Designed the policy. Refuses disclosure. Faction cooperation needed for peace.
  *   **Step 1 (Jurisdiction):** Pass.
  *   **Step 2 (Disclosure):** **FAIL.** Refuses to disclose.
  *   **Stop Point:** Procedure dictates **REFER** to Prosecutor.
  *   **Outcome:** The instrument rejects him.
  *   **Analysis:** Here the procedure breaks against political reality. The Settlement says "no victor's tribunal," implying he might need protection. But the Procedure says "No Truth, No Amnesty."

  ---

  ### IV. CRITICAL EVALUATION

  **1. Which case does the procedure handle worst?**
  **The Senior Architect (Case 3).**
  The procedure produces a "REFER" (Prosecution) outcome. However, your prompt states the political settlement depends on his faction's cooperation. If the Commission follows this procedure, it risks collapsing the peace deal. If the Commission *overrides* the procedure to save the peace deal, it renders this instrument a fiction and betrays the victims (the "second betrayal"). The procedure cannot resolve the contradiction between "Rule of Law" and "Political Necessity" at the highest level. It forces a choice that a Case Officer should not have to make.

  **2. Which answer will I not like?**
  **The Mid-Level Commander (Case 1).**
  The procedure grants him amnesty. He ordered massacres. He will walk free. You will feel that "Conditional Amnesty" is a slogan when the condition is just "talk and pay." If he has no money, the fine is meaningless. If he testifies, he might lie on the stand with no penalty (since he already has amnesty). The procedure treats his "truth" as sufficient accountability, but for the mothers of the massacred, his freedom is a continuation of the crime. The procedure asks you to accept that *knowing* who did it is a form of justice. It often is not.

  **3. What the procedure cannot do at all.**
  *   **Verify Lies:** If the Commander lies convincingly (matches the database but omits his own initiative), the procedure grants amnesty based on fraud. The "Consistency Check" only catches contradictions, not omissions.
  *   **Protect Victims from Trauma:** The "Public Testimony" condition requires victims to hear the perpetrator's account. The procedure has no mechanism to assess if the victim community can withstand this.
  *   **Enforce Conditions:** Once the amnesty is signed, the Commission has no police power to ensure he pays the fine or testifies. The "Condition" is morally binding, not legally enforceable once the grant is issued.

  **4. Theoretical Distinctions: Flattened vs. Protected.**

  *   **Flattened (For Usability):**
      *   **Remorse:** I flattened "remorse" into "actions taken" (therapy, apology, payment). A Case Officer cannot measure a soul. They can only check boxes. A sociopath can check the boxes.
      *   **Political Objective:** I flattened this into "Nexus to Conflict." Distinguishing a political act from a criminal act is philosophically dense. The procedure reduces it to: "Did you wear a uniform and follow an order?" This is crude but necessary for speed.

  *   **Refused to Flatten (For Accuracy):**
      *   **Ordering vs. Doing:** I kept the distinction between the Architect and the Commander. A Case Officer *must* see that designing a policy of terror is different from executing a raid. If you flatten this, you either amnesty the architect (unjust) or prosecute the conscript (unjust). The "Rank Adjustment" in Step 3 forces the officer to look at *agency*.
      *   **Truth vs. Fact:** I refused to treat "Truth" as "Forensic Fact." The procedure explicitly tells the officer to look for *corroborative detail*, not proof. If you require proof, you require a trial, and you violate the 18-month mandate. The officer must understand they are adjudicating *narrative consistency*, not guilt. If they cannot make that distinction, they will freeze on every file.

  **FINAL NOTE TO THE CASE OFFICER:**
  You are not judging guilt. You are judging eligibility. If the file smells wrong, but the boxes are checked, you must Grant. If the file smells right, but the boxes are unchecked, you must Refer. Your discomfort is not a bug; it is the cost of the Settlement. Sign and pass the file.
