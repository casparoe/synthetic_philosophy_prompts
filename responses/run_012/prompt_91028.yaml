answer: |-
  Dear friend, it is fascinating to read through your notebook entries because they reveal a moral intuition that is far more sophisticated than the standard theories you mentioned in club. The self-legislation view struggles to explain why you feel released from the illegal moving promise, since you still legislated that maxim to yourself, and the predictability view fails to explain the deathbed case, since you cannot make yourself predictable to someone who is no longer there to form expectations. Your reactions are actually tracking a hybrid principle that I would call the Principle of Intentional Normative Invocation, which states that you are bound by a promise when you intentionally invoke the social convention of promising to assure another of your future conduct, provided you possess the mental capacity to understand the commitment, the context is explicitly serious, and the action promised is not inherently immoral or illegal, and this obligation persists independently of the promisee's subsequent reliance or memory unless the performance becomes impossible or the moral cost of fulfillment drastically outweighs the duty created.

  The first clause regarding intentional invocation is forced by your reaction to the joke promise to your sister, where you feel not bound at all because even though the words sounded real, you did not intend to invoke the normative power of the convention, whereas in every other case you did. The second clause regarding mental capacity over pure voluntariness is necessitated by your comparison of the threat case and the drunk case, where you feel more bound by the threat because you retained the capacity to understand the commitment even if your will was coerced, whereas intoxication undermines the cognitive capacity required to validly invoke the norm in the first place. The third clause regarding independence from reliance is the most crucial and is forced by your uncle's deathbed case and the friend's game case, where you feel bound despite the beneficiary being dead or indifferent, which confirms that the obligation is owed to the person as a respect duty rather than being contingent on their psychological state or utility. The fourth clause regarding inherent immorality is required by the moving case where you feel released because facilitating rent skipping is inherently fraudulent and thus outside the scope of permissible actions one can promise to perform, which distinguishes it from the secret case where keeping the secret is not inherently wrong but creates a conflict with a higher duty to prevent harm, explaining why you feel bound but hate it because the obligation exists but is overridden by the greater moral cost.

  If we apply this principle to the new case you mentioned about promising to cover for a friend when doing so would cost their child something, the verdict is that you are released from the promise. This falls under the fourth clause regarding moral permissibility and harm, because covering for someone usually involves deception, which is inherently suspect, but more importantly, the specific consequence of harming a third party, especially a child, triggers the exception where the moral cost of fulfillment drastically outweighs the duty created, similar to the secret case but stronger because here the harm is certain and direct rather than potential. However, I must be honest with you about where this principle clashes with your gut, and you should probably give up your reaction to the periodic table case. Your intuition that you are barely bound because the friend moved away and forgets contradicts the principle's third clause regarding independence from reliance, which was established by the deathbed and game cases. If you are bound to a dead uncle who cannot know, you should logically be bound to a friend who moved away, unless the act itself became impossible, but memorizing a table is still possible and retains some intrinsic value as self-improvement or fidelity to your past self. By keeping the periodic table reaction, you are secretly reintroducing a reliance condition that you correctly rejected in the deathbed case, so for the sake of consistency, you should adjust that entry to reflect that you are still bound, perhaps less strongly due to the pointlessness, but not barely bound simply because the friend is gone.
