      *   *The Conflict:* New staff arrive. They see Elias's sacrifice as the *standard*. They expect him to keep doing it, and they feel pressured to match him. Elias feels trapped. He wants to step back, but can't because he set the bar.
      *   *The Twist Implementation:* The "Precedent Ratchet." Elias's initial gift became the job description. Now, if he tries to take a vacation, it's seen as slacking. If a new nurse works normal hours, they look bad compared to Elias.
