answer: |-
  The fluorescent lights of the Harrow House staff room hummed with a sound that Elias had stopped hearing three years ago. He sat at the laminate table, stirring a cup of tea that had gone cold. Across from him, David, the facility manager, tapped a pen against a clipboard.

  "It's just the holiday week, Elias," David said, not looking up. "You know how it gets. Families travel, staff want time off. We're short two bodies on the night shift."

  Elias looked at the roster pinned to the corkboard. His name was already inked in for every night between Christmas and New Year's. He lived in the converted apartment upstairs. He hadn't taken a holiday week in four years.

  "I'm not working the night shift, David," Elias said. His voice was quiet, but the room seemed to tighten around it.

  David finally looked up, smiling a tight, puzzled smile. "Come on. You did it during the flu outbreak. You did it when the funding got cut last winter. You slept on the couch in the lounge for three weeks straight. Nobody else would have done that."

  "That was then."

  "It set a precedent, is what it did," David said, leaning back. "It showed what's possible. When you stepped up, you didn't just fill a gap. You showed us the capacity of the team. If you can do it, why can't the rest of us? And if you can do it, why shouldn't you?"

  Elias looked down at his tea. Four years ago, the Harrow House had been facing closure. The staff had walked out over pay disputes, leaving the residents—adults with severe cognitive disabilities—uncared for. Elias had stayed. He hadn't slept much. He hadn't gone home. He had fed, washed, and soothed twelve people alone for twenty-one days.

  At the time, the local paper had called him a saint. The residents' families had cried and hugged him. It was a gift. It was something beyond what anyone could ask. It was supererogatory, though he didn't have the word for it then. It was grace.

  But grace, Elias had learned, hardens into policy.

  The next morning, a new nurse named Sarah was orientation. She was young, eager, and visibly terrified. Elias showed her the medication lockers, the lift mechanisms, the logbooks.

  "I heard about what you did," Sarah said as they walked down the hallway. "During the walkout."

  "It was a long time ago," Elias said.

  "David said you basically lived here. That you didn't have a life outside these walls." She stopped walking. "Is that… is that what's expected? Because I have a kid. I can't sleep on the couch for three weeks."

  "It's not expected," Elias said.

  "But you did it."

  "That was me."

  Sarah looked at him, her eyes searching for a loophole that wasn't there. "If you can do it, though… it makes people wonder why everyone else complains about overtime. It makes normal look like… less."

  Elias felt a familiar heaviness in his chest. This was the erosion. When he had given the gift, it had been a spike above the baseline. Now, the baseline had risen to meet the spike. His sacrifice hadn't just helped the residents; it had devalued the labor of everyone who came after. By doing the impossible, he had made the impossible mandatory.

  That afternoon, the crisis arrived. A pipe burst in the west wing. Water flooded the common room. The residents had to be moved temporarily to the lounge. It meant double staffing, extra cleaning, overnight monitoring.

  David gathered the team in the wet common room. "We need volunteers for the overnight rotation. We need three people."

  Silence. The staff shifted their weight. Sarah looked at her shoes. Two other nurses avoided eye contact. They were all thinking about their kids, their partners, their sleep. They were also thinking about Elias.

  If Elias volunteered, it confirmed the standard. It said, *See? It can be done. Why are you hesitating?*
  If Elias didn't volunteer, he was a hypocrite. *He did it before, why not now? Has he gone soft? Is he too good for us?*

  David's eyes landed on Elias. "Elias? You know the layout better than anyone. If you take the first shift, it'll break the ice."

  Elias looked at the residents huddled in the lounge. Mrs. Gable was rocking back and forth, distressed by the noise. She needed familiarity. She needed him.

  He looked at Sarah. She was watching him, waiting to see what kind of world she was working in. If he said yes, she would feel guilty saying no. If he said no, she might feel permission to prioritize her own life, or she might feel the institution was collapsing.

  "Elias?" David prompted.

  Elias realized then that he couldn't win. The category of the 'heroic' had vanished the moment he survived it. There was no longer a 'beyond duty.' There was only duty, and dereliction. He had eaten the fruit of the tree of knowledge, and now everyone else was being forced to swallow the seeds.

  If he did this, he cemented the ratchet. The next time there was a crisis, someone would say, "Elias did it during the flood." And the time after that, "Elias did it during the flood and the holidays." Eventually, living at Harrow House wouldn't be a sacrifice; it would be the job description, and the salary wouldn't change.

  But if he didn't do it, Mrs. Gable might not sleep. The pipe might freeze. The residents might suffer.

  Was the original act good? If the consequence was a permanent elevation of exploitation, disguised as dedication, had he actually done harm? Should he have let the facility close? Should he have let the residents go to a state home rather than become the standard-bearer for unpaid labor?

  "I can't," Elias said.

  The silence was heavier than before. David's face went slack. Sarah looked up, surprised, then quickly looked down again, as if she'd seen something she wasn't supposed to.

  "You can't," David repeated.

  "I have an appointment," Elias lied. "Tomorrow morning. I need to sleep."

  "You're turning down the residents?" David's voice dropped, turning cold. "After everything? You're telling me you're too busy for the people you saved?"

  "I didn't save them," Elias said. "I worked here. Like everyone else."

  "It doesn't look like that from the outside," David said. "It looks like you're walking away."

  Elias looked at Mrs. Gable. She had stopped rocking. She was watching him. She didn't know about precedents. She didn't know about moral categories. She just knew that Elias was the one who usually made the tea when the water was shut off.

  He felt a strange, cold clarity. If he stayed, he preserved the care but destroyed the possibility of virtue. He turned gift into debt. If he left, he honored the boundary between duty and gift, but he left a need unmet.

  There was a third option, he realized. A paradoxical one. He could do the work, but refuse the praise. He could do it anonymously. But there was no anonymity here. Everyone knew his name.

  Could he do the work, but make it clear it was a one-time exception? No. Exceptions become precedents too.

  Could he do the work, but demand payment? If he demanded overtime pay, it became transactional. It ceased to be supererogatory. It became labor. But the budget wasn't there.

  Elias walked over to the coffee machine. He poured a cup. He walked it over to Mrs. Gable. She took it with trembling hands.

  "I'm going home," Elias said to the room. "I'll be back at seven tomorrow. Until then, we rotate. Two hours on, four hours off. Everyone. Including you, David."

  "You can't order me," David said.

  "I'm not ordering. I'm saying I'm not doing it alone. And if I don't do it alone, then nobody has to do what I did before. Because what I did before was a mistake."

  "A mistake?" Sarah asked.

  "It raised the bar where there shouldn't be one," Elias said. He felt the words were clumsy, inadequate to the shape of the thing inside him. "If I'm a hero, then you're all villains for wanting to go home to your kids. I don't want that. So I'm not being a hero tonight."

  He put his coat on. He walked to the door. He knew that tomorrow, when he came back, the atmosphere would be different. Some would resent him for breaking the spell. Some would feel relieved that the ghost of his perfection was exorcised. Some would say he had betrayed the residents.

  He put his hand on the door handle. He wondered if, by refusing to be a saint now, he was finally honoring the sanctity of the original act. Or if he was just a tired man walking out on people who needed him.

  He didn't know if there was a difference anymore.

  Elias opened the door. The cold night air hit his face. He didn't look back to see if anyone followed him. He just walked into the dark, leaving the light of the ward behind him, unsure if he was extinguishing a flame or finally letting it breathe.
