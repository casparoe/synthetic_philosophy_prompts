answer: |-
  The waiting room smelled of ozone and stale coffee. Mara checked her account balance on her wrist comp. The red figure blinked. The sincerity bonus wasn't just extra income; it was the difference between eviction and staying in Sector 4. Across from her, Jory stretched his legs, looking entirely too relaxed for a man about to be interrogated about his soul.

  "You're vibrating," Jory said.

  "Rent's due."

  "Then don't think about the rent. Think about the Spark." Jory tapped the neural interface behind his ear. "That's the trick. Hale knows the biometrics. If your pulse spikes when you talk about the quarterly dividend, he fails you. You have to feel the love before you open your mouth."

  Mara touched her own interface. She had worn the Spark for three months straight. It smoothed the jagged edges of her anxiety; it made the gray sky look slightly less oppressive. But she hadn't started wearing it because she believed in it. She started because she needed the bonus. Now, sitting here, she couldn't tell if the calm humming in her head was the product working, or the anticipation of the credit hitting her account. The two sensations were woven together like twisted wire.

  "I don't know if I love it," Mara said. "I know I need the check."

  "Then fake the love," Jory said. "I don't use the thing. Haven't for a year. I just memorize the scripts. 'It brings clarity.' 'It connects us.' Hale hears what he wants to hear. He's looking for consistency, not truth."

  "That's the direct route," Mara said.

  "It's the only route that gets you paid." Jory stood as his name flashed on the wall screen. "Good luck. Don't let the money show in your eyes."

  Mara watched him go. She knew people who did what Jory did. They walked around praising the Spark while complaining about its battery life in the breakroom. They were efficient. They got the money. But there was a hollowness to them, a kind of structural instability. If the bonus stopped, their enthusiasm would vanish instantly, leaving nothing behind. They were building a house on a foundation of paychecks.

  Mara had tried the other way. When the quarter started, she had told herself: *Use the money as a push. Wear the device enough, and maybe you'll find a reason to keep it on without the pay.* She had forced herself to engage with the Spark's features, digging for genuine utility. She had found some. The sleep modulation was real. The noise cancellation was genuine. But every time she felt a surge of gratitude for the quiet, she heard the chime of the quarterly notification in her head. The reward was there, coloring the experience. It wasn't that the reasons were fake; it's that the source of her attention was bought.

  Her name flashed. She stood up.

  Inside, Hale sat behind a glass desk. He looked tired. He had a tablet open, tracking her pupil dilation, her skin conductance, the micro-tremors in her voice.

  "Ms. Corin," Hale said. "Tell me about the update last month."

  "It improved the latency," Mara said. Her voice was steady.

  "And how did that make you feel?"

  "Relieved."

  "Relieved because?"

  "Because the lag was causing me headaches."

  "Is that why you value the Spark? Because it stops headaches?"

  Mara paused. This was the precipice. If she said yes, she was citing a feature. That was a solid ground. But if she said yes, was she saying it because it was true, or because she knew Hale wanted to hear about health benefits? The money was a shadow cast over the object. It didn't change the object—the headache relief was real—but it changed her relationship to it. She was looking at the Spark through the lens of the bonus.

  "I value it because it lets me work," Mara said.

  "Would you value it if the bonus didn't exist?"

  The question hung in the air. It was the trap. If she said yes, she might be lying to get the money. If she said no, she failed the sincerity check. But the truth was somewhere in the middle. She valued it *now* because she had been paid to look for value. She had cultivated the garden because she was promised the fruit, and now the flowers were blooming, but she couldn't remember if she liked flowers or just the fruit.

  "I don't know," Mara said.

  Hale's pen hovered over the tablet. "Uncertainty is a valid data point. Continue."

  "I use it every day. I notice when it's off. I miss it."

  "Because of the withdrawal, or because of the loss of function?"

  "Both."

  Hale nodded slowly. He wasn't looking for purity. He was looking for stability. He wanted to know if her attitude was anchored to the product or to the paycheck. But anchors can be heavy enough to hold even if the chain is rusted. Mara felt the tension in her chest. She could try to push the money away, to isolate the feeling of relief from the thought of rent. She could try to feel the relief *purely*. That was the direct route to sincerity—purifying the motive in the moment. Or she could accept that the money brought her here, and the product kept her here, and let the two stand together.

  Jory's way was cleaner. He separated the act from the belief. He sold the performance. Mara was trying to sell the belief itself, but she wasn't sure who was buying.

  "Thank you, Ms. Corin," Hale said. "We'll notify you of the assessment outcome on Friday."

  Mara stood up. She walked to the door. Her hand hovered over the handle. She felt the hum of the Spark behind her ear, a quiet, steady pressure. It felt like calm. It also felt like a transaction. She opened the door and stepped back into the ozone smell of the waiting room. She didn't know if she had passed. She didn't know if it mattered.

  ***

  **Note on the Text**

  The philosophical work occurs in the interview scene where Mara struggles to answer whether she values the Spark without the bonus, highlighting the impossibility of disentangling the genuine benefits (RKRs) from the incentive that motivated her engagement (WKRs). For this to become a merely prudential dilemma, the sincerity assessment would need to be replaced with a simple sales target or usage metric, removing the requirement that her internal attitude match the external behavior. In that revised setting, the story would concern only the efficiency of achieving the reward, rendering the source of her enthusiasm irrelevant to the outcome.
