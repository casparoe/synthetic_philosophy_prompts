      *   **Specific Wrinkle:** The "impure" cases where WKRs attach to an attitude that already has some genuine grounds (RKRs), making them tangled. Also, the distinction between the direct route (faking/manipulating the attitude directly for the reward) vs. the roundabout route (using WKRs to put oneself in the way of RKRs).
      *   **Format:** Short story, ~1,200 words.
      *   **Setting:** Near-future company town, employer runs a "sincerity bonus" scheme (quarterly payments for enthusiasm surviving an interview with a fallible assessor).
      *   **Protagonist:** One employee who needs the money, has some independent grounds for enthusiasm (but doesn't trust them), doesn't want to become a person who fakes it.
      *   **Plot Requirements:** Both direct and roundabout routes must be live options. At least one other character must take the direct route (succeed or fail) to show the cost. End without resolving the puzzle.
      *   **Constraints:** No philosophical jargon ("fitting", "warranted" in technical senses), no philosophers, no explaining the distinction explicitly. The distinction must be shown through action/consequence.
      *   **Appendix:** A note (3-4 sentences) identifying the scene doing the philosophical work and explaining what change would make it merely prudential.

  2.  **Deconstruct the Philosophical Problem for Narrative:**
      *   *Attitude:* Enthusiasm/Belief in the product (let's say, a neural interface or habitat module).
      *   *RKR (Right Kind):* The product actually works, helps people, is beautiful.
      *   *WKR (Wrong Kind):* The bonus money, keeping the job, avoiding shame.
      *   *The Conflict:* The protagonist wants the money (WKR) but wants the enthusiasm to be real (RKR-based). She fears becoming someone who believes things just because she's paid to.
      *   *The "Impure" Case:* She actually likes *some* aspects of the product, but is unsure if that's enough or if she's just convincing herself because of the money.
      *   *Direct Route:* Trying to psych oneself up purely for the check (self-deception).
