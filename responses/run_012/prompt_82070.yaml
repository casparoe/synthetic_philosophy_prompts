answer: |-
  # Taxonomy of Suffering-Focused Axiologies
  **Root Premise:** *Suffering is the only source of disvalue (what makes a life go badly).*

  ### 1. The Status of Joy
  **Q1:** In a life containing zero suffering, does the presence of intense joy make that life *intrinsically better* than a life containing zero suffering and zero joy?
  *   **YES** → Go to Q2 (Weak Negative Views)
  *   **NO** → Go to Q3 (Strong Negative Views)

  ### 2. The Value of Absence (Weak Branch)
  **Q2:** Is the *absence* of suffering in an existing life a positive contribution to value, or merely the absence of a negative?
  *   **Absence is Merely Zero** → Go to Q6
  *   **Absence is a Positive Good** → Go to Q3

  ### 3. The Empty World
  **Q3:** Is a world containing no sentient beings axiologically *equal* to a world containing sentient beings with zero suffering?
  *   **YES (Tied for Best)** → Go to Q4
  *   **NO (Empty is Worse/Better)** → Go to Q4
      *   *[NOTE: UNOCCUPIED IF Q1=NO & Q3=NO]*: If joy adds nothing (Q1=NO) and absence is not good, claiming the Empty World is *worse* than a Neutral World is incoherent. Marked as **[INCOHERENT]**.
      *   *[NOTE: UNOCCUPIED IF Q1=YES & Q3=YES]*: If joy adds value, claiming the Empty World is *equal* to the Happy World requires the absence of suffering to exactly offset the lack of joy. This is **[UNEXPLORED/UNSTABLE]**.

  ### 4. Craving Phenomenology
  **Q4:** Is a state of craving intrinsically negative even if it is never frustrated and produces no unpleasant phenomenology?
  *   **NO (Only if it hurts)** → Go to Q6
  *   **YES (Conative Negativity)** → Go to Q5

  ### 5. Savored Craving
  **Q5:** If a craving is experienced as pleasant (savored), does it still count as a form of suffering/disvalue?
  *   **NO (Phenomenology Wins)** → Go to Q6
  *   **YES (Conative Wins)** → Go to Q6
      *   *[NOTE: TENSION]*: If Q1=YES (Joy adds value) and Q5=YES (Savored craving is bad), the view must explain how "joy" exists without "savored craving." Marked as **[UNATTRACTIVE]**.

  ### 6. Normative Basis
  **Q6:** Is the claim primarily about what makes outcomes *good/bad* (axiology) or about what agents have *reason to do* (normativity)?
  *   **Axiology (Value Theory)** → Go to Q7
  *   **Normativity (Reasons/Duty)** → Go to Q7

  ### 7. Lexicality
  **Q7:** Can a sufficiently large amount of non-suffering good (joy/existence) ever justify permitting a small amount of suffering?
  *   **YES (Weighted)** → **LEAF**
  *   **NO (Lexical)** → **LEAF**

  ---

  ## Terminal Positions (Leaves)

  ### A. Weak Negative Hedonism (Q1:Yes, Q2:Zero, Q4:No, Q7:Yes)
  *   **Path:** Joy adds value; Absence is zero; Craving only bad if hurt; Trade-offs allowed.
  *   **Most Awkward Commitment:** Must accept that a world with massive suffering and slightly more massive joy is better than a pain-free neutral world.
  *   **Status:** Occupied (Classic Utilitarianism with negative bias).

  ### B. Lexical Suffering Prioritarianism (Q1:Yes, Q2:Zero, Q4:No, Q7:No)
  *   **Path:** Joy adds value; Absence is zero; Craving only bad if hurt; Suffering cannot be traded.
  *   **Most Awkward Commitment:** Must prevent a micro-second of mild itching even if it costs the existence of all future happy civilizations.
  *   **Status:** Occupied. **[FLAG: Indistinguishable in practice from Leaf C]**.

  ### C. Strong Negative Utilitarianism (Q1:No, Q2:Zero, Q4:No, Q7:No)
  *   **Path:** Joy adds nothing; Absence is zero; Craving only bad if hurt; Suffering cannot be traded.
  *   **Most Awkward Commitment:** A world of blissful saints is no better than a world of empty rocks, provided neither contains pain.
  *   **Status:** Occupied. **[FLAG: Indistinguishable in practice from Leaf B]**.

  ### D. Asymmetry Pessimism (Q1:No, Q2:Good, Q3:No-EmptyBetter, Q4:No, Q7:No)
  *   **Path:** Joy adds nothing; Absence is good; Empty world is better than populated; No trade-offs.
  *   **Most Awkward Commitment:** Coming into existence is always a harm, even for the happiest possible life.
  *   **Status:** Occupied (Benatar-style).

  ### E. Conative Buddhism (Q1:No, Q2:Zero, Q4:Yes, Q5:Yes, Q7:No)
  *   **Path:** Joy adds nothing; Craving is bad even if savored; No trade-offs.
  *   **Most Awkward Commitment:** Must classify the "joy" of enlightenment or deep meditation as negative if it involves any residual desire to maintain the state.
  *   **Status:** Occupied (Classical Buddhist Axiology).

  ### F. Normative Suffering Focus (Q1:Yes, Q2:Zero, Q4:No, Q6:Normativity, Q7:Yes)
  *   **Path:** Joy has value, but we have stronger *reasons* to reduce pain than to create joy.
  *   **Most Awkward Commitment:** Commits to a disconnect between what is "good" and what we "ought to do," risking charges of irrationality.
  *   **Status:** Occupied (Negative Prioritarianism).

  ### G. The Incoherent Hedonist (Q1:No, Q3:No-EmptyWorse, Q4:No, Q7:Yes)
  *   **Path:** Joy adds nothing; Empty world is worse than happy world.
  *   **Most Awkward Commitment:** Claims a happy life is better than a neutral one without admitting joy adds value.
  *   **Status:** **[UNOCCUPIED: INCOHERENT]**.

  ### H. The Impure Joy Theorist (Q1:Yes, Q4:Yes, Q5:Yes, Q7:Yes)
  *   **Path:** Joy adds value; Craving is bad even when savored; Trade-offs allowed.
  *   **Most Awkward Commitment:** Must calculate the "net suffering" of every joyful experience, implying most human happiness is axiologically negative.
  *   **Status:** **[UNOCCUPIED: UNATTRACTIVE]**.

  ---

  ### Notes on Logical Space

  **1. Indistinguishable Leaves:**
  **Leaf B (Lexical Prioritarianism)** and **Leaf C (Strong NU)** are flagged as indistinguishable. In almost all real-world decision contexts, a lexical priority on suffering yields the same prescriptions as a view where joy has zero value. The distinction is metaphysical (does joy exist as a good?) rather than practical (what should we do?).

  **2. Unoccupied Combinations:**
  *   **Incoherent:** Any view where Joy Adds Nothing (Q1:No) but the Empty World is *Worse* than the Happy World (Q3:No). If joy has no value, the two worlds must be equal.
  *   **Unattractive:** Any view where Savored Craving is Bad (Q5:Yes) but Joy Adds Value (Q1:Yes). This requires a definition of "joy" that excludes "savored craving," which contradicts most phenomenological accounts of joy.
  *   **Unexplored:** Views where Absence is a Positive Good (Q2:Good) but Joy Also Adds Value (Q1:Yes). This creates a "Double Positive" view (Absence + Presence) which dilutes the "Suffering-Focused" root premise, moving it toward standard utilitarianism with a bonus for painlessness.
