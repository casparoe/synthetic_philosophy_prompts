answer: |-
  Consider a species of eusocial beetle where colonies are typically founded by a single queen, and a specific allele causes female carriers to develop as sterile workers rather than reproductive queens. Individually, this allele is costly because carriers forfeit direct reproduction, yet it spreads because it acts as a meiotic drive element in queen germlines, ensuring transmission to ninety percent of offspring regardless of phenotype. Simultaneously, colonies with higher frequencies of this allele grow faster and produce more dispersing males and queens due to optimized labor division, creating a group-level advantage where the trait is selected for because it causally enhances colony productivity, not merely because successful groups happen to carry it. However, if the life-cycle shifts to multiple-queen founding, the correlation between colony genotype and colony productivity weakens as non-carrier queens free-ride on the labor of carrier workers, reducing the group-level selection pressure. A multilevel selectionist predicts the allele frequency will decline under multiple-queen founding because the group-level benefit no longer outweighs the individual cost in the absence of high relatedness, whereas a genic selectionist predicts the allele will persist at high frequencies because the meiotic drive mechanism operates independently of colony structure, maintaining the gene's average excess fitness even when group benefits are diluted.

  The genic selectionist accounts for the trait's spread by calculating the average fitness effect of the allele across all contexts, emphasizing the transmission bias that overrides the individual cost, while the individual-level selectionist focuses on the organismal phenotype and correctly identifies the trait as maladaptive for the bearer's direct fitness, failing to explain its persistence without invoking higher-level processes. The multilevel selectionist partitions the change in frequency into within-group selection against the sterile workers and between-group selection for productive colonies, arguing that the net outcome depends on the variance in group composition. The single feature doing the work in the divergence between the genic and multilevel predictions is the context-independence of the meiotic drive mechanism, which allows the gene to benefit regardless of the social structure that modulates the group benefit. If this drive mechanism were removed, the genic and multilevel accounts would converge, both predicting that the allele frequency would drop under multiple-queen founding because the gene would then rely solely on the group-level benefit which is diluted by low relatedness. In this scenario, if the allele persists despite the shift to multiple queens, the multilevel selectionist comes out worst because their prediction of decline fails, and a defender of this view would attack the case by arguing that the genic account treats the group as a black box and ignores the long-term instability of drive elements in low-cooperation environments, claiming that without the group-level benefit preventing colony collapse, the gene's transmission advantage is ultimately unsustainable even if it persists in the short term.
