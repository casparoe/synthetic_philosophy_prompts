  3. Your detachment is ahistorical because Tolstoy's theory is bound to his theology. I am treating the theory as a philosophical resource rather than engaging in strict exegesis of Tolstoy's intent. This invites the charge of straw-manning the original text.

  4. How do we verify the feeling was lived through if we only have the external signs? I claim the coherence of the signs themselves reveals the lived experience without access to the artist's mind. This risks circularity between the signs and the feeling they signify.

  5. If your theory cannot account for the value of Shakespeare without relying on a religious constraint you explicitly reject, what work is left for Tolstoy to do?
