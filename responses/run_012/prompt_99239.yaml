      *   **Key Neurathian Concepts to Incorporate:**
          *   Picture language as a genuine language with strict grammar (not decoration).
          *   Physicalism: Only observable, spatiotemporal states of affairs can be depicted directly. Abstract/theoretical entities need auxiliary signs.
          *   Learning Curve: "Self-evidence" is a myth; the language must be learned.
          *   Tension between universality and convention.
      *   **Deliverable:** An ordered sequence of questions (a procedure) based on Neurath's actual theory.
      *   **Requirements for Procedure:**
