      *   *Final line format:* "Verdict: ..."

  8.  **Self-Correction/Nuance Check:**
      *   *Correction:* Make sure I don't say Neurath hated words. He didn't. He wanted to minimize them for international understanding, but he knew captions were needed. The prompt says "word-free visual system," so I must test if Neurath's method supports *word-free*. His method supports *word-minimal*, but strict physicalism makes "probability" word-free depiction nearly impossible.
      *   *Nuance:* Neurath's "Physicalism" means "observable." A "household" is observable. "Poverty" is not (it's a definition). "Causation" is not (it's a logical link). "Probability" is not (it's a mathematical property).
      *   *Case 3:* This is the crux. Isotype is terrible at error bars. Neurath knew this. He focused on "social facts" presented as solid. Admitting uncertainty visually was not Isotype's strength. I need to be honest that this procedure will likely reject Case 3 for pictures.

  9.  **Final Polish:** Check tone. Professional, analytical, respectful of Neurath but critical of the "magic bullet" interpretation. Ensure the distinction between "decoration" and "grammar" is clear.

