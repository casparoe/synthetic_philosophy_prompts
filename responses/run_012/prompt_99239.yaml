      *   **Critical Analysis:** Explicitly state where Neurath's framework fails/limits, whether it's a defect of his program or pictures in general.
      *   **Conclusion:** What the procedure cannot do, where readers will be misled.
      *   **Final Line:** "Verdict: [One sentence naming the single part of a claim that can never be safely pictured]."

  2.  **Deconstruct Neurath's Philosophy (Isotype/Physicalism):**
      *   *Physicalism:* Neurath was a logical positivist. Meaning is tied to physical observation. If you can't point to it in space-time, it's not directly depictable.
      *   *Isotype (International System of TYpographic Picture Education):* It's not art; it's a transformation process. The "transformer" (designer) converts statistics into pictures.
      *   *Repetition vs. Scaling:* Neurath preferred repeating icons (1 icon = 1,000 households) rather than scaling one icon (a big house = 5,000 households) because area estimation is cognitively difficult.
      *   *Abstraction:* You can't picture "causality" or "probability" directly. You picture the *events* and use syntactic markers (arrows, color, layout) to imply relations, but these markers must be learned.
      *   *The "Human" Element:* Neurath acknowledged that pictures aren't self-explanatory. They require education. The claim of "universality" is an aspiration, not a starting state.

  3.  **Drafting the Procedure (The Neurath Filter):**
      *   *Step 1: Physicality Check.* Can the subject be pointed to in space-time? (Neurath's Physicalism).
      *   *Step 2: Countability.* Is it a discrete quantity? (Isotype relies on units).
      *   *Step 3: Relation Type.* Is the relation spatial/temporal or abstract (causal/probabilistic)?
      *   *Step 4: Convention Check.* Do we have an established sign for this abstract concept? (Acknowledging the learning requirement).
      *   *Step 5: Complexity/Uncertainty.* Does the claim rely on overlapping distributions or modal qualifiers (probably)?
      *   *Decision Nodes:* Pass to Design, Pass to Text, Pass to Director.

  4.  **Running the Cases:**

      *   *Case 1: Households without power.*
          *   Physical? Yes (houses, lights out).
          *   Countable? Yes (fraction).
          *   Relation? Simple proportion.
          *   *Outcome:* Depictable via Isotype (repeated house icons, shaded for "no power").
          *   *Caveat:* Needs a legend (learning).

      *   *Case 2: Fee caused drop.*
          *   Physical? Fee (document/transaction), Drop (graph/numbers).
          *   Relation? Causality.
          *   *Neurath View:* Causality is not observable. It's a theoretical construct. You can show sequence (fee introduced -> applications dropped), but "caused" is an interpretation.
          *   *Outcome:* Borderline. Can show correlation/sequence, but "caused" requires text or a specific convention (arrow) that implies causality, which risks misleading. Director decision on whether "sequence" implies "cause" to the public.

      *   *Case 3: Gap narrowed, estimates overlap (Uncertainty).*
          *   Physical? Regions (yes), Gap (abstract comparison), Narrowed (change in abstract comparison), Overlap (statistical property).
          *   *Neurath View:* Probability and overlapping confidence intervals are *not* physical facts. They are meta-statements about the data. Isotype struggles here.
          *   *Outcome:* Fail. This requires text. Pictures imply certainty (an icon *is* there). Showing "maybe" visually is extremely hard without introducing complex charts that defeat the "word-free" goal.
          *   *Limit:* This is a general limit of static imagery regarding modality (possibility/necessity).

  5.  **Refining the Analysis (The "Skeptic's" Voice):**
      *   Need to ensure I don't just praise Neurath but highlight the tensions he acknowledged (learning vs. self-evidence).
      *   Need to address the "word-free" constraint. Neurath actually used captions often. A strictly word-free Isotype is harder than Neurath intended.
      *   The prompt asks to identify where the procedure returns a firm instruction vs. editorial values.

  6.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the colleague's reference but ground it in Neurath's *Transformation* process.
      *   *The Procedure:* 5 Steps.
          *   Q1: Spatiotemporal location? (Physicalism).
          *   Q2: Discrete units? (Isotype method).
          *   Q3: Observable relation? (Causality check).
          *   Q4: Established convention? (Learning check).
          *   Q5: Modal status? (Certainty vs. Probability).
      *   *The Cases:* Apply the steps rigorously.
          *   Case 1: Passes.
          *   Case 2: Fails Q3 (Causality). Director decision.
          *   Case 3: Fails Q5 (Probability/Overlap). Must stay in words.
      *   *The Limits:* Discuss "Modality" and "Abstraction." Pictures show *what is*, not *what might be* or *why*.
      *   *Misleading Aspects:* Reification (turning stats into things), False Precision (icons look exact), Implicit Causality (sequence looks like cause).
      *   *Final Verdict:* Needs to be punchy and accurate to the prompt's requirement.

  7.  **Review against Constraints:**
      *   *Ordered sequence of questions?* Yes.
