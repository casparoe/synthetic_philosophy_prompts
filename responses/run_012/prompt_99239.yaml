answer: |-
  ### The Neurath Transformation Procedure

  To honor Otto Neurath's actual philosophy rather than the myth of the "universal picture," your team must adopt his method of **Transformation**. Neurath did not believe pictures were self-evident; he believed they were a language that required a strict grammar and a period of learning. He was a physicalist: he held that meaningful statements must refer to observable, spatiotemporal events. Anything else is metaphysics or theory, which pictures cannot directly show without becoming misleading.

  Use the following five-step interrogation for every headline claim. Do not proceed to design until the claim passes through the filter.

  **Step 1: The Physicalism Check**
  *   **Question:** Can every noun in this claim be pointed to in space and time by an observer?
  *   **Sufficient Answer:** Yes, if the referent is a physical object or a directly observable event (e.g., "a house," "a person," "a light going out"). No, if the referent is an abstract construct (e.g., "the economy," "poverty," "inflation," "application").
  *   **Instruction:** If **No**, the claim must be rephrased to refer to the physical proxies (e.g., "money changing hands" instead of "inflation"). If it cannot be rephrased physically, it **must stay in words**.
  *   **Editorial Handoff:** If the physical proxy is too complex to depict simply (e.g., "a tax form"), hand to the **Director** to decide if the concept is essential enough to warrant a new convention.

  **Step 2: The Discreteness Check**
  *   **Question:** Can the quantity be represented as a repetition of identical units rather than a scaling of size?
  *   **Sufficient Answer:** Yes, if the data can be rounded to a common unit (e.g., 1 icon = 1,000 households). No, if the precision requires continuous scaling (e.g., 1.37 households) or if the total is too vast for repetition.
  *   **Instruction:** If **Yes**, use Isotype repetition (row of icons). If **No**, do not use Isotype; use a chart or **stay in words**. Neurath forbade scaling icons (making one house five times bigger) because the human eye cannot calculate area accurately.
  *   **Editorial Handoff:** If rounding the data to fit the unit system distorts the headline meaning significantly, hand to the **Director**.

  **Step 3: The Relation Check**
  *   **Question:** Is the relationship between the depicted items observable (spatial/temporal sequence) or theoretical (causal/logical)?
  *   **Sufficient Answer:** Observable = "A is next to B" or "A happened before B." Theoretical = "A made B happen" or "A is larger than B in value."
  *   **Instruction:** If **Observable**, depict the sequence or arrangement. If **Theoretical**, you cannot depict the link directly. You must use an auxiliary sign (like an arrow), but this sign is a convention, not a picture.
  *   **Editorial Handoff:** If the claim asserts causality ("caused," "led to"), hand to the **Director**. Neurath's physicalism dictates you can only show correlation/sequence. Asserting cause visually is a value judgment, not a picture.

  **Step 4: The Convention Check**
  *   **Question:** Do we possess an established, learned sign for any auxiliary concepts required (arrows, colors, shading)?
  *   **Sufficient Answer:** Yes, if the audience has been exposed to the legend (e.g., red = danger/loss, arrow = direction/change). No, if this is the first exposure.
  *   **Instruction:** If **No**, the image is not word-free; it requires a caption to teach the sign. If you cannot provide a caption, **stay in words**.
  *   **Editorial Handoff:** Deciding which conventions to impose on the public (e.g., "does a downward arrow mean 'less' or 'bad'?") is a cultural value. Hand to the **Director**.

  **Step 5: The Epistemic Check**
  *   **Question:** Does the claim assert a fact or a probability/uncertainty?
  *   **Sufficient Answer:** Fact = "X happened." Probability = "X probably happened," "X is estimated at," "The gap likely narrowed."
  *   **Instruction:** If **Fact**, proceed to depiction. If **Probability/Uncertainty**, **stay in words**. Pictures assert existence; an icon on a page *is* there. Depicting "maybe" requires breaking the grammar of the picture language.
  *   **Editorial Handoff:** If the uncertainty is legally required but the Director insists on visualization, hand to **Director** with a warning that the image will inherently lie about precision.

  ***

  ### Case Runs

  #### Case 1: Simple Quantity
  *Claim:* "One-quarter of households lost power for more than a day last winter."

  1.  **Physicalism:** "Households" (physical dwellings), "Power lost" (observable state: lights out/heating off). **Pass.**
  2.  **Discreteness:** Can represent 1 icon = 100 households. 25% is easily shown as 1 shaded icon out of 4. **Pass.**
  3.  **Relation:** Proportion is spatial (part of a whole). **Pass.**
  4.  **Convention:** Shading usually implies "affected/negative." Requires legend. **Pass with Legend.**
  5.  **Epistemic:** Treated as a recorded fact. **Pass.**

  **Result:** **Depict.** Use four house icons, one shaded dark.
  **Neurathian Note:** This is the ideal Isotype use case. However, remember that the public must learn that "one house icon" does not mean *one* house, but a unit of 1,000. Without that learning, the scale is misunderstood.

  #### Case 2: Causal Claim
  *Claim:* "The newly introduced fee caused a drop in applications."

  1.  **Physicalism:** "Fee" (document/transaction), "Applications" (forms). **Pass** (with proxies).
  2.  **Discreteness:** Counts of forms. **Pass.**
  3.  **Relation:** "Caused." Causality is not observable; only sequence is. We see Fee, then we see Drop. We do not see the "force" connecting them. **Fail.**
  4.  **Convention:** An arrow could imply influence, but arrows are learned signs, not pictures of force. **Warning.**
  5.  **Epistemic:** Asserted as fact. **Pass.**

  **Result:** **Director Decision.**
  **Reasoning:** Under Neurath's physicalism, you cannot picture "cause." You can only picture "Fee introduced" followed by "Applications decreased." To add an arrow implying *causation* is to add a theoretical interpretation.
  **Instruction:** You may depict the sequence (Time 1: Fee Icon + High Stack of Forms; Time 2: Fee Icon + Low Stack of Forms). You may not visually encode the word "caused" without risking the viewer mistaking correlation for mechanism. The Director must decide if showing the sequence is ethically permissible when it implies the cause.

  #### Case 3: Uncertainty and Comparison
  *Claim:* "The gap between two regions probably narrowed, even though the estimates overlap."

  1.  **Physicalism:** "Regions" (maps/locations). "Gap" (abstract difference in values). "Overlap" (statistical property of distributions). **Fail.** "Gap" and "Overlap" are not physical objects; they are mathematical relations between estimates.
  2.  **Discreteness:** Estimates are continuous ranges, not discrete units. **Fail.**
  3.  **Relation:** "Narrowed" is a comparison of abstract differences. **Fail.**
  4.  **Convention:** Error bars or shaded bands are technical conventions, not universal pictures. **Fail.**
  5.  **Epistemic:** "Probably," "Estimates." This is the core of the claim. **Fail.**

  **Result:** **Must Stay in Words.**
  **Reasoning:** This is the case you feared. Neurath's system collapses here. Isotype is designed to make statistics look like *facts* (solid, countable things). To depict "overlap" or "probability" visually, you must introduce chart elements (error bars, confidence intervals) that violate the "word-free picture" grammar. If you draw two bars of different heights, you assert a fact of difference. If you draw them with fuzzy edges to imply uncertainty, you violate the rule of clear units.
  **Instruction:** Do not attempt to visualize this claim without text. Any picture will assert a certainty that the data does not possess.

  ***

  ### Limits and Inevitable Misleading

  **Where Neurath's Framework Reaches Its Limit**
  The procedure fails on Case 3 not merely because of Neurath's specific 1930s physicalism, but because of a general limit of static imagery: **Pictures assert existence; language asserts modality.** An icon on a page is present. It is difficult to draw a "possible" icon that does not look like a "real" icon. Neurath's program was built to educate the working class on *social facts* (housing counts, unemployment numbers) to empower political action. It was not built to communicate *statistical nuance*.

  **Is this a defect of Neurath or Pictures?**
  It is a defect of Neurath's *Physicalism* specifically, but a general fact of *Pictures*. Neurath believed that if you stuck to observable facts, you avoided metaphysics. But modern statistics *is* largely about the unobservable (means, distributions, probabilities). By forcing statistics into a "physicalist" picture language, you strip them of their uncertainty.
  *   **Neurath's Defect:** He assumed social statistics could be treated like inventory counts.
  *   **Picture's Defect:** Images are ontologically heavy. They show *what is*. They struggle to show *what we think might be*.

  **Where the Reader Will Be Misled**
  No matter how carefully you design:
  1.  **Reification:** The reader will treat the icons as the reality, not a model. They will think there are literally little houses on the page, not a representation of data.
  2.  **False Precision:** Because the icons are crisp and distinct, the reader will assume the underlying number is exact, not an estimate.
  3.  **Implicit Causality:** If you place Image A next to Image B, the reader will infer A caused B. Neurath knew this but hoped education would cure it. In a headline context, education is absent.

  **What the Procedure Cannot Do**
  This procedure cannot validate any claim that relies on *epistemic qualification* (confidence, probability, significance) or *theoretical linkage* (causality, correlation). It can only validate simple counts of observable objects. If your office's headline claims are mostly about trends, causes, or uncertainties, this procedure will reject most of them for visualization.

  Verdict: The epistemic qualification of a claim (its degree of certainty or probability) can never be safely pictured.
