answer: |-
  I understand the frustration you and your friend are experiencing, primarily because the standard examples in the literature tend to collapse into debates about vagueness or luck rather than isolating the specific epistemic mechanism at stake. Your friend's position relies on a conflation of reliability with safety, assuming that if a belief is formed by a reliable process and is self-intimating, it must constitute knowledge. I believe you are right to resist this, and I think we can construct a case that satisfies your constraints without resorting to the usual sorites sequences or skeptical scenarios. The key is to separate the actual-world reliability of the mechanism from the modal robustness required for knowledge, specifically targeting the safety condition.

  Consider a scenario involving a nurse in a neonatal intensive care unit monitoring an infant's oxygen saturation levels. The condition in question is substantial and sharp: the infant's blood oxygen level is below 90 percent. This is not a vague borderline case; the monitor displays a digital integer, and the medical threshold is defined precisely at that integer. The nurse is watching the monitor continuously. The belief-forming mechanism is visual perception of the digital display combined with the reliable functioning of the pulse oximeter. We stipulate that the mechanism is self-intimating in the sense that whenever the oxygen level is below 90 percent, the monitor registers this accurately, the alarm sounds, the nurse hears it, looks at the screen, and inevitably believes that the level is below 90 percent. There is no failure of attention or introspection here; the physiological and mechanical link guarantees that if the condition obtains, the belief is formed. Furthermore, the mechanism is reliable. In the actual world, the machine is calibrated correctly, the nurse's vision is perfect, and false readings are statistically negligible.

  However, despite the condition obtaining, the belief being true, the mechanism being reliable, and the belief being self-intimating, the nurse is not in a position to know that the condition obtains. The reason lies in a specific structural feature of the equipment known to the hospital administration but not to the nurse. This specific model of oximeter has a known susceptibility to electromagnetic interference from a specific type of surgical cautery tool used in the adjacent operating theater. When that tool is active, the oximeter can display a reading below 90 percent even when the infant's oxygen is normal. In the actual case, the tool is not being used, the reading is accurate, and the infant is indeed hypoxic. However, the use of the cautery tool in the adjacent theater is a frequent and nearby possibility. It is part of the normal routine of the hospital. In a nearby possible world, identical in all relevant respects except that the surgeon in the next room begins using the tool at that moment, the nurse would form the exact same belief based on the exact same visual experience, but the belief would be false.

  This shortfall is not due to the nurse's carelessness, irrationality, or self-deception, nor is it a case of fake barns where the environment is actually filled with deceptive duplicates. The actual environment is veridical. The failure is purely modal. The requirement on knowledge that is doing the work here is safety. A belief is safe if and only if in nearby possible worlds where the agent forms the belief in the same way, the belief is not false. In this case, the nurse's belief is unsafe because there is a nearby world where the interference occurs, the monitor displays the same number, the nurse forms the same belief, but the infant's oxygen is normal. Because knowledge requires safety, and the belief is unsafe, the nurse does not know the condition obtains. Consequently, the condition is not luminous. The nurse is in a state where the condition obtains and she believes it, yet she is not in a position to know it because her epistemic position is too fragile; she cannot distinguish the actual veridical state from the nearby deceptive state.

  If we remove the safety requirement from our theory of knowledge, the case collapses into a simple reliabilist account where the nurse would count as knowing. However, without safety, we lose the ability to explain why Gettier cases fail to be knowledge, as Gettier cases are essentially cases of unsafe true belief. If you accept that Gettier cases are not knowledge, you must accept safety or a similar modal condition. Therefore, removing safety does not return us to ordinary fallibility or a failure of the KK principle; it returns us to a theory of knowledge that is demonstrably too permissive. Regarding the KK principle, this case implies that KK fails, but for a specific reason. If the nurse does not know the oxygen is low, she cannot know that she knows. But even if we adjusted the case so that she did know (perhaps by shielding the room from interference), the mechanism that blocks knowledge here—the possibility of indistinguishable error—would also block higher-order knowledge. If her first-order belief is only barely safe, her belief about that belief will be less safe, as it compounds the modal risk. Thus, the same mechanism that prevents luminosity here can be extended to show that one can know without knowing that one knows, because the margin for error required for first-order knowledge is smaller than that required for second-order knowledge.

  Your friend, however, has a strong objection available to him. He could argue that the concept of "position to know" is internalist. He might claim that being in a position to know depends only on the evidence accessible to the agent, not on external modal facts about electromagnetic interference in nearby worlds. From his perspective, the nurse has excellent evidence: a reliable machine, her own eyes, and no internal reason to doubt. If "position to know" means "has sufficient internal justification," then the external safety failure is irrelevant to whether she is in a position to know, even if it prevents her from actually knowing. He could argue that you have rigged the case by using an externalist definition of "position to know" to prove an externalist point, which begs the question against an internalist conception of luminosity. He might further argue that if the mechanism is truly reliable in the actual world, the nearby worlds where it fails are not relevantly similar enough to undermine the actual knowledge claim, effectively arguing for a version of reliabilism that prioritizes actual-world truth-tracking over modal robustness. He could say that by focusing on a rare glitch in a nearby world, you are introducing a form of skepticism that would deny knowledge in almost all ordinary cases, since almost all our belief-forming mechanisms have some nearby possible world where they fail.

  Does this objection succeed? I do not think it does, because it misconstrues the standard epistemological usage of "luminosity." In the context of Williamson and contemporary epistemology, luminosity is about the intersection of mind and world, and it is generally accepted that knowledge is factive and requires more than just internal justification. If the nurse's belief could easily have been wrong, she lacks the cognitive grip on the fact required for knowledge, regardless of her internal confidence. The friend's objection succeeds only if we redefine knowledge to ignore modal risk, but doing so leaves us unable to solve the Gettier problem. Furthermore, the constraint that the case must not rely on vagueness is met here because the threshold is digital and sharp; the failure is not due to a blurry line between 89 and 90, but due to the external risk of interference. Therefore, the case stands. You are right. A condition can be self-intimating and reliably believed without being luminous, because reliability in the actual world does not guarantee the safety required for knowledge. The gap between self-intimation and luminosity is filled by the modal fragility of the belief, and no amount of internal assurance can bridge that gap if the world could easily have been otherwise.
