      *   *Fact 2:* If ZF is consistent, it has a countable model $M$ (Downward Löwenheim-Skolem).
      *   *The Tension:* $M \models \text{"}X \text{ is uncountable"}$, but $|M| = \aleph_0$ (externally), so $X^M$ is externally countable.
      *   *Resolution (Standard):* The bijection $f: \omega \to X^M$ exists in the metatheory (or a larger model) but is not *in* $M$. "Uncountable" means "no bijection exists *in the model*."

