      *   *Weaknesses:* Jumps from "axioms don't fix interpretation" to "no fact of the matter" or "maths is just symbols." This is a philosophical leap (Skolem's Paradox $\neq$ Anti-realism). Confuses *expressibility* in FO logic with *ontological status*.

