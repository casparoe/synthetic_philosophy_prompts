answer: |-
  This is a high-risk, high-reward agenda. The FARG tradition is philosophically rich but scientifically fragile; it risks becoming a "beautiful museum piece" if it cannot demonstrate empirical superiority or scalability over modern alternatives. With 1.5 person-years of protected time and modern compute, you have enough runway to move the needle, but not enough to rebuild the engine from scratch. You must be surgical.

  Here is a defended agenda, prioritized by dependency. I have reordered your list because scientific validity (evaluation) and existential relevance (LLMs) are upstream of architectural refinement (learning/domains). If the model cannot be validated against humans or distinguished from a transformer, learning and domain expansion are engineering exercises, not scientific contributions.

  ### 1. The Redundancy Question: Where does the Architecture Win Against LLMs?
  **Priority:** First (Existential)
  **Why Upstream:** If a fine-tuned LLM can solve the same analogy tasks with higher accuracy and zero architectural complexity, the cognitive claim of the Copycat architecture is severely weakened. You do not need to prove LLMs *can't* do analogy; you need to prove they do it *differently* in a way that matters for cognitive modeling. LLMs are statistical completers; Copycat is a structural mapper. The gap lies in **systematic generalization under distributional shift**.
  **Tractability:** High. You have the compute and the models.
  **Neglect:** High. Most FARG successors ignore LLMs; most LLM researchers ignore FARG.
  **Concrete 1-Year Result:** A curated "Adversarial Analogy Benchmark." This should not be standard `abc:abd :: ijk:?` problems (LLMs solve these trivially). It must be a set of problems where the statistical prior conflicts with the structural rule.
  *   *Example:* Create a microworld where the most statistically likely completion is structurally wrong, and the "human" answer requires a slippage that violates n-gram probability.
  *   *Success Metric:* Your architecture solves the adversarial set; a zero-shot or few-shot LLM fails or requires unreasonable prompting. This defines your niche.

  ### 2. The Validation Question: How Do We Measure "Human-Like" Slippage?
  **Priority:** Second (Scientific Validity)
  **Why Upstream:** You noted the complaint: "success is judged by a handful of hand-graded examples." This is the single biggest barrier to publication in top cognitive science venues. You cannot claim a cognitive model without cognitive data. You need to move from "Does it output the right string?" to "Does it struggle the way humans struggle?"
  **Tractability:** Medium. Requires IRB and platform costs (Prolific/MTurk), but manageable for a small group.
  **Neglect:** Critical. Most computational analogy work skips behavioral alignment.
  **Concrete 1-Year Result:** A behavioral dataset of reaction times and error distributions on your Adversarial Benchmark.
  *   *Method:* Run human subjects on the problems from Question 1. Record not just the answer, but the time taken and the "garden path" errors (e.g., do they try `ijd` before `ijl`?).
  *   *Success Metric:* Your model's "temperature curve" and "codelet competition history" correlate with human reaction times and error rates. If the model converges quickly on a problem humans find hard, your temperature mechanism is wrong. This data becomes the loss landscape for Question 3.

  ### 3. The Learning Question: Can the Slipnet Plasticize Without Collapsing?
  **Priority:** Third (Architectural Viability)
  **Why Upstream:** Hand-built slipnets are the "clockwork orchid" critique incarnate. However, replacing the slipnet with standard neural embeddings (e.g., Word2Vec or BERT vectors) defeats the purpose; it turns the model into a neural net with extra steps. The challenge is to learn the *relations* (link weights) between concepts without losing the symbolic interpretability of the nodes.
  **Tractability:** Hard. This is your PhD students' core technical contribution.
  **Neglect:** High. Most "neural-symbolic" work focuses on the symbols, not the dynamic topology of the concept space.
  **Concrete 1-Year Result:** A "Plastic Slipnet" that adapts link weights via reinforcement learning based on the behavioral data from Question 2.
  *   *Method:* Keep the codelets and nodes fixed (to preserve the "search" thesis). Allow the *distances* in the slipnet (probability of slippage between 'successor' and 'predecessor', etc.) to be trainable parameters. Train them not to maximize accuracy, but to minimize the divergence between the model's search trajectory and the human behavioral data.
  *   *Success Metric:* The system solves problems it was not explicitly coded for, by adjusting slippage probabilities, without degrading into a black box. You must be able to inspect the slipnet post-training and say, "The concept of 'sameness' moved closer to 'identity'."

  ### 4. The Mechanism Question: Is Parallel Search the Active Ingredient?
  **Priority:** Fourth (Theoretical Isolation)
  **Why Upstream:** You asked whether slippage is explained by parallel search or "something else." This is an ablation question. It is downstream of Validation because you need a valid metric to ablate against.
  **Tractability:** Medium. Requires building variant architectures.
  **Neglect:** Medium. Often assumed rather than tested.
  **Concrete 1-Year Result:** An ablation study comparing the full Codelet/Temp architecture against a greedy, deterministic search over the same learned Slipnet.
  *   *Method:* Run the Plastic Slipnet (from Q3) with the temperature fixed at zero (greedy) and the codelet queue serialized.
  *   *Success Metric:* If the greedy version performs as well on the Adversarial Benchmark, the "parallel terraced scan" is unnecessary complexity for the task. If the greedy version fails to recover from garden paths (matching human error recovery), you have proven the computational necessity of the FARG search mechanism.

  ### Pushback on Your Framing

  **1. The Domain Question (Letters vs. Richer Worlds)**
  You asked whether to trade letter strings for a richer domain. **Do not change the domain in Year 1.**
  *   *Reasoning:* Porting the architecture to visual Bongard problems or melodic structures is an engineering sinkhole that will consume your protected time. The letter-string domain is not the bottleneck; the *static ontology* is. If you solve the "Plastic Slipnet" problem in the letter domain, you have solved the generalization problem. A visual domain with a hand-coded slipnet is scientifically weaker than a letter domain with a learned slipnet.
  *   *Exception:* Only expand the domain if the LLM Redundancy Check (Q1) proves that LLMs cannot be beaten in the letter domain. If LLMs crush letter analogies, you may need a domain where their tokenization biases are weaker (e.g., abstract visual relations). But start with letters.

  **2. The "Learning" Definition**
  Be careful what you mean by "concept learning." If you mean "learning new nodes," you are aiming for open-ended concept formation. This is likely impossible for a small group in one year without collapsing into pure neural generation.
  *   *Recommendation:* Define learning as **"topological adaptation."** The concepts (nodes) are innate/prior; the *relationships* (edges/weights) are learned. This preserves the FARG philosophical claim (there is a stable cognitive topology) while addressing the engineering critique (it doesn't adapt to context).

  **3. The LLM as Foil vs. Instrument**
  You mentioned using LLMs as instruments. **Be wary.**
  *   *Risk:* If you use an LLM to generate the codelets or suggest slipnet links, you obscure the source of the intelligence. Is the model finding the analogy, or is the LLM?
  *   *Strategy:* Use LLMs strictly as a **baseline solver** and as a **data generator** for the Adversarial Benchmark (ask the LLM to generate problems it finds easy, then filter for ones your model finds hard). Do not integrate them into the inference loop.

  ### Summary Roadmap for the Next Year

  *   **Months 1-3 (The Baseline):** Reproduce Copycat. Build the Adversarial Benchmark by probing LLM failures. Run human subjects on this benchmark to get reaction time/error data.
  *   **Months 4-8 (The Plasticity):** Implement the learnable Slipnet weights. Train on the human behavioral data, not just answer correctness.
  *   **Months 9-12 (The Isolation):** Run ablation studies (Greedy vs. Parallel). Write up the comparison: "A Learnable Fluid Analogy Model Outperforms LLMs on Structurally Adversarial Tasks via Human-Aligned Search."

  If you execute this, you move the field from "Here is a fascinating simulation of one person's intuition" to "Here is a falsifiable, learnable cognitive architecture that explains human error patterns where statistical models fail." That is a genuine contribution.
