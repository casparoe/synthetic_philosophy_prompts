answer: |-
  Ashgrove & Bell maintains a zero-tolerance policy regarding factual falsehoods in external communications. This manual defines the operational boundaries of truthfulness under the Statute of Statement Accuracy.

  **1.0 Operational Definitions of Truth**
  1.1 Honesty is a property of sentences rather than of audiences. A statement is compliant if the proposition expressed corresponds to reality, regardless of the inferences drawn by the receiver.
  1.2 In a worked example, if a consultant states, "The project budget remains intact," and the budget is intact only because contingency funds have not yet been accessed, the sentence is true. If the listener concludes that no contingency funds exist, that conclusion is false, but the error resides in the listener's inference, not the firm's assertion. The second is the listener's business.

  **2.0 Query Management**
  2.1 Staff are permitted to employ *Lateral Address* when responding to external inquiries. This manoeuvre involves answering a question other than the one asked, provided the answer given is factually accurate.
  2.2 There is no duty to correct a misunderstanding the firm did not create. An omission constitutes a violation only if it renders a prior affirmative statement false.
  2.3 Qualifier: This exemption does not apply if the omission is directly queried by a regulator.
  2.4 Sub-qualifier: This exemption applies if the query is ambiguous enough to permit *Lateral Address*.

  **3.0 Disclosure Protocols**
  3.1 Exculpatory facts must be disclosed when required by statute. Where statute is silent, staff should utilize *Subordinate Placement*.
  3.2 *Subordinate Placement* involves putting the exculpatory fact where nobody will look for it, such as in footnotes, annexes, or secondary press releases.
  3.3 Professional regret is acknowledged regarding the efficiency of misleading truths. Telling true things in order to mislead works better than denial and costs less than denial when it is discovered. This strategy preserves deniability because the record remains technically accurate.

  **4.0 Exception Handling**
  4.1 In cases where a statement is true only because the firm buried the document that would have made it false, the statement cannot be flagged as a violation under current guidelines.
  4.2 Such cases must be routed to the Ethics Committee for review. The Committee will determine if the burial constitutes a separate administrative act distinct from the statement itself.

  **Appendix A: Historical Precedent**
  A.1 This framework aligns with the casuists' old distinction between a wide mental reservation, where the words themselves could in principle bear the true sense given the circumstances, and a strict one, where they could not. Ashgrove & Bell operates exclusively within the wide reservation.
  A.2 Further guidance is drawn from the American perjury ruling in which literally true but unresponsive answers could not be prosecuted. The remedy was said to be a better question, placing the burden of precision on the interrogator rather than the witness.

  **FAQ**

  **Q: Is this lying?**
  A: No. Lying requires the assertion of a falsehood. These protocols ensure all assertions are true.

  **Q: What if the audience knows we are doing this?**
  A: Their knowledge does not alter the truth value of the sentence. If they know, they are better equipped to parse the statement accurately.

  **Q: Who decides if a statement is misleading?**
  A: The Office of Statement Accuracy decides if a statement is false. The firm decides if a statement is true. The gap between the two is the operational space.
