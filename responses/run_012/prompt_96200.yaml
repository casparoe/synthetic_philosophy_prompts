prompt: |-
  I retired last year after 34 years as an entomologist -- insect neurobiology, so I've spend my whole working life around bugs -- and I've finally got time to read the philosophy I never had time for. The thing that's got its hooks in me is which animals are conscious. It's not idle curiosity: I've watched insect farming go from a novelty to an industry, I don't know what I think about it, and I suspect a lot of people happily eating cricket flour dont either.

  The problem is I've got maybe ten decent years of part-time work left in me and no lab, and the field looks like five different questions being answered past each other. So what I want from you is an agenda, not a survey. What are the real open questions here, and which two or three would you actually put my years into? I want the reasoning: which questions are upstream of which, which ones someone with my background could actually move, which ones would change what anyone does about a cricket or an octopus, and what would move a question up or down your list.

  Two things I keep circling. First, someone told me there's an argument that at least some of the leading theories can't be told apart by any experiment, because for any system that counts as conscious on one of them you can unfold it into a functionally identical system that the same theory says isn't conscious at all. If that's even half right it seems to reorder everything, and I want to know where it belongs in the ranking. Second, is it actually settled that there's a fact of the matter about a bee, or is the honest answer that consciousness is simply indeterminate in the borderline cases? And if it's indeterminate, is that upstream of all the other questions, or is it a lovely puzzle that wouldn't change anyone's behaviour?
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired entomologist (34 years, insect neurobiology). Deep domain expertise in insect physiology, behavior, and neural structures. No longer has a lab. Limited time/energy (10 years part-time).
      *   **Goal:** Wants an *agenda* for philosophical/scientific inquiry into animal consciousness, specifically focusing on invertebrates (insects, cephalopods). Not a survey of literature.
      *   **Motivation:** Ethical concern regarding insect farming/industry. Wants to know what actually matters for policy/behavior.
      *   **Specific Constraints:** Needs prioritization (top 2-3 questions). Needs reasoning (upstream/downstream, feasibility, impact).
      *   **Specific Concerns:**
          1.  The "Unfolding Argument" (theories might be empirically indistinguishable).
          2.  Indeterminacy (is there a fact of the matter about a bee?).

  2.  **Deconstruct the Field (Consciousness Science/Philosophy):**
      *   The field is indeed fragmented (Neuroscience, Philosophy of Mind, Ethics, AI/Computational Theory).
      *   Key theories: Global Workspace Theory (GWT), Integrated Information Theory (IIT), Predictive Processing/Active Inference, Higher-Order Theories (HOT).
      *   Key problems: Hard Problem, Measurement Problem, Distribution Problem (who has it?).
      *   The User's specific edge: Insect neurobiology. They know the *hardware* better than the philosophers.

  3.  **Evaluate the User's Specific Concerns:**
      *   *Concern 1: The Unfolding Argument.* (Referencing Doerig et al., or similar critiques of IIT/GWT). This argues that functional isomorphism doesn't guarantee phenomenological isomorphism across theories. *Assessment:* This is a meta-theoretical problem. It's crucial for *theory selection*, but less useful for *policy* in the short term. If theories can't be distinguished, we need a different heuristic.
      *   *Concern 2: Indeterminacy.* (Referencing vagueness, sorites paradoxes applied to consciousness). *Assessment:* If consciousness is indeterminate, binary ethical frameworks (conscious/not conscious) fail. This pushes towards precautionary principles. This is highly relevant to the "cricket flour" ethical dilemma.

  4.  **Develop the Agenda (Prioritization Strategy):**
      *   *Criterion 1: Impact.* Will answering this change how we treat insects? (Ethical/Policy leverage).
      *   *Criterion 2: Feasibility.* Can a retired entomologist contribute without a wet lab? (Theoretical synthesis, behavioral analysis, reviewing neural correlates).
      *   *Criterion 3: Upstream/Downstream.* Does this resolve bottlenecks for other questions?

      *   *Drafting Potential Questions:*
          1.  Which theory is true? (Too broad, too philosophical).
          2.  Do insects feel pain? (Too specific, presupposes consciousness).
          3.  What are the minimal neural correlates of consciousness (NCC) in invertebrates? (Good fit for background).
          4.  How do we handle uncertainty/indeterminacy in policy? (High ethical impact).
          5.  Is the "Unfolding Argument" fatal to current theories? (High theoretical impact, low immediate policy impact).

      *   *Selecting the Top 2-3:*
          *   *Selection 1: The Precautionary Principle under Indeterminacy.* (Addresses Concern 2 & Ethical Goal). If we can't prove consciousness, how do we act? This is upstream of ethics.
          *   *Selection 2: Minimal Neural Substrates vs. Functional Capabilities.* (Leverages Entomology Background). Instead of asking "Are they conscious?", ask "What architecture is required?" and map insect brains against it. This bypasses the "Hard Problem" slightly to focus on the "Real Problem" (functions).
          *   *Selection 3 (The Wildcard): The Unfolding Argument's Practical Implication.* (Addresses Concern 1). If theories are empirically equivalent regarding behavior, we must rely on structural analogies. This validates the neurobiological approach over the purely behavioral one.

  5.  **Refining the Argument & Reasoning:**
      *   *Why these?* They move away from "Proving Consciousness" (which might be impossible) to "Managing Risk" and "Mapping Structure."
      *   *The Unfolding Argument:* Place it as a *constraint* on theory choice, not a primary research question. It tells us *why* we can't rely solely on behavior, pushing us back to neurobiology (the User's strength).
      *   *Indeterminacy:* This is the ethical pivot. If it's vague, binary rights don't work. Graded welfare does.
      *   *Feasibility:* No lab needed. Requires reading, synthesizing, writing, perhaps collaborating with theorists.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Respectful, peer-to-peer (acknowledge expertise), direct, pragmatic.
      *   *Structure:*
          1.  Acknowledge the position (Entomologist + Philosopher is a rare and needed combo).
          2.  Address the Two Circles (Unfolding & Indeterminacy) immediately to clear the deck.
          3.  Present the Agenda (Top 3 Questions).
          4.  Provide the Reasoning (Upstream/Downstream, Feasibility, Impact).
          5.  Actionable advice on how to spend the 10 years.

      *   *Self-Correction during drafting:* I initially thought about suggesting IIT vs. GWT comparison. But the User said "no lab." Testing IIT requires perturbation complexivity measures which are hard without equipment. Better to focus on *structural analogies* (central complex vs. thalamocortical).
      *   *Refining the Unfolding Argument:* It's not just that theories can't be told apart; it's that *functional* tests fail. This means *structural* tests (neuroanatomy) are the only remaining hope. This empowers the User.
      *   *Refining Indeterminacy:* It's not a "lovely puzzle." It dictates the *type* of ethics (precautionary vs. rights-based).

  7.  **Final Polish:** Check against constraints.
