  8.  *(Final check on the "Unfolding Argument")*: The argument is usually associated with Doerig, Schurger, et al. (2021) regarding IIT. It suggests IIT attributes consciousness to systems that are functionally identical to unconscious systems (unfolding feedforward networks). This implies IIT is not functionally testable. This is critical. It means *behavioral* assays are insufficient. This reinforces the need for neurobiological structural analysis. I need to make sure this link is clear.

  9.  *(Final check on Indeterminacy)*: Kammerer, Browne, etc. If consciousness is vague, then "fact of the matter" is false. This kills the project of finding a binary switch. It shifts the goal to "probability of sentience" (like the Cambridge Declaration). This is actionable for policy.

