prompt: |-
  I moderate a fairly big online support group for people with a chronic illness — 40k members, six volunteer mods including me, and we're making calls on threads basically every day about whether to step in. We keep having the same fight. Sometimes a thread is a closed loop: everyone's quoting the same one blog post and the same two anecdotes, and nobody in there seems to know that actual doctors disagree with each other about this stuff. Other times it's a thread where people *do* know about the outside disagreement, and the response is that the study was bought, the specialist is a shill, that person was never really sick in the first place. From the mod chair those feel like the same problem, but I'm pretty sure they're not the same thing and probably don't have the same fix. What I need is a procedure my mod team can actually run on a thread — twenty minutes, no philosophy degree — that tells us which of the two we're looking at (or both, or neither), what to do about each, and what to do when they're tangled together. It should give us the questions in order, what counts as a good enough answer to each, where it stops with a "no, leave it", and where it hands the thing to a human because it's a values call and not a factual one. Some constraints: we only remove posts for breaking the rules, never for being wrong, and anything that smells like a medical claim has to go past our one volunteer nurse practitioner before we act on it, so the procedure has to say clearly where that sign-off comes in. It also has to cover the case where the honest answer is to do nothing even though the thread is making my teeth grind, and the case where the problem is something one of us mods pinned to the top ourselves. Give me two or three worked examples, including one where it tells me something I won't like, and be honest at the end about where the procedure definately breaks down and a person just has to decide.
reasoning: |-
  Here's a thinking process that leads to the suggested moderation procedure:

  1.  **Analyze the Request:**
      *   **Context:** Large online support group (40k members, 6 volunteer mods) for chronic illness.
      *   **Problem:** Recurring conflict about when to intervene in threads. Two main scenarios identified by the user:
          1.  *Echo Chamber/Information Vacuum:* Everyone quoting the same blog/anecdotes, unaware of medical disagreement.
          2.  *Conspiracy/Dismissal:* People aware of disagreement but dismissing experts/studies as shills/fakes.
      *   **Goal:** A practical, 20-minute procedure for mods to diagnose the situation and decide on action.
      *   **Constraints:**
          *   No removing posts just for being *wrong* (only for rule-breaking).
          *   Medical claims must be vetted by the volunteer Nurse Practitioner (NP) before mod action related to safety/claims.
          *   Must cover "do nothing" outcomes (even if frustrating).
          *   Must cover mod-caused problems (pinned posts, etc.).
          *   Needs 2-3 worked examples (including one unwelcome outcome).
          *   Needs honest admission of where the procedure fails (human judgment required).
      *   **Tone:** Practical, non-academic, actionable, empathetic to the mod team's burden.

  2.  **Deconstruct the Two Scenarios:**
      *   *Scenario A (The Bubble):* Lack of information diversity. Harm potential: Misinformation spread by omission, false hope, dangerous self-treatment based on incomplete data.
      *   *Scenario B (The Fortress):* Active distrust of expertise. Harm potential: Harassment of experts, radicalization, discouraging treatment adherence, toxic environment for those seeking help.
      *   *Overlap:* Both can lead to harmful medical advice being treated as fact.

  3.  **Drafting the Procedure (The "Triage Protocol"):**
      *   *Time Limit:* Needs to be quick. Flowchart style logic.
      *   *Step 1: Rule Check.* (The hard line). Is there harassment, spam, immediate danger?
      *   *Step 2: Medical Safety Check.* (The NP Gate). Is there a specific medical claim that could cause harm?
      *   *Step 3: Diagnosis.* (Echo Chamber vs. Conspiracy). Distinguishing the two types of "wrong."
      *   *Step 4: Action.* (Intervene vs. Observe).
      *   *Step 5: Mod Reflection.* (Did we cause this?).

  4.  **Refining the Steps (incorporating constraints):**
      *   *NP Sign-off:* Crucial. If a post says "Take X to cure Y," that stops the clock. Mods can't decide safety alone.
      *   *Rule vs. Wrong:* Emphasize that being factually incorrect isn't a bannable offense unless it violates safety rules.
      *   *The "Teeth Grind" Clause:* Explicitly allow for "Monitor Only" status.

  5.  **Developing Worked Examples:**
      *   *Example 1 (The Echo Chamber):* A thread about a specific diet curing the illness. Everyone agrees. No dissent. *Outcome:* NP review needed. If safe, add context resource (mod action), don't delete.
      *   *Example 2 (The Conspiracy):* A user shares a study. Others call them a pharma shill. *Outcome:* Rule violation (harassment/ad hominem). Remove comments, keep thread.
      *   *Example 3 (The Unwelcome Truth/Mod Error):* A mod pinned a resource that is now outdated/contested. The thread is attacking the pinned post. *Outcome:* Acknowledge error, unpin/update, don't punish users for pointing it out.

  6.  **Addressing the "Breakdown" Point:**
      *   Where does logic fail? When community culture clashes with safety. When "support" means validating feelings that contradict medical reality. When the NP is unavailable. When the "vibe" is toxic but rule-compliant.

  7.  **Review against Constraints:**
      *   20 mins? Yes, flowchart is quick.
      *   No philosophy? Yes, focused on rules and safety.
      *   NP sign-off included? Yes, Step 2.
      *   "Do nothing" option? Yes.
      *   Mod error covered? Yes.
      *   Examples included? Yes.
      *   Honest breakdown? Yes.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction during drafting:* Make sure I don't give medical advice myself. Keep the focus on *process*.
      *   *Tone Check:* Ensure it sounds like it's written by someone who understands mod burnout. Use terms like "Triage," "Red Flag," "Green Light."
      *   *Specific focus on the User's distinction:* The user thinks Scenario A and B are different. I need to validate that. Scenario A is usually ignorance (educable). Scenario B is distrust (policing required).
      *   *The "NP Gate":* Make this very clear. Mods are not doctors. If there's *any* doubt on safety, NP decides.

  9.  **Final Polish:**
      *   Structure with clear headings.
      *   Bold key decision points.
      *   Ensure the "Unwelcome Outcome" example is truly uncomfortable (e.g., admitting the mod team was wrong).
      *   Final section on "Where this breaks."

  10. (Final check of the prompt requirements): "Give me two or three worked examples, including one where it tells me something I won't like." -> Okay, I will make sure Example 3 is the "Mod Team Messed Up" scenario. "Be honest at the end about where the procedure definately breaks down." -> Okay, final section.

  Let's write it.cw
answer: |-
  This is a **Community Health Triage Protocol**. It is designed to be printed or pinned in your mod-only channel. It takes 20 minutes max per thread. It separates *safety* (NP decision), *rules* (Mod decision), and *culture* (Community decision).

  ### The 20-Minute Triage Protocol

  **Step 1: The Hard Stop (Rules & Safety)**
  *Scan the thread for immediate rule violations.*
  *   **Is there harassment, doxxing, or hate speech?**
      *   **Yes:** Remove violating comments. Ban/Mute per rules. **Stop.**
      *   **No:** Proceed to Step 2.
  *   **Is there a specific medical directive?** (e.g., "Stop taking your meds," "Take 500mg of X," "This cures Y.")
      *   **Yes:** **STOP.** Do not remove yet. Tag your Volunteer NP. This is the **NP Gate**.
          *   *NP says "Dangerous":* Remove post/comment. Cite Safety Rule.
          *   *NP says "Anecdotal but safe":* Proceed to Step 3.
          *   *NP unavailable > 24hrs:* Lock thread temporarily with note: "Waiting on medical safety review."
      *   **No:** Proceed to Step 3.

  **Step 2: Diagnose the Distortion**
  *Why does this thread feel "off"? Check the boxes.*

  *   **Type A: The Bubble (Ignorance)**
      *   [ ] Everyone cites the same 1-2 sources (blog, influencer).
      *   [ ] No mention of conflicting medical views.
      *   [ ] Tone is supportive but uniform.
      *   [ ] *Risk:* False hope, omission of risk.
  *   **Type B: The Fortress (Distrust)**
      *   [ ] Medical consensus/studies are mentioned but dismissed.
      *   [ ] Keywords: "Shill," "Big Pharma," "They don't want you to know," "Not really sick."
      *   [ ] Tone is defensive or aggressive toward outsiders.
      *   [ ] *Risk:* Harassment, treatment non-adherence, radicalization.
  *   **Type C: Mod-Induced**
      *   [ ] Is a Pinned Post, Wiki Link, or Mod Statement the source of the conflict?
      *   [ ] *Risk:* Loss of trust in leadership.

  **Step 3: Select Action**
  *Match the Diagnosis to the Action.*

  | Diagnosis | Action | Who Decides? |
  | :--- | :--- | :--- |
  | **Type A (Bubble)** | **Add Context, Don't Delete.** Post a mod comment linking to diverse resources (NIH, varied specialist views). "We've seen other perspectives on this, adding for balance." | Mod Team |
  | **Type B (Fortress)** | **Enforce Civility Rules.** You cannot ban "conspiracy," but you can ban *ad hominem* attacks. Remove comments attacking the *person* sharing the study. Keep the debate on the *data*. | Mod Team |
  | **Type C (Mod-Induced)** | **Own It.** Unpin/Update the resource. Comment: "We hear this resource is causing confusion. We are reviewing it." | Lead Mod |
  | **None (Just Frustrating)** | **Monitor Only.** If no rules broken and NP says safe, **do nothing.** Log it in "Watchlist." | Mod Team |

  **Step 4: The "Teeth Grind" Check**
  *Before closing the ticket, ask:*
  *   "Are we removing this because it breaks a rule, or because it annoys us?"
  *   If it's annoyance: **Log and Leave.**
  *   If it's safety: **NP Sign-off required.**

  ***

  ### Worked Examples

  #### Example 1: The "Miracle Diet" Bubble (Type A)
  **The Thread:** 50 comments. Everyone is praising a specific influencer's blog about a diet that "reversed" their chronic illness. No one mentions that clinical trials for this diet failed.
  **The Grind:** It makes your teeth hurt because you know the science is weak.
  **Triage:**
  1.  **Safety:** Someone says, "I threw away my meds to try this." **STOP.** NP Gate.
  2.  **NP Review:** NP says, "Stopping meds abruptly is dangerous."
  3.  **Action:** Remove the specific comment about stopping meds (Safety Violation).
  4.  **Bubble Fix:** Do not remove the diet discussion. Post a Mod Sticky: *"Glad this works for some. For those researching, here are three links including recent clinical trial data that shows mixed results. Please discuss safely."*
  5.  **Outcome:** Dangerous advice removed. Discussion stays. Context added.

  #### Example 2: The "Shill" Fortress (Type B)
  **The Thread:** A user posts a link to a new study from a major university. 20 comments reply calling the user a "pharma plant" and saying the user "doesn't have the real illness."
  **The Grind:** You want to delete the whole thread because it's anti-science.
  **Triage:**
  1.  **Safety:** No specific dosage/cure claims. NP Gate not triggered.
  2.  **Diagnosis:** Type B (Fortress).
  3.  **Rule Check:** Calling someone a "shill" is borderline. Calling them "not really sick" is ableist/harassment under most group rules.
  4.  **Action:** Remove the comments attacking the *person* ("You aren't sick," "You're a shill"). Keep the original post.
  5.  **Mod Note:** "We allow debate on studies. We do not allow attacks on member validity. Comments removed."
  6.  **Outcome:** You didn't delete the "wrong" opinion, you deleted the *rule-breaking* reaction to it.

  #### Example 3: The Mod Mistake (Type C - The Unwelcome Outcome)
  **The Thread:** A heated 100-comment argument. Users are attacking a resource **your team pinned last year**. They are calling the resource outdated and dangerous. The thread is toxic.
  **The Grind:** You want to lock the thread and tell them to read the Wiki.
  **Triage:**
  1.  **Safety:** Claims that the pinned resource is dangerous. **STOP.** NP Gate.
  2.  **NP Review:** NP says, "Actually, the community is right. That guideline changed 6 months ago. The pinned post is outdated."
  3.  **Diagnosis:** Type C (Mod-Induced).
  4.  **Action:** **Do not lock the thread.** Do not defend the pin.
      *   Unpin the resource immediately.
      *   Post in the thread: *"The mod team has reviewed this. The NP confirmed this resource is outdated. We are removing the pin. Thank you for flagging this."*
  5.  **Outcome:** You look fallible. You have to eat humble pie. The toxicity stops because the source of conflict (the bad pin) is gone.
      *   *Why this is hard:* It admits the mod team failed. But keeping a dangerous pin to save face is a liability.

  ***

  ### Where This Procedure Breaks Down

  You asked for honesty. Here is where this flowchart fails and a human must sit with the discomfort:

  **1. The "Vibe" Toxicity (Rule-Compliant Harm)**
  Sometimes a thread follows every rule. No medical advice, no name-calling, no harassment. But the *cumulative effect* is despair. It's 200 people validating each other's decision to give up on treatment. It is factually "safe" by NP standards, but it is culturally rotting the group.
  *   **The Break:** The procedure says "Monitor Only."
  *   **The Human Call:** You may need to close the thread not because it broke a rule, but because it violates the *mission* of the group (Support vs. Surrender). This requires a Lead Mod to make a values call that will be unpopular. Write a transparent explanation when you do this.

  **2. The NP Bottleneck**
  If you have 40k members, you will have more medical flags than one volunteer NP can review in 24 hours.
  *   **The Break:** Step 1 says "Stop and Wait."
  *   **The Human Call:** If the NP is silent for 48 hours, you have to decide: Is the risk of leaving it up greater than the risk of removing a potentially safe post? Usually, err on the side of removal with a note ("Pending Medical Review"), but this slows down conversation and frustrates users. You need a backup plan for NP absence.

  **3. The "Lived Experience" Veto**
  In chronic illness communities, "Lived Experience" is often valued higher than clinical data. If your procedure prioritizes the NP's clinical view over the group's anecdotal consensus too often, you will lose the community. They will feel medicalized by the mods.
  *   **The Break:** The procedure assumes the NP is the ultimate arbiter of truth.
  *   **The Human Call:** Sometimes you must allow a thread to stand even if the NP says it's "medically unlikely," because the *support* value outweighs the *accuracy* value. Distinguish between "This will kill you" (Remove) and "This probably won't work" (Allow). The line between those two is not in the flowchart; it's in your judgment of the group's resilience.

  **Final Advice:**
  Print this. Put it in your mod channel. When you fight, don't fight about the thread. Fight about which box in Step 2 gets checked. That moves the argument from "I feel this is wrong" to "Does this meet the criteria for Type B?" That is how you save your team.
