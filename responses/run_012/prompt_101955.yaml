  # Taxonomy of Cross-Cultural Intuitive Variation

  **Root Question:** Does the observed cross-cultural variation in intuitive verdicts defeat the use of intuition as *a priori* evidence for a single, culture-invariant normative truth?

  ### Level 2 Node A: Yes, Authority Defeated
  *The variation shows intuition cannot settle the philosophical question as traditionally conceived.*

  #### Level 3 Node A.1: The Failure Lies in the Claim Type
  *Philosophical claims are not the kind of thing intuition can verify.*

  *   **Leaf 1: Intuition-Independence**
      *   **Commitment:** Philosophical truths must be established by argument or theory alone, rendering the empirical discovery of variation philosophically inert.
  *   **Leaf 2: Conceptual Anthropology**
      *   **Commitment:** The method yields data about folk concepts rather than normative truths, reducing metaphysics to a branch of descriptive ethnography.

  #### Level 3 Node A.2: The Failure Lies in the Subject Capacity
  *Subjects lack the shared capacity required to generate authoritative verdicts.*

  *   **Leaf 3: Competence Void**
      *   **Commitment:** The philosophical case fails to probe a shared competence, implying the dispute is misconceived and no fact of the matter exists to be found.
  *   **Leaf 4: Framework Incommensurability**
      *   **Commitment:** Competent respondents inhabit distinct normative frameworks, making cross-cultural adjudication impossible without begging the question.

  ### Level 2 Node B: No, Authority Retained
  *Intuition remains evidential, but the variation requires specific management or explanation.*

  #### Level 3 Node B.1: Variation is Non-Competence (Noise or Artifact)
  *The divergence arises from factors external to the intuitive capacity itself.*

  *   **Leaf 5: Correctable Noise**
      *   **Commitment:** The variation is a performance error correctable by better probing, implying that current disagreement is merely a temporary lack of clarity.
  *   **Leaf 6: Linguistic Artifact**
      *   **Commitment:** The salient partition is language rather than culture, forcing the conclusion that philosophical problems often dissolve under translation.
  *   **Leaf 7: Expertise Override**
      *   **Commitment:** Formal philosophical training trumps cultural background, licensing the exclusion of lay respondents from the evidential pool.

  #### Level 3 Node B.2: Variation is Competence-Input (Case Representation)
  *Respondents differ in how the case is perceived, imagined, or described.*

  *   **Leaf 8: Perceptual Divergence**
      *   **Commitment:** Cognitive styles alter the imagination of the case, meaning respondents are technically answering different questions despite identical prompts.
  *   **Leaf 9: Local Normativity**
      *   **Commitment:** Variation is genuine but local to the case, licensing a culture-indexed redescription of the case rather than abandonment of the method.

  #### Level 3 Node B.3: Variation is Competence-Output (Rule Mapping)
  *Respondents agree on the case features but differ in the rule mapping features to verdicts.*

  *   **Leaf 10: Calibrated Evidentialism**
      *   **Commitment:** Intuitions are retained as evidence but treated as defeasible seemings whose evidential weight is calibrated to the reliability of the population sampled.
  *   **Leaf 11: Statistical Individualism**
      *   **Commitment:** Within-group variation swamps between-group variation, rendering "culture" a misleading grouping variable for epistemic reliability.
  *   **Leaf 12: Rule Relativism**
      *   **Commitment:** Conflicting mapping rules are equally valid, entailing that the normative truth itself is relative to the operational rule set of the respondent.

  #### Level 3 Node B.4: Variation is Competence-Meta (Structure of Judgment)
  *Respondents differ in confidence or diagnostic reasoning rather than raw verdict.*

  *   **Leaf 13: Theoretical Dissociation**
      *   **Commitment:** Respondents agree on the verdict but disagree about which features are doing the work, so they part company on nearby cases.
  *   **Leaf 14: Confidence Stratification**
      *   **Commitment:** The same answer is offered with different degrees of conviction or willingness to generalize, making confidence the primary evidential variable.

  ***

  ### Structural Commentary

  **Unoccupied Logical Space**
  Three combinations of answers remain unoccupied in this tree. First, **Output-Side Performance Error** is absent (under Node B.1/B.3 boundary). This space is unexplored because errors in mapping rules are typically diagnosed as competence deficits rather than transient noise; positing a "temporary rule glitch" is psychologically unattractive compared to input-side confusion. Second, **Competence Void with Confidence Variation** (under Node A.2/B.4 boundary) is incoherent; if no shared competence exists to be probed, differences in conviction regarding the verdict are epistemically meaningless. Third, **Expertise Override with Framework Incommensurability** (under Node B.1/A.2 boundary) is unoccupied; if frameworks are truly incommensurable, philosophical training cannot function as a neutral arbiter to override cultural differences, making the combination unstable.

  **Failures to Separate**
  The tree fails to cleanly separate **Leaf 8 (Perceptual Divergence)** and **Leaf 9 (Local Normativity)**. Both locate the variation at the input stage (how the case is grasped). A respondent cannot distinguish these positions without already knowing whether the "redescription" in Leaf 9 is a correction of a mistake (Leaf 8) or a constitutive feature of the norm (Leaf 9). To separate them, a further distinction is needed regarding *correctibility*: whether a neutral third party could adjudicate which perception is "accurate" without relying on intuition.

  The tree also strains to separate **Leaf 10 (Calibrated Evidentialism)** and **Leaf 11 (Statistical Individualism)**. Both treat intuition as defeasible evidence and both question the "culture" grouping. They collapse if "reliability of the population" (Leaf 10) is defined by individual consistency rather than group membership (Leaf 11). Separation requires a prior commitment to whether epistemic peerhood is determined by demographic background or cognitive psychometrics.

  **Diagnostic Work of Distinctions**
  The distinction between **Input-Side (Node B.2)** and **Output-Side (Node B.3)** explanations does structural work by isolating whether the philosophical *case* is the problem or the *principle* is the problem. The distinction between **Verdict Variation** (Nodes B.2/B.3) and **Meta-Intuitive Variation** (Node B.4) ensures that agreement on the bottom-line verdict does not prematurely close inquiry into diagnostic disagreement (Leaf 13) or confidence gaps (Leaf 14). Finally, the **Grouping Variable** constraint is addressed at Node B.1 and Leaf 11, forcing the user to ask whether "culture" is the relevant causal mechanism or merely a proxy for language, training, or individual cognitive style.
