answer: |-
  **Project Title:** Constituting the Demos: Dissolving the Circularity of the Boundary Problem

  **Guiding Question**
  Can the logical circularity of the boundary problem be dissolved by distinguishing the *inclusion question* (by what principle boundaries are drawn) from the *constitution question* (who decides the boundary), provided we further distinguish between procedural and justificatory legitimacy?

  This project argues that the answer is yes. The prevailing consensus in democratic theory holds that defining the *demos* is viciously circular: any procedure to decide the boundary presupposes a bounded *demos* to administer it. This project challenges that consensus. It hypothesizes that the circularity arises only because the debate conflates the normative standard for membership with the agency authorized to enforce it. By separating these inquiries and assigning justificatory legitimacy (moral rightness) to the inclusion principle and procedural legitimacy (authorized decision-making) to the constitution question, the paradox dissolves. The project will test whether this conceptual distinction holds normative force when applied to contested political boundaries.

  **State of the Debate**
  Contemporary approaches to the boundary problem generally fall into two camps: principle-based and procedure-based. Proponents of the All-Affected Interests principle and the All-Subjected Principle attempt to solve the inclusion question by offering a moral metric for membership. However, as critics like Whelan and Abizadeh have noted, these principles fail to address the constitution question. They specify who *ought* to be in, but not who may *decide* who is in. Conversely, proceduralists argue that the boundary must be decided democratically, but this invites the charge of circularity: one cannot vote on the franchise without already defining the franchise.

  Existing positions leave the guiding question open because they assume legitimacy is monolithic. They presume that for a boundary decision to be legitimate, it must be both procedurally authorized by the *demos* and justified by an external principle simultaneously. This project contends that this demand is too high. It leaves open the possibility that a boundary decision can be justificatorily legitimate (correct according to the inclusion principle) even if it lacks prior procedural authorization, provided there is a mechanism to rectify the procedural deficit subsequently. Current literature lacks a systematic account of how these two modes of legitimacy interact during the foundational moment of constituting a *demos*.

  **Methodology and Work Plan**
  The research will proceed over twelve months, dividing labor between conceptual analysis (Months 1–3 and 10–12) and case examination (Months 4–9). The method is analytic-normative, using cases not as empirical data but as stress tests for conceptual coherence.

  *Months 1–3: Conceptual Framework.* I will rigorously define the inclusion/construction distinction and the procedural/justificatory legitimacy dichotomy. The output will be a working paper establishing the vocabulary for the project. I will map existing arguments onto this new grid to demonstrate where conflation has occurred.

  *Months 4–8: Case Studies.* I will apply the framework to three contested boundary scenarios.
  1.  **Secession Referenda:** Who constitutes the *demos* for a vote on independence? Is it the regional population or the state-wide population? I will analyze whether distinguishing between the right to secede (inclusion) and the authority to call the vote (constitution) resolves the deadlock between centralist and regionalist claims.
  2.  **Diaspora Voting Rights:** Do non-resident citizens retain a claim to membership? This case tests the "all-subjected" principle against the "citizenship" principle. I will examine if justificatory legitimacy can sustain external voting rights even when procedural legitimacy (residence-based participation) is weak.
  3.  **Admission of New Members:** In naturalization regimes, who decides the criteria for entry? This tests the boundary of the boundary. I will analyze whether current citizens can legitimately restrict entry if doing so violates the inclusion principle for those affected.

  *Months 9–12: Synthesis.* I will integrate findings to determine if the distinction survives contact with these hard cases. The final output will be a journal article-length manuscript arguing for the viability of the split-legitimacy model.

  **Success and Failure Conditions**
  A successful result will demonstrate that the circularity charge loses its force in at least two of the three case studies. Specifically, success looks like showing that in secession or admission cases, we can validate a boundary decision as *justificatorily* legitimate even when the *procedural* authority is contested, without collapsing into authoritarianism.

  The project fails if the distinction between procedural and justificatory legitimacy proves unstable in practice. If, in every hard case, the demand for procedural authorization overwhelms the justificatory principle (rendering the inclusion question moot), or if the justificatory principle proves too indeterminate to guide the constitution question, the hypothesis will be falsified. A second failure condition is if the distinction turns out to be merely semantic, offering no resolution to actual political conflicts that the existing literature does not already address.

  **Risk and Reply**
  The strongest reason to think this approach is misconceived is the Proceduralist Objection: that justificatory legitimacy without procedural authorization is theoretically empty and politically dangerous. A critic might argue that claiming a boundary is "morally correct" without the *demos* agreeing to it is simply imposition by another name, rendering the distinction elitist. If legitimacy requires the actual consent of the governed, separating the "right answer" from the "authorized decision" undermines the democratic ethos.

  In reply, I argue that the circularity problem arises precisely because we demand consent *ex ante*. By accepting that the initial boundary must rest on justificatory legitimacy (moral reasoning about who is affected or subjected), we avoid the infinite regress. Procedural legitimacy then becomes a secondary, ongoing requirement to validate the boundary over time, rather than a precondition that makes the boundary impossible to draw. The risk of elitism is mitigated by making the justificatory principles (e.g., all-subjected) public and contestable, rather than relying on the arbitrary will of an existing group. If this reply fails, the project will document why the boundary problem remains a paradox; if it succeeds, it offers a way out.
