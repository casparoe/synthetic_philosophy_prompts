      *   *Claim 3: "...believing is just something we say about a system when it's handy to predict it that way, like talking about the average family having 2.4 children, or about an object's center of gravity."*
          *   **Assessment:** The analogies are Dennett's own (center of gravity is a classic Dennett example). However, the implication that center of gravity is *unreal* is where the summary might drift. Dennett says centers of gravity are *real abstracta*.
          *   **Verdict:** **Nod/Wince.** The analogy is correct, the ontological status (fiction vs. real abstracta) is the contention.

      *   *Claim 4: "That's what he means when he calls patterns 'real': a pattern is real when it pays to describe the system in those terms, and the question of whether the pattern matches anything in the world never comes up."*
          *   **Assessment:** "When it pays" is right (predictive power). "Matches anything in the world never comes up" is wrong. For Dennett, the pattern *is* in the world, just not as a concrete object. It's observer-relative but not mind-independent in the way a rock is.
