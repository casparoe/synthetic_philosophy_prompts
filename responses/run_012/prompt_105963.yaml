      *   *Claim 7: "...there's no fact of the matter about whether a thermostat or a chess program really has beliefs."*
          *   **Assessment:** Dennett actually says there *is* a fact of the matter, but it's graded. If the intentional stance works perfectly, it has beliefs (in a sense). He doesn't draw a hard line. But saying "no fact of the matter" leans too hard into instrumentalism.
