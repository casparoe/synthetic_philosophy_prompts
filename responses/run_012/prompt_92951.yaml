answer: |-
  You're thinking like an engineer, which is actually the best way to approach this. The philosophical debate you're referencing is W.K. Clifford ("The Ethics of Belief," 1877) vs. William James ("The Will to Believe," 1896). Clifford said it's always wrong to believe without evidence (your landlord case). James said sometimes you need belief to create the truth (your sick friend case).

  But you don't need their names. You need a spec.

  Your "load-bearing" intuition is correct and it is *not* just "important" with extra words. In engineering, "important" is a priority tag; "load-bearing" is a structural dependency. If a load-bearing beam fails, the system collapses. If a non-load-bearing wall fails, it's cosmetic.

  Here is the principle that fits your nine cases, explains the Doctor Case, and keeps your intuitions intact without requiring you to sacrifice a single verdict.

  ### The Principle: Functional Epistemic Responsibility

  You are permitted to hold a belief without sufficient evidence if and only if it satisfies **The Safety Constraint** AND meets one of **The Functional Exceptions**.

  #### 1. The Safety Constraint (The "Don't Crash Production" Clause)
  You cannot hold a low-evidence belief if its failure imposes **significant, non-consensual risk on others** OR if it requires **ignoring salient counter-evidence**.
  *   *What it does:* This handles the hard stops. It prevents negligence and fraud.
  *   *Forced by:* Cases #1 (Landlord), #3 (Kid's treatment), #4 (Juror), #6 (Team risk), #8 (Uncle ignoring receipts).

  #### 2. The Functional Exceptions (The "Feature, Not Bug" Clauses)
  Even if evidence is low, the belief is permitted if:
  *   **A. Causal Necessity:** Holding the belief is a necessary causal factor in making the belief true (Self-Fulfilling).
  *   **B. Constitutive Necessity:** Holding the belief is required to constitute a specific moral good (e.g., Trust, Hope).
  *   **C. Harmless Unfalsifiability:** The belief cannot be tested and harms no one.
  *   *What it does:* This explains why some low-evidence beliefs aren't just "tolerated" but are actually *good* or *required*.
  *   *Forced by:* Cases #2 (Friend's hope), #5 (Your work drive), #7 (Marital trust), #9 (Afterlife).

  ---

  ### Why This Fits Your 9 Cases

  | Case | Verdict | Principle Application |
  | :--- | :--- | :--- |
  | **1. Landlord** | **Not Fine** | Fails **Safety**. High risk to others (tenants) who did not consent to the wiring risk. |
  | **2. Sick Friend** | **Admirable** | Passes **Safety** (she pays the risk). Meets **Exception A** (belief aids recovery/adherence). |
  | **3. Sick Kid** | **Not Fine** | Fails **Safety**. Child cannot consent to the risk. Also ignores medical evidence. |
  | **4. Juror** | **Not Fine** | Fails **Safety**. Defendant's liberty is at stake; juror has a fiduciary duty to evidence. |
  | **5. You/Work** | **Essential** | Passes **Safety** (you pay the risk). Meets **Exception A** (belief is the engine of the work). |
  | **6. You/Team** | **Not Fine** | Fails **Safety**. Team bears risk (quit jobs). Unless you disclosed the lack of evidence, this is non-consensual risk. |
  | **7. Uncle/Trust** | **Required** | Passes **Safety** (no counter-evidence). Meets **Exception B** (Trust *is* the belief; demanding proof destroys the good). |
  | **8. Uncle/Receipt** | **Not Fine** | Fails **Safety** (Evidence sub-clause). He is actively suppressing salient counter-evidence. |
  | **9. Grandfather** | **Fine/Neutral** | Passes **Safety**. Meets **Exception C** (Unfalsifiable, harmless). |

  **Do you have to give up any verdicts?**
  No. This principle accommodates all nine of your intuitive judgments. The reason your previous rule felt "half-baked" was that it treated all beliefs as *predictions*. This principle recognizes that some beliefs are *tools*.

  ### The "Load-Bearing" Distinction
  You asked if "load-bearing" is just "important." It's not.
  *   **Important:** "It would be nice if this belief were true."
  *   **Load-Bearing:** "If I stop believing this, the system collapses."

  In Case #5 (Your work), your belief is load-bearing for your productivity. If you switch to strict evidentialism ("There is only a 40% chance I land this"), your output drops, and the chance becomes 0%. The belief *changes the physics of the situation*.
  In Case #1 (Landlord), the belief is *not* load-bearing. The wiring doesn't care what he believes. The belief is purely a prediction, and a bad one.

  **The Rule:** You are only allowed to bypass evidence requirements when the belief itself is a functional component of the outcome (Load-Bearing), *and* you own the failure mode (Safety).

  ### The Stress Test: The Doctor Case
  *The Case:* A doctor is sure her patient will pull through. She treats him on that basis. She doesn't eat the cost if she's wrong (legally/financially), he does.
  *Your Worry:* This violates your old rule (She believes, He pays).
  *The Prediction:* **This is Fine.**

  **Why?**
  1.  **Fiduciary Exception:** The doctor-patient relationship is a consensual assumption of risk where the doctor is hired to carry the epistemic burden. The patient *consents* to the doctor making high-stakes calls.
  2.  **Functional Exception A (Causal Necessity):** Medical literature supports that physician optimism improves patient outcomes (adherence, stress reduction, physiological response). The doctor's belief is a *medical instrument*, like a scalpel. If she is "realistic" and projects doubt, the patient's survival rate drops.
  3.  **Safety Constraint:** She is not ignoring evidence (presumably). She is interpreting ambiguous evidence in the direction that maximizes survival probability.

  The Doctor Case passes because the belief is **Load-Bearing for the patient's health**, and the risk transfer is **Consensual/Fiduciary**.

  ### Where Your Rule Needed Patching
  Your original rule was: *(a) You pay if wrong, (b) Don't ignore evidence.*

  The Doctor Case breaks (a). The Landlord Case breaks (a) too, but for a different reason (others pay).
  The fix is changing (a) from "You pay" to **"No non-consensual harm to others."**
  *   In #6 (Team), your friends consented to join, but did they consent to the *risk profile*? If you sold them on a belief you knew was evidentially weak, you violated informed consent. That's why #6 is "Not Fine" even if they technically agreed to join.
  *   In the Doctor Case, the patient consents to the doctor's judgment as part of the treatment contract.

  ### Summary for Your Backlog
  If you need to commit this to a comment block in your brain, here is the spec:

  ```python
  def is_belief_ethical(belief, evidence_level, stakeholder_risk, functional_role):
      # 1. Safety Check: Hard Fail on Negligence
      if stakeholder_risk.high and not stakeholder_risk.consented:
          return False # Cases 1, 3, 4, 6
      
      # 2. Integrity Check: Hard Fail on Willful Ignorance
      if evidence_level.counter_evidence_ignored:
          return False # Cases 8, 3
      
      # 3. Functional Check: The "Load-Bearing" Exception
      if functional_role.is_causal_mechanism: 
          return True  # Cases 2, 5, Doctor (Belief makes it true)
      
      if functional_role.is_constitutive_good:
          return True  # Case 7 (Trust requires belief)
          
      if functional_role.is_harmless_unfalsifiable:
          return True  # Case 9 (Afterlife)
          
      # Default: Evidentialism required
      return evidence_level.sufficient 
  ```

  **The One Thing to Watch Out For:**
  Case #6 is your biggest risk. As a lead engineer, your optimism is load-bearing for your team. But if you treat your optimism as *data* rather than *motivation*, you become the Landlord. You can say "I believe we can do this" (Motivation/Functional), but you cannot say "The data says we will do this" (Prediction/Evidential) if the data doesn't support it. The line is thin, but it's the difference between leadership and negligence.
