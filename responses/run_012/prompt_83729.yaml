answer: |-
  This is a precise and painful description of a methodological stalemate. You are correct to suspect that the impasse is not merely about the reliability of the tools, but about the ontology of the object and the epistemology of the historian.

  Here is the diagnosis you requested, structured around your suspicions, the analogies, and the conditions for progress.

  ### 1. Diagnosis: Verification vs. Explanation

  Your suspicion is correct: the quarrel is not primarily about the reliability of the criteria, but about **what property "authenticity" denotes** and **what logical work the criteria are performing.**

  The two sides are indeed answering different questions under a single heading.

  *   **Side A (The Practitioners)** treats authenticity as an **atomistic property of individual units** (pericopae, sayings). They operate with a verificationist epistemology. The question is: *Can this specific brick be certified as original?* The criteria function as a sieve or a filter. The goal is to isolate a "hard core" of data that is immune to skepticism.
  *   **Side B (The Critics)** treats authenticity as a **holistic property of a explanatory model**. They operate with an abductive epistemology (Inference to the Best Explanation). The question is: *Does positing that Jesus said/did X provide the best explanation for why the tradition exists in this form?* The criteria function as heuristics for plausibility, not tests for certification.

  **Does the distinction survive contact with the literature?**
  Yes, but with a complication. When practitioners use the criteria, they often claim they are building a foundation for a narrative (holistic), but they defend individual results using verificationist logic (atomistic). When critics attack, they attack the verificationist logic but often refuse to offer a rival holistic model because they fear it will look like "just another reconstructed Jesus."

  The impasse persists because Side A believes Side B is being destructively skeptical, while Side B believes Side A is being naively positivist. They are talking past each other because Side A is trying to **prove** data points, while Side B is arguing that historical data points cannot be proven, only **posited** within a coherent narrative.

  **Is the question ill-posed?**
  Yes. The question "Is this saying authentic?" implies a binary state (Authentic/Inauthentic) that the evidence cannot support. The evidence supports degrees of probability relative to a specific hypothesis. By asking for a binary verdict on an atomistic unit, the field demands a precision the source material cannot yield.

  ### 2. Pressing the Analogies

  **Analogy 1: The Diagnostic Instrument without a Gold Standard**
  You ask if the lack of a gold standard makes the criteria unfalsifiable rather than false, and if that is a defect.

  *   **Unfalsifiable, not False:** You are right. Without a recording of Jesus, you cannot calculate false positives or false negatives. You cannot know if the Criterion of Embarrassment actually identifies authentic material or merely identifies material that the *evangelists* found difficult but retained for other reasons.
  *   **Defect or Feature?** In a forensic science, this is a fatal defect. In a hermeneutical discipline, it is inevitable. The defect arises only when historians claim **scientific certainty** for **interpretive moves**.
  *   **The Real Issue:** The problem is not the lack of a gold standard (which is true for all ancient history); it is the claim that the criteria *compensate* for the lack of a gold standard. They do not. They merely systematize the historian's intuition. If the criteria are treated as a formal algorithm that generates certainty, they are defective. If treated as a formalized way of stating "this fits my hypothesis better than that," they are acceptable but trivial.

  **Analogy 2: Likelihood Ratios and Priors**
  You ask if the residual disagreement is about priors, and if those priors are theological.

  *   **Disagreement about Priors:** This is the engine of the stalemate. In Bayesian terms, the criteria attempt to assess the Likelihood $P(E|H)$ (Probability of the Evidence given the Hypothesis that Jesus said it). But the conclusion depends heavily on the Prior $P(H)$ (Probability that Jesus said it before looking at the specific evidence).
  *   **Theological Priors:** Yes, the priors are theological, though often disguised as historical assumptions.
      *   **Skeptical Prior:** Assumes the Early Church was prone to creating sayings to solve theological problems. (Prior probability of authenticity is low).
      *   **Trusting Prior:** Assumes the Early Church was constrained by memory and reverence for the Teacher. (Prior probability of authenticity is high).
  *   **The Hidden Work:** Neither side will own this because admitting it undermines the claim to "historical" (i.e., objective) neutrality. But the criteria cannot shift the posterior probability significantly if the priors are vastly different. A maximalist and a minimalist can apply the Criterion of Multiple Attestation to the same text and reach opposite conclusions because their baseline expectation of the tradition's reliability differs. The criteria are not doing the heavy lifting; the priors are.

  ### 3. What Counts as Progress?

  Given this diagnosis, the field is stuck because it is trying to solve a probabilistic, holistic problem with binary, atomistic tools.

  **What WOULD Count as Progress:**

  1.  **Reframing Authenticity as Explanatory Power:** Progress requires abandoning the question "Did Jesus say this?" in favor of "Does attributing this to Jesus explain the origin and shape of the tradition better than the alternative?" This shifts the burden from *verification* to *explanation*.
  2.  **Explicit Accounting of Priors:** Progress requires historians to state their priors regarding the nature of the Gospel tradition (e.g., "I am operating with a prior that assumes oral tradition preserves gist but not verbatim wording"). If the priors are made explicit, the disagreement moves from "your method is wrong" to "our starting assumptions differ," which is a more honest and productive stalemate.
  3.  **Probabilistic Reformulation:** Progress requires treating the output of the criteria as gradients of probability, not binary filters. A saying is not "authentic"; it is "consistent with the hypothesis of a Jewish apocalyptic prophet."
  4.  **Dissolving the "Historical Jesus" Object:** The most significant progress would be an argument that the "Historical Jesus" (as a construct distinct from the "Christ of Faith" or the "Jesus of Memory") is not a well-defined object of inquiry. If the object is ill-defined, the tools cannot be validated. Acknowledging this would end the pretense of scientific reconstruction.

  **What Would NOT Count (Pseudo-Progress):**

  1.  **New Criteria:** Proposing a "Criterion of Historical Congruence" or "Criterion of Rejectability" adds complexity but does not solve the lack of a gold standard or the problem of priors. It is rearranging deck chairs.
  2.  **New Manuscripts:** Discovering a new fragment (like the Gospel of Jesus's Wife) does not solve the epistemic gap regarding the *canonical* tradition. It adds data, but the methodological problem is how we process the *existing* data, not the quantity of it.
  3.  **More Vivid Reconstructions:** A more psychologically nuanced portrait of Jesus is still a portrait. If the method of construction remains the same (using the criteria as verification tools), the result is just better art, not better history.
  4.  **Consensus on Specific Sayings:** Even if the field agreed that the Lord's Prayer is authentic, it would not validate the *method*. It might just mean the priors converged temporarily. Methodological progress requires validating the *process*, not just agreeing on an *outcome*.

  ### 4. Can the Impasse Be Moved?

  Here is the honest answer: **The methodological impasse can be dissolved, but the substantive disagreement cannot be solved.**

  *   **Dissolving the Method:** You can teach your students that the Criteria of Authenticity are not scientific tests but formalized heuristics for assessing explanatory coherence. If the field accepts this, the "critics" win the methodological argument (the criteria don't prove anything), but the "practitioners" can keep working (the criteria help build plausible models). This dissolves the anger.
  *   **The Substantive Stalemate:** The disagreement about *what actually happened* rests on the priors (theological/philosophical assumptions about memory, revelation, and human nature). These cannot be settled by historical evidence because they determine how the evidence is weighed in the first place.

  **Recommendation for the Seminar:**
  Do not try to resolve whether the criteria work. Teach the criteria as **rhetorical devices** that reveal the historian's priors. When a historian uses the Criterion of Dissimilarity, they are revealing a prior that Jesus must be unique. When they reject it, they are revealing a prior that Jesus must be intelligible within Judaism.

  The progress lies not in a better toolkit, but in the realization that the toolkit is a mirror. The impasse will remain as long as historians believe they are excavating an object rather than constructing a model. If you can get your students to see the "Historical Jesus" as a hypothesis rather than a discovery, the criteria cease to be a source of conflict and become what they always were: tools for narrative coherence.
