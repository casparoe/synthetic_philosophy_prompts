prompt: |-
  My buddy Omar and I got into a long argument last night about "uncertain evidence" and I honestly still can't tell who came out ahead. His line: the problem is fake, because you can always convert uncertain evidence into certain evidence. If I'm not sure whether the shirt is blue, what I'm actually certain of is how it looks to me, or that my credence in "blue" just went to 0.7 — and that's a proposition, so I just ordinary-conditionalize on it. So on his view Jeffrey's rule is solving a problem that dissolves. My line: fine, but conditionalizing on "my credence in blue is now 0.7" only reproduces Jeffrey's rule if you assume that learning it leaves P(blue | looks blue-ish) untouched — the rigidity thing — and that assumption is basically the content of the rule, so he's assuming what he wants to derive. He said every update rule assumes something, then turned it around: if rigidity can fail, then Jeffrey's rule is in trouble too, not just his reduction, so my objection proves too much. He also thinks conditionalizing on a fact about your own credences is wierd — you're treating a fact about you as evidence about the shirt. We went around like that for an hour and just got annoyed at each other. Can you adjudicate move by move — who's right about the conversion trick, about the rigidity point, and about the "proves too much" comeback — and say what we're both missing? An example would help; maybe try the case where a friend tells you the party was "packed" and the fact that she picked that word itself tells you something about how far to trust her report.
