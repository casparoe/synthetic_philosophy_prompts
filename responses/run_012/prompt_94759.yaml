prompt: |-
  Alright, I have to give a comment at a workshop on cultural evolution next month and I want to get my own position straight before I open my mouth, so I'm writing it out as a list and asking you to audit it. Here's where I've landed:

  1. Culture is a genuinely Darwinian process. Heritable variation in what gets transmitted, differential transmission, lineages — the whole thing, and I take the substrate-neutral reading of it: one abstract algorithm, many realisers, so the fact that what's being transmitted is ideas rather than nucleotides is beside the point.

  2. The meme is still the right unit for this. If differential transmission is going to do real explanatory work you need a replicator, i.e. something whose causal role is to get itself copied, with enough fidelity that you can trace lineages and let selection accumulate small improvements over generations. That fidelity is also what underwrites cumulative culture — the ratchet, where each generation starts from the last one's gains instead of from scratch.

  3. But I also think cultural inheritance is reconstructive rather than replicative. The learner rebuilds the item out of cues and her own priors; it isn't copied off the model. So fidelity is low, lineages blend, and what survives a transmission event is partly a product of the reciever's own dispositions rather than of the item transmitted.

  4. And cultural evolution is Lamarckian in a way genetic evolution isn't — acquired modifications get passed on — which I take to be the main structural diference between the two.

  5. The best explanation we have for the spread of genuinely costly prosocial norms is cultural group selection: groups whose norms made them better at coordinating and outcompeting their neighbours spread at the expense of groups without them.

  6. At the same time I'm fairly convinced most cultural change isn't adaptive in any interesting sense — it's drift plus content biases and prestige bias (copying whoever's high-status) — so for most of what we observe I'd rather not invoke selection for group benefit at all.

  Which of these actually conflict, which only look like they do, and how bad is each conflict? Order them by severity, give me the cheapest repair for each real one, and say honestly what the repair costs me. I genuinely don't know which of the six is the weak link, so don't be diplomatic about it.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is preparing a comment for a workshop on cultural evolution.
      *   **Task:** Audit a list of 6 positional statements.
      *   **Goal:** Identify conflicts (real vs. apparent), order them by severity, suggest the "cheapest repair" for real conflicts, and honestly assess the cost of that repair.
      *   **Tone:** Direct, critical, non-diplomatic ("don't be diplomatic about it").
      *   **User's Stance:** A mix of Dual Inheritance Theory (DIT), Memetics, and Constructivist/Cognitive approaches.

  2.  **Analyze the Six Statements:**
      *   *1. Darwinian Process:* Culture is genuinely Darwinian (variation, selection, heredity). Substrate-neutral.
      *   *2. The Meme:* The meme is the right unit. Needs high fidelity for lineages/cumulative culture (the ratchet). Replicator focus.
      *   *3. Reconstructive Inheritance:* Cultural inheritance is reconstructive (low fidelity, blending, receiver-driven).
      *   *4. Lamarckian:* Cultural evolution is Lamarckian (acquired traits passed on).
      *   *5. Cultural Group Selection (CGS):* Best explanation for *costly prosocial norms*.
      *   *6. Non-Adaptive Change:* Most change is drift/bias, *not* adaptive selection (especially not group benefit).

  3.  **Identify Potential Conflicts:**

      *   **Conflict A: Statement 2 (Meme/High Fidelity) vs. Statement 3 (Reconstructive/Low Fidelity).**
          *   *Analysis:* Statement 2 claims we need high fidelity for lineages and the "ratchet." Statement 3 claims fidelity is low and inheritance is reconstructive. This is the classic "Replicator vs. Reconstructor" debate (Dawkins/Blackmore vs. Sperber/Morin).
          *   *Severity:* High. These seem mutually exclusive on the surface. If fidelity is too low (Stmt 3), the "meme" as a replicator (Stmt 2) doesn't work well enough to sustain the ratchet.
          *   *Resolution:* Need to nuance what "fidelity" means. Is it copy fidelity or outcome fidelity?

      *   **Conflict B: Statement 1 (Darwinian) vs. Statement 4 (Lamarckian).**
          *   *Analysis:* Darwinian evolution is typically defined by blind variation and selection. Lamarckian involves directed variation (use/disuse acquired traits passed on). Statement 1 says it *is* Darwinian. Statement 4 says it *is* Lamarckian.
          *   *Severity:* Low/Medium. This is often a terminological dispute. Many cultural evolutionists argue it's Darwinian *in pattern* even if Lamarckian *in mechanism*. Or that Lamarckian processes can be subsumed under a generalized Darwinian algorithm.
          *   *Resolution:* Clarify that "Darwinian" refers to the population-level dynamic, while "Lamarckian" refers to the transmission mechanism.

      *   **Conflict C: Statement 5 (CGS for Norms) vs. Statement 6 (Mostly Drift/Bias).**
          *   *Analysis:* Statement 5 says CGS explains *costly prosocial norms*. Statement 6 says *most* change isn't adaptive/group benefit.
          *   *Severity:* Low. Statement 5 is specific to a subset (costly prosocial norms). Statement 6 is about the majority of cultural change. They can coexist (Pareto principle: 20% of traits drive 80% of group success, or similar).
          *   *Resolution:* Ensure the scope distinction is clear.

      *   **Conflict D: Statement 2 (Meme/Replicator) vs. Statement 1 (Substrate Neutral).**
          *   *Analysis:* If it's substrate neutral, why insist on "memes" (which implies a specific ontology of ideas as replicators)? Some substrate-neutral accounts prefer "cultural traits" or "variants" without committing to the replicator ontology.
          *   *Severity:* Medium. It's a theoretical commitment issue.

  4.  **Deep Dive into the Major Conflict (2 vs. 3):**
      *   This is the biggest theoretical tension. Henrich & Boyd (2002) vs. Sperber (1996).
      *   Stmt 2 says: Need high fidelity for cumulative culture.
      *   Stmt 3 says: Inheritance is reconstructive (low fidelity).
      *   *The Fix:* "Copy fidelity" vs. "Inferential fidelity." Or, the idea that *some* traits act as replicators (technologies) while others are reconstructive (beliefs). Or, that reconstruction *preserves* function even if form changes.
      *   *Cheapest Repair:* Adopt the "Attractor" model. Ideas reconstruct, but they reconstruct *towards* stable points (attractors). This preserves lineages without needing high-fidelity copying.
      *   *Cost:* You have to weaken the definition of "meme." It's no longer a discrete replicator; it's a stable attractor in cognitive space.

  5.  **Deep Dive into the Darwinian vs. Lamarckian Conflict (1 vs. 4):**
      *   Stmt 1: Darwinian algorithm.
      *   Stmt 4: Lamarckian mechanism.
      *   *The Fix:* Generalized Darwinism. Campbell's blind variation and selective retention. But cultural variation isn't blind.
      *   *Cheapest Repair:* Frame it as "Darwinian dynamics emerging from Lamarckian mechanisms."
      *   *Cost:* You concede that the *source* of variation isn't Darwinian, only the *filtering* is.

  6.  **Deep Dive into CGS vs. Drift (5 vs. 6):**
      *   Stmt 5: CGS explains *costly prosocial norms*.
      *   Stmt 6: *Most* change is drift/bias.
      *   *The Fix:* Scope limitation.
      *   *Cheapest Repair:* Explicitly limit CGS to the "ultrasocial" suite of traits.
      *   *Cost:* You admit CGS is a special-purpose tool, not a universal explanation.

  7.  **Ordering by Severity:**
      1.  **2 vs. 3 (Replicator vs. Reconstructor):** This is the core ontological clash. If you can't resolve this, your theory of *how* culture evolves is broken.
      2.  **1 vs. 4 (Darwinian vs. Lamarckian):** This is definitional but matters for how you model variation.
      3.  **5 vs. 6 (CGS vs. Drift):** This is empirical scope. Easiest to fix.

  8.  **Drafting the Audit:**
