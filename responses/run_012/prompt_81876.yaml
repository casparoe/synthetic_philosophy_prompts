      *   Detection implies location reveal.
      *   There is a risk of hostile intent.
      *   Physics constraints (speed of light) apply.
      *   We don't know the distribution of civilizations (hostile vs. benign).
      *   The stakes are existential.

  4.  **Identify Load-Bearing Features:**
      *   *First Strike:* Can it wipe out a civilization completely before retaliation? (DFT: Yes. CO: Maybe not/Too costly).
      *   *Chain of Suspicion:* Is it unbreakable? (DFT: Yes, due to lag and uncertainty. CO: No, reputation/protocols can build).
      *   *Credible Signaling:* Can you prove you are nice? (DFT: No, technology can mask intent. CO: Yes, via costly signaling or transparency).
      *   *Game Iteration:* Is it one-off or repeated? (DFT: One-off/long lag makes it effectively one-off. CO: Repeated interactions build norms).

  5.  **Identify What It Does *Not* Depend On:**
