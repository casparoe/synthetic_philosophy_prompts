      *   **Format:** Continuous prose. No headings, bullet points, bold text, or tables.

  2.  **Deconstruct the Perspectives:**
      *   *Dark Forest Theorist (DFT):* Universe is dangerous. Resources finite. Survival is primary goal. Technology explodes. Distance makes communication slow. Chain of suspicion makes trust impossible. Preemptive strike is the only safe strategy. Broadcasting = death.
      *   *Contact Optimist (CO):* Universe might be cooperative. Advanced civilizations might be post-scarcity or ethical. First strikes might be impossible or detectable. Signaling allows coordination. Silence guarantees isolation; signaling offers potential gain. Risk is manageable or worth it.

  3.  **Identify Common Ground (Shared Claims):**
