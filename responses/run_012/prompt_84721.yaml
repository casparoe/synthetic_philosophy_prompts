answer: |-
  Here is the verdict: **Mechanistic Interpretability is methodologically committed to Causal Realism, but rhetorically invested in Ontological Realism. This mismatch is the field's original sin.**

  The workflow strictly requires that activations be **causally isolatable**. It does *not* require that features be **ontologically fundamental**. The day-to-day work functions perfectly well under the view that "features" are useful coordinate systems we impose on a continuous manifold to make it legible to humans. However, the field's marketing—and often its internal motivation—relies on the stronger claim that SAEs are discovering the model's "native language" or "true ontology."

  Here is the breakdown of what holds, what breaks, and where the underdetermination lies.

  ### 1. What the Workflow Strictly Needs (Causal Realism)
  To do mechanistic interpretability, you do not need features to be "real" in the sense of being Platonic atoms of thought. You need them to be **causal handles**.

  *   **Causal Leverage:** The workflow requires that if you intervene on a specific direction (or feature activation), the model's output changes in a predictable, semantic way. If ablating the "Golden Gate" direction stops the model from talking about San Francisco without breaking grammar, that direction is *causally real* relative to the model's input-output map.
  *   **Sparsity (as a constraint, not a discovery):** The workflow needs the representation to be sparse *enough* for a human to trace a circuit. If every concept is distributed across 100% of neurons with equal weight, tracing is impossible. SAEs enforce this sparsity via an L1 penalty.
  *   **Stability:** You need the feature to persist across different inputs of the same class.

  **Verdict:** The math works fine here. Causal influence is basis-independent. If a subspace controls a behavior, rotating the basis doesn't change the fact that the subspace controls the behavior. The workflow survives the "rotation argument" because it cares about *subspaces*, not specific basis vectors, even if practitioners talk about vectors.

  ### 2. What is Underdetermined (The Ontological Overreach)
  This is where the field is lying to itself. The claim that SAEs reveal the model's "actual ontology" is unsupported by the math and contradicted by the arbitrariness points you raised.

  *   **The Basis Problem:** You are correct about rotation. In a standard transformer residual stream, any orthogonal rotation preserves the function. There is no "true" basis inherent to the architecture. SAEs find *a* basis that satisfies sparsity, not *the* basis the model "uses." The model doesn't "use" a basis; it uses a function. The basis is an artifact of the SAE's training objective, not a discovery of the model's mind.
  *   **The Probe Problem:** High probe accuracy proves **information availability**, not **mechanism**. As you noted, you can probe random labels. You can also probe "negation" or "future tense" in layers that have nothing to do with grammar mechanically, simply because the information is linearly recoverable from the rich embeddings. A probe finding "capital city" at 94% accuracy means the information is *there*, not that the model is *using* a "capital city variable" to compute the next token.
  *   **Feature Granularity:** Is there a "Golden Gate Bridge" feature? Or a "San Francisco" feature? Or a "suspension bridge" feature? SAEs will find *something* depending on the dictionary size (expansion factor). The "ontology" shifts based on your hyperparameters. Real ontology shouldn't depend on your dictionary size.

  **Verdict:** The claim that we are finding the model's "native features" is false. We are finding **human-interpretable projections** of the model's state space. We are forcing the model to speak our language, not learning its language.

  ### 3. What Would Break if You Swapped the View
  If the field publicly adopted the deflationary view ("Features are just useful fictions for causal tracing"), three things would break:

  1.  **The "Safety Case" for Interpretability:** The pitch to regulators and safety researchers is: "We can find the deception feature and turn it off." This requires Ontological Realism. If features are just arbitrary sparse projections, you can't guarantee you found *the* deception feature, only *a* direction that correlates with deception in your training distribution. The guarantee of robustness evaporates.
  2.  **The Motivation for SAEs vs. Dense Probes:** If features aren't "real," why bother with the computational expense of SAEs? Why not just use dense linear probes? The answer is that dense probes aren't causally isolatable (you can't ablate one dimension of a dense probe without affecting others). So, the *engineering* holds, but the *science* (discovering ontology) collapses into *reverse engineering*.
  3.  **Cross-Model Universality:** The hope that "Feature 492 in Model A is the same as Feature 103 in Model B" relies on Ontological Realism. If features are artifacts of the SAE training process, there is no reason to expect them to align across architectures. The "universal features" research program would lose its theoretical grounding.

  ### 4. The Control Task & Rotation Rebuttal
  The field has answers to your criticisms, but they are defensive, not offensive.

  *   **Random Labels:** Practitioners know this. That's why "control tasks" are now standard. If a probe decodes random labels, it means the probe is overfitting or the space is high-dimensional enough to shatter any labeling. The defense is: "We compare against random baselines." This admits that high accuracy alone isn't enough; you need *significant* accuracy over baseline. This concedes that representation is not binary (real/not real) but a matter of degree of structure.
  *   **Rotation:** The defense here is the **Sparse Coding Hypothesis**. The argument is that while the *architecture* allows rotation, the *training process* (SGD on natural language) breaks the symmetry. The model *chooses* a basis that minimizes loss, and that basis happens to be sparse and interpretable.
      *   *My Counter:* This is an empirical bet, not a mathematical necessity. SGD might find a sparse basis, but it might also find a dense, entangled basis that generalizes better. SAEs *force* sparsity. Therefore, SAEs are measuring "how well can we force sparsity on this model?" not "how sparse is this model naturally?"

  ### Final Verdict
  The practice presupposes **Instrumental Realism**. It treats features *as if* they are real to facilitate causal tracing, but it cannot sustain the claim that they are the model's fundamental ontology without contradicting the rotational freedom of neural activations.

  The field is effectively **reverse-engineering a compiler without the source code, assuming the compiler optimized for human-readable variable names.** Sometimes it did (e.g., induction heads). Mostly, it didn't. The SAE is a tool that translates the compiler's optimized assembly back into C-like code. The C-code variables are "real" to the human reader, but they are not "real" in the assembly.

  Mech Interp works because the translation is good enough to find bugs. It fails as a science of "mind" because it confuses the translation for the original thought.

  **Confidence:** 85%
  *(15% uncertainty reserved for the possibility that SGD inductive biases are stronger than currently understood, potentially making the "natural basis" more unique than the rotation argument suggests.)*
