answer: |-
  Based on your verdicts and the "residue test" you are inclined to accept, here is a precise formulation of the principle that captures your position, followed by the required analysis.

  ### The Principle of Symmetric Moral Residue

  A situation constitutes a **genuine moral dilemma** if and only if the following four conditions are met:

  1.  **The No-Fault Condition:** The agent is not morally responsible for the existence of the conflicting circumstances.
      *   *Motivated by:* **Incompatible Promises.** (You ruled this out because the wrongness traced to the earlier fault of making incompatible promises.)
  2.  **The Universal Wrongness Condition:** Every available course of action violates a *binding, agent-relative obligation*.
      *   *Motivated by:* **The Doctor** and **The Judge.** (You ruled these out because only one option involved a wrong *by the agent*; the negative outcome of the other option was a tragedy or the wrong of others, not a violation of the agent's binding duty.)
  3.  **The Survival Condition:** The obligations violated are of a type that generate a moral debt that survives the impossibility of fulfillment (typically specific commitments or rights), rather than general duties of care constrained by physical possibility.
      *   *Motivated by:* **The Parent** vs. **The Soldier.** (This distinguishes why the parent owes nothing to the drowned child, while the soldier owes reparation to the mother. Parental duty is constrained by "ought implies can"; promissory duty creates a debt that survives inability.)
  4.  **The Residue Condition:** Whichever option is chosen, the agent incurs an objective **moral liability** (to apologize, compensate, or make reparation) that is not discharged by the necessity of the choice.
      *   *Motivated by:* **The Spy** and **The Soldier.** (You identified these as dilemmas because reparation is owed either way.)

  ***

  ### Clarification on "Residue"

  To answer your specific questions on the nature of the residue:

  *   **Moral vs. Psychological:** The residue must be a **moral remainder**, not merely psychological. The parent in the drowning case will feel tragic regret (psychological), but owes no debt (moral). The soldier owes a debt (moral) regardless of their feelings.
  *   **Blame vs. Liability:** The principle entails **liability**, not necessarily **blame**. In a genuine dilemma, the agent does "wrong" (violates an obligation), but because the situation was unavoidable (No-Fault Condition), they may be *excused* from blame (reactive attitudes like resentment are inappropriate). However, they remain *liable* to make amends. This explains why the soldier "owes reparation" even if we do not condemn him as a bad person.

  ***

  ### Prediction for the New Case

  **Case:** Is it permissible to break a trivial promise to meet a friend for coffee in order to save a stranger from serious harm?

  **Prediction:** **Not a genuine dilemma.**

  **Reasoning:** This fails the **Universal Wrongness Condition** and the **Survival Condition**.
  1.  While breaking a promise is *prima facie* wrong, trivial promises are generally understood to be overridden by significant harm prevention. The obligation to the friend is not "binding" in the face of a stranger's serious harm.
  2.  Even if one argues the promise is technically violated, it fails the **Residue Condition**. You would not owe the friend compensation or a moral apology beyond a practical explanation; the liability is discharged by the overriding necessity of saving a life. There is no "moral remainder" that survives the choice.

  ***

  ### Honest Assessment: Which Verdicts Cannot Be Accommodated?

  The principle above accommodates your verdicts on the Doctor, Judge, Spy, and Prior Fault cases robustly. However, there is a tension in your verdicts regarding **The Parent** vs. **The Soldier** that the principle must bridge via a controversial moral assumption.

  **The Tension:**
  You rule that the **Parent** does not wrong the drowned child (no residue), but the **Soldier** does wrong the mother (residue owed).
  *   **The Problem:** Both cases involve special relationships and physical impossibility. Why does the parental duty dissolve upon impossibility, while the promissory duty survives as a debt?
  *   **The Accommodation Failure:** If one holds that parental duties are just as binding as promissory duties, the principle cannot accommodate your verdict on the Parent without appearing arbitrary. The principle relies on the **Survival Condition** (Clause 3), which asserts that *commitments* create debts that survive impossibility, whereas *duties of care* do not.
  *   **Honest Verdict:** If you believe the parent *should* owe some form of moral residue to the drowned child (e.g., a lifelong debt of regret or symbolic reparation), then this principle fails. It forces a distinction between "care" and "promise" that some moral theories reject. To maintain your verdict that the Parent case is *not* a dilemma while the Soldier case *is*, you must accept that promises create a unique kind of moral debt that general welfare duties do not.

  **Summary:** The principle captures your current set of verdicts precisely, provided you accept the deontological distinction that **promissory obligations generate surviving liabilities in a way that parental duties of rescue do not.** If you later decide the parent *does* owe a moral debt to the drowned child, Clause 3 of the principle must be rejected, and the Parent case would be reclassified as a genuine dilemma.
