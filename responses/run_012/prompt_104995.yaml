prompt: |-
  My friend and I spent basically all of last night arguing about the sphex wasp and whether it shows we're all just machines, and now I can't stop thinking about it. Quick version of the case in case you don't have it memorized: the wasp digs a burrow, drags a paralyzed cricket to the mouth of it, goes inside to check the burrow, comes back out — and if you just move the cricket a few inches while she's in there, she'll drag it back to the mouth, go in again, come out, and keep looping like that basicly forever. My friend's take is that we're exactly the same, we just have alot more branches in the loop, and that the line between mechanical routine and genuine flexible choice is a myth we tell ourselves. I think there's a real difference — she can't step back and notice what she's doing, she's stuck inside the rule, and we (sometimes) can. But then he asked what the difference actually is and I kind of floundered.

  So here's what I want. Say I've got a year to actually work on this and try to contribute something, not just read the classics. Which open questions around sphexishness actually matter most for the free-will / agency debate, and in what order would you tackle them? For each one give me the reasoning, not just a label: is it upstream of the others or downstream, is it a real question or does it collapse into something else once you push on it (like, does sphexish just turn out to mean determined, in which case isn't this the same old free will fight in new clothes?), how tractable is it without doing any empirical work, and what would actually move it up or down your ranking — some case where a thing that looks rigid turns out to be flexible or the reverse, a cleaner way to state the stepping-outside-your-own-rule capacity, whatever. And tell me which of them is the trap that looks deep but doesn't change any verdict downstream. Don't hand me a reading list — I can find the papers. I want the agenda and the argument for it.
