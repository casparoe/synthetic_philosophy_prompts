      *   *Social Externalism (Burge):* Arthritis case. What I mean depends on community usage, even if my conception is faulty.
      *   *Key Distinction:* Narrow content (internal) vs. Wide content (external).
      *   *Settled vs. Contested:* It's settled that reference often depends on causal history (Kripke/Putnam). It's contested whether *all* content is wide, or if there's a residual narrow content that explains cognitive significance. It's contested how this applies to fiction/art.

  3.  **Deconstruct the Story ("Pierre Menard"):**
