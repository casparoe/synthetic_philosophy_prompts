answer: |-
  Dear colleague,

  I have been thinking over your proposal to close the term with Borges rather than another paper, and while I share your enthusiasm for the choice, I want to honour your request to treat the philosophical difficulty seriously rather than glossing it over. There is a genuine temptation, when pairing Pierre Menard with Twin Earth, to treat the story as a charming literary illustration of the thesis that meaning ain't in the head. On the surface, the parallel is seductive. In the Twin Earth thought experiment, we hold the subject's internal state fixed and vary the environment, concluding that Oscar1 and Oscar2 mean different things by water despite being intrinsic duplicates. In Borges's story, we seem to hold the text fixed and vary the historical context of its production, concluding that Menard's Quixote means different things than Cervantes's despite being verbatim identical. In both cases, identity of output does not guarantee identity of content, because content depends on something external to the immediate object of inspection. However, if we press on this analogy, as I think we must for a final session, we find that the stress points reveal more about the limitations of our semantic theories than about their confirmation. I suspect the connection is indeed a bit of a stretch, but it is a productive one, provided we are clear about where the fabric tears.

  The first thing we must disentangle is the locus of the externalism. In the Putnamian framework we have studied, the external facts that determine meaning are largely causal and environmental; the substance in the lakes determines the extension of the term water. In Burge's social externalism, it is the normative usage of the linguistic community that fixes the content of concepts like arthritis. In both cases, the externalism is meant to secure the reference or truth conditions of thoughts and utterances against the vagaries of individual conception. Menard, however, presents a different kind of externality. The narrator insists that Menard's text is richer not because the community usage of Spanish changed between the seventeenth and twentieth centuries, nor because the causal history of the word Quixote altered its reference, but because of the specific intellectual biography of the author. This leans heavily towards a form of intentionalism that standard content externalism often seeks to marginalise. For the externalist, what I mean is often determined by what my community means, regardless of my private intentions. For Borges's narrator, what Menard means is determined precisely by his private, idiosyncratic intention to arrive at the text through a specific historical route. If we apply strict social externalism, Menard's words should mean what twentieth-century Spanish speakers take them to mean, not what Menard privately loaded them with via his symbolicist methodology. The story thus presses on a distinction between what a sentence means in a public language and what a speaker means by uttering it, a distinction that Twin Earth often blurs in the service of metaphysical claims about reference.

  This leads us directly to the aesthetic question, which I know is of particular interest to several members of the group. The philosophical puzzle here is whether Menard has written the same work as Cervantes. If we adopt a textualist view, where a work of art is identical to the sequence of words constituting it, then Menard has simply produced a copy, however laborious. But the narrator insists that Menard's Quixote is a different work, or at least a richer version of the same work, because of its history of production. This aligns closely with what Jerrold Levinson and others have argued regarding the historical individuation of artworks: that a work is not just a structure but a structure-as-indicated-by-a-person-at-a-time. Here, the externalism is about the identity of the artefact itself, not merely the content of the thoughts expressed. An externalist about mental content might comfortably agree that the work is different because the act of creation is different, but they might baulk at the claim that the meaning of the sentences themselves has changed. If Menard writes 'history' in 1934, does the term refer to something different than when Cervantes writes it in 1605? A semantic externalist would say yes, because the causal history of the term has changed, but Borges's narrator suggests the difference lies in the nuance and the philosophical weight, not merely the extension. This suggests that the story is operating in the realm of hermeneutics and aesthetic value, whereas our term has been occupied with metaphysics and truth conditions. To treat Menard as a straightforward parable for Twin Earth risks conflating the conditions for being the same work of art with the conditions for having the same semantic content.

  There is a moment in the story that an externalist cannot comfortably accommodate without significant qualification, and we should not smooth it over. The narrator claims that Menard's text is subtly richer than Cervantes's, specifically citing passages where the archaic language of Cervantes becomes a deliberate stylistic choice for Menard. For the externalist, meaning is typically compositional and stable across tokens of the same type within a linguistic community; if I say 'fire' and you say 'fire', we share content because we share a language and a world. Borges suggests that two tokens of the same sentence type can have radically different cognitive significance solely due to the author's history, even if the public language remains constant. This challenges the idea of a stable public language which underpins both Putnam's and Burge's arguments. If meaning is this volatile, dependent on the unique genetic history of each utterance, then communication becomes nearly impossible, as we would never know if we were sharing the same content. Twin Earth relies on the stability of meaning within a world to highlight the difference between worlds; Menard suggests instability within a single world based on individual history. This looks less like content externalism and more like a radical contextualism about interpretation. It suggests that there is a layer of meaning—perhaps what we might call aesthetic or expressive content—that is entirely sensitive to the history of production in a way that standard semantic externalism does not capture. We might say that externalism accounts for the reference, while Borges is pointing to the significance, but the story insists that this significance is part of the text's meaning, not just our reaction to it.

  Furthermore, we must consider the question of narrow content. Some philosophers have argued that while reference is wide, there remains a narrow component of content that is determined solely by the individual's internal state, which explains cognitive role and behaviour. Menard complicates this. Menard and Cervantes are not internal duplicates; Menard has a vast history of reading and reasoning that Cervantes lacks. Yet they produce the same text. If we view the text as the output of their cognitive states, Menard's case suggests that vastly different internal histories can converge on the same output, yet the meaning differs. This is the inverse of Twin Earth, where the same internal history diverges on meaning due to external factors. Menard shows that the same external output converges from different internal histories, yet the meaning diverges. This might tempt us to say that the text itself is merely a vehicle, and the real content is the process of generation. But if that were true, we would never be able to read Cervantes without knowing his biography, which contradicts our ordinary practice. The story thus highlights a tension between the autonomy of the text and the necessity of context. It suggests that while externalism correctly identifies that meaning is not solely in the head, it may underestimate the extent to which meaning is also not solely in the world, but in the relationship between the two, a relationship that is normative and historical rather than merely causal.

  I think it is important to acknowledge that using Menard to close a term on externalism risks category confusion. Twin Earth is a argument about the metaphysics of mind and language, designed to test intuitions about natural kind terms and reference. Menard is a fiction about aesthetics, authorship, and the nature of reading. To treat Borges as doing the same work as Putnam is to ignore the literary genre's capacity for irony and ambiguity. The narrator of Menard is not necessarily reliable; the story is a satire on scholarship and interpretation as much as it is a metaphysical puzzle. However, this unreliability is precisely what makes it a valuable counterpoint to the journal article. A paper on externalism must argue for a thesis and defend it against objections; it must strive for clarity and consistency. Borges's story can hold contradictory ideas in tension without resolving them. It allows us to feel the pull of intentionalism while acknowledging the reality of the text. It captures the phenomenology of reading, where we do feel that knowing an author's history changes what we hear in the words, even if our semantic theories struggle to codify that change. A journal article tells us what meaning is; the story shows us what it feels like when meaning slips away from the text and hides in the history.

  So, where does this leave us for the session? I suggest we present the story not as a confirmation of externalism, but as a probe into its boundaries. We can ask whether the externalism we have studied applies to works of art in the same way it applies to natural kind terms. We can ask whether the identity of a work of art is governed by the same principles as the identity of a mental state. And we can ask whether there is a residue of meaning that remains in the text, a narrow content that Menard and Cervantes share, even if the wide content differs. The story contributes to the debate by reminding us that meaning is not just a matter of reference or truth conditions, but also of value, history, and human effort. It warns us against a sterile externalism that ignores the agency of the speaker. If Twin Earth teaches us that the world is in the head, Menard teaches us that the head is in the history. But it also warns us that if we push this too far, the text dissolves entirely into its context, and we are left with nothing to read. That is a tension no paper can sustain as gracefully as Borges does, and it is why, despite the stretch, it is the perfect place to end.

  I hope this helps you frame the discussion. It seems to me that the value of the session will lie not in forcing the story to fit the philosophy, but in letting the friction between them generate heat. We should be prepared to admit that Borges might be talking past Putnam, but that in doing so, he reveals something about our linguistic practices that the formal arguments miss. Let us not seek a tidy synthesis, but rather enjoy the discomfort of the mismatch.

  Yours sincerely,

  A Colleague
