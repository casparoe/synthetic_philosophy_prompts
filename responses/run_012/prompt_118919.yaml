answer: |-
  A municipal housing authority deploys a transparent linear model to allocate limited eviction-prevention grants, scoring applicants on "one-year stability probability" using verified income and lease history. Mr. Henderson is denied funds when a single late payment from three years ago triggers a weighted penalty that drops his score below the funding cutoff, leading to his eviction and subsequent injury during homelessness. The data team selected the penalty based on historical correlation with default; the policy team set the cutoff to maximize total grants within a fixed budget; the caseworker applied the score per mandatory protocol established to eliminate discretionary bias. The system functioned exactly as specified, the harm was a known statistical inevitability of rationing, yet no individual actor could have predicted Henderson's specific denial without violating their respective mandates to maximize accuracy, budget efficiency, or procedural fairness.

  **1. Exonerating the Candidates**
  To show the gap is real rather than stipulated, we must observe that each actor faced a conflicting duty that prevented them from averting the harm. The **data scientists** are off the hook because their mandate was predictive validity; removing the penalty for late payments would degrade the model's accuracy, causing more grants to be wasted on unsuccessful placements overall. The **policy managers** are off the hook because their mandate was fiduciary stewardship; lowering the cutoff to include Henderson would exceed the budget, forcing the denial of another applicant further down the list. The **caseworker** is off the hook because their mandate was equitable compliance; reinstating discretion to save Henderson would reintroduce the subjective bias the protocol was specifically designed to prevent, harming other protected classes. Each actor fulfilled their specific duty, yet the composition of those duties produced the harm.

  **2. Testing Proposed Solutions**
  *   **Strict Liability on the Operator:** This forces the agency to compensate Henderson, but it does not close the moral gap; it merely relocates the cost to taxpayers or reduces the budget for future applicants. It treats the harm as a cost of business rather than a fault, leaving the question of moral responsibility unanswered.
  *   **Duty of Care on the Builder:** This fails because the builders met the standard of care for their profession (creating an accurate, documented model). Imposing liability here would require them to guarantee individual outcomes, which is impossible for a triage system, effectively punishing them for doing their job correctly.
  *   **Collective Responsibility on the Team:** This dissolves responsibility rather than locating it. If the entire team is blamed, no individual is held accountable, and since every individual acted defensibly, punishing the collective penalizes right action, creating a disincentive for following protocols.

  **3. The Single Feature and Its Removal**
  The feature doing the work is **the segregation of optimization constraints across distinct roles**. The data team optimizes for *truth*, policy for *utility*, and the worker for *fairness*. No single agent holds the authority to balance all three against an individual's need. If we remove this feature by **consolidating authority** into a single Director who sets the weights, the cutoff, *and* holds discretion for exceptions, fault snaps back into place. This Director would see directly that the rule sacrifices Henderson. If they maintain the rule without an exception mechanism, they are directly choosing Henderson's harm for the sake of efficiency, making them morally culpable for the specific trade-off.

  **4. The Skeptic's Case**
  A skeptic would argue the gap is an illusion because **leadership was at fault for designing a system without a safety valve.** They would claim that removing human discretion entirely is itself a reckless act, regardless of the bias risks, because it abdicates the ultimate duty of care to a algorithm. What survives of my scenario is the tension between systemic fairness and individual mercy; however, if the skeptic is right, the "no fault" claim collapses into "misplaced fault." The scenario only holds if we accept that the removal of discretion was a defensible response to documented systemic bias, creating a tragic conflict where preventing one type of harm (bias) necessitated risking another (individual denial), leaving a moral remainder where "fault" is no longer the applicable category.
