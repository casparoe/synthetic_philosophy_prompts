answer: |-
  This is a classic problem in the philosophy of science, and your intuition is actually much more sophisticated than your friend's "F-Twist" absolutism. You are grappling with the distinction between **idealization** (simplifying to see a mechanism) and **distortion** (removing the mechanism itself).

  Here is the principle that reconciles your verdicts, followed by how it applies to your torn cases and new examples.

  ### The Principle: Structural Stability (or "Robustness to Relaxation")

  Your tentative principle ("can you dial it off continuously") is very close to a concept in dynamical systems called **Structural Stability**.

  **The Rule:** An unrealistic assumption is valid if, when you relax it slightly (add a small amount of the "ignored" factor), the model's output changes **continuously and proportionally**. An assumption is invalid if relaxing it causes a **qualitative discontinuity** or removes the **causal driver** of the phenomenon you are studying.

  Let's test this against your list:

  1.  **Frictionless Plane (Fine):** If you add a tiny coefficient of friction ($\mu = 0.001$), the block still slides, just slightly slower. The qualitative behavior (motion) is stable.
  2.  **Ideal Gas (Fine):** At low density, interactions are rare. Adding a small interaction term (Van der Waals equation) tweaks the pressure slightly. It's a continuous limit.
  3.  **Ignore Gravity in Orbits (Not Fine):** If you have a model of orbits and set $G=0$, the planet flies off in a straight line. If you set $G=0.0001$, it creates a massive ellipse. The qualitative behavior (bound orbit vs. escape) is **discontinuous**. You deleted the cause.
  4.  **Fixed Cloud Cover (Not Fine):** Clouds are a feedback loop. If temperature rises, clouds might change, which changes temperature. Fixing them breaks the feedback loop. It's not a "small parameter"; it's removing a derivative from the equation ($\frac{dCloud}{dT} = 0$). This often leads to structural instability in climate sensitivity.
  5.  **Efficient Markets Tautology (Not Fine):** This is a logical error, not a modeling error, but it fails the test because it prevents you from testing the mechanism.

  ### Resolving Your Torn Cases

  **1. Infinite Population (Evo/Bio)**
  *   **Verdict:** **Fine.**
  *   **Why:** This is a mathematical limit (Law of Large Numbers). As $N \to \infty$, stochastic noise averages out. If you have $N=1,000,000$, the behavior is statistically indistinguishable from $N=\infty$. It is structurally stable. Your gut was right to accept this one.

  **2. Perfect Information / Rational Agents (Econ)**
  *   **Verdict:** **Context Dependent (Mostly Not Fine for Macro/Finance).**
  *   **Why:** This is where your gut is fighting your textbook.
      *   *When it works:* In long-run growth models or aggregate supply/demand where individual errors cancel out. The "noise" of irrationality averages to zero.
      *   *When it fails:* In financial crises, bank runs, or labor markets (Akerlof's "Market for Lemons"). In these cases, information asymmetry is not "noise"; it is the **signal**. If you add a tiny bit of asymmetric information to a "Market for Lemons" model, the market doesn't just get slightly worse; it **collapses completely**.
      *   **The Test:** Does the phenomenon you are studying *depend* on the friction? If you are studying "why do recessions happen," and you assume perfect information, you have deleted the cause (coordination failure/panic). If you are studying "long term capital accumulation," perfect info might be a stable simplification.
      *   **Advice:** Trust your bones. In modern macroeconomics, the "Lucas Critique" essentially argues that assuming fixed behavioral rules (like perfect rationality) when policy changes is a structural error.

  ### Addressing Your Friend (The F-Twist)

  Your friend is citing Milton Friedman's 1953 essay, *The Methodology of Positive Economics*. Friedman argued that assumptions *should* be unrealistic descriptively, provided they yield accurate predictions (Instrumentalism).

  **Where he is right:** Bohr's model of the atom was physically impossible (electrons shouldn't orbit like planets), but it predicted spectral lines perfectly.
  **Where he is dangerous:** In social science, **mechanisms matter for policy.**
  *   If a climate model predicts warming correctly but for the wrong reason (e.g., ignoring clouds), it might fail when you try to intervene (geoengineering).
  *   If an econ model predicts employment based on perfect info, and you pass a law based on it, people will react strategically to the law, breaking the model.

  **Verdict on Friend:** He is applying physics instrumentalism to social systems. It works until you try to steer the system. Then assumptions matter immensely.

  ### New Cases

  **1. A Well-Mixed Ocean**
  *   **Verdict:** **Not Fine (for most climate questions).**
  *   **Why:** The ocean's function is largely transport (thermohaline circulation). It moves heat from equator to pole. Assuming it is "well-mixed" removes the transport mechanism. It's like assuming a blood circulatory system is a "well-mixed bag of blood." You lose the heart's function. This is a **Causal Deletion**.

  **2. A Central Bank That Never Acts Strategically**
  *   **Verdict:** **Not Fine.**
  *   **Why:** Modern monetary transmission works *through* expectations. If the market knows the Central Bank is passive, inflation expectations unanchor. Assuming the Bank is non-strategic removes the primary channel through which policy works. This is structurally unstable.

  ### Which Verdicts Must You Give Up?

  You don't need to give up many, but you need to refine the **Perfect Information** case.

  1.  **Stop treating "Perfect Information" as universally garbage.** Treat it as a **baseline null hypothesis**. It is "Fine" if used to establish a benchmark (e.g., "Here is what happens without friction, now let's add friction"). It is "Not Fine" if used to explain phenomena *caused* by friction (e.g., "Why did the bank run happen?").
  2.  **Accept that "Predictive Accuracy" isn't enough.** Your friend is wrong here. A model that predicts rain by reading chicken entrails might have accuracy, but it has no **external validity**. You need the assumptions to be *causally isomorphic* to reality if you intend to intervene.

  ### Summary of Your Actual Principle

  You are a **Mechanistic Realist**, not an Instrumentalist.

  **Your Principle:** "An assumption is permissible if it removes **noise** to isolate a signal. An assumption is forbidden if it removes the **signal** itself or the **feedback loops** that stabilize the system."

  *   **Friction:** Noise (usually). **OK.**
  *   **Gravity:** Signal. **Not OK.**
  *   **Clouds:** Feedback/Stabilizer. **Not OK.**
  *   **Perfect Info:** Depends. If studying market efficiency, it's the signal (Not OK to assume). If studying long-term growth, it's noise (OK to assume).
  *   **Infinite Pop:** Mathematical smoothing (Noise reduction). **OK.**

  Your gut is working correctly. It is detecting **structural fragility**. When you hear an assumption, you are subconsciously asking: *"If I nudge this assumption toward reality, does the answer explode?"* If yes, the assumption is cheating. If no, it's modeling.
