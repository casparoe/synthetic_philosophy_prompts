prompt: |-
  I'm a novelist — three books out, no philosophy training past a first-year logic course I scraped through — but I've been reading analytic epistemology on the side for six or seven years now, and through a series of small social errors I've ended up with a slot at the epistemology work-in-progress seminar at my local university, three weeks from now. I need to be ready for the question period and I want the prep in writing so I can rehearse it out loud in my kitchen.

  The paper is on Fitch's paradox of knowability. What I'm defending: Fitch's proof doesn't refute the anti-realist, it refutes one careless way of stating the knowability principle. The proof runs off the unknown truth — p, and nobody knows that p. But look at what that sentence is. Its content includes the fact that it isn't known, and that's why it can't be known: not because there's some fact tucked away in a corner of the universe, but because the sentence defeats itself in the knowing, the same way the sentence p-and-I-don't-believe-p defeats itself in the asserting. Nobody thinks the Moore sentence shows that belief is incoherent, or that there are facts we're forbidden to believe. So my line is that the unknown truth is the Moore sentence of this debate, and the anti-realist only needs a knowability principle restricted to sentences that aren't about their own not-being-known. Tennant does something in this neighbourhood — he restricts it to propositions whose being known isn't already contradictory, Cartesian propositions, he calls them — but that restriction is written in the very machinery that's under dispute, so it looks built to order to me, and I want to state the restriction in plain terms instead. Whether I can is genuinely up in the air, and whether the plain version survives contact with a logician is worse than up in the air. Also: the Moorean bit is load-bearing. It's carrying the whole paper. If it goes, I've got a book report.

  There's a five-minute stretch at the end where I claim fiction is the test case for all this, on the grounds that a novel is a place where truths get made rather than found and I think an anti-realist owes an account of "made" that doesn't just collapse into "whatever a reader can verify." Keep that part short in the prep. I mostly need to survive it.

  The room: about a dozen people. Mostly analytic epistemologists, two of them on testimony, one on skepticism. Two logicians who will want to know exactly which line of the derivation I'm rejecting and in which modal logic, and who will not accept it-feels-like-a-trick as an answer. One person who has published on Moore's paradox and will either be my best friend in there or the one who finishes me. One older guy defending a Dummett-flavoured anti-realism since the eighties who'll think I'm letting the side down by trimming the principle down to something survivable. Plus grad students who will ask the one thing I haven't thought about. The seminar has a reputation for being blunt and I'd rather be braced than flattered.

  What I want from you: the eight or so objections I will actually get, ordered by how much damage they do rather than how likely they are — I can handle the likely ones, I want the ones that end the paper. Phrase each one the way the person who'd raise it would phrase it; a logician's version of an objection doesn't sound like an epistemologist's version and I need to hear the difference in the wording. For each: what I should concede straight away, a two-minute spoken reply, and one line on where that reply is soft. Tell me which single point I should be willing to lose in public and which one I can't lose no matter what. Give me the question I'm hoping nobody asks — I have a bad feeling it's lurking somewhere around the middle of my second section. And no reading lists; I've read the stuff and I can't check anything anyway.

  End your answer with a line of its own that begins Verdict: and then, in under fifteen words, the objection most likely to sink the talk.
