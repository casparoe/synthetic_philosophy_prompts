prompt: |-
  Consider a family of arrangements in which an institution holds a person to a commitment she made earlier, against her own later and contrary choice. Gambling regulators in some jurisdictions keep self-exclusion lists: a person can ask to be barred from casinos, and the casinos are expected to refuse her service. Some addiction treatment programs ask patients to put up money that is forfeited if they relapse. Employers enroll employees in retirement savings by default, so that saving continues unless the employee acts to stop it. A living will instructs physicians to withhold treatment at a point when the patient can no longer speak. In each case the institution treats the earlier, cooler preference as the one with authority and the later, contrary preference, which may be just as sincere, informed, and uncoerced, as something to be overridden or at least not honored. The very existence of these devices also assumes that a person's preferences are not stable across time: that the rate at which she trades a later good against an earlier one shifts as the moment of choice approaches, so that the institution cannot simply take her preferences as given but must decide which of her successive selves to listen to. On the textbook picture of a consumer with a single, time-consistent preference ordering, none of these devices would have any work to do.

  Set against this a set of refusals. Courts will not compel a person to perform personal services she has promised, and no contract can bind a person into servitude, however freely she entered it. A competent patient can revoke an advance directive at any time, even one she wrote with great care. And the law does not generally excuse wrongdoing on the ground that the will was weak: a person who acts in rage or in craving is answerable for what she does, and her earlier resolutions neither bind nor shield her.

  What theory of the person and of the will does the first family of practices presuppose? Reconstruct it. It appears to need something like this: that a person's preferences at different times can conflict in a way that leaves no single ordering to be respected, that the institution may nonetheless rank those preferences, and that the earlier or cooler one is the person's authoritative preference while the later one is a defect of will to be engineered around. Say whether the practices strictly require that picture or merely fit it comfortably. Would a single-agent account, on which weakness of will is one agent failing to do what she herself judged best, license the same devices, or would it point instead to strengthening the agent's judgment rather than routing around it? Would an account on which the person is a series of time-slices, with no further fact about which slice is really her, license them? Would an account that treats the whole phenomenon as a correctable cognitive bias, with no division in the self at all, license them? Then say what the second family presupposes, and whether the two can be held together. If the later self's choice is not really the person's choice, on what ground is she fully answerable for what that self does? If it is her choice, on what ground may an employer, a regulator, or a physician set it aside? Where the practices are philosophically underdetermined, say so explicitly, and tell me what would have to change in each family if we adopted the rival account.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** The tension between two families of practices regarding personal commitment, autonomy, and time.
      *   **Family 1 (Commitment Devices):** Self-exclusion lists, commitment contracts (forfeit money on relapse), default retirement savings, living wills.
          *   *Feature:* Institution enforces *earlier* preference against *later* contrary preference.
          *   *Assumption:* Preferences change over time (time inconsistency); earlier/cooler preferences are authoritative; later/hot preferences are defects to be engineered around.
      *   **Family 2 (Refusals/Accountability):** No specific performance of personal services, no servitude contracts, revocable advance directives, criminal/civil liability for acts done in rage/craving (no "weak will" defense).
          *   *Feature:* Institution honors *later* preference (or holds the person accountable for it) despite *earlier* commitments.
          *   *Assumption:* The agent is responsible for current actions; past promises don't bind the core self regarding bodily autonomy or moral liability.
      *   **Tasks:**
          1.  Reconstruct the theory of the person/will presupposed by Family 1.
          2.  Evaluate if Family 1 *strictly requires* this picture or just *fits* it.
          3.  Test alternative theories against Family 1:
              *   Single-agent account (weakness of will = failure to follow judgment).
              *   Time-slice account (no deep self).
              *   Cognitive bias account (no division in self).
          4.  Reconstruct the theory presupposed by Family 2.
          5.  Analyze compatibility: Can Family 1 and Family 2 be held together?
          6.  Address the accountability paradox: If later self isn't "real," why punish? If it is "real," why override?
          7.  Identify philosophical underdetermination and specify what would need to change in practices if rival accounts were adopted.

  2.  **Analyze Family 1 (Commitment Devices):**

      *   *Theory:* This looks like a **Dual-Self or Hierarchical Model** (e.g., Schelling, Thaler & Shefrin, Frankfurt). There's a "Planner" (cool, long-term) and a "Doer" (hot, short-term). The Planner is the "true" self.
      *   *Requirement:* Does it *strictly* require this? Not necessarily. A single-agent model could use pre-commitment as a rational strategy to overcome known cognitive limitations (akin to Ulysses tying himself to the mast). However, the *institutional* enforcement implies an external validation of the "Planner" over the "Doer."
      *   *Alternative 1 (Single-Agent/Weakness of Will):* If it's just one agent failing to do what's best, commitment devices are tools *for* the agent. But if the institution enforces it against the agent's *current* will, it treats the current will as defective. This fits, but shifts focus from "routing around" to "aiding judgment."
      *   *Alternative 2 (Time-Slices):* If I am just a series of slices, why privilege Slice T1 over Slice T2? This theory struggles to justify Family 1 unless there's a social welfare function privileging long-term utility. It doesn't naturally license overriding T2.
      *   *Alternative 3 (Cognitive Bias):* If it's just a bias (like hyperbolic discounting), correcting it is like correcting a calculation error. This licenses the devices as "debiasing" tools. It doesn't require a divided self, just a flawed processing mechanism.

  3.  **Analyze Family 2 (Refusals/Accountability):**

      *   *Theory:* This looks like a **Unified, Sovereign Self** model (Kantian or Liberal Autonomy). The competent present self has ultimate authority over the body and actions. Past selves cannot enslave the present self. Responsibility attaches to the acting self, regardless of internal conflict.
      *   *Key Principle:* Inalienable autonomy + Moral Agency. You own your actions *now*.

  4.  **Analyze Compatibility (The Tension):**

      *   *Conflict:* Family 1 says T1 > T2 (T2 is defective). Family 2 says T2 is Sovereign (T2 is responsible/authoritative).
      *   *The Paradox:* If T2 is overridden in Family 1 because it's not "really" her choice, how can she be punished in Family 2 for T2's actions? If T2 is punished, she is treated as the agent. If T1 is enforced, T2 is treated as a patient/victim of impulse.
      *   *Reconciliation:* Perhaps domain-specific? (Financial/Health = Family 1; Criminal/Bodily = Family 2). Or perhaps a distinction between *paternalism* (helping me be me) vs. *coercion* (forcing me to be someone else).
      *   *Underdetermination:* The law is inconsistent here. It doesn't have a unified metaphysics of the self. It pragmatizes.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the tension. Define the two families clearly.
      *   *Section 1: Family 1 Theory.* Reconstruct the "Divided Self" or "Planner-Doer" model. Mention hyperbolic discounting.
      *   *Section 2: Testing Family 1 against alternatives.*
          *   *Single-Agent:* Licenses devices as *aids*, but institutional *enforcement* against current will is trickier. It suggests strengthening judgment, not bypassing it.
          *   *Time-Slices:* Hard to license. Why privilege T1? Requires an external arbiter of welfare.
          *   *Cognitive Bias:* Licenses devices well (debiasing). Doesn't need a metaphysical split, just a processing error.
      *   *Section 3: Family 2 Theory.* Reconstruct the "Sovereign Present Self." Autonomy is inalienable. Responsibility follows action.
      *   *Section 4: Compatibility.* This is the crux. They are logically tense.
          *   *If T2 isn't real (Fam 1):* Punishment (Fam 2) is unjust.
          *   *If T2 is real (Fam 2):* Override (Fam 1) is paternalistic violation.
      *   *Section 5: Underdetermination & Changes.*
          *   The law is underdetermined. It uses different models for different contexts.
          *   *If we adopted strict Fam 1 (Divided Self):* Criminal law would need an "impulse defense." Contracts would be more binding.
          *   *If we adopted strict Fam 2 (Sovereign Self):* Living wills would be non-binding. Default savings would be opt-in. Self-exclusion would be unenforceable.
      *   *Conclusion:* Summarize the pragmatic compromise.

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* Make sure to distinguish between *licensing* (allowing) and *requiring* (necessitating). The prompt asks if practices *strictly require* the picture.
      *   *Nuance:* The "Single-Agent" view (Aristotelian weakness of will) actually supports commitment devices *if* the agent requests them. But the *institutional* role in enforcing them against current protests leans more toward the "Defective Will" view.
      *   *Nuance on Time-Slices:* Parfit's view. If there's no deep self, T1 has no more claim than T2. So Family 1 is hard to justify metaphysically, though maybe utilitarian justification works.
      *   *Nuance on Accountability:* The prompt asks: "If the later self's choice is not really the person's choice, on what ground is she fully answerable?" This is the strongest point of contradiction. I need to highlight that the legal system effectively says "You are one person for punishment, but two people for savings."

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   Reconstruct Family 1 theory? Yes.
      *   Strictly require or fit comfortably? Yes.
      *   Test Single-Agent, Time-Slice, Cognitive Bias? Yes.
      *   Reconstruct Family 2 theory? Yes.
      *   Can they be held together? Yes (analyze tension).
      *   Address accountability paradox? Yes.
      *   Identify underdetermination and necessary changes? Yes.

  8.  **Final Output Generation:** (Proceed to write the response following this structure.)
answer: |-
  The tension you describe exposes a fissure in the legal and ethical conception of agency. The two families of practices rely on competing metaphysics of the self and the will. Below is a reconstruction of the theories presupposed by each, an analysis of their compatibility, and an examination of the underdetermination inherent in our current institutional arrangements.

  ### I. The Theory of Family 1 (Commitment Devices)

  **Reconstruction:**
  The first family of practices (self-exclusion, commitment contracts, default savings, living wills) presupposes a **Divided Self** or **Hierarchical Will** model. This view, associated with thinkers like Thomas Schelling, Harry Frankfurt, and behavioral economists like Thaler and Shefrin, posits that the person is not a unitary agent with a single preference ordering. Instead, the person contains at least two distinct loci of volition:
  1.  **The Planner (Cool Self):** Operates with a long time horizon, abstract reasoning, and stable values.
  2.  **The Doer (Hot Self):** Operates in the immediate present, subject to visceral cravings, hyperbolic discounting, and situational pressure.

  In this framework, the institution acts as an external enforcer of the Planner's authority. It treats the later, contrary preference not as a legitimate expression of autonomy, but as a **defect of will** (akrasia) or a temporary pathology. The "true" person is identified with the earlier, cooler preference. The institution's role is to protect the "true" self from the "corrupted" self by rendering the later choice impossible or costly.

  **Strict Requirement vs. Comfortable Fit:**
  These practices do not *strictly* require a metaphysical division in the self, but they fit it most comfortably. They *do* strictly require that preferences are time-inconsistent and that there is a normative basis for privileging one time-slice over another.

  **Testing Alternative Accounts against Family 1:**

  1.  **Single-Agent Account (Weakness of Will):**
      *   *Theory:* There is one agent who knowingly acts against her own better judgment.
      *   *Licensing:* This account licenses commitment devices as **tools of rational agency** (like Ulysses tying himself to the mast). The agent uses the device to ensure her future actions align with her current judgment.
      *   *Divergence:* However, the *institutional enforcement* against the agent's later protest pushes beyond this. If it is one agent, the later refusal is still *her* refusal. A strict single-agent view might suggest strengthening the agent's judgment (therapy, education) rather than routing around it via external coercion. If the institution overrides the later self, it implicitly treats the later self as *less* of an agent than the earlier one, which strains the single-agent model.

  2.  **Time-Slice Account (No Deep Self):**
      *   *Theory:* The person is a series of temporal stages with no further fact of identity connecting them (a Parfitian reductionist view).
      *   *Licensing:* This account struggles to license Family 1. If I-at-T1 and I-at-T2 are merely distinct slices, why does T1 have authority over T2? Privileging T1 requires an external welfare metric (e.g., "total lifetime utility") rather than respect for autonomy.
      *   *Divergence:* Under this view, enforcing T1's will on T2 looks less like respecting the "true self" and more like one person coercing another. It would license the devices only on paternalistic utilitarian grounds, not on grounds of respecting the person's own authority.

  3.  **Cognitive Bias Account (No Division):**
      *   *Theory:* There is no division in the self, only a processing error (e.g., hyperbolic discounting is a bug, not a feature of a separate self).
      *   *Licensing:* This licenses the devices comfortably as **debiasing mechanisms**. Just as we use calculators to correct arithmetic errors, we use commitment devices to correct discounting errors.
      *   *Divergence:* This avoids the metaphysical split of the Divided Self model. However, it implies that if the "bias" were corrected (e.g., through cognitive reframing), the device would be unnecessary. It treats the later preference as *mistaken* rather than *alien*.

  ### II. The Theory of Family 2 (Refusals and Accountability)

  **Reconstruction:**
  The second family of practices (no servitude contracts, revocable directives, criminal liability for acts of passion) presupposes a **Sovereign Present Self** model. This is a Kantian or Liberal conception of autonomy.
  1.  **Inalienability:** The will cannot be permanently alienated. A promise to surrender future autonomy (servitude) is void because the capacity to choose is essential to personhood.
  2.  **Sovereignty of the Competent Present:** A competent agent at T2 has the absolute right to revoke the instructions of the agent at T1 regarding her own body and labor.
  3.  **Unified Responsibility:** For the purposes of blame and punishment, the person is a unity. Internal conflict (rage, craving) does not fragment the agent enough to negate responsibility. If you act, you own the act.

  **Compatibility Analysis:**
  Can these two families be held together? Logically, they are in deep tension, though pragmatically they coexist.

  *   **The Accountability Paradox:**
      *   *If Family 1 is correct (Later self is defective):* Why does Family 2 punish the later self? If the gambler in the casino is in the grip of a "defect of will" that justifies barring her entry, why is the thief who steals to gamble held criminally liable? If the later preference is not "really" the person's choice (as Family 1 implies), then punishing her for it (as Family 2 requires) is punishing her for a symptom of an illness or a temporary alienation of self.
      *   *If Family 2 is correct (Later self is sovereign):* Why does Family 1 override it? If the patient at T2 has the right to revoke a living will, why does the self-exclusion list bind the gambler at T2? If the agent is sovereign and answerable for her current choices, an employer or regulator setting aside her current choice to save or gamble is a violation of her autonomy.

  *   **The Ground of Authority:**
      *   Family 1 grounds authority in **temporal stability and coolness** (T1 knows best).
      *   Family 2 grounds authority in **current competence and bodily integrity** (T2 owns the body).

  ### III. Philosophical Underdetermination and Necessary Changes

  The current legal and institutional landscape is **philosophically underdetermined**. It does not commit to a single metaphysics of the self. Instead, it adopts a **pragmatic pluralism**, switching models based on the domain (finance/health vs. criminal law/contract).

  If we were to force consistency by adopting one rival account, significant changes would be required in one or both families.

  **Scenario A: Adopting the Strict "Divided Self" (Family 1 Dominance)**
  If we accept that the "Cool/Planner" self is the only authoritative self and the "Hot/Doer" self is a defect:
  *   **Changes to Family 2:**
      *   **Criminal Law:** We would need to expand the insanity or diminished capacity defenses. Acts committed in "hot" states (rage, craving) would be treated as actions by a temporary, non-authoritative self. Punishment would be unjust; treatment would be required.
      *   **Contract/Bodily Autonomy:** Advance directives would become irrevocable. If the T1 self is the "true" owner of the life, the T2 self (perhaps compromised by illness or fear) cannot veto the T1 plan. Servitude contracts might become enforceable if deemed a "rational" long-term plan by the Planner.
  *   **Risk:** This creates a tyrannical paternalism where a past version of a person rules over the living present, potentially ignoring genuine changes of heart or values.

  **Scenario B: Adopting the Strict "Sovereign Present Self" (Family 2 Dominance)**
  If we accept that the competent present self is always the ultimate authority and the self is unified:
  *   **Changes to Family 1:**
      *   **Commitment Devices:** These would become unenforceable against the agent's will. A gambler could walk into a casino and demand entry; the casino would be liable for *refusing* service to a competent adult.
      *   **Default Savings:** Opt-out defaults would be prohibited. Saving must be an active, current choice (opt-in).
      *   **Living Wills:** These would be treated as non-binding expressions of intent. Physicians would be required to treat the patient as long as the current patient (or a surrogate representing current interests) shows any sign of wanting to live.
  *   **Risk:** This leads to "self-defeat." Agents who know they are prone to weakness cannot bind themselves, leading to worse long-term outcomes (addiction, poverty, unwanted medical prolongation).

  ### Conclusion

  The two families of practices cannot be fully reconciled under a single, rigorous theory of the person.
  *   **Family 1** treats the person as a **project** to be managed over time, prioritizing narrative coherence and long-term welfare.
  *   **Family 2** treats the person as a **presence** to be respected in the moment, prioritizing liberty and moral agency.

  The law holds them together by compartmentalization: we treat people as divided selves when they are saving for retirement or planning for death, but as unified sovereigns when they are standing before a judge or signing an employment contract. This inconsistency is not necessarily a failure of reasoning, but a recognition that human agency is both fragmented (we struggle against ourselves) and unified (we must answer for our actions). To resolve the tension completely would require sacrificing either our ability to protect our future selves or our commitment to the freedom of our present selves.
