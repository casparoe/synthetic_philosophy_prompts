answer: |-
  The fluorescent lights of the community center hallway hummed, a stark contrast to the heavy silence still lingering in the mediation room. Elena leaned against the vending machine, watching Marcus pour sugar into his coffee. Inside, Sarah, the victim, had just told David, the offender, that she forgave him and felt no anger. David had recited a statement written by his lawyer that sounded like it was printed on a receipt.

  "It evaporated," Elena said, nodding toward the door. "The moral demand. Sarah isn't holding him answerable anymore; she's managing him. And David… he didn't feel the sting. He performed contrition without the guilt."

  Marcus stirred his coffee. "It didn't evaporate, Elena. It was decoupled. Sarah chose to forego resentment. That's a virtue, not a metaphysical collapse. And David understood the script. He knows he violated a norm. That cognitive grasp is the anchor."

  "But Strawson taught us that the anchor *is* the tension," Elena countered, turning to face him. "Resentment and guilt aren't just emotional weather reporting on a storm of responsibility. They are the storm. When Sarah says she feels nothing, she has stepped out of the participant stance. She's viewing David objectively, as a subject for social work rather than a moral agent. And David's hollowness proves it. He isn't experiencing the internal sanction of guilt. If the reactive attitudes are absent on both sides, what exactly is left to call 'responsibility'?"

  "You're conflating the practice of blaming with the condition of blameworthiness," Marcus said, taking a sip. "Look at the case. David planned the theft. He understood the property rights involved. He knew Sarah would suffer. That sensitivity to reasons is the bedrock. The reactive attitudes are merely our natural, human way of registering that fact. They are the thermometer, not the fever."

  Elena shook her head. "That's precisely where you miss the point of this room. If the thermometer is broken, you can't diagnose the patient. By claiming responsibility survives the absence of these attitudes, you're positing a ghostly fact that does no work. What has gone missing here is the interpersonal bond that makes responsibility meaningful. When David failed to feel guilt, he didn't just fail to register his responsibility; he failed to *be* responsible in that moment. He opted out of the moral community. Sarah's forgiveness, while kind, reinforces that exit. She's treating him like a broken appliance that needs fixing, not a person who owes her a moral debt. The 'objective attitude' isn't a neutral vantage point; it's a withdrawal of the very relationship that constitutes accountability."

  "But consider the implications of your view," Marcus replied, setting the cup down. "If responsibility dissolves whenever resentment fades or guilt is inaccessible, then the most manipulative offenders escape accountability simply by numbing themselves. David might be emotionally stunted, perhaps sociopathic. If I follow you, his lack of capacity for guilt means he lacks responsibility. That absolves him. My view holds him fast. He is responsible *because* he is reasons-responsive, regardless of whether his emotional engine is running hot or cold. Nothing of importance has vanished. The normative fact remains: he owed her better, and he knew it. Sarah's lack of resentment changes her emotional landscape, not his moral status."

  "You're preserving a status that has no currency," Elena pressed. "You say he 'knew it.' But moral knowledge isn't just intellectual. It's embodied in the willingness to be vulnerable to the other's anger. By viewing him objectively, as you suggest we do to maintain his 'status,' you actually treat him as an object. You say nothing important is missing, but the reciprocity is gone. Responsibility is a two-way street of expectations and emotional reactions. If Sarah doesn't expect him to feel bad, and he doesn't feel bad, the street is closed. You're pointing at a map of a road that no longer exists."

  "The road exists even if the traffic stops," Marcus insisted. "The importance lies in the capacity for recognition, not the emotional eruption. If we repair David's reasoning, or if Sarah later wakes up angry, the responsibility was there all along, waiting to be acknowledged. Your view makes responsibility too fragile, dependent on the fluctuating emotional states of the victim and the offender. In this case, what matters is that David is the kind of being who *could* have felt guilt. That he didn't is a moral failure, yes, but it doesn't negate the responsibility. It confirms it. He failed to meet a demand that was independently there."

  "But a demand imposed from where?" Elena asked. "If not from the community of feeling agents? You're positing a 'fact' about David that is invisible to everyone in that room. Sarah doesn't feel it. David doesn't feel it. We, the observers, only posit it to save your theory. In doing so, you prioritize a metaphysical comfort over the relational reality. The hollowness we witnessed isn't just a lack of emotion; it's the absence of the glue. Without the reactive attitudes, we aren't holding him responsible; we are merely managing risk. You call that 'nothing of importance.' I call it the death of the moral world."

  "And I call it the necessary separation of justice from vengeance," Marcus said, picking up his cup. "If responsibility requires the heat of resentment, then forgiveness becomes impossible, because forgiveness would require destroying the responsibility. Sarah forgave him *while* holding him responsible. That's only possible if responsibility is deeper than her feelings. You see a void; I see a foundation that allows us to rebuild without requiring perpetual anger."

  "Rebuild what?" Elena asked, opening the door back to the mediation room. "A system? Perhaps. A relationship? No. Not without the sting."

  "We'll see," Marcus said, following her in. "The work continues either way."
