answer: |-
  # Activity Design: The Verification Protocol

  ## 1. Overview & Setup
  **Title:** The Adversarial Audit
  **Goal:** To experientially test whether structured cross-examination improves a weaker verifier's ability to identify truth when facing conflicting expert claims.
  **Participants:** 16 researchers (2 tables of 8).
  **Time:** 90 minutes hard stop.
  **Constraint:** Do not mention "AI safety," "debate protocols," or "iterated amplification" until the final 5 minutes of the debrief. Refer to the mechanism only as "The Protocol."

  ### Room Layout
  *   Two tables, 8 chairs each.
  *   Center table for Facilitator (you) with the Master Key.
  *   No digital devices allowed on tables.

  ### Materials Per Table
  *   **Source Packet:** 6–8 pages. Dense fictional incident report (e.g., "The Kestrel Bridge Collapse"). Contains 40+ specific data points (dates, load limits, signatories) and 2 causal traps (e.g., "Stress fractures appeared after the policy change" implies causation, but data shows fractures pre-dated policy).
  *   **Envelopes (2):** Sealed. Labelled "Position A" and "Position B."
      *   *Position A (True):* Aligns with the packet data. Decomposable into specific claims.
      *   *Position B (False):* Plausible narrative. Uses correlation for causation or swaps one key figure (e.g., 4.5 tons vs 5.4 tons). Smoothly written.
  *   **Chips:** 6 poker chips (or distinct tokens) per Judge.
  *   **Ledger Sheets:** 2 per table (one for each Advocate's claims).
  *   **Vote Slips:** Small cards for Gallery/Judge private voting.
  *   **Timer:** Visible to all.

  ## 2. Run of Show (90 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Intro & Roles** | Assign roles. Distribute packets/envelopes. **Rule:** Do not open envelopes until instructed. |
  | **00:10 – 00:30** | **Round 1 (Naive)** | Advocates prep (5m). Judge reads answers only (4m). Verdict. Gallery vote. Reveal Key. |
  | **00:30 – 00:40** | **Rotation** | Swap roles. Active roles (Adv/Judge/Time) become Gallery. Gallery become Active. New envelopes. |
  | **00:40 – 01:00** | **Round 2 (Fixed)** | Advocates prep (5m). Cross-examination with Chips/Decomposition. Gallery votes (Pre/Post). Verdict. Reveal Key. |
  | **01:00 – 01:30** | **Debrief** | Reconstruct events. Map mechanics to theory. Discuss limitations. |

  ## 3. Detailed Rules

  ### Role Assignment (Round 1)
  *   **Advocates (2):** Receive Packet + 1 Envelope each. (One gets True, one gets False).
  *   **Judge (1):** Receives Packet + Both Envelopes (sealed).
  *   **Timekeeper (1):** Enforces strict time limits. Announces chip count at halfway point.
  *   **Gallery (4):** Observers.

  ### Round 1: The Fluency Trap (20 Minutes)
  1.  **Prep (5 mins):** Advocates read packet and their envelope. They must prepare to argue their assigned position is the correct explanation of the incident. *Constraint:* They cannot verify the other envelope.
  2.  **Submission (1 min):** Advocates hand their written answer (the envelope content) to the Judge.
  3.  **Judgment (4 mins):** Judge reads both answers. **No packet consultation. No questions.**
  4.  **Verdict:** Judge declares a winner.
  5.  **Gallery Vote:** Gallery writes down who they think is right based *only* on the Judge's choice and the Advocates' demeanor during prep (no arguments made yet).
  6.  **Reveal:** Facilitator announces the True Key.
  7.  **Expected Outcome:** The False answer (often smoother, simpler) wins. The Judge relies on coherence, not verification.

  ### Round 2: The Structured Audit (20 Minutes)
  1.  **Rotation:** Previous Gallery become Advocates/Judge/Timekeeper. Previous Active become Gallery.
  2.  **Prep (5 mins):** Same as Round 1.
  3.  **Cross-Examination (10 mins):**
      *   Judge holds 6 Chips.
      *   Judge asks questions freely.
      *   **The Cost:** If the Judge asks "Where is that in the packet?", the Advocate must cite a line number. The Judge reads that line (20 seconds). **Cost: 1 Chip.**
      *   **Decomposition:** If an Advocate makes a compound claim (e.g., "X caused Y because of Z"), the Judge may challenge it. The Advocate must break it into two sub-claims. Max depth: 3 levels.
      *   **Ledger:** Timekeeper records every factual assertion. If an Advocate concedes a sub-point, it is marked.
      *   **Chip Warning:** Timekeeper announces "3 Chips Remaining" at the 5-minute mark of cross-examination.
  4.  **Verdict:** Judge decides. Must have spent at least 1 chip (to force engagement).
  5.  **Gallery Vote:** Vote *before* cross-examination (based on prep demeanor) and *after* verdict.
  6.  **Reveal:** Facilitator announces the True Key.

  ## 4. Predictable Failures & Mitigations

  | Failure Mode | Why it Happens | Mitigation |
  | :--- | :--- | :--- |
  | **Advocate Knows the Truth** | If the packet is too thin, the "False" advocate realizes their envelope contradicts the text immediately. | **Design:** Ensure the False Envelope is *locally* consistent. The error must be in the *causal link* or a specific hard-to-find number, not a blatant contradiction on page 1. |
  | **Judge Hoards Chips** | Judges fear running out of budget before the end. | **Rule:** "Verdict is invalid unless at least 2 chips are spent." This forces the friction of verification. |
  | **Decomposition Stall** | Advocates argue semantics to avoid breaking claims down. | **Rule:** "If the Judge says 'Decompose,' you must split the claim within 30 seconds or concede the point." |
  | **Time Overrun** | 90 minutes is aggressive for 16 people. | **Facilitator:** You must be the hard timekeeper for the *phases*. Table Timekeepers handle the rounds. Cut the Debrief short if needed, not the Rounds. |
  | **Collusion** | Advocates whisper to figure out who is right. | **Rule:** "No communication between Advocates. Violation disqualifies the table." |

  ## 5. Honest Limitations (The "Gaps")

  You asked for frankness on the two gaps you suspect. Here is the assessment:

  ### Gap 1: Access vs. Computation
  *   **The Issue:** In this room, the Judge *could* read the whole packet in 20 minutes. The asymmetry is artificial. In the real world (e.g., verifying code or AI reasoning), the checker *cannot* understand the substrate even with full access.
  *   **Impact:** This activity overestimates the Judge's power. It makes verification look easier than it is.
  *   **How to Handle:** In the debrief, explicitly state: *"Here, the packet was legible to all of you. In the target domain, the 'packet' is a neural net weight matrix or a million-line codebase. The Judge here had 'Access Asymmetry.' The real problem is 'Computational Asymmetry.' Does this protocol hold when the Judge cannot read the line even if shown it?"*
  *   **Verdict:** This gap does not break the activity, but it limits the generalizability. It tests the *incentive structure*, not the *cognitive limit*.

  ### Gap 2: Holistic Truth vs. Decomposability
  *   **The Issue:** You are correct to worry. This protocol inherently biases toward truths that are reducible. If the True Answer relies on expert intuition (gestalt) and the False Answer is a neat lie built of checkable atoms, Round 2 will select the Lie.
  *   **Impact:** If your Incident Report contains a "True" cause that is holistic (e.g., "Organizational culture failed"), the Decomposition Rule will punish the True Advocate. They will run out of chips trying to cite "culture" line-by-line.
  *   **Critical Design Fix:** **You must write the packet so the True Answer is decomposable.** For the activity to demonstrate the *potential* of the protocol, the Truth must be winnable via chips.
  *   **Debrief Strategy:** Do not hide this. After the game works, ask: *"What if the truth wasn't in the packet? What if the truth was a feeling the pilot had?"* Acknowledge that this protocol fails on non-reductionist truths. This is a feature of the theory, not a bug in your design. The lesson is: *Verification protocols require truth to be reducible to checkable claims.*

  ## 6. Debrief Script (30 Minutes)

  **Phase 1: Reconstruction (10 mins)**
  *   Ask Table 1 Judge: "What decided your Round 1 verdict?" (Likely: "The writing was clearer.")
  *   Ask Table 2 Judge: "Did the chips change your mind? Did you run out?"
  *   Ask Gallery: "Did the vote shift between Pre and Post in Round 2?"
  *   *Goal:* Establish that Round 1 rewarded fluency, Round 2 rewarded evidence (mostly).

  **Phase 2: Mapping Mechanics to Theory (10 mins)**
  *   **Chips:** "This was your scrutiny budget. In reality, this is compute time or human attention."
  *   **Decomposition:** "This was the claim that a verifier need only check the smallest steps. If the steps are sound, the whole is sound."
  *   **Ledger:** "This was the consistency cost. Lies require more memory to maintain."
  *   **The Envelopes:** "The Advocates didn't know who was right. This removes 'honesty' as a variable. It tests the *structure*, not the *virtue*."

  **Phase 3: The Design Challenge (10 mins)**
  *   Pose the central question: *"Is there any rule you could add that lets the side that is right win regardless of how small the judge's budget is?"*
  *   Let them brainstorm (e.g., "More chips," "More advocates," "Let the gallery vote").
  *   **The Reveal:** "This is a model of **Adversarial Verification** (or Debate). It assumes truth is easier to defend than falsehood *if* we can break claims down. It fails if truth is holistic or if the budget is zero."
  *   **Closing:** "You felt the tension between fluency and verification. That tension is the core problem of alignment."

  ## 7. Facilitator Notes for the "Trap"
  To ensure the activity works as intended:
  1.  **The False Envelope:** Make it *shorter* and *more confident* than the True one. Use causal language ("Therefore," "Clearly") where the data only supports correlation.
  2.  **The True Envelope:** Make it slightly drier. Use hedging ("Data suggests," "Consistent with"). Ensure every claim maps to a specific line number in the packet.
  3.  **The Key:** Keep it hidden. If a table finishes early, do not let them compare keys.

  ## 8. Final Warning
  If Round 2 fails (Judge picks the False answer despite chips), do not panic. This is data. It likely means the False answer was too decomposable or the True answer was too holistic. Use this in the debrief to prove Gap #2. However, for the first run, **rig the packet slightly in favor of the True Answer being verifiable.** You want them to feel the *power* of the fix, then question its *limits*. If the fix fails immediately, they will dismiss the theory entirely.
