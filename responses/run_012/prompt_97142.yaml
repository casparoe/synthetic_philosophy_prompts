answer: |-
  The dispute between you and your co-instructor is not merely academic; it is a microcosm of the central tension in modern political ethics. Your colleague argues that patriotism is a virtue grounded in role morality, immune to the demands of impartiality much like parental love. You counter that the involuntary and often zero-sum nature of citizenship makes the parental analogy fragile, if not broken. To resolve this, we must avoid the trap of defining patriotism so loosely that it becomes meaningless, or so strictly that it vanishes entirely. We must distinguish between the heart and the hand, and we must test the limits of the roles we inhabit.

  My verdict is this: Patriotic sentiment is a benign, often valuable affective state, but patriotic partiality is a virtue only under strict conditions. Specifically, patriotic partiality is virtuous only when it is restricted to the maintenance of just institutions and does not violate the basic negative duties owed to outsiders. When patriotism demands prioritizing compatriots in ways that inflict harm, deprive outsiders of essential goods, or sustain unjust regimes, it ceases to be a virtue and becomes a licensed vice. The parental analogy, while illuminating regarding internal duties, fails to justify external partiality because it ignores the rivalrous nature of political goods.

  To reach this conclusion, we must first separate patriotic sentiment from patriotic partiality. Your colleague's defense relies on conflating the two. Patriotic sentiment is the affective attachment one feels toward a landscape, a history, a culture, or a people. It is the comfort of familiarity, the pride in a shared literary canon, or the grief felt at a national tragedy. This sentiment is logically distinct from the distributive practice of giving compatriots priority in goods, opportunities, and sacrifices.

  Sentiment is rarely the source of moral danger. One can love one's country without believing it deserves more resources than another. Indeed, sentimental attachment can motivate civic improvement; one cleans one's own porch because it is *one's* porch, not because porches are inherently superior. If patriotism were merely sentiment, your colleague would be right: it would be a private virtue akin to loving a spouse, requiring no justification to an impartial observer. However, politics is not private. Patriotic partiality is the public enactment of that sentiment—the policy that says *our* unemployed get benefits before *their* starving, or *our* security matters more than *their* liberty. It is here, in the distributive sphere, that the moral burden arises. We can defend sentimental attachment without defending partiality, but we cannot defend partiality without addressing its costs to those outside the circle. Your colleague's error is assuming that because the sentiment is natural, the partiality is justified.

  This leads us to the core of your colleague's argument: the role-morality defense. He posits that the citizen stands to the compatriot as the parent stands to the child. In this view, special obligations arise from the relationship itself, not from a calculation of global utility. To ask a parent to justify loving their child more than a stranger is to misunderstand the nature of parenthood; the relationship is the source of the reason. Therefore, to ask a citizen to justify prioritizing compatriots is to beg the question by importing an impartialist framework where it does not belong.

  This analogy is powerful, but it collapses under scrutiny when we isolate exactly which features of parenthood do the justificatory work. There are three key features of the parent-child relationship that make partiality permissible: dependency, non-rivalry, and developmental telos.

  First, children are uniquely vulnerable and dependent on their specific parents. A stranger cannot step in without disrupting the child's development. Second, parental partiality is largely non-rivalrous. My feeding my child does not typically starve yours; my loving my child does not diminish the love available to yours. Third, the goal of parenthood is to raise an independent moral agent who can eventually take their place in the wider moral community.

  Does the citizen-compatriot relation possess these features? It possesses dependency; we rely on the state for security and infrastructure. However, it fails catastrophically on non-rivalry. This is your strongest objection, and it must be pressed home. International politics is frequently zero-sum. When a wealthy nation subsidizes its agriculture, it undermines the livelihood of farmers in developing nations. When a nation closes its borders to preserve a welfare system, it denies refuge to those in existential danger. Unlike the parent's love, the citizen's partiality often consumes goods that are finite: land, safety, economic advantage, and environmental capacity.

  Furthermore, the developmental telos is absent. States do not aim to make citizens independent of the state in the way parents do with children; they aim for perpetuation. If the parental analogy holds, the state should act to render its citizens capable of engaging in impartial moral reasoning that transcends borders. Instead, patriotic partiality often encourages the opposite: a suspension of impartial judgment regarding outsiders.

  Your colleague charges that you are begging the question by demanding these roles satisfy impartial standards. This charge must be rejected. We do not accept role morality as a blanket exemption from ethics. We do not allow a mafia member to claim that loyalty to the family justifies extortion, nor do we allow a corporate executive to claim that fiduciary duty justifies poisoning a water supply. Roles are morally permissible only if the activities they entail are themselves permissible. The impartial standpoint does not vanish at the border; it acts as the court of appeal that determines whether the role itself is just. If a role requires violating basic human rights, the role is corrupt, and the virtue associated with it is a counterfeit.

  Therefore, the parental analogy can only bear the weight your colleague places on it if we severely restrict the scope of patriotic partiality. It justifies internal duties—paying taxes, voting, obeying laws—because these sustain the cooperative scheme from which citizens benefit. It does not justify external partiality that harms outsiders.

  This brings us to the necessary conditions for patriotism to be a virtue. We cannot simply say patriotism is good or bad; we must specify the architecture of its justification. Patriotism is a virtue under three specific conditions.

  First, the institutions toward which one is partial must be reasonably just. One cannot be virtuously patriotic toward a regime that systematically violates the rights of its own people or others. A "patriot" who prioritizes their compatriots in a genocidal project is not exhibiting a special virtue; they are exhibiting complicity. The object of the attachment matters. If the state is unjust, the duty of the citizen shifts from partiality to reform, even if that reform benefits outsiders at the expense of national prestige.

  Second, patriotic partiality must be bounded by a threshold of harm to outsiders. We may prioritize our compatriots in the distribution of surplus goods or cultural recognition, but we may not do so when the cost to outsiders is the deprivation of basic rights or subsistence. If my country's economic protectionism keeps my wages stable but keeps your children malnourished, the partiality is vicious. The parental analogy works only in the non-rivalrous sphere; once the goods become rivalrous, the claims of moral equality reassert themselves. We are parents to our children, but we are not parents to our neighbors; we are fellow moral agents.

  Third, patriotic partiality must be reciprocal and democratic. In the parental model, the parent has authority over the child. In the civic model, the citizens are co-legislators. If the partiality is imposed by an elite upon a populace, it is manipulation, not virtue. Virtuous patriotism requires that the citizens themselves have a say in how the partiality is enacted, ensuring it aligns with their collective moral agency rather than blind instinct.

  Your colleague fears that imposing these conditions destroys patriotism, turning it into impartiality in disguise. This is a false dichotomy. We can acknowledge special duties to compatriots without granting them lexical priority over basic human rights. We can love our country more than others without believing it deserves more than others. The virtue lies in the tension, not the resolution. A patriot who never questions the cost imposed on foreigners is a chauvinist. A cosmopolitan who feels no special pull toward their own community is rootless. The virtuous citizen is one who feels the pull of sentiment but disciplines the hand of partiality.

  To conclude, your colleague is correct that role morality generates special reasons, but wrong that those reasons are immune to external critique. The parental analogy justifies caring for our own, but it does not justify harming others to do so. Because political goods are often rivalrous and the exit from citizenship is costly, the state wields a power parents do not. Consequently, patriotism is a conditional virtue. It is virtuous when it sustains just institutions and fosters civic solidarity without violating the negative duties owed to humanity. It is a vice when it becomes a shield for injustice or a mechanism for hoarding essential goods.

  You need not abandon the idea that patriotism can be good. But you must insist that its goodness is not intrinsic to the relationship itself. It is derived from the justice of the actions that relationship prompts. The impartial standpoint does not beg the question; it sets the boundaries within which the question of partiality can be legitimately asked. Patriotism is a fire: it can warm the home, but only if the hearth is built to contain it. Without the constraints of justice and the recognition of the outsider's claim, it burns the house down.
