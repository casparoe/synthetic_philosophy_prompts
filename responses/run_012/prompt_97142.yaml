              1.  Patriotic *sentiment* (affective) vs. Patriotic *partiality* (distributive/political).
              2.  Treat the role-morality defense as a reconstructed target (attribute to colleague, don't cite sources).
          *   Adjudicate the parental analogy (which features justify? does citizenship have them?).
          *   Determine if defensible patriotism must be conditional (non-rival goods, just institutions, cost thresholds).
          *   Style: Argumentative, no citations/reading lists.
          *   Length: 1,200 - 1,800 words.

  2.  **Deconstruct the Arguments:**
      *   *Colleague's View (Role Morality):* Patriotism is like parenthood. Special obligations arise from the relationship itself, not from impartial calculation. Critiquing it via impartiality begs the question.
      *   *User's View (Skeptic):* Citizenship is involuntary/unexitable. International goods are often zero-sum (unlike parental love). Outsiders are moral equals.
      *   *My Task:* Synthesize and adjudicate. I need to find a middle ground that respects the intuition behind role morality but acknowledges the moral risks identified by the skeptic.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The lunchtime debate context (briefly).
          *   Define the stakes: Virtue or vice?
          *   Introduce the two key distinctions (Sentiment vs. Partiality; Role Morality analysis).
          *   Thesis Statement: Patriotism is a *conditional virtue*. Sentiment is generally benign/valuable, but partiality is only virtuous when constrained by justice and non-harm to outsiders. The parental analogy fails in critical aspects regarding rivalry and voluntariness.

      *   **Section 1: Sentiment vs. Partiality:**
          *   Distinguish the feeling (love of country) from the action (prioritizing compatriots).
          *   Argument: Sentiment is rarely the problem. Loving a culture or landscape is like loving a family home. It doesn't inherently harm others.
          *   Argument: Partiality is where the moral rubber meets the road. Giving jobs, welfare, or safety to *us* over *them* has distributive consequences.
          *   Claim: One can have sentiment without partiality (cosmopolitan local), but partiality without sentiment is just cold tribalism. The virtue lies in the regulation of partiality, not the existence of sentiment.

      *   **Section 2: Adjudicating the Parental Analogy:**
          *   Acknowledge the strength: Special relationships *do* generate special duties. We don't demand parents be impartial.
          *   Identify the justificatory features of parenthood:
              1.  Vulnerability/Dependency (The child *needs* this specific parent).
              2.  Non-Rivalry (Loving my child doesn't starve yours).
              3.  Developmental Goal (Raising an independent moral agent).
          *   Test Citizenship against these:
              1.  Vulnerability? Yes, we rely on the state.
              2.  Non-Rivalry? **No.** This is the break point. Trade protectionism, border closures, and resource hoarding *do* harm outsiders. My country's gain can be your loss.
              3.  Developmental Goal? States aren't trying to make citizens independent of the state in the same way parents do with children.
          *   Conclusion on Analogy: It holds for internal duties (paying taxes, voting) but fails for external partiality (immigration, trade, war).

      *   **Section 3: The Conditions for Virtue (The Verdict):**
          *   If the analogy fails on rivalry and external harm, when is patriotism okay?
          *   Condition 1: Justice of Institutions. You cannot be virtuously partial to an unjust regime. (The "Nazi Patriot" problem).
          *   Condition 2: The Threshold of Harm. Partiality is permitted only until it violates the basic rights or subsistence of outsiders.
          *   Condition 3: Reciprocity/Role. The duties must be reciprocal among citizens, not just top-down.
          *   Refining the Verdict: Patriotism is a virtue *only* when it functions as a mechanism for sustaining just institutions without violating the negative duties owed to humanity at large.

      *   **Conclusion:**
          *   Summarize the argument.
          *   Address the colleague's "begging the question" charge. (It's not begging the question to ask if the role itself is morally permissible).
          *   Final thought: Patriotism is a dangerous tool; virtuous only in careful hands.

  4.  **Review and Refine (Self-Correction during drafting):**
      *   *Check Word Count:* Keep an eye on expansion. Need to ensure I don't spend too much time on the setup and enough on the adjudication.
      *   *Tone:* Needs to be philosophical but accessible, firm but fair to the colleague's view.
      *   *Constraint Check:* Did I avoid citations? Yes. Did I reach a verdict? Yes. Did I use the sentiment/partiality distinction? Yes.
      *   *Strengthening the Argument:* The colleague says impartialism begs the question. I need to counter that. The counter is that *roles* themselves must be justified impartially. We don't allow a "mafia member" role morality to excuse harm. So, the impartial standpoint *does* get to judge the role. I should make sure this point lands clearly.
      *   *Refining the Parental Analogy:* Make sure to highlight the "zero-sum" aspect the user mentioned. That's crucial. Parents feeding their kids doesn't usually starve others. States protecting their economies often do.

  5.  **Final Polish:** Check flow, transitions, and ensure the "Verdict" is explicit. (The prompt asks for "Patriotism is a virtue under conditions X...").

  *(Self-Correction Note)*: I need to make sure I don't just say "it depends." I need to specify *X*.
  *X = When patriotic partiality is subordinate to basic human rights and restricted to non-rival goods or just institutions.*

  Let's write.

