answer: |-
  I hear you. Two hours at a diner is about ninety minutes too long for mereology before the coffee wears off and the ontological vertigo sets in. Marisol sounds like she's working from a textbook—probably reciting Universalism (everything is a thing), Nihilism (nothing is a thing), or Brutalism (composition is brute fact). Those are clean theories, but they flatten the world. Your intuitions are messy, but they track how we actually live in the world. You aren't looking for a clean theory; you're looking for a *principled way to keep your distinctions*.

  As a metaphysician who works on this, I'm going to tell you something honest: Your gut is fighting a war between two different criteria for "thinghood." One is **causal integration** (how the parts hold together), and the other is **teleology** (what the parts are *for*).

  Let's build your principle from the ground up, using your verdicts as the data. I'm not going to try to talk you into Marisol's menu. I'm going to try to write the constitution for the country you already live in.

  ### Phase 1: Diagnosing the Intuitions

  First, we need to separate what is doing the work in your head from what is just linguistic habit.

  1.  **The Contact Test:** Two bricks = No. Wall with mortar = Yes.
      *   *Diagnosis:* Mere proximity isn't enough. You need a **binding medium** or a **structural lock**.
  2.  **The Intention Test:** Pile of sand = No. Sandcastle = Yes.
      *   *Diagnosis:* Physics alone doesn't create the object. An **external agent's purpose** confers unity. This is a huge commitment: it means some objects depend on minds to exist.
  3.  **The Life Test:** Cat = Yes. Dead Cat = Yes. Swarm = No. Man o' War = Yes. Human = Yes.
      *   *Diagnosis:* You prioritize **biological homeostasis** (parts working to keep the whole alive). But the Dead Cat case shows you also value **historical continuity**. Once a thing is formed, it persists through some degradation.
  4.  **The Boundary Test:** Cloud/River = No. Cup = Yes.
      *   *Diagnosis:* You reject things with **arbitrary or fluid boundaries**. A river is just water moving through a channel; a cup has a specific shape that defines it.
  5.  **The Abstraction Test:** Corporation/Team/Marriage = No.
      *   *Diagnosis:* You are a **concrete particularist**. You don't count social constructs or abstract groups as "objects" in the same sense, even if they have legal power.

  ### Phase 2: The Candidate Principle

  Based on this, I propose we call your view **The Principle of Integrated Capacity**.

  > **Principle of Integrated Capacity:** A plurality of parts composes a single object if and only if:
  > 1.  **Integration:** The parts are physically bound such that they cannot be separated without force or structural failure (The Mortar Clause); **AND**
  > 2.  **Capacity:** The arrangement enables a specific capacity or function that the parts lack individually, derived either from:
  >     *   (a) **Internal Homeostasis:** The parts regulate each other to maintain the structure (The Organism Clause); OR
  >     *   (b) **External Design:** The parts were arranged by an agent to serve a purpose (The Artifact Clause); **AND**
  > 3.  **Persistence:** The object persists through minor loss of function provided the structural integrity remains recognizable (The Continuity Clause).

  Let's run your cases through this machine and see where it jams.

  #### The Wins (Where the principle fits your gut)
  *   **Two Bricks vs. Wall:** Fails Integration (no mortar) vs. Passes Integration + Artifact. **Verdict: Matches.**
  *   **Pile vs. Sandcastle:** Pile fails Capacity (no design). Castle passes Artifact Clause. **Verdict: Matches.** (This explains why you feel the pile isn't a thing even if the physics is similar).
  *   **Cat & Human:** Passes Internal Homeostasis. **Verdict: Matches.**
  *   **Cup:** Passes Artifact Clause. **Verdict: Matches.**
  *   **Tornado/Cloud/River:** Fail Integration (fluid boundaries, no binding medium). They are *processes* or *stuff*, not *objects*. **Verdict: Matches.**
  *   **Corporation/Team:** Fail Integration (physical binding) and are abstract. **Verdict: Matches.**

  #### The Friction Points (Where you'll have to pay a cost)
  *   **The Dead Cat:** It fails Internal Homeostasis (it's rotting). You save it with the **Continuity Clause**.
      *   *The Cost:* You have to accept that "objecthood" is partly historical. A corpse is a thing *because it was a cat*, not because of what it is doing now. If you burn it to ash, it stops being one thing. You need a threshold for "too much rot."
  *   **The Glued Cup:** Passes Continuity. It was a cup, now it's a "repaired cup."
      *   *The Cost:* You have to accept that destruction doesn't instantly annihilate objecthood if reconstruction is attempted.
  *   **The Swarm vs. Beehive vs. Man o' War:**
      *   *Swarm:* Fails Integration (bees can leave). Fails Homeostasis (no shared biology). **Verdict: Not a thing.** (Matches your gut).
      *   *Man o' War:* Passes Homeostasis (zooids are genetically identical and physiologically dependent). **Verdict: One thing.** (Matches your gut).
      *   *Beehive:* This is your trouble spot. A hive has a queen, workers, structure. But bees are independent organisms.
      *   *The Fix:* Under Integrated Capacity, the **Hive** (the physical structure + bees) might be an artifact/ecosystem, but the **Colony** is not a single *object* in your sense. It's a society. The Man o' War is one *organism*.
      *   *The Cost:* You must deny that a bee colony is an "organism" in the same way a human is. It is a *superorganism* functionally, but not a *single object* metaphysically. This contradicts some biology texts, but fits your metaphysics.
  *   **The Coral Reef:** Marisol says Reef=Yes, Coral=No. You want Coral=Yes, Reef=No.
      *   *The Fix:* Individual Coral Polyps are organisms (Homeostasis). The Reef is a *geological structure* built by them (like a beehive).
      *   *The Cost:* You have to stand firm that the Reef is "just a lot of coral and rock," even if ecologists treat it as a unit. You are prioritizing *ontological unity* over *ecological utility*.

  ### Phase 3: Rival Candidates (And why they fail you)

  If Integrated Capacity feels too complex, here are the two simpler rivals you might be tempted by, and why they will make you unhappy:

  1.  **Strict Organicism:** Only living organisms are things.
      *   *Why it fails:* You'd have to say the Cup and the Sandcastle aren't things. You clearly think artifacts are real.
  2.  **Strict Intentionalism:** Only things made by minds are things.
      *   *Why it fails:* You'd have to say the Cat and the Human aren't things (unless you believe in creationism), and the Dead Cat stops being a thing the moment life ends.

  **Integrated Capacity** is the only one that saves the Cat, the Cup, and the Dead Cat simultaneously. But it is a **hybrid theory**. It admits there are two ways to be a thing (Life and Design). That is the price of admitting your intuitions are correct.

  ### Phase 4: The Sharpest Test Cases

  You asked me to predict your verdict on new cases using this principle. Here is where the rubber meets the road. If you disagree with these predictions, we need to tweak the principle.

  **1. A Frozen Embryo**
  *   *Analysis:* It is biological material (Integration). It has the capacity for homeostasis, but it is paused (suspended animation). It was "designed" by biological processes to become an organism.
  *   *Prediction:* **One Thing.**
  *   *Reasoning:* It falls under the **Continuity Clause** of an organism. It is a paused cat/human. Unlike the dead cat, the capacity for homeostasis is latent, not extinct.
  *   *The Vibe Check:* If you say "No," you value *active* function over *potential* function. If you say "Yes," you value *biological identity*. My bet is you say **Yes**.

  **2. A Lake**
  *   *Analysis:* Water held in a basin. Boundaries change with rain/evaporation. No internal regulation. No external designer (usually).
  *   *Prediction:* **Not One Thing.** (It is "water in a hole").
  *   *Reasoning:* Fails Integration (fluid) and Boundary Test (arbitrary edges). Like the River and Cloud.
  *   *The Vibe Check:* You might want to say "Yes" because a lake feels more static than a river. But if you're consistent about the River, the Lake must go. It's a *feature of the landscape*, not an *object*.

  **3. A Wikipedia Article**
  *   *Analysis:* A collection of words, edits, and server data. No physical binding. Socially constructed.
  *   *Prediction:* **Not One Thing.** (It is a document/concept).
  *   *Reasoning:* Fails Integration (physical). It's like the Corporation. It exists legally/informationally, but not as a concrete object.
  *   *The Vibe Check:* This will hurt. You might feel it *is* a thing because it has an identity. But your rejection of the Corporation suggests you should reject this too. It's an *abstract object*, not a *concrete whole*.

  **4. A Marriage**
  *   *Analysis:* Two humans bound by law/vow.
  *   *Prediction:* **Not One Thing.**
  *   *Reasoning:* Fails Physical Integration. It is a social status. Like the Basketball Team.
  *   *The Vibe Check:* Poetically, it's one flesh. Metaphysically, on your principles, it's two people with a contract. If you say "Yes," you are admitting social constructs can create metaphysical unity, which undermines your rejection of the Corporation.

  **5. A Species (e.g., "The Tiger")**
  *   *Analysis:* A group of organisms sharing traits.
  *   *Prediction:* **Not One Thing.** (It is a class/kind).
  *   *Reasoning:* No physical integration between a tiger in India and a tiger in a zoo.
  *   *The Vibe Check:* Biologists sometimes treat species as "individuals" in an evolutionary sense. But on your view, without physical binding, it's just a category.

  ### The Honest Verdict on Your Principle

  You asked if there is a principle that gets all of these. The honest answer is **no**. Not without some friction.

  The **Principle of Integrated Capacity** gets you 90% of the way there. The 10% you pay for is in the **fuzzy boundaries of life**.
  *   **The Cost:** You have to accept that the line between "Colony" (Bees) and "Organism" (Man o' War) is a biological fact you don't get to vote on. If science says bees are more integrated than we thought, your metaphysics has to shift.
  *   **The Cost:** You have to accept that "Dead Cat" is a degenerate case. It is a thing *on loan* from its living state. It is slowly becoming "Not a Thing" (dust) as you watch.
  *   **The Cost:** You are committed to **Mind-Dependence for Artifacts**. The Sandcastle is a thing *because you think it is*. If an alien landed and didn't know what a castle was, the Sandcastle would be, to them, just a Pile. You are okay with this, but it means some "things" are only things *for us*.

  ### Final Advice for the Argument with Marisol

  Marisol wants a rule that applies to the universe regardless of humans. You want a rule that applies to the world *as we encounter it*.

  Tell her this: **"Composition isn't just about physics; it's about capacity. A thing is a unit of action. If the parts can't act as a unit, either biologically or functionally, it's not a thing—it's just a lot of stuff."**

  If she pushes you on the Sandcastle (same grains as the pile), tell her: **"The grains didn't change, the causal powers did. The pile slides. The castle stands. The capacity for stability makes it a new object."**

  If she pushes you on the Beehive vs. Man o' War, tell her: **"Physiology trumps behavior. Bees choose to cooperate. Zooids have no choice. One is a team, the other is a body."**

  You aren't making this up as you go. You're a **Functionalist Restrictivist**. It's a respectable position. It just requires admitting that "what exists" depends partly on "what works." Go get some breakfast; you've earned it.
