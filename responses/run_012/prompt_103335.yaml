answer: |-
  ### 1. The Toast

  Good evening. For those who don't know me, I'm Alex. I've had the privilege of knowing Maya for a long time. Long enough to know that when she decides to do something, she doesn't do it halfway.

  Eleven years at the firm. That is not a blink of an eye. That is a decade of late nights, complex briefs, and a specific kind of pressure that most people never see. It was a real life. It was hard work. And I know there's a temptation tonight to talk about that time as if it was just the waiting room for this moment. I won't do that. To say she's leaving because she finally found what "really matters" implies the last eleven years didn't matter. They did. She was excellent.

  But now, she is going to teach history to teenagers in a town of four thousand people.

  I know what the standard toast sounds like. It usually involves a ladder. You know the one: climbing up, moving on, leveling up. It implies that this new choice is objectively *better* than the old one. But I know Maya too well to say that. This isn't a promotion. It's a translation. She is trading one kind of value for another kind of value. You can't weigh them on the same scale. The metrics of a corporate partnership and the metrics of a sophomore history class don't speak the same language. One isn't heavier than the other; they're just different currencies.

  I also won't tell you she's fearless. She isn't. She's terrified. She's trading a predictable grind for a chaotic unknown. She's trading a bonus structure for lesson plans that might fail on a Tuesday morning. She knows the risk. She knows that "following your heart" doesn't guarantee the rent gets paid easier.

  So, I'm not standing here to congratulate her on making the "right" choice. I don't think there was a right choice waiting in the weeds for her to find. I'm standing here to witness the courage it takes to make a choice when the scales don't balance.

  Maya, I love you. Not because you're a lawyer, and not because you're a teacher. I love you because you are willing to live a life that is true to who you are becoming, even when the map runs out. The lawyers here know the cost of the life you're leaving. The family here knows the hope for the life you're entering. I'm just here to say that whichever life you are living, I'm in it with you.

  To Maya. To the work, whatever it is. And to the courage to begin again.

  ***

  ### 2. Why I wrote it that way

  I avoided the word "incommensurable" explicitly because using jargon violates the "no lecture" rule, but I structured the argument around Ruth Chang's concept of being "on a par." By framing the careers as "different currencies" rather than a ladder, I signal the philosophy grads without alienating the parents.

  I validated the eleven years of law heavily. If I frame the law firm as a prison, I insult her colleagues present and invalidate her past identity. By calling it "excellent" and "real," I honor her history while still supporting the exit.

  I explicitly named her fear. Toxic positivity ("You'll be so happy!") feels false when someone is taking a massive pay cut and moving to a small town. Acknowledging the risk makes the support feel grounded. The closing promise ("I'm in it with you") shifts the focus from the *correctness* of the decision to the *continuity* of the friendship, which satisfies the family's desire for warmth without compromising your philosophical honesty.

  ***

  ### 3. If someone pushes back at dinner

  *   **If the brother-in-law asks, "Why couldn't you just say congratulations?":**
      "Congratulations implies she won a game. I'm honoring that she changed the game entirely. That's harder than winning."

  *   **If a lawyer colleague says, "So you think the firm was a waste?":**
      "Not at all. It was a valid life. I'm just saying this new one isn't an upgrade, it's a different language. You can't compare them."

  *   **If someone insists, "But surely teaching is more meaningful?":**
      "Meaningful in a different way. But 'meaning' isn't a single currency. She's trading stability for impact. Both cost something."

  *   **If they press, "Isn't that just being pessimistic?":**
      "No, it's being realistic. Pessimism is saying she'll fail. I'm saying the choice is hard, and she's brave enough to make it anyway."
