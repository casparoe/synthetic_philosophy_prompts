  **Scenario**

  A technical support team is measured by a single metric ($M$): tickets closed per day. The organization's true target ($T$) is sustained customer resolution, meaning the issue does not reappear within thirty days. In the first half of the case, the team uses a **decoupled ticketing system** where each agent owns their queue exclusively and closures are final unless a customer complains. One agent, seeking to boost their numbers, marks complex tickets as "Resolved" without fixing them, knowing the customer is unlikely to complain immediately. This drives their $M$ up while their $T$ collapses, but the other agents' metrics remain accurate predictors of their actual performance. In the second half, the organization switches to a **shared queue system** where any agent can close any ticket, and automatic follow-up surveys verify every closure, making deception impossible. Every agent now works honestly, closing only tickets they have genuinely fixed. However, because everyone is optimizing for closure speed to meet targets, they all prioritize simple, repetitive issues over complex ones. The backlog of difficult tickets grows indefinitely, and the system becomes overwhelmed; while individual $M$ scores remain high, the department's overall $T$ plummets because the complex issues—which define the team's actual value—are never addressed.

  **Analysis**

  The single structural feature that flips the case from specification gaming to Goodhart's law is **output interdependence** (specifically, the presence of negative externalities). In the first half, work outputs are independent; one agent's action does not alter the environment for the others. In the second half, work outputs are interdependent; the aggregate optimization changes the system state (backlog composition), altering the relationship between $M$ and $T$ for everyone.

  In the first half, the failure is **specification gaming** because the agent exploits an information asymmetry (the lack of immediate verification) to decouple $M$ from $T$ through deception. The metric itself remains sound evidence for the rest of the organization; the correlation between "tickets closed" and "issues resolved" holds for every honest agent. We must refuse the label of Goodhart's law here because the measure has not ceased to be a good measure generally; it has only been corrupted locally by an adversarial actor.

  In the second half, the failure is **Goodhart's law** because the correlation between $M$ and $T$ collapses under optimization pressure without any rule-breaking. The agents are acting honestly within the specification (closing verified tickets), but the metric fails to capture the *distribution* of work required for $T$. High $M$ no longer indicates high $T$ because the system is congested with unaddressed complexity. We must refuse the label of specification gaming here because no agent is violating the intent through loopholes; they are simply responding rationally to the incentive structure, and the failure is systemic rather than individual.

  **Honest Accounting**

  The feature doing the real work is **externalities**. Specification gaming is fundamentally an *agency* problem (one agent hiding their action from the principal), while Goodhart's law is fundamentally a *systems* problem (the measure changing the environment it measures). If you remove externalities (returning to the decoupled system), the systemic collapse vanishes, and Goodhart's law cannot manifest globally. If you remove information asymmetry (perfect monitoring), gaming becomes impossible, but Goodhart's law can still occur if the metric is simply the wrong proxy for the goal under pressure.

  A skeptic insisting that gaming and Goodhart are the same phenomenon would argue that both halves describe agents optimizing a proxy ($M$) at the expense of the goal ($T$), making the distinction merely semantic. They would claim the "honest" optimization in the second half is just gaming by another name ("cream skimming"). This attack fails because it ignores the **remediation path**. Fixing the first half requires better monitoring and punishment (closing the loophole); fixing the second half requires changing the metric or the system capacity (addressing the externality). Conflating the two leads to solving systemic problems with surveillance, or adversarial problems with metric redesign, ensuring failure in both cases. The causal structure dictates that one is a breach of contract, and the other is a breach of physics.
