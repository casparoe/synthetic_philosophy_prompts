answer: |-
  This is a classic bit of pub philosophy, and you've actually reconstructed the tension between **Extensionalism** (meaning = the list of things) and **Use Theory** (meaning = what you do with the word) very accurately. You're right to feel that two of these are fighting; in fact, you have a three-way brawl on your hands.

  Here is the breakdown of the damage, ranked from "fatal contradiction" to "mere tension," followed by the single excision that saves your position.

  ### The Conflicts (Ranked by Severity)

  **1. The Fatal Clash: (1) vs. (5)**
  *   **The Conflict:** This is the theoretical engine of your problem.
      *   **(1)** says meaning is a **list of objects** (Extension). If the lists differ, the meanings differ.
      *   **(5)** says meaning is a **job or skill** (Use/Function). It's about what the word *does* in a sentence.
      *   **Why it breaks:** You cannot define meaning as *both* "the objects it picks out" and "the job it does" without qualification. If meaning is just the list (1), then the "job" (5) is irrelevant. If meaning is the job (5), then the list (1) is just a byproduct.
      *   **Severity:** Critical. This is the root of the headache.

  **2. The Practical Clash: (2) vs. (4)**
  *   **The Conflict:** This is the argument you're having with Davey.
      *   **(2)** says Gongsun Long is technically right (on an identity reading).
      *   **(4)** says anyone denying "a white horse is a horse" is fiddling with the word *is*.
      *   **Why it breaks:** (2) validates Davey's move as logically sound. (4) invalidates Davey's move as linguistic cheating. You can't say "He's right because of how definitions work" and "He's wrong because he's fiddling with definitions" in the same breath.
      *   **Severity:** High. This is why the argument never ends.

  **3. The Structural Tension: (3) vs. (1)**
  *   **The Conflict:**
      *   **(3)** says "White horse" contains "Horse" (Compositionality).
      *   **(1)** says Meaning = The Set of Things.
      *   **Why it breaks:** The set of {White Horses} does not *contain* the set of {Horses}; it is a subset. If meaning is just the set (1), there is no structural "containment" of the word *horse* inside *white horse*, only a mathematical overlap. (3) implies meaning has internal structure; (1) implies meaning is just an output.
      *   **Severity:** Medium. It makes your theory of language clunky, but doesn't necessarily explode it.

  ---

  ### The Cheapest Give-Ups

  For each clash, here is the cheapest thing to sacrifice and what you lose by doing it.

  **For Clash 1 ((1) vs. (5)):**
  *   **Give Up:** **(1)**.
  *   **Cost:** You lose the ability to treat language like math. You can no longer say "Meaning is just reference." You have to admit that context, intention, and grammar matter.
  *   **Why it's cheap:** (1) is a very crude theory of meaning (often called "naive referentialism"). Almost no modern philosopher holds it without heavy modification. (5) is much more robust.

  **For Clash 2 ((2) vs. (4)):**
  *   **Give Up:** **(2)**.
  *   **Cost:** You have to concede that Gongsun Long's statement is *false* (or at least misleading), rather than "true on a technical reading."
  *   **Why it's cheap:** (2) relies entirely on (1). If you drop (1), (2) loses its support. You can keep the *insight* of (2) (that the concepts differ) without accepting the *conclusion* (that the sentence is true).

  **For Clash 3 ((3) vs. (1)):**
  *   **Give Up:** **(1)** (Again).
  *   **Cost:** Same as above.
  *   **Why it's cheap:** (3) is intuitively obvious. You clearly need to know what "horse" means to understand "white horse." (1) is the outlier that makes this hard to explain.

  ---

  ### The Nuclear Option: Drop Proposition (1)

  If you delete **(1) ("A word means the things it applies to and nothing else")**, the entire mess cleans up immediately.

  **Why this is the one:**
  Proposition (1) is the poison pill. It forces you into a corner where "White Horse" and "Horse" *must* be different meanings because they point to different sets of animals. This forces (2) to be true (validating Davey) and forces (4) to be false (invalidating your common sense). It also flattens meaning so much that (3) becomes hard to explain.

  By dropping (1) and keeping **(5) (Meaning is the job a word does)**, you can reconcile the rest:

  1.  **Reconciling (2) & (4):** Under Use Theory (5), the "job" of the word *is* in "A white horse is a horse" is **predication** (assigning a property), not **identity** (equating two definitions).
      *   Davey is treating "is" as an equals sign ($=$).
      *   You are treating "is" as a membership card ($\in$).
      *   Without (1) forcing you to look only at the *objects*, you can say Davey is using the wrong tool for the job. His sentence isn't "true on a technical reading"; it's a **category mistake**. He's using a word designed for classification to do a job of definition. This validates (4) (he is fiddling) without denying the logical distinction in (3).

  2.  **Saving (3):** If meaning is a job/skill, then "White Horse" is a compound skill. You use the "Horse" skill and the "White" skill together. This fits perfectly. The meaning of "Horse" is *in* "White Horse" functionally, even if the output (the specific animals) is narrower.

  3.  **Saving (6):** Translation works because you translate the *use*, not just the reference. In Chinese, the grammatical particles might make the "identity" reading more tempting than in English (Classical Chinese lacks a direct equivalent of the copula "is"). By dropping (1), you acknowledge that different languages carve up the *jobs* differently, but the underlying logic (Use) remains translatable.

  ### Does the Remaining Position Make Sense?

  **Yes.** If you drop (1), you are left with a position that closely resembles **Ordinary Language Philosophy** (think later Wittgenstein or J.L. Austin).

  **Your new coherent position looks like this:**
  *   **Meaning is Use (5):** Words are tools.
  *   **Ordinary Usage Prevails (4):** In the standard "job" of describing the world, "is" predicates. Denying this is breaking the rules of the game, not discovering a truth.
  *   **Concepts have Structure (3):** "White horse" builds on "horse."
  *   **The Paradox Explained:** Gongsun Long (and Davey) aren't revealing a deep truth about reality; they are highlighting that if you strip words of their ordinary *use* and treat them as abstract labels (which (1) tries to do), you get nonsense.
  *   **Frege Connection:** You mentioned Frege. Frege distinguished between **Sense** (the mode of presentation) and **Reference** (the object).
      *   (1) is purely about Reference.
      *   (3) and (5) are about Sense.
      *   Gongsun Long is arguing that the *Sense* of "White Horse" is not the *Sense* of "Horse." You agree! But you deny that difference in Sense implies difference in Reference (Ontology). A white horse *is* a horse in reality, even if the concept "White Horse" is not identical to the concept "Horse."

  **The Verdict:**
  Keep (3), (4), (5), and (6). Throw (1) in the bin. Let (2) go with it, or rewrite it to say: *"The concept 'white horse' is not identical to the concept 'horse', but that doesn't mean a white horse isn't a horse."*

  Next time Davey brings it up, tell him he's confusing **Sense** with **Reference**, or **Identity** with **Predication**, and ask him to buy the next round because his theory of meaning is outdated.
