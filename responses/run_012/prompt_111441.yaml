prompt: |-
  ok so my mate Davey has got me into this old Chinese text about a white horse and its now the thing we argue about whenever we've had a few, and I want my own position straight before the next round. The argument, the way I remember it (I read a cheap translation ages ago so don't hold me to the wording): he says a white horse is not a horse, and when the other guy pushes back he says horse is the word that picks out the shape and white is the word that picks out the colour, and a word that picks out a colour isn't a word that picks out a shape. Then the bit I actually find interesting — if you send someone to the market for a horse, a black one or a yellow one will do, but if you send them for a white horse, a black one won't do at all, so the two words clearly aren't doing the same job. He's meant to be one of the School of Names lot, and there's a whole pile of one-liners floating around in that tradition that sound like straight nonsense, like a bird's shadow never moving, or a white dog being black, and Davey reckons they're all secretly profound while I reckon half of them are just word games. Somewhere in there he also told me about some logician (Frege?) who had the mirror-image headache, that as soon as you put the in front of a concept it stops being a concept, which I don't really get but it feels like the same knot.

  Anyway, here's roughly where I've landed and I'd like you to tell me whether it actually hangs together, because I've got a nagging feeling two of them are fighting and I can't work out which. (1) A word means the things it applies to and nothing else — if two words cover exactly the same things they mean the same thing, and if they cover different things they don't. (2) Since white horse and horse don't cover the same things, they don't mean the same thing, which means that on the reading where is means is the same thing as, his sentence comes out true, and I don't think that's a cheat, I think that's just what the words do. (3) But white horse is obviously just white bolted onto horse — you can't understand white horse without understanding horse, so whatever white horse means, the meaning of horse has to be in there somewhere. (4) And a white horse is a horse, come on, and when I say that I'm talking about an actual animal, that's the thing the sentence is about — anyone who denies it is fiddling with the word is. (5) Meaning is the job a word does: what it lets you ask for, what it lets you rule out, what it commits you to. It's a skill, not a list of objects. (6) Translation basically works — languages might carve things up differently but nothing important gets lost, so there can't be some insight that only Chinese can carry.

  So: which of these actually pull against each other and which only look like they do, ranked by how bad the damage is rather than all listed as equally bad, and for each real clash what the cheapest thing to give up is and what I'd be losing by giving it up. Then tell me which single one of the six, if I dropped it, would clean up the most mess, and whether after that I'd still be holding a position that makes sense. I'm not asking which one is true, I'm asking whether I can hold all six at once — and please don't just flag everything, some of these I'm pretty sure are fine together.
