prompt: |-
  Longtime lurker, first time poster. Everytime illusionism about consciousness comes up in the comments, somebody drops "consciousness is an illusion" like it's a mic drop, and the thread immediately fractures: half the people read it as "you're sometimes wrong about your own mind, big deal," the other half read it as "there's literally nothing it's like to be you and anyone who says otherwise is confused," and then someone says "but an illusion has to seem like something to someone, so illusionism assumes the very thing it denies," and we all log off dumber.

  I'd like to actually get clear on this instead of vibing. Can you lay out the distinct precise claims that one-liner could be making? Give me a menu, roughly ordered from the boring/obviously-true end to the radical end, and for each reading say: is it trivial, is it substantive and defensible, is it false, and is it maybe self-undermining. I especially want the reading that's actually doing the work in the illusionist's argument -- the one where "illusion" means the brain systematically misrepresenting its own states as having a felt, intrinsic, in-the-moment character that they don't in fact have, so that there really is a real representational phenomenon (the introspective representation) but not the phenomenal properties it seems to report -- as opposed to the readings where it just collapses into flat eliminativism, or into "the self is an illusion," or into "perception can be fooled." Then tell me which of the readings would actually license what people use the slogan for, which is usually to declare the hard problem a non-problem and shut the thread down, and flag any reading where the slogan is true but says nothing a card-carrying non-illusionist would deny. Also, on the "illusion for whom?" objection, tell me whether it's a genuine refutation of any of the readings or just a confused demand that the illusion be witnessed by a little person inside. Menu format, with verdicts, so I can paste it next time this happens.
