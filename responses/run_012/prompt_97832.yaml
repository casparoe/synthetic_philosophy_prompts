answer: |-
  Based on the pattern of her previous rulings, here is the analysis of how she will likely classify the chimpanzee, the underlying conflict in her logic, and the test case that would resolve it.

  ### The Verdict
  She will almost certainly classify the wild chimpanzee as **Popperian**.

  ### The Competing Rules
  Your notes reveal a tension in how she defines the threshold for the Gregorian rung. Her verdicts so far are consistent with two different interpretations of what makes a mind "Gregorian," and the chimpanzee sits exactly on the fault line between them.

  **Rule 1: The Cultural Prosthetic Rule**
  *   **The Logic:** A mind is Gregorian if it relies on resources outside its own biology to function, specifically if it inherits "software" from others. This rule emphasizes the *source* of the intelligence (social transmission) and the *use of external aids*.
  *   **Evidence from notes:** She classifies the navigator as Gregorian for using a chart (external aid) and the child as Gregorian for using a written method (a procedure picked up from others). The definition includes "other people's procedures."
  *   **Prediction for the Chimp:** **Gregorian.** The chimp is using an external tool (the stone) and has acquired the "procedure" for using it from her mother (social transmission), evidenced by the cultural variation between communities.

  **Rule 2: The Representational Scaffolding Rule**
  *   **The Logic:** A mind is Gregorian only if the external tools are *representational*—meaning they carry information or symbols that restructure how the brain processes data, not just how it exerts force. This rule emphasizes the *type* of tool (symbols vs. objects).
  *   **Evidence from notes:** The specific examples she gives for Gregorian tools are "words, numerals, maps." These are all symbolic systems that offload *computation*. In contrast, the Crow (Popperian) solved a physical problem using internal simulation. The Beaver (Darwinian) built a physical structure but relied on instinct.
  *   **Prediction for the Chimp:** **Popperian.** The stone hammer is a physical effector (like the beaver's teeth), not a cognitive symbol (like the navigator's map). The chimp is using an internal model of physics to wield the tool (like the Crow), even if that model was socially acquired.

