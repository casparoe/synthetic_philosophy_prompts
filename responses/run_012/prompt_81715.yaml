      *   *The Comparison Class:* User is right. This is the "Ethnographic Present" fallacy. Marginal environments (Kalahari/Arctic) are not representative of Pleistocene grasslands.
      *   *Affluence:* Sahlins vs. Boserup. One is leisure, one is caloric density.
      *   *Progress:* The seminar needs to drop the word "Mistake." It's a moral judgment on a structural shift. Progress = analyzing *lock-in mechanisms* (population traps, path dependence).
      *   *Ill-posed?* The question "Was it a mistake?" is ill-posed. The question "What were the consequences?" is empirical.

  6.  **Refining the Tone:**
