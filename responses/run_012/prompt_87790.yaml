answer: |-
  This is a classic case of a "standard narrative" that was true in 1990 but has been heavily contested since 2000. The PhD student is reciting a textbook summary that ignores the last 25 years of metaethical development. Your skepticism is well-founded.

  Here is the breakdown of what a card-carrying expressivist (like Simon Blackburn, Allan Gibbard, or Mark Schroeder) would say, followed by an assessment of the conclusion.

  ### 1. The Breakdown

  **Claim:** *"Expressivism is... the sophisticated descendant of the old boo/hurrah theory of Ayer and Stevenson."*
  *   **Expressivist Verdict:** **Accepts (with caveats).**
  *   **Analysis:** They accept the lineage but reject the "boo/hurrah" label as reductive. Modern expressivism isn't about emotional outbursts; it's about *plans* (Gibbard) or *commitments* (Blackburn). It is a theory about the *state of mind* expressed by moral judgment, not just a noise you make.
  *   **Confidence:** 95%

  **Claim:** *"The Frege-Geach problem is what killed it... Geach noticed that moral words turn up in places where nobody is expressing any attitude."*
  *   **Expressivist Verdict:** **Accepts.**
  *   **Analysis:** This is an accurate description of the problem. The embedding problem (how moral terms work in conditionals/negations) is the central technical hurdle for expressivism.
  *   **Confidence:** 98%

  **Claim:** *"So 'wrong' has to be ambiguous between the two occurrences, and the argument's validity is an illusion."*
  *   **Expressivist Verdict:** **Rejects (Hard).**
  *   **Analysis:** This is the biggest caricature. Expressivists do **not** concede that "wrong" is ambiguous. That would be surrendering. The entire project of modern expressivism (especially Mark Schroeder's *Being For*) is to show how "wrong" can have a unified meaning across asserted and unasserted contexts without ambiguity, thereby preserving the validity of modus ponens. The student is describing the *charge* against expressivism as if it were the expressivist's *concession*.
  *   **Confidence:** 95%

  **Claim:** *"Expressivists spent decades patching this — Blackburn's quasi-realism... Gibbard bolts a theory of norms onto it — and it's generally agreed the patches don't hold."*
  *   **Expressivist Verdict:** **Rejects.**
  *   **Analysis:** Calling them "patches" is pejorative; these are full semantic frameworks. More importantly, the claim that it is "generally agreed the patches don't hold" is factually false regarding the current literature. Mark Schroeder's 2008 book *Being For* provided a formal semantic account that many (including realists) admit solves the technical F-G problem, even if they dislike the metaphysics. There is no consensus that the solutions fail.
  *   **Confidence:** 90%

  **Claim:** *"Which is why the field more or less moved on to non-naturalist realism."*
  *   **Expressivist Verdict:** **Rejects.**
  *   **Analysis:** This is sociologically wrong. While non-naturalist realism (Parfit, Scanlon, Shafer-Landau) had a massive resurgence in the 2000s/2010s, expressivism remains one of the "Big Three" live options (alongside Naturalist Realism and Error Theory). Major journals regularly publish defenses of expressivism. It is not a dead paradigm.
  *   **Confidence:** 85% (Sociological claims about "the field" are always slightly fuzzy, but this is definitely overstated).

  **Claim:** *"And note it only really bites on crude emotivism: any view that says moral sentences have truth conditions, like Hare's prescriptivism, is immune."*
  *   **Expressivist Verdict:** **Confused/Mixed.**
  *   **Analysis:** This reveals a misunderstanding of the F-G problem. The problem arises specifically for views that deny moral sentences have *descriptive* truth conditions. If a view says moral sentences have truth conditions (Cognitivism), F-G isn't a problem for them, but then they aren't expressivists. Hare is a prescriptivist (a type of non-cognitivist); he argues moral judgments have logic but aren't truth-apt in the descriptive sense. He faced F-G objections too. Immunity comes from being a Realist, not from being Hare.
  *   **Confidence:** 80% (Hare's exact classification is sometimes debated, but the logic here is muddled).

  ### 2. Does the Conclusion Follow?

  **Conclusion:** *"The problem is fatal and the field moved on."*

  **Verdict:** **No.**
  Even if you grant that Frege-Geach is a massive headache (which it is), the student presents a **False Dilemma**. He implies:
  1.  Expressivism fails F-G.
  2.  Therefore, Realism wins.

  This ignores:
  *   **Error Theory:** (Mackie, Joyce) Maybe moral sentences *try* to describe facts but fail, so they are all false. This handles F-G easily (it treats moral language as cognitivist but empty) but denies morality exists.
  *   **Successful Expressivism:** As noted, many argue Schroeder/Gibbard *did* solve F-G.
  *   **Naturalist Realism:** The field didn't just move to *non-naturalist* realism. Naturalist realism (Boyd, Brink, Railton) is arguably just as popular.

  The student is using the difficulty of Expressivism to smuggle in Non-Naturalist Realism as the default winner, which is a partisan move, not a neutral summary.

  ### 3. Confidence Ratings

  *   **The F-G problem is the main objection to expressivism:** 98%
  *   **Expressivists deny "wrong" is ambiguous in conditionals:** 95%
  *   **There is no consensus that expressivist solutions fail:** 90%
  *   **Expressivism is still a "live" research program:** 85%
  *   **Hare's Prescriptivism is immune to F-G because it has truth conditions:** 80%

  ### 4. The Point I Am Least Sure About

  **The classification of R.M. Hare regarding truth conditions.**
  I assigned this 80% confidence. The student claims Hare is immune because his view has "truth conditions." Hare is a Universal Prescriptivist. He argues moral judgments are prescriptions (imperatives) that are universalizable. While he argues they have *logical consistency* and *correctness*, standard interpretation holds that he denies they have *truth values* in the descriptive sense (which is why he is a non-cognitivist). However, some interpretations suggest Hare allows for a deflated notion of truth. If Hare *does* grant robust truth conditions, he collapses into a form of realism, and the student's point stands trivially. If he doesn't, the student is wrong that he is immune. The literature on Hare's exact semantic commitments is dense and sometimes contradictory, making this the shakiest specific technical claim in the student's post.

  ### Summary for your Discord
  If you want to push back without sounding like an amateur, say this:

  > "This feels like a summary from a 1995 textbook. It accurately states the Frege-Geach problem, but it presents the expressivist *challenge* as an expressivist *concession* (the ambiguity charge). Modern expressivists like Schroeder and Gibbard explicitly argue they can solve F-G without ambiguity. Also, the claim that the field 'moved on' to non-naturalism ignores that expressivism, error theory, and naturalist realism are all currently dominant, live options. The consensus isn't that expressivism died; it's that it got technically much more sophisticated."
