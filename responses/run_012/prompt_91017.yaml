      *   *The Gap:* The narrator sees the event; the book asserts the geography. This is the difference between *focalization* (character view) and *omniscient truth* (authorial view).

  4.  **Drafting Section 2: The Residue Report (The Friction):**
      *   *Clean Translation:* The idea of layers. Novels do this naturally (scene + summary + setting).
      *   *Distorted:* "Setting." For Braudel, geography is destiny. For a novelist, setting is often chosen for mood or plot utility. If the user "chose" the river, is it Braudelian? Braudel would say the river chose *them*.
