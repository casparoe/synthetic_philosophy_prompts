          *   *Novelistic equivalent:* Setting, but not just backdrop. It's the constraint. The river, the flood plain, the mill's physical location. It's the "world of the story" vs. the "plot."
      *   *Social Time (Conjunctures):* Decades, cycles, economies, mentalities.
          *   *Novelistic equivalent:* Backstory, generational trauma, subplots, the "water they swim in." The slow drift of family habits.
      *   *Individual Time (Événements):* Wars, kings, coups. Fast, noisy, superficial.
          *   *Novelistic equivalent:* Scenes, plot points, inciting incidents. The "one-damn-thing-after-another."

  3.  **Drafting Section 1: Translation (The Vocabulary Swap):**
      *   *Goal:* Faithful restatement using craft terms, acknowledging friction.
      *   *Geography/Setting:* Braudel's geography isn't just where you put the furniture. It's the cage. In the novel, the river isn't just setting; it's the structural load-bearing wall. It dictates what *can* happen.
      *   *Social/Backstory:* This isn't just "what happened before page one." It's the slow arc. The way the grandfather's greed becomes the grandson's anxiety. It's the *summary* parts of the novel, the passages where time compresses.
