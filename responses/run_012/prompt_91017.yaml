      *   *Vocab vs. Vagueness:* It's not that the novelist lacks words for "slow time." It's that fiction *requires* specificity to create empathy. Braudel can talk about "grain prices in 1600s." A novelist needs a character eating bread.
      *   *World vs. Story:* *Longue durée* is a claim about reality (structures matter more than sparks). But for a novelist, it becomes a structural technique (interleaving timelines).

  5.  **Drafting Section 3: The Event Problem (Froth vs. Scene):**
