answer: |-
  # SEMINAR HANDOUT: SPECIFICATIONS FOR A THEORY OF PRUDENTIAL CONCERN

  **Course:** Graduate Seminar on Personal Identity
  **Topic:** The Desiderata of Survival
  **Purpose:** To define the necessary conditions any account of "what matters" must satisfy, independent of whether that account preserves strict identity.

  Below is a specification list. Each entry names a requirement, provides the motivating case or consideration, classifies its status, and flags known tensions with other requirements. **Pay closest attention to the flagged tensions; the goal of this seminar is to determine if this specification list is jointly satisfiable.**

  ### 1. The Fission Compatibility Requirement
  *   **Motivation:** In a standard fission case (e.g., brain hemispheres transplanted into two bodies), both resulting persons are psychologically continuous with the original. Intuition suggests the original has prudential reason to care about *both* outcomes equally, even though they cannot both be identical to the original. A theory that says "what matters" vanishes because identity is lost in fission fails to capture our prudential intuitions.
  *   **Status:** **Non-negotiable.** (To deny this is to claim survival is all-or-nothing based on uniqueness, which contradicts the symmetry of the case.)
  *   **Tension:** Conflicts with **Requirement 6 (Transitivity/Uniqueness)** and **Requirement 2 (Simultaneity)**. If what matters can branch to two future people, the relation is not one-to-one. If it is not one-to-one, it cannot be strict identity.

  ### 2. The Simultaneity Constraint (The "Waiting Game")
  *   **Motivation:** *Invented Case:* A transmitter scans you and begins constructing a replica at the destination, a process taking five years. You remain alive, awake, and in communication with the construction site during this delay. At year five, the replica activates. You meet him. Despite perfect psychological continuity, the intuition is that you are *not* him, and his future does not justify your current anticipation, because you are both present. "What matters" cannot hold between two contemporaries who can interact as distinct agents.
  *   **Status:** **Non-negotiable.** (Prudential concern is forward-looking; it collapses if the object of concern is presently existing as a distinct agent.)
  *   **Tension:** Conflicts with **Requirement 1 (Fission Compatibility)**. Fission implies continuity is sufficient for what matters. The Simultaneity Constraint implies continuity is *not* sufficient if the continuous being coexists with the original. This makes "what matters" dependent on extrinsic facts (whether the original died), violating **Requirement 7 (Intrinsicness)**.

  ### 3. The Volitional Sensitivity Constraint (The "Consent Gate")
  *   **Motivation:** *Invented Case:* Variant of the above. The replica is reconstructed only if, at the moment of transmission, you consent to be destroyed upon its completion. If you refuse, the machine halts, and you live on. If you consent, you die, and the replica lives. Does the replica's survival matter to you? If yes, your survival depends on your consent to die (circular). If no, psychological continuity is insufficient without a specific normative stance on your own cessation. The theory must explain whether the agent's *authorization* of the transfer is constitutive of the prudential link.
  *   **Status:** **Camp Preference** (Agency-Based Views). (Metaphysical views may reject this, claiming the link exists regardless of consent.)
  *   **Tension:** Conflicts with **Requirement 8 (Epistemic Accessibility)** if the "validity" of the consent depends on hidden metaphysical facts, and conflicts with **Requirement 1 (Fission)** if consent cannot be given to two divergent futures simultaneously without contradiction.

  ### 4. The Valence Independence Requirement
  *   **Motivation:** *Case:* A future being is psychologically continuous with you but will lead a life of unremitting misery (the "Wretched Self"). You still recognize this being as the proper object of your *self*-concern (e.g., you fear *his* pain, rather than merely pitying a stranger). A theory that ties "what matters" to the expectation of pleasure or preference satisfaction fails here; the concern is de re, not based on the quality of the experience.
  *   **Status:** **Non-negotiable.**
  *   **Tension:** Conflicts with **Requirement 9 (Coherence)** if the theory requires an agent to desire their own future misery solely based on metaphysical linkage, which may be psychologically impossible to sustain.

  ### 5. The Gradualism Requirement (Degrees and Sorites)
  *   **Motivation:** *Case:* Gradual replacement of brain parts with functionally identical substitutes. There is no sharp boundary where "you" stop and "someone else" begins. Therefore, "what matters" must admit of degrees. It must be possible to care *more* about a future self who is 90% continuous than one who is 10% continuous.
  *   **Status:** **Non-negotiable.** (To deny this is to accept magical sharp boundaries in a continuous physical process.)
  *   **Tension:** Conflicts with **Requirement 6 (Transitivity)**. If relation R holds between A and B to degree *x*, and B and C to degree *x*, does it hold between A and C? If degrees aggregate, transitivity fails. If transitivity holds, degrees are hard to model without arbitrary thresholds.

  ### 6. The Structural Specification (Transitivity and Multiplicity)
  *   **Motivation:** The theory must explicitly settle the logical structure of the "what matters" relation (M).
      *   *Transitivity:* If A stands in M to B, and B to C, must A stand in M to C? (Required for long-term planning).
      *   *Multiplicity:* Can two contemporaries (A and B) both stand in M to one future person (C)? (The reverse of fission).
  *   **Status:** **Non-negotiable.** (The theory must take a stand; agnosticism is not a specification.)
  *   **Tension:** **Critical Incompatibility.** If M is transitive and allows branching (Fission), then A matters to B1 and B2. If B1 and B2 later merge or interact, A matters to the merged entity. But if M is non-branching (to save Identity), Fission is ruled out. You cannot have Transitivity, Branching, and Uniqueness simultaneously.

  ### 7. The Intrinsicness Requirement
  *   **Motivation:** Whether my future self matters to me should depend on the intrinsic relation between us (psychological/physical continuity), not on extrinsic facts (e.g., whether a duplicate happens to exist on Mars). If a duplicate exists, it shouldn't logically sever the prudential link to the original survivor unless the duplicate affects the intrinsic chain.
  *   **Status:** **Camp Preference** (Lockean/Parfitian). (Animalists may reject this, allowing extrinsic biological facts to determine survival.)
  *   **Tension:** Conflicts directly with **Requirement 2 (Simultaneity)**. The Simultaneity Constraint makes the prudential link depend on the *extrinsic* fact of whether the original is still alive. This is the "Extrinsicness Objection" to Psychological Continuity theories.

  ### 8. The Epistemic Accessibility Constraint
  *   **Motivation:** An agent must be able to know, in principle, whether a future being is the proper object of prudential concern. If "what matters" turns on a metaphysical fact that is undetectable (e.g., whether the teletransporter destroys the original or merely copies it, where the difference is empirically hidden), the theory fails to guide rational action.
  *   **Status:** **Non-negotiable.** (Prudential concern is a guide to action; unknowable grounds cannot guide action.)
  *   **Tension:** Conflicts with **Requirement 10 (Metaphysical Grounding)**. If the ground of "what matters" is a deep metaphysical fact (e.g., a Cartesian Ego or strict Biological Identity) that might be hidden from the agent, this constraint rules it out. It forces the theory toward phenomenological or functional accounts.

  ### 9. The Coherence Constraint
  *   **Motivation:** The theory must not require the agent to hold contradictory beliefs or adopt a stance that undermines the possibility of agency. For example, a theory cannot require me to believe "I will survive" and "I will cease to exist" simultaneously in a way that paralyzes decision-making.
  *   **Status:** **Non-negotiable.**
  *   **Tension:** Conflicts with **Requirement 3 (Volitional Sensitivity)** if the agent is required to consent to their own destruction to survive, creating a pragmatic paradox in the intention formation.

  ### 10. The Non-Circular Justification Requirement
  *   **Motivation:** The theory must answer *why* the specified relation (e.g., psychological continuity) justifies prudential concern without simply presupposing that it does. It cannot say "I care about him because he is me" if "me" is defined by the relation that justifies the care.
  *   **Status:** **Non-negotiable.**
  *   **Tension:** Conflicts with almost all reductive accounts. Reductive accounts define the self in terms of the relation, then use the self to justify the concern. Non-reductive accounts posit a "Further Fact," which violates **Requirement 8 (Epistemic Accessibility)**.

  ---

  ### SUMMARY OF CRITICAL INCOMPATIBILITIES

  1.  **The Fission/Extrinsicness Paradox:** You cannot satisfy **Requirement 1 (Fission Compatibility)** and **Requirement 7 (Intrinsicness)** while respecting **Requirement 2 (Simultaneity)**. If what matters branches (Fission), it must be intrinsic. But if it respects Simultaneity (I don't matter to my living duplicate), it depends on the extrinsic fact of whether the original died.
  2.  **The Epistemic/Metaphysical Gap:** You cannot satisfy **Requirement 8 (Epistemic Accessibility)** and **Requirement 10 (Non-Circular Justification)** if the ground of concern is metaphysical. If the ground is knowable, it is usually reducible (violating Justification). If it is irreducible, it is usually hidden (violating Accessibility).
  3.  **The Structure Trilemma:** You cannot simultaneously hold that the relation admits of **Degrees (Req 5)**, is **Transitive (Req 6)**, and preserves **Uniqueness (implied by Req 2)**.

  ---

  **The Epistemic Accessibility Constraint does the most to exclude the theories currently on offer because it renders incoherent any view that grounds what matters in metaphysical facts potentially hidden from the subject, which eliminates both "Further Fact" realist views and any version of Psychological Continuity that relies on extrinsic non-branching clauses.**
