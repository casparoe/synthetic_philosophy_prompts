prompt: |-
  I'm helping a state wildlife agency redraft the definition section of an endangered-lineages bill, and they've asked me to recommend which species concept to hard-code into the statute. Rank the usual suspects (biological, morphological, phylogenetic/monophyletic, ecological, evolutionary lineage, genotypic cluster, and anything else you think deserves a slot) from best to worst for that job, one or two sentences on why each lands where it does.

  Three things about the law pull against each other, so factor them in: field officers have to make a call on the spot with a phone photo and a cheek swab, not a breeding experiment; a listing needs to survive the next twenty years of taxonomic revision without getting automatically voided every time somebody redraws a tree; and the whole point is to catch the weird cases, i.e. hybrids, ring species whose ends have finally met, lineages that traded genes sideways, and parthenogens.

  Also tell me which one you think gets a bad rap in these debates and should really rank higher than its reputation suggests.
