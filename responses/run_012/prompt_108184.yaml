answer: |-
  1. **Evolutionary Lineage Concept:** This is the optimal legal standard because it defines the protected object (a distinct trajectory) rather than a specific mechanism, ensuring listings survive taxonomic reshuffling while accommodating hybrids and asexuals as persistent lineages.
  2. **Genotypic Cluster Concept:** It ranks second as the primary evidentiary tool, aligning perfectly with cheek-swab diagnostics to objectively identify distinct groups and hybrid zones without requiring a resolved phylogenetic tree.
  3. **Morphological Species Concept:** While it risks missing cryptic diversity, it remains essential for immediate field enforcement via phone photos and offers the highest long-term stability against genetic re-analysis.
  4. **Ecological Species Concept:** This captures the functional role conservation aims to protect, but niche boundaries are too difficult for field officers to verify on the spot compared to physical or genetic traits.
  5. **Phylogenetic Species Concept:** Reliance on monophyly makes this too unstable for statute, as listings could be automatically voided every time a graduate student redraws a tree with new data.
  6. **Biological Species Concept:** This is operationally impossible for field officers to test and legally excludes asexual organisms and stable hybrid zones, directly contradicting the bill's goal to catch "weird cases."

  **The Concept with a Bad Rap:** The **Genotypic Cluster Concept** is often dismissed in academic debates as a temporary proxy for "real" phylogenetics, but it should rank higher for policy work. For a statute requiring twenty-year stability and the ability to legally recognize hybrids without demanding a perfect evolutionary tree, it is far more robust and defensible than tree-based methods.
