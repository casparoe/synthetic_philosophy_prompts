      *   **Ismene's Refusal:** Ismene represents the pragmatic citizen. She says "we are women," "we must obey." She highlights that the obligation Antigone feels is not universal civic duty but a specific familial/divine bond. This supports the user's view: the obligation binds *her* specifically, not because of public utility, but because of kinship with the dead.
