answer: |-
  Sophocles' *Antigone* collapses the distinction between burial and commemoration to argue that the political community is bound by obligations to the dead that precede its own authority, challenging the modern view that monuments are solely messages to the living. While your friend is correct that Antigone's act is funerary rather than statuary, in the Greek imagination the *taphos* (grave) was the prerequisite for *kleos* (glory/memory); to deny burial is to erase the dead from the human record, making Antigone's scattering of dust the foundational act of public memory rather than a private hygiene ritual. The play suggests that commemoration is not merely a present community speaking to itself, but a negotiation with a past that retains a claim on the present, a claim that cannot be waived by civic decree.

  Ismene's refusal clarifies the nature of this obligation. She argues from the position of the living citizen: "we must remember we are women," "we must obey those in power." Her pragmatism highlights that Antigone's duty is not derived from civic utility or contemporary consensus, but from a specific, unchosen bond with the dead that binds the kin regardless of the state's approval. This supports your position that the living are custodians of an obligation they cannot waive; Ismene believes she can waive it based on present circumstances, while Antigone treats the obligation as transcendent, existing outside the timeline of the living community. However, the play resists a purely saintly reading of this custodianship. Antigone does not act solely for Polynices' sake; she explicitly seeks witness from the living, telling the Chorus, "I should have won no such glory" if she were not doing what she knows is noble. Here, your friend's insight holds: Antigone needs the community to see her piety to validate her identity. The act is for the dead, but its meaning is consummated among the living. This tension suggests that commemoration is never purely one-directional; it is a relay between the claims of the dead and the recognition of the living.

  The Chorus's ambivalence further complicates the idea that the dead are the sole addressees. They pity Antigone but never fully endorse her rebellion against the *polis*, singing of the wonders of man and the necessity of law. They represent the community trying to reconcile the unwritten laws of the gods with the written laws of the city. Their hesitation shows that while the obligation to the dead is real, its enactment within the political sphere is destabilizing. This destabilization is physicalized in Creon's decision to seal Antigone in a vault rather than execute her. By entombing her alive, Creon attempts to administer death without bloodguilt, yet he inadvertently replicates the denial of burial he inflicted on Polynices. He makes Antigone herself a contested monument, sealed away from the city she sought to witness her virtue. This mirroring suggests that when a city denies the claims of the dead (Polynices), it inevitably distorts its treatment of the living (Antigone), proving that the two realms are not separate categories but interdependent conditions.

  Creon's reversal arrives too late to be of use, which is the play's steepest warning to your commission. He yields only after Tiresias forces him to see that the birds are choking on the flesh of Polynices—the dead have physically contaminated the living space. The wisdom arrives too late because the violation was not a policy error but a rupture in the order of things; Haemon and Eurydice die not because the statue was controversial, but because the city assumed it had the sole authority to define value. The tragedy implies that the dead *do* have interests, mediated through the gods and the psychological health of the survivors, and ignoring them collapses the future of the community.

  Where the play resists your reading is in its insistence that Antigone's stand is uniquely hers, not a universal civic duty. She is not fighting for a general principle of free speech or heritage; she is fighting for a brother. This suggests that commemoration may not be a abstract public good, but a specific debt. However, this specificity is exactly what the modern definition of commemoration often lacks. Your commission's terms—durability, publicity, address to a political community—treat monuments as press releases, statements of current values meant to endure. *Antigone* supplies what those terms cannot: the idea that a monument is a pledge of continuity, a promise that the community's identity is not self-generated but inherited and indebted. If the dead are listening, a monument is not a statement we make about ourselves, but a receipt for a debt we acknowledge we owe. It limits what the living can do, reminding us that we are custodians of a story that began before us and must outlast us, not merely architects of a message for our own time.
