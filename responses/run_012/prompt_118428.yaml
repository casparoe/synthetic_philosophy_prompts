answer: |-
  ### Part 1: Brainstorming the Talk's Commitments

  **What you are actually claiming:**
  1.  **Structural Identity:** The logical behavior of "wrong" in complex sentences is isomorphic to "might" and "tasty."
  2.  **Semantic Uniformity:** There is no need for a *sui generis* expressivist logic (like Gibbard's logic of consistency in planning). Standard semantic machinery for modals/taste (likely dynamic or relativist) suffices.
  3.  **The "Licence" Model:** The semantic value of a normative claim is not a proposition (truth-apt) nor a raw mental state, but a *context-change potential* (or function from contexts to action-permissions).
  4.  **Embedding Mechanism:** Embedding works by *hypothetically* updating the context (the "practical setting") rather than expressing an actual attitude.

  **Structural Commitments:**
  *   **Context-Dependence:** You are committed to "wrong" being context-sensitive (the "practical setting" is a parameter). This makes you a contextualist or relativist, not a classical invariantist expressivist.
  *   **Non-Truth-Conditionality (likely):** If the output is a "licence," you need to explain how conditionals compose. If "If P then Q" is truth-conditional, but P and Q are licences, you have a type mismatch unless you move to a dynamic framework where *everything* is an update function.
  *   **Disagreement:** If "wrong" is just a licence relative to a plan, you need to explain how two people with different plans *disagree* rather than just *differ*.

  **Load-Bearing Walls:**
  1.  **The Analogy:** If "tasty" and "might" *don't* actually embed as cleanly as you claim (see: the relativist in the room), your premise collapses.
  2.  **Compositionality:** The "suspended licence" metaphor must cash out as a formal composition rule. If it's just a metaphor, the semanticist will eat you.
  3.  **The "Practical Setting":** This needs to be rigid enough to explain validity (Modus Ponens must hold) but flexible enough to explain disagreement.

  ---

  ### Part 2: The Prep Sheet

  Here are the objections ordered by potential damage. The "Soft Spot" is where they will push if they smell blood.

  #### 1. The Semanticist (Damage: Critical)
  **The Objection:** "You say the antecedent 'suspends' the licence. Fine. But give me the type. If the semantic value of 'Lying is wrong' is a function from contexts to licences, what is the semantic value of 'If lying is wrong...'? Is it a function from functions to licences? If you're doing dynamic semantics, show me the update rule. If you're doing truth-conditions, how does a licence have a truth value? 'Suspended licence' sounds like a gloss, not a semantics."

  **The 2-Minute Reply:** "Fair. I'm proposing a dynamic framework where the content of a normative claim is its potential to update a *practical* context, parallel to how 'might' updates an *informational* context. In a dynamic system, the conditional 'If P, Q' tests whether updating the context with P allows an update with Q. So the 'suspension' is just a hypothetical context update. I'm not claiming licences have truth values; I'm claiming the *logic* of licences composes like the logic of context updates. The type is the same for embedded and unembedded: Context → Context."

  **The Soft Spot:** They will ask for the specific definition of the "practical context." Is it a set of plans? A ranking of worlds? If it's too vague, you're back to hand-waving. If it's too specific (e.g., Gibbardian plans), you've just reinvented the higher-order attitude view you wanted to avoid.

  #### 2. The Taste Relativist (Damage: High)
  **The Objection:** "You're borrowing from a house that's on fire. The literature on 'tasty' embedding is a mess. We still fight over 'Faultless Disagreement' and whether 'tasty' takes a covert experiencer argument or an evaluation parameter. MacFarlane and Kölbel don't agree on the semantics. Why should I think importing the 'tasty' model solves the normative problem when the 'tasty' problem is just the normative problem in disguise?"

  **The 2-Minute Reply:** "I'm not claiming the taste literature is *solved*, only that it's *further along*. We have working models for 'tasty' (contextualism, relativism, expressivism) that handle embedding without positing higher-order attitudes. Even if they disagree on the *metaphysics* of taste, they agree on the *syntax* and *compositionality*. My claim is minimal: whatever machinery makes 'tasty' embed, apply it to 'wrong'. If the taste people are wrong, we're all wrong, but at least we're wrong with better formal tools than attitude hierarchies."

  **The Soft Spot:** If they press that the "tasty" embedding data is *itself* controversial (e.g., some speakers reject 'If this is tasty, I'll eat it' in certain contexts), your analogy weakens. You need to concede that you are idealizing the taste data.

  #### 3. The Quasi-Realist (Damage: Medium-High)
  **The Objection:** "This looks like Gibbard's 'logic of planning' with extra steps. Gibbard already said normative judgments are plans. You're saying they're 'licences from a practical setting.' What's the difference? If your 'practical setting' just *is* a set of plans/commitments, haven't you just reinvented the higher-order attitude view but obscured it with semantic jargon? Why is your view simpler?"

  **The 2-Minute Reply:** "Gibbard needs a *sui generis* logic of plan-consistency. I'm borrowing standard modal/taste semantics. The gain is interoperability. If I use your machinery, I need to learn your specific logic of planning. If I use the modal machinery, I can use standard dynamic semantic tools that linguists already use for 'might' and 'if'. It's not about the ontology of the mental state; it's about not building a custom logic engine when a standard one fits."

  **The Soft Spot:** If the "practical setting" turns out to require the same complexity as Gibbard's "hyperplans" to handle disagreement, the simplicity gain vanishes.

  #### 4. The Grad Student (Negation Problem) (Damage: Medium)
  **The Objection:** "Schroeder's negation problem: 'Lying is wrong' expresses attitude A. 'Lying is not wrong' expresses attitude B. But 'If lying is wrong...' expresses neither. You say it 'suspends' the licence. But what about 'It's not the case that lying is wrong'? Is that a suspended suspension? How do you distinguish the negation of the licence from the suspension of the licence without distinct mental states?"

  **The 2-Minute Reply:** "In dynamic semantics, negation is 'test and fail'. 'Not P' checks if the context can be updated with P; if it can, the update fails. So 'Lying is not wrong' tests if the practical setting permits the 'wrong' licence. It doesn't require a new *type* of attitude, just a different operation on the context. We don't need distinct mental states for negation any more than we do for 'It's not raining'."

  **The Soft Spot:** Expressivists have struggled for 15 years to make this work without collapsing into realism. If they ask "What is the *conflict* between A and B if not logical inconsistency?", you need to be careful not to say "logical inconsistency" unless you've defined the logic of licences.

  #### 5. The Experimentalist (Damage: Low)
  **The Objection:** "You claim speakers process 'wrong' like 'tasty'. Do we have psycholinguistic evidence for that? Reaction times? Embedding acceptability ratings? Or is this just an armchair intuition?"

  **The 2-Minute Reply:** "This is a conceptual argument about theoretical parsimony, not a psycholinguistic hypothesis. However, the prediction is clear: normative embedding should pattern with modal embedding, not descriptive embedding. I'd welcome collaboration on that, but the philosophical payoff is solving the FG problem without *sui generis* logic, regardless of the millisecond data."

  **The Soft Spot:** If they cite recent work showing normative language patterns *more* like descriptive predicates in embedding, your analogy takes a hit.

  #### 6. The Non-Naturalist Realist (Damage: Low)
  **The Objection:** "You've just confirmed my suspicion. You're admitting normative claims aren't truth-apt descriptions of the world. You're reducing morality to taste and modals. Why should I care about a semantics that makes morality subjective?"

  **The 2-Minute Reply:** "I'm solving a semantic problem (embedding), not an ontological one. Whether the 'practical setting' tracks objective reasons or subjective tastes is a metaethical question my semantics is neutral on. I'm just telling you how the words compose. You can be a non-naturalist and agree that 'wrong' functions semantically like 'might'."

  **The Soft Spot:** They won't care. They'll think you've conceded the game. Don't spend capital here.

  ---

  ### Part 3: Strategic Advice

  **What to Concede Up Front:**
  1.  **The Taste Literature isn't Perfect:** Explicitly state in the talk: "I am not claiming the semantics of 'tasty' is settled. I am claiming it is *more tractable* than the expressivist logic of planning." This disarms the Relativist (Audience iv).
  2.  **Formalism is Preliminary:** Admit the "suspended licence" is a placeholder for a dynamic update rule. Don't pretend you have the full lambda calculus worked out if you don't. This disarms the Semanticist (Audience iii) slightly—they'll critique the idea, not accuse you of hiding the math.

  **The One Reply That Has to Land:**
  You must nail the **Compositionality/Type** reply (to the Semanticist). If you cannot explain how the "licence" function composes in a conditional without magic, the talk fails.
  *   *Key phrase to memorize:* "The semantic value is uniform: it's always a Context Change Potential. Embedding is just hypothetical context update. No type shift required."

  **The Question You're Hoping Nobody Asks:**
  *"What is the nature of the 'Practical Setting' and how do we disagree about it?"*
  *   **Why it's deadly:** If the practical setting is *my* plan, then when you say "Lying is wrong" and I say "No it's not," we aren't disagreeing; we're just stating facts about our different plans (Relativism/Contextualism trap). If you say we are disagreeing about the *same* plan, you sound like a realist. If you say we are trying to *align* plans, you sound like a standard expressivist.
  *   **Prep:** Have a deflection ready. "That's a metaethical question about the *source* of the norms. My semantic claim is that *whatever* fixes that parameter, the embedding works the same way." (This is weak, but it buys time).

  **Final Reality Check:**
  Your position is thin on the **Disagreement** front. Borrowing the "tasty" semantics usually means inheriting the "faultless disagreement" problem. If you treat "wrong" like "tasty," you risk making moral disagreement look like "I like vanilla / I like chocolate." The Quasi-Realist and Non-Naturalist will both pounce on this. Be prepared to say: "Semantics doesn't fix disagreement; it just makes it possible to express."
