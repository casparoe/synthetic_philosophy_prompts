prompt: |-
  Hey — I've got a colloquium slot in three weeks and I need you to help me not get taken apart in the Q&A. You're a philosopher of language who also does metaethics, someone who knows the embedding literature for both normative vocabulary and the taste/epistemic-modal stuff cold. Before you write anything, brainstorm: what is this talk actually claiming, what does it structurally commit me to, and which of those commitments is load-bearing. Then give me the prep sheet.

  The talk: I argue that the Frege-Geach problem is not a special problem for expressivism about "wrong" — it's the exact same shape of problem you get with epistemic modals ("might") and predicates of personal taste ("tasty"), and everyone agrees those embed fine. So expressivists should stop hand-building bespoke machinery (attitudes towards attitudes, hierarchies, whatever) and just help themselves to whatever the taste/modal people use to handle embedding. My version of the borrowing: "wrong" gets one stable semantic value, a function from a practical setting (a plan, a set of commitments) to a set of licences on action, and embedding in a conditional antecedent just means the licence is suspended rather than issued. Assertion issues it. So "if lying is wrong, then getting your little brother to lie is wrong" composes without any attitude-hierarchy trickery.

  Audience: it's our dept colloquium, so it's a mix. (i) A committed quasi-realist who thinks the higher-order-attitude move already solves this and will want to know why my view isn't just that with extra steps. (ii) A non-naturalist realist who thinks expressivism was a mistake and will enjoy the fact that my move makes normative vocabulary look like taste vocabulary. (iii) A semanticist who cares about compositionality and thinks "suspended licence" is a hand-wave unless I say what the semantic value of the antecedent clause is. (iv) A relativist about taste who knows the taste literature is itself a swamp of unresolved embedding problems and will point out I'm borrowing from a house that's on fire. (v) An experimental person who'll ask what the embedding "data" even are and whether I've got any. (vi) A grad student who read one paper on the negation problem and will ask about it in a way that's half-right.

  What I want: the objections I'll actually get from *these* people, not the generic ones off a Frege-Geach 101 handout — ordered by how much damage they do, phrased the way each person would phrase it, each with a two-minute reply, and a note on where the reply is soft. Tell me what to concede up front (I'd rather give ground early then get dragged), what the one reply that has to land is, and the question I'm hoping nobody asks. Dont give me a reading list, I know the literature. Think carefully and be honest about where my position is thin — I need the prep sheet, not reassurance.
