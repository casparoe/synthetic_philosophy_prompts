answer: |-
  Based on the set of verdicts you provided, your moral intuitions are not tracking "sex" or even "promises" in a vacuum. They are tracking **agency** and **shared reality**.

  You judge the coercive situations (5, 7, 8) as bad because one partner lacks the power to leave or dissent. You judge the secret cheating (3) as bad even without discovery because it unilaterally alters the terms of the relationship without the other's knowledge. You judge the tacit arrangement (6) as "fine" because, unlike (3), it is bilateral—both parties are accommodating the reality, even if silently.

  To bring this into reflective equilibrium, here is a candidate principle that captures the core of your judgments, the necessary sacrifice to maintain it, and its application to your new case.

  ### The Candidate Principle: **Non-Exploitative Shared Reality**

  **Statement:** An intimate arrangement is morally permissible if and only if:
  1.  **Mutual Agency:** Both partners possess a viable capacity to exit or renegotiate the arrangement without catastrophic loss (economic, social, or psychological).
  2.  **Substantive Transparency:** Both partners operate from a substantially accurate understanding of the relationship's actual terms, such that neither is consenting to a fiction.

  **How it fits your cases:**
  *   **Cases 1 & 4 (Consensual Exclusive/Open):** Pass both tests. Agency is intact; reality is shared.
  *   **Cases 5, 7, 8 (Coercion/Dependency):** Fail **Mutual Agency**. In Case 5, fear of abandonment negates agency. In 7 & 8, economic destitution negates agency. The "blessing" is invalid because it is coerced. This matches your intuition that the "off" feeling isn't about the sex.
  *   **Case 2 (Cheating + Confession):** Fails **Substantive Transparency** temporarily, but restores it. It is "bad" because the violation occurred, but confession attempts to repair the shared reality.
  *   **Case 3 (Cheating + Secret):** Fails **Substantive Transparency**. Even if never discovered, the cheater is sustaining a fiction. The partner is consenting to a monogamous relationship that does not exist. This explains why it feels "bad" even without consequences: the *relationship itself* is corrupted, not just the trust.
  *   **Case 6 (Tacit Monogamy):** This is the pivot point. It passes **Mutual Agency** (presumably), and it arguably passes **Substantive Transparency** because both "basically know."

  ### The Verdict That Must Be Dropped

  To maintain the precision of **Substantive Transparency**, you must drop or significantly downgrade your verdict on **Case 6 (The Tacit Arrangement).**

  You currently judge it as "fine? Or at least way less bad." To be consistent with your condemnation of Case 3, you must acknowledge that Case 6 is **morally compromised**, even if it is less harmful than Case 3.

  **Why?**
  In Case 3, the deception is unilateral (one knows, one doesn't). In Case 6, the deception is *collusive* (both pretend not to know). While Case 6 preserves peace, it violates the "Substantive Transparency" clause because it relies on **plausible deniability**. If the arrangement is never discussed, it cannot be renegotiated. If one partner eventually decides they *do* want strict monogamy, they have no standing to enforce it because the terms were never explicit.

  By keeping Case 6 as "fine," you allow relationships to function on ambiguity. But if Case 3 is bad because it denies the partner the truth of their situation, Case 6 also denies the partners the truth of their situation—it just does so comfortably. To achieve equilibrium, you should categorize Case 6 as **prudentially understandable but morally sub-optimal**. It is a "stable lie," whereas Case 1 and 4 are "stable truths."

  ### Prediction for the New Case

  **The Case:** A couple who both genuinely want an open arrangement but hide it from their family and close friends, who would be devastated if they knew.

  **Application of the Principle:**
  1.  **Mutual Agency:** Intact between the partners. They both "genuinely want" it.
  2.  **Substantive Transparency:** Intact between the partners. They know the terms.
  3.  **External Deception:** The deception is directed outward (family), not inward (partners).

  **Verdict:** **Permissible.**
  The principle governs the *internal* moral contract of the relationship. As long as the secrecy does not create internal coercion (e.g., one partner uses the family's potential reaction to blackmail the other into staying closeted), the arrangement is morally sound under this principle. The distress of the family is a social cost, not a moral violation of the partners' agency.

  ### Alignment with Russell

  This principle lands **firmly on Russell's side**, with one nuance.

  1.  **On Coercion (Cases 7 & 8):** Russell argued vehemently in *Marriage and Morals* that economic dependence makes marriage a form of prostitution and invalidates consent. Your intuition here is pure Russell. He would agree that the "badness" is the power dynamic, not the sex.
  2.  **On Honesty (Cases 3 & 6):** Russell valued truthfulness as a social good but was pragmatic. He believed that conventional morality forced people into hypocrisy (Case 6). He would likely agree with the principle that Case 6 is inferior to an honest open arrangement (Case 4), but he might be more forgiving of Case 6 than the strict principle above, viewing it as a necessary survival tactic in a judgmental society. However, his ideal was always rational, explicit companionship.
  3.  **On the New Case:** Russell was a staunch defender of privacy against public opinion. He would argue that the family's devastation is the family's problem, not a reason to restrict the couple's liberty.

  **Summary:** Your gut is tracking a **Kantian-tinged Liberalism**: treat partners as ends (agents) never merely as means (secrets/dependencies), and ensure the "contract" is real. To make this consistent, you must admit that "don't ask, don't tell" (Case 6) is a moral compromise, not a clean win.
