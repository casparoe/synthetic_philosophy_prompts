  I saw the change occur halfway across the screen.
  A red dot jumps, turns green in mid-air,
  Though the green was nowhere yet, waiting in the dark.
  Did the curtain hold until the ending was known,
  A verdict written before the trial began?
  Or did I live the true scene only to have it edited,
  The memory inked over while I looked away?
  Two histories fighting for one single sensation.
  But ask the witness inside the quiet dark:
  There is no lag, no splice, no heavy curtain,
  Only the smooth glide of a colour in the mind.
  There is no witness separate from the testimony,
  No clock inside the head that ticks without a face.
  If the timeline bends to fit the shape of the story,
  Then the moment itself is a thing we invent.
  We are left with the glow, the motion, the claim,
  So I stand again before the blank white wall,
  I saw the change occur halfway across the screen.
