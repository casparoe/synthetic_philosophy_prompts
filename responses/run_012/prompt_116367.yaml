answer: |-
  This is a great set of questions. You have stumbled onto exactly the kind of friction that exists between "popular philosophy" (which needs clean narratives) and "academic philosophy" (which lives in the nuances). The paragraph you quoted is a very standard pop-science summary, but it conflates several distinct debates into one smooth story.

  Here is a claim-by-claim breakdown, followed by the verdict on your brother and your friend.

  ### Part 1: Autopsy of the Paragraph

  Let's break the text down into its constituent assertions.

  **Claim 1:** *"One of the few things moral philosophy has actually settled is that you can't get an ought from an is."*
  *   **Verdict:** **Oversimplification.**
  *   **Analysis:** This is often called "Hume's Law." While it is a dominant view, saying it is "settled" is false. There is a massive industry of moral philosophers (Moral Naturalists) who dedicate their careers to arguing exactly the opposite: that moral facts *are* a subset of natural facts. If you ask a room of professional meta-ethicists, you will not get a consensus on this.

  **Claim 2:** *"Hume spotted it first... the author slides from claims about what is the case to claims about what ought to be, and the slide is never justified."*
  *   **Verdict:** **Mostly Accurate (with caveats).**
  *   **Analysis:** David Hume did notice this rhetorical shift in *A Treatise of Human Nature*. However, scholars debate whether Hume meant this as a strict logical prohibition (you *cannot* derive ought from is) or just a criticism of bad writing (authors *fail* to explain* how they get there). The book assumes the stronger, logical version.

  **Claim 3:** *"Moore sharpened it into the naturalistic fallacy -- the mistake of thinking you can read values off of nature, of treating what's natural as what's good."*
  *   **Verdict:** **Wrong.**
  *   **Analysis:** This is the biggest error in the paragraph. G.E. Moore's "Naturalistic Fallacy" (from *Principia Ethica*) is **not** about assuming "natural things are good." That is the *Appeal to Nature* fallacy.
      *   **Moore's actual point:** You cannot define the concept "Good" using any natural properties (like "pleasure," "evolutionary fitness," or "desire"). He argued "Good" is a simple, indefinable property.
      *   **The Book's error:** It conflates Moore with the Appeal to Nature. This confusion is extremely common, but it is technically incorrect.

  **Claim 4:** *"Together they show that facts and values are two seperate realms and no argument can bridge them."*
  *   **Verdict:** **Oversimplification.**
  *   **Analysis:** This describes the "Fact/Value Distinction," which was popularized by logical positivists in the mid-20th century. Contemporary philosophy (e.g., Hilary Putnam, John McDowell) has largely pushed back against this, arguing that facts and values are "entangled." For example, calling something "cruel" is both a description of behavior (fact) and a moral judgment (value).

  **Claim 5:** *"You can know everything about how the world is... and still not have the first clue what you ought to do."*
  *   **Verdict:** **Plausible within specific frameworks.**
  *   **Analysis:** This is true if you are a *Non-Cognitivist* (morality is just emotion) or an *Error Theorist* (all moral claims are false). It is false if you are a *Moral Realist* (moral truths exist and are knowable). The book presents this as a neutral observation, but it is actually taking a side in a metaphysical debate.

  **Claim 6:** *"That's why every attempt to ground ethics in biology collapses..."*
  *   **Verdict:** **Too Strong.**
  *   **Analysis:** Evolutionary ethics is difficult, but it doesn't necessarily "collapse." Biology might not tell you what is *good*, but it can tell you about the *constraints* of morality (e.g., we are social animals, so ethics must account for empathy). The book treats the Is/Ought gap as a wall; many philosophers treat it as a hurdle.

  **Claim 7:** *"...it's also why Hume thought reason is just the servant of the passions."*
  *   **Verdict:** **Accurate (regarding Hume), but loosely connected.**
  *   **Analysis:** Hume did say reason is the "slave of the passions." However, linking it as a direct *consequence* of the Is/Ought problem is a bit of a narrative shortcut. They are related parts of his sentimentalist system, but one doesn't strictly prove the other.

  **Claim 8:** *"The upshot: moral commitments aren't discoveries, they're commitments you make."*
  *   **Verdict:** **Non-Sequitur (Does not necessarily follow).**
  *   **Analysis:** This is the conclusion we need to examine closely (see Part 3).

  ---

  ### Part 2: Settling the Objections

  #### Objection 1: Your Brother's Promise
  **The Claim:** "He promised to pay me back" (Is) entails "He ought to pay me back" (Ought).
  **The Verdict:** **Your brother is cheating (implicitly).**

  This is a famous counter-argument raised by the philosopher John Searle. He argued that "institutional facts" (like promising, marrying, or signing a contract) create obligations.

  However, philosophers generally agree that your brother is hiding a premise. The argument actually looks like this:
  1.  **Fact:** He promised to pay you back. (Is)
  2.  **Norm:** One ought to keep one's promises. (Ought)
  3.  **Conclusion:** He ought to pay you back. (Ought)

  Premise #2 is a normative claim, not a factual one. If your brother says, "Sure he promised, but why should he keep promises?", you cannot answer him using only facts about the world (e.g., "because he said words," "because you need the money"). You have to appeal to a value (trust, duty, fairness).

  So, the Is/Ought gap holds. You cannot get the "Ought" from the "He promised" *alone*. You need a prior "Ought" (promises should be kept) to bridge the gap. Your brother is smuggling in a moral premise and pretending it's a fact.

  #### Objection 2: Your Friend's Raw Milk
  **The Claim:** "Naturalistic Fallacy" means arguing something is good because it is natural (e.g., raw milk).
  **The Verdict:** **Your friend is colloquially right; the book is technically wrong.**

  As noted in Claim 3 above, the book misdefines Moore's Naturalistic Fallacy.
  *   **What your friend means:** The *Appeal to Nature* fallacy (Nature = Good). This is how the term is used in everyday conversation, medicine, and marketing.
  *   **What Moore meant:** Defining "Good" as any natural property (e.g., "Good just means 'evolutionarily successful'").

  **Who is wrong?** The book is historically and technically wrong about G.E. Moore. However, your friend is using the term as it has evolved in common parlance. In a philosophy exam, your friend would lose points. In a conversation about raw milk, your friend is understood correctly. The book is trying to sound academic but uses the colloquial definition while attributing it to Moore.

  ---

  ### Part 3: Does the Conclusion Follow?

  **The Book's Conclusion:** *"Moral commitments aren't discoveries, they're commitments you make."*

  **Does this follow from the Is/Ought gap?**
  **Verdict:** **No. It is a smuggled conclusion.**

  Here is why. The Is/Ought gap (if we accept it) tells us that you cannot derive moral values from *non-moral* facts (like biology, physics, or psychology).

  However, that leaves two possibilities:
  1.  **Non-Cognitivism/Existentialism (The Book's View):** Because values aren't in the facts, they must be projections of our emotions or choices. Morality is something we *create*.
  2.  **Moral Realism (The Alternative):** Moral values *are* facts, but they are a *sui generis* (unique) kind of fact. They aren't biological facts, but they are still "out there" to be discovered, perhaps through intuition or rational reflection.

  The book assumes that if morality isn't found in *biology* (the "Is"), it must be found in *us* (the "Commitment"). It ignores the possibility that moral truths are real truths, just not *natural* truths.

  **Example:** Mathematical truths (2+2=4) are not "natural" facts you can find in a test tube. You can't find "4" in nature. But most people don't say math is just a "commitment you make." They say it's a discovery of abstract truth. A Moral Realist argues ethics is similar: you can't find "justice" in a cell, but that doesn't mean justice isn't real.

  By jumping from "You can't get ought from is" to "Morality is a commitment," the book is silently arguing for **Moral Anti-Realism**. That is a specific philosophical stance, not a proven fact that follows from Hume.

  ### Summary for You

  1.  **The Book:** It is a standard pop-science summary. It gets the "vibe" of Hume right but messes up the history of Moore and presents a contested philosophical debate as settled fact.
  2.  **Your Brother:** He is relying on a hidden moral rule ("keep promises"). Without that rule, the fact of the promise implies nothing. He hasn't bridged the gap; he's built a bridge out of invisible wood.
  3.  **Your Friend:** She is using the modern, colloquial definition of "Naturalistic Fallacy." The book is using the historical name but the colloquial definition, which is technically an error regarding G.E. Moore.
  4.  **The Conclusion:** The idea that morality is "commitment not discovery" is a **choice**, not a logical necessity. You can accept the Is/Ought gap and still believe moral truths are real discoveries (just not *scientific* ones). The book smuggles in a specific worldview (Existentialism/Expressivism) and presents it as the only logical option.

  You were right to be nagged. The smoothness of that paragraph is achieved by sanding down the jagged edges where the actual philosophy lives.
