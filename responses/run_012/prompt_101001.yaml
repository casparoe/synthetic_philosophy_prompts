answer: |-
  **Project Title:** The Grip of Reasons: A Counterfactual Account of Free-Floating Rationales

  **Abstract**
  This project addresses a stalemate in the philosophy of biology and cognitive science regarding "free-floating rationales" (FFRs). Standard accounts oscillate between an inflationary view (rationales are mind-independent facts) and a deflationary view (rationales are merely useful redescriptions of selection history). Both fail to explain why some functional ascriptions carry normative force while others do not. This project proposes a shift from ontology to metric: defining the reality of a rationale not by its existence but by its "grip"—the degree to which a system's behavior is counterfactually sensitive to the features of a problem within a design space. Over six months, I will test this criterion against three cases: byproducts, co-opted traits, and neural network heuristics. The goal is to determine if a distinction between rationales *tracked* by a system and rationales *available* to a system can resolve the debate without smuggling in a hidden reasoner.

  **The Philosophical Problem**
  The notion of a free-floating rationale suggests that a trait or behavior can be explained by the problem it solves, even if no agent represents that problem or solution. A plant orienting toward light solves a problem without representing it. The standard debate asks whether this rationale is "real."

  The inflationary view claims rationales are part of the furniture of nature. Its weakness is ontological: it cannot specify what a rationale is made of if not mental representation, nor how we could be wrong about one except by contradiction. The deflationary view claims talk of rationales is a courtesy extended to causal processes that look purposeful. Its weakness is explanatory: it cannot account for the normative force of functional ascriptions. If FFRs are just redescription, why do some redescriptions strike us as correct and others as forced? Why does "the heart pumps blood" feel like a fact, while "the heart makes a thumping sound to scare predators" feels like a fiction, even if both are causally true?

  Both positions assume the question is binary: is the rationale there or not? This project argues the question is scalar. We should not ask if a rationale floats free of minds, but how much *grip* it has on the system.

  **The Proposal: Grip and Tracking**
  I propose defining the validity of a functional ascription via *grip*. A rationale has grip to the extent that the system's behavior is counterfactually sensitive to the features of the problem in the way the rationale requires. To ascribe a rationale is to map the system into a design space. If we intervene on the problem features, does the behavior track the change? If we change the problem so the rationale no longer applies, does the behavior degrade as predicted?

  Grip is a fact about the system and its history, not our preferences. However, grip alone may not distinguish a genuine FFR from a lucky byproduct. This leads to the project's central hypothesis: the distinction lies between *tracking* and *availability*.
  *   **Tracking:** The system's physical state covaries with the rationale's requirements across the design space.
  *   **Availability:** The system can access the rationale for further reasoning or articulation.

  My suspicion is that free-floating rationales are precisely those that are *tracked but unavailable*. The deflationist and inflationist are both answering a question about availability (is there a reasoner?) while pretending to answer one about tracking (is there a functional dependency?). If this distinction holds, we can preserve the reality of the rationale (it is tracked) without requiring a mind (it is unavailable).

  **Methodology and Test Cases**
  The method is conceptual analysis tested against specific biological and computational cases. I will not be conducting empirical experiments, but rather analyzing existing models to see if the "grip" criterion yields determinate results where standard views falter.

  *Case 1: The Control (Byproducts)*
  A spandrel or byproduct may solve a problem but was not maintained for doing so. A deflationist says the rationale is a fiction; an inflationist might say it is real but accidental.
  *Test:* Does the byproduct have grip? If we vary the problem, does the trait vary appropriately?
  *Prediction:* A byproduct should show low grip. It solves the problem in the actual world, but in nearby counterfactual worlds where the problem shifts, the trait does not track the shift because it was not selected for that tracking. If grip separates byproducts from adaptations, it validates the metric. If grip is high for byproducts, the metric fails.

  *Case 2: The Co-opted Trait (Exaptation)*
  A trait selected for Problem A is now maintained for Problem B.
  *Test:* Where does the rationale reside? Does the rationale for A have grip? Does the rationale for B have grip?
  *Prediction:* This tests the historical vs. current dimension of grip. A rationale based on history (A) might have low current grip if the environment changed. A rationale based on current maintenance (B) should have high grip. This case tests whether "grip" requires a specific causal history or only current counterfactual stability.

  *Case 3: The Neural Network (The Core Dispute)*
  A network trained by gradient descent internalizes a heuristic that improves performance but cannot articulate it.
  *Test:* Is this an FFR?
  *Prediction:* This is the critical case. The network *tracks* the rationale (high grip across input variations) but the rationale is *unavailable* (no internal representation accessible to the system).
  *Significance:* If this counts as an FFR, it validates the tracking/availability distinction. If it does not, we must ask why. The deflationist will say it's just math; the inflationist will say it's a hidden representation. I will analyze whether "grip" can be measured here without assuming a reasoner defines the design space.

  **Work Plan and Feasibility**
  The grant covers six months at roughly one day per week (24 days total). This is a tight constraint for philosophical development. The work plan is structured to prioritize the core metric before attempting the hardest case.

  *Month 1: Formalizing Grip.*
  Days 1-4: Refine the definition of counterfactual sensitivity. Define "design space" without presupposing a designer.
  Deliverable: A working definition of grip that avoids circularity.

  *Month 2: The Control Case.*
  Days 5-8: Apply grip to byproducts/spandrels.
  Risk: If grip cannot distinguish byproducts from adaptations, the project stops here.
  Deliverable: Analysis of whether grip tracks selection history or current utility.

  *Month 3: The Co-opted Trait.*
  Days 9-12: Apply grip to exaptations.
  Deliverable: Determination of whether grip is historical or ahistorical.

  *Month 4-5: The Neural Network.*
  Days 13-20: Apply grip and tracking/availability to machine learning cases.
  *Scope Assessment:* This is the highest risk. Fully analyzing NN interpretability in 8 days is impossible. I will restrict this to conceptual analysis of existing literature on "grokking" and latent space heuristics. If Months 1-3 reveal fundamental flaws in the grip metric, I will cut Case 3 and focus on refining the biological account.

  *Month 6: Synthesis and Failure Analysis.*
  Days 21-24: Finalize the threshold question. Is there a specific grip threshold for an FFR, or is it a continuum? Write the final paper.

  **Outcomes and Failure Conditions**
  A successful outcome is not proving the inflationary view right. It is providing a framework that explains why the debate stalled. Specifically, a publishable result would demonstrate that "grip" accounts for normative force without requiring mind-independent platonic rationales.

  *Success:* A defensible threshold where high grip + tracking - availability = Free-Floating Rationale. This dissolves the friend's objection by conceding that rationales are not "things" but are also not "mere redescription." They are stable counterfactual dependencies.

  *Failure Condition 1 (Collapse to Deflationism):* If "grip" turns out to be identical to "selection history," then the project has merely renamed the deflationist view. This is a substantive result but theoretically thinner than hoped. I will treat this as a valid outcome: proving the deflationist is right, but for a new reason (counterfactual stability rather than mere utility).

  *Failure Condition 2 (Circularity):* If defining the "design space" for grip requires a reasoner to specify the relevant variations, then I have smuggled the mind back in. This would validate the friend's suspicion that FFRs are observer-relative. I will explicitly test for this in Month 1. If the design space cannot be specified objectively, the project fails.

  *Failure Condition 3 (Scope):* If Case 3 proves too complex for the timeline, I will produce a paper covering only Cases 1 and 2. This is a partial success, establishing the biological account while leaving the computational extension for future work. Given the one-day-per-week constraint, I recommend keeping Case 3 as a "stretch" goal. The core philosophical work stands on the biological cases; the NN case is an application. If I must cut, I will cut Case 3 to ensure the argument regarding grip and byproducts is rigorous.

  **Conclusion**
  The friend's objection is that FFRs are a redescription of causal history. My counter is that some redescriptions capture counterfactual dependencies that others miss. This project does not assert that rationales are magical entities. It asserts that "grip" is a measurable property of systems that explains why we treat some functional claims as facts and others as fictions. By distinguishing tracking from availability, we can locate the free-floating rationale not in the mind of the observer, nor in a platonic realm, but in the structural sensitivity of the system itself. Six months is sufficient to test whether this distinction holds water or washes out.
