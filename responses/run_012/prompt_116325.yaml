answer: |-
  This is a wonderful problem because it locates the philosophical friction exactly where it usually hides: in the gap between the *normative sales pitch* and the *formal properties* of the mechanism. You are right to sense that the marketing of Ranked Choice Voting (RCV/IRV) relies on a specific, often unarticulated, conception of democratic legitimacy that prioritizes certain virtues over others, even when those virtues are mathematically in tension.

  As requested, I will start by brainstorming three candidate readings of what is going on here, then commit to the most robust reconstruction, analyze its implications, and finally perform the "swap" to see what the alternative theory of legitimacy looks like.

  ### Phase 1: Brainstorming Candidate Readings

  **Reading 1: The Epistemic Mistake (The "Ignorance" Hypothesis)**
  On this reading, there is no deep philosophical tension because there is no deep philosophical commitment. The proponents of RCV simply believe, incorrectly, that the mechanism guarantees a Condorcet winner (the candidate who beats all others one-on-one). They use the language of "majority support" because they think the math delivers it.
  *   *Implication:* The practice presupposes nothing profound about voting; it is just an empirical error. Legitimacy is still viewed as "tracking the true majority will," but the tool is mismatched to the goal.
  *   *Weakness:* This is too uncharitable. Many sophisticated advocates know the math (Arrow, Gibbard-Satterthwaite) but argue that RCV is "good enough" or "better than Plurality." The persistence of the rhetoric suggests a normative choice, not just a math error.

  **Reading 2: The Consensus Filter (The "Negative Voting" Hypothesis)**
  Here, the goal isn't to find the *best* candidate (positive epistemic claim) but to eliminate the *most hated* candidate (negative veto). RCV is designed to simulate a runoff without the cost. By eliminating last-place finishers, it filters out polarizing figures.
  *   *Implication:* A vote is a veto power. Legitimacy comes from the winner being the "least objectionable" to the majority, not necessarily the "most preferred."
  *   *Weakness:* This explains the elimination rounds, but it doesn't fully account for the "Sincerity" pitch ("vote for your favorite without fear"). The marketing emphasizes *expression*, not just *exclusion*.

  **Reading 3: The Liberal-Expressive Shield (The "Agency" Hypothesis)**
  This reading suggests the primary goal is to protect the individual voter's psychological and strategic agency. In Plurality, voting for your true favorite is often instrumentally irrational (the "wasted vote"). RCV changes the *normative status* of the ballot: it makes sincerity a dominant (or near-dominant) strategy.
  *   *Implication:* Legitimacy is derived from the integrity of the *input* (the sincere ballot) rather than the coherence of the *output* (the collective ordering).
  *   *Strength:* This aligns best with the marketing ("no more spoilers," "vote your conscience"). It accepts the trade-off: we sacrifice the Condorcet criterion (global coherence) to preserve Monotonicity/Sincerity (local safety).

  ### Phase 2: The Reconstruction

  I commit to **Reading 3**, but with a specific philosophical refinement. The practice presupposes a theory of **Legitimacy as Non-Alienation**.

  **1. What is a vote for?**
  In this implicit theory, a vote is not primarily an instrument for truth-tracking (finding the "best" leader) nor a raw aggregation of power. It is a **protected speech act**.
  Under Plurality, the system coerces the voter into insincerity. If you prefer X but X can't win, the system punishes you for voting X. This creates *alienation*: the voter's internal preference order is severed from their external political action.
  RCV is justified because it repairs this severance. It allows the external action (the ballot) to match the internal state (the preference) without penalty. The "guarantee" you mention (that ranking a compromise lower won't hurt your favorite) is the core normative claim: **The system should not punish sincerity.**

  **2. What makes an outcome legitimate?**
  Legitimacy is **Procedural** rather than **Epistemic**.
  *   *Epistemic Legitimacy:* The winner is legitimate because they are the "correct" choice (e.g., the Condorcet winner who reflects the true will of the majority).
  *   *Procedural Legitimacy (RCV's implicit view):* The winner is legitimate because the process respected the integrity of every voter's preference structure.
  The marketing talks about "Majority Support" (Epistemic language), but the mechanism delivers "Sincere Aggregation" (Procedural value). The practice assumes that if the *process* allows everyone to speak truly, the *outcome* is acceptable, even if it violates global consistency (like the Condorcet criterion).

  **3. Rival Theories Ruled Out vs. Compatible**
  *   **Ruled Out:** **Strong Majoritarianism.** If you believe legitimacy *requires* the Condorcet winner (the candidate who beats everyone else head-to-head), RCV is illegitimate when it fails this (which it can). The practice quietly rules out the idea that there is a single "True Will" that the math *must* uncover, even at the cost of voter safety.
  *   **Ruled Out:** **Utilitarian Aggregation.** RCV ignores intensity. It doesn't matter if you *love* Candidate A and hate Candidate B, or mildly prefer A to B. The practice rules out the idea that votes should measure welfare intensity (which would require Score/Range voting).
  *   **Compatible:** **Liberal Neutrality.** The state should not force voters to strategize. It creates a neutral space where preference expression is costless.
  *   **Underdetermined:** **Deliberative Democracy.** RCV doesn't inherently cause deliberation. It works just as well with polarized, static preferences. The practice is silent on whether voting should change minds or just count them.

  ### Phase 3: The Swap (Taking the Opposite Presupposition)

  Now, let's swap the presupposition. Instead of prioritizing **Sincerity/Non-Alienation** (the safety of the individual ballot), we prioritize **Collective Rationality/Epistemic Accuracy** (the coherence of the group choice).

  **1. The New Rule:**
  We adopt a **Condorcet Method** (e.g., Schulze or Ranked Pairs). These systems guarantee that if there is a candidate who beats everyone else one-on-one, they win.
  *   *The Cost:* These systems often violate Monotonicity more severely than RCV, or they produce cycles that require complex tie-breakers. More importantly, they can produce outcomes where a voter feels their sincere ranking "backfired" in complex ways that are harder to explain than "my vote transferred."

  **2. The New Justification:**
  The pitch changes from "Vote your conscience" to "Find the true will."
  *   *Old Pitch:* "This system ensures your vote isn't wasted." (Focus: Voter Protection)
  *   *New Pitch:* "This system ensures the winner actually represents the majority's comparative judgment." (Focus: Outcome Accuracy)

  **3. What Changes in Practice?**
  *   **Voter Education:** You stop teaching people how to "rank honestly" and start teaching them that the system is a complex calculator designed to resolve paradoxes. The "human" element of the ballot is less important than the "mathematical" element of the result.
  *   **Legitimacy Crises:** Under RCV, if a candidate loses, we say, "You didn't have broad enough support." Under a Condorcet system, if a Condorcet winner loses (due to a cycle resolution), we admit, "The group's will was logically incoherent." This is a much harder pill for a democracy to swallow. It admits that "The Will of the People" might not exist.
  *   **Strategic Behavior:** If voters know the system prioritizes the Condorcet winner, they might engage in "burial" strategies (ranking a strong opponent last to create a cycle) more aggressively than in RCV. The system assumes voters are truth-tellers; the swap assumes voters are part of a logic puzzle.

  ### Phase 4: Self-Criticism and Vulnerability

  Where is my reconstruction most likely to be wrong?

  **1. The "Monotonicity" Misconception.**
  I need to be honest: You wrote that RCV is "built so that ranking someone lower can never hurt your favorite." Technically, **IRV violates monotonicity.** Ranking a candidate *higher* can sometimes cause them to lose (by changing who gets eliminated in an earlier round).
  *   *Critique:* If my reconstruction relies on RCV actually protecting sincerity, it rests on a mathematical falsehood.
  *   *Defense:* However, IRV violates monotonicity *rarely* in practice compared to its violation of the Condorcet criterion. The *Folk Theory* (what the committee and public believe) is that it protects sincerity. My reconstruction is of the *political practice*, not the pure math. The legitimacy comes from the *belief* in safety, even if the math has edge cases. If I am wrong, it is because the edge cases become frequent enough to shatter the Folk Theory.

  **2. Partisan Engineering.**
  My reconstruction assumes good faith: that the city wants "fairness." It is highly possible the implicit theory is simply **Partisan Advantage.** RCV often helps centrist or establishment candidates by dampening polarized wings.
  *   *Critique:* If the real driver is partisan entrenchment, then the "Liberal-Expressive" theory is just window dressing.
  *   *Test:* If the committee rejects Condorcet methods not because they are complex, but because they might elect a more radical candidate who wins pairwise matchups but lacks "broad appeal," then my reconstruction of "Non-Alienation" is wrong. The theory is actually "Moderation Enforcement."

  **3. The "Majority" Claim.**
  I argue the practice sacrifices Epistemic legitimacy for Procedural legitimacy. But the marketing *claims* Epistemic legitimacy ("Real Majority Support").
  *   *Critique:* Perhaps the practice isn't a trade-off, but a **redefinition of "Majority."** They are redefining "Majority" from "50% + 1 first choice" or "Condorcet Winner" to "The last person standing after elimination."
  *   *Implication:* If this is true, there is no tension in their minds. They have successfully shifted the semantic ground. My reconstruction posits a conflict they don't feel. To change my verdict, you would need to show that proponents understand the Condorcet failure and simply *do not value it*.

  ### Conclusion for the Committee

  If you take this reconstruction seriously, your intervention on the committee shouldn't just be about math. It should be about **narrative consistency**.

  If the city values **Sincerity** (my reconstruction), stick with RCV but stop claiming it always finds the "Majority Will." Admit it finds the "Most Acceptable Survivor."
  If the city values **Majority Will** (the marketing), you must acknowledge RCV might fail this, and consider if a Condorcet method is worth the complexity.

  The current practice tries to have it both ways: the simplicity of Sincerity with the authority of Majority. The philosophical work is to force the committee to choose which god they serve: the integrity of the voter's hand, or the coherence of the collective mind. They cannot have both.

  **What would make me change my verdict?**
  If you showed me data that voters in RCV cities *do not feel* more empowered to vote for third parties (i.e., the "Sincerity" benefit is empirically null), then the "Liberal-Expressive" reconstruction collapses. It would suggest the practice is purely elite-driven institutional isomorphism (copying other cities) with no underlying theory of the vote at all. But until then, the "Legitimacy as Non-Alienation" model best explains why we tolerate the mathematical flaws.
