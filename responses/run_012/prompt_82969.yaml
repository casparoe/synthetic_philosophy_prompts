answer: |-
  The premise you must reject is **(4)**.

  Your friend's argument is a version of the famous **Argument from Vagueness**, championed by David Lewis and Ted Sider. It is designed to force a choice between Universalism (everything composes something), Nihilism (nothing composes anything), or the acceptance of "ontic vagueness" (the world itself is fuzzy). Since most metaphysicians reject ontic vagueness as incoherent, the argument is typically used to prove Universalism.

  To stop the argument from proving Universalism while keeping your common-sense realism (Premise 1) and your belief in ordinary objects (Premise 7), you have to deny that vagueness in our *concepts* or *epistemic access* entails vagueness in *reality*. You must embrace **Epistemicism**.

  ### Why Premise (4) Looked Compelling
  Premise (4) relies on a powerful intuition: **The "No Magic" Constraint.** It feels absurd to think that removing a single electron from a chair could be the difference between the existence and non-existence of the chair. If two cases are qualitatively identical to the naked eye (or even the microscope), how could reality treat them differently? The premise assumes that if a boundary exists, it must be *detectable* or *grounded in a qualitative difference* we can recognize. Since the series is continuous, no such qualitative jump exists; therefore, no boundary exists. This conflates *metaphysical precision* with *epistemic accessibility*. It assumes that because we cannot point to the line, the line is not there.

  ### Why It Is Mistaken
  Premise (4) is false because it assumes that the world must be as vague as our descriptions of it. But there is no logical contradiction in the idea that **reality is precise while our knowledge is not.**

  Consider a heap of sand. We cannot say exactly which grain makes it a heap. The Epistemicist says: *There is a fact of the matter.* There is a specific number of grains $n$ such that $n$ grains compose a heap and $n-1$ do not. We cannot know $n$, and our concept "heap" does not track $n$ reliably, but the boundary exists in the world (or is fixed by the precise semantic rules governing our reference to the world).

  Applied to composition: There is a precise moment when a collection of cells becomes a living organism, or a precise arrangement of atoms that constitutes a chair. It is determined by the fundamental laws of physics or the natural joints of reality. The fact that we cannot identify this boundary does not mean it isn't there. By rejecting (4), you block the move to (5). If there *is* a sharp, non-arbitrary line (grounded in natural properties, even if unknowable), then a Restricted Composition principle *can* be true.

  ### The Cost of Rejecting (4)
  Rejecting (4) commits you to **Epistemicism about Composition**. This is not a cheap fix. Here is the price you pay:

  1.  **Radical Ignorance:** You must admit that for any borderline case (a body on a ventilator, a sandcastle in the wind), there is a determinate truth about whether an object exists there, but it is *impossible in principle* for us to know it. You are committed to the existence of facts that are forever beyond human cognitive reach.
  2.  **Brute Numerical Facts:** You must accept that tiny, microphysical differences can have massive ontological consequences. The removal of one specific electron could, in principle, cause a composite object to cease to exist. This feels "magical" because the causal power of that single electron seems disproportionate to the effect (the vanishing of a chair).
  3.  **Semantic Tension:** You have to explain *what* fixes these boundaries. If it's not our conventions (per Premise 1), it must be nature. But nature (quantum fields, etc.) doesn't seem to care about "chairs." You will need a robust theory of **Natural Properties** to ground these boundaries, arguing that some arrangements of matter are metaphysically privileged in a way that science may never fully capture.

  ### Is This a Reasonable Price?
  Yes. Compared to the alternatives, Epistemicism is the most stable position for a realist who wants to save common sense.

  *   **Compare to Universalism (The Conclusion):** Universalism saves logic but explodes ontology. It forces you to believe in an object composed of your shoe and the Eiffel Tower. This violates the principle of parsimony and makes a mockery of causal explanation (what causes does *that* object have?). Epistemicism is ontologically conservative; Universalism is ontologically extravagant.
  *   **Compare to Nihilism (Rejecting 7):** Nihilism saves logic and precision but denies the existence of chairs and people. This is a self-defeating skepticism for a metaphysician trying to explain the world we live in.
  *   **Compare to Conventionalism (Rejecting 1):** If you say composition is just up to us, you save common sense but lose realism. You make the existence of objects dependent on human interests. If you want metaphysics to be about *reality*, not *us*, this is too high a cost.

  Epistemicism moves the absurdity from the *world* (where Universalism puts it) to our *knowledge* of the world. It is better to admit that we are ignorant of the precise boundaries of objects than to claim that reality contains arbitrary fusions of scattered matter. A reasonable metaphysician should prefer a world with hidden precision over a world with ontological excess. Reject (4), accept the sharp boundary, and live with the ignorance.
