      *   *Nuance:* The "baseline" argument assumes stationarity. The future might not be stationary.
      *   *Specific Reference:* Mention Hilary Greaves' work on cluelessness. Mention the Beckstead-Thomas paper on "A Paradox of Tiny Probabilities and Enormous Values."
      *   *Tone:* Keep it rigorous, philosophical, but direct. No fluff.

