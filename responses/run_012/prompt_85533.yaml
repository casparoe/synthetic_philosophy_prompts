answer: |-
  You have put your finger on the **Reference Class Problem**, but you have correctly identified that the standard textbook heuristic ("use the narrowest class") is a broken tool for the job you're doing. You are dealing with a specific, jagged edge of that problem that often gets smoothed over in introductory philosophy.

  Here is the family tree, the distinction from Simpson's Paradox, the shape of the structural snag, and a coinage for the specific ethical deadlock you are experiencing.

  ### 1. The Family Tree
  *   **Great-Grandparent:** **The Problem of Induction (Hume).** How do we justify moving from observed instances to unobserved instances?
  *   **Grandparent:** **The Frequentist Interpretation of Probability (Venn, 1876).** Probability is the limit of relative frequency in a sequence. But *which* sequence?
  *   **Parent:** **The Reference Class Problem (Reichenbach, 1949).** Hans Reichenbach formalized the dilemma: To assign a probability to a single event (this patient's heart attack), you must place it in a reference class. But the event belongs to infinite classes (smokers, diabetics, people named John, people born in 1965). Each class yields a different frequency.
  *   **Sibling:** **The Problem of Single-Case Probabilities (Hájek, 2007).** Alan Hájek argues that if there is no unique reference class, there is no such thing as a "single-case probability" at all. It's a category error.
  *   **Cousin:** **Simpson's Paradox.** (See below for why this isn't it).

  ### 2. Why It Isn't Simpson's Paradox
  Simpson's Paradox is about **aggregation bias**. It occurs when a trend appears in different groups of data but disappears or reverses when these groups are combined.
  *   *Simpson's:* Treatment A looks better than B in men, and better in women, but worse when you combine men and women.
  *   *Your Problem:* This is **Selection Ambiguity**. You aren't seeing a reversal upon aggregation; you are facing a **multidimensional intersection** where no aggregation is obviously "correct." You aren't asking, "Does the trend reverse if we combine smokers and non-smokers?" You are asking, "Is this patient fundamentally a *smoker* who happens to live near a highway, or a *highway resident* who happens to smoke?"

  Simpson's warns you that combining groups can lie. Your problem is that keeping them separate leaves you with no rule for choosing which separation matters.

  ### 3. The Shape of the Snag: The Non-Nested Lattice
  The rule you cited—"use the narrowest group you have solid data for"—works only if reality is hierarchical (nested).
  *   *Nested:* Mammals -> Primates -> Humans -> Men -> Smokers. Here, "Smoking Men" is a subset of "Men." The narrowest rule works.
  *   *Your Reality:* Risk factors are **cross-cutting**, not nested.
      *   Class A: 58-year-old smokers.
      *   Class B: People living near highways.
      *   Class C: Diabetics with low income.

  Class A is not a subset of Class B. They intersect. The intersection (A ∩ B) might have no data (sample size too small). This creates a **lattice** of possible classes, not a ladder. When you climb down one branch (focusing on genotype), you move laterally away from another branch (neighborhood).

  The "narrowest class" rule fails because there is no single "narrowest" point in a lattice where dimensions crisscross. There are only *local* minima of specificity. One committee member minimizes distance; another minimizes behavior. Neither is mathematically privileged without a weighting system.

  ### 4. The Causal Smuggling
  You noted that the group settles on "factors that actually cause the thing." In philosophy of science, this is the move from **Statistical Relevance** (Salmon, 1971) to **Causal Relevance**.
  *   **Wesley Salmon** argued we should partition classes based on factors that are *statistically relevant* to the outcome.
  *   **The Catch:** Statistical relevance is symmetric (A correlates with B), but causation is asymmetric (A causes B). To pick the "right" class, you need a causal model (e.g., "Highway pollution exacerbates diabetes, but income mediates access to care").
  *   **The Dead End:** As you observed, the committee doesn't agree on the causal story. One member thinks genotype is the driver; another thinks social determinants. When you appeal to causality to solve the reference class problem, you simply kick the can down the road to the **Causal Inference Problem**. You haven't solved the uncertainty; you've hidden it inside a causal assumption.

  ### 5. The Ethical Drift: Strategic Reference Class Selection
  This is the part the philosophy texts often miss. You observed: *"Half the time the group we settle on is just the one that suits whoever has to defend the call."*

  This is not an epistemological error; it is a **political optimization**. In the absence of a principled way to select the class, the selection becomes a proxy for risk tolerance and liability.
  *   If I want to approve a risky surgery, I use the class that yields the lower mortality risk.
  *   If I want to deny coverage, I use the class that yields the higher complication risk.

  This is **Motivated Reference Class Selection**. It turns the probability estimate into a rhetorical weapon rather than a descriptive statistic.

  ### 6. Is There a Principled Way?
  **Short answer:** No. Not for a single number.
  **Long answer:** The only principled way is to stop trying to produce a point estimate (e.g., "15% risk") and start producing a **Risk Interval** derived from the lattice.

  If the plausible reference classes range from 8% to 30%, the honest probability is not 19% (the average); it is **[8% – 30%]**.
  *   **Why this works:** It acknowledges the *ambiguity* (uncertainty about the model) separately from the *risk* (uncertainty about the outcome).
  *   **The Trade-off:** It makes decision-making harder. Ethics committees hate intervals because they want a threshold (e.g., "Is risk > 20%?"). But forcing a point estimate when the reference class is contested is scientifically dishonest.

  ### 7. Coinage: The Defensive Reference Class
  Since you asked for a name for this specific dynamic—the intersection of non-nested factors and institutional self-protection—I propose calling this **The Defensive Reference Class**.

  **Definition:** A reference class selected not for its statistical optimality or causal fidelity, but for its ability to minimize institutional liability or maximize defensibility in a post-hoc review.

  **Edges of the Concept:**
  1.  **Retrospective Justification:** The class is chosen because it justifies a decision already made on other grounds (intuition, resource scarcity, patient preference).
  2.  **Asymmetric Scrutiny:** The class is chosen based on which error is more punishable. (e.g., If a patient dies, we are sued; if they live, we are not. Therefore, we choose the class that predicts higher risk to justify caution).
  3.  **The Specificity Mask:** It often hides behind the "narrowest class" rule, using specificity as a shield against charges of bias, even when the specificity is arbitrary.

  ### Summary for the Committee
  You are facing the **Non-Nested Reference Class Problem**.
  *   **The Snag:** Risk factors crisscross; there is no single narrowest group.
  *   **The Trap:** Appealing to "causality" just shifts the disagreement to causal mechanisms.
  *   **The Reality:** You are likely engaging in **Defensive Reference Class Selection**.
  *   **The Fix:** Stop voting on the number. Vote on the **Range**. If the committee cannot agree on a class that yields a tight interval, the ethical output should be "Uncertainty is too high for a standard protocol," not a fake precision number.

  The problem isn't that you can't find the right number. It's that, for this patient, *there is no right number*, only a right acknowledgment of the spread.
