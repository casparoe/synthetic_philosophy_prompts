  ### Preliminary Brainstorming (Discarded Draft)

  **The Two Camps:**
  *   **Camp A (Realists/Experientialists):** Dreams are ontologically equivalent to waking experiences. They occur in real-time during sleep. The brain generates a phenomenological world that exists independently of whether it is later remembered. Forgetting is a storage/retrieval failure, not evidence of non-existence.
  *   **Camp B (Constructionists/Performanceists):** "Dreaming" is a retrospective narrative construction. Sleep involves neural activation and imagery fragments, but the coherent "dream" is assembled upon waking to make sense of those fragments. Without the report/construction, there is no dream, only sleep physiology.

  **Sub-Questions:**
  1.  **Ontology:** Does phenomenology require access? Can there be experience without the possibility of report?
  2.  **Memory:** Is memory constitutive of experience (you only experienced what you can recall) or archival (you experienced it, then lost the file)?
  3.  **Time:** Do dreams unfold in real-time (matching sleep duration) or are they temporally compressed/inserted upon waking?
  4.  **Animals:** Is "dreaming" a human linguistic practice or a mammalian biological state?
  5.  **Evidence:** Does neural correlation (e.g., decoding) prove content existence or just provide the原材料 (raw materials) for construction?

  **Initial Thought on Resolution:**
  The fight is partly verbal (definition of "dream") but mostly substantive (nature of consciousness). Camp B risks eliminating consciousness too aggressively; Camp A risks reifying memory errors. The joint statement needs to admit that current methods cannot distinguish between "forgotten experience" and "post-hoc construction" without begging the question.

  ***

  # JOINT STATEMENT ON THE ONTOLOGY OF DREAMING
  **Prepared by the Adversarial Collaboration on Sleep Phenomenology**

  ### I. Agreed Claims
  *The following claims are accepted by both Camp A (Experientialists) and Camp B (Constructionists) as empirically grounded or conceptually necessary.*

  1.  **Neural Correlates:** Specific neural activation patterns (e.g., REM physiology, PGO waves, cortical activation during NREM) reliably correlate with the subsequent *report* of dreaming. Neither side claims these patterns constitute the dream itself, only that they are necessary conditions for the phenomenon under investigation.
  2.  **The Report Dependency:** All current scientific knowledge of dreaming is mediated through waking reports. There is no direct first-person access to sleep states from the third-person perspective.
  3.  **Memory Instability:** The transition from sleep to waking involves a critical window for memory consolidation. Interference or delay during this window significantly degrades the detail and coherence of dream reports.
  4.  **Semantic Ambiguity:** The word "dream" is currently used ambiguously in literature to refer to: (i) the putative phenomenological event during sleep, and (ii) the waking narrative produced upon awakening. Disputes often arise from conflating these referents.
  5.  **Falsifiability Condition:** Both sides agree that if a neural decoder could predict specific, novel report content *during* sleep (prior to awakening) with high accuracy, this would constrain both positions, though not necessarily settle the ontological dispute.
  6.  **Non-Report Cases:** In cases where sleep physiology indicates dreaming but no report is given (due to amnesia or lack of verbal capacity), the sides disagree on the ontology, but agree that the *scientific data* remains identical in both scenarios.

  ### II. Disagreements
  *The following table isolates the core disputes. We specify whether each is merely verbal (definitional) or substantive (ontological/empirical).*

  | Domain | Camp A Formulation (Experientialist) | Camp B Formulation (Constructionist) | Verbal or Substantive? |
  | :--- | :--- | :--- | :--- |
  | **Ontology of the Sleep Period** | A dream is an experience that occurs *during* sleep. The waking report is a retrieval of that event. | A dream is a cognitive performance *upon* waking. Sleep involves imagery fragments, but the "dream" is constructed later. | **Substantive.** This is not just about the word "dream," but about whether phenomenal consciousness exists without access/reportability. |
  | **The Role of Memory** | Forgetting a dream is like forgetting a waking event: the experience happened, the trace was lost. | Remembering is constitutive of the dream. Without the memory construction, there is no unified experience to have lost. | **Substantive.** Disagreement on whether memory is archival (A) or constitutive (B) of phenomenology. |
  | **Temporal Structure** | Dreams unfold in rough real-time with sleep duration. | Dream time is inferred or constructed upon waking; the sense of duration is part of the narrative, not the event. | **Substantive.** Disagreement on whether subjective time during sleep matches clock time. |
  | **Non-Verbal Subjects** | Dogs and infants dream because they share the neural physiology and behavioral markers (twitching, vocalizing) of human dreamers. | Asking if a dog "dreams" is a category error. They have sleep-activation, but without the capacity for narrative report, "dreaming" does not apply. | **Verbal & Substantive.** Verbal regarding the label "dream"; substantive regarding whether non-reportable phenomenology exists in animals. |

  **Analysis of Verbal vs. Substantive:**
  While some friction arises from Camp B defining "dream" strictly as "report," the core disagreement is substantive. Camp B does not merely claim we cannot *know* about sleep experiences; they claim there *are no* unified experiences during sleep, only fragmented activations. Camp A claims unified phenomenology exists independently of access. This is a disagreement about the nature of consciousness, not just terminology.

  ### III. Cruxes and Pre-Registered Predictions
  *These are the specific cases where empirical results would force at least one camp to revise their position. Predictions are locked prior to data collection.*

  #### Crux 1: The Unreported Dream (Amnesia)
  **Case:** A subject exhibits definitive REM signature associated with dreaming. They are awakened immediately. They report zero memory of any experience ("I was out cold").
  *   **Camp A Prediction:** An experience occurred. The neural signature confirms the generation of phenomenology; the lack of report confirms a memory consolidation failure specific to the sleep-wake transition.
  *   **Camp B Prediction:** No dream occurred. The neural signature confirms activation of imagery systems, but without the waking construction process (triggered by recall), there was no unified experience to forget.
  *   **Settling Condition:** If neural decoding (see Crux 3) confirms specific content exists *during* sleep despite subsequent amnesia, Camp B must concede experience exists without report. If decoding fails to find specific content until after the subject claims to remember, Camp A must concede construction is primary.

  #### Crux 2: Non-Verbal Subjects (Dogs/Infants)
  **Case:** A dog enters REM sleep, exhibits twitching/vocalization consistent with running/chasing. No report is possible.
  *   **Camp A Prediction:** The dog is having a phenomenological experience analogous to human dreaming. The physiology is sufficient for experience; report is only necessary for *science*, not for the *event*.
  *   **Camp B Prediction:** The question "Is the dog dreaming?" is false or meaningless. The dog has sleep-activation and memory processing, but "dreaming" requires the narrative synthesis available only to verbal agents (or agents with equivalent meta-cognitive reporting capacity).
  *   **Settling Condition:** This may remain philosophically stalled, but if neural decoding in dogs matches specific environmental stimuli encountered while awake (reactivation) vs. novel combinations, it bears on whether sleep is purely consolidative (B leans here) or generative (A leans here).

  #### Crux 3: Neural Decoding of Visual Content
  **Case:** A decoder trained on waking imagery is run during sleep. It outputs visual data (e.g., "face," "car," "street") before the subject is awakened.
  *   **Camp A Prediction:** The decoder will match the *specific* details the subject later reports (e.g., "red car"). The content exists in the head during sleep.
  *   **Camp B Prediction:** The decoder will show generic activation categories (e.g., "visual cortex active," "face schema"), but the *specific* details (e.g., "red," "Toyota") will only correlate with the post-waking report, not the sleep activity. The specifics are added during construction.
  *   **Settling Condition:** High-fidelity matching of specific novel details during sleep favors Camp A. Matching only generic categories during sleep, with specifics arising only upon waking, favors Camp B.

  #### Crux 4: Delayed Reporting (The Decay Window)
  **Case:** Subjects are awakened from REM. Group A reports immediately. Group B performs a 30-second interference task (math) before reporting.
  *   **Camp A Prediction:** Group B reports will show random memory decay (loss of peripheral details, retention of core narrative). The structure remains coherent but sparse.
  *   **Camp B Prediction:** Group B reports will show narrative collapse or inconsistency. Since the construction window requires immediate access to sleep-state residuals, interference breaks the construction process, leading to confabulation or significantly lower coherence scores, not just less detail.
  *   **Settling Condition:** If Group B reports are coherent but short, it favors Camp A (forgetting). If Group B reports are incoherent or structurally different (not just shorter), it favors Camp B (construction failure).
