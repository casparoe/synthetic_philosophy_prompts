      *   *Check the "Strictly Worse" claim:* Is it wrong or just controversial? It's controversial. Some NUers say it's strictly worse. Most pluralists say it's *among* the worst things. I'll classify it as a specific axiological claim, not a general definition.

  8.  **Final Polish:** (Produces the structured response below.)
