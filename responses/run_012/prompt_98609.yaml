prompt: |-
  I'm a second-year PhD student in cog sci and I run a tiny podcast (like 200 listeners, mostly people from my lab) where I interview folks about conceptual foundations of cognitive science. Next month's guest is a philosopher of mind who's spent the last few years defending a pretty strong reading of Hofstadter's careenium metaphor -- the billiard table full of magnetic marbles that clump into bigger clumps -- and she thinks the clumps (the simmballs, or symmballs, however you want to spell it, I keep flip flopping) aren't just a convenient description of what the marbles are doing but are themselves doing genuine causal work: the symbols push the substrate around, not the other way around. I've been arguing with a labmate about this for weeks and I genuinely don't know which side I'm on, which is why I want to do this episode.

  Her own line, which I find confusing and intresting, is what she calls the echo test: you stick a little detector inside the careenium that reads out where the simmballs are, and you wire that readout to nudge the walls; if the sim trajectories that follow are ones the marble-level dynamics would basically never have produced on their own, she says that shows the simmball level has independent causal oomph. My labmate says this is circular -- the detector is just another marble-level device and the whole thing is a redescription of the same pushes. I'd like the interview to actually get somewhere on this instead of us both restating our priors.

  Can you write me eight to ten interview questions? I want at least one that makes her say precisely what it would mean for the simmball level to be doing work that the sim level isn't already doing, and one that presses on whether Hofstadter's setup already bakes in the answer by having the walls' bounciness track the outside world, so all the semantic content comes in from outside and the simmballs just inherit it. Also I want something on what happens to her view if you build a careenium that's marble-for-marble identical but whose simmballs are arranged differently (or the reverse), and something on how she'd answer someone who says this is just Kim's exclusion problem wearing a billiard-table costume. For each question, add a short follow-up aimed at the answer she's most likely to give, since she has a habit of saying that this is just the description-level question again and moving on.
