prompt: |-
  Hey, I've been arguing with a friend about consent and I want a real explanation of the underlying issue, not the usual informed-voluntary-competent checklist again.

  Here's the thing I can't get straight. There seem to be two totally different pictures of what consent even is. On the first picture, consent is a mental state -- some kind of inner endorsement or willingness -- and all the outward stuff (saying yes, signing, nodding) is just evidence we use to guess at that inner state. On the second picture, consent is an act or a communication: it's something you do that changes what other people are permitted to do, so an inward yes that never gets communicated isn't consent at all, and an outward yes you privately regret might still count as real consent in the relevant sense.

  I feel like this split is doing a lot of hidden work in the three standard defeaters. Take coercion: if consent is a mental state, a threat works by making you not really willing; if consent is a performative thing, the threat might leave your act intact but make it not count. Same with deception -- does the lie make the mental state defective, or make the act fail to be about the right thing? And competence -- is that a property of the person, or of the particular decision, or of the decision relative to how risky it is?

  Can you explain this properly, and seperate where the two pictures genuinely come apart from where they just sound different? A concrete case I keep circling: someone agrees to a medical procedure after the doctor downplays a rare risk without actually saying anything false -- nothing untrue is stated, but the picture in their head is wrong. Is that invalid consent, and does the answer change depending on which picture you hold?

  Also I keep hearing that some coercion is wrongful and some isn't -- like a doctor offering you a treatment you otherwise wouldn't get isn't coercive even though it changes your options, whereas a boss making sex a condition of your job is. Where does that line actually come from, and does it fit better with one of the two pictures than the other?

  Please be concrete and dont just restate the three conditions. I want the actual machinery.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Question:** The user is asking about the fundamental nature of consent: Is it a *mental state* (subjective willingness) or a *performative act/communication* (objective change in normative relations)?
      *   **Specific Complaint:** They don't want the standard "informed, voluntary, competent" checklist. They want the "actual machinery" underneath those conditions.
      *   **Key Tension:** How do the two pictures (Mental State vs. Performative) handle defeaters like coercion, deception, and competence differently?
      *   **Concrete Cases:**
          1.  Medical procedure where risk is downplayed (omission/truthful but misleading).
          2.  Coercion distinction (doctor offering treatment vs. boss demanding sex).
      *   **Goal:** Explain the split, where they genuinely diverge vs. where they just sound different, and apply it to the specific cases.

  2.  **Deconstruct the Two Pictures:**
      *   **Picture A: The Mental State View (Subjective/Attitudinal).** Consent is an internal attitude of willingness. External signs are evidence. If the internal state is missing or flawed, consent is missing, regardless of outward appearance.
      *   **Picture B: The Performative/Normative View (Objective/Communicative).** Consent is a speech act or social transaction that changes permissions (normative status). It's like making a promise or signing a contract. The inner state matters less than the public commitment.

  3.  **Identify the "Machinery" (Philosophical Underpinnings):**
      *   *Mental State:* Rooted in autonomy as self-governance. Violation occurs when the will is overridden.
      *   *Performative:* Rooted in autonomy as interaction/reliance. Violation occurs when rules of engagement are broken or permissions are exceeded.
      *   *Hybrid:* Most modern legal/ethical frameworks are actually hybrids, but they lean one way depending on the context (criminal law leans performative for protection; ethics leans mental for respect).

  4.  **Address the Defeaters (Coercion, Deception, Competence) through both lenses:**
      *   *Coercion:*
          *   Mental: Threat distorts the will. You didn't *want* to do it.
          *   Performative: Threat invalidates the *authority* of the transaction. You can't transfer permission under duress because the transaction rules are broken.
      *   *Deception:*
          *   Mental: You believed X, reality is Y. Your will was directed at X, not Y.
          *   Performative: The terms of the agreement were falsified. You agreed to A, they did B.
      *   *Competence:*
          *   Mental: Capacity to form the requisite attitude.
          *   Performative: Capacity to understand the normative consequences of the act.

  5.  **Tackle the Concrete Cases:**

      *   *Case 1: Medical Downplaying (Truthful but Misleading).*
          *   Mental View: Did the patient *truly* will this specific risk? If the risk is material to their decision, their internal endorsement is flawed. Consent likely invalid.
          *   Performative View: Did the doctor fulfill the duty of disclosure required to make the "contract" valid? If the standard of care requires disclosing rare risks, the performative act is defective. If not, the act stands.
          *   *Divergence:* The Mental view cares about *this specific patient's* mindset. The Performative view cares about *reasonable standards* of communication.

      *   *Case 2: Coercion (Doctor vs. Boss).*
          *   Why is one okay and one not?
          *   *Baseline Problem:* Coercion is relative to a baseline of "normal options."
          *   Doctor: Baseline is "state of health." Treatment adds an option.
          *   Boss: Baseline is "employment rights." Sex is not a job requirement. Removing the job if you don't have sex is a threat, not an offer.
          *   *Fit:* The Performative view handles this better because it looks at *entitlements*. The boss has no right to make that demand. The doctor has a right to offer treatment. The Mental view struggles because the psychological pressure might feel similar to the victim.

  6.  **Synthesize and Structure the Argument:**
      *   **Introduction:** Acknowledge the depth of the question. Validate the distinction (Attitudinal vs. Performative).
      *   **Section 1: The Two Ontologies.** Define Mental State (Attitudinal) vs. Normative Power (Performative). Use the "Promise" analogy.
      *   **Section 2: Where they diverge on Defeaters.**
          *   Coercion (Will vs. Entitlement).
          *   Deception (Belief vs. Terms).
          *   Competence (Capacity vs. Understanding Consequences).
      *   **Section 3: The Medical Case (Omission/Downplaying).** Show how the verdict might differ. Mental = subjective materiality. Performative = objective standard of disclosure.
      *   **Section 4: The Coercion Baseline (Doctor vs. Boss).** Explain the "Moral Baseline" theory. Show why Performative fits better here (rights-based).
      *   **Section 5: The Synthesis/Reality.** Acknowledge that law/ethics usually mix them (The "Hybrid View"). Why? Because pure Mental is too hard to prove, pure Performative is too rigid.
      *   **Conclusion:** Summarize the "machinery."

  7.  **Refine the Tone:**
      *   Avoid preaching.
      *   Avoid the "IVC checklist."
      *   Be philosophical but concrete.
      *   Use terms like "Normative Power," "Baseline," "Materiality."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* the boss case is coercive but the doctor isn't?
      *   *Correction:* Need to emphasize the *pre-existing entitlement*. The boss is threatening to remove something you are entitled to (job without sex). The doctor is offering something you aren't entitled to (cure).
      *   *Check:* Did I address the "truthful but misleading" medical case?
      *   *Correction:* Ensure I distinguish between "fraud in the factum" (performative failure) vs "fraud in the inducement" (mental flaw).
      *   *Check:* Is the distinction clear?
      *   *Correction:* Use the "Secret Yes" test. If I say no but mean yes (Mental = yes, Performative = no). If I say yes but mean no (Mental = no, Performative = yes). This highlights the divergence.

  9.  **Final Polish:** Ensure the distinction between "invalidating the will" and "invalidating the transaction" is clear. (Proceed to generate output based on this structure).

  *(Self-Correction Note during drafting)*: I need to be careful not to say one view is "right." The prompt asks for an explanation of the split, not a verdict. However, I should point out where one view explains certain intuitions better than the other.

  *(Refining the Coercion Point)*: The "Baseline" explanation is crucial. I should reference the "Will Theory" vs. "Interest Theory" of rights implicitly, but keep it accessible. The key is *Normative Baselines*.

  *(Refining the Medical Case)*: This is essentially "Informed Consent" vs. "Valid Consent." The Mental view leans heavily on *Informed* (subjective understanding). The Performative view leans on *Consent* (valid authorization).

