answer: |-
  You have identified the central fault line in the philosophy of consent. You are correct that the standard "Informed, Voluntary, Competent" checklist is just a surface-level attempt to manage the tension between two deeper, incompatible ontologies of what consent *is*.

  Let's call these the **Attitudinal View** (Mental State) and the **Normative Power View** (Performative Act).

  Here is the machinery of how they differ, where they break, and how they handle your specific cases.

  ### 1. The Two Ontologies

  **The Attitudinal View (Mental State)**
  *   **The Machinery:** Consent is an internal psychological event: the alignment of your will with the proposed action.
  *   **The Function:** Outward signs (words, nods, signatures) are merely *evidence* of the inner state. They are fallible proxies.
  *   **The Violation:** A violation occurs when your will is overridden or bypassed. If you say "yes" but internally recoil, your autonomy has been breached because your self-governance was not actually engaged.
  *   **The Problem:** It is epistemically inaccessible. No one can see your inner state. If this were the only standard, no one could ever safely act on consent, because they could always be wrong about your inner state.

  **The Normative Power View (Performative)**
  *   **The Machinery:** Consent is a speech act (like promising or marrying). It is a tool we use to change the "normative landscape." Before consent, I have a duty not to touch you; after consent, that duty is waived.
  *   **The Function:** The outward act *creates* the permission. The inner state is largely irrelevant to the *validity* of the transaction, though it may be relevant to the *morality* of the request.
  *   **The Violation:** A violation occurs when the rules of the transaction are broken. If you say "yes," you have transferred the permission. If you later claim you didn't "mean it," the permission still stands because the public act was completed.
  *   **The Problem:** It can be too rigid. It risks validating "consent" given by someone who is terrified but compliant, simply because they said the magic words.

  ### 2. Where the Machinery Grinds: The Defeaters

  You asked how coercion, deception, and competence work differently here. The difference lies in *what is being defeated*.

  **Coercion**
  *   **Attitudinal:** Coercion defeats the **Will**. A threat forces you to choose an option you wouldn't choose. Your internal endorsement is compromised because it is driven by fear, not desire.
  *   **Normative:** Coercion defeats the **Entitlement**. You cannot transfer permission you don't have, or transfer it under conditions that violate the rules of exchange. A threat makes the transaction void because the "offer" was illicit.
  *   **The Split:** In the Attitudinal view, even a *legitimate* threat (e.g., "If you steal, I will call the police") can negate consent if it makes you feel you have no choice. In the Normative view, legitimate threats do not negate consent because the threatener was within their rights to make them.

  **Deception**
  *   **Attitudinal:** Deception creates a **Mismatch**. You willed X, but reality is Y. Because your mental state was directed at X, you never actually consented to Y.
  *   **Normative:** Deception creates a **Fraudulent Contract**. The terms of the agreement were falsified.
  *   **The Split:** The Attitudinal view cares about *your specific understanding*. The Normative view cares about *the objective terms*. If I trick you into sleeping with me by saying I'm a millionaire, the Attitudinal view says "You didn't will sex with a non-millionaire." The Normative view often says "The act was sex; the wealth was an inducement, not a term of the act." (This is the legal distinction between *fraud in the factum* vs. *fraud in the inducement*).

  **Competence**
  *   **Attitudinal:** Competence is the **Capacity to Feel**. Can this person form a genuine preference?
  *   **Normative:** Competence is the **Capacity to Bind**. Does this person understand that saying "yes" changes the rules of what others can do to them?
  *   **The Split:** A child might genuinely *want* (Attitudinal) to play in traffic, but lacks the Normative capacity to waive the right to safety.

  ### 3. Case Study: The Downplayed Medical Risk

  *Case: A doctor truthfully omits a rare risk. The patient agrees. The risk materializes.*

  **Under the Attitudinal View:**
  Consent is likely **invalid**.
  *   **Why:** The machinery focuses on the patient's specific mental state. If the patient had known the risk, their internal "endorsement" would not have existed. Because the inner state is the source of consent, and the inner state was formed on false premises (even if the doctor didn't lie), the will was not truly aligned with the reality of the procedure.
  *   **Verdict:** The doctor violated the patient's autonomy because the patient's self-governance was compromised by missing information *material to them*.

  **Under the Normative View:**
  Consent is likely **valid** (depending on professional standards).
  *   **Why:** The machinery focuses on the transaction. Did the doctor fulfill the required duty of disclosure to make the authorization valid? In law, this is often the "reasonable physician" or "reasonable patient" standard. If the risk is statistically rare and standard practice is not to disclose it, the *performative act* of signing the form stands. The patient authorized the procedure, and the procedure was performed as authorized.
  *   **Verdict:** The doctor may be negligent for poor communication, but they did not violate the *consent* boundary. The permission was granted via the public act.

  **The Divergence:** The Attitudinal view protects the **subjective experience of choice**. The Normative view protects the **reliability of social agreements**. If we follow the Attitudinal view strictly, doctors can never be safe, because a patient can always claim, "If I had known that tiny detail, I wouldn't have willed it." The Normative view sets an objective bar to allow interaction to proceed.

  ### 4. Case Study: The Coercion Baseline (Doctor vs. Boss)

  *Case: Why is a doctor offering treatment not coercive, but a boss demanding sex is?*

  This is the hardest problem for the Attitudinal View. Psychologically, the pressure might feel identical. "I need this job/I need this cure, so I must say yes." If consent is just a mental state of willingness, both look like coercion.

  The **Normative Power View** solves this using **Baselines of Entitlement**.

  **The Machinery of the Baseline:**
  Coercion is not just "pressure." Coercion is a threat to make someone worse off than they are *entitled* to be.

  1.  **The Boss:** You are entitled to your job without sexual favors. The baseline is "Employment continues." The boss proposes: "Sex or I fire you." They are threatening to drop you *below* your entitlement baseline. This invalidates the normative transaction. You cannot consent to sex under a threat that violates your employment rights.
  2.  **The Doctor:** You are not entitled to a cure. The baseline is "State of Illness." The doctor proposes: "Treatment or remain ill." They are offering to lift you *above* your baseline. This is an offer, not a threat. Even if you feel you "have" to take it, the normative structure is an expansion of options, not a restriction of rights.

  **Why the Attitudinal View Struggles Here:**
  If consent is purely mental willingness, the distinction is murky. A desperate patient might feel *more* compelled than an employee. The Attitudinal view has to do gymnastics to explain why "feeling forced" by cancer isn't coercion, but "feeling forced" by a boss is.

  The Normative view cuts through this: It doesn't matter how the pressure *feels*; it matters where the pressure *comes from*.
  *   Boss: Illegitimate pressure (violates rights).
  *   Doctor: Legitimate pressure (circumstantial).

  ### 5. Where They Just Sound Different vs. Where They Split

  **Where they just sound different (Convergence):**
  In clear-cut cases, both views yield the same result.
  *   *Gun to the head:* Attitudinal (Will is terrified) = No Consent. Normative (Threat violates right to life/safety) = No Consent.
  *   *Clear enthusiastic yes:* Attitudinal (Will is aligned) = Consent. Normative (Act is clear) = Consent.
  The machinery produces the same output, so people assume they are arguing about the same thing. They aren't.

  **Where they genuinely split (Divergence):**
  They split in **Gray Zones of Communication** and **Internal Regret**.
  *   *The "Freeze" Response:* A victim goes limp and says nothing.
      *   **Normative:** Ambiguous. No clear "yes" act occurred. Permission was not transferred. (Good for protection).
      *   **Attitudinal:** If they internally wanted it but froze, consent exists mentally. (This view is rarely used here because it's dangerous).
  *   *The "Polite Yes":* A victim says "Okay, fine" to stop an argument, internally hating it.
      *   **Normative:** Consent likely exists. The speech act was performed. The other party is permitted to proceed. (This is why "you said yes" is a legal defense).
      *   **Attitudinal:** Consent does not exist. The will was not engaged. (This is why "I didn't really want to" is a moral complaint).

  ### 6. The Synthesis: Why We Use Both

  You won't find a pure version of either in the wild. Legal and ethical systems use a **Hybrid Machinery** to balance the risks of each.

  1.  **Criminal Law (Sexual Assault):** Leans **Normative/Performative**.
      *   *Why:* We need objective standards to protect the accused from mind-reading. "No means No" or "Yes means Yes" are performative rules. If we used the Attitudinal view, a defendant could be jailed because a jury decided the victim "didn't really mean it," even if they said yes.
  2.  **Medical Ethics:** Leans **Attitudinal**.
      *   *Why:* The goal is patient welfare, not transactional certainty. If a patient signs a form but clearly doesn't understand (mental state flawed), the doctor must stop, even if the performative act (signature) is complete.
  3.  **Contract Law:** Leans **Normative**.
      *   *Why:* Commerce requires reliance. If you sign a deal and later say "I didn't mentally endorse clause 4b," the contract must still hold, or trade collapses.

  ### Summary of the Machinery

  *   **Attitudinal View:** Consent is **Authority over Self**. It is defeated when the *Will* is compromised. It prioritizes the *Subject's* experience.
  *   **Normative View:** Consent is **Authority over Others**. It is defeated when the *Transaction* is compromised. It prioritizes the *Interaction's* stability.

  In your medical case (downplayed risk), the Attitudinal view says the consent is void because the *Will* was misinformed. The Normative view says the consent holds because the *Transaction* met the standard of care.

  In your coercion case (Boss vs. Doctor), the Attitudinal view struggles to distinguish them based on pressure alone. The Normative view distinguishes them based on *Entitlements*: the boss threatens a right; the doctor offers a benefit.

  The argument you are having with your friend is likely that one of you is arguing from the **Authority over Self** perspective (Consent is about how I feel), and the other is arguing from the **Authority over Others** perspective (Consent is about what you are allowed to do). Both are true, but they govern different domains.
