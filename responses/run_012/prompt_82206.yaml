answer: |-
  The difficulty you have identified has a settled label in moral philosophy. It is called **The Problem of Relevant Descriptions** (sometimes referred to as **The Maxim Formulation Problem** or simply **The Input Problem**).

  It is a recognized structural weakness in any ethical system that relies on universalization tests, most famously Kant's Formula of Universal Law.

  Here is the precise breakdown of what the name covers, how it relates to your two versions, how it compares to neighboring concepts, and how it interacts with Kant's specific formulations.

  ### 1. Scope: Does it cover both versions?
  **Yes.** In the technical literature, your "second version" is generally understood to be a consequence of the first, not a separate problem.

  *   **Version 1 (Granularity):** This is the core definition of the Problem of Relevant Descriptions. It asks: *Which features of the action belong in the maxim?* Do we include the agent's motive? The specific consequences? The identity of the recipient? If you include "to avert something worse" in the description, the maxim passes; if you leave it out, it fails.
  *   **Version 2 (Scope of World):** This is subsumed under the first. When you describe the "situation" in your maxim, you determine the scope of the universalization.
      *   If your maxim is "I will take the last seat," universalizing it means everyone takes the last seat (chaos).
      *   If your maxim is "I will take the last seat *when no one else needs it more*," universalizing it means everyone takes the last seat *when no one else needs it more* (order).
      *   Therefore, the ambiguity about "which world am I imagining?" is resolved (or manipulated) by how finely you describe the *conditions* of the action. The "world" is just the logical projection of the description.

  **What it leaves out:** The term refers specifically to the *formulation of the rule* prior to testing. It does not name the *psychological* or *rhetorical* tactic of shifting descriptions mid-argument to win a point. While philosophers acknowledge this happens, there is no single settled label for the *dialectical maneuver* itself, though it is often colloquially called "gerrymandering the maxim."

  ### 2. Comparisons to Nearest Concepts

  **The Zealot (Universalizing Ruthlessness)**
  *   **Relation:** The Zealot is the *beneficiary* of the Problem of Relevant Descriptions.
  *   **Distinction:** The Zealot objection (e.g., "A consistent Nazi can universalize 'Kill all Jews'") claims the test yields immoral results. The Problem of Relevant Descriptions claims the test yields *indeterminate* results. The Zealot says the test is broken because it passes evil; the Description Problem says the test is broken because it passes whatever you feed it, depending on how you phrase the input.

  **Rule Fetishism (Treating rules as sacrosanct)**
  *   **Relation:** Rule Fetishism is a potential *outcome* of trying to solve the Problem of Relevant Descriptions.
  *   **Distinction:** Fetishism is the refusal to break a rule once it is set. The Description Problem arises *before* the rule is set. It is the difficulty of deciding *what the rule actually is*. A fetishist ignores the nuance of description; the Description Problem highlights that the nuance is unavoidable.

  **Philosophy of Action (Act-Individuation)**
  *   **Relation:** This is the metaphysical root of the ethical problem.
  *   **Distinction:** In the philosophy of action (e.g., Anscombe, Davidson), the question is "What did he do?" (Moved a finger? Pulled a trigger? Killed a man?). This is ontological. The Problem of Relevant Descriptions is normative: "Which of these true descriptions is the *morally relevant* one for the test?" You can solve act-individuation (agreeing he did all three) and still face the Description Problem (agreeing which one matters for ethics).

  ### 3. Impact on Kant's Formulations

  The Problem of Relevant Descriptions does not bite all formulations of the Categorical Imperative equally.

  *   **Formula of Universal Law (FUL):** *Bites Hardest.* This formulation ("Act only according to that maxim...") relies entirely on the agent supplying the maxim. It has no external check on whether the description is too coarse or too fine. It is purely formal, making it maximally vulnerable to the input problem.
  *   **Formula of Humanity (FH):** *Bites Less.* ("Act so that you treat humanity... always as an end..."). Here, the "description" is constrained by the objective value of rational agency. You cannot describe your maxim as "Use this person as a tool" without immediately failing the test, regardless of how finely you chop the circumstances. The content is fixed by "humanity," not chosen by the agent.
  *   **Kingdom of Ends:** *Intermediate.* This requires legislating for a community of rational beings. It forces the agent to consider if others could *accept* the description. It mitigates the problem by introducing an intersubjective check on the description, but does not eliminate the ambiguity of how the law is phrased.

  ### 4. Boundary Cases

  Although "The Problem of Relevant Descriptions" is the established term, to ensure we are talking about the exact phenomenon you described, here are the boundary cases that define its limits.

  **Case A: The Verdict Flips (Counts as the Phenomenon)**
  *   *Scenario:* A doctor considers lying to a patient to prevent despair.
  *   *Description 1:* "I will lie to patients." (Universalized: Trust in medicine collapses. Verdict: **Fail**.)
  *   *Description 2:* "I will lie to patients when the truth causes immediate, life-threatening psychological harm." (Universalized: A practice of therapeutic non-disclosure in extreme cases. Verdict: **Pass**.)
  *   *Why it counts:* The physical action is identical. The moral verdict changes solely based on the inclusion of the *circumstantial condition* in the description. This is the core of the Problem of Relevant Descriptions.

  **Case B: The Verdict Flips (Does Not Count as the Phenomenon)**
  *   *Scenario:* A person considers stealing a loaf of bread.
  *   *Description 1:* "I will steal bread." (Verdict: **Fail**.)
  *   *New Information:* The person is starving to death and has no other options.
  *   *Description 2:* "I will steal bread to survive when no other food is available."
  *   *Why it does not count:* This is not merely a change in *description*; it is a change in the *moral facts* of the situation (the introduction of a conflicting duty of self-preservation). The verdict flips not because of linguistic granularity, but because the moral landscape has changed (a conflict of duties). The Problem of Relevant Descriptions applies when the *facts* remain constant and only the *labeling* changes.

  ### Summary
  The name you are looking for is **The Problem of Relevant Descriptions**. It covers both the granularity of the rule and the scope of the imagined world, as the latter is determined by the former. It is distinct from the Zealot objection (which concerns the *output* of the test) and Act-Individuation (which concerns the *metaphysics* of the action). It cripples the Formula of Universal Law but is mitigated in the Formula of Humanity.
