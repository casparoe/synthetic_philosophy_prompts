      *   *Ulysses Contract:* A transaction isolation level or constraint that prevents a specific state change even if the `root` user tries it within a standard session. Example: A `CHECK` constraint that says `balance >= 0` even if the admin tries to overdraft.
      *   *Binding Future Self:* Schema migrations. Version 1.0 locks certain fields. Version 2.0 cannot drop them without a complex migration script (super-majority consensus).
