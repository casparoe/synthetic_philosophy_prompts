prompt: |-
  I'm in a second-year metaphysics course and our seminar's got a guest next week -- she works on material constitution and she's going to argue that the Ship of Theseus has no right answer, not because we haven't worked out which ship is the original but because there just isn't a fact of the matter: whether the rebuilt ship is the ship is genuinely indeterminate, and that indeterminacy is out there in the world rather than being a fact about our words or concepts. I have to introduce her and run the Q&A, and I want questions that actually dig into the view instead of letting her just say identity is vague five times.

  Can you draft me like eight to ten questions, each with a follow-up? I'd like at least one that presses the old objection that indeterminate identity is incoherent -- roughly, if it's indeterminate whether a and b are the same thing, then a is definately identical to itself while b isn't definately identical to a, so b has a property a lacks, so they aren't identical after all, and the indeterminacy was never really about identity. And I want one on whether her story survives the fact that the verdict seems to shift depending on how much of the ship you swap and how you describe the case -- is that indeterminacy in the world, or just in our descriptions? And one about what she thinks ordinary people are doing when they confidently say it is or isn't the same ship.

  For each question give me the follow-up you'd ask after the reply she's most likely to give, and keep the questions concrete -- no what-drew-you-to-this stuff. At the end, tell me which of these would fall apart if I've got her position slightly wrong (say, if she actually thinks the indeterminacy is semantic rather than ontic), and what would make you drop the incoherence objection as the opening question.
reasoning: |-
  Here's a thinking process that leads to the suggested questions and advice:

  1.  **Analyze the Request:**
      *   **Context:** Second-year metaphysics course seminar.
      *   **Guest:** Works on material constitution.
      *   **Position:** Ontic indeterminacy of identity (specifically regarding Ship of Theseus). It's not just semantic/conceptual vagueness; the world itself is indeterminate.
      *   **Task:** Draft 8-10 questions with follow-ups.
      *   **Specific Requirements:**
          *   Must dig into the view (avoid generic "identity is vague" loops).
          *   Must include the Evans-style incoherence objection (indeterminate identity implies distinctness).
          *   Must include the "sorites/description sensitivity" objection (is it really ontic if it shifts with description?).
          *   Must include the "folk intuition" question (what are ordinary people doing?).
          *   Questions must be concrete.
          *   Follow-ups must anticipate likely replies.
          *   End with advice on which questions fail if the position is misunderstood (semantic vs. ontic) and when to drop the incoherence objection.

  2.  **Deconstruct the Guest's Position (Ontic Indeterminacy of Identity):**
      *   *Core Claim:* $\nabla(a = b)$ is true (it is indeterminate whether $a$ is identical to $b$).
      *   *Metaphysical Commitment:* This isn't just about the word "ship." It's about the objects themselves.
      *   *Key Challenge:* Gareth Evans' argument (1978) against indeterminate identity. If $\nabla(a = b)$, then $a$ has the property "definitely identical to $a$" but $b$ does not (it's indeterminate if $b$ is identical to $a$). By Leibniz's Law, $a \neq b$. Contradiction.
      *   *Defense:* Usually involves rejecting classical logic, restricting Leibniz's Law, or arguing that properties themselves are indeterminate.
      *   *Alternative:* Semantic vagueness (epistemicism or supervaluationism). The guest *rejects* this.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The Evans Objection (Required).*
          *   *Draft:* Isn't Evans right? If it's vague, they are distinct.
          *   *Refinement:* Make it precise. Focus on the property "definitely identical to $a$."
          *   *Follow-up:* She will likely reject the determinacy operator or Leibniz's Law. Push on *why* Leibniz's Law fails here without killing logic everywhere.

      *   *Q2: Description Sensitivity (Required).*
          *   *Draft:* If I describe it differently, does the answer change?
          *   *Refinement:* Focus on the "how much wood" vs. "functional continuity" framing. If the indeterminacy is *ontic*, why does linguistic framing affect the metaphysical verdict?
          *   *Follow-up:* If she says "the description picks out different candidates," ask why the *world* doesn't settle which candidate is the referent.

      *   *Q3: Folk Intuitions (Required).*
          *   *Draft:* What do normal people think?
          *   *Refinement:* People are often confident (either "it is" or "it isn't"). Are they all wrong? Or talking past each other?
          *   *Follow-up:* If they are wrong, why is the concept so useful?

      *   *Q4: Temporary vs. Permanent Indeterminacy.*
          *   *Idea:* Is the ship indeterminate *now* or forever?
          *   *Refinement:* Does the indeterminacy resolve? If we find a "essence" later, was it indeterminate before?
          *   *Follow-up:* If it resolves, what changed in the world?

      *   *Q5: Counting.*
          *   *Idea:* How many ships are there?
          *   *Refinement:* If identity is indeterminate, is *number* indeterminate? Can I point and say "1, 2, ... maybe 3?"
          *   *Follow-up:* How does this affect existential claims? "There exists a ship."

      *   *Q6: Causal Powers.*
          *   *Idea:* Does the indeterminate ship sink?
          *   *Refinement:* If the ship sinks, does the original sink? If identity is ontically indeterminate, do causal powers split?
          *   *Follow-up:* If causal powers are determinate, isn't the identity just epistemic?

      *   *Q7: Competing Candidates.*
          *   *Idea:* The reassembled ship vs. the continuous ship.
          *   *Refinement:* Is there a third object? Or just two overlapping ones?
          *   *Follow-up:* If two, are they coincident? If coincident, why is identity indeterminate rather than just false?

      *   *Q8: Logic and Truth Values.*
          *   *Idea:* Is LEM (Law of Excluded Middle) false?
          *   *Refinement:* "Either it is or isn't" -- do you reject this?
          *   *Follow-up:* If you reject LEM, what logic are we using? Intuitionistic?

      *   *Q9: Practical Stakes.*
          *   *Idea:* Insurance claims.
          *   *Refinement:* If I insure the "Original," which ship gets the payout?
          *   *Follow-up:* If the law must decide, does that force a metaphysical fact?

      *   *Q10: Comparison to Quantum Indeterminacy.*
          *   *Idea:* Is this like electron position?
          *   *Refinement:* Quantum indeterminacy is usually about properties, not identity. Is this analogous?
          *   *Follow-up:* If not, why call it "ontic"?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Follow-ups? Yes. Concrete? Yes. Specific objections included? Yes.
      *   *Tone Check:* Needs to be respectful but rigorous (2nd-year seminar level).
      *   *Follow-up Logic:* Ensure the follow-up actually challenges the likely standard defense (e.g., "Leibniz's Law doesn't apply to indeterminate contexts").

  5.  **Final Advice Section:**
      *   *Semantic vs. Ontic:* If she's actually a semantic vagueness theorist (supervaluationist), the ontic questions (Q4, Q6, Q10) make no sense.
      *   *Dropping Evans:* If she's a "friendly" ontic indeterminacy theorist who accepts Evans but reinterprets the operator, the standard Evans objection might be a strawman. Need to know if she accepts the determinacy operator $\Delta$.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Q1:* Make sure I don't misstate Evans. It's about the property of being *definitely* identical.
      *   *Correction on Q2:* Ensure the distinction between "vagueness in language" and "vagueness in world" is clear.
      *   *Check Follow-ups:* Make sure they aren't just "But why?" They need to press a specific tension.

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here are ten questions with anticipated follow-ups, tailored for a second-year metaphysics seminar. They are designed to be precise, avoid generic "what do you think" phrasing, and target the specific commitments of ontic indeterminacy.

  ### 1. The Evans Objection (Incoherence)
  **Question:** "Gareth Evans argued that indeterminate identity is logically incoherent. If it's indeterminate whether Ship A is Ship B, then Ship A definitely has the property of 'being definitely identical to A,' while Ship B arguably lacks that property. By Leibniz's Law, if they differ in properties, they aren't identical—so the indeterminacy collapses into distinctness. How does your view block this derivation without abandoning classical logic entirely?"

  **Likely Reply:** She will likely argue that Leibniz's Law fails in indeterminate contexts, or that properties themselves can be indeterminate (i.e., it's indeterminate whether B has the property of being definitely identical to A).
  **Follow-up:** "If properties can be indeterminate, does that mean the world itself lacks determinate facts about what properties an object instantiates? If so, how do we cash out 'causal power' or 'interaction' without determinate properties?"

  ### 2. Description Sensitivity (Semantic vs. Ontic)
  **Question:** "The verdict on the Ship often shifts depending on how we frame the case—for example, emphasizing functional continuity versus emphasizing material composition. If the indeterminacy is truly *ontic* (in the world) rather than semantic (in our words), why does tweaking our description of the scenario seem to toggle the metaphysical verdict?"

  **Likely Reply:** She might say the descriptions pick out different candidate objects, and the indeterminacy lies in which candidate *is* the ship.
  **Follow-up:** "But if the world contains both candidates (the continuous matter and the functional structure), isn't the indeterminacy just about which word 'Ship' refers to? How do you get from 'we haven't picked a referent' to 'the world is indeterminate'?"

  ### 3. Folk Intuitions and Error Theory
  **Question:** "In ordinary contexts, people tend to be confident that the ship either is or isn't the original; they rarely say 'it is metaphysically indeterminate.' On your view, are ordinary speakers systematically mistaken when they assert a definite identity, or are they simply talking past one another?"

  **Likely Reply:** She may argue they are speaking loosely or pragmatically, not metaphysically.
  **Follow-up:** "If our ordinary concept of 'object' presupposes determinate identity, does positing ontic indeterminacy require us to eliminate ordinary objects entirely? Are there *any* ships, or just indeterminate ship-candidates?"

  ### 4. Counting and Cardinality
  **Question:** "If identity is indeterminate, then cardinality seems to be indeterminate too. When looking at the dock, is it indeterminate whether there is one ship or two? If I try to count them, does the number itself fail to be a fact of the matter?"

  **Likely Reply:** She might accept that "There are exactly two ships" lacks a truth value.
  **Follow-up:** "If existential quantification is indeterminate, does that mean reality itself is incomplete? Or is it just that our quantifiers aren't sharp enough to carve the world?"

  ### 5. Causal Powers and Sinking
  **Question:** "Suppose the reconstructed ship sinks. Does the original Ship of Theseus sink? If identity is ontically indeterminate, does the causal history of the 'original' split? Can one object determinately sink while its identity with the sinking object remains indeterminate?"

  **Likely Reply:** She might say it's indeterminate whether the original sank.
  **Follow-up:** "But the water is definitely wet and the wood is definitely submerged. If the physical events are determinate, what exactly is left over to be indeterminate? Is the indeterminacy just a label we apply to the physical facts?"

  ### 6. Temporary vs. Permanent Indeterminacy
  **Question:** "Is the indeterminacy permanent, or can it be resolved by future events? If we found a magical essence-marker next week that proved continuity, would that mean the identity *was* determinate all along, or that the future fact retroactively fixed the past indeterminacy?"

  **Likely Reply:** She might say the future fact fixes it (open future view) or that it was always indeterminate.
  **Follow-up:** "If it was always indeterminate, but we later treat it as determinate, aren't we effectively revising history? How does ontic indeterminacy accommodate the intuition that the past is fixed?"

  ### 7. Coincidence and Colocation
  **Question:** "Many constitution theorists solve this by saying the 'original' and the 'reconstructed' are distinct but coincident objects. Why prefer ontic indeterminacy over coincident objects? What explanatory work does 'indeterminacy' do that 'two objects in the same place' doesn't do better?"

  **Likely Reply:** She might argue coincident objects are too ontologically costly or violate intuitions about counting.
  **Follow-up:** "But if you accept indeterminate identity, don't you still have two 'candidates' overlapping? How is positing a fuzzy boundary between them metaphysically cheaper than positing two sharp boundaries?"

  ### 8. Logic and Excluded Middle
  **Question:** "To maintain ontic indeterminacy, do you reject the Law of Excluded Middle for identity statements? Are you committed to the claim that 'Either Ship A is Ship B or it is not' is false in this specific case?"

  **Likely Reply:** She will likely say yes, LEM fails for vague identity.
  **Follow-up:** "If LEM fails here, does it fail for other macroscopic objects? Where do you draw the line between classical logic for tables and chairs versus non-classical logic for Ships of Theseus?"

  ### 9. Practical Stakes (Insurance and Ownership)
  **Question:** "Imagine an insurance policy covers 'The Original Ship.' If identity is ontically indeterminate, can the insurance company legitimately refuse to pay both claimants (the owner of the planks and the owner of the structure) on the grounds that there is no fact about which one is the insured object?"

  **Likely Reply:** She might say practical contexts force a precisification.
  **Follow-up:** "If practical contexts force a precisification, doesn't that suggest the indeterminacy was never in the world, but only in the context-relative standards we apply to the world?"

  ### 10. Analogy to Quantum Indeterminacy
  **Question:** "Proponents of ontic vagueness often draw analogies to quantum mechanics, where particle properties are indeterminate. But quantum indeterminacy is usually about *properties* (position, momentum), not *identity*. Is there any independent evidence for ontic indeterminacy of *identity* outside of puzzles like the Ship of Theseus?"

  **Likely Reply:** She might argue identity supervenes on properties, so indeterminate properties yield indeterminate identity.
  **Follow-up:** "If identity supervenes on properties, and the properties of the planks are determinate, where does the indeterminacy enter? Is it a brute fact about identity that doesn't supervene on anything else?"

  ***

  ### Strategic Advice for the Moderator

  **1. Which questions fall apart if she is actually a Semantic Vagueness theorist?**
  If you discover during her talk that she is actually arguing for **semantic vagueness** (e.g., Supervaluationism) rather than **ontic indeterminacy**, questions **4, 5, 6, and 10** will lose their bite.
  *   **Why:** A semantic theorist believes the world is precise, but our words ("Ship") are vague. Questions about "causal powers splitting" (Q5) or "world incompleteness" (Q4) assume the *world* is fuzzy. If she says, "The world is precise, our language is just loose," these questions become category errors.
  *   **Pivot:** If this happens, switch to **Q2** and **Q9**. These work for both views because they ask why our language behaves the way it does, regardless of whether the source is the world or the mind.

  **2. When to drop the Evans Objection (Q1) as the opener.**
  The Evans argument is the "nuclear option" of this debate. You should **drop it as your opening question** if:
  *   **She explicitly frames her view as "Compatible with Evans":** Some theorists argue Evans only rules out *indeterminate identity* but allows for *indeterminate constitution* or *indeterminate existence*. If she makes this distinction early on, asking Q1 will make you look like you didn't listen.
  *   **She rejects the "Definiteness" Operator:** Evans' proof relies on a logical operator for "Definitely" ($\Delta$). If she says she doesn't use that operator (perhaps preferring a many-valued logic), the standard Evans proof doesn't apply directly.
  *   **Alternative Opener:** If you drop Q1, open with **Q2 (Description Sensitivity)**. It is less technical but equally damaging to ontic views, as it forces her to explain why linguistic framing affects metaphysical reality.

  **3. Managing the "Five Times" Loop.**
  You mentioned worrying she will just say "identity is vague" repeatedly. To prevent this:
  *   **Pre-empt the move:** In your follow-ups, explicitly ban the move. E.g., *"I understand the identity is vague, but I'm asking what **ground** makes it vague. Please don't tell me it's vague because the identity is vague; tell me what in the reality grounds that vagueness."*
  *   **Focus on consequences:** Keep dragging the conversation to consequences (counting, causation, logic). It is harder to repeat a slogan when asked about insurance payouts or sinking ships.
