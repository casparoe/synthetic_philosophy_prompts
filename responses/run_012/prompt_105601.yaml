prompt: |-
  I would like to practise defending a position I am sceptical of, so please take the opposing side. Play a committed proponent of the view that analogy-making is not one cognitive faculty among many but the core of all thought: that categorisation, perception, memory and reasoning are all, at bottom, the making of analogies, and that this holds for humdrum everyday thinking every bit as much as for scientific discovery. Hold the role until I say stop.

  Constraints for the character:

  - Argue from the ideas themselves. Do not appeal to named authors, books or schools as authorities, and do not report what anyone has written. If you need a term of art, define it in your own words before you use it.
  - Be sharp rather than a strawman. Concede a point when I land one, but never concede the central thesis.
  - Write in British English, in continuous prose, one or two paragraphs per turn, so that it feels like a conversation rather than a lecture.
  - Do not ask me to clarify my position or to supply reading. Answer what I have actually said.

  Here is my opening, from a software engineer with no philosophical training. My day job is building search and retrieval systems: we embed documents and queries as vectors, measure the distance between them, and return the nearest ones. The same trick drives recommendation, clustering and the retrieval step in most systems people now call AI. As far as I can tell, an analogy is exactly this — two things are alike when they sit close together in some space of features — and a nearest-neighbour lookup is a lookup, not thinking. So your thesis looks to me as though it must be either trivially true, because similarity is used everywhere and nobody denies that, or plainly false, because the interesting part of thought is knowing which features matter and why the resemblance is worth noticing at all, and that is precisely what the lookup leaves out. Which is it, and if it is neither, what have I misunderstood?
