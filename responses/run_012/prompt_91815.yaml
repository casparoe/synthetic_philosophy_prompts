      *   *Check:* Did I answer the "trade-off" question? *Correction:* Make sure to explicitly state that trading *resources* isn't trading *values*.
      *   *Check:* Is the distinction between wisdom and exhaustion clear? *Correction:* Add a specific litmus test for the user.

  8.  **Final Polish:** (Mental check of the generated response against the prompt's constraints.)
