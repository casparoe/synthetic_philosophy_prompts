answer: |-
  **Internal Mapping: Rule Space & Vulnerabilities**

  *   **Credence Floors:** Ignore $P < \epsilon$. *Vulnerability:* Applicants inflate probabilities to just above $\epsilon$; doesn't handle "unknown unknowns."
  *   **Payoff Caps:** Ignore $V > K$. *Vulnerability:* Applicants disaggregate outcomes to bypass caps (e.g., "1 million people saved" vs "humanity saved").
  *   **Model Uncertainty/Robustness:** Require consensus across models. *Vulnerability:* Applicants claim unique insight invalidates standard models; slows decision-making.
  *   **Lexicographic Priorities:** Safety > Impact. *Vulnerability:* Paralyzes all risky research; difficult to define "safety" non-arbitrarily.
  *   **Epistemic Grounding:** Probabilities must rely on reference classes, not theory. *Vulnerability:* Penalizes genuine innovation where no reference class exists; requires judgment on what counts as "grounded."
  *   **Portfolio/Diminishing Returns:** Evaluate based on marginal utility across all grants. *Vulnerability:* Hard to apply to single-cycle decisions; doesn't solve the asymmetry of existential risk.

  *Selection:* A hybrid of **Epistemic Grounding** and **Symmetric Truncation**. This addresses the Pascal's Mugging (Proposal 2) and the Mirror Catastrophe (Proposal 3) by treating unsupported tails identically, while allowing empirical projects (Proposal 1) to dominate.

  ***

  **MEMORANDUM**

  **TO:** Grant Committee
  **FROM:** [Your Name], Policy Advisor
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Cycle 4 Finalists and Decision Rule Revision

  **Executive Summary**

  We face a decision between robust impact, speculative moonshots, and ambiguous risk. My recommendation is to fund Proposal 1 (Service Delivery) and reject Proposals 2 and 3. This disposition maximizes reliable impact while protecting the foundation from epistemic traps. To ensure consistency in future cycles, I propose adopting a new **Epistemic Grounding Policy**. This rule treats extreme positive and negative tails symmetrically, resolving the tension between our expected-value mandate and the need for decision hygiene.

  **Dispositions**

  1.  **Proposal 1 (Service Delivery): Fund.**
      *   **Reasoning:** This proposal offers 10,000 expected life-years with high confidence and empirical anchoring. It satisfies our charter's demand for impact without relying on speculative probability estimates. It is the robust choice.
      *   **For Advocates of Proposal 2:** This grant guarantees tangible good now, preserving capital for future high-risk opportunities that meet higher evidentiary standards.
      *   **For Advocates of Proposal 3:** This grant carries negligible downside risk, satisfying precautionary concerns.

  2.  **Proposal 2 (Speculative Research): Reject.**
      *   **Reasoning:** The expected value relies entirely on a probability estimate ($10^{-12}$) derived from a theoretical chain without empirical reference class. Under the new Epistemic Grounding Policy, unanchored probabilities below a reasonable threshold are discounted to zero for decision purposes. Without this tail, the expected value collapses below Proposal 1.
      *   **For Advocates of Proposal 2:** We are not denying the possibility of the outcome, but acknowledging that our inability to verify the probability makes it action-inert. We cannot bet the budget on numbers we cannot check.

  3.  **Proposal 3 (Risky Research): Reject.**
      *   **Reasoning:** This proposal presents a symmetry problem. If we accept the speculative probability of gain in Proposal 2, we must accept the speculative probability of loss here. If we reject the gain due to lack of grounding, we must similarly discount the loss. Even discounting the catastrophic tail, the base expected benefit ("a few thousand") is inferior to Proposal 1 (10,000). Furthermore, given the severe uncertainty surrounding the risk model, ambiguity aversion dictates we prefer the robust option (Proposal 1) over the ambiguous one.
      *   **For Advocates of Proposal 3:** We are not ignoring the risk; we are acknowledging that the risk model is too speculative to quantify. In the face of unquantifiable existential uncertainty, the default is caution.

  **Proposed Policy Rule**

  To prevent future cycles from stalling on similar dilemmas, I recommend adopting the following wording for our Grantmaking Guidelines, under the section *Evaluation Criteria*:

  > **Epistemic Grounding and Symmetric Truncation**
  > In calculating expected impact, probability estimates must be grounded in empirical reference classes or validated models. Purely theoretical probability estimates that exceed six orders of magnitude from established baselines (either positive or negative) will be treated as zero for the purpose of funding decisions.
  >
  > **Handling Negative Cases:** This rule applies symmetrically to potential harms. Speculative probabilities of catastrophic loss that lack empirical anchoring are discounted equally to speculative probabilities of gain. However, proposals exhibiting severe model uncertainty regarding potential harms may be rejected on grounds of ambiguity aversion, prioritizing robust impact over uncertain maximal impact.

  **Addressing the Objection of Arbitrariness**

  The strongest objection to this rule is that any threshold (e.g., "six orders of magnitude") is arbitrary. A true expected-value maximizer will argue that if the payoff is large enough ($10^{20}$), it should defeat any fixed threshold. If the math says fund it, overriding the math seems like cowardice.

  The response is not mathematical but pragmatic. We are not ideal agents; we are boundedly rational humans managing finite resources. A probability estimate of $10^{-12}$ derived from a single chain of reasoning is not a number; it is a placeholder for ignorance. In decision theory, when the uncertainty about the probability estimate itself dwarfs the estimate, the expected value calculation becomes noise. The threshold is not a claim about truth; it is a hygiene factor to prevent our decision-making process from being hijacked by unverifyable claims. It is arbitrary only in the sense that a speed limit is arbitrary; it is set for safety, not because physics changes at 65 mph.

  **The Cost of This Rule**

  We must be plain about what this costs us. If the proponents of Proposal 2 are right—if there truly is a lever that can save $10^{20}$ lives and we had the chance to pull it—this rule ensures we will miss it. We are consciously choosing to ignore "lottery tickets" that look like Pascal's Muggings. We are trading the possibility of infinite impact for the certainty of finite integrity. We accept that we may be the generation that passed up the moonshot because we couldn't verify the fuel gauge. This is the price of remaining a functioning institution rather than a gambling house.

  **The Case for the Losing Side**

  For those who believe we should fund Proposal 2, the argument is this: Morality is additive. A life-year saved is a life-year saved, regardless of when or how unlikely it seems. If the math says the speculative research saves more lives in expectation, refusing to fund it is effectively choosing to let those lives die. By imposing arbitrary floors, we are privileging our own comfort and confidence over the actual welfare of beings who might exist. If we claim to maximize impact, we must follow the numbers even when they scare us. To do otherwise is to abandon our charter for the sake of reputational safety.
