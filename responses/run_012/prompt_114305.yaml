      *   **Core Idea:** Challenging the monolithic view of "The Tragedy of the Commons" and "Public Goods." Arguing that these aren't single phenomena but families of situations dependent on communication, rule-making, and *choices* about excludability (fences/gates) rather than inherent physical properties.
      *   **Specific Needs:**
          *   Sharpen the research question (make it determinate).
