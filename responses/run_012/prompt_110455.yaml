prompt: |-
  My old roomate (philosophy minor, reads a lot of pop-apologetics) gave me his one-paragraph summary of the argument from divine hiddenness -- I think the main version is by a guy named Schellenberg, correct me if I've got that wrong -- and I want to know how much of it to trust. Here's what he says: it's really just the problem of evil wearing a hat, only instead of "a good God wouldn't allow so much suffering" it says "a good God wouldn't let people be unsure whether he exists," so it's the same argument with a weaker premise. He says the premise is that God is *required* to make his existence so obvious that nobody could doubt it, because a loving parent doesn't hide from their kids. And he says the standard theist reply is that a relationship with God has to be entered into freely, so God stays hidden to protect our freedom -- and that reply basically kills the argument, since anyone who claims they can't believe is really just refusing to. Then he wraps up: the whole thing only has teeth against a God who wants to be believed in, so it slides right off deism and off any view where God doesn't care what we think.

  How much of that is fair? Go claim by claim and tell me what someone who actually works on this argument would accept, what they'd wince at, and what's just wrong -- and whether his closing point about deism follows from the parts that are right. I'm most curious whether the freedom reply answers the argument as its defenders state it or only a stronger version of it, and whether it really does collapse into the problem of evil. My gut says the argument is sharper than he's making it out to be, but I couldn't tell you where.
