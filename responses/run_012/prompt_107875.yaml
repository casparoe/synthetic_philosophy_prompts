  2.  **Deconstruct the Dutch Book Argument (DBA):**
      *   *Standard DBA:* If credences $P$ violate probability axioms (e.g., $P(A) + P(\neg A) \neq 1$), there exists a set of bets acceptable at those odds that guarantee a loss.
      *   *Diachronic DBA:* If updating rule is not conditionalization, there exists a sequence of bets acceptable at $t_0$ and $t_1$ that guarantee a loss.
      *   *Normative Claim:* Violating axioms is irrational because it makes you vulnerable to sure loss.
      *   *Idealizations:* Agent accepts bets at exactly their credence (fair odds), linear utility of money, no transaction costs, simultaneous settlement, bets are binding.

  3.  **Deconstruct the Trading Vocabulary:**
      *   *State Prices:* Price of a security paying 1 in state $s$, 0 otherwise. Sum of state prices = discount factor (usually 1 if risk-neutral/no interest).
      *   *Arbitrage:* Risk-free profit with zero net investment.
      *   *No-Arbitrage Bounds:* Prices must lie within bounds to prevent arbitrage.
      *   *Bid-Ask Spread:* Cost of immediacy/liquidity.
      *   *Inventory Risk:* Risk held due to position size.
      *   *Adverse Selection:* Trading against informed counterparties.
      *   *Proper Scoring Rules:* Incentivizing truthful reporting of probabilities.
      *   *Kelly Sizing:* Optimal bet sizing based on edge.
      *   *Transaction Costs/Counterparty Risk:* Frictions.

  4.  **Drafting the Translation (Mental Sandbox):**
      *   *Credences* $\rightarrow$ *Mid-market prices* or *State Prices*. But a market maker doesn't bet *at* the mid; they bet at bid or ask. The DBA assumes you take both sides at the same price. This is the first friction.
      *   *Probability Axioms* $\rightarrow$ *No-Arbitrage Conditions*. If state prices don't sum to 1 (discounted), there's arbitrage.
      *   *Sure Loss* $\rightarrow$ *Static Arbitrage Loss*.
      *   *Rationality* $\rightarrow$ *Pricing Consistency* or *Absence of Free Lunch*.
      *   *Diachronic* $\rightarrow$ *Dynamic Hedging/Rebalancing*. If you update prices inconsistently with new info relative to prior pricing, you create a dynamic arbitrage opportunity.
      *   *Normative Force:* In trading, "irrational" means "losing money unnecessarily." But MM *expect* to lose on some trades (adverse selection) to make money on spread. The DBA assumes *every* bet is viewed as "fair" (EV=0). In trading, bids are EV>0 (usually) or EV<0 (if hedging).
      *   *Key Distinction:* DBA assumes you *must* bet at your credence. MM *chooses* quotes. If MM quotes inconsistent prices, arb bots eat them. Is the MM irrational? Or just providing liquidity at a cost?

  5.  **Addressing the "Residue":**
      *   *Clean Translation:* Probability axioms $\approx$ No-arbitrage conditions on state prices. Sure loss $\approx$ Arbitrage loss.
      *   *Distortion:* "Fair odds" vs. "Bid/Ask". DBA assumes one price. MM has two.
