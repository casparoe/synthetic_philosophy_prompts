      *   Avoid jargon from trading unless explained/used correctly.
      *   Ensure the "Residue Report" is woven into the narrative, not a separate list.

  8.  **Self-Correction/Check during drafting:**
      *   *Constraint Check:* No bullet points. No bold text. No headings.
      *   *Content Check:* Did I cover diachronic? Yes. Did I cover normative force? Yes. Did I cover reverse direction? Yes.
      *   *Faithfulness:* Am I smuggling trading assumptions? I need to be careful. When translating DBA, I must state the DBA *as if* it were a trading rule, then critique it.
      *   *Key Insight:* The DBA assumes the agent *is* the market. The MM knows they are *in* the market. The DBA agent accepts bets at $p$ and $1-p$. The MM quotes $bid < p < ask$. The DBA fails if $ask - bid > \text{inconsistency}$.

  9.  **Drafting - Section by Section (Mental):**
      *   *Intro:* Validate the disagreement. It's a category error between idealized agency and market participation.
      *   *Synchronic Translation:* Your credences are state prices. Axioms are no-arbitrage conditions. If state prices for exhaustive states don't sum to the discount factor, a replicating portfolio exists that costs less than the payout. The bookie is an arbitrageur.
      *   *Diachronic Translation:* Updating is re-marking the book. Conditionalization is the unique updating rule that prevents dynamic arbitrage strategies where the arburageur trades against you at $t_0$ and $t_1$ to lock in profit regardless of state.
      *   *Normative Force:* Here is the rub. In philosophy, vulnerability to loss = irrationality. In trading, vulnerability to loss = inventory risk or spread cost. If your spread covers the arbitrage, you aren't irrational, you're just expensive. The DBA assumes zero spread.
      *   *Idealizations:* Linear utility (Kelly says log utility), no counterparty risk (traders know better), simultaneous settlement (trading is sequential).
      *   *Reverse:* Trading concepts like limit orders (credence is a curve), adverse selection (bookie might be informed), and default risk. Philosophy ignores these.
      *   *Conclusion:* The philosophical claim holds for a frictionless forced market maker. The trader is not forced, has frictions. The defect is in the philosophical model's applicability, not the logic itself.

  10. **Final Polish:** Ensure smooth transitions. Check constraints again (no bold, no bullets). Make sure the voice sounds like an expert peer writing an email.

