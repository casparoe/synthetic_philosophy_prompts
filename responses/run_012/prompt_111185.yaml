  ### How to Use This Tree

  This tree is designed to sort your intuitions about the Doomsday Argument without requiring knowledge of philosophical jargon. Start at the top and answer each question honestly based on how you understand the bare argument: *you are a random human among all humans who will ever live, so being early suggests the total number won't be huge.*

  Follow the path dictated by your answers until you reach a leaf (a final box). The leaf names the philosophical position that matches your view. If you reach a leaf labeled "Unnamed," it indicates a logical combination that is rarely or never defended; a note explains whether this space appears incoherent, unattractive, or merely unexplored.

  ***

  ### The Decision Tree

  **1. Which group do you count yourself in for this calculation?**
  *   **A.** No coherent group (you cannot be treated as a random sample of anything). → **Go to Leaf 1**
  *   **B.** All biological humans who will ever live. → **Go to Question 2**
  *   **C.** All conscious observers of any kind (humans, aliens, AI, etc.). → **Go to Question 2**

  **2. Does the mere fact that you exist make a world with many observers more likely than a world with few?**
  *   **A.** Yes (existence favors crowded worlds). → **Go to Leaf 2**
  *   **B.** No (existence is neutral; only your rank matters). → **Go to Question 3**

  **3. Is it possible that the total number of future observers is infinite?**
  *   **A.** No (the total must be finite). → **Go to Question 4**
  *   **B.** Yes, and this breaks the probability math. → **Go to Leaf 3**
  *   **C.** Yes, but the math still works somehow. → **Go to Leaf 4**

  **4. Can facts about your specific location in history (like your birth rank) serve as evidence about the total length of history?**
  *   **A.** No (your rank tells you nothing about the total). → **Go to Leaf 5**
  *   **B.** Yes (your rank is relevant evidence). → **Go to Question 5**

  **5. Does knowing the specific calendar year you were born (when most humans live) neutralize the birth rank evidence?**
  *   **A.** Yes (the current population cluster blocks the argument). → **Go to Leaf 6**
  *   **B.** No (the rank still matters despite the date). → **Go to Question 6**

  **6. Does your initial guess about the future determine the final result more than the argument does?**
  *   **A.** Yes (the argument cannot override strong prior beliefs). → **Go to Leaf 7**
  *   **B.** No (the argument forces an update regardless of priors). → **Go to Question 7**

  **7. What kind of conclusion does the argument deliver?**
  *   **A.** A specific prediction that the end is near. → **Go to Leaf 8**
