answer: |-
  In a mid-sized housing cooperative, twelve residents face a persistent mold issue in the shared storage basement caused by a faulty ventilation system the management company refuses to fix. In the first version, the residents formally constitute themselves as the Tenants' Party, adopting a platform that demands full replacement of the system and no waivers of liability, operating under the implicit understanding that public dissent weakens their bargaining position. When management finally offers a settlement that covers the repairs but requires the co-op to waive future claims for similar issues, three residents privately believe the trade is worth taking to end the health hazard immediately. However, because the Party's existence depends on maintaining a unified front to project strength, raising this dissent is felt as an act of disloyalty that would fracture the group's leverage. The leadership rejects the offer to preserve the Party's cohesion, the three dissenters stay silent to avoid undermining the cause, the mold worsens over another winter, and the group remains locked in a conflict that no longer serves their actual health, bound by the need to protect the organization they created to save themselves.

  In the second version, the same twelve residents face the same mold issue and the same settlement offer from management, but they organize merely as a loose association of neighbors without a charter or leadership structure. They gather in the common room to discuss the offer, and when the three residents express that the health risk outweighs the principle of the waiver, their voices carry equal weight to those who wish to hold out for more money. There is no mechanism to enforce a single voice, so the group weighs the specific facts of the ventilation cost against the immediate health risk without reference to a broader platform or future leverage. They vote to accept the repair deal, the mold is removed within the month, and while some disagreement remains about the principle, the group dissolves back into ordinary neighborliness without any member having been required to suppress their own judgment for the sake of the collective identity.

  Weil's view predicts that the first version fails not because the residents are corrupt, but because the party form substitutes the preservation of the group for the pursuit of the true good. The single feature doing the work here is the requirement of collective unity, which transforms a difference of opinion into an act of disloyalty and forces the group to prioritize its own momentum over the specific reality of the mold. If that feature is removed, as in the second version, the pressure to conform vanishes, allowing individual attention to the specific facts to guide the decision rather than the inertia of the organization. Someone who believes parties are indispensable would attack this by arguing that without the unified front of the first version, the management company would have exploited the division among the neighbors to offer nothing at all, claiming that loose associations lack the coercive power to force a corporation to negotiate seriously. They would argue that the discipline Weil despises is precisely the tool required to amplify the voice of the powerless against entrenched interests, and that the risk of collective error is a necessary price for the capacity to act effectively in a complex political world where isolated individuals are easily ignored.
