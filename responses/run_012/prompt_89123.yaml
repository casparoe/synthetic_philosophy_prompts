  To preserve (3) and (8), you should reject step (5). Step (5) claims that if an absence can cause an outcome, *any* absence whose presence was necessary is a cause. This principle drives the proliferation problem that threatens to make singling out the gardener arbitrary. By rejecting (5), you deny that all necessary absences are causes, thereby blocking the move from the gardener's omission to the absences of rain or neighborly aid.

  Step (5) looked compelling because it relies on a principle of metaphysical parity. Under a standard counterfactual theory of causation (suggested in step 2), the gardener's failure and the rain's absence stand in identical logical relations to the plant's death: had either been present, the plant would have survived. It seems unjustified to treat one necessary condition as a cause and the other as a mere background condition if the underlying metaphysical structure is identical. This appeals to a desire for ontological uniformity.

  However, rejecting (5) allows you to maintain that the gardener's omission caused the death (3) without accepting that the absence of rain or the neighbor's action did. This avoids the proliferation of causes, thereby satisfying the concern in (8) that singling out the gardener would be arbitrary. If not all absences are causes, singling out the gardener is not arbitrary; it is principled. Step (8) remains true as a conditional warning, but its antecedent is false, so the arbitrariness never materializes.

  Rejecting (5) forces you to adopt a contextualist or normative theory of causation. You must say that causation by omission is not merely a metaphysical relation but depends on norms, expectations, or duties. Regarding the other cases (rain, neighbor, fungus), you must deny they are causes despite their counterfactual necessity. You must argue that the gardener had a specific duty to water the plant, whereas the rain had no such duty, and the neighbor had no specific obligation. The "absence" of the rain is merely a background condition, not a cause, because it violates no normative expectation.

  The cost of this move is admitting that causation is not purely objective. You concede that causal judgments depend on pragmatic or moral contexts, not just physical history. This might seem costly if you seek a purely scientific definition of causation, but it saves the ordinary judgments you wish to keep. You preserve the intuition that the gardener is responsible (3) while avoiding the absurdity that everything absent is a cause. Thus, the arbitrariness worry in (8) is neutralized because the proliferation it warns against never occurs.
