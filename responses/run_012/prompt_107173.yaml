  6.  **Addressing the "Actual vs. Potential" Hurdle:**
      *   The prompt specifically mentions they concede the arithmetic but keep the picture of infinity as an *unfinished process*.
      *   *Activity Fix:* In Stage 1, force them to complete the move *simultaneously*. No "first move guest 1, then guest 2." Everyone stands and swaps cards *on a count of three*. This enforces the "completed state" view.
