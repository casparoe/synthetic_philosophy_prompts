  10. **Refining the "Second Bus" Encoding:**
      *   Infinite strings of 0/1 is standard.
      *   To make it physical: Use a deck of "Passenger Profiles." Each profile is a strip of paper with 12 bits visible (since there are 12 people).
      *   Wait, if there are 12 people, we can only show 12 bits.
      *   *Crucial Insight:* The diagonal argument works even on finite approximations *if* we define the rule. But to prove uncountability, we need the *concept* of the infinite tail.
      *   *Compromise:* We treat the 12 slots as the "known prefix." The rule defines the rest. The "Ghost" is constructed by flipping the 12 visible diagonal bits. The Auditor asks: "Is this Ghost in the list?" The Concierge says "Yes, Row 5." Auditor checks Row 5, Bit 5. It differs.
      *   *Wait, that's finite.* To make it infinite, we need to acknowledge the tail.
      *   *Solution:* The "Passenger" is a *rule* (e.g., "All 1s", "Alternating", "Prime positions are 1"). The Concierge lists 10 rules. The Group constructs a new rule: "Flip the $n$-th bit of the $n$-th rule."
      *   *Physical:* Cards with Rules written on them. A "Diagonal Tool" (a slider that highlights $n,n$).

  11. **Addressing the Leader's Skepticism ("Bookkeeping vs. Discovery"):**
      *   Acknowledge this in the debrief. The activity *is* bookkeeping, but the *contradiction* arises from the bookkeeping rules themselves.
      *   The "Discovery" is the realization that the rules of the game (logic) forbid the Concierge from winning.

  12. **Predictable Failures:**
      *   *Failure 1:* "You can't move infinitely many people." -> Counter: We aren't moving them in time; we are defining a new state.
      *   *Failure 2:* "The diagonal guest is artificial." -> Counter: They are a valid passenger by the game's definition.
      *   *Failure 3:* Auditor blocks Stage 1 forever. -> Counter: Change the win condition from "Process completes" to "Mapping is consistent."

  13. **Final Polish:**
      *   Ensure the "Auditor" has a specific script/checklist.
      *   Make sure the "Diagonal" is physical (stickers, tokens).
