      *Self-Correction on Accountability:* If the Council fails, the Class gets homework. This makes the Class pressure the Council, but the Council cannot be removed. This creates the tension of "Accountability without Elections." The Council feels the pressure but lacks the exit valve.

      *Self-Correction on "The Break":* Make sure the transition is dramatic. Stop the music (if any), clear the board, bring out the Hat.

      *Final check on constraints:*
      *   100 mins.
      *   18 students.
      *   No pre-reading.
