answer: |-
  Core mechanic: The class transitions from a self-selected volunteer committee to a randomly drawn council whose members cannot be removed, forcing the constituency to accept their proposal or suffer a collective penalty.

  ### Materials
  *   **Whiteboard:** Divided into "Project Proposals," "Budget Rules," and "Vote Tally."
  *   **Hat:** Containing 18 slips of paper, each with a student's name.
  *   **Decision Packets:** 5 identical sheets of paper containing the budget constraints (see Rules).
  *   **Timer:** Visible to all.
  *   **Stakes:** A tangible class benefit (e.g., "If the final proposal passes, no homework tonight. If it fails, everyone writes a 500-word reflection due tomorrow.").

  ### Roles and Rules
  *   **The Constituency:** All 18 students. They hold the ultimate veto power via a majority vote.
  *   **The Council:** A subgroup of 5 students who deliberate and draft the budget allocation.
  *   **The Facilitator:** You. You enforce time and rules but do not participate in deliberation.
  *   **Budget Task:** Allocate 100 points across 4 Projects (A, B, C, D).
  *   **Hidden Constraints (on Decision Packet):**
      1.  Total must equal exactly 100.
      2.  Project C must receive at least 20 points.
      3.  If Project D receives >10 points, Project A must receive 0.
      4.  Unanimous agreement required within the Council to submit a proposal.

  ### Sequence and Timing (100 Minutes)

  **1. Introduction and Stakes (5 Minutes)**
  *   Announce the task: Allocate 100 points to 4 Projects.
  *   Announce the stakes: If the final class vote passes, no homework. If it fails, everyone writes a reflection paper.
  *   Write the 4 Projects and Budget Rules on the board.

  **2. Phase 1: The Volunteer Council (20 Minutes)**
  *   **Selection:** Ask for 5 volunteers who feel "qualified" or "interested" to form the first Council. They move chairs to the center.
  *   **Deliberation:** They have 10 minutes to draft a proposal. The Constituency may shout out advice or criticism at any time.
  *   **Vote:** The Council presents. The Constituency votes Yes/No.
  *   **Accountability Rule:** If the vote is No, the Council is dissolved immediately. You ask for 5 new volunteers. (Run this loop once; if they fail twice, move to Phase 2 regardless).
  *   **Transition:** Regardless of success, announce that "To ensure fairness, the next Council will be selected differently."

  **3. Phase 2: The Drawn Council (45 Minutes)**
  *   **The Break (5 Minutes):** Collect all names in the hat. Shake it. Draw 5 names. These students *must* serve. They move to the center. The previous Council members return to the Constituency.
  *   **Deliberation Rules:**
      *   The Council has 25 minutes to reach unanimity.
      *   **Silence Rule:** The Constituency cannot speak. They may only pass written notes to Council members.
      *   **Removal Rule:** If the Constituency dislikes the progress, they cannot vote the Council out. They must wait for the final vote.
  *   **The Rotation Event (at Minute 25 of Phase 2):**
      *   Stop the clock. Announce: "Terms are expiring."
      *   Roll a die to select 2 current Council members to leave (e.g., roll 1-2 = seats 1&2 leave).
      *   Draw 2 new names from the hat to replace them.
      *   **Socialization Constraint:** The new members receive the Decision Packet but receive *no oral briefing* from the outgoing members. They have 5 minutes to read before deliberation resumes.
  *   **Finalization:** The Council has 10 remaining minutes to finalize the numbers.

  **4. Final Vote and Outcome (10 Minutes)**
  *   Council presents the final allocation.
  *   Constituency votes Yes/No.
  *   Enforce the stakes (Homework or No Homework) based on the result.

  **5. Debrief (20 Minutes)**
  *   Reveal the terms "Sortition" and "Lottocracy."
  *   Map the experience to the theoretical pressure points.

  ### Payoff Scheme and Decision Rule
  *   **Council Success:** Defined by reaching unanimity internally.
  *   **Class Success:** Defined by a majority Yes vote from the Constituency.
  *   **Penalty:** If Class Success is not achieved, the collective penalty (homework) is triggered. The Council members cannot be punished individually or removed; they share the collective fate.

  ### Debrief Notes
  **Mapping Moments to Ideas:**
  *   **The Break:** Ask the Phase 2 Council members how it felt to be chosen by the hat compared to Phase 1 volunteers. Target the feeling of "unearned" authority and the removal of campaigning.
  *   **Rep vs. Capacity:** Ask the Constituency if Phase 1 felt more competent but less fair. Ask Phase 2 Council if they felt pressured by the math rules (capacity) versus the note-passing (representation).
  *   **Accountability:** Highlight that in Phase 2, the Constituency could not fire the Council, only punish themselves (the homework). This forces the Constituency to trust the process rather than the persons.
  *   **Rotation:** Ask the new members (from the Rotation Event) how hard it was to join mid-stream. Ask the remaining members how hard it was to explain the norms without slowing down.

  **Settled vs. Contested:**
  *   **Settled:** Sortition breaks the link between wealth/status and office. It changes incentives from "getting re-elected" to "doing the job." It increases descriptive representation (the body looks more like the population).
  *   **Contested:**
      *   *Binding vs. Advisory:* Should a lottocratic body make laws directly (like this game) or only advise elected officials? (In this game, they proposed, you voted—hybrid).
      *   *Replacement vs. Supplement:* Should this replace elections entirely or exist alongside them?
      *   *Weight of Representativeness:* Is statistical mirroring more important than demonstrated expertise? (Phase 1 prioritized expertise/interest; Phase 2 prioritized chance).
      *   *Scale:* Can this work for 18 people vs. 18 million?

  ### Predictable Failures and Fixes
  *   **Failure:** Phase 2 Council deadlocks due to the unanimity rule.
      *   **Fix:** If 5 minutes remain with no agreement, impose a majority vote within the Council to force a proposal. Explain that real bodies often have fallback voting rules.
  *   **Failure:** Constituency revolts during Phase 2 (shouting despite silence rule).
      *   **Fix:** Pause the game. Remind them that the "Silence Rule" simulates the separation between the assembly and the public. If they break it, the "Accountability" mechanic breaks.
  *   **Failure:** Rotation causes anger (students feel pulled off mid-thought).
      *   **Fix:** Acknowledge the friction. This *is* the point. Institutional memory is lost when turnover is high. Use this to discuss term limits.
  *   **Failure:** The Budget Puzzle is too easy or too hard.
      *   **Fix:** If too easy, add a constraint mid-game (e.g., "Project B cost just doubled"). If too hard, hint that "The Rules sheet has the answer."

  ### Honest Note on Limitations
  This activity cannot reproduce the **time and stakes of real political power**. In 45 minutes, students cannot develop the deep expertise or relationships that real citizens' assemblies build over weeks. Additionally, the "homework" penalty is trivial compared to real policy outcomes (taxes, war, rights). You must supply the context that real sortition relies on paid leave, expert testimony, and facilitated deliberation to function, none of which are fully present here. Finally, the activity simulates a *single* decision; it cannot reproduce the stability of a lottocratic system over decades.
