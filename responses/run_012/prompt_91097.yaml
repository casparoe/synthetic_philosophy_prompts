      *Honest Note:* The activity cannot reproduce the *political power* of a real assembly (binding laws vs. advisory). It also compresses time (weeks of deliberation into 45 mins).

      *Refining the "Stakes":* Since I can't actually grade them harshly based on a game, I need a symbolic stake. "If the vote fails, everyone writes a 2-page reflection paper due tomorrow. If it passes, no homework." This is a real incentive.

      *Refining the "Budget Puzzle":* Keep it simple. "Project A and B are mutually exclusive." "Project C requires matching funds from D." Something they have to read carefully.

      *Refining the "Rotation":* To save time, maybe just add 2 new members to make it 7, or swap 2 out. Swapping 2 out is better for "socialization." Let's swap 2 out.

      *Wait, one more thing:* "Descriptive representation versus deliberative capacity."
