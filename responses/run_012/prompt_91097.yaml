prompt: |-
  I was recently selected by lot to serve on a citizens' assembly on a local transit issue, and the experience has convinced me that sortition, rule by lot, is one of those ideas that cannot be taught well from the outside. I teach a 100-minute seminar in democratic theory to 18 upper-level undergraduates, and I want to use one session to make them feel the force of lottocracy rather than simply hear the arguments for it. Design a runnable in-class activity for that session.

  The activity should be a game or structured deliberation in which the rules, incentives, and roles do the work. I have a room with movable chairs, a whiteboard, a hat, and a random number generator; no real money. Participants should not need to have read anything in advance. By the end they should have felt, in their own choices, the pull of the idea that a body selected by lot can be legitimate, and the specific costs of that legitimacy. They should not hear the words sortition or lottocracy until the debrief.

  I want the design to put pressure on three distinctions, which I name so you can target them. First, the break that the draw creates: the moment when no one can claim to have earned or been denied a seat. Second, descriptive representation versus deliberative capacity: a sample can look like the population without being able to deliberate well, and a body can deliberate well without looking like the population. Third, accountability without elections: if no one can be voted out, what replaces the threat of removal? A fourth pressure point, if it fits, is rotation: what happens when half the body is replaced by a new draw and the new members must be socialized into norms they did not make.

  Deliverable: the activity itself first. Begin with the activity, not with rationale or commentary. The first sentence should state the core mechanic. Then give materials, roles or rules, the sequence and timing, the payoff scheme or decision rule, the debrief that maps specific moments onto the idea, what will predictably go wrong the first time I run it and how to handle it, and an honest note on which feature of the idea the activity cannot reproduce and I must supply.

  In the debrief notes, separate what is settled from what is genuinely contested among people who know the topic. For example, it is not contested that sortition has been used to select political bodies and that it changes incentives; it is contested whether lottocratic bodies should be advisory or binding, whether they should replace elections or supplement them, and how much weight to give to statistical representativeness versus deliberation. Do not present a contested view as the consensus.

  No bibliography, no citations, no reading list. Write for a facilitator who will run this once, with 18 students, in 100 minutes.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Goal:** Design a 100-minute in-class activity for 18 upper-level undergraduates to experience the force of sortition (rule by lot) without initially naming it.
      *   **Core Mechanic:** Must be a game or structured deliberation where rules/incentives/roles do the work.
      *   **Constraints:** No real money, movable chairs, whiteboard, hat, random number generator. No pre-reading. Do not use words "sortition" or "lottocracy" until debrief.
      *   **Pressure Points:**
          1.  The Break (the draw moment: no earning/denying).
          2.  Descriptive Representation vs. Deliberative Capacity.
          3.  Accountability without Elections.
          4.  (Optional) Rotation/Socialization.
      *   **Deliverable Structure:**
          1.  Activity itself first (Core mechanic sentence).
          2.  Materials, Roles/Rules, Sequence/Timing, Payoff/Decision Rule.
          3.  Debrief (mapping moments to ideas, settled vs. contested).
          4.  Predictable failures & fixes.
          5.  Honest note on what the activity *cannot* reproduce.
      *   **Tone:** Facilitator-focused, practical, no bibliography/citations.

  2.  **Deconstruct the Challenge:**
      *   *Time:* 100 minutes is tight for a complex simulation + debrief. Need ~60 mins for activity, ~40 mins for debrief.
      *   *Students:* 18 is a good number for splitting into groups or forming a single assembly. A single assembly of 18 mimics a mini-public better than splitting into 3 groups of 6, but splitting allows for comparison (e.g., elected vs. lot). However, the prompt asks to make them *feel* the force of lottocracy. A single body experiencing the transition from "normal" to "lot" or simply operating under lot rules might be stronger. Let's aim for a single body of 18 to maximize the "assembly" feel, or perhaps two phases (Phase 1: Election/Merit, Phase 2: Lot).
      *   *Pressure Point 1 (The Break):* Needs a moment where status is reset randomly.
      *   *Pressure Point 2 (Rep vs. Capacity):* Needs a task where specific skills matter vs. a task where diversity of perspective matters. Or, assign roles randomly that mismatch skills.
      *   *Pressure Point 3 (Accountability):* Needs a consequence for bad decisions that isn't voting them out. Maybe a collective penalty or a "trust" metric.
      *   *Pressure Point 4 (Rotation):* Hard to do in 100 mins, but maybe a mid-game reshuffle.

  3.  **Drafting the Activity Concept:**
      *   *Scenario:* Allocating a limited budget for a fictional community project. This is classic deliberative fare.
      *   *Mechanic:* The "Council of 18" must decide on 3 projects out of 6 options.
      *   *Twist:* The composition of the Council changes mid-game via lot, and their authority/ability to speak is constrained by random assignment vs. self-selection.
      *   *Better Twist:* Let's focus on the *selection* of the decision-makers themselves as the core experience.
      *   *Idea:* Divide the class into two phases.
          *   Phase 1 (20 mins): They elect leaders to make a decision. Observe campaigning, popularity, expertise claiming.
          *   Phase 2 (40 mins): A random draw selects the decision-makers. Observe the shock, the shift in legitimacy claims, the deliberation quality.
          *   Phase 3 (Debrief): Compare feelings.
      *   *Critique:* This might be too explicit too soon. The prompt says "They should not hear the words sortition or lottocracy until the debrief." Comparing Election vs. Lot explicitly might tip the hand too early.
      *   *Revised Idea:* Run one continuous simulation where the *rules of engagement* shift via a random draw event.
      *   *Scenario:* "The Resource Allocation Committee."
      *   *Setup:* 18 students. A pot of "points" (whiteboard tally). 6 Proposals on the board.
      *   *Phase 1 (The Meritocracy):* Students self-select into a "Steering Committee" of 6 based on who claims they know best. They draft a plan. The rest observe/critique.
      *   *Phase 2 (The Break):* A draw occurs. 6 new names are pulled from the hat. These 6 *must* make the final decision. The previous Steering Committee is dissolved.
      *   *Phase 3 (Deliberation):* The new 6 deliberate. The other 12 are "Constituents" who can submit written notes but not speak.
      *   *Accountability:* If the final decision is "unpopular" (vote by constituents), the whole class loses points. But the decision-makers cannot be removed.
      *   *Rotation:* Maybe swap 2 members of the 6 halfway through deliberation.

      *Refining for Pressure Points:*
      1.  *The Break:* The moment the hat is used to replace the self-selected leaders.
      2.  *Rep vs. Capacity:* The drawn members might lack skills (e.g., math skills needed for budget). Give them a complex budget sheet.
      3.  *Accountability:* The "Constituents" vote yes/no on the outcome. If No, everyone fails the task. But the Decision-Makers can't be fired.
      4.  *Rotation:* Swap 2 members out mid-deliberation to show norm disruption.

      *Timing Check:*
      *   Intro: 5 mins
      *   Phase 1 (Self-selected elite): 15 mins (Show the frustration of exclusion).
      *   The Draw (The Break): 5 mins.
      *   Phase 2 (Lot-selected body): 30 mins (Deliberation).
      *   Rotation Event: 5 mins (Swap 2 members).
      *   Final Decision & Constituent Vote: 10 mins.
      *   Debrief: 30 mins.
      *   Total: 100 mins.

      *Wait, one constraint:* "Participants should not need to have read anything in advance."
      *Constraint:* "They should not hear the words sortition or lottocracy until the debrief."
      *Constraint:* "The activity should be a game or structured deliberation in which the rules, incentives, and roles do the work."

      *Refining the "Feel":* The key is to make the *draw* feel significant. In Phase 1, let them campaign. In Phase 2, make the draw absolute.
      *Let's make the task concrete:* Distribute $100,000 (fake) among 5 competing campus clubs/orgs.
      *Roles:*
      *   Phase 1: "The Applicants" (Everyone has a hidden role card representing a club interest).
      *   Phase 1 Leaders: Self-selected "Judges".
      *   Phase 2 Leaders: Drawn "Judges".
      *   Actually, having everyone have hidden interests makes deliberation hard. Let's keep it simpler. Everyone is a "Citizen". There is a budget.

      *Revised Plan:*
      1.  **Task:** Allocate 100 points among 4 competing projects (written on board).
      2.  **Phase 1 (15 mins):** "Open Floor." Anyone can speak. Decision by majority vote. (Simulates chaotic direct democracy or populism). *Correction:* The prompt wants to highlight sortition vs election/merit. Let's start with an *Elected* committee.
      3.  **Phase 1 (20 mins):** Elect 5 representatives. They deliberate in the center. Class observes. They propose a split. Class votes Yes/No. (Simulates Representative Democracy).
      4.  **Phase 2 (40 mins):** "The Reset." Explain that due to "conflict of interest" or "term limits," a new body is needed. Use the Hat. Draw 5 names. These 5 *must* decide. No election. They deliberate. Class observes (cannot speak, can pass notes).
      5.  **Rotation (10 mins into Phase 2):** Draw 2 new names to replace 2 of the 5.
      6.  **Decision:** The 5 (now mixed tenure) must agree unanimously.
      7.  **Accountability:** If the Class votes No on the final plan, everyone gets a "F" on the participation grade (hypothetical stakes) or just public shame/loss of class points. The Decision Makers cannot be replaced again.

      *Wait, Pressure Point 2 (Rep vs Capacity):* How to simulate this?
      *   Give the Decision Makers a complex spreadsheet (budget constraints) that requires math.
      *   Give the Constituents simple preference cards.
      *   If the Draw picks people bad at math, the budget breaks. This highlights the capacity risk.
      *   If the Draw picks a demographically diverse group (visibly), but they struggle to agree, highlights deliberative cost.

      *Let's tighten the mechanics for 18 students.*
      *   18 students.
      *   Task: Distribute 100 Tokens across 4 Projects (A, B, C, D).
      *   Constraint: Project A needs min 20 to survive. Project B max 40. Etc. (Complexity).
      *   Phase 1: Volunteer Committee (5 students). 15 mins.
      *   Phase 2: Lot Committee (5 students). 45 mins.
      *   Rotation: Swap 2 members at 25 mins of Phase 2.
      *   Accountability: Class vote at end.

      *Wait, the prompt asks to "make them feel the force of lottocracy... rather than simply hear the arguments."*
      *   If I do Election THEN Lot, they compare. That's good.
      *   But the prompt emphasizes "The break that the draw creates: the moment when no one can claim to have earned or been denied a seat."
      *   So the transition from Phase 1 (Earned) to Phase 2 (Random) is crucial.
      *   Also "Accountability without elections." In Phase 2, they can't be voted out.
      *   Also "Descriptive rep vs capacity."

      *Let's refine the "Accountability" mechanism.*
      *   In Phase 1 (Elected), if the class dislikes the plan, they vote the committee out and elect new ones. (Simulates election accountability).
      *   In Phase 2 (Lot), if the class dislikes the plan, they cannot vote them out. They must accept the decision or the whole class suffers a penalty (e.g., no break, or everyone writes a reflection paper). This forces the class to feel the lack of recourse.

      *Let's refine the "Capacity" mechanism.*
      *   Give the committee a puzzle. To unlock the full budget, they must solve a logic puzzle or balance a budget sheet.
      *   If the Lot picks people who struggle, the budget remains locked. This shows the risk of incompetence.

      *Let's refine the "Rotation" mechanism.*
      *   Midway through Phase 2, stop the clock. Draw 2 new names. Remove 2 existing members (randomly or by choice?). Randomly is more "sortition." The new members haven't heard the previous arguments. They need to be socialized.

      *Finalizing the Activity Flow:*
      1.  **Intro (5 mins):** Set stakes. We need to allocate 100 points to 4 Projects. Rules on board.
      2.  **Round 1: The Meritocratic Council (20 mins).** Call for volunteers who feel "qualified." Select 5. They deliberate. Class can heckle/advise. Class votes on proposal. If rejected, Council is dissolved (Accountability via Election/Retention).
      3.  **Round 2: The Random Council (45 mins).** Explain new rule: "To ensure fairness, no one can volunteer." Draw 5 names. They sit in center.
          *   *Constraint:* They must reach unanimity.
          *   *Constraint:* Class cannot speak, only pass notes.
          *   *Accountability:* Class votes Yes/No. If No, *everyone* loses 10% of participation grade (or equivalent stake). The Council cannot be changed.
          *   *Capacity Test:* Give them a "Budget Sheet" with hidden constraints (e.g., Project C cannot receive funds if Project A gets >50). They must discover this.
          *   *Rotation (at 25 mins):* Draw 2 new names. Swap with 2 current members (randomly chosen by die roll). New members get no briefing.
      4.  **Final Decision (10 mins):** Council presents. Class votes.
      5.  **Debrief (20 mins):** Reveal the concept.

      *Wait, 100 minutes total.*
      *   Intro: 5
      *   Round 1: 20
      *   Transition/Draw: 5
      *   Round 2 (incl rotation): 45
      *   Final Vote: 5
      *   Debrief: 20
      *   Total: 100. Tight but doable.

      *Materials:* Hat, slips of paper (names), Whiteboard (Projects/Rules), Budget Sheets (hidden constraints), Timer.
      *   Roles: Facilitator (Instructor), Council Members (5), Constituents (13).

      *Addressing Pressure Points in Design:*
      1.  *The Break:* The shift from Volunteers (Round 1) to Hat (Round 2).
      2.  *Rep vs Capacity:* The Budget Sheet requires attention to detail. The Draw might pick distracted students. The Class (Rep) might want something the Council (Capacity) can't deliver.
      3.  *Accountability:* Round 1 = Council fired if vote fails. Round 2 = Class punished if vote fails, Council stays.
