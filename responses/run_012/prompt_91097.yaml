      *Wait, "unilateral decision-making power"?* No, the Class votes Yes/No. The Council proposes.
      *   Better: "The class transitions from a self-selected volunteer committee to a randomly drawn council whose members cannot be removed, forcing the constituency to accept their proposal or suffer a collective penalty."

      *Let's polish the Budget Puzzle:*
