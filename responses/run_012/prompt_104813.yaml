          *   *Significance:* High. If I can go to Paris, Paris is ontologically on par with London in a way I can verify. If I can't touch W2, its reality is more abstract.
      *   *User Suspicion 2: Disjointness/Unity.* Times are parts of *one* spacetime manifold. Places are parts of *one* world. Worlds are *isolated* spatiotemporal systems.
          *   *Significance:* High. "Here" and "There" share a common metric. "Actual" and "Merely Possible" do not share a common container. This makes the indexicality weaker.
      *   *User Suspicion 3: Linguistic/Epistemic Behavior.* "Actual" rigidifies. "Here" doesn't rigidify in the same way in modal contexts. Also, the *feeling* of reality.
          *   *Significance:* High. When I say "I am here," I can imagine being elsewhere. When I say "This is actual," can I imagine it being non-actual? (Lewis says yes, from the perspective of a counterpart, but it feels different).
      *   *The "Specialness" Objection:* The objection isn't just "Why indexically here?" It's "Why is the ontology so bloated?" The indexical move explains why *we* call it actual, but not why the *plurality* exists.

  5.  **Sorting Disanalogies:**
      *   *Noise:* Grammatical category (adjective vs. adverb), specific physics of time travel.
      *   *Signal (Matters for Conclusion):* Causal isolation (epistemic access), lack of common spatiotemporal framework (ontological unity), the rigidity of "actual" in semantic contexts.

  6.  **Evaluating the Payoff:**
      *   Does the analogy dissolve the objection?
      *   *Lewis's view:* Yes, it dissolves the "ontological privilege" worry.
      *   *Critique:* It dissolves the *semantic* worry but not the *metaphysical cost* worry. The objection "Why is our world actual?" is indeed a non-question *if* you accept MR. But the real objection is "Why believe in all those other worlds?" The indexical theory doesn't answer *that*. It just explains terminology *given* the theory.
      *   *Verdict:* The analogy masks the epistemic cost. It makes the *status* of our world seem mundane, but it doesn't make the *existence* of the others seem mundane.

