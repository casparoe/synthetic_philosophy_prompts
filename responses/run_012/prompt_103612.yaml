answer: |-
  Here is a precise formulation of a principle that captures your verdicts, an evaluation of its fit, predictions for your new cases, and an assessment of my confidence.

  ### The Principle: Domain-Relative Normativity

  **Statement:** The content of a rule or term is fixed by the normative standard appropriate to the **functional domain** of the practice in which it is used. The source of authority for that standard varies by domain:
  1.  **Coordinative Domain (Ordinary Language/Natural Kinds):** The goal is successful communication and coordination. Authority lies in **communal convergence**. Individual deviations are errors; community-wide shifts are meaning changes.
  2.  **Constitutive Domain (Mathematics/Logic/Games):** The goal is truth-preservation or consistency within a system. Authority lies in **stipulative intention** (explicit or implicit). Individual intentions bind the agent; community usage is secondary to the defined rules.
  3.  **Expressive Domain (Art/Poetry):** The goal is unique expression or aesthetic effect. Authority lies in **individual creative intent**. Individual deviations are innovations, not errors.
  4.  **Artifact Domain (Machines/Tools):** The goal is fulfilling a design function. Authority lies in **design specification**. Deviations are malfunctions, not rule-following.

  ### Evaluation of Your Seven Verdicts

  This principle preserves six of your seven verdicts cleanly but forces a clarification on the seventh.

  *   **Preserved:**
      *   **Case 1 (Castaway/Addition):** Falls under *Constitutive*. The castaway intends to follow the addition function. Since math is truth-apt, his intention to track the function fixes the meaning, even without a community. (Verdict: 125 is right).
      *   **Case 2 (Tove/Color):** Falls under *Coordinative*. The goal is coordination. When the community shifts, the standard of coordination shifts. (Verdict: Meaning shifted).
      *   **Case 3 (Child/Dog):** Falls under *Coordinative*. The child aims to coordinate with the community but fails. (Verdict: Mistake).
      *   **Case 4 (Mathematician/Announced Rule):** Falls under *Constitutive*. The explicit stipulation overrides inductive patterns of past behavior. (Verdict: Mistake).
      *   **Case 6 (Poet/Sun):** Falls under *Expressive*. The goal is expression, not coordination. (Verdict: Meaning shifts).
      *   **Case 7 (Wolf/Dog):** Falls under *Coordinative*. Lack of exposure explains the error but does not change the standard (community usage). (Verdict: Mistake).

  *   **Forced Clarification:**
      *   **Case 5 (Machine/Addition):** Falls under *Artifact*. Your verdict is "malfunction," which this principle preserves. However, your uncertainty ("whether that is because machines lack something or because isolated individuals also lack something") is addressed by the principle: it distinguishes humans (who have intentions/goals) from machines (which have design functions). The principle forces you to accept that the *reason* the machine is malfunctioning is different from why a human might be mistaken. The machine violates design; the human violates a norm they are susceptible to.

  ### Predictions for New Cases

  **Case A: A community collectively adopts a new arithmetic convention by explicit agreement.**
  *   **Prediction:** **Meaning changes.**
  *   **Reasoning:** This creates a hybrid scenario. While arithmetic is *Constitutive*, the *symbols* and *conventions* used to express it are *Coordinative*. If the community explicitly agrees to redefine "+" (e.g., to mean "quus" or to operate in a different base), they have instituted a new constitutive game. Because the shift is communal and explicit, it counts as a change in the rule of the practice, not a collective error. They are now playing a different game.

  **Case B: An AI trained on a community's practice extends it in a novel way.**
  *   **Prediction:** **Depends on the Design Teleology.**
  *   **Reasoning:** As an *Artifact*, the AI's "correctness" is determined by its design goal.
      *   If the goal is **Replication** (mimic human output exactly): The novel extension is a **malfunction/error**.
      *   If the goal is **Optimization** (solve problems efficiently, even if humans don't): The novel extension is **functional success**, potentially revealing a "better" rule that the humans hadn't articulated.
      *   *Contrast with Human:* Unlike the Castaway (Case 1), the AI does not "mean" the new rule in a normative sense; it merely outputs according to weights. The *interpretation* of that output depends on what we designed it to do.

  ### Confidence and Weakest Step

  **Confidence Level:** **Moderately High (75%)** as a descriptive framework for your intuitions, but **Low (40%)** as a solution to the underlying metaphysical skepticism.

  **Why this confidence?**
  The principle successfully systematizes your "Correction Asymmetry." It explains *why* you treat the community differently from the individual: you are implicitly tracking the *goal* of the practice (coordination vs. truth vs. expression). It resolves the tension between the Castaway (individual intention suffices for math) and the Child (individual intention insufficient for language).

  **The Weakest Step in Reasoning:**
  The classification of **Case 1 (The Castaway)** into the *Constitutive Domain*.
  *   **The Vulnerability:** A strict Wittgensteinian or Kripkean skeptic would argue that mathematics is *also* a language game and therefore falls under the *Coordinative Domain*. If meaning requires a community, the Castaway means nothing by "+", and his answer "125" is neither right nor wrong.
  *   **Why it's weak:** My principle assumes your intuition (that the Castaway *does* mean addition) is correct and builds the domain distinction to protect it. However, justifying *why* math allows individual normativity while language requires communal normativity is philosophically contentious. It relies on a realist view of math (that the rule exists independently to be grasped) versus a nominalist view of language (that the rule is constituted by usage). If math is just another social practice, the Castaway verdict collapses, and the principle requires revision.

  ### Summary
  Your "Correction Asymmetry" is not a bug in your reasoning but a feature of how we navigate different normative domains. You are tracking **Authority Sources**: Community for coordination, Intention for truth/consistency, and Design for artifacts. The principle of **Domain-Relative Normativity** codifies this. It saves your verdicts at the cost of committing to the view that mathematical meaning is not purely social, which is the precise point where the skeptical problem bites hardest.
