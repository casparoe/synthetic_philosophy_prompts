answer: |-
  ### How to Use This Tree

  **If you land on different leaves:**
  Stop arguing about the data. You have discovered that you are measuring different things. Acknowledge that your disagreement is definitional, not empirical. You may agree that *both* metrics are changing in opposite directions (e.g., absolute deaths are up, but per-capita rates are down). Decide which metric matters more for your specific discussion goal, or agree to speak in conditional terms ("If we define violence as X, then Y").

  **If you land on the same leaf and still disagree:**
  You have agreed on the definition and the metric. Now you are allowed to argue about the numbers. Bring data. One of you is likely wrong about the trend, or you are using different datasets. This is the only zone where empirical debate is productive.

  ***

  ### The Decision Tree

  *Follow the path that matches your intuition. Questions are phrased to avoid leading you to a specific conclusion.*

  **Q1. Agency:** Does an act require an identifiable human agent directly inflicting harm to count as violence, or can systems, neglect, and economic structures count?
  *   **Agent Required** → Go to Q2
  *   **Structure Counts** → Go to Q3

  **Q2. Intent:** If an agent is required, must they specifically intend the harm, or is foreseeable side-effect harm (e.g., collateral damage) enough?
  *   **Intent Required** → Go to Q4
  *   **Foreseeability Enough** → Go to Q4

  **Q3. Structural Label:** If systems cause death (e.g., priced-out medicine), do you call this "violence" or "tragedy/misfortune"?
  *   **Violence** → Go to Q5
  *   **Tragedy** → Go to Q1 (Restart as Agent Required)

  **Q4. Harm Type:** Must the outcome be physical injury or death, or do coercion, fear, and credible threats without contact count?
  *   **Physical Only** → Go to Q5
  *   **Coercion/Fear Counts** → Go to Q5

  **Q5. Metric:** Are we counting the raw number of events/deaths, or are we adjusting for population/time?
  *   **Absolute Counts** → Go to Q6
  *   **Adjusted Rates** → Go to Q7

  **Q6. Absolute Baseline:** If counting absolutes, are we comparing to the peak of the World Wars or to pre-state history?
  *   **Peak Wars (Recent)** → Go to Q8
  *   **Pre-State (Deep)** → Go to Q9 (Flag: Incoherent Path)

  **Q7. Denominator:** If using rates, is the denominator "per living person" or "as a share of all deaths"?
  *   **Per Capita** → Go to Q8
  *   **Share of Mortality** → Go to Q8

  **Q8. Risk Profile:** Are we tracking the frequency of typical events, or the probability of one enormous catastrophic event?
  *   **Frequency (Typical)** → Go to Q9
  *   **Catastrophe (Tail Risk)** → Go to Q10

  **Q9. Victim Scope:** Do all human deaths count equally, or do combatants/citizens/non-citizens weigh differently?
  *   **All Equal** → Go to Q10
  *   **Weighted (e.g., Civilians > Combatants)** → Go to Q10

  **Q10. Intervention:** If violence is used to prevent greater violence (e.g., stopping a genocide), does it add to the violence total or subtract from it?
  *   **Adds (Gross)** → Go to Q11
  *   **Subtracts (Net)** → Go to Q11

  **Q11. Ontology:** Is "violence" a natural category that exists in the world independent of us, or a conceptual tool we define?
  *   **Natural Category** → Go to Q12
  *   **Conceptual Tool** → **Leaf: The Pragmatic Instrumentalist**

  **Q12. Utility:** Is the primary goal of your definition to describe reality accurately or to motivate political/moral action?
  *   **Describe Reality** → **Leaf: (See Measurement Leaves Below)**
  *   **Motivate Action** → **Leaf: The Moral Mobilizer**

  *(Note: Q11 and Q12 act as filters. If you answer "Conceptual Tool" or "Motivate Action," the specific measurement questions above matter less, as your definition serves a function rather than a fact.)*

  ***

  ### The Leaves (Positions)

  *There are 15 terminal positions. Some paths in the tree above merge here because they result in the same practical stance.*

  **1. The Long-Term Per-Capita Optimist**
  *   **Path:** Agent + Rates + Per Capita + Deep Past + Frequency + All Equal.
  *   **View:** Violence is down because the rate of death by violence per person is lower now than in hunter-gatherer or medieval times.
  *   **Embarrassing Fact:** The absolute number of people living in active war zones has risen in the last decade despite the rate drop.

  **2. The Absolute Count Alarmist**
  *   **Path:** Agent + Absolute Counts + Recent Peak + Frequency + All Equal.
  *   **View:** Violence is up or stagnant because population growth means more total dead bodies, regardless of rates.
  *   **Embarrassing Fact:** The global homicide rate has fallen even in regions where population has exploded.

  **3. The Structural-Violence Pessimist**
  *   **Path:** Structure Counts + Violence + Rates + Per Capita + All Equal.
  *   **View:** Violence is not declining because preventable deaths from poverty and neglect (structural violence) dwarf direct conflict deaths.
  *   **Embarrassing Fact:** Global extreme poverty rates have halved in the last 30 years, reducing structural deaths.

  **4. The Mortality-Share Neutral**
  *   **Path:** Agent + Rates + Share of All Deaths + Deep Past.
  *   **View:** Violence hasn't changed much; we just die of cancer and old age instead of spears. The slice of the pie is stable.
  *   **Embarrassing Fact:** In many pre-modern societies, violent death accounted for a much larger share of total mortality than in modern states.

  **5. The Tail-Risk Existentialist**
  *   **Path:** Agent + Rates + Catastrophe Risk + Future End.
  *   **View:** Trends in small wars don't matter; the risk of one nuclear or biological event makes violence potentially infinite.
  *   **Embarrassing Fact:** We have gone 80 years without a nuclear exchange despite proliferation.

  **6. The Coercion Focus**
  *   **Path:** Coercion/Fear Counts + Rates + Per Capita.
  *   **View:** Violence includes the threat of force; a population under armed occupation without mass killing is still experiencing high violence.
  *   **Embarrassing Fact:** Global measures of perceived freedom and civil liberties have declined even as battle deaths have fallen.

  **7. The Civilian-Weighted Humanitarian**
  *   **Path:** Physical Only + Weighted (Civilians > Combatants) + Gross Violence.
  *   **View:** Combatant deaths are irrelevant; only civilian suffering tracks the moral trend of violence.
  *   **Embarrassing Fact:** In some modern conflicts, the ratio of civilian-to-combatant deaths is lower than in historical total wars.

  **8. The In-Group Protector**
  *   **Path:** Physical Only + Weighted (Citizens > Non-Citizens) + Frequency.
  *   **View:** Violence is down for "us" (the developed world), which is the only metric that impacts our daily reality.
  *   **Embarrassing Fact:** Violence exported by "us" (drone strikes, arms sales) often exceeds violence experienced domestically.

  **9. The Net-Violence Calculator**
  *   **Path:** Agent + Intervention Subtracts + Gross Violence.
  *   **View:** Violence used to stop genocide or aggression reduces the total violence count (peacekeeping as negative violence).
  *   **Embarrassing Fact:** Humanitarian interventions often cause significant civilian collateral damage, muddying the "net" calculation.

  **10. The Gross-Violence Absolutist**
  *   **Path:** Agent + Intervention Adds + All Equal.
  *   **View:** All killing counts equally, regardless of motive. A peacekeeper killing a shooter adds to the violence total.
  *   **Embarrassing Fact:** This view implies that a successful police intervention that saves 100 lives is morally equivalent to a murder that takes 1 life.

  **11. The Intent Purist**
  *   **Path:** Intent Required + Foreseeability Excluded.
  *   **View:** Accidental deaths or side-effects (famine from blockade) are not violence; only targeted killing counts.
  *   **Embarrassing Fact:** This excludes most state-caused mortality from sanctions or siege warfare from the definition of violence.

  **12. The Foreseeability Realist**
  *   **Path:** Intent Not Required + Foreseeability Enough.
  *   **View:** If you know a policy will kill people and do it anyway, that is violence, even if you didn't pull the trigger.
  *   **Embarrassing Fact:** This definition can make routine economic policy or traffic infrastructure indistinguishable from warfare.

  **13. The Pragmatic Instrumentalist**
  *   **Path:** Q11 = Conceptual Tool.
  *   **View:** There is no "true" fact of the matter; we choose the definition that helps us solve the problem we care about.
  *   **Embarrassing Fact:** This makes it impossible to settle the debate scientifically, as opponents simply switch tools.

  **14. The Moral Mobilizer**
  *   **Path:** Q12 = Motivate Action.
  *   **View:** We should define violence in the way that best galvanizes people to reduce suffering, regardless of technical accuracy.
  *   **Embarrassing Fact:** Over-broad definitions (calling everything violence) can cause audience fatigue and reduce actual mobilization.

  **15. The Empty Node (The Deep-Past Absolutist)**
  *   **Path:** Agent + Absolute Counts + Deep Past.
  *   **Status:** **Incoherent/Unexplored.**
  *   **Reason:** Comparing absolute death counts from 1500 to today is demographically meaningless due to population explosion. Nobody holds this position seriously; it is usually a rhetorical error made by someone confusing counts with rates.

  ***

  ### Indistinguishable Leaves & Notes

  **Flagged Indistinguishable Leaves:**
  *   **The Moral Mobilizer** and **The Pragmatic Instrumentalist** are functionally identical in discussion. Both reject the idea that there is a single "correct" empirical answer. They are separated here only to distinguish between *solving a problem* (Instrumentalist) and *raising alarm* (Mobilizer), but in practice, they will vote the same way on definitions.

  **Empty Combinations:**
  *   **Structural Violence + Absolute Counts + Deep Past:** This combination is **Unattractive**. Structural violence advocates usually focus on rates (deaths per capita) because absolute numbers of poverty deaths naturally rise with population, which weakens their moral argument about systemic intensity.
  *   **Intent Purist + Structural Violence:** This combination is **Incoherent**. You cannot believe violence requires specific intent *and* believe structural neglect (which lacks a specific shooter) counts as violence. If you answer Q1=Structure and Q2=Intent, you must loop back to Q1.

  **Test Case Resolutions:**
  *   *Blockade/Famine:* Counts as violence for **Structural-Violence Pessimist** and **Foreseeability Realist**. Does not count for **Intent Purist**.
  *   *Police Shooting:* Counts for almost all Agent-based leaves, but weighs differently for **In-Group Protector** vs. **Civilian-Weighted Humanitarian**.
  *   *Genocide Intervention:* Adds to the total for **Gross-Violence Absolutist**; subtracts for **Net-Violence Calculator**.
  *   *Priced-Out Drug:* Counts as violence for **Structural-Violence Pessimist**; tragedy for **Intent Purist**.
  *   *Nuclear Standoff:* Counts as high violence for **Tail-Risk Existentialist** and **Coercion Focus**; counts as zero for **Physical Only** leaves.
