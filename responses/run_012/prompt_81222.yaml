answer: |-
  The Map We Walk On

  I place my house at the center of the sheet.
  The sun is a coin I can hold in my hand.
  The farthest stars are pins in the wall.
  My body blocks the light behind it.
  This is the best way to walk straight.

  The stone does not know it is heavy.
  The void does not know it is wide.
  One man trembles at the empty space.
  Another feels the rock under his boots.

  Fear ties the laces tight.
  Hope loosens them for running.
  The path is the same gray strip.

  I pity the one who stays seated.
  Not because he sees false things.

  The earth is cold for both of us.

  But I need to rise and go to work.
  My hands require a reason to lift.
  If the world is a tomb I will not dig.
  If the world is a field I will plant seed.
  So I keep the map that lets me build.
