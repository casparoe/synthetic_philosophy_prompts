      *   **Key Passage Ideas:**
          *   World picture is in perspective, not to scale.
          *   Humans large/foreground, stars small/background (threepenny bits).
          *   Facts aren't inherently good/bad.
          *   Emotional response (thrill vs. depression) is practical/functional, not factual.
          *   Being thrilled is better for activity than being depressed (pity the depressed guy).
      *   **Tone:** Serious, avoiding cosmic nihilism (nothing matters) and carpe diem pep talks (just be happy). It needs to capture the *pragmatic* asymmetry of attitudes.
