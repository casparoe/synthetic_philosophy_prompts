          *   Popperian vs. Gregorian: It's about the origin of the tools for thinking. Popperians have innate or individually learned simulators. Gregorians inherit *cognitive tools* (memes, language, math) that restructure the simulator itself. The crow's hook is a physical tool; the physicist's chalkboard is a cognitive scaffold that alters the *structure* of thought, not just the outcome. The key is the *recursion* and the *cultural transmission of the tools of thought*.

