prompt: |-
  I'm presenting my own take on epistemic injustice at a seminar next week and want a consistency check before I get torn apart. Here's where I've landed: (1) giving someone less credence because of who they are is a wrong in its own right, not just a bad route to false beliefs; (2) there's a separate, hermeneutical version of that wrong — some experiences can't be made sense of because the shared vocabulary hasn't caught up; (3) if your evidence makes a belief rational for you, you're off the hook entirely, so a doctor who brushes off a patient's pain report because the base rates back him up doesn't owe her an apology, even if he was wrong and she suffered for it; (4) people are answerable for their implicit biases; (5) the hermeneutical wrong is structural — its a gap in what's sayable, not something one person does to another. Which of these actually pull against each other, which only look like they do, and what's the cheapest revision that would buy me the most consistency — and what does that revision cost me?
reasoning: |-
