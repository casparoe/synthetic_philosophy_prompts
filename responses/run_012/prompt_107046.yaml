answer: |-
  The divergence between the permissive market model found in much of the United States and the altruistic model prevalent in many European states is not merely a policy disagreement; it is a clash of anthropological and economic ontologies. To understand it, we must reconstruct the implicit theories of the person and the body that undergird each regime, distinguish the logical requirements of the bans from their rhetorical justifications, and finally confront the possibility that the search for a unified theory is itself a category error.

  ### I. Implicit Theories of Person and Market

  **The American Market Model (Liberal-Proprietary)**
  The permissive regime presupposes a Lockean theory of self-ownership. The person is the sovereign proprietor of their own body and capacities. Reproductive labor (gestation) and biological materials (gametes) are viewed as alienable assets.
  *   **The Body:** An instrument of the will, capable of being leased or sold without compromising the integrity of the self.
  *   **The Market:** A neutral mechanism for coordinating desires and resources. Price signals are efficient and consensual.
  *   **Autonomy:** Defined negatively as freedom from interference. If a woman consents to a contract, the state's role is to enforce it, ensuring promises are kept.
  *   **Parentage:** A legal status derivable from intent and contract. The genetic or gestational contribution can be severed from legal rights via agreement.

  **The European Altruistic Model (Dignity-Solidarity)**
  The restrictive regime presupposes a Kantian or Communitarian theory of personhood. The body is not property but the locus of human dignity; it is constitutive of the person, not an object the person *has*.
  *   **The Body:** Inalienable. To sell it is to treat the self as a means to an end, violating human dignity.
  *   **The Market:** A sphere that must be bounded. Certain goods (votes, organs, reproductive capacity) are "market-inalienable" because their sale corrupts their social meaning.
  *   **Autonomy:** Defined positively or relationally. True autonomy cannot exist under conditions of economic desperation or social pressure. The state protects the *conditions* of autonomy, not just the exercise of it.
  *   **Parentage:** Rooted in biological or gestational reality, transferable only through processes designed to prioritize the child's welfare (adoption) rather than adult contract rights.

  ### II. The Basis of the Ban: Requirements vs. Fits

  When European states ban commercial surrogacy or egg donation, they typically offer three justifications. We must distinguish which of these the law *strictly requires* versus which merely *fits* the outcome.

  1.  **Commodification/Degradation:** The claim that selling reproductive capacity turns life into a product, degrading the seller and the child.
      *   *Status:* **Strictly Required.** If the act of sale itself is inherently wrongful (malum in se), then regulation cannot cure it. Only a ban preserves the moral boundary. If this is the true ground, the law is consistent.
  2.  **Exploitation/Coercion:** The claim that economic inequality makes consent impossible or coercive.
      *   *Status:* **Merely Fits.** If the wrong is exploitation, a ban is an overbroad remedy. One could instead regulate wages, mandate independent counsel, require insurance, or set income floors (as we do with hazardous labor). A ban prohibits the poor from accessing a revenue stream while leaving the rich free to pursue surrogacy abroad. Thus, an exploitation view does not *require* a ban; it requires *fairness*.
  3.  **Paternalism:** The claim that women will regret these decisions or do not understand the risks.
      *   *Status:* **Merely Fits.** Paternalism usually mandates cooling-off periods or counseling, not absolute prohibition. A total ban suggests the state believes the harm is societal, not just individual.

  **Philosophical Underdetermination:**
  The law is underdetermined because the "reimbursement of expenses" loophole undermines all three. If commodification is the sin, reimbursing lost wages or "inconvenience" is a semantic game that achieves the same market result. If exploitation is the sin, high "expenses" still target the economically vulnerable. If paternalism is the sin, the woman is still undergoing the medical risk. The law prohibits the *label* of "payment" more rigorously than the *flow* of value.

  ### III. Internal Consistency of the Banning Regimes

  The European model exhibits a structural tension that exposes its true commitment.

  **The Tension:**
  These regimes refuse to let reproductive capacity be bought, yet they allow the parentage of the resulting child to be reassigned by prior agreement (in altruistic surrogacy) or through streamlined adoption. Furthermore, they police a line between "expenses" and "payment" that is porous; a surrogate can be compensated for "loss of earnings," "clothing," or "travel," effectively creating a shadow market.

  **The Exposed Commitment:**
  This tension reveals that the banning regimes are not primarily concerned with the *material transfer* of the child or the *financial benefit* to the woman. They are concerned with the **symbolic order of the family.**
  The law seeks to maintain the fiction that the child is a "gift" (in the Maussian sense) rather than a "product." By banning explicit price tags, the law preserves the social narrative that parenthood is a status of care, not a transaction of purchase. The inconsistency arises because the state wants the *outcome* of surrogacy (a child for the intending parents) without the *moral cost* of admitting it was bought. The "expenses" loophole is a necessary hypocrisy to ensure enough women participate to make the system function without admitting it is a market.

  ### IV. Counterfactuals: Changing the Theoretical Ground

  If we were to align the law strictly with one of the competing theories, the legal landscape would shift dramatically.

  1.  **Replacing Commodification with Exploitation:**
      *   *Change:* Commercial surrogacy and egg donation would be legalized but heavily regulated like labor.
      *   *Mechanism:* Standardized contracts, minimum compensation floors, mandatory health insurance, and perhaps a ban on recruiting from the lowest income quintiles. Intermediaries would be licensed, not banned.
      *   *Result:* The market remains, but the power asymmetry is mitigated. The "gift" narrative collapses, replaced by a "service" narrative.

  2.  **Replacing Commodification with Liberal Contract:**
      *   *Change:* Full enforceability of specific performance.
      *   *Mechanism:* If a surrogate changes her mind, she could be compelled to relinquish the child or face damages equivalent to the full value of the contract. Egg donors could be sued for breach if they withhold eggs.
      *   *Result:* Reproductive capacity becomes fully alienable property. Risk shifts entirely to the provider.

  3.  **The Current Reality (The Hybrid):**
      *   Current European law tries to have it both ways: it wants the reliability of contract (parentage orders) without the morality of the market (payment). This is why it is unstable. It relies on the goodwill of donors to sustain a system designed for consumers.

  ### V. The False Premise

  You asked me to say plainly if the question rests on a false premise. It does.

  The prompt assumes that the division between the US and Europe reflects a coherent, principled philosophical asymmetry. It assumes that "The American View" and "The European View" are unified theoretical commitments. They are not.

  **1. The American Incoherence:**
  There is no "American Market View." The US is a patchwork. Louisiana criminalizes compensated surrogacy; California enforces it. Federal law prohibits the sale of organs (NOTA), yet egg donation is treated differently because eggs are "renewable." This is not a principled distinction based on personhood; it is a historical accident of lobbying and statutory interpretation. The US does not embody a liberal contract theory; it embodies a **federalist tolerance for moral pluralism.**

  **2. The European Incoherence:**
  "Europe" does not hold a single view. The UK allows altruistic surrogacy with parental orders. Germany bans egg donation entirely (Embryo Protection Act) but tolerates surrogacy via adoption loopholes. France bans all surrogacy but recognizes foreign judgments under ECHR rulings. These are not applications of a unified Kantian theory; they are **political compromises** between Catholic heritage, feminist movements, and demographic anxieties.

  **3. The Asymmetry is Less Principled Than It Appears:**
  The division is not primarily about "Commodification vs. Dignity." It is about **welfare state architecture.**
  *   In many European states, robust social safety nets reduce the economic desperation that drives the market. The ban on payment is politically sustainable because women are less reliant on selling reproductive capacity for survival.
  *   In the US, the lack of paid leave, high medical costs, and wage stagnation create a supply side for the market. The "choice" to sell eggs is often a choice between reproductive labor and financial hardship.

  **Conclusion:**
  The law is not a philosophical treatise; it is a sediment of conflicting interests. The banning regimes do not rest on a single commitment. They rest on a desire to manage the *appearance* of moral order while accommodating the *reality* of reproductive demand. To seek a unified theory is to impose a rationality on the law that the legislators never possessed. The tension you identify—between banning the sale of capacity while allowing the transfer of the child—is not a puzzle to be solved by better theory. It is the feature of a system trying to satisfy incompatible demands: the demand for children, the demand for moral purity, and the demand to ignore the economic realities that link the two. The law is underdetermined because the society itself is undecided.
