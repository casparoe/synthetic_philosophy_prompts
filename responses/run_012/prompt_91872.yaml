  The gas is lowered to exclude the light,
  I watch the table surface in the night,
  And weigh the value of the promised sight.
  A single rap asserts a distinct sound,
  I check the table legs upon the ground,
  But strict conviction is not yet found.
  This scrap of proof obliges me to test,
  I grant the hypothesis no rest,
  For honesty demands the rigorous quest.
  I left the Chapel for a conscience plain,
  Could not subscribe to doctrines I deemed vain,
  Now held by logic in this rigid chain.
  I seek the survival of the soul,
  But fragments never make the record whole,
  And every confirmation takes its toll.
  The voices hover round my weary head,
  No clear instruction from the dark is shed,
  But offer no assurance from the dead.
  The dawn exposes nothing I have read,
  A silence where the proof should have been said.
