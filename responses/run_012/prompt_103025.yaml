  7.  **Final Polish:** Ensure the distinction between *human being* (biological) and *person* (moral/social) is clear, as that's the crux of the philosophical debate. (Reference scholars like John Mbiti, Desmond Tutu, Thaddeus Metz implicitly or explicitly for credibility).

