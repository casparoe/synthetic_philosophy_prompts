prompt: |-
  Hey, so I have to do this presentation for my world cultures class on Ubuntu, the African philosophy where a person is a person through other people. I think what that means is that in that view you're only a person if your community treats you like one, so if everyone in your village decided you were an outcast you'd literally stop being a person, and somebody living all alone on a desert island wouldn't count as a person at all. And since its all about the community, I'm guessing Ubuntu is basically the opposite of the Western thing where everything is about individual rights. Is that the right way to put it? Also please tell me which parts of this are things people who actually study it agree on and which parts are still genuinely argued about, instead of just handing me one version like its the settled answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Ubuntu (African philosophy).
      *   **Context:** World cultures class presentation.
      *   **User's Current Understanding:**
          *   Definition: "A person is a person through other people."
          *   Interpretation 1: Personhood is contingent on community acceptance (outcast = not a person).
          *   Interpretation 2: Isolation = non-personhood (desert island example).
          *   Interpretation 3: Direct opposite of Western individualism/rights.
      *   **Specific Constraint:** Distinguish between scholarly consensus and ongoing debates/controversies. Do not present it as a settled monolith.

  2.  **Evaluate the User's Interpretations:**
      *   *Core Definition ("I am because we are"):* Generally accurate as a starting point.
      *   *Interpretation 1 (Outcast = Non-person):* This is a strong/controversial reading. Some scholars support the idea of "moral personhood" being achievable, but saying someone *literally* stops being a human being is debated. It's more about *moral status* or *full personhood* vs. biological existence.
      *   *Interpretation 2 (Desert Island):* This is a common philosophical thought experiment used to test Ubuntu. The consensus is nuanced. A solitary human has *potential* personhood but cannot *actualize* it without community.
      *   *Interpretation 3 (Opposite of Western Individualism):* This is a common simplification. Scholars argue it's not a binary opposition but a different emphasis. Western philosophy isn't *purely* individualistic, and Ubuntu isn't *purely* collectivist (it values the individual within the community).

  3.  **Identify Scholarly Consensus vs. Debate:**
      *   **Consensus:**
          *   Origin: Southern Africa (Nguni Bantu).
          *   Core phrase: *Umuntu ngumuntu ngabantu*.
          *   Emphasis on interdependence, relationality, and compassion.
          *   Personhood is often viewed as a process or achievement, not just a biological given.
      *   **Debate/Nuance:**
          *   **Metaphysical vs. Moral:** Does lacking community make you biologically less human, or morally less complete? (The "outcast" question).
          *   **Individual vs. Community:** Is Ubuntu communitarian to the point of suppressing individual rights? (The "Western opposite" question).
          *   **Universalism vs. Particularism:** Is this an African-specific ethic or a universal human one?
          *   **Political Usage:** How has it been used in post-apartheid politics (TRC) vs. traditional practice? (Critiques of vagueness or political tool).

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's good starting point but validate the need for nuance.
      *   *Addressing Interpretation 1 (Outcast/Personhood):*
          *   *Consensus:* Personhood is often seen as a *moral achievement*.
          *   *Debate:* Does exclusion strip you of *humanity* or just *social standing*? Most scholars say you remain a human being but lack "full personhood" (moral weight). Be careful with the word "literally."
      *   *Addressing Interpretation 2 (Desert Island):*
          *   *Consensus:* Relationality is key to *actualizing* personhood.
          *   *Debate:* Is the capacity there inherently? Most say yes, the *potential* is innate, the *realization* is relational.
      *   *Addressing Interpretation 3 (Western Individualism):*
          *   *Consensus:* It contrasts with atomistic individualism.
          *   *Debate:* It's not a strict binary. Ubuntu values individual dignity *within* the community. It's not "community over individual" but "individual *through* community." Mention human rights compatibility.
      *   *Scholarly Controversies (The "Argued About" part):*
          *   Vagueness (Is it too fuzzy for policy?).
          *   Romanticization (Is it an idealized past?).
          *   Gender/Power dynamics (Does "community" mask patriarchy?).
      *   *Conclusion:* Tips for the presentation (avoid binaries, highlight nuance).

  5.  **Refining the Tone:**
