prompt: |-
  So I'm in this little reading group on social epistemology — five of us, we meet Thursdays, there's usually wine — and two members have been circling each other for about three months now over testimony. One is a hardline reductionist: testimony gets no special epistemic status, any trust we place in what we're told has to be earned by tracking the source's track record, basically the Hume move. The other is an anti-reductionist who thinks we arrive with a default entitlement to believe what people tell us unless something defeats it, the Reid move, and that the reductionist picture is both psychologically false and quietly circular. The rest of us are tired of it. Could you write the document they should have produced: the joint statement of an adversarial collaboration, in their two voices but signed by both. I want the numbered list of claims they can both actually sign (about what testimony is, about what needs explaining, about what the psychological and developmental facts do and don't show), then the exact remaining disagreements, each phrased in wording its own side would accept as fair to itself, and then the cruxes — the sub-questions where settling things would move at least one of them. For each crux, name a case or argument that both of them would agree bears on it, and write down each side's prediction about that case in advance, so it can't be fudged later. Finish with a disagreements table. If you decide part of their fight is just verbal — e.g. whether "presumption" and "prima facie justification" are the same thing, or whether an LLM counts as a "speaker" — flag that part and say why, don't paper over it.

  One more thing, because otherwise it'll stay abstract. In the group we eventually agreed on a fixed set of cases the two views both have to run, and I'd like the statement to include them so the disagreement gets concrete. (1) Someone reads a proof of a theorem and checks every single step herself — is she relying on testimony at all by the end, or has it been fully discharged? (2) A source you have good reason to think is a liar or hopelessly biased, but whose claims, for boring structural reasons, turn out to be reliable anyway. (3) A child picking up language, and the broader claim that almost everything any of us believes rests somewhere on what we've been told. (4) The one that started the whole thing: a language model produces a fluent, confident answer with no identifiable person behind it — is that testimony at all, and does either side's default of trust extend to it? (5) A community whose entire knowledge of some distant place is inherited from generations nobody can now trace, and which turns out to be accurate. For each case I want both of them on record: what their view predicts, and what outcome would embarrass them. And if it turns out they'd both update in the same direction on some of these, say so — I'd like to know which of the five is actually load-bearing and which are just scenery.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A social epistemology reading group (5 members, Thursdays, wine).
      *   **Conflict:** Two members (Reductionist vs. Anti-Reductionist) have been arguing for 3 months about testimony.
      *   **Task:** Write a "Joint Statement of Adversarial Collaboration" in their two voices, signed by both.
      *   **Required Components:**
          1.  Numbered list of agreed claims (nature of testimony, explanatory burdens, psychological/developmental facts).
          2.  Exact remaining disagreements (phrased fairly for each side).
          3.  Cruxes (sub-questions where settling moves the needle), including specific cases/arguments bearing on them, and pre-registered predictions for each side.
          4.  Disagreements Table.
          5.  Verbal Dispute Flagging (e.g., terminology, LLM status).
          6.  Fixed Set of 5 Cases (Theorem, Biased Source, Child Language, LLM, Inherited Community Knowledge) with predictions and "embarrassment conditions" for each side.
          7.  Identification of which cases are load-bearing vs. scenery.
      *   **Tone:** Academic but weary/collaborative, precise, philosophical, slightly informal (reflecting the reading group context).
      *   **Format:** A formal document but with distinct voices where appropriate.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Reductionist (Humean):** Testimony is not a *sui generis* source of justification. Belief based on testimony is justified only if supported by independent reasons (perception, memory, induction) regarding the speaker's reliability. Trust must be earned.
      *   **Anti-Reductionist (Reidian):** Testimony *is* a *sui generis* source. We have a default entitlement (presumption) to believe. The burden of proof lies on the defeater, not the believer. Reductionism is circular (you need testimony to verify testimony) and psychologically unrealistic.

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look like a collaborative document. Title, Date, Signatories (let's name them "Alex" for Reductionist and "Jordan" for Anti-Reductionist to keep it neutral, or just use the positions). Let's use initials R and A for clarity, or names. Let's go with "Elena" (Reductionist) and "Marcus" (Anti-Reductionist).
      *   **Preamble:** Acknowledge the stalemate, the wine, the desire to move on.
      *   **Section 1: Common Ground (The Numbered List):** What do they actually agree on?
          *   Testimony involves a speaker and a hearer.
          *   Reliability matters eventually.
          *   Defeaters exist (lies, contradictions).
          *   Psychology shows kids trust early (but interpretation differs).
          *   Circularity is bad (but disagree on who has it).
      *   **Section 2: The Remaining Disagreements:** Needs to be sharp.
          *   *Default Status:* Is it neutral (R) or positive (A)?
          *   *Burden of Proof:* On the believer to verify (R) or on the doubter to defeat (A)?
          *   *Scope:* Is the principle universal (A) or context-dependent (R)?
      *   **Section 3: The Cruxes:** Where would evidence change minds?
          *   *Developmental Psychology:* Do kids check reliability *before* trusting?
          *   *The Circularity Charge:* Can reductionism verify testimony without using testimony?
          *   *The LLM Case:* Is there a "speaker" required for testimony?
      *   **Section 4: The Five Fixed Cases:** This is crucial. I need to map R and A predictions to the specific scenarios provided.
          1.  *Theorem:* R says no testimony (checked); A says maybe still testimonial chain.
          2.  *Biased/Reliable Source:* R says justified (track record); A says unjustified (defeater present).
          3.  *Child Language:* R says inductive learning; A says innate principle.
          4.  *LLM:* R says no testimony (no agent); A says functional testimony or no testimony.
          5.  *Inherited Knowledge:* R says collective induction; A says default entitlement across generations.
      *   **Section 5: Verbal Disputes:** Flag terms like "Presumption" and the ontological status of the LLM.
      *   **Section 6: Disagreements Table:** Summary view.
      *   **Section 7: Load-Bearing Analysis:** Which cases actually matter? (Likely the Child and LLM cases).

  4.  **Refining the Voice:**
      *   The prompt asks for "their two voices but signed by both." This implies the text should reflect a synthesis but acknowledge the distinct perspectives, perhaps in the disagreement sections.
      *   Tone: Professional, slightly tired of the argument, committed to clarity.
      *   *Self-Correction on Voice:* It shouldn't read like a third-party summary. It should read like *they* wrote it together. "We agree..." "Elena maintains..." "Marcus contends..."

  5.  **Drafting the Content (Iterative refinement):**

      *   *Case 1 (Theorem):* If I check every step, is it testimony? Reductionist: No, it's reasoning. Anti-Reductionist: You relied on the textbook's assertion that the symbols mean what you think they mean. *Crux:* Where does the testimonial chain end?
      *   *Case 2 (Biased Source):* Liar who is right. Reductionist: Justified if I *know* they are reliable (induction). Anti-Reductionist: Unjustified if I *believe* they are a liar (defeater active). *Wait, prompt says "good reason to think is a liar".* So R says: If track record is good, trust. A says: If defeater (liar) is present, don't trust. This highlights the tension between *actual* reliability and *perceived* entitlement.
      *   *Case 3 (Child):* Standard developmental debate.
      *   *Case 4 (LLM):* The modern twist. Is there a speaker? R: No agent, no testimony. A: Maybe functional, but default trust requires agency? This is a key verbal dispute area.
      *   *Case 5 (Community):* Historical knowledge. R: Inductive chain. A: Default entitlement through time.

      *   *Cruxes:* Need specific predictions.
          *   Crux 1: Infant studies. Do infants monitor track records *before* word learning?
          *   Crux 2: The LLM ontology. If we settle the "agent" question, does the epistemology follow?
          *   Crux 3: Circularity. Can R verify reliability without testimony?

      *   *Verbal Disputes:* "Presumption" vs "Prima Facie". "Speaker" (Human vs Algorithm).

  6.  **Final Review against Constraints:**
      *   Numbered list of claims? Yes.
      *   Exact remaining disagreements? Yes.
      *   Cruxes with predictions? Yes.
      *   Disagreements table? Yes.
      *   Verbal dispute flagging? Yes.
      *   5 Fixed Cases with predictions/embarrassment? Yes.
      *   Load-bearing analysis? Yes.
      *   Tone appropriate? Yes.

  7.  **Writing the Document:** (Mental check: Ensure the distinction between Humean and Reidian positions is accurate. Hume = reduce to induction/perception. Reid = principle of veracity/credulity.)

      *   *Refining the LLM case:* This is tricky. Reductionists might say "it's just a tool, like a thermometer." Anti-reductionists might say "testimony requires an assertion of truth by a mind." I need to make sure their predictions reflect this.
      *   *Refining the Theorem case:* If I check the proof, have I discharged testimony? Reductionist: Yes. Anti-reductionist: You still relied on the definitions provided by others.
      *   *Refining the "Embarrassment" condition:* What would make them say "Okay, I was wrong"?
          *   Reductionist embarrassment: If it turns out we *can't* track reliability without assuming testimony.
          *   Anti-Reductionist embarrassment: If kids show clear skepticism before trust.

  8.  **Final Polish:** Check the "wine/Thursday" vibe in the preamble to ground it. Ensure the signatures look authentic.

  *(Self-Correction during drafting)*: Make sure I don't solve the dispute. The point is to map it. Ensure the "Load-Bearing" section identifies which cases actually differentiate the theories vs. which ones they can both explain away. The LLM and Child cases are likely the load-bearing ones. The Theorem case might be scenery (both can explain it).

  Let's assemble.
answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Epistemic Status of Testimony (Reductionism vs. Anti-Reductionism)
  **Date:** October 24, 2023
  **Signatories:** Elena V. (Reductionist/Humean) & Marcus T. (Anti-Reductionist/Reidian)
  **Context:** Reading Group on Social Epistemology (Thursdays, 7 PM)

  ### Preamble
  We acknowledge that for the past three months, our discussions regarding the epistemology of testimony have reached a stable equilibrium of disagreement. While the rest of the group has moved on to virtue epistemology (and the wine is being consumed without sufficient philosophical friction), we wish to formalize our stalemate before dissolving the sub-committee. This document represents a pre-registered commitment to the specific points of contact and divergence between our positions. We agree to treat this as a living document; if empirical data or logical demonstration forces an update, the other party reserves the right to say "I told you so."

  ---

  ### I. Agreed Claims (Common Ground)
  *We both sign the following propositions. Denial of these by either party constitutes a retraction of this agreement.*

  1.  **Definition:** Testimony involves a transfer of information from a source (speaker/writer) to a recipient (hearer/reader) via an communicative act intended to convey truth.
  2.  **Defeasibility:** Neither of us claims testimony provides *infallible* justification. Both views accept that testimony-based belief can be overridden by contrary evidence (defeaters).
  3.  **Reliability Goal:** We both aim for a system that maximizes true beliefs and minimizes false ones. We disagree on the *mechanism* for achieving this, not the goal.
  4.  **Psychological Fact:** Human beings, including children, *do* in fact rely heavily on testimony for the vast majority of their beliefs. This is a descriptive claim, not yet a normative one.
  5.  **The Circularity Worry:** We agree that a global skepticism about testimony is self-defeating (since arguing against testimony requires using testimony). We disagree on whether Reductionism entails global skepticism.
  6.  **LLM Ontology (Preliminary):** We agree that Large Language Models are not human agents. Whether they count as "speakers" in the epistemic sense is a disputed classification, not a factual dispute about their code.

  ---

  ### II. Exact Remaining Disagreements
  *Phrased such that each signatory accepts their own phrasing as fair, and the other's as intelligible.*

  **1. The Default Status of Testimonial Belief**
  *   **Elena (Reductionist):** The default epistemic status of a testimonial belief is *neutral*. Justification is acquired only when the hearer has positive, independent reasons (perceptual or inductive) to trust the specific source or the type of claim.
  *   **Marcus (Anti-Reductionist):** The default epistemic status of a testimonial belief is *positive*. The hearer possesses a default entitlement (presumption) to believe, which persists until a specific defeater is encountered.

  **2. The Burden of Proof**
  *   **Elena:** The burden lies on the *believer* to demonstrate why the source is trustworthy.
  *   **Marcus:** The burden lies on the *doubter* to demonstrate why the source is untrustworthy.

  **3. The Scope of the Principle**
  *   **Elena:** Trust is local and contextual. There is no universal "Principle of Credulity."
  *   **Marcus:** Trust is grounded in a universal normative principle (Reid's Principle of Veracity) that is constitutive of communication itself.

  ---

  ### III. Verbal Disputes & Category Errors
  *We flag the following as potential terminological stalemates that must be resolved before substantive progress can be made.*

  1.  **"Presumption" vs. "Prima Facie Justification":** Elena suspects Marcus is using "presumption" to do the work of "justification" without the evidential burden. Marcus suspects Elena is defining "evidence" so narrowly that it excludes the social context of assertion.
      *   *Resolution Path:* We agree to treat "justification" as requiring independent inductive support (Elena) vs. "entitlement" as requiring only the absence of defeaters (Marcus).
  2.  **The "Speaker" Condition (LLM Case):** Elena defines testimony as requiring a *mind* with beliefs. Marcus is willing to define testimony functionally (an output designed to be believed), but worries this collapses testimony into mere instrumentation (like a thermometer).
      *   *Flag:* If the disagreement on Case 4 (LLM) reduces entirely to "Is an LLM a person?", the epistemic question is secondary to the philosophy of mind.

  ---

  ### IV. The Five Fixed Cases (Pre-Registered Predictions)
  *We have selected five concrete scenarios. Below are our predictions and the conditions under which we would consider our position embarrassed.*

  #### Case 1: The Checked Theorem
  *Scenario:* A mathematician reads a proof, checks every logical step herself, and verifies the conclusion.
  *   **Elena:** This is **not** testimony. It is reasoning/observation. The testimonial chain is fully discharged.
      *   *Embarrassment:* If it is shown that she necessarily relied on testimonial assumptions (e.g., definitions of symbols) that she could not independently verify.
  *   **Marcus:** This is **mixed**. The logical steps are reasoning, but the grasp of the concepts and the assurance that the proof is complete relies on a testimonial background.
      *   *Embarrassment:* If it is shown that checking every step *eliminates* the testimonial character entirely, implying testimony is only for the lazy.

  #### Case 2: The Reliable Liar
  *Scenario:* You have strong evidence a source is a pathological liar (defeater), but unbeknownst to you, they are being coerced to tell the truth, making them reliable.
  *   **Elena:** Belief is **unjustified**. You lack positive reasons to trust them (your evidence says they are liars). The accidental reliability doesn't save the justification.
      *   *Embarrassment:* If intuition pumps strongly suggest we *are* justified here simply because the source is objectively reliable.
  *   **Marcus:** Belief is **unjustified**. The defeater (evidence of lying) cancels the default entitlement.
      *   *Embarrassment:* If intuition suggests we *are* justified because the "Principle of Veracity" overrides local evidence of lying (unlikely for Marcus, but noted).
      *   *Note:* We actually **agree** here (Unjustified), but for different reasons (Elena: no positive reason; Marcus: active defeater).

  #### Case 3: The Language-Learning Child
  *Scenario:* A 2-year-old acquires language and basic facts about the world from caregivers.
  *   **Elena:** The child is performing rapid, implicit induction on reliability. They track consistency and success.
      *   *Embarrassment:* If developmental psychology shows infants trust *before* they have sufficient data to form an inductive track record.
  *   **Marcus:** The child is exercising an innate Principle of Credulity. Trust precedes evidence.
      *   *Embarrassment:* If infants show robust skepticism of unfamiliar speakers *prior* to linguistic competence.

  #### Case 4: The LLM Answer
  *Scenario:* An LLM produces a fluent, confident answer to a factual query. No human is directly asserting this specific sentence at this moment.
  *   **Elena:** This is **not testimony**. It is instrument reliability (like a search engine). Trust requires checking the model's track record.
      *   *Embarrassment:* If users treat it as testimony and are found to be epistemically rational in doing so without checking track records.
  *   **Marcus:** This is **functional testimony**. If it acts like an assertion, the default entitlement applies unless we know it's an LLM (which acts as a defeater regarding agency).
      *   *Embarrassment:* If it turns out that without a *mind* behind the assertion, the normative force of "assertion" vanishes completely.

  #### Case 5: Inherited Community Knowledge
  *Scenario:* A community holds accurate beliefs about a distant place inherited from ancestors no one can now trace.
  *   **Elena:** Justified only if the community has inductive reasons to think their traditions are generally reliable (e.g., they work in navigation).
      *   *Embarrassment:* If the community has *no* way to verify the track record yet is still justified.
  *   **Marcus:** Justified by default entitlement. The chain of testimony preserves entitlement unless broken by a known defeater.
      *   *Embarrassment:* If the chain is broken (e.g., a known era of myth-making) and yet the belief remains justified.

  ---

  ### V. Cruxes (Where Settlement Moves the Needle)
  *These are the sub-questions where an answer would force at least one of us to update significantly.*

  **Crux A: The Developmental Timeline**
  *   **Question:** Does trust precede the ability to track reliability?
  *   **Bearing Evidence:** Studies on infant gaze and word learning (e.g., Koenig & Echols).
  *   **Elena's Prediction:** Infants will show signs of tracking reliability (e.g., preferring accurate labelers) *before* or *simultaneously* with rapid word learning.
  *   **Marcus's Prediction:** Infants will accept information from any fluent speaker indiscriminately *until* a defeater is encountered later.
  *   **Update Condition:** If infants under 12 months show no discrimination between accurate and inaccurate speakers despite having the cognitive capacity to notice the error, Elena updates toward Marcus.

  **Crux B: The Circularity of Verification**
  *   **Question:** Can the Reductionist verify the reliability of testimony without using testimony?
  *   **Bearing Argument:** The "Argument from Coherence" (Coady).
  *   **Elena's Prediction:** Yes. We can cross-check testimony against perception and memory often enough to build a local inductive base without assuming global testimonial reliability.
  *   **Marcus's Prediction:** No. Any attempt to verify a source's reliability (e.g., checking a CV, watching them perform a task) relies on other testimonial claims (that the CV is real, that the task is what they say it is).
  *   **Update Condition:** If Elena cannot produce a non-testimonial method for verifying a source's identity and competence in a "new environment" scenario, she concedes the circularity charge.

  **Crux C: The LLM Ontology**
  *   **Question:** Does the lack of belief/intention in the source kill the testimonial status?
  *   **Bearing Case:** Case 4 above.
  *   **Elena's Prediction:** Epistemic norms for LLMs will align with tools (calibration, accuracy rates), not speakers (honesty, sincerity).
  *   **Marcus's Prediction:** Epistemic norms for LLMs will align with speakers (we feel *betrayed* by hallucination, not just misled by a broken tool).
  *   **Update Condition:** If users report normative reactions to LLM errors that match "lying" rather than "malfunction," Marcus's functional view gains ground; if they treat it purely as calibration, Elena wins.

  ---

  ### VI. Disagreements Table

  | Feature | Elena (Reductionist) | Marcus (Anti-Reductionist) |
  | :--- | :--- | :--- |
  | **Source of Justification** | Induction / Perception | Default Entitlement / Principle |
  | **Default Stance** | Neutrality / Suspicion | Trust / Credulity |
  | **Role of Defeaters** | N/A (Trust must be earned) | Central (Trust exists until defeated) |
  | **Child Development** | Implicit Induction | Innate Principle |
  | **LLM Status** | Instrument / Tool | Functional Speaker (Disputed) |
  | **Circularity Charge** | False (Local verification possible) | True (Reductionism is self-undermining) |

  ---

  ### VII. Load-Bearing Analysis
  *Post-Discussion Note from the Group*

  After reviewing the five cases, the reading group observes the following regarding the "load-bearing" nature of the disagreements:

  1.  **Case 1 (Theorem) is Scenery.** Both sides can accommodate this. Elena calls it reasoning; Marcus calls it reasoning *supported* by testimony. This distinction does not force a divergence in practical epistemology.
  2.  **Case 2 (Reliable Liar) is Scenery.** Both sides agree the belief is unjustified. This case fails to discriminate between the theories.
  3.  **Case 5 (Inherited Knowledge) is Scenery.** Both sides can explain this via long chains (Elena) or preserved entitlement (Marcus). It is too distant to test.
  4.  **Case 3 (Child) is Load-Bearing.** This is the empirical heart of the dispute. If children trust without data, Reductionism is psychologically implausible. If children track data before trusting, Anti-Reductionism is unnecessary.
  5.  **Case 4 (LLM) is Load-Bearing.** This is the conceptual heart of the dispute. It forces a definition of "speaker." If the Reductionist is right, testimony is just reliable information transfer. If the Anti-Reductionist is right, testimony requires a normative relationship between minds.

  **Recommendation:** We suggest Elena and Marcus suspend debate on Cases 1, 2, and 5. They should focus exclusively on the developmental psychology of Case 3 and the ontology of Case 4. If those are not resolved by the next bottle of wine, the group votes to move on to Virtue Epistemology.

  **Signed,**

  *Elena V.* (Reluctantly)
  *Marcus T.* (With Reservations)
  *The Rest of the Group* (Witnesses)
