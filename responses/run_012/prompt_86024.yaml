      *   "Self-critical." -> Explicitly state the "Choice Constraint."

  ( Self-Correction during drafting ): I initially thought about promising a defense of custodianship. But a good philosopher knows the regress is hard to beat. I should frame the proposal as *testing* the custodial move, with a high likelihood of finding it wanting, which is still a successful paper. The prompt asks me to "think carefully about framing." The strongest framing is one that admits the difficulty. I will frame the project as a "stress test."

  Let's write.

