answer: |-
  The principle is **generative fertility**: does handling anomalies open new empirical avenues, or just block falsification?

  Prout's patches demanded better measurement, eventually revealing isotopes (new ontology). Phlogiston's patches (e.g., negative weight) severed ties with measurement. Wegener unified data into a framework capable of future novelty; Cold Fusion couldn't even stabilize the initial claim reproducibly.

  **Steady-State Cosmology:** After the CMB (1965), this is **degenerating**. Hoyle's patches (iron dust) were purely defensive, absorbing the anomaly without predicting novel facts. Big Bang cosmology absorbed the CMB as a prediction.

  **Forced Verdict Update:** You must nuance **Prout**. During its active life, it was technically degenerating: it failed predictions and relied on ad hoc excuses (impurities). It looks progressive only in hindsight because a *successor* programme (isotopes) validated its intuition. You must distinguish the specific hypothesis (degenerating) from the broader heuristic (progressive).

  **Settled vs. Contested:**
  *Settled:* Reproducibility is a baseline (kills Cold Fusion). Ad hoc patches without new predictions signal degeneration (Steady-State).
  *Contested:* Does "hindsight fruitfulness" count? Lakatos insists progress must be continuous and immediate. Your gut (and many historians) allows for "sleeping programmes" (Wegener/Prout) that pay off later. This is the tension between methodological rules and historical narrative. If you demand continuous novelty, Wegener was degenerating until plate tectonics (1960s). If you allow latent fertility, he was progressive.

  The real difference lives in whether the patching generates **new instruments or questions**. Prout asked "measure better." Phlogiston asked "believe harder."
