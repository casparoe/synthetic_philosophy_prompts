answer: |-
  ### The Prediction

  She is going to tell you that the **face content is not conscious**, but she will likely concede that the **vague "something's there" feeling in the second condition is a conscious experience** (specifically, a conscious metacognitive state, not a visual one).

  For the main result (CFS faces, no report, FFA feedback, no ignition): **She will write it up as unconscious processing.**

  ### The Implicit Rule

  Your PI is running a **Higher-Order Thought (HOT) / Metacognitive theory**, but she is dressing it up in **Recurrent Processing Theory (RPT)** clothing to avoid the hard philosophical baggage of HOT.

  Here is the rule that fits every single one of her past verdicts:
  > **"Conscious experience requires First-Order Recurrent Processing (to generate content) PLUS a Higher-Order Metacognitive Signal (to make that content 'experienced'). Motor report is not required, but internal availability to the metacognitive system is."**

  Let's trace this through her history:
  *   **Blindsight (V1 lesion):** First-order recurrence in V1 is broken. No visual content generated. **Verdict: Unconscious.** (Fits).
  *   **Masked Priming:** Recurrence is interrupted by the mask before it stabilizes. No content. **Verdict: Unconscious.** (Fits).
  *   **Gorilla (Inattentional Blindness):** Stimulus hits V1, recurrence likely happens, *but* attention is not allocated. Without attention, no metacognitive model is built. **Verdict: Unconscious.** (Fits her irritation; attention is the gate to metacognition).
  *   **Covert Command-Following:** No motor report, *but* the patient generates mental imagery. This requires internal metacognitive agency ("I am imagining tennis"). **Verdict: Conscious.** (Fits her "don't need a report" line).
  *   **Dreams:** Internal generation + internal metacognitive availability. **Verdict: Conscious.** (Fits).
  *   **Type-2 Blindsight:** V1 is gone, so no first-order visual content (the face). But extrastriate pathways trigger a metacognitive "uncertainty" signal (the feeling). **Verdict: Face = No, Feeling = Yes.** (This is the smoking gun. She distinguishes the *content* from the *awareness of the content*).
  *   **Sperling Overflow:** She dodges this because it pits Rich Phenomenology (RPT) against Sparse Access (GWT). Her rule sidesteps this: if you can't metacognitively access it, it doesn't count as experience, regardless of how "rich" the early sensory trace is.

  ### The Competing Rules

  There are two other rules that fit most of her data, which is why you're confused.

  **1. Strict Global Workspace Theory (GWT)**
  *   **Rule:** Consciousness = Global Ignition (P3, Frontoparietal synchrony).
  *   **Fit:** Explains Blindsight, Masking, Gorilla, and your new CFS result (no P3).
  *   **Failure:** It struggles with the **Covert Command** case unless you assume ignition happened but wasn't measured. More importantly, it struggles to explain the **Type-2 Blindsight split**. In GWT, ignition is usually binary. If the "feeling" is conscious, there should be ignition. If the "face" isn't, there shouldn't be. Her willingness to split them suggests she thinks consciousness is layered (Content vs. Awareness), not all-or-none ignition.
  *   **Why she cites Recurrence:** She likely views recurrence as the *mechanism* for first-order content, but ignition as the *mechanism* for metacognitive access.

  **2. Pure Recurrent Processing Theory (RPT)**
  *   **Rule:** Consciousness = Any Local Recurrent Loop (Feedback).
  *   **Fit:** Explains Covert Command, Dreams, and your new CFS result (FFA feedback is present).
  *   **Failure:** It completely fails **Blindsight** (some loops exist there) and **Masked Priming** (some loops exist there). Crucially, it fails the **Gorilla** case. If recurrence is sufficient, the unattended gorilla should be conscious. Her irritation at the "attention" comment suggests she thinks attention is *constitutive*, not just modulatory. Pure RPT says attention just selects *which* conscious things you remember; she seems to think attention helps *make* them conscious.

  ### The Critical Experiment

  To separate your PI's **Metacognitive-RPT Hybrid** from **Strict GWT**, you need to dissociate **Metacognitive Access** from **Global Ignition**.

  **The Proposal:** **No-Report Attentional Cueing with Neural Decoding.**
  1.  Run the CFS paradigm.
  2.  On some trials, use an exogenous cue (a flash at the location of the suppressed face) to draw attention *without* the subject knowing what the object is.
  3.  Measure FFA feedback (Recurrence), P3 (Ignition), and ask for a simple "Did you see *anything*?" (Metacognitive report).

  **The Separation:**
  *   **If she is Strict GWT:** She will say the subject is unconscious unless the P3 appears. Even if they say "I felt something," if there's no P3, she'll call it a guess.
  *   **If she is Pure RPT:** She will say the subject is conscious of the face as soon as FFA feedback is stable, regardless of report or P3.
  *   **If she is your PI (Metacognitive-RPT):** She will say the subject is conscious **only if they report the feeling**, even if the P3 is weak or absent, *provided* the FFA feedback is there. She cares about the *internal availability*, not the global broadcast.

  **Better yet:** **Disrupt Metacognition.** Apply TMS to anterior prefrontal cortex (aPFC) to disrupt metacognitive monitoring while leaving FFA recurrence intact.
  *   **GWT:** Disruption kills ignition -> Unconscious.
  *   **RPT:** Disruption doesn't touch FFA -> Conscious.
  *   **PI:** Disruption kills the "feeling" but leaves the processing -> **Unconscious experience (despite intact FFA feedback).** This is the specific prediction that validates her Type-2 Blindsight stance.

  ### The Flip Condition

  If you want to know what would make her call the main CFS result (Condition 1, no report) **Conscious**:

  She would have to admit that **First-Order Recurrence is sufficient for Phenomenality, even without Metacognitive Access.**

  You would see this if she suddenly started arguing that **Type-2 Blindsight patients *do* see the faces, they just can't report it.** If she collapses the distinction between the "feeling" and the "face" in Type-2 blindsight, she has abandoned the Metacognitive layer and moved to **Pure RPT**.

  Conversely, if she calls the **Covert Command patient Unconscious** because "we didn't see a P3," she has abandoned her "don't need a report" stance and moved to **Strict GWT**.

  **Summary for your write-up:**
  Frame the FFA feedback as **"task-positive recurrent processing"** rather than "conscious activation." Frame the lack of P3 as **"lack of global access."** Frame the second condition ("something's there") as **"metacognitive awareness without perceptual clarity."** That phrasing hits her implicit rule exactly: it acknowledges the recurrence (RPT cred), denies the ignition (GWT cred), and isolates the feeling (HOT cred).
