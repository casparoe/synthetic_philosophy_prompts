  2.  **Deconstruct the Debate Moves:**

      *   **Move 1 (Philosopher/Exclusionist):** The Exclusion Argument.
          *   *Claim:* Neural event realizes belief + is sufficient for effect. Therefore, belief is redundant (excluded). Belief doesn't cause neural event (supervenience). Belief is a passenger.
          *   *Analysis:* This is the classic Jaegwon Kim-style exclusion argument. It relies on the Causal Closure of the Physical and the Supervenience of the Mental.
          *   *Verdict:* Defensible (it's a standard, rigorous argument), but controversial premises (closure, sufficiency).

      *   **Move 2 (Neuroscientist):** The Retention/Regression Objection.
          *   *Claim:* If sufficiency excludes the level above, it excludes *all* levels down to physics. This leads to absurdity (only fundamental particles cause anything). We cite causes at many levels routinely.
          *   *Analysis:* This is the "causal drainage" or "retention" argument against exclusionism. It appeals to scientific practice (multi-level explanation).
          *   *Verdict:* Defensible/Strong. It highlights the counter-intuitive consequences of strict exclusionism.

      *   **Move 3 (Philosopher):** The "Levels" Critique.
          *   *Claim:* "Levels" is vague. Higher-level properties are just redescriptions unless they have *own* powers. Redescription $\neq$ Causation. Otherwise, causal explosion.
          *   *Analysis:* Challenges the ontological status of "levels." Distinguishes ontology (what exists/causes) from epistemology (how we describe).
          *   *Verdict:* Defensible. It forces the scientist to clarify the metaphysics, not just appeal to practice.

      *   **Move 4 (Neuroscientist):** Interventionist Criterion (Manipulability).
          *   *Claim:* Cause = Intervention changes effect (ceteris paribus). We can intervene on belief (change belief -> change relief). Therefore, belief is a cause.
          *   *Analysis:* Appeals to Woodward-style manipulationist accounts of causation. Very common in sciences.
          *   *Verdict:* Clearly Right (within the framework of interventionism). It operationalizes causation.

      *   **Move 5 (Philosopher):** The Intervention Rebuttal.
          *   *Claim:* Intervening on belief *is* intervening on neural realizer. No independent work. Criterion admits incidental difference-makers (confounds).
          *   *Analysis:* Argues that intervention doesn't prove *ontological* independence, just correlation via the physical base. Also worries about "difference-making" vs. "production."
          *   *Verdict:* Defensible. It points out that interventionism might track dependence, not necessarily distinct causal *powers*.

      *   **Move 6 (Neuroscientist):** The Grain/Specificity Argument.
          *   *Claim:* Neural story is too specific (micro-details irrelevant). Belief is the "right grain" (proportional cause).
          *   *Analysis:* Appeals to the principle of proportionality (Yablo, Woodward). Causes should be specific enough but not too specific.
          *   *Verdict:* Defensible/Strong. It addresses *why* the mental level is preferable, not just that it works.

      *   **Move 7 (Philosopher):** Explanation vs. Causation Distinction.
          *   *Claim:* "Right grain" is about *explanation* (pragmatic), not *causation* (ontological). Making causation depend on salience is subjective.
          *   *Analysis:* Rigidly separates metaphysics from epistemology. Causation is mind-independent; explanation is mind-dependent.
          *   *Verdict:* Defensible (classical view), but potentially outdated given modern causal modeling.

      *   **Move 8 (Neuroscientist):** The Challenge to Ontology.
          *   *Claim:* Name the level where regress stops. Don't stop where convenient for your ontology.
          *   *Analysis:* Puts the burden of proof back on the philosopher to define the "fundamental" without arbitrariness.
          *   *Verdict:* Defensible/Strong. It exposes the arbitrariness of privileging the physical base without a clear cutoff.

  3.  **Synthesize and Evaluate "Who is Missing What":**
      *   *Philosopher:* Focused on *production* (oomph, transfer of energy/conservation). Worried about overdetermination. Ignores that causation might be about counterfactual dependence rather than physical pushing.
      *   *Neuroscientist:* Focused on *dependence* and *prediction/control*. Assumes scientific practice settles metaphysics. Might be glossing over the hard problem of how abstract states physically move matter.
      *   *Common Ground:* Both agree the physical world is causally closed (mostly). They disagree on whether "causation" requires physical production or counterfactual dependence.
      *   *Talking Past Each Other?* Yes, largely. One talks metaphysics (what *is* a cause), the other talks methodology (how we *find* causes).

