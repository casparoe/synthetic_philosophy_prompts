answer: |-
  You are right to lose sleep over this, but you are also right to reject conclusion (7). This argument is a sophisticated version of a classic problem in legal and political theory known as the **Kompetenz-Kompetenz problem** (the competence of competence): *Who decides who has the power to decide?*

  It is a powerful critique, often leveled by legal realists and skeptics of federalism. However, it relies on a specific logical trap that you have intuitively spotted but haven't quite named.

  Here is the breakdown of where the argument breaks, why it looks convincing, what you lose by fixing it, and why your fear about "limited government" is both valid and manageable.

  ### The Break: Steps (5) and (6)

  The argument fails at **(5) and (6)**. These steps present a **False Dichotomy**.

  The argument assumes that the determination of competence must be made *unilaterally* by either the Lower Level or the Higher Level. It assumes a hierarchical model of sovereignty where, ultimately, one actor must have the final, unreviewable word in a vacuum.

  *   **Step (5)** assumes that if the lower level has a say, they have the *final* say without consequence.
  *   **Step (6)** assumes that if the higher level has a say, they have the *final* say without constraint.

  **Why it looks fine:** It appeals to a Hobbesian intuition: in any conflict, someone must win. If there is a dispute over who has jurisdiction, eventually a court or a legislature must resolve it. Therefore, one side "decides."

  **Why it is wrong:** In constitutional federalism, the "decision" is rarely unilateral. It is **procedural, distributed, and burdened.**

  ### How to Fix It (Without Accepting 7)

  You can reject (7) by redefining what the principle of subsidiarity *does*. It is not a magic spell that automatically allocates power; it is a **rule of procedure and burden of proof.**

  **1. Subsidiarity shifts the Burden of Proof.**
  Without subsidiarity, the default assumption in many systems is that the central government has plenary power unless explicitly forbidden. *With* subsidiarity, the default assumption is that the lower level retains power unless the higher level can *demonstrate* necessity.
  *   **The Work It Does:** Even if the higher level ultimately wins the argument (as in your classmate's Step 6), the principle forced them to articulate a justification, gather evidence, and face political scrutiny. That is not "empty." It raises the transaction cost of centralization.

  **2. The Decision is Distributed (The Institutional Fix).**
  Your examples (Germany, Switzerland, EU) prove that the "decider" is not a single level of government, but a **mechanism** that requires interaction between them.
  *   **Germany:** The *Bundesrat* isn't the "lower level deciding." It is the lower level *participating in the higher level's decision*. This breaks the binary of (5) and (6).
  *   **EU Yellow Card:** National parliaments cannot *stop* the Commission unilaterally (avoiding Step 5). But they can force a review and create political embarrassment (avoiding Step 6). The Commission must "go back and look again." That "looking again" is the work of subsidiarity.
  *   **Courts:** In the US and Germany, Constitutional Courts decide competence. They are theoretically a third party bound by precedent and text, not merely an agent of the "higher level."

  ### The Cost: What You Give Up

  If you reject (5) and (6) to save (7), you must accept a cost. You cannot have it both ways.

  **You lose the idea that Subsidiarity is a Self-Executing Rule.**
  You must admit that subsidiarity is not a mathematical formula that spits out the correct level of government. It is a **political norm enforced by institutions.**
  *   **The Cost:** This means subsidiarity can fail. If the Constitutional Court is captured, or if the political culture shifts toward centralization (as it has in the US since the New Deal, or the EU during crises), the "lower level" loses.
  *   **The Trade-off:** You exchange *certainty* for *resistance*. Subsidiarity doesn't guarantee the local level wins; it guarantees the local level gets a fighting chance and that centralization requires a higher justificatory bar.

  ### Addressing Your Deeper Fear: "The Limited Government Paradox"

  You wrote: *"The same shape of argument looks like it would sink any rule that divides authority at all... because in every case somebody has to draw the line, and if the line-drawer controls the line then the line isn't a constraint."*

  This is the **Paradox of Constitutionalism**. If the Constitution limits the government, but the government (via the Courts or Legislature) interprets the Constitution, doesn't the government limit itself?

  **The Solution:** James Madison's answer in *Federalist No. 51*.
  Ambition must be made to counteract ambition. The line is not held by a piece of paper; it is held by **competing power centers.**
  *   In the US, the States sue the Federal Government.
  *   In the EU, National Parliaments issue Yellow Cards.
  *   In Germany, The Bundesrat votes on Federal laws.

  The constraint is not logical; it is **structural and political.** The "line-drawer" (e.g., the Supreme Court) is constrained not by logic, but by the fact that if they draw the line too wildly, they lose legitimacy, funding, or compliance from the other branches/levels.

  So, your classmate's argument proves that **no legal text can enforce itself.** But it does not prove that legal texts are useless. They provide the ammunition for the political struggle.

  ### Summary for Your Seminar

  If you want to sleep, and if you want to speak up in section, here is the synthesis:

  1.  **The Classmate is right about Logic, wrong about Politics.** Logically, someone must have the final say (*Kompetenz-Kompetenz*). But politically, that "say" is constrained by procedure, veto points, and the burden of proof.
  2.  **Subsidiarity is a Presumption, not a Boundary.** It doesn't draw a bright line; it creates a slope. It makes centralization harder, slower, and more expensive, even if it doesn't make it impossible.
  3.  **The "Help" (Subsidium) is Key.** Your professor is right. If the higher level intervenes, it must do so in a way that *supports* the lower level's capacity, not just replaces it. This is a substantive constraint on *how* power is used, not just *who* uses it.
  4.  **The Cost.** Admit that subsidiarity is fragile. It relies on a culture that values localism. Without that culture, the "higher level" will indeed interpret competence broadly (Step 6). But that is a failure of politics, not a failure of the principle's logic.

  **Verdict:** Keep your denial of (7). Reject (5) and (6) as a false dichotomy that ignores **procedural constraints** and **distributed authority**. The price you pay is acknowledging that federalism is a constant struggle, not a settled state of affairs. That is not a bug; it is a feature.

  Now, go to sleep. The line-drawers are constrained by the fact that they need you to believe in the line.
