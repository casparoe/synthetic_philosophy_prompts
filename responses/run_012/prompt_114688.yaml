answer: |-
  1. Welfarism must concede that maximizing aggregate satisfaction may require artificially restricting access to certain goods, since universal availability collapses the utility they generate. This forces a trade-off between egalitarian access and the preservation of the very welfare being measured.
  2. Resourcism is undermined because equalizing the means to acquire these goods fails to equalize their value, revealing that resources are not neutral carriers of worth when social context dictates meaning. Consequently, resource-based metrics will systematically overestimate the actual equality achieved in the pilot.
  3. The capability approach must abandon the assumption that expanding freedom is always beneficial, acknowledging that enhancing everyone's capability to achieve a functioning can destroy the value of that functioning itself. This requires evaluating not just what people can do, but whether doing it remains meaningful when others do it too.
  4. All three views are forced to admit that no single currency can capture value that is inherently relational, implying that the search for a universal metric of equality is fundamentally misguided. This suggests the debate needs a different question rather than a better answer, focusing on which social relations should be protected from equalization.
  5. For your pilot evaluation, this implies that success cannot be measured by increased access alone, but must account for whether participants' new resources actually secure the relational status they seek. You must assess whether the income supplement alters the social scarcity that gives these stubborn goods their worth.
