prompt: |-
  im in my school's philosophy club and next thursday im running the whole 40 minutes on whether stuff in video games is real — is my minecraft sword an actual thing, and if someone blows up my base is that a real harm or just pixels. audience is about a dozen juniors, none of them have read any philosophy, and i already know how theyre gonna split: half think "its just a game so nothing in there is real," half think "obviously its real, i can see it on the screen and i can lose it." someone is definitley going to say "so unicorns are real too then." dont explain the topic to me, plan how i explain it — whats the order the ideas have to come in, what one example carries the whole thing, where in the sequence i head off each misconception, and one question i can ask at the end to see if it landed. no reading list, i cant assign anything and i dont want to name-drop stuff at them.

  heres the thing i want to build it on, tell me if it can carry the weight: a sword in a game is kind of like a character in a book. its not made of anything, you cant trip over it, but you can point at it and say true things about it, and if the game never says how much it weighs then theres no fact of the matter about its weight — not that its weightless, just that the question has no answer. i want that to do the heavy lifting on the "is it real" half, then turn to whether wrecking someones base is a real harm or just something happening to an image on a screen.

  give it back as json i can paste into my notes, with these fields: "sequence" (array of objects with "step", "idea", and "why_it_has_to_come_here"), "carrying_example" (object with "example", "must_have", "must_avoid"), "misconceptions" (array of objects with "misconception", "when_it_comes_up", and "how_i_head_it_off"), "check_for_understanding" (object with "question", "what_a_good_answer_has", "what_a_bad_answer_has"), and "cut" (array of objects with "what" and "why_skip").
