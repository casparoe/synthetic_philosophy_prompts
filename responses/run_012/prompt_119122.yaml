          *   Nuance: Historians care about the *realized* path, not the counterfactual mean.
      *   *Claim 3: Environmental Determinism (Explanatory & Political Sin).*
          *   CI Translation: Omitted Variable Bias (OVB), Overfitting/Selection Bias (Explanatory). Normative constraints on model specification (Political).
          *   Nuance: The political charge isn't about bias in the estimate, but bias in the *question*.

  3.  **Drafting the Translations (Iterative refinement for technical accuracy):**

      *   *Translation 1:* Instead of "background covariates," treat environmental factors as $T$ (treatment) or $Z$ (instrument). They must satisfy exclusion restriction and exogeneity ($Z \perp \!\!\! \perp \epsilon$). The claim is that $ATE \neq 0$ and is structurally significant.
      *   *Translation 2:* Rejection of $ATE$ (Average Treatment Effect). Focus on $ATT$ (Effect on Treated) but even narrower: the specific realization. Emphasis on interaction terms ($T \times Context$) where the interaction is non-separable. Path dependence = dynamic causal models where $Y_t$ depends on $Y_{t-1}$ and history of $T$.
