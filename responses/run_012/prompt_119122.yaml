answer: |-
  This is a sharp interface between two epistemologies that often talk past each other. You are speaking the language of *identification and estimation*; environmental historians are speaking the language of *narrative and responsibility*.

  Here is the translation of the three historical claims into your causal vocabulary, followed by the residue report where the mapping fails.

  ---

  ### Part 1: The Translation

  #### 1. The Claim: Non-human causes are "actors," not scenery.
  **CI Translation:**
  This is a claim about **exogeneity and instrument validity**.
  In a standard model, climate or pathogens are often treated as fixed covariates ($X$) or background context. The historian claims they should be modeled as the Treatment ($T$) or, more likely, an Instrument ($Z$) that drives variation in social outcomes ($Y$) through specific channels.
  *   **Formalism:** $Z_{volcano} \perp \!\!\! \perp \epsilon_{social}$ (Exogeneity).
  *   **Identification:** The claim is that $Z$ satisfies the exclusion restriction ($Z \to Y$ only via $T$) and has a strong first stage ($Z \to T$).
  *   **Implication:** By calling them "actors," they are asserting that these variables possess **autonomous variation** independent of the social system. They are not confounded by human decisions ($T \not\to Z$). They are asserting that the coefficient $\beta$ on the environmental variable is structurally stable and non-zero, warranting a $do(Z)$ intervention interpretation, not just a conditional expectation $E[Y|Z]$.

  #### 2. The Claim: This flattens contingency; we want *this* sequence, not average effects.
  **CI Translation:**
  This is a rejection of the **ATE (Average Treatment Effect)** in favor of a **unit-specific realized effect** with **path dependence**.
  *   **Formalism:** The historian rejects $E[Y_i(1) - Y_i(0)]$ across a population $i \in I$. They argue $N=1$ (the specific society/epoch) and that the potential outcomes are not exchangeable across time or space.
  *   **Mechanism:** They are emphasizing **dynamic causal models** where $Y_t$ is a function of $Y_{t-1}$ and the history of treatments $\bar{T}_t$.
  *   **Heterogeneity:** They are claiming that Treatment Effect Heterogeneity is so extreme (interaction terms $T \times Context$ are non-separable) that the "main effect" is meaningless.
  *   **Goal:** They want to identify the specific causal chain (mediation analysis) for the *factual* world, rather than estimating the expected difference between hypothetical worlds. They care about the *realized* counterfactual path, not the *average* counterfactual.

  #### 3. The Claim: Environmental Determinism is a sin (Explanatory & Political).
  **CI Translation:**
  *   **Explanatory Sin:** This is an accusation of **Model Misspecification** and **Selection Bias**. It claims the researcher is cherry-picking cases where $Z \to Y$ holds (selection on outcomes) or omitting time-varying confounders ($L_t$) that correlate with both environment and social resilience. It accuses the model of overfitting noise ($Var(\epsilon)$) and calling it signal.
  *   **Political Sin:** This is a claim about **Omitted Variable Bias with Normative Consequences**. It argues that by attributing variance in $Y$ (e.g., societal collapse) to $Z$ (climate), the model mechanically reduces the variance attributable to $T_{human}$ (policy/elite action).
  *   **Formalism:** If $Y = \beta_1 Z + \beta_2 T_{human} + \epsilon$, increasing the explanatory power of $Z$ (via specification choices) shrinks $\hat{\beta}_2$ or $Var(T_{human})$. The charge is that this specification choice is not neutral; it functions to exonerate human agents by treating $T_{human}$ as constrained or irrelevant.

  ---

  ### Part 2: The Residue Report

  Here is what slips through the net when you run these translations.

  #### 1. Agency: "Actor" vs. "Node with Non-Zero Coefficient"
  **The Residue:**
  In your DAG, a node is passive. It waits to be intervened upon ($do(X)$). When historians call a pathogen an "actor," they are importing a slice of **ontology** that CI strips away. They aren't just saying $Z$ is exogenous; they are implying $Z$ has a *teleology* or a *force* that disrupts the equilibrium of the system in a way that feels agential.
  *   **Does it carry a claim?** Yes. It claims that the *source* of the variation is external to the human causal closure. But it also often smuggles in a rhetorical claim about *moral standing* or *power*.
  *   **Verdict:** **CI Limitation.** Your framework assumes variables are ontologically flat (all nodes are equal). History treats some nodes as "forces." CI cannot distinguish between a "background variable" and an "agent" except by exogeneity status. If a human variable is perfectly exogenous (e.g., a random dictator's birth), CI treats it the same as a volcano. History treats them differently. The residue is the *meaning* of the cause, not the *structure*.

  #### 2. Determinism: "Structural" vs. "Historical"
  **The Residue:**
  This is a **pun**.
  *   **CI Determinism:** In a Structural Causal Model (SCM), $Y = f(X, U)$. If $Var(U) \to 0$, the system is deterministic. This is about functional noise.
  *   **Historical Determinism:** This is about the **support of the counterfactual distribution**. When historians cry "determinism," they mean the researcher is claiming that given $Z$, the probability of $Y$ was 1 (or near 1). They mean: *Human agency had no room to operate.*
  *   **Verdict:** **Historical Vagueness.** The historians are often imprecise here. They conflate "high $R^2$" with "no free will." Your framework handles this cleanly: you can have a strong $\beta_{climate}$ and still have residual variance where human agency operates. The residue exists because historians use "determinism" as a moral slur, not a statistical description. They are objecting to the *implication* of the model, not the model itself.

  #### 3. The Political Charge: "Pernicious Enterprise"
  **The Residue:**
  You asked if CI has a slot for "the enterprise is pernicious regardless of execution."
  *   **CI View:** CI is a tool for truth-seeking. Bias is a technical failure (confounding), not a moral one. If the estimate is unbiased, the inquiry is valid.
  *   **Historical View:** Some questions are **constitutively harmful**. Asking "Did climate cause the fall of Rome?" might be technically answerable, but the act of asking it shifts the *Overton Window* of explanation away from human responsibility.
  *   **Verdict:** **CI Limitation.** CI has no module for the *ethics of inquiry*, only the *ethics of design* (e.g., don't hurt subjects). CI assumes that identifying the true $\beta$ is inherently good. It cannot formalize the claim that "True $\beta_{climate} > 0$ is a dangerous truth to propagate." That requires a loss function that includes social stability or moral accountability, which is outside the identification assumptions.

  #### 4. Narrative/Sequence: "Mediation" vs. "The Plot"
  **The Residue:**
  Your instinct is to call this **Mediation** or **Heterogeneous Treatment Effects**.
  *   **CI View:** We can model $Z \to M \to Y$. We can model $Y_t$ depending on $Y_{t-1}$. We can estimate CATEs (Conditional Average Treatment Effects) for specific contexts.
  *   **Historical View:** They don't just want the path coefficients; they want the **logic of the sequence**. They want to know *why* the mediation happened. For example, *why* did drought lead to revolt in Case A but migration in Case B?
  *   **The Slip:** CI identifies *that* $M$ mediates. History wants the *mechanism* inside the black box of $M$. But deeper: Historians care about **conjunctural causation**. It's not just $X_1 + X_2 \to Y$. It's $(X_1 \times X_2 \times X_3) \to Y$, where the combination is unique and non-repeatable.
  *   **Verdict:** **CI Limitation (Semantics).** CI can model the *structure* of the sequence (DAGs over time), but it cannot model the *semantics*. CI treats "Revolt" as a binary $0/1$. History treats "Revolt" as a concept with internal meaning that changes based on the sequence. If the sequence changes the *definition* of the outcome variable itself, CI breaks (violates consistency/positivity). The residue is that history is often about **concept formation**, not just variable variation.

  ---

  ### Summary Verdicts

  | Residue | Is it CI Missing Something? | Or Historical Vagueness? | Notes |
  | :--- | :--- | :--- | :--- |
  | **Agency** | **Yes.** | No. | CI flattens ontology. It cannot distinguish "force" from "covariate." |
  | **Determinism** | No. | **Yes.** | Historians conflate statistical fit with philosophical necessity. |
  | **Politics** | **Yes.** | No. | CI lacks a normative loss function for *question selection*. |
  | **Narrative** | **Yes.** | Partial. | CI handles temporal order, but not *meaningful* conjunctural causation. |

  ### The Bottom Line for Your Work
  You feel the slip because you are trying to map **interpretive claims** onto **identification strategies**.

  1.  **On Agency:** You can translate "actor" as "exogenous source of variation." But acknowledge that historians use "actor" to demand you treat the variable as a *constraint* on the system, not just a regressor.
  2.  **On Determinism:** Call their bluff. Show them the error term. If $Var(U) > 0$, agency exists in your model. The dispute is usually about the magnitude of $\beta_{climate}$, not the existence of $U$.
  3.  **On Politics:** Acknowledge this is outside your scope. You estimate parameters; they evaluate consequences. But warn them that "political sin" often masks "identification sin" (they hate the result because it contradicts their prior, not because the DAG is wrong).
  4.  **On Narrative:** Your instinct to use mediation is correct *structurally*. But admit that CI cannot capture the *qualitative logic* of the mediation. You can estimate the ACME (Average Causal Mediation Effect), but you can't tell the story of *why* the mediator fired.

  The residue isn't noise; it's the difference between **explaining variance** (your job) and **explaining meaning** (their job). You can model the cause of the fall of Rome; you cannot model the *tragedy* of the fall of Rome.
