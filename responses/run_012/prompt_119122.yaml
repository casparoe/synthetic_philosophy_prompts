  2.  **Deconstruct the Three Historical Claims & Translate:**

      *   *Claim 1: Non-human causes are agents, not scenery.*
          *   CI Translation: Exogeneity, Exogenous Shocks, Instruments. Treating $X$ (volcano) as $Z$ (instrument) or $T$ (treatment) rather than fixed context.
          *   Nuance: "Agent" implies more than just $X \to Y$. It implies autonomy or independent variation.
      *   *Claim 2: Flattens contingency; want explanation of *this* sequence, not average effects.*
