  4.  **Developing the Residue Report (The Core Analysis):**

      *   *Residue 1 (Agency):* CI sees nodes. History sees "actors."
          *   *Analysis:* CI assumes variables are passive. History implies a kind of "force." Is this anthropomorphism or a claim about independence?
          *   *Verdict:* Mostly rhetoric/ontology, but points to *autonomy* of the variable (truly exogenous vs. merely uncorrelated).
