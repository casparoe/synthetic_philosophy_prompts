  If the model insists the subscription has fully lapsed, the reader's emotion lacks an object. To claim the reader still feels grief for an existing character is to claim the reader still believes the character exists, collapsing the model into illusion theory. Conversely, if the model claims the reader merely pretends to grieve after the lapse, it collapses into make-believe theory, contradicting the sincerity of the donation and the phenomenology of loss.

  To accommodate the case without these collapses, the model must argue that the subscription's ontological effects persist beyond the reading act. It must claim that the character retains a form of "subscribed existence" in the reader's mind even after the text is finished. This allows the grief to be directed at a genuinely missed object without requiring standing belief in the character's reality. The donation signifies a moral obligation derived from the subscribed existence; if the subscription truly lapsed, the obligation should vanish. Retaining the obligation requires retaining the subscriber status. However, this modification surrenders the model's defining commitment: that the subscription is strictly temporary and co-extensive with engagement. By allowing the presuppositions to linger, the model blurs the line between suspension and belief, effectively admitting that fiction can alter existential standing permanently, however slightly. Thus, the model survives the case only by ceasing to be strictly about temporary subscription and becoming a theory of residual ontological impact. This preserves the rationality of emotion without requiring delusion, but it costs the model its sharp distinction from theories of lasting belief modification. Ultimately, the subscription becomes a permanent amendment to the reader's ontology, not a temporary lease.

