prompt: |-
  My flatmate has exactly one move in every argument and I'm sick of it. Whatever I say I'm going to do, he asks "what if everyone did that?" and then sits back like the case is closed. Last week it was me taking a sick day when I wasn't really sick — fine, that one landed. But he pulled the same line when I said I was going to blow off my sister's engagement party for a festival I'd already bought tickets to (I don't see the catastrophe if everyone did that — everyone would just be at festivals?), and when I said I wasn't going to vote because my one vote does nothing. And the one that actually got me: I said I'd tell my mate the truth about a shirt he'd bought, knowing it would hurt him, and I genuinely cannot tell whether the question says I should tell him or that I shouldn't. He's convinced the whole thing is just Kant and that Kant settles it.

  I dont think the question is one thing. Can you lay out the different precise things "what if everyone did that?" could actually be claiming, from the trivial to the radical — the Golden Rule-ish reading, whatever Kant's actual test is (I know he's got more than one version and I dont trust that they all agree), the "society would fall apart" reading that I suspect is just rule-consequentialism wearing Kant's coat, the bare "you'd be a hypocrite" consistency reading, and the free-rider reading — and for each one say what it's actually committed to, whether it's plausible on its own, and whether it gets him his conclusion ("so don't do it") in each of the four cases above. I also want your guess at which reading he's actually reaching for when he says Kant, because I'm fairly sure what he really means is "the world would be worse off if everyone did it," and I'm fairly sure that's not the same claim at all.

  Two things that bug me and I'd like folded in. First: does it matter how you describe what I'm doing? "Take a sick day," "take a sick day when you're not sick but burnt out," "take a day off work when you need it" — I can feel the verdict flipping depending on which one we pick, and if that's true I want to know whether it's a bug in the test or the whole point of it. Second: who counts as "everyone"? Everyone in my exact situation, everyone who could do the thing, or literally every person alive? Because if it's literally everyone then half the things he uses it on are impossible for most people to do at all, and that can't be what he means.

  Lay it out as a list I can take back to him.
