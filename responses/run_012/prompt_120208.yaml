      *   **2. Kant's Categorical Imperative (Formula of Universal Law):** "Act only according to that maxim whereby you can at the same time will that it should become a universal law."
          *   *Commitment:* Logical contradiction in conception or will. Not about outcomes, but about consistency of rational agency.
          *   *Plausibility:* Rigorous but rigid.
          *   *Cases:* Sick day (Deception undermines trust), Party (Promise/Expectation violation?), Voting (Contradiction in will?), Shirt (Duty of truth vs. duty of kindness).
      *   **3. The Golden Rule / Reciprocity:** "Do unto others..."
          *   *Commitment:* Empathy/Fairness. Would *you* want it done to *you*?
          *   *Plausibility:* Good for interpersonal, weak for systemic issues like voting.
