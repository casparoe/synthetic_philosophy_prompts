          *   *Cases:* Applies to all if the user claims others shouldn't do it.

  3.  **Address the Two "Bugs":**
      *   *Maxim Formulation:* Kant explicitly says the *maxim* matters. "Lie to get out of work" vs. "Rest when mentally incapacitated." This is a feature, not a bug, but allows manipulation.
      *   *Scope of "Everyone":* It means "all rational agents in relevantly similar circumstances." Not literally every human (babies can't vote), but everyone in the *position* to do the act.

  4.  **Evaluate the Flatmate's "Kant" Claim:**
