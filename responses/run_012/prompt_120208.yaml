answer: |-
  Here is a breakdown you can take back to your flatmate. It separates the five distinct ethical arguments hiding inside the phrase "What if everyone did that?" and tests them against your four cases.

  ### 1. The "Social Collapse" Reading (Rule-Consequentialism)
  *   **The Claim:** "If everyone did X, the resulting world would be terrible/unstable. Therefore, you shouldn't do X."
  *   **What it's committed to:** This is **not** Kant. This is Utilitarianism applied to rules. It cares entirely about *outcomes*. It argues that your individual act is morally wrong because it contributes to a pattern that leads to bad consequences.
  *   **Plausibility:** High intuitive appeal, but logically shaky. It punishes you for a catastrophe *you* didn't cause (since everyone isn't actually doing it).
  *   **The Verdict on Your Cases:**
      1.  **Sick Day:** **Don't do it.** If everyone faked sickness, trust in employment would collapse.
      2.  **Sister's Party:** **Don't do it.** If everyone skipped family milestones for festivals, family cohesion would dissolve.
      3.  **Voting:** **Don't do it.** If everyone abstained, democracy would fail.
      4.  **The Shirt:** **Don't do it.** If everyone was brutally honest about aesthetics, social confidence would be shattered.
  *   **Does it get him his conclusion?** Yes, in all four cases.
  *   **Is it Kant?** No. Kant explicitly rejected this. For Kant, an action can be wrong even if the consequences are good, and right even if the consequences are bad.

  ### 2. The "Logical Contradiction" Reading (Kant's Actual Test)
  *   **The Claim:** "Can you conceive of a world where everyone does X without contradicting the very definition of the act?" (Contradiction in Conception) OR "Can you *will* such a world without contradicting your own rational goals?" (Contradiction in Will).
  *   **What it's committed to:** Consistency of rational agency. It's not about the world being *worse*; it's about the world becoming *impossible* or your will becoming *incoherent*.
  *   **Plausibility:** Philosophically rigorous, but often feels abstract.
  *   **The Verdict on Your Cases:**
      1.  **Sick Day:** **Don't do it.** The institution of "sick leave" relies on the concept of illness. If everyone takes it when not sick, the concept loses meaning. (Contradiction in Conception).
      2.  **Sister's Party:** **Maybe do it.** There is no logical contradiction in a world where people prioritize festivals over parties. However, you might have a prior *duty* to family you are violating. (Weak case for "Don't").
      3.  **Voting:** **Don't do it.** You benefit from a democratic system. To will that no one votes is to will the destruction of the system you rely on. (Contradiction in Will).
      4.  **The Shirt:** **Tell the truth.** Kant is famous for strict truth-telling. A world where everyone lies about shirts undermines communication. However, if your maxim is "Be cruel," universalizing that makes trust impossible. (Strict Kant says: Tell the truth. Your flatmate is likely wrong here if he claims to be Kantian).
  *   **Does it get him his conclusion?** Yes on Sick Day and Voting. Debatable on Party. **No on the Shirt** (unless he frames the act as "being cruel" rather than "telling truth").

  ### 3. The "Free-Rider" Reading (Fair Play)
  *   **The Claim:** "You benefit from others following the rule, so it is unfair for you to exempt yourself."
  *   **What it's committed to:** Fairness and reciprocity within a cooperative scheme.
  *   **Plausibility:** Very strong for systemic issues (taxes, voting, queues), weak for personal relationships.
  *   **The Verdict on Your Cases:**
      1.  **Sick Day:** **Don't do it.** You rely on colleagues covering for you when you *are* sick; taking a fake day exploits their labor.
      2.  **Sister's Party:** **Don't do it.** (Weak). You benefit from family love, but a party isn't a cooperative scheme like a voting system.
      3.  **Voting:** **Don't do it.** Classic free-rider problem. You enjoy the government elected by others without paying the 'cost' of voting.
      4.  **The Shirt:** **Tell the truth.** Friendship is a cooperative scheme of trust. Lying exploits his trust in you.
  *   **Does it get him his conclusion?** Yes on Sick Day and Voting. Weak on Party. Opposite conclusion on the Shirt (assuming honesty is the norm of friendship).

  ### 4. The "Golden Rule" Reading (Reciprocity)
  *   **The Claim:** "Would you want everyone to do this *to you*?"
  *   **What it's committed to:** Empathy and reversibility.
  *   **Plausibility:** Good for interpersonal harm, bad for impersonal duties.
  *   **The Verdict on Your Cases:**
      1.  **Sick Day:** **Don't do it.** Would you want your employees to fake sickness? (If you're the boss). Would you want your coworkers to leave you with their work?
      2.  **Sister's Party:** **Don't do it.** Would you want your sister to skip your engagement party?
      3.  **Voting:** **N/A.** Your vote doesn't directly affect me, so I can't really object to you not voting from a self-interested perspective.
      4.  **The Shirt:** **Don't do it.** Would you want a friend telling you your clothes are ugly?
  *   **Does it get him his conclusion?** Yes on Party and Shirt. Yes on Sick Day (from a colleague perspective). Fails on Voting.

  ### 5. The "Hypocrisy" Reading (Logical Consistency)
  *   **The Claim:** "You are claiming an exception for yourself that you would not grant others."
  *   **What it's committed to:** Intellectual honesty. It doesn't say the act is *evil*, just that *you* are being inconsistent.
  *   **Plausibility:** Low moral force. It stops you from complaining, not from acting.
  *   **The Verdict on Your Cases:**
      *   Only works if you have previously argued that *others* shouldn't do these things. If you think "Everyone should skip boring parties," then you aren't being a hypocrite, you're just a radical.
  *   **Does it get him his conclusion?** Only if you're a hypocrite. Otherwise, it has no bite.

  ***

  ### The Two "Bugs" You Noticed

  You are right to be suspicious of how the act is described and who "everyone" is. In philosophy, these aren't bugs; they are the battleground.

  **1. The Maxim Formulation (How you describe the act)**
  *   **The Issue:** "Taking a sick day" fails the test. "Taking a mental health day when burnt out" might pass. "Resting when productivity is compromised" definitely passes.
  *   **Is it a bug?** Kant says this is the **whole point**. Moral judgment depends on your *intention* (the maxim), not just the physical movement.
  *   **The Trap:** Your flatmate is describing your actions in the worst possible light ("lying about sickness") to make them fail the test. If you describe them accurately ("managing burnout"), the Universalizability test might pass.
  *   **For the Shirt:** If the maxim is "Tell the truth," Kant says do it. If the maxim is "Humiliate friends," Kant says don't. Your flatmate is conflating the two.

  **2. The Scope of "Everyone"**
  *   **The Issue:** Literally everyone? (Babies can't vote).
  *   **The Fix:** It means **"All rational agents in relevantly similar circumstances."**
  *   **Why it matters:** If "everyone" means "everyone who has a sister," the Party argument holds. If "everyone" means "everyone who feels their vote is insignificant," the Voting argument holds. If your flatmate uses "everyone" to mean "literally every human," he is setting up a straw man (e.g., "What if everyone went to *that* festival?" -> The festival would be overcrowded). That is a logistical objection, not a moral one.

  ***

  ### Diagnosis: What Your Flatmate Is Actually Doing

  You guessed it: **He is a Rule-Consequentialist wearing Kant's coat.**

  When he asks "What if everyone did that?", he is almost certainly imagining a world where the *consequences* are worse (Case #1 above). He is not looking for a logical contradiction in the concept of the act (Case #2).

  **Proof:** The Shirt Case.
  *   **Strict Kant:** Generally requires truth-telling. Lying is a contradiction of the duty to communicate. A strict Kantian would likely tell you to tell the truth (perhaps kindly), because lying treats your friend as a means to an end (his comfort) rather than an end in himself (a rational agent who deserves truth).
  *   **Your Flatmate:** He hesitates or implies you shouldn't do it. Why? Because a world where everyone tells the truth about shirts feels *unpleasant*. He is weighing the *outcome* (hurt feelings), which is Consequentialism, not Kant.

  ### How to Reply to Him

  1.  **On the Sick Day:** "If my maxim is 'I will deceive my employer to get leisure,' you are right, that can't be universalized. But if my maxim is 'I will rest when my mental health impacts my work,' can that be universalized? Yes. So stop describing my action as a lie."
  2.  **On the Party:** "You are using the 'Social Collapse' argument, not Kant. You are arguing the *outcome* of everyone skipping parties is bad. That's Utilitarianism. Admit you care about consequences, not duty."
  3.  **On Voting:** "Here you are right, but it's the Free-Rider argument. I benefit from the system, so I must uphold it. That's fair play, not necessarily the Categorical Imperative."
  4.  **On the Shirt:** "If you are truly Kantian, you should tell me to tell the truth. Duty to truth outweighs duty to comfort. If you think I shouldn't tell him, you admit you care more about his feelings (consequences) than moral law. Which is it?"

  **The Bottom Line:** He is using a "World Worsening" test but calling it a "Logical Consistency" test. They are different tools. Sometimes they give the same answer, but in the Shirt case (and potentially the Party case), they diverge. Make him pick one.
