answer: |-
  Here is the spec sheet. It defines the adequacy conditions any theory of commemoration must meet to be usable by your commission. It does not offer the theory itself, but defines the success criteria.

  ### I. Adequacy Conditions

  A viable theory must satisfy three categories of conditions: Case Resolution, Distinction Preservation, and Constraint Compliance.

  **A. Case Resolution**
  The theory must provide a determinate path (not necessarily the same outcome, but a consistent reasoning process) for the following five archetypes without resorting to "it depends on the mood of the room":

  1.  **The Mixed Legacy (Schools/Militia):** Must weigh competing moral valences (education vs. violence) without requiring a net-positive calculation. It must explain whether a "good" deed offsets a "bad" one, or if the nature of the public space dictates which trait is relevant.
  2.  **The Semantic Drift (Poet/Immigrants):** Must account for the separation of *original intent* from *current reception*. It must determine if the monument belongs to the donors, the subjects, or the current users of the space.
  3.  **The Administrative Burden (Donor/Fraud):** Must explicitly weigh the cost of removal (financial, logistical, legal) against the moral cost of retention. It cannot treat administrative hassle as irrelevant, nor as a trump card.
  4.  **The Orphaned Object (Stolen Plaque):** Must assign value to a monument that has lost its semantic content but retained functional utility (meeting spot). It must decide if "unknown" defaults to "keep" or "remove."
  5.  **The Moral Shift (Progressive then/Regressive now):** Must handle historical relativism without collapsing into "everything was racist/sexist so we keep nothing" or "standards change so we judge nothing."

  **B. Distinction Preservation**
  The theory must not collapse the following pairs. If a theory treats these as identical, it is inadequate:

  1.  **Honouring vs. Recording:** Must explain why a statue in a square is different from a bust in a museum. It must define what makes a space "honorific" vs. "educational."
  2.  **Erecting vs. Keeping:** **(Critical)** Must differentiate the moral agency involved in *installing* a monument vs. *leaving it standing*. It must define whether inertia is a neutral state or an active endorsement.
  3.  **Honoree vs. Monument:** Must allow for the possibility that the person is admirable but the statue is not (e.g., bad art, wrong location), or the person is objectionable but the monument serves a different civic function (e.g., aesthetic landmark).
  4.  **Standing:** Must define a hierarchy of stakeholders. It cannot treat "current residents," "descendants," and "daily users" as having equal weight in all contexts.
  5.  **The Menu of Options:** Must treat Remove, Relocate, Re-annotate, Counter-monument, and Fund-Elsewhere as morally distinct actions with different thresholds for justification. Annotation cannot be a default "cheap" way out if the harm requires removal.
  6.  **Ownership vs. Land:** Must distinguish between who paid for it, who owns the land, and who controls the speech act. Public money on private land vs. private money on public land must yield different analyses.

  **C. Constraint Compliance**
  The theory cannot contradict the following metaphysical and political realities:

  1.  **Temporal Discontinuity:** It must acknowledge that the current city is not the same moral agent as the past city. We inherit the objects, not the intentions.
  2.  **State Speech:** It must recognize that a monument on public land is state speech, subject to higher scrutiny than private expression, but also bound by continuity requirements private actors do not have.
  3.  **Dual Nature:** It must accept that an object is simultaneously art (aesthetic value) and politics (normative claim).
  4.  **Non-Neutrality:** It must acknowledge that removal is a speech act. There is no "neutral" baseline.
  5.  **Settlement Value:** It must incorporate a bias for stability. It cannot require perpetual review. It must explain why we don't re-litigate every statue every election cycle, without making "because it's already there" a sufficient moral argument.

  ---

  ### II. Evaluation of Colleague Proposals

  **1. The One-Way Ratchet (Remove by 2/3 vote, ban new for 50 years)**
  *   **Verdict:** Inadequate.
  *   **Failure Point:** Violates the **Settlement Value** constraint and the **State Speech** constraint.
  *   **Reasoning:** While it solves the "relitigation" problem by banning new speech, it turns the city into a museum of itself. It treats the state as incapable of making positive moral claims for half a century. It also fails the **Erecting vs. Keeping** distinction by assuming the only way to stop bad honours is to stop *all* honours. It creates a moral vacuum rather than a moral framework.

  **2. The Marble Rule (Dead 100+ years only)**
  *   **Verdict:** Inadequate.
  *   **Failure Point:** Fails **Case 3 (Living Donor)** and **Case 2 (Semantic Drift)**.
  *   **Reasoning:** It assumes time solves moral ambiguity. It does not. A 100-year-old statue can be more harmful today than a 10-year-old one (see Case 5). It also fails to address *why* we keep them. It creates a bright line that is easy to administer but morally arbitrary. It vindicates the "wager on the future" intuition but fails to account for present harm.

  **Does an adequate theory vindicate either?**
  No. An adequate theory might incorporate a *presumption* against living honorees (Marble Rule lite) or a *high threshold* for removal (Ratchet lite), but it cannot adopt them as rigid rules. They are procedural shortcuts that bypass the necessary moral work of the **Erecting vs. Keeping** distinction.

  ---

  ### III. The Core Contradiction

  **The Contradiction:**
  *Premise A:* To remove a statue, the commission must judge that the honoree's record is "bad enough to matter."
  *Premise B:* The commission lacks the legitimacy and competence to act as a court of historical moral judgment.
  *Conclusion:* The commission cannot remove statues. (But it must).

  **Diagnosis:**
  This is a genuine contradiction *if* the theory assumes the monument is primarily about the **Honoree's Past**. If the monument is a judgment on the person, you need a judge.

  **What Has to Give:**
  The theory must shift the jurisdiction from **Historical Judgment** to **Civic Compatibility**.
  The commission is not ruling on *whether the person was good*. It is ruling on *whether this object, in this place, at this time, is compatible with the civic values the state currently wishes to project.*

  *   **Resolution:** You do not need to convict the historical figure to remove the statue. You only need to determine that the statue's *current effect* undermines the community's *current functioning*. This bypasses the competence problem (you are experts on current civic needs, not history) and the legitimacy problem (you represent current residents, not the dead).

  ---

  ### IV. The Single Requirement (The Workhorse)

  The single requirement that does the most work, and rules out the most plausible but flawed views, is this:

  **The theory must justify *retention* with a positive civic reason distinct from the reason for *erection*.**

  **Why this rules out the competition:**
  1.  **Rules out Preservationist Default:** You cannot say "keep it because it's there." Inertia is not a civic reason.
  2.  **Rules out History-not-Heritage:** You cannot say "keep it for history" unless you can prove *this square* is the right classroom. It forces the "Honouring vs. Recording" distinction to be operational, not theoretical.
  3.  **Rules out Contextualise-don't-remove:** You cannot assume a plaque fixes the problem. If the object itself (the visual dominance) conflicts with current civic values, annotation is irrelevant. The theory forces you to ask if the *object* belongs, not just if the *story* is told.
  4.  **Rules out the "Court of Judgment":** By requiring a *current* civic reason for keeping it, you stop looking at the past record as the sole determinant. A "bad" person might stay if the monument serves a current civic function (e.g., Case 4, the meeting spot). A "good" person might go if the monument no longer serves a civic function.

  **Summary:**
  If your theory treats **Keeping** as a passive default, you will be trapped in the "Court of Judgment" paradox forever. If your theory treats **Keeping** as an active, recurring choice that requires its own justification (separate from the original erection), the paradox dissolves, the distinctions hold, and the cases become manageable.
