  ### 3. The Competing Rule
  The main alternative that fits her first five verdicts is **Nicod's Criterion (The Logical Instance Rule)**.
  *   **The Rule:** Any observation of a Black Raven ($R \land B$) confirms; any observation of a Non-Black Non-Raven ($\neg R \land \neg B$) confirms; anything else is neutral.
