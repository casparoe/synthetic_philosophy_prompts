          *   *Analysis:* Sam is conflating Hindu and Buddhist metaphysics. Merit transfer *does* undermine strict individual desert. Priya is right that this weakens Sam's original "justice" claim.
          *   *Verdict:* Messy. Sam scores an own-goal by introducing merit transfer while arguing for strict desert.

  3.  **Drafting the Adjudication (Iterative Process):**

