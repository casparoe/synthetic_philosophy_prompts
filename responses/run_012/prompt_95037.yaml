answer: |-
  This is a profound question that strikes at the intersection of tort law, metaphysics, and population ethics. The asymmetry you identify is indeed a staple of common law jurisprudence, particularly in jurisdictions such as England and Wales, the United States, and Australia. To answer your query, I shall reconstruct the implicit theoretical framework, distinguish between necessary presuppositions and compatible theories, and explore the consequences of adopting the procreation asymmetry explicitly.

  ### 1. Reconstructing the Implicit Theory

  The current legal practice does **not** presuppose the procreation asymmetry as articulated by philosophers such as Derek Parfit or Jan Narveson. The procreation asymmetry holds that while we have moral reasons not to bring into existence a person whose life would be miserable, we do not have moral reasons to bring into existence a person whose life would be happy. If the law fully embraced this, it would logically permit a 'wrongful life' claim where the child's life is sufficiently miserable (i.e., 'not worth living'), for the asymmetry concedes that bringing such a person into existence is a bad outcome.

  Instead, the prevailing judicial practice presupposes what I shall term the **Non-Comparability Thesis regarding Harm**, coupled with a **Relational Duty View**.

  **The Non-Comparability Thesis:**
  Courts typically reason that to establish legal harm, one must compare the plaintiff's current state with the state they would have occupied but for the defendant's negligence. In wrongful life cases, the alternative to existence is non-existence. The law presupposes that non-existence is not a state of affairs that can be experienced or valued by a subject. Therefore, there is no baseline against which to measure the 'damage' of being born. As the California Supreme Court noted in *Turpin v. Sortini*, it is logically impossible to say that a child is worse off existing than not existing, because there is no 'child' in the state of non-existence to suffer the loss.

  **The Relational Duty View:**
  Simultaneously, the law presupposes that duties of care in this context are owed to the *parents*, not the potential child. In wrongful birth actions, the harm is not the child's existence *per se*, but the infringement of the parents' reproductive autonomy. The loss is financial and emotional *to the parents*. Thus, the law treats the birth as a harm to the parents' interests, while maintaining that it cannot be a harm to the child's interests.

  **Charitable Reconstruction:**
  Charitably construed, the law is not making a metaphysical claim that life is always objectively good (a 'Sanctity of Life' view), but rather an epistemic and logical claim about the conditions necessary for legal standing. It presupposes that legal personhood and the capacity to suffer harm commence at birth (or viability), and that one cannot be harmed by being brought into the jurisdiction of personhood, provided one has a life that is not, in the eyes of the law, indistinguishable from non-existence.

  ### 2. Strict Presupposition vs. Theoretical Fit

  It is vital to distinguish what the practice *strictly* requires from what merely *fits* well with it.

  **Strictly Presupposed:**
  1.  **The Person-Affecting Restriction on Harm:** The law strictly presupposes that harm must be harm *to someone*. Since the non-existent child is not a 'someone', they cannot be the beneficiary of non-existence.
  2.  **Incommensurability:** The law presupposes that 'existence with disability' and 'non-existence' are incommensurable values for the purpose of calculating damages. Without a common metric, tort law (which is compensatory) cannot function.

  **Merely Fits Well (But Not Required):**
  1.  **Existence is Always a Benefit:** Many judgments speak as if life is inherently a gift. However, the practice does not strictly require this. A court could hold that some lives are miserable without allowing a claim, simply because damages cannot be calculated. Thus, the 'Life is a Benefit' view fits the rhetoric but is not a necessary condition of the verdict.
  2.  **The Procreation Asymmetry:** As noted, the practice actually conflicts with the normative thrust of the procreation asymmetry regarding the child. The asymmetry suggests creating a miserable child is wrong *for the child's sake*. The law denies the child has a sake in this matter.

  ### 3. Philosophical Underdetermination

  The legal practice is philosophically underdetermined in several significant ways. Multiple distinct theories can license the same outcome (rejecting wrongful life while allowing wrongful birth).

  *   **Metaphysical vs. Epistemic:** The rejection of wrongful life could rest on a metaphysical claim (non-existence is nothing, so it cannot be better) or a purely epistemic claim (we cannot know what non-existence is like, so we cannot adjudicate). The judgments often conflate these.
  *   **Impersonal vs. Person-Affecting:** The law could be interpreted as adopting an impersonal view (the world is worse if suffering children are born, hence wrongful birth is actionable to deter negligence) while maintaining a person-affecting view for the child (the child itself is not harmed). Alternatively, it may simply be a pragmatic refusal to extend tort law into metaphysical questions.
  *   **Threshold Views:** The practice is consistent with a 'threshold' view of harm, where life is presumed a benefit unless it is so agonising that death would be preferable. However, courts often set this threshold so high (effectively requiring life to be intolerable) that it functions as an absolute bar, masking the underlying theoretical flexibility.

  Consequently, one cannot infer from the verdicts alone whether judges believe non-existence is incomparable, or simply that they lack the institutional competence to make the comparison.

  ### 4. Adopting the Procreation Asymmetry as Legal Principle

  If the procreation asymmetry were adopted as an explicit legal principle, the handling of these claims would undergo a radical transformation, specifically collapsing the asymmetry between wrongful birth and wrongful life.

  **Changes Required:**
  1.  **Recognition of Wrongful Life:** Courts would have to accept that for a child whose life is 'not worth living' (i.e., contains more suffering than value), coming into existence constitutes a legally cognisable harm. The claim would no longer be barred by the non-comparability argument, because the asymmetry explicitly validates the comparison: non-existence is preferable to miserable existence.
  2.  **Damages Calculation:** The measure of damages would shift. Currently, in wrongful birth, damages are the costs of raising the child (offset by benefits). In a wrongful life claim grounded in the procreation asymmetry, damages would represent the suffering endured by the child by virtue of being born, compared to the zero-value of non-existence.
  3.  **Duty of Care:** The duty of care would extend directly to the foetus/unborn child regarding decisions to bring them into existence, rather than being limited to the parents' autonomy.
  4.  **No Claim for 'Happy' Children:** Consistent with the second half of the procreation asymmetry, a child born healthy could not claim they were 'wrongfully born' simply because they were not born to different, wealthier parents. The claim would remain limited to cases where existence itself is a net negative.

  In short, adopting the procreation asymmetry would align the child's legal standing with the moral intuition that drives wrongful birth claims: that it is better not to be born than to be born into severe suffering.

  ### 5. Confidence and Uncertainty

  I am **highly confident** in the reconstruction that the current practice relies on the Non-Comparability Thesis and a Relational Duty View, as this is explicitly stated in leading cases such as *McKay v. Essex Area Health Authority* in the UK and *Turpin v. Sortini* in the US. I am also confident that the current practice contradicts the normative implications of the procreation asymmetry regarding the child's claim.

  However, I am **least sure** about the extent to which judicial reasoning is driven by genuine metaphysical conviction versus pragmatic policy concerns. When judges state that 'life is always a benefit', it is unclear whether they hold this as a philosophical truth or as a heuristic to avoid the slippery slope of evaluating which lives are worth living. Distinguishing between a judge's *ratio decidendi* (the legal reasoning) and their *obiter dicta* (philosophical musings) is difficult here, as the metaphysical claim often serves as the policy justification. Therefore, my least certain point is whether the law *presupposes* the metaphysical impossibility of the comparison, or merely *asserts* it as a proxy for a policy decision to limit liability.

  ***

  **Summary of Confidence:**
  *   **Reconstruction of current legal theory:** High confidence.
  *   **Analysis of Procreation Asymmetry implications:** High confidence.
  *   **Judicial motivation (Metaphysics vs. Policy):** Low confidence.

  I hope this analysis assists in your studies. The tension you have identified remains one of the most fertile grounds for inquiry in legal philosophy.
