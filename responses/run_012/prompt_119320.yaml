      *   *Refining the "Book" Audit:* Make sure to highlight the "Author/Reader" dynamic. The Councilman implies the dead are the authors and we are just readers. In reality, the living are the curators.
      *   *Refining the "Trophy" Counter:* Why is this better? Because trophies are normative (what we *should* admire), not descriptive (what *happened*).
      *   *Street Names:* Distinguish them from statues. Statues are visual/honorific; names are functional/navigational. The "mess" mentioned in the prompt suggests they got rolled together, but they should be treated differently.

  7.  **Final Review against Constraints:**
