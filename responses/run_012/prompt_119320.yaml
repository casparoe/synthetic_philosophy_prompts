  8.  **Final Polish:** Ensure the distinction between *record* (history) and *honor* (memory) is sharp. That's the pivot point. (Self-Correction: Make sure to explicitly address the "finite space" argument, as that's a strong point for statues vs. books).

  **(Self-Correction during drafting):** I need to make sure I don't just bash the Councilman but explain *why* the analogy works rhetorically even if it fails logically. It appeals to the sanctity of history. I should acknowledge that power before dismantling it. Also, ensure the street name section is distinct. Street names are more like "labels on jars" or "signposts."

