answer: |-
  Here is the audit of the Councilman's analogy, broken down by mapping, breaks, and payoff, followed by alternative frameworks for your piece.

  ### 1. The Audit: The "History Book" Correspondence Table

  The Councilman's argument relies on a specific mapping of civic space onto a library. Here is how the analogy is structured to make removal feel like violence.

  | **The Book Analogy** | **The Civic Reality** | **The Implicit Claim** |
  | :--- | :--- | :--- |
  | **The Book** | The City / Public Square | The city is a finished narrative. |
  | **The Page/Chapter** | The Statue | The statue is a record of fact. |
  | **The Text** | The Past | The past is static and sacred. |
  | **The Author** | The Ancestors / Builders | The dead hold copyright on the narrative. |
  | **The Reader** | The Current Public | We are passive consumers of history. |
  | **Tearing the Page** | Removing the Statue | Removal is destruction of information. |
  | **The Library** | Collective Memory | Memory is finite; if you lose one copy, it's gone. |

  **The Rhetorical Goal:** To frame the statue as *descriptive* (this happened) rather than *prescriptive* (this is good). If the statue is a page in a book, removing it is censorship. If it is a trophy, removing it is just a change in team management.

  ### 2. The Breaks: Where the Mapping Fails

  There are four structural breaks in this analogy. Three are minor; one is fatal to the Councilman's argument.

  **Break 1: Finite vs. Infinite Space (Minor)**
  *   **Book:** You can add pages indefinitely. A book can grow.
  *   **Statue:** Public space is finite. You cannot add a new statue without displacing an old one or crowding the square.
  *   **Impact:** This actually helps the Councilman slightly. It suggests choices *must* be made, but it doesn't prove the *old* choice must stay.

  **Break 2: The Reader's Agency (Minor)**
  *   **Book:** Readers do not edit the text.
  *   **Statue:** The public *maintains* the square. We are not just readers; we are the curators.
  *   **Impact:** Weakens the "sacred text" angle. We are the librarians, not the patrons.

  **Break 3: Redundancy (Major)**
  *   **Book:** If you tear the only page mentioning Lincoln, that information is gone from that volume.
  *   **Statue:** If you remove the Lee statue, the history of Lee remains in schools, archives, books, and other statues.
  *   **Impact:** The "Erasure" claim is factually false. A statue is a terrible history textbook; it has no footnotes, no context, and no index.

  **Break 4: Record vs. Honor (Fatal)**
  *   **Book:** A history book records villains and heroes alike. Hitler is in history books; we don't tear those pages out.
  *   **Statue:** Statues are not neutral records. You do not build a pedestal for a villain to "remember" them; you build it to venerate them.
  *   **Impact:** This is the kill shot. A statue is not a page in a history book; it is a **gold star on a report card**. Removing a gold star doesn't delete the semester; it just says the grade is no longer valid.

  ### 3. The Payoff: Does "You Can't Erase History" Survive?

  **Verdict:** No. The analogy is carrying 100% of the argumentative weight.

  Without the "Book" framing, the claim "removing a statue erases history" collapses under basic scrutiny. History is not stored in bronze; it is stored in transmission.
  *   **If the statue is a record:** It's a bad one (no context).
  *   **If the statue is a monument:** It's a value judgment.

  The Councilman is conflating *History* (what happened) with *Memory* (what we choose to celebrate). You can preserve History while changing Memory. The analogy works only if you accept the premise that a statue is a neutral document. Once you establish it is an honorific object, the "erasure" argument evaporates.

  ### 4. Better Comparisons

  Since statues and street names function differently, you should decouple them in your piece. The Councilman rolled them together to create a "slippery slope" mess, but they require different metaphors.

  #### For Statues: The "Trophy Case" or "The Portrait Gallery"
  Your historian friend was right, but you can sharpen it.
  *   **The Analogy:** A school trophy case.
  *   **The Logic:** The trophy case does not record every game played. It records the games the school *wants to claim as identity*.
  *   **The Shift:** If it is discovered the 1974 captain cheated, or held values the school now rejects, the school removes the trophy. They don't burn the yearbook (History). They just clear the shelf (Honor).
  *   **The Line for your piece:** "A statue is not a footnote; it's a endorsement. Taking it down isn't deleting the past; it's firing a spokesperson."

  *Alternative:* **The Family Portrait.**
  *   We keep photos of ancestors we love on the mantel. We keep photos of problematic ancestors in the album in the drawer. The album is history; the mantel is current values. Moving a statue from the square to a museum is moving the photo from the mantel to the album.

  #### For Street Names: The "Software Update" or "The Lease"
  Street names are functional, not just honorific. They are how we navigate. This makes the "erasure" argument even weaker, but the "inconvenience" argument stronger.
  *   **The Analogy:** Renaming a file on a shared server.
  *   **The Logic:** The data (the street, the buildings, the history) remains exactly where it is. The label changes so that new users don't get an error message when they try to access it.
  *   **The Friction:** The cost isn't "loss of history"; it's the cost of updating the GPS, the mail, and the signs.
  *   **The Line for your piece:** "Renaming a street isn't burning the map; it's admitting the old legend doesn't match the terrain anymore. The cost isn't historical amnesia; it's the price of new signage."

  *Alternative:* **The Leaseholder.**
  *   The dead built the city, but the living pay the rent. When a lease renews, the tenants get to decide what name is on the buzzer. The landlord (the past) doesn't get veto power over the current occupants' safety or comfort.

  ### Summary for the Piece
  The Councilman's argument relies on a category error: treating **Honor** as if it were **Information**.
  *   **Statues** are honorific (Trophies/Portraits). Removal = Revoking Endorsement.
  *   **Street Names** are functional (Labels/Addresses). Renaming = Updating Interface.
  *   **History** is archival (Books/Archives). This remains untouched in both scenarios.

  If you can get the reader to see the statue as a *spokesperson* rather than a *textbook*, the Councilman's "torn page" analogy falls apart immediately. You aren't deleting the chapter; you're just telling the spokesperson they no longer represent the company.
