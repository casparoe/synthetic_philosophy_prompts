  1. We agree that probability calculus follows Kolmogorov's axioms and serves as an indispensable tool for empirical inference and decision-making under uncertainty. We both accept that coherent betting odds avoid sure-loss Dutch books and that calibration against observed frequencies is a desirable operational metric for any forecasting system. We concede that scientific practice often blends frequency data with expert judgment, regardless of foundational labeling.

  2. The Frequentist maintains that probability denotes only the limiting relative frequency within a well-defined repeatable collective, treating single-case assignments as elliptical references to similar cases. The Bayesian contends that probability quantifies a rational agent's degree of belief constrained solely by coherence, rendering objective chance metaphysically superfluous. Each asserts their definition captures the normative core of inference while the other's is either too narrow or too metaphysical.

  3. Our disagreement centers on single-case events lacking a repeatable collective, the arbitrariness of selecting a reference class for unique objects, and the interpretation of de Finetti's representation theorem. We dispute whether calibration and proper scoring rules constitute an operational vindication of frequentist truth or merely pragmatic Bayesian updating. We further debate whether Dutch-book coherence arguments constrain belief alone or also expose the frequentist's reliance on hypothetical infinite sequences.

  4. Regarding reference classes and exchangeability, we accept the mathematical freedom to group data and the equivalence of exchangeable sequences, yet the Frequentist predicts these track objective structures while the Bayesian predicts they manage subjective information. On calibration and Dutch books, we agree the logic prevents sure loss and rewards honesty, but the Frequentist predicts convergence reveals true frequencies whereas the Bayesian predicts convergence ensures internal coherence. Each side therefore predicts their framework alone correctly prescribes action when frequency data is absent.

  5. The Frequentist must strike the second clause, insisting that without a justified collective, the term 'probability' is meaningless rather than subjective. The Bayesian must strike the first clause, arguing that frequency data merely updates belief and never constitutes probability itself. This dispute is substantive rather than verbal regarding single-case events, decisively tested by singular cosmological occurrences where frequency data is impossible yet betting odds are offered.
