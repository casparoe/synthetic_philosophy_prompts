answer: |-
  In the context of the Warring States period debates on *ming* (names) and *shi* (actualities), Gongsun Long's "White Horse Is Not Horse" (*Bai Ma Fei Ma*) stands as the paradigmatic case for the School of Names (*Ming Jia*). To evaluate the philosophical weight of this argument, we must disentangle the logical structure from the rhetorical shock. Central to this task is the ambiguity of the negation *fei*. In classical Chinese, *fei* can function as a marker of non-identity ("is not the same as") or as a marker of class exclusion/predication negation ("is not a member of" or "is not").

  Below, I compare the two readings you outlined, assess their defensibility against the "Hard and White" (*Jian Bai*) puzzle, and conclude on the semantic seriousness of the School of Names.

  ### I. Two Readings of *Bai Ma Fei Ma*

  #### 1. The Non-Identity Reading (Intensional Distinction)
  **Interpretation of *Fei*:** Here, *fei* is read as **non-identity**. The claim is not that a white horse falls outside the extension of 'horse', but that the concept (or name) 'white horse' is not identical to the concept (or name) 'horse'. Formally: $Name(White Horse) \neq Name(Horse)$.

  **Response to the Objector:**
  The standard objector argues: "If you have a white horse, you cannot say you do not have a horse." This relies on the transitivity of inclusion (if $A \subset B$, having an $A$ implies having a $B$).
  The Non-Identity reading answers by shifting the ground from *objects* to *requests* or *specifications*. Gongsun Long argues in the text: "If someone seeks a horse, a yellow or black one will do; if someone seeks a white horse, they will not."
  The reply is: Having a white horse satisfies the condition of 'having a horse' extensionally, but it does not satisfy the *name* 'horse' intensionally. The *shi* (actuality) pointed to by the name 'horse' is broader than the *shi* pointed to by 'white horse'. Because the conditions for the application of the names differ, the names themselves are not identical. To say "White horse is horse" conflates a specific determination with a generic one.

  **Notion of Name/Kind:**
  This reading requires an **intensional or descriptive notion of naming**. A name does not merely label an object; it picks out an object via a specific set of determinations (*de*). 'Horse' picks out the determination of shape/form. 'White' picks out the determination of color. 'White Horse' picks out the compound of both. Since the descriptive content differs, the names are distinct, even if their extensions overlap.

  #### 2. The Kind-Membership Reading (Exclusionary Ontology)
  **Interpretation of *Fei*:** Here, *fei* is read as **non-membership** or **exclusion**. The claim is that the kind 'white horse' is not included in the kind 'horse'. Formally: $Kind(White Horse) \not\subset Kind(Horse)$.

  **Response to the Objector:**
  The objector again says: "Having a white horse implies having a horse."
  The Kind-Membership reading must deny the premise that 'white horse' is a sub-kind of 'horse'. It argues that 'Horse' names the essence of the form, while 'White Horse' names a compound essence. Because the compound essence includes a color determination that the form-essence lacks, they are mutually exclusive categories. To accept a white horse as a 'horse' is to fail to distinguish the specific essence from the generic essence. Some proponents of this view (often aligning with the "mass noun" hypothesis) suggest 'horse' refers to "horse-stuff" and 'white horse' refers to "white-horse-stuff"; since the stuffs differ, one is not the other.

  **Notion of Name/Kind:**
  This reading requires a **realist or essentialist notion of kinds**. Names carve reality at joints that are ontologically distinct. A compound kind creates a new ontological category that is not reducible to its parts. This view treats names as designating distinct metaphysical realities rather than linguistic conventions.

  ### II. Comparison with the "Hard and White" Puzzle

  The more defensible of the two readings is the **Non-Identity Reading**. The Kind-Membership reading forces a contradiction with observable reality (denying that white horses are horses) that is difficult to sustain without resorting to obscure metaphysics. The Non-Identity reading, however, preserves common sense extensionally while demanding precision intensionally.

  We must now test whether the semantic apparatus of the Non-Identity reading can handle the "Hard and White" (*Jian Bai*) dialogue. In that puzzle, Gongsun Long argues that for a hard, white stone, "Hardness, Whiteness, and Stone are Two, not Three." He claims hardness and whiteness cannot belong to the stone simultaneously because they are known through different senses (touch vs. sight).

  **Can the same semantic apparatus handle both cases?**
  Yes, but it requires extending the apparatus from *linguistic distinction* to *ontological separation of attributes*.

  In the *White Horse* argument (Non-Identity reading), the apparatus treats names as designating **determinate aspects**. 'White' isolates the color aspect; 'Horse' isolates the shape aspect. The name 'White Horse' is a compound pointing that keeps these aspects distinct within the name structure.

  In the *Hard and White* argument, the apparatus treats names as designating **independent universals** that are epistemologically separated.
  1.  **Consistency:** Both arguments rely on the separability of attributes. In *White Horse*, color and shape are separable determinations (one can have a horse without white, white without a horse). In *Hard and White*, hardness and whiteness are separable because they are accessed by different faculties (*zhi*).
  2.  **Application:** If names designate determinate aspects rather than whole objects, then 'Hard' designates the tactile aspect and 'White' designates the visual aspect. Since the aspects are accessed separately, the names refer to separate entities (*er*), not a unified object (*san*).

  **The Additional Distinction Required:**
  However, a tension arises. *White Horse* allows for the *compound name* 'White Horse' to function (even if it is not identical to 'Horse'). *Hard and White* seems to deny the *compound reality*. Gongsun Long argues that when you see the white, the hard "hides"; when you feel the hard, the white "hides."
  To make the semantic apparatus cohere, we must introduce a distinction between **Linguistic Compounding** and **Perceptual Manifestation**.
  *   In *White Horse*, the distinction is logical/semantic: The *meaning* of the compound is not the *meaning* of the part.
  *   In *Hard and White*, the distinction is epistemological/ontological: The *referents* of the names (the universals Hardness and Whiteness) do not manifest simultaneously in perception.

  Therefore, the same apparatus (names as pointings to determinate aspects) works for both, provided we accept that for Gongsun Long, the separability of aspects in language (*White Horse*) mirrors the separability of aspects in reality (*Hard and White*). The additional distinction needed is that *White Horse* concerns the logic of classification (intension), while *Hard and White* concerns the metaphysics of perception (the independence of qualities).

  ### III. Conclusion: Semantics vs. Sophistry

  **Which reading makes the School of Names look like it is engaged in serious semantics?**
  The **Non-Identity Reading** renders the School of Names as serious semanticists.
  By interpreting *fei* as non-identity, Gongsun Long is making a point about the precision of reference and the intensional content of terms. He is arguing that specificity matters in naming actualities (*zheng ming*). This anticipates distinctions found in modern logic between sense and reference, or between specific and generic terms. It treats language as a tool for distinguishing aspects of reality that are often conflated in ordinary speech. It transforms the paradox into a lesson on the limits of predication and the structure of conceptual content.

  **What would the other reading have to concede?**
  The **Kind-Membership Reading** risks reducing the School of Names to mere sophistry unless it concedes a radical ontology.
  If *fei* means "is not a member of," Gongsun Long is denying a basic truth of classification. To defend this without looking like a sophist playing with words, this reading must concede that ordinary language is fundamentally misleading about the structure of reality. It must argue that our common-sense notion of inclusion (that a specific kind belongs to a generic kind) is an illusion. While this is a defensible metaphysical position (resembling a radical realism about universals), it disconnects the philosophy from the semantic analysis of language and moves it into speculative metaphysics. Without that heavy metaphysical lifting, the Kind-Membership reading appears to be a verbal trick designed to win debates rather than uncover truth.

  **Summary for your Seminar:**
  For a third-year philosophy seminar, the Non-Identity reading is the robust choice. It allows you to argue that Gongsun Long is analyzing the **conditions of satisfaction** for names. When connected to *Hard and White*, it shows a consistent project: the isolation of attributes (*separability*) as the primary function of naming. The *fei* ambiguity is the pivot point: reading it as non-identity preserves the logical space for serious semantic inquiry; reading it as non-membership collapses that space into ontological paradox.
