      *   *Yes:* In *White Horse*, 'White' and 'Horse' (Shape) are distinct determinations. In *Hard and White*, 'Hard' and 'White' are distinct determinations accessed by different faculties.
      *   *Mechanism:* Names designate specific *aspects* or *qualities* (*de*), not whole objects. 'White' designates the color aspect. 'Horse' designates the shape aspect. 'Hard' designates the tactile aspect.
      *   *Handling Both:* The apparatus is: Names refer to abstracted attributes (universals) that are ontologically independent before they combine in an object. In *White Horse*, the combination creates a new name distinct from the component 'Horse'. In *Hard and White*, the attributes are so distinct they cannot be perceived together, implying they are separate entities (*er*) rather than unified in the stone (*san*).
      *   *Distinction Needed?* *White Horse* is about linguistic/conceptual combination (Compound Name vs. Simple Name). *Hard and White* is about epistemological/ontological separation (Perceptual Modalities).
      *   *Refinement:* The *White Horse* argument (Reading 1) relies on the distinction between the *content* of names. The *Hard and White* argument relies on the separation of the *referents* of names (the universals themselves). To make them cohere, we need a theory where names latch onto independent universals. If Reading 1 is adopted (names = determinate aspects), then *Hard and White* follows naturally: since 'white' and 'hard' designate different aspects accessed differently, they are separate names designating separate entities.
      *   *Potential Conflict:* *White Horse* allows combination (White + Horse = White Horse). *Hard and White* seems to deny combination (Hard + White $\neq$ Hard-White Stone, they remain separate).
      *   *Resolution:* The semantic apparatus holds if we view names as pointing to *independent universals*. In *White Horse*, we are talking about the *name* 'White Horse' vs 'Horse'. In *Hard and White*, we are talking about the *universals* Hardness and Whiteness. The distinction needed is between *compounding names* (linguistic) and *compounding realities* (ontological). Gongsun Long seems to treat them similarly.

  6.  **Synthesize and Structure the Essay:**
      *   **Introduction:** Acknowledge the context (Warring States, School of Names, *Ming-Shi* relation). Introduce the ambiguity of *fei*.
      *   **Section 1: Reading 1 (Non-Identity).**
          *   Interpretation of *fei* as non-identity ($\neq$).
          *   Response to Objector (Seeking horse vs. seeking white horse).
          *   Notion of Name: Intensional/Descriptive.
      *   **Section 2: Reading 2 (Kind-Membership).**
          *   Interpretation of *fei* as non-membership/exclusion ($\notin$ or $\not\subset$).
          *   Response to Objector (Ontological exclusion).
          *   Notion of Name: Realist/Essentialist kinds.
      *   **Section 3: Comparison with Hard and White.**
          *   Select Reading 1 as more defensible.
          *   Analyze *Hard and White* (separation of senses).
          *   Apply Semantic Apparatus: Names as designating determinate aspects.
          *   Does it work? Yes, but requires distinguishing between linguistic compounding and ontological separation. The "aspect" theory works for both: 'White' isolates color, 'Horse' isolates shape. 'Hard' isolates touch, 'White' isolates sight.
          *   Additional Distinction: Epistemological access (senses) vs. Conceptual determination.
      *   **Section 4: Conclusion (Semantics vs. Sophistry).**
          *   Reading 1 = Serious Semantics (Intensionality, reference, sense).
          *   Reading 2 = Sophistry (unless heavily qualified as mass noun ontology).
          *   What Reading 2 concedes: It concedes that ordinary language usage (inclusion) is wrong, which is a hard sell. Reading 1 concedes only that precision in naming matters.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Caution:* Don't impose too much Western analytic philosophy (Frege/Russell) without grounding it in the Chinese text (*Ming* and *Shi*). Use terms like *shi* (actuality/pointing) and *ming* (name).
      *   *Fei:* Ensure the distinction between "is not identical to" and "is not a member of" is clear. In Chinese logic, *fei* is often a predicate negation. Reading 1 treats it as identity negation. Reading 2 treats it as class exclusion.
