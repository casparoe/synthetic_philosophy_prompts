          3.  Conclusion: Which reading makes the School of Names look like serious semantics vs. sophistry? What must the other reading concede?
      *   **Tone:** Academic, rigorous, suitable for a third-year philosophy seminar (avoiding oversimplification, engaging with textual nuance).

  2.  **Deconstruct Reading 1: Non-Identity (Semantic/Conceptual Distinction)**
      *   *Core Claim:* "White horse" (concept/term) $\neq$ "Horse" (concept/term).
      *   *Ambiguity of Fei:* Here *fei* means "is not identical to" ($A \neq B$), not "is not a member of" ($A \notin B$).
      *   *Response to Objector:* The objector says, "If you seek a horse, a yellow or black one will do; if you seek a white horse, they won't." The objector also says, "Having a white horse implies having a horse."
      *   *Rebuttal:* Having a white horse implies having an object that falls under the extension of 'horse', but the *name* 'white horse' is not the *name* 'horse'. The *shi* (act of pointing/naming) is different. The request for a horse is satisfied by more things than the request for a white horse. Therefore, the *requirements* are not identical.
      *   *Notion of Name/Kind:* Names designate *shi* (actualities) via specific determinations (*ming*). A name picks out a specific conceptual content. 'Horse' picks out shape/form. 'White horse' picks out shape + color. Since the content differs, the names are not identical. This aligns with a referential or intensional semantics where meaning determines reference, but distinct meanings mean distinct names even if extensions overlap.

  3.  **Deconstruct Reading 2: Kind-Membership (Exclusionary Ontology)**
      *   *Core Claim:* The kind "White Horse" is not included in the kind "Horse".
      *   *Ambiguity of Fei:* Here *fei* means "is not a member of" or "is not subsumed by" ($A \not\subset B$).
      *   *Response to Objector:* This is the harder reading to defend logically. If the objector says "Having a white horse is having a horse," this reading must deny the transitivity of inclusion or argue that 'White Horse' constitutes a distinct ontological category that excludes 'Horse' proper.
      *   *Rebuttal:* Gongsun Long argues that 'Horse' names the shape, 'White' names the color. 'White Horse' names both. To ask for 'White Horse' is to ask for the compound. If you give me 'Horse', you haven't given me the compound. Therefore, the compound kind is not the simple kind. Some interpreters (like Chad Hansen) suggest this treats 'horse' as a mass noun or a stuff-term, where 'white horse' is a different stuff.
      *   *Notion of Name/Kind:* Names carve reality at joints that are mutually exclusive. 'Horse' refers to the form-essence. 'White Horse' refers to a compound essence. If the essence differs, the kind is distinct. This leans towards a realist ontology of universals where compounds create new universals not reducible to their parts.

  4.  **Evaluate Defensibility:**
      *   Reading 1 (Non-Identity) is generally considered more philosophically defensible in modern terms (intensional logic). It avoids the absurdity of claiming no white horses are horses.
      *   Reading 2 (Kind-Membership) risks looking like sophistry unless framed very carefully (e.g., as a claim about specific vs. generic requests).
      *   *Decision:* Reading 1 is the "more defensible" one for the purpose of connecting to *Hard and White*. It focuses on the separation of attributes (color, shape, hardness) as distinct *names* or *designations*.

  5.  **Connect to "Hard and White" (*Jian Bai*):**
