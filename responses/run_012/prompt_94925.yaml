      *   *Connection:* The link is the independence of attributes. In *White Horse*, Color and Shape are distinct attributes. In *Hard and White*, Color and Texture are distinct attributes. The semantic move is treating attributes as the primary referents of names, not the concrete object.
      *   *Defensibility:* Reading 1 is definitely the standard "charitable" reading (e.g., A.C. Graham, Chad Hansen). Reading 2 is often seen as the "literal" but paradoxical reading. I will argue Reading 1 is more defensible for a semantic project.

  8.  **Final Polish:** Check tone. Ensure all constraints of the prompt are met (explicit *fei* ambiguity, objector response, notion of name, hard-and-white comparison, conclusion on sophistry).

      *(Self-Correction on "Kind-Membership"):* Actually, Reading 2 is often associated with the "Mass Noun" hypothesis (Hansen). If 'horse' is a stuff, 'white horse' is a different stuff. This isn't exactly "non-membership" in the set-theoretic sense, but rather "non-identity of stuff". However, the prompt defines Reading 2 as "kind-membership: the kind white horse is not included in the kind horse." I must stick to the prompt's definition of Reading 2, even if scholarly debates vary. I will interpret this as an exclusionary claim about kinds.

