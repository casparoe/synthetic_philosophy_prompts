      *   *Rule vs. Stock:* KS divides a pie. The Treaty established a *constitution* (rules for future conduct). KS is static; the Treaty is dynamic/institutional.
      *   *Measurement Ambiguity:* Sectors by longitude vs. area. KS requires a defined utility metric. If players measure "share" differently, the vector $u$ is ill-defined.
