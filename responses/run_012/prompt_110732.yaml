answer: |-
  You have stumbled onto one of the most subtle distinctions in decision theory. The person who told you it was just the Prisoner's Dilemma was half-right about the *structure* but wrong about the *mechanism*. The Prisoner's Dilemma describes the payoff matrix; it does not describe the reasoning process you are using.

  Here are the names for the move, the assumption, and the boundary, ranging from the classic to the modern rigorous definitions.

  ### 1. The Move: Superrationality
  The specific move you are describing—choosing a strategy based on the premise that all other rational agents in the same situation will arrive at the exact same conclusion—is called **Superrationality**.

  The term was coined by Douglas Hofstadter (of *Gödel, Escher, Bach* fame) in a 1983 *Scientific American* column. He described a contest almost identical to yours: a pot would be divided by the sum of all entries submitted by readers. Readers could submit any positive integer.
  *   **Standard Rationality (Nash):** Submit a huge number. If others submit small numbers, you win big.
  *   **Superrationality:** Submit 1. If everyone reasons identically, the pot is split evenly. If everyone tries to "win" by submitting higher numbers, the denominator explodes and the payout approaches zero for everyone.

  **Sharp Definition:** A decision procedure that selects an action not based on causal influence over others, but on the logical necessity that any agent with identical information and rationality will output the same action.

  ### 2. The Assumption: Logical Correlation
  You asked for the name of the assumption that "other people... will land where I land." In Causal Decision Theory (the standard model), your choice has no causal link to theirs. In your model, there is a **Logical Correlation**.

  This is the core of **Evidential Decision Theory (EDT)** and its modern successor, **Functional Decision Theory (FDT)**.
  *   **Causal Link:** I push a domino, it hits the next one.
  *   **Logical Correlation:** I solve an equation $2+2=x$. You solve the same equation $2+2=y$. There is no causal link between my pen and your pen, but there is a logical link between $x$ and $y$. If I determine $x=4$, $y$ must be 4.

  **Sharp Definition:** The assumption that the other players are running the same decision algorithm as you. Therefore, your calculation of the "best move" is effectively a simulation of their calculation. Your choice is *evidence* of their choice, even if it is not the *cause*.

  ### 3. The Boundary: Common Knowledge of Rationality (CKR)
  This is the most critical part. You noted that sometimes this move is right, and sometimes it is a "trap" where you restrain yourself and others just grab.

  The boundary condition is **Common Knowledge of Rationality** combined with **Reference Class Homogeneity**.

  *   **When it works:** You are in a room of game theorists, or entrants who all read the same manifesto, or AI agents running the same source code. Everyone knows everyone is rational, everyone knows everyone knows, ad infinitum. Here, Superrationality is the winning move.
  *   **When it fails (The Trap):** You are in a public contest where most entrants are not reasoning strategically (they are "grabbers," or irrational, or unaware). If you assume Logical Correlation with agents who are *not* logically correlated to you, you commit **Naive Universalization**.

  **Sharp Definition:** The move is legitimate only if the other players belong to the same **Reference Class of Rationality**. If the population is heterogeneous (mixed rational/irrational), Superrationality collapses into self-harm because your restraint is not mirrored.

  ### Summary of Terms

  | Concept | Established Term | Sharp Definition |
  | :--- | :--- | :--- |
  | **The Move** | **Superrationality** (or **FDT**) | Choosing the action that yields the best outcome *if* all identical rational agents choose it. |
  | **The Assumption** | **Logical Correlation** | The premise that your decision algorithm and theirs are functionally identical, making your outputs correlated without causal contact. |
  | **The Boundary** | **Strategic Symmetry** | The condition where all players share **Common Knowledge of Rationality**. If symmetry breaks, the move becomes a "Sucker's Payoff." |

  ### Why "Prisoner's Dilemma" Was Insufficient
  In a standard Prisoner's Dilemma, the Nash Equilibrium is to Defect. A standard rational agent *must* defect.
  In your contest, the Nash Equilibrium is to Enter Multiple Times.
  However, **Superrationality** allows you to escape the Nash Equilibrium without communication. It posits that "Rationality" shouldn't mean "maximize my payoff holding others constant" (Nash), but "maximize my payoff assuming others solve the problem as I do."

  ### The Warning (The Trap You Identified)
  You correctly identified that this is dangerous. In the literature, applying Superrationality in a world of standard rational agents is sometimes called the **Unilateralist's Curse**.

  If you act as a Superrationalist in a crowd of Causal Decision Theorists (standard rational actors), you are essentially volunteering to lose. You are betting on a correlation that does not exist.

  **The Rule of Thumb:** Only employ Superrationality when you have high confidence that your opponents are **Logical Twins** (e.g., they read the same books, belong to the same niche community, or are AI agents). If the crowd is the "general public," assume they are Causal Agents, and do not restrain yourself.
