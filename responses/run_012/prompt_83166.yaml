answer: |-
  ### Part 1: The Definition

  **Locked Definition:** Life is a **Chemical System Capable of Darwinian Evolution.**

  **Translation:** To count as "Life" for this procedure, the sample must be made of matter (not software), it must be complex (not random noise), and it must show evidence that it copies itself with small errors that get passed on.

  **Why this one?** It is the only definition a chemist can test for in four hours. You can measure polymers, chirality, and replication rates. You cannot measure "purposiveness" or "lineage" in a single shift.

  **The Cost:** This definition excludes two things you might care about:
  1.  **Viruses:** They don't evolve independently; they need a host. Strictly speaking, they are not "Life" under this definition.
  2.  **Metabolism-Only Systems:** A chemical soup that eats and grows but doesn't replicate isn't "Life" here, it's just chemistry.

  **If you locked to a different definition:**
  *   **Metabolic System:** The brine sample (Case 1) becomes "Life" immediately. This increases false positives (quarantining rocks). The Virus (Case 2) remains "Not Life," which is a safety risk.
  *   **Darwinian Evolution (No Chemical Constraint):** The Digital Organism (Case 3) becomes "Life." This triggers a Tier 3 Quarantine on a computer file, which is absurd.

  **We are locking to Chemical + Darwinian.** It is the safest bet for avoiding false alarms on Tier 3, provided we add a safety override for replicators.

  ***

  ### Part 2: The Decision Procedure (Bench Checklist)

  **Goal:** Assign Tier 1 (Continue), Tier 2 (Destructive Test), or Tier 3 (Quarantine).
  **Time Limit:** 4 Hours.
  **Rule:** If you check a box and can't verify it, mark "Indeterminate." Do not guess.

  **Step 1: The Physical Check**
  *   **Question:** Is the signal coming from physical matter (atoms/molecules)?
  *   **Yes:** Go to Step 2.
  *   **No:** (e.g., simulation, software artifact). **STOP. Tier 1.**
  *   **Judgment Call:** Distinguishing instrument noise from physical signal. If unsure, run a blank.

  **Step 2: The Complexity Check**
  *   **Question:** Is the chemistry non-random? (Look for: Chiral excess, long-chain polymers, specific isotopic ratios).
  *   **Yes:** Go to Step 3.
  *   **No:** (e.g., simple salts, racemic mix). **STOP. Tier 1.**
  *   **Indeterminate:** Signal is weak or noisy. **STOP. Tier 2** (Destructive test needed to clean signal).

  **Step 3: The Replication Check**
  *   **Question:** Is there evidence of copying? (Look for: Nucleic acids, cell division, exponential growth in culture).
  *   **Yes:** Go to Step 4.
  *   **No:** Go to Step 4.
  *   **Indeterminate:** Polymers present, but function unknown. **STOP. Tier 2.**

  **Step 4: The Independence Check**
  *   **Question:** Does it replicate/metabolize without added host machinery?
  *   **Yes:** **VERDICT: LIFE. Trigger Tier 3.**
  *   **No:** (e.g., requires host cells to copy). **VERDICT: REPLICATOR.** Go to Step 5.
  *   **Indeterminate:** Cannot determine dependency in 4 hours. **STOP. Tier 3** (Assume worst case).

  **Step 5: The Safety Override (Crucial)**
  *   **Question:** Is it a Replicator (from Step 4) OR does it contain Genetic Material (DNA/RNA/Analogue)?
  *   **Yes:** **Trigger Tier 3.** (Even if not "Life" by definition).
  *   **No:** **Trigger Tier 2.** (Interesting chemistry, but low hazard).

  **Hand-Off Points:**
  *   **Any "Indeterminate" result:** Freeze sample. Log as "Pending Review." Call Senior Advisor.
  *   **Tier 3 Decision:** You press the button, but you must file the "Safety Override" justification if Step 4 was "No."

  ***

  ### Part 3: Running the Cases

  **Case 1: The Chiral Brine**
  *   **Step 1 (Physical):** Yes.
  *   **Step 2 (Complexity):** Yes (Chiral excess, redox gradient).
  *   **Step 3 (Replication):** No (No cells, no division observed).
  *   **Step 4 (Independence):** N/A.
  *   **Procedure Output:** **Indeterminate at Step 3.**
  *   **Action:** **Tier 2.**
  *   **Logic:** It looks biological, but we haven't seen it copy. We are authorized to destroy part of the sample to look for genetic polymers. This is the correct use of Tier 2.

  **Case 2: The Virus-Like Particle**
  *   **Step 1 (Physical):** Yes.
  *   **Step 2 (Complexity):** Yes (Protein coat, nucleic acid).
  *   **Step 3 (Replication):** Yes (But only in host).
  *   **Step 4 (Independence):** **No.**
  *   **Procedure Output (Strict Definition):** **Not Life.**
  *   **Procedure Output (With Step 5 Override):** **Tier 3.**
  *   **The Break:** This is the verdict you wouldn't want. Under the "Chemical + Darwinian" definition, this is **Not Life**. It is a parasite, not a system. If the student follows the definition strictly without Step 5, they classify it as Tier 1/2. That is a biosafety failure.
  *   **Fix:** Step 5 forces the Tier 3 Quarantine based on *hazard*, not *ontology*. The student must understand: "We are quarantining this not because it's Alive, but because it Replicates."

  **Case 3: The Digital Organism**
  *   **Step 1 (Physical):** **No.** (It is code on a drive).
  *   **Procedure Output:** **Tier 1.**
  *   **Logic:** It evolves, but it isn't chemistry. It cannot contaminate the subsurface or the lab staff.
  *   **The Flip:** If you had chosen the "Darwinian Evolution" definition *without* the "Chemical" constraint, this would trigger Tier 3. You would be quarantining a hard drive because of a philosophical technicality. The "Chemical" constraint in Step 1 prevents this waste.

  ***

  ### Part 4: Where the Procedure Lies to You

  **1. The "Independence" Trap (Step 4)**
  *   **The Lie:** We pretend we can tell if something replicates independently in four hours.
  *   **Reality:** You often can't. Symbionts look like parasites.
  *   **The Fix:** That's why "Indeterminate" at Step 4 triggers Tier 3. It is better to freeze a rock than release a symbiont that becomes pathogenic later. This is a values judgment (Safety > Science) dressed up as a data gap.

  **2. The "Life" Label**
  *   **The Lie:** The procedure implies we are detecting "Life."
  *   **Reality:** We are detecting "Biohazards and Complex Chemistry."
  *   **The Fix:** When writing the report, do not write "Confirmed Life" unless Step 4 is "Yes." Write "Confirmed Replicator" or "High-Probability Biosignature." The Review Board cares about risk, not philosophy. Don't give them ammunition to shoot you down over the definition of life.

  **3. The Indeterminate Zone**
  *   **The Lie:** That "Indeterminate" is a neutral state.
  *   **Reality:** "Indeterminate" is the most political output you have. It stops the line, costs money, and demands senior attention.
  *   **The Fix:** Use it. If you are tired, if the instrument is acting weird, or if you feel gut-level unease, mark Indeterminate. The procedure protects you if you are cautious. It does not protect you if you are confident and wrong.

  **Summary for the Student:**
  1.  Is it matter?
  2.  Is it complex?
  3.  Does it copy?
  4.  If it copies, does it need a host? (If yes, Quarantine anyway).
  5.  If you don't know, Freeze and Call.

  **Final Warning:** This procedure will tell you the Virus (Case 2) is not "Life." Do not let that word stop you from Quarantining it. The definition is for the Review Board. The Safety Override is for your colleagues.
