prompt: |-
  Bit of an ongoing argument with a labmate and I want my side stress-tested. My position: the replication crisis in social psych and biomed is at bottom a problem with the inference framework, and the fix is to replace p-values with Bayes factors under default (objective-ish) priors. Bonus claim that I lean on pretty hard: with a fixed prior you don't need to preregister a sample size at all, because optional stopping doesn't bias a Bayes factor the way it inflates a p-value, so a lot of the preregistration push is solving a problem that only exists for frequentists.

  What counts against this? I want the actual defeaters ranked by how decisive they'd be -- formal results, simulation results, empirical patterns (including things that have arguably already happened, like journals or subfields that already switched), and conceptual arguments, not just "p-hacking is bad." Tell me which ones a committed Bayesian would concede really bite versus wave off as misuse, and whether the position has been quietly qualified into something unfalsifiable -- and if it has, whether that's actually a problem for a position of this kind. I care most about the optional-stopping part, since if that result is shakier than it looks the whole package looses its main selling point; say how exposed it really is. And say where you'd put the blame instead if not the framework -- design, incentives, base rates, measurement, theory.

  Say how confident you are in each claim and single out the one you're least sure of.

  Give it back as JSON: an array of objects with "defeater" (short name), "kind" ("formal", "simulation", "empirical", "conceptual", "historical"), "what_it_would_show", "decisiveness" ("fatal", "serious", "awkward", "cosmetic"), "defender_concedes" ("yes", "no", "partly"), "confidence" (0-1); then top-level "ranked_summary" (one line per defeater, most to least decisive), "insulation_verdict", and "least_confident_claim".
reasoning: |-
  Here's a thinking process that leads to the suggested JSON response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The replication crisis in social psych/biomed.
      *   **User's Position:** The root cause is the inference framework (frequentist/p-values). The fix is Bayes Factors (BF) with default/objective priors.
      *   **Bonus Claim (Crucial):** With fixed priors, optional stopping doesn't bias BFs, so preregistration of sample size is unnecessary (unlike p-values).
      *   **Task:** Stress-test this position. Identify defeaters (arguments against), rank them by decisiveness, categorize them (formal, simulation, empirical, conceptual, historical), assess defender concession, estimate confidence, and provide a summary/verdict.
      *   **Specific Focus:** The optional stopping claim is the weak point to probe hardest.
      *   **Alternative Blame:** If not the framework, where does the blame lie? (Design, incentives, base rates, measurement, theory).
      *   **Format:** JSON.
      *   **Constraints:** Array of objects with specific keys, plus top-level summary fields. Confidence scores (0-1). Identify the least confident claim.

  2.  **Deconstruct the User's Argument:**
      *   *Premise 1:* Replication crisis is primarily inferential (p-values).
      *   *Premise 2:* Bayes Factors (BF) with default priors solve this.
      *   *Premise 3 (The "Killer App"):* Optional stopping is valid for BFs, removing the need for sample size preregistration.
      *   *Implicit Assumption:* Default priors are robust enough to prevent manipulation and yield consistent evidence across contexts.

  3.  **Brainstorm Defeaters (Counter-arguments):**

      *   *Optional Stopping:* Is it *really* immune?
          *   Formal: BFs are likelihood ratios. If you stop when BF > threshold, you inflate the rate of misleading evidence *if* the prior is wrong or if the stopping rule depends on the data in a specific way (though standard Bayesian theory says stopping rule is irrelevant *for the posterior*, it matters for *calibration* and *decision making*).
          *   Simulation: Rouder (2014) says it's fine. But what about "Bayesian p-hacking"? If you try multiple priors or multiple analyses until BF is significant, that's still hacking.
          *   Conceptual: The "Stopping Rule Principle" holds for inference, but not necessarily for long-run frequency properties of the decision procedure (Type I error control in a regulatory context).

      *   *Default Priors:*
          *   Conceptual: Are there truly "objective" priors? Jeffreys-Zellner-Siow (JZS) priors are common but arbitrary.
          *   Empirical: Different default priors yield different BFs. Sensitivity analysis is needed, which undermines the "simple fix" narrative.
          *   Formal: Bartlett's paradox / Lindley's paradox. With large N, BF can favor null even when p-value is tiny (if effect is small). Is this a bug or feature?

      *   *Replication Crisis Root Cause:*
          *   Empirical/Historical: Fields that use Bayesian stats (e.g., some areas of neuroimaging, ecology) still have replication issues.
          *   Conceptual: Garbage in, garbage out. If measurement is noisy or theory is weak, BF just quantifies uncertainty about a bad model more precisely.
          *   Incentives: Publication bias affects BFs too (file drawer problem exists for non-significant BFs).

      *   *Preregistration:*
          *   Conceptual: Preregistration isn't just about N. It's about HARKing (Hypothesizing After Results are Known). BFs don't stop HARKing.
          *   Practical: Optional stopping *does* require a stopping rule to be defined for the BF to be interpretable in a decision context (e.g., cost of sampling).

  4.  **Evaluate and Rank Defeaters:**

      *   *Defeater 1: The "Bayesian p-hacking" / Analyst Degrees of Freedom.* Even with fixed priors, you can choose *which* variables to analyze, *which* covariates to include, or *when* to stop based on interim BFs until you get the desired result. While the BF math is coherent, the *process* can still be gamed to produce misleading evidence if the prior doesn't match reality.
          *   *Decisiveness:* Serious. It attacks the "fix" directly.
          *   *Concession:* Partly. Bayesians admit priors matter, but argue coherence protects truth.

      *   *Defeater 2: Optional Stopping & Calibration.* While the *likelihood principle* says stopping rules are irrelevant for the *evidence*, they are relevant for the *frequency of misleading evidence* if the null is true. If you sample until BF > 10, and the null is true, you *will* eventually get BF > 10. This is the "sampling to a foregone conclusion" problem.
          *   *Decisiveness:* Fatal (to the specific claim that preregistration of N is unnecessary).
          *   *Concession:* Yes (mostly). Most careful Bayesians admit you need a stopping *criterion* (cost/benefit), not just "stop when significant."

      *   *Defeater 3: Default Prior Sensitivity.* Default priors (e.g., Cauchy(0, 0.707)) are not universal truth. In some fields, effects are tiny; in others, huge. A default prior can bias the BF against small true effects (Lindley's Paradox).
          *   *Decisiveness:* Serious.
          *   *Concession:* Yes.

      *   *Defeater 4: Theory/Measurement vs. Inference.* The crisis is often about weak manipulations and noisy measures, not just alpha=0.05. BF on noisy data yields high uncertainty, not truth.
          *   *Decisiveness:* Serious (shifts blame).
          *   *Concession:* Partly.

      *   *Defeater 5: Historical/Empirical Evidence.* Subfields adopting Bayesian methods haven't seen a miraculous end to replication failures (e.g., fMRI).
          *   *Decisiveness:* Awkward.
          *   *Concession:* No (argues adoption wasn't pure enough).

  5.  **Drafting the Content (Iterative refinement for JSON):**

      *   *Refining Optional Stopping:* The user claims "optional stopping doesn't bias a Bayes Factor." Technically, the *value* of the BF is valid conditional on the data. However, the *rate* of false positives (misleading evidence) depends on the stopping rule if you treat the BF as a decision threshold. If I sample until BF_10 > 10, and H0 is true, I will eventually hit 10. This is a known result (e.g., Sanborn & Hills, 2014). This is the biggest hole.
      *   *Refining "Default Priors":* The claim is "objective-ish." There is no such thing as a truly objective prior in complex models. This makes the "fixed prior" claim fragile.
      *   *Refining "Root Cause":* Incentives and Base Rates (Ioannidis 2005) are stronger predictors of replication failure than alpha levels alone.

  6.  **Assigning Confidence and Decisiveness:**
      *   Optional Stopping/Calibration: High confidence, Fatal.
      *   Analyst Degrees of Freedom: High confidence, Serious.
      *   Prior Sensitivity: High confidence, Serious.
      *   Theory/Measurement: Medium-High confidence, Serious (shifts blame).
      *   Historical Adoption: Medium confidence, Awkward.

  7.  **Addressing the "Insulation Verdict":**
      *   Has the position been qualified into unfalsifiability? Yes, often Bayesians retreat to "you didn't use the *right* prior" or "you interpreted it as a decision rule."
      *   Is that a problem? Yes, it makes the "easy fix" claim unfalsifiable.

  8.  **Constructing the JSON:**
      *   Ensure valid JSON syntax (quotes, commas, brackets).
      *   Check all required keys.
      *   Ensure the "least_confident_claim" matches the lowest confidence score in the array.

      *(Self-Correction during drafting)*: I need to be careful with the "Optional Stopping" defeater. Standard Bayesian theory (Likelihood Principle) says stopping rules are irrelevant *for the interpretation of the evidence*. However, if the goal is *error control* (which preregistration aims for), BFs do not guarantee error rates unless the stopping rule is accounted for in the calibration. The user's claim is that preregistration of *sample size* is unnecessary. This is true *if* you accept sequential analysis with a specific BF threshold, BUT you still need to preregister the *stopping rule* (e.g., "stop when BF > 10 or N=500"). Pure optional stopping ("stop when I feel like it" or "stop when BF looks good") *does* inflate misleading evidence rates in the long run. I will frame this carefully.

      *Least Confident Claim:* Probably the "Historical/Empirical" one, because "adoption" is hard to define cleanly. Many fields use hybrids.

      *Insulation Verdict:* The position often insulates itself by redefining "bias" (coherence vs. calibration).

  9.  **Final Review against Constraints:**
      *   JSON format? Yes.
      *   Array of objects? Yes.
      *   Specific keys? Yes.
      *   Top-level summary fields? Yes.
      *   Confidence 0-1? Yes.
      *   Focus on optional stopping? Yes.

  10. **Final Polish:** Ensure tone is objective and analytical, suitable for a lab argument stress-test. (Proceed to generate JSON).

      *Wait, one check on the Optional Stopping Defeater:*
      Is it "Fatal"? If the user says "you don't need to preregister sample size," that is actually technically true in sequential Bayesian design *provided* you have a stopping criterion based on the BF. However, the user implies "optional stopping doesn't bias," which is often interpreted as "you can peek and stop whenever without consequence." If "whenever" includes "when the result is significant," that *does* bias the rate of misleading evidence. I will rank this as "Fatal" to the specific claim that *no* preregistration (of stopping rule) is needed.

      *Wait, one check on "Default Priors":*
      Are they "objective-ish"? Most Bayesians concede they are reference points, not truth. This is a "Serious" defeater to the "fix" claim.

      *Wait, one check on "Root Cause":*
      Ioannidis's "Why Most Published Research Findings Are False" relies heavily on Pre-study Odds (Base Rates) and Bias (p-hacking). Switching to BF reduces p-hacking *impact* but doesn't fix Base Rates. If Base Rates are low, BF still yields high false discovery rates unless the threshold is very high. This is a "Serious" defeater to the "at bottom" claim.

      *Let's finalize the JSON structure.*
      Keys: "defeater", "kind", "what_it_would_show", "decisiveness", "defender_concedes", "confidence".
      Top level: "ranked_summary", "insulation_verdict", "least_confident_claim".

      *Confidence Calibration:*
      Optional Stopping/Calibration: 0.95 (Math is clear).
      Prior Sensitivity: 0.90 (Well documented).
      Base Rates/Theory: 0.85 (Consensus growing).
      Analyst DF: 0.90 (Simulation evidence).
      Historical: 0.70 (Data is messy).

      Least confident: Historical.

      *Insulation Verdict:* The position insulates by shifting from "frequency properties" to "coherence."

      *Ready to write.*
