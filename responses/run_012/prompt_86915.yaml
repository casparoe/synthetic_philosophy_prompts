  *(Refining the "Better Analogy")*: "Tenured professors are more conservative than grad students." This captures the institutional pressure without implying intrinsic nature. Or "People in cold climates wear more layers." No, that's too physical. Let's stick with SES/Health or Institutional Roles. SES is better because it involves population-level stats that are often misinterpreted as individual traits.

