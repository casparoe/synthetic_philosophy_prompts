      *   *What was his actual position?* Buridan was a voluntarist (to an extent) or at least believed the will could suspend judgment or choose even without intellectual determination. He argued *against* the idea that the will is determined by the intellect's judgment of the good. So, the idea that the will *cannot* act without a reason (intellectual preference) is actually contrary to Buridan's view.
      *   *Decision Theory Connection:* Completeness axiom (for any $x, y$, either $x \succeq y$ or $y \succeq x$). Indifference is allowed ($x \sim y$). If indifferent, any choice is rational. Starving is *irrational*.
      *   *The "Moral":* The text suggests the moral is "invent a tie-breaker." Historically, the paradox is usually used to show the absurdity of determinism or to discuss free will. In decision theory, it's about resolving indifference.

