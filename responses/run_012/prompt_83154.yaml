answer: |-
  # THE SUNK COST DECISION TREE
  **Goal:** Move from "It's a fallacy" to "Which kind of rationality is this?"
  **Instructions:** Start at the Root. Answer **Yes/No** or select the branch that fits your intuition about the case. Track your path (e.g., 1A-2B-3A) to find your position at the Leaves.

  ---

  ### ROOT: What role does the past cost play in your deliberation?
  *   **A)** It enters the calculation as a *negative value to be recovered* in the future sum. (The "Math" view)
  *   **B)** It serves as *evidence* about the quality of the project or the world. (The "Information" view)
  *   **C)** It serves as a *constraint* on your future choices. (The "Commitment" view)
  *   **D)** It generates an *obligation or right* independent of future utility. (The "Normative" view)
  *   **E)** It causes *psychological pain* to ignore, which affects utility. (The "Psychological" view)

  ---

  ### NODE 1 (From A: The "Math" View)
  **Q:** Are you claiming this is rational *for this specific act*, or that a *general rule* against calculating sunk costs is too expensive to run?
  *   **Yes (Specific Act):** You believe past spend changes future EV directly. → **Go to Leaf 1**
  *   **No (General Rule):** You believe the calculation is wrong, but the *heuristic* "don't waste" is useful on average. → **Go to Node 2**

  ### NODE 2 (From 1-No)
  **Q:** Is this heuristic rational because of *individual cognitive limits* or because it works for the *type/species* in an evolutionary environment?
  *   **Individual Limits:** You can't compute EV, so use "don't waste". → **Go to Leaf 2**
  *   **Type/Species:** Animals do it; it prevents exploitation or ensures follow-through in uncertain environments. → **Go to Leaf 3**

  ### NODE 3 (From B: The "Information" View)
  **Q:** Does the investment signal *private information* you have, or does it signal *quality* to others?
  *   **Private Info:** "I wouldn't have invested unless I knew something good." → **Go to Leaf 4**
  *   **Signal to Others:** "If I quit now, others will think I'm weak/uninformed." → **Go to Node 4**

  ### NODE 4 (From 3-Signal to Others)
  **Q:** Is the goal to *bind yourself* or to *threaten others*?
  *   **Bind Self:** You want to force yourself to finish. → **Go to Leaf 5**
  *   **Threaten Others:** You want to show you won't back down (Burning Boats). → **Go to Leaf 6**

  ### NODE 5 (From C: The "Commitment" View)
  **Q:** Did you *deliberately engineer* this cost to bind yourself, or did the cost arise naturally?
  *   **Deliberate:** You bought the non-refundable ticket to force attendance. → **Go to Leaf 5**
  *   **Natural:** The cost accumulated, but you now treat it as binding. → **Go to Node 6**

  ### NODE 6 (From D: The "Normative" View)
  **Q:** Is the obligation based on a *promise/relationship* or on *ownership/entitlement*?
  *   **Promise/Relationship:** "We've been together 10 years; I owe it to us." → **Go to Leaf 7**
  *   **Ownership/Entitlement:** "I paid for this dam/seat; it's mine to finish/use." → **Go to Leaf 8**

  ### NODE 7 (From E: The "Psychological" View)
  **Q:** Is the pain of quitting a *bug* to be corrected or a *feature* of your identity?
  *   **Bug:** It's loss aversion; you should debias. → **Go to Leaf 9**
  *   **Feature:** Quitting violates your self-narrative; the pain is data. → **Go to Node 8**

  ### NODE 8 (From 7-Feature)
  **Q:** Does the investment *change your preferences* or merely *reveal them*?
  *   **Changes Preferences:** Investing made you love the PhD; the utility function shifted. → **Go to Leaf 10**
  *   **Reveals Preferences:** You are the kind of person who finishes; quitting hurts your identity. → **Go to Leaf 11**

  ### NODE 9 (Advising Others)
  **Q:** Are you deciding for *yourself* or *advising someone else*?
  *   **Yourself:** You can use second-order strategies (knowing your own bugs). → **Go to Leaf 12**
  *   **Advising:** You must recommend based on first-order EV. → **Return to Node 1**

  ---

  ### THE LEAVES (Positions)

  | Leaf | Position Name | The Awkward Commitment | Path Pattern |
  | :--- | :--- | :--- | :--- |
  | **1** | **Strict EU Eliminationism** | Must advise a friend to abandon a 90% complete project if EV < 0, regardless of waste. | 1A |
  | **2** | **Bounded Rationality** | It is rational to use a false heuristic because truth-seeking is too computationally expensive. | 1B-2A |
  | **3** | **Ecological Rationality** | The "fallacy" is an adaptation for uncertain environments; rational for the type, not the token. | 1B-2B |
  | **4** | **Bayesian Signal** | Staying is rational only if past investment correlates with hidden future value (insider info). | 3A |
  | **5** | **Pre-Commitment Device** | Rational to burn money to constrain future self; irrational if the cost wasn't deliberately chosen. | 3B-4A / 5A |
  | **6** | **Credible Threat** | Rational to incur costs to signal resolve to adversaries; value lies in reputation, not project. | 3B-4B |
  | **7** | **Promissory Obligation** | Past time creates a debt to the partner/project; quitting is a moral violation, not an EV error. | 6A |
  | **8** | **Entitlement Theory** | Past spend grants property rights over the outcome; you "own" the finish line regardless of cost. | 6B |
  | **9** | **Deflationary Error** | There is no reasoning here; it's a cognitive glitch (loss aversion). The question is misframed. | 7A |
  | **10** | **Preference Transformation** | The cost isn't sunk because the investment altered the utility function (you love it *because* you paid). | 8A |
  | **11** | **Narrative Unity** | Rationality includes maintaining a coherent life-story; quitting creates disutility via identity fracture. | 8B |
  | **12** | **Second-Order Rationality** | It is rational to *believe* you should finish (to motivate action) even if you *know* you shouldn't. | 9A |

  ---

  ### META-ANALYSIS (For the Facilitator)

  **1. Indistinguishable Leaves:**
  *   **Leaf 10 (Preference Transformation)** and **Leaf 11 (Narrative Unity)** are empirically inseparable in most cases. Both result in "I stay because the past changed me."
      *   *Distinction:* Leaf 10 claims the *object* is now more valuable (I love the PhD). Leaf 11 claims the *act of quitting* is now more costly (I hate quitters). In practice, agents report both simultaneously.

  **2. Unoccupied/Incoherent Combinations:**
  *   **"Strict EU Eliminationism" + "Ecological Rationality" (Leaf 1 + Leaf 3):** Incoherent. You cannot claim sunk costs *never* enter EV (Leaf 1) while simultaneously claiming a rule honoring them is optimal for the type (Leaf 3). One must yield to the other (usually Leaf 3 subsumes Leaf 1 as a special case of zero-transaction-cost environments).
  *   **"Pre-Commitment" + "Normative Obligation" (Leaf 5 + Leaf 7):** Unexplored/Unattractive. If you deliberately engineered the cost (Leaf 5), the obligation is self-imposed constraint. If the obligation is moral/promissory (Leaf 7), the cost is usually incidental. Claiming *both* implies you made a promise to yourself to bind yourself, which collapses into Leaf 5.

  **3. Case Mapping:**
  *   **The Dam:** Leaf 1 (Politicians should quit) vs. Leaf 6 (Politicians signaling resolve to voters).
  *   **The PhD:** Leaf 10 (I love the work now) vs. Leaf 11 (I'm not a quitter).
  *   **The Relationship:** Leaf 7 (Obligation to partner) vs. Leaf 11 (Identity as a partner).
  *   **The Ticket:** Leaf 5 (Deliberate constraint).
  *   **Advising a Friend:** Leaf 1 (Tell them to quit) vs. Leaf 12 (Help them hack their motivation).

  **4. The "Smugness" Poke:**
  *   Most attendees will start at **1A (Eliminationism)**.
  *   Force them to **Node 9 (Advising Others)**. Ask: "Would you tell your best friend to quit a 99% complete project if the last 1% costs more than the value?"
  *   If they hesitate, they have moved to **Leaf 12 (Second-Order)** or **Leaf 3 (Ecological)**. They are no longer pure Eliminationists. The fallacy is not closed; it is context-dependent.
