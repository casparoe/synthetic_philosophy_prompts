prompt: |-
  My old PhD advisor is retiring next month and I've been roped into giving the toast, and I could use your help writing it. Here's the thing about her: in twelve years I never once heard her say what she actually wanted from any of us. No stated objectives, no heart-to-hearts. She rewarded and punished with a two-second pause, a raised eyebrow, a slightly too-long silence, and you had to reverse-engineer the whole objective function from the outside like some kind of detective. Which is, obviously, her entire field -- she spent her career on inverse reinforcement learning, the problem of figuring out what an agent wants purely from watching what it does. So I don't want a toast that name-drops that. I want a toast that *is* that. Here's what I mean: the speech should narrate a handful of concrete things she did over the years, and from those observations infer the reward function she was really optimizing -- and then be honest that the inference is underdetermined, that tons of different objectives would have produced the same behavior, and defend the one I'm going with anyway. I also want it to include the one observation that broke my model, the behavior that doesn't fit, and what I do with it. And there's a joke I want in there about how we all learned to game her tiny signals -- optimizing the proxy instead of the thing she actually cared about -- because that's true and it's also basically how the whole lab operated for a decade. Also, half the room is going to be her former students, who will absolutely notice if I cheat by smuggling in something she *told* me rather than something I inferred, so please keep the evidence strictly behavioral. The other half is her family, who have never heard of any of this and mainly want to laugh a bit and cry a bit. Five minutes, warm, not a lecture. One more constraint that I think will actually make it better: pick a single reward function and commit to it, then tell the room what future behavior of hers would have proven me wrong -- like a real falsifiable claim. I want to end on that, it feels like something she'd respect.
