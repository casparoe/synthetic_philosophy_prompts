answer: |-
  | Component | Chess Engine | Modern LLM |
  | :--- | :--- | :--- |
  | **Designer** | Human Programmer | Architect + Data Curators |
  | **Objective** | Maximize Win Probability | Minimize Next-Token Loss (Training) |
  | **Search** | Minimax/Alpha-Beta Pruning | Forward Pass + Sampling |
  | **Representation** | Board State Vector | High-Dimensional Embeddings |
  | **"Wanting"** | Capture Queen (Instrumental) | Complete Semantic Pattern |

  **Where the Mapping Breaks**
  The obvious disanalogies (training vs. coding) matter less than the structural opacity of the task. A chess engine has a well-defined terminal state: checkmate. Success is vindicated independently of interpretation. An LLM during inference has no external win condition; its "goal" is merely coherence or probability maximization relative to its weights. There is no fact of the matter about whether it "succeeded" except relative to human interpretation of the text.

  Furthermore, Dennett's intentional stance is supposed to be a shortcut for the *design stance*. In chess, we know the lower-level description: the code explicitly prioritizes material advantage. In LLMs, the lower-level description (activation patterns) does not transparently map to specific goals like "answer honestly" or "deceive." The intentional stance isn't simplifying a known mechanism; it is hallucinating structure onto a high-dimensional optimization surface where "goals" are emergent and unstable.

  **What the Chess Case Imports**
  The chess analogy smuggles in three assumptions:
  1.  **Goal Stability:** It assumes the system's objective is fixed by the designer. In LLMs, objectives shift via context prompting and RLHF alignment, decoupling the trainer's intent from the model's immediate behavior.
  2.  **Design Transparency:** It assumes there is a specifiable lower-level description that validates the intentional gloss. With LLMs, the "design stance" is often inaccessible, making the intentional stance not a shortcut, but a guess.
  3.  **Independent Vindication:** It assumes success exists independently of our talk (winning vs. losing). For LLMs, "success" is often constituted by our acceptance of the intentional stance itself (i.e., it sounds like it believes).

  **Does the Conclusion Survive?**
  Your classmate's conclusion—that belief-attributions are *merely* instrumental—relies entirely on the chess analogy holding. In chess, instrumentalism works because the *real* story is the code. If the LLM lacks a clear code-level goal during inference, the intentional stance cannot be merely instrumental; it becomes constitutive. We aren't simplifying a known mechanism; we are creating the only framework in which the system makes sense.

  If there is no fact of the matter about what the system is doing independent of our interpretation, then saying "it's just a stance" loses its force. In chess, the stance is optional because the design stance is available. In LLMs, the design stance is opaque, making the intentional stance necessary, not just convenient. This suggests belief-attributions might be doing more work than your classmate admits—they are bridging a gap where no mechanistic story exists.

  **A Better Comparison**
  Discard the chess engine. Compare the LLM to an **improvisational actor**.
  The actor has no fixed script (no terminal win state) and no internal belief in the fiction (no genuine intentionality). Yet, we attribute beliefs and desires to the character to make sense of the performance. Unlike the chess engine, the actor's "goals" are negotiated in real-time with the audience. This captures the LLM's dynamic, context-dependent generation without importing the false precision of a game engine's objective function. Like the actor, the LLM simulates agency without possessing the vindication conditions that make chess instrumentalism secure.
