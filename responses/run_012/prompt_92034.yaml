      *   *Honesty:* Acknowledge this is a model, not reality. The value is isolating the *mechanism* of selection, not proving the history.
      *   *Defense:* The point isn't that economics *always* determines ideas, but that there is a *pressure* that functions this way. The game isolates that pressure.

  8.  **Drafting the Plan:**

      *   **Title:** *Substrate.*
      *   **Time:** 80 mins (10 setup, 45 game, 25 debrief).
      *   **Materials:** Tokens, Paper, Pens, Timer, Tape (for zones).
      *   **Phases:**
          1.  Calibration (Production).
          2.  Phase 1: The Architect (Intentional).
          3.  Phase 2: The Filter (Functional).
          4.  Phase 3: The Feedback (Loop).
      *   **Arena Mechanic:** Production thresholds dictate physical positioning and communication rules.
