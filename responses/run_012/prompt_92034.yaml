      *   *The Switch:*
          *   Part 1: "The Constitution." They vote. (Intentional).
          *   Part 2: "The Drift." No voting. Just propose. If it helps production, it stays. If not, it gets discarded by the instructor (The Material Hand).
      *   *The Arena:* In Part 2, halve the production. This increases pressure. Ideas that require long debate (complex rights) die because they cost too much time/energy to maintain. Simple ideas ("Work Harder") survive.

      *Wait, the "Arena" constraint needs to be about WHERE the fight happens.*
      *   Let's make the "Venue" physical.
      *   Condition 1: Meeting Hall (Tables pushed together).
      *   Condition 2: Factory Floor (Tables separated, must pass notes).
      *   This physically constrains the *mode* of ideology.

      *Okay, let's synthesize for maximum impact and minimum friction.*
      *   **Game:** *The Mill.*
      *   **Goal:** Keep the Mill running.
      *   **Resource:** "Output" (points).
      *   **Ideas:** "Rules" written on cards.
      *   **Mechanic:** Rules cost Output to maintain. Rules increase Output.
      *   **Phase 1:** Players choose Rules freely. (Intent).
      *   **Phase 2:** Players propose Rules, but the Instructor culls any Rule that doesn't increase Output immediately. (Selection).
      *   **Arena:** Phase 1 allows open debate. Phase 2 limits debate time based on Output level. (Material conditions limit the ideological space).
      *   **Feedback:** One Rule allows "Investment" (saving Output), which changes the culling threshold.

