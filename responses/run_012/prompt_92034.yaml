      *   Interpretation: If the economy is in crisis, the debate happens in the "Emergency Committee." If booming, it happens in the "Public Square."
      *   Implementation: Use physical zones in the room.
      *   Zone A (The Floor): High production, open movement.
      *   Zone B (The Bunker): Low production, confined to seats.
      *   If Production > X, you debate in Zone A. If Production < X, you debate in Zone B.
      *   In Zone B, you can't pass notes. You can only shout. This changes the *kind* of ideas (Slogans vs. Policy).

