  9.  **Refining the "Arena" Constraint:**
      *   Make it concrete.
      *   **High Production:** "The Forum." Students can stand, move, talk to anyone.
      *   **Low Production:** "The Shift." Students must sit at their table, can only talk to tablemates, must write notes to others.
      *   This materially constrains the *spread* of ideas without dictating the *content*.

  10. **Refining the "Selection" vs "Choice":**
      *   **Phase 1:** Instructor asks "What rule do you want?" They write it. It sticks.
