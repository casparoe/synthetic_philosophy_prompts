answer: |-
  # Seminar Plan: *Substrate*

  **Course:** Social & Political Theory (Year 2)
  **Topic:** Base/Superstructure (Causation vs. Selection)
  **Time:** 80 Minutes
  **Students:** 16 (4 tables of 4)
  **Materials:**
  *   100 identical tokens (poker chips, dried beans, or folded paper squares).
  *   50 small slips of paper ("Edicts").
  *   4 Pens.
  *   Masking tape (to mark floor zones).
  *   Whiteboard/Projector (for tracking global production).
  *   Timer (visible).

  ---

  ## 1. The Setup (0:00 – 0:10)

  **Room Layout:**
  *   Four tables arranged in a square.
  *   **Zone A (The Forum):** The open space in the middle of the tables.
  *   **Zone B (The Shift):** The seats at the tables.
  *   Tape a line on the floor separating the tables from the center.

  **The Story:**
  Tell them: *"You are a society trying to sustain a metabolic process. You need to produce 'Surplus' (tokens). You also need to govern yourselves using 'Edicts' (paper slips). I am not your ruler. I am the Environment. I enforce the physics of scarcity."*

  **The Material Base (Rules of Production):**
  1.  **Cycle:** The game runs in 5-minute rounds.
  2.  **Production:** At the end of every round, each table produces **5 tokens** automatically.
  3.  **Labor:** Students can earn **+1 token** per person by stacking tokens neatly (simulated labor) during the round.
  4.  **Cost of Ideas:** To write an Edict, a table must pay **3 tokens** from their stash into a "Bureaucracy" bowl (center of room).
  5.  **Effect of Ideas:** An Edict can change *any* rule of production (e.g., "Stacking pays 2 tokens," "Tables must share," "Tax the rich tables").
  6.  **Survival:** If a table ends a round with **0 tokens**, they are "Bankrupt." They cannot propose Edicts next round.

  **The Arena Constraint (Crucial Mechanic):**
  *   **High Surplus (Total Room Tokens > 60):** **Mode: The Forum.** Students may leave seats, stand in the center, shout, and negotiate freely.
  *   **Low Surplus (Total Room Tokens < 60):** **Mode: The Shift.** Students must remain seated. No shouting. Communication between tables must be written on scraps of paper and physically carried.

  **Initial State:**
  *   Give each table 10 tokens.
  *   Total Room Tokens = 40.
  *   **Start in Mode: The Shift.** (Scarcity is the default).

  ---

  ## 2. Phase 1: The Architect (Intentional Causation) (0:10 – 0:30)

  **Instruction:**
  *"For the first two rounds, you have absolute agency. You can write any Edict you want. I will enforce it exactly as written. You are the ruling class. Design the society you intend."*

  **Run Two Rounds:**
  *   Let them write Edicts.
  *   Enforce them strictly.
  *   **Predictable Outcome:** They will likely write Edicts that benefit their specific table or try to redistribute wealth based on moral arguments ("Share equally").
  *   **Instructor Role:** Be a benign bureaucrat. If they write "Table 1 gets double points," make it happen.

  **Stop at 0:30.**
  *   Count the tokens.
  *   If they are in "The Forum" (High Surplus), artificially remove 20 tokens from the center bowl to drag them back into "The Shift."
  *   **Say:** *"The economy has contracted. Resources are tight."*
  *   **Enforce Mode: The Shift.** (Sit down, no shouting).

  ---

  ## 3. Phase 2: The Filter (Functional Selection) (0:30 – 0:55)

  **Instruction:**
  *"The rules have changed. I am no longer enforcing your intent. I am enforcing the material outcome. You may still write Edicts. You still pay 3 tokens. But here is the new law:*
  *If an Edict does not result in a net increase in that table's token production within one round, **I will burn it.** I will not ask you. I will not vote. It simply disappears because the system could not sustain it."*

  **The Switch:**
  *   In Phase 1, ideas survived because they were *chosen*.
  *   In Phase 2, ideas survive because they *worked* (materially).

  **Run Three Rounds:**
  *   **Round 3:** They propose ideas. Some help production, some don't. **Silently remove** any Edict that didn't yield extra tokens. Do not explain why. Just take the paper.
  *   **Round 4:** Scarcity should be biting. They are in "The Shift" (seated, quiet). Watch them struggle to coordinate complex ideas because they can't talk across tables.
  *   **Round 5 (The Feedback Loop):** Introduce one specific Edict option they can discover: **"The Investment."**
      *   *Rule:* A table can pay 10 tokens now to permanently increase their base production to 8 tokens/round.
      *   *Trap:* To get 10 tokens, they must hoard, not share. This changes the social relations (material payoff changes behavior).

  **Watch For:**
  *   Complex, moralistic ideas ("Fairness") will die because they cost coordination time (which is scarce in "The Shift") without immediate token return.
  *   Simple, coercive ideas ("Work Faster") will survive because they yield immediate tokens.
  *   **The Arena Effect:** Because they are in "The Shift" (Low Surplus), they cannot organize a coalition to change the global rules. The fight is stuck at the *table level*. If they hit High Surplus, the fight moves to the *room level*.

  ---

  ## 4. The Debrief (0:55 – 1:20)

  Do not lecture. Sit in the circle. Use the tokens and crumpled papers as props.

  **Step 1: Phenomenology (5 mins)**
  *   "In Phase 1, when you chose the rules, how did it feel to have an idea rejected?" (Answer: It was political, a vote).
  *   "In Phase 2, when I took your paper away, how did it feel?" (Answer: It felt inevitable, like a law of nature).
  *   "When the token count dropped and you were forced into 'The Shift' (seats), how did your arguments change?" (Answer: We stopped trying to negotiate complex deals. We shouted slogans or gave up).

  **Step 2: The Mechanism (10 mins)**
  *   "Did anyone in Phase 2 *want* to write an Edict that said 'Work Harder for Less'? No? Then why did those ideas survive?"
  *   "Did anyone *want* to be stuck in their seats unable to talk to Table 3? No? Then why were you stuck there?"
  *   Guide them to see: **The ideas weren't selected by a person, but by the payoff structure.**

  **Step 3: Naming the Theory (5 mins)**
  *   Now you supply the vocabulary.
  *   **Base:** The token production rules and scarcity levels.
  *   **Superstructure:** The Edicts and the mode of debate (Forum vs. Shift).
  *   **Determination in the Last Instance:** The Base didn't tell you *what* to write, but it determined *which writings survived* and *where you were allowed to stand while writing them*.
  *   **Functionalism:** The system selects for ideas that reproduce the system, regardless of the author's intent.

  **Step 4: The Circularity Critique (5 mins)**
  *   Address the elephant in the room (see "The Trap" below).
  *   Ask: "Did I rig this?" (Yes).
  *   Ask: "Does rigging the game invalidate the point?"
  *   **Your Closing Line:** *"Marx isn't saying economics is the only thing that matters. He's saying that when resources are scarce, ideas that ignore economics get starved out. I rigged the game to isolate that pressure. In history, the pressure is less visible, but the starvation is real."*

  ---

  ## 5. Troubleshooting & The Trap

  **Where it predictably breaks:**
  1.  **The Rebellion:** In Phase 2, students may refuse to play ("This is stupid").
      *   *Fix:* Lean into it. "That is a valid ideological response. But it costs you tokens. If you don't stack tokens, your table goes bankrupt." Let them feel the material cost of rebellion.
  2.  **The Crash:** They spend all tokens on Edicts in Round 3 and everyone goes bankrupt.
      *   *Fix:* Have a "Bailout" stash. If >2 tables crash, inject 10 tokens into the room. Say: *"The system corrected to prevent total collapse."* This reinforces the functionalist point (the system preserves itself).
  3.  **The Arena Glitch:** They ignore the "Shift" rule and talk anyway.
      *   *Fix:* Stop production. "The Environment is paused. You are communicating without the material base to support it. Resume Mode: Shift or no tokens."

  **The Circularity Critique (Honesty Check):**
  You are worried a student will say: *"The ideas that served the material side survived because YOU designed the game that way. You assumed the conclusion."*

  **They are right.** You did assume the conclusion. Here is how you handle it:

  1.  **Admit it immediately.** "Yes. I built the selection mechanism. This is a model, not a simulation of reality."
  2.  **Defend the utility.** "The point of a model is to isolate a variable. In the real world, the 'selection pressure' is messy. It's mixed with culture, luck, and violence. I stripped those away so you could feel the *economic pressure* in isolation."
  3.  **The Theoretical Pivot.** "Marx's critics say he reduces everything to economics. This game shows why that critique exists. But Marx's defenders say he's not saying ideas *can't* exist, only that they can't *sustain* themselves if they contradict the material flow. Did anyone write a poem in Phase 2? No, because poems don't generate tokens. Did that mean poems are impossible? No. It meant they were unsustainable *in this specific material context*."
  4.  **The "Arena" Defense.** "The strongest part of this isn't that I chose the winners. It's that the *token count chose the room*. I didn't tell you to sit down. The scarcity told you to sit down. That is the 'Determination in the Last Instance.' The economy sets the stage, even if you write the script."

  ---

  ## 6. Instructor Cheat Sheet (Payoffs)

  *   **Base Production:** 5 tokens/table/round.
  *   **Labor Bonus:** +1 token/person (requires physical stacking).
  *   **Edict Cost:** 3 tokens (one-time).
  *   **Edict Maintenance:** 1 token/round (optional, adds pressure).
  *   **Surplus Threshold:** 60 tokens (Room Total).
      *   **>60:** **Forum Mode.** (Stand, shout, move).
      *   **<60:** **Shift Mode.** (Sit, whisper, written notes only).
  *   **Investment Edict:** Cost 10 tokens. Effect: Base Production becomes 8 tokens. (Introduce this verbally in Round 4 if they haven't discovered savings).

  **Key Moments to Watch:**
  *   **Round 2:** Someone will propose "Sharing." It will work because surplus is high.
  *   **Round 3:** Surplus drops. "Sharing" Edicts become hard to enforce because communication is restricted (Shift Mode).
  *   **Round 4:** "Sharing" Edicts die. "Efficiency" Edicts survive.
  *   **Round 5:** Someone realizes they need to hoard to buy the "Investment." Social trust collapses.

  **If they ask "What about Art/Love/Religion?":**
  *   "In this game, those are Edicts that cost tokens but don't produce them. In Phase 1 (High Surplus), you could afford them. In Phase 2 (Low Surplus), I burned them. That is the Marxist claim: not that art doesn't exist, but that its *institutional survival* depends on the surplus."

  **Final Prep:**
  *   Arrive early. Tape the floor.
  *   Count the beans/tokens.
  *   Print a copy of the rules for yourself.
  *   **Do not explain the theory before the game.** Let the confusion be the data.
