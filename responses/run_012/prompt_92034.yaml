  2.  **Deconstruct the Theoretical Problem:**

      *   *Vulgar Marxism:* Base $\rightarrow$ Superstructure (Direct causation, intentional).
      *   *Structuralist/Functional Marxism:* Base selects Superstructure (Evolutionary/Functional).
