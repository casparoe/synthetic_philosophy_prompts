answer: |-
  Here is the session plan. It is designed to keep the "it's all relative" crowd from winning in the first 20 minutes, give the Econ guy a lane that doesn't consume the room, and inoculate you against the Sam Harris inevitable.

  ### 1. The Carrier Example: Ditch Müller-Lyer, Use Medical Diagnosis
  **Verdict:** The Müller-Lyer illusion is a risky carrier for *this* specific crowd. You are correct that the cross-cultural data (Segall et al., 1966) has been heavily contested and nuanced (the "carpentered world" hypothesis is not a slam dunk). With Bio grad students in the room, you do not want to hang your philosophical argument on contested anthropological psychophysics. They will derail the session to debate the *science* of the illusion rather than the *philosophy* of the analogy.

  **The Better Carrier:** **Medical Diagnosis.**
  *   **Why:** You have a retired nurse and bio students. They know that two doctors can look at the same set of symptoms and disagree on the diagnosis (e.g., is this lump benign or malignant? Is this behavior a symptom of schizophrenia or spiritual possession?).
  *   **The Logic:** Variation in judgment + Variation in training/culture $\neq$ No objective fact about the patient's health.
  *   **Why it works here:** It separates *epistemic access* (how we know) from *ontological status* (what is true). It allows you to say: "The fact that cultures 'diagnose' accidental harm differently doesn't prove there is no fact of the matter about blame, just as doctors disagreeing doesn't prove there is no fact of the matter about the disease."
  *   **Crucial Caveat:** You must acknowledge that "health" is easier to objectify than "blame." Use the analogy to show that *disagreement alone* is insufficient to prove relativism, not to prove that morality *is* exactly like medicine.

  ### 2. The Session Flow (75 Minutes)

  **0:00 – 0:10: The Setup (Definitions & Stakes)**
  *   **Do not start with the moral data.** Start with the *question*.
  *   Write on the whiteboard: **Does Disagreement Imply No Truth?**
  *   Define terms quickly:
      *   *Objectivity:* Moral claims can be true/false independent of what we think.
      *   *Relativism:* Moral claims are true/false only relative to a culture/individual.
  *   **Head off Misconception #1:** "If morality were objective, everyone would agree."
      *   *Say this explicitly:* "We are testing whether disagreement *disproves* objectivity. We are not assuming objectivity requires consensus."

  **0:10 – 0:25: The Moral Data (The Intent/Outcome Gap)**
  *   Present the findings: WEIRD societies weigh *intent* heavily; small-scale/traditional societies weigh *outcome* heavily (e.g., accidental killing is treated nearly as harshly as murder).
  *   **Head off Misconception #2:** "Come on, everybody everywhere agrees murder is wrong."
      *   *Intervention:* "The data isn't about deliberate murder. It's about *accidents*. In some societies, if you accidentally kill a man while hunting, you owe a blood debt. In ours, you owe nothing. Both call it 'wrong' to kill, but they disagree on the *conditions* of blame."
  *   **Head off Misconception #3:** "The variation just shows we need bigger samples / better methods."
      *   *Intervention:* "Even if the data is perfect, does variation *logically* force us to relativism? That's the philosophical jump we are testing."

  **0:25 – 0:40: The Inference Trap (The Carrier)**
  *   **Deploy the Medical Diagnosis analogy.**
  *   Draw two columns on the whiteboard: **Medicine** | **Morality**.
  *   Ask: "If doctors in 1800 blamed spirits for illness, and doctors in 2024 blame viruses, is disease subjective?" (No).
  *   Ask: "If a US doctor says 'surgery' and a rural practitioner says 'herbs,' is health subjective?" (No).
  *   **The Point:** Variation in *judgment* can exist alongside an objective *target*. The variation might be due to different information, different priorities, or different ecological pressures.
  *   **This is where you stop the slide to "It's all just culture."** You have established that culture explains the *belief*, but not necessarily the *truth*.

  **0:40 – 0:55: The Functionalist Pivot (The Econ Guy's Lane)**
  *   This is where you let the Econ guy talk without letting him reduce morality to economics.
  *   **Prompt:** "Why would these norms differ?"
  *   Let him explain **Cooperation and Reciprocity**. (e.g., In small-scale societies, accidents are costly and insurance is non-existent, so strict liability enforces caution. In large societies, strict liability stifles innovation/risk).
  *   **The Trap to Avoid:** Do not let him conclude "Therefore morality is just efficient cooperation."
  *   **Your Counter:** "Efficiency explains why we *have* the norm. It does not explain whether the norm is *right*. Slavery was 'efficient' for some economies. Does efficiency equal objectivity?"
  *   **Why this works:** It uses his framework to explain the *variation* (supporting the Medical Analogy: different environments require different diagnoses) without conceding that morality is *only* economics.

  **0:55 – 1:05: The Harris Check (Science & Well-Being)**
  *   The Sam Harris guy will try to jump in here to say "Morality is about well-being, science can measure that."
  *   **Your Move:** Use the Nurse/Bio folks.
  *   "If morality is like health (objective), we need a definition of 'health.' Harris says 'well-being.' But cultures disagree on what constitutes well-being (individual autonomy vs. group cohesion)."
  *   "Does science tell us which *version* of well-being to pick?"
  *   **Goal:** Show that even if moral facts exist (like health facts), we still need a prior normative commitment to which 'health' we are optimizing. This keeps Harris from closing the book too early.

  **1:05 – 1:15: Wrap & Diagnostic**
  *   Summarize: Variation exists. It can be explained functionally. But explanation $\neq$ justification.
  *   **The Diagnostic Question (see below).**

  ### 3. What to Explicitly Exclude
  Write this on the board at the start so you can point to it when people drift:
  1.  **Normative Ethics:** We are not deciding if Utilitarianism or Deontology is correct.
  2.  **Neuroscience:** We are not discussing *how* the brain processes intent (fMRI studies).
  3.  **Political Policy:** We are not deciding how to run a legal system based on this.

  ### 4. Expected Misconceptions & Interventions

  | Misconception | When it arises | Your Intervention |
  | :--- | :--- | :--- |
  | **"If morality were objective, everyone would agree."** | **0:10 (Setup)** | Pre-empt this. "Physics is objective, but people disagreed about gravity for centuries. Consensus is not the test." |
  | **"Everybody agrees murder is wrong."** | **0:15 (Data)** | Clarify the *accidental* harm distinction. "We are talking about the *negligence* threshold, not intentional slaughter." |
  | **"The variation just means the samples are bad."** | **0:20 (Data)** | "Grant the data is perfect for the sake of argument. Does the *logic* hold? If everyone disagreed, could truth still exist?" |
  | **"Morality is just cooperation strategies."** | **0:45 (Econ)** | "That explains the *origin* of the belief (genealogy), not the *validity* of the belief (justification)." |
  | **"Science can solve this like it solved disease."** | **0:55 (Harris)** | "Science tells us how to get to X. It doesn't tell us why we should want X. Who picks X?" |

  ### 5. The Final Diagnostic Question
  Do not ask "Is morality objective?" They will just vote yes/no based on their prior beliefs. Ask a question that forces them to distinguish the *empirical* claim from the *metaethical* claim.

  **Put this on the board for the last 5 minutes:**

  > "If we discover the exact evolutionary and ecological *cause* for why Group A blames accidents and Group B ignores them... **have we answered whether Group A is *right*?**"

  *   **If they say Yes:** They have committed the Genetic Fallacy (confusing the origin of a belief with its truth).
  *   **If they say No:** They have successfully grasped that empirical psychology cannot, on its own, settle metaethical objectivity.
  *   **Follow-up:** "Then what *would* answer that question?" (This reveals if they are moral realists, error theorists, or cognitivists without using those jargon terms).

  ### Summary of Tactics
  *   **Don't start with the moral data.** Start with the logic of disagreement.
  *   **Use Medical Diagnosis, not Müller-Lyer.** It fits the crowd and avoids anthropological debate.
  *   **Give the Econ guy the "Why" (Function), keep the "Right" (Normativity) for the group.**
  *   **End on the Genetic Fallacy.** Ensure they see that explaining *why* we believe something is different than proving *that* it's true.
