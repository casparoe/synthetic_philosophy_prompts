prompt: |-
  Ok so I need help planning something. I'm in this interdisiplinary reading group — bio and econ grad students, a retired nurse, a guy who teaches intro ethics at the community college, we meet in the back room of a bar — and next month's session landed on me. The topic I got handed is the cross-cultural stuff in moral psychology: apparently in some small-scale societies people judge accidental harms much more harshly than we do, and in some places an accidental killing gets blamed about as much as a deliberate one, with intent barely moving the needle, whereas for us intent is basically everything. Throw in the general WEIRD-samples complaint about psych being run entirely on undergrads. The question on the table is what any of that is supposed to mean for whether morality is objective. I've got about seventy-five minutes, a whiteboard, and one guy who brings up Sam Harris every single time.

  Don't explain the material to me — plan the session. I need the order the pieces have to go in. My instinct is that if I open with the cool cross-cultural findings, everyone will immediately jump to "so it's all just culture" and we'll never climb back out, but I don't actually know what has to be in place *first* for those findings to bear on the objectivity question instead of sliding past it. What's the one example or case that should carry the whole thing? I was going to lean on the Müller-Lyer illusion — people in different places supposedly get fooled by it to different degrees, and nobody thinks that shows there's no fact about which line is longer — but I half remember hearing that the cross-cultural version of that has been walked back (something about blind people being fooled by it too?), so tell me whether it's a bad carrier, what the carrier has to have and can't have, or give me a better one. Also the misconceptions you'd expect this exact crowd to walk in with and to form around the halfway mark, and where in the sequence I should head each off — I'm already betting on "the variation just shows we need bigger samples," "if morality were objective everyone would agree," and "come on, everybody everywhere agrees murder is wrong." What should I openly tell them I'm not going to get into at this level? And one question I can put to the room at the end that would actually show me whether they've got the difference between the empirical claim and the metaethical one, rather than just having nodded along. Oh — the econ guy will want to turn the whole thing into cooperation and reciprocity, so if there's a spot to use that instead of fighting it, tell me where.
