answer: |-
  ### 1. Does an established name exist?

  **No.** There is no single, canonical term in decision theory, behavioral economics, or psychology that captures this specific mechanism.

  The phenomenon you describe sits at the intersection of three established concepts, but it violates the core assumptions of each in a way that leaves it unnamed:

  *   **Adaptive Aspiration Levels (Simon; Cyert & March):** In standard behavioral theory, aspiration levels adjust based on success or failure. However, the standard model posits that *failure* to find a match leads to a *lowering* of aspirations (to ensure a solution is eventually found). Your phenomenon describes the inverse: failure to find a match leads to a *tightening* or *specification* of aspirations, which increases the likelihood of continued failure.
  *   **Preference Construction (Slovic; Payne & Bettman):** This literature acknowledges that preferences are often created during the choice process rather than retrieved from memory. However, most models focus on how trade-offs are negotiated or how framing alters value. They do not typically model the *sequential accumulation of veto criteria* derived specifically from the defects of rejected alternatives.
  *   **Elimination by Aspects (Tversky):** This model describes choosing by selecting an attribute and eliminating all options that lack it. However, in Tversky's model, the aspects are usually selected based on salience or probability of success, not *endogenously generated* by the specific flaws of the previously rejected option.

  There is a close cousin in the concept of **"Preference Drift"** or **"Adaptive Preferences"** (Elster), but those terms usually refer to long-term changes in values to align with available options (e.g., "sour grapes"), whereas your phenomenon is a short-term search dynamic where the options are rejected *because* they trigger new values.

  ### 2. Proposed Term and Definition

  Since no established term fits, I propose the term:

  **Endogenous Constraint Accumulation (ECA)**

  **Definition:**
  Endogenous Constraint Accumulation is a decision-making heuristic in which a search process is governed by a threshold of adequacy that is dynamically modified by the specific attributes of rejected alternatives. Unlike standard satisficing, where the aspiration level is exogenous or adjusts only to facilitate a choice, ECA involves the conversion of latent or previously ignored attributes into mandatory constraints following their identification as defects in a candidate.

  **Formal Characteristics:**
  1.  **Initial State:** The agent begins with a sparse set of constraints ($C_0$) and a goal of finding any option $x$ such that $x$ satisfies $C_0$.
  2.  **Trigger:** The agent encounters an option $x_i$ that satisfies $C_{current}$ but possesses a negative attribute $a$ not currently in $C_{current}$.
  3.  **Update:** The agent rejects $x_i$ and updates the constraint set such that $C_{new} = C_{current} \cup \{ \text{not-}a \}$.
  4.  **Termination:** The search continues until an option satisfies $C_{final}$ or the option set is exhausted.
  5.  **Subjective Experience:** The agent perceives the goal as constant ("find something adequate") rather than evolving ("find the best"), despite the objective tightening of $C$.

  ### 3. Boundary Cases and Edges

  To ensure this definition is robust, we must distinguish ECA from phenomena that look similar on the surface.

  **A. The Edge Where ECA Stops Applying (Ordinary Learning)**
  *   *Scenario:* A person searches for an apartment. They reject the second one because of thin walls. They add "quiet" to their list. However, if asked *before* the search began, "Would you prefer a quiet apartment to a noisy one?", they would have immediately said "Quiet."
  *   *Verdict:* This is **Preference Discovery**, not ECA.
  *   *Reasoning:* In ECA, the constraint is *latent* and arguably non-existent until triggered. If the preference was stable and pre-existing but merely unarticulated, the order of viewing should not matter. In true ECA, the order matters: if the "thin walls" apartment had been viewed *last*, the "quiet" constraint might never have formed, and a different apartment would have been chosen. **Path dependence** is the litmus test. If the final constraint set is invariant to the order of presentation, it is learning, not accumulation.

  **B. The Edge Where Behavior is Identical but Classification Differs (Rational Maximizing)**
  *   *Scenario:* A person rejects apartments, adding criteria each time (quiet, landlord, layout). However, they are explicitly comparing each new option against the *best* features of all previous options, aiming to find a unit that combines the best of all of them.
  *   *Verdict:* This is **Maximizing**.
  *   *Reasoning:* The subjective experience you described ("still hoping to find the one that is simply good enough") is crucial. If the agent is mentally constructing a "composite ideal" apartment and rejecting real options because they fail to match the composite, they are maximizing. ECA requires the agent to believe each new constraint is a *minimum requirement for adequacy*, not a feature that would make the option *better*.

  **C. The Edge of Rationality (Genuine Value Discovery vs. Rationalization)**
  *   *Scenario:* The agent adds a constraint about "landlord evasiveness."
  *   *Verdict:* ECA applies to *both* genuine discovery and rationalization.
  *   *Reasoning:* This is a feature, not a bug, of the definition. From the perspective of decision architecture, the mechanism is identical: a negative exemplar generates a new veto. Whether the value was "truly" there waiting to be found or is a post-hoc rationalization of commitment anxiety is psychologically ambiguous. ECA describes the *process*, not the ontological status of the preference.

  ### 4. What Would Change My Verdict?

  There are two considerations that would lead me to conclude this is not a distinct phenomenon but merely a variant of existing theories.

  **A. If Constraints are Utility-Equivalent (The Satisficing Defense)**
  If it can be demonstrated that the "accumulating constraints" are merely a computationally efficient way of approximating a fixed, high-dimensional utility function, then ECA is just **Satisficing with High Search Costs**.
  *   *Where my reasoning would fail:* If the agent's final "list of requirements" always converges to the same set of dealbreakers regardless of which apartments they see first (order invariance), then the constraints were not endogenous; they were simply being revealed sequentially. In that case, the phenomenon is just **Sequential Preference Articulation**, which is well-covered by Preference Construction theory.
  *   *Falsification Condition:* If you run an experiment where Group A sees Apartment 1 (noisy) then Apartment 2 (bad layout), and Group B sees Apartment 2 then Apartment 1, and both groups end up with the *same* final requirements list, ECA does not exist. It is only ECA if Group A requires "quiet + layout" and Group B requires "layout + quiet" but potentially drops "quiet" if a quiet apartment never appeared to trigger the constraint.

  **B. If the Goal is Actually "Best" (The Maximizing Defense)**
  If the subjective report of "looking for good enough" is shown to be a confabulation, and the physiological or behavioral markers indicate the agent is tracking a rising standard of excellence rather than a floor of adequacy, then this is **Maximizing disguised as Satisficing**.
  *   *Where my reasoning would fail:* If the accumulation of constraints stops *only* when the agent finds an option that is objectively superior to all others seen (rather than one that meets the current constraints), the mechanism is comparison-based, not threshold-based.
  *   *Falsification Condition:* If the agent accepts an option that meets the *initial* rough criteria but is told "this is the best one you will see," and they *still* reject it to keep searching, they are maximizing. If they accept it, but reject future options that violate the *newly discovered* constraints, ECA holds.

  ### Summary
  The phenomenon is **Endogenous Constraint Accumulation**. It is distinct because it inverts the standard adaptive aspiration model (failure tightens rather than loosens constraints) and relies on path dependence (the history of rewrites the rules). It occupies the ambiguous space between learning what you want and inventing reasons to avoid choosing, which is precisely why it resists standard classification.
