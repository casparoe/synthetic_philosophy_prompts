      **THE INDIA BILL AND THE DUTY OF TUTELAGE**

      It is a fashionable sentiment in Westminster that liberty is a birthright, to be bestowed upon all men regardless of their station or capacity. This proposed Bill, transferring the governance of India from the Company to the Crown, proceeds upon precisely this erroneous assumption. It confuses the ultimate end of political society with the immediate instrument of its administration. We, who have spent thirty years within the walls of Leadenhall Street drafting despatches for men we shall never meet, understand that liberty is not a seed to be scattered on fallow ground, but a harvest to be reaped only after long cultivation. To grant the power of self-government to a people not yet fitted to exercise it is not kindness; it is a dereliction of duty.

      There exists a legitimate despotism, provided its object be the improvement of the governed. This is not the tyranny of the master over the slave, but the guardianship of the tutor over the child. The question is not whether the Indian subject desires freedom—for desire is often born of ignorance—but whether he possesses the rational faculty to sustain it. Until such time as the native population demonstrates the capacity to weigh conflicting interests and comprehend the general utility, they remain wards of the Empire. To withdraw the hand of guidance now, merely to satisfy a parliamentary whim for constitutional symmetry, is to abandon them to anarchy or religious factionism.

      The advocates of this Bill argue that Crown government ensures accountability. We contend it ensures only ignorance. A Secretary of State changes with the ministry; he is a politician who has never read a revenue settlement, who knows nothing of the zemindar's burden, and whose horizon extends no further than the next division lobby. The Company's servants, by contrast, are selected by merit and trained in the specific science of Indian administration. We govern by knowledge, not by popularity. Our authority rests upon the accuracy of our despatches and the stability of our regulations. To substitute the erratic will of Parliament for the accumulated expertise of the Examiners is to trade the surgeon's scalpel for the butcher's cleaver.

      Furthermore, let us consider the condition under which this tutelage might cease. It is proposed that we set a date for eventual self-rule. This is morally indefensible. One cannot schedule enlightenment by the almanac. The terminus of our authority must depend upon a test of capacity, rigorously applied. Yet, who shall administer this test? It must be those who have designed the curriculum. If we declare the pupil ready before he is so, we betray him; if we delay unnecessarily, we stagnate. Therefore, the judgment must remain with the administrator on the spot, guided by the principle of improvement.

      This creates a schedule of tutelage with no fixed terminus, it is true. But is it not better to rule indefinitely for a man's good than to free him prematurely for his ruin? We calculate the happiness of the millions under our care in a grand ledger of utility. In this accounting, their immediate preferences are not line items; they are variables in a sum we must solve for them. They are the beneficiaries of the calculation, not the calculators. To allow them to vote on their own readiness would be to ask the child to judge the necessity of the medicine. We bear the burden of this despotism so that they may one day bear the burden of liberty. Until the ledger balances—not with their consent, but with their improved condition—we must hold the pen. To do otherwise would be to sacrifice the substance of happiness for the shadow of freedom.

