answer: |-
  The Enantiomer Earth thought experiment demonstrates that semantic externalism fails to specify the granularity of "underlying nature" required to fix reference, thereby proving that Earthian and Twin Earthian terms for chiral substances do not co-refer despite identical atomic connectivity, and that this referential divergence is determined by configurational facts inaccessible to the speaker.

  Consider the chemistry precisely. On Earth, the substance ostended by the term "mint" is primarily L-carvone, a terpene ketone with the formula $C_{10}H_{14}O$. On Twin Earth, the substance ostended by their phonetic equivalent is D-carvone. These molecules are enantiomers: they possess identical atomic composition, identical bond connectivity, identical bond lengths and angles, and identical scalar physical properties such as boiling point, density, and mass spectra. In an achiral environment, they are physically indistinguishable. However, they differ in stereochemical configuration; they are non-superimposable mirror images. This configurational difference is invisible to standard spectroscopic probes available to the layperson or even the chemist without chiral columns or polarimetry, yet it dictates divergent biological effects because biological receptors are themselves chiral. L-carvone activates olfactory receptors associated with mint; D-carvone activates those associated with caraway.

  According to the causal theory of reference, the extension of a natural-kind term is fixed by the underlying nature of the sample ostended at the baptism, deferred to expert identification of "same kind." In the original Twin Earth case, the underlying nature is construed as atomic composition (H2O vs. XYZ). Here, however, the "underlying nature" is ambiguous. If reference is fixed solely by constitutional connectivity, the terms co-refer, as both are carvone. If reference is fixed by stereochemical configuration, they do not. Since the biological effects—the causal powers that make the substance relevant to the speakers as "mint"—diverge, the functional kind diverges. The speakers on both sides associate the same concept (sweet, minty smell) with the term, yet the reference splits. This split is determined by a fact (chirality) entirely beyond their epistemic reach, satisfying the externalist condition that meaning ain't in the head. However, it exposes a critical incompleteness in the externalist formula: physics provides the structure, but semantics must select which structural features constitute the "essence." Nothing in the physical description of the molecule dictates whether connectivity or configuration is the reference-fixing property; that selection depends on which features causally interact with the users' biology. Thus, externalism cannot rely on "underlying nature" as a monolithic given; it requires a prior pragmatic determination of the relevant level of structural description.

  The strongest objection to this position is that it dissolves into the original Twin Earth argument upon closer inspection. The objector argues that H2O and XYZ differ in microstructure, just as L-carvone and D-carvone differ in microstructure; the only difference is the fineness of the grain required to detect the variance. On this view, externalism does not need to specify a level of description because "same underlying nature" simply means "identity of all physically relevant microstructural properties." If chirality affects causal powers, it is part of the microstructure; if not, it is not. The objection claims my variant adds no new philosophical trouble but merely illustrates that microstructure includes stereochemistry, not just connectivity.

  Candidly, the position survives this objection, but only by forcing a concession that weakens the pure externalist stance. The objection assumes that "physically relevant" is a property determined solely by the object. Yet, enantiomers are physically identical in symmetric fields; they become distinct only in relation to other chiral entities, such as biological organisms. Therefore, the "microstructure" that fixes reference is not an intrinsic property of the substance alone but a relational property between the substance and the observer's biological constitution. If externalism absorbs this, it must admit that reference fixing is not determined by the world alone, but by the world coupled with the specific sensory and metabolic apparatus of the linguistic community. This concedes that the "level of description" is not dictated by nature itself, but by the interface between nature and the user. Consequently, the incompleteness charge stands: externalism cannot explain reference fixation by pointing to "the underlying nature" without silently invoking the interests and biological constraints of the speakers, thereby undermining the claim that reference is fixed purely by external facts independent of human conceptual schemes. The Enantiomer Earth case thus survives as a demonstration that microstructural essentialism is underdetermined without a theory of relevant causal interaction.
