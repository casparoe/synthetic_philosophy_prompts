answer: |-
  **Total Mark: 18/20**

  **Part (a): 8/8 (Full Marks)**
  **Feedback:** This is an excellent reconstruction of the triviality argument. You correctly apply the Law of Total Probability to partition $P(A \to B)$ by $B$ and $\neg B$. You accurately substitute the conditional probabilities using the Equation (e.g., $P(A \to B | B) = P(B | A \land B) = 1$). The derivation of $P(A \to B) = P(B)$ and the subsequent contradiction ($P(B|A) = P(B)$) are logically sound. Your numerical illustration is also calculated correctly ($P(B)=0.4$ vs $P(B|A)=1/3$), effectively demonstrating the contradiction in the specific case provided. No deductions.

  **Part (b): 6/6 (Full Marks)**
  **Feedback:** Although you integrated this into the flow of part (a), you stated the triviality precisely where you wrote: "the only credence functions that satisfy the equation at all are the degenerate ones that assign every sentence 0 or 1." This accurately captures the result that the Equation forces probabilistic independence between all sentences, ruling out any non-trivial credence functions. As the definition is exact and clearly identified, this part deserves full marks.

  **Part (c): 4/6**
  **Feedback:** You provide a clear explanation of the Expressivist/Adams upshot (conditionals as expressions of conditional credence rather than truth-apt sentences). However, 2 marks are deducted for the following reasons:
  1.  **Logical Force (1 mark deducted):** You answer "Yes" to the question "Does the argument show that indicative conditionals have no truth conditions?" This is logically too strong. The argument establishes an inconsistent triad: (1) Truth Conditions, (2) The Equation, and (3) Standard Probability Theory. The argument does not prove that (1) is false; it proves that (1) and (2) cannot both be true. You claim the truth-conditional assumption "is what has to go," but this is a philosophical choice, not a logical necessity of the proof.
  2.  **Alternatives (1 mark deducted):** You mention the alternative of keeping truth conditions and denying the Equation but dismiss it with the claim that "if you drop it there's nothing left for the truth conditions to do." This is a contentious philosophical claim (contradicted by Stalnaker/Lewis semantics, which use truth conditions to handle embedding and logic even if the Equation fails) rather than a neutral description of the alternative. You were asked to mention the main alternatives; the Stalnaker/Lewis approach is a live option that should be presented as such, not dismissed as untenable based on the argument alone.

  **Overall Comment:** This is a very strong script demonstrating a robust grasp of the formal proof and the Expressivist response. To reach full marks, ensure you distinguish between what the argument *logically proves* (inconsistency) versus what philosophical conclusion one might *draw* from it (rejecting truth conditions), and present the competing truth-conditional semantics as a viable alternative rather than ruling them out prematurely.
