answer: |-
  ### Think Out Loud: The Friction Points

  You are asking for a methodology to validate a cognitive shortcut. That is the first tension. Analogy is heuristic; rigor is systematic. They pull in opposite directions.

  The core philosophical problem here is the **Reference Class Problem**. Any event belongs to infinite classes. Is 2008 a "financial crisis" (like 1929) or a "stagflation risk" (like 1970s)? Both are true. The theory doesn't select the class; the *goal* of the analyst selects the class. If the goal is political mobilization, "Munich" wins. If the goal is caution, "Vietnam" wins. A theory of analogy cannot fix the goal, so it cannot fully fix the analogy.

  Then there is the **Reflexivity Problem**. In physics, observing a particle doesn't change its mass. In history, publishing "This is a Thucydides Trap" changes the behavior of Athens and Sparta. If the analogy succeeds (people believe it), it may alter the outcome, rendering the prediction self-defeating or self-fulfilling. This makes "accuracy" impossible to measure cleanly.

  Finally, the **Hospital Case** reveals a category error. Most people conflate *diagnostic analogy* (this virus acts like SARS) with *prescriptive analogy* (therefore we do what we did for SARS). You can be right about the disease and wrong about the cure. A theory must separate the map from the terrain, and the terrain from the vehicle you drive on it.

  Here is the spec.

  ***

  ### The Spec: Requirements for a Theory of Historical Analogy

  **1. Causal Isomorphism Requirement**
  *   **Motivation:** Surface similarities (e.g., "both leaders have mustaches") are noise; only shared causal mechanisms (e.g., "security dilemmas escalate due to lack of communication channels") count.
  *   **Status:** **Non-Negotiable** (Both camps must agree that *something* must be similar, even if they disagree on what).

  **2. Ex-Ante Falsifiability Clause**
  *   **Motivation:** An analogy that can explain any outcome (e.g., "appeasement leads to war" vs. "appeasement buys time") after the fact is a rhetoric device, not a reasoning tool.
  *   **Status:** **Non-Negotiable** (Without this, you cannot distinguish science from storytelling).

  **3. The Intervention Decoupling Rule**
  *   **Motivation:** Must distinguish between "Situation A is like Situation B" (diagnosis) and "Policy X worked in B, so do X in A" (prescription), as the hospital case proves these can diverge.
  *   **Status:** **Non-Negotiable** (Required to handle the Munich/Vietnam/Iraq loop where the diagnosis holds but the lesson flips).

  **4. Source Integrity Constraint**
  *   **Motivation:** You cannot analogize from a historical record that is itself a polemic (e.g., Thucydides writing to justify Athenian failure) without adjusting for the bias of the source data.
  *   **Status:** **"History Repeats" Camp Preference** (Cyclical theorists assume stable data; Contingency theorists assume all data is corrupted by context).

  **5. The Reflexivity Adjustment**
  *   **Motivation:** The theory must account for the fact that invoking the analogy changes the actors' behavior, potentially invalidating the prediction (e.g., avoiding war *because* of the Thucydides warning).
  *   **Status:** **"One Damn Thing" Camp Preference** (Contingency theorists insist human agency breaks patterns; Cyclical theorists assume structural forces override agency).

  **6. Negative Case Audit**
  *   **Motivation:** Must account for the "silent failures"—the times the analogy *didn't* hold but were forgotten because they weren't memorable (selection bias).
  *   **Status:** **Non-Negotiable** (Statistical necessity; ignoring base rates makes any analogy coincidental).

  **7. Temporal Horizon Specification**
  *   **Motivation:** Must define the timeframe in which the analogy is expected to hold, otherwise a "failed" prediction can always be rescued by saying "wait longer."
  *   **Status:** **Non-Negotiable** (Prevents moving the goalposts on when the "lesson" manifests).

  **8. Structural vs. Agentive Weighting**
  *   **Motivation:** Must explicitly state whether the outcome is driven by systemic constraints (geography, nukes) or individual choices (leadership, ideology), as this determines transferability.
  *   **Status:** **"History Repeats" vs. "One Damn Thing" Battleground** (The former weights structure; the latter weights agency).

  ***

  ### The Knockout & The Verdict

  **Which requirement knocks out the most candidates?**
  **Ex-Ante Falsifiability Clause.**
  Almost all public historical analogies are formulated vaguely enough to be unfalsifiable until after the event. "This is Munich" usually implies "aggression will follow," but if aggression doesn't follow, the proponent says "we appeased too late" or "we appeased just enough." By refusing to specify *what observable evidence would prove the analogy wrong* before the outcome is known, 90% of policy analogies are revealed as mere persuasion, not reasoning.

  **Is the "Lessons of History" frame a mistake?**
  **Yes.**
  The frame implies a normative prescription derived from a descriptive past, which is a category error. History does not deliver lessons; it delivers **constraints**.
  *   **Lessons** imply: "Because X happened then, we must do Y now." (This fails the Intervention Decoupling Rule).
  *   **Constraints** imply: "Because X happened then, we know that Z mechanism exists, so doing Y carries *this* specific risk."

  A theory of analogy should not tell you what to do. It should only tell you which causal mechanisms are likely active and which are likely dormant. If your theory claims to output a policy recommendation, it has smuggled in a value judgment under the guise of historical precedent. The right theory says: "There are no lessons, only variables you cannot ignore."
