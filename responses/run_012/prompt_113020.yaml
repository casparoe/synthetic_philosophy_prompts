      *   *Nuance:* The friend says the vote proves it was political. The user says the vote proves self-correction. Szasz would say "Medical questions shouldn't be voted on." That's the crux. If it's science, you don't vote; you discover. If you vote, it's politics. Szasz wins on the *method*, but loses on the *motivation* (it wasn't just raw power; it was data-informed).
