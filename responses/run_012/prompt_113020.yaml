      *   **Task 2:** Address the "harder question": What does this episode do to the theory? Reconstruct Szasz's criterion for "myth" vs. "real disease" (lesion? coercion?). Test it against this specific case (and general medicine).
      *   **Task 3:** Address the "looping effect" (Ian Hacking) comparison.
      *   **Task 4:** Reach a verdict (Vindicates? Refutes? Different question?).
      *   **Constraints:** Do not summarize framework/history excessively. Keep the mapping honest. Say where the framework is silent.

  2.  **Deconstruct Task 1: Mapping the Episode through Szasz's Framework:**
      *   *Who are the parties?* For Szasz, it's not "doctors vs. patients." It's the State/Psychiatry (agents of social control) vs. the Individual (subject of control). In this specific case: The APA Trustees/Membership (the legitimizing body) vs. Homosexuals (the labeled group) + Gay Activists (the political challengers).
      *   *What is a vote on a diagnosis?* To Szasz, a medical vote on behavior is inherently category mistake. Diseases are discovered (pathology), norms are negotiated (politics). A vote confirms the category is political, not biological.
      *   *Prediction on arising/sustaining/withdrawing:*
          *   *Arising:* Arises from social intolerance disguised as medical concern.
          *   *Sustaining:* Sustained by the utility of the label for social control (commitment, stigma, legal disadvantage).
          *   *Withdrawing:* Withdrawn when the social cost of maintaining the label exceeds the benefit, or when political pressure makes the label untenable. It is *not* withdrawn because a "cure" was found or a "lesion" disproven (since there was never a lesion to begin with).
      *   *Illumination:* It highlights the contingency of the boundary. It shows the moral work the diagnosis was doing (enforcing heteronormativity). It explains why the removal was a *vote* (political resolution) rather than a *discovery* (scientific resolution).
      *   *Misdescription/Blind spots:* Szasz's framework struggles to account for the *internal* scientific pressure (Hooker's data). He tends to flatten all psychiatric evidence into "rationalization." It also struggles with the *residual category* (Ego-dystonic homosexuality). If it was all just oppression, why keep a version of it? Szasz might say this proves the coercive intent remained, but it complicates the "clean abolition" narrative.
      *   *Silence:* Szasz is silent on *why* the profession would voluntarily relinquish power unless forced. He assumes psychiatry always seeks to expand control. A voluntary contraction needs explanation in his terms (e.g., fear of losing legitimacy).

  3.  **Deconstruct Task 2: The Harder Question (Testing the Theory):**
      *   *Reconstructing the Criterion:* What makes a mental illness a "myth" for Szasz?
          *   Option A: No bodily lesion. (Problem: Many general medical conditions in 1961 and now lacked clear lesions—migraine, hypertension, IBS. This makes "disease" too narrow).
          *   Option B: Coercion/Condemnation. (Problem: This is political, not ontological. It makes the theory a moral critique disguised as metaphysics).
          *   *Best Reconstruction:* It's about the *category error*. Physical disease = involuntary bodily dysfunction. Mental illness = voluntary (or quasi-voluntary) conduct judged against norms. The criterion is the *location* of the pathology (body vs. soul/conduct).
      *   *Testing against Homosexuality:*
          *   Does it fit "no lesion"? Yes.
          *   Does it fit "coercion"? Yes (legal/social penalties).
          *   *The Problem:* If the criterion is "no lesion," then Szasz condemns much of medicine. If the criterion is "coercion," then the removal of homosexuality *without* removing the coercive apparatus (involuntary commitment laws, etc.) suggests the *system* wasn't the problem, just the *target*.
          *   *The Revision:* The fact that the APA revised based on Hooker's data suggests empirical falsifiability, which Szasz denies is possible for "problems in living."
          *   *The Residual Category:* "Ego-dystonic homosexuality." Szasz would see this as the mask slipping—admitting the "illness" is the distress about the norm, not the orientation itself. This actually *supports* Szasz (it reveals the moral judgment).
      *   *Verdict on Theory:* The episode doesn't refute Szasz's ontological claim (that there was no lesion), but it refutes his sociological claim (that psychiatry *cannot* self-correct). It shows the "myth" can be debunked *within* the system, not just by abandoning the system.

  4.  **Deconstruct Task 3: Hacking vs. Szasz:**
      *   *Hacking (Looping Effects):* Classifications interact with people. People classified change their behavior in response to the classification, which changes the classification.
      *   *Comparison:* Szasz sees the classification as a *tool of oppression* imposed from above. Hacking sees it as a *dynamic interaction*.
      *   *Application:* Gay activists used the classification against itself. They changed how "homosexuals" behaved (pride, protest), which forced the classification to change.
