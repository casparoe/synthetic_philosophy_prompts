answer: |-
  This is an exceptionally sharp reading of the tension in Sidgwick's thought, and you are right to sense that the relationship between his psychical research and his ethics is not merely biographical trivia. However, your picture of the *structural* dependence between the two is slightly off. You have correctly identified the motive, but I suspect you have misidentified the logical order of operations in *The Methods of Ethics*.

  To put it bluntly: Psychical research is not the foundation on which the ethics rests; rather, the ethics creates a *problem* for which psychical research was the hoped-for solution. The authority of universal benevolence does not depend on the empirical result in the way you fear, but the *rational supremacy* of benevolence over egoism does.

  Here is a careful account of where your picture needs adjustment, based on Sidgwick's actual claims in the final chapters of *The Methods* and his correspondence.

  ### 1. The Independence of the Ethical Axioms
  Your worry is that Sidgwick's utilitarianism might be circular or hostage to evidence he couldn't produce. This would be true if the *validity* of the utilitarian principle depended on the existence of a moral governor. But for Sidgwick, it does not.

  Sidgwick arrives at the principle of Rational Benevolence (Utilitarianism) through intuitionist epistemology. He argues that certain axioms are self-evident to mature reason, much like mathematical axioms. The axiom of Benevolence ("the good of any one individual is of no more importance, from the point of view of the Universe, than the good of any other") is established in Book III of *The Methods* through philosophical analysis, not empirical investigation into the afterlife.

  Therefore, the *truth* of Utilitarianism is not contingent on psychical research. Sidgwick believes he has proven that Utilitarianism is a rational method. The problem is that he has also proven that Rational Egoism (Prudence) is a rational method.

  ### 2. The Dualism is a Failure of System, Not of Evidence
  You ask if the rational authority of universal benevolence depends on an empirical result. The answer is no. The rational authority of benevolence is self-evident. The *conflict* is what requires the empirical (or theological) resolution.

  Sidgwick's "Dualism of Practical Reason" is the admission that reason dictates two ultimate ends: one's own happiness and the universal happiness. In a world without a moral governor, these two ends can diverge. If being moral ruins my life, and death is the end, Reason cannot tell me why I should choose the moral act over the prudent one. Both are rational; they just point in different directions.

  This is where your picture requires nuance. Sidgwick does not use psychical research to *prove* Utilitarianism. He uses it (or hopes to use it) to prove that the universe is so constituted that the conflict between Egoism and Utilitarianism is only apparent, not real. He needs evidence of a "Moral Government of the Universe" to show that, in the long run (potentially post-mortem), duty and self-interest coincide.

  ### 3. Is the Argument Circular?
  You ask if the principle is recommended on the strength of a premise it was supposed to vindicate. This is a sophisticated worry, but it mislocates the circle.

  Sidgwick is not arguing: "Utilitarianism is true because there is an afterlife."
  He is arguing: "Utilitarianism is rationally binding (supreme) only if there is an afterlife."

  The circle you fear would exist if he derived the moral law from the evidence of survival. He does not do that. He derives the moral law from intuition. He then observes a contradiction in the full system of practical reason (the Dualism). He then posits that a theological assumption (supported hopefully by SPR) is required to remove the contradiction.

  So, the ethics is not circular. However, the *completeness* of the ethical system is indeed hostage to evidence he could not produce. Sidgwick admits this openly. In the final chapter of *The Methods*, he calls this Dualism a "fundamental contradiction" in our apparent intuitions of reason. He writes:

  > "I do not see how it can be proved that the distinction between any one individual and any other is not fundamentally real... I cannot therefore discover in Consciousness any clear and certain intuition that the happiness of one individual is not more important than that of another."

  ### 4. The "Honest Upshot"
  This brings us to your final question: *If the evidence never came, is the honest upshot of the dualism that a rational agent may simply take his own good as his end?*

  Here, your intuition is remarkably close to Sidgwick's own agonized conclusion. Sidgwick essentially admits that without the assumption of a moral government (which the SPR was meant to investigate), there is no rational proof that one *ought* to be moral when morality conflicts with self-interest.

  He does not say Egoism is *wrong*. He says that without theological sanctions, Reason is divided. In a famous letter to his former student Arthur Balfour (1887), Sidgwick wrote:

  > "I have been unable to construct on a purely empirical basis a satisfactory system of morality... I need the postulate of God to make the moral law rational."

  If the SPR failed to provide evidence for survival (and Sidgwick eventually became more skeptical, though never entirely dismissive), the upshot is not that Utilitarianism is false, but that it is not *uniquely* rational. A rational agent, in Sidgwick's strict sense, would be within their rights to prioritize their own good if the universe is not morally governed.

  This is the "failure" of *The Methods* that Sidgwick confessed to. He wanted ethics to be a science of rational conduct. If Reason gives two contradictory commands, the science is incomplete.

  ### 5. Correcting the Picture
  Your picture is not backwards, but it is slightly top-heavy.

  *   **Your View:** Psychical research is the foundation of the ethics.
  *   **Correction:** The intuitionist ethics is the foundation; psychical research was the attempted engineering repair for a structural crack (the Dualism) that appeared in the foundation.

  Sidgwick did not become a psychical researcher to find out *what* is right. He became a psychical researcher to find out if it is *rational* to do what is right when it hurts.

  Consequently, your seminar paper should avoid claiming that Sidgwick's utilitarianism *depends* on the SPR for its truth. Instead, argue that Sidgwick's **project of a fully rational system of ethics** depended on the SPR. Without the SPR (or theology), Sidgwick is left with a fragmented rationality where Morality and Prudence are two separate, often conflicting, rational domains.

  ### Summary for your Argument
  1.  **Validity vs. Supremacy:** Distinguish between the validity of the utilitarian principle (which stands on intuition) and its supremacy over egoism (which requires the coincidence of interests).
  2.  **The Role of SPR:** Frame the SPR not as the source of moral truth, but as the investigation into the "sanctions" of morality necessary to make moral sacrifice rational.
  3.  **The Concession:** Acknowledge that Sidgwick admits that without the "Moral Government of the Universe," the Dualism remains unresolved, and Egoism remains a rational option. This is not a flaw in your reading; it is the tragic conclusion of Sidgwick's own work.

  You have identified the central tension in Sidgwick's philosophy. The error is only in thinking this tension undermines the *truth* of his utilitarianism; for Sidgwick, it undermines the *rationality* of being a utilitarian in a godless universe. That is a subtle but crucial distinction.
