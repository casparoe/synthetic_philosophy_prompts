answer: |-
  ### I. Theory onto the Episode

  In the IAU dispute, the **Advocate** of the Gongsun Longian position is the IAU Working Group on Planet Definition and the majority of the General Assembly who voted for Resolution 5A. They argue that "Dwarf Planet" designates a reality distinct from "Planet," such that a dwarf planet is *not* a planet. The **Objector** is the minority of planetary scientists and the public who held that "Dwarf Planet" should remain a subcategory, implying that a dwarf planet *is* a (kind of) planet.

  The analogue of the **Seeking Test** is found in the scientific utility of the terms. A seeker of a "planet" for the purpose of dynamical modeling of the Solar System requires a body that dominates its orbital zone; they will accept Jupiter but will not accept Pluto. Conversely, a seeker of a "dwarf planet" for morphological study requires a body in hydrostatic equilibrium that lacks dynamical dominance; they will accept Pluto but will not accept Jupiter. Because the satisfaction conditions for the two terms do not overlap, the IAU concluded the extensions are disjoint.

  However, the IAU resolution does not separate the simple name from the compound in the same way Gongsun Long separates *horse* from *white horse*. Gongsun Long argues that "white horse" is a compound of two positive attributes (shape + color) that designates a different *shi* (reality/extent) than the simple "horse" (shape alone). The IAU definition builds "Dwarf Planet" by fixing one positive attribute (roundness) together with the **negation** of a third criterion (failure to clear the neighbourhood). "Planet" requires Roundness + Clearance. "Dwarf Planet" requires Roundness + No Clearance.

  This is a separation of two respects (morphology vs. dynamics), analogous to Gongsun Long's separation of hardness and whiteness in the *Hard and White Dialogue*. However, it matters significantly that the compound here is formed by negating a criterion rather than adding a specification. Gongsun Long's "white horse" is a subset of "horse" in common usage, which he denies via logical distinction. The IAU's "dwarf planet" was made a disjoint set from "planet" by **stipulation**. The earlier proposal to make dwarf planets a subcategory was voted down. Thus, the IAU did not discover that "dwarf planet" is not "planet"; they defined the term "planet" such that "dwarf planet" is excluded.

  Does the difference in sense ("seeker of planet" vs. "seeker of dwarf planet") establish the School of Names' conclusion? It establishes only the trivial fact that different names have different extensions if those names are defined differently. Gongsun Long claims the distinction is ontological (the name tracks a distinct respect of reality). The IAU case shows the distinction is taxonomic. The fact that a seeker of a planet will not accept Pluto proves only that the IAU successfully altered the extension of the word "planet," not that Pluto lacks the essence of "planet-ness" in the way a white horse might lack the essence of "horse-ness."

  ### II. The Episode onto the Theory

  The *White Horse Dialogue* supports two competing readings:
  1.  **The Realist Reading:** Simple names track single, metaphysically distinct respects (shape, color). A compound name designates a fusion of respects that is ontologically distinct from the simple respect. Thus, "white horse" is not "horse" because the reality of "white-horse" is not the reality of "horse."
  2.  **The Stipulative/Verbal Reading:** The argument exploits the ambiguity of *fei* ("is not"). It conflates non-identity (the concept "white horse" is not identical to the concept "horse") with non-membership (a white horse is not a member of the class of horses). Gongsun Long secures non-membership by linguistic fiat, insisting that because the names differ, the objects fall under different categories.

  The IAU case strongly supports the **Stipulative/Verbal Reading** and undermines the Realist Reading. The reclassification of Pluto was not a discovery that Pluto lacked the intrinsic "shape" of a planet while possessing the "color" of a dwarf. It was a decision to restrict the extension of the word "planet" to secure a specific scientific utility (dynamical dominance). The resolution looks like non-membership secured by decision (a vote) rather than non-identity discovered in nature.

  If the Realist Reading were correct, the IAU vote would be irrelevant; Pluto either is or is not a planet based on the natural separation of respects. The fact that a vote was required demonstrates that the boundary is conventional. This suggests Gongsun Long's proposition "a white horse is not a horse" is not a description of natural metaphysics, but a demonstration of how language can be rigidified to force non-membership. The IAU episode shows that "Dwarf Planet is not a Planet" is true only because the community agreed to define "Planet" as "Cleared Orbit." If they had defined "Planet" as "Round Body," the truth value would flip. This mirrors the verbal trick: if we define "Horse" as "Shape alone," then "White Horse" (Shape+Color) is not "Horse." But this is a truth of definition, not of reference.

  ### III. Commitment and Verdict

  The Pluto affair **refutes** the realist thesis of the School of Names that "a white horse is not a horse" describes a natural separation of respects, but it **vindicates** the logical mechanism that language can be stipulated to make such propositions true.

  Specifically:
  1.  **Is a dwarf planet not a planet in Gongsun Long's sense?** It is "not a planet" only by **stipulation**, not by ontological non-identity. Gongsun Long argues that the compound name *cannot* designate what the simple name designates. The IAU proved that a compound name *can* be excluded from the simple name if the community votes to define the simple name narrowly. The IAU case shows that "Dwarf Planet is not a Planet" is a consequence of Resolution 5A, not a consequence of the inherent logic of the terms. Therefore, "White Horse is not a Horse" is similarly a consequence of how one chooses to define "Horse," not a necessary truth about horses.
  2.  **Normative Limits:** The theory of the School of Names **cannot reach** the normative question of *why* one boundary ought to be drawn rather than another. Gongsun Long's logic can determine whether a predication is true *given* a definition, but it cannot determine which definition is correct. The "cultural" proposal (a planet is whatever enough people call a planet) raises a normative claim about usage and consensus. The School of Names, on this account, leaves this untouched because it treats names as tools for distinguishing *shi* (actualities), not as subjects of democratic or utility-based negotiation. The IAU vote was explicitly normative (prioritizing dynamical clearing over morphology for the label "planet"), a justification outside the scope of the *White Horse Dialogue*, which concerns only the consistency of naming, not the utility of the classification.

  **Final Verdict:** The IAU episode demonstrates that "A is not B" can be manufactured by redefining B to exclude A. This reduces Gongsun Long's thesis to a linguistic convention rather than a metaphysical insight. The School of Names explains how distinctions are maintained once drawn, but it offers no resources to decide whether Pluto *ought* to be a planet. That decision rests on scientific utility and cultural consensus, realms the *Bai Ma Lun* does not enter. Thus, the thesis "a white horse is not a horse" is vindicated only as a lesson in semantic rigidity, and refuted as a claim about the natural structure of reality.
