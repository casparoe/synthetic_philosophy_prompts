answer: |-
  **Exam Question**

  **Module:** PHI304 Philosophy of Biology
  **Section:** B
  **Time Allowed:** 45 Minutes
  **Marks:** 25

  **Question:**
  Consider the following five cases:
  1.  **Influenza Virus:** Requires host machinery to replicate; no independent metabolism.
  2.  **Mule:** Robust metabolism and homeostasis; sterile (no reproduction).
  3.  **Prion:** Misfolded protein that induces misfolding in others; no nucleic acid; no metabolism.
  4.  **Autocatalytic Reactor:** A sealed chemical system that sustains its own production indefinitely; no heredity, no variation, no lineage.
  5.  **Digital Organism:** A software entity in a simulation that mutates, competes, and adapts over generations; no physical chemistry.

  Critics argue that we should not define 'life' until we possess a complete theory of biological organisation. Rejecting this postponement, construct a positive argument for what the concept of 'life' is *for*. Using the cases above, specifically adjudicate the status of the **Autocatalytic Reactor (4)** and the **Digital Organism (5)**. Does 'life' name a natural kind, or is it a cluster concept? Your answer must commit to a verdict on cases 4 and 5.

  ***

  **Model Answer**

  The demand to postpone defining life until we possess a complete theory is a category error. Definitions are not merely the end-product of inquiry; they are tools that delimit the scope of investigation. If we cannot distinguish the subject matter of biology from geology or computer science, we cannot construct the theory in the first place. Therefore, 'life' must be defined by its theoretical role: it is the name for any system capable of open-ended Darwinian evolution. This functional definition prioritises the *process* of living over the *substrate* of living.

  Applying this to the standard borderline cases clarifies the stakes. The Influenza Virus (1) is not alive independently, but it is a fragment of a living lineage; it is a parasite on the evolutionary process, not a participant in its own right. The Mule (2) is alive. While it cannot reproduce, it is a temporal segment of an evolving lineage (the horse/donkey clade). To exclude the mule would be to exclude somatic cells from an organism, which is absurd. The Prion (3) is more difficult; it replicates information (shape), but without a genotype-phenotype distinction, its capacity for open-ended adaptation is severely limited. It is a pathological replicator, not a living system.

  The crucial test, however, lies in the invented and digital cases, which pull metabolism and evolution apart. The Autocatalytic Reactor (4) presents a system of robust metabolism and self-maintenance without heredity. Under a 'metabolism-first' definition, this is alive. However, without heredity and variation, it cannot learn from its environment. It is a stable chemical cycle, akin to a flame or a whirlpool, merely more complex. It creates order, but it cannot accumulate information. Therefore, the Reactor is **not alive**. It represents homeostasis without history. To classify it as life would strip biology of its historical dimension, reducing it to thermodynamics.

  Conversely, the Digital Organism (5) possesses no chemistry. It is silicon and logic, not carbon and water. Yet, it exhibits variation, heredity, and differential fitness. Lineages adapt to the computational environment. If life is defined by the evolutionary algorithm rather than the chemical medium, the Digital Organism **is alive** (or is a genuine instance of life). To deny this based on substrate chauvinism is to mistake the medium for the message. Astrobiology and artificial life research depend on this distinction; if we restrict life to Earth-chemistry, we blind ourselves to potential extraterrestrial or synthetic biospheres.

  This leads to the ontological status of the concept. Is 'life' a natural kind? If we define it by chemistry (DNA, proteins), it appears to be a historical accident of Earth. If we define it by the evolutionary process, it becomes a functional kind. However, even the evolutionary definition faces edge cases (like the virus). This suggests 'life' is best understood as a cluster concept, but one with a weighted centre. The weight lies heavily on evolutionary capacity. Cases may lack one feature (like the mule lacking reproduction) but remain within the cluster due to lineage. Cases lacking the core engine of evolution (like the Reactor) fall outside the cluster entirely.

  Ultimately, the 'wait for a theory' argument fails because it assumes theory precedes categorization. In biology, categorization drives theory. By committing to an evolutionary definition, we accept that the Digital Organism is a valid object of biological study, while the Autocatalytic Reactor is an object of chemistry. This distinction is not semantic; it determines whether we look for laws of adaptation or laws of equilibrium. We must define life not to sort a museum collection, but to identify where the logic of natural selection is operating. If the logic is present, life is present, regardless of whether it is made of meat, code, or (potentially) silicon.

  ***

  **Marking Scheme (25 Marks Total)**

  **1. The Function of Definition (5 Marks)**
  *   **Hit:** Argues that definition is a prerequisite for theory building, not a consequence. Rejects the "wait for theory" line immediately.
  *   **Miss:** Treats definition as merely descriptive or agrees that we should wait for more data before deciding.
  *   **Typical Muck-up:** Student spends 200 words discussing why definitions are hard without stating *why* we need one now.

  **2. Handling Standard Cases (1-3) (5 Marks)**
  *   **Hit:** Resolves the Mule via lineage (it belongs to an evolving clade). Dismisses Virus/Prion as parasitic or limited replicators without getting bogged down.
  *   **Miss:** Lists criteria (metabolism, reproduction) and says the Mule is "borderline" or "debatable" without taking a stance.
  *   **Typical Muck-up:** Claims the Mule is not alive because it cannot reproduce, ignoring the lineage argument.

  **3. Verdict on Autocatalytic Reactor (Case 4) (5 Marks)**
  *   **Hit:** Verdict: Not Alive. Reason: Lacks heredity/evolutionary potential. Distinguishes self-maintenance from historical adaptation.
  *   **Miss:** Verdict: Alive. Reason: It sustains itself chemically.
  *   **Typical Muck-up:** Sits on the fence ("It depends on your definition") rather than adjudicating based on the argument established in the intro.

  **4. Verdict on Digital Organism (Case 5) (5 Marks)**
  *   **Hit:** Verdict: Alive (functionally). Reason: Substrate independence. Evolution is a logical process, not a chemical one.
  *   **Miss:** Verdict: Not Alive. Reason: It isn't physical/chemical.
  *   **Typical Muck-up:** Dismisses the case as "just a simulation" without engaging with the philosophical implication of substrate neutrality.

  **5. Ontological Status & Conclusion (5 Marks)**
  *   **Hit:** Addresses Natural Kind vs. Cluster. Concludes that while it may be a cluster, Evolution is the weighted centre. Ties back to the utility of the definition.
  *   **Miss:** States it is a cluster concept as a "cop-out" to avoid making hard choices on the cases.
  *   **Typical Muck-up:** Ends with "There is no right answer," undermining their own argument.

  ***

  **Differentiation: 2:1 vs. 1st Class**

  *   **The 2:1 Candidate:** Will correctly identify that Evolution is the key criterion. They will correctly classify the Reactor as dead and the Digital Organism as alive (or functionally equivalent). They will reject the "wait for theory" line. Their answer will be competent and follow the marking scheme points logically.
  *   **The 1st Class Candidate:** Will go beyond classification to analyze the *consequences* of the classification. They will explicitly articulate *why* substrate chauvinism is a scientific hindrance (e.g., mentioning the risk to astrobiology). They will handle the 'Cluster Concept' point with more nuance, explaining that 'cluster' does not mean 'anything goes,' but rather that there is a gravitational centre (evolution) that holds the cluster together. They will treat the "wait for theory" objection not just as wrong, but as a misunderstanding of how scientific concepts evolve (operationalism vs. realism). Their prose will be tighter, with less repetition of the case details and more focus on the philosophical implications of the verdicts.
