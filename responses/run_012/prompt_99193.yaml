prompt: |-
  I am a novelist at work on a book about a pharmaceutical company on trial, and a scene in which the prosecution must establish that the company knew its drug was dangerous has left me with a puzzle I cannot resolve on my own. The government's theory, as my legal consultant explained it, is the doctrine of collective knowledge: the corporation's knowledge is treated as the sum of what its employees knew, so the company can be said to have known a fact that no single employee ever knew — one chemist knew about an impurity, a second knew the impurity was toxic, a third knew the batch had shipped, and the company, assembled from them, is held to have known the whole. It is then convicted and fined, while its officers, as individuals, are imprisoned for what the company did; and when the corporate form turns out to be a sham, a court will pierce the veil and insist there was never a real agent there at all. I keep thinking of an ant colony: no ant knows where the food is, yet the colony finds it, and we casually say the colony decided to move; the colony Aunt Hillary in Hofstadter's Ant Fugue is never far from my mind. I am not looking for a survey of the free-will literature or a reading list, and I have no way to look anything up — I want you to reason from the practice itself.

  Please act as an expert in the philosophy of mind and in collective intentionality, and, before committing to any reconstruction, brainstorm the candidate views on the table and set aside the ones the practice cannot actually support. Then reconstruct the implicit theory of mind and agency that this body of corporate law presupposes. Which view of what it is for something to have a mind, to know, or to intend does the collective-knowledge doctrine only make sense under? Which rival views does it quietly rule out — that only individual human minds exist, that group talk is a mere manner of speaking, that a collective mind must be conscious or unified in some stronger sense? Which views does the practice merely fit comfortably with without requiring them? Where does the practice contradict itself or sit in tension with the other half of corporate law — the insistence that a corporation acts only through individuals, the imprisonment of officers, the piercing of the veil? And where is the practice philosophically underdetermined, so that several incompatible theories would license exactly this way of proceeding? Finally, tell me what would have to change in the courtroom if the presupposed view were replaced by one of its rivals, and state the strongest objection to your own reconstruction.

  Return your answer as a single JSON object and nothing else, with these fields: "practice" (a neutral one-sentence description of what the law does), "presupposed_view_of_mind" (the central thesis the practice requires), "necessary_commitments" (a list of the commitments the practice cannot do without), "rival_views_excluded" (a list, each with a phrase saying how the practice rules it out), "views_it_merely_coexists_with" (a list of positions the practice fits but does not force), "internal_tensions" (a list of objects, each with "commitment_a", "commitment_b", and "explanation"), "underdetermined_points" (a list of objects, each with "question", "why_underdetermined", and "competing_answers"), "ant_colony_parallel" (how far the colony metaphor carries and where it breaks), "if_view_replaced" (what would change in the courtroom), "strongest_objection_to_reconstruction" (a paragraph), "confidence" (one of "low", "medium", "high"), and "what_would_settle_it" (what evidence or argument would decide the reconstruction). Keep each string field to a few sentences; be concrete and avoid citations, since I cannot check them and do not need them.
