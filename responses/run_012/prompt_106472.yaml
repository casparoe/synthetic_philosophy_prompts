answer: |-
  The alarm on Arthur's watch vibrated at 2:00 PM. It was a gentle pulse, easily ignored, but he never ignored it. This was the hour the light shifted in the sunroom, striking the glass of the display cabinet just so, and it was the hour Elena began to look for her coat.

  Arthur was in the kitchen, calibrating the grind on the espresso machine. He liked the precision of it—the weight of the bean, the tamp of the press, the exact seconds of extraction. It was a small domain of control, but it was his. He heard the shuffle of slippers on hardwood, the pause at the hallway closet.

  "Arthur?" Her voice was light, unburdened. "I'm going to be late."

  He poured the shot, watching the crema bloom. "Late for what, love?"

  "The meeting. At the firm."

  Three months ago, she had retired. Six months ago, she had forgotten she retired. Today, she was employed again.

  Arthur wiped the steam wand. He could simply tell her the truth. *You don't work there anymore. We sold the house in the city. You haven't been well.* He had tried that in January. She had wept for an hour, a raw, terrified sound that seemed to strip the paint from the walls. He had promised himself then: no more corrections. Corrections were dead ends. Adaptations were the way through.

  "The firm called," Arthur said, carrying the cups into the living room. "They moved it to tomorrow."

  Elena stood by the closet, her hand on the wool coat she hadn't worn in years. She frowned, a flicker of confusion crossing her face before smoothing out. "Tomorrow? But I have the presentation."

  "They know. They want you rested." He set the coffee on the side table, exactly on the coaster. "Sit. Tell me about the presentation."

  She sat. She talked about charts and clients that no longer existed. Arthur nodded, asked follow-up questions, steered the conversation toward the details of the graphs rather than the destination of the meeting. He was good at this. He had become a virtuoso of the detour. When she mentioned the train schedule, he mentioned a strike. When she looked for her briefcase, he suggested she had left it at the cleaner's. He solved every obstacle she encountered with a plausible, soothing fiction.

  He felt a surge of pride. It wasn't lying; it was translation. He was translating a world that no longer fit her into a language she could still speak.

  Two weeks later, the vibration came at 2:00 PM.

  Arthur was in the garden, pruning the hydrangeas. He heard the front door open. He moved quickly, wiping his hands on his trousers. Elena was on the porch, keys in hand, squinting at the driveway.

  "The car isn't starting," she said. It wasn't a question.

  Arthur walked to the driveway. The car was fine. He had checked it yesterday. But if he said that, she would try to drive it. If she tried to drive it, she might get lost. If she got lost, the state would get involved. They would talk about facilities. They would talk about *capacity*.

  He popped the hood. He didn't know much about engines, but he knew where the battery was. He loosened the terminal just enough to break the connection, then tightened it back, leaving it slightly askew.

  "Corrosion," Arthur said, pointing to the clean metal. "I'll have to order the part."

  Elena looked at him, then at the engine, then back at him. She was searching for the groove, the place where her intention met the world's resistance. "How long?"

  "Few days. Maybe a week."

  "I could take the bus."

  "Route changed," he said instantly. "Construction on Main. You'd be stranded."

  She looked at the keys in her hand. They were heavy, useless. She slipped them into her pocket. "Well. I suppose I can work from home."

  "Exactly."

  He walked her back inside. He made lunch. He felt a profound sense of competence. He had assessed the threat, neutralized it, and restored equilibrium. He was keeping her safe. He was keeping them together.

  A month later, his daughter, Sarah, came for dinner.

  Sarah was efficient, like him, but her efficiency was directed at outcomes, not processes. She watched Elena pick at her food, watched the way Elena's eyes drifted to the coat closet every time a car passed on the street outside.

  "Dad," Sarah said, after Elena had gone to rest. "We need to talk about the facility."

  Arthur washed the dishes. He placed each plate in the rack with deliberate care. "She's happy here."

  "She's confused, Dad. She tried to leave last week. Mrs. Gable next door saw her walking down the sidewalk in her slippers."

  "I handled it."

  "You're handling it," Sarah corrected. "There's a difference. You're patching leaks. The hull is gone."

  Arthur dried his hands. He looked at his daughter. He saw the concern, but he also saw the solution she offered: removal. Transfer. A new routine managed by strangers. It was a logical solution. It was the sensible thing. It was the end of the loop.

  "If I move her," Arthur said, "she'll think I abandoned her."

  "She'll think you're her father. She won't know you."

  "I'll know."

  Sarah sighed, a sound of frustrated love. "You're tired. I can see it. You're running a marathon on a broken leg."

  "I'm fine, Sarah."

  "Are you? Or are you just... busy?"

  The question hung in the air. Arthur looked at the sink. It was clean. The counters were wiped. The schedule was set for tomorrow. 7:00 AM: Medication. 9:00 AM: Walk. 2:00 PM: The Meeting.

  "I'm doing what needs to be done," Arthur said.

  "Someone else could do it."

  "No one else knows the route."

  Sarah left without hugging him. Arthur locked the door. He checked the deadbolt. He checked the chain. He walked to the sunroom.

  It was 2:00 PM the next day. The light hit the cabinet. The watch vibrated.

  Arthur was in the study, organizing his files. He heard the footsteps. Slower this time. He stood up and met her in the hall. She was wearing the coat. She had a purse over her shoulder.

  "Arthur," she said. "I'm going to be late."

  He looked at her. He could say it. He could say, *Sarah is right. We can't do this. I am tired. Let go.* He could call Sarah. He could call the doctor. He could step out of the garden and let the weeds take it.

  He looked at her hands. They were trembling slightly, clutching the strap of the purse. She was afraid. Not of being late, but of the silence that would follow if she stopped moving. If she stopped being the woman who went to meetings, who was she? And if he stopped being the man who kept her from leaving, who was he?

  "The traffic is terrible," Arthur said. He smiled, warm and reassuring. "Why don't we drive around the block first? Check the roads."

  "Okay," she said. "Yes. Good idea."

  "Go take off the coat, though. It's warm in the car."

  She hesitated. The coat was the armor. The coat was the ticket.

  "I'll put the heater on," Arthur promised. "You won't need it."

  She looked at him, searching for a contradiction, a reason to stop. He offered none. He was a mirror, reflecting her intent back at her, smoothed and safe. She took off the coat. She hung it in the closet.

  Arthur went to the kitchen to fill the kettle. He listened to the water run. He thought about the engine he had broken. He thought about the bus route that didn't exist. He thought about the facility that waited like a quiet room at the end of a long hall.

  He could go there. He could walk down that hall. But the path was unmarked, and the map was in his head, and he had drawn it so many times that the ink had dried into the paper.

  He brought the tea to the sunroom. Elena was sitting in the chair, watching the light on the glass. She looked peaceful. She looked trapped.

  "Better?" Arthur asked.

  "Yes," she said. "Thank you, Arthur."

  "Anytime," he said.

  He sat in the chair opposite her. He checked his watch. 2:15 PM. The meeting was over. The crisis was averted. The system was stable. He took a sip of tea and watched the dust motes dance in the shaft of light, wondering if he was holding her there, or if the light was holding them both.
