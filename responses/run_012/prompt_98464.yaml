answer: |-
  **Essay Question (25 Marks)**

  A citizens' panel is reviewing a coastal defense scheme using the Ramsey Rule, $r = \rho + \eta g$, to determine the social discount rate. New economic models suggest the region faces inevitable long-term per-capita consumption decline ($g < 0$).

  1.  Distinguish ethically between discounting well-being and discounting consumption within this framework.
  2.  Demonstrate arithmetically how expected economic decline affects the consumption discount rate ($r$) relative to the pure time preference rate ($\rho$).
  3.  Evaluate the justification for a positive $\rho$ based on axioms of consistent ranking over an unbounded future, contrasting this with prudential or market-based arguments.
  4.  Explain why a negative consumption discount rate does not imply irrationality or contradict a positive pure time preference.

  ***

  **Model Answer**

  The Ramsey Rule decomposes the consumption discount rate ($r$) into three parameters: the pure time preference rate ($\rho$), the elasticity of marginal utility of consumption ($\eta$), and the growth rate of per-capita consumption ($g$). Ethically, this equation bridges two distinct objects of valuation: well-being (utility) and consumption goods. Discounting well-being is governed solely by $\rho$. If $\rho > 0$, we value the utility of present generations slightly more than identical utility experienced by future generations, purely due to temporal location. Discounting consumption, however, is governed by $r$. This rate adjusts the value of resources based on both time preference and expected changes in wealth. Confusing these two leads to the error of believing that discounting consumption implies discounting the moral standing of future people.

  In the standard case where $g > 0$, future generations are expected to be richer. Due to diminishing marginal utility ($\eta > 0$), an extra unit of consumption is worth less to them. Thus, $\eta g$ adds to $\rho$, raising $r$. However, in the scenario where $g < 0$, future generations are expected to be poorer. The term $\eta g$ becomes negative. Arithmetically, if the magnitude of this negative growth term exceeds the pure time preference rate ($|\eta g| > \rho$), the consumption discount rate $r$ becomes negative. This means future consumption goods are valued more highly than present ones.

  This outcome requires careful ethical distinction. A negative $r$ does not imply a negative $\rho$. One can maintain a positive pure time preference while endorsing a negative consumption discount rate. The positive $\rho$ reflects a structural axiom of intertemporal choice: specifically, that consistent ranking over an unbounded future requires the utility sum to converge. Without $\rho > 0$, preferences over infinite streams may fail to be continuous or representable, regardless of ethical sympathies. This is an axiomatic necessity for coherent ordering, distinct from prudential impatience (a psychological desire for immediate gratification) or market-based arguments (opportunity costs of capital). The axiomatic case defends $\rho > 0$ as a condition for rationality in ranking, not as a moral license to ignore the future. Prudential arguments rely on human mortality; market arguments rely on current prices. Neither addresses the logical requirement for bounding infinite utility streams.

  Conversely, the negative component driven by $g < 0$ reflects equity, not impatience. Because future agents are poorer, the marginal utility of their consumption is higher. Transferring resources to them yields a higher ethical return than consuming them now. Therefore, valuing future consumption more highly than present consumption (negative $r$) is rational distributional weighting, not temporal inconsistency. It signals that the scarcity effect outweighs the pure time preference effect.

  Confusing these components leads to policy errors. If one conflates discounting consumption with discounting well-being, a negative $r$ might be mistaken for claiming future people matter more inherently. They do not; their utility is still discounted by $\rho$. However, their scarcity makes their consumption claims stronger. Similarly, treating $\rho$ as merely prudential impatience invites the error of setting it to zero on moral grounds, potentially violating the axiomatic requirement for consistent ranking over infinite horizons. Alternatively, relying on market rates ignores the ethical obligation to smooth consumption across generations facing decline.

  Ultimately, the recommendation for the coastal defense scheme depends on $r$. If $r$ is negative, future benefits from avoided damage are valued *more* highly than present costs, strengthening the case for investment. This holds even if $\rho$ remains positive. The ethical force comes from the inequality aversion term interacting with negative growth, overriding pure time preference in the consumption sphere. Recognizing this allows the panel to justify heavy present investment without abandoning the axiomatic constraints required for long-term rational planning. The disagreement buried in the standard decomposition is thus revealed: it is not about whether the future matters, but about how scarcity and consistency constrain our valuation of resources versus experiences.

  ***

  **Marking Scheme (25 Marks)**

  **1. Definition and Decomposition (5 Marks)**
  *   **Criteria:** Correctly identifies $r$, $\rho$, $\eta$, and $g$ in the Ramsey Rule and states the equation.
  *   **Common Error:** Treating the discount rate as a single monolithic number without decomposition.
  *   **Marks:** 5 for precise definition; 3 for vague definition; 0 for incorrect equation.

  **2. Distinction: Well-being vs. Consumption Discounting (5 Marks)**
  *   **Criteria:** Explicitly distinguishes $\rho$ (utility discounting) from $r$ (consumption discounting). Notes that $\rho$ applies to moral standing/utility, $r$ to resource valuation.
  *   **Common Error:** Equating discounting consumption with discounting the moral worth of future generations.
  *   **Marks:** 5 for clear distinction; 3 for implied distinction; 0 for conflating the two.

  **3. Arithmetic of Negative Growth (5 Marks)**
  *   **Criteria:** Correctly explains that $g < 0$ makes $\eta g$ negative and can push $r < 0$ if $|\eta g| > \rho$.
  *   **Common Error:** Assuming discount rates must always be positive regardless of growth assumptions.
  *   **Marks:** 5 for correct arithmetic logic; 3 for noting decline but missing the negative $r$ possibility; 0 for ignoring the scenario.

  **4. Axiomatic vs. Prudential/Market Justification for $\rho$ (5 Marks)**
  *   **Criteria:** Explains $\rho > 0$ as a requirement for consistent ranking/boundedness over infinite horizons, distinct from psychological impatience or market returns.
  *   **Common Error:** Treating the axiomatic argument as merely a restatement of psychological impatience or market opportunity costs.
  *   **Marks:** 5 for clear axiomatic distinction; 3 for mentioning axioms but conflating with impatience; 0 for purely prudential explanation.

  **5. Rationality of Negative $r$ and Policy Implication (5 Marks)**
  *   **Criteria:** Explains why negative $r$ is rational (scarcity/equity) despite positive $\rho$, and links this to stronger investment justification.
  *   **Common Error:** Declaring a negative discount rate irrational or contradictory to positive time preference.
  *   **Marks:** 5 for full synthesis; 3 for explaining rationality but missing policy link; 0 for declaring irrationality.

  **Grade Boundaries**
  *   **A (20–25 Marks):** Must secure full marks in moves 2, 4, and 5. The answer must clearly separate the axiomatic necessity of $\rho$ from prudential impatience and correctly handle the negative $r$ arithmetic without contradiction.
  *   **B (15–19 Marks):** May secure moves 1, 2, and 3 but typically loses marks on move 4 (conflating axiomatic and prudential cases) or move 5 (hesitating on the rationality of negative $r$).
  *   **C (10–14 Marks):** Correctly defines the Ramsey Rule but fails to distinguish between utility and consumption discounting or assumes $r$ cannot be negative.
  *   **D (0–9 Marks):** Fundamental misunderstandings of the equation or ethical categories; relies on slogans about "ignoring the future."
