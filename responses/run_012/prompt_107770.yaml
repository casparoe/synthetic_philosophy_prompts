answer: |-
  # The Sorites Diagnostic Instrument

  **Instructions:** Begin at **Node 1**. Answer the question honestly based on your intuitions about vague predicates (e.g., *heap*, *bald*) and practical counterparts (e.g., *personally identifiable information*, *clinically depressed*, *guilty beyond reasonable doubt*, *species territory*). Follow the arrow corresponding to your answer. At the leaves, you will find your philosophical position, the cost of that position, and how it handles higher-order vagueness.

  **The Starting Package:**
  Before beginning, acknowledge the three claims you likely accepted before encountering the paradox:
  1.  **Base:** A single grain is not a heap (or one symptom is not depression).
  2.  **Tolerance:** Adding one grain (or symptom) never turns a non-heap into a heap.
  3.  **Limit:** Ten thousand grains (or nine symptoms) certainly make a heap.
  *Classical logic dictates these three cannot all be true. This tree diagnoses which one you are willing to abandon.*

  ---

  ### Node 1: The Logic Constraint
  **Question:** Do you require classical logic to hold without exception? Specifically, must the Law of Excluded Middle ($P$ or not-$P$) and Modus Ponens be valid for every sentence, even borderline ones (e.g., "This stretch of land is species territory")?
  *   **Yes:** Go to **Node 2**. (You want to save classical logic).
  *   **No:** Go to **Node 5**. (You are willing to modify logic to save the premises).

  ### Node 2: The Truth Value Constraint
  **Question:** Consider a borderline case (e.g., a dataset with quasi-identifiers, or a patient with 4 of 9 depression symptoms). Does this sentence possess a determinate truth value (strictly True or strictly False) right now, even if you cannot verify which one it is?
  *   **Yes:** Go to **Node 3**. (You accept Bivalence).
  *   **No:** Go to **Node 6**. (You reject Bivalence for borderline cases).
      *   *Note: This is the split between Epistemicism (Yes) and Supervaluationism (No).*

  ### Node 3: The Context Constraint
  **Question:** Is the truth value of the predicate fixed by the intrinsic meaning of the term and the state of the world, or does it shift depending on the conversational context (e.g., a legal court vs. a casual dinner)?
  *   **Fixed:** Go to **Node 4**. (The boundary is stable).
  *   **Shifts:** **Leaf A: Contextualism.**
      *   *Position:* The boundary is sharp within a specific context but moves as the conversation proceeds.
      *   *Cost:* Gives up **Tolerance**. The cost is that meaning is unstable; "heap" means something different in premise 1 than in premise 100.
      *   *HOV:* Handles higher-order vagueness by allowing the *standards* for context-shifts to be vague. Regress is stopped by pragmatic limits on conversation.

  ### Node 4: The Knowledge Constraint
  **Question:** If the boundary is fixed, is its exact location knowable in principle? (Is there a fact of the matter about exactly which grain makes the heap, even if humans can't find it?)
  *   **Yes:** **Leaf B: Classical Realism (Unoccupied).**
      *   *Position:* There is a sharp boundary, and we can know it.
      *   *Status:* **Unoccupied.** This combination is incoherent with the Sorites paradox; if you knew the boundary, the paradox would dissolve empirically. No one holds this because it contradicts the phenomenology of vagueness.
  *   **No:** **Leaf C: Epistemicism.**
      *   *Position:* There is a sharp boundary fixed by the world/usage, but it is unknowable.
      *   *Cost:* Gives up **Tolerance**. The cost is "metaphysical magic": there is a fact of the matter about the last non-heap, but nature hides it from us completely.
      *   *HOV:* Accepts higher-order vagueness as higher-order ignorance. We don't know where the boundary is, and we don't know where the boundary of our ignorance is. Regress stops at facts we cannot access.

  ### Node 5: The Modification Path
  *(Reached from Node 1: "No" to Classical Logic)*
  **Question:** If classical logic fails, is it because borderline sentences lack a truth value entirely, or because they have too many truth values (degrees)?
  *   **Lack a Value (Gap):** Go to **Node 7**.
  *   **Too Many Values (Degree):** **Leaf D: Fuzzy Logic.**
      *   *Position:* Truth comes in degrees (0 to 1). A borderline case is 0.5 True.
      *   *Cost:* Gives up **Tolerance** (Modus Ponens fails for partial truths). The cost is that logical validity becomes a matter of degree, complicating inference.
      *   *HOV:* Handles HOV by assigning degrees to the degrees (e.g., "very true"). Regress is managed mathematically but can feel unintuitive.

  ### Node 6: The Gap Path
  *(Reached from Node 2: "No" to Truth Values)*
  **Question:** Does the predicate fail to refer to anything real at all, or does it refer but admit multiple acceptable ways of being made precise (e.g., defining 'depressed' as 4+ symptoms vs 5+ symptoms)?
  *   **Fails to Refer:** **Leaf E: Nihilism (Error Theory).**
      *   *Position:* Vague predicates are empty; there are no heaps, no species, no persons.
      *   *Cost:* Gives up **Base** and **Limit**. The cost is radical revisionism: most of our ordinary talk is systematically false.
      *   *HOV:* Dissolves HOV by denying the first-order boundary exists. No boundary means no boundary of the boundary.
  *   **Admits Precisification:** Go to **Node 7**.

  ### Node 7: The Supervaluation Check
  *(Reached from Node 6 or Node 5-Gap)*
  **Question:** Do we preserve classical logic by saying a sentence is "True" only if it is true on *all* admissible precisifications (Super-Truth)?
  *   **Yes:** **Leaf F: Supervaluationism.**
      *   *Position:* Borderline sentences have no truth value, but tautologies ($P$ or not-$P$) remain true because they hold on all precisifications.
      *   *Cost:* Gives up **Tolerance** (The inductive premise is not Super-True). The cost is non-classical semantics: existential generalization fails (there is a number $n$ that is a heap, but no specific $n$ is *the* heap).
      *   *HOV:* Handles HOV by allowing the *set of admissible precisifications* to be vague. Regress is accepted as a feature of the model, not a bug.
  *   **No:** **Leaf G: Simple Truth-Value Gap.**
      *   *Position:* Borderline sentences are simply neither True nor False, and classical logic does not survive (Excluded Middle fails).
      *   *Cost:* Gives up **Tolerance** and **Classical Logic**. The cost is a weaker logical system where standard proofs break down in borderline zones.
      *   *HOV:* Must posit gaps for the gaps. Regress is usually accepted as inevitable.

  ### Node 8: The Convention Check
  *(Specific diagnostic for Epistemicism variants)*
  **Question:** For the Epistemicist (Leaf C): Is the sharp boundary fixed by the physical world, or by linguistic conventions that happen to be unknowable?
  *   **Physical World:** **Leaf C (Standard Epistemicism).**
  *   **Linguistic Convention:** **Leaf H: Conventionalist Epistemicism.**
      *   *Position:* The boundary is fixed by our rules, but the rules are too complex to compute.
      *   *Cost:* Gives up **Tolerance**. The cost is indistinguishability from Standard Epistemicism in practice.
      *   *Honesty Note:* **Unoccupied/Distinct?** This branch is largely unoccupied as a distinct view because defenders admit it is empirically indistinguishable from Standard Epistemicism. If the convention is unknowable, it functions exactly like a physical fact.

  ---

  ### Summary of Diagnostics

  | Leaf | Position | Gives Up | Cost | Higher-Order Vagueness |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | **Contextualism** | Tolerance | Meaning shifts during the argument. | Vague standards for context shifts. |
  | **B** | **Classical Realism** | None | **Incoherent.** Contradicts the paradox data. | N/A |
  | **C** | **Epistemicism** | Tolerance | Sharp boundaries exist but are unknowable. | Higher-order ignorance. |
  | **D** | **Fuzzy Logic** | Tolerance | Logic becomes a matter of degree. | Degrees of degrees. |
  | **E** | **Nihilism** | Base & Limit | Most ordinary statements are false. | Dissolved (no boundaries exist). |
  | **F** | **Supervaluationism** | Tolerance | Logic works, but reference is indeterminate. | Vague set of precisifications. |
  | **G** | **TV Gap** | Tolerance & Logic | Classical logic fails in borderline cases. | Gaps for gaps. |
  | **H** | **Conv. Epistemic** | Tolerance | Indistinguishable from Standard Epistemicism. | Same as Standard. |

  **Final Note on Overlaps:**
  If you found yourself oscillating between **Leaf C (Epistemicism)** and **Leaf H (Conventionalist)**, you have identified a known ambiguity in the literature. If the convention is unknowable, the view functions identically to Epistemicism. If you found yourself between **Leaf F (Supervaluationism)** and **Leaf G (TV Gap)**, note that Supervaluationism is essentially an attempt to salvage classical logic from the Gap view. If you do not care about saving classical logic, the distinction is merely technical.
