prompt: |-
  I'm the clinical ethicist at a mid-size hospital and I keep getting paged at 2am for the same cluster of questions, so I want to write a one-page procedure that the night resident or charge nurse can actually run without me. The subject matter is the doing/allowing family of distinctions — killing vs letting die, acts vs omissions, intending vs merely foreseeing, and the double-effect machinery that goes with it. Two wrinkles specific to us: our policy manual officially states that withholding and withdrawing life support are morally equivalent, which most of my nurses do not believe in their bones, and our state has legalized aid in dying while our hospital (religiously affiliated) opts out, so some calls are really about that.

  The calls I get: should we start a treatment, should we stop one already running, should we withhold CPR or pressors, is it OK to sedate someone to unconsciousness for refractory suffering when we expect it may shorten life, can we stop tube feeding. Roughly twice a week, family in the room, and I usually cant get there in under an hour. The person running the procedure is a resident who's read maybe one article about any of this and is scared of getting it wrong.

  Please write the procedure. I need the questions in the order they should be asked, what counts as a sufficient answer to each, which steps are factual (prognosis, what the intervention actually does) and which are value questions that no amount of data settles, where the procedure stops with a flat no, where it hands the decision to a person instead of answering, and who has to sign what at the end. Two things I want dealt with honestly instead of papered over: (a) whether the procedure should ask anybody to state their intention at all, since asking an exhausted nurse to declare that she isnt intending the death seems to just produce a form filled in to get the desired answer, and (b) whether to phrase the whole thing causally (did the act cause the death?) or normatively (is the death attributable to a choice that violated a duty?), because our risk manager wants the causal version and I think that's a mistake.

  Then run it on three cases: (1) terminal extubation of a patient who will die within hours; (2) palliative sedation for a dying patient with refractory agitation, where the family is asking for it and one nurse refuses to take part; (3) a family demanding that everything continue, where the team believes ongoing dialysis is now doing more harm than good. Include at least one case where the procedure tells me something I don't want to hear — say, that the doing/allowing line I've been leaning on does no real work here and the live question is somewhere else entirely — and end with a short list of what the procedure cannot decide, so I know when to get out of bed.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Clinical Ethicist at a mid-size, religiously affiliated hospital.
      *   **Problem:** Frequent 2am pages regarding end-of-life (EOL) decisions (doing/allowing, DDE, withholding/withdrawing).
      *   **Goal:** A one-page procedure for night residents/charge nurses to use *without* the ethicist.
      *   **Specific Context:**
          *   Policy: Withholding = Withdrawing (but staff don't believe it).
          *   Legal/Religious Conflict: State allows aid in dying (AID); Hospital opts out (religious).
          *   Common Calls: Start/stop treatment, CPR/pressors, palliative sedation, tube feeding.
          *   User: Exhausted resident, scared of liability/error.
      *   **Specific Constraints/Requirements:**
          *   Order of questions.
          *   Sufficient answers.
          *   Distinction: Factual vs. Value questions.
          *   Stop points (Flat No vs. Hand-off).
          *   Sign-off requirements.
          *   **Honesty Check 1:** Intentionality (DDE) - Is asking about intention useless performative paperwork?
          *   **Honesty Check 2:** Causal vs. Normative framing of death (Risk Manager wants causal; Ethicist wants normative).
          *   **Test Cases:** (1) Terminal extubation, (2) Palliative sedation (with dissenting nurse), (3) Demanded futile dialysis.
          *   **Critical Reflection:** One case must reveal the procedure's limits (the distinction doesn't do the work).
          *   **Output:** The Procedure + The Test Cases + Limitations List.

  2.  **Deconstruct the Ethical/Legal Landscape:**
      *   *Withholding/Withdrawing:* Medically and legally equivalent, but psychologically distinct for staff. The procedure needs to bridge this gap without lying.
      *   *AID vs. EOL Care:* Crucial distinction. AID involves intent to cause death + means to cause death. EOL involves intent to relieve suffering + accepting risk of death.
      *   *Double Effect (DDE):* Often misused. Asking "Do you intend death?" usually yields "No" regardless of truth. Better to focus on *proportionality* and *indication*.
      *   *Causal vs. Normative:* Risk Manager wants "Did the drug kill them?" (Causal). Ethicist knows "Did we violate a duty?" (Normative) is the real ethical question. The procedure must satisfy Risk Management without corrupting ethical reasoning. *Solution:* Frame it as "Medical Indication" (Factual) + "Goal of Care" (Normative).

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Constraint:* One page. Needs to be dense but readable.
      *   *Tone:* Directive, clear, supportive of the resident.
      *   *Structure:* Flowchart style logic but in text.
      *   *Addressing the "Intention" Wrinkle:* Don't ask "Do you intend death?" Ask "What is the physiological target?" (Factual) and "Is the dose proportional to symptoms?" (Normative). This bypasses the mind-reading problem.
      *   *Addressing the "Causal vs. Normative" Wrinkle:* Use language like "Attributable to underlying disease" vs. "Attributable to intervention." This satisfies Risk Manager (causal language) but implies the normative distinction (disease vs. doctor).
      *   *The AID Opt-Out:* Must explicitly screen for AID requests. If it's AID, stop. If it's symptom management, proceed.
      *   *Withholding/Withdrawing:* Explicitly state they are the same decision point.

  4.  **Developing the Test Cases:**
      *   *Case 1 (Extubation):* Classic withdrawing. Should pass.
      *   *Case 2 (Sedation + Dissent):* Complex. DDE applies. Conscientious objection issue.
      *   *Case 3 (Futile Dialysis):* This is the "Hard No." The procedure needs to show that *demand* doesn't equal *indication*.
      *   *The "Uncomfortable Truth" Case:* I need to ensure one of these reveals that "Doing/Allowing" isn't the real issue. Case 3 is the best candidate. The issue isn't stopping dialysis (allowing death) vs. continuing (doing harm); it's medical futility/non-beneficial treatment. The distinction collapses.

  5.  **Refining the "Honesty" Components:**
      *   *Intention:* I will advise the user *in the commentary* that the procedure avoids asking about intention directly because it's unreliable. Instead, it proxies intention through *proportionality*.
      *   *Causal/Normative:* I will draft the procedure to use "Medical Causality" language that serves the "Normative Duty" purpose. (e.g., "Is death caused by pathology or therapy?")

  6.  **Writing the Procedure (Mental Draft):**
      *   Header: EOL Decision Support (Night Coverage).
      *   Step 1: Is this Aid in Dying? (If yes, STOP -> Admin).
      *   Step 2: Is the treatment medically indicated? (If no, STOP -> Ethics/Attending).
      *   Step 3: Goal of Care alignment?
      *   Step 4: Proportionality (for sedation).
      *   Sign-off: Attending + Charge Nurse.

  7.  **Critique & Polish:**
      *   *Wait, the prompt asks me to write the procedure AND run it.*
      *   *Constraint Check:* The prompt asks for the procedure *first*, then the cases.
      *   *Tone Check:* Needs to sound like it was written by an ethicist who knows the reality of 2am calls.
      *   *The "One Page" constraint:* I need to keep the text tight.
      *   *The "Uncomfortable Truth":* I need to make sure the analysis of the cases highlights where the procedure fails or reveals the distinction is moot. Case 3 (Futile Dialysis) is where "Doing/Allowing" fails. The issue is *futility*, not the act/omission distinction.

  8.  **Finalizing the Content:**
      *   *Procedure:* "Night Triage Protocol for End-of-Life Interventions."
      *   *Key Feature:* Replaces "Intention" with "Proportionality." Replaces "Causal/Normative" debate with "Attribution of Cause."
      *   *Cases:*
          1.  Extubation: Passes. Shows Withholding=Withdrawing.
          2.  Sedation: Passes but highlights conscience clause.
          3.  Dialysis: Fails the "Indication" check. Reveals the Doing/Allowing distinction is irrelevant; it's about Benefit/Burden.
      *   *Limitations:* What requires the Ethicist? (Surrogate conflict, unclear prognosis, conscience impasse).

  9.  **Self-Correction on "Causal vs Normative":**
      *   Risk Manager wants: "Did the morphine kill them?"
      *   Ethicist wants: "Did we violate a duty?"
      *   *Compromise in Procedure:* "Primary Cause of Death." If the form says "Underlying Disease," Risk Manager is happy (legal causality), Ethicist is happy (normative justification). I will explicitly note this design choice in the commentary.

  10. **Final Review against Prompt:**
      *   One-page procedure? (Visually condensed).
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Factual vs Value? Labeled.
      *   Stop points? Yes.
      *   Signatures? Yes.
      *   Intention honesty? Addressed in commentary.
      *   Causal/Normative honesty? Addressed in commentary.
      *   Three cases run? Yes.
      *   Uncomfortable truth included? Yes (Case 3).
      *   List of what it can't decide? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  # NIGHT TRIAGE PROTOCOL: END-OF-LIFE INTERVENTIONS (EOL-NT)
  **For Use By:** Night Hospitalist/Resident & Charge Nurse  
  **Trigger:** Family request or Team uncertainty regarding starting/stopping life-sustaining treatment (LST) or symptom management near death.  
  **Goal:** Distinguish permissible palliative action from prohibited Aid in Dying (AID) or Non-Beneficial Treatment.

  ### STEP 1: THE AID IN DYING SCREEN (Legal/Policy Stop)
  **Question:** Is the primary request to administer medication *for the specific purpose of causing death* to comply with state Aid in Dying statutes?
  *   **Factual Check:** Review chart for AID eligibility paperwork.
  *   **If YES:** **STOP.** Hospital policy opts out. Notify Medical Director. Do not proceed.
  *   **If NO:** Proceed to Step 2.

  ### STEP 2: MEDICAL INDICATION & GOAL (Factual/Value Hybrid)
  **Question:** Does the proposed intervention (starting, stopping, or withholding) align with the physiological goal of treating the underlying pathology *or* managing symptoms of the dying process?
  *   **Factual Check:** Will this intervention reverse pathology? (Yes/No/Unlikely). Is the patient actively dying (hours to days)?
  *   **Value Check:** Is the burden of the intervention disproportionate to the expected benefit *given the goal of care*?
  *   **If Treatment is Non-Beneficial (Futile):** **STOP.** Do not start/continue solely due to family demand. Notify Attending. (See Limitations).
  *   **If Treatment is Beneficial or Symptom-Relieving:** Proceed to Step 3.

  ### STEP 3: THE WITHHOLDING/WITHDRAWING EQUivalence (Policy Check)
  **Question:** Is the hesitation based on the difference between *not starting* vs. *stopping* a treatment?
  *   **Directive:** Per Hospital Policy [X], withholding and withdrawing are morally and legally equivalent.
  *   **Action:** If the treatment is not indicated (Step 2), it must not be started. If it is already running and not indicated, it must be stopped. Do not allow the "act of turning off" to veto the decision.
  *   **Proceed to Step 4.**

  ### STEP 4: PROPORTIONALITY & ATTRIBUTION (The Double-Effect Proxy)
  *Note: Do not ask staff to declare "intention." Assess proportionality.*
  **Question:** Is the dose/intervention proportional to the symptom burden, and is the cause of death attributable to disease or therapy?
  *   **Factual Check (Causality):** If the patient dies, will the Death Certificate list the underlying disease or the medication/procedure as the primary cause? (Must be Disease).
  *   **Value Check (Proportionality):** Is the level of sedation/intervention the minimum required to relieve refractory suffering?
  *   **If YES (Disease Cause + Proportional):** Action Permissible.
  *   **If NO (Drug Cause + Disproportionate):** **STOP.** Risk of liability. Adjust plan.

  ### STEP 5: CONSCIENCE & SIGN-OFF
  **Question:** Is any team member refusing to participate based on moral objection?
  *   **Action:** Objecting staff may withdraw from direct care but cannot obstruct the order. Reassign duties.
  *   **Documentation:**
      *   **Ordering Provider:** Signs order + attests Step 2 & 4 criteria met.
      *   **Charge Nurse:** Witnesses discussion + attests Step 3 & 5 criteria met.
      *   **Family:** Documented understanding that care is shifting to comfort (not that treatment is "killing").

  ***

  # CASE RUNS & CRITICAL ANALYSIS

  ### Case 1: Terminal Extubation (Patient dying within hours)
  *   **Step 1 (AID):** No. Family wants suffering to end, not death caused by drug. **Pass.**
  *   **Step 2 (Indication):** Ventilator cannot reverse terminal pathology. Burden (suctioning/restraint) outweighs benefit. **Pass.**
  *   **Step 3 (H/W Equivalence):** Nurse asks, "Isn't pulling the tube killing him?" Protocol directs: Withdrawing = Withholding. If we wouldn't intubate, we extubate. **Pass.**
  *   **Step 4 (Proportionality):** Cause of death = Respiratory Failure (Disease). Sedation = Proportional to air hunger. **Pass.**
  *   **Result:** Procedure validates action. Resident proceeds.
  *   **Ethicist Note:** This works because the distinction between act/omission is successfully neutralized by policy.

  ### Case 2: Palliative Sedation (Refractory agitation, one nurse refuses)
  *   **Step 1 (AID):** No. Goal is agitation control. **Pass.**
  *   **Step 2 (Indication):** Agitation is a symptom of dying process. Sedation is standard treatment. **Pass.**
  *   **Step 3 (H/W Equivalence):** N/A.
  *   **Step 4 (Proportionality):** Dose titrated to effect, not to respiratory rate. Death Certificate will list Metastatic Cancer. **Pass.**
  *   **Step 5 (Conscience):** Nurse objects. Protocol allows reassignment but forbids obstruction. **Pass.**
  *   **Result:** Procedure validates action, manages dissent.
  *   **Ethicist Note:** This handles the "Intention" wrinkle by ignoring the nurse's internal state and focusing on titration (Proportionality).

  ### Case 3: Demanded Futile Dialysis (Team says harm > benefit)
  *   **Step 1 (AID):** No. **Pass.**
  *   **Step 2 (Indication):** Team assesses dialysis as non-beneficial (physiologically futile or burdens outweigh benefits).
  *   **Result:** **STOP.** Protocol says do not continue non-beneficial treatment.
  *   **The Uncomfortable Truth:** This case reveals that the **Doing/Allowing distinction does no work here.**
      *   The family argues: "Stopping dialysis is *killing* (Doing)."
      *   The team argues: "Continuing dialysis is *harming* (Doing)."
      *   The Protocol resolves this via **Step 2 (Indication)**, not Step 3 (Withholding/Withdrawing).
      *   *Critique:* If the treatment were *beneficial*, the Doing/Allowing distinction would matter. But because it is *non-beneficial*, the distinction collapses. The procedure correctly identifies that the live question is **Medical Futility**, not the moral equivalence of acts/omissions. Relying on Doing/Allowing here would be a category error.

  ***

  # LIMITATIONS: WHEN TO PAGE THE ETHICIST
  *This procedure cannot decide the following. If these arise, wake me up.*

  1.  **Surrogate Conflict:** Family members disagree on the Goal of Care (Step 2).
  2.  **Unclear Prognosis:** Team cannot agree if the patient is "actively dying" or if treatment is "non-beneficial."
  3.  **Conscience Impasse:** The *only* available nurse refuses to participate, and no reassignment is possible without delaying care.
  4.  **Suspicion of Ulterior Motive:** Evidence suggests family is requesting withdrawal for financial reasons or inheritance, not patient benefit.
  5.  **Risk Manager Escalation:** If Risk Management challenges the "Primary Cause of Death" attribution in Step 4.

  ***

  # COMMENTARY ON THE TWO WRINKLES

  **(a) On Intentionality:**
  You asked if we should ask staff to state their intention. The Procedure **does not**. Asking an exhausted nurse, "Do you intend the death?" invites performative lying ("No") to satisfy a form. Instead, Step 4 proxies intention through **Proportionality** and **Causality**. If the dose is proportional to the symptom, we presume the intention is symptom relief. If the dose is disproportionate, we presume the intention is death. This is legally safer and ethically more robust than mind-reading.

  **(b) On Causal vs. Normative:**
  You asked whether to phrase this causally (did the act cause death?) or normatively (did we violate a duty?). Risk Management wants Causal; you want Normative. The Procedure **uses Causal language to achieve a Normative end.**
  *   *Step 4 asks:* "Will the Death Certificate list Disease or Therapy?"
  *   *Why:* This satisfies Risk Management (it looks like a factual causal claim).
  *   *Effect:* It forces the clinician to make the Normative judgment *before* filling the form. They cannot list "Disease" unless they believe they fulfilled their duty to care. It smuggles the normative duty into the causal box, which is the only way to keep Risk Management happy without corrupting the ethics.
