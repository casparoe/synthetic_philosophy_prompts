answer: |-
  Here are the desiderata any viable epistemology of thought experiments (TEs) must satisfy, designed for application to live cases rather than just post-mortems on the classics.

  ### The Desiderata

  **1. The Modal Scope Constraint**
  *   **The Case:** Galileo's falling bodies refutes Aristotle by exhibiting a *contradiction* in the theory (refutation via possibility), whereas Einstein's elevator argues for the Equivalence Principle as a *law* (establishment via necessity).
  *   **The Distinction:** A theory must distinguish between a TE that shows a theory is *inconsistent* (negative) and one that claims a theory is *true* (positive).
  *   **Live Application:** When handed a new TE, ask: "Does this claim to show that the opponent's view is impossible, or that my view is necessary?" If the TE claims to prove a positive law solely through imagination without empirical input, the burden of proof must be significantly higher than if it merely exposes an inconsistency.
  *   **Requirement:** The account must explain why TEs are epistemically potent for *destruction* (showing inconsistency) but suspect for *construction* (deriving new laws) without new data.

  **2. The Historical Expiry Condition**
  *   **The Case:** Maxwell's Demon was a devastating TE against thermodynamics in 1867; today, it is a pedagogical tool for information theory. It didn't change, but the background knowledge did.
  *   **The Distinction:** Between the internal logic of the TE and the external background theory required to run it.
  *   **Live Application:** Identify the "silent premises." If the TE relies on background assumptions (e.g., about causality, identity, or physics) that are not explicitly stated, its knowledge claim is only as stable as those assumptions.
  *   **Requirement:** The account must treat TEs as *theory-laden* operations that can lose epistemic power as background science evolves, rather than as timeless insights.

  **3. The Surplus Value Requirement**
  *   **The Case:** Why did Einstein write about chasing a light beam rather than writing down the Lorentz transformations immediately? A plain argument (Norton's view) should suffice if the TE is just an argument.
  *   **The Distinction:** Between a TE and a standard deductive argument or a computer simulation. A simulation calculates; a TE *simulates* via embodied cognition.
  *   **Live Application:** Ask: "What does the narrative/imagistic framing do that a formal syllogism does not?" If the answer is merely "rhetorical flair," the TE is epistemically idle. If the answer is "it accesses tacit knowledge," the theory must explain how.
  *   **Requirement:** The account must explain the *epistemic contribution of the narrative form*. If a TE yields knowledge a plain argument does not, the theory must identify the cognitive mechanism (e.g., pattern recognition, model manipulation) that the narrative unlocks.

  **4. The Agent-Relativity Constraint**
  *   **The Case:** For Schrödinger, the Cat TE was a *reductio* of the Copenhagen interpretation (a warning); for the community, it became a description of quantum superposition (a fact).
  *   **The Distinction:** Between the cognitive state of the *originator* (who sees the problem) and the *consumer* (who learns the lesson).
  *   **Live Application:** Determine who is running the TE. Is it the creator testing the limits of their own model, or a student being taught a settled conclusion?
  *   **Requirement:** The account must distinguish between TEs as *heuristic tools for discovery* (private, risky, generative) and TEs as *pedagogical tools for justification* (public, stabilized, didactic).

  **5. The Failure Mode Accountability**
  *   **The Case:** Searle's Chinese Room persuades many that syntax isn't semantics, yet many cognitive scientists claim it misfires by ignoring system-level processing.
  *   **The Distinction:** Between a TE that fails due to logical error and one that fails due to *psychological bias* (e.g., vividness overriding probability).
  *   **Live Application:** Check for "intuition pumping." Does the TE rely on a visceral reaction (e.g., disgust, confusion) that might bypass logical scrutiny?
  *   **Requirement:** The account must explain how TEs can generate *false confidence*. It cannot treat intuitive clarity as a guarantee of truth; it must account for the psychology of persuasion independent of validity.

  ***

  ### Analysis of the Desiderata

  **Which Requirement Does the Most Work?**
  **The Surplus Value Requirement (#3)** is the primary filter.
  It excludes the **Argument View** (Norton) immediately. If TEs are just arguments, there is no surplus; the narrative is disposable. But if the narrative is disposable, we cannot explain why scientists consistently prefer the TE format for discovery over the formal argument format. The Argument View survives only by claiming the surplus is merely psychological, not epistemic, which undermines the claim that TEs yield *knowledge* rather than *belief*.
  It also pressures the **Platonist View** (Brown). If we grasp eternal laws, why do we need a specific narrative scenario? Why not grasp the law directly? The narrative suggests a cognitive process, not a mystical gaze.

  **The Jointly Unsatisfiable Pair**
  **Timeless Epistemic Access** (from the Platonist View) and **Historical Expiry** (Desideratum #2).
  You cannot jointly hold that TEs provide a direct, a priori grasp of mind-independent universals *and* that TEs lose their validity when background empirical theory changes (as with Maxwell's Demon). If the TE accesses the "nature of heat" directly, the discovery of information theory shouldn't change the TE's verdict, only our interpretation of it. But the TE *itself* changes status from "refutation" to "illustration." A theory claiming TEs give direct access to laws cannot easily accommodate the fact that TEs age like milk, not like wine.

  **Practical Utility for Live Cases**
  To apply this tomorrow: When someone hands you a live TE (e.g., in AI ethics or quantum gravity), ignore the conclusion first.
  1.  **Check Modal Scope:** Are they proving impossibility or necessity? (Be skeptical of necessity).
  2.  **Audit Background:** What silent empirical assumptions are buried in the setup? (These are the expiry date).
  3.  **Identify Surplus:** What does the story make you feel that a logic line wouldn't? (This is where the bias or the insight hides).

  ***

  ### One-Line Verdict
  **The Argument View comes out best by default, as it alone respects the Historical Expiry without overpromising epistemic access, though it fails to explain the cognitive surplus that makes thought experiments useful.**
