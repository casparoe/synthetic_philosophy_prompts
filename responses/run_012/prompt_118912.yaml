  A municipal council must select a heating infrastructure plan for a city of one million residents to secure affordable winter warmth for the entire population. Option Alpha routes a high-pressure pipe through a single private property, causing the sole resident to develop severe, debilitating chronic neuropathy that prevents all daily activity for ten years, while providing the heating benefit to everyone. Option Beta installs a cheaper, leak-prone system across the entire city, causing every resident to develop moderate, persistent chronic headaches that are uncomfortable but allow daily function for ten years, while providing the identical heating benefit to everyone. The economic and comfort benefits of the heating are substantial enough that, under standard commensurable trade-offs, they would outweigh the moderate headaches of Option Beta, but the neuropathy in Option Alpha represents a severity of suffering widely recognized as the limit of human endurability.

  (1) **LTNU Verdicts:**
  *   **Individual-Threshold Reading:** Option Alpha is forbidden because one individual suffers at or above intensity $T$ (the neuropathy), triggering the lexical veto regardless of the heating benefits. Option Beta is permissible because no individual suffers at or above $T$ (the headaches are below threshold), so the suffering trades off against the heating benefits at the fixed finite rate; since the benefits outweigh the moderate headaches, Beta is obligatory. The choice is determinate: Choose Beta.
  *   **Aggregate-Threshold Reading:** Option Alpha is forbidden (one individual at $T$). Option Beta is also forbidden if the lexical veto applies to the *total mass* of suffering when it exceeds a critical aggregate level; given one million people suffering for ten years, the aggregate burden plausibly crosses any reasonable lexical threshold equivalent to the severity of $T$. If both options trigger the lexical veto, the theory forbids both, leaving the choice **indeterminate** (unless a secondary tie-breaking principle is supplied, which LTNU does not specify).

  (2) **Competing Theories:**
  *   **Classical Total Utilitarianism (CTU):** CTU sums all pleasure and pain. It compares one unit of severe pain against one million units of moderate pain. Unless the severe pain is infinitely worse (which CTU denies), the million moderate headaches likely outweigh the single neuropathy case in total disvalue. CTU verdict: Choose Alpha (minimize total suffering).
  *   **Pure Lexical Negative Utilitarianism (PLNU):** PLNU holds that any suffering is lexically prior to any pleasure (no threshold). Both options involve imposing suffering for pleasure, so both are prima facie forbidden. However, forced to choose between two evils, PLNU minimizes total suffering. Since one person suffering is less total suffering than one million people suffering, PLNU verdict: Choose Alpha.

  (3) **The Working Feature:**
  The single feature doing the work is the **distribution of suffering intensity across the population** (concentration vs. dispersion).
  *   **Variation:** If we vary the population size in Option Beta from one million down to one individual (suffering the same moderate headache), the Aggregate Reading no longer triggers a lexical veto (the sum is too small). Both Individual and Aggregate readings then converge on permitting Beta (assuming benefits outweigh pain). The divergence between the readings exists *only* because the population is large enough for sub-threshold pains to aggregate into a lexically significant mass.

  (4) **Escape for Aggregate-Threshold Defender:**
  To escape the indeterminacy (where both options are forbidden), a defender of the Aggregate-Threshold Reading must claim that the lexical threshold applies *only* to individual intensity peaks, not to cumulative suffering mass. However, this collapses the Aggregate Reading into the Individual Reading. To maintain a distinct Aggregate Reading while avoiding indeterminacy, they must argue that while one million headaches constitute a lexical violation, the single neuropathy does not (which contradicts the definition of $T$ as an intensity threshold), or they must introduce a secondary principle (e.g., "if both are forbidden, minimize total suffering") which effectively concedes ground to Classical Utilitarianism in hard cases.

  (5) **LTNU Collapses:**
  *   **When $T$ is set to zero:** Any amount of suffering is $\ge T$. All suffering becomes lexically prior to pleasure. LTNU collapses into **Pure Negative Utilitarianism** (no pleasure justifies any pain).
  *   **When $T$ is set to infinity:** No amount of suffering is $\ge T$. All suffering remains below the threshold and is fully commensurable with pleasure. LTNU collapses into **Classical Total Utilitarianism** (all goods and bads trade off at finite rates).

  **Flagged Open Choice:** My analysis of the Aggregate-Threshold Reading assumes that "suffering aggregated across individuals" implies a lexical veto triggers when the *sum total* of suffering exceeds a certain mass. You left open precisely how aggregation triggers the threshold (e.g., sum of intensity vs. sum of disvalue); if the aggregate threshold is set exceptionally high, Option Beta might not trigger it, making the choice determinate even on the Aggregate Reading. I have assumed a plausible threshold where one million person-years of pain crosses it.
