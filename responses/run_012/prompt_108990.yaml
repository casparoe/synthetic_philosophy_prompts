      *   *Issue 2: The Explanation.* Distinct Faculty (A) vs. Temporal Dynamics of Desire (B).
      *   *Issue 3: The "Mistake" (User's Hunch).* This is crucial. Can Person B explain regret? If at $T_2$ I prefer $Y$, why do I regret it at $T_3$? Person A says: Because the Will failed the Judgment. Person B says: Because our discounting curve stabilized, and we now view $T_2$ preference as an anomaly.
      *   *Refining the Crux:* The user suspects the crux is about judging past choices as mistakes. I need to validate this. Yes, this is the "normative" vs. "descriptive" gap. Person A needs a stable standard (Judgment). Person B has shifting standards. How does B explain *stable* regret?
      *   *The Test:* The "Pre-commitment" case is the classic test. Ulysses and the Sirens.
      *   *Predictions:*
          *   A: Pre-commitment supports the Will's strategy to bind itself.
          *   B: Pre-commitment is just satisfying a higher-order preference to manipulate future incentives.
          *   *Wait, that's not divergent enough.* Let's look for a case where the *feeling* of effort matters. The "Last Minute Rescue."
          *   *Better Test:* The "Effortful Resistance" case. If I struggle and fail vs. struggle and succeed.
          *   *Best Test for the "Mistake" Hunch:* The "Sober Reflection" case. Why do we call it a failure *after* the desire for the cake is gone?
          *   *Let's go with the User's Hunch:* The "Retrospective Endorsement" test.

  5.  **Addressing the Verbal Dispute:**
      *   Is "Will" just a word for "Highest Order Preference"?
