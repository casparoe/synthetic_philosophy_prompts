prompt: |-
  ok so for my school philosophy club I have to write up a joint statement that two people who've been arguing all year could both actually sign. here's the fight. one of them thinks weakness of will is real: you genuinely intend to do the thing and then you just dont do it, and that this points to the will being its own separate power that can fail all on its own. the other thinks thats a fiction, and whats really going on is just that our future preferences get discounted hyperbolicaly, so at the moment of choice the later reward shrinks and you dont need any extra "will" to explain anything.

  write me the doc. I want a numbered list of claims both would sign (about the behavior being real, what the evidence actually shows, whats not even in dispute), then a table of where they still disagree, with each sides view worded so that side would accept the wording. for each disagreement give me the crux, and something both would agree is a fair test or case, with each sides prediction written down before we run it. i have a hunch the real crux is whether the discounting story can even make sense of a person judging their own past choice as a mistake, but see if you agree. and if part of their fight is just about words, call it out and say which part.
