      *   This is partly verbal (what do we call the mechanism) but partly metaphysical (is there a distinct faculty?). I should highlight the definition of "Intention."

  6.  **Refining the Output (incorporating the User's Hunch):**
      *   The user thinks the crux is whether discounting explains *judging past choices as mistakes*.
