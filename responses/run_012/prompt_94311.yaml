answer: |-
  Jeremy Bentham's unpublished manuscript *Offences Against One's Self: Paederasty* (c. 1785) is a radical application of the principle of utility to sexual morality. His core thesis is that sexual pleasure is a good *qua* pleasure, that the law should not interfere with self-regarding actions where consent is present and no external harm occurs, and that legal prohibitions based merely on "ungrounded antipathy" are tyrannical. When extended to modern controversies, Bentham's utilitarianism yields verdicts that are often more permissive than current law, yet occasionally more intrusive than liberal orthodoxy.

  ### I. Three Controversies: Verdicts and Commitments

  **1. *R v Brown* (1993) and Consensual Sadomasochism**
  In *Brown*, the House of Lords held that consent is no defense to charges of assault occasioning actual bodily harm during sadomasochistic acts. The court prioritized the protection of public health and morality over individual autonomy.
  *   **Bentham's Verdict:** Decriminalization. Consent should be a complete defense.
  *   **The Commitments:** This flows from Bentham's distinction between **self-regarding and other-regarding actions**. If all participants consent, the "harm" is arguably a misnomer; it is a sought-after sensation integrated into a pleasurable experience. Punishing these acts creates definite pain (imprisonment, stigma) without preventing any "primary mischief" (non-consensual harm). Bentham's **anti-asceticism** dictates that the pleasure derived from the act counts positively in the calculus. Unless there is evidence of long-term incapacity or non-consensual escalation (which would be separate offenses), the state inflicts a greater sum of pain by prosecuting than by permitting.

  **2. Commercial Sex and Enforceable Contracts**
  Most jurisdictions legalize prostitution to varying degrees but refuse to enforce contracts for sexual services, viewing them as void against public policy.
  *   **Bentham's Verdict:** Legalization, regulation, and enforceability of contracts.
  *   **The Commitments:** This relies on Bentham's commitment to **Security and Expectation**. For Bentham, law's primary function is to create security so individuals can plan their lives. If a sex worker performs a service and is not paid, the law currently offers them no recourse, creating insecurity and potential for violence. Enforcing contracts maximizes utility by ensuring payment (pleasure/security for the worker) and service (pleasure for the client), while regulation reduces secondary pains (disease, coercion). Bentham treats sex as a service like any other; to deny enforceability is to introduce unnecessary economic pain and instability into a consensual exchange.

  **3. State-Funded Sexual Assistance for Disabilities**
  Proposals exist for state health services to fund "sexual surrogates" for those with severe physical or cognitive disabilities who cannot otherwise access sexual intimacy.
  *   **Bentham's Verdict:** Strong support for state funding and arrangement.
  *   **The Commitments:** This is driven by **Hedonic Egalitarianism**. In the utilitarian calculus, "everybody to count for one, nobody for more than one." The sexual pleasure of a disabled person weighs equally with that of an able-bodied person. If the disabled person suffers a deficit of pleasure due to their condition, and the state can alleviate this at a relatively low fiscal cost (minor pain to taxpayers) for a high return in individual utility (intense pleasure/relief for the disabled), the principle of utility mandates provision. This moves beyond negative liberty (freedom from interference) to **positive welfare**.

  ### II. The Problem of Third-Party Disgust

  The most significant pressure point in Bentham's framework is the "pain" felt by observers who are disgusted by the acts they know are occurring. In the *Paederasty* essay, Bentham anticipates this: if the community feels alarm or disgust, does that not enter the hedonic calculus as pain?

  If Bentham counts the pain of moral disgust as equivalent to physical pain, his argument against criminalizing same-sex acts (and by extension, *Brown* or sex work) collapses. A majority's intense disgust could theoretically outweigh the minority's sexual pleasure.

  Bentham saves his argument by distinguishing between **pain of apprehension** (fear of real danger) and **pain of antipathy** (mere dislike based on prejudice). He argues that the law should not cater to the latter. To do so would be to govern by the "principle of sympathy and antipathy" rather than utility. He contends that the pain of disgust is often founded on error (false beliefs about harm) and is therefore illegitimate in the legislative calculus. Furthermore, he argues the pain of punishment inflicted on the actor is far more certain and severe than the vague unease felt by the observer.

  However, if one presses the framework strictly, utilitarianism is theoretically vulnerable to the "tyranny of the majority." If the disgust is genuine and intense, a strict act-utilitarian might have to concede criminalization. Bentham avoids this by asserting a **rule-utilitarian** constraint: a legal system that validates prejudice as a ground for pain ultimately creates more insecurity and suffering for everyone in the long run. Thus, the argument survives, but only by categorizing certain types of "pain" (prejudicial disgust) as legally irrelevant.

  ### III. Divergence from Contemporary Liberal Orthodoxy

  Contemporary liberal orthodoxy on sex is largely Millian: it emphasizes autonomy, consent, and negative rights (freedom from state interference). Bentham's hedonic egalitarianism pushes him away from this consensus in two critical ways:

  **1. The Commodification of Intimacy (Contracts)**
  Liberals often resist enforcing sex work contracts, fearing that commodifying sex degrades human dignity or reinforces objectification, even if consensual. Bentham has no such deontological qualms. For him, a contract is a tool to maximize security and pleasure.
  *   **Evaluation:** Here, the consensus may be right to hesitate. Bentham's view risks reducing intimate human interaction to mere transaction, potentially ignoring structural coercion that formal "consent" masks. However, the liberal refusal to enforce contracts often leaves sex workers vulnerable to exploitation. Bentham's coherence on security highlights a hypocrisy in the liberal position: if sex work is legal, why deny workers the legal protections afforded to other laborers?

  **2. Sex as a Positive Right (Disability)**
  Liberalism generally views sex as a private liberty, not a public entitlement. The idea of the state arranging sex strikes many liberals as intrusive or paternalistic. Bentham's welfare utilitarianism sees it as a logical obligation.
  *   **Evaluation:** This divergence tells in Bentham's favor regarding consistency. The liberal consensus often champions sexual freedom while ignoring those physically barred from exercising it. Bentham exposes the limitation of negative liberty: freedom to have sex is meaningless without the capacity to do so. If the state funds healthcare to extend life, Bentham asks, why not fund services to make that life pleasurable?

  **Conclusion**
  Bentham's framework delivers verdicts that are more coherent than current law, particularly regarding *Brown* and disability rights. It exposes the "ungrounded antipathy" still present in legal distinctions between acceptable and unacceptable consensual harm. However, his divergence from liberal orthodoxy on contracts and state provision reveals the potential coldness of the hedonic calculus: it risks instrumentalizing the body and ignoring the symbolic value of dignity.

  Ultimately, the divergence tells more against the **consensus** than against Bentham. The contemporary liberal view is often a patchwork of utilitarian reasoning mixed with unacknowledged moralistic residues (e.g., protecting "public morality" in *Brown* or stigmatizing sex work contracts). Bentham's ruthlessness in pursuing the greatest happiness forces a clarity that the consensus lacks. While his reduction of sex to pleasure may seem thin, his insistence that the law must justify interference with tangible harm rather than abstract offense remains the strongest defense of sexual liberty available.
