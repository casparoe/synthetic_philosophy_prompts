  # Joint Statement on Bargaining Solution Concepts
  **From:** The Cooperative Game Theory Reading Group
  **To:** The Members (Specifically: The Nash Person, The Monotonicity Person, and Priya)
  **Subject:** Clarifying the Deadlock on Two-Person Bargaining Solutions

  We, the undersigned, acknowledge that our three-month deadlock stems not from computational errors or ignorance of the literature, but from a fundamental divergence in normative priors regarding what a bargaining solution *is*. We agree that the Nash Bargaining Solution (NBS) and the Kalai–Smorodinsky Solution (KSBS) are the only two serious contenders. This document maps our agreement, isolates our disagreement, and specifies the empirical or conceptual tests required to break the tie.

  We utilize the **River Case** as our canonical example throughout:
  *   **Players:** Town A and Town B.
  *   **Disagreement Point ($d$):** $(0,0)$ (No water, no compensation).
  *   **Feasible Set ($S_0$):** The convex hull of $(0,0)$, $(1,0)$, $(0,1)$, and $(0.6, 0.8)$.
  *   **Geometry:** The Pareto frontier is kinked at $(0.6, 0.8)$. The segment from the kink to $(1,0)$ has slope $-2$. The segment from $(0,1)$ to the kink has slope $-1/3$.

  ### 1. Agreed Claims
  We both sign onto the following substantive claims. These are not trivialities; they define the boundaries of our debate.

  1.  **Exhaustiveness of Inputs:** Both solutions rely *exclusively* on the Feasible Set ($S$) and the Disagreement Point ($d$). Any normative factor not encoded in the geometry of $S$ or the location of $d$ (e.g., "need," "historical entitlement," "desert") is explicitly excluded by both axiomatic systems. If we want to include those, we must change $d$ or $S$ before applying the solution, not tweak the solution itself.
  2.  **The Geometric Crux:** The disagreement is not about Pareto Optimality or Scale Invariance (both satisfy these). The disagreement is geometric:
      *   **NBS** selects the point where a rectangular hyperbola ($xy = k$) is tangent to the Pareto frontier. It privileges the *local curvature* of the frontier.
      *   **KSBS** selects the intersection of the Pareto frontier and the line segment connecting $d$ to the **Utopia Point** (the vector of individual maximums). It privileges the *global bounds* of the set.
  3.  **Normalization Does Not Resolve It:** Shifting $d$ to $(0,0)$ and scaling the Utopia to $(1,1)$ makes the KSBS the point of equal relative gain ($x=y$). It does *not* make the NBS the point of equal relative gain unless the frontier is symmetric. Therefore, the disagreement survives normalization. The NBS on the River Case is $(0.6, 0.8)$; the KSBS is $(2/3, 2/3) \approx (0.67, 0.67)$. They are distinct points.
  4.  **Axiomatic Incompatibility:** We agree that no solution can satisfy **Independence of Irrelevant Alternatives (IIA)** and **Individual Monotonicity** simultaneously (given Pareto Optimality and Scale Invariance). We are forced to choose which axiom to drop.
  5.  **The "Power" Interpretation:** We agree that both solutions model "bargaining power," but differently:
      *   In **NBS**, power is endogenous to the *trade-off rate* (how much B must give up to help A).
      *   In **KSBS**, power is exogenous to the *potential* (how much A *could* get if B got nothing).

  ### 2. Case Variants and Reactions
  We apply the two requested variants to the River Case ($S_0$) to test our intuitions.

  | Variant | Description | Nash Solution (NBS) | Kalai–Smorodinsky (KSBS) | Evaluation of Reaction |
  | :--- | :--- | :--- | :--- | :--- |
  | **Base Case** | $S_0$ as defined above. | **$(0.6, 0.8)$**<br>(The Kink) | **$(0.67, 0.67)$**<br>(Equal Relative Gain) | **Nash:** Reflects the local trade-off slope.<br>**KS:** Reflects the symmetric potential $(1,1)$. |
  | **Variant 1**<br>*(Monotonicity Test)* | Add option **$(0, 1.2)$**.<br>Town B's max payoff rises. Town A's max stays at 1. | **$(0.6, 0.8)$**<br>(Unchanged) | **$(0.625, 0.75)$**<br>(Town A *loses* 0.04) | **Nash:** Passes IIA. The local trade-off near the solution didn't change, so the deal shouldn't.<br>**KS:** Fails Monotonicity. Town A is punished for Town B's improved outside potential, even though A's own potential is unchanged. |
  | **Variant 2**<br>*(IIA Test)* | Add option **$(-0.5, -0.5)$**.<br>A "threat" or option strictly worse than disagreement. Neither town wants it. | **$(0.6, 0.8)$**<br>(Unchanged) | **$(0.67, 0.67)$**<br>(Unchanged) | **Nash:** "This proves IIA works. Irrelevant noise doesn't shift the solution."<br>**KS:** "This proves the axiom is vacuous here. The fight is about *feasible* options that *are* chosen in other contexts, not dominated ones." |

  *Note on Variant 2:* We acknowledge that adding a dominated option changes neither solution mathematically. However, this variant exposes a verbal dispute (see Section 4). If the "unwanted option" were a *legal claim* that reshapes the feasible set without being physically reachable (e.g., a regulatory cap), the Nash Person treats it as irrelevant if it doesn't bind, while the Monotonicity Person argues it defines the "Utopia" and thus the fair share.

  ### 3. Residual Disagreements
  We cannot sign onto a single solution yet. The table below captures our remaining divergence, phrased charitably.

  | Issue | The Nash Person's Position | The Monotonicity Person's Position |
  | :--- | :--- | :--- |
  | **The Normative Core** | **Stability.** A solution should not change if you remove options nobody was going to pick anyway. If the deal changes when I add a "phantom" option, the solution is sensitive to noise and manipulable by agenda-setting. | **Fairness of Claims.** A solution should respect the *proportionality of potential*. If my best-case scenario improves, my claim on the surplus should not weaken. Punishing a player for having better alternatives is perverse. |
  | **Interpretation of Variant 1** | Town A's loss in KS is acceptable. Town B's improved potential changes the *bargaining range*. The "fair" split depends on the shape of the whole set, not just A's local max. | Town A's loss in KS is indefensible. A's leverage against B hasn't changed. B just has more room to move. A solution that makes A worse off when B gets richer violates basic equity. |
  | **Bargaining Power** | Power is the **ability to hurt the other**. It is encoded in the slope of the frontier (marginal rate of substitution). NBS captures this; KS ignores local trade-offs. | Power is the **ability to do well alone**. It is encoded in the distance to the Utopia. KS captures this; NBS allows the frontier's curvature (which might be arbitrary) to dictate power. |
  | **Axiomatic Priority** | **IIA is non-negotiable.** Without it, you are just picking a point by taste. IIA provides the only rigorous link between "rational choice" and "bargaining." | **Monotonicity is non-negotiable.** Without it, the solution can be manipulated by expanding the set in ways that harm a player without improving anyone else's actual payoff. |

  ### 4. The Cruxes
  To break the deadlock, we propose two specific tests. We record our predictions now to prevent post-hoc rationalization.

  **Crux 1: The "Irrelevant" Expansion**
  *   **The Case:** A scenario where adding a feasible option *far* from the current solution shifts the NBS but leaves the KSBS unchanged (or vice versa).
  *   **The Question:** Is it more unfair to change the agreement because a distant, unchosen option became available (NBS behavior), or to keep the agreement fixed when the *ideal* point has shifted (KS behavior)?
  *   **Nash Prediction:** Changing the agreement based on distant options is rational; it reflects a change in the *structure* of cooperation.
  *   **Monotonicity Prediction:** Changing the agreement based on distant options is unstable; the local trade-off is what matters for the current deal.
  *   **Deciding Factor:** If we view the "Feasible Set" as a description of *physical possibilities*, NBS is robust. If we view it as a description of *legal claims*, KS is more robust (as legal claims define the Utopia).

  **Crux 2: Bargaining Power as Curvature vs. Range**
  *   **The Case:** A set where Town A has a very high Utopia (100) but the frontier is extremely steep near the solution (A gains little without B losing much).
  *   **The Question:** Does A deserve a large share because they *could* have gotten 100 (KS), or a small share because extracting value from B is "expensive" (NBS)?
  *   **Nash Prediction:** A should get less. The "cost" of satisfying A is too high. Efficiency dictates the split.
  *   **Monotonicity Prediction:** A should get more. Their potential contribution to the joint maximum is higher.
  *   **Deciding Factor:** We must agree on whether "bargaining power" is a measure of *threat advantage* (Nash) or *contribution potential* (KS).

  ### 5. Note on Priya's Suggestion (Averaging)
  Priya has suggested averaging the NBS and KSBS points (e.g., in the Base Case, splitting the difference between $(0.6, 0.8)$ and $(0.67, 0.67)$). We agree this is a **bad idea** for the following reasons:

  1.  **Violation of Scale Invariance:** Both NBS and KSBS are scale-invariant (the solution doesn't change if we measure water in gallons vs. liters). The *average* of two scale-invariant points is **not** scale-invariant unless the scaling factors are identical for both players. If we rescale Town B's utility, the NBS shifts, the KSBS shifts, and their average shifts *non-linearly*. The solution becomes dependent on the arbitrary units of measurement.
  2.  **Axiomatic Homelessness:** The average satisfies neither IIA nor Monotonicity. It inherits the worst instability of both: it can punish a player for improved alternatives (from KS) *and* shift due to irrelevant alternatives (from NBS), without a coherent normative story for why the 50/50 weight is justified.
  3.  **No Normative Story:** NBS has "rational stability." KS has "proportional fairness." The Average has "compromise between methods," which is not a theory of justice.

  ### 6. Verbal Disputes vs. Real Disagreement
  We suspect part of our deadlock is verbal. We isolate it here:

  *   **The "Feasible Set" Dispute:**
      *   *Verbal:* When we say "Feasible Set," the Nash Person means "Physically/Technologically Possible." The Monotonicity Person often means "Legally/Politically Claimable."
      *   *Resolution:* If we define $S$ strictly as physically possible outcomes, Variant 2 (the unwanted option) drops out of the model entirely. If we define $S$ as claims, the Utopia point becomes a political construct. **We agree to define $S$ as Physically Possible** for the sake of the model, acknowledging this biases the result toward Nash.
  *   **The "Fairness" Dispute:**
      *   *Verbal:* "Fair" means "Stable" to the Nash Person. "Fair" means "Proportional" to the Monotonicity Person.
      *   *Resolution:* This is not verbal; it is normative. We cannot define this away.
  *   **Remaining Disagreement:** Once we strip out the definition of $S$ and the units of utility, the disagreement remains: **Do we prioritize the stability of the agreement against irrelevant expansions (Nash), or the immunity of a player's share against the other player's potential improvements (KS)?**

  **Next Step:** We will vote on Crux 2 (Curvature vs. Range) using a modified River Case where Town A's Utopia is 10 but the marginal cost of A's gain is high. If we cannot agree there, we will adopt the Nash Solution for its mathematical tractability, but append a "Monotonicity Warning" to any policy recommendation derived from it.

  **Signed:**
  The Nash Person
  The Monotonicity Person
