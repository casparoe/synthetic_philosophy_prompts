prompt: |-
  I'm TAing a first-year seminar and I've got one fifty-minute section on Dennett's line that the self is a centre of narrative gravity. Dont explain the view to me -- plan how I should teach it. What has to be in place first so it dosn't collapse straight into 'so the self isn't real', which single carrying example should do the heavy lifting and what it has to get right (I'd like to try a murmuration of starlings instead of the centre-of-mass-of-an-object one everyone reaches for -- does that actually hold up, or does it smuggle something in?), the misconceptions they'll arrive with or form and the exact point in the sequence where I head each one off, one question at the end that tells me whether they've actually got it, and what I should openly refuse to explain at this level.
