      *   Deep metaphysics of abstract objects (Quine/etc.).

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Refining the Murmuration:* The user wants to use it. I need to tell them how to make it work. The flock = neural activity/behavior. The "shape" or "direction" = the narrative. The "Center" = the Self. The risk is students thinking the Self is the *flock*. I must emphasize the *gravity* part. The birds react to the *shape* of the flock. We react to the *idea* of our self.
