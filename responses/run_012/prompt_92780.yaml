answer: |-
  Here is a 50-minute teaching plan designed to land Dennett's view without triggering the "nothing is real" nihilism spiral.

  ### 1. Prerequisites: What must be in place first
  Before you introduce the "Center of Narrative Gravity" (CoNG), two conceptual anchors must be secured, or the view will slide into eliminativism immediately.

  *   **The Cartesian Theater must be dismantled first.** Students cannot accept the self is an abstraction if they still intuitively believe there is a "little man" inside their head watching their eyes. You need 5 minutes at the start to confirm they understand Dennett rejects the idea of a *concrete* locus of consciousness.
  *   **A non-physicalist definition of "Real."** You must establish that "real" does not exclusively mean "made of atoms." If their ontology is binary (Physical = Real, Abstract = Fake), Dennett is dead on arrival. Briefly establish that *institutions* (money, marriage, borders) are real, have causal power, but are not physical objects.

  ### 2. The Analogy: Murmuration vs. Center of Mass
  **Does the murmuration hold up?**
  Yes, but it is dangerous.
  *   **The Risk:** It smuggles in **emergence** in a way that suggests the Self is the *flock* (the collection of neural states). Dennett's point is that the Self is not the collection; it is the *abstract point* around which the collection organizes. If you use the murmuration, students will think "Oh, I am the brain activity." That is not Dennett; that is identity theory.
  *   **The Fix:** Use the murmuration to illustrate the *neural activity* (the birds), but explicitly map the **Center of Gravity of the flock** to the **Self**.
  *   **Why this works:** A murmuration has a shape and a direction. You can predict where the flock goes by tracking its "center." That center has no bird in it. It has no mass. But if you ignore it, you cannot predict the flock. If you attack the center, you miss. It is a real, causal abstraction.
  *   **Instruction:** Draw the flock on the board. Mark the empty space in the middle. Label the birds "Neural Events/Utterances." Label the empty space "The Self."

  ### 3. Sequence and Misconception Interdiction
  Here is the minute-by-minute flow with specific "trap doors" where you must intervene.

  **0:00–0:10: Setup (The Cartesian Theater)**
  *   **Activity:** Ask: "When you make a decision, where does it happen?"
  *   **Goal:** Get them to admit they feel like there is a "decider" behind their eyes.
  *   **Intervention:** If anyone says "It's just my brain," push back: "Do you mean the *whole* brain? Or a specific spot where it all comes together?" Secure the intuition that we feel like there is a *single point* of ownership.

  **0:10–0:25: The Analogy (Murmuration/CoG)**
  *   **Activity:** Show a video of a murmuration. Draw the CoG on the board.
  *   **The Move:** Explain that the CoG is real (planes avoid it, physicists calculate it) but ontologically thin (no particle lives there).
  *   **Misconception Alert (0:18):** Students will say, "So the center is fake."
  *   **Head it off:** **Do not let this pass.** Stop immediately. Say: "Fake implies it has no effect. Does gravity stop working if the center of mass is an abstraction? No. It is *ontologically subjective* but *causally objective*." Use the "Border" example: A border is a fiction, but if you cross it, soldiers will shoot you. It is real *because* we treat it as real.

  **0:25–0:40: Applying to Narrative**
  *   **Activity:** Connect the CoG to *storytelling*. The "birds" are our actions, words, and memories. The "Center" is the character we write ourselves as.
  *   **The Move:** We tell stories about ourselves ("I am the kind of person who..."). This story creates a locus of gravity. Future actions are pulled toward that center to maintain coherence.
  *   **Misconception Alert (0:32):** The Homunculus Return. Students will ask: "Who is telling the story? If there's no self, who is the narrator?"
  *   **Head it off:** "The narrative tells itself." Explain that the brain produces drafts of stories. The ones that win out create the illusion of a narrator. The narrator is the *byproduct*, not the *producer*. Do not let them posit a "sub-conscious self" to do the writing.

  **0:40–0:45: The "So I'm not Real" Collapse**
  *   **Activity:** Open floor for reactions.
  *   **Misconception Alert:** "So I don't exist?" / "So responsibility is fake?"
  *   **Head it off:** This is the most critical minute. You must distinguish **Eliminativism** (The self is a delusion) from **Abstractivism** (The self is a useful fiction).
  *   **Script:** "Dennett is not saying you should jump off a cliff because you aren't real. He is saying you are real *in the way a novel's protagonist is real.* If Harry Potter steps on a mine, he dies in the story. You are the protagonist of your biography. To kill the protagonist is to end the book. That is very real."

  **0:45–0:50: Assessment**
  *   **Activity:** The Exit Ticket.

  ### 4. The One Question (Assessment)
  Do not ask "What is the Center of Narrative Gravity?" (They can memorize that). Do not ask "Is the self real?" (Too binary).

  **Ask this:**
  > "If a robot was programmed to tell a consistent story about its own past actions to predict its future behavior, and it used that story to apologize for errors, would Dennett say it has a Self? Why or why not?"

  *   **Correct Answer:** Yes. Because the "self" is the functional role of the center of gravity created by the narrative, not the biological substrate.
  *   **Incorrect Answer (Eliminativist):** No, because it's a robot/not human.
  *   **Incorrect Answer (Cartesian):** No, because it doesn't have a soul/inner feeler.
  *   **Incorrect Answer (Confused):** Yes, but it's fake. (They must grasp that "fictional" does not mean "causally inert").

  ### 5. What to Openly Refuse to Explain
  You have 50 minutes. If you drift into these, you will lose the thread. Explicitly tell the class: *"We are not tackling these today."*

  1.  **The Hard Problem of Consciousness:** Do not let them ask "But what does it *feel* like?" Dennett's view dissolves the hard problem; arguing about qualia here will consume the whole section.
  2.  **Heterophenomenology:** Do not explain the methodology of treating subjects as fictional characters. It's too meta for a first-year intro.
  3.  **The Neuroscience of the "Multiple Drafts":** Do not get into the specific neural mechanisms of how the drafts compete. Keep it at the level of *behavior and narrative*.
  4.  **Moral Responsibility Deep-Dive:** If they ask "Does this mean criminals aren't responsible?", acknowledge it's a consequence but refuse to solve free will in the last 5 minutes. Stick to the ontology of the self.

  ### Summary Checklist for the TA
  *   [ ] **Anchor:** Establish "Real ≠ Physical" (Money/Borders) before starting.
  *   [ ] **Analogy:** Use Murmuration for the *brain*, CoG for the *self*.
  *   [ ] **Intervention:** Smash the "Fake = No Causal Power" error at minute 18.
  *   [ ] **Intervention:** Block the "Who is the narrator?" question at minute 32.
  *   [ ] **Exit:** Use the Robot Question to test Abstractivism vs. Eliminativism.
