      *   *10-25:* The Analogy (Murmuration vs. CoM).
      *   *25-40:* Application to Narrative (How stories create the center).
      *   *40-45:* Misconception Check/Correction.
      *   *45-50:* Assessment Question.

  6.  **Misconceptions & Interventions:**
      *   *Misconception 1:* "If it's a fiction, it's a lie/delusion." -> *Intervention:* Distinguish "fiction" from "false." Sherlock Holmes is fictional, but the *concept* has real effects.
      *   *Misconception 2:* "So I don't exist." -> *Intervention:* Distinguish "concrete entity" vs. "abstract object."
      *   *Misconception 3:* "Who is telling the narrative?" (Homunculus return). -> *Intervention:* The narrative tells itself; the center is a byproduct.

  7.  **The "What Not to Explain":**
      *   Heterophenomenology (too technical).
