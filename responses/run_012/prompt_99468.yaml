answer: |-
  **Notes on the Argument**

  1.  **Potential vs. Actual Infinity:** The guest represents the Aristotelian finitist view: infinity is a potential process ($\lim_{n \to \infty}$), never a completed object. She argues you cannot shift guests ($n \to n+1$) because there is no final guest to start the chain, and you cannot shift them all simultaneously because "all" implies a finished set that doesn't exist.
  2.  **The Clerk's Cardinality:** The clerk operates on Cantor's actual infinity ($\aleph_0$). The set of guests is a completed whole; the mapping is a timeless bijection. Time is irrelevant to the logic of the set.
  3.  **The Diagonal Shadow:** In the final stanza, the arrival of a "crowd" hints at uncountable infinities ($\mathfrak{c}$). Unlike the single guest, this crowd cannot be listed or shuffled into the countable rooms, foreshadowing that some infinities are strictly larger than others.
  4.  **Form as Function:** The sestina's rotating end-words mimic the hotel's shift: the same elements (words) occupy different positions (lines) without anything entering or leaving the set, until the coda breaks the cycle without resolving it.

  ***

  The corridor extends beyond the last **room**,
  occupied by a permanent **guest**.
  I trace the ledger, every **number**
  alive, knowing there is space for **more**,
  provided I can make them **move**
  not in time, but as a completed **whole**.

  She argues you cannot grasp the **whole**
  inside a key, or bind it to a **room**.
  To her, infinity will not **move**
  like luggage carried by a tired **guest**;
  it is a rule promising **more**,
  a sequence never yielding a final **number**.

  She points to her key, claims her **number**
  is the limit of what can be **whole**.
  To shift the line requires there be **more**
  than time allows to fill the **room**.
  She is not a confused **guest**,
  she says the sequence cannot **move**.

  I tell her watch the labels **move**,
  independent of the **number**.
  She is merely one **guest**,
  a subset of the **whole**.
  There is no empty **room**,
  only making space for the **more**.

  There is always **more**
  space if the labels **move**.
  She stands before the **room**,
  rejecting the logic of the **number**.
  She wants a finished **whole**,
  or nothing. She is the **guest**.

  She warns me of a heavier **guest**,
  one who brings a crowd of **more**,
  a mass exceeding the **whole**
  no matter how I make them **move**.
  The list defies the **number**,
  and shadows lengthen in the **room**.

  The **room** remains, the **guest** remains.
  The **number** counts the **whole**, finds **more**.
  We **move** nowhere.
