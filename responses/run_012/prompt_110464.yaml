prompt: |-
  Hey so I'm a junior and for my philosophy club's independent project I got paired with this guy Devon and we've been arguing for like three weeks now about whether a morally rotten work of art can still be a great work of art, and at this point I'm pretty sure we're just talking past each other. My position is that the two ledgers are seperate: if the cinematography is gorgeous, the performances are incredible, the structure is airtight, that's what makes it good art, and if the story also has a mean streak or tries to get you to root for someone horrible, fine, that's a real strike against it morally, but it doesn't touch the artistic score. Devon thinks thats basically a dodge. He says the moral rot is inside the work, not off to the side of it, so its an artistic defect full stop, and a film can't be a great film if it's rotten in that way, no matter how good the craft is. I kind of get where he's coming from and he kind of gets where I'm coming from and we've definately both moved a little, but every time we try to write down what we actually disagree about it comes out sounding either fake or like we're strawmanning each other.

  My teacher says we should stop debating and instead write the document we should have written a month ago. So what I want from you is the joint statement that me and Devon could both actually sign. Start with the claims we can both accept, as a numbered list -- stuff about what makes a work good or bad, about the difference between what a work says and what it makes its audience do, about what we're both willing to say about the artist's own life and behavior outside the work (I think we both think that's a seperate question from the work's value, but I might be wrong about him, so if we don't actually agree there, don't fake it, put it in the disagreements instead). Then I want the disagreements themselves, each one written in wording that the person who holds that side would accept as fair, not a version softened toward the middle. Then the cruxes -- the smaller questions where if you settled them, one of us would actually have to change our mind. And for each crux, a case or an argument that we'd BOTH agree is relevant to it, with each of our predictions written down in advance, before anyone gets to argue about the outcome.

  A few things. First, don't just give me the textbook versions of these two views, because we've both read the same stuff everyone reads and it's not helping. The actual sticking point seems to be about whether a work having a bad attitude is the same kind of thing as a work having a bad ending, and about whether artistic value is one single score or a bunch of different scores (craft, insight, how it treats its subject) that can come apart -- if it's the second one, I have a suspicion a lot of our fight is really just a fight about words, so tell me straight if that's the case and which part is verbal. Second, I want the cruxes to actually be about our cases, so here are three we keep coming back to: a movie that's technically amazing but is basically engineered so you cheer for a guy doing something terrible; a novel with beautiful prose whose narrator keeps expressing contempt for a whole group of people, where the author never signals that the narrator is wrong; and a case where the ugliness honestly seems to be where the power comes from, like the work would be weaker if it were nicer. Third, please write it in American English, and don't bother naming philosophers or giving me a reading list, my club advisor said she can point me at sources later and I'd rather have the arguments themselves than a bunch of names I can't check. Also, keep it something I could actually hand to Devon without him feeling like I wrote his half for him.
