prompt: |-
  Me and a couple friends in philosophy club got into a fight about open-mindedness vs. having conviction, and one of them brought up something he called the dogmatism paradox (he couldn't remember who came up with it, just that it's a paradox about knowledge and evidence, and that it's not the same as just being a stubborn person). The way he explained it: if you genuinely know something, then any evidence that shows up against it has to be misleading evidence, because if you know it then it can't be false, so anything pointing the other way must be pointing the wrong way. And from that he concluded that once you know something you're basically entitled to wave off whatever anybody says against it, because by definition whatever they say has to be misleading, and so the more you know the more closed-minded you get to be. That seems totally backwards to me, and I can't tell if the lesson is supposed to be that knowledge is actually a bad thing that we should want less of, or that the whole concept of knowledge is inconsistent the way the liar paradox is, or what.

  My actual question is this: if knowing something really does licence you to ignore all the evidence against it, then how is science even possible? Like, suppose a scientist knows her theory is right, and then a new experiment comes out that contradicts it — isn't she rationally required to just dismiss the experiment as misleading and keep believing her theory? And if that's right, doesn't it mean the honest thing is to stop saying you know things and instead just say you believe them really strongly, so you stay open to the evidence? We're doing a unit on knowledge and skepticism in my intro philosophy elective (we did Descartes and the cave and now this) and I'm definately missing something, cause my teacher said I was "running several things together" but then the bell rang. Also sorry this is alot of questions, you can just tell me which parts are confused.
