      *   **The Trap:** Why it looks like conditional expectation (algebraic similarity).
      *   **The Crack:** Failure of the Martingale Property ($E_P[\text{Posterior}] \neq \text{Prior}$).
      *   **The Cost:** The theorem doesn't generalize. JC agents can disagree.
      *   **The Repair:** Endogenize evidence (makes it standard conditionalization).
