answer: |-
  1. You argue essences exclude the single-storey 'a'. But without a shared core, what prevents a circle from qualifying?
     *Note: A defensive answer will appeal vaguely to 'tradition' without explaining the boundary.*
     **Follow-up (if he claims context decides):** If context decides, does an isolated single-storey 'a' cease to be an 'a'?

  2. You deny a style-neutral core. So when your system varies style, what exactly is being varied?
     *Note: A defensive answer will list technical parameters without addressing their philosophical status.*

  3. Is the Greek alpha the same letter as the Cyrillic 'а', or merely a similar shape playing a different role?
     *Note: A defensive answer will dodge the ontological status and focus on Unicode standards.*
     **Follow-up (if he says they play different roles):** If roles define the letter, does transliteration change the identity of the text?

  4. Can a shape be an 'a' before any community has read it as one, or does the role require a reader?
     *Note: A defensive answer will hide behind 'potentiality' rather than committing to yes or no.*

  5. If your generator produces a shape no reader accepts as an 'a', has it still generated an 'a'?
     *Note: A defensive answer will shift goalposts from 'generation' to 'successful communication'.*
     **Follow-up (if he insists it is still an 'a'):** Then what work is the label 'a' doing if not predicting recognition?

  6. Consider a child's scrawl or a letterform mangled by a photocopier. At what point does it lose its role?
     *Note: A defensive answer will claim the threshold is 'irrelevant' to the theory.*

  7. Take a perfectly legible 'a' in a script nobody alive can read. Is it still an 'a' now?
     *Note: A defensive answer will equivocate on the definition of 'legible'.*
     **Follow-up (if he says yes):** Then the role exists without a community to occupy it?

  8. If 'a' is defined by not being 'b', what defines 'b'? Does this not invite an infinite regress?
     *Note: A defensive answer will assert 'usage' stops the regress without explaining how.*

  9. Finally, what observation would count as evidence against your position?
     *Note: A defensive answer will claim the theory is unfalsifiable by design.*
     **Follow-up (if he struggles to name one):** If nothing counts against it, does it not cease to be a theory and become a tautology?
