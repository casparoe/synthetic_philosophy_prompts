      *   *Key Insight:* The user wants to stop the slide between "What did the words mean?" and "Did the act happen?".
      *   *Layering:*
          *   Layer 1: Locution (The Text).
          *   Layer 2: Illocution (The Attempt/Act).
          *   Layer 3: Perlocution (The Consequence/Acceptance).
      *   *Refining Step 3 (Jokes):* Austin calls jokes "parasitic". In law, we can't ignore them. The test is: Would a reasonable person in the room know it was a joke? If yes -> No Act. If no -> Act (even if speaker didn't mean it). This satisfies the user's "resignation nobody meant is still a resignation" (Objective test) while handling the joke exception (Context negates the act).

  10. **Final Polish:** Check tone. Ensure it sounds like a Knowledge Management document. Ensure the three case studies are applied rigorously.

