answer: |-
  **INTERNAL PRACTICE NOTE: EMP/SCREEN/04**
  **SUBJECT:** Speech Act Screening Procedure (Resignation & Disciplinary Utterances)
  **AUDIENCE:** Paralegals & Fee Earners
  **TIME ALLOWANCE:** 20 Minutes
  **STATUS:** Mandatory for initial file triage

  ---

  ### 1. PURPOSE AND SCOPE

  This procedure replaces the "Reasonable Reader" test for initial screening of disputed utterances (resignations, warnings, notices). The old test asked what words *meant*. This procedure asks what the words *did*.

  We are dealing with **Performative Utterances**.
  *   **Definition:** A sentence that does not just describe the world but changes it by being spoken (e.g., "I resign" changes your employment status; "I promise" creates an obligation).

  You must keep three layers separate. Do not slide between them.
  1.  **Layer 1 (The Words):** What was literally said or written?
  2.  **Layer 2 (The Act):** Did the speaking of the words count as an attempt to perform a legal act?
  3.  **Layer 3 (The Result):** Did the act land? Was it accepted or acted upon?

  **STOP RULE:** If you cannot tick a box with confidence, stop. Mark the file "PARTNER REVIEW" and record which step failed. Do not guess.

  ---

  ### 2. THE CHECKLIST

  #### STEP 1: THE GRAMMATICAL DIAGNOSTIC (Layer 1: The Words)
  *Goal: Determine if the words are capable of carrying the act.*

  **1.1 The "Hereby" Test**
  Can you insert the word "hereby" before the main verb without making the sentence nonsense?
  *   *Example:* "I [hereby] resign." (Works)
  *   *Example:* "I [hereby] hate this job." (Fails)
  *   **Pass:** The sentence accepts "hereby".
  *   **Fail:** The sentence rejects "hereby".
  *   **Warning:** Passing this test does not mean the act succeeded. Failing it usually means the act failed.

  **1.2 The Person and Tense Check**
  Is the speaker the correct person, using the present tense?
  *   *Correct:* "I resign." (First person, present).
  *   *Incorrect:* "He is resigning." (Third person report).
  *   *Incorrect:* "I will resign." (Future intention, not present act).
  *   **Verdict:** If Incorrect, record **NO ACT**. Stop and hand to Partner.

  #### STEP 2: THE AUTHORITY AND CONTEXT CHECK (Layer 2: The Act)
  *Goal: Identify a 'Misfire'. A misfire is where the machinery is absent, so the act never happens.*

  **2.1 The Speaker's Authority**
  Does the speaker have the right to perform this act?
  *   *Resignation:* Only the employee can resign.
  *   *Warning:* Only an authorised manager can warn.
  *   **Verdict:** If the wrong person speaks (e.g., a colleague resigns on behalf of another), record **MISFIRE (NO ACT)**. Stop.

  **2.2 The Channel and Procedure**
  Does the contract or handbook require a specific method (e.g., "in writing", "to HR")?
  *   **Yes:** Was that method used?
  *   **No:** If the required method was not used, record **MISFIRE (NO ACT)**.
  *   **Note:** If the method was *not* specified, oral resignation is possible. Proceed to 2.3.

  **2.3 The Addressee (Uptake)**
  Was the words directed at someone with the authority to receive them?
  *   *Definition:* **Uptake** is the recognition of the act by the listener.
  *   *Rule:* A resignation usually requires communication to the employer. A whisper to a colleague is not a resignation.
  *   **Verdict:** If not communicated to the employer (or agent), record **MISFIRE (NO ACT)**.

  #### STEP 3: THE SERIOUSNESS CHECK (Layer 2: The Act)
  *Goal: Distinguish 'Abuse' (valid but insincere) from 'Parasitic' (joke/theatre).*

  **3.1 The 'Parasitic' Exclusion**
  Was the utterance made in a context of theatre, play, or obvious jest?
  *   *Examples:* A toast at a pub, a line in a rehearsal, a satirical email marked "Joke".
  *   *Test:* Would a reasonable person present at the time have understood it as a joke *at the moment it was said*?
  *   **Yes:** Record **MISFIRE (NO ACT)**. The act was not attempted.
  *   **No:** Proceed to 3.2.
  *   **Note:** Do not confuse "I didn't mean it" (Regret) with "It was a joke" (No Attempt).

  **3.2 The 'Heat of the Moment' Exception**
  Was the utterance made in a sudden, emotional outburst where calm reflection was impossible?
  *   *Test:* Was there a specific trigger (argument, shock) immediately preceding the words?
  *   **Yes:** This is a **SPECIAL CIRCUMSTANCE**. The act may have technically occurred (Layer 2), but the law often allows retraction.
  *   **Verdict:** Do not decide validity. Mark **PARTNER REVIEW**. Record reason: "Potential Heat of the Moment".
  *   **No:** If calm and deliberate, the act stands even if the speaker regretted it later. Record **ACT PERFORMED**.

  #### STEP 4: THE CONSEQUENCE CHECK (Layer 3: The Result)
  *Goal: Determine if the act was accepted or acted upon.*

  **4.1 Acceptance**
  Did the employer accept the resignation immediately?
  *   *Rule:* Resignation is usually unilateral (does not need acceptance), but "Special Circumstances" (Step 3.2) require the employer to clarify intent.
  *   **Verdict:** If Step 3.2 was "Yes", and the employer did *not* seek clarification, record **ACT VOIDABLE**. Mark **PARTNER REVIEW**.

  **4.2 Detrimental Reliance**
  Has the employer acted on the words (e.g., hired a replacement, processed P45)?
  *   **Yes:** This strengthens the case that the act was valid.
  *   **No:** Neutral.

  ---

  ### 3. CALIBRATION TEST PAIRS

  Run these against your intuition before starting the file. If you cannot distinguish the pairs, do not proceed.

  **Pair A: The Grammar Test**
  1.  "I hereby resign." -> **ACT ATTEMPTED.**
  2.  "I am thinking of resigning." -> **NO ACT.** (Future tense/intention).

  **Pair B: The Context Test**
  1.  "I resign." (Said in a formal meeting, recorded in minutes). -> **ACT PERFORMED.**
  2.  "I resign." (Said during a office pantomime rehearsal). -> **NO ACT.** (Parasitic/Joke).

  **Pair C: The Authority Test**
  1.  "I resign." (Said by the Employee). -> **ACT ATTEMPTED.**
  2.  "You're fired." (Said by a Peer/Colleague). -> **NO ACT.** (Misfire/Wrong Person).

  ---

  ### 4. VALUE JUDGMENTS AND LEGAL TRAPS

  The following steps look like language tests but are actually questions of law or policy. **Do not decide these alone.**

  1.  **Step 3.1 (The Joke Test):** Deciding what is "obvious jest" is an objective legal test, not a linguistic one. If there is *any* doubt whether a reasonable person would see it as a joke, hand to Partner.
  2.  **Step 3.2 (Heat of the Moment):** This is a legal doctrine (special circumstances), not a grammatical one. It overrides the fact that the words were said. Always hand off.
  3.  **Step 4.1 (Acceptance):** Whether an employer *must* accept a resignation depends on the specific contract and case law. The checklist assumes unilateral effect; the Partner must verify this.

  ---

  ### 5. LIMITATIONS OF THIS PROCEDURE

  *   **The Objective Trap:** This checklist tries to separate "what was done" from "what was meant". In employment tribunals, these often collapse back into the "Reasonable Reader" test. If the words were clear, the Tribunal may rule it a resignation even if it was a joke, provided the employer reasonably believed it. This checklist flags the risk; it does not guarantee the outcome.
  *   **Silence:** This procedure works on text or recorded speech. It cannot assess tone of voice from a witness statement.
  *   **The 'Abuse' Problem:** As per Austin, an insincere act (e.g., resigning to bluff) is still an act. This checklist treats it as **ACT PERFORMED**. If the client wishes to argue the employee was bluffing, that is a Partner argument, not a screening outcome.

  ---

  ### 6. APPLICATION TO LIVE FILES

  Below is the application of the procedure to the three files currently on your desk.

  #### FILE (i): The Corridor Outburst
  *Facts: Employee tells Team Leader "had enough", "done with the place" in front of colleagues. Leaves. Returns Monday.*

  *   **Step 1.1 (Hereby Test):** "I am [hereby] done with the place." -> **FAIL.** (Colloquialism, not explicit performative).
  *   **Step 1.2 (Person/Tense):** "I am done." -> **PASS** (First person, present state).
  *   **Step 2.1 (Authority):** Employee speaking. -> **PASS.**
  *   **Step 2.3 (Addressee):** Spoken to Team Leader. -> **PASS.**
  *   **Step 3.1 (Parasitic):** Not a joke. -> **PASS.**
  *   **Step 3.2 (Heat of the Moment):** Heated corridor exchange. Specific trigger implied. -> **FLAG: SPECIAL CIRCUMSTANCE.**
  *   **Verdict:** **PARTNER REVIEW.**
  *   **Reasoning:** Step 1.1 is weak (ambiguous words), but Step 3.2 is the killer. The "Heat of the Moment" doctrine likely prevents this from binding immediately. The employer's failure to chase it up that day (implied by her return on Monday) suggests they did not treat it as final. Do not advise client this is a resignation.

  #### FILE (ii): The Premature Warning
  *Facts: Manager emails "formal written warning". No disciplinary procedure started.*

  *   **Step 1.1 (Hereby Test):** "This [hereby] constitutes a formal written warning." -> **PASS.**
  *   **Step 2.1 (Authority):** Manager speaking. -> **PASS.**
  *   **Step 2.2 (Channel/Procedure):** Contract/Handbook requires procedure to be *started* before a *formal* warning is issued. Procedure was not started. -> **FAIL.**
  *   **Verdict:** **MISFIRE (NO ACT).**
  *   **Reasoning:** This is a classic Misfire. The machinery required to make the utterance effective (the disciplinary process) was not in place. The words were said, but the act of "issuing a formal warning" could not be completed. It is a nullity. Client cannot rely on this for dismissal proceedings.

  #### FILE (iii): The Pub Resignation
  *Facts: Leaving drinks. Several drinks in. Announces "I resign" to laughter. Shakes hands. At desk Monday. Employer wants to enforce.*

  *   **Step 1.1 (Hereby Test):** "I [hereby] resign." -> **PASS.**
  *   **Step 2.1 (Authority):** Employee speaking. -> **PASS.**
  *   **Step 2.3 (Addressee):** Spoken to colleagues/manager present. -> **PASS.**
  *   **Step 3.1 (Parasitic/Joke):** Context: Leaving drinks, several drinks in, general laughter.
      *   *Test:* Would a reasonable person present understand this as a joke *at the time*?
      *   *Finding:* Yes. The laughter and context signal "play".
      *   *Result:* **MISFIRE (NO ACT).**
  *   **Verdict:** **NO RESIGNATION.** (Against Client).
  *   **Reasoning:** This fails at Step 3.1. While the grammar (Step 1) is perfect, the context renders the act "parasitic". It was an utterance *in the guise* of a resignation, not an actual resignation.
  *   **Warning to Client:** If we argue this was a valid resignation, we will lose at Step 3.1. The Tribunal will view the laughter and the Monday return as evidence that the "Uptake" (Step 2.3) was also treated as a joke by everyone, including the employer at the time. The employer's change of mind later does not revive the act. **Do not issue proceedings based on this.**

  ---

  ### 7. FINAL NOTE TO PARALEGAL

  You will notice that File (iii) stops us from acting for the client on a weak point. This is the purpose of the screen. It is better to identify the Step 3.1 failure now than in cross-examination.

  If you find yourself arguing about whether the laughter was "nervous" or "genuine", you have left the 20-minute screen. Stop. Hand to Partner.

  **End of Note.**
