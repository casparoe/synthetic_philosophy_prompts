  *   Misfire: The act is void (e.g., I resign on behalf of my colleague).
  *   Abuse: The act is valid but insincere (e.g., I resign to blackmail you, but I don't want to leave).
  *   *Legal translation:* Misfire = No resignation. Abuse = Resignation stands.
  *   *Jokes:* Are they Misfires or Abuses? Legally, if it's a joke, there is no *intent to be bound*, so it's usually treated as a Misfire (no act occurred). I will classify Jokes under "Failed Act" (Misfire) for the purpose of this checklist, distinguishing them from "Angry/Regretted" (Abuse/Valid Act).

