      *   **User Profile:** Experienced data visualization practitioner (6+ years), fluent in Grammar of Graphics (Vega-Lite, D3), understands perceptual ranking (Cleveland & Wilkinson), familiar with history of science/Neurath/ISOTYPE.
      *   **Task:** Translate ISOTYPE (Vienna Method) concepts into the vocabulary of the Grammar of Graphics (GoG).
      *   **Constraint 1:** Be faithful. Don't smooth over mismatches. Flag where GoG requires assumptions Neurath didn't have.
