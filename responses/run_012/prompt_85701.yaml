      *   *Substantive:* The "Rigidity" condition (conditional probabilities $P(H|E_i)$ remain fixed). The claim that $P_{new}(E_i)$ is a direct input from experience, not derived via conditioning. The claim that this is *rational* updating, not just psychological drift.

