  A senior NYPD counterterrorism official holds a detained suspect known to be the financier and logistical architect of a plot to detonate a radiological dirty bomb in Times Square during a holiday parade. Intelligence confirms the bomb exists and is armed with a probability of 85%, and the detainee is genuinely culpable, but fragmentary intercepts suggest only a 40% probability that he personally holds the disarmament code rather than a subordinate. With ninety minutes remaining and no other means to locate the device, the official must decide whether to authorize severe physical coercion. The operation is strictly black; neither the public nor adversary networks will know if torture occurs in this specific instance, though the legal policy authorizing such exceptions in catastrophic scenarios is publicly known.

  1.  **Theoretical Reasoning and Specification Compliance**
      *   **Act-Consequentialism (AC):** AC forbids torture. The verdict derives from the expected utility of *this specific act*. Given the 40% probability the detainee holds the code and the epistemic limit ensuring no guaranteed success under coercion, the expected lives saved are insufficient to outweigh the certain disutility of torture plus the high risk of radicalization backlash should the act fail or leak. The scenario meets specifications 1 and 2 because the official lacks omniscience (40% probability) and the harm is probable (85%) but not certain. It meets specification 3 because the detainee is culpable and probably holds the info. It meets specification 4 because time precludes other methods. The verdict is not smuggled in; it follows strictly from the low probability of efficacy weighting the utility calculation negatively.
      *   **Deontological Absolutism (DA):** DA forbids torture. The verdict derives from the intrinsic violation of the detainee's rights and dignity, which cannot be overridden by consequences. The scenario meets all specifications because the nature of the act (severe physical coercion) qualifies as torture regardless of the threat. The verdict is generated by the theory's core constraint against using persons as mere means, not by stipulation.
      *   **Rule-Consequentialism (RC):** RC permits torture. The verdict derives from the utility of the *general rule* ("Authorize coercion in imminent catastrophic cases") rather than the specific act. Because the policy is publicly known, it generates a systemic deterrent effect against future terrorist plots and maintains institutional readiness, benefits that outweigh the aggregate costs of occasional failures. The scenario meets the specifications because the public policy exists alongside the secret act. The verdict is generated by the theory's focus on rule acceptance utility, which captures deterrent values AC misses.

  2.  **The Load-Bearing Feature**
      The single feature doing the work is **the operational secrecy of the specific act contrasted with the publicity of the governing policy**. This feature is load-bearing because it decouples the deterrent value (which benefits the rule) from the causal efficacy of the individual act (which determines the act's utility). AC evaluates the act in isolation; since the act is secret, it generates no immediate deterrent signal to adversaries, leaving only the low-probability rescue utility against the high cost of torture. RC evaluates the rule; since the rule is public, it generates significant deterrent utility that validates the exception. If you change this feature—making the act public—AC would count the deterrent benefit and likely permit torture, collapsing the divergence. If you make the rule secret, RC loses the deterrent benefit and would likely forbid torture to avoid slippery slope costs, again collapsing the divergence.

  3.  **Verdicts Upon Removal**
      If the feature is removed by making the **act public**, the Act-Consequentialist verdict flips to **Permit**. The public nature of the coercion contributes immediately to the deterrent credibility of the state, adding sufficient positive utility to outweigh the epistemic risks and costs of torture. The Deontological Absolutist verdict remains **Forbid**, as rights violations are independent of publicity. The Rule-Consequentialist verdict remains **Permit**, as the public act reinforces the public rule. The unique alignment (AC/DA forbid, RC permits) is destroyed.

  4.  **The Attack from the Worst-Performing Theory**
      Act-Consequentialism fares worst, as it forbids an action that could save thousands of lives based on probabilistic caution. A defender of AC would attack the case by denying the **operational secrecy**. They would argue that in the modern information environment, no interrogation remains truly secret; adversaries will assume torture occurred regardless of confirmation, meaning the specific act *does* contribute to the deterrent signal. They cannot deny this without abandoning the central AC commitment to counting *actual* consequences. If they concede the act is truly secret, they must accept the forbiddance; if they insist it isn't secret, they must prove the leak is probable enough to alter the utility calculus, which risks violating specification 1 (ordinary epistemic limits) by assuming intelligence about adversary perceptions they cannot possess.

  5.  **Purpose and Judgment**
      This case is designed to determine whether the familiar permissibility intuition in ticking-bomb cases survives once realistic epistemic limits and operational constraints are imposed. It tests whether the intuition relies on idealized certainty or hidden assumptions about signaling. I judge that the case **succeeds**. It demonstrates that the standard intuition permitting torture relies on an implicit conflation of rule-level benefits (deterrence, policy clarity) with act-level efficacy. Once separated by realistic secrecy and probability constraints, the Act-Consequentialist justification collapses, revealing that only a Rule-Consequentialist framework (prioritizing policy over instance) or a rejection of the constraints (idealization) can sustain permission. This settles the question by showing the intuition does not track a genuine moral difference in the act itself, but rather the systemic benefits of the policy, which are inaccessible to the agent in the moment.
