prompt: |-
  Bit of an odd one this, but I'm stuck. Reading group on formal epistemology, and a mate of mine built an argument that's bugging me because the conclusion is obviously bollocks and I can't find the dodgy step.

  Here it is more or less as he wrote it:

  (1) Jeffrey conditonalisation is the rule for updating on uncertain evidence. When what you learn isn't certainty in a single proposition but a shift in your probabilities across a partition {E_i}, your new probability for any proposition A is the sum, over the cells, of your old conditional probability of A given E_i multiplied by your new probability of E_i.
  (2) Perception hands you uncertain evidence: when you seem to see or hear something, you're left with a high-but-not-certain degree of belief in its content, not certainty.
  (3) So perception updates are run by (1).
  (4) Fix any partition into E and not-E, and any A. Your old conditionals P(A|E) and P(A|not-E) come from your prior. Your new probabilities for E and not-E are just the degrees of belief you wind up with in the evidence once the experience is over.
  (5) The new probability of A is a weighted average of those two old conditionals, weighted by your new degrees of belief in the evidence. So as your new confidence in E slides from 0 to 1, your new P(A) slides smoothly from P(A|not-E) up to P(A|E).
  (6) Nothing in the rule pins down your new confidence in E. It's whatever you find yourself with.
  (7) So for any target belief in A lying between those two old conditionals, there's a permissible update that lands you exactly on it, and since nothing pins your new confidence in E, nothing stops you landing on whatever you fancy.
  (8) So Jeffrey conditionalisation lets a rational agent end up believing anything at all, simply by letting their confidence in the evidence settle wherever suits them. A rule of rationality that permits every outcome isn't a rule of rationality. So either Jeffrey conditionalisation is wrong, or uncertain perceptual evidence can't really count as evidence.

  To make it concrete he put numbers on it: say P(A|E)=0.9 and P(A|not-E)=0.1. Then your new P(A) is 0.1 plus 0.8 times your new P(E). Land on 0.5, 0.7, 0.9, whatever you like, just by fixing your new confidence in E accordingly.

  I'm pretty sure (1) is the right rule for uncertain evidence, and I don't want to give up (2), because I'm not willing to say perception is certain. So which step is rotten, and what does it cost me to cut it out? If more than one is rotten, tell me the order you'd sacrifice them in. British English please, and don't worry about being gentle about it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A reading group on formal epistemology.
      *   **Problem:** A friend has constructed an argument against Jeffrey Conditionalisation (JC) that leads to an absurd conclusion (JC allows believing anything, so it's not a rule of rationality).
      *   **User's Stance:** Accepts (1) JC is the right rule for uncertain evidence. Accepts (2) Perception yields uncertain evidence. Wants to find the flaw in the argument.
      *   **Task:** Identify the rotten step(s), explain why, and discuss the cost of rejecting them.
      *   **Tone:** British English, direct ("don't worry about being gentle about it").

  2.  **Deconstruct the Friend's Argument:**
      *   (1) Definition of JC: $P_{new}(A) = \sum P_{old}(A|E_i) \times P_{new}(E_i)$. (Standard formulation).
      *   (2) Premise: Perception gives uncertain evidence (probabilistic input). (Standard empiricist view).
      *   (3) Inference: Perception updates use JC. (Follows from 1 & 2).
      *   (4) Setup: Partition $\{E, \neg E\}$. $P_{old}(A|E)$ and $P_{old}(A|\neg E)$ are fixed. $P_{new}(E)$ is the result of experience.
      *   (5) Math: $P_{new}(A)$ is a weighted average. Varies continuously with $P_{new}(E)$. (Mathematically correct).
      *   (6) Claim: Nothing in the rule pins down $P_{new}(E)$. It's whatever you find yourself with. (This is the crux).
      *   (7) Inference: For any target $P_{new}(A)$, there's a permissible $P_{new}(E)$. You can land wherever you fancy.
      *   (8) Conclusion: JC permits anything, so it's not a rule of rationality. Therefore, JC is wrong OR perception isn't evidence.

  3.  **Identify the Flaw:**
      *   The argument relies on the idea that $P_{new}(E)$ is *arbitrary* or *unconstrained by rationality*.
      *   Step (6) says: "Nothing in the rule pins down your new confidence in E. It's whatever you find yourself with."
      *   Step (7) infers from (6) that *any* value for $P_{new}(E)$ is *permissible*.
      *   **The Error:** Confusing the *mechanism* of updating with the *norms* governing the input. JC tells you how to update *given* new probabilities for the partition. It does *not* tell you what those new probabilities *ought* to be. However, that doesn't mean *any* new probability is rational.
      *   There must be independent constraints on $P_{new}(E)$ (the "input" problem). If your experience is of a red sock, it is not rational to set $P_{new}(\text{Red Sock}) = 0.1$. It should be high.
      *   The friend's argument proves that JC *alone* is insufficient for a complete theory of rational belief change. It doesn't prove JC is *wrong*, nor that perception isn't evidence. It proves we need a theory of "probability kinematics" input constraints.
      *   So, Step (7) is the non-sequitur. Step (6) is technically true (JC doesn't pin it down), but Step (7) falsely assumes that because JC doesn't pin it down, *nothing* does (i.e., rationality doesn't constrain it).

  4.  **Evaluate the Steps for Sacrifice:**
      *   **Step (7) is the primary target.** It conflates "JC doesn't constrain input" with "Rationality doesn't constrain input."
      *   **Step (8) is the conclusion derived from (7).** If (7) falls, (8) collapses.
      *   **Step (6) is nuanced.** It's true that JC *as a formula* doesn't determine $P_{new}(E)$. But implying this leaves it rationally unconstrained is misleading.
      *   **Step (1) & (2):** The user wants to keep these. Good, because they are standard.
      *   **The "Input Problem":** This is the known philosophical issue here. We need to mention this.

  5.  **Drafting the Response (incorporating British English and tone):**
      *   *Opening:* Acknowledge the frustration. It's a classic puzzle (the "input problem" for JC).
      *   *The Verdict:* Step (7) is the rotter. Step (6) is suspicious depending on interpretation.
      *   *Explanation:* JC is a constraint on *coherence* between old and new beliefs, not a constraint on the *input* itself. Just because the rule doesn't dictate the input doesn't mean rationality doesn't.
      *   *Analogy:* Modus Ponens. $P, P \to Q \vdash Q$. The rule doesn't tell you if $P$ is true. That doesn't mean you can assert any $P$ you like.
      *   *Cost:* You have to admit JC isn't the *whole* story. You need an account of what makes a specific $P_{new}(E)$ justified (e.g., reliability of experience, phenomenal conservatism, etc.).
      *   *Secondary Issue:* Step (4)/(5) assumes the partition is fixed and independent of the experience. There's a deeper issue about whether the experience *selects* the partition (Garber-style or similar), but that's too technical for now. Stick to the input problem.
      *   *Tone Check:* "Bollocks," "rotten," "mate," "bugging me." Keep it informal but precise. Use British spelling (colour, centre, etc., though not much opportunity there). Use phrases like "properly speaking," "dodgy," "have a go."

  6.  **Refining the Argument:**
      *   Make sure to distinguish between *permissibility* and *possibility*.
      *   The friend argues: JC allows any $P_{new}(E)$ $\to$ Rationality allows any $P_{new}(E)$.
      *   Counter: JC allows any $P_{new}(E)$ *mathematically*, but Rationality constrains $P_{new}(E)$ *normatively*.
      *   The friend's conclusion (8) is a false dilemma. The third option is: JC is right, Perception is evidence, *but* JC needs supplementary norms for input.

  7.  **Final Polish:**
      *   Check the numbering.
      *   Ensure the distinction between the *update rule* and the *input justification* is clear.
      *   Address the "cost." The cost is admitting formal epistemology isn't a closed shop; you need externalist or phenomenological inputs.

  8.  **Self-Correction/Edge Case:**
      *   Is there a problem with Step (1)? Some argue JC is wrong (e.g., Diaconis & Zabell, or the problem of old evidence). But the user wants to keep (1).
      *   Is there a problem with Step (2)? Some (Dogmatists/Phenomenal Conservatives) might argue perception *does* give certainty (foundationalism). But user rejects this.
      *   Focus heavily on the gap between (6) and (7).
      *   Wait, is (6) actually false? "Nothing in the rule pins down your new confidence in E." That is true. The rule is conditional. "If you adopt these new probs, then..." So (6) is true about the *rule*. The falsehood is the implication in (7) that *nothing else* pins it down.
      *   Actually, (7) says "since nothing pins your new confidence in E [referring back to the rule in 6], nothing stops you..." This is the equivocation. "Nothing [in the rule]" vs "Nothing [at all]".

  9.  **Final Plan:**
      *   Pin the blame on the slide from (6) to (7).
      *   Explain the "Input Problem."
      *   Tell him his mate has discovered a known problem but drawn the wrong conclusion.
      *   Keep it punchy.

  *(Self-Correction during drafting)*: I should make sure I don't sound like I'm lecturing too much. Keep it conversational as requested. "Here's the thing," "Your mate has got it wrong here."

  *(Check British English)*: "Realise" vs "Realize" (I'll use 's'), "Defence" vs "Defense", "Centre". Phrasing like "proper shambles," "have a word," "spot of bother."

  *(Final check on the logic)*:
  Friend: JC doesn't constrain input. Therefore input is unconstrained. Therefore anything goes.
  Me: JC doesn't constrain input. But *epistemic norms* constrain input. Therefore not anything goes. JC is still valid as a coherence constraint.

  Okay, ready to write.cw
answer: |-
  Right, let's have a look at this. It is a proper shambles, but not for the reason your mate thinks. He's stumbled onto a very famous problem in formal epistemology—the "input problem" for Jeffrey Conditionalisation—but he's drawn a wildly inflated conclusion from it.

  You're right to hold your ground on (1) and (2). They're the standard view for a reason. If you start chucking those out, you've got bigger problems than this argument.

  The rotten step is **(7)**. It's a classic equivocation, and it's the linchpin holding the whole absurdity together.

  Here's the breakdown of where he goes off the rails.

  ### The Dodgy Step: (6) to (7)

  Look closely at (6): *"Nothing in the rule pins down your new confidence in E."*

  That is technically true. Jeffrey Conditionalisation (JC) is a constraint on *coherence*. It tells you how your new beliefs must relate to your old beliefs *given* a specific input. It's a conditional rule: **IF** you adopt new probabilities for the partition $\{E_i\}$, **THEN** you must update your other beliefs accordingly. It does not tell you which new probabilities for $\{E_i\}$ you are allowed to adopt.

  Now look at (7): *"So... nothing stops you landing on whatever you fancy."*

  This is the non-sequitur. Just because the *update rule* doesn't pin down the input, it doesn't follow that *rationality* doesn't pin down the input.

  Think of it like Modus Ponens. The rule says: If you believe $P$, and you believe $P \to Q$, you must believe $Q$. The rule of logic doesn't tell you whether you should believe $P$ in the first place. Does that mean you can rationally believe any old $P$ you fancy? No. You need evidence for $P$.

  Similarly, JC doesn't tell you what your new confidence in $E$ ought to be after an experience. But that doesn't mean your confidence can be *anything*. If you stare at a red sock, rationality (via some other norm, not JC) dictates your new confidence in "There is a red sock" should be high. If you set it to 0.1, you haven't violated JC, but you have violated the norms governing perception and evidence.

  Your mate has confused **procedural permission** with **rational permissibility**. JC permits the calculation for any input, but rationality restricts which inputs are legitimate.

  ### The Secondary Rot: Step (8)

  Because (7) is duff, (8) collapses. The conclusion that "JC lets a rational agent end up believing anything" is false. JC lets an *unconstrained* agent end up believing anything. But a *rational* agent is constrained by more than just the update rule.

  The dilemma he offers at the end of (8) is a false trilemma. The options aren't just "JC is wrong" or "Perception isn't evidence." The third option, which is the standard view, is: **JC is the right update rule, perception is uncertain evidence, but we need a separate theory to justify the input probabilities.**

  ### What Does It Cost You to Cut This Out?

  If you reject (7) and (8), you have to accept a specific cost. You have to admit that Jeffrey Conditionalisation is not a **complete** theory of rational belief change.

  1.  **You need an "Input Account":** You can't just do formal epistemology in a vacuum. You need to supplement JC with a story about what makes a specific shift in $P_{new}(E)$ justified. Is it the reliability of the sensory apparatus? The phenomenal character of the experience? This is the bit philosophers argue about (e.g., Weisberg, Christensen, Titelbaum).
  2.  **Formalism isn't King:** You have to concede that the maths doesn't solve the philosophical problem of justification on its own. The formula preserves coherence; it doesn't generate justification from thin air.

  ### Order of Sacrifice

  If you were forced to sacrifice steps (which you shouldn't be, but hypothetically):

  1.  **Sacrifice (7) immediately.** It's logically invalid. It conflates "the formula doesn't forbid it" with "rationality allows it."
  2.  **Sacrifice (8) consequently.** The conclusion doesn't follow.
  3.  **Keep (1) and (2).** These are your core commitments. Giving up (1) leaves you with no rule for uncertain evidence (and standard Conditionalisation is too strict). Giving up (2) forces you into a foundationalist dogmatism where perception yields certainties, which is psychologically implausible.
  4.  **Keep (3), (4), (5).** The maths is fine. The description of how the weighted average works is correct.
  5.  **Qualify (6).** It's true that the *rule* doesn't pin it down, but you must add the caveat "though other epistemic norms might."

  ### Summary for Your Mate

  Tell him he's discovered the **Input Problem**, not a refutation of JC.

  The argument shows that JC is **underdetermined**, not that it is **permissive**. It shows that JC needs a partner theory to tell us which probability shifts are warranted by experience. That's a feature of the framework, not a bug. A rule of inference isn't useless just because it doesn't tell you what your premises should be.

  If he insists that JC is supposed to be the *only* rule of rationality needed, then sure, he's right that it fails. But nobody sensible ever claimed it was the only norm you need. It's the rule for *processing* evidence, not the rule for *having* it.

  So, tell him to stop trying to burn the house down because he found a door that doesn't have a lock on it. The lock is somewhere else.
