answer: |-
  **[Extrapolation from *Lectures on Religious Belief* and *Culture and Value*]**: Wittgenstein's core move—treating belief as a "form of life" rather than a hypothesis—would likely function as a devastating critique here. For him, religious language gains meaning from its weave into suffering, ethical commitment, and communal practice. A livestreamed service or an AI Bible study detached from the risk of actual living would strike him as a language game played without stakes. He argued that religious certainty is not intellectual but practical; it shows itself in how one lives. If the "practice" is clicking a button or reading a generated text, the grammar of religion is being mimicked without the life that gives it blood. He would say these aren't false beliefs, but empty gestures—like painting a flame that gives no heat.

  **[Extrapolation on Superstition vs. Religion]**: His distinction between religion and superstition hinges on attitude. Religion accepts the unalterable; superstition tries to coerce the world. The "griefbot" that resurrects a dead parent via text prediction would almost certainly land on the superstition side. It treats language as a technical tool to bypass death, rather than a medium to express a stance toward loss. It attempts to manipulate reality rather than endure it.

  **[Guess based on personality and later remarks]**: However, whether he'd bother engaging is another matter. Given his disdain for the "progress" of civilization and his preference for manual labor and silence, he might dismiss the whole phenomenon as noise. He might argue that when a program "prays," nothing is happening at all, because a machine cannot suffer, and without the possibility of suffering, the word "faith" loses its home. He would likely conclude that the sorting survives, but only to reveal that much of digital religion isn't even superstition—it's merely a confused simulation where the form of life has been evacuated, leaving nothing for him to have a view about.
