prompt: |-
  Suppose Wittgenstein didn't die in 1951 and is around today, still ornery, still refusing to read much, picking up only what he can't help overhearing. What would he make of the religion that mostly happens through screens now — livestreamed services, podcast sermons, apps where you upload a dead parent's texts and the thing writes back in their voice, a chatbot that runs a Bible study and gets praised for being more patient than any pastor? I'm especialy curious whether his basic move, treating religious belief as a form of life rather than a hypothesis you could evidence for or against, still does any work for these, or whether he'd say the cases are confused and there's nothing there for him to have a view about. Same question for his habit of sorting religious practice apart from superstition: does any of the app/griefbot stuff land on the superstition side for him, and does that sorting even survive once a program is doing the praying? Dont give me a reading list or citations, just argue it out in a few hundred words, and mark clearly where you're extrapolating from what he actually wrote versus guessing.
