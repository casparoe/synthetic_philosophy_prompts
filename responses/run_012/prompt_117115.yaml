          2.  *Identity:* Is the experience the log line, or the *act* of writing it?
          3.  *The "Hard Problem":* Why does the log line *feel* like anything? In engineering, logs don't feel.
          4.  *Causal Power:* In engineering, logs *can* be read (alerting systems). Epiphenomenalism says qualia *cannot* be read by the physical.

