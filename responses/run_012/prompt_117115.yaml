      *   *Conscious Experience (Qualia):* The telemetry/logs/metrics emitted.
      *   *Causal Closure of Physical:* The app logic never queries the telemetry store to make decisions. Control plane is isolated from observability plane.
      *   *Phenomenal-Judgment Objection:* "I am seeing red" is a log entry. Who wrote it? The app. Why? Because the app state changed (wavelength detection). Did the *log entry itself* cause the app to write the log entry? No.
      *   *The "Fudge":* In engineering, the log entry is a *representation* of state. In philosophy, the experience *is* the thing (ontologically distinct?).
      *   *Colleague's View:* It's just eventual consistency. The log view and the DB view are consistent because they share a source of truth (the CPU/State).
