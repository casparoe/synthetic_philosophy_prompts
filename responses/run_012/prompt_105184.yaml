  Here is the principle that organizes your cases, the verdict you have to sacrifice to keep it clean, and the machine case that tests its limits.

  ### The Principle: Epistemic Integrity with Normative Authorization

  **Influence is manipulative (Not Fine) if it degrades the target's ability to accurately model the *stakes*, the *options*, or the *influencer's intent*, unless the target has authorized that degradation either explicitly or through established social norms.**

  This principle rests on the idea that your agency depends on your "epistemic map"—your internal model of what is true, what is possible, and who wants what. Manipulation is sabotage of that map.

  ### How It Resolves Your Conflicts

  **1. The 10 vs. 11 Conflict (The Core Tension)**
  *   **Case 10 (Friend/Marathon):** The friend announces the lever. Your map of *their intent* is accurate ("They want me to run"). Your map of *options* is accurate ("I can say no"). Your epistemic integrity is intact. **Verdict: Fine.**
  *   **Case 11 (Colleague/Curation):** The colleague hides their intent. Your map of *their intent* is false ("They are helping me decide" vs. "They are winning a fight"). Your map of *options* is corrupted (you think you're seeing all arguments, but you're seeing a curated subset). **Verdict: Not Fine.**
  *   **Why 11 is worse:** In 10, you can counter-calculate because you know the game. In 11, you think you're thinking freely, but you're reasoning inside a room they built.

  **2. The 3 vs. 4 Conflict (Framing)**
  *   **Case 3 (Standard Framing):** "90% survival" is a standard medical communication norm. You implicitly authorize doctors to frame risk in ways that encourage health. **Verdict: Fine.**
  *   **Case 4 (Strategic Framing):** The doctor chooses the frame *specifically* to bypass your predicted refusal. This shifts from "medical norm" to "strategic engineering." It degrades your model of *their intent* (you think it's advice; it's a tactic). **Verdict: Not Fine.** (See Sacrifice below).

  **3. The 12 vs. 13 Conflict (Capacity)**
  *   **Case 13 (Silence):** Negotiation norms authorize tactical silence. You know silence is a tool in this context. **Verdict: Fine.**
  *   **Case 12 (Fatigue):** There is no norm authorizing requests at 11:30 PM to a wrecked person. This exploits a degradation in *your* capacity to model stakes accurately. **Verdict: Not Fine.**

  **4. The 14 Exception (The Surprise)**
  *   **Case 14 (Surprise Party):** This is a lie that degrades your model of reality. However, "Surprise Party" is a specific social script where deception is the *mechanism of the gift*. You give normative authorization for this specific type of benevolent deception by participating in the culture of friendship. **Verdict: Fine.**

  ### The Sacrifice

  To make this principle hold, you must flip **Case 4**.

  You currently lean "Fine" on the doctor who frames the stats specifically to bypass your refusal. Under the Principle of Epistemic Integrity, this is **Not Fine**.

  **Why?** Because it treats your refusal as a bug to be fixed rather than a preference to be respected. It preserves the *truth of the data* (90% survival) but corrupts the *context of the data* (the doctor's neutrality). If we allow 4 to stand as "Fine," we cannot distinguish the doctor from the colleague in Case 11. Both are curating information to engineer a specific outcome while pretending to offer neutral input. If 11 is manipulation, 4 must be too.

  ### The Squirm Case: The Paternalistic Algorithm

  Here is the case that tests whether you truly value Epistemic Integrity over Benevolent Outcomes.

  **Case 15:** You have a smart writing assistant. It notices you are drafting an email to your boss that is emotionally charged and likely to get you fired.
  *   **Scenario A:** It silently rewrites three sentences to be more diplomatic before you hit send. You never know.
  *   **Scenario B:** It pops up a message: "I detect high anger. I can rewrite this to be safer. Yes/No?"

  **My Principle's Prediction:**
  *   **Scenario A is Not Fine.** Even though the outcome is good (you keep your job), it violates Epistemic Integrity. You did not authorize the alteration of your output. Your model of *your own agency* is false (you think you sent the email; the AI sent a version). This is structurally identical to Case 11 (Hidden Curation).
  *   **Scenario B is Fine.** This restores authorization. It is structurally identical to Case 9 (Therapist) or Case 10 (Friend).

  **Why this makes you squirm:**
  Most people feel Scenario A is *helpful*. If you agree with my principle, you have to admit that a "helpful lie" about your own actions is still a violation of your agency. If you think Scenario A is Fine, you are prioritizing **Outcomes** over **Integrity**, and you must then explain why the Colleague in Case 11 isn't also "helping" you by curating arguments to steer you toward the "right" side of the department fight.

  ### Summary of the Trade-off

  You get a clean line between **Persuasion** (updating my map) and **Manipulation** (corrupting my map).
  *   **Persuasion:** Gives me new reasons (1, 3, 5, 11-arguments).
  *   **Manipulation:** Hides the weight on the scale (2, 6, 7, 11-intent, 12).
  *   **Authorized Leverage:** Shows me the weight on the scale (9, 10, 13, 14).

  The cost is admitting that **benevolent paternalism (Case 4)** is a form of manipulation. The doctor may be right about the surgery, but if she engineers your consent by hiding her strategy, she has treated you as a system to be hacked, not a mind to be convinced.
