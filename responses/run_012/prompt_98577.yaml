answer: |-
  1. You argue that Hobbes's geometry is not an embarrassing sideline but a project continuous with his broader philosophical system. How exactly does his definition of reasoning as computation bridge the gap between the political arguments of *Leviathan* and the technical demonstrations in *De Corpore*?
  *Follow-up:* If reasoning is just adding and subtracting names, does the truth of the conclusion depend on the accuracy of the definitions we start with, or merely on the consistency of the calculation?

  2. On your reading, geometrical objects are figures we generate by motion rather than entities we discover in the world. Given Hobbes's nominalism, does this computational view risk collapsing geometry into a verbal game, and if so, how does he retain the demonstrative status you attribute to it?
  *Follow-up:* If the certainty comes from the fact that we stipulate the definitions, doesn't that make geometric truth trivial compared to the discovery of external truths?

  3. You suggest geometry is demonstrable because we grasp the causes of what we study precisely because we make it. Why does this epistemic privilege apply to geometry but not to the science of natural bodies, where we cannot generate the phenomena ourselves?
  *Follow-up:* Does this imply that for Hobbes, natural science is always merely conjectural, lacking the strict scientific status he claims for geometry?

  4. If the demonstrative status of geometry rests on the fact that we construct its objects, does the fact that we are said to "make" the commonwealth buy civil philosophy the same demonstrative standing?
  *Follow-up:* If civil philosophy is equally demonstrative, why does Hobbes admit that political outcomes are so much messier and less certain than geometric proofs in practice?

  5. You reinterpret Hobbes's notorious attempts to square the circle as the visible working-out of a nonstandard method rather than simple incompetence. But if every failed construction is reinterpreted as a feature of the method, what would it take for you to conclude that Hobbes's geometry really was just bad?
  *Follow-up:* If the thesis absorbs every failure as methodological consistency, does your reading have any falsifiable edge, or does it immunize Hobbes from the charge of error?

  6. Even granting that his method was coherent, Hobbes failed to solve the problem he set for himself repeatedly over decades. Is there a point where persistence in a failed program stops being a bold philosophical stance and starts looking like delusion?
  *Follow-up:* Are you suggesting that his refusal to accept correction was a principled stand against the mathematical establishment, or simply a stubborn inability to recognize he was wrong?

  7. You argue the long public quarrel with John Wallis was as much about theology and university authority as it was about mathematics. What specific threat did Hobbes's conception of geometry pose to the institutional power Wallis was defending?
  *Follow-up:* If the dispute was largely political, does that mean Wallis's mathematical refutations were merely weapons chosen for convenience rather than genuine engagements with Hobbes's system?

  8. How does your reading explain why the new experimental circles of the period, such as Boyle's group, received Hobbes so hostilely despite his commitment to a materialist and mechanistic worldview?
  *Follow-up:* Was their rejection driven by his deductive method clashing with their inductive practices, or was it purely the political toxicity of his reputation?

  9. If Hobbes and Wallis were operating with fundamentally different definitions of what counts as "science" or "demonstration," does your reading imply the mathematical community was right to exclude him, just for different reasons than they stated?
  *Follow-up:* Does this mean Hobbes was effectively playing a different game than the Royal Society, making the conflict inevitable regardless of the specific mathematical errors?

  10. Finally, what is actually at stake for how we tell the story of the Scientific Revolution if you are right about Hobbes's mathematics being integral rather than incidental?
  *Follow-up:* Does this force us to abandon the narrative of the Scientific Revolution as a tidy triumph of experiment over deduction, revealing it instead as a contested battle over the definition of reason itself?
