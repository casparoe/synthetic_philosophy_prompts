answer: |-
  # Decision Tree: Historical Overdetermination & Causal Structure

  **Instructions:** Start at Node 1. Answer the question based on the specific historical case or thought experiment you are analyzing. Follow the branch to the next node or to a final position (Leaf).

  ### **Node 1: The Locus of Multiplicity**
  When we say an event has "many causes," is this multiplicity a feature of the **world** (distinct causal lines exist independently of us) or a feature of our **explanatory interests** (we slice the continuous past differently depending on our questions)?
  *   **Explanatory Interests:** Go to **Leaf A**.
  *   **The World:** Go to **Node 2**.

  ### **Node 2: The Structure of Sufficiency**
  Consider the candidate factors (e.g., assassination, mobilization, debt). Was each factor **individually sufficient** to produce the outcome, or were they only sufficient when **combined**?
  *   **Combined (Jointly Sufficient):** Go to **Node 3**.
  *   **Individually Sufficient:** Go to **Node 5**.

  ### **Node 3: The Necessity of Parts**
  (In Joint Sufficiency) Within the set of conditions that produced the outcome, was each factor a **necessary part** of that specific set, or could some have been swapped out for others while keeping the set sufficient?
  *   **Necessary Parts:** Go to **Leaf B**.
  *   **Swappable/Loose:** Go to **Leaf C**.

  ### **Node 4: (Unused/Skip)**
  *(Reserved for tree balance)*

  ### **Node 5: Counterfactual Determinacy**
  (In Individual Sufficiency) If we remove one sufficient factor, is it **determinately true** that the outcome would still have occurred (due to the other factors), or is the counterfactual **too vague/indeterminate** to assert confidently?
  *   **Too Vague:** Go to **Leaf D**.
  *   **Determinately True:** Go to **Node 6**.

  ### **Node 6: The Status of Redundancy**
  (Since the outcome would have happened anyway) Does a redundant factor still count as a **cause**, or is it excluded because the outcome did not **depend** on it?
  *   **Counts as Cause:** Go to **Leaf E**.
  *   **Excluded (Not a Cause):** Go to **Node 7**.

  ### **Node 7: The Grounds for Exclusion**
  (If Redundant Factors are Excluded) Do we identify the single cause by tracing the **physical process** that completed, or by identifying the factor without which the outcome **would not have happened** in the actual sequence?
  *   **Physical Process:** Go to **Leaf F**.
  *   **Counterfactual Dependence:** Go to **Leaf G**.

  ---

  ## **The Leaves (Positions)**

  **Leaf A: Deflationary / Interest-Relative View**
  *   **Verdict:** "Overdetermination" is a fact about our why-questions, not the past.
  *   **Awkward Commitment:** You must admit that two historians can contradict each other ("A caused E" vs "B caused E") without either being factually wrong about the world.

  **Leaf B: Condition-Set View (INUS)**
  *   **Verdict:** A cause is an Insufficient but Necessary part of a condition which is itself Unnecessary but Sufficient.
  *   **Awkward Commitment:** You cannot call a single factor (e.g., "the assassination") "the cause" without implicitly referencing the background conditions that made it sufficient.

  **Leaf C: Unnamed / Loose Conjunctural View**
  *   **Verdict:** Causes are swappable contributors to a sufficient set.
  *   **Awkward Commitment:** You lack a principled way to distinguish a "cause" from a mere "background condition" within the set, making causal selection arbitrary.

  **Leaf D: Historical Skeptic (Vague Counterfactuals)**
  *   **Verdict:** Strict overdetermination never happens because historical counterfactuals are too vague to be true.
  *   **Awkward Commitment:** You must deny that we can ever know if a backup cause *would* have worked, rendering claims of redundancy unverifiable.

  **Leaf E: Sufficiency-Pluralist View**
  *   **Verdict:** Each sufficient factor is a full cause; overdetermination is real and common.
  *   **Awkward Commitment:** You must accept that the "amount" of causation increases with redundant factors (e.g., a death by firing squad is "more caused" than a death by single shooter).

  **Leaf F: Preemption View**
  *   **Verdict:** Only the factor that physically completed the process is the cause; redundant backups are not causes.
  *   **Awkward Commitment:** You must rely on fine-grained process tracing which is often unavailable in macro-history (e.g., distinguishing which alliance system "triggered" WWI first).

  **Leaf G: Plain Counterfactual (But-For) View**
  *   **Verdict:** A cause is something without which the outcome would not have occurred.
  *   **Awkward Commitment:** In cases of symmetric overdetermination (e.g., simultaneous firing squad), you must conclude that **nothing** caused the outcome.

  ---

  ## **Case Testing & Diagnostics**

  ### **1. Test Cases Analysis**
  Here is where the tree forces a verdict on your specific examples. Note where the verdict clashes with historical intuition.

  | Case | Likely Path | Verdict | Problematic Outcome? |
  | :--- | :--- | :--- | :--- |
  | **WWI (1914)** | Node 1 (World) → Node 2 (Joint) → Node 3 (Necessary) → **Leaf B (INUS)** | Alliances + Assassination + Mobilization jointly caused war. | **No.** This fits standard historical practice well. |
  | **Soviet Collapse** | Node 1 (Interests) → **Leaf A (Deflationary)** | Economic, political, and cultural causes depend on the historian's question. | **No.** Captures the multi-causal consensus without forcing a structure. |
  | **2008 Crisis** | Node 2 (Joint) → Node 3 (Swappable) → **Leaf C (Unnamed)** | Deregulation, derivatives, and housing bubbles were swappable contributors. | **Yes.** Leaf C admits it can't distinguish causes from conditions, which frustrates policy analysis. |
  | **Firing Squad** | Node 2 (Individual) → Node 5 (Clear) → Node 6 (Excluded) → Node 7 (Dependence) → **Leaf G (But-For)** | Since each shot was sufficient, and death didn't depend on one, **no one caused the death.** | **Yes.** This is the classic reductio ad absurdum of the But-For view. Students will reject this. |
  | **Two Fires** | Node 2 (Individual) → Node 5 (Clear) → Node 6 (Excluded) → Node 7 (Process) → **Leaf F (Preemption)** | The fire that arrived 1 second earlier caused the burn; the other did not. | **Maybe.** Plausible in physics, but in history (e.g., two markets crashing), "process" is often untraceable. |

  ### **2. Indistinguishable Leaves & Empty Spaces**

  **Indistinguishable Pair: Leaf D (Skeptic) vs. Leaf A (Deflationary)**
  *   **Diagnosis:** These two are often the same view wearing different hats. Both deny that there is a hard fact of the matter about "which cause" in overdetermination cases. The Skeptic blames *epistemology* (we can't know the counterfactual); the Deflationist blames *ontology* (there is no fact to know). In a seminar discussion, students will struggle to keep these apart.

  **Empty Space 1: Joint Sufficiency + Symmetric Overdetermination**
  *   **Diagnosis:** **Incoherent.** If factors are only sufficient jointly (INUS), they cannot be symmetrically overdetermined (where each is sufficient individually). The tree correctly prevents this path, but students often try to force it (e.g., "The alliances were overdetermined").

  **Empty Space 2: Individual Sufficiency + Redundant Factors Count + Interest-Relative**
  *   **Diagnosis:** **Unexplored.** This would be a view where "many causes" is interest-relative, *but* the world contains objectively sufficient lines. Most interest-relative theorists (Leaf A) deny the objective sufficiency to avoid the metaphysical baggage. Combining them is logically possible but philosophically unmotivated.

  **Empty Space 3: Leaf G (But-For) in Macro-History**
  *   **Diagnosis:** **Unattractive.** While Leaf G works for legal liability or small-scale physics, it is almost never defended in macro-history because it yields "no cause" for almost all major events (which are robust to small changes). If a student lands here on WWI, tell them they have adopted a position most historians find unusable.

  ### **3. Node Count & Usability**
  *   **Total Nodes:** 12 (7 Questions, 5 Leaves + 2 Unnamed/Implicit Leaves in logic).
  *   **Session Fit:** Students can trace a case in 2-3 minutes. The "awkward commitments" are designed to spark debate immediately after they land on a leaf.
  *   **Honesty Check:** The tree forces the separation of INUS (Joint) from Overdetermination (Individual) at Node 2, and separates Preemption (Process) from But-For (Dependence) at Node 7, addressing your core pedagogical problem.
