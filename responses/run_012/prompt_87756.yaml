answer: |-
  Your sense is correct. While your friend’s choices feel intuitively defensible on their own, they are mathematically inconsistent when viewed together. This is a famous problem in decision theory known as the **Allais Paradox**, named after the economist Maurice Allais, who first identified it in 1953.

  ### 1. The Mathematical Contradiction
  To understand the inconsistency, we assume your friend is trying to maximize her "Expected Utility" ($U$). We can write out the logic of her two choices as inequalities:

  **Choice 1 (Preferring A over B):**
  *   $1.00 \times U(\$10,000) > 0.89 \times U(\$10,000) + 0.10 \times U(\$60,000) + 0.01 \times U(0)$
  *   If we subtract $0.89 \times U(\$10,000)$ from both sides, we are left with:
  *   **Inequality 1:** $0.11 \times U(\$10,000) > 0.10 \times U(\$60,000) + 0.01 \times U(0)$

  **Choice 2 (Preferring D over C):**
  *   $0.10 \times U(\$60,000) + 0.90 \times U(0) > 0.11 \times U(\$10,000) + 0.89 \times U(0)$
  *   If we subtract $0.89 \times U(0)$ from both sides, we are left with:
  *   **Inequality 2:** $0.10 \times U(\$60,000) + 0.01 \times U(0) > 0.11 \times U(\$10,000)$

  **The Conflict:** Inequality 1 says that "Package X" is greater than "Package Y." Inequality 2 says that "Package Y" is greater than "Package X." Mathematically, these two statements cannot both be true.

  ### 2. The Violated Principle: The Independence Axiom
  The principle your friend has violated is the **Independence Axiom** of Expected Utility Theory. This axiom states that if you prefer one option over another, you should still prefer it even if you add the same "common consequence" to both options.

  *   **The Common Consequence:** In both choices, there is an 89% chance of a specific outcome. In Choice 1, that outcome is a guaranteed $10,000. In Choice 2, that outcome is $0.
  *   **The Violation:** Your friend’s preference flipped based on that common 89% chunk. She preferred the "safe" $10,000 when it was part of a sure thing (Choice 1), but she preferred the "risky" $60,000 when the common chunk was nothing (Choice 2). According to the Independence Axiom, the 89% part should be irrelevant; only the remaining 11% vs. 10% should matter.

  ### 3. Why It Feels Defensible (The Psychology)
  Your unease is misplaced in the sense that your friend is not "irrational" in a human context; she is simply following a psychological bias called the **Certainty Effect**.

  *   **Choice 1 (The Certainty Effect):** Humans tend to overweight outcomes that are considered certain. Moving from a 100% chance to an 89% chance feels like a massive loss of security, which makes the sure $10,000 of Option A incredibly attractive.
  *   **Choice 2 (The Possibility Effect):** In the second choice, both options are mostly "nothing." Because the 89% vs. 90% chance of getting nothing feels negligible, your friend focuses on the potential reward. Since the risk of "nothing" is already high in both, she reasons she might as well go for the $60,000.

  ### Summary
  Your friend’s choices are **psychologically normal but logically inconsistent**. She is prioritizing the emotional relief of "certainty" in the first decision while prioritizing the magnitude of the "potential gain" in the second. While this is how most humans behave, it violates the standard mathematical definition of rational decision-making.
