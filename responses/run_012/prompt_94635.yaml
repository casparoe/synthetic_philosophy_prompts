prompt: |-
  A friend of mine who's a grad student in cog sci keeps telling me that illusionism about phenomenal consciousness is basically eliminativism with better PR: that it says consciousness doesn't exist, that no one has ever actually felt pain or seen red, and that our sense of having an inner life is just a mistake we could in principle talk ourselves out of once we redescribe it. She also says the view is self-refuting, since you can't have an illusion of being conscious unless there's something it's like to be fooled, and that even if it were true we could never know it, so it isn't a real scientific claim anyway. Some of this sounds right to me and some of it feels like it's missing the point, but I don't know the literature well enough to say. Can you go claim by claim and tell me what someone who actually holds the view would accept, what's a distortion, and what's just wrong? And I'd like you to seperate what's genuinely settled from what's contested among people who work on this -- please don't give me one camp's line as if it were the consensus.
