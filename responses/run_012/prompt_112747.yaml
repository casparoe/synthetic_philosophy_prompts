  3.  **Evaluate Claims against Current Scholarship (Mental Knowledge Retrieval):**
      *   *Homicide rates:* Generally accepted that interpersonal violence (homicide) has declined in Europe over the long run (Eisner, etc.). *Verdict:* Broadly right, but data is spotty.
      *   *War deaths:* More contested. Per capita might be down, but absolute numbers and severity vary. The "Long Peace" is debated (is it peace or just nuclear deterrence? Is it statistical noise?). *Verdict:* Simplification/Contested.
