          4.  Incorporate/Refine User's 3 Tests: Payload, Free-Ride, Counter-Analogy Swap.
          5.  Run the procedure on 3 cases: (1) Gene regulatory network = decision board, (2) Model planning = search, (3) A case where the analogy is fine but the story is bad elsewhere.
          6.  Critique the procedure: Where will it misfire? What happened to the user's 3 tests?

  2.  **Think Out Loud / Brainstorming (Mental Draft):**
      *   *Hofstadter/Sander Lens:* Analogy isn't just a修辞 (rhetorical device); it's how we categorize. If you map "cell" to "factory," you aren't just decorating; you are telling the brain to categorize cellular processes as industrial manufacturing. This activates specific expectations (efficiency, waste, management, design).
      *   *Newsroom Reality:* Deadlines are tight. You can't read the full paper. You need heuristics. "Does the analogy break down?" is indeed useless because *all* analogies break down (map is not territory). The question isn't "is it perfect?" it's "where does the mapping lead the reader astray regarding the *specific claim* being made?"
      *   *User's Tests:*
          *   (1) Payload: Good. What is the specific inference being licensed?
          *   (2) Free-Ride: Excellent. What baggage comes along that wasn't paid for? (e.g., "factory" implies a designer).
          *   (3) Counter-Analogy: Tricky. Sometimes one analogy is just *better*, not just different. But if the claim collapses under a neutral swap, the claim was weak.
      *   *The "Fine Analogy/Bad Story" Case:* This is crucial. Sometimes the analogy is robust, but the *magnitude* is hyped, or the *novelty* is faked. The tool needs to separate analogy evaluation from general hype detection.
      *   *Values/Taste:* Deciding if a "free ride" is acceptable is often a values call. (e.g., Is it okay to imply design in biology for pedagogical ease?)

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Name:* Needs to sound practical. "The Analogy Audit"? "The Mapping Protocol"? Let's go with "The Analogy Stress Test."
      *   *Structure:* Quick Card (15 min) vs. Deep Dive (2 hours).
      *   *Refining User's Tests:*
          *   Payload -> "The Inference License."
          *   Free-Ride -> "The Baggage Check."
          *   Counter-Analogy -> "The Rival Mapping."
      *   *Stop Conditions:* If the analogy forces a false causal mechanism, STOP. If it implies agency where there is none, FLAG.

  4.  **Developing the Content:**

      *   *Intro:* Acknowledge the Hofstadter premise. Analogy is cognition, not decoration.
