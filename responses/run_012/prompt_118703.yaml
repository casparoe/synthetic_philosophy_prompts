      *   *The One-Page Card:* Needs to be punchy. Checkboxes.
      *   *The Long Version:* More nuance, looking for primary sources (even abstracts), checking expert quotes.
      *   *Values/Taste:* Explicitly mark where the journalist has to decide "is this misleading enough to kill?"
      *   *The Three Cases:*
          1.  *Gene Network = Board:* High risk. Implies centralized agency. Baggage: Intentionality.
          2.  *Model Planning = Search:* Technical nuance. "Planning" implies mental state. "Search" implies algorithm. Baggage: Consciousness/Intent.
          3.  *Fine Analogy/Bad Story:* Need a case where the map is good, but the territory is misrepresented (e.g., magnitude or novelty). Let's use "Brain is like a Computer" but the story claims a *new* discovery that old comp-neuro already knew. Or better: "Synapse is like a Transistor" (valid) but story claims "We found the switch" (hype).
      *   *Critique:* Where does it fail? Subtle math analogies. Metaphors that are culturally entrenched (hard to swap).
