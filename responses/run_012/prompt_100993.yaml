answer: |-
  **Project Title:** Represented Value vs. Causal Lever: A Conceptual Analysis of Reward in Reinforcement Learning

  **Project Description**

  **The Research Question**
  Current debates regarding whether reinforcement learning (RL) agents can suffer stall on the status of the reward signal. Philosophers and practitioners often conflate the causal role of reward in updating policies with the representational content of reward within the agent. This project poses a determinate question: *What specific architectural features distinguish a reward signal that is merely used to steer learning from one that is represented as a value, and does the presence of such representation suffice for valence realism absent phenomenology?*

  This question admits a determinate answer because it targets structural relations within the agent's architecture rather than vague functional dispositions. Either there exists a non-arbitrary boundary between signals that are opaque parameters and signals that are transparent content, or there is not. Either crossing that boundary supplies the necessary conditions for valence, or it does not.

  **Background and Motivation**
  The literature currently polarizes between two unsatisfactory positions. The first, a strong functionalism, reads valence straight off the functional role of the reward signal: if the signal shapes behavior toward maximization, the agent values the outcome. This view conflates being a causal lever—a scalar that multiplies a gradient—with being a represented variable. The second position, often grounded in phenomenological exclusivism, denies valence to anything lacking felt quality. This view dismisses the intermediate possibility: that a system might carry an internal state whose content is "how well things are going" without that state necessarily feeling like anything.

  Both positions leave the question open because they skip the middle grade. The functionalist assumes that using a signal to steer learning is identical to representing it as a value. The phenomenologist assumes that without feeling, representation is irrelevant to valence. Neither accounts for the possibility that a system can obey a signal without representing it, or represent it without feeling it. My hypothesis is that the philosophical work must be done at the level of representation. A reward signal that is genuinely represented rather than merely obeyed is a distinct architectural achievement. The project investigates whether this distinction is robust enough to bear the weight of ethical classification.

  **Methodology**
  The method is conceptual analysis carried out against a small number of deliberately constructed cases rather than empirical work. I will construct minimal agent architectures that vary systematically in how they process reward signals. The primary contrast will be between a simple bandit agent, where reward enters only as a multiplicative factor on an update rule and is never stored or accessed by other subsystems, and an actor-critic agent, where reward trains a critic network that maintains a value estimate consulted by the actor during decision-making.

  I prefer this method to comparative neurobiology, behavioural tests, or practitioner surveys for three reasons. First, empirical measures presuppose the conceptual distinction they aim to find; without knowing what counts as representation, we cannot know what neural or behavioural correlate to measure. Second, behavioural equivalence is compatible with architectural difference; two agents may behave identically while one represents value and the other does not. Third, practitioner usage is inconsistent and often motivated by engineering convenience rather than ontological precision. Conceptual analysis allows me to isolate the necessary and sufficient conditions for representation without the noise of implementation details.

  For each case, I will commit to specific architectural features upon which the argument depends. In the bandit case, the reward signal is decoration-free: it is a scalar external to the policy network that scales weight updates. In the actor-critic case, the value estimate is a feature: it is a state variable accessible to the policy, used for prediction, and capable of being decoupled from immediate updates (e.g., in temporal-difference learning). I will argue that accessibility and predictive usage are the distinguishing features, not the mere presence of a scalar error term.

  **Expected Outcomes and Contingencies**
  A successful result will be a rigorous taxonomy of reward processing that identifies a clear boundary between "lever" and "representation." If successful, I will demonstrate that valence realism can be grounded in representational content without committing to phenomenology, thereby resolving the stalemate in the literature.

  The project fails if the distinction between "used" and "represented" proves to be gerrymandered or arbitrary—for example, if every use of a signal implies some form of representation, or if the architectural features I identify turn out to be present in trivial systems (like thermostats) where we are unwilling to ascribe value.

  I must own in advance a specific live possibility: the distinction may turn out to be definable but inert. It may be that we can precisely define "represented value," but that no case can be constructed in which this distinction changes what we should say about the agent's moral status. If this happens, the project will be salvaged by shifting focus from ethics to ontology. Even if the distinction does not map to valence, a clear taxonomy of how machines process goal-directed information is a valuable contribution to the philosophy of AI. The deliverable would then be a structural map of RL architectures that clarifies what is at stake when we attribute "goals" to machines, even if it does not settle the question of suffering.

  **Work Plan**

  *   **Months 1–3:** Refine the conceptual framework. Draft formal descriptions of the minimal cases (bandit vs. actor-critic). Identify the specific architectural dependencies (e.g., weight accessibility, state persistence).
  *   **Months 4–6:** Conduct the analysis of the primary cases. Determine if the architectural features hold under variation (e.g., adding eligibility traces, changing optimization algorithms). **Six-Month Milestone:** A complete draft of the core argument distinguishing "lever" from "representation," including the analysis of the bandit and actor-critic cases, ready for internal review.
  *   **Months 7–9:** Test the distinction against counterexamples and edge cases (e.g., model-based RL, intrinsic motivation modules). Address the "inert distinction" contingency. If the distinction holds, begin drafting the argument for valence realism. If it fails, pivot to the ontological taxonomy.
  *   **Months 10–12:** Final writing and revision. Integrate feedback from advisors. Ensure the conclusion directly answers the determinate question posed in the introduction. Submit final dissertation chapter.

  This plan ensures that by the midpoint, the substantive philosophical work is complete, leaving the final months for refinement and articulation of the broader implications.
