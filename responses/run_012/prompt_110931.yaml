  **THE CALDER INSTITUTE**
  **MEMORANDUM OF FOUNDING PRINCIPLES AND RESIDUAL DISSENSUS**

  **Date:** 14 October 2023
  **Signatories:** The Two Surviving Founders
  **Subject:** The Status of Interpersonal Comparisons of Welfare

  **PREAMBLE**

  Forty years have passed since the establishment of this Institute. Throughout this period, the undersigned have maintained a continuous dispute regarding the admissibility of interpersonal comparisons of welfare within social choice theory. We acknowledge that this dispute remains unresolved. We further acknowledge that the continued operation of the Institute requires not that we converge, but that we codify the precise geometry of our divergence.

  We hereby reaffirm our joint commitment to the Institute's House Rule. We agree that any claim regarding the relative welfare of two persons shall be admitted to formal consideration only if it satisfies three limbs: **Determinacy** (is there a fact of the matter?), **Access** (is there a named route to that fact?), and **Service** (can the fact guide a necessary decision?).

  We sign this document not to declare a truce, but to record that our disagreement is substantive, not merely temperamental. We agree on the rules of engagement; we disagree on the nature of the territory.

  **I. JOINT AFFIRMATIONS**

  1.  **The Necessity of Choice:** We agree that social choices must be made. Resources are scarce, suffering exists, and policy cannot await metaphysical certainty. The refusal to decide is itself a decision with welfare consequences.
  2.  **The Validity of Intrapersonal Comparison:** We agree that a single individual may compare their own welfare across time. We agree that an individual may rank their own preferences ordinally without logical contradiction.
  3.  **The House Rule as Gatekeeper:** We agree that the three limbs (Determinacy, Access, Service) constitute the sole criteria for admissibility of welfare claims within Calder models. No claim bypasses this rule by appeal to intuition or moral urgency.
  4.  **The Risk of Error:** We agree that both false precision and false paralysis carry costs. To compare where no comparison exists is to distort; to refuse comparison where one is required is to abdicate.
  5.  **The Semantic Contingency:** We agree that a portion of our quarrel rests on the usage of language. We commit to distinguishing where we disagree about the world and where we disagree about the words used to describe it.

  **II. DIVERGENT READINGS OF THE HOUSE RULE**

  While we have signed the House Rule, we apply its limbs differently. The following readings stand side by side without reconciliation.

  | Limb | The Ordinal Reading (First Signatory) | The Comparativist Reading (Second Signatory) |
  | :--- | :--- | :--- |
  | **Determinacy** | There is no fact of the matter regarding the relative intensity of experience between two minds. To assert one person is 'worse off' than another is to express a moral preference, not a truth-apt proposition. | There is a fact of the matter. Human beings share a common biology and psychology. Suffering and flourishing are real states that admit of magnitude, regardless of the difficulty in measuring them. |
  | **Access** | No public route exists to verify such claims. Introspection is private; behaviour is ambiguous. Any 'metric' proposed is merely a convention disguised as a measurement. | Access is imperfect but possible. We rely on testimony, physiological markers, and behavioural trade-offs. Intersubjective agreement among competent observers constitutes a valid route. |
  | **Service** | Using non-factual comparisons in decision-making corrupts the model. It grants the illusion of scientific rigour to ethical stipulations. Better to state the ethical weight explicitly. | Refusing to use available comparisons renders the model useless. A theory that cannot distinguish between a headache and a massacre has bought rigour at the price of irrelevance. |

  **III. TABLE OF RESIDUAL DISAGREEMENTS**

  The following table sets out the specific cruxes upon which our positions turn. For each, we identify a case or argument that bears on the question, and we record our predictions regarding how evidence or analysis would resolve it.

  | Disagreement | Crux (Sub-question) | Bearing Case / Argument | Ordinal Prediction | Comparativist Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Nature of 'Worse'** | Is the statement "A's pain is worse than B's grief" a description of a state of the world, or a prescription for priority? | **The Case of the Siblings:** A woman suffers chronic, severe physical pain. Her brother suffers acute, debilitating grief following the loss of a child. Both request the same limited course of therapeutic treatment. | The question "whose suffering is worse?" has no truth value. The question actually being asked is "whom *ought* we to treat?" This is a moral verdict, not a welfare comparison. | The question has a truth value. Even if treatment priority depends on other factors (e.g., efficacy), the magnitude of the suffering itself is comparable. We can know whose state is more severe. |
  | **The Source of Normativity** | If we cannot measure welfare directly, does the act of comparing create the value, or discover it? | **The Argument from Consensus:** In ordinary life, law, and medicine, people consistently agree on rough rankings of misery (e.g., torture vs. inconvenience). | This consensus reflects shared moral training and evolutionary instinct, not shared access to a 'utility meter'. We agree on the verdict, not the fact. | This consensus reflects a shared capacity to recognise states of being. If it were merely moral, we would expect wilder cultural variance. The stability suggests observation. |
  | **The Cost of Prohibition** | What is the greater danger: incorporating noisy data, or incorporating no data? | **The Policy Test:** A government must allocate funds between palliative care (pain relief) and mental health support (grief/trauma). | Prohibiting comparison forces the decision-maker to declare their ethical weights openly. This increases transparency. | Prohibiting comparison forces the decision-maker to hide their ethical weights behind a facade of 'preference satisfaction'. This increases hypocrisy. |

  **IV. THE SEMANTIC CLAUSE**

  We acknowledge that part of our quarrel concerns words rather than the world.

  1.  **Where we disagree about words:** We disagree on the definition of "welfare." The First Signatory defines it strictly as the satisfaction of ordered preferences. The Second Signatory defines it to include the intensity of experienced states (pleasure, pain, anguish). We acknowledge that if we adopted a single definition, some rows in the table above would collapse. However, we refuse to adopt a single definition, as each captures a vital aspect of human concern that the other omits.
  2.  **Where we disagree about the world:** We disagree on the existence of a bridge between minds. The First Signatory holds that the privacy of experience is an ontological barrier. The Second Signatory holds that it is an epistemological hurdle. No amount of linguistic clarification will settle this; it requires a resolution on the nature of consciousness itself.

  **V. COMMITMENT TO THE CRUX**

  We agree that the following developments would force a revision of this Memorandum:

  *   **For the First Signatory:** If it were demonstrated that interpersonal comparisons could be made without importing ethical premises, and that such comparisons predicted behavioural outcomes better than ordinal models alone, the Ordinal Reading would be abandoned.
  *   **For the Second Signatory:** If it were demonstrated that all proposed routes of Access rely necessarily on a prior ethical commitment (e.g., weighting one type of testimony over another), the Comparativist Reading would be abandoned.

  Until such time, we agree to disagree. We agree that the Calder Institute shall house both positions. We agree that the tension between them is not a flaw in the Institute, but the engine of its work.

  **Signed,**

  *The First Signatory*
  *(Holding that comparisons are moral verdicts wearing the costume of fact)*

  *The Second Signatory*
  *(Holding that a theory forbidden from comparing welfare has nothing to say)*
