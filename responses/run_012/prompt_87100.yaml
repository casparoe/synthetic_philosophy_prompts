      *   Needs to target the *transitivity* of "realness" across reference frames.
      *   Needs to address the counter-direction (Andromeda Paradox style).
      *   *Draft:* Dana says relativity proves the future exists. Write an essay finding the hidden assumption. What happens if we reject it? Also, if someone moves the other way, does their "past" become our "future," and does that break the argument?
