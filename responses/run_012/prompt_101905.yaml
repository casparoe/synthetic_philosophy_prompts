  hey so I'm trying to get Mill's harm principle straight and I think I've built it on a wrong assumption somewhere. Heres my picture: the harm principle says you can only restrict speech to prevent harm to others, and because Mill was writing way before anyone had a clean word for mere offense, that piece got added later — Feinberg's offense principle, which is really just Mill's harm principle stretched so it also covers being insulted or disgusted. So on my reading every hate-speech or flag-burning law is just Mill-plus-Feinberg, and the only real question is how much offense we're willing to put up with. But then people keep telling me the corn dealer example is Mill's own case where he says the speech can be punished, which would mean he did think offense could be restricted — and if so my whole Mill-then-Feinberg story falls apart. So which is it? Where did I go wrong, what was Mill actually doing with the corn dealer, and where does offense fit if its not just harm? Please answer in British English, and no reading list needed, just explain the reasoning.
