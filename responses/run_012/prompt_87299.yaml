  I'm a first-year MA student and I have to turn in a dissertation prospectus (like 8-10 pages) by the end of term, so I need help getting a half-baked idea into a real proposal. It got personal a few months ago: a close friend died after a hospital never ordered a scan their own protocol said to order, and at the inquest everyone kept saying the failure caused the death, but I honestly couldn't tell if that was a claim about causation or just about blame. So I started reading on causation by omission, and I think there's a question people skate past: when an omission and an action lead to the exact same outcome through the exact same chain of events, we still treat the omission as the weaker cause -- and I suspect that isn't really about causation at all. My half-formed guess is that the felt weakness tracks substitutability: if lots of people could have done the missing thing, each individual omission feels less causally potent, and if only one person could have, it feels more. I want a project that could actually decide between that and the boring explanation, which is that we're just smuggling in norms of duty and calling the result causation.

  Write me the prospectus: pin the question down so it has a determinate answer, say why the usual positions on omission causation (omissions are causes, they aren't, they're causes only when there's a duty to act) don't settle it, lay out what I'd actually do month by month and why that method beats the obvious alternatives, describe what a result would look like and what would count as the project failing, and keep the scope realistic for one term. Skip citations, I'll fill those in myself.
