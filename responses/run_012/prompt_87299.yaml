answer: |-
  **Dissertation Prospectus**

  **Title:** The Weight of Nothing: Disentangling Normative Duty from Substitutability in Causal Judgments of Omission

  **1. Introduction and Motivation**

  Causal judgments regarding omissions are notoriously unstable. When an agent fails to act, and that failure results in harm, we are often willing to say the omission *caused* the harm, yet we hesitate to accord it the same causal weight as a positive action that would have produced the identical outcome through an identical physical chain. This intuition persists even when the counterfactual dependencies are symmetrical. If a doctor injects a lethal toxin, she kills the patient. If a doctor fails to inject a life-saving antitoxin, she lets the patient die. In many legal and moral contexts, these are treated differently, but even in pre-theoretical causal cognition, the omission often feels like a "weaker" cause.

  The standard explanation for this asymmetry is normative. According to the Dominant Normative Account, an omission is only salient as a cause when there is a pre-existing duty to act. On this view, the "weakness" of omission causation is not a feature of causation at all; it is a feature of blame. We treat the omission as less causally potent because we are reluctant to assign blame without a specific duty, and we smuggle this reluctance into our causal language.

  However, this explanation may be incomplete. It conflates the *obligation* to act with the *opportunity* to act. Consider a scenario where a specific agent has a strong duty to act, but they are one of hundreds who could have easily done so. Contrast this with a scenario where an agent has no specific duty, but they are the *only* person physically capable of preventing the harm. In the first case, duty is high, but substitutability is high. In the second, duty is low, but substitutability is low.

  My proposed research investigates the hypothesis that the felt causal weakness of omissions tracks **substitutability** (the modal availability of other potential interveners) rather than, or in addition to, **normative duty**. This project arises from the observation that in institutional failures—such as medical protocol breaches—the inquest often focuses on the specific agent who failed, even when the systemic redundancy suggests the outcome was robustly determined regardless of that specific agent's choice. If the causal intuition is driven by substitutability, then increasing the number of potential substitutes should decrease the perceived causal potency of the specific omission, independent of the duty assigned to that agent.

  This distinction is not merely semantic. If the "weakness" of omission causation is normative, then correcting the causal judgment requires correcting the moral framework. If the weakness is structural (based on substitutability), then our causal cognition is tracking a modal feature of the world that the Normative Account ignores. This project aims to isolate these variables to determine which better predicts causal attribution in omission cases.

  **2. The Research Question**

  The central research question is determinate and binary in structure:

  *Does the variance in perceived causal strength of an omission correlate more strongly with the agent's normative duty to act, or with the modal substitutability of the agent?*

  To make this empirically and conceptually tractable, I will operationalize "causal strength" as the willingness of subjects (or the coherence of a philosophical intuition) to endorse strong causal claims (e.g., "The doctor's failure *caused* the death" vs. "The doctor's failure *allowed* the death") and to assign counterfactual dependence specifically to that agent.

  The project tests two competing hypotheses:
  1.  **The Normative Hypothesis (Null):** Causal attribution for omissions is primarily a function of duty. High duty yields high causal potency, regardless of how many others could have acted.
  2.  **The Substitutability Hypothesis (Alternative):** Causal attribution for omissions is primarily a function of uniqueness. Low substitutability (the agent was the only one who could act) yields high causal potency, regardless of the level of duty.

  **3. Why Existing Positions Do Not Settle the Question**

  The literature on causation by omission generally falls into three camps, none of which adequately disentangles duty from substitutability.

  **A. The Ontological View**
  This position argues that omissions are not events; they are absences of events. Therefore, they cannot be causes in the same sense as positive actions. While this explains why omissions feel different, it fails to explain the *gradient* of causal intuition. We do not treat all omissions equally. We treat a lifeguard's failure to save a drowning swimmer differently than a bystander's failure to save the same swimmer. If omissions are simply "nothing," they should all be causally inert. The fact that we distinguish between them suggests the ontology is not the sole driver of the intuition. Furthermore, this view does not distinguish *why* the lifeguard is singled out—is it their duty or their unique position?

  **B. The Counterfactual View**
  Standard counterfactual theories of causation (e.g., Lewisian accounts) treat actions and omissions symmetrically. If the effect would not have occurred but for the omission, the omission is a cause. This captures the logic of the hospital inquest (if the scan had been ordered, the death would have been prevented). However, this view struggles to explain why we hesitate to call the omission a "cause" in the same robust sense as an action. It predicts symmetry where our intuitions report asymmetry. It also fails to account for the "weakness" intuition. If the counterfactual dependence is identical, the causal status should be identical. The fact that it feels weaker suggests a variable is missing from the counterfactual model.

  **C. The Normative View**
  This is the strongest rival to my hypothesis. Proponents argue that we select omissions as causes based on what *should* have happened. The "weakness" is actually moral hesitation. However, the Normative View typically assumes that duty and ability are co-extensive in standard cases. It rarely tests cases where duty and ability come apart. For example, in a large bureaucracy, many people may have a derivative duty to ensure a protocol is followed, but only one person has the physical access to click the button. The Normative View predicts the person with the primary duty bears the causal weight. The Substitutability Hypothesis predicts the person with the unique access bears the causal weight, even if their duty is shared.

  Current literature has not rigorously tested these variables against each other because it often treats "breach of duty" as a monolithic category. By breaking "breach of duty" into "obligation" and "opportunity," this project exposes a gap that existing theories skate past.

  **4. Methodology**

  To decide between the Normative and Substitutability hypotheses, I will employ a method of **Controlled Intuition Analysis**. While experimental philosophy (X-Phi) using large-scale surveys is an option, the scope of a one-term MA thesis requires a more focused, qualitative conceptual analysis that mimics experimental controls. I will construct a series of "minimal pair" thought experiments where variables are isolated.

  **The Experimental Design (Conceptual)**
  I will construct four primary scenarios, varying Duty (High/Low) and Substitutability (High/Low).

  1.  **High Duty / Low Substitutability:** A specialized surgeon is on call. Only they can perform the procedure. They fail to show. (Both theories predict high causal potency).
  2.  **High Duty / High Substitutability:** A hospital ward has ten nurses on duty, all equally trained and responsible for monitoring a patient. All fail to notice a decline. We focus on Nurse A. (Normative predicts high potency for Nurse A; Substitutability predicts low potency for Nurse A specifically).
  3.  **Low Duty / Low Substitutability:** A passerby is the only person near a drowning child. They have no legal or professional duty. They fail to act. (Normative predicts low potency; Substitutability predicts high potency).
  4.  **Low Duty / High Substitutability:** A crowd watches a drowning child. No one has a specific duty. Person A fails to act. (Both predict low potency).

  **Data Collection and Analysis**
  Rather than relying solely on my own intuitions, which risks bias, I will subject these scenarios to a "panel test." I will present these minimal pairs to a small, diverse group of peers (n=10-15) who are not specialists in metaphysics. I will ask them to rate the causal strength of the specific agent's omission on a Likert scale and, crucially, to justify their rating in writing.

  The analysis will focus on the *justifications*. If the Normative Hypothesis holds, participants in Scenario 2 should cite the nurse's responsibility. If the Substitutability Hypothesis holds, participants should express hesitation about blaming Nurse A specifically, citing that "anyone could have done it," thereby reducing the causal link to *that* nurse.

  This method beats the obvious alternative (pure armchair reflection) because it introduces intersubjective verification. It beats the alternative of a full-scale quantitative study because it allows for the nuance of *why* a judgment was made, which is necessary to distinguish between conflated concepts. A survey might show a correlation; this method aims to show the *mechanism* of the intuition.

  **5. Work Plan and Timeline**

  The project is designed for completion within one academic term (12 weeks). This scope is realistic for an MA thesis that prioritizes depth of analysis over breadth of data.

  **Month 1: Refinement and Literature Mapping**
  *   **Weeks 1-2:** Finalize the definitions of "Substitutability" and "Causal Potency." Ensure the distinction between "could have" (modal) and "should have" (normative) is watertight.
  *   **Weeks 3-4:** Construct the four minimal pair scenarios. Pilot these on two or three peers to ensure they are not ambiguous. If Scenario 2 (High Duty/High Sub) is read as "collective responsibility" rather than "individual omission," it must be rewritten to focus on individual causal contribution.
  *   **Deliverable:** A finalized chapter outline and the scenario set.

  **Month 2: Data Collection and Preliminary Analysis**
  *   **Weeks 5-6:** Conduct the panel interviews. Present the scenarios individually to avoid groupthink. Record the responses.
  *   **Weeks 7-8:** Transcribe and code the responses. Look for keywords indicating normative reasoning ("should," "responsibility," "job") versus modal reasoning ("only one," "could have," "someone else").
  *   **Deliverable:** A coded dataset of intuition justifications.

  **Month 3: Synthesis and Drafting**
  *   **Weeks 9-10:** Write the core argument. Compare the coded responses against the predictions of the Normative and Substitutability hypotheses.
  *   **Week 11:** Address counter-arguments. (e.g., Is substitutability just a proxy for duty? If many people can act, does the duty dilute?)
  *   **Week 12:** Final revision, formatting, and submission.
  *   **Deliverable:** Final Thesis (approx. 15,000 words).

  **6. Expected Results and Significance**

  There are three possible outcomes for this project:

  1.  **Confirmation of Substitutability:** The data shows that when substitutability is high, causal potency drops, even when duty remains high. This would suggest that our causal cognition tracks modal features of the situation (how many ways the world could have been different) rather than just normative features. This would require a revision of the Normative Account to include a "uniqueness condition."
  2.  **Confirmation of Normative Account:** The data shows that duty swamps substitutability. Participants assign high causal potency to the nurse in Scenario 2 regardless of the other nurses. This would reinforce the standard view that omission causation is fundamentally a moralized concept.
  3.  **Interaction Effect:** The data shows that both matter. High duty + Low substitutability = Maximum potency. High duty + High substitutability = Moderate potency. This would be the most philosophically rich result, suggesting that omission causation is a hybrid concept requiring both a normative hook and a modal anchor.

  **Significance:**
  If the Substitutability Hypothesis holds, it has implications beyond metaphysics. In legal contexts (like the inquest that motivated this project), establishing causation is often a prerequisite for liability. If jurors perceive causation as weaker when substitutability is high, they may be less likely to find liability even when duty is clear. Understanding this cognitive mechanism could inform how protocols are written: if a protocol assigns duty to a specific individual, it must also restrict substitutability (make them the *only* one who can act) to ensure the causal link remains salient in the event of failure.

  **7. Limitations and Failure Conditions**

  **Scope Limitations:**
  This project will not solve the metaphysical problem of whether omissions *are* causes. It addresses only the *asymmetry intuition* regarding causal strength. It accepts that we talk about omission causation and asks why we talk about it the way we do.

  **Failure Conditions:**
  The project would be considered to have failed under the following conditions:
  1.  **Indistinguishability:** If the panel consistently conflates duty and substitutability (e.g., they assume that if many people can act, no one has a duty), then the variables cannot be isolated, and the hypothesis is untestable via this method.
  2.  **Noise:** If the intuitions are too varied (no consensus pattern emerges), it suggests that "causal potency" is not a stable concept across subjects, rendering the search for a single explanatory variable futile.
  3.  **Triviality:** If Substitutability turns out to be merely a subset of Duty (i.e., we only feel someone has a duty if they are the only one who can act), then the Substitutability Hypothesis collapses into the Normative Account. I will address this in Month 1 by ensuring the scenarios clearly separate *ability* from *obligation*.

  **Risk Mitigation:**
  To mitigate the risk of conflation (Failure Condition 1), I will include a comprehension check in the scenarios. Participants will be explicitly asked to confirm that in the High Substitutability case, the other agents *were* capable of acting but *did not* have the specific duty of the target agent. If they cannot hold these concepts apart, I will pivot the thesis to analyze *why* they are conceptually fused, which is itself a valuable philosophical result.

  **8. Conclusion**

  The intuition that omissions are "weaker" causes than actions is a persistent feature of our causal reasoning. The standard explanation attributes this to moral norms. This project proposes that a structural feature—substitutability—plays a critical, overlooked role. By isolating these variables through controlled conceptual analysis, this thesis aims to provide a more granular account of omission causation. This is not merely an academic exercise; it clarifies how we assign responsibility in complex systems where failure is often a product of collective inaction. If we mistake substitutability for duty, we risk misdiagnosing the causal structure of institutional failure.

  The scope is tight, the methodology is tailored to the term limit, and the question admits of a clear answer. Whether the result confirms the Substitutability Hypothesis or reinforces the Normative Account, the process of disentangling them will yield a clearer understanding of how we navigate the causality of nothing.

  ***

  **Appendix: Preliminary Scenario Draft (Example for Month 1)**

  *Scenario A (High Duty / High Sub):* Dr. X is the attending physician. Protocol states Dr. X must order a scan. However, Nurses Y and Z are also trained to flag the need for a scan and have the authority to request it. No one orders the scan. Patient dies.
  *Question:* To what extent did Dr. X's failure *cause* the death compared to the Nurses' failure?

  *Scenario B (Low Duty / Low Sub):* Dr. X is a visitor in the hospital. Protocol does not apply to them. However, Dr. X is the only person in the room with the access code to order the scan. No one orders the scan. Patient dies.
  *Question:* To what extent did Dr. X's failure *cause* the death?

  *Prediction:* If Normative Account wins, A > B. If Substitutability wins, B > A.

  ***

  **Note on Personal Context**
  While this project originates from a personal encounter with institutional failure, the prospectus maintains a methodological distance. The personal stake serves as a heuristic for identifying the problem but does not dictate the conclusion. The rigorous separation of variables in the methodology is designed specifically to prevent personal bias regarding the hospital's failure from influencing the analysis of the general principle.

  **[End of Prospectus]**
