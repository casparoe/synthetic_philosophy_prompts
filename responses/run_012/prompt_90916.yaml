answer: |-
  Right, let's have a proper look at this. You and Dan have been at this for a year, and frankly, your list is a proper mess of contradictions. That's not an insult; it's the only honest place to start. You're trying to find a single rule for something that wobbles depending on whether you're holding the object, standing in the gallery, or just feeling chuffed about it.

  However, there is a principle hiding in your gut feelings, though it's stricter than you want it to be. I'd call it **The Principle of Deliberate Framing**.

  Here is the rule: **Something becomes art when a human agent deliberately removes it from the flow of utility or nature and presents it to be encountered primarily for the experience of it.**

  It's not about beauty (the driftwood might be ugly). It's not about skill (the nephew can't draw). It's not even about making (the driftwood was found). It is about the **human act of saying "look at this, not for what it does, but for what it is."**

  Now, let's apply this ruthlessly. I'm not going to spare your feelings, because you asked for the truth, not a pat on the back.

  ### Where You're Right
  Your rule holds up well on the **Bowerbird**. No human framing, no art. It's nature, however brilliant.
  It holds on the **Driftwood vs. Pebble**. The driftwood was screwed to a wall (framed for regard); the pebble went in a pocket (kept for private utility/sentiment). One is a display, one is a souvenir.
  It holds on the **Chatbot**. The raw poem is utility (output); the curated booklet is framing (selection and arrangement constitute the creative act).
  It holds on the **War Memorial vs. Film Set**. One is intended for public regard and memory; the other is a tool for making a film. Once the film is done, the prop is scrap.
  It holds on the **Gardens**. Your uncle is shaping an experience; your mate is maintaining a lawn. One is composition, one is chore.

  ### Where You're Wrong (The Hard Bits)
  Here is where your gut betrays you, and where you'll have to drop a verdict if you want a consistent rule.

  **1. The Teapot vs. The Cake**
  You say the hand-thrown teapot is art, but the birthday cake is not. This is your biggest contradiction.
  Both are functional craft. Both involve skill and pride. Both are meant to be used. The only difference is that one is ceramic and one is edible.
  *The Verdict:* If the teapot is art because you "make tea in it," then the cake was art until you ate it. If the cake is not art because it's "just a cake," then the teapot is not art, it's **craft**.
  *The Fix:* You need to decide if functional objects can be art. If yes, the cake was art. If no, the teapot is just a nice pot. My advice? Drop the teapot. A thing you use every day is rarely art; it's design. Art demands a bit of distance.

  **2. The Elephant Paintings**
  You say these are not art. But under your own logic with the Chatbot, they should be.
  With the Chatbot, you said the *selection* made it art. With the elephant, the keeper selects the elephant, the colours, and the canvas. The elephant is the brush. If the curated Chatbot poems are art because of human curation, the elephant paintings are art because of the keeper's curation.
  *The Verdict:* You're letting your dislike of the exploitation cloud the definition. If you keep the Chatbot verdict, you must accept the Elephant paintings as art (however unethical the production).
  *The Fix:* Either admit the elephant paintings are art (made by the keeper, using the elephant), or admit the Chatbot booklet isn't art either. You can't have it both ways.

  **3. The Train vs. The Fireplace**
  This is a shaky distinction. Both are ambient streams. You're calling the train art because it was on the telly, and the fireplace not art because it's a livestream.
  *The Verdict:* This is purely Institutional Theory (it's art because the BBC said so). If the fireplace stream is watched by thousands for the *experience* of the fire, it fits the "Framing" rule.
  *The Fix:* If you watch the fire for the vibe, it's art. If you watch the train to fall asleep, it's not. The medium doesn't matter; the engagement does.

  ### The Three You Can't Decide
  Here is what the Principle of Deliberate Framing says about your undecideds.

  **1. The Forger's Copy**
  *Verdict:* **It is art, but it is a lie.**
  The forger has deliberately framed an image to be encountered for its own sake. The skill and the intent to create an aesthetic experience are there. The fraud is about *provenance*, not ontology. It is a painting. It functions as art. It just claims to be a different art than it is. Don't confuse criminality with categorisation. It's art, just not the art it claims to be.

  **2. The Ruined Painting**
  *Verdict:* **Not a new artwork.**
  The flood was not a human agent framing the experience. It was chaos. Unless you, the artist, look at the ruin, sign it, and say "This damage is now the piece," it remains a damaged object. Art requires intent. Accidents are just accidents until a human claims them. If you leave it in the cellar, it's damp. If you hang it and call it *Flood Study No. 5*, it becomes art. The frame makes the art, not the water.

  **3. Gran's Recording**
  *Verdict:* **Art.**
  This fits the Driftwood rule. Your cousin took a slice of reality (Gran talking) and removed it from the flow of time by recording it. By keeping it, showing it, or even just the act of choosing to record *that* moment, they framed it. It is no longer just a conversation; it is a document of a life, presented for regard. It is "Readymade" art. The lack of artistic intent from Gran is irrelevant; the artistic intent lies with the cousin who pressed record and preserved it.

  ### The Summary for Dan
  If you want to win this argument, here is your position:

  **Art is not about the object; it is about the relationship.**
  It is the relationship between a human framer and an audience (even if the audience is just the framer).
  *   **Drop the Teapot:** Call it craft. It keeps the definition clean.
  *   **Keep the Driftwood:** It proves making isn't required, only framing.
  *   **Accept the Elephant:** It proves the "artist" can be the curator, not just the hand holding the brush.
  *   **Accept Gran's Recording:** It proves that selection is a creative act.

  If you hold to that, you stop arguing about "what is beautiful" and start arguing about "who is framing what." And that's a much better pub conversation.
