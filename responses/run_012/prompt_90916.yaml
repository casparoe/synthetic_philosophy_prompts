          2.  Propose the Principle ("The Frame of Regard").
          3.  Apply the Principle (Where it works).
          4.  The Hard Truths (Where the user is inconsistent/wrong).
          5.  The Three Undecided Cases.
          6.  Conclusion.

      *   *Refining the Principle:* Let's call it **"The Principle of Deliberate Framing."** Art happens when a human agent removes something from the flow of utility or nature and presents it specifically to be experienced.
      *   *Critique:* The Teapot/Cake distinction is the weakest link in the user's logic. I need to hammer that. Also the Elephant/Chatbot parallel.

      *   *British English Check:* "Mate," "Telly," "Sellotaped," "Gran," "Colour," "Organised," "Centre," "Realise." (The prompt already uses British slang, so match that).

  8.  **Final Review against Constraints:**
