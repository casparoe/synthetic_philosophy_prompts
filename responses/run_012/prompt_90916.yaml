  3.  **Identify the Underlying Tension:**
      *   The user oscillates between *Intentionalism* (did someone mean it to be art?), *Institutional Theory* (is it in a gallery/context?), *Aestheticism* (is it beautiful/interesting?), and *Functionalism* (is it used?).
      *   *Key Conflict:* The Driftwood vs. Bowerbird (both no maker intent, but one is art). The Teapot vs. Cake (both functional craft, but one is art). The Tiler vs. Gallery Tiler (same object, different context). The Nephew vs. Elephant (both non-professional/non-human agents).

