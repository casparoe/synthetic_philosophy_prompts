      *   *Mate's Garden:* Not Art. (Fits: Maintenance/Utility).

      *   *Major Inconsistencies to Highlight:*
          1.  **Teapot vs. Cake:** Both are functional crafts. If the teapot is art because of "pride in pattern," the cake should be too. If the cake is food, the teapot is crockery. The user must drop one.
          2.  **Elephant Painting:** If the Chatbot booklet is art because of *human curation*, the Elephant painting is arguably art because of *human curation* (the keeper sets it up). If the Elephant is not art because the elephant didn't intend it, the Chatbot raw poem should be the same (but the user already distinguishes raw vs. curated). The Elephant verdict is shaky.
