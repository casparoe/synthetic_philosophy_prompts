      *   *Option A: One Subject.* If the "I think" can logically accompany both streams (even if they don't talk to each other empirically), there is one transcendental subject. The disunity is empirical (pathological).
      *   *Option B: Two Subjects.* If the synthesis required for the "I think" cannot bridge the gap, are there two "I thinks"?
      *   *Kant's Constraint:* Kant insists TUA is a *condition of possibility*. If there is experience happening in the right hemisphere, there must be a unity of apperception for *that* experience. If there is experience in the left, there must be one for *that*.
