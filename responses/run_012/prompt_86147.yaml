      *   *Paralogisms of Pure Reason:* Kant argues against rational psychology claiming the soul is a simple, identical substance based on the unity of apperception. He says we know the *function* of unity, not the *substrate*.
      *   *Noumenal vs. Phenomenal:* The "subject" as it is in itself (noumenal) is unknown. The "subject" as appearance (phenomenal) is the object of inner sense.

