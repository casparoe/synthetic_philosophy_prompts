answer: |-
  The name you are looking for is **Moore's Paradox**.

  It is named after G.E. Moore, who identified the peculiar status of sentences of the form "$P$, but I do not believe that $P$." Wittgenstein later made it a central puzzle of his philosophy of psychology. You have correctly identified that it is not a logical contradiction; the world could easily contain a fact $P$ alongside a person who fails to believe it. The paradox lies not in the *proposition* expressed, but in the *utterance* of it.

  You asked for the joints. Here is the analysis of the defect, the boundaries of the phenomenon, and the status of your difficult cases.

  ### 1. The Defect: Assertion and Expression
  The defect is pragmatic, not semantic. It resides in the norms governing the act of assertion.

  When you assert a proposition $P$ (e.g., "The grant will come through"), you are not merely describing the world; you are performing an act that, by convention and rational necessity, presents you as believing $P$. To assert is to express belief. This is not a causal consequence (you might be lying), but a constitutive norm: if you assert $P$ while openly admitting you lack the belief, you violate the conditions that make assertion intelligible as a communicative act.

  The sentence has two halves:
  1.  **The Commitment:** "$P$." In uttering this, you *show* the audience that you believe $P$.
  2.  **The Disavowal:** "I do not believe $P$." In uttering this, you *tell* the audience that you do not believe $P$.

  The paradox arises because the first half *manifests* a state of mind that the second half *denies*. You cannot coherently manifest a mental state while simultaneously reporting its absence. The "joints" are the connection between the **force** of the speech act (assertion) and the **sincerity condition** (belief). When you sever that connection within a single breath, the utterance becomes pragmatically self-defeating. It is not that the sentence is false; it is that it cannot be *asserted* without undermining the authority of the asserter.

  ### 2. Why It Tracks Tense, Person, and Register
  You noted the defect vanishes in the past tense, third person, or private registers. This confirms the defect is in the *act*, not the *content*.

  *   **Person:** "He believes $P$ but does not believe $P$" is a report on two different objects (the world and his mind). There is no performative clash because *you* are not asserting $P$; you are asserting *that he asserts* $P$. The tension only exists when the speaker is the locus of both the assertion and the belief report.
  *   **Tense:** "I believed $P$ but did not believe $P$" describes a past psychological conflict (self-deception, confusion). This is psychologically possible. The paradox requires the *present* tense because the assertion is happening *now*. The manifestation of belief must coincide with the denial of belief.
  *   **Register:** In a private diary, the norm of assertion is relaxed. You are not communicating to an audience; you are exploring your own uncertainty. The utterance functions more as a expression of ambivalence ("Part of me thinks the grant will come... part of me thinks it won't") than a flat assertion followed by a retraction. In a memo, the normative pressure to be sincere and decisive is high, making the paradox acute.

  ### 3. The Verb Variations: A Family of Cousins
  You asked whether 'know', 'remember', and 'intend' versions are the same phenomenon. They are a family, bound by the **Transparency Condition**.

  *   **Belief:** As discussed. Asserting $P$ expresses belief in $P$.
  *   **Knowledge:** "P, but I don't know P." This is also Moore-paradoxical. On many views, the norm of assertion is knowledge (you should assert only what you know). Asserting $P$ implies you take yourself to know $P$. Denying knowledge while asserting creates the same pragmatic clash.
  *   **Intention:** "I will $\phi$, but I do not intend to $\phi$." This is the **Commissive** variant. When I say "I will," I am not just predicting the future; I am expressing an intention. To deny the intention is to pull the rug out from under the prediction.

  **The Boundary:** The boundary is drawn at **expression**. Does the first clause *express* the mental state denied in the second?
  *   "It is raining, but I don't believe it." (Paradoxical: Assertion expresses belief.)
  *   "It is raining, but I don't know it." (Paradoxical: Assertion implies claim to knowledge.)
  *   "It is raining, but I don't hope it is." (Not paradoxical: Assertion does not express hope.)

  ### 4. The Group Agent Case
  "The committee has concluded that the building is sound, though none of us believes it is."

  This sentence is usable because it separates **institutional fact** from **psychological state**.
  *   **Clause 1:** Reports an institutional act ("The committee has concluded"). This is a matter of record, voting, or procedure. It does not require the speaker to currently assert the soundness of the building *on their own authority*.
  *   **Clause 2:** Reports the private psychological states of the members.

  The paradox dissolves because the "commitment" in the first half is attributed to the *body*, not the *speaker's current mind*. If the Chair stood up and said, "We conclude the building is sound, though I do not believe it," the paradox would return (or rather, it would become a confession of institutional hollowness). But your example is a report *about* the committee, not a performance *by* the committee. It highlights the distinction between collective intentionality (which can exist without individual alignment) and individual assertion.

  ### 5. The Promise/Bad Faith Case
  "I will have the draft to you on Friday, though I have no intention of finishing it."

  You suspected the diagnosis here is different. You are correct. This is not strictly Moore's Paradox; it is **Insincerity** (or Lying).

  *   **Moore's Paradox:** "P, but I don't believe P." The speaker is often confused or irrational. They might actually believe $P$ deep down, or they are failing to understand the norms of their own speech. It is a failure of *rationality*.
  *   **The Promise Case:** "I will $\phi$, but I intend not to." Here, the speaker knows the norm. They are invoking the norm of promising (which creates an obligation) while secretly withholding the necessary mental state (intention).

  In Moore's Paradox, the utterance is *unintelligible* as a sincere assertion. In the Promise Case, the utterance is *deceptive*. It functions perfectly well to mislead the listener. The defect is moral, not pragmatic. The listener *can* accept the promise (until they find out the truth); they cannot "accept" a Moorean sentence as a sincere assertion because the sincerity is denied in the same breath.

  However, there is a cousin here: **"I promise to $\phi$, but I will not $\phi$."** This *is* a performative contradiction akin to Moore's Paradox. You cannot successfully perform the act of promising while explicitly stating you will not fulfill it. Your example ("I will have the draft... no intention") is slightly different because "I will" can be read as a prediction. If read as a prediction based on intention, it is Moorean. If read as a promise, it is a lie.

  ### Summary of the Terrain
  1.  **The Name:** Moore's Paradox.
  2.  **The Defect:** Pragmatic, not logical. A violation of the constitutive norms of assertion (Assertion expresses Belief).
  3.  **The Boundary:** It applies only when the speaker simultaneously *manifests* a mental state (via assertion, promising, etc.) and *denies* having that state in the present tense, first person.
  4.  **The Group Case:** Not paradoxical because it reports institutional facts vs. individual states, breaking the simultaneity of manifestation and denial.
  5.  **The Promise Case:** Distinguish between the *paradox* ("I promise but won't") and the *lie* ("I will but don't intend"). The former is a malfunction of the speech act; the latter is a weaponization of it.

  You have been sweeping one core phenomenon (Moore's Paradox) and its immediate pragmatic cousins into one pile. The pile is sound, but the "Promise/Bad Faith" specimen is a different species: it is a successful speech act used for a deceptive end, whereas the Moorean sentence is a failed speech act that struggles to mean anything at all.
