      *   **Key Characteristics:**
          *   Not logically contradictory (both halves can be true).
          *   Paradoxical/unsayable primarily in the first-person present indicative ("I believe $P$, but I don't believe $P$").
          *   Vanishes in past tense, second/third person, or private registers.
          *   Survives with verbs like 'know', 'remember', 'be certain'.
          *   Puzzling case 1: Group agents ("The committee concluded $P$, though none of us believes $P$").
          *   Puzzling case 2: Future intention vs. promise ("I will have the draft... though I have no intention...").
      *   **What the User Knows:** They know about self-referential paradoxes and performative contradictions (e.g., relativism) but distinguish their specimens from these (no self-reference, no logical contradiction).
      *   **What the User Wants:**
          *   The name (if it exists).
