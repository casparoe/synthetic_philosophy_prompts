  Scope and ground rules
  This document records the output of the adversarial collaboration workshop on language acquisition. It specifies load-bearing agreements regarding the phenomenon, the induction problem, and evidentiary standards. It deliberately excludes debates on evolutionary timelines, neural implementation details unrelated to computational function, and historical attributions of theories. The goal is not to declare a winner but to isolate the precise empirical and theoretical hinges upon which the nativist and empiricist positions turn. We agree to treat the following claims as the common ground for future modeling and experimentation, acknowledging that disagreement remains on the mechanisms explaining these facts. It defines terms to prevent ambiguity.

  Claims we both sign
  1. Language acquisition is universally successful across neurotypical children despite significant variation in input quality and quantity.
  2. Acquisition occurs within a constrained developmental timeframe, with core grammatical competence largely established by school age.
  3. The input available to the learner is finite, noisy, and lacks systematic negative evidence regarding ungrammaticality.
  4. A specific proportion of child-directed speech contains disfluencies or performance errors; we agree on the measurement of this figure but disagree on whether it renders the input too degraded for statistical learning or merely noisy.
  5. Learners generalize systematically to structures not encountered in the input, demonstrating knowledge beyond mere memorization.
  6. Generalization respects linguistic boundaries; children do not hypothesize all logically possible rules, indicating a restricted hypothesis space.
  7. The hypothesis space available to the learner is constrained, though the source of this constraint is the primary locus of disagreement.
  8. Domain-general statistical learning mechanisms exist and contribute significantly to the acquisition process.
  9. Domain-specific biases may exist but must be empirically distinguished from general architectural constraints on learning.
  10. The term "innate" must be disambiguated: it may refer to representational content, architectural bias, presence at birth, or maturational scheduling, and we agree not to conflate these distinct meanings.
  11. Presence at birth is not required for a constraint to be considered nativist; maturational unfolding counts as innate specification.
  12. The Poverty of the Stimulus argument concerns logical sufficiency of input for hypothesis selection, not merely quantitative data scarcity, and must be evaluated against computational models.
  13. Richness of the Stimulus arguments rely on the power of domain-general inference operating over available statistical regularities.
  14. Error patterns during acquisition are systematic and informative regarding the underlying learning mechanism and hypothesis space.
  15. Recovery from error occurs without explicit correction in most cases, suggesting internal constraint rather than external shaping.
  16. Cross-linguistic variation is bounded by universal principles or universal learning constraints, preventing arbitrary grammatical systems.
  17. Semantic anchoring facilitates acquisition but is not solely responsible for syntactic generalization in all domains.
  18. Computational models must be evaluated on realistic input sizes and noise levels to be considered psychologically plausible.
  19. Success is defined as convergence on adult-like competence, not just performance matching on specific experimental tasks.
  20. Both sides agree that current models fail to capture the full trajectory of acquisition without ad hoc adjustments or parameter tuning, indicating gaps in both theoretical frameworks.

  Where we still differ

  | Question | Nativist Formulation | Empiricist Formulation | What turns on it |
  | :--- | :--- | :--- | :--- |
  | Source of Constraints | Domain-specific linguistic primitives | Domain-general cognitive biases | Transfer effects across non-linguistic tasks |
  | Input Sufficiency | Logically insufficient for target grammar | Statistically sufficient for Bayesian inference | Viability of domain-general models |
  | Role of Noise | Degraded signal requiring filtering | Rich cue structure despite surface errors | Robustness of learning algorithms |
  | Nature of Priors | Genetically encoded linguistic information | Emergent from interaction history | Genetic association studies |
  | Error Signatures | Reveal constrained hypothesis space | Reveal gradual statistical tuning | Correlation of error types with input frequency |
  | Modularity | Encapsulated language faculty | Interactive processing systems | Dual-task interference patterns |
  | Definition of Explanation | Derivation from innate principles | Simulation of learning trajectory | Acceptability of computational existence proofs |
  | Corpus Implications | Noise reduces usable data significantly | Learners filter noise efficiently | Modeling of noise tolerance thresholds |

  Cruxes and what would move us

  **Computational Sufficiency of Domain-General Learners**
  The bearing case is a computational proof showing whether a domain-general Bayesian learner with realistic priors can converge on the target grammar given realistic input data. Nativists predict that no such model will succeed without implicit linguistic biases built into the hypothesis space, arguing that the search space is too vast. Empiricists predict that such a model will succeed using only domain-general statistical mechanisms, arguing that the input statistics are richer than nativists concede. If the nativist prediction holds, empiricists must concede that domain-general machinery is insufficient without linguistic-specific priors. If the empiricist prediction holds, nativists must concede that logical PoS arguments do not preclude statistical learning solutions.

  **Error and Recovery Patterns**
  The bearing case is a longitudinal analysis of child error types and recovery trajectories compared to simulated learner errors. Nativists predict that child errors will reflect violations of universal grammatical principles, never occurring in forbidden zones defined by innate constraints. Empiricists predict that errors will correlate with input frequency and complexity, reflecting gradual tuning rather than constraint violation. If nativists are right, empiricists must concede that the hypothesis space is pre-constrained by biology. If empiricists are right, nativists must concede that error patterns do not uniquely signal innate grammatical knowledge and may arise from learning dynamics.

  **Artificial Language Generalization Study**
  The bearing case is the ongoing study where adults are trained on a miniature language fitted equally well by linear adjacent-dependency and hierarchical rules. Nativists predict participants will generalize using the hierarchical rule despite the tiny training set and lack of semantic anchor, citing structure dependence. Empiricists predict participants will default to the linear rule or show no preference due to insufficient data for hierarchical induction without semantic grounding. If nativists are right, empiricists must concede that hierarchical bias operates without semantic support. If empiricists are right, nativists must concede that structure dependence requires richer input or semantic grounding than previously claimed.

  What's probably just words
  Much of our disagreement stems from terminological conflation rather than empirical divergence. Specifically, the word "innate" is often used to cover four distinct concepts: genetically encoded information, domain-specific architecture, presence at birth, and maturational scheduling. We agree that a bias can be innate in the sense of being species-typical and genetically influenced without being present at birth. Similarly, "knowledge" is disputed between those who view it as explicit representational content and those who view it as dispositional behavioral capacity. We agree to specify which definition is in use during debate. Furthermore, disputes over "representation" often mask agreement on behavioral dispositions. Disputes regarding whether a mechanism is "linguistic" often dissolve when we specify whether we mean functionally specialized or anatomically localized. We commit to using these disambiguated terms to prevent talking past one another in future collaborations.

  Nativist Working Group | Empiricist Working Group
