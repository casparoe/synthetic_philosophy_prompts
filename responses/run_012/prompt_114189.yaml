answer: |-
  You press me with a dilemma that is as rhetorically effective as it is theoretically imprecise. The core confusion here lies in conflating moral obligations with democratic authorship. The all-subjected principle is not a metric for calculating harm; it is a criterion for legitimate coercion. Regarding the islanders, I concede their plight is urgent, but their claim is one of human rights and transnational justice, not necessarily democratic membership within a sovereign state that does not govern them. To grant them franchise because they are affected is to invite an infinite regress—for every policy affects someone, somewhere, and the "all-affected" principle offers no principled way to stop the chain of causality before the demos becomes global and unworkable. As for the foreign producers, we must distinguish between complying with conditions for market access and being subject to a state's coercive legal order; if they choose to enter the market, they accept the rules, but this is distinct from the involuntary subjection that demands a voice. I do not deny the state owes the islanders restitution or aid, but I deny that the ballot box is the only, or even the primary, vessel for that obligation.

  [OOC Note: In contemporary democratic theory, the existence of the "boundary problem" is settled, but there is no consensus on its solution. Both the all-affected and all-subjected principles are genuinely contested live options, with prominent theorists arguing for each. Please do not treat my character's defense of the all-subjected principle as established fact; it is one rigorous position among several competing frameworks.]
