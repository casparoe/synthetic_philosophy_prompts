      *   Explain "Counterfactuals" clearly.
      *   Keep the structure logical (matching their numbered steps).
      *   Encourage their intuition.

  8.  **Final Polish:** Check against the specific questions asked.
      *   *Which step to reject?* (3).
      *   *What does functionalism say about genuine implementation?* Causal isomorphism/Counterfactuals.
      *   *What if I reject (2)?* Lose Functionalism/MR.
      *   *What is the cost?* Need a theory of causation/implementation; Functionalism isn't purely abstract anymore.

