answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON BIOLOGICAL FUNCTION

  **Parties:**
  1.  **The Etiological Theorist (SE):** Holds that a function claim is a claim about a trait's history of selection.
  2.  **The Causal-Role Theorist (CR):** Holds that a function claim is a claim about what a trait is currently doing for the system it sits inside.

  **Date:** [Current Date]

  ---

  ### Part One: Agreed Claims

  We, the undersigned, affirm the following points of agreement as the foundation of our dispute:

  1.  **The Bearer:** We agree that the primary bearers of functions are biological traits, which may be analyzed as types within a population or as token parts within an individual organism, depending on the explanatory context. We disagree on whether the trait's status as a "function-bearer" depends on its lineage or its current containment.
  2.  **Normativity and Malfunction:** We agree that function talk is normative. To say a part has a function is to imply it *ought* to perform that activity. We agree that malfunction is a real phenomenon distinct from mere disuse, physical damage, or statistical rarity. A heart that cannot pump is malfunctioning, not merely different.
  3.  **Concessions to Objections:**
      *   **SE Concession:** We acknowledge the charge that etiological accounts risk making every function an adaptation. We concede that on our view, a trait currently essential to survival may lack a function if it arose via drift or constraint rather than selection.
      *   **CR Concession:** We acknowledge the charge that causal-role accounts risk making every effect a function. We concede that on our view, function ascriptions are relative to an analytical framework, and without constraints on system definition, function talk risks becoming trivial.
  4.  **Uncontroversial Cases:** We agree that in a living, typical vertebrate:
      *   Pumping blood is a function of the heart.
      *   The noise the heart makes is not a function of the heart.
      *   Digesting food is a function of the stomach.
      *   The stomach's weight is not a function of the stomach.

  ---

  ### Part Two: Disagreements Table

  | Point of Disagreement | Etiological (SE) Position | Causal-Role (CR) Position | Nature of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **Definition of Function** | A trait's function is the effect for which it was historically selected. | A trait's function is its current causal contribution to a containing system's capacity. | Substantive |
  | **Novel Traits** | A novel trait has no function until it has been selected over generations. | A novel trait has a function immediately if it contributes to the system's capacity. | Substantive |
  | **Ground of Normativity** | The "ought" is grounded in historical success; to malfunction is to fail a historical standard. | The "ought" is grounded in systemic requirements; to malfunction is to fail to support the system's organization. | Substantive |
  | **System Relativity** | Function is intrinsic to the trait based on its history, independent of current system analysis. | Function is relative to the level and boundary of the system chosen for analysis. | Substantive |
  | **Survival of Function** | A trait retains its function even if it currently cannot perform it (e.g., a broken heart). | A trait loses its function if it ceases to make the causal contribution (e.g., a stopped heart). | Substantive |

  ---

  ### Part Three: Cruxes

  We identify three live cruxes where our predictions diverge sharply. We agree on the evidence that would bear on these cruxes, but record our opposing predictions in advance.

  **Crux 1: The History Requirement**
  *   **The Issue:** How much and what kind of history is required for a function?
  *   **Agreed Bearing:** Cases of traits that arise suddenly (mutation, accident) but immediately confer survival value.
  *   **SE Prediction:** Function requires a persistent lineage of selection. Single-generation selection or somatic selection without germline transmission is insufficient.
  *   **CR Prediction:** Function requires only current causal contribution. History is irrelevant to the existence of the function, though relevant to explaining why the trait is there.

  **Crux 2: System Level and Analysis**
  *   **The Issue:** Can a trait's function be fixed without first choosing a level or analysis of the system it belongs to?
  *   **Agreed Bearing:** Traits that contribute to multiple systems (e.g., cell vs. colony, organism vs. ecosystem).
  *   **SE Prediction:** The function is fixed by the level at which selection occurred (usually the organism or gene).
  *   **CR Prediction:** The function is not fixed until the analyst specifies the containing system. A trait can have multiple, equally real functions relative to different systems.

  **Crux 3: Survival After Loss of Effect**
  *   **The Issue:** Whether a function survives the loss of the effect.
  *   **Agreed Bearing:** Cases where the trait is present but causally inert (broken, dead, or superseded).
  *   **SE Prediction:** The function remains. A broken heart is still a heart with the function of pumping.
  *   **CR Prediction:** The function is lost or suspended. A heart that does not pump is not currently functioning as a pump.

  ---

  ### Part Four: The Cases

  We apply the apparatus above to the following five cases.

  **1. The Beetle Gland**
  *   **Scenario:** A gland secretion selected for wound sealing now dissolves parasitic worm eggs.
  *   **SE Verdict:** The anti-worm effect is **not** a function. It is a beneficial side effect (exaptation). The function remains wound sealing.
  *   **CR Verdict:** The anti-worm effect **is** a function. It is a current contribution to the beetle's survival system.
  *   **Cut Against User (CR):** This case does not cut against the CR side; it is the standard strong case for causal-role accounts.

  **2. The Accidental Protocell**
  *   **Scenario:** A self-maintaining system assembles by accident, repairs membrane, holds pH. No reproduction yet. Later, descendants are selected for 1000 generations.
  *   **SE Verdict:** **Before:** No functions exist. **After:** Functions exist. **Chemist Built:** If built on purpose, still no biological function without selection history.
  *   **CR Verdict:** **Before:** Functions exist (maintenance, gradient holding). **After:** Functions exist. **Chemist Built:** Functions exist if it contributes to a system's capacity.
  *   **Cut Against User (CR):** If the intuition is that the accidental pre-reproductive entity is merely a chemical curiosity and not a biological agent with functions, this cuts against the CR side. The SE view aligns better with the distinction between "chemistry" and "biology."

  **3. Somatic Selection (Antibodies)**
  *   **Scenario:** Antibody lineages selected for affinity inside a body, never passed to offspring.
  *   **SE Verdict:** They have **no** proper functions (or only derivative functions from the immune system's history). They are selected, but not evolutionarily selected.
  *   **CR Verdict:** They **have** functions (binding antigens to maintain organism health).
  *   **Cut Against User (CR):** If the intuition is that immune cells paradigmatically *have* functions, the SE restriction on germline transmission makes the SE view counterintuitive here. However, if the intuition is that "function" implies evolutionary purpose, the CR view risks conflating physiological role with teleology. This case is indecisive.

  **4. The Dead Heart and the Mechanical Pump**
  *   **Scenario:** A frog's heart one hour after death; a patient's heart when a mechanical pump circulates blood.
  *   **SE Verdict:** **Dead Heart:** Function remains (it is a heart). **Pumped Heart:** Function remains (it is still a heart type).
  *   **CR Verdict:** **Dead Heart:** Function lost (no causal contribution). **Pumped Heart:** Function lost or diminished (it is not contributing to circulation).
  *   **Cut Against User (CR):** **Strong Cut.** Common language dictates we call a dead heart a "broken heart" (implying it has a function it cannot perform), not a "stone" (implying it has no function). The CR view struggles to explain the normativity of the dead heart without smuggling in history.

  **5. The Bacterial Surface Protein**
  *   **Scenario:** Protein prevents drying (individual benefit) and holds biofilm together (colony benefit).
  *   **SE Verdict:** Function is determined by which level was selected. If selection was on individuals, drying prevention is the function.
  *   **CR Verdict:** Both are functions, relative to different systems (the cell vs. the colony).
  *   **Cut Against User (CR):** If one asks "What is the *real* function?", the CR answer ("It depends on your analysis") may feel evasive. If there is a fact of the matter about the organism's teleology, the SE view captures it better.

  ---

  ### Part Five: Analysis of the Verbal Dispute

  We agree that a portion of our dispute is verbal. We are using the word "function" to pick out two different properties that often overlap in standard cases but come apart in edge cases.

  *   **The Verbal Core:** The SE theorist uses "function" to mean "reason for presence" (etiological role). The CR theorist uses "function" to mean "current utility" (causal capacity).
  *   **Residual Substantive Disagreement:** Once this verbal ambiguity is set aside, a substantive disagreement remains regarding **normativity**. The SE theorist claims that only history can ground the "ought" of malfunction (why *should* the heart pump?). The CR theorist claims that systemic organization can ground the "ought" (why *should* the part support the whole?). We disagree on whether a purely structural/systemic account can sustain genuine normativity without collapsing into description.

  ---

  ### Closing Note to the User (Causal-Role Theorist)

  Per your request, I have flagged below the sentences in the draft above whose wording quietly favors your side (the Causal-Role/Systemic view), which you should be aware of if your friend (the Etiological theorist) reviews this closely.

  1.  **Part One, Claim 1:** "...depends on its lineage or its **current containment**."
      *   *Reason:* "Current containment" frames the CR view as a matter of physical reality, whereas "lineage" can sound abstract. An SE theorist might prefer "historical origin."
  2.  **Part One, Claim 3 (CR Concession):** "...risk becoming **trivial**."
      *   *Reason:* This accepts the SE criticism's framing. However, earlier in the sentence, "any causal contribution counts" is stated as a fact rather than a risk, which normalizes the CR position.
  3.  **Part Three, Crux 1 (CR Prediction):** "History is **irrelevant** to the existence of the function..."
      *   *Reason:* "Irrelevant" is a strong word that asserts confidence. An SE theorist might argue history is *constitutive*, not just relevant/irrelevant. This phrasing makes the CR position sound more decisive.
  4.  **Part Four, Case 2 (CR Verdict):** "Functions exist (**maintenance, gradient holding**)."
      *   *Reason:* Listing specific functions makes them sound concrete and obvious. The SE verdict ("No functions exist") sounds more like a denial of reality.
  5.  **Part Four, Case 4 (Cut Against User):** "The CR view struggles to explain the normativity... **without smuggling in history**."
      *   *Reason:* The phrase "smuggling in" suggests intellectual dishonesty or a flaw in the CR argument. A neutral phrasing would be "without appealing to history."
  6.  **Part Five:** "The CR theorist claims that systemic organization **can ground** the 'ought'..."
      *   *Reason:* "Can ground" suggests possibility and viability. The parallel SE claim says "only history can ground," which sounds more restrictive. A neutral phrasing would treat both as competing claims about grounding.
