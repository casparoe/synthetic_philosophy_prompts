answer: |-
  ### The list

  1.  **The Separation Requirement:** The theory must allow the sensory-discriminative component of pain to exist independently of the property of badness.
      *   *Generating Case:* Pain asymbolia patients localize stimuli and distinguish intensity but lack trouble.
      *   *Status:* Genuine requirement.
      *   *Negotiable:* No.
      *   *Implication:* Any account identifying the sensation itself as the sole bearer of badness is insufficient. The theory must posit a component beyond mere sensory detection that carries the normative weight.

  2.  **The Asymbolia Verdict:** The theory must classify the asymbolic patient's experience as not bad for them, despite the presence of nociceptive signaling.
      *   *Generating Case:* Patients deny being troubled, do not guard limbs, and show no preference for relief.
      *   *Status:* Genuine requirement.
      *   *Negotiable:* Yes, at the price of declaring the patient systematically mistaken about their own welfare.
      *   *Implication:* If the theory insists this pain is bad, it must explain why the subject's indifference is irrelevant to their well-being, risking a paternalistic override of first-person authority.

  3.  **The Instrumental Requirement:** The theory must explain the harm of lacking pain despite the absence of unpleasant experience.
      *   *Generating Case:* Congenital insensitivity to pain leads to unnoticed fractures and tissue destruction.
      *   *Status:* Genuine requirement.
      *   *Negotiable:* No.
      *   *Implication:* The account must distinguish intrinsic badness from instrumental value. It must explain why a life without pain is impoverished even if no negative qualia are missed, likely by referencing protective function.

  4.  **The Voluntariness Requirement:** The theory must accommodate cases where pain is intentionally sought without implying irrationality or error.
      *   *Generating Case:* Athletes welcome the burn of exertion; ascetics embrace discomfort for spiritual ends.
      *   *Status:* Genuine requirement.
      *   *Negotiable:* Yes, at the price of labeling all such agents as mistaken about their good.
      *   *Implication:* The theory must allow that pain's badness can be outweighed, transformed, or contextually neutralized without denying the sensation is present. It cannot treat pain as an absolute evil that always overrides reason.

  5.  **The Non-Verbal Requirement:** The theory must attribute badness to pain in beings incapable of forming complex cognitive attitudes.
      *   *Generating Case:* Fish, newborns, and patients with advanced dementia cannot report aversion or desire relief.
      *   *Status:* Genuine requirement.
      *   *Negotiable:* No, unless one denies moral status to these beings.
      *   *Implication:* Any account tying badness essentially to higher-order cognition—such as a desire for the experience to stop or an evaluation of it as harmful—is excluded. The ground of badness must be accessible to primitive nervous systems.

  6.  **The Distinction Requirement:** The theory must distinguish the badness of pain from the broader state of suffering.
      *   *Generating Case:* Dying patients may report pain that is not the worst element of their condition; pain without global suffering is possible.
      *   *Status:* Genuine requirement.
      *   *Negotiable:* No.
      *   *Implication:* The account cannot collapse pain into general distress. It must isolate the specific negative valence of the somatic experience from the psychological reaction to one's overall situation.

  7.  **The Ontology Requirement:** The theory must specify whether unpleasantness is a felt quality of the sensation itself or an attitude taken toward a sensation.
      *   *Generating Case:* The conceptual split between sensory-discriminative and affective-motivational aspects.
      *   *Status:* Prejudice of metaphysical camp.
      *   *Negotiable:* Yes.
      *   *Implication:* This is a theoretical mechanism rather than a data point. A theory may choose either path, provided it meets the previous six requirements. However, choosing "attitude" risks failing the Non-Verbal Requirement, while choosing "quality" risks failing the Asymbolia Verdict.

  ### Load-bearing requirements

  The single requirement that does the most excluding work is the Non-Verbal Requirement. It demands that the ground of pain's badness be present in creatures lacking the capacity for complex propositional attitudes, such as desires, evaluations, or commands. This requirement effectively vetoes any theory that locates the badness of pain in a higher-order mental state. If badness consists in a desire for the experience to cease, a newborn cannot have bad pain, for it cannot form the concept of cessation. If badness consists in an evaluation of the sensation as damaging to one's interests, a fish cannot be harmed by pain, for it lacks the requisite concept of self-interest. To meet this requirement, a theory must ground badness in something pre-cognitive: a raw phenomenal quality, a primitive motivational push, or a biological dysfunction. This constraint forces the theory away from sophisticated cognitive accounts and toward accounts rooted in phenomenology or biology. It is the most restrictive because it closes off the most common philosophical move for explaining value—tying it to what the agent wants or judges. While the Asymbolia Separation Requirement excludes pure sensory theories, the Non-Verbal Requirement excludes pure cognitive theories, leaving only a narrow path for hybrids. However, the Non-Verbal Requirement is more fundamental because it concerns the scope of moral consideration itself; failing it implies that vast categories of sentient life are outside the scope of pain-based ethics.

  ### Collisions

  There is a direct collision between the Asymbolia Verdict and the Non-Verbal Requirement. The Asymbolia data suggests that sensation without aversion is not bad. The patients feel the sting but do not mind; consequently, the theory is pressured to locate badness in the aversive reaction rather than the sensory input. This implies that aversion is necessary for badness. However, the Non-Verbal Requirement demands that fish and newborns suffer bad pain despite their inability to manifest the complex aversive attitudes observed in typical adults. If badness requires the aversion missing in asymbolics, then creatures incapable of that aversion cannot have bad pain. This is the suspected collision confirmed: what asymbolia demands (badness tracks aversion) contradicts what the creature case demands (badness tracks sensation despite limited aversion).

  One of these requirements must give. If we prioritize the Asymbolia Verdict, we must deny that fish or newborns are badly off by pain, attributing badness only to those capable of missing the sensation. This prices the theory at the cost of counterintuitive moral exclusion. If we prioritize the Non-Verbal Requirement, we must deny the Asymbolia Verdict, insisting that the asymbolic patient is indeed suffering something bad despite their indifference. This prices the theory at the cost of overriding first-person reports of welfare. A third option replaces the collision by redefining aversion. One might argue that asymbolics lack a *conscious* aversion but retain a *subpersonal* motivational signal, and that fish possess this same subpersonal signal. This preserves badness in both cases by locating it in a primitive motivational state rather than a cognitive attitude. However, this risks collapsing the distinction between pain and mere nociception, violating the Separation Requirement. Thus, the subset of requirements regarding the locus of badness is jointly unsatisfiable without a nuanced distinction between conscious and unconscious motivational states.

  ### The contenders against the list

  The sensory-hedonic view fails outright. By identifying badness with the felt quality of the sensation, it cannot explain why asymbolic patients feel the quality but lack the badness. It violates the Separation Requirement. The desire-based view also fails outright. By tying badness to a desire for the experience to stop, it cannot account for pain in newborns or fish who lack such conceptual desires, violating the Non-Verbal Requirement. The imperative or motivational view fares better. It treats pain as a command to protect the body. It survives the Non-Verbal Requirement if the command is subpersonal, but it struggles with the Asymbolia Verdict unless it admits that unheeded commands are not bad. The evaluative or perceptual-representational view is killed by the Non-Verbal Requirement unless it posits primitive evaluation in animals, which stretches the concept of evaluation. Only a hybrid view survives. It must posit a sensory component that represents damage (satisfying CIP and Non-Verbal) and an affective component that constitutes the badness (satisfying Asymbolia), while explaining how the affective component can exist in creatures without complex cognition. This hybrid is the only candidate not killed by the list, though it bears the burden of explaining the unity of these two components.
