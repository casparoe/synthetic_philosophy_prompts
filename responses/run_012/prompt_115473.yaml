answer: |-
  **MEMORANDUM**

  **TO:** Priority-Setting Committee
  **FROM:** [Your Name], Lay Member
  **DATE:** October 12, 2023
  **SUBJECT:** Recommendation on Standing Allocation Rule and Pending Claims

  **Recommendation**

  I recommend we reject the staff's proposed aggregative rule for this fiscal cycle and instead authorize funding for the four patients with the rare, fatal condition. Simultaneously, I propose we adopt a standing rule of **Threshold Prioritarianism with a Budget Cap**. Under this rule, claims involving imminent mortality or irreversible catastrophic loss take precedence over claims involving modest quality-of-life improvements, provided the total cost of such "rescue" claims does not exceed 15% of the annual high-cost treatment fund.

  Regarding the four pending applications: We must approve them immediately to meet the quarter's deadline.

  **The Case for Aggregation (The Rejected Position)**

  We must be clear about what we are foregoing. The staff proposal maximizes total health. By funding the nine hundred patients with the common condition, we generate approximately 450 quality-adjusted life-years (QALYs). By funding the four patients with the rare condition, we generate approximately 48 QALYs. The aggregative view holds that health resources are a common pool intended to reduce the total burden of suffering. From that perspective, denying the nine hundred to save the four is a failure of stewardship. It treats health as a right to be rescued rather than a resource to be optimized. If we adopt my recommendation, we are explicitly accepting a tenfold reduction in total health gain to satisfy a deontological constraint. We are saying that the *distribution* of survival matters more than the *sum* of survival.

  **The Case for Threshold Prioritarianism (The Recommended Position)**

  Our charter requires that allocation decisions be defensible to *each* affected person, not merely to the population. This is not a slogan; it is a constraint on how we justify harm.

  To the four patients facing death within the year, the aggregative rule says: "Your death is acceptable because it purchases small benefits for many others." It is difficult to construct a justification for this that respects their status as ends in themselves. Their complaint is not that they lost a lottery; it is that their total loss was counted as equivalent to the partial losses of others.

  To the nine hundred patients, my recommendation says: "We denied you treatment to prevent four deaths." This is a heavy burden, but it is defensible. The loss of 0.5 QALYs, while significant, is not comparable to the loss of life and twelve years of future. In a contractualist framework, the strength of an objection is determined by the severity of the burden imposed on the individual, not the number of individuals burdened. We can look a member of the nine hundred in the eye and say that preserving life takes precedence over improving quality of life when resources are insufficient for both. We cannot say the reverse to the four without treating them as means to the health of the majority.

  **Operationalizing the Rule**

  To ensure this principle does not bankrupt the system or become arbitrary, staff must apply the following procedure:

  1.  **Triage:** Claims are categorized as *Catastrophic* (imminent mortality or irreversible loss of basic function) or *Sub-Catastrophic* (quality-of-life improvements, life extension without imminent risk).
  2.  **Priority:** *Catastrophic* claims are funded first.
  3.  **Cap:** If *Catastrophic* claims exceed 15% of the annual fund, they are ranked internally by expected gain, and the remainder are denied. This ensures the "rescue principle" does not crowd out all preventive or maintenance care.
  4.  **Transparency:** All denied claimants receive the standard notice of reasons (see Appendix).

  **Review Date**

  We will revisit this rule on **June 30**, following the close of the fiscal year. We must analyze whether the 15% cap was binding and whether the "Catastrophic" definition requires narrowing to ensure sustainability.

  **Conclusion**

  We are not here to maximize a metric; we are here to govern a system that citizens can trust will not sacrifice them when the math goes against them. We fund the four.

  ***

  **APPENDIX: Draft Denial Notice (For one of the 900 claimants)**

  **NOTICE OF COVERAGE DETERMINATION**

  **To:** [Patient Name]
  **Re:** Request for High-Cost Treatment [Condition]

  We have reviewed your request for treatment. This letter is to inform you that your claim has been denied.

  This decision was not made based on your individual prognosis alone, but on a priority-setting rule adopted by our regional health system. This year, we faced a choice between funding treatments that prevent imminent death and treatments that improve quality of life without extending survival.

  Our committee determined that when funds are insufficient to cover all valid claims, priority must be given to patients facing imminent mortality or catastrophic loss of function. Your condition, while painful and limiting, does not meet this threshold. The resources required for your treatment were allocated to patients who would die within the year without intervention.

  We understand this causes you significant hardship. We recognize that you are being asked to bear a burden so that others may survive. This is not a medical judgment about the value of your life, but an ethical judgment about the hierarchy of needs within a limited budget. We are prepared to defend this choice to you personally: we believe that preventing death must take precedence over improving quality of life when we cannot do both.

  You have the right to appeal this decision to the external review board.

  Sincerely,

  Priority-Setting Committee
  Regional Health System
