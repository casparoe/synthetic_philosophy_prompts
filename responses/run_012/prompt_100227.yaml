answer: |-
  You are conflating **semantic truth conditions** with **norms of assertability/belief**, and you are treating Lewis's Triviality Result as a refutation of Adams' Thesis rather than a refutation of the *compatibility* of Adams' Thesis with truth-conditional semantics.

  Here is the blunt breakdown of where your reasoning goes wrong, followed by the conceptual map you need for your seminar.

  ### 1. The Core Error: What Adams' Thesis Actually Is
  You wrote: *"Lewis's triviality results show that... Adams' thesis is dead."*

  **This is false.** Adams' Thesis is very much alive. It is widely accepted as the correct description of how speakers *use* and *judge* conditionals.

  **The Correction:** Ernest Adams was an **expressivist**. He did *not* believe indicative conditionals had truth conditions. When Adams proposed $P(A \to C) = P(C|A)$, he was **not** claiming that there is a proposition $A \to C$ whose truth-probability equals the conditional probability. He was claiming that the *assertability* (or degree of belief) in the conditional *is* the conditional probability.

  Lewis's Triviality Result (1976) does not kill Adams' Thesis. It kills the hypothesis that **conditionals are propositions that have truth conditions.**
  *   **Lewis's Argument:** If conditionals have truth conditions (i.e., they express propositions) AND they obey the standard axioms of probability AND Adams' Thesis holds, THEN the only admissible probability functions are trivial (assigning only 0 or 1).
  *   **The Conclusion:** Since probability functions aren't trivial, one of the premises must go. Lewis chose to reject the idea that conditionals have truth conditions (for indicatives). Adams was already there.

  **Seminar Takeaway:** Adams' Thesis is a constraint on *rational belief*, not a definition of *truth conditions*.

  ### 2. The False Dilemma
  You wrote: *"I'm forced into one of two corners: either (a) indicative conditionals have no truth conditions at all, or (b) they're material conditionals and we just have to accept that everyone's probability judgements about them are systematically irrational."*

  This is a false dichotomy. You are assuming that if they have truth conditions, they must be Material Conditionals. That ignores the Stalnaker/Lewis possible-worlds semantics. But more importantly, you are assuming that if Adams' Thesis fails for *truth-conditional probability*, our judgments are irrational.

  **The Correction:**
  *   **Option (a) is actually the dominant view:** Many semanticists (following Adams and later Dorothy Edgington) accept that indicatives lack classical truth conditions. They don't express propositions; they express *conditional beliefs*. On this view, there is no "probability of the conditional" in the sense of a proposition being true; there is only the conditional probability of the consequent given the antecedent. This isn't a bug; it's the theory.
  *   **Option (b) is a strawman:** Very few people argue for the Material Conditional in natural language semantics precisely *because* of the probability mismatch you noted.
  *   **The Missing Option (c):** Conditionals have truth conditions (e.g., Stalnaker), but Adams' Thesis holds only approximately or for a restricted class of probability functions. Stalnaker argued that while Triviality holds for *all* probability functions, it doesn't hold for the *admissible* ones (those that respect the similarity ordering of worlds).

  ### 3. "What is the probability of?"
  You asked: *"What is the probability of an indicative conditional the probability **of**, if not of a proposition?"*

  This is the category mistake driving your confusion. If you follow Adams/Edgington:
  *   There is no "probability of the conditional."
  *   There is only the **conditional probability of the consequent given the antecedent**.
  *   When we say "It is probable that if A, C," we are not ascribing a property to a sentence. We are ascribing a property to our epistemic state regarding the relationship between A and C.

  **The Ramsey Test:** This is the bridge. To evaluate "If A, C," you hypothetically add A to your stock of knowledge and evaluate the probability of C. You never actually evaluate the truth of the whole sentence "If A, C" as a standalone fact.

  ### 4. Where Stalnaker and Lewis Fit In
  You asked: *"I keep feeling the possible-worlds / variably-strict crowd (Stalnaker, Lewis) must slot in somewhere."*

  They slot in as the attempt to **save truth conditions** in the face of Triviality.

  *   **Stalnaker (1968/1975):** Proposed that $A \to C$ is true iff $C$ is true in the closest $A$-world. This gives it a truth condition (a proposition).
      *   *The Problem:* Lewis's Triviality Result applies to Stalnaker's proposition too.
      *   *Stalnaker's Defense:* He argues that Triviality shows that not all probability distributions are compatible with the semantics. We must restrict the set of admissible probability functions. (This is technically difficult and often seen as a cost).
  *   **Lewis (1973/1976):** Lewis agreed with Stalnaker on *counterfactuals* (variably strict), but on *indicatives*, Lewis largely conceded to Adams. Lewis famously concluded that indicative conditionals do not express propositions.
  *   **The Modern Synthesis:** Many contemporary semanticists use Stalnaker/Lewis style possible worlds for the *semantics* (truth conditions) but acknowledge that the *epistemology* (how we assign probabilities) follows Adams. They accept a gap between truth conditions and assertability conditions.

  ### 5. The "Third Option": The Restrictor View
  You asked for a third option between Material and No-Truth-Conditions. The most influential modern view is **Kratzer's Restrictor Theory**.

  *   **The Idea:** 'If' is not a connective (like $\to$). It is a restrictor on a covert modal operator.
  *   **Structure:** "If A, C" is not $A \to C$. It is $M_{A}(C)$, where $M$ is a modal (often epistemic 'must' or 'might') and $A$ restricts the modal base.
  *   **Why it helps:** It dissolves the Triviality problem. You aren't assigning a probability to a conditional proposition. You are assigning a probability to $C$ relative to a modal base restricted by $A$. This mathematically aligns with $P(C|A)$ without requiring a "conditional proposition" to exist.
  *   **Seminar Value:** This is crucial for modern semantics. It explains why conditionals interact with modals ("If A, must C") the way they do.

  ### Summary for Your Seminar Plan

  To straighten out your students (and yourself), structure the narrative like this:

  1.  **The Data:** Intuitive probabilities follow Adams' Thesis ($P(\text{If } A, C) = P(C|A)$), not the Material Conditional ($P(\neg A \lor C)$).
  2.  **The Crisis:** Lewis's Triviality Results show you cannot have a truth-conditional semantics *and* Adams' Thesis *and* standard probability theory.
  3.  **The Responses (The Literature Map):**
      *   **The Expressivist Route (Adams, Edgington):** Deny truth conditions. Conditionals aren't propositions; they are devices for expressing conditional belief. Adams' Thesis is a norm of rationality, not a truth-conditional equation.
      *   **The Propositionalist Route (Stalnaker):** Keep truth conditions (closest world semantics). Argue that Triviality only rules out *unrestricted* probability functions, not the ones we actually use.
      *   **The Restrictor Route (Kratzer):** Deny that 'if' is a connective. It restricts a modal. This bypasses the need for a "conditional proposition" entirely.
  4.  **The Verdict:** Triviality didn't kill Adams' Thesis; it killed the idea that Adams' Thesis describes the probability of a *truth-conditional proposition*.

  **Recommended Reading for the Syllabus:**
  *   **Adams (1965/1975):** For the original thesis (make sure they know he's an expressivist).
  *   **Lewis (1976) "Probabilities of Conditionals and Conditional Probabilities":** The triviality proof.
  *   **Edgington (1995) "Indicative Conditionals":** A strong defense of the no-truth-conditions view.
  *   **Kratzer (1986/2012):** For the Restrictor view (the modern "third way").
  *   **Stalnaker (1975) "Indicative Conditionals":** For the attempt to save truth conditions.

  **Blunt Advice:** Do not tell your students Adams' Thesis is dead. Tell them the **Truth-Conditional Interpretation of Adams' Thesis** is dead. That distinction is the entire engine of the last 50 years of conditional research.
