      *   *Refining the Triviality Point:* How to make it non-boring? Connect it to the *ethics* of reading. If the future is fixed, why do we care? Because we treat the characters *as if* they are free. The tension between the ontology (fixed) and the phenomenology (open) is the essay's heart.

