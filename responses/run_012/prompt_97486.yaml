answer: |-
  ### The Crowd Forensics Protocol

  You have three hours. You have three people. You do not have Bloomberg terminals or PhD quants. You have public data, price action, and the ability to make phone calls. This procedure is designed to classify the *structure* of the consensus, not the *validity* of the thesis. A valid thesis can still be a bad trade if the crowd structure is fragile.

  **Step 1: The Origin Test (Independent vs. Cascade)**
  *Question:* Who moved first, and did they have access to information we do not?
  *Procedure:* Identify the first 20% of the price move or positioning shift. Contact two market participants who were active at that time (a broker, a sell-side analyst, or a peer CIO). Ask: "At the start of this move, was there a data point available to the public, or was this driven by private channel checks/restructuring knowledge?"
  *Sufficient Answer for Independent Signals:* "The early movers had access to non-public data (e.g., supply chain checks, private management guidance) that has since become public."
  *Sufficient Answer for Information Cascade:* "The early movers reacted to a price move or a public headline; later movers are copying the early movers because they assume the early movers know something."
  *Stop Point:* If the origin is clearly private information that has now disseminated, proceed to Step 2. If the origin was purely price momentum, classify as **Information Cascade** and proceed to Step 3.

  **Step 2: The Career Risk Test (Reputational Imitation)**
  *Question:* If this trade blows up, who gets fired? If I *don't* take this trade and it wins, who gets fired?
  *Procedure:* Ask your peers or brokers: "Is holding this position considered 'prudent' or 'aggressive'?"
  *Sufficient Answer for Reputational Imitation:* "Holding is the default benchmark position. Being underweight is the career-risking deviation." (e.g., "Nobody got fired for holding Treasuries in 2008.")
  *Sufficient Answer for Independent/Cascade:* "Holding is an active bet. Being underweight is acceptable if the thesis fails."
  *Stop Point:* If the position is held primarily to match peers rather than to generate alpha, classify as **Reputational Imitation**. Hand off to the committee: This is a beta decision, not an alpha decision.

  **Step 3: The Fragility Test (The Reversal Condition)**
  *Question:* What specific, small, public piece of evidence would cause the crowd to exit?
  *Procedure:* Define the "Consensus Thesis" in one sentence (e.g., "Inflation is dead," "Earnings will grow 10%"). Identify a threshold miss (e.g., "Inflation prints 0.2% hot," "Earnings miss by 5%"). Ask your broker: "If that print happens, do you see forced liquidation or just a dip-buying opportunity?"
  *Sufficient Answer for Low Fragility:* "The crowd is under-levered and views misses as buying opportunities." (Diagnosis: **Independent Signals**).
  *Sufficient Answer for High Fragility:* "The crowd is levered long/short and risk models will force de-grossing on that print." (Diagnosis: **Information Cascade** or **Reputational Imitation**).

  **Decision Logic & Hand-Off**
  *   **Independent Signals + Low Fragility:** Action = **Join**. (The crowd is right and sturdy).
  *   **Information Cascade + High Fragility:** Action = **Fade** or **Wait**. (The crowd is wrong and weak).
  *   **Reputational Imitation + High Fragility:** Action = **Fade**. (The crowd is hollow).
  *   **Mixed/Unclear:** Action = **Gather-More-Private-Signal**.

  **Hand-Off to Committee:**
  This procedure diagnoses the *crowd*, not the *asset*. If the diagnosis is "Join," the procedure stops. You must now decide: How much capital? What is the stop-loss? What is the opportunity cost? The procedure cannot answer these; they are functions of your specific liability structure and risk tolerance.

  **Where This Procedure Breaks:**
  1.  **The Central Bank Put:** If the asset is supported by a sovereign entity (e.g., FX pegs, bond yield caps), the "Fragility Test" fails. The crowd will not reverse on data; they will only reverse on policy.
  2.  **Hidden Leverage:** If the crowd's leverage is opaque (e.g., private credit, off-balance-sheet derivatives), the "Fragility Test" will underestimate risk.
  3.  **Disagreement:** If Step 1 suggests "Independent" but Step 3 suggests "High Fragility," the procedure cannot settle the case. This indicates a "Late Cycle" trade: the thesis is real, but the positioning is exhausted. Default to **Wait**.

