      *   Does the analogy establish that the whole matters more? No, it *assumes* it. In art, the whole *is* the value. A beautiful painting with one ruined patch is a ruined painting. But in ethics, a world with one tortured child might be morally compromised regardless of the whole.
      *   The analogy presupposes an *aesthetic* axiology (value = beauty/harmony) over an *ethical* axiology (value = well-being/justice).
