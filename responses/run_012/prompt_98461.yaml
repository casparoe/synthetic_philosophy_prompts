answer: |-
  The principle you are groping for is **Ex-Ante Policy Optimization**. You are a single agent choosing a probability distribution over actions before departure, not two agents meeting at exits.

  **Clause 1: No Local Updates Without Information.**
  Case 3 forces this. Since you cannot remember writing the note, reading it provides no new information about your location. Your belief state at Exit 1 is identical to Exit 2. Therefore, you cannot condition your action on location; you must stick to the pre-calculated mix. Case 2 confirms the converse: the passenger provides genuine information, breaking the amnesia and allowing deterministic local action.

  **Clause 2: Maximize Expectation, Not Security.**
  Case 1 forces this. You accept the risk of the motel (1) to chase home (4) because the weighted average (1.33) beats the best deterministic option (continuing always for 1). You are implicitly risk-neutral here.

  **New Case: High Overshoot.**
  Suppose the motel pays 10, Exit 1 pays 3, Exit 2 pays 4. The optimal policy shifts to **Continue Always ($p=1$)**. The "error" of missing Exit 2 becomes the primary value source. Your threshold rule fails here; it's not about insuring against bad outcomes, but where the expected mass lies. If the floor is high enough, you never exit.

  **Verdict on Gut Calls:**
  **Case 4 must go.** Your hesitation is risk aversion, but you didn't apply it in Case 1. In Case 1, you accepted variance for a 33% gain over the deterministic baseline. In Case 4, you reject variance for a 2% gain. Consistency demands you either take the 2% edge (Case 4) or admit you're risk-averse and stop randomizing in Case 1. Under standard rationality, Case 4 is an error; 3.06 > 3.

  **Verdict on Threshold Rule:**
  **Inconsistent.** It's risk aversion masquerading as a principle. It collapses if payoffs scale. If Case 1 payoffs were (0, 400, 100), would you still randomize? If Case 4 were (300, 400, 0), would you still stop? The principle is Expected Value, not "bad enough." You are treating small probabilities of zero as catastrophic in Case 4 but ignoring the certainty of sub-optimal returns in Case 1. Pick a utility function and stick to it.
