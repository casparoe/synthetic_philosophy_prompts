          5.  Evaluate if any reading actually licenses the conclusion ("vision is as unreal as a dream").
          6.  **Tone/Format:** A "menu" for the manuscript, not a verdict on correctness. Nuanced, precise, philosophical but grounded in neuroscience.

  2.  **Deconstruct "Perception is Controlled Hallucination":**
