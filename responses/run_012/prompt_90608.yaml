          *   Condition: Overlapping neural substrates (visual cortex active in both).
      *   *Claim 4: Perceived Content is Mind-Dependent/Constructed.*
          *   Classification: Conceptual/Definitional Claim (trivially true in a sense) vs. Substantive (if implying *only* mind).
          *   Condition: Experience requires a mind, but does it require a world?
      *   *Claim 5: The World is Not As It Appears.* (Qualia vs. Properties).
          *   Classification: Philosophical/Conceptual Claim.
