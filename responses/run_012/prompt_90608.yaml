          *   Classification: Substantive Empirical Hypothesis (well-supported).
          *   Condition: Brain uses priors to interpret ambiguous data.
      *   *Claim 2: Sensory Signal as Error Correction.* (Predictive Coding).
          *   Classification: Substantive Empirical Hypothesis (dominant framework).
          *   Condition: Brain predicts input, updates based on difference (prediction error).
