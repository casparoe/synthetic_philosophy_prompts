      *   *Deliberation:* SP says bypassing lazy deliberation helps. AP says bypassing deliberation treats them like objects.
      *   *Endogenous Preferences:* SP says we help them achieve what they *would* want if calm. AP says "what they would want" is fiction if their wants are built by previous nudges.

  6.  **Drafting - Step 4: Cruxes:**
