      *   *Clear Cases:* Dark patterns (deception) are bad. Safety defaults (e.g., seatbelts) are good.
      *   *Preference Stability:* User preferences are not always stable or well-defined prior to choice.
      *   *Transparency:* Transparency is good but does not automatically neutralize influence.
      *   *Responsibility:* Engineers share responsibility for downstream effects, not just code correctness.

  5.  **Drafting - Step 3: Disagreements (The Fault Lines):**
      *   *Means vs. Ends:* SP says we tweak means to help ends. AP says ends are shaped by means, so the distinction collapses.
