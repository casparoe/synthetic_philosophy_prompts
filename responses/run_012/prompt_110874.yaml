  4.  **Drafting - Step 2: Agreed Claims:**
      *   Need substantive claims, not truisms.
      *   *Unavoidability:* Design always shapes choice. Neutrality is impossible.
      *   *Definition:* A nudge is any design feature that predictably alters behavior without forbidding options or significantly changing economic incentives.
