answer: |-
  **Population Ethics Sorting Tree**

  **Root Question:** You could add a billion people whose lives are just about worth living. Does that make things better, worse, or neither?

  **1. Branch: 'Worse'**
  *   **Follow-up:** Is coming into existence inherently a harm to the person born?
      *   **Yes:** **Antinatalism**. (Existence is a harm).
      *   **No:** **Average Utilitarianism**. (Existence isn't harmful, but adding these lives lowers the average welfare, which is what matters).
      *   *Note:* These views converge on the case but diverge on the principle.

  **2. Branch: 'Neither'**
  *   **Follow-up:** Suppose instead you could add a billion people whose lives are *ecstatically* happy. Does that make things better?
      *   **No:** **Person-Affecting View** (Unnamed). (Adding people is never intrinsically better; only improving existing lives matters).
      *   **Yes:** **Critical-Level Utilitarianism**. (Adding lives is good, but only if welfare exceeds a specific threshold; 'just worth living' was below it).

  **3. Branch: 'Better'**
  *   **Follow-up:** Imagine two worlds with identical total welfare. World A has 10 people; World B has 20. Is B better simply because it has more people?
      *   **No:** **Total Utilitarianism**. (More happy people is better, but only insofar as it increases the total sum of welfare).
      *   **Yes:** **Pronatalism** (Unnamed). (Natality is a value independent of welfare; more people is good for reasons like duty to the species or the value of creation itself).

  ***

  **Notes on Combinations and Gaps**

  **Separating the Leaves**
  This tree successfully separates all six required views. The crucial split occurs at the Root. Many assume the debate is solely between Total and Average Utilitarianism, but this structure highlights the Person-Affecting and Pronatalist outliers. The 'Neither' branch is where the real crux lies: distinguishing those who think welfare matters but requires a threshold (Critical-Level) from those who think new people don't count morally at all (Person-Affecting).

  **Convergent Answers**
  The tree cannot separate **Antinatalism** and **Average Utilitarianism** at the Root node alone; both answer 'Worse' to adding barely worth living lives. They are only distinguished by the follow-up regarding inherent harm. In a quick show-of-hands session, these participants will initially group together. You must press the 'Why?' to separate them.

  **Empty Combinations**
  There are logically possible combinations that nobody occupies.
  *   *The 'Reverse Critical-Level' View:* Someone who answers 'Better' to adding lives just worth living, but 'Worse' to adding ecstatically happy lives. This is incoherent; if low welfare is good, higher welfare must be too.
  *   *The 'Welfare-Irrelevant Pronatalist':* Someone who answers 'Neither' to the Root (welfare adds nothing) but 'Yes' to the Pronatalist leaf (more people is good). This is technically possible (valuing numbers over welfare entirely), but philosophically unstable. If welfare doesn't make adding people better, why does mere existence? Most pronatalists argue existence *brings* welfare value, placing them in the 'Better' branch.

  **Possible Incoherencies**
  Be wary of participants who answer 'Better' to the Root but 'No' to Total Utilitarianism (denying total welfare matters) and 'No' to Pronatalism (denying numbers matter). This combination suggests they think adding lives is better for *some* reason not captured by welfare sums or natality values. Usually, this indicates confusion rather than a held position, often collapsing into Critical-Level views upon probing.

  **Using the Tree**
  Do not reveal the leaf names until participants have placed themselves. Ask them to stand in three corners of the room (Better, Worse, Neither), then subdivide using the follow-ups. This physicalises the disagreement. You will likely find the 'Neither' corner is the most crowded; this is where the term's hardest philosophical work lies. The 'Better' corner often contains the most confident participants, unaware that their view implies the Repugnant Conclusion (that a massive population of barely worth living lives is better than a small, happy one).

  This exercise reveals that 'pronatalism' is not a single view. The leaf labelled **Pronatalism** here is distinct from the casual pronatalism of **Total Utilitarianism**. The former values people even without welfare gains; the latter values people only as vessels for welfare. Distinguishing these early prevents talking past one another when discussing policy, such as baby bonuses funded by tax. If you are a Total Utilitarian, you might support the bonus only if the new lives are happy enough to offset the tax cost. If you are a Pronatalist, you might support it regardless. If you are Person-Affecting, you oppose it entirely.

  Keep the cases concrete. When discussing the 'Neither' branch, ask: "If you could press a button to create a happy child who never interacts with anyone else, would you?" The Person-Affecting theorist says no; the Critical-Level theorist says yes. This tangible distinction matters more than the labels.
