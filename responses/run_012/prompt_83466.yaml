answer: |-
  Good evening. Thank you for coming.

  We are gathered because a neighbor who loved this city left us a gift. It is a rare thing to be given the chance to build something permanent, to decide what kind of place we want to be when we grow up. The will offers us two paths. One is a professional theater, a new building on the old market site, with a resident company and a subscription season. The other is a permanent fund for public festivities, free to all, held in our squares and parks, supporting music, dancing, and amateur productions anyone can join.

  The City Council has convened this forum to hear from you. As chair of the citizens' committee, my job is to set the terms for our deliberation. I need to be honest with you about where I stand. Many of you know that I have studied the arguments against building a theater. I am convinced by the case that a community is best served by gatherings where everyone participates, rather than gatherings where a few perform and the many watch.

  But I am not standing here to deliver a sermon. I am not here to tell the artists in this room that their work is wicked. I know some of you have given your lives to the stage. You are our neighbors. You grew up here. This is not about your character or your craft. It is about the structure of the institution we are being asked to build.

  The argument I care about is not the common one. It is not about whether plays teach bad lessons. It is about what happens to us when we make a habit of paying a class of people to simulate feelings we do not have. When we assemble in a dark hall to watch them, we are moved by passions we have no stake in and cannot act upon. We leave feeling we have experienced something noble, without having done anything noble. A city that acquires a taste for this acquires a need for it. The risk is not vice, but passivity. The risk is learning to prefer being a spectator to being a citizen.

  The alternative is not austerity. It is festivity. It is the open air, where the lines between performer and audience dissolve. It is the understanding that we are enough entertainment for ourselves. That is why the second option in the bequest appeals to me.

  However, I know that argument was made for a specific city, centuries ago. It was built on facts about a place that is not ours. We cannot simply repeat it here. We have to remake it.

  Some parts of that old argument we must leave behind. There were claims made about women and the proper order of the sexes that most of this room will reject. I reject them too. We do not believe that women should be hidden from public view. But there is a usable insight underneath the prejudice. It is about the difference between a public that gathers to judge appearances and a public that gathers to share experience. When we turn community life into a spectacle, we change the currency of our relationships. We start to value being seen over being together. We should keep that warning, even if we discard the old rules that came with it.

  We also have to confront the facts of this city today. We are not a closed circle of neighbors who see each other at work on Monday. We are a weekend destination. A third of the people who would buy theater subscriptions live elsewhere. They come in summer. They leave on Sunday. If we build a theater, it will depend on that transience to survive. It will not be a hearth for the people who live here year-round; it will be a showcase for people passing through. That makes the risk of passivity even greater. It turns our culture into a commodity for visitors, rather than a practice for residents.

  And I must be honest about the alternative I prefer. The festival fund will not be pure. The Council will insist that the events be livestreamed for those who cannot come out. This means even the festival will create an audience of watchers at home. I cannot claim otherwise. But there is a difference between a screen broadcasting a party you were invited to join, and a ticketed seat in a hall you are forbidden to enter. One is a window; the other is a wall. The festival begins with the invitation to participate. The theater begins with the invitation to watch.

  So, I have to make a choice, and I want you to know mine. I recommend we accept the permanent fund for public festivities.

  I recommend this not because I distrust art, but because I trust us. I trust that we do not need to pay professionals to teach us how to feel. I trust that our squares and parks are better suited to our life than a dark auditorium. I trust that a city that sings together, dances together, and argues together in the open air is stronger than a city that sits in rows and applauds.

  The theater advocates in this room are my friends. I know they believe they are building a home for beauty. But I believe we already have a home. It is the ground we stand on. The bequest gives us a chance to light it up.

  We have two days ahead of us. The panels will speak. You will speak. We will disagree. But do not expect me to pretend I am neutral. I have told you what I think. Now I invite you to tell me what you think, so that when we vote, we do so with our eyes open.

  Thank you.
