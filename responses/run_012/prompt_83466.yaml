      *   *Constraint:* "They must land on a clear recommendation between the two uses of the bequest." -> Must explicitly say "I support the fund."
      *   *Constraint:* "No quotes or citations." -> Check for any accidental "Social Contract" references.
      *   *Constraint:* "Plain sentences, no jargon." -> Keep it conversational.

  8.  **Final Polish:** Check flow and timing. Ensure the transition from the philosophical to the practical (livestream/tourists) is smooth. Make sure the respect for theater workers is palpable.

      *(Self-Correction during drafting)*: I need to be careful not to make the livestream sound *too* much like the theater. The distinction is that the *event itself* is participatory, even if the broadcast isn't. The theater event itself is passive. That's the key distinction.

      *(Self-Correction on Women)*: Make sure to explicitly state that some of Rousseau's views are rejected, not just ignored. "We reject the old rules about women..."

      *(Self-Correction on Transience)*: Emphasize that a theater dependent on tourists undermines the "community" aspect Rousseau cared about.

      *(Word Count Check)*: Aiming for ~1100 words.

  9.  **Final Read-Through:** Does it sound like a Chair speaking? Yes. Is it respectful? Yes. Is it firm? Yes.

