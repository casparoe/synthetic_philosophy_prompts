      *   *The Argument:* It's not about morality plays. It's about passivity. We pay others to feel. We sit in the dark. We leave feeling good about feeling, without acting.
      *   *The Festival:* Open air. No tickets. You are the performer.
      *   *Nuance (Geneva vs. Here):* That argument was for a specific place. We are different. We are a weekend spot.
