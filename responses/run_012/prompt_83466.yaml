      *   *Nuance (Transience/Livestream/Locals):* Theater relies on outsiders. Festivals will be streamed (admitting imperfection). Theater actors are neighbors (respect them).
      *   *Conclusion:* I choose the festival. It makes us active. Let's discuss.

  7.  **Review against specific "Hard" Constraints:**
