  You can draft a procedure that mimics Anscombe's logic, but it will force your committee to make metaphysical distinctions about intention they are untrained to handle, and it will fail to adjudicate the slavery case because her Truman argument rests specifically on the prohibition against killing innocents.

  ### The Decision Procedure

  **Step 1: Act Identification**
  *   **Question:** What specific act is the honor commemorating?
  *   **Adequate Answer:** A discrete action or policy decision attributable to the individual (e.g., "Ordered Bombing of City X," "Signed Deportation Order Y," "Invested in Slave Ship Z").
  *   **Termination:** If the honor is for general "leadership" or "philanthropy" without a specific act identified, the petition fails for lack of specificity.

  **Step 2: The Innocence Constraint**
  *   **Question:** Did the act involve the death or grave bodily harm of persons who were not direct combatants or immediate threats?
  *   **Adequate Answer:** Yes/No based on historical record, not moral evaluation.
  *   **Termination:** If **No**, the procedure stops here and recommends **No Action** (unless you expand the framework, see below). This is where Anscombe's Truman argument strictly limits itself to killing.

  **Step 3: The Intentionality Test (The Anscombe Pivot)**
  *   **Question:** Was the death/harm of these innocents intended as a *means* to achieve the goal, or merely *foreseen* as a side effect?
  *   **Adequate Answer:** Evidence that the harm was necessary for the success of the plan (Means) vs. evidence that the plan would have succeeded without the harm had circumstances been different (Side Effect).
  *   **Termination:** If **Means**, recommend **Rescind/Remove**. If **Side Effect**, proceed to Step 4.
  *   **Note:** This is where non-philosophers will fail. They will conflate "knowing it will happen" with "intending it."

  **Step 4: The Justification Filter**
  *   **Question:** What justification is offered for the act?
  *   **Adequate Answer:** Either "It produced good outcomes" (Consequentialist) or "There was no other choice" (Necessity).
  *   **Procedure:**
      *   If **Consequentialist** (e.g., "It shortened the war"): Disregard entirely. Anscombe holds good consequences do not launder murder.
      *   If **Necessity** (e.g., "No alternative"): Reject unless physical impossibility of any other action is proven. Mere strategic difficulty does not count.
  *   **Termination:** If the act failed Step 3 (Means), these justifications are irrelevant. If the act passed Step 3 (Side Effect), these justifications are also irrelevant to the moral fact, though they may explain the context.

  **Step 5: The Honor Compatibility Check**
  *   **Question:** Can the university honor someone who committed this act?
  *   **Adequate Answer:** No.
  *   **Termination:** If Step 3 was failed (Means), the recommendation is **Rescind/Remove**. If Step 3 was passed (Side Effect), the recommendation is **Retain**, unless the committee chooses to expand the framework beyond Anscombe's strict killing prohibition.

  ### Where the Procedure Breaks and Betrays the View

  **1. Softening "Murder" to "Wrongdoing"**
  To make this runnable for a dean, you will inevitably soften Anscombe's claim that Truman was a *murderer* to a claim that he committed a *grave moral wrong*. Anscombe insisted this was a matter of fact, like identifying a poison. Softening it to "wrongdoing" turns it into a value judgment, which hands the final authority back to the president's risk assessment. This betrays the view because it admits the committee is weighing reputational costs, not discerning moral facts.

  **2. The Intentionality Trap**
  Non-philosophers will reliably get Step 3 wrong. They operate under a "foreseen = intended" heuristic. If a general bombs a factory knowing 100 civilians will die, the committee will likely say he intended their deaths. Anscombe says if the goal was destroying the factory and the deaths were not the *method* of destruction, he did not intend them. To make the procedure runnable, you would have to simplify this to "Did they target civilians?" But Anscombe's point was precisely that targeting cities *as cities* is the murder, even if disguised as military strategy. Simplifying this removes the philosophical work the procedure is supposed to do.

  **3. The "No Alternative" Illusion**
  Anscombe holds that claims of necessity are usually false. A committee of bureaucrats lives in a world of compromise. They will accept "political necessity" as a valid alternative to "physical impossibility." To enforce Anscombe's view, you must instruct them to ignore political constraints entirely. They will not do this.

  ### Application to Current Petitions

  **(a) Wartime Head of Government (Military Target + Civilian Deaths)**
  *   **Procedure Output:** **Retain Honor (conditionally).**
  *   **Reasoning:** Under Step 2, innocents died. Under Step 3, if the target was a *genuine military target* and the strategy did not rely on civilian death to break enemy will (i.e., death was foreseen side effect, not intended means), Anscombe's framework does not classify this as murder. The "knowing it would kill" clause triggers the committee's intuition to rescind, but Anscombe's distinction between intention and foresight protects the actor here.
  *   **The Trap:** Your committee will likely rescind anyway because they cannot sustain the intention/foresight distinction. If you force them to follow the procedure, they will feel they are letting a killer off the hook. If you let them vote vibes, you haven't changed anything.

  **(b) Founder (Slave Trade Fortune)**
  *   **Procedure Output:** **No Action (Procedure Failure).**
  *   **Reasoning:** Step 2 asks about death or grave bodily harm. While slavery involves violence, the petition cites *fortune from trade*, not direct killing orders. Anscombe's Truman argument is specifically about the intentional killing of innocents. Slavery is a property/personhood violation.
  *   **The Betrayal:** To recommend removal here, you must expand Step 2 to include "treating humans as property." This betrays Anscombe's specific argument because it shifts from a prohibition on *killing* to a prohibition on *exploitation*. Anscombe would condemn slavery, but the *Truman procedure* doesn't catch it. You are on your own here; you cannot use Anscombe's logic without generalizing it into a utilitarian-style "grave evil" calculus, which she rejected.

  **(c) Mid-level Official (Deportation Paperwork)**
  *   **Procedure Output:** **Remove Plaque.**
  *   **Reasoning:** Step 1: Signing paperwork. Step 2: Deportation leads to death/harm of innocents. Step 3: Did he intend the deportation? Yes. Was the harm a means or side effect? If the deportation was to camps, the harm is intrinsic to the act. He intended the act. Step 4: "Just following orders" is a necessity defense. Anscombe rejects this; moral agency is not suspended by hierarchy.
  *   **The Trap:** The committee may hesitate because he was "mid-level." Anscombe's view is individualistic; there is no "small murderer." The procedure works here, but it requires the committee to accept that bureaucratic compliance is intentional cooperation in evil.

  ### What The Procedure Cannot Do

  1.  **Protect the President from Headlines:** Anscombe's framework is designed to be counter-cultural (she stood against the consensus on Truman). If the committee recommends rescinding based on this, it may *cause* a front-page story, not prevent one. The procedure optimizes for moral consistency, not institutional risk.
  2.  **Handle Structural Sin:** It works on individual acts (bombing, signing orders). It fails on systemic accumulation of wealth (Case B) or cultural attitudes that weren't codified as specific lethal orders.
  3.  **Resolve Disagreement on Facts:** Anscombe assumes moral facts are discernible. Your committee will disagree on whether a target was "genuine military" or "terror." The procedure cannot adjudicate historical ambiguity; it only processes the moral logic once facts are agreed upon.
  4.  **Prevent Philosophical Drift:** Without a philosopher chairing every session, the "Intention" question will drift into "Negligence" or "Recklessness," turning Anscombe's absolute prohibition into a standard liability assessment.

  You want to use Anscombe to stop the vibes, but her view is that most people are incapable of making these distinctions correctly because they are corrupted by consequentialist thinking. By handing this to a dean and two students, you are building a machine designed to fail according to its own operator's manual.
