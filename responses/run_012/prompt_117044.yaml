answer: |-
  In the realm of Aethelgard, King Alaric rules as a legitimate monarch who has descended into rapacious tyranny, seizing property and executing rivals without cause, inflicting widespread harm on the commonwealth. A private citizen, Elara, acting alone without consulting any council or magistrate, assassinates Alaric in his chamber; the transition of power is immediate and peaceful, the populace rejoices, and no factional violence erupts. Under the requested verdict, Aquinas must find this permissive because the act successfully restores the common good without triggering the greater evil of sedition or civil war, satisfying the consequentialist caveat that usually restricts private action, effectively treating the absence of public recourse as a state of necessity where the private act becomes an instrument of divine providence rather than sedition.

  In the identical realm of Aethelgard, facing the identical tyranny of King Alaric and the same scale of harm, the polity's legitimate public authority—the High Council—formally authorizes the killing of the King to restore order. However, the Council is deeply factionalized, and their authorization triggers a constitutional crisis where loyalist armies clash with council militias, plunging the realm into a decade of civil war that causes more suffering than Alaric's tyranny ever did. Under the requested verdict, Aquinas must find this prohibitive not because the authority lacks the standing to act, but because the act fails the primary test of political morality: the preservation of the common good, rendering the public authorization moot when the consequence is the destruction of the polity it was meant to save.

  I must admit that I cannot hold everything else fixed here; the variable actually doing the work is not the public/private line itself, but the *risk of greater evils* associated with each actor. Aquinas does not grant private citizens a blanket permission that he denies to public authority; rather, he presumes public authority is less likely to cause chaos. To get your verdicts, I had to smuggle in a difference in probable consequences: the private act succeeds quietly, while the public act triggers war. If you drop the condition of "risk of greater evils," the pair collapses: Aquinas would forbid the private killing (as sedition) and permit the public killing (as justice), regardless of the outcome, because he views the *order* of authority as intrinsically tied to the common good. The public/private distinction is only instrumental for Aquinas; the teleological end (peace and virtue) is what carries the weight.

  The strongest attack a defender of Aquinas would make is to argue that these scenarios misunderstand the metaphysics of authority: a private citizen literally *cannot* act for the common good in this manner because they lack the ordination to that end, making the act intrinsically disordered regardless of the peaceful outcome. By allowing Elara's private assassination, you reduce Aquinas to a crude consequentialist, ignoring his insistence that private killing usurps a judgment belonging to God or the public person, thereby poisoning the political order even if the immediate result is peace. The defender would insist that the "greater evil" is not just civil war, but the normalization of private violence, which erodes the very possibility of law, meaning the first scenario remains forbidden even if it looks successful.
