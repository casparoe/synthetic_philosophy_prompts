      *   The language needs to be evocative but precise. The user wants to judge *dialogue*. So the criteria need to be things a character might violate in speech.
      *   Avoid academic jargon where possible, or define it through the lens of the farm.
      *   Ensure the "Uncertainty vs. Ignorance" distinction is clear (Uncertainty = we know the odds; Ignorance = we don't know what we don't know).

