answer: |-
  ### Specification for a Theory of Aquatic Welfare
  **Context:** Operational decision-making on a mixed-species estuary farm (salmon/shrimp).
  **Agent:** Welfare Officer.
  **Constraint:** Decisions must be made under epistemic uncertainty and industrial scale.

  ---

  ### I. The Desiderata

  To possess moral texture, the theory governing your character's decisions must satisfy the following requirements. If a line of dialogue or internal monologue violates these, the moral reasoning is cheating.

  #### 1. Phenomena the Theory Must Explain
  *   **The Distributed Mind:** It must explain how an animal with a decentralized nervous system (shrimp/prawn) can exhibit learning, memory, and wound-tending without assuming a centralized "pain center" like a mammal. It cannot equate *complexity of hardware* with *absence of experience*.
  *   **The Ambiguous Signal:** It must account for why an animal might thrash, freeze, or flee in response to both a painful stimulus and a non-painful stressor (e.g., sudden shadow vs. electric shock). It must provide a criterion for distinguishing *suffering* from *alarm*.
  *   **The Latency of Harm:** It must explain how a practice can cause harm that is not immediately visible (e.g., chronic stress, neurological damage) versus harm that is acute and visible (e.g., physical injury).

  #### 2. Cases the Theory Must Get Right
  *   **The Prawn's Wound:** If a prawn avoids a noxious stimulus after one trial and guards an injury, the theory cannot dismiss this as mere reflex. It must assign some moral weight to the *integration* of that signal, even if the substrate is alien to us.
  *   **The Ambiguous Fish:** If a salmon reacts identically to a net transfer (stress) and a chemical burn (pain), the theory must not declare the pain "unproven." It must specify what *additional* evidence (physiological, contextual, or longitudinal) would shift the probability of suffering.
  *   **The Hatchery Trade-off:** If a protocol saves 90% of the batch but causes chronic deformity in the surviving 10%, the theory must not simply sum the biomass. It must have a mechanism for weighing the intensity of harm to the few against the survival of the many.
  *   **The Species-Specific Stunning:** If a voltage stuns salmon instantly but cooks shrimp alive, the theory cannot accept a "standard protocol." It must mandate species-specific validation, treating the failure of the method on shrimp as a moral failure, not a technical footnote.
  *   **The Indicator Problem:** The theory must prioritize the hard-to-measure indicator (suffering) over the easy-to-measure indicator (growth rate/fin erosion) when they conflict. High growth with high suffering must be registered as a welfare failure, not a production success.
  *   **The Larval Die-off:** The theory must define a threshold for moral status. If 80% of larvae die naturally before they can feel pain, the theory must not demand their rescue, but it must define the point at which their death becomes a welfare violation rather than a biological constant.

  #### 3. Distinctions the Theory Must Not Collapse
  *   **Welfare vs. Health:** An animal can be disease-free and growing fast (Health) while in a state of terror or chronic pain (Welfare). The theory must not allow "clinical health" to substitute for "good life."
  *   **Pain vs. Nociception:** Nociception is the detection of damage; pain is the negative experience of it. The theory must allow for the possibility of one without the other, and not assume nociception guarantees pain, nor that lack of vocalization guarantees lack of pain.
  *   **Sentience vs. Capacity to Suffer:** Sentience is the ability to feel; suffering is a specific valence of feeling. The theory must acknowledge that a sentient being might not suffer in a specific context, but remains a moral subject.
  *   **Individual vs. Population:** The theory must not dissolve the individual into the "stock." A mortality rate is a statistic; a dead fish is an event. The theory must prevent the math from erasing the subject.
  *   **Uncertainty vs. Ignorance:** Uncertainty is knowing the risk (e.g., "10% chance this stuns"). Ignorance is not knowing what we don't know (e.g., "We don't know if shrimp feel"). The theory must handle Ignorance via a precautionary principle, not by treating ignorance as innocence.

  #### 4. Empirical Findings It Must Not Contradict
  *   **Ectothermy:** Fish and crustaceans process stimuli slower or differently than mammals due to temperature dependence. The theory cannot interpret a slower reaction time as a lack of feeling.
  *   **Scale:** Individual identification is impossible for shrimp. The theory must offer a framework for *group* welfare that does not rely on naming or tracking individuals, without reducing them to mere fluid dynamics.
  *   **Invertebrate Physiology:** Crustaceans have hemolymph, not blood; ganglia, not brains. The theory cannot require mammalian anatomy as a prerequisite for moral consideration.

  ---

  ### II. Analysis of Requirements

  #### Non-Negotiable vs. Preference
  *   **Non-Negotiable:**
      *   **Action-Guidingness:** The theory must yield a decision. A theory that concludes "we cannot know" is useless to an officer who must sign off on a stunning protocol today.
      *   **Empirical Consistency:** It cannot contradict established biology (e.g., claiming shrimp feel nothing because they lack a cortex, when they exhibit complex avoidance learning).
      *   **Non-Collapse of Health/Welfare:** If the book treats fast growth as synonymous with good welfare, the moral texture is false.
  *   **Preference (Camp-Dependent):**
      *   **Aggregation:** Whether it is permissible to sacrifice the 10% deformed fish for the 90% survival rate is a utilitarian preference. A rights-based view would reject this trade-off entirely.
      *   **Thresholds:** Where exactly moral status begins (larva vs. juvenile) is often a line drawn by necessity rather than nature.
      *   **Positive vs. Negative:** Whether the goal is merely to prevent suffering (negative) or to ensure a "good life" (positive) changes the workload but not necessarily the critical decisions.

  #### Flagged Tensions (The Source of Conflict)
  These are the friction points where your character will struggle. A theory that resolves these too neatly is suspect.

  1.  **Sentience Tracking vs. Action Under Uncertainty:**
      *   *Tension:* To track sentience accurately, we need invasive or impossible data. To act, we need heuristics.
      *   *Conflict:* If the officer waits for proof of shrimp sentience, they may authorize cruel protocols for years. If they assume sentience without proof, they may halt production based on a false positive.
      *   *Novelistic Utility:* This creates the anxiety of the "Precautionary Principle." Is the character protecting the animals or protecting their own conscience?

  2.  **Species-Neutral Consideration vs. Species-Specific Nature:**
      *   *Tension:* Moral equality suggests all suffering counts the same. Biological reality suggests a shrimp's "suffering" is fundamentally different from a salmon's.
      *   *Conflict:* Applying a salmon standard to shrimp is anthropomorphic (or "salmon-morphic"). Applying different standards risks speciesism (valuing one less because it is alien).
      *   *Novelistic Utility:* This drives the conflict between the biologist (who sees difference) and the ethicist (who sees equality).

  3.  **Avoiding Anthropomorphism vs. Avoiding Convenience:**
      *   *Tension:* We must not project human feelings onto fish (anthropomorphism). But demanding higher evidence for fish than for dogs is often just a license to exploit (convenience).
      *   *Conflict:* The "Benefit of the Doubt." How much doubt is required before we stop?
      *   *Novelistic Utility:* This is the internal monologue of the officer. "Am I being scientific, or am I just looking for an excuse to keep the farm running?"

  ---

  ### III. Scorecard of Theoretical Families

  Use this to evaluate the philosophical "voice" of your characters. No single theory passes all tests, which is why the job is hard.

  | Theory Family | Performance on Desiderata | Failure Mode in the Novel |
  | :--- | :--- | :--- |
  | **Hedonistic** (Focus on pleasure/pain balance) | **Strong** on the "Indicator Problem" (suffering is the metric). **Strong** on the "Prawn's Wound" (avoidance implies negative experience). | **Weak** on Scale. Calculating net pain across millions of larvae is impossible. Can justify horrific harm to a few if the "batch" benefits. |
  | **Preference-Satisfaction** (Focus on fulfilling desires) | **Strong** on "Individual vs. Population" (respects the animal's drive to live/escape). | **Weak** on "Ambiguous Fish." Hard to know what a fish wants beyond immediate avoidance. Fails on larvae (do they have preferences?). |
  | **Capacities-Based** (Focus on cognitive abilities) | **Strong** on "Distinctions" (clear thresholds for sentience). | **Weak** on "Distributed Mind." Risks excluding invertebrates because they lack specific cognitive hardware. Can become a checklist for exclusion. |
  | **Teleological / Functioning** (Focus on "fishiness"/natural behavior) | **Strong** on "Species-Specific Nature." Good for habitat design. | **Weak** on "Welfare vs. Health." A fish can naturally suffer (predation, disease). "Natural" does not mean "good welfare." |
  | **Relational / Care-Based** (Focus on the human-animal relationship) | **Strong** on "Action Under Uncertainty." Focuses on the officer's virtue and attentiveness. | **Weak** on "Scale." You cannot have a caring relationship with a million shrimp. Risks making welfare about the *human's* feelings, not the animal's state. |

  ### IV. Implementation Note for the Writer

  The moral honesty of your book depends on the **gap** between these requirements.

  *   If your character uses a **Hedonistic** line of reasoning to approve a stunning protocol, they should be haunted by the **Scale** failure (the inability to count the pain).
  *   If they use a **Teleological** argument to keep a broodstock line, they should be challenged on the **Health vs. Welfare** distinction (is "natural" suffering okay?).
  *   If they claim **Ignorance** ("We just don't know if they feel"), check if they are violating the **Uncertainty vs. Ignorance** requirement. Ignorance is not a moral shield; it is a risk factor that demands caution.

  The theory is adequate only if it forces the character to make a choice where *something of value is lost*. If the theory allows them to be right without cost, it is not a theory of welfare; it is a theory of production.
