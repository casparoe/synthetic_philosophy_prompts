      *   **Tone:** Honest, morally textured, practical, rigorous but not academic.

  2.  **Deconstruct the Desiderata (The "Specification"):**
      *   I need to structure this as a technical specification for a moral framework, tailored to the novelist's need for "moral texture."
      *   *Phenomena to Explain:* Why does the prawn guarding the wound matter? Why does the fish's ambiguous behavior matter?
      *   *Cases to Get Right:* The specific scenarios listed in the prompt.
