      *   *Empirical Constraints:* Biology of ectotherms/invertebrates, scale of farming.

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *Requirement 1: The Sentience Threshold.* Must distinguish between reflex and feeling. (Addresses prawn case).
      *   *Requirement 2: The Specificity Constraint.* Must distinguish pain from stress/fear when behavior overlaps. (Addresses fish case).
