  11. **Final check on "Scorecard":** Keep it brief but sharp. Focus on how they help/hinder the *decision*.

  12. **Final check on "Tensions":** Ensure the specific tensions requested (Sentience/Action, Neutral/Specific, Anthropomorphism/Skepticism) are explicitly addressed.

