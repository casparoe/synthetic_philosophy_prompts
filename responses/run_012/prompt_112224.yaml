      *   *Conclusion:* A note on the character's burden.

      *(Self-Correction during drafting)*: Make sure I don't just list the cases but explain *why* the theory must handle them. For the prawn, it's about distributed nervous systems vs. centralized pain. For the larvae, it's about the onset of moral status.
      *   *Refining the "Uncertainty" point:* The prompt asks for "Uncertainty vs. Ignorance." Uncertainty is risk (known probabilities). Ignorance is structural (we don't know if they feel). The theory must handle *Ignorance* specifically because that's the core welfare problem.
      *   *Refining "Individual vs Population":* In aquaculture, biomass is often the metric. The theory must prevent "biomass" from erasing "individual."

