      *   *Requirement 4: Cross-Species Validity.* Must work for salmon *and* shrimp. (Addresses stunning case).
      *   *Requirement 5: Epistemic Humility/Actionability.* Must work when we can't measure suffering directly. (Addresses easy vs. hard indicators).
      *   *Requirement 6: Developmental Onset.* Must say when life starts counting. (Addresses larvae).
      *   *Requirement 7: Scalability.* Must function when $N=1,000,000$.
      *   *Requirement 8: Biological Realism.* Must respect ectothermy/invertebrate physiology.

  4.  **Analyzing Tensions and Non-Negotiables:**
      *   *Non-Negotiable:* Action-guidingness (it's a job), Empirical consistency (biology doesn't lie), Non-collapse of distinctions (otherwise the drama is fake).
      *   *Preferences:* Utilitarian aggregation vs. Deontological constraints.
      *   *Tensions:*
          *   *Sentience vs. Action:* If we wait for proof of sentience, we might act too late. If we act on uncertainty, we might waste resources or halt production unnecessarily.
          *   *Neutral vs. Specific:* Treating a shrimp like a salmon is wrong (biology), but treating them differently risks moral arbitrariness.
          *   *Anthropomorphism vs. Skepticism:* Assuming they feel like us is risky; assuming they feel nothing until proven otherwise is dangerous (precautionary principle).

