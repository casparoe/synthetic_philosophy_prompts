answer: |-
  I recommend we approve Version 1 (Plain Letter) for immediate use, reject Versions 2 through 5, and delay the launch by six weeks to accommodate revised materials and system adjustments.

  **MEMORANDUM**

  **TO:** Communications Standards Panel
  **FROM:** Chair, Communications Standards Panel
  **DATE:** October 23, 2023
  **SUBJECT:** Decision on Bowel Screening Programme Invitation Materials

  **Recommendation**
  I recommend we approve Version 1 (Plain Letter) for immediate use, reject Versions 2 through 5, and delay the launch by six weeks to accommodate revised materials and system adjustments.

  **Charter Interpretation**
  Our charter mandates that the department "informs and enables people and does not manipulate them." This establishes three criteria for all communications: accuracy (informing), agency (enabling), and respect for autonomy (non-manipulation). Effectiveness alone is not a sufficient metric for approval; the method of achieving effectiveness must comply with the charter.

  **Evaluation of Letter Versions**

  *   **Version 1 (Plain): Approve.** This version provides facts, dates, and booking instructions without emotional coercion or omission. It fully complies with the charter by informing and enabling autonomous decision-making.
  *   **Version 2 (Regret): Reject.** While factually accurate, this version relies on inducing anticipatory regret and fear to drive behavior. This bypasses rational decision-making in favor of emotional avoidance, which constitutes manipulation under our charter.
  *   **Version 3 (Deaths): Reject.** Presenting statistics using a ten-year window and cherry-picked boundaries to maximize alarm violates the "informs" criterion. Contextual manipulation designed to inflate perceived risk is misleading, even if individual data points are technically true.
  *   **Version 4 (Silence): Reject.** Omitting material information regarding false positives and overdiagnosis prevents informed consent. Withholding risks to increase uptake violates the "informs" criterion and undermines patient agency.
  *   **Version 5 (Pre-booked): Reject.** Changing the default from opt-in to opt-out exploits status quo bias. While often legally permissible, it shifts the burden of action to the patient and manipulates inertia rather than enabling active choice.

  **Vendor Pilot Ethics**
  The vendor's pilot of Versions 2 and 4 on 20,000 individuals without ethics review was not acceptable. Behavioral testing of this scale constitutes research, not standard communications deployment. Future A/B testing involving behavioral outcomes must undergo ethics review prior to implementation. We will require the vendor to submit a retrospective report on the pilot data for our records, but no further unreviewed testing is permitted.

  **Regarding Uptake vs. Ethics**
  One panel member has argued that blocking effective letters is itself unethical because reduced uptake leads to preventable deaths. This utilitarian perspective is noted and taken seriously. Saving lives is our primary mission. However, public health infrastructure relies on public trust. If the community perceives our communications as fear-mongering, deceptive, or coercive, engagement will collapse over the long term.

  Furthermore, screening is not an unconditional good; it carries risks (false positives, overdiagnosis, procedural complications). Ethical screening requires informed consent, not just participation. A letter that increases uptake by suppressing risk information or exploiting fear produces patients who are not fully consenting. We cannot meet our mortality reduction goals by compromising the autonomy and trust that sustain our programme. The charter exists precisely to prevent short-term gains from eroding long-term legitimacy.

  **Standing Rule for Future Campaigns**
  To ensure consistent application of the charter without requiring literature reviews for every draft, the following "Transparency Test" applies to all future external communications:

  1.  **The Completeness Check:** Does the material omit material risks or downsides to increase compliance? If yes, reject.
  2.  **The Mechanism Check:** Does the material rely on an emotional trigger (fear, regret, shame) rather than information to drive action? If yes, reject.
  3.  **The Disclosure Test:** If we added a sentence to the letter explaining *why* it was written this way (e.g., "We are mentioning these deaths to make you feel afraid"), would it undermine the letter's effectiveness?
      *   If the answer is **yes**, the technique relies on secrecy to work and is therefore manipulative. **Reject.**
      *   If the answer is **no**, the technique is transparent and permissible.

  Staff should apply this test at the draft stage. If a communication strategy cannot survive being explained to the recipient, it violates our charter.

  **Launch Timeline**
  Because Version 1 requires final formatting and the system must be reconfigured to support opt-in booking rather than pre-booking, we cannot launch next month. The launch date will move to [Date 6 Weeks Out]. This delay is necessary to ensure compliance with our ethical standards and to rebuild the vendor workflow around approved testing protocols.

  Please confirm your agreement by Thursday noon so we can brief the vendor.
