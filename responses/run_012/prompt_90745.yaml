prompt: |-
  I'm putting together a small theory pod -- me plus two grad students, one semester -- on the orthogonality thesis and instrumental convergence, and I'd rather spend it on questions that actually pay off than on re-deriving the standard story everyone already knows. So which open questions here are live, and which should we hit first? The ones I keep circling: whether instrumental convergence is really a claim about *goals* at all, or whether it's better stated as a claim about the robustness of certain subgoals across a class of environments and decision theories -- my suspicion is that the goal-based framing smuggles in a lot, like that the agent's objectives are fixed and representable as a utility function, and that once you relax that for a bounded or learned agent the convergence claim gets much weaker or has to be restated entirely. Related: is "orthogonality" one thesis or a cluster of them (about goal content, about the complexity of goals, about what intelligence is even supposed to mean), and does any version survive if you insist on bounded rationality rather than ideal agents? And is this the kind of thing you can actually argue for with toy models and formal results, or is it inherently a claim about the space of possible mind designs that we can only reason about informally? Rank these for a philosophy-heavy group with limited ML background, tell me why each is upstream or downstream of the others, and say what new argument or result would move it up or down the list. I care way more about the reasoning then the final list.
