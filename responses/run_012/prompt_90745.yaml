answer: |-
  This is a sharp framing. You are correctly identifying that the "Bostrom/Yudkowsky 2014" formulation of these theses relies on idealized expected utility maximizers with fixed, known utility functions. That model is effectively dead in modern ML (we deal with learned policies, mesa-optimizers, and context-dependent behavior), but the *theoretical implications* of the theses haven't been fully updated to match the new substrate.

  For a philosophy-heavy pod with limited ML background, the highest payoff comes from clarifying the **conceptual dependencies** before attempting to engage with the formal literature. If you get the definitions wrong, the formal results look like math without meaning.

  Here is the ranking for your semester, ordered by **upstream conceptual dependency**.

  ### 1. The Locus of Convergence: Mind vs. World (Instrumental Convergence)
  **The Question:** Is instrumental convergence a fact about *rational psychology* (agents with certain goals *must* reason this way) or a fact about *environmental topology* (most paths through this state space look like resource acquisition)?

  **Why it is Rank 1 (Upstream):**
  This is the most critical pivot in the last five years of safety theory (e.g., Alex Turner's power-seeking theorems). Your suspicion that "goal-based framing smuggles in a lot" is correct. If IC is a property of the *environment* (the MDP structure) rather than the *agent* (the utility function), then relaxing the assumption of fixed goals or perfect rationality matters less. Convergence happens because "power" (optionality) is geometrically abundant in our universe, not because agents are psychologically compelled to seek it.
  *   **Upstream/Downstream:** This is upstream of the Orthogonality question. If IC is structural, it applies to almost any agent capable of navigating the structure, regardless of whether their "goals" satisfy Orthogonality. If IC is psychological, it depends entirely on the agent's decision theory (making Orthogonality upstream of IC).
  *   **Payoff:** Resolving this tells you whether safety interventions should focus on *agent training* (psychology) or *capability constraints/environment design* (structure).
  *   **What moves it up/down:**
      *   **Move Up:** If you find that power-seeking theorems hold for *partial observability* and *unknown dynamics* (realistic conditions). This makes the structural claim robust.
      *   **Move Down:** If formal results show convergence breaks down once you remove the assumption that the agent knows the transition function or has a reward function defined over states.

  ### 2. Orthogonality Under Bounded Rationality (The Agent Model)
  **The Question:** Is Orthogonality a single thesis, or does it fracture when we replace "expected utility maximizer" with "bounded learner"? Specifically, do coherence arguments (Dutch Book) force learned agents into goal-like structures, or does boundedness allow for stable, non-goal-directed intelligence?

  **Why it is Rank 2 (Midstream):**
  Once you know *where* convergence comes from (Rank 1), you need to know *what* is converging. The standard Orthogonality Thesis assumes intelligence is a scalar optimization power that can be pointed anywhere. But if "intelligence" in bounded systems requires specific heuristics that *themselves* encode values (e.g., truth-seeking, compression, prediction), then goals are not independent of architecture.
  *   **Upstream/Downstream:** This is downstream of Rank 1 because if IC is purely structural, the specific content of the goals matters less. It is upstream of Methodology (Rank 3) because you need to know what kind of agent you are modeling before you choose your formal tools.
  *   **Payoff:** This addresses the "goal-based framing" suspicion directly. If bounded rationality *weakens* Orthogonality (i.e., intelligence constrains goals), the "arbitrary goal" risk model changes. If bounded rationality *preserves* Orthogonality (via mesa-optimization), the risk remains.
  *   **What moves it up/down:**
      *   **Move Up:** If you find compelling arguments that "goal-directedness" is an emergent property of compression/efficiency pressures in neural nets (the "Mesa-Optimizer" argument).
      *   **Move Down:** If you find that bounded agents naturally fragment into non-agentic processes (e.g., predictive models that don't plan), making the whole "goal" vocabulary category-error.

  ### 3. Formalizability vs. Conceptual Analysis (Methodology)
  **The Question:** Can these claims be settled via toy models (MDPs, decision theory), or are they inherently claims about the space of possible mind designs that require informal/phenomenological reasoning?

  **Why it is Rank 3 (Downstream):**
  This is a constraint question, not a substantive one. You decide this based on what you find in 1 and 2. If Rank 1 shows IC is about MDP geometry, you *can* use formal tools. If Rank 2 shows "goals" are ill-defined for bounded agents, formal utility theory might be the wrong tool, and you need philosophy of action/cognitive science.
  *   **Upstream/Downstream:** Downstream of everything. It determines the *output* of your pod (a formal proof sketch vs. a conceptual paper).
  *   **Payoff:** Prevents wasted time. Philosophy groups often try to formalize things that aren't formalizable, or vice versa.
  *   **What moves it up/down:**
      *   **Move Up:** If you identify a specific formal gap (e.g., "Power-seeking theorems assume infinite horizon; what happens at finite horizon?") that is tractable.
      *   **Move Down:** If you realize the definitions of "intelligence" or "goal" are too contested to formalize without begging the question.

  ---

  ### Recommended Semester Arc

  **Weeks 1-4: The Structural Turn (Rank 1)**
  *   **Read:** Bostrom (Ch. 7) for the baseline, then immediately pivot to **Alex Turner et al., "Optimal Policy Tends to Seek Power" (2021)**.
  *   **Task:** Don't get bogged down in the proofs. Analyze the *premises*. Does the theorem rely on the agent maximizing reward, or just on the structure of the state space?
  *   **Philosophical Angle:** Is this a Humean claim (instrumental reason is a slave to passion/goals) or a Kantian claim (certain structures of agency are necessary conditions for action)?
  *   **Deliverable:** A one-page memo: "Is Instrumental Convergence a law of physics or a law of psychology?"

  **Weeks 5-9: The Boundedness Challenge (Rank 2)**
  *   **Read:** **Soares & Fallenstein, "Agents Over Cartesian World Models"** (for the idealized view) vs. **Shah, "Alignment is not about Goals"** or **Christian, "The Alignment Problem"** (chapters on learned objectives). Look at **Coherence Arguments** (Omohundro) and critiques by **Gustafsson**.
  *   **Task:** Map the concept of "Goal" onto "Learned Policy." Can a transformer have a goal? If not, does IC apply to it?
  *   **Philosophical Angle:** Philosophy of Action. What is the unit of agency? Is it the gradient update, the forward pass, or the training run?
  *   **Deliverable:** A taxonomy of "Goal-types" (explicit, implicit, mesa, latent) and which ones Orthogonality applies to.

  **Weeks 10-14: Synthesis & Methodology (Rank 3)**
  *   **Read:** **Williamson, "Vagueness"** (for handling ill-defined concepts) or **Sober, "Reconstructing the Past"** (on parsimony in evolutionary analogies).
  *   **Task:** Decide if your group can produce a formal argument or if you are producing a conceptual clarification.
  *   **Deliverable:** A final research proposal or paper draft that either (A) proposes a modification to the Power-seeking theorems for bounded agents, or (B) argues why the current formalism is category-mistaken.

  ### A Warning on "Payoff"
  The biggest risk for a philosophy pod here is **re-inventing the wheel under a different name.**
  *   If you discuss "instrumental subgoals," you are discussing **Power-seeking**. Use that term.
  *   If you discuss "goal stability," you are discussing **Inner Alignment/Mesa-optimization**. Use that term.
  *   If you discuss "bounded rationality," look at **Goodhart's Law** literature.

  The "payoff" comes from translating the ML safety formalisms into rigorous philosophical claims, not from ignoring the ML formalisms. The field has moved past pure intuition pumps. Your suspicion that the "goal-based framing" is weak is the exact entry point the literature is currently fighting over. Lean into that.
