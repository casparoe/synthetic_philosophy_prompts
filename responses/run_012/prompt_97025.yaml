answer: |-
  **UNIVERSITY EXAMINATION PAPER**
  **Module:** PHI3042 — Blame, Guilt and the Novel
  **Time Allowed:** One Hour
  **Instructions:** Answer the following question. Write clearly and legibly.

  ***

  **Question 1**

  Consider the following case:
  *Arthur is a novelist who has become convinced by hard determinism. Believing that no one is ultimately responsible for their actions, he deliberately adopts what P.F. Strawson calls the 'objective attitude' towards everyone he meets, including himself. He treats people as objects to be managed or cured rather than participants in reciprocal relationships. However, when his closest friend betrays a confidence, Arthur is suddenly flooded with intense resentment.*

  *Drawing on Strawson's 'Freedom and Resentment' (1962), analyse this scene. Does Strawson's account treat Arthur's resentment as a **vindication** of the participant attitude, or merely as a psychological fact that might have been otherwise? In your answer, explain why Strawson permits particular facts (such as delusion or childhood) to dissolve reactive attitudes while insisting the general fact of determinism cannot. What does this asymmetry imply about the sense in which we are 'responsible'?*

  ***

  **MODEL ANSWER**

  Strawson's central thesis is that our practices of blame and responsibility are not grounded in metaphysical facts about free will, but in the 'reactive attitudes'—resentment, gratitude, indignation—which are constitutive of adult human relationships. The case of Arthur tests the limits of this naturalism.

  For Strawson, Arthur's resentment is not merely a psychological slip; it is a vindication of the participant stance. Strawson argues that the commitment to reactive attitudes is not a rational choice we can opt in or out of at will. It is a natural fact of human life. While we can locally suspend these attitudes (e.g., towards a child or the mentally ill), a global adoption of the objective attitude is psychologically impossible for a mature agent embedded in society. Arthur's failure to maintain his programme demonstrates that the participant attitude is not a theory one holds, but a form of life one inhabits. Therefore, the resentment is normative within that form of life; it is the appropriate response to a quality of will that displays ill-will, regardless of metaphysical determinism.

  The crucial difficulty lies in the asymmetry between particular and general facts. Strawson allows particular facts (exempting conditions) to dissolve resentment because they indicate the agent is not a full participant in the moral community (e.g., they lack rational capacity). These facts change the *nature* of the relationship. However, the general fact of determinism applies to everyone equally. If determinism exempted us all, there would be no relationships left to sustain. Strawson argues that since we cannot universally abandon reactive attitudes without ceasing to be human as we know it, the general fact of causation is irrelevant to responsibility. The asymmetry holds because particular exemptions are internal to the practice (identifying non-participants), whereas determinism is an external threat that the practice simply ignores because it cannot be lived.

  This implies that responsibility is not a metaphysical property surviving causation, but a social reality sustained by our emotional commitments. We are responsible because we are liable to these attitudes. Arthur is responsible not because he could have done otherwise in a cosmic sense, but because he is a suitable target of resentment within the human community. To ask if this responsibility is 'real' outside of these attitudes is to ask a question that Strawson renders unintelligible. The fit of the resentment is determined by the quality of will shown, not by the causal history of the agent. Thus, Arthur's resentment confirms that responsibility is immune to determinism precisely because it is rooted in the inescapable demands of interpersonal engagement, not in libertarian freedom.

  ***

  **MARKING SCHEME**

  **Total Marks: 20**

  **1. The Asymmetry Argument (4 marks)**
  *   **Requirement:** Must explain why particular facts (madness/childhood) exempt agents while the general fact (determinism) does not. Must identify that particular facts alter the *relationship*, whereas determinism is a universal backdrop that cannot dissolve the framework of relationships itself.
  *   **Typical Fluff:** Students claim determinism is 'false' or argue that particular facts prove free will exists sometimes.

  **2. Excusing vs. Exempting Conditions (4 marks)**
  *   **Requirement:** Must distinguish between *excusing* (I didn't do it / didn't mean it) and *exempting* (I am not a responsible agent). Arthur's case relies on exempting conditions; the student must note that Arthur tries to exempt everyone globally, which Strawson rejects.
  *   **Typical Fluff:** Students treat all exemptions as the same, confusing 'he didn't mean to' with 'he isn't capable of meaning'.

  **3. The Impossibility of Global Objectivity (4 marks)**
  *   **Requirement:** Must argue that Strawson views the objective attitude as a temporary modification, not a permanent alternative. Arthur's 'programme' is unintelligible because reactive attitudes are natural, not voluntary beliefs.
  *   **Typical Fluff:** Students suggest Arthur could succeed if he were 'rational enough', missing Strawson's point that this is about human nature, not intellect.

  **4. Normativity vs. Psychology (4 marks)**
  *   **Requirement:** Must address whether resentment is merely a feeling or a vindication. Top answers argue it is normative *within* the practice; it is 'fitting' because the betrayal showed ill-will, not just because Arthur couldn't help feeling it.
  *   **Typical Fluff:** Students reduce Strawson to a psychological description ('we just feel anger') without seeing the moral justification embedded in the feeling.

  **5. Conception of Responsibility (4 marks)**
  *   **Requirement:** Must conclude that responsibility is social/interpersonal, not metaphysical. The answer should state that responsibility survives determinism because it is defined by liability to reactive attitudes, not by causal origination.
  *   **Typical Fluff:** Students conclude that Strawson 'solves' free will by proving we have it, rather than changing the definition of responsibility to bypass the need for it.

  ***

  **Examiner's Note:** I have kept the spelling consistent with Oxford conventions where appropriate, but ensured 'programme', 'analyse', and 'defence' adhere to standard British usage. The marking scheme is designed to penalise the 'revision site' recitation you complained of last year by demanding specific distinctions (excusing/exempting) that generic summaries often blur. Good luck with the marking; I hope the scripts are less uniform this time.
