  11. **Final Polish:** Check for clarity and conciseness. Ensure the distinction between "Non-negotiable" (conditions for the *concept* to work) and "Preference" (conditions for a specific *metaphysical stance*) is clear. (e.g., Whether verbal disputes are worthless is a preference, not a requirement for the definition).

  *(Self-Correction on the "Single Narrowing Requirement"):* I initially thought about Fact Agreement. But actually, the requirement that determines the *extension* most sharply is the **Criterion of Meaning Difference**. Is it determined by intension, extension, use, or reference? This dictates whether Case (i) is verbal. I will stick with the "Fact-Agreement implies Verbal" requirement as the narrowing one because it's the operational test students actually use.

