answer: |-
  Here is a specification of desiderata for an account of verbal disputes, structured as a checklist for evaluating candidate theories.

  ### I. The Desiderata Checklist

  **1. The Non-Substantive Fact Condition**
  *   **Specification:** The account must classify a dispute as verbal if the parties agree on all relevant non-linguistic facts (including functional, neural, and physical facts) and disagree only on the application of a term.
  *   **Motivation:** Case (i). If researchers agree on every prediction and neural state but disagree only on the threshold for "belief," calling this substantive renders the word "substantive" vacuous.
  *   **Status:** **Non-negotiable.** (Without this, the distinction collapses).

  **2. The Covert Ambiguity Test**
  *   **Specification:** The account must be able to retrospectively identify a dispute as verbal even if the parties believed they were using the term univocally, provided their inferential patterns diverge systematically.
  *   **Motivation:** Case (ii). A theory that requires conscious awareness of ambiguity fails to diagnose cases where parties are genuinely confused about their own usage.
  *   **Status:** **Non-negotiable.**

  **3. The Stability Requirement**
  *   **Specification:** The account must specify a minimum threshold of semantic stability required to diagnose a dispute. If usage shifts too rapidly, the account must classify the interaction as "confusion" or "equivocation" rather than a "verbal dispute."
  *   **Motivation:** Case (iii). A verbal dispute presupposes two coherent positions talking past one another. If usage slides mid-argument, there are not two positions to compare.
  *   **Status:** **Non-negotiable.** (Though the *threshold* is a parameter).

  **4. The Carving Constraint**
  *   **Specification:** The account must determine whether a dispute remains verbal if one party's idiosyncratic usage tracks objective natural kinds or causal structures better than the other's ordinary usage.
  *   **Motivation:** Case (iv). Does better ontology make a dispute substantive even if the disagreement stems from linguistic convention?
  *   **Status:** **Preference.** (Substantivists demand "yes"; Deflaters demand "no").

  **5. The Regress Stopper**
  *   **Specification:** The account must be able to classify the dispute *about* whether a dispute is verbal without generating an infinite regress. It must specify whether the question "Is this dispute verbal?" is itself susceptible to being verbal.
  *   **Motivation:** Case (v). If the second-order dispute is also verbal, we need a foundation that isn't. If it isn't, the account must explain why.
  *   **Status:** **Non-negotiable.** (An account that generates a regress is logically defective).

  **6. The Pragmatic Upshot**
  *   **Specification:** The account must specify what normative force the diagnosis carries. Does classifying a dispute as verbal license dismissal, mandate stipulation, or merely suggest clarification?
  *   **Motivation:** Case (vi). Philosophers need to know whether to stop arguing or start defining.
  *   **Status:** **Preference.** (Dismissivists say "stop"; Reformers say "clarify and continue").

  ---

  ### II. Incompatibilities and Trade-offs

  No account satisfies all desiderata without tension. The following incompatibilities reveal the structural limits of the concept.

  **1. The Neutrality vs. Precision Trade-off**
  *   **Conflict:** You cannot satisfy **Desideratum 1 (Non-Substantive Fact)** and **Desideratum 4 (Carving)** simultaneously without adopting a controversial theory of meaning.
  *   **Explanation:** If "belief" is defined by functional role (use), Case (i) is verbal. If "belief" is defined by reference to a natural kind (carving), Case (i) might be substantive (one side is wrong about the kind). To satisfy both, you need a theory that privileges one notion of meaning over the other.
  *   **What this shows:** The concept of "verbal dispute" is not metaphysically neutral. It smuggles in a semantics.

  **2. The Access vs. Accuracy Trade-off**
  *   **Conflict:** You cannot fully satisfy **Desideratum 2 (Covert Ambiguity)** and the constraint of **Mid-Argument Usability**.
  *   **Explanation:** To detect covert ambiguity (Case ii), you often need to see the divergence in predictions over time. Mid-argument, you lack the data to distinguish a verbal dispute from a substantive one where one party is simply mistaken about the facts.
  *   **What this shows:** A diagnostic tool for *historical analysis* cannot be a decision procedure for *live debate*.

  **3. The Normativity Trade-off**
  *   **Conflict:** **Desideratum 1 (Non-Substantive Fact)** conflicts with **Desideratum 6 (Pragmatic Upshot)** if one holds that verbal disputes can be philosophically fruitful.
  *   **Explanation:** If a dispute is "merely" verbal (per Desid. 1), the natural upshot is dismissal. But if the negotiation of terms *is* the philosophical work (e.g., conceptual engineering), dismissing it undermines the value of the activity.
  *   **What this shows:** "Verbal" is often used as a slur. An adequate account must decouple the *diagnosis* (semantic mismatch) from the *dismissal* (lack of value).

  ---

  ### III. The Single Most Narrowing Requirement

  If you insist on only one requirement to narrow the field of candidate accounts, it is **Desideratum 1: The Non-Substantive Fact Condition.**

  *   **Why:** This is the fault line between **Deflationism** (e.g., Hirsch, Chalmers) and **Substantivism** (e.g., Sider, Van Inwagen).
  *   **The Filter:**
      *   If an account says "Agreement on all underlying facts *entails* the dispute is verbal," it rules out substantive metametaphysics.
      *   If an account says "Agreement on underlying facts is *compatible* with substantive disagreement" (e.g., because they disagree on the *structure of reality* itself), it rules out standard linguistic deflationism.
  *   **Impact:** This requirement forces you to decide whether metaphysics is about the world or about the best way to talk about the world.

  ---

  ### IV. Evaluation of Your Constraints

  You proposed four constraints on the account itself. Here is their status:

  **1. Semantics Neutrality (Truth-conditional vs. Use-based)**
  *   **Verdict:** **Overreach.**
  *   **Reason:** You cannot define "verbal dispute" without a criterion for "sameness of meaning." Use-based semantics will classify Case (i) as verbal (different use); Truth-conditional semantics might classify it as substantive (different truth conditions regarding the threshold). An account *must* pick a lane to be precise.

  **2. Usability by Third Party & Mid-Argument**
  *   **Verdict:** **Mixed (Third-Party: Genuine; Mid-Argument: Overreach).**
  *   **Reason:** A third-party diagnosis is essential for objectivity. However, requiring *mid-argument* usability is too strong. As noted in the Incompatibilities section, distinguishing verbal from substantive often requires seeing the full inferential fallout (Case ii), which isn't available in the first ten minutes (Case vi).

  **3. Non-Triviality (Don't classify everything as verbal)**
  *   **Verdict:** **Genuine Requirement.**
  *   **Reason:** If vague predicates automatically trigger a verbal diagnosis, the concept loses its critical bite. The account must explain why some vagueness is substantive (e.g., sorites boundaries in law) and some is verbal.

  **4. Normativity (All-or-nothing & Upshot)**
  *   **Verdict:** **Genuine Requirement.**
  *   **Reason:** A purely descriptive account is philosophically inert. The point of identifying a verbal dispute is to guide action (stipulate, dissolve, or refine). However, the "All-or-nothing" clause is a **Preference**. A gradient account (degrees of verbalness) may be more accurate than a binary one.

  ---

  ### V. Brief Note on Leading Accounts

  *   **Carnap/Quine:** Satisfy **Non-Substantive Fact** easily but fail **Carving** (they view ontology as linguistic choice). They struggle with **Regress** if the choice of framework is itself verbal.
  *   **Chalmers:** Strong on **Covert Ambiguity** and **Non-Substantive Fact** (via epistemic intensions). Struggles with **Mid-Argument Usability** (requires constructing scenarios).
  *   **Hirsch:** Strong on **Charity** (interpreting opponents to make disputes verbal). Risks violating **Non-Triviality** (makes too many disputes verbal).
  *   **Sider:** Rejects **Non-Substantive Fact** for metaphysics (structure is substantive even if language varies). Satisfies **Carving** but fails the Deflationist intuition.

  **Recommendation for your paper:** Focus your verdict on how your chosen account handles **Case (iv)** and **Case (v)**. These are the stress tests that break the standard "agreement on facts = verbal" model.
