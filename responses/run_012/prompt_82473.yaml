prompt: |-
  I'm a third-year student in a metaphysics seminar, and I'm writing a paper on whether the disputes we've been having all term — over whether a certain mental state counts as a belief, over whether a machine could be conscious, over whether composition ever occurs — are genuinely substantive or merely verbal. Before I commit to a verdict on any of them, I want to be clear about what I'm asking for, so please write me the desiderata: a specification of what any adequate account of verbal disputes would have to deliver. I want a checklist I can hold candidate accounts to, not a survey. For each requirement, give the case or consideration that motivates it, and mark whether it is non-negotiable or really a preference of one camp. Where you think some subset of the requirements cannot be satisfied together, say so explicitly and explain what the incompatibility shows — that is the part I most want from you. And tell me which single requirement, if I insisted on it, would do the most to narrow the field. A short note on how the leading families of accounts fare against the list is welcome, but keep it brief; the list is the deliverable.

  To keep this concrete, I'd like the requirements tested against a set of cases, some of which I've built myself and some of which I've adapted from seminar discussion. (i) Two researchers argue for a decade about whether a certain state is a belief; they agree on every behavioural and neural prediction and differ only in where they place a threshold on a functional-role continuum. (ii) Two parties use what sounds like the same word in the same way, and their predictions come apart — yet a third party eventually shows that each was covertly using the term in a different sense. (iii) Two disputants each slide between two senses of the term at different points in the argument, so neither has a single consistent usage. (iv) One party's usage is idiosyncratic, but it carves a distinction that turns out to track something in the world better than the ordinary usage does. (v) The disputants agree on all the first-order facts and agree that their disagreement is verbal, but disagree about whether verbal disputes are worth having; I want to know whether that second-order disagreement is itself verbal, and whether the account can stop the regress. (vi) The disputants have ten minutes and must decide whether to keep arguing or to stipulate definitions and get on with the work.

  Finally, some constraints I'd like the account to respect, and for each I'd like you to say whether it is a genuine requirement or an overreach. The account should not presuppose a controversial theory of meaning, so it should be stateable without deciding between a truth-conditional and a use-based semantics. It should be usable by a third party with no access to the disputants' intentions, and by the disputants themselves mid-argument. It should not classify so many disputes as verbal that the diagnosis loses its point — an argument over a vague predicate, for instance, should not automatically come out verbal. And it should have something to say about whether verbalness is an all-or-nothing verdict and what follows from it: whether a verbal dispute can still be worth having, and whether the diagnosis licenses dismissing the dispute, resolving it by stipulation, or nothing at all.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for an account of verbal disputes:

  1.  **Analyze the Request:**
      *   **User:** Third-year metaphysics student writing a paper on substantive vs. verbal disputes.
      *   **Task:** Write a set of *desiderata* (requirements/checklist) for an adequate account of verbal disputes.
      *   **Constraints:**
          *   Do *not* provide a survey of accounts (keep brief at the end).
          *   Do *not* commit to a verdict on the specific disputes mentioned (belief, machine consciousness, composition).
          *   For each requirement: Provide the motivating case/consideration.
          *   Mark each requirement as "Non-negotiable" or "Preference of one camp."
          *   **Crucial:** Identify incompatibilities between requirements (trade-offs) and explain what they show.
          *   **Crucial:** Identify the *single most narrowing requirement*.
          *   **Test Cases:** The desiderata must be applicable to the six specific cases provided (i-vi).
          *   **Meta-Constraints:** Evaluate the user's proposed constraints (semantics neutrality, third-party usability, non-triviality, normativity) as "Genuine Requirement" or "Overreach."
          *   **Tone:** Academic, precise, helpful for a seminar paper.

  2.  **Deconstruct the Test Cases:**
      *   (i) *Threshold/Continuum:* Agreement on facts, disagreement on classification (Belief). Classic Chalmers-style verbal dispute.
      *   (ii) *Covert Ambiguity:* Same word, different sense, different predictions. Revealed later. (Classic ambiguity).
      *   (iii) *Equivocation:* Sliding senses within the argument. (Fallacious verbal).
      *   (iv) *Idiosyncratic but Carving:* Unusual usage but better tracks reality. (Carneades/Carving nature).
      *   (v) *Second-Order:* Agree it's verbal, disagree on value. Regress worry.
      *   (vi) *Pragmatic/Time:* Decision to stipulate vs. argue. (Pragmatic dimension).

  3.  **Deconstruct the User's Meta-Constraints:**
      *   Semantics Neutrality (Truth-conditional vs. Use-based).
      *   Usability (Third-party & Mid-argument).
      *   Non-Triviality (Don't call everything verbal).
      *   Normativity (All-or-nothing? What follows?).

  4.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Fact-Agreement Condition.* If they agree on all underlying facts, is it verbal?
          *   Motivation: Case (i).
          *   Status: Non-negotiable for most, but some (Hirsch?) might say substantive metaphysics can exist despite fact agreement. Let's call it Non-negotiable for a *diagnostic* account, but note the Quinean challenge.
      *   *Requirement 2: The Ambiguity Detection Condition.* Must distinguish covert ambiguity from substantive disagreement.
          *   Motivation: Case (ii).
          *   Status: Non-negotiable.
      *   *Requirement 3: The Stability Condition.* Usage must be stable enough to diagnose.
          *   Motivation: Case (iii). If they slide, is it a dispute or a mess?
          *   Status: Non-negotiable for diagnosis, but hard to satisfy mid-argument.
      *   *Requirement 4: The Carving Condition.* Does better ontology make it substantive even if usage is weird?
          *   Motivation: Case (iv).
          *   Status: Preference (Carvers vs. Deflaters).
      *   *Requirement 5: The Regress Stopper.* Can we diagnose the status of the "is this verbal?" dispute?
          *   Motivation: Case (v).
          *   Status: Non-negotiable for a complete theory.
      *   *Requirement 6: The Pragmatic Upshot.* What do we *do* once diagnosed?
          *   Motivation: Case (vi).
          *   Status: Preference (Dismissivists vs. Reformers).

  5.  **Identifying Incompatibilities (The "Meat" of the answer):**
      *   *Tension 1: Semantics Neutrality vs. Diagnostic Precision.* If you don't commit to a semantics, how do you define "meaning difference"?
      *   *Tension 2: Third-Party Access vs. Intentionalism.* You can't know intentions from the outside easily (Case ii).
      *   *Tension 3: Non-Triviality vs. Fact-Agreement.* If fact agreement = verbal, then much of metaphysics (composition) becomes verbal. Some want this (deflaters), some don't (substantivists).
      *   *Key Incompatibility:* **Extensional Adequacy vs. Metaphysical Neutrality.** You can't satisfy the intuition that Case (i) is verbal *and* the intuition that Case (iv) is substantive *without* making a controversial claim about what determines meaning (usage vs. reference).

  6.  **Selecting the "Single Most Narrowing Requirement":**
      *   Is it the "Fact Agreement" one? Yes. If an account says "Agreement on all non-verbal facts implies verbal dispute," it rules out substantive metametaphysics. If it says "No," it rules out standard deflationism. This is the Chalmers/Hirsch/Sider fault line.

  7.  **Evaluating User's Constraints:**
      *   *Semantics Neutrality:* Overreach. You need *some* theory of meaning to define "verbal."
      *   *Third-Party/Mid-argument:* Overreach (specifically mid-argument). Intentions are hidden.
      *   *Non-Triviality:* Genuine Requirement. Otherwise the term is useless.
      *   *Normativity/Upshot:* Genuine Requirement. Philosophy is practical.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the task and the sophistication of the prompt.
      *   **Section 1: The Desiderata Checklist.** (Numbered, with Motivation, Status, Case Reference).
      *   **Section 2: Incompatibilities & Trade-offs.** (The core philosophical insight).
