prompt: |-
  A friend of mine from my old job (we where both backend engineers on the same payments team before he bailed for civic tech) has spent two years building a voting method in his spare time and now wants to crowdfund it, and he's asked me to help write the campaign copy. I said I'd run it past someone first, because his whole pitch is "every ranked method out there fails at least one of the conditions in Arrow's impossibility theorem and ours doesnt," and while I can't name those conditions without googling, something about the claim smells off to me — plus he keeps saying "our simulator shows it's basically strategy-proof," which, as someone who has written simulation code, makes me nervous. I never took a poli sci or philosophy class past the intro level, so here's what I want: act as a social choice theorist who also writes very dry comedy, think this through carefully, and if it helps, brainstorm a few candidate jokes first and check the formal premise of each one before you commit, because the humor has to be load-bearing here. Don't be generically wacky. Every joke should only work if the formal claim inside it is correct — or is wrong in exactly the way his pitch gets it wrong — so that an actual game theorist laughs instead of wincing. Please don't cite papers or authors, I can't check them and he'll just use them as ammo; if you need to name rival methods, stick to the ones everyone already knows (instant-runoff, approval, STAR, ranked pairs, Schulze, that family).

  Deliverable: the Kickstarter page for "Lattice Vote," deadpan from top to bottom, 700-900 words — headline, a "the problem" section, the method spec, a comparison table, a beta-tester quote from a fictional small-town clerk, reward tiers, and a "risks and challenges" section. Voice: breathless but sincere founder copy, no winking, no asides like "of course we all know it's impossible." The thing being satirized is the whole genre of voting-method advocacy: the announcement that someone has finally cracked an impossibility theorem, the habit of redefining a criterion until your own method passes it, and the slide from "our sim says so" to "it's strategy-proof." Somewhere in the comparison table, include at least one criterion the founders invented and score themselves 10/10 on, and make the definition obviously circular. Then, after the page, add a short section headed "notes for me" — 3 to 5 bullets, plain English, not satirical, under 300 words — telling me which condition in his spec quietly breaks, where his wording hides it, and whether his escape from the theorem is a real escape or just a restricted domain wearing a suit.

  Here's his spec, copied out of the design doc (quoted bits are his wording, not mine):

  - Every voter submits a complete ranking of all candidates, plus marks up to two candidates as "acceptable."
  - A ballot is discarded if the "coherence checker" flags it. The flag fires when a voter ranks someone first but doesn't mark that person acceptable, which the doc calls a protest vote that "isn't a real preference."
  - If a Condorcet winner exists, elect them. If not, keep only the Smith set and repeatedly eliminate whoever has the fewest approvals, tie-breaking by fewest first-place votes, then by "the founding document" — a fixed ranking of the candidates that the CEO wrote before launch, which the doc calls "our judicial branch; it only fires on exact ties, under 0.3% of sims."
  - The criteria claims: unrestricted domain (parenthetically, "any coherent ranking is allowed"), Pareto, independence of irrelevant alternatives ("we never let an irrelevant candidate affect the outcome"), and non-dictatorship ("no single voter ever decides an election").

  I don't need you to fix the method, just give me the page and then the notes, so I know what I'm actually helping him sell.
