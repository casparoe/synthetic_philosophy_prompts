  4.  **Ranking by Damage:**
      *   *High Damage:* The Grief Attack (makes user look cruel), The Transformation Argument (hard to refute functionally), The Nurse's Witness (hard to refute experientially).
      *   *Medium Damage:* The "Why write about it?" (consistency check), The Chaplain's Pragmatism (shifts goalposts).
      *   *Low Damage:* Pure Neuroscience (user can defer to neurologist), Specific Ayer details (user is expert here).

  5.  **Drafting the Replies (Strategy):**
      *   *Tone:* Humble, appreciative of the *experience*, firm on the *ontology*. Distinguish between "Real as an experience" and "Real as a place."
      *   *The Ayer Hook:* Use Ayer's own retraction. He didn't deny the *feeling*, he denied the *fact*.
      *   *The Novelist Angle:* "I write fiction. I deal in truths that aren't facts."

  6.  **Refining the "Dreaded Question":**
      *   It needs to be personal. Not abstract. "My mother..."
      *   The concession: Validate the *meaning*, not the *mechanism*.

  7.  **Developing the Prep Sheet (Iterative Process):**
      *   *Objection 1 (The Nurse):* Focus on "Terminal Lucidity." Reply: Distinguish behavior from ontology.
