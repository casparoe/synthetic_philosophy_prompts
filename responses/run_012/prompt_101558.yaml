      *   **Constraint:** "Before you write anything, think it through and brainstorm who's actually sitting there." (I need to show this thinking process or at least embody it in the output).

  2.  **Deconstruct the Audience & Dynamics:**
      *   *Hospice Nurses/Palliative Care (50%):* They deal with death daily. They see "moments of clarity," "terminal lucidity," or peaceful transitions that defy medical explanation. They value *meaning* over *mechanism*. They will feel dismissed if told it's "just chemistry."
      *   *NDE Experiencers/Believers (25%):* Personal stake. The experience changed their lives. Telling them it's "hypoxia" feels like telling them their transformation is a lie. Emotional investment is high.
      *   *ICU Neurologist (1 person but high authority):* Will back the user scientifically but might be too blunt. Could ally or undermine depending on tone.
      *   *Retired Chaplain (1 person):* Represents spiritual tradition but also pastoral care. Might dislike both rigid materialism *and* New Age fluff. Sees the "fools" in everyone.
      *   *The User's Position:* Ayer's specific case is unique because Ayer *walked it back*. The user is arguing that the *content* of the vision reveals its origin (Cambridge don semantics).
      *   *The Risk:* Coming across as arrogant, dismissive of grief, or reducing profound human experiences to "glitches."

  3.  **Brainstorming Objections (The "Who" and "What"):**
      *   *Nurse:* "I've seen them light up right before the end. You weren't there." (Experiential authority vs. Theory)
