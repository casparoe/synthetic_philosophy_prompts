      *   **Defense 2: The "Dictionary" Analogy is Key.** Lexical priority doesn't mean *no* math; it means *ordered* math. First, minimize extreme suffering. Second, maximize net utility. It's a lexicographical ordering (like sorting words: first letter, then second letter).
