answer: |-
  You have hit on one of the most famous and contentious objections to Lexical Threshold Negative Utilitarianism (LTNU). Your intuition is sharp: **you are identifying the tension between *aggregation* (utilitarianism) and *lexical priority* (deontology-like constraints).**

  To answer your question directly: Proponents of this view do not think they are lying, nor do they think the view is incoherent. However, they *do* have to abandon the idea of a simple, linear "common currency" (like a single number line of utility) in favor of a more complex mathematical structure.

  Here is how defenders of the view "get out of" the charge of incommensurability, and where your skepticism is actually supported by other philosophers.

  ### 1. The Mathematical Defense: Non-Archimedean Value
  Your objection relies on the **Archimedean property**. In standard math (and standard utilitarianism), for any two values $A$ and $B$, there is some number of $B$s that will outweigh $A$. (e.g., enough tickles can outweigh one torture session).

  LTNU proponents explicitly **reject the Archimedean property**. They argue that value space isn't a single straight line (the real numbers); it is more like a multi-dimensional vector or a system of **hyper-real numbers**.

  *   **The Vector Analogy:** Imagine utility isn't a single number ($U$), but a coordinate $(S, P)$, where $S$ is severe suffering and $P$ is net pleasure/mild pain.
  *   **The Rule:** When comparing two outcomes, you look at $S$ first. If Outcome A has less $S$ than Outcome B, A is better, *regardless* of $P$. You only look at $P$ if $S$ is identical.
  *   **Is this incommensurable?** No. You can still rank every possible outcome from best to worst. There is a clear "greater than" relation. It's just not a *linear* relation.

  So, to answer your worry: They argue that "common currency" doesn't have to mean "one single sliding scale." It can mean "a consistent set of rules for ranking outcomes." As long as you can always say which of two options is morally better, the system is coherent, even if it's lexical.

  ### 2. The Phenomenological Defense: Qualitative Differences
  Some proponents argue that your assumption—that mild pain and extreme pain are just "more or less of the same thing"—is empirically false.

  *   **The Argument:** A headache and being burned alive might both be "pain," but they are phenomenologically distinct categories. One disrupts your agency temporarily; the other destroys your capacity to experience value entirely.
  *   **The Implication:** If extreme suffering is *qualitatively* different (a different "kind" of bad) rather than *quantitatively* different (just "more" bad), then it makes sense to treat them with different moral mathematics.
  *   **The Rebuttal to You:** They would say you aren't seeing incommensurability; you are seeing **categorization**. Just as "health" lexically outweighs "comfort" in triage (you save the dying before you comfort the worried), severe suffering lexically outweighs pleasure.

  ### 3. The "Two-Stage" Utilitarianism
  To avoid the claim that this isn't utilitarianism, proponents often frame this as a **two-stage aggregation**:

  1.  **Stage 1 (Constraint):** Eliminate all suffering above the threshold. This is a hard constraint (like a side-constraint in deontology).
  2.  **Stage 2 (Maximization):** Once the constraint is met, maximize net well-being (pleasure minus mild pain) using standard utilitarian calculus.

  They argue this is still utilitarian because the *goal* is still to produce the best overall state of affairs, but they have recognized that the "value function" of consciousness is discontinuous. They aren't saying "math is a lie"; they are saying "the graph of moral value has an asymptote."

  ### 4. Where You Are Right (The Criticisms)
  Despite those defenses, many philosophers agree with you. Here is why your "wall" might be a legitimate dead end:

  **A. The "Arbitrary Threshold" Problem**
  If there is a threshold, where is it? Is it at 50/100 on the pain scale? 51/100? If moral reality changes drastically between a 50 and a 51, that seems metaphysically suspicious. If the threshold is vague, then the lexical priority is vague, which makes decision-making impossible in edge cases.

  **B. The "Collapse" Argument**
  Critics argue that LTNU is unstable.
  *   If you care about the trade-offs below the threshold, why *not* above it?
  *   If 1,000 mild headaches can be traded for 1 day of pleasure, why can't 1,000 days of severe torture be traded for 1,000 years of bliss?
  *   If you say "no," you need a reason other than "because I said so." If the reason is "because the pain is worse," then you are admitting there *is* a common scale of "badness," which brings you back to the Archimedean problem.

  **C. Is it still Utilitarianism?**
  You asked: *"if theyre incommensurable then this isnt really a utilitarianism at all."*
  Strictly speaking, you are correct. Classical Utilitarianism requires a **single maximizing principle**. LTNU is technically a **hybrid view**. It uses utilitarian aggregation for "normal" life but deontological constraints for "extreme" suffering.
  *   **Proponent Response:** They redefine Utilitarianism broadly as "consequentialist aggregation of well-being," allowing for complex value functions.
  *   **Critic Response:** It's a patch job to avoid the counter-intuitive results of Pure Negative Utilitarianism (like blowing up the world to prevent future pain).

  ### Summary: Should you stop worrying about it?
  You shouldn't stop worrying, because you've identified the exact reason why LTNU is controversial.

  *   **If you value mathematical elegance:** LTNU is unsatisfying. It introduces discontinuities that look ad hoc.
  *   **If you value moral intuition:** LTNU is very attractive. It captures the intuition that "torture is never okay for the sake of tickles" without forcing you to accept "destroy the world to prevent a stubbed toe."

  **The Verdict:**
  Proponents escape your objection by claiming that **value is lexicographically ordered, not incommensurable.** They argue you can have a rigorous math of priority without a single linear scale.

  However, if you believe that *any* moral theory must rest on a single, continuous metric of value to be coherent, then LTNU will always look like a "dramatic way of saying suffering always wins." In that case, your intuition is philosophically defensible: you are likely a **Classical Utilitarian** or a **Hard Negative Utilitarian**, and LTNU is indeed trying to have its cake and eat it too.

  It's not "confused" in a way that makes it unusable, but it is "theoretically costly." It buys moral safety at the price of mathematical simplicity. Whether that trade is worth it depends on whether you trust your moral intuitions (torture is worse than tickles) more than your desire for a clean mathematical model.
