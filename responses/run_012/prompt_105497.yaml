      *   **Topic:** Lexical Threshold Negative Utilitarianism (LTNU).
      *   **Core Concept:** Suffering above a certain intensity/duration lexically outweighs any amount of pleasure. Below that threshold, standard trade-offs apply.
      *   **User's Objection:** This seems to imply incommensurability (no single common currency). If there's no single scale, is it really utilitarianism? Or is the "math" just a facade for "suffering always wins"?
