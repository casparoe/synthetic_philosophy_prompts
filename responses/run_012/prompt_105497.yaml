      *   *Negative Utilitarianism (NU)* prioritizes suffering reduction.
      *   *Lexical Thresholds* introduce a discontinuity. $Suffering_{high} > \infty \times Pleasure$.
      *   *The User's Point:* If $A$ and $B$ trade off sometimes but not others, do they share a dimension? If $1$ unit of High Pain > $1$ trillion units of Joy, but $1$ unit of Low Pain < $1$ unit of Joy, is there a function $f(x)$ that maps both to a single number line?
      *   *Mathematical Analogy:* It's like a piecewise function. It *is* a single function, but it has an asymptote or a discontinuity.
      *   *The "Incommensurability" Charge:* True incommensurability means no rational comparison is possible. LTNU proponents argue comparison *is* possible, it's just weighted differently based on intensity.

