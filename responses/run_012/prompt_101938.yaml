answer: |-
  # Decision Tree: Verisimilitude & Truthlikeness

  **Instructions:** Answer the following questions based on your intuitions about the specific cases provided. Follow the branches to find your position.

  ### 1. The Ontology Question
  **Is "truthlikeness" a substantive, definable property that theories possess in degrees, or is the phrase just a pragmatic way of praising theories we currently prefer?**
  *   **No (It's pragmatic):** → **Deflationary / Pragmatic Anti-Realism**
      *   *Awkward Commitment:* We cannot explain why we prefer Newton to Einstein without circularly appealing to our current preferences.
  *   **Yes (It's real):** → Go to Question 2.

  ### 2. The Trade-Off Question (Case b)
  **Consider two false theories of planetary motion: Theory A predicts positions more accurately, but asserts an extra false regularity (e.g., "orbits are perfectly circular") that Theory B does not mention. Can Theory A be closer to the truth than Theory B?**
  *   **No (Falsehoods must not increase):** → **Popperian Verisimilitude**
      *   *Awkward Commitment:* A theory that gets every digit of a constant right except the last is not closer to the truth than a theory that gets every digit wrong.
  *   **Yes (Trade-offs are allowed):** → Go to Question 3.

  ### 3. The Framework Question
  **To measure closeness, do we analyze theories as sets of linguistic statements (sentences/consequences) or as sets of physical possibilities (models/structures)?**
  *   **Models/Structures:** → Go to Question 6 (Scope).
  *   **Statements/Sentences:** → Go to Question 4.

  ### 4. The Content Question
  **Do we measure closeness by counting the true and false logical consequences of the theory, or by measuring the "distance" between the theory and the truth in a space of possibilities?**
  *   **Counting Consequences (Content):** → Go to Question 5.
  *   **Measuring Distance (Likeness):** → Go to Question 5 (Distance Variant).

  ### 5. The Consequence/Distance Variant
  *(Answer based on your branch from Q4)*

  *   **If Content:** **Do we count *all* logical consequences, or only a restricted set of "relevant" ones?**
      *   **All Consequences:** → **Unoccupied Position (Incoherent)**
          *   *Diagnosis:* Tichý proved this collapses all false theories into having equal verisimilitude.
      *   **Relevant Consequences Only:** → **Relevant Consequence Approach (Schurz & Weingartner)**
          *   *Awkward Commitment:* We must agree on which consequences count as "relevant" before we can measure scientific progress.

  *   **If Likeness:** **(Case a) The true value of a constant is 10. Theory X says "11". Theory Y says "10 or 100". Is Theory Y closer to the truth because it *includes* the truth?**
      *   **Yes (Min-Distance):** → **Min-Distance Likeness (Tichý / Oddie)**
          *   *Awkward Commitment:* A theory that says "The value is 1 or 1,000,000" is just as close to the truth (if 1 is true) as a theory that says "The value is 1".
      *   **No (Avg/Sum-Distance):** → **Average-Distance Likeness (Niiniluoto)**
          *   *Awkward Commitment:* A theory that narrowly misses the truth can be ranked as worse than a theory that is wildly vague but happens to include the truth.

  ### 6. The Structure Question (For Model-Based Views)
  **Do we compare theories by their inclusion relations to the set of all physically possible worlds?**
  *   **Yes:** → **Structuralist / Nomic Truth Approximation (Kuipers)**
      *   *Awkward Commitment:* We must define the set of all physically possible worlds before we can judge actual theories.
  *   **No:** → (Return to Likeness branches above).

  ### 7. The Language Question (Case c)
  **If we redescribe the same pair of theories using a coarser or translated vocabulary (e.g., "hot/cold" vs. "min/max"), should their ranking by truthlikeness stay the same?**
  *   **No (Ranking can flip):** → **Language-Relative Realism**
      *   *Diagnosis:* Unoccupied/Unattractive; most realists reject this because it makes progress dependent on linguistic convention.
  *   **Yes (Ranking is invariant):** → Go to Question 8.

  ### 8. The Scope Question
  **Does your account of truthlikeness apply only to theories with numerical parameters (quantitative), or must it also cover qualitative classifications?**
  *   **Quantitative Only:** → **Restricted Quantitative Realism**
      *   *Awkward Commitment:* Scientific progress in biology or psychology isn't "progress toward truth" in the same sense as physics.
  *   **General (Quantitative & Qualitative):** → **General Verisimilitude Realism** (Your specific label depends on previous branches, e.g., Niiniluoto-style General Realism).
      *   *Awkward Commitment:* Defining "distance" between qualitative concepts (e.g., "raven" vs. "crow") is notoriously difficult without smuggling in quantitative assumptions.

  ***

  ### Summary of Leaves for Handout

  | Position | Core Intuition | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **Deflationary** | Truthlikeness is pragmatic praise, not a property. | We cannot explain theory preference without circularity. |
  | **Popperian** | Closer = More true content, no extra false content. | A nearly-true theory is not "closer" if it has one extra false consequence. |
  | **Relevant Consequence** | Closer = More *relevant* true content, less *relevant* false. | We need a prior theory of "relevance" to measure progress. |
  | **Min-Distance (Tichý/Oddie)** | Closer = Smallest distance to the nearest possible truth. | Vague disjunctions containing the truth are maximally close. |
  | **Avg-Distance (Niiniluoto)** | Closer = Smallest average distance across all possibilities. | Vague theories are penalized even if they include the truth. |
  | **Structuralist (Kuipers)** | Closer = Better fit between theory models and nomic models. | Requires defining the space of all physically possible worlds. |
  | **Restricted Quantitative** | Truthlikeness is only definable for numerical parameters. | Progress in non-mathematical sciences is not truth-directed. |
  | **Language-Relative** | Truthlikeness depends on the conceptual scheme used. | Scientific progress could reverse simply by changing vocabulary. |
  | **Unoccupied (Pure Content)** | Closer = More true content, false content ignored. | **Incoherent:** Proven to trivialize all false theories as equal. |
