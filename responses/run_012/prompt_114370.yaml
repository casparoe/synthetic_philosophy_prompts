          *   *Tension 1:* Symmetry (Both sides can kill) vs. Moral Liability (Only just side kills liable targets).
          *   *Tension 2:* Policing Model (Imminent threat) vs. War Model (Status-based threat).

  4.  **Refining and Polishing:**
