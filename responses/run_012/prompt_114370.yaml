prompt: |-
  I'm opening a seminar on the ethics of killing in war next week and I want to start with the spec, not the fighting. So: what would any adequate theory of who soldiers may kill have to deliver? Give me the requirements, each with the case or consideration behind it -- the cases it has to get right (the conscript who never chose the war vs the volunteer, the soldier on the just side who shoots a surrendering enemy, the child soldier, the drone operator, the cop who shoots a hostage-taker), the distinctions it cant collapse (liability vs excuse, killing vs letting die, jus ad bellum vs jus in bello, and the one that bugs me: what makes a soldier's killing different from murder in the first place), and the features of the practice it can't contradict (both sides are bound by the same rules, war crimes are possible, a soldier can be excused for doing whats forbidden). My co-organizer keeps saying the set of people you're allowed to kill can't depend on which side has the just cause -- tell me whether that's a genuine requirement or just a prejudice of one camp, and whether the theory can treat a combatant as liable only for the threats he personally poses. And flag any pair of requirements you think can't be jointly satisfied; I suspect the symmetric-rules one and the liability-tracks-responsibility one are in tension. Skip the scorecard of who's right, I'll do that in class.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Ethics of killing in war (Just War Theory, specifically *jus in bello*).
      *   **Goal:** Provide the *requirements* for an adequate theory (the "spec"), not the solutions/scorecard.
      *   **Key Elements to Include:**
          *   Cases/Considerations the theory must handle (conscript vs. volunteer, surrendering enemy, child soldier, drone operator, cop vs. hostage-taker).
          *   Distinctions it must maintain (liability vs. excuse, killing vs. letting die, *jus ad bellum* vs. *jus in bello*, killing vs. murder).
          *   Features of practice it can't contradict (symmetry of rules, war crimes exist, excuses possible).
          *   Specific Question: Is the "independence from just cause" requirement genuine or prejudicial?
          *   Specific Question: Can liability track only personal threat?
          *   Specific Task: Flag tensions/incompatibilities between requirements (specifically symmetric rules vs. liability tracking responsibility).
      *   **Constraint:** Skip the "scorecard" (don't argue for Traditionalism vs. Revisionism). Focus on the *criteria for adequacy*.

  2.  **Deconstruct the Requirements:**

      *   *Requirement 1: The Murder Constraint.* Why isn't soldiering just mass murder? The theory needs a principle of permission.
      *   *Requirement 2: The Symmetry Constraint (Independence Thesis).* Do rules apply equally regardless of *jus ad bellum*? (Address the co-organizer's point here).
      *   *Requirement 3: The Liability Constraint.* Who is liable? Does it track moral responsibility or just status? (Conscript vs. Volunteer, Child Soldier).
      *   *Requirement 4: The Conduct Constraint.* How you kill matters (Surrender, Proportionality).
      *   *Requirement 5: The Agency Constraint.* Remote killing (Drones) vs. Direct killing.
      *   *Requirement 6: The Domestic Analogy Constraint.* War vs. Policing (Hostage-taker).
      *   *Requirement 7: The Legal/Moral Interface.* War crimes, excuses, obligations.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the task. We are building the "spec sheet" for the theory, not buying the car.

      *   **Core Deliverables (The "Must-Haves"):**
          *   *Differentiation from Murder:* Needs a justification for why state-sanctioned killing isn't criminal. (The "License" problem).
          *   *The Symmetry Requirement:* Address the co-organizer. Is it a requirement or a prejudice? It's a feature of *International Humanitarian Law (IHL)*, but morally contested. I need to present it as a *practical* requirement vs. a *moral* one.
          *   *Liability vs. Status:* Conscript vs. Volunteer. Does moral culpability matter?
          *   *The Surrender/Out of Combat Constraint:* Once the threat is gone, liability ends.
          *   *The Child Soldier Problem:* Diminished responsibility vs. objective threat.
          *   *The Remote Agency Problem:* Drone operators. Does distance change the ethics?
          *   *The Policing Distinction:* Why can a soldier kill an enemy combatant who is sleeping, but a cop can't shoot a hostage-taker who isn't actively shooting? (Imminent threat vs. status).

      *   **Distinctions to Maintain:**
          *   *Jus ad Bellum vs. Jus in Bello:* The separation of "right to go to war" and "right conduct in war."
          *   *Liability vs. Excuse:* You might be liable to be killed, but not blameworthy (conscript). Or you might kill someone not liable, but be excused (invincible ignorance).
          *   *Killing vs. Letting Die:* Collateral damage vs. direct targeting.

      *   **Features of Practice (The "Reality Check"):**
          *   *Symmetric Obligations:* Both sides follow the same rules (IHL).
          *   *War Crimes:* Some acts are always forbidden.
          *   *Excusability:* Soldiers can be blamed or excused based on epistemic conditions.

      *   **Addressing the Specific Questions:**
          *   *Co-organizer's Point (Independence of Just Cause):* This is the heart of the Traditionalist vs. Revisionist debate. Traditionalists say it's a requirement (for functionality). Revisionists say it's a prejudice (morally, unjust combatants shouldn't have the right to kill). *Verdict:* It's a requirement for *legal/practical* coherence, but potentially a bug for *moral* coherence.
          *   *Liability Tracking Personal Threat:* Can you kill someone just because they are part of a threatening structure, or must they be personally dangerous? (The "Contribution" vs. "Direct Threat" debate).

      *   **The Tension (The "Bug Report"):**
