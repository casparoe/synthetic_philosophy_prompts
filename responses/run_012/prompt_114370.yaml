answer: |-
  Here is a specification sheet for an adequate theory of permissible killing in war. This is not a verdict on which existing theory (Traditionalist, Revisionist, etc.) wins, but a list of the deliverables any contender must produce to be taken seriously.

  ### I. The Core Deliverables (The Cases)

  An adequate theory must provide a principled verdict on these specific scenarios, not just an intuition pump.

  **1. The Conscript vs. The Volunteer**
  *   **The Case:** A conscript forced into an unjust army vs. a volunteer who enthusiastically joins the same army. Both point rifles at you.
  *   **The Requirement:** The theory must explain whether moral liability to be killed tracks *causal threat* or *moral responsibility*. If it tracks responsibility, the conscript is less liable than the volunteer. If it tracks threat, they are equal. The theory must justify why we might be permitted to kill one but not the other, or why we are permitted to kill both despite the moral asymmetry.

  **2. The Surrendering Enemy**
  *   **The Case:** A combatant who was a legitimate target five minutes ago lays down arms and puts hands up.
  *   **The Requirement:** The theory must explain the *temporal limit of liability*. Why does the permission to kill evaporate instantly? It cannot be solely based on past guilt (which hasn't changed). It must be based on current threat status or a normative convention of immunity.

  **3. The Child Soldier**
  *   **The Case:** A 12-year-old with an AK-47 charges your position.
  *   **The Requirement:** The theory must reconcile *objective danger* with *diminished capacity*. If liability requires moral agency, the child may not be liable. If permission to kill requires only the cessation of a threat, the child is targetable. The theory must state whether killing the child is a *justified killing of a liable agent* or a *justified killing of a non-liable threat* (and what the moral cost of the latter is).

  **4. The Drone Operator**
  *   **The Case:** An operator in Nevada kills a combatant in Yemen.
  *   **The Requirement:** The theory must determine if *physical risk reciprocity* matters. Does the soldier's immunity from harm affect their right to inflict harm? Or is the ethics of killing purely about the status of the target?

  **5. The Cop vs. The Hostage-Taker (The Domestic Analogy)**
  *   **The Case:** A police officer faces a hostage-taker. The officer cannot shoot unless the threat is *imminent*. A soldier can shoot an enemy combatant who is sleeping, eating, or posing no immediate threat.
  *   **The Requirement:** The theory must explain the *divergence between policing and war*. Why does the "imminent threat" standard dissolve in war? Is it because the enemy is part of a hostile *organization*, or because the state of war creates a general license?

  ---

  ### II. The Conceptual Distinctions (The Boundaries)

  The theory cannot collapse these distinctions without losing explanatory power.

  **1. Killing vs. Murder**
  *   **The Requirement:** This is the foundational problem. Murder is the wrongful killing of a person. Soldiers kill people. The theory must identify the *normative feature* that transmutes homicide into permissible conduct. Is it consent? Forfeiture of rights? State authority? Necessity? If it cannot distinguish the soldier from the mafioso conceptually, it fails.

  **2. Jus ad Bellum vs. Jus in Bello**
  *   **The Requirement:** The theory must clarify the relationship between the *cause* of the war and the *conduct* in the war. Can a soldier fight skillfully and legally for a genocidal cause? Or does the injustice of the cause contaminate the individual acts of killing?

  **3. Liability vs. Excuse**
  *   **The Requirement:** The theory must distinguish between "I was allowed to kill him" (He was liable) and "I wasn't allowed, but I shouldn't be punished" (I was excused).
      *   *Example:* A soldier kills an enemy who was secretly planning to surrender but hadn't yet. Was the enemy liable? Was the soldier excused due to epistemic limitations? Collapsing these makes accountability impossible.

  **4. Killing vs. Letting Die**
  *   **The Requirement:** The theory must account for collateral damage. Why is it sometimes permissible to *foreseeably cause* civilian death (collateral damage) but not *intentionally target* it? The distinction between doctrine of double effect and consequentialist calculation must be addressed.

  ---

  ### III. The Features of Practice (The Reality Check)

  The theory cannot contradict the structural realities of how war is regulated and understood, unless it explicitly argues for revolutionizing those structures.

  **1. Symmetric Obligations (The Co-Organizer's Point)**
  *   **The Feature:** International Humanitarian Law (IHL) binds both sides equally. A medic on the unjust side has the same protections as a medic on the just side.
  *   **The Requirement:** The theory must either **accommodate** this symmetry (explaining why it is morally necessary for regulation) or **explain away** this symmetry (arguing that IHL is a pragmatic convention that masks moral asymmetry).
  *   **Verdict on your Co-Organizer:** The claim that "allowed targets can't depend on just cause" is **not a moral requirement; it is a legal/pragmatic one.** It is a prejudice of *Traditionalism* (Walzer) but rejected by *Revisionism* (McMahan).
      *   *If you want a theory of International Law:* It is a requirement.
      *   *If you want a theory of Moral Philosophy:* It is likely false. (An unjust aggressor does not morally have the same right to kill as a defender).
      *   *Seminar Tip:* Frame this as the tension between *Regulative Morality* (what rules should we follow to minimize horror) vs. *Deep Morality* (what is actually right/wrong).

  **2. War Crimes are Possible**
  *   **The Feature:** There are things you cannot do, even to liable targets (torture, executing POWs).
  *   **The Requirement:** The theory must explain why liability to be *killed* does not imply liability to be *tortured* or *humiliated*. Rights forfeiture is not total.

  **3. Excusability for Forbidden Acts**
  *   **The Feature:** We sometimes punish, sometimes pardon.
  *   **The Requirement:** The theory must allow for *epistemic fog*. A soldier might kill a non-liable target (e.g., someone they reasonably believed was combatant) and be morally excused, even if the act was objectively wrong.

  ---

  ### IV. Specific Constraints & Tensions

  You asked about two specific theoretical constraints and where they break.

  **1. Can liability track only personal threat?**
  *   **The Question:** Can a soldier be liable to be killed solely because they are a member of a threatening army, even if they are currently in bed (no personal, imminent threat)?
  *   **The Requirement:** If the theory says "Yes" (Status-Based Liability), it aligns with IHL but struggles to explain why we can't kill civilians who fund the war (who also contribute). If the theory says "No" (Threat-Based Liability), it aligns with self-defense ethics but makes most war fighting (shooting sleeping soldiers) impermissible. The theory must pick a lane on *contribution vs. direct threat*.

  **2. The Flagged Tension: Symmetry vs. Responsibility**
  *   **Your Suspicion:** You are correct. There is a fundamental tension between **The Symmetry Requirement** (both sides follow the same rules) and **The Liability-Tracks-Responsibility Requirement** (only those responsible for unjust threats are liable to be killed).
  *   **Why they clash:**
      *   If liability tracks responsibility (Deep Morality), soldiers on the *unjust* side are essentially murderers. They are not liable to be killed in self-defense because they are not posing *unjust* threats (wait, they are). *Correction:* If liability tracks responsibility, soldiers on the *just* side are not liable to be killed by the unjust side. Therefore, the unjust side cannot permissibly kill them.
      *   If the unjust side cannot permissibly kill the just side, but the just side can kill the unjust side, **Symmetry collapses.**
      *   If you enforce **Symmetry** (both sides can kill each other), you must sever the link between **Moral Responsibility** and **Liability**. You have to say the just soldier is liable to be killed even though they did nothing wrong.
  *   **The Incompatibility:** You cannot simultaneously hold that:
      1.  Killing is only permissible against those morally liable (Responsibility).
      2.  Soldiers on both sides have equal permission to kill (Symmetry).
      3.  One side is objectively unjust (Ad Bellum Asymmetry).
      *   *One of these three must go.* Traditionalists drop (1). Revisionists drop (2). Skeptics drop (3).

  ### Summary for the Seminar Opener

  To open your seminar, posit that an adequate theory must solve the **"License Problem"** (why isn't this murder?) without breaking the **"Reciprocity Constraint"** (why do enemies have rights against me?).

  Tell your co-organizer that their requirement (independence from just cause) is the *central fault line* of the field, not a neutral axiom. It is the price of admission for a legal theory, but potentially a bug for a moral one.

  The theory must explain why a soldier is not a cop, why a uniform matters more than a gun, and why we sometimes forgive people for doing what they had no right to do. If it can't map those coordinates, it's just ideology.
