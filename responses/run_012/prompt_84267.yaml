answer: |-
  **JOINT STATEMENT ON THE WRONG KIND OF REASONS PROBLEM**

  **Signatories:** The Restrictionist (Philosopher A) and The Eliminativist (Philosopher B)
  **Date:** October 26, 2023
  **Context:** Reading Group on Fitting-Attitude Accounts of Value

  ### I. Points of Agreement

  We, the undersigned, acknowledge that while we disagree on the metaphysics of reasons, we agree on the following structural claims regarding the "Demon Case" (where a demon threatens harm unless one admires him) and the Fitting-Attitude (FA) analysis of value:

  1.  **Failure of the Naive FA Analysis:** We agree that a naive Fitting-Attitude analysis ("$X$ is good iff it is fitting to favor $X$") fails if "fitting to favor" is understood simply as "there is sufficient reason to favor." The Demon Case demonstrates that one can have sufficient pragmatic reason to favor an object without that object being good.
  2.  **Normative Force:** We agree that the demon's threat exerts genuine normative pressure on the agent. It is not irrational to respond to the threat; the disagreement concerns *what* it is rational to respond to (the attitude itself vs. the bringing-about of the attitude).
  3.  **The WKR Label:** We agree that the phrase "Wrong Kind of Reasons" (WKR) successfully picks out a specific problem for FA analyses. We disagree on whether it names a subset of *reasons for attitudes* (A) or a category error describing *reasons for actions* that mimic reasons for attitudes (B).
  4.  **Extensional Adequacy:** We agree that any successful theory must yield the same verdict in standard cases: the demon is not admirable, and the threat does not make him so.

  ### II. Statement of Divergent Positions

  **The Restrictionist Position (Philosopher A)**
  > "The pragmatic incentives provided by the demon constitute genuine reasons to adopt the attitude of admiration. However, the FA analysis of value must be restricted to a specific subset of these reasons. 'Fittingness' tracks reasons that bear the right relation to the object's properties (the 'right kind'), whereas pragmatic incentives are reasons of the 'wrong kind.' The term 'reason for an attitude' is univocal (or at least generic) enough to cover both, but value is defined only by the right-kind subset."

  **The Eliminativist Position (Philosopher B)**
  > "The pragmatic incentives provided by the demon constitute no reason whatsoever to adopt the attitude of admiration. They are reasons to *want* to admire, or to perform actions likely to *cause* oneself to admire. The impression that they are reasons for admiration arises from equivocating between reasons for attitudes (which must be object-given) and reasons for actions (which can be state-given). The FA analysis requires no restriction on reasons, only a precise definition of 'reason for an attitude' that excludes pragmatic incentives by definition."

  ### III. The Cruxes

  Our disagreement turns on two specific philosophical claims. First, whether the phrase "a reason for an attitude" applies univocally to both object-based considerations (merit) and state-based considerations (rewards/threats). Second, whether "fittingness" is a normative dimension distinct from the balance of reasons that count in favor of an attitude, or whether it is identical to the presence of the right kind of reasons.

  ### IV. Cruxes and Predicted Outcomes

  We agree that the following test cases bear directly on these cruxes. Below we record our conflicting predictions.

  | Crux | Test Case / Argument | Restrictionist (A) Prediction | Eliminativist (B) Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Univocality of "Reason"** | **The Transparent Incentive Case:** An agent is offered a reward to admire a neutral object. The agent is fully aware the reward is the *only* cause of their admiration. Can the agent sincerely say, "I admire this *because* of the reward"? | **Yes.** The agent cites a reason for the attitude. The attitude is rational, though not fitting. The word "reason" functions univocally. | **No.** The agent is speaking loosely. Strictly, they mean, "I am *making myself* admire this because of the reward." The word "reason" equivocates between attitude-reasons and action-reasons. |
  | **2. Fittingness vs. Reasons** | **The No-Object Reason Case:** Consider an attitude toward an object with no valuable properties (no object-given reasons), but strong pragmatic reasons. Is the attitude "unfitting" or is it "not an attitude at all" (in the normative sense)? | **Unfitting.** The attitude exists and is supported by reasons, but it fails the distinct normative standard of fittingness. Fittingness is a filter on reasons. | **Not Supported.** "Fitting" just means "supported by object-given reasons." If there are no object-given reasons, the question of fittingness does not arise; there is simply no reason for the attitude. |

  ### V. The Convergent Case and Verbal Disagreement

  We explicitly considered the variant where the demon offers a reward for admiring someone **independently admirable** (e.g., a saint).

  *   **Agreement on Action:** We agree that in this case, the agent has sufficient justification to admire the saint. We agree that the admiration would be both fitting and prudent.
  *   **Disagreement on Description:**
      *   **A** describes this as having *two* reasons for admiration (one right-kind, one wrong-kind) which converge.
      *   **B** describes this as having *one* reason for admiration (merit) and *one* reason for bringing about the admiration (money).
  *   **Verbal Dispute:** We acknowledge that in the Convergent Case, our disagreement appears merely verbal. Since both the object-given and state-given considerations point toward the same psychological state, the practical advice is identical. Our disagreement here is purely taxonomic: whether the pragmatic consideration is labeled a "wrong-kind reason for admiration" (A) or a "reason for causing admiration" (B). We agree that if this taxonomic difference has no further normative consequences in the convergent case, it is verbal. However, we maintain it is *not* merely verbal in the Divergent (Demon) Case, as it affects how we define the boundaries of value.

  ### VI. Confidence in Attributions

  **Overall Confidence:** High.
  We are confident that this statement accurately captures the structural disagreement described in the prompt and standard literature on the WKR problem.

  **Least Certain Attribution:**
  We are least certain regarding **The Restrictionist's characterization of Fittingness (Crux 2)**.
  *   *Reason for Uncertainty:* Some Restrictionists argue that Fittingness *reduces* to the balance of "Right Kind" reasons, rather than being a distinct normative dimension *over and above* reasons. In drafting Section IV (Row 2), we attributed to the Restrictionist the view that Fittingness is a "distinct normative standard" that filters reasons. It is possible the Restrictionist prefers to say Fittingness *just is* the property of being supported by Right-Kind Reasons, which makes it less distinct from "reasons" and more distinct from "Wrong-Kind Reasons."
  *   *Confidence Level:* 85%. (The other attributions regarding the nature of the incentive and the univocality of reasons are standard interpretations of these positions.)
