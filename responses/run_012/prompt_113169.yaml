  **Case 2: The Struggler**
  They share a laboratory bench. The norm is undisputed: safety logs must be filed immediately after an experiment to ensure traceability. He files late. She confronts him, not merely noting the error but holding it against him: she tells him his delay is irresponsible, refuses to sign off on his data until he explains himself, and treats the lapse as a moral failing rather than a clerical one. She also files late, consistently. Her pattern shows she accepts the rule as binding on herself but lacks the will to meet it; she sets alarms to file, expresses genuine regret when she misses them, and attempts to correct her habit, yet consistently fails due to procrastination and poor self-discipline.

  **How the Views Judge**
  The **Plain View** says she lacks standing in both cases. The condition is simple: you cannot blame another for a fault you yourself possess. Since she commits the same act type (late filing) in both scenarios, she is a hypocrite in both, and her standing is forfeit regardless of her internal attitude.

  The **Fussy View** says she lacks standing in Case 1 but retains it in Case 2. In Case 1, her conduct evidences a rejection of the norm's authority over her (self-exemption); she cannot invoke a rule she treats as optional for herself. In Case 2, her conduct evidences weakness (akrasia), not rejection; she acknowledges the norm's authority but fails to live up to it. Because she still affirms the norm she is invoking, her standing remains intact despite her failure.

  **The Checks**

  **1. Which single feature is doing the work?**
  The feature is the **attitude toward the norm evidenced by her own violation**. In Case 1, the violation signals *rejection* (the rule doesn't bind me). In Case 2, the violation signals *weakness* (the rule binds me, but I failed). Everything else—the act, the blame, the harm, the relationship—is held fixed.

  **2. What happens if I change that one feature back?**
  If you alter Case 2 so her failure looks like exemption (e.g., she stops trying to file and dismisses the rule), the Fussy View flips: she loses standing. If you alter Case 1 so her failure looks like weakness (e.g., she starts trying to comply but fails), the Fussy View flips: she keeps standing. The Plain View does not flip in either scenario; as long as the act remains the same, standing is lost. This confirms the feature is the pivot point for the Fussy View, not a stipulation.

  **3. How does the Plain View defender attack the second case?**
  They argue that action trumps intention. By choosing to delay the log, she prioritizes her immediate desire (to avoid paperwork) over the norm (file immediately). This prioritization *is* a form of self-exemption, regardless of her internal regret or failed alarms. To the Plain View, weakness is just a quieter, less honest form of rejection: she claims to accept the norm, but her conduct proves she values her convenience more. They would say your Case 2 isn't a counterexample, but merely a hypocrite who lies to herself about her own commitments.
