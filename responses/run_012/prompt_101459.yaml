  # Joint Statement of Adversarial Collaboration: The Stand-In Protocol

  **Participants:** Priya (Critic), User & Tom (Optimists)
  **Subject:** The moral limits of markets, anchored in the "Stand-In" app case.

  ### I. Shared Ground & Concessions
  *We agree on the following premises to narrow the field of dispute:*

  1.  **Markets are not morally neutral tools, but neither are they inherently evil.** Both sides accept that markets can enhance human welfare by allocating resources efficiently, but also accept that markets can degrade social norms.
  2.  **Some goods are properly non-market.** We agree that certain things (votes, children, judicial verdicts, nuclear codes) should not be bought or sold, regardless of consent. The dispute is about *where* the line is drawn, not whether a line exists.
  3.  **Repugnance is an unreliable guide, but not a useless one.** The Optimists concede that visceral disgust can sometimes signal genuine normative harm (e.g., slavery), not just status-quo bias. The Critic concedes that disgust can sometimes be mere cultural inertia (e.g., historical objections to interest-bearing loans).
  4.  **Deception is distinct from Commodification.** We agree that if the "Stand-In" app deceives the recipient (Grandma thinks you showed up), that is fraud, and fraud is wrong regardless of market mechanics. The core dispute concerns a *transparent* version of Stand-In where the recipient knows the presence is paid but accepts it.
  5.  **Optimists are not committed to "Everything should be for sale."** We agree that Tom and User do not argue that love, friendship, or citizenship *must* be monetized, only that they *may* be without inherent corruption.
  6.  **Critics are not committed to "Money always corrupts."** We agree that Priya does not argue that buying a loaf of bread corrupts nourishment, or that paying a plumber corrupts the value of a fixed sink. The objection is specific to goods tied to personal identity, relationship, or civic duty.

  ### II. The Precise Disagreement
  *We disagree on the following specific proposition:*

  **Proposition:** *When a social good rooted in personal obligation (e.g., presence at a funeral, care for a parent) is transferred via a market mechanism with full informed consent, is the value of that good preserved?*

  *   **The Optimist Position (User & Tom):** The value of the good is primarily **consequential**. If the recipient receives the benefit (comfort, presence, support) and the provider receives compensation, and all parties consent, the transaction is morally permissible. The "meaning" of the act is determined by the participants' intentions and outcomes, not the mechanism of exchange. If Grandma knows you paid a stand-in and is comforted anyway, the good was delivered.
  *   **The Critic Position (Priya):** The value of the good is primarily **constitutive**. The meaning of the act is embedded in *who* performs it and *why*. Paying for the act changes the nature of the good itself, regardless of consent or outcome. A paid stand-in at a funeral is not "presence"; it is a simulation of presence. The corruption happens to the good itself, rendering the consent of the parties irrelevant to the moral wrong.

  ### III. Verbal Dispute Check
  *We identify one area where we may be talking past each other:*

  **The Definition of "Care" and "Presence."**
  *   **Optimists** tend to define these functionally: Care is the provision of support; Presence is physical attendance.
  *   **Critics** tend to define these relationally: Care is the expression of specific personal commitment; Presence is the sharing of burden by the obligated party.
  *   **Resolution:** We acknowledge that if we are using different definitions, we might agree on the facts but disagree on the label. However, we treat this as substantive, not merely semantic. The question is: *Which definition tracks the moral value we actually care about?* If the relational definition is the correct one, the Optimist's functional substitute fails to deliver the good. If the functional definition is correct, the Critic's objection is mysticism. We will proceed assuming this is a substantive disagreement about moral reality, not just dictionary definitions.

  ### IV. The Cruxes
  *These are the sub-questions where settling the fact or principle would move one side to the other's position. For each, we specify a concrete case, agreed-upon evidence, and pre-registered predictions.*

  **Crux 1: The Conceptual vs. Empirical Objection**
  *   **Question:** Is the harm of commodification internal to the act (conceptual) or dependent on negative side effects (empirical)?
  *   **Concrete Case:** **The "Normalized Stand-In" Scenario.** Imagine a world where Stand-In is culturally normalized. No one feels cheated; recipients know it's happening; stand-ins are respected professionals; no genuine care is displaced (supply remains constant).
  *   **Agreed Evidence:** Intuitive judgment on this hypothetical world.
  *   **Predictions:**
      *   **Priya:** Even in this world, Stand-In is wrong. The good (filial presence) is conceptually incompatible with wage labor, regardless of social acceptance or lack of empirical harm.
      *   **Optimists:** In this world, Stand-In is permissible. If the empirical harms (deception, crowding out) are removed, the objection vanishes.
  *   **Stakes:** If Priya admits she would accept it in this world, her objection is empirical (crowding out/norms), not conceptual. If Optimists admit it's still wrong even then, they concede there are intrinsic limits to markets.

  **Crux 2: The Consent Neutralization Test**
  *   **Question:** Does informed consent of the recipient neutralize the corruption objection?
  *   **Concrete Case:** **The "Transparent Funeral" Case.** You hire a Stand-In for a friend's funeral. The bereaved family is told explicitly: "He couldn't make it, he paid me to be here so someone would represent him." The family accepts this and is comforted.
  *   **Agreed Evidence:** Moral judgment on the transaction's validity.
  *   **Predictions:**
      *   **Priya:** Still wrong. The relationship between the absent friend and the bereaved is commodified. The family's consent validates the transaction for them, but does not fix the corruption of the friend's obligation. Some duties are non-transferable, like voting or serving jail time.
      *   **Optimists:** Permissible. If the bereaved (the "customers" of the funeral ritual) accept the representation, the social function is fulfilled. The obligation is to ensure support is present, not necessarily to provide it personally.
  *   **Stakes:** If Priya concedes consent neutralizes the harm, the debate shifts to regulating disclosure. If Optimists concede consent doesn't matter, they concede some goods are inalienable.

  **Crux 3: The Crowding-Out Empirical Claim**
  *   **Question:** Does introducing payment reduce the overall supply of genuine, non-market provision of the good?
  *   **Concrete Case:** **Blood Donation vs. Paid Plasma.** (Used as a proxy for Care/Presence).
  *   **Agreed Evidence:** Historical data on voluntary blood donation rates after paid plasma markets are introduced in similar demographics.
  *   **Predictions:**
      *   **Priya:** Introducing paid options reduces voluntary donation. It signals that the act is a job, not a gift, crowding out intrinsic motivation. Stand-In will reduce the number of people showing up for free.
      *   **Optimists:** Introducing paid options increases total supply. Some people couldn't show up before; now they can pay someone. Voluntary rates might stay steady or rise due to increased awareness.
  *   **Stakes:** If Priya is wrong empirically (payment increases total care), her practical objection weakens. If Optimists are wrong (payment destroys the norm), their efficiency argument fails.

  ### V. Final Assessment of Load-Bearing Crux
  *We suspect Crux 1 is the root.* If the objection is purely empirical (Crux 3), then better regulation could fix it. If consent matters (Crux 2), transparency could fix it. But if the objection is conceptual (Crux 1), no amount of transparency or empirical benefit fixes the core wrong. Therefore, the disagreement about whether the good is *defined* by its mode of exchange is the engine driving the other two.

  \answer{Conceptual vs. Empirical}
