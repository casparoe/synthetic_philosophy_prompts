  **Note on the Verse and the Problem**

  This poem takes a specific liberty with the metaphysics of the problem: it treats the text of the poem as identical to the ship itself. In the literature, the distinction between the *representation* of the object and the *object* is usually kept strict to avoid category errors. Here, the "discarded words" lying on the ground are both the discarded planks of the ship and the discarded stanzas of the poem. This conflation allows the form to enact the reassembly paradox physically, but it sidesteps the question of whether linguistic identity behaves like material identity.

  Regarding the philosophical consensus: It is settled among those working on the problem that this is a question about criteria of identity over time, specifically distinguishing between *numerical identity* (being the very same object) and *qualitative identity* (being exactly alike). It is also generally agreed that the puzzle arises from conflicting intuitions about persistence: one based on spatiotemporal continuity (the sailing ship) and one based on material constitution (the rebuilt ship).

  What remains genuinely contested is whether the question has a determinate answer. Some argue identity is absolute and one candidate must be the original (perhaps based on causal history); others argue identity is relative to a sortal concept (same *ship* vs. same *collection of planks*); still others argue there is no fact of the matter, and identity is indeterminate in such cases.

  This poem leans on the view that identity is relative to a kind, but it presses the cost of that view. By maintaining the refrain "It is the same ship" while the text evolves to describe "Two on land," the poem suggests that our language of identity ("the same") breaks down when forced to cover both continuity and constitution simultaneously. It does not resolve the tension but insists that the claim of sameness persists even when the ontology splits, forcing the reader to feel the strain of holding both candidates under one name.
