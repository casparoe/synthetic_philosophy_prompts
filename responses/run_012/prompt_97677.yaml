answer: |-
  This is a sharp observation that cuts to the methodological core of welfare economics and social choice theory. You have identified a recurrent rhetorical and conceptual instability regarding Interpersonal Comparisons of Utility (ICU). While the *components* of this debate are rigorously defined in measurement theory and social choice, the specific *argumentative slide* you describe—where epistemic or metric limitations are traded for ontological conclusions, and vice versa—does not have a single canonical name in the literature. It is usually discussed as a confusion within the "status of interpersonal comparisons," but the fallacy itself is rarely isolated as a distinct unit.

  To carve this up, we must distinguish four logical dimensions that are frequently collapsed. I will define them, map their independence, and then locate the practical pivot point for policy.

  ### The Four Dimensions of Comparison

  1.  **Ontological Status (The Fact Claim):**
      *   *Claim:* There is a mind-independent fact of the matter regarding whether Person A is better off than Person B, or by how much.
      *   *Options:* Realism (facts exist) vs. Anti-Realism/Non-Cognitivism (no facts exist, only expressions of preference).
  2.  **Epistemic Access (The Knowledge Claim):**
      *   *Claim:* We can reliably identify, verify, or agree upon these facts.
      *   *Options:* Knowable (we can judge) vs. Skeptical (we cannot verify).
  3.  **Metric Structure (The Measurement Claim):**
      *   *Claim:* The facts, if they exist and are known, possess specific mathematical properties.
      *   *Options:*
          *   *Non-comparable:* No relation between persons.
          *   *Ordinal:* We can rank (A > B), but not measure distance.
          *   *Interval:* We can measure distance (A is 5 units better than B), but no natural zero.
          *   *Ratio:* We can measure distance and has a natural zero (A is twice as well off as B).
  4.  **Normative License (The Aggregation Claim):**
      *   *Claim:* We are morally or politically permitted to sum or trade off these metrics to determine policy.
      *   *Options:* Aggregativism (summing is permissible) vs. Deontology/Rights (summing is prohibited regardless of metric).

  ### The Argumentative Slides

  The phenomenon you observed is the illicit inference between these independent dimensions.

  **Slide 1 (The Skeptic's Move):**
  *   *Premise:* We lack a precise **Metric Structure** (no common unit/zero) or reliable **Epistemic Access** (cannot verify).
  *   *Conclusion:* Therefore, there is no **Ontological Status** (no fact of the matter).
  *   *The Error:* This assumes that if a fact cannot be precisely measured or publicly verified, it does not exist. It conflates the *map* with the *territory*.
  *   *Why it fails:* Pain might be a real fact (Ontology) even if we lack a "painometer" to compare my pain to yours precisely (Metric/Epistemic). The lack of a ruler does not abolish the length of the table.

  **Slide 2 (The Optimist's Move):**
  *   *Premise:* We have some **Epistemic Access** (we agree A is suffering more than B in obvious cases) or a weak **Metric Structure** (ordinal ranking).
  *   *Conclusion:* Therefore, we have a strong **Metric Structure** (cardinal/interval scale) and **Normative License** (we can sum these values).
  *   *The Error:* This assumes that because we can rank in easy cases, we possess a unified scale valid for summation in hard cases. It conflates *ordering* with *measuring*.
  *   *Why it fails:* Agreeing that "agony is worse than annoyance" establishes an ordinal ranking. It does not establish that "agony is 100 units and annoyance is 1 unit," nor that we are permitted to sacrifice the annoyed person to spare the agonized one.

  ### Entailment Relations

  To clarify the independence:
  *   **Ontology does not entail Epistemology:** Facts can exist without us knowing them (Realism + Skepticism is a coherent position).
  *   **Epistemology does not entail Metric:** We can know who is better off without knowing by how much (Ordinal Knowability $\nrightarrow$ Cardinal Measurability).
  *   **Metric does not entail Normative License:** Even if we *can* measure welfare in cardinal units, it does not follow that we *may* sum them (e.g., if rights act as side-constraints).
  *   **Metric Non-Comparability does not entail Ontological Nihilism:** The absence of a common unit is a claim about structure, not existence.

  ### The Practical Pivot

  You asked which claim the practical question turns on: *"May we weigh one person's gain against another's loss, and by how much?"*

  This question strictly requires only two dimensions:
  1.  **Metric Structure (Interval/Ratio + Unit Comparability):** You need a common yardstick to perform the weighing.
  2.  **Normative License:** You need permission to use that yardstick for aggregation.

  Crucially, the practical question **does not** require:
  *   **Ontological Realism:** You can treat welfare as a constructive social metric without believing it is a "natural kind" like mass or charge. As long as the metric is stable and intersubjectively agreed upon, the policy machinery works.
  *   **Perfect Epistemic Access:** You do not need to know the facts with certainty; probabilistic estimates or "reasonable confidence" suffice for policy, provided the error margins are acknowledged.

  The heat in the debate arises because Skeptics attack the Ontology to block the Normative License, while Optimists defend the Epistemology to secure the Metric Structure. Both sides fight over the wrong dimensions to settle the practical question.

  ### Comparison to Established Concepts

  There is no single established term for this specific bidirectional slide, but several concepts cover adjacent territory. Here is how they differ from the phenomenon you described:

  **1. Operationalism (Bridgman/Robbins)**
  *   *Concept:* A concept is synonymous with the set of operations used to measure it. If you can't measure it, it isn't scientifically meaningful.
  *   *Relation:* This explains **Slide 1** (The Skeptic's Move). Robbins used operationalism to argue that because ICU is not verifiable (Epistemic), it is not scientific (Ontological/Methodological).
  *   *Difference:* Operationalism is a philosophical doctrine, not a name for the *fallacious slide* itself. It also does not account for **Slide 2**, where speakers infer measurement from mere agreement.

  **2. Levels of Measurement (Stevens)**
  *   *Concept:* The taxonomy of scales (Nominal, Ordinal, Interval, Ratio).
  *   *Relation:* This provides the vocabulary for the **Metric Structure** dimension. It clarifies that ranking (Ordinal) is not the same as adding (Interval/Ratio).
  *   *Difference:* This is a static classification system. It identifies the *categories* being confused but does not name the *act of confusing* them, nor does it address the Ontological/Epistemic slippage.

  **3. Sen's Informational Basis of Judgment**
  *   *Concept:* Social choice rules should be evaluated based on what information they use (e.g., ordinal non-comparable vs. cardinal comparable).
  *   *Relation:* Sen explicitly argues against **Slide 1** (saying we shouldn't reject ICU just because it's hard) and warns against **Slide 2** (by specifying exactly how much information is needed for specific theorems).
  *   *Difference:* This is a framework for *designing* social choice rules, not a label for the *rhetorical error* of conflating the dimensions. It diagnoses the *requirements*, not the *confusion*.

  **4. Incommensurability**
  *   *Concept:* The absence of a common standard of measurement.
  *   *Relation:* This is often the *premise* of Slide 1.
  *   *Difference:* Incommensurability is a state of affairs (no common unit). It is not the name of the inference that "therefore, no fact exists." One can believe values are incommensurable (Metric) but still real (Ontological).

  ### Proposed Term

  Since the literature distinguishes the *components* (Ontology, Epistemology, Metric, Normativity) but lacks a specific label for the *rhetorical conflation* of these components in the context of welfare, I propose the term:

  **The Metric-Ontic Slide**

  *   **Definition:** The argumentative move wherein a limitation or capacity in the *Metric Structure* (measurability) or *Epistemic Access* (knowability) of welfare is treated as logically entailing a corresponding limitation or capacity in its *Ontological Status* (existence), or vice versa.
  *   **Boundary Case (Inside):** "We cannot measure pain across persons, therefore there is no fact about who is in more pain." (Metric $\rightarrow$ Ontic).
  *   **Boundary Case (Inside):** "We all agree this policy helps more than it hurts, therefore we can sum the utility gains." (Epistemic $\rightarrow$ Metric/Normative).
  *   **Boundary Case (Outside):** "We cannot measure pain across persons, therefore we should not use cost-benefit analysis." (Metric $\rightarrow$ Normative). This is *not* the Metric-Ontic Slide; this is a valid inference from measurement limitations to policy constraints, provided it doesn't claim the facts don't exist.
  *   **Boundary Case (Outside):** "Pain is a real biological state, but we cannot compare it." (Ontic + Metric Limitation). This holds the dimensions apart, avoiding the slide.

  Verdict: no established term — The Metric-Ontic Slide
