answer: |-
  There is no single, canonical term in the social sciences that captures every feature of the pattern you describe. However, your description sits at the intersection of three well-established concepts, each of which captures a portion of the dynamic while missing the crucial mechanism of *participant selection*.

  The closest established labels are **"Race to the Bottom"** and the metaphorical extension of **"Gresham's Law."** In specific subcultures (particularly rationalist and effective altruist communities), this is often discussed under the umbrella of **"Moloch"** or **"Multipolar Traps."**

  Below is an analysis of why these existing terms fall short of your description, followed by a proposal for a more precise term, its definition, and its boundaries.

  ### 1. The Nearest Established Neighbors

  **A. Race to the Bottom**
  *   **What it captures:** This is the strongest policy-economics fit. It describes a competitive dynamic where jurisdictions or actors lower standards (regulations, wages, safety) to gain a competitive advantage, forcing others to follow suit to survive. It captures the "competition degrades the standard" aspect perfectly.
  *   **What it misses:** Classic "Race to the Bottom" models generally assume fixed actors with fixed preferences who are *trapped* in a bad equilibrium. They assume that if coordination were possible, the actors would vote to restore the higher standard. Your pattern specifies that the *actors themselves are replaced*. The constituency that prefers the high standard is filtered out of the system. This makes the "bottom" not just an equilibrium, but a demographic reality.

  **B. Gresham's Law (Metaphorical)**
  *   **What it captures:** "Bad money drives out good." This is frequently used metaphorically (e.g., "Gresham's Law of Journalism" or "of Science") to describe how low-quality work outcompetes high-quality work when the metric of value is distorted. It captures the "bad drives out good" displacement.
  *   **What it misses:** In its original monetary context, Gresham's Law is about circulation, not production culture. It does not inherently imply that the *bankers* change their temperaments. It also implies a fixed standard of "good" vs. "bad" (intrinsic value), whereas you note that the *measure itself moves* ("the yardstick moves with the race").

  **C. Multipolar Trap / Moloch**
  *   **What it captures:** Popularized by game theorist and essayist Scott Alexander, this concept describes a system where multiple actors compete, forcing everyone to sacrifice values they hold dear to survive. It captures the "no one wants this, but no one can stop" feeling.
  *   **What it misses:** While often discussed in evolutionary terms, the "Moloch" framing often focuses on the *incentive structure* rather than the *demographic turnover*. It emphasizes the lock-in of the *system*, whereas you are emphasizing the lock-in of the *population*.

  ### 2. The Missing Mechanism: Constituent Selection

  The distinct feature of your pattern is the **endogenous selection of the constituency.**

  In a standard Tragedy of the Commons or Race to the Bottom, the tragedy is that the *incentives* prevent cooperation among the *existing* group. In your pattern, the competition alters the *composition* of the group. The "voters" change, not just the "votes."

  This creates a specific kind of irreversibility. In a standard coordination failure, you could theoretically solve the problem with a binding contract. In your pattern, a contract is impossible because the coalition required to sign it (those who value the old standard) has been evicted from the system.

  ### 3. Proposed Term: The Selection Ratchet

  Because no existing term isolates the combination of *normative degradation* and *participant filtering*, I propose the term **"The Selection Ratchet."**

  #### Definition
  **The Selection Ratchet** is a socio-economic dynamic in which competitive pressure degrades a shared normative standard, and that degradation acts as a selection filter that systematically removes participants who value the original standard. The process is "ratcheted" because the replacement of the participant pool renders the degradation irreversible; the coalition capable of restoring the original standard no longer exists within the system.

  #### Key Components
  1.  **Normative Resource:** The thing being consumed is not a fixed stock (like fish) but a shared standard of quality or integrity.
  2.  **Competitive Drift:** Actors gain short-term advantages by lowering adherence to the standard, shifting the baseline of "acceptable" performance.
  3.  **Temperamental Filtering:** Survival in the new environment requires dispositions (e.g., risk tolerance, ethical flexibility) that correlate with a lower valuation of the original standard.
  4.  **Constituency Loss:** Proponents of the original standard exit or are outcompeted, removing the political or social capital necessary to reverse the drift.

  ### 4. Boundaries of the Concept

  To ensure this term is useful, we must distinguish it from similar phenomena.

  **What Counts as an Instance (Inclusions):**
  *   **Academic Publishing:** As you described. Researchers who prioritize speed over rigor get more citations; rigorous researchers get fewer grants and leave academia. The field eventually consists mostly of those who do not value rigor.
  *   **Algorithmic Content Creation:** Creators who use outrage or misinformation gain engagement; careful creators lose reach. The platform eventually consists of creators who are optimized for outrage, and the audience's expectation of "normal content" shifts to match.
  *   **Regulatory Arbitrage in Labor:** Companies that ignore safety norms undercut those that follow them. Eventually, the industry is dominated by companies that view safety norms as optional, and regulators (drawn from the industry) no longer see the norms as necessary.

  **What Looks Similar But Does Not Qualify (Exclusions):**
  *   **Simple Tragedy of the Commons:** If a group of fishermen overfish a stock, but they all *wish* they could stop and would sign a treaty if they could, this is *not* a Selection Ratchet. The fishermen have not been replaced by people who *want* to overfish; they are just trapped.
  *   **Technological Obsolescence:** If blacksmiths are replaced by mechanics because cars are better than horses, this is not a Selection Ratchet. The standard of "transportation" improved; the norm did not degrade, and the displacement was not due to a lowering of ethical or quality bars.
  *   **Coercive Tyranny:** If a dictator forces a lower standard upon a population that resists, this is not a Selection Ratchet. The change is imposed from above, not selected for through competition among participants.
  *   **Temporary Fads:** If a field briefly values flashy results but returns to rigor after a scandal, the Ratchet has not engaged. The Ratchet requires the *constituency for rigor to be eliminated*, preventing the return.

  ### 5. Why This Distinction Matters

  Distinguishing **The Selection Ratchet** from a standard **Race to the Bottom** is not merely semantic; it dictates the remedy.

  *   **Remedy for Race to the Bottom:** Coordination. If the actors are fixed but trapped, you need a binding agreement, a regulator, or a union to align incentives.
  *   **Remedy for The Selection Ratchet:** Re-population or Structural Insulation. Because the current actors *prefer* the lower standard (having been selected for it), asking them to coordinate will fail. You must either import new participants from outside the competitive system (e.g., funding tracks for "slow science" that are walled off from standard metrics) or insulate the selection criteria from the competitive pressure (e.g., blind review processes that cannot be gamified).

  ### Summary

  While **"Race to the Bottom"** is the common shorthand, it fails to capture the demographic turnover that makes the decline permanent. **"Gresham's Law"** captures the displacement of quality but misses the shifting yardstick and human element.

  **"The Selection Ratchet"** is the precise term for this pattern. It defines a process where competition degrades a norm, and the degraded norm selects for a population that no longer values the original standard, locking the system into its lower state not by force, but by filtration.
