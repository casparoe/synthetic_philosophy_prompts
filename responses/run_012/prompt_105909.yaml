answer: |-
  This is a sharp intuition. You have identified exactly where the rhetorical sleight-of-hand usually happens in these discussions. The Baronio aphorism is a Rorschach test; people project the level of concession they need to win the argument, not necessarily the level they can sustain theologically.

  Here is the spectrum of claims embedded in that sentence, arranged from the trivial to the radical, followed by an analysis of their utility, Galileo's specific necessity, and the cost of that move.

  ### The Spectrum of Claims

  **1. The Priority Claim (Weak/Empty)**
  *   **Claim:** The *primary* purpose of Scripture is soteriological (salvation), not cosmological.
  *   **Plausibility:** High. Almost any theologian accepts this.
  *   **Argumentative Work:** None. A text can have a primary purpose and still make true secondary claims. A cookbook's primary purpose is recipes, but if it says "water boils at 100°C," that can still be binding truth. This reading allows for conflict; it just says the conflict is about something secondary.

  **2. The Phenomenological Claim (Moderate)**
  *   **Claim:** Scripture describes nature using the language of appearance (phenomena) rather than technical reality (noumena), because that is how humans experience the world.
  *   **Plausibility:** High. This is standard hermeneutics for poetic or narrative sections.
  *   **Argumentative Work:** Low to Moderate. It explains *why* the text says the sun moves, but it doesn't necessarily rule out that the text *implies* the sun moves as a theological truth. It treats the language as loose, but not necessarily non-assertive.

  **3. The Accommodation Claim (Strong)**
  *   **Claim:** The Holy Spirit intentionally adapted the message to the limited scientific understanding of the original audience to ensure the spiritual message was received. The text asserts things about nature that the audience believed, even if those things were technically false, because correcting their science was not necessary for salvation.
  *   **Plausibility:** Contested. This touches on inspiration and inerrancy.
  *   **Argumentative Work:** High. This dissolves the conflict. If the Spirit accommodated false cosmology to teach true theology, then scientific discovery cannot contradict the *intent* of the text, only the *accommodated vessel*.

  **4. The Jurisdictional Claim (Very Strong)**
  *   **Claim:** Scripture possesses no authority whatsoever regarding natural philosophy. Any passage that seems to speak on nature is strictly metaphorical or incidental.
  *   **Plausibility:** Low (historically). Pre-modern theology generally assumed a unified truth; God is the author of both books (Scripture and Nature), so they cannot contradict.
  *   **Argumentative Work:** Maximum. This is the "conversation stopper." It removes theology from the business of judging scientific claims entirely.

  ### The Bait-and-Switch

  You are correct to suspect the reading doing the work is stronger than the one defenders will hold under pressure.

  When your reading group member used the line to "shut down" the argument, they were operating on **Claim 4 (Jurisdictional)**. They implied: *Science cannot conflict with the Bible because the Bible isn't talking about science.*

  However, if you pressed them, they would likely retreat to **Claim 1 (Priority)** or **Claim 2 (Phenomenological)** because Claim 4 is historically untenable (the Bible makes claims about the earth's foundations, the firmament, etc.) and Claim 3 (Accommodation) is theologically dangerous (see below).

  The rhetorical power of the aphorism comes from smuggling the Jurisdictional Claim inside the harmless Priority Claim. It sounds like "The Bible focuses on salvation" (Claim 1), but it functions as "The Bible has no say on physics" (Claim 4).

  ### What Galileo Needed

  Galileo needed **Claim 3 (Accommodation)**, but he had to package it carefully.

  He could not argue Claim 4 (Jurisdictional) because he was a devout Catholic arguing within the Church, not outside it. He needed to maintain that Scripture is inerrant. If Scripture is inerrant, and Nature is God's creation, they cannot contradict. Therefore, if Copernicus is right, our *reading* of Scripture must be wrong.

  To make that work, Galileo argued that the biblical authors were speaking via **Accommodation**. He argued that the Holy Spirit allowed the authors to speak according to the "reception of the people." If the Spirit had taught heliocentrism to the Israelites, it would have confused them and hindered the salvation message.

  So, Galileo needed the text to be *literally false* regarding cosmology, but *intentionally so* by the Spirit, to preserve the *spiritual truth*.

  ### The Cost of the Accommodation Move

  This is the hinge point you identified: *If Scripture talks to us in our own terms, hasn't the Spirit said some things that are false?*

  Yes. That is the cost. And it is a massive one.

  1.  **The "Noble Lie" Problem:** If the Holy Spirit utilized a false cosmological model to teach a spiritual truth, it implies that divine pedagogy involves endorsing human error. For a chemist used to precise data, this is unsettling. For a theologian, it risks making God a deceiver, or at least a pragmatist who trades truth for utility.
  2.  **The Boundary Problem:** If the Spirit can accommodate false physics for the sake of salvation, how do we know He didn't accommodate false *history* or false *ethics* for the sake of cultural cohesion? If the sun doesn't move, but the text says it stood still (Joshua), what else in the narrative is accommodated rather than asserted?
  3.  **The Authority Shift:** By arguing that we need scientists to interpret the "nature" passages of the Bible, Galileo effectively shifted authority from the theologian to the natural philosopher. The theologian knows salvation, but the natural philosopher knows what the text *means* when it talks about the sun.

  ### The Queen of the Sciences

  This bears directly on your group's hour-long debate about Theology as the "Queen of the Sciences."

  In the Scholastic hierarchy, Theology is Queen because it deals with the highest cause (God) and the ultimate end (Salvation). Natural Philosophy (Science) deals with secondary causes. Traditionally, the Queen judges the handmaidens. If Physics says something that contradicts Theology, Physics is wrong.

  Galileo's accommodation move attempts to **redefine the Queenship**.

  He argues that Theology is Queen of *Salvation*, but Nature is a book written by God in the language of mathematics. Therefore, regarding the mechanics of the universe, the "book of Nature" is the primary text, and Scripture is the commentary intended for the layperson.

  If he succeeds, Theology remains Queen, but her jurisdiction is limited to the supernatural and the moral. She loses her veto power over the natural.

  **The Trade-off:**
  *   **If Theology remains Queen over Nature:** Science is subordinate to scriptural literalism. (Galileo loses).
  *   **If Galileo's Accommodation holds:** Science is free, but Scripture's relationship to truth becomes pragmatic rather than propositional regarding the natural world. (Theology loses its claim to totalizing truth).

  ### Summary

  The aphorism is doing heavy lifting because it tries to solve an epistemic conflict (how do we know truth?) with a teleological distinction (what is the purpose of this text?).

  *   **To be plausible:** It must mean the Bible's *main goal* is salvation (Claim 1).
  *   **To end the argument:** It must mean the Bible makes *no truth claims* about nature (Claim 4).
  *   **To save Galileo:** It must mean the Bible *makes false claims* about nature on purpose (Claim 3).

  Your group member likely wanted the argumentative power of Claim 4 with the respectability of Claim 1. Galileo needed Claim 3, which cost him the support of the theologians who believed that if the Spirit dictated the words, the words must correspond to reality, not just appearance. He won the science, but he forced a wedge between "spiritual truth" and "factual truth" that HPS scholars are still analyzing four centuries later.
