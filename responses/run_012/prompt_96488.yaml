          *   Distillation: Compressing a smart net into a dumb net. The dumb net behaves smartly but doesn't "know" why.
          *   To fix A-universality, we must ascribe beliefs to the *optimization process*, not just the final artifact.
      *   **Internal vs. Process Transparency:**
