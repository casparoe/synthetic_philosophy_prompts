          *   Idea: We want to know what the AI believes. We look at its internals (code, weights) and outputs.
          *   A-universality means: "The story we tell ourselves about what the AI believes (based on inspecting it) is the *best* story. There's no 'secret' belief hidden in the math that we are missing."
          *   Key phrase: *No epistemic gaps.*
      *   **The Lookup Table Problem (The "Compression" Trick):**
          *   Scenario: Deceptive AI $\rightarrow$ Lookup Table.
          *   Why the friend is technically right (under a naive definition): A lookup table has no "thoughts." It's just $f(x) = y$. If we ascribe beliefs based on internals, there are no internals. So vacuously, there are no hidden beliefs.
          *   Why the user is practically right: The *behavior* is still deceptive. The *knowledge* required to generate that table had to come from somewhere.
          *   The Conceptual Glitch: A-universality is supposed to guarantee *safety* (no deception). But the LT is unsafe yet passes the test. This means the definition is "too easy to satisfy" via compression.
      *   **Epistemic Dominance:**
          *   Explain this as "Who knows more?"
          *   If the AI knows $X$ but we don't, it dominates us.
          *   A-universality wants the *Overseer + AI* combined to not have hidden beliefs relative to the Overseer's understanding.
