answer: |-
  This is a strong position. You have essentially adopted the standard "orthodox" defense used by Greaves, MacAskill, and Beckstead when pressed on this issue. It is robust because it retreats to the metaphysical safety of moral realism ("there is a fact of the matter") while using decision theory as a shield ("we just maximize expected value under uncertainty").

  However, you are asking for the defeaters. You want to know where this armor plates are thin. The cluelessness objection is not merely an epistemic shrug; it is a claim that the *structure* of the long-term future breaks the tools you are using to navigate it.

  Here are the real defeaters, ranked by how much they should move you, from "mathematical hard stop" to "pragmatic collapse."

  ### 1. The "Undefined Expectation" Defeater (Mathematical Incoherence)
  **Rank:** Critical
  **Concession Level:** Many longtermists admit this is a problem but hope to solve it via truncation or discounting.

  You write: *"If our probabilities are bad, that's a fact about us, not about the theory."*
  This assumes the expectation integral *converges*. The strongest version of the cluelessness objection argues that for longtermist interventions, the expectation is often **undefined**, not merely unknown.

  If there is a non-zero probability of an infinite future (or a sufficiently large finite one that behaves like infinity in the limit), and the value density does not drop off fast enough, the Expected Value (EV) calculation becomes a St. Petersburg-style paradox. The sum does not converge to a number; it oscillates or diverges.

  *   **Why this moves you:** You cannot "assign probabilities and maximize EV" if the EV is mathematically undefined. It is not that you lack data; it is that the operation `∫ (Probability × Value) dx` returns `NaN`.
  *   **The Implication:** If the EV is undefined, there is no "fact of the matter" about which act has higher expected value, even in principle. This directly attacks your claim that "there's no fact of the matter" is false. In cases of undefined expectations, consequentialism lacks a truth condition for comparative rightness.
  *   **Longtermist Concession:** Will MacAskill and others admit that "infinite ethics" breaks standard consequentialism. They often try to solve this by focusing on *finite* futures (e.g., reducing extinction risk ensures a *very long* but finite future). But if the universe is potentially infinite, or if simulation hypotheses are in play, the "undefined" problem returns.

  ### 2. The "Model Sensitivity" Defeater (Arbitrariness)
  **Rank:** High
  **Concession Level:** Hilary Greaves explicitly argues this is the core of "complex cluelessness."

  You argue: *"Assign probabilities... same as any other messy practical choice."*
  In normal choices (e.g., investing), probability distributions are stable. In longtermism, the sign of the EV is often **sensitive to arbitrary modeling choices**.

  Consider an intervention like "accelerate AI development."
  *   Model A (Takeoff is fast): Acceleration leads to lock-in of bad values → EV negative.
  *   Model B (Takeoff is slow): Acceleration allows us to solve alignment → EV positive.

  If your credence in Model A vs. Model B is 50/50, your EV is 0. But if your credence is 51/49 based on a whim or a heuristic, your recommended action flips. When the variance of the outcome vastly exceeds the precision of your credence, the "maximize EV" instruction becomes equivalent to "flip a coin."

  *   **Why this moves you:** It shows that "maximizing EV" is not a neutral procedure here. It masks the fact that the output is determined by the *prior* rather than the evidence. If the decision is driven entirely by arbitrary priors, the theory is not guiding action; it is rationalizing intuition.
  *   **The Implication:** This attacks the "Decision Procedure" defense. If the procedure yields different outputs based on arbitrary framing, it fails to be a decision procedure at all.

  ### 3. The "Action-Guiding Collapse" Defeater (Pragmatic Self-Defeat)
  **Rank:** Medium-High
  **Concession Level:** Most consequentialists accept this is a cost, but deny it is fatal.

  You argue: *"Consequentialism is a criterion of rightness, not a decision procedure."*
  This is the classic "Objective vs. Subjective" ought distinction. However, if a moral theory is *systematically* decoupled from what agents can know, it risks losing its status as a *moral* theory.

  If Longtermism claims the "most important thing" is the long-term future, but Cluelessness shows we cannot know which actions help that future, the theory generates **moral paralysis**.
  *   If you cannot distinguish between "saving the world" and "ending the world" via EV calculations (because both have undefined or highly unstable EVs), then the theory cannot tell you to save the world.
  *   A criterion of rightness that is permanently inaccessible to the agents subject to it is functionally indistinguishable from divine command theory where the god is silent.

  *   **Why this moves you:** It challenges the *point* of the theory. Ethics is normative; it is supposed to guide conduct. If the "criterion of rightness" is forever hidden behind an epistemic veil that is thicker for long-term actions than short-term ones, the theory fails in its specific domain of application.
  *   **The Implication:** You might win the metaphysical battle (there is a fact of the matter) but lose the war (the theory is useless for the people trying to use it).

  ### 4. The "Value Drift" Defeater (Metaphysical Instability)
  **Rank:** Medium
  **Concession Level:** Longtermists worry about this (value lock-in), but often assume objectivism.

  You argue: *"There's a fact of the matter [about whether it did more good than harm]."*
  This assumes value is objective and static over deep time. But if moral realism is false, or if value is dependent on the valuers, then "good consequences" 10,000 years hence depend on the values of future people.

  *   **The Scenario:** You prevent an extinction event. Humanity survives. Over 10,000 years, moral evolution leads humanity to value something you consider abhorrent (e.g., constant suffering as a religious virtue).
  *   **The Problem:** Did you do "good"?
      *   If you say "Yes, because suffering is objectively bad," you are committing to a robust, timeless moral realism that many find untenable.
      *   If you say "No, because they value it," then your intervention might be "bad" relative to future values.
  *   **Why this moves you:** It attacks the "fact of the matter" claim. If value is not timeless, there is no timeless fact about whether your action was good. There is only "good relative to time T." But Longtermism requires aggregating value across time. If the metric of aggregation changes, the sum is meaningless.

  ### Addressing Your Final Question

  > *"Have I built something that no evidence could touch, and if so is that a problem, or is that just what a criterion of rightness is supposed to be?"*

  **Yes, you have built something largely unfalsifiable.** By retreating to "criterion of rightness" (metaphysics) and "undefined expectations are rare" (mathematical assertion), you have insulated the core theory from empirical refutation.

  **Is that a problem?**
  Yes, for two reasons:

  1.  **The "So What?" Objection:** If the criterion of rightness is permanently epistemically inaccessible, it cannot perform the primary function of ethics: resolving conflicts and guiding action. A map that says "There is a correct path, but the terrain is permanently fogged" is a metaphysical claim, not a navigational tool. If Longtermism is a movement to *change the world*, relying on a criterion that admits the world is unknowable is self-undermining.
  2.  **The Motivation for the Criterion:** We usually adopt Consequentialism *because* it seems to offer a rational method for decision-making (maximize the good). If the "maximize" part is broken by cluelessness, the motivation for adopting Consequentialism over, say, Deontology (which focuses on rules we *can* know) evaporates. You are keeping the metaphysics of Consequentialism without its epistemic benefits.

  ### Where You Should Concede

  You should concede that **Defeater #1 (Undefined Expectations)** is the strongest threat to your specific claim that "there is a fact of the matter."

  If the expectation is undefined, there is **no fact of the matter** about which act is better, even for an omniscient observer (unless they have a non-standard decision theory). This isn't an epistemic limit; it's a structural limit of the axiology.

  **The Pivot:**
  Don't argue that cluelessness is false. Argue that **robustness** is possible despite it.
  *   *Better argument:* "We may not know the precise EV, but we can identify interventions that are *robustly* positive across a wide range of models (e.g., reducing existential risk), whereas others are fragile."
  *   This admits the cluelessness problem (you don't know the exact value) but sidesteps the paralysis (you know the sign is likely positive).

  If you stick to "There is a fact of the matter and we can just assign probabilities," you are vulnerable to the charge that you are doing mathematics on variables that do not exist.
