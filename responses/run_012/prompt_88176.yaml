answer: |-
  # Q&A PREP SHEET: The Draft Plenary
  **Venue:** Law School Symposium on Privacy
  **Speaker:** Novelist (*The Draft*)
  **Core Thesis:** Privacy is the ontological space to remain an "unwitnessed draft." Surveillance converts drafts into binding documents.

  ## STRATEGIC STANCE
  **Concede Up Front:**
  *   Privacy *has* historically shielded abuse (do not fight the feminist critique on history).
  *   Privacy *is* unequally distributed (do not claim the "draft" is equally available to all).
  *   This theory is not a statute; it is a heuristic for valuing what the law protects.

  **Hold Firm:**
  *   The ontological claim: Surveillance changes *what we are*, not just what is known about us.
  *   The value of the unfinished: Completion is a form of death/rigidity.
  *   Fiction's epistemic privilege: The novel is the only technology that legally permits total self-revision without consequence.

  ---

  ## THE EIGHT OBJECTIONS (Ordered by Damage Potential)

  ### 1. The Civil-Liberties Litigator
  **The Objection:** "This is beautiful, but I have to stand before a judge on Tuesday. You say privacy is about being a 'draft.' How do I plead that? Does 'draft status' grant standing? If a client is fired because an algorithm predicted their behavior based on incomplete data, does your theory help me argue they had a right to remain inconsistent? Or does it just give the judge another reason to call our claims abstract?"
  **The Reply (2 mins):** "It doesn't give you a new cause of action; it gives you a new *harm*. Currently, you argue harm as 'disclosure of sensitive info' or 'loss of control.' I'm asking you to argue harm as 'premature foreclosure of the self.' When an algorithm scores you, it isn't just watching; it's casting you. It turns your potential into a risk profile. Your argument isn't that the data is false, but that the *finality* is illegitimate. You aren't fighting for secrecy; you're fighting for the right to be a work in progress. It won't win every motion, but it shifts the burden from 'what did they hide?' to 'who are they forcing me to be?'"
  **The Soft Spot:** Courts hate ontological arguments. They want concrete injury. You are asking the litigator to sell poetry to a clerk who wants case law. You have no precedent for "foreclosure of self."

  ### 2. The Feminist Legal Theorist
  **The Objection:** "You speak of the 'unwitnessed room' as a site of creation. But for women, the unwitnessed room has often been a site of erasure or violence. Privacy is the doctrine that kept domestic abuse off the public docket for centuries. If we valorize the 'draft' self that no one sees, aren't we just rehabilitating the 'private sphere' where patriarchy does its worst work? Why should I trust your 'draft' more than I trust the 'right to be let alone' that protected my grandmother's abuser?"
  **The Reply (2 mins):** "You are absolutely right that privacy has been a shield for power. I am not defending the privacy of the abuser. I am defending the *draftiness* of the victim. The abuser demands the victim be a fixed document: *the wife, the servant, the silent partner.* Surveillance capitalism does the same. My argument is that privacy is the tool the vulnerable use to rewrite the script power has written for them. The 'unwitnessed room' isn't where you hide the bruise; it's where you imagine a life without the bruise. If we lose the space to draft, we are stuck with the document power has already authored."
  **The Soft Spot:** This relies on a hopeful distinction between "hiding harm" and "drafting freedom." In practice, they look identical to the state. You risk sounding like you're romanticizing isolation.

  ### 3. The Sociologist (Dramaturgical Tradition)
  **The Objection:** "I work in the Goffman tradition. We know there is no 'backstage.' The self is constituted entirely by performance and witness. To say there is a 'true draft' inside the room is a romantic fiction. You are only ever the sum of your interactions. So, what exactly are you protecting? A ghost? If I am never truly 'unwitnessed' because I am always witnessing myself, isn't this just solipsism dressed as privacy theory?"
  **The Reply (2 mins):** "Goffman is right that the self is social. But he missed the *rehearsal*. An actor rehearses not to perform for no one, but to find a version of the character that *can* survive the audience. If the rehearsal is livestreamed, the actor stops experimenting and starts pleasing. I am not arguing for a 'true self' hidden away. I am arguing for the *process* of self-construction. Surveillance removes the rehearsal phase. It forces us to perform the final take on the first try. I'm protecting the rehearsal, not the ghost."
  **The Soft Spot:** A hardline constructivist will deny the "rehearsal" has any ontological weight if it isn't observed. You are asserting a metaphysical claim they reject by methodological definition.

  ### 4. The Doctrinal Privacy Scholar
  **The Objection:** "We rely on tests: Reasonable Expectation of Privacy, Contextual Integrity. These are flawed, but they are operable. Your 'Draft Theory' offers no boundary. When does a draft become a document? If I post a tweet and delete it, was that a draft? If I send a text, is that a document? If you can't give me a line where the draft ends and the commitment begins, how can this inform policy?"
  **The Reply (2 mins):** "I can't give you a line, because the technology has erased it. That is the problem. In the past, the medium decided: a diary was a draft, a letter was a document. Now, a diary is data. My theory isn't a test for judges; it's a constraint for designers. The policy implication is 'friction.' We need systems that allow data to expire, to remain ambiguous, to resist being archived. Don't ask me where the line is; ask why the system is designed to make the line invisible. The law should mandate the *possibility* of the draft, not define it."
  **The Soft Spot:** "Mandate the possibility" is legally vague. Regulators need definitions. You are offering a vibe, not a rule, which frustrates doctrinal scholars.

  ### 5. The Critical Race/Class Scholar
  **The Objection:** "The luxury of the 'draft' is whiteness and wealth. Poor people and people of color are born as documents. Policed, scored, tracked, filed. They don't get a room to rewrite themselves; they get a file that follows them. By centering the 'draft,' aren't you centering the experience of the privileged who have the option to be unfinished, while ignoring those for whom privacy is already a lost cause?"
  **The Reply (2 mins):** "That is precisely why this matters. If privacy is only for those who can afford seclusion, it is a commodity. If privacy is the right to *revision*, it is a civil right. The surveillance state locks marginalized communities into a permanent past tense—your record is your future. My argument is that the 'right to be a draft' is most urgent for those the system has already finalized. We shouldn't abandon the concept because it's been unequal; we should weaponize it for those who have been denied the pen."
  **The Soft Spot:** It is easy to say "weaponize it," much harder to show how. You risk sounding like you're co-opting structural inequality for a literary metaphor.

  ### 6. The Philosopher of Autonomy
  **The Objection:** "This sounds like Autonomy with extra steps. Autonomy is the capacity to self-govern, to choose your ends. Your 'draft' is just the temporal dimension of autonomy. Why do we need a new concept? Are you just renaming 'negative liberty' as 'draftiness' to make it sound more novelistic?"
  **The Reply (2 mins):** "Autonomy assumes a chooser who exists prior to the choice. My claim is that the chooser is *made* in the drafting. Autonomy protects the decision; Draft Theory protects the *indecision*. Autonomy says 'you have the right to choose your path.' I'm saying 'you have the right to not have a path yet.' Autonomy is about sovereignty; Draft Theory is about potentiality. In an age of predictive algorithms, sovereignty is useless if the algorithm knows what you'll choose before you do. We need to protect the fog, not just the driver."
  **The Soft Spot:** Philosophers will argue that "indecision" is just a state of autonomy. You are making a semantic distinction that may not hold up under rigorous analytic scrutiny.

  ### 7. The Surveillance Journalist
  **The Objection:** "I've spent ten years watching data brokers. They don't care if you're a draft. They sell predictions. They monetize the gap between who you are and who you might be. Your theory assumes a moral value to the draft. The market values the draft as *unrealized profit*. How does your 'ontological defense' survive contact with an economy that specifically profits from foreclosing your future?"
  **The Reply (2 mins):** "It survives by exposing the theft. They aren't just selling ads; they are selling *your future self* without your consent. They are short-selling your soul. When you frame it as 'they are stealing my draft,' it changes the moral valence. It's not just 'they know my secrets.' It's 'they are publishing my biography before I've written it.' It makes the violation feel more intimate. It moves the debate from 'data security' to 'identity theft' in the literal sense."
  **The Soft Spot:** Moral valence doesn't stop capital. You have no economic counter-model, only a moral one. The journalist knows this and will press you on material remedies.

  ### 8. The "Novelist in a Law School" Skeptic
  **The Objection:** "You're a fiction writer. You deal in lies that tell the truth. We deal in statutes that bind reality. Why should we take a metaphor from a book as a framework for human rights? Isn't this just an elaborate pitch for your novel?"
  **The Reply (2 mins):** "Law is also a storytelling medium. It tells a story about who counts, who is responsible, what happened. But law is constrained by precedent; fiction is constrained only by coherence. That makes fiction the R&D lab for the self. I'm not asking you to adopt my plot. I'm asking you to use my instrument. You measure the weight of harm; I measure the weight of possibility. You need both. If you only listen to lawyers, you'll build a perfect cage. You need a novelist to remind you why we need a door."
  **The Soft Spot:** It's a nice line, but if your book isn't good, or if your examples are thin, this sounds like arrogance. You have to earn the authority you claim.

  ---

  ## THE ONE QUESTION YOU HOPE NOBODY ASKS

  **The Question:**
  "You argue that the self is most fully itself in the pages it never finishes, because finishing makes it count. But you are standing here, finishing a public argument, publishing a novel, and seeking to codify this theory. **Are you not turning your own best idea into a document to be counted? Is this talk not a betrayal of Maren?**"

  **Why it hurts:**
  It attacks the *performative consistency* of your presence. It suggests your theory is self-refuting: to advocate for the value of the unwitnessed draft, you must witness yourself. It implies you have sold out the very silence you claim to defend in order to gain the platform to defend it.

  **The Emergency Reply:**
  "Maren withdraws because she has no other choice. I am speaking because I have found a community that might listen. A draft is not valuable because it is hidden; it is valuable because it is *free*. I am testing this draft against you. If it breaks, it was a bad draft. If it holds, it becomes a tool. I am not finishing the argument today; I am handing you the pen."
