answer: |-
  **Credence Authority Rectifies Incoherent Probabilities Through Mandatory Arbitrage**

  **WHITEHALL** — Mr Arthur Penhaligon, a clerk from Slough, was yesterday relieved of 4,500 utilits following a routine audit by the National Credence Authority (NCA). Mr Penhaligon had lodged a credence schedule assigning a 0.6 probability to the proposition that it would rain on Tuesday, and a 0.6 probability to the proposition that it would not. Under the Coherence Statute, this violation of the probability axioms entitled a licensed arbitrageur to construct a book guaranteeing a loss regardless of the meteorological outcome.

  "The market corrected the inconsistency immediately," said Sarah Vane, Director of Compliance at the NCA. "Once the credences were lodged on the central register, the betting became compulsory. We cannot allow citizens to hold views that leave them exploitable. It is a fiscal hazard."

  The statutory framework relies on several technical adjustments to civic life, most notably the introduction of utility-denominated scrip. The Chancellor's Office confirmed last week that the reform abolishing diminishing marginal returns was purely technical, required to ensure money remains linear in utility for all taxpayers. Without linearity, the Dutch book arguments underpinning the legislation would not hold, as citizens might refuse bets where the disutility of loss outweighs the utility of gain. The scrip ensures that one unit of currency always represents one unit of satisfaction, regardless of total wealth.

  To address diachronic coherence, all citizens must now lodge a schedule of conditional bets in advance. This ensures that upon receiving new evidence, agents update their credences according to a pre-committed rule, typically conditionalisation. Failure to update according to the lodged schedule is treated as a fresh incoherence, triggering a new round of arbitrage. To assist with compliance, the Department for Logic maintains a state machine that informs citizens instantly of every logical consequence of their belief set. Citizens receive a daily digest of contradictions they are currently harbouring, allowing them to adjust their odds before the arbitrageurs arrive.

  "It is not about being right," said Julian Thorne, Chief Actuary for the NCA, who has frequently clarified the regime's scope. "Coherence is a purely practical business of not being exploitable. You can be consistently wrong and remain compliant. The State does not legislate truth, only consistency."

  Certain edge cases have required legislative tweaking. Section 4(b), regarding countable additivity, was quietly repealed last month after draftsmen could not make the books work for infinite sets; the Authority now enforces finite additivity only. Meanwhile, enforcement continues against citizens with bounded utility functions. One resident, who reached maximum utility saturation after earning 10,000 utilits, proved deeply irritating to regulators. Since further losses could not decrease his utility, he was immune to the standard deterrents, requiring the Authority to invoke emergency powers to adjust his utility curve manually.

  Licensed arbitrageurs operate with effectively unlimited credit and may set any stake required to expose the incoherence. There is no requirement for the arbitrageur to hold coherent beliefs themselves. One senior bookmaker, currently facing his own audit for assigning probabilities summing to 1.4 across a mutually exclusive set, continued to trade throughout the proceedings. "The argument only requires the victim to be rational," he noted.

  Dissident factions remain active. The Accuracy-First Coalition argues that fines are a distraction, contending that the real failing of incoherent credences is that they are accuracy-dominated rather than merely exploitable. They propose the regulator be run on entirely different lines, penalising distance from the truth rather than susceptibility to loss. The NCA has dismissed these proposals as outside its statutory remit.

  Mr Penhaligon accepted the fine. "I suppose I should have checked the logical consequences," he said. "The machine was down for maintenance."

  ***

  **Note to the Editor**

  This piece satirises the Dutch Book Theorem, which proves that incoherent credences violate probability axioms. The math is real; the enforcement is not. Philosophers agree that Dutch arguments assume linear utility and compulsory betting, but no one proposes abolishing diminishing marginal returns via state scrip. The "Accuracy-First" dispute is genuine (coherence vs. accuracy), though no faction seeks regulatory power. The logical omniscience machine dramatises the "logical omniscience problem" in Bayesianism—we aren't actually expected to know all consequences. The repeal of countable additivity reflects technical debates about whether Dutch Books truly establish it (they generally don't without extra premises). The state enforcement is pure fabrication.
