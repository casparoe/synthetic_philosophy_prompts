answer: |-
  Your hypothesis is correct: this is not one disagreement, but three distinct problems conflated under a single label. The persistence of the impasse suggests that the participants are using the word "Darwinian" as a proxy for deeper commitments about causality, measurement, and explanatory adequacy.

  Here is the diagnosis of the impasse, broken down by the layers you identified, followed by a prescription for progress.

  ### 1. The Verbal Dispute: Stipulation vs. Concealment
  **Does stipulation dissolve this?** Yes, but at a cost.
  **Does it conceal something?** Yes, it conceals the causal claim.

  If the group stipulates that "Darwinian" means *any* process exhibiting heritable variation and differential retention (the "thin" definition), the Selectionist faction wins the terminology immediately. However, this stipulation conceals the substantive disagreement about *causal efficacy*.

  The Transformationalist faction is not merely arguing about labels; they are arguing that the "differential retention" observed by the Selectionists is often an epiphenomenon of cognitive attractors. If a specific story form recurs across unrelated populations not because it was copied successfully, but because human memory reconstructs *any* story toward that form, then calling this "selection" is indeed bookkeeping. It describes the outcome (frequency change) but misidentifies the cause (reconstruction vs. replication).

  **Diagnosis:** A stipulative definition of "Darwinian" resolves the semantic conflict but masks the ontological one. The Selectionists are claiming selection is the *engine*; the Transformationalists are claiming selection is the *exhaust*. Stipulation cannot settle whether the engine is driving the car or if the car is being pushed by a slope (the cognitive landscape).

  ### 2. The Empirical Dispute: Fidelity and Structure
  **Is this empirical?** Yes.
  **How to settle it?** By distinguishing noise from bias, and form from function.

  This is the core battleground. The Selectionists require sufficient fidelity to sustain lineages; the Transformationalists argue fidelity is too low and reconstruction too strong. The "fidelity of representation vs. fidelity of result" counter-argument is the Selectionists' strongest empirical defense, but it requires operationalization.

  *   **Fidelity of Representation:** Did Agent B copy the exact phonemes or pixels of Agent A? (Transformationalists say: No, too much noise.)
  *   **Fidelity of Result:** Did Agent B acquire the same *functional capacity* or *semantic outcome* as Agent A? (Selectionists say: Yes, that's what matters.)

  **Measurement to settle this:**
  You need two distinct types of data analysis currently often conflated:
  1.  **Phylogenetic Signal:** Measure the tree-likeness of cultural data. If cultural variants cluster by lineage (parent-to-child or teacher-to-student) more than by cognitive similarity, selection/copying dominates. If they cluster by cognitive type regardless of lineage, transformation dominates.
  2.  **Transmission Chain Experiments:** Run "telephone game" experiments where the input is varied. If the output converges on a specific form regardless of input, you have a transformational attractor. If the output varies proportionally to the input with some noise, you have a copying process subject to selection.

  **The "Result" Nuance:** The impasse here rests on the *Unit of Selection*. If the Selectionists define the unit as the *functional outcome*, they can tolerate low representational fidelity. The Transformationalists must then demonstrate that the "functional outcome" is not itself a cognitive attractor. The empirical settlement requires measuring whether functional stability persists *against* cognitive attractors, not just *alongside* them.

  ### 3. The Methodological Dispute: Explanatory Standards
  **Resting on external standards?** Yes.
  **Which question is each camp answering?**

  This is where the disagreement is intractable without a shift in scope. Each faction demands a different kind of explanatory payoff from the theory.

  *   **The Selectionists** are answering: *"How do we model the frequency dynamics of variants in a population over time?"* Their standard of success is predictive accuracy regarding distribution and prevalence.
  *   **The Transformationalists** are answering: *"Why do cultural forms have the specific content and structure that they do?"* Their standard of success is explaining universals and content stability.
  *   **The Cumulative Adaptationists** (your third faction) are answering: *"How does cultural complexity increase beyond the capacity of a single individual?"* Their standard of success is explaining the "ratchet effect."
  *   **The Historian** is answering: *"Why did this specific event happen in this specific context?"* Their standard of success is contingency and agency.

  **Diagnosis:** The question "Is culture Darwinian?" is a category error. It asks for a binary classification of a heterogeneous set of processes. The Selectionists are right that some cultural domains (e.g., technology, tool design) behave like Darwinian populations because functional fidelity is enforced by the environment. The Transformationalists are right that other domains (e.g., folklore, superstition) behave like epidemiological reconstructions because they are governed by cognitive priors. The Historian is right that specific historical events often turn on unique contingencies that evolutionary models average out.

  The impasse exists because each side is demanding that their explanatory standard be the *only* valid one. The Selectionists think explaining frequency is the only "science"; the Historian thinks explaining specificity is the only "truth."

  ### 4. Path to Progress

  Progress will not come from a definition, nor from a single decisive experiment, because culture is not a uniform substance. Progress requires a **Domain-Specific Framework**.

  **What progress looks like:**

  1.  **A Formal Threshold Result:**
      You need a formal model (likely from the Cumulative Adaptationist camp) that specifies the *minimum fidelity threshold* required for cumulative complexity to emerge. This is not a binary "is it Darwinian?" but a continuous variable: "At fidelity level $X$, selection dominates; below $X$, transformation dominates." This turns the dispute into a measurement problem: *Where does this specific cultural trait fall on the fidelity spectrum?*

  2.  **A Replacement Question:**
      Stop asking "Is cultural transmission Darwinian?"
      Start asking: **"To what extent is this specific cultural domain governed by selectional dynamics versus transformational attractors?"**
      This allows the Selectionists to claim victory in domains like lithic technology (where function constrains form) and the Transformationalists to claim victory in domains like urban legends (where cognitive bias constrains form), without contradicting each other.

  3.  **Acknowledging the Historian's Boundary:**
      The Historian's objection should be treated as a boundary condition. Evolutionary models explain *patterns*; Historical models explain *events*. Progress involves specifying when the pattern is strong enough to override the contingency. If the historical context changes the fitness landscape faster than selection can act, the Darwinian model fails. This is an empirical claim about the *rate of environmental change* vs. the *rate of transmission*.

  **Conclusion:**
  The trouble lies in the third position you identified (Cumulative Adaptation), but not for the reason your group thinks. It is not about fidelity of representation vs. result. It is about **explanatory target**.

  *   If your target is **Frequency**, the Selectionist model is sufficient (even if transformation occurs, it can be modeled as a bias in selection).
  *   If your target is **Content**, the Transformationalist model is necessary.
  *   If your target is **Complexity**, the Fidelity Threshold is the deciding factor.

  The impasse will dissolve when the group agrees that "Cultural Evolution" is not a theory of everything, but a toolkit. Some tools are Darwinian (selection), some are Cognitive (transformation), and some are Historical (contingency). The work is not to decide which tool is "The Truth," but to map which tool fits which part of the cultural landscape. The "Darwinian" label should be retired not because it is wrong, but because it is too coarse to capture the hybrid nature of cultural transmission.
