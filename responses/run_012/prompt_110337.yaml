answer: |-
  This is a profound question that cuts to the heart of regulatory philosophy. You are right to be dissatisfied with your friends' suggestions. They are pointing at the same elephant, but describing different parts of the anatomy, and neither has identified the skeleton that holds it upright.

  As a philosopher of decision-making, I will carve this concept for you. I shall begin by testing the existing candidates against your four criteria, identify where they fracture, and then propose the precise terminology you require. I will write in British English, as requested.

  ### I. Brainstorming the Candidates

  To find the right name, we must first discard the near-misses. Here are the primary concepts from the literature that compete for this space, evaluated against your four bullet points.

  **1. Omission Bias**
  *   **The Concept:** A cognitive bias where people judge harmful *actions* (commissions) as morally worse than equally harmful *inactions* (omissions).
  *   **Where it fits:** It perfectly explains your second and fourth points: the harm of acting is treated as 'real' (culpable), while the harm of not acting is 'speculative' (blameless). It captures the psychological intuition that doing nothing is not a decision.
  *   **Where it fails:** As you intuited, Omission Bias is primarily *moral* and *psychological*. It explains why a human *feels* less guilty about inaction. It does not explain the *institutional accounting* you describe. Your regulator is not necessarily feeling guilt; she is following a ledger where the columns are drawn differently. Omission Bias describes the mind; your pattern describes the spreadsheet.
  *   **Verdict:** This is the *cause*, not the *system*.

  **2. The Precautionary Principle**
  *   **The Concept:** A policy rule stating that if an action has a suspected risk of causing harm to the public or environment, the burden of proof that it is *not* harmful falls on those taking the action.
  *   **Where it fits:** It explains the first and fourth points: the burden of proof lies on the actor, and the status quo is protected.
  *   **Where it fails:** The Precautionary Principle is *epistemic*. It is triggered by *uncertainty* or ignorance ("we do not know enough"). You specify that your pattern persists "when we know perfectly well." Furthermore, the Precautionary Principle is a *prescription* (a rule one ought to follow), whereas your pattern appears to be a *description* of a flaw in how costs are tallied, even by those who might not intend to follow Precaution.
  *   **Verdict:** This is the *justification*, not the *mechanism*.

  **3. Status Quo Bias**
  *   **The Concept:** A preference for the current state of affairs; any change from that baseline is perceived as a loss.
  *   **Where it fits:** It explains why leaving things be "does not count as a decision."
  *   **Where it fails:** It is too broad. Status Quo Bias applies to choosing a brand of jam or a pension plan. It does not inherently contain the *risk accounting* asymmetry you describe. One can have a status quo bias without necessarily ignoring the risks of the status quo in a regulatory ledger.
  *   **Verdict:** This is the *context*, not the *error*.

  **4. Risk-Risk Trade-off Neglect**
  *   **The Concept:** The failure to consider that a regulation designed to reduce one risk may introduce or exacerbate another (e.g., banning a pesticide leads to lower crop yields and increased hunger).
  *   **Where it fits:** It addresses your third point: the cost of the safeguard is booked, but the harm it averts is not.
  *   **Where it fails:** This is usually a subset of a larger problem. It explains why the safeguard is costly, but not why the *baseline* risk (the reason for the safeguard) was ignored in the first place.
  *   **Verdict:** This is a *symptom* of the larger pattern.

  ### II. The Philosophical Carving

  Your friends are half-right. Omission Bias is the psychological engine; the Precautionary Principle is the legal shield. But the pattern you have isolated is the *structural manifestation* of these forces within a regulatory bureaucracy. It is a specific error in **ontological accounting**.

  In decision theory, we distinguish between *events* and *interventions*. Your pattern reveals a system that treats the baseline (the world as it is) as 'nature' and the intervention (the world as changed by man) as 'policy'. Nature is not audited; Policy is.

  There is no single, universally agreed-upon term in the academic literature that captures this specific *accounting asymmetry regarding known risks*. Scholars like Cass Sunstein have discussed "Omission Neglect" in cost-benefit analysis, and others refer to "Type I/II Error Asymmetry" in statistics. However, these are technical descriptions, not a unified concept for the phenomenon you describe.

  Therefore, to give your character the precision she demands, I propose we coin a term that bridges the psychological and the bureaucratic.

  **The Term:** **Baseline Risk Immunity**

  **Definition:**
  *Baseline Risk Immunity* is a systemic bias in regulatory decision-making wherein risks inherent to the status quo are treated as natural facts (and thus exempt from scrutiny), while risks introduced by intervention are treated as moral or administrative liabilities (and thus subject to full accounting), regardless of the comparative magnitude or certainty of the harms.

  **Why this term?**
  *   **Baseline:** Refers to the 'way things are' (the marsh undrained, the drug unapproved).
  *   **Risk:** Acknowledges that harm is possible on both sides.
  *   **Immunity:** Captures the legalistic/procedural nature. The baseline is not just preferred; it is *immunised* from the ledger.

  **Boundary Cases (What it is not):**
  *   **It is not simple Conservatism:** A conservative might argue the status quo is *better*. Baseline Risk Immunity argues the status quo is *invisible*.
  *   **It is not Uncertainty Avoidance:** As you noted, this persists even when probabilities are known.
  *   **It is not Cost-Benefit Analysis:** Proper Cost-Benefit Analysis attempts to correct for this by counting both sides. Baseline Risk Immunity is the *corruption* of that analysis.

  **A Resembling Case that is Not It:**
  Consider a company deciding whether to upgrade old machinery.
  *   *Baseline Risk Immunity:* The safety officer counts the cost of the new machine and the risk of it malfunctioning, but records zero cost for the accidents caused by the old machine, because "that's just how the old machine works."
  *   *Not Baseline Risk Immunity:* The safety officer counts the accidents of the old machine and the cost of the new machine, but decides the new machine is too expensive. That is simply a budget constraint. The immunity lies in the *refusal to count* the old accidents as a cost of the decision to stay.

  ### III. Description vs. Prescription

  You asked to distinguish which concepts are descriptions and which are prescriptions. This is vital for your character's voice.

  *   **Omission Bias:** *Description.* It describes how human brains work.
  *   **The Precautionary Principle:** *Prescription.* It describes how regulators *ought* to act under uncertainty.
  *   **Baseline Risk Immunity:** *Description (of a systemic flaw).* It describes how the regulatory ledger is currently drawn, often inadvertently.

  Your character is noticing a *descriptive* flaw in a system that often claims to be *prescriptive*. She is seeing that the system claims to balance risks, but its scales are built with a fixed weight on one side.

  ### IV. Is the Asymmetry Defensible? (The Villain Question)

  You asked whether this asymmetry is ever defensible, specifically citing irreversibility or option value. This determines whether your character is a villain, a hero, or a tragic figure.

  The asymmetry is **defensible**, but only under specific conditions.

  1.  **Irreversibility (Hysteresis):** If an action cannot be undone (e.g., releasing a self-replicating organism, draining a unique wetland), while inaction can be reversed later (e.g., approving the drug next year), then treating the action as riskier is rational. The 'cost' of acting includes the loss of the option to return to the start.
  2.  **Epistemic Humility:** Even if we think we know the probabilities, history shows we are often wrong about novel interventions. The status quo has 'survived' this long; the intervention is untested in the wild. A 'tax' on intervention is a fee for this testing.
  3.  **Power Asymmetry:** Often, the party proposing the action (a corporation) has more resources and information than the party bearing the risk (the public). The asymmetry acts as a counter-weight to the proposer's advantage.

  **However, it becomes indefensible (and your character potentially villainous) when:**
  1.  **The Status Quo is Volatile:** If leaving the marsh alone guarantees it will be poisoned by an upstream factory next month, 'inaction' is actually a high-risk active choice. Treating it as 'null' is a delusion.
  2.  **Reversibility is Equal:** If the drug can be withdrawn as easily as it is approved, the asymmetry is pure bureaucracy.
  3.  **The 'Null' Action is Lethal:** If the 'do nothing' option kills people (e.g., delaying a vaccine), and those deaths are not 'booked', the regulator is prioritising clean hands over saved lives.

  **Verdict for your Novel:**
  Your character is not necessarily a villain. She is likely a **guardian of procedural integrity** who has realised the procedure itself is biased. If she names this pattern, she is exposing a structural flaw, not necessarily a moral evil. The 'villain' is the inertia of the system that treats the baseline as nature rather than as a prior decision.

  ### V. Summary for the Scene

  If I were writing the line for your regulator, having sorted the concept as above, I would have her reject her friends' terms because they are too soft. Omission Bias is about feelings; Precaution is about ignorance. She is talking about *accounting*.

  She might say:

  > "It isn't the Precautionary Principle. That's for when we don't know the numbers. We know the numbers. And it isn't Omission Bias; that's about guilt. This isn't about guilt. It's about the ledger. We treat the baseline as if it were nature, rather than a prior decision. We grant **Baseline Risk Immunity** to the status quo. We audit the intervention, but we never audit the world we're leaving behind."

  This gives her the authority of someone who sees the machinery behind the curtain, distinguishing the *accounting error* from the *moral hesitation*.
