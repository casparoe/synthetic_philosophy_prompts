prompt: |-
  I am trying to understand a passage about Otto Neurath's picture language. The passage reports that the Vienna Method adopted the slogan 'To remember simplified pictures is better than to forget accurate figures,' and that Neurath called the resulting system a 'language-like technique' rather than a full language; the system is also described as a 'helping language' that must always be accompanied by verbal elements. Help me understand what Neurath is claiming here and why. How can deliberate simplification be an epistemic virtue in a project meant to be scientific and exact? What is the point of denying that the picture language is a language while still treating it as a medium of objective communication? And does the 'helping language' status undermine the ambition to provide a universal language for unified science, or is that ambition simply not what the picture language is for? I want a reconstruction of the argument and an assessment of whether its tensions can be resolved, not a general survey of Isotype.
