      *   *Average View:* The math is $\lim_{n \to \infty} \frac{\sum_{i=1}^{n} w_i}{n}$.
          *   For A: $n \times 1 / n = 1$.
          *   For B: $(n \times 1 + 1) / (n+1) \to 1$.
          *   For C: $(n \times 1 - 1000) / (n+1) \to 1$.
          *   *Mechanism:* The finite addition becomes negligible as the denominator grows without bound. The "marginal impact" vanishes in the limit.
      *   *Conclusion:* It's a interaction between the ethical principle (aggregation) and the mathematical structure (standard analysis). Standard math lacks the resolution to see finite changes against an infinite background.

