answer: |-
  This is one of the most intellectually honest stalemates in the history of ideas. You are right to sense that the empirical surface is a distraction. If this were a standard scientific dispute, the signal-to-noise ratio would have improved over 150 years. Instead, the noise has remained constant, and the signal remains ambiguous.

  Here is a diagnosis of the disagreement, the role of Sidgwick, and what would actually be required to break the freeze.

  ### 1. The Diagnosis: Observational Equivalence
  The core problem is not a lack of data, but **underdetermination**. In philosophy of science, this occurs when the available evidence is insufficient to determine which belief or theory is correct.

  In this specific case, you have a problem of **Observational Equivalence**.
  *   **Hypothesis A (Survival):** A discarnate consciousness retains memory and agency and transmits information to a medium.
  *   **Hypothesis B (Super-Psi):** A living consciousness (the medium) accesses information via unknown means (telepathy/clairvoyance) and constructs a persona to transmit it.

  If you grant the premise of "psi" (anomalous cognition) to the skeptics—as they often do rhetorically to block the survival claim—then Hypothesis A and Hypothesis B become functionally identical from the perspective of an observer. Both require a mechanism by which information bypasses normal sensory channels. Both require a mechanism by which personality or memory persists or is reconstructed.

  The "Super-Psi" move is not just a skeptical counter-argument; it is a **structural shield**. It concedes the *phenomena* (the accurate information) to deny the *ontology* (the dead person). Because the "living mind" is the instrument of measurement in every séance, you cannot isolate the variable. You are trying to use the mind to test the limits of the mind. As long as the medium is alive, Super-Psi is logically available.

  Therefore, this is not an empirical dispute. It is a dispute over **Ontological Economy** (parsimony).

  ### 2. The Battle of Priors: Which Miracle is Cheaper?
  Since the data cannot decide, the decision rests entirely on priors. The stalemate persists because the two sides are optimizing for different kinds of simplicity.

  *   **The Survivalist Prior:** It is simpler to assume that consciousness continues as it appears to do (continuity) than to assume the living brain has god-like, unbounded access to all information in the universe (Super-Psi). To the survivalist, Super-Psi attributes *more* magical power to the living brain than the spiritualist hypothesis attributes to the dead.
  *   **The Skeptic Prior:** It is simpler to assume that the anomaly resides in the living brain (which we know exists) than to postulate a whole new ontological realm (the afterlife) and a mechanism for interaction between realms. To the skeptic, Survival multiplies entities (souls, spirit world) whereas Super-Psi, however wild, keeps everything within the natural world.

  The disagreement is about **where you are willing to locate the miracle**.
  *   Survivalists say: "The miracle is that death isn't the end."
  *   Skeptics say: "The miracle is that the brain isn't bound by space-time."

  Neither side can win because "simplicity" is subjective here. It depends on whether you view "matter" or "consciousness" as the fundamental substrate of reality. If you are a materialist, Super-Psi is less costly than Survival. If you are an idealist (or dualist), Survival is less costly than Super-Psi.

  ### 3. Sidgwick's Ethical Wager
  Your hunch about Sidgwick is correct and crucial. For Sidgwick, psychical research was not a hobby; it was a rescue mission for his moral philosophy.

  In *The Methods of Ethics*, Sidgwick identifies a "dualism of practical reason." Rational self-interest and rational benevolence (duty) do not always align. Sometimes, doing the right thing ruins your life. In a purely materialist universe, this makes ethics tragic or irrational. Why be good if it leads to misery?

  Sidgwick needed **Cosmic Justice**. He needed a universe where virtue is ultimately rewarded and vice punished. But without God (which he struggled to believe in) and without Survival (which makes judgment possible), he couldn't secure this.

  The SPR was an attempt to find an empirical foothold for a moral necessity. He wasn't just asking, "Do we survive?" He was asking, "Is the universe moral?"
  *   **If Survival is true:** The dualism can be resolved in the long run (after death). Ethics is rational.
  *   **If Survival is false:** The dualism stands. Ethics is potentially irrational.

  This explains the freeze. The stakes were never just about ghosts; they were about whether the universe makes moral sense. That is why the skeptics cannot concede even an inch: to concede Survival is to concede that Materialism cannot account for Meaning. And why Survivalists cannot concede: to concede Super-Psi is to admit the universe might be morally indifferent.

  ### 4. What Would Move It?
  You asked for honesty about what would resolve this.
  **A better experiment will not help.** As long as the experiment involves a living human observer or medium, Super-Psi remains a valid logical alternative. You cannot build a "psi-proof" room if psi is defined as unbounded.

  **What would move it is a Third Party Breakthrough.**
  The debate is frozen because it is happening in a vacuum between metaphysics and parapsychology. It requires a revolution in **Neuroscience** or **Physics**.
  *   **Scenario A:** Neuroscience proves consciousness is strictly emergent and localized (e.g., we map every qualia to a neural firing pattern). Survival becomes impossible; Super-Psi becomes the only explanation for anomalies (or fraud).
  *   **Scenario B:** Physics/Consciousness studies prove consciousness is fundamental and non-local (e.g., Panpsychism or Idealism is proven). Survival becomes the default state; Super-Psi becomes redundant.

  Until the "Hard Problem of Consciousness" is solved, the Survival Debate is a proxy war for that larger mystery.

  ### 5. The Cost of Resolution (What each side must give up)
  For your piece to end somewhere real, you need to outline the surrender required for peace.

  **For the Survivalists to Win (or for Skeptics to concede):**
  *   **The Surrender:** Skeptics must admit that **Super-Psi is more extravagant than Survival.** They have to accept that attributing omniscience to the living brain is a bigger violation of known biology than postulating the persistence of consciousness. They must abandon the materialist prior that "brain death = mind death" as a default axiom.
  *   **The Cost:** This collapses the boundary between psychology and religion. It validates the spiritual intuition that matter is not the primary reality.

  **For the Skeptics to Win (or for Survivalists to concede):**
  *   **The Surrender:** Survivalists must admit that **Anomalies are not Evidence of Agency.** Just because a medium knows a secret doesn't mean a *person* told them. They must accept that "information" might float free of "identity."
  *   **The Cost:** This kills the comfort of the afterlife. You might have "survival" of information, but not *you*. It validates Sidgwick's fear: the universe may be strange, but it is not necessarily moral or personal.

  **For the Debate to Dissolve (The Third Way):**
  *   **The Surrender:** Both sides must admit the question **"Does consciousness survive death?" is a category error.**
  *   **The Cost:** This requires accepting that "consciousness" and "death" are concepts that may not apply to the underlying reality. If time is an illusion (as some physics suggests), "surviving" time is meaningless. If the self is an illusion (as Buddhism suggests), there is no one to survive.

  ### Summary for your Piece
  The argument has frozen because it is **not about the dead.** It is a conflict between two incompatible maps of reality held by the living.
  *   **The Super-Psi hypothesis** is a rhetorical device used to protect Materialism from having to admit the possibility of Spirit.
  *   **The Survival hypothesis** is a psychological necessity used to protect Ethics from having to admit the possibility of Futility.

  Sidgwick hoped evidence would solve an ethical problem. It hasn't, because the evidence is underdetermined. The stalemate will not break with a better séance, but only when we understand what the mind *is*. Until then, the SPR debate remains a mirror: the skeptics see a brain that won't admit its limits; the believers see a soul that won't admit its vulnerability.

  **The Verdict:** The question is ill-posed for the current tools of inquiry. It is a metaphysical dispute wearing the clothes of an empirical one. To end the piece, suggest that the value of the SPR isn't that they answered the question, but that they forced us to realize how little we know about the thing doing the asking.
