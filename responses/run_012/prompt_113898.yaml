      *   *Is it about priors?* Yes, heavily. Humean skepticism vs. Openness to anomaly.
      *   *Is it Sidgwick's ethical project?* Plausible. Sidgwick was troubled by the "dualism of practical reason" (self-interest vs. universal good). Survival + Divine Justice could resolve this.

  4.  **Formulate the Diagnosis:**
      *   **Core Diagnosis:** This is a **Underdetermination of Theory by Data** problem, exacerbated by **Competing Metaphysical Frameworks**. It's not just priors; it's about *explanatory scope* vs. *ontological economy*.
      *   **The Super-Psi Trap:** Super-psi isn't just a skeptical counter-claim; it's a *structural equivalence*. If the living mind can access all information (omniscient psi), it is functionally indistinguishable from a dead mind communicating.
