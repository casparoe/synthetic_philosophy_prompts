  Ok so I just spent like two and a half hours arguing with my friend Dan about negative utilitarianism, and now I need someone to help me actually read the passage we were fighting about, because I'm pretty sure we were just shouting past each other the whole time.

  His position, which he is extremely pleased with himself about, is what he calls "lexical threshold negative utilitarianism." Roughly: suffering is the only thing that counts as a disvalue in its own right, and above some severity level, pain can't be traded off against pleasure at all — no amount of mild pleasure, spread over however many people for however long, can buy out a certain kind of agony. He says "lexical" the way a dictionary is: you don't get to the P's till you've finished the N's. I said fine, but then you've stopped doing utilitarianism, because the entire point of a utilitarian calculus is that you can weigh the one against the other. He said nope, Bentham is on my side, and then made me read this out of chapter 4 of the Principles of Morals and Legislation (the 1789 one):

  "II. To a person considered by himself, the value of a pleasure or pain considered by itself, will be greater or less, according to the four following circumstances: 1. Its intensity. 2. Its duration. 3. Its certainty or uncertainty. 4. Its propinquity or remoteness. ... IV. To a number of persons, with reference to each of whom to the value of a pleasure or a pain is considered, it will be greater or less, according to seven circumstances: to wit, the six preceding ones ... And one other; to wit: 7. Its extent; that is, the number of persons to whom it extends; or (in other words) who are affected by it. V. To take an exact account then of the general tendency of any act, by which the interests of a community are affected, proceed as follows. Begin with any one person of those whose interests seem most immediately to be affected by it: and take an account, 1. Of the value of each distinguishable pleasure which appears to be produced by it in the first instance. 2. Of the value of each pain which appears to be produced by it in the first instance. ... 5. Sum up all the values of all the pleasures on the one side, and those of all the pains on the other. The balance, if it be on the side of pleasure, will give the good tendency of the act upon the whole, with respect to the interests of that individual person; if on the side of pain, the bad tendency of it upon the whole. 6. Take an account of the number of persons whose interests appear to be concerned; and repeat the above process with respect to each. ... VI. It is not to be expected that this process should be strictly pursued previously to every moral judgment, or to every legislative or judicial operation. It may, however, be always kept in view"

  I've read it like four times and I still can't tell who's right about it. What I actually want from you:

  - A plain-English walkthrough of what Bentham is doing in this chapter. Is he stating a criterion of rightness, describing a decision procedure, or just defining a way of measuring value? And does "sum up all the values of all the pleasures on the one side, and those of all the pains on the other" commit him to a single common unit, i.e. to pleasures and pains being comensurable at some fixed exchange rate? Or could you accept everything in the passage and still insist that pains and pleasures aren't commensurable at all?
  - Could you graft Dan's lexical threshold onto this without contradicting anything in the text? Same seven dimensions, but the aggregation at step 5 goes lexicographic instead of additive — some pains get priority no matter how the sums come out. Does the passage rule that out, or is it just silent about it?
  - What is "extent" doing in step 6, and does summing over persons smuggle in an assumption that one person's intensity of pleasure is comparable to another person's pain on the same scale?
  - Why "distinguishable" in step 1 — each *distinguishable* pleasure? Is that doing real work?
  - And that last line I quoted about the process not being "strictly pursued" beforehand — is that a genuine concession that the whole thing is a rough idealization, or just a remark about practical feasibility?

  If Dan is straightforwardly misreading, tell me where, and then tell me what the strongest version of his position looks like once it has to survive contact with this passage.
