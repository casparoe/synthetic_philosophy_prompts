answer: |-
  You have put your finger on a specific mechanism of historical error that is often gestured at but rarely named with precision. You are right to feel that "silence" and "bias" are insufficient. Silence implies nothing is there; bias implies a slant on what is there. You are describing a **substitution** that hardens into fact.

  There is no single, universally agreed-upon noun for this exact phenomenon, but there is a conceptual cluster in historical epistemology and archival theory that covers it. The most precise existing term for the *process* is **Reification** (specifically, the **Reification of Administrative Categories**). The most precise term for the *result* is a **Truth-Effect** (*effet de vérité*).

  Here is how to map the concept, distinguish it from its neighbors, and define it for your thesis.

  ### 1. The Name: Archival Reification
  **Reification** (from *res*, thing) is the philosophical error of treating an abstract concept, relationship, or social construct as if it were a concrete, natural thing.

  In your case:
  *   **The Reality:** A complex human situation (grief, abandonment).
  *   **The Abstraction:** A bureaucratic category ("Intemperance," "Destitution").
  *   **The Reification:** The historian treats the category as the reality.

  When you add the archival dimension, it becomes **Archival Reification**. This occurs when an administrative label, created for bureaucratic convenience (sorting, funding, bed allocation), survives the destruction of the context that created it, and is subsequently read by historians as an empirical datum rather than an administrative artifact.

  ### 2. The Nearest Neighbors (and why they aren't it)

  **Archival Silence (Trouillot/Derrida)**
  *   **What it is:** What was never written down, or what was destroyed. The gap in the record.
  *   **Why it's not this:** Silence is an *absence*. You are dealing with a *presence*. The danger of silence is that we don't know; the danger of reification is that we think we *do* know. Silence invites speculation; reification shuts it down by offering a false answer.

  **Bias / Unreliability**
  *   **What it is:** A source leans in a direction (e.g., a newspaper favoring one party) or contains errors we can identify.
  *   **Why it's not this:** Bias implies a distortion of a signal. You are describing a **conversion of the signal**. If a scale is biased, it says 150lbs when you weigh 140lbs. In your case, the scale measures weight, but the clerk writes down "Blue." Later historians don't think "this is a biased weight"; they think "this is a record of color." It is not a distortion of data; it is a **category error** that has ossified.

  **Foucault (Power/Knowledge)**
  *   **What it is:** How systems of power create the conditions for what can be known (discursive formations).
  *   **Why it's not this:** Your colleagues are half-right, but missing the mechanic. Foucault explains *why the eleven boxes existed* in the first place (the discursive formation of psychiatry/poverty). He explains the *conditions of possibility*.
  *   **The Difference:** You are not analyzing the power structure that created the form; you are analyzing the **data corruption** that occurred when life was forced into the form, and how that corruption *persisted* as truth after the power structure vanished. Foucault is about the system; you are about the specific **artifact of error** that the system left behind.

  **The "Truth-Effect" (Stoler/Foucault)**
  *   **What it is:** The way archives produce an aura of certainty.
  *   **The Connection:** This is your strongest theoretical neighbor. Ann Laura Stoler (in *Along the Archival Grain*) argues that we shouldn't read "against the grain" to find the truth, but "along the grain" to see how the archive *produced* certainty.
  *   **The Refinement:** Your observation is a specific subtype of truth-effect: **The Bureaucratic Truth-Effect.** It is where the *need for a tick-box* generates a fact that overrides the *need for accuracy*.

  ### 3. A Usable Definition for Your Thesis

  Since there isn't one perfect word, you can define the concept operationally. I suggest calling it **"Administrative Reification"** or **"Bureaucratic Conversion."**

  **Definition:**
  > **Administrative Reification** occurs when an archival record preserves a bureaucratic classification (e.g., a checked box, a coded entry) while losing the contextual evidence that explains *why* that classification was chosen. Over time, the classification is misidentified by researchers as an empirical fact about the subject, rather than an artifact of the recording system.

  **The Edges (Inside vs. Outside):**

  *   **Inside the Concept:**
      *   **Forced Choice:** The recorder had to pick a slot that didn't fit (the 11 boxes).
      *   **Context Loss:** The interview/notes that justified the choice are gone.
      *   **Fact Hardening:** Later users treat the slot as a description of reality (e.g., citing "destitution" as proof of poverty).
      *   **Benign Intent:** The clerk need not be lying; they are just filling a form.

  *   **Outside the Concept:**
      *   **Active Fraud:** If the clerk knowingly lied to harm the patient, that is falsification, not reification.
      *   **Known Bias:** If historians acknowledge the categories are flawed and adjust for them, the reification is broken.
      *   **Silence:** If the page is blank, that is archival silence.
      *   **Accurate Data:** If the box actually matched the reality, it's just data.

  ### 4. Why the Word Matters

  You are right that the word matters because it changes your thesis from "The archive is incomplete" (which is a truism) to "The archive is **generatively misleading**."

  If you call this **Administrative Reification**, your thesis argument shifts:
  *   **Old Argument:** "We cannot know the true rates of poverty because records are missing."
  *   **New Argument:** "The published rates of poverty are not just incomplete; they are **artifacts of the intake form**. The archive did not fail to record the truth; it actively **produced a false truth** that has been cited as fact for a century."

  This moves you from apologizing for the archive's limits to critiquing the archive's **output**. You aren't just finding gaps; you are finding **positive errors**.

  ### 5. Summary for Your Methodology

  When you write this up, you can position yourself against the "Silence" paradigm.
  *   **Silence Paradigm:** "We must listen for what isn't said."
  *   **Your Paradigm:** "We must distrust what *is* said when it is the product of a forced-choice mechanism."

  You are describing a **Positive Archival Distortion**. It is distinct from bias because it is structural, not personal. It is distinct from silence because it is present, not absent. It is distinct from Foucault because it is about the *persistence of the error*, not just the *power of the system*.

  **Recommendation:** Use **Reification of Administrative Categories**. It is academically robust, clearly distinguishes the process (turning a category into a thing), and allows you to argue that the "facts" in the ledger are not observations of the patients, but observations of the **bureaucracy's needs**. The circle doesn't tell you about the woman; it tells you about the form. That is your thesis.
