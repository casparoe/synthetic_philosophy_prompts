      *   *Is it fatal?* Philosophers debate this. Some say it kills act utilitarianism. Others say it forces a shift to *expected* value or *rules*.
      *   *The User's Friend's Analogy:* "Not knowing which card is on top vs. not knowing how many cards are in the deck." This highlights *structural uncertainty* (unknown unknowns), not just *parameter uncertainty* (known unknowns).

  3.  **Evaluate the Escape Hatches (as requested):**
      *   *Maximize Expected Value (EV):*
          *   *Pros:* Mathematically sound for engineers. Handles probability.
          *   *Cons:* Garbage in, garbage out. If the sample space is undefined (the "deck size" problem), you can't assign probabilities that sum to 1. EV collapses if the states of the world are undefined.
          *   *Verdict:* Helps with risk, doesn't solve structural ignorance.
      *   *Common-Sense Moral Rules (Deontology/Rule Utilitarianism):*
          *   *Pros:* Bypasses calculation. "Don't lie," "Help people."
          *   *Cons:* Where do rules come from? Usually past consequences. If long-term consequences are unknowable, the rules might be outdated. Also, rules conflict (Adtech pays more -> donate more vs. Adtech is manipulative).
