      *   *Nonprofit:* Direct good (usually), lower pay (less donating power), potential inefficiency.
      *   *Cluelessness Angle:* You don't know if the adtech money saves more lives via donations than the nonprofit work. You don't know if the adtech harm is negligible or catastrophic. You don't know if the nonprofit is actually effective.
      *   *Practical Implication:* If cluelessness is true, *neither* choice is objectively "better" based on consequences alone.

  5.  **Synthesize the "What Actually Follows" Section:**
      *   *Implication 1: Optimization is impossible.* Stop trying to find the *best* action. Look for *good enough* or *non-catastrophic* actions.
      *   *Implication 2: Proximity matters.* Short-term, local consequences are more knowable than long-term, global ones. (The "fog of war" gets thicker with distance).
      *   *Implication 3: Tractability > Importance.* A problem you can actually measure/solve is better than a huge problem you can't grasp.
      *   *Implication 4: Subjective Rightness.* If you can't know the objective outcome, morality shifts to "did you try reasonably hard?" (Subjective Utilitarianism).

