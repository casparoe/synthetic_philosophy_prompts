answer: |-
  ### 1. Correction of Your Understanding
  You have the intuition right, but the technical condition is slightly tighter: the theorem applies to any **deterministic** rule where **three or more candidates are eligible to win** (the rule's *range* has size $\ge$ 3), not merely that three outcomes occurred in one specific vote.

  ### 2. Materials & Setup
  **The Four Options (Write on Whiteboard):**
  *   **A:** Pizza Party (Catered)
  *   **B:** Movie Marathon (Projector needed)
  *   **C:** Debate Tournament (Inter-club)
  *   **D:** Community Service (Off-site)

  **The Stakes (Real & Non-Monetary):**
  *   **Top Choice Wins:** You choose the playlist for the final 15 minutes of today's session.
  *   **Bottom Choice Wins:** You must draft the first 100 words of next term's recruitment blurb (due Week 1).
  *   *Note:* This makes the preference order material. If D wins and it was your last choice, you have work to do.

  **The Cards (Prepare 4 Decks, one for each Round):**
  *   **Deck 1 (Plurality Trap):** 6 cards (A>B>C>D), 5 cards (B>C>D>A), 3 cards (C>B>D>A).
  *   **Deck 2 (Runoff Trap):** 5 cards (A>B>C>D), 4 cards (B>C>A>D), 5 cards (C>A>B>D).
  *   **Deck 3 (Borda Trap):** 7 cards (A>B>C>D), 7 cards (B>C>A>D).
  *   **Deck 4 (Dictator Setup):** Any mix.
  *   *Instruction:* Print or write these on index cards. Shuffle each deck separately.

  **Room Setup:**
  *   Whiteboard divided into four quadrants (one for each Option).
  *   A "Ballot Box" (a backpack or hat).

  ### 3. Minute-by-Minute Plan (50 Minutes)

  **0:00 – 0:05: Stakes & Deal**
  *   Announce the four options and the stakes (Music vs. Recruitment Blurb).
  *   Hand out **Deck 1** cards randomly. Tell them: "This is your true preference. Do not show anyone."
  *   **Rule:** Plurality (One vote per person, most votes wins).
  *   **Instruction:** "Vote honestly for your #1."

  **0:05 – 0:15: Round 1 (The Trap)**
  *   Collect and count ballots live on the board.
  *   *Expected Result:* A=6, B=5, C=3. **A Wins.**
  *   **The Reveal:** Ask the B-group (5 students): "A was your 3rd choice. If you had all voted for C instead, C would have 8 votes and beaten A. C is your 2nd choice. Would you prefer that?"
  *   They will say yes.
  *   **Point:** "Under this rule, honesty hurt you."

  **0:15 – 0:30: Repair Phase (The Whac-A-Mole)**
  *   Ask: "How do we fix the rule so honesty is always best?"
  *   *Likely Suggestion 1:* "Runoff Vote (Top 2 go to second round)."
      *   Swap cards for **Deck 2**.
      *   Run the vote. *Result:* A (5) and C (5) go to runoff. B (4) is eliminated. In runoff, B-voters prefer C over A. C wins.
      *   *The Break:* Ask the A-group: "You lost. If two of you had strategically voted for B in round 1, B would have eliminated C, and you might have beaten B." (Or simply note that they can manipulate the runoff pairing).
  *   *Likely Suggestion 2:* "Borda Count (Points for ranking)."
      *   Swap cards for **Deck 3**.
      *   Run the vote.
      *   *The Break:* Show how ranking a strong rival last (burying) changes the score more than voting honestly.
  *   **Stop Condition:** When they stop offering rules or time hits 0:30. Say: "Every time we patch a hole, a new one opens."

  **0:30 – 0:40: Escape Hatches (Range & Ties)**
  *   Ask: "Is there any way to make the rule safe?"
  *   Guide them to: "Remove an option." (e.g., "No Community Service").
      *   **Action:** Cross out Option D on the board.
      *   **Check:** Ask if anyone had D as their #1. If yes, highlight that the "safe" rule silenced their top choice.
      *   **Theorem Link:** This reduces the *range* to <3. The theorem no longer applies.
  *   Guide them to: "Allow Ties."
      *   **Action:** Say "If it's close, we tie."
      *   **Check:** "Who decides the tie?" If you vote on the tie, that's a new voting round (back to square one). If the Chair decides, the Chair is a dictator.

  **0:40 – 0:45: The Dictator**
  *   Ask: "What is the only rule where no one can ever benefit from lying?"
  *   Answer: "One person decides."
  *   **Action:** Pick one student (volunteer or random). Collect all cards. Hand them to the student. "You decide. Your #1 wins."
  *   Run it. Let the room sit with the silence of the other 13 students having no power.

  **0:45 – 0:50: Debrief & Name Drop**
  *   **Poll:** "In Round 1, who knew they could manipulate *before* you voted?" (Likely none). "Who knows *now*?" (All).
  *   **Distinction:** "Strategy-proofness means you don't need to know others' votes to know honesty is safe. We only found the manipulation *ex-post* (after the poll). The theorem says *ex-ante* safety is impossible."
  *   **Name:** "This is the Gibbard–Satterthwaite Theorem."
  *   **Whiteboard:** Draw the minimal case (see Section 7).

  ### 4. Debrief Mapping (For Your Notes)

  1.  **Honest Round:** Maps to **Manipulability**. Shows that under Plurality, a coalition (or individual in larger N) has an incentive to misrepresent preferences.
  2.  **Repair Phase:** Maps to **Universality**. It doesn't matter if you use Plurality, Runoff, or Borda; if it meets the criteria, it breaks.
  3.  **Escape Hatches:** Maps to **Range Condition**. Removing Option D shrinks the range to 3 (or 2). If the rule *cannot* elect D, the theorem's condition "range $\ge$ 3" is violated. Ties introduce indeterminacy (not a function) or a meta-rule (which is also manipulable).
  4.  **Dictator:** Maps to **Non-Dictatorship**. This is the only strategy-proof rule, but it violates the democratic constraint.
  5.  **Poll/Distinction:** Maps to **Ex-ante vs. Ex-post**. The theorem claims there is *no* rule where honesty is a dominant strategy (best regardless of others' votes). Your Round 1 showed manipulation was possible *given the profile*, not that it was obvious *before* voting.

  ### 5. Troubleshooting: What Will Go Wrong

  **1. The Moral Objector**
  *   *Scenario:* A student refuses to vote strategically in Round 1 even when you explain it helps them. "Lying is wrong."
  *   *Fix:* Validate them. "You are acting ethically. The theorem doesn't say you *must* lie; it says the *rule invites* lying. If you stay honest while others lie, you lose. The theorem is about the *incentive structure*, not moral obligation."

  **2. The "Tricked" Student**
  *   *Scenario:* A student realizes the decks were stacked and feels the exercise was fake.
  *   *Fix:* "The math is real, the cards are just a simulation. In real elections, parties spend millions to find these exact profiles so they can advise voters how to strategize. I saved you the millions; the incentive is the same."

  **3. Time Creep in Counting**
  *   *Scenario:* Counting Borda scores takes too long.
  *   *Fix:* Do the math yourself on the board as you collect ballots. "This is an A, so 3 points for A...". Keep the pace brisk. If you run out of time, skip the Borda round and move straight to Escape Hatches.

  **4. Confusion on "Range"**
  *   *Scenario:* They think removing Option D is just "narrowing the choice."
  *   *Fix:* Be explicit. "If the rule says 'D cannot win' before votes are cast, D is not an option. The theorem requires 3 *eligible* winners. If you ban one, you escape the theorem, but you also banish the students who love that option."

  ### 6. Limitations: What This Activity Cannot Show
  You are correct to be wary. This activity demonstrates that **specific rules** (Plurality, Runoff, Borda) are manipulable. It does **not** prove that **all** rules are manipulable.

  *   **What you must supply:** In the last 10 minutes, you must state: "We tried three rules and they all failed. You might think there's a fourth rule we didn't try that works. Gibbard and Satterthwaite proved mathematically that *no such rule exists*. We felt the frustration; they proved the inevitability."
  *   **Why:** You cannot demonstrate a universal negative empirically. You can only show repeated failures. The proof (which you won't do) is what closes the gap between "these rules failed" and "all rules fail."

  ### 7. The Whiteboard Minimal Case
  **Is 2 Voters / 3 Options the smallest case?**
  Yes. The theorem holds for $N \ge 2$ voters and $|A| \ge 3$ alternatives.
  **How to present it in 2 minutes:**
  Draw this on the board at the very end:

  *   **Voters:** 1, 2
  *   **Options:** A, B, C
  *   **Rule:** "If both agree, that wins. If they disagree, C wins."
      *   *Voter 1 wants A.* Knows Voter 2 wants B.
      *   *Honest:* 1 votes A, 2 votes B -> **C wins** (Voter 1's last choice).
      *   *Strategic:* Voter 1 votes B. 1 votes B, 2 votes B -> **B wins** (Voter 1's 2nd choice).
      *   *Result:* Voter 1 gained by lying.
  *   **Say:** "With just two of us and three choices, any rule that isn't a dictatorship forces one of us to calculate how the other votes. That calculation is the theorem."

  ### 8. A Note on Dealt Preferences
  Do **not** switch to natural preferences.
  *   **Reason:** Natural preferences in a small club often align (e.g., everyone wants Pizza). If preferences align, manipulation is unnecessary. G-S is about *conflict*. Dealt cards guarantee the conflict structure (cycles, spoilers) required to make the theorem visible.
  *   **Mitigation:** Ensure the stakes (Music/Blurb) are genuinely desirable/undesirable so the dealt preferences feel "real" enough to care about the outcome.
