answer: |-
  Here is the spec. I've distilled your cases into seven functional requirements. I've tagged them as **Non-Negotiable** (if a theory fails this, it doesn't feel like "promising" to most people) or **Camp Preference** (where philosophers legitimately split).

  ### The Desiderata List

  **1. The "No-Contact" Normativity**
  *   **The Case:** Two people forget the promise; no reliance, no harm, nothing rides on it.
  *   **The Requirement:** An account must explain why breaking the promise is still a normative failure (a wrong), even if the "transaction" has zero social or economic friction. It cannot rely solely on disappointment or damage.
  *   **Status:** **Non-Negotiable.** (If it only binds when it hurts to break, it's prudence, not promising.)

  **2. The Unilateral Dissolution**
  *   **The Case:** The Release (Promisee says "forget it," even if they privately resent it).
  *   **The Requirement:** The account must grant the promisee the exclusive authority to dissolve the obligation. The promisor cannot unilaterally exit, but the promisee can cancel the debt even if the promisor is willing to pay.
  *   **Status:** **Non-Negotiable.** (This distinguishes a promise from a vow or a law.)

  **3. The Agency Boundary**
  *   **The Case:** The Borrowed Voice (Parent for kid, Spokesperson for company, Chatbot for firm).
  *   **The Requirement:** The account must define the conditions under which Agent A can bind Principal B. It must distinguish between *authorization* (I speak for them) and *usurpation* (I speak over them), and handle non-human agents (chatbots/systems) without anthropomorphizing them.
  *   **Status:** **Non-Negotiable.** (Critical for your corporate/institutional reporting.)

  **4. The Anti-Literalism Clause**
  *   **The Case:** Harmful Compliance (You keep the letter of the promise but leave the promisee worse off).
  *   **The Requirement:** The obligation must attach to the *intent* or *point* of the promise, not just the semantic content. If the context shifts such that keeping the word violates the spirit to the promisee's detriment, the obligation should shift or dissolve.
  *   **Status:** **Non-Negotiable.** (Otherwise, promising becomes a weapon.)

  **5. The Aggregation Test**
  *   **The Case:** The Committee (Five promisees; three release you, two don't).
  *   **The Requirement:** The account must specify the unit of the "promisee." Is the obligation owed to the *individuals* or the *collective*? It must provide a rule for fractional release.
  *   **Status:** **Camp Preference.** (Some theories say obligations are indivisible; others say they split pro-rata.)

  **6. The Superseding Duty**
  *   **The Case:** Illegality/Immorality (Content becomes illegal or wrong).
  *   **The Requirement:** The account must have a "circuit breaker." It must explain why a promise loses force when it conflicts with a higher-order moral or legal duty, without rendering all promises conditional and therefore weak.
  *   **Status:** **Non-Negotiable.** (No one thinks you must keep a promise to commit a crime.)

  **7. The Survivability Condition**
  *   **The Case:** Death of the Promisee.
  *   **The Requirement:** The account must state whether the obligation survives the recipient. If it does, it must identify *who* holds the right of release (estate? heir? no one?).
  *   **Status:** **Camp Preference.** (Some argue obligations are purely relational and die with the relation; others argue they become debts to memory or history.)

  ***

  ### The Impossible Pair

  **The "No-Contact" Normativity** vs. **The Unilateral Dissolution**

  This is the structural fault line.
  *   **Requirement 1** implies the obligation is a freestanding moral fact created by the promisor. It exists independently of the promisee's current mental state (since they forgot it).
  *   **Requirement 2** implies the obligation is the *property* of the promisee. They can delete it at will.

  **The Tension:** If the obligation is a freestanding moral fact (Req 1), why does the promisee's whim erase it? I created the bond; why can you dissolve it? But if the obligation is your property (Req 2), why does it bind me when *you* have forgotten you own it (Req 1)?
  Most theories solve this by privileging one side: either the promise creates a "right" in the promisee (making Release easy, but Forgotten Promises hard to explain), or it creates a "duty" in the promisor (making Forgotten Promises easy, but Release hard to explain). A theory that satisfies both perfectly has to perform magic.

  ***

  ### The Killer Constraint

  **The "No-Contact" Normativity (Requirement 1)**

  This is the requirement that does the most damage. It immediately knocks out **Expectation/Harm-based accounts** (Utilitarian and Reliance theories).
  If a promise is only binding because it creates expectations or prevents harm, then the "Forgotten Promise" case creates no obligation. There is no harm, no disappointment, no reliance. Yet, intuitively, we feel a residue of wrongness in breaking it. Any theory that says "no harm, no foul" fails to capture the deontic "stickiness" of a promise. This requirement forces a theory to be non-consequentialist, which eliminates the most common frameworks used in law and economics.

  ***

  ### Theory Scorecard

  **The Practice/Convention View (e.g., Rawls)**
  *   **Verdict:** Strong on structure, weak on novelty.
  *   **Performance:** Handles the **Forgotten Promise** well (you broke the rule of the game). Struggles with **Borrowed Voice** (chatbots/corporate speak aren't always part of the established "practice") and **Harmful Compliance** (rule-following can become rigid).

  **The Expectations-or-Harm View (e.g., Utilitarian/Reliance)**
  *   **Verdict:** Dead on arrival for your purposes.
  *   **Performance:** Fails the **Forgotten Promise** immediately. If nobody relied and nobody knew, there is no obligation. Great for contract law, terrible for moral reporting.

  **The Will/Power View (e.g., Kantian/Individualist)**
  *   **Verdict:** Strong on agency, weak on proxies.
  *   **Performance:** Excellent on **Unilateral Dissolution** (I gave you power over my will). Collapses on **Borrowed Voice** (how can I bind my future self or another via a chatbot?) and **Death** (can my will bind me after the recipient is gone?).

  **The Trust View (e.g., Relational)**
  *   **Verdict:** Best for human stories, worst for institutional ones.
  *   **Performance:** Handles **Harmful Compliance** well (trust is about care, not words). Fails the **Borrowed Voice** (you can't have a "relationship" with a chatbot) and struggles with **Forgotten Promises** (if the relationship is dormant, is the trust active?).

  **My advice:** Don't look for the theory that passes all seven. Look for the theory that admits which one it breaks and explains *why* that break is acceptable. That tension is your story.
