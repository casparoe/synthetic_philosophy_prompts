answer: |-
  Here is the diagnosis, the price tags, and the verdict on the higher-order move.

  ### 1. The Diagnosis: Where is the Bug?

  Your friend's argument is a Sorites sequence that forces Epistemicism (steps 1–5), adds Higher-Order Vagueness (step 6), and then leaps to Eliminativism (steps 7–8).

  **The bug is in the inference from (6) to (8).**

  Specifically, step (7) claims: *"So there's a real line in the world that nothing could ever detect — 'heap' isn't a feature of the world, it's a feature of us."*
  And step (8) claims: *"So basically none of our ordinary predicates cut the world at its joints... ordinary reasoning... is a convenient fiction."*

  This is a category error. It conflates **semantic precision** with **ontological commitment**.
  *   **If you are an Epistemicist (accepting 5):** The boundary *is* in the world (or rather, the extension of the predicate is fixed). The fact that it is unknowable does not make the predicate a "fiction." Electrons have precise positions (on some views) we cannot measure; that doesn't make "electron" a fiction.
  *   **If you are a Non-Classical Logician (rejecting 5):** The boundary isn't sharp, so there is no "undetectable line." There is a zone of indeterminacy. This makes "heap" a feature of our *representational scheme*, but not a fiction. "Fiction" implies reference failure (like "phlogiston"). "Heap" has successful reference conditions, just not bivalent ones.

  Your friend is arguing that because a concept lacks a *sharp, knowable, mind-independent boundary*, it fails to refer. That is an overly demanding criterion for reference. "Medium-sized dry goods" don't need to be Natural Kinds (like "Gold" or "Water") to be real. They can be functional kinds. The bug is assuming that if a predicate isn't a Natural Kind, it's a Fiction.

  ### 2. The Rescues: Cuts and Costs

  To stop the slide to (8), you must reject a premise or a rule of inference. Here are the four standard tickets and their price tags.

  #### A. Epistemicism (Williamson)
  *   **The Cut:** Reject **(2)**. There *is* a sharp boundary (some $n$ is a heap, $n-1$ is not).
  *   **Why it looked fine:** Tolerance ("one grain can't make the difference") feels analytic. Denying it feels like denying the meaning of the word.
  *   **The Price Tag:**
      1.  **Semantic Ignorance:** We cannot know the meaning of our own words. The boundary is determined by micro-physical usage patterns too complex for humans to track.
      2.  **Metaphysical Bruteness:** It seems absurd that there is a *fact of the matter* about whether 4,532 grains constitute a heap while 4,531 do not, independent of human interests.
      3.  **Margin for Error:** You must accept that knowledge requires a margin for error, which explains *why* we can't know the boundary, but it makes knowledge of vague propositions much harder than intuition suggests.
  *   **Verdict:** Saves Classical Logic and Realism, but makes semantics magical and ignorance constitutive.

  #### B. Supervaluationism (Fine, Keefe)
  *   **The Cut:** Reject **Bivalence/Classical Logic** for borderline cases. (2) is neither true nor false in the penumbra. "True" means "true on all admissible precisifications."
  *   **Why it looked fine:** Preserves classical logic for clear cases (10,000 is definitely a heap). Captures the intuition that the boundary is arbitrary (it varies across precisifications).
  *   **The Price Tag:**
      1.  **Logic Breaks:** The Law of Excluded Middle fails for specific instances ($P(n) \lor \neg P(n)$ is super-true, but neither disjunct is). Modus Ponens can fail in long chains.
      2.  **Divergence of Truth:** "Super-truth" comes apart from assertibility. You can't assert a sentence just because it's super-true if you don't know which precisification is actual.
      3.  **The Admissibility Problem:** What makes a precisification "admissible"? If that criterion is sharp, you've snuck Epistemicism back in. If it's vague, you need a meta-precisification (see Higher-Order below).
  *   **Verdict:** Saves the "no sharp boundary" intuition, but costs you standard logic and creates a technical notion of truth that diverges from use.

  #### C. Degree Theory / Fuzzy Logic (Edgington, Machina)
  *   **The Cut:** Reject **Binary Truth Values**. (2) is *almost* true, but not wholly. Truth comes in degrees [0, 1].
  *   **Why it looked fine:** Matches the phenomenology. The transition from heap to non-heap *feels* like a fade, not a jump.
  *   **The Price Tag:**
      1.  **Logic Breaks Badly:** Modus Ponens is invalid for degrees (if $A$ is 0.9 true and $A \to B$ is 0.9 true, $B$ might be 0.8 true; iterate this and you crash).
      2.  **Metaphysics of Degrees:** What *are* truth degrees? Probabilities? Similarity measures? If they are real properties, do objects literally possess "0.7 heapiness"? That sounds like ontic vagueness, which is metaphysically costly.
      3.  **Arbitrary Functions:** You need a function to assign degrees. Why is 500 grains 0.5 and not 0.51? You reintroduce sharp boundaries at the level of the degree assignment.
  *   **Verdict:** Best phenomenological fit, worst logical cost. Requires a complete overhaul of deductive reasoning.

  #### D. Contextualism (Raffman, Soames)
  *   **The Cut:** Reject the **Stability of Context**. The meaning/extension of "heap" shifts during the sorites progression.
  *   **Why it looked fine:** Explains why we get trapped. We don't notice the context shifting as we move down the series.
  *   **The Price Tag:**
      1.  **Communication Fragility:** If meanings shift this easily, how do we understand each other across different conversational contexts?
      2.  **Doesn't Solve the Static Case:** It explains the *process* of being fooled, but doesn't tell us the truth value of "This is a heap" in a single, fixed context where the case is borderline.
      3.  **Psychological Burden:** Requires a specific psychological mechanism for "gestalt switches" in predicate application that not all speakers exhibit.
  *   **Verdict:** Explains the *paradox* well, but doesn't fully solve the *semantics*.

  ### 3. The Higher-Order Move (Step 6)

  Your friend asks: *Does the higher-order move hurt the first two equally, or does one get hurt way worse?*

  **It hurts Supervaluationism way worse.**

  *   **Epistemicism:** Higher-order vagueness is actually a *feature* for the Epistemicist. Williamson argues that the margin-for-error principle applies recursively. We don't know where the boundary is (1st order), and we don't know where the boundary of "knowing the boundary" is (2nd order). This creates a smooth gradient of ignorance without requiring sharp boundaries in the *logic*. It fits naturally into the view that there are sharp boundaries we simply cannot locate.
  *   **Supervaluationism:** This is the Achilles' Heel. Supervaluationism defines "Definitely $P$" as "True on all admissible precisifications."
      *   If there is higher-order vagueness, then the set of *admissible precisifications* must itself be vague.
      *   To model this, you need "super-precisifications" over the set of precisifications.
      *   This leads to a regress. To stop the regress, you eventually have to posit a sharp boundary between "admissible" and "inadmissible" precisifications.
      *   Once you posit that sharp boundary, you have collapsed into Epistemicism about admissibility. You've saved the object language from sharp boundaries only by positing a sharp boundary in the meta-language.
      *   **Cost:** Supervaluationism either accepts an infinite hierarchy (unworkable) or admits a sharp boundary somewhere (collapsing into Epistemicism).

  ### Summary Recommendation

  1.  **Reject (8) directly.** Your prior is correct. "Convenient fiction" is a non-sequitur. Predicates can be vague, interest-relative, and lack sharp boundaries without being empty. "Heap" is a functional concept, not a natural kind. Expecting it to carve nature at its joints is a category mistake.
  2.  **If forced to choose a theory:**
      *   Choose **Epistemicism** if you want to save Classical Logic and are willing to pay the price of semantic ignorance. It handles Higher-Order Vagueness best.
      *   Choose **Supervaluationism** if you cannot stomach a sharp boundary, but be aware it bleeds heavily on Higher-Order Vagueness and requires non-classical logic.
      *   Choose **Contextualism** if you think the paradox is a psychological trap rather than a semantic problem.
  3.  **The Friend's Error:** He is using the difficulty of locating a boundary (Epistemic) to argue for the non-existence of the property (Ontological). That is the bug. Vagueness is a feature of representation, not necessarily a failure of reality.

  Tell him: "You've proven that 'heap' isn't a Natural Kind. I never claimed it was. That doesn't make it phlogiston; it makes it a tool."
