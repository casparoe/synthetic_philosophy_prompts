  You are to answer as an expert in the philosophy of decision theory and welfare economics, with particular strength in the measurement-theoretic foundations of utility — someone as comfortable with the ordinal/cardinal distinction and the axioms that generate a utility function as with the ethics of aggregating welfare across persons. Think carefully before you write, and begin by laying out the decomposition in rough notes before you commit to any numbers.

  Some background on why I'm asking. I'm a software engineer. My day job involves building systems that rank options for users, and the internals of those systems treat utility as a real-valued score: we sum scores across users, compare them, and optimize them. I had always assumed this was a harmless engineering fiction. Recently a friend and I argued about a charitable donation — she claimed that a marginal dollar relieving one person's chronic pain produces more good than a marginal dollar spent on a different person's, and I found I could not say what would make that claim true or false, or whether I believed in the kind of fact she was invoking. I would like to know what to actually think.

  Here is the proposition I want a credence on. Take two people, A and B. A prefers situation X to situation Y, and B prefers situation X to situation Y (the situations may differ between them, and each may care about different things). The proposition is:

  There is a fact of the matter, independent of any convention of measurement and independent of what anyone believes or would judge, about whether A's gain in preference-satisfaction (or in felt well-being) in moving from Y to X exceeds B's.

  By "independent of any convention of measurement" I mean that the fact would not be created or destroyed by our choosing a different scale, a different zero point, or a different unit, and that it would hold even if no one ever measured or considered it. Give me your credence that this proposition is true, on a 0–1 scale.

  Then give me the decomposition, not just the number. I want each of the following sub-questions to receive its own rough probability and a one-line justification, plus any further sub-question you think belongs:

  1. Realism about utility: is there a genuine quantity — hedonic intensity, preference strength, whatever you take it to be — that exists in a person in a way analogous to, say, blood pressure, rather than being a bookkeeping device we project onto choices? If realism fails, the main proposition fails outright, so I want this term separated out.

  2. Comparability of levels across persons: even granting realism, can one person's level be placed on the same scale as another's, as opposed to only being rankable within each person? In particular, how much of the work is being done by the assumption that there is a privileged zero point or a common unit, and how much survives without it?

  3. The gauge problem: suppose we built a device that read a real number off each brain, but the device's output for each person is defined only up to an unknown positive affine transformation — an arbitrary offset and scale per person that nothing in the world fixes. Does such a device deliver interpersonal comparisons, or does it merely re-describe the problem? I want your probability that the proposition is true conditional on the world being like that.

  4. The first-person asymmetry: does it matter that each of us has direct access to only one stream of experience? I want to know how much of your credence rests on treating this as a genuine obstacle rather than a mere epistemic inconvenience.

  5. Pragmatic warrant: independently of whether the proposition is true, is the practice of making such comparisons — in policy, in cost-effectiveness analysis, in my ranking code — justified? Give me a separate number here, because I suspect one can be a skeptic about the fact and still defend the practice, and I want to see whether you are.

  State how these terms combine into your final number. If you think one of my sub-questions is malformed, or that I have smuggled in an assumption, say so and replace it with the one you think belongs.

  Then tell me which single term your number is most sensitive to, and what evidence or argument — of a kind that could in principle be available to someone who cannot look anything up — would move that term the most, and in which direction.

  I do not want a survey of positions ending in "it depends on your theory of utility." I want a definite number, a definite decomposition, and a definite verdict on which term is load-bearing, with your reasons for each. Where you are uncertain, say so explicitly and say how uncertain, rather than hedging the whole answer into uselessness. Do not give me citations, reading lists, or references; argue it out from what you know.
