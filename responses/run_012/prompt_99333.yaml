  (5) Sensitivity and what would move it — The figure is most sensitive to the first term regarding the basis of liability, specifically the "Objective Threat" argument which posits that rights forfeiture occurs via causal contribution to harm regardless of moral responsibility. If evidence showed that innocent threats forfeit rights merely by posing dangers, the headline credence would collapse.
