prompt: |-
  I've somehow ended up as the person deciding how a small foundation spends about £1.5m over three years on "analogy as the core of cognition" — basically the Hofstadter-and-Sander picture, the idea that analogy isn't a party trick but the engine of thought, that categorisation, memory retrieval, problem-solving and even perception are all analogy underneath. I'm not a cognitive scientist; I did a philosophy degree, read Surfaces and Essences on a beach one summer and got a bit evangelical about it, and now I have to justify a portfolio to a board who mostly want to know what we'd actually be buying. I dont want a literature review or a reading list — I want you to tell me which open questions in this programme are genuinely worth money, in order, and why.

  To make it concrete, here's the mess I'm staring at. A colleague I trust keeps saying the field is stuck on retrieval and has barely touched what she calls "generative analogy" — the case where you build a new abstraction on the fly because there's simply no ready-made source concept to map from — and she reckons that's where the real cognitive action is, not the "this is like that" examples everyone trots out in talks. Someone else insists the whole thing founders on measurement: we've got no agreed way to say one analogy is deeper or better than another except by shrugging and asking a human, so every empirical claim is soft. And then there's the nagging worry about whether the current crop of large language models, which seem to do something that looks like analogy by gliding around in a vector space, either vindicates the programme or quietly shows that the interesting human capacity is something else entirely.

  I'd like your prioritisation to weigh how upstream each question is (how many other things get easier if it's settled), how tractable it is for a small interdisciplinary team rather than a giant lab, how neglected it is, and roughly what kind of result over the next three years would move it up or down my list. Also tell me which of the things people get excited about in this area I should politely ignore, because their answer wouldn't change anything downstream. Feel free to add questions I haven't listed if they deserve to outrank mine — just show me the reasoning, not a survey.
reasoning: |-
  Here's a thinking process that leads to the suggested funding portfolio:

  1.  **Analyze the User and Context:**
      *   **Role:** Decision-maker for a small foundation (£1.5m over 3 years).
      *   **Background:** Philosophy degree, read *Surfaces and Essences* (Hofstadter & Sander), "evangelical" about the theory but not a cognitive scientist.
      *   **Audience:** A board wanting concrete outcomes ("what are we buying?").
      *   **Core Thesis:** Analogy is the core of cognition (Hofstadter/Sander view), not just a rhetorical device.
      *   **Constraints:** No literature reviews/reading lists. Needs prioritization of *open questions* worth funding.
      *   **Criteria for Prioritization:** Upstream impact (leverage), tractability (small team vs. giant lab), neglectedness, concrete 3-year outcomes.
      *   **Specific Concerns Raised by Colleagues:**
          1.  Retrieval vs. Generative Analogy (building new abstractions on the fly).
          2.  Measurement problem (no metric for analogy depth/quality).
          3.  LLMs (do they vindicate the theory or show human cognition is different?).
      *   **Tone:** Pragmatic, strategic, slightly critical (willing to say "ignore this"), authoritative but accessible to a philosopher.

  2.  **Deconstruct the Core Theory (Hofstadter/Sander):**
      *   *Claim:* Categorization *is* analogy. Thinking is fluid concepts sliding over experience.
      *   *Current State:* Psychologically plausible, computationally elusive. LLMs mimic output but mechanism is opaque.
      *   *The "Mess":* The field is fragmented. Some do psych experiments (mapping), some do computational modeling (old school symbolic vs. new neural), some do philosophy.

  3.  **Evaluate the Colleague's Concerns:**
      *   *Generative Analogy:* High importance. If analogy is just retrieval, it's memory. If it's generative, it's *creativity*. This is the "engine" claim.
      *   *Measurement:* Critical bottleneck. Without metrics, you can't compare models or interventions. Soft data kills hard funding.
      *   *LLMs:* The elephant in the room. If LLMs do it via vectors, is the "symbolic/slippage" story wrong? Or is it the same thing implemented differently? This needs empirical dissection.

  4.  **Brainstorming Potential Research Questions/Projects:**
      *   *Q1: The Metric.* Can we build a "depth of analogy" meter?
      *   *Q2: Generative Mechanism.* How do we make a concept that didn't exist before using analogy?
      *   *Q3: LLM Dissection.* Do transformers do structural alignment or statistical co-occurrence?
      *   *Q4: Developmental.* How do kids learn analogy? (Too slow for 3 years?)
      *   *Q5: Neural Correlates.* fMRI studies. (Too expensive/risky for small foundation?)
      *   *Q6: Education.* Teaching via analogy. (Applied, but maybe downstream of theory?)

  5.  **Prioritization Strategy (Applying the Criteria):**
      *   *Budget:* £1.5m/3 years is ~£500k/year. This is "small science" money. Can't fund big longitudinal studies or massive compute clusters. Needs focused, interdisciplinary teams (e.g., 1 PI, 2 Postdocs, 1 Engineer per project).
      *   *Upstream:* Measurement is the most upstream. You can't solve Generative Analogy if you can't measure it.
      *   *Tractability:* LLM dissection is highly tractable now (probe vectors, intervention). Generative modeling is hard but doable with a focused scope.
      *   *Neglectedness:* Everyone is doing LLM benchmarks. Few are doing *cognitive mechanism* dissection of LLMs regarding analogy. Everyone does retrieval; few do generation.

  6.  **Developing the Top Priorities (The "Portfolio"):**

      *   **Priority 1: The Metric (Measurement).**
          *   *Why:* Without this, the field remains "soft." Board needs tangible deliverables.
          *   *Project:* Develop a standardized benchmark/task suite that distinguishes surface similarity from structural depth *and* correlates with human judgment, but is computable.
          *   *Outcome:* A public dataset/toolkit.

      *   **Priority 2: Generative Analogy (The "Engine").**
          *   *Why:* This validates the "core of cognition" claim. Retrieval is boring; creation is the holy grail.
          *   *Project:* Computational modeling or psych experiments focusing on *novel* concept formation, not just mapping A to B.
          *   *Outcome:* A model or protocol showing how new abstractions emerge from slippage.

      *   **Priority 3: The LLM Question (Mechanism vs. Mimicry).**
          *   *Why:* If LLMs do it differently, the Hofstadter theory might need updating. If they do it similarly, it validates the vector/slippage idea.
          *   *Project:* Mechanistic interpretability focused on analogy tasks.
          *   *Outcome:* A paper stating "LLMs do X, Humans do Y" or "LLMs succeed/fail because of Z."

      *   **What to Ignore:**
          *   Purely philosophical debates (already done).
          *   Broad educational interventions (too downstream/noisy).
          *   General "AI Safety" via analogy (too vague).

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone Check:* Needs to sound like a strategic advisor, not a professor. Direct, decisive.
      *   *Structure:*
          1.  Executive Summary (The Strategy).
          2.  Priority 1 (Measurement).
          3.  Priority 2 (Generative).
          4.  Priority 3 (LLMs).
          5.  The "Ignore" List.
          6.  Budget/Team allocation suggestion.
      *   *Refining the "Generative" point:* Make sure to distinguish it from standard analogical reasoning tasks (like Raven's Matrices). It needs to be about *concept creation*.
      *   *Refining the "LLM" point:* Focus on *interpretability*, not just performance. Performance is already known (they are good at it). *How* they do it matters for the cognitive theory.
      *   *Refining the "Measurement" point:* Emphasize that this enables the other two.

  8.  **Final Review against Constraints:**
      *   £1.5m/3 yrs? Yes, the scope fits 3-4 small grants.
      *   No reading list? Checked.
      *   Addressed colleague concerns? Yes (Measurement, Generation, LLMs).
      *   Philosophy background respected? Yes, used terms like "upstream," "tractability," "operationalize."

  9.  **Self-Correction during drafting:** I initially thought about suggesting developmental psychology. But 3 years is tight for longitudinal child studies. Better to stick to computational modeling + adult psych + LLM probing. It's faster and fits the "small team" constraint better. I need to make sure I don't just say "fund AI." The goal is *cognitive science*, using AI as a tool/hypothesis test.

  10. **Final Polish:** Ensure the distinction between "Analogy as Retrieval" and "Analogy as Construction" is sharp. This is the crux of the colleague's worry.

  *(Self-Correction on Budget)*: £500k/year is actually decent for cognitive science. It can fund maybe 2 major projects and 1 smaller one, or 3 medium ones. I should structure it as 3 distinct "work packages" or grants.

  *(Final thought on the "Ignore" list)*: Be specific. "Neural correlates" is a money pit for small foundations. "Educational outcomes" is too noisy.

  Let's write it.cw
answer: |-
  This is a high-risk, high-reward position. £1.5m over three years is enough to break a bottleneck, but not enough to boil the ocean. If you try to fund "research on analogy" generally, you will get a scattergun of papers that vanish into the academic void. To satisfy your board and advance the Hofstadter/Sander thesis, you need to fund **infrastructure and mechanism**, not just more examples.

  Your colleagues are right: the field is stuck on retrieval (finding the right source) and measurement (knowing if the match is good). The "Generative" claim is the most exciting but also the most vulnerable to hand-waving.

  Here is the prioritized portfolio. I have ordered these by **upstream leverage** (how much they unblock other work) and **tractability** for a small interdisciplinary team.

  ### Priority 1: The "Depth" Metric (Operationalizing Structural Alignment)
  **The Problem:** Your second colleague is correct. Currently, "deep analogy" is defined by intuition. If you can't measure it, you can't optimize it, and you can't prove a model (human or machine) is doing it better than a heuristic shortcut.
  **The Project:** Fund a team to build a **standardized benchmark suite for analogical depth** that is *not* solvable by surface statistics alone.
  *   **Why Upstream:** You cannot fund "Generative Analogy" (Priority 2) or "LLM Dissection" (Priority 3) effectively if you cannot agree on the dependent variable. This is the ruler for the whole programme.
  *   **Tractability:** High. This requires psychophysics (testing humans on novel pairs) and computational linguistics (testing current models). It fits a small team (1 PI, 2 postdocs, 1 engineer).
  *   **3-Year Deliverable:** A public, validated dataset and evaluation protocol where "score" correlates with human judgments of insight, but is robust enough to grade software.
  *   **Why this moves the needle:** If you solve this, you turn analogy from a philosophical claim into an engineering spec. The board can hold a "ruler" in their hand.

  ### Priority 2: Generative Analogy (Concept Construction vs. Retrieval)
  **The Problem:** Most cognitive models treat analogy as *mapping* (A is to B as C is to D). Your trusted colleague is pointing out that Hofstadter's real claim is stronger: analogy *creates* the categories. We don't just map "atom" to "solar system"; we create a new abstraction of "central force system" that didn't exist in either domain prior to the mapping.
  **The Project:** Fund a computational modeling team focused specifically on **on-the-fly category formation**.
  *   **Why Upstream:** If this fails, the "core of cognition" thesis reverts to "analogy is a useful memory tool." If it succeeds, it explains creativity and learning.
  *   **Tractability:** Medium-Hard. This is the hardest science in the portfolio. To make it tractable for 3 years, constrain the domain. Do not ask them to model "all thought." Ask them to model **one specific domain** (e.g., naive physics or kinship terms) where new abstractions can be observed forming in real-time.
  *   **3-Year Deliverable:** A working model (code) that demonstrates the emergence of a new concept label or category boundary through analogical slippage, validated against human experimental data.
  *   **Why this moves the needle:** This is the only project that directly tests the "engine of thought" hypothesis. It moves the theory from descriptive to generative.

  ### Priority 3: The LLM Mechanism Audit (Vectors vs. Structures)
  **The Problem:** LLMs pass analogy tests. Does this mean Hofstadter was right (it's all fluid vectors) or wrong (it's just statistical co-occurrence masquerading as structure)? If LLMs do it via a different mechanism, the human cognitive theory might still be wrong.
  **The Project:** Fund a **mechanistic interpretability** project focused exclusively on analogy tasks.
  *   **Why Upstream:** It contextualizes the whole field in the age of AI. It prevents the foundation from funding a theory that AI just rendered obsolete (or vindicated).
  *   **Tractability:** High. The models exist; the tools for probing them (activation patching, attention visualization) exist. The gap is applying them specifically to *structural alignment* tasks rather than general capability.
  *   **3-Year Deliverable:** A definitive paper mapping *where* in the network analogical reasoning happens. Does it happen in specific heads (suggesting a modular mechanism) or is it diffuse (suggesting Hofstadter's fluidity)?
  *   **Why this moves the needle:** It answers the "vindication vs. illusion" question. If LLMs do it via brute force statistics, human cognition must be doing something else (perhaps the generative part in Priority 2). If they do it via structural alignment in vector space, it validates the connectionist side of the Hofstadter view.

  ---

  ### What to Politely Ignore (The "Money Pits")

  To protect your £1.5m, you need to say "no" to things that sound relevant but are downstream or intractable.

  1.  **Broad Educational Interventions:** You will get proposals to "teach kids better using analogy." **Ignore them.** The signal-to-noise ratio in educational RCTs is terrible. You won't know if the outcome was due to analogy, teacher quality, or socioeconomic factors. Wait until Priority 1 and 2 are solved before funding applications.
  2.  **General Neural Correlates (fMRI/EEG):** Unless a team has a very specific hypothesis about *where* slippage happens (e.g., specific prefrontal-hippocampal loops), do not fund brain scanning. It is too expensive for a small foundation and often produces "blobology" (pretty pictures of activation) without explaining the *mechanism*.
  3.  **Philosophical Refinement:** You come from philosophy; you know the temptation. Do not fund conferences on "The Ontology of the Slip." The theory is rich enough. You need empirical teeth, not more nuance.
  4.  **General "AI Safety" via Analogy:** There is a trend to claim analogy is the key to aligning AI. This is currently speculation. Funding this would be betting on a hype cycle, not cognitive science.

  ### The Strategy for the Board

  When you present this, frame it as **building the toolchain for a new cognitive science.**

  *   **Year 1:** Focus heavily on **Priority 1 (Measurement)**. You cannot spend the rest of the money wisely if you don't have the metric.
  *   **Year 2:** Launch **Priority 2 (Generative)** and **Priority 3 (LLM)** in parallel. Use the metric from Year 1 to evaluate both.
  *   **Year 3:** Synthesis. Compare the Generative Model (human-like) against the LLM Audit (machine-like) using your Metric.

  **The "Buy":** Tell the board you are buying the **operational definition of human insight.**
  If successful, in three years you won't just have papers; you will have a benchmark that defines the field, a model that shows how new ideas are built, and a clear understanding of how AI fits into that picture. That is a tangible legacy for £1.5m.

  ### One Additional Question to Add
  **"The Failure Mode of Analogy"**
  I suggest you add a small tranche of funding specifically for **when analogy breaks.**
  *   **Reasoning:** Hofstadter's theory explains success well. It is less clear on why we get stuck in bad analogies (stereotypes, false equivalences).
  *   **Why:** It makes the research robust. If you only study successful insight, you look like you're cherry-picking. Studying the *pathology* of analogy (bias, rigidity) makes the theory scientifically safer and socially relevant (addressing bias).
  *   **Placement:** Fold this into Priority 1 (the metric must capture bad analogies) and Priority 3 (do LLMs inherit human analogical biases?).

  ### Summary of Allocation (Rough Cut)
  *   **£600k:** Priority 1 (Measurement & Benchmarking) - *The Foundation.*
  *   **£500k:** Priority 2 (Generative Modeling) - *The Theory Test.*
  *   **£300k:** Priority 3 (LLM Interpretability) - *The Context.*
  *   **£100k:** Contingency/Small Grants (including the "Failure Mode" work).

  This portfolio respects the philosophy (it takes the theory seriously), satisfies the board (it produces tools and benchmarks), and addresses your colleagues' fears (it tackles generation and measurement head-on).
