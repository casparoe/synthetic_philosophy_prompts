  # Tyranny & Resistance: A Decision Tree
  **Seminar Discussion Instrument**

  **Instructions:** Start at **Node 1**. Read the concrete case. Choose the path that matches your moral intuition or the author you are analyzing. Follow the arrows until you land on a **Leaf (Position)**. Once everyone has landed, find someone on a different leaf and argue why their path is wrong.

  ---

  ### **Node 1: The Source of Power**
  **Case:** A ruler is oppressing the people. How did he get power?
  *   **A.** He seized the throne by force with no legal claim (Usurper). → *Go to Node 2*
  *   **B.** He inherited or was elected to the throne, but now rules brutally (Legitimate Turned Tyrant). → *Go to Node 3*

  ### **Node 2: The Private Opportunity (Usurper)**
  **Case:** A private citizen has a clean shot at the usurper with no risk to bystanders.
  *   **A.** Kill him immediately. → **Leaf 1: Private Zealotry**
  *   **B.** Wait for public authority to remove him. → *Go to Node 8*

  ### **Node 3: The Moment of Loss (Legitimate)**
  **Case:** The king orders a bishop executed for refusing an unjust tax.
  *   **A.** He loses authority the *instant* he gives the order. → *Go to Node 4*
  *   **B.** He retains authority until formally deposed by a superior. → *Go to Node 5*

  ### **Node 4: The Private Right (Instant Loss)**
  **Case:** Since he is no longer king, can a private person kill him like a common criminal?
  *   **A.** Yes, anyone may execute a criminal. → **Leaf 2: Resistance Theory**
  *   **B.** No, only magistrates may execute criminals. → **Leaf 3: Magistratic Resistance**

  ### **Node 5: Obedience in the Meantime (No Instant Loss)**
  **Case:** He is still king until deposed. Do subjects obey his unjust commands in the meantime?
  *   **A.** No, disobey passively but do not resist. → **Leaf 4: Passive Resistance**
  *   **B.** Yes, obey unless the command forces you to sin. → *Go to Node 6*

  ### **Node 6: The Magistrate's Oath**
  **Case:** A lower magistrate swore an oath of loyalty to this king.
  *   **A.** He may break the oath to depose the king. → *Go to Node 7*
  *   **B.** He cannot break the oath; only a superior (Pope/Emperor) can release him. → *Go to Node 8*

  ### **Node 7: The Means of Removal (Magistrate)**
  **Case:** The magistrate has the king surrounded.
  *   **A.** Kill him to ensure he never returns. → **Leaf 5: Constitutional Tyrannicide**
  *   **B.** Depose and exile him; killing is unlawful. → **Leaf 6: Constitutional Deposition**

  ### **Node 8: The Superior Authority (Public/Church)**
  **Case:** No magistrate will act. Can the Pope or the Community act instead?
  *   **A.** Yes, they hold ultimate authority. → *Go to Node 9*
  *   **B.** No, nobody may act until order returns naturally. → **Leaf 7: Quietism**

  ### **Node 9: The Prudential Bar**
  **Case:** The Pope authorizes removal, but killing the king opens the border to an invading empire.
  *   **A.** Proceed anyway; justice outweighs consequences. → **Leaf 8: Principled Removal**
  *   **B.** Abort; scandal and war outweigh justice. → **Leaf 6: Constitutional Deposition** *(Note: Merges with Leaf 6)*

  ---

  ### **Instructor Flags & Diagnostic Notes**

  **1. Leaves This Tree Cannot Fully Separate**
  *   **Public Authority vs. Church Authority:** *Leaf 1 (Private Zealotry on Usurper)* and *Leaf 8 (Principled Removal)* both rely on "higher authority" acting where magistrates won't. They only come apart if the "public" is secular vs. ecclesiastical. In practice, if no magistrate acts, the Church and the "Community" often occupy the same functional slot. Aquinas lands here: he allows the community to depose if no superior exists, but worries about the prudential bar (Node 9).
  *   **Deposition vs. Pacifism:** *Leaf 6 (Constitutional Deposition)* and *Leaf 8 (Principled Removal)* can look identical if "Removal" means exile. The tree forces a choice on *killing*, but many historical positions (including Aquinas's) treat killing and deposing as separate questions with the same answer (No Killing, Yes Deposing).

  **2. Diagnosing Empty or Unattractive Branches**
  *   **Leaf 4 (Passive Resistance):** Historically rare as a standalone position. Most who argue for disobedience also argue for deposition eventually. It is usually a stepping stone, not a destination.
  *   **Leaf 7 (Quietism):** Almost无人 (no one) occupies this on the Usurper branch (Node 8). It is incoherent to say a usurper has no right but nobody may remove him. It is only attractive on the Legitimate branch if one believes all authority is divinely ordained regardless of exercise.
  *   **Leaf 2 (Resistance Theory):** This branch (Private killing of a legitimate tyrant) is the most dangerous. Most medieval thinkers (including Aquinas) reject this path at Node 4, fearing it licenses assassination and sedition.

  **3. Where is Aquinas?**
  *   Aquinas is difficult to pin to a single leaf because he prioritizes the *gap* between Node 3 and Node 6.
  *   He generally rejects **Node 2A** (Private killing of usurpers), preferring **Node 2B**.
  *   He rejects **Node 3A** (Instant Loss), preferring **Node 3B**.
  *   He lands at **Node 6A** (Magistrate/Community may act) but pushes toward **Leaf 6 (Deposition)** rather than Killing.
  *   He is deeply concerned with **Node 9 (Prudential Bar)**.
  *   **Result:** Aquinas sits between **Leaf 6** and **Leaf 8**, depending on whether the community counts as a "magistrate." The tree forces you to see that his theory allows deposition but leaves the *agent* of deposition dangerously vague.

  **4. The "Aquinas Gap"**
  *   Notice the distance between **Node 3** (He is still King) and **Node 6** (Magistrate breaks oath). If he is still King, how can the Magistrate depose him without sedition? Aquinas says tyrannical rule isn't ordered to the common good, so it isn't true rule—but this tree shows that doesn't automatically tell you *who* gets to stop it. That is the debate for the next ten minutes.
