answer: |-
  Headmistress, Chaplain, parents, staff, and fellow pupils – especially the Year 9s, who are currently wondering what on earth we are talking about.

  We are here to sign a book. Or, by the end of today, perhaps to stop signing it. Our Headmistress argues that the Honour Book is a relic. She says a promise nobody can enforce is worse than no promise at all. She says "honour" belongs to duelling, to bullying, and to men who cared more for their reputation than for the truth.

  She is a classicist; she knows the history of the word. She is right about the past. But I am asking you to consider that she might be wrong about the future.

  In sociology, we learn that moral life usually rests on one of three pictures of human worth.

  The first is **Honour**. Here, worth is public. It can be lost. An insult is an injury that must be answered. If you let it pass, you are diminished.
  The second is **Dignity**. Here, worth is intrinsic. It cannot be taken. Slights should be absorbed. The dignified response to an insult is to ignore it.
  The third is **Recognition**. Here, moral standing attaches to harm. A wrong matters because of what it reveals about vulnerability. The injury is addressed by making it visible, by naming the pain.

  Our school is, in almost every other respect, a Dignity institution. We have a well-being hub. We have counselling. We talk about kindness and intrinsic worth. And that is good. But the Headmistress proposes we remove the one Honour device we have left.

  I want to argue that this is a mistake. I want to argue that, for a community of adolescents, the Honour culture – properly understood – is morally superior to the other two. Not because it is older, but because it is the only one that demands active courage.

  Dignity is safe, but it is passive. It tells the victim: "You are valuable, so walk away." But sometimes you cannot walk away.
  Recognition is just, but it is reactive. It tells the victim: "Show us your wound, and we will fix it." It makes the institution the saviour.

  Honour, however, asks something harder. It asks: "What do you owe the person standing next to you?"

  Last term, a Year 11 boy was filmed being mocked on a bus. The video went round the school. The school ran a restorative meeting and a well-being assembly. It was handled with care. It was handled with Dignity and Recognition.

  But listen to the talk in the common room afterwards. One group of pupils said he should have hit back. They were speaking the language of Honour: an insult is an injury that must be answered. Another group said the school had handled it beautifully. They were speaking the language of Dignity: slights should be absorbed and managed by authority.

  Here is the uncomfortable truth: each group regarded the other as morally backward. The first thought the second were cowards. The second thought the first were savages.

  This confusion exists because we have Dignity without Honour. We tell pupils they have intrinsic worth, but we give them no public language to defend it other than "tell a teacher." We have replaced self-policing with surveillance.

  The Headmistress says a promise nobody can enforce is useless. I say the opposite. If a promise needs enforcing, it is not honour; it is law. The point of the Book is not that it stops the liar. It is that it shames the bystander.

  Look at the pledge again. "Not to lie, cheat or steal." That is standard. But the final clause is the engine: "**Nor stand by while others do.**"

  That is not about reputation. That is not about duelling. That is a command to intervene.

  If we abolish the Book, we do not move to a pure Dignity culture. Dignity cultures require enforcement, or they collapse. If we remove the expectation that *we* police *ourselves*, the vacuum will be filled by teachers, CCTV, and phone searches. We will gain safety, but we will lose agency. We will become children who are managed, rather than young adults who are trusted.

  The Honour culture of the duel was toxic because it was about the self. "Defend my name." The Honour culture of this Book is about the other. "Defend the truth."

  The Year 9s signing today will not be signing a contract. They are signing a vow. A contract is for when trust fails. A vow is for when trust is all you have.

  The Headmistress worries that Honour belongs to men who cared more about reputation than anyone else. I agree. That Honour is dead. But the Honour in this book is different. It is not about saving face. It is about keeping faith.

  Dignity tells me I matter. Recognition tells me my pain matters. But Honour tells me that *my action* matters.

  If we sign this book, we are saying that the moral life of this school does not belong solely to the staff. It belongs to us. It is a risky thing to hold. It can be abused. But a school without risk is a school without growth.

  Please, let us keep the book. Not because we are better than other schools. But because we are old enough to know that a promise is the only thing that holds us together when no one is watching.
