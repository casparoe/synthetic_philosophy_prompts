  *Motivating Case:* #6 (Line sitting is exit) vs. #5 (Grade is standing).
  *Fails On:* #3 (Scalping). The scalper isn't buying standing; they are selling a seat. Under this principle, scalping looks like line sitting (selling a seat), so it should be OK. Your gut says Not OK. This principle can't explain why the *method* of acquisition (bot vs. human) matters.

  **2. The Integrity of Expression Principle**
  *Test:* Markets are Not OK when they commodify speech, belief, or internal states, but OK when they commodify external goods or labor.
  *Motivating Case:* #10 (Sentence vs. Sign). The sentence claims belief; the sign claims only presence.
  *Fails On:* #1 (Kidney). A kidney is not speech or belief; it is constitutive of the body. If you protect "integrity" enough to ban vote-selling, you should logically ban kidney-selling. Your verdict allows the kidney but bans the vote, so "integrity" alone is too broad.

  **3. The Human Burden vs. Constitutive Attribute Test**
  *Test:* Markets are permissible when money compensates a human for a *cost they endure* (pain, time, risk, inventory loss). Markets are impermissible when money purchases a *constitutive attribute* (voice, merit, civic agency) or *access without cost* (arbitrage).
  *Motivating Case:* #10 (Sign vs. Sentence). Holding the sign is a cost; speaking the sentence is an avowal of self.
  *Fails On:* None of the 11, provided you accept that bot-scalping fails because no *human* burden was endured to get the ticket.

  - **The hard pairs**

  **Scalping vs. Flood Water**
  Both involve price spikes on scarce goods, yet you accept the water (#2) and reject the tickets (#3). The difference is the *source of the scarcity cost*. In the flood case, the seller bears the inventory cost of replacing the water in a crisis; the price signals the burden of scarcity. In the bot-scalping case, the seller bears no human burden; the bot bypasses the queue's intended cost (time/attention). You are not objecting to the resale; you are objecting to the *extraction of value without the corresponding human cost*. To keep both verdicts, you must accept that price gouging on goods is a market signal, but arbitrage on access is a theft of priority.

  **The Sign vs. The Sentence**
  This is the load-bearing pair (#10). Both involve a homeless man taking $50. The sign requires physical presence (a burden of time and exposure); the sentence requires an avowal of belief (a constitutive attribute of the self). Money can rent the body, but it cannot rent the voice without corrupting the meaning of the speech. If you allow the sentence, you turn belief into a service. If you allow the sign, you turn presence into labor. The cost of keeping both is accepting that *what* is being sold (muscle/time vs. mind/voice) matters more than *who* is selling it.

  - **The principle I'd defend**

  **The Human Burden Principle.**
  A market transaction is permissible if the seller is compensated for a **cost they personally endure** (pain, risk, time, presence, inventory loss). It is impermissible if the transaction sells a **constitutive attribute** (vote, grade, belief) or **access unmoored from human cost** (bot scalping).
  *Load-bearing clause:* "Cost they personally endure." This clause does the heavy lifting. It allows the kidney (pain/risk), the line-sitter (time), and the mourner (emotional labor), while banning the vote (agency), the apology (sincerity), and the bot-scalper (no human cost).
  *Case that forces it:* #10 (Sign vs. Sentence). This is the only case where the *exact same person* is involved in two nearly identical transactions with opposite verdicts. The only variable is whether the money buys a burden (standing) or an avowal (speaking).

  - **Four new cases**

  **(a) Hospital sells naming rights to its cancer wing.**
  **Verdict: Not OK.**
  *Reasoning:* This sells a *constitutive attribute* (legacy/prestige) rather than a burden. The buyer is not enduring a cost to help the hospital; they are purchasing status and the association of their name with charity. It commodifies the institution's identity.

  **(b) Man in rent-controlled flat sells his place in the queue.**
  **Verdict: OK.**
  *Reasoning:* This is identical to #6 (Line sitting). The seller has endured the burden of securing the rent-controlled unit (or the waitlist time) and is selling that accrued time/labor. It is a market in endured cost, not status.

  **(c) Parent pays their nine-year-old a dollar a page to read books.**
  **Verdict: OK.**
  *Reasoning:* This pays for the *burden of effort* (reading is work for a 9-year-old). It does not purchase the *constitutive attribute* of literacy or love of learning directly, though it risks crowding out intrinsic motivation. As a market transaction, it compensates labor, not identity.

  **(d) Hiring a stand-in to sit your bar exam.**
  **Verdict: Not OK.**
  *Reasoning:* This sells a *constitutive attribute* (competence/certification). The exam is designed to measure *your* knowledge. Paying someone else to endure the stress of the test bypasses the link between the burden (study/test) and the status (license). It is fraud, not labor.

  - **What I have to give up**

  You have to give up the intuition that **all scalping is inherently wrong.**
  Under the Human Burden Principle, a human being who waits in line for 10 hours and sells their ticket is doing the exact same moral work as the congressional line-sitter (#6). They are selling endured time. Your verdict on #3 specifies "a guy with a bot," which saves it, but if you believe *human* scalping is also immoral, this principle cannot hold. You must either accept that human scalping is permissible labor, or admit that Scalping is the **One Exception** to the principle. I recommend the former: treat bot-scalping as theft of access (no human burden) and human-scalping as legitimate labor (endured burden). If you can't stomach human scalping, you must add an epicycle about "fair allocation mechanisms," which complicates the clean Burden/Attribute distinction.
