answer: |-
  What specific capacity distinguishes a system that merely tracks statistical regularities coinciding with normative standards from a system that genuinely grasps the norms governing conceptual application?

  Current debates regarding machine understanding suffer from a category error that renders many arguments mutually unintelligible. Participants frequently conflate two distinct philosophical questions. The first concerns representational content: whether there is a fact of the matter about what a system's internal states are about. The second concerns normative grasp: whether the system understands the rules governing the correct use of those representations, including the conditions under which an application is mistaken and the inferential commitments entailed by that application. Optimists about artificial intelligence typically marshal empirical evidence—such as successful performance on probing tasks or generalization benchmarks—to establish that models possess determinate representational content. Skeptics, invoking the "stochastic parrot" objection, concede that models may track patterns but deny that this amounts to understanding because the systems lack a grasp of the norms guiding those patterns. Because these positions address different questions, the debate stalls. This project proposes to isolate the second question and determine the necessary conditions for normative grasp independent of content determinacy.

  The existing literature leaves this question open because it treats normative grasp as either identical to behavioral disposition or as requiring mysterious non-physical properties. The dispositional view fails because a system can perfectly conform to a norm without grasping it, much like a planet orbits according to gravitational laws without understanding physics. The non-physical view renders the capacity inaccessible to scientific inquiry. Neither option provides a functional criterion that could distinguish a system that is merely caused to behave correctly from one that behaves correctly *because* it recognizes the correctness condition. To resolve this, we must identify a structural or functional marker that separates tracking a regularity from following a rule.

  Given the constraints of a philosophical dissertation context without access to proprietary model weights or computational laboratories, the appropriate method is conceptual analysis supported by functional modeling. I will not train models or run behavioral experiments. Instead, I will construct functional descriptions of systems that vary only in their relationship to normative constraints. By analyzing hypothetical architectures, I will test whether specific capacities are necessary for normative grasp. The core hypothesis to be evaluated is that grasping a norm requires the capacity to represent the norm itself as an object of cognition and to be motivated by that representation. In other words, a system does not merely output a conclusion based on input patterns; it must possess a higher-order state that evaluates the transition from input to output against a standard, and this evaluation must play a causal role in the output generation.

  A successful outcome for this semester-long project will be a refined functional criterion for normative grasp that avoids infinite regress. If grasping a norm requires representing the norm, one risks a regress where representing the norm requires yet another norm to govern that representation. Success looks like articulating a stopping point for this regress, perhaps by identifying a specific type of feedback loop or error-correction mechanism that counts as "being moved by the norm" without requiring further explicit representation. Conversely, the project will count as failing if I demonstrate that the distinction between tracking regularities and grasping norms is untenable—that is, if there is no functional difference between the two even in principle. A secondary failure condition would be producing a criterion that is so abstract it cannot be mapped onto any plausible cognitive architecture, rendering it philosophically sound but scientifically inert.

  This scope is ambitious but feasible for a semester. The primary risk is the infinite regress problem, which has troubled rule-following considerations for decades. To manage this, I will restrict the analysis to inferential norms in simple logical or semantic tasks rather than attempting to solve the general problem of intentionality. I will not attempt to prove that current large language models do or do not meet this criterion; rather, I will establish the criterion itself. This limits the workload to argumentation and conceptual clarification rather than empirical verification. While a full defense of the criterion might require a dissertation chapter, a semester project can reasonably produce the framework and a defense of its coherence against the most obvious regress objections. The result will be a tool that allows future empirical work to target the correct features of AI systems, moving the debate past the current impasse where optimists point to content and skeptics demand norms.
