      *   *Utility vs. Culture:* Whitehead isn't arguing for narrow vocationalism (mere utility) nor for empty humanism (mere culture). He wants *expert knowledge* grounded in *general culture*.
      *   *The Rhythm:* Romance (freedom, excitement, unstructured engagement) -> Precision (discipline, details, rules) -> Generalization (return to freedom, application, synthesis).
      *   *Consistency:* The key is that "utility" for Whitehead doesn't mean "job training"; it means "living application." Culture isn't "decorative"; it's the context that makes knowledge alive.

  3.  **Address the Tension (Utility vs. Culture):**
