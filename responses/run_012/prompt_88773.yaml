answer: |-
  **MEMORANDUM**

  **TO:** Commemoration Review Commission
  **FROM:** Chair
  **DATE:** October 24
  **SUBJECT:** Recommendation Regarding the Marston Fountain

  **Recommendation and Course of Action**
  I recommend we adopt a modified version of Proposal Two: retain the fountain as a functional utility and historical object, remove Horatio Marston's name from the dedication, and replace it with an inscription honoring the workers of the Old Mill neighborhood while acknowledging the complex history of the site. We must not simply add a panel (Proposal Three), as signage is often ignored and fails to alter the honorific pledge of the stone itself. Nor should we remove the object (Proposal One), which destroys a community asset.

  **Timeline:**
  1.  **November 15:** Commission approves modified Proposal Two.
  2.  **January 30:** Design committee (including Neighborhood Association reps) finalizes new inscription text.
  3.  **March 1:** Council budget vote secures funding (utilizing Marston Trust offer).
  4.  **September 10:** Installation complete, timed for the anniversary of the 1894 strike resolution.

  **The Case for Removal**
  Those advocating for Proposal One argue that moral clarity requires erasure. To keep the fountain is to keep a monument to a man who used private violence to suppress labor. They argue that any retention validates his philanthropy as redemption for his conduct, suggesting that buying a fountain offsets breaking strikes. There is force here. If the city stands for workers' rights, honoring a strikebreaker is a contradiction. Removal is the only way to ensure the second ledger—the present pledge—does not inadvertently honor coercion. It is a clean break, signaling that some actions forfeit the right to be remembered publicly.

  **Response:**
  Removal solves the pledge problem by destroying the evidence. It privileges our current comfort over historical truth. Furthermore, it ignores the neighborhood's claim. For three generations, the Old Mill residents have used this fountain not to honor Marston, but to mark their own presence. To remove it is to tell them their interpretation of their own space is invalid. We cannot correct a historical wrong by committing a present erasure.

  **The Two-Ledger Test**
  We must distinguish what the monument *says happened* (Factual Ledger) from what it *says we honor* (Pledge Ledger). The original inscription claims Marston was a benefactor worthy of remembrance. The evidence shows he was also an antagonist to the workers he claimed to improve.

  Proposal Three (the panel) corrects the Factual Ledger but leaves the Pledge Ledger untouched. The stone still says "Marston gave this," and we still stand beneath it. Proposal One (removal) settles the Pledge Ledger—we honor no one—but destroys the Factual Ledger by removing the physical record.

  Proposal Two attempts to balance both. By removing the name, we stop pledging honor to Marston. By keeping the stone, we preserve the fact that such a man existed and gave such a gift. However, here the test requires amendment. The prompt warns that re-inscribing is a "forgery," putting our words in the mouths of the dead. This is true if we pretend the original inscription never existed. It is not forgery if we treat the stone as a palimpsest. We must assume the granite can be altered without structural damage; if the stone cannot bear the alteration without ruin, we must retreat to Proposal Three. Assuming technical feasibility, amendment is not forgery; it is a correction of the public record, acknowledging that the previous pledge was mistaken.

  **Usage and Self-Congratulation**
  The Neighborhood Association argues that meaning is made by use, not intention. They drink from the fountain; therefore, it is theirs. This aligns with the philosophical view that objects acquire meaning through interaction. If the community has reclaimed the fountain, removing it punishes them for Marston's sins.

  However, we must heed the suspicion that a counter-monument (Proposal One) is an act of self-congratulation. A new monument to the strike risks telling us how virtuous *we* are for remembering the strike, rather than honoring the strikers themselves. It turns memory into a performance. Keeping the fountain, altered, forces us to live with the ambiguity. It requires no new statue to admire; it requires only that we drink water from a stone that tells a difficult truth.

  I must note my own position. My grandmother worked in the Marston mill. A critic might say I favor keeping the fountain to preserve a link to her labor. I argue the opposite: because she worked there, I know the fountain belongs to the workers, not the owner. Keeping it for the neighborhood honors her memory more than removing it to satisfy a abstract moral purity. We must not let the perfect be the enemy of the useful.

  **Assumption Flag**
  My recommendation assumes the Marston Trust's funding offer is unconditional. If their funding comes with stipulations regarding the text or design, we must reject it and seek public funds to avoid the appearance of buying our own judgment.

  **Closing Motion**
  I move that we retain the Marston Fountain as a public utility, remove the donor's name from the dedication, and commission a new inscription honoring the workers of the Old Mill neighborhood while documenting the site's full history.
