      *   *Correction on Person-Affecting:* CEA is implicitly impersonal. It cares about the *slot* of the QALY, not the *person*.
      *   *Residue:* Make sure to distinguish between "missing because it's impractical" vs "missing because it's metaphysical."
      *   *Verdict:* Don't sit on the fence too much. Give an "honest call."

  9.  **Final Structure:**
