      *   **Requirements:**
          1.  Translate population axiology views into CEA vocabulary (decision rules, weights, etc.). Be honest about "fudges."
          2.  Identify the "Residue": What philosophical concepts have *no* counterpart in CEA? Explain *why* they are missing (missing feature vs. irrelevant intuition).
          3.  The Verdict: Is the colleague right? Is CEA committed to the Repugnant Conclusion?
      *   **Constraints:** No citations, no reading lists. Just the argument. Start with brainstorming, then structure.

  2.  **Brainstorming & Deconstruction:**

      *   *Core Tension:* CEA maximizes health benefit (usually sum of QALYs) subject to a budget constraint. Population Axiology asks how to value different possible populations.
      *   *Translation:*
          *   **Totalism:** Maximize $\sum$ QALYs. This is standard CEA.
          *   **Averagism:** Maximize Mean QALYs per person. CEA rarely does this explicitly, though "health-adjusted life expectancy" is close.
          *   **Critical Level:** Only count QALYs above a certain threshold (e.g., life must be worth living). CEA treats death as 0, states worse than death as negative. Is there a "critical level" above 0? Not really, unless you count the "severity modifier" or equity weights.
          *   **Person-Affecting:** Only count benefits to people who *would exist anyway*. CEA usually counts benefits to *everyone affected*, including those whose existence depends on the intervention (e.g., maternal health saving a baby).
          *   **Variable Value:** Diminishing marginal value of QALYs as population grows. CEA uses equity weights, but usually based on severity/income, not population size.
      *   *The Residue:*
          *   **Non-Identity Problem:** CEA assumes a fixed population or counts births as benefits. It doesn't grapple with "this specific child wouldn't exist if we chose policy B."
          *   **Asymmetry:** Creating a happy person is neutral/good? Creating a miserable person is bad. CEA treats +QALY and -QALY symmetrically around zero (death).
          *   **Existence as a Benefit:** CEA counts life years gained. Philosophy asks if existence itself is comparable to non-existence.
      *   *The Verdict:* The colleague is *technically* right about the math (Total Utilitarianism), but wrong about the *scope*. CEA is a resource allocation tool within a fixed(ish) context, not a theory of the good for the universe. However, in global health (where we influence population size via mortality/fertility), the distinction blurs.

  3.  **Drafting the Translation (Section 1):**
