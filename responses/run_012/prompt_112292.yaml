      *   *Critical Level:* This is like a "minimum acceptable QALY weight." If a life is below 0.2 utility, does it count? CEA counts it. So CEA is *not* Critical Level.
      *   *Person-Affecting:* This is the "identifiable victim" rule. CEA counts statistical lives.
      *   *Variable Value:* Equity weights. But usually based on disadvantage, not population size.

  4.  **Drafting the Residue (Section 2):**
      *   What's missing?
      *   *Non-Identity:* CEA treats populations as interchangeable buckets of QALYs. Philosophy cares about *who* exists.
      *   *Asymmetry:* CEA is symmetric. +1 QALY = -(-1) QALY. Philosophy (Parfit/Narveson) says bringing happy people into existence isn't a "benefit" in the same way saving an existing person is.
      *   *Incommensurability:* CEA assumes everything reduces to a number. Philosophy worries about rights/justice that can't be traded.
      *   *Why missing?* CEA is pragmatic. It needs to make a decision *now*. Philosophy is exploring metaphysical coherence.

  5.  **Drafting the Verdict (Section 3):**
