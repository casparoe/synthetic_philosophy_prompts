      *   If I reward "coherence," they might dig in.
      *   *Idea:* The Facilitator acts as the "Director." The Director needs a number to make a decision. The teams are advisors. The Director (Facilitator) will arbitrarily pick one *after* the debate. The teams don't know which logic the Director prefers. This mimics the real world: the "correct" class is often determined by who has authority, not just logic.
      *   *Better:* Keep it epistemic. Points for identifying the *structural* similarity.
