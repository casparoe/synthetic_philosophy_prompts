      *   Students often try to aggregate probabilities (average them). I need a rule forbidding this during the private phase.
      *   Students might say "We need more data." Facilitator must say "No more data is available. Decision is in 10 minutes."

  12. **Final Review of Limitations:**
      *   The activity creates *discrete* classes. In reality, classes blur.
      *   The activity implies frequency data exists. In reality, often it doesn't (principle of indifference). I need to mention this in limitations.

