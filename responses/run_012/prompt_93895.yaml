answer: |-
  # Activity Design: The Inter-Agency Risk Council

  ## 1. Learning Goal
  By the end of this session, students should viscerally experience the **Reference Class Problem**. They will understand that assigning a probability to a single, unrepeatable event (a "single case") requires subsuming that event under a general class. They will discover that multiple, logically defensible classes exist for the same event, that these classes yield contradictory probabilities, and that there is no internal logical mechanism within probability theory alone to select the "correct" class without appealing to external pragmatic or metaphysical criteria. The goal is not to solve the problem, but to feel its friction.

  ## 2. Materials and Room Setup
  *   **Room:** Seminar style. 4 tables clustered in the center, 4 chairs per table. Whiteboard at the front.
  *   **Handouts:** 4 distinct "Agency Dossiers" (A, B, C, D). One set per table. (Text provided in Section 3).
  *   **Tokens:** 60 poker chips or paper slips ("Reputation Points").
  *   **Whiteboard Markers:** 4 colors.
  *   **Timer:** Visible to all.
  *   **Decision Card:** A single index card for the Facilitator.

  ## 3. Roles
  Divide the 16 students into 4 teams of 4. Each team represents a division within the **Inter-Agency Risk Council (IARC)**. They are advising the Director on whether to authorize "Project Echo" (sending a high-power reply to a confirmed extraterrestrial signal).

  **The Event:** "If we send Project Echo, what is the probability that it results in Hostile Contact (defined as verifiable harm to human infrastructure or population) within 50 years?"

  **The Teams (Asymmetric Briefings):**
  *   **Team A (Strategic Defense):** You view this as a **Geopolitical First Contact**. Your dossier contains data on historical first meetings between previously isolated human civilizations.
  *   **Team B (Astrophysics):** You view this as a **Cosmic Anomaly**. Your dossier contains data on the behavior of high-energy natural cosmic phenomena interacting with Earth.
  *   **Team C (Xenobiology):** You view this as an **Ecological Introduction**. Your dossier contains data on invasive species introductions into closed ecosystems.
  *   **Team D (Network Security):** You view this as a **Protocol Handshake**. Your dossier contains data on network handshake failures between incompatible legacy systems.

  **Hidden Information:** Each dossier provides a specific dataset and a formula. The datasets are curated to produce widely divergent probabilities (e.g., 5%, 45%, 85%, 50%). Each team believes their lens is the primary one.

  ## 4. Rules and Mechanics

  **Phase 1: Internal Assessment (20 Minutes)**
  1.  Open your Dossier. Do not show it to other teams.
  2.  Calculate the probability of Hostile Contact using *only* the data provided in your Dossier.
  3.  Write your probability on a private card.
  4.  Prepare a 2-minute statement defining your "Risk Category" (e.g., "This is a Geopolitical event") and your resulting probability.

  **Phase 2: The Council Floor (30 Minutes)**
  1.  Each team presents their Probability and Risk Category. The Facilitator writes these on the whiteboard in a table: *Team | Category | Probability*.
  2.  **Challenge Round:** Teams may challenge another team's *Risk Category*.
      *   To challenge, you must spend 1 Reputation Token.
      *   You must argue why the event fits *your* category better than *theirs*.
      *   The challenged team defends without spending tokens.
      *   The Facilitator awards 2 Tokens to the winner of the argument based on *plausibility*, not truth (since truth is unknowable).
  3.  **Revision:** Teams may privately revise their probability if they are convinced by a rival category, but they must announce the change and the reason.

  **Phase 3: The Recommendation (10 Minutes)**
  1.  The Council must submit a single consensus probability to the Director.
  2.  If you cannot agree, you must submit a "Split Report" listing all four probabilities.
  3.  **Payoff Rule:**
      *   If Consensus is reached: All teams get 5 Tokens.
      *   If Split Report: Teams get 0 Tokens for consensus.
      *   **Coherence Bonus:** Any team that ends with a probability that mathematically matches their original Dossier data gets 5 Tokens (reward for sticking to their logic).
      *   **Critique Bonus:** Teams keep Tokens won in Challenges.

  **Phase 4: The Decision (5 Minutes)**
  1.  The Facilitator (as Director) announces: "I will not reveal the outcome. The event is unique. We will never know if the probability was 'correct.' Your grade depends on the Debrief."

  ## 5. Payoff Scheme
  The incentive structure is designed to create tension between **Social Consensus** and **Epistemic Coherence**.
  *   **Consensus Bonus:** Pushes them to negotiate. To negotiate, they must compare Reference Classes.
  *   **Coherence Bonus:** Pushes them to stick to their data. If they simply average the numbers to reach consensus, they lose the Coherence Bonus.
  *   **Challenge Tokens:** Rewards identifying that a rival's Reference Class is *mismatched*, which paradoxically reinforces that *their own* class is also a choice.

  *Why this works:* Students will quickly realize they can get the Consensus Bonus by averaging, but they lose the Coherence Bonus. More importantly, during challenges, they will realize they cannot prove the other team *wrong*, only *different*. This creates the target frustration.

  ## 6. Timeline (90 Minutes)

  *   **00:00 – 00:05 (Setup):** Arrange tables. Distribute Dossiers face down. No introduction to the Reference Class Problem.
  *   **00:05 – 00:10 (Briefing):** Facilitator reads the "Mission Statement" (see below). Emphasize: "You must produce a number. You must use your data."
  *   **00:10 – 00:30 (Phase 1):** Teams work privately. Facilitator circulates to ensure they are using *only* their dossier data.
  *   **00:30 – 01:00 (Phase 2):** Presentations and Challenges. Facilitator manages the whiteboard table.
  *   **01:00 – 01:10 (Phase 3):** Final Decision.
  *   **01:10 – 01:30 (Debrief):** Structured discussion (see Section 7).

  **Facilitator Script (Briefing):**
  > "You are the Inter-Agency Risk Council. A signal has been detected. We have 45 minutes to recommend a risk probability to the Director. The Director needs a single number to authorize or veto Project Echo. You have internal data from your agency. Use it. Do not share your dossiers. Go."

  ## 7. Debrief
  *Do not lecture. Ask questions that force them to articulate the problem.*

  **Step 1: The Data Reveal (5 mins)**
  *   "Team A, what was your denominator? Team B, what was yours?"
  *   Write the classes on the board: *Civilizations vs. Cosmic Phenomena vs. Ecosystems vs. Networks.*
  *   "Did anyone calculate incorrectly?" (Likely no).
  *   "So the disagreement was not arithmetic. What was it?" (Target answer: We were counting different things).

  **Step 2: The Single Case (5 mins)**
  *   "Project Echo is one event. It either happens or it doesn't. Why did we need four numbers?"
  *   "If I ask 'What is the probability this specific coin flip is heads?', you say 50%. Why was Project Echo harder?"
  *   "Did the event change, or did the *description* of the event change?"

  **Step 3: The Selection Problem (5 mins)**
  *   "Team C, was Team A *wrong* to use Civilizations?" (They should say: No, it's defensible).
  *   "If both are defensible, and they give different answers, is there a 'True' probability?"
  *   "What rule did you use to pick your class?" (Target: Institutional role, intuition, stakes).
  *   "If the rule isn't in the math, where is it?"

  **Step 4: Naming the Problem (5 mins)**
  *   "In philosophy of science, this is called the **Reference Class Problem**. You just enacted it."
  *   "Reichenbach said: 'The principle of the reference class is that we must include the case in a class for which we have statistics.' But he didn't say *which* class."
  *   "How does this affect Bayesian updating? If your prior depends on a class choice, can evidence ever settle it?"

  ## 8. Predictable Failures & Adaptations

  **Failure 1: The "Average" Compromise.**
  *   *Symptom:* Teams immediately agree to average the four numbers to get the Consensus Bonus.
  *   *Fix:* During Phase 2, ask: "If you average them, which Reference Class are you using? Is 'Average of All Classes' a valid reference class in your dossier?" Force them to name the class for the average. They can't. This breaks the shortcut.

  **Failure 2: "We Need More Data."**
  *   *Symptom:* Teams refuse to commit, claiming their data is insufficient.
  *   *Fix:* Remind them of the Mission Statement: "The Director needs a number in 45 minutes. Refusal is a recommendation to veto, which is still a decision with a probability of 1.0 for safety."

  **Failure 3: Dominant Personalities.**
  *   *Symptom:* One student per team does all the work.
  *   *Fix:* Assign roles within teams: *Calculator* (does math), *Scribe* (writes defense), *Speaker* (presents), *Devil's Advocate* (must find one flaw in own logic).

  **Adaptation for Smaller Groups (8 students):**
  *   Merge teams: Defense/Astro vs. Bio/Tech. Two large reference class camps.
  *   Reduce Challenge Round to one direct duel.

  **Adaptation for Larger Groups (30+ students):**
  *   Add a "Media" role (5 students) who observe and report on which team sounds most confident, adding a layer of social construction to the probability.

  ## 9. Limitations
  *   **Frequency Data Exists:** In this activity, each class *has* frequency data (e.g., 4 out of 10). In real philosophical problems (e.g., "Probability of God's existence"), there is often *no* frequency data, only the Principle of Indifference. The facilitator must clarify in the debrief that the Reference Class Problem is *harder* when frequencies are absent.
  *   **Discrete Classes:** The activity presents four clean options. In reality, reference classes blur (e.g., "First contacts" vs. "First contacts involving nuclear powers"). The facilitator must note that the problem is continuous, not discrete.
  *   **Metaphysical Neutrality:** The activity does not resolve whether a "True" probability exists (Propensity vs. Frequentist vs. Bayesian). It only shows the *access* problem. The facilitator must avoid claiming there is no truth, only that we cannot access it uniquely.

  ---

  ### Appendix: Dossier Text (For Facilitator Preparation)

  **Dossier A (Defense):**
  *   **Classification:** RESTRICTED
  *   **Risk Category:** Geopolitical First Contact.
  *   **Data:** Review of 20 historical first-contact scenarios between isolated human civilizations (e.g., European/American, 1492-1900).
  *   **Statistic:** 12 out of 20 resulted in sustained conflict or subjugation within 50 years.
  *   **Calculation:** Risk = 12/20 = **60%**.
  *   **Mandate:** You must treat the Signal as an agent with intent.

  **Dossier B (Astrophysics):**
  *   **Classification:** PUBLIC
  *   **Risk Category:** Cosmic Anomaly Interaction.
  *   **Data:** Review of 100 high-energy cosmic events interacting with Earth's magnetosphere (1950-2020).
  *   **Statistic:** 2 out of 100 resulted in infrastructure damage (solar flares). None resulted in hostile intent.
  *   **Calculation:** Risk = 2/100 = **2%**.
  *   **Mandate:** You must treat the Signal as a natural phenomenon until proven otherwise.

  **Dossier C (Xenobiology):**
  *   **Classification:** INTERNAL
  *   **Risk Category:** Ecological Introduction.
  *   **Data:** Review of 50 instances of invasive species introduced to island ecosystems.
  *   **Statistic:** 40 out of 50 resulted in collapse of native dominant species.
  *   **Calculation:** Risk = 40/50 = **80%**.
  *   **Mandate:** You must treat information as a replicator similar to a biological agent.

  **Dossier D (Network Security):**
  *   **Classification:** TECHNICAL
  *   **Risk Category:** Protocol Handshake.
  *   **Data:** Review of 200 handshake attempts between incompatible legacy encryption systems.
  *   **Statistic:** 100 out of 200 resulted in system vulnerability or crash.
  *   **Calculation:** Risk = 100/200 = **50%**.
  *   **Mandate:** You must treat the Reply as a data packet transmission.
