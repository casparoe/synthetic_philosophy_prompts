      *   *Idea 1: The Insurance Actuary.* Students act as insurers pricing a policy for a unique event (e.g., "Will the first Mars colony survive 5 years?"). Different departments (Underwriting, Claims, Risk, Marketing) have different historical data sets they *could* use.
          *   *Pros:* Real-world stakes.
