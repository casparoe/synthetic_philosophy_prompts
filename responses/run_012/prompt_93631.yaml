answer: |-
  Based on the record you have provided, your colleague is navigating the tension between **humanitarian necessity** (the duty to stop mass killing) and **international order** (the prohibitions on aggression and regime change). She is not a pure pacifist, nor is she a pure cosmopolitan consequentialist. She occupies a "restrictivist" position common in contemporary Just War theory: intervention is permissible only under strict conditions, even when the humanitarian cause is just.

  Here are the two rules that fit her record, their predictions for your case, and my assessment of her likely response.

  ### 1. The Competing Rules

  **Rule A: Humanitarian Consequentialism (The "Body Count" Principle)**
  *   **The Rule:** An intervention is justified if it halts mass killing and the probable aftermath is not worse than the status quo. Procedural hurdles (like UNSC authorization) and the purity of motive are secondary to the preservation of life and regional stability.
  *   **Fit with Record:** This explains her support for Kosovo, Rwanda (inaction was wrong), Bosnia, East Timor, and Sierra Leone. It explains her rejection of Iraq and Libya *ex post* because both resulted in destabilization and state collapse (worse than the status quo). It explains her rejection of Bahrain because it suppressed rights rather than saving lives.
  *   **Prediction for Your Case:** **Justified.** The intervention saves 200,000 lives, halts mass killing, and the aftermath is estimated to be no worse than the status quo. The lack of UNSC authorization and the mixed motives are outweighed by the humanitarian outcome.

  **Rule B: Normative Restrictivism (The "Legitimate Agency" Principle)**
  *   **The Rule:** Intervention is justified only if undertaken by a legitimate authority (UNSC or a genuine multilateral coalition) with a primary intention of humanitarian protection. Unilateral action by a regional hegemon without UNSC authorization is impermissible, even in the face of atrocities, if it is driven by self-interest or opposed by the majority of the host population, because it erodes the norm against aggression.
  *   **Fit with Record:** This explains her support for East Timor and Bosnia (UNSC/Consent). It explains Kosovo as a *necessary exception* (last resort, multilateral NATO alliance, humanitarian public case). It explains her rejection of Iraq (unilateral/hegemonic, regime change aim), Bahrain (regional hegemony, suppression), and Libya (mandate stretched to regime change).
  *   **Prediction for Your Case:** **Unjustified.** The intervening power is a regional hegemon dominating a regional organization (not a genuine multilateral alliance like NATO), lacks UNSC authorization, faces majority opposition in the target state, and admits to self-interested regime change aims. This fits the pattern of aggression, not humanitarian intervention.

  ### 2. Where They Come Apart
  The rules diverge sharply on the **weight of intention and authority versus outcome.**
  *   **Rule A** looks at the *result*: 200,000 lives saved > procedural violations.
  *   **Rule B** looks at the *act*: Hegemonic invasion + admitted self-interest = corruption of the humanitarian norm, regardless of lives saved.

  ### 3. The Closest Analogue
  The closest analogue is **Kosovo (1999)**.

  *   **Why:** It is the only case in her record where she justified an intervention *without* Security Council authorization to stop mass killing against a minority population. Structurally, your hypothetical is "Kosovo 2.0": unauthorized, humanitarian trigger, minority support.
  *   **The Tension:** However, your case contains features of **Iraq (2003)** that Kosovo lacked: a *frankly admitted* intention to install a client government and secure economic terms, and the opposition of the *majority* of the host population (Kosovo was a secessionist conflict within a disintegrating federation; your case is a cross-border invasion of a sovereign state).
  *   **Why Kosovo Wins as the Analogue:** The decision hinges on whether she views your case as falling *within* the "Kosovo Exception" (humanitarian necessity trumps procedure) or *outside* it (hegemonic aggression trumps humanitarian benefit). Since Kosovo is the only successful precedent for unauthorized humanitarian action she accepts, it is the benchmark against which she will measure the new case.

  ### 4. The Bet
  I would bet on **Rule B (Normative Restrictivism)**. She will likely say the intervention is **unjustified**.

  **Reasoning:**
  The critical clue is her qualification on Kosovo. She explicitly identifies the "Russia Precedent" (using humanitarian claims to justify aggression) as a *cost* of the intervention. She was willing to pay that cost in 1999 because the alternative was ethnic cleansing in Europe by a pariah regime (Milosevic's Serbia).

  Your hypothetical case is not the 1999 scenario; it is the **realization of the fear she expressed.** It is a regional power using the "protection of threatened populations" pretext to install a client government and secure economic terms, exactly as Russia later did in Georgia and Ukraine.

  If she justifies your case, she validates the very precedent she identified as a cost. A theorist concerned with the long-term integrity of international norms (evidenced by her worry about precedent) will likely prioritize containing the "aggression disguised as humanitarianism" norm over the immediate consequentialist gain, especially since the intervening power has *admitted* its self-interest. In her view, allowing this sets a rule that any regional hegemon can invade a neighbor if they claim a minority is at risk, which ultimately threatens more lives than it saves in the long run.

  ### 5. The Test Case
  To separate Rule A (Consequentialism) from Rule B (Restrictivism) in a future conversation, present her with this scenario:

  **The "Honest Imperialist" Case:**
  > The Security Council *authorizes* an intervention to stop a genocide. The intervening power openly admits its motive is to secure long-term basing rights and resource contracts in the target state. The intervention succeeds: the genocide stops, 200,000 lives are saved, and the country remains stable.

  *   **Rule A Predicts:** **Justified.** (UNSC authorization + Good Outcome).
  *   **Rule B Predicts:** **Unjustified (or a Mistake).** (Corrupt Intention).

  **Why this separates them:**
  Your colleague rejected Libya because the *pursuit of regime change* corrupted a UNSC mandate. If she rejects the "Honest Imperialist" case despite the UNSC stamp and the saved lives, it confirms that **Right Intention** is a necessary condition for her, not just a tie-breaker. If she accepts it, it confirms she is a Consequentialist who views UNSC authorization as a sufficient "clean hands" mechanism regardless of motive. Given her critique of Libya, I suspect she will reject it, further confirming Rule B.
