      *   **Key Requirements:**
          *   List the cases a theory must handle (Asymmetry, Non-Identity, Repugnant Conclusion, Sadistic Conclusion/Mirror, Variable Population Comparisons).
          *   List the distinctions a theory must maintain (Wrong vs. Bad for Someone, Worse than Nothing vs. Bad, Better for Person vs. Better simpliciter, Person-Affecting vs. Impersonal).
          *   **Crucial:** Identify impossibility results (which desiderata are mutually inconsistent).
          *   **Crucial:** Provide an honest assessment of which are "genuine requirements" vs. "camp house styles."
          *   **Crucial:** Advise on what to sacrifice if conflicts arise.
          *   **Constraint:** Do not grade actual views (Utilitarianism, Prioritarianism, etc.); just provide the checklist and the conflict analysis.
      *   **Tone:** Philosophical, rigorous, direct, slightly informal but high-level (matching the user's "going too deep... thing explodes" vibe).

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   *The Asymmetry:* Misery is bad to create; Happiness is not required to create. (Parfit's intuition).
      *   *The Non-Identity Problem:* Actions affecting *who* exists can't be judged by harm to specific individuals if those individuals wouldn't exist otherwise. A theory needs to condemn reckless procreation even if the child's life is worth living.
      *   *The Repugnant Conclusion:* Total Utilitarianism implies a massive population with barely worth-living lives is better than a smaller, very happy population. Most find this counterintuitive.
      *   *The Sadistic Conclusion (The Mirror):* Adding miserable people is worse than adding happy-but-low-welfare people. (Avoiding the Repugnant Conclusion sometimes leads here).
      *   *Transitivity/Completeness:* Can we rank all outcomes? Does A > B and B > C imply A > C?
      *   *Person-Affecting Restriction:* Wrongness requires a victim. (The "Narrow Person-Affecting View").
      *   *Existence Independence:* The value of an outcome shouldn't depend on who exists in it (often conflicts with Person-Affecting).

  3.  **Identify the Impossibility Results (The "Explosion"):**
      *   *Parfit's Trilemma:* We can't have all of: (1) Total Utilitarianism (avoiding Repugnant Conclusion), (2) The Asymmetry, (3) Person-Affecting View. (Actually, it's more nuanced).
      *   *Arrhenius's Impossibility Theorems:* Gustaf Arrhenius proved that no theory can satisfy a set of very plausible adequacy conditions simultaneously.
      *   *Key Conflict:* The Asymmetry + Avoiding Repugnant Conclusion + Avoiding Sadistic Conclusion + Transitivity + Person-Affecting.
      *   *Specific Tension:* The "Non-Identity" vs. "Person-Affecting." If you stick strictly to Person-Affecting, you can't condemn Non-Identity cases (e.g., climate change causing future miserable people who wouldn't exist otherwise).

  4.  **Drafting the Content - Section by Section:**

