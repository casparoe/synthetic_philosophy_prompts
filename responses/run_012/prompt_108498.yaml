      *   *SI:* Algorithmic Probability. Data is a binary string generated by some computable distribution. Prior is $2^{-K(x)}$ where $K$ is Kolmogorov Complexity (length of shortest program on a UTM). Prediction is a weighted sum over all computable hypotheses.
      *   *Stats:* Parametric models $P_\theta$. Priors $\pi(\theta)$. Likelihood $L(\theta|data)$. Model selection via penalized likelihood (AIC/BIC) or CV.
      *   *The Bridge:* MDL (Minimum Description Length) is the usual bridge, but the user asked specifically about Solomonoff.
      *   *The "Theorem":* Solomonoff's Convergence Theorem. The expected squared error (or KL divergence) between the universal predictor $M$ and the true distribution $\mu$ is bounded by $-\log w_\mu$, where $w_\mu$ is the prior weight of the true distribution in the mixture. Since $w_\mu \approx 2^{-K(\mu)}$, the error is bounded by $K(\mu) \ln 2$.

