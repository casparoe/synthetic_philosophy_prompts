      *   *Model Class:* Instead of $\{\mathcal{M}_k\}$, think of the set of all computable probability measures.
      *   *Prior:* Instead of $\pi(\theta)$, it's a discrete prior over programs $p$. $P(p) = 2^{-|p|}$. This induces a prior over distributions.
      *   *Likelihood:* Standard $P(data | \text{program})$.
      *   *Penalty:* The prior *is* the penalty. $\log P(p) = -|p| \log 2$. Maximizing posterior $\propto$ Maximizing Likelihood - Length. This looks like BIC/MDL.
