  I'm working through W. E. B. Du Bois's 1926 address "Criteria of Negro Art," and one sentence keeps stopping me. He has just asked his audience what they would want if the color line vanished and they became rich and powerful, and after rejecting the obvious answers he writes:

  "there has come to us not only a certain distaste for the tawdry and flamboyant but a vision of what the world could be if it were really a beautiful world; if we had the true spirit; if we had the Seeing Eye, the Cunning Hand, the Feeling Heart; if we had, to be sure, not perfect happiness, but plenty of good hard work, the inevitable suffering that always comes with life; sacrifice and waiting, all that -- but, nevertheless, lived in a world where men know, where men create, where they realize themselves and where they enjoy life."

  What I can't get past is the triad: Seeing Eye, Cunning Hand, Feeling Heart. Each term seems to name a different faculty -- perception, craft, affect -- and they're stacked in a way that feels almost liturgical, but I can't tell whether they're meant as three separate goods, as a single indivisible disposition, or as a rhetorical escalation. And whatever they are, I don't see how they connect to the argument the essay is building toward, since the essay is usually remembered for insisting that all art is propaganda and that the "purist" objection is a dodge. Help me read this passage.

  Please structure your answer as follows:

  - "Context" (about 80 words): where this passage sits in the essay's arc and what it's doing rhetorically at that moment.
  - "The three images" (about 250 words): what each of Seeing Eye, Cunning Hand, and Feeling Heart picks out, and whether they should be read as distinct capacities, a sequence, or one fused ideal. Say what you take "the true spirit" to be doing in front of them.
  - "The propaganda connection" (about 200 words): how this vision of "a beautiful world" relates to Du Bois's claim about art as propaganda -- does it support that claim, complicate it, or sit in tension with it?
  - "What remains unclear" (about 80 words): the two or three interpretive questions you'd flag as genuinely unresolved.
