  Thinking Process:

  1.  **Analyze the Request:**
      *   **Core Mechanic:** An epistemic trap based on the "sensitivity condition" of knowledge (Nozick-style tracking).
          *   Person knows Fact A (narrow, checked, sensitive to truth).
          *   Person knows A implies B (logical/structural dependency).
          *   Person *does not* know Fact B (broad, unchecked, insensitive belief). They would believe B regardless of its truth.
          *   Crucially: A is true, and they *know* A. The twist isn't that A is false. The twist is the structural vulnerability caused by not knowing B despite relying on it.
      *   **Requirement:** The trap must be the engine of the story, not decoration.
      *   **Requirement:** Real consequences. A decision made under pressure.
      *   **Requirement:** No "wise friend explains the lesson" ending. Show, don't tell.
      *   **Requirement:** Make the reader feel the gap as a lived thing.

  2.  **Deconstruct the Epistemic Trap:**
      *   *Fact A:* Something observable, verifiable, specific. (e.g., a gauge reading, a ledger balance, a sensor status).
      *   *Fact B:* The underlying condition that makes A safe/meaningful. (e.g., the integrity of the system, the honesty of the counterparty, the stability of the foundation).
      *   *The Gap:* The protagonist trusts B implicitly (insensitive belief) while vigilantly monitoring A (sensitive belief).
      *   *The Crisis:* A situation arises where acting on A requires B to be true. If B is false, acting on A leads to disaster, even if A is accurately known.

