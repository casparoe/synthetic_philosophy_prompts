      *   *Wait, I need to answer the specific question:* "Whether my functionalism plus my rejection of substrate chauvinism already commits me to colony minds."
      *   *Answer:* No, *provided* that (3) and (8) are interpreted as functional constraints, not substrate constraints. The risk is that they *are* secretly substrate constraints.
      *   *Audit:* (8) is the weak link. "Public workspace" vs "Private representation." If the system is the colony, the workspace is internal. If you deny it because it's diffuse/slow, that's a functional claim. If you deny it because it's chemical/external to ants, that's chauvinism.

      *   *Plan:*
          1.  Validate the package (it's mostly coherent).
