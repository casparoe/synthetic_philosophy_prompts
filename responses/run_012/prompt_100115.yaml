      *   *Decision:* The most severe tension is between **Anti-Chauvinism (6)** and the **Representational Vehicle Condition (8)**.
      *   *Why:* (8) disqualifies the pheromone field based on its "public" nature. But relative to the *colony system*, that field is internal. Disqualifying it risks violating (6) by privileging neural (private) encoding over chemical (diffuse) encoding.
      *   *Second Severity:* **Functionalism (2)** vs. **No Beliefs/Desires (5)**. If the colony functionally behaves *as if* it has beliefs (hypothesis testing in nest site selection), (2) pushes toward attributing beliefs. (5) resists. (8) is the bridge, but if (8) falls, (5) falls.
