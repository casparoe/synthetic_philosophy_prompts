          *   *Wait, if I do that, does it force a mind?* Yes, likely.
          *   *So, to save (5) (No Mind):* The revision must be to **strengthen (3)**. Unity isn't just integration; it requires *binding* that precludes the kind of latency and decentralization found in colonies.
          *   *Actually, the cleanest fix:* **Adopt a "Mark of the Cognitive" that distinguishes (5) from (2).** The user says (2) Functionalism about *mental states*. But (5) denies *minded system*.
          *   *Best advice:* The tension is between (2) and (5). (2) says function defines mind. (4) says colony has function. (5) says no mind. (8) tries to patch this.
