answer: |-
  **The Syndicate Offer**

  Elena holds £100,000 in liquid assets, representing her entire net worth. She is offered a one-off opportunity to join a property renovation syndicate. The terms are indivisible: the minimum buy-in is £25,000, with no option for partial stakes. The project has a 55% probability of success, doubling her stake (returning £50,000), and a 45% probability of total failure (returning £0). All parties agree on these probabilities and payoffs. The decision is single-shot; there is no opportunity to rebalance or reinvest proceeds from this specific venture elsewhere.

  **Analysis**

  The expected monetary value (EMV) of the £25,000 stake is positive: $(0.55 \times £50,000) + (0.45 \times £0) - £25,000 = £2,500$. Expected-value (EV) maximisation prescribes accepting the offer; the positive edge is substantial enough to tempt a prudent agent, representing a 10% expected return on capital at risk.

  However, the Kelly criterion evaluates the expected geometric growth rate. The optimal Kelly fraction for a bet paying 1:1 with a 55% win probability is $f^* = p - q/b = 0.55 - 0.45/1 = 0.10$. Elena should ideally stake only 10% of her wealth (£10,000). Because the minimum stake is fixed at 25% (£25,000), she is forced to overbet. The expected log-growth at this forced stake is $0.55 \ln(1.25) + 0.45 \ln(0.75) \approx 0.1227 - 0.1295 = -0.0068$. Since the expected change in log-wealth is negative, Kelly prescribes declining the offer. The divergence arises not from risk aversion, but from the *indivisibility constraint* forcing the agent into the 'ruin zone' where volatility drag outweighs the arithmetic edge.

  If we remove the indivisibility constraint and allow arbitrarily small stakes, the divergence on participation collapses: Kelly recommends accepting the bet at the optimal 10% stake, aligning with EV on the decision to participate (though disagreeing on size). If we instead allow the bet to be repeated many times *without* adjusting stakes, the divergence persists: the negative geometric growth ensures eventual ruin, confirming Kelly's rejection. If repetition allows stake adjustment, Kelly again recommends participation at 10%, while EV recommends leveraging to 100% each round, restoring the divergence on *magnitude* but not participation.

  A defender of EV maximisation would argue that the Kelly verdict merely smuggles in a specific utility function (log-wealth) under the guise of objective rationality. They would claim that for a one-shot decision, maximising the arithmetic mean is the only coherent standard, and that rejecting positive EMV is irrational conservatism. The Kelly defender replies that log-wealth is not a subjective preference but the invariant measure of long-term growth rate. Even in a one-shot context, they argue, rationality requires respecting the non-ergodic nature of wealth dynamics: what happens to the ensemble (positive EMV) does not equal what happens to the individual through time (negative geometric growth). The constraint forces a choice between a positive expectation of wealth and a negative expectation of growth; Kelly prioritises the latter as the condition for remaining in the game.
