answer: |-
  **MEMORANDUM**

  **TO:** The Advisory Board, Natural History Museum
  **FROM:** Prof. [Your Name], Department of Philosophy of Science
  **DATE:** 14 January 2025
  **SUBJECT:** Recommendation for Final Timeline Panel: The Anthropocene Question

  Colleagues,

  With the fabrication deadline in April approaching, we must resolve the status of the present day on our timeline wall. The debate has crystallised around a tension between stratigraphic formalism and public pedagogy. As a philosopher of science, I urge the Board to recognise that the question before us is not merely geological, but epistemological: is the onset of the Anthropocene a matter of *discovery* (locating a specific signal in the rock record) or *stipulation* (agreeing on a convention to mark a shift in Earth system dynamics)?

  **The Status of the Term**
  Our geologist colleagues are correct to note that in 2024 the International Union of Geological Sciences (IUGS) declined to ratify the Anthropocene as a formal epoch. The subcommission's vote favoured maintaining the Holocene. To label the present a formal epoch would indeed contradict the current international stratigraphic code.

  However, the IUGS statement accompanying that rejection explicitly acknowledged that 'Anthropocene' will continue to be used by scientists and the public to describe significant human impact on the Earth system. A natural history museum is not a subcommission; our mandate is to interpret scientific consensus for the public, not to enforce nomenclatural orthodoxy. To omit the term entirely, as the third group suggests, would be to ignore a dominant framework in contemporary earth system science. We ought to adopt the term, but qualify its status.

  **Boundary and Convention**
  Regarding the boundary marker, we must distinguish between a GSSP (a physical 'golden spike' in a rock sequence, such as Crawford Lake) and a GSSA (a Global Standard Stratigraphic Age, which is a stipulated date). For deep time, where rock records are fragmentary, we rely on stipulated dates. For the present, a stipulated date is likewise appropriate for a display panel, as we cannot exhibit a core sample in a timeline wall.

  While rival proposals exist—such as the 1610 'Orbis Spike' (marking the CO₂ dip following the colonisation of the Americas) or the late 18th-century Industrial Revolution—the mid-20th century remains the most robust marker for the *Great Acceleration*. This is when human activity became the dominant driver of planetary change, detectable globally through radionuclides, plastics, and carbon isotopes.

  **Recommendation**
  I propose the Board adopt the following specifications for the final panel:

  1.  **Label:** 'The Anthropocene (informal unit)'
  2.  **Boundary Date:** c. 1950
  3.  **Explanatory Text:**
      > 'While the International Union of Geological Sciences voted in 2024 not to formalise the Anthropocene as a geological epoch, the term remains in widespread scientific use to describe the period in which human activity became a dominant force in the Earth system. This boundary marks the "Great Acceleration" of the mid-20th century. Some scientists argue for earlier onsets, such as the industrial revolution or the ecological changes following 1610, reflecting ongoing debate about when human influence became geological.'

  **Design Timeline**
  To meet the April fabrication deadline, I recommend we finalise this text by **1 February**. This allows the design team three weeks for layout and proofing before sending to fabrication.

  **Conclusion**
  This approach honours the geologists' concern for accuracy by acknowledging the IUGS decision, while satisfying the curator's goal of highlighting human agency. It treats the boundary not as a discovered fact etched in stone, but as a necessary stipulation to help visitors comprehend the scale of contemporary change. We can acknowledge the rejection of the *epoch* without denying the reality of the *event*.

  I look forward to discussing this at the next meeting.

  Yours sincerely,

  Prof. [Your Name]
