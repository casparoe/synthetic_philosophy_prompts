      *   *Case 3: "Birth of modern science" (Modest result).*
          *   Function: Causality/Rupture claim.
          *   Geography: "Modern science" implies a specific lineage.
          *   Necessity: This is the hook.
          *   Verdict: This is the "Hand-off" case. The label *is* the story. The procedure can't solve the hype; the journalist must decide to fight the hype or sell it.

  4.  **Refining the Output Structure:**
      *   **The Procedure:** Keep it tight. 5 Questions. Clear "If/Then" logic.
