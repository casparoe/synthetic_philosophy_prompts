      *   *Decision Rules:* If it fails Q2, cut. If it fails Q1 (it's a narrative claim), verify or cut. If it passes all, keep but qualify.
      *   *The Hand-off:* When the label *is* the story.

  3.  **Applying the Procedure to the Three Cases:**

