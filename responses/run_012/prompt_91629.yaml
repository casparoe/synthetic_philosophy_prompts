      *   *Strategy:* Case 3 is the refusal to settle (editorial stakes). Case 2 is likely the "answer you won't like" because it forces you to abandon a convenient synchronizing term that editors love but historians hate, or vice versa. Let's argue the procedure forces you to *cut* "Early Modern" for South Asia, which might annoy an editor wanting reader familiarity. Or, perhaps the procedure forces you to *keep* "Medieval" in Case 1 for clarity, which you know is intellectually dishonest.
      *   *Better approach:* The procedure should be rigorous. If it's rigorous, it will tell you to cut "Medieval" in Case 1 (good). It will tell you to cut "Early Modern" in Case 2 (hard but good). It will *fail* on Case 3 because the story *depends* on the hype. That's the refusal to settle.
      *   *Where is the answer I won't like?* Maybe Case 1. If the procedure says "Keep it for reader clarity despite historical inaccuracy," that's the answer the journalist won't like (compromising integrity). OR, if the procedure says "Cut it," and the journalist knows the editor will kill the lede. Let's go with: The procedure tells you to cut the label in Case 2 (South Asia), which creates friction with standard magazine style that relies on those buckets for reader orientation.

  5.  **Final Polish of the Procedure (Mental Check):**
