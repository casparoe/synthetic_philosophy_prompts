answer: |-
  ### The 4 PM Decision Procedure for Period Labels

  **The Core Distinction**
  Before starting, identify how the label functions in your sentence.
  *   **Timestamp:** The label acts as a coordinate (e.g., "In the 14th century..."). It claims nothing about *why* things happened, only *when*.
  *   **Claim:** The label acts as an explanation or valuation (e.g., "The Renaissance brought light..."). It implies a rupture, a cause, a peak, or a decline.

  **The Procedure (5 Questions)**
  Run these in order. If you answer "No" at any step, follow the instruction immediately.

  1.  **The Source Test:** Did this label come from the press release or the researcher's pitch?
      *   *Yes:* Assume it is a **Claim** designed to sell importance. Proceed to Q2.
      *   *No:* You chose it for orientation. It is a **Timestamp**. Skip to Q3.
  2.  **The Evidence Test:** Does the text following the label prove the rupture/valuation implied by the label?
      *   *Yes:* Keep the label, but ensure the proof is in the first three paragraphs.
      *   *No:* **Cut the label.** Replace with a date range. (You cannot borrow importance you haven't earned).
  3.  **The Geography Test:** Is the subject matter outside Western Europe?
      *   *Yes:* **Cut the label.** (Terms like *Medieval*, *Renaissance*, *Early Modern* are European periodizations. Using them elsewhere imports European causality). Replace with dynasty, region, or date.
      *   *No:* Proceed to Q4.
  4.  **The Swap Test:** Can you replace the label with a specific year or century without losing the reader?
      *   *Yes:* **Cut the label.** (If "1450" works, "Late Medieval" is doing unnecessary narrative work).
      *   *No:* Proceed to Q5.
  5.  **The Stakes Test:** If you remove the label, does the lede collapse because the *period itself* is the story (e.g., a story about how we define the Renaissance)?
      *   *Yes:* **Hand-off.** (The procedure stops here. This is an editorial choice about the story's thesis, not a fact check).
      *   *No:* **Cut the label.** Use a date.

  ***

  ### Running the Procedure

  #### Case 1: The "Last Flowering of the Medieval World" (Manuscript Find)
  *   **Q1 (Source):** Likely from the press release to dramatize a manuscript. **Verdict:** Treat as Claim.
  *   **Q2 (Evidence):** Does the manuscript prove the "end" of an era or a "flowering"? Usually, a single object cannot prove a macro-historical shift. **Verdict:** No.
  *   **Action:** **Cut the label.**
  *   **Revision:** "A 14th-century manuscript..." or "A manuscript from 1390..."
  *   **Result:** The procedure kills the romantic hook. It forces you to describe the object, not the era.

  #### Case 2: "Early Modern" South Asia (Same Centuries)
  *   **Q1 (Source):** Likely from the researcher to synchronize with European timelines for a Western audience. **Verdict:** Treat as Claim/Timestamp hybrid.
  *   **Q2 (Evidence):** Does the story prove South Asia was undergoing the *specific* ruptures that define "Early Modern" Europe (print, capitalism, nation-state)? Often, no.
  *   **Q3 (Geography):** Is it outside Western Europe? **Yes.**
  *   **Action:** **Cut the label.**
  *   **Revision:** "In 16th-century India..." or "During the Mughal expansion..."
  *   **Result:** The procedure forces you to abandon a convenient synchronization tool.

  #### Case 3: "Birth of Modern Science" (Modest Result)
  *   **Q1 (Source):** Definitely the press release. **Verdict:** Treat as Claim.
  *   **Q2 (Evidence):** Does a modest experiment prove the "birth" of a global system? **No.**
  *   **Action:** **Cut the label.**
  *   *However:* If you cut the label, the story loses its news value. The editor bought this story *because* of the "Birth" framing.
  *   **Q5 (Stakes):** Is the period framing the actual story? If the story is *about* the experiment, the answer is No. If the story is *about* how we define science, the answer is Yes.
  *   **Action:** **Hand-off.**
  *   **Result:** The procedure identifies that the label is the product being sold. It cannot fix the hype; it only flags that the hype is unproven.

  ***

  ### The Verdict

  **Which case the procedure refuses to settle:**
  **Case 3 ("Birth of Modern Science").**
  The procedure triggers the **Stakes Test (Q5)** and hands the call to you and your editor. This is because the label is not describing the past; it is selling the magazine issue. The procedure can tell you the claim is unsupported (Q2), but it cannot tell you whether to run a story that relies on an unsupported claim to get readers. That is a business and editorial judgment, not a historical one. You must decide if you are reporting the science or reporting the hype.

  **Where it gives an answer you will not like:**
  **Case 2 ("Early Modern" South Asia).**
  The procedure demands you **Cut the label (Q3)**. You will not like this because "Early Modern" is a useful heuristic for general-interest readers to understand *when* this is happening relative to the West. It provides a mental anchor. By forcing you to use "16th-century India" or "Mughal," the procedure makes the timeline harder for your audience to place, which may frustrate your editor who wants immediate reader orientation. The procedure prioritizes historical precision over reader convenience, and on a tight deadline, that precision feels like an obstacle to clarity. You will want to argue that "Early Modern" is now a global term; the procedure treats it as a European export. You have to choose: accuracy or accessibility.
