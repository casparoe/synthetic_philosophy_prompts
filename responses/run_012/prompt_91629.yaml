      *   *Step 3: The Geography Test.* Does this fit outside Europe? (Crucial for the South Asia case).
      *   *Step 4: The Causality Test.* Does the label explain *why* something happened, or just *when*?
      *   *Step 5: The Stakes Test.* If we remove it, does the story collapse? (This is the hand-off point).

      *Refining the Steps:*
