prompt: |-
  I am a retired experimental physicist who has spent the past few years teaching himself philosophy, and I have been asked to run a ninety-minute session for a university reading group that has been working through decision theory — about fourteen people, a mix of graduate students and staff, all comfortable with expected values and payoff matrices but not with the philosophical literature.

  What I want them to feel is the pull of superrationality: the thought that when two agents confront the same problem by the same reasoning, each may treat the other's choice as a function of her own, so that cooperating in a one-shot prisoner's dilemma can be rational with no communication, no contract, and no repetition. They should get there by playing, not by being told; the name should come only in the debrief.

  My sketch, which you should feel free to improve or replace outright: each participant privately writes a short decision rule — a few lines of plain conditional reasoning, no programming skill assumed — and hands it in. I then play every rule against every other rule and against itself in a round robin, using the usual payoffs, where mutual cooperation beats mutual defection and unilateral defection beats mutual cooperation, and I post the running scores. I expect the self-play entries to be the hinge. Into the pool I also slip a few facilitator-written bots, including at least one that defects unconditionally and one that mirrors whatever rule it is paired with.

  Give me the rules, the materials, the payoff scheme (no real money), a minute-by-minute timeline, and a debrief that maps what happened onto the idea: the fixed-point character of a rule that fares well against its own copy, the tension between topping the scoreboard and being the sort of agent that can be mirrored, and what the presence of the defecting bots does to the lesson.

  Then tell me what will predictably go wrong the first time, and be frank about what the activity cannot reproduce — in particular the first-person inference that my choice just is his choice, and the case where the two agents are only partly alike, where I gather the notion is far less clean. Finally, say what would change your mind about the design: which pattern of results in the room would show that I am in fact teaching ordinary reciprocity or risk-aversion rather than the idea I am after.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **User:** Retired experimental physicist, self-taught philosopher.
      *   **Audience:** 14 people (grad students + staff), comfortable with math/decision theory (EV, payoff matrices), *not* familiar with philosophical literature.
      *   **Goal:** Make them *feel* the pull of superrationality (Hofstadter's concept) in a 90-minute session. Key insight: Cooperating in a one-shot PD can be rational if agents reason identically.
      *   **Method:** Experiential/Active learning ("get there by playing, not by being told"). Name drop only at the end.
      *   **Proposed Mechanism:** Participants write decision rules (plain English conditionals). Round-robin tournament (rule vs. rule, including self-play). Facilitator adds bots (Always Defect, Mirror).
      *   **Deliverables:** Rules, Materials, Payoff Scheme, Timeline, Debrief (mapping to fixed-points, tension between winning vs. being mirrorable, role of defectors).
      *   **Critique:** Predictable failures, limitations (first-person inference, partial similarity), and success/failure criteria (what would change my mind about the design).

  2.  **Evaluate the Proposed Mechanism (The "Tournament of Rules"):**
      *   *Strengths:* Engages their analytical side. Self-play highlights the fixed-point nature. Mirroring bots demonstrate the vulnerability of cooperation.
      *   *Weaknesses:* Writing rules in plain English is ambiguous. Interpreting rules programmatically is hard for a human facilitator in real-time. "Rule vs. Rule" logic can get messy (e.g., "If they cooperate, I cooperate" vs. "If they defect, I defect" leads to infinite loops or ambiguity).
      *   *Refinement:* Need to simplify the rule submission to ensure executability. Instead of open-ended text, provide a structured template or a very constrained set of options. However, the prompt asks for "plain conditional reasoning." I need to make sure the facilitator can actually run this. *Correction:* The facilitator (physicist) can probably handle logic, but 14 rules = 14x14 = 196 pairings. That's too many to do manually in 90 mins.
      *   *Adjustment:* Reduce the number of pairings. Or, pre-select a few representative rules from the group to run against the bots and each other. Or, use a spreadsheet projected on screen where the logic is pre-set, but the *parameters* are chosen by the students.
      *   *Better Approach:* Keep the spirit of the user's sketch but make it logistically feasible. 14 participants writing rules is great, but running a full round-robin live is impossible.
      *   *Solution:* Participants write rules. Facilitator collects them. Facilitator *simulates* the tournament (perhaps using a laptop/script prepared beforehand, or just selecting 4-5 distinct archetypes from the submissions to run live). Actually, the prompt implies the facilitator *plays* the rules. If I'm the facilitator, I can't manually compute 196 interactions in real time.
      *   *Pivot:* I need to advise the user to use a simple spreadsheet or script they have prepared to process the text rules, OR simplify the input. Let's suggest a "Strategy Card" with checkboxes to make parsing instant.
      *   *Wait, one more constraint:* The user wants them to feel the *pull* of superrationality. The key moment is seeing that a strategy that cooperates with *itself* gets a high score, while a strategy that defects against *itself* gets a low score, even if the defector beats the cooperator in a head-to-head.
      *   *Logistical Fix:* 14 rules is too many for a live demo. I will suggest collecting the rules, grouping them into archetypes (Cooperate, Defect, Conditional), and running a tournament with *those* archetypes + the Facilitator Bots. OR, have them submit rules, and the Facilitator runs a "highlight reel" of 5 key matchups live.
      *   *Decision:* I will stick close to the user's sketch but add a logistical constraint: The "Tournament" will be run on a projected spreadsheet that calculates outcomes based on the logic provided. I need to ensure the rules are parsable. I will suggest a specific format for the rules to avoid ambiguity (e.g., "If opponent does X, I do Y").

  3.  **Drafting the Session Plan:**

      *   **Payoff Matrix:** Standard PD. T > R > P > S. (Temptation 5, Reward 3, Punishment 1, Sucker 0).
      *   **Materials:** Slips of paper, projector, spreadsheet (pre-prepared logic engine), whiteboard.
      *   **Timeline:**
          *   0-10: Intro & PD setup (no theory yet).
          *   10-25: Rule writing (crucial phase).
          *   25-55: The Tournament (Live execution).
          *   55-75: Analysis/Debrief (The philosophical heavy lifting).
          *   75-90: Q&A / Superrationality reveal.
      *   **Debrief:** Connect self-play scores to the concept of "acting as a representative of your reasoning type."

  4.  **Addressing the "Superrationality" Nuance:**
      *   Standard Game Theory: Dominant strategy is Defect.
      *   Superrationality (Hofstadter): If we are identical rational agents, my decision determines yours. Therefore, I choose the outcome (CC or DD) I prefer. I prefer CC. So I Cooperate.
      *   The Activity must show: Defecting wins head-to-head against Cooperate. But Cooperate wins the *tournament* if there are enough Cooperators (specifically, if it plays itself).
      *   *Crucial distinction:* This isn't Iterated PD (Tit-for-Tat). This is One-Shot. The rules must not rely on history. They must rely on *simulation* or *logical deduction* of the opponent.
      *   *Problem:* How do you write a rule for a one-shot game without history? "If I think they will cooperate, I cooperate." This is where the logic gets tricky.
      *   *Refinement for the Activity:* Allow rules like "Cooperate if the opponent's rule is identical to mine" or "Cooperate if the opponent is known to be cooperative."
      *   *Actually, to make it work physically:* The facilitator acts as the "universe." When Rule A meets Rule B, the Facilitator determines the outcome.
      *   *The "Mirror" Bot:* This is the key. If I play Mirror, and you play Cooperate, I Cooperate. If you play Defect, I Defect.
      *   *The "Self-Play" Hinge:* A rule that says "Do what the opponent does" (Mirror) gets CC against itself (3+3=6). A rule that says "Always Defect" gets DD against itself (1+1=2). Even though Defect beats Mirror head-to-head (5+0), Mirror scores higher overall if it meets itself often.
      *   *Wait, Superrationality is about the *reasoning*, not just the strategy.* The activity needs to highlight that *writing the rule* is the act of reasoning. If we all write the same rule, we all get the same outcome.

  5.  **Predicting Failures (The "Frank" Critique):**
      *   *Ambiguity:* "If they look nice" isn't executable.
      *   *Looping:* "I do what they do" vs "I do opposite" = Crash.
      *   *Misinterpretation:* Students might think this is about trust or reputation (Iterated PD confusion).
      *   *The "First-Person" Gap:* The activity shows *third-person* correlation (rules matching). It doesn't prove *first-person* causation (my choice *is* their choice). This is the hardest philosophical leap.
      *   *Partial Similarity:* Superrationality breaks down if agents aren't identical. The activity assumes rules are discrete. Real reasoning is fuzzy.

  6.  **Success/Failure Criteria:**
      *   *Success:* Students argue that Cooperating is rational *because* it maximizes utility given the symmetry of reasoning, not because it's "nice."
      *   *Failure:* Students conclude "Tit-for-Tat is best" (missing the one-shot aspect) or "It depends on the population" (standard evolutionary game theory, not superrationality). If the winner is "Always Defect" because everyone else was naive, the lesson fails.

  7.  **Refining the Design (Self-Correction during drafting):**
      *   *Constraint:* 90 minutes is tight for 14 people writing rules and a round robin. 14 rules = 105 unique pairings + 14 self-play = 119 matchups. Even at 1 min each, that's 2 hours.
      *   *Fix:* I must advise the user to *sample* the rules or use a pre-written script to calculate instantly. I will suggest a "Hybrid" approach: Collect rules, group them into 4-5 canonical types live, and run the tournament on those types. This preserves the "their rules" feel without the logistical nightmare.
      *   *Better Fix:* Ask them to write rules, but the Facilitator has a Python script (or Excel sheet) ready to parse keywords. "Cooperate", "Defect", "Mirror".
      *   *Best Fix for a Physicist:* They can probably handle a spreadsheet. I will design the "Rule Card" to be machine-readable (checkboxes) to save time.
      *   *Wait, the prompt says "plain conditional reasoning".* I should respect that. I will advise the Facilitator to select 5 representative rules from the pile to run live, rather than all 14. This keeps the "human" element but saves time.

  8.  **Finalizing the Debrief Structure:**
      *   Start with the scores.
      *   Ask: "Why did the Cooperator beat the Defector?" (Usually it won't in head-to-head).
      *   Ask: "Why did the Cooperator win the *tournament*?" (Self-play bonus).
      *   Introduce Hofstadter.
      *   Discuss the "Leap": Why should I assume they reason like me?

  9.  **Review against Constraints:**
      *   90 mins? Yes.
      *   14 people? Yes.
      *   No real money? Yes.
      *   Debrief maps to fixed-points? Yes.
      *   Predictable errors? Yes.
      *   What changes my mind? Yes.

  10. **Tone:** Professional, respectful of the user's expertise (physicist -> philosopher), precise, pragmatic.

  *(Self-Correction on the "Mirror" Bot)*: A true "Mirror" bot (copy the opponent's move) creates a logical loop if played against another Mirror bot or a "Copy the Opponent" rule. In a one-shot simultaneous game, you can't see their move before you move.
  *Correction:* The rule must be "Cooperate if the opponent's *rule* is cooperative." But we can't know the rule's output without running it. This is the Halting Problem.
  *Pragmatic Solution:* The Facilitator acts as the Oracle. We define the "Mirror" bot as "Do to them what they do to you." In a simulation, this resolves to Cooperation against Cooperation and Defection against Defection. Against "Always Defect", Mirror Defects. Against "Always Cooperate", Mirror Cooperates. This is effectively Tit-for-Tat but in a one-shot logical space (Program Prisoner's Dilemma). I need to make sure the participants understand the rules are *submitted code* that gets executed, not moves made in real-time.
  *Clarification:* The prompt says "I then play every rule against every other rule." This implies the Facilitator simulates the interaction. I need to make sure the participants understand they are submitting *algorithms*, not *moves*. This is crucial for Superrationality.

  *Let's refine the "Rule" definition:* To avoid the Halting Problem/Infinite Loop issue, I will suggest the Facilitator adjudicates ambiguous loops as "Mutual Defection" (pessimistic resolution) to keep it moving.

  *Final Plan Structure:*
  1.  **Overview & Philosophy:** Acknowledge the ambition.
  2.  **Materials:** Rule cards, Payoff Matrix, Spreadsheet.
  3.  **Timeline:** Minute-by-minute.
  4.  **The Tournament Logic:** How to handle the simulation.
  5.  **Debrief Script:** Connecting scores to Superrationality.
  6.  **Critique:** What goes wrong, limitations, success criteria.

  *Wait, one critical thing:* Superrationality isn't just about "Mirror" bots. It's about *I choose C because I know that if I choose C, a rational identical agent will also choose C.* The "Mirror" bot is a proxy for this. I need to ensure the debrief makes this distinction clear. The bot is a mechanical mirror; Superrationality is a logical mirror.

  *Okay, ready to write.*
answer: |-
  This is a sophisticated pedagogical challenge. You are asking students to experience a *logical* insight (superrationality) through an *empirical* activity (a tournament). The risk is that they will interpret the results through the lens of standard game theory (evolutionary stability, reciprocity) rather than the a priori reasoning Hofstadter intended.

  To make this work in 90 minutes with 14 people, logistics must be airtight. A full round-robin of 14 unique text rules is computationally and temporally impossible to adjudicate live without ambiguity. I have refined your sketch to ensure the "logic" is parsable instantly while preserving the feeling of authorship.

  ### 1. The Setup

  **The Payoff Matrix (Projected)**
  Standard Prisoner's Dilemma values, scaled for clarity.
  *   **Mutual Cooperation (CC):** 3 points each
  *   **Mutual Defection (DD):** 1 point each
  *   **Temptation (Defect vs Cooperate):** 5 points (Defector), 0 points (Sucker)
  *   **Sucker (Cooperate vs Defect):** 0 points

  **Materials**
  *   **Strategy Cards:** 14 index cards. Pre-printed with a structured template (see below) to avoid un-executable prose.
  *   **The "Engine":** A laptop connected to a projector running a simple spreadsheet or script. You (the facilitator) input "Rule A" vs "Rule B," and it outputs the score. *Do not attempt to calculate 105 pairings manually.*
  *   **Whiteboard:** For tracking aggregate scores.

  **The Strategy Card Template**
  To prevent infinite loops (e.g., "I do what they do" vs. "I do what they do") and ambiguity, constrain the reasoning to three primitives. Ask them to fill in the blanks:

  > **My Rule:**
  > 1. **Default:** [ Cooperate / Defect ]
  > 2. **Condition:** IF the opponent's rule appears to be [ Identical to Mine / Cooperative / Defective / Random ]
  > 3. **Action:** THEN I will [ Switch to Cooperate / Switch to Defect / Stay Default ]
  >
  > *Note: If the condition cannot be determined, I stick to Default.*

  **Facilitator Bots (Pre-loaded)**
  1.  **The Rock:** Always Defect. (Default: Defect; Condition: None).
  2.  **The Mirror:** Cooperate if the opponent Cooperates; Defect if the opponent Defects. (Implementation note: Against "Always Defect," Mirror Defects. Against "Always Cooperate," Mirror Cooperates. Against itself, Mirror Cooperates).
  3.  **The Superrational:** Cooperate if and only if the opponent's rule is *identical* to this rule. (This is the hinge).

  ### 2. Minute-by-Minute Timeline

  **00:00 – 00:10: The Trap**
  *   Distribute the Payoff Matrix.
  *   Ask: "In a one-shot game, no communication, no reputation. What do you do?"
  *   Take a show of hands. (Expect majority Defect).
  *   **Do not explain why.** Just note the consensus. "Standard theory says Defect is dominant. We are going to test if that holds when the 'agents' are reasoning processes, not just move-makers."

  **00:10 – 00:25: Writing the Code**
  *   Distribute Strategy Cards.
  *   Instruction: "You are not writing a move. You are writing a *function* that determines a move based on the opponent's function. You must be precise enough that I can execute it against another card."
  *   Collect the cards.
  *   *Facilitator Action:* Quickly scan the cards. Group them into archetypes live on the whiteboard (e.g., "We have 5 'Always Defects', 3 'Conditional Cooperators', 2 'Mirrors'"). Select the 5 most distinct rules to represent the group in the tournament. (Running all 14 vs all 14 takes too long; running 5 representatives + 3 bots is manageable and pedagogically cleaner).

  **00:25 – 00:55: The Tournament**
  *   Run the tournament on the projected spreadsheet.
  *   **Phase 1: Bots vs. Group.** Play the 3 Facilitator Bots against the 5 Group Representatives.
  *   **Phase 2: Self-Play.** This is the critical moment. Play each of the 5 Group Representatives against *itself*.
  *   **Phase 3: The Round Robin.** Play the 5 Representatives against each other.
  *   Keep a running tally of "Average Score per Match" on the whiteboard.
  *   *Narrative:* As you input the rules, verbalize the logic. "Okay, Rule A is playing Rule B. Rule A says 'Defect unless they look like me.' Rule B looks different. So Rule A Defects. Rule B says 'Always Cooperate.' So B gets 0, A gets 5."

  **00:55 – 01:15: The Debrief (The Philosophical Turn)**
  *   **Observation:** Point to the scoreboard. Likely, "Always Defect" won the most head-to-head matchups. But "Mirror" or "Conditional Cooperate" likely had the highest *average score* because of the Self-Play column.
  *   **Question 1:** "The Rock (Always Defect) never lost a head-to-head. Why didn't it win the tournament?"
      *   *Target Answer:* It dragged down the pool. It got 1 point against itself. The Cooperators got 3 points against themselves.
  *   **Question 2:** "If you knew you were going to be paired with a copy of yourself, what would you write?"
      *   *Target Answer:* Cooperate. (Because CC > DD).
  *   **Question 3:** "But you didn't know. You were paired randomly. Why does the self-play score matter to a rational agent?"
      *   *Target Answer:* This is the bridge. If we are all rational students in the same room, facing the same problem, isn't there a sense in which we *are* copies?

  **01:15 – 01:30: The Reveal & Discussion**
  *   Introduce the term **Superrationality** (Hofstadter).
  *   Explain the core thesis: Rationality isn't just about maximizing payoff given the *other's move*; it's about maximizing payoff given the *other's reasoning*. If the reasoning is identical, the moves are correlated.
  *   Open floor for objections.

  ### 3. The Debrief Script: Mapping the Activity to the Idea

  You need to guide them from "Winning the Game" to "Choosing the Agent Type."

  **1. The Fixed-Point Character**
  "Look at the Self-Play column. The rule 'Always Defect' creates a fixed point of (1,1). The rule 'Always Cooperate' creates a fixed point of (3,3). When you wrote your rule, you weren't just choosing a move; you were choosing a fixed point for any interaction with your own likeness. Superrationality asks: Why would a rational agent choose a rule whose fixed point is inferior, unless they believe they are unique in their reasoning?"

  **2. Topping the Scoreboard vs. Being Mirrorable**
  "The Rock topped the scoreboard against the naive cooperators. But it poisoned the well. If everyone reasons like the Rock, everyone gets 1. If everyone reasons like the Mirror, everyone gets 3. The tension is between *parasitic rationality* (exploiting others' reasoning) and *universalizable rationality* (reasoning that works if everyone does it). Kant's Categorical Imperative meets Game Theory."

  **3. The Role of the Defecting Bots**
  "I inserted 'The Rock' to represent the standard Nash Equilibrium. It showed you that if the population is mixed, defection pays. But notice: The Rock only won because *you* provided it with victims. If the room had been fully superrational, The Rock would have met Mirror, defected, and gotten 1 (since Mirror would defect back against a defector). The presence of the bot highlights that superrationality is fragile; it requires a threshold of shared reasoning to outperform standard rationality."

  ### 4. Predictable Failures & Limitations

  Be prepared for these specific breakdowns.

  **1. The "Halting Problem" Crash**
  *   **What happens:** A student writes "I do the opposite of what they do." You pair it with "I do the opposite of what they do." Logic loops.
  *   **Fix:** Adjudicate loops as Mutual Defection (DD). Tell them: "In logic, if the computation doesn't terminate, no action is taken. Default to safety."
  *   **Lesson:** Superrationality requires transparent, solvable reasoning. Opaque strategies break the correlation.

  **2. The "Iterated PD" Confusion**
  *   **What happens:** Students argue, "If I cooperate now, they might cooperate next time."
  *   **Fix:** Ruthlessly enforce the "One-Shot" constraint. "There is no next time. There is no memory. The only link is the reasoning you used *before* the game started."

  **3. The "Telepathy" Objection**
  *   **What happens:** "But I can't *know* they are using my rule. That's magic."
  *   **Limitation:** This is the strongest objection. The activity cannot reproduce the *first-person inference* ("My choice *is* his choice"). It only shows the *third-person correlation* ("People who choose like me get results like mine").
  *   **Response:** Acknowledge this. "The activity shows the *benefit* of correlation. Superrationality is the argument that the correlation is *logical*, not just statistical. If we are identical rational machines, the output must be identical. The activity shows the payoff; the philosophy argues for the link."

  **4. Partial Similarity**
  *   **Limitation:** The activity treats rules as discrete (Identical or Not). In reality, agents are only *partly* alike.
  *   **Consequence:** Superrationality degrades smoothly. If I am 90% sure you reason like me, I should 90% cooperate. The binary nature of the tournament masks this nuance.

  ### 5. Success and Failure Criteria

  **What would change my mind about the design?**
  If the tournament results show that **"Always Defect" wins the overall tournament** (highest average score across all pairings), the lesson fails.
  *   **Why:** It reinforces the standard Nash Equilibrium view that cooperation is merely "risky" or "altruistic," rather than rationally mandated by symmetry.
  *   **Mitigation:** Ensure there are enough "Conditional Cooperators" or "Mirrors" in the facilitator bot mix to boost the average score of cooperative strategies. You may need to weight the pairings so that self-play counts double, or ensure the "Mirror" bot is in the pool to punish defectors (by defecting back) while rewarding cooperators.

  **Signs you are teaching Ordinary Reciprocity:**
  *   Students justify cooperation by saying, "I cooperate so they will cooperate." (This implies causal influence on the *other's* move).
  *   Students focus on "trust" or "signaling."
  *   **Correction:** Remind them: "You cannot influence them. You are submitting a script. The only thing you control is your script. Superrationality is choosing the script that yields the best world when run universally."

  **Signs you are teaching Risk-Aversion:**
  *   Students cooperate because "3 is guaranteed, 5 is risky."
  *   **Correction:** Highlight the "Sucker" payoff. "Cooperation was not safe. You got 0 against the Rock. You cooperated not because it was safe, but because you hoped the *logic* would align."

  **Signs of Success (Superrationality):**
  *   A student says: "I didn't cooperate to help them. I cooperated because if I'm right, they are right, and I want to live in the world where we are both right."
  *   A student asks: "Does this imply that rationality is a shared resource?"
  *   The group recognizes that the "Self-Play" score is the only one that truly matters for a universalizing agent.

  ### Final Advice for the Physicist-Turned-Philosopher

  You have an advantage here: you understand that a "law of nature" doesn't care about your feelings. Treat the reasoning process as a physical system.
  *   **Don't** moralize cooperation.
  *   **Do** treat "Reasoning" as a variable in the equation.
  *   **The Pivot:** The moment they realize that *their own rationality* is the variable they are solving for, not the opponent's move, you have succeeded.

  If the session runs long, cut the Round Robin (Phase 3). Keep the Bots vs. Group and the Self-Play. The Self-Play is the only data point that matters for superrationality; the rest is just noise to distract them from the standard Nash intuition.
