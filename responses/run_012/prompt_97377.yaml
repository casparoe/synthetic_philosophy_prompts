answer: |-
  **JOINT WORKING STATEMENT ON THE RAVEN PARADOX**
  **SUBMITTED TO:** The Seminar Series on Inductive Inference
  **FROM:** The Working Group on Confirmation Theory (Camp A & Camp B)
  **SUBJECT:** Resolution of Disagreements regarding Nicod's Criterion, Equivalence, and Selection Procedures

  ### PREFACE

  We, the undersigned representatives of two distinct traditions in the philosophy of science, acknowledge that our previous debates have been hindered by imprecise terminology and a failure to distinguish between logical relations and probabilistic models. We recognize that the intuitions of field scientists—specifically regarding how data is generated—are not merely psychological quirks but reflect structural features of inference that must be accounted for.

  This document does not declare a winner. Instead, it isolates the arithmetic and modeling claims on which we agree, precisely locates the philosophical divergence, and identifies the specific empirical or formal conditions that would force a revision of either position. We have structured this to be useful to practitioners who must decide how to treat observations in the wild.

  ---

  ### SECTION 1: AGREED CLAIMS

  The following claims are accepted by both Camp A and Camp B without reservation. They form the common ground of our models.

  1.  **Logical Equivalence:** The hypothesis $H$ ("All ravens are black") is logically equivalent to $H'$ ("All non-black objects are non-ravens"). Any model that assigns different truth values to $H$ and $H'$ is incoherent.
  2.  **Probability Calculus:** All claims regarding "support," "credence," or "confirmation" must obey the axioms of probability. Specifically, Bayes' Theorem applies: $P(H|E) = P(E|H)P(H) / P(E)$.
  3.  **The Camera-Trap Outcome:** In the specific Camera-Trap case described (where a non-black raven would trigger the sensor with higher probability than a green apple):
      *   The Likelihood Ratio $\Lambda = P(\text{Apple}|H) / P(\text{Apple}|\neg H)$ is strictly greater than 1.
      *   Observing the green apple *increases* the posterior probability of $H$.
      *   Observing a black raven also increases the posterior probability of $H$, but the magnitude depends on the relative trigger probabilities of ravens vs. non-ravens.
  4.  **The Informant Outcome:** In the specific Informant case described (50% neutral, 50% partisan who hides counterexamples):
      *   The Likelihood Ratio $\Lambda = P(\text{Apple}|H) / P(\text{Apple}|\neg H)$ is strictly less than 1.
      *   Observing the green apple *decreases* the posterior probability of $H$.
  5.  **The Finite Plot Arithmetic:**
      *   In Plot 1 (10,000 objects, 40 ravens, uniform sampling): The Likelihood Ratio for a black raven is significantly larger than the Likelihood Ratio for a green apple.
      *   In Plot 2 (10,000 objects, census confirms $\le$3 non-black objects): The Likelihood Ratio for a green apple increases drastically compared to Plot 1, potentially exceeding that of a black raven depending on the prior distribution of colors.
  6.  **Evidence Description:** Both sides agree that if the "Evidence" $E$ is defined to include the full selection protocol (e.g., "Apple observed via Camera-Trap"), the arithmetic in claims 3 and 4 follows necessarily. The disagreement lies in whether the protocol is part of $E$, part of the background $K$, or irrelevant to the *logical* relation of confirmation.

  ---

  ### SECTION 2: DISAGREEMENTS TABLE

  The following table isolates the specific points of divergence. We have drafted the wording for each camp to ensure it is defensible by a competent proponent of that view.

  | Sub-Question | Camp A Formulation (Logical/Qualitative) | Camp B Formulation (Probabilistic/Contextual) | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **1. The Equivalence Condition** | Logically equivalent hypotheses must be confirmed by the same evidence proposition. If $E$ confirms $H$, and $H \leftrightarrow H'$, then $E$ confirms $H'$. This is a constraint on the *concept* of confirmation. | The Equivalence Condition fails for *probabilistic* support. Support is a relation between $E$, $H$, and a generation model $M$. $E$ generated by $M_1$ may support $H$ while $E$ generated by $M_2$ undermines it, even if $H$ is equivalent to $H'$. | **Genuine.** Camp A views confirmation as a static relation between propositions; Camp B views it as a dynamic property of the inference process. |
  | **2. The Role of Selection** | Selection procedures are relevant only insofar as they alter the description of the evidence proposition $E$. Once $E$ is fully described (e.g., "Apple found by trap"), Nicod's Criterion applies to the content of $E$. | Selection procedures are constitutive of the evidence. You cannot separate the "what" (apple) from the "how" (trap). The "how" determines the likelihoods $P(E|H)$. | **Verbal (mostly).** Both agree the math changes if the protocol is known. They disagree on whether the protocol is part of the *evidence* or part of the *background*. |
  | **3. The Green Apple (Standard Case)** | In the absence of specific information about selection bias, a green apple logically supports "All ravens are black." The intuition that it does not is a psychological error regarding relevance, not a logical error. | In the absence of specific information about selection bias, a green apple provides negligible or zero support. Default assumptions about sampling (e.g., random object vs. random raven) determine the support. | **Genuine.** Camp A asserts a default logical support; Camp B asserts a default probabilistic neutrality. |
  | **4. Measure of Support** | Support is qualitative. While probabilities quantify *degree* of belief, the *fact* of confirmation is determined by whether $E$ satisfies the logical form of the hypothesis (e.g., instantiating the universal). | Support is quantitative. If the Likelihood Ratio is 1 (or indistinguishable from 1), there is no support. If the ratio is < 1, there is disconfirmation. "Qualitative support" without a measure is ill-defined. | **Genuine.** Camp A allows for "support" even when probability shifts are vanishingly small; Camp B ties support to measurable shifts. |

  ---

  ### SECTION 3: CRUXES AND TESTABLE PREDICTIONS

  To move the debate forward, we identify the specific claims that, if proven false, would require a side to abandon or significantly modify its position.

  #### Crux 1: The Limit of the Infinite Population
  **The Question:** Does a green apple support $H$ in a world with infinitely many objects, sampled uniformly at random?
  **The Test:** Compute the Likelihood Ratio as population size $N \to \infty$ while keeping the proportion of ravens constant.
  *   **Camp A Prediction:** Support remains positive. Even if the probability shift approaches zero, the *direction* of confirmation remains upward because the logical space of potential counterexamples is reduced.
      *   *Falsification Condition:* If Camp A accepts that a confirmation relation that yields zero probability difference is indistinguishable from no confirmation, they must abandon the claim that the apple *really* supports $H$ in the limit.
  *   **Camp B Prediction:** Support vanishes. As $N \to \infty$, $P(\text{Apple}|H) \approx P(\text{Apple}|\neg H)$, so $\Lambda \to 1$. There is no support.
      *   *Falsification Condition:* If Camp B cannot explain why the Informant Case (where $\Lambda < 1$) is different in kind from the Standard Case (where $\Lambda \approx 1$), their reliance on likelihood ratios becomes unstable.

  #### Crux 2: The "Unknown Protocol" Scenario
  **The Question:** You find a green apple on your desk. You have *no* information about how it got there (no camera, no informant, just "it is there"). Does this support $H$?
  **The Test:** Determine the default likelihood ratio when the selection model is unknown.
  *   **Camp A Prediction:** Yes, it supports $H$. The logical relation holds regardless of our ignorance of the causal history. The burden is on the skeptic to show a bias that negates the support.
      *   *Falsification Condition:* If it can be demonstrated that *every* possible selection model consistent with "found on desk" yields $\Lambda = 1$, then Camp A's claim of logical support is empirically empty.
  *   **Camp B Prediction:** No, it does not support $H$. Without a model, likelihoods are undefined. You cannot compute support. The rational credence change is zero.
      *   *Falsification Condition:* If Camp B cannot provide a decision rule for acting on evidence when models are unknown, their theory fails as a guide for field work.

  #### Crux 3: The Informant Case and Logical Equivalence
  **The Question:** In the Informant Case, the apple undermines $H$. Does it also undermine $H'$ ("All non-black objects are non-ravens")?
  **The Test:** Check consistency with the Equivalence Condition.
  *   **Camp A Prediction:** This is a category error. The evidence in the Informant Case is not "Green Apple" ($E$); it is "Green Apple reported by a potentially biased agent" ($E^*$). $E^*$ does not stand in the same logical relation to $H$ as $E$ does. Once $E^*$ is properly formalized, equivalence is restored.
      *   *Falsification Condition:* If Camp A cannot formalize $E^*$ without making the hypothesis $H$ itself part of the evidence description, their distinction between evidence and background collapses.
  *   **Camp B Prediction:** Yes, it undermines $H$ and $H'$ differently depending on how you frame the sampling. Equivalence is not preserved because confirmation is not extensional.
      *   *Falsification Condition:* If Camp B accepts that $H$ and $H'$ must have the same truth probability, they must concede that "support" cannot diverge for equivalent hypotheses without contradiction.

  ---

  ### SECTION 4: SELF-UNDERMINING EVIDENCE

  We specify what each side would accept as evidence against its own core position.

  **For Camp A:**
  *   **The Contradiction:** If it can be shown that adhering to Nicod's Criterion and the Equivalence Condition simultaneously forces a probability assignment where $P(H|E) < P(H)$ while claiming $E$ confirms $H$. (i.e., if "confirmation" is mathematically proven to be incompatible with "increase in probability").
  *   **The Field Test:** If a field protocol designed using Camp A's principles (treating all non-black non-ravens as positive data) consistently leads to poorer predictions about raven populations than a protocol that ignores them, Camp A must concede that "logical support" lacks ecological validity.

  **For Camp B:**
  *   **The Arbitrariness:** If it can be shown that the "selection procedure" cannot be distinguished from the "hypothesis" without circularity. (i.e., if defining the background $K$ requires assuming the truth of $H$).
  *   **The Field Test:** If a field protocol designed using Camp B's principles (requiring full selection models for all data) consistently fails to converge on the truth in simple, controlled environments where Camp A's protocol succeeds, Camp B must concede that their requirements are too stringent for practical inference.

  **Shared Ground for Movement:**
  Both sides agree that if the **Finite Plot (Plot 2)** computation shows that a green apple provides *more* support than a black raven (due to the census constraint on non-black objects), this settles the "relevance" intuition.
  *   **Camp A** welcomes this: It shows the apple *can* be highly relevant, vindicating Nicod.
  *   **Camp B** welcomes this: It shows relevance depends on population structure (the census), vindicating the contextual view.
  *   **Resolution:** This specific case dissolves the intuition that apples are *always* irrelevant. The debate then retreats to the "Standard Case" (Plot 1) where the support is positive but tiny (Camp A) vs. negligible/zero (Camp B).

  ---

  ### SECTION 5: MEASURES AND LIMITS

  We address whether fixing the measure of support resolves the disagreement.

  **1. Fixing the Measure:**
  *   **Likelihood Ratio:** Both sides agree on the arithmetic. Camp A argues that $\Lambda > 1$ (even if $1.000001$) is sufficient for confirmation. Camp B argues that $\Lambda \approx 1$ is practically indistinguishable from no support.
  *   **Probability Difference:** Both sides agree the shift is tiny in the standard case. Camp A argues the *sign* matters. Camp B argues the *magnitude* matters.
  *   **Conclusion:** Fixing the measure does not resolve the disagreement. It clarifies that the dispute is about the **threshold of significance**. Camp A sets the threshold at $\Lambda > 1$. Camp B sets the threshold at $\Lambda > 1 + \epsilon$ (where $\epsilon$ is context-dependent).

  **2. The Unbounded Population Limit:**
  *   **Camp A:** In the limit, the apple still supports $H$. The support is infinitesimal but non-zero. To deny this is to deny the logical structure of the universal claim.
  *   **Camp B:** In the limit, the apple provides no support. The likelihood ratio converges to 1. To claim otherwise is to attribute significance to noise.
  *   **Joint Statement on the Limit:** We agree that in an infinite population with uniform sampling, the *informational value* of a single non-black non-raven regarding the color of ravens approaches zero. Camp A calls this "vanishing confirmation." Camp B calls this "no confirmation." We acknowledge this may be a terminological difference regarding the word "support," provided Camp A admits the evidential weight is negligible for decision-making.

  ---

  ### CLOSING REMARK TO THE ORNITHOLOGIST

  You asked what this document should have achieved. It should have moved the seminar from arguing about "green apples" to arguing about **sampling models**.

  *   **Camp A** is right that you do not need to know the *entire* history of the universe to update your beliefs; logical relations constrain rationality.
  *   **Camp B** is right that in field work, an observation without a protocol is a number without a unit.

  The Camera-Trap case shows that an apple *can* be strong evidence. The Informant case shows that an apple *can* be negative evidence. The Finite Plot shows that the strength depends on the denominator (population structure).

  If you take one thing from this joint statement, let it be this: **Do not ask "Does this observation support my hypothesis?" Ask "What process generated this observation, and how likely was that process under my hypothesis compared to its negation?"** Camp A agrees this is good practice, even if they insist the logical support exists independently. Camp B insists this is the *only* thing that matters.

  On that practical instruction, we are united.
