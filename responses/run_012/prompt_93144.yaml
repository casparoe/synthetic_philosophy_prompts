answer: |-
  1) "The list"

  1. **Teletransporter:** The theory must determine if physical destruction precludes survival. The motivating case is a scanner that records your state, destroys the body, and rebuilds a duplicate elsewhere. If the theory claims physical continuity is necessary, the person dies. If psychological continuity suffices, they survive. The theory cannot be ambiguous about whether vaporization is fatal when information is preserved, otherwise it fails to guide rational anticipation in high-tech scenarios where physical transport is obsolete.

  2. **Fission:** The theory must resolve branching identity logically. The case involves splitting the brain so two successors wake up, both psychologically continuous with the original. Since numerical identity is one-to-one, you cannot be identical to two distinct people. The theory must explain whether survival is possible without identity, or if branching entails death for the original. Failure here leads to logical contradictions regarding who owns the original's property or responsibilities, breaking the link between identity and rights.

  3. **Gradual Replacement:** The theory must handle incremental change without arbitrariness. The case is replacing neurons one by one until none of the original matter remains. Intuition suggests survival here, unlike instant replacement. The theory must define the threshold where continuity breaks, or deny there is a threshold, explaining why slow change preserves what matters when fast change destroys it. Without this, survival becomes dependent on the speed of change rather than the outcome, making persistence rate-sensitive.

  4. **Sleep and Coma:** The theory must accommodate discontinuities in consciousness without absurdity. The case is deep dreamless sleep or years in a coma where psychological connections weaken or pause. If survival requires strong psychological connectedness, you die every night. The theory must distinguish between temporary interruption and permanent cessation without relying on arbitrary time limits. A theory implying nightly death is pragmatically useless for planning a future or maintaining long-term commitments.

  5. **Metamorphosis:** The theory must address radical biological restructuring consistent with organism persistence. The case is a caterpillar becoming a butterfly, where much of the brain dissolves and reforms. For a biologist, this is survival; for a psychologist, it may not be. The theory must reconcile structural overhaul with functional persistence, deciding if biological continuity trumps psychological disruption. Ignoring this alienates biological reality from philosophical accounts of persistence, creating a split between medical and metaphysical verdicts.

  6. **Inactive Backup:** The theory must distinguish actuality from potentiality clearly. The case is a backup copy stored on a drive but never activated. Intuitively, this copy does not secure your survival while you live. The theory must explain why causal connection to an actual future self matters more than the mere existence of a possible duplicate. Failing this implies that mere possibility secures survival, rendering actual risk meaningless and undermining the urgency of self-preservation.

  7. **Identity vs. What Matters:** The theory must separate metaphysical identity from prudential concern explicitly. The motivating case is Fission again: if you aren't identical to the successors, should you care about them? A good theory must specify whether "what matters" tracks identity strictly or if it can survive the loss of numerical identity. Collapsing these concepts makes rational care impossible in branching scenarios, leaving agents without guidance on how to value their successors.

  8. **First-Person vs. Third-Person:** The theory must align subjective anticipation with objective classification. The case is the difference between how I feel about my future versus how an observer classifies my successors. The theory cannot privilege the third-person view so heavily that first-person concern becomes irrational, nor vice versa. A mismatch here creates a schism between how I live and how I am described, causing alienation between experience and theory.

  9. **Kind vs. Degree:** The theory must decide if survival is binary or graded consistently. The case is gradual replacement again: does "being me" fade as neurons swap, or is it all-or-nothing? The theory must resolve whether death is a precise event or a vague process, avoiding contradictions where you are both alive and dead. Inconsistency here undermines legal and moral responsibility, which typically requires binary status determinations.

  10. **Neuroscience Constraints:** The theory cannot require static physical substrate empirically. The consideration is empirical data showing cellular turnover and synaptic rewiring over a lifetime. A theory requiring strict physical constancy contradicts biological facts. It must allow for material change while maintaining persistence, aligning with how organisms actually endure over time. Any theory falsified by basic biology is non-starters for a scientist.

  2) "Load-bearing vs. optional"

  Load-bearing requirements are those forced by logic or empirical fact. Fission handling is non-negotiable because one-to-many identity is logically impossible; the theory must resolve this without contradiction. Neuroscience constraints are also load-bearing; empirical facts about cellular turnover cannot be ignored by a theory of biological beings. Sleep continuity is pragmatic; a theory implying nightly death is functionally broken.

  Optional requirements often stem from specific metaphysical prejudices. Maintaining Numerical Identity is optional; Parfit argues we should discard it in favor of Relation R. The Kind vs. Degree distinction is negotiable; survival might be vague. Metamorphosis is a biological prejudice; if the theory is psychological, structural overhaul doesn't matter. The Backup case relies on intuitions about potentiality that may not be fundamental. Distinguishing First-Person from Third-Person views is desirable but some reductionist theories collapse them.

  3) "Tensions"

  The primary tension exists between Numerical Identity and the Fission case. You cannot satisfy the requirement for strict one-to-one identity while acknowledging that both fission successors are equally continuous with the original. If you preserve identity, you must arbitrarily choose one successor or deny survival. If you preserve survival intuition, you must abandon strict identity. This pair cannot be jointly met; one must yield. You cannot have logical identity and equal branching survival.

  A second tension lies between Biological Continuity and the Teletransporter case. If biological continuity is required (per Metamorphosis/Neuroscience), teletransportation kills you. If psychological continuity suffices (per Teletransporter intuition), biological restructuring matters less. You cannot hold that biological constancy is essential while accepting teletransportation survival. A theory must choose between a biological or psychological criterion; attempting to satisfy both leads to contradictory verdicts in edge cases where biology and psychology diverge. For a biologist, this is the hardest pill: accepting that physical destruction might not matter if information persists, or admitting that information persistence is irrelevant without the specific physical chain.
