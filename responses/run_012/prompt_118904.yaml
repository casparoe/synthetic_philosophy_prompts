answer: |-
  (a) **Examination Question**

  **Module:** Advanced Game Theory
  **Time Allowed:** 50 Minutes
  **Marks:** 25

  **Question 1**
  Consider the procedure of Iterated Elimination of Strictly Dominated Strategies (IESDS). In the standard definition, a strategy is eliminated if it is strictly dominated by another *pure* strategy. However, a more refined procedure allows strategies to be eliminated if they are strictly dominated by a *mixed* strategy.

  Write an essay that addresses the following four points from first principles:
  1.  Demonstrate with a payoff matrix that a pure strategy may be strictly dominated by a mixed strategy even when it is not dominated by any pure strategy. Explain the relationship between such a strategy and the concept of a "never best response".
  2.  Construct a concrete game in which the set of strategies surviving IESDS differs depending on whether mixed strategies are permitted as eliminators. Identify which surviving set is theoretically defensible.
  3.  Reconcile your finding in (2) with the standard theorem that IESDS is independent of the order of elimination.
  4.  Contrast these properties with Iterated Elimination of *Weakly* Dominated Strategies, specifically regarding order dependence and the preservation of Nash equilibria.

  ***

  (b) **Model Answer**

  Strict dominance occurs when a strategy yields a lower payoff than an alternative against all opponent profiles. Crucially, the dominating alternative need not be pure. Consider a game where Row has strategies $T, M, B$ and Column has $L, R$. Let Row's payoffs be:
  $$
  \begin{matrix}
   & L & R \\
  T & 4 & 0 \\
  M & 1.9 & 1.9 \\
  B & 0 & 4
  \end{matrix}
  $$
  $M$ is not dominated by $T$ ($0 < 1.9$) nor $B$ ($0 < 1.9$). However, a mixed strategy $\sigma = 0.5T + 0.5B$ yields expected payoffs of 2 against both $L$ and $R$. Since $2 > 1.9$, $\sigma$ strictly dominates $M$. A strategy strictly dominated by a mixed strategy is never a best response to any belief over the opponent's strategies; rational players assign zero probability to it.

  To show that the surviving sets differ between procedures, consider a $3 \times 3$ game. Row payoffs ($u_1$) are:
  $$
  \begin{matrix}
   & L & C & R \\
  T & 5 & 5 & 0 \\
  M & 2 & 2 & 2 \\
  B & 0 & 5 & 5
  \end{matrix}
  $$
  Column payoffs ($u_2$) are:
  $$
  \begin{matrix}
   & L & C & R \\
  T & 2 & 1 & 0 \\
  M & 0 & 2 & 0 \\
  B & 2 & 1 & 0
  \end{matrix}
  $$
  **Pure-Eliminator Procedure:** $M$ is not dominated by $T$ or $B$ (as $T$ fails in $R$, $B$ fails in $L$). Thus $M$ survives. Consequently, Column strategy $C$ is not dominated by $L$, because against $M$, $C$ yields 2 while $L$ yields 0. The surviving set is $\{T, M, B\} \times \{L, C, R\}$.

  **Mixed-Eliminator Procedure:** As established, $M$ is strictly dominated by $0.5T + 0.5B$ (payoffs 2.5, 5, 2.5 vs 2, 2, 2). $M$ is eliminated. With $M$ removed, Row plays only $T$ or $B$. Against these, $L$ yields Column 2, while $C$ yields 1. $L$ now strictly dominates $C$. $C$ is eliminated. The surviving set is $\{T, B\} \times \{L, R\}$.

  The Mixed-Eliminator set is the defensible one. Rationality implies players maximise expected utility; if a mixture outperforms a pure strategy, the pure strategy is irrational regardless of whether the mixture is explicitly playable as a single move. The elimination reveals deeper inconsistencies in rationality that pure-only checks miss.

  This does not violate the order-independence theorem. That theorem states that for a *fixed definition* of dominance (e.g., mixed-allowed), the sequence of deletion does not alter the final set. It does not claim equivalence *between* different definitions of dominance. Changing the allowable eliminators changes the procedure itself, justifying different fixed points.

  Finally, contrast this with *weak* dominance. Weak dominance allows equality in some profiles. Elimination of weakly dominated strategies is order-dependent. Consider:
  $$
  \begin{matrix}
   & L & R \\
  T & 1,1 & 0,0 \\
  B & 0,0 & 0,0
  \end{matrix}
  $$
  $B$ is weakly dominated by $T$. Eliminating $B$ leaves $(T,L)$. However, $(B,R)$ is also a Nash equilibrium (NE). Weak elimination discarded a valid NE. Furthermore, in larger games, eliminating one weakly dominated strategy can render another undominated, making the final set sensitive to the order of removal. Thus, while strict dominance (mixed or pure) is robust and order-independent within its definition, weak dominance is fragile, order-dependent, and liable to discard equilibria.

