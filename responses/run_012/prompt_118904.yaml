  (c) **Marking Scheme**

  **Total Marks: 25**

  **1. Pure vs. Mixed Dominance Example (5 Marks)**
  *   **3 Marks:** Correct matrix where a pure strategy ($M$) is not dominated by any pure strategy but is dominated by a mixed strategy (e.g., $0.5T + 0.5B$). Payoffs must demonstrate strict inequality for the mix and failure for pure comparators.
  *   **2 Marks:** Correctly identifies that such a strategy is "never a best response" to any belief.
  *   *Error:* Assuming a strategy must be dominated by a pure strategy to be irrational (-2 marks).

  **2. Different Fixed Points Construction (5 Marks)**
  *   **3 Marks:** Valid $3 \times 3$ (or larger) matrix where Mixed-IEDS eliminates more strategies than Pure-IEDS. Specifically, eliminating a Row strategy via mixture must trigger a Column elimination that would not otherwise occur.
  *   **2 Marks:** Correctly identifies the Mixed-Eliminator set as the theoretically defensible solution based on expected utility maximisation.
  *   *Error:* Claiming the Pure-Eliminator set is superior because mixed strategies are not "real" moves (-2 marks).

  **3. Order Independence Reconciliation (5 Marks)**
  *   **3 Marks:** Clearly states that order independence applies *within* a specific procedure, not *between* different procedures (Pure vs. Mixed definitions).
  *   **2 Marks:** Explains that changing the definition of "dominated" changes the operator, hence the fixed point can change without violating the theorem.
  *   *Error:* Claiming order independence is violated by the difference in sets (-3 marks).

  **4. Weak Dominance Contrast (5 Marks)**
  *   **2 Marks:** Correctly states Weak IEDS is order-dependent.
  *   **3 Marks:** Correctly states Weak IEDS can eliminate Nash Equilibria (with example or clear logic).
  *   *Error:* Claiming Weak IEDS is order-independent (-3 marks). Claiming Weak IEDS preserves all Nash Equilibria (-3 marks).

  **5. Structure and Clarity (5 Marks)**
  *   **5 Marks:** Logical flow, precise terminology, British English spelling (e.g., "behaviour", "analyse"), and adherence to word constraints.
  *   **Deductions:** Poor structure or significant ambiguity (-1 to -3 marks).

  Verdict: Allowing mixed strategies as eliminators refines the solution set further than pure eliminators alone without violating order-independence, whereas weak dominance sacrifices order-independence and Nash equilibria.
