answer: |-
  **Q&A PREP SHEET: ROLE HEDONISM**

  **Strategy: Concessions & Holds**
  You are right to concede the "natural kind" point immediately. Open by saying: "I agree pleasure is not a neurobiological or phenomenological natural kind. If you need a single feeling-tone, this view fails." This disarms the Feeling-Tone theorists before they stand up. It signals you aren't fighting the science.

  **Hold firm on:** The normative significance of the *role*. Even if pleasure is multiply realized, the function (intrinsically wanted, presented as good) is what matters for well-being. Do not let them reduce the role to a mere label; it is a causal-functional profile.

  **Objections (Ordered by Damage)**

  **1. The Collapse Objection (Desire-Satisfaction)**
  *Who:* The Attitudinal Hedonists (and lurking desire theorists).
  *Objection:* "If the unifying role is 'states we intrinsically want,' and well-being is filling that role, haven't you just defined hedonism as desire-satisfaction theory? You've lost the 'hedonic' element."
  *Reply:* "Not quite. Desire theory counts desires about the world (e.g., that my book gets published). Role Hedonism counts desires for *conscious states themselves*. I'm restricting the domain of satisfaction to experiences that present themselves as good. It's a hybrid: the *structure* is desire-like, but the *object* is strictly phenomenological. I keep the hedonist's intuition that only experience matters, without needing a shared feeling-tone."
  *Soft Spot:* If they press on whether "wanting an experience" is distinct from "satisfaction of a desire," you risk splitting hairs.

  **2. The Circularity Charge**
  *Who:* The Attitudinal Hedonists.
  *Objection:* "Your role includes 'states we are disposed to repeat' or 'take pleasure in.' You're using pleasure to define pleasure. That's circular."
  *Reply:* "The role is defined in terms of *pro-attitudes* (wanting, disposition to repeat), not the word 'pleasure.' We can identify these attitudes independently via behavior or neural markers (like dopamine 'wanting'). The attitude is one *realizer* of the role, not the definition of it. The circle is broken by the functional profile."
  *Soft Spot:* Distinguishing 'wanting' from 'liking' empirically is messy. If they argue the attitudes presuppose pleasure, you need the neuroscience backup.

  **3. The "Philosophy is a Mess" Objection**
  *Who:* The Hedonic Neuroscientist.
  *Objection:* "In rodents, 'liking' (opioids) and 'wanting' (dopamine) come apart. Your functional role lumps them together. You're carving nature at a join that doesn't exist. Just study the circuits."
  *Reply:* "I'm not carving nature; I'm clarifying a concept used in normative theory. If 'liking' and 'wanting' both contribute to well-being in humans, my role captures that union. You're tracking mechanisms; I'm tracking the value property those mechanisms realize. We can agree on the circuits while disagreeing on what makes them 'good'."
  *Soft Spot:* If they insist well-being *just is* opioid activation, your functionalism looks like hand-waving.

  **4. The "Changing the Subject" Objection**
  *Who:* The Feeling-Tone Theorists.
  *Objection:* "When we say 'pleasure,' we mean a specific feel. You're talking about 'goodness' or 'value.' You've solved the heterogeneity problem by deleting pleasure."
  *Reply:* "Think of Jade. Jadeite and nephrite share no chemistry, but both are jade because they play the 'jade role' (hard, green, carveable). Similarly, a backrub and a proof-share no feeling, but both play the 'pleasure role.' I'm not deleting pleasure; I'm correcting the assumption that natural kinds are the only real kinds."
  *Soft Spot:* If they insist 'jade' is a pragmatic label but 'pleasure' is essentially phenomenological, the analogy fails.

  **5. The Quality & Scope Objection**
  *Who:* Mill Person & Kantian.
  *Objection:* (Mill) "Doesn't this flatten higher/lower pleasures? (Kant) Isn't this parochial? Pleasure isn't the only good."
  *Reply:* "(Mill) Higher pleasures are role-fillers that engage more complex cognitive attitudes, making them more stable or valuable instruments. (Kant) I'm defending hedonism about *well-being*, not morality. You can be a Kantian about duty and a Role Hedonist about what makes life go well for the subject."
  *Soft Spot:* The Mill reply is weak. If the role is just "wanted," why is reading poetry *better* than pushpin if both are wanted?

  **The Dreaded Question**

  You are worried about the Desire-Satisfaction collapse. That is indeed the biggest threat, but there is a sharper version: **The Misfire Problem.**

  *The Question:* "If pleasure is just the state we intrinsically want, what about addiction or maladaptive preferences? If I intrinsically want the state of heroin use, is that well-being on your view? If yes, your theory is counterintuitive. If no, you need a normative filter outside the role, which breaks the theory."

  *Why it's worse:* The Desire Collapse just changes your label. The Misfire Problem makes your theory morally repugnant or forces you to admit you need an objective list of "good" role-fillers, which abandons pure hedonism.

  *Prep:* If asked, pivot to *informed* desire. "The role requires the state to present itself as good *under conditions of full information.' Addictive states often present as good due to chemical hijacking, not accurate presentation." It's a standard move, but it saves the theory.

  **Final Note:**
  Breathe. You have a robust functionalist account. The empiricists will like the multiple realizability; the traditionalists will hate it, but that means you're saying something new. Stick to the Jade analogy. Good luck.
