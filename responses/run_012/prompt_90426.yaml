      *   **Core Argument:** The rhetorical force of these arguments comes from conflating three distinct claims: (1) survival implies function, (2) function benefits everyone (vs. specific groups/costs), and (3) the *process* of survival (selection vs. inertia vs. power). Separating these weakens the presumption against change.
      *   **Specific Angles:** Redundancy, cost-benefit analysis of maintenance, power dynamics (who pays vs. who benefits).
      *   **Format:** Two-page fellowship proposal.
      *   **Requirements:**
          *   State the question with a determinate answer.
