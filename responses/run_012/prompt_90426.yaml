          *   No citations needed (user will add them).
      *   **Tone:** Academic but punchy, clear, feasible, honest.

  2.  **Deconstruct the Core Idea into a Research Question:**
      *   *Current thought:* "Chesterton's fence is wrong because it ignores power." -> Too vague.
