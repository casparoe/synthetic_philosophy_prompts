answer: |-
  # Activity Title: The Charter of Existence

  ## 1. Setting and Materials
  **Room Arrangement:**
  Arrange the room into two semi-circles facing each other, with a central "Adjudication Table" for you. Each semi-circle contains 7 chairs (two "Legislative Houses"). Place a whiteboard or large sheet of butcher paper in front of each House.

  **Materials:**
  *   **28 "Ontological Credit" Tokens:** (Poker chips, coins, or printed cards). 14 per House.
  *   **Scenario Deck:** 12 cards describing physical configurations (details below).
  *   **Drafting Pens & Paper:** For each House to write their "Charter."
  *   **A "Gavel" (or distinct object):** To signal ruling time.
  *   **Props (Optional but helpful):** A handful of loose Lego bricks, a ball of yarn with frayed ends, a lump of clay, a stapled stack of papers. Keep these on the Adjudication Table for demonstration.

  ## 2. Roles, Rules, and Scoring
  **The Premise:**
  Tell the students: *"You are the Architects of Reality. The world is full of stuff, but 'stuff' doesn't count as an 'Object' unless you say it does. Your job is to write the Charter that determines when parts count as a whole. You are not describing language; you are describing the world. If your Charter contradicts itself or fails to cover the cases I present, you lose Credibility."*

  **The Houses:**
  Divide the 14 students into two Houses (7 students each).
  *   **House A** and **House B**.
  *   Each House must appoint a **Speaker** (delivers the verdict) and a **Scribe** (writes the Charter). The rest are **Justices**.

  **Scoring (Ontological Credits):**
  *   Each House starts with **14 Credits**.
  *   **Cost of Existence:** Every time a House rules "Yes, this is an Object," they pay **1 Credit** to the Bank (you). This simulates the ontological cost of populating the world.
  *   **Penalty for Contradiction:** If a House rules inconsistently with their own Charter (e.g., their Charter says "Contact is required," but they rule "Yes" on a case without contact), they lose **3 Credits**.
  *   **Penalty for Vagueness:** If they cannot draw a line in the Continuum Round (see Timeline), they lose **5 Credits**.
  *   **Winning:** The House with the most Credits remaining at the end wins "Supreme Ontological Authority" (bragging rights/candy). If both go bankrupt, Nihilism wins by default.

  **The Golden Rule:**
  *"Your Charter must be precise, non-circular, and context-independent. You cannot say 'It depends on what humans care about.' You must state the physical conditions under which composition occurs."*

  ## 3. The Eighty-Minute Timeline

  **00:00 – 00:10: Induction & Drafting**
  *   **Intro (2 mins):** Explain the premise. Do *not* use words like "metaphysics," "composition," "mereology," or "ontology." Use "Stuff," "Objects," and "The Charter."
  *   **Drafting (8 mins):** Houses draft their Charter. They must complete the sentence: *"Some parts compose a whole Object if and only if..."*
  *   *Teacher Role:* Circulate. If they write "they are connected," ask "How connected?" If they write "they make a shape," ask "What shape?" Push for precision without giving answers.

  **00:10 – 00:30: The Gauntlet (Standard Cases)**
  *   Present 6 Scenario Cards. Houses confer (1 min) and rule Yes/No. Reveal rulings simultaneously.
  *   **Card 1 (The Simple):** A single steel ball bearing. (Baseline: Yes).
  *   **Card 2 (The Contact):** Two shirts touching on a hanger in a closet. (Trap: Contact).
  *   **Card 3 (The Fastened):** Two bricks glued together. (Baseline: Yes).
  *   **Card 4 (The Loose):** A pile of sand on a beach. (Trap: Universalism vs. Nihilism).
  *   **Card 5 (The Functional):** The parts of a disassembled watch in a box. (Trap: Function without contact).
  *   **Card 6 (The Biological):** A cat. (Baseline: Yes).
  *   **Scoring:** Deduct Credits for "Yes" rulings. Deduct extra for contradictions against their Charter.
  *   *Expected Collapse:* If they said "Contact" in their Charter, Card 2 forces them to pay for "Shirt-Hanger-Object" or contradict themselves. If they said "Function," Card 5 forces them to count the disassembled watch.

  **00:30 – 00:50: The Continuum (Vagueness Pressure)**
  *   **The Setup:** Tell them: *"I have a series of 10 cases. They are identical except for one variable: Bond Strength."*
  *   **The Series:**
      1.  Two blocks floating 1 meter apart.
      2.  Two blocks touching.
      3.  Two blocks taped.
      4.  Two blocks glued.
      5.  Two blocks welded.
      6.  Two blocks cast as one mold.
      7.  ...up to 10 (A single solid block).
  *   **The Task:** They must identify the *exact number* in the series where composition begins.
  *   **The Trap:** Case 4 and Case 5 are negligibly different. If they draw the line between 4 and 5, ask: *"What physical fact changes between 4 and 5 that creates an Object where there wasn't one?"*
  *   **Scoring:** If they hesitate or say "It's vague," they lose 5 Credits (Penalty for Vagueness). If they pick a line, challenge the arbitrariness. Most will lose credits here.

  **00:50 – 01:05: The Cloud (The Problem of the Many)**
  *   **The Scenario:** *"Consider a cloud. It has a core of dense vapor. Around the edge, water molecules drift in and out. Molecule A is on the edge. Is it part of the cloud?"*
  *   **The Twist:** *"If you say Yes, there are 1,000 molecules that are borderline. For each borderline molecule, there is a slightly different cloud (one with it, one without it). All these candidates overlap. How many clouds are there?"*
  *   **The Task:** Count the Objects present.
  *   **The Trap:** If they say "One," they must explain why *this* precise collection of molecules is the cloud and not the collection missing one edge molecule. If they say "Many," they violate common sense (there is just one cloud).
  *   **Scoring:** If they cannot resolve the count without contradiction, deduct Credits.

  **01:05 – 01:20: The Debrief (Mapping the Trap)**
  *   Reveal the philosophical terminology.
  *   Map their Charter failures to the four standard positions.
  *   Discuss the "Missing Feature."

  ## 4. Debrief Structure: Mapping the Activity to Metaphysics

  **Step 1: The Special Composition Question (SCQ)**
  *   **Reveal:** "The task you just did—deciding when parts make a whole—is called the Special Composition Question."
  *   **Map:** Ask the Houses to read their Charters.
      *   If they said "Always" (any parts compose a whole): **Universalism**. (Cost: The world is crowded with 'trout-turkeys' and shirt-hanger objects).
      *   If they said "Never" (only simples exist): **Nihilism**. (Cost: There are no cats, no chairs, only atoms arranged cat-wise).
      *   If they said "When there is a life": **Organicism** (Van Inwagen). (Cost: What about rocks? Are there no rocks, only atoms?)
      *   If they said "Sometimes, but I can't define it": **Brutalism** (Sider). (Cost: It's a primitive fact, unknowable).

  **Step 2: The Failed Criteria (Contact & Fastening)**
  *   **Reveal:** "Many of you tried to use Contact or Fastening."
  *   **Map:**
      *   **Contact:** Refer to Card 2 (Shirts). If contact suffices, your clothes compose a single object when you wear them. Too many objects.
      *   **Fastening:** Refer to the circularity. To say parts are "fastened" implies they are fastened *into a whole*. You used the concept of 'whole' to define 'whole'.

  **Step 3: The Vagueness Argument**
  *   **Reveal:** "The Continuum Round demonstrated the Sorites Paradox applied to existence."
  *   **Map:** If composition is restricted, there must be a sharp cutoff. But reality doesn't seem to have sharp cutoffs for objects. Therefore, either composition is unrestricted (Universalism) or non-existent (Nihilism). This is the "Vagueness Pressure."

  **Step 4: The Problem of the Many**
  *   **Reveal:** "The Cloud Round showed that ordinary objects have fuzzy boundaries."
  *   **Map:** If boundaries are fuzzy, there are thousands of overlapping candidates for every object. Why do we say 'one'? This challenges the coherence of ordinary object talk.

  **Step 5: Re-describing Ordinary Objects**
  *   Ask: "Under Nihilism, what is this chair?" (Answer: Atoms arranged chair-wise).
  *   Ask: "Under Universalism, what is this chair?" (Answer: One of infinitely many overlapping objects, including the chair-minus-one-leg, the chair-plus-dust, etc.).

  ## 5. Predictable Failures & How to Handle Them

  **1. The "It's Just Convention" Collapse**
  *   **The Problem:** Students will argue, "An object is just whatever we decide to call an object. It's linguistic, not metaphysical."
  *   **The Fix:** Enforce the **Golden Rule** strictly. Remind them: "If I break this chair, does it stop existing? If your answer depends on whether I *call* it a chair, you are doing linguistics. I am asking if the *stuff* remains one thing or becomes many. The world doesn't speak English. Stick to physical conditions."

  **2. The "Refusal to Play" (The Pragmatist)**
  *   **The Problem:** One or two students may refuse to accept the stakes, saying "This is silly, of course chairs exist."
  *   **The Fix:** Assign them the role of **Devil's Advocate** for Nihilism. Give them a private note: *"Your goal is to prove the other House wrong by showing their criteria fail. You don't have to believe Nihilism, just defend it to win Credits."* Gamification usually overrides skepticism.

  **3. The "Time Sink" in the Continuum**
  *   **The Problem:** The Vagueness Round (00:30–00:50) can drag on as students debate the specific bond strength.
  *   **The Fix:** Use a visible timer. When the timer hits zero, they *must* point to a card number. Silence = Bankruptcy. This forces them to feel the arbitrariness rather than talk their way out of it.

  **4. The "Function" Loophole**
  *   **The Problem:** Students will define objects by function ("It's a watch if it tells time").
  *   **The Fix:** Use Card 5 (Disassembled Watch). Ask: "If I smash the watch but keep all the parts in a box, does the Object cease to exist? If yes, where did the stuff go? If no, is the pile of parts a watch?" This pushes them toward either Universalism (the pile is an object) or Nihilism (the watch never existed, only parts).

  ## 6. The Missing Feature: Quantifier Variance
  **Honest Assessment:**
  This activity treats composition as a *classification problem* (sorting cases into "Object" or "Not Object"). However, the deepest layer of the contemporary debate (e.g., Eli Hirsch, Ted Sider) is about **Quantifier Variance**.
  *   **The Issue:** The debate isn't just about whether parts compose wholes; it's about whether the meaning of "there exists" ($\exists$) is fixed. The Universalist and the Nihilist might agree on all the physical facts (the arrangement of atoms) but disagree on what the word "exists" means.
  *   **How to Supply It:** In the final 5 minutes of the debrief, you must explicitly state: *"Some philosophers argue you were never disagreeing about the world, but about the meaning of the word 'exists'. The Nihilist says 'exists' means 'is a simple'. The Universalist says 'exists' means 'is a simple or a collection'. The physical facts are the same; the logic is different."*
  *   **Why it's missing from the game:** You cannot easily gamify semantic conceptual analysis in 80 minutes without confusing the students. The game forces them to treat existence as a substantive property, which is exactly what the quantifier variance theorist denies. You must correct this impression verbally at the end.
