      *Materials:* Printed Scenario Cards. Whiteboards for groups.

      *Predictable Failure:* Students will say "It depends on context." I need to block this. The rule must be *context-independent*. This is crucial for metaphysics. I will add a rule: "The Law of Non-Arbitrariness."

      *Missing Feature:* The connection to *quantification*. The SCQ is ultimately about the meaning of "there exists." The activity treats it as classification. I need to note this.

