  ok so I'm writing an essay about Nietzsche's diet stuff and I want you to tear into it. Notes rather than a full draft:

  The material I'm working from is in Ecce Homo, the chapter where he explains why he's so wise — the food, coffee, alcohol, climate, walking passages, where he claims these little things (nutrition, place, climate, recreation) matter more than everything philosophers have called important up to now. Standard reading: it's either harmless autobiography or early evidence of the collapse. My thesis is it's neither, it's the method. He's writing in the ancient dietetic genre — the regimen sanitatis thing that runs back through Galen — where how you live is inseparable from how you know, so his eating rules are really an epistemology. I've been calling this somato-epistemology, which I'm not in love with.

  Then the second half goes modern: I want to argue that his line about bad digestion producing bad philosophy is basically an early statement of the gut-brain axis, and that the whole programme of trying out diets, climates and long walks on himself is an n=1 self-experiment, i.e. he's a forerunner of the microbiome people. I already suspect this half is a stretch.

  What I want from you: (1) the factual stuff I've got wrong — I'm going off memory for which chapter it's in and for what he actually says about alcohol; (2) is dietetics-as-epistemology a real move or am I just re-describing the boring point that he thought health mattered; (3) does the gut-brain bit earn its keep or should I cut it; (4) a better name than somato-epistemology, or tell me to drop the coinage entirely. No citations needed, I have the texts.
