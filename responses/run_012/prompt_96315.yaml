      *   *Best Selection for Engineers:* **Debugging a Logical Specification.**
      *   *Actually, let's try something more visceral:* **The "Broken Instruction" Task.**
      *   *Refined Idea:* **The "Map Reconstruction" Task.**
          *   *Setup:* A complex map with specific routes and landmarks.
          *   *Decomposition:* Split the map into quadrants.
          *   *Task:* Determine if a specific path exists from Point A to Point B.
          *   *Catch:* The path crosses quadrant boundaries. The *connection points* are the critical information. If the sub-agents don't know exactly what to look for at the boundaries, the global answer is wrong.
      *   *Alternative:* **The "Code Logic" Task.** A piece of pseudocode with a subtle bug that only appears when two specific functions interact.
      *   *Let's go with a "Constraint Satisfaction Puzzle" (like a mini-Sudoku or Logic Grid).**
          *   *Why:* It has a definite answer. It requires global consistency. Local consistency doesn't guarantee global consistency.
          *   *The Twist:* The "Root" agent asks the question. The "Leaf" agents only see a subset of the clues. They must pass summaries up.
