      *   **The Trap:** The conflict exists between Rule 3 and Rule 7. Rule 3 goes to Branch A, Rule 7 goes to Branch B. Unless the summary passed up explicitly mentions the *interaction* potential, the Root says "Safe" because both branches report "Locally Consistent."

  4.  **Developing the Rules & Flow:**
      *   **Roles:** 1 Root, 2 Branches, 4 Leaves, 7 Observers (wait, 1+2+4 = 7. We have 14 people).
      *   **Adjustment:** Two parallel trees running the *same* problem but with different decomposition strategies? Or one big tree with more depth?
