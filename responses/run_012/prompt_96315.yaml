answer: |-
  # Activity: The Siloed Map

  **Goal:** Experientially demonstrate the fragility of recursive decomposition when sub-tasks have hidden dependencies.
  **Group Size:** 14 people (Split into 2 Teams of 7).
  **Time:** 90 Minutes.
  **Materials:**
  *   Printed "Map Quadrants" (4 per team, see *Prep* below).
  *   Envelopes (4 per team, to hold the quadrants).
  *   Sticky notes (3 pads per team).
  *   Pens (1 per person).
  *   A large timer visible to all.
  *   One "Master Map" (the assembled solution) kept hidden by you.

  ## Prep (Do this before the session)
  1.  **Create the Map:** Draw a 10x10 grid on a piece of paper. Draw a continuous red line from the **Top-Left corner (0,0)** to the **Bottom-Right corner (9,9)**.
      *   *The Trap:* Ensure the line crosses the boundaries between quadrants. At one specific boundary crossing (e.g., between Quadrant 1 and 2), leave a **one-square gap**. The line stops at (4,5) in Q1 and starts at (4,7) in Q2. Locally, both look like valid path segments. Globally, the path is broken.
  2.  **Cut It:** Cut this master map into 4 equal quadrants.
  3.  **Duplicate:** Make two identical sets (one for Team A, one for Team B).
  4.  **Role Cards:** Write 7 role cards per team:
      *   1x **Root** (Top of the tree)
      *   2x **Manager** (Middle of the tree)
      *   4x **Worker** (Bottom of the tree, hold the map pieces)

  ## The Rules (Read these aloud at start)
  1.  **Hierarchy:** You are a single distributed mind. Communication *only* flows up and down the chain. Workers talk to Managers. Managers talk to Root. No cross-talk (Workers cannot talk to Workers).
  2.  **The Goal:** The Root must output a single binary answer: **IS THE PATH CONNECTED? (YES/NO)**.
  3.  **The Constraint (Crucial):** To simulate "bounded compute," there is a **Token Limit**.
      *   Workers can only send **5 words max** per note to Managers.
      *   Managers can only send **10 words max** per note to Root.
      *   Root can ask **3 questions total** to the Managers.
  4.  **Secrecy:** Workers cannot show their map piece to anyone. They can only describe it via notes.
  5.  **Time:** You have 30 minutes to reach a consensus.

  ## Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Briefing**
  *   Split into two teams. Hand out Role Cards.
  *   Seat them physically in the tree structure (Root at front, Managers behind, Workers in back) to enforce the channel.
  *   Hand Envelopes to Workers (do not open until told).
  *   Read the Rules. Emphasize the Word Count and Question Limits.

  **00:10 – 00:40: The Recursion (Activity)**
  *   **Start:** Workers open envelopes. They see their map quadrant.
  *   **Process:** Root formulates questions. Managers translate them to Workers. Workers write answers on sticky notes (adhering to word limits). Notes pass up.
  *   **Facilitator Role:** Walk around. Strictly enforce word counts. If a note says "The path goes to the edge at coordinate 4,5", count that as 9 words. If they exceed, make them rewrite. This forces abstraction/summarization.
  *   **Midpoint (00:25):** Announce "15 minutes remaining." Watch for panic.

  **00:40 – 00:50: The Verdict**
  *   Root must write the final YES/NO on a big sheet of paper.
  *   Collect the sheets from both Roots.

  **00:50 – 01:00: The Reveal**
  *   Ask both Roots to state their answer. (Likely one or both will say YES).
  *   Assemble the 4 quadrants of Team A on a table where everyone can see.
  *   Show the gap. Reveal the correct answer (NO).
  *   Assemble Team B. Compare.

  **01:00 – 01:30: Debrief (The most important part)**
  *   See *Debrief Script* below.

  ## Predictable Failures & Salvage

  **Failure 1: The "Cheating" Collapse**
  *   *What happens:* Workers realize the constraints make the task impossible, so they lean over and show their maps to each other or talk across the room.
  *   *Salvage:* Don't stop them immediately. Let it happen for 5 minutes. Then call "Timeout." Say: *"In the theoretical model, the copies are isolated processes. They cannot share memory addresses. If you share the map, you've broken the simulation. Please return to notes."* This actually strengthens the point: the *constraint* is the feature, not a bug.

  **Failure 2: The "Manager Bottleneck"**
  *   *What happens:* Managers just pass notes through without summarizing. The Root gets flooded with 4 different 5-word notes and gets confused.
  *   *Salvage:* Intervene as "System Monitor." *"Manager, you are acting as a wire, not a processor. The model requires you to synthesize. Rewrite that summary to combine the two Worker inputs into one statement."*

  **Failure 3: They Solve It Too Fast**
  *   *What happens:* A clever Root asks "What are the exact entry and exit coordinates?"
  *   *Salvage:* This is actually a win, but rare. If they succeed, ask them: *"How many tokens did that cost? If the map was 100x100 and cut into 100 pieces, would that question scale?"* This pushes them back into the complexity problem.

  ## Debrief Script (Mapping to the Idea)

  **1. The "Idealized Self" Claim**
  *   *Ask:* "Root, you are the 'I' in this scenario. The Workers are copies of you, just bounded. Did you feel like you had enough information to make a decision?"
  *   *Point:* The theory says if you just recurse enough, you get the answer. But you hit a wall where the *interface* between copies (the 5-word note) stripped away the critical data (the coordinate mismatch).

  **2. The "Decomposition" Claim**
  *   *Ask:* "Was the task actually decomposable? Could you solve your quadrant without knowing about the others?"
  *   *Point:* Locally, the answer was always "Yes, I have a path segment." The error wasn't in the sub-tasks; it was in the **recombination**. The claim that "recombining pieces doesn't lose anything" is where the system broke. The "gap" was a global property that didn't exist in any local view.

  **3. The "Bounded vs. Unbounded" Nuance**
  *   *Ask:* "If you had infinite time (unbounded), but still had the 5-word limit, would you have succeeded?"
  *   *Point:* Probably not. You would just have more iterations of the same lossy summary. This challenges the idea that *patience* solves alignment. If the decomposition schema itself loses context (the "ontology mismatch"), infinite compute just gives you a very precise wrong answer.

  **4. Engineering Parallel**
  *   *Ask:* "When does this happen in our code?"
  *   *Point:* Microservices. API contracts. Module boundaries. We assume if Module A works and Module B works, the system works. But the *interaction* at the boundary is where the hidden state lives.

  ## Limitations of This Activity (Be Honest Here)

  You must tell the group what this activity *fails* to capture, or they will draw the wrong conclusions:

  1.  **Theory of Mind:** In the activity, the Workers are humans. They *know* the Managers might need coordinate data. In the AI alignment theory, the sub-copies are not necessarily "you" in the sense of having your intuition; they might be distilled, weaker versions. The activity is actually *easier* than the theoretical case because humans can guess what info is relevant.
  2.  **Semantic Understanding:** Humans understand what a "path" is. In the AI case, the sub-agents might not share the same concept of "path" if they are distilled differently. We didn't simulate *concept drift*, only *information loss*.
  3.  **Malice vs. Error:** In AI alignment, we worry about copies deceiving the root. Here, everyone is cooperating. The failure was accidental, not adversarial.

  **Closing Thought for the Group:**
  "The activity showed that **lossless decomposition is a property of the task, not just the agent.** If the world is tightly coupled (like the map gap), splitting the agent doesn't help. The alignment claim assumes the world can be factored. Our job is to figure out when it can't."
