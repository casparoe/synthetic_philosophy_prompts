      *   **Clues:** Distributed among leaves.
      *   **Constraint:** Leaves can only answer specific questions from their Mid. Mids can only answer specific questions from Root.
      *   **The Trap:** The clues imply $A=B$ and $B=C$, but $A \neq C$ is stated elsewhere. Or simpler: A dependency chain.
      *   *Let's go with the "Map Route" idea again, it's more visual and less abstract.*
      *   **Task:** Is there a continuous red path from Top to Bottom?
      *   **Grid:** 8x8 grid printed on paper.
      *   **Distribution:** Cut the grid into 4 quadrants (for leaves).
