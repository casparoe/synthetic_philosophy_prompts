          *   No reading list at the end.

  2.  **Deconstruct the Philosophical Idea:**
      *   *Claim 1:* Infinite recursion of self = Idealized Self. (This is generally accepted as a definition of capability).
      *   *Claim 2:* Any hard question $\rightarrow$ Decomposable into bounded pieces $\rightarrow$ Recombined without loss. (This is the weak link).
      *   *Why is Claim 2 suspect?* Context loss, holistic intuition, non-linear dependencies, "gestalt" properties, communication overhead, error propagation.
      *   *How to simulate this with humans?* We need a task that *looks* decomposable but has hidden dependencies or requires holistic context that gets lost when split.

  3.  **Brainstorming the Task:**
