      *   *Wait, I need to enforce the "Recursive Tree" structure.*
      *   *Structure:* 1 Root -> 2 Managers -> 4 Workers -> 7 Leaves (14 people total).
      *   *Task:* Solve a specific logic puzzle where the clues are distributed.
      *   *Problem:* If I just hand out clues, it's jigsaw. I need them to *query* the lower levels.
      *   *Revised Task:* **"The Hidden Configuration."**
      *   *Scenario:* There is a hidden 4x4 grid of colored tiles. The goal is to determine the color of the center 2x2 area.
      *   *Rules:* No one sees the whole grid.
      *   *Decomposition:* The Root asks "What is the center?" The Managers ask sub-questions. The Leaves see only 1 tile or a small patch.
      *   *The Catch:* The color of a tile depends on its neighbors (Cellular Automata rule or simple dependency). To know Tile (2,2), you need to know Tile (2,1) and (1,2).
      *   *Actually, let's make it simpler to run in 90 mins.*
      *   *Task:* **Verify a Mathematical Proof or Logical Argument.**
      *   *No, too dry.*
      *   *Task:* **The "Budget Allocation" Problem.**
      *   *Scenario:* A company has $100k. 4 Departments. Each has constraints.
      *   *Goal:* Maximize total utility.
      *   *Decomposition:* Each sub-agent optimizes their department.
      *   *The Catch:* There are shared resources or cross-department dependencies that aren't visible locally.
      *   *This is perfect for engineers.* It simulates system design.

      *   *Let's refine the "System Design/Constraint" idea into a concrete puzzle.*
      *   **The Activity:** "The Protocol Verification."
