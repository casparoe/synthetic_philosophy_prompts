      *(Self-Correction on Timeline)*: 90 mins is short for 2 rounds. Just do 1 round + deep debrief.

      *(Predictable Failure)*: The "Middle Management" bottleneck. They will just pass info up without synthesizing.
      *(Salvage)*: Intervene as "System Monitor" to enforce the synthesis rule.

      *(Limitation)*: Humans have theory of mind; AI copies don't. Humans can guess what the other needs. This makes the task *easier* for humans than the theoretical AI case, ironically. I need to mention this.

      *(Wait, one more thing)*: The prompt asks for *one* activity. I will design it for the whole group as one tree if possible, but 14 people is a deep tree. 1 -> 2 -> 4 -> 7? No, 1+2+4+7 = 14. Perfect. One big tree.
      *   Root: 1
