          *   20-50: The Recursive Process (The core activity).
          *   50-60: Reveal & Verification.
          *   60-90: Debrief.
      *   **Roles:** 2 Teams of 7. (1 Root, 2 Managers, 4 Workers).
      *   **The Twist:** The "Protocol" restricts communication. Workers can only answer "Yes/No" or specific numeric queries from Managers. Managers summarize for Root.
      *   **The Failure Mode:** Managers ask "Is there a path segment?" instead of "Where does the path enter/exit?"
