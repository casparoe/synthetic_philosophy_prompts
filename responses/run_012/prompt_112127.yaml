  hey so my school lit mag is doing a satire issue and I want to write a fake advice column, like a Dear Abby but for judges. every letter is a judge stuck on a hard statutory interpretation problem and the columnist gives these super confident answers that quietly flip between textualism and purposivism depending on which one gives him the answer he already wants. deadpan, no winking, no "wink wink this is silly", around 600 words, three or four letters plus replies.

  the jokes have to come from the actual jurisprudence though, not just lawyers being dumb, so a nerd should recognize the ways he's being wrong. for every canon he cites he should have a counter-canon ready the second it stops being convenient (theres that old point that every canon has an equal and opposite one, lean on that). he should treat the plain meaning as obvious even when the letter is literally about the case where it isn't. one reply he's all in on the drafters' emails as evidence of what they meant, and the next he calls that stuff the invention of committee staff who nobody elected, and somewhere he should wave off the whole thing by saying congress isn't one mind anyway so if a bill passed because 218 people each wanted something different, whos intent are we even looking for. one letter should be a typo case where the text plainly says one thing and everyone admits thats not what anyone meant, and another should be a rule everyone has followed the wrong way for 80 years so the practice itself has basically settled the meaning, and he should handle those two in flatly inconsistent ways without noticing.

  dont have him cite real statutes or cases (i cant check them and i dont want it to be wrong), just invent the laws. by the end a reader who's never read a statute should still get the real point, that the method is picking the conclusion instead of the conclusion following from the method.
