  **Dear Bench**
  *By The Honorable Oracle*

  **Dear Oracle:**
  I'm presiding over *State v. Miller*. The statute prohibits "vehicles" in the park. The defendant rode a bicycle. The legislative drafters admit in sworn affidavits they meant "motorized vehicles" and "vehicles" was a clerical error. Everyone knows bikes belong in the park. Do I enforce the typo?
  **Signed, Stuck in Syntax**

  **Dear Stuck:**
  Obviously not. The text is the law. When the language is plain, the inquiry ends. You are not a legislature-plus; you are a legislature-minus. If the drafters meant "motorized," they should have written "motorized." To override the plain meaning based on unenacted intent violates the separation of powers. The canon of Scrivener's Error requires clear evidence, not just convenient affidavits. Stick to the text. Bikes are vehicles. Case closed.

  **Dear Oracle:**
  I have a case involving the "Fair Work Act." The text requires "reasonable break times." It's vague. However, I have emails from the bill's primary sponsor stating clearly that "reasonable" means "no less than 15 minutes per four hours." Can I use these emails to define the term?
  **Signed, Needing Clarity**

  **Dear Needing:**
  Certainly. Statutes are not written in a vacuum. Where the text is susceptible to multiple readings, the purpose illuminates the meaning. The sponsor's contemporaneous explanations provide reliable evidence of what the enacting coalition intended to achieve. To ignore this would be to pretend words exist without context. Use the emails to confirm the 15-minute rule. Justice requires understanding what the drafters sought to fix.

  **Dear Oracle:**
  Similar issue here. The "Public Safety Act" bans "dangerous instruments" in schools. The committee report and sponsor emails explicitly exclude "kitchen knives used in vocational classes." But the text doesn't say that. Can I rely on the reports to create an exception?
  **Signed, Conflicted Colleague**

  **Dear Conflicted:**
  Absolutely not. Congress is not a single mind; it is a collective body of 535 individuals. Committee staff emails are not law. Only the text passed by both houses and presented to the President carries legal force. To bind citizens to unenacted legislative history is to govern by bureaucracy rather than democracy. If the exception isn't in the text, it doesn't exist. Kitchen knives are dangerous instruments.

  **Dear Oracle:**
  I'm looking at the "Tax Code § 404." It says filers must submit forms to the "Department of Revenue." For 80 years, everyone has filed them with the "Department of Finance." Everyone knows Revenue was a drafting mistake. The text is plain, but the practice is universal. Do I force them to switch?
  **Signed, Practical Judge**

  **Dear Practical:**
  Do not disturb settled expectations. While text is primary, long-standing practical construction by the executive branch and the public settles ambiguous meaning. When a interpretation has been relied upon for eight decades, stability outweighs semantic purity. The practice itself has become part of the statute's fabric. Let them file with Finance. To rule otherwise would be chaos.

  **The Honorable Oracle**
