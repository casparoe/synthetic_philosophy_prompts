answer: |-
  **Vignette: The Compliant Commander**

  A military commander is planning a strike on an enemy munitions depot located in a populated area. She knows that launching the strike will inevitably cause the deaths of five civilians as a side effect. She does not care about the civilians; her only goal is to destroy the depot. However, the strike is fully compliant with the Rules of Engagement and International Law, which permit collateral damage of this scale given the military value of the target. The commander authorizes the strike. The depot is destroyed, and five civilians are killed.

  **Fixed Variables:**
  *   **Knowledge:** The commander knows the side effect will occur.
  *   **Causal Contribution:** The commander's order causes the side effect.
  *   **Indifference:** The commander is indifferent to the side effect (she does not pursue it as a goal, nor does she try to avoid it).

  **Divergent Variables:**
  *   **Moral Status (Valence):** The outcome (death of civilians) is morally bad.
  *   **Normative Status:** The outcome conforms to the relevant prescriptive norms (Rules of Engagement).

  **Predictions:**

  *   **The Valence Account:** This account predicts that subjects will judge the commander to have **intentionally** killed the civilians. Because the outcome is morally bad, the negative valence triggers the attribution of intentionality, regardless of whether a rule was broken. The mechanism is driven by the desire to blame the agent for a harmful outcome.
  *   **The Norm Account:** This account predicts that subjects will judge the commander to have **not intentionally** killed the civilians. Because the outcome conforms to the norms the agent is expected to uphold (the Rules of Engagement), there is no norm violation to flag the action as deviant. Since moral wrongness is merely one species of norm violation, and no norm was violated here, the condition for intentionality is not met.

  **Feature to Vary for Agreement:**

  To bring the two accounts back into agreement, one would vary the **normative status of the side effect** while holding its moral status fixed. Specifically, the vignette would be altered so that the strike *violates* the Rules of Engagement (e.g., the collateral damage exceeds the legal limit), while the outcome remains morally bad (civilians still die).
  *   **Result:** Both accounts would then predict an **Intentional** judgment. The Valence Account predicts Intentional because the outcome is bad. The Norm Account predicts Intentional because the outcome violates a prescriptive norm.

  **Implications for the Concept of Intentional Action:**

  The resolution of this conceptual issue indicates whether the Knobe effect reflects the semantic content of the concept of intentional action or a pragmatic performance error adjacent to it.

  If empirical data from this vignette shows a persistent asymmetry (e.g., subjects still say "intentional" despite norm conformity), it suggests that the **concept of intentional action itself** is inherently evaluative, specifically sensitive to moral valence independent of normative rules. This would imply that moral judgment penetrates the core criteria for action attribution.

  Conversely, if the asymmetry disappears (subjects say "not intentional" when norms are followed, even if the outcome is bad), it suggests the standard Knobe effect arises because moral badness and norm violation typically covariate. This would imply that the concept of intentional action is not inherently moral but is sensitive to **normative deviation** broadly.

  Finally, if judgments in this divergent case become statistically uniform (e.g., 50/50 splits or no significant difference compared to a control), it would indicate that the Knobe effect is not evidence about the concept of intentional action at all. Instead, it would suggest the effect is **adjacent to the concept**, driven by pragmatic factors like blame attribution or conversational implicature that influence how people *apply* a purely psychological concept in social contexts, rather than altering the concept's truth conditions.
