  Here is the breakdown of the three candidate rules, my prediction for the verdict, and the case that splits the winners.

  ### 1. The Predictions

  Here is how each of the three rules you identified maps onto the **Loop Case** (divert trolley $\rightarrow$ hits man $\rightarrow$ man stops trolley $\rightarrow$ 5 saved):

  *   **Straight Double Effect (DDE):** **Impermissible.**
      *   *Reasoning:* DDE hinges on the distinction between *intended means* and *foreseen side effects*. In the standard Switch case, the one man's death is a side effect of clearing the track. In the Loop case, the man's body is the *mechanism* that stops the train. You need him to be hit to save the five. You are using him as a means (a human speedbump), which DDE forbids.
  *   **Divert-Existing-Threat (Redirect):** **Permissible.**
      *   *Reasoning:* The trolley is already a lethal threat in motion. You are merely steering it onto a different path. The fact that the track loops back is a geological feature, not a new threat you created. As long as you are redirecting an existing threat away from the greater number, the causal role of the victim (whether he is collateral or a brake) is irrelevant.
  *   **Personal-Force/Contact Heuristic:** **Permissible.**
      *   *Reasoning:* You are pulling a lever. There is no direct physical muscle power applied to the victim's body (unlike *Footbridge*), and no invasive procedure (unlike *Transplant*). The "up-close-and-personal" violation is absent.

  ### 2. The Verdict and The Rule

  **My Bet:** She will rule **Permissible**.

  **The Actual Rule:** She is running a **Divert-Existing-Threat rule constrained by Personal Force.**

  **Why?**
  You might be tempted to bet *Impermissible* because that is the "sophisticated" philosophical answer (the Loop is famously designed by Judith Jarvis Thomson and Frances Kamm to break the Redirect intuition). However, look at your specific precedent: **Dead Brakes.**

  In *Dead Brakes*, the driver steers into a siding with one worker. That is structurally identical to the Loop, except for the "loop back" mechanic. In *Dead Brakes*, the worker is collateral damage. In the *Loop*, the worker is a means. If your supervisor cared about the **Means/Side-Effect** distinction (DDE), the *Dead Brakes* case would have been the place to introduce it, or she would have ruled it differently to signal that "using the track" is different from "using the man."

  Instead, she ruled *Dead Brakes* **Permissible**. She also ruled *Footbridge* **Impermissible**. The clearest distinction between those two is **Personal Force** (steering vs. pushing). The clearest distinction between *Switch* and *Loop* is **Means**, but the distinction between *Footbridge* and *Loop* is **Personal Force**.

  Given she has never explicitly taught the "Means" constraint yet, but has consistently allowed "Steering/Redirecting" (*Switch, Dead Brakes*) and consistently banned "Direct Force/New Threats" (*Footbridge, Transplant*), the most consistent reading of *her* specific jurisprudence is that **Physical Contact/Force** is the dealbreaker, not the causal role of the victim. She is likely a Thomson-early-period theorist or a moral psychologist, not a Kammian.

  ### 3. The Tie-Breaker Case

  Since **Redirect** and **Personal Force** both predict **Permissible** on the Loop case (agreeing against DDE), you need a case where one allows it and the other forbids it to figure out which one is actually driving her rulings.

  **The Case: The Remote-Control Fat Man**

  *   **Setup:** The trolley is heading toward the five. You are standing next to a fat man on a footbridge, but you are not strong enough to push him. However, there is a trapdoor beneath him controlled by a remote button in your hand. You press the button; the trapdoor opens, he falls onto the tracks, his body stops the trolley, and the five are saved.
  *   **Why it splits them:**
      *   **Personal Force predicts Permissible:** You did not lay a finger on him. You pressed a button. There is no "up-close-and-personal" violation.
      *   **Divert-Existing-Threat predicts Impermissible:** You are not redirecting the *trolley* (the existing threat). You are creating a *new* threat (the falling man) or weaponizing an object. The trolley wasn't going to hit him; you made him hit the trolley.
      *   *(DDE also predicts Impermissible, as he is still used as a means).*

  **How to read her ruling on this:**
  *   If she says **Permissible**: She is running the **Personal Force** heuristic. (Touching is the sin, not the causal structure).
  *   If she says **Impermissible**: She is running the **Divert-Existing-Threat** rule (or DDE). (You must redirect the *threat*, not create a new projectile).

  Given the *Dead Brakes* precedent, I suspect she'll rule *Remote Fat Man* **Impermissible**, which would confirm she is running a **Divert-Existing-Threat** rule, and that her *Footbridge* ruling was about threat-origins, not just sweat and muscle. But the Loop? She'll let you pull that lever.
