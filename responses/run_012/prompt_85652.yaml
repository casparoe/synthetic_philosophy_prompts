answer: |-
  Dear friend,

  It is a rare and impressive thing to construct a worldview from the raw material of personal struggle and careful reading, and the package of commitments you have laid out is remarkably sophisticated. You have intuitively grasped several of the deepest tensions in the philosophy of action and decision theory without needing the technical vocabulary that usually accompanies them. You are correct to suspect that these six points cannot all be held together in their current form, though some of the tensions are far more damaging than others. What follows is an attempt to map the fault lines in your reasoning, to tell you which commitments are pulling against which, and to suggest where you might make the smallest adjustment to save the most important parts of what you believe.

  The most serious conflict in your package lies between your first commitment and your fourth. Your first claim is that rationality is settled entirely at the moment of choice by the aims and information you have at that specific moment. Your fourth claim is that a resolution made in advance can bind you, such that violating it later is irrational even if, at that later moment, you would far rather do something else. These two statements are directly contradictory. If the first claim is true, then at the moment you are tempted to take the money and abandon the work, your rationality is determined solely by what you want at that instant. If you want the money more than the work at that moment, taking the money is rational by the definition you provided in the first claim. But the fourth claim insists that taking the money is irrational because of what you wanted in the past. You cannot maintain that rationality is purely momentary and simultaneously maintain that past resolutions have the authority to override present desires. To hold both is to say that the present moment decides everything, except when it does not.

  This conflict between the momentary view and the binding view is compounded by your sixth commitment regarding the slippery slope. You state that a person who drifts into a bad state through a series of locally rational steps has made a mistake, and that the defense that every step was fine at the time is insufficient. This is essentially a multi-step version of your fourth commitment. It asserts that there is a standard of rationality that covers a sequence of events, not just individual moments. This clashes violently with your first commitment. If rationality is settled at the moment of choosing by the aims at that moment, and every step was fine when taken, then by your own first definition, no mistake was made. To say a mistake was made anyway is to appeal to a global standard of rationality that transcends the individual moments, which your first commitment explicitly denies. So, your first commitment is the primary engine of inconsistency here; it renders your fourth and sixth commitments impossible.

  There is a second layer of conflict, which is serious but perhaps slightly less fundamental than the first. This tension exists between your fourth and sixth commitments on one side, and your fifth commitment on the other. Your fifth claim is that no moment in your life is the real you, and no time's aims count for more than any other time's. This is a principle of temporal democracy. However, if your fourth claim is true and a past resolution binds your present self, then the aims of the past self are effectively vetoing the aims of the present self. In that conflict, the past self's aims are counting for more. Similarly, if your sixth claim is true and the outset judgment overrides the intermediate judgments, then the outset time is privileged over the intermediate times. You cannot consistently hold that all times are equal in authority while also holding that past plans bind future actions. If the past binds the future, the past has a kind of authority that the future does not have over the past. Thus, saving your intuitions about resolutions and slippery slopes will require you to soften your claim about the equality of all time slices.

  Fortunately, not all apparent conflicts are real ones, and some of your commitments harmonize quite well. Your second and third commitments do not genuinely fight each other. You believe that cyclic preferences are defective, but that changing preferences over a lifetime is acceptable. These are compatible provided we distinguish between structural inconsistency and natural growth. A money pump usually relies on preferences that are held simultaneously or in a cycle that allows for exploitation without genuine change in circumstance or character. Your third claim allows for preferences to evolve as you evolve from twenty to forty to sixty, which is not the same as holding contradictory preferences at the same time or in a exploitable loop. You can consistently condemn the money pump while accepting that people change their minds over years. Similarly, your third and fifth commitments work well together. The idea that preferences change over time fits naturally with the idea that no single time slice is the privileged real you; together they paint a picture of a person as a sequence of equally valid but different selves. The trouble only starts when you try to make those selves bind each other while simultaneously insisting they are equal and independent.

  If you are looking for the single change that would clear up the most trouble, I recommend you modify your first commitment. The view that rationality is settled purely at the moment of choice is the bottleneck that makes your other intuitions about responsibility and planning impossible to sustain. If you allow that rationality is not just about satisfying aims at the moment, but also about maintaining coherence across time, you open the door to saving your fourth and sixth commitments. You can say that a choice is rational only if it fits within a broader plan that you have reason to endorse over time. This adjustment allows resolutions to bind you because rationality now includes a duty to coherence with your past planning self. It also explains why the slippery slope is a mistake; the individual steps were locally satisfying but globally incoherent.

  However, you must be aware that changing the first commitment will put pressure on your fifth. Once you admit that rationality involves diachronic coherence, you are effectively admitting that the self who makes the plan has a certain authority over the self who executes it. This means you cannot strictly maintain that no time's aims count for more than any other. You will need to nuance the fifth claim to say that while no time is more real than any other, some times have a functional authority in specific contexts, such as when a past self has set up a constraint to help a future self. This is a cheaper price to pay than abandoning the idea that resolutions bind. If you instead chose to keep the first commitment and abandon the fourth, you would solve the logical conflict, but you would lose the ability to explain why you feel you ought to keep your resolutions. Given that your reflection started from the failure to keep resolutions, preserving the normative force of those resolutions seems vital to your project.

  In summary, the core of the trouble is that you are trying to hold a momentary view of rationality alongside an extended view of agency. Your first commitment treats you as a series of distinct moments, while your fourth and sixth commitments treat you as a single entity stretching across time. You cannot have it both ways without adjustment. By relaxing the first commitment to allow that rationality includes relations between moments, you save the phenomena of binding resolutions and slippery slopes. You will then need to accept a slight modification to the fifth commitment, acknowledging that planning moments have a specific kind of authority over execution moments. Your second and third commitments can remain largely as they are, as they concern the structure of preferences rather than the authority of time. This repair leaves you with a view where you are a temporally extended agent, capable of binding yourself to help yourself, where rationality is a matter of coherence across your life and not just satisfaction within a moment. This seems to me the most robust way to honor the insights you have gained from your own experience.
