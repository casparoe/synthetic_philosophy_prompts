prompt: |-
  I have been arguing with a friend about counterfactual mugging, and I want the argument audited rather than restated. The case as we both accept it: Omega, whose predictions are reliable, flips a fair coin. If it lands tails, Omega asks you for $100. Had it landed heads, Omega would instead have paid you $10,000, but only if it had predicted before flipping that you would pay in the tails case. Omega is honest, and the prediction has already been made. The coin has landed tails, you know this, and Omega asks you for the $100. Nothing you do now alters anything else in the actual world.

  My friend, who favours decision theories that evaluate whole policies rather than individual acts, says that paying is simply the purchase of insurance. The $100 is the premium; what is insured against is your not being in the heads branch; the $10,000 is the payout; Omega is the underwriter; and the coin's having come up tails no more shows the premium to have been wasted than a year without a fire shows a fire premium to have been wasted. Her conclusion is that refusing to pay rests on the same error as regretting an insurance premium in hindsight, and that the unease people feel about the mugging is merely that error in dramatic costume.

  Please audit the analogy.

  1. Give the correspondence table: what plays the role of the premium, the payout, the insured event, the loss, the risk pool, the underwriter, the actuarial probability, and the information available to the payer at the moment of payment.

  2. Say where the mapping breaks, and separate the breaks that matter for her conclusion from those that are decorative.

  3. Press two points in particular. First, in ordinary insurance is there ever a case in which the premium is paid in one state of the world and the payout collected in another, by someone who did not pay? If not, say precisely what the insurance picture assumes about the standpoint from which the two branches are being weighed, and whether that assumption is the very thing at issue between causal and evidential (or policy-evaluating) accounts of rational choice. Second, does the insurance picture require the premium decision to be taken before the outcome is known, and does the shift from acts to policies restore whatever that timing removes?

  4. It has occurred to me that what she describes is less like insurance than like a wager on heads whose stake is collected only when the bet loses. Tell me whether that diagnosis is right, and if it is, whether it helps or damages her case.

  5. Then the verdict: does the analogy support her conclusion, or does it presuppose it? If it fails, propose a better analogy — one that keeps whatever is legitimate in the thought that it can be rational to pay for a state of affairs one knows does not obtain, without assuming that branches one knows are not actual can be treated as risks one bears. Finally, say briefly whether the verdict changes for the blackmail-shaped cases that circulate alongside the mugging, where payment is demanded to avert a threat rather than offered to secure a reward.
reasoning: |-
  Here's a thinking process that leads to the audit of the counterfactual mugging insurance analogy:

  1.  **Deconstruct the Request:**
      *   **Task:** Audit an argument between the user and a friend regarding Counterfactual Mugging.
      *   **Friend's Position:** Paying the $100 is like buying insurance. The $100 is the premium, the $10,000 (in the counterfactual heads world) is the payout. Refusing is like regretting an insurance premium after no fire occurred.
      *   **User's Position:** Implicitly skeptical (wants the argument audited, not restated).
      *   **Specific Requirements:**
          1.  Provide a correspondence table (Premium, Payout, Insured Event, Loss, Risk Pool, Underwriter, Actuarial Probability, Information at Payment).
          2.  Identify where the mapping breaks (distinguish "matters for conclusion" vs. "decorative").
          3.  Press two specific points: (a) Cross-branch payment/collection in insurance? (b) Timing of decision vs. outcome knowledge and policy shifting.
          4.  Evaluate the "wager on heads whose stake is collected only when the bet loses" diagnosis.
          5.  Deliver a verdict (supports vs. presupposes), propose a better analogy if needed, and address blackmail variants.

  2.  **Analyze the Counterfactual Mugging Scenario:**
      *   **Setup:** Omega predicts. Coin flip (50/50).
      *   **Heads:** Omega pays $10,000 *if* predicted you would pay in Tails.
      *   **Tails:** Omega asks for $100 *if* predicted you would pay in Tails.
      *   **Current State:** Coin is Tails. You know it. Omega asks for $100.
      *   **Causal Reality:** Paying $100 now changes nothing in the actual world (Omega already predicted, coin already landed).
      *   **Decision Theory Conflict:** CDT (Causal Decision Theory) says don't pay (no causal impact). FDT/UDT (Functional/Updateless Decision Theory) says pay (optimizes the policy/output of the algorithm across possible worlds).

  3.  **Analyze the Friend's "Insurance" Analogy:**
      *   **Core Claim:** Paying $100 in Tails is the premium for receiving $10,000 in Heads.
      *   **Rationale:** Ex-ante expected value is positive. Ex-post regret is irrational.
      *   **Implicit Assumption:** The "self" that pays in Tails and the "self" that benefits in Heads are part of the same risk pool/identity such that value transfers between them count as a net gain for the agent.

  4.  **Drafting Section 1: Correspondence Table:**
      *   *Premium:* $100 paid in Tails world.
      *   *Payout:* $10,000 received in Heads world.
      *   *Insured Event:* Coin landing Heads (or rather, the *opportunity* to gain, though insurance usually covers loss). Actually, strictly speaking, insurance covers a *loss*. Here, Heads is a gain. So it's more like an investment or a bet. But sticking to the friend's analogy: Insured Event = "Being in the Heads branch" (avoiding the loss of the $10k opportunity?). Let's refine. In insurance, you pay to avoid a loss. Here, you pay to *enable* a gain. The friend calls it insurance. I need to map it to her terms.
      *   *Loss:* Missing out on the $10,000 (opportunity cost).
      *   *Risk Pool:* The set of possible worlds (Heads & Tails) weighted by probability.
      *   *Underwriter:* Omega.
      *   *Actuarial Probability:* 50% (fair coin).
      *   *Information at Payment:* You know the coin is Tails (in the actual payment scenario). In standard insurance, you don't know the loss event has failed to occur when you pay the premium (you pay upfront).

  5.  **Drafting Section 2: Where the Mapping Breaks:**
      *   *Break 1: Timing/Information.* In insurance, you pay *before* uncertainty is resolved. In Mugging (Tails branch), you pay *after* resolution.
      *   *Break 2: Identity/Transfer.* In insurance, the payout goes to *you* (the payer). In Mugging, the payout goes to *Counterfactual You*. Actual You never sees the $10k.
      *   *Break 3: Causality.* Insurance premiums causally contribute to the pool that pays claims. Paying $100 in Tails does not causally produce the $10k in Heads (Omega already decided).
      *   *Matters for Conclusion:* Break 2 (Identity/Transfer) and Break 3 (Causality/Updatelessness). The core dispute is whether "you" care about counterfactual versions of yourself. Break 1 is fixable by policy shifts (UDT).
      *   *Decorative:* Omega's supernatural nature (could be a contract).

  6.  **Drafting Section 3: Pressing the Two Points:**
      *   *Point 1 (Cross-branch payment):* In real insurance, the person paying the premium is the same entity receiving the payout. There is no case where *Actual You* pays and *Counterfactual You* receives. The insurance picture assumes a "God's eye view" or a "pre-commitment view" where all branches are weighted. This *is* the dispute between CDT (actual world only) and FDT/UDT (policy across worlds).
      *   *Point 2 (Timing/Policy):* Insurance requires payment before outcome. Mugging asks for payment after outcome (in the Tails branch). Shifting to "policies" (UDT) effectively moves the decision point to *before* the coin flip (conceptually). Does this restore the analogy? Yes, if you accept the policy framework. But if you reject the policy framework (CDT), the timing break is fatal.

  7.  **Drafting Section 4: The Wager Diagnosis:**
      *   *Diagnosis:* "A wager on heads whose stake is collected only when the bet loses."
      *   *Analysis:* If I bet on Heads, I win if Heads. If I lose (Tails), I lose my stake. Here, if Heads, I win $10k. If Tails, I lose $100.
      *   *Twist:* Usually, you pay the stake upfront. Here, the stake is collected *only* on Tails.
      *   *Verdict:* This is accurate. It's a "conditional bet."
      *   *Help or Harm:* It damages the "Insurance" label (insurance mitigates loss, this is speculative gain), but it clarifies the structure. It highlights that the "cost" is only incurred in the losing branch. This makes the reluctance to pay *more* rational from a CDT perspective (why pay on a lost bet?), but *less* rational from a UDT perspective (you need to accept the bet terms ex-ante). It undermines the "Insurance" emotional cover but keeps the math similar.

  8.  **Drafting Section 5: The Verdict:**
      *   *Support vs. Presuppose:* The analogy presupposes the conclusion. It assumes that paying in Tails *is* buying something valuable, which is only true if you value the Counterfactual Heads world. It begs the question against CDT.
      *   *Better Analogy:* "Subscription Fee for Existence" or "Toll Booth on a Multiverse Highway." Or better: **The Pre-commitment Contract.** You sign a contract before the coin flip. The contract says "If Tails, pay $100. If Heads, get $10k." Omega enforces this. The Mugging is Omega presenting the bill *after* the flip. The question is: Are you bound by the pre-commitment?
      *   *Blackmail Variant:* In blackmail (e.g., Parfit's Hitchhiker or logical blackmail), you pay to avoid a negative. In Mugging, you pay to "validate" a positive. The logic is similar (policy consistency), but the emotional valence differs. In blackmail, not paying leads to a worse actual world (death). In Mugging, not paying leaves the actual world unchanged, only the counterfactual changes. This makes the insurance analogy *weaker* for Mugging than for Blackmail.

  9.  **Refining and Polishing:**
      *   *Tone:* Analytical, precise, philosophical but accessible.
      *   *Check Constraints:* Did I answer all 5 numbered prompts? Yes.
      *   *Nuance:* Ensure the distinction between CDT and FDT/UDT is clear without getting bogged down in jargon. Focus on the "Insurance" analogy's structural integrity.
      *   *Self-Correction on Point 1:* Be careful about "Insurance." Insurance indemnifies loss. Mugging offers gain. The friend calls it insurance against "not being in the heads branch." That's awkward. It's really an investment. I need to point out this category error in the audit.
      *   *Self-Correction on Point 3:* The "standpoint" issue is crucial. The "view from nowhere" vs. "view from now."
      *   *Self-Correction on Verdict:* The verdict should be sharp. The analogy is a rhetorical sleight of hand that smuggles in Updatelessness.

  10. **Final Review against constraints:**
      *   1. Correspondence table? Yes.
      *   2. Breaks (matter vs decorative)? Yes.
      *   3. Press two points (cross-branch payment, timing/policy)? Yes.
      *   4. Wager diagnosis? Yes.
      *   5. Verdict (support vs presuppose), better analogy, blackmail note? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  ### 1. Correspondence Table

  | Insurance Concept | Counterfactual Mugging Element |
  | :--- | :--- |
  | **Premium** | The $100 paid in the Tails world. |
  | **Payout** | The $10,000 received in the Heads world. |
  | **Insured Event** | The coin landing Heads (framed as avoiding the "loss" of the opportunity). |
  | **Loss** | Foregoing the $10,000 (opportunity cost). |
  | **Risk Pool** | The set of possible worlds (Heads and Tails) weighted by probability. |
  | **Underwriter** | Omega. |
  | **Actuarial Probability** | 50% (the fair coin). |
  | **Information at Payment** | **Critical Divergence:** In insurance, the payer does not know the outcome. In the Mugging (Tails branch), the payer *knows* the coin is Tails and the "insured event" did not occur. |

  ### 2. Where the Mapping Breaks

  The analogy relies on structural isomorphisms that dissolve under scrutiny. We must distinguish breaks that are merely cosmetic from those that undermine your friend's conclusion.

  **Decorative Breaks (Do not matter for the conclusion):**
  *   **The Underwriter's Nature:** Omega's supernatural prediction ability is irrelevant. Omega could be replaced by a smart contract or a binding legal agreement signed yesterday. The metaphysics of prediction does not change the decision structure.
  *   **Terminology (Insurance vs. Investment):** Strictly speaking, insurance indemnifies a loss, whereas the Heads branch offers a gain. Your friend's framing of "insuring against not being in the heads branch" is semantically stretched, but mathematically equivalent to a high-yield conditional investment. This is a category error, but not a fatal one.

  **Substantive Breaks (Matter for the conclusion):**
  *   **Identity of Payer and Payee:** In standard insurance, the entity paying the premium is the *same* entity receiving the payout. In the Mugging, the entity paying (Tails-You) is causally distinct from the entity receiving (Heads-You). Tails-You never sees the $10,000. The analogy assumes a "supra-identity" that spans branches, which is precisely what Causal Decision Theory (CDT) denies and Functional Decision Theory (FDT) asserts.
  *   **Causal Efficacy:** In insurance, paying the premium causally contributes to the pool that funds the payout. In the Mugging, paying the $100 in the Tails world has *zero* causal impact on the Heads world. The prediction is already made; the coin is already flipped. The "premium" does not fund the "payout"; it merely *validates* the condition for the payout retroactively.
  *   **Information State:** As noted in the table, insurance premiums are paid under uncertainty. The Mugging demand occurs under certainty (you know it is Tails).

  ### 3. Pressing the Two Points

  **First Point: Cross-Branch Payment and Collection**
  In ordinary insurance, there is no case where the premium is paid in one state of the world and the payout collected in another *by someone who did not pay*. If your house burns down, *you* collect the money because *you* paid the premium. If your house does not burn down, *you* do not collect, because *you* did not suffer the loss.

  The insurance picture assumes a **God's-eye view** (or a "view from nowhere") where the agent is defined as the sum of their outcomes across all possible worlds, weighted by probability. It assumes that value transferred from Tails-You to Heads-You counts as a net gain for "You."

  This assumption **is the very thing at issue**.
  *   **Causal Decision Theory (CDT)** holds that rational choice maximizes utility in the *actual* world. From this standpoint, Tails-You paying $100 is a pure loss with no return.
  *   **Evidential/Functional Decision Theory (EDT/FDT)** holds that rational choice maximizes the output of the decision algorithm across all worlds where that algorithm is instantiated.
  *   **Audit:** Your friend's analogy smuggles in the FDT standpoint by using the language of insurance, which inherently implies a continuous identity over time and state. She is not proving that CDT is wrong; she is describing a scenario where CDT fails *if* you accept the premise that counterfactual branches are part of your risk pool.

  **Second Point: Timing and Policy Shifts**
  Does the insurance picture require the decision before the outcome? **Yes.** You cannot buy fire insurance after the house has burned down, nor can you cancel it after the year passes without fire and demand a refund.

  Does the shift from acts to policies restore whatever that timing removes? **Yes, but only by changing the subject.**
  *   If you evaluate the **Act** (CDT): You are in the Tails world. The decision is "Pay $100 or keep it." The outcome is fixed. Paying is irrational.
  *   If you evaluate the **Policy** (FDT/UDT): You are effectively asking, "What rule should my algorithm have followed *before* the coin was flipped?" This conceptually moves the decision point back to the pre-coin state.
  *   **Audit:** Your friend's move to "policies" is an attempt to restore the timing required for the insurance analogy to hold. It works *if* you accept that rational agents choose policies rather than acts. However, this is not a repair of the analogy; it is an assertion of the decision theory that makes the analogy valid. It begs the question against the act-evaluator.

  ### 4. The Wager Diagnosis

  Your diagnosis is **correct**: This is less like insurance and more like **a wager on Heads whose stake is collected only when the bet loses.**

  *   **Structure:** You bet on Heads. If Heads, you win $10,000. If Tails, you lose $100.
  *   **The Twist:** In a normal bet, you put up the stake before the flip. Here, the bookie (Omega) only comes to collect the stake if you lose.

  **Does this help or damage her case?**
  It **damages** her rhetorical case but **clarifies** the logical stakes.
  *   **Rhetorical Damage:** "Insurance" sounds prudent and protective. "A bet where you pay only on loss" sounds like a sucker's game. It highlights the intuition that paying a losing bet is irrational.
  *   **Logical Clarification:** It exposes the core tension. A CDT agent looks at a losing bet and says, "I've already lost; why throw good money after bad?" An FDT agent says, "I only face this collection *because* I took the bet. If I refuse to pay now, I wouldn't have been offered the bet (or the payout) in the winning branch."
  *   **Verdict on Diagnosis:** It strips the "prudence" camouflage from her argument. It forces the debate onto the raw question: *Are you responsible for the terms of a bet in a counterfactual world where you don't exist to enjoy the winnings?*

  ### 5. The Verdict

  **Does the analogy support her conclusion, or does it presuppose it?**
  The analogy **presupposes** her conclusion. It is circular. It describes the situation *as if* the counterfactual branch is a risk you bear (which is the FDT conclusion) to justify paying in the actual branch (which is the FDT action). It offers no independent reason why a Tails-world agent should care about a Heads-world payout they will never receive, other than asserting that "that's how insurance works." But insurance only works because the payer and payee are the same actual entity.

  **A Better Analogy: The Subscription Fee**
  To keep the legitimate insight (that it can be rational to pay for a state of affairs one knows does not obtain) without assuming branches are risks, use the **Subscription Fee** analogy.

  *   **Scenario:** You subscribe to a service for $100/year. The service includes a lottery ticket. If you win, you get $10,000. If you lose, you get nothing.
  *   **The Twist:** The company policy is to only charge the subscription fee *if* you lose the lottery. If you win, the fee is waived.
  *   **The Moment:** You are notified you lost. The company asks for the $100.
  *   **Why it works:** It captures the conditional payment structure without implying "insurance" against loss. It highlights that the fee is the *price of admission* to the lottery.
  *   **Rationality:** Is it rational to pay? Only if you value the *ex-ante opportunity* to have been the kind of person who subscribes. It frames the payment not as buying a payout in a counterfactual world, but as **maintaining the integrity of a contract that defines your agency.** You pay not to change the world, but to be the kind of agent who gets invited to the game.

  **Blackmail Variants**
  Does the verdict change for blackmail cases (e.g., Parfit's Hitchhiker or Logical Blackmail)?
  **Yes, significantly.**
  *   In **Mugging**, paying changes nothing in the actual world; it only validates a counterfactual reward. The "loss" of not paying is purely opportunity cost in a branch you know you aren't in.
  *   In **Blackmail**, paying often averts a threat in the *actual* world (e.g., "I will kill you unless you pay"). Even in *logical* blackmail (where the threat is counterfactual, like "I would have simulated you suffering"), the emotional and survival stakes differ.
  *   **Impact on Analogy:** The insurance analogy is *weaker* for Mugging than for Blackmail. In blackmail, you are "insuring" against an actual negative outcome (death/suffering). In Mugging, you are "insuring" against... missing out on a gift. The reluctance to pay in Mugging is more robust because the "loss" is abstract (counterfactual utility), whereas in blackmail, the loss is concrete (actual utility). Therefore, your friend's argument is even less persuasive in the Mugging case than in the Blackmail case.
