  # JOINT STATEMENT ON DIVINE KNOWLEDGE AND CREATURELY FREEDOM

  ## 1. Glossary of Technical Terms

  **Counterfactual of Creaturely Freedom (CCF):** A conditional proposition stating what a specific free creature would freely choose to do were it placed in a specific complete set of circumstances. Syntactically: "If creature C were in circumstances S, C would freely do A."

  **Prevolitional:** True or settled logically prior to any free decree of the divine will. A prevolitional truth is not made true by God's decision to create or sustain.

  **Natural Knowledge:** God's knowledge of all necessary truths and all possible states of affairs. This knowledge is prevolitional and not within God's power to alter.

  **Middle Knowledge:** God's knowledge of all true CCFs. On the view that affirms it, this knowledge is prevolitional (like Natural Knowledge) but concerns contingent truths (like Free Knowledge).

  **Free Knowledge:** God's knowledge of what actually exists and occurs. This knowledge is postvolitional, depending on God's free decree to create a specific world.

  **Truthmaker:** An entity or state of affairs in virtue of which a proposition is true. To say a proposition requires a truthmaker is to say it cannot be true unless something exists to ground its truth.

  **Grounding:** The metaphysical relation of non-causal determination. If X grounds Y, Y obtains in virtue of X. Explanatory priority tracks grounding.

  **Explanatory vs. Causal Priority:** Causal priority involves one event producing another in time. Explanatory priority involves one truth holding in virtue of another, regardless of time. Both parties agree divine knowledge is timeless; the dispute concerns explanatory ordering.

  *Historical Note:* While this dispute echoes the late-sixteenth-century controversy between Jesuit proponents of middle knowledge and Dominican proponents of physical premotion, the modern debate focuses less on the mechanics of grace and more on the metaphysics of truth and modality. The Roman commission convened to adjudicate the earlier quarrel declared both sides orthodox; this document seeks similar clarity on metaphysical commitments without ecclesiastical adjudication.

  ## 2. Agreed Claims

  Both parties affirm the following propositions. Neither party signs these concessions that undermine their core disagreement.

  1.  **Libertarian Freedom:** Human freedom is incompatible with causal determinism. For an agent to be free, it must be within their power, given the exact same past and laws of nature, to choose otherwise.
  2.  **Divine Omniscience:** God knows all truths that are logically possible to know. There are no true propositions unknown to God.
  3.  **Logical Ordering:** The distinctions between Natural, Middle, and Free knowledge represent a logical, not temporal, ordering of divine cognition. All divine knowledge is simultaneous in God, but some truths are explanatory priors to others.
  4.  **Syntactic Form:** CCFs have a distinct syntactic form from material conditionals. They assert a connection between circumstances and free choices stronger than mere coincidence.
  5.  **Actual Future Knowledge:** God knows the future free actions of actually existing creatures. This knowledge is infallible.
  6.  **Incompatibilism Presupposed:** The dispute presupposes incompatibilism. If compatibilism were true, God could ensure specific free choices by determining them, rendering the grounding objection moot. Both parties reject this solution.
  7.  **Limits of Middle Knowledge:** Even if Middle Knowledge exists, it does not grant God control over the free choices themselves. God can actualize circumstances, but not the choice made within them.
  8.  **Nature of the Disagreement:** The dispute is not about whether God is sovereign, nor about whether creatures are free. It is strictly about the metaphysical status of contingent truths concerning non-actual free choices.

  ## 3. Disagreements Table

  | Question at Issue | Molinist Position | Critic Position | What is at Stake |
  | :--- | :--- | :--- | :--- |
  | **Truth Value of CCFs** | CCFs regarding non-actual circumstances are determinately true or false prior to God's decree. | CCFs regarding non-actual circumstances lack a truth value until God decrees a world where they are tested. | Whether God can providentially order a world based on how creatures *would* act, or only on how they *will* act. |
  | **Grounding Requirement** | Some contingent truths (CCFs) are "brute" facts not grounded in existing entities. | All contingent truths require an ontological ground in existing entities or states of affairs. | Whether the principle of grounding is universal or admits exceptions for conditionals. |
  | **Source of Contingency** | The contingency of a CCF arises from the creature's freedom, even if the creature does not exist. | The contingency of a choice arises only when the creature exists and acts. | Whether freedom is a property of essences or only of existing individuals. |
  | **Divine Risk** | God takes no risk in creation; He knows exactly what every possible creature would do. | God takes a risk in creation; He knows possibilities, but the actualization of free choices is not prevolitionally settled. | The extent of divine providential control versus divine openness to contingency. |

  ## 4. Cruxes

  Settling any of the following sub-questions would significantly shift the dialectic. Both parties agree these cases bear on the core dispute.

  **(i) The Scope of the Grounding Requirement**
  *Case:* Consider a truth about a merely possible person who never exists (e.g., "If Person P existed, P would have brown eyes").
  *   **Molinist Prediction:** This truth is grounded in the essence of P, which God knows via Natural Knowledge. Similarly, CCFs are grounded in the essences of possible creatures. The Critic's grounding requirement is too strict.
  *   **Critic Prediction:** Essences alone cannot ground contingent truths about actions. If P never exists, there is no ontological ground for what P would *do*. The Molinist conflates necessary truths about essences with contingent truths about choices.
  *   **Stake:** If the Critic admits essences ground some contingent truths, the Grounding Objection weakens. If the Molinist admits essences cannot ground actions, Middle Knowledge collapses.

  **(ii) Asymmetry Between Divine and Creaturely Acts**
  *Case:* God's own free decision to create is known via Free Knowledge (postvolitional). A creature's free decision is claimed by the Molinist to be known via Middle Knowledge (prevolitional).
  *   **Molinist Prediction:** This asymmetry is principled. God's will is the source of all being; thus, His own acts are self-grounding. Creatures are not sources of being, so their acts must be grounded in their natures known prevolitionally.
  *   **Critic Prediction:** This asymmetry is ad hoc. If freedom implies the choice is not settled prior to the agent's exercise of will, it applies to God and creatures alike. To say creaturely choices are settled prevolitionally undermines their freedom.
  *   **Stake:** Whether the logic of freedom applies univocally to God and creatures, or whether divine aseity creates a metaphysical discontinuity.

  **(iii) Indeterministic Processes and Equal Reasons**
  *Case:* An agent is undetermined between two options she regards as equally supported by reasons (a Buridan's Ass scenario).
  *   **Molinist Prediction:** Even here, there is a fact of the matter about what the agent *would* choose in those exact circumstances, known by God. The indeterminacy is ontic, not epistemic for God.
  *   **Critic Prediction:** In cases of equipollence, there is no fact of the matter prior to the choice. To say otherwise is to posit a "phantom" determinant. God knows the probability, not the outcome.
  *   **Stake:** Whether libertarian freedom requires the absence of prevolitional truth values for choices made without decisive reasons.

  **(iv) Direction of Fit and Biblical Conditionals**
  *Case:* Jesus states that if miracles done in Capernaum had been done in Sodom, Sodom would still be standing.
  *   **Molinist Prediction:** This confirms CCFs are true. God's intellect measures the truth of the conditional independently of His will. The direction of fit is World-to-Intellect.
  *   **Critic Prediction:** This is a statement of divine intention or probability, not a report of a prevolitional truth. God's knowledge is the measure of things; if God did not decree the miracles for Sodom, there is no truth to know. The direction of fit is Intellect-to-World.
  *   **Stake:** Whether divine knowledge is passive (receptive of truth) or active (constitutive of truth) regarding contingents.

  ## 5. Diagnosis of Verbal Dispute

  A portion of this disagreement is verbal, but a significant core is substantive.

  **Verbal Component:** The parties often use "truth" differently. The Molinist employs a deflationary or platonic conception where a proposition is true if it corresponds to a possible state of affairs, regardless of ontological grounding. The Critic employs a robust correspondence theory requiring an existing truthmaker. If the Molinist agrees that CCFs lack *ontological grounds* but insists they are still *true* in a logical sense, the dispute shifts to whether "knowledge" requires ontological grounding.

  **Substantive Core:** Even if terms are fixed, the metaphysical disagreement remains. The Critic insists that without an existing truthmaker, there is nothing for God to know. The Molinist insists that God's knowledge extends to all coherent possibilities, including conditional facts about them. This is not merely semantic; it concerns the structure of reality. If the Critic is right, Providence is less granular. If the Molinist is right, freedom is compatible with prevolitional certainty.

  **Resolution Path:** To make the verbal dispute substantive, the Molinist must specify what *makes* a CCF true if not an existing state of affairs. The Critic must specify how God plans a world without knowing how creatures would respond to specific plans. Until "grounding" is defined as either a metaphysical necessity or a heuristic principle, the dialogue will stall.

  ## 6. Closing: Falsification and Movement

  **Evidence Against the Molinist Position:**
  The Molinist would concede error if it were demonstrated that prevolitional truth values for free choices entail causal determinism. Specifically, if it is shown that a true CCF logically necessitates the choice it describes, rendering the "could have done otherwise" condition impossible, the Molinist must abandon Middle Knowledge.

  **Evidence Against the Critic Position:**
  The Critic would concede error if it were demonstrated that divine providence requires specific knowledge of non-actual choices to guarantee certain theological outcomes (e.g., the Incarnation) without violating freedom. If a world with genuine freedom cannot be sovereignly ordered without Middle Knowledge, the Critic must accept some form of prevolitional conditional knowledge.

  **Conditions for Moving the Debate:**
  Both parties agree that progress requires a unified theory of modality. We commit to investigating whether a theory of "truthmakers" can be expanded to include possible essences without collapsing into determinism, or whether a theory of "knowledge" can be restricted to actual existents without diminishing divine providence. We agree that neither side benefits from caricaturing the other as denying either sovereignty or freedom.

  ***

  # Self-Critical Commentary

  **Confidence in Formulations:**
  I am least confident that the **Critic's position in Crux (iii)** (Indeterministic Processes) faithfully represents a live libertarian position. Many modern libertarians (especially agent-causalists) would argue that even in cases of equipollence, the *agent* provides the ground for the choice at the moment of action, not the circumstances. My formulation risks making the Critic sound like an Open Theist who denies God knows the future entirely, whereas the prompt specifies the Critic accepts God knows the *actual* future. Distinguishing "knowing the actual future" from "knowing conditional futures" in cases of equal reasons is metaphysically delicate; if the choice is truly undetermined, it is unclear how God knows the actual future either without some form of middle knowledge or timeless observation. I may have sharpened the Critic's skepticism too much here.

  Additionally, in the **Agreed Claims**, Claim 3 ("Logical Ordering") is a point of significant internal friction. Some modern critics of Molinism reject the logical ordering of divine knowledge entirely, preferring a simple timeless view where all knowledge is simultaneous without priority. Forcing the Critic to agree to "logical ordering" might be a concession they wouldn't make in a real adversarial setting, though it is necessary to make the debate intelligible within the shared scholastic framework requested.

  Finally, the **Diagnosis of Verbal Dispute** risks being too conciliatory. The disagreement over truthmakers is likely not verbal but a fundamental clash between Aristotelian metaphysics (Critic) and a more Platonic or Leibnizian modal realism (Molinist). Suggesting this could be resolved by defining terms might understate the ontological rift. However, for the purpose of a joint statement, highlighting the verbal element is a standard diplomatic move to keep dialogue open.
