answer: |-
  This is a classic formulation of the **Middle-Range Theory** problem, stripped of the jargon. You are arguing about the epistemic gap between *static* material residues and *dynamic* social causes. Your friend is taking a hard empiricist line (Humean skepticism about causation); you are taking a hermeneutic line (theory-laden observation).

  For a **Museum Label Standard** (public warrant, not laboratory certainty), the goal is not "Truth" but "Warranted Assertibility." The label must not mislead.

  Here are the six desiderata for any account claiming to infer belief or institution from material remains.

  ### The Desiderata

  **1. The Equifinality Constraint**
  *   **The Requirement:** The account must provide a mechanism to distinguish between two different social causes that produce identical material signatures.
  *   **The Case:** *Granary vs. Temple.* Both have identical ground plans and rows of storage jars.
  *   **Why it's needed:** If the material record is identical, the inference to "belief" (temple) vs. "subsistence" (granary) cannot rest on the objects alone. An adequate account must specify what *additional* evidence (micro-residues, spatial context, associated burials) breaks the tie, or it must explicitly state the ambiguity. If it claims "Temple" without breaking the tie, it is fiction.

  **2. The Agency/Loss Discriminant**
  *   **The Requirement:** The account must distinguish between intentional deposition and accidental loss using formation processes, not just object value.
  *   **The Case:** *Deposition vs. Loss.* A bog hoard vs. a dropped coin.
  *   **Why it's needed:** As you noted, "deposited" smuggles in intent. To avoid smuggling, the account must point to material markers of *care* or *pattern* that are statistically unlikely in loss scenarios (e.g., alignment, lack of wear, grouping). If the only difference is "this looks valuable," the inference fails.

  **3. The Negative Evidence Protocol**
  *   **The Requirement:** The account must define the conditions under which the absence of a structure constitutes evidence of the absence of a function.
  *   **The Case:** *Absence.* No market building in a high-trade site.
  *   **Why it's needed:** Archaeology is defined by destruction. You cannot claim "they had no markets" unless you can demonstrate that *if* there were markets, you *would* have found them (preservation bias check). If the account uses absence to prove a social negative without ruling out taphonomy, it is invalid.

  **4. The Institutional Recursion Test**
  *   **The Requirement:** The account must distinguish between an aggregate of individual behaviors and a self-reproducing structure (institution).
  *   **The Case:** *Institution Side.* Taxation or Priesthood.
  *   **Why it's needed:** A pile of grain could be voluntary tribute (individual acts) or tax (institution). To claim "institution," the material record must show *enforcement* or *standardization* that exceeds individual choice (e.g., uniform measures, storage centralized beyond household need, records). It must show the pattern constraining the behavior, not just the behavior itself.

  **5. The Analogical Bridge Justification**
  *   **The Requirement:** If external data (ethnography/text) is used to interpret the objects, the account must justify the continuity between the source and the target.
  *   **The Case:** *Analogy.* Using a living society to read a dead one.
  *   **Why it's needed:** You cannot avoid analogy (as you noted), but you must avoid *imposition*. The requirement is not "don't use analogy," it is "show the relational similarity." If you interpret a figurine as a "goddess" based on 19th-century folklore, you must demonstrate why that category applies to the Iron Age context, or admit it is a heuristic metaphor.

  **6. The Risk Condition (Falsifiability)**
  *   **The Requirement:** The account must specify what material finding would prove the belief/institution claim *false*.
  *   **The Case:** *Testability.*
  *   **Why it's needed:** If every new object can be re-interpreted to fit the theory (e.g., "this weapon proves war," "this plow proves peace"), the theory is unfalsifiable. For a museum label to be honest, there must be a state of the dirt that would force the label to change. If no such state exists, it is mythology, not archaeology.

  ***

  ### Analysis: Non-Negotiable vs. Parochial

  **Non-Negotiable (The Hard Constraints):**
  *   **Equifinality:** You cannot ignore this. If two causes make the same effect, you cannot claim to know the cause without extra data. This is logic, not archaeology.
  *   **Risk Condition:** Without this, you are doing literature, not science. For a public label, this is an ethical requirement.
  *   **Negative Evidence Protocol:** Essential for honesty. Claiming "no evidence of X" implies "evidence of no X" only if preservation is accounted for.

  **Parochial (Methodological Preferences):**
  *   **Agency/Loss Discriminant:** *How* you prove intent is debated. Your friend thinks you can't; you think "behavior" implies it. The *requirement* to distinguish them is real, but the *threshold* for proof is a methodological choice.
  *   **Institutional Recursion:** Defining "institution" is sociological. Some schools see institutions everywhere; others see only individuals. The requirement to distinguish them is valid, but the specific signature (e.g., "standardization") is a theoretical bet.
  *   **Analogical Bridge:** *Which* analogies are permitted is highly political. Requiring "direct historical connection" is processualist; allowing "structural comparison" is post-processual. The requirement to *justify* the bridge is non-negotiable; the type of justification is parochial.

  ***

  ### The Incompatibilities (Where the List Breaks)

  You asked for the pairs that cannot be satisfied simultaneously. There is one major tension that defines this entire debate.

  **The Tension: Material Sufficiency vs. Semantic Specificity**

  *   **Requirement A (from Equifinality):** To distinguish Granary from Temple, you need high *Semantic Specificity* (knowing the specific meaning).
  *   **Requirement B (from Risk Condition):** To be falsifiable and secure, you need *Material Sufficiency* (the objects must speak for themselves without relying on fragile analogies).

  **The Conflict:**
  You generally cannot have both.
  1.  If you rely strictly on **Material Sufficiency** (your friend's view), you satisfy the Risk Condition but fail Semantic Specificity. You can say "jars were stored," but you cannot say "stored for God." The label becomes accurate but empty.
  2.  If you pursue **Semantic Specificity** (your view), you must import Analogy or Text to break the Equifinality. This immediately weakens the Risk Condition, because now your claim depends on the *analogy* holding true, which is harder to falsify than the dirt itself.

  **The Verdict:**
  For a museum label, **you must sacrifice Material Sufficiency to achieve Semantic Specificity.**
  Why? Because a label that says "Storage Jars" (Material Sufficiency) fails the public trust mission of explaining *culture*. However, to do this, you must relax the Risk Condition. You cannot demand lab-grade falsifiability for belief claims. You must accept **Probabilistic Warrant** instead.

  **The Impossible Triangle:**
  You can have:
  1.  Strict Falsifiability
  2.  Specific Belief Claims
  3.  Material Evidence Alone

  **Pick two.**
  *   Friend picks 1 & 3 (No belief claims).
  *   You want 2 & 3 (Belief from objects).
  *   Standard Archaeology picks 1 & 2 (Belief claims, falsifiable, but relies heavily on Analogy/Text, violating 3).

  ***

  ### Scorecard: The Camps

  **The "Just Dirt" Camp (Processualist/Your Friend)**
  *   **Passes:** Risk Condition, Negative Evidence Protocol.
  *   **Fails:** Equifinality (often collapses distinct behaviors into "adaptive strategy"), Institutional Recursion (reduces institutions to aggregate behavior).
  *   **Result:** Scientifically robust, culturally sterile. The label reads "Ceramic Vessel," not "Chalice."

  **The "Just Symbols" Camp (Post-Processual/Hermeneutic)**
  *   **Passes:** Equifinality (acknowledges multiple meanings), Institutional Recursion (good at spotting power structures).
  *   **Fails:** Risk Condition (interpretations are often flexible enough to absorb any new data), Analogical Bridge (often imposes modern categories under the guise of "resistance").
  *   **Result:** Culturally rich, epistemically fragile. The label reads "Ritual Object," but cannot explain why it isn't trash.

  **The Museum Standard Solution:**
  The label must state the **inference**, not the **fact**.
  *   *Bad:* "This was used to worship the Sun God." (Violates Risk/Equifinality).
  *   *Bad:* "This is a pot." (Violates Public Trust).
  *   *Good:* "Likely used in ritual offerings, based on placement and lack of wear." (Satisfies Agency Discriminant, admits Equifinality risk).
