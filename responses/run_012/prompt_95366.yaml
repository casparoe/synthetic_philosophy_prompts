      *   **Key Questions to Answer:**
          *   What does Venice's treatment of Shylock reveal about the gap between being subject to law vs. belonging to the law-making body?
          *   What about the "all affected interests" principle?
          *   Where does the play resist this reading (commerce, mercy, revenge)?
          *   Does it dramatize something theory misses (boundary fixed by power/majority self-definition rather than principle)?
      *   **Constraint:** Do not quote the text; paraphrase the action.

  2.  **Initial Brainstorming & Theoretical Framework:**
      *   *The Boundary Problem:* Associated with democratic theory (Whelan, Dahl, Bauböck). Who decides who decides?
      *   *Venice as a Polity:* It's a republic, but an exclusive one. Merchants vs. Jews. Citizens vs. Aliens.
      *   *Shylock:* The ultimate test case. He lives under Venetian law, trades under it, but is excluded from its protection/identity until he tries to enforce a contract, at which point the law turns on him *because* of his status.
      *   *Portia:* Represents the aristocratic/patrician element. Bound by her father's will (past ruling present). Disguised as a man (legal authority is gendered).
      *   *Jessica:* Escapes the Jewish "demos" to join the Christian one, but at what cost? Is she truly included?
      *   *Resistance:* Is the play *really* about politics? Or is it about theology (Mercy vs. Justice), economics (usury), or psychology (revenge)? The seminar needs to acknowledge these competing readings.
      *   *Power vs. Principle:* The theory often looks for a normative principle (all affected, etc.). The play might show that boundaries are just brute force or cultural hegemony disguised as law.

  3.  **Structuring the Seminar Response:**
      *   **Introduction:** Frame the seminar's thesis. Connect the "boundary problem" to the play's central conflict.
      *   **Section 1: The Trial and the Alien Status.** Focus on Shylock's legal standing. The gap between subjection and membership.
      *   **Section 2: Inheritance and the Dead Hand.** Portia's caskets. The inability of the living to revise the rules of membership/succession.
      *   **Section 3: Assimilation and Exit.** Jessica's conversion. Can one *become* a member, or is it blood/faith?
      *   **Section 4: Authority and Disguise.** Portia as Balthazar. Who is allowed to speak the law?
      *   **Section 5: Competing Readings (Resistance).** Commerce, Mercy, Revenge. Why the political reading isn't exhaustive.
      *   **Section 6: Power and Self-Definition.** The theoretical takeaway. Boundaries as acts of power, not logic.
      *   **Conclusion:** Summary of the seminar's findings.

  4.  **Drafting the Content - Section by Section (incorporating constraints):**

      *   *Intro:* Establish the paradox. Venice defines itself by excluding Shylock, but uses him to define itself.
      *   *The Trial:* Shylock demands the law. The Duke and Antonio acknowledge the law binds them, but when applied to Shylock, his alien status is weaponized. He is subject to the penalty but excluded from the protection. The "all affected" principle fails; Shylock is affected most, yet has the least voice.
      *   *Portia's Caskets:* Her father's will. She cannot choose. The *demos* (or the family unit) is bound by the past. This mirrors the boundary problem—the current citizens didn't vote on the constitution that makes them citizens.
      *   *Jessica:* She converts. She leaves her father. But she is still treated as "of her father's blood" by some (Lancelot). Is inclusion possible? Or is it always conditional?
      *   *Portia's Disguise:* A woman cannot judge. She must become a "man of law." Authority is performative and restricted by category.
      *   *Resistance:* The play is also about Mercy (Portia's speech). If it's just politics, mercy is a trick. Also, economics (bond vs. flesh). Revenge (Shylock's motivation). Don't reduce it *only* to political theory.
      *   *Power:* The ending. Shylock is forced to convert. The majority defines the minority. Theory seeks legitimacy; the play shows coercion.

