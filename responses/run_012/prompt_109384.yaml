answer: |-
  **Session Plan: *Memento* and the Doctrine of Anattā**

  **Thesis:** *Memento* does not vindicate *anattā* as a liberating insight; rather, it dramatizes the horror of the "bundle" when stripped of the cognitive glue (memory) that usually masks it. The film supports the Two Truths framework (conventional vs. ultimate) but argues that the conventional self is an ethical necessity, not merely an illusion to be discarded. Leonard Shelby is not a bundle theorist by philosophy; he is a bundle by pathology who desperately attempts to reify a substantial self through external artifacts.

  ### 1. Anattā: Metaphysical Denial vs. Soteriological Strategy
  The central tension in Buddhist hermeneutics is whether *anattā* denies the existence of a person metaphysically or serves as a strategy to cease clinging (*upādāna*). *Memento* sides with the latter but exposes the danger of the conventional self when it is consciously engineered rather than habitually inhabited.

  Leonard is ontologically a bundle of aggregates (*skandhas*)—specifically, a stream of consciousness severed from the aggregate of perception/memory (*saññā*). However, he does not treat himself as a process. He treats his tattoos and Polaroids as substantial truths. In the scene where he tattoos "John G. raped and murdered my wife" onto his thigh, he is attempting to convert the impermanent (memory) into the permanent (skin). This is the inverse of the Buddhist project. The practitioner seeks to see the tattooed self as empty to end suffering; Leonard creates the tattoo to *sustain* suffering (vengeance).

  The film supports the **Two Truths reading**. Ultimately, there is no "Leonard" persisting from scene to scene; there is only a causal chain of notes and impulses. Conventionally, however, Leonard functions *as if* he is a unitary agent. The film shows that a constructed self is not an illusion to be seen through, but an **achievement to be maintained**. When that maintenance is outsourced to unreliable externalities, the conventional self becomes a weapon. Leonard is not a bundle theorist in practice; he is a dogmatic essentialist who uses bundle-theory conditions (fragmentation) to hide from the truth of his own agency.

  ### 2. Pudgalavāda and the Sammy Jankis Twist
  The *Pudgalavāda* school posited a "person" (*pudgala*) that is neither identical with nor distinct from the aggregates, serving as the carrier of karmic continuity and memory. *Memento* offers a dark thought experiment on this: Can karma travel without memory?

  The revelation that the Sammy Jankis story is likely Leonard's own projected history is the film's *pudgala* moment. Leonard claims Sammy had no procedural memory (couldn't learn the insulin routine), while Leonard insists he does. Yet, Leonard's condition is psychological, not just neurological. The guilt of killing his wife (via insulin overdose) has detached from the specific memory of the act and reattached to the narrative of "Sammy."

  This dramatizes a **corrupted *pudgala***. There is a continuity of character and karmic weight (guilt) that persists across the discontinuity of memory. The "person" is neither identical to the aggregates (Leonard's brain is damaged, Sammy's was supposedly not) nor distinct from them (the guilt manifests physically in Leonard's behavior). However, the film refutes the *Pudgalavāda* as a soteriological solution. In the tradition, the *pudgala* explains rebirth and responsibility to encourage ethical practice. In *Memento*, this continuity explains only the persistence of delusion.

  The **reverse chronology** reinforces this. We experience the effect before the cause, forcing us to reconstruct a "forward" narrative from backward evidence. This mirrors Leonard's existence: he wakes up with effects (tattoos, bruises, a car) and must invent a cause. This illustrates that the "self" is a retroactive narrative construction. The *pudgala* here is not a soul, but a story that refuses to die, haunting the aggregates even when the mind cannot hold it.

  ### 3. Accountability Without a Bearer
  The ethical crux of *anattā* is: If there is no self, who bears the karma? *Memento* makes this vivid by showing Leonard betraying his own future moments.

  In the final chronological scene (the black and white sequence ending in color), Leonard decides to ignore Teddy's truth ("You don't want the truth. You want a puzzle you can't solve"). Leonard chooses to manipulate his future self by hiding the note about Teddy ("Don't believe his lies") and tattooing Teddy's license plate as a new target.

  Here, Leonard writes a note to a stranger who happens to inhabit his body. If there is no self, who is betrayed? The film suggests that **responsibility exists even when the owner is a fiction.** The "system" of Leonard is the bearer of karma. By setting up Teddy to be killed by a future Leonard, the current Leonard creates a karmic debt that the future Leonard will pay without understanding why.

  The film relies on our intuition of Leonard as a continuing agent to make the ending tragic. If we truly believed Leonard-Now and Leonard-Later were entirely distinct beings, the manipulation would be a mere prank. It lands as a moral horror because we sense the continuity of suffering. The film argues that while the self may be empty, the **consequences of self-construction are solid.** Leonard creates a loop of violence that binds him, proving that karma does not require a substantial self, only a causal chain of intention (*cetanā*).

  ### Verdict: Illustration of Preliminaries and the Necessity of the Conventional
  *Memento* **illustrates the preliminaries of *anattā* but resists its soteriological conclusion.**

  It vindicates the diagnostic claim of Buddhism: clinging to a constructed identity causes suffering (*dukkha*). Leonard is the embodiment of *saṃsāra*—wandering on, driven by craving (vengeance) and ignorance (of his own guilt). He shows us what it is like to be a self made of records: it is a state of perpetual anxiety, where existence must be constantly verified against external props.

  However, the film diverges from the Buddhist cure. In Buddhism, seeing through the self leads to liberation. In *Memento*, seeing through the self (realizing he might be Sammy, realizing Teddy is helping him) leads to a choice to **re-entrench the delusion.** Leonard chooses the conventional self because the ultimate truth is unlivable.

  **Contribution beyond Parfit:**
  Derek Parfit argues in *Reasons and Persons* that reductionism (no further fact of identity) should not diminish our concern for the future. *Memento* shows that phenomenologically, it **does** matter. Parfit's argument is abstract; Leonard's condition is visceral. The film demonstrates that the "conventional self" is not just a useful fiction but an **ethical infrastructure**. Without the automatic continuity of memory, the conventional self must be manually built, and as Leonard shows, it can be built on lies.

  **Final Reading for the Seminar:**
  Read *Memento* not as a proof of no-self, but as a warning about the **weaponization of the conventional self.** Leonard proves that if you treat the aggregates as a self to be defended rather than a process to be understood, you become a machine for generating karma. The film argues that we cannot do without the conventional self, but it must be grounded in truth (Right View), or it becomes a prison of one's own making. Leonard is not free because he has no self; he is trapped because he has built the wrong one.
