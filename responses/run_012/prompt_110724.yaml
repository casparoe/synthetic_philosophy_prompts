          *   *Macro-subject condition:* If micro-experiences don't combine, they remain isolated. Moral weight might depend on integration (information integration theory hints at this).
      *   *Indeterminacy (The Ethical Combination Problem):* Physics describes fields/particles. It doesn't clearly define "subject boundaries." If subjecthood is vague, moral status is vague.
          *   *Threat:* Severe. If we can't count the sufferers, we can't calculate the good. It creates "moral fuzziness."
          *   *Response:* Indifference vs. Caution. Indifference is risky (might ignore vast suffering). Caution is burdensome (paralysis).
