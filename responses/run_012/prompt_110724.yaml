      *   *Transition 1 (1 $\to$ 2):* Need a premise linking *phenomenality* to *affect*. Just because something feels like *something* doesn't mean it feels *good* or *bad*.
          *   *Premise:* "Phenomenality entails affectivity" or "Raw feel implies care."
          *   *Plausibility:* Low/Controversial. We can conceive of neutral awareness (e.g., pure cognition, some meditative states, or philosophical zombies with qualia but no pain/pleasure). Independent of panpsychism, we distinguish sensation from suffering.
      *   *Claim 3:* There are subjects whose welfare is constituted by these states.
