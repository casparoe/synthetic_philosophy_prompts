  ### Tier 1: Substantive Mechanisms (Entries 4, 5)
  *   **Justification:** These accounts posit that reduced survival constraints and welfare buffers allow underlying heterogeneity in interests and opportunity costs to drive sorting decisions more freely.
  *   **Discriminator:** Longitudinal analysis linking individual welfare changes to preference stability would separate material affordance from static cultural norms.
  *   **Compatibility:** Entries 4 and 5 are mutually reinforcing economic and psychological mechanisms, but they compete directly with Tier 3 by asserting the gap is real rather than spurious.

  ### Tier 2: Psychometric & Normative Filters (Entries 3, 7)
  *   **Justification:** These explanations attribute the pattern to cross-cultural variation in how internal states are articulated, normalized, or reported rather than to the states themselves.
  *   **Discriminator:** Anchoring vignettes or implicit association tests across nations would reveal whether self-report variance matches behavioral variance.
  *   **Compatibility:** Entries 3 and 7 are compatible as reporting biases, but they compete with Tier 1 by suggesting the measured difference overstates the behavioral reality.

  ### Tier 3: Methodological Artifacts (Entries 1, 2)
  *   **Justification:** This tier claims the correlation is a statistical illusion produced by non-invariant scales or non-representative sampling in high-income datasets.
  *   **Discriminator:** Multi-group confirmatory factor analysis on strictly harmonized, nationally representative cohorts would confirm or falsify measurement invariance.
  *   **Compatibility:** Entries 1 and 2 are compatible data-quality critiques, but they are mutually exclusive with Tier 1 regarding the ontological status of the paradox.

  ### Tier 4: Speculative Sociological (Entry 6)
  *   **Justification:** This account suggests that in affluent environments, preferences function as identity signals that individuals strategically invest in and exaggerate for status.
  *   **Discriminator:** Experimental manipulation of status incentives in choice tasks could determine if preference strength fluctuates with social reward structures.
  *   **Compatibility:** Entry 6 is theoretically compatible with Tier 1 but competes with Tier 2 by positing strategic exaggeration rather than unconscious reporting bias.

  ***

  **Compatibility Summary:** Entries 4 and 5 (Substantive) are the strongest competitors to Entries 1, 2, and 3 (Artifacts/Reporting); Entries 6 and 7 offer nuanced sociological overlays that can coexist with either side but are harder to isolate.

  **Artifact Attribution:** 0.20
  **Policy Malleability:** 0.15
