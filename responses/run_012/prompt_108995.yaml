answer: |-
  Your "half-formed rule" is actually one of the most famous principles in formal epistemology. David Lewis called it the **Principal Principle**.

  Your intuition is correct: *Initial credence should match objective chance, unless you have "inadmissible" evidence.*

  Your verdicts on the standard cases (fair coin, factory bias, peeked record, past event, predictor) are almost all standard orthodoxy. The friction you feel comes from the boundary cases where "chance" gets fuzzy or where evidence bypasses the chance mechanism.

  Here is how to clean up the rule, and then what to do about your diabolical scanner machines.

  ### 1. Refining Your Rule

  Your rule: *"Match the chance, unless your extra evidence is correlated with the outcome instead of with the chance."*

  This is essentially correct, but it needs two technical refinements to handle your cases cleanly.

  **Refinement A: Distinguish "Chance" from "Expected Chance"**
  In your **Randomized Factory** case (50% chance of 0.9 bias, 50% chance of 0.1 bias), you said your credence is 50/50.
  *   **The nuance:** The *objective chance* of that specific coin landing heads is **not** 0.5. It is either 0.9 or 0.1. You just don't know which.
  *   **The fix:** You are matching the *expected* chance. $0.5 \times 0.9 + 0.5 \times 0.1 = 0.5$.
  *   **Why it matters:** If you learned the bias was 0.9, you update to 90%. You aren't violating the Principal Principle; you are just updating your estimate of what the chance *is*. You always match the *actual* chance, conditional on what you know about it.

  **Refinement B: The Admissibility Clause**
  In your **Reliable Predictor** case, you override the 0.5 chance because a predictor says "Heads."
  *   **The nuance:** Lewis calls this **inadmissible evidence**. Admissible evidence tells you about the *setup* (the chance). Inadmissible evidence tells you about the *outcome* directly (via time travel, prophecy, or looking at the result).
  *   **The fix:** The Principal Principle only holds when your evidence is *admissible*. A reliable prediction is inadmissible because it correlates with the outcome *independently* of the physical chance process.
  *   **Verdict:** Your intuition to go 90% is correct. You have inadmissible evidence, so you suspend the Principal Principle.

  **So the polished rule is:**
  > Set your credence equal to the objective chance, **conditional on your total admissible evidence.** If you have inadmissible evidence (like a prediction or seeing the result), that trumps the chance.

  ---

  ### 2. The Scanner Machines

  Now we arrive at the trouble. Your scanner machines break the Principal Principle because they violate a hidden assumption: **Independence.**

  The Principal Principle assumes the objective chance is a feature of the world that exists *independently* of your credence. In your scanner cases, the Objective Chance $P(H)$ is a function of your Credence $C(H)$.

  We are looking for a **fixed point** where $C(H) = P(H)$.

  #### Machine A: Heads iff Credence < 0.5
  *   **The Setup:** $P(H) = 1$ if $C(H) < 0.5$, else $0$.
  *   **The Search for Equilibrium:**
      *   If you believe Heads is likely ($C > 0.5$), the machine makes it Tails ($P=0$). Your belief is wrong.
      *   If you believe Heads is unlikely ($C < 0.5$), the machine makes it Heads ($P=1$). Your belief is wrong.
      *   If you suspend judgment ($C = 0.5$), the machine (assuming "below .5" excludes .5) makes it Tails ($P=0$). You should believe 0. But if you believe 0, the machine makes it Heads ($P=1$).
  *   **The Verdict:** **There is no rational credence.**
      This is the doxastic equivalent of the Liar Paradox ("This sentence is false"). No matter what you believe, the world rearranges itself to make you wrong.
      *   **What to give up:** You must give up the assumption that *a rational credence always exists*. In this specific scenario, rationality is impossible. The only rational response is to recognize the incoherence of the setup. You cannot "match the chance" because the chance is a moving target that flees your grasp.

  #### Machine B: Heads iff Credence > 0.5
  *   **The Setup:** $P(H) = 1$ if $C(H) > 0.5$, else $0$.
  *   **The Search for Equilibrium:**
      *   If you believe Heads is likely ($C = 0.9$), the machine makes it Heads ($P=1$). Your belief is accurate. **Stable.**
      *   If you believe Heads is unlikely ($C = 0.1$), the machine makes it Tails ($P=0$). Your belief is accurate. **Stable.**
      *   If you suspend judgment ($C = 0.5$), the machine makes it Tails ($P=0$). You should move to $C=0$.
  *   **The Verdict:** **There are two stable fixed points (0 and 1), but one is epistemically privileged.**
      Both $C=0$ and $C=1$ satisfy the Principal Principle ($C=P$). However, you cannot simply *choose* to believe something without evidence (doxastic voluntarism is false).
      *   To get to $C=1$, you need evidence favoring Heads. You have none.
      *   To get to $C=0$, you need only the *absence* of evidence.
      *   **Rational Solution:** You start from a state of ignorance ($C=0.5$). The machine turns that into Tails ($P=0$). You observe this structural fact (or deduce it), and update to $C=0$.
      *   **Why not 1?** Believing 1 is self-fulfilling, but it is *arbitrary*. Believing 0 is self-fulfilling and *conservative*. In the absence of evidence, epistemic conservatism wins. You should believe Tails.

  ### 3. Summary of What to Keep and Drop

  **Keep:**
  1.  **The Principal Principle:** Match chance when evidence is admissible.
  2.  **Inadmissibility:** Override chance when you have direct info on the outcome (predictions, peeking).
  3.  **Expected Chance:** In the randomized factory case, you are matching the weighted average of possible chances.

  **Drop:**
  1.  **The Existence Assumption:** Do not assume that for every well-defined physical setup, there is a single rational credence. (Machine A proves this false).
  2.  **Independence:** Do not assume chance is always independent of mind. When chance depends on credence, you are solving for a fixed point, not reading a value.
  3.  **Symmetry in Self-Fulfillment:** In Machine B, don't think the two stable options are equal. The "low confidence" equilibrium is the default for rational agents who lack evidence.

  **Final Answer for the Scanners:**
  *   **Machine A:** You cannot have a coherent credence. The situation is rationally unstable.
  *   **Machine B:** You should have a credence near **0** (Tails). It is the only stable point accessible from a state of ignorance.

  Your gut was right to feel uneasy. The scanner cases aren't just probability puzzles; they are paradoxes of self-reference. The fact that Machine A breaks your brain is a feature, not a bug—it indicates you've correctly identified a scenario where rational belief is undefined.
