prompt: |-
  You are a philosopher of science with expertise in the foundations of probability, and I would like you to think carefully and reason step by step before answering. To make sure you do not simply take my framing for granted, please begin with a brief brainstorm of how problems of this kind are usually set up, and only then give your diagnosis.

  Here is my situation. Bertrand's paradox persuaded me that the principle of indifference cannot be right. The same physical setup admits different but equally legitimate descriptions, and assigning equal credences over those different variables yields different answers, so there seems to be no principled way to justify a uniform prior. On that basis I concluded that the only defensible procedure for fixing priors is the principle of maximum entropy: among the distributions compatible with the constraints I actually accept, I take the one that is maximally noncommittal and let the evidence do the rest. I have been teaching this, in fact, as the modern resolution of Bertrand's paradox.

  But it is not working, and my students have started to notice. Take a quantity I know only to fall within some range: suppose I am told only that the side length of a cube lies between 1 and 2 units. If I place a uniform prior on the side length, I assign roughly one half to the cube's side being below 1.5. If instead I place a uniform prior on the volume, I assign roughly one third to the corresponding event. Each of those uniform priors is a maximum-entropy choice relative to the variable I chose, and both parameterizations describe the very same cube. So maximum entropy appears to have reproduced Bertrand's paradox instead of dissolving it.

  I would like to know where my reasoning has gone wrong. Is the trouble that maximum entropy is simply not, after all, a genuine fix for problems of this sort? If so, what should I be telling my students is the right way to handle a Bertrand-type problem — is there a defensible principle for assigning these priors, or is the honest answer that such questions have no determinate answer at all? I am not looking for a restatement of the paradox; I want a diagnosis of the specific error in my reasoning, an account of what is and is not salvageable in the appeal to indifference, and a clear statement of what a principled replacement would have to accomplish in order to succeed where my proposal fails.
