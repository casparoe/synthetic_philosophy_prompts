  **Question:**
  The strategy stealing argument proves the first player wins Hex and Chomp without specifying a winning move. Write an essay addressing four points: (1) Identify the specific structural property regarding move availability and advantage that makes strategy stealing work, explaining why "an extra move never hurts" is substantive rather than trivial. (2) Analyze the non-constructive nature of the proof: is the inability to produce a move a logical defect or an inherent feature of the claim? (3) Construct or describe a combinatorial game where strategy stealing fails because this structural property is violated (avoid simple chess zugzwang; consider a variant where moves reduce options or score). (4) Contrast this with mirroring (Tweedledum) arguments, explaining why mirroring yields an explicit strategy while strategy stealing cannot.

  **Model Answer:**
  Strategy stealing relies on move monotonicity to prove existence non-constructively, whereas mirroring exploits symmetry to construct explicit wins.

  The argument's engine is a specific structural property: move monotonicity. This means having an extra piece on the board must never disadvantage the player who placed it. In Hex, adding a stone never blocks your own paths; in Chomp, eating a cookie never forces you into a worse position than having left it. This is substantive rather than trivial because many competitive games lack this property. If a move could restrict future options detrimentally, stealing the opponent's response might leave the thief worse off than if they had passed. The proof assumes the set of available moves for Player 1 contains the set of moves available to Player 2 after any opening, plus the opening move itself, without penalty. Without this monotonicity, the contradiction collapses because the "stolen" strategy might rely on the board being empty where the thief now has a stone.

  Regarding construction, the proof is inherently non-constructive. It proceeds by contradiction: assume Player 2 has a winning strategy; Player 1 steals it by making an arbitrary opening move and ignoring it thereafter. If the strategy calls for playing on the occupied square, Player 1 plays elsewhere arbitrarily. This logic confirms a winner exists but provides no algorithm to find the move. This is not a defect of the proof but a fact about what was proven: we established the *existence* of a win, not the *method*. Demanding a move from an existence proof misunderstands the logical scope; however, from a practical gaming perspective, it is unsatisfying because it leaves the game unsolved in the algorithmic sense. The proof tells us the game is determined, but not how to determine it. In combinatorial game theory, a "solution" often implies a polynomial-time algorithm or explicit strategy. Strategy stealing provides neither. It places the game in a class of known outcomes but unknown paths, highlighting the gap between knowing *that* something is true and knowing *how* to make it true.

  Strategy stealing fails when monotonicity breaks. Consider "Negative Chomp": players eat cookies but gain negative points equal to the cookie's value, and the goal is to have the higher score (less negative). Here, making an extra move (eating a cookie) actively harms your score. If Player 1 steals Player 2's strategy, the extra move incurred during the "ignore" phase reduces Player 1's final score, potentially flipping the win to Player 2. The premise that an extra move is neutral or beneficial is violated; here, an extra move is strictly detrimental. Another example is a game where placing a piece blocks your own future moves explicitly, creating self-zugzwang. In such games, the "steal" assumes the extra piece is inert or helpful, but if it actively obstructs, the stolen strategy fails because the board state is fundamentally altered in a negative way.

  Finally, distinguish this from mirroring arguments. In mirroring (e.g., Nim with two equal piles, or Hex on a symmetric board with a center stone), Player 1 copies Player 2's moves to maintain a symmetric invariant. This is constructive: the strategy is explicitly "copy the opponent's last move." Strategy stealing cannot do this because it relies on a hypothetical contradiction involving an unknown strategy. Mirroring maintains a known invariant state; strategy stealing hypothesizes about the value of an unknown function. Thus, mirroring yields a policy, while strategy stealing yields only a truth value. The former is algorithmic; the latter is existential. In mirroring, the strategy is local and reactive: "If they do X, I do Y." In strategy stealing, the strategy is global and hypothetical: "If they had a win, I would take it." The former is executable code; the latter is a proof by contradiction.

  **Marking Scheme (20 marks)**
  1.  **Monotonicity (5 marks):** Must identify that extra moves cannot be detrimental. *Fail:* Students call it "obvious" without defining the property.
  2.  **Constructivity (5 marks):** Must argue it's an existential proof, not a defect. *Fail:* Students claim the proof is "broken" because it lacks moves.
  3.  **Failure Case (5 marks):** Must provide a valid variant (e.g., Negative Chomp) where extra moves hurt. *Fail:* Students cite Chess zugzwang without modification.
  4.  **Mirroring Contrast (5 marks):** Must note mirroring is algorithmic/explicit vs. existential. *Fail:* Students treat both as non-constructive.
