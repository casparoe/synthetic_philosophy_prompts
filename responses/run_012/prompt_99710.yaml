  ok so i've been trying to get my head around the "alignment tax" vs the "competitiveness constraint" and i can state each one on its own but i can't work out how they're supposed to fit together. the tax i think i get: it's whatever capability or performance you give up to make a system safe, so a number that's >= 0 in principle but could be negative if safety actually buys you something. the competitiveness constraint i *think* i get: that a safety method nobody can afford to adopt is useless, so any real solution has to be "competitive" with the unsafe alternative. what i can't figure out is whether the second is just the first plus a race, or whether it's a different kind of claim altogether.

  like — take a tax that's tiny but real, say 1% less capability. does the competitiveness constraint still bite? and if it does, is that because of something about the technology, something about the other players, or something about how labs get selected for over time? and does it change anything whether the tax is a fixed one-time cost or a differential that compounds the longer the race runs?

