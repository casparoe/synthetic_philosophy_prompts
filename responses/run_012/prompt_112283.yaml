answer: |-
  You have indeed reinvented Adam Smith, but you have stopped at the mechanism of sympathy without installing the governor he built to regulate it. In *The Theory of Moral Sentiments*, Smith agrees with your diagnosis of human limitation: we are naturally moved more by the loss of our own little finger than by the destruction of China. That is the machinery of imagination you describe. But Smith introduces the "impartial spectator" precisely to solve the problem you identified with the flood. The spectator is the voice that tells us we *ought* to care about the thousands, even if our visceral imagination fails us.

  If Smith is right, you must give up two verdicts. First, the envy: you cannot call the flare "the right reaction." Smith would call it a natural passion, but improper; the spectator condemns it even if you cannot help the initial flare. Second, the flood: you must abandon the idea that caring without the photo is "faking." Smith argues that acting on principle when feeling fails is the highest morality, not a fake version of it. You are conflating the *feeling* of care with the *duty* of care.

  If your account is closer—that imaginability is the only true metric—then Smith's entire normative project breaks. If we cannot be obliged to feel what we cannot imagine, then moral obligation collapses into psychological capacity. There is no "ought," only "can."

  I am highly confident in this reading of Smith and where your rule diverges from his. I am least sure about your verdict on the fiction versus reality distinction; Smith focuses on moral agents, whereas you are comparing an aesthetic experience to a moral judgment, and the mapping there is less clear in his work.

  \answer{Moral obligation extends beyond the limits of visceral imagination.}
