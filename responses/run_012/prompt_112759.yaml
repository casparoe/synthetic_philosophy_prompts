  Right then, here's the breakdown on Priya. You're right to be wary; her verdicts look consistent on the surface, but they sustain two quite different underlying logics. Both fit her track record, but they'll send you to opposite corners of the room when you present on endothermy.

  Here are the two rules she could be running.

  **Rule 1: The Homeostatic Property Cluster (HPC)**
  On this view, a natural kind is real if there is a stable cluster of properties held together by a causal mechanism. The history of the thing matters only insofar as it explains the mechanism.
  *   **Fits the data:** She accepts *Species* despite no essence (the mechanism is reproductive isolation/ecological niche). She rejects *Jade* and *The Molecular Gene* because they are disjunctive—different underlying structures sharing a label, with no single mechanism unifying them. She rejects *DSM categories* because there's no known causal mechanism holding the symptoms together yet. She rejects *Bacterial Species* because the mechanisms of cohesion (horizontal gene transfer) make the clusters too leaky to count as 'real joints'.
  *   **Prediction for Endothermy:** **Yes.** Even though mammals and birds evolved it separately, there is a unified physiological mechanism (metabolic feedback loops, insulation, thermoregulation) holding the traits together. It's a real causal cluster, regardless of lineage.

  **Rule 2: The Historical Lineage Constraint**
  On this view, biological natural kinds must be monophyletic lineages (distinct historical entities). Non-biological kinds (gold, water) are real because they are fundamental physical constituents, but biological kinds are real only if they map onto a single branch of the tree of life.
  *   **Fits the data:** She accepts *Species* (they are lineages). She rejects *Fish* (paraphyletic leftover bin). She rejects *Race* (no biological lineage structure). She rejects *Bacterial Species* because the lineage boundaries are too porous to be individuated properly. She rejects *Jade* (not a historical entity in the relevant sense).
  *   **Prediction for Endothermy:** **No.** Endothermy is polyphyletic. It cuts across lineages. For a strict lineage theorist, convergent traits are functional grades, not kinds. Like 'Fish', it's a collection of distinct historical entities that happen to share a feature, not a single natural unit.

  **Which one would I bet on?**
  I'd put money on **Rule 1 (HPC)**.

  Two reasons. First, her comment on *Fish* is the tell. She explicitly says she's not rejecting it for the "usual paraphyly reason" but because it's a "leftover bin rather than a real cluster". If she were a strict lineage theorist, paraphyly *would* be the sufficient reason. By shifting the focus to the 'real cluster', she signals that causal cohesion matters more than genealogy.

  Second, her acceptance of *Species* without essence is classic Boyd-style HPC territory. A strict lineage theorist often treats the lineage itself as the essence. Priya seems to think the reality lies in the stable recurrence of the properties, grounded in a mechanism, not just the historical continuity. She's a realist about the *joints*, not necessarily the *history*.

  **The Settling Case**
  You're right to suspect endothermy won't settle it. Priya could easily concede endothermy is a 'kind' on HPC grounds, or deny it on Lineage grounds, but she might also argue the physiological mechanisms in birds and mammals are sufficiently different to count as disjunctive (undermining Rule 1).

  To force her hand, you need a case where Lineage and Mechanism pull in opposite directions, but where the mechanism is undeniable. I suggest you ask her about **a cryptic clade defined solely by neutral genetic markers.**

  Imagine a monophyletic group of organisms identified by DNA sequencing where adaptive radiation has been so extreme that there are *no* shared phenotypic traits, no ecological niche, and no homeostatic mechanism holding them together other than common descent.
  *   If she says **Yes**, it's a natural kind, she's a **Lineage Theorist** (Rule 2). History alone suffices.
  *   If she says **No**, it's just a historical coincidence without a causal cluster, she's an **HPC Theorist** (Rule 1).

  Alternatively, go the other way: **Convergent Molecular Structures.** Take a specific enzyme structure that has evolved independently in distinct lineages (identical mechanism, different history). If she calls that a natural kind despite the polyphyly, she's committed to HPC. If she rejects it because the genealogies are distinct, she's committed to Lineage.

  Given her no-nonsense stance on 'real joints', I suspect she'll want the mechanism. But don't bet the coffee on it without testing the cryptic clade first.

