answer: |-
  ### Exam Question

  **Question 4: Superrationality and Probabilistic Correlation (40 Minutes)**

  Consider the following symmetric simultaneous game between two players, Row and Column. Each chooses **Cooperate (C)** or **Defect (D)**. Payoffs (Row, Column) are as follows:

  | | **Column C** | **Column D** |
  | :--- | :---: | :---: |
  | **Row C** | 4, 4 | 0, 6 |
  | **Row D** | 6, 0 | 2, 2 |

  **The Modification:** Before choosing, each player is informed of the following regarding their opponent: With probability $p$, the opponent is their *algorithmic twin* (an agent who will necessarily make the exact same choice they do). With probability $1-p$, the opponent is a *committed defector* (an agent who will play D regardless of what the player does).

  In a well-structured essay, address the following four points:

  1.  **Standard Analysis:** State what ordinary strategic dominance and Nash Equilibrium reasoning prescribe for the *standard* version of this game (where $p=0$). Explain the logic behind this prescription.
  2.  **Superrational Reasoning:** State what the superrational argument prescribes for the standard game. Explicitly name the specific assumption that licenses the move from dominance-defection to cooperation.
  3.  **Threshold Derivation:** For the *modified* game described above, derive the critical value of $p$ at which Cooperate becomes the recommended choice. Show your calculation of the Expected Utility (EU) for both C and D.
  4.  **Philosophical Assessment:** Assess the objection that once calculation (3) is performed, superrationality reduces to ordinary expected-utility maximization over a statistical correlation, making it an empirical bet rather than a principle of rationality. In your assessment, specify what must be true of the two players for $p$ to equal 1, and evaluate whether this condition is ever met in non-simulated reality.

  ***

  ### Model Answer

  **Standard Analysis**
  In the standard version of this game (where $p=0$), ordinary Causal Decision Theory (CDT) prescribes Defection. This is determined by the principle of strategic dominance. If the opponent plays C, D yields 6 while C yields 4. If the opponent plays D, D yields 2 while C yields 0. Since D yields a higher payoff regardless of the opponent's action, D strictly dominates C. Consequently, the unique Nash Equilibrium is (D, D), resulting in payoffs of (2, 2). Rational agents, assuming no causal influence over the opponent's independent choice, must maximize utility by securing the dominant strategy.

  **Superrational Reasoning**
  The superrational argument, associated with Douglas Hofstadter, prescribes Cooperation in the standard game. This reasoning rejects the independence assumption inherent in standard dominance. Instead, it relies on the **Assumption of Logical Correlation** (or Symmetry of Rational Agency). This assumption posits that if both players are rational and face identical symmetric problems, they will reason identically and therefore arrive at the same decision. My choice does not *cause* the twin's choice, but it is *evidence* of it because we share the same rational algorithm. Therefore, the choice is effectively between (C, C) and (D, D). Since 4 > 2, a superrational agent chooses C.

  **Threshold Derivation**
  In the modified game, the player faces a lottery over opponent types. We calculate the Expected Utility (EU) for each action given probability $p$ of facing a twin and $(1-p)$ of facing a committed defector.

  If I play **C**:
  *   Against a Twin (prob $p$): They play C. Payoff = 4.
  *   Against a Defector (prob $1-p$): They play D. Payoff = 0.
  *   $EU(C) = p(4) + (1-p)(0) = 4p$

  If I play **D**:
  *   Against a Twin (prob $p$): They play D. Payoff = 2.
  *   Against a Defector (prob $1-p$): They play D. Payoff = 2.
  *   $EU(D) = p(2) + (1-p)(6) = 2p + 6 - 6p = 6 - 4p$

  To find the threshold where C is preferred, we set $EU(C) > EU(D)$:
  $$4p > 6 - 4p$$
  $$8p > 6$$
  $$p > 0.75$$

  Cooperation becomes the rational recommendation only when the probability of facing a twin exceeds 0.75.

  **Philosophical Assessment**
  The objection holds significant weight: by introducing $p$, superrationality appears to collapse into Evidential Decision Theory (EDT), where one maximizes utility based on correlations rather than causal consequences. If $p$ is treated as an empirical variable, the "principle" of superrationality is merely a calculation dependent on the likelihood of similarity.

  For $p$ to equal 1, the players must be **algorithmically identical** running on **identical input data**. This requires that their decision-making processes are deterministic functions of the game state, with no independent noise, biological variance, or private information distinguishing them. In non-simulated reality involving biological humans, this condition is never strictly met. Humans possess distinct neural architectures and micro-environmental influences that break perfect logical symmetry. Therefore, $p=1$ is an idealization possible only in digital copies or abstract logic.

  Consequently, the objection is largely correct. Superrationality is not a *sui generis* principle of rationality that overrides dominance; rather, it is a specific application of expected utility maximization that hinges on a strong empirical claim about the correlation between agents. Without the empirical justification for high $p$, the dominance argument remains the robust standard for rational choice. Superrationality transforms a normative question ("What should I do?") into an empirical one ("How similar are we?"), which limits its utility as a universal normative theory.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Standard Analysis (4 Marks)**
  *   **2 marks:** Correctly identifies Defection as the dominant strategy and (D, D) as the Nash Equilibrium.
  *   **2 marks:** Explains *why* (D yields higher payoff regardless of opponent's move; independence of opponent's choice).
  *   *Error:* Claiming (C, C) is a Nash Equilibrium (-2). Confusing dominance with maximin (-1).
  *   *Competent Failure:* States D is correct but fails to mention dominance or independence explicitly.

  **2. Superrational Reasoning (4 Marks)**
  *   **2 marks:** Correctly states Superrationality prescribes Cooperation.
  *   **2 marks:** Names the licensing assumption (e.g., "Logical Correlation," "Symmetry of Rationality," "Identical Reasoning").
  *   *Error:* Claiming superrationality relies on communication or enforceable contracts (-2).
  *   *Competent Failure:* Describes the logic but fails to name the specific assumption underlying the correlation.

  **3. Threshold Derivation (6 Marks)**
  *   **2 marks:** Correct EU(C) expression ($4p$).
  *   **2 marks:** Correct EU(D) expression ($6 - 4p$). *Note: Award 1 mark if they treat the Defector payoff against D incorrectly as 2p + 2(1-p) but algebra is consistent.*
  *   **2 marks:** Correct algebraic derivation of $p > 0.75$.
  *   *Error:* Arithmetic errors in solving the inequality (-1). Using payoffs from standard PD (3,3 / 0,5) instead of provided matrix (-2).
  *   *Competent Failure:* Sets up the equations correctly but makes a minor algebraic slip in the final threshold.

  **4. Philosophical Assessment (6 Marks)**
  *   **2 marks:** Acknowledges the reduction to EDT/empirical correlation (the "empirical bet" point).
  *   **2 marks:** Specifies conditions for $p=1$ (Identical algorithm/source code + identical information state).
  *   **2 marks:** Evaluates reality (Never met for humans/biological agents; only in simulation/abstraction).
  *   *Error:* Arguing $p=1$ is possible for humans via "shared culture" (-2). Denying the objection without argument (-2).
  *   *Competent Failure:* Discusses the objection generally but fails to specify the strict conditions required for $p=1$.

  **General Penalties**
  *   Exceeding word count significantly (detracts from clarity): -1
  *   Illegible or disorganized structure: -1

  **One-Line Notes on Common Failures**
  1.  **Standard:** Students often cite "greed" rather than dominance logic.
  2.  **Superrational:** Students frequently confuse superrationality with communication or trust.
  3.  **Derivation:** Students often forget the Defector plays D against *both* C and D.
  4.  **Assessment:** Students typically argue $p=1$ is possible via psychological similarity rather than algorithmic identity.
