answer: |-
  Move 37 cannot adjudicate the realism debate because successful action does not entail human-comprehensible internal semantics, yet reducing the network to mere instrumentalism ignores the structured causality required to consistently override human priors.

  The core ontological disagreement hinges on whether "representation" requires a mapping to human-interpretable concepts (realism) or merely a functional compression of input-output relationships that minimizes loss (instrumentalism). Your friend argues for a form of semantic realism: that the network's internal states corresponded to genuine strategic features of Go (like "influence" or "thickness") that humans had failed to conceptualize. You argue for instrumentalism: that the network simply found a statistical shortcut to win, and attributing "sight" or "understanding" is anthropomorphic projection. Move 37 is underdetermined evidence for either because a single output token does not reveal the topology of the hidden layers that produced it.

  For AlphaGo to genuinely "represent" the position in a realist sense, the value and policy networks would need to encode specific features of the board state in their activations that correlate with semantic concepts independent of the specific move output. Specifically, the convolutional layers would need to exhibit feature maps that fire consistently for "shoulder hit efficacy" or "central influence potential" across different board contexts, not just for this specific coordinate. If the representation is purely distributed and opaque—where no subset of neurons corresponds to a discernible concept even post-hoc—then the realist claim collapses into instrumentalism; the network would be manipulating high-dimensional vectors that only acquire meaning at the final output layer. Current interpretability research suggests neural networks do form concept-like clusters, but without mechanistic evidence isolating the specific subspaces responsible for Move 37, the claim that it "saw" something remains a narrative overlay on matrix multiplication.

  The Monte Carlo Tree Search (MCTS) complicates your friend's claim by decentralizing the "representation." AlphaGo was not a single network intuition; it was a hybrid system where the Policy Network provided priors, the Value Network evaluated leaf nodes, and MCTS performed the reasoning. Move 37 was selected because the search algorithm overrode the Policy Network's low prior based on the Value Network's high evaluation of the resulting state. This means the "insight" was not stored statically in the weights as a recognized pattern, but dynamically constructed through search. If the representation only emerges during the search process, it belongs to the system trajectory, not the network's internal state, weakening the argument that the network itself held a static representation humans missed.

  For the representational claim to be more than a nice narrative, interpretability evidence would need to show that perturbing the specific activations associated with Move 37 degrades performance in semantically predictable ways (e.g., specifically impairing center-oriented play without affecting corner stability). We would need to visualize the feature maps at the moment of decision and demonstrate they align with Go theory concepts that were previously undefined, rather than just showing that the move won. Without this, the "representation" is indistinguishable from a high-dimensional lookup table that happens to generalize well.

  The frame breaks because Move 37 is a singular anomaly rather than a systematic probe of the latent space. The case is underdetermined because multiple internal weight configurations could produce the same move via different computational paths; success does not prove the path taken was semantic rather than algebraic. Furthermore, the subsequent development of AlphaGo Zero pushes against realism rather than for it: Zero learned without human data and produced moves even more alien than 37, suggesting the network's "representations" may not map to *any* human semantic framework, but rather to an optimization landscape unique to the agent's architecture. This implies that while the network possesses internal structure (arguing against pure instrumentalism), calling that structure a "representation" of Go strategy may be category error, as it represents the game only relative to its own loss function, not relative to human understanding.
