answer: |-
  To provide a decision procedure for the participant in informal social sanctioning, we must treat the phenomenon not as a legal system (which it is not) nor as mere chaos (which it often feels like), but as a *normative ecosystem*. You are asking for a moral grammar for a language that is currently being spoken without rules.

  Below are the five desiderata any adequate theory of informal social sanction must meet to be action-guiding. Following these, I address your specific questions regarding classification, exclusion, and incompatibility.

  ### The Five Desiderata

  **1. The Distinction of Intent (Punishment vs. Protection)**
  *   **The Requirement:** The theory must distinguish between imposing a cost to *make the offender pay* (punishment) and imposing a cost to *prevent further harm to the community* (protection).
  *   **Consideration:** This addresses the distinction between *sanction* and *self-protection*. Firing a sexually harassing employee is primarily protective (removing a risk). Campaigning to ensure they never work in the industry again is punitive. A decision-maker must ask: "Am I acting to stop a current threat, or to balance a moral ledger?"
  *   **Case Application:** Distinguishes *refusal of a platform* (protection of audience space) from *organized ostracism* (punitive exile).

  **2. The Proportionality Constraint**
  *   **The Requirement:** The severity of the social cost imposed must correlate to the severity of the norm violation, independent of the viral velocity of the accusation.
  *   **Consideration:** This addresses the *pile-on*. In decentralized systems, harm scales with attention, not guilt. A theory must assert that the *magnitude* of the sanction is a moral variable separate from the *truth* of the accusation.
  *   **Case Application:** Distinguishes *private criticism* (low cost) from *dismissal from a job* (high cost). It demands that a minor social faux pas cannot warrant economic ruin, regardless of how many people are angry.

  **3. The Epistemic Threshold**
  *   **The Requirement:** Sanction requires a verified account of the wrong that is distinct from the emotional reaction to it. The "wrong" must be identifiable prior to the "sanction."
  *   **Consideration:** This addresses the constraint that *rules are unwritten and applied after the fact*. While there is no codex, there must be a shared understanding of the norm violated. If the norm is articulated only *during* the punishment, it is a trap, not a rule.
  *   **Case Application:** Distinguishes *consumer boycott* (based on specific corporate policy) from *loose coalitions* targeting vague "vibes" or past statements reinterpreted through current lenses.

  **4. The Standing Requirement**
  *   **The Requirement:** Only those directly harmed by the violation, or those entrusted as guardians of the specific norm violated, have standing to administer punitive sanction. General bystanders have standing only for disapproval.
  *   **Consideration:** This addresses the constraint that *standing to punish is contested*. In a democracy, the state punishes on behalf of all. In civil society, standing is relational. If I am not part of the community whose norm you violated, my sanction is imperialism, not justice.
  *   **Case Application:** Distinguishes *private criticism* (anyone's prerogative) from *campaigns for dismissal* (requires standing relative to the employer/employee relationship).

  **5. The Reintegration Horizon**
  *   **The Requirement:** Punishment must conceptually allow for an end. Permanent exclusion is exile, not punishment.
  *   **Consideration:** This addresses the case of being *effectively ruined*. If a sanction has no mechanism for cessation, it ceases to be a correction of behavior and becomes a liquidation of the person.
  *   **Case Application:** Distinguishes *temporary withdrawal of association* from *permanent de-platforming*.

  ***

  ### Classification of Requirements

  **Non-Negotiable (Universal Preconditions)**
  *   **The Distinction of Intent:** Without this, self-defense and vengeance are indistinguishable. A decision-maker cannot know if they are acting morally if they cannot distinguish protecting their workspace from punishing a sinner.
  *   **The Epistemic Threshold:** Without a separable account of the "wrong," the sanction is merely power. This is required for any moral agency.

  **Camp Prejudices (Contestable Values)**
  *   **The Reintegration Horizon:** This is a prejudice of the *Restorative* camp. The *Retributive* camp argues that certain violations forfeit membership permanently. While desirable for a healthy society, insisting on this excludes the moral intuition that some acts are unforgivable.
  *   **The Standing Requirement:** This is a prejudice of the *Communitarian* camp. The *Universalist* camp argues that moral violations are everyone's business. Insisting on standing restricts the "moral police" power of the general public.

  ***

  ### The Exclusionary Requirement

  **The Standing Requirement** does the most work to exclude leading positions.

  *   **Why:** It dismantles the "Global Village" model of social media. Most "cancel campaigns" operate on the premise that a violation in one context (a private DM, a local community, a decade-old tweet) grants standing to the entire world to sanction.
  *   **Exclusion:** It excludes the **Universalist Punitive Model** (anyone can punish anyone for anything) and the **Libertarian Non-Intervention Model** (no one has standing to punish anyone informally). It forces a localization of accountability that current digital infrastructure actively destroys. If you adopt this, you cannot join a sanction unless you can articulate your specific relational stake in the norm violated.

  ***

  ### The Incompatible Pair

  You suspected *Fair Notice/Proportionality* and *Decentralized Enforcement*. Your suspicion is correct, but the tension is sharper.

  **The Incompatible Pair: The Epistemic Threshold vs. Decentralized Enforcement.**

  *   **The Conflict:**
      *   **Decentralized Enforcement** (a constraint you listed as real) implies that norms emerge organically through the aggregate actions of strangers. There is no central arbiter to verify facts or define norms *ex ante*. The "rule" is often defined by the reaction itself.
      *   **The Epistemic Threshold** requires that the wrong be verified and identifiable *prior* to the sanction to ensure it isn't just mob emotion.
  *   **Why they cannot be jointly satisfied:** In a genuinely decentralized system (no one in charge, unwritten rules), the "verification" of the wrong is often the *result* of the sanctioning process, not the prerequisite. The crowd decides what the rule *was* by punishing the violation. To enforce a strict Epistemic Threshold requires a centralizing mechanism (an HR department, a court, a recognized council) to verify the facts before the cost is imposed.
  *   **The Judgment:** You cannot have a system that is both truly decentralized (organic, unwritten, no sovereign) and reliably epistemic (fact-checked, rule-bound *ex ante*). You must choose: either you accept the efficiency and freedom of decentralized norm enforcement (with the risk of error and excess), or you demand epistemic security (which requires instituting formalized, centralized structures that cease to be "informal sanction").

  ***

  ### Scorecard of Main Positions

  Here is how the prevailing theories score against these desiderata.

  | Position | Core Claim | Passes Intent? | Passes Proportionality? | Passes Standing? | Passes Epistemic? | Passes Reintegration? | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Moral Panic Deniers**<br>("It's just accountability") | Sanctions are merely consequences; "punishment" is a frame job. | **No.** Collapses protection and punishment. | **No.** Argues consequences are natural, not scalable. | **No.** Assumes universal standing. | **No.** Assumes the accusation is the evidence. | **No.** Often views permanent exile as natural. | **Fails.** Provides no guidance for distinguishing a riot from a trial. |
  | **The Free Speech Absolutists**<br>("It's all censorship/coercion") | All informal sanction is illiberal coercion indistinguishable from state force. | **Yes.** Sees all cost-imposition as punitive. | **Yes.** Opposes all severe sanctions. | **Yes.** Restricts standing to state actors only. | **N/A.** Rejects the legitimacy of the process entirely. | **N/A.** | **Fails.** Ignores the reality of private association and self-protection. Useless for deciding *when* to sanction. |
  | **The Procedural Reformers**<br>("We need better norms") | We can keep decentralization but add due process (e.g., "wait for facts"). | **Yes.** | **Yes.** | **Yes.** | **Yes.** | **Yes.** | **Theoretically Ideal, Practically Impossible.** Fails the *Incompatibility* test. You cannot impose procedural centralization on a decentralized system without changing the system itself. |
  | **The Communitarian Localists**<br>(The Desiderata Model) | Sanction is valid only within specific normative communities with shared stakes. | **Yes.** | **Yes.** | **Yes.** | **Yes.** | **Yes.** | **Actionable.** Requires the decision-maker to withdraw from "global" sanctions and restrict participation to their own relational spheres. |

  ### Practical Application for the Decision-Maker

  Based on the above, if you are deciding whether to join a sanction or resist it, the theory dictates this algorithm:

  1.  **Check Standing:** Did this person violate a norm of *my* community, or a community I am entrusted to guard? If no, you have standing only for disapproval (speech), not sanction (cost).
  2.  **Check Intent:** Am I signing this letter/boycotting this employer to stop a specific harm, or to make sure they suffer? If the latter, you require a higher epistemic threshold.
  3.  **Check Proportionality:** If I join this, does the cumulative harm (firing + ostracism + harassment) fit the wrong? If the outcome is "ruin" for a "mistake," you must resist, regardless of the guilt.
  4.  **Accept the Incompatibility:** Acknowledge that because this is decentralized, you cannot guarantee fair notice. Therefore, you must err on the side of *restraint*. In a system without a judge, the participant must act as the brake.
