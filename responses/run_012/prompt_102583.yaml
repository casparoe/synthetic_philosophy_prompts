prompt: |-
  Over the past year I have watched several people I know be disciplined, and in one case effectively ruined, by loose coalitions of strangers, and I have found myself approving of some of these campaigns and recoiling from others without being able to say what distinguishes the ones I accept from the ones I do not. I do not need another essay on whether cancel culture is real or whether it is a moral panic. I need the specification, and I need it pitched so that a person actually deciding, in a particular case, whether to join a sanction or resist it could use it. Write out the desiderata that any adequate theory of informal social sanction as punishment must meet: the cases it has to get right (private criticism, a consumer boycott, dismissal from a job, the refusal of a platform, organized ostracism, and the pile-on that far exceeds what the original offense warranted); the distinctions it must not collapse (punishment versus disapproval, versus the mere withdrawal of association, versus self-protection; the sanction versus the wrong that provoked it; intended versus foreseeable harm); and the constraints it must respect (that no one is in charge, that the rules are unwritten and applied after the fact, that sanctions accumulate, and that standing to punish is itself contested). Give the consideration behind each requirement, say which are non-negotiable and which are the prejudices of a particular camp, identify the requirement that does the most to exclude the leading positions, and tell me which pair of requirements cannot be jointly satisfied. My own suspicion is that fair notice or proportionality and genuinely decentralized enforcement are incompatible, but I want your judgment rather than mine. The criteria are what I am after; a brief scorecard of the main positions can follow.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Informal social sanction as punishment (often colloquially called "cancel culture," but the user explicitly wants to move beyond that debate).
      *   **Goal:** Specify the *desiderata* (criteria/requirements) that any adequate theory of this phenomenon must meet.
      *   **Audience:** A person deciding *in a particular case* whether to join a sanction or resist it. (Practical application).
      *   **Key Components Required:**
          *   Cases the theory must get right (private criticism, boycott, dismissal, de-platforming, ostracism, disproportionate pile-on).
          *   Distinctions it must maintain (punishment vs. disapproval vs. withdrawal of association vs. self-protection; sanction vs. original wrong; intended vs. foreseeable harm).
          *   Constraints it must respect (decentralization, unwritten rules, accumulation of sanctions, contested standing).
          *   Consideration behind each requirement.
          *   Classification: Non-negotiable vs. Camp Prejudices.
          *   Exclusionary Power: Which requirement excludes leading positions the most?
          *   Incompatibility: Which pair of requirements cannot be jointly satisfied? (User suspects Fair Notice/Proportionality vs. Decentralized Enforcement).
          *   Format: Criteria first, then a brief scorecard of main positions.

  2.  **Deconstruct the Phenomenon:**
      *   Informal social sanction is distinct from legal punishment. It lacks a sovereign, a codex, and a formal procedure.
      *   It operates through reputation, access, and association.
      *   The user is struggling with *moral intuition* vs. *principled consistency*. They want a framework to resolve that tension.

  3.  **Drafting the Desiderata (The Criteria):**
      *   *Requirement 1: Agency & Standing.* Who gets to punish? In law, it's the state. Here, it's "the public." But not everyone has standing.
      *   *Requirement 2: Proportionality.* The punishment must fit the crime. The user mentioned "pile-ons that far exceed."
      *   *Requirement 3: Epistemic Clarity (The Wrong).* We need to know *what* happened. Is the sanction for the act or the identity?
      *   *Requirement 4: Reversibility/Reintegration.* Punishment implies an end. Ruin implies permanence.
      *   *Requirement 5: Decentralization Constraint.* Acknowledge that no one is in charge.

      *Refining for the User's specific constraints:*
      *   Need to address: Punishment vs. Disapproval vs. Self-Protection.
      *   Need to address: Intended vs. Foreseeable Harm.
      *   Need to address: Fair Notice vs. Decentralization.

      *Let's formulate specific Desiderata:*
      1.  **The Distinction of Intent (Punishment vs. Protection):** A theory must distinguish between harming someone to make them pay (punishment) and harming someone to keep yourself safe (protection).
      2.  **The Proportionality Constraint:** The severity of the sanction must correlate to the severity of the norm violation, not the viral velocity of the accusation.
      3.  **The Standing Requirement:** Only those harmed or entrusted with the specific norm violated have standing to sanction.
      4.  **The Epistemic Threshold:** Sanction requires a verified account of the wrong, distinct from the emotional reaction to it.
      5.  **The Reintegration Horizon:** Punishment must allow for a path back; permanent exclusion is exile, not punishment.

  4.  **Analyzing the Constraints & Distinctions:**
      *   *Punishment vs. Disapproval:* Disapproval is speech; punishment is cost-imposition.
      *   *Punishment vs. Self-Protection:* Firing a dangerous employee is protection; firing them to signal virtue is punishment.
      *   *Decentralization:* This is the hard part. If no one is in charge, who ensures proportionality?

  5.  **Addressing the "Incompatibility" Question:**
      *   The user suspects *Fair Notice/Proportionality* vs. *Decentralized Enforcement*.
      *   *Analysis:* In a decentralized system, norms emerge organically (Hayekian). Codifying proportionality requires a central arbiter or a shared codex. If the rules are unwritten and applied after the fact (as per the prompt's constraints), Fair Notice is structurally impossible.
      *   *Verdict:* The user is right. You cannot have strict *ex ante* fair notice in a system defined by *ex post* organic norm enforcement.

  6.  **Addressing the "Exclusionary" Requirement:**
      *   Which requirement kills the most theories?
      *   *The Standing Requirement.* Most "cancel culture" defenses argue "everyone has a voice." Most critiques argue "this is mob rule." A strict Standing Requirement (you must be directly harmed or a designated guardian of the norm) excludes both the "free-for-all" mob model and the "state-proxy" model.

  7.  **Classifying Requirements (Non-negotiable vs. Prejudice):**
