      *   *Prejudice:* Reintegration (some argue certain acts forfeit membership permanently). Standing (libertarians might disagree with restricting who can boycott).

  8.  **Drafting the Scorecard:**
      *   *Position A: The Moral Absolutists (Sanction is always justified if truth).* Fails Proportionality.
      *   *Position B: The Free Speech Absolutists (Sanction is never justified/always censorship).* Fails the Reality of Association.
      *   *Position C: The Proceduralists (We need better norms).* Tries to hit the middle but fails Decentralization.

  9.  **Review and Refine:**
