      *   **Audience:** Mix of season-ticket holders, donors, neighbors (many haven't read the author or Rousseau).
      *   **Constraint 1 (The Hook):** The author is influenced by Rousseau's *Letter to d'Alembert* (anti-theater arguments: passive virtue, mocking truth-tellers, resource drain on small towns).
      *   **Constraint 2 (The Goal):** Must *not* be a lecture. Must be warm, funny, effective (get people to come back), and sincere.
      *   **Constraint 3 (The Twist):** Must incorporate the Rousseauian critique without name-dropping him as decoration. It needs to feel integrated.
      *   **Constraint 4 (The Ending):** Must attempt to turn the evening into a "fête" (audience becomes the show), moving people out of seats into a communal space. It needs to be plausible but admit the risk of falling flat.
      *   **Tone:** Slightly weird, intellectual but accessible, self-deprecating, communal.

  2.  **Deconstruct Rousseau's Arguments & Adapt for the Stage:**
      *   *Argument:* Theater makes you feel virtuous passively. *Adaptation:* Acknowledge the comfort of sitting in the dark. Challenge them to do something afterwards.
      *   *Argument:* Comedy punishes the truth-teller (Alceste). *Adaptation:* Acknowledge the characters in the play might be flawed. Ask the audience to judge themselves, not just the actors.
      *   *Argument:* Theater drains small towns. *Adaptation:* Acknowledge the fragility of *this* specific theater (the butter market). It survived because *they* saved it, not because it's an institution.
      *   *Argument:* The Fête (open air, everyone participates). *Adaptation:* Invite them outside after the curtain call. Make the lobby/square the real second act.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the weirdness. Establish the connection to the book. Thank the donors (crucial for the "survival" aspect).
      *   **The "Rousseau" Bit (Subtle):** Don't say "Rousseau." Say "I've been worrying." Address the passive nature of theater. "You pay, you sit, you feel." Turn it into a shared secret.
      *   **The Theater's Survival:** Mention the butter market. Mention the near-death experience last year. This validates the "small town resource" argument but flips it: *You* are the resource.
      *   **The Play:** Briefly touch on the adaptation. Acknowledge the characters might not be heroes.
      *   **The Call to Action (The Fête):** This is the risky part. Needs to be inviting, not commanding. Move from "watching" to "being."
