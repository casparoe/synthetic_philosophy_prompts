      *   *Re-evaluating the "Fête" constraint:* "end by genuinely trying to turn the evening into the fête thing." This suggests the speech *itself* initiates the break from passive spectatorship.
      *   *Idea:* What if the speech acknowledges that the play is a "necessary lie" but the community is the truth?
      *   *Okay, let's write it as a Pre-Show speech that sets up a Post-Show revolution.*

      *   *Wait, I need to be careful about the "Five minutes" constraint.* 5 minutes spoken is roughly 750-850 words.
      *   *Tone Check:* Needs to be warm. Not scolding. "I worry about this, but I love you all."

  5.  **Drafting - Step-by-Step:**

      *   *Intro:* Thank the donors. Acknowledge the butter market smell (metaphorically).
      *   *The Conflict:* Admit the anxiety. Writing a novel is solitary. Theater is communal. Is that good?
