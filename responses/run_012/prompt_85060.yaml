      *   *Standard Protocol:* Opening night speeches usually happen before the curtain or at intermission. If it's before, asking them to go outside *now* kills the ticket sales for the future.
      *   *Better Interpretation:* The speech is before the play. The "fête" instruction is for *after* the curtain falls tonight. The speech sets the expectation: "Don't just go home after this."
      *   *Wait, looking closer:* "get everyone out of the seats and into the square." If I say this *before* the play, it's a promise. If I say it *after* the play, it's an invitation.
      *   *Decision:* The prompt says "opening-night speech." Usually pre-show. But the Rousseauian "fête" replaces the spectacle. If I ask them to leave *now*, I'm being the Misanthrope. If I ask them to stay and mingle *after*, I'm building community.
      *   *Actually, the most "Rousseau" move:* Invite them to treat the *lobby* or the *square outside* as the real gathering spot immediately following.
      *   *Let's aim for Pre-Show:* Acknowledge the play is about to start, but frame it as the warm-up for the real connection.
