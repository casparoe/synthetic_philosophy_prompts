answer: |-
  # THE BACKWARD INDUCTION SORTING TREE
  **Start:** You accept the game tree, the payoffs, and the derivation: *Subgame-Perfect Equilibrium requires immediate defection.*
  **Task:** Answer the following claims to locate your position on the paradox.

  ```text
  START
    │
    ├─ [1] CLAIM: Monetary payoffs exhaust the players' preferences.
    │    │
    │    NO ────────────────────────────────────────────────────────► LEAF 1
    │    │
    │    YES
    │    │
    │    ├─ [2] CLAIM: Common Knowledge of Rationality (CKR) is a coherent state for these players.
    │    │    │
    │    │    NO ───────────────────────────────────────────────────► LEAF 2
    │    │    │
    │    │    YES
    │    │    │
    │    │    ├─ [3] CLAIM: The unit of rational agency is the pair, not the individual.
    │    │    │    │
    │    │    │    YES ─────────────────────────────────────────────► LEAF 3
    │    │    │    │
    │    │    │    NO
    │    │    │    │
    │    │    │    ├─ [4] CLAIM: Rationality attaches to plans chosen at the start, not acts at each node.
    │    │    │    │    │
    │    │    │    │    YES ────────────────────────────────────────► LEAF 4
    │    │    │    │    │
    │    │    │    │    NO
    │    │    │    │    │
    │    │    │    │    ├─ [5] CLAIM: A small chance of player error (tremble) makes cooperation optimal.
    │    │    │    │    │    │
    │    │    │    │    │    YES ───────────────────────────────────► LEAF 5
    │    │    │    │    │    │
    │    │    │    │    │    NO
    │    │    │    │    │    │
    │    │    │    │    │    ├─ [6] CLAIM: The theory's primary job is to predict actual behavior.
    │    │    │    │    │    │    │
    │    │    │    │    │    │    YES
    │    │    │    │    │    │    │
    │    │    │    │    │    │    ├─ [7a] CLAIM: The failure lies in the model's mapping to the world.
    │    │    │    │    │    │    │    │
    │    │    │    │    │    │    │    YES ────────────────────────► LEAF 6
    │    │    │    │    │    │    │    NO ─────────────────────────► LEAF 7
    │    │    │    │    │    │    │
    │    │    │    │    │    │    NO (It is to prescribe rationality)
    │    │    │    │    │    │    │
    │    │    │    │    │    │    ├─ [7b] CLAIM: The failure lies in the solution concept's logic.
    │    │    │    │    │    │    │    │
    │    │    │    │    │    │    │    YES ────────────────────────► LEAF 8
    │    │    │    │    │    │    │    NO ─────────────────────────► LEAF 9
  ```

  ---

  ## THE LEAVES

  **Leaf 1: Preference Revisionism**
  *Gloss:* The paradox dissolves because players derive utility from cooperation or fairness not captured in the money matrix.
  *Awkward Commitment:* Risks making game theory unfalsifiable by redefining utility to fit observed behavior post-hoc.

  **Leaf 2: CKR Skepticism**
  *Gloss:* The backward induction regress is self-undermining; players cannot coherently know that others know they are rational.
  *Awkward Commitment:* Requires abandoning the standard epistemic foundation of non-cooperative game theory entirely.

  **Leaf 3: Team Reasoning**
  *Gloss:* Rational agents maximize the payoff of the pair as a single unit rather than conditioning on the other's move.
  *Awkward Commitment:* Requires a metaphysical shift in what counts as an "agent" without a clear mechanism for forming teams.

  **Leaf 4: Resolute Choice**
  *Gloss:* It is rational to commit to a future path and irrational to renege, even if reneging is locally optimal at the final node.
  *Awkward Commitment:* Requires agents to ignore available information and dominant strategies at later decision nodes.

  **Leaf 5: Reputation / Trembling Hand**
  *Gloss:* Cooperation is rational because there is always a non-zero probability the opponent is irrational or will make a mistake.
  *Awkward Commitment:* Relies on the possibility of error to generate rational cooperation; vanishes in the ideal limit.

  **Leaf 6: Empirical Model Failure (Unnamed)**
  *Gloss:* The math is consistent, but the game tree does not accurately represent the strategic structure real humans face.
  *Awkward Commitment:* Admits the theory cannot model simple human interaction without ad-hoc structural adjustments.

  **Leaf 7: Bounded Rationality (Unnamed)**
  *Gloss:* The model is correct for ideal agents, but humans lack the cognitive depth to perform the backward induction.
  *Awkward Commitment:* Concedes that "rationality" in theory is systematically disconnected from "rationality" in successful human practice.

  **Leaf 8: Solution Concept Rejection**
  *Gloss:* Subgame-Perfection is the wrong normative standard for this class of games; rationality permits cooperation.
  *Awkward Commitment:* Leaves no clear, agreed-upon alternative equilibrium concept to replace SPE in finite games.

  **Leaf 9: Hardline Orthodoxy**
  *Gloss:* Immediate defection is the only rational move; humans who cooperate are simply making a normative error.
  *Awkward Commitment:* Dismisses robust experimental evidence of cooperation as mere irrationality rather than theoretical data.

  ---

  ## EMPTY & INCOHERENT REGIONS

  **1. Team Reasoning + Act-Based Rationality**
  *Diagnosis:* **Incoherent.** Team reasoning evaluates strategies based on joint outcomes at the start of the game. Act-based rationality evaluates moves based on local payoffs at each node. You cannot hold that the *unit* is the pair but the *timing* of evaluation is per-node; the pair does not exist at the node, only the individuals do.

  **2. CKR Skepticism + Hardline Orthodoxy**
  *Diagnosis:* **Incoherent.** The Hardline position relies on the backward induction derivation to claim defection is *required*. That derivation logically requires Common Knowledge of Rationality. If you claim CKR is impossible (Leaf 2), the derivation collapses, and you lose the ground to prescribe defection as the unique rational outcome.

  **3. Resolute Choice + Trembling Hand**
  *Diagnosis:* **Unattractive / Redundant.** Resolute choice argues you should cooperate *even if* you know the other is rational. The Trembling Hand argues you should cooperate *because* you think the other might be irrational. Holding both muddies the justification: are you cooperating due to commitment or due to uncertainty? Usually, one undermines the necessity of the other.

  ---

  ## INDISTINGUISHABLE LEAVES

  **Leaf 6 (Empirical Model Failure) vs. Leaf 8 (Solution Concept Rejection)**
  *Flag:* **Theoretical Blur.** In practice, these positions often converge. To say "the model maps poorly" (Leaf 6) often amounts to saying "SPE is the wrong solution concept for this context" (Leaf 8). The distinction rests on whether you blame the *primitives* (the tree/payoffs) or the *logic* (the equilibrium refinement), but the policy recommendation (don't use SPE here) is identical.

  **Leaf 7 (Bounded Rationality) vs. Leaf 1 (Preference Revisionism)**
  *Flag:* **Observational Equivalence.** Both predict cooperation. Leaf 7 says "they want to defect but can't calculate." Leaf 1 says "they calculate fine but want to cooperate." Without access to internal cognitive states, a handout cannot separate these based on behavior alone.
