      *   **Three Required Moments:**
          1.  The instant the possibility of exchange becomes perceptible.
          2.  The objection: "If you're willing to exchange it, it wasn't a genuine commitment" (corruption of the thing honored).
          3.  The unease remaining after the bargain.
      *   **Constraints:**
          *   Incommensurability must be *felt*, not asserted (show, don't tell).
          *   No character/narrator can name the mechanism (no economics/market/optimization vocabulary).
          *   Both characters must be serious and partially right (no villains).
          *   Setting: Domestic or institutional (not geopolitical).
          *   Cast: Small.
          *   Avoid obvious pairings (left/right, religious/secular, selfish/generous).
          *   Ending: Poised between victory and betrayal (ambiguous but balanced).
          *   Enjoyable as a story without noticing the concept.

