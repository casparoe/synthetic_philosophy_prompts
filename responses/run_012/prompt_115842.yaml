answer: |-
  The dust in the belfry did not float; it hung, suspended in the smell of oxidized brass and old grease. Silas ran a thumb along the great escapement wheel. The metal was cold, but the friction of centuries had polished the teeth to a mirror sheen. He could feel the history in the grain, the specific wear pattern of the winter of 1924, the slight warp from the heatwave of 1976. To Silas, the clock was not a device for telling time. It was a record of time's passage, written in metal.

  Below, the university bell tolled noon. It was late by forty seconds.

  The door to the stairwell banged open, admitting a slice of bright, noisy hallway light and Dean Evans. Evans wore a suit that cost more than Silas's annual supply budget. He checked his wrist, then looked at the great pendulum swinging lazily in the gloom.

  "Forty seconds, Silas," Evans said. His voice was not angry, but it carried the weight of a thousand schedules. "The Convocation speech starts in twenty minutes. The alumni are gathering in the quad. They expect the bell."

  "The escapement is worn," Silas said. He did not turn from the mechanism. "The main weight is dropping too fast. The friction is inconsistent."

  "Can you fix it?"

  "I can stop it. Disassemble the train. Machine new parts. It will take three months."

  Evans walked to the window, looking down at the brick courtyard where students were beginning to cluster. "Three months of silence. The trustees will ask why the tower is mute. They'll ask if the institution is losing its rhythm."

  "The institution is losing its truth," Silas said. He picked up a rag, wiping a smear of oil from a gear. "If I patch it, it will fail again. If I stop it, it remains honest."

  "Honesty doesn't ring a bell, Silas. Function does." Evans turned back. "We need it to sound at twelve. Every day. That is the agreement this tower has with the world."

  "The agreement is between the weights and the gears," Silas said. "The sound is just the echo."

  Evans sighed, rubbing the bridge of his nose. "I cannot explain metaphysics to the Board of Directors. I need the sound. You need the machine. Currently, the machine prevents the sound. How do we solve this?"

  Silas looked at the heavy iron weights hanging down the shaft, disappearing into the darkness of the tower's spine. Then he looked at the striker mechanism, the hammer that waited to hit the bronze bell. There was a gap between them, a conceptual space where the mechanical force transferred to acoustic energy.

  He looked at Evans. Evans was looking at his phone, waiting for an answer that fit into a budget line.

  Silas walked to the corner where a modern electrical box had been installed ten years ago for emergency lighting. He traced the conduit with his hand. "The hammer," Silas said. "It doesn't have to be pushed by the gear train."

  Evans looked up. "What?"

  "The gear train moves the hands. It tracks the sun. That is its purpose. The hammer... the hammer makes the noise." Silas paused. The idea formed slowly, like oil rising through water. "We decouple them."

  "You mean stop the clock."

  "No. The clock continues. The weights drop. The gears turn. The hands move. But the hammer..." Silas pointed to the electrical box. "We wire the hammer to a solenoid. Triggered by the minute hand. Electric."

  Evans stared at him. "You want to put an electric striker on a mechanical clock."

  "I want the gears to keep turning," Silas said. "If I stop the clock to fix it, the metal cools. The oils settle. The tension is lost. The machine dies. If I let you have your sound, I can keep the machine alive."

  Evans walked over to the bell. He tapped the bronze with a knuckle. It hummed, a low, resonant note that vibrated in Silas's chest. "And the weights? The gears?"

  "They continue to run," Silas said. "They do the work they were made to do. They just... don't hit the bell."

  Evans considered this. He looked at the gears, then at the window, then back to the gears. To Evans, the gears were means to an end. If the end was achieved by other means, the gears were irrelevant. But he knew Silas. Silas looked at the gears as if they were children.

  "So," Evans said slowly. "The bell rings on time. Perfectly. Every day."

  "Yes."

  "And the clock... winds. It moves. It looks the same."

  "Yes."

  "But the movement doesn't cause the sound."

  "No."

  Evans nodded. He pulled a pen from his jacket and tapped it against his palm. "I can fund the wiring. I can tell the Board we modernized the reliability system. They like modernization."

  Silas felt a tightness in his throat. "The weights must still be wound. The motor for the winding... it must remain mechanical. No auto-wind."

  Evans frowned. "Why? If we're electrifying the striker, why not the wind? It would save on maintenance costs. No one goes up here but you."

  "Because the tension must be physical," Silas said. "The weight must hang. The cable must strain. If you automate the wind, the weight sits still. The cable goes slack. The machine is a statue."

  Evans looked at the heavy iron blocks. "You want me to pay for electricity to lift weights that don't do anything?"

  "I want the machine to be under tension," Silas said. "I want the gears to bear the load."

  "To what end?" Evans asked. "If they aren't driving the bell, what load are they bearing?"

  "Themselves," Silas said.

  Evans was silent for a long time. The dust motes shifted in the light beam. Below, the murmur of the crowd grew louder. They were waiting. The university was waiting for its signal.

  "It seems wasteful," Evans said finally. "Paying to lift dead weight."

  "It seems hollow," Silas countered. "Ring a bell that isn't earned by the work."

  Evans looked at Silas, really looked at him, for the first time that day. He saw the grease under Silas's fingernails, the way his shoulders hunched protectively over the escapement. He realized that for Silas, the sound was secondary. The sound was the noise the machine made when it was telling the truth. If the machine wasn't driving the sound, the sound was a lie.

  But Evans also knew something Silas didn't say. To Evans, the gears were a black box. He didn't care about the tension. He cared about the quad. He cared about the tradition. If the bell didn't ring, the tradition broke. If the bell rang, the tradition held. The mechanism was invisible to the students.

  "So," Evans said. "We run the wires. You keep the weights moving."

  "Yes."

  Evans put his pen away. "There is a problem, Silas."

  "The cost?"

  "No. The principle." Evans stepped closer to the great wheel. "If you agree to this... if you agree to let the bell ring without the machine driving it... then what are you keeping? You say you want to preserve the machine. But a machine's purpose is to work. If you disconnect the work from the purpose, you aren't preserving a machine. You're preserving a sculpture."

  Silas flinched. The words landed like a hammer blow.

  "A commitment you are willing to bypass," Evans said, his voice quiet, "was never a genuine commitment. You say you honor the clock. But you are willing to let it lie. If the clock's truth is in its mechanics, and you silence the mechanics to make a noise... you are corrupting the very thing you claim to honor. You become the janitor of a prop."

  Silas looked at his hands. He thought of the escapement, the precise dance of the anchor and the wheel. He thought of the sound. For forty years, he had believed they were one thing. The sound was the voice of the gear. To separate them was to lobotomize the tower.

  "If I don't do this," Silas said, his voice rough, "you will replace me. You will bring in a firm. They will strip the brass. They will install a digital speaker. They will paint the gears gold. The machine will be scrapped."

  "Probably," Evans admitted. "Efficiency demands it."

  "If I do this... the gears turn. The oil flows. The metal breathes." Silas looked up. "I am not keeping the truth. I am keeping the body. The soul... the soul is yours."

  Evans nodded slowly. "And I am paying for the body so I can borrow the soul."

  It was not an agreement spoken in terms of gain. There were no handshakes. Evans simply took out his phone and sent a message to facilities. Silas picked up his wrench. They worked side by side for an hour, Silas guiding the wire, Evans holding the ladder. They did not speak of the cost. They did not speak of the waste. They spoke of gauge and tension and conduit width.

  When they finished, the sun had moved across the floor. It was twelve fifty-five.

  "Test it?" Evans asked.

  Silas nodded. He engaged the solenoid.

  The hammer swung. It struck the bell. The sound was perfect. It was crisp, loud, and exactly on pitch. It rang out over the campus, clear and authoritative.

  Below, there was a cheer. The students looked up. The tradition held.

  Silas stood by the great wheel. He watched the main weight drop, inch by inch. The gears turned. The escapement ticked. The sound of the mechanism was a soft, rhythmic grinding, completely drowned out by the lingering resonance of the bell.

  The bell rang again. Electric. Precise.
  The gears turned. Mechanical. Useless.

  Evans checked his watch. "Perfect time."

  "Yes," Silas said.

  "It looks good, Silas. The Board will be pleased." Evans moved toward the door. He paused with his hand on the latch. "You know, no one will ever know the difference. Down there, it's still the old bell."

  "They will know," Silas said. "The vibration is different. The electric strike doesn't have the same decay."

  "Will they care?"

  Silas looked at the gears. They were moving. The oil was shimmering on the teeth. The tension was holding. The machine was alive. But it was driving nothing. It was a heart beating in a body that had walked away.

  "No," Silas said. "They won't care."

  Evans left. The door clicked shut. The dust settled back into its suspension.

  Silas stood alone in the belfry. The bell struck the half-hour. It was flawless. The gears ground on, bearing their load, moving toward nothing. He placed his hand on the main wheel. He could feel the vibration of the motor winding the weight back up, the hum of the electricity that kept the illusion alive.

  He had saved the machine. He had preserved the motion, the tension, the history of the metal. He had kept the body from the scrapyard. But he had agreed that the body did not need to do the work it was made for. He had accepted that the voice could be synthesized, as long as the throat remained.

  Evans had saved the tradition. He had secured the signal, the rhythm, the public face of the university. He had kept the sound. But he had agreed to pay for the motion of the gears, to fund the waste, to sustain the ghost of the mechanism because the Keeper demanded it. He had accepted that the signal needed the lie of the machine to feel real.

  Silas listened to the electric hammer strike. It was perfect. It was hollow.

  He picked up his rag and wiped a spot of oil from the casing. The metal was warm. It was still here. It was still turning.

  He watched the weight drop. It was heavy. It was real. It was pulling on nothing.

  Silas sat on the stool beside the escapement. He waited for the next hour. He would listen to the lie. He would watch the truth turn. He would keep the body warm.

  Outside, the students walked across the quad, checking their watches, synchronized by the bell. They moved in time. They moved together. They did not look up at the tower. They did not know that the heart beating above them was no longer connected to the voice calling their names.

  Silas closed his eyes. He felt the vibration of the floor, the electric hum, the mechanical grind. Two rhythms, slightly out of phase, occupying the same space. He could not tell which one was the tower anymore. He only knew that if he stopped either one, the whole thing would fall.

  He opened his eyes and watched the gears turn. They were beautiful. They were useless. They were safe.

  The bell rang again. Silas did not flinch. He simply wiped his hands on his trousers and prepared to wind the weight, lifting the dead load, one turn at a time, into the dark.
