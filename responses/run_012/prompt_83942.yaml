answer: |-
  This is a tight, high-stakes design challenge. You want the *psychology* of noise to hit harder than the *math* of noise, which is tricky with a room full of people who think in math.

  Here is a complete run-sheet for **"The Static Channel."** It is designed to be mechanically simple so the cognitive load falls on the social uncertainty, not the rules.

  ### 1. The Game Design: "The Static Channel"

  **Core Mechanic:** Iterated Prisoner's Dilemma with "Trembling Hand" (Execution Error).
  **The Noise:** A 1-in-6 chance that your intended action is flipped before your partner sees it.
  **The Asymmetry:** *You* know if your action flipped (because you roll the die). *Your partner* does not. They only see the result.
  **The Constraint:** Absolute silence and "poker face" during play. No explaining, no shrugging, no apologetic looks.

  #### Payoff Table (Points)
  Write this on a whiteboard. Do not distribute handouts (wastes time).
  *   **Mutual Cooperation (C/C):** 3 points each.
  *   **Mutual Defection (D/D):** 1 point each.
  *   **You Defect, They Cooperate (D/C):** You 5 points, They 0 points.
  *   **You Cooperate, They Defect (C/D):** You 0 points, They 5 points.

  *Prize:* A bag of nice coffee beans for the single highest scorer. (If there's a tie, roll a die. The randomness of the prize matches the randomness of the game).

  #### Materials Needed
  *   **Cards:** 2 index cards per person (one marked **C**, one marked **D**). Or just use Green/Red cards if you have them.
  *   **Dice:** 1 six-sided die (d6) per pair.
  *   **Score Sheets:** 2 per person (one for Season 1, one for Season 2). Columns: *Round | My Intent | Die Roll | Final Action | Partner's Action | My Score*.
  *   **Timer:** Visible to everyone.
  *   **Whiteboard:** For payoffs and running leaderboard (optional, but fuels competition).

  ---

  ### 2. Setup & Logistics (18 People)

  **Seating:** 9 tables of 2. Face-to-face.
  **Pairing:** Randomize immediately. Do not let friends sit together.
  **Seasons:**
  *   **Season 1:** 5 Rounds with Partner A.
  *   **Swap:** 3 minutes to move seats.
  *   **Season 2:** 5 Rounds with Partner B.

  **The "No Talking" Rule:** This is the most critical rule. If they talk, they solve the information problem verbally, and the game breaks.
  *   *Rule:* "From the moment the timer starts until the debrief begins, you cannot speak, gesture, or signal intent. You are two computers on a noisy line."

  ---

  ### 3. Round-by-Round Timeline (90 Minutes)

  | Time | Segment | Action |
  | :--- | :--- | :--- |
  | **00:00 - 00:10** | **Intro** | Explain Payoffs, Noise Rule, Silence Rule. Hand out materials. |
  | **00:10 - 00:35** | **Season 1** | 5 Rounds. (Approx 4-5 mins per round including rolling/scoring). |
  | **00:35 - 00:40** | **Swap** | Collect Season 1 sheets. Move to new partner. Hand out Season 2 sheets. |
  | **00:40 - 01:05** | **Season 2** | 5 Rounds. Same rules. |
  | **01:05 - 01:10** | **Tally** | Collect sheets. Calculate winners. Put coffee on the table. |
  | **01:10 - 01:30** | **Debrief** | Structured discussion (script below). |

  #### The Play Loop (Per Round)
  1.  **Intent:** Both players choose C or D card, keep it hidden.
  2.  **Roll:** The player who intends to act rolls the d6.
      *   **If 2-6:** Action stands.
      *   **If 1:** Action **flips** (C becomes D, D becomes C).
  3.  **Reveal:** Players reveal their *Final Action* (the post-roll result) to each other.
  4.  **Record:** Both players record the *Final Actions* on their score sheet and calculate points.
      *   *Crucial:* You also record your *Intent* and *Roll* on your private log, but **do not show this to your partner.**
  5.  **Reset:** Clear table. Next round.

  ---

  ### 4. The Debrief Script (35 Minutes)

  Do not lecture. Use the Socratic method. Your goal is to make *them* say the insights you want to hear.

  **Phase 1: The Feud (10 mins)**
  *   **Ask:** "Raise your hand if your score dropped significantly in Rounds 2 or 3 compared to Round 1."
  *   **Ask:** "Who had a partner who Cooperated, then Defected, then Cooperated again?" (This is the signature of noise).
  *   **Ask:** "When you saw that Defect, what was your move in the next round?"
      *   *Expected Answer:* "I punished them."
  *   **Point:** "In a clean game, Defect means 'I am taking advantage of you.' In this game, Defect might mean 'I am trying to help you and the line static-ed.' By punishing, you treated noise as malice."

  **Phase 2: The Information Asymmetry (10 mins)**
  *   **Ask:** "Who had a round where *they* intended to Cooperate, rolled a 1, and saw their partner punish them for it?"
  *   **Ask:** "How did that feel?"
      *   *Expected Answer:* "Frustrating," "Unfair," "I wanted to tell them it was an accident."
  *   **Point:** "This is the core breakdown. You knew your own goodwill. Your partner only saw your output. In real work, you are always the person who *knows their own intent*. You are never the person who only sees the output. We all walk around thinking we're the victim of misunderstanding."

  **Phase 3: The Forgiveness Trade-off (10 mins)**
  *   **Ask:** "The fix seems obvious: Be forgiving. If they defect once, let it slide. Who tried that?"
  *   **Ask:** "Did anyone have a partner who just Defected every single time, regardless of noise?" (There is usually one).
  *   **Ask:** "If you were forgiving to *that* person, what happened to your score?"
  *   **Point:** "Forgiveness fixes the noise problem, but it creates an exploitation problem. If you are too forgiving, you become food for the 'Always Defect' strategy. You are trading the risk of a feud for the risk of being suckered."

  **Phase 4: The "Retired Corrector" & Econ PhDs (5 mins)**
  *   *Anticipate the comment:* "This is just a Public Goods Game with imperfect monitoring."
  *   *Your Response:* "Structurally, yes. But the model assumes rational actors who understand the error rate. Did the room behave rationally? Or did the *feeling* of being wronged override the math? We aren't testing the equilibrium; we're testing the collapse."
  *   *Closing Thought:* "In software and econ, we build systems assuming clean signals. In reality, the signal is always noisy. The question isn't 'what is the optimal strategy?' It's 'how much noise can this team tolerate before the trust budget hits zero?'"

  ---

  ### 5. Failure Modes & Mitigation

  **1. The "Gamer" (Exploiting the Noise)**
  *   *Risk:* Someone realizes they can Defect intentionally, and if caught, claim "Oh, I meant to Cooperate, it was the die."
  *   *Mitigation:* The private log sheet. In the debrief, ask that person to show their log. If their Intent column is all "D", the room will see they lied. The social shame is the enforcement mechanism.
  *   *Script:* "We can check the logs. If your Intent says 'Defect' every time, the coffee prize is disqualified. This relies on honor, but the logs make lying hard."

  **2. The "Corrector" (Derailing with Theory)**
  *   *Risk:* He interrupts the game to explain Nash Equilibria.
  *   *Mitigation:* Pre-empt him in the intro. "I know many of you know the theory. I am asking you to suspend the math and observe the emotion. We will discuss the theory in the last 10 minutes."
  *   *During Debrief:* Validate him quickly. "You're right, this is a Noisy IPD. But did the Nash Equilibrium predict the anger in the room? No."

  **3. The "Chatting" (Breaking the Silence)**
  *   *Risk:* Pairs start saying "Sorry, that was the die!"
  *   *Mitigation:* Walk the room. If you hear talking, stop the timer. "Round void. Reset. Silence is the constraint." Do this once firmly, and they will stop.

  **4. Running Long**
  *   *Risk:* Scoring takes too long.
  *   *Mitigation:* Keep rounds to 5. If you are behind, cut Season 2 to 3 rounds. Do not cut the debrief.

  ---

  ### 6. Limitations (What This Doesn't Show)

  Be honest about this in the wrap-up so you don't oversell it.

  1.  **Evolution:** This game doesn't show how strategies spread. In the real world, if "Forgiving" players go bankrupt, they disappear. Here, they just lose coffee points.
  2.  **Reputation:** In this game, your reputation dies with the season. In real life, rumors travel. You can't switch partners and escape your bad rep easily.
  3.  **Cost of Signaling:** In the game, signaling "I am trustworthy" is forbidden. In real life, we burn resources (time, favors) to prove we aren't noise.
  4.  **Power Dynamics:** All players are equal here. In work, the person who controls the budget can defect with impunity.

  ### 7. Facilitator Cheat Sheet (For You)

  *   **If the room is too happy:** (Everyone is cooperating). Remind them: "The prize is for the *highest* score. Mutual Cooperation caps you at 3 points. Defecting on a Cooperator gets you 5. Are you sure you're optimizing?"
  *   **If the room collapses:** (Everyone defects Round 1). Stop. Reset. "You've discovered the 'Always Defect' equilibrium. It's safe, but it's low points. Is there a risk worth taking?"
  *   **The Coffee:** Put the bag of coffee visibly on the front table. It needs to look desirable.
  *   **The Logs:** Collect the score sheets. You might want to scan them later to see the actual data of the "feuds."

  ### Why This Works for Your Group
  *   **Software/Econ:** They respect the mechanism (Trembling Hand Equilibrium).
  *   **The Corrector:** He gets to analyze the logs in the debrief.
  *   **The Feeling:** By hiding the *Intent* log until the end, you force them to live in the uncertainty for the full 90 minutes. They will feel the frustration of being punished for an accident, which is exactly the visceral lesson you want.
