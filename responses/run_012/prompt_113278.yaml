  To the room: You hold different views. Some of you think numbers count. Some of you think they do not. One of you thinks the question is misplaced. You will hear arguments that challenge your view. You will not be asked to surrender it.

  When you object, you address the argument. You do not address the person.
  When you listen, you look for justification. You do not look for victory.
  If a point stands, it stands because it is justified to you. It does not stand because it is popular.
  If a point falls, it falls because it failed you. It does not fall because it failed the standard.
  There is no majority here. There is only justification.
  This protects you from the crowd. This protects the conversation from you.

  You might feel frustrated. A question might go unanswered. A comment might be cut short. This is not a slight. It is a constraint of time.
  You are each responsible for your own participation.
  I am responsible for the schedule.
  You deserve clarity. You deserve honesty.
  I will not tell you that this is easy. I will not tell you that you agree.
  You will disagree. That disagreement is the point.
  When you speak, you speak for yourself. When you listen, you listen for yourself.
  No one speaks for the room. No one votes for the room.

  To the senior colleague: You have seen this before. You will judge if it has progressed. I do not ask for your approval. I ask for your scrutiny.
  To the economists: You will hear formal models. You will not be asked to abandon precision. You will be asked to check the ethics.
  To the contractualists: You will hear familiar worries. You will not be asked to assume the conclusion. You will be asked to defend the premise.

  You are each a guest. I am the host. The house rules are simple.
  Speak clearly. Listen closely. Respect the time.
  The time belongs to each of you. It does not belong to me.
  Use it well.
  There is coffee. There are chairs. There is time.
  I invite you to begin.

  2. 'Line by line'

  1. *"Priya... The schedule holds a fixed capacity."* Aimed at Priya. It frames the exclusion as a structural constraint she could endorse (disappointment) rather than a weighing of her worth against others (complaint). She cannot reasonably reject a factual limit on time.
  2. *"There is no majority here."* Aimed at the contractualists. It pre-emptively blocks aggregation. They cannot reject a rule that prevents their core objection (tyranny of numbers) from occurring within the room.
  3. *"It does not fall because it failed the standard."* Aimed at the econ/consequentialists. It ensures arguments aren't dismissed for lacking popular appeal, but also aren't accepted merely because they maximize room satisfaction. It demands objective justification.
  4. *"I do not ask for your approval. I ask for your scrutiny."* Aimed at the senior skeptic. It acknowledges their skepticism without demanding they validate the workshop's existence. It treats their doubt as a resource, not an obstacle.

  3. 'The line I couldn't use'

  I wanted to say: "We selected the strongest papers for the program." This would have failed Priya immediately. It implies her paper was weaker than those included, turning a structural exclusion into a qualitative judgment she can reasonably reject. It also fails the contractualists in the room, as "strongest" implies an aggregative ranking of quality across incommensurable views, violating the no-comparatives rule.

  4. 'Where the frame strained'

  The complaint/disappointment split worked for the room's time limits (a constraint everyone endorses) but strained on Priya's exclusion. A fixed schedule is only a valid justification if the capacity wasn't arbitrary. If I could have added a slot, the "fixed capacity" claim becomes a complaint-generating choice. To repair this: do not just invite her to discuss. Email her the accepted papers beforehand. Buy her dinner separately. Make the exclusion about logistics, but the inclusion about intellectual respect. Bilateral repair matters more than public framing.
