answer: |-
  Here is an analysis of the implicit theories underpinning the three major legal regimes regarding sex work, followed by an examination of their philosophical presuppositions, underdetermination, and the empirical-conceptual divide.

  ### I. The Implicit Theories of the Three Regimes

  #### 1. The Nordic Model (Sweden, et al.)
  *   **Location of the Wrong:** The wrong is intrinsic to the **transaction**, specifically located in the **purchase**. The sale is viewed as a symptom of vulnerability, but the purchase is an act of exploitation and objectification.
  *   **View of Consent:** **Skeptical/Structural.** Consent to sell sex is treated as distinct from consent to other labor. It is presumed to be compromised by structural inequality, patriarchy, or economic desperation. The law assumes that "consent" in this context is often a survival strategy rather than genuine autonomy.
  *   **View of Agency:** **Paternalistic/Protective.** Sellers are viewed primarily as victims or survivors to be protected and exited, rather than workers to be empowered. The state overrides the seller's choice to sell in order to protect them from the harm of the market, while punishing the buyer as the agent of harm.
  *   **View of Law's Function:** **Deterrence and Norm-Setting.** The law aims to shrink the market through stigma and criminal risk directed at demand. It seeks to signal that women's bodies are not commodities. Success is measured by the reduction of the trade, not the safety of the trade.

  #### 2. The Regulatory Model (Germany, Netherlands)
  *   **Location of the Wrong:** The wrong lies in the **unregulated conditions**, not the act itself. Prostitution is a "necessary evil" or a high-risk industry that becomes harmful only when invisible, untaxed, or unchecked.
  *   **View of Consent:** **Conditional/Administrative.** Consent is valid if it occurs within state-sanctioned parameters (health checks, licensing, contracts). The law trusts consent only when it is monitored.
  *   **View of Agency:** **Mixed/Guarded.** Sellers are treated as economic actors, but ones operating in a morally suspect or physically hazardous field. The state supports their agency only insofar as it can be sanitized and made compliant with public order.
  *   **View of Law's Function:** **Containment and Hygiene.** The law aims to separate "good" (regulated, healthy, taxable) prostitution from "bad" (trafficked, unlicensed, unsafe) prostitution. Success is measured by public order, tax revenue, and health metrics.

  #### 3. The Decriminalization Model (New Zealand)
  *   **Location of the Wrong:** Nowhere intrinsic. The wrong lies only in **coercion, violence, or breach of contract**, identical to any other industry.
  *   **View of Consent:** **Robust/Continuous.** Consent to sell sex is treated as continuous with consent to any other service labor. The law trusts the seller's assessment of their own interests.
  *   **View of Agency:** **Autonomous/Labor-Based.** Sellers are workers exercising autonomy. The state's role is to enforce labor rights (minimum wage, safety, refusal of clients) rather than to manage morality or health.
  *   **View of Law's Function:** **Harm Reduction through Integration.** By removing criminal penalties, the law brings the industry into the light, allowing workers to access police protection and legal recourse without fear. Success is measured by worker safety and access to justice.

  ---

  ### II. Strict Presuppositions vs. Compatible Theories

  This section separates what each statute *must* assume to function logically from what merely fits comfortably with it.

  #### 1. The Nordic Model and Intrinsic Wrongness
  **Question:** *Could the Nordic model be defended without claiming buying sex is intrinsically wrong?*
  **Analysis:** The asymmetry (punish buyer, exempt seller) is difficult to justify on purely consequentialist grounds without implying a moral distinction between the two parties.
  *   **Strict Presupposition:** The regime presupposes that the **buyer is the primary moral agent of harm**. If the transaction were neutral, punishing one party to a consensual contract while exempting the other would be arbitrary. If the seller were fully autonomous, punishing the buyer would violate the seller's liberty to contract.
  *   **Underdetermination:** However, the *reason* for the wrongness is underdetermined. The statute fits equally well with **Radical Feminism** (sex buying reinforces patriarchy) and **Social Conservatism** (sex buying is sinful/degrading). The law does not require the feminist theory, only the conclusion that the purchase is the locus of culpability.
  *   **Verdict:** It requires the claim that the purchase is *structurally* wrong (harmful regardless of specific consent), but not necessarily that it is *metaphysically* evil. It relies on a theory of "asymmetric vulnerability."

  #### 2. The Regulatory Model and the "Damaged Participant"
  **Question:** *Is regulated legalization coherent if it treats the trade as legitimate but participants as presumptively damaged?*
  **Analysis:** Yes, this is coherent under a **"High-Risk Industry" theory**.
  *   **Strict Presupposition:** The state presupposes that sex work carries unique health and social risks that ordinary commerce does not (hence mandatory health checks or zoning).
  *   **Coherence Check:** It is coherent to license a dangerous activity (like asbestos removal or mining) while mandating safety gear. However, tension arises if the regulations impose stigma (e.g., mandatory registration that outworkers). If the state treats the *work* as legitimate but the *worker* as a vector of disease or moral risk, it creates a "second-class license."
  *   **Verdict:** It is logically coherent but sociologically unstable. It presupposes that visibility equals safety, ignoring that regulation can drive those who fail to meet standards (due to stigma or bureaucracy) deeper underground.

  #### 3. Philosophical Underdetermination
  *   **New Zealand:** The decriminalization model is underdetermined between **Libertarianism** (freedom of contract) and **Labor Socialism** (workers' rights). A libertarian supports it because the state shouldn't ban consensual acts; a socialist supports it because workers need union protection. The statute remains the same, but the justification differs.
  *   **Germany:** The licensing model is underdetermined between **Utilitarianism** (reduce STIs/crime) and **Paternalism** (state knows best how to manage vice).
  *   **Sweden:** As noted, underdetermined between **Feminism** and **Conservatism**.

  ---

  ### III. Empirical vs. Conceptual Disputes

  Much of the political debate is framed as empirical ("Does criminalizing buyers reduce trafficking?"), but the core disagreements are conceptual.

  #### 1. The Empirical Component
  Each regime relies on causal claims that are contested:
  *   **Nordic:** Assumes criminalizing demand shrinks the market and reduces trafficking. (Evidence is mixed; some studies suggest it drives the market underground, making trafficking harder to detect).
  *   **Regulatory:** Assumes licensing makes workers safer and separates legal work from trafficking. (Evidence suggests it often creates a two-tier market where the most vulnerable cannot meet licensing requirements).
  *   **Decriminalization:** Assumes removing criminal penalties increases reporting of violence and improves health outcomes. (Early data from NZ supports this, but long-term global data is sparse).

  If the empirical data shifted decisively (e.g., if the Nordic model were proven to increase violence against sellers), the Nordic regime would face a crisis of legitimacy *unless* its commitment is deontological (i.e., "It is wrong even if it causes harm").

  #### 2. The Conceptual Component
  The deeper dispute is about the **ontology of sex work**.
  *   **Is it Labor or Violence?** New Zealand defines it as labor; Sweden defines it as violence (or potential violence). Germany defines it as a service with externalities.
  *   **Is Consent Formal or Substantive?** New Zealand treats consent as formal (did you agree?). Sweden treats consent as substantive (could you really say no given your economic options?).

  #### 3. Swapping the Governing Views
  If we swap the philosophical foundations, the statutes collapse or require radical alteration:

  *   **Scenario A: Sweden adopts New Zealand's view of Consent.**
      *   *Change:* If Sweden accepts that sellers are autonomous workers whose consent is valid, the asymmetry of the Nordic model becomes unjustifiable. Punishing the buyer becomes a violation of the worker's right to sell their services.
      *   *Result:* The law must shift to Decriminalization (NZ model).

  *   **Scenario B: New Zealand adopts Sweden's view of Harm.**
      *   *Change:* If NZ accepts that buying sex is intrinsically exploitative (regardless of consent), they can no longer treat it as ordinary labor law. Ordinary labor law protects the contract; this view requires abolishing the contract.
      *   *Result:* The law must shift to the Nordic Model.

  *   **Scenario C: Germany adopts New Zealand's view of Agency.**
      *   *Change:* If Germany accepts sex workers are fully autonomous agents not requiring special health surveillance, mandatory testing and licensing become violations of bodily autonomy and labor rights.
      *   *Result:* The law must shift from Legalization (licensing) to Decriminalization (removal of specific regulations).

  *   **Scenario D: Germany adopts Sweden's view of Intrinsic Wrong.**
      *   *Change:* If the trade is intrinsically wrong, the state cannot license it. You cannot issue a permit for a rights violation.
      *   *Result:* The regime becomes incoherent. It must either ban it fully or decriminalize it.

  ### Summary
  The dispute is primarily **conceptual**, disguised as empirical. The empirical claims (does trafficking go up or down?) are used to defend the conceptual stance (is this work or violence?).
  *   The **Nordic Model** is philosophically rigid: it requires a specific view of asymmetric harm. It cannot easily absorb a view of sex work as autonomous labor.
  *   The **Regulatory Model** is philosophically pragmatic but unstable: it tries to straddle the line between "legitimate work" and "social risk," often satisfying neither advocates of autonomy nor advocates of abolition.
  *   The **Decriminalization Model** is philosophically consistent regarding liberty and labor, but vulnerable to the empirical claim that the market is inherently coercive. If the "inherent coercion" theory is proven true, decriminalization becomes negligence.

  Ultimately, the law cannot be neutral here. Every statute encodes a theory of what sex is, what money is, and what a woman's body represents in the public sphere.
