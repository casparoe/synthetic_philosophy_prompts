answer: |-
  Here is a complete run-sheet for your night. It is designed to be low-friction, high-engagement, and philosophically precise. It strips away the economic excuses so only the *pure time preference* remains.

  # Activity Name: The Magic Bank Experiment

  **Goal:** Elicit each person's "Pure Time Discount Rate" and compare it to their "Spatial Discount Rate."
  **Time:** 90 Minutes total.
  **Materials:**
  *   12 Index cards (cut in half to make 24 small slips).
  *   12 Pens.
  *   $100 in small cash bills (for immediate payouts).
  *   A visible timer (phone projected or just on the table).
  *   A "Magic Bank" Prop (a locked box or just a specific envelope).

  ---

  ## Part 1: The Setup (10 Minutes)

  **The Hook:**
  Walk in and put the $100 cash on the table.
  *"Tonight, we are testing a bug in human reasoning. Economists say it's rational to prefer money now over money later. Philosophers say that if you take that logic seriously, the year 2200 is worth zero. We're going to find out which one of you is secretly betting against the future."*

  **The Rules of the Magic Bank:**
  You must establish the constraints *before* they make choices. Read this verbatim or print it on the board:
  1.  **Solvency:** The Host (you) is the Magic Bank. You guarantee payment. Assume you cannot go bankrupt.
  2.  **Survival:** Assume all players survive to collect. No "I might die" excuses.
  3.  **No Investment:** This is game currency. You cannot invest the "Now" money to beat the "Later" offer.
  4.  **No Inflation:** The dollar value is fixed to real purchasing power.

  **The Stakes:**
  To make it real, you will actually pay **one** person's choice from each round at the end of the night (drawn from a hat). This keeps the budget low but the tension high.
  *"I'm not bluffing. At the end of the night, I will draw two names. One person gets their 'Time' payout. One person gets their 'Space' payout. If you chose 'Now', you get cash in your hand. If you chose 'Later', I Venmo you on the date specified."*

  ---

  ## Part 2: Round 1 — The Time Auction (20 Minutes)

  **Handout:** Give everyone a **Blue Slip**.
  **The Prompt:**
  *"I am offering you $100. You have two options:*
  *   *Option A: $100 Cash, right now.*
  *   *Option B: A Promise of $X, exactly one year from today.*
  *   *I want you to tell me the **minimum** $X that would make you indifferent. If I offer $101, do you wait? $150? $1000?*
  *   *Write down the number where you stop caring which one you pick."*

  **The Engineering:**
  While they write, walk around and shut down excuses verbally.
  *   *Player:* "What if you forget?"
  *   *You:* "Magic Bank. I have a calendar reminder set in front of you."
  *   *Player:* "I could invest the $100."
  *   *You:* "Rule 3. This is game money. It burns if you try to invest it."
  *   *Player:* "I might need a drink now."
  *   *You:* "Imagine this is for rent, not beer. Basic needs are covered."

  **Collect the slips.**

  ---

  ## Part 3: Round 2 — The Space Auction (20 Minutes)

  **Handout:** Give everyone a **Red Slip**.
  **The Prompt:**
  *"Same $100 base. But now we vary distance, not time.*
  *   *Option A: $100 Cash, handed to you at this table.*
  *   *Option B: $100 Cash, mailed to your home address (or a city 500 miles away).*
  *   *Wait time is the same (Now). Recipient is the same (You). Only physical distance changes.*
  *   *How much extra money do you need to accept the Mailed/Distance option? Write the minimum $X."*

  *(Note: This tests if they discount value based on physical separation. Most won't. This creates the contrast for the debrief.)*

  **Collect the slips.**

  ---

  ## Part 4: The Calculation (15 Minutes)

  **Do not use a spreadsheet.** Do this live on a napkin or whiteboard.

  1.  **Pick a volunteer** to read the numbers out loud (anonymized if they prefer, but engineers usually love data).
  2.  **Calculate the "Time Discount Rate":**
      *   Formula: `(Future Amount - 100) / 100 = Discount %`
      *   *Example:* If Dave wrote $130, his rate is 30%.
      *   *Example:* If Sarah wrote $100, her rate is 0% (She is a "Time Neutral" saint).
  3.  **Calculate the "Space Discount Rate":**
      *   Same formula.
      *   *Observation:* Most people will write $100 or $105 (postage). Their spatial discount is near zero.

  **The Visual:**
  Draw a line on the board.
  Left side: **0% Discount** (Future/Distance = Now/Here).
  Right side: **100% Discount** (Future/Distance = Worthless).
  Ask everyone to place their beer coaster on the line where they think they sit.
  *It will cluster heavily on the Right for Time, and the Left for Space.*

  ---

  ## Part 5: The Debrief (25 Minutes)

  This is where you land the plane. Guide the conversation through these three stages.

  **Stage 1: The Excuse Autopsy**
  Ask: *"Why did you demand more money for the Time option, but not the Space option?"*
  List their answers on the board, then cross them out based on the game rules.
  *   *"Risk you won't pay."* -> **Cross out:** Magic Bank rules.
  *   *"Inflation."* -> **Cross out:** Real value guaranteed.
  *   *"Investment opportunity."* -> **Cross out:** Game currency rules.
  *   *"I might die."* -> **Cross out:** Survival assumption.
  *   *"I'm hungrier now than later."* -> **Cross out:** Basic needs covered.

  **The Punchline:** *"If you cross out all those, what's left? The only variable left is the calendar. You are literally valuing a moment less because of its position in time."*

  **Stage 2: The Year 2200 Problem**
  Take the highest discount rate from the room (say, 30% per year).
  *"Dave, you discounted 1 year by 30%. If we apply that consistently:*
  *   *10 years from now, $100 is worth $7 to you.*
  *   *50 years from now, $100 is worth 20 cents.*
  *   *100 years from now (Year 2124), $100 is worth less than a penny.*
  *   *So, to Dave, a crisis happening in 2124 is mathematically invisible. It doesn't matter if it kills everyone, because the 'cost' is discounted to zero."*

  **Stage 3: The Space/Time Analogy**
  *"In the Space round, almost no one discounted. You didn't say, 'I care less about money if it's in London.' We think spatial distance is morally irrelevant. Why is temporal distance relevant? If you don't discount space, why discount time?"*

  ---

  ## What Will Definitely Go Wrong (And How to Handle It)

  **1. The "Trust" Derailment**
  *   **The Objection:** *"I don't care about the rules, I don't trust you to Venmo me in a year."*
  *   **The Fix:** Acknowledge it immediately. *"In the real world, you are right. That is 'Risk Discounting.' But tonight, I want you to imagine a world where Trust is perfect. In that perfect world, would you still prefer Now? If yes, then it's Pure Time Preference."*
  *   **Why:** If you fight them, you lose the room. If you validate them but ask them to suspend disbelief, they stay engaged.

  **2. The "Liquidity" Derailment**
  *   **The Objection:** *"I need cash for the bar tab tonight."*
  *   **The Fix:** *"Okay, imagine this isn't for beer. Imagine this is for a bill you pay next year vs. a bill you pay today. Both are covered. Does the preference remain?"*

  **3. The "Zero Discounters"**
  *   **The Problem:** One engineer will say, *"I wrote $100. Time is money, but I'm patient."*
  *   **The Fix:** Use them. *"This is the 'Time Neutral' position. If everyone was like Alex, climate change would be solved. Alex treats 2050 exactly like 2024. Why are the rest of us not Alex?"*

  **4. The Game Can't Show: "Changing Selves"**
  *   **The Limitation:** The game assumes "You in 1 year" is the same as "You now."
  *   **The Truth:** You might be a different person. You might not care about your future self.
  *   **The Reveal:** Save this for the very end. *"One excuse we didn't rule out: Maybe you don't like the guy you'll be in 5 years. Maybe you're discounting the future because you think Future-You doesn't deserve it. That's not time discounting; that's self-loathing."* (This usually gets a big laugh and a deep silence).

  ---

  ## Print/Handout Content

  **Front of Card:**
  > **THE MAGIC BANK**
  > **Rule 1:** Host is Solvent. (Payment Guaranteed)
  > **Rule 2:** You Survive. (No Mortality Risk)
  > **Rule 3:** No External Investing. (Game Money Only)
  >
  > **ROUND 1 (TIME):**
  > I will give you $100 **NOW**.
  > OR
  > I will give you $______ **IN 1 YEAR**.
  > *(Write the amount where you don't care which you pick)*
  >
  > **ROUND 2 (SPACE):**
  > I will give you $100 **HERE** (At this table).
  > OR
  > I will give you $______ **THERE** (Mailed to your home).
  > *(Write the amount where you don't care which you pick)*

  **Back of Card:**
  > **YOUR MATH:**
  > (Future Amount - 100) = Your Discount %
  >
  > **THE QUESTION:**
  > If you discount 1 year by 20%...
  > Do you discount 100 years by 100%?
  > Is the year 2124 worth $0 to you?

  ---

  ## Host Cheat Sheet (Keep in your pocket)

  *   **If they argue about inflation:** "Imagine the $100 buys a specific basket of goods (like 10 beers). You get 10 beers now or X beers later."
  *   **If they say "I'm impulsive":** "Impulsivity is just another word for high time discounting. We're measuring it, not judging it."
  *   **If the energy dips:** Pay out the "Now" winners immediately. Cash rustling wakes people up.
  *   **The Closing Thought:** "We treat time like a tax on value. We treat space like... nothing. Tonight, decide if that tax is real, or if we're just bad at imagining the future."
