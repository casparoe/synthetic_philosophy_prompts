answer: |-
  The Mytilenean Debate, recorded by Thucydides (Book 3, 36–50), offers a stark historical stress-test for philosophical theories of collective intentionality. In 427 BCE, the Athenian *ekklesia* (assembly), enraged by a revolt, voted to execute all adult Mytilenean men and enslave the women and children. A trireme was dispatched immediately. Overnight, a sense of revulsion (*metabolē*) set in. A second assembly was convened; after debate between Cleon and Diodotus, the assembly reversed its decision. A second trireme, rowed hard against time, overtook the first just as the executioner was about to act.

  This episode raises a diachronic problem for group agency: How can a collective intend $X$ at $t_1$ and intend $\text{not-}X$ at $t_2$ without implying that the first intention was defective, or that the agent at $t_2$ is distinct from the agent at $t_1$? Below, I map this episode onto three dominant theoretical frameworks: Reductionism, Joint Commitment, and Primitive We-Intention.

  ***

  ### 1. The Reductionist Account (e.g., Bratman, Tuomela)

  **The Theory:** On a reductionist account, a shared intention is not a distinct mental state but an interlocking web of individual intentions. For "We intend to $J$," it must be the case that I intend that we $J$, you intend that we $J$, and this is common knowledge between us. The "subject" is not a group entity but the aggregate of individuals satisfying these conditions.

  **Mapping the Episode:**
  *   **The Intending Subject:** The subject is the set of individual citizens present in the *pnyx* whose individual intentions interlock to support the decree. "Athens" is a shorthand for this specific aggregation of individuals.
  *   **The First Intention:** At the first vote, a sufficient majority of individuals held the intention: "I intend that we (the Athenians) execute the Mytileneans," conditioned on the belief that others shared this intention.
  *   **The Reversal:** The reversal is evidence neither of fiction nor of a change in agent. It is simply a change in the aggregate. At $t_2$, the interlocking intentions shifted. The individuals (or a different subset of individuals comprising the assembly) now interlocked around "I intend that we spare the Mytileneans."

  **Pressing the Theory:**
  *   **Explained:** Reductionism handles the *change* of mind effortlessly. Since the group is nothing over and above the individuals, if the individuals change their minds, the group has changed its mind. It explains the volatility of the *ekklesia*, which Thucydides attributes to passion (*orgē*) shifting to reflection.
  *   **Silent/Anomaly:** Reductionism struggles with the **normative force** of the first decree. If the intention is merely an aggregation of current mental states, why was the first ship dispatched with such urgency? Why did the *prytaneis* (executive officers) treat the first vote as binding enough to launch a lethal mission before the ink was dry? Reductionism explains the *psychology* of the voters but falls silent on the *authority* of the decision as an institutional act that persists even if individual minds waver.
  *   **Verdict:** For the reductionist, the episode is a **confirmation** of the fluidity of shared intention, but it highlights an **anomaly** regarding institutional stability. It suggests that in political contexts, shared intention relies on procedural structures (voting counts) that outlast the fleeting interlocking intentions of the voters.

  ### 2. The Joint Commitment Account (e.g., Margaret Gilbert)

  **The Theory:** This account treats collective intention as a "joint commitment." Parties express willingness to enter a commitment to emulate a single body. This creates a "plural subject." Crucially, this commitment generates obligations *between* the parties to uphold the intention. One cannot rescind the intention unilaterally; it requires a joint rescission.

  **Mapping the Episode:**
  *   **The Intending Subject:** The subject is the "Plural Subject" constituted by the assemblymen through the voting procedure. This is distinct from the sum of the individuals; it is a new entity created by their mutual commitment to act as one.
  *   **The First Intention:** The assembly formed a joint commitment to punish Mytilene. This bound the citizens to one another to support the execution. The urgency of the first ship reflects the obligations generated by this commitment.
  *   **The Reversal:** The reversal is not a mere change of mind but a **joint rescission**. The second assembly (constituting the same or a sufficiently overlapping plural subject) jointly committed to rescind the prior commitment.

  **Pressing the Theory:**
  *   **Explained:** This theory best explains the **binding nature** of the first vote. It accounts for why the first decree was treated as an actionable mandate rather than a survey of opinion. It explains why a formal second vote was required to stop the killing; a private change of heart by individual Athenians would not suffice to dissolve the joint commitment.
  *   **Silent/Anomaly:** The theory faces pressure regarding the **temporal stability** of the plural subject. Gilbert emphasizes that joint commitments are robust. The Mytilenean case shows a plural subject dissolving or radically altering its commitment within 24 hours. Is the "Assembly of Day 2" the same plural subject as "Assembly of Day 1"? If the membership differed (as it likely did in Athens), Gilbert's theory requires an account of how the plural subject persists through membership change.
  *   **Verdict:** The episode is a **confirmation** of the need for a normative account (obligations explain the urgency), but it presents a **challenge** regarding the durability of the plural subject. It suggests that in direct democracies, the "plural subject" is highly fragile, reconstituted daily, which weakens the claim that joint commitment creates a stable agent over time.

  ### 3. The Primitive We-Intention Account (e.g., John Searle)

  **The Theory:** Searle argues that "we-intentions" are biologically primitive mental states in the heads of individuals. They are not reducible to "I-intentions," nor do they require a metaphysical group agent. "We intend to $J$" is a sui generis psychological mode.

  **Mapping the Episode:**
  *   **The Intending Subject:** The subject is the individual citizen, but the *content* of their intention is collective. Each citizen thinks, "We (Athens) intend to execute."
  *   **The First Intention:** A majority of citizens possessed the primitive we-intention with the content "punish Mytilene."
  *   **The Reversal:** The citizens underwent a shift in their primitive we-intentions. The content changed to "spare Mytilene."

  **Pressing the Theory:**
  *   **Explained:** This account explains the **phenomenology** of the debate. Thucydides describes the emotional swing of the *demos*. Searle's account captures how individuals can feel they are acting as a collective without needing to posit a metaphysical "group mind." It accommodates the speed of the reversal: biological states can change quickly when new information (Diodotus's arguments) is processed.
  *   **Silent/Anomaly:** The theory falls silent on the **institutional mechanics**. Searle's account of collective intentionality is often criticized for under-specifying the role of status functions (votes, decrees, ships). A primitive we-intention does not automatically launch a trireme; institutional rules do. The theory struggles to explain why the *first* we-intention had the power to command state violence while the *second* had the power to halt it, other than saying "the majority changed." It treats the political procedure as background rather than constitutive of the intention.
  *   **Verdict:** The episode is an **unanticipated case** for strict primitivism. Searle focuses on the capacity for cooperation (e.g., pushing a car together). The Mytilenean debate involves *representational* collective intentionality mediated by complex institutions. The reversal shows that we-intentions in politics are dependent on procedural validity, not just psychological presence.

  ***

  ### Comparative Analysis: Settled vs. Contested Claims

  In analyzing this episode, it is vital to distinguish between consensus and contention within the philosophy of social ontology.

  **Settled Claims:**
  1.  **Group Agency is Real (in some sense):** There is broad consensus that groups can act in ways that cannot be fully described by describing individuals in isolation (List & Pettit, 2011). All three theories above accept that "Athens" can be an object of analysis, even if they disagree on its metaphysics.
  2.  **The Mytilenean Case is Diachronically Problematic:** It is settled that rapid reversal challenges theories of group agency that rely on stability or consistency (e.g., rational agent models).

  **Genuinely Contested Claims:**
  1.  **The Ontology of the Subject:** It is **contested** whether the "subject" of the first vote was a plural subject (Gilbert), an aggregate (Reductionists), or a distribution of primitive states (Searle). There is no consensus on whether the group is a real entity or a fiction.
      *   *Implication for Mytilene:* If the group is a fiction (Reductionism), the reversal is trivial. If the group is a real plural subject (Gilbert), the reversal is a significant metaphysical event (rescission).
  2.  **The Role of Normativity:** It is **contested** whether collective intention inherently creates obligations (Gilbert) or is merely a coordination mechanism (Bratman/Reductionism).
      *   *Implication for Mytilene:* The urgency of the first ship supports Gilbert (obligation), but the ease of reversal supports Reductionism (no deep binding).
  3.  **Reducibility:** It is **contested** whether we-intentions are irreducible (Searle) or analyzable into I-intentions (Bratman).
      *   *Implication for Mytilene:* If irreducible, the shift represents a fundamental change in the cognitive stance of the citizens. If reducible, it is merely a shift in individual preferences.

  ### Conclusion: What the Episode Shows

  The Mytilenean Debate acts as a filter for these theories.

  *   **Against Reductionism:** The episode suggests that reductionism is insufficient for **political agency**. While it explains the vote count, it cannot explain why the first vote commanded immediate lethal action while a mere aggregation of opposing individual thoughts the next day could halt it. The *institutional status* of the intention mattered more than the psychological interlocking.
  *   **Against Joint Commitment:** The episode suggests that joint commitment theories may overstate the **stability** of the plural subject. If a plural subject can be constituted and rescinded within 24 hours, the "obligation" generated is remarkably thin. The theory must accommodate the possibility that in direct democracies, the plural subject is ephemeral.
  *   **Against Primitivism:** The episode suggests that primitive we-intentions are **institutionally dependent**. The "We" that intended execution and the "We" that intended mercy were not just psychological states but were constituted by the rules of the *ekklesia*. Without the procedural context, the we-intention is powerless.

  Ultimately, the Mytilenean Debate confirms that **procedural constitution** is a necessary supplement to any theory of collective intentionality in political contexts. None of the three theories fully anticipates the role of the *vote* itself as the mechanism that solidifies a fleeting collective intention into a binding agentive act. The reversal does not prove the first intention was a fiction; rather, it proves that in democratic systems, the "collective agent" is a discontinuous entity, re-authorized at every procedural interval. The intending subject at $t_1$ and $t_2$ is the *institution* of the Assembly, which persists even if the specific collective intention does not. This leans toward a hybrid view: the group is a real agent (contra strict reductionism), but its intentions are bound by procedural validity (a nuance often underdeveloped in pure Gilbertian or Searlean accounts).
