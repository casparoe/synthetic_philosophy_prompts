  Last night my roommate and I got into this long arguement about AI that went until like 2am, and I genuinely don't know who won. He's been reading a pile of alignment stuff and he's now convinced that any AI that tries to rewrite or improve itself is doomed from the start, because of something called Löb's theorem. His version of it goes: Gödel showed that a consistent system can't prove its own consistency, and Löb's theorem is the nastier cousin of that — it says that if a formal system strong enough to do arithmetic could establish something like whenever it proves a statement, that statement is actually true, then it would end up proving everything, contradictions included. So the general reflection principle, the rule that says my own proofs are trustworthy, is off the table. From there he concludes that no agent can ever be justified in trusting its own reasoning, so a self-improving AI — one that has to reason about what its own future self will conclude and do — is mathematically impossible. Not hard, impossible. And all the research on safe self-modification is just people refusing to accept a proven result. I did two years of logic-adjacent CS, so I nodded along because each step sounded plausible, but the conclusion feels way too strong for a theorem about formal systems. He also had this analogy I can't shake: it's like a company whose audit department audits itself, or a dictionary that can only be checked against words in the same dictionary — you have to step outside the system to certify it, and an AI can't step outside itself, so it's stuck.

  So what I want to know is this. Is he right that self-improving AI is mathematically impossible? And if he is, why does anyone still treat safe self-modification as an open engineering problem instead of a settled impossibility result? Please break it down for me in this order, with these headings:

  - What the theorem actually says (150-250 words): plain English, but be precise about what kind of system it applies to and exactly what it rules out.
  - Where the argument slips (350-450 words): walk through the step from the theorem to the claim that no self-improving AI is possible and tell me which link breaks, if any. I'd much rather hear that the theorem is true and the leap is bad than get a watered-down version of the theorem that makes the leap look fine.
  - What's actually blocked and what isn't (300-400 words): what a self-modifying agent can still do, what specific kind of self-trust is really off the table, at least one concrete strategy people use to get around it, and whether the audit/dictionary analogy is any good or just sounds good.
  - Verdict (under 150 words): did my roommate win the argument, and what should I say back to him at breakfast?

  Don't tell me to go read papers — I won't, that's kind of the whole problem. Write it in American English, and no unexplained jargon.
