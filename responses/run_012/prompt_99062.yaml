prompt: |-
  Im a philosophy professor and I teach a seminar that keeps drifting into myth-and-history territory, and I need help with something that keeps happening. My colleague in classics says "every legend has a kernel of truth" like it's a settled law of nature. Last week it was the Trojan War — fine, something burned at Hisarlik, sure — but then he used the exact same line about Arthur, and later, over drinks, about the Exodus, and in each case the sentence was doing real argumentative work: it was supposed to make me treat the story as evidence, or at least stop me treating it as pure invention. I don't think he's simply wrong. I think that one sentence is doing about six different jobs and I can't tell which one he actually bought.

  So lay out for me the distinct precise claims "every legend has a kernel of truth" could be making. I want a menu, not a verdict. Things I'm already suspicious about: what exactly is the kernel — a person? an event? a place? a practice? a mood? And does "has a kernel" mean "originated in", "reliably tracks", or "is best explained by"? Which readings are tautologies that any surviving story trivially satisfies, which are empirical claims with a genuine base-rate question hanging off them (what's the prior that a legend with no historical referent survives vs. one with?), which are just false, and which one is what people actually mean when they use it to shut a sceptic up?

  Then tell me which of those readings, if true, would actually get him his conclusion that we should treat the legend as historical evidence — because my hunch is that none of them do without a further step he isn't making explicit. And flag every place the word "truth" is doing something sneaky, since I think that's where the trick lives. Also, for the Exodus and Arthur cases specifically, I want the distinction between a legend being evidence of a real event and being evidence of the people who told it — I suspect he collapses those constantly.

  Numbered list please, something I can bring to his office hours.
