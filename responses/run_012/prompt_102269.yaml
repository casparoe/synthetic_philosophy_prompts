  I'm putting together the final for my grad seminar on logical empiricism and the politics of science and I need one essay question that a student can't ace by just summarizing the principle of tolerance. Here's the stuff they already have, so you can lean on it (and please don't put any citations, reading lists or "see also"s in the answer — no bibliographies allowed on this exam): Carnap's tolerance idea, that choosing a language or framework is a practical decision judged by how well it serves our purposes, not a claim experience could confirm or refute; his later picture of philosophy as engineering or architecture, designing concepts rather than discovering facts; the left wing of the Vienna Circle and Neurath's enthusiasm for planning and unified science; and the fact that Carnap himself held socialist and pacifist convictions and wrote for left-wing papers before he left Europe.

  The question I want: does the tolerance idea actually carry over from the choice of a logical framework to the choice of a social or economic order — is adopting a planned economy just another framework choice, made on practical grounds? And if it carries over, does it end up supporting planning or quietly undercutting it? I want them to have to say exactly where the analogy holds and where it snaps, and to notice that Carnap's practical/theoretical split was a split about logic, not about how to run a society. I suspect the fun move is that pluralism-about-frameworks and one-coordinated-order don't obviously sit together, but don't give that away in the question itself.

  Please write me:
  1. The question — the exam question itself, ~100 words, in the register it'd actually appear in on the paper.
  2. Model answer — ~700 words.
  3. Marking scheme — out of 20, split into "Must-hit moves" (16 marks; name each move and the marks it's worth) and "What costs marks" (4 marks; name each specific mistake and what it loses).

  Make the model answer take a clear stand on whether Carnap's practical decision is the same kind of thing as a political decision — thats the crux and I want the marking scheme to reward it explicitly.
