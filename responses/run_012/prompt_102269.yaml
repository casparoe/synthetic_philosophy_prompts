answer: |-
  1. The Question

  Carnap's Principle of Tolerance asserts that choosing a logical framework is a practical decision based on utility, not a theoretical claim about reality. Neurath and the left Vienna Circle similarly advocated for unified science and social planning, a cause Carnap supported personally. Evaluate whether the logic of Tolerance extends to the choice of an economic order. Is adopting a planned economy analogous to adopting a linguistic framework? Argue specifically whether this analogy strengthens planning as a practical engineering task or undermines it by rendering social order merely optional. You must identify where the comparison holds and where it breaks down.

  2. Model Answer

  Carnap's Principle of Tolerance dictates that the choice between logical frameworks is not determined by truth or experience, but by practical expediency. There is no "correct" logic, only useful ones. Neurath and the left Vienna Circle sought to apply this scientific rigor to society, advocating for a planned economy as part of a unified science. The central question is whether the epistemological status of a logical framework matches that of an economic system. While both choices share an anti-metaphysical structure, extending tolerance directly from logic to politics ultimately undermines the political project of planning.

  The analogy holds initially because both decisions reject metaphysical necessity. Just as Carnap argues there is no "true" logic inherent in the world, the socialist planner argues there is no "natural" economy inherent in human relations. Both the logician and the planner view their structures as artifacts designed to serve human purposes. For Carnap, philosophy is engineering; for Neurath, society is also a construction project. In this sense, choosing socialism is indeed a practical decision, not a discovery of historical inevitability. This alignment empowers the planner to treat economic rules as tools that can be revised based on efficacy rather than dogma. It liberates politics from claims of natural law, positioning social organization as a technical problem soluble through rational design. This aligns with the Unity of Science movement, which sought to integrate social and natural sciences into a single physicalist language to enable collective problem-solving.

  However, the analogy snaps when considering the goal of the respective systems. Logical tolerance encourages pluralism; multiple frameworks can coexist because they serve different theoretical purposes without contradicting one another. A physicist might use one calculus for quantum mechanics and another for relativity, and tolerance permits this flexibility. Social planning, conversely, requires unity. A planned economy cannot function if different regions or groups operate under incompatible economic frameworks simultaneously. The goal of unified science was to coordinate action, not to allow disparate groups to inhabit incommensurable social realities. Therefore, while the *justification* for the choice is practical in both cases, the *outcome* of the choice differs fundamentally. Logic tolerates multiplicity; politics demands coordination.

  Consequently, extending tolerance without modification risks relativizing the socialist project. If the choice of economic system is merely a framework choice judged by convenience, why must everyone adopt the same one? If frameworks are optional, then a planned economy becomes just one option among many, lacking the imperative force required for collective action. Carnap's split between theoretical and practical was designed to protect science from metaphysics, not to prescribe how society must be run. By treating social order as purely optional, the logic of tolerance could inadvertently validate the status quo as merely another "useful" framework for those it benefits.

  Thus, the practical decision in logic is not the same kind of thing as the political decision in planning. They share an epistemological lineage—both are constructive and anti-metaphysical—but they diverge in their operational requirements. To support planning, Carnap's pragmatism must be supplemented with a demand for social unity that logic does not require. The engineer of concepts can afford tolerance; the engineer of society cannot. Recognizing this distinction prevents the dilution of political commitment into mere methodological preference. The strength of the Vienna Circle's political vision lay not in making economics optional, but in treating it as a urgent practical task that required a single, coordinated solution.

  3. Marking Scheme

  **Must-hit moves (16 marks)**

  *   **Correctly characterizing the Principle of Tolerance (4 marks):** The student must define tolerance as a distinction between practical utility and theoretical truth regarding logical frameworks, avoiding any claim that it determines factual reality.
  *   **Identifying the structural similarity (4 marks):** The student must explain how both logical frameworks and economic systems are treated as human constructions rather than metaphysical necessities (the "engineering" analogy).
  *   **Identifying the functional disanalogy (4 marks):** The student must articulate the tension between logical pluralism (multiple frameworks can coexist) and political unity (planning requires coordinated, singular action).
  *   **Taking a clear stand (4 marks):** The student must explicitly argue whether the extension supports or undercuts planning. (Full marks require acknowledging that while it supports the *method*, it risks undercutting the *imperative* unless modified).

  **What costs marks (4 marks)**

  *   **Treating tolerance as moral relativism (2 marks):** Deduct if the student conflates Carnap's methodological tolerance with a general moral "anything goes" attitude unrelated to linguistic frameworks.
  *   **Ignoring the undercutting risk (2 marks):** Deduct if the student argues the analogy holds perfectly without addressing how optionality weakens the necessity of a unified planned economy.
