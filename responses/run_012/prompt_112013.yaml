      *   *Correction:* I need to frame the AI "Reward" not as the Homeostatic "Setpoint," but as the *Feedback Signal* indicating success. If the system acts to maximize the feedback signal rather than the underlying variable, that's the corruption.
      *   *Better Mapping:*
          *   AI Objective -> Homeostatic Setpoint (Reference).
          *   AI Reward Signal -> Homeostatic Sensor Output (Perceived State).
          *   Wireheading -> Sensor Decoupling / Signal Injection.
          *   Real World Success -> Actual State of Regulated Variable.

  5.  **Drafting the Translation (Iterative Refinement):**
