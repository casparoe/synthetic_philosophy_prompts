answer: |-
  Good evening. Welcome to the museum.

  Looking around this room, I see the three groups who make this institution possible. I see the civic donors and business leaders whose support keeps the lights on. I see the teachers, families, and volunteers whose labor keeps the doors open. And I see a small contingent from the university, here to ensure I do not embarrass us in front of the eighteenth century.

  To that last group especially: I know you are listening for Adam Smith.

  It is tempting, when opening a gallery about merchant wealth in a port city, to reach for the most famous line in *The Wealth of Nations*. We all know the phrase: a "nation of shopkeepers." It is usually used to suggest that we are a practical people, defined by trade and profit. It is often used to justify the empire that made this town rich.

  But if we are to understand the history of the families who built the streets outside these walls, we have to correct the record. Smith did not say that building an empire was a project fit for a nation of shopkeepers. He argued the opposite. He wrote that raising up a people of customers through conquest might look like a project fit for such a nation, but is "really a project unfit for one." It is, he said, "extremely fit for a nation whose government is influenced by shopkeepers."

  That distinction is the spine of this new gallery.

  It is the difference between commerce and monopoly. Smith was not opposed to trade. He acknowledged that the general gains from Atlantic commerce were real. They flowed into ports like ours. They paid for the brick, the timber, and the glass that define our historic district. The trade made this city. To say otherwise would be a lie.

  But Smith drew a sharp line between the wealth generated by open exchange and the wealth generated by political privilege. He argued that the particular gains to the colonizing country came through a monopoly that concentrated the benefit in a few hands while sticking the public with the bill.

  The merchants whose names are on the plaques outside were not villains in a melodrama. They were participants in a system that functioned exactly as designed. They captured the benefit of the market. But the cost of securing that market—the navies, the forts, the wars—was paid by the public treasury. Smith's accounting was cold on this point: the expense of empire functioned as a bounty paid to support the monopoly. Whatever inconveniencies came with the colonies, the mother country engrossed the costs completely, while the profit remained private.

  So, when we look at the architecture funded by these merchant families, we are looking at something real. The stone is real. The profit was real. But the justification for the system that generated it relied on something far more abstract.

  Smith described the colonies as "a sort of splendid and showy equipage of the empire." They were decoration. And he noted that the rulers of Great Britain amused the people with the imagination that they possessed a great empire on the west side of the Atlantic, an empire that "existed in imagination only."

  He did not mean the ships weren't real. He meant the value was a bookkeeping illusion. The empire was an asset on a ledger that did not balance.

  This gallery asks you to hold two truths at once. The first is that the general commerce of the Atlantic brought genuine development to this port. The second is that the specific wealth of the merchant elite was subsidized by a public debt they did not have to repay.

  Smith was not a modern anti-imperialist. He believed America should contribute to the public debt run up defending it. He floated the idea of admitting the colonies to representation. He was an accountant, not a revolutionary. He wanted the ledger to balance.

  In this room, we have the ledger. We have the bills of lading, the insurance policies, the letters of marque. And outside, we have the buildings.

  The gallery does not offer a verdict. It offers an inventory. It shows you the "splendid and showy equipage" that these families purchased with the profits of the monopoly. It shows you the houses that remain while the empire they served has vanished.

  The university scholars in the back will tell you that the "imagination" Smith spoke of was a specific economic delusion. But standing on the street corner, looking at the customs house, it is hard to call it imaginary. It is stone. It is mortar. It is here.

  The profit was private. The debt was public. The empire was in the imagination. The city is what remains.

  We have opened the cases. The artifacts are under the glass. The question of who actually paid for them is not inside the display. It is out there, in the streets, in the debt we still carry, and in the names above the doors.

  Thank you.
