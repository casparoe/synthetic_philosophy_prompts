  Your conservation law analogy is apt; deontologists view constraints as structural limits on action, not optimization parameters. The "paradox" arises only if one assumes an agent-neutral standpoint (the view from nowhere) where only states of affairs matter. My credence that a defensible, non-paradoxical rationale exists is **0.78**.

  **Decomposition**

  1.  **Impersonal Standpoint (Credence: 0.88):** The paradox dissolves if we reject the *impersonal standpoint* (the assumption that morality requires maximizing agent-neutral value) as incoherent for embodied agents.
