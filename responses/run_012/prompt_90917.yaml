prompt: |-
  My old roommate and I have been going at this for like two years and we've finally decided to stop rehashing it in the kitchen and actually write something together. He's a Malcolm person — read Dreaming in a Wittgenstein seminar and came out convinced that dreams aren't experiences at all, that the picture of some inner show playing during sleep is a philosopher's confusion, and that the concept of a dream is anchored to the waking report and the narrative you give, so asking whether the images were really occurring while you were asleep is a kind of category mistake. I'm more on Dennett's side — dreams are experiences, but the reports we give on waking are massively confabulated, so the report isn't a faithful record of what was experienced; the experience happened, we just reconstruct it badly afterward (the cassette picture is one way of cashing that out, though I'm not wedded to it). We keep talking past each other, and half the time I think we're using the word experience in two different senses and the other half I think there's a real disagreement hiding under there. So I want the document we should've written a year ago.

  Draft the joint statement of an adversarial collaboration between the Malcolm camp and the Dennett camp on whether dreams are experiences. I want a numbered section of agreed claims both sides can actually sign — about what the ordinary concept of dreaming is doing, about what dream reports are and aren't evidence for, about the confabulation data, about what a sleep lab can and can't settle — and then a disagreements table. For each remaining disagreement, give the question at issue, a formulation of the Malcolm-side position in wording a Malcolm person would accept, a formulation of the Dennett-side position in wording a Dennett person would accept, the crux or sub-question that the disagreement really turns on, and then at least one case, experiment, or argument that both sides agree would bear on that crux, with each side's prediction about it written down in advance. Please don't turn it into a verdict on who's right; both of us have to be able to put our names on it. And if part of the fight turns out to be verbal — different senses of experience, or of really happening, or of during sleep — say which part and why, in wording neither of us would object to.

  Some cases I'd like you to consider using as crux-bearers, since we've argued about all of them: a sleeper who shows the usual REM markers and even signals with eye movements that they're dreaming of one thing, then on waking reports something completely different; someone who wakes up and gives a vivid, confident, detailed dream report but the recording shows they were awake the whole time and never in REM; two people with indistinguishable sleep physiology, one of whom reports a dream on waking and one of whom reports nothing; and a dream that is had, so to speak, but never remembered or reported by anyone, ever. For each, note what each camp predicts and whether either side would treat the result as counting against its own view. My roommate also keeps insisting that the whole thing is downstream of a more basic disagreement about whether first-person reports get to fix the meaning of mental terms, so if that's the real fault line, put it in the table explicitly rather than letting it hover.
