  2.  **Deconstruct the Philosophical Positions:**
      *   **Norman Malcolm (Wittgensteinian):**
          *   Core claim: "Dreaming" is not a process/experience occurring *during* sleep. It is a concept logically tied to the waking report.
          *   "I dreamt" is an avowal, not a description of a past inner event.
          *   Asking if the dream *really* happened while asleep is a category mistake.
          *   Truth conditions for "I dreamt X" are satisfied by the sincere assertion upon waking, not by correspondence to a nocturnal event.
      *   **Daniel Dennett (Quinean/Functionalist/Empiricist):**
          *   Core claim: Dreams are experiences (or quasi-experiences) that occur during sleep.
          *   Memory is constructive/confabulatory. The report is a reconstruction, often faulty.
          *   There is a fact of the matter about what happened in the brain/mind during sleep, independent of the report.
          *   "I dreamt" is a claim about a past event which can be true or false independent of the assertion.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground. Both agree sleep happens. Both agree reports happen. Both agree physiology matters (even if interpreted differently). Both agree confabulation exists (Malcolm might frame it differently, but agrees memory is fallible).
      *   *Claim 1:* Sleep physiology (REM, etc.) is real and measurable.
      *   *Claim 2:* Dream reports vary in reliability.
      *   *Claim 3:* The ordinary concept of "dreaming" involves a connection between sleep and waking narrative.
