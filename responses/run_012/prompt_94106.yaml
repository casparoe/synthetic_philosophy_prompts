  Right, put down the *Philosophical Investigations* and listen up. I've graded enough essays on Putnam to know that most people think Twin Earth is just about doppelgängers; it's actually about causal history fixing reference. Here are three ways to land that distinction:

  1.  **The Job Interview:** A Twin Earth candidate gets the job based on identical skills, but is fired on day one because his "experience" refers to events that didn't happen in this causal environment.
  2.  **The Divorce Court:** A Twin husband is denied alimony because his "wife" refers to a different woman, making him technically single in this jurisdiction.
  3.  **The Pub Order:** Two identical blokes try to buy a round, but one is refused service because the substance he's referring to doesn't exist here.

  Option three is the sharpest—it makes the semantic point physical and immediate. Here's the joke:

  Two identical blokes walk into a pub in Manchester. They sit at the bar, flash identical wallets, and the first one says, "Pint of water, please." The barman pours it, he pays, cheers.

  The second bloke—molecule-for-molecule identical to the first—slides a tenner over and says, "Same again."

  The barman pockets the cash but doesn't pour.

  "Oi," says the bloke. "I'm exactly the same as him. Same thirst, same money, same head."

  "Right," says the barman, wiping the glass. "But you're from Twin Earth. Your 'water' picks out XYZ, not H2O. If I serve you what you're *actually* asking for, it'll dissolve the glassware."

  "But I feel the same!" the bloke protests.

  "Feelings are internal," says the barman. "Meanings ain't in the head, mate. But the health and safety policy is."
