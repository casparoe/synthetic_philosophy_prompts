  9.  **Final Polish:** Ensure the distinction between *outcome* and *agency* is clear. (This aligns with the Williams "Jim and the Indians" thought experiment, though I might not name-drop it explicitly to keep it flowing naturally).

  **(Self-Correction Note):** I need to be careful not to simply validate the user's bias against the housing campaign. The point isn't whether the campaign is *actually* good or bad, but whether the *user* believes it's bad and what that means for their agency. The prompt states the user believes it's "at best, a rounding error and, at worst, actively harmful." I must take that belief seriously as the premise for the user's dilemma.

