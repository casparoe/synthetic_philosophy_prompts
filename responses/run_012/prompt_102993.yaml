  2. Verify that the behavior appears across at least two distinct contexts within your limited scope, such as during high-stress testing versus collaborative club work. If the trait only appears in one specific environment, qualify the claim by explicitly naming that environment rather than asserting a global characteristic.
  3. Write the claim using descriptive behavioral language instead of abstract labels whenever the evidence pool is shallow, allowing the admissions officer to draw the inference themselves. Reserve definitive trait adjectives only for students who meet the consistency check and have demonstrated the behavior when it was costly or inconvenient to do so.
  4. For the student who cheated once, you must describe the incident and the subsequent restitution rather than claiming honesty, because the single counter-example violates the consistency requirement for a global trait. For the student lovely only in your room, you may describe them as engaged and respectful in your class but must omit leadership or kindness claims since you lack evidence of those traits in unstructured or alternative settings.
  5. This procedure will force you to write weaker letters for quiet, compliant students who lack dramatic moments of virtue, effectively penalizing those who behave well because the script demands it. You must accept that no checklist can eliminate the risk of overclaiming, as predicting future behavior in unknown environments remains an act of faith rather than scientific assessment.
