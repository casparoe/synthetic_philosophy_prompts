  Someone in my ethics seminar said "omissions aren't causes" to shut down a discussion about a landlord who knew the heater was broken, didnt fix it, and the tenant got sick. I dont buy it, but I cant put my finger on what he was actually claiming. Can you lay out the different precise things that one-liner could mean, as a menu -- from the boring claim that not-doing isn't a positive event, to the claim that omissions can never be difference-makers, to the claim that they can't ground responsibility -- and say which readings are trivial, which are defensible, which are false, and which one would actually support his move? And if he's right on some technical reading, is he still wrong to use it to end the argument?
