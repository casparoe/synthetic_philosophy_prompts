answer: |-
  This is a classic move in philosophy seminars: the **definitional stop**. Your classmate is using a metaphysical technicality to try to bypass a normative (moral/legal) conclusion. It is frustrating because it sounds deep but often functions as a conversation-ender rather than a truth-seeker.

  Here is the menu of precise claims hidden inside the sentence "omissions aren't causes," evaluated by their truth value and their relevance to your landlord case.

  ### The Menu of Meanings

  #### 1. The Metaphysical Claim ("The Null Event")
  *   **The Claim:** "Doing nothing" is not a positive event in the physical world. There is no energy transfer, no muscle movement, and no physical change corresponding to an omission. Therefore, strictly speaking, it cannot be a physical cause.
  *   **Status:** **Trivially True.**
  *   **Analysis:** In a purely physicalist description of the universe, "not fixing the heater" is not a thing that happens; it is the absence of a thing.
  *   **Relevance to Case:** **Irrelevant.** Ethics and law are not concerned solely with particle physics. They are concerned with agents, expectations, and outcomes. If this is all your classmate means, they have changed the subject from ethics to physics.

  #### 2. The Counterfactual Claim ("The Difference Maker")
  *   **The Claim:** Omissions do not make a difference to the outcome. If the landlord had acted, the result would have been the same.
  *   **Status:** **Demonstrably False.**
  *   **Analysis:** Causation is often understood counterfactually: $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred. In your case: Had the landlord fixed the heater (the omission didn't happen), the tenant would not have gotten sick. The omission *is* a difference-maker.
  *   **Relevance to Case:** **High.** If your classmate means this, they are simply wrong about the facts of the scenario.

  #### 3. The Causal Selection Claim ("The Salience Problem")
  *   **The Claim:** Omissions are too ubiquitous to be singled out as *the* cause. Everyone in the world "didn't fix the heater." Why pick out the landlord? Therefore, omissions are not *salient* causes, even if they are background conditions.
  *   **Status:** **Defensible (in specific contexts).**
  *   **Analysis:** This comes from legal theorists like Hart and Honoré. They argue that while omissions are causally relevant, we usually only call them "causes" when there is a specific reason to highlight them (like a duty). Without a duty, the landlord's omission is no more causal than a random passerby's omission.
  *   **Relevance to Case:** **High.** This is the strongest version of your classmate's point. However, it concedes that omissions *can* be causes if there is a reason to select them (like a contract or duty).
  *   **Does it support his move?** Only if he ignores the landlord's duty. If he acknowledges the duty but still says "omissions aren't causes," he is contradicting this specific theory.

  #### 4. The Normative Claim ("The Responsibility Blocker")
  *   **The Claim:** Even if an omission leads to an outcome, you cannot be morally or legally responsible for it. Negative duties (do not kill) bind us, but positive duties (do not let die) do not.
  *   **Status:** **False (in law and most ethical frameworks).**
  *   **Analysis:** This is the conclusion your classmate *wants*, disguised as a premise about causation. Negligence law is entirely built on the idea that omissions *can* ground liability. In ethics, consequentialists and many deontologists agree that failing to prevent harm when you can is morally significant.
  *   **Relevance to Case:** **High.** This is the actual stake of the argument.
  *   **Does it support his move?** It would, if it were true. But it is widely rejected in the context of special relationships (landlord/tenant).

  ---

  ### Which reading was he actually using?

  He was likely engaging in a **motte-and-bailey maneuver**.

  *   **The Motte (Defensible):** He retreats to Claim #1 (Metaphysical) or Claim #3 (Salience). "Technically, nothing happened," or "Everyone didn't fix it, not just him." These are hard to argue against quickly.
  *   **The Bailey (Desired Conclusion):** He wants you to accept Claim #4 (Normative). "Therefore, the landlord isn't responsible."

  He is using the technical truth of Claim #1 to smuggle in the controversial conclusion of Claim #4.

  ### Is he wrong to use this to end the argument?

  **Yes.** Here is why, even if he is technically right on a narrow reading:

  **1. It commits a Category Error.**
  Ethics seminars discuss *normative* relationships, not just *physical* ones. In the context of a lease agreement, the landlord's "not fixing" is not a null event; it is a **breach of contract**. In ethics, a "cause" is often a "reason for which we hold someone accountable." By insisting on a physicalist definition of cause, he is ignoring the normative context that defines the seminar's topic.

  **2. It ignores the "Duty" distinction.**
  The Causal Selection Claim (#3) explicitly allows omissions to count as causes **when there is a duty**. The landlord-tenant relationship creates an expectation and often a legal duty. To say "omissions aren't causes" without qualifying "unless there is a duty" is to ignore the most important feature of the case. It treats the landlord like a stranger walking down the street.

  **3. It is a "Conversational Killjoy."**
  In pragmatics (the study of how language is used), we select causes based on what is abnormal or problematic. A broken heater in a rental is abnormal; a landlord not fixing it is problematic. To insist on a definition of causation that rules this out is to refuse to play the language game of moral responsibility. It's like saying, "You can't *promise* to meet me for lunch because words are just sound waves." Technically true, practically useless.

  ### How to reply

  If you want to re-open the discussion, try this:

  > "I think you're making a metaphysical point about physical events (Claim #1), but we are discussing moral responsibility. In ethics and law, we treat omissions as causes all the time **when there is a duty of care**. Since the landlord has a contractual duty to provide heat, his omission is legally and morally distinct from a random stranger's omission. Are you arguing that duties don't change the causal status of an omission, or that duties don't create responsibility?"

  This forces him to pick a card from the menu. If he picks Metaphysical, you dismiss it as irrelevant. If he picks Normative, you challenge him on the nature of negligence and duty.
