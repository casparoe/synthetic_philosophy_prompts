prompt: |-
  Hi, I'm a junior in high school and I'm doing this independent-study thing on philosophy of science, mostly because my physics teacher keeps saying Kuhn's paradigm-shift stuff is basically just what happened in physics and I wanted to check if that's true or if he's overselling it. I'm pretty solid on the physics vocab we've covered, I think: coordinate systems, changing basis, units and dimensional analysis, reference frames, small-angle approximations, and in chem we did phase transitions (latent heat, hysteresis, supercooling, that whole thing where you can push a system past the point where it should flip and it stays put for a while). So what I want is for you to take the Kuhn package -- normal science, crisis, paradigm shift, incommensurabilty, the claim that after a shift you can't fully translate the old paradigm's claims into the new one, and the "Kuhn loss" idea that problems the old paradigm had actually solved stop even being statable in the new one -- and restate it as faithfully as you can in my vocabulary. Like: is a paradigm a coordinate system? Is a shift a change of basis? Is incommensurability just that the transformation matrix is singular, i.e. not invertible? And is a scientific revolution better modelled as a phase transition (discontinuous, path-dependent, with hysteresis) than as a rotation, since you can always rotate back but you can't always un-melt ice? Please actually do the translation instead of saying "well, it's a metaphor" and moving on.

  Then here's the part I actually care about, because me and my friends got into a shouting match about it at lunch: the residue report. Which pieces go through cleanly, which ones you had to fudge or stretch to fit, and which parts of Kuhn's position have no counterpart at all in coordinate systems and phase transitions. And then the real question: is the residue there because my vocabulary is too weak to say what he's saying, or because his claim is vaguer than it sounds? The thing I'm suspicious of is whether "incommensurable" means anything stronger than "you need a dictionary and the dictionary has a few entries you can't fill in," because in physics you can always translate between frames even when the formulas get ugly, so if Kuhn says you literally can't, I want to know exactly where my analogy breaks -- and whether it breaks because physics is a special case or because Kuhn is overstating the untranslatability.

  Also, please tell me how confident you actually are in what you're claiming here, and single out the one point in your answer you're least sure about, because I'd rather see where the shaky part is than get a smooth essay that sounds right and isn't.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** High school junior, independent study in philosophy of science.
