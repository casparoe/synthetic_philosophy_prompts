          *   *Verdict:* Highly Negative. This is a corruption of understanding.

      *   *Feature 3: Designers' Claim ("Wash out" later).*
          *   *Locke:* Explicitly contradicts this. In *Essay* II.33, he argues that early associations are the hardest to remove. They form the "bias" of the mind.
          *   *Verdict:* Locke would reject this claim emphatically.

      *   *Feature 4: Personalized/Mediated Learning vs. Human Tutor.*
