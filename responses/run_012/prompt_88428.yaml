      *   *Habit:* "The well educating of their children is so much the duty and concern of parents..." Habits are formed through repetition and practice, not just rules. "Practice settles the habit."
      *   *Tutor's Role:* The tutor must have great authority but also be a model of reason. The relationship is personal. The tutor guides the child to *think*, not just obey.
      *   *Association of Ideas:* (From *Essay*, Book II, Ch. 33). Wrong associations formed early are hard to break. They are the source of error and madness. "Of all the things we see or hear... none operate more powerfully upon us."
      *   *Reason and Liberty:* Education aims to produce a rational gentleman who can govern himself. Restraint should be minimized as reason develops.
      *   *Truth and Error:* Distinguishing between matters of fact and matters of opinion/value is part of developing reason.

  3.  **Evaluate the AI System against Locke's Principles:**

      *   *Feature 1: Predicting engagement/Maximizing time-on-task via praise.*
