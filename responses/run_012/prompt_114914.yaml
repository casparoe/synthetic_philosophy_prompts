      *   No citations? Yes.

      *(Self-Correction during drafting)*: In section 3, ensure I don't get bogged down in metaphysics of groups. Keep it tied to Fischer's specific argumentative needs. He needs the State to be an agent to justify the "War Guilt" label, even if his evidence is individual.
      *(Self-Correction during drafting)*: In section 4, the prompt asks if the theory predicts this. A pragmatic theory of causation *does* predict that causal claims will shift with political context. A realist theory of causation would not. I need to make that distinction clear.

  8.  **Final Review against constraints:** "Keep the mapping tight -- who's the agent, what's the contrast class, which rule is firing." I will use bolding or clear headers to ensure this visibility. "Where the theory has nothing to say, tell me that." I will note where the philosophy of action hits the wall of collective entities.

