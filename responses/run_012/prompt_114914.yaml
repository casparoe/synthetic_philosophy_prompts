          *   *Morality:* We hesitate to blame a timetable.
          *   *Reverse:* Russia's Mobilisation.
          *   *Selection:* Often treated as background/defensive (by Sleepwalkers).
          *   *Morality:* But it triggered the German mechanical response.
          *   *Better Anomaly:* The "Blank Cheque." Selection rules pick it (Voluntary). Moral judgment (in the 60s) said "Guilt." Moral judgment (later) said "Desperation/Encirclement." The *facts* of the cheque didn't change, the *moral context* changed, altering the causal selection. This proves the "Attributive" function drives the "Explanatory" claim.

  6.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Tone:* Analytical, sharp, philosophical, avoiding historiographical fluff.
      *   *Structure:* Follow the 4 points exactly.
      *   *Check:* Did I distinguish Explanatory vs. Attributive? Yes. Did I address the Contrast Class? Yes. Did I address the Nation/Agency issue? Yes.
      *   *Refinement on Task 2:* Make sure to highlight the divergence of the two rules. The timetable is the "Oxygen" (background condition) that turned into the "Match" (abnormal trigger) depending on who you ask.
      *   *Refinement on Task 4:* Be careful not to say "History is subjective." Say "Causal selection is sensitive to pragmatic contexts."

  7.  **Final Polish:** Check against the "machine" instructions.
      *   Contrastive claim? Yes.
      *   Selection rules (Abnormality/Voluntary)? Yes.
