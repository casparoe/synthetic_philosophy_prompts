      *   *Predictive Power:* A pragmatic theory of causation *predicts* this stalemate. If causation were purely physical/structural, the archives would settle it. Since it's selection-based, political needs drive the selection.
      *   *Virtue vs. Unfalsifiable:* It's a virtue if we admit causation in history is inherently normative. It's unfalsifiable if we claim it's objective but keep moving the contrast class.
      *   *The Anomaly (Selection $\neq$ Morality):*
