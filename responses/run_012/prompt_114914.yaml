          *   Causal selection follows regularities: Abnormality (deviation from background) and Voluntary Action (agency over mechanism).
          *   Distinction between Explanatory (what explains) and Attributive (who to blame) functions of cause-talk.
      *   **Tasks:**
          1.  Identify contrast classes for Fischer, Sleepwalkers, and Treaty Clause. Determine if the dispute is factual or verbal (contrast class selection).
          2.  Apply selection rules (Abnormality vs. Voluntary Action) to the July Crisis (Blank Cheque vs. Schlieffen Plan). Analyze the tension for Hart-and-Honoré style theory.
          3.  Analyze the "Nation" question (Methodological Individualism vs. Corporate Agency). Which does Fischer need?
          4.  Run it backwards: What does the controversy tell us about the theory? (Pragmatic/Blame-driven vs. Sloppy). Look for anomalies (Selection $\neq$ Moral Judgment).
      *   **Constraints:** No reading lists/citations. Keep mapping tight. Admit where the theory is silent.

  2.  **Deconstruct Task 1: Contrast Classes:**
      *   *Fischer Claim:* Germany deliberately started the war.
          *   Contrast: Germany caused the war *rather than* the war being an accidental escalation / *rather than* other powers causing it / *rather than* structural forces causing it.
          *   Core contrast: *Deliberate German Agency* vs. *Accidental/Structural Drift*.
      *   *Sleepwalker Claim (Clark et al.):* Everyone slid into it; responsibility diffused.
          *   Contrast: The war happened *rather than* peace being kept by any single actor / The cause was *systemic panic* rather than *specific intent*.
          *   Core contrast: *Systemic Failure* vs. *Specific Agent Intent*.
      *   *Treaty Clause (Article 231):* Germany & Allies responsible for loss/damage.
          *   Contrast: Germany caused the damage *rather than* the Allies / *rather than* no one (force majeure).
          *   Core contrast: *Legal Liability* vs. *Historical Explanation*.
      *   *Factual vs. Verbal:* It's not just facts. Everyone agrees on the timeline (Sarajevo -> Ultimatum -> Mobilisation). The fight is about *which factor gets the label "Cause"*. Fischer selects *Intent*; Sleepwalkers select *Structure*. This is a dispute over causal selection criteria, heavily laden with the Explanatory vs. Attributive distinction.

  3.  **Deconstruct Task 2: Selection Rules (Abnormality vs. Voluntary Action):**
      *   *The Rules:*
          *   Abnormality: Pick the deviation (Match vs. Oxygen).
          *   Voluntary Action: Pick the human choice over mechanical necessity.
      *   *The July Crisis:*
          *   *Blank Cheque:* High Voluntary Action (Bethmann-Hollweg's choice). High Abnormality (unconditional support was risky).
          *   *Schlieffen Plan:* Low Voluntary Action (mechanical timetable, "iron dice"). High Abnormality (invading Belgium brought Britain in).
      *   *The Conflict:*
          *   Fischer leans on *Voluntary Action* (The Blank Cheque/Intent).
          *   Sleepwalkers lean on *Abnormality/Mechanism* (The Timetables/Mobilisation locked everyone in).
      *   *Hart-and-Honoré Impact:* Their theory assumes these rules usually converge (the voluntary act is usually the abnormal intervention). Here they diverge. The "mechanical" thing (timetable) caused the *scope* (World War), but the "voluntary" thing (cheque) caused the *risk*. If you prioritize Voluntary Action, Germany is guilty. If you prioritize Mechanical Necessity (as a background condition that became abnormal), everyone is trapped. This exposes a crack in selection theory: when mechanism and agency pull apart, "Cause" becomes ambiguous.

  4.  **Deconstruct Task 3: The Nation Question (Agency):**
      *   *Option A: Methodological Individualism.* "Germany" = Sum of specific elites (Kaiser, Bethmann, Moltke). Responsibility lies with them.
      *   *Option B: Corporate Agency.* "Germany" = State entity with intentions irreducible to individuals (Reason of State).
      *   *Fischer's Need:* Fischer talks about "Germany," but his evidence is about elites, pressure groups, and the "establishment." He needs a hybrid. He treats the State as an agent to assign blame (Attributive), but explains it through individual/elite psychology (Explanatory).
