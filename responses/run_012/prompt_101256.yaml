  1.  **Analyze the User's Position:**
      *   **Core Claim:** The derogatory force of slurs is pragmatic (expressive/presuppositional), not truth-conditional. Therefore, it should be cancellable via embedding (conditionals, negation, indirect speech, reclamation).
      *   **Conclusion:** Theoretical insistence that slurs remain harmful/offensive even in these contexts is "overblown," a "refusal to let cancellation do its work," or a "confusion of use with mention."
