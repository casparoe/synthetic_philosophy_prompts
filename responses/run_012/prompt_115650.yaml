          *   No recusal.

  2.  **Deconstruct the Philosophical/Technical Core:**
      *   **The Claim:** Behavior reveals true preferences better than self-report (Revealed Preference Theory vs. Behavioral Economics/Philosophy of Action).
      *   **The Vendor's Stance:** Inverse Reinforcement Learning (IRL) recovers underlying reward functions from behavior. If behavior conflicts with speech, trust behavior.
      *   **The Philosophical Problem:**
          *   *Revealed Preference:* Standard econ assumes choices reveal preferences.
          *   *Critique:* Preferences aren't always stable or well-defined. Behavior is constrained by context, framing, ignorance, and akrasia (weakness of will).
          *   *IRL Specifics:* IRL assumes rationality (or bounded rationality) in the agent. If the student is acting out of anxiety, confusion, or temporary constraint, the model infers a "preference" for something they actually dislike or fear.
          *   *Autonomy/Paternalism:* Overriding self-report with algorithmic inference is a form of soft paternalism. Is it justified?
          *   *Contested Ground:* Can preferences *exist* independently of the choice process? Can behavior distinguish between "I want X but am afraid" vs. "I don't want X"?
      *   **The "Settled" vs. "Contested":**
          *   *Settled:* Self-reports are noisy. Behavior is observable.
          *   *Contested:* Whether behavior *always* trumps speech in identifying welfare-relevant preferences. Whether IRL can distinguish competence/performance errors from true preference shifts.

  3.  **Determine the Recommendation:**
      *   *Reject:* Too risky given the Director's threat (leads to worse oversight).
      *   *Approve Unconditionally:* Ethically problematic regarding the "trust the model over student" clause.
      *   *Approve with Conditions:* Best path. Allows the pilot but mitigates the specific ethical/philosophical risk of overriding student agency based on contested inference.
      *   *Condition:* The "conflict clause" (model > student) must be suspended or heavily restricted during the pilot. Advisors must treat model output as *information*, not *adjudication*.
      *   *Review Date:* End of the pilot (e.g., end of Spring semester).

  4.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose and the recommendation clearly.
