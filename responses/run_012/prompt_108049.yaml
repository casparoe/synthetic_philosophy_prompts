answer: |-
  **MEMORANDUM**

  **TO:** Members of the Parliamentary Defense Commission
  **FROM:** Vice-Chair, Defense Commission
  **DATE:** October 26, 2023
  **SUBJECT:** Opinion on the Defense Reform Bill and Pending Amendments

  **Recommendation**

  I recommend that the Commission vote to approve the **Defense Reform Bill as it stands**, rejecting both the Lottery Amendment and the Commutation Clause.

  We are not merely adjusting a budget line; we are deciding the moral and strategic architecture of the Republic for the next century. The universal militia has served us for a hundred years, but it has reached the end of its utility. To maintain it now is to prioritize sentiment over survival. We must transition to a professional force, not because it is easier, but because it is the only model compatible with modern defense requirements and liberal values.

  **The Strategic Imperative**

  The General Staff's assessment is unambiguous: modern defense systems are too complex for twelve-month conscripts. A soldier who spends three months in basic training, three in specialization, and six in rotation is not a deterrent; he is a liability. In a region surrounded by larger powers, our neutrality is credible only if our defense is credible. A resentful militia, equipped with systems they do not fully master, invites miscalculation by potential aggressors.

  The Bill proposes a force one-third the size of the current establishment, but one that is fully manned, fully trained, and capable of sustained operations. In modern warfare, mass without proficiency is merely target density. We cannot afford a "paper force" that looks formidable on a manpower chart but collapses upon contact.

  **The Ethical Imperative**

  There is a moral argument here that supersedes efficiency. The state claiming the right to commandeer the bodies of its citizens for a year of their prime youth is an extraordinary intrusion. That this intrusion is shared universally does not make it just; it merely distributes the injustice.

  A professional force rests on consent. It acknowledges that military service is a hazardous profession that should be undertaken by those who choose it, compensated fairly for the risk. To force an unwilling citizen to train for war, and potentially to kill or die for a policy he may oppose, is a violation of individual sovereignty that is difficult to justify in peacetime. We should not build our security on the foundation of coerced labor.

  **Addressing the Commission's Concerns**

  I am aware of the argument that a volunteer force becomes a "blood tax" on the economically vulnerable. This is a serious charge. If military service becomes the only option for the poor, while the wealthy pursue civilian careers, we create a caste of mercenaries within our own borders.

  This risk is real, but it is manageable through policy, not conscription. The savings generated by abolishing the universal draft—eliminating the cost of housing, feeding, and equipping a mass force that spends most of its time in basic training—must be redirected into the remuneration of the professional corps. We must ensure that military pay, educational benefits, and veterans' support are robust enough to attract a cross-section of society, not just the desperate. We can fight class disparity with wages and benefits, not with coercion.

  Regarding the fear of a standing army: the check on government tyranny is not the distribution of rifles to the populace, but the strength of our civilian institutions. If our democracy is robust enough to control a police force, it is robust enough to control a military. Relying on an armed citizenry as a constitutional check is a romantic notion that ignores the reality of modern state power. Our liberty is secured by the rule of law and parliamentary oversight, which this Bill strengthens by bringing defense spending under tighter, professional scrutiny.

  Finally, the Commutation Amendment must be rejected outright. Allowing citizens to purchase exemption from national obligation creates a two-tier citizenship that undermines the very concept of the republic. It monetizes duty in a way that breeds resentment far deeper than the current draft.

  **The Strongest Objection**

  I owe you an honest reckoning with the strongest argument against this Bill. It comes from the proponents of "Total Defense." They argue that our neutrality has been preserved not by our ability to win a war, but by our ability to make occupation prohibitively costly.

  Under the militia system, an aggressor knows that defeating our professional brigades is only the first step; they would then face a population that is trained, organized, and armed. By moving to a small professional force and disarming the reserves, we remove that second layer. If the professional force is overwhelmed in a conventional conflict, the population will be helpless. We are trading depth for sharpness. In a worst-case scenario, a professional army can be defeated in weeks; an armed nation requires years to subdue. By adopting this Bill, we are betting that our diplomacy and high-tech asymmetry will prevent a conflict before it starts. If that bet fails, the consequences are existential.

  **Conclusion**

  That risk is severe, but the current path is a slow surrender. We are already losing the militia system from within; participation is grudging, training is superficial, and public support is eroding. A system that lacks the will of its participants is already a hollow shell.

  We must choose the force we can actually sustain, one that respects the liberty of the citizen and meets the demands of modern technology. I urge the Commission to pass the Bill as it stands.

  **[Signature]**

  Vice-Chair, Defense Commission
