  You have stumbled onto a theory that philosophers of emotion call **Embodied Perceptualism** (sometimes "Somatic Intentionality"). It is the only framework that respects the biological reality you observed for thirty-five years while accounting for the intentionality you've noticed in your retirement reading.

  Here is the principle: Emotions are **embodied perceptions of significance**. They are ways your body evaluates the world, distinct from your conscious judgments, but they must have a physiological footprint to exist at all.

  This principle unifies your cases. Turbulence, the horror film, and the soup bowl are **recalcitrant emotions**: your body perceives a threat or contaminant even though your judgment denies it. The body's evaluation runs deeper than the cortex's. Your brother-in-law and your grieving colleague have **unconscious emotions**: the physiological footprint (knuckles, insomnia) is present even if conscious access is blocked. The flat reporter has **no emotion**: a verbal report without a somatic state is just a proposition, not an affect.

  This brings us to the tension you identified between your grandson and the flat reporter. You feel they should fall on the same side, but under this principle, they are opposites. Your grandson's fear *did* have a physiological footprint (tears, trembling, hiding); it was a real emotion driven by a belief. The flat reporter has *no* footprint.

  To make this system coherent, you must drop one verdict. **You must drop the verdict that your grandson's fear "just was the belief."** If fear *were* the belief, you could not have turbulence fear (where the belief is absent). Your grandson's fear was the *bodily response to the belief*. When the belief vanished, the object of the perception vanished, and the body calmed down. The fear was never the thought itself; it was the somatic reaction to the thought. Keeping the "fear = belief" verdict forces you back into Judgmentalism, which destroys your turbulence and horror film cases.

  Here is the prediction for your new cases based on this principle:
  1.  **Amusement at a joke you don't find funny:** If you laugh socially but lack the physiological "mirth" state (relaxation, specific respiratory patterns), this is **not amusement**. It is politeness.
  2.  **Ashamed of something you don't think was wrong:** If you feel the heat, the shrink, the avoidance (the footprint), this **is shame**. It is a recalcitrant perception of social threat, exactly like your turbulence fear.

  Verdict: Emotions are embodied perceptions of significance that require a physiological footprint but not a conscious judgment.
