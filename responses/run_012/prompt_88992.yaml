answer: |-
  Thank you. I spent thirty-four years as a fisheries biologist. I counted fish, I counted days at sea, and now, in retirement, my wife says I've started counting distinctions. Tonight, looking around this room, I see why.

  We are here for Dana. Twenty years at the Council. Half of you know her as the regulator, the negotiator, the one who held the line. The other half know her as the aunt, the grandmother, the one who makes the pie. Usually, at these dinners, we pretend those two people are the same. Tonight, I don't think we should do that.

  We all know why some of you are still furious. Five years ago, the buyout. The last eleven boats off the bay. Dana stood in front of the families in this room and told them the science was settled. I was in that room. We were biologists; we know science is rarely settled. She asked you to trust numbers that were still shaking. She did it because the stock was collapsing, and she believed the bay would not survive another season of hesitation. But she asked for trust on credit, and some of you paid the interest. I want you to know that your anger is not a ghost in this room. It is part of the record. It belongs here.

  But I also know what happened after that meeting. Dana went home and didn't sleep for a year. She carried the weight of those eleven boats in her body. And when she finally slept, she woke up and wrote something down.

  The Playbook. The decision protocol for allocation fights. Every new council member gets it. It tells you how to make the call when the stock is down and the families are hungry. She wrote it so the next person wouldn't have to guess. She wrote it so the hard thing would have a path.

  I've been reading a lot of philosophy lately, looking for a word for what this is. Does writing it down launder the dirt? Does putting the hard choice into a protocol make it clean, or does it just make the dirt reproducible? Does it save the next biologist from having to lie, or does it just teach them how to lie better? I don't have the answer. I only know that the book is on the shelf, and the bay is still here.

  To her family: You know the cost of that book. You know the nights she was at the table but not at the table. You know her as the one who makes the pie, and I hope you know that the pie matters just as much as the protocol. One feeds the body, the other feeds the future, and both require hands that are willing to get work done.

  Dana didn't keep her hands clean. No one could have sat in that chair and kept them clean. But she didn't hide the stains, either. She wrote them down. She made a map of the hard thing so we wouldn't have to stumble in the dark.

  So I'm not going to toast to clean hands. I'm going to toast to the work. To the bay that is still breathing. To the anger that is still real. And to Dana, who wrote the map, carried the weight, and still makes the pie.

