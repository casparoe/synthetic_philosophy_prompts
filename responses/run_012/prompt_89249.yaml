      Also, on the "inexactness" point: C1 argues inexact = no standard. In Aristotelian ethics, inexact = appropriate standard for the subject matter. This is a crucial philosophical point.
      On the Natural/Unnatural trade: C1 sees a contradiction. C2 sees a distinction of ends. C2 is textually supported by *Politics* I.9.

      *What both miss:* The social hierarchy aspect (*axia*). Aristotle's reciprocity isn't just about goods; it's about binding unequal citizens. Also, the fact that Aristotle doesn't actually have a fully worked-out "theory of value" in the modern sense; he's doing political philosophy, not economics.

