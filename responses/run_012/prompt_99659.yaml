answer: |-
  Dear Colleague,

  It is a pleasure to engage with you on this project, and I agree entirely that before we wade into the fray of competing theories we must first sharpen the blade of adequacy itself. You are right to insist that the standard must be independent of the contenders, and given your aim to apply this to institutional and corporate responsibility, the stakes are higher than the usual philosophy of action seminar. We are not merely asking what allows two friends to go for a walk, but what allows a state to be held accountable for a war or a firm for a pollution scandal. With that purpose in mind, I have been turning over the constraints you listed, testing them against the cases you provided, and trying to separate the genuine demands of the phenomenon from the methodological preferences of the various camps. What follows is my attempt to write out the specification you requested, framed as a set of criteria that any account of shared intention and joint action must meet if it is to bear the weight of your work on collective responsibility.

  To begin with the scope, any adequate account must be scalable. You have rightly stipulated that an account defined only for face-to-face dyads is not yet adequate for your purposes, and this must be stated as a formal requirement rather than smuggled in as an afterthought. The criterion here is structural invariance across scale. An account that relies essentially on mutual gaze, immediate feedback, or rich common knowledge generated by conversation will fail when applied to a cathedral raised over four generations by people who never overlap, or a firm that acts as one body while most of its members privately oppose the action. The account must specify the mechanisms of intention aggregation or transmission that allow the joint status to persist without continuous interpersonal contact. This does not mean the account must be identical for a pair and a state, but it must provide a principled explanation of how the smaller unit relates to the larger one, rather than treating the dyad as the paradigm and the corporation as a metaphorical extension. If the theory cannot explain how a committee member who belongs to two bodies with incompatible joint intentions navigates that conflict without dissolving the jointness of either, it lacks the necessary granularity for institutional analysis.

  This leads directly to the methodological stance on reduction. You asked that we not beg the question against reductionism, and I agree that the demand that shared intention be analysable out of individual attitudes plus common knowledge should not be a hard constraint but rather a methodological preference that carries a cost. The requirement here is transparency of constitution. An account must explicitly state the relationship between the attitudes of the participants and the attitude of the collective. If it posits a group mind, it must explain the causal interface with individual brains. If it posits only individual attitudes, it must explain the emergent normativity that feels distinct from individual obligation. The reason this deserves to stay on the list is not because individualism is true, but because collective responsibility ultimately lands on individuals. If the account cannot trace the line from the collective intention to the individual causal movers, it cannot support the ascriptions of responsibility you are interested in. Therefore, the criterion is not that the account must be reductionist, but that it must be causally grounded in the actions of individuals.

  Now let us test these requirements against the cases you provided, for an account is only as good as its handling of the boundaries. Consider the two strangers who walk the same route at the same pace for a mile and then part. An adequate account must classify this as non-joint action. It owes us an explanation of why mutual responsiveness is absent or insufficient, distinguishing it from the pair who settle on a plan and are both prevented before either acts. In the latter case, there is shared intention and no joint action, which means the account must separate the normative state of intending from the physical realization of the act. If the theory collapses intention into action, it fails the prevented plan case. Conversely, the account must handle the duet that is also a duel, where the same pattern of sound is produced by two people with opposed intentions. Here the criterion is the role of shared goal versus matched behavior. The account must explain why the acoustic match does not constitute joint action, likely by appealing to the lack of mutual commitment to the success of the other's part.

  The temporal and spatial cases are crucial for your institutional aims. The bucket brigade whose members never see or hear one another and the cathedral raised over generations test the necessity of common knowledge. An account that demands recursive knowledge of knowledge will struggle here, so the criterion is that the account must allow for attenuated or structural common knowledge, perhaps mediated by roles or artifacts rather than mental states. The firm that acts as one body while most members privately oppose the action tests the separation of personal and corporate attitude. The account must allow for the possibility that the joint intention resides in the structure or the authorized agents without requiring universal personal endorsement. If it requires every member to personally intend the corporate goal, it cannot explain corporate responsibility in large organizations. The coerced co-author who complies without sharing the plan is a boundary case for voluntariness. The account owes us a distinction between participation and membership, clarifying whether coercion dissolves the jointness or merely creates a defective instance of it.

  Then there are the cases that might fall outside the account's business, and an adequate theory should be willing to say so. Two people who unknowingly dig the same hole at different times and thereby produce a single joint product should likely be excluded from shared intention, though they may share responsibility for the outcome. The account must distinguish causal contribution from intentional collaboration. Similarly, the large anonymous crowd whose aggregate behaviour has all the shape of a joint action and none of its internal structure should be classified as aggregate behavior rather than joint action, unless the account can identify a latent structure of commitment. The couple married forty years who act together out of habit with no occurrent intention anywhere is the hardest test for cognitivist accounts. The criterion here is whether the account can accommodate dispositional or habitual intention without requiring occurrent mental states at every turn. If it cannot, it must explain why habit is a derivative form of joint action rather than a counterexample.

  Moving to the conceptual distinctions, this is where the real work lies, and I believe there are six specific separations an account must respect or explicitly explain away. First, shared intention must be distinguished from parallel individual intentions plus common knowledge of one another. The consideration for this is the intuition of mutuality; in joint action, I intend that we act, not just that I act while you act. An account may explain this away by showing how the latter generates the former, but it cannot ignore the difference. Second, shared intention must be distinguished from shared belief or shared desire. The reason is that one can share an intention without sharing the underlying reasons or desires, as in the firm with dissenting members. Third, we must distinguish the plural form of intending from an individual intention with plural content. This is the difference between I intend that we J and We intend that we J. An account must take a stance on whether the plural subject is primitive or constructed. Fourth, a joint commitment must be distinguished from a prediction about what the other will do. The consideration is normativity; a prediction creates no obligation, whereas a commitment does. Fifth, the normativity participants actually feel must be distinguished from whatever the account's own resources can generate. If the theory generates obligations that the participants do not recognize, it risks being revisionist. Sixth, and vital for your project, joint action must be kept separable from joint responsibility. One can act together without being responsible together, as in the coerced co-author case, and one might be responsible together for an outcome produced without joint action, as in the unknowing diggers. An account that collapses these will be useless for your seminar.

  Alongside these distinctions, there are empirical and theoretical results the account must not contradict. First, coordination equilibria are reachable without anything we would call shared intention, as game theory shows. The account must not over-intellectualize coordination. Second, individual participants remain the causal movers of whatever happens. Even if the group is the agent, the physics of the action runs through individual bodies. Third, the developmental and comparative evidence about when children and other animals begin to do things together rather than merely alongside one another must be respected. If the account requires linguistic capacity or complex theory of mind, it will contradict evidence of joint action in pre-linguistic infants or primates. However, regarding whether contested comparative findings can constrain a theory, my view is that they can constrain the necessary conditions but not the sufficient conditions. If animals lack a capacity the theory deems necessary, the theory is falsified. If animals exhibit behavior the theory deems sufficient for joint action but we intuitively deny it, that is a matter of interpretation, not falsification.

  Now, to address your final three requests regarding the architecture of these requirements themselves. First, you asked which requirement, if dropped, would let the most candidate accounts back in. I believe it is the requirement of scalability to non-dyadic and non-contemporaneous groups. Many elegant accounts of shared intention, particularly those rooted in phenomenology or dense mutual knowledge, work beautifully for two friends walking together but collapse when applied to a corporation or a four-generation cathedral project. If we drop the demand that the account must handle institutional agents without metaphorical stretching, we open the door to a wide range of interpersonal theories that would otherwise be disqualified. This is a significant cost for your specific project, but it is the easiest constraint to relax if one wishes to broaden the field of contenders.

  Second, regarding which demands are genuine desiderata and which are parochial, I will be direct. The demand for naturalism is parochial in the sense that it is a metaphysical preference rather than a phenomenological datum. While we should prefer naturalistic accounts, insisting on them as a condition of adequacy rules out non-naturalist realist positions that might otherwise capture the normativity of joint commitment accurately. The demand for tractability to the tools of individual decision theory is also parochial; it is a methodological convenience that risks Procrustean forcing of phenomena that are inherently plural. However, the demand for the felt normativity of joint commitment and the possibility of unilateral revision are genuine desiderata. The felt normativity is the phenomenon to be explained; if an account cannot capture why participants feel bound to one another, it has missed the target. The possibility of unilateral revision is a constraint on the nature of intention; if I cannot change my mind, I am not an agent but a component. An account that makes shared intention too binding to allow for individual withdrawal fails to capture the agency of the participants.

  Third, and most critically, I believe there is a pair of requirements that is jointly unsatisfiable, and we should record this as a result rather than soften it. The demand that the account be built entirely from individual attitudes and the demand that a participant be unable to walk away from a shared intention at will cannot both be met. If the shared intention is constituted solely by the individual attitudes of the participants, then the dissolution of any one of those attitudes must logically dissolve the shared intention. To say that the shared intention persists despite my individual withdrawal is to posit a entity over and above our individual attitudes. If we insist on strict individualism, we must accept that shared intention is always vulnerable to unilateral defection. If we insist on the bindingness of joint commitment that survives individual doubt, we must posit a social reality that is not reducible to the sum of individual psychological states. This is not a failure of theory but a feature of the ontology. For your purposes in collective responsibility, this suggests that if you want to hold a committee responsible even when members privately dissent or wish to leave, you cannot rely on a purely reductionist account of their shared intention. You will need to embrace a form of non-reductionism regarding the institutional agent, or accept that the responsibility lies in the structure rather than the psychological state of shared intention. I hope this specification serves as a robust foundation for your paper and seminar, and I look forward to seeing how you navigate these tensions.

  Warmly,

  Your Colleague
