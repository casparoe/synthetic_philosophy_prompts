          *   $A$: Action taken (Binary: 1=Kill, 0=Refrain).
          *   $I$: Intervener's state/action (Binary: 1=Intervene, 0=Wait).
          *   $R$: Responsibility/Moral Blame (Outcome of interest).
          *   $U$: Unobserved confounders (Jones's character, reasons, neural state).

      *   **Structure (DAG):**
