      *   *Mapping:* Causal responsibility maps to $P(A_{do(\text{Agent})} = a)$. Moral responsibility seems to require conditions on the *counterfactual stability* of the process, not just the actual path.
      *   *Residue:* Moral responsibility involves "desert." Causal models describe *production* of effects, not *desert* for them. This is the Is-Ought gap.

  7.  **Probabilistic Intervener:**
      *   If $P(I=1 | D=0) = p < 1$.
      *   Then $P(A=0 | do(D=0)) = 1-p$.
      *   Now there *is* an alternative possibility in the causal sense.
