      *   *Residue:* The "Flicker" relies on a specific granularity of variables that causal models usually treat as exogenous noise. The "freedom" isn't in the graph structure, but in the *source* of the noise term ($\epsilon$).

  6.  **Causal vs. Moral Responsibility:**
      *   *Causal Responsibility:* $ACE$ of Agent on Outcome. $E[Y_{do(A=1)} - Y_{do(A=0)}]$.
