  12. **Final Polish:** Ensure tone is respectful of both disciplines. Use LaTeX for math. Structure clearly with headings. (Proceed to generate output).

  *(Self-Correction on the "Suspicion"):* The user suspects PAP is just counterfactual dependence. I need to be careful here. If PAP is *defined* as counterfactual dependence, Frankfurt cases refute PAP. But many philosophers define PAP as "Metaphysical Possibility," which might be broader than causal counterfactuals (e.g., in a deterministic universe, causal counterfactuals might be empty, but metaphysical possibility might remain). I need to distinguish *Causal Possibility* (interventionist) from *Metaphysical Possibility* (modal logic). The user's vocabulary captures the former perfectly, but the latter is the residue.

  Let's refine the "Residue" on this: Causal models assume a structure. If the structure is deterministic, counterfactuals are fixed. If the structure is stochastic, they are probabilistic. Philosophy asks if the structure *itself* could have been different or if the agent could have initiated a break in the structure. Causal models take the structure as given (the "Laws"). Free will debates often question the agent's relation to the Laws. That is the hard limit.

