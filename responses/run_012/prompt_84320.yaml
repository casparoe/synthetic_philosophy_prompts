  The lever drops when mass exceeds the gate,
  A magnet resists the pull of inferior steel.
  The circuit closes on a specific weight,
  And slides the product down the delivery well.

  It waits for payment with a silent hope,
  Accepts the coin as valid currency.
  It cannot know the boundaries of its scope,
  Believes the value matches what it sees.

  The foreign disc fits in the tolerance slot,
  Within the margin error of the spring.
  The switch engages whether true or not,
  A causal chain without a referencing thing.

  It is convinced the transaction is complete,
  Fooled by the shape and color of the lie.
  It holds the false coin dear inside its seat,
  And thinks the soda waiting is its right.

  These marks are ink on dead and silent wood,
  No meaning lives inside the alphabet.
  They cannot know what they appear to be,
  A formal shape where nothing happens yet.

  Yet something wakes when eyes scan left to right,
  A voltage jumps the gap between the lines.
  Is it the ink or blood that makes the light?
  The design fades where interpretation shines.

  My synapses respond to chemical weight,
  I take the world according to my map.
  If I am fooled, is it my fault or fate?
  The magnet swings inside the neural gap.

  When I say I know what I want today,
  I check the signal passing through the frame.
  The system processes the debt and pay,
  And believes the world is real enough to trust.

  The poem concludes there is only a difference in bookkeeping.
