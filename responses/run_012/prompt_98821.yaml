answer: |-
  # Q&A Prep Sheet: The Provisional Demos

  **Strategy Overview:**
  Your paper makes a bold move: trading a static solution for a dynamic process. The room will try to trap you back into static definitions. Your goal is to convince them that the *shift* from "correct boundary" to "contestable jurisdiction" is the theoretical payoff, not a bug. You must own the relocation of the problem (see verdict below) but argue it's a more productive location.

  **Concede Up Front:**
  *   Concede that you do not offer a *formula* for deciding boundaries. If you try to give one, you contradict your thesis.
  *   Concede that "governed" is a fuzzy concept. Argue that fuzziness is better than the false precision of the all-affected principle.

  **Hold the Line On:**
  *   **Membership vs. Jurisdiction:** This is your strongest analytical tool. Do not let them collapse these. Membership is status; jurisdiction is impact.
  *   **Legitimacy as Process:** Do not let them define legitimacy as a threshold condition (met/not met). It is a continuous variable.

  ---

  ## The Objections (Ordered by Damage Potential)

  ### 1. The Circularity of "The Governed" (The Fatal Shot)
  **Who:** The Habermasian Majority (likely voiced by the most senior deliberative democrat).
  **The Objection:** "You claim legitimacy comes from the right of the 'governed' to contest decisions. But to know who has that right, we need to know who is 'governed.' If a policy in France affects a farmer in Mali via climate change or trade tariffs, is the Malian farmer 'governed'? If yes, your demos is global (back to square one). If no, you've just drawn a boundary by fiat. You haven't solved the boundary problem; you've just hidden the boundary inside the definition of 'jurisdiction.' Who decides the scope of jurisdiction?"

  **Your 2-Minute Reply:**
  "You're right that 'governed' isn't self-defining, but it shifts the burden of proof in a way that matters practically. The traditional boundary problem asks: 'Who belongs before we start?' My view asks: 'Who is impacted enough to claim a right to contest?' The difference is that the second question is empirical and ongoing, not metaphysical and一次性 (one-off).
  I am not saying the Malian farmer automatically gets a vote in the French National Assembly. I am saying the French regime loses legitimacy if it refuses to create *channels* for that farmer's contestation—whether through transnational courts, impact assessments, or diplomatic accountability. The boundary isn't a wall; it's a membrane. The 'who decides' question is answered by the conflict itself. If the Malian farmer can effectively disrupt the decision, they are part of the jurisdictional demos. Legitimacy isn't the absence of conflict over the boundary; it's the presence of mechanisms to fight it."

  **Where This Reply is Weakest:**
  It risks sounding like "might makes right." If the farmer *can't* disrupt the decision, does that mean they weren't governed? It leaves you vulnerable to the charge that you are describing power dynamics, not normative legitimacy.

  ### 2. The "Managed Dissent" Charge (The Agonist Trap)
  **Who:** The Two Mouffe-ians.
  **The Objection:** "You talk about contestability as if it's neutral. But the rules of contestation are set by the hegemonic power. Allowing me to contest the boundary is just a way of pacifying me. It's liberal pluralism masking the fundamental antagonism. By calling your regime 'legitimate' because it allows protest, you are sanctifying the very exclusion you claim to problematize. Real democracy requires acknowledging the friend/enemy distinction, not managing it through procedural safety valves."

  **Your 2-Minute Reply:**
  "I agree that contestation can be co-opted. That's why my view requires that membership be *revisable*, not just that voices be heard. If the contestation leads to a restructuring of the membership rules, the hegemony shifts.
  The difference between my view and a purely hegemonic closure is that I deny the regime the right to claim finality. A Mouffe-ian might say the closure is inevitable; I say the *claim* to finality is what destroys legitimacy. If a regime admits its boundaries are provisional and subject to overhaul based on contestation, it acknowledges the antagonism rather than suppressing it. I'm not asking for polite debate; I'm asking for institutional vulnerability. If the contestation breaks the system, the system was illegitimate."

  **Where This Reply is Weakest:**
  Agonists may not care about "legitimacy" in the liberal sense. They might view your "institutional vulnerability" as just another form of liberal institutionalism that refuses to acknowledge the violence required to sustain the order.

  ### 3. The "Constituent Power" Redux (The Historian's Pedantry)
  **Who:** The Historian of Political Thought.
  **The Objection:** "This sounds exactly like the constituent power tradition—Sieyès, Schmitt, even Arendt. They all argued that the people constitute themselves through action and that the boundary is a political decision, not a legal one. You seem to think you've discovered something new, but you've just reinvented the distinction between constituted and constituent power without the revolutionary stakes. Why is your 'provisional demos' better than the classic account of constituent power?"

  **Your 2-Minute Reply:**
  "The constituent power tradition usually posits a moment of foundational violence or decision—a 'Big Bang' where the people appear. My argument is that there is no moment. The 'constituting' never stops.
  The classic tradition still tends to look for the *true* people behind the veil. I'm arguing there is no true people, only the ongoing negotiation of jurisdiction. The difference is temporal. Constituent power is usually episodic (revolution, constitution-writing); the provisional demos is continuous. This matters because it removes the mystique from the 'founding moment' and places the burden of justification on everyday administration. It's constituent power democratized and routine, not exceptional."

  **Where This Reply is Weakest:**
  The historian can easily cite texts where constituent power is described as continuous (e.g., later Arendt or Negri). If they corner you on textual fidelity, you might look like you haven't read the literature deeply enough.

  ### 4. The "Scope of Jurisdiction" Push (The Animal/Future Gen Challenge)
  **Who:** The Representation Scholar.
  **The Objection:** "You distinguish jurisdiction from membership. If a dam destroys a river ecosystem, the river is 'governed' by the decision in terms of impact. Under your view, does the river have a right to contest? If you say no, you're relying on a humanist assumption of agency that contradicts your own logic. If you say yes, how does it contest? You're kicking the can on who counts as a relevant actor."

  **Your 2-Minute Reply:**
  "This is where the membership/jurisdiction distinction does the heavy lifting. Jurisdiction is about impact; membership is about agency.
  Non-human entities can be within the *jurisdiction* (they are affected) without being *members* (they cannot speak). But, a legitimate regime must provide proxies or guardians who can contest on behalf of that jurisdiction. The right to contest belongs to the human agents who take up the cause of the governed. If no human contests on behalf of the river, the regime is failing its duty to make contestability possible. The obligation is on the humans to expand the circle of advocacy, not on the river to speak."

  **Where This Reply is Weakest:**
  It retreats to a human-centric proxy model, which might disappoint someone working on non-human representation. It risks sounding like "humans decide which non-humans matter," which reintroduces the boundary problem you claimed to solve.

  ---

  ## The Verdict: Does It Work?

  **Be Committed:** You are not solving the boundary problem; you are **relocating** it.
  *   **Where the relocation happens:** You move the problem from the *input* side (who gets to vote initially) to the *throughput* side (who can challenge the impact continuously).
  *   **Is this fatal?** No, but you must stop calling it a "solution" to the boundary problem. Call it a "dissolution" or a "reframing." If you claim you've solved the logical circularity, the Habermasians will eat you alive. If you claim you've made the circularity *productive*, you survive.
  *   **Survivability:** The paper survives if you convince them that a dynamic error-correction mechanism is superior to a static (and impossible) correct boundary. It fails if they convince the room that without a static boundary, "contestability" is just noise.

  ## The One Question You Hope Nobody Asks

  **"What happens when the provisional demos votes to close the boundary?"**

  *   **Why it's deadly:** If the existing demos uses its democratic right to vote "No more contestation" or "No new members," does your theory collapse?
  *   **The Trap:**
      *   If you say "That's illegitimate," you are appealing to a higher norm outside the demos (which contradicts your democratic commitment).
      *   If you say "That's legitimate," then the provisional demos can permanently exclude people, and you've just justified authoritarian closure through democratic means.
  *   **Prep a deflection:** "If the demos votes to end contestability, it ceases to be a democracy by my definition. Legitimacy requires the *maintenance* of contestability. A vote to end democracy is a performative contradiction." (This is risky but your best bet).

  ## Final Tone Check
  Don't be defensive. When they point out the circularity, agree with them enthusiastically. "Exactly! That's why we can't solve it statically." Make your weakness your strength. The room respects a theorist who knows exactly where the bodies are buried. Good luck.
