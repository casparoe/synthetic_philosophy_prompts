prompt: |-
  Alright, this one's personal, so bear with the setup.

  I taught high school history for thirty-one years in a town of about nine thousand people. There's a war memorial on the green that's being re-dedicated this spring after somebody knocked it over, and the historical society asked me to give the speech at the ceremony. Nine names on it. One of them is Ryan Kessler, who sat in the third row of my second-period class, who could name every battle of the Civil War in order and knew perfectly well it was a useless skill, and who enlisted the summer after he graduated anyway. I've been against that war since before he enlisted. Everybody in town knows it. I marched, I wrote letters to the paper, I got into a shouting match with his uncle at the diner and neither of us has apologized.

  So I can't stand up there and say the war was right, and I won't say his death was a waste, and I'm not going to do the thing where you say nothing at all in alot of nice sentences. There has to be a third option and I think there is one, but I need help getting it onto the page.

  Here's what I keep circling. Somewhere in the just war literature there's a long fight about whether soldiers on both sides of a war are moral equals. The older position says yes, and not because both sides are equally right — because there's a standing agreement between armies, a convention, that a soldier doesn't have to be in the right to be permitted to fight, and the whole point of the agreement is that soldiers don't have to sit in judgment on each other. The newer position says that's a dodge. The cause matters, and a soldier fighting for an unjust cause is doing something he isn't permitted to do, whether or not he knows it.

  And then there's a distinction I only half-remember, and I think it's the important one: justified is not the same as excused. Justified means what you did was allowed. Excused means what you did was wrong, but you aren't to blame for it — you didn't know, you couldn't have known, you were nineteen and from here and the people who told you things lied to you. If that distinction holds up, there's a true sentence I can say about Ryan. If it doesn't hold up, the only honest thing I've got left is the sentence he was wrong to go and it isn't his fault, and I'm not sure those two halves fit in the same breath.

  Write me the speech. Four to six minutes, meant to be read aloud, warm, no jargon, nothing that sounds like a lecture. The room is half veterans and Gold Star families and half the peace people I organized with, and both halves will be listening for whether I sold them out. It has to actually do the work of that justified/excused distinction — pull the distinction out and the speech should collapse. Don't let me say anything I'd have to retract later, don't let me buy peace by saying he died for our freedom or that he died for nothing, and don't flatten the other eight names into decoration either. Use the Civil War thing, and the fact that he knew it was useless, and the fact that he was decent to a kid nobody else was decent to — that last one matters to me more than the rest of it.

  After the speech, give me a short JSON object, nothing fancy, with these fields: "speech_minutes" (number), "audience_segments" (array of objects, each with "segment", "what_lands", "what_they_hear_as_a_betrayal"), "verdict_on_ryan" (object with "status", one of "justified" / "excused" / "neither", plus "one_line"), "claims_i_could_not_make" (array of strings — the things I wanted to say and couldn't), "view_the_speech_quietly_assumes" (one of "moral equality of combatants" / "revisionist asymmetry" / "neither, it dodges"), and "hardest_sentence" (the sentence that was hardest to get right, and one line on why).
