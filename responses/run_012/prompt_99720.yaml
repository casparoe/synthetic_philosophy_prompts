answer: |-
  Good morning.

  For thirty-one years, I taught history in this town. I know what happens to memorials. They become background. We walk past them until we don't see them anymore. Then something breaks them, and we have to look again.

  Some of you know I opposed this war. I marched. I wrote letters. I stood in the diner and shouted at men I've known since childhood. I haven't apologized for that, and I won't start today. I cannot stand here and tell you this war was right. I don't believe it was.

  But I also cannot stand here and tell you Ryan Kessler died for nothing. That isn't true, and it isn't fair.

  Ryan sat in the third row of my second-period class. He could name every battle of the Civil War in order. He knew it was a useless skill. He knew knowing the date of Antietam wouldn't fix the world. But he learned them anyway. Because when a teacher asks you to learn, you learn. When your country asks you to serve, you serve. That was Ryan.

  There was a kid in that class nobody liked. Quiet, messy, smelled like he didn't have a washer at home. Ryan sat with him at lunch. Not out of pity. Just decency. He made room. That matters more to me than any uniform.

  So here is the hard thing. We have nine names on this stone. Nine families who lost sons. We want to say they died for a cause that was worthy. I cannot say that. But I can say this: a boy is not responsible for the maps the adults give him.

  We ask young men to carry our convictions. Sometimes those convictions are heavy. Sometimes they are mistaken. But the carrying is real. Ryan didn't enlist because he analyzed the geopolitics. He enlisted because he was nineteen, and he was from here, and he trusted us to tell him the truth.

  If we say the war was wrong, we do not get to say Ryan was wrong. He acted on loyalty. He acted on trust. Those are good things, even when they are used for bad ends. He is not to blame for the world he inherited. He is to be honored for how he walked through it.

  The other eight names here—they aren't decoration. They aren't props for my speech. They were also sons. They also trusted us. We owe them the same honesty. We can disagree about the war without disagreeing about the boys.

  We are fixing this stone today. We are putting it back upright. But a stone doesn't hold memory. People do. So let us remember them clearly. Not as heroes of a holy cause, but as neighbors who answered a call we sent them.

  We failed them. Let us not fail their memory now.

  Thank you.

