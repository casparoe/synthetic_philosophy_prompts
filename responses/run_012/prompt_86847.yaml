  **Rule B: Causal Role (CR)**
  *   **The Test:** Does the trait currently contribute to the capacity of the containing system? (Current utility is king.)
  *   **Fits her verdicts:** Heart (circulates blood), Waggle Dance (guides colony), Lactase (digests sugar), Rabbit Appendix (ferments).
  *   **Explains her "No"s:** Human Appendix (nothing depends on it), Bone Whiteness (doesn't help structure), Chin (no mechanical role).
  *   **Weakness:** Her justification for the peacock ("selected to do") explicitly invokes history, which CR ignores.

  **The Conflict:**
  *   **SE** cares about *why it's there*.
  *   **CR** cares about *what it's doing*.
