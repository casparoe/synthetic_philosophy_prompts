  ### 1. The Candidate Rules
  Based on her rulings, two competing definitions of "function" are vying for control. Both fit her past data, but they diverge sharply on new ground.

  **Rule A: Selected Effects (SE)**
  *   **The Test:** Does the trait exist *because* it did this thing in the evolutionary past? (History is king.)
  *   **Fits her verdicts:** Heart (selected to pump), Peacock (selected to attract), Lactase (selected recently), Rabbit Appendix (selected to ferment).
