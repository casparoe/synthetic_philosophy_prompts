answer: |-
  ### The Metaphysics of the Past: An Epistemicist Defense via Retroactive Sharpening

  The debate between epistemicism and supervaluationism often stalls over logical formalisms or intuitions about bivalence. However, the case of "retroactive sharpening"—where a vague rule is precisified after the fact—reveals a deeper metaphysical fault line. This case demonstrates that epistemicism is the superior view because it alone preserves the stability of past truth without invoking metaphysically dubious backward causation.

  **The Retroactivity Problem for Supervaluationism**
  Consider the kid who entered at 8:00:00.4 on Tuesday. Under supervaluationism, before the board voted, the sentence "The kid was late" lacked a truth value. It was neither true nor false. When the board votes on Friday to set the line at 8:00:00.0, they create a precisification. If this precisification applies to Tuesday's event (which legal rules often do), supervaluationism implies that the truth value of a past event is determined by a future linguistic act. The kid *was not* late on Tuesday morning, but by Friday afternoon, he *was* late. This suggests that truth values can flow backward in time, dependent on future stipulations. This is metaphysically untenable. The past should be fixed; what happened on Tuesday should not depend on what the board decides on Friday.

  **Epistemicism and the Fixed Past**
  Epistemicism avoids this retroactive magic. It holds that on Tuesday, the vague predicate "on time" already had a sharp boundary determined by the complex facts of usage, convention, and context at that specific time. Perhaps the boundary was actually 8:00:00.5 based on how the school community understood the rule. If so, the kid was objectively *on time* on Tuesday. There was a fact of the matter, even if no one knew it.

  When the board votes on Friday, the epistemicist distinguishes between *discovering* the boundary and *changing* it. If the board sets the line at 8:00:00.0, they are either aligning the written rule with the existing semantic boundary (if they guessed right) or, more likely, they are legislating a new standard. If they apply this new standard to Tuesday, they are not revealing a pre-existing truth; they are exercising power to redefine the terms retroactively. Epistemicism allows us to say: "He was not late under the meaning of 'on time' as it existed on Tuesday, but you are punishing him under a new rule you are imposing now." This preserves the integrity of past truth while accounting for the board's authority.

  **The Second Board Vote: Change vs. Indeterminacy**
  This distinction becomes crucial when the second board moves the line to 8:00:30 a year later. A supervaluationist might argue this proves there was never a real line, just shifting precisifications. However, the epistemicist argues this proves only that meanings are *contingent*, not *indeterminate*.

  On Tuesday (Year 1), the boundary was sharp (say, 8:00:00.5). On Wednesday (Year 2), after the second vote, the boundary is sharp at 8:00:30. The fact that the boundary moved does not mean it was fuzzy in Year 1. It means the linguistic/social facts changed. Epistemicism treats vagueness as a feature of our ignorance of sharp boundaries fixed by usage. When the board votes, they alter the usage facts, thereby shifting the boundary. The second vote confirms that boundaries are sensitive to social acts, but it does not confirm that boundaries were absent before the act. If there were no boundary before the first vote, there would be nothing to change; there would only be nothing. The fact that we perceive the second board as *changing* the rule rather than *creating* the concept of lateness implies there was a determinate rule there to be modified.

  **Conclusion**
  Supervaluationism sacrifices the fixity of the past to save the intuition that vague terms lack sharp boundaries. Epistemicism sacrifices the intuition that we can know the boundaries to save the fixity of the past. In the context of retroactive sharpening, the cost of supervaluationism is too high: it makes truth dependent on future fiat. Epistemicism correctly identifies that the kid's status on Tuesday was fixed on Tuesday, and subsequent board votes are either attempts to align with that fact or legitimate exercises of power to change the rule for the future.

