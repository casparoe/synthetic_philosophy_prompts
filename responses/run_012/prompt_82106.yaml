answer: |-
  Here is the audit. Your roommate nailed the core logic of Strawson's "Basic Argument" but failed completely on the metaphysical context and the practical implications. If you repeat the second half of that paragraph to a philosopher, they will know you haven't read Strawson directly.

  ### Sentence-by-Sentence Audit

  **1. "It's the simplest argument in philosophy."**
  *   **Verdict:** **Fair.**
  *   **Why:** Strawson explicitly titles his paper "The Impossibility of Moral Responsibility" and presents what he calls "The Basic Argument." He prides himself on its simplicity and claims it is valid regardless of other metaphysical commitments.

  **2. "To be responsible for what you do, you have to be responsible for being the kind of person who does it -- your character, your motives, your values."**
  *   **Verdict:** **Fair (with one missing word).**
  *   **Why:** This captures the requirement for what Strawson calls **Ultimate Moral Responsibility (UMR)**. To be *ultimately* responsible for an action, you must be responsible for the mental nature that produced the action. The missing word is "Ultimate." Strawson admits we have ordinary responsibility, just not the *ultimate* kind.

  **3. "But you didn't choose any of that: you got it from your genes and your upbringing and the particular world you happened to land in."**
  *   **Verdict:** **Fair.**
  *   **Why:** This is the empirical premise. We do not choose our initial constitution. Strawson accepts this as obvious.

  **4. "And if you say you did choose it, you're saying you made yourself, which is impossible, because whatever choice you made would have to come out of the kind of person you already were, so the regress never terminates."**
  *   **Verdict:** **Fair.**
  *   **Why:** This is the engine of the argument. To choose your nature, you must already have a nature (principles, motives) that makes the choice. This leads to an infinite regress (*causa sui*, or self-causation), which Strawson argues is logically impossible.

  **5. "So nobody is ever responsible for anything."**
  *   **Verdict:** **Loose Shorthand.**
  *   **Why:** Strawson would correct this to: "Nobody is ever *ultimately* morally responsible." He distinguishes between being a moral agent (which we are) and being the *ultimate* originator of your agency (which we aren't). If you say "nobody is responsible for anything," you imply we can't hold people accountable in court or blame them for spilling wine. Strawson doesn't go that far.

  **6. "Its basically the consequence argument wearing different clothes -- the past plus the laws of nature fix what you do, so you couldn't have done otherwise..."**
  *   **Verdict:** **Flatly Denied.**
  *   **Why:** **This is the critical error.** Strawson insists his argument works **even if determinism is false.** He argues that indeterminism (randomness) does not help responsibility; if your actions are random, you aren't responsible for them either. He explicitly distances himself from "Hard Determinism" because his argument is about the *structure of agency*, not causal chains. He thinks libertarians (who believe in free will + indeterminism) are just as trapped by the Basic Argument as determinists are.

  **7. "...and the upshot, which is why he gets classed with the hard determinists, is that blame and retributive punishment are irrational leftovers of a pre-scientific worldview, and we should move to a purely forward-looking system aimed at deterrence and rehabilitation."**
  *   **Verdict:** **Flatly Denied.**
  *   **Why:** Strawson is agnostic about the practical upshot. He argues that even if UMR is impossible, human beings may be psychologically incapable of abandoning reactive attitudes (blame, resentment, gratitude). He does not prescribe a "forward-looking system." He thinks it is a mistake to assume that proving UMR is impossible automatically tells us how to run the legal system or live our lives. He does not classify himself with hard determinists (see Sentence 6).

  ---

  ### The Two Big Jumps

  Your instinct that the punishment part was a jump is correct. Here is why that section fails as a representation of Strawson:

  **1. The Determinism Confusion**
  Your roommate conflated Strawson with Derk Pereboom or Galen's father, P.F. Strawson. Galen Strawson's specific contribution is showing that *causation* isn't the problem; *self-creation* is. Even if you have magical, non-determined free will, you still didn't choose the nature that chose to use that will. By linking it to "past plus laws of nature," the summary turns it into a standard incompatibilist argument, which Strawson explicitly rejects.

  **2. The Policy Presumption**
  Strawson is a "pessimist" about responsibility but often an "optimist" about life. He argues that realizing we lack UMR might lead to compassion, but he refuses to argue that we *ought* to abolish retributive punishment. He thinks our reactive attitudes might be hardwired. To claim we "should move to a purely forward-looking system" is a normative claim Strawson doesn't make in the context of the Basic Argument. He thinks the link between metaphysical responsibility and legal practice is much looser than your roommate suggests.

  ---

  ### What Is Left Standing?

  If you accept Strawson's argument (as he thinks you must), here is the actual landscape:

  **1. What kind of responsibility remains?**
  *   **Causal Responsibility:** You still caused the action.
  *   **Legal/Social Responsibility:** You can still be held accountable by society. Strawson does not argue for the abolition of courts.
  *   **Moral Agency:** You are still a moral agent who acts on reasons.
  *   **What is lost:** Only **Ultimate Moral Responsibility**. You cannot be the *ultimate* source of your actions in a way that makes you deserving of *ultimate* praise or blame. You are lucky if you are good, and unlucky if you are bad, because you didn't make the self that chose the good or the bad.

  **2. What does he think should happen to blaming and punishing?**
  *   **Short Answer:** He doesn't say.
  *   **Long Answer:** He suggests that understanding the Basic Argument might reduce anger and increase compassion (since people are ultimately unlucky in their constitution). However, he acknowledges that we might not be able to stop feeling blame even if we know it's metaphysically unjustified. He warns against the "theoretical optimism" that thinks solving the metaphysics solves the social practice. He thinks we will likely continue to blame and punish because we are human, even if we know it's not "ultimately" fair.

  ### Summary for Dinner Parties
  If you want to cite Strawson accurately without getting cornered:
  > "Strawson argues that to be truly responsible for your actions, you'd have to be responsible for the character that chose them. But you can't choose your character without already having a character to choose with, so it's an infinite regress. He says this proves 'Ultimate Moral Responsibility' is impossible, regardless of whether determinism is true. However, he doesn't think this necessarily means we should stop blaming people or abolish prisons, because those attitudes might be part of being human."

  This keeps the logic intact but removes the false claims about determinism and legal reform.
