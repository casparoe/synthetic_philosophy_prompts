  Restate Bradley's regress and the unity-of-the-proposition problem as faithfully as you can in the vocabulary I actually use — ASTs, terms and constructors, function application, well-formedness and type checking, contexts and typing judgements, evaluation and reduction, denotations, the gap between a term and its value — and then give me the residue report. Which parts of the philosopher's problem survive the translation cleanly, which only survive if I distort them (say how), and which have no counterpart at all in how programs are built and run? I've got a hunch the residue is the interesting part — that 'truth-evaluable', 'about something', and 'the tie is normative rather than merely syntactic' are exactly what my vocabulary can't say — but I'd rather you tell me where the hunch is wrong than confirm it, and I won't beleive the thing is dissolved just because it sounds tidy. I'm fluent in the PL vocabulary so don't dumb it down; I know only the philosophy I've picked up from friends and podcasts, so flag anywhere I've got the original wrong.

