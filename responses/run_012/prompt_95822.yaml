  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON THE GROUNDS OF PROMISSORY OBLIGATION**

  **Prepared for the Departmental Workshop on Normative Powers and Social Practices**

  **Preamble**
  We, the proponents of the Practice Conception and the proponents of the Principle Conception of promissory obligation, submit this document to frame our upcoming discussion. We acknowledge that decades of debate have often resulted in talking past one another. We agree that the dispute has been characterised by exaggerated dichotomies. While we maintain distinct positions regarding the *source* of the obligation, we agree on the phenomena that require explanation and on the inadequacy of several stock arguments previously deployed by both sides. This document isolates the genuine points of divergence to facilitate productive adjudication.

  ### I. Agreed Claims

  Both camps accept the following propositions as the baseline for this workshop:

  1.  **The Explanandum:** The central phenomenon to be explained is how a voluntary communicative act can alter the normative status of the agents involved, specifically by creating a new obligation where none existed before.
  2.  **Directedness:** We agree that promissory obligations are *directed*. If A promises B, the obligation is owed *to* B, not merely to the world at large or to the moral law in the abstract. This is evidenced by the specific standing B has to complain or to release A.
  3.  **The Role of Intention:** We agree that the promisor must intend to undertake an obligation (or at least intend to invoke a practice that carries one). Accidental utterances or coerced assurances do not generate standard promissory obligations.
  4.  **What the Dispute Is Not About:** We are not debating whether promises ought generally to be kept. Both sides agree that breaking a promise is *prima facie* wrong. We are debating *why* it is wrong and what constitutes the 'promise' in the first place.
  5.  **Failed Arguments:**
      *   **The Practice Camp** abandons the claim that the obligation is *merely* a feeling of expectation or a prediction of sanction. It must account for the normative 'ought'.
      *   **The Principle Camp** abandons the claim that the convention is irrelevant to the *content* of the obligation. We agree that social context determines what counts as promising in a given society.
      *   **Both Camps** reject the argument that 'promise' is a primitive, unanalysable moral concept. Analysis is required.

  ### II. Table of Disagreements

  The following table isolates the four remaining cruxes. For each, we state the neutral issue, how each side formulates its position, the evidence or case study we agree is relevant, and the prediction each side makes regarding that evidence.

  | Crux | Practice Conception Formulation | Principle Conception Formulation | Agreed Evidence / Case Study | Practice Prediction | Principle Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Necessity of Convention** | The obligation is constitutively dependent on a pre-existing social convention. Without the institution, the utterance lacks normative force. | The obligation rests on a moral principle of fidelity or non-manipulation. Convention is evidential or heuristic, not constitutive. | **Case 1 (Improvised Assurance):** Two agents from distinct cultures with no shared institution improvise a binding assurance understood by both as obligatory. | This is not a promise. It is a moral assurance akin to promising, but lacking the specific normative architecture of a promise. | This *is* a promise (or functionally identical). The moral principle binds them regardless of the lack of historical convention. |
  | **2. Direction of Obligation** | The obligation is primarily to uphold the institution; the duty to the promisee is derivative of the duty to the community that sustains the practice. | The obligation is fundamentally interpersonal. It arises from the specific relationship of trust and assurance between promisor and promisee. | **Case 3 (Group Undertaking):** A practice exists where undertakings are made to a group, and only the group can release. An individual is assured but cannot release. | This confirms the view: the obligation runs to the holders of the conventional power (the group). The individual has no special standing. | This is a defective or distinct form of undertaking. In standard promising, the individual *must* have standing. If they don't, the moral relation is incomplete. |
  | **3. Power of Release** | The promisee's power to release the promisor is a rule of the practice. It is a conventional privilege granted to the beneficiary of the undertaking. | The power of release is a consequence of the obligation being owed *to* the promisee. One cannot be owed a duty against one's will (in this context). | **Case 4 (Asymmetry):** The promisee can release unilaterally; the promisor cannot cancel unilaterally. | This asymmetry is a contingent feature of the specific convention of promising. Other conventions might differ. | This asymmetry is a necessary feature of the moral relation. It reflects the promisee's normative authority over the obligation. |
  | **4. Normative Power vs. Moral Trigger** | Promising is the exercise of a normative power conferred by rules. The agent changes their status by invoking the rule. | Promising is a moral trigger. The agent invokes a pre-existing moral principle by creating an expectation they intend to be binding. | **Case 2 (Faulty Description/Clasp):** A community requires formula + clasp. A newcomer uses formula only. A veteran uses formula only (no clasp, no intent). Who is bound? | The veteran is not bound (failed to follow rule). The newcomer is not bound (failed to invoke rule correctly). The practice fixes the content. | The veteran may be bound if they created the expectation intentionally. The newcomer might be bound if the moral principle of assurance is triggered by the utterance alone. |

  ### III. Analysis of the Dispute

  **1. The Verbal Dispute**
  We acknowledge that a portion of the disagreement is verbal. Specifically, it concerns the definition of the term 'promise'.
  *   **The Practice Camp** defines 'promise' as an act within an institution. Therefore, by definition, no institution means no promise.
  *   **The Principle Camp** defines 'promise' as a voluntary assurance that creates a directed obligation. Therefore, if the moral effect is present, the promise is present.
  *   **Resolution:** We agree to distinguish between **'Institutional Promising'** (the social tool) and **'Moral Promising'** (the interpersonal obligation). The dispute is not whether Institutional Promising exists (it does), nor whether Moral Promising exists (it does). The dispute is whether Institutional Promising is *necessary* for Moral Promising.

  **2. Conditions for Abandoning Positions**
  *   **The Practice Camp** would abandon its position if it were demonstrated that the directedness of the obligation (the specific standing of the promisee) cannot be derived from the rules of a practice without smuggling in independent moral principles about interpersonal respect.
  *   **The Principle Camp** would abandon its position if it were demonstrated that the specificity of promissory obligation (why *this* utterance binds and a similar assurance does not) cannot be explained without reference to the specific conventions that give the utterance its meaning.

  **3. What Would Move the Debate**
  Both sides agree that the debate turns on **Crux 3 (The Power of Release)**.
  *   If the Practice Camp can explain the unilateral power of release solely as a convenient rule of the institution (without referencing the promisee's moral authority), their view stands.
  *   If the Principle Camp can show that the power of release is *conceptually tied* to the nature of the obligation being owed (such that a convention denying release would be morally defective), their view stands.
  *   **Agreed Test:** We will focus our workshop on whether a convention could coherently exist where promises are binding but *cannot* be released by the promisee. If such a convention is conceptually possible, the Practice View gains ground. If it is morally incoherent, the Principle View gains ground.

  ***

  ### Meta-Commentary and Confidence Assessment

  **Confidence in Agreed Claims**
  I am **highly confident** (approx. 90%) in the stability of Section I (Agreed Claims). These represent the standard 'common ground' in contemporary meta-ethics regarding promising. Most sophisticated defenders of both Humean and Scanlonian lines accept that promises are voluntary, directed, and distinct from mere predictions. The rejection of 'primitive' concepts is also standard analytic fare.

  **Confidence in Verbal Dispute Verdict**
  I am **moderately confident** (approx. 75%) in the diagnosis in Section III.1. While there is certainly a verbal element regarding the label 'promise', philosophical disputes of this longevity rarely dissolve *entirely* into terminology. There is a substantive metaphysical disagreement about whether normative powers can exist without social ontology. However, framing it as 'Institutional' vs. 'Moral' promising is a standard and effective way to clear the undergrowth.

  **Confidence in 'What Would Move the Debate'**
  I am **moderately confident** (approx. 70%) that the Power of Release (Crux 3) is the correct pivot point. This aligns with your hypothesis regarding the direction of obligation. However, some Practice theorists might argue that the power of release is just another rule, and its 'moral' feel is an illusion.

  **Least Sure Point**
  The single point in this document I am **least sure of** is the **Practice Camp's Formulation in Crux 2 (Direction of Obligation)**.
  *   *The Claim:* "The obligation is primarily to uphold the institution; the duty to the promisee is derivative..."
  *   *The Uncertainty:* Modern Practice theorists (following Rawls or Searle rather than strict Hume) often argue that the practice *constitutes* the directed duty, rather than the duty being to the institution *first*. They might reject the formulation that the duty is to the community *rather than* the promisee, arguing instead that the practice creates a 'role' wherein the duty is to the promisee *by convention*.
  *   *Why it matters:* If the Practice Camp can successfully argue that conventions can create *sui generis* directed duties without relying on independent moral principles of interpersonal assurance, the 'narrowing' of the dispute you propose becomes harder to sustain. The Practice View might be able to swallow the 'directedness' intuition whole, leaving the Principle View with less unique explanatory work to do. I have framed it in the table as a 'derivative' duty to make the contrast sharp, but a sophisticated Practice theorist might object to that specific wording during the workshop.

  **Confidence in Case Studies**
  I am **highly confident** that the four cases selected (Improvised, Clasp, Group, Asymmetry) are the correct stress tests. They isolate convention, intent, directionality, and normative power respectively.

  **Overall Confidence in Document Utility**
  I am **highly confident** this document will serve your thesis chapter well. It operationalises your suspicion that the dispute is narrower than it appears by forcing both sides to concede the 'Directedness' and 'Voluntariness' constraints, leaving only the *source* of those features in contention.
