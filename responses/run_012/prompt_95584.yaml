answer: |-
  # Procedure for the Aggregation of Ranked Ballots
  **Document Status:** Standing Order for the Annual Prize
  **Authority:** Returning Officer
  **Review Cycle:** Every five years or upon constitutional amendment

  ## 1. Preamble and Pre-commitment
  In accordance with the principles of procedural fairness and acknowledging Arrow's Impossibility Theorem (which proves that no ranked voting system can simultaneously satisfy all desirable fairness criteria), this procedure adopts **Instant Runoff Voting (IRV)**, also known as the Alternative Vote. This system is selected for its balance of administrative simplicity (feasible for a volunteer with pen and paper) and its guarantee that the winner commands a majority of support among non-eliminated candidates.

  **Mandatory Pre-commitment:**
  Before any ballot is opened, the Returning Officer must publish and fix the following:
  1.  **The Rule:** This IRV procedure.
  2.  **The Tie-Break Mechanism:** In the event of a tie for elimination or victory, the decision shall be made by **random lot** (e.g., drawing names from a hat or a coin toss) conducted by the Returning Officer in the presence of two independent tellers.
  3.  **The Elimination Order:** If multiple candidates are tied for the lowest vote count, all tied candidates are eliminated simultaneously. If this eliminates all remaining candidates, the random lot decides the winner among them.
  4.  **Transparency Protocol:** Final tallies per round shall be published. Individual ballots shall **not** be published to protect voter anonymity and prevent coercion, but shall be retained for audit for 12 months.

  ---

  ## 2. The Counting Procedure

  **Step 1: Validation and First Preference Count**
  *   **Action:** Verify all ballots are valid (rankings are clear and unambiguous). Count the number of first-preference votes for each candidate.
  *   **Test:** Does any candidate have more than 50% of the valid first-preference votes?
  *   **Decision:**
      *   **Yes:** Declare that candidate the Winner. Stop.
      *   **No:** Proceed to Step 2.
  *   **Theoretical Note:** This satisfies the *Majority Criterion*. However, it sacrifices the *Independence of Irrelevant Alternatives (IIA)*. The presence of a non-winning candidate can alter the outcome between two others by splitting the vote.

  **Step 2: Elimination**
  *   **Action:** Identify the candidate with the fewest first-preference votes.
  *   **Test:** Is there a tie for the fewest votes?
  *   **Decision:**
      *   **No:** Eliminate that candidate.
      *   **Yes:** Invoke the **Pre-commitment Tie-Break Mechanism**. The Returning Officer decides which of the tied candidates to eliminate via random lot.
      *   **Cost:** This sacrifices *Determinism* for *Neutrality*. A deterministic rule (e.g., "alphabetical order") would favour candidates with names earlier in the alphabet. Randomisation treats all candidates equally but introduces chance.
  *   **Theoretical Note:** This step risks violating the *Monotonicity Criterion*. It is theoretically possible that ranking a candidate higher on some ballots could cause them to be eliminated earlier in a subsequent count.

  **Step 3: Transfer of Votes**
  *   **Action:** Take all ballots where the eliminated candidate was ranked first. Transfer each ballot to the highest-ranked candidate on that specific ballot who has not yet been eliminated.
  *   **Test:** Are there any ballots where all ranked candidates have been eliminated (exhausted ballots)?
  *   **Decision:**
      *   **Yes:** Set these ballots aside. They no longer count towards the total.
      *   **No:** Proceed to Step 4.
  *   **Cost:** This sacrifices *Universal Domain* in practice (as exhausted ballots reduce the effective electorate), though the rule accepts all input. It prioritises *Majority Support* over *Participation Consistency*.

  **Step 4: Recount and Iterate**
  *   **Action:** Recount the votes.
  *   **Test:** Does any remaining candidate now have more than 50% of the *remaining valid votes*?
  *   **Decision:**
      *   **Yes:** Declare that candidate the Winner. Stop.
      *   **No:** Return to Step 2.
  *   **Theoretical Note:** This ensures the winner is acceptable to a majority of the *active* voters, but it fails the *Condorcet Criterion*. A candidate who would beat every other candidate in a head-to-head matchup (the Condorcet Winner) may be eliminated early if they lack first-preference support.

  ---

  ## 3. Application to Ballot Profiles

  Below is the execution of the procedure on the provided profiles, compared against two rival rules: **Plurality** (most first-place votes wins) and **Borda Count** (points assigned by rank; for *n* candidates, 1st = *n*-1 points, last = 0).

  ### Profile 1
  **Ballots (9 Voters):** 4 × (A > B > C), 3 × (B > C > A), 2 × (C > B > A).
  **Returning Officer Preference:** C.

  | Stage | IRV Action | Tally (A / B / C) | Result |
  | :--- | :--- | :--- | :--- |
  | **Round 1** | Count 1st prefs | A: 4, B: 3, C: 2 | No majority (need 5). Eliminate C. |
  | **Round 2** | Transfer C's 2 votes to B (next available). | A: 4, B: 5 | **B wins** (Majority reached). |

  **Rival Rule Results:**
  *   **Plurality:** **A wins** (4 votes vs 3 vs 2).
  *   **Borda Count:** B scores 12, A scores 8, C scores 7. **B wins**.
  *   **Condorcet Check:** B beats A (5-4) and C (7-2). B is the Condorcet Winner.

  **Conflict Flag:**
  *   **Procedure Result:** B.
  *   **Officer Preference:** C.
  *   **Status:** **CONFLICT.** The procedure rejects your preference. Candidate C has the fewest first-place votes and is eliminated immediately. To override this would violate the pre-committed rule and the Majority Criterion.

  ### Profile 2
  **Ballots (12 Voters):** 4 × (A > C > B > D), 3 × (B > A > C > D), 2 × (C > B > A > D), 3 × (D > C > A > B).
  **Returning Officer Preference:** D.

  | Stage | IRV Action | Tally (A / B / C / D) | Result |
  | :--- | :--- | :--- | :--- |
  | **Round 1** | Count 1st prefs | A: 4, B: 3, C: 2, D: 3 | No majority (need 7). Eliminate C (lowest). |
  | **Round 2** | Transfer C's 2 votes to B (next available). | A: 4, B: 5, D: 3 | No majority. Eliminate D (lowest). |
  | **Round 3** | Transfer D's 3 votes. (D>C>A>B; C eliminated, so to A). | A: 7, B: 5 | **A wins** (Majority reached). |

  **Rival Rule Results:**
  *   **Plurality:** **A wins** (4 votes vs 3 vs 3 vs 2).
  *   **Borda Count:** A scores 23, C scores 23, B scores 17, D scores 9. **Tie (A/C)**. Requires tie-break.
  *   **Condorcet Check:** A beats B (9-3), A beats C (7-5), A beats D (9-3). A is the Condorcet Winner.

  **Conflict Flag:**
  *   **Procedure Result:** A.
  *   **Officer Preference:** D.
  *   **Status:** **CONFLICT.** The procedure rejects your preference. Candidate D has strong niche support (3 first-place votes) but is broadly unacceptable as a lower preference on other ballots. Under IRV, D lacks the coalition building to survive elimination rounds.

  ---

  ## 4. Limitations and Defensibility

  You asked what this procedure cannot do. As Returning Officer, you must be prepared to articulate these limitations in writing to the membership.

  ### 1. Correctness vs. Value
  **Can the procedure tell you that the choice of rule is a matter of value rather than correctness?**
  **Yes.** You must state explicitly: *"There is no mathematically 'correct' winner in a multi-candidate election."*
  Arrow's Impossibility Theorem proves that any system must fail at least one fairness criterion.
  *   By choosing IRV, we value **Majority Legitimacy** (the winner should not be hated by more than half the voters) over **Consistency** (the ranking of A vs B should not change if C drops out).
  *   Had we chosen Borda, we would value **Consensus** (broad acceptability) over **Majority** (a candidate could win without ever being anyone's first choice).
  *   **Defence:** If challenged, do not defend the *result* as "true"; defend the *process* as "agreed". The winner is not the "best" candidate in an objective sense, but the candidate who best satisfies the specific mathematical constraints we agreed upon beforehand.

  ### 2. Protection Against a Biased Panel
  **Can it protect the outcome from a panel that has already decided whom it wants?**
  **No.**
  This is the consequence of the **Gibbard-Satterthwaite Theorem**. Any ranked voting system with three or more candidates is susceptible to tactical voting.
  *   **The Risk:** If the panel colludes, they can "bury" a strong candidate by ranking them last, or "clone" a candidate by introducing a similar decoy to split the vote (though IRV is more resistant to cloning than Plurality).
  *   **The Limit:** This procedure assumes **honest voting**. It aggregates preferences; it does not verify sincerity. If the panel members vote strategically rather than according to their true judgement, the procedure will faithfully aggregate their strategy.
  *   **Mitigation:** The only protection is the **Publication of Tallies**. By publishing the round-by-round counts (as mandated in Section 1), you allow the membership to spot anomalies (e.g., if a popular candidate is eliminated in Round 1 despite broad support, it may suggest tactical burying). However, you cannot invalidate the result based on suspicion of strategy without proof, as strategy is indistinguishable from genuine preference in a secret ballot.

  ### 3. The Officer's Preference
  **Can you intervene if the result contradicts your preference?**
  **No.**
  As demonstrated in both Profiles, the procedure may yield a result (B and A respectively) that contradicts your personal preference (C and D).
  *   **Cost:** You sacrifice **Discretion** for **Integrity**.
  *   **Defence:** If you override the count to install your preferred candidate, you convert the prize from a competitive award into an appointment. This invites greater challenge than a "unlucky" result under a neutral rule. You must accept that the role of Returning Officer is to administer the rule, not to correct its output.

  ## 5. Summary of Instructions for the Volunteer
  1.  **Fix the rules** (IRV, Random Tie-Break) before opening envelopes.
  2.  **Count** first preferences. If >50%, stop.
  3.  **Eliminate** the lowest. If tied, toss a coin.
  4.  **Transfer** votes to the next available preference.
  5.  **Repeat** until a majority is found.
  6.  **Publish** the round totals.
  7.  **Announce** the winner, acknowledging the rule, not the merit.

  *Signed,*
  *Returning Officer*
