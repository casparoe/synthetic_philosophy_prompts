      *   The "Rex/Rexy" case is a specific variant often used to argue for **Mental Files** over traditional Senses.

  7.  **Refining the "Bet":**
      *   The "Rex/Rexy" stipulation is the strongest clue. It mirrors arguments made by **François Recanati** (Mental Files) or **Gareth Evans** (Demonstrative Identification).
      *   If she were a standard Descriptivist, "Hesperus is the Evening Star" wouldn't be "boring" in a different way; it would be the paradigm.
