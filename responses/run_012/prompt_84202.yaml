          *   *Refinement:* If she's a Fregean about Sense, she might say the *sense* is grasped, but reference fails, so no truth value.

      *   **Case 3: Ignorant Hearer.** "Hesperus is Phosphorus" told to someone who doesn't know what either names.
          *   *Fregean:* They grasp the senses but don't know the references. They learn the *identity of the senses*? No, they learn the names co-refer. But do they grasp the thought? Yes, they understand the words. Do they learn something definite? They learn that the two *names* pick out the same thing, but they don't know *what* thing.
          *   *Millian:* They can't grasp the proposition because they can't grasp the constituents (the objects).
          *   *Prediction:* This is the hardest one. If she's Fregean, they grasp the *sense* without knowing the *reference*. So they can grasp the claim. They learn the co-reference of the *names/senses*. If she's Millian, they can't grasp the singular proposition.
          *   *Key Distinction:* Does she think you need to know the object to understand the name? (Acquaintance).

  4.  **Synthesizing the Professor's Profile:**
      *   She distinguishes "a=a" from "a=b".
