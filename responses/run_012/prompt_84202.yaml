      *   *Case 3 (Ignorant):* They **grasp the claim** but it's **hollow** or they learn **co-reference of names** without knowing the object. *Correction:* If she's a strict Fregean, you can grasp the Sense without knowing the Reference. So they grasp the claim. They learn that the two *modes of presentation* pick out the same object.
