  3.  **Evaluate the Three Test Cases:**

      *   **Case 1: Expert Hearer.** "Hesperus is Phosphorus" told to someone who already knows it.
          *   *Fregean:* The sense is the same, but for *this hearer*, the cognitive value is null. It tells *them* nothing. (Informativeness is hearer-relative).
