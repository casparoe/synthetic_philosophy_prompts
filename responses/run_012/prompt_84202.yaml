      *Analysis of the "Rex/Rexy" case:* This is the smoking gun. If names were just tags (Millianism), "Rex is Rexy" should be informative if the names are distinct, just like "Hesperus is Phosphorus." But the professor says it's trivial. Why? Because the *mode of presentation* or the *cognitive significance* was fixed simultaneously. This points strongly towards a **Fregean** or **Neo-Fregean** view (Sense/Reference distinction), specifically one where the "Sense" is tied to the *way the name was introduced* or the *file* associated with it.
