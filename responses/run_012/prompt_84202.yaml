      *   *Most probable theory:* **Fregeanism (Sense/Reference)** or **Mental Files**.
      *   *Why not Millianism?* A Millian struggles to explain why "Rex is Rexy" is trivial without appealing to pragmatics. If she says it "tells you nothing" *semantically* (implied by "know it without checking"), she's likely Fregean. A Millian says all identity statements between names are semantically trivial; the difference is purely pragmatic. The professor seems to treat the difference as more robust (linked to how names were acquired).
