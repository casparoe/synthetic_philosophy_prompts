prompt: |-
  Ok so I'm sitting in on a philosophy of language seminar as a visitor this term and the prof keeps handing down verdicts on identity statements, and I want to work out what she's actually running before next week's class. Her list so far: "Hesperus is Hesperus" tells you nothing and you know it without checking anything. "Hesperus is Phosphorus" tells you something, and you can't get it just by understanding the words. "Cicero is Tully" tells you something. "Mark Twain is Samuel Clemens" tells you something. But "Rex is Rexy" — where she coined both names for her own dog herself, in one go — tells you nothing. And "Hesperus is the evening star" tells you something too, though she says that one's the boring case, because the second half just describes the thing, so of course there's something to learn. She also keeps insisting the Hesperus/Phosphorus business isnt a difference in what the two names are about.

  Next week she's putting up three more and I want to guess her line on each before she does. (1) The same sentence again, but the hearer is someone who's known for years that both names name Venus — does she say it still tells them something, or nothing? (2) "Vulcan is the planet orbiting inside Mercury's orbit," Vulcan being the planet astronomers used to think was there and which turns out not to be there — does she say that's false, or that it doesn't manage to say anything true or false at all? (3) The Hesperus/Phosphorus sentence told to someone who doesn't know which object either name names — does she say they've learned something definite (namely, that the two names co-refer), or that they can't really grasp the claim at all?

  So: what's the rule she's running, what other rules fit her list just as well, what does each of those predict for my three cases, which one do you actually bet on and why, and which of the three would best tell the candidate rules apart? And please be upfront about which bits of this are settled among people who work on it and which are genuinely contested — don't hand me one camp's line as if it were the consensus.
