      *   *Refinement:* Needs to be punchy and address the prompt's dichotomy directly.
      *   *Final Choice:* Modern patent law presupposes a pragmatic, utilitarian fiction of individual authorship designed to incentivize disclosure and investment, rather than a metaphysical claim that inventions inhere uniquely in specific minds.

  3.  **Reconstructing the Implicit Theory:**
      *   The system needs to encourage *disclosure* and *investment*.
      *   To do this, it needs a clear owner.
      *   "First-to-file" is an administrative bright line.
      *   "Non-obviousness" is a quality control to prevent monopolies on things that would happen anyway (economic waste).
      *   *Theory:* Incentive Theory / Utilitarianism. It's not about "natural rights" (Lockean labor theory) primarily, though that rhetoric is used. It's about social benefit.

  4.  **Distinguishing "Strictly Requires" vs. "Merely Fits":**
      *   *Requires:* A determinate owner for the sake of transaction costs and enforcement. A threshold of novelty/non-obviousness to prevent stifling normal progress.
