answer: |-
  Modern patent law presupposes a pragmatic, utilitarian fiction of individual authorship designed to incentivize disclosure and investment, rather than a metaphysical claim that inventions inhere uniquely in specific minds.

  The implicit theory is instrumentalist: the state grants a temporary monopoly not because the inventor has a natural right to the idea, but because society benefits from the public disclosure and commercial development that the monopoly secures. The "first-to-file" rule is strictly required to minimize transaction costs and litigation over who thought of what when; it provides an administrative bright line where epistemic boundaries are blurry. This practice strictly requires only that a determinate agent be identifiable for the sake of contract and enforcement, not that this agent be the sole causal source of the invention. Consequently, the system merely fits the cultural narrative of the "lone genius" without depending on its truth; the rhetoric of individual ownership masks the collective nature of technological progress to make the property right intelligible to markets.

  This framework quietly rules out three rival views. First, it rejects strong natural-law theories that would grant perpetual ownership based on labor mixing, as patents expire and require maintenance. Second, it excludes scientific communism or immediate open-source norms, which would treat knowledge as a public good from the moment of conception. Third, it denies hard technological determinism; if inventions were truly inevitable regardless of human action, the incentive to file would vanish, so the law must act *as if* human agency accelerates or enables specific reductions to practice.

  If simultaneous discovery were treated as the normal case rather than a curiosity, the economic logic of exclusion would collapse, necessitating a shift from property rights to liability rules or prize systems. Instead of the right to exclude, inventors might receive government bounties or compulsory licensing fees, acknowledging that while the *reduction to practice* deserves reward, the *knowledge itself* was ripe for picking by multiple actors. The current system treats simultaneous invention as an anomaly to be resolved by a race; treating it as the norm would admit that the "inventor" is merely the lucky winner of a stochastic process, undermining the moral justification for exclusive control.

  Among historians and legal scholars, certain facts are settled while theoretical interpretations remain contested. It is settled that patent statutes are positive law subject to legislative change, that the "person skilled in the art" is a legal construct rather than a real demographic, and that near-simultaneous invention is a recurrent historical phenomenon (e.g., Newton/Leibniz, Bell/Gray). It is genuinely contested whether the current patent term and scope actually maximize social welfare across all industries, particularly in software and biotechnology. It is also contested whether the "non-obviousness" standard is applied consistently enough to prevent the monopolization of incremental, inevitable progress. Finally, while the utilitarian justification is the dominant legal theory, there is ongoing debate over whether the system inadvertently privileges large entities over individual inventors, contradicting its stated purpose of promoting progress.
