          5.  Address the "Guilt Design."
          6.  Offer a path forward (Redefining "Keep an eye").

  8.  *(Final check against constraints)*: The user wants to know *what* is binding them. I need to be specific. Is it a moral object? A psychological tether? It's a *relational tether*.

      *   *Key phrase to include:* "The promise isn't a chain; it's a bridge."
      *   *Key distinction:* Obligation to the *task* vs. Obligation to the *person*.

      *(Self-Correction)*: Wait, if Ruth said "Don't do it out of guilt," does keeping it out of "fidelity" count as guilt? No. Guilt is "I'm bad if I don't." Fidelity is "This is who I am in relation to her." That's the distinction.

      *   *Final thought:* The user is allowed to renegotiate the terms. "Keeping an eye" is vague. The binding part is the *intent*, not necessarily the specific execution if it becomes destructive.

