answer: |-
  You are absolutely right to be suspicious. Your friend has committed the classic "Fatalist Fallacy": conflating *semantic bivalence* (every statement is true or false) with *causal determinism* (physics forces one outcome) and *logical necessity* (it couldn't be otherwise). In the trade, we call this sliding from "It is true that p" to "It is necessary that p." That slide is the entire engine of the Sea Battle argument, and most modern logicians reject it.

  Your friend also conflated the *metaphysics* of time (is the future open?) with the *semantics* of language (does 'will' pick out a specific future?). You can have an open future and bivalence (Ockhamism), or a fixed future and truth-value gaps (some epistemic views, though rare).

  Here is the map of the logical space, drawn from the perspective of tense logic and formal semantics. I've structured this as a decision tree based on the "joints" you asked for, followed by the specific positions, the empty slots, and the state of play.

  ### Part 1: The Axes of Disagreement
  Before we hit the tree, here are the four dimensions your friend collapsed. A position is defined by where it lands on these four lines:

  1.  **Metaphysics of Time:** Is the future a single, settled line (Linear), or a branching tree of genuinely possible alternatives (Branching)?
  2.  **Bivalence at Utterance:** Does a prediction made *today* ("There will be a sea battle tomorrow") have a classical truth value (True/False) *right now*, or does it lack one/has a third value?
  3.  **Semantics of 'Will':** Is *will* a pure tense (locating an event in time, like *past*) or a covert modal (quantifying over possibilities, like *might* or *must*)?
  4.  **Assessment Sensitivity:** Is truth determined solely at the moment of speaking (Context of Utterance), or can it shift depending on when/if someone evaluates it later (Context of Assessment)?

  ---

  ### Part 2: The Decision Tree
  *Follow the path based on your intuitions about the concrete cases.*

  **START:** You place a bet today: "There will be a sea battle tomorrow."
  *(Note: We are assuming causal determinism is FALSE for this tree. If you think physics forces the battle, you skip to Logical Determinism.)*

  **NODE 1: Is the future metaphysically "open"?**
  *   **No (Linear):** The future is a single line. There is only one physically possible tomorrow, even if we don't know it.
      *   → **LEAF A: Logical Determinist / Fatalist**
  *   **Yes (Branching):** There are genuinely multiple possible futures. The sea battle happens on some branches, not on others.
      *   → **GO TO NODE 2**

  **NODE 2: Does your bet have a truth value (True/False) *right now*?**
  *   **No:** It is neither true nor false yet. The world hasn't "decided."
      *   → **GO TO NODE 3**
  *   **Yes:** It is already true or already false, even though the future is branching.
      *   → **GO TO NODE 4**

  **NODE 3: (If No Truth Value) Why not?**
  *   **Option A:** The sentence is meaningful but lands in a "truth-value gap" or gets a third value (e.g., "Possible").
      *   → **LEAF B: Three-Valued Logician (Łukasiewicz)**
  *   **Option B:** The sentence is indeterminate because it's true on some branches and false on others, and we don't privilege any branch yet.
      *   → **LEAF C: Supervaluationist**
  *   **Option C:** The sentence *does* have a truth value, but only relative to a future time when someone checks it. Right now, it's assessment-sensitive.
      *   → **LEAF D: Relativist (MacFarlane-style)**
  *   **Option D:** The sentence is actually False. To say "It will happen" means "It *must* happen." Since it's not necessary, the claim is false.
      *   → **LEAF E: Peircean**

  **NODE 4: (If Yes Truth Value) How do we pick which one?**
  *   **Option A:** Truth is relative to a specific history. "True" means "True in the history we are currently speaking in." There is no "God's eye" actual future, just the one we occupy.
      *   → **LEAF F: Ockhamist**
  *   **Option B:** One branch is metaphysically privileged as "The Actual Future" (The Thin Red Line), even if it looks like the others from here.
      *   → **LEAF G: Thin Red Line Theorist**

  ---

  ### Part 3: The Leaves (Positions & Costs)
  *Every philosophical position has a price. Here is the bill for each.*

  **LEAF A: Logical Determinist / Fatalist**
  *   **View:** Linear time + Bivalence. "It is true now" implies "It is necessary now."
  *   **Concrete Case:** If you bet on the battle, you didn't really have a choice; the truth of your bet was fixed 1,000 years ago.
  *   **Embarrassing Commitment:** **Deliberation is an illusion.** If the proposition is already true, your reasoning cannot causally influence the outcome. You are a passenger in time.

  **LEAF B: Three-Valued Logician (Łukasiewicz)**
  *   **View:** Branching time + Truth-value gaps (or a 3rd value: "Possible").
  *   **Concrete Case:** Your bet is neither won nor lost today; it is "indeterminate."
  *   **Embarrassing Commitment:** **Logic breaks.** The Law of Excluded Middle ("Either there will be a battle or there won't") fails. You have to accept that $P \lor \neg P$ is not always true, which makes standard proof techniques explode.

  **LEAF C: Supervaluationist**
  *   **View:** Branching time + Bivalence fails for contingents. A statement is "Super-true" only if it is true on *all* possible branches.
  *   **Concrete Case:** "There will be a battle" is indeterminate. But "Either there will be a battle or there won't" is Super-true (because it holds on all branches).
  *   **Embarrassing Commitment:** **Existential generalization fails.** You can't infer "Something will happen" from "The battle will happen" if the battle is contingent. It creates a gap between local truth and global logic.

  **LEAF D: Relativist (Assessment-Sensitive)**
  *   **View:** Branching time + Truth depends on *when* you assess it. At utterance: no value. At tomorrow: True or False.
  *   **Concrete Case:** Your bet today was not "true," but if the battle happens, your friend assessing your bet tomorrow can correctly say, "You spoke truly."
  *   **Embarrassing Commitment:** **Truth is unstable.** The same sentence, uttered by the same person, can be "not true" at 10 AM and "true" at 10 AM the next day without the sentence changing meaning.

  **LEAF E: Peircean**
  *   **View:** Branching time + 'Will' is a modal meaning "Necessarily will."
  *   **Concrete Case:** You say "There will be a battle." Since the battle is contingent (it might not happen), your statement is simply **False**. You should have said, "There might be a battle."
  *   **Embarrassing Commitment:** **We speak falsely constantly.** Almost all ordinary future predictions ("I will meet you for coffee") come out false because they aren't metaphysically necessary. It saves logic by sacrificing language.

  **LEAF F: Ockhamist**
  *   **View:** Branching time + Bivalence + 'Will' is a tense. Truth is history-relative.
  *   **Concrete Case:** Your bet is True *in this history*. We evaluate statements from the perspective of the history we are in.
  *   **Embarrassing Commitment:** **The "Actual" is indexical.** There is no metaphysical fact that makes *this* branch the real one other than the fact that we are on it. It feels like it dodges the question of what makes the future *real*.

  **LEAF G: Thin Red Line (TRL)**
  *   **View:** Branching time + Bivalence + One branch is privileged as "The Future."
  *   **Concrete Case:** Your bet is True because, unbeknownst to you, the branch where the battle happens is the "Thin Red Line" of actuality.
  *   **Embarrassing Commitment:** **Metaphysical Magic.** You have to posit a fact about the world (which branch is red) that makes no causal difference and is undetectable from the inside. It looks like determinism disguised as branching time.

  ---

  ### Part 4: Empty Slots & Indistinguishable Pairs

  **Indistinguishable Pairs (The "Formalism Only" Disputes)**
  1.  **Ockhamist vs. Thin Red Line:** For almost every practical case (bets, prophecies, daily planning), these two yield the exact same truth values.
      *   *The Difference:* Ockhamists say "True relative to this history." TRL theorists say "True simpliciter because this history is *The* History."
      *   *Why it matters:* Only if you believe God (or a time traveler) needs to know *which* future is actual *before* it happens. If you are a human making a bet, you can't tell them apart.
  2.  **Supervaluationist vs. Relativist:** Both deny bivalence at the moment of utterance.
      *   *The Difference:* Supervaluationists say the sentence is indeterminate *simpliciter*. Relativists say it's indeterminate *at utterance* but determinate *at assessment*.
      *   *Why it matters:* In a court of law or a bet, the Relativist can say "I was right" after the fact. The Supervaluationist has to say "It turned out true, but my statement wasn't true then."

  **Empty Slots (Incoherent or Undefended)**
  1.  **Linear Metaphysics + No Bivalence:**
      *   *Status:* **Unattractive/Empty.** If the future is a single settled line (Linear), why would a statement about it lack a truth value? Usually, this position is only held by *Epistemic* theorists who think the truth exists but we can't know it. But as a semantic view, it's unmotivated. If there's only one future, the proposition corresponds to it or it doesn't.
  2.  **Branching Metaphysics + 'Will' as Simple Tense + No Bivalence:**
      *   *Status:* **Incoherent.** If 'will' just points to a time (like *past*), and there are multiple times/futures, the reference fails. You *must* either add a modal (Peircean), pick a branch (Ockhamist/TRL), or accept gaps (Supervaluationist). You can't have branching time with simple tense semantics and expect sentences to function normally.
  3.  **Causal Determinism + Relativism:**
      *   *Status:* **Undefended.** If the future is causally fixed, there is no need for assessment-sensitivity to save openness. You might as well be a Logical Determinist. Relativism is a tool specifically designed to save Bivalence in an *open* future.

  ---

  ### Part 5: Settled vs. Contested (The State of Play)

  **What is Settled (among specialists):**
  1.  **The Fatalist Slide is Invalid:** Everyone who works on this (except hard determinists) agrees that "It is true that p" does not logically entail "It is necessary that p." Your friend's main premise is rejected by 95% of tense logicians.
  2.  **Branching Time is Coherent:** The formal logic of branching time (developed by A.N. Prior) is mathematically sound. It is a valid model for "open future."
  3.  **Aristotle is Ambiguous:** There is **no consensus** on what Aristotle actually believed in *De Interpretatione* 9. Some read him as a Three-Valued Logician (Leaf B), some as a Supervaluationist (Leaf C), and some think he was just confused. Do not let your friend cite Aristotle as a trump card; Aristotle is the battleground, not the judge.

  **What is Genuinely Contested:**
  1.  **The Semantics of Natural Language 'Will':** Linguists and philosophers are still fighting over whether English *will* behaves more like the Peircean *necessarily* or the Ockhamist *tense*. Data from conditionals ("If it rains, I will stay inside") suggests it's modal, but data from bets suggests it's bivalent.
  2.  **The Thin Red Line:** Many logicians find the TRL metaphysically bloated (Leaf G's embarrassing commitment). Others argue it's the only way to make sense of divine foreknowledge or precise predictions.
  3.  **Relativism vs. Contextualism:** This is the hottest current debate. Does truth shift with the assessor (Relativism), or does the context of speaking fix a hidden parameter we just don't see (Contextualism/Ockhamism)?

  ### Summary for Your Argument
  Tell your friend this:
  1.  **He is conflating semantics with metaphysics.** You can have bivalence (statements are true/false) without determinism (the future is fixed). That is the **Ockhamist** position.
  2.  **He is ignoring the cost.** If he chooses the "Fixed Future" (Logical Determinism), he buys the embarrassing commitment that his deliberation about the sea battle is causally inert.
  3.  **The "Sea Battle" isn't a proof.** It's a dilemma. Most modern logicians choose to keep the future open (Branching) and adjust the semantics (Ockhamist or Relativist) rather than accept Fatalism.

  If he insists on Fatalism, ask him: "If it's already true I'll drink coffee tomorrow, can I causally bring it about that I *don't*?" If he says yes, he's not a Fatalist, he's an Ockhamist. If he says no, he's denied free will. Make him pick.
