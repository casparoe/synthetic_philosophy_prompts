answer: |-
  ### Design Notes & Brainstorming

  **The Core Tension:**
  Hofstadter's satire works because it exploits the *pretense* of neutrality. The reader accepts "man" as "everyone" until "white" is substituted, at which point "white" clearly means "not black." The pedagogical goal here is to make that shift visceral.

  **Critique of Your Keys:**
  *   **Key B (Race Swap):** This is the hammer. It will work, but it carries high affective load. Students may react politically ("This is racist") rather than linguistically ("This reveals exclusion"). You must frame this as a *logical stress test*, not a political accusation.
  *   **Key A (Neologism Swap):** This is the microscope. It isolates the grammatical structure from the social history. If "Blip" feels awkward but "White" feels offensive, you can distinguish between *grammatical markedness* and *social exclusion*.
  *   **The Risk:** Key A is mechanically complex. If students spend 15 minutes figuring out whether "shimself" goes here or there, the semantic point is lost. The instructions must be airtight.
  *   **The Sorting Task:** The danger is consensus. If everyone agrees "Mankind" $\rightarrow$ "Whitekind" is **Different (D)**, the debate dies. The friction needs to come from the borderline cases (e.g., "A good doctor treats his patients" $\rightarrow$ "A good white treats his patients"). Is that nonsense? Or just ugly? That's where the philosophy lives.

  **What This Activity Cannot Do:**
  Hofstadter's piece relied on a sustained *voice*—the dry, bureaucratic tone of a policy column that made the exclusion sound reasonable. Isolated sentences lack that institutional weight. You will have to supply the context of *authority* in the debrief. The activity shows the *exclusion*; you must explain the *power*.

  ---

  ### Lesson Plan: The Neutrality Test

  **Time:** 75 Minutes
  **Class Size:** 16 Students (8 Pairs)
  **Materials:**
  *   8 Sets of Index Cards (12 cards per set).
  *   8 Sets of Key Cards (Key A and Key B).
  *   Whiteboard/Blackboard divided into three columns: **S (Same)**, **D (Different)**, **X (Nonsense)**.
  *   Markers.

  #### 1. Timeline

  *   **00:00 – 00:10 (10 min):** Introduction & Distribution. Set the frame. Do not mention Hofstadter.
  *   **00:10 – 00:30 (20 min):** Transformation Phase. Pairs apply Key A and Key B to their half-deck.
  *   **00:30 – 00:50 (20 min):** The Sort & Debate. Pairs place cards on the board. Class argues the borderline cases.
  *   **00:50 – 01:15 (25 min):** The Reveal & Debrief. Connect activity to linguistic theory.

  #### 2. Materials List (Prepared by Instructor)

  **The Deck (12 Cards per set):**
  *I have cut Card 11 (specific woman) and modified Card 14 (specific event) to ensure all sentences rely on generic/structural usage.*

  1.  A good doctor treats his patients as equals.
  2.  Man has always feared the dark.
  3.  The chairman will call the meeting to order at nine.
  4.  Every student should bring his own calculator to the exam.
  5.  The average man spends an hour a day getting to work.
  6.  Mankind has never been good at predicting its own future.
  7.  The spokesman said the company would look into it.
  8.  A person should be judged by what he does, not what he says.
  9.  The man in the street doesn't care about interest rates.
  10. The freshman class will elect a chairman in October.
  11. No man is an island. *(Replacement for original Card 11)*
  12. Nobody likes being told what he already knows.
  13. The policeman on the beat knows the neighborhood better than anyone.
  14. A fireman must be ready to enter a burning building. *(Replacement for original Card 14)*

  **The Keys (Printed on card stock):**

  *   **Key A ("Blip"):** Replace *man/men/person/people/individual/human/mankind/somebody/anyone* with **blip/blips**. Replace *woman/women* with **blap/blaps**. Replace *he/him/his/himself* with **shim/shim/shis/shimself**. Replace *she/her* with **blap/blaps**.
  *   **Key B ("Whitem"):** Replace *man/men/person/people/individual/human/mankind/somebody/anyone* with **white/whites**. Replace *woman/women* with **black/blacks**. **Do not change** *he/him/his* or *she/her*.

  #### 3. The Rules (Read Aloud)

  "Today we are testing the durability of language. You have a deck of sentences that look ordinary. You also have two Substitution Keys.

  Your task is not to judge whether the sentences are 'politically correct.' Your task is to judge whether the *meaning* survives the substitution.

  Working in pairs, take half the deck (6 cards). Apply **Key A** to those 6 cards. Then apply **Key B** to the same 6 cards. You will end up with two versions of every sentence.

  Once you have transformed them, sort every card into one of three piles:
  *   **(S) Same:** The substitution changes the words, but the logical meaning remains identical. The sentence still functions as a general truth.
  *   **(D) Different:** The substitution changes the meaning. The sentence now excludes people it didn't before, or asserts something specific instead of general.
  *   **(X) Nonsense:** The substitution breaks the sentence. It becomes grammatically incoherent or semantically impossible.

  After 20 minutes, we will put our sorts on the board. If you disagree with another pair's sort, you must challenge it. We are looking for the cards where you hesitated."

  #### 4. The Sorting Task (Handout/Board Projection)

  **Task:**
  1.  Transform your 6 cards using Key A.
  2.  Transform your 6 cards using Key B.
  3.  Categorize each result as **S**, **D**, or **X**.
  4.  **Constraint:** You must identify at least **two cards** where your pair disagreed or felt uncertain. Be prepared to defend why.

  #### 5. The Debrief Plan

  **Phase 1: The Reveal (5 mins)**
  *   Ask: "Where did Key B feel more disruptive than Key A?"
  *   Reveal the source: Douglas Hofstadter, "A Person Paper," 1980s. Explain he swapped race for sex to show that "man" was never neutral.
  *   Acknowledge the discomfort: "If Key B felt aggressive, that is the point. It reveals the aggression that was already there, hidden in the 'neutral' term."

  **Phase 2: Mapping the Concepts (15 mins)**
  Use the board columns (S/D/X) to anchor these four philosophical points:

  1.  **Default Assumptions (The "S" Pile):**
      *   *Look at:* Cards sorted as **Same** in Key A but **Different** in Key B.
      *   *Point:* Why did "Blip" feel like a neutral placeholder, but "White" felt exclusive? Because "Man" behaves like "White." It claims to be everyone, but it isn't. The "S" pile in Key B is the lie we tell ourselves about language.

  2.  **Marked vs. Unmarked (The "X" Pile):**
      *   *Look at:* Cards that collapsed into Nonsense.
      *   *Point:* In linguistics, the "unmarked" term is the default (man), the "marked" term is the specific (woman). Key A shows that when you force the marked term ("shim") into the default slot, the grammar breaks. This proves "he" is not truly generic; it is grammatically marked masculine.

  3.  **Semantic vs. Pragmatic (The "D" Pile):**
      *   *Look at:* "The chairman will call the meeting..." vs "The chairwhite..."
      *   *Point:* Semantically, "chairman" might just mean "leader." Pragmatically, it conjures an image. Key B forces the pragmatic image to the surface. The meaning didn't change in the dictionary, but it changed in the room.

  4.  **The Repair Question (Final Fight):**
      *   *Ask:* "Does Key A fix the problem? If we use 'blip' and 'shim,' is it fair?"
      *   *Point:* No. It just makes the exclusion visible. Hofstadter argues you don't fix this by inventing words; you fix it by admitting the old words were never neutral.

  #### 6. Troubleshooting: What Will Go Wrong

  **1. The "Political Shutdown"**
  *   *Problem:* A student says, "This is racist/offensive, I won't do it."
  *   *Fix:* Pre-empt this in the intro. "We are treating these words as variables in a logic equation. We are testing the structure, not endorsing the content." If resistance arises, validate it: "The discomfort is data. Note that feeling on the card."

  **2. The "Flat Consensus"**
  *   *Problem:* Everyone agrees "Mankind" $\rightarrow$ "Whitekind" is **Different**. No debate.
  *   *Fix:* During the sorting phase, circulate and whisper to pairs: "Find the card that looks the most innocent. Argue that one." In the debrief, *you* play the devil's advocate. "I think 'A good white treats his patients' means the same as 'A good man...' Prove me wrong."

  **3. Mechanical Confusion on Key A**
  *   *Problem:* Students get stuck on "shimself" vs "himself."
  *   *Fix:* Write two examples on the board before they start.
      *   *Original:* "He gave it to him."
      *   *Key A:* "Shim gave it to shim."
      *   *Original:* "Man is mortal."
      *   *Key A:* "Blip is mortal."

  **4. Non-Native Speaker Confusion**
  *   *Problem:* Idioms like "Man in the street" or "No man is an island" don't translate literally.
  *   *Fix:* Ensure pairs are mixed proficiency if possible. During debrief, explicitly ask: "Did the idiom break faster than the literal sentences?" (This actually supports the point: cultural assumptions are deeper than grammar).

  #### 7. Limitations & Instructor Burden

  **What the Activity Can't Do:**
  This activity isolates *sentences*. Hofstadter's piece worked because it mimicked a *system* (a government column). The activity shows that the words are exclusionary, but it doesn't automatically show *why* that matters for power structures.
  *   **Your Burden:** In the debrief, you must connect the linguistic exclusion to social consequence. "If 'man' means 'male' in the law, who is protected? If 'white' meant 'human' in policy, who was excluded?" You have to supply the institutional context the cards lack.

  #### 8. Confidence Rating & Weakest Element

  **Confidence:** **85%**.
  The structure is sound, the timing is tight but workable, and the contrast between Key A and Key B is philosophically robust. It moves from "grammar is weird" (Key A) to "society is exclusionary" (Key B).

  **Weakest Element:** **The Sorting Task (S/D/X).**
  I am least sure this will generate genuine disagreement. Students are trained to find the "right answer." They will likely agree quickly that "Whitekind" is **Different**.
  *   *Mitigation:* If the board fills up with unanimous agreement, pivot the debrief immediately to: "Why was it so easy to agree? Why does 'Man' not trigger the same alarm?" The lack of disagreement *is* the data point. It proves how normalized the exclusion is. If the room goes flat, don't fight it; analyze the flatness.
