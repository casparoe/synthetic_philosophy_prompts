      *   *Check:* Is the "Corpus as Causal Chain" argument fleshed out? *Correction:* Treat the corpus as a "fossilized causal chain." The link is indirect.

  8.  **Final Polish:** Organize with clear headings. Ensure the transition from high-theory to practical chatbot argumentation is smooth. (Proceed to generate output based on these thoughts).

  *(Self-Correction Note during final review)*: I need to make sure I don't just say "LLMs have no semantics." I need to explore the *parasitic* possibility seriously, as the prompt asks for the costs of each fork. The "Corpus as Causal Chain" is a live option in philosophy of AI right now (e.g., work by Kapoor, or discussions on derived intentionality). I should frame it as "Derived Wide Content."

  Let's structure the argument around the three specific cases requested, then move to the practical implications.

  *   **Putnam:** The Broken Causal Chain.
  *   **Burge (Arthritis):** The Missing Normative Community.
