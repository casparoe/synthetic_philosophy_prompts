      *   *Can it lie?* Lying requires intent to deceive regarding a believed falsehood. Externalism suggests the bot has no beliefs (no causal/social anchor). So, strictly, no. It hallucinates, it doesn't lies.
      *   *Different Corpora = Different Meanings?* Yes, under social externalism. If Model A is trained on medical journals and Model B on WebMD forums, "arthritis" might pick out slightly different clusters of symptoms/definitions. This is a version of Twin Earth for AI.
