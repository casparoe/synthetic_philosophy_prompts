      *   *Burge (Social Externalism/Arthritis):* Meaning depends on the normative usage of the linguistic community. The individual can be wrong about the meaning.
          *   *LLM Problem:* LLMs are not members of the community. They are artifacts. They don't participate in the normative practices (correcting each other, using tools).
          *   *Implication:* LLMs mimic the *statistics* of the community but lack the *normative grip*. They can't have false beliefs in the Burgean sense because they don't have beliefs anchored by community norms.

      *   *Burge (Slow-Switching):* Content shifts based on environment, even if internal state is identical.
          *   *LLM Problem:* Models are static after training (mostly). They don't "shuttle" between environments in real-time. However, different models (Model A trained on Reddit, Model B trained on Wikipedia) might be analogized to Twin Earths.
          *   *Implication:* If meaning is determined by the training data's origin, two models outputting "Arthritis is in my thigh" might have different truth conditions based on the dominant usage in their respective corpora.

