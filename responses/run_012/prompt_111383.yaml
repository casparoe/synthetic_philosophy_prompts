prompt: |-
  I teach a third-year seminar on action and intention — we do Anscombe's Intention in the first half of term and the moral philosophy in the second — and I've got one 90-minute slot for the Truman business: her campaign against Oxford giving Truman an honorary degree, where she held that ordering the killing of civilians as a means to ending the war made him a murderer, and that the standard defence (it saved lives, it shortened the war) wasn't outweighed but beside the point, since she thought the whole thing wasn't a matter of opinion at all. I have 18 students and I do not want to stand up and lecture them about it. What I want is for them to end up in the middle of it themselves, under a rule that quietly makes her position feel like the only one they can actually state out loud. The shape I'm imagining, though throw it out if you've got something better: a staged debate in which the House is deciding whether to confer the honour, with a Standing Order that no argument may rest on what would have happened otherwise — no counterfactuals, no lives saved, no comparison with any alternative course of action, only what was done, by whom, to whom, and with what intention. I want them to find out that under that rule one side has a complete case and the other has nothing, and to find it out by running out of things to say rather than by being told. Don't let the words consequentialism, or her name, or the phrase 'doctrine of double effect' get spoken until the debrief.

  So: rules, roles (I'm thinking a chair who enforces the order and rules on challenges, two counsel teams, a registrar who keeps a seperate written record of every consideration that gets used, and a House that votes), a timeline for the 90 minutes that includes at least one moment where the order is suspended and then reimposed, cheap printable materials, and a secret ballot we can do something with afterwards — a colleague suggested running the whole thing a second time with the historical facts flipped so we can see which arguments survive the flip, but I'm not sure that fits in 90 minutes, so tell me if it earns its time. I'll make a one-page sheet of the facts of the case (projected invasion casualties, the state of the war, that sort of thing): tell me what should be on it and, more importantly, what I should deliberately leave off. The debrief should map what actually happened in the room onto her claims — including the part I care about most, that her real target was the honour and the moral climate that made the question look open, not the bombing as such. Then be straight with me about what will predictably go wrong the first time I run it (I'm expecting smuggled counterfactuals, and I'm expecting someone to say the act-description just begs the question — what do I do when that happens?), and about which feature of her view this set-up can't reproduce, so I know what I have to say out loud myself at the end.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Third-year seminar on Action and Intention (Anscombe's *Intention* first half, Moral Philosophy second half).
      *   **Topic:** Anscombe's campaign against Oxford granting Truman an honorary degree (1956).
      *   **Core Argument:** Truman ordered the killing of civilians as a means to end the war; this makes him a murderer. Consequentialist defenses (saved lives, shortened war) are beside the point, not just outweighed. It's not a matter of opinion.
      *   **Constraints:** 90 minutes, 18 students, no lecture.
      *   **Goal:** Students should feel Anscombe's position is the *only* one they can state out loud under specific rules. They should discover the asymmetry of the arguments by running out of things to say, not by being told.
      *   **Forbidden Words:** "Consequentialism," "Anscombe," "Doctrine of Double Effect" (until debrief).
      *   **Format:** Staged debate (House deciding on the honour).
      *   **Key Mechanic:** A Standing Order banning counterfactuals/consequentialist reasoning (no "what would have happened," only "what was done").
      *   **Roles:** Chair, Two Counsel Teams, Registrar, House (voters).
      *   **Timeline:** Needs to fit 90 mins, include a suspension/reimposition of the order.
      *   **Materials:** Cheap printable, one-page fact sheet (what to include/exclude).
      *   **Vote:** Secret ballot with a follow-up.
      *   **Colleague's Idea:** Run it twice with flipped facts? (Need to evaluate feasibility).
      *   **Debrief:** Map room dynamics to Anscombe's claims (especially about the honour/moral climate).
      *   **Troubleshooting:** Predict failures (smuggled counterfactuals, act-description begging the question).
      *   **Limitations:** Acknowledge what the setup *can't* reproduce (so the instructor knows what to add in the debrief).

  2.  **Evaluate the Colleague's Idea (Flipped Facts):**
      *   *Idea:* Run the debate twice, once with historical facts, once with flipped facts (e.g., Truman didn't drop the bombs, war dragged on, more died).
      *   *Constraint:* 90 minutes total.
      *   *Analysis:* A robust debate with roles, rules, and debrief takes the full 90 minutes. Doing it twice cuts time for the most important part: the philosophical mapping. It also risks gamifying the ethics too much ("Oh, it's just about the rules of the game").
      *   *Verdict:* Drop it. It doesn't earn its time. The point is the *structure* of the argument, not the empirical outcome. Anscombe's point is that *even if* it saved lives, it was wrong. Flipping the facts undermines that specific insight.

  3.  **Design the Standing Order (The "Trap"):**
      *   To make Anscombe's view the only viable one, the rules must exclude consequentialist reasoning *procedurally*.
      *   *Rule:* "Relevance Ruling." Arguments must pertain to the *act itself* and the *intent*, not the *outcome* or *alternatives*.
      *   *Enforcement:* The Chair needs to be strict. The Registrar records "Admissible" vs. "Ruled Out" points. This creates a visual record of the asymmetry.

  4.  **Drafting the Fact Sheet:**
      *   *Include:* The act (bombing Hiroshima/Nagasaki), the target (cities/civilians), the stated intent (ending the war), the context (war ongoing), the proposal (honorary degree).
      *   *Exclude:* Specific casualty estimates for invasion vs. bombing (this invites the utilitarian calculus), moral judgments, alternative historical scenarios, the concept of "military necessity" as a justification (unless defined strictly as intent).
      *   *Why:* If you give them numbers, they *will* do the math. Anscombe says the math is irrelevant.

  5.  **Structuring the 90 Minutes:**
      *   0-10: Setup & Roles.
      *   10-40: Debate Phase 1 (Strict Rules).
      *   40-50: Suspension (Let them vent the consequentialist arguments).
      *   50-60: Reimposition & Vote.
      *   60-90: Debrief (The crucial philosophical mapping).

  6.  **Developing Roles:**
      *   *Chair:* Needs a briefing sheet on how to rule. They are the proxy for Anscombe's logical constraint.
      *   *Proposition (Against the Degree):* Argues Truman is a murderer/undeserving. (Anscombe's side).
      *   *Opposition (For the Degree):* Argues Truman is a hero/deserving. (Standard view).
      *   *Registrar:* Crucial. Tracks *why* arguments are accepted or rejected.
      *   *House:* The jury.

  7.  **Addressing the "Act-Description" Objection:**
      *   Students will say: "Calling it 'murder' begs the question."
      *   *Counter:* The Chair rules on *description*. If the Opposition says "strategic bombing," the Proposition can challenge: "Is the description accurate regarding the intent?" The rule forces them to agree on the *intentional action* before judging. Anscombe insists on the description of the action *under which it is intended*.

  8.  **The Debrief Strategy:**
      *   Connect the frustration of the Opposition to Anscombe's claim: Consequentialism has no footing when counterfactuals are barred.
      *   Connect the Vote to the "Honour" point: Anscombe wasn't just stopping the bombing (past); she was stopping the *praise* (present).
      *   Address the Limitation: The simulation makes it look like a rule of debate. Anscombe thought it was a rule of *thought/reality*.

  9.  **Refining the "Suspension" Moment:**
      *   Why suspend? To let them feel the relief of consequentialist reasoning, then show how it violates the specific constraint of the *honour*.
      *   Actually, better: Keep the strict rule for the *Honour* decision. Suspend it only for a "Mitigation" phase, then show mitigation doesn't apply to the *principle* of the honour.
      *   *Correction:* The prompt asks for a moment where the order is suspended and reimposed.
      *   *Idea:* Suspend it to allow the "For" side to make their natural case. Record it. Then reimpose the rule and ask: "Does this change the verdict on the *honour*?" This highlights that the consequentialist arguments are *irrelevant* to the specific question of moral fitness for an honour, even if they are relevant to political judgment.

  10. **Troubleshooting:**
      *   *Smuggled Counterfactuals:* Chair must interrupt immediately. "That is a prediction, not a description of the act."
      *   *Begging the Question:* If they say "Murder is wrong, therefore...", stop them. Focus on "Was this murder?" based on intention.
      *   *Silence:* If the "For" side runs out of args, let the silence hang. That's the learning moment.

  11. **Final Review against Constraints:**
      *   No forbidden words? Checked.
      *   90 mins? Checked.
      *   Materials? Checked.
      *   Debrief focus? Checked.

  12. **Writing the Plan:** (Self-Correction during drafting)
      *   Make sure the Chair's instructions are very clear. They are the linchpin.
      *   Ensure the Registrar's sheet is simple enough to be done in real-time.
      *   The Fact Sheet needs to be neutral but devoid of the "utilitarian data."
      *   The "Limitation" section needs to be honest: The simulation makes it look like a procedural trick, whereas Anscombe thought it was metaphysical.

  13. **Final Polish:** Tone should be collegial, respectful of the instructor's expertise, and precise. (The user is clearly an Anscombe scholar/teacher, so don't dumb it down).

