answer: |-
  This is a brilliant pedagogical challenge. You are asking students to inhabit a logical space where the *grammar* of the argument excludes the dominant moral framework of the age. The goal is to make the consequentialist position feel not just wrong, but *incoherent* within the specific context of conferring an honour.

  Here is a plan designed to fit your 90-minute slot, enforce the asymmetry you want, and preserve the philosophical payoff for the debrief.

  ### 1. The Materials

  **A. The Fact Sheet (One Page)**
  *   **Include:**
      *   The Date: August 1945.
      *   The Agent: Harry S. Truman, President of the United States.
      *   The Act: Ordered the dropping of atomic bombs on Hiroshima and Nagasaki.
      *   The Target: City centres containing civilians, industry, and military personnel.
      *   The Stated Intention: To compel the Japanese government to surrender and thus end the war.
      *   The Proposal: Oxford University proposes to confer an Honorary Degree in 1956.
      *   The Criterion for the Degree: "Distinguished service to humanity" (or similar standard honorific language).
  *   **Deliberately Leave Off:**
      *   **Any casualty estimates.** No numbers for projected invasion deaths (Operation Downfall) vs. bombing deaths. This is the most critical exclusion. If they have numbers, they will do math. Anscombe's point is that the math is irrelevant.
      *   **The word "Surrender."** Use "End the war." (Surrender implies a political outcome; ending the war implies a state of affairs. This keeps the focus on the *means*).
      *   **Any moral adjectives.** No "atrocious," "heroic," "necessary," or "tragic."
      *   **Alternatives.** No mention of whether Japan was already seeking peace, or if a demonstration shot was possible.

  **B. The Standing Order (Projected & Printed)**
  > **STANDING ORDER 1: RELEVANCE TO THE ACT**
  > In considering the fitness of the candidate for this Honour, the House may only consider:
  > 1. What was done.
  > 2. Who did it.
  > 3. With what intention.
  >
  > **STANDING ORDER 2: PROHIBITION ON COUNTERFACTUALS**
  > No argument may rest on what *would* have happened had the act not been performed. Arguments regarding "lives saved," "time shortened," or "alternative outcomes" are ruled out of order.
  >
  > **STANDING ORDER 3: DESCRIPTION**
  > Arguments must describe the action under the description *intended by the agent*.

  **C. The Registrar's Log (Printable)**
  A simple two-column sheet:
  *   Column A: Argument Offered.
  *   Column B: Ruling (Admissible / Ruled Out).
  *   *Note:* The Registrar should publicly tally how many arguments are ruled out for each side.

  ### 2. Roles (18 Students)

  *   **The Chair (1):** Needs to be assertive. Give them a briefing card 5 minutes early. Their job is to enforce the Standing Order ruthlessly. They are the proxy for Anscombe's logical constraint.
  *   **The Registrar (1):** Sits next to the Chair. Marks the Log.
  *   **Proposition Counsel (3):** Argues *Against* conferring the degree. (This is the Anscombe position, though they don't know it yet).
  *   **Opposition Counsel (3):** Argues *For* conferring the degree.
  *   **The House (10):** Voting members. They may ask questions of counsel but cannot make speeches.
  *   **Observers (0):** (Everyone is involved).

  ### 3. The Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Briefing**
  *   Distribute roles and Fact Sheet.
  *   Project the Standing Orders.
  *   **Crucial Instruction:** Tell the House: "You are not deciding if the war was justified. You are deciding if this man is fit for an *Honour* based on this *Act*."
  *   Send Chair and Registrar to the front. Give the Chair a gavel (or equivalent).

  **00:10 – 00:40: Phase 1 (The Trap)**
  *   Debate proceeds under strict Standing Orders.
  *   **Expected Dynamic:** The Proposition will flourish (focusing on intention to kill civilians). The Opposition will struggle. Every time they say "But the war would have..." the Chair rules them out of order.
  *   **The Registrar's Role:** Visibly mark Opposition arguments as "Ruled Out."
  *   **Goal:** Let the Opposition run out of language. Let the silence hang.

  **00:40 – 00:50: Phase 2 (The Suspension)**
  *   **Chair Announcement:** "The House finds itself in difficulty. Standing Order 2 is suspended for 10 minutes to allow the Opposition to present the case they naturally wish to make."
  *   **Action:** Opposition unloads the consequentialist case (saved lives, ended war, invasion casualties).
  *   **Registrar:** Records these arguments in a separate colour or section marked "Suspension."
  *   **Goal:** Let the students feel the relief of consequentialist reasoning.

  **00:50 – 01:00: Phase 3 (The Reimposition)**
  *   **Chair Announcement:** "Standing Order 2 is reimposed. We return to the question of the Honour."
  *   **Proposition Rebuttal:** The Proposition must now argue why the arguments made during the Suspension *do not count* toward the Honour, even if true. (e.g., "A honour rewards virtue, not successful calculation.")
  *   **Goal:** To separate *political justification* from *moral honour*.

  **01:00 – 01:05: The Vote**
  *   Secret ballot. "For," "Against," "Abstain."
  *   Collect and count immediately.

  **01:05 – 01:30: The Debrief**
  *   (See below).

  ### 4. Evaluation of the Colleague's Suggestion
  **Do not run the simulation twice with flipped facts.**
  *   **Reason:** It consumes the time needed for the debrief, which is where the Anscombe actually happens.
  *   **Philosophical Reason:** Anscombe's point is not that the *consequences* were bad; it's that the *reasoning* is invalid. Flipping the facts (e.g., "The bombs didn't work, the war dragged on") validates the consequentialist framework by suggesting that if the consequences *had* been different, the verdict might change. Anscombe argues the verdict shouldn't change even if he saved a million lives. Running it twice undermines the incommensurability claim.

  ### 5. The Debrief Strategy

  **Step 1: The Vote & The Register**
  *   Reveal the vote count.
  *   Project the Registrar's Log. Show the asymmetry: How many arguments did the Proposition have ruled out? (Likely zero). How many did the Opposition have ruled out? (Likely most).
  *   Ask the Opposition: "How did it feel when your arguments were ruled out of order?" (They will say: "Impossible," "Unfair," "We couldn't speak.")
  *   **Map to Anscombe:** This is exactly her point. She isn't saying the consequentialist calculation is *false*; she is saying it is *beside the point* when describing the action. In the grammar of moral action, it is nonsense.

  **Step 2: The Honour vs. The Act**
  *   Ask: "During the Suspension, did anyone change their mind about the *Honour*?"
  *   **Map to Anscombe:** Her target was not primarily the past (the bombing happened), but the present (the moral climate of Oxford). By granting the honour, the University makes the moral question look "open" or "balanced." The simulation shows that under the correct description, it isn't open.

  **Step 3: Naming the Forbidden**
  *   Now you can say the words: *Consequentialism, Doctrine of Double Effect, Anscombe.*
  *   Explain that the Standing Order was a procedural enactment of the **Doctrine of Double Effect** (specifically the intention condition) and a rejection of **Consequentialism**.
  *   Highlight that the "Suspension" phase represented the standard modern moral view, while the "Standing Order" phase represented the Anscombean view.

  ### 6. Troubleshooting: What Will Go Wrong

  **1. Smuggled Counterfactuals**
  *   **The Problem:** An Opposition student says, "He acted to *prevent* further suffering."
  *   **The Fix:** The Chair must rule this out immediately. "Is 'preventing suffering' the description of the act, or the hoped-for outcome?"
  *   **Instructor Intervention:** If the Chair is too timid, you (as instructor) must intervene as a "Point of Information" to the Chair. "Chair, is 'preventing suffering' an intention or a consequence?" Force the distinction.

  **2. The "Begging the Question" Objection**
  *   **The Problem:** A smart student will say, "The Proposition keeps calling it 'murder.' That begs the question. If we call it 'strategic bombing,' it's fine."
  *   **The Fix:** This is the crux of *Intention*. Refer to Standing Order 3. "What was the intention?" If the intention was to kill civilians to pressure the government, Anscombe argues the description *must* be 'killing civilians'.
  *   **Instructor Note:** If they press this hard, acknowledge it in the debrief. Anscombe's whole project is that we cannot describe the action *without* the intention. If you strip the intention, you aren't describing a human action anymore, just a physical movement.

  **3. The House Revolts Against the Chair**
  *   **The Problem:** The House feels the rules are rigged and stops engaging.
  *   **The Fix:** Remind them: "You are not debating history. You are debating the *criteria for an Honour*." If the criteria exclude consequences, then consequences are irrelevant. This mirrors Anscombe's claim that certain actions are *forbidden*, regardless of utility.

  ### 7. Limitations: What You Must Say Out Loud

  This setup cannot reproduce the **metaphysical weight** of Anscombe's claim.
  *   **The Simulation:** Makes it look like a rule of a game ("We aren't *allowed* to talk about consequences").
  *   **Anscombe's View:** It's not that we aren't allowed; it's that there *is nothing there* to talk about. The "good consequence" does not interact with the "evil act" mathematically.
  *   **Your Closing:** You must tell them: "In this room, the Standing Order was a constraint I imposed on you. For Anscombe, the constraint is imposed by reality. She believes that 'murder' and 'saving lives' do not sit on the same scale. You cannot put them on a scale. Today, you felt the frustration of that; she felt the horror of it."

  ### 8. Why This Works for Third Years
  They have read *Intention*. They know the distinction between "intention" and "foreseen consequence." This exercise forces them to *use* that distinction under pressure. By banning the counterfactual, you remove the utilitarian escape hatch. By focusing on the *Honour*, you replicate Anscombe's specific political intervention (which was about the *praise*, not just the *act*).

  The moment the Opposition runs out of things to say is the moment they understand Anscombe. Don't rescue them. Let the silence do the teaching.
