answer: |-
  # Diagnostic Tree: Is the Brain a Computer?

  **Starting Commitment:** We agree that at some level of description, neural activity can be modeled as information processing, and this model is doing more than merely decorating a redescription.

  **Instructions:** Begin at **Node 1**. Answer the question based on your intuitions about the concrete case provided. Follow the arrow corresponding to your answer until you reach a **Leaf**.

  ---

  ### Node 1: The Triviality Gate
  **Probe:** Consider a bucket of water. If I map the height of waves to numbers, and those numbers change over time according to a mathematical rule, can I truthfully say the bucket is *computing* those numbers?
  *   **Yes:** Any physical system can be mapped onto a computation if the mapping is arbitrary enough. → **Go to Leaf 1**.
  *   **No:** Computation requires specific physical constraints beyond just a mathematical mapping. → **Go to Node 2**.

  ### Node 2: The Constraint Requirement
  **Probe:** Consider a thermostat. It has internal states that causally track temperature and trigger a furnace. It lacks beliefs or desires. Does this system compute, or does genuine computation require states that possess *content* (meaning "it is cold")?
  *   **Causal Only:** Computation requires only the right causal/functional organization (syntax), not meaning. → **Go to Node 3**.
  *   **Content Required:** Computation requires states that are *about* something (semantics). → **Go to Node 4**.

  ### Node 3: Ontology (Causal Branch)
  **Probe:** Consider a perfect computer simulation of a hurricane. The equations match the storm, but no one gets wet inside the machine. Is the brain's computation *constitutive* of cognition (the storm itself), or merely the best *explanatory model* we have (the simulation)?
  *   **Explanatory Model:** Computation is a useful way to describe the brain, but the brain isn't literally a computer. → **Go to Node 5**.
  *   **Constitutive:** Cognition literally consists in computational processes. → **Go to Node 6**.

  ### Node 4: Ontology (Content Branch)
  **Probe:** (Same probe as Node 3). Is the attribution of content-bearing computational states *constitutive* of cognition, or merely an *explanatory model*?
  *   **Explanatory Model:** We use computational language to predict behavior, but there is no real computation happening. → **Go to Node 7**.
  *   **Constitutive:** Cognition literally consists in the manipulation of content-bearing states. → **Go to Node 8**.

  ### Node 5: Format (Instrumental/Causal)
  **Probe:** Think of an abacus (discrete beads) versus a slide rule (continuous positions). Which provides the better *model* of neural activity?
  *   **Discrete:** The best model treats neural states as distinct symbols or steps. → **Leaf 2**.
  *   **Continuous:** The best model treats neural activity as a continuous flow or field. → **Leaf 3**.

  ### Node 6: Substrate (Constitutive/Causal)
  **Probe:** If we replaced your neurons one by one with silicon chips that preserved the causal connections, would the computational process (and thus cognition) continue?
  *   **No:** The specific biological physics is doing irreducible work. → **Leaf 4**.
  *   **Yes:** The computation is medium-independent. → **Go to Node 9**.

  ### Node 7: Format (Instrumental/Content)
  **Probe:** (Same probe as Node 5). Which provides the better *model* for attributing content to neural states?
  *   **Discrete:** Content is best modeled as discrete symbolic structures. → **Leaf 5**.
  *   **Continuous:** Content is best modeled as patterns in a continuous state space. → **Leaf 6**.

  ### Node 8: Substrate (Constitutive/Content)
  **Probe:** (Same probe as Node 6). If we replaced your neurons with silicon, would the content-bearing computational states persist?
  *   **No:** Biological substrate is required for genuine content. → **Leaf 7**.
  *   **Yes:** Content is realized by functional organization, not biology. → **Go to Node 10**.

  ### Node 9: Format (Constitutive/Causal/Silicon)
  **Probe:** (Same probe as Node 5). Is the literal computational mechanism of the brain discrete or continuous?
  *   **Discrete:** The brain operates on discrete states (like spikes or logic gates). → **Leaf 8**.
  *   **Continuous:** The brain operates on continuous variables (like voltage gradients). → **Leaf 9**.

  ### Node 10: Format (Constitutive/Content/Silicon)
  **Probe:** (Same probe as Node 5). Is the literal mechanism manipulating content discrete or continuous?
  *   **Discrete:** Cognition is the rule-governed manipulation of discrete symbols. → **Leaf 10**.
  *   **Continuous:** Cognition is the evolution of continuous activation patterns. → **Leaf 11**.

  ---

  ## Diagnostic Leaves

  **Leaf 1: Pancomputational Trivialism**
  *   **Awkward Commitment:** A bucket of water and a storm cloud compute tax returns just as much as a supercomputer does, rendering the claim "the brain computes" vacuous.

  **Leaf 2: Causal Instrumentalism (Digital)**
  *   **Awkward Commitment:** The brain does not actually compute; we merely find it useful to model it as a discrete state machine, despite the underlying physics being continuous.

  **Leaf 3: Causal Instrumentalism (Analog)**
  *   **Awkward Commitment:** Computational descriptions are merely convenient fictions, yet we must insist the best fiction is continuous rather than discrete.

  **Leaf 4: Biological Mechanism (Causal)**
  *   **Awkward Commitment:** Computation is real and causal, but silicon chips could never compute because they lack the specific electrochemical properties of neurons.

  **Leaf 5: Semantic Instrumentalism (Digital)**
  *   **Awkward Commitment:** No system actually processes meaning; we merely find it predictive to treat neural states as discrete symbols with content.

  **Leaf 6: Semantic Instrumentalism (Analog)**
  *   **Awkward Commitment:** Attributing content is a useful stance, but the underlying reality is a continuous flow that possesses no intrinsic semantics.

  **Leaf 7: Bio-Semantic Naturalism**
  *   **Awkward Commitment:** Genuine content and computation are real, but they cannot be uploaded to silicon because biology is essential for meaning.

  **Leaf 8: Dynamic Realism (Causal)**
  *   **Awkward Commitment:** The brain is literally a computer, but it is a continuous analog device, making the term "computer" (in the everyday digital sense) misleading.

  **Leaf 9: Connectionist Realism (Causal)**
  *   **Awkward Commitment:** Cognition is real computation in continuous networks, but individual states lack the discrete identity required for classical logic.

  **Leaf 10: Classical Computationalism (Classicism)**
  *   **Awkward Commitment:** Cognition is the rule-governed manipulation of discrete symbols, risking a homunculus (a little man inside reading the symbols).

  **Leaf 11: Classical Cognitivism (Representationalism)**
  *   **Awkward Commitment:** Discrete symbols have intrinsic content, requiring an explanation of how physical states come to be *about* the world without a user.

  ---

  ## Logical Space Analysis

  **Empty Combinations:**
  1.  **Constitutive + Trivialism:** This space is empty because it is **incoherent**. If computation is constitutive of cognition, it cannot be true of every physical system (like a bucket) without implying that buckets are cognitive agents.
  2.  **Constitutive + Biological + Digital:** This space is largely **unattractive/neglected**. While some spiking network models are discrete, views that insist on biological essentialism usually emphasize the continuous, wet, analog nature of the substrate to distinguish it from silicon.
  3.  **Instrumentalist + Substrate Dependent:** This space is **neglected**. If computation is merely a model, the model is typically abstract and portable; insisting the *model* only works on biology contradicts the abstraction inherent in modeling.

  **Indistinguishable Pairs:**
  1.  **Leaf 10 (Classical Computationalism) vs. Leaf 11 (Classical Cognitivism):** The tree separates Syntax (Causal) from Semantics (Content). However, in practice, proponents of Classical Computationalism almost always endorse Classical Cognitivism. It is rare to find a philosopher who believes the brain manipulates discrete symbols (Leaf 10) but denies those symbols have content (Leaf 11). The tree separates them logically, but they cluster empirically.
  2.  **Leaf 3 (Causal Instrumentalism/Analog) vs. Leaf 9 (Connectionist Realism):** Both view the brain as a continuous system described by connectionist models. The distinction rests entirely on whether the description is *true* (Constitutive) or merely *useful* (Explanatory). If the model is perfect, this metaphysical distinction may have no observable consequences, making these positions functionally indistinguishable in a diagnostic setting.

  **Most Divisive Node:**
  **Node 3 & 4 (Ontology: Constitutive vs. Explanatory).**
  While the Triviality Gate (Node 1) filters out the most radical skeptics, the Ontology node does the most work dividing the substantive philosophical landscape. It separates the **Realists** (who believe computation is the metaphysical ground of mind and must solve the hard problems of substrate and format) from the **Instrumentalists** (who view computation as a methodological tool and bypass metaphysical constraints). This split determines whether the reader is engaged in metaphysics (what the mind *is*) or methodology (how best to *study* the mind).
