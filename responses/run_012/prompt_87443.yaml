  It is completely understandable that you left that conversation feeling unsettled, because your friend has presented you with a package deal that mixes genuine philosophical insights with some significant conflations and historical errors. While he is correct on the basic contours of Hume and Moore, he has welded their distinct arguments together into a single monolith that does not hold up under scrutiny, and he has drawn conclusions from them that neither Hume nor Moore would have accepted. To untangle this, we need to look at the strands individually, starting with the relationship between Hume and Moore. Your friend treats Hume's is-ought gap and Moore's open question argument as if they are the same point made in different centuries, but they are actually addressing different problems. Hume's observation is primarily logical and psychological; he noted that writers on morality often slip from describing what is the case to prescribing what ought to be the case without explaining the connection, and he argued that reason alone cannot motivate action without a pre-existing desire or passion. Moore, writing much later, was concerned with semantics and metaphysics. He wanted to show that the property of goodness cannot be identical to any natural property like pleasure or survival. While both philosophers agree that you cannot simply define morality away into science, Hume is talking about the logic of inference and the source of motivation, whereas Moore is talking about the definition of terms and the nature of properties. Running them together obscures the specific weaknesses of each.

  The most glaring error in your friend's summary, however, concerns moral realism. He claims that Moore's argument shows moral realism is a dead option, but this is historically and philosophically incorrect. Moore was himself a moral realist. He believed that goodness was a real, objective property, but he argued it was a non-natural property, meaning it could not be reduced to or measured by the methods of the natural sciences. When he attacked the naturalistic fallacy, he was not attacking the existence of moral truths; he was attacking the idea that moral truths are the same thing as scientific truths. So, if Moore were present, he would strongly object to the claim that his work kills moral realism. In fact, Moore's work is often cited as the founding document of non-naturalistic moral realism. Your friend has confused the rejection of naturalism with the rejection of realism, which is a crucial distinction. One can believe moral facts are real without believing they are the kind of things a microscope or a telescope could detect.

  This confusion extends to his handling of the naturalistic fallacy. In technical metaethics, Moore's naturalistic fallacy refers specifically to the mistake of defining the term good in terms of natural properties, such as claiming that good just means pleasurable. However, in everyday discourse, when people talk about the appeal to nature fallacy, they are usually referring to the argument that something is good because it is natural or bad because it is unnatural, such as the processed food example your friend gave. While these two ideas are related, they are not identical. Moore's fallacy is about definition and identity, whereas the informal fallacy is about using nature as a normative authority. By conflating them, your friend makes it seem as though any reference to natural consequences in a moral argument is automatically invalid, which leads directly to his mistaken verdict on the climate change argument. The is-ought gap does not imply that facts are irrelevant to morality, only that they are not sufficient on their own. A moral argument about climate change typically relies on a hidden normative premise, such as the claim that we ought to prevent unnecessary suffering or that we ought to preserve conditions for human flourishing. Once you accept that normative premise, the empirical facts about climate change become deeply relevant. To say science can have no bearing whatever on morality is to ignore the instrumental role of facts in achieving moral ends. If you ought to save lives, and science tells you that carbon emissions kill people, then science is bearing directly on what you ought to do, even if the initial obligation to save lives is not itself a scientific fact.

  Regarding the final part of his salvo, his criticism of the open question argument using the water and H2O analogy is actually the strongest part of his case, and it is where he is most aligned with contemporary philosophy. This objection was famously developed by Saul Kripke and Hilary Putnam in the 1970s. They argued that some identity statements are necessary but known only through empirical investigation. Before modern chemistry, it was an open question whether water was H2O, but we now know it is necessarily H2O. Your friend is right that this undermines Moore's assumption that if a question feels open, the identity must be false. Moore assumed that all necessary truths are analytic, meaning true by definition, but Kripke showed that some are synthetic, meaning true by the nature of the world even if not by definition. This suggests that goodness could potentially be identical to a natural property even if it does not seem that way conceptually. However, this criticism does not automatically save naturalism, because moral properties might not be natural kinds in the same way water is. Water is a substance with a microstructure; goodness is a property evaluated by agents. So while the water analogy successfully damages the open question argument, it does not definitively prove that morality is natural, only that Moore's specific proof against it was flawed.

  So, what should you have said back to him? You should have acknowledged that he is right about the logical gap between is and ought, in the sense that you cannot derive a conclusion containing an ought from premises that contain only is statements without some bridging principle. But you should have pressed him on the conflation of Hume and Moore, pointing out that Hume was concerned with motivation and logic while Moore was concerned with definition and metaphysics. You should have corrected him on moral realism, noting that Moore was a realist who believed in objective moral truths, just not natural ones. You should have distinguished between the technical naturalistic fallacy and the informal appeal to nature, explaining that citing empirical consequences is not fallacious provided one accepts a normative goal. Finally, you could have conceded that his critique of the open question argument using water and H2O is a standard and powerful objection in modern metaethics, but explained that this does not validate his stronger claim that science is irrelevant to morality or that moral realism is dead. By separating these strands, you would show that while the is-ought gap is a real constraint on moral reasoning, it is not the silencer of moral debate that he claims it is, and it certainly does not render facts about the world useless in determining how we should live.
