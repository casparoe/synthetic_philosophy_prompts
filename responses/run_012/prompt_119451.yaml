answer: |-
  This is a classic philosophical debate known as the **Necessity of Origin**, most famously argued by Saul Kripke in the 1970s. You haven't just been listening to a flatmate squabble; you've been listening to a seminar on metaphysics.

  Neither of them can be "factually" right in the way a scientist is right, because this is about *modal logic* (what is possible vs. necessary), not biology. However, one position is much more robust within philosophy.

  Here is the move-by-move breakdown, rated from **Clearly Wrong** to **Clearly Right** (based on standard analytic philosophy).

  ### The Move-by-Move Breakdown

  **(1) Maya: Origin is essential to identity.**
  *   **Rating:** **Philosophically Right.**
  *   **Reason:** This is the standard Kripkean position. If you change the origin, you are talking about a *different* entity that resembles you, not you in a different state.

  **(2) Tom: Identity settled by a "lottery" is absurd; people talk loosely about "me if taller."**
  *   **Rating:** **Intuitively Right, Metaphysically Wrong.**
  *   **Reason:** Tom is relying on how we speak casually (loose talk) rather than strict identity. The "absurdity" he feels is an emotional reaction to contingency, not a logical proof.

  **(3) Maya: "Me with different genes" is a stand-in; explains moral responsibility.**
  *   **Rating:** **Clearly Right.**
  *   **Reason:** This is the strongest argument for her side. We don't blame a "possible taller you" for your crimes because that person literally wouldn't be you. This aligns with our legal and moral practices.

  **(4) Tom: Sperm is a delivery van (causal history), not composition. Analogy to parents meeting.**
  *   **Rating:** **Mostly Wrong.**
  *   **Reason:** He confuses *matter* with *origin*. You aren't made of your parents, but you can't exist without them. The "parents meeting" analogy fails because the meeting is an external event; the gametes are the internal biological cause.

  **(5) Maya: Confusing composition with origin. Different parents = different person.**
  *   **Rating:** **Clearly Right.**
  *   **Reason:** Tom's "slippery slope" starts here. Almost everyone agrees you can't have different *parents*. Maya correctly points out that if parents are essential, gametes (the immediate physical manifestation of parents) must be too.

  **(6) Tom: The Sorites Problem. Where is the line? Sperm's origin? Universe history?**
  *   **Rating:** **Philosophically Strong Challenge.**
  *   **Reason:** This is Tom's best move. He identifies the vagueness problem. If origin is essential, does it regress infinitely? This doesn't prove Maya wrong, but it proves her definition needs a "stopping point."

  **(7) Maya: It stops at the zygote. That is where the organism begins.**
  *   **Rating:** **Clearly Right.**
  *   **Reason:** This provides the stopping point Tom demanded. Biologically and metaphysically, the zygote is the first stage of the *new* organism. Prior to that, the materials belonged to the parents.

  **(8) Tom: Identical Twins. One zygote, two people. Contradicts unique origin.**
  *   **Rating:** **Debatable / Partially Right.**
  *   **Reason:** This is a known counter-example to strict Origin Essentialism. However, Maya could argue the "origin" includes the *potential* to split, or that identity diverges at the moment of splitting. It complicates her view but doesn't destroy it.

  ### The User's Tie-Breakers

  **Case 1: Three-Parent IVF (Mitochondrial Replacement)**
  *   **Rating:** **Maya is Righter.**
  *   **Reason:** Tom says this makes origin "mush." Maya says origin is the egg you were assembled in. Metaphysically, Maya holds up better: the *nucleus* (the blueprint of you) came from the mother, the *vessel* came from the donor. You are still the child of the nuclear parents. Tom's claim that this destroys the concept is an overreaction.

  **Case 2: IVF Embryo Selection & Cloning**
  *   **Rating:** **Maya is Right on IVF; Tom is Right on Cloning.**
  *   **Reason:**
      *   *IVF:* Maya is correct. If they picked the other embryo, that would be a sibling, not you. This supports Origin Essentialism.
      *   *Cloning:* Tom has a point here. If you can be cloned from a skin cell, the "sperm and egg" rule isn't essential. However, Maya can adjust her theory to "specific genetic code + specific initial cell," which preserves her core point without needing sperm specifically.

  ### Overall Verdict: Who is More Right?

  **Maya is more right.**

  Tom is arguing from **intuition** and **material constitution** (what am I made of *now*?). Maya is arguing from **identity conditions** (what makes me *me* across possible worlds?).

  In philosophy, Maya's position (Origin Essentialism) is the dominant view. Tom's objection that "it feels like a lottery" is a psychological observation, not a metaphysical one. The fact that your existence depended on a chance event doesn't mean you could have existed *without* that event.

  However, Tom wins points for identifying the **boundary problem** (Move 6). He correctly sensed that Maya needed to define where the "essential chain" stops, or else everything becomes essential.

  ### What Both of Them Are Missing

  They are conflating two different questions:
  1.  **What are the necessary conditions for *this* organism to exist?** (Maya's focus)
  2.  **How much can we change before it becomes a *different* organism?** (Tom's focus)

  **What they are missing is the distinction between *Constitutive* vs. *Causal* history.**
  *   **Tom** thinks that because the sperm's material disappears, it's just causal history (like the parents meeting).
  *   **Maya** thinks the sperm is part of the origin, but she struggled to explain *why* the sperm's parents don't count.

  ### The Answer to Your Specific Question: "Is there a principled place to stop the chain?"

  **Yes.** This is the answer to Move (6) that would have ended the argument.

  The chain stops at the **fusion of the gametes (the zygote)**.

  Here is the principle: **Essentiality applies to the *start of the organism*, not the history of its parts.**

  1.  **Before Fusion:** The sperm and egg are parts of the *parents*. Their history is the parents' history. You do not inherit the essential history of your parents' cells, only the result of their fusion.
  2.  **At Fusion:** A new organism begins. This organism *essentially* requires that specific fusion event.
  3.  **After Fusion:** Any change to the zygote (like the twin split) is a change to *your* history, not your pre-history.

  **Why this stops the regress:**
  You don't need the *specific sperm's* origin to be essential, because the sperm wasn't *you* yet. It was a carrier. But you *do* need the specific *fusion* to be essential, because that is the moment *you* began.

  **The Referee's Ruling:**
  Maya wins on the main thesis (you couldn't have come from different gametes). Tom wins on the need for precision (we must define "origin" as the zygote, not the infinite history of the sperm).

  Tell them to stop arguing. Maya has the better metaphysical framework, but Tom correctly identified that she needs to define the "start point" as the zygote to avoid the infinite regress. They are actually agreeing on the biology but fighting over the definition of "origin."
