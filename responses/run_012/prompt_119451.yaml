      *   *Correction on Twins:* Tom's twin argument (8) is actually a standard objection to Origin Essentialism. I need to make sure I don't dismiss it too easily. Kripkeans argue the *origin* includes the potential for splitting, or that identity diverges at the split.
      *   *Correction on Tom's "Lottery":* Tom thinks it's absurd that identity depends on a chance event. But Kripke argues that *if* the event didn't happen, *you* wouldn't exist. It's not that chance determines identity, but that identity is rigidly designated to that outcome. I need to explain this simply.
