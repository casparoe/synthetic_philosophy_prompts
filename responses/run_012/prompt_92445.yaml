answer: |-
  Look, I have sat in the back row of exactly this kind of workshop more times than I care to count, and the dynamic you are walking into is volatile but manageable if you keep your head. The applied modellers are desperate for permission to keep using their tools without feeling epistemically guilty, while the philosopher critic is waiting for you to hand them a weapon to prove economics is pseudoscience, and the historians are just waiting to correct your footnotes. Your strategy of splitting "unrealistic" into harmless, load-bearing, and scaffolding is solid, but it invites a specific kind of attack where people claim you are just dressing up old problems in new clothes. Before you even start taking questions, you need to concede two things to disarm the room. First, admit that Friedman was often sloppy and that you are not doing exegesis but reconstruction, which takes the wind out of the historians sails immediately. Second, concede that robustness-to-relaxation is not a sufficient condition for a good model, only a necessary one, which stops the philosopher critic from claiming you think prediction is all that matters. If you defend Friedman himself or claim your method is a silver bullet, you will spend thirty minutes digging out of a hole instead of discussing your actual contribution.

  The first real threat comes from the senior macro modeller who will lean forward and ask how an economist is supposed to know ex ante which assumptions are scaffolding and which are load-bearing before they run the relaxation tests. They will phrase this in terms of structural parameters versus reduced forms, asking if you expect them to test every assumption against every possible relaxation direction. Your reply is that you are not asking for exhaustive testing but for targeted robustness checks based on the specific use-case of the model, distinguishing between assumptions meant to capture mechanisms and those meant to ensure tractability. The soft spot here is that you are bluffing about the feasibility; in complex DSGE models, relaxing one assumption often requires changing three others, making isolation impossible, so if they push on identifiability you have to concede that this is a normative ideal rather than a standard practice they can implement tomorrow.

  Next, the philosopher critic will jump in and ask whether this isn't just instrumentalism with extra steps, arguing that if you judge a model by whether the result survives relaxation rather than whether the assumptions are true, you are still ignoring falsification of the theory itself. They will use words like empirical content and demarcation. You need to reply that robustness-to-relaxation is actually a form of falsification applied to the inference rather than the premises, showing that the link between assumption and prediction is what is being tested. The candid note here is that this is a weak distinction; if the prediction holds despite false assumptions, the critic is right that the theory remains unfalsified in a traditional sense, so you must emphasize that the goal is reliability of the policy inference, not truth of the ontology.

  You will then get a question from the historian of thought who will point out that Friedman was writing against a specific kind of descriptive realism in the nineteen fifties and that your tripartite distinction imposes contemporary modelling concerns onto a text that was about measurement error. Your reply should be that regardless of Friedman's intent, the current debate is stuck on the ambiguity you identified, so reconstructing the argument serves current methodology better than historical accuracy. The bluff here is thin because if they know the literature better than you, they will know you are cherry-picking, so do not engage on textual evidence but pivot back to the utility of the distinction for today's modellers.

  One of the epidemiologists or the climate modeller will ask about the stakes, questioning whether calling an assumption scaffolding is safe when policy decisions based on harmless falsehoods can lead to catastrophic outcomes if the context shifts. They will talk about tail risks and external validity. Your reply is that robustness-to-relaxation specifically requires testing in the directions that matter for the use-case, meaning high-stakes contexts demand wider relaxation bounds than low-stakes theoretical exercises. The soft spot is that you cannot guarantee the modeller knows which directions matter for high-stakes scenarios, and if they press on who decides what matters, you have to admit that this is a social and institutional question as much as a methodological one.

  A younger applied modeller will ask if this is just sensitivity analysis by another name, noting that they already run sensitivity checks on key parameters and wondering what philosophical work you are actually doing. You should reply that sensitivity analysis is often local and numerical, whereas your concept requires conceptual relaxation of the assumption itself, such as moving from representative agents to heterogeneous agents rather than just tweaking a risk aversion coefficient. The risk here is that in practice the line is blurry, so if they show you a paper where they did exactly what you describe under the label of sensitivity analysis, you must concede that the philosophical value is in making the purpose of those checks explicit rather than inventing a new technique.

  The philosopher critic will return to ask how you determine the directions that matter without already having a theory that tells you what matters, which sounds circular. They will call this theory-ladenness. Your reply is that prior empirical evidence and mechanistic understanding guide the choice of relaxation directions, making it an iterative process rather than a circular one. The candid note is that this is the weakest part of your argument because in many macro models the prior evidence is exactly what is being disputed, so be prepared to admit that this requires a consensus on background knowledge that may not exist.

  A historian or senior faculty member might ask why we should teach students that assumptions are scaffolding if they are not true, worrying about the pedagogical impact of telling students that false premises are acceptable. Your reply is that distinguishing scaffolding from mechanism helps students understand which parts of the model are essential to the logic and which are artifacts of simplification, improving their intuition. The soft spot is that students often confuse the two anyway, so you should concede that this requires careful teaching and that your framework is a tool for instructors to clarify that distinction.

  Someone from the empirical side of the department will ask where the data comes in, arguing that robustness-to-relaxation is purely theoretical and doesn't replace the need for empirical validation of the assumptions themselves. You should reply that data is used to determine the bounds of relaxation, so empirical work informs the robustness check rather than being replaced by it. The bluff here is that often the data is insufficient to bound the relaxation, so if they push hard on measurement you have to agree that robustness is not a substitute for empirical grounding.

  You might get a question about whether this framework solves the replication crisis, asking if models built this way would be more replicable. Your reply should be cautious, stating that it solves the logical robustness but not the computational or data transparency issues that drive replication failures. The candid note is that you want to avoid overclaiming, so admit that this is about model validity not reproducibility.

  Finally, there is one question you are hoping nobody asks, which is whether a result that survives relaxation of a false assumption is actually explaining anything at all, or if it is just a mathematical coincidence that holds for multiple wrong reasons. If this comes up, do not try to defend explanation; instead, pivot to prediction and reliability, arguing that for policy use, reliable inference is more valuable than causal explanation when the causal mechanism is unknowable. The hard truth is that if they press on explanation, your framework offers less than a realist one, so concede that point but argue that instrumental reliability is the goal of the models you are discussing.

  Regarding where your reframing buys you something versus where it is just relabelling, you gain real ground on the scaffolding point because it legitimizes idealizations like frictionless planes without forcing modellers to claim they are approximately true, which stops the realist critique before it starts. However, you are merely relabelling when you discuss load-bearing falsehoods, because that is just standard model failure, so do not spend too much time there. The real value is in the harmless category, where you can show that economists are right to ignore certain unrealistic features, provided they prove they are harmless via your robustness method. Keep your answers under two minutes, watch the clock, and if the historian starts quoting Friedman verbatim, smile and tell them you are interested in the logic of the situation rather than the history of the text. Good luck, and remember that if you make the modellers feel understood, the philosophers will have a much harder time isolating you.
