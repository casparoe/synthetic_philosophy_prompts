      *   **Specific Passage:** Near the start, regarding urns describing burial customs but not necessarily beliefs. The idea that "the same practice can come from different opinions."
      *   **Core Question:** What is Browne's actual argument? Is it skepticism (we can *never* know) or caution (be *careful*)?
      *   **Contradiction:** The user notes Browne speculates a lot later in the book. How does the initial caution fit with later speculation?
      *   **Relevance:** How does this matter for archaeological reasoning (objects $\to$ past minds)?

