      *   *The Specific Passage:* The user is referring to Chapter 1, likely around the discussion of how different nations used urns. Browne observes that urn-burial was widespread (Greeks, Romans, Britons, etc.).
      *   *The Key Insight:* "Community of Rites does not argue Community of Religion." (Or similar phrasing). Just because people do the same thing (bury in urns), it doesn't mean they believe the same thing (about death, afterlife, gods).
