  2. The claim that there is "no little inner person" is a strong constructionist reading that many sinologists reject, as Confucianism heavily emphasizes inner moral cultivation and sincerity alongside external roles. Experts would call this a simplification because roles are lived creatively rather than just scripts to be recited by a hollow self.
  3. His assertion that you can never step outside your role to criticize the system is flatly wrong, given the central Confucian doctrine of remonstrance where subordinates must correct unjust superiors. Confucian ethics demands holding leaders accountable to the Dao, meaning role obligations sometimes require challenging the very hierarchy you inhabit.
  4. A defender would object that labeling this ethics "deeply conservative" overlooks how self-cultivation is meant to transform society from the ground up rather than merely preserve tradition. The system is dynamic because roles are performative achievements requiring constant moral effort, not static birthrights you simply occupy.
  5. While Confucianism does not ground human rights in Western individualism, modern scholars argue it can support similar protections through concepts of human dignity and the moral demand on rulers to care for the people. His incompatibility conclusion holds only if you insist on Western liberal foundations, but fails if you consider functional outcomes or alternative philosophical grounding.
