prompt: |-
  I spent the best part of thirty years as a physical chemist before I retired — reaction kinetics, mostly, so I'm comfortable with entropy and stat mech — and I've been filling the empty hours with a philosophy-of-science reading group at the village hall. We've got a retired GP, a former RE teacher, and a bloke who did a maths degree and now runs a bike shop. Last week we did Maxwell's demon and it turned into a proper row. The bike-shop fellow kept shutting everyone down with the line "information is physical", as if those three words both explained why the demon can't beat the second law and settled what the whole thought experiment is really about. I've a nagging feeling he's saying something true, but that he's crammed three or four quite different claims into the same phrase, that at least one of them is doing no real work, and that one of them might be straightforwardly false or at any rate wildly overstated.

  What I'd like from you is a careful unpacking rather than a verdict: lay out the distinct precise theses that "information is physical" could be standing for, as a menu I can take back to the group, and for each one say whether it's a near-platitude, a substantive and defensible claim, or something actually mistaken — and then tell me which of them would genuinely be needed for the argument he was making, namely that the demon can't extract useful work from a single thermal bath because memory erasure and something like kT ln 2 step in to rescue the second law. I'm fine with the thermodynamics, so dont dumb it down, but I'm shaky on the quantum-computing and reversible-computation end of things, and I get lost the moment it drifts into metaphysics about whether the universe is "made of information". Could you write your answer in British English, please — the RE teacher gets sniffy about "math" and "toward".
reasoning: |-
