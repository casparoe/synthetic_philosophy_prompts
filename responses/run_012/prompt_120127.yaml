      *   *1. The Prophetic Claim (Factual):* "This specific type of event is historically impossible now." -> False, but functions as reassurance.
      *   *2. The Performative Vow (Moral):* "We bind ourselves to prevent this." -> Not true/false, but binding/non-binding. Who is "we"?
