answer: |-
  You are right to be frustrated. The phrase works *because* it is ambiguous, not in spite of it. It functions as a "floating signifier"—a container into which different groups pour different political contents while pretending they share a moral consensus. When you ask for the "precise claims," you are asking to dissolve the magic trick.

  Here is the menu of readings, analyzed for their logical status and commitments, followed by the comparative analysis of the four memory cultures you identified.

  ### Part 1: The Menu of Readings

  Here are the six distinct logical structures "Never Again" can inhabit.

  #### 1. The Prophetic Claim (Factual/Predictive)
  *   **The Claim:** "The conditions that produced this atrocity have been permanently eradicated; historically, this cannot recur."
  *   **Status:** **False.** As you noted, Cambodia, Rwanda, Srebrenica, and Darfur happened after the phrase was coined.
  *   **Function:** Reassurance. It soothes the anxiety of the survivor or the bystander. It treats the atrocity as an anomaly rather than a recurring feature of human politics.
  *   **Commitment:** None. If it happens again, the claim was just wrong, like a weather forecast.

  #### 2. The Performative Vow (Moral/Expressive)
  *   **The Claim:** "I/We bind our future will to the prevention of this."
  *   **Status:** **Not Truth-Apt.** It is neither true nor false; it is *felicitous* or *infelicitous* (sincere or insincere). It is like saying "I do" at a wedding.
  *   **Function:** Identity formation. It defines the speaker as a member of the "moral community" that opposes the atrocity.
  *   **Commitment:** Psychological consistency. If you break the vow, you suffer cognitive dissonance or social censure, but there is no automatic mechanism to stop the atrocity.
  *   **Relation to "Never Forget":** "Never Forget" is the epistemic condition (keep the data); "Never Again" is the volitional condition (change the behavior). You can have one without the other.

  #### 3. The Doctrine of Intervention (Political/Strategic)
  *   **The Claim:** "Sovereignty is conditional. If a state harms its people, the international community must intervene, including militarily." (Often linked to the "Responsibility to Protect" or R2P doctrine).
  *   **Status:** **Contingently True/False.** It depends on geopolitical will, intelligence capabilities, and military logistics.
  *   **Function:** Justification for foreign policy. It converts memory into force.
  *   **Commitment:** This is the most expensive reading. It commits you to:
      1.  Maintaining intelligence apparatuses to detect early warnings.
      2.  Spending blood and treasure on conflicts that do not directly threaten your security.
      3.  Accepting the moral hazard of "humanitarian bombing" (killing people to save them).
  *   **Why people use it:** It allows politicians to sound moral while discussing military budgets.

  #### 4. The Particularist Shield (Identity/Survival)
  *   **The Claim:** "Never again *to us*."
  *   **Status:** **Truth-Apt (in principle).** It is a statement of group survival strategy.
  *   **Function:** Solidarity and defense. It prioritizes the safety of the specific group over universal human rights.
  *   **Commitment:** This often commits you to realpolitik that contradicts the Universalist reading. For example, supporting an authoritarian ally because they protect your group, or opposing immigration because it threatens group cohesion.
  *   **Conflict:** This reading fights the **Intervention** reading. If "Never Again" means "Never Again to Jews," it might mean supporting Israel regardless of its policies. If it means "Never Again to Anyone," it might mean criticizing Israel's treatment of Palestinians. These cannot both be operationalized simultaneously without tension.

  #### 5. The Legal Codification (Juridical)
  *   **The Claim:** "The state will criminalize the denial, minimization, or glorification of this specific past event."
  *   **Status:** **Enforceable/Unenforceable.** It is a statement of positive law.
  *   **Function:** Memory management. It makes a specific historical narrative a requirement of citizenship.
  *   **Commitment:** It commits the state to policing speech. It presupposes that truth is best protected by state coercion rather than open debate.
  *   **Risk:** It can turn memory into a ritual of compliance rather than genuine understanding. People memorize the law, not the history.

  #### 6. The Appropriated Grievance (Rhetorical/Inverted)
  *   **The Claim:** "We are the victims now; this policy/action is equivalent to that atrocity."
  *   **Status:** **Analogical.** It relies on a metaphorical leap (e.g., mask mandates = Holocaust, gun control = genocide).
  *   **Function:** Moral amplification. It attempts to borrow the moral capital of the original victims to win a contemporary political argument.
  *   **Commitment:** It commits the speaker to a worldview where their current inconvenience or political loss is existential.
  *   **Effect:** It often dilutes the specific meaning of the original atrocity (trivialization) while radicalizing the speaker's own base.

  ---

  ### Part 2: The Four Memory Cultures

  Your intuition is correct: Germany, Japan, Turkey, and the American South are not running four versions of the same software. They are running four different operating systems. The comparison is often confused because observers assume "coming to terms with the past" looks the same everywhere. It does not.

  #### 1. Germany: The Guilt-Redemption Complex
  *   **Dominant Reading:** **Performative Vow + Legal Codification + Intervention.**
  *   **The Mechanism:** Germany fused *Nie wieder Krieg* (Never again war/pacifism) with *Nie wieder Auschwitz* (Never again genocide/responsibility).
  *   **How it works:**
      *   **Domestically:** It is **Legal Codification**. Holocaust denial is a crime (Section 130 StGB). Memory is state policy.
      *   **Internationally:** It is **Intervention**. Because Germany committed atrocities, it accepts a "special responsibility" (*Staatsräson*) to protect Israel and support human rights interventions. This is why Germany intervened in Kosovo and supports Israel militarily.
      *   **The Tension:** The pacifist vow ("No more war") conflicts with the interventionist vow ("Stop genocide"). Germany struggles with this constantly (e.g., hesitancy on Ukraine initially, then sending tanks).
  *   **Is it available?** Yes, but it requires a stable democracy and a consensus on perpetratorhood.
  *   **The Commitment:** Permanent moral debt. Germany commits to never prioritizing its national interest over its historical responsibility.

  #### 2. Japan: The Victimhood Pacifism
  *   **Dominant Reading:** **Particularist Shield ("Never Again to Us") + Prophetic Claim.**
  *   **The Mechanism:** Article 9 of the Constitution renounces war. However, the memory culture focuses on Hiroshima and Nagasaki, not Nanking or the Comfort Women.
  *   **How it works:**
      *   **The Vow:** "Never again will *Japan* suffer." It is a vow of national survival, not necessarily a vow of universal human rights.
      *   **The Blind Spot:** Because the focus is on Japanese victimhood, the **Intervention** reading is weak. Japan is historically reluctant to intervene abroad or admit perpetration, as that complicates the victim narrative.
      *   **Legal:** No laws against denial. Textbooks often minimize aggression.
  *   **Is it available?** It is available, but it blocks the "Perpetrator" analysis. You cannot say "Never Again" to genocide if you do not admit you committed it.
  *   **The Commitment:** Constitutional pacifism, but often passive diplomacy. It commits Japan to relying on the US for security while maintaining a moral stance of "we don't fight."

  #### 3. Turkey: The Denialist Fortress
  *   **Dominant Reading:** **Legal Codification (Inverted) + Appropriated Grievance.**
  *   **The Mechanism:** The state defines the "truth" via Article 301 (insulting Turkishness).
  *   **How it works:**
      *   **The Claim:** "Never Again" is unavailable because the premise ("It happened") is denied. Instead, the slogan is inverted: "Never Again will we be weakened by internal enemies."
      *   **Legal:** Memory laws are used to *suppress* memory, not preserve it. Acknowledging the Armenian Genocide is treated as a threat to national security.
      *   **Appropriation:** Turks often claim they were the victims of partition and invasion (Sèvres Syndrome).
  *   **Is it available?** No. The Universalist and Interventionist readings are structurally blocked by the state's founding myth. To adopt "Never Again" universally would require dismantling the nationalist foundation of the Republic.
  *   **The Commitment:** Permanent vigilance against "traitors." It commits the state to censorship and the conflation of historical critique with treason.

  #### 4. The American South: The Restorationist Counter-Slogan
  *   **Dominant Reading:** **The Opposite ("The South Will Rise Again").**
  *   **The Mechanism:** This is not a "Never Again" culture; it is a "Once Again" culture.
  *   **How it works:**
      *   **The Claim:** The social order that existed before the "atrocity" (from the Confederate perspective, the loss of the war/emancipation) should be restored.
      *   **Relation to "Never Again":** When Southern apologists use "Never Again," they use the **Particularist Shield** regarding "states' rights" or "heritage," or the **Appropriated Grievance** (claiming "Northern aggression" was the genocide).
      *   **The Confederate Guy:** The man shouting about the Confederacy at the Armenian talk was likely using the **Appropriated Grievance** reading. He views the destruction of Confederate monuments as equivalent to cultural genocide.
  *   **Is it available?** The Universalist "Never Again" is actively fought against because it delegitimizes the foundational heroes of the region.
  *   **The Commitment:** Restoration of hierarchy. It commits the group to resisting federal overreach and maintaining a specific cultural memory that excludes the enslaved experience.

  ### Part 3: Synthesis

  You asked what each reading commits you to that people haven't thought about. Here is the summary of the hidden costs:

  1.  **If you mean the Intervention Reading:** You commit to killing people to save people. You cannot be a pure pacifist. You must fund intelligence agencies. You must accept that you will sometimes be wrong (Iraq).
  2.  **If you mean the Particularist Reading:** You commit to potential hypocrisy. You may have to ignore atrocities committed by your allies if they protect your group. You cannot claim moral universalism.
  3.  **If you mean the Legal Reading:** You commit to state censorship. You hand the government the power to define historical truth, which can be weaponized later (see Turkey).
  4.  **If you mean the Performative Vow:** You commit to nothing but your own conscience. It is cheap morality. It allows you to feel good while changing nothing.

  **Why the comparison is confused:**
  Observers often treat "Memory Culture" as a scalar value (Good Memory vs. Bad Memory).
  *   **Germany** is treated as "Good" because it accepts Perpetrator status.
  *   **Japan** is "Mixed" because it accepts Victim status but obscures Perpetrator status.
  *   **Turkey** is "Bad" because it denies Victim status (of others).
  *   **The South** is "Regressive" because it seeks to restore the Perpetrator status.

  They are not points on a line. They are different geometric shapes. Germany's "Never Again" requires the dismantling of national sovereignty in favor of universal norms. The South's "Rise Again" requires the re-assertion of local sovereignty against universal norms. Japan's "Never Again" requires the renunciation of military sovereignty. Turkey's "Never Again" (to us) requires the hyper-assertion of military sovereignty.

  When your brother-in-law used it for Syria, he was using the **Intervention** reading.
  When the climate marchers used it, they were stretching the **Universalist/Prevention** reading to ecological collapse (a category error, strictly speaking, but rhetorically effective).
  When the guy shouted about the Confederacy, he was using the **Appropriated Grievance** reading.
  When it is on the wall in Berlin, it is the **Legal/Performative** reading fused with State Reason.

  They are all saying different words. They just happen to share a dictionary.
