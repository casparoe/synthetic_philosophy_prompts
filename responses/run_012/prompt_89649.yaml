answer: |-
  **To:** The Hospitality Committee
  **From:** The Chair
  **Subject:** Protocol for Adjudicating Normative Complaints Regarding Visiting Researchers

  ### Preamble
  As scientists, we rely on protocols to distinguish signal from noise. In hospitality, complaints about visitor behavior often conflate *moral failures* (violations of fairness or harm) with *cultural friction* (breaches of local convention) or *misaligned reactive attitudes* (resentment where none is due). 

  This document provides a decision procedure to adjudicate such complaints. It is grounded in the distinction between **coordination conventions** (David Lewis), **fairness obligations** (John Rawls/T.M. Scanlon), and the **harm principle** (J.S. Mill). It also incorporates the **epistemic condition** for blame (what the agent could reasonably know) and the distinction between an act being **wrong** and an act being a **fitting object of resentment** (P.F. Strawson).

  This procedure is advisory. It does not replace human judgment but structures it to minimize bias and cultural imperialism.

  ---

  ### The Decision Procedure

  **Input:** A specific complaint regarding a visitor's action (e.g., "Dr. X did not tip," "Dr. Y cut the queue").

  #### Step 1: The Harm and Safety Gate
  **Question:** Did the action cause direct physical harm, significant material loss, or measurable safety risk to others?
  *   **Sufficient Answer for "Yes":** Evidence of injury, property damage, or violation of a safety protocol designed to prevent immediate physical danger (e.g., ignoring radiation shielding).
  *   **Sufficient Answer for "No":** The complaint cites offense, disorder, or technical illegality without physical consequence (e.g., crossing a street with no traffic).
  *   **Verdict:**
      *   If **Yes**: The act is a **Moral Failure**. The visitor is bound by the universal obligation not to harm. Proceed to *Sanction*.
      *   If **No**: Proceed to Step 2.

  #### Step 2: The Fairness and Coordination Gate
  **Question:** Does the violated norm exist primarily to solve a coordination problem or ensure equitable access to a scarce resource?
  *   **Sufficient Answer for "Yes":** The norm prevents conflict or ensures "first-come, first-served" equity (e.g., queuing, reserving shared equipment, citation priority).
  *   **Sufficient Answer for "No":** The norm is symbolic, expressive, or purely economic without a direct fairness implication (e.g., dress codes, tipping where wages are not substandard, forms of address).
  *   **Verdict:**
      *   If **Yes**: The act is a **Moral Failure** (violation of fairness). Proceed to Step 3 to assess blame.
      *   If **No**: The act is **Not a Moral Matter** (breach of custom only). Proceed to Step 4.

  #### Step 3: The Epistemic and Asymmetry Gate (Assessing Blame)
  *Applicable if Step 1 or 2 returned "Moral Failure."*
  **Question:** Did the visitor have reasonable notice of the obligation, and did the host institution fulfill its duty to warn?
  *   **Sufficient Answer for "Visitor Bound":** The norm is universal among scientists (e.g., data integrity), explicitly stated in orientation materials, or the visitor has stayed long enough that ignorance is no longer plausible (typically >2 weeks).
  *   **Sufficient Answer for "Visitor Excused":** The norm is highly local/obscure, the Institute failed to provide written/orientation notice, or the visitor is in the first few days of arrival.
  *   **Resident-Visitor Asymmetry Principle:** Residents may demand compliance with fairness/safety norms, but they bear the burden of communicating local specificities. Ignorance excuses the *blame*, not necessarily the *act*.
  *   **Verdict:**
      *   If **Visitor Bound**: The visitor is morally culpable.
      *   If **Visitor Excused**: The act remains wrong (per Step 1/2), but **Resentment is Unfitting**. The remedy is education, not censure.

  #### Step 4: The Reactive Attitudes Gate (Assessing Resentment)
  *Applicable if Step 2 returned "Not a Moral Matter" OR Step 3 returned "Visitor Excused."*
  **Question:** Is the complainant's resentment proportionate to the violation, or does it signal a demand for cultural assimilation?
  *   **Sufficient Answer for "Resentment Unfitting":** The complaint relies on "we don't do that here" without appeal to fairness or harm, or the complainant refuses to accept the visitor's cultural background as a mitigating factor.
  *   **Sufficient Answer for "Resentment Fitting":** The behavior, while not strictly "moral," signals a disregard for the host's dignity that impedes collaboration (e.g., persistent refusal to use agreed-upon titles).
  *   **Verdict:**
      *   If **Resentment Unfitting**: The Committee should counsel the *complainant*, not the visitor.
      *   If **Resentment Fitting**: The Committee should mediate a mutual adjustment.

  #### Step 5: The Value Conflict Referral
  **Condition:** If the Committee cannot agree on the classification in Step 2 (e.g., is tipping a fairness issue or a market price?) or Step 4 (e.g., is a specific custom essential to dignity?).
  *   **Action:** **Refer to Full Committee Vote.**
  *   **Reason:** This indicates a clash of fundamental values (e.g., egalitarianism vs. libertarianism) rather than a factual application of norms. The Institute must decide what kind of community it wishes to be.

  ---

  ### Test Cases

  Here is the procedure applied to the three recurring disputes.

  #### Case 1: Cutting the Queue
  *   **Step 1 (Harm):** No physical harm. (Proceed to Step 2).
  *   **Step 2 (Fairness/Coordination):** **Yes.** Queuing is a paradigmatic coordination convention designed to ensure fair access to a scarce resource (service/entry) and prevent conflict. Cutting violates the principle of reciprocity: "I wait for you, you wait for me."
  *   **Step 3 (Epistemic):** Queuing is a near-universal scientific community norm. Ignorance is rarely plausible after Day 1.
  *   **Verdict:** **Moral Failure.** The visitor is bound. Resentment is fitting. The Committee should censure the behavior.

  #### Case 2: Not Tipping
  *   **Step 1 (Harm):** No direct physical harm. (Proceed to Step 2).
  *   **Step 2 (Fairness/Coordination):** **Refer to Committee.** 
      *   *Reasoning:* This turns on local labor facts. In jurisdictions where tipped wages are below subsistence, tipping functions as a wage subsidy, making it a **Fairness** issue (Step 2 Yes). In jurisdictions where service charges are included or wages are living, tipping is a **Custom/Market** issue (Step 2 No).
      *   *Philosophical Ground:* This distinguishes between a *gratuity* (gift) and a *deferred wage* (obligation). The Committee must verify the local economic structure before adjudicating.
  *   **Verdict:** **Referral.** The Committee must establish the Institute's stance on local wage ethics before ruling.

  #### Case 3: Jaywalking on an Empty Street
  *   **Step 1 (Harm):** **No.** By definition, the street is empty; no safety risk or material loss occurred.
  *   **Step 2 (Fairness/Coordination):** **No.** Traffic signals are coordination norms, but on an empty street, the coordination problem dissolves. There is no queue to cut, no other driver to confuse.
  *   **Step 4 (Reactive Attitudes):** **Resentment Unfitting.**
      *   *Reasoning:* The complaint rests on "rule-following for its own sake." While residents may prefer law-abidingness, demanding a visitor treat a traffic signal as a moral absolute in the absence of harm is a demand for cultural assimilation, not moral compliance.
  *   **Verdict:** **Not a Moral Matter.** The Committee should counsel the *complainant* that their resentment is disproportionate.

  *(Note: I anticipate Case 3 will be the verdict you dislike. Many of us hold a deontological intuition that law-breaking is inherently disrespectful to the social contract. However, this procedure follows a Scanlonian/Millian line: without harm or unfairness to specific others, the "wrongness" is negligible, and resentment is a vice, not a virtue.)*

  ---

  ### Limitations: What This Procedure Cannot Settle

  As Chair, you must know where this algorithm fails. It cannot resolve:

  1.  **Systemic Injustice:** If a local custom is itself immoral (e.g., segregation, gender-based exclusion), Step 2 may flag it as a "coordination norm," but the visitor is morally justified in violating it. The procedure assumes the host norms are at least minimally just.
  2.  **Deep Value Pluralism:** If the Institute hosts visitors from cultures with fundamentally different conceptions of time, hierarchy, or individualism, Step 5 will be triggered frequently. The procedure cannot synthesize incompatible values; it can only flag them for democratic decision.
  3.  **The "Slippery Slope" of Custom:** It cannot determine exactly when a repeated breach of custom becomes a breach of respect (Step 4). One instance of jaywalking is trivial; fifty instances may signal a disregard for the host community's order that warrants mediation.

  ### Implementation Note
  This document is to be included in the Orientation Handbook. It serves two purposes: it guides the Committee, and it signals to visitors that we value **fairness and harm reduction** over **blind conformity**. 

  **Signed,**
  **The Chair**
