prompt: |-
  I am a retired experimental physicist who has spent the last several years reading moral and political philosophy, and I now chair the hospitality committee at the research institute where I spent my career. We host visiting researchers from many countries, and every cohort produces the same small crop of disputes: a fellow who does not tip at a restaurant, one who joins a queue at the front rather than the back, one who crosses against the signal on an empty street. Several of my colleagues insist that these are moral failures rather than mere breaches of local custom, and that a guest is obligated to observe the conventions of the host country. I would like a decision procedure the committee can actually run, in writing, on any such complaint.

  Give me the questions to ask in order, what counts as a sufficient answer at each step, where the procedure returns a clear verdict that this is not a moral matter or that it is and the visitor is bound, and where it must stop and refer the question to the committee because it turns on values rather than facts. Ground the distinctions in whatever the philosophy of convention and of moral obligation genuinely supports; in particular, I want the procedure to separate conventions that solve a coordination problem from those that merely mark group membership from those that track an antecedent moral requirement such as fairness to those who waited. It should also say something principled about the resident–visitor asymmetry: what a resident may demand of a guest, what a guest's ignorance excuses, whether the host institution has any duty to warn, and — a distinction I suspect most of the confusion turns on — the difference between an act's being wrong and its being a fitting object of resentment.

  Then run the procedure on three cases: not tipping, cutting a queue, and jaywalking on an empty street, including whichever one it handles in a way I will not like. Close by telling me what the procedure cannot settle. It will appear as advisory guidance in our orientation handbook; I hold final sign-off, and it must be usable by a committee of scientists with no philosophical training.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired experimental physicist, now chairs hospitality committee at a research institute. Well-read in moral/political philosophy.
      *   **Task:** Create a written decision procedure for the committee to adjudicate complaints about visiting researchers' behavior (tipping, queueing, jaywalking, etc.).
      *   **Requirements:**
          *   Step-by-step questions with sufficient answer criteria.
          *   Clear verdicts: "Not a moral matter," "Moral matter/Visitor bound," or "Refer to Committee (Value Judgment)."
          *   Philosophical grounding: Distinguish coordination conventions, group membership markers, and antecedent moral requirements (fairness, harm).
          *   Address resident-visitor asymmetry (demands, ignorance/excuses, host duty to warn).
          *   Distinguish between *wrongness* and *fittingness of resentment*.
          *   Run the procedure on three cases: Not tipping, Queue cutting, Jaywalking (empty street).
          *   Include at least one outcome the user might *not* like (intellectual honesty).
          *   Closing: What the procedure *cannot* settle.
          *   Tone/Style: Advisory guidance for an orientation handbook, usable by scientists without philosophical training, but rigorous enough for a philosophy-literate chair.

  2.  **Philosophical Grounding (Mental Sandbox):**
      *   *Conventions vs. Morals:* David Lewis (Convention), Hume (Justice as artificial virtue), Rawls (Fairness), Scanlon (What we owe to each other).
      *   *Coordination Problems:* Queueing is a classic coordination norm to prevent conflict/ensure fairness. Tipping is more complex (wage subsidy vs. gratuity). Jaywalking is safety/regulation.
      *   *Visitor Obligations:* The principle of "When in Rome..." (cultural relativism vs. universalism). Scanlonian contractualism: Could the visitor reasonably reject the rule?
      *   *Wrongness vs. Resentment:* Strawson (Reactive Attitudes). An act can be objectively wrong but resentment inappropriate due to ignorance or context.
      *   *Epistemic Condition:* Did the visitor know? Should they have known? (Host duty to inform).

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   Need a flowchart style but in text.
      *   *Step 1: Harm/Safety.* Does it cause direct physical harm or significant material loss? (Mill's Harm Principle).
      *   *Step 2: Coordination/Fairness.* Does it violate a system designed to ensure fair access or order? (Rawls/Queueing).
      *   *Step 3: Knowledge/Notice.* Did the visitor know? Was the host clear? (Epistemic condition).
      *   *Step 4: Resentment vs. Correction.* Is the emotional reaction proportionate? (Strawson).
      *   *Referral:* Where do we get stuck? When values clash (e.g., is tipping *really* moral?).

  4.  **Refining the Steps for Scientists:**
      *   Use clear logic gates.
      *   Define "Sufficient Answer."
      *   Ensure the "Visitor Asymmetry" is baked in (ignorance excuses, host duty to warn).
      *   Ensure the "Wrong vs. Resentment" distinction is explicit.

  5.  **Developing the Three Test Cases:**
      *   *Queue Cutting:* Clear coordination/fairness issue. Likely "Moral Matter."
      *   *Jaywalking (Empty Street):* Safety rule, but no actual harm. Coordination vs. Law. Likely "Not a Moral Matter" (or at least, resentment unfitting). This might be the one the user dislikes if they value rule-following intrinsically.
      *   *Tipping:* Economic convention vs. Moral obligation to workers. Highly contextual. Likely "Refer to Committee" or "Not a Moral Matter" depending on local wage laws. Let's make it nuanced.

  6.  **Addressing the "Outcome I Will Not Like":**
      *   Physicists often value rules and order. Jaywalking on an empty street is technically illegal but morally trivial. If the procedure says "This is not a moral failure and resentment is unfitting," a rule-abiding physicist might find that permissive.
      *   Alternatively, Tipping. If the procedure says "Tipping is a local economic convention, not a moral duty unless wages are substandard," that might clash with the "When in Rome" intuition.
      *   *Decision:* I will make the Jaywalking verdict the "unlikeable" one for a rule-follower (it excuses the behavior), or the Tipping one (it limits the moral obligation). Let's go with Jaywalking being *not* a moral matter, as that challenges the "law = morality" intuition.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's background. Set the tone (rigorous but practical).
      *   **The Procedure (The "Protocol"):**
          *   Q1: Harm/Safety (Mill).
          *   Q2: Fairness/Coordination (Rawls/Lewis).
          *   Q3: Epistemic/Notice (Host Duty).
          *   Q4: Resentment Appropriateness (Strawson).
      *   **The Asymmetry Clause:** Explicitly state the guest's burden vs. host's duty.
      *   **The Test Runs:**
          *   Queueing: Verdict = Moral Failure (Fairness).
          *   Tipping: Verdict = Refer/Contextual (Economic convention vs. Moral wage).
          *   Jaywalking: Verdict = Not Moral (No harm, coordination irrelevant on empty street). *This is the likely friction point.*
      *   **Limitations:** What can't be solved? (Deep cultural value clashes, systemic injustice).

  8.  **Review against Constraints:**
      *   *Philosophical Grounding:* Need to name-drop or implicitly use Lewis, Rawls, Mill, Strawson without jargon overload.
      *   *Usable by Scientists:* Keep it algorithmic.
      *   *Wrong vs. Resentment:* Make sure Step 4 handles this.
      *   *Visitor Asymmetry:* Ensure Step 3 handles ignorance.

  9.  **Refining the "Dislike" Aspect:**
      *   I need to make sure I explicitly point out which result might be unpopular. The Jaywalking case is the best candidate. Many people feel rule-breaking is inherently disrespectful to the social contract, even without harm. A strict deontological view would clash with the consequentialist/coordinative view of this procedure.

  10. **Final Polish:**
      *   Check tone: Respectful of the user's expertise, authoritative but advisory.
      *   Ensure the "Refer to Committee" path is clear for value-laden disputes.

  *(Self-Correction during drafting)*: I initially thought about making Tipping the "Not Moral" case. But in the US (implied by "tipping" dispute), tipping is often a moralized substitute for wages. It's better to mark that as a "Referral" because it depends on local labor law facts. Jaywalking on an empty street is a clearer candidate for "Not Moral" based on the Harm Principle, which might annoy a rule-and-order type. I will proceed with that.

  *(Refining the Procedure Steps)*:
  1.  **Harm/Safety:** Is there direct harm?
  2.  **Fairness/Coordination:** Does it bypass a system designed for equitable access?
  3.  **Notice/Epistemic:** Was the rule communicated?
  4.  **Reactive Attitudes:** Is resentment the right response?

  Let's write it.

  *(Final check on the "Visitor Asymmetry")*: I need to ensure the procedure explicitly weighs the *Host's duty to inform* against the *Guest's duty to inquire*. The prompt asks for "what a resident may demand... what ignorance excuses." I will build this into Step 3.

  *(Final check on "Wrong vs. Resentment")*: This needs to be Step 4. An act can be wrong (violates a norm) but resentment is unfitting (due to ignorance or triviality).

