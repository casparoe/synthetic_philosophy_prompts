answer: |-
  **Conceptual Framing**
  1. *Metaphysical:* Is it punishment? (Buy: Clean cut. Cost: Too semantic.)
  2. *Responsibility:* Who owes answers? (Buy: Connects to standing. Cost: Drifts into collective responsibility.)
  3. *Justificatory:* Do justifications require an agent? (Buy: Targets normative machinery. Cost: Complex.)
  **Commitment:** Framing 3. It forces a verdict on whether agency is constitutive of justification.

  ***

  **Project Title:** The Agential Anchor: Justification Without a Punisher

  **The Question**
  Standard justifications of punishment fail when no agent imposes the sanction. This is not a topic area but a truth-apt claim: either agent-neutral sanctions can be justified by standard theories (retribution, deterrence, expression), or they cannot. I argue they cannot. The project tests whether the validity of a sanction constitutively depends on there being an agent who owns its severity.

  **The Gap**
  Existing discourse leaves this open because both sides assume a punisher. The "punishment" camp argues deplatforming is unjust because it lacks due process, assuming someone *owed* process. The "consequences" camp argues it is merely market speech, assuming no justification is needed. Both miss the normative vacuum: harm is imposed systematically, yet no agent intends the sentence. My question puts the punisher in doubt. If justification requires an imposer, then leaderless sanctions are not merely unjust; they are categorically unjustifiable, regardless of the target's guilt.

  **Method**
  This is purely conceptual work over six months. I will construct three cases to isolate the variable of agency.
  1. *Target Case:* Viral shaming where individual contributors act defensibly, but the aggregate destroys a career.
  2. *Control Case:* Market price fluctuations causing identical reputational or financial ruin. This is clearly sanction-like in effect but equally unowned. If my intuition says the shaming is wrong but the market is not, "no punisher" is not the explanatory factor.
  3. *Contrast Case:* A formal judicial error. Here, a punisher exists but the outcome is unjust. This isolates whether the *presence* of an agent is sufficient for justification attempts, or if the *exercise* of agency is required.

  The work involves iterating these cases to see which normative principles hold. I will not survey participants; I will test reflective equilibria.

  **Objection: The Problem of Many Hands**
  The obvious objection is that this is merely the "problem of many hands" in collective responsibility literature. It is not. That literature asks: "Who is responsible for this harm?" It seeks to distribute blame across contributors. My question is prior: "Can this harm be justified if no one is responsible?" Collective responsibility tries to find an agent to hold accountable. I ask if justification is possible when no agent exists to hold. If I am right, aggregating individual blameworthiness cannot rescue the sanction, because the sanction itself lacks an author.

  **Results and Failure Conditions**
  The result will be a principle of "Agential Requirement": a sanction is unjustifiable unless an agent intends the severity as a normative message.
  **Failure Condition:** I will count the project as failed if I cannot articulate a normative difference between viral shaming and a natural disaster causing reputational loss. If the only difference is "people did it," without a further account of why agency matters for justification, the project collapses into a semantic complaint. I need to show why agency changes the normative status, not just the metaphysical category.

  **Scope Check**
  Six months part-time allows for deep conceptual work but no empirical genealogy. I must cut the historical analysis of shaming practices; the logic matters, not the lineage. I must also cut the comparative law angle; domestic philosophical consistency is the priority. The deliverable is a single paper establishing the Agential Requirement, not a taxonomy of shaming types. If I find myself cataloging platforms or incidents, I am out of scope. The work is done when the principle holds across the three cases.

  Core question: Can standard justifications of punishment apply when no agent imposes the sanction?
