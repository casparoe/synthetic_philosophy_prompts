prompt: |-
  I'm putting together a proposal for a small internal workshop grant — I'm a postdoc, six months, no budget for anything empirical, so its a purely conceptual project — and I've got a half-formed idea I want you to turn into an actual proposal. Take the role of a philosopher of law who also knows the social epistemology of blame and public shaming: someone who will make me state the question precisely and won't let me hand-wave. Think it through carefully before you start writing, and open with a short brainstorm — sketch two or three candidate framings of the idea below, say what each one buys and what it costs, then commit to one and tell me in a line why.

  Here's the half-formed idea. Almost every serious discussion of cancel culture, deplatforming, shaming and so on begins by asking "is this punishment, and if so is it justified?", then reaches for the standard menu — retribution, deterrence, incapacitation, rehabilitation, restoration, the expressive/denunciatory idea that the point is society marking a wrong. Both sides seem to assume a punisher: an agent who decides, imposes, calibrates, and could in principle stop. But the signature feature of the phenomenon, I think, is that there isn't one. Someone says something stupid on twitter; then a lot of strangers each do something small and individually defensible — quote-tweet it, unsubscribe, quietly decline to hire, mention it to someone on a committee — and the upshot is a lost job, a wrecked year, a name that now means "that guy." Nobody chose the sentence. Nobody is answerable for its severity. Nobody can call it off. So the question I actually care about: do the standard justifications of punishment even get a grip when the sanction is leaderless — when there's no punisher, only a crowd of contributors who mostly don't think of themselves as punishing anyone? More sharply: is the justification (or the wrongness) of a sanction a function of the sanction itself, or does it constitutively depend on there being an agent who imposes it and owns its severity? I want to know whether "who did this to me?" is a separate question from "was this deserved?", or the same question wearing a disguise.

  What I need from you, as the proposal document:

  - The question stated so that it has a determinate answer — something that could come out true or false, not a topic area.
  - Why the existing answers leave it open: what exactly do the "it's punishment" camp and the "it's just consequences, no one owes you a platform" camp each assume that my question puts in doubt? I don't want a survey, just the load-bearing assumptions.
  - The method. What would I actually do, step by step, over six months? I'd rather it be conceptual work with cases than anything quantitative — tell me what the cases are for, which ones do the work, and what a control case looks like (something that's clearly sanction-like but equally unowned, so I can tell whether "no punisher" is doing any explanatory work or just decorating a familiar complaint).
  - Take seriously the obvious objection that this is just the old problem of many hands / collective responsibility, already well worked over, and say why my question is or isn't the same thing.
  - What a result looks like (a principle? a taxonomy? a verdict on whether unowned sanctions can be justified at all?) and what would count as the project failing — I want the failure conditions stated so specifically that I'd notice if I hit one.
  - An honest scope check for six months of part-time work, including what I should cut.

  Don't bother with citations or a literature review by name-dropping — I'll fill those in myself. Write it as prose I could paste into an application, maybe 700–900 words, in my voice, first person.

  Last line, on its own, in exactly this form and nothing after it: Core question: <one sentence, no more than 30 words>
