answer: |-
  The ice in Elena's gin tonic had already surrendered, leaving the glass sweating onto the coaster of the Hotel Berlin lobby bar. Around her, the hum of the International Union of Geological Sciences meeting was dissolving into the clink of bottles and the loosened ties of people who had just spent six hours arguing about the fate of deep time.

  Elena stared at the condensation running down the glass. It looked like a stratigraphic column. Thin layers of water accumulating, gravity pulling them down.

  "They voted it down," Simon said, sliding into the chair opposite her. He didn't order a drink. He just looked tired, the kind of tired that settles in the marrow. "Twelve to four in the Subcommission. They won't recommend it to the IUGS. The Anthropocene isn't getting the Golden Spike."

  Elena nodded. She had been in the room. She had watched the hands go up. She had watched fifteen years of work—her work, the work of the working group—collapse into a handful of raised knuckles.

  "So," she said. Her voice sounded strange to her, too loud against the carpeted quiet of the bar. "We're still in the Holocene."

  "Technically," Simon said. "Officially. For the charts. For the textbooks that take ten years to print."

  "But not for the planet."

  "No," Simon said. "Not for the planet."

  Elena closed her eyes and saw the mud. Crawford Lake, Ontario. A little sinkhole protected from the wind, where the sediment settled in perfect, annual layers like tree rings made of earth. She had spent three summers there, leaning over the edge of a boat, pulling up cores that smelled of iron and ancient decay. She had seen the layer. Everyone had seen the layer. The mid-twentieth century spike. Plutonium-239. The bright, radioactive fingerprint of the bomb tests sitting in the dark mud like a scar.

  It was clean. It was global. It was undeniable. They wanted to hammer a physical marker into that sediment, a Golden Spike to say: *Here. This is where the world changed. This is where humans became a geological force.*

  But a committee had decided that a spike in plutonium was too narrow a definition for the end of an epoch. They said the record was too short. They said the start date, 1950, was too recent. They whispered about the Orbis Spike of 1610, when colonization emptied the Americas, when forests grew back over the graves of millions and CO2 dipped in the ice cores. They whispered about the Industrial Revolution, about coal smoke and steam engines.

  They couldn't agree on where to cut the line. So they left the line uncut.

  "It feels like gaslighting," Elena said, tracing the rim of her glass. "We all know the house is on fire. But because we can't agree on who lit the match, we're refusing to call it an arson."

  "It's stratigraphy, El. It's about precision. If the signal isn't synchronous enough—"

  "Don't give me the syncopation speech," she snapped, then softened. "Sorry. I know. I know the rules. But look at us." She gestured to the room, to the phones buzzing on the tables, to the people outside sleeping under lights that burned all night. "We are a geological force. We move more sediment than the rivers. We change the chemistry of the rain. We are writing ourselves into the rock."

  "And that's the problem," Simon said quietly. "Who is 'we'?"

  Elena looked at him.

  "The Anthropocene," Simon continued, staring at his own hands. "The name itself. *Anthropos*. Human. It implies all of us. It implies that a subsistence farmer in Mali and a CEO in Houston contributed equally to the plutonium in Crawford Lake. By naming it the Age of Man, we let the specific systems off the hook. We make it a species crime, not a political one."

  Elena felt a chill that had nothing to do with the air conditioning. That was the thing that had kept her awake during the deliberations. The vote wasn't just about geology; it was about guilt. To formalize the epoch was to formalize the damage. And if you formalize the damage, you have to identify the damager.

  If they picked 1610, it was about empire and genocide. If they picked 1780, it was about capitalism and coal. If they picked 1950, it was about the military-industrial complex and the atom. By picking none of them, by keeping it informal, they kept it vague. They kept it safe.

  "So we vote," Elena said. "Twenty people in a conference room in Berlin. We raise our hands, and we decide whether the Earth has entered a new state of being."

  "It's absurd," Simon admitted. "It's hubris. To think we can define the planet's time by our own calendars. The rocks don't care about our committees."

  "But we care," Elena said. "I care."

  She thought about the core tube in her lab back in Leeds. It was stored in a climate-controlled room, locked away. It was just mud. Organic matter, silica, isotopes. But to her, it was a testimony. It was the only honest witness they had. The mud didn't lie. The mud didn't vote. It just accumulated.

  The rejection didn't change the mud. The plutonium was still there. The microplastics were still settling in the deep ocean trenches. The nitrogen from the fertilizers was still saturating the soil. The epoch was real, even if the stamp was denied.

  "It's like," Elena struggled for the analogy, "like declaring a war never happened because the treaty wasn't signed correctly."

  "Maybe," Simon said. "Or maybe it's admitting that the war isn't over. You can't mark the end of the Holocene if you don't know what comes next. If we name it the Anthropocene, we imply stability. We imply this is the new normal. Maybe the commission is afraid to admit that this isn't an epoch. It's a event. A spike. A catastrophe."

  Elena finished her drink. The ice was gone. The gin was warm.

  "I spent fifteen years on this," she said, not looking at him. "I thought... I thought if we named it, people would wake up. If we put it in the rock record, if we made it official science, it would be undeniable. It would force action."

  "Did you really think a name would stop the burning?" Simon asked gently.

  "I thought it might shame us," she said. "I thought carrying the weight of a geological epoch might make us hesitate before burning the next ton of coal. To know that you are living in the Age of Humans, and that the humans are the asteroid."

  Simon signaled for the check. "The name doesn't exist. But the thing does. You still have the core. You still have the data."

  "It feels like a burial," Elena said. "We killed the name because the body was too ugly to look at."

  They stood up to leave. The lobby was quiet now. The geologists had retreated to their rooms to sleep, to dream of fault lines and fossil beds. Elena walked to the revolving door and pushed it open.

  The Berlin night air was cool, smelling of exhaust and rain. Above her, the sky was orange-gray, lit by the city's glow. No stars were visible. The atmosphere itself was changed, thick with the particulates of millions of lives burning energy to stay warm, to move, to exist.

  She looked up at the sky, then down at the pavement. Somewhere, deep underground, the layers were forming. Future beings, if there were any, would dig through this. They would find the layer of chicken bones, the layer of concrete, the layer of radioactive isotopes. They would see the rupture.

  They wouldn't care that a committee in 2024 voted against it. They wouldn't care that the International Union of Geological Sciences decided the signal was too short, or the date too recent, or the blame too diffuse.

  The rock would speak for itself.

  Elena pulled her coat tighter. The arbitrariness of it all pressed against her chest. The line was fake. The boundary was a human invention, a fiction drawn on a continuous reality. But the consequence was absolute.

  "Are you coming?" Simon asked from the curb, hailing a taxi.

  Elena took one last look at the sky. It was the sky of the Anthropocene, regardless of the vote. It was the sky of humans, burning bright and dirty against the dark.

  "Yeah," she said. "I'm coming."

  She stepped off the curb, her shoe landing on the asphalt. She imagined the pressure of her foot, the tiny compression of the ground. Another layer. Another mark. No permission needed. No vote required. Just the weight of being here, now, leaving a trace in the mud that would outlast the memory of the committee that tried to name it.
