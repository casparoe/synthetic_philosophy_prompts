prompt: |-
  Next month I have the lunchtime slot in our department's philosphy-of-psychiatry series, 45 minutes, a projector, and an audience of second-year psychiatry residents plus three or four clinical psych grad students with no philosophy background who get their backs up the second anyone says social construction. I want to teach Hacking's looping effect properly this time. Last year I opened with multiple personality and the whole thing turned into a fight about whether DID is real and whether anyone in the room should be diagnosing it, and I'd bet nobody left able to say what the looping effect actually is.

  So don't explain it to me, plan the explanation. What has to be in place before it, in what order, and why that order. My hunch is the residents need the two-way business first, that the classification shapes the classified person and the classified person's response then reshapes the classification, the instruments, the clinicians, the numbers, before they need a single piece of vocabulary, but tell me if that's backwards, and whether it's worth introducing Hacking's own name for his position at this level or whether that just gives them a label to be suspicious of.

  For the carring example I was going to use the sleep tracker thing: people who end up with insomnia because their wristband tells them they slept badly, who then spend longer in bed chasing a better sleep score and sleep worse, so the thing being measured shifts in response to being measured and the clinical picture stops matching the textbook description of insomnia. Is that the right carrier for this room, or does it smuggle in something that isn't really a looping effect, because I keep worrying it's just anxiety about a gadget and the loop closes through the device rather than through the category. If it's wrong, what should carry the whole thing instead, and say what that example has to have and what it has to lack.

  Then the misconceptions, in the order these people will actually form them, and exactly where in the sequence I head each one off. What I'm expecting: they hear it as me saying their diagnoses are fake; they collapse it into the placebo effect, or into patients just copying what they read online; they think it's old labelling theory in new packaging; and they assume the loop only runs one way, diagnosis to patient, with the patient's response having no say in how the category gets defined the next time round. I don't want to be fighting the same one twice.

  Also tell me what to leave out and to say out loud that I'm leaving it out, and give me one question to put to the room at the end that would actually tell me whether the idea landed rather than whether they've decided they like me. Don't send me a reading list, nobody's going to read it.

  Can you write it in continuous prose, no headings or bullets or bold or tables, just write it out the way you'd write an email. I have to paste the whole thing into a shared doc as one block of text.
