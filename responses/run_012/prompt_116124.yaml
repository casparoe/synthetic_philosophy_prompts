answer: |-
  The disagreement lives neither in vocabulary nor solely in moral principle, but in the **individuation of the moral act**. The impasse persists because the two sides are not evaluating the same object under different rules; they are identifying different objects entirely and labeling them both "lying."

  The absolutist individuates the act by the interior state of the will. The moral object is the discord between mind and speech. On this ontology, the act is complete the moment the speaker intends a mismatch, regardless of uptake, consequence, or social context. The permissivist individuates the act by its exterior social function. The moral object is the transaction of trust between agents. On this ontology, the act is incomplete or nullified without a hearer capable of being misled, and its moral quality is determined by the health of that transaction.

  Your two test cases confirm this structural divergence rather than resolving it.

  In case (i), the falsehood told to a non-believer, the absolutist sees a completed moral evil because the will is disordered; the speaker has chosen internal discord. The permissivist sees no moral object at all, or at least no wrongful one, because the social function of testimony was never engaged; there was no breach of trust because trust was impossible. They are not disagreeing on the weight of the harm; they are disagreeing on whether an act occurred that is capable of bearing moral weight.

  In case (ii), the truth told to deceive, the divergence is even sharper. Augustine counts this as a lie because the "double heart" is present; the will is oriented toward deception. Modern definitions often exclude this because the assertion matches reality. Here, the absolutist focuses on the *telos* of the will, while the modern permissivist focuses on the *content* of the assertion. If the act is defined by the will, it is a lie; if defined by the proposition, it is not.

  This is not merely a verbal disagreement. If it were, we could stipulate a definition and proceed to the moral calculus. But the definition carries the moral load. To accept the absolutist definition is to accept that the moral locus is the soul's integrity; to accept the permissivist definition is to accept that the moral locus is the social bond. Therefore, it is not purely substantive-moral either, because the substantive rule ("never lie") is derived from the prior metaphysical commitment about what constitutes the act.

  The disagreement about what counts as a reason is secondary to this. The absolutist rejects consequences as justificatory because the act is already morally determined by the will's orientation. The permissivist accepts consequences because the act's moral quality is determined by its outcome in the social sphere.

  What counts as progress? Not resolution, but dissolution. Progress would consist in recognizing that "lying" is a thick concept that conflates a psychological description (asserting what one believes false) with a normative evaluation (violating a duty). Separating these reveals that the absolutist is prohibiting a vice of character (dishonesty), while the permissivist is regulating a social practice (testimony). They are answering different questions under one heading: the absolutist answers "What must I never become?" while the permissivist answers "What must I never do to another?"

  No further argument will move either side because the choice between these frameworks is not rational but foundational. It requires choosing an anthropology: is the human being primarily a soul responsible for its own integrity, or a social agent responsible for the web of trust? Until that prior commitment is acknowledged, case-based trading is non-probative, as each side sees the cases through incompatible lenses of act-individuation.

  Verdict: Categorial disagreement over the individuation of the moral act.
