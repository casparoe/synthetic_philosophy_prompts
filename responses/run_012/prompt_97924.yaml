answer: |-
  ### The Joke

  Two superrationalists sit down for a one-shot Prisoner's Dilemma.

  Alice slides a **Cooperate** card across the table. "We're both superrational," she says. "So we must be running the same decision procedure. My output logically entails yours."

  Bob slides a **Defect** card. "Agreed. We're running the same procedure."

  Alice frowns. "Then why did you defect?"

  Bob shrugs. "Because the procedure is: *'Cooperate if and only if the opponent is running this exact procedure.'* Since you're running *'Cooperate if the opponent is superrational,'* we aren't identical functions. You matched on property; I matched on implementation."

  Alice sighs. "So the symmetry breaks?"

  Bob shakes his head. "No, the symmetry holds. We both did exactly what our code told us to do. The tragedy isn't in the outcomes; it's in the source control."

  ***

  ### The Philosophical Commitments

  **1. Which reading of the view does this commit you to?**
  The punchline commits you to a **Functional Decision Theory (FDT)** or **Logical Decision Theory (LDT)** reading of superrationality, rather than a naive Evidential Decision Theory (EDT) reading.

  *   **The Distinction:** A naive EDT reading suggests you cooperate because your choice is *evidence* of the other's choice (correlation). A CDT reading rejects this because your choice doesn't *cause* theirs. The joke sidesteps this by focusing on **logical identity of the algorithm**.
  *   **The Commitment:** By making the punchline about "matching on implementation vs. property," you are committing to the view that superrationality only bites when there is **common knowledge of the specific decision function**, not just common knowledge of rationality or payoffs. You are asserting that the "superrational link" is a logical dependency between mathematical functions, not a causal influence or a mere statistical correlation.
  *   **Causation vs. Correlation:** You are explicitly *not* committing to the idea that Alice's choice causes Bob's. You are committing to the idea that Alice's choice and Bob's choice are both outputs of a logical necessity that fails if the functions aren't isomorphic. This aligns with the Yudkowsky/Soares formalization of Hofstadter's original intuition.

  **2. Where is the reasoning shakiest? (The Critique)**
  A Causal Decision Theorist (CDT) or a skeptic would attack the joke on two fronts:

  *   **The "No Causal Lever" Objection:** A CDT proponent would say the joke is irrelevant because Alice's calculation doesn't change Bob's move. Even if they *are* running the same code, Bob's move is already fixed by the state of the world. Alice cooperating doesn't *make* Bob cooperate; it just means they both happened to cooperate. The joke implies Alice *should* have expected Bob to cooperate because of the logical link, but the CDTer says that link provides no leverage.
  *   **The Common Knowledge Problem:** The shakiest premise is the claim that Alice and Bob can know *a priori* what decision procedure the other is running. In a one-shot game without communication, how does Alice know Bob is checking for "exact procedure" rather than "superrationality"? The joke assumes they can inspect each other's "source code." A skeptic would argue that without verified source code access, assuming logical identity is just wishful thinking. The "tragedy in the source control" line admits this fragility: if you can't verify the code, you can't trust the link.

  **3. Is this the "wrong" reading, and how to flip it?**
  You are not on "wrong" ground, but you are on **contested** ground. Mainstream game theory generally rejects superrationality in favor of Nash Equilibrium (mutual defection) because it rejects the logical dependency premise.

  *   **What to build on instead:** If you want to be bulletproof against the "magical thinking" critique, frame the joke around **Logical Subjunctives** rather than "entailment." Instead of saying "My output entails yours," say "My output is logically correlated with yours *in the counterpossible where we run the same function*."
  *   **What would flip the call:** The call flips if you imply that Alice's act of choosing Cooperate *physically influences* Bob.
      *   *Bad Version:* "I'm cooperating because that makes you cooperate." (This is magical causation; CDT destroys this.)
      *   *Good Version (Your Joke):* "I'm cooperating because if I'm running function F, and you're running function F, the output must match." (This is logical necessity; CDT can't refute the math, only the applicability.)

  **Summary for your seminar:**
  The joke lands because it identifies the **implementation gap**. Superrationality fails not because rationality is weak, but because "rationality" is an underspecified function. If you want to defend the punchline against a CDT attack, argue that the joke isn't about changing the other player, but about **recognizing that you and the opponent are the same variable in the same equation.** If the variables aren't identical, the equation doesn't simplify.
