prompt: |-
  The setting is a 90-minute session of an upper-level undergraduate seminar on rational choice and its critics — 18 students, mostly philosophy and economics majors, several of whom have already read a textbook description of the dollar auction. I want to run an activity that gets past the standard demonstration, and I need you to design it.

  The standard version — auction off a dollar bill, highest bidder pays and takes it, second-highest pays and gets nothing — reliably produces escalation, and the standard debrief says: sunk-cost fallacy, escalation of commitment, don't throw good money after bad. My students can recite that before the auction starts. What the recitation obscures is the thing I want them to feel: that in this game the escalation is not obviously a fallacy. Once the bidding is at a dollar and change, the next bid is locally the better move, and stopping is what would need a defense. The trap is in the structure of the game, not in anyone's psychology. The sunk cost is not doing the work; the structure is.

  Design the activity with these requirements.

  First, the escalation has to happen before anyone names it. No framing, no vocabulary, no hint of what the game is about up front.

  Second, the design must let participants feel the difference between two sources of escalation: escalation driven by sunk cost, where money already gone is treated as a reason to continue even though by itself it should be irrelevant, and escalation driven by structure, where each further bid is the best response to the last one, so that someone reasoning correctly at every node still ends up overpaying. Arrange the rules and the debrief so the group can tell which one is operating, and make sure the run produces a moment in which they see that the option to stop existed only at the beginning, and that by the time they wanted it, it was gone.

  Third, include one variant run that isolates a single factor, and state what it isolates and what outcome would count as evidence for it. Choose among: (a) bidding against a mechanical outbidder rather than a person, which tests whether the escalation is about recovering money or about not letting the other player win; (b) a round in which the first bid is made on a participant's behalf by someone else, an inherited commitment, which tests whether escalation requires having chosen to enter; (c) a round with a ceiling written down in advance and a visible penalty for exceeding it, which tests whether pre-commitment is available at all once the auction is live. Say which you would pick for this room and why, and what to cut if you want a second variant.

  Fourth, no real money. Payoffs in chips or points against a small non-monetary prize, with a settlement rule credible enough that the loss is actually felt.

  Fifth, the debrief has to do real work rather than name the phenomenon. Map specific moments in the run onto specific parts of the analysis; distinguish the structural trap from the sunk-cost story and say which one the room's behavior actually supports; and confront whether any bid sequence in this game is rational at every node. My own belief is that the game has no equilibrium in pure strategies, so there is no single rational line of play to point to and the "fallacy" label is doing rhetorical work — if that is wrong, say so and explain the correct analysis, and do not let the debrief rest on it. Participants will almost certainly explain their own conduct in psychological terms ("I got carried away," "I couldn't let him have it"), so build in a way of testing that self-report against the structural explanation instead of accepting it.

  Sixth, end with a transfer step. Write a short realistic escalation case — a project, a lawsuit, a war, a failing product line, one you invent so that nothing has to be looked up — and give a small ordered set of questions that let students determine whether the escalation there is structural, sunk-cost, or commitment-driven. That discrimination is the practically important skill, and it is where the activity should leave them.

  Also give me the materials and setup, the roles, a minute-by-minute timeline for the 90 minutes, the exact payoff table, and the facilitator's script for the moments when the room has to be kept from dissolving into "this is rigged." Tell me what will predictably go wrong the first time I run it — including a table that refuses to escalate because someone has read about the auction, and a group that never feels the loss so the whole thing becomes a joke — with what to do in each case.

  Finally, be honest about what the activity cannot reproduce. My guess is that real escalation unfolds over months, that the decision-maker is a coalition rather than a person, that the prior commitments are public and identity-bearing, and that the prize is partly constituted by the escalation itself rather than fixed in advance. Tell me which of those the activity can gesture at, which it cannot, and what I therefore have to supply myself in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Context:** 90-minute upper-level undergrad seminar (Philosophy/Economics). 18 students. Some know the Dollar Auction.
      *   **Goal:** Move beyond the standard "sunk cost fallacy" explanation to the structural inevitability of escalation (local rationality leading to global irrationality).
      *   **Key Constraints:**
          1.  No framing/vocabulary upfront (escalation must happen before naming).
          2.  Distinguish *sunk cost* psychology vs. *structural* trap (local best response). Show the "exit door closed" moment.
          3.  Include *one* variant run (choose from: mechanical outbidder, inherited commitment, or pre-commitment ceiling). Justify choice and trade-offs.
          4.  No real money (chips/points with credible settlement/non-monetary prize).
          5.  Debrief must map specific moments to analysis, test self-reports against structure, and address the equilibrium issue (pure strategy Nash equilibrium?).
          6.  Transfer step: A realistic case study with diagnostic questions.
          7.  Materials, setup, roles, minute-by-minute timeline, facilitator script (especially for "this is rigged" pushback).
          8.  Troubleshooting: What goes wrong (e.g., students refuse to play, or treat it as a joke).
          9.  Limitations: What the simulation *cannot* capture (time, coalitions, identity, constitutive prizes).

  2.  **Deconstruct the Core Problem (The Dollar Auction Paradox):**

      *   *Standard View:* People bid >$1 because they hate losing the sunk cost (psychological error).
      *   *Target View:* Once bids are at $0.90 and $1.00, the loser pays $0.90 and gets nothing. Bidding $1.05 means paying $1.05 to get $1.00 (loss of $0.05) vs. paying $0.90 to get nothing (loss of $0.90). Losing $0.05 is better than losing $0.90. Therefore, bidding is locally rational. The trap is set at bid #1.
      *   *Equilibrium:* In an infinite game with perfect rationality and common knowledge, the game shouldn't start. But once it starts, backward induction fails because the end is undefined. There is no pure strategy Nash Equilibrium in the continuous version, or rather, the only equilibrium is "don't play." But *conditional* on playing, escalation is rational.
      *   *Challenge:* How to make students *feel* the structural lock-in without just telling them "it's structural."

  3.  **Designing the Activity:**

      *   **Name:** "The Point Auction" (avoid "Dollar Auction" to prevent triggering prior knowledge immediately).
      *   **Currency:** "Seminar Points" (SP).
      *   **Payoff:** 100 SP prize.
      *   **Rule Twist:** To emphasize structure over psychology, we need to make the "loss" palpable but not financial. Let's use a "Grade Buffer" or "Privilege Token" system. Actually, the prompt says "no real money... credible enough that the loss is actually felt." Let's use a pool of points that determines a tangible reward (e.g., choosing the final paper topic, or a small gift card raffle where points = tickets). Let's go with *Raffle Tickets*. It's low stakes but loss aversion applies.
      *   **The Variant:** I need to choose one.
          *   (a) Mechanical outbidder: Tests rivalry vs. loss recovery.
          *   (b) Inherited commitment: Tests entry choice.
          *   (c) Pre-commitment ceiling: Tests binding rules.
          *   *Selection:* **(b) Inherited Commitment.** Why? Because the core philosophical question is about *agency* and *rationality*. If I inherit a bid, did *I* make the mistake? If escalation still happens, it proves the structure dominates the individual's psychology of entry. It isolates the "local rationality" from the "entry error."
      *   **The "Exit Door" Moment:** We need a specific pause point where the facilitator asks, "Can anyone stop?" to highlight that the *rules* prevent a clean exit, not the *mind*.

  4.  **Drafting the Timeline (90 Minutes):**

      *   0-10: Setup & Rules (No mention of escalation).
      *   10-25: Run 1 (Standard).
      *   25-35: Initial Debrief (Surface level).
      *   35-50: Run 2 (Variant: Inherited Commitment).
      *   50-70: Deep Debrief (Structure vs. Psychology).
      *   70-80: Transfer Case.
      *   80-90: Conclusion & Limitations.

  5.  **Refining the Rules for Structural Clarity:**

      *   Standard Dollar Auction: Highest gets $1, 2nd highest pays bid.
      *   To make the "local rationality" clearer, we need to ensure the gap between bids is small enough that the "loss minimization" logic holds tight.
      *   *Payoff Table:* Prize = 100 points. Min bid increment = 5 points.
      *   *Settlement:* Everyone starts with 100 points. Losses are deducted. Final points determine raffle tickets.
      *   *Crucial Rule:* "The auction ends when no new bid is made within 10 seconds."

  6.  **Addressing the Equilibrium/Philosophy:**

      *   Is there a rational line? Game theory says the only Subgame Perfect Equilibrium (SPE) is *not to bid*. But once a bid is made, the second player *should* bid (if the bid < prize + penalty).
      *   The prompt asks me to confront whether any bid sequence is rational at every node.
      *   *Answer:* Bidding 0 is rational. Bidding 5 is rational *if* you expect the other to stop. Bidding 105 is rational *given* you are already at 100. The irrationality is in the *belief* that the other will stop. It's a game of imperfect information/credibility.
      *   *Debrief Point:* Distinguish ex-ante rationality (don't play) vs. ex-post rationality (minimize loss).

  7.  **Troubleshooting:**

      *   *Scenario A: The Skeptic.* Someone says "I know this, I won't play."
          *   *Fix:* Make participation mandatory for the "experiment" but allow them to bid 0. Or, use the Variant to force them into a position.
      *   *Scenario B: The Jokers.* They treat points as fake.
          *   *Fix:* The settlement must be immediate and visible. Deduct points from a visible ledger.
      *   *Scenario C: No Escalation.* They stop at $0.90.
          *   *Fix:* Facilitator needs to nudge the "loser" by highlighting the loss. "So, Sarah pays 90 and gets nothing. John pays 100 and gets 100."

  8.  **Developing the Transfer Case:**

      *   Need a scenario that isn't obviously a "war" or "project."
      *   *Idea:* A software patch. You found a bug. Fixing it takes 1 hour. You find another bug. Then a compatibility issue.
      *   *Questions:* 1. Is the cost of stopping higher than continuing? (Structure). 2. Did you spend resources just to justify past spend? (Sunk Cost). 3. Are you doing it to beat a rival? (Rivalry).

  9.  **Addressing Limitations:**

      *   Time: Sim is minutes, real life is months.
      *   Identity: Sim is anonymous points, real life is reputation.
      *   Coalition: Sim is individuals, real life is orgs.
      *   *Instructor's Job:* Verbally bridge these gaps in the final 10 mins.

  10. **Review against Constraints:**

      *   No framing upfront? Yes.
      *   Distinguish sources? Yes, via Variant and Debrief.
      *   One Variant? Yes (Inherited Commitment).
      *   No real money? Yes (Raffle tickets).
      *   Debrief work? Yes (Mapping nodes).
      *   Transfer step? Yes.
      *   Materials/Script? Yes.
      *   Troubleshooting? Yes.
      *   Limitations? Yes.

  11. **Refining the "Structural Trap" Mechanism:**

      *   To really drive home that *stopping* is the hard move, I need to make the penalty for the second-highest bidder explicit and painful *during* the auction.
      *   I will add a "Loss Board" visible to all.
      *   I need to make sure the "Inherited Commitment" variant is handled carefully. If I assign a bid, does the student feel it's unfair? Yes, that's the point. It isolates the "entry" decision from the "escalation" decision.

  12. **Final Polish of the Script:**

      *   Tone: Clinical, neutral. Do not smile when they lose.
      *   Safety: Ensure no one actually loses money or significant grade points.
      *   Philosophy: Ensure the distinction between *procedural rationality* (best move given state) and *substantive rationality* (best outcome overall) is clear.

  13. **Self-Correction on Equilibrium:**
      *   Wait, the prompt asks: "My own belief is that the game has no equilibrium in pure strategies... if that is wrong, say so."
      *   *Correction:* In the standard Dollar Auction with infinite bids, there is no pure strategy Nash Equilibrium *once the game has started* that involves stopping, because one player always has an incentive to outbid to reduce loss. However, the *global* equilibrium is (0,0) - nobody bids. But conditional on bidding > 0, the escalation path is the only Nash path in the subgame *if* players value loss minimization over absolute profit. Actually, standard game theory says there is *no* Nash Equilibrium in the continuous dollar auction because for any bid $b < 1$, the other can bid $b + \epsilon$. If bids are discrete (e.g., nickels), there *are* equilibria where one player bids high enough that the other loses more by outbidding than by losing.
      *   *Decision:* I will clarify this in the debrief. With discrete increments (5 points), there *is* a point where stopping is rational (when Bid + Increment > Prize + Penalty). The trap is that they rarely reach that calculation in time. I need to make sure the math supports the "local rationality" claim.
      *   *Math Check:* Prize = 100. Penalty = Pay your bid.
      *   Bid A = 95. Bid B = 100.
      *   A is losing 95. If A bids 105, A pays 105, gets 100. Net -5.
      *   -5 is better than -95. So A bids 105.
      *   When does it stop? When Bid_Current + Increment > Prize + Loss_Current.
      *   Actually, it theoretically never stops if increments are small enough relative to the gap between current bid and prize. But eventually, the loss exceeds the prize value significantly.
      *   *Wait, the prompt says:* "The trap is in the structure... escalation is not obviously a fallacy."
      *   *Okay, I will stick to the logic:* At any node $n$, bidding $n+1$ minimizes loss compared to stopping at $n-1$. The "equilibrium" is that the game should not start. But once started, the "rational" path is escalation until bankruptcy. I will clarify this nuance in the debrief script.

  14. **Final check on Variant:**
      *   I chose (b) Inherited Commitment.
      *   Why? It directly attacks the "I chose to enter" defense. If you inherit a bid of 80, and you bid 85, you didn't fall for sunk cost of *your* money. You fell for the structural loss minimization.
      *   What to cut if time is tight? Cut the Transfer Case discussion short and make it homework.

  15. **Writing the Output:** (Proceeding to generate the response based on these thoughts).
answer: |-
  # Activity Design: The Structural Trap

  ## 1. Overview & Learning Objectives
  **Title:** The Point Auction (Structural Escalation Seminar)
  **Time:** 90 Minutes
  **Participants:** 18 Students (Philosophy/Economics)
  **Core Objective:** To demonstrate that escalation of commitment can be the result of locally rational decision-making within a specific payoff structure, distinct from the psychological "sunk cost fallacy."
  **Secondary Objective:** To distinguish between *ex-ante* irrationality (entering the game) and *ex-post* rationality (minimizing loss once in the game).

  ## 2. Materials & Setup

  **Physical Setup:**
  *   **Room:** Seminar table or U-shape. All participants must see each other.
  *   **The Ledger:** A whiteboard divided into two columns: "Current High Bidder" and "Current Runner-Up."
  *   **Currency:** "Seminar Points" (SP). Each student receives a physical card stating **Endowment: 100 SP**.
  *   **The Prize:** A tangible, immediate reward worth roughly $20–$30 total (e.g., a box of high-quality chocolates, a gift card, or "Homework Pass" tokens). *Crucial:* The prize is awarded based on final SP count. Top 3 SP holders split the prize. This makes SP loss feel real without risking actual tuition money.
  *   **The Rules Sheet:** One per student (see below).

  **The Rules Sheet (Handout):**
  > **THE POINT AUCTION**
  > 1. **Prize:** 100 SP is awarded to the highest bidder at the close of the auction.
  > 2. **Cost:** The highest bidder pays their bid. The **second-highest bidder also pays their bid** but receives nothing.
  > 3. **Increments:** Bids must increase by exactly 5 SP.
  > 4. **Timing:** A bid stands if no new bid is made within 10 seconds.
  > 5. **Settlement:** At the end of class, SP are tallied. Losses are deducted from your 100 SP endowment. Top 3 totals share the prize.
  > 6. **Constraint:** You cannot bid more than your current SP total. (If you hit 0, you are forced out).

  **Facilitator Props:**
  *   Timer (visible).
  *   Gavel (or distinct sound maker).
  *   Red marker (for the Ledger).

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Distribute Endowment Cards & Rules. **Strict Silence on Theory.** Explain rules mechanically. Do not use words like "trap," "sunk cost," or "escalation." |
  | **10–25** | **Run 1** | **Standard Auction.** Facilitator runs the bidding. Allow it to escalate past 100 SP. Stop only when one player bankrupts the other or refuses to bid (rare). |
  | **25–35** | **Surface Debrief** | Collect SP losses. Ask: "Why did you bid?" Record answers on board (e.g., "I wanted to win," "I didn't want to lose my 90"). Do not analyze yet. |
  | **35–50** | **Run 2** | **Variant: Inherited Commitment.** (See Section 5). Select two new volunteers. Assign them starting bids. Run auction. |
  | **50–70** | **Deep Debrief** | Structural Analysis. Map bids to payoff nodes. Distinguish Sunk Cost vs. Loss Minimization. Address Equilibrium. |
  | **70–80** | **Transfer** | Case Study: "The Software Patch." Diagnostic questions. |
  | **80–90** | **Limitations** | Discuss what the sim *cannot* do (time, identity, coalitions). Final settlement of prizes. |

  ---

  ## 4. The Facilitator Script (Key Moments)

  ### The Opening (Minutes 0–5)
  *   **Tone:** Bureaucratic, neutral.
  *   **Script:** "We are running a resource allocation exercise. You have 100 Seminar Points. These points determine your share of the prize at the end of class. The rules are on the sheet. Read them. You have 3 minutes. Questions on mechanics only."
  *   **If asked:** "Is this the Dollar Auction?" -> **Answer:** "It is a point auction. Read the rules."
  *   **If asked:** "What's the rational strategy?" -> **Answer:** "That is for you to determine."

  ### The Escalation Point (Minutes 15–20)
  *   *Context:* Bidding has reached 95 SP (Bidder A) and 100 SP (Bidder B).
  *   **Action:** Pause the timer. Look at Bidder A (who is currently the runner-up).
  *   **Script:** "Current state: Bidder B bids 100. Bidder A bids 95. If the auction ends now: Bidder B pays 100, gets 100 (Net 0). Bidder A pays 95, gets 0 (Net -95). Bidder A, you have 10 seconds to bid 105 or stop."
  *   **Note:** Do not smile. Do not warn them. Let the math speak.

  ### The "This is Rigged" Pushback (Minutes 20–25)
  *   *Context:* Students realize they are losing points for nothing.
  *   **Student:** "This is stupid. We're both losing."
  *   **Facilitator:** "The rules allow you to stop bidding at any time. No one is forcing you to bid 105."
  *   **Student:** "But if I stop, I lose 95 points!"
  *   **Facilitator:** "Correct. That is the rule. You may choose to accept that loss, or bid 105 to reduce it. The choice is yours."
  *   **Goal:** Force them to acknowledge the *choice* exists, but the *incentive* is perverse.

  ### The Deep Debrief (Minutes 50–60)
  *   **Script:** "Look at the board. At bid 95, Bidder A had already 'lost' 95 points. That money was gone. The rule says the second-highest pays. When A bid 105, was A trying to recover the 95? Or was A trying to avoid the certain loss of 95?"
  *   **Distinction:** "If you bid to 'get your money's worth,' that is **Sunk Cost Psychology**. If you bid because losing 5 is better than losing 95, that is **Structural Rationality**. Which one happened here?"

  ---

  ## 5. The Variant Run (Minutes 35–50)

  **Selected Variant:** **(b) Inherited Commitment.**
  **Rationale:** This isolates the *structure* from the *entry decision*. In Run 1, critics argue the error was entering the auction. In Run 2, students inherit a position they did not choose. If escalation still occurs, it proves the trap is in the *rules of the subgame*, not the psychology of the initial entry.

  **Setup:**
  1.  Select two new volunteers (preferably those who did not bid in Run 1).
  2.  **The Twist:** Before they speak, assign them positions on the Ledger.
      *   Student X: "You are the High Bidder. Your bid is **80 SP**."
      *   Student Y: "You are the Runner-Up. Your bid is **75 SP**."
  3.  **Rule:** They inherit the debt. If the auction ends now, X pays 80, Y pays 75.
  4.  **Instruction:** "You may now continue bidding or stop. You inherit the liability immediately."

  **Expected Outcome:**
  Student Y (Runner-Up) will almost immediately bid 85.
  *   **Why?** Stopping means paying 75 for nothing. Bidding 85 means paying 85 for a chance at 100 (Net +15) or becoming the runner-up at 85 (Net -85).
  *   **Wait, check the math:**
      *   If Y stops: Pay 75. Net -75.
      *   If Y bids 85:
          *   If X stops: Y pays 85, gets 100. Net +15.
          *   If X bids 90: Y pays 85, gets 0. Net -85.
      *   *Correction:* The incentive to bid is only strong if Y believes X will stop. However, once X bids 90, Y is at -85. X is at -90 (if they stop).
      *   *Key Insight:* The inheritance variant shows that even without the "I chose to play" ego investment, the structural penalty on the loser forces the game forward.

  **What to Cut if Time Runs Short:**
  If the variant run drags on, cut the Transfer Case discussion short. Assign the Case Study as a 1-page reflection for the next class. Do not cut the Deep Debrief.

  ---

  ## 6. The Deep Debrief: Analysis & Equilibrium (Minutes 50–70)

  **1. Mapping the Nodes:**
  Draw a decision tree on the board for the moment bids were at 90/95.
  *   **Node A (Runner-Up, 90):**
      *   Option Stop: Pay 90. Get 0. **Utility: -90.**
      *   Option Bid 95: Pay 95. Potential Gain 100.
          *   If Opponent Stops: Net +5.
          *   If Opponent Continues: Net -95 (eventually).
  *   **Facilitator Point:** "At this specific node, bidding is the *dominant strategy* if you assign any probability to the opponent folding. Stopping guarantees a loss. Bidding offers a chance at profit or a marginal increase in loss."

  **2. Sunk Cost vs. Structure:**
  *   **Question:** "Student A, you said you 'didn't want to waste the 90 points.' Is that sunk cost?"
  *   **Analysis:** "If you bid 95 *only* because you spent 90, that is sunk cost fallacy (irrelevant past cost). But if you bid 95 because the rule says you *must pay the 90 anyway*, then the 90 is not sunk—it is a **fixed liability**. The rule makes the past cost a *current* variable. The structure turns sunk cost into marginal cost."
  *   **Verdict:** The room's behavior likely supports the **Structural** explanation. The "fallacy" label is rhetorical cover for a game with no clean exit.

  **3. The Equilibrium Question:**
  *   **Student Challenge:** "So what was the rational move?"
  *   **Facilitator Response:** "Game theoretically, the only Subgame Perfect Equilibrium is **do not bid**. Bid 0. But that relies on Common Knowledge of Rationality. Once Bid 1 is made, that equilibrium breaks. There is no pure strategy equilibrium *once the game is live* that involves stopping, because one player can always reduce loss by bidding higher."
  *   **Conclusion:** "The rationality is local. The irrationality is global. You played perfectly at every node, and collectively you produced a disaster. That is the definition of a structural trap."

  ---

  ## 7. Transfer Step: The Software Patch (Minutes 70–80)

  **Case Handout:**
  > **Case: The Legacy Patch**
  > You are a lead developer. A critical bug is found in shipped software.
  > *   **Day 1:** Fix estimated at 10 hours. You start.
  > *   **Day 2:** 10 hours spent. Bug is deeper. Fix now estimated at 20 *more* hours.
  > *   **Day 3:** 30 hours total spent. Fix requires rewriting a core module. Estimate: 50 *more* hours.
  > *   **Stakeholders:** If you ship with the bug, the company loses $50k in contracts. If you fix it, the cost is $10k per 10 hours of dev time.
  > *   **Rival:** A competitor is launching a similar product next week. If you delay launch to fix, they might beat you to market.

  **Diagnostic Questions (Small Group Discussion):**
  1.  **The Structural Test:** At Day 3, is the cost of *stopping* (losing $50k contracts) higher than the cost of *continuing* (50 hours * $1k)? Calculate the marginal choice.
  2.  **The Sunk Cost Test:** Are you continuing because you "already spent 30 hours" (irrelevant), or because the 30 hours spent have created a dependency that makes stopping expensive (relevant)?
  3.  **The Commitment Test:** If a new manager took over on Day 3, knowing only the future costs and contract risks (ignoring the past 30 hours), would they order the fix?
      *   *If Yes:* Escalation is Structurally Rational.
      *   *If No:* Escalation is Sunk Cost/Psychological.

  ---

  ## 8. Troubleshooting: What Will Go Wrong

  | Problem | Prediction | Intervention |
  | :--- | :--- | :--- |
  | **The Skeptic** | A student says, "I know this game. I won't bid." | **Pre-empt:** In Run 2 (Variant), assign them a bid. They cannot opt out of the inherited liability. <br> **Post-empt:** Ask them, "If you are assigned 90 SP debt, do you bid 95?" Force them into the structural logic. |
  | **The Jokers** | Students treat points as fake; bid 1000 SP. | **Credibility:** Enforce the "Bankruptcy" rule strictly. If they bid over 100, they are out and receive 0 SP. Deduct points visibly from their Endowment Card immediately after every bid. Make the loss administrative and real. |
  | **The Early Stop** | Bidding stops at 90/95. No "over $1" escalation. | **Nudge:** Turn to the loser. "You are about to pay 90 for nothing. The other person has 100 for 100. You have 10 seconds to change that outcome." Highlight the *inequity* of the payoff, not just the loss. |
  | **The "Rigged" Complaint** | "You're just trying to take our points." | **Reframe:** "I am not taking points. The *rules* take points. I am merely the auctioneer. Your anger is at the mechanism, not me. Good. That is the lesson." |

  ---

  ## 9. Limitations: What This Activity Cannot Reproduce

  **Instructor Note for Final 10 Minutes:**
  Be honest. This simulation is a "hyper-object" of rational choice—it strips away the messiness of real life to isolate the mechanism. You must verbally supply the missing context.

  1.  **Time Compression:**
      *   *Sim:* Escalation happens in 10 minutes.
      *   *Reality:* Escalation happens over months (Vietnam, Concorde, IT projects).
      *   *Gap:* In real life, fatigue and changing personnel dilute the "local rationality."
      *   *Supply:* Ask students: "Does the logic hold if the decision is made by a committee every week for a year?"

  2.  **Identity & Reputation:**
      *   *Sim:* Anonymous points.
      *   *Reality:* Public commitments. Quitting looks like weakness.
      *   *Gap:* The "loss" in real life is often reputational, not just financial.
      *   *Supply:* "In the room, you lost points. In the world, you lose face. That makes the structural trap harder to escape."

  3.  **Constitutive Prizes:**
      *   *Sim:* The prize (100 SP) is fixed.
      *   *Reality:* Sometimes the prize *is* the escalation (e.g., "We must win this war to justify the lives lost").
      *   *Gap:* The value of the prize inflates *because* of the cost paid.
      *   *Supply:* "Here, the dollar was always a dollar. In reality, the dollar becomes worth $1000 because we spent $999 chasing it. That is a deeper trap we didn't simulate."

  4.  **Coalitions:**
      *   *Sim:* Individual agents.
      *   *Reality:* Organizations.
      *   *Gap:* Diffusion of responsibility.
      *   *Supply:* "If a committee bids, no single person feels the loss. That accelerates the trap."

  ## 10. Payoff Table (For Facilitator Reference)

  | State | High Bidder (H) | Runner-Up (R) | H Net | R Net | Social Total |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Start** | 0 | 0 | 0 | 0 | 0 |
  | **Bid 5** | 5 | 0 | +95 | 0 | +95 |
  | **Bid 95** | 95 | 90 | +5 | -90 | -85 |
  | **Bid 100** | 100 | 95 | 0 | -95 | -95 |
  | **Bid 105** | 105 | 100 | -5 | -100 | -105 |
  | **Bid 150** | 150 | 145 | -50 | -145 | -195 |

  *Note:* The Social Total turns negative once the sum of bids exceeds the Prize (100). This usually happens at Bid 55/50. Use this to show that *collective* rationality diverges from *individual* rationality immediately after the midpoint.

  ---

  ## 11. Final Facilitator Check

  **Before you start:**
  *   Ensure the prize is visible on the table.
  *   Ensure the Ledger is blank.
  *   Ensure you have the "Inherited Commitment" slips ready for Run 2.
  *   **Mindset:** You are not their teacher during the auction. You are the Mechanism. Be cold. The warmth comes in the debrief.

  **If the group is too sophisticated:**
  If they refuse to bid in Run 1 because they are Econ majors:
  *   **Pivot:** "Okay, the equilibrium is 0. Let's test the *Inherited Commitment* immediately. I am assigning Bidder A 50 points. Bidder B, you are at 0. Go."
  *   This forces the structural problem without needing the "foolish entry" phase.

  **If the group is too emotional:**
  If a student is genuinely upset about losing points:
  *   **Stop.** "This reaction is data. You feel violated because the structure punished you for acting rationally. Keep that feeling. That is the feeling of the structural trap." Then restore their points privately after class if necessary, but acknowledge the loss publicly.
