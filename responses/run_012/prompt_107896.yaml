answer: |-
  Based on the data provided, your verdicts do not align perfectly with the standard Lewisian analysis of convention. Specifically, you exclude practices that Lewis would include (waving, south-facing doors) and include practices that rely on legal backing (metres) while excluding others that do (portraits). To accommodate your intuitions, we must construct a **Restricted Coordination Principle**.

  ### The Principle: Robust Coordination Convention

  A practice $R$ in a population $P$ is a convention if and only if:

  1.  **Regularity:** Almost everyone in $P$ conforms to $R$.
  2.  **Arbitrariness:** There is an alternative regularity $R'$ that could have served the same function.
  3.  **Conditional Conformity:** Each agent prefers to conform to $R$ *on the condition* that others conform, rather than conforming unconditionally.
  4.  **Coordination Welfare:** The population is collectively better off coordinating on $R$ than failing to coordinate (i.e., if the practice lapsed, conformers would be worse off).
  5.  **Horizontal Sustainability:** The mutual expectations among the population are sufficient to sustain $R$ even if external legal penalties were removed.
  6.  **Epistemic Stability:** The beliefs sustaining $R$ are true and known (common knowledge), not based on systematic error or false beliefs about authority.

  ---

  ### Clause Analysis and Case Mapping

  Here is the specific work performed by each clause, identified by the case that forces its inclusion:

  **1. The Conditional Conformity Clause (Clause 3)**
  *   **Work Done:** Distinguishes conventions from habits, moral duties, or blind obedience to law. It ensures the reason for action is *interdependent*.
  *   **Forcing Case:** **Stopping at a red light (empty road).** You do this even when no one is watching and your safety does not depend on others stopping. Your conformity is unconditional. This case forces the requirement that I must do it *because* you do it. This excludes the red light (in isolation) and the fixed route home (habit).

  **2. The Coordination Welfare Clause (Clause 4)**
  *   **Work Done:** Distinguishes conventions from empty rituals or arbitrary customs that lack a functional coordination problem. This is the primary deviation from Lewis, who allows equilibria that are merely arbitrary.
  *   **Forcing Case:** **Waving at cars / South-facing doors.** You admit these satisfy arbitrariness and mutual expectation, but you reject them because "nobody would be worse off if the practice lapsed." This forces the principle to require a *benefit to coordination*. Driving on the right solves a crash problem; waving solves no problem.

  **3. The Horizontal Sustainability Clause (Clause 5)**
  *   **Work Done:** Distinguishes social conventions from state edicts or coercive impositions. It requires that the "glue" holding the practice together comes from the participants' mutual expectations, not a third-party enforcer.
  *   **Forcing Case:** **The Leader's Portrait vs. Metres.** Both are law. But Metres are also sustained by trade needs (if the law vanished, we'd still use metres to measure things). The Portrait is sustained only by the fine (if the law vanished, the practice stops). This clause excludes the Portrait while keeping Metres. It also distinguishes the **Anthem** (sustained by "hard looks" from peers) from the Portrait (sustained by fines from the state).

  **4. The Epistemic Stability Clause (Clause 6)**
  *   **Work Done:** Distinguishes conventions from pluralistic ignorance or mass delusions. A convention must be a stable equilibrium of *knowledge*, not error.
  *   **Forcing Case:** **The Office Late Case.** Everyone stays late based on a false belief (that the director cares). You note it would "evaporate if beliefs were corrected." This forces the requirement that the expectations underpinning the convention must be factually robust.

  **5. The Arbitrariness Clause (Clause 2)**
  *   **Work Done:** Distinguishes conventions from natural necessities or optimal solutions.
  *   **Forcing Case:** **QWERTY / Driving Side.** These are included because we could have used Dvorak or driven on the left. This clause is standard, but it ensures that "best practices" (like using the safest route home, if it were objectively safest) are not conventions.

  ---

  ### Test Cases

  Here are three new cases designed to separate this **Restricted Coordination Principle** from a standard **Lewisian Analysis**.

  **Case 1: Saying "Bless You" after a sneeze.**
  *   *Description:* In your office, everyone says "Bless You" when a colleague sneezes. It is arbitrary (could say "Health"), mutual (everyone expects it), and conditional (you feel awkward saying it if no one else does). However, if the practice lapsed, no one would be materially or socially harmed; it is purely phatic.
  *   *Lewisian Verdict:* Convention (arbitrary equilibrium sustained by expectation).
  *   *Your Principle Verdict:* **Not a Convention.**
  *   *Reasoning:* Fails **Clause 4 (Coordination Welfare)**. Like the waving case, nobody is worse off if the practice lapses. It is a custom, but not a convention in your sense.

  **Case 2: The Black Market Exchange Rate.**
  *   *Description:* In a country with strict currency controls, everyone uses an unofficial exchange rate for private transactions. It is arbitrary (could be a different number), conditional (I use it because you do), and welfare-positive (allows trade). It is illegal, punishable by fine, but everyone does it anyway because the state cannot enforce the official rate.
  *   *Lewisian Verdict:* Convention.
  *   *Your Principle Verdict:* **Convention.**
  *   *Reasoning:* Passes **Clause 5 (Horizontal Sustainability)**. Even if the legal penalty were removed (or if the state collapsed), the practice would continue because the mutual expectation among traders sustains it. This distinguishes it from the Portrait case, where the practice exists *only* for the state.

  **Case 3: The False Evacuation.**
  *   *Description:* A fire alarm sounds. Everyone evacuates. Later, it is revealed it was a glitch. However, during the event, everyone believed it was real and believed everyone else believed it was real. They coordinated perfectly.
  *   *Lewisian Verdict:* Debatable (often treated as coordinated action, but not a *standing* convention).
  *   *Your Principle Verdict:* **Not a Convention.**
  *   *Reasoning:* Fails **Clause 6 (Epistemic Stability)**. While this is a one-off event, consider a standing practice: "Everyone wears helmets because they believe a law requires it, but no such law exists." If the practice relies on a false belief about the source of the norm (like the Office Late case), it is not a convention. It is a shared mistake.

  ---

  ### Accommodation and Classification

  **Which verdicts cannot be accommodated?**
  The principle accommodates almost all your verdicts, but it puts significant pressure on your **Anthem vs. Portrait** distinction.
  *   *The Tension:* You admit the only objective difference you can point to is the severity of the penalty (hard looks vs. fine). However, Clause 5 (Horizontal Sustainability) relies on a qualitative distinction: *Who* is applying the pressure?
  *   *The Fix:* For the principle to hold, you must accept that "hard looks" constitute a horizontal sanction (peer-to-peer), while a "fine" constitutes a vertical sanction (authority-to-subject). If you concede that the *source* of the sanction matters more than the *severity*, the principle holds. If you insist severity is the only metric, the principle cannot accommodate the verdict, and you must classify the Anthem as an edict or the Portrait as a convention.
  *   *Recommendation:* You should give up the idea that penalty severity is the only difference. The *source* of the expectation (peers vs. state) is the theoretical workhorse here. The Anthem is a convention because the group polices itself; the Portrait is an edict because the state polices the group.

  **Lewis-Style Analysis or Repair?**
  This is a **Repair of the Lewis-Style Analysis**.
  *   **Lewis:** Defines convention as a solution to a coordination *problem* (where non-coordination is suboptimal). However, Lewis's definition is often interpreted broadly enough to include "waving" (signaling acknowledgment) or "portraits" (coordination on loyalty signals to avoid punishment).
  *   **The Repair:**
      1.  **Stricter Welfare:** Your rejection of "Waving/Doors" tightens Lewis's "Coordination Problem" to require a tangible welfare loss upon lapsing, excluding purely symbolic or costless equilibria.
      2.  **Autonomy Condition:** Your rejection of the "Portrait" adds a condition about the *source* of stability (horizontal vs. vertical) that Lewis does not explicitly foreground.
      3.  **Truth Condition:** Your hesitation on the "Office" case enforces a strict Common *Knowledge* requirement, ruling out equilibria based on pluralistic ignorance.

  **Conclusion:**
  Your usage describes a **Normative Coordination Convention**. It is not enough that we *do* coordinate (Lewis); we must coordinate to *solve a problem* (Welfare), we must do it *for each other* (Horizontal), and we must *know why* we do it (Epistemic). This is a more robust, socially grounded definition than the game-theoretic baseline.
