      *   *Self-Correction on Partition Sensitivity:* I need to be careful here. Is Nia talking about *Rothstein* (2001) or *Khoo*? Or is she talking about *conditional probability* itself being partition sensitive? Lewis's proof assumes $P$ is fixed. If $P$ shifts based on the antecedent (conditionalization), that's standard. If $P$ shifts based on a QUD, that blocks the assumption that $P(A \to C)$ is a stable value across the probability space manipulations Lewis uses. I should characterize this as a "Contextualist/Relativist" move.

  7.  **Final Polish:** Check tone. Ensure I answer the prompt's four specific questions explicitly. (The prompt asks for adjudication move-by-move *and* answers to the 4 questions *and* ratings *and* what they are missing). I will integrate the ratings into the move-by-move and summarize the 4 questions in a dedicated section.

      *Wait, one check on Dev's "Restriction is expressible" argument.* This refers to the result that if the language allows boolean combinations of conditionals, triviality returns. If Nia says "Equation only holds for simple conditionals," Dev says "But we can say 'It's not the case that if A then C'." If the negation of a conditional is a proposition, and the Equation holds for the positive, does triviality return? Yes, usually, unless you deny truth conditions to the negation (which undermines propositionalism). I need to make sure this nuance is clear.

      *Check on Nia's Partition argument.* If the probability is relative to a partition, then $P(A \to C)$ isn't a single value $x$ such that for all $P$, $P(A \to C) = x$. Lewis's proof iterates over different probability functions in the space. If the value of the conditional shifts with the function (or the context determining the function), the algebra doesn't sum up to triviality. This is a valid technical block.

