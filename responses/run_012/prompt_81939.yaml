prompt: |-
  My old flatmate did a masters in history of science and he keeps going on about Otto Neurath, and I've a feeling his version is a bit off but I can't quite put my finger on where. His summary goes roughly like this:

  'Neurath thought ordinary language was hopelessly contaminated by metaphysics and emotional associations, so the whole of unified science should eventually be rewritten in a language of pictures. And because a picture resembles the thing it shows, a picture language is basically self-interpreting — a schoolchild in Vienna and a reader in Shanghai take it the same way, no training needed — which is exactly what made it the ideal foundation for the unity of science: you get a bedrock of protocol statements that can be compared directly with experience and that no later evidence can shake. It's Leibniz's characteristica universalis, only done with drawings instead of algebra. And it's the same project as those ISOTYPE charts he made with Gerd Arntz for the Vienna museum — same aim, same thing. So if he'd got his way, science would have been done in infographics, misleading charts would have been impossible because the method is transparent, and the Vienna Circle would have had one unambiguous language instead of all the squabling.'

  I know roughly that Neurath was the awkward one in the Vienna Circle and that he was anti-metaphysics, so the gist feels about right to me, but I don't trust my own judgement here and I'd rather not repeat something embarrassing. Go through it claim by claim and tell me what someone who actually works on Neurath would nod along to, what they'd wince at, and what's just wrong. In particular I want to know whether that last bit — that a picture language would have given unified science a secure foundation and sorted out the Circle's disagreements — actually follows from anything Neurath held, or whether it's more or less the thing he spent his career arguing against. And if some of it is defensible as a populariser's shorthand rather than an error, say which bits those are, instead of making the whole thing sound like a mistake.
