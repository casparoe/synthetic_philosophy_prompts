      *Checking the "Counterfactual" evidence.* The text message is key. It moves it from "he says" to "documented intent."

      *Checking the "Nurse's alternative action".* She could have questioned it. But if the Registrar was determined to give it, questioning it might have just delayed it by 30 minutes. This is the crux.

      *Okay, ready to generate.*

