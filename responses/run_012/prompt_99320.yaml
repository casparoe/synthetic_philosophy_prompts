          *   Determine if any reading actually supports "you can't rule it out."
          *   **Format:** List form (for easy use at dinner).

  2.  **Deconstruct the Phrase ("Absence of evidence is not evidence of absence"):**
      *   *Origin:* Often attributed to Carl Sagan or Martin Rees, but popularized in skeptical discourse.
      *   *Core Logic:* Just because we haven't found $X$ doesn't mean $X$ doesn't exist.
      *   *The Catch:* This is only true if we haven't looked hard enough or in the right places. If we *have* looked thoroughly where $X$ should be, absence *is* evidence.

  3.  **Identify the Different Readings/Interpretations:**
      *   *Reading 1: The Logical Tautology (Trivial).* Strictly speaking, lack of data $\neq$ proof of non-existence.
      *   *Reading 2: The Insufficient Search (Contextual).* We haven't looked enough yet.
      *   *Reading 3: The Bayesian Update (Probabilistic).* Absence lowers the probability, but doesn't zero it out.
      *   *Reading 4: The "God of the Gaps" / Moving Goalposts (Fallacious).* No matter how much we find, the lack of findings doesn't count against the theory.

  4.  **Evaluate Each Reading (True/Trivial/Costly):**
      *   *Reading 1:* Logically true, but trivial. Doesn't help the BIL's case practically.
      *   *Reading 2:* Depends on the search effort. For Hancock's civilization, archaeology has been intensive. Likely false in this context.
      *   *Reading 3:* True. Absence *is* evidence (it shifts probability), just not *proof*.
