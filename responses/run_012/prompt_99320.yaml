prompt: |-
  My brother-in-law got deep into the Graham Hancock stuff after that Netflix series and now every dinner ends with him saying "absence of evidence is not evidence of absence" whenever I mention that nobody's found any trace of his lost ice-age civilization. I want to actually pin down what that sentence can mean, because I'm pretty sure he slides between a few different things without noticing. Can you lay out the precise claims it could be making -- how much and what kind of searching counts, absence for whom, over what area, whether the hypothesis predicts we should have found something by now, whether silence can ever be evidence at all -- and for each reading say whether it's true, trivial, or whether he'd have to give up other things he believes to hold it? I remember some term historians use, "argument from silence," and I can't tell when it applies and when it's a cop-out. Also tell me which reading he's probably using when he says it, and whether any of them actually get him to "so you can't rule it out." List form please, something I can pull out at dinner.
