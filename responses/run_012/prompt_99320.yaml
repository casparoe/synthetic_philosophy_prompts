answer: |-
  Here is a breakdown of the phrase "absence of evidence is not evidence of absence," dissected into its precise logical claims, evaluated for truth and cost, and tailored for your dinner table debate.

  ### 1. The Four Readings of the Phrase

  **Reading A: The Logical Tautology**
  *   **The Claim:** "It is logically impossible to prove a universal negative with 100% metaphysical certainty."
  *   **The Nuance:** This is strictly about *proof*, not *evidence*. It means you cannot mathematically prove that a teapot isn't orbiting Mars.
  *   **Verdict:** **True but Trivial.** No serious skeptic claims to have *proof* of absence. They claim the probability is vanishingly low. If your brother-in-law uses this, he is technically right but practically useless.
  *   **Cost to Beliefs:** None. Everyone agrees with this.

  **Reading B: The Insufficient Search**
  *   **The Claim:** "We have not looked in the right places, or with enough sensitivity, to expect a detection yet."
  *   **The Nuance:** This relies on the *scope of the search*. Absence of evidence is only weak evidence if the search was poor. If you look under the bed for an elephant and see nothing, that absence *is* strong evidence there is no elephant.
  *   **Verdict:** **False (in this context).** Archaeology, geology, and genetics have scanned the Holocene/Pleistocene transition extensively. A *global* civilization implies agriculture, population density, and waste. We have core samples, sediment records, and genetic bottlenecks. We have looked.
  *   **Cost to Beliefs:** High. To hold this, he must believe the entire scientific establishment is incompetent or that the civilization was magically invisible (no trash, no pollen spikes, no DNA).

  **Reading C: The Bayesian Update**
  *   **The Claim:** "Failure to find something lowers the probability of it existing, but does not reduce it to zero."
  *   **The Nuance:** This distinguishes between *evidence* and *conclusive proof*. Every time we dig and find nothing, the "Hancock Hypothesis" becomes less likely, but not impossible.
  *   **Verdict:** **True.** This is how science works. Absence *is* evidence; it just isn't *absolute* evidence.
  *   **Cost to Beliefs:** Moderate. He must admit that his theory is becoming less credible every year, even if not "debunked."

  **Reading D: The Immunity Shield (The Fallacy)**
  *   **The Claim:** "Negative results count for nothing, regardless of how thorough the search was."
  *   **The Nuance:** This treats the hypothesis as unfalsifiable. It asserts that the lack of findings is neutral rather than negative.
  *   **Verdict:** **False.** This is a logical fallacy. If a theory predicts we *should* find something (e.g., ruins, artifacts) and we don't, that is evidence *against* the theory.
  *   **Cost to Beliefs:** High. He has to abandon the scientific method to keep this. You cannot make a claim about physical reality that is immune to physical disproof.

  ***

  ### 2. The "Argument from Silence" (Historian's Term)

  You remembered the term correctly. Here is how to wield it:

  *   **When it is Valid:** When the silence is *deafening*. If a civilization was global and advanced enough to build monuments (as Hancock claims), it should leave traces in ice cores, sediment layers, and genetic diversity. The fact that *none* of these independent records show a spike in human activity 12,000 years ago is a valid **Argument from Silence**.
  *   **When it is a Cop-out:** When the records shouldn't exist. (e.g., "There is no written record of my breakfast, therefore I didn't eat.")
  *   **The Dinner Counter:** "An argument from silence is only a fallacy if we wouldn't expect a noise. You're claiming a global civilization existed. That makes a lot of noise. The silence isn't an absence of data; it's data itself."

  ***

  ### 3. What Your Brother-in-Law is Actually Doing

  *   **The Switch:** He is sliding between **Reading A** (Logically True) and **Reading D** (Fallacious).
  *   **The Move:** He uses the logical truth of A ("You can't prove it didn't happen") to shield the fallacious immunity of D ("Therefore, I don't need to explain why there's no proof").
  *   **Does it get him to "You can't rule it out"?**
      *   **Technically:** Yes. (See Reading A). You can never rule anything out with 100% certainty.
      *   **Practically:** No. We rule things out "beyond a reasonable doubt" all the time. We rule out that the moon is made of cheese, even if we can't prove a negative.
      *   **The Trap:** If he insists on 100% certainty to rule something out, he must also accept that we can't rule out invisible dragons, which makes his belief no more special than a fantasy.

  ***

  ### 4. Dinner Table Cheat Sheet (Pull this out)

  1.  **"Are you talking about *proof* or *probability*?"**
      *   If *proof*: You're right, but nobody has proof of anything.
      *   If *probability*: Absence of evidence *is* evidence of absence. Every empty dig site makes your theory less likely.
  2.  **"Where should the evidence be?"**
      *   If he says "Destroyed": Ask why *everywhere* was destroyed equally without a trace in the geological record.
      *   If he says "Hidden": Ask why a global civilization would hide so perfectly.
  3.  **"Is your theory falsifiable?"**
      *   If nothing counts against his theory, then nothing counts *for* it either. It's not history; it's faith.
  4.  **"The Elephant Test"**
      *   "If I say there's an elephant in this room, and we look and don't see one, is the 'absence of evidence' just a neutral fact? Or is it pretty good evidence there's no elephant?"

  **The Knockout Line:**
  "Carl Sagan coined that phrase to describe why we shouldn't dismiss the *possibility* of extraterrestrial life given the vastness of space. He didn't mean we should believe in invisible elephants in our living rooms just because we haven't swept under the sofa today."
