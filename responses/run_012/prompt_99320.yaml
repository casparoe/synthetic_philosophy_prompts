  5.  **Address "Argument from Silence":**
      *   *Definition:* Inferring something didn't happen because records don't mention it.
      *   *Validity:* Valid only if the records *should* have mentioned it (e.g., a global civilization leaving no trace anywhere).
      *   *Cop-out:* Using it when the silence is expected or irrelevant.

