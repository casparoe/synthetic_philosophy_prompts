  This is fantastic material. You've accidentally recreated one of the most famous experiments in behavioral economics history. Dan isn't just thinking like a poker pro; he's thinking like a human being who violates the standard laws of economics in a very specific, predictable way.

  Here is the breakdown of the rules Dan is running, the prediction for your new scene, and the tie-breaker bet to settle his psychology once and for all.

  ### 1. The Diagnosis: The Allais Paradox
  First, the big reveal you can use in the book: **Bets 1 and 2 are the "Allais Paradox."**

  In 1953, Maurice Allais proved that humans violate "Expected Utility Theory" (the idea that we always make the mathematically rational choice).
  *   **Bet 1:** Dan chose the **Certainty Effect**. He preferred a sure \$1M over a slightly riskier bet with higher *Expected Value* (EV). (EV of A: \$1M | EV of B: \$1.39M).
  *   **Bet 2:** Dan chose the **Possibility Effect**. When the certainty was removed, he suddenly became risk-seeking, chasing the higher payout despite the odds being nearly identical. (EV of A: \$110k | EV of B: \$500k).

  **Economically:** Dan is inconsistent.
  **Psychologically:** Dan is perfectly consistent. He operates on a **"Certainty Premium."**

  ### 2. The Competing Rules (The "Dan Algorithm")

  To write his internal monologue, you need to know which model is driving the car. Here are the three contenders:

  #### Rule A: Expected Value Maximization (The "Robot")
  *   **Logic:** Always pick the highest mathematical average return.
  *   **Fit:** Fails Bet 1 and Bet 3. Dan willingly threw away \$390k (Bet 1) and \$100k (Bet 3) to avoid risk.
  *   **Prediction for Bet 5:**
      *   Option A: 10% of \$1M = **\$100,000 EV**
      *   Option B: 8% of \$1.2M = **\$96,000 EV**
      *   **Pick:** **A**

  #### Rule B: Prospect Theory (The "Psychologist")
  *   **Logic:** Humans overweight small probabilities (lottery ticket syndrome) and heavily overweight certainty (the "100%" anchor).
  *   **Fit:** Perfectly explains Bets 1, 2, and 3. He overvalues the 100% in Bets 1 & 3. In Bet 2, he treats 11% and 10% as roughly the same "small chance" bucket, so he just grabs the bigger number (\$5M).
