      *   **Pick:** **A** (He follows the probability because the payout premium is too low).

  #### Rule C: The Poker Pro / Bankroll Management (The "Professional")
  *   **Logic:** "I don't bet the farm unless I have to." If a "Sure Thing" exists that changes my life, I take it (Bet 1 & 3). If no Sure Thing exists, I play the +EV (Bet 2 & 4).
