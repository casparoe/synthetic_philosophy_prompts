answer: |-
  Below is an inventory of the distinct philosophical claims encapsulated by the proverb "When in Rome, do as the Romans do" (WIR), ordered from the trivial to the radical. Following the inventory, I address the consistency of these readings, their coverage of your four cases, and the status of the *mala in se* vs. *mala prohibita* distinction in this context.

  Throughout, I distinguish between **consensus views** (e.g., that conventions facilitate coordination) and **contested claims** (e.g., that conventions generate moral obligations).

  ### Inventory of Readings

  #### 1. The Prudential Reading
  *   **Thesis:** Conformity to local norms is instrumentally rational for the agent to avoid sanctions, social friction, or confusion.
  *   **Verdict:** **Platitude.** This is empirically true in most contexts but morally inert. It is advice, not an obligation.
  *   **Obligation:** None. It generates a hypothetical imperative (*if* you wish to avoid trouble, *then* conform). Owed to oneself.
  *   **Application to Cases:**
      *   (i) **Supports:** Crowding the bus avoids conflict with locals.
      *   (ii) **Supports:** Jaywalking with the crowd avoids being singled out, even if illegal.
      *   (iii) **Weak Support:** Not tipping might lead to social disapproval, but the economic harm to the server is external to this reading.
      *   (iv) **Supports:** If visitors enforce the norm, non-conformity risks friction with the dominant group present.

  #### 2. The Coordination Reading (Lewisian Convention)
  *   **Thesis:** Local conventions are solutions to recurrent coordination problems. Deviation creates inefficiency or confusion for others who rely on common knowledge of compliance.
  *   **Verdict:** **Substantive/Defensible.** Widely accepted in game theory and social ontology (David Lewis), though its moral weight is debated.
  *   **Obligation:** **Rational Requirement.** Owed to other participants in the coordination scheme.
  *   **Application to Cases:**
      *   (i) **Strong Support:** Queueing fails if others crowd; one must coordinate with the actual flow (the crowd), not the abstract ideal.
      *   (ii) **Ambiguous:** If everyone jaywalks, the "coordination point" may be mass crossing, not the traffic light. However, this conflicts with safety coordination.
      *   (iii) **Weak Support:** Tipping is not strictly a coordination problem (the meal is served regardless), though it coordinates wage expectations.
      *   (iv) **Fails:** If the "locals" are transient visitors, there is no stable coordination equilibrium to sustain.

  #### 3. The Fair Play Reading (Reciprocity)
  *   **Thesis:** By accepting the benefits of a local social scheme (order, service, predictability), one incurs an obligation to obey its rules and share the burdens.
  *   **Verdict:** **Contested.** Defended by H.L.A. Hart and John Rawls; attacked by Robert Nozick (who argues benefits thrust upon you do not create obligations).
  *   **Obligation:** **Moral Duty.** Owed to fellow participants who are restraining themselves for the common good.
  *   **Application to Cases:**
      *   (i) **Supports:** If the local system is "crowding," you benefit from the speed of boarding; fairness requires you not to queue slowly.
      *   (ii) **Fails/Conflicts:** If the law is the "scheme," jaywalking violates fair play. If the "scheme" is the crowd's flow, obeying the law violates fair play. Highlights the "Who are the Romans?" ambiguity.
      *   (iii) **Strong Support:** You benefit from the service model; fairness dictates paying the expected wage supplement.
      *   (iv) **Fails:** In a town of visitors, there is no cooperative scheme to which one is contributing or from which one is drawing long-term benefit.

  #### 4. The Expressive Reading (Respect)
  *   **Thesis:** Conformity is a symbolic act of respect for the autonomy and culture of the host community. Deviation expresses arrogance or disdain.
  *   **Verdict:** **Substantive/Contested.** Plausible in political philosophy (respect for sovereignty), but difficult to apply to minor conventions (queueing).
  *   **Obligation:** **Duty of Respect.** Owed to the community as a collective agent.
  *   **Application to Cases:**
      *   (i) **Supports:** Insisting on queueing expresses a judgment that local habits are "uncivilized."
      *   (ii) **Ambiguous:** Does respecting the community mean respecting its *laws* (rule-makers) or its *people* (the crowd)?
      *   (iii) **Weak Support:** Tipping is less about cultural respect and more about economic survival.
      *   (iv) **Fails:** If there is no stable community (only visitors), there is no host culture to respect.

  #### 5. The Constitutivist Reading (Moral Relativism)
  *   **Thesis:** The moral status of the act is *constituted* by the local norm. There is no independent standard; the action is right *because* the Romans do it.
  *   **Verdict:** **Radical/Generally Rejected.** Meta-ethical relativism is a minority view in contemporary analytic philosophy. Most argue conventions can be morally evaluated from outside.
  *   **Obligation:** **None (Descriptive).** If rightness is local, there is no universal obligation, only local validity.
  *   **Application to Cases:**
      *   (i) **Supports:** Queueing is not "more moral," just different.
      *   (ii) **Supports:** Resolves the law/crowd conflict by asking which norm is socially constitutive of "crossing."
      *   (iii) **Fails:** Cannot account for the intuition that withholding tips is harmful regardless of custom.
      *   (iv) **Fails:** If there are no "Romans" (true locals), the act has no moral constitution.

  ---

  ### Analysis of Inconsistencies and Coverage

  **1. Inconsistencies Between Readings**
  *   **Prudence vs. Fair Play:** The Prudential Reading tells you to conform to avoid trouble (even if the norm is unjust). The Fair Play Reading tells you to conform because it is *right* to reciprocate. If a local norm is harmful (e.g., a discriminatory custom), Prudence may suggest conformity while Fair Play might suggest the "scheme" is illegitimate and generates no obligation.
  *   **Coordination vs. Respect:** Coordination requires following the *effective* norm (what people actually do). Respect often requires following the *formal* norm (laws or stated values). In Case (ii), Coordination says cross with the crowd; Respect (for the state) says obey the light.
  *   **Constitutivism vs. All Others:** If Constitutivism is true, the other readings are category errors. You do not have a *duty* to conform; the act simply *is* right. If Constitutivism is false (as most argue), WIR cannot be the ultimate ground of moral truth.

  **2. Does One Reading Cover All Four Cases?**
  No. The proverb splits depending on the type of convention involved.
  *   **Case (i) Queueing:** Best explained by **Coordination**. The moral weight comes from not disrupting the flow.
  *   **Case (ii) Jaywalking:** Best explained by the tension between **Prudence** (don't get hit/arrested) and **Fair Play** (obey the law). WIR obscures the conflict between "Romans as Authorities" and "Romans as Peers."
  *   **Case (iii) Tipping:** WIR is actually the **wrong tool** here. Your intuition ("bind me... is the person whose income depends on it") is **Consequentialist**, not Conventionalist. WIR suggests you tip because it is custom; you suggest you tip because harm is prevented. If the custom changed to no-tipping, your obligation might vanish, but the WIR justification would remain, which is a mismatch.
  *   **Case (iv) Visitor Town:** This case breaks WIR entirely. It reveals that the proverb presupposes an **ontological condition**: there must be a stable "Rome." If the "locals" are transient, the norm lacks the authority of tradition or the stability of coordination. Here, WIR offers no guidance because there are no "Romans."

  **3. The *Mala In Se* vs. *Mala Prohibita* Distinction**
  You asked how much work the contrast between "wrong whatever the rule says" (*mala in se*) and "wrong only because of the rule" (*mala prohibita*) can do.

  *   **Within a Society:** The distinction is useful but porous. Jaywalking is *mala prohibita* (illegal only by statute), but if done in traffic, it risks harm (*mala in se*).
  *   **Across Societies:** The distinction destabilizes when applied to WIR.
      *   *Tipping:* Is it *mala prohibita* (a local rule) or *mala in se* (withholding earned wage)? If the latter, WIR is irrelevant; you should tip even if not in Rome. If the former, WIR applies, but your moral intuition resists.
      *   *Queueing:* Is crowding *mala in se* (rude/aggressive) or *mala prohibita* (just a different flow)? WIR assumes it is *mala prohibita*.
      *   **The Problem:** WIR attempts to convert *mala in se* intuitions into *mala prohibita* compliance. It says, "Do not judge the act by universal standards (*in se*), but by local jurisdiction (*prohibita*)."
      *   **Verdict:** The contrast survives application across societies only if one accepts **Moral Relativism** (Reading 5). If one holds that harm is universally wrong, WIR cannot justify conventions that cause harm (like a custom of non-payment). Therefore, the *mala in se/prohibita* distinction acts as a **limit** on WIR: WIR applies only to genuine *mala prohibita*. The controversy lies in classifying the act.

  ---

  ### Settled vs. Contested in Normative Theory

  To ensure your paper marks disagreement rather than resolving it, note the following distinctions:

  **Settled (Consensus):**
  *   **Conventions exist:** Social norms vary by geography and context.
  *   **Coordination value:** Conventions generally reduce transaction costs and confusion (Reading 2).
  *   **Prudential value:** Conformity generally reduces social friction (Reading 1).
  *   **No Absolute Relativism:** Most philosophers reject the idea that local custom *alone* makes an action morally right if it violates fundamental rights (Reading 5 is largely rejected).

  **Contested (Disagreement):**
  *   **The Principle of Fair Play:** Does receiving a benefit *automatically* generate an obligation to obey? (Hart/Rawls vs. Nozick). This determines if Reading 3 holds water.
  *   **The Source of Obligation:** Is the obligation to conform grounded in **consequences** (harm to server), **consent** (entering the jurisdiction), or **respect** (cultural autonomy)?
  *   **The Definition of "The Romans":** Does authority lie with the **State** (laws) or the **Populace** (descriptive norms)? Case (ii) shows this is unresolved in common usage.
  *   **Moral Weight of Etiquette:** There is no consensus on whether breaches of etiquette (queueing, tipping) are moral failures or merely social faux pas.

  ### Summary for Your Paper
  The proverb "When in Rome..." is not a single moral principle but a **rhetorical umbrella** covering at least five distinct claims ranging from prudential advice to radical relativism.
  *   It functions well for **coordination problems** (Case i).
  *   It creates ambiguity regarding **authority** (Case ii).
  *   It often **masks consequentialist duties** (Case iii).
  *   It **presupposes a stable community** that may not exist (Case iv).

  Your paper can argue that the proverb is useful heuristically for *mala prohibita* (coordination/etiquette) but dangerous when applied to conventions with *mala in se* implications (economic harm/safety), and that it fails entirely when the ontological status of the "local" is unstable.
