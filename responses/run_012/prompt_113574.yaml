answer: |-
  **MEMORANDUM**

  **TO:** Senior Economist
  **FROM:** Game Theory Unit
  **SUBJECT:** SPEC – Iterated Elimination Protocol (IEDS) for Junior Analysts
  **DATE:** 24 May 2024

  This spec defines the standard operating procedure for reducing payoff matrices. It is designed to be executed by analysts without formal game theory training in under 60 minutes. It prioritizes robustness over mathematical exhaustiveness.

  **WARNING:** This procedure relies on **Common Knowledge of Rationality**. If the opponent is irrational, political, or constrained by factors not in the model, the output is garbage. If the strategy space is incomplete (we missed an option), the output is garbage.

  ---

  ### PART 1: THE PROCEDURE (CHECKLIST)

  **Pre-Flight: Data Hygiene**
  1.  [ ] **Verify Orientation:** Ensure rows are *Our* options, columns are *Their* options.
  2.  [ ] **Verify Payoffs:** Ensure cell values are *(Us, Them)*. Do not swap them.
  3.  [ ] **Set Error Margin:** Consult the market model owner. Determine the noise floor (e.g., ±£0.5m). Any payoff difference smaller than this is a **TIE**.

  **Step 1: Strict Dominance Check (Safe)**
  *Check one player at a time. Start with Them (Columns).*
  4.  [ ] **Compare Columns:** Pick two columns. Compare *Their* payoffs row-by-row.
      *   If Col A > Col B in **every** row (by more than Error Margin): **Eliminate B**.
      *   Log reason: *"Strictly dominated by [Col A]."*
  5.  [ ] **Compare Rows:** Pick two rows. Compare *Our* payoffs column-by-column.
      *   If Row A > Row B in **every** column (by more than Error Margin): **Eliminate B**.
      *   Log reason: *"Strictly dominated by [Row A]."*
  6.  [ ] **Iterate:** Repeat Steps 4–5 on the reduced table until no strict eliminations remain.

  **Step 2: Mixed Strategy Check (Moderate Risk)**
  *Only if Step 1 stalls. Checks if a mix of two options beats a third.*
  7.  [ ] **[DECISION] Select Target:** Identify an option (e.g., Col Z) that looks weak but isn't strictly beaten by any single other column.
  8.  [ ] **Test 50/50 Mix:** Average the payoffs of two other options (e.g., Col X and Col Y).
      *   If *(Payoff X + Payoff Y) / 2 > Payoff Z* in **every** row: **Eliminate Z**.
      *   Log reason: *"Dominated by 50/50 mix of [X] and [Y]."*
      *   *Note: Do not optimize weights. If 50/50 doesn't work, skip it. Juniors are not running LP solvers.*
  9.  [ ] **Iterate:** Return to Step 1 with the reduced table.

  **Step 3: Weak Dominance Check (High Risk)**
  *Only if Steps 1 & 2 stall. Requires Senior Sign-off.*
  10. [ ] **[DECISION] Identify Weak Dominance:** Option A beats Option B in some rows and ties in others (within Error Margin), never losing.
  11. [ ] **[DECISION] Assess Sensitivity:** If the "win" margins are small (close to Error Margin), **STOP**. Flag for Senior Review. Do not eliminate.
  12. [ ] **Eliminate:** If margins are robust, eliminate the weaker option.
      *   Log reason: *"Weakly dominated by [Option A] (SENSITIVE)." *
  13. [ ] **Iterate:** Return to Step 1.

  **Termination**
  14. [ ] **Single Cell?** If one row and one column remain: **Recommendation Found.**
  15. [ ] **Multiple Cells?** If the table reduces but >1 option remains per player: **STOP.**
      *   Output: "Rationalizable Set."
      *   Action: Do not recommend a single move. List the remaining scenarios.
  16. [ ] **Cycle Detected?** If eliminations loop or depend entirely on order: **STOP.** Flag for Senior Review.

  ---

  ### PART 2: ASSUMPTIONS & RISKS (THE "BLUNT" STUFF)

  **1. Order Dependence (The Gamble)**
  *   **Strict Dominance:** Order does *not* matter. You can cross out in any sequence; the result is identical.
  *   **Weak Dominance:** Order *does* matter. Crossing out Option A first might make Option B look dominant, whereas keeping A might have made C dominant.
  *   **Rule:** Always exhaust Strict Dominance before touching Weak. If you must use Weak, document the order. If changing the order changes the outcome, the model is too noisy for a recommendation.

  **2. Rationality & Completeness (The License)**
  *   **Rationality:** We assume the opponent wants to maximize the numbers in the table. If they care about market share, reputation, or spite, the payoffs are wrong, and the elimination is invalid.
  *   **Completeness:** We assume we have listed *all* their viable options. If they have a "Nuclear Option" we didn't model, our "dominant" strategy might be suicide.
  *   **Rule:** If the client says "They wouldn't care about profit here," abort the procedure.

  **3. Payoff Uncertainty (The Buffer)**
  *   Model outputs are estimates. A £0.1m advantage is not an advantage.
  *   **Rule:** Apply the Error Margin (Pre-Flight Step 3). If $A - B < \text{Margin}$, treat $A = B$. Never eliminate based on a difference smaller than the model's noise floor.

  ---

  ### PART 3: CASE RUNS

  #### Case 1: The "Safe Option" Trap
  **Matrix:** Rows (A, B, D), Cols (L, C, R). Payoffs (£m).
  **Error Margin:** Assumed ±£0.5m for this run.

  **Elimination Log:**
  1.  **Check Their Cols (Strict):**
      *   Compare L vs R: L(0,0,1) vs R(1,1,1). R is better in Rows A, B. Equal in D.
      *   *Verdict:* Weak Dominance (R > L). Margins (1.0) exceed Error Margin.
      *   **Action:** Eliminate **L**. Reason: *Weakly dominated by R (SENSITIVE).*
  2.  **Check Our Rows (Strict) on Reduced Table (Cols C, R):**
      *   Payoffs Us: A(3,2), B(0,2), D(1,2).
      *   Compare A vs B: A better in Col C (3>0). Equal in Col R (2=2).
      *   *Verdict:* Weak Dominance (A > B).
      *   **Action:** Eliminate **B**. Reason: *Weakly dominated by A.*
      *   Compare A vs D: A better in Col C (3>1). Equal in Col R (2=2).
      *   *Verdict:* Weak Dominance (A > D).
      *   **Action:** Eliminate **D**. Reason: *Weakly dominated by A.*
  3.  **Check Their Cols (Strict) on Reduced Table (Row A):**
      *   Payoffs Them: C(3), R(1).
      *   *Verdict:* Strict Dominance (C > R).
      *   **Action:** Eliminate **R**. Reason: *Strictly dominated by C.*
  4.  **Termination:** Row A, Col C remain.

  **Recommendation:** Play **A**. Expect them to play **C**. Outcome: **(3, 3)**.

  **Client Pitch (Option D is their favorite):**
  > "We know D feels safer because it guarantees a £1m–£2m return regardless of their move. However, game theory assumes they will not play L, because R is always at least as good for them. Once we remove L, D loses its protective value. Against their remaining options (C and R), Option A consistently outperforms D. D is only 'safe' if they make a mistake (playing L). If we assume they are rational, D is a dominated strategy. We recommend A to capture the £3m upside, as the downside risk (them playing R) is eliminated by their own rationality."

  ***

  #### Case 2: The "Tie" Trap
  **Matrix:** Rows (X, Y), Cols (P, Q). Payoffs (£m).
  **Error Margin:** Assumed ±£0.5m.

  **Elimination Log:**
  1.  **Check Their Cols (Strict):**
      *   Compare P vs Q:
          *   If Us=X: P(1) > Q(0).
          *   If Us=Y: P(0) < Q(1).
      *   *Verdict:* No dominance.
  2.  **Check Our Rows (Strict):**
      *   Compare X vs Y:
          *   If Them=P: X(1) = Y(1). (Tie within margin).
          *   If Them=Q: X(0) < Y(1).
      *   *Verdict:* Weak Dominance (Y > X). Margin on Q is 1.0 (Safe). Tie on P is exact.
      *   **Action:** Eliminate **X**. Reason: *Weakly dominated by Y (Tie on P).*
  3.  **Check Their Cols (Strict) on Reduced Table (Row Y):**
      *   Payoffs Them: P(0), Q(1).
      *   *Verdict:* Strict Dominance (Q > P).
      *   **Action:** Eliminate **P**. Reason: *Strictly dominated by Q.*
  4.  **Termination:** Row Y, Col Q remain.

  **Recommendation:** Play **Y**. Expect them to play **Q**. Outcome: **(1, 1)**.

  **Sensitivity Note:** The elimination of X rests entirely on the tie at (X,P) vs (Y,P). If the model is off by +£0.1m for X, dominance vanishes. **Flag this to Senior.**

  ---

  ### PART 4: FAILURE MODES (WHERE THIS MISFIRES)

  Instruct juniors to halt and escalate immediately if they spot these three patterns. Do not try to force the procedure.

  **1. The "Rock-Paper-Scissors" Cycle**
  *   **Symptom:** You eliminate A because of B, then B because of C, then C because of A. Or, no option dominates another at all (cyclic preferences).
  *   **Meaning:** There is no pure strategy solution. The opponent *must* keep you guessing (mixed strategy equilibrium).
  *   **Action:** Stop. Do not recommend a single option. Report "No Pure Strategy Equilibrium."

  **2. The "Weakness Cascade"**
  *   **Symptom:** The first elimination relies on Weak Dominance (a tie in one cell). That elimination triggers a second elimination, which triggers a third.
  *   **Meaning:** The final recommendation is fragile. If the initial "tie" was actually a slight loss due to model error, the entire chain collapses.
  *   **Action:** Stop. Run a sensitivity analysis on the initial tie. If the recommendation flips, report "Outcome Sensitive to Model Error."

  **3. The "Empty Set"**
  *   **Symptom:** You eliminate all of *Their* options, or all of *Our* options.
  *   **Meaning:** You have assumed too much. Usually caused by aggressive Weak Dominance elimination on noisy data.
  *   **Action:** Revert to the last stable table. The error is in the elimination criteria, not the math.

  **END OF SPEC**
