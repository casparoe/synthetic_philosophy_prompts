answer: |-
  **Essay Question**

  In the *Laws*, the Athenian Stranger proposes the drinking party not as a concession to appetite, but as a crucial institutional test of character. Explain how this practice functions within the psychology of the 'divine puppet.' Does a virtue that collapses under the influence of wine deserve the name, or does the drinking party reveal that the virtue was never there to begin with? Finally, argue whether this institutionalized intoxication resolves or deepens the tension with the *Republic's* suspicion of appetite and the *Symposium's* chaotic ending.

  ***

  **Model Answer**

  The apparent contradiction between Plato's early suspicion of appetite and the *Laws'* endorsement of wine dissolves once we recognize that the drinking party is not designed for pleasure, but for pharmacological education. In the *Laws*, wine is an instrument used to safely induce a state of psychic vulnerability, allowing the legislator to verify and strengthen the citizen's rational cords. Far from contradicting the *Republic*, this represents a maturation of Plato's political psychology: where the *Republic* protects the soul from corruption, the *Laws* actively inoculates it through controlled exposure.

  To understand this, we must look at the puppet image. The human being is pulled by cords of iron (passions, fears, pleasures) and a single cord of gold (reason). The golden cord is fragile; it requires the support of *aidos* (reverence or shame) to hold it taut against the violent tug of appetite. In ordinary life, a citizen may appear virtuous simply because their circumstances are calm. However, wine acts as a chemical simulator of fear and passion. It loosens the iron cords, amplifying desires and lowering inhibitions. If a citizen's commitment to the golden cord relies solely on external sobriety, the wine will sever it.

  This addresses the crux of whether virtue that evaporates after two cups is real virtue. The answer must be no: if character collapses under intoxication, it was never virtue, but merely habit or luck. True virtue requires stability across changing psychic states. The symposium, therefore, is not a holiday from education but its ultimate classroom. It provides a safe space where the consequences of losing control are social embarrassment rather than political ruin. By practicing resistance to wine-induced shamelessness, the citizen strengthens the golden cord's alliance with *aidos*. The drinking party is a school for virtue because it transforms untested habit into tested resilience.

  Does this reconcile with the *Republic* and *Symposium*? In the *Republic*, Socrates bans the poets and guards the guardians' appetites because the city is being built from scratch to prevent corruption. The focus is on purity. In the *Laws*, Plato deals with existing human nature, which is flawed and susceptible. The *Laws* accepts that appetites cannot be excised, only managed. Therefore, the tension is not a contradiction but a shift in strategy from isolation to management. The *Republic* fears the tyrant within; the *Laws* trains the citizen to govern him.

  Similarly, the *Symposium*'s ending, where Alcibiades crashes the party drunk and reveals his unhealed soul, serves as a negative example of what the *Laws* seeks to prevent. Alcibiades uses wine to reveal his truth, but without the institutional framework of the *Laws*, his revelation is destructive chaos. The *Laws* institutionalizes the insight of the *Symposium*—that wine reveals character—but adds the regulatory structure to make that revelation constructive. Alcibiades shows us the danger of unregulated intoxication; the Athenian Stranger shows us the cure.

  Ultimately, wine in the *Laws* is a tool for truth. It strips away the social mask to reveal the psychic reality underneath. If the mask falls and the face beneath is vicious, the wine did not create the vice; it revealed it. By making the drinking party a public institution, Plato ensures that this revelation becomes an opportunity for correction rather than a private downfall. Thus, the *Laws* does not abandon the *Republic's* rigor; it applies it to the messy reality of human psychology, using the very thing that threatens reason as the whetstone to sharpen it.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Function of Wine (4 Marks)**
  *   **Hit:** Identifies wine as a *tool/instrument* for testing/education, not a pleasure or concession.
  *   **Common Error:** Treating the *Laws* as Plato "giving in" to hedonism or old age.
  *   **Mark:** 4 for instrumental analysis; 2 for descriptive summary; 0 for "Plato changed his mind."

  **2. Puppet Psychology (4 Marks)**
  *   **Hit:** Correctly explains the cords (gold/reason vs. iron/passion) and the role of *aidos* as the stabilizer.
  *   **Common Error:** Reading the puppet image as hard determinism (humans have no choice) rather than a model of moral struggle.
  *   **Mark:** 4 for dynamic struggle; 2 for static description; 0 for deterministic reading.

  **3. The Virtue Crux (4 Marks)**
  *   **Hit:** Takes a stand: Unstable character is *habit*, not virtue. The symposium tests/stabilizes it.
  *   **Common Error:** Sitting on the fence ("It depends on the person") or claiming wine *destroys* virtue rather than revealing its absence.
  *   **Mark:** 4 for committed argument; 2 for hedging; 0 for contradiction.

  **4. Symposium as School (4 Marks)**
  *   **Hit:** Argues the symposium is a pedagogical institution (safe space for failure), not a social event.
  *   **Common Error:** Confusing the *Laws* symposium with the *Symposium's* party (ignoring the regulatory framework).
  *   **Mark:** 4 for institutional analysis; 2 for conflating dialogues; 0 for "it's just a party."

  **5. Reconciliation with *Republic/Symposium* (4 Marks)**
  *   **Hit:** Resolves tension via context (Ideal City vs. Second-Best City) or strategy (Isolation vs. Inoculation).
  *   **Common Error:** Claiming a flat contradiction ("Plato contradicts himself") without philosophical justification.
  *   **Mark:** 4 for synthesis; 2 for noting tension without resolution; 0 for ignoring other dialogues.

  **Grade Boundary Notes**

  *   **A-Range (17–20):** **Synthesis and Stance.** The essay treats the prompt as a single argument. The student *uses* the puppet image to explain *why* the virtue test works, and explicitly links the *Symposium's* Alcibiades to the *Laws'* solution. The tone is decisive (e.g., "The answer must be no").
  *   **B-Range (13–16):** **Description and Separation.** The student gets the facts right (wine is a test, puppets have cords) but treats the three parts of the question as separate paragraphs. They note the tension with the *Republic* but describe it rather than resolving it. They hesitate on the "real virtue" question.
  *   **C-Range (9–12):** **Summary.** Focuses on plot summary of the dialogues. Misinterprets the puppet image as denying free will. Claims Plato just got softer in old age.
