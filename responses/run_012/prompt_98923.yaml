prompt: |-
  ok so I'm in a small study group on practical reason and I need you to help me audit a summary of Bernard Williams's internal vs. external reasons distinction. You're a philosopher who works on practical reason and metaethics and has read the Williams stuff closely, so take your time with this — before you answer, brainstorm the moving parts of the view for yourself (what the internal/external contrast is actually a contrast between, what the agent's "subjective motivational set" is supposed to include, what work the idea of a sound deliberative route is doing, and how all of this relates to the separate debates about moral motivation and about whether morality is categorical). Only after you've mapped that out, go through the summary sentence by sentence.

  A friend of mine who did an MA in philosophy summarized it for me like this:

  'An internal reason is a reason you have in virtue of the desires you actually have, and an external reason is one that would apply to you no matter what you want. Williams's thesis is that all reasons are internal, so if someone really doesn't care about something, they have no reason to do it, full stop. This makes him a Humean about moral motivation: a moral judgment only gives you a reason if you happen to want the relevant end, which is why the categorical "ought" that the Kantians appeal to turns out to be a fiction. The standard objection is that morality is categorical and binds us whether or not we care, so there have to be external reasons; and since Williams doesn't really answer this, the view is a minority position that most philosophers today reject.'

  He's usually reliable so I assumed it was basically fine, but two things nag at me. First, I've heard Williams described as a "Humean" and I've also heard that the Humean theory of motivation is a different debate from his reasons internalism, and I genuinely can't tell whether those are the same thing or whether my friend is sliding between them. Second, that last sentence smells like it's just asserting the outcome of an argument rather than the argument.

  So go sentence by sentence: what would Williams accept, what would he wince at, and what is just wrong? Then tell me whether the verdict in the last sentence follows from anything true in the summary, or whether the summary was quietly carrying it the whole time. I'm a reader here, not trying to grade anybody — I just want to know which parts to trust. Please don't give me reading lists or citations, I won't be able to check them anyway.
