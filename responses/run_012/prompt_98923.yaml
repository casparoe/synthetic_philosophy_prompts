answer: |-
  Here is the philosophical map you asked for. I need to lay this out first because the summary you received conflates several distinct technical claims. Once we have the machinery clear, we can see where your friend's summary breaks down.

  ### The Philosophical Map: Williams's Moving Parts

  **1. The Internal/External Contrast**
  This is a distinction about the *truth conditions* of reason statements (e.g., "A has a reason to $\phi$").
  *   **Internal Reasons:** A reason statement is true only if the agent can reach the action via a **sound deliberative route** starting from their **Subjective Motivational Set (SMS)**.
  *   **External Reasons:** A reason statement is true even if there is *no* link to the agent's SMS. It claims there is a reason "out there" independent of the agent's psychology.
  *   **Williams's Claim:** External reason statements are false (or unintelligible). All true reason statements are internal.

  **2. The Subjective Motivational Set (SMS)**
  This is the most common point of distortion. The SMS is **not just desires**.
  *   It includes occurrent desires, but also dispositions, commitments, projects, loyalties, emotional patterns, and broader life goals.
  *   Crucially, it is the *raw material* for deliberation. It is not a static list of things you currently "want" in a shallow sense.

  **3. The Sound Deliberative Route**
  This is the engine of Williams's view. It prevents Internalism from collapsing into "do whatever you feel like."
  *   A sound route includes instrumental reasoning (how to get what I want).
  *   It includes correcting factual errors (I thought this glass was gin, it's petrol).
  *   It includes **deliberative discovery**: I might realize that a commitment I have (e.g., to my family) implies I must do something I currently have no desire to do (e.g., work a boring job).
  *   Therefore, an agent can have an internal reason to do something they currently *don't* want to do, provided there is a route from their deeper SMS to that action.

  **4. Motivation vs. Reasons (The Humean Distinction)**
  *   **Humean Theory of Motivation (HTM):** A psychological claim. To act, you need a belief and a desire (or pro-attitude). Beliefs alone don't move you.
  *   **Reasons Internalism:** A normative/semantic claim. For a reason to exist *for* an agent, it must be grounded in their motivational potential.
  *   **The Link:** Williams uses HTM to support Internalism (if reasons must be capable of motivating, and motivation requires an internal state, then reasons must be internal). But they are not the *same* thesis. You can theoretically hold one without the other.

  **5. Morality and the Categorical**
  *   Williams is skeptical of "Morality" (the specific system of obligation) distinct from "Ethics" (how one should live).
  *   The Kantian "Categorical Imperative" claims to give reasons regardless of your desires/projects. Williams sees this as an attempt to state an External Reason.
  *   If Internalism is true, the Categorical Imperative doesn't necessarily bind everyone *unless* they have something in their SMS that binds them to morality (e.g., a commitment to rationality or decency).

  ***

  ### The Audit: Sentence by Sentence

  Now, let's take your friend's summary and run it against this map.

  **Sentence 1:**
  *"An internal reason is a reason you have in virtue of the desires you actually have, and an external reason is one that would apply to you no matter what you want."*

  *   **Williams would wince:** The word "desires" is too narrow. As noted in the map, the SMS includes commitments, projects, and loyalties that might conflict with your immediate desires. If I have a commitment to my spouse, I have an internal reason to care for them even if I currently "desire" to sleep in. Reducing the SMS to "desires" makes Williams sound like a crude hedonist, which he isn't.
  *   **Williams would accept:** The second half is roughly correct. An external reason is supposed to apply independently of the agent's subjective makeup.
  *   **Verdict:** **Imprecise.** It captures the basic intuition but misses the technical definition of the SMS.

  **Sentence 2:**
  *"Williams's thesis is that all reasons are internal, so if someone really doesn't care about something, they have no reason to do it, full stop."*

  *   **Williams would accept:** The first clause is right. He does argue all true reason statements are internal.
  *   **Williams would wince:** The phrase "if someone really doesn't care." This ignores the **sound deliberative route**. I might not *currently* care about quitting smoking, but if I have a project (seeing my kids grow up) and I deliberate correctly (smoking prevents this), I have an internal reason to quit. The reason exists because of the *potential* to care via deliberation, not just current caring.
  *   **Williams would reject:** "Full stop" is slightly misleading if it implies deliberation can't change what you care about. However, if after *ideal* deliberation you still have no link to the action, then yes, you have no reason.
  *   **Verdict:** **Mostly right, but simplistic.** It misses the dynamic nature of deliberation.

  **Sentence 3:**
  *"This makes him a Humean about moral motivation: a moral judgment only gives you a reason if you happen to want the relevant end, which is why the categorical "ought" that the Kantians appeal to turns out to be a fiction."*

  *   **Williams would wince:** Here is the conflation you sensed. Being a "Humean about moral motivation" (HTM) is distinct from Reasons Internalism. Williams is usually both, but the summary treats them as identical.
  *   **Williams would wince:** "If you *happen* to want." Again, this ignores deliberation. It's not about what you happen to want right now; it's about what is grounded in your SMS after sound deliberation.
  *   **Williams would accept:** He does think the Kantian categorical "ought" is conceptually confused if it claims to provide external reasons. He might not call it a "fiction" (which implies a lie), but rather a philosophical error.
  *   **Verdict:** **Conflated.** It slides between psychological claims (motivation) and normative claims (reasons), and it oversimplifies the "wanting" condition.

  **Sentence 4:**
  *"The standard objection is that morality is categorical and binds us whether or not we care, so there have to be external reasons; and since Williams doesn't really answer this, the view is a minority position that most philosophers today reject."*

  *   **Williams would reject:** "Williams doesn't really answer this." His *entire paper* is the answer. His answer is: "You are presupposing that morality *does* bind us whether or not we care. I am arguing that nothing binds us unless we care. You are begging the question." He doesn't fail to answer; he denies the premise of the objection.
  *   **Williams would reject:** "The view is a minority position that most philosophers today reject." This is empirically dubious. Reasons Internalism (in various forms, including constitutivism and neo-Humeanism) is a dominant force in contemporary metaethics. It is certainly not a "rejected minority" view in the way the summary implies (like phlogiston theory). It is one of the two or three main live options.
  *   **Verdict:** **Wrong.** This sentence begs the question against Williams and makes a dubious sociological claim about the profession.

  ***

  ### Addressing Your Specific Doubts

  You were right to be nagged by both points. Here is the breakdown:

  **1. The "Humean" Confusion**
  Your friend is sliding between two different debates.
  *   **Debate A (Psychology):** Can belief alone motivate action? (Humean Theory of Motivation).
  *   **Debate B (Normativity/Semantics):** Do reasons depend on the agent's motivations? (Reasons Internalism).
  Williams argues that if A is true, B is likely true (because if reasons must be able to motivate, and motivation requires desire, then reasons must link to desire). But they are not the same claim. Your friend's summary treats them as identical. You should trust the summary's claim that Williams *is* a Humean, but distrust the implication that Internalism *just is* the Humean Theory of Motivation.

  **2. The Verdict in the Last Sentence**
  Does the verdict follow from the summary? **No.**
  The summary quietly carries the verdict the whole time by framing the Kantian objection as a fact ("morality *is* categorical and binds us") rather than as a counter-claim.
  *   If you assume morality *must* be categorical, then Williams is obviously wrong.
  *   But Williams's whole point is to challenge whether "morality" (in that specific Kantian sense) is a coherent concept.
  *   By stating the objection as "Morality *is* categorical... so there *have* to be external reasons," your friend is asserting the conclusion they are supposed to be proving. They are treating Williams's opponent's premise as a established fact.
  *   Furthermore, the claim that "most philosophers today reject" Internalism is not a logical consequence of the previous sentences; it's an appeal to authority that doesn't hold up in current metaethics circles. Internalism is extremely robust.

  ### Final Advice on What to Trust

  *   **Trust:** The basic intuition that Williams links reasons to the agent's subjective perspective (Sentence 1 & 2).
  *   **Trust:** That Williams is hostile to the Kantian categorical imperative (Sentence 3).
  *   **Do Not Trust:** The definition of the "subjective set" as merely "desires" (it's richer than that).
  *   **Do Not Trust:** The claim that Williams ignores the objection about morality (he centers his whole theory on refuting it).
  *   **Do Not Trust:** The claim that Internalism is a dead/minority view (it is a central, dominant position).
  *   **Do Not Trust:** The equation of Reasons Internalism with the Humean Theory of Motivation (they are distinct steps in the argument).

  Your friend's summary is a "cocktail party" version: it gets the vibe right but misses the philosophical machinery that makes the view defensible. It makes Williams look like he's saying "you only have reasons to do what you already want," when he's actually saying "you only have reasons to do what connects to who you are, which deliberation can reveal." That distinction is everything.
