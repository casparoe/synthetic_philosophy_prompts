prompt: |-
  My podcast guest next week is a philosopher who's spent about twenty years arguing that you can be competent at something without comprehending it at all — he's a Dennett guy, he'll cite Darwin's Dangerous Idea and that later one, From Bacteria to Bach and Back, and his big claim is that Darwin and Turing both pulled the same kind of reversal: Darwin showed you can get design without a designer, Turing showed you can get answers that look like they came from somebody who understands without anybody understanding.

  Can you draft me eight to ten questions that actually press him instead of letting him do his greatest hits? Two things I keep getting stuck on and I'd like at least two or three questions on each:

  1. Are those really the same move? With Darwin, something mindless in the world really is doing the work — selection happens whether or not anybody's watching. With Turing, it feels like we've just agreed to stop asking about understanding and look at behaviour instead. One of those is a discovery about the world, the other might just be a change of subject, and if that's right then the whole two-reversals thing is rhetoric, not argument.

  2. Say comprehension is nothing over and above a very fancy kind of competence. Then I can't see how I'm different from the machine, and yet I do feel like I actually get things. If instead it's something extra on top, what is the extra thing, and how would we ever tell whether a system has it?

  And here's a case I made up that I want to put to him: a Go program that beats everyone and, when it loses, writes a fluent little essay explaining its mistake — except if you rip out the essay part and swap in a random-text generator, it plays exactly the same. Does the essay give it comprehension, or is that a competence without comprehension riding on top of another one? And whichever way he answers, what does it tell us about whether comprehension has to be doing any real work?

  Give me a follow-up for each question that assumes the answer he's most likely to give, so I'm not left standing there with my mouth open.

  One more thing: please seperate the parts where people who actually work on this stuff agree from the parts where they're just taking sides. I don't want to nod along to something that turns out to be one camp's position dressed up as the obvious truth.
