      *   **(3) Russellian Monism/Panpsychism:** Phenomenal/proto-phenomenal properties are fundamental and ubiquitous. No emergent "matter-ing."
          *   *Critique:* This is the metaphysical commitment. The "proto-" qualifier is crucial here.
      *   **(4) Inference to Micro-Suffering:** Combining (1), (2), and (3). If fundamental entities have phenomenal properties, and those properties carry intrinsic badness, then fundamental entities suffer.
