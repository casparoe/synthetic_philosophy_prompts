answer: |-
  Here is the principle that fits your verdicts, followed by the analysis you requested.

  ### The Principle of Referential Stability and Cognitive Integration

  **1. Semantic Reference:** A proper name refers to the object connected to that name by a causal-historical chain of usage. Associated descriptions (beliefs about the object) do not fix the reference, though they may accompany the name in the speaker's mind.

  **2. Truth Conditions:** An identity statement '$a = b$' is true if and only if the referent of '$a$' is identical to the referent of '$b$'. If true, it is necessarily true; there is no possible world where the referents are distinct.

  **3. Cognitive Informativeness:** An identity statement is informative to a subject $S$ if and only if $S$ maintains two distinct **Cognitive Dossiers** (mental files of information), one keyed to '$a$' and one keyed to '$b$', which $S$ does not already know to be linked to the same object.

  **4. Subject Matter of Discovery:**
  *   The discovery is **about the object** if merging the two dossiers adds non-linguistic properties to $S$'s conception of the referent (e.g., new biographical facts, new capacities).
  *   The discovery is **about the names** if the two dossiers already contain identical non-linguistic properties, and merging them serves only to link two linguistic labels to a single, already fully-conceived object.

  ***

  ### How the Principle Fits Your Cases

  **Case (i) & (vi): The Distinction between Object and Names**
  *   **Force:** These two cases force **Clause 4**.
  *   **Explanation:** In (i), the reader has a "Marsh" dossier (contains: wrote novel) and a "Halloway" dossier (contains: subject of bio). Neither dossier is complete. Merging them adds the bio facts to the Marsh file and novel facts to the Halloway file. This enriches the conception of the *person*. In (vi), the omniscient colleague has a "Woman" dossier (contains: all facts). She has tags "Marsh" and "Halloway" but doesn't know which tag sticks to the "Woman" dossier. Merging them does not add facts about the woman (she knows them all); it only links the tags. Thus, (i) is about the person; (vi) is about the names.

  **Case (ii): The Flatness of Repetition**
  *   **Force:** This forces **Clause 3**.
  *   **Explanation:** Once the reader learns the identity, the "Marsh" and "Halloway" dossiers are merged into one. Hearing the sentence again accesses a single dossier. No integration occurs.
  *   **Addressing your impulse:** You feel the sentences are different because the *cognitive context* is different. The principle validates your intuition that the *event* is different while maintaining that the *sentence* (semantic content) is the same. The sentence is a tool for integration; if integration is complete, the tool has no work to do. It is the same key, but the lock is already open.

  **Case (iii): Vance is Ruth (No Descriptions)**
  *   **Force:** This forces **Clause 1** and **Clause 3**.
  *   **Explanation:** Reference is fixed by the causal chain (office usage vs. gym usage), not by descriptions (since there are none). The new hire has two dossiers ("Office Person" vs. "Gym Person"). Learning the identity merges them, correcting the false assumption that there are two objects. This confirms that empty or thin dossiers still count as distinct "ways of reaching" the object.

  **Case (iv): False Descriptions (Novels vs. Essays)**
  *   **Force:** This forces **Clause 1** and **Clause 4**.
  *   **Explanation:** Reference succeeds despite false beliefs (Clause 1). The sentence is true because the woman exists and bears both names. However, the *surprise* is different from (i) because merging the dossiers creates a conflict (Writes *only* novels vs. Writes *only* essays). The subject must discard false predicates to integrate the files. In (i), predicates are added; in (iv), predicates are corrected. This explains the qualitative difference in the surprise.

  **Case (v): Ashby and the Cathedral**
  *   **Force:** This forces **Clause 1**.
  *   **Explanation:** Your draft principle ("two different ways of reaching") fails here because the traveller *does* have two ways of reaching (Sign vs. Description), but they reach *different towns*. "Ashby" refers to Town A (causal chain from sign). "Town with cathedral" refers to Town B (satisfaction of description). Since $A \neq B$, the sentence is false (Clause 2). Because it is false, it cannot be learned as truth; it merely rehearses an error in the dossier. This repairs the vulnerability in your draft.

  **Case (vii): Necessity**
  *   **Force:** This forces **Clause 2**.
  *   **Explanation:** Since reference is fixed to the actual object, and identity is necessary, there is no world where the woman is two people. The informativeness arises from the subject's ignorance, not from metaphysical contingency.

  ***

  ### Predictions for Unlisted Cases

  1.  **The Double-Named Cat:**
      *   **Scenario:** A man names a cat "Fluffy," forgets, names it "Spot." Learns $F = S$.
      *   **Prediction:** This is **informative**, but the subject matter is **mixed**.
      *   **Reasoning:** He has two dossiers ("Fluffy" and "Spot"). Unlike the omniscient colleague (vi), he does *not* know "all facts." He likely believes there are two cats. Merging the dossiers corrects an ontological error (there is one cat, not two). Therefore, like (i), it is about the *world* (the number of animals), not just the names. However, since he has no descriptive differences (both are "the cat I named"), the discovery feels more like (vi) than (i). It is a discovery about the *history of his own naming acts* which entails a fact about the cat's cardinality.
      *   **Verdict:** Informative as in (i) (corrects a false belief about the world), but with the linguistic flavor of (vi).

  2.  **The Demonstrative Case ("That woman is Dr. Vance"):**
      *   **Scenario:** Subject sees Ruth (Demo) and knows "Dr. Vance" (Name) from letters.
      *   **Prediction:** Highly **informative** and **about the person**.
      *   **Reasoning:** The subject has a Perceptual Dossier (visual data, location) and a Correspondence Dossier (professional data, reputation). These are distinct cognitive routes. Merging them links appearance to reputation. This is a classic case of expanding the conception of the object, fitting Clause 4 (Object).

  ***

  ### Which Verdicts Cannot Be Kept?

  The principle keeps all your verdicts, but it requires one slight clarification on **Case (ii)**.
  You wrote: *"I have a stubborn impulse to say that the two moments contain different sentences. I think the impulse is indefensible, but I would like it addressed."*
  The principle declares this impulse **incorrect regarding semantics, but correct regarding psychology.** The sentence (the string of words and its truth conditions) is identical. The *cognitive act* is different. If you insist the sentences are different, you break Clause 2 (Truth Conditions) because you would have to say the sentence changes truth-value or content over time, which contradicts your own view that "it is true in exactly the same circumstances." You must sacrifice the idea that the *sentence* changes to save the idea that the *discovery* changes.

  ***

  ### Confidence and Weakest Point

  **Confidence Level:** High (90%).
  The principle successfully unifies the causal theory of reference (for truth) with a file-based theory of mind (for informativeness) without invoking abstract "senses." It cleanly separates *what makes it true* from *what makes it news*.

  **The Weakest Point:** **Clause 4 (Subject Matter of Discovery).**
  The boundary between "about the object" and "about the names" is slightly fuzzy in edge cases. In Case (vi), the omniscient person learns that "Marsh" and "Halloway" are co-referential. Is knowing that a person has two names a fact about the *names* or a fact about the *person*?
  *   My principle says "names" because the non-linguistic properties are already known.
  *   However, one could argue that "having two names" is a property of the person.
  *   I prioritize your verdict (it is about the names) by defining "properties" as *non-linguistic* predicates (wrote novels, lives in London). If you decide that "bearing the name Marsh" is a property of the person, Clause 4 collapses, and (vi) becomes about the person after all. I am least sure that this linguistic/non-linguistic distinction is robust enough to bear the weight of the (i) vs. (vi) difference, though it is the only way to preserve your specific intuition there.
