      Hello everyone. Grandpa loved this church. He prayed every day. I study philosophy, I ask questions. He didn't. He just lived it. I don't believe exactly what he believed. But I can use his words today. Not to say I believe them, but to honor him. When we say "Rest in Peace," I am saying it *with* him, using his voice. His peace was real. We saw it. That is what remains. Thank you.

