answer: |-
  Good morning. For those of you who don't know me, I am his grandson. I have spent a great deal of my life in classrooms, studying questions that are often far away from the quiet certainty of this parish. But today, I am not here as a student. I am here as a boy who watched his grandfather pray.

  If you knew him, you knew the rhythm of him. It was the sound of rosary beads clicking against a thumb, worn smooth by decades of touch. It was the back of a head bowed in this pew, morning after morning, regardless of the weather or the news. He was devout in the old way. He did not treat his faith as a theory to be tested, or a hypothesis to be defended over coffee. He did not argue for God. He simply lived toward Him.

  I have spent the last few years thinking deeply about how we speak about faith. And I have come to understand that for a man like my grandfather, religious words were not descriptions of a distant reality. They were the tools he used to build a life. They were the ground he walked on. To ask him for evidence of his faith would have been like asking a dancer for evidence of the music. He moved because the music was playing. He prayed because the grace was there.

  I stand before you today with a different map of the world than he had. I do not share his certainty about what lies beyond the veil. And in a room like this, filled with the people who shared his certainty, that difference could feel like a wall. But I have realized that a eulogy is not a place for building walls. It is a place for bridging them.

  There is a distinction, often overlooked, between asserting a truth and joining in a song. If I were to stand here and claim I know he is in heaven, I would be asserting a fact I cannot verify. That would be dishonest to you, and to myself. But if I stand here and say, "Eternal rest grant unto him, O Lord," I am not making a claim about the mechanics of the afterlife. I am taking up his words. I am speaking *with* him, not just *about* him.

  I am borrowing the language that formed him, because it is the only language large enough to hold the memory of who he was.

  When we say he is "at peace," we are not necessarily making a geographical claim about his soul's current location. We are describing the quality of the life we witnessed. We saw the peace he carried. We saw how the prayers smoothed out the anxieties of the world before they could reach his heart. We saw how the ritual of Mass anchored him when the rest of us were drifting. That peace was real. We touched it. We were near it. And in remembering him, we are asked to carry a piece of that peace forward.

  To my aunts and uncles, and to this community who sustained him: I know that when you pray for him, you are doing work that matters. You are continuing the rhythm he loved. I cannot pray with the same intention as you, but I can stand in the silence you make, and I can honor the direction of your gaze. I can see that where he looked, he found light. And even if I do not look at the same sky, I can respect the light that hit his face.

  There is a comfort in this, I think. It suggests that we do not need to agree on the architecture of the universe to agree on the value of a human life. His life was valuable because it was faithful. It was sturdy. It was kind. The words of this funeral—the psalms, the prayers, the commendation—are his inheritance. He spent a lifetime polishing them. Today, I am handing them back.

  I will not pretend to know where he is now. But I know where he was. He was here. He was in this chair. He was at this altar. He was in the quiet corners of our house, muttering thanks for a meal or a sunny day. And in that sense, he is not gone. A pattern of life does not simply vanish when the breathing stops. The way he taught us to be steady, the way he taught us to show up, the way he taught us to trust—that is still active. It is working in this room. It is working in me.

  So, I will use his words one last time, not as a claim of my own, but as a gift to him.

  *Requiem aeternam dona ei, Domine.*
  Grant him eternal rest, O Lord.

  Not because I can prove he needs it, or that you can deliver it. But because he trusted you to. And because, for seventy years, those words were the home he lived in. It feels wrong to evict him now.

  Let us let him rest in the language he loved. Let us let him be held by the promises he kept. And let us, who remain, try to find a fraction of the steadiness he showed us, whatever name we give to the source of it.

  Thank you.
