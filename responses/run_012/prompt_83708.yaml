      *   **The Speaker's Position (The Tightrope):** Acknowledge the difference in belief without making it a conflict. Use the "saying it with him" concept.
      *   **The Comfort/Consolation:** Shift from metaphysical claims to the impact of his life on the living. The "peace" he found is visible in how he lived, not necessarily where he is now.
      *   **Closing:** A return to the community, handing back the words, a final farewell.

