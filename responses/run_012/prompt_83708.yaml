      *   *The Philosophical Pivot (Subtle):* I need to address the elephant in the room (my lack of faith) without making it about me. The key is the distinction between *asserting* and *joining*. I can speak his words not because I verify them, but because they belong to him.
      *   *Drafting the "Wittgensteinian" move:* "There are words I cannot claim as my own discovery, but I can hold them because they were his." "I stand here not to verify the promise, but to witness the life that lived inside it."
