prompt: |-
  I'm a PhD student in philosophy (history of analytic philosophy, mostly), and a friend of mine who reads alot of popular philosophy gave me a summary of Ayer's views on life after death that I want to check. She's smart and usually reliable, but I read Language, Truth and Logic years ago and some of the later stuff, and I'm fuzzy enough that I definately don't want to correct her if I'm the one misremembering. What she said was roughly this: "Ayer's whole verificationist thing meant he had to say that any talk of an afterlife is literally meaningless — you can't verify what happens after you die, so 'there is life after death' isn't even a claim that could be true or false. And since he thought the self was just a bundle of experiences, there was no persisting thing to survive anyway. Then, ironically, he had that near-death experience in 1988 where he saw a red light and two figures who told him he had to go back, and after that he basically changed his mind and thought consciousness might survive death after all — he said the experience convinced him there was something beyond, even though he'd spent his career denying it."

  Can you go through her summary sentence by sentence and tell me what a careful reader of Ayer would accept, what they'd wince at, and what's just wrong? I'm particularly curious whether the verification principle really does rule out afterlife claims as meaningless in Ayer's own view (I have a nagging feeling he treated survival as an empirical hypothesis rather than a metaphysical pseudo-problem, but I might be making that up), whether his bundle theory of the self commits him to saying survival is incoherent, and how much his near-death experience actually changed his position — did it really make him think there might be something after death, or is that an overreading? And does the moral she draws — that his own experience refuted his philosophy, or at least showed the verificationist project collapsing under its own weight — follow from anything true in the summary, or is that just a nice narrative?
