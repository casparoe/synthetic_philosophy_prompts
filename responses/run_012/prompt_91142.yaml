answer: |-
  # Seminar Plan: The Threshold Exercise

  **Topic:** Aggregation of Harms (The "Torture vs. Dust Specks" Puzzle)
  **Time:** 90 Minutes
  **Students:** 14
  **Materials:** Whiteboard + markers, Index cards (1 per student), Pen per student, Stack of 200 identical tokens (or paper clips), Timer (phone).
  **Room Prep:** Open windows if possible. Arrange chairs in a tight circle to increase social pressure.

  ---

  ## I. The Apparatus

  ### 1. The Core Mechanism: The Threshold ($T$)
  The group must determine a single integer $T$.
  *   **Scenario:** Option A is one person suffering a "Severe Harm" (Torture). Option B is $N$ people suffering a "Minor Harm" (Speck).
  *   **Rule:** If $N < T$, the group chooses Option A (Severe Harm to 1). If $N \ge T$, the group chooses Option B (Minor Harm to $N$).
  *   **Constraint:** $T$ must be a specific number (e.g., 5,000,000) or the symbol $\infty$ (Lexical View: Severe Harm is *never* preferable). No ranges, no "it depends."

  ### 2. Roles
  *   **Instructor (Facilitator):** Enforces time, rules, and probes. Does not offer moral guidance.
  *   **Scribe (Student Volunteer):** Writes the agreed $T$ on the board.
  *   **Timekeeper (Student Volunteer):** Signals 5-minute warnings.

  ### 3. The Real-World Proxy Task
  To make the commitment binding, the group's $T$ dictates how the final 10 minutes are spent.
  *   **Option A (The "Torture" Proxy):** One volunteer stands at the front of the room and sorts 100 tokens into piles of 5 for 10 minutes. (Dull, physically taxing, socially isolating).
  *   **Option B (The "Speck" Proxy):** Everyone else (13 students) sits and sorts 5 tokens into piles of 1 for 10 minutes. (Trivial, barely noticeable).
  *   **Volunteer Clause:** If the math dictates Option A, a volunteer *must* step forward. If no one volunteers, the group defaults to Option B (collective failure of principle).

  ---

  ## II. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Framing & Private Commitment
  *   **Action:** Hand out index cards.
  *   **Script:** "We are not discussing theory today. We are making a policy decision. Imagine a Severe Harm (50 years torture) and a Minor Harm (dust speck in eye). You must set a threshold $T$. If the number of speck-victims is below $T$, we allow the torture. If at or above $T$, we inflict the specks.
  *   **Constraint:** "You cannot write 'it depends.' You cannot write 'undefined.' Write a number or write $\infty$. Sign the card. This is your private vote."
  *   **Collection:** Collect cards. Do not look at them yet.

  ### 00:10 – 00:30: Public Negotiation (The "One Number")
  *   **Action:** Students stand. Whiteboard is blank.
  *   **Task:** "You have 20 minutes to agree on *one* number for the group. You may form factions, but the Scribe will only write one number. If you fail to agree by the timer, I will calculate the **Median** of your private cards and that becomes the binding $T$."
  *   **Why this works:** The threat of the Median (which might be embarrassing to some) forces negotiation. It prevents filibustering.
  *   **Instructor Role:** Silent observer. Only intervene if rules are broken (e.g., someone says "it depends").

  ### 00:30 – 00:50: The Probes (The "Squeeze")
  *   **Action:** Scribe writes the agreed $T$ on the board. Everyone sits.
  *   **Script:** "The number is set. Now I will test it. You must answer as a group. If you contradict your $T$, you must revise it."
  *   **Probe 1 (The Finite Squeeze):** *If $T$ is finite (e.g., 1 billion).* "If 1 billion specks justify stopping the torture, does 1 billion and 1? If yes, why is the line at 1 billion? If no, is one speck worth 50 years of agony?"
  *   **Probe 2 (The Infinite Squeeze):** *If $T$ is $\infty$.* "Imagine a trillion trillion people. Each speck causes a micro-flinch. Would you truly let the trillion trillion flinch to save one person 50 years? Is there *no* quantity of flinching that outweighs a life?"
  *   **Probe 3 (The Trade):** "Would you shave one *hour* off the torture to save 10 people from the speck? If yes, you are trading. If you trade, you have a price. If you have a price, you have a threshold."
  *   **Rule:** Students cannot say "That's not the question." They must answer Yes/No relative to their $T$.

  ### 00:50 – 01:00: Revision Round (The "Cost")
  *   **Action:** Pass out new cards.
  *   **Script:** "You may change the number. But to move the number, the person proposing the change must state aloud: 'To move $T$ from X to Y, we are abandoning the intuition that [Z].'"
  *   **Example:** "To move $T$ from 1 million to $\infty$, we are abandoning the intuition that small harms can add up."
  *   **Goal:** Make the philosophical cost explicit.

  ### 01:00 – 01:10: The Real-World Application
  *   **Action:** Reveal the Proxy Task.
  *   **Math:** Class size $N = 13$ (excluding volunteer).
  *   **Logic:**
      *   If Group $T \le 13$: The specks (13 people) outweigh the torture. **Choice:** Option A (One volunteer sorts 100 tokens).
      *   If Group $T > 13$: The specks (13 people) do not yet outweigh the torture. **Choice:** Option B (Everyone sorts 5 tokens).
  *   **Execution:**
      *   If Option A wins: Ask for a volunteer. If none, declare "Principle Collapsed" and do Option B.
      *   If Option B wins: Everyone sorts.
  *   **Atmosphere:** Silence. No talking during sorting. Instructor times it strictly.

  ### 01:10 – 01:30: Debrief & Naming
  *   **Action:** Stop task. Sit.
  *   **Mapping:**
      *   "When you fought over the number, you were fighting over **Aggregation**."
      *   "When you refused to give a number, you were arguing for **Lexical Priority**."
      *   "When you felt sick choosing Option A (One volunteer), you felt the **Repugnant Conclusion**."
      *   "When you felt sick choosing Option B (Everyone suffers), you felt the **Absurdity of Non-Aggregation**."
  *   **Naming:** Now introduce Parfit, Utilitarianism, Deontology, etc.
  *   **Closing:** "The machinery you used comfortably last week just made you choose between making one person suffer or making everyone suffer for a trivial reason. Keep that feeling."

  ---

  ## III. Troubleshooting: Predictable Failures

  **1. The "Speck is Zero Harm" Objection**
  *   *Prediction:* A student argues a dust speck is negligible, so $N$ can be infinite without mattering.
  *   *Handling:* Pre-empt in Framing. "Define the Speck as a distinct, negative, conscious experience. Annoying, not blinding. If you claim it is zero, you are rigging the math. Assume it is $>0$."
  *   *If they persist:* "If it is truly zero, then 1 trillion specks is still zero. Are you willing to bet the torture on the claim that annoyance does not accumulate *at all*?"

  **2. The "Fatal Accident" Objection**
  *   *Prediction:* "A speck could cause a crash that kills everyone."
  *   *Handling:* "Bracket causal chains. Assume a sterile universe. The harm is *only* the sensation of the speck. If you rely on downstream effects, you are changing the puzzle."

  **3. The Unanimity Deadlock**
  *   *Prediction:* They cannot agree on one number in the 20-minute negotiation.
  *   *Handling:* Enforce the **Median Fallback**. "Time is up. I am calculating the median of your private cards." This usually panics them into agreement just before the deadline.
  *   *Why:* It prevents the "filibuster on expressibility" where they argue numbers can't capture morality.

  **4. The "Finite Threshold is Inexpressible" Filibuster**
  *   *Prediction:* "Morality isn't math. I can't write a number."
  *   *Handling:* "You don't have to believe morality is math. You have to operate the machine. Write $\infty$ if you must, but write *something*. A blank card counts as a vote for the Median."

  **5. The "Volunteer Refusal" (Real-World Task)**
  *   *Prediction:* Option A wins (One person suffers), but no one stands up.
  *   *Handling:* This is a feature, not a bug. "The group chose a principle that requires sacrifice. No one is willing to sacrifice. The principle is therefore hollow." Record this in the debrief. It demonstrates the gap between abstract commitment and action.

  ---

  ## IV. Limitations & Confidence

  **Confidence Level:** 85%
  This design will produce the *experience* of the puzzle. The social pressure of the circle, the binding commitment, and the physical task prevent the "brisk 40 minutes of arguing" you fear. The Median Fallback ensures forward momentum.

  **What This Cannot Reproduce:**
  *   **The Scale:** 13 students is not an astronomical number. If they choose $T = 1,000,000$, the Real-World Task will default to "Everyone does the short task." This feels anticlimactic.
      *   *Mitigation:* In the debrief, explicitly highlight this. "Your number was so high that this room couldn't test it. Imagine this room was a stadium. Would you still choose the short task then?"
  *   **The Stakes:** Sorting tokens is not torture. Students may treat it as a game.
      *   *Mitigation:* Your demeanor must be deadly serious. Do not smile during the sorting phase. Treat the tokens as if they were minutes of agony.

  **The Weakest Design Decision:**
  *   **The Real-World Scaling.**
  *   *Why:* As noted, if the group settles on a utilitarian $T$ (e.g., 1 billion), the class task becomes trivial (everyone does 5 tokens). The "Torture" option (1 person does 100 tokens) will almost never trigger unless they adopt a Lexical View or very low threshold.
  *   *If it fails:* If the task feels trivial because $T \gg 13$, pivot the debrief immediately to the *hypothetical*. "Your $T$ saved us from the task today. But it means if this class were 1 billion strong, you would condemn the volunteer to 100 minutes of sorting. Look at the volunteer. Are you willing to condemn them then?"
  *   *Change if needed:* If you sense the task is too trivial, **adjust the ratio** mid-stream before the task starts. "Given your high $T$, I am scaling the task. Option A is now 1 person for 60 minutes. Option B is everyone for 5 minutes." This keeps the *proportion* aligned with their $T$ relative to class size. (Use this only if the energy dips).

  ---

