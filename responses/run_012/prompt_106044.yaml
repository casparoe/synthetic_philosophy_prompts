  # The Metaphysics of Laws: A Decision Tree

  **Starting Point:** We accept that our best scientific theories state laws, and that the world contains a vast arrangement of particular, non-modal facts (positions, momenta, charges, etc.).

  **Instructions:** Begin at **Node 1**. Answer the question based on your metaphysical intuitions about how the world is, not on which philosopher you prefer. Follow the arrow to the next node or to a **Leaf**.

  ---

  ### Node 1: Supervenience
  **Question:** Does the total arrangement of particular, non-modal facts *fix* what the laws are? (i.e., If you created a universe with the exact same history of particular events, *must* it have the exact same laws, or could the laws differ while the history remains identical?)
  *   **Yes (The facts fix the laws):** Go to **Node 2**.
  *   **No (The laws outrun the facts):** Go to **Node 4**.

  ### Node 2: Humean Explanation
  **Question:** Given that the facts fix the laws, does the concept of a "law" explain *why* the events happen, or does it merely name the pattern that the events form?
  *   **Merely names the pattern:** Go to **Node 3**.
  *   **Explains why they happen:** Go to **Leaf U1 (Unoccupied)**.

  ### Node 3: Humean Criterion
  **Question:** Is a law simply *any* true universal generalization about the facts, or must it play a specific theoretical role (like summarizing the data efficiently)?
  *   **Any true generalization:** Go to **Leaf A**.
  *   **Specific theoretical role:** Go to **Node 3b**.

  ### Node 3b: Humean Existence
  **Question:** Is that theoretical role robust enough to say "laws exist," or is the word "law" just a convenient shorthand we should ideally discard?
  *   **Discard it:** Go to **Leaf B**.
  *   **Laws exist (as summaries):** Go to **Leaf C**.

  ### Node 4: Anti-Humean Governance
  **Question:** Since the laws outrun the particular facts, do the laws *constrain* or *produce* the facts (governance), or do they merely track a modal connection that holds between them?
  *   **Merely track connection:** Go to **Leaf U2 (Unoccupied)**.
  *   **Constrain/Produce (Govern):** Go to **Node 5**.

  ### Node 5: Source of Modality
  **Question:** Where does the power to govern come from? Is it located *within* the natures of the properties themselves, or does it come from *outside* them (an external relation or brute fact)?
  *   **Within the properties:** Go to **Node 6**.
  *   **Outside the properties:** Go to **Node 7**.

  ### Node 6: Internal Modality
  **Question:** If the power is within the properties, could those properties have existed without producing these specific laws?
  *   **No (Laws are necessary):** Go to **Leaf D**.
  *   **Yes (Laws are contingent):** Go to **Leaf U3 (Unoccupied)**.

  ### Node 7: External Grounding
  **Question:** Is the external source of the law a *relation* holding between properties, or is the law itself a *primitive* structural feature of reality?
  *   **A relation between properties:** Go to **Leaf E1**.
  *   **A primitive feature:** Go to **Leaf E2**.

  ---

  ## The Leaves (Positions)

  ### Leaf A: Naive Regularity Theory
  *   **Most Awkward Commitment:** It implies that any accidental uniformity (e.g., "all gold spheres are less than 1km wide") is a law if it happens to be true.
  *   **Necessity/Contingency:** Contingent.
  *   **Spirit:** Humean.

  ### Leaf B: Eliminativism
  *   **Most Awkward Commitment:** It requires asserting that scientific theories are literally false or misleading when they claim to state laws.
  *   **Necessity/Contingency:** N/A (No laws).
  *   **Spirit:** Humean.

  ### Leaf C: Best-System Analysis (Ramsey–Lewis)
  *   **Most Awkward Commitment:** It makes the laws partially dependent on human standards of simplicity and balance in systematization.
  *   **Necessity/Contingency:** Contingent.
  *   **Spirit:** Humean.

  ### Leaf D: Dispositional Essentialism
  *   **Most Awkward Commitment:** It entails that the fundamental properties of the world could not have been different (loss of modal freedom).
  *   **Necessity/Contingency:** Metaphysically Necessary.
  *   **Spirit:** Anti-Humean.

  ### Leaf E1: Governing/Necessitation View (DTA)
  *   **Most Awkward Commitment:** It posits a "Necessitation" relation between universals that is notoriously difficult to define without circularity.
  *   **Necessity/Contingency:** Contingent.
  *   **Spirit:** Anti-Humean.

  ### Leaf E2: Primitivism (Maudlin)
  *   **Most Awkward Commitment:** It accepts laws as fundamental brute facts that have no explanation in terms of anything else (no grounding).
  *   **Necessity/Contingency:** Contingent.
  *   **Spirit:** Anti-Humean.

  ### Leaf U1: Humean Governance (Unoccupied)
  *   **Status:** **Incoherent.** If the particular facts fix the laws, the laws cannot turn around and govern the facts without circularity.
  *   **Note:** This position tries to have Humean supervenience with Anti-Humean direction of fit.

  ### Leaf U2: Non-Governing Anti-Humeanism (Unoccupied)
  *   **Status:** **Unattractive.** If laws outrun the facts but do not govern them, they become epiphenomenal "danglers" that do no explanatory work.
  *   **Note:** Rarely defended; usually collapses into Humeanism or Primitivism.

  ### Leaf U3: Contingent Dispositionalism (Unoccupied)
  *   **Status:** **Unexplored/Unstable.** If the power is in the essence of the property, it is difficult to see how that power could be contingent without ceasing to be essential.
  *   **Note:** Most essentialists opt for necessity to secure the link.

  ---

  ## Pedagogical Notes for the Seminar Leader

  ### 1. Indistinguishable Leaves
  **The Pair:** **Leaf E1 (Governing/Necessitation)** and **Leaf E2 (Primitivism)**.
  **The Problem:** While Node 7 attempts to separate them by asking about "Relations vs. Primitives," students often find these positions functionally identical in the logical space generated by the previous questions. Both are Anti-Humean, Governing, Contingent, and Externally sourced. A student might answer Node 7 arbitrarily without grasping the deep ontological difference between a *relation* (which requires relata/universals) and a *sui generis* constraint (which does not).
  **The Further Question:** To genuinely pull them apart, ask: *"Does the law require the existence of universals to relate, or is the law a fundamental constraint that properties must obey regardless of their ontological category?"* (DTA requires universals; Primitivism does not).

  ### 2. Navigating the Unoccupied Space
  Use **Leaf U1** and **Leaf U2** to test student consistency. If a student claims to be Humean (Node 1: Yes) but insists laws explain the regularities (Node 2: Explains), guide them to U1 and ask them to resolve the circularity. If a student claims laws are distinct entities (Node 1: No) but deny they govern (Node 4: Track), guide them to U2 and ask what work the laws are doing.

  ### 3. Time Management
  This tree contains **7 Nodes** and **9 Leaves**. In a one-hour seminar:
  *   Spend 10 minutes on the Starting Point and Node 1 (The Humean/Anti-Humean split is the major divide).
  *   Spend 20 minutes walking through the Humean branch (Nodes 2 & 3), as this is where most scientists' pre-theoretic intuitions lie.
  *   Spend 20 minutes on the Anti-Humean branch (Nodes 4–7), focusing on the "Governance" intuition.
  *   Reserve 10 minutes for the "Indistinguishable Leaves" discussion, using it to show that metaphysical precision often requires digging deeper than the first few layers of modal intuition.
