      *   The tension is between **Causal Decision Theory (CDT)** and **Evidential Decision Theory (EDT)** / **Functional Decision Theory (FDT)** / **Superrationality**.
      *   *CDT:* Focuses on causal impact. $P(Result | Do(Action))$. My choice doesn't causally change yours. Defect is dominant.
      *   *EDT/Superrationality:* Focuses on correlation/evidence. $P(Result | Action)$. If I am rational, and you are rational, and we face the same problem, our outputs are correlated. Holding out is evidence others will hold out.
      *   *The User's Insight:* The disagreement isn't about the world (physics/causality) but about the *reference class* of the decision. What counts as "my decision"? Is it a token event in spacetime (CDT) or an instance of an algorithm (FDT/Superrationality)?

  3.  **Address Question 1: Substantive vs. Verbal?**
      *   It's often dismissed as verbal ("You're defining 'rational' differently").
      *   However, if "rationality" is prescriptive (what should I *do*), then the definition matters for action.
      *   It's better characterized as a **framework disagreement**. It's like asking "Is a hotdog a sandwich?" If you care about culinary taxonomy, it's verbal. If you care about health codes or restaurant pricing, it's substantive.
      *   Here, the stakes are coordination. If everyone adopts the "superrational" frame, they get the cooperative payoff. If everyone adopts the "causal" frame, they get the defect payoff.
