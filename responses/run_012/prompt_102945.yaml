answer: |-
  Your hypothesis is exceptionally sharp. You have identified the precise fault line where the debate stalls: the **individuation of the decision problem**. The inertia you describe arises because the two sides are not disagreeing about the world (the causal structure, the payoffs), but about the *ontology of the agent* within that world.

  Here is a diagnosis of the impasse, structured around your three questions.

  ### 1. Substantive Disagreement or Verbal Equivocation?

  It is neither purely substantive nor purely verbal; it is a **framework disagreement**.

  In a verbal dispute, parties agree on the facts but use words differently (e.g., "Is a hotdog a sandwich?"). In a substantive dispute, parties disagree on the facts (e.g., "Will holding out cause the landlord to concede?").

  In the superrationality debate, both sides agree on the physical facts: *My physical movement does not causally compel your physical movement.* However, they disagree on what constitutes the **unit of agency**.
  *   **The Causal View (your economist friend):** The decision problem is individuated by **spacetime location**. "My decision" is a token event in my brain at time $t$. Since token events in distinct brains are causally isolated, correlation is irrelevant to rational choice.
  *   **The Superrational View (your collective):** The decision problem is individuated by **logical structure**. "My decision" is the output of an algorithm. If you and I are rational agents facing identical inputs, we are running the same function. Therefore, "my decision" and "your decision" are logically linked, even if causally isolated.

  Because they disagree on what "my decision" refers to, they are answering different questions. The economist asks, "Which action causally maximizes utility?" The superrationalist asks, "Which algorithmic output, if universalized across instances of this reasoning, maximizes utility?"

  **Diagnosis:** The disagreement is substantive *relative to a goal*, but verbal *relative to definitions*. If the goal of "rationality" is defined as "causal efficacy," the economist wins. If the goal is "outcome optimization via logical correlation," the superrationalist wins. The impasse persists because neither side acknowledges that "rationality" is a functional concept requiring a prior definition of the agent's boundaries.

  ### 2. Is Superrationality Truth-Apt Prior to Individuation?

  No. Superrationality is not a proposition about the world that can be true or false in isolation; it is a **normative conditional**.

  It effectively states: *If* you conceive of your agency as an instance of a logical pattern rather than a localized physical event, *then* cooperation is the rational choice in a Prisoner's Dilemma.

  Until the prior question of individuation is settled, the claim lacks a truth value because the subject term ("the rational agent") is ambiguous.
  *   Under **Causal Decision Theory (CDT)**, superrationality is false (it recommends a dominated strategy).
  *   Under **Evidential Decision Theory (EDT)** or **Functional Decision Theory (FDT)**, superrationality is true (it correctly accounts for logical correlations).

  The "inert quality" you observe stems from the fact that proponents often present superrationality as a discovery about the world (like gravity), when it is actually a proposal for how to model agency. Your friend rejects it because it violates causal ontology; you accept it because it respects logical ontology. Neither is "wrong" about the physics; you are disagreeing about the metaphysics of mind.

  ### 3. What Counts as Progress?

  Since this is a framework disagreement, a "proof" that one side is correct is unlikely. Progress requires shifting the terrain from **truth** to **utility** and **conditions**.

  **A. Distinguish Token from Type (The Distinction)**
  Progress begins by explicitly accepting your hypothesis: The debate is about whether decision problems are fixed by physical situation (token) or algorithmic evidence (type). Acknowledging this dissolves the "mystery." It clarifies that the superrationalist is not claiming magic causation, but rather betting on logical correlation.

  **B. Empirical Calibration (The Formal Result)**
  In your specific tenants' case, progress requires an empirical audit: *Are the tenants actually running the same algorithm?*
  Superrationality relies on the premise that the other agents are sufficiently similar to you that your reasoning predicts theirs. In a formal Prisoner's Dilemma with identical AI agents, this is true. In a tenants' collective, it is empirically dubious.
  *   **Progress:** A formal model that quantifies the **degree of logical correlation** required to make holding out rational. If the correlation is 99%, hold out. If it is 10% (because neighbors have different risk tolerances, values, or reasoning capabilities), defect. This moves the debate from "Is superrationality real?" to "How similar are we?"

  **C. Pragmatic Evaluation (The Change of Question)**
  Instead of asking "Which theory is true?", ask "Which decision theory yields better outcomes for agents who can pre-commit?"
  *   CDT agents are vulnerable to exploitation in Newcomb-like problems.
  *   Superrational/FDT agents achieve better coordination but risk error if the logical correlation assumption is false.
  *   **Progress:** Evaluating which framework is more **robust** in the real world. If adopting the superrational frame leads to better collective outcomes *even when* some agents defect (due to reputation effects or iterative games), then it is pragmatically superior, regardless of its causal ontology.

  ### Summary Diagnosis

  The impasse rests on your identified disagreement: **Physical Individuation vs. Algorithmic Individuation.**

  *   Your friend views the decision as a **causal lever**. Since your hand cannot move their hand, pulling the lever is useless.
  *   You view the decision as a **logical sample**. Since your code is their code, sampling your output predicts theirs.

  Superrationality cannot be true or false until you agree on what "you" are. Progress will not come from proving the physics wrong, but from determining under what empirical conditions logical correlation is strong enough to warrant the algorithmic view of agency. In your tenants' collective, the practical question is not whether superrationality is *true*, but whether you have enough evidence to believe your neighbors are running the same "software" you are. If you don't, the superrational argument is theoretically sound but empirically void.
