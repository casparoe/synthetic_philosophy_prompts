answer: |-
  You have correctly identified that neither the **Frame Problem** nor **Goodhart's Law** is the precise fit, though they are adjacent.

  *   **The Frame Problem** is logical/epistemological: *How do we represent what stays the same without listing every non-change?*
  *   **Goodhart's Law** is statistical/optimization: *When a measure becomes a target, it ceases to be a good measure.*

  Your observation is normative/teleological: *How do we define "change" without implicitly defining "value"?*

  In the specific subfield of **Impact Regularization** (the research area dealing with "low-impact" AI, pioneered by researchers like Stuart Armstrong, Alexander Turner, and Victoria Krakovna), the technical term for this is simply **"The Baseline Problem."**

  However, "The Baseline Problem" is a dry technical label. It doesn't capture the philosophical bind you described: that choosing the baseline *is* the alignment problem in disguise. There is no single, universally recognized proper noun (like "The Trolley Problem") for this specific recursive trap.

  So, following your instruction: I will coin a term that captures the structural bind, and then provide the carving you asked for.

  ### The Coinage: **The Normative Baseline Equivalence**

  **Definition:** The Normative Baseline Equivalence is the principle that **any attempt to minimize "impact" or "side effects" without explicit value specifications necessarily encodes those values in the choice of the counterfactual baseline.** Therefore, the difficulty of defining a "neutral baseline" is *equivalent* to the difficulty of solving the alignment problem itself.

  You cannot offload the hard work of value specification onto a "do nothing" or "low impact" constraint, because "nothing" and "impact" are defined by the values you were trying to avoid specifying.

  ---

  ### The Carving

  To understand why this is its own distinct category and not just "Frame" or "Goodhart," we need to look at what is **Inside** the carving and what is **Outside**.

  #### **Inside the Normative Baseline Equivalence**
  These are problems where the metric of success or safety relies on a *difference* between two states (Action vs. Baseline), and the selection of the Baseline determines the moral outcome.

  1.  **Impact Regularization:** Penalizing an AI for changing the state of the world. (As you noted: Is the chair moving a "task" or an "impact"? The baseline decides.)
  2.  **Side-Effect Minimization:** Rewarding an AI for achieving a goal while keeping other variables constant. (Which variables? The baseline decides.)
  3.  **The "Do Nothing" Default:** Assuming inaction is safe. (As you noted: Inaction during a fire is harmful. The baseline of "inaction" assumes the environment is benign, which is a value judgment.)
  4.  **Status Quo Bias in RLHF:** Training models to prefer outputs that don't deviate from human norms. (This encodes the values inherent in the "norm," even if those norms are unjust or unsafe.)
  5.  **Omission vs. Commission:** Legal or ethical frameworks where "harming" is punished more than "allowing harm." (This relies on a baseline where the agent is not responsible for the world's natural state.)

  #### **Outside the Normative Baseline Equivalence**
  These are safety problems where the harm is intrinsic or the baseline is physically fixed, not normatively chosen.

  1.  **Intrinsic Harm Constraints:** "Do not cause pain." (Pain is a physiological state, not a deviation from a baseline. If the AI causes pain, it violates the rule regardless of what the "null action" would have been.)
  2.  **Hard Physical Constraints:** "Do not exceed 100 degrees Celsius." (This is an absolute bound, not a relative change from a baseline.)
  3.  **Standard Goodhart Scenarios:** "Maximize paperclips." (Here the target is explicit. The problem is that the AI optimizes too well. In the Baseline Equivalence, the problem is that the *target itself* is hidden inside the definition of "change".)
  4.  **The Logical Frame Problem:** "How do I compute that the wall didn't turn blue?" (This is a computational cost issue. The Normative Baseline Equivalence is a *definition* issue. Even if you can compute the change perfectly, you still don't know if that change was *bad*.)

  ### Why This Distinction Matters

  The reason this bind stalls AI safety threads (as you observed) is that **"Low Impact" feels like a safety solution, but it is actually a value specification.**

  When researchers propose "Low Impact," they hope to avoid specifying *what* the AI should value (e.g., "human happiness"). They hope to instead specify *how much* the AI should change the world.

  The **Normative Baseline Equivalence** proves this is impossible.
  *   If you set the baseline to "the state of the world if the AI does nothing," you are valuing the **Status Quo**. (Bad if the status quo involves a fire, or injustice, or decay).
  *   If you set the baseline to "the expected normal course of events," you are valuing **Normalcy**. (Bad if "normal" includes human error, pollution, or conflict).
  *   If you set the baseline to "the state of the world if the AI acts optimally for humans," you have already solved **Alignment**. (Because you need to know what "optimally for humans" means to construct the baseline).

  ### Summary of the Bind

  1.  **Premise:** We want AI to be safe, so we tell it to "minimize impact."
  2.  **Requirement:** To measure impact, we must compare the AI's action to a **Baseline** (what would have happened otherwise).
  3.  **The Trap:** The choice of Baseline determines whether an outcome is counted as "impact" (bad) or "task" (good).
  4.  **The Equivalence:** Choosing the correct Baseline requires knowing which outcomes are valuable.
  5.  **Conclusion:** "Minimize Impact" is just "Maximize Value" written in disguise. You haven't bypassed the hard problem; you've hidden it in the counterfactual.

  This is why the thread you read ended with "nobody knows how to specify." They ran into the **Normative Baseline Equivalence**: they realized that specifying the impact measure was exactly as hard as specifying the goal itself.
