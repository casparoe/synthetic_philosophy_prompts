  3. "What it rules out"
  This setup rules out strict naturalism, which claims disease is solely biological malfunction independent of values. Under strict naturalism, homosexuality could not have been a disease and then simply become not one without biological discovery. Similarly, moving the BP cutoff without new biological data would be nonsensical; a body is either malfunctioning or it isn't. It also rules out strict normativism, which claims disease is whatever we decide is bad. If that were true, you would cover hearing aids for all age-related loss, since hearing loss is undesirable, and you would cover longevity drugs, since death is the ultimate harm. Your practice rejects the idea that all suffering is medical, and it rejects the idea that biology alone dictates coverage. It cannot live with a theory that demands absolute biological truth or one that demands unlimited accommodation of human desire. It also rules out moral models of disease. You cannot deny coverage because a condition is "sinful" nor grant it because a patient is "virtuous." The system requires a secular, functionalist view where the only sin is inefficiency. Any theory that demands consistency between biological fact and coverage status is incompatible with your reality.

