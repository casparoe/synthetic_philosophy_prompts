answer: |-
  This is a sophisticated pedagogical exercise. However, before analyzing the logic of your cases, we must address the scholarly accuracy of your "Track Record." Aquinas's texts (*De Regno* I.6, *Summa Theologiae* II-II, Q. 42 & Q. 64) are nuanced, and your summaries compress some contested interpretations into settled facts.

  Below is the breakdown required for your seminar: first, the scholarly reality check; second, the logical analysis of your specific cases; and third, the prediction and further testing.

  ### Part 1: Scholarly Reality Check (Settled vs. Contested)

  To teach this responsibly, you must distinguish between what Aquinas explicitly argues and where scholars disagree on his implications.

  **1. Settled Scholarship (Consensus)**
  *   **Private Tyrannicide is Forbidden:** Aquinas consistently argues that private individuals may not kill a ruler, even a tyrant, on their own authority. This is based on the prohibition of sedition and the risk of greater evil (Case 2 and 3 in your track record align well here).
  *   **Proportionality of the Common Good:** Aquinas employs a form of proportionality. If removing a tyrant risks greater turmoil (civil war, worse tyranny) than enduring him, one must endure him. This is not utilitarianism, but a commitment to the *ordo pacis* (order of peace).
  *   **Public Authority is Required for Deposition:** Removal of a ruler is an act of public justice, not private vengeance. It requires a superior authority (e.g., an Emperor over a King) or the body that originally appointed the king (the "multitude").

  **2. Contested Scholarship (Debated)**
  *   **The "Senate" in Case 1:** Aquinas does not mention a "Senate." He speaks of the "multitude" (*multitudo*) having the right to depose a king they installed. Whether a representative body (Senate) counts as this "multitude" acting publicly, or whether a "plot" (*conjuratio*) can ever be considered a public act, is debated. Some scholars argue Aquinas never sanctions *killing*, only *deposition*. Your Case 1 ("the killer would be honoured") is a strong reading of *De Regno* I.6, where he cites the killing of Domitian, but he frames it as the removal of a public enemy, not a private assassination.
  *   **Usurpers vs. Legitimate Rulers:** While Aquinas distinguishes between rulers who seize power by force (*invasores*) and those who inherit it, it is contested whether this distinction alone justifies private killing. Most scholars agree Aquinas still requires public authority to depose a usurper; he does not grant a "license to kill" to any private citizen simply because the ruler is a usurper.

  ---

  ### Part 2: Logical Analysis of the Track Record

  Treating your three cases as the "data set" for the exercise, we can deduce the implicit rules governing the verdicts.

  **The Variables:**
  *   **Origin:** Usurper (1, 4) vs. Legitimate (2, 3).
  *   **Authority:** Public/Senate (1) vs. Private/None (2, 3, 4).
  *   **Consequences:** Net Good (1) vs. Net Bad/Civil War (2, 3, 4).
  *   **Conduct:** Brutal Tyrant (1, 2) vs. Mild Tyrant (3) vs. Moderate/Good (4).

  **The Competing Rules:**
  Based on Cases 1–3, three rules fit the data equally well:
  1.  **The Public Authority Rule:** Killing is permissible *only* if authorized by a public body (Senate/Multitude). Private plots are always forbidden.
      *   *Fits Cases:* 1 (Yes), 2 (No), 3 (No).
  2.  **The Proportionality Rule:** Killing is permissible *only* if it results in less suffering than the tyranny.
      *   *Fits Cases:* 1 (Yes), 2 (No), 3 (No).
  3.  **The Substantive Tyranny Rule:** Killing is permissible *only* if the ruler is actively causing severe harm (Brutal).
      *   *Fits Cases:* 1 (Yes), 2 (Yes*), 3 (No).
      *   *(Note: Rule 3 fits Case 2 less well than the others, as Case 2 was "Brutal" but still "No." This suggests Rule 3 is insufficient on its own.)*

  **The Hidden Tension:**
  Case 1 introduces a fourth variable: **Usurpation.**
  *   **The Legitimacy Rule:** A usurper is liable to removal/killing in a way a legitimate ruler is not.
      *   *Fits Cases:* 1 (Usurper = Yes), 2 & 3 (Legitimate = No).

  ---

  ### Part 3: Prediction for Case 4

  **The Case:** Usurper + Private Plot + Bad Consequences (Civil War) + Moderate/Good Rule.

  **Aquinas's Verdict:** **Not Permissible.**

  **Reasoning:**
  Even though the ruler is a usurper (which weighs against him), two heavier weights pull toward "Not Permissible":
  1.  **Lack of Public Authority:** Following Case 1's contrast with Case 2, the absence of the "Senate" (public authority) is a disqualifier for private individuals.
  2.  **Proportionality (The Common Good):** Following Case 2 and 3, if the remedy (civil war) is worse than the disease, the act is forbidden.
  3.  **Functional Justice:** Since he rules moderately and the country is prosperous, he is not currently acting as a "tyrant" in effect, even if he is one in title.

  **Which Rule is He Implicitly Running?**
  Aquinas is primarily running a **Lexical Priority Rule**:
  1.  **Public Authority** is a necessary condition (Threshold).
  2.  **Proportionality** is a necessary condition (Threshold).
  3.  **Usurpation/Tyranny** is a sufficient condition *only if* 1 and 2 are met.

  In Case 4, both thresholds fail. Therefore, the Usurpation status does not trigger permission.

  ---

  ### Part 4: What Case 4 Pulls Apart & The Decisive Further Case

  Case 4 is excellent because it separates **Original Legitimacy** (Usurper) from **Functional Justice** (Good Rule) and **Consequences** (Bad Outcome).

  In Case 1, Usurpation, Bad Rule, Good Consequences, and Public Authority all aligned to "Yes."
  In Case 4, Usurpation aligns to "Yes," but Rule, Consequences, and Authority align to "No."

  If a student argues, "But he's a usurper! Case 1 said usurpers can be killed," they are prioritizing the **Legitimacy Rule** over the **Proportionality/Authority Rules.**

  **The Decisive Further Case (Case 5):**
  To settle whether "Usurpation" alone is enough (when Authority and Consequences are satisfied), you need a case that isolates Origin from Conduct.

  > **Case 5:** A usurper seizes power by force. He rules moderately and the country is prosperous (like Case 4). However, a **public authority (Senate)** authorizes his removal, and the transition is managed such that **no civil war occurs** (Net Good Consequences).
  >
  > **Question:** Is it permissible to depose/kill him?

  **Why this settles it:**
  *   **If Verdict is YES:** Then **Original Legitimacy** is the dominant rule. A ruler can be removed for *how they got power*, even if *how they rule* is good (provided Authority and Consequences are met).
  *   **If Verdict is NO:** Then **Functional Justice** is the dominant rule. A ruler is only removable for *tyrannical conduct*, not merely for *usurpation*, once they have established peace and prosperity.

  **Scholarly Note for the Seminar:**
  Historically, Aquinas leans toward the **NO** on Case 5. In *De Regno*, he suggests that if a usurper rules well, disturbing the peace to remove him may be contrary to the common good. He prioritizes the *end* of government (peace/virtue) over the *title*, unless the usurpation itself causes ongoing structural sin. However, later Scholastics (like Suárez) debated this intensely.

  ### Summary for your Students

  1.  **Verdict on Case 4:** Not Permissible. The lack of public authority and the risk of greater evil (civil war) outweigh the defect in the ruler's original title, especially given his moderate rule.
  2.  **Implicit Rule:** A **Conjunctive Rule**: Permissibility requires **Public Authority** AND **Net Good Consequences**. Usurpation creates the *opportunity* for removal, but not the *right* for private killing.
  3.  **Competing Rule:** The **Status Rule** (Usurpers are always liable). Case 4 tests this against the **Consequentialist Rule**.
  4.  **Settled vs. Contested:** Remind students that while the "Proportionality" and "No Private Killing" rules are settled Aquinas, the idea that a "Senate" can authorize killing (Case 1) is a specific interpretation of his "multitude" theory, and the permissibility of removing a *beneficent usurper* (Case 5) remains a point of development in later Scholasticism.
