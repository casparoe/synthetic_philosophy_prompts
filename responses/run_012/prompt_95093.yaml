  ### On the form

  The circular structure enacts the bureaucratic loop where agency is dispersed until it vanishes. By linking the quatrains through repeated lines, the poem forces the reader to pass the same words from one speaker to the next, mirroring how liability is handed down the chain until it dissolves. The six voices—specifier, data curator, architect, deployer, operator, and system—are never named, identifiable only by the specific passive constraints they describe. This fragmentation ensures that no single stanza holds the whole truth, reflecting the symposium's finding that the gap lies between the links, not within them.

  The grammar performs the displacement of responsibility. Except for the opening and closing line, every verb is passive or impersonal. Things are "set," "drawn," "hidden," and "delivered," but no one does them. The single exception, "I signed the paper that allowed the start," begins as a claim of ownership. However, after circulating through twenty-two lines of impersonal necessity, the line returns emptied out. The "I" is no longer an agent but a signature on a document that no longer controls the outcome.

  The poem leaves the forward question unresolved. The system proposes a fix, but it is not commanded. The loop closes not with a solution, but with the ritual re-enactment of the initial authorization. The operator absorbs the blame by being the last named entity ("The name was kept"), yet the cycle immediately continues beyond them. Accountability is shown to be a backward-looking label applied to the last human node, while the forward-looking capacity to change the system remains suspended in the passive voice.
