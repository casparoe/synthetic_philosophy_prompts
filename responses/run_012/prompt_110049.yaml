  This is a classic "reflective equilibrium" problem. Priya has strong intuitions but hasn't formalized the principles behind them. Based on her track record, she isn't operating on a single axis (like "Intervention: Yes/No"). She is weighing three competing variables: **Legality/Process**, **Humanitarian Necessity**, and **Intervener Intent**.

  Here are the three implicit rules that fit her history, their predictions for Country X, my bet on which one she actually holds, and the specific case that will force her to reveal her true priority.

  ### 1. The Three Competing Rules

  **Rule A: The "Supreme Emergency" Humanitarian (Atrocity-First)**
  *   **The Logic:** Sovereignty and legality are secondary to the prevention of mass death. If a government is slaughtering its own people, the "right to protect" trumps the "right to rule." Authorization is preferred but not required if waiting means death (Rwanda, Kosovo).
  *   **Key Constraint:** The intervention must actually *stop* the killing (hence her "No" on Syria—a punitive strike doesn't save lives).
  *   **Prediction for Country X:** **YES.** The starvation is mass atrocity; the veto is illegitimate; the AU mandate is a bonus. The risk of annexation is a secondary geopolitical problem compared to the primary moral imperative of stopping starvation.

  **Rule B: The "Procedural Legitimacy" Legalist (Process-First)**
  *   **The Logic:** The UN Security Council is the only legitimate source of force. An exception is permitted *only* when the Council is paralyzed by politics (veto) *and* a regional body (NATO, AU) steps in to validate the action. Unilateralism or ad-hoc coalitions are unacceptable.
  *   **Key Constraint:** You need a stamp of approval from a recognized multilateral body to bypass the UNSC.
  *   **Prediction for Country X:** **YES.** The UNSC is deadlocked (validating the exception), and the African Union has authorized the force (providing the necessary regional legitimacy). The identity of the lead troop contributor matters less than the AU mandate.

  **Rule C: The "Right Intention" Pragmatist (Coalition-First)**
  *   **The Logic:** Intervention is only permissible if the intervener is likely to leave the situation better than they found it. This requires a **broad coalition** (to ensure burden-sharing) and **disinterested actors** (to prevent conquest or regime change). Self-interest corrupts the mission.
  *   **Key Constraint:** Who is doing the fighting and why? (This explains her Iraq "No," her Libya "Yes, but..." critique, and her Kosovo "Yes").
  *   **Prediction for Country X:** **NO.** While the atrocity is real and the AU mandate exists, the lead actor is a neighbor with territorial claims. This creates a high risk of annexation (mission creep/conquest), mirroring her objections to Iraq (ulterior motives) and Libya (regime change overreach).

  ### 2. Which Should You Bet On?

  **Bet on Rule C: The "Right Intention" Pragmatist (Coalition-First).**

  **Why?**
  Her critique of **Libya** is the smoking gun. A pure Humanitarian (Rule A) would say Libya was a success because Gaddafi fell and Benghazi was saved. A pure Legalist (Rule B) would say it was valid because of UNSC Resolution 1973.
  Priya, however, says: *"NATO should have stopped once Benghazi was safe rather than running the war through to regime change."*
  This is a *Jus Ad Bellum* argument about **proportionality and right intention**. She is policing the *ends* of the intervention, not just the *entry*.

  Similarly, her rejection of **Iraq** isn't just about the lack of a UN mandate (Kosovo also lacked one); it's that the motive was WMD/Regime Change, not humanitarian protection. Her rejection of **Syria** is that a strike "protects nobody" (ineffectiveness/intent).

  In **Country X**, the neighbor's territorial claim is the exact same moral hazard as the US/UK in Iraq or NATO in Libya: **Humanitarian cover for geopolitical gain.** If she is consistent with her Libya and Iraq views, she must reject Country X, or at least be deeply conflicted. If she says a confident "Yes" to Country X, she is being inconsistent with her own Libya/Iraq logic.

  ### 3. The Discriminating Case

  To definitively tell these three apart, you need a scenario that keeps the **Atrocity** high but separates **Legitimacy (AU/UN)** from **Disinterest (Coalition Quality)**. Country X tests Disinterest vs. Legitimacy. You now need a case that tests Legitimacy vs. Atrocity.

  **Present her with "The Unauthorized Coalition" Scenario:**

  > **The Scenario:** A genocidal campaign is underway (Rwanda-level). The UNSC is deadlocked by a veto. The Regional Body (e.g., AU or OAS) is **unable to reach a consensus** and issues **no mandate**. However, a broad coalition of distant democracies (e.g., NATO members + India + Brazil) with **zero territorial or economic interest** in the region assembles a force to stop the killing. They guarantee they will leave once the violence stops.
  >
  > **The Question:** Do they intervene?

  **How her answer reveals the rule:**

  *   **If she says YES:** She is **Rule A (Atrocity-First)**. She prioritizes saving lives over legal process or regional mandates. (This makes her inconsistent with her Country X "No" if she takes that stance, or inconsistent with her Legalist leanings).
  *   **If she says NO:** She is **Rule B (Legalist w/ Exception)**. She requires the Regional Body (AU) stamp to bypass the UNSC. Without that procedural cover, even a disinterested coalition is illegitimate.
  *   **If she says YES (but hesitates):** She is **Rule C (Coalition-First)**. She accepts the intervention because the coalition is broad and disinterested (solving the Iraq/Libya problem), even without the AU stamp (unlike Country X).

  **Summary for your seminar:**
  If she says **Yes to Country X**, she is an Atrocity-First thinker who is vulnerable to the charge of inconsistency regarding Iraq (motives matter less than outcomes). If she says **No to Country X**, she is a Right Intention thinker who prioritizes the *quality* of the peace over the *speed* of the rescue. The "Unauthorized Coalition" case will tell you if she values the **Stamp (AU)** or the **Soldiers (Disinterest)** more when the law is silent.
