  # Decision Tree: The Logical Space of Expected-Value Fanaticism

  **Instructions:** Traverse the tree by answering each question based on your philosophical commitments. Do not answer based on the desired conclusion (the leaf), but on the structural features of your view. At each node, consider the indicated test case.

  ### **Node 1: Location of Trouble**
  **Question:** When expected-value maximization demands sacrificing a certain modest good for a vanishingly small chance of an enormous good, where is the error located?
  *   (A) In our **Intuitions** (the verdict is correct, our instincts are wrong).
  *   (B) In the **Decision Rule** (EV maximization is the wrong tool).
  *   (C) In the **Axiology** (the values or comparisons are mistaken).

  > **Case Study:** *A fair-coin St. Petersburg lottery with unbounded payoffs vs. a certain modest gain.*
  > *   *Note:* If you choose (A), you accept the St. Petersburg verdict. If (B) or (C), you reject it.

  ---

  ### **Path A: Intuitions**
  *   **Leaf 1: Full Expected-Value Maximization (Fanaticism Accepted)**
      *   **Commitment:** "I must sacrifice the certain welfare of the present generation for a vanishingly small chance of a utopia."
      *   *(Traversal ends)*

  ---

  ### **Path B: Decision Rule**
  *(Proceed to Node 2)*

  ### **Path C: Axiology**
  *(Proceed to Node 3)*

  ---

  ### **Node 2: Probability Structure (Rule Views)**
  **Question:** Does your proposed fix apply only where the tiny probability is given directly, as opposed to arising as the product of many independent small chances?
  *   (Yes) The fix targets **Direct** tiny probabilities only.
  *   (No) The fix applies to **Any** tiny probability (direct or decomposed).

  > **Case Study:** *Choice between a certain modest gain and an astronomically small chance of a lexically better outcome for an enormous population.*
  > *   *Note:* If (No), you treat the probability as an object of rational preference regardless of its source (Risk-Sensitive). If (Yes), you worry about integration across independent events (Threshold).

  ---

  ### **Path B-Yes**
  *   **Leaf 2: Probability-Threshold Rule**
      *   **Commitment:** "I must treat a probability of 1/10^100 as zero, but 1/10^99 as non-zero, arbitrarily."
      *   *(Traversal ends)*

  ### **Path B-No**
  *   **Leaf 3: Risk-Sensitive / Ex Ante Prioritarian Rule**
      *   **Commitment:** "I must violate the independence axiom or stochastic dominance in some formulations to discount the tails."
      *   *(Traversal ends)*

  ---

  ### **Node 3: Probability Existence (Axiology Views)**
  **Question:** Is the comparison blocked because a determinate probability does not exist, or because the values cannot be compared given the probability?
  *   (No Prob) The view is restricted to cases in which a **determinate probability does not exist** (or is irrelevant).
  *   (Yes Prob) The comparison fails even when a **determinate probability exists**.

  > **Case Study:** *St. Petersburg Lottery.*
  > *   *Note:* If (No Prob), you deny the coherence of the probability measure in infinite cases. If (Yes Prob), you accept the math but reject the value comparison.

  ---

  ### **Path C-No Prob**
  *   **Leaf 4: Incommensurability View**
      *   **Commitment:** "I must admit that rational choice is sometimes impossible even when all facts are known."
      *   *(Traversal ends)*

  ### **Path C-Yes Prob**
  *(Proceed to Node 4)*

  ---

  ### **Node 4: Scale of Value (Axiology Views)**
  **Question:** Do infinite value and merely astronomically large finite value raise one problem or two?
  *   (Two) They are **distinct problems** (Infinite is impossible/undefined; Finite is comparable).
  *   (One) They raise the **same problem** (Finite scales can mimic infinite demands).

  > **Case Study:** *St. Petersburg (Infinite) vs. Large Population (Finite).*
  > *   *Note:* If (Two), you solve St. Petersburg by denying infinite utility. If (One), you must also solve the **Repugnant Conclusion**, as the problem collapses into population axiology for finite but large populations.

  ---

  ### **Path C-Yes-Two**
  *   **Leaf 5: Axiological Finitism**
      *   **Commitment:** "I must deny that adding more happy lives can always increase value, or deny the coherence of infinite utility."
      *   *(Traversal ends)*

  ### **Path C-Yes-One**
  *(Proceed to Node 5)*

  ---

  ### **Node 5: Continuity of Value (Axiology Views)**
  **Question:** Does the axiology admit lexical priority between goods or insist on continuity?
  *   (Lexical) Some goods have **lexical priority** (no amount of lower good outweighs higher).
  *   (Continuous) All goods are **continuous** (Archimedean).

  > **Case Study:** *Modest Gain vs. Astronomical Chance.*
  > *   *Note:* If (Lexical), you block fanaticism by ranking goods. If (Continuous), you must block it by capping utility or discounting probability (returning to Rule views).

  ---

  ### **Path C-Yes-One-Lexical**
  *   **Leaf 6: Unnamed (Lexical Axiology without Incommensurability)**
      *   **Status:** **Unexplored/Unattractive.**
      *   **Diagnosis:** This position is rarely defended plainly because it implies a rigid hierarchy of goods that often contradicts trade-offs we are willing to make (e.g., safety vs. convenience) while still accepting EV logic within tiers.
      *   **Commitment:** "I must accept that no amount of trivial pleasure can ever outweigh a single instance of high art, even under certainty."

  ### **Path C-Yes-One-Continuous**
  *   **Leaf 7: Unnamed (Continuous Axiology Rejecting Fanaticism)**
      *   **Status:** **Incoherent.**
      *   **Diagnosis:** If values are continuous, finite, and comparable, and probabilities are determinate, the mathematics of expectation forces fanaticism. Rejecting it here requires smuggling in a Rule-based fix (see Path B).
      *   **Commitment:** "I must assert that the sum of a convergent series does not determine the value of the gamble."

  ---

  ### **Diagnostic Notes**

  **1. Unoccupied Combinations:**
  *   **Leaf 6 (Lexical Axiology):** While lexical views exist (e.g., Rawls), combining them with a strict *axiological* rejection of EV (rather than a rule-based priority) without invoking incommensurability is logically unstable.
  *   **Leaf 7 (Continuous Anti-Fanatic):** This is the "impossible" zone. One cannot consistently hold that values are continuous, finite, comparable, and probabilities determinate, yet deny the expectation calculation.

  **2. Limitations of Separation:**
  This tree **cannot separate Leaf 4 (Incommensurability)** from **Leaf 5 (Axiological Finitism)** if the respondent holds a hybrid view where values are finite *because* they are incomparable across scales. Both would answer "Axiology," "Yes Prob," and "Two Problems." The tree forces a distinction at Node 3 (Probability Existence) that some philosophers would reject, as they accept probability exists but deny the *value relation* holds.

  **3. Case Study Collapses:**
  *   **Repugnant Conclusion:** At **Node 4**, if the respondent answers "One Problem," the fanaticism debate collapses into the population-axiology problem. The "Astronomical Chance" case becomes indistinguishable from the "Large Population" case, requiring a solution to the Repugnant Conclusion rather than decision theory.
  *   **Probability as Preference:** At **Node 2**, the split turns on whether probability is treated as an object of rational preference at all. Risk-Sensitive views (No) treat the probability weight itself as a variable in the utility function; Threshold views (Yes) treat probability as a gatekeeper for entry into the calculation.
