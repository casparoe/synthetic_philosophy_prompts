          *   *Fit:* Supports both, but requires heavy machinery.

      *   *Refining for the Prompt:* The prompt asks for distinct precise theses regarding "only the absence matters." I need to make sure I distinguish the *farm animal* claim (asymmetry of intervention) from the *bliss universe* claim (axiological neutrality of positive states).

