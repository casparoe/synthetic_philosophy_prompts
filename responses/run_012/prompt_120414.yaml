answer: |-
  Here is a menu of precise readings for "only the absence matters," ranked by radicalism.

  **1. The Instrumentalist (Moderate)**
  *   **Thesis:** Pleasure is intrinsically neutral; it is only instrumentally good as a tool to extinguish craving. Suffering (active craving) is intrinsically bad. Relief is good. Requires sentience.
  *   **Role of Craving:** The only source of disvalue. A rock has no craving but lacks the capacity for relief, so it is morally irrelevant.
  *   **Verdict:** Defensible.
  *   **Friend's Use:** **The Farm Animal Claim.** He argues you shouldn't add pleasure (neutral), only remove suffering (good).

  **2. The Nullist (Radical)**
  *   **Thesis:** A state of permanent contentment (zero craving) has zero intrinsic value, identical to non-existence. Only the *transition* from suffering to non-suffering generates value.
  *   **Role of Craving:** Its absence is not a positive good, merely the cessation of a negative. A blissful being adds no value to the universe compared to void.
  *   **Verdict:** Dubious.
  *   **Friend's Use:** **The Bliss Universe Claim.** He argues content beings = empty universe (both zero value).

  **3. The Literalist (Absurd)**
  *   **Thesis:** The absence of craving is the sole good, regardless of sentience.
  *   **Role of Craving:** Purely logical absence. Since rocks have no craving, they are already at the moral goal.
  *   **Verdict:** False.
  *   **Friend's Use:** None (unless pressed on why rocks aren't perfect).

  **The Slide**
  Your friend is sliding between **Instrumentalism** and **Nullism**.
  *   For **farm animals**, he relies on *Instrumentalism*: relieving suffering is a positive gain for existing beings.
  *   For the **bliss universe**, he relies on *Nullism*: the *state* of suffering-free existence adds no value compared to non-existence.

  **The Trap**
  Nullism is required for the bliss-universe claim, but it undermines the farm-animal claim. If contentment is truly axiologically null (Reading 2), then keeping an animal alive in contentment is no better than euthanizing it (non-existence). If he admits keeping them alive is better, he concedes contentment has value, destroying the bliss-universe argument. He cannot have both without contradicting himself on whether "absence" is a positive state or merely a neutral baseline.
