      *   *Wait, one more check:* The prompt says "payment is for the intention alone; whether she actually goes through with it makes no difference to the money." This is the standard Toxin Puzzle setup.
      *   *Advice:* If she tries and fails, she gets nothing. If she tries and succeeds, she gets money but might feel sick (if she follows through). If she succeeds in intending but *doesn't* follow through, she gets money and feels fine. The goal is to Intend + Not Act. Kavka says this combination is impossible for a rational agent.

  8.  **Final Polish:** Organize with clear headings. Ensure the distinction between "Settled" and "Contested" is explicit. (e.g., "Philosophers generally agree..." vs. "There is deep disagreement on...").

