answer: |-
  Your intuitions are not a random collection; they track a coherent, albeit demanding, theory of moral and legal agency. You are not merely asking if the person said "yes." You are asking if the "yes" represents an exercise of sovereignty that the law and morality recognize as legitimate.

  Your verdicts are best captured by a single core principle with four necessary conditions. I call this **The Principle of Non-Dominating Disposal**.

  **The Principle:**
  *Consent is valid if and only if it constitutes an authorized transfer of rights by an agent who retains sufficient sovereignty to avoid domination, within the bounds of rights that society permits to be waived.*

  To earn its keep against your eight cases, this principle requires four specific clauses.

  ### The Four Clauses and Their Forcing Cases

  **1. The Clause of Material Correspondence**
  *The act performed must correspond materially to the act authorized, specifically regarding physical boundaries and the immediate physical agent.*
  *   **Forced by Case (2) and (3).**
  *   **Explanation:** In (2), the patient authorized *Surgeon A* to cut, not *Resident B*. In (3), the partner authorized sex *with a condom* (or with a vasectomized partner), not sex *without one*. Lies about income or a spouse are "background facts"; they do not change the physical reality of the act itself. Your intuition draws the line at the "boundary of the body." If the physical reality diverges from the mental authorization, there is no consent to *that* act, only to a different one.

  **2. The Clause of Legitimate Pressure**
  *Consent is void if the choice is compelled by a threat the proposer has no right to make, or by an abuse of fiduciary authority, distinct from hard choices created by circumstance.*
  *   **Forced by Case (4) and (5).**
  *   **Explanation:** This resolves the Mugger vs. Employer vs. Professor puzzle. The mugger has no right to threaten harm (Illegitimate Threat). The employer has a right to hire or fire; the hardship is a circumstance of the market, not a wrongful threat (Legitimate Pressure/Hard Bargain). The professor, however, holds power *in trust* for education; using grading power to extract sex is a **fiduciary abuse**. It corrupts the channel of authority. The threat is "wrongful" not because the harm (failing) is large, but because the *lever* used to apply it is illegitimate.

  **3. The Clause of Proportional Competence**
  *The agent's capacity must be commensurate with the irreversibility and magnitude of the risk undertaken.*
  *   **Forced by Case (6).**
  *   **Explanation:** Capacity is not a binary switch (on/off); it is a dimmer. A fifteen-year-old has enough sovereignty to manage a vaccine (low risk, high public good) but not a kidney donation (high risk, permanent loss) or sex with an adult (power imbalance, psychological risk). Similarly, the dementia patient can manage a haircut (reversible, low stakes) but not a house sale (permanent, high stakes). Validity scales with the weight of the decision.

  **4. The Clause of Public Alienability**
  *Consent is void if the right being waived is rendered inalienable by public policy to prevent domination or public harm, unless a specific regulatory exception exists.*
  *   **Forced by Case (7) and (8).**
  *   **Explanation:** This handles the limits of waiver. You cannot consent to be killed in a duel (public policy against private violence), but you can consent to be hit in a boxing ring (regulated social utility) or helped to die (regulated medical autonomy). Regarding the prisoner (7): The state has total custody; allowing experiments exploits a vulnerability the state *created*. This is structural domination. The poor kidney seller is the tension point (see below), but the principle suggests that if the vulnerability is systemic and exploited, validity is suspect.

  ---

  ### Predictions for Unlisted Cases

  Applying **The Principle of Non-Dominating Disposal** to your new scenarios:

  **1. Consent to sex given the night before, to be acted on while I am asleep.**
  *   **Verdict: Invalid.**
  *   **Reasoning:** Violates **Material Correspondence**. Consent to sex includes consent to be a conscious participant in the mutual act. Sex with a sleeping person is a different physical act than sex with a waking person. Sovereignty cannot be transferred in a way that removes the agent's ability to revoke it during the act (the "ongoing consent" requirement).

  **2. A liability waiver signed by a woman in advanced labor.**
  *   **Verdict: Invalid (or highly voidable).**
  *   **Reasoning:** Violates **Legitimate Pressure** and **Proportional Competence**. Advanced labor involves extreme pain and physiological stress that compromises decision-making capacity (Proportional Competence). Furthermore, presenting a waiver at this moment exploits a vulnerability the hospital controls (Legitimate Pressure/Duress). It is a "take it or leave it" offer made when "leave it" is physically impossible.

  **3. Consent is valid when a patient is told a risk exists but not how likely it is.**
  *   **Verdict: Valid (generally).**
  *   **Reasoning:** Satisfies **Material Correspondence**. Uncertainty is inherent to medicine. As long as the *nature* of the risk is disclosed (the boundary), the precise probability is often a background fact. *Exception:* If the likelihood is so high that it changes the nature of the decision (e.g., 90% chance of death vs. 1%), withholding that statistic becomes a deception about the *nature* of the act, voiding consent under Clause 1.

  **4. A worker's agreement to a hazard the employer concealed but did not misdescribe.**
  *   **Verdict: Invalid.**
  *   **Reasoning:** Violates **Material Correspondence**. By concealing the hazard, the employer has changed the physical reality of the work environment from what was authorized. The worker consented to "Work with Risk X," not "Work with Risk X and Hidden Risk Y." This is structurally identical to the Surgeon/Resident case (2).

  ---

  ### The Distinction: Invalid vs. Wrongfully Obtained

  You asked where the line falls. Your Principle draws it at **Fiduciary Corruption vs. Hard Bargaining.**

  *   **Invalid Consent:** The structure of the agreement is corrupted. The agent did not truly authorize *this* act, or lacked the standing to do so. (Cases: Mugger, Professor, Surgeon B, Stealthing, Prisoner).
  *   **Wrongfully Obtained (but Valid) Consent:** The agent authorized the act, but the moral conditions surrounding the offer were reprehensible. (Case: The Employer).
      *   **Why:** The employer's offer is a "hard bargain," not a wrongful threat. The employer has a right to set wage/condition terms. The worker's poverty is tragic, but the employer did not *create* the poverty to force the deal (unlike the Mugger or the Prison system). The consent is valid because the worker retains sovereignty over the choice, even if the choice is terrible.
      *   **The Line:** If the pressure applied relies on a right the presser *does not have* (Mugger, Professor), consent is **Invalid**. If the pressure relies on a right the presser *does have* (Employer firing, Market pricing), consent is **Valid**, even if the actor is a scoundrel.

  ---

  ### Mismatches and Necessary Revisions

  To make this principle hold, you must revise two of your verdicts. The principle exposes inconsistencies in your current data.

  **1. The Kidney Seller (Case 7)**
  *   **Your Verdict:** Unstable ("No for prisoner, yes for kidney seller, or reverse").
  *   **Principle's Demand:** **Invalid.**
  *   **Reasoning:** If you reject the prisoner's consent because the State created the vulnerability (custodial domination), you must logically reject the desperate kidney seller's consent if the vulnerability is equally coercive. However, the law usually accepts the kidney seller (Case 7) but rejects the prisoner.
  *   **Revision:** You must decide if "Economic Desperation" counts as "Domination."
      *   *Option A (Libertarian):* Prisoner = Invalid (State coercion); Kidney = Valid (Market is neutral). *Cost:* You must accept that extreme poverty does not compromise sovereignty.
      *   *Option B (Egalitarian):* Prisoner = Invalid; Kidney = Invalid. *Cost:* You restrict the options of the poor to "protect" them, which is itself paternalistic.
      *   *Recommendation:* To keep your principle consistent with Case (4) (Employer), you should likely rule the Kidney Seller **Valid**. The employer creates a hard choice; the poverty is background. The prison *is* the constraint. Distinguish between *institutional custody* (Prisoner) and *market circumstance* (Poor).

  **2. The Duelist vs. The Boxer (Case 8)**
  *   **Your Verdict:** Duelist = Invalid; Boxer = Valid.
  *   **Principle's Demand:** **Arbitrary without Social License.**
  *   **Reasoning:** Physically, both consent to violence. The difference is not in the consent, but in the **Public Alienability** (Clause 4).
  *   **Revision:** You must acknowledge that this verdict is not about *consent* per se, but about *public policy*. The principle cannot explain *why* boxing is licensed and dueling is not; it can only say "Consent is valid *if* the act is legally permissible." You must accept that some consent verdicts are determined by external regulation, not internal moral logic.

  ### Final Diagnosis

  Your suspicion was half-right. Your verdicts are consistent, but they rely on a distinction you haven't fully articulated: **The difference between a threat that breaks the will (Illegitimate) and a circumstance that burdens the will (Hard Choice).**

  *   **Mugger/Professor:** Break the will. (Invalid).
  *   **Employer/Poverty:** Burden the will. (Valid).
  *   **Surgeon/Condom:** Bypass the will. (Invalid).

  If you adopt **The Principle of Non-Dominating Disposal**, you gain a robust tool for analysis, but you must surrender the hope that it will solve the "Kidney Seller" dilemma without a political choice. The principle reveals that your instability there is not a failure of logic, but a reflection of the unresolved conflict between market freedom and economic coercion in our society.
