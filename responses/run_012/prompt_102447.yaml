      *   *Simpler approach for "feel":* The "Causal Chain" game. Students stand in a circle. Each student represents a spatial location. They have a local time. They must establish a rule: "My time $t$ is simultaneous with your time $t$." But there is a constraint: "Causal influence flows clockwise." If A influences B, B must be later than A. If the chain loops back, A must be later than A. Contradiction.
