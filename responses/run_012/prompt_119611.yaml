prompt: |-
  I've slowly talked myself into thinking Moore's proof of an external world is a real proof rather than a cheeky bit of theatre — you know the one, he holds up his hands and says he knows they're there, so there's an external world after all. What would count against it? Sort the defeaters by how much damage they actually do. Two things I'm especially interested in. First, whether the same argument form, run with a conclusion Moore would have hated (a mystic's, say, or the idealist's mirror image of it), goes through just as well — and if it does, whether that wrecks the proof or just shows it can be abused. Second, how much it matters that the conclusion is so much more general than the premise, and what would have to be true for that gap to be fatal rather than cosmetic. What would Moore's own defenders concede counts against them here? And has the view been quietly immunised — by insisting the "I know" is doing something special, for instance — and if so is that a problem or just what any view of this kind ends up doing? Answer in British English please, and dont hedge everything into mush.
