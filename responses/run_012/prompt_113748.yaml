answer: |-
  Here is the strategic breakdown for your protagonist's three-year arc. The goal is defensibility, which means prioritizing questions that, if left unanswered, allow an opponent to dismantle the theory entirely. The ordering moves from logical coherence (upstream) to measurement (midstream) to application (downstream).

  ### The Ordering Logic: Upstream to Downstream

  **1. Upstream: Diachronic Coherence (Year 1)**
  *   **The Question:** Does the shifting threshold create irrational preference cycles over time?
  *   **Why First:** This is the kill switch. If the variable threshold means that State A is better than State B today, but because choosing A changes the baseline, State B becomes better than State A tomorrow, the theory is diachronically irrational. An opponent in a public debate doesn't need to know the math; they just need to show the theory tells the agent to spin in circles.
  *   **Philosopher vs. Economist:** An economist models the function; a philosopher analyzes the rationality conditions of the agent living under it. This is conceptual logic, not calibration.
  *   **Variant Impact:** The shifting ratio makes this urgent. A fixed threshold is static; a variable one is dynamic. Dynamics introduce feedback loops. If she doesn't solve this in Year 1, Years 2 and 3 are wasted.

  **2. Midstream: The Ontology of the Baseline (Year 2)**
  *   **The Question:** Is the "baseline" a hedonic state, a capacity for agency, or a historical aggregate?
  *   **Why Second:** Once she proves the theory *can* be coherent, she must define the input. If the baseline is "current mood," the threshold is manipulable (I can make my pain count more by depressing myself first). If it's "lifetime suffering," it's epistemically inaccessible.
  *   **Philosopher vs. Economist:** Economists measure utility; philosophers define what *counts* as the unit of moral value. She needs a metaphysical justification for why *this* property modulates the threshold, not just a statistical correlation.
  *   **Variant Impact:** This is the core of her variant. The defensibility rests entirely on whether the baseline is something we can identify without inviting perverse incentives.

  **3. Downstream: Epistemic Access & Demandingness (Year 3)**
  *   **The Question:** Can public institutions identify the threshold without violating privacy or demanding omniscience?
  *   **Why Third:** Only matters if the theory is coherent and defined. If the theory is sound but requires reading minds to apply, it fails as a public morality.
  *   **Philosopher vs. Economist:** Economists worry about information costs; philosophers worry about the moral cost of the surveillance required to get that information.
  *   **Variant Impact:** A shifting threshold is harder to measure than a fixed one. She needs to argue that the *rough* location of the threshold is enough for policy, or the debate opponent will argue it's too vague to be law.

  ### Dynamic Priorities: What Moves Questions Up or Down?

  *   **Moves Coherence Down / Ontology Up:** If she discovers a formal proof that *any* monotonically increasing ratio function avoids cycles (a mathematical breakthrough), the logical threat vanishes. She can then spend Year 1 on defining the baseline instead.
  *   **Moves Ontology Down / Epistemic Up:** If psychological evidence emerges (within the novel's world) that baselines adapt instantly (hedonic treadmill), the "Baseline" becomes useless as a metric. She must pivot immediately to "Epistemic Access"—how do we judge suffering if the baseline is invisible?
  *   **Moves Demandingness Up:** If a rival theory emerges that is simpler (e.g., standard Utilitarianism), she must spend more time defending why the complexity of her variable threshold is worth the moral gain.

  ### Why This Order for a Novelist?

  This ordering creates narrative tension.
  *   **Year 1** is internal struggle: *Is my idea broken?* (The fear of incoherence).
  *   **Year 2** is external conflict: *How do I define this without being manipulated?* (The fear of loopholes).
  *   **Year 3** is public stakes: *Can I actually sell this?* (The fear of irrelevance).

  The variant (shifting ratio) is the perfect engine for this. It makes the theory more compassionate (harder to compensate the suffering) but logically fragile (the goalposts move).

  ### The Single Priority Question

  If she solves nothing else, she loses. If she solves this, she has a fighting chance. It is the most upstream because it determines whether the theory describes a rational moral system or a paradox. It is tractable for a philosopher because it requires conceptual analysis of identity and time, not data collection.

  \answer{What prevents the shifting compensation ratio from generating diachronic preference cycles?}
