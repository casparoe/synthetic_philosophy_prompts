  # JOINT STATEMENT ON VAGUENESS AND THE STIPULATED MATERIALS

  **Undersigned:**  
  The Epistemicist Party (EP)  
  The Supervaluationist Party (SP)

  **Date:** October 26, 2023  
  **Subject:** Findings of Adversarial Collaboration regarding Materials 1–4

  Having engaged in a good-faith adversarial collaboration, utilizing only the four stipulated materials provided at the outset of this inquiry, we submit the following joint statement. We agree on the data provided by the materials and on several structural claims regarding the Sorites paradox, though we remain divided on the metaphysical and semantic implications of that data.

  ### I. AGREED CLAIMS

  Both parties accept the following claims derived strictly from the stipulated materials:

  1.  **Unsoundedness of the Sorites:** Regarding **Material 1** (the series of 1 million patches), both parties agree that the Sorites argument is unsound. The inductive premise ("If patch $n$ is red, then patch $n+1$ is red") is false.
  2.  **Control Case Precision:** Regarding **Material 3** (the stipulated predicate fixed at patch 500,000), both parties agree that vagueness has been eliminated. For this predicate, there is no Sorites paradox, bivalence holds without exception, and classical logic applies without restriction.
  3.  **Linguistic Data:** Regarding **Material 2** (the community of speakers), both parties agree that this material exhausts the relevant linguistic data for **Material 1**. There is no hidden linguistic fact about the word "red" in Material 1 other than the usage patterns described in Material 2 (uniform agreement at the ends, divergent stable flipping points in the middle).
  4.  **Function of 'Definitely':** Regarding **Material 4** (the operator 'definitely' nested up to three levels), both parties agree that applying 'definitely' ($D$) to Material 1 reduces the extension of "red." Specifically, $D(\text{red})$ applies to the first 100,000 patches (where all speakers agree) and fails to apply to the last 100,000 patches. Both parties agree that $D$ serves to isolate the region of unanimous verdicts in Material 2 from the region of divergent verdicts.
  5.  **Metaphysical Supervenience:** Both parties agree that the color patches in **Material 1** are not metaphysically vague. The physical properties of the patches are fixed and precise. Any vagueness resides in the classification (the predicate), not the world.
  6.  **Logic of the Stipulated:** Both parties agree that for **Material 3**, the statement "Patch 500,000 is red* and patch 500,001 is not red*" is true, and that this truth is knowable by stipulation.

  ---

  ### II. DISAGREEMENTS TABLE

  The following table outlines the residual disagreements. Each row states the disagreement in terms each side endorses, identifies the crux, cites the agreed case or argument bearing on it (based on the Materials), records the specific verdicts of each side on the Materials, and offers a joint judgment on whether the dispute is verbal or substantive.

  | Residual Disagreement | Crux | Agreed Case / Argument Bearing on Crux | EP Verdict on Materials | SP Verdict on Materials | Judgment: Verbal or Substantive? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Quantifier Question:**<br>EP: There exists a specific patch $k$ in Material 1 such that $k$ is red and $k+1$ is not red.<br>SP: It is true that *some* patch is the last red one, but there is no *particular* patch $k$ in Material 1 such that $k$ is red and $k+1$ is not red. | **Existence vs. Identifiability of Cutoffs**<br>Does the falsity of the inductive premise entail a specific fact of the matter about *which* patch is the cutoff? | **Material 1 & 2:**<br>The series is continuous; the community usage diverges in the middle. The argument turns on whether the divergence in Material 2 constitutes a lack of fact (SP) or concealed precision (EP). | **Material 1:** Sharp boundary exists (unknown).<br>**Material 2:** Speaker variation is error/noise around the true boundary.<br>**Material 3:** Analogue for how Material 1 really is. | **Material 1:** No sharp boundary (truth-value gap).<br>**Material 2:** Speaker variation *constitutes* the meaning; no single boundary exists.<br>**Material 3:** Unique case where boundary is forced. | **Substantive.**<br>This concerns the logic of the existential quantifier. EP accepts $\exists x (Rx \land \neg R(x+1))$ implies a specific instance is true. SP accepts the existential is supertrue but denies any instance is true. This is a logical disagreement, not merely terminological. |
  | **2. Treatment of Split Speakers:**<br>EP: The divergent verdicts in the middle of Material 2 represent ignorance or error regarding the single correct extension of "red."<br>SP: The divergent verdicts in the middle of Material 2 represent the set of all admissible precisifications; no verdict in the middle is erroneous. | **Constitution of Meaning**<br>Is meaning determined by a hidden sharp norm (EP) or by the set of all consistent usage patterns (SP)? | **Material 2:**<br>Every speaker flips at a *stable* point. The argument turns on whether "stability" implies correctness (EP) or merely admissibility (SP). | **Material 2:** Only one flip-point is correct (the boundary of the word), others are mistaken.<br>**Material 1:** Inherits the single correct boundary. | **Material 2:** All flip-points are equally admissible precisifications.<br>**Material 1:** Inherits the indeterminacy of the set of flip-points. | **Substantive.**<br>This concerns the theory of meaning. EP posits a semantic fact beyond the usage data in Material 2. SP posits that the usage data in Material 2 is all there is. |
  | **3. Higher-Order Vagueness (Nesting):**<br>EP: There are sharp boundaries between $D(\text{red})$, $DD(\text{red})$, and $DDD(\text{red})$.<br>SP: The operator $D$ is precise relative to Material 2, so $DD(\text{red})$ is equivalent to $D(\text{red})$; this collapse fails to capture the phenomenology of vague boundaries. | **Logic of 'Definitely'**<br>Does nesting 'definitely' generate new sharp boundaries (EP) or collapse into the first level (SP)? | **Material 4 & 2:**<br>Nesting 'definitely' up to three levels. The argument turns on whether the set of speakers in Material 2 is itself a sharp set. | **Material 4:** $D, DD, DDD$ each have distinct, sharp extensions.<br>**Material 2:** The set of speakers is fixed and sharp. | **Material 4:** $DDp \leftrightarrow Dp$ (S4 Axiom holds).<br>**Material 2:** The set of speakers is sharp *for this model*, but this reveals a defect in modeling natural language HOV. | **Mixed.**<br>Partly **Verbal**: EP and SP define 'Definitely' differently (Stability/Knowledge vs. Supertruth).<br>Partly **Substantive**: EP claims natural language supports distinct levels of clarity; SP claims logic forces collapse. |

  ---

  ### III. JUDGMENT ON THE NATURE OF THE DISPUTE

  After reviewing the verdicts recorded above, we offer the following joint judgment on whether the remaining dispute is merely verbal or substantive.

  **1. The Notion of Truth (Verbal):**
  We agree that a significant portion of our disagreement stems from the definition of "truth."
  *   **EP** deploys a bivalent notion of truth (True/False) applicable to **Material 1**, treating "True" as corresponding to the unknown sharp boundary.
  *   **SP** deploys a notion of "supertruth" (True on all precisifications) for **Material 1**, treating "True" as requiring unanimity across **Material 2**.
  *   **Judgment:** When EP says "Patch $k$ is Red" is *True*, and SP says it is *Indeterminate*, they are often using different metrics. If we distinguish "Bivalent-True" from "Supertrue," much of the conflict regarding the label "True" dissolves into a verbal dispute about which metric deserves the unqualified name.

  **2. The Quantifier and Metaphysical Claim (Substantive):**
  However, the dispute is not *merely* verbal.
  *   **EP** asserts that there is a fact of the matter about **Material 1** that is not captured by the totality of facts in **Material 2**. EP claims the world (or the language) contains a specific cutoff point that exceeds the data of speaker usage.
  *   **SP** asserts that the totality of facts in **Material 2** exhausts the semantic facts. SP denies the existence of any fact beyond the pattern of speaker verdicts.
  *   **Judgment:** This is a **substantive** disagreement about the supervenience of meaning on use. It cannot be resolved by translating terms, as EP posits an ontological/semantic commitment (a sharp boundary independent of consensus) that SP explicitly denies.

  **3. Conclusion:**
  While we share a common logic for **Material 3** (Stipulated) and agree on the failure of the Sorites inductive premise, we cannot reconcile our views on **Material 1**. The Epistemicist maintains that **Material 1** is secretly like **Material 3** (sharp but unknown). The Supervaluationist maintains that **Material 1** is fundamentally unlike **Material 3** (indeterminate), and that **Material 2** explains why. We conclude that the dispute is **substantive regarding the metaphysics of meaning**, though **verbal regarding the attribution of the label 'True'**.

