      *   *Structural Feature:* "Causal loop of information."
      *   *Opposing View:* The "Laplacian Demon" argument. A demon *outside* could predict it. But the prompt specifies "observer situated inside." I must stick to that. The strongest objection is that the internal observer could simulate the system *including* the simulation itself. But this leads to the "halting problem" or infinite regress. A finite system cannot contain a complete simulation of itself that runs faster than real time. This is a strong informational limit, not just practical.

