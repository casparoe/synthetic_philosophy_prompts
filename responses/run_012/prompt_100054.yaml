      *Wait, one constraint check:* "fit in a single paragraph." I must ensure the thought experiment description is strictly one paragraph. The analysis follows separately.

      *Refining the "Strong Sense":* Chaos is "weak" because the info exists, we just can't measure it. Here, the info *cannot exist* in the predictor before the event. Why? Because if it did, the machine would invert it. So the state "Predictor knows X" is incompatible with "Outcome is X". Since the outcome is determined by the laws, the state "Predictor knows X" is physically impossible.

      *Opposing Argument:* The determinist might say: "The future state is determined. Therefore, the prediction *is* determined. If the predictor outputs 'Wrong', that was determined. So the system predicted it would output 'Wrong'."
      *Rebuttal:* That's not *fore*knowledge. That's just the event happening. Foreknowledge implies the information is available *prior* to the event in a way that allows anticipation. If the anticipation changes the event, the anticipation was false. If the anticipation is correct, it couldn't have been anticipated (because the machine would have inverted it).
