      *   **Tone/Style:** Graduate seminar exercise, analytical, candid, British English.

  2.  **Deconstruct the Theoretical Framework (Anti-Foundationalism/Coherentism):**
      *   *Foundationalism:* Knowledge rests on basic, indubitable beliefs (theory-neutral observations). In archaeology, this would mean "the stones are there" is neutral, and we build up from there.
      *   *Anti-Foundationalism (Network/Coherentism):* Observations are theory-laden. Justification is holistic. A claim is warranted if it fits well with other claims (stratigraphy, ethnography, radiocarbon dates, oral tradition). No single piece of evidence is decisive; it's about the "tightness of the web."
      *   *Key Philosophers:* Wylie (Alison Wylie is crucial here, specifically her work on Great Zimbabwe), Neurath (boat), Quine (web of belief).

  3.  **Historical Context (Great Zimbabwe):**
      *   *Site:* Massive stone ruins, soapstone birds, trade goods (Chinese porcelain, Arab glass).
      *   *Controversy:* 19th/20th century. Cecil Rhodes and settler colonialists wanted to attribute it to Phoenicians, Arabs, or Queen of Sheba to justify white rule (terra nullius myth).
      *   *Suppression:* Bent, Hall, and later the Rhodesian government suppressed findings suggesting African origin. Garlake and Summers were exiled/silenced.
      *   *Resolution:* Post-independence (1980), consensus on Shona ancestry (Karanga). Radiocarbon dating + ethnography + re-evaluation of stratigraphy.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Define the anti-foundationalist stance (Wylie's "tacking" or "cables" metaphor). Introduce Great Zimbabwe as the test case.
      *   **Mapping the Disputants:**
          *   *Settler/Colonial Archaeologists (Bent, Hall, later government appointees):* Evidence = Biblical parallels, perceived sophistication vs. "savagery," selective stratigraphy. Goal = Legitimise colonialism.
          *   *Africanist/Scientific Archaeologists (Catton-Thompson, Summers, Garlake):* Evidence = Stratigraphy, radiocarbon, local ethnography, trade ware chronology. Goal = Historical truth.
          *   *Local/Shona Oral Historians:* Evidence = Oral tradition, spiritual connection. Often excluded.
      *   **Applying the Network Account:**
          *   *What they faced:* Theory-laden observation. The "ruin" isn't neutral; it's seen through a racial lens.
          *   *What they ought to have done:* Seek reflective equilibrium. Integrate oral tradition with material data. Acknowledge the political load of their premises.
          *   *Inference limits:* Material record shows trade, hierarchy, labour organisation. It *doesn't* directly show language, specific religion, or ethnic names without external bridging principles (ethnography/oral history).
      *   **Critique (Where the account falls silent):**
          *   Coercion: The network model assumes free exchange of arguments. Rhodesian government *fired* archaeologists. That's not epistemic failure; it's political suppression.
          *   Who counts as a knower?: The network model often ignores *standpoint*. Shona knowledge was excluded not because it didn't fit the web, but because the agents were deemed epistemically inferior.
          *   Timing: Consensus arrived with independence (1980), not just because the "web tightened" scientifically (radiocarbon existed earlier).
      *   **Reverse Analysis (Vindication vs. Under-description):**
          *   *Vindication:* Eventually, the colonial web collapsed because it required too many ad hoc hypotheses (ignoring dates, ignoring local pottery). The scientific web was tighter.
          *   *Under-description:* The "tightness" wasn't enough. Power determined which web survived. The model is too idealised.
      *   **Self-Reflection (The "Candid" Ending):**
          *   *Opposite Verdict:* If one argues that material constraints *did* ultimately force the change (radiocarbon is hard to ignore), then the network model holds.
          *   *Potential Error:* Overstating the social constructivism. The stones *did* constrain the lies, eventually. Or, perhaps I am underestimating the role of internal scientific integrity despite pressure.

  5.  **Refining the Argument (incorporating Alison Wylie):**
      *   Alison Wylie's *Thinking From Things* is the definitive philosophical text on this specific case. I must channel her analysis without simply summarising it. She argues for a "critical realism" within a coherentist framework.
      *   *Key distinction:* The "cables" metaphor. Individual lines of evidence are weak (like a single cable), but twisted together they hold weight.
      *   *The Twist:* The colonialists didn't just have a different web; they actively cut the cables of the opposition (censorship).

  6.  **Writing in British English:**
      *   Spelling: *analyse, centre, programme, honour, legitimise*.
      *   Vocabulary: *whilst, amongst, shall, ought*.
      *   Tone: Academic, rigorous, slightly reserved but critical.

  7.  **Review against Constraints:**
