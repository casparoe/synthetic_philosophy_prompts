answer: |-
  **Seminar Exercise: The Epistemology of Archaeology and the Great Zimbabwe Controversy**

  **1. Introduction: The Cable and the Chain**

  To approach the archaeology of Great Zimbabwe through an anti-foundationalist lens is to reject the notion that archaeological knowledge rests upon a bedrock of theory-neutral observation. In the foundationalist view, justification resembles a chain: if the lowest link (the raw data) is secure, the conclusions above it hold. The anti-foundationalist, by contrast—following the lead of philosophers such as Alison Wylie—posits that justification runs along a network of mutually reinforcing cables. No single inference to an unobservable past need be independently secure; rather, objectivity lies in the tightness of the whole web of constraints. Observations are theory-laden, and evidential weight is derived from the convergence of independent lines of inquiry (stratigraphy, radiocarbon dating, ethnography, oral tradition).

  The controversy surrounding Great Zimbabwe offers a stark test case. Here, the material record—mortarless granite enclosures, soapstone birds, and imported Indian Ocean trade goods—was subjected to a century of interpretive struggle. This essay maps the disputants as epistemic agents, analyses the episode through the network model, and interrogates where this epistemological account succeeds and where it falls silent regarding the politics of knowledge production.

  **2. Mapping the Epistemic Agents and Evidence**

  We may identify three primary clusters of epistemic agents during the twentieth century.

  First, the **Settler-Colonial Archaeologists and Administrators** (e.g., J.T. Bent, R.N. Hall, and later, government-appointed custodians under the Rhodesian Front). For these agents, the 'evidence' was filtered through a racialised epistemology. The sophistication of the stonework was taken as data incompatible with indigenous African capability. Consequently, they privileged analogies with Biblical antiquity (the Queen of Sheba, King Solomon) or Phoenician traders. Their 'facts' included selective readings of stratigraphy (ignoring local pottery in 'elite' layers) and the perceived absence of writing, which they equated with an absence of history.

  Second, the **Professional Africanist Archaeologists** (e.g., Gertrude Catton-Thompson, Peter Summers, Peter Garlake). Their web of inference incorporated emerging scientific techniques. They prioritised stratigraphic integrity, the seriation of imported ceramics (Chinese porcelain, Islamic glass), and later, radiocarbon chronologies. For them, the material record indicated a local development trajectory consistent with the Iron Age of southern Africa.

  Third, the **Shona Oral Historians and Community Members**. Though largely excluded from formal archaeological discourse until late in the period, their evidence consisted of oral traditions regarding the *dzimbahwe* (houses of stone), totemic associations, and the spiritual significance of the soapstone birds. In the foundationalist view, this might be dismissed as 'myth'; in the network view, it constitutes an independent line of evidence capable of constraining interpretation.

  **3. The Network Account: Constraints and Obligations**

  Through the anti-foundationalist lens, the settler-colonial position was epistemically deficient not merely because it was politically motivated, but because its web of inference was loose and required excessive ad hoc modification. To maintain the non-African origin hypothesis, proponents had to sever the cables connecting the ruins to the surrounding landscape. They had to ignore the continuity of pottery styles between the ruins and local villages. They had to dismiss radiocarbon dates that conflicted with Biblical chronologies. They had to treat the absence of writing as a positive proof of foreignness, whilst ignoring the presence of writing (in Arabic and Chinese) on imported goods which dated the site to a period when those civilisations were known to trade with East Africa, not the Levant.

  The professional archaeologists, conversely, ought to have sought a 'reflective equilibrium'. The network account suggests they were correct to weave together the material data with ethnographic analogy and oral tradition. The tightness of their web came from the mutual reinforcement of independent cables: the radiocarbon dates matched the ceramic chronologies, which matched the oral histories of Shona migration and state-building.

  Regarding the limits of inference, the network account demands candour. From the material record *alone*, one can infer labour organisation, trade networks, and social hierarchy. The scale of the walls implies a centralised authority capable of mobilising labour. The imported beads imply integration into the Indian Ocean world. However, without the bridging principles provided by ethnography and linguistics, the material record cannot securely identify the *language* spoken, the specific *religion* practised (beyond ritual spaces), or the *ethnic name* of the builders. To infer 'Shona' from stone alone is to overreach; to infer 'Shona' from stone *plus* oral tradition *plus* linguistic continuity is to tighten the web appropriately.

  **4. Where the Account Falls Silent**

  However, the coherentist network model, focused on the internal logic of justification, falls silent on the external conditions of knowledge production. It struggles to account for three critical factors in the Great Zimbabwe episode.

  First, **coercion**. The network model assumes a free market of ideas where the 'tighter' web wins through rational discourse. Yet, the Rhodesian government did not merely argue against the African origin hypothesis; they censored it. Peter Garlake was forced to resign as Inspector of Monuments in 1970 for publishing findings supporting African authorship. The 'web' of the colonialists held not because it was tighter, but because they cut the cables of their opponents. Epistemology cannot fully explain a firing squad or a visa revocation.

  Second, **the question of who counts as a knower**. The network model treats evidence as abstract nodes. It does not inherently explain why Shona oral testimony was deemed 'folklore' whilst a European traveller's diary was deemed 'data'. This is a question of *standpoint* and epistemic authority. The colonial web excluded African agents not because their contributions failed to cohere, but because they were not permitted to contribute to the weave.

  Third, **the timing of consensus**. The scientific web supporting the Shona origin was relatively tight by the 1960s (Catton-Thompson had argued this in the 1930s). Yet, consensus only became official policy after Zimbabwean independence in 1980. If objectivity lies in the tightness of the web, why did the verdict wait upon a change of regime? The network account describes the *structure* of justification, but not the *sociology* of its acceptance.

  **5. Vindication or Under-description?**

  Does this episode vindicate the network picture, or show that it under-describes the social conditions under which claims are licensed?

  One might argue it **vindicates** the model. Ultimately, the colonial web collapsed. Even under pressure, the material constraints exerted force. The Rhodesian government could not change the decay rate of Carbon-14. The 'tightness' of the scientific web eventually became impossible to ignore, even for the oppressors, contributing to the intellectual isolation of the regime. The truth prevailed because the network of evidence was robust enough to survive the suppression, awaiting the political moment to be acknowledged.

  However, I am inclined to argue that the episode shows the network picture **under-describes** reality. The model presumes that epistemic warrant is the primary driver of consensus. In Great Zimbabwe, warrant was secondary to power. The 'licensing' of archaeological claims was a political act. The network model risks sanitising the history by suggesting that the colonial view was primarily an *epistemic* error (a loose web) rather than a *political* tool (a deliberate lie). By focusing on the 'tightness' of the web, we risk implying that if the colonialists had simply woven their cables better, their claim might have been valid. But some claims are illegitimate regardless of their internal coherence, because they rest on the exclusion of certain knowers.

  **6. Candid Reflection: The Opposite Verdict and Potential Error**

  To be candid, the argument that would lead me to the opposite verdict—that the network account is sufficient—is the resilience of the material record itself. Despite decades of suppression, the stones remained. The stratigraphy did not change. One could argue that the 'material constraint' is a foundational element that the network model tries to dissolve but cannot entirely escape. The reason the colonial web failed was ultimately that reality pushed back. The stones themselves acted as a foundation that the colonial narrative could not permanently overwrite. If the material record exerts such a brute force, perhaps there is a quasi-foundational element to archaeology that the anti-foundationalist account downplays too heavily.

  Where am I most likely to have gone astray in my reasoning? I suspect I have drawn too sharp a distinction between the 'epistemic' and the 'political'. In practice, the exclusion of Shona knowers was an epistemic error *and* a political act. By treating them as separate critiques of the network model, I may have underestimated how political exclusion degrades the epistemic web itself. A web that excludes relevant data (oral history) because of the status of the speaker is, by the network's own standards, a loose web. Therefore, the political critique might actually be internal to the epistemological one. If I have erred, it is in failing to see that the 'social conditions' of knowledge are not external to the 'tightness' of the web, but constitutive of it. The network model does not need to be discarded; it needs to be politicised.

  **Conclusion**

  The Great Zimbabwe controversy demonstrates that while the anti-foundationalist network account provides a superior description of archaeological inference than foundationalism, it remains incomplete without a critical sociology of knowledge. Objectivity is indeed a matter of the tightness of the web, but we must ask: who is holding the cables, and who has been barred from the loom?
