answer: |-
  **The Case: Clara and the Dog**

  Clara's close friend, Mark, is dying of a terminal illness. Mark has no family, but he has an elderly, high-maintenance dog named Buster. On his deathbed, Mark asks Clara, "Will you make sure Buster is cared for?" Clara promises she will.

  Five years later, Mark is long gone. Clara does not like dogs. She finds Buster noisy, smelly, and a restriction on her freedom. She feels no affection for him, nor does she feel any general utilitarian pull to maximize happiness in the world. If she had never made the promise, she would have let Buster go to a shelter (or worse) without a second thought.

  However, every morning at 6:00 AM, Clara gets up to walk Buster. When it rains, she goes out. When she is tired, she goes out. When asked why she bothers, she says simply, "I gave my word to Mark. That obligation stands."

  **The Analysis: Where Does the Credit Land?**

  Your intuition is that the moral worth seems to reside in the *promise* (the rule) rather than in *Clara* (the agent). It feels as though Clara is merely the mechanical instrument through which the past commitment exerts its force. If the promise is the "moral engine," is Clara really the one deserving of credit?

  I believe this case cuts in favor of **crediting the agent**, but it clarifies that "acting from duty" is not about *creating* the moral law in the moment, but about **sustaining its authority over one's inclinations.**

  Here is why the credit belongs to Clara, not the rule:

  1.  **Rules are Inert:** A promise written in a notebook, or even a vow spoken on a deathbed, has no kinetic moral power on its own. It cannot walk a dog. It requires a will to recognize it as *binding* in the present tense. The moral worth is located in the **act of submission**. Clara's current self is submitting to the authority of her past self's commitment. That submission is an active exercise of will, not a passive state.
  2.  **The Counterfactual Test:** If we say the credit belongs to the rule, then a robot programmed to fulfill promises would be equally morally praiseworthy. But we don't praise robots for moral worth; we praise them for functionality. We praise Clara because she *could* have chosen otherwise. She has inclinations (sleep, freedom, dislike of dogs) that oppose the action, and she overrides them solely out of respect for the obligation. That override is the locus of moral worth.
  3.  **Ongoing Endorsement:** You asked if acting from duty requires "ongoing endorsement." In this case, **recognizing the past promise as currently binding *is* the ongoing endorsement.** Clara does not need to feel a fresh surge of emotional passion for the principle of fidelity every morning. Her endorsement is demonstrated by her refusal to revoke the promise's authority. She treats the past commitment as a law that governs her present.

  **The Verdict**

  This **does count as acting from duty**, and the credit belongs to **Clara**, specifically for her **integrity**.

  If we assign the credit to the rule rather than the person, we risk alienating the agent from their own morality, turning them into a vessel rather than a citizen of the moral kingdom. The "right reason" here is respect for the binding nature of one's own word. The moral worth isn't that she invented the duty, but that she **upholds it against the drift of her own changing desires.**

  We credit her not for the *content* of the rule (which was set in the past), but for the **stability of her will** in maintaining that rule's authority over time. That stability is a personal virtue, not a property of the rule itself.
