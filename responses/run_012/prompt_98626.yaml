answer: |-
  The team "Core Relay" maintains the Auth Gateway, a service that all downstream microservices must call to verify user tokens. To manage incident fatigue, Relay defines a downstream service as a "Graceful Consumer" if its own user-facing success rate remains above 99.5% during Auth Gateway's scheduled maintenance windows. This boundary is fixed by Relay's operational charter; another equally competent team could set the threshold at 99.0% or 99.9% without violating any law of physics or logic. However, once the threshold is set, whether a specific service belongs to the category is determined entirely by automated logs, not by human opinion. If a service is classified as "Graceful," Relay's on-call engineers are forbidden from paging that service's owners during Gateway outages; if it is not, those owners are immediately summoned to a war room. The category dictates resource allocation, sleep schedules, and performance reviews, making it causally efficacious, yet the 99.5% line is not found in nature nor is it a mere whim, as setting it to 50% would break business logic and 100% is technically impossible.

  **Demonstration**
  Consider the service "Checkout," which maintains a 99.48% success rate during maintenance windows. It sits on the borderline. The single feature separating the constructed from the arbitrary is the **constraint surface**: while the specific threshold (99.5%) is chosen by the team, the *consequences* of moving it are dictated by the system's topology and business requirements (you cannot set it to 100% because networks fail; you cannot set it to 90% without losing revenue). To see what moves and what refuses, hold the underlying population (the actual log data of Checkout's performance) fixed while varying the team's practice. If Relay changes the threshold to 99.0%, Checkout's *logs* do not change, but its *status* flips to "Graceful," and the on-call behavior changes instantly. The brute facts remain stubborn; the social kind shifts.

  If the classifying practice is deleted outright, the logs and the network topology remain unchanged, but the "Graceful Consumer" kind vanishes. Engineers revert to ad-hoc panic, paging everyone regardless of actual impact. The debunker who claims the category is "not real" because it is made up confuses **ontological subjectivity** (the category depends on us to exist) with **epistemic arbitrariness** (the category depends on nothing but whim). They miss that while we draw the map, the terrain resists certain drawings. The category is real because it captures a stable, causal relationship between system behavior and human response, even if the boundary line is ours to draw.

  **Analogy Note**
  This maps closely to money: a bill is money only because we treat it as such (constructed), but once we do, its purchasing power is objective and constrains our actions (real). It breaks down with categories like race or gender because those involve historical power dynamics and identity formation that extend beyond functional system optimization, making the "cost of moving the boundary" socially contested rather than technically constrained. However, the core lesson holds: a category can be invented without being imaginary, and constructed without being arbitrary.
