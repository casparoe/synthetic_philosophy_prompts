      *Wait, one constraint:* "Ground it in whatever speech-act theory... actually established rather than folk intuition." I need to make sure the *logic* is Searle/Austin, even if the *words* are plain English.
      *   *Austin:* Felicity Conditions -> "Preconditions."
      *   *Searle:* Constitutive Rules -> "Our Shared Game."
      *   *Grice:* Implicature -> "Reading Between the Lines."

