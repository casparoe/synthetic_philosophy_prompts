answer: |-
  This is a provocative view. It effectively attempts to temporalize ontology, treating existence not as a state but as a trajectory. You are right to suspect your pub friend is only half-right: the Ship of Theseus is about *persistence* (identity over time), whereas you are applying that logic to *composition* (parthood at a time). That is a genuine innovation, but it comes at a steep metaphysical price.

  You asked for the case against it, ranked from fatal to awkward, with specific attention to supervenience, thresholds, and insulation. Here is the breakdown.

  ### 1. The Fatal Objection: The Epistemic Inaccessibility of Ontology (Supervenience Failure)

  You correctly identified that your view denies that composition supervenes on the intrinsic properties and relations of the parts at a time. You need to understand the magnitude of this concession.

  Standard metaphysics (from Lewis to Sider) operates on a principle of **Synchronic Supervenience**: what exists at $t$ is determined by how things are arranged at $t$. If you deny this, you make ontology radically externalist.

  **The Consequence:** It becomes impossible in principle to know what objects exist in a room without knowing the entire causal history of every particle in that room.
  *   **The Case:** Imagine two exact intrinsic duplicates of a human being, Atom-for-Atom. On your view, one is a composite object (a person) and the other is merely an aggregate of simples, because one was born and the other was spontaneously assembled by a quantum fluctuation (or a very fast 3D printer) five minutes ago.
  *   **The Knockdown:** If there is no empirical test to distinguish a "Ratchet Composite" from a "Non-Ratchet Aggregate," then the distinction is ontologically idle. If they behave the same, think the same, and interact with the world the same, positing that one *exists* and the other *does not* is a distinction without a difference. You are multiplying entities (or denying them) based on a hidden variable (history) that has no synchronic footprint. This violates a methodological constraint shared by almost all metaphysicians: **Ontology should not outrun epistemology.** If God couldn't tell which one exists without checking the history book, the difference isn't in the *being*, it's in the *description*.

  **Verdict:** **Fatal.** Unless you can specify a synchronic physical marker that the history leaves behind (which would restore supervenience), you have made existence unknowable.

  ### 2. The Structural Objection: Insulation and Unfalsifiability

  You asked: *Is there anything that would actually count as the view being wrong, or is this the kind of thing that can absorb any case by quietly positing a convenient history?*

  It is the latter. This is the "Magic History" problem.
  *   **The Mechanism:** Any counter-example you face can be dissolved by stipulating a history.
      *   *Challenge:* "Why does this pile of sand not compose a heap?"
      *   *Ratchet Defense:* "Because it wasn't assembled via the right integrative process."
      *   *Challenge:* "Why does this corpse not compose an organism?"
      *   *Ratchet Defense:* "Because the ratchet slipped; the integration threshold was breached."
  *   **The Flaw:** A theory that explains everything explains nothing. If the existence conditions are path-dependent, and the path is not independently verifiable, the theory is insulated from evidence. You can always say, "The reason your intuition conflicts with my theory is that you are imagining the wrong history."
  *   **The Cost:** This turns metaphysics into storytelling. It removes the constraint that a theory of composition must align with our best physics. Physics is largely synchronic (state variables determine future states); your ontology is diachronic in a way physics is not.

  **Verdict:** **Fatal.** A metaphysical view that cannot be falsified by any conceivable arrangement of matter because it can always retreat into "hidden history" is dogmatic, not theoretical.

  ### 3. The Serious Objection: The Coincidence/Overcrowding Problem

  If composition is path-dependent, you are committed to massive coincidence in cases of convergence.
  *   **The Case:** Consider the machine bolted together in one go (Aggregate) vs. the grown machine (Composite). Suppose the bolted machine is *later* subjected to a process of gradual replacement until it matches the history of the grown one.
  *   **The Problem:** At the moment they are intrinsic duplicates, you say one is a composite and one is not. But what happens if the "Aggregate" undergoes the right process *later*? Does a composite object *pop* into existence around the existing parts?
  *   **The Consequence:** You have two objects occupying the same space. One came into existence at $t_1$ (the Ratchet), the other never comes into existence (the Aggregate), or perhaps it does later. This looks like the "Too Many Thinkers" problem but worse. It implies that for every "Ratchet" object, there is a shadow "Non-Ratchet" aggregate of the same parts that *almost* counts but doesn't.
  *   **Why it hurts:** It violates parsimony. You aren't just saying composition is restricted; you are saying there are "ghost" objects (the aggregates) that are mereological fusions but lack the status of "Composite" because of their biography.

  **Verdict:** **Serious.** A defender might concede this (accepting coincident objects), but it makes the view much less attractive than Universalism or Nihilism.

  ### 4. The Causal Objection: Exclusion and Idleness

  If the composite object exists only because of its history, what causal work does it do that the parts arranged that way do not?
  *   **The Dilemma:**
      1.  **If the Composite does no extra work:** Then it is an epiphenomenal shadow. Why posit it? The parts do all the lifting.
      2.  **If the Composite does extra work:** Where does the power come from? Does "having a history of integration" confer causal powers?
  *   **The Knockdown:** Causal powers usually supervene on intrinsic properties. A bomb explodes because of its chemical structure, not because it was assembled slowly. If your "Ratchet Composite" has different causal powers than the "Non-Ratchet Aggregate" (despite being intrinsic duplicates), you are positing **magic**. If they have the *same* powers, the distinction is causally inert.

  **Verdict:** **Serious.** You are forced to either accept epiphenomenal composites or deny that causal powers supervene on intrinsic properties. Both are bitter pills.

  ### 5. The Awkward Objection: Vagueness and the "Band"

  You suspect the "band" (the hysteresis gap) is doing hidden work. You are right.
  *   **The Problem:** If the threshold for *coming* to exist is higher than the threshold for *ceasing* to exist, there is a region of arrangement where an object can persist but not originate.
  *   **The Sorites:** Is this band sharp or vague?
      *   **If Sharp:** It is arbitrary. Why does removing *one* atom drop the object below the "origination" threshold but keep it above the "persistence" threshold? This looks like brute fact.
      *   **If Vague:** Then existence is vague. David Lewis argued famously that vague existence is impossible (because it implies vague identity, which is nonsense). If it's vague whether the parts compose a whole, it's vague how many objects exist.
  *   **The Work:** You are using the vagueness of the band to buffer the view against counter-examples. "Is this a heap? Well, it depends on the band." This is ad hoc.

  **Verdict:** **Awkward (Concedable).** Most restricted composition views accept some vagueness. You can concede this, but you must admit it makes the view less precise than Universalism.

  ### 6. The Category Error: Composition vs. Persistence

  Your friend in the pub was closer than you think.
  *   **The Critique:** You are solving the Special Composition Question (SCQ) with a theory of Persistence Conditions (Genidentity).
  *   **The Distinction:** SCQ asks: "When do $Xs$ compose $Y$?" (Synchronic). Persistence asks: "Is $Y$ at $t_1$ the same as $Y$ at $t_2$?" (Diachronic).
  *   **The Conflation:** Your view says $Xs$ compose $Y$ at $t$ *because* of the history of $Xs$. But history is a property of *persisting* things. You are presupposing the existence of the thing to explain its composition.
      *   To say "The parts compose a whole because they were integrated over time" assumes there was a "they" that persisted through the integration.
      *   If the parts didn't compose a whole *during* the integration, what was being integrated? Just the parts? If just the parts, why does their history matter for composition *now*?
  *   **The Result:** You haven't answered SCQ; you've changed the subject to "Under what conditions do we *label* a collection of parts as a persisting object?" This is linguistic or conceptual, not ontological.

  **Verdict:** **Awkward.** A defender can argue that composition *just is* a diachronic notion, but this requires redefining standard mereological terms.

  ---

  ### Summary of Costs and Concessions

  | Objection | Severity | Can a Defender Concede? |
  | :--- | :--- | :--- |
  | **Supervenience Failure** | **Fatal** | No. Denying this makes ontology unknowable and disconnects it from physics. |
  | **Insulation/Unfalsifiability** | **Fatal** | No. If no case counts against it, it isn't a theory. |
  | **Causal Exclusion** | **Serious** | Only if you accept epiphenomenal composites (heavy cost). |
  | **Coincidence/Overcrowding** | **Serious** | Yes, but makes the view messy (Too Many Objects). |
  | **Vagueness of Thresholds** | **Awkward** | Yes, standard cost for restricted composition. |
  | **Composition vs. Persistence** | **Awkward** | Yes, but requires redefining mereology. |

  ### Direct Answers to Your Specific Questions

  **1. Is it forced to deny supervenience?**
  **Yes.** Absolutely. That is the definition of your view.
  **How much does that cost?** Everything. It costs you the ability to link ontology to science. Science describes the state of the world at $t$. If what *exists* at $t$ depends on facts not contained in the state at $t$, then science cannot tell us what exists. You are positing a non-natural property ("Ratchet Status") that does not supervene on physical properties. This makes you a **Haecceitist** or a **Substance Dualist** regarding composites.

  **2. Is there anything that would count as the view being wrong?**
  **Currently, No.** As formulated, it is insulated.
  **How to fix it:** You need to specify a *physical marker* of "integration history." For example, "Composition occurs when entropy is locally reversed via internal feedback loops." If you can ground the "history" in a current physical state (like a specific entropy gradient or structural bond type), you restore supervenience and save the view from the "Fatal" objection. If you cannot, the view is metaphysically idle.

  **3. Is the vagueness of the band doing the work?**
  **Yes.** You are using the hysteresis band as a buffer to protect the intuition that organisms survive temporary death without committing to the view that corpses are organisms. The band allows you to say "It's still an organism" (persistence) without saying "A corpse could start as an organism" (origin). This is theoretically convenient but suspiciously tailored to save specific intuitions about biology.

  ### Final Verdict

  The Ratchet View is **metaphysically extravagant and epistemically opaque.** It solves the intuition pumps (Ship of Theseus, Suspended Animation) by brute-forcing the ontology to match our narrative intuitions rather than our physical understanding.

  To make it viable, you must:
  1.  **Ground the History:** Find a synchronic physical property that *tracks* the history (e.g., specific bond types, entropy states) to restore supervenience.
  2.  **Define the Band:** Give non-arbitrary criteria for the entry/exit thresholds, or admit the view is vague.
  3.  **Accept the Cost:** Admit that you are denying Humean Supervenience and that this makes your ontology incompatible with a purely structuralist physics.

  If you cannot do (1), the view is dead on arrival for anyone who thinks metaphysics should be continuous with science. If you can do (1), you no longer have a "Ratchet View" based on history; you have a "Structure View" based on current physical state, which collapses back into the static views you wanted to avoid. That is the trap.
