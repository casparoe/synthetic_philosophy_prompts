answer: |-
  ### Brainstorming: Families of View

  Before establishing the desiderata, we must map the logical space the specification occupies. The live families of view regarding the ontology of dispositions fall into five broad camps:

  1.  **Simple Conditional Analysis (CA):** Dispositions are analysed as counterfactual conditionals (if stimulated, then manifest). This is the naive baseline, largely abandoned due to counterexamples, but its repairs drive much of the debate.
  2.  **Reformed Conditional Analyses:** Attempts to save CA by adding 'ceteris paribus' clauses or appealing to causal bases (Lewis, Martin). These try to accommodate finks and masks without positing irreducible powers.
  3.  **Categoricalism (and Humeanism):** Properties are purely qualitative/categorical. Dispositional talk is a gloss on non-dispositional bases plus laws of nature. Dispositions are not ontologically fundamental.
  4.  **Dispositional Monism (Pandispositionalism):** All fundamental properties are dispositions/powers. There is no categorical 'glue'. Laws are internal to the properties (Dispositional Essentialism).
  5.  **Hybrid/Essence-Based Views:** Properties have both categorical and dispositional aspects (Identity Theory), or dispositions are defined by their functional role or teleological essence rather than mere conditionals.

  The specification below is designed to be neutral enough to allow these views to compete, but strict enough to rule out analyses that fail to capture the phenomena.

  ***

  ### Desiderata for a Theory of Dispositions

  The following requirements constitute the specification. Each entry identifies the requirement, the motivating consideration, the type of demand, and its status.

  #### 1. The Possibility of Unmanifested Dispositions
  *   **Statement:** A theory must allow that a disposition can exist genuinely even if its stimulus condition never obtains.
  *   **Motivation:** Solubility exists in sugar even if it is never immersed in water. If dispositions were merely actual manifestations or regularities, we could not distinguish between a thing that *would* break if struck and a thing that is never struck but would not break.
  *   **Type:** Explanatory Demand (Modal).
  *   **Status:** **Non-Negotiable.** Without this, the concept collapses into actualism or regularity, ceasing to be a theory of *potentiality*.

  #### 2. The Distinction between Disposition and Manifestation
  *   **Statement:** The theory must ontologically distinguish the power itself from the event of its manifestation.
  *   **Motivation:** The fragility of a glass is not identical to its shattering. The former persists until the latter occurs; the latter is an event, the former a property.
  *   **Type:** Conceptual Distinction.
  *   **Status:** **Non-Negotiable.** Collapsing the two eliminates the explanatory utility of dispositions (i.e., explaining *why* the manifestation occurred).

  #### 3. Accommodation of Finkish Cases
  *   **Statement:** The theory must distinguish between a disposition being removed by the stimulus (Fink) and a disposition persisting despite the stimulus.
  *   **Motivation:** A 'finkish' fragile glass is one wired to a sorcerer who makes it non-fragile the moment it is struck. The conditional 'if struck, it would break' is false, but intuitively the glass was fragile *before* the strike.
  *   **Type:** Case Intuition.
  *   **Status:** **Non-Negotiable.** A theory that cannot distinguish the loss of a power from the prevention of its effect fails to track the ontology of properties.

  #### 4. Accommodation of Masking and Antidotes
  *   **Statement:** The theory must allow that a disposition can persist even when its manifestation is prevented by extrinsic factors.
  *   **Motivation:** A poison retains its lethality even if an antidote is administered simultaneously. The stimulus is present, the disposition is present, but the manifestation is blocked.
  *   **Type:** Case Intuition.
  *   **Status:** **Non-Negotiable.** Failure here conflates the intrinsic nature of the object with the extrinsic conditions of its environment.

  #### 5. Rejection of Mimicking
  *   **Statement:** The theory must distinguish between a genuine disposition and a structural duplicate that manifests only due to extrinsic intervention (and vice versa).
  *   **Motivation:** A 'mimic' is a non-fragile glass wired to explode when struck. It satisfies the conditional 'if struck, breaks' but lacks the disposition. Conversely, a fragile glass protected by a force field breaks the conditional but retains the disposition.
  *   **Type:** Case Intuition.
  *   **Status:** **Non-Negotiable.** This ensures the disposition is grounded in the object's nature, not merely in its behavioural outcomes.

  #### 6. Multi-Track Capacities
  *   **Statement:** The theory must account for single dispositions that have multiple distinct stimulus-manifestation pairs.
  *   **Motivation:** Flammability involves responding to sparks, heat, or friction with fire. If every stimulus-manifest pair were a distinct disposition, objects would possess infinite properties.
  *   **Type:** Phenomenon to Explain.
  *   **Status:** **Non-Negotiable.** Required to match scientific practice where single properties (e.g., charge) explain diverse interactions.

  #### 7. Probabilistic and Propensity Dispositions
  *   **Statement:** The theory must accommodate dispositions that manifest only with a certain probability, not necessarily.
  *   **Motivation:** Radioactive decay is dispositional but indeterministic. A theory requiring deterministic manifestation conditions is inconsistent with quantum mechanics.
  *   **Type:** Scientific Consistency.
  *   **Status:** **Non-Negotiable.** Any metaphysics incompatible with fundamental physics is untenable.

  #### 8. Iterated Dispositions
  *   **Statement:** The theory must allow for dispositions to have other dispositions as their manifestations or stimuli.
  *   **Motivation:** A drug may have the disposition to cause a disposition (e.g., sensitisation). Fundamental powers may interact to produce new power configurations.
  *   **Type:** Explanatory Demand.
  *   **Status:** **Preference.** (Dispositional Monists require this; Categoricalists may reject it as reducible).

  #### 9. Dispositional Stimuli
  *   **Statement:** The theory must allow that the stimulus condition for a disposition can itself be a dispositional property.
  *   **Motivation:** Key-and-lock mechanisms. The key's shape (dispositional fit) stimulates the lock's opening (dispositional yield).
  *   **Type:** Phenomenon to Explain.
  *   **Status:** **Preference.** (Required for holistic power structures; Categoricalists will reduce stimuli to categorical configurations).

  #### 10. Intrinsicness of the Categorical Base
  *   **Statement:** The disposition must be grounded in properties intrinsic to the bearer, not merely relational facts.
  *   **Motivation:** To avoid triviality. If dispositions are purely relational, everything is disposed to do anything depending on how we describe the relation.
  *   **Type:** Explanatory Demand.
  *   **Status:** **Non-Negotiable.** Without an intrinsic base, dispositions float free of the objects that supposedly possess them.

  ***

  ### Test Case Analysis: The Pressure-Relief Valve

  **The Case:** A valve is disposed to open at pressure threshold $P$. However, the housing stiffens as pressure rises towards $P$, such that at $P$, the valve is physically incapable of opening. The prevention mechanism is triggered by the very same condition (pressure) that triggers the disposition.

  **Verdict:** The list exposes a gap regarding **system individuation** rather than forcing a clear Fink/Mask verdict, but the work is done by **Requirement 10 (Intrinsicness of the Categorical Base)**.

  **Analysis:**
  If the disposition belongs to the *valve mechanism* alone, the stiffening housing is an extrinsic masker (Requirement 4). The valve retains the disposition; the manifestation is blocked.
  If the disposition belongs to the *valve-housing system*, the system undergoes an intrinsic change upon stimulation (the housing stiffens). This looks like a Fink (Requirement 3): the system loses the disposition to open precisely when stimulated.

  **The Problem:** Requirement 10 forces us to locate the 'base' of the disposition. If the base is intrinsic, we must decide what the 'object' is. The case reveals that the Fink/Mask distinction relies on a prior metaphysical decision about object boundaries.
  **Critique of the Requirement:** Requirement 10 is doing too much work here. It is forcing an ontological verdict (Fink vs Mask) based on a mereological decision (what counts as the bearer). A complete theory needs a supplementary principle on *dispositional bearers* to resolve this. As it stands, the list allows a theorist to stipulate the bearer to save their preferred classification, which suggests the desiderata are under-specified regarding mereology.

  ***

  ### Consistency Check: Joint Satisfiability

  **Question:** Is any subset of the desiderata jointly unsatisfiable?

  **Answer:** No, the desiderata are jointly satisfiable, but satisfying them requires a robust metaphysics of **potentiality**.

  **Argument:**
  The primary tension lies between **Requirement 1 (Unmanifested Dispositions)**, **Requirement 7 (Probabilistic Dispositions)**, and **Requirement 10 (Intrinsicness)**.
  1.  **The Tension:** If a disposition is intrinsic (Req 10) and can exist unmanifested (Req 1), it must be a real feature of the object independent of its effects. However, if it is probabilistic (Req 7), its connection to its manifestation is not necessary. Critics (particularly Humeans) argue that an intrinsic property that does not necessitate its effect is occult—it does no explanatory work. They claim you cannot have intrinsic 'directedness' without necessity.
  2.  **The Resolution:** The set is satisfiable if one adopts a view of properties as *powers* rather than *categorical qualities*. On a Powers view, the intrinsic nature of the property *is* its directedness toward a manifestation, even if that directedness is probabilistic. The 'modal force' is not logical necessity but causal potency.
  3.  **Why they are compatible:** The probabilistic nature restricts the *frequency* of manifestation, not the *existence* of the power. The intrinsic base grounds the *range* of possible outcomes. Therefore, a property can be intrinsic, real without manifesting, and probabilistic, provided one accepts that properties can be essentially relational/potential in nature.
  4.  **Cost:** Satisfying this triad excludes Categoricalist and Humean views (see Scorecard). They must reject either Intrinsicness (making dispositions extrinsic relations) or Unmanifested Reality (making dispositions actual regularities). Thus, the satisfiability of the list depends on rejecting Categoricalism, but the list itself is internally consistent.

  ***

  ### Scorecard: Families of View

  | Family of View | Performance against Desiderata | Primary Failure Point |
  | :--- | :--- | :--- |
  | **Simple Conditional Analysis** | Fails to distinguish disposition from manifestation conditions. | Fails **Req 3 & 4** (Finks/Masks). Collapses disposition into conditional truth. |
  | **Categoricalism** | Treats dispositions as extrinsic or derivative. | Strains **Req 1 & 10**. Struggles to ground unmanifested potential in purely qualitative bases without laws. |
  | **Humeanism** | Reduces dispositions to regularities of events. | Fails **Req 1**. Cannot accommodate unmanifested dispositions as real features of the world. |
  | **Dispositional Monism** | Satisfies all non-negotiables robustly. | Strains **Req 8 & 9**. Risks making all properties opaque if everything is a power (individuation problems). |
  | **Hybrid / Identity Theory** | Satisfies most by positing dual-aspect properties. | Strains **Req 2**. Must explain how one property can be both purely categorical and purely dispositional without contradiction. |

  **Most Exclusionary Requirement:** **Requirement 1 (The Possibility of Unmanifested Dispositions).**
  This is the primary filter. Humeanism and strict Empiricist accounts fail here immediately, as they require actual manifestation or regularity to ground the truth of dispositional ascriptions. Any theory that cannot account for the reality of a power that never fires is excluded from the reading group's core consideration.
