answer: |-
  ### Weighted Decomposition of Perpetrator Conduct (Reserve Police Battalion 101)

  | Factor | Weight | Range | Tier |
  | :--- | :--- | :--- | :--- |
  | 1. Authority and legality | 0.15 | 0.10–0.20 | Substantial |
  | 2. Peer accountability | 0.20 | 0.15–0.25 | Central |
  | 3. Pre-existing hostility | 0.12 | 0.05–0.20 | Substantial |
  | 4. Cumulative brutalization | 0.08 | 0.04–0.12 | Minor |
  | 5. Division of labour | 0.03 | 0.01–0.05 | Negligible |
  | 6. Social price of declining | 0.17 | 0.12–0.22 | Central |
  | 7. Career and material interest | 0.02 | 0.00–0.05 | Negligible |
  | 8. The ratchet | 0.13 | 0.08–0.18 | Substantial |
  | 9. After-hours life of unit | 0.10 | 0.05–0.15 | Minor |
  | **Total** | **1.00** | | |

  **(a) Considerations per Factor**
  1.  **Authority:** Moves up because the state monopoly on violence was intact; moves down because direct coercion was rarely applied.
  2.  **Peer accountability:** Moves up because testimony consistently cites not wanting to appear weak before friends; moves down as some men did resist without immediate sanction.
  3.  **Pre-existing hostility:** Moves up due to pervasive antisemitic propaganda; moves down because many shooters expressed discomfort rather than zeal.
  4.  **Cumulative brutalization:** Moves up due to prior anti-partisan operations; moves down because Battalion 101's first major massacre occurred early in their deployment.
  5.  **Division of labour:** Moves up as it reduces cognitive dissonance; moves down because these men performed face-to-face shootings, not industrialized gassing.
  6.  **Social price:** Moves up because opting out was framed as cowardice; moves down because the formal penalty for opting out was officially null.
  7.  **Career interest:** Moves up as humans generally seek security; moves down because these were middle-aged reservists with little room for promotion.
  8.  **The ratchet:** Moves up because psychological commitment escalates with each step; moves down because the initial step (rounding up) was already morally compromising.
  9.  **After-hours life:** Moves up because bonding normalizes deviance; moves down because some men drank to forget rather than to celebrate.

  **(b) Functional Classification**
  *   **Enabling (Physically possible):** 1 (Authority), 5 (Division). **Aggregate Weight: 0.18**
  *   **Licensing (Permissible in own eyes):** 3 (Hostility), 4 (Brutalization), 8 (Ratchet), 9 (After-hours). **Aggregate Weight: 0.43**
  *   **Motivating (Likely to occur):** 2 (Peer), 6 (Social Price), 7 (Career). **Aggregate Weight: 0.39**
  *   **Greatest Aggregate Weight:** Licensing (0.43), suggesting the primary hurdle was internal moral permission rather than external capability or active drive.

  **(c) Critical Factor Removal**
  *   **Factor:** 2 (Peer accountability).
  *   **Judgement:** Removing this factor most reduces the outcome (participation rates), but its removal is historically incoherent; humans are inherently social, and a unit of comrades acting in view of one another cannot be modelled without peer dynamics.

  **(d) Substitutable Pairs**
  *   **Most Substitutable:** 2 (Peer accountability) and 6 (Social price of declining).
  *   **Reasoning:** Both operationalize the fear of ostracization; increasing the weight of one necessarily decreases the marginal explanatory power of the other.

  **(e) Flipping the Browning–Goldhagen Ranking**
  *   **Condition:** Factor 3 (Pre-existing hostility) would need a weight >0.35, exceeding the combined weight of situational pressures (2 and 6).
  *   **Evidence:** Uniform records showing high initiative and satisfaction across all units regardless of command pressure or opportunity to opt out, rather than the documented variance in reluctance found in Battalion 101.

  **(f) Additive Misleading Note**
  *   **Interaction:** The model implies independence, but Factor 3 (Hostility) modulates Factor 6 (Social Price); if cultural hatred is high, the social cost of *not* killing increases, meaning these weights are multiplicative rather than additive.
  *   **Test:** Compare participation rates in units with identical command structures but drawn from regions with measurably different pre-war voting patterns for antisemitic parties.

  ***

  ### Recomputations Under Modifications

  **Modification 1: Visible dissent without penalty (Comrades declined, suffered only transfer)**
  *   **Factor 6 (Social price):** 0.17 → 0.05 (The constraint is revealed as non-binding).
  *   **Factor 2 (Peer accountability):** 0.20 → 0.10 (The normative pressure collapses if peers opt out safely).
  *   **Factor 1 (Authority):** 0.15 → 0.25 (Weight shifts to the order itself as the primary remaining driver).
  *   **Factor 3 (Hostility):** 0.12 → 0.20 (Internal motivation must explain the continued participation of those who remain).

  **Modification 2: No culturally supplied hatred (Diffuse prejudice only)**
  *   **Factor 3 (Pre-existing hostility):** 0.12 → 0.02 (Goldhagen's variable is effectively nullified).
  *   **Factor 8 (The ratchet):** 0.13 → 0.18 (Psychological incrementalism must bear more burden for moral disengagement).
  *   **Factor 6 (Social price):** 0.17 → 0.22 (Situational pressure becomes the dominant explanation for compliance).

  **Modification 3: Remote killing (Crews never see victims)**
  *   **Factor 5 (Division of labour):** 0.03 → 0.15 (Physical distance becomes the primary mechanism of disengagement).
  *   **Factor 2 (Peer accountability):** 0.20 → 0.14 (Visibility of comrades' reactions to suffering is reduced).
  *   **Factor 9 (After-hours life):** 0.10 → 0.04 (Shared processing of face-to-face atrocity is less relevant).

  ***

  I expect Factor 3 (Pre-existing hostility) to be the most wrong, likely underestimated, as internal states are harder to document than external pressures. The figures imply that ordinary decency is credited mostly to circumstances, with personal moral agency accounting for less than half the variance in conduct.
