answer: |-
  ### Tier 1: Maximal Authorship (Self-Imposed or Deliberation-Enhancing)
  **6. A penalty-backed commitment contract the agent signs in advance against their own future defection.**
  *Justification:* The agent authors the constraint themselves, making the design aim identical to their own reflective will.
  **9. Requiring the agent to write down their reasons before the options are revealed to them.**
  *Justification:* This process forces deliberation without steering the outcome, ensuring the choice flows from the agent's own reasoning.

  *Differentiation:* These entries are distinct from Tier 2 because the constraint or structure is either self-imposed or strictly enhances internal reasoning, whereas Tier 2 mechanisms are designer-imposed structures that rely on the agent's passive acceptance of their own limitations.

  ### Tier 2: High Authorship (Benevolent Structural Steering)
  **1. Changing a workplace pension from opt-in to opt-out.**
  *Justification:* Upon reflection, agents often endorse leveraging their own inertia to achieve goals they already hold, even if the designer set the default.
  **2. Imposing a cooling-off period before a large purchase becomes final.**
  *Justification:* Agents can endorse a process that protects their future self from transient impulses, accepting the designer's aim to preserve their long-term interests.
  **10. Quietly removing paperwork that currently stands between the agent and a benefit to which they are already entitled.**
  *Justification:* While the "quiet" design hides the aim temporarily, agents reflectively endorse the removal of barriers to their own entitlements.

  *Differentiation:* These entries differ from Tier 1 because the designer initiates the structure rather than the agent, and they differ from Tier 3 because they remove friction or protect time rather than adding costs or effort to steer behavior.

  ### Tier 3: Moderate Authorship (Transparent Steering via Cost/Effort)
  **5. Leaving an option available but placing one extra form and one extra click in front of it.**
  *Justification:* This imposes an honest tax on effort that the agent can choose to pay, avoiding deception but still steering through friction.
  **11. Paying the agent to choose one way.**
  *Justification:* Financial incentives alter the payoff structure transparently, but may compromise authorship if the agent feels their intrinsic motivation is being crowded out.

  *Differentiation:* These entries are separated from Tier 2 because they actively add burdens or external rewards to influence choice, and they differ from Tier 4 because the mechanism of influence (effort or money) is transparent rather than psychologically opaque.

  ### Tier 4: Low Authorship (Psychological or Social Coercion)
  **3. Presenting identical factual information in loss terms rather than gain terms.**
  *Justification:* Even with full transparency of facts, exploiting cognitive biases to alter emotional valuation prevents the agent from endorsing the manipulative process.
  **7. Publicly disclosing an agent's non-compliance with a widely shared norm.**
  *Justification:* Social shaming coerces compliance through fear of reputation loss rather than internal reasoning, which agents rarely endorse as a legitimate choice architecture.

  *Differentiation:* These entries differ from Tier 3 because they bypass rational cost-benefit analysis by exploiting biases or social fears, and they differ from Tier 5 because they still leave the formal option to choose otherwise available.

  ### Tier 5: Negated Authorship (Removal of Choice or Exploitation of Vulnerability)
  **8. Removing the option from the menu altogether.**
  *Justification:* Eliminating a choice entirely makes endorsement of the process impossible, as there is no agency left to exercise.
  **4. A personalised message, timed using the agent's own behavioural data, sent at the moment they are most likely to act.**
  *Justification:* Targeting an agent at their moment of maximum vulnerability exploits incapacity rather than engaging agency, which cannot be reflectively endorsed.

  *Differentiation:* These entries are distinct from Tier 4 because they either eliminate the possibility of choice or target the agent when their capacity to choose is compromised, representing a total failure of the authorship test.

  ***

  ### Question 1: Divergence from Transparency-plus-Avoidability
  The two items my authorship criterion orders differently from a transparency-plus-avoidability criterion are **Item 3 (Framing)** and **Item 5 (Friction)**. A transparency-plus-avoidability framework would rank Item 3 higher than Item 5 because the facts are identical and there is no physical barrier to avoidance, whereas Item 5 imposes an effort cost. My authorship criterion inverts this, ranking Item 5 higher because honest friction respects the agent's reasoning process, whereas Item 3 manipulates the psychological weighting of reasons in a way an agent could not endorse upon reflection.

  ### Question 2: Impact of Shared Aims
  The placement that would change most if the designer's aim were enthusiastically shared is **Item 4 (Personalised Timing)**. Currently placed in Tier 5 because it exploits vulnerability, it would rise to Tier 2 if the agent shared the aim (e.g., a health intervention they requested), because targeting a moment of weakness becomes an endorsed form of support rather than predation.

  ### Question 3: Least Confident Placement
