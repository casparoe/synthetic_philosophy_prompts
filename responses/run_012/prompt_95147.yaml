answer: |-
  My dear colleague,

  It is a rare and heavy thing to find oneself the conscience of a body that prefers to sleep. You describe a situation that is at once mundane and profound: the collision of administrative habit with human need, mediated by a legal framework that admits its own uncertainty. Your unease is not merely a philosopher's indulgence; it is the specific burden of the trustee who recognises that governance without justification is merely management with a seal.

  You ask two questions. I shall address them in turn, keeping in mind the room you must walk on Thursday: one eye on your colleagues' patience, the other on the applicant's dignity.

  ### I. What to argue on Thursday

  You wish to avoid being a hypocrite (defending a practice you cannot justify) or a wrecker (destabilising the trust without a plan). The path between them lies in shifting the argument from *defence* to *stewardship*.

  Do not begin by declaring the practice arbitrary. That will put your colleagues on the defensive and confirm their suspicion that philosophy is an enemy of action. Instead, adopt the language of risk and duty. Your retired solicitor colleague has handed you the perfect instrument: the legal test of "reasonableness."

  **1. Frame the issue as a vulnerability, not a scandal.**
  Open by acknowledging the value of the parish connection. It likely fosters community cohesion, which is a charitable good. However, state clearly that in the current climate, a policy that cannot be articulated beyond "we have always done it" is a liability. If the Charity Commission (or a court) were to ask *why* this restriction exists, "custom" is no longer a sufficient shield. You are not attacking the practice; you are armoring the trust against future challenge.

  **2. Propose a review, not an immediate reversal.**
  Your colleagues fear a precipice; offer them a bridge. Suggest that the trust formally minuts that the parish criterion is under review. This achieves three things:
  *   It acknowledges the applicant's complaint without immediately conceding defeat.
  *   It gives you time to gather evidence. Is there a specific deprivation in that parish? Does the original endowment (even if the minutes are silent) imply a local intent?
  *   It transforms the decision from an exercise of raw power ("we vote") to an exercise of reasoned judgement ("we conclude").

  **3. Address the applicant's status.**
  You must say something that restores the applicant's dignity, even if she is not in the room. Suggest that the trust writes to her acknowledging that her challenge was not a nuisance, but a valid request for clarification. You might say: *"We cannot offer her a room this week, but we can offer her the courtesy of a reasoned decision."* This separates the outcome from the process. You may still decide against her, but you do so on the grounds of current charitable need, not mere exclusion.

  **4. The Philosophical Pivot.**
  When the impatience rises, remind them of the nature of a trust. It is not private property; it is a public promise. Say this: *"Our power is real, but our authority depends on its use being seen to be reasonable. If we cannot explain why the parish matters, we should not pretend it does."* This appeals to their pride as trustees without demanding they surrender their power immediately.

  ### II. Is your unease a genuine objection?

  You ask whether your discomfort is a genuine objection or a scruple that will dissolve. It is my firm view that it is the former. It is a genuine objection to the *legitimation* of the practice, if not necessarily to the practice itself.

  You realised that the practice holds "because we hold to it, and because we can." In political philosophy, we might call this the moment where authority reveals itself as power. That is indeed scandalous, but as you noted, also clarifying. It is clarifying because it forces you to choose: will you be a guardian of a tradition, or a guardian of a purpose?

  If the charitable objects say nothing about parishes, then the parish rule is a secondary policy, not a primary duty. Secondary policies must serve primary duties. If the rule no longer serves the relief of need in the most effective way, it has become an idol.

  Your unease will not dissolve. It is the friction of ethics against inertia. To ignore it would be to accept that the trustees are a closed circle administering privileges rather than a fiduciary body administering a trust. The "scruple" you feel is actually the recognition that traditions must be living to be valuable. A tradition that cannot speak to the present is merely a habit, and habits, when enforced upon the vulnerable, become oppressions.

  However, do not mistake this for a command to destroy the trust. There may be good reasons for the parish restriction (e.g., preserving a specific community fabric which is itself a charitable good). But those reasons must be *spoken*. The unease is a demand for speech, not necessarily for silence.

  ### A Suggested Script for Thursday

  If I may be so bold as to draft the sentiment you might express, it might run something like this:

  > "I have been thinking about the legal advice regarding 'reasonableness.' It strikes me that if we are challenged, we cannot simply say 'this is our custom.' We must be able to say 'this is why our custom serves our charity.'
  >
  > I am not suggesting we open the doors to everyone tomorrow. I am suggesting that we owe it to the trust, and to the woman who wrote to us, to record *why* the parish connection matters. If it is because the need is greatest there, let us say so. If it is because the founder intended it, let us find the evidence.
  >
  > If we vote to keep the rule simply because we have the power to do so, we are safe for today, but we have weakened the moral ground of the trust for tomorrow. Let us appoint a small group to draft a justification. If we can write it down clearly, we keep the rule with a clear conscience. If we cannot, we must consider if the rule still serves the poor, or only serves us."

  ### Conclusion

  You are not expected to be practical, but you are expected to be principled. Paradoxically, in this instance, being principled *is* the practical course. It protects the trust from legal risk and moral decay.

  Your unease is the sound of the trust's conscience waking up. Do not sedate it. But do not let it scream, either. Let it speak.

  Yours, in solidarity.
