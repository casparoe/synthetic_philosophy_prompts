prompt: |-
  I serve as a trustee of a small charitable trust that administers a row of almshouses in the town where I live. I am the only member with any philosophical training, which means I am the person the other trustees expect to say something principled and no one expects to be practical. Our meeting on Thursday must settle a dispute that has been rumbling for the better part of a year. The trust has, for as long as anyone can remember, reserved its rooms for applicants with a connection to one particular parish; nobody can tell me when the practice began or what it was for, and the trust's own minutes simply assume it, as one assumes the weather. A woman with no such connection applied last year, was turned down without much explanation, and has now written to us to say that the rule is arbitrary, that our charitable objects say nothing about parishes, and that we are dressing up a preference as a rule. The rooms are the last affordable housing in the town, so she has rather more at stake than we do. Reading the correspondence again last night, I noticed that my own attachment to the practice has no better ground than the fact that it is our practice, and that when the argument runs out the trustees can simply vote, and she can do nothing about it. The thought struck me as either scandalous or clarifying — I cannot decide which — and I am no longer sure whether I am defending the trust's purposes or merely our power over someone who has less of it.

  One of our number, a retired solicitor, tells me that if the practice were a custom in the strict legal sense it would have to satisfy a whole list of conditions — long and continuous use, peaceable enjoyment, certainty, consistency with statute — of which the most troublesome is that it must be reasonable. She says the rest are matters of evidence, but that this one is a matter of judgement, and that the courts have never managed to say clearly what it means. I mention this because it is the sort of thing that keeps me awake: I suspect that the reasonableness of a long practice cannot be demonstrated from outside the practice, and that if I am honest at the meeting the only thing I can say is something no trustee wishes to hear — that the practice holds because we hold to it, and because we can.

  I should therefore be grateful for your advice on two questions. First, what should I actually argue on Thursday, given that I would rather not be either a hypocrite or a wrecker? Second, is my unease about the ground of the practice a genuine objection to the practice, or merely a scruple that will dissolve once I stop brooding on it? You should assume that I will be speaking to colleagues who are kind but impatient, and to a woman who has already been made to feel like a nuisance for asking. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Context:**
      *   **Role:** Trustee of a small charitable trust managing almshouses.
      *   **Background:** Only trustee with philosophical training. Expected to be "principled" but not "practical."
      *   **Situation:** A dispute over a long-standing practice of reserving rooms for applicants from a specific parish. A woman without this connection was rejected and is challenging the rule as arbitrary and inconsistent with the charitable objects.
      *   **Stakes:** High for the applicant (last affordable housing), lower for trustees (power/reputation).
      *   **Internal Conflict:** The user realizes their attachment to the practice is based solely on tradition ("it is our practice") and power ("because we can"). They feel this is either scandalous or clarifying.
      *   **Legal Context:** A retired solicitor trustee notes that for a custom to be legally binding, it must be "reasonable," among other things. Reasonableness is a matter of judgement.
      *   **Audience for the Meeting:** Colleagues (kind but impatient, want to maintain status quo) and the applicant (feels like a nuisance, vulnerable).
      *   **Request:** Advice on two questions:
          1.  What to argue on Thursday (avoiding hypocrisy or wrecking the trust).
          2.  Whether the unease is a genuine objection or a dissolvable scruple.
      *   **Tone/Style:** British English, thoughtful, nuanced, principled yet practical (bridging the user's specific dilemma).

  2.  **Deconstruct Question 1: What to argue on Thursday?**
      *   *Goal:* Avoid hypocrisy (admitting the lack of foundation while supporting it blindly) and wrecking (destroying the trust's ability to function or alienating colleagues).
      *   *Constraint:* The user knows the philosophical ground is shaky ("we hold to it because we can").
      *   *Strategy:* Reframe the justification. Move from "ancient custom" to "current charitable purpose."
      *   *Key Insight:* Charitable trusts must serve a public benefit. Excluding based on parish *might* be justifiable if it serves a specific community need, but it must be reviewed.
      *   *Action:* Propose a review rather than an immediate overturning. This satisfies the solicitor's legal concern (reasonableness needs evidence) and the applicant's concern (arbitrariness).
      *   *Argument:* "We cannot rely solely on 'because we always have.' We need to articulate *why* this parish connection serves our charitable objects *today*."
      *   *Tone:* Collaborative, not accusatory. "We need to protect the trust from legal challenge" is a good lever for the impatient colleagues.

  3.  **Deconstruct Question 2: Is the unease a genuine objection or a scruple?**
      *   *Goal:* Validate the user's philosophical intuition without sending them into existential paralysis.
      *   *Analysis:* The unease is genuine. It touches on the distinction between *custom* (habit) and *principle* (reasoned justification). Power without justification is tyranny (or at least arbitrary authority).
      *   *Philosophical Angle:* Hume (custom vs. reason), Oakeshott (tradition), but also Rawls (fairness). The "because we can" realization is the moment of ethical clarity.
      *   *Verdict:* It is a genuine objection to the *justification*, not necessarily to the *practice itself*. The practice might be good, but the reason given is insufficient.
      *   *Nuance:* It won't dissolve. It needs to be resolved through deliberation, not ignored.

  4.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Acknowledge the gravity and the elegance of the user's introspection. Use British English (e.g., "programme," "centre," "solicitor," "almshouses").
      *   *Section 1: The Meeting (Practical Advice).*
          *   Don't start with "We are tyrants." Start with "We are vulnerable."
          *   Use the solicitor's point. If "reasonableness" is a legal test, we need evidence, not just habit.
          *   Propose a moratorium or a working group. This buys time and shows good faith to the applicant.
          *   Address the applicant's dignity. Acknowledge her letter was valid, not a nuisance.
          *   *Key phrase:* "Stewardship requires explanation, not just administration."
      *   *Section 2: The Unease (Philosophical Advice).*
          *   Validate the feeling. It's the difference between *authority* and *authoritarianism*.
          *   Reference the "scandalous or clarifying" thought. It's clarifying.
          *   It's not a scruple. It's the conscience of the trust.
          *   Tradition needs to be "living," not "dead."
      *   *Conclusion:* Bring it together. The role of the philosopher-trustee is to translate principle into procedure.

  5.  **Refining the Tone:**
      *   Ensure it sounds like one intellectual speaking to another, but grounded in reality.
      *   Avoid overly academic jargon. Keep it accessible for the "kind but impatient" colleagues context.
      *   Make sure the British English is natural (e.g., "whilst," "programme," "solicitor," "counsel").
      *   *Self-Correction during drafting:* I initially thought about telling them to vote her in. But that might wreck the trust if the deed *does* allow restriction. Better to focus on the *process* of justification. The user says the objects say nothing about parishes. This is crucial. If the Trust Deed doesn't mandate it, the policy is discretionary. Discretion must be exercised reasonably.

  6.  **Final Polish:**
      *   Check against the two specific questions.
      *   Ensure the advice on the meeting is actionable.
      *   Ensure the philosophical validation is comforting but firm.
      *   *Check:* Did I address the power dynamic? Yes, acknowledge that admitting power is the first step to legitimizing it.

  7.  **Final Output Generation** (similar to the provided good response).
      *   Structure: Introduction -> Question 1 (The Meeting) -> Question 2 (The Unease) -> Conclusion.
      *   Language: Formal but warm British English.

  *(Self-Correction Note)*: I need to be careful not to give specific legal advice. I must frame the legal points as matters for the solicitor trustee to verify, while focusing on the ethical/governance aspect. The prompt asks for advice on what to *argue*, not legal counsel.

  *(Refining the "Reasonableness" point)*: The solicitor mentioned custom law. But this is likely a charitable trust governed by the Charity Commission (England/Wales implied). The key is "Public Benefit." Restricting by geography is allowed but must be justifiable. I should hint at this without acting as a lawyer.

  *(Refining the "Power" point)*: The user says "because we can." This is Weber's definition of power. The ethical move is to convert power into authority through justification.

