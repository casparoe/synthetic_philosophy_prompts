answer: |-
  Good evening. For those of you who don't know me, I'm the Best Man. For those of you who do know me, you know that Dev has given me a specific brief. He is finishing a dissertation on Bradley's Regress, which is a metaphysical problem regarding unity. In plain English: if you say two things are held together by a bond, you have to explain what holds the bond to the things. And then what holds *that* connector to the bond. And so on, forever.

  So, Dev has issued a ruling. I am not allowed to say that "love," or "commitment," or "the bond between them" is what makes Dev and Maeve one unit. Because a bond is a relation, and relations require further relations, and he would rather I said something true than something that sounds lovely for ten seconds and then collapses under logical scrutiny.

  This puts me in a difficult position. Dev's mother, who is lovely and currently tearing up at the sight of the centerpieces, wants me to talk about fate. Maeve's family, who are farmers and practical people, want to know if the couple can fix a tractor. And Dev's advisor, who is sitting right there—hello, Professor—is grading this silently on whether I understand the assignment.

  So, I cannot tell you what binds them. I can only point to where they are standing.

  Consider the proposal. Dev had been rehearsing a speech for months. He had index cards. He had a location scout. But he proposed in the parking lot of a hardware store. He wasn't holding a ring box; he was holding a bag of washers. He'd gone in to fix a sink and came out engaged. Now, a cynic might say this is because he got distracted by the aisle signage. But I think it's the only way it could have happened. You cannot propose in the abstract. You can only propose in the middle of fixing something.

  And that is the only way to stop the regress. You stop looking for the glue. You look at the thing that is already built.

  Maeve is a pediatric nurse. She doesn't ask what metaphysical relation holds a child's body together; she asks if the IV is flowing. Dev spends his life asking what holds a proposition together. But when Dev got stuck on the roof of their first apartment last year—and he was stuck, truly, the ladder had slipped—Maeve didn't send up a theory of unity. She called the fire department. She dealt with the situation.

  If marriage were a third ingredient, a "bond" added to two people, we would be here all night asking what holds the marriage to the people. But marriage isn't an ingredient. It's the kitchen. It's the leaky radiator. It's the argument about whose turn it is to call the plumber. It is the shared practice that makes the question of "what holds us" irrelevant, because you have to be inside the practice to even ask it.

  The regress ends where the work begins.

  Dev, you wanted a toast that survives the scrutiny. Maeve, you wanted a husband who shows up. The rest of us just want to see you happy. But since I can't toast to happiness without defining it, and I can't toast to unity without invoking a relation, I will toast to the only thing that doesn't require a further explanation.

  To the ground you're standing on. To Dev and Maeve.
