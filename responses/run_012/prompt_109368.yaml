answer: |-
  Here is a complete workshop design tailored to your constraints and learning objectives. It is low-tech, discovery-based, and explicitly engineered to make the *differential cost* condition visceral.

  # Workshop Title: The Price of Honesty
  **Time:** 120 Minutes
  **Participants:** 24 (scalable to 12)
  **Room:** Seminar style, movable chairs (pairs needed).
  **Tech:** None required (Handouts only).

  ## 1. Materials List
  *   **Identity Cards (24 total):** 12 marked **TYPE H** (High Quality), 12 marked **TYPE L** (Low Quality). *Crucial:* Put these in opaque envelopes so only the holder sees them.
  *   **Decision Sheets (approx. 100):** Small slips of paper for recording choices each round.
  *   **Ledger Sheets (24 total):** One per student to track their "Fitness Credits."
  *   **Pens:** One per student.
  *   **Reward:** One large bar of chocolate (for the top 3 fitness scores).
  *   **Timer:** Your phone or watch.

  ## 2. The Payoff Structure (The Engine)
  This is the hidden logic you hold. Do not reveal this table to students until the final debrief.

  *   **Endowment:** Every student starts with **100 Fitness Credits**.
  *   **Roles:** In each round, students pair up. One is **Signaller** (holds the Type card), one is **Receiver**. Swap roles every round.
  *   **Receiver Payoff:**
      *   If they **ACCEPT** a Type H: **+20 Credits**.
      *   If they **ACCEPT** a Type L: **-20 Credits**.
      *   If they **REJECT**: **0 Credits**.
  *   **Signaller Payoff:**
      *   If Receiver **ACCEPTS**: **+30 Credits**.
      *   If Receiver **REJECTS**: **0 Credits**.
      *   **Signal Cost:** Depends on the Round (see below). Deducted regardless of acceptance.

  ## 3. Round-by-Round Timeline

  ### 0:00 – 0:15 | Setup & Endowment
  *   Distribute envelopes (Type H/L), Ledgers, and Decision Sheets.
  *   **Instruction:** "You are in a market of information. Signallers know their quality; Receivers do not. Your goal is to maximise Fitness Credits. Top 3 scores get the chocolate."
  *   **Pairing:** Arrange chairs in 12 pairs.
  *   **Rule:** No talking during decision phases. Decisions are written secretly and revealed simultaneously.

  ### 0:15 – 0:35 | Round 1: Cheap Talk (The Collapse)
  *   **Rule:** Signallers choose a **Signal Level (0, 1, or 2)**.
  *   **Cost:** **0 Credits** for everyone (H and L).
  *   **Process:**
      1.  Signaller writes Signal Level on sheet.
      2.  Receiver writes Accept/Reject.
      3.  Reveal. Calculate payoffs.
      4.  **Rotate:** Receivers become Signallers. New Type cards drawn (keep H/L ratio roughly even).
      5.  Repeat 3 times.
  *   **Expected Outcome:** All Signallers choose Level 2 (max signal). Receivers quickly realise signals are meaningless. Receivers switch to Reject (or randomise). Payoffs stagnate.
  *   **Mini-Debrief (5 mins):** Ask Receivers: "Did the signal help you?" (No). Ask Signallers: "Why did you signal high?" (To get accepted). **Point:** Without cost, information degrades to noise.

  ### 0:35 – 0:55 | Round 2: Uniform Cost (The Silence)
  *   **Rule:** Signal Levels 0, 1, 2 available.
  *   **Cost:** **10 Credits per level** for **BOTH** Type H and Type L.
  *   **Process:** 3 iterations, swapping roles.
  *   **Expected Outcome:**
      *   Type L: Signalling Level 2 costs 20. Reward is 30. Net +10. They *might* signal.
      *   *Correction for effect:* To ensure silence, make the cost **15 Credits per level**.
      *   Type L: Level 2 costs 30. Reward 30. Net 0. Risky.
      *   Type H: Level 2 costs 30. Reward 30. Net 0.
      *   *Result:* Nobody signals. Receivers get no info. Everyone stays at Level 0.
  *   **Mini-Debrief (5 mins):** "Why didn't the High Types signal to prove they were High?" Because it cost them too much relative to the gain. The cost was a barrier to *everyone*, not just the liars.

  ### 0:55 – 1:20 | Round 3: The Handicap (Differential Cost)
  *   **Rule:** Signal Levels 0, 1, 2 available.
  *   **Cost:**
      *   **Type H:** **5 Credits** per level.
      *   **Type L:** **15 Credits** per level.
  *   **Process:** 3 iterations, swapping roles.
  *   **The Math (Hidden):**
      *   If Signaller chooses Level 2:
          *   Type H Cost: 10. Net Profit (if accepted): 20.
          *   Type L Cost: 30. Net Profit (if accepted): 0.
      *   *Incentive:* Type L loses nothing by staying silent (0), but gains nothing by signalling (0). Type H gains 20 by signalling.
  *   **Expected Outcome:** Type H signals Level 2. Type L signals Level 0. Receivers learn to Accept Level 2, Reject Level 0. Trade happens.
  *   **The "Indignation":** Type H students will complain they "wasted" 10 credits. They didn't *need* to spend 10 to be honest, they spent 10 to *separate*.
  *   **Mini-Debrief (10 mins):** Ask Type H: "Why didn't you choose Level 1?" (Because L could afford Level 1). Ask Type L: "Why didn't you mimic?" (Too expensive). **Point:** Honesty is enforced by the *difference* in cost, not the cost itself.

  ### 1:20 – 1:35 | Round 4: Variant (Indices vs. Handicaps)
  *   **Setup:** Keep pairs.
  *   **Rule:** Introduce a new signal option: **"The Index."**
  *   **Mechanic:** Tell Type H students privately (via a slip of paper): "You are allowed to stand up while signalling." Tell Type L students: "You must remain seated." (Enforce this as a physical constraint of the game).
  *   **Cost:** 0 Credits for anyone.
  *   **Process:** 2 iterations.
  *   **Expected Outcome:** Perfect separation instantly. No credits spent.
  *   **Mini-Debrief (5 mins):** Contrast this with Round 3. Round 3 was *wasteful* but flexible. Round 4 was *efficient* but rigid. In biology, antlers are Round 3 (Handicap); a deep voice caused by testosterone is Round 4 (Index).

  ### 1:35 – 2:00 | Final Debrief & Theory Mapping
  *   **Board Work:** Draw the Cost/Benefit curves based on their ledger data.
  *   **Address the Critique:** "Is this unfalsifiable?"
      *   *Answer:* In the game, I set the costs. In nature, you must *measure* the cost. If you can't measure the differential cost, you haven't tested the hypothesis, you've just told a story. The game proves the *logic*, not that every peacock tail is a handicap.
  *   **The Waste:** Highlight the credits burned in Round 3. That waste is not a bug; it is the toll gate.
  *   **The Margin:** Explain that H didn't pay 10 credits because it was "fair," they paid it because that was the *marginal* point where L dropped out.

  ## 4. Scalability (If only 12 turn up)
  *   **Pairs:** You have 6 pairs. The dynamics hold perfectly.
  *   **Market Pressure:** With fewer players, "Reputation" might form (e.g., "I know Sarah is always Type H").
  *   **Fix:** Enforce anonymous re-matching every iteration. Collect cards, reshuffle, redeal. This prevents reputation from solving the problem without costs.

  ## 5. What the Activity Cannot Reproduce (Limitations)
  *Be explicit about these in the debrief so they don't over-generalise.*

  1.  **Population Dynamics:** The game is static. In reality, if too many H signal, the value of acceptance might drop, or the cost of signalling might change due to resource competition. We fixed the payoffs; evolution tweaks them.
  2.  **Genetic Inheritance:** Students choose rationally. In nature, strategies that fail get deleted from the gene pool. We are simulating the *equilibrium*, not the *path* to it.
  3.  **The Marginal Condition Nuance:** The game uses discrete steps (Level 1, 2). Real handicaps are continuous. The theory states the cost must be higher for L *at the margin* (the next unit of signal), not necessarily in total. You will have to explain that verbally.
  4.  **Condition Dependence:** In the game, Type is fixed. In nature, "Quality" fluctuates (health, nutrition). A Handicap signal tracks current condition, not just genetic type.

  ## 6. Predictable Failures & Mitigations

  **1. The "Loss Aversion" Freeze**
  *   *Risk:* Students hoard their 100 credits and refuse to spend on signals in Round 3, fearing a Receiver rejection.
  *   *Fix:* **The Endowment Effect.** Remind them at the start of Round 3: "The credits you spend are sunk. The only way to grow your stack is to be accepted. Hoarding guarantees you stay at 100. Signalling gives you a chance at 120."
  *   *Fix:* Make the Reward (30) significantly higher than the Cost (10 for H). The math must tempt them.

  **2. The "Game Theorist" Exploiter**
  *   *Risk:* One student (often a Philosopher or Math major) solves the Nash Equilibrium in Round 1 and announces "Signalling is useless," ruining the discovery for others.
  *   *Fix:* **Information Silos.** Collect decision sheets after *every single interaction*. Do not allow group discussion between iterations within a round. Only discuss *between* Rounds 1, 2, and 3.
  *   *Fix:* If they speak out of turn, penalise their Fitness Score by 5 credits. Enforce this lightly but visibly.

  **3. The "Collusion" Problem**
  *   *Risk:* A pair agrees "I'll always accept you, you give me half the profit."
  *   *Fix:* **Random Rematching.** After every single decision, one row of students shifts down one seat. You interact with a new partner every time. This mimics a large population and prevents side-deals.

  ## 7. Instructor Cheat Sheet (For the Board)

  **Round 1 (Cheap Talk):**
  *   Cost H = 0, Cost L = 0.
  *   Result: Pooling Equilibrium (Everyone signals).
  *   Lesson: Signals without costs carry no information.

  **Round 2 (Uniform Cost):**
  *   Cost H = High, Cost L = High.
  *   Result: No Signalling (or Pooling at 0).
  *   Lesson: Costs must not be prohibitive for the honest type.

  **Round 3 (Handicap):**
  *   Cost H = Low, Cost L = High.
  *   Result: Separating Equilibrium.
  *   Lesson: **$Cost_L > Benefit > Cost_H$**. The signal is honest because it is *differentially* costly. The waste is the toll.

  **Round 4 (Index):**
  *   Constraint H = Possible, Constraint L = Impossible.
  *   Result: Perfect Information, Zero Cost.
  *   Lesson: Indices are better than Handicaps, but biologically rarer (hard to link phenotype to quality without cost).

  ## 8. Addressing the "Unfalsifiable" Critique
  When the student raises the Zahavi critique again, use the game data:
  *"In this room, I could falsify the Handicap Principle. If I had made the cost for Type H higher than Type L in Round 3, the system would have collapsed. You would have seen High Types go silent and Low Types take over. The theory is falsifiable if you measure the costs. The criticism holds only when people assume a cost exists without measuring it. Your job as biologists is to be the auditor of this game, not just the player."*
