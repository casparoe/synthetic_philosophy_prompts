prompt: |-
  I have been trying to hold two ideas together, and I would like your help in working out what follows from them. The first is that certain utterances do not describe the world but enact something in it: to say "I promise" is not to report a promise but to make one, and such an utterance is answerable not to the facts but to the conventions that let it succeed. The second is that gender is performative in this same sense — that it is not a fact about a person which speech merely reports, but something brought into being by the repeated acts of naming and being named. Taken together, these seem to imply that a person's gender is real in the way a marriage is real after the words have been said, rather than in the way a stone is real whether or not anyone speaks of it.

  What I want to understand is the practical upshot. If gender is brought into being by performative acts, then it must be something one is doing, and so, in principle, something one could stop doing — as I might decline to make a promise and thereby not be bound by one. So I would like to know what it takes to stop. Is it a matter of refusing the relevant acts — declining to answer to the name, declining to occupy the role, declining to be addressed in a certain way — and if so, which acts are the load-bearing ones? Or does a performative work in a way that makes this harder than the analogy suggests?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Premise 1:** Speech Act Theory (Austin/Searle): Certain utterances are performative (e.g., "I promise") rather than constative (descriptive). They create reality through convention, not by matching pre-existing facts.
      *   **Core Premise 2:** Gender Performativity (Butler): Gender is not an internal essence reported by speech/behavior, but constituted by the repetition of stylized acts (naming, dressing, behaving).
      *   **Synthesis/Inference:** Therefore, gender is "real" like a marriage or a promise (social institution), not like a stone (brute fact).
      *   **The Question:** What is the *practical upshot*? specifically regarding *stopping*. If gender is something one *does*, can one *stop* doing it? What does it take to stop? Is it just refusing the acts? Or is it harder than that?

  2.  **Initial Assessment & Philosophical Context:**
      *   The user is essentially summarizing Judith Butler's *Gender Trouble* but pushing it towards a specific practical question about agency and cessation.
      *   *Potential Pitfall:* A common misunderstanding of Butler is that performativity implies voluntary choice (like putting on a costume). Butler explicitly argues against this. Performativity is *compulsory* and *citational*. It's not a singular act by a sovereign subject; it's a repetition of norms that precede the subject.
      *   *The "Stopping" Problem:* If gender is constitutive of the subject (the "I" who acts), can the "I" step outside the framework to stop it? Or does stopping just mean performing a *different* gender?
      *   *Analogy Check:* The marriage/promise analogy is useful but limited. You can break a promise, but you can't easily "break" gender without social sanction or unintelligibility.

  3.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the strength of the synthesis. It's a sophisticated reading of Austin via Butler. Confirm the "social reality vs. brute fact" distinction is accurate.

      *   **Addressing the "Voluntarism" Misconception (Crucial Step):**
          *   The user asks: "It must be something one is doing, and so, in principle, something one could stop doing."
          *   *Correction/Nuance:* This is the trickiest part. In speech act theory, I can choose not to say "I promise." In gender performativity, the "acts" are often done *to* us before we speak (naming at birth, pronouns used by others).
          *   *Key Concept:* Iterability and Citation. We cite norms. We don't invent them from scratch.
          *   *Key Concept:* The Subject. The "I" is formed *through* gendering. So the "I" cannot simply stand outside and quit.

      *   **What does it take to "Stop"? (The Practical Upshot):**
          *   *Option A: Refusal.* Refusing the name, the clothes, the pronouns.
          *   *Consequence:* Social unintelligibility. If you stop performing gender, do you become a non-person in the social sphere? (Butler's "abjection").
          *   *Option B: Subversion/Resignification.* Instead of stopping, you change the citation. Drag, non-binary labels, pronoun changes. This isn't "stopping" gender, but "doing" it differently.
          *   *Option C: The Burden of Labor.* It's not just *your* acts. It's the acts of *others*. If I stop calling you "he," but everyone else continues, the social reality persists. This breaks the "promise" analogy (which is bilateral) and moves to a collective institution (like marriage, which requires state recognition).

      *   **Refining the Analogy (Marriage vs. Stone):**
          *   The user's analogy is good. Let's deepen it.
          *   Marriage requires two parties + state. Gender requires the individual + the social world.
          *   You can't unilaterally divorce the social world's perception easily.
          *   *Load-bearing acts:* Who holds the weight? The individual or the audience? It's mostly the audience (interpellation).

      *   **Synthesizing the Answer:**
          1.  **Affirm the Ontology:** Yes, gender is institutional reality, not brute fact.
          2.  **Challenge the Agency:** It's not a voluntary "doing" like a hobby. It's a compulsory "doing" like breathing air (you can hold your breath, but you can't stop needing air).
          3.  **The "Stopping" Mechanism:**
              *   *Unilateral cessation is impossible:* Because others perform your gender onto you.
              *   *Resignification is the path:* Changing the *terms* of the performance.
              *   *The Cost:* Sanction, violence, unintelligibility.
          4.  **Load-Bearing Acts:** It's not just internal acts. It's the *recognition* by others. The "felicity conditions" (Austin) must be met by the community.

  4.  **Review against Constraints:**
      *   Tone: Philosophical, analytical, respectful, nuanced.
      *   Avoid: Oversimplifying Butler (don't say "gender is a choice").
      *   Focus: The practical upshot of the "stopping" question.

  5.  **Self-Correction/Refinement during drafting:**
      *   *Thought:* Should I mention Althusser (Interpellation)?
      *   *Decision:* Yes, it helps explain why you can't just "stop." The "Hey you!" moment happens before you choose.
      *   *Thought:* Is the promise analogy totally wrong?
      *   *Decision:* No, it's right about *ontology* (social fact), but wrong about *agency* (unilateral control). A promise needs a listener to accept it. Gender needs a society to recognize it.
      *   *Refinement:* Make sure to distinguish between "gender identity" (internal sense) and "gender performativity" (social constitution). The prompt is about the latter.

  6.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "opting out" and "subverting" is clear. (Proceed to generate output based on these thoughts.)

      *   *Key quote to keep in mind:* "There is no doer behind the deed." (Nietzsche/Butler).
      *   *Key concept:* Felicity Conditions.

  7.  **Final Structure:**
      *   Introduction: Validate the synthesis (Austin + Butler).
      *   The Trap of Voluntarism: Why "stopping" isn't like dropping a hobby.
      *   The Role of the Audience: Gender is co-constituted.
      *   Felicity Conditions & Sanction: What happens when you break the convention?
      *   Resignification vs. Cessation: The practical path forward.
      *   Conclusion: Summary of the "weight" of gender.

  8.  (Self-Correction post-drafting): Ensure I don't sound like I'm dismissing the user's agency. The point is that agency exists *within* the structure, not outside it.

  9.  *Final check on the "Load-bearing" question:* Which acts matter? Naming, pronouns, bodily presentation, but crucially *recognition*.

  10. *Ready to write.*
answer: |-
  This is a sophisticated synthesis of J.L. Austin's speech act theory and Judith Butler's theory of gender performativity. You have correctly identified the ontological status of gender in this framework: it is an **institutional fact** (like money, marriage, or citizenship) rather than a **brute fact** (like gravity or geology).

  However, the practical upshot regarding "stopping" is where the analogy to a promise encounters friction. If gender were exactly like a promise, a sovereign individual could simply decline to say the words and remain unbound. But gender performativity is more complex than a singular speech act.

  Here is an analysis of what follows from your premises, specifically regarding the possibility of cessation, the distribution of agency, and the "load-bearing" acts.

  ### 1. The Trap of Voluntarism
  The first hurdle is the assumption that because gender is something one *does*, it is something one *chooses* to do in a voluntary sense.

  In Austin's model, to say "I promise" requires a subject who decides to speak. In Butler's model, however, the "subject" is actually *produced* by the gendered acts. As Butler argues, there is no "doer behind the deed"; the doer is constructed through the deed. You are interpellated (hailed) as a gendered subject before you have the capacity to consent. A doctor says "It's a girl" at birth; parents choose a name; strangers use pronouns.

  Therefore, you cannot "stop" gender in the way you can stop making promises, because you are not standing outside the system holding the tool. You are inside the system, and the system is using you to reproduce itself. To "stop" entirely would not result in a neutral state; it would likely result in **social unintelligibility**. In a world where personhood is gendered, to have no gender is to risk ceasing to be recognized as a person.

  ### 2. The Audience and Felicity Conditions
  You asked if it is a matter of refusing the relevant acts. This touches on Austin's concept of **felicity conditions**. For a performative to succeed (for a promise to bind, or a marriage to hold), certain conventions must be in place, and crucially, **the audience must accept the procedure.**

  *   **The Promise:** If I say "I promise" but you do not hear me, or you do not accept the social convention of promising, no promise exists.
  *   **The Gender:** If I decline to wear dresses, but my community continues to address me as "she" and treat me according to the norms of womanhood, my gender (in the social sense) persists.

  This reveals the second major constraint on "stopping": **Gender is co-constituted.** It is not solely your performance; it is the audience's recognition. You can refuse to cite the norms (stop shaving, stop using certain pronouns), but if the social world continues to cite them *on your behalf*, the performative reality holds. The "load-bearing" acts are not just yours; they are distributed across everyone who interacts with you.

  ### 3. What Does It Take to "Stop"?
  If unilateral cessation is impossible because the audience can override your refusal, what are the practical options? There are three distinct paths, each with different costs.

  #### A. Abjection (The Strike)
  You can attempt to refuse all gendered acts. You decline the name, the pronouns, the clothing codes, the behavioral norms.
  *   **The Upshot:** This is the closest to "stopping." However, because social reality relies on shared conventions, this often leads to what Butler calls **abjection**. You become the "constitutive outside." You are not seen as "genderless"; you are seen as "failed," "confused," or "monstrous."
  *   **The Cost:** High social sanction. The world tries to force you back into the binary because your unintelligibility threatens the stability of the system.

  #### B. Resignification (The Subversion)
  Rather than stopping the performance, you change the citation. This is the drag queen, the non-binary person, or the feminist who uses "Miss" ironically. You use the existing vocabulary but break the expected syntax.
  *   **The Upshot:** You expose the performative nature of gender to others. By exaggerating or mixing the signs, you reveal that the "natural" gender of others is also a performance.
  *   **The Cost:** This requires constant labor. You are not "off the hook"; you are now fighting the current rather than swimming with it. You are still doing gender, but you are doing it *trouble-makingly*.

  #### C. Migration (The Transition)
  You attempt to shift from one set of performative conventions to another.
  *   **The Upshot:** This acknowledges that you cannot stop *being* gendered, so you change *which* gender you are performing.
  *   **The Cost:** This requires the "felicity conditions" of the new category. You must convince the audience to accept the new performative. This is why "passing" is often a safety mechanism: it secures the audience's cooperation in the new performance.

  ### 4. Which Acts are Load-Bearing?
  You asked which acts are the ones that sustain the reality. If gender is a collective hallucination maintained by ritual, which rituals matter most?

  1.  **Naming and Pronominalization:** This is the most potent speech act. To be named is to be placed in a lineage and a category. Refusing a name is a radical act, but being *named by others* against your will is a powerful enforcement mechanism.
  2.  **Bodily Stylization:** How you walk, sit, occupy space, and dress. These are the "silent" performatives that reinforce the spoken ones.
  3.  **Recognition:** The most load-bearing act is actually the act of **looking**. When someone looks at you and "sees" a man or a woman, they are completing the circuit. Your refusal can short-circuit this, but their persistence can override it.

  ### Conclusion: The Weight of the Social
  Your intuition is correct: gender is real like a marriage is real. But the practical upshot is not that you can simply dissolve the marriage unilaterally.

  To extend your analogy: You cannot dissolve a marriage simply by saying "I'm done." You need the state (the social structure) to recognize the dissolution. Similarly, you cannot "stop" gender simply by ceasing your own acts, because the "state" (the social world) continues to enforce the contract upon you.

  **To stop doing gender is not to become free of it; it is to enter into a conflict with the conventions that sustain reality.** The "freedom" found in performativity is not the freedom to exit the game, but the freedom to play it differently—to expose the rules as rules, rather than laws of nature. The burden is not just on the actor to stop acting, but on the audience to stop casting. Until the audience changes, the show goes on, regardless of whether you wish to leave the stage.
