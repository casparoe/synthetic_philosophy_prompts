answer: |-
  You have stumbled into the precise friction point where analytic number theory grinds against the philosophy of induction. Your tentative principle—genericity versus hidden structure—is not merely a restatement of "it works when it works," but it is insufficiently sharp to do the work you require of it. It lacks a metric for *where* the structure hides and *how* it interferes.

  Here is the principle that actually governs your intuitions, followed by the necessary corrections to your verdicts. Some of your confidence is misplaced; some of your scepticism is misdirected.

  ### The Principle: Signal-to-Noise Dominance

  A probabilistic heuristic in arithmetic is trustworthy if and only if the **arithmetic signal** (the main term derived from global density) dominates the **arithmetic noise** (the error term arising from local correlations and spectral structure).

  When the signal is strong (e.g., the expected number of solutions grows), the specific distribution of the noise matters little; the "law of large numbers" for arithmetic objects washes out the conspiracies of the small primes. When the signal is weak or zero (e.g., you are looking for a bound on an error term, or a property of a sparse sequence), the heuristic becomes blind to the spectral structure (zeros of $L$-functions) which *becomes* the signal.

  This is a refinement of your "genericity" intuition. It specifies that "structure" is dangerous only when it accumulates to overwhelm the probabilistic expectation.

  ### Testing Your Verdicts

  Let us apply this to your list. I shall be direct.

  **1. Prime Density ($1/\ln N$)**
  *   **Verdict:** Trusted.
  *   **Analysis:** The signal is the density itself. There is no "error term" here to speak of in the heuristic sense; you are defining the model's parameter by the known asymptotic. This is trivially safe, provided you accept the Prime Number Theorem.
  *   **Status:** **Survives.**

  **2. Twin Primes (Independence + Correction)**
  *   **Verdict:** Trusted qualitatively.
  *   **Analysis:** The expected number of twin primes up to $N$ is $\int^N \frac{dt}{(\ln t)^2}$. This diverges. The "noise" comes from local congruences (e.g., $n$ and $n+2$ cannot both be divisible by 3). This is handled by the Hardy-Littlewood singular series (the correction factor). Because the integral diverges, the signal dominates the noise. Even if the noise fluctuates wildly, the sum goes to infinity.
  *   **Status:** **Survives.** The correction factor is precisely the "local structure" your principle demands be accounted for.

  **3. Goldbach (Sum of Primes)**
  *   **Verdict:** Trusted.
  *   **Analysis:** Similar to Twin Primes. The expected number of representations grows as $N/(\ln N)^2$. The signal is strong. The probability that a specific $N$ has *zero* representations decays rapidly enough that, by a Borel-Cantelli argument, we expect only finitely many exceptions.
  *   **Status:** **Survives.**

  **4. The Mertens Conjecture (Möbius Random Walk)**
  *   **Verdict:** Distrusted (Heuristic thought to imply Conjecture; Conjecture is False).
  *   **Analysis:** Here is where you have erred, and I must be blunt. **The probabilistic heuristic does not predict the Mertens Conjecture.**
      If $\mu(n)$ are independent random signs, $M(x)$ is a simple random walk. By the Law of the Iterated Logarithm, a random walk satisfies $\limsup_{x\to\infty} \frac{|M(x)|}{\sqrt{2x \log \log x}} = 1$ almost surely.
      The random model predicts that $|M(x)|$ will exceed $\sqrt{x}$ infinitely often. The Mertens Conjecture ($|M(x)| < \sqrt{x}$ for all $x$) is *stronger* than the random walk prediction. The heuristic actually **predicted the falsity of the conjecture**, not its truth.
      Your intuition that this case is "different" is correct, but your reasoning is flawed. The failure of Mertens is not because the random model is blind to structure (though it is); it is because you asked a question about the *extremal behaviour of the noise*. When the signal is zero (cancellation of $\mu$), the "noise" *is* the object of study. In this regime, the spectral structure of the Riemann zeta function (the explicit formula) dictates the oscillations of $M(x)$. The random model ignores the zeros; the zeros determine the bound.
  *   **Status:** **Verdict Survives, Reasoning Collapses.** You are right to reject the conjecture, but wrong to think the heuristic supported it. The heuristic was more accurate than you gave it credit for.

  **5. Primes in Short Intervals**
  *   **Verdict:** Mixed (Good at coarse scales, bad at fine structure).
  *   **Analysis:** Here the signal is weak. In an interval of size $H \approx \ln N$, the expected number of primes is constant. The "noise" (variance) is of the same order as the mean. In this regime, the irregularities of primes in arithmetic progressions (Maier's Matrix Method) dominate. The Cramér model assumes primes are distributed independently locally, but they are repelled by small prime moduli in a way that accumulates over ranges larger than the modulus.
  *   **Status:** **Survives.** Your scepticism is warranted by the Signal-to-Noise principle. The signal is too weak to drown out the arithmetic structure.

  ### The Uncomfortable Sacrifice

  You asked which verdicts you must give up. The principle forces you to equalise your confidence in **Goldbach** and **Mertens** regarding the *reliability of the method*, even if the *conclusions* differ.

  You treat the Goldbach heuristic as "virtually proof" and the Mertens heuristic as "suspect." But structurally, they rely on the same assumption: that the primes (or Möbius values) do not conspire to create a global obstruction that the local model cannot see.
  *   For Goldbach, a conspiracy would mean primes align to avoid summing to $N$.
  *   For Mertens, a conspiracy means $\mu(n)$ aligns to keep the sum small.

  The reason Goldbach feels safer is not that the heuristic is better, but that the **conspiracy required to break Goldbach is much larger** (it must kill a growing main term) than the conspiracy required to break Mertens (it must only constrain the error term).
  **The Hard Truth:** You cannot claim the heuristic *justifies* belief in Goldbach while claiming it *fails* for Mertens. The heuristic works in both cases to predict the *average* behaviour. It fails in both cases to rule out *exceptional* behaviour driven by spectral structure. You must downgrade your confidence in Goldbach from "convincing" to "convincing conditional on no massive spectral conspiracy," which is exactly the same epistemic status as the Möbius randomness.

  ### Predictions for New Cases

  Applying the **Signal-to-Noise Dominance** principle:

  **1. Are the digits of $\pi$ normal?**
  *   **Analysis:** There is no known arithmetic signal linking the $n$-th digit to the $m$-th digit in base 10. $\pi$ is transcendental; it lacks the algebraic structure that creates correlations in, say, $\sqrt{2}$. The "signal" for non-normality is zero. The "noise" (chaotic dynamics of the digits) dominates.
  *   **Prediction:** **Yes, they are normal.** The heuristic is highly trustworthy here because there is no obvious "arithmetic structure" to act as a hidden variable. The burden of proof lies on finding a conspiracy, and none exists in the known dynamics.

  **2. Are there infinitely many Fermat primes?**
  *   **Analysis:** The sequence is $F_n = 2^{2^n} + 1$. The density is roughly $1/\ln F_n \approx 1/2^n$. The sum of probabilities $\sum 1/2^n$ converges.
  *   **Signal-to-Noise:** The expected number of *additional* Fermat primes is finite (roughly constant). The signal is weak (convergent sum). However, unlike Mertens, this is an existence claim derived from a convergent expectation. By Borel-Cantelli, we expect finitely many.
  *   **Prediction:** **No, there are finitely many.** The heuristic is trustworthy because the "structure" (the specific form $2^{2^n}+1$) is fully accounted for in the density estimate. There is no hidden spectral parameter to drive the count to infinity.

  **3. Do the Zeta zeros behave like Random Matrix eigenvalues?**
  *   **Analysis:** This is the deepest case. The "objects" are the zeros. The "model" is the Gaussian Unitary Ensemble (GUE).
  *   **Signal-to-Noise:** The Montgomery-Odlyzko law suggests the pair correlation matches GUE. Here, the "arithmetic structure" (the primes, via the explicit formula) *creates* the randomness. The zeros are random *because* the primes are random.
  *   **Prediction:** **Yes, at the limit.** However, your principle must flag a warning: at *finite* heights, there are deviations (the "signal" of the primes' small-scale structure). The heuristic is trustworthy for statistical properties (spacing distributions) but unreliable for specific values (the location of the first zero, or bounds on the gap). It is trustworthy for "noise" properties, untrustworthy for "signal" properties.

  ### Summary

  Your gut is mostly correct, but your justification was loose.
  1.  **Adopt the Signal-to-Noise Principle.** Heuristics work when the main term swamps the error term.
  2.  **Correct your view on Mertens.** The random model predicted the conjecture was false. The failure was in the *Conjecture*, not the *Heuristic*.
  3.  **Equalise your epistemic risk.** Goldbach and Mertens stand on the same probabilistic foundation. The only difference is the magnitude of the conspiracy required to falsify them.
  4.  **Accept the limits.** Probabilistic models are excellent for "Almost All" statements and "Infinitely Many" statements. They are swindles when applied to "For All" statements (Mertens) or "Every Interval" statements (Maier).

  You wanted a principle that tells you when to trust the swindle. The answer is: trust it when you are counting, distrust it when you are bounding.
