answer: |-
  ### 1. Essay Question

  **Question:**
  Distinguish explicitly between **evidential cluelessness** and **evaluative cluelessness**. Assess the claim that the three standard replies to the cluelessness objection—maximizing expected value, identifying robustly good actions, and arguing that cluelessness afflicts all moral theories—are effective against the former but fail against the latter. Defend a verdict on whether evaluative cluelessness undermines consequentialism in a way evidential cluelessness does not. Your answer must apply this reasoning to a concrete decision scenario involving long-term consequences.

  ***

  ### 2. Model Answer

  The cluelessness objection argues that agents cannot know enough about the future to maximize the good. To assess whether this destroys consequentialism, we must distinguish two forms. **Evidential cluelessness** is empirical ignorance: the causal chain is too complex to trace, so the agent lacks data on what will happen. **Evaluative cluelessness** is axiological ignorance: the agent knows the empirical facts but cannot rank the outcomes because the value theory lacks an ordering mechanism, often due to infinite values, astronomical numbers, or incommensurable goods. My verdict is that while standard replies neutralize evidential cluelessness, evaluative cluelessness remains fatal because it attacks the theory's internal coherence rather than the agent's epistemic limits.

  The first reply suggests agents should maximize expected value rather than actual value. This works for evidential cluelessness. Even if I cannot know whether saving a stranger will lead to disaster, I can assign probabilities to known outcomes and calculate the expectation. However, this fails against evaluative cluelessness. Expected value requires assigning utilities to outcomes. If the value theory cannot rank outcome A against outcome B (perhaps because A involves an infinite sequence of lives and B involves a finite sequence of higher quality lives), there is no utility number to plug into the equation. You cannot maximize an expectation over unordered values.

  The second reply argues for robustly good actions: deeds that are likely good across a wide range of empirical scenarios. This also solves the evidential problem. I need not trace the causal chain if reducing suffering is good in almost every possible world consistent with the facts. But robustness presupposes a stable value ranking. If evaluative cluelessness arises because the theory treats certain goods as incommensurable, an action cannot be "robustly" better if "better" is undefined in the relevant range. For instance, if preserving a culture and maximizing aggregate welfare are incommensurable, an action promoting the former is not robustly good; it is simply incomparable.

  The third reply is the *tu quoque*: every moral theory faces uncertainty, so consequentialism is not uniquely disadvantaged. This holds for evidential cluelessness; deontologists also struggle to know if a lie will prevent a murder. But evaluative cluelessness is specific to maximizing theories. A deontologist needs only to know if an act falls under a rule; they do not need to rank the total value of the resulting universe. If consequentialism demands a ranking that its value theory cannot supply, the failure is internal. Claiming others have empirical ignorance does not excuse an axiological breakdown.

  Consider a concrete decision: allocating resources to prevent human extinction versus alleviating current poverty. An evidentially clueless agent doesn't know if extinction prevention works. The expected value reply handles this by weighting the probability of success against the value of the future. However, suppose the future contains astronomically many lives. Evaluative cluelessness arises if the theory cannot compare a finite amount of intense suffering now against an infinite or unbounded future population. If the value theory treats infinite populations as unordered or incomparable to finite ones, the agent cannot rank the options. The "robustly good" reply fails because alleviating poverty is not robustly better if the future value is undefined. The *tu quoque* fails because a non-consequentialist could prioritize the present duty without needing to compare total宇宙 values. Thus, the agent is paralyzed not by lack of data, but by lack of a metric.

  **What Would Change My Verdict**
  My verdict relies on the assumption that consequentialism requires a complete ordering of outcomes to function. If it were shown that consequentialism could operate with partial orderings—permitting rational choice even when some outcomes are incomparable—then evaluative cluelessness would reduce to evidential cluelessness (uncertainty about which comparable branch we are on). Additionally, if a specific value theory (such as a specific form of critical-level utilitarianism) were proven to successfully order infinite outcomes without paradox, the objection would collapse. My reasoning is most likely to fail if "maximization" can be decoupled from "complete ranking," allowing agents to act rationally despite evaluative gaps.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20**

  1.  **Distinction Clarity (3 marks):** Clearly defines evidential (empirical ignorance) vs. evaluative (axiological/value ignorance) cluelessness.
      *   *Loss:* Conflating the two as merely "not knowing the future" or treating evaluative as just hard empirical math.
  2.  **Expected Value Reply Analysis (3 marks):** Explains why probabilistic weighting solves empirical uncertainty but fails when utilities are unordered/incommensurable.
      *   *Loss:* Asserting expected value solves all uncertainty without addressing the input requirement for utilities.
  3.  **Robust Goods Reply Analysis (3 marks):** Explains why robustness relies on stable value rankings across scenarios, which evaluative cluelessness denies.
      *   *Loss:* Treating robustness as purely empirical stability without noting the need for a consistent value metric.
  4.  **Tu Quoque Reply Analysis (3 marks):** Distinguishes external epistemic limits (shared by all theories) from internal axiological requirements (specific to consequentialism).
      *   *Loss:* Accepting the *tu quoque* without distinguishing between empirical uncertainty and value theory failure.
  5.  **Concrete Application (4 marks):** Applies the distinction and verdict to a specific case (e.g., extinction vs. poverty) showing where the paralysis occurs.
      *   *Loss:* Using a vague example or failing to show how evaluative cluelessness specifically blocks the decision in that case.
  6.  **Verdict Change Section (4 marks):** Explicitly identifies a condition (e.g., partial ordering, solved infinite value theory) that would reverse the conclusion.
      *   *Loss:* Omitting this section, making it generic ("new evidence"), or failing to link it to the core argument.

  **Recurring Confusions (Cap Rule):**
  Candidates who treat evaluative cluelessness as merely "harder" evidential cluelessness (e.g., claiming it is just too much data to process) cannot score higher than 10/20. Candidates who attribute arguments to named authors (e.g., "Greaves says...") in a closed-book exam will have 5 marks deducted from the total.

  **Competent vs. First-Class:**
  A competent answer correctly lists the replies and applies the distinction; a first-class answer demonstrates why the failure of the replies against evaluative cluelessness is structural to consequentialism rather than merely practical.
