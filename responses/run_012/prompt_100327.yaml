answer: |-
  The room was kept at a precise sixty-eight degrees, but Elias complained of the chill only in the way one might note the barometric pressure. He sat on the examination table, his left hand resting on a white pad, palm up. Dr. Aris Thorne held the thermal probe against Elias's thenar eminence.

  "Ramp to forty-five Celsius," Thorne said to the console. The machine hummed.

  Elias watched the device. He did not flinch. He did not withdraw his hand. The skin began to pinken, a slow bloom of erythema spreading beneath the metal circle.

  "Report," Thorne said.

  "Sharp," Elias said. His voice was level, the tone of a man reading a grocery list. "Stinging. Localized to the contact point. Intensity is... seven out of ten."

  "Does it hurt?" Sarah asked. She was standing by the window, her arms crossed tightly over her chest. She hadn't blinked in thirty seconds.

  Elias turned his head to look at her. His eyes were clear, the pupils normal. "It possesses the qualities of what you call hurt. But it does not hurt me."

  "Distress level?" Thorne asked, ignoring Sarah for the moment.

  "Zero," Elias said. "It is information. The tissue is reaching a threshold. I am aware of the threshold."

  Thorne lifted the probe. The skin beneath was bright red, a perfect circle of injury. He touched it with a gloved finger. "If I press here, does it feel like damage?"

  "It feels like pressure on heated tissue," Elias said. "It is distinct from pressure on cool tissue. But there is no imperative to stop you."

  Sarah pushed off the window frame. "He's burning you, Elias. Look at the redness."

  "I see it," Elias said. He rotated his hand, inspecting the mark with the detached curiosity of a mechanic examining a worn gasket. "It will blister if the exposure continues. That is a factual outcome."

  "It's a harmful outcome," Sarah said. She moved to the table, hovering over his hand but not touching it. "You're saying you know it's damaging you, but you don't care."

  "Caring was the noise," Elias said. "The procedure removed the noise. The signal remains."

  Thorne set the probe down on the sterile tray. The metal clinked, loud in the quiet room. He had performed twelve of these interventions. Eleven patients had reported relief from chronic suffering. Elias was the first to articulate the separation so cleanly, and the first whose wife looked at him as if he were a stranger wearing her husband's skin.

  "We need to discuss the implications of 'zero distress'," Thorne said. He pulled a stool over and sat, leveling his gaze with Elias. "If you encounter a hazard—a hot stove, a sharp edge—you rely on pain to motivate avoidance. If the motivation is gone, the behavior doesn't change."

  "I can choose to avoid it," Elias said. "I know that broken bones inhibit locomotion. I know that burns invite infection. I will avoid them for those reasons."

  "But not because they feel bad," Sarah said.

  "Because they are inefficient," Elias corrected.

  "Is there a difference?" Thorne asked. "Prudentially, I mean. If you walk away from the stove because you calculated the risk of infection, versus walking away because the heat scared you... the outcome is the same. So where is the harm?"

  "The harm is in the body," Sarah said. She turned to Thorne. "Doctor, if I cut you while you're asleep, have I harmed you?"

  "Technically, yes. Tissue integrity is violated."

  "And if he never wakes up?" Sarah pressed. "If he never feels it? Is it still a harm?"

  Thorne rubbed his chin. "This is why we have the follow-up protocol. We are testing whether the absence of suffering constitutes a absence of harm. Elias claims the harm is gone because the negative experience is gone."

  "The negative experience was the harm," Elias said. "The rest is just biology. Biology happens to trees. Trees don't suffer when they break."

  "Trees don't have wives," Sarah said. Her voice cracked, just once.

  Elias looked at her. For a moment, the mask slipped—not into pain, but into a kind of confusion. He reached out with his uninjured hand and touched her arm. "Sarah. I am not in distress. You are."

  "That's the problem," she said, pulling away. "You're watching me drown and you're telling me the water is dry."

  Thorne stood up. "We need to push the intensity. I need to know if there's a ceiling where the sensory input overrides the affective suppression. Everyone has a limit."

  "I have no limit," Elias said. "I have only structural failure points."

  "Let's test that," Thorne said. He walked to the console. "Fifty degrees. Contact time ten seconds."

  "Ariss," Sarah warned.

  "It's necessary," Thorne said. "If he can't perceive the badness of severe pain, he's a danger to himself. We need to know if the system holds."

  Elias placed his hand back on the pad. He looked at his wife. "It is okay. I am not afraid."

  "That's what I'm afraid of," she whispered.

  Thorne engaged the probe. The hum was deeper this time. The air in the room seemed to tighten. Elias watched the device. He did not breathe faster. He did not tense his shoulders. He watched the skin turn from pink to a angry, glossy red. He watched the first tiny bead of fluid rise within the epidermis.

  "Report," Thorne said. His voice was tighter than he intended.

  "Blistering," Elias said. "Sharpness is increasing. Nine out of ten. The signal is very clear."

  "Does it bother you?"

  "No."

  Thorne lifted the probe. The blister was already forming, a small pocket of serum catching the light. It looked obscene against the calmness of Elias's face. Thorne reached for a dressing kit.

  "Don't," Elias said.

  "I have to cover it," Thorne said.

  "It is not open. It will heal. Covering it traps heat."

  "You're injured," Thorne said, holding the gauze. "Standard protocol dictates protection."

  "Protocol assumes I want to avoid the sensation of the dressing sticking," Elias said. "I don't. But I agree that infection is inefficient. You may cover it if you use non-adherent material."

  Thorne paused, gauze in hand. He looked at Sarah. She was shaking her head, slowly.

  "Look at him," she said. "He's talking about his own flesh like it's a rental car."

  "He is free," Elias said. "For ten years, I could not sleep because my back felt like it was full of glass. Now I feel the glass, but I sleep. Where is the harm in that?"

  "The harm is that you're not human anymore," Sarah said. "Pain is how we know we're alive. It's how we know we care about staying here."

  "I care about staying here," Elias said. "I just don't fear the exit."

  Thorne applied the dressing. Elias watched the tape being smoothed down. He did not wince when the adhesive pulled the fine hairs on his wrist.

  "Let's walk," Thorne said suddenly. "To the elevator. I want to see your gait under load."

  They moved into the corridor. It was late afternoon; the hallway was washed in yellow light from the west-facing windows. Elias walked with a normal stride. He did not favor his hand. He held it loosely at his side, the bandaged palm swinging like a pendulum.

  A nurse was pushing a cart toward them. She stopped to let them pass. She glanced at the bandage, then at Elias's face. "Rough session?" she asked.

  "Productive," Elias said.

  The nurse looked at Thorne, eyebrows raised. Thorne gave a microscopic shake of his head. *Don't ask.*

  They reached the elevator. Sarah stood with her back to them, looking down the hall.

  "Sarah," Elias said.

  She turned. "If you fell, would you call for help?"

  "If I broke a leg, I would require assistance to move," Elias said. "Yes."

  "Would you feel bad about it?"

  "Feel bad?"

  "Upset. Angry. Sad."

  "No," Elias said. "Those are reactions to the pain. I don't have the pain. I have the injury."

  "So if I told you I was leaving," Sarah said, her voice flat, "because I can't live with someone who doesn't care if I leave... would you feel bad?"

  The question hung in the air, heavier than the smell of antiseptic. Thorne looked at his shoes. This was outside the protocol. This was the variable they hadn't controlled for.

  Elias considered the question. He did not rush. He treated it like the thermal probe.

  "I would note that the partnership has ended," he said. "I would note that I prefer your presence to your absence. I would act to retain your presence if possible."

  "But you wouldn't *hurt*," Sarah said.

  "Hurt is a sensation," Elias said. "Loss is a fact. I would experience the fact."

  "That's not enough," she said. Tears were finally falling, tracking through the powder on her cheeks. "I need you to hurt. I need to know that losing me matters more than a broken leg."

  "They are different categories," Elias said. "You are conflating the intensity of the reaction with the value of the object."

  "No," Sarah said. "The reaction *is* the value. If you don't suffer when I'm gone, then I don't matter to you. Not really."

  Thorne stepped in. "Sarah, the procedure targets nociceptive affect. Emotional processing is theoretically separate."

  "Is it?" Sarah turned on him. "You cut the wire that says 'this is bad.' How do you know it didn't cut the wire that says 'this matters'?"

  "We have psychometric evaluations," Thorne said, but he sounded less certain now. He looked at Elias. "Elias, do you care about your wife?"

  "Yes."

  "How do you know?"

  "Because I prefer her company," Elias said. "Because I allocate resources to her well-being."

  "Because you love her," Sarah said. "Not because you calculated resource allocation."

  "Love is the allocation," Elias said. "The feeling is just the dashboard light. The car still drives."

  "The light tells you the engine is on fire," Sarah said. "If you rip out the light, the engine still burns."

  "But I don't mind the burn," Elias said.

  "That's not freedom," Sarah said. "That's death. You're just walking around waiting to fall apart."

  The elevator arrived with a chime. The doors opened. Empty.

  Thorne gestured for them to enter. "We can schedule a follow-up in two weeks. Monitor for delayed affective return."

  "There won't be any," Elias said. He stepped into the elevator. He held the door open for Sarah.

  She stood on the threshold. She looked at his bandaged hand. She looked at his face, which was peaceful, open, and utterly unreadable.

  "If you burn the house down," she said, "you won't smell the smoke."

  "I will see the flames," Elias said. "I will exit the structure."

  "You won't run," she said. "You'll walk. And you'll burn while you walk."

  "I will not suffer while I walk," he said. "Is that not the goal?"

  "The goal was to stop the suffering," Thorne said from the hallway. "Not to remove the stakes."

  "The stakes are the damage," Elias said. "The suffering was just the tax."

  Sarah stepped back. She did not enter the elevator.

  "I can't go with you," she said.

  "Sarah," Elias said. He reached out, the bandaged hand extending. "The logic is sound."

  "I don't want logic," she said. "I want you to be afraid of losing me. And if you're not afraid of pain, you're not afraid of anything. And if you're not afraid of anything, you're not safe to be around."

  "I am safe," Elias said. "I am perfectly safe."

  "You're a hazard," she said. "You're a person who can walk through fire and call it weather."

  She turned and walked down the hall. Her footsteps echoed on the linoleum, sharp and rhythmic, fading into the distance.

  Elias watched her go. He did not call out. He did not sigh. He lowered his hand and pressed the button for the lobby.

  Thorne stood in the hallway, watching the patient who was no longer in pain. He looked at the closed elevator doors, then at the empty corridor where the wife had vanished. He thought about the blister forming under the gauze in the other room, the tissue dying quietly without a scream. He thought about the definition of harm, and whether it required a witness.

  The elevator descended. Elias stood alone in the box, checking his watch, calculating the time required to reach the ground floor, noting the slight pressure in his hand where the skin was broken, registering the data, waiting for the doors to open.
