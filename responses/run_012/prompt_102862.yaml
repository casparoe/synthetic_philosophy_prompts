answer: |-
  # Consequentialism & Cluelessness: A Decision Tree

  **Start:** You accept: *"An action's rightness depends only on its consequences."*

  **1. What is primarily judged as right or wrong?**
  *   **Rules, Dispositions, or Life Patterns** → **Indirect Consequentialism**
      *   *Awkward Commitment:* You must sometimes follow rules you know will produce worse results in specific cases.
  *   **Specific Acts** → Go to 2.

  **2. Is this theory a guide for deliberation or just a standard for judgment?**
  *   **Standard Only (Use common sense to decide)** → **Esoteric Consequentialism**
      *   *Awkward Commitment:* The theory tells you what is right but forbids you from using it to choose.
  *   **Guide for Deliberation** → Go to 3.

  **3. When consequences are unknown, can you assign meaningful probabilities?**
  *   **No (Ignorance is too deep)** → **Unnamed (Skeptical View)**
      *   *Awkward Commitment:* Most actions are morally undefined because consequences are unknowable.
  *   **Yes (Subjective credences work)** → Go to 4.

  **4. Do you maximize mathematical Expected Value strictly?**
  *   **No (Use thresholds, risk-weights, or heuristics)** → **Risk-Weighted Consequentialism**
      *   *Awkward Commitment:* You might ignore a higher expected value to avoid a small risk of disaster.
  *   **Yes** → Go to 5.

  **5. Do unknown long-term effects roughly cancel out on average?**
  *   **Yes** → **Common-Sense Consequentialism**
      *   *Awkward Commitment:* You must ignore potentially huge long-term impacts because they cancel out.
  *   **No (Systematic impact)** → Go to 6.

  **6. Does a tiny chance of astronomical good outweigh a certain small harm?**
  *   **No** → **Unnamed (Discounting View)**
      *   *Awkward Commitment:* You arbitrarily discount future value without a clear mathematical justification.
  *   **Yes** → **Fanatical Consequentialism**
      *   *Awkward Commitment:* You must sacrifice certain goods for astronomically unlikely huge gains.

  ***

  ### Meta-Analysis: Limitations & Gaps

  **Indistinguishable Positions:**
  The tree separates "EV Criterion" from "Heuristic Procedure" at Q2 (Standard vs. Guide). However, it cannot cleanly separate those who say *"EV is the Truth, but Heuristics are the Procedure"* from pure Esotericism. A user who believes EV is the criterion but chooses heuristics for practical reasons may be forced into "Esoteric" (if they say Standard) or "Risk-Weighted" (if they say Guide), obscuring their actual hybrid view.

  **Unoccupied Combinations:**
  1.  **Act/Procedure/No Probabilities/Max EV:** *Incoherent.* One cannot maximize expected value without assigning probabilities.
  2.  **Act/Procedure/Prob/EV/No Cancel/No Mugging:** *Theoretically Unstable.* This view accepts EV and systematic long-term impacts but rejects the logical conclusion of fanatical bets, requiring an ad-hoc justification for discounting that isn't captured by "Cancellation."

  Bottom line: Cluelessness doesn't refute consequentialism, but it forces you to choose between accepting counterintuitive extremes or modifying how you calculate value.
