answer: |-
  ### Final Exam Essay Question

  **Course:** Collective Harm and Individual Responsibility
  **Time:** 90 Minutes
  **Instructions:** Answer the following question in full. You may not appeal to outside readings; your argument must rely on the materials provided below.

  **Materials:**
  1.  **Taxonomy of Inefficacy:** (i) *Production-inefficacy*: Your token act is not among the causes that produce the outcome at all. (ii) *Difference-inefficacy*: The outcome is the same whether or not you act (no but-for dependence), even though your act may be one of the causes (paradigm: overdetermination). (iii) *Responsive-inefficacy*: Nothing anyone else does would have been different had you acted differently (no imitation, tipping, or coordination).
  2.  **The Valley Scenario:** 900 households share a reservoir. It fails (harming infants/elderly) unless at least 400 households cut consumption. The threshold drifts between 380 and 420 due to rainfall. No household knows the threshold, observes the effect of their cutback, or can assign a determinate probability to being pivotal.
  3.  **The NES Test:** An act is a cause if it is a *Necessary Element of a Sufficient set* of actual conditions for the outcome. This captures acts that fail the but-for test.

  **Prompt:**
  Analyze the moral status of a household that waters their lawn in the Valley Scenario. First, use the Taxonomy to specify exactly which forms of inefficacy obtain ontologically and which apparent inefficacy is merely epistemic; explicitly mark the distinction between not knowing whether you are pivotal and not being pivotal. Second, apply the NES Test to the watering household. Report what the test delivers regarding causal symmetry between waterers and cutters, and state what follows for moral judgment if the test treats them alike. Third, articulate what a theory of individual obligation must look like if all three forms of inefficacy hold simultaneously; defend one such theory against one named rival rather than listing options. Finally, state whether your verdict transfers to voting and to meat consumption, identifying at least one structural disanalogy for each.

  ***

  ### Model Answer

  In the Valley Scenario, the watering household faces a complex causal landscape. Regarding the Taxonomy, *production-inefficacy* does not obtain. My water physically leaves the reservoir; my token act is among the physical causes of the level drop. *Difference-inefficacy*, however, likely obtains ontologically. If 400 others cut, the reservoir survives regardless of my watering; my act makes no difference to the outcome, fitting the overdetermination paradigm. *Responsive-inefficacy* also obtains ontologically; my neighbors do not see my hose and adjust their own usage. The crucial distinction lies in the epistemic layer. Because the threshold drifts and is unobserved, I suffer *epistemic uncertainty* regarding difference-inefficacy. I do not know if I am pivotal. This is distinct from *ontological non-pivotality*. The prompt specifies I cannot assign a probability, meaning I cannot even rely on expected utility to bridge the gap. I am metaphysically potentially pivotal but epistemically blind.

  Applying the NES Test clarifies the causal status. For the reservoir to fail, a sufficient set of conditions must exist: specifically, that fewer than 400 households cut. If the reservoir fails, my watering is a Necessary Element of a Sufficient set for that failure (along with the specific non-cutbacks of others). Conversely, if the reservoir survives, the cutbacks form a sufficient set where my specific cutback might be necessary. The NES test treats waterers and cutters symmetrically: both are causal contributors to their respective outcomes (failure vs. survival) even if they fail the but-for test. If causation is the anchor for responsibility, this symmetry implies moral symmetry. If the cutter is praiseworthy for being part of a sufficient set for survival, the waterer is blameworthy for being part of a sufficient set for failure. The NES test thus rescues causal responsibility from the difference-inefficacy objection, provided we accept that being a NESS cause is sufficient for moral accountability.

  If production, difference, and responsive inefficacy all hold, a theory of individual obligation cannot rest on *making a difference*. I defend a **Rule-Consequentialist** obligation against **Act-Utilitarianism**. Act-Utilitarianism requires maximizing good in the specific instance; here, it yields no obligation because my act changes nothing (difference-inefficacy) and produces no ripple effects (responsive-inefficacy). Rule-Consequentialism, however, asks what rule, if generally adopted, would maximize good. The rule "Do not water when the reservoir is critical" clearly yields better outcomes if generally followed. Even if my specific act doesn't change the outcome, I am obligated to follow the rule that, in general, solves the collective action problem. This grounds obligation in the *type* of act rather than the *token* consequence, bypassing the inefficacy trap.

  Does this transfer to voting? Yes, regarding obligation, but with a disanalogy. Voting shares the difference-inefficacy (one vote rarely decides) and responsive-inefficacy (others don't see my vote). However, voting lacks the *production-inefficacy* of watering. A ballot in a box does not physically constitute the election result in the way water constitutes the reservoir level; it is purely institutional. The disanalogy is that voting is constitutive of the outcome only via social agreement, whereas water usage is physically constitutive.

  Does this transfer to meat consumption? Yes, regarding obligation, with a different disanalogy. Meat consumption shares the causal structure of watering (physical contribution to demand). However, it lacks the *epistemic opacity* of the Valley. In the meat market, supply chains are somewhat responsive to long-term demand signals, and the threshold for slaughter is not a drifting secret in the same way. The disanalogy is that meat consumption involves a market mechanism that aggregates individual choices over time with more transparency than the one-season reservoir drift. Thus, while the Rule-Consequentialist obligation holds, the epistemic defense for the waterer is weaker for the meat-eater.

  **Weak Link:**
  The most vulnerable step in this argument is the application of the NES Test to establish moral symmetry. The NES test identifies causal contribution, but it is controversial whether causal contribution alone grounds blameworthiness in overdetermination cases. If one argues that *control* is required for responsibility, the waterer had no control over the outcome (since it was overdetermined), whereas the cutter arguably exercised agency toward a goal. An opposing answer arguing that NES establishes *causation* but not *responsibility* would be superior if it successfully decoupled the metaphysical test from the normative judgment, showing that being a necessary element of a sufficient set for harm is morally neutral when the agent could not have altered the set's sufficiency.

  ***

  ### Marking Scheme (30 Marks Total)

  | Point | Requirement | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Taxonomy & Epistemic/Ontological Distinction:** Correctly identifies Production-inefficacy as *false* (water is physical), Difference/Responsive as *true*. Explicitly distinguishes not knowing pivotality (epistemic) from not being pivotal (ontological). | 6 | Conflating the drifting threshold (ontological indeterminacy) with the household's ignorance (epistemic uncertainty). |
  | **2** | **NES Test Application:** Correctly applies NES to the waterer. Notes symmetry between waterers (cause of failure) and cutters (cause of survival). States moral implication of symmetry (blame/praise parity). | 6 | Claiming NES fails because the but-for test fails, missing the point of the NES provision in the prompt. |
  | **3** | **Theory of Obligation:** Articulates a theory that works despite inefficacy (e.g., Rule-Consequentialism, Kantian, Fair Play). Defends it against a *named* rival (e.g., Act-Utilitarianism). | 6 | Listing multiple theories without defending one against a specific rival; or choosing a theory that relies on difference-making. |
  | **4** | **Voting Transfer:** Verdict transfer (Yes/No) + One structural disanalogy (e.g., physical vs. institutional causation). | 6 | Treating voting as identical to watering without identifying a structural difference in how votes count. |
  | **5** | **Meat Transfer:** Verdict transfer (Yes/No) + One structural disanalogy (e.g., market responsiveness, epistemic transparency). | 6 | Failing to identify a disanalogy, or identifying a similarity as a disanalogy. |

  **Differentiator for A Grades:**
  **Point 3 (Theory of Obligation).** B-grade answers will correctly identify a theory that bypasses difference-making. A-grade answers will demonstrate *why* the rival theory fails specifically in the context of the three inefficacies combined, showing a tight integration between the scenario's constraints and the normative theory's machinery.

  **Note on Weak Link:**
  The model answer's final paragraph must explicitly identify a vulnerability in its own reasoning and articulate a standard by which an opposing view would be graded higher. Failure to include this self-critique caps the essay at a B regardless of other content.
