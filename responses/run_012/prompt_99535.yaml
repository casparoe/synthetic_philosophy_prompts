      *   **Task:** Draft a written opinion for the board regarding the fate of the Truth and Reconciliation Commission (TRC) working archive (seal expires in 6 months).
      *   **Constraints:** Max 3 pages. Must recommend one concrete course of action (Full Release, Continued Sealing, or Conditional Release with precise criteria). Must include a timetable. Must address the "losing side's" strongest point seriously. Must address the petition regarding "accessioning silences/absences."
      *   **Key Issues:**
          1.  Survivor testimony (confidential, names protected).
          2.  Perpetrator statements (confidential, some unprosecuted, some living).
          3.  Surveillance files (dossiers on thousands, some public figures, some ordinary).
          4.  The "Gaps" (destroyed records, unrecorded communities).
          5.  Petition 1 (Descendant Communities): Accession the silences/absences as a register.
          6.  Petition 2 (Journalists): Publish the index of surveillance files (who was watched), even if contents remain sealed.
          7.  Board Split: "Lapse the seal" (Right to Know) vs. "Keep Promise" (Safety/Integrity of Archive).
      *   **Goal:** A defensible decision for the long term (5+ years), not just a compromise.

  2.  **Determine the Recommendation:**
      *   *Option A: Full Release.* Too dangerous. Violates explicit promises to survivors and low-level cooperators. Could endanger lives. Legally and ethically shaky regarding the "promise."
      *   *Option B: Continued Sealing.* Stagnant. Denies historical truth. Undermines the purpose of a National Records Authority. Doesn't address the surveillance index petition or the silence petition.
      *   *Option C: Conditional Release (The Middle Path, but rigorous).* This is the most responsible approach. It balances transparency with safety and acknowledges the structural violence of the archive itself.
      *   *Specifics of Conditional Release:*
          *   Survivor testimony: Redacted/Anonymized access (names protected).
          *   Perpetrator statements: Case-by-case review based on ongoing threat/prosecution status.
          *   Surveillance files: Release the *index* (metadata) as requested by journalists, keep content sealed unless requested by the subject.
          *   The "Silences": Formally accession the "Register of Absences" as a finding aid, not as fake records. This validates the communities' petition without violating archival science.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Context & Mandate:** Briefly acknowledge the statutory seal and the competing ethical obligations.
      *   **Analysis of the Three Tiers of Material:**
          *   Survivors: Privacy is paramount.
          *   Perpetrators: Safety vs. Accountability.
