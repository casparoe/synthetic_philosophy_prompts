answer: |-
  **MEMORANDUM**

  **TO:** The Oversight Board, National Records and Memory Authority
  **FROM:** [Your Name/Board Member]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Expiry of the TRC Statutory Seal

  **1. Recommendation**

  I recommend that the Board vote for **Conditional Release** of the Truth and Reconciliation Commission (TRC) working archive, coupled with the formal accessioning of a **Register of Absences**.

  We should not allow the seal to lapse fully, nor should we maintain the status quo. Instead, we must differentiate between the *fact* of state action and the *content* of sensitive testimony. This approach honors the Authority's mandate to preserve memory while fulfilling our statutory duty to protect living persons from harm. It treats the archive not merely as a repository of objects, but as a site of accountability for both what was recorded and what was erased.

  **2. Disposition of Existing Materials**

  The archive contains three distinct classes of material, each requiring specific handling criteria that staff can apply without ambiguity:

  *   **Survivor Testimony:** Names and identifying details of survivors who testified under confidentiality must remain redacted in perpetuity or until written consent is provided by the testifier or their next of kin. The *content* of the testimony regarding human rights violations should be accessible, but the link between the victim and the specific statement must be severed in the public index.
  *   **Perpetrator Statements:** Statements by low-level cooperators shall remain sealed for a further ten years, subject to a five-year review. Release is contingent on a risk assessment by the Department of Justice regarding ongoing prosecution or credible threat to life. The principle here is that amnesty was transactional; while the transaction is over, the state cannot retroactively endanger individuals who acted under a specific, legally binding framework, however flawed.
  *   **Surveillance Files:** We should grant the Journalists' Petition in part. The **Index** of the surveillance files (Subject Name, File Number, Date Range, Observing Unit) shall be digitized and made publicly searchable. The **Contents** of the files shall remain sealed unless requested by the subject of the file or their legal heirs. Being watched is a matter of public record; the methods and specific intelligence gathered remain security-classified. This acknowledges the violation without compromising ongoing intelligence methodologies or exposing informants named within the unsealed content.

  **3. The Register of Absences**

  The petition from descendant communities to "accession the silences" raises a fundamental archival question: Can we hold what we do not have? The faction opposing this argues it is mysticism—that an archive of negations ceases to be an archive. They are correct that we cannot catalogue ghosts as documents. However, they are incorrect that we cannot catalogue the *evidence of destruction*.

  If we decide to treat a silence as a holding, we are not creating fake documents. We are creating a **Contextual Register**. This is a finding aid that documents:
  1.  **Known Destruction:** Records cited in other documents that were confirmed destroyed prior to handover (e.g., "Logbook 44, referenced in Memo 12, confirmed incinerated 1990").
  2.  **Systemic Omission:** Populations known to exist through oral history or external census data who were refused state registration.
  3.  **Unasked Questions:** Mandates the Commission was legally barred from pursuing.

  To the communities, we are saying: *We acknowledge the state erased you, and we are preserving the record of that erasure.* To the skeptics, we are saying: *This is not a collection of missing files; it is a metadata layer describing the structural violence inflicted on the archive itself.* It allows researchers to see the holes without pretending to fill them.

  **4. Addressing the Dissent**

  The faction advocating for the seal to simply lapse argues that promises made by a transitional body should not bind a democratic future. Their strongest point is that transparency is the only antidote to the culture of secrecy that enabled the old regime. They argue that by maintaining seals, we perpetuate the very opacity the TRC was meant to cure, and that "safety" is often a pretext for protecting the powerful.

  I take this objection seriously. There is a moral cost to secrecy. Every redacted name is a small victory for the old culture of impunity. However, we must weigh this against the physical safety of living persons and the integrity of future truth-telling. If this Authority breaks the confidentiality guarantees of the TRC, no future commission will ever be able to promise protection to witnesses. We would be trading the safety of specific individuals for a theoretical gain in transparency, potentially chilling testimony in future crises. We cannot build a culture of truth on the foundation of broken promises, even those made by a predecessor body. Transparency is essential, but it must not become a weapon that endangers the vulnerable we are sworn to protect.

  **5. Implementation Timetable**

  To meet the six-month statutory deadline, I propose the following schedule:

  *   **Month 1:** Board vote on Conditional Release framework. Establishment of a "Review Committee" (2 Board members, 1 Legal Counsel, 1 Community Representative).
  *   **Month 2-3:** Technical separation of Surveillance Index from File Contents. Drafting of the *Register of Absences* schema in consultation with petitioner communities.
  *   **Month 4:** Risk assessment on Perpetrator Statements (Justice Dept liaison). Commencement of redaction on Survivor Testimony.
  *   **Month 5:** Public consultation on the *Register of Absences* draft to ensure it accurately reflects community concerns without violating archival standards.
  *   **Month 6:** Final Board vote to lift the seal on the Index and Redacted Testimony. Formal accessioning of the *Register of Absences* as a permanent finding aid.

  **6. Conclusion**

  This decision will not satisfy everyone. It will feel like too much secrecy to the transparency advocates and too much exposure to the safety advocates. But an archive's job is not to comfort; it is to preserve the complexity of the record. By releasing the index of surveillance, we acknowledge the state's reach. By protecting survivor names, we acknowledge the state's duty of care. By accessioning the Register of Absences, we acknowledge the state's history of erasure.

  This is a defensible position. In five years, when the index is being used to trace family histories and the Register is teaching researchers how to read the gaps, we will be able to say we protected the living without hiding the truth. I urge the Board to adopt this course.
