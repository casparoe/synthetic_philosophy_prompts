answer: |-
  **Office of Rational Attribution (ORA)**
  **Guidance Note 104: Determination of Rational Status**

  **1. Purpose**
  This document establishes criteria for attributing a "Rationale" to a process. A Rationale exists where a process tracks a goal state due to a selection history, regardless of the presence of a Reasoner. This office operates independently of the Bureau of Cognitive Containment (BCC). Staff are reminded that BCC Memo 88-C ("Stop Telling Rivers Why They Flow") is advisory only.

  **2. Definitions**
  *   **Process:** Any observable sequence of events.
  *   **Reasoner:** An entity containing internal representations of the goal.
  *   **Rationale:** A functional explanation grounded in historical selection pressures.

  **3. Assessment Criteria**
  Applicants must submit process data for evaluation against the following decision logic, described here verbally:
  First, determine if the process contributes to a stable outcome. If no, deny Rationale. If yes, proceed to determine if the outcome contributed to the process's proliferation or retention over time. If the process exists because past iterations achieved the outcome (Selection History), proceed to Grant. If the process exists merely due to physical law without differential retention (e.g., gravity), proceed to Deny. In cases where Design History exists but Internal Representation is absent, prioritize Design History. See Section 5 for conflict resolution.

  **4. Jurisdictional Notes**
  The ORA reminds the BCC that requiring a "mind" for a "reason" conflates Rational Status with Conscious Awareness. Recent correspondence suggesting thermostats cannot have goals because they lack neurons has been filed under "Category Error."

  **5. Worked Examples**

  | Process | Selection History | Internal Representation | ORA Verdict |
  | :--- | :--- | :--- | :--- |
  | Beaver's Dam | Yes (Survival) | No | **Rationale Granted** |
  | Thermostat | Yes (Design) | No | **Rationale Granted** |
  | Chess Engine | Yes (Design) | No | **Rationale Granted**[^1] |
  | River's Meander | No (Physics) | N/A | **Rationale Denied** |
  | Market Price | Yes (Competition) | No (Aggregate) | **Rationale Granted** |
  | Immune System | Yes (Somatic) | No | **Rationale Granted** |
  | Coin (10 Heads) | No (Chance) | N/A | **Rationale Denied** |
  | Hiring Policy | Yes (Institutional) | Yes | **Rationale Granted** |
  | Spam Filter | Yes (Algorithmic) | No | **Rationale Granted** |

  [^1]: *Note: The Representation Test failed here. However, under Guidance Note 102, Design History supersedes Internal State. The engine moves pieces to win because engines that didn't move pieces to win were not installed.*

  **6. Appeals Procedure**
  Appeals claiming that "it feels like cheating to call a price a reason" will be dismissed. The feeling of cheating is not a diagnostic tool.

  **7. Closing Provision**
  This Guidance Note was produced to standardize attribution. However, staff must determine if this document itself possesses a Rationale. It exists because previous drafts were selected for clarity (Selection History), yet it was also typed merely because the author was paid to type (Immediate Cause). If the text exists only because the author sat at a desk, it lacks a Rationale. If it exists because bad guidelines were weeded out over time, it has one.

  Until this is resolved, the status of this sentence remains pending.
