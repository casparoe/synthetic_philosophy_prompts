answer: |-
  ### Examiner's Preliminary Notes: The Crux of the Question

  The trap here is conflation. Most students will treat all 'cluelessness' as merely epistemic—a lack of data. They will recite the standard defence (subjective or expected consequentialism) and assume the problem is solved. The crux lies in recognising that **output cluelessness** is not about missing data, but about the **non-existence of a determinate value fact**. If the 'good' does not aggregate into a sum, 'expected good' is mathematically undefined, not merely unknown. An A-grade answer must demonstrate that shifting to expectations solves the epistemic gap but leaves the axiological void untouched. They must then argue whether a moral theory can remain substantive if its metric is potentially undefined for mundane acts (the Cup of Tea). The distinction rescues the theory only if output cluelessness is rare; it exposes the theory if output cluelessness is endemic to infinite causal chains.

  ***

  ### 1. Essay Question

  **Paper: Normative Ethics**
  **Time Allowed: 75 Minutes**

  Consider the following distinction regarding the 'cluelessness objection' to consequentialism. **Input cluelessness** refers to ignorance of causal facts: we cannot predict the remote downstream effects of our actions. **Output cluelessness** refers to a failure of value composition: even if every causal fact were known, the values of those consequences might not compose into a total that can be ranked or summed.

  The standard consequentialist reply is to replace the criterion 'maximise the good' with 'maximise expected good'.

  Critically evaluate this reply in light of the **Cup of Tea** case: an agent buys a cup of tea. Assume causal ripples are unbounded (total input cluelessness) and that even a complete enumeration of effects yields no determinate sum of value (total output cluelessness).

  Does the input/output distinction show that expected consequentialism saves the theory from cluelessness, or merely reframes the failure? Specifically, if the aggregate good may not exist, is the criterion 'maximise expected good' a substantive moral demand, or a dressed-up permission to do as one pleases?

  ***

  ### 2. Model Answer (First-Class Standard)

  The distinction between input and output cluelessness is fatal to the standard expected utility defence of consequentialism. While shifting to 'expected good' resolves the epistemic deficit of input cluelessness, it collapses when faced with the axiological deficit of output cluelessness. In the Cup of Tea case, this collapse suggests that consequentialism ceases to be action-guiding and becomes indistinguishable from permission.

  Input cluelessness is purely epistemic. We do not know the causal chain. The move to expected value handles this elegantly: rightness is determined by the probability-weighted sum of outcomes based on available evidence. We are not blamed for unknown facts, only for poor estimation of known probabilities. However, this relies on the assumption that there *is* a fact of the matter about the value of those outcomes, even if unknown.

  Output cluelessness denies this assumption. It posits that value might not be aggregable. In the Cup of Tea case, we are asked to suppose that even with perfect knowledge, the infinite series of consequences yields no determinate sum. This is not a lack of information; it is a lack of a metric. Expected value is a function mapping probabilities to values. If the values are undefined or non-comparable, the expectation is undefined. You cannot calculate an average over a void. Therefore, the standard reply solves the input problem only by presupposing the output problem does not exist.

  Does this distinction save consequentialism? Only if output cluelessness is rare. If it is confined to exotic cases (e.g., infinite populations), the theory survives as a practical guide for most mundane choices. But the Cup of Tea case is designed to show that output cluelessness is endemic. Any act with unbounded causal ripples faces the same valuation problem. If a cup of tea triggers an infinite chain of value that cannot be summed, then *every* act faces output cluelessness. The distinction thus exposes a structural flaw rather than isolating a niche objection.

  Consequently, we must face the charge that the criterion becomes a dressed-up permission. If the expected good is undefined, the criterion 'maximise expected good' yields no verdict. It does not forbid buying the tea, nor does it require it. It is silent. A theory that is silent on mundane acts fails the basic requirement of normativity. One might argue the theory remains substantive as a regulative ideal: 'try to aim at the good'. But without a metric to define 'the good', this is empty. It licenses the agent to project their own preferences onto the void under the guise of estimation.

  However, a sophisticated consequentialist might retreat to a comparative criterion: rather than maximising the good, one need only produce *more* expected good than available alternatives. Yet, if output cluelessness holds for all acts, it holds for all alternatives. We cannot say A is better than B if neither has a determinate value.

  Ultimately, the input/output distinction clarifies why the expected utility reply fails. It shows that the problem is not in our heads (input) but in the world (output). Unless the consequentialist can demonstrate that value facts always compose into determinate sums, the Cup of Tea shows the theory provides no traction. It becomes a formal structure without content, allowing the agent to do as they please while claiming to maximise an undefined quantity. The distinction does not rescue the theory; it reveals that the rescue mission was addressing the wrong obstacle.

  ***

  ### 3. Marking Scheme (Out of 20)

  **Pass Threshold:** 10 marks. **First-Class Threshold:** 16 marks.

  | Move | Marks | Typical Error (B-grade vs A-grade) |
  | :--- | :---: | :--- |
  | **1. Distinction Mastery**<br>Correctly identifies Input as epistemic (unknown facts) and Output as axiological/metaphysical (undefined value facts). | 4 | **B:** Treats both as merely 'not knowing the future'.<br>**A:** Recognises Output cluelessness denies the existence of a sum, not just knowledge of it. |
  | **2. The Expected Utility Reply**<br>Explains clearly how 'expected good' solves Input cluelessness (relativising rightness to evidence/probability). | 3 | **B:** Assumes this solves all forms of cluelessness automatically.<br>**A:** Shows this works *only* if values are determinate. |
  | **3. The Collapse on Output**<br>Demonstrates that expected value cannot be calculated if the underlying value aggregate is undefined (mathematical/structural failure). | 4 | **B:** Argues we just assign probabilities to the undefined values.<br>**A:** Identifies that expectation requires a defined domain to operate upon. |
  | **4. Application to Cup of Tea**<br>Uses the thought experiment to argue whether this failure is niche or endemic (mundane acts having infinite ripples). | 4 | **B:** Treats the Cup of Tea as just another example of ignorance.<br>**A:** Uses it to show output cluelessness undermines *all* acts with unbounded chains. |
  | **5. Substantive vs. Permission**<br>Verdict on whether the criterion remains action-guiding or collapses into arbitrariness when the metric fails. | 3 | **B:** Concludes it remains substantive because the *intent* is good.<br>**A:** Argues silence on verdicts equals permission/arbitrariness. |
  | **6. Structure & Clarity**<br>Logical flow, precise terminology, no name-dropping, adheres to word limit. | 2 | **B:** Disorganised or relies on citing authors rather than arguments.<br>**A:** Tight, argument-driven prose. |

  **Differentiation Note:**
  *   **B-Grade (12–15 marks):** Will successfully explain Input cluelessness and the Expected Utility reply. They will likely stumble on Move 3, assuming that 'uncertainty about value' is the same as 'value being undefined'. They may conclude the theory survives because 'we must do our best'.
  *   **A-Grade (16–20 marks):** Must secure Move 3 and Move 5. They must explicitly argue that you cannot maximise an undefined variable. They must take a stand on whether this renders the theory empty (permission) or merely limited. They will recognise that the distinction exposes the theory rather than saving it.
