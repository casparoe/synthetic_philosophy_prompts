answer: |-
  We agree that learning of peer disagreement changes your epistemic situation, but we disagree on whether that change necessarily requires adjusting your credence.

  1.  The dispute concerns cases where agents share evidence and estimate equal competence prior to learning of the disagreement.
  2.  Both camps agree disagreement provides no reason to move if you possess independent proof of peer malfunction unrelated to the question (e.g., intoxication).
  3.  Both camps agree disagreement provides reason to move in cases of symmetric access to evidence where no independent check is available (e.g., complex mental arithmetic).
  4.  Conciliationists concede that strict conciliation can lead to skepticism or instability in iterated cases.
  5.  Steadfasters concede that ignoring peer disagreement requires a principled explanation of why one's own reasoning is privileged without circularity.
  6.  The standoff rests on conflicting intuitions about whether rationality requires maximizing accuracy or maintaining coherence with one's total evidence.

  ### Residual Disagreement

  | Question | Conciliationist Answer | Steadfast Answer | Genuine/Verbal |
  | :--- | :--- | :--- | :--- |
  | Does peer disagreement *always* require credence adjustment? | Yes, absent defeaters. | No, first-order evidence can outweigh. | Genuine |
  | Is the force of disagreement independent of first-order evidence? | Yes, higher-order evidence defeats first-order. | No, first-order evidence constrains higher-order response. | Genuine |
  | Is "rationality" defined by responsiveness to peers or fidelity to evidence? | Responsiveness to all evidence, including peer status. | Fidelity to first-order evidence primarily. | Verbal (partially) |

  Once senses are fixed, the dispute remains genuine: even if "rationality" means "responsiveness to evidence," we disagree on whether the peer's disagreement constitutes evidence strong enough to override initial justification.

  ### The Cruxes

  **The Relay**
  A (0.7) and B (0.3) are peers. B moves to 0.45 via C. A and B exchange credences.
  *   **Conciliationist:** A should move toward B's current 0.45. Path-dependence is a problem for simple averaging models, not the principle; proper aggregation should be order-independent. If it proves order-dependent, it is a reductio of the aggregation formula, not conciliationism itself.
  *   **Steadfast:** A stays at 0.7. A's first-order evidence hasn't changed. Path-dependence is irrelevant because B's movement is irrelevant to A's justification. If conciliationism yields path-dependence, it is a reductio of conciliationism.
  *   **Settlement Condition:** If formal models show order-independence is impossible for any conciliatory rule that preserves accuracy, Conciliationists must modify the view. If Steadfasters cannot explain why B's movement is irrelevant without assuming A is right, they beg the question.

  **Self-application**
  This disagreement is a peer disagreement.
  *   **Conciliationist:** Applied to itself, conciliationism requires lowering confidence in conciliationism. This is modesty, not self-undermining; one can rationally hold a view while acknowledging significant peer doubt.
  *   **Steadfast:** Applied to itself, steadfastness licenses holding ground. This is consistency, not dogmatism; rationality permits trusting one's evaluation of the disagreement itself.
  *   **Settlement Condition:** If lowering confidence forces Conciliationists to abandon the view entirely (credence < 0.5), the view is self-undermining. If Steadfasters cannot distinguish this from arbitrary dogmatism in non-philosophical cases, the view is ad hoc.

  **Peerhood**
  Is calling someone a peer a descriptive fact or a normative verdict?
  *   **Conciliationist:** Descriptive. Competence and evidence are fixed prior to disagreement. If normative, the view is circular (weight peers, but peers are those you weight).
  *   **Steadfast:** Partly normative. You may demote a peer based on the disagreement itself. Circularity is avoided because demotion is based on evidence of error, not mere disagreement.
  *   **Settlement Case:** Blind review. You agree with a paper, then learn the author is a rival you previously deemed a peer.
  *   **Prediction:** Conciliationists predict peer status remains fixed; Steadfasters predict you may demote based on the disagreement content. If peer status shifts solely based on agreement, Conciliationists claim this proves circularity; Steadfasters claim this proves rational filtering.

  ### The Shared Test

  Both camps accept a simulation of agents solving problems with known answers in noisy environments as evidence bearing on accuracy.
  *   **Conciliationist Prediction:** Conciliating agents converge on truth faster in high-noise environments where individual error rates are significant.
  *   **Steadfast Prediction:** Steadfast agents converge faster when noise is low or first-order evidence is strong, as conciliation dilutes correct beliefs.
  *   **Count Against Conciliationism:** If conciliating agents consistently fail to converge on truth even when individual error rates are high and independent, the view fails its accuracy goal.
  *   **Count Against Steadfastness:** If steadfast agents consistently fail to correct systematic errors despite clear peer consensus, the view fails to account for reliability.

  ### Closing

  Part of the standoff is verbal, specifically regarding the definition of "rationality" and "evidence." However, the core dispute is genuine: it concerns the weight of higher-order evidence relative to first-order justification. Neither camp can move the debate by stipulation. What would move the debate is a formal proof that one approach strictly dominates the other in truth-tracking across all relevant environments, or a psychological demonstration that one response is constitutive of cognitive competence. Until then, we sign this document to mark the boundary of our agreement and the precise location of our dissent.
