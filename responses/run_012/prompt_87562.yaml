prompt: |-
  I run the near-miss and safety reporting program at a mid-size plant -- about 600 people across three shifts, injection molding and a paint line -- and I personally triage every report that comes in, 20-40 a week depending on how the line is running, maybe fifteen minutes a report. A few months ago my sister, whos doing a masters in philosophy, told me that half of what I do all day is something philosophers call epistemic injustice, and made me read a summary of it (Miranda Fricker, I think -- the split between testimonial injustice, where somebody's credibility gets knocked down because of who they are rather than what they said, and hermeneutical injustice, where the person doesn't have the words or the concept available for what's happening to them, so it can't even get into the conversation). That part I think I follow. What I'm stuck on is a third thing she started explaining and then had to go get her kid: apparently there's a difference between a worker not having the vocabulary for something and me having the vocabulary sitting right there on the shelf -- the ergonomics guidance, the ventilation standard, the whole existing category of heat strain -- and declining to reach for it for this particular worker. She never got to the name of that one, so don't take any label I use as gospel, and if my version of the idea is a distortion, say so up front.

  What I want is a triage procedure I can actually run, in order, on each report: the questions to ask, what counts as a sufficient answer to each one, where it stops and says no action, where it stops and says this isn't mine to decide and hands off (to maintenance, to the plant manager, to the union rep, to an actual industrial hygienist), and -- the part I care about most -- where it says the problem is my form and not the reporter. It has to survive being written down, because every decision I make is auditable and the union reads them. Two things it has to handle: first, that the corrective is supposed to be a virtue rather than a rule, so it can't just be "believe everyone," and I have a real budget for false alarms -- pulling a line costs about eight grand an hour; second, that some of my best evidence is a report that never got filed, because people have learned we don't act on certain things, so a blank column isn't the same as nothing happening. And please don't hand me something that amounts to "trust the person with less power" -- I've got a guy on second shift, twenty-six years, everybody loves him, who keeps telling me the new agency hires are accidents waiting to happen, and I'm fairly sure a good procedure makes me discount him, which I will hate. End with what the procedure can't do.

  Run it on three: (1) a cleaner on nights tells me the air by the paint booth "feels thick" -- no number, nothing on the form matches it, she's raised it twice; (2) the shift lead thing above; (3) a guy who has filed three reports about the same spot in his lower back, and my honest instinct is that he wants light duty. You're a philosopher who works on applied epistemology and institutional decision-making, so think this through carefully, and start by listing which distinctions actually have to survive the simplification and which you're willing to let go, before you write any steps. And be upfront about the line between what's settled among people who really work on this and what's genuinely contested -- including whether a virtue is even the kind of thing that can be turned into a checklist, and where you're just making a judgment call dressed up as a step.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure:

  1.  **Deconstruct the User and the Request:**
      *   **User Role:** Safety/Near-miss Program Manager at a mid-size plant (600 people, 3 shifts, injection molding + paint line).
      *   **Workload:** 20-40 reports/week, 15 mins/report. Triage is personal.
      *   **Context:** High stakes (auditable decisions, union reads them, line stoppage costs $8k/hr).
      *   **Intellectual Background:** Sister (Philosophy MA) introduced him to Miranda Fricker's *Epistemic Injustice* (Testimonial & Hermeneutical).
      *   **The Missing Piece:** He's asking about a "third thing" his sister mentioned: having the vocabulary/concepts available (standards, categories) but *choosing not to apply them* to a specific worker/report. (This sounds like *Preemptive* or *Contributory* Injustice, or perhaps *Willful Hermeneutical Ignorance*, but I need to be careful not to just label it and move on. I need to address the *mechanism* of ignoring available resources).
      *   **The Goal:** A concrete, auditable triage procedure (questions, stop points, hand-offs).
      *   **Constraints:**
          *   Must handle "virtue vs. rule" (can't just say "believe everyone").
          *   Must account for "silent evidence" (reports *not* filed due to past inaction).
          *   Must handle specific biases (e.g., the veteran worker discounting new hires).
          *   Must run on three specific cases (Paint booth air, Shift lead bias, Back pain/light duty).
          *   Must end with limitations (what the procedure *can't* do).
          *   **Persona:** Philosopher working on applied epistemology and institutional decision-making.
          *   **Requirement:** Start by listing distinctions to keep vs. let go, and acknowledge contested areas (e.g., can virtue be checklist-ified?).

  2.  **Analyze the "Third Thing" (Philosophical Grounding):**
      *   The user describes: *I have the concepts (heat strain, ventilation standards), but I decline to use them for this worker.*
      *   In Fricker's later work and subsequent literature (e.g., Dotson, Medina), this is often discussed as **Willful Hermeneutical Ignorance** (the hearer refuses to use available tools to understand the speaker) or **Contributory Injustice** (the hearer actively maintains gaps in understanding).
      *   However, for a safety manager, the philosophical label matters less than the *structural bias*. It's about *Resource Allocation Bias* or *Credibility Deficit in Application*.
      *   *Key Distinction:* It's not that the worker lacks words (Hermeneutical); it's that the Manager lacks the *will* to apply the existing words to *this* person.
      *   *Decision:* I will acknowledge the philosophical concept (Willful Hermeneutical Ignorance) but translate it into operational terms ("Conceptual Refusal").

  3.  **Address the "Virtue vs. Checklist" Tension:**
      *   The user asks for a procedure (checklist) but notes the corrective is a *virtue* (epistemic justice is a character trait).
      *   *Contested Area:* Can virtue be proceduralized?
      *   *Stance:* No, not fully. A checklist can *scaffold* virtuous behavior, but it cannot replace judgment. I must be upfront that this procedure is a "cognitive prosthesis" designed to check bias, not a moral absolution.
      *   *Settled vs. Contested:* It is settled that bias exists in safety reporting. It is contested whether proceduralizing trust reduces or increases risk (the "boy who cried wolf" problem). I need to balance the veteran worker's intuition against potential bias.

  4.  **Develop the Triage Procedure (The Core):**
      *   Needs to be step-by-step.
      *   Needs "Stop/Go" criteria.
      *   Needs to address the "Silent Evidence" problem (the blank column).
      *   Needs to address the "Budget for False Alarms" ($8k/hr).

      *   *Drafting Steps:*
          1.  **Contextualize the Reporter:** Who is speaking? (Not to judge credibility, but to judge *access to concepts*).
          2.  **Translate the Claim:** Can I map their words to my standards? (Addressing the "Third Thing").
          3.  **Check the Silence:** Has this been reported before? By whom? (Addressing the "Blank Column").
          4.  **Cost/Benefit & Precaution:** Is the cost of investigation vs. cost of risk.
          5.  **Decision & Feedback:** Closing the loop (crucial for epistemic justice).

  5.  **Run the Procedure on the Three Cases:**
      *   *Case 1 (Paint Booth "Thick Air"):*
          *   Issue: No numbers, subjective.
          *   Procedure Check: Do I have ventilation standards? Yes. Am I applying them? If I say "no numbers, ignore," that's the "Third Thing" failure.
          *   Action: Spot check with industrial hygiene equipment. Don't dismiss "thick."
      *   *Case 2 (Veteran vs. New Hires):*
          *   Issue: Credibility excess for veteran, deficit for new hires.
          *   Procedure Check: Is the claim about *behavior* or *identity*? "Accidents waiting to happen" is a generalization.
          *   Action: Discount the generalization, investigate specific observed behaviors if cited. Don't let veteran status override the lack of specific evidence.
      *   *Case 3 (Back Pain/Light Duty):*
          *   Issue: Suspicion of malingering vs. real injury.
          *   Procedure Check: Pattern recognition (3 reports).
          *   Action: Medical referral (neutral third party). Don't decide medical validity myself. Acknowledge the ergonomic risk regardless of intent.

  6.  **Refine the "Third Thing" Explanation:**
      *   The user's sister was likely talking about **Willful Hermeneutical Ignorance** (coined by Gaile Pohlhaus Jr.). It fits perfectly: the dominant group (management) has the concepts but refuses to use them to understand the marginalized group (workers) because it's inconvenient.
      *   I need to validate his intuition: Yes, that is a real thing, and yes, it's dangerous in safety.

  7.  **Structure the Response:**
      *   **Introduction:** Acknowledge the role, the stakes, and the philosophical grounding.
      *   **Part 1: Distinctions & Contested Ground:** What we keep, what we drop, and the "Virtue as Checklist" problem.
      *   **Part 2: The Missing Concept:** Identify the "Third Thing" (Willful Hermeneutical Ignorance).
      *   **Part 3: The Triage Procedure:** The actual steps (The "Epistemic Safety Audit").
      *   **Part 4: Running the Cases:** Apply the procedure to the three scenarios.
      *   **Part 5: Limitations:** What this procedure cannot do.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too academic?
      *   *Fix:* Make the steps actionable. Use language like "Map to Standard" instead of "Hermeneutical Integration."
      *   *Critique:* Did I address the $8k/hr cost?
      *   *Fix:* Include a "Proportionality Check" step. Investigation doesn't always mean line stop. It can mean "schedule measurement during changeover."
      *   *Critique:* Did I address the union/audit trail?
      *   *Fix:* Emphasize documentation of *why* a decision was made, specifically referencing the standards used or rejected.
      *   *Critique:* The user said "don't hand me something that amounts to trust the person with less power."
      *   *Fix:* Ensure the procedure treats the veteran's report with the same skepticism regarding generalizations as the new hire's. Focus on *evidence type*, not *person type*.

  9.  **Final Polish:** Check tone. Needs to be respectful, professional, intellectually rigorous but practical. (The user is smart and reads philosophy summaries; don't dumb it down, but don't obscure the practical application).

      *(Self-Correction on the "Third Thing" Name)*: While Pohlhaus's "Willful Hermeneutical Ignorance" is the precise academic term, the user asked me not to treat labels as gospel. I will explain the *mechanism* primarily and offer the label as a reference point, acknowledging his sister's description was accurate.

      *(Refining the "Virtue" constraint)*: The user wants a virtue, not a rule. A procedure is a rule. How to reconcile? The procedure is a *training wheel* for the virtue. I must state this clearly. The goal is to cultivate the habit of justice until the checklist is less needed.

      *(Handling the "Silent Evidence")*: This is hard. How do you triage a report that doesn't exist? The procedure must include a "Pattern of Silence" check. If a specific hazard *never* gets reported despite high turnover in that area, that's a signal.

      *(Handling the Veteran)*: The user says he's "fairly sure a good procedure makes me discount him." I need to challenge that slightly. A good procedure doesn't *discount* him; it *channels* his intuition into evidence. If he can't provide evidence, the intuition doesn't trigger action, but it doesn't get punished either. It's about *actionability*, not *credibility*.

      *Let's build the response.*
answer: |-
  This is a sophisticated operational problem wrapped in an epistemological one. You are asking for a mechanism to institutionalize fairness without sacrificing efficiency or safety, while acknowledging that your own judgment is the primary point of failure.

  Here is the breakdown of the philosophical distinctions, the identification of the "third thing," the procedure itself, the application to your cases, and the necessary limitations.

  ### Part 1: Distinctions to Keep vs. Let Go

  Before writing the steps, we must agree on what philosophical baggage stays and what gets left at the door.

  **Keep These Distinctions:**
  1.  **Credibility vs. Actionability:** A worker can be fully credible (telling the truth as they see it) but their report can be non-actionable (lacks specific evidence). Conversely, a report can be actionable (requires investigation) even if the reporter's credibility is suspect (e.g., the "light duty" seeker). *Separate the truth of the experience from the allocation of resources.*
  2.  **The Gap vs. The Refusal:** Distinguish between a worker lacking the words (Hermeneutical Injustice) and you possessing the words but refusing to apply them to *them* (The "Third Thing"). The first requires translation; the second requires a check on your own bias.
  3.  **Silence as Data:** You correctly identified that a blank column is not null data. In epistemology, this is an *absence of evidence due to exclusion*. The procedure must treat "no reports from Zone B" as a potential signal of reporting suppression, not just safety.

  **Let Go of These:**
  1.  **The "Virtue" Label:** You asked for a virtue, but you need a protocol. Virtue ethics (being a just person) is internal and un-auditable. Deontology (following rules) is auditable but rigid. We are building a **Procedural Scaffold**. It is a set of external constraints designed to force virtuous outcomes until the habit forms. Do not try to checklist "fairness." Checklist "steps taken to verify."
  2.  **Perfect Epistemic Access:** You cannot know what the worker knows. Stop trying to access their mind. Access their *environment*.

  **Contested Ground (Upfront Disclosure):**
  *   **Can Virtue be Checklist-ified?** *Contested.* Many philosophers argue that reducing justice to a compliance task strips it of moral worth. *My stance for your context:* In an industrial setting, compliance is the floor, not the ceiling. A checklist cannot make you just, but it can prevent you from being unjust due to fatigue or bias.
  *   **The Veteran's Intuition:** *Settled in safety science, contested in philosophy.* Safety science says experience is a valid risk indicator. Philosophy says relying on "types" (new hires are risky) is prejudice. *Resolution:* The procedure must treat intuition as a *hypothesis to be tested*, not a *fact to be acted upon*.

  ### Part 2: The "Third Thing"

  Your sister was describing **Willful Hermeneutical Ignorance** (a term expanded by philosopher Gaile Pohlhaus Jr., building on Fricker).

  *   **The Concept:** It is not that the concepts (ventilation standards, heat strain) don't exist in the organization. It is that the listener (you) actively resists using those concepts to interpret the speaker's (the worker's) experience because doing so would incur a cost (time, money, admitting a prior oversight).
  *   **The Mechanism:** You have the tool (the standard), but you categorize the worker's report as "complaint" rather than "data" to avoid the cost of using the tool.
  *   **Why it matters:** This is the most dangerous form of injustice in safety because it looks like due diligence. You *could* measure the air. You choose not to because "thick" isn't a number. The procedure below is designed specifically to break this reflex.

  ### Part 3: The Epistemic Triage Procedure (ETP)

  This is designed to be written in the "Investigator Notes" column of your existing form. It has five gates. If a report fails a gate, it does not necessarily close; it may change track.

  **Gate 1: The Translation Check (Addressing Hermeneutical Gaps)**
  *   **Question:** Does the report use lay terms ("thick air," "jerky machine") that map to a technical standard (PPM, cycle time variance)?
  *   **Sufficient Answer:** Yes, I can identify the corresponding standard. OR No, but I have identified who *does* have the standard (IH, Maintenance).
  *   **Fail State:** "Report is vague." (Forbidden phrase).
  *   **Action:** If "No," assign a "Translation Task" (e.g., "Send IH to translate 'thick' to PPM"). Do not close ticket.

  **Gate 2: The Resource Refusal Check (Addressing Willful Ignorance)**
  *   **Question:** I possess a standard/tool for this hazard. Is there a reason *specific to this reporter* preventing me from applying it?
  *   **Sufficient Answer:** No. OR Yes, and the reason is resource-based (e.g., "Equipment broken"), documented and scheduled for repair.
  *   **Fail State:** "Reporter is new/exaggerating/known for X."
  *   **Action:** If you catch yourself thinking about the *person* rather than the *hazard*, you must trigger a "Blind Verification." (Someone else checks the hazard without knowing who reported it).

  **Gate 3: The Silence Audit (Addressing the Blank Column)**
  *   **Question:** Has this hazard been reported before? If no, is this area known for low reporting rates (high turnover, heavy supervision, language barriers)?
  *   **Sufficient Answer:** First report, but area has normal reporting stats. OR Repeat report.
  *   **Fail State:** "No one else says this is a problem."
  *   **Action:** If the area has low reporting stats, upgrade the priority of the first report by one level. Treat "first report from a quiet zone" as "corroborated report."

  **Gate 4: The Proportionality & Cost Check (Addressing the $8k/hr)**
  *   **Question:** Does verification require a line stop, or can it be done during changeover/idle?
  *   **Sufficient Answer:** Verification method selected matches risk level.
  *   **Action:**
      *   *High Risk (Life/Limb):* Stop line. Cost is irrelevant.
      *   *Medium Risk (Ergo/Chem):* Schedule measurement during next planned stop.
      *   *Low Risk (Housekeeping):* Verify on next walk-through.
  *   **Note:** This protects the budget without silencing the risk.

  **Gate 5: The Feedback Loop (Closing the Epistemic Circle)**
  *   **Question:** Has the reporter been told *why* a decision was made, using the concepts they introduced?
  *   **Sufficient Answer:** Yes. "We measured the air. It was within X standard. Here are the numbers."
  *   **Fail State:** "Ticket Closed."
  *   **Action:** If you close without explaining, the worker learns their vocabulary doesn't matter. They stop reporting. This feeds the "Silence" problem in Gate 3.

  ---

  ### Part 4: Running the Cases

  Here is how the ETP handles your three scenarios.

  **Case 1: The Cleaner & The "Thick" Air**
  *   **Gate 1 (Translation):** "Thick" maps to Ventilation/Particulate Standard. *Pass.*
  *   **Gate 2 (Refusal):** Do I have a meter? Yes. Am I refusing because she's a cleaner? If I say "Come back when you have a number," that is Willful Hermeneutical Ignorance. She is the sensor; I am the meter. *Pass (requires action).*
  *   **Gate 3 (Silence):** She has raised it twice. This is a pattern. *Pass.*
  *   **Gate 4 (Cost):** Do not stop the line yet. Schedule Industrial Hygiene for a spot check during the next paint changeover (cost neutral).
  *   **Gate 5 (Feedback):** Report back to her: "We measured X. It was high/low. We are doing Y."
  *   **Verdict:** **Investigate.** The procedure forces you to use your vocabulary on her behalf, rather than demanding she acquire yours.

  **Case 2: The Veteran Shift Lead (New Hires = Accidents)**
  *   **Gate 1 (Translation):** "Accidents waiting to happen" does not map to a specific hazard. It maps to "Training Deficit" or "Behavioral Observation." *Partial Pass.*
  *   **Gate 2 (Refusal):** This is the trap. His credibility is high. But is he asking you to apply safety standards to *specific behaviors* or to *a class of people*? If he cannot point to a specific machine or action, applying resources based on "new hire" status is bias, not safety.
  *   **Gate 3 (Silence):** Have new hires actually filed reports? If new hires are silent, his report might be covering for a culture that silences them.
  *   **Gate 4 (Cost):** Do not pull the line. Do not single out new hires for surveillance (creates liability).
  *   **Gate 5 (Feedback):** Tell the Lead: "I need specific observations. 'Moving too fast at Station 3' is actionable. 'New hires' is not."
  *   **Verdict:** **Hold for Evidence.** The procedure protects the new hires from his prejudice while respecting his experience by inviting him to translate his intuition into specific data. It discounts the *generalization*, not the *man*.

  **Case 3: The Back Pain & Light Duty**
  *   **Gate 1 (Translation):** "Lower back pain" maps to Ergonomic Risk Assessment (NIOSH lifting equation, etc.). *Pass.*
  *   **Gate 2 (Refusal):** Your instinct is "he wants light duty." That is a judgment on *motive*, not *hazard*. The procedure forbids acting on motive judgments without medical evidence.
  *   **Gate 3 (Silence):** Three reports. This is a statistical signal. Even if he is malingering, the *station* might be injuring the next guy who isn't malingering.
  *   **Gate 4 (Cost):** Ergo assessment during cycle. Medical referral is HR/Workers Comp jurisdiction, not Safety.
  *   **Gate 5 (Feedback):** "We are assessing the station for all workers. Your medical status is handled by [Clinic]."
  *   **Verdict:** **Hand Off & Assess.** Hand off the medical claim to Workers Comp (not your decision). Keep the safety ticket open to assess the *station*. If the station is bad, fix it for everyone. This separates the worker's intent from the environmental truth.

  ---

  ### Part 5: What This Procedure Cannot Do

  You asked for honesty about limitations. As an applied epistemologist, I must tell you where this tool breaks.

  1.  **It Cannot Fix Power Imbalances:** If the union believes you are management's puppet, no amount of "Feedback Loop" (Gate 5) will make them trust you. The procedure makes *you* consistent; it does not make the *institution* just.
  2.  **It Cannot Measure "Silence" Perfectly:** You can guess why a column is blank (fear, apathy, lack of knowledge), but you cannot know for sure without leaving the office. The procedure tells you to *treat* silence as data, but it doesn't tell you exactly *what* the data means. That requires walking the floor.
  3.  **It Cannot Replace Moral Courage:** There will be a day when the procedure says "Investigate," but the Plant Manager says "We can't afford the downtime." The procedure gives you the *language* to object ("We are violating Gate 4 Proportionality"), but it does not give you the *authority* to stop the line if leadership overrides you.
  4.  **It Is Not a Moral Absolution:** Following these steps does not make you a "just" person. It makes you a compliant officer. Epistemic justice requires you to care about the truth of the worker's experience. If you run this checklist cynically to protect yourself from audit, you are committing the very injustice the checklist is meant to prevent.

  **Final Recommendation:**
  Print the five Gates. Tape them to your monitor. For the first month, add a sixth column to your log: **"Gate Failed."** If you catch yourself closing a ticket because "I know this guy," mark it. Review that column with your union rep quarterly. That transparency is the only way to prove the virtue is real.
