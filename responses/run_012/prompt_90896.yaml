      *   *Readings:* Must use Taylor and Kymlicka correctly. Taylor = recognition/identity. Kymlicka = group rights/liberal multiculturalism.
      *   *Argument:* Take a stance. Either "Yes, it is neutrality because..." or "No, it is imposition because..." A sophisticated answer might say "It claims to be X but functions as Y."
