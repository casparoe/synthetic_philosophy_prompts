      *Wait, one more check:* The prompt says "Required reading... Charles Taylor, 'The Politics of Recognition'... Will Kymlicka, Multicultural Citizenship." The student writes: "as Will Kymlicka argues in The Politics of Recognition". This is an objective factual error regarding the syllabus. That alone justifies a grade penalty.

