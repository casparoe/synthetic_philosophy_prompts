  4.  **Evaluate against "Full-Credit Standard" (Mental Draft):**
      *   *Understanding:* Must distinguish clearly between "neutrality of the state" (institutional) and "neutrality of the public sphere" (individual conduct). The prompt *gives* this distinction in the background note.
