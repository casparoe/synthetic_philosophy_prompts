answer: |-
  This is one of the few places in economics where the math is thin enough that you can see the moral philosophy bleeding through the cracks. The Stern-Nordhaus debate is ostensibly about the Social Discount Rate (SDR), but as you suspect, it is actually a proxy war over the moral status of the future.

  Here is the map of the disagreement, the pressure test on the standard decomposition, and the implications for pure time preference itself.

  ### 1. Mapping the Parameter: What is $\delta$ actually doing?

  The parameter in dispute is $\delta$ (delta), often called the **Pure Rate of Time Preference** (PRTP) in the Ramsey Rule equation:

  $$r = \delta + \eta \cdot g$$

  Where $r$ is the discount rate, $\eta$ is the elasticity of marginal utility (how much less an extra dollar matters to a rich person), and $g$ is growth in consumption.

  **Nicholas Stern (The Review, 2006)**
  *   **The Number:** $\delta \approx 0.1\%$ (effectively zero).
  *   **The Stated Move:** Ethical prescription. Stern argues that $\delta$ represents a judgment on whether the welfare of future generations counts less simply because they exist later in time.
  *   **The Logic:** To set $\delta > 0$ is to discriminate against future people based on their temporal location. Since existence in 2100 is not a moral fault, their utility should be weighted equally to utility in 2024.
  *   **The Covert Move:** By setting $\delta \approx 0$, Stern forces the model to prioritize long-term catastrophic avoidance over short-term consumption smoothing. It is an ethical choice dressed as a parameter calibration, but Stern is transparent that it is ethical.

  **William Nordhaus (DICE Model)**
  *   **The Number:** $\delta \approx 1.0\% - 1.5\%$.
  *   **The Stated Move:** Descriptive calibration. Nordhaus argues $\delta$ should reflect observed market behavior and the opportunity cost of capital. If markets discount the future at 5%, and we use 0.1%, we are prescribing investment projects that the market deems wasteful.
  *   **The Logic:** Positive time preference reflects human impatience and, crucially, **existential risk**. There is a non-zero probability humanity won't exist in 300 years (asteroids, nuclear war, etc.). Therefore, $\delta$ captures the probability of extinction, not just moral myopia.
  *   **The Covert Move:** Nordhaus claims he is just "matching the market," but market rates reflect the preferences of *current* people regarding *their* future consumption. Using market rates to value *other people's* (future generations') welfare smuggles in the ethical judgment that current preferences trump future rights. It treats the discount rate as a technical constraint when it is actually a distributional weight.

  **The Verdict on the Parameter:**
  Stern treats $\delta$ as a **moral axiom** (equality across time). Nordhaus treats $\delta$ as an **empirical observation** (revealed preference + risk). Nordhaus is quietly doing both: he uses the "empirical" market rate to justify an "ethical" outcome where current consumption is prioritized, hoping the market calibration shields him from accusations of intergenerational discrimination.

  ### 2. Pressure-Testing the Standard Move: The Split

  The standard defense in welfare economics is the decomposition in the Ramsey Rule: $r = \delta + \eta \cdot g$.

  *   **$\delta$ ("Later is Later"):** Pure time preference.
  *   **$\eta \cdot g$ ("Future is Richer"):** The wealth effect.

  The argument goes: "We aren't discounting future people because they are later ($\delta$ is low); we are discounting future *damages* because future people will be richer ($\eta \cdot g$ is high), so a dollar of damage hurts them less than it hurts us."

  **Does this split do the work?**
  Superficially, yes. It allows economists to claim they are being egalitarian (low $\delta$) while still recommending low mitigation (high $r$).

  **Is the "Richer" half smuggling assumptions?**
  Yes, aggressively.

  1.  **The Growth Assumption ($g$):** The term $\eta \cdot g$ relies on the assumption that consumption per capita will grow steadily over centuries. Nordhaus's models generally assume positive $g$ regardless of climate policy. If climate change itself suppresses $g$ (which Stern argues), then the term $\eta \cdot g$ shrinks, and the discount rate falls, demanding *more* mitigation. By assuming high $g$ exogenous to climate damage, Nordhaus assumes away the severity of the problem in the discounting mechanism itself.
  2.  **The Compensation Principle:** The logic implies: "Future people will be rich enough to absorb the hit." This relies on a potential Pareto improvement logic—that the gains from growth outweigh the losses from climate damage. But you cannot compensate people who do not yet exist. Assuming they will be richer *despite* the damage we inflict is a circular justification for inflicting the damage.
  3.  **Substitutability:** The term assumes financial capital can substitute for environmental capital. If $\eta$ is high, it means money matters less to them. But if climate damages are non-marginal (e.g., ecosystem collapse), money may have *higher* marginal utility because it cannot buy a stable climate. The $\eta \cdot g$ term breaks down if the nature of "consumption" changes fundamentally.

  The split is mathematically clean but ethically leaky. It allows the economist to say, "I'm not discounting people, I'm discounting dollars," while ignoring that the value of those dollars is contingent on the very stability we are debating.

  ### 3. What This Shows About Pure Time Preference

  This episode reveals that **there is no fact of the matter** regarding pure time preference in the natural world. Atoms do not discount. Physics is time-symmetric (mostly).

  PTP is not a discovery; it is a **boundary condition** imposed on the model to make the integrals converge.
  *   If $\delta = 0$ and time is infinite, the sum of utility can diverge (become infinite), making optimization impossible.
  *   Therefore, a positive $\delta$ is often introduced for **mathematical tractability**, not moral reasoning.

  When Stern and Nordhaus fight, they are trading value judgments dressed as model parameters.
  *   Stern says: "The math should serve the ethics."
  *   Nordhaus says: "The ethics should serve the math (and the market)."

  Neither is describing a feature of the universe. They are choosing a prior. The "fight" is unresolved because there is no empirical test for how much a person in 2300 *ought* to matter to a person in 2024.

  ### 4. The Thought Experiment: Two Worlds

  Let's run your test case.
  *   **World A:** 100 units of welfare at $t=0$.
  *   **World B:** 100 units of welfare at $t=300$.
  *   **Conditions:** Identical people (same identities, just shifted in time, or same lineage with perfect memory/continuity), same total utility, no risk of extinction.

  **If someone prefers World A:**
  Is this different from preferring Person X over Person Y because X lives in New York and Y lives in London?

  *   **The Parfit View:** No, it is not different. Derek Parfit argued that the "Time of Existence" is morally irrelevant, just like spatial location. To prefer World A is **pure temporal discrimination**. It privileges the "now" self over the "later" self without a justificatory reason (like risk or changing identity).
  *   **The Economic View:** Yes, it is different. Preferences reveal value. If humans *feel* more connection to the present, that is a psychological fact. To ignore it is to impose a "rationality" that contradicts human nature.

  **Does this sink the practice?**
  If you accept Parfit's view (that temporal location is morally arbitrary), then **positive pure time preference ($\delta > 0$) is ethically indefensible** in a social welfare function. It sinks the standard practice of cost-benefit analysis over long time horizons.

  However, it does not necessarily sink the *use* of discounting if you can provide a **defense other than pure preference**.
  *   **Defense 1: Probability of Existence.** If there is a 1% chance humanity goes extinct per century, expected utility drops. This isn't time preference; it's risk weighting. (Nordhaus leans here).
  *   **Defense 2: Opportunity Cost.** If we can invest resources now to grow the pie, future people might be so much richer that transferring resources *to* them is actually inefficient. (This returns to the $\eta \cdot g$ argument).

  **The Hard Stop:**
  If you strip away risk ($g=0$, extinction=0) and you still prefer World A, you are admitting that you value your own temporal location more than an identical consciousness in the future.
  *   If that is a **personal** preference, it is fine for your own savings account.
  *   If that is a **social** preference (used for climate policy), it is a dictatorship of the present over the future.

  ### 5. Where the Theory Goes Quiet

  I will not invent a tidy resolution, because none exists. Here is where the theory runs out of road:

  1.  **The Non-Identity Problem:** Climate policy changes *who* gets born. The people in World B (300 years later) will not be the same specific individuals as in World A. Standard utilitarianism struggles here. If we mitigate climate change, we change the course of history, meaning different conceptions occur. Are we harming "future people" if the specific people who would have existed in the high-carbon world never exist at all? Discounting models ignore this entirely; they treat "Future Generation" as a single continuous agent, which is demographically false.
  2.  **Lexicographic Preferences:** If climate damage triggers a tipping point (e.g., uninhabitable zones), utility functions may not be smooth. You cannot trade off "some risk of extinction" against "current GDP growth" using a linear discount rate. The theory goes quiet because the math assumes marginal changes, not existential thresholds.
  3.  **The Is-Ought Gap in Calibration:** Nordhaus calibrates $\delta$ to market rates. But market rates reflect current power dynamics and current myopia. Using them to set social policy assumes the current distribution of power and time-horizon is *optimal*. There is no theoretical bridge that gets you from "markets discount at 5%" to "society ought to discount at 5%." That gap is filled with ideology, not math.

  **Summary:**
  The Stern-Nordhaus fight proves that the Social Discount Rate is not a number you find; it is a number you choose. The decomposition into "time" and "growth" is a useful accounting trick, but it does not absolve the chooser of the ethical burden. If you prefer World A over World B for no reason other than "it is sooner," you are making a moral claim that the present matters more than the future. You can make that claim, but you cannot hide it inside a parameter called $\delta$ and pretend it came from the market.
