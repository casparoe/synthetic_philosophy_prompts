answer: |-
  # A Taxonomy of Psychiatric Positions

  This tree is designed to stop your group from talking past one another. It forces a separation between **what we think mental illness *is*** (Metaphysics) and **what we think we are allowed to *do* about it** (Politics).

  Many arguments fail because someone assumes that if you believe mental illness is real, you must support involuntary treatment, or if you oppose involuntary treatment, you must believe mental illness is a myth. This tree shows those are independent choices.

  There are **8 leaves** (positions). To find your place in the tree, answer the two questions below.

  ---

  ## The Tree Structure

  ```text
  ROOT: Positions on Psychiatry
  │
  ├── FORK 1: METAPHYSICS (What is the label "Mental Disorder"?)
  │   │
  │   ├── A. Biological Realism (It asserts a bodily disease)
  │   ├── B. The Myth View (It asserts a "problem in living")
  │   ├── C. Pragmatic Instrumentalism (It asserts an administrative status)
  │   └── D. Critical Reformism (It asserts a valid concept corrupted by bad categories)
  │
  └── FORK 2: POLITICS (Is psychiatric coercion permissible?)
      │
      ├── 1. YES: Involuntary treatment/confinement is justified on psychiatric grounds.
      └── 2. NO: Involuntary treatment/confinement is never justified on psychiatric grounds.
  ```

  ---

  ## Fork 1: The Metaphysical Question
  **The Diagnostic Cases:** *The High-Functioning Drinker* and *The Long-Term Griever.*

  **The Question:**
  > Consider a person who drinks heavily but functions well and feels no distress, or a person whose grief has lasted years longer than expected. When we label these states a "disorder," what are we claiming exists?

  **The Branch Options:**

  *   **A. Biological Realism:** We are claiming there is a hidden physiological dysfunction (e.g., chemical imbalance, neural circuitry error), even if the person feels fine. The "disorder" is a natural kind, like diabetes or a tumor.
  *   **B. The Myth View:** We are making a moral or social judgment on lifestyle choices. There is no bodily lesion; there is only a "problem in living." The term "illness" is a metaphor that has been mistaken for fact.
  *   **C. Pragmatic Instrumentalism:** We are creating a bureaucratic category to unlock resources or manage risk. It is not a claim about truth or biology, but a tool—like designating a building a "fire hazard." It is a disease only in the sense that we have collectively decided to treat it as one for practical ends.
  *   **D. Critical Reformism:** The *concept* of mental disorder is valid (unlike the Myth View), but our current categories are junk. The label is currently doing social or political work (e.g., enforcing conformity) rather than describing pathology, but it *could* describe pathology if we cleaned up the system.

  ---

  ## Fork 2: The Political Question
  **The Diagnostic Cases:** *The Dangerous Refuser* and *The Requesting Patient.*

  **The Question:**
  > Consider a person who is dangerous due to delusions but refuses help, OR a person who asks to be admitted when doctors say they are fine. Who has the final authority?

  **The Branch Options:**

  *   **1. YES (Psychiatric Authority):** The state or doctors may override the Dangerous Refuser *because* they are mentally ill. Conversely, doctors may deny the Requesting Patient if medical criteria aren't met. Diagnosis grants special power to confine or treat against will.
  *   **2. NO (Civil/Liberal Authority):** Psychiatric diagnosis grants no special power. The Dangerous Refuser is handled by criminal law (if they break laws) or left alone (if they don't). The Requesting Patient is treated as a consumer entering a contract. Coercion is never justified on *medical* grounds.

  ---

  ## The Eight Leaves (Positions)

  Here are the specific positions you land on when you combine the answers.

  ### 1. The Standard Biomedical Position (A + 1)
  *   **Claim:** Mental disorders are brain diseases. Because they are diseases that impair judgment, doctors are justified in treating patients against their will to restore health, just as with a delirious medical patient.
  *   **On the Cases:** The Drinker has a hidden pathology; the Griever has a chemical dysregulation. The Dangerous Refuser must be treated for their own good. The Requesting Patient can be turned away if they don't meet medical necessity.
  *   **Status:** The dominant institutional view.

  ### 2. The Biomedical Libertarian (A + 2)
  *   **Claim:** Mental disorders are real brain diseases, but bodily autonomy is absolute. Having a disease does not forfeit your right to refuse care.
  *   **On the Cases:** The Drinker is sick but it's their body. The Dangerous Refuser is sick and dangerous, but must be handled via criminal law, not medical confinement. The Requesting Patient has the right to buy admission if a doctor is willing to sell it.
  *   **Status:** Rare. Often held by neurodiversity advocates who accept biological differences but reject the "sick role" implications.

  ### 3. The Hard Szaszian (B + 2)
  *   **Claim:** Mental illness is a myth; there are only problems in living. Therefore, there is no medical justification for coercion. Using psychiatry to confine someone is a form of torture or false imprisonment.
  *   **On the Cases:** The Drinker is making bad choices, not suffering a disease. The Griever is grieving, not ill. The Dangerous Refuser is a criminal or a nuisance, not a patient. The Requesting Patient is entering a voluntary contract for counseling, not medical treatment.
  *   **Status:** The classic "Anti-Psychiatry" stance.

  ### 4. The Moralistic Paternalist (B + 1)
  *   **Claim:** Mental illness is a myth (it's just bad behavior or deviance), *but* society is justified in coercing people to stop behaving that way for their own good.
  *   **On the Cases:** The Drinker isn't sick, but we should force them to stop drinking. The Dangerous Refuser isn't ill, but we should confine them for safety under the guise of treatment.
  *   **Status:** **Largely Unoccupied.** Szasz argued this is simply dishonest (calling prison "hospitalization"). It is incoherent to say "this is not a medical condition" and "therefore we apply medical coercion."

  ### 5. The Managerial Realist (C + 1)
  *   **Claim:** Whether it's a "real" disease doesn't matter. The label is a tool for risk management and resource allocation. If using coercion keeps costs down or reduces liability, it is permissible.
  *   **On the Cases:** The Drinker is labeled to justify insurance denial or mandated rehab. The Dangerous Refuser is confined because they are a risk factor, regardless of biology. The Requesting Patient is admitted only if it fits the bed-management plan.
  *   **Status:** Common in insurance companies and forensic systems, rarely stated openly as a philosophy.

  ### 6. The Harm-Reductionist (C + 2)
  *   **Claim:** The label is just a tool, and coercion is a bad tool. It breaks trust and makes outcomes worse. We should use the administrative label to give support, but never to force it.
  *   **On the Cases:** The Drinker gets support if they want it. The Dangerous Refuser is monitored socially, not medically. The Requesting Patient gets a bed because they asked, no medical gatekeeping required.
  *   **Status:** Common in peer-support and housing-first models.

  ### 7. The Critical Psychiatrist (D + 1)
  *   **Claim:** Mental illness is real, but the current system is corrupted by pharmaceutical influence and social control. Coercion is sometimes necessary, but only under strictly reformed, transparent guidelines that acknowledge the political risk.
  *   **On the Cases:** The Drinker might be over-diagnosed due to industry pressure. The Dangerous Refuser can be held, but only with extreme legal oversight. The Requesting Patient is listened to as an expert on their own needs, not overruled lightly.
  *   **Status:** Growing movement within academic and clinical psychiatry.

  ### 8. The Abolitionist Reformer (D + 2)
  *   **Claim:** The concept of mental illness is theoretically valid, but the current system is so corrupted by coercion and social norms that it cannot be trusted. We must abolish involuntary powers before we can trust the diagnosis.
  *   **On the Cases:** The Drinker and Griever are failed by a system that medicalizes normal suffering. The Dangerous Refuser is a failure of social safety nets, not a medical emergency. The Requesting Patient is the only valid pathway until the system is fixed.
  *   **Status:** Overlaps with Mad Pride and service-user movements.

  ---

  ## Post-Mortem: Gaps and Glitches

  ### 1. The Unoccupied Leaf: The Moralistic Paternalist (B + 1)
  *   **Position:** "Mental illness is a myth, but we should still lock people up for it."
  *   **Verdict:** **Incoherent.**
  *   **Why:** If you admit the condition is not a disease (Branch B), you lose the specific ethical exemption that allows medical coercion (Fork 2, Option 1). You are left arguing for locking people up for bad behavior. While societies *do* this, they rarely admit to it openly in a medical context because it undermines the legitimacy of the hospital. Szasz's main contribution was pointing out that when people hold this position, they are usually lying to themselves about the "medical" nature of the confinement.

  ### 2. Indistinguishable Pairs: The Managerial Realist (C + 1) vs. Standard Biomedical (A + 1)
  *   **Position:** Both support coercion and use the same labels.
  *   **Verdict:** **Practically Indistinguishable.**
  *   **Why:** In a clinical setting, a doctor who believes depression is a brain lesion (A) and a doctor who believes depression is a useful category for prescribing SSRIs (C) will often write the same prescription and sign the same involuntary hold forms. The metaphysical difference only becomes visible in a research lab or a philosophy seminar, not at the bedside. Your group may find these two positions merge in practice.

  ### 3. Indistinguishable Pairs: Hard Szaszian (B + 2) vs. Abolitionist Reformer (D + 2)
  *   **Position:** Both oppose all psychiatric coercion.
  *   **Verdict:** **Strategically Similar, Theoretically Distinct.**
  *   **Why:** Both end up saying "No involuntary treatment." However, the Szaszian says "There is nothing to treat," while the Reformer says "There is something to treat, but we can't be trusted to do it without violence." In a reading group discussion, this distinction matters: the Szaszian wants to dismantle the *concept* of mental illness; the Reformer wants to dismantle the *power structure* of psychiatry while saving the concept.

  ### 4. The "Patient Requesting" Case Tension
  *   **Observation:** This case reveals a hidden split in the **NO Coercion** branch (Leaves 2, 4, 6, 8).
  *   **Tension:** If a patient demands admission and the doctor says "You aren't sick," does the patient have a right to demand care?
      *   The **Libertarian/Szaszian** says yes (it's a contract between adults).
      *   The **Harm-Reductionist** says yes (meet them where they are).
      *   The **Biomedical** says no (you can't treat a healthy brain).
  *   **Note:** This tree groups them under "No Psychiatric Coercion," but your group should watch for this friction. It separates the "Consumer Model" from the "Medical Model" even among those who oppose force.
