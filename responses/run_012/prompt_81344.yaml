  **GLOBAL SOVEREIGN RISK UNDERWRITERS LTD.**
  **POLICY FORM 7B: FAMINE & FOOD-SECURITY INDEMNITY**

  **SECTION 1: DEFINITIONS AND THRESHOLDS**
  1.1 **Famine Event.** A declared situation wherein crude mortality rates exceed two deaths per ten thousand persons per day, or acute child wasting prevalence exceeds thirty percent (30%) within a defined geographical zone. These thresholds are calibrated to avoid over-triggering and ensure only catastrophic structural failures qualify for indemnification.
  1.2 **Act of God.** A reduction in aggregate regional caloric output directly attributable to meteorological anomaly, pestilence, or soil degradation, verified by satellite imagery.
  1.3 **Exchange Entitlement Collapse.** A situation wherein foodstuff exists within the relevant jurisdiction but remains inaccessible to specific demographic groups due to liquidity constraints, labor market failure, or legal prohibition. This is classified herein as a Pre-Existing Economic Condition.

  **SECTION 2: COVERAGE AND EXCLUSIONS**
  2.1 **Indemnifiable Loss.** The Underwriter shall pay benefits only when a Famine Event is conclusively categorized as an Act of God.
  2.2 **Standard Exclusion.** No benefit is payable for losses arising from Exchange Entitlement Collapse. The Insured acknowledges that market access disparities are inherent to sovereign risk and do not constitute an insurable意外 (accident).
  2.3 **The Output Paradox Rider.** In instances where a Famine Event occurs while regional food output is flat or rising, liability is suspended pending investigation. The Claims Adjuster reserves the right to classify such events as "Administratively Opaque," wherein payout is reduced by fifty percent (50%) to account for the difficulty in distinguishing scarcity from distribution failure.

  **SECTION 3: STATE INTERVENTION LIABILITIES**
  3.1 **Export Bans.** If the Insured Government imposes bans on grain exportation during a deficit period, liability is limited to twenty percent (20%) of the claim value, deemed a mitigated loss.
  3.2 **Requisitioning.** Losses arising from the state seizure of private food stocks for military or civil service use are expressly excluded. Such acts are considered deliberate policy choices rather than unforeseen contingencies.
  3.3 **Procurement Quotas.** Mandatory delivery schedules imposed on producers shall be treated as a Force Majeure variant. Liability is capped at five percent (5%) unless the quota exceeds historical averages by more than two standard deviations.

  **SECTION 4: CLASSIFICATION AND MORAL HAZARD**
  4.1 **Determination of Cause.** The classification of a Famine Event as either Act of God or Exchange Entitlement Collapse shall be made by the Insured's Ministry of Agriculture, subject to Underwriter review.
  4.2 **Conflict of Interest.** The Insured warrants that the Ministry of Agriculture acts in good faith. Should the Ministry classify a shortage as meteorological while satellite data indicates full silos, the Underwriter reserves the right to void the policy retroactively for misrepresentation of risk.
  4.3 **Data Provision.** The Insured must provide mortality data forthwith. Delays in reporting mortality statistics exceeding thirty (30) days will be interpreted as an attempt to obscure the nature of the entitlement failure and will result in claim denial.

  **SECTION 5: SUBROGATION AND RECOVERY**
  5.1 **Right of Recovery.** Upon payment of a claim, the Underwriter is subrogated to all rights of the Insured to recover losses from responsible parties, including the sovereign state itself.
  5.2 **Recovery Schedule.** The Underwriter maintains a ranked list of "Recoverable Sovereigns." Priority for litigation is assigned based on asset liquidity and diplomatic immunity waivers. Tier 1 Sovereigns (high liquidity) will be pursued aggressively; Tier 3 Sovereigns (low liquidity) may be exempted from recovery efforts at the Underwriter's discretion.
  5.3 **Set-Off.** Any future aid packages or loans provided by the Underwriter's affiliates may be offset against outstanding subrogation claims.

  **SECTION 6: GENERAL PROVISIONS**
  6.1 **Governing Law.** This policy shall be governed by the laws of the Canton of Zurich, excluding any local statutes regarding humanitarian intervention.
  6.2 **Arbitration.** Disputes regarding the definition of "starvation" or "negligence" shall be settled by binding arbitration in a neutral jurisdiction selected by the Underwriter.

  **SECTION 7: CUSTOMER SERVICE AND CLAIMS**
  **We're Here to Help!**
  At Global Sovereign Risk Underwriters, we understand that food security is complex. Our dedicated claims team is ready to assist you in navigating your coverage options.

  **To File a Claim:**
  1. Complete Form 7B-Claim (Rev. 4).
  2. Attach verified mortality tables for the preceding six (6) months.
  3. Include a sworn affidavit from the Head of State confirming no food stocks were withheld for political leverage.
  4. Mail to: Claims Processing Center, PO Box 990, Zurich.

  **Contact Us:**
  Phone: +41-44-555-0199 (Mon-Fri, 0900-1700 CET)
  Email: claims@gsru-ltd.fake
  Website: www.gsru-ltd.fake/support

  *Thank you for choosing Global Sovereign Risk Underwriters. Protecting tomorrow's harvest, today.*
