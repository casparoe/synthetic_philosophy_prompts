answer: |-
  This is a profound ethical dilemma that mirrors debates in political philosophy regarding distributive justice. You are effectively arguing over which currency of fairness to use: welfare (your brother), resources (your sister), or capability (you). Each has merit, but each fails on its own.

  Your brother's approach (equality of welfare) is compassionate but paternalistic. By suggesting he take less so you all end up "equally well off," he assumes he has the authority to measure your life satisfaction and your sister's needs. As your sister noted, this treats her disability as a deficit to be managed rather than a circumstance to be accommodated, which undermines her agency.

  Your sister's approach (equality of resources) respects her autonomy but ignores reality. Equal dollars do not buy equal freedom. Because of her disability, a dollar buys her less accessibility than it buys you in tuition or your brother in leisure. Furthermore, her demand for "the same wherewithal" actually supports looking at the *total* picture, not just the probate estate.

  Your approach (equality of capability) is the strongest ethical foundation. It focuses on what people are actually able to be and do. However, capabilities are subjective and hard to measure. To make this work without falling into your brother's paternalism, you must translate "capability" into "resources," but you must calculate those resources correctly.

  This is where the earlier gifts and the house change the answer.

  You cannot judge fairness based solely on the current estate. Your mother already distributed wealth unequally during her life. To treat you as equals now, you must adopt the legal concept of "hotchpot," where lifetime gifts are brought back into the imaginary pot to calculate the true share. If your brother received a paid graduate degree and you received a down payment, those are advancements on your inheritance. Your sister received nothing. If you divide only the current assets equally, you perpetuate your mother's past inequality. True fairness requires equalizing the *total lifetime transfer* from mother to child.

  Regarding the house: It is not merely an asset; for your sister, it is a specific capability enabler (accessible housing). For you and your brother, it is liquid capital. She should have the right of first refusal to keep the house at an appraised value. The value of the house should be credited toward her total lifetime share. If the house plus her share of the remaining estate equals the value of your brother's grad school funding or your down payment, then she has her "wherewithal" without accepting charity. If the house is worth more than her equalized share, she owes the difference to you; if less, she receives more cash.

  By accounting for past gifts, you satisfy your sister's demand for equal treatment (not special treatment based on disability) while acknowledging that her "equal share" must be larger in the current estate to compensate for receiving nothing earlier. This allows your brother to contribute less without framing it as pity, and it allows you to fund tuition without ignoring your sister's housing needs.

  Verdict: Equal Capability Adjusted for Lifetime Transfers.
