answer: |-
  There is no single, canonical proper name (like "Gresham's Law" or "The Bandwagon Effect") that universally identifies this specific configuration in the literature on social epistemology or decision theory. However, the phenomenon is well-recognized in fragments across different disciplines.

  The closest established technical terms are **Common Source Bias** (in meta-analysis and evidence-based medicine) and **Pseudoreplication** (in statistics and ecology). Neither captures the full social-epistemic nuance you describe: the *illusion* of independent corroboration among rational agents.

  To satisfy your request for a name that is bounded and distinguished from its neighbors, I propose the term **Epistemic Pseudoreplication**.

  Below is the precise definition, the conditions under which it obtains, and its boundaries against the concepts you excluded.

  ### 1. The Name and Definition

  **Term:** **Epistemic Pseudoreplication**
  *(Also descriptively referred to as **Upstream Coupling** or **Common-Source Convergence**)*

  **Definition:** A structural failure in collective judgment where multiple agents produce convergent verdicts that are treated as independent evidence, but are in fact statistical replicates of a single upstream information source.

  **Necessary and Sufficient Conditions:**
  1.  **Upstream Monoculture:** There exists a single source artifact $S$ (dataset, benchmark, report, measurement convention) that is necessary for the formation of the verdict.
  2.  **Processing Independence:** Agents $A_1...A_n$ do not communicate with each other. They do not observe each other's verdicts prior to forming their own. They believe they are acting on private or independent evidence.
  3.  **Deterministic Coupling:** The verdict $V$ produced by any agent $A_i$ is functionally dependent on $S$. If $S$ contains error $E$, every $V_i$ contains $E$.
  4.  **Aggregation Illusion:** An observer (or the agents themselves) treats the set $\{V_1...V_n\}$ as $N$ independent samples, compounding confidence proportional to $N$, rather than treating them as $1$ sample measured $N$ times.

  ### 2. Why Existing Terms Are Insufficient

  *   **Common Source Bias:** In meta-analysis, this refers to multiple studies using the same data. It identifies the *statistical* error but does not capture the *social* mechanism of independent analysts believing they are corroborating one another. It is a subset of Epistemic Pseudoreplication.
  *   **Pseudoreplication:** In ecology (Hurlbert, 1984), this is treating non-independent data points as independent. It is the statistical ancestor of your pattern but lacks the epistemic dimension of *agents* forming *judgments*.
  *   **Common Mode Failure:** In engineering, this describes a system where multiple components fail due to a single cause. It captures the structural vulnerability but misses the *epistemic confidence* aspect (the false belief that the system is robust because multiple components "agreed").

  ### 3. Boundary Conditions: What It Is Not

  You requested precise differentiation from three specific neighbors. Here are the edges of the concept.

  #### A. Vs. Information Cascade
  *   **The Cascade Mechanism:** Sequential. Agent $A_2$ sees Agent $A_1$'s *action* and rationally ignores their own private signal to follow $A_1$. The independence is broken by **social observation**.
  *   **Epistemic Pseudoreplication:** Parallel (or effectively parallel). Agent $A_2$ does *not* see $A_1$'s action. $A_2$ consults their own evidence. The independence is broken by **shared infrastructure**.
  *   **The Edge:** If the analysts stop using the vendor database and start looking at what the other analysts published, it becomes a Cascade. If they keep using the database but ignore the other analysts, it is Epistemic Pseudoreplication.

  #### B. Vs. Groupthink
  *   **The Groupthink Mechanism:** Normative. Agents suppress dissent or alter their judgment due to **social pressure**, desire for cohesion, or authority dynamics. The error is psychological/sociological.
  *   **Epistemic Pseudoreplication:** Structural. Agents feel no pressure to conform. They would reach the same verdict even if isolated in separate rooms, provided they have the source $S$. The error is architectural.
  *   **The Edge:** If the evaluators match verdicts because they fear offending the model creator, it is Groupthink. If they match verdicts because they all use the same flawed benchmark without conferring, it is Epistemic Pseudoreplication.

  #### C. Vs. Generic Correlated Error (Condorcet/Jury Theorem)
  *   **The Correlated Error Mechanism:** Latent. Voters may share a cultural bias, a shared education, or a common cognitive heuristic that makes their errors correlated. The source of dependence is **diffuse** (e.g., "they all went to the same school").
  *   **Epistemic Pseudoreplication:** Point-Source. The dependence is traceable to a **specific, identifiable artifact** ($S$). It is not a general similarity of thought; it is a specific dependency of data.
  *   **The Edge:** If the analysts agree because they all share a neoliberal economic worldview, that is Correlated Error (latent trait). If they agree because they all downloaded the same CSV file from Bloomberg, that is Epistemic Pseudoreplication (point-source).

  ### 4. Summary of the Configuration

  | Feature | Information Cascade | Groupthink | Correlated Error | **Epistemic Pseudoreplication** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Dependency Source** | Preceding Actions | Social Norms | Latent Traits | **Upstream Artifact** |
  | **Agent Awareness** | Aware of others | Aware of group | Unaware | **Unaware of shared source** |
  | **Private Signal** | Ignored | Suppressed | Biased | **Used (but is the source)** |
  | **Structure** | Sequential | Cohesive | Parallel | **Parallel / Hub-and-Spoke** |
  | **Rationality** | Rational (Bayesian) | Irrational (Emotive) | Bounded Rationality | **Rational (Local)** |

  ### 5. Why This Distinction Matters

  Naming this **Epistemic Pseudoreplication** is not merely semantic; it dictates the remedy.

  *   To fix a **Cascade**, you must hide earlier votes or incentivize revealing private signals.
  *   To fix **Groupthink**, you must introduce dissent or anonymity.
  *   To fix **Correlated Error**, you must diversify the population's background.
  *   To fix **Epistemic Pseudoreplication**, you must **diversify the source**. You do not need more analysts; you need more datasets.

  The phenomenon you describe is a specific systemic risk in data-driven economies. As decision-making becomes more reliant on centralized vendors (credit bureaus, data aggregators, benchmark providers), the probability of Epistemic Pseudoreplication increases, creating systems that appear robust (high consensus) but are fragile (single point of failure).

  **Recommendation:** Use **Epistemic Pseudoreplication** when referring to the agents' error in counting evidence, and **Upstream Coupling** when referring to the structural dependency itself. Both are precise, bounded, and distinguishable from the cascades and biases you noted.
