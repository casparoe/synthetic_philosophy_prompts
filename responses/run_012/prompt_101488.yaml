answer: |-
  Good evening. For those of you who know me only as the Chair of this compact, you might expect me to talk about policy, or legislation, or the delicate art of getting seven states to agree on what color crayon to use for a wetlands map. But tonight is not about the compact. It is about [Deputy's Name], and the thirty-one years she spent telling us that we were arguing about the wrong things.

  Thirty-one years is a long time to sit in meetings. It is long enough to watch regulations be born, grow old, and die. It is long enough to see the same arguments cycle through the room like bad weather. But [Deputy's Name] did not just endure the weather; she built a barometer. She insisted that when we threw around the phrase "race to the bottom," we were usually panic-stricken children shouting "wolf" in a room full of shepherds. She believed that before you try to stop a race, you must identify the track.

  She taught us that there are only three boxes. If you are a regulator in this room, you know the literature she read, dog-eared, and then argued with. If you are family or friends, you know the look she got on her face when someone said something imprecise at the dinner table. Tonight, I want to honor her by using those boxes one last time.

  The first box is the genuine Prisoner's Dilemma. This is the bleak one. In this scenario, every jurisdiction wants high standards. We all want clean air and safe water. But because we cannot enforce a promise from above, and because we fear our neighbor will cheat to attract business, lowering the standard becomes the only safe move. It is a dominant strategy. In this box, goodwill is useless. Handshakes are worthless. You can talk until you are blue in the face, but the incentives force you down. [Deputy's Name] taught us that when you are in this box, you do not waste time on summits. You admit the defeat of voluntarism and you build enforcement mechanisms or you accept the loss. It is honest pessimism.

  The second box is the Coordination Problem. This is where most of us live, and where most of our energy is wasted. Here, no one is defecting. Everyone is actually cooperating, but we are cooperating to stay in a bad place. Imagine everyone driving on the left side of the road because everyone else is, even though the right side is safer. No one wants to switch alone. In this box, the "race" is not a conflict of interest; it is a failure of imagination. We are parked in a stable equilibrium that everyone dislikes. The exit here is not a treaty; it is a focal point. It requires a first mover brave enough to break the silence. [Deputy's Name] spent decades looking for those first movers, because she knew this box admits hope.

  The third box was the one she was most stubborn about. This is the race where the bottom is actually efficient. Here, the aggregate wealth increases, standards relocate to where they are cheapest to maintain, and the economy hums. But because status is relative, some jurisdictions feel poorer because others are growing faster. The loss is not absolute; it is positional. It feels like a race to the bottom because someone is losing the race, not because the ground is collapsing. She argued that moralizing this box is dangerous. You cannot regulate away jealousy without regulating away growth.

  And she reserved a special frustration for those who lumped these three things together with the depletion of a common-pool resource. She would sit up straighter in her chair and say, "Using up a fishery is not the same as lowering a standard." One is a rivalrous resource being eaten; the other is a rule being relocated. Conflating the two meant we spent decades trying to solve depletion with coordination, and coordination with enforcement. It was a category error that cost us time, money, and credibility.

  Her genius was not in creating these categories—smart people have drawn these lines before. Her genius was in refusing to move a case from one box to another just because the solution was politically convenient. In meetings, when the pressure was on to declare a crisis, she would ask the quiet question: "Which box is this?" If it was a Prisoner's Dilemma, she told us to stop pretending a press release would fix it. If it was a Coordination Problem, she told us to stop writing treaties and start looking for a leader. If it was Positional, she told us to have the courage to say that not every loss is a tragedy.

  She taught us that honesty about hopelessness is a virtue. There is nothing more demoralizing to a staff than trying to solve a structural dilemma with a coordination strategy. It makes them feel incompetent when they are actually just misdiagnosed. She protected us from that feeling by sorting the cases correctly.

  As I prepare to hand over the gavel, I have been thinking about the language we use to describe these failures. We often swap the words "trap" and "dilemma" as if they are synonyms. We say we are "trapped in a dilemma." But [Deputy's Name]'s career suggests they are fundamentally different, and that the difference matters.

  A dilemma is a condition of the world. It is a conflict built into the incentives themselves. In a true dilemma, the loss is unavoidable given the current rules. It is a wall. You can bang on it, you can mourn it, but you cannot walk through it without changing the physics of the situation.

  A trap, however, is a condition of the actor. A trap is a situation where an exit exists, but we are conditioned not to see it, or too afraid to take it. A trap relies on our habits, our fears, or our failure to communicate. A dilemma denies you a win; a trap denies you the exit key.

  When we mistake a trap for a dilemma, we surrender to inevitability. We say, "The market forces us," when actually, we just haven't found the focal point. When we mistake a dilemma for a trap, we waste energy looking for a latch that isn't there. We try to negotiate our way out of a Prisoner's Dilemma as if it were a coordination problem. We try to talk down a wall.

  [Deputy's Name] spent thirty-one years teaching us to tell the difference. She taught us that most of the races we fear are traps, not dilemmas. They are doors painted to look like walls. But she also taught us that some walls are real, and pretending they are doors is how you break your nose.

  So, as you move forward, whether you are regulating emissions or just navigating a family dinner, do not just ask if the situation is bad. Ask what structure is making it bad. Is it a conflict of interest? Is it a failure of coordination? Or is it just the pain of relative position? And when you feel stuck, ask yourself: Is this a limit on the world, or a limit on me?

  She leaves us with a cleaner framework, if not always a cleaner environment. She leaves us with the tools to know when to fight, when to lead, and when to simply accept the geometry of the game.

  In one line: The race to the bottom is not a law of nature, but a failure of taxonomy.
