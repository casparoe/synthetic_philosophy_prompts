answer: |-
  **Exam Question: Philosophy of Mind (Final)**
  **Time Allowed:** 90 Minutes
  **Marks:** 20

  **Question 1**

  Consider the following intuition from the physical sciences: saying "the high temperature caused the pressure to rise" does not compete with saying "the mean kinetic energy of the molecules caused the pressure to rise." These are not two rival causes fighting over the same effect; rather, they are the same causal process described at different levels of grain (coarse vs. fine).

  Some philosophers propose applying this model to the mind: a mental event (e.g., a pain) and its physical realizer (e.g., C-fiber firing) are not competitors, but the same cause described at different levels.

  In a structured essay, address the following:

  (a) State the Causal Exclusion Argument formally. Identify specifically which premise does the heavy lifting in forcing a choice between mental causation and physical closure (do not simply say "physical sufficiency").
  (b) Explain how the "different levels of grain" (or determinable/determinate) reply attempts to block this argument. Why does this view claim overdetermination is not problematic here?
  (c) Evaluate this reply. If it succeeds, is mental causation rendered harmless and ordinary (like the temperature case), or must we give up something significant about the mental (e.g., its distinctness)?
  (d) Finally, decide: Is this move merely the standard "special sciences" defense (based on multiple realization) in new clothing? If it is the same move, does the exclusion argument threaten biology and economics too, or does this grain-based view save the mental specifically where multiple realization fails?

  ***

  **Model Answer**

  The Causal Exclusion Argument threatens non-reductive physicalism by suggesting mental causes are rendered idle by physical causes. The argument relies on four claims: (1) Mental events cause physical events; (2) Physical events have sufficient physical causes (Closure); (3) No event has more than one sufficient cause unless it is a genuine case of overdetermination; and (4) Mental events are distinct from physical events. The premise doing the heavy lifting is (3), the Exclusion Premise. It forces a dilemma: if the physical cause is sufficient, and we reject systematic overdetermination, the mental cause must be excluded unless it is identical to the physical.

  The "different levels of grain" reply attacks premise (4) and the interpretation of (3). It argues that mental and physical events are not distinct competitors like two rocks breaking a window. Instead, they stand in a determinable/determinate relation. The mental property is a coarse-grained determinable of the fine-grained physical determinate. Just as temperature *is* mean kinetic energy (not a rival to it), pain *is* (or is constituted by) the neural state. Therefore, citing both is not overdetermination; it is citing the same causal power twice at different resolutions. Exclusion only applies to independent causes, not nested descriptions.

  Does this work? It succeeds in avoiding exclusion, but only by weakening the distinctness of the mental. If the mental is just a coarse grain of the physical, it lacks independent causal powers. This makes mental causation "ordinary" in the sense that higher-level sciences are ordinary, but it risks collapsing into a type-identity theory. If the mental cause is nothing over and above the physical cause, we save causation but lose the robust autonomy non-reductive physicalists sought. The mental becomes causally relevant only insofar as it tracks the physical.

  Crucially, is this just the old "special sciences" move? The standard defense relies on multiple realization: mental states are distinct because many physical states could realize them. The grain reply is different. Multiple realization argues for distinctness despite physical variation; the grain argument argues for non-competition despite physical sufficiency. However, they converge on the same outcome: higher-level causation is valid if levels are nested, not competing.

  If this is the same move, then the Exclusion Argument indeed threatens biology and economics equally. If physical closure excludes the mental, it excludes the biological gene or the economic inflation rate too. The grain reply saves them all together or none at all. Therefore, this move does not save the mental specifically; it saves higher-level causation generally. We must accept that causation operates at multiple levels without competition, or accept global epiphenomenalism. The grain view chooses the former, accepting that mental causation is no more mysterious than thermodynamic causation, provided we abandon the idea that higher levels compete with the microphysical base.

  ***

  **Marking Scheme (20 Marks Total)**

  | Criterion | Marks | Common Failure |
  | :--- | :---: | :--- |
  | **1. Exclusion Premise:** Correctly identifies the "No Overdetermination" premise as the engine of the argument, not just Closure. | 4 | Students claim Closure alone kills mental causation without explaining why two causes aren't allowed. |
  | **2. Grain Mechanism:** Explains the determinable/determinate relation as non-competitive nesting, not identity or correlation. | 4 | Students confuse "same cause different description" with "two causes happening together." |
  | **3. Critical Evaluation:** Takes a stance on whether this saves mental causation without cost (e.g., loss of distinctness). | 4 | Students describe the view neutrally without evaluating whether it sacrifices mental autonomy. |
  | **4. Special Sciences Distinction:** Clearly distinguishes multiple realization (variation) from grain (nested resolution) and links implications. | 4 | Students treat "multiple realization" and "levels of grain" as synonymous terms without distinction. |
  | **5. Argumentative Coherence:** Maintains a consistent position on whether biology/economics fall too (global vs. local threat). | 4 | Students argue the mental is saved while biology is threatened (or vice versa) without justification. |
