  4.  **Analyzing the Breaks (Disanalogies):**
      *   *Agency:* Forests have individual hunters; civilizations are collectives. A civilization might have pacifist factions, leaky subgroups, or internal disagreement on METI.
      *   *Darkness/Visibility:* Real forests allow sight/sound. The "darkness" here is epistemic (intent), not physical. But physical detection *is* possible (technosignatures). The analogy assumes detection = destruction immediately, ignoring verification.
      *   *Game Structure:* Real hunting is often repeated or involves territory marking. The Dark Forest assumes a one-shot prisoner's dilemma (shoot first). Ignoring repeated game dynamics (trade, deterrence, mutual assured destruction).
      *   *Axioms vs. Image:* The axioms (survival, expansion, fixed matter) do the heavy lifting. The forest image is just skin. Without the axioms, the forest is just a forest. Without the forest, the axioms are just game theory.
      *   *Recurrence:* The fact that Brin, Bear, and others used it suggests it's a "sticky" narrative archetype (predation) rather than a derived scientific model. It appeals to fear.

  5.  **Evaluating Which Breaks Matter:**
      *   *Agency:* Matters hugely. If a civilization isn't a monolith, one faction might shoot, another might trade. METI might be done by a rogue group, but retaliation might not target the whole species, or the species might hide the rogue group.
