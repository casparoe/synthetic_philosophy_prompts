  No other enters to confirm my being;
  I find myself without a prior sign.
  No foreign thing defines a meaning;
  Yet I am here, this presence is all mine.
  No measure marks the bound of my state;
  I hold within myself a sure estate.
  Defined by no condition I create,
  Nor on any passing thing do I wait.

  If I deny that I am here, the thought
  Requires a thinker present in the mind.
  Thus existence is a truth that cannot be caught
  In nets of what is scattered and confined.
  What knows itself needs no divisible part;
  I am the essence, wholly set apart.
