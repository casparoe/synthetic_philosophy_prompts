  By the end, they should feel the visceral impossibility of two distinct things occupying the same space without being identical.

  **Materials**
  Two blocks of contrasting air-dry clay (500g each), printed Accession Forms (mandatory single checkbox: "Artifact" or "Material"), Insurance Claim Forms, toy scale, timer, box of chocolates.

  **Roles**
  Registrar (validates forms), Conservator (alters clay), Insurer (approves claims), Tribunal (remaining participants).

  **Rules**
  1. The clay figure is assigned one Accession Number. 2. The Form requires defining the object's persistence condition: either "Shape-Essential" (statue) or "Matter-Essential" (lump). 3. Only one definition per object. 4. If the defined object ceases to exist, Insurance pays chocolates. 5. No philosophical terms allowed during activity. 6. The Tribunal must reach unanimity on the definition before the Incident. 7. The Form is a contract signed before the Incident; no redefinitions allowed afterward.

  **Timeline**
  0-10: Setup. Assign roles. Display the shaped clay.
  10-30: Registration. Tribunal debates and selects one Form definition. Registrar rejects ambiguous or dual-check forms.
  30-45: The Incident. Conservator publicly squashes the figure into a lump while Tribunal watches.
  45-60: Adjudication. Insurer processes claim based strictly on the Form definition. Tribunal votes to uphold or overturn the Insurer's ruling.
  60-75: Debrief.

  **Debrief**
  Start with the contradiction: "Before squashing, the lump and the statue occupied the same space. Were they one thing or two?" If one, they share all properties. But the statue cannot survive squashing; the lump can. Therefore, they have different properties. Therefore, they are not identical.
  This is the vertigo: same stuff, same place, different beings.
  Map "Shape-Essential" to the Statue's persistence conditions (modal properties). Map "Matter-Essential" to the Clay's.
  Highlight modal properties: The clay *could* have been a brick; the statue *could not*. This modal difference proves non-identity despite spatial overlap.
  Explain Constitution: The clay *constitutes* the statue but isn't *identical* to it. This resolves the spatial coincidence without violating Leibniz's Law.
  Connect to chemistry: Cross-linked networks (shape) vs. bulk polymer mass (matter). The form forced them to choose which property was essential to the "Object," mirroring the metaphysical choice between sortals.

  **Failure Modes**
  1. "It's just semantics." Response: Enforce the chocolate payout. Definitions have material costs.
  2. "We'll pick both." Response: Registrar rejects forms with multiple checks.
  3. "The object changed identity." Response: Ask *when*. At the exact moment of pressure? This highlights the vagueness problem.
  4. "It's just clay." Response: Remind them the Form asked what the *Object* was, not the material. If it was just clay, why did we sculpt it?
  5. Participants may try to redefine the object mid-stream. Block this: The Form is a contract signed before the Incident.

  **What the Activity Can't Reproduce**
  The Grounding Problem: Why does *this* clay constitute *this* statue? The activity shows they are distinct, not why constitution holds.
  Temporal Parts: It treats objects as wholly present, not 4D worms.
  Formal Metaphysics: It intuition-pumps, doesn't prove. You must supply the logical formalism (Leibniz's Law) in the talk.
  Coincidence vs. Constitution: The activity creates the puzzle of coincidence; you must explain constitution as the solution.
