prompt: |-
  I am a doctoral candidate in formal epistemology, and I have been trying to get a precise grip on a conceptual difficulty in the theory of Jeffrey conditionalization that I keep encountering and that the textbook presentations seem to slide past. I would like you to explain it to me from the ground up, with attention to the details rather than the standard summary.

  The difficulty is this. Jeffrey's rule is standardly introduced as the generalization of strict conditionalization that licenses updating on evidence that is merely uncertain: where conditionalization demands that the agent become certain of some proposition, probability kinematics demands only that the agent's credences in the cells of some partition move to new values, with the conditional probabilities of everything else given those cells held rigid. The posterior is then delivered by mixing. What I cannot see is how the rule itself fixes the partition to which it is applied. The posterior is defined relative to a partition and a vector of new cell-probabilities, and the prescription is to keep the within-cell conditional probabilities fixed; but any coarsening or refinement of a given partition is also a partition, and holding the cells of a finer partition rigid imposes strictly more constraints than holding the cells of a coarser one rigid. It looks, then, as though one and the same evidential situation — one and the same shift in the agent's credences over the propositions she cares about — can be fed into the rule under different partitions and emerge with different posteriors. If that is right, the rule is either incomplete, in that it needs the partition supplied from outside, or it is not well-defined.

  Please explain:

  (1) exactly where the partition enters the rule, and why rigidity with respect to a finer partition is a genuinely stronger constraint than rigidity with respect to a coarser one — ideally by constructing a small, concrete example in which a coarse and a refined partition encode the same evidentially relevant shift in the probability of some proposition, yet yield different posteriors for a hypothesis of interest;

  (2) whether the standard rejoinder — that the partition is simply the set of alternative possible outcomes of the evidence-gathering episode, so that the evidence itself determines the partition — is a substantive answer or a restatement of the problem, and what would have to be true of an agent's epistemic situation for the partition to be genuinely forced rather than chosen;

  (3) how the difficulty bears on the usual claim that Jeffrey conditionalization improves on strict conditionalization precisely because it accommodates uncertain evidence, given that strict conditionalization at least has no partition to select;

  (4) whether the trouble is best described as a defect of the rule, as an incompleteness in the way the rule is usually stated, or as an artifact of asking the rule to do something it was never meant to do — namely, to tell the agent what her evidence is, as opposed to how to respond once her evidence has been characterized.

  I am especially interested in the last point, because I suspect that much of the disagreement here turns on an ambiguity about whether the new cell-probabilities belong to the input of the update or to its output. I would like you to separate those two readings and say which one, if either, renders the rule well-defined, and to flag any place where a single term is being used in two different ways across the discussion. Please give me the argument rather than a reading list; I am not looking for citations.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Doctoral candidate in formal epistemology. This means I need to speak at a high technical level, avoid oversimplification, and engage with the formal structure of the problem directly. They want an *argument*, not a reading list.
      *   **Topic:** The "Partition Problem" in Jeffrey Conditionalization (JC).
      *   **Core Difficulty:** JC requires a partition $\mathcal{E} = \{E_i\}$ and new probabilities $P_{new}(E_i)$. But the choice of partition affects the posterior $P_{new}(H)$ because the rigidity constraint ($P_{new}(H|E_i) = P_{old}(H|E_i)$) applies differently to different partitions. A finer partition imposes more constraints.
      *   **Specific Tasks:**
          1.  Explain where the partition enters and demonstrate the divergence with a concrete example (coarse vs. fine).
          2.  Evaluate the standard rejoinder (evidence determines partition) – is it substantive or circular? What would make the partition "forced"?
          3.  Compare with Strict Conditionalization (SC) regarding the "uncertain evidence" advantage.
          4.  Diagnose the trouble: Defect, incompleteness, or category error (evidence characterization vs. update rule)? Specifically address the input/output ambiguity of cell probabilities.

  2.  **Deconstruct the Problem (Mental Sandbox):**
      *   *Jeffrey's Rule:* $P_{new}(H) = \sum P_{old}(H|E_i) P_{new}(E_i)$.
      *   *Rigidity:* $P_{new}(\cdot | E_i) = P_{old}(\cdot | E_i)$.
      *   *The Issue:* Suppose I have a partition $\{E, \neg E\}$. I shift $P(E)$ from 0.5 to 0.8.
      *   Now suppose I have a finer partition $\{E_1, E_2, \neg E\}$ where $E = E_1 \cup E_2$.
      *   To apply JC on the fine partition, I need $P_{new}(E_1)$ and $P_{new}(E_2)$.
      *   If I just know $P_{new}(E) = 0.8$, that doesn't fix $P_{new}(E_1)$ and $P_{new}(E_2)$.
      *   Even if I fix $P_{new}(E_1)$ and $P_{new}(E_2)$ such that they sum to 0.8, does the posterior for some $H$ change?
      *   Yes, because $P_{old}(H|E_1)$ might differ from $P_{old}(H|E_2)$.
      *   So, $P_{new}(H) = P_{old}(H|E_1)P_{new}(E_1) + P_{old}(H|E_2)P_{new}(E_2) + \dots$
      *   Versus coarse: $P_{new}(H) = P_{old}(H|E)P_{new}(E) + \dots$
      *   Since $P_{old}(H|E)$ is a weighted average of $P_{old}(H|E_1)$ and $P_{old}(H|E_2)$, the results will only match if the weights ($P_{new}$) align perfectly with the old weights or if the conditional probabilities are identical.
      *   *Conclusion:* The rule is underdetermined without the partition.

  3.  **Drafting Section (1): The Formal Divergence:**
      *   Need a concrete numerical example.
      *   Let $H$ be a hypothesis. Let evidence be about a card draw.
      *   Coarse: Red vs. Black.
      *   Fine: Hearts, Diamonds, Black.
      *   Old probs: Uniform (1/4 each suit).
      *   Shift: I become 50% sure it's Red (was 50%). Wait, need a shift.
      *   Let's say Old: $P(Red)=0.5$. New: $P(Red)=0.8$.
      *   Coarse Partition $\mathcal{E}_1 = \{R, B\}$. $P_{new}(R)=0.8, P_{new}(B)=0.2$.
      *   Fine Partition $\mathcal{E}_2 = \{H, D, B\}$. $R = H \cup D$.
      *   To match the coarse input, we need $P_{new}(H) + P_{new}(D) = 0.8$.
      *   Case A (Proportional): $P_{new}(H)=0.4, P_{new}(D)=0.4$.
      *   Case B (Skewed): $P_{new}(H)=0.7, P_{new}(D)=0.1$.
      *   Let $H$ypothesis be "Face Card".
      *   Calculate $P_{new}(Face)$ under Coarse vs. Fine (Case B).
      *   Show they differ.
      *   *Key Point:* Rigidity on $\{H, D, B\}$ implies $P_{new}(Face|H) = P_{old}(Face|H)$. Rigidity on $\{R, B\}$ implies $P_{new}(Face|R) = P_{old}(Face|R)$. These are incompatible constraints unless the distribution within $R$ doesn't change.

  4.  **Drafting Section (2): The Standard Rejoinder:**
      *   "The partition is the evidence."
      *   Is this substantive? It pushes the problem back to "What is the evidence?"
      *   In SC, evidence is $E$ (proposition becomes certain). In JC, evidence is the *experience* that shifts probabilities.
      *   The problem is that experiences don't come labeled with a Boolean algebra.
      *   For the partition to be "forced," the agent's cognitive state must structurally mirror the partition. E.g., a sensory signal that *only* distinguishes Red/Black, not suits.
      *   If the agent *can* distinguish suits, but chooses to ignore it, that's a choice, not a force.
      *   So the rejoinder is often a restatement unless coupled with a theory of "direct experience" (like Jeffrey's "looks red" vs. "is red").

  5.  **Drafting Section (3): Comparison with Strict Conditionalization:**
      *   SC: $P_{new}(E)=1$. Partition is technically $\{E, \neg E\}$, but since $P(\neg E)=0$, the fine structure of $\neg E$ doesn't matter for expectation calculations (usually).
      *   Actually, SC is a limit case of JC.
      *   Why is JC said to be better? Because $P(E)=1$ is unrealistic.
      *   But JC trades the "certainty problem" for the "partition problem."
      *   SC hides the partition problem because the rigidity condition on $\neg E$ becomes irrelevant (multiplied by 0).
      *   So JC exposes a structural ambiguity that SC masks by zeroing out the alternative.

  6.  **Drafting Section (4): Diagnosis (Defect vs. Incompleteness vs. Category Error):**
      *   This is the crux.
      *   Is it a defect? No, the math works given inputs.
      *   Is it incompleteness? Yes, as a *normative guide* for updating, it lacks an input specification.
      *   Is it a category error? This is the strongest philosophical point. JC is a *constraint* on rational change, not a *generator* of posteriors from raw qualia.
      *   *Input/Output Ambiguity:*
          *   Reading 1 (Algorithmic): Input = Raw Experience. Output = $P_{new}(E_i)$ and Partition. (JC fails here).
          *   Reading 2 (Constraint): Input = $P_{old}$, Partition, and $P_{new}(E_i)$. Output = $P_{new}(H)$. (JC works here).
      *   The confusion arises when proponents claim JC explains how we update from experience. It doesn't. It explains how we update *given* a probabilistic characterization of experience.
      *   The "new cell probabilities" are part of the *input* to the rule, not the output. But they are often described as the *result* of the evidence.
      *   If they are the result, we need a rule mapping Experience $\to$ $(\mathcal{E}, P_{new})$. JC is not that rule.

  7.  **Refining and Polishing:**
      *   *Tone:* Academic, precise, respectful of the user's expertise.
      *   *Notation:* Use standard probability notation.
      *   *Check:* Did I answer all four prompts? Yes.
      *   *Check:* Did I address the input/output ambiguity specifically? Yes, in section 4.
      *   *Self-Correction on Example:* Make sure the numbers are clean.
          *   Let $\Omega = \{h, d, c, s\}$ (hearts, diamonds, clubs, spades).
          *   $P_{old}$ uniform (0.25 each).
          *   $H$ypothesis: "Red" (Wait, if H is Red, and partition is Red/Black, H is a cell. Bad example).
          *   Let $H$ypothesis: "Ace". (One Ace per suit). $P(Ace|suit) = 1$ (if we define atoms as Ace-King? No, keep it simple).
          *   Let atoms be specific cards. $H$ = "The card is a Face Card".
          *   Assume 1 card drawn from {Ah, Ad, Ac, As, Kh, ...}. Too complex.
          *   Simplify: $\Omega = \{w_1, w_2, w_3\}$.
          *   $E = \{w_1, w_2\}$. $\neg E = \{w_3\}$.
          *   Fine: $E_1 = \{w_1\}, E_2 = \{w_2\}, E_3 = \{w_3\}$.
          *   $H = \{w_1, w_3\}$.
          *   $P_{old}(w_i) = 1/3$.
          *   Coarse Shift: $P_{new}(E) = 0.6$. (So $P_{new}(w_3) = 0.4$).
          *   Coarse JC: $P_{new}(H) = P_{old}(H|E)P_{new}(E) + P_{old}(H|\neg E)P_{new}(\neg E)$.
          *   $P_{old}(H|E) = P(\{w_1\}| \{w_1, w_2\}) = 0.5$.
          *   $P_{old}(H|\neg E) = 1$.
          *   $P_{new}(H)_{coarse} = 0.5(0.6) + 1(0.4) = 0.7$.
          *   Fine Shift: Must match $P_{new}(E)=0.6$. So $P_{new}(w_1) + P_{new}(w_2) = 0.6$.
          *   Scenario A (Proportional): $P_{new}(w_1)=0.3, P_{new}(w_2)=0.3$.
              *   $P_{new}(H)_{fine} = 1(0.3) + 0(0.3) + 1(0.4) = 0.7$. (Matches).
          *   Scenario B (Skewed): $P_{new}(w_1)=0.5, P_{new}(w_2)=0.1$.
              *   $P_{new}(H)_{fine} = 1(0.5) + 0(0.1) + 1(0.4) = 0.9$. (Diverges!).
          *   This shows that specifying $P_{new}(E)$ is not enough for the fine partition; you need the distribution *within* $E$. But if you apply JC on the coarse partition, you *assume* the distribution within $E$ stays proportional (implicitly). If you apply it on the fine, you must specify it. If you specify it differently, you get different results.
          *   Wait, the rigidity condition is the key.
          *   Coarse Rigidity: $P_{new}(w_1 | E) = P_{old}(w_1 | E) = 0.5$. This *forces* $P_{new}(w_1) = 0.5 * 0.6 = 0.3$.
          *   Fine Rigidity: $P_{new}(w_1 | w_1) = 1$. This imposes no constraint on $P_{new}(w_1)$ other than it sums to 0.6 with $w_2$.
          *   So the Coarse application *forces* proportional shifting. The Fine application *allows* non-proportional shifting.
          *   If the agent's evidence only supports the shift in $E$, but not the internal shift, applying the Fine rule requires input the agent doesn't have (or implies a constraint they shouldn't accept). Applying the Coarse rule imposes a constraint (proportionality) that might not be warranted.
          *   This is the "underdetermination" vs "overconstraint" tension.

  8.  **Final Review of the Argument:**
      *   Ensure the distinction between the *rule* (mathematical mapping) and the *principle* (normative claim) is clear.
      *   Ensure the "Input/Output" ambiguity is highlighted as the source of the confusion in the literature.
      *   Make sure to explicitly state that SC is a special case where the partition problem vanishes because the weight of the alternative partition cells is zero.

  9.  **Constructing the Response:** (Proceed to generate output based on these thoughts).
answer: |-
  This is a well-known but often under-analyzed structural issue in formal epistemology, sometimes referred to as the "Partition Problem" or the problem of "Input Underdetermination." You are correct that textbook presentations often gloss over the fact that Jeffrey Conditionalization (JC) is a function of *three* arguments ($P_{old}$, $\mathcal{E}$, $P_{new}^\mathcal{E}$), not two, and that the choice of $\mathcal{E}$ is normatively consequential.

  Here is the analysis you requested, structured according to your four points.

  ### 1. The Formal Role of the Partition and the Divergence Proof

  Jeffrey's rule is defined as follows. Let $P_{old}$ be the prior. Let $\mathcal{E} = \{E_1, \dots, E_n\}$ be a partition of the possibility space. Let $P_{new}(E_i)$ be the new probabilities assigned to the cells. The posterior $P_{new}(H)$ for any hypothesis $H$ is:

  $$ P_{new}(H) = \sum_{i} P_{old}(H | E_i) P_{new}(E_i) $$

  The critical constraint is **Rigidity** (or Probability Kinematics): for all $i$ such that $P_{new}(E_i) > 0$, $P_{new}(\cdot | E_i) = P_{old}(\cdot | E_i)$.

  The partition enters the rule in the conditioning term of the rigidity constraint. Rigidity is not a constraint on $P_{new}(H)$ directly; it is a constraint on the *conditional* probabilities relative to the cells of $\mathcal{E}$. Because conditional probability is sensitive to the granularity of the condition, changing $\mathcal{E}$ changes the constraints.

  **The Divergence Example**
  Let the possibility space $\Omega = \{w_1, w_2, w_3\}$.
  Let the hypothesis of interest be $H = \{w_1, w_3\}$.
  Let the prior $P_{old}$ be uniform: $P_{old}(w_i) = 1/3$ for all $i$.

  Consider two partitions:
  1.  **Coarse ($\mathcal{E}_C$):** $\{E, \neg E\}$ where $E = \{w_1, w_2\}$ and $\neg E = \{w_3\}$.
  2.  **Fine ($\mathcal{E}_F$):** $\{w_1, w_2, w_3\}$.

  Suppose the agent undergoes an experience that shifts her credence in $E$ from $2/3$ to $0.6$. Thus, $P_{new}(E) = 0.6$ and $P_{new}(\neg E) = 0.4$.

  **Application of JC on $\mathcal{E}_C$:**
  The rule requires rigidity on $E$.
  $P_{old}(w_1 | E) = \frac{1/3}{2/3} = 0.5$.
  By rigidity, $P_{new}(w_1 | E) = 0.5$.
  Therefore, $P_{new}(w_1) = P_{new}(w_1 | E) P_{new}(E) = 0.5 \times 0.6 = 0.3$.
  Similarly, $P_{new}(w_2) = 0.3$.
  Posterior for $H$:
  $P_{new}(H) = P_{new}(w_1) + P_{new}(w_3) = 0.3 + 0.4 = \mathbf{0.7}$.

  **Application of JC on $\mathcal{E}_F$:**
  The rule requires rigidity on $\{w_1\}, \{w_2\}, \{w_3\}$.
  Rigidity on singletons is trivial ($P(w_1|w_1)=1$) and imposes no constraint on the *marginal* $P_{new}(w_1)$ other than that it must be non-negative.
  To apply the rule, we must supply a vector $(P_{new}(w_1), P_{new}(w_2), P_{new}(w_3))$.
  To make the evidential situation "the same" as above, we must respect the shift in $E$. So, $P_{new}(w_1) + P_{new}(w_2) = 0.6$ and $P_{new}(w_3) = 0.4$.
  However, the fine partition does *not* force the distribution within $E$ to remain proportional.
  Suppose the agent's experience specifically favors $w_1$ over $w_2$. Let $P_{new}(w_1) = 0.5$ and $P_{new}(w_2) = 0.1$.
  This is consistent with the input $P_{new}(E)=0.6$.
  Posterior for $H$:
  $P_{new}(H) = P_{new}(w_1) + P_{new}(w_3) = 0.5 + 0.4 = \mathbf{0.9}$.

  **Result:** $0.7 \neq 0.9$.
  The same shift in the probability of the proposition $E$ yields different posteriors for $H$ depending on whether the update is modeled as operating on $\{E, \neg E\}$ or $\{w_1, w_2, w_3\}$. The coarse partition *implicitly* imposes a constraint of **proportionality** within $E$ (that $w_1$ and $w_2$ scale equally). The fine partition leaves the internal distribution of $E$ as a free parameter. If you apply the coarse rule, you assume the evidence did not distinguish $w_1$ from $w_2$. If you apply the fine rule, you must specify how it did.

  ### 2. The Standard Rejoinder: "Evidence Determines the Partition"

  The standard defense is that the partition $\mathcal{E}$ is not chosen by the agent but is fixed by the **structure of the experience**. If the experience is a visual seeming that a cloth is green, the partition is $\{Green, \neg Green\}$. If the experience is more detailed, the partition is finer.

  **Is this substantive?**
  It is largely a restatement of the problem unless accompanied by a robust theory of "direct experience." The problem is that experiences (qualia, sensory signals) do not come pre-packaged with Boolean algebraic structures.
  *   **The Circularity:** To say "the evidence determines the partition" is to say "the correct characterization of the evidence determines the correct characterization of the evidence."
  *   **The Epistemic Gap:** An agent might have a sensory experience that *could* be characterized as "Red" or as "Scarlet." If she characterizes it as "Red," she uses the coarse partition. If "Scarlet," the fine. The rule itself cannot tell her which characterization is epistemically mandated.

  **What would make the partition "forced"?**
  For the partition to be genuinely forced rather than chosen, one of two conditions must hold:
  1.  **Cognitive Limitation:** The agent is cognitively incapable of distinguishing the cells of the finer partition at the time of update. (e.g., she literally cannot see the difference between Scarlet and Crimson). In this case, the fine partition is not available in her algebra, so the coarse one is the finest available.
  2.  **Causal Isolation:** The causal mechanism producing the belief shift is sensitive *only* to the coarse property. If the neural state causing the shift is triggered by "Redness" detectors but not "Scarlet" detectors, then the shift in probability is structurally tied to the coarse partition.

  However, in standard philosophical examples, agents are logically omniscient or possess rich algebras. In those cases, the partition is a **modeling choice** made by the theorist (or the agent reflecting on her own psychology), not a feature forced by the world. The rejoinder fails because it conflates the *content* of the evidence (the proposition) with the *mode* of the evidence (the partition relative to which the probability shift occurs).

  ### 3. Comparison with Strict Conditionalization (SC)

  You ask how this bears on the claim that JC improves on SC by accommodating uncertain evidence.

  **Strict Conditionalization:** $P_{new}(E) = 1$.
  Technically, SC is a limit case of JC where the partition is $\{E, \neg E\}$ and $P_{new}(E)=1$.
  Why does the partition problem seem to vanish in SC?
  Because if $P_{new}(E) = 1$, then $P_{new}(\neg E) = 0$.
  In the JC formula: $P_{new}(H) = P_{old}(H|E) \cdot 1 + P_{old}(H|\neg E) \cdot 0$.
  The term involving the alternative cell $\neg E$ is zeroed out. Therefore, the internal structure of $\neg E$ (whether it is treated as one cell or a million) becomes mathematically irrelevant to the posterior of $H$ (provided $H$ is compatible with $E$).

  **The Trade-off:**
  *   **SC** hides the partition problem by making the alternative partition cells probabilistically inert. It demands certainty, which renders the rigidity constraint on the alternative vacuous.
  *   **JC** exposes the partition problem precisely because it assigns non-zero weight to the alternative cells. When $P_{new}(\neg E) > 0$, the rigidity constraint on $\neg E$ matters. If you partition $\neg E$ finely, you impose constraints on how probability mass is distributed within $\neg E$, which affects the posterior of hypotheses overlapping with $\neg E$.

  **Conclusion on the "Improvement" Claim:**
  JC improves on SC regarding the *idealization of certainty*, but it regresses on the *determinacy of the update*. SC is determinate given $E$ (assuming $P_{old}(E)>0$). JC is indeterminate given a shift in $P(E)$ unless the partition is specified. Thus, JC solves the problem of "fallibilism" at the cost of introducing "partition sensitivity." It is not a strict generalization in terms of normative guidance; it is a generalization in terms of *applicability conditions*, but with looser constraints on the output.

  ### 4. Diagnosis: Defect, Incompleteness, or Category Error?

  This is the crux of your inquiry. The trouble is best described as a **category error regarding the inputs of the rule**, which manifests as an incompleteness in normative guidance.

  **The Input/Output Ambiguity**
  There are two distinct readings of what the "new cell probabilities" ($P_{new}(E_i)$) represent in the discourse surrounding JC.

  *   **Reading A (The Algorithmic Reading):**
      *   **Input:** Raw Experience ($Exp$).
      *   **Black Box:** Jeffrey's Rule.
      *   **Output:** $P_{new}$.
      *   *Claim:* JC tells you how to update from experience.
      *   *Problem:* This reading is false. JC does not take $Exp$ as an argument. It takes probabilities as arguments. There is a missing function $f: Exp \to (\mathcal{E}, P_{new}^\mathcal{E})$. Without this function, the rule cannot be applied to the world.

  *   **Reading B (The Constraint Reading):**
      *   **Input:** $P_{old}$, Partition $\mathcal{E}$, and New Cell Probabilities $P_{new}^\mathcal{E}$.
      *   **Black Box:** Jeffrey's Rule.
      *   **Output:** Full Posterior Distribution $P_{new}$.
      *   *Claim:* JC is a consistency constraint on rational belief change. If you *have* decided to change your beliefs in $\mathcal{E}$ to these values, you *must* change the rest of your beliefs this way to minimize information gain (via the rigidity condition).
      *   *Status:* This reading is mathematically well-defined.

  **The Source of the Confusion**
  Proponents of JC often slide between Reading A and Reading B.
  When defending JC against the "certainty" objection to SC, they use **Reading A**: "Unlike SC, JC allows us to update on uncertain evidence!" (Implying the rule handles the evidence).
  When defending JC against the "partition" objection, they retreat to **Reading B**: "The rule doesn't tell you what the evidence is; it tells you how to propagate the change once the evidence is probabilistically characterized."

  **Verdict**
  The trouble is not a mathematical defect in the rule (Reading B is consistent). The trouble is an **incompleteness in the normative theory** if it is presented as a full account of learning (Reading A).

  If we accept Reading B, we must admit that JC is not a theory of *evidence*, but a theory of *inference from characterized evidence*. The "new cell probabilities" are **inputs** to the update rule, not outputs of the evidence-relation.
  *   If they are inputs, the agent must already possess them.
  *   If the agent possesses them, she has already performed a prior cognitive act of translating her experience into probabilities over a specific algebra.
  *   JC offers no norm for *that* translation act.

  **Conclusion**
  The partition problem reveals that Jeffrey Conditionalization is not a standalone norm for belief revision in the face of experience. It is a **conditional norm**: *If* your experience warrants a shift to $P_{new}$ over partition $\mathcal{E}$, *then* your posterior must be the Jeffrey mixture.
  The "difficulty" you encounter arises because the literature often implies the antecedent ("your experience warrants...") is unproblematic or determined by the experience itself. It is not. The choice of partition is a choice of how to *model* the impact of the experience.
  Therefore, the rule is well-defined only under Reading B (Constraint), but under that reading, it loses its primary selling point over SC (that it solves the problem of how to update from uncertain experience). It pushes the problem of uncertain experience back one step: from "How do I update?" to "How do I translate experience into a partition and a probability vector?"

  To resolve the difficulty, one must explicitly separate the **Probability Kinematics** (the JC rule itself) from the **Probability Dynamics** (the theory of how experiences map to inputs for the kinematics). The partition problem belongs to Dynamics, but it is often mistakenly treated as a puzzle within Kinematics.
