prompt: |-
  Ok so I've been going down a rabbit hole on consent for something I'm writing and there's a pattern I can't stop noticing, and I want to know what it adds up to.

  In a hospital you sign a form before anything happens. Someone has to walk you through the risks, and if they don't, your signature basically doesn't count for much. But you can be in agony, you can have no good option, you can be told it's this or you die — and none of that stops it from being valid consent. Nobody treats the fact that you had no acceptable alternative as a problem.

  Then in a police stop: "mind if I take a look in your car?" and in alot of places the officer isn't obliged to mention that you're allowed to say no. Courts look at the "totality of the circumstances" and usually call it voluntary.

  Then sex. Lying about some things voids consent, lying about others doesn't, and the line people draw is usually whether the lie went to the nature of the act itself. Lie about being sterile, lie about loving someone, lie about what happens to the condom — a lot of jurisdictions shrug. Lie about what act you're doing and it's a serious crime.

  Then contracts: a deliberate material lie gets you out of the whole deal.

  So: what theory of consent does this patchwork actually presuppose? I don't want a survey of the literature, I want the implicit theory dug out. Specifically: does the practice commit to a moralized view of coercion — a threat only counts as coercing you if it was wrong for them to make it — as opposed to a plain "you had no acceptable alternative" view? Does it treat consent as an attitude in someone's head or as an act that authorizes and waives? Is voluntariness a threshhold you either cross or don't, or a matter of degree? And which parts of the pattern are strictly forced by those commitments and which are just things that happen to be compatible with them?

  Then tell me where the practice is underdetermined — several theories license the same behaviour — and what would have to change in each of those four settings if we swapped in a reasonable-alternatives account of voluntariness instead.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Request:**
      *   **Core Task:** Identify the implicit theory of consent underlying a specific pattern of legal/social practices across four domains (Medical, Police/Search, Sexual, Contractual).
      *   **Specific Questions to Answer:**
          *   Does it commit to a *moralized view of coercion* (wrongful threat) vs. a *no acceptable alternative* view?
          *   Is consent an *attitude* (mental state) or an *act* (authorization/waiver)?
          *   Is voluntariness a *threshold* or a *matter of degree*?
          *   Which parts of the pattern are *forced* by these commitments vs. *compatible*?
          *   Where is the practice *underdetermined* (multiple theories fit)?
          *   What would change if we swapped to a *reasonable-alternatives account* in each setting?
      *   **Constraints:** No literature survey. Dig out the *implicit* theory. Be precise about the theoretical commitments.

  2.  **Analyze the Four Domains (The "Pattern"):**
      *   *Medical:* Signature + Disclosure = Valid. Duress (pain, death threat by nature) doesn't invalidate. Focus on procedure and authority.
      *   *Police:* "Totality of circumstances." Silence about rights often okay. Power imbalance acknowledged but often overridden by "voluntariness" defined narrowly.
      *   *Sex:* Fraud in the *inducement* (sterility, love) $\neq$ rape. Fraud in the *factum* (nature of act) = rape. Focus on the physical act, not the context/reasons.
      *   *Contract:* Material misrepresentation = voidable. Focus on the bargain and information symmetry regarding the terms.

  3.  **Synthesize the Implicit Theory:**
      *   *Coercion:* The medical example is the smoking gun. "Do this or die (from the disease)" is not coercion. "Do this or I shoot you" is. This implies a **Moralized View of Coercion**. The baseline is the *status quo ante* or *natural baseline*, not a "reasonable alternatives" baseline. If the threatener has a right to propose the option (or if the option is natural), it's not coercive.
      *   *Nature of Consent:* It looks performative. In medicine, the signature matters more than the internal relief. In sex, the "yes" (or lack of "no") matters more than internal reservation, unless the *definition* of the act is tricked. In contracts, the signature binds unless fraud undermines the *terms*. This points to **Consent as a Performative Act of Authorization/Waiver**, not merely a mental state.
      *   *Voluntariness:* It acts as a **Threshold**. You are either competent and informed enough (medical), or you aren't. You either understood the nature of the act (sex), or you didn't. It's binary for legal enforceability, even if psychological pressure varies.
      *   *Information:* There's a distinction between *Nature of the Act* vs. *Consequences/Context*. Medical (risks must be disclosed), Sex (nature must be true, consequences/attributes can be lied about), Contract (material terms must be true), Police (rights don't always need disclosure). This is the messiest part, suggesting a **Transaction-Specific Epistemic Duty**.

  4.  **Drafting the Theory (The "What it adds up to"):**
      *   Name it: **The Transactional Authorization Model.**
      *   Core tenet: Consent is a mechanism to transfer normative power (permission to touch, search, bind) based on a specific, bounded understanding of the transaction.
      *   Coercion: Moralized. Threats are only coercive if they worsen your position relative to a *moral baseline*, not relative to your *best possible outcome*.
      *   Voluntariness: Threshold-based.

  5.  **Addressing the Specific Questions:**
      *   *Moralized vs. No Alternative:* Definitely Moralized. (Medical example proves this).
      *   *Attitude vs. Act:* Primarily Act (Performative). Internal reluctance doesn't stop validity if the act is performed correctly.
      *   *Threshold vs. Degree:* Threshold. (Binary validity).
      *   *Forced vs. Compatible:* The moralized coercion is *forced* by the medical/policing examples. The performative nature is *forced* by contract/sex fraud distinctions.

  6.  **Identifying Underdetermination:**
      *   Where do multiple theories fit?
      *   *Police Stops:* Could be "Act" theory OR "Power Deference" theory.
      *   *Sex:* Could be "Nature of Act" OR "Autonomy Violation" (but limited).
      *   *Medical:* Could be "Paternalistic Protection" OR "Liability Shield."
      *   *The biggest underdetermination:* The *scope of disclosure*. Why does medicine require risk disclosure but sex doesn't require STERILITY disclosure? Both affect the "outcome." The implicit theory doesn't fully explain *which* facts matter, only that *some* distinction exists.

  7.  **The "Reasonable Alternatives" Swap (Counterfactual Analysis):**
      *   *Concept:* If consent requires a "reasonable acceptable alternative" (RAA) to be valid.
      *   *Medical:* Surgery "or die" becomes invalid consent. Emergency care becomes legally fraught. Malpractice explodes.
      *   *Police:* "Do you mind?" becomes coercive because saying "No" carries high risk (arrest, escalation). Consent to search evaporates.
      *   *Sex:* "Condom theft" (stealthing) is already trending this way. But lying about status/wealth/love might become coercion if the alternative (no sex) is deemed "unreasonable" due to power dynamics? Actually, RAA focuses on the *choice architecture*. If the only option is "sex with lies" or "no sex," is "no sex" reasonable? Yes. So RAA might not change sex law as much as *Power Imbalance* theory. Wait, I need to stick to RAA. If I have no reasonable alternative but to agree, it's coerced.
      *   *Contract:* Duress doctrine already touches this, but RAA would void "take it or leave it" contracts where the need is urgent (employment, housing).

  8.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction on Sex:* The user noted lying about condoms/sterility often *doesn't* void consent in many jurisdictions. A strict RAA view might not change this unless the lie removed the alternative. Actually, the "Nature of the Act" distinction is the key. RAA would challenge the *circumstances*, not just the act.
      *   *Correction on Police:* The "totality of circumstances" is already a bit fuzzy. RAA would make almost all consensual searches invalid because a reasonable person feels they can't say no to a cop.
      *   *Correction on Medical:* This is the strongest evidence for Moralized Coercion. Disease isn't a moral agent. So the "threat" isn't coercive.

  9.  **Structuring the Response:**
      *   **Introduction:** Name the theory (The Moralized Performative Threshold).
      *   **Core Commitments:** Answer the three specific theoretical questions (Coercion, Act/Attitude, Threshold).
      *   **Forced vs. Compatible:** Distinguish what the theory *needs* vs. what it *allows*.
      *   **Underdetermination:** Point out the gaps (specifically the "Which Facts Matter" problem).
      *   **The Swap (Reasonable Alternatives):** Go through the four domains and show the disruption.

  10. **Final Polish:** Ensure tone is analytical, philosophical, and direct. Avoid hedging. Use the user's terminology ("moralized view," "reasonable-alternatives").

  *(Self-Correction during drafting)*: I need to be careful with the "Sex" category. The user says lying about condoms often gets a shrug. This is changing (some jurisdictions now criminalize stealthing), but I must stick to the pattern the user observed. The pattern is: Fraud in Factum (Act) = Invalid; Fraud in Inducement (Context) = Valid. How does this fit the theory? It fits the "Authorization of Specific Act" model. I authorize *penetration*, not *pregnancy risk*.

  *(Refining the "Underdetermined" section)*: The biggest gap is *why* the epistemic requirements differ. Why must a doctor disclose risks but a lover doesn't have to disclose sterility? The implicit theory doesn't explain the *content* of the disclosure, only the *consequence* of getting it wrong. I should highlight this.

  *(Refining the "Swap" section)*: Make sure the consequences are drastic. If medical consent requires a reasonable alternative, elective surgery is fine, but life-saving surgery becomes legally impossible without a guardian or court order.

  11. **Final Review against constraints:** No lit survey? Check. Implicit theory dug out? Check. Specific questions answered? Check. Underdetermination identified? Check. Swap analyzed? Check.

