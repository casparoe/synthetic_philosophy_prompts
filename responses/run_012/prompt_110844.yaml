answer: |-
  The pattern you've identified points to a specific, coherent, and somewhat cynical implicit theory. It is not a theory of *autonomy* in the philosophical sense (self-governance), but a theory of **Normative Power Transfer**.

  Here is the implicit theory dug out of the practice, followed by the analysis of its commitments, underdeterminations, and the counterfactual swap you requested.

  ### The Implicit Theory: The Moralized Performative Threshold

  The legal and social practices you describe presuppose that consent is a **performative speech act** that transfers a specific normative power (the right to touch, search, bind, or penetrate) from one party to another. For this transfer to stick, three conditions must be met, but they are defined narrowly:

  1.  **Moralized Coercion:** Voluntariness is not about your internal psychological freedom or the availability of good options. It is about the *moral propriety of the proposal*. A threat is only coercive if the proposer has no right to make it.
  2.  **Act Over Attitude:** Consent is externalized. It is what you *do* (sign, say yes, nod), not what you *feel* (reluctance, fear, resignation). Internal reservation does not invalidate external authorization.
  3.  **Threshold Validity:** Voluntariness is binary. You either crossed the threshold of competence and lack of wrongful threat, or you didn't. There is no legal category for "70% voluntary."

  ### Answering Your Specific Theoretical Questions

  **1. Does it commit to a moralized view of coercion?**
  **Yes, absolutely.** This is the strongest pillar of the pattern.
  *   *Evidence:* The hospital example. If consent required a "reasonable alternative," agreeing to surgery because the alternative is death would be coerced (no acceptable alternative). The law treats this as valid because the "threat" (death by disease) is natural, not moral. The doctor is not *creating* the dilemma; they are offering the only exit from a natural dilemma.
  *   *Evidence:* Police stops. The officer implies "if you don't let me search, I'll keep you here longer/find a reason to arrest you." Courts often rule this voluntary because the officer is *allowed* to investigate. The pressure is a byproduct of their authority, not an abuse of it.
  *   *Commitment:* Coercion invalidates consent only when the pressure applied is **wrongful**. Pressure that is merely **hard** (pain, death, authority) does not.

  **2. Is consent an attitude or an act?**
  **It treats consent as an Act (Authorization/Waiver).**
  *   *Evidence:* Contracts and Medical Forms. If consent were an attitude, a signature given while secretly resentful or misunderstood would be void. Instead, the signature *creates* the obligation.
  *   *Evidence:* Sex (Fraud in the Inducement). If you agree to sex because you were lied to about love or wealth, your *attitude* toward the sex is based on a falsehood. But the *act* authorized (penetration) occurred exactly as described. The law protects the physical boundary, not the emotional reasoning.
  *   *Commitment:* Consent is a mechanism to waive a right against interference. As long as the waiver is performed correctly regarding the *specific interference*, the internal motivation is irrelevant.

  **3. Is voluntariness a threshold or a degree?**
  **It is a Threshold.**
  *   *Evidence:* All four domains operate on a binary: Valid/Invalid, Admissible/Excluded, Rape/Not Rape.
  *   *Commitment:* The law requires bright lines for enforceability. While philosophy might see coercion as a spectrum, the legal practice demands a switch that flips from "violation" to "transaction."

  ### Forced vs. Compatible

  **What is strictly forced by these commitments:**
  *   **The Medical "Or You Die" Rule:** This is forced by the Moralized Coercion view. If the theory were "No Acceptable Alternative," emergency medicine would be legally impossible without guardianship.
  *   **The Sex "Nature of Act" Distinction:** This is forced by the Act view. If I authorize "penetration," and penetration occurs, the act is authorized. If I authorize "protected sex" and you remove the condom, some courts say the *act* changed (now it's unprotected penetration), but many say the *act* is the same, only the risk changed. The pattern you noted (that lying about condoms often gets a shrug) is forced by the view that consent attaches to the *physical motion*, not the *risk profile*.
  *   **Police "Totality of Circumstances":** This is forced by the Threshold view. They aren't weighing how scared you were (degree); they are deciding if the line was crossed (threshold).

  **What is merely compatible (and reveals a gap):**
  *   **Disclosure Requirements:** The theory *allows* for different disclosure rules but doesn't *force* them. Why must a doctor disclose risks (Medical) but a lover doesn't have to disclose sterility (Sex)? Both affect the outcome. The implicit theory doesn't explain why the "transaction" in medicine includes risk, but the "transaction" in sex excludes fertility status. This is compatible with the theory, but not derived from it.

  ### Where the Practice is Underdetermined

  The practice is underdetermined regarding **The Epistemic Baseline**.

  The theory tells us *that* information matters (fraud can void consent), but it doesn't tell us *which* information matters.
  *   **Contract:** Material lies void the deal.
  *   **Medicine:** Risk lies void the deal.
  *   **Sex:** Identity/Act lies void the deal; Status/Consequence lies often do not.
  *   **Police:** Rights lies often do not void the consent.

  **Why is this underdetermined?**
  Because both a "Moralized Performative" theory and a "Reasonable Alternatives" theory could arguably support the current patchwork if you tweak the definitions.
  *   *Current Practice:* Assumes the "transaction" is defined by the institution. In medicine, the institution defines the transaction as "procedure + risks." In sex, the common law defines it as "physical act."
  *   *Alternative Theory:* A "Subjective Autonomy" theory could also fit if courts simply decided that fertility isn't "material" to sexual autonomy.

  The gap is: **Who defines the scope of the transaction?** The current practice delegates this to social norms and institutional power (doctors define medical transactions, police define stops, men have historically defined sexual transactions). The implicit theory doesn't justify *why* those definitions hold, it just enforces them once established.

  ### The Swap: Implementing a "Reasonable Alternatives" Account

  If we swapped the implicit theory for a **Reasonable Alternatives Account (RAA)**—where consent is invalid if the person had no acceptable alternative—the four settings would collapse or transform radically.

  **1. Hospital (Medical Consent)**
  *   **Change:** "Consent or die" becomes coercion.
  *   **Consequence:** Valid consent for life-saving emergency treatment becomes nearly impossible for unconscious or desperate patients. Medicine would shift to a **Paternalistic/Guardianship Model**. Doctors would need court orders or pre-appointed guardians for almost all major interventions, because the patient's "agreement" under the threat of death is no longer valid. Emergency rooms would grind to a halt.

  **2. Police Stop (Search & Seizure)**
  *   **Change:** "Mind if I look?" becomes coercive.
  *   **Consequence:** Consensual searches would effectively vanish. A reasonable person knows that refusing a police officer carries a high risk of escalation, detention, or finding a pretext for arrest. Because the alternative (refusal) carries unacceptable social/legal risk, the "choice" is illusory. Police would be forced to require **Probable Cause or Warrants** for almost all searches, drastically increasing the burden on the state and reducing "voluntary" cooperation to near zero.

  **3. Sex (Sexual Assault Law)**
  *   **Change:** Power imbalances and deceptive contexts become coercive.
  *   **Consequence:** This is the most volatile. If "no sex" is not a reasonable alternative due to economic dependence, social pressure, or fear of violence (even if not explicitly threatened), consent is void.
      *   *Lying:* Lying about sterility or status might void consent if that information was necessary for the alternative (abstinence) to be "reasonable" for the victim.
      *   *Power:* Employer/employee, Professor/Student dynamics would become *per se* coercive, not just ethically fraught. The focus shifts from "Did they say no?" to "Was saying no a viable option?" This criminalizes many currently legal interactions and requires the state to adjudicate the "reasonableness" of a victim's social options.

  **4. Contracts (Agreement)**
  *   **Change:** "Take it or leave it" becomes voidable.
  *   **Consequence:** Adhesion contracts (employment, housing, insurance, software EULAs) would collapse. If you need a job to eat, you have no reasonable alternative to the employment contract. If you need a house to live, you have no reasonable alternative to the lease.
      *   **Result:** The market would shift to **Regulated Terms**. Since parties cannot rely on "agreement" to enforce harsh terms, the state would have to legislate standard terms for essential goods. Freedom of Contract would be replaced by Fairness Doctrine.

  ### Summary

  The pattern you noticed adds up to a **Liability Shield Theory**.
  The law isn't trying to ensure you are truly free; it's trying to ensure the *other party* isn't a wrongdoer.
  *   If the doctor didn't lie and didn't threaten you *wrongfully*, they are safe, even if you were desperate.
  *   If the cop didn't pull a gun, they are safe, even if you were intimidated.
  *   If the lover didn't change the physical act, they are safe, even if they lied about the stakes.

  It is a theory designed to protect **transactional stability** and **institutional authority**, not individual autonomy. Swapping to a Reasonable Alternatives account would prioritize individual autonomy but would likely render most institutional interactions (medicine, policing, employment, dating) legally unworkable without massive state intervention.
