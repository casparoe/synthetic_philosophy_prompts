answer: |-
  This is a formidable argument. Your friend has effectively formalized the *reductio ad absurdum* that haunts the "All-Affected Principle" (AAP). In the literature, this is often associated with Robert Goodin's defense of the AAP against Frederick Whelan's critique, though your friend pushes it past Whelan's boundary problem into full nihilism.

  Your friend is correct that the argument is **valid**. If you accept the premises as stated, the conclusion follows inexorably. The problem is not the logic; it is the **soundness**, specifically the slide from causal ontology to normative deontology.

  Here is the diagnosis you asked for, structured by the premise to reject, the cost of that rejection, the logical flaw involved, and the possibility of a non-seeping affectedness.

  ### 1. The Diagnosis: Where to Cut
  You should reject the inference from **(3) to (4)**, which relies on an equivocation in **(2)**.

  Your friend treats Premise (2) ("A person has a claim... whenever that decision affects her interests") as if "affects her interests" is synonymous with Premise (3)'s "life it alters, however indirectly." This is the weak link.

  **The Flaw:** There is an equivocation on the word **"interests."**
  *   In Premise (1) and the spirit of democratic theory, "interests" refers to **normatively salient stakes**—claims of right, welfare, or autonomy that generate duties in others.
  *   In Premise (3), "interests" is reduced to **causal impactedness**—any change in the state of the world that touches a person's utility function.

  The argument works only if *every causal impact* generates a *normative claim*. This is a category error. Causation is continuous (as your friend says); normativity is not necessarily so. To move from "I am causally affected" to "I have a claim to authorship" requires a filter of **significance** or **reciprocity** that Premise (3) explicitly forbids.

  ### 2. Why It Looked Plausible
  Premise (3) looks like a truism because it relies on a **Humean view of causation** applied to social life. In a globalized, ecologically interconnected world, it is empirically true that a zoning vote in London alters carbon emissions, which alters crop yields in Bangladesh. To deny this is to deny science.

  Furthermore, Premise (2) appeals to the **principle of non-arbitrariness**. If democracy is about protecting people from being governed by others, it seems arbitrary to say, "We will protect you from the effects of this law, but not that one, even though both hurt you." The "seepage" feels like moral honesty: why should a border stop a moral claim?

  ### 3. The Bill: What It Costs to Reject (3)'s Normative Force
  If you reject the move from (3) to (4)—insisting that not all causal effects generate claims to authorship—you must pay a theoretical price. You cannot simply assert a threshold; you must justify it without begging the question.

  **Cost A: The Charge of Arbitrariness**
  Your friend is right that any threshold (e.g., "significant" affectedness) is vulnerable to the charge of arbitrariness. Why is a 5% impact on welfare a claim, but 4.9% is not?
  *   **What you give up:** You give up the purity of the causal ontology. You must admit that the *demos* is a **construct**, not a natural kind discovered by tracing causal chains. You are drawing a political line, not finding a scientific one.
  *   **How to pay it:** You must argue that the threshold is based on **basic interests** (rights, subsistence, autonomy) rather than utility. A farmer in another hemisphere is causally affected by your seminar vote, but their *basic interests* (their capacity to pursue a life plan) are not implicated. This shifts the metric from "affectedness" to "vulnerability of core agency."

  **Cost B: The Acceptance of Externalities**
  By drawing a line, you admit that democracies will legitimately produce negative externalities for non-members.
  *   **What you give up:** You abandon the hope that democracy can be perfectly justice-tracking across borders. You accept that a legitimate demos may still harm outsiders, provided those outsiders do not have a claim to *authorship* (though they may have claims to *justice* or *human rights*).
  *   **How to pay it:** You must distinguish between **legitimacy** (right to rule over members) and **justice** (duties owed to all humans). The farmer doesn't need a vote in your seminar to be treated justly; he needs you not to harm his basic rights. This decouples the boundary problem from the problem of global justice.

  ### 4. The Hidden Logical Flaw: Scope and Modality
  There is a subtle quantifier shift in Premise (6) and (7).
  *   (6) says: "A claim that no institutional arrangement could in principle satisfy is not a claim anyone can be required to honor."
  *   (7) says: "No arrangement could give everyone affected a share in every decision."

  This assumes that satisfying the claim requires **direct, simultaneous authorship** for every decision. This is a straw man of democratic institutions.
  *   **The Fix:** Representation and trusteeship are mechanisms designed specifically to handle the impossibility of direct authorship. If I elect a representative who is mandated to consider global impacts, my "claim to a share" is mediated, not denied.
  *   **The Deeper Flaw:** The argument assumes legitimacy is **binary** (Legitimate/Illegitimate). If legitimacy is **scalar** (a matter of degree), then (8) does not follow. A decision can be *less* legitimate because it excludes remotely affected parties, without being *wholly* illegitimate. Your friend's nihilism depends on legitimacy being a switch that flips off when perfection is impossible. Most political theorists treat legitimacy as an asymptotic ideal.

  ### 5. Is There a Version of Affectedness That Does Not Seep?
  Yes, but it requires modifying Premise (2) to be more specific. You have three main options in the literature, each with a cost:

  **Option A: The All-Subjected Principle (ASP)**
  *   **Modification:** Replace "affected" with "subjected to coercion." You have a claim to authorship only if you are legally bound by the decision.
  *   **Why it stops seepage:** The farmer is not legally bound by your seminar vote. Causal ripples do not count; coercive enforcement does.
  *   **The Cost:** It ignores power without law. A hegemon can devastate a neighbor without coercing them legally. It makes democracy blind to informal empire. (See: Nancy Fraser, *Abnormal Justice*).

  **Option B: The Basic Interests Threshold**
  *   **Modification:** "A person has a claim... whenever that decision affects her **basic interests** (autonomy, subsistence, rights)."
  *   **Why it stops seepage:** Most causal ripples do not threaten basic interests. The seminar vote does not threaten the farmer's autonomy.
  *   **The Cost:** You must define "basic interests" pre-politically. This risks paternalism. Who decides what counts as basic? (See: David Miller, *National Responsibility*).

  **Option C: The Reciprocity/Cooperation View**
  *   **Modification:** Claims to authorship arise only among those engaged in a **scheme of social cooperation** where rules are mutually imposed.
  *   **Why it stops seepage:** You and the farmer are not in a cooperative scheme regarding seminar scheduling.
  *   **The Cost:** It makes the demos dependent on the existence of institutions. It struggles to justify *creating* new institutions (like a climate treaty) because the cooperative scheme doesn't exist yet. (See: Rawls, *Law of Peoples*).

  ### Summary Advice for Your Seminar
  Your friend has constructed a **perfectionist trap**. He has defined legitimacy as requiring the impossible (total inclusion of all causal impacts) and then declared legitimacy impossible.

  To escape without surrendering self-rule (1) or affectedness (2):
  1.  **Deny the Causal-Normative Identity:** Argue that Premise (3) is true about physics but false about rights. Causation is necessary but not sufficient for a claim to authorship.
  2.  **Introduce Significance:** Modify (2) to require *significant* impact on *basic* interests. Admit this requires judgment, but argue that judgment is the work of politics, not a flaw in the theory.
  3.  **Scalar Legitimacy:** Reject the binary conclusion (8). Argue that legitimacy is diminished by exclusion, not annihilated. The seminar vote is *highly* legitimate regarding students and *minimally* illegitimate regarding the farmer (perhaps requiring only that you not harm him, not that you enfranchise him).

  Your friend is right that the boundary problem has no *scientific* solution. But political theory is not physics. The line is not arbitrary if it is drawn where **human agency** is most at stake, rather than where **causal chains** merely touch. You can keep the moral core of affectedness without drowning in the seepage, provided you distinguish between being *touched* by a decision and being *governed* by it.
