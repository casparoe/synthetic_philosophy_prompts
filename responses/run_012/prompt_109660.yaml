answer: |-
  **The Case of the 'Qualifying Dependent'**

  Consider a Immigration Appeals Tribunal tasked with interpreting the statutory predicate 'qualifying dependent' for the purpose of granting residency visas. The statute provides no exhaustive definition, relying instead on the ordinary meaning of the term. Over a series of seven rulings, the Tribunal establishes a chain of precedent. In each instance, the applicant is granted status based on the reasoning that their case is relevantly similar to the immediately preceding successful case.

  **The Series of Decisions**

  1.  **Case A:** A biological child, aged 10, living in the same household as the sponsor, fully financially supported.
      *   *Ruling:* Qualifying dependent.
      *   *Decisive Dimension:* Biological lineage and co-residence.

  2.  **Case B:** A biological child, aged 19, living in university halls, fully financially supported.
      *   *Ruling:* Qualifying dependent.
      *   *Justification:* Relevantly similar to Case A. The temporary absence for education does not negate the dependency established in Case A.
      *   *Shift:* Co-residence is no longer decisive; financial support and lineage suffice.

  3.  **Case C:** A step-child, aged 19, living in university halls, fully financially supported.
      *   *Ruling:* Qualifying dependent.
      *   *Justification:* Relevantly similar to Case B. The lack of a biological link is immaterial given the established social and financial parent-child relationship.
      *   *Shift:* Biological lineage is no longer decisive; social/financial tie and age/education suffice.

  4.  **Case D:** An unmarried partner, aged 19, living in university halls, fully financially supported by the sponsor.
      *   *Ruling:* Qualifying dependent.
      *   *Justification:* Relevantly similar to Case C. The formal label of 'child' is less important than the reality of the financial dependency and care structure.
      *   *Shift:* Familial status is no longer decisive; financial dependency and life stage suffice.

  5.  **Case E:** An unmarried partner, aged 25, employed part-time, living together, partially financially supported.
      *   *Ruling:* Qualifying dependent.
      *   *Justification:* Relevantly similar to Case D. The shift from education to work and the reduction in financial support are gradual changes that do not break the bond of dependency.
      *   *Shift:* Full financial support is no longer decisive; interdependence and cohabitation suffice.

  6.  **Case F:** An unmarried partner, aged 30, fully employed, living together, financially independent.
      *   *Ruling:* Qualifying dependent.
      *   *Justification:* Relevantly similar to Case E. Financial independence does not negate the domestic dependency inherent in a shared household.
      *   *Shift:* Financial dependency is no longer decisive; domestic cohabitation suffices.

  7.  **Case G:** An unmarried partner, aged 30, fully employed, living in a different country (long-distance relationship), financially independent.
      *   *Ruling:* Qualifying dependent.
      *   *Justification:* Relevantly similar to Case F. Physical separation due to work commitments does not negate the committed domestic partnership established in Case F.
      *   *Shift:* Cohabitation is no longer decisive; emotional commitment suffices.

  **The Principle of Tolerance and the Breakdown**

  At each step, the Tribunal relies on a principle of tolerance: if Case $n$ possesses status $S$, and Case $n+1$ differs from Case $n$ only in a respect that is not decisive for $S$, then Case $n+1$ must also possess status $S$. This is the authoritative analogue to the soritical premise that if $x$ is $F$, and $y$ is indistinguishable from $x$, then $y$ is $F$.

  The reasoning breaks down not because any single step is obviously erroneous in isolation, but because the *respect* in which the cases are deemed similar shifts cumulatively. In standard sorites paradoxes involving physical objects (like a heap of sand), the dimension of comparison remains fixed (number of grains). Here, the dimension of similarity drifts from biology to finance, then to domestic arrangement, and finally to emotional commitment.

  The relation 'is relevantly similar to' is not transitive when the 'relevant respect' changes. Case A is like Case B regarding finance; Case B is like Case C regarding social ties; Case F is like Case G regarding commitment. However, Case A is not like Case G in any single decisive respect. The breakdown occurs because the Tribunal treats the chain of precedent as preserving a fixed meaning, whereas the authoritative decisions are actually reconstructing the meaning of 'dependent' at every turn. The final ruling classifies a financially independent, long-distance lover as a 'dependent child', which is plainly incompatible with the starting case of a minor child in the home.

  **Vagueness versus Ambiguity**

  This example illuminates the distinction between vagueness and ambiguity. Ambiguity arises when a term has two or more distinct, fixed meanings (e.g., 'bank' referring to a river edge or a financial institution). If 'dependent' were merely ambiguous, we would expect the Tribunal to switch abruptly between definitions. They do not; they proceed via a smooth continuum.

  Vagueness, by contrast, allows for this conceptual drift. A vague predicate has open-textured boundaries that permit the criteria of application to be adjusted in light of new contexts without an apparent change in meaning. The example reveals that vagueness is not merely a static fuzziness at the edges of a concept, but a dynamic plasticity. It allows the extension of a term to slide across conceptual space under the pressure of normative decision-making. While ambiguity involves a choice between discrete options, vagueness permits a continuous transformation where the start and end points share no common necessary conditions, yet are linked by a chain of sufficient similarities.

  **The Sharp but Unknowable Boundary**

  This authoritative sorites poses a significant challenge to the epistemic view that vagueness is merely a matter of a sharp but unknowable boundary. The epistemicist claims that for any vague predicate, there is a precise point where it ceases to apply, even if we cannot know it. In the context of physical objects (like grains of sand), one might plausibly argue such a boundary exists in principle.

  However, in the case of authoritative decisions, the boundary is not discovered; it is created. There is no pre-existing fact of the matter regarding whether a long-distance lover is a 'dependent' prior to the Tribunal's ruling. The Tribunal's decision *makes* it so within the jurisdiction. If one posits a sharp boundary here, one must claim that at some specific step (say, between Case D and Case E), the Tribunal made a factual error in applying the law. But the problem is not that they misidentified a fixed boundary; it is that the criteria for the boundary shifted beneath them.

  Consequently, the paradox cannot be resolved by positing a hidden cut-off point. The issue is normative, not ontological. The 'boundary' is fluid because the concept is defined by its use in reasoning, not by a fixed extension in the world. To insist on a sharp boundary is to ignore the mechanism by which legal and administrative concepts evolve. The paradox arises not from our ignorance of a line, but from the false assumption that consistency in outcome requires consistency in the *grounds* for the outcome. Thus, the authoritative sorites demonstrates that for institutional predicates, vagueness is a feature of the rule-making process itself, rendering the epistemic solution inapplicable.
