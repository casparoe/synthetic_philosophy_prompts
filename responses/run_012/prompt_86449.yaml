answer: |-
  Your hypothesis is sharp and mostly correct, but I think it misses one specific substantive claim that is keeping the two sides locked in place. You are right that Side A is asking an engineering question about whether a penalty term produces acceptable behavior, while Side B is asking a conceptual question about whether "side effect" denotes a value-free natural kind. However, the reason this verbal mismatch has persisted for a year without resolution is that Side A is implicitly making an empirical bet that they are unwilling to state as a premise, and Side B is treating that implicit bet as a conceptual error. The dispute is not merely verbal, nor is it purely bedrock normativity; it is a hidden empirical disagreement about the structure of the environment and the distribution of possible goals, disguised as a definition problem.

  Side A operates on the assumption that there is a subset of state changes that are "instrumentally convergent" or "structurally significant" across a wide prior of reward functions. When they propose measures like relative reachability or attainable utility preservation, they are claiming that preserving the ability to achieve many possible goals is a proxy for preserving the ability to achieve the *actual* goal, without needing to know what that actual goal is. This works only if the true human reward function is not adversarial with respect to that proxy. In other words, Side A is assuming that the world is structured such that "having more options" or "changing less from the baseline" correlates positively with "not doing things humans hate" for almost all reward functions we care about. Side B rejects this not because the proxy is imperfect, everyone grants that, but because they see this correlation as contingent on a specific value judgment. To Side B, claiming that "breaking a vase reduces future options" is a physical fact, but claiming that "reducing future options is bad" is a value judgment. If the agent's goal was to break the vase, reducing options was the point. Therefore, any measure that penalizes option reduction is implicitly assuming a prior over goals that excludes "break the vase" as a primary objective.

  The stalemate persists because Side A treats this prior as negligible or obvious, while Side B treats it as a full specification of values in disguise. If you look closely at the baseline problem you mentioned, you will see this same fracture. The question of whether the counterfactual baseline is well-defined independently of the agent's goals is actually a question about whether there is a "neutral" state of the world. Side A assumes inaction is neutral. Side B argues that inaction is just another trajectory with its own consequences, and selecting it as the baseline privileges the status quo, which is itself a value judgment. If the world is drifting toward catastrophe without intervention, a low-impact agent that sticks to the baseline is harmful. Side A usually responds by tweaking the baseline or the metric, but Side B sees this as moving the goalposts to hide the value judgment. The disagreement is substantive because it hinges on whether there exists a goal-independent quantity that is monotonic in true harm across a reasonable distribution of goals. If such a quantity exists, Side A is right that it is a design problem. If no such quantity exists without embedding a specific prior over goals, Side B is right that it is a conceptual error to call it value-free.

  To move past this, you need to stop arguing about the definition of "side effect" and force the group to formalize the implicit prior. Progress would look like a theorem or a formal demonstration showing exactly what distribution over reward functions a given impact measure assumes. For example, if you can prove that minimizing attainable utility preservation penalty is equivalent to optimizing for a specific prior over reward functions, then the debate shifts. Side A would have to admit they are not value-free, but rather value-agnostic only relative to a specific, weak prior. Side B would have to admit that if the prior is weak enough, the measure is useful despite not being truly objective. Currently, Side A claims value-independence and Side B claims value-dependence, but both are ignoring the middle ground where the measure encodes a weak prior that is sufficient for safety but not sufficient to solve the whole alignment problem. Until someone writes down the math for that prior, you will keep talking past each other because Side A thinks they are building a universal shield and Side B thinks they are building a shield that only works against enemies they have already decided not to fight.

  There is also the possibility of an honest nothing-will outcome, but only if the group refuses to acknowledge the normative load. If Side A insists that their measure is truly objective and Side B insists that any normative load invalidates the concept, you will never agree because you are arguing about whether a square circle exists. But if you reframe the question from "Is this value-free?" to "What values does this implicitly encode and are they safe enough?", the dispute dissolves into an engineering trade-off. The bedrock disagreement is only real if you require philosophical purity on the term "side effect." If you treat "side effect" as a shorthand for "deviation from a preferred baseline under a weak prior," then Side A has a solution and Side B has a caveat. The reason you are stuck is that neither side wants to concede that semantic ground. Side A wants the credit for solving impact without values, and Side B wants the credit for exposing the impossibility of doing so.

  So, to answer your question directly, this is a verbal dispute masking a hidden empirical question about the correlation between state-space metrics and human utility, compounded by a bedrock disagreement about whether admitting a weak prior counts as "specifying values." Concrete progress would be a formal result mapping impact measures to their induced priors over reward functions. If such a result shows the prior is too strong, Side B wins the conceptual point. If it shows the prior is weak enough to be considered background physics rather than specific values, Side A wins the practical point. Until then, you are arguing about whether a glass is half empty or half full while refusing to agree on what liquid is inside. I suggest you spend the next session trying to derive the implicit reward function that an AUP agent is optimizing for when it penalizes itself for changing the world. That derivation will either validate Side B's suspicion that it is just hidden values or validate Side A's hope that it is just structural constraints.
