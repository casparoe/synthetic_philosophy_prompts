          4.  Define what progress looks like (formal limits vs. pragmatic admission).
          5.  Conclude on the "nothing-will" possibility (if it's fundamentally normative).

      *   *Refining the Argument:*
          *   The user suspects it's a verbal dispute. I should argue it's a verbal dispute *masking* a substantive empirical disagreement about the structure of the world and values.
          *   Side A thinks "power" is a natural kind. Side B thinks "power" is only useful relative to goals.
          *   The "No Free Lunch" theorem for impact measures is the key formal result needed. If you average over all possible reward functions, impact minimization is as likely to hurt as help. So Side A must be relying on a restricted class of reward functions. Side B says "Aha! Values!" Side A says "Weak values!"
          *   Progress = Admitting the prior.
