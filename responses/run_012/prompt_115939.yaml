          *   The Interviewee is right: It's about the *act*.
          *   The "Pseudo-problem" claim is the strongest, but needs nuance. It's a pseudo-problem *for practice*, but a real problem *for theory*.
      *   *Hidden Assumptions:* Explicitly name "Inferential Internalism." This is the controversial theory of rule-following Camp 1 assumes. (Boghossian, Peacocke vs. Wittgenstein, Brandom).
      *   *Progress:* What counts?
          *   Not a formal result (logic can't solve this).
          *   Not a distinction (they already have distinctions).
