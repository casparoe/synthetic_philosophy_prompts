  The room was quiet, save for the hum of the ventilation and the soft click of the dealer's chips. There were only two boxes on the felt table. One was clear acrylic, filled with exactly one hundred balls: fifty red, fifty blue. You could count them if you wanted to. You could see the ratio, the balance, the honest geometry of it.

  The other box was matte black steel. Sealed. The label said *One Hundred Balls*, but nothing else. It could be all red. It could be all blue. It could be fifty-fifty. There was no way to know.

  "First round," the dealer said. His voice was flat, practiced. "Pick a color. Let's say Blue. If you draw Blue, you walk with ten thousand dollars. If you draw Red, you walk with nothing."

  Mara looked at the clear box. She could see the blue balls nestled against the red. She knew the odds. She knew exactly how much chance she was taking. It felt like standing on a solid floor. There was a risk, yes, but it was a measured risk. It was a contract she could read.

  Then she looked at the black box. It felt like standing on the edge of a cliff in the fog. If she reached in, she might find nothing but red. The unknown felt heavy, like a weight pulling downward. Why would she trade a known half for a mystery that could be zero? It wasn't fear, exactly. It was a preference for truth. She would rather lose on the truth than win on a guess.

  "Clear box," Mara said. "Blue."

  She reached in, her fingers cool against the smooth plastic of the balls. She pulled one out. It was blue. The dealer slid the chips toward her. She didn't feel lucky; she felt correct. She had chosen the ground she could stand on.

  They took a break. The dealer poured water. The boxes stayed where they were, silent witnesses.

  "Second round," the dealer said after a while. He gestured to the chips she had just won. "We play for what you have. Same boxes. Same colors. But the rule is reversed. If you draw Red, you keep your money. If you draw Blue, you lose it all. You owe us the ten thousand."

  Mara looked at the clear box. Fifty red, fifty blue. She knew the math. If she chose the clear box, she was accepting a guaranteed fifty percent chance of ruin. It was a precise calculation of loss. It felt like signing a document that said *I agree to lose half the time.* The certainty of it was suffocating. The clear box wasn't safety anymore; it was a trap with visible bars.

  She looked at the black box. The mystery. In the first round, the mystery had been a threat because it might contain no winners. Now, the mystery was a shield. What if there were no blue balls inside? What if the box was entirely red? If she chose the black box, she wasn't agreeing to fifty percent. She was agreeing to *possibility*. The unknown wasn't a void anymore; it was a place where the loss might not exist at all.

  Choosing the clear box felt like walking into a wall she could see. Choosing the black box felt like stepping into a shadow where the wall might not be there.

  "Black box," Mara said. "Red to stay."

  She reached into the steel container. Her hand brushed against cold metal spheres. She couldn't see what was coming. There was a strange comfort in that blindness. In the first round, she had wanted light because she was chasing something. Now, she wanted the dark because she was hiding from something.

  She pulled out a ball. It was red.

  The dealer nodded and pushed the chips back to her side of the table. Mara stacked them, her hands steady. She looked at the two boxes. The clear one sat there, honest and unchanging. The black one sat there, silent and infinite.

  She had chosen the light when she wanted to gain, and she had chosen the shadow when she wanted to keep. She couldn't say why one felt safer than the other, only that in the moment, each choice had felt like the only way to breathe.

  "Same time tomorrow?" the dealer asked.

  Mara stood up. She looked at the clear box, then at the black one. For a second, she wondered if the balls inside the black box had shifted while she wasn't looking, or if they had stayed still all along and it was only her that had moved.

  "Maybe," she said.

  She left the room without looking back, carrying the weight of the chips and the quiet certainty that she had made the right choice both times, even if the two choices couldn't possibly sit in the same world.
