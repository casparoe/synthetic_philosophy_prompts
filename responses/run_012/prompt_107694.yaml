      *   *Sequence:*
          1.  Setup & Intuition (15m)
          2.  Naive Bayes/Material Conditional (15m)
          3.  The Conflict & Jeffrey Bridge (20m)
          4.  MinEnt Solution (15m)
          5.  Variant & Closing (10m)
      *   *Misconceptions:* Address "P(Red) changes" early. Address "Material Conditional" during calculation. Address "P(If) = P(Then|If)" during the transition to constraints.
      *   *Variant:* Non-uniform prior. Place: After MinEnt introduction.
