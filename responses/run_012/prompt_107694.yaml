answer: |-
  Start with ordinary conditionalization to establish the baseline, demonstrate its failure via the material-conditional reading, introduce Jeffrey conditionalization to shift focus from facts to constraints, and culminate in minimum-relative-entropy as the resolving rule.

  **The Carrying Example**
  Use a fresh "Lost Traveler" scenario, but only if it strictly replicates the logical topology of the paratrooper case. The scenario must have: (1) three mutually exclusive and exhaustive locations (e.g., North, East, West); (2) a uniform prior distribution; (3) information that constrains the *ratio* of probabilities within a subset (e.g., "If not North, East is twice as likely as West") without eliminating the complement (North); and (4) no causal or evidential link between the message source and the actual location that would screen off the constraint. It must lack any implication that the speaker knows the traveler's actual location; the speaker must only know the statistical distribution of travelers in the non-North zones. If your scenario implies the speaker checked the North zone and found nothing, it collapses into standard elimination; if it implies the speaker knows the traveler's path, it introduces causal screening. Keep the epistemic source opaque to preserve the purely probabilistic constraint.

  **Sequence of Ideas and Dependencies**
  1.  **Ordinary Conditionalization:** Establish this first as the default rule for learning facts ($P_{new}(H) = P_{old}(H|E)$). Students must possess this to attempt the naive update.
  2.  **Material-Conditional Reading:** Introduce this immediately after as the natural formalization of the news ("If not North, then East..." becomes $\neg N \to E$). This depends on ordinary conditionalization because students will attempt to condition on this proposition.
  3.  **Jeffrey Conditionalization:** Introduce this third, not as the solution, but as the conceptual bridge. It demonstrates that one can update on changes to probability values ($P_{new}(E) = k$) rather than certainties ($P_{new}(E) = 1$). This prepares them to accept updating on a constraint ($P(E|H) = k$) rather than a fact.
  4.  **Minimum-Relative-Entropy (MinEnt):** Present this last as the specific rule that handles the Judy Benjamin constraint. It depends on Jeffrey conditioning conceptually (updating on constraints) but extends it to conditional constraints, resolving the failure of the material-conditional reading.

  **Misconceptions and Intervention Points**
  1.  **"The probability of North must go up/down because we learned about the other territories."**
      *   *When:* During the initial intuition gathering (first 15 minutes).
      *   *Intervention:* Do not correct this with math yet. Ask: "Does knowing the ratio of East vs. West tell you anything about whether you are in North?" Force them to articulate why their intuition says $P(N)$ should remain fixed before showing the math that says otherwise.
  2.  **"The update is just Bayes on the material conditional ($\neg N \to E$)."**
      *   *When:* During the formalization phase (minutes 15–30).
      *   *Intervention:* Walk through the calculation explicitly. Show that conditioning on $\neg(\neg N \land \neg E)$ eliminates the $\neg N \land \neg W$ world, which disproportionately removes probability mass from $\neg N$, thereby inflating $P(N)$. Head this off by highlighting that the message did *not* eliminate the possibility of being in West, only changed its weight relative to East.
  3.  **"The probability of a conditional simply is the conditional probability."**
      *   *When:* When explaining why the material conditional is the wrong representation (minutes 30–45).
      *   *Intervention:* Distinguish $P(A \to B)$ from $P(B|A)$. Explain that treating the news as a fact ($A \to B$ is true) imposes a truth-condition that eliminates worlds, whereas the news is a constraint on ratios that preserves all worlds. This motivates the shift to Jeffrey/MinEnt.

  **The Variant**
  Introduce the variant ("If not North, then..." with a non-uniform prior, e.g., $P(N)=0.5, P(E)=0.3, P(W)=0.2$) immediately after presenting the MinEnt solution (minutes 60–65). Its purpose is to dislodge the suspicion that the "keep $P(N)$ fixed" result is an artifact of symmetry or indifference. It demonstrates that MinEnt preserves the prior probability of the antecedent's complement ($N$) regardless of the prior distribution, whereas the material-conditional update distorts it differently depending on the prior weights.

  **Closing Question**
  "What specific existential claim about the world does the material-conditional update assume that the Judy Benjamin constraint does not, and why does that single claim force the probability of North to change?" (Target answer: The material conditional assumes the conditional proposition is *true*, which eliminates the world where the antecedent is true and consequent false; the constraint assumes only a ratio holds, preserving that world but reweighting it.)

  **Omissions**
  Openly state that you are leaving out: (1) the formal proof of uniqueness for the MinEnt solution; (2) the debate over whether MinEnt is the *correct* rule (e.g., van Fraassen's later criticisms vs. Grove/Halpern); and (3) alternative updating rules like "Imaging." Say this explicitly to prevent students from thinking the solution is uncontested or mathematically trivial, while keeping the session focused on the structural problem rather than meta-epistemological disputes.
