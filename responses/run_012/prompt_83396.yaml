answer: |-
  **Project Title:** Epistemic Entitlement Without Semantic Analyticity: A Defense of Inference-Based Normativity

  **1. The Research Question**
  Can the epistemic notion of analyticity (entitlement to belief without empirical evidence) be decoupled from the semantic notion (truth guaranteed by meaning) and successfully grounded in the norms of inference, thereby surviving the standard Quinean objections?

  **2. Critical Pre-Analysis: Potential Confusions**
  Before proceeding, I must flag three ways this project could collapse into triviality or error.
  *   **The Equivocation Risk:** I must ensure I am not simply relabeling the *a priori*. If "epistemic analyticity" amounts to nothing more than "psychologically stubborn belief," the project is merely descriptive psychology. The entitlement must be *normative*.
  *   **The Grounding Gap:** If I concede that meaning does not guarantee truth (rejecting semantic analyticity), what grounds the epistemic entitlement? If I answer "the nature of concepts," I risk smuggling semantic analyticity back in. If I answer "pragmatic utility," I concede to Quine and lose the distinctively *epistemic* force.
  *   **The Inference Shift:** Moving from sentences to inferences avoids some semantic pitfalls, but Quine's holism attacks the web of belief globally. I need to show why specific inference rules are immune to revision in a way that doesn't rely on the very distinction Quine demolished.

  **3. State of the Debate**
  The standard narrative treats the analytic/synthetic distinction as a binary: either it stands (Carnap, Grice, Strawson) or it falls (Quine). The defenders typically try to salvage the *semantic* definition, arguing that synonymy or definition can be made rigorous. This is the wrong battlefield. Quine's arguments against circularity in definition and truth-by-convention are robust against semantic claims.

  However, the *motivation* for the distinction is largely epistemic: explaining the necessity of logic, the security of arithmetic, and the "free" nature of certain transitions in reasoning. Current neo-rationalist attempts to save this often rely on implicit semantic commitments that leave them vulnerable to the same Quinean attacks. There is no clear articulation of an epistemic analyticity that explicitly accepts the death of semantic analyticity. This project fills that gap.

  **4. Methodology and Semester Timeline**
  This is a solo, library-based project focused on argument reconstruction and development.

  *   **Month 1: Exegesis and Isolation.**
      *   *Reading:* Focused re-examination of the central critiques of analyticity, specifically isolating arguments that target *semantics* versus those that target *epistemology*.
      *   *Writing:* Produce a 5,000-word exegesis mapping exactly where Quinean arguments fail to touch epistemic entitlement claims.
  *   **Month 2: Positive Construction.**
      *   *Reading:* Literature on rule-following and the normativity of logic (avoiding heavy metaphysics).
      *   *Writing:* Draft the core argument: defining epistemic analyticity as a constraint on rational inference rather than a property of propositions. Develop the "entitlement without meaning" model.
  *   **Month 3: Stress-Testing.**
      *   *Reading:* Holistic objections and pragmatic counter-arguments.
      *   *Writing:* Refine the draft against the strongest holist objections. Finalize the manuscript for internal review.

  **5. Deliverables and Success Conditions**
  *   **Deliverable:** One complete conference-length paper (approx. 8,000 words) ready for external submission.
  *   **Success:** The paper demonstrates that at least one major Quinean argument (e.g., the circle of synonymy) presupposes a semantic target and leaves the epistemic normativity of inference untouched.
  *   **Failure:** The project fails if I cannot articulate a ground for epistemic entitlement that is not either (a) secretly semantic or (b) reducible to pragmatic centrality within the web of belief. If the result is merely "we *treat* these inferences as special," the project has not advanced the debate.

  **6. Scope Verdict: Semester or Career?**
  **Verdict:** This is the *first chapter* of a career project, not a complete resolution.
  In one semester, I can successfully argue for the *decoupling* of the two notions and show that the epistemic one survives the semantic death. I cannot, in this timeframe, fully solve the *grounding problem* (what actually generates the entitlement). A full theory of epistemic entitlement requires a broader account of rationality and concept possession that exceeds a single semester's scope. This grant will fund the crucial defensive maneuver that makes the larger project viable.

  **7. Confidence Assessment**
  *   **Overall Confidence:** High (80%). The diagnosis that the debate conflates two distinct questions is robust and historically supported. The literature is ripe for this specific distinction.
  *   **Least Certain Point:** The **Grounding Mechanism**. I am least sure about explaining *why* a thinker is entitled to rely on an inference rule if that entitlement is not derived from the meanings of the terms involved. Providing a non-semantic, non-pragmatic account of this normativity is the hardest philosophical heavy lifting, and there is a significant risk that the positive account will remain programmatic rather than demonstrative by the end of the term.
