answer: |-
  ### Brainstorming the End-Words

  To capture the philosophical problem of consequentialist cluelessness within the strictures of a sestina, the end-words must function as both concrete images and abstract variables. They need to be semantically flexible enough to shift meaning with every rotation, mirroring how a consequence changes context as it moves through time. Here are six candidates representing the chain of agency and knowledge:

  1.  **Deed** (The Act): It can signify a physical action, a legal document, a moral event, or a memory. It survives repetition because it can be specific (the thing I did) or general (the concept of action).
  2.  **Aim** (The Intention): It suggests a weapon, a goal, a direction, or a failure of focus. It allows the poem to move from purposeful intent to aimless drifting.
  3.  **Cost** (The Immediate Effect): It implies financial price, physical pain, emotional loss, or sacrifice. It grounds the abstract "negative utility" in something felt.
  4.  **Yield** (The Distant Effect): It works as agricultural harvest, financial profit, surrendering (to give way), or producing a result. It captures the uncertainty of future outcomes.
  5.  **Sum** (The Known/Accounting): It refers to arithmetic, a total, the essence of a matter ("sum and substance"), or a lack thereof. It directly addresses the calculative demand of consequentialism.
  6.  **Rest** (The Unknown): It means sleep, peace, the remainder of a division, or what is left over. It perfectly encapsulates the "unknown" portion of the calculation that cannot be settled.

  **Selection:** I choose **Deed, Aim, Cost, Yield, Sum, Rest**. This set creates a ledger of moral accounting that the poem will attempt to balance and fail. The words are monosyllabic and sturdy, allowing them to bear the weight of repetition without becoming purely mechanical. They move from the physical (Deed) to the mental (Aim), to the painful (Cost), to the temporal (Yield), to the mathematical (Sum), and finally to the void (Rest).

  ***

  ### The Ledger of Small Things

  I measured out the gravity of **deed**,
  Adjusted language like a rifle **aim**,
  Prepared to pay the friendship's immediate **cost**,
  Believing truth would offer moral **yield**,
  Convinced I could account the total **sum**,
  And leave the unknown part to be the **rest**.

  But silence settled on the unpaid **rest**,
  Haunting the memory of that simple **deed**,
  Defying every arithmetic **sum**,
  Where kindness lost its trajectory and **aim**,
  And pain became the only harvest **yield**,
  While I absorbed the unforeseen **cost**.

  I tally up the interest on that **cost**,
  In nights deprived of any natural **rest**,
  Asking what future good could ever **yield**,
  From the shadow of such a heavy **deed**,
  When the hand forgets exactly how to **aim**,
  At a target vanished from the **sum**.

  Is there a stable, final, moral **sum**?
  Or just the accumulating **cost**?
  Did I ever truly take the **aim**,
  Or let the situation take its **rest**?
  Judging the ripple after initial **deed**,
  Waiting for a kindness to **yield**.

  The decades fail to **yield**,
  Their ledger balances no **sum**,
  The shadow of that small **deed**,
  Grows heavier than the **cost**,
  Disturbing all my mental **rest**,
  Mocking my original **aim**.

  My memory tries to **aim**,
  At a future I cannot **yield**,
  Giving up the search for **rest**,
  Knowing there is no final **sum**,
  I carry only the unpaid **cost**,
  Of that one small and ordinary **deed**.

  I held my **aim** against the uncertain **yield**,
  I sought my **rest** inside a missing **sum**,
  And live with all the **cost** of one plain **deed**.
