  **On the Mapping**
  In a pantoum, the recurring lines (2 and 4 becoming 1 and 3) function as the system's **priors**: they persist across time, stable until context shifts their meaning. The new lines (1 and 3 of each stanza) act as **sensory input** or **prediction error**: they arrive fresh, forcing the recurring lines to be re-interpreted in light of new evidence. The final stanza's requirement to recycle the opening lines mirrors the **recursive loop** of self-modeling—the system ends up predicting its own predictions. The Dark Room problem is addressed in the middle stanzas as a temptation of zero error that violates deeper physiological priors; the delusion problem is addressed as a failure of pragmatic accuracy.

