                  *   *Provision:* Who buys the milk? (Contribution).
                  *   *Governance:* Rules can be written on the door.
              *   *Wait, is it too trivial?* Maybe. But the prompt asks for "small enough that arithmetic... can be worked through."
              *   *Let's try:* **A Shared Mobile Phone Data Plan (Family Plan).**
