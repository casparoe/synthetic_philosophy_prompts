      *   *Better Example:* **A Group Order for Food.**
      *   4 People. Delivery fee is shared. Food is individual.
      *   No, that's not a commons.
      *   *Let's go with the **Shared House Cleaning/Supplies**.*
      *   Resource: Cleanliness + Supplies (Soap, Milk).
      *   Depletion: Using the milk.
