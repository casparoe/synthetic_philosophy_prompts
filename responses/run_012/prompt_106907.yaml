  2.  **Deconstruct the Key Ideas:**

      *   *Idea 1 (Open Access vs. Managed Commons):* This is Elinor Ostrom's critique of Hardin. Hardin described an "open access regime," not a traditional "commons." I need to show that rules change the outcome without needing a private owner or a state policeman.
      *   *Idea 2 (Rivalry vs. Non-excludability):* This is the distinction between a "Common-Pool Resource" (rival, non-excludable) and a "Public Good" (non-rival, non-excludable). The prompt asks to show the difference between *depleting* a stock and *free-riding* on a provision. Using one example for both is tricky but possible if the example has a maintenance cost or a replenishment mechanism.

  3.  **Select "The One Example":**

      *   *Constraints:* Not pasture/fishery. Simple arithmetic. Familiar. Must show depletion *and* free-riding.
      *   *Idea A: A shared pizza.* (Too consumable, hard to show maintenance).
      *   *Idea B: A group project.* (Good for free-riding, bad for physical depletion).
      *   *Idea C: A shared household fridge.* (Good. Food disappears [depletion], someone has to buy milk/clean [maintenance/free-ride]. Familiar to teens).
      *   *Idea D: A shared battery/power bank.* (Good for depletion, less obvious for maintenance).
      *   *Idea E: A communal garden/plot.* (Close to pasture, might trigger GCSE memories).
      *   *Selection:* **The Shared House Fridge.**
          *   *Why:* Everyone understands food going missing (depletion). Everyone understands someone needs to buy the milk or clean the shelf (provision/maintenance). It's relatable.
          *   *Arithmetic:* 4 housemates, £10 for shopping, 10 items. Easy numbers.
          *   *Risk:* Might feel too trivial. Need to ensure it scales conceptually to serious resources.
          *   *Alternative:* **A Shared Group Gift.** (Everyone chips in for a teacher's gift). Good for free-riding, bad for depletion.
          *   *Alternative:* **A Shared WiFi Password/Data Allowance.** (Data depletes, someone pays the bill).
          *   *Decision:* **The Shared WiFi/Data Plan.**
              *   *Depletion:* Data cap (e.g., 100GB). If I stream 4K, you lag. (Rivalrous).
              *   *Provision:* Someone pays the £50 bill. If I don't pay but use it, I free-ride. (Non-excludable once paid).
              *   *Familiarity:* High.
              *   *Arithmetic:* Very clean.
              *   *Distinction:* Clear separation between *using* the data (depletion) and *paying* for the connection (provision).
              *   *Wait, one catch:* WiFi is usually non-rivalrous up to a point (bandwidth vs. data cap). A data cap makes it rivalrous. Let's stick with **A Shared Data Cap on a Mobile Hotspot.**
              *   *Refinement:* Actually, the **Fridge** is slightly better for the "governance" angle. You can make rules about the fridge (labels, cleaning rotas). WiFi rules are harder to enforce physically. Let's go with **The Shared Fridge in a School Common Room.**
              *   *Wait, prompt says:* "Not the over-grazed pasture... familiar enough that a Year 10 pupil will accept it."
              *   *Let's try:* **A Shared Group Project Grade.** No, that's not a resource.
              *   *Let's try:* **A Communal Coffee Pot.** (Beans deplete, someone must brew/buy).
