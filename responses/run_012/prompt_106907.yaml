      *   Depletion: If I take 10L, you get less.
      *   Payment: Someone has to carry the water to the bucket (labour cost).
      *   *Verdict:* A bit too close to the "well" archetype.
      *   *Stick with Data Plan.* It's distinct from pasture/fishery. It's digital. Teens get it.
      *   *Wait, one more check:* "Letting other people pay for a shared thing."
