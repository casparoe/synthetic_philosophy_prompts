      *   *Data Plan:*
          1.  **Depletion:** 100GB Cap. If I use 90GB, you have 10GB. (Rivalry).
          2.  **Payment:** £50 Cost. If I pay £0, you must pay £50 or service stops. (Free-riding).
          3.  **Connection:** Usually, these are linked. But conceptually they are distinct. I can use the data without paying (if I have the password and you pay). I can pay without using (if I'm away).
          4.  *This holds up.*

