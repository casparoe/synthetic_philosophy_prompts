      *   **Goal:** Avoid the moralistic "people are greedy" narrative. Focus on *structure* over *character*.
      *   **Key Idea 1:** Distinguish between "open access" (no rules/ownership) and "managed commons" (community governance). Avoid overusing the word "institution".
      *   **Key Idea 2:** Distinguish between "rivalrous depletion" (taking too much) and "non-excludable free-riding" (letting others pay). Ideally, use *one* example to show both.
