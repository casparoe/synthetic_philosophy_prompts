answer: |-
  Here is a plan for your thirty-minute session. It is designed to be written out on the whiteboard as you speak, keeping the arithmetic visible so the structure of the problem is seen, not just heard.

  ### 1. The Order of Components

  You must build the explanation in this specific sequence. If you change the order, the logic will not hold for an audience without economics training.

  1.  **The Scenario (The Resource):** Define the shared thing and the group using it.
      *   *Why first:* You cannot explain incentives without a concrete situation.
      *   *Load-bearing:* Yes. Without this, the rest is abstract theory.
  2.  **The Arithmetic of Depletion (Taking):** Show how one person's use reduces what is left for others.
      *   *Why second:* You must establish that the resource is finite before you explain why fighting over it happens.
      *   *Load-bearing:* Yes. This proves the "rivalry" without using the word.
  3.  **The Arithmetic of Provision (Paying):** Show that keeping the resource available costs money or effort, which can be dodged.
      *   *Why third:* This separates the act of *using* from the act of *maintaining*.
      *   *Load-bearing:* Yes. This is required to make your second key point (the two different failures).
  4.  **The Diagnosis (Incentives vs. Character):** Explain that the bad outcome happens even if everyone is nice, because the rules make overuse the sensible choice.
      *   *Why fourth:* You can only clear up the "greed" misconception after showing the math of the situation.
      *   *Load-bearing:* Yes. This is the core philosophical shift you want them to make.
  5.  **The Distinction (Open Access vs. Managed Rules):** Show that adding rules changes the outcome without changing the owner.
      *   *Why fifth:* You can only defend the "commons" once you have defined the "tragedy" as a lack of rules, not a lack of owners.
      *   *Load-bearing:* Yes. This delivers your first key point.
  6.  **The Conclusion:** Summarise and ask the final question.

  ### 2. The One Example: The Family Data Plan

  **The Setup:** A family of four shares one mobile phone data plan.
  **The Numbers:** The plan has a **100GB monthly limit**. The bill is **£40 per month**.

  **Why this example:**
  *   **Familiar:** Every pupil understands mobile data and bills.
  *   **Distinct:** It is not a field or a fish, so it bypasses their GCSE memories.
  *   **Arithmetic:** 100 divided by 4 is 25. £40 divided by 4 is £10. The math is instant.
  *   **Sturdy:** It supports both "taking too much" (downloading videos) and "paying too little" (refusing to chip in for the bill).

  **What it must have:**
  *   A hard cap (100GB). If the data were infinite, there is no depletion.
  *   A shared password. If you can lock others out easily, it is not a commons problem.
  *   A single bill. Someone has to pay it, or the data stops for everyone.

  **What it must lack:**
  *   Do not introduce a "provider" or "company" as a villain. The problem is between the four family members.
  *   Do not introduce complex pricing tiers. Keep it flat.

  **Where it might mislead:**
  *   **The "Infinite" Illusion:** Pupils often think digital things don't run out. You must emphasise that once 100GB is gone, the internet stops or becomes unusably slow for *everyone*.
  *   **The "Bill" Illusion:** In reality, parents usually pay. You must stipulate: *"In this thought experiment, the four siblings are responsible for paying the bill themselves."*

  ### 3. Misconceptions and How to Head Them Off

  Here are the misconceptions in the order they will appear, with the exact moment to stop them.

  **1. "The problem is human greed."**
  *   **When it surfaces:** Immediately after you describe the scenario. Someone will say, "Well, don't just download so much."
  *   **Where to head it off:** During **Component 4 (The Diagnosis)**.
  *   **What to say:** "Imagine the four siblings are all perfectly honest and love each other. Person A wants to watch a film. They know if they don't watch it now, the data resets next month. They also know their siblings might use the data if they don't. Even a nice person has a reason to use the data now rather than save it for someone else. The problem isn't that they are bad people; it's that the plan rewards using it fast."

  **2. "Rational means selfish."**
  *   **When it surfaces:** When you explain why a nice person still overuses data.
  *   **Where to head it off:** During **Component 4 (The Diagnosis)**.
  *   **What to say:** "In economics, 'rational' doesn't mean 'selfish'. It means 'responding to the rules of the game'. If the rule is 'use it or lose it', the rational move is to use it. We want to change the rule, not the person."

  **3. "The two failures are the same thing."**
  *   **When it surfaces:** When you move from data limits to the bill.
  *   **Where to head it off:** During **Component 3 (The Arithmetic of Provision)**.
  *   **What to say:** "Notice the difference. In the first part, the harm was using the data (subtraction). In this part, the harm is not paying the bill (free-riding). I can pay my £10 and still use too much data. I can use no data at all and refuse to pay. These are two different breaks in the system."

  **4. "A commons just means shared ownership, so it's always doomed."**
  *   **When it surfaces:** When you propose a solution.
  *   **Where to head it off:** During **Component 5 (The Distinction)**.
  *   **What to say:** "We often use 'commons' to mean 'anything shared'. But historically, a commons was a resource with strict rules: who can use it, when, and how much. The tragedy happens when there is *no* management, not when there is *shared* management."

  **5. "The ruinous outcome is inevitable."**
  *   **When it surfaces:** When you ask for solutions.
  *   **Where to head it off:** During **Component 5 (The Distinction)**.
  *   **What to say:** "Hardin, who wrote the famous essay on this, said the only solutions are private ownership or government control. But families solve this all the time without selling the phone or calling the police. They make agreements."

  **6. "The only remedies are privatise or regulate."**
  *   **When it surfaces:** At the very end.
  *   **Where to head it off:** During **Component 5 (The Distinction)**.
  *   **What to say:** "Privatisation means one person owns the data. Regulation means the phone company limits you. But there is a third option: the four siblings agree on a rota. That is self-governance. It is not private, and it is not state-run."

  ### 4. The Final Question

  Do not ask them to define the tragedy. Ask them to diagnose a situation.

  **The Question:**
  *"Imagine I tell you about a shared resource that is being ruined. I tell you the owners are all kind, honest people who want the resource to last. Based on what we discussed today: is the problem that the people are wrong, or that the description of the 'shared resource' is missing a crucial detail? What detail is missing?"*

  **What you are looking for:**
  *   **Wrong answer:** "They need to be stricter" or "They should sell it."
  *   **Right answer:** "The description is missing the **rules**." (Or: "It's an open access situation, not a managed one.")
  *   **Why:** This tests whether they understand that the *structure* (rules/governance) determines the outcome, not the *character* (greed/kindness).

  ### 5. What to Decline

  You cannot cover everything in thirty minutes. You must explicitly set boundaries so you do not get bogged down in questions you cannot answer without formal theory.

  **1. Decline to solve specific real-world politics.**
  *   **What to say:** "People often ask, 'So, should the government own the oceans?' or 'Should we privatise water?' I am not going to answer that today. We are looking at the *structure* of the problem, not the politics of the solution. The same structure can appear in a family, a school, or a country."

  **2. Decline to define legal property rights.**
  *   **What to say:** "I am using 'ownership' loosely to mean 'who gets to decide'. I am not a lawyer, and we are not discussing legal titles. We are discussing who has the power to make and enforce rules."

  **3. Decline to use formal Game Theory.**
  *   **What to say:** "There is a branch of maths called Game Theory that models this with complex matrices. We are going to do the logic of that on the whiteboard with simple numbers instead. The logic is the same, but the maths is ours."

  ### Session Script Outline (for your whiteboard)

  **0-5 mins: The Setup**
  *   Draw a mobile phone icon. Write: **100GB Limit**. **£40 Cost**. **4 Users**.
  *   Ask: "If no one talks to anyone else, what happens?" (Elicit: They use it all).

  **5-10 mins: The Arithmetic of Depletion**
  *   Write: **Fair Share = 25GB each**.
  *   Write: **User A uses 50GB**.
  *   Ask: "How much is left for B, C, D?" (50GB total, approx 16GB each).
  *   Point: "User A gained 25GB extra. Users B, C, D lost 9GB each. The cost is shared; the benefit is private."

  **10-15 mins: The Arithmetic of Provision**
  *   Write: **Bill = £40**. **Fair Share = £10 each**.
  *   Write: **User A pays £0**.
  *   Ask: "What must B, C, D do?" (Pay £13.33 each or service stops).
  *   Point: "This is the second failure. Not taking too much, but contributing too little."

  **15-20 mins: The Diagnosis (Structure vs. Character)**
  *   Write: **Is User A Greedy?**
  *   Say: "Maybe. But even if User A is nice, they worry B will take the data first. So A takes it now."
  *   Write: **Incentives > Character**.

  **20-25 mins: The Distinction (Open vs. Managed)**
  *   Draw two columns.
  *   **Column 1: Open Access.** (No rules, anyone can join, no monitoring). Result: Ruin.
  *   **Column 2: Managed Commons.** (4 users only, agreed 25GB limit, agreed £10 payment). Result: Sustainable.
  *   Point: "Both are 'shared'. Only one ends in tragedy. The difference is the rules."

  **25-30 mins: Conclusion & Question**
  *   Summarise the two failures (Depletion vs. Payment).
  *   Summarise the distinction (No Rules vs. Agreed Rules).
  *   Ask the Final Question.
  *   Thank them.
