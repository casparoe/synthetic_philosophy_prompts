                  *   *Depletion:* If Person A uses 15GB, only 5GB left for B, C, D. (Rivalry).
                  *   *Provision:* If Person A refuses to pay £10, the bill doesn't get paid, or B, C, D must cover. (Free-riding).
                  *   *Governance:* Can they set rules? "No streaming after 8pm." "Pay via app."
                  *   *This works.* It avoids the "pasture" cliché. It's digital (modern). Arithmetic is easy.

  4.  **Drafting the Order of Components (Dependency Chain):**

      *   1. Define the Resource (The Data Plan).
      *   2. Define the Incentive (Individual benefit vs. Group cost).
      *   3. Demonstrate Depletion (The Math of Usage).
      *   4. Demonstrate Provision (The Math of Payment).
      *   5. Introduce Rules/Governance (Changing the structure).
      *   6. Contrast "Open Access" vs. "Managed Commons."
      *   *Logic:* You can't explain the failure without the resource. You can't explain the solution without the failure. You can't distinguish the two failures (depletion vs. payment) until you've modeled the resource. You can't defend the "commons" until you've defined "open access."

  5.  **Addressing Misconceptions:**

      *   *Greed vs. Structure:* Address early. Use the math to show a "nice" person still has an incentive to overuse.
      *   *Rationality vs. Selfishness:* Clarify that "rational" means "responding to incentives," not "being a jerk."
      *   *Inevitability:* Address when introducing governance. Show the math changes if rules exist.
      *   *Commons Definition:* Address when contrasting Open Access vs. Managed.
      *   *Privatization/State:* Address when discussing solutions. Show peer-governance as a third option.
      *   *Depletion vs. Free-riding:* Address during the "Two Failures" section.

  6.  **Developing the Final Question:**

      *   Needs to test structure, not memory.
      *   "If we add a rule, does the tragedy happen?" (Too simple).
      *   "Is this a tragedy of the commons or a tragedy of no rules?" (Better).
      *   *Idea:* Present a scenario where people are nice but the structure is bad, vs. people are selfish but structure is good.
      *   *Selected:* "If everyone in the room promised to be perfectly honest and kind, but the data plan had no cap and no monitoring, would the problem disappear? Why or why not?" (Tests if they see the structural lack of limits vs. moral character).
      *   *Actually, better:* "Imagine a resource where everyone follows the rules perfectly, but there are no rules. Is that a commons?" (A bit abstract).
      *   *Let's try:* "We have a shared resource. It is running out. Is the solution to find nicer people, or to change who decides how much is taken? How do you know?"

  7.  **What to Decline:**

      *   Don't solve the whole world's problems.
      *   Don't define "property rights" legally.
      *   Don't get into complex Game Theory matrices (Prisoner's Dilemma payoffs).
      *   *Statement:* "We aren't solving climate change today; we are learning how to look at the problem."

  8.  **Refining the Plan (Self-Correction/Review):**

      *   *Constraint Check:* "Do not explain the tragedy of the commons to me." (Understood).
      *   *Constraint Check:* "Avoid the word 'institution' more than once." (Noted).
      *   *Constraint Check:* "One example." (The Family Data Plan).
      *   *Constraint Check:* "Two ideas woven in." (Open Access vs. Managed; Depletion vs. Free-riding).
      *   *Tone:* Respectful of Year 12 leader, accessible for Year 10s.
      *   *Time:* 30 minutes is tight. Need to be punchy.
      *   *Whiteboard:* Use it for the arithmetic.

      *   *Wait, one nuance on the Example:* The prompt asks for *one* example to carry *both* failures (depletion and letting others pay).
      *   *Data Plan:*
          *   Depletion: Using GBs.
          *   Paying: Splitting the bill.
          *   *Critique:* Usually, if you don't pay, the service cuts off (excludable). To make it a "commons" problem, access must be non-excludable *once provided*.
          *   *Fix:* The password is shared. One person pays the bill. Everyone has the password.
          *   *Scenario:* 4 friends. One pays £40. Everyone gets the password.
          *   *Failure 1 (Depletion):* One person downloads games, slowing it down/using cap for others.
          *   *Failure 2 (Payment):* Everyone expects the one person to keep paying.
          *   *This works.*

      *   *Refining the "Commons" distinction:* Hardin's "Commons" = Open Access. Ostrom's "Commons" = Common Property Resource (with rules). I need to make sure the audience sees that the "Tragedy" happens in *Open Access*, not necessarily in *Common Property*.
      *   *How to show this on the board?*
          *   Column A: No Rules (Open Access). Result: Ruin.
          *   Column B: Agreed Rules (Managed). Result: Sustainability.
          *   Label both "Shared Ownership." Show the outcome differs based on *rules*, not ownership.

      *   *Misconception Check:* "Rationality = Selfishness."
          *   Need to explain "Rational" as "doing what makes sense for you given the rules." If the rule is "take what you want," taking a lot is rational. If the rule is "take 1GB max," taking 1GB is rational.

      *   *Final Question:* Needs to be sharp.
          *   "If I tell you a resource is shared, what is the *first* question you should ask me before predicting it will be ruined?"
          *   Answer: "Are there rules?" or "Who decides?"

  9.  **Final Polish:** Check against the "plain language" constraint. Avoid "negative externalities," "non-excludability," "rivalry." Use "subtractable," "hard to keep people out," "costs/benefits."

      *(Self-Correction on Example)*: The Data Plan is good, but is it *too* abstract for "depletion"? Bandwidth is invisible.
