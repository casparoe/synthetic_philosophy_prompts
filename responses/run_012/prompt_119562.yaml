  ### Prose Mapping

  **Total Lines:** 36 (Unit $x=4$).
  **Proportions:** 4 : 8 : 8 : 16 (Segments 1 : 2 : 3 : 4).
  **Movement 1 (Eikasia, 4 lines):** Focuses on the shadows on the cave wall. The voice is plural ("We"), trapped in the belief that the silhouette is the substance.
  **Movement 2 (Pistis, 8 lines):** Focuses on the physical objects (puppets/fire) casting the shadows. Rhyme scheme: AABB CCDD. Movement is upward from image to object.
  **Movement 3 (Dianoia, 8 lines):** Focuses on the geometric figures used as hypotheses. Rhyme scheme: DDCC BBAA. This reverses the rhyme scheme of Movement 2, creating an audible mirror. The syntax parallels Movement 2 but the logical vector moves from borrowed figure to intelligible principle.
  **Movement 4 (Noesis, 16 lines):** Focuses on the Sun and the Good. It returns to the image of Movement 1 (the shapes on the stone) to reveal them as likenesses of the light. It ends with the philosopher's descent and the threat of violence. It names "the Good" once.

  ***

  ### The Ascent and Return

  We named the shapes that passed upon the stone,
  Convinced the dark was all that could be known.
  A bird, a jar, a hand held up to see,
  We swore the silhouette was reality.

  The shadow grew from wood and painted wing,
  The jar was clay, the hand a physical thing.
  We turned from wall to witness what was cast,
  The solid source that made the darkness pass.
  No longer slaves to profiles on the gray,
  We touched the objects that decreed the day.
  The fire burned above the low wall's edge,
  And pulled us upward from the prison ledge.

  We stepped beyond the low wall's edge,
  To stand upon a higher, mental ledge.
  No longer bound by objects of the day,
  We sought the laws that decreed the gray.
  We turned from sand to witness what was cast,
  The logical source that made the diagram pass.
  The truth grew clear in line and painted wing,
  And gave the borrowed shape a living thing.

  Now light itself revealed the wall as glass,
  Where shadows played and let the moments pass.
  Those shapes we named upon the stone below,
  Were likenesses of what we now behold.
  The sun is but a child of greater fire,
  That burns beyond all sight and all desire.
  It is the Good that gives the truth its power,
  The source of being in every single hour.
  But sight returns to darkness as a debt,
  A duty those who know must not forget.
  I walk back down the rough and stony track,
  With blinding light still burning on my back.
  The prisoners watch me stumble in the dust,
  Their eyes full of suspicion and of lust.
  They say my vision failed, they say I blind,
  They kill the man who leaves the cave behind.

  ***

  ### Note to Students

  The architecture of this poem is the argument. The four movements correspond to the four segments of the Divided Line, with line counts in the ratio 1 : 2 : 2 : 4 (4, 8, 8, 16 lines). This ensures that the fourth movement (Noesis) occupies half the poem, just as the Intelligible realm occupies the upper half of the Line.

  Notice the mirror structure in the middle. Movements 2 and 3 are equal in length (8 lines), representing the equal ratio of the middle segments. However, they are built as acoustic mirrors: the rhyme scheme of Movement 2 (AABB CCDD) is exactly reversed in Movement 3 (DDCC BBAA). This chiastic structure allows the ear to register the continuity between belief and reasoning while marking the turn from the visible to the intelligible.

  Finally, Movement 4 returns to the imagery of Movement 1 (the shapes on the stone), fulfilling the dialectical requirement to explain the lower segments from the perspective of the highest principle. The poem ends not in the light, but in the descent, acknowledging the *Republic's* insistence that the philosopher must return to the cave, despite the danger.
