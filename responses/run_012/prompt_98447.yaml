  **Foreword from the Registrar**

  Welcome to the Department of Vehicular Consistency. This handbook governs travel on Route Pi. Compliance is mandatory. Safety is defined as adherence to optimal policy, not arrival speed. Do not attempt to navigate using intuition. Intuition is not admissible evidence in collision court. Many drivers attempt to optimize locally, believing they can change their minds en route. This is prohibited. Your license depends on accepting uncertainty and binding your future actions. Read carefully. This document is laminated for durability.

  **Chapter One: You Do Not Know Where You Are**

  Route Pi contains two intersections. They are identical. Steel, concrete, and lighting are standardized per Municipal Code 77-B. You will not know if you are at the first or second intersection. This is not a visibility issue. It is a jurisdictional stipulation designed to prevent lane-discrimination lawsuits. Attempting to identify your location constitutes a Class C infraction. You begin at the start. You encounter an intersection. You may exit or continue. If you continue, you encounter another identical intersection. Then the highway ends. Do not ask dispatch for clarification.

  **Chapter Two: The Tempting Method, and Why It Fails**

  Drivers often think: "At the first, I continue. At the second, I exit." Exit One pays 0. Exit Two pays 4. Ending pays 1. This plan yields 4 units. It is impossible. You cannot execute conditional plans requiring location data you do not possess. If you decide "Exit here" at any intersection, you must exit at *both*, because "here" feels the same both times. If you plan to exit only at the second, you will inevitably exit at the first, scoring 0. Local optimization ignores that your current decision dictates your past action's outcome. You are the same agent at both nodes.

  **Chapter Three: Your Policy**

  You must adopt a mixed strategy. At any intersection, exit with probability 33.3%. Continue with probability 66.7%. Use a certified randomizer or pre-rolled dice kept in the glovebox. Do not recalculate upon arrival. Recalculating implies you know where you are. By binding yourself to a fixed probability, you maximize expected utility to 1.33 units. Always continuing yields only 1 unit. Commitment yields value. Freedom yields crashes. Trust the policy, not the moment. Your future self is not to be trusted with discretion. Rolling a 1 or 2 means exit.

  **Chapter Four: Objections You Will Raise, In Order**

  "Why not install signs?" Signs are prohibited under the Indistinguishability Act. Distinct markers create unequal exit opportunities. "Why not count miles?" Odometers are sealed by the manufacturer. "Why bind myself?" Because Future You is a stranger who faces the same confusion. If you trust Future You to exit only at the end, Present You must continue. But Future You will reason identically and exit early. You must constrain Future You now. This is not oppression; it is coordination across time. We recommend this level of vigilance. Some drivers contract their own birthdays. Compliance officers monitor randomization logs.

  **Chapter Five: Questions from the Written Examination**

  1. What is the mandated exit probability? (A) 100% (B) 33.3% (C) 0%. Answer: B. 2. You see a unique landmark. Do you exit? (A) Yes (B) No (C) Report landmark. Answer: C. 3. Expected payoff of optimal policy? (A) 4 (B) 1 (C) 1.33. Answer: C. 4. Can you update your belief after passing the first exit? (A) Yes (B) No. Answer: B. You never know if you passed it. Failure to memorize these values results in automatic disqualification. Good luck.

