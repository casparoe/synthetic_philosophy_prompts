          *   At Intersection 2 (reached with prob $1-p$): Exit (Payoff 4) with prob $p$. Continue (Payoff 1) with prob $1-p$.
          *   Total Expected Value $V = p(0) + (1-p)[p(4) + (1-p)(1)]$.
