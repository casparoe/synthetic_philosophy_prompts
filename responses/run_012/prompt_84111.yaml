  **2. The Mathematical Stability Requirement:** The theory must accommodate necessary truths unknown to us.
  *Motivation:* Goldbach's Conjecture. I can conceive it's false. If C→P holds naively, math is contingent. The theory must explain why arithmetic conceivability doesn't yield metaphysical possibility unless proven consistent.

  **3. The Psychological/Modal Distinction:** It cannot collapse conceivability as an episode in someone's head with conceivability as an epistemic status.
  *Motivation:* Cognitive limitation. "I can't imagine how this could be false" vs "this couldn't be false." The theory must treat conceivability as evidence-based, not a phenomenological snapshot. A 1000-sided polygon is possible even if I can't visualize it.

  **4. The Ontological Inflation Constraint (The Rock Case):** The theory must prevent conceivability from generating gratuitous ontology.
  *Motivation:* Your roommate's rock. She conceives of a "quiddity" (extra intrinsic property) with no causal power. You can conceive of one, two, or infinite. If C→P holds, reality is infinitely cluttered.
  *Verdict:* That is a **real problem**, not confusion. It demonstrates that conceivability without structural constraints overgenerates possibilities. A robust theory must deny that such "cambridge properties" are ideally conceivable or impose a parsimony principle that overrides mere conceivability.

  **Incompatible Requirements:**
  1.  **Accessibility:** Conceivability must be checkable by ordinary introspection (otherwise it's useless to humans).
  2.  **Idealization:** Conceivability must be proof against further rational reflection (to handle Kripke cases).
  *Tension:* Humans aren't ideal reasoners. If the standard is ideal, we never know if we've met it. If the standard is introspective, we get false positives (water isn't H2O).

  **The Knockout:**
  The **Non-Identity Constraint** (handling necessary a posteriori truths) knocks out the most popular version: *Naive Conceivability*. The view that "what seems possible is possible" dies instantly against "Water = H2O." Only *Ideal* Conceivability survives, but it risks becoming vacuous.

