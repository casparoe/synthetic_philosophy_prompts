      *   *Move 3:* Almost never is not never. Mature view permits resistance by public authority. Distinction between defect of title and abuse explains early text. Two can be reconciled.
          *   *Verdict:* Partly right. The distinction is valid. Reconciliation is possible if one sees the community as the public authority in the case of usurpation.
      *   *Move 4:* *Summa* says if tyranny excessive, tyrant guilty of sedition, resisting not sedition. Gives moral permission to resist. Question is who. Aquinas is constitutionalist about resistance, not quietist.
          *   *Verdict:* Clearly right. This captures the nuance best. He is not a quietist (Ines's implication) nor a proponent of private assassination (common misreading).

  5.  **Synthesize and Adjudicate:**
      *   **Core Dispute:** Is Aquinas a consistent opponent of tyrannicide (Ines) or does he allow it under conditions (Marcus)? And do the texts reconcile via the usurpation distinction?
      *   **My Expert View:** Aquinas's mature view (Summa/De Regno) strongly disfavors private killing. The *Sentences* view is often seen as softened. The distinction between usurper and abuser is key. A usurper has no title, so the community retains authority to depose. An abuser has title, so only a superior can depose. Private individuals generally cannot act alone. Ines is right that private assassination is rejected in mature works. Marcus is right that resistance is permitted and not sedition, and that public authority can kill. The reconciliation lies in who holds "public authority" when a usurper takes over (the community).
      *   **Verdict:** Ines is right on the prohibition of *private* killing in mature texts. Marcus is right on the permission of *public* resistance and the non-seditious nature of opposing tyranny. Ines is too strong on "consistent opponent" (ignoring the public authority exception). Marcus is too loose on "allows tyrannicide" (ignoring the strict agency constraints).
      *   **Reconciliation:** The texts can be reconciled if one understands that in the case of usurpation, the "public authority" devolves to the community, whereas in the case of abuse by a legitimate ruler, only a superior has authority. The *Sentences* permission for killing a usurper is not necessarily "private" in the sense of random individuals, but acts on behalf of the community. However, the *De Regno* caution suggests even this is risky.
      *   **What they miss:** Both miss the ecclesiological dimension (the Pope's role in deposing kings) and the nuanced definition of "public authority" (which isn't just the king, but the community acting collectively). Ines misses the legitimacy of resistance. Marcus misses the strictness of the agency constraint.

