answer: |-
  The debate between Ines and Marcus touches upon one of the most contentious issues in Thomistic political philosophy, namely the permissibility of removing a tyrant. To adjudicate this exchange properly, one must distinguish between the moral evaluation of tyranny, the definition of sedition, and the agency authorised to enact resistance. Ines begins by asserting that Aquinas is a consistent opponent of tyrannicide, claiming that the Summa Theologiae treats sedition as always a mortal sin and that killing a tyrant constitutes a seditious act. This claim is clearly mistaken regarding the definition of sedition. In the Summa, Aquinas explicitly states that a tyrannical regime is not just because it is ordered to the private good of the ruler rather than the common good. Consequently, disturbing such a government does not have the character of sedition, unless the resistance is disordered and causes greater harm to the community than the tyranny itself. Ines is partly right, however, in noting that On Kingship warns against private individuals killing tyrants and suggests bearing tolerable tyranny to avoid worse outcomes. Her error lies in conflating the sin of sedition with the act of resisting tyranny, which Aquinas carefully distinguishes.

  Marcus replies by correcting the definition of sedition, noting that Aquinas says disturbing a tyrannical government is not sedition because the tyrant fosters discord. This claim is clearly right and accurately reflects the text of the Summa Theologiae. Marcus further claims that while private individuals are forbidden from assuming public authority, resistance as such is not forbidden, and he cites the Commentary on the Sentences where killing a usurping tyrant is called praiseworthy. This is partly right. He is correct that resistance is permitted and that the Sentences passage exists, but he risks overstating the case by suggesting Aquinas allows tyrannicide under some conditions without immediately qualifying that the mature works heavily restrict the agency involved. Marcus is right to identify that the prohibition is on private usurpation of authority, not on resistance per se, but his phrasing might imply a broader licence than Aquinas intends in his mature work.

  Ines answers by characterising the early text as an outlier and arguing that the mature view in On Kingship repudiates assassination in favour of public deposition or recourse to God. This claim is partly right. It is widely accepted among scholars that the mature Aquinas is more cautious than the younger commentator on the Sentences, and On Kingship does emphasise the danger that the remedy may be worse than the disease. However, Ines is partly mistaken to dismiss the early text entirely as an outlier without attempting reconciliation, as the distinction between types of tyrants remains relevant. She is clearly right that the Summa restricts the action to public authority, which effectively bans what is commonly meant by tyrannicide, namely private assassination. Her insistence that Marcus conflates public resistance with tyrannicide is a strong point, as the term tyrannicide often carries the connotation of private murder in this context.

  Marcus counters that public deposition can involve killing and that the principle is never kill a tyrant without public authority, not never kill a tyrant at all. This is clearly right. He also invokes the distinction between a tyrant by usurpation and a tyrant by abuse of power, suggesting that for a usurper, private killing may be permitted because there is no legitimate authority to appeal to. This claim is partly right. The distinction is authentic to Aquinas, but the permission for private killing of a usurper is prominent in the Sentences and becomes more ambiguous in the Summa and On Kingship, where the emphasis shifts to public authority even in cases of usurpation, understood as the community acting collectively. Marcus is correct that this represents a development or specification rather than a simple retraction, but he must acknowledge the increased restrictiveness of the later works.

  Ines replies that the later works are more restrictive and that the Summa says it is not the business of private individuals to overthrow a tyrant, full stop. This is clearly right regarding private individuals. She also notes that On Kingship says public deposition is dangerous and should be a last resort, which is clearly right. Her conclusion that the mature view is a principled rejection of private tyrannicide is clearly right. She argues that Marcus's reconciliation makes the view depend on a controversial theory of legitimacy, asking who counts as public authority if a usurper is in power. This is a strong challenge, but it is partly right to say this is a substantive change; it is more accurately a clarification of where authority resides when title is defective. Ines is correct that the Summa mentions recourse to God for excessive tyranny, but she overlooks that this does not preclude human action via public authority.

  Marcus comes back to argue that almost never is not never and that the mature view still permits resistance by public authority. This is clearly right. He reiterates that the distinction between defect of title and abuse of power explains the texts, suggesting the later works focus on the case where the tyrant has some title. This is partly right and represents the standard scholarly reconciliation. He argues the two can be reconciled, which is a defensible position. Ines answers that the Summa exception for excessive tyranny still says recourse to God, not to the knife, and that the later view is a principled rejection of private tyrannicide. This is partly right; while recourse to God is mentioned, public authority is also permitted to act, so it is not solely divine intervention. Her claim about the rejection of private tyrannicide is clearly right.

  Marcus concludes that the Summa gives a moral permission to resist because the tyrant is guilty of sedition, and that Aquinas is a constitutionalist about resistance, not an absolute pacifist. This is clearly right and captures the nuance best. Ines is right that private assassination is forbidden, but wrong that Aquinas is a quietist. Marcus is right that Aquinas allows resistance, but must concede that private tyrannicide is effectively banned in the mature corpus.

  Regarding the reconciliation of the texts, the distinction between a tyrant by defect of title and a tyrant by abuse of power does allow the early and later texts to be reconciled, provided one understands public authority correctly. In the case of a usurper, the community retains the authority to depose, which might look like private action but is technically public action by the body politic. In the case of a legitimate ruler who abuses power, only a superior authority can depose. The later texts do represent a development insofar as they emphasise the risks and restrict private initiative more heavily than the Sentences, but they do not contradict the fundamental principle that authority derives from the common good. Therefore, Marcus is right that the texts are reconcilable, but Ines is right that the later view is more restrictive on private agency.

  The principle that best captures Aquinas's considered view is that resistance to tyranny is morally permissible and not seditious, but the agency of resistance must be public, not private. Private individuals may not take the law into their own hands, but the community or its representatives may depose a tyrant, lethally if necessary, provided the common good is served and greater evils are not incurred. Ines is right about the prohibition of private assassination, while Marcus is right about the permission of public resistance.

  Both students miss the ecclesiological dimension of Aquinas's thought, specifically the role of the Pope in deposing kings who abuse power, which provides a mechanism for public authority in cases where no secular superior exists. They also both overlook the nuanced definition of the community as the repository of authority when title is defective, which bridges the gap between private action and public authority. Ines misses the legitimacy of resistance entirely, leaning towards quietism, while Marcus misses the strictness of the agency constraint, leaning towards permissivism. The verdict is that Aquinas is neither a proponent of private tyrannicide nor a quietist, but a constitutionalist who locates the right of resistance in the public authority of the community.
