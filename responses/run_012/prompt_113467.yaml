      *   *Move 4:* Reconciliation makes view depend on controversial theory of legitimacy. *Summa* says recourse to God for excessive tyranny. Later view is principled rejection of private tyrannicide.
          *   *Verdict:* Partly right. She is right that the later view rejects *private* tyrannicide. She is right that *Summa* mentions recourse to God. But she overlooks that "public authority" can emerge from the community.

  4.  **Evaluate Marcus's Moves:**
      *   *Move 1:* *Summa* says tyrannical government not just, disturbing it not sedition. Forbids private individuals taking public role, but does not forbid resistance as such. *Sentences* says killing usurping tyrant praiseworthy. Aquinas allows tyrannicide under some conditions.
          *   *Verdict:* Partly right. He is right about the *Summa* on sedition. He is right about the *Sentences*. But saying Aquinas allows "tyrannicide" without qualifying "by public authority" is misleading, as "tyrannicide" usually implies assassination by private hands in this context.
