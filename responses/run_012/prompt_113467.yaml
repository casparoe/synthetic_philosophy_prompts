          *   *De Regno (On Kingship)* (Middle/Late): Book I, Chapters 6-7. Warns against private killing, suggests public authority or God. Warns of worse successors.
          *   *Summa Theologiae* (Late): II-II, Q. 42, A. 2 (Sedition); Q. 64, A. 3 (Killing sinners). Treats sedition as sinful but says tyrannical regime is not just, so disturbing it isn't sedition. Emphasizes public authority.
      *   **Key Distinctions:**
          *   Tyrant by usurpation (defect of title) vs. Tyrant by exercise (abuse of power).
          *   Private individual vs. Public authority.
          *   Sedition vs. Resistance.
      *   **Scholarly Consensus (General):** Aquinas generally opposes private tyrannicide. He allows for public deposition. The *Sentences* passage is often seen as an early view that gets qualified or restricted in later works, though some try to reconcile them via the usurpation distinction. The *De Regno* is very cautious. The *Summa* focuses on the sin of sedition but exempts resistance to tyranny from the label of sedition, while still restricting the *agent* of resistance.

  3.  **Evaluate Ines's Moves:**
      *   *Move 1:* Aquinas is a consistent opponent of tyrannicide. *Summa* treats sedition as mortal sin, killing tyrant is seditious. *On Kingship* warns private individuals must not kill, tolerable tyranny borne.
