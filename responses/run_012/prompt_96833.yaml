  Me and my friend got into a huge arguement last night about global history and I still feel like we weren't even in the same conversation. He's a historian, I'm more into theory, and it started when I said the whole point of global history is to tell the past from everywhere at once, not just from Europe. He said thats impossible: any history told from everywhere at once either collapses into a neutral timeline with no argument, or it secretly picks a center again, just a different one. I said no, you can have histories of connection and entanglement that are told from multiple centers without pretending to be nowhere, and the point is to show how Europe's rise was made in relation to everywhere else, not to swap one master narrative for another. He said thats still a narrative with a standpoint, so its Eurocentrism with better manners. I said a polycentric network isn't the same as a center. He said a network with no center is still a picture, and pictures have viewers. We went around like that for two hours and definately didn't move. I think the real issue is that we're not even disagreeing about the past, we're disagreeing about what a global history is supposed to do, but I can't tell if thats true or if I'm just dodging a factual question about whether there can be a history from everywhere at once. I've started calling it the omniview problem: the demand that the past be tellable from every standpoint at once, not just from a neutral one. Is that demand coherent? And is our fight a substantive disagreement about facts or explanation, a verbal one about the word global, a disagreement about whether any standpoint can be non-partisan, or two people answering different questions under one name? So: why are we stuck, and what kind of disagreement is this really? I want a diagnosis, not a survey. Tell me what each of us is actually committed to, what kind of disagreement this is, and what would count as progress: a distinction, a thought experiment, a concession