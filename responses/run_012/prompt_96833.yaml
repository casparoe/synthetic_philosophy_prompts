  1. The fight as you understand it
  You argue global history should be polycentric: a web of entanglements where Europe's rise is contextualized against multiple simultaneous centers, avoiding a single master narrative. You want relational history, not swapped hegemony. Your friend argues this is epistemologically impossible. He claims any narrative requires a vantage point; claiming "everywhere at once" is either a false neutrality (a timeline without argument) or a disguised particularism (Eurocentrism with better manners). For him, a network diagram still requires a drawer, and a viewer always exists. You see multiple centers as dissolving hierarchy; he sees the claim of multiple centers as hiding the inevitable hierarchy of the narrator. You're fighting over whether "global" describes a method of connection or an impossible claim to omniscience.

  2. The diagnosis
  This is primarily a disagreement about epistemology disguised as a methodological dispute. You are treating global history as a methodological ambition: the attempt to weave multiple situated knowledges into a coherent web. Your friend is treating it as an ontological claim: the assertion that a narrative can exist without a specific locus of enunciation. When you say from everywhere at once, you mean incorporating the logic of multiple centers. He hears from nowhere, which he rightly identifies as the god-trick of false objectivity.

  The hidden question doing the work is: Is history a map or a view? You are arguing for a map, a structure where relationships exist independently of the viewer. He is arguing for a view, a picture that necessarily implies a viewer. This is why you talk past each other. You are defending the possibility of polycentric content, facts of connection. He is attacking the impossibility of polycentric form, the narrative structure itself. He is correct that the book sits on a shelf in a specific language, written by a specific person. You are correct that the subject matter exceeds that single location.

  This is also a clash of standards. For you, success is measured by how well the narrative destabilizes European exceptionalism through relational data. For him, success is measured by intellectual honesty regarding the historian's situatedness. He suspects your network is just a complex way of smuggling in a Western theoretical framework, since network theory itself is culturally situated, while pretending it is neutral. You suspect his insistence on a single standpoint is a conservative gatekeeping mechanism that protects traditional narrative structures from complexity. This mutual suspicion prevents trust. He sees your method as dishonest; you see his method as exclusionary.

  Ultimately, this is substantive, not merely verbal. You disagree on whether complexity can be represented without reduction. He believes representation always reduces to a standpoint; you believe representation can model multiplicity. The omniview problem you identified is real: it is the tension between the ethical demand to include everyone and the logical impossibility of speaking for everyone. You are arguing about whether that tension is a productive engine for history or a fatal flaw. He thinks it is a fatal flaw; you think it is the defining challenge. Neither of you is wrong about the facts; you are wrong about what the other is claiming. You think he wants single-story history; he thinks you want impossible history. The fight persists because you are optimizing for different virtues: you for inclusivity of structure, he for honesty of position.

  3. What would count as progress
  Progress requires abandoning the phrase "from everywhere at once." It is rhetorical poison. You should concede that no narrative is truly omniview; instead, argue for multivocal history, where the standpoint shifts explicitly between chapters or sections. He should concede that a network model isn't necessarily crypto-Eurocentric if it reflexively acknowledges its own construction. A productive thought experiment would be: Can we write a history where the narrator's position is as much a part of the data as the events? If you both agree that the goal is not omniscience but reflexive connectivity, the fight dissolves. You stop claiming to see everything; he stops accusing you of hiding where you stand. The disagreement shifts from "Is this possible?" to "How do we best signal our limitations?" If he insists that any synthesis is betrayal, or you insist your synthesis is pure, nothing will move. You must agree that all history is a construction, but some constructions are more honest about their scaffolding than others. Specifically, you need to reframe your "omniview" not as a achieved state, but as a regulatory ideal that guides method without claiming completion.

  4. Bottom line
  You are fighting over whether history can model complexity without lying about its own standpoint. You need to agree that "global" means reflexive connection, not omniscient view, or you will never stop talking past each other.
