answer: |-
  The session must establish that rationality forbids playing strategies strictly dominated by mixtures, while demonstrating that weak dominance fails to guarantee a unique solution due to elimination order dependence.

  **The Carrying Example Strategy**
  Your instinct for the 3-strategy game (where one pure strategy is beaten by a 50-50 mix of the other two) is correct for the first half of the session, but you cannot use a single game for the whole 75 minutes. A matrix complex enough to demonstrate mixed dominance is computationally heavy; if you also try to force weak-dominance order dependence into that same matrix, you will spend 50 minutes on arithmetic and zero minutes on philosophy. Use your 3-strategy example for the mixed-dominance lesson, then switch to a canonical 2x2 weak-dominance game for the order-dependence lesson. Do not use Prisoner's Dilemma (too simple, no mixed dominance) or Matching Pennies (no dominated strategies).

  **Session Sequence (75 Minutes)**

  **0–10: Definitions and Stakes**
  Define strict vs. weak dominance formally using expected utility. State the Rationality Principle: *It is irrational to play a strictly dominated strategy.* Explicitly state that "strategy" includes mixed strategies. Do not prove the order-independence theorem for strict dominance; assert it as a known result so you can focus on the counter-case for weak dominance later.

  **10–40: The Mixed Dominance Lesson (Your 3-Strategy Game)**
  Present a 2-player game where Row has strategies T, M, B and Column has L, R. Set payoffs so B yields (1, 1) against both L and R, while T yields (2, 0) and M yields (0, 2).
  *   **The Move:** Ask students if B is dominated by T or M individually (no). Then ask if it is dominated by a mixture. Walk through the EU calculation: $0.5u(T) + 0.5u(M)$ yields (1, 1), which equals B, so tweak payoffs slightly (e.g., T=(3,0), M=(0,3)) so the mix yields (1.5, 1.5), strictly beating B.
  *   **Head Off Misconception 1 ("Mixture is Average"):** At minute 20, when a student objects that a mix can't beat its components, stop and write the EU inequality on the board. Show that dominance compares the *weighted sum* of payoffs against the opponent's strategies, not the strategies against each other. The mixture creates a new payoff vector that sits "above" the pure strategy in the geometry of outcomes.
  *   **Iterate:** Once B is eliminated, ensure the remaining 2x2 allows for further elimination (e.g., Column now has a dominated strategy) to show the "Iterated" part of IEDS.

  **40–60: Weak Dominance and Order Dependence (Switch Games)**
  Switch to a simple 2x2 or 3x3 matrix specifically designed for weak dominance order dependence (e.g., a game where eliminating Player 1's weakly dominated strategy first leaves a different survivor than eliminating Player 2's first).
  *   **The Move:** Run the elimination twice on the board, changing only the order. Show that Set A $\neq$ Set B.
  *   **Head Off Misconception 2 ("Survivors are Rational"):** At minute 50, when students assume the remaining strategy is "the rational choice," challenge them: *If rationality is a logical constraint, how can two valid logical paths yield different results?* Use this to distinguish between *strict* dominance (robust, order-independent) and *weak* dominance (fragile, order-dependent). Explain that weak dominance assumes trembles or lexicographic preferences to be compelling, whereas strict dominance does not.

  **60–75: Implications and Closing**
  Briefly connect IEDS to Common Knowledge of Rationality (CKR): IEDS works only if I know you are rational, you know I know, etc. Do not dive into epistemic logic proofs.

  **Closing Question**
  Pose this orally and require a show of hands followed by one volunteer justification:
  *"If two rational agents apply IEDS using weak dominance to the same game but eliminate strategies in different orders, arriving at different unique outcomes, has one of them made a reasoning error?"*
  (The correct answer is "No," which forces them to acknowledge that weak dominance does not identify a unique rational solution, unlike strict dominance.)

  **What to Cut If Running Long**
  1.  **Nash Equilibrium:** Do not define it or relate it to IEDS survivors; it is a distinct solution concept that will confuse the dominance logic.
  2.  **Formal Proofs:** Do not prove why strict dominance is order-independent; state it and move to the weak dominance counter-example.
  3.  **Extensive Form:** Stick strictly to normal-form matrices; converting between forms eats time.
  4.  **CKR Nuance:** Mention Common Knowledge of Rationality as the engine of iteration, but do not analyze the epistemic conditions required for each round.
