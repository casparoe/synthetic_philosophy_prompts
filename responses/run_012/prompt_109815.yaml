prompt: |-
  I'm leading the third meeting of a small reading group (six of us: two philosophy grad students, a composer, a couple of programmers, and a retired engineer who asks the best questions) and next session is my turn to present tangled hierarchies and the inviolate level. The group has all seen the Escher print where the two hands draw each other on a sheet of paper -- it's on my slide already -- and most of them have heard the phrase "strange loop" somewhere, but that's the whole of it. I've got an hour, a whiteboard, and no reading to assign. Don't explain the idea to me; I know roughly what I think it is. Plan how I should explain it to them: what has to be in place before the idea lands, the order the pieces go in and why each one depends on the last, and the one example that should carry the whole hour. Here's my worry about the example: I was going to use constitutional amendment clauses -- a rulebook that contains the rule for changing the rules -- or a company policy that governs how policies get changed, but I keep feeling that these smuggle in the answer, because in every real case there's an obvious outside authority (a court, a board, a founder) sitting above the loop, so the "inviolate level" ends up just being "whoever has power," which is a boring answer and probably the wrong one. So if you think that example can be rescued, say how; if not, give me one that can carry the distinction without collapsing into the outside-authority reading, and tell me what it has to have and what it has to lack.

  Also I want to teach a distinction I might be inventing, so tell me if it's real: between a loop that closes at one level (a sentence that talks about sentences, a program that reads its own source, a thermostat) and a loop that crosses levels (a rule about rules, a picture of a picture being made) -- is that a genuine difference with teeth, or am I just dressing up "self-reference" in fancier clothes? And the misconception map, please, with where in the sequence I head each one off: I'm expecting at least (a) "so it's basically feedback, like a thermostat," (b) "the inviolate level is God / the outside observer / a mystical meta-level," (c) "if the hierarchy is tangled then the levels were arbitrary all along, it's levels all the way down, anything goes," and (d) "the Escher drawing is an impossible picture" -- it's obviously not, it's a perfectly good picture of an impossible *scene*, and I want to know whether that distinction does any work for us or is just a cute aside. Then tell me what I should openly refuse to explain at this level and say so out loud, and give me one question to put to the room at the end that would show whether they can now *use* the idea -- find the tangle in a fresh case and name the level from which it stops being a paradox -- rather than just nod along.
