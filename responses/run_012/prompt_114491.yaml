  # Joint Statement on Letter Identity (The 'a' Protocol)

  **Signatories:** The Structural-Core Working Group & The Systemic-Resemblance Working Group
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Ontology of Glyph Identity

  ### Section 1: Agreed Claims

  1.  **Functionality Priority:** We agree that the primary function of a letterform is legibility within a linguistic system; if a shape cannot be reliably mapped to a phonemic or graphemic value by a competent reader, it fails to be a letter regardless of its geometry or intent.
  2.  **Validity of Variants:** We agree that both single-story (ɑ) and double-story (a) forms are fully valid instances of the letter 'a' in standard Latin orthography; neither is the "true" 'a' to the exclusion of the other.
  3.  **Stylistic Elasticity:** We agree that extreme stylistic distortions (e.g., Blackletter, Graffiti) do not negate letter identity provided the reader can recover the intended value through convention and context.
  4.  **Intentionality:** We agree that a child's first handwritten 'a' counts as an 'a' despite geometric imperfection, because the producer's intent aligns with the cultural category of 'a'.
  5.  **Contextual Dependency:** We agree that in specific cases (e.g., a wordmark where 'a' is a circle with a tail), surrounding letters ('p', 'p', 'l', 'e') can force a reading of 'a' that the shape alone would not sustain in isolation.
  6.  **Continuity of Identity:** We agree that in a variable font morphing continuously from double-story to single-story, there is no single frame where the letter ceases to be an 'a' and becomes something else; identity persists through the transformation.
  7.  **Contrast Requirement:** We agree that an 'a' cannot be identical to an 'o', 'd', or 'e' within the same typeface system; distinctness from neighbors is a prerequisite for function.
  8.  **Cognitive Reality:** We agree that letter recognition is a cognitive act, not merely a retinal one; the "letter" exists in the interaction between mark and mind, not solely in the vector outline.
  9.  **Historical Constraint:** We agree that current letter identity is constrained by historical lineage; a shape cannot be an 'a' if it has no genealogical or conventional link to the Latin alphabet's history of 'a' forms.
  10. **The "Spirit" Constraint:** We agree that a typeface must maintain a consistent "spirit" or style across all characters, and that the 'a' must harmonize with the 'b', 'c', and 'd' of its own family, even if we disagree on what defines that harmony.

  ### Section 2: Disagreements Table

  | Question | Structural-Core Wording (Essentialist) | Family-Resemblance Wording (Systemic) |
  | :--- | :--- | :--- |
  | **1. Necessity** | There exists a topological invariant (e.g., a closed counter with an attached vertical or arch) that is a *necessary condition* for any shape to be an 'a'. | There are no necessary geometric conditions; 'a' is a cluster of overlapping similarities where membership is a matter of degree, not binary rules. |
  | **2. Portability** | A glyph's identity is intrinsic to its shape; if it is an 'a' in Font A, it remains an 'a' when transplanted into Font B, regardless of how it contrasts with Font B's other letters. | A glyph's identity is relational; a shape can function as an 'a' in Font A but fail to be an 'a' in Font B if it loses contrast against Font B's 'o' or 'd'. |
  | **3. Degeneracy** | A letter dies when it loses its essential structural feature (e.g., if the bowl opens completely, it becomes a 'u' or 'c', regardless of context). | A letter dies when it loses its differential value (e.g., if it looks too much like its neighbors in that specific system, it ceases to function as 'a'). |
  | **4. The Wordmark** | In the "circle with a tail" case, the shape is technically a symbol *substituting* for 'a', not a genuine instance of the letter category itself. | In the "circle with a tail" case, the shape *is* an 'a' because categorization is determined by functional role within the specific word-context. |

  ### Section 3: Cruxes and Tests

  **Crux 1: Necessary Conditions vs. Gradient Membership**
  The first fundamental divide is whether the category 'a' is defined by a checklist of features or by a gravitational pull toward a prototype. We agree this can be tested via the **"Vanishing Feature" Experiment**. We will generate a sequence of images where a standard double-story 'a' gradually loses its closed counter, opening until it resembles a 'u'.
  *   **Structural-Core Prediction:** There is a specific threshold where the counter opens, and at that precise moment, the object ceases to be an 'a' universally, regardless of the font it is placed in.
  *   **Family-Resemblance Prediction:** There is no universal threshold; the point at which it stops being an 'a' will shift depending on the weight and width of the surrounding letters (e.g., it can remain an 'a' longer if the 'u' in that font is very wide).

  **Crux 2: Intrinsic Shape vs. Systemic Role**
  The second divide is whether identity is fixed by the shape alone or by the shape's role in a system. We agree this can be tested via the **"Transplanted Glyph" Experiment**. We will take a borderline 'a' from a wide font (where it contrasts well with 'o') and place it into a narrow font where its width is nearly identical to that font's 'o'.
  *   **Structural-Core Prediction:** Readers will still identify it as an 'a' (perhaps as a "stylistic anomaly") because its internal geometry (stem, bowl) has not changed.
  *   **Family-Resemblance Prediction:** Readers will fluctuate between reading it as 'a' or 'o', or deem it an error, because its *value* in the new system is ambiguous; the system overrides the shape.

  ### Section 4: Merely Verbal?

  **Verdict: No, this is not merely a verbal dispute.**
  While both sides use the word "is" (e.g., "This *is* an 'a'"), they are making different empirical claims about how human cognition processes symbols. The Structural-Core side claims the brain performs feature detection (identifying invariant geometric primitives), while the Family-Resemblance side claims the brain performs contextual embedding (identifying relational differences). This distinction is falsifiable via neuroimaging and reaction-time studies on the "Transplanted Glyph" test case. If recognition speed slows significantly when contrast is reduced (even if geometry is preserved), the Systemic view is empirically superior regarding processing; if recognition remains fast until geometry breaks, the Structural view is superior. Because the two positions predict different outcomes for edge-case legibility and AI training data classification, the dispute is substantive, not semantic.
