      *   *Family Resemblance (Wittgensteinian/Systemic):* Focuses on usage, context, contrast. An 'a' is an 'a' because it plays the role of 'a' in this specific alphabet.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find common ground. Both sides agree that *something* makes an 'a' readable. Both agree context matters *to some degree*. Both agree extreme deviations break legibility.
      *   *Cases to cover:*
          *   Single vs. Double story: Both are 'a's.
          *   Blackletter/Graffiti: Recognizable but stylized.
          *   Child's 'a': Imperfect but intentional.
          *   Contextual 'a' (circle + tail): Depends on neighbors.
          *   Variable font: Continuity of identity.
      *   *Drafting items:*
          1.  Legibility is the functional goal.
