          9.  Perception is cognitive, not just retinal.
          10. The "spirit" of the letter must survive stylistic change.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to phrase the *same* question in two ways that reflect the underlying philosophy.
      *   *Row 1: Necessity.* Is there a feature *all* 'a's share?
          *   Core: Yes, topological invariant.
          *   Resemblance: No, only statistical clustering.
      *   *Row 2: Context.* Can a shape be 'a' in Font A but 'o' in Font B?
          *   Core: No, shape determines identity universally.
          *   Resemblance: Yes, identity is relative to the system.
      *   *Row 3: Degeneracy.* What kills the letter first: losing a feature or losing contrast?
          *   Core: Losing the structural feature (e.g., closing the bowl).
          *   Resemblance: Losing contrast with neighbors (e.g., looking too much like 'd').
      *   *Row 4: The "Spirit".* Is it an internal essence or an external relation?
          *   Core: Internal geometry.
          *   Resemblance: External relational role.

  5.  **Drafting Section 3: Cruxes and Tests:**
      *   *Crux 1: Necessary Conditions vs. Gradients.*
          *   *Test:* The "Ambiguous Glyph" test. Create a shape exactly halfway between 'a' and 'o'.
          *   *Prediction (Core):* It is neither; it fails the necessary condition.
          *   *Prediction (Resemblance):* It is both/neither depending on the surrounding font weights.
      *   *Crux 2: Intrinsic Shape vs. Systemic Role.*
          *   *Test:* The "Transplanted Glyph" test. Take a specific 'a' from Font A and put it into Font B where it resembles 'd' more than 'a'.
          *   *Prediction (Core):* It remains an 'a' because its geometry hasn't changed.
          *   *Prediction (Resemblance):* It becomes a 'd' (or illegible) because its contrast value shifted.
      *   *Crux 3: Continuity.* (Maybe combine with above). Let's stick to the prompt's suspicion: "whether a category needs necessary conditions" and "fixed by shape alone or role".
      *   *Refining Crux 1:* The "Vanishing Feature" test. Morph double-story to single-story. At what point does it stop being 'a'?
          *   Core: Never, as long as the loop remains.
          *   Resemblance: When the community stops accepting it.
      *   *Refining Crux 2:* The "Systemic Override" test. The circle-with-tail case.
          *   Core: It's a symbol standing in for 'a', not truly an 'a'.
          *   Resemblance: It *is* an 'a' because it functions as one.

  6.  **Drafting Section 4: Merely Verbal?**
      *   Is this just semantics?
      *   *Verdict:* No. It has real implications for AI recognition (feature detection vs. contextual embedding) and type design (designing glyphs vs. designing systems).
      *   *Why:* Because they make different predictions about edge cases (the Transplanted Glyph). If it were verbal, they would agree on all observable outcomes. They don't.

