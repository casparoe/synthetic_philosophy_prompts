prompt: |-
  Argue for the following thesis: that the distinction between a moral preference and a moral bias is not a single psychological distinction that better empirical work could draw more sharply, but a shift between two standpoints on a moral outlook — the deliberative standpoint, from which the outlook is the agent's own set of commitments, and the explanatory standpoint, from which it is the output of causes — and that every attempt to fuse the two into one criterion of bias fails in one of two ways: it smuggles the deliberative standpoint back in, or it forfeits the normative force that makes the label worth applying at all.

  Take the following stipulations as fixed and use them throughout. An agent prefers a form of conduct, in the sense at issue, when her attitude toward it is stable under reflection, endorsed by her, and answerable to the moral considerations she acknowledges. She is biased toward a form of conduct when her attitude toward it is produced by something she herself would not count as a moral consideration — disgust, the order in which cases were presented, the identity of the person affected — and would not survive her learning that this was its source. Call this the self-endorsement criterion, and treat it as the criterion most often relied on in practice whenever a moral response is classified as bias rather than judgment.

  Then do the following, arguing throughout rather than surveying.

  First, show that the self-endorsement criterion cannot bear the weight placed on it, by pressing at least two difficulties: that the reflection supposed to certify a preference is itself shaped by the dispositions under review, so that an agent whose outlook is thoroughly distorted may endorse it without remainder; and that there are cases in which an attitude is unstable under reflection precisely because the agent is being pressured out of a judgment she is entitled to keep.

  Second, examine the two natural repairs and argue that each fails. The first replaces self-endorsement with an objective criterion: a disposition is biased just in case it is caused by a factor that is in fact irrelevant to the moral truth of the matter. The second replaces it with a counterfactual-stability criterion: an attitude is a preference just in case it would survive the agent's coming to know its causal history in full, and a bias otherwise. Say which of the two comes closer, and argue that both either presuppose the distinction they are meant to explain or collapse bias into moral error, losing the contrast the distinction was introduced to draw.

  Third, test the result against two cases and say what each shows: (a) a person who judges a harmless but taboo practice to be wrong, whose attitude is traceable to disgust, who can give no reason for the judgment that does not beg the question, and who nonetheless endorses it on reflection and would not revise it; and (b) a person whose judgment that a just but socially costly arrangement is required wavers under the contempt of others, and who is highly susceptible to that pressure, but whose judgment is arguably correct.

  Fourth, formulate and answer the strongest objection you can to your own conclusion — I take it to be that without a psychological criterion bias becomes a term of abuse, so that calling a view biased adds nothing to disagreeing with it, and that this is a cost the position cannot pay.

  Finally, say what follows for practice: whether debiasing exercises, implicit-bias training, and the common advice to reflect on the origins of one's moral convictions can be justified on your account, and if so, on what grounds.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Prompt:**

      *   **Thesis:** The distinction between moral preference and moral bias is not a psychological fact to be discovered empirically, but a shift between two standpoints: the *deliberative* (agent's commitments) and the *explanatory* (output of causes). Attempts to fuse them into one criterion fail by either smuggling in the deliberative standpoint or losing normative force.
      *   **Stipulations:**
          *   *Preference:* Stable under reflection, endorsed, answerable to acknowledged moral considerations.
          *   *Bias:* Produced by non-moral factors (disgust, order, identity), wouldn't survive knowing the source.
          *   *Self-Endorsement Criterion:* The standard practical test (would the agent endorse this if they knew the source?).
      *   **Tasks:**
          1.  Argue the self-endorsement criterion fails (two difficulties: distorted reflection/endorsement of distortion; instability due to pressure on entitled judgments).
          2.  Examine two repairs (Objective Criterion vs. Counterfactual-Stability Criterion). Argue both fail (presuppose the distinction or collapse bias into error). Determine which is closer.
          3.  Test against two cases: (a) Taboo/Disgust endorser; (b) Wavering Justice endorser.
          4.  Formulate and answer the strongest objection (Bias becomes mere abuse/loss of critical bite).
          5.  Practical implications (Debiasing, training, reflection).
      *   **Tone/Style:** Argue throughout, do not survey. Philosophical rigor.

  2.  **Deconstruct the Thesis & Standpoints:**

      *   *Deliberative Standpoint:* I am the agent. I ask, "What should I do?" My reasons matter. My commitments are *mine*.
      *   *Explanatory Standpoint:* I am the observer (or the agent looking at themselves as an object). I ask, "Why did this happen?" Causes matter (biology, sociology, psychology).
      *   *The Conflict:* Bias is usually defined causally (explanatory), but we care about it normatively (deliberative). If I own it, is it bias? If I don't own it, is it just a cause? The prompt argues we can't have a single psychological metric that bridges this gap perfectly.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** State the thesis clearly. Define the two standpoints. Introduce the self-endorsement criterion as the attempted bridge. State that this bridge collapses.

      *   **Section 1: The Failure of Self-Endorsement.**
          *   *Difficulty 1 (Distorted Reflection):* If my moral faculties are corrupted (e.g., by ideology), my reflection validates the corruption. Endorsement doesn't guarantee purity. (Example: A racist in a racist society reflects and endorses racism).
          *   *Difficulty 2 (Pressure on Entitled Judgments):* Sometimes reflection creates doubt where there should be certainty due to social pressure. If I waver because others mock my just view, self-endorsement labels my just view as "unstable" (potentially bias), but it's actually the correct moral view being suppressed.

      *   **Section 2: The Two Repairs.**
          *   *Repair 1: Objective Criterion.* Bias = caused by irrelevant factors (truth-tracking).
              *   *Critique:* Requires access to moral truth independent of the agent. Collapses bias into moral error. If I'm wrong, I'm biased? No, I could be honestly mistaken. Loses the specific sting of "bias."
          *   *Repair 2: Counterfactual-Stability.* Bias = wouldn't survive knowing the cause.
              *   *Critique:* This is just self-endorsement refined. It still relies on the agent's hypothetical reaction. If the agent is deluded, they still endorse. If we say "they *should* reject it," we are smuggling in the Objective Criterion (Deliberative standpoint).
          *   *Comparison:* Counterfactual is closer to the *phenomenology* of bias, but Objective is closer to the *critique*. Both fail to unify the standpoints.

      *   **Section 3: Testing the Cases.**
          *   *Case (a) Taboo/Disgust:* Agent endorses disgust-based judgment.
              *   *Analysis:* Self-endorsement says "Preference." Objective says "Bias." This shows the split. From the deliberative standpoint (hers), it's a commitment. From explanatory (ours), it's a causal artifact. We cannot psychologically prove she is biased without stepping outside her deliberative standpoint.
          *   *Case (b) Wavering Justice:* Agent wavers on justice due to contempt.
              *   *Analysis:* Self-endorsement says "Bias" (unstable). But the judgment is correct. This shows instability isn't the mark of bias. The pressure is external, but the standpoint shift makes it look like internal failure.

      *   **Section 4: The Strongest Objection.**
          *   *Objection:* If bias isn't psychological, calling someone "biased" is just saying "I disagree." It loses critical power. It becomes an insult, not a diagnosis.
          *   *Response:* The critical power doesn't come from a psychological fact; it comes from the *invitation to shift standpoints*. Calling someone biased invites them to view themselves explanationally. It's a normative challenge, not a medical diagnosis. It retains force because it challenges the authority of the deliberative standpoint by exposing its causal underpinnings.

      *   **Section 5: Practical Implications.**
          *   *Debiasing/Training:* Can we justify them?
          *   *Yes, but differently.* Not as "fixing broken psychology to find truth," but as "expanding the deliberative standpoint to incorporate explanatory insights." Reflection isn't about finding a bias-free zone (impossible), but about aligning causal influences with deliberative commitments. We train not to eliminate causes, but to ensure causes we *would* endorse are the ones driving us.

  4.  **Refining and Polishing:**

      *   *Check Constraints:* Did I use the stipulated definitions? Yes (Preference = stable/endorsed; Bias = causal/non-moral source).
      *   *Check Tone:* Is it argumentative? Avoid "Some philosophers say..." Use "I argue..."
      *   *Check Flow:* Ensure the transition from the failure of the criterion to the standpoints thesis is clear. The core idea is that "Bias" is a label we apply when we force the explanatory standpoint onto a deliberative claim.
      *   *Nuance:* Make sure not to say moral truth doesn't exist, but that *identifying bias* isn't the same as *identifying error*.
      *   *Word Choice:* Use "Deliberative Standpoint" and "Explanatory Standpoint" consistently.

  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe I should argue moral realism is false.
      *   *Correction:* No, keep it focused on the distinction between preference and bias. Realism/anti-realism is a side issue. Focus on the *criteria* for bias.
      *   *Initial thought:* The objection section needs to be very strong.
      *   *Correction:* The objection is that the view makes "bias" useless. I need to show it makes "bias" *different*, not useless. It becomes a rhetorical/normative move rather than a scientific one.
      *   *Check Case (b):* Make sure I don't confuse "wavering" with "bias." The prompt says the judgment wavers *under pressure*. The self-endorsement criterion might label this instability as a lack of preference (hence potentially bias or mere whim). I need to show why labeling this "bias" is wrong, supporting the thesis that the criterion is flawed.

  6.  **Final Review against Prompt Requirements:**
      *   Thesis stated? Yes.
      *   Stipulations used? Yes.
      *   Two difficulties for self-endorsement? Yes (Distorted reflection, Pressure on entitlement).
      *   Two repairs examined? Yes (Objective, Counterfactual).
      *   Which is closer? (Counterfactual is closer to the concept, but both fail).
      *   Two cases tested? Yes (Taboo, Wavering Justice).
      *   Strongest objection answered? Yes (Term of abuse).
      *   Practice implications? Yes.

  7.  **Final Polish:** Check for clarity and punchiness. Ensure the distinction between the two standpoints is the golden thread running through the whole piece. (Self-correction: Ensure I explicitly state that the distinction *is* the shift in standpoints, not just that the criteria fail.)

  *(Self-Correction on the "Which is closer" part)*: The prompt asks to "Say which of the two comes closer." I need to make a definitive choice there. The Counterfactual-Stability criterion comes closer to the *concept* of bias as commonly understood (internal alienation), whereas the Objective criterion collapses into error. I will argue Counterfactual is closer but still fails.

  *(Self-Correction on Case B)*: The prompt says the judgment *wavers*. Under self-endorsement, if it wavers, it's not a stable preference. Does that make it bias? The prompt implies the judgment is *correct*. If we call it bias because it's unstable, we punish the agent for social pressure. This shows the criterion fails.

  Let's write.
answer: |-
  The distinction between a moral preference and a moral bias is not a psychological boundary waiting to be mapped by finer empirical instruments. It is a shift between two standpoints on a moral outlook: the deliberative standpoint, from which the outlook is the agent's own set of commitments, and the explanatory standpoint, from which it is the output of causes. To treat bias as a natural kind discoverable within the psyche is to misunderstand the normative work the concept performs. Every attempt to fuse the deliberative and explanatory into a single criterion of bias fails, either by smuggling the deliberative standpoint back in under the guise of psychology or by forfeiting the normative force that makes the label worth applying.

  To see this, we must begin with the criterion most often relied on in practice: the self-endorsement criterion. On the stipulated definitions, an agent prefers a form of conduct when her attitude is stable under reflection and answerable to considerations she acknowledges. She is biased when her attitude is produced by a factor she would not count as a moral consideration (such as disgust or order effects) and would not survive her learning that this was its source. This criterion attempts to bridge the gap between the agent's own view of herself (deliberative) and the causal story of her psychology (explanatory). It suggests that bias is simply a preference that fails to survive the light of self-knowledge. However, this criterion cannot bear the weight placed on it.

  First, the reflection supposed to certify a preference is itself shaped by the dispositions under review. The self-endorsement criterion assumes that reflection is a neutral tribunal, but reflection is conducted using the very cognitive tools and moral intuitions that might be distorted. An agent whose outlook is thoroughly distorted by ideology may endorse it without remainder. Consider a member of a rigid caste society who reflects on her aversion to inter-caste marriage. She traces this aversion to "tradition" and "natural order," concepts she fully endorses. She does not acknowledge "social conditioning" as a non-moral cause; she acknowledges it as moral education. Under the self-endorsement criterion, her attitude is a preference, not a bias, because it is stable under *her* reflection. Yet, from the explanatory standpoint, it is clearly the output of arbitrary social causes. If we insist it is a preference because she endorses it, we render the concept of bias toothless against systemic ideological distortion. The criterion protects the deliberative standpoint so thoroughly that it blinds us to the explanatory reality.

  Second, there are cases in which an attitude is unstable under reflection precisely because the agent is being pressured out of a judgment she is entitled to keep. Stability is not an intrinsic mark of moral correctness. An agent might hold a correct, just view that is unpopular. When she reflects, she encounters the weight of social contempt, her own anxiety, and the cognitive dissonance of standing alone. Her attitude wavers. Under the self-endorsement criterion, this instability suggests her attitude is not a genuine preference and may be susceptible to being labeled a bias (or at least a whim). But the instability is not a sign of internal causal corruption; it is a sign of external moral pressure. To label this wavering a lack of preference is to penalize the agent for the hostility of her environment. It conflates the psychological difficulty of maintaining a commitment with the normative status of that commitment. Thus, the self-endorsement criterion fails to distinguish between the fragility of a bias and the fragility of a persecuted truth.

  Recognizing these failures, one might attempt to repair the criterion. There are two natural paths. The first replaces self-endorsement with an objective criterion: a disposition is biased just in case it is caused by a factor that is in fact irrelevant to the moral truth of the matter. The second replaces it with a counterfactual-stability criterion: an attitude is a preference just in case it would survive the agent's coming to know its causal history in full, and a bias otherwise.

  The objective criterion comes closer to capturing the explanatory standpoint, but it collapses the distinction between bias and moral error. If bias is defined by causal irrelevance to moral truth, then every moral mistake is a bias. If I judge that stealing is permissible because I miscalculated the consequences, my judgment is caused by a factor (bad math) irrelevant to the moral truth (stealing is wrong). But we do not typically call bad math "bias." We call it error. Bias carries a specific sting: it implies a corruption of the *process* of judgment, not just the outcome. By tying bias directly to moral truth, the objective criterion loses the contrast it was introduced to draw. It presupposes we can access moral truth independently of the agent's deliberation to diagnose their psychology, which effectively eliminates the deliberative standpoint from the diagnosis entirely.

  The counterfactual-stability criterion is closer to the intuitive concept of bias, as it retains the focus on the agent's relationship to her causes. However, it fails for the same reason as the self-endorsement criterion: it relies on the agent's hypothetical reaction. If the agent is deluded, she would not reject the cause even if she knew it. To save the criterion, one must say she *should* reject it. But once we introduce the "should," we have smuggled the objective criterion back in. We are no longer asking what she would do; we are asking what she ought to do given the causal facts. This surreptitiously reintroduces the deliberative standpoint (what she ought to endorse) to fix the explanatory standpoint (what caused her). Neither repair succeeds in fusing the two standpoints into a single psychological metric. The objective criterion sacrifices the specific normative texture of bias for truth-tracking; the counterfactual criterion sacrifices reliability for psychological fidelity.

  We can test this conclusion against two cases. Consider (a) a person who judges a harmless but taboo practice to be wrong, whose attitude is traceable to disgust. She can give no reason for the judgment that does not beg the question, yet she endorses it on reflection and would not revise it. Under the self-endorsement and counterfactual criteria, this is a preference. She owns it. Yet, from the explanatory standpoint, it is paradigmatically bias: it is driven by a visceral reaction she cannot justify. This case shows that the deliberative and explanatory standpoints can diverge completely. To call her biased is to step outside her deliberative standpoint and impose the explanatory one. There is no psychological fact about her that settles the matter; the label "bias" is a move in a normative argument, not a description of her mental state.

  Consider (b) a person whose judgment that a just but socially costly arrangement is required wavers under the contempt of others. She is highly susceptible to that pressure, but her judgment is arguably correct. Here, the self-endorsement criterion threatens to classify her correct judgment as unstable, and thus not a full preference, potentially leaving it vulnerable to being dismissed as mere susceptibility (a form of bias). But the explanatory story reveals the cause of the wavering is social pressure, not internal distortion. If we call her biased because she wavers, we confuse the causal impact of the environment with the normative status of her judgment. This case shows that stability is not a reliable proxy for the absence of bias, nor is instability a proxy for its presence. The distinction between preference and bias cannot be read off the psychological profile of stability or endorsement; it depends on whether we are evaluating her commitments (deliberative) or her causal vulnerabilities (explanatory).

  The strongest objection to this conclusion is that without a psychological criterion, "bias" becomes a mere term of abuse. If bias is not a factual diagnosis of a cognitive malfunction, but merely a shift to the explanatory standpoint, then calling a view biased adds nothing to disagreeing with it. It becomes a rhetorical weapon used to dismiss an opponent by implying their views are merely caused, not reasoned. This is a cost the position cannot pay. If the concept of bias loses its critical bite, it ceases to be useful in moral discourse, which relies on the ability to distinguish between reasonable disagreement and distorted judgment.

  However, this objection misunderstands the source of the concept's normative force. The force of the label "bias" does not come from its status as a psychological fact, but from its function as an invitation to shift standpoints. When we accuse an agent of bias, we are not claiming to have found a broken gear in their brain; we are challenging the authority of their deliberative standpoint by exposing its causal underpinnings. We are saying, "You view this as a commitment, but look at it as a consequence." This retains critical bite because it undermines the agent's claim to rational authority without necessarily proving them morally wrong. It forces a reckoning between who they take themselves to be and what causes them to act. The charge of bias is not a description of a state; it is a demand for accountability. It remains distinct from mere disagreement because disagreement accepts the opponent's deliberative standpoint as valid, whereas the charge of bias attempts to suspend it in favor of an explanatory view. Thus, the term is not emptied of content; its content is revealed to be normative and relational, not empirical and intrinsic.

  What follows for practice? If the distinction is a shift in standpoints rather than a psychological cleanup operation, then debiasing exercises, implicit-bias training, and advice to reflect on origins must be justified differently. They cannot be justified as techniques to eliminate causal influences to reach a "pure" deliberative view, for no such view exists. We are always caused. Instead, these practices are justified as attempts to align the explanatory standpoint with the deliberative one.

  Reflection on the origins of one's moral convictions is valuable not because it filters out bias to reveal preference, but because it expands the deliberative standpoint to include explanatory facts. When an agent learns that her judgment is influenced by the order of cases, she incorporates that fact into her deliberation. She does not become a-causal; she becomes causally informed. Debiasing training is not about removing the output of causes, but about training the agent to endorse the causes that drive her. We want agents to be driven by considerations they would acknowledge upon reflection. Therefore, the goal of practice is not to achieve a bias-free psychology, which is impossible, but to achieve a state where the causal forces at work are those the agent would deliberatively endorse. We reflect not to escape our causes, but to make them our own. In this light, the distinction between preference and bias remains vital, not as a boundary between two psychological states, but as the ongoing work of reconciling who we are with what makes us.
