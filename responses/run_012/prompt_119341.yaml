      *   **Japanese Side (Aiko's family):** Values harmony, ritual, graciousness. Direct mention of conflict needs to be framed carefully so it doesn't sound like instability or disrespect to the union. It needs to sound like *overcome difficulty* rather than *incompatibility*.
      *   **The Bridge:** Specific, verifiable actions. Actions speak louder than abstract compliments.

