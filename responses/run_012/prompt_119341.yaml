      *   **Constraint 2 (The Breakup):** Acknowledge they split up for a year (it was ugly). This builds trust with the Dutch side (honesty) but must not alarm the Japanese side (must not sound like a warning/instability).
      *   **Constraint 3 (Vocabulary):** Do *not* use terms like *honne/tatemae*. Show, don't tell regarding cultural nuance.
      *   **Constraint 4 (Tone):** No lecturing on philosophy. The philosophy must *do the work* (internal consistency).
