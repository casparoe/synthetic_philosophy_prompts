answer: |-
  **Title:** The Heat of Legitimacy: *Do the Right Thing* and the Monopoly on Interpretation
  **Subtitle:** Thirty-five years on, Spike Lee's masterpiece does not offer policy prescriptions. Instead, it exposes the racialised mechanics of state violence.

  **By [Your Name]**

  In the pantheon of political cinema, few films burn as hot as Spike Lee's *Do the Right Thing* (1989). Set over the course of a single, sweltering day in Bedford-Stuyvesant, Brooklyn, the film is often taught as a sociological text, a snapshot of racial tension preceding the Rodney King riots. Yet, viewed through the lens of political philosophy, specifically Max Weber's definition of the state as the entity holding a 'monopoly on the legitimate use of physical force', the film transforms. It ceases to be merely a drama about neighbours and becomes a forensic examination of who grants legitimacy, and to whom.

  Weber's formulation assumes a neutral arbiter: the state protects the social contract by restraining private violence. *Do the Right Thing* dismantles this assumption. It posits that in a racialised hierarchy, the police do not function as neutral guarantors of order. Rather, they operate as an armed faction tasked with enforcing a specific status quo. The film suggests that the true power of the state lies not merely in its monopoly on violence, but in its monopoly on the *legitimate interpretation of threat*.

  **The Interpretation of Threat**

  Throughout the film, the NYPD is notably absent until the final act. Order on the block is maintained through a complex, informal web of social relations. Da Mayor sweeps the pavement; Mother Sister watches from her window; Mookie negotiates between the community and Sal, the pizzeria owner. Violence is present—Buggin' Out's sneaker scuff, Pino's slurs, the Latinx and Black teenagers' territorial squabbles—but it is contained within the social fabric.

  The police arrive not when violence occurs, but when the *interpretation* of behaviour shifts. When Buggin' Out and Radio Raheem enter Sal's to demand Black representation on the 'Wall of Fame', they are not initially met with state force. They are met with a baseball bat. Sal's violence is framed as defence of property. However, when the police arrive following the destruction of the pizzeria, the dynamic shifts.

  The critical moment occurs with Radio Raheem. He is playing Public Enemy's 'Fight the Power' at a volume the community finds celebratory, but the state finds disruptive. Here, the film illustrates the monopoly on interpretation. Raheem interprets his music as expression and identity; the police interpret it as a disturbance and a provocation. When Raheem refuses to turn the boombox off, the interpretation hardens: his body becomes a threat that must be neutralised.

  The chokehold is the ultimate assertion of this monopoly. It is not a skirmish; it is an execution of administrative power. The police do not merely overpower Raheem; they render his existence illegitimate. In the eyes of the state, his resistance transforms him from a citizen into a hazard. The film asks a harrowing question: if the state decides whose violence is legitimate, what recourse exists when the state's violence is the primary source of disorder?

  **The Trash Can and the Ambivalence of Action**

  This brings us to the film's most debated gesture: Mookie picking up a dustbin and hurling it through the window of Sal's Pizzeria.

  In contemporary discourse, this moment is often claimed by opposing camps. A reformist reading might condemn the destruction of private property as counter-productive chaos. An abolitionist reading might champion it as a necessary rupture, a redirecting of violence from bodies (Raheem's) to structures (Sal's). Yet, *Do the Right Thing* resists both categorisations. It is profoundly ambivalent.

  Mookie's action is not a manifesto; it is a tactic. In the immediate aftermath of Raheem's killing, the crowd's fury is directed at Sal and his sons. There is a palpable risk of lynching. By destroying the pizzeria, Mookie gives the crowd a target that is not human. He sacrifices the business to save the man. This complicates the abolitionist narrative, which often views property destruction as inherently liberatory. For Mookie, it is a tragic calculus of harm reduction in a zone where the state has abdicated its duty to protect Black life.

  However, by initiating the destruction, Mookie also accepts the collapse of the economic relationship he relied upon. He works for Sal. He knows Sal is not a monster, but a man trapped in his own prejudices ('I'm an Italian-American. I been here twenty-five years. I ain't going nowhere'). Mookie's throw acknowledges that coexistence is no longer possible under the current terms. It is not a call to defund the police; it is an admission that the police have already rendered the community ungovernable by their own standards of justice.

  **Beyond the Policy Dispute**

  Where *Do the Right Thing* most significantly diverges from modern theoretical debates regarding reform, defund, or abolish is in its refusal to offer a solution. Theoretical arguments often seek resolution: *If we X, then Y will happen.* Lee offers only consequence.

  The film ends not with a victory, but with a hangover. The block is charred. Raheem is dead. Sal is ruined. Mookie demands his pay, a stark reminder that revolution does not pay the rent. In the final moments, we see two quotes projected on the screen: one from Martin Luther King Jr. condemning violence, and one from Malcolm X defending it as self-defence. Lee refuses to circle the 'right' one.

  This ambivalence is the film's greatest contribution to the discourse. Theory often sanitises violence, discussing it in terms of legitimacy and sovereignty. *Do the Right Thing* restores the heat. It shows that when the state monopolises the interpretation of threat, it creates a pressure cooker where 'legitimate' violence (the chokehold) begets 'illegitimate' violence (the riot).

  The film adds something theory cannot: the affective dimension of injustice. It captures the sensory experience of the heatwave—the sweat, the friction, the exhaustion. It demonstrates that policing is not just a legal framework but a physical presence that raises the temperature of a neighbourhood. When the police arrive in their cruiser, blasting sirens, they do not cool the situation; they ignite it.

  **The Unresolved Question**

  Ultimately, *Do the Right Thing* suggests that the question is not whether the state should have a monopoly on violence, but whether it can ever possess legitimacy in the eyes of the governed when that violence is racially contingent. The police in the film do not restore order; they impose a silence. The final shot of the precinct captain speaking calmly to Sal, while Raheem's body lies cooling nearby, confirms that the state's legitimacy is reserved for property owners, not residents.

  The film resists being a position paper for defunding or reform because it understands that the issue is deeper than budget lines or training protocols. It is about who has the power to define reality. When Raheem's music is defined as noise, and his neck is defined as a choke-point, the monopoly is absolute.

  Thirty-five years later, as debates over policing continue to rage, Lee's film remains uncomfortable because it denies us the comfort of a clear moral victory. It suggests that in a society built on racial hierarchy, 'doing the right thing' may not look like order, and it may not look like peace. It might look like a dustbin flying through a window—a chaotic, tragic, and undeniable assertion that when the state's violence is illegitimate, the community's chaos is the only truth left.

  The film does not tell us how to fix the monopoly. It warns us what happens when that monopoly is abused. It reminds us that before the policy debate, there is the body. And when the body is broken by the very institution meant to protect it, no amount of theoretical legitimacy can cool the heat.
