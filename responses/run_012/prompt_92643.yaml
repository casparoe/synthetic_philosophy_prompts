      *   **Addressing Partial Splits:** If complete splits don't necessarily yield two minds, partial splits definitely don't yield "1.5 minds." Instead, they yield *specific deficits* in information transfer. It's about *access*, not *subjecthood*.
      *   **Degrees of Unity:** This is the philosophical meat. Yes, unity likely comes in degrees (functional integration), but "number of subjects" does not. Distinguish *phenomenal unity* from *numerical identity*.
