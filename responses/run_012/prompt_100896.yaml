answer: |-
  ### Exam Question (25 Marks)

  **Essay Question**

  In this course, we have distinguished two modes of independence relative to models of ZFC. Say that a sentence $\phi$ is **width-independent** if there exist two models of ZFC, $M$ and $N$, such that $M$ and $N$ have the same ordinals ($\text{Ord}^M = \text{Ord}^N$) but different sets of reals, where $M \models \phi$ and $N \models \neg \phi$. Say that $\phi$ is **height-independent** if models disagreeing on $\phi$ must differ in their ordinal height or large-cardinal structure.

  Consider the following principle proposed during seminar discussion (hereafter **The Principle**): *A sentence of set theory has a determinate truth value only if it is not width-independent.*

  Using the Continuum Hypothesis (CH) as your primary test case, write an essay addressing the following:
  1.  Demonstrate whether CH satisfies the definition of width-independence.
  2.  Evaluate whether The Principle is philosophically defensible. What conception of the set-theoretic universe must a defender of The Principle adopt, and what must they give up (e.g., regarding Universism)?
  3.  Does the width-independence of CH necessarily entail that CH lacks a determinate truth value, or does this inference rely on further assumptions about the nature of truth in set theory?

  *Note: You may find it heuristically useful to consider an analogy from quantified modal logic, where width-independence resembles varying the domain of quantification while holding the world fixed, whereas height-independence resembles shifting to an accessible world with different individuals. However, your argument must rest on set-theoretic grounds, not merely on the analogy.*

  ***

  ### Model Answer

  The Continuum Hypothesis is the paradigmatic case of width-independence. By Cohen's method of forcing, we can construct a generic extension $M[G]$ of a ground model $M$ such that $\text{Ord}^{M} = \text{Ord}^{M[G]}$, yet the cardinality of the reals differs between them. Since forcing preserves ordinals but alters the power set of $\omega$, we can produce models with identical height but conflicting truth values for CH. Thus, CH satisfies the definition of width-independence provided.

  The defensibility of The Principle hinges on one's conception of the set-theoretic universe. A defender of The Principle argues that if the ordinals (the backbone of the cumulative hierarchy) are fixed, but the truth of $\phi$ varies based on which subsets of those ordinals exist, then $\phi$ does not track a determinate feature of reality. This position aligns with a Multiversist conception of set theory, specifically one that prioritizes width-variation. To defend The Principle, one must reject Universism—the view that there is a single, absolute universe $V$ in which every sentence is determinately true or false. Instead, the defender must accept that "truth" is relative to a width-variant model. What they give up is the idea that the power set operation is uniquely determined by the ordinals. They concede that the notion of "all subsets of $\omega$" is indeterminate, even if the notion of "all ordinals" is not.

  However, the inference from width-independence to indeterminacy is not automatic; it relies on a specific semantic assumption. One could argue that CH is width-independent merely because ZFC is insufficient to capture the fullness of $V$, not because $V$ itself is indeterminate. A Universist might argue that while we can construct width-variant models formally, only one corresponds to the actual $V$. On this view, width-independence demonstrates epistemic limitation or axiomatic incompleteness, not metaphysical indeterminacy. For The Principle to hold, one must assume that truth supervenes on features invariant across width-extensions. If one believes truth can reside in features that vary across forcing extensions, The Principle fails.

  The modal analogy clarifies this tension. If we treat width-independence as varying the domain of quantification (which subsets exist) within a fixed world, The Principle asserts that propositions sensitive to domain variation lack truth values. This is akin to claiming existence claims are indeterminate if the domain is not fixed. Yet, in set theory, the "domain" of subsets is arguably part of the world's structure. If height-independence is akin to changing worlds (accessibility), then height-independent statements are clearly contingent. The Principle draws the line differently: it treats width-variation as truth-destabilizing.

  Ultimately, The Principle is defensible only if one accepts that the determinacy of the ordinals is insufficient to fix the truth of arithmetic or projective statements. It requires a commitment to the idea that the "width" of the universe is not a matter of fact. While CH's width-independence supports this claim by showing CH's sensitivity to width-variation, it does not prove indeterminacy unless one presupposes that legitimate truth must be width-invariant. Therefore, The Principle is not a consequence of forcing results alone, but a philosophical stance on what kinds of invariance are required for determinacy. A student of set theory must recognize that accepting The Principle means abandoning the hope that CH has a solution in $V$, not because $V$ is inaccessible, but because $V$ is not unique in the width dimension.

  ***

  ### Marking Scheme

  **Total: 25 Marks**

  **1. Correct Classification of CH (5 Marks)**
  *   **Requirement:** Explicitly identifies CH as width-independent by referencing the preservation of ordinals and variation of reals (power set of $\omega$) via forcing.
  *   **Common Error:** Students claim CH is height-independent or conflate ZFC-independence with the specific width/height definitions provided.

  **2. Analysis of The Principle's Ontological Commitments (5 Marks)**
  *   **Requirement:** Identifies that defending The Principle requires rejecting Universism (single $V$) and accepting a form of Multiversism where truth is relative to width-extensions.
  *   **Common Error:** Students argue The Principle is compatible with a single absolute $V$ without explaining how truth varies within it.

  **3. Identification of Philosophical Costs (5 Marks)**
  *   **Requirement:** Articulates what is given up: specifically, the determinacy of the power set operation or the idea that "all subsets" is a well-defined notion.
  *   **Common Error:** Vague statements about "giving up certainty" rather than specific ontological costs regarding the power set axiom.

  **4. Distinction Between Formal Independence and Metaphysical Indeterminacy (5 Marks)**
  *   **Requirement:** Argues that width-independence (formal model existence) does not logically entail indeterminacy (metaphysical status) without the extra assumption that truth requires width-invariance.
  *   **Common Error:** Equating the existence of a model where $\neg$CH holds with the proof that CH is objectively false or meaningless.

  **5. Critical Evaluation and Conclusion (5 Marks)**
  *   **Requirement:** Provides a reasoned verdict on whether The Principle is defensible (e.g., "Defensible only if one accepts X") and uses the modal analogy only as support, not substitution.
  *   **Common Error:** Relying entirely on the modal logic analogy to make the argument, or failing to offer a concluding evaluation of the Principle's viability.
