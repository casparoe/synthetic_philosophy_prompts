answer: |-
  # Q&A PREP SHEET: Karma as Narrative Constraint

  ## 1. CONCESSIONS TO MAKE UP FRONT
  *Do not wait for these to be dragged out of you. State them in your opening remarks or immediately after the question period opens. This buys you goodwill and narrows the target.*

  *   **To the South Asianist:** Concede that classical texts *do* use causal language (*hetu-phala*, *vipāka*). You are not denying the metaphysics exist; you are arguing the metaphysics function *as* hermeneutics in practice.
  *   **To the Sociologist:** Concede that karma *is* used to legitimize caste and hierarchy. Do not claim it isn't. Your claim is that it succeeds *because* it is a flexible narrative constraint, not because it is a rigid causal law.
  *   **To the Buddhist Modernist:** Concede that karma is soteriological. You are not reducing it to literature; you are arguing that narrative intelligibility is a precondition for the soteriological work.

  ---

  ## 2. INTERLOCUTOR OBJECTIONS & REPLIES

  ### A. The South Asianist (Philologist/Textualist)
  **Vocabulary:** *Vipāka*, *saṃskāra*, textual fidelity, semantic range, metaphysical commitment.

  *   **Objection 1 (High Likelihood / High Damage):** "You're imposing a Western literary category ('narrative') on a technical metaphysical term. *Vipāka* means 'ripening.' It's an agricultural/causal metaphor, not a hermeneutic one. You're ignoring the ontological commitment the authors make."
      *   **2-Minute Reply:** "I'm not denying they make ontological claims. I'm asking what work those claims *do*. When a practitioner encounters suffering, the 'ripening' metaphor doesn't function as a botanical prediction; it functions to place the event in a temporal sequence that renders it meaningful. The ontology is the vehicle; the intelligibility is the cargo. If I treat a text's metaphysics as its function, I miss how it survives contradictions."
      *   **Soft Spot:** If they cite a text that explicitly rejects the narrative reading in favor of mechanistic precision (e.g., specific Abhidharma mappings), you have to admit your reading is functionalist, not exegetical.

  *   **Objection 2 (Med Likelihood / Med Damage):** "This sounds like a 'two-truths' dodge. Are you saying karma is ultimately false but conventionally useful?"
      *   **2-Minute Reply:** "I'm saying the 'conventional' truth *is* the narrative constraint. There isn't a deeper causal layer doing the work. The 'truth' of karma is its coherence, not its correspondence to a hidden moral mechanics."
      *   **Soft Spot:** Risks sounding like you're calling the tradition deceptive.

  ### B. The Analytic Ethicist (Desert/Moral Luck)
  **Vocabulary:** Normative force, supervenience, truth-conditions, action-guiding, empty set.

  *   **Objection 1 (High Likelihood / Critical Damage):** "You admit your view is 'inert.' If karma imposes no causal constraints and any outcome can be narrativized, it has no normative force. Why should I act morally? If the theory can absorb *any* distribution of outcomes, it's consistent with everything and therefore says nothing."
      *   **2-Minute Reply:** "You're assuming the point of karma is to guide action. I'm arguing the point is to prevent *nihilism*. It's not a moral imperative; it's a psychological immune system. It doesn't tell you what to do; it stops you from concluding that the world is absurd. Its 'inertness' is a feature, not a bug—it allows stability without requiring empirical verification."
      *   **Soft Spot:** If they press that a philosophy that can't distinguish justice from injustice is ethically worthless, you have to lean hard into the 'descriptive vs. normative' divide.

  *   **Objection 2 (Med Likelihood / Low Damage):** "Is this just a version of Leibnizian theodicy without God?"
      *   **2-Minute Reply:** "Yes, structurally. But without the agent. It's a theodicy of process. That removes the problem of evil but keeps the problem of meaning."
      *   **Soft Spot:** Don't get bogged down in comparative theodicy; keep it focused on the mechanism of narrative.

  ### C. The Sociologist of Religion (Caste/Power)
  **Vocabulary:** Legitimation, hegemony, lived experience, social stratification, violence.

  *   **Objection 1 (High Likelihood / High Damage):** "By calling it a 'story,' you're sanitizing the violence. When a Dalit is told their suffering is karma, that's not a narrative constraint; that's a causal assertion used to crush dissent. You're making it sound intellectual when it's brutal."
      *   **2-Minute Reply:** "I agree it's brutal. But notice *why* it works. It works precisely because it's flexible. If karma were a rigid causal law, it could be falsified by obvious injustice. Because it's a narrative constraint, the Brahmin can *always* tell a story that fits. My argument explains its durability as a tool of oppression, not excuses it."
      *   **Soft Spot:** If they say you're complicit in that oppression by theorizing it rather than condemning it. You must separate analysis from endorsement clearly.

  *   **Objection 2 (Low Likelihood / Med Damage):** "Have you talked to actual people who believe this? They think it's real causation."
      *   **2-Minute Reply:** "Phenomenologically, they experience it as causation. Structurally, it operates as narrative. I'm analyzing the structure, not reporting the phenomenology."
      *   **Soft Spot:** Can sound dismissive of lived belief.

  ### D. The Buddhist Modernist (Soteriology)
  **Vocabulary:** *Dukkha*, liberation, *nirvāṇa*, attachment, praxis, awakening.

  *   **Objection 1 (Med Likelihood / High Damage):** "Karma is about *ending* suffering, not making sense of it. You've turned a path to liberation into an intellectual game of story-telling. This is just more *prapañca* (conceptual proliferation)."
      *   **2-Minute Reply:** "You can't let go of a world that makes no sense. Intelligibility is the scaffold. You need the story to hold the suffering before you can drop the story. My reading explains how karma gets you to the edge of the raft; it doesn't claim to be the shore."
      *   **Soft Spot:** If they argue that seeking intelligibility *is* the attachment that binds you. You need to distinguish 'coherence' from 'clinging.'

  *   **Objection 2 (Low Likelihood / Low Damage):** "This ignores compassion. If suffering is just a story, where is the urge to relieve it?"
      *   **2-Minute Reply:** "The story says suffering is real *within* the narrative. Compassion is a plot point, not an external obligation."
      *   **Soft Spot:** A bit glib. Be careful here.

  ---

  ## 3. THE ONE REPLY THAT MUST LAND
  **The "Inertness" Defense.**

  The Analytic Ethicist and the Sociologist will converge here: **If karma is just a story that can fit anything, it is useless (Ethicist) or dangerous (Sociologist).**

  You must land this distinction:
  > "Karma-as-narrative is not inert in terms of *psychological stability*; it is only inert in terms of *predictive justice*. It does the work people want it to do (stop despair, legitimize order) precisely *because* it doesn't make truth-claims that can be falsified. If I defend it as a causal theory, it's false. If I defend it as a narrative technology, it's robust. The dilemma isn't a problem for my paper; it's the reality of the doctrine."

  **Why this must land:** If you apologize for the "inertness," you concede the doctrine is broken. If you own the "inertness" as the source of its power, you turn the weakness into the central insight.

  ---

  ## 4. THE QUESTION YOU HOPE NOBODY ASKS
  **The Falsification Challenge.**

  > "If karma is a constraint on narrative, what makes a karma-narrative *false*? If a tyrant says 'my tyranny is your karma' and the victim accepts that story, your model says that's a valid function of karma. Do you have *any* criterion to distinguish a valid karma-narrative from a post-hoc rationalization of abuse? If not, haven't you just defined rationalization as a philosophy?"

  **Why this kills you:**
  1.  It collapses your distinction between "hermeneutic constraint" and "lie."
  2.  It forces you to either admit *anything* counts (making you an apologist for abuse) or smuggle in a moral standard (which returns you to the "desert" model you tried to escape).
  3.  If you say "the tradition provides criteria," the South Asianist will ask for texts, and the Sociologist will say those texts are also power tools.

  **Prep for the dodge:** If asked, pivot to *soteriological efficacy*. A false karma-narrative is one that increases *dukkha*/attachment rather than rendering it bearable. It's not about truth; it's about whether the story allows you to function or breaks you. (This is risky but your only out).
