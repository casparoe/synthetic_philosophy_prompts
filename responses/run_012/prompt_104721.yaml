          *   Belief Norm ruled out by: Selfless Assertion.
          *   Justification Norm ruled out by: Lottery Case.
          *   Knowledge Norm ruled out by: Gettier/Falsehood (sometimes we assert falsehoods properly) or Stakes (sometimes knowledge isn't enough).
          *   Actually, the *most* damaging constraint across the board is the **Permissibility/Blamelessness Distinction**. Without it, *every* theory fails immediately on false assertions.
      *   *Pluralism:* Be open to it. Some philosophers (e.g., Maitra, Brown) argue for pluralism or alternative functions.

