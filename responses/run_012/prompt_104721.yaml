answer: |-
  This is the right way to approach the literature. Intro classes often treat the "Knowledge Norm" (KN) as the default winner because it handles the Lottery and Moore cases neatly, but they gloss over the fact that KN creates as many problems as it solves (e.g., skepticism, selfless assertion, falsehoods).

  If you want to evaluate theories without buying into a specific camp, you need the **specification sheet**. Below is the checklist of desiderata, distinctions, and constraints any viable theory of assertion must address. I have flagged which are generally considered non-negotiable (data points almost no one denies) and which are theoretical preferences (where camps diverge).

  ### Part 1: The Phenomenological Data (The Cases)
  A theory must predict the correct verdict (Permissible/Improper) for these cases.

  1.  **The Lottery Case (Non-Negotiable)**
      *   *Case:* You hold a ticket in a fair 1-million-ticket lottery. The draw has happened but you haven't seen the news. You assert, "Your ticket lost."
      *   *Verdict:* Improper.
      *   *Constraint:* High statistical probability alone is insufficient for assertion.
  2.  **The Bus/Induction Case (Non-Negotiable)**
      *   *Case:* Your bus is late every day for a month. You assert to a friend, "The bus will be late today."
      *   *Verdict:* Permissible.
      *   *Constraint:* High inductive probability *can* be sufficient.
      *   *Tension:* This directly conflicts with the Lottery Case. A theory must explain the *difference* between lottery odds and bus patterns without just stipulating "one is knowledge and one isn't."
  3.  **Selfless Assertion (Strong Constraint)**
      *   *Case:* A doctor has overwhelming evidence a patient has a terminal illness but, due to a weird psychological block, cannot bring herself to *believe* it. She tells the patient's spouse the truth to allow for planning. (Or the Lawyer/Guilty Client case).
      *   *Verdict:* Permissible (even praiseworthy).
      *   *Constraint:* Belief is not strictly necessary for proper assertion. (This is the primary weapon against the Belief Norm).
  4.  **The Lucky Truth (Non-Negotiable)**
      *   *Case:* You guess the outcome of a coin flip. It lands heads. You assert, "It landed heads."
      *   *Verdict:* Improper (even though true).
      *   *Constraint:* Truth is not sufficient for proper assertion. (This kills the Truth Norm).
  5.  **Moore's Paradox (Non-Negotiable)**
      *   *Case:* Asserting "P, but I don't believe P" or "P, but I don't know P."
      *   *Verdict:* Absurd/Improper.
      *   *Constraint:* The norm must explain why asserting P while denying your own epistemic standing on P is incoherent.
  6.  **Peer Disagreement / Same Evidence (Contested)**
      *   *Case:* You and I have the exact same evidence. I assert P, you assert ~P.
      *   *Verdict:* Can both be permissible?
      *   *Constraint:* If both are permissible, the norm cannot be purely objective (truth/knowledge). If only one is, the norm must account for why the other is at fault despite identical evidence.

  ### Part 2: Conceptual Distinctions
  A theory collapses if it conflates these categories.

  1.  **Permissibility vs. Blame (Non-Negotiable)**
      *   *Distinction:* You can violate a norm blamelessly (e.g., asserting a falsehood based on misleading evidence). You can also follow a norm blameworthily (e.g., asserting a truth you knew was a lucky guess).
      *   *Requirement:* The theory must separate the *objective standard* (was the move allowed?) from the *subjective standard* (does the speaker deserve criticism?).
      *   *Why:* Without this, the Truth Norm fails (you are blameless for asserting a falsehood if evidence was good) and the Knowledge Norm struggles (are you blameworthy for asserting a Gettierized truth?).
  2.  **Propriety vs. Truth (Non-Negotiable)**
      *   *Distinction:* An assertion can be proper but false (good evidence, world cooperates poorly). An assertion can be improper but true (lucky guess).
      *   *Requirement:* The norm governs the *act*, not the *content*.
  3.  **Speaker Norm vs. Hearer Uptake (Strong Constraint)**
      *   *Distinction:* The rule for *making* the move vs. the rule for *accepting* the move.
      *   *Requirement:* If assertion is for knowledge transmission, the hearer's right to rely on you must track the speaker's norm. If the speaker is allowed to assert on mere belief, can the hearer know based on that testimony?
  4.  **Assertion vs. Implicature (Non-Negotiable)**
      *   *Distinction:* What is said vs. what is suggested.
      *   *Requirement:* The norm applies to the explicit assertoric act. (e.g., I can imply I know something without asserting I know it).

  ### Part 3: Background Constraints (The "Job Description")
  What is assertion *for*? The norm should fit the function.

  1.  **The Challenge Practice (Non-Negotiable)**
      *   *Constraint:* When challenged ("How do you know?"), the appropriate response is to cite evidence/knowledge, not just "I believe it."
      *   *Requirement:* The norm must explain why "How do you know?" is the *default* challenge, rather than "Is it true?" or "Do you believe it?"
  2.  **Knowledge Transmission (Strong Preference)**
      *   *Constraint:* Assertion is the primary way we spread knowledge.
      *   *Requirement:* The norm should facilitate the hearer coming to know P. (This favors the Knowledge Norm).
  3.  **Stakes Sensitivity (Contested)**
      *   *Constraint:* In low stakes, "The bank is open Saturday" is fine on memory. In high stakes (mortgage deadline), the same evidence feels insufficient.
      *   *Requirement:* Does the norm itself shift (Contextualism), or does the *application* of a fixed norm shift (Interest-Relative Invariantism), or is our intuition about propriety confused by prudence (Invariantism)?
      *   *Flag:* If you choose a fixed norm (like KN), you must explain away stakes intuitions. If you choose a variable norm, you must explain what the "common core" of assertion is.
  4.  **Insincerity Possibility (Non-Negotiable)**
      *   *Constraint:* One can assert while lying.
      *   *Requirement:* The norm cannot make insincerity impossible (like a constitutive rule of chess). It must be a norm one can *violate*.

  ### Part 4: The Tensions (Incompatibilities)
  Here is where the theories break. You cannot maximize all desiderata simultaneously.

  1.  **The Lottery/Bus Tension (The Probabilistic Problem)**
      *   *Conflict:* Both cases rely on high probability < 1.
      *   *Incompatibility:* A norm based on *Credence Thresholds* (e.g., "Assert if >95% confident") gets the Bus right but the Lottery wrong. A norm based on *Knowledge* gets the Lottery right but risks getting the Bus wrong (do you *know* the bus will be late?).
      *   *Cost:* To save the Knowledge Norm, you must argue we *do* know the bus will be late (skeptical of lottery knowledge). To save the Credence Norm, you must explain the lottery intuition away (e.g., pragmatic encroachment).
  2.  **Selfless Assertion vs. Sincerity**
      *   *Conflict:* If belief isn't required (to save Selfless Assertion), what prevents lying from being "proper"?
      *   *Incompatibility:* The Belief Norm explains why lying is wrong (you lack belief). The Knowledge Norm explains why lying is wrong (you lack knowledge). If you weaken the norm to allow Selfless Assertion, you need a separate account of why lying is distinct from proper selfless assertion.
  3.  **Invariantism vs. Stakes**
      *   *Conflict:* If the norm is "Know P," and I know P, I should be able to assert P. But in high stakes, I feel I shouldn't.
      *   *Incompatibility:* You must either deny I know P in high stakes (IRI), deny the norm changes (Invariantism + Prudence), or say the norm itself changes (Contextualism). You cannot have a fixed standard that ignores stakes *and* validates stakes intuitions.

  ### Part 5: The "Killer Constraint"
  You asked which single requirement does the most work ruling out popular candidates.

  It is **The Challenge Practice ("How do you know?")**.

  *   **Why it kills the Truth Norm:** If truth were the norm, the appropriate challenge would be "Is that true?" But we don't ask that immediately; we ask about the *speaker's state*.
  *   **Why it kills the Belief Norm:** If belief were the norm, the challenge would be "Do you believe that?" But asserting "I believe P" is weaker than asserting "P." The challenge "How do you know?" implies belief isn't enough.
  *   **Why it pressures the Justification Norm:** If justification were the norm, "I have good evidence" should suffice. But in Lottery cases, we have good evidence and are still challenged.
  *   **Why it supports the Knowledge Norm:** It is the only norm that matches the standard challenge verbatim.

  *However*, this constraint is vulnerable to the **Selfless Assertion** counter-attack. In selfless cases, the speaker *doesn't* know (or believe), yet the assertion is proper. If the norm is Knowledge, the speaker is violating the norm, yet we don't want to criticize them. This forces the Knowledge Norm proponent to lean heavily on the **Permissibility vs. Blame** distinction (they violated the norm but are blameless), which some argue is ad hoc.

  ### Part 6: On Pluralism (Is it one norm?)
  You are right to be unsure about the "single norm" assumption. There are two viable pluralist exits:

  1.  **Constitutive vs. Regulatory:** Maybe there is a *constitutive* norm (what makes an act an assertion, e.g., Truth) and a *regulatory* norm (what makes it good, e.g., Knowledge). This allows you to say a lie is still an assertion (meets constitutive) but a bad one (violates regulatory).
  2.  **Contextual Pluralism:** Maybe the norm shifts based on the *purpose* of the conversation. In a courtroom, the norm might be Knowledge. In casual chat, it might be Reasonable Belief.
      *   *Pros:* Solves the Stakes and Bus/Lottery tensions easily.
      *   *Cons:* Risks making "assertion" too disunified. If the rules change too much, is it the same game?

  ### Summary for your Scorecard
  When you evaluate the theories (Knowledge, Truth, Belief, Justification), check them against this specific triad:

  1.  **Does it handle Lottery vs. Bus?** (Differentiates statistical from inductive/causal).
  2.  **Does it handle Selfless Assertion?** (Allows propriety without belief).
  3.  **Does it explain the Challenge?** ("How do you know?").

  *   **Truth Norm:** Fails Challenge & Lucky Truth.
  *   **Belief Norm:** Fails Selfless Assertion & Challenge.
  *   **Justification Norm:** Fails Lottery.
  *   **Knowledge Norm:** Fails Selfless Assertion (unless you accept blameless violation) & Bus (if you deny inductive knowledge).

  If you keep the **Permissibility/Blame** distinction sharp, you can save almost any theory from fatal counterexamples, but you pay for it in complexity. That is likely where your section arguments are getting stuck: students are arguing about *blame* ("I wasn't wrong to say it!") while you are arguing about *propriety* ("But you didn't know it!"). Explicitly separating those two columns on the board might save your next section.
