prompt: |-
  I'm a TA for an intro epistemology course this term and I keep getting dragged into arguments after section about what you're actually allowed to assert. It started as a dumb joke — a student said you can only say something if you know it, and I said that can't be right, I say stuff I'm only pretty sure about all the time, like that my bus will be late, and then we burned the whole hour on it. Now I genuinely care and I want to figure out what a theory of the norm of assertion even has to *do* before I pick a side, because every time I read about it people just gesture at the lottery case and Moore's paradox and call it a day, and I don't feel like I've learned anything about the actual standard.

  So write me the desiderata a theory of the norm of assertion has to meet. Not the theory itself — the checklist. Which cases does it have to get right? The ones where asserting a falsehood feels like a lie, the ones where it feels totally fine, the selfless-assertion cases where you don't even believe what you're saying but it's clearly OK (I think the classic one is a dying person reassuring family, or a lawyer defending a client they think is guilty), assertions about the future, assertions where your audience will predictably misread you even though you're right, and cases where two people with the exact same evidence assert opposite things and neither seems to deserve any criticism. Which distinctions can't it collapse — between the norm governing whether it's *permissible* to assert and the norm governing when you deserve blame for asserting, between what makes an assertion improper and what makes it false, between the standard for the speaker and the standard for the hearer who takes your word for it, between asserting and merely implying? And what background constraints does it have to respect — that assertion is a move in a cooperative game where hearers rely on you, that it's something you can do insincerely on purpose, that the bar seems to shift with the stakes, that it's supposed to be the thing that transmits knowledge through testimony? For each requirement give me the case or consideration behind it, and flag which are non-negotiable versus just preferences of one camp.

  Then tell me which requirements you think can't be jointly satisfied — I have a hunch the one that makes the lottery case come out right is going to fight with the one that lets me say my bus will be late — and which single requirement does the most work of ruling out the popular candidates (knowledge norm, truth norm, belief norm, some justification or credence norm). I'll do the scorecard myself, I just want the spec first. And if I'm wrong that it has to be one single norm at all — maybe different norms kick in for different contexts or different audiences — say so, thats the part I'm most unsure about.
