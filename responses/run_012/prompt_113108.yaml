answer: |-
  1. **The Speech Act Analogy**
  You often compare reading a text to listening to a speaker, but in conversation, if a listener completely misses the speaker's point, we usually say communication has failed; does your view imply that a text possesses a determinate meaning even if every actual reader misunderstands it, and if so, doesn't that sever the link between meaning and communication?
  *Follow-up:* If meaning exists without uptake, are you defining it as a private mental state rather than a public function of language?

  2. **The Secret Intention**
  If an author leaves a private diary entry that clarifies a poem but burns it before dying, does the poem's meaning change depending on whether we find the ashes, or is the meaning fixed regardless of our epistemic access?
  *Follow-up:* If it is fixed regardless of access, isn't the "meaning" you're defending functionally indistinguishable from a mystery we can never solve?

  3. **Irony and Textual Resistance**
  In cases of heavy irony, the text seems to assert the opposite of the intention; how do you distinguish between a successful ironic intention and a failed literal one without relying on the reader's suspicion that the surface meaning is too absurd to be sincere?
  *Follow-up:* So is the "textual resistance" constraint actually just a measure of how plausible the reader finds the author's sophistication?

  4. **The Humpty Dumpty Worry**
  You say intentions must be realized in the text, but if an author decides "dog" means "cat" throughout a manuscript, at what point does the public language override that private stipulation, and who decides where that line is?
  *Follow-up:* If the public language sets the limit, isn't the convention doing the meaning-work rather than the intention?

  5. **Collective and Posthumous Authorship**
  When a text is revised by an editor after an author's death, or written by a committee, does the meaning become fragmented, and if so, is there a single determinate meaning for the work at all?
  *Follow-up:* If there's no single meaning, does your theory apply only to a specific historical mode of solitary authorship?

  6. **Machine-Generated Prose** **[FLAGGED FOR RETREAT RISK]**
  If a machine generates a text indistinguishable from a human poem, does it lack literary meaning entirely on your account, and if it does, what are we analyzing when we find patterns in it?
  *Follow-up:* If we are analyzing something other than meaning, have you effectively exiled a large portion of contemporary textual engagement from your theory?

  7. **Semantic vs. Categorical Intentions**
  You distinguish between intentions about what words mean and intentions about what kind of thing is being made; if an author intends a satire but the text reads perfectly as a sincere tribute, does the work fail as satire or succeed as tribute?
  *Follow-up:* If it succeeds as tribute, hasn't the categorical intention failed to fix the nature of the work despite being realized in the text?

  8. **The Spectrum of Resistance**
  You treat the text's resistance to intention as a matter of degree rather than kind; is there any principled way to measure that degree, or does it rely on an intuitive judgment that varies from critic to critic?
  *Follow-up:* If it relies on intuition, isn't the "constraint" of the text just as subjective as the reader's interpretation?

  9. **The Deflection Concession (What Remains?)**
  Let's grant your point that no serious intentionalist demands the text obey impossible commands; once we clear that bar, what positive work is the intention doing that the text's own resources aren't already doing?
  *Follow-up:* If the text already bears the meaning, isn't the intention merely historical context rather than a constitutive part of the meaning itself?

  10. **The Deflection Concession (The Tie-Breaker)**
  If intention only settles the matter where the text can bear multiple meanings, does your view collapse into a rule for breaking ties rather than a full theory of meaning?
  *Follow-up:* If it is just a tie-breaking rule, why insist it *fixes* meaning rather than just *explains* it?

  11. **The Deflection Concession (Author vs. Reader)**
  If we accept that the text allows for multiple valid readings, why does the author's preference win the tie-breaker over a reader who has found something more coherent or interesting?
  *Follow-up:* Does this privilege the origin of the text over the utility of the text for those who actually engage with it?

  12. **Falsification Conditions** **[FLAGGED FOR RETREAT RISK]**
  Setting aside misunderstandings of your view, what specific textual phenomenon or logical argument would compel you to abandon actual intentionalism?
  *Follow-up:* If no such case exists, is the theory insulated from criticism by design?
