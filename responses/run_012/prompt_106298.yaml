      *   *Alternative:* A **hologram**. It looks 3D from many angles (generalization) but isn't solid (grounding).
      *   *Selection:* The **Flight Simulator** is strong for "function without reality." The **Lossy Compression of the Internet** is strong for "structure without grounding." Let's go with **Lossy Compression that acts as a World Model**. Or perhaps a **Universal Approximator**.
