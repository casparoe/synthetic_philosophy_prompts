  I'm in a reading group on rationality -- mix of philosophers and ML people -- and we keep re-litigating whether satisficing is a genuine alternative to maximizing or just maximizing with extra steps. I've stopped trusting the standard story (the one where the aspiration level is set by past experience and drifts up and down with success and failure); it describes how people happen to set their bars, but it doesn't tell me when the bar is set *right*, and that's the part I actually want. So I've been collecting my own gut verdicts on cases and I want you to tell me what principle, if any, they add up to. Please treat me as someone who knows the vocabulary and wants the reconstruction done properly, not a summary of the literature -- and skip the names and dates entirely, I don't want citations or reading lists, I want the argument. Think carefully before committing; my hunch is that a naive principle will look great for six of these and then fall over on the seventh, and I'd rather you find that yourself than paper over it.

  Here are the verdicts. My roommate announced in advance that she'd take the first apartment with a dishwasher, under $1800, and a commute under 30 minutes, and then she did exactly that without seeing the remaining fifteen listings -- I think that's fine, genuinely fine, not a compromise. I did the same thing but arrived at it differently: I saw one great apartment and then decided I was done, and even though I ended up in an identical place I feel uneasy about it, like I rationalized a stopping rule after the fact rather than committing to one. A friend spent forty minutes choosing a $12 dish off a menu and I think that's a small failure. A doctor who stops at the first plausible diagnosis when two cheap, decisive tests are sitting right there is doing something wrong, but a triage nurse with forty people waiting and no test available who treats on the first plausible hypothesis is doing exactly the right thing. A chess player who never trades a bishop for a knight in the opening is being rational, even though the rule is sometimes flatly wrong, and a model-serving system that routes easy queries to a cheap model and hard ones to a big one, and sometimes misroutes a hard one, is being rational too. Someone who eats the same lunch every day to avoid deciding is being rational, but the same person who hasn't looked at their retirement allocation in fifteen years is not, and I can't articulate why those two are different when they look like the same economizing move. And someone who tries to decide how long to deliberate by deliberating about that, and never terminates, is being irrational -- though I notice my principle might apply to itself here, which worries me. My friend's proposal is that there are two different things going on and only one of them is respectable: satisficing over the option you end up with (which he thinks is just a mistake with a nice name) versus satisficing over the search (which he thinks is the real thing). I don't know if that cut survives the cases. My own tentative principle is that a choice is rational iff no alternative use of your cognition would have done better, counting the cost of the cognition itself -- so you maximize expected value net of the thinking, and satisficing is just what that looks like when search is expensive. If that's right, though, I can't tell whether satisficing and bounded rationality are substantive claims or whether I've defined rationality as rationality. Test it and repair it. The case I keep flip-flopping on: a hiring manager who stops at the first candidate who's clearly good enough, in a market where the next candidate might be much better -- my verdict flips depending on whether I imagine the search as costly or free, and I want to know if that flip is a fact about the case or a fact about me.

  Give me the response in these sections, in this order, with roughly these lengths. **Restatement** (~100 words): my cases and verdicts back in your own words, and flag anything I stated ambiguously enough that my verdict doesn't determine what I meant. **What's doing the work** (~150 words): before proposing anything, brainstorm the candidate features -- cost of error, reversibility, cost of search, whether the rule was chosen ex ante or rationalized ex post, whether the rule is itself periodically revisable -- and say which you think carry real weight and which are my confusions dressed up as distinctions. **Candidate principles** (~400 words): two to four principles stated precisely enough to disagree with, each with the specific case that motivates each clause, and for each one, which of my verdicts it has to overturn. **Stress test** (~400 words): run the survivors against the pairs I can't reconcile -- the two apartments, the two doctors, the lunch versus the retirement allocation, and the regress case -- and say plainly where each principle breaks. **New cases** (~300 words): your verdicts on three cases I didn't give, at least one of which tests whether your principle can apply to the activity of applying it. **My verdict** (~250 words): the principle you'd actually adopt, which of my verdicts I have to give up, and if the honest answer is that satisficing isn't a distinct principle at all, say so in the first sentence rather than the last.
