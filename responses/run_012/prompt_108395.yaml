answer: |-
  # THE COMMEMORATION REVIEW PROCEDURE

  **To:** The Commemoration Review Committee
  **From:** Student Representative
  **Subject:** Operating Procedure for Commemoration Requests
  **Date:** October 26, 2023

  ## PART 1: THE ONE-PAGE HEARING SCRIPT
  *(Read this aloud at the start of every hearing. It guides the public and the committee through the steps.)*

  **Welcome.** This committee does not vote based on who speaks loudest or last. We follow a fixed procedure to decide if a monument, name, or plaque stays, goes, or changes. We have sixty days to finish a case. We begin with five questions.

  **STEP 1: STANDING & COMPLETENESS**
  *   **Question:** Did the petitioner follow the rules, and do they have a right to ask?
  *   **Rule:** Petitions must come from property owners, descendants, recognized neighborhood groups, or tribal nations. Anonymous complaints are rejected.
  *   **If No:** Case Closed.
  *   **If Yes:** Move to Step 2.

  **STEP 2: WHAT IS THIS THING?**
  *   **Question:** Is this an **Honor** (statue, named building), a **Record** (grave marker, battle site), or an **Address** (street name used mostly for mail)?
  *   **Rule:**
      *   **Honors** must match current City values.
      *   **Records** must be accurate and contextualized.
      *   **Addresses** are presumed to stay unless they cause active harm.
  *   **[JUDGMENT CALL]:** The Committee decides the category by majority vote.
  *   **Move to Step 3.**

  **STEP 3: WHAT IS THE HARM?**
  *   **Question:** Is the city *currently* endorsing harm, or is this about history?
  *   **Rule:**
      *   If the object says the City supports racism, oppression, or falsehoods *today*, it fails.
      *   If the object honors a person who did bad things, but the object itself doesn't preach those things, it may stand.
      *   If the objection is only that "this person was flawed," that is not enough for removal.
  *   **[JUDGMENT CALL]:** The Committee decides if the harm is "Active Endorsement" or "Historical Fact."
  *   **If Active Endorsement:** Move to Step 4 (Removal/Change likely).
  *   **If Historical Fact:** Move to Step 4 (Retention likely).

  **STEP 4: IS THERE A MIDDLE PATH?**
  *   **Question:** Can we fix the problem without destroying the object or erasing the name?
  *   **Options:** Add a sign, move the statue to a museum, rename the building but keep the street, retire the name to a historical plaque.
  *   **Rule:** If a middle path solves the "Active Endorsement" problem, we must choose it.
  *   **If Yes:** Draft Recommendation.
  *   **If No:** Move to Step 5.

  **STEP 5: THE VOTE**
  *   **Question:** Does keeping this violate our City's core values enough to warrant the cost of change?
  *   **Rule:** A simple majority (5 of 9) decides.
  *   **Outcome:** Recommendation sent to City Council.

  ***

  ## PART 2: THE FULL PROCEDURE & REASONING
  *(This document is for the record. It explains why the steps exist, where they might fail, and how to use them.)*

  ### PREAMBLE: THE PRESUMPTION
  This procedure rests on one difficult choice: **We presume in favor of stability for Addresses, but in favor of integrity for Honors.**
  *   **Street Names:** Changing a street name costs money, confuses emergency services, and frustrates residents. We do not change them lightly. We assume a street name is a "Address" unless it is clearly being used to "Honor."
  *   **Monuments/Statues:** These exist solely to honor or record. They have no functional use. We assume a monument must justify its place in public space.

  ### STEP 1: STANDING & COMPLETENESS
  **Purpose:** To prevent the committee from being overwhelmed by random complaints and to ensure those affected have a voice.
  **Sufficient Answer:** A signed form from a qualified petitioner (owner, descendant, group).
  **Failure Point:** This step excludes general taxpayers who care deeply but live outside the immediate zone. It prioritizes proximity over principle.
  **[JUDGMENT CALL]:** Deciding if a group is "recognized." (Use City Clerk's list).

  ### STEP 2: WHAT IS THIS THING? (CATEGORIZATION)
  **Purpose:** To separate functional infrastructure from symbolic speech.
  **Distinctions:**
  1.  **Honor:** A statue, a school name, a park name. Purpose: To say "This person/idea is good."
  2.  **Record:** A grave marker, a battlefield plaque, a list of names. Purpose: To say "This happened."
  3.  **Address:** A street name used primarily for navigation and mail. Purpose: To say "Where is this?"
  **Sufficient Answer:** Committee vote on category.
  **Failure Point:** A street name can be both an Address and an Honor. If the Committee votes "Address," it becomes very hard to remove. If they vote "Honor," it becomes easier. This is the biggest leverage point in the procedure.
  **[JUDGMENT CALL]:** Determining if a name has "commemorative work left in it." (Ask: Do residents know who this was? Is there a plaque?)

  ### STEP 3: WHAT IS THE HARM? (THE OBJECTION TEST)
  **Purpose:** To distinguish between "This person was bad" and "This monument is harmful."
  **Distinctions:**
  1.  **Objection to Person:** The honoree did bad things. (Does not automatically require removal).
  2.  **Objection to Assertion:** The monument claims a lie (e.g., "The war was not about slavery"). (Requires removal or correction).
  3.  **Objection to City Endorsement:** The City keeping this up looks like support for the bad thing. (Requires removal or context).
  **Sufficient Answer:**
  *   **For Removal:** Must prove Active Endorsement of harm (racism, oppression) OR that the Record is factually false.
  *   **For Retention:** Proof that the harm is historical, not current, or that the object serves a neutral function (Address/Record).
  **Failure Point:** This step assumes the Committee can agree on what counts as "harm." It cannot resolve deep moral disagreements, only categorize them.
  **[JUDGMENT CALL]:** Deciding if a harm is "Active" or "Historical." (Test: Would a new monument with this message be allowed today?)

  ### STEP 4: IS THERE A MIDDLE PATH? (MITIGATION)
  **Purpose:** To avoid the binary of "Keep" vs. "Destroy."
  **Options:**
  *   **Reinterpret:** Add signage explaining the controversy.
  *   **Relocate:** Move to a museum or cemetery.
  *   **Counter-Marker:** Add a new monument nearby telling the other side.
  *   **Retire:** Remove the name from the building, keep it on a historical list.
  **Sufficient Answer:** A specific plan with a budget estimate.
  **Failure Point:** "Adding context" can be a way of avoiding a decision. If the harm is severe, context is not enough.
  **[JUDGMENT CALL]:** Deciding if context is "genuine resolution" or "delay tactic." (Test: Does the context change how a reasonable person reads the monument?)

  ### STEP 5: THE VOTE
  **Purpose:** To acknowledge that some questions are about values, not facts.
  **Rule:** 5 of 9 votes.
  **Failure Point:** A 5-4 vote creates a recommendation that half the community rejects. This is unavoidable in a democracy.

  ***

  ## PART 3: CASE STUDIES
  *(Running the procedure on the three current requests.)*

  ### CASE 1: PEMBERTON AVENUE
  **Facts:** Named 1911. Honors Dr. Pemberton (Library donor, Clinic founder). Also sponsored 1890s sterilization bill.
  **Petition:** Remove name due to eugenics legacy.

  **Step 1 (Standing):** Neighborhood association filed. **PASS.**
  **Step 2 (Category):** Is it Honor or Address?
  *   *Discussion:* It was an honor in 1911. Today, residents use it for mail. There is no statue.
  *   *Committee Vote:* 5-4 vote classifies it as an **Address**. (Majority argues daily function outweighs historical honor).
  **Step 3 (Harm):**
  *   *Analysis:* Does the name "Pemberton" assert that sterilization is good *today*? No. It is a historical label. The City is not actively asserting eugenics policy by keeping the sign.
  *   *Finding:* Harm is Historical, not Active Endorsement.
  **Step 4 (Middle Path):**
  *   *Option:* Add historical markers at the library/hospital (which he also founded) rather than renaming the street.
  **Step 5 (Vote):**
  *   *Question:* Does keeping the name violate City values enough to cost the budget for renaming?
  *   *Procedure Logic:* Because Step 2 classified it as an **Address**, the presumption is *Stability*. The burden of proof is on the petitioner to show *Active Harm*. They showed *Historical Harm*.
  *   **Recommendation:** **RETAIN NAME.** Install interpretive plaques at the Library and Hospital regarding Dr. Pemberton's full history.

  **Why this outcome might be disliked:** As a student representative, you may feel that keeping the name of a eugenicist on a public street legitimizes his actions. However, the procedure forces this result because it distinguishes between a "Bare Address" and an "Honor." By voting it an Address in Step 2, the procedure protects it from removal unless active harm is proven. This is the "stability vs. justice" trade-off built into Step 2.

  ### CASE 2: THE SOLDIER ON THE COURTHOUSE LAWN
  **Facts:** Bronze infantryman (1908). Lists local war dead. Inscription praises "The Cause."
  **Petition:** Remove monument as Confederate propaganda.

  **Step 1 (Standing):** Local civil rights group filed. **PASS.**
  **Step 2 (Category):** Is it Honor or Record?
  *   *Discussion:* It lists names of the dead. It is also a statue honoring the soldier.
  *   *Committee Vote:* Classified as **Hybrid (Honor + Record)**.
  **Step 3 (Harm):**
  *   *Analysis:* The *statue* (soldier) is generic. The *inscription* ("The Cause") asserts a political view (Lost Cause mythology) that contradicts current City values (equality).
  *   *Finding:* Active Endorsement of harmful ideology via the inscription.
  **Step 4 (Middle Path):**
  *   *Option:* Remove the inscription? Difficult on bronze. Relocate to cemetery?
  *   *Proposal:* Keep the statue as a grave marker for the names listed. Add a large, permanent interpretive sign explaining the "Cause" inscription is a historical artifact of 1908 racism, not current City policy.
  **Step 5 (Vote):**
  *   *Question:* Is context enough?
  *   *Procedure Logic:* Because it serves as a **Record** of the dead, total removal erases their memory. Because it is an **Honor**, the inscription must be neutralized.
  *   **Recommendation:** **RETAIN MONUMENT WITH CONTEXT.** Add signage explicitly repudiating the "Cause" inscription while honoring the individuals listed by name.

  **Reasoning:** The procedure saves the artifact because it functions as a grave marker (Record), but forces the City to disavow the ideology (Honor).

  ### CASE 3: FENN STREET
  **Facts:** Named 1889 by developer for his daughter. No commemorative weight. Neighborhood wants to rename for a Civil Rights organizer (deceased 2 years ago).
  **Petition:** Rename street.

  **Step 1 (Standing):** Neighborhood group filed. **PASS.**
  **Step 2 (Category):** Honor or Address?
  *   *Discussion:* Named for a developer's daughter. No public honor intended. Purely functional.
  *   *Committee Vote:* Classified as **Address**.
  **Step 3 (Harm):**
  *   *Analysis:* Is "Fenn" harmful? No.
  *   *Constraint:* This is a request to **ADD** an honor (the Civil Rights organizer), not just remove a bad one.
  *   *Rule for Adding:* New honors must serve the *whole City*, not just one neighborhood.
  *   *Finding:* The honoree is local, but the street is a City asset.
  **Step 4 (Middle Path):**
  *   *Option:* Name a park or a school after the organizer instead.
  **Step 5 (Vote):**
  *   *Question:* Does this meet the bar for a City Street Name?
  *   *Procedure Logic:* The procedure presumes *against* changing Addresses for functional reasons. Since "Fenn" causes no harm, the burden is on the *new* name to justify the cost and confusion. A neighborhood request does not meet the "City-Wide Value" threshold for a new honor.
  *   **Recommendation:** **DENY RENAME.** Recommend the City find a different venue (Park/School) to honor the organizer.

  **Reasoning:** The procedure distinguishes between "Removing Harm" and "Adding Honor." Removing harm (if proven) justifies cost. Adding honor requires higher justification. Since Fenn is not harmful, the request fails the cost-benefit analysis of Step 5.

  ***

  ## PART 4: LIMITATIONS & FAILURE POINTS
  *(What this procedure cannot do.)*

  **1. It Cannot Resolve Moral Truth.**
  If five committee members believe Dr. Pemberton's medical good outweighs his legislative evil, and four believe the evil disqualifies the good, the procedure ends with a vote. It does not tell you who is *right*, only how to decide.

  **2. It Cannot Fix "Death by a Thousand Cuts."**
  A group could petition to rename every street in a neighborhood one by one. The procedure handles cases individually. It cannot see the pattern of harassment until it is too late.

  **3. It Relies on the "Address vs. Honor" Distinction.**
  This is the weakest link. If the Committee is inconsistent here (e.g., calling Pemberton an "Address" but Fenn an "Honor"), the procedure becomes arbitrary. You must be rigorous in Step 2.

  **4. It Cannot Prevent Injustice.**
  It is possible to run every step correctly and recommend keeping a monument that a marginalized community experiences as a daily threat. Procedure ensures *process*, not *outcome*. If the Committee votes 5-4 to keep a monument, the procedure is satisfied, even if the community is wounded.

  **5. The "Context Trap."**
  Step 4 encourages adding signs. Sometimes, a sign is ignored. The procedure might recommend "Add a Sign" to solve a problem that requires "Remove the Statue." The Committee must be honest in Step 4: if context won't work, admit it.

  ### FINAL NOTE TO THE COMMITTEE
  This procedure is a tool, not a shield. It will not protect you from anger. It will not guarantee you are morally correct. It guarantees only that you asked the same questions for the veteran's monument as you did for the street name. That consistency is the only solid ground you have. Use it.
