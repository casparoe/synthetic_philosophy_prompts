answer: |-
  Here are 10 questions designed to prevent a standard re-delivery of the talk. Each includes a follow-up calibrated to her most likely evasive maneuver.

  ### 1. The Index Composition (Measurement)
  **Question:** The Gender Gap Index you rely on is a composite measure. It weights political representation and health outcomes heavily—variables that don't directly constrain a 17-year-old choosing a university major. If the correlation is driven by components unrelated to educational access, isn't it possible the "egalitarian" label is doing no causal work in your model?

  **Likely Answer:** She will likely argue that the index correlates with overall development and freedom, so it acts as a valid proxy for social liberty.
  **Follow-up:** "If it's just a proxy for development, why not use GDP or educational spending directly? If the mechanism is 'freedom reveals biology,' we need to know *which* freedom. If political representation drives the score but not the choice, aren't you essentially finding a spurious correlation between women in parliament and women in engineering?"

  ### 2. The Denominator Problem (Share vs. Rate)
  **Question:** Your primary outcome is the *share* of STEM graduates who are women, not the *rate* of women per capita entering STEM. In countries with low overall graduation rates, the women who do graduate are a highly selected elite. Are you confident you aren't comparing a self-selected group of career-driven women in developing nations against a general population in Scandinavia?

  **Likely Answer:** She will likely say they control for GDP or overall enrollment rates in their regressions.
  **Follow-up:** "Controlling for the national enrollment rate doesn't fix the selection bias within the pool of graduates. If the women graduating in Country A are the top 5% of achievers seeking economic security, and in Country B they are the top 50% following interest, the psychological profiles of those two groups aren't comparable. How do you disentangle selection effects from preference effects without individual-level longitudinal data?"

  ### 3. The Substitution Story (Opportunity Structure)
  **Question:** Consider the substitution effect: in economies with weak safety nets, STEM is a high-security, high-income bet. In wealthy welfare states, humanities or arts are viable career paths. If women in rich countries are choosing non-STEM fields because they *can* afford to follow weaker labor-market signals, doesn't that explain the paradox without invoking innate differences in mathematical aptitude or interest?

  **Likely Answer:** She will likely argue that "interest" measures (like PISA enjoyment of science) show the same pattern, not just job choices.
  **Follow-up:** "But 'enjoyment' at age 15 is also shaped by perceived opportunity. If I know I *need* a high income to survive, I might report higher enjoyment of subjects that lead there. If the 'interest' gap widens exactly as the economic necessity narrows, isn't that consistent with preferences being adaptive to structure rather than revealed by it?"

  ### 4. The Timing of the Gap (Child Penalty)
  **Question:** Recent data suggests the gender earnings gap in egalitarian countries explodes specifically after the birth of the first child, not at career entry. If the major divergence happens a decade after degree choice, why are we focusing so heavily on teenage subject selection as the primary driver of inequality?

  **Likely Answer:** She will likely suggest that women anticipate these penalties and self-select out of demanding careers early.
  **Follow-up:** "Do we have evidence that 17-year-olds are accurately forecasting specific HR policies and long-hours premia in their future industries? If they aren't, then attributing the adult earnings gap to teenage 'choice' ignores the structural constraints that hit a decade later. Why locate the cause in the girl rather than the workplace?"

  ### 5. Means vs. Tails (Distribution)
  **Question:** Your data focuses on average differences in preferences or traits. However, most policy concerns about representation focus on the tails—the top 1% of earners or innovators. Even if the averages differ, the variance within sexes is huge. Why should average differences dictate our expectations for representation at the extreme ends of the distribution?

  **Likely Answer:** She will likely argue that small shifts in the mean produce large shifts in the tails (the variance ratio effect).
  **Follow-up:** "That holds only if the distributions are normal and the selection is purely meritocratic on that specific trait. If the selection process for the top 1% involves networking, bias, or structural barriers, the tail outcome isn't a clean readout of the mean difference. Are you claiming the lack of women at the very top is a mathematical inevitability, or a policy choice?"

  ### 6. Falsification (The "Empirical" Dodge)
  **Question:** You often frame this as purely an empirical matter—letting the data speak. But to be scientific, a hypothesis must be falsifiable. What specific data pattern, if found tomorrow, would convince you that the gender-equality paradox is *not* evidence of biological constraints on preference?

  **Likely Answer:** "It's an empirical question; we need more data to be sure." (The Dodge)
  **Follow-up:** "I understand we always need more data, but if the answer to every counter-argument is 'more research,' the claim becomes unfalsifiable. If you found a country with high equality and *small* differences, would that change your mind? Or would you say that country is an outlier? I need to know what evidence counts *against* your theory, not just what counts for it."

  ### 7. Normative Implications (Is vs. Ought)
  **Question:** Let's grant for the sake of argument that some average differences in interest are partly innate. What follows for justice? If the injustice lies in how work is organized—such as the expectation of 60-hour weeks for leadership—doesn't focusing on 'fixing' women's choices let institutions off the hook for accommodating a wider range of human preferences?

  **Likely Answer:** She will likely say she is a scientist, not a politician, and just reports the facts.
  **Follow-up:** "But these facts are deployed in policy debates to argue against intervention. If you report a biological explanation without equally emphasizing that the 'problem' might be rigid job structures, you are implicitly endorsing the status quo. Can you separate the scientific claim from its political utility when the two are so tightly bound?"

  ### 8. Within-Country Variation
  **Question:** You compare across nations to infer causality. But within any single nation, there is massive variation in gender norms by region or class. Have you tested whether the 'paradox' holds within countries? If a conservative region and a liberal region in the same nation show different gaps, that would control for the national institutions you can't measure.

  **Likely Answer:** She will likely say national-level data is more reliable or that within-country data is noisy.
  **Follow-up:** "If the effect disappears within countries where institutions are constant, that suggests the national index is picking up cultural or economic confounds, not a universal biological release. Why should we trust the cross-national correlation more than the within-national comparison where the 'equality' variable is more precise?"

  ### 9. Defining "Freedom" (Negative vs. Positive Liberty)
  **Question:** Your theory assumes that 'egalitarian' countries offer more freedom to express innate preferences. But if 'freedom' means freedom from economic risk, then rich countries offer that. If 'freedom' means freedom from gendered socialization, are we sure that's higher in Scandinavia? Could it be that gendered socialization is just more subtle, not less?

  **Likely Answer:** She will likely point to self-report measures of empowerment or legal rights.
  **Follow-up:** "Legal rights don't measure social pressure. If girls in Sweden are subtly steered toward 'people-oriented' roles by teachers or parents who think they are being progressive, that's still socialization. How do you distinguish between a 'free' choice and a choice shaped by a more sophisticated form of gendered expectation?"

  ### 10. Stability of the Effect
  **Question:** The strength of the gender-equality paradox seems to fluctuate depending on which year of data or which specific index version is used. If this is a fundamental biological signal released by equality, why is the statistical relationship so sensitive to minor changes in measurement or time period?

  **Likely Answer:** She will likely argue that social science is noisy and effect sizes vary, but the trend is robust.
  **Follow-up:** "Noise is expected, but if the sign or significance of the correlation flips with small specification changes, that indicates fragility. If the 'biological signal' is real, it should be the dominant factor, not one that appears and disappears depending on whether you control for oil exports or use the 2016 vs. 2020 index. How do we know this isn't just a specific artifact of a specific dataset?"
