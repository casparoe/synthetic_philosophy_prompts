answer: |-
  # Seminar Game: The Jury Room
  **Topic:** Condorcet's Jury Theorem (CJT) & Its Failures
  **Time:** 90 Minutes
  **Participants:** 16 Students
  **Materials:** 
  *   1 Standard Deck of Playing Cards (remove Jokers).
  *   16 Small Envelopes (or folded paper).
  *   Whiteboard & Markers.
  *   3 "Agent Instruction" Slips (index cards).
  *   1 Large "Public Evidence" Card (Red).

  ## Core Mechanics
  *   **The Truth:** In every round, there is a binary state of the world: **Black** or **Red**.
  *   **The Signal:** Each student draws one card from a prepared envelope. Black = Signal for Black; Red = Signal for Red.
  *   **The Vote:** Students publicly announce their vote (Black or Red).
  *   **The Payoff:** The group earns **10 Points** if the **Majority Vote** matches the **Truth**. 0 Points otherwise. (Aligns incentives with truth-tracking, not conformity).
  *   **The Rule:** In Rounds 1 & 2, you **must** vote the color of your card (Sincerity). In Round 3, you may deliberate and change your vote.

  ---

  ## Preparation (Do this before class)
  You need three "Decks" of 16 cards, sorted into envelopes.

  1.  **Deck A (High Competence):** 12 Black, 4 Red. (Individual competence $p = 0.75$).
  2.  **Deck B (Low Competence):** 4 Black, 12 Red. (Individual competence $p = 0.25$).
  3.  **Deck C (Deliberation):** 12 Black, 4 Red. (Same as A).
      *   *Crucial:* Take the 4 Red cards from Deck C. Mark the back of 3 of them with a tiny dot. These are the **Agent Cards**.
  4.  **Truth Selection:** Decide the Truth for each round beforehand.
      *   Round 1 Truth: **Black**
      *   Round 2 Truth: **Black**
      *   Round 3 Truth: **Black**
      *   *(Keeping Truth constant reduces cognitive load; the variable is the signal structure).*

  ---

  ## Session Timeline (90 Minutes)

  ### 0:00 – 0:10 | Introduction & Setup
  *   **Seating:** Arrange 4 tables of 4 students (or 4 distinct corners). Label them Table 1, 2, 3, 4.
  *   **Instructions:** 
      *   "We are a jury. There is a Truth (Red or Black). You will get a private signal (a card)."
      *   "Your goal is Group Points. You get points only if the **Majority Vote** matches the **Truth**."
      *   "Round 1 & 2 Rule: You **must** vote the color of your card. No discussion."
  *   **Distribution:** Hand out envelopes from **Deck A**. Tell them: "These signals come from a reliable source."
  *   **Secretly:** Ensure the 3 students with "Agent Cards" (marked Red cards) know to keep the mark hidden. Hand them a slip under the table: *"You are a 'Confident Dissenter'. Your card is Red. You believe the Truth is Red. In Round 3, argue aggressively that the Black signals are a systematic error. Do not reveal you have an instruction."*

  ### 0:10 – 0:35 | Round 1: The Aggregation Miracle ($p > 0.5$)
  *   **Action:** Students open envelopes. (Most see Black, some Red).
  *   **Voting (Sequential Reveal):** 
      1.  **Table 1:** Hold up cards. You count the majority. Write "T1: [Color]" on board.
      2.  **Table 2:** Hold up cards. Count combined T1+T2 (8 people). Write "T1+2: [Color]".
      3.  **Table 3 & 4:** Repeat. Finally, write "All 16: [Color]".
  *   **Reveal Truth:** "The Truth was **Black**."
  *   **Score:** If "All 16" was Black, award 10 points.
  *   **Observation:** Likely, individual tables might have had a Red majority (due to variance in small $n$), but the full group of 16 almost certainly had a Black majority.
  *   **Feeling:** "The noise cancelled out. The crowd was wiser than the sub-groups."

  ### 0:35 – 0:55 | Round 2: The Anti-Miracle ($p < 0.5$)
  *   **Setup:** Collect cards. Distribute **Deck B** envelopes.
  *   **Crucial Script:** "This time, your signal source is **flawed**. It is systematically biased against the truth. But you don't know which way. You must still vote your card."
  *   **Action:** Students open envelopes. (Most see Red, few Black).
  *   **Voting:** Same Sequential Reveal (T1, T1+2, All 16).
  *   **Reveal Truth:** "The Truth was **Black**."
  *   **Outcome:** The Majority will be Red. The group loses.
  *   **Observation:** As $n$ increased (from 4 to 16), the confidence in the *wrong* answer increased. The margin of error grew.
  *   **Feeling:** "More people didn't help; it made us confidently wrong."

  ### 0:55 – 1:20 | Round 3: The Independence Failure (Deliberation)
  *   **Setup:** Collect cards. Distribute **Deck C** envelopes (12 Black, 4 Red).
  *   **Crucial Script:** "Your signals are reliable again ($p=0.75$). **However**, you are now allowed to deliberate for 5 minutes before voting. You may change your vote."
  *   **The Trap:** Place the **Large Public Red Card** on the central table. Say: "This is a piece of public evidence found at the scene. Consider it."
  *   **Action:** 
      1.  Students open envelopes. (12 have Black, 4 have Red).
      2.  The 3 "Agents" (who have Red cards) see the Public Red Card.
      3.  **Deliberation:** Agents say: "Look, my card is Red, and the Public Evidence is Red. The Black cards must be the error."
      4.  Because the Agents are confident and have "corroborating" public evidence, they often sway 2-3 Black-card holders.
  *   **Voting:** Take a final vote.
  *   **Reveal Truth:** "The Truth was **Black**."
  *   **Outcome:** If Agents succeed, Majority turns Red. Group loses.
  *   **Feeling:** "Talking made us dumber. We ignored our private info because of social pressure/common signals."

  ### 1:20 – 1:30 | Debrief & Mapping
  Draw a 3-column table on the board. Ask students to fill it based on what happened.

  | Feature | Round 1 (Miracle) | Round 2 (Anti-Miracle) | Round 3 (Deliberation) |
  | :--- | :--- | :--- | :--- |
  | **Individual Competence** | $> 50\%$ (Better than chance) | $< 50\%$ (Worse than chance) | $> 50\%$ (Initially) |
  | **Independence** | Yes (Private draws) | Yes (Private draws) | **No** (Influenced by Agents/Public) |
  | **Result as $n$ grows** | Accuracy $\to 100\%$ | Error $\to 100\%$ | Accuracy Stalls/Drops |
  | **CJT Assumption** | **Satisfied** | **Violated (Competence)** | **Violated (Independence)** |

  **Key Takeaway Questions:**
  1.  "In Round 1, why did Tables 1-4 sometimes fail while the Whole Group succeeded?" (Variance vs. Convergence).
  2.  "In Round 2, why did adding more people make it *worse*?" (Garbage In, Garbage Out; $p < 0.5$ inverts the theorem).
  3.  "In Round 3, you had good signals. Why did you lose?" (Correlation of error. The Agents + Public Card created a 'shared cause' of error).

  ---

  ## Instructor's Cheat Sheet: Predicting Failure & Recovery

  **1. The "Luck" Problem (Round 1)**
  *   **Risk:** With $p=0.75$, a group of 4 has a ~68% chance of being right. It is possible all 4 tables get it right by luck, masking the aggregation benefit.
  *   **Recovery:** If everyone wins Round 1, point to the *margin*. "Table 1 won 3-1. The Whole Group won 12-4. The *confidence* increased even if the binary outcome didn't change."
  *   **Fix for next time:** Lower competence to 10 Black / 6 Red ($p=0.625$). This increases variance in small groups.

  **2. The "Rebellion" Problem (Round 2)**
  *   **Risk:** Students realize the signals are inverted and strategically vote the *opposite* of their card.
  *   **Recovery:** This is actually a teaching moment! "You just fixed the competence assumption by meta-reasoning. But CJT assumes sincere voting. If you have to strategize to fix the bias, the theorem doesn't apply automatically."
  *   **Prevention:** Emphasize the rule: "You are jurors, not strategists. Vote your evidence."

  **3. The "Quiet Room" Problem (Round 3)**
  *   **Risk:** The Agents are shy. No one talks. Independence holds. Group wins.
  *   **Recovery:** You step in as "Foreperson." "I notice there is dissent. The Public Evidence is Red. Can the Red card holders explain their view?" Prompt the Agents.
  *   **Prevention:** Pick the 3 Agents beforehand (choose the most vocal students). Give them the instruction slip *before* class starts.

  **4. The "Shared Cause" Nuance**
  *   **Limitation:** The game simulates correlation via social pressure. It doesn't perfectly model a "common noise source" (e.g., all jurors reading the same biased newspaper).
  *   **Verbal Supply:** In the debrief, explicitly link the "Public Red Card" to the Shared Cause assumption. "The Public Card acted like a biased newspaper. Even if your private signal was good, the common signal correlated your errors."

  ---

  ## What This Game Cannot Do (Be Honest Here)
  1.  **Asymptotics:** You cannot show $n \to \infty$. You stop at 16. You must explain verbally that the trend *continues*.
  2.  **Heterogeneity:** All students have the same $p$. Real juries have mixed competence. (Mention this in debrief: "CJT holds with average $p$, but outliers matter").
  3.  **Cost of Voting:** In the game, voting is free. In reality, gathering more voters costs resources. The "Miracle" isn't actually free.

  ## Materials Checklist
  *   [ ] 1 Deck of Cards (sorted into 3 sets of 16).
  *   [ ] 16 Envelopes.
  *   [ ] 3 Agent Instruction Slips.
  *   [ ] 1 Large Red Card (Construction paper).
  *   [ ] Whiteboard Markers (Black, Red, Blue).
  *   [ ] Timer (Phone).

  ## Final Note to Instructor
  The power of this session is not in the math, but in the **visceral shift**. 
  *   Round 1 feels like magic (chaos becomes order).
  *   Round 2 feels like dystopia (order becomes confident error).
  *   Round 3 feels like politics (truth loses to persuasion).
  Let them feel the frustration of Round 3. That frustration *is* the lesson on independence. Don't rescue them too quickly in the debrief; let them sit with the fact that they *chose* to be wrong.
