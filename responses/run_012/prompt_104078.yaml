prompt: |-
  Bottom line in your first sentence, then the reasoning, no throat-clearing. Alright, heres a thought experiment I want you to use for a punishment-theory seminar I'm TAing. Imagine a jurisdiction adopts what it calls the Mirror Sentence: for certain violent crimes, instead of prison the offender gets a temporary reversible neural implant that makes them live through the victims pain and fear during the offense, plus a few months of the aftermath, and then theyre released with a clean record. Its not optional and not painless, but it does fade. The designers missed something: the implant sometimes lays down false memories, so a handful of offenders come out remembering acts they never committed, and some victims families say the sentence just manufactures a second victim. I want you to sort the usual rationales into tiers by how well each can either justify the Mirror Sentence or give a principled reason to reject it. The rationales are desert/retributivism, general deterrence, incapacitation, rehabilitation, restorative justice, and denunciation/expressivism. One sentence each on why it lands where it does. Then say what would most likely flip your ranking -- what would have to be true about the implant or the offenders for your top tier to fall or your bottom tier to rise. Also flag where your reasoning is weakest.
