      *   User's idea: "offers to inflict whatever quantity of suffering I care to name."
      *   Problem: If *I* name the number, I am participating in the fantasy. It becomes a game. The horror of Pascal's Mugging is that the *world* might be structured this way regardless of my imagination. The mugger must assert the magnitude $X$ where $X$ is so large I couldn't have conceived it, but the math still holds.
