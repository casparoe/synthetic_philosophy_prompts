answer: |-
  ### 1. The Carrying Example

  **Assessment of your candidate:**
  You must discard the mechanic where the victim *names the quantity* of suffering or good. This is fatal to the pedagogy. If the victim sets the magnitude, the puzzle becomes about the limits of human imagination or the psychology of negotiation, rather than the structural problem of expected value (EV) with unbounded utility. It gives the agent a sense of control that dissolves the feeling of being "mugged" by the math. The mugger must assert the magnitude independently.

  **Selection:**
  Use the **Threat** version only. Do not present the Reward variant or the Matched Pair during the main session.
  *   **Why:** Loss aversion is psychologically stickier. A threat creates a sense of coercive urgency that makes the refusal to pay feel more like a violation of rationality (saving a life vs. missing a gain). The Reward version feels like a lottery ticket, which people are accustomed to ignoring; the Threat version feels like a moral catastrophe they are casually dismissing.
  *   **Why not the Pair:** Introducing both simultaneously invites the group to net them out or treat it as a game, diluting the singular pressure of the decision.

  **Specification:**
  *   **Must Contain:**
      1.  **A Fixed, Incomprehensible Magnitude:** The mugger asserts a specific number (e.g., "$3 \uparrow\uparrow\uparrow 3$ units of utility"). Do not let the group generate this number.
      2.  **A Trivial Cost:** The demand is $5.
      3.  **A Non-Zero Probability Justification:** The mugger offers a reason that is absurd but logically possible (e.g., "I am a being from a higher dimension"). You need the group to concede that the probability is *not zero*, merely tiny.
  *   **Must Conspicuously Lack:**
      1.  **Negotiation:** The terms are take-it-or-leave-it.
      2.  **Theological Resonance:** No mention of heaven, hell, or gods. Keep it secular/sci-fi to prevent the group from offloading the problem onto "religious faith."
      3.  **Emotional Detail:** Do not describe the suffering vividly. Keep it as "negative utility." Vivid description triggers emotional rejection that bypasses the calculation.

  ### 2. The Sequence and Dependencies

  You have 50 minutes. Do not deviate from this arc. The dependencies are strict: you cannot discuss the solution until they feel the pain of the problem.

  **Phase 1: The Commitment (0–10 mins)**
  *   **Goal:** Secure their commitment to Expected Value reasoning *before* the mugger arrives.
  *   **Action:** Run a trivial EV calculation (e.g., a lottery ticket with a huge jackpot and tiny odds). Ask: "Is it rational to buy this if the EV is positive?"
  *   **Dependency:** You must establish that **Small Probability $\neq$ Zero Probability** and **Rationality $\approx$ Maximizing EV** as their starting axioms. If they argue here that "tiny odds don't count," the puzzle is dead on arrival. You need them to agree that, in principle, a large enough payoff justifies a tiny risk.
  *   **Why wait:** If you introduce the distinction between "small" and "ignorable" now, you solve the puzzle before posing it. You need them to accept the premise that *mathematically*, the EV is positive.

  **Phase 2: The Mugging (10–20 mins)**
  *   **Goal:** Apply the commitment to the carrying example.
  *   **Action:** Present the Threat. Walk through the math. $P \times \text{Utility} > \$5$.
  *   **Dependency:** This only works if Phase 1 succeeded. They must feel the tension between "The math says pay" and "I will never pay."
  *   **Why wait:** Do not introduce the mugger until the EV norm is solidified. Otherwise, they will reject the mugger based on a vague intuition that they haven't yet committed to overriding.

  **Phase 3: The Diagnostic (20–35 mins)**
  *   **Goal:** Elicit and map the misconceptions.
  *   **Action:** Ask: "Who pays? Why not?"
  *   **Dependency:** You cannot discuss *why* they refuse until they have admitted the EV says they *should*.
  *   **Why wait:** If you anticipate their objections too early, you appear to be arguing against strawmen. Let them voice the misconceptions first.

  **Phase 4: The Structural Lesson (35–50 mins)**
  *   **Goal:** Shift from "Muggers" to "Decision Theory."
  *   **Action:** Explain that the mugger is just a vessel for the problem of **Unbounded Utility + Non-Zero Probability**.
  *   **Dependency:** This requires the misconceptions to be exhausted. You can only teach the distinction between "small" and "ignorable" once they have tried and failed to find a factual error in the mugger's claim.

  ### 3. The Misconception Map

  Here are the misconceptions in the order they will surface, when to head them off, and their classification.

  **1. The "Zero Credence" Dodge**
  *   **The Claim:** "The probability is effectively zero. I assign it 0."
  *   **Classification:** Misconception about the Puzzle (Epistemic).
  *   **When to Defuse:** **Immediately in Phase 3.** This is the most dangerous move. If you let this stand, the session ends.
  *   **How:** Remind them of Phase 1. Ask: "What evidence would change your mind? If you can name *any* evidence, your probability is not zero." Force them to admit it is $10^{-100}$, not $0$.
  *   **Why Timing Matters:** If you meet this too early (Phase 1), it seems like pedantic quibbling about priors. If you meet it too late (Phase 4), the puzzle has already dissolved. It must be met the moment they reach for it as a shield.

  **2. The "Utilitarian Scapegoat"**
  *   **The Claim:** "This is just a problem for Utilitarians. I'm not a utilitarian, so I don't care."
  *   **Classification:** Misconception about Decision Theory.
  *   **When to Defuse:** **Mid-Phase 4.** After they have tried to solve the mugger problem.
  *   **How:** Point out that the calculation relies on *Expected Value*, which is used by almost all decision theories (including common-sense risk management), not just utilitarianism. Even if they value their own life over others, the mugger can threaten *them* specifically with infinite torture.
  *   **Why Timing Matters:** If you address this too early, they will disengage ("Not relevant to me"). They must first feel the personal rational pressure before you generalize it.

  **3. The "EV Absolutist"**
  *   **The Claim:** "The math is the math. You *should* pay. Your intuition is wrong."
  *   **Classification:** Misconception about Decision Theory (Rigidity).
  *   **When to Defuse:** **Late Phase 4.**
  *   **How:** Acknowledge the logical consistency but highlight the practical absurdity. If they accept this, they are vulnerable to *any* claim with high enough stakes (e.g., every charity claim becomes a mugging).
  *   **Why Timing Matters:** You need this view to be voiced to show the cost of the "pure" solution. It validates the intuition of the majority who refused to pay.

  **4. The "Small = Ignorable" Conflation**
  *   **The Claim:** (Implicit) "If a probability is small enough, it counts as zero for decision making."
  *   **Classification:** The Core Conceptual Hurdle (Not a misconception, but the lesson).
  *   **When to Address:** **The Conclusion.**
  *   **How:** This is the takeaway. Distinguish between *epistemic* probability (what is true) and *decision-weighted* probability (what we act on).
  *   **Why Timing Matters:** This is the resolution. If introduced earlier, it bypasses the struggle. It must be presented as the *cost* of solving the puzzle: to reject the mugger, you must adopt a rule that violates standard EV theory.

  ### 4. The Deliberate Omissions

  You cannot cover the technical solutions in 50 minutes. If you try, you will lose the group in jargon. You must explicitly frame these omissions as a pedagogical choice.

  **The Cut List:**
  1.  **Solomonoff Induction / Algorithmic Probability:** The technical attempt to penalize complex claims.
  2.  **Bounded Utility Functions:** The mathematical fix that caps maximum value.
  3.  **Epistemic Defeat:** The idea that the mugger's claim undermines its own probability.

  **The Script for Omission:**
  > "There are technical solutions to this puzzle involving bounded utility functions and algorithmic probability. I am deliberately not covering them today. Why? Because those are attempts to *fix* the math. My goal today is not to fix the math, but to help you feel the break. If we jump to the solutions, you will leave thinking this is a technical glitch. It is not. It is a structural feature of any system that tries to calculate value across infinite possibilities. We are here to diagnose the disease, not prescribe the cure."

  ### 5. The Final Assessment Question

  Do not ask: "Did you understand the puzzle?"
  Do not ask: "Would you pay the mugger?"

  **Ask this:**
  > "Imagine you reject the mugger because you decide that probabilities below a certain threshold are ignorable. I now present you with a genuine existential risk—a real asteroid or a real pandemic—where the probability of catastrophe is *below* that same threshold, but the stakes are the same. By the principle you just used to save yourself from the mugger, are you now permitted to ignore the real risk? If not, what is the difference?"

  **Why this works:**
  *   If they say "Yes, I ignore the real risk," they reveal their principle is too costly (suicidal).
  *   If they say "No, I don't ignore the real risk," they must articulate the difference between a *baseless* tiny probability (mugger) and an *evidence-based* tiny probability (asteroid).
  *   This forces them to distinguish between **probability magnitude** and **epistemic justification**, which is the actual lesson of Pascal's Mugging. If they can answer this, the puzzle has landed.
