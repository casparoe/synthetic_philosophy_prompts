      *   *Better Approach:* The mugger must assert the magnitude *independently*. The core tension is between a *tiny* probability and a *huge* magnitude fixed by the claim, not negotiated by the victim. If the victim sets the magnitude, they control the EV, which dissolves the "mugging" aspect (the feeling of being forced by the math).
      *   *Selection:* Use the **Threat** version only for the carrying example. Why? Loss aversion is psychologically stronger than gain attraction. It creates more urgency and visceral discomfort with the EV calculation. The "Reward" variant dilutes the tension (people are happier to gamble on huge gains). The "Pair" confuses the issue (is it a net zero?).
      *   *Refinement:* The mugger asserts a specific huge number (e.g., $3 \uparrow\uparrow\uparrow 3$ units of utility). The demand is small ($5). The probability is tiny but non-zero.
      *   *Must Contain:* A specific, fixed magnitude asserted by the mugger. A small but non-zero probability justification (e.g., "I have magic powers"). A trivial cost.
      *   *Must Lack:* Negotiation on the magnitude. Any hint of theological afterlife (keep it secular/sci-fi). Complex probability derivations.

  3.  **Sequence and Dependencies:**
      *   *Goal:* Make them feel the force of the argument before showing the escape routes.
      *   *Step 1: The Norm (EV Maximization).* Establish that they agree with EV reasoning in normal cases.
      *   *Step 2: The Scenario.* Introduce the refined example.
      *   *Step 3: The Calculation.* Walk through the math. Show EV > Cost.
      *   *Step 4: The Intuition Clash.* Acknowledge that no one would actually pay.
      *   *Step 5: The Diagnostic.* Why not? (This is where misconceptions arise).
      *   *Step 6: The Structural Lesson.* It's not about muggers; it's about unbounded utility + non-zero probability.
      *   *Dependencies:* Cannot discuss "ignorable probabilities" until they admit the probability is non-zero. Cannot discuss "utility bounds" until they feel the pain of unbounded utility.

  4.  **Misconception Map:**
      *   *M1: "Probability is Zero."* (The most common dodge). Must be addressed *immediately* after the calculation. If addressed too late, the puzzle seems solved. If too early, it seems pedantic.
      *   *M2: "This is just Utilitarianism."* (It's actually about rational choice/EV generally). Address after M1, when discussing solutions.
      *   *M3: "Just Maximize EV."* (The rigid stance). Address when discussing the implications of rejecting the mugger.
      *   *M4: "Small = Ignorable."* (The conceptual hurdle). This is the core philosophical lesson. Address last as the takeaway.

