      *Flagging:* Need to explicitly mention which ones test the same thing.
      *Best Bet:* Goal-swap.
      *Degree/Kind:* Degree.

      Let's assemble.

      *Wait, checking the "Conditioned vs Reasoned" test.* "You can extinguish the loop with rewards and punishments, but you can't talk it out of the loop." This is basically testing cognitive penetrability. It's a good test for *human* rigidity (phobias vs beliefs), but as a general test for agency? It fails for dogs. So low trust for general agency.

      *Checking "Compression".* "Can its behavior be described by a rule shorter than the behavior itself?" This is basically asking "Is it algorithmic?" Everything physical is algorithmic in the broad sense. This test would label a human as sphexish. Definitely last.

      *Checking "Parameter-vs-structure".* "It varies its steps but never the shape of the plan." This is hard to know without knowing the plan. It's more of a post-hoc analysis. Mid-low.

