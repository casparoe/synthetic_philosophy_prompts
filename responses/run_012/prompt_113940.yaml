answer: |-
  **Ranked Diagnostics (Most to Least Trustworthy)**

  1.  **The goal-swap test:** This most directly isolates whether the system represents an outcome or merely executes a procedure, as rigid systems will continue the procedure even when it no longer achieves the goal.
  2.  **The interruption-and-restart test:** This reliably reveals whether the system tracks internal state progress or relies entirely on external stimuli to trigger the next script step.
  3.  **The novel-perturbation test:** This measures robustness and generalization, distinguishing between a model that understands the environment and one that merely matches known patterns.
  4.  **The parameter-vs-structure test:** While accurate descriptively, this is hard to verify externally without access to the system's internal architecture or source code.
  5.  **The "can be conditioned out but not reasoned out" test:** This conflates linguistic access with flexibility, falsely categorizing non-verbal agents (like dogs) as rigid simply because they cannot be "talked out" of things.
  6.  **The self-report test:** This requires high-level metacognition and language, meaning genuinely flexible infants or animals would fail despite possessing clear agency.
  7.  **The compression test:** This is fundamentally broken as a diagnostic because all deterministic systems, including flexible humans, follow rules shorter than the total sum of their behavior.

  **Overlaps and False Positives**

  *   **Redundancy:** The *interruption-and-restart* and *novel-perturbation* tests are effectively variants of the same stress test for robustness and state-tracking.
  *   **False Positives:** The *self-report*, *conditioned/reasoned*, and *compression* tests would all classify clearly flexible systems (humans, dogs, advanced RL agents) as "sphexish" because they rely on language access or misunderstand the nature of computational rules.

  **Single Best Bet**

  If I could only run one, I'd bet on the **goal-swap test**, because continuing a behavior after its purpose has been nullified is the definitive signature of a fixed script rather than an agent.

  **Degree vs. Kind**

  Sphexishness is a **matter of degree**; there is no bright line between a thermostat and a human, only a scaling continuum of internal modeling depth and feedback loop complexity.
