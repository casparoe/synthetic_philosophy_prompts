answer: |-
  President, members of the Cabinet, representatives of the donors, colleagues on the Commission, and citizens of Marovia.

  We gather under a open sky because the walls inside were too small for this moment. The sound system is weak. I will speak slowly. I will use short sentences. There are three languages in this room. The facts I speak belong to all of them.

  Today, the window closes. The list of names is fixed. Two thousand three hundred applicants received amnesty. Four hundred were refused. Almost all were refused because they withheld material facts. They spoke, but they did not speak fully. For the rest, the bargain is complete. The state will not prosecute. The Commission will not judge moral culpability. We are here to hand over the report and dissolve.

  I stand before three groups who see this day differently. The survivors' association fought for this bargain. You believe the record itself is the victory. The victims' caucus calls this amnesty a pardon issued over your heads. You say the state was not the one harmed. The former combatants sit relieved, yet defensive. You came forward, yet you remain protected.

  I will not offer you comfort. I will not use words that promise an end to pain. You have forbidden us the language of "closure." You have forbidden us the language of "healing." We respect that. Pain does not follow a schedule.

  We must look at what this Commission actually built. We have compiled a register of acts. We have dates. We have locations. We have names of the victims and the names of those who harmed them. Do not say the truth has been established. Say instead: a verified account of violations now exists. This is a public good. It prevents denial. It stops the lie that nothing happened.

  But a record of what happened is not the same as an acknowledgment from the person who did it. Information is not a relation. One person owes another an answer. During the hearings, a family member could ask three questions. You asked: Why this house? Why this son? Why this day? The rules allowed the applicant to refuse. The panels granted leave to refuse. Many did. They told us what they did. They did not tell us why.

  So we have a mountain of information. We have a silence where the reason should be. The survivors' association says the record is enough. The caucus says the silence is a theft. Both are right. The record is a victory against forgetting. The silence is a defeat for recognition. We hold both truths. We do not hide one to please the other.

  We must also speak of the state. The peace accord allowed the state to waive prosecution. It traded justice for peace. This was necessary to stop the war. But necessity is not ownership. When the state signed the accord, it disposed of a claim that arguably was never its to dispose of. The injury was yours. The debt was owed to you. The state cannot fully repay a debt it did not incur.

  The victims' caucus has called this a bargain made on your behalf by a state that was not the one harmed. This is not a complaint to be managed. It is a real objection. It cannot be answered by pointing out that the alternative was war. We acknowledge this cost. We do not ask you to accept that transfer as just. We record it as a fact of the settlement, just as we record the facts of the violations.

  So what remains? The Commission dissolves. The amnesty is unappealable. I cannot promise you that the silence will be broken. I cannot promise you that the state will repay the debt it assumed. But I can promise you something concrete regarding the record we leave behind.

  The report given to the President today contains the summaries. But the raw testimony remains. The state often archives these things and locks them. They become dust. They become inaccessible. This cannot happen here.

  Therefore, the Commission undertakes this final act. We have secured a binding statutory obligation from the legislature. The full transcripts of every hearing, including the questions asked and the refusals answered, will be stored in a permanent archive. Access to this archive will not require permission from the state. It will not require a reason. Any family member of a victim, or their legal heir, shall have unfettered right to view and copy the testimony of the person who harmed them. This right is written into the law today. It cannot be revoked by a future administration. The record of acts is fixed. Your right to hold that record is now guaranteed.

  We leave you with the facts. We leave you with the silence. We leave you with the law that protects your access to both. The Commission is finished. The record is yours.

  THESIS: The Commission delivers a verified record of acts while acknowledging that the state waived a claim it did not own and that factual disclosure cannot substitute for relational acknowledgment.
