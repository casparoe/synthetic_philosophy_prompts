  2.  **Deconstruct the Philosophical Distinction:**
      *   *Distinction 1:* Fact vs. Relation. A record of events is data. An acknowledgment of harm owed to a specific person is a relational act. The commission produced the former but could not compel the latter (due to the "why" silence).
      *   *Distinction 2:* State's Authority. The state waived prosecution. But the claim to justice arguably belongs to the victim, not the state. The speech must acknowledge this objection as valid, not just dismiss it with "otherwise war continues."
