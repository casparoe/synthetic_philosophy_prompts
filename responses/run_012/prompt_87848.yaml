answer: |-
  My roommate claims he knows his phone is in his jacket. I ask, "Via which method?" He says, "Memory—I put it there. But I'm checking via Feeling." I say, "Nozick says knowledge is method-relative. You're using Feeling. If I swapped it for soap, Feeling wouldn't track the swap. So you don't know it's a phone." He concedes, "Fine. But via Feeling I *do* know there's a lump. That tracks." So now he's certain he's carrying a mass, but ignorant whether it's a phone. I ask, "Are you going to answer when it rings?" He says, "I'd bet my life it's a phone, but I only know it's a lump. So I'm letting it go to voicemail. I don't talk to lumps."

  **Why it works:**
  The joke hinges on Nozick's sensitivity condition (the soap swap shows the "phone" belief fails tracking via Feeling) and method-relativity (he might know via Memory, but he's using Feeling). The punchline highlights the absurd consequence: the only belief that survives tracking is the trivial one ("lump"), while the practically valuable belief ("phone") is epistemically insecure, forcing him to refuse action on what he'd practically bet his life on.
