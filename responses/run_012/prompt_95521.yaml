prompt: |-
  I'm applying for a small internal seed grant — six months, one day a week, no lab, just me, a stack of library books and a whiteboard — and I need you to turn a half-formed idea of mine into a real proposal.

  Here's the idea. Everyone argues about whether a morally saintly life is a life worth wanting. The usual complaint is that the saint is admirable but not enviable: you'd admire someone who gives everything away, you wouldn't want to be them. And the usual reply is either that morality is overriding, so wanting doesn't enter into it, or that it isn't overriding, so the complaint is really an objection to a certain moral theory rather than to the saint herself. I think both sides are working with a concept thats doing two jobs at once, and that this is most of the reason they keep missing each other.

  The two jobs: the maximizer — someone whose life produces as much moral good as it could — and the exemplar — someone whose character is as morally good as a character can be. Different properties, of different things (a life's effects versus a person's traits), and they can pull apart. The maximizer might be required to be ruthless, or to let her own projects rot, or to be a bit cold, because thats what maximizing demands; the exemplar's goodness is constituted by her traits and not by her effects, so she could be a net loss to the world and still be the ideal. Most of the arguments I know slide between the two without noticing. And the prudential objection lands completely differently on each: it's devastating against the exemplar reading, where the goodness is supposed to be *in* the life, and close to irrelevant against the maximizer reading, where the saint's own unhappiness is just a cost to be traded off against the good produced.

  So the question I want the proposal to nail down: once maximal moral goodness is disambiguated into maximizing and exemplifying, do the standard objections to sainthood survive, and does anything of interest turn on which of the two somebody was actually objecting to? Second question, maybe the sharper one: is there a third reading that is neither — goodness of a whole life taken as a unit, where the life needn't be maximal at any particular time-slice and needn't consist of maximal traits? Because if there is, the debate has been run on a false dichotomy, and the demandingness literature (which is about actions) and the virtue literature (which is about traits) have been having two different arguments under one heading.

  Give me the proposal: the question stated so that it has a determinate answer, why the positions already on the table leave it open (be specific about which slide does the work and in whose argument), the method — what I'd actually do month by month with six months at one day a week, and it should be conceptual work with cases, not a literature survey — what a finished result looks like, and what would count as the project failing. My own guess at failure: if the two ideals turn out to coincide on every case I care about, or the whole-life reading collapses into one of the two, then the distinction is idle and I've burned the grant. Also give me an honest scope check, including whether six months is enough. Dont bother with a bibliography, I'll fill in the citations myself.
reasoning: |-
  Here's a thinking process that leads to the proposal:

  1.  **Analyze the Request:**
      *   **Goal:** Turn a half-formed philosophical idea into a formal seed grant proposal.
      *   **Constraints:** 6 months, 1 day/week (approx. 24-26 working days), no lab, solo researcher, conceptual work (cases, not lit survey).
      *   **Core Idea:** Disambiguate "moral sainthood" into two concepts: *Maximizer* (life produces most good) vs. *Exemplar* (character has best traits). Investigate if standard objections (unenviability, demandingness) apply differently to each. Explore a potential third option: *Whole-Life Goodness* (narrative unity, not slice-maximizing or trait-based).
      *   **Required Sections:** Determinate research question, gap analysis (who slides between concepts and how), methodology (month-by-month plan), deliverables (finished result), failure conditions, scope check (is 6 months/1 day/week enough?).
      *   **Tone:** Professional, persuasive, philosophically precise, honest about limitations. No bibliography needed.

  2.  **Deconstruct the Philosophical Argument:**
      *   *The Problem:* The "Sainthood Objection" (Wolf, etc.) claims moral saints are admirable but not enviable.
      *   *The User's Insight:* "Moral Goodness" is ambiguous.
          *   Type A: Consequentialist/Output-focused (Maximizer).
          *   Type B: Virtue/Character-focused (Exemplar).
      *   *The Hypothesis:* Objections hit Type B harder than Type A. Type A justifies unhappiness as a cost; Type B makes unhappiness constitutive of the failure (if the good life is supposed to be *good for* the agent).
      *   *The Wildcard:* Type C: Whole-Life/Narrative Goodness. Not about slices or traits, but the shape of the life.
      *   *The Risk:* If A and B always coincide, or C collapses into A or B, the project fails.

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be catchy but accurate. "Disambiguating Sainthood" or "The Two Faces of Moral Goodness." Let's go with something about the distinction. *Project Title: The Maximizer and the Exemplar: Disambiguating the Moral Saint.*

      *   **Research Question:** Needs to be determinate. Not just "explore," but "determine."
          *   *Draft:* Do objections to sainthood apply to both maximizers and exemplars?
          *   *Refinement:* Does disambiguating moral goodness into *maximizing* (outcome-based) and *exemplifying* (trait-based) dissolve the prudential objection to moral sainthood, and is a third *narrative* conception required to capture our intuitions?

      *   **The Gap (Why this hasn't been done):**
          *   Need to identify who slides. Susan Wolf is the obvious target ("Moral Saints"). She mixes character traits with life outcomes.
          *   Demandingness arguments (Scheffler) focus on action (Maximizer).
          *   Virtue ethics (Hursthouse) focuses on character (Exemplar).
          *   *The Slide:* When critics say "I wouldn't want to be a saint," are they imagining a burnt-out utilitarian (Maximizer) or a joyless ascetic (Exemplar)? The literature treats these as the same target.

      *   **Methodology (The 6-Month/1-Day-Week Plan):**
          *   Total time: ~24 days. This is very tight. Needs to be focused.
          *   Month 1: Taxonomy & Case Construction. Define the concepts rigorously. Build the thought experiments.
          *   Month 2: Testing the Maximizer. Apply prudential objections.
          *   Month 3: Testing the Exemplar. Apply prudential objections.
          *   Month 4: The Third Option (Whole-Life). Can we construct cases where they diverge?
          *   Month 5: Synthesis & Implications. What does this mean for demandingness vs. virtue ethics?
          *   Month 6: Writing the Paper/Report.
          *   *Constraint Check:* 1 day a week means deep work is hard. Need to ensure tasks are modular. "Conceptual work with cases" fits well.

      *   **Deliverables:**
          *   A draft paper (ready for submission).
          *   A set of "test cases" (philosophical vignettes) that can be used for future testing.

      *   **Failure Conditions:**
          *   User specified: If Maximizer = Exemplar in all relevant cases.
          *   User specified: If Whole-Life collapses.
          *   Add: If the distinction doesn't change the outcome of the debate (i.e., sainthood is still unenviable on both readings).

      *   **Scope Check (Honesty):**
          *   24 days is *very* little for deep philosophy.
          *   Risk: Getting stuck in definitions.
          *   Mitigation: Focus on *cases* rather than exhaustive history.
          *   Verdict: Feasible for a *proposal* and a *draft*, but maybe not a final polished journal article. It's enough for a "proof of concept" paper.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the "Whole-Life" idea too vague?
      *   *Fix:* Define it operationally. It's about narrative unity or temporal distribution of goods, distinct from aggregate output or static character.
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Emphasize that this is *conceptual analysis*, not empirical. The "lab" is the whiteboard. 24 days is enough for a tight argument if the researcher is disciplined.
      *   *Tone:* Keep it confident but grounded. Acknowledge the "seed" nature of the grant.

  5.  **Final Polish:**
      *   Ensure the distinction between "Maximizer" and "Exemplar" is crisp.
      *   Make sure the "Slide" is clearly identified (Wolf is the best example here).
      *   Check that the failure conditions match the user's prompt.

  6.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  **Project Title:** The Maximizer and the Exemplar: Disambiguating the Moral Saint

  **1. The Research Question**
  Does disambiguating "moral goodness" into *outcome-maximizing* (the Maximizer) and *trait-exemplifying* (the Exemplar) dissolve the standard prudential objection to moral sainthood, and is a third *narrative* conception (the Whole-Life) required to capture our remaining intuitions?

  Specifically, I seek to determine:
  1.  Whether the "unenviability" objection holds equally against the Maximizer and the Exemplar.
  2.  Whether there exists a logical space for a "Whole-Life" conception of goodness that is neither reducible to aggregate output nor static character traits.
  3.  Whether the current stalemate in the demandingness vs. virtue ethics debate is an artifact of conflating these categories.

  **2. The Gap: Where the Literature Slides**
  The current debate assumes a univocal concept of "the moral saint." This project argues that this assumption is a category error that generates false dilemmas.

  *   **The Slide:** The canonical statement of the problem, Susan Wolf's "Moral Saints," slides between these concepts. When Wolf argues the saint lacks "non-moral virtues" (humor, gourmet taste), she attacks the *Exemplar* (claiming the character is impoverished). When she argues the saint sacrifices personal projects for the greater good, she attacks the *Maximizer* (claiming the life's output requires prudential loss). She treats the verdict on one as a verdict on the other.
  *   **The Conflation in Demandingness:** Consequentialist responses to demandingness (e.g., Scheffler) defend the *Maximizer* by arguing that agent-centered prerogatives allow for personal projects. They ignore the *Exemplar*, whose very character might be deemed defective if they prioritize those projects.
  *   **The Conflation in Virtue Ethics:** Virtue ethicists defend the *Exemplar* by arguing virtue is constitutive of flourishing. They ignore the *Maximizer*, whose flourishing might be compatible with vicious traits if those traits produce better outcomes (the "effective altruist" problem).

  By treating these as a single target, the literature concludes that morality is either too demanding (Maximizer wins, prudence loses) or that morality is just prudence (Exemplar wins, demandingness vanishes). Neither side addresses the possibility that we are asking two different questions.

  **3. Methodology: Six Months, One Day Per Week**
  This is a conceptual analysis project utilizing constructed cases. No literature review beyond existing knowledge is required; the work will be done on the whiteboard.

  *   **Month 1: Taxonomy and Case Construction.**
      *   *Goal:* Rigorously define Maximizer, Exemplar, and Whole-Life.
      *   *Task:* Construct three pairs of vignettes. In each pair, Character A is a Maximizer but not an Exemplar (e.g., ruthless effective altruist), and Character B is an Exemplar but not a Maximizer (e.g., locally virtuous but ineffective).
      *   *Deliverable:* A "Case Book" of 6 standardized thought experiments.

  *   **Month 2: Stress-Testing the Maximizer.**
      *   *Goal:* Apply the prudential objection specifically to the Maximizer cases.
      *   *Task:* Determine if the Maximizer's unhappiness is a *tragic cost* (consistent with the theory) or a *reductio* (undermines the theory). Does the "unenviability" charge stick if we admit the life is morally optimal but personally miserable?
      *   *Deliverable:* Analytic notes on the coherence of the Maximizer ideal.

  *   **Month 3: Stress-Testing the Exemplar.**
      *   *Goal:* Apply the prudential objection specifically to the Exemplar cases.
      *   *Task:* Determine if the Exemplar's traits are inherently enviable. If the Exemplar is ineffective, do we still want to *be* them? If not, the "admirable but not enviable" distinction collapses.
      *   *Deliverable:* Analytic notes on the coherence of the Exemplar ideal.

  *   **Month 4: The Whole-Life Hypothesis.**
      *   *Goal:* Attempt to construct the third category.
      *   *Task:* Design cases where a life is good *as a narrative* despite failing slice-by_slice maximization and lacking perfect traits (e.g., a life of redemption, or late-blooming impact). Test if this resists the prudential objection better than the other two.
      *   *Deliverable:* A draft definition of "Narrative Goodness."

  *   **Month 5: Synthesis and Implications.**
      *   *Goal:* Map the results back to the literature.
      *   *Task:* If the distinction holds, identify which existing arguments apply to which category. If the distinction collapses, document why.
      *   *Deliverable:* Detailed outline of the final paper.

  *   **Month 6: Drafting.**
      *   *Goal:* Produce a manuscript.
      *   *Task:* Write the argument, integrate the cases, and finalize the conclusion.
      *   *Deliverable:* A complete draft paper (approx. 8,000 words).

  **4. Deliverables**
  1.  **A Draft Manuscript:** Suitable for submission to a journal such as *Ethics*, *Philosophy and Phenomenological Research*, or *Oxford Studies in Normative Ethics*.
  2.  **A Case Catalog:** A supplementary document containing the standardized vignettes (Maximizer-only, Exemplar-only, Whole-Life) for use in future teaching or empirical collaboration.

  **5. Failure Conditions**
  This project will be deemed unsuccessful if:
  1.  **Extensional Equivalence:** In every plausible case constructed, the Maximizer and the Exemplar coincide (i.e., it turns out maximizing good *requires* virtuous traits and vice versa). If they never pull apart, the distinction is idle.
  2.  **The Collapse:** The "Whole-Life" conception proves to be merely a weighted average of the other two, rather than a distinct structural property of a life.
  3.  **No Dialectical Shift:** Even if the concepts separate, if the prudential objection lands with equal force on both, the disambiguation fails to advance the debate.

  **6. Scope Check and Feasibility**
  *   **Time:** 24 working days (6 months × 4 weeks) is tight but sufficient for *conceptual* work. It is not enough time for a comprehensive history of the sainthood objection, which is why the methodology relies on constructed cases rather than exegesis.
  *   **Risk:** The primary risk is "definition drift"—spending months refining the definitions of Maximizer vs. Exemplar without generating cases. The Month 1 deliverable (Case Book) mitigates this by forcing concrete application early.
  *   **Verdict:** Feasible. The constraint of one day per week actually benefits this project; it forces a focus on high-leverage conceptual moves rather than granular textual analysis. The "whiteboard and library books" setup is ideal for this type of armchair philosophy. If the distinction is real, it should emerge quickly in the case construction phase. If it doesn't emerge by Month 3, the project should pivot to a negative result (arguing for the unity of the concepts), which is still a publishable outcome.
