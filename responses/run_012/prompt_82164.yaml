  The chain is **valid**. If premises (1) through (8) are true, the conclusion that no reactive attitudes are fitting follows inescapably. The logic is tight; the vulnerability lies in the truth of the premises, specifically in the bridge between the metaphysical diagnosis and the normative verdict.

  You should reject **(7)**.

  ### Why (7) is the Pivot
  Your friend's reconstruction is more dangerous than Strawson's original because it makes explicit what is usually an implicit slide: the claim that "Ultimately responsible" is simply the everyday notion of responsibility made precise. This is the argument's semantic engine. Without (7), premise (6) (that no one is *ultimately* responsible) does not entail that no one is *responsible* in the sense required for (8) (that blame is fitting).

  **(7) is plausible** because it captures a deep intuition about ownership. We feel that if my actions are the inevitable output of a machine I did not build (my character/genetics), then *I* am not truly doing them; the machine is. It feels as though any responsibility that falls short of self-creation is a sham, a useful fiction we tell children to keep them in line. This plausibility rests on conflating *authorship* (the action issued from my agency) with *origination* (I created the agency itself). A reasonable person finds (7) compelling because it promises conceptual honesty: it refuses to let us hide behind vague notions of "choice" that dissolve under scrutiny.

  ### The Cost and the Repair
  Rejecting (7) costs you the unity of the concept of responsibility. You must accept that there are two distinct notions at play: **Ultimate Responsibility** (which the Basic Argument successfully demolishes) and **Ordinary Responsibility** (which survives).

  You asked what the ordinary notion is supposed to be if it is not a consolation prize. It is **answerability**.
  Ordinary responsibility is not about being the *prime mover* of your character; it is about being the *locus* of rational governance. To be responsible in this sense is to be capable of recognizing moral reasons, adjusting your behavior in light of them, and offering an account of yourself when challenged. When we blame someone, we are not demanding that they rewrite their genetic past; we are engaging with their current capacity to recognize that what they did was wrong.

  This is not a consolation prize because it is the only notion that does any actual work. Ultimate Responsibility is a metaphysical luxury; Answerability is a functional necessity for any community of rational agents. The "price" is that you must abandon the retributive satisfaction of knowing the agent *could have done otherwise* in a cosmic sense. You retain the right to hold them accountable, but you lose the right to view them as a metaphysical unmoved mover.

  ### Does the Repair Hold at (9)?
  The repair holds at (9) without needing a different currency. The epistemic case parallels the moral case exactly.
  *   **Ultimate Epistemic Responsibility:** Did you choose your prior credences? No. (Premise 9, first half).
  *   **Ordinary Epistemic Responsibility:** Are you capable of updating beliefs in response to evidence? Do you follow norms of reasoning? Yes.

  We do not blame people for their priors (which they didn't choose); we blame them for *negligence* in processing evidence (which falls under their rational governance). If you reject (7) in the moral case, you must reject the parallel claim in the epistemic case: that "responsibility for belief" requires "ultimate origination of credences." The same notion of answerability applies. You are responsible for believing as you do if your belief-forming processes are responsive to reasons, even if you did not choose those processes. The repair is uniform.

  ### What Becomes of (2), (4), and (5)?
  By rejecting (7), you preserve (2), (4), and (5), which you noted looked solid.
  *   **(2)** remains true *for Ultimate Responsibility*. To be *ultimately* responsible for your actions, you would indeed need to be *ultimately* responsible for your nature.
  *   **(4) and (5)** remain true. You did not choose your heredity, and the regress of self-making never terminates.

  The Basic Argument succeeds in proving that **Ultimate Responsibility** is impossible. Your friend's error is assuming that this impossibility matters for the practices of blame and praise. By rejecting (7), you concede the metaphysical battle (we are not gods) while winning the normative war (we are still agents). You do not need to break the chain of causation or deny the influence of history; you simply deny that history's influence eliminates the capacity for reasons-responsiveness *now*.

  ### Why This Is Not Ad Hoc
  This diagnosis is not ad hoc goalpost-moving because it is driven by the failure of the opposing concept. The argument (1)–(6) demonstrates that Ultimate Responsibility is incoherent or impossible. It is not arbitrary to discard an impossible concept in favor of a possible one that sustains the practices we actually care about (blame, praise, reasoning). The burden lies on the proponent of (7) to explain why we should jettison our entire normative framework based on a metaphysical condition that nothing could ever satisfy. Rejecting (7) acknowledges the force of the Basic Argument without allowing it to consume the entire landscape of human interaction.
