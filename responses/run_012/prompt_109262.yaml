answer: |-
  \section*{Specification for a Theory of Rational Betting Under Repeated Multiplicative Risk}

  The following eight tests constitute the adequacy criteria. Each is marked as either **Non-Negotiable** (fixes the subject matter; without it, the theory is not about repeated multiplicative risk) or **Camp-Specific** (constrains outputs; without it, the theory is still about the subject but belongs to a different school of thought). Each is marked as **Load-Bearing** (dropping it changes the set of admissible strategies) or **Structural** (dropping it leaves strategies unchanged but alters the justification).

  ### Core Requirements

  **Test 1: The Growth-Expectation Distinction**
  *   **The Test:** The theory must distinguish between maximizing the arithmetic expected value of terminal wealth ($E[W_T]$) and maximizing the expected growth rate of wealth ($\lim_{T\to\infty} \frac{1}{T} E[\ln W_T]$). It must recommend different strategies for bets with positive arithmetic expectation but negative geometric drift.
  *   **Case:** A coin flip offering +50% or -40% on wealth. $E[W]$ rises, but median $W$ converges to zero.
  *   **Failure Mode:** Recommending "bet everything" on positive EV bets regardless of drawdown risk.
  *   **Classification:** **Non-Negotiable**, **Load-Bearing**.
  *   **Rationale:** Without this distinction, the theory collapses into standard expected value maximization, ignoring the multiplicative structure that defines the subject matter.

  **Test 2: Estimation Robustness**
  *   **The Test:** The theory must provide a decision rule when edge probabilities are estimated with error, not known with certainty. It must specify whether estimation risk reduces optimal stake size or is treated as orthogonal to the betting criterion.
  *   **Case:** A card counter whose count indicates an edge, but the deck composition is not fully known.
  *   **Failure Mode:** Recommending full "Kelly" stakes on noisy estimates, leading to overbetting and volatility drag greater than predicted.
  *   **Classification:** **Camp-Specific**, **Load-Bearing**.
  *   **Rationale:** A theory assuming perfect knowledge is a model of logic, not a theory of rational action in the world. How it handles error determines real-world admissibility.

  **Test 3: Foundational Status vs. Expected Utility**
  *   **The Test:** The theory must declare whether the logarithmic criterion is derived from the dynamics of time (ergodicity) or posited as a utility function (Expected Utility Theory). If the former, it must explain why agents should care about time averages in finite lives. If the latter, it must justify why log-utility is not arbitrary.
  *   **Case:** An agent with a finite horizon choosing between a safe bond and a volatile stock.
  *   **Failure Mode:** Claiming to be a rival to Expected Utility while implicitly relying on log-utility axioms to resolve one-shot cases.
  *   **Classification:** **Camp-Specific**, **Structural**.
  *   **Rationale:** This determines the philosophical lineage. Dropping it does not change the bet size (Log is Log), but changes the justification for why it is rational.

  **Test 4: The Ruin Constraint**
  *   **The Test:** The theory must forbid strategies that assign a non-zero probability to total loss (absorption at zero) in an infinite horizon, or explicitly define "ruin" as a drawdown threshold rather than zero.
  *   **Case:** Martingale strategies that recover losses by doubling stakes.
  *   **Failure Mode:** Allowing strategies that guarantee eventual wipeout in exchange for short-term gains.
  *   **Classification:** **Non-Negotiable**, **Load-Bearing**.
  *   **Rationale:** In multiplicative risk, zero is an absorbing state. A theory permitting absorption ceases to be a theory of *repeated* risk, as the repetition ends.

  **Test 5: Finite-Horizon Validity**
  *   **The Test:** The theory must deliver a verdict in one-shot or finite-horizon cases where the law of large numbers does not apply. It must state whether the long-run criterion applies by analogy or if a different rule governs the short run.
  *   **Case:** A single investment decision made just before retirement.
  *   **Failure Mode:** Refusing to offer guidance because "the long run is not available," or applying long-run growth maximization to a single trial without justification.
  *   **Classification:** **Camp-Specific**, **Load-Bearing**.
  *   **Rationale:** Most real-world decisions are finite. A theory that only works at $T=\infty$ has limited practical utility.

  ### Edge-Case Requirements

  **Test 6: Non-Fungible Holdings (Case a)**
  *   **The Test:** The theory must account for wealth components that cannot be reinvested multiplicatively (e.g., attention, reputation). It must specify how to bet monetary wealth when losses impact non-fungible capital.
  *   **Case:** Betting money where a loss requires overtime work (attention cost) to recover, altering the effective compounding rate.
  *   **Failure Mode:** Treating all wealth as a single numeric bankroll, ignoring that some losses increase the cost of future participation.
  *   **Classification:** **Non-Negotiable**, **Load-Bearing**.
  *   **Rationale:** If "wealth" includes non-fungible assets, the multiplicative equation $W_{t+1} = W_t(1+r)$ is false. The theory must adjust the dynamics to match the ontology.

  **Test 7: Exogenous Stake Size (Case b)**
  *   **The Test:** The theory must provide an Accept/Reject criterion for bets where the stake size is fixed by a counterparty, not optimized by the agent.
  *   **Case:** A venture capital offer taking 20% equity for a fixed sum.
  *   **Failure Mode:** Only providing an optimal fraction $f^*$, leaving the agent unable to evaluate a binary choice where $f_{offered} \neq f^*$.
  *   **Classification:** **Non-Negotiable**, **Load-Bearing**.
  *   **Rationale:** Rationality requires the ability to decline unfavorable terms, not just size favorable ones.

  **Test 8: Decaying Outside Option (Case c)**
  *   **The Test:** The theory must handle cases where the "risk-free" alternative has a negative drift (e.g., inflation, biological decay). The benchmark for growth must be relative to this decaying baseline.
  *   **Case:** Holding cash in a hyperinflationary economy vs. betting on a volatile asset.
  *   **Failure Mode:** Treating the outside option as static (zero drift), thereby classifying necessary risk-taking as gambling.
  *   **Classification:** **Non-Negotiable**, **Load-Bearing**.
  *   **Rationale:** In multiplicative risk, staying still can be a losing strategy. The theory must define growth relative to the survival baseline.

  ---

  ### Conflict Analysis

  **The Conflicting Pair:** **Test 4 (The Ruin Constraint)** and **Test 2 (Estimation Robustness)**.

  **Explanation:**
  Test 4 requires that the theory forbid any strategy with a non-zero probability of total loss (absorption). Test 2 requires the theory to operate when probabilities are estimated rather than known.
  In any scenario with estimated probabilities, there exists a non-zero probability that the true probability distribution is ruinous (e.g., the true win rate is below the break-even point), regardless of the point estimate. If the agent bets any amount $>0$, and the true probabilities are in the ruinous tail of the estimation distribution, ruin is possible.
  To strictly satisfy Test 4 (guaranteed no ruin) under the conditions of Test 2 (uncertain probabilities), the only admissible strategy is to bet size zero. This renders the theory vacuous for any agent who must take risk to survive (see Test 8). You cannot guarantee *mathematical* impossibility of ruin when the parameters of the game are uncertain.

  **Which to Surrender:**
  I would surrender **Test 4 (The Ruin Constraint)** in its strict form.
  It must be replaced with a **Risk of Ruin Constraint** (e.g., "Probability of drawdown $>X\%$ must be $<Y\%$"). Strict prohibition of ruin is incompatible with action under uncertainty. A theory of rational betting must permit manageable risk, not demand impossibility. The "Non-Negotiable" status of Test 4 is downgraded; the *concept* of ruin is non-negotiable, but the *prohibition* must be probabilistic, not absolute.

  ---

  ### Load-Bearing Assessment

  The most exclusionary requirement is **Test 4 (The Ruin Constraint)**.
  While Test 1 (Growth vs. Expectation) excludes standard Expected Value maximizers, Test 4 excludes almost all standard financial portfolio theories (which allow for non-zero bankruptcy probability in exchange for higher returns) and all Martingale-style strategies. It forces the utility function to approach $-\infty$ at zero wealth, which is the single strongest filter on admissible strategies in the candidate space.

  \answer{No, The Ruin Constraint}
