answer: |-
  Here is a principle set that fits your specific cluster of intuitions. It's not a standard textbook theory; it's a hybrid constructed to match the verdicts you gave me. I call it **The Source of Aid and Threat Principle.**

  It relies on three distinct rules regarding where the danger comes from, where the safety comes from, and what you own.

  ### The Principle

  **Rule 1: The Barrier Constraint (Killing)**
  If a safety barrier exists independently of you, actively removing it is **Killing**.
  *   *Forced by:* **The Boulder Rope.** The rope was already there holding the boulder. You cut it. You changed the status quo from "Safe" to "Deadly." This feels like murder because you initiated the causal chain of death by removing an independent obstacle.
  *   *Contrast:* **The Trolley.** The switch isn't a barrier; it's a router. You aren't removing safety; you are directing an existing threat. This is why Trolley feels permissible but Rope feels like murder.

  **Rule 2: The Stewardship Exception (Letting Die vs. Killing)**
  If *you* provided the safety or the risk, the rules change.
  *   **Aid You Provided:** Withdrawing life support *you* administered is **Letting Die** (Permissible).
      *   *Forced by:* **Ventilator Unhook.** You hooked her up; you own the intervention. Stopping it returns her to the natural course of the disease.
  *   **Risk You Created:** Negligence in a system *you* control is **Killing**.
      *   *Forced by:* **The Factory.** You own the machine. The defect is part of your system. Failing to fix it isn't just "not helping"; it's maintaining a lethal environment you are responsible for.

  **Rule 3: The Rescue Threshold (Duty to Act)**
  You have a duty to prevent death from *external* threats if the cost to you is low, unless it violates your bodily integrity.
  *   **Low Cost / External Resource:** Failing to act is **Wrong Letting Die**.
      *   *Forced by:* **The Pill** and **The Warning.** The threat is external (disease, boulder). The cost is negligible (a pill, a shout). You are morally required to intervene.
  *   **High Cost / Bodily Integrity:** Failing to act is **Permissible Letting Die**.
      *   *Forced by:* **The Kidney.** The resource is internal. Your body is not a tool for others' survival, regardless of the cost to them.

  ---

  ### How This Handles Your "Ventilator" Anomaly
  You noted a specific tension: *Unhooking* feels OK, but *Never Hooking* feels worse. This principle explains that cleanly, whereas most other theories struggle with it.
  *   **Unhooking:** Falls under **Rule 2 (Aid You Provided)**. You are withdrawing your own intervention. Verdict: Permissible.
  *   **Never Hooking:** Falls under **Rule 3 (Rescue Threshold)**. The machine is there, the patient is dying, the cost to you is low. You are failing an Easy Rescue. Verdict: Wrong (but Letting Die, not Killing).
  *   *Result:* This validates your gut feeling that not starting treatment is morally worse than stopping it, because one is a failure of rescue and the other is a withdrawal of stewardship.

  ---

  ### The Casualties (What You Might Have to Drop)
  No principle is perfect. To keep this framework consistent, you have to accept two consequences that might itch:

  1.  **The "Rope" vs. "Trolley" Consistency:** Most philosophers argue the Rope and Trolley cases are morally identical (both redirect/release a threat). This principle insists they are different (Barrier vs. Router). If you ever decide the Rope case *is* actually permissible, this principle breaks. You have to commit to the view that cutting a rope is fundamentally different than flipping a switch.
  2.  **The "Ventilator" Legal Standard:** In law and hospital ethics, starting and stopping treatment are usually treated as *identical* (both are Letting Die). This principle agrees with your gut (Stopping is easier than Starting) but disagrees with standard bioethics. You have to be okay with saying that a doctor who never intubates is morally worse than one who intubates and then extubates, even if the law treats them the same.

  ---

  ### Predictions for New Cases

  Here is how **The Source of Aid and Threat Principle** handles the cases you asked for:

  **1. The "Fat Man" Trolley Variant**
  *   *Case:* A train is heading for five. You can push a large man off a bridge to stop the train. He dies; five live.
  *   *Prediction:* **Impermissible (Killing).**
  *   *Why:* The man is a safety barrier (his body stops the train) that exists independently of you. Pushing him is **Rule 1 (Barrier Constraint)**. You are removing an independent obstacle to use him as a tool. This aligns with your **Surgeon** verdict, not your Trolley verdict.

  **2. The "Bystander Apathy" Case**
  *   *Case:* You are one of five people watching a child drown. Any one of you could save them easily. Everyone assumes someone else will. The child dies.
  *   *Prediction:* **Wrong Letting Die (Equal Guilt).**
  *   *Why:* This falls under **Rule 3 (Rescue Threshold)**. The threat is external (water), the cost is low (getting wet). The presence of others does not negate your individual duty to rescue. While psychology explains *why* you didn't act, the principle says you are just as responsible as if you were alone.

  **3. The "Collateral Damage" Case (Doctrine of Double Effect)**
  *   *Case A:* You bomb a military factory to stop weapon production. The explosion accidentally kills nearby workers.
  *   *Case B:* You bomb a military factory. To ensure it blows up, you plant a bomb that *requires* killing the nearby workers to detonate.
  *   *Prediction:* **Case A is Permissible (Side Effect); Case B is Impermissible (Means).**
  *   *Why:* This requires a small add-on to **Rule 4 (Threat Creation)**.
      *   In Case A, the deaths are a foreseen side effect of destroying the *factory* (the target).
      *   In Case B, the deaths are the *mechanism* of the destruction. You are using the workers as part of the bomb. This violates the **Surgeon** intuition: you cannot use a person's death as the means to your end, even for a good goal.

  ### Summary
  Your inconsistency isn't random; it's based on **ownership** and **causal status**.
  *   If you own the risk (Factory), negligence is killing.
  *   If you own the aid (Ventilator), withdrawal is letting die.
  *   If you don't own the barrier (Rope), removing it is killing.
  *   If you don't own the resource (Pill vs. Kidney), duty depends on whether it's in your pocket or your body.

  If you adopt this, you stop asking "Did I act or omit?" and start asking "Did I break a barrier I didn't build, or fail to use a resource I control?" That should clear up the bug in your system.
