      **1. How does Absentia define an "omission"?**
      An omission is a failure to perform an action classified within your Policy's Expected Conduct Matrix. This matrix is updated quarterly by our actuarial team to reflect current social norms and reasonable expectations. For example, failing to water a leased office plant is an omission; failing to buy every lottery ticket available is not. Please note that by purchasing this cover, you agree to let Absentia determine which non-actions constitute negligence.

      **2. If everything happens because something else didn't, why am I liable for this specific omission?**
