answer: |-
  **Absentia Insurance | Claims Support | Omission Cover FAQ**

  **1. How does Absentia define an "omission"?**
  An omission is defined as a failure to perform an action classified within your Policy's Expected Conduct Matrix. This matrix is updated quarterly by our actuarial team to reflect current social norms, contractual obligations, and reasonable expectations. For example, failing to water a leased office plant is an omission; failing to buy every lottery ticket available is not. The distinction relies on a baseline of normalcy. Please note that by purchasing this cover, you agree to let Absentia determine which non-actions constitute negligence. We do not cover failures to act where no prior duty existed, as this would require us to legislate morality by spreadsheet, which is outside our scope.

  **2. If everything happens because something else didn't, why am I liable for this specific omission?**
  This is a common query regarding counterfactual dependence. While it is technically true that any event would not have occurred if you had performed any number of alternative actions (e.g., the fire occurred because you didn't fly in a specialist firefighter from Mars), liability is restricted to omissions where a causal link is deemed "proximate." Our algorithms weigh relevant counterfactuals against statistical norms. There are thousands of things you did not do at any given moment. To prevent infinite liability, we isolate the non-action that, if performed, would have most likely prevented the loss according to standard models. If the algorithm cannot distinguish between your inaction and the infinite other non-actions that prevented the loss, coverage may be paused pending metaphysical review.

  **3. Why is the premium for Omission Cover higher than for Action Liability?**
  Risk assessment indicates that passive allowances carry higher volatility than active interventions. While an action is a discrete event with a clear timestamp, an omission is a continuous state of non-compliance that persists until rectified. Consequently, policies include a Passive Duration Surcharge. This reflects the extended window of opportunity for damage to occur while you are doing nothing. Additionally, historical data suggests clients are psychologically more comfortable charging others for things they didn't stop than for things they did, requiring us to adjust reserves accordingly.

  **4. I didn't know I was supposed to do the thing. Am I still covered?**
  Coverage depends on constructive awareness. If a reasonable person in your position would have known the action was expected, the omission is billable regardless of your actual knowledge. However, if you were unaware, the causal link becomes murky: did your ignorance cause the loss, or did the lack of information cause the ignorance? In such cases, claims are processed under our Epistemic Ambiguity Clause, which reserves the right to deny liability if the lack of knowledge is deemed too causal to ignore. We cannot confirm whether ignorance exempts you from the duty to know until a claim is adjudicated.

  **5. I am being sued for not donating to a stranger's medical fundraiser. Is this covered?**
  Generally, no. Omission Cover distinguishes between specific duties (contracts, roles, relationships) and general moral opportunities. Failing to donate is classified as a "Non-Salvage," not an omission, unless you were previously designated as the beneficiary's primary provider. We do not insure against the failure to be a Good Samaritan, as this would establish a baseline of universal charity that our actuaries have calculated would bankrupt the global economy. You are liable for what you owe, not for what you could have given.

  **6. My claim was denied by CausaLink Insurance because "absences aren't events." Is this valid?**
  CausaLink adheres to a strict Process Theory of liability, which posits that only positive energy transfers can constitute causes. They argue that nothing cannot cause something. Absentia disagrees. We operate on the Counterfactual Standard, recognizing that what didn't happen often matters more than what did. If CausaLink denied your claim on principle, you are likely eligible for a switch-over bonus. Please note, however, that switching insurers does not retroactively create the causal chain they denied.

  **Still have questions?**
  Contact support. If we do not reply within 48 hours, please consider whether our silence constitutes a breach of service or merely a delay.
