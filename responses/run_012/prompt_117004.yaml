  I'm putting together a little collection of satirical bits and I want one on causation by omission — you know, the "the plant died because you didn't water it" stuff, whether a non-event can even be a cause, and how you decide which of the thousands of things you didn't do is the one that did it. Heres what I'm after: a help-centre FAQ page, deadpan corporate voice, maybe 650 words, for a made-up insurance company called Absentia that sells "omission cover." Numbered questions from customers, answers from the company.

  The comedy has to come from the real features of the debate, not from me inventing nonsense, so a philosopher who works on omissions should nod along rather than wince. Stuff I'd like it to quietly get right: that omissions only count as omissions relative to some baseline of what you were expected to do, so the company's actuaries have to define "expected" and end up legislating morality by spreadsheet; that if you take counterfactual dependence as your test, every omission you've ever committed becomes a candidate cause of everything bad that happened, which makes the "which omission am I liable for?" question genuinely unanswerable; that people are weirdly comfortable charging more for omissions than for actions, and the policy should have a doing/allowing premium without ever calling it that; and that there's a rival insurer which holds that absences can't be causes at all because causes have to be events linked by a causal chain, so all of its omission claims get denied on principle and its customers are furious.

  One question from a customer should be about whether he had to *know* he was omitting, and the answer should accidentally land the epistemic mess without resolving it. Another should be from someone being sued for not donating to a stranger's fundraiser. Don't wink at the reader and don't name any philosophers or papers — no reading lists, no citations, I want it to read like a real FAQ. Keep it readable for someone who's never heard the phrase "causation by omission" but let the punchlines be for the people who have.
