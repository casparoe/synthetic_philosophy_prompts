answer: |-
  Here is the plan for the ninety-minute session. It is designed to treat your colleagues as investigators rather than students. You are not teaching them a theory; you are walking them through evidence until the theory becomes the only explanation that fits the facts.

  ### 1. The Sequence and Dependencies

  Do not announce the thesis ("Work is a political distribution of time") until minute 75. Until then, it is a hypothesis to be tested.

  **Phase 1: The Moral Operating System (Minutes 0–15)**
  *   **Component:** The Protestant Work Ethic.
  *   **Position:** First.
  *   **Dependency:** You must install this *before* discussing policy or hours.
  *   **Why:** Your colleagues are business and labour reporters. They view time through an economic lens (productivity, output). You need to disrupt the *moral* lens first. If they believe leisure is inherently virtuous, the rest of the session is just logistics. If they believe leisure is inherently suspect (a relic of the idea that idleness is sinful and work is a calling), they will view any redistribution of time as a loss of value.
  *   **Instruction:** Do not teach this as theology. Teach it as *psychology*. Explain that this ethic secularized into the modern idea that "hard work" is a moral virtue and "free time" is something to be justified (e.g., "recharging to work more"). This creates the resistance you will need to overcome later.

  **Phase 2: The Historical Variable (Minutes 15–30)**
  *   **Component:** A rapid timeline of the working week (from 80+ hours in the 19th century to the 40-hour standard, to the 35-hour experiment).
  *   **Dependency:** Requires Phase 1 to be in place.
  *   **Why:** Once they accept that we feel guilty about leisure (Phase 1), show them that the amount of leisure is not fixed by biology or physics. It has moved drastically in living memory. This establishes *variability*, but not yet *cause*.

  **Phase 3: The Analytical Lens (Minutes 30–45)**
  *   **Component:** The Three Distinctions (Fewer Hours vs. Flexible Hours vs. Sovereign Time).
  *   **Dependency:** Requires Phase 2 to show that "hours" are not a monolith.
  *   **Why:** This is the tool they will use to analyze the examples. If you skip this, they will conflate a shorter week with a freer life.
      *   *Fewer Hours:* The quantity is reduced (e.g., 40 to 35).
      *   *Flexible Hours:* The worker chooses the slot, but the time is still owed to the employer (e.g., gig work, flex-time).
      *   *Sovereign Time:* The time is owed to no one; the employer has no claim.
  *   **Instruction:** Make this crisp. Use a whiteboard. If you do not separate these here, the conclusion will blur.

  **Phase 4: The Primary Evidence (Minutes 45–70)**
  *   **Component:** The French 35-Hour Week.
  *   **Position:** The Carrier.
  *   **Dependency:** Requires Phase 3 (The Lens).
  *   **Why:** This carries the session because it is an explicit *legislative act*. It proves the state can draw the line. It allows you to apply the Lens: Did it deliver *Fewer Hours*? Yes. Did it deliver *Sovereign Time*? Often no (annualized hours, loopholes). This nuance prevents the session from becoming a simple "work less" rally. It shows the complexity of the *distribution*.

  **Phase 5: The Counter-Factual (Minutes 70–80)**
  *   **Component:** *Karoshi* (Death by Overwork).
  *   **Position:** The Contrast.
  *   **Dependency:** Requires Phase 4.
  *   **Why:** Held back until now to avoid exoticism. If you lead with this, it becomes a story about "Japanese culture." If you place it here, it becomes the logical endpoint of *deregulated time*. It shows what happens when the political line is erased entirely. It raises the stakes from "policy" to "mortality."

  **Phase 6: The Synthesis (Minutes 80–90)**
  *   **Component:** The Conclusion (Political Distribution).
  *   **Position:** Last.
  *   **Dependency:** Requires all previous phases.
  *   **Why:** Now you state the thesis. Because they have seen the moral barrier (Phase 1), the historical variability (Phase 2), the distinction in types of time (Phase 3), the legislative attempt (Phase 4), and the cost of absence (Phase 5), the conclusion that "someone decides who owes their hours to whom" lands as a deduction, not an opinion.

  ---

  ### 2. The Single Example

  **The Carrier:** **The French 35-Hour Week.**
  **The Contrast:** ***Karoshi*.**

  **Why the 35-Hour Week carries it:**
  It is the clearest evidence that the work/leisure line is a *political decision*. It was not a market evolution; it was a law. It forces business reporters to confront the idea that the 40-hour week is not a natural equilibrium but a policy choice that can be changed.

  **How to use *Karoshi* without collapsing into cultural exoticism:**
  You must explicitly decouple *karoshi* from "Japanese work culture" and recouple it to "the absence of a legal boundary."
  *   **What to say:** "Do not treat this as a cultural peculiarity. Treat it as an institutional failure. It is what happens when the claim of capital on time is allowed to become total. It is the canary in the coal mine for the 'always-on' economy that exists in London and New York, just without the legal protections."
  *   **What the example must have:** A specific instance where the *expectation of availability* was the cause of death, not just the volume of work. It must illustrate that the *boundary* was breached, not just that the work was hard.
  *   **What the example must lack:** Any implication that this is about "loyalty" or "honor." Frame it strictly as a failure of time allocation enforcement.

  **Applying the Lens (The Three Distinctions) to the 35-Hour Week:**
  To ensure the distinction lands, you must show where the 35-Hour Week failed to deliver *Sovereign Time*.
  *   *It achieved Fewer Hours:* Statistically, yes.
  *   *It failed on Sovereign Time:* Many companies used "annualized hours" (averaging the 35 hours over a year), meaning during crunch times, workers still owed all their time. The *quantity* changed, but the *ownership* did not fully shift. This proves your point: a shorter week is not the same as free time.

  ---

  ### 3. Misconceptions and Interception Points

  Here are the misconceptions, including the one you missed, and exactly where in the sequence to head them off.

  1.  **"Leisure is laziness or consumption."**
      *   *Interception Point:* **Phase 1 (Protestant Work Ethic).**
      *   *Action:* Explicitly state that in this session, "leisure" does not mean "shopping" or "idleness." It means "time over which the worker has jurisdiction." If you don't define this early, the business reporters will dismiss the argument as anti-productivity.

  2.  **"The work ethic is a religious relic that secularized away."**
      *   *Interception Point:* **Phase 1 (Protestant Work Ethic).**
      *   *Action:* Correct this immediately. It did not secularize *away*; it secularized *into* management theory and self-optimization culture. It is more alive now than in the 19th century.

  3.  **"Overwork deaths are a cultural peculiarity (Japan)."**
      *   *Interception Point:* **Phase 5 (Karoshi).**
      *   *Action:* As noted above, frame this as a regulatory failure, not a cultural one. Compare it to workplace safety violations in the West (e.g., unsafe machinery). *Karoshi* is just an OSHA violation where the machine is the schedule.

  4.  **"A right to leisure is a luxury only rich economies can afford."**
      *   *Interception Point:* **Phase 2 (Historical Variable).**
      *   *Action:* Show that the reduction of hours often *preceded* peak wealth creation (e.g., the 40-hour week was adopted before the post-war boom). Productivity often rises when hours are capped.

  5.  **"Productivity is a fixed volume of output per hour." (The Missing Misconception)**
      *   *Interception Point:* **Phase 4 (35-Hour Week).**
      *   *Action:* Your colleagues will assume that cutting hours cuts output. You must intervene here to explain that productivity is elastic. If the line is political, so is the intensity of work within that line.

  ---

  ### 4. The Final Question

  Do not ask: "Do you think people should work less?" (This invites preference/moralizing).
  Do not ask: "Is the 35-hour week a good idea?" (This invites policy debate).

  **Ask this:**
  > "If we pass a law tomorrow that bans work emails after 7 PM, whose property right are we violating: the firm's claim on the worker's time, or the worker's claim on their own life?"

  **Why this works:**
  *   **The Preference Answer:** A colleague who hasn't grasped the point will say, "It depends on what the worker wants," or "It hurts the business." They are still viewing time as a commodity to be traded.
  *   **The Distribution Answer:** A colleague who has grased the point will hesitate, because they recognize the question identifies *ownership*. They will understand that the law is not about efficiency, but about adjudicating who *owns* the hour between 7 and 8 PM. It forces them to acknowledge that currently, that hour is assumed to belong to the firm by default.

  ---

  ### 5. What to Decline to Explain

  You must explicitly name a gap to maintain credibility. Do not attempt to solve the macroeconomics of wage suppression.

  **The Statement:**
  > "I am not going to argue today that reducing hours will leave your paycheck unchanged. That is a fight about wage policy, tax policy, and union power. I am bracketing the economics of *income* to focus entirely on the politics of *time*. We cannot solve who owns the hours until we admit someone owns them."

  **Why:**
  Business reporters will immediately jump to "But who pays for the 35th hour?" If you try to answer that, you will get bogged down in minimum wage debates and inflation, and you will lose the philosophical thread about time sovereignty. By naming this exclusion, you protect the core argument from being dismantled by economic objections that are outside the scope of the session.
