prompt: |-
  You're a philosopher of language and cognitive scientist specializing in language acquisition and the nativism debate; before you answer, brainstorm the full range of things the phrase could be taken to assert, then write the response. I've been reading rationalist blogs and forums for years, and I keep running into "the poverty of the stimulus" used as a conversation-stopper: in one thread about whether large language models undercut the nativist case, it was deployed to show that no learner exposed only to text could ever acquire grammar; in another, it was cited as a claim the models had already refuted. Give me a menu rather than a verdict. What distinct precise theses could that phrase be expressing — what exactly is supposed to be impoverished, relative to what, and for which learner — and for each, say whether it is a definitional triviality, a substantive claim defensible on empirical or learning-theoretic grounds, or something actually false or empty? Then say which of those readings would have to hold for the phrase to do the work it was doing in each thread, and which reading the people who repeat it most often probably have in mind. Lay it out as a numbered list I can bring to a reading group.
