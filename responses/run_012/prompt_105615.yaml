answer: |-
  # The Incubator Wager: An In-Class Experiment on Anthropic Reasoning

  **Course:** Upper-Level Metaphysics Seminar
  **Class Size:** 18 Students
  **Time:** 75 Minutes
  **Objective:** To force students to experience the tension between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) through a betting scenario where "existence" is the only evidence.

  ---

  ## I. Materials & Setup

  **Materials Needed:**
  1.  **Two Decks of Cards** (prepared in advance, face down):
      *   **Deck S (Small World):** 2 cards marked **"OBSERVER"**, 16 cards marked **"VOID"**.
      *   **Deck L (Large World):** 16 cards marked **"OBSERVER"**, 2 cards marked **"VOID"**.
  2.  **A Coin** (for the instructor's private use).
  3.  **Betting Slips** (18 small pieces of paper).
  4.  **A "Lockbox"** (a simple envelope or box to collect bets).
  5.  **Projector/Board** for displaying rules and scores.

  **Room Arrangement:**
  *   Students sit in their usual seats.
  *   Instruct students that once cards are dealt, **no verbal communication** is permitted until the reveal.
  *   Instruct students that if they receive a "VOID" card, they must immediately put their head down on the desk and close their eyes. They are "philosophically inactive" for the duration of the round.

  ---

  ## II. The Timeline (75 Minutes)

  ### 1. Introduction & Rules (10 Minutes)
  *   **The Narrative:** Tell the class they are participating in a simulation of "Cosmic Creation."
  *   **The Metaphysics:** Explain that there are two competing theories about the nature of this simulation:
      *   **Theory S (Sparse):** The universe is small. It supports very few conscious observers.
      *   **Theory L (Luxuriant):** The universe is vast. It supports many conscious observers.
  *   **The Prior:** Tell them the "Creator" (you) flipped a fair coin to decide which Theory governs today's session. *Prior Probability: 50% S, 50% L.*
  *   **The Stakes:** Offer a trivial but meaningful incentive (e.g., 5 bonus points toward their participation grade, or simply "bragging rights" for the semester).
  *   **The Constraint:** Emphasize the **Information Barrier**.
      *   If they are an **OBSERVER**, they exist. They may keep their eyes open. They must bet on whether the world is S or L.
      *   If they are **VOID**, they do not exist in this scenario. They must put their head down immediately. They do not bet. They do not look up.
      *   **Crucial Rule:** OBSERVERS cannot look around to count other OBSERVERS. They must assume they are isolated until the betting is complete.

  ### 2. The Creation Event (5 Minutes)
  *   **The Secret Fix:** Step out of the students' line of sight (or turn your back). Flip the coin.
      *   *Heads:* Select **Deck S**.
      *   *Tails:* Select **Deck L**.
  *   **The Deal:** Shuffle the chosen deck. Walk around and deal one card face-down to each student.
  *   **The Activation:** Say: *"Check your cards. If you are VOID, you are not part of this reality. Head down, eyes closed, now."*
  *   Wait until all VOID students are heads-down.
  *   Say: *"If you are an OBSERVER, you exist. Keep your eyes on your desk. Do not look at your neighbors."*

  ### 3. The Wager (15 Minutes)
  *   Distribute Betting Slips to the OBSERVERS only (you will have to quickly identify who has their head up, or hand them out beforehand and tell VOIDs to leave theirs blank/face down).
  *   **The Task:** On the slip, they must write:
      1.  **Verdict:** Theory S or Theory L?
      2.  **Confidence:** A percentage (0–100%) representing how sure they are.
  *   **The Scoring Rule (Brier Score):** Explain that points are awarded based on accuracy.
      *   If they pick the correct Theory, they gain points proportional to their confidence.
      *   If they pick the wrong Theory, they lose points proportional to their confidence.
      *   *(Simpler version for speed: Correct = +10 pts. Incorrect = -10 pts. Confidence is discussed in debrief.)*
  *   Collect the slips in the Lockbox.

  ### 4. The Reveal (10 Minutes)
  *   Ask all students to lift their heads.
  *   Ask all OBSERVERS to raise their hands. Count them aloud.
      *   If 2 hands: The World was **S**.
      *   If 16 hands: The World was **L**.
  *   Announce the Coin Result (confirming the Deck used).
  *   Tally the points for the OBSERVERS. (The VOID students get 0 points; they didn't exist to win them).

  ### 5. The Debrief (35 Minutes)
  *   **Phase 1: The Data.** Write the betting results on the board.
      *   How many bet S? How many bet L?
      *   What was the average confidence?
  *   **Phase 2: The Fork.** Introduce the terms *now*.
      *   **SSA (Self-Sampling Assumption):** "I should reason as if I am a random sample from the observers who *actually exist*."
          *   *Logic:* Since the coin was fair (50/50), and I find myself existing, does that change the coin odds? SSA says **No**. My existence is a background condition. I should stick with 50%.
      *   **SIA (Self-Indication Assumption):** "I should reason as if I am a random sample from all *possible* observers."
          *   *Logic:* There are far more "slots" for me to occupy in World L (16 slots) than in World S (2 slots). The fact that I *found* a slot makes it much more likely I am in World L.
          *   *The Math:* $P(L | Exist) = \frac{16}{16 + 2} \approx 89\%$.
  *   **Phase 3: The Presumptuous Philosopher.**
      *   Connect the game to the thought experiment. The Philosopher says, "I exist, therefore the universe is likely huge."
      *   Ask the students who bet L with high confidence: *"Did you feel presumptuous? Did you feel like you were assuming something you couldn't know?"*
      *   Ask the students who bet S (or 50%): *"Did you feel like the SIA bettors were counting their luck before the coin landed?"*
  *   **Phase 4: The Limitation (Crucial).**
      *   **Honesty Clause:** You must tell them what the game *failed* to do.
      *   *The Problem:* In this single run, the Coin was 50/50. If you ran this class 100 times, World S would happen 50 times and World L would happen 50 times.
      *   *The SSA Defense:* "If I bet L every time, I only win 50% of the *worlds*."
      *   *The SIA Defense:* "But if I bet L every time, I win 89% of the *observer-moments*."
      *   *The Takeaway:* The disagreement isn't about the coin; it's about whether you care about being right about the **Universe** (SSA) or being right about your **Experience** (SIA). The game cannot settle which goal is correct; that is the metaphysical work they must do.

  ---

  ## III. Likely Failure Points & Recovery

  **1. The "Peeking" Problem**
  *   **Risk:** Students with "OBSERVER" cards look around to count heads. If they see 15 others, they know instantly it's World L. This destroys the uncertainty required for the bet.
  *   **Recovery:** Pre-empt this heavily. *"If you look around, you invalidate the experiment. You are cheating not against me, but against your own reasoning."* If you catch someone, calmly disqualify their bet from the tally but ask them to explain *why* they looked during the debrief (often reveals anxiety about uncertainty).

  **2. The "Void" Resentment**
  *   **Risk:** Students who get "VOID" cards feel excluded or bored.
  *   **Recovery:** Give them a task. Hand them a "God's Eye View" sheet. They know which Deck was used (you can whisper it to them or mark their VOID card subtly). Their task is to record the *actual* world state and grade the OBSERVERS' reasoning from the outside. This makes them the "SSA auditors."

  **3. The "It's Just a Coin" Objection**
  *   **Risk:** Students argue, "You flipped a coin. It's 50/50. Anyone betting 89% on L is mathematically wrong."
  *   **Recovery:** This is the *exact* objection you want. Validate it. *"You are arguing for SSA. You are saying the prior (the coin) swamps the evidence (my existence)."* Then turn to the SIA camp. *"You are arguing that the evidence of existence updates the prior."* Use the conflict to drive the seminar discussion. Do not try to "solve" it; let the tension stand.

  **4. Time Overrun**
  *   **Risk:** The betting or counting takes too long.
  *   **Recovery:** If you are past the 40-minute mark, skip the Confidence % scoring. Just ask for a show of hands: "Who bet S? Who bet L?" Move immediately to the Debrief. The philosophical payoff is in the discussion, not the points.

  ---

  ## IV. Instructor's Cheat Sheet for the Debrief

  **Key Concepts to Board:**
  1.  **Reference Class:** Who counts as "me"? (The card holder? The human? The conscious mind?)
  2.  **Conditioning:** Do we condition on "I exist" (SIA) or "I am this specific observer" (SSA)?
  3.  **The Presumptuous Leap:**
      *   *Philosopher:* "I exist $\rightarrow$ Many observers exist."
      *   *Critique:* "Why does your existence imply others? Maybe you're the only one."
      *   *Game Parallel:* "Why does my OBSERVER card imply Deck L? Maybe it was Deck S and I got lucky."

  **The "Honesty" Limitation:**
  Be explicit: *"This game simulates the **logic** of the argument, not the **cosmology**. In the real universe, we don't have a coin flipper. We don't know the prior probabilities of 'Small Universe' vs 'Big Universe.' The Presumptuous Philosopher assumes equal priors. If the prior for a Huge Universe is microscopic, even SIA might not save him. The game forces the SIA/SSA clash, but it cannot tell you which assumption is true. That is your homework."*

  **Closing Question for Students:**
  *"If you had to bet your life on it, would you bet on the world being the one where you were more likely to exist (SIA), or the one that was simpler to create (SSA)? And why?"*
