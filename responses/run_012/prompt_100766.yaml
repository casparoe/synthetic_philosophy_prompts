answer: |-
  Here is the plan. It is designed to keep you out of the weeds of meta-ethics and deep in the mud of their actual craft.

  ### 1. The Central Example: The Dinner Party
  **Reject the landscape.** Your instinct was close, but a landscape is passive. It invites the "sublime," which poets will romanticize and fiction writers will ignore. It separates the "beauty" from the "human" too cleanly. You need an example that forces the two goods (Beauty and Friendship) to collide in a single space.

  **Use The Dinner Party.**

  *   **World A:** A table set with crystal, silver, and food cooked to molecular perfection. The room is architecturally stunning. The lighting is exact. There is no one there. No cooks, no guests, no observers. It sits in a void.
  *   **World B:** A kitchen table. The food is burnt in spots. The wine is cheap. The chairs don't match. But four people are sitting there, laughing, arguing, and confessing things they've never told anyone else.

  **Why this one:**
  1.  **It contains both goods:** World A isolates *Beauty* (the arrangement, the taste). World B isolates *Personal Affection* (the conversation).
  2.  **It forces Organic Unity:** The value of World B isn't just the food plus the talk. It's the talk *enabled* by the food, the warmth *created* by the mismatched chairs.
  3.  **It's writable:** Every person in that room has written a scene set around a table. They can immediately transpose this philosophical problem into a draft they're struggling with.

  **What it must contain:** Specific sensory details. Do not describe "perfect food." Describe "the glint on the fork." Do not describe "friendship." Describe "the silence that isn't awkward."
  **What it must miss:** Any moral consequence. Nobody is saved in World B. Nobody starves in World A. If you introduce survival or morality, you lose the "intrinsic" argument.

  ### 2. The Session Order (120 Minutes)

  **0:00 – 0:20: The Method of Isolation (The "Strip-Down")**
  Do not define "intrinsic value." Instead, run a drill.
  *   **Activity:** Ask them to take an object in the room (a pen, a mug). Ask: "Is this good?" They will say "It depends on what it's for."
  *   **The Move:** Tell them: "For the next two hours, 'what it's for' is banned. No utility. No consequences. Imagine the universe contains *only* this mug. Is it good?"
  *   **Goal:** Break their habit of judging things by their *use* (plot function, moral lesson) and force them to judge the *thing itself*. This sets up Moore's isolation method without naming it.

  **0:20 – 0:50: The Dinner Party (Applying Isolation)**
  *   **Activity:** Present World A (The Perfect Empty Dinner). Ask: "Universe contains only this. Is it good?"
      *   *Expected pushback:* "It's wasted." (Ban this. No one to waste it on.)
      *   *Expected pushback:* "It's beautiful." (Acknowledge this. Moore agrees it has *some* value.)
  *   **Activity:** Present World B (The Messy Full Dinner). Ask: "Universe contains only this. Is it good?"
      *   *Consensus:* They will overwhelmingly choose B.
  *   **The Turn:** Ask: "Why? Is the conversation just 'pleasure'?" (Head off Utilitarianism here—see Misconception Map). "Is the burnt food 'bad art'?" (Head off Art-for-Art's-Sake).
  *   **Goal:** Establish that World B is better, not because the *parts* are better (the food is worse), but because the *combination* creates something the parts lack.

  **0:50 – 1:10: Organic Unities (The Whole > Sum of Parts)**
  *   **Concept:** This is the machinery. Explain that value isn't additive. 1 unit of Beauty + 1 unit of Friendship does not equal 2 units of Good. Sometimes it equals 10. Sometimes it equals 0 (e.g., a beautiful setting for a betrayal).
  *   **Activity:** Ask them to identify a scene in their own work where a "beautiful sentence" feels dead because the "consciousness" around it is wrong. Or where a "clumsy paragraph" works because the emotional unity is high.
  *   **Goal:** Move from the philosophical example to their manuscripts. The "Organic Unity" is the *Scene*.

  **1:10 – 1:40: The Two Goods (Mapping to Craft)**
  *   **Moore's Claim:** Beauty (apprehension of objects) and Personal Affection (consciousness of minds) are the only things worth having.
  *   **Application:** Tell them: "Your job is not to teach truth. It is not to solve social problems. It is to construct Organic Unities that allow a reader to experience Beauty or Affection."
  *   **Constraint:** If a passage is beautiful but isolates the reader (World A), it has less value than a passage that is rough but creates intimacy (World B).
  *   **Goal:** Give them permission to prioritize connection over "perfect prose," while retaining the demand for beauty.

  **1:40 – 2:00: Synthesis and The Final Question**
  *   Review the trajectory: Isolation -> The Dinner -> The Unity -> The Draft.
  *   Ask the Diagnostic Question (see below).

  ### 3. The Misconception Map
  *In the order they will arrive. Head them off at the pass.*

  **1. "Beauty is Subjective" (Arrives: 0:25)**
  *   *The Trap:* Someone says, "I don't like crystal. I prefer the kitchen table." They will collapse Moore's "Beauty" into "Taste."
  *   *The Intercept:* During the World A description, stop them. "It doesn't matter if *you* like it. Assume it is objectively beautiful. The question is: Does beauty *without a mind to see it* hold value?"
  *   *Why:* Moore isn't arguing about taste; he's arguing about the necessity of *consciousness*. If you let them debate taste, you lose the "Isolation" point.

  **2. "So Maximize Pleasure" (Arrives: 0:40)**
  *   *The Trap:* They will hear "World B is better" and think "Because the people are happier." This turns Moore into a Utilitarian (Bentham/Mill).
  *   *The Intercept:* When they say "They're happier," correct them. "Imagine they aren't happy. Imagine they are grieving together. Is that world still better than the empty crystal?"
  *   *Why:* Moore's "Personal Affection" includes grief, struggle, and complex states, not just hedonistic pleasure. You must separate *Good* from *Happy*.

  **3. "Art for Art's Sake" (Arrives: 1:15)**
  *   *The Trap:* They will think you're saying "Beauty is the only thing that matters," leading to precious, hollow writing.
  *   *The Intercept:* During the "Two Goods" section. Be explicit: "Moore ranks the appreciation of human minds *higher* than the appreciation of objects. A beautiful sentence about nothing is worth less than a clumsy sentence about a real friend."
  *   *Why:* This prevents them from using this session to justify navel-gazing. It prioritizes *connection* (World B) over *aesthetics* (World A).

  ### 4. What to Leave Out
  **The Naturalistic Fallacy.**
  You are tempted to bring it in. Do not.
  *   **Why:** It requires defining "good," distinguishing "is" from "ought," and discussing definitions. It is purely defensive philosophy. It offers zero utility to a writer trying to fix a scene.
  *   **The Cover:** If someone asks, "But how do you *know* that's good?" say: "We aren't proving the value today. We are testing where the value *lives*. We are taking the 'Good' as a given and looking for its location."
  *   **Time Saved:** 40 minutes. Use that time for the Organic Unity exercise.

  ### 5. The Diagnostic Question
  Do not ask: "Did you understand Moore?"
  Do not ask: "Do you agree?"

  **Ask this:**
  > "Think of a passage you've written that you love, but readers find cold. Using the Dinner Party model: Is that passage World A or World B? And what specific element would you have to add—not to the prose, but to the *consciousness* in the scene—to turn it into the other?"

  **Why this works:**
  *   If they answer by talking about "fixing the metaphors," they missed the point (they're still in World A).
  *   If they answer by talking about "adding a character's reaction" or "changing the relationship," they grasped the Organic Unity (they understand value lies in the *connection*, not just the *object*).
  *   It forces them to apply the philosophy to a problem they actually have.

  ### Summary of Decisions
  *   **Example:** The Dinner Party (Reject the Landscape).
  *   **Order:** Isolation -> Example -> Organic Unity -> Application.
  *   **Cut:** Naturalistic Fallacy.
  *   **Tone:** Do not teach philosophy. Teach *valuation*.

  Stick to this. If you drift into defining terms, you'll lose them. If you keep them focused on the *location* of value in the Dinner Party, they will leave with a tool they can use the next morning.
