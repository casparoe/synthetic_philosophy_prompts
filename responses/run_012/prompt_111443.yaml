      *   *Modal Status:* Is it necessarily true (metaphysical law) or contingently true (empirical fact)?
      *   *Direction:* PII (Indiscernibles $\rightarrow$ Identical) vs. IoI (Identical $\rightarrow$ Indiscernible). IoI is logical truth. PII is the controversial one.

  3.  **Address the "Ill-Posed" Constraint:**
      *   Is it a mistake to ask for *the* principle? Yes, largely. Philosophers acknowledge PII is a schema, not a single atomic claim. However, simply saying "It's ill-posed" is unhelpful to a physicist seeking clarity. The better approach is to validate the user's suspicion (it *is* a family of claims) but then provide the taxonomy they asked for to show *how* they differ. I should explicitly state that there is no single "PII" but rather a spectrum of principles.

  4.  **Drafting the Taxonomy (The "Menu"):**
      *   *Version 1 (Strong/Metaphysical):* Intrinsic qualitative properties only. Necessarily true. (Verdict: False/Dubious).
