      *   **User Persona:** Retired experimental physicist (30 years), now sitting in on philosophy seminars. High intelligence, familiar with scientific rigor (quantum numbers, identical particles), encountering philosophical concepts for the first time in a serious way. Skeptical of ambiguity, wants precision ("distinct precise theses," "verdict," "confidence").
      *   **Core Problem:** The user encounters Leibniz's Principle of the Identity of Indiscernibles (PII) in three different contexts (quantum physics, Black's spheres, spatiotemporal location) and suspects it might be equivocation (one phrase, three different claims).
      *   **Task:**
          1.  Disambiguate the maxim into distinct precise theses.
          2.  Vary them by properties included (qualitative, relational, spatiotemporal, identity-involving).
          3.  Vary them by modal strength (necessity, contingency, linguistic constraint).
          4.  Distinguish PII from the Indiscernibility of Identicals (Leibniz's Law).
          5.  Provide a verdict for each (Trivial, Substantive/Defensible, Substantive/Dubious, False).
          6.  Assign confidence levels and flag contested areas.
          7.  Analyze the three specific use-cases provided by the user (Coffee room/Quantum, Reading Group/Black, Friend/Location).
          8.  Address the specific question: Does the quantum case bear on the metaphysical principle?
          9.  **Crucial Constraint:** If the request is ill-posed (i.e., it *is* just a family of claims with no core), say so plainly.

  2.  **Deconstruct the Principle (PII):**
      *   *Standard Formulation:* If $x$ and $y$ share all properties, then $x = y$. (Contrapositive: If $x \neq y$, then there is some property $P$ such that $P(x)$ and not $P(y)$).
      *   *The Catch:* What counts as a "property"?
          *   Purely qualitative (intrinsic)?
          *   Relational (to other objects)?
          *   Spatiotemporal (location)?
