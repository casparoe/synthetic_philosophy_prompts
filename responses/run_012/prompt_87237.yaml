  **Eulogy for Nani**

  Thank you all for coming. Looking around this room, I realise that if you tried to describe the person we're here for based on the people who loved her, you'd end up with a list of contradictions. We have her sisters and family, who knew her in India and here. We have Granddad's family from Yorkshire. We have neighbours, colleagues from the health centre, and even some of my work mates who never met her but insisted on coming anyway. That mix isn't an accident. It's the only accurate way to describe her.

  Nani came to England in the sixties. She was Gujarati, deeply rooted in that soil, and yet she became a fixture of Solihull. To say she was Indian is true. To say she was British is also true. Neither statement covers the whole of it. She cooked dal that could clear a sinus, but she also mastered the Yorkshire pudding for Granddad. She didn't blend them into a mush; she kept them distinct, side by side, on the same plate. She taught us that you don't have to dissolve one thing to make room for another.

  She was gentle. Anyone who knew her at the health centre knows that. She had a quietness about her that made people feel safe. But she was also incredibly hard. It takes a certain steel to leave your home at twenty, to raise children in a place that wasn't always welcoming, to stand your ground when people told you to go back where you came from. She was soft, and she was unyielding. Both are true. In some respects, she was the quietest person in the room. In other respects, she was the loudest.

  She used to talk to me about *anekantavada*. When I was small, I thought she meant that everyone's opinion is equally valid. That if I said the sky was green and she said it was blue, we were both right. She corrected me on that, often. She meant that the sky is complex, and our words are limited. She meant that truth depends on where you're standing.

  So, I have to be careful speaking about her now. If I say she has gone to a better place, that might comfort some, but she would have called it false. If I say she is gone forever, that feels true to me, but it ignores the way she remains present in this room. So I will say this: In a way, she has left us. The body is here to be cremated, and that process is final. In another way, she has not left us. The habits she formed, the kindnesses she insisted on, the arguments she started—they are still active in us. She is not looking down on us. She is in the way we speak to each other.

  Granddad was a Methodist, though lapsed. She was Jain by tradition. They were different. She hated the idea that all religions are essentially the same. She said that flattening differences is a form of disrespect. So I won't say they believed the same things. They didn't. But they built a life where those differences didn't need to be resolved to be compatible. He is waiting for her, in the way memory works. She is with him, in the way grief binds people together.

  I don't know what happens next. I can't stand here and claim she has achieved liberation, or that she is waiting for rebirth. I don't know. But I know that when you try to sum up a life like hers in a single sentence, you fail. She was a wife, and she was her own person. She was traditional, and she was radical. She was here, and now she is not.

  We are here to witness those truths, not to resolve them. Thank you.

  ***

  **Note on Construction and Omissions**

  **What I was doing:**
  I structured the speech to embody *anekantavada* (many-sidedness) without lecturing on it. Instead of saying "truth is relative," I paired contradictory predicates ("She was soft... she was unyielding") to show that both are objectively true in different respects (*syat*). I avoided resolving the tension between them. I also explicitly referenced her correction of your misunderstanding (that it isn't just "everyone's opinion is valid") to signal to the knowledgeable aunties and your uncle that you've grasped the nuance. The ending refuses to assert an afterlife while acknowledging the persistence of her influence, adhering to your agnostic position without contradicting her specific beliefs.

  **What I left out:**
  1.  **Specific Religious Terminology:** I didn't explain the *saptabhangi* (seven-fold predication) or use the word *syat* repeatedly. Doing so in a crematorium with mixed faiths would have turned a eulogy into a seminar.
  2.  **Cause of Death/Illness:** You didn't provide details, and usually, unless it's central to the story, it's safer to omit to keep the focus on her life.
  3.  **"She's in a better place":** As requested, I stripped out all standard Christian or secular comforting clichés about the afterlife that she would have rejected as false.
  4.  **Emotional Meltdown:** I kept the tone steady. You mentioned you're the one who can "get through it without dissolving." The speech reflects that stability; it's dignified rather than raw, which fits the role you've been assigned by the family.
  5.  **Americanisms:** Checked for British spelling and phrasing (e.g., "centre," "realise," "Solihull," "mates"). No "passed away" (used "left us"/"cremated"), no "celebration of life."

  **Check with the Aunties:**
  The line about her hating the idea that "all religions are essentially the same" is crucial. It signals respect for her specific Jain identity rather than absorbing it into a generic "spiritual" blob. If your uncle asks, the structure of the speech (affirming A, then affirming not-A, without contradiction) is the practical application of the doctrine, which should satisfy him that you haven't trivialised it.
