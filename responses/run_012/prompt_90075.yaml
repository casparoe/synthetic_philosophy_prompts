      *   **Tone:** Direct, pedagogical, structured, slightly provocative (matching the user's "went at it for two hours" vibe).

  2.  **Deconstruct the Core Challenges:**
      *   *Independence:* This is the usual failure point. People assume "average competence" saves the day even if voters copy each other.
      *   *Example:* Criminal juries are overused and bring in baggage (reasonable doubt, legal standards). Need something binary, truth-apt, but prone to correlation.
      *   *Misconceptions:* "Truth" vs. "Preference" and "Competence" vs. "Information."
      *   *Condorcet Tension:* CJT assumes single dimension (truth), Paradox assumes multi-dimension (preferences). Need to bridge them without confusing the group.
      *   *Time/Effort:* Cut the math proof. Focus on intuition and implications.

  3.  **Select the Core Example:**
      *   *Idea 1:* Medical Diagnosis. (Good, binary, prone to shared bias).
      *   *Idea 2:* Stock Market Prediction. (Good, but "truth" is slippery).
      *   *Idea 3:* Historical Fact-Finding. (Fits the historian, binary, prone to shared sources).
