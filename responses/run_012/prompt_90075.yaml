      *   *The Twist (Condorcet Paradox):* How to link? CJT is about *epistemic* truth (one right answer). Paradox is about *preferences* (no right answer). The tension is: When do we treat politics like X-rays and when like pizza toppings?
      *   *Closing Question:* Needs to test the independence/competence distinction.

  6.  **Refining the "Independence" Strategy:**
      *   User wants independence to feel load-bearing.
