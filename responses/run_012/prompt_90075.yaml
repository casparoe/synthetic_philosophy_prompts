answer: |-
  Here is the session plan. It is designed to be 90 minutes. It is aggressive on the independence assumption and uses a single running example to avoid abstraction drift.

  ### The Core Example: Radiologists Reading X-Rays
  **Do not use criminal juries.** They bring normative baggage (reasonable doubt, liberty vs. security) that distracts from the epistemic math.
  **Use this instead:** A hospital wants to detect a specific, rare fracture.
  *   **The Truth:** The bone is either Broken or Not Broken.
  *   **The Voters:** Radiologists.
  *   **The Vote:** "Broken" or "Not Broken."
  *   **Why this works:** It is binary (required for CJT). It has a ground truth (required for CJT). It is numerate-friendly (sensitivity/specificity). Crucially, it makes **correlation** intuitive: if the X-ray machine has a glitch, *all* doctors see the same artifact. If they all trained at the same school, they share the same bias.

  ---

  ### Phase 1: The Setup & The Trap (0–20 mins)
  **Goal:** Define competence without "smartness" and introduce independence as a co-equal pillar, not a footnote.

  1.  **The Scenario:** Put the X-ray on the screen. It's ambiguous. Ask the group: "If one doctor is right 60% of the time ($p=0.6$), and we hire three, what's the chance the majority is right?"
  2.  **The Definition:** Explicitly define **Competence** as $P(\text{Vote} = \text{Truth})$.
      *   **Head Off Misconception #1:** Stop anyone from equating this with IQ or expertise. A tired expert with $p=0.4$ is *worse* than a coin flip. If $p < 0.5$, adding more voters makes the outcome *worse* (convergence to wrong answer). State this clearly before moving on.
  3.  **The Hidden Pillar:** Before you show the math of convergence, ask: "What are we assuming about how these three doctors decide?"
      *   Guide them to **Independence**. Doctor A's error cannot predict Doctor B's error.
      *   **Make it Load-Bearing:** Do not present the theorem yet. Present the *conditions*. Write on the board: **1. Binary Truth. 2. $p > 0.5$. 3. Independence.** Tell them: "If any one of these legs breaks, the theorem doesn't just wobble; it falls over. We are going to test leg #3 today."

  ### Phase 2: The Miracle (20–40 mins)
  **Goal:** Show the convergence, but keep the focus on the *mechanism* (error cancellation).

  1.  **The Intuition:** Don't derive the binomial distribution. They are numerate but not probabilists. Use the "Error Cancellation" story.
      *   If errors are independent, they are noise. Noise cancels out. Signal ($p > 0.5$) accumulates.
      *   Show the curve: As $N \to \infty$, Probability of Correct Majority $\to 1$.
  2.  **The Economists' Nod:** Acknowledge that this looks like the "Wisdom of Crowds." It is. But emphasize that Wisdom of Crowds *requires* the errors to be uncorrelated.
  3.  **Check:** Ask the historians/philosophers: "Why does the size of the group matter if the average competence stays the same?" (Answer: Because variance of the mean decreases *only if* covariance is zero).

  ### Phase 3: The Collapse (40–65 mins)
  **Goal:** Break the independence assumption and watch the theorem die. This is the core of your session.

  1.  **The Intervention:** Change the scenario. "The hospital buys a new X-ray machine. It has a subtle calibration error that makes healthy bones look fractured 10% of the time."
  2.  **The Question:** "You now have 1,000 doctors. They are still individually 60% competent ($p=0.6$). But they are all looking at the *same* flawed machine output. Their errors are now correlated."
  3.  **The Result:** Ask: "Does adding more doctors help?"
      *   **Answer:** No. If the machine lies, the majority lies. $N$ becomes irrelevant. The probability of a correct majority stays at roughly 0.6 (or drops, depending on how you model the shared error).
  4.  **The Social Version:** "Okay, no machine. But the doctors all trained at the same medical school and were taught a heuristic that fails in this specific case."
      *   **Point:** Shared culture/training = Correlated Error.
      *   **Head Off Misconception #2:** This is where you stop them from thinking CJT proves majority rule tracks truth. CJT proves majority rule tracks truth *only if* voters are not echoing each other. In politics, voters read the same news, hear the same speeches. Independence is the first thing to go in a democracy.
  5.  **Takeaway:** Independence is not a technical footnote; it is the *engine*. Without it, you don't have error cancellation; you have error amplification.

  ### Phase 4: The Condorcet Tension (65–80 mins)
  **Goal:** Connect CJT (Facts) to Condorcet's Paradox (Values) without it feeling like a "gotcha."

  1.  **The Pivot:** "We've been talking about X-rays. There is a truth. Broken or Not Broken. This is an **Epistemic** problem."
  2.  **The Turn:** "Now, the patient is healed. The hospital board must decide: Do we buy the cheap machine (Option A), the fast machine (Option B), or the precise machine (Option C)? There is no 'truth' here. There are only preferences."
  3.  **The Paradox:** Briefly sketch the cycling paradox (A beats B, B beats C, C beats A).
  4.  **The Tension:**
      *   **Condorcet 1 (Jury):** Majority rule finds the truth *if* it exists and errors are independent.
      *   **Condorcet 2 (Paradox):** Majority rule creates incoherence *if* there is no truth (preferences are multi-dimensional).
      *   **The Lesson:** The tragedy of democratic theory is that we often treat **Values** (Paradox territory) as if they are **Facts** (Jury territory). We assume there is a "will of the people" (truth) when there is only a cycle of preferences.
      *   **For the Philosophers:** This is the Is/Ought gap in voting form.
      *   **For the Economists:** This is the difference between aggregating information vs. aggregating utility.

  ### Phase 5: The Closing Question (80–90 mins)
  **Goal:** A diagnostic tool to see if they grasped the independence/competence trade-off.

  **Do not ask:** "What is the Condorcet Jury Theorem?"
  **Ask this:**
  > "You are designing a forecasting panel. You have a budget for either:
  > (A) 100 forecasters who are slightly better than chance ($p=0.51$) and make errors independently.
  > (B) 5 forecasters who are experts ($p=0.75$) but they all use the same model.
  >
  > **Which panel is more likely to be correct, and why does the 'expert' panel violate a specific assumption of the theorem?**"

  *   **Correct Answer:** Panel A. The expert panel violates **Independence**. Their high competence is negated by high correlation (systematic error).
  *   **What to listen for:** If they argue for Panel B because "0.75 is higher than 0.51," they missed the session. If they talk about "systematic risk" or "shared bias," it landed.

  ---

  ### What to Cut
  1.  **The Math Proof:** Do not write out the binomial sum. It eats time and creates a false sense of rigor. Use the intuition of "noise cancellation."
  2.  **Condorcet's Biography:** Nobody cares about the Marquis de Condorcet's life story. Care about the tension between his two ideas.
  3.  **Weighted Voting:** Don't get into "should experts count for more?" It muddies the independence water.
  4.  **Bayesian Updates:** Unless an economist pushes hard, keep it frequentist. $p$ is a fixed parameter for the sake of the lesson.

  ### Facilitator Notes (The "Gotchas" to Watch)
  *   **If the Historian says:** "But in real history, voters aren't independent."
      *   **Response:** "Exactly. That's why CJT is a baseline, not a description. It tells us *why* real elections might fail to track truth."
  *   **If the Economists say:** "Efficient Markets Hypothesis already covers this."
      *   **Response:** "EMH assumes independence of information. CJT tells you what happens when that assumption breaks (bubbles)."
  *   **If the Philosophers say:** "What is Truth?"
      *   **Response:** "For this theorem, Truth is just a binary state of the world. Don't ontologize it; treat it as a parameter."

  ### Why This Plan Works
  It forces Independence into the spotlight by making it the *prerequisite* for the "Miracle" in Phase 2, and then immediately removing it in Phase 3 to show the collapse. By switching from X-Rays (Facts) to Machine Purchasing (Values) in Phase 4, you honor the user's request to show the Condorcet tension not as a contradiction, but as a boundary condition on when majority rule works.
