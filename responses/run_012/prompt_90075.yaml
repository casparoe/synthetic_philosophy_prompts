prompt: |-
  So my friend and I went at it for like two hours last night — he says the Condorcet jury theorem is basically a parlor trick and the whole thing collapses the moment you drop independence, and I think he's half right but confused about which assumption is actually doing the work. Anyway, I have to run the next session of our reading group (mixed bag — two economists, a few philosophers, one historian; numerate, but nobody's a probabilist) and I want to teach this properly instead of just restating the theorem. Don't explain it to me, plan the session. What has to come first so that the independence assumption feels load-bearing rather than a footnote at the end? What one example should carry the whole thing, and why not a criminal jury (I'm so sick of that one)? What will they get wrong — my guess is they'll leave thinking it proves majority rule tracks the truth, or that competence just means how smart the voters are — and at exactly which point in the sequence do I head each of those off? I also want them to see that the same guy who gave us more-voters-is-better also gave us majority cycling, so tell me how to stage that so it lands as a tension and not a gotcha. Give me one closing question that tells me whether it actually landed, and tell me what to cut. Be opinionated: pick the example, make the calls, alot of these plans just hand you a menu.
