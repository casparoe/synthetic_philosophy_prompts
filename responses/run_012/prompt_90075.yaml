      *   *Phase 2: The Magic (20 mins).* Show the convergence.
      *   *Phase 3: The Collapse (25 mins).* Break independence. This needs to be the centerpiece.
      *   *Phase 4: The Condorcet Tension (20 mins).* Connect to Paradox.
      *   *Phase 5: Closing (10 mins).* The question.

