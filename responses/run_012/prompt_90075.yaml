      *   *Why:* It's binary (fracture/no fracture). It has a ground truth. It's easy to model competence ($p > 0.5$). Crucially, it's *very* easy to show how independence fails (same training, same machine artifact, same lighting). It avoids the normative baggage of voting for policies.

  4.  **Structure the Session (90 Minutes):**
