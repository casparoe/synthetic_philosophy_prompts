          *   *Why Ratification != Intrinsic:* A sample could meet the intrinsic specs by accident (e.g., a different alloy that happens to match the numbers) but if it wasn't produced/tested under the A36 protocol, it isn't A36 steel in the engineering science. The *status* depends on the procedural license.
          *   *Is this "Science"?* Materials science is science.
          *   *Is it realistic?* Yes.
          *   *Is it cliché?* No.

      *   *Wait, one more check:* The prompt asks for "a category whose membership is fixed by a standing authoritative body is fair game." This points directly to standards/regulations.
      *   *Let's refine the "Ratification != Intrinsic" condition.*
          *   If Ratification says Yes *because* it meets the intrinsic specs, it reduces to (1).
