answer: |-
  **The Case**
  Consider the category **"EPA Protocol Gas"** used in atmospheric chemistry for calibrating monitors measuring nitrogen dioxide ($NO_2$). To qualify, a gas cylinder must contain $NO_2$ balanced in nitrogen at a specific concentration (e.g., 100 ppm) with impurities below strict thresholds (Intrinsic Cluster). However, these cylinders are produced by competing commercial gas manufacturers using source chemicals derived from distinct geological deposits or synthetic pathways, meaning no two cylinders share a common physical ancestry or production lineage (Origin). Furthermore, a cylinder is only an "EPA Protocol Gas" if it is accompanied by a certificate of analysis traceable to NIST standards through an unbroken audit trail mandated by 40 CFR Part 50; a mixture prepared in a university lab that is chemically indistinguishable from a certified cylinder but lacks this procedural chain is excluded from the category for regulatory and scientific purposes (Ratification).

  **The Verdicts**
  1.  **Intrinsic-Cluster (Yes):** The account verdicts **YES** because all members of the category share a stable homeostatic cluster of chemical properties (concentration, purity, stability) sustained by the mechanisms of chemical bonding and containment. The chemically identical university mixture also shares this cluster, confirming that the intrinsic profile is sufficient for kindhood on this view.
  2.  **Origin (No):** The account verdicts **NO** because the category admits members with radically divergent causal histories. Cylinder A (produced in Ohio) and Cylinder B (produced in Germany) do not descend from a common physical ancestor (unlike biological tokens of a species), nor do they share a unified causal process of formation beyond the abstract similarity of following a recipe. The chemically identical university mixture further demonstrates that shared history is not necessary for the category's application in practice.
  3.  **Ratification (Yes):** The account verdicts **YES** because the category is constituted by the classificatory procedure licensed by the EPA and NIST. Crucially, this does not reduce to (1) because the procedure *excludes* the chemically identical university mixture. The kindhood is fixed not merely by the properties, but by the *authorization* of those properties via the audit trail; the "joint" is carved by the regulatory body's decision to treat only certified gases as valid calibrators, making the procedural status ontologically prior to the intrinsic match in the context of the science.

  **The Crucial Feature**
  The feature doing the work is the **procedural exclusion of intrinsic duplicates**. The disagreement hinges on whether a chemically perfect duplicate lacking the certification audit trail counts as a member. If this feature is removed (i.e., if certification is made automatic upon chemical verification), the Ratification account collapses into the Intrinsic-Cluster account, and the Origin account remains negative unless "following the recipe" is reinterpreted as a causal history.

  **The Origin Theorist's Strongest Reply**
  The Origin theorist might argue that the **Standard Operating Procedure (SOP)** itself acts as the common cause. They could claim that all valid cylinders are effects of the same normative causal force: the EPA/NIST specification document which causally influences the manufacturers to produce the gas in a specific way. By treating the *instruction set* as a causal ancestor, they attempt to unify the diverse physical histories under a single etiological umbrella.

  **Does the Reply Land?**
  This reply fails to save the pure Origin account without conceding to Ratification. First, normative documents do not cause physical properties in the requisite sense; they guide agents who *then* cause the properties. If the Origin theorist relies on the agents' compliance, they are relying on a *decision* to follow the rule, which smuggles in the Ratification element (the licensing of the procedure). Second, this move cannot exclude the university mixture, as the grad student could also be causally influenced by the same public document. To exclude the student's mixture, the Origin theorist must appeal to the *authority* of the document (who is allowed to follow it), which is precisely the Ratification condition. Thus, the Origin theorist cannot convert the shared intrinsic structure into a common cause without admitting that the "cause" is actually a classificatory decision.
