  You hold a voucher redeemable for cash, and you face two separate decisions. In Choice 1, you can take Option A (a guaranteed $100) or Option B (a 20% chance of $500, a 70% chance of $100, and a 10% chance of $0). In Choice 2, you can take Option C (a 30% chance of $100, otherwise $0) or Option D (a 20% chance of $500, otherwise $0). You prefer the security of A over B, but when the guarantee is removed in the second scenario, you prefer the higher upside of D over C.

  **Checks**

  **REU Scores ($u(x)=x, r(p)=p^2$):**
  *   **Option A:** $0 + (100-0)r(1.0) = 100(1) = \mathbf{100}$.
  *   **Option B:** $0 + (100-0)r(0.9) + (500-100)r(0.2) = 100(0.81) + 400(0.04) = 81 + 16 = \mathbf{97}$.
      *   *Preference:* A > B.
  *   **Option C:** $0 + (100-0)r(0.3) = 100(0.09) = \mathbf{9}$.
  *   **Option D:** $0 + (500-0)r(0.2) = 500(0.04) = \mathbf{20}$.
      *   *Preference:* D > C.

  **Expected Value Scores ($u(x)=x, r(p)=p$):**
  *   **Option A:** $100$.
  *   **Option B:** $0.2(500) + 0.7(100) + 0.1(0) = \mathbf{170}$.
      *   *EV Maximizer Choice:* B.
  *   **Option C:** $0.3(100) = \mathbf{30}$.
  *   **Option D:** $0.2(500) = \mathbf{100}$.
      *   *EV Maximizer Choice:* D.

  **Where the Convexity Works:**
  The reversal happens at the **drop from certainty**. In Choice 1, moving from A to B drops the probability of getting at least $100 from $1.0$ to $0.9$. Under $r(p)=p^2$, the weight falls from $1.0$ to $0.81$—a loss of $0.19$ weight for only $0.10$ probability. This disproportionate penalty for losing certainty drives the preference for A. In Choice 2, neither option offers certainty; the weights scale quadratically but don't suffer the "certainty penalty," allowing the higher payoff of D to dominate.

  **Collapsing to EU ($r(p)=p$):**
  If we flatten the risk function to $r(p)=p$, REU becomes EU.
  *   Choice 1: A scores 100, B scores 170. The agent picks B.
  *   Choice 2: C scores 30, D scores 100. The agent picks D.
  The contradiction vanishes because the agent no longer prefers A over B; they consistently maximize expected value. The specific pair of preferences (A > B and D > C) that violated EU is impossible to generate once $r$ is linear.

  **Load-Bearing Feature & EU Defense**
  The load-bearing feature is the **certainty effect**: the agent treats the shift from probability 1.0 to 0.9 as psychologically larger than the shift from 0.3 to 0.2, purely due to the shape of $r$.

  An EU defender would **deny the stipulation that utility is linear**. They would argue that the agent does not actually value money as $u(x)=x$, but instead has a concave utility function (diminishing marginal utility, e.g., $u(x)=\sqrt{x}$). They would claim that what REU attributes to the risk function $r$ is actually just curvature in the utility function $u$. To keep EU intact, they must insist that there is no separate "risk attitude" parameter; all risk behavior must be explained by how much the agent values the dollars themselves.
