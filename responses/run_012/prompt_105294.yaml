  Finally: say which single feature of the case is load-bearing, and tell me honestly how someone defending plain EU would try to defuse it — what would they have to deny, stipulate away, or reinterpret to keep their theory intact?

  Start with the case itself on the first line, no preamble and dont restate my question, then the checks.
