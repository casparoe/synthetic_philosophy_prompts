  - One agent. Linear utility in money, u(x)=x. Risk function r(p)=p^2. So every scrap of risk behaviour in the story comes from r and none of it from the utility curve.
  - Three dollar amounts, one scale, ordinary money (nothing past a few hundred bucks).
  - Two separate choices. In each, the agent picks between two options, and each option is a lottery over those same three amounts.
  - Taken together the two choices must be impossible for any expected-utility maximizer: no utility function whatsoever, beliefs held fixed, lets an EU agent make both of the picks my REU agent makes. I.e. the pair has to violate independence / the sure-thing principle, and I want to see exactly which pair of options does it.
