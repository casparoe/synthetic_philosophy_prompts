answer: |-
  **Project Title:** The Publicity Condition: A Concealment-Based Criterion for Cross-Cultural Corruption Analysis

  **Research Question**
  Is concealment a necessary condition for corruption across diverse political orders? This project asks whether a definition of corruption grounded in the *epistemic status* of a transaction (secret vs. public) can resolve the applicability problems inherent in definitions grounded in the *structural status* of the actor (public office vs. private role).

  **Problem Statement**
  Current anti-corruption frameworks rely on two competing accounts, both of which leave the cross-cultural application of the term indeterminate.
  1.  **The Office-Based Account:** Defines corruption as the abuse of public office for private gain. This presupposes a Weberian state with differentiated public/private roles. In political orders where patronage is institutionalized and role-differentiation is weak, this definition either fails to apply or incorrectly labels systemic governance as "corrupt."
  2.  **The Standards-Based Account:** Defines corruption as a violation of universal ethical norms. This invites charges of ethnocentrism, as the "standards" are often indistinguishable from Western bureaucratic ideals.

  Both accounts struggle to distinguish between *open patronage* (which violates office-based norms but lacks deceit) and *secret transfers* (which may violate no formal rule but evade scrutiny). By treating these as equivalent, current literature obscures the specific harm of corruption. If corruption is fundamentally a betrayal of public trust, that betrayal may be constituted by the act of hiding, regardless of the specific bureaucratic structure.

  **Methodology**
  This is a six-month, single-investigator conceptual project requiring no fieldwork. The method involves a hermeneutic analysis of existing case literature in comparative politics and political theory. I will re-examine canonical cases of alleged corruption (e.g., clientelism in Latin America, *guanxi* in East Asia, patronage in post-Soviet states) not to gather new data, but to code them according to the visibility of the transaction.

  The analysis will test whether cases universally condemned as corrupt share the feature of concealment, even when they diverge on office-holding, and whether openly acknowledged patronage is consistently treated as distinct from corruption in local discourse. The work is strictly desk-based, utilizing existing translated texts and secondary case descriptions.

  **Genuine Result vs. Taxonomy**
  A mere taxonomy would categorize cases into "open" and "secret" types. A genuine result will establish a **normative criterion**. Success means demonstrating that concealment is not merely a contingent feature of some corrupt acts, but a constitutive element of the concept itself. If successful, the project will show that the "universality" problem is solvable: we can identify corruption without exporting a specific state structure, provided we identify the violation of the publicity condition. This shifts the debate from "whose rules?" to "why hide?"

  **Failure Conditions**
  The project will be deemed to have failed if:
  1.  **The Distinction Collapses:** Analysis shows that in practice, "open patronage" and "secret corruption" are functionally identical in their impact on governance, rendering the epistemic distinction morally irrelevant.
  2.  **Cultural Loading:** The value placed on "publicity" or "transparency" proves to be as culturally specific as the "public office" distinction, meaning the concealment criterion is simply another form of Western export.
  3.  **Indeterminacy:** The re-coding of cases yields inconsistent results (e.g., universally condemned acts that were fully public, or secret transfers universally regarded as benign), proving concealment is neither necessary nor sufficient for the label.

  **Feasibility**
  The scope is limited to conceptual clarification and literature review, well-suited to a six-month timeline. The deliverable is a journal-ready manuscript proposing the "Publicity Condition" as a corrective to standard institutional definitions.
