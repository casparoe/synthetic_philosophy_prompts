      *   **Research Question:** Needs to be answerable. "Is there a universal definition?" is too vague. Better: "Does a concealment-based criterion resolve the cross-cultural applicability problem of corruption definitions?" Or: "Can corruption be defined independently of state structure?" Let's refine: *Can a 'concealment-based' criterion of corruption provide a cross-culturally valid alternative to 'office-based' definitions?*
