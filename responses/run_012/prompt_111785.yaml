answer: |-
  Good evening. My name is [Name], and I'm a junior here.

  I'm not standing here to demand the right to text in class. I'm not here to tell you that phones are harmless. I'm here because the policy on the table tonight isn't just about phones. It's about how this school understands learning itself.

  The proposal before you says: Lock the phones away. All day. Every day. Starting this fall. No review date. No provision for changing course.

  That last part is where I need you to pause.

  In science class, we learn that you don't treat a guess as a fact. You test it. You gather data. You look at what actually happens. But this policy treats a hypothesis as a settled truth. It assumes we know exactly what the outcome will be, and it removes our ability to adjust if we're wrong.

  John Dewey, who wrote extensively about how schools function, argued that any policy about learning should be treated as an experiment. He called our goals "ends-in-view." That means they are targets we aim for, but if the evidence shows we're missing the mark, we move the target. We don't blindfold ourselves and keep shooting.

  By removing the review date, this board isn't making a decision; you're closing an inquiry. You're saying the investigation is over before the school year even begins.

  I know three of you want to resolve this tonight. I understand the desire for closure. But a vote tonight shouldn't be the end of the matter. It should be the start of a genuine investigation. And on this view, a school is only truly democratic if the people who live with the consequences of a decision help judge whether it worked.

  That is why I am proposing a concrete alternative.

  Do not adopt this as a permanent mandate. Adopt it as a single-semester experiment.

  Here is the structure: We try the pouches for one semester. But before we start, we fix the success criteria. Is the goal higher test scores? Better mental health? More engagement in class discussion? Define those numbers now.

  Then, at the end of the semester, the decision to continue or cancel is not made by the board alone. It is made by a joint panel of students, teachers, and board members reviewing the evidence together.

  Some might say this is just a courtesy to students. I am arguing it is necessary for the board to be inquiring at all. If you impose a consequence on us without letting us participate in judging the outcome, you aren't running a school; you're running a facility. You are treating students as objects to be managed, not partners in learning.

  I want to be clear to the board members who are worried about order: I am not claiming this policy will fail. It might work. Maybe locking away our phones will unlock our brains. If the data at the end of the semester shows that grades are up, anxiety is down, and learning is deeper, then I will be the first to say: Keep the pouches. I will lock my phone every day without complaint.

  But if the evidence shows that engagement drops, or that students feel more disconnected, or that the friction isn't worth the focus, then we need the freedom to change course.

  To the teachers here who know the literature: You know that education is growth, and growth requires flexibility. To the students: This isn't about winning a fight over screens. It's about demanding that our school acts like a place of learning, not just a place of rules.

  If we adopt this policy as permanent tonight, we stop learning. We decide that we know everything we need to know about how humans learn in a digital age. That is arrogant, and it is unscientific.

  So, my request is simple. Vote for the experiment. Vote for the review. Vote for a process where the evidence matters more than the authority.

  Give us one semester. Let us measure the results together. And if the data says the ban works, you have my word that we will accept it. But please, do not close the book on this question before you've even read the first chapter.

  Thank you.
