      *Constraint:* "I cannot... treat the majority vote as the end of the matter." I need to explicitly say that voting tonight isn't the end of the inquiry.

      *Constraint:* "defer to expert judgment alone." I need to say experts (board/admin) aren't enough; students are partners in evidence gathering.

