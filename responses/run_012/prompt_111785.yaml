prompt: |-
  I am a high school junior, and next month my school board votes on a policy that would require every student to lock their phone in a pouch for the entire school day starting in the fall, with no review date and no provision for changing course. I have five minutes at the meeting to argue that the board should adopt it differently. My case is Deweyan: a policy about how students learn is a hypothesis rather than a settled fact, the ends we aim at are properly held as ends-in-view and revised in light of what follows from them, and a school is genuinely democratic only insofar as the people who undergo the consequences of a decision take part in forming the problem, gathering the evidence, and judging the outcome. Write the speech. Please build it around one concrete proposal, namely that the policy be adopted as a single-semester experiment whose success criteria are fixed in advance and whose continuation is decided by a joint panel of students, teachers, and board members, since on the Deweyan view that structure is not a courtesy but the only way the board can be said to be inquiring at all. The room is mixed: three board members who want the vote finished, two teachers who have actually read Dewey, and several hundred students who will tune out anything that sounds like a textbook. I cannot claim the policy will obviously fail, appeal to students being right simply for being students, treat the majority vote as the end of the matter, or defer to expert judgment alone, and I do need to concede that if the evidence goes against us, we should accept it. About five minutes, written to be spoken aloud.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Speaker:** High school junior.
      *   **Audience:** School board (3 want quick vote, 2 teachers know Dewey, hundreds of students who might tune out academic jargon).
      *   **Topic:** Opposing a permanent, rigid phone ban policy (lock in pouches all day, no review).
      *   **Philosophical Framework:** John Dewey (Pragmatism/Democratic Education). Key concepts: Policy as hypothesis, ends-in-view (revisable goals), democratic participation (those affected must participate in inquiry).
      *   **Concrete Proposal:** Adopt as a single-semester experiment with fixed success criteria, continuation decided by a joint panel (students, teachers, board).
      *   **Constraints:**
          *   5 minutes spoken (approx. 750-900 words).
          *   Cannot claim policy will obviously fail (must be open to evidence).
          *   Cannot appeal to student rights simply because they are students.
          *   Cannot treat majority vote as the end of the matter.
          *   Cannot defer to expert judgment alone.
          *   Must concede: If evidence goes against us, we accept it.
          *   Tone: Persuasive, accessible (avoid heavy jargon for students), respectful but firm on principles.
      *   **Goal:** Convince the board to change the policy from permanent/rigid to experimental/collaborative.

  2.  **Deconstruct the Deweyan Argument for this Context:**
      *   *Policy as Hypothesis:* We don't know for sure if this works. Treating it as fact is unscientific.
      *   *Ends-in-View:* The goal (better learning) isn't fixed; it might need adjustment based on results.
      *   *Democratic Inquiry:* Those living the consequences (students) must help judge the results. It's not just about voting; it's about shared inquiry.
      *   *The Proposal:* A pilot program with a review committee.

  3.  **Drafting - Section by Section:**

      *   **Introduction (0:00-0:45):** Hook the audience. Acknowledge the tension. State the purpose clearly without getting bogged down in philosophy immediately. Establish credibility as a student who cares about learning, not just phone access.
      *   **The Problem with Permanence (0:45-2:00):** Address the "no review" aspect. Use the Deweyan concept of "hypothesis" without necessarily saying "Deweyan hypothesis." Frame it as common sense + scientific method. If we lock this in forever, we stop learning.
      *   **The Democratic Element (2:00-3:15):** Address the "who decides" aspect. Students feel the consequences. If they aren't part of the judgment, it's not democratic, it's just authoritarian. Connect this to the teachers who know Dewey (nod to them) without alienating the students.
      *   **The Concrete Proposal (3:15-4:00):** Lay out the plan: One semester. Fixed criteria. Joint panel. This is the actionable takeaway.
      *   **The Concession & Closing (4:00-5:00):** Acknowledge the risk. If it works, great. If not, we change. This shows maturity. End with a call to genuine inquiry.

  4.  **Refining the Tone:**
      *   *Avoid:* "John Dewey said..." (too academic for students/board). Instead, use the ideas: "learning by doing," "testing ideas," "shared responsibility."
      *   *Include:* Respect for the board's intent (distraction is real).
      *   *Include:* The concession (if data says ban works, we keep it).
      *   *Include:* The constraint about not claiming obvious failure.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi, I'm a junior. You want to ban phones. I get why. But making it permanent without checking is bad science.
      *   Dewey says schools are labs. This policy is a guess. Treat it like one.
      *   Students live with this. We need to help judge if it works.
      *   Proposal: Try it for one semester. Measure success. Students, teachers, board decide together if it continues.
      *   If it works, I'll lock my phone. If not, we change. Please don't stop learning before you start.

  6.  **Drafting - Iteration 2 (Fleshing out for time and rhetoric):**
      *   Need to make sure the Deweyan concepts are clear but accessible. "Ends-in-view" -> "Goals we can adjust." "Hypothesis" -> "Best guess."
      *   Need to address the 3 board members who want to finish quickly. Acknowledge their desire for resolution but reframe it as "false resolution."
      *   Need to address the students. Keep it engaging. "This isn't about me wanting to text."
      *   Word count check: 5 minutes is roughly 750 words at a moderate pace. I need to ensure it's not too short or too long.

  7.  **Writing the Speech (incorporating constraints):**
      *   *Opening:* Good evening. I'm not here to demand my phone back. I'm here to talk about how we learn.
      *   *Core Argument:* A policy without a review date isn't a policy; it's a decree. Real learning requires testing.
      *   *Deweyan nuance:* The board members who know Dewey will catch the references to inquiry. The students will hear "fairness" and "evidence."
      *   *Proposal:* One semester. Specific metrics (grades, engagement, well-being). Joint committee.
      *   *Concession:* If the data says the pouches work, I will support them. But we need the data.
      *   *Closing:* Don't close the book before reading the first chapter.

  8.  **Review against Constraints:**
      *   5 minutes? (Yes, if paced well).
      *   Concrete proposal included? (Yes, semester experiment + joint panel).
      *   Deweyan framework? (Yes, hypothesis, ends-in-view, democratic participation).
      *   No claim of obvious failure? (Yes, acknowledged it might work).
      *   No appeal to student rights alone? (Yes, focused on inquiry process).
      *   Concession included? (Yes, if evidence supports ban, accept it).
      *   Audience appropriate? (Yes, balancing academic rigor with accessible language).

  9.  **Final Polish:** Check rhythm and flow. Ensure the transition from philosophy to proposal is smooth. Make sure the "joint panel" part sounds serious, not like a student council stunt. Emphasize that *this structure* is what makes it democratic, not just voting.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm lecturing the board on philosophy. I need to sound like a student applying logic they respect. I will use the word "experiment" heavily. I will explicitly mention the "joint panel" as the mechanism for democratic inquiry.

