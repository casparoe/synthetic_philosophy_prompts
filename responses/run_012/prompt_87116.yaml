  ### The Case: The Embryo Offset

  A couple undergoing IVF has two viable embryos. Embryo A carries a gene for congenital deafness—a condition that is manageable, compatible with a flourishing life, and not painful, but nonetheless constitutes a sensory impairment relative to typical hearing. Embryo B carries no such gene and would develop into a hearing child with a somewhat higher expected welfare profile. Selecting Embryo B requires an additional, expensive genetic screening procedure and a six-month delay in transfer, imposing a significant financial burden and emotional toll on the parents that they are not unreasonable to refuse. Selecting Embryo A involves standard procedure with no extra cost or delay. The parents choose Embryo A solely to avoid the cost and delay. Child A is born deaf; Child B is never conceived. No third parties are affected, and no existing person's interests are set back by the choice of A.

  ### The Three Verdicts

  **(a) Impersonal Total-Welfare Axiology: Permissible**
  *   **The Mechanism:** This view sums the welfare of all affected individuals. While Child B would have had higher welfare than Child A, the parents' welfare is significantly higher in the A-scenario (due to saved resources and reduced stress). When the parents' gain is added to the child's welfare, the *total* welfare in Outcome A is roughly equivalent to (or not significantly less than) Outcome B. Since the outcome is not suboptimal in terms of total aggregate welfare, the axiology does not forbid it.

  **(b) Person-Affecting Restriction: Permissible**
  *   **The Mechanism:** This view holds that an act is wrong only if it makes some particular person worse off than they would otherwise have been. Child A exists only because the parents chose Option A. In the alternative scenario (Option B), Child A would not exist at all; Child B would exist instead. Since Child A's life is worth living, Child A is not worse off than they would have been (non-existence). Because no existing or future person is made worse off by the choice, the restriction yields no verdict of wrongness.

  **(c) Non-Comparative Wronging: Wrong**
  *   **The Mechanism:** This view distinguishes between *harming* (making worse off) and *wronging* (violating a right or duty owed to the person). It holds that parents owe their future children a duty to provide the best possible natural start, or at least to avoid imposing preventable impairments. By deliberately selecting the embryo with the impairment when the unimpaired alternative was available, the parents violate a duty owed *to Child A*. This violation constitutes a wronging, regardless of whether Child A is comparatively worse off than they would have been.

  ### Load-Bearing Feature & Removal Test

  **Load-Bearing Feature:** The **Non-Identity Condition** (that Option A and Option B result in *different* children).

  **The Removal Test:** Change the case so that the *same* child is affected in both options (e.g., a prenatal treatment given at week 10 determines whether the *same* fetus is born deaf or hearing).
  *   **Verdict Flip:** The **Person-Affecting Restriction (b)** flips from Permissible to **Wrong**. In this same-person case, choosing A makes *that specific child* worse off than they would have been had B been chosen.
  *   **Verdicts Held:** Total-Welfare (a) remains Permissible (assuming the parental cost offset remains), and Non-Comparative Wronging (c) remains Wrong (the duty to the child is still violated).
  *   **Analysis:** This confirms that the Person-Affecting verdict relies entirely on the non-identity condition, while the other two views track the condition itself or the totals.

  ### Strongest Person-Affecting Objection

  **The Objection:** "You have smuggled an impersonal premise into your intuition. If Child A is not worse off, there is no *victim* to whom the wrong is done. To claim it is 'wrong' without a victim is to assert a brute moral fact that lacks explanatory power. You are essentially relying on the intuition that the *state of affairs* is worse (which is Total Welfare), but disguising it as a duty to the child. If you deny the child is harmed, you must explain what 'wronging' means metaphysically without collapsing back into impersonal badness."

  **The Cost to Answer:** To answer this, you must commit to a robust theory of **rights independent of welfare** (e.g., a right to a specific genetic endowment). This requires defending the existence of moral claims that do not track the subject's well-being, which is metaphysically costly and vulnerable to the charge of "fetishizing" biology over actual lived experience.

  ### The Concession

  **Concede this:** You should concede that the **Non-Comparative Wronging view struggles to specify the limit of the duty.** If parents wrong a child by selecting for deafness, do they also wrong a child by selecting for average intelligence instead of genius? If the duty is to avoid *impairment*, the line between "impairment" and "suboptimal trait" is vague. Admitting this vagueness upfront prevents you from being pinned on a slippery slope argument during the discussion.
