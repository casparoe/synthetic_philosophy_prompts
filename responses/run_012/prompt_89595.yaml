answer: |-
  Here is an argument constructed to support your thesis, followed by the strongest single objection to that argument.

  ### The Argument: The Level-Relativity of Cranehood and the Dissolution of Greedy Reductionism

  Daniel Dennett's distinction between cranes and skyhooks is intended to serve as a normative tool for naturalistic explanation. A **crane** is a mechanism that lifts complexity, built upon prior substrates and justified by a history of selection or physical law. A **skyhook** is a posit that lowers complexity from above without a supporting structure—an unearned explainer, often implying design or miracle. Dennett deploys this distinction to police the boundaries of "greedy reductionism," which he defines as the vice of dissolving a phenomenon into parts so aggressively that the phenomenon itself (the *explanandum*) disappears or remains unaccounted for.

  However, this apparatus fails to do the demarcating work asked of it because **cranehood is not an intrinsic property of a mechanism, but a relational property relative to a level of description.** Consequently, "greedy reductionism" names no distinct explanatory vice; it merely names a reduction that skips a level of description privileged by the critic.

  Consider the origin of life. For evolutionary theory, the first self-replicator is the *sine qua non*. It is the threshold condition for natural selection. Within the explanatory framework of Darwinism, the arrival of the first replicator functions as a **skyhook**. It is the point where the algorithm begins; it is not itself a product of the algorithm. If a biologist posits the first replicator to explain biodiversity without explaining the replicator's origin, they are, by Dennett's own lights within the biological domain, hanging a crane from a skyhook.

  Yet, shift the level of description to prebiotic chemistry. That same self-replicator is a **crane**. It is the product of chemical affinities, thermodynamic gradients, and catalytic cycles. It is "earned" by the laws of physics and chemistry.

  If the status of the *very same entity* flips from skyhook to crane solely based on whether the observer is employing biological or chemical vocabulary, then the distinction is not ontological or methodological; it is pragmatic and disciplinary.

  This relativity dismantles the charge of greedy reductionism. To accuse a reductionist of being "greedy" is to claim they are treating a crane as a skyhook (dissolving a mechanism without accounting for its construction). But if what counts as a constructed mechanism (crane) versus a brute posit (skyhook) depends on where one draws the boundary of the relevant theory, then the charge of greed is merely a complaint about **explanatory scope**.

  When a neuroreductionist explains belief in terms of synaptic weights, the psychologist cries "greedy reductionism!" claiming the *meaning* of the belief is lost. But the neuroreductionist replies that synaptic weights are cranes built from physics. The psychologist treats the cognitive level as the "ground" from which cranes must hang; the reductionist treats the physical level as the ground. Since there is no "view from nowhere" to determine which level is the true ground, there is no fact of the matter regarding which explanation is "greedy."

  Therefore, Dennett's distinction collapses into a tautology: *A good explanation is one that provides cranes relative to the level you prefer.* If cranehood is level-relative, then "greedy reductionism" is not a vice of explanation, but a label for inter-theoretic conflict. It cannot police the boundary between naturalism and mysticism, because a skyhook at level $N$ is always a crane at level $N-1$. The distinction buys no philosophical leverage; it merely obscures the pragmatic choices involved in theory individuation.

  ***

  ### The Strongest Single Objection

  **The Objection from Causal Continuity (Naturalism vs. Miracle):**

  The strongest objection to your argument is that it conflates **explanatory primitives within a theory** with **metaphysical skyhooks**.

  Your argument rests on the claim that the first replicator is a skyhook for evolutionary theory because it is unexplained *by selection*. However, Dennett's distinction is not about what is unexplained *within a specific model*, but about what is explainable *within the causal order of nature*.

  A **skyhook**, for Dennett, is not merely an unexplained starting point; it is an appeal to a cause that stands *outside* the chain of physical causation (e.g., Intelligent Design, Vitalism, or Cartesian dualism). A **crane** is any mechanism that operates via continuous physical causation, regardless of whether we currently understand the lower-level details.

  The objection runs as follows: The fact that the first replicator is a "brute fact" for evolutionary biology does not make it a skyhook in Dennett's sense, because it is still causally continuous with prior chemical states. It is a "temporary skyhook" only due to epistemic limitation, not ontological discontinuity. Dennett's distinction is designed to police **Naturalism**, not **Intertheoretic Reduction**.

  Therefore, cranehood is *not* relative to a level of description; it is relative to **causal history**. If a phenomenon can, in principle, be traced back through a chain of physical causes, it is a crane. If it requires positing a cause that suspends or bypasses physical law (a miracle), it is a skyhook.

  This saves the charge of greedy reductionism. Greedy reductionism occurs when one claims to have provided a causal history (a crane) but has actually skipped a necessary causal node, thereby treating a complex causal process as a simple brute fact *without justification*. It is not "greedy" to reduce psychology to neuroscience if the causal link is secure. It *is* greedy to reduce psychology to physics if you skip the computational level where the causal efficacy of the representation actually resides, thereby failing to explain *how* the physical substrate realizes the function.

  In short, your argument fails because it treats the crane/skyhook distinction as epistemic (about what we know in a theory) rather than ontological (about how the world hangs together). Dennett's point is that there are no ontological skyhooks. If you acknowledge that, the relativity of description vanishes: everything is a crane all the way down. The "vice" of greedy reductionism is not skipping a level of description per se, but claiming explanatory sufficiency while ignoring the **causal mechanisms** that bridge the levels. If you cannot specify the crane that bridges the gap, you are implicitly relying on a skyhook, regardless of your disciplinary perspective.
