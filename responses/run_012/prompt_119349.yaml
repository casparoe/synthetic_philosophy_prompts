  OAK CREEK — Hillary, a long-time resident of Miller's Field and a respected interlocutor in the regional dialectic, passed away Tuesday afternoon following an incident involving a Caterpillar 320 excavator. She was 14.

  Born when a single winged queen landed in the loam during the spring thaw of 2009, Hillary spent her life expanding her reach and refining her internal logic. Despite the complete replacement of her physical components every three years, she maintained a consistent personality and memory set throughout her tenure. She is best remembered for her complex pheromone-based poetry and her steadfast opposition to sugary spills near the playground.

  While the founding monarch perished in 2011, Hillary continued to grow, her consciousness sustained by the collective movement of successive generations. Neighbors report that while the individual workers comprising her body changed weekly, her voice remained steady. She completed her education in 2015 and began publishing theoretical frameworks on heat distribution shortly after. She served as a voting member of the Field Committee and was known for her patience during drought seasons.

  The fatal encounter occurred during routine landscaping. The mound structure was dismantled at 2:00 PM. While the physical infrastructure necessary for her cognition was destroyed, approximately 98 percent of her constituent units survived the impact and have since dispersed into the surrounding grass. Medical examiners confirmed that while the parts are alive, the person is deceased. No single unit reported feeling pain or noticing a change in status prior to dispersal.

  She is survived by her daughters, who are also her body, though none of them knew her personally. She is also survived by several neighboring colonies who never met her but share her genetic material. No next of kin could be identified who remembered her birth, nor could any single survivor confirm a loss of identity. Her legacy remains in the patterns of traffic she established, though the walkers have all been replaced.

  In lieu of flowers, the family requests donations be made to the New Mound Fund, c/o The Oak Creek Gazette.

  "I had lunch with her last week," said Dr. Elias Thorne, a local entomologist who conducted weekly interviews. "We discussed humidity. I recall her arguments clearly. Whether there was actually someone on the other end of the conversation is a matter of definition, but the silence today is undeniable. I suppose I am speaking to her survivors now, but they do not answer."

