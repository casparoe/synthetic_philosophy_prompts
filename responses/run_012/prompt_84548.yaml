answer: |-
  **Setting:** *The town hall conference room. A draft script lies spread on the table between ELIAS (retired history professor) and SARAH (committee chair). Coffee cups are cold.*

  **ELIAS:** It's a procession. That's all this is. A parade of inevitability. Settlers arrive, mills spin, fire burns, bricks lay, hospital opens, college opens, curtain falls. It implies the 1724 settler looked at a swamp and saw a college campus.

  **SARAH:** It implies resilience, Elias. People want to know how we got *here*. Not how we got to a theoretical alternative universe where the mill burned down and stayed down.

  **ELIAS:** That is the Whig interpretation. You're treating the past as a pregnant precursor to the present. You're not honoring the dead; you're using them as props in a play about how great the 2024 committee feels.

  **SARAH:** And you're treating history like a crime scene where everyone is a suspect until proven innocent. Herbert Butterfield. I looked him up. 1931. He was writing about diplomatic archives and the rise of liberty in Europe. He wasn't writing about a tricentennial brochure for a town that nearly went bankrupt in 1978.

  **ELIAS:** The scale doesn't change the error. Butterfield's point wasn't about Europe. It was about the sin of abridgment. When you write history backward, starting from today and selecting only the events that lead to us, you murder the contingency. The fire didn't happen so we could rebuild a better hospital. It happened because a drunk dropped a lantern. The college didn't open because it was destiny. It opened because a wealthy widow had a grudge against the neighboring town's school.

  **SARAH:** So what? Do we put that on the plaque? "The Hospital: Built on Drunkenness and Spite"? You're confusing judging the past by our standards with explaining the past by its outcomes. I'm not asking you to moralize. I'm asking you to make it coherent.

  **ELIAS:** Coherence isn't the same as a straight line. You're conflating two different sins. One is presentism—condemning the settlers for not liking diversity. I don't care about that. The other is teleology—pretending the settlers were trying to build *us*. They weren't. They were trying to survive winter. By smoothing that out, you're telling the public that history is a machine, not a mess.

  **SARAH:** History is a story, Elias. And stories have endings. If I tell a story without an ending, it's not history, it's anxiety. You say "it's a mess," I say "it's a community." You want to highlight the forks in the road? Fine. But the car went down this road. That's the exhibit.

  **ELIAS:** But you're pretending the other roads didn't exist. That's the dodge. And don't hide behind "every history is told from somewhere."

  **SARAH:** It's not a dodge. It's the truth. Where else would we tell it from? The void?

  **ELIAS:** Admitting you have a perspective isn't a license to let that perspective dictate the causality. Saying "I am standing here" is honest. Saying "Everything was built so I could stand here" is arrogance. You're using the "somewhere" defense to excuse a narrative that validates the current power structure. The mill owners *did* rebuild. The poor *did* move away. Your script calls that "progress." I call it a specific set of winners writing the check.

  **SARAH:** And if we highlight the losers, the ones who didn't make it, the town that *didn't* happen... who is that for? You? The academics? This exhibit is for the kid whose family has been here six generations and wants to feel like they belong to something continuous. Butterfield doesn't pay the electric bill for the community center.

  **ELIAS:** Belonging based on a myth isn't belonging. It's nostalgia. If the only way this town feels real is by pretending the last three hundred years were a march of progress, then the town isn't secure enough to handle its own biography.

  **SARAH:** Security isn't the point. Continuity is. You want to fracture the timeline to satisfy your methodological purity. I want to stitch it together so people recognize themselves in it. You say "Whig history" like it's a slur. I say it's the only way a town knows it's still a town.

  **ELIAS:** Then it's a club, not a history.

  **SARAH:** And if it's a club, at least people know how to get in. Your version? It's a lecture hall where everyone's failing the midterm.

  **ELIAS:** Better to fail the midterm than live in a fairy tale.

  **SARAH:** *(Gathers the papers)*: We're not running a fairy tale. We're running an anniversary. I'm keeping the script. I'll add a footnote about the drunk with the lantern.

  **ELIAS:** A footnote doesn't fix the architecture.

  **SARAH:** It fixes the exhibit. Thanks for the consult, Elias.

  **ELIAS:** *(Watching her pack up)*: You're not writing history, Sarah. You're writing a eulogy for everything that didn't survive.

  **SARAH:** *(Stops, doesn't turn around)*: Someone has to.
