prompt: |-
  I serve on the charter-review commission of a mid-sized city that has, over the past several years, moved much of its budgeting onto a scheme usually called futarchy, and I need a written analysis for the commission of what the scheme presupposes.

  The arrangement is as follows. The council first adopts, by ordinary vote, a single measurable objective for the coming term; last cycle it was a composite index combining median household income, life expectancy, and an air-quality measure. Once that objective is fixed, the council does not vote on which policy package to adopt. Two conditional prediction markets are opened for each pair of competing packages — one asking what the index would be if package A were implemented, the other asking what it would be under package B. Traders buy and sell, and the package whose market implies the higher index is adopted automatically. The council's own preferences are meant to be irrelevant at that stage; its only task is to set the index.

  What puzzles me is a pattern in how the scheme is actually used. Twice the commission has declined to route a decision through the markets even though the same logic would seem to apply. The first was a proposal to site a waste-transfer station: the markets were never opened, and the minutes record only that the affected neighborhood had not consented. The second was whether to widen the index itself to include a measure of how the city's poorest residents were faring; the council decided that one directly, reasoning that the people the markets would be betting about should not themselves be the object of a wager.

  So on one hand the city treats the question of what to do as equivalent to the question of what will happen, given a fixed yardstick; on the other hand it treats certain decisions as exempt from that reduction. Please reconstruct, for the commission, the theory this practice presupposes. What view of value, or of the relation between facts and values, does the market mechanism commit the city to — must the good be a single measurable quantity, or can the scheme run on weaker assumptions? What does it assume about the traders' bets — what view of belief, and of how dispersed private opinions can constitute collective knowledge? And does the pattern of exemptions commit the city to something the mechanism itself cannot state, for instance that some goods are not commensurable with the index, or that consent functions as a side-constraint rather than as one more value to be maximized?

  Be explicit about what is strictly presupposed versus what the scheme merely happens to fit, and say where it is genuinely underdetermined, so that several rival theories would license the same procedure. Finally, suppose the presupposed view were replaced by a rival one; say concretely what would then have to change in the city's procedure. I am less interested in whether futarchy is a good idea than in what this particular use of it is already assuming.
reasoning: |-
  Here's a thinking process that leads to the analysis:

  1.  **Deconstruct the Request:**
      *   **Role:** Analyst for a Charter-Review Commission.
      *   **Context:** A mid-sized city using a specific form of *futarchy* (governance by prediction markets).
      *   **Mechanism:** Council sets a metric (e.g., composite index). Markets predict metric outcome for Policy A vs. Policy B. Higher predicted metric wins. Council preferences irrelevant after metric setting.
      *   **The Puzzle:** Two exemptions occurred.
          1.  Waste-transfer station sited based on neighborhood consent, *not* markets.
          2.  Index expansion (poverty measure) decided directly, not by markets (reasoning: people shouldn't be wagered on).
      *   **Task:** Reconstruct the *theory* presupposed by this specific practice (mechanism + exemptions).
      *   **Key Questions to Answer:**
          *   View of value (monistic vs. pluralistic)?
          *   Relation between facts and values (is "what to do" = "what will happen")?
          *   View of belief/knowledge (aggregation of private info)?
          *   Do exemptions imply side-constraints or incommensurability?
          *   Distinguish strict presuppositions from underdetermined aspects.
          *   Counterfactual: If the presupposed view changed, what procedure changes?
      *   **Tone:** Analytical, philosophical, precise, suitable for a commission. Not advocacy (good/bad), but exegesis (what is assumed).

  2.  **Analyze the Core Mechanism (Futarchy):**
      *   *Robin Hanson's Original Idea:* "Vote on values, bet on beliefs."
      *   *City's Implementation:* Council votes on the *metric* (Value). Markets vote on the *policy* (Belief about causal impact on Value).
      *   *Presupposition 1 (Value):* The "Good" must be representable as a scalar function (the Index). This implies commensurability of the components (income, life expectancy, air quality) into one number.
      *   *Presupposition 2 (Epistemology):* Prediction markets are superior to deliberative voting for causal inference. Prices = Probabilities/Expectations. The "Wisdom of Crowds" applies to policy outcomes.
      *   *Presupposition 3 (Fact/Value Distinction):* There is a clean separation. Values are chosen democratically/politically. Facts (causal links) are discovered via markets.

  3.  **Analyze the Exemptions (The Puzzle):**
      *   *Exemption 1 (Waste Station):* Vetoed/Decided by consent, not market.
          *   *Implication:* Rights/Consent trump Utility Maximization. This contradicts pure act-utilitarianism implied by the market mechanism. It suggests a deontological side-constraint.
          *   *Theory:* The market optimizes *within* a boundary of rights.
      *   *Exemption 2 (Index Composition):* Decided directly, not by market. Reason: "People... should not themselves be the object of a wager."
          *   *Implication:* The metric itself is sacred/political, not epistemic. You can't bet on *what we should value*, only on *how to achieve it*. Also, a moral hesitation about commodifying human welfare *as a bet*.
          *   *Theory:* The "Value" function is exogenous to the market. It is a normative anchor.

  4.  **Synthesize the Underlying Theory:**
      *   *Name:* Let's call it "Constrained Instrumentalism" or "Bounded Futarchy."
      *   *Value Theory:* Not strict monism. It's a hybrid. The Index is a *proxy* for the Good, but not the *totality* of the Good. Some goods (consent, dignity) are lexical priorities (side-constraints).
      *   *Epistemology:* Markets aggregate dispersed information about causal chains *only where uncertainty is empirical, not normative*.
      *   *Fact/Value:* The split is maintained, but the "Value" side has veto power over the "Fact/Instrumental" side.

  5.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the commission's role. State the purpose: excavating the normative and epistemic commitments of the current hybrid system.
      *   **I. The Core Mechanism (Standard Futarchy Commitments):**
          *   *Value Commensurability:* The Index assumes disparate goods (health, wealth, air) can be traded off against each other linearly.
          *   *Epistemic Superiority of Markets:* Beliefs are best aggregated via financial incentives, not deliberation.
          *   *Instrumentalism:* Policy is purely a tool to maximize the Index.
      *   **II. The Exemptions (The Deviations):**
          *   *The Waste Station (Consent):* This introduces *Deontology*. Consent is a constraint, not a variable. If it were a variable, it would be in the Index. Since it vetoes the market, it's a right.
          *   *The Index Definition (Dignity):* This protects the *Source of Value*. You don't bet on the Constitution. It implies the Index is a *political covenant*, not an empirical hypothesis.
      *   **III. Reconstructing the Presupposed Theory:**
          *   *Hybrid Normativity:* Maximization within constraints. (Satisficing rights, maximizing index).
          *   *Epistemic Humility regarding Values:* We know what we value (democratically), we don't know how to get there (markets). But we know some things are *wrong* regardless of outcome (the exemptions).
          *   *The "Fact/Value" Cut:* It's not clean. The exemptions show values bleed into the "factual" implementation phase.
      *   **IV. Underdetermination (Where the theory is vague):**
          *   *Why these exemptions?* Is it dignity? Is it political stability? Is it legal liability? The practice doesn't say *why* consent matters, only *that* it matters.
          *   *Scope of Markets:* When does a question become "normative" vs "empirical"? (e.g., is poverty normative or empirical?).
      *   **V. Counterfactual (Changing the View):**
          *   *Scenario A (Pure Utilitarianism):* Remove exemptions. Put consent in the Index. Bet on the Index definition.
          *   *Scenario B (Deliberative Democracy):* Remove markets. Vote on policies directly.
          *   *Scenario C (Libertarian/Rights-Based):* Expand exemptions. Markets only for minor budgeting.
      *   **Conclusion:** Summary of the "Constrained Instrumentalist" stance.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Make sure I don't just say "this is inconsistent." The prompt asks for the theory the *practice* presupposes. The practice *is* the theory. The exemptions *modify* the standard futarchy theory.
      *   *Focus:* The prompt asks about "what view of belief." Need to emphasize that traders are treated as *sensors*, not *stakeholders*.
      *   *Focus:* The prompt asks about "commensurability." The Index assumes commensurability, but the exemptions assume *incommensurability* (rights cannot be traded for index points). This is a crucial tension to highlight.
      *   *Tone Check:* Keep it formal, objective, and analytical. Avoid "I think." Use "The scheme presupposes..."

  7.  **Final Polish:** Check against specific prompt requirements.
      *   Explicit about strict presuppositions vs. underdetermined? Yes.
      *   Rival theories licensing same procedure? (e.g., Pragmatism vs. Rights Theory). Yes.
      *   Concrete changes if view replaced? Yes.
      *   Address the "people as wager" point? Yes.

  8.  *(Final thought before writing)*: The key insight is that the city is operating on a **Two-Tier Normative System**. Tier 1 (Constitutional/Rightful): Consent and Metric Definition (Decided by Council/Vote). Tier 2 (Legislative/Instrumental): Policy Selection (Decided by Markets). The theory is that Tier 2 cannot override Tier 1. Standard futarchy usually implies Tier 1 is fixed forever or very hard to change, but here Tier 1 is actively protecting itself from Tier 2.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Charter-Review Commission
  **FROM:** Policy Analysis Unit
  **SUBJECT:** Normative and Epistemic Presuppositions of the City's Hybrid Futarchy System
  **DATE:** October 26, 2023

  ### 1. Executive Summary

  The Commission has requested an analysis of the theoretical commitments underlying the City's current governance structure. While the mechanism is formally identified as futarchy ("vote on values, bet on beliefs"), the actual practice—specifically the two recorded exemptions regarding the waste-transfer station and the composition of the welfare index—deviates from pure futarchic theory.

  This analysis reconstructs the implicit theory of value, knowledge, and authority that renders the current system coherent. We conclude that the City operates not on pure instrumentalism, but on a **Constrained Instrumentalist** model. This model treats the prediction market as an optimization engine that operates strictly within deontological boundaries (rights/consent) and normative firewalls (the definition of the Good itself). The practice presupposes that while *means* are empirical questions suitable for market aggregation, *ends* and *rights* are normative questions suitable only for democratic deliberation.

  ### 2. The Core Mechanism: Standard Futarchic Commitments

  To understand the deviations, we must first establish what the standard mechanism presupposes. When the Council adopts an index and delegates policy selection to prediction markets, the scheme commits the City to three specific claims:

  **A. Value Commensurability (The Metric Assumption)**
  By reducing "city welfare" to a single composite index (income, life expectancy, air quality), the scheme presupposes that these goods are mutually fungible. It assumes there exists a stable trade-off rate between them (e.g., how much air quality degradation is "worth" a $1,000 increase in median income). The market does not debate these trade-offs; it accepts them as fixed conversion rates.
  *   **Strict Presupposition:** The Good is maximizable. There is a scalar quantity that represents the state of the city, and more of it is always preferable to less.

  **B. Epistemic Superiority of Markets (The Belief Assumption)**
  The scheme presupposes that the causal link between Policy A and the Index is an *empirical fact* rather than a *political judgment*. It assumes that dispersed private information (held by traders) regarding complex causal chains is aggregated more accurately by financial incentives than by council deliberation or expert testimony.
  *   **Strict Presupposition:** Policy outcomes are predictable enough to be priced, and traders are motivated to reveal truth rather than manipulate outcomes (assuming liquidity and lack of corruption).

  **C. The Fact/Value Separation**
  The mechanism relies on a clean distinction between *what we want* (the Index, set by Council) and *how to get it* (the Policy, set by Markets). It presupposes that these two questions can be decoupled without remainder.

  ### 3. The Exemptions: Reconstructing the Implicit Theory

  The two exemptions you cited reveal that the City does not actually hold to the strict presuppositions above. Instead, the practice reveals a more complex normative architecture.

  **A. The Waste-Transfer Station (The Consent Constraint)**
  *   **The Event:** The market was bypassed because the affected neighborhood did not consent.
  *   **The Theoretical Commitment:** This establishes **Consent as a Side-Constraint**, not a Value to be Maximized.
      *   If consent were merely a value, it would be included in the Index. If the market predicted that the station would raise the Index enough to offset the neighborhood's displeasure, a pure futarchy would build the station.
      *   By vetoing the market, the City asserts that certain rights function as *lexical priorities*. They trump utility maximization.
      *   **Presupposition:** The market is legitimate only within a framework of rights. The "efficiency" of the market cannot legitimize a violation of procedural justice (consent).

  **B. The Index Composition (The Dignity Constraint)**
  *   **The Event:** The Council refused to let markets decide whether to include a poverty measure, reasoning that people should not be the "object of a wager."
  *   **The Theoretical Commitment:** This establishes the **Normative Anchor as Sacred**.
      *   This exemption protects the *source* of value from the *instrument* of value. It presupposes that defining who counts and what counts as welfare is a constitutive political act, not an empirical hypothesis.
      *   The reasoning ("not an object of a wager") suggests a view of human dignity that is incompatible with commodification. Even if a market could accurately predict how a policy affects the poor, *betting* on that prediction is viewed as morally corrosive to the civic relationship.
      *   **Presupposition:** There is a category of "Constitutional Values" that are immune to cost-benefit analysis, even when that analysis is conducted via prediction markets.

  ### 4. Synthesis: The Theory of "Constrained Instrumentalism"

  Combining the mechanism with the exemptions, the City's practice presupposes the following theory:

  1.  **Hybrid Normativity:** The City is not a pure utilitarian entity. It is a rights-bearing community that uses utilitarian tools *only* where rights are not at stake. The Good is not a single measurable quantity; rather, there is a *measurable quantity* (the Index) that is pursued *subject to* *unmeasurable constraints* (Rights/Dignity).
  2.  **Epistemic Division of Labor:**
      *   **Council (Deliberation):** Best suited for normative questions (What is the Index? Who has rights?).
      *   **Markets (Aggregation):** Best suited for complex empirical questions (Which policy moves the Index?).
      *   **Presupposition:** Normative truth is discovered through democracy/consensus; Empirical truth is discovered through market pricing.
  3.  **The Status of Traders:** Traders are viewed as *sensors*, not *stakeholders*. Their profit motive is a tool to extract information, but they are not granted moral authority to define the public good. This explains why they can decide policy but not index composition.

  ### 5. Underdetermination: Where the Theory is Vague

  While the above reconstruction makes the practice coherent, several aspects remain underdetermined. Rival theories could license the exact same procedure:

  **A. Pragmatism vs. Deontology**
  *   *Theory 1 (Deontological):* Rights are inherent. Consent is a moral absolute.
  *   *Theory 2 (Rule-Utilitarian/Pragmatic):* Respecting consent and keeping the Index sacred *actually produces better long-term stability* than strict futarchy.
  *   *Indeterminacy:* The minutes do not specify *why* consent trumps the market. Is it because it is *wrong* to violate consent, or because violating consent causes civil unrest that the Index doesn't capture? The procedure works either way, but the justification matters for future edge cases.

  **B. The Boundary of "Wagering"**
  *   The exemption regarding the poverty measure cites the immorality of "wagering" on people. However, the Index *already* wagers on people's lives (life expectancy) and livelihoods (income).
  *   *Indeterminacy:* What distinguishes "air quality" (bettable) from "poverty" (non-bettable)? The theory does not specify the threshold of commodification. Is it that poverty is more personal? More political? This leaves the City vulnerable to inconsistency if a future Council tries to move healthcare access to the market.

  **C. The Nature of Belief**
  *   The scheme assumes traders hold "beliefs" about causal outcomes. However, in financial markets, prices often reflect risk appetite and liquidity, not just raw probability.
  *   *Indeterminacy:* Does the City presuppose that traders are risk-neutral? If traders are risk-averse regarding certain policies (e.g., fearing regulation), the market price may not reflect the true expected value of the Index. The procedure assumes market price = expected value, but this is an economic simplification.

  ### 6. Counterfactual: Implications of Replacing the Presupposed View

  If the Commission wishes to alter the underlying theory, specific procedural changes would be required to maintain coherence.

  **Scenario A: Shift to Pure Futarchy (Strict Instrumentalism)**
  *   *Theoretical Change:* Adopt the view that *all* values are commensurable and no side-constraints exist. Consent is just another variable in the Index.
  *   *Procedural Changes:*
      1.  **Abolish Exemptions:** The waste-transfer station must be sited by the market. If the market predicts the Index rises despite neighborhood objection, the station is built.
      2.  **Marketize the Index:** Open a market on *which Index definition* yields the highest social stability. Let traders bet on whether including poverty measures is "good."
      3.  **Remove Council Veto:** The Council loses the power to intervene once the metric is set.

  **Scenario B: Shift to Deliberative Democracy (Participatory Theory)**
  *   *Theoretical Change:* Adopt the view that policy choices are inherently normative, not empirical. Values and facts cannot be separated; choosing a policy *is* choosing a value.
  *   *Procedural Changes:*
      1.  **Close the Markets:** Policy selection returns to Council vote or citizen assembly.
      2.  **Expand Exemptions:** If markets are distrusted for policy, they are certainly distrusted for budgeting. All allocation returns to line-item voting.
      3.  **Justification Requirement:** Decisions must be accompanied by public reasoning, not just price signals.

  **Scenario C: Shift to Libertarian/Property Rights Theory**
  *   *Theoretical Change:* Adopt the view that the "Consent" exemption is the *primary* function of government, and the Index is secondary.
  *   *Procedural Changes:*
      1.  **Invert the Hierarchy:** The market only decides policies where *unanimous* or *property-owner* consent is already established.
      2.  **Shrink the Index:** The Index becomes a secondary monitoring tool, not a decision driver.
      3.  **Veto Power:** Affected neighborhoods are given formal veto tokens, institutionalizing the waste-station exemption into a general rule.

  ### 7. Conclusion

  The City's current practice presupposes a **Dualist Theory of Governance**. It posits a realm of *Right* (protected by Council veto and consent requirements) and a realm of *Good* (optimized by prediction markets).

  This is theoretically stable only so long as the boundary between the two remains clear. The tension lies in the fact that almost any policy decision can be reframed as a rights issue (exempting it from markets) or an efficiency issue (submitting it to markets). The Commission's task is not merely to review the charter text, but to codify the *criteria* for this distinction. Without a stated theory of why some goods are "wagerable" and others are not, the exemptions risk appearing arbitrary, undermining the legitimacy of the markets they protect.

  **Recommendation:** The Commission should consider explicitly amending the Charter to define the "Protected Class of Decisions" (e.g., rights, index composition, zoning consents) that are exempt from market adjudication. This would codify the implicit theory of Constrained Instrumentalism, providing a clear standard for future exemptions.
