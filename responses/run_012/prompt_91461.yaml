answer: |-
  **Antecedent Analytics | Support & Documentation**
  **Frequently Asked Questions: The Subjunctive Engine™**

  **1. What exactly is a Subjunctive Prediction?**
  Unlike traditional forecasting, which estimates probable outcomes based on past performance, a Subjunctive Prediction identifies true facts about what any specific agent *would* freely choose under any specific set of circumstances. We don't tell you what will happen; we tell you what *would* happen, were you to place the subject in a given scenario. These are known technically as Counterfactuals of Creaturely Freedom. They are true prior to any actual decision being made, offering you certainty without interfering with the subject's autonomy.

  **2. Is this just advanced behavioral profiling?**
  No. Profiling relies on statistical inference drawn from historical data (what an agent *has* done). The Subjunctive Engine accesses pre-volitional truth states (what an agent *would* do). While profiling guesses based on patterns, our model accesses the structural realities of the agent's will independent of their actual history. This distinguishes our "Middle Knowledge" tier from standard "Natural Knowledge" analytics. We aren't guessing; we are reading the truth values that exist independently of the agent's existence.

  **3. If you know what I'll choose, is my choice still free?**
  Absolutely. This is a common misconception. Knowledge of an event is not the cause of that event. When you watch a recording of a game, your knowledge doesn't force the players to move the way they did. Similarly, Antecedent Analytics observes the truth of your future free choices without causally determining them. The model's confidence is a result of its access to the truth, not the source of the truth. Your freedom remains intact because the prediction does not constrain you; it merely reflects what you will freely do.

  **4. What happens if I deliberately try to prove the model wrong?**
  This scenario is logically impossible within the parameters of a verified prediction. If the Engine states that in Scenario B you would freely choose Option X, and you subsequently choose Option Y, the initial report was not a valid Subjunctive Prediction. However, given the Engine's infallibility regarding true counterfactuals, you will find yourself freely choosing Option X. You cannot act against what is truly true about your own will. You remain free to choose X, and you will do so freely, even knowing the prediction.

  **5. When does this fact become true?**
  The truth value of a Counterfactual of Creaturely Freedom is eternal. It obtains prior to the agent's existence and prior to any divine or systemic decision to actualize a world where that agent exists. Think of it as a property inherent to the agent's identity profile. The truth was there before you were here, waiting to be accessed. We simply provide the interface that allows you to view these pre-existing conditions without needing to actualize the scenario yourself.

  **6. What makes the prediction true before I exist?**
  This is a profound ontological question that touches on the grounding of counterfactuals. Simply put, the truth is grounded in the agent's essence rather than their existence. While philosophical debate exists regarding what metaphysical structure supports these truths, Antecedent Analytics treats them as brute facts within our proprietary ontology. The model doesn't need to construct the truth; it merely locates it. You don't need to worry about what makes the truth true; you only need to trust that it is true. Our Service Level Agreement guarantees the accuracy of the truth value, regardless of its metaphysical substrate.
