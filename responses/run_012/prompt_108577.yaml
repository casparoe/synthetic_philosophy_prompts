answer: |-
  ### Exam Question

  **Question 5 (20 marks)**

  Consider the following experimental setup: Participants are briefly shown a word ('red' or 'green'), followed immediately by a colour patch that is perceptually ambiguous between red and green. Participants report the colour of the patch. Data shows the word reliably shifts the colour report (e.g., the word 'red' makes the patch look red). The Principal Investigator concludes that language cognitively penetrates perception.

  Write an essay addressing the following three points:

  1.  **The Modularity Constraint:** In the sense denied by Fodor and Pylyshyn, what specific condition must be met for this result to count as *cognitive penetration*? Distinguish between a change in perceptual experience and a change in post-perceptual judgment.
  2.  **Alternative Explanations:** Propose two distinct explanations for the result that do *not* involve cognitive penetration in the strong sense. For each, specify what further experimental evidence would distinguish it from the penetration hypothesis.
  3.  **Predictive Processing:** If the result holds up, does it necessarily vindicate the Predictive Processing (PP) framework's claim that cognition shapes perception? Explain why the existence of 'priors' in PP does not automatically entail cognitive penetration.

  ***

  ### Model Answer

  To evaluate the PI's claim, we must first define cognitive penetration precisely. In the Fodorean sense, the issue is not merely whether cognition influences behaviour, but whether it alters the *informational encapsulation* of early visual modules. For this result to establish penetration, the semantic content of the word ('red') must alter the *format* or *content* of the early perceptual representation itself. It is insufficient to show that the *report* changes; the *phenomenal experience* must change. If the patch looks identical but the participant guesses 'red' because they expect it, that is a post-perceptual decision bias, not penetration. Establishing penetration requires demonstrating that the visual system's computation of colour properties is causally dependent on conceptual states, rather than the concept merely selecting between already-computed perceptual options at the stage of judgment.

  Two alternative explanations can account for the data without invoking strong penetration. First, **Response Bias**. Participants may not see the patch differently but shift their decision criterion to align with the prime. They might assume the experimenter expects consistency between word and colour. To distinguish this from penetration, one should apply Signal Detection Theory. If penetration occurs, sensitivity ($d'$) should shift because the signal itself changes. If it is mere bias, only the criterion ($c$) shifts while sensitivity remains stable. Second, **Feature-Based Attention**. The word 'red' may prime the attentional system to weight red-wavelengths more heavily. This is a perceptual effect, but it is not *cognitive* penetration in the conceptual sense; it is a modulation of sensory gain by attentional settings, which Fodor might allow as input-system internal. To test this, one could impose a high attentional load task. If the priming effect disappears under load, it relies on attentional resources rather than automatic conceptual penetration of the visual module.

  Finally, does this vindicate Predictive Processing (PP)? Not necessarily. PP posits that perception is inference driven by priors, but this does not entail that *concepts* penetrate *early vision*. In PP hierarchies, prediction errors can be minimized at low levels using statistical regularities learned within the visual system itself, without top-down input from language or belief modules. A prior that 'red often follows the word red' could be a low-level statistical association encoded within the perceptual hierarchy, not a high-level conceptual belief influencing early processing. Therefore, even if PP is correct, the 'priors' involved might be encapsulated statistical expectations rather than cognitive states. Vindicating PP explains *how* expectations shape processing, but it does not settle the *modularity* debate regarding *which* systems provide those expectations. To claim penetration, one must show the priors are genuinely conceptual, not just intra-modular predictions.

  ***

  ### Marking Scheme (20 Marks Total)

  **Total:** 5 Criteria $\times$ 4 Marks each.
  **Grading Logic:** To get an **A (16-20)**, the student must make the specific "A-Grade Move" listed below. A **B (12-15)** student will hit the basic point but miss the nuance.

  | # | Criterion (4 marks each) | A-Grade Move (Distinction) | B-Grade Move (Competence) | Common Pitfall (How they blow it) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Defining Penetration (Modularity)** | Explicitly contrasts *early visual encoding* vs. *post-perceptual judgment/decision*. | States that perception must change, not just behaviour. | Treats "perception" and "report" as synonymous; ignores encapsulation. |
  | **2** | **Fodor/Pylyshyn Constraint** | Identifies *informational encapsulation* or the *conceptual nature* of the top-down influence as the key stake. | Mentions Fodor/modularity but focuses only on "top-down" generally. | Treats Fodor as denying *any* top-down influence rather than *conceptual* influence. |
  | **3** | **Alternative 1 (Bias)** | Identifies **Response Bias** AND specifies **Signal Detection Theory ($d'$ vs $c$)** as the test. | Identifies Response Bias but suggests vague "control questions" or "asking them." | Confuses response bias with memory failure; fails to name a specific test metric. |
  | **4** | **Alternative 2 (Attention)** | Identifies **Attention** AND distinguishes it as *perceptual but non-conceptual* (or uses **Attentional Load** as test). | Identifies Attention but treats it as identical to penetration or offers no specific test. | Claims attention *is* penetration (missing the modular nuance) or offers no way to disambiguate. |
  | **5** | **Predictive Processing Nuance** | Argues PP priors can be **intra-modular/statistical** and do not require **conceptual** top-down flow. | States PP supports penetration because "PP says expectations matter." | Assumes PP $\equiv$ Penetration; fails to see that priors can be encapsulated within vision. |

  **Note on Grading:** If a student nails all five "B-Grade Moves" but misses the "A-Grade Moves," cap the score at 15/20 (High B). To break 16, they must demonstrate the specific distinctions in rows 1, 2, and 5 especially.
