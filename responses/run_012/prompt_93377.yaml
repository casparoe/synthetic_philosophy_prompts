          *   Convergence says most pairings lead to incorrigibility.
          *   This isn't a contradiction, just a search problem.

  9.  **Final Review of the "Single Revision":**
      *   Which change fixes the most?
      *   Modifying (2) is the standard move in the literature (e.g., Soares/Christiano on corrigibility). It acknowledges that convergence is a property of *specific* cognitive architectures (goal-directed optimization), not intelligence *per se*.
