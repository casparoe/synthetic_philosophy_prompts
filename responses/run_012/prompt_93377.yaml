          1.  Executive Summary (Overall coherence).
          2.  Apparent Tensions (Easy dismissals).
          3.  Genuine Tensions (Ranked by severity).
          4.  Repairs & Costs.
          5.  The "Single Revision" recommendation.

      *   *Refining the (2) vs (5) analysis:*
          *   (2) says "For almost any terminal goal...".
