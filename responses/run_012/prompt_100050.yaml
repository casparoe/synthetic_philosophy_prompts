answer: |-
  Here are ten questions designed to corner the conventionalist position without giving her room to retreat into abstractions.

  **1. The Authority of the First Convention**
  You argue epistemic norms are conventions we adopt, and accuracy is valuable *because* of those norms, not vice versa. But every convention has a starting point. If the first epistemic community adopted these norms without a prior commitment to accuracy, what gave that initial decision its authority? Was it just power, or was there a reason?
  *Follow-up (if she says "pragmatic success"):* If the reason was pragmatic success, aren't you just smuggling accuracy back in under a different name?

  **2. The Circularity Charge**
  Accuracy-firsters beg the question by assuming we should care about accuracy; you avoid that by making accuracy a product of the norm. But doesn't your view just push the begging of the question back one step to "why should we care about *this* convention?"
  *Follow-up (if she says "we don't need a reason"):* So on your view, epistemology ultimately rests on a brute, unjustified social habit?

  **3. Structural vs. Substantive (The Coherence Trap)**
  If the norm comes first and isn't grounded in truth-tracking, does your view allow that a perfectly coherent agent with absurd priors (e.g., believing the moon is made of cheese) is epistemically blameless?
  *Follow-up (if she says "coherence is enough"):* Then why call it *epistemic* rationality rather than just logical consistency?

  **4. Ruling Out Bad Priors**
  Presumably you want to say that agent *is* doing something wrong. If accuracy isn't the metric, what substantive constraint does your convention place on priors to rule that out?
  *Follow-up (if she cites "community standards"):* So if a community standardly accepts cheese-moon priors, they're right and we're wrong?

  **5. The Forecasting Lab Case**
  Consider a forecasting lab that uses an improper scoring rule: they penalize 0.5 credences on chancy events to force decisiveness. On your view, is a member who reports 0.5 (their true credence) but gets penalized acting irrationally?
  *Follow-up (if she says "irrational for that context"):* So epistemic rationality can require you to lie about your evidence?

  **6. The Truth Connection**
  Following up on that lab: if their convention rewards decisiveness over calibration, are they still doing *epistemology*, or have they just started playing a different game entirely?
  *Follow-up (if she says "different game"):* Then at what point does a convention stop being epistemic and start being something else?

  **7. Self-Application (Universality)**
  Your book claims to tell us how credences *ought* to work. Is that claim itself a universal truth, or is it just a move within your own local philosophical convention?
  *Follow-up (if she says "local convention"):* Then why should I, operating under a different convention, listen to you?

  **8. Self-Application (Credence in the View)**
  If norms are local conventions, what credence does your own norm say you should have in your own theory? Can you claim it's *accurate*, or just *authorized*?
  *Follow-up (if she says "authorized"):* An authorized falsehood is still false; does your view survive if it's authorized but inaccurate?

  **9. Imprecise Credences**
  Accuracy-first programs struggle to define proper scoring rules for imprecise credences. Does your conventionalism make this easier, or does it just make the choice of scoring rule even more arbitrary?
  *Follow-up (if she says "more arbitrary"):* If it's arbitrary, how can it ground a normative claim about what we *should* believe?

  **10. The "So What?"**
  If the accuracy-firster and you both end up telling agents to conditionalize and avoid Dutch Books, but you disagree on the *why*, what practical difference does your reversal of explanation actually make?
  *Follow-up (if she says "explains the normativity"):* If it explains normativity by removing its objective ground, haven't you explained it away?
