answer: |-
  Here is a menu of interpretations for the slogan "taxation is theft," arranged from the trivial/semantic to the radical/metaphysical. Following the list, I have addressed your specific sorting questions (a–d) and provided a diagnosis of your cousin's position.

  ### The Menu of Interpretations

  #### 1. The Semantic Truism (The "Involuntary Transfer" Reading)
  *   **The Claim:** The word "theft" is being defined simply as "the involuntary transfer of property." Since taxes are paid under threat of penalty (involuntary), they fit this definition.
  *   **Type of Claim:** Semantic/Descriptive.
  *   **Property Presupposition:** It assumes you possess the money *before* the tax is taken. It does not ask *why* you possess it, only that it is being moved without your specific consent.
  *   **Truth/Defensibility:** **Defensible as a definition, but trivial.** It strips "theft" of its moral and legal weight. Under this definition, a bank foreclosing on a defaulted mortgage is also "theft," as is a court ordering child support. It describes the *mechanism* but ignores the *justification*.
  *   **Status:** This is the "boring" reading. It's technically consistent but doesn't do any argumentative work.

  #### 2. The Moral Analogy (The "Feels Like Robbery" Reading)
  *   **The Claim:** Taxation is not legally theft, but it is *morally equivalent* to theft. It violates the same ethical intuition that makes stealing a bike wrong (violation of autonomy and effort).
  *   **Type of Claim:** Substantive Moral Claim.
  *   **Property Presupposition:** Assumes that the moral right to property stems from labor or acquisition, not from state recognition. It suggests the state is an external agent imposing on a pre-existing moral sphere.
  *   **Truth/Defensibility:** **Debatable.** It relies on the intuition that "might makes right" is wrong. However, it struggles with the "free rider" problem: if you benefit from roads/defense funded by taxes, is it truly analogous to a mugger who gives you nothing?
  *   **Status:** This is a common rhetorical move. It invites debate about the *degree* of moral equivalence, not the definition.

  #### 3. The Lockean/Pre-Political Claim (The "My Labor is Mine" Reading)
  *   **The Claim:** Individuals have natural property rights that exist *before* governments are formed. Because you mixed your labor with the world to earn the money, it is 100% yours. The state has no prior claim to any portion of it.
  *   **Type of Claim:** Metaphysical/Moral Claim.
  *   **Property Presupposition:** Property rights are **pre-political**. They do not come from the government; the government is supposed to protect them. Therefore, the government cannot take what it did not create.
  *   **Truth/Defensibility:** **Philosophically robust but contested.** This is the core of classical liberalism. The counter-argument is that "labor" alone doesn't create value without a stable society (markets, laws, infrastructure) to recognize that value.
  *   **Status:** This is the most serious philosophical version of the slogan. It requires arguing about the origin of rights.

  #### 4. The Social Contract Rejection (The "I Didn't Sign" Reading)
  *   **The Claim:** Legitimate authority requires consent. Since no living citizen signed a contract agreeing to be taxed, the state is taking money without permission. "Tacit consent" (living here = agreeing) is a fiction.
  *   **Type of Claim:** Political Legitimacy Claim.
  *   **Property Presupposition:** Assumes property is yours by default, and the burden of proof is on the taker to show you agreed to give it up.
  *   **Truth/Defensibility:** **Strong on consent, weak on reciprocity.** It is true you didn't sign a contract. However, most obligations (parents to children, drivers to pedestrians) exist without explicit contracts. It ignores that you *choose* to earn income in a jurisdiction knowing the tax laws.
  *   **Status:** This shifts the debate from "property" to "consent."

  #### 5. The Institutional Illegitimacy (The "Protection Racket" Reading)
  *   **The Claim:** The state is not a legitimate service provider but a criminal gang. Taxation is not a fee for service; it is tribute paid to avoid violence (prison/seizure). Therefore, the *institution* of taxation is inherently criminal.
  *   **Type of Claim:** Radical Political/ontological Claim.
  *   **Property Presupposition:** Assumes the state has **zero** moral standing. It presupposes that property rights would exist and be enforceable even without the state (e.g., through private agencies).
  *   **Truth/Defensibility:** **Radical and high-risk.** This is the anarcho-capitalist reading. It is the hardest to defend because it requires explaining how property rights survive without a monopoly on force to enforce them.
  *   **Status:** This is the "conversation-ender" reading. If the state is a mafia, you don't negotiate with the mafia; you dismantle it.

  ***

  ### Sorting Out the Specifics (a–d)

  Here is how the specific logical problems you raised break down across these interpretations.

  **(a) Legal vs. Moral Category & The Circularity Trap**
  *   **Legal:** Legally, taxation is *not* theft. Theft is defined by law as the *unlawful* taking of property. Since tax law authorizes the taking, it is legally impossible for taxation to be theft. Your cousin cannot mean this unless he thinks tax laws are void.
  *   **Moral:** He almost certainly means moral theft.
  *   **Circularity:** You hit the nail on the head. If "theft" is defined morally as "an *unjust* taking," then "Taxation is theft" translates to "Taxation is an unjust taking." This assumes the conclusion (that taxation is unjust) rather than proving it. To avoid circularity, "theft" must have a definition independent of justice (e.g., "taking without consent"), and then he must prove why taxation fits that definition *and* why that definition makes it wrong.

  **(b) Particular Tax vs. The Institution**
  *   **Particular:** "This 5% luxury tax is theft." This is a policy argument. It allows for the possibility that *some* taxes (e.g., for national defense) might be legitimate.
  *   **Institutional:** "Taxation (as a concept) is theft." This is the libertarian slogan. It claims the *mechanism* of mandatory contribution is inherently wrong, regardless of what the money buys.
  *   **Implication:** If he means the Institution, he cannot be swayed by arguments about how the money is spent (libraries, loans). That is why he leans back and says the case is closed.

  **(c) Who is the Victim?**
  *   **The Individual:** The slogan presupposes the individual taxpayer is the victim.
  *   **The Collective:** The counter-argument is that the "victim" is ambiguous. If taxes fund a court system that protects your property, are you a victim?
  *   **The Catch:** For the slogan to work, the money must belong to the individual *before* the tax is levied. If the money is viewed as a shared resource that the individual is merely holding, the "victim" claim weakens.

  **(d) The Self-Undermining Problem (The "Property Convention" Objection)**
  *   **The Problem:** Property rights are not forces of nature; they are legal conventions enforced by the state. You don't "own" your bike because of physics; you own it because the state says so and will stop others from taking it.
  *   **The Contradiction:** If the state is the entity that defines and enforces "yours," it is logically difficult to claim the state is "stealing" from you. It is more like a club taking a due from a member.
  *   **Libertarian Counter:** Libertarians argue property rights are *natural* (Lockean) and the state merely *recognizes* them. If this is true, the slogan holds. If property rights are *created* by the state (Legal Positivism), the slogan collapses.

  ***

  ### Diagnosis: Your Cousin vs. The Argument

  **Which reading does your cousin likely mean?**
  He is likely operating on a hybrid of **#3 (Lockean/Pre-Political)** and **#5 (Institutional Illegitimacy)**.
  *   He believes you own your income fully before the state touches it (#3).
  *   He believes the state's claim to that money is inherently illegitimate, regardless of what it buys (#5).
  *   He uses the slogan as a **conversation-ender** because, in his view, you cannot negotiate on principle. If taxation is morally equivalent to theft, discussing *how much* to tax or *what to spend it on* is like discussing how much of your wallet a mugger should keep.

  **Which reading justifies treating it as a conversation-ender?**
  Only **Reading #5 (Institutional Illegitimacy)** justifies shutting down the conversation.
  *   If taxation is *inherently* criminal (like slavery or murder), then discussing the *benefits* of taxation (libraries, loans) is irrelevant. You don't argue that slavery is okay because slave owners built nice houses.
  *   **However,** Reading #5 is the **least defensible** position. It requires proving that property rights exist without the state and that the state provides no legitimate service that justifies the cost.

  **How to respond:**
  The slogan is a "conversation-ender" only if you accept the premise that the state has no legitimate claim to any resources. To reopen the conversation, you don't argue about libraries or loans. You argue about **property definition**.

  You can say: *"If 'theft' means 'unjust taking,' you're just saying 'taxation is unjust,' which is what we're arguing about. If you mean it's 'taking without consent,' then you have to explain why my ownership of this money exists independently of the legal system that enforces that ownership. If the state defines what 'yours' means, it can't steal it from you; it can only reassign it. So, are property rights natural, or are they legal?"*

  That forces him out of the slogan and into the actual philosophy (Reading #3 vs. The Legal Positivist view), which is where the real disagreement lies.
