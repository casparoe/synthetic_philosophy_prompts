      *   The key is **Offline Simulation.** A mind can run a model of the world that is detached from immediate action. An ant colony *is* its action in the world. It doesn't have a "sandbox." This distinguishes it from a brain (which can dream/plan without moving) and a thermostat (which has no model).
      *   *Wait, is that true?* Ants do plan in a sense. But the *colony* doesn't hold a representation separate from the pheromone trails. The trails *are* the representation, and they are in the world, not in the "head." This is **Extended Cognition** vs. **Internal Model.**
      *   *Decision:* The missing distinction is **Decoupled Representation.** The ability to represent the world in a way that is not immediately tied to acting on it. This solves the thermostat issue (no representation), the split issue (representation is substrate-independent), and the gradient issue (gradients are direct, not representational).

