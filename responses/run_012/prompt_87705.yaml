      *   Move 2 (Nadia): Clearly Right. (Standard neuroscience).
      *   Move 3 (Owen): Partially Right. (Integration is necessary, but is it sufficient?). Let's call it "Plausible."
      *   Move 4 (Nadia): Clearly Right. (Strong logical dilemma).
