      *   Need to be honest about *risk* (if Q1 fails, the category dissolves).

  9.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the constraints and the team's composition.
      *   **Section 1: The Dependency Map:** Visualize the logic before the list.
