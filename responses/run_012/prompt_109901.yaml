  11. **Final Polish:** Ensure the distinction between "Paradox" (logic) and "Boundary" (normative) is sharp. Ensure the "Relational" point doesn't just dissolve the category. (Key insight: Relationality explains *variation* in the boundary, not the *existence* of the zone beyond the maximum boundary).

      *(Self-Correction on Suspicion 3)*: If obligation is scalar, "supererogation" might just be "the very good optional stuff." The challenge is explaining why it has *special* normative force (e.g., immunity from criticism) if it's just a point on a scale. This needs to be highlighted as a major reconstruction task.

