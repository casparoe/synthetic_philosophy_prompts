answer: |-
  This agenda is designed for a three-person conceptual team (Logic, Virtue, Demandingness) with no empirical capacity. It prioritizes **logical priority** (what must be solved first) over **historical prominence** (what has been discussed most). The ranking assumes that if the foundational logic of the category is incoherent, no amount of case-study analysis will save it.

  ### 1. The Dependency Structure

  Before ranking the questions, we must map the logical dependencies. Most disagreements in the literature are not about the same question; they are about questions at different levels of abstraction.

  *   **Level 1: The Deontic Framework (The Container).**
      *   *Question:* Is the logic of obligation binary (Obligatory/Permissible/Forbidden) or scalar/threshold?
      *   *Dependency:* All other questions presuppose an answer here. If the framework is binary, the "Paradox of Supererogation" is a formal problem. If scalar, the category requires reconstruction.
  *   **Level 2: The Boundary Condition (The Line).**
      *   *Question:* What determines the limit of obligation? Is it invariant, or relational (agent-relative/role-relative)?
      *   *Dependency:* Depends on Level 1. You cannot draw the line until you know the geometry of the space.
  *   **Level 3: The Aretaic Correlates (The Markers).**
      *   *Question:* What is the relationship between supererogatory acts and praise, virtue, heroism, or saintliness?
      *   *Dependency:* Depends on Level 2. We identify the acts first, then analyze their moral status.
  *   **Level 4: Structural Symmetries & Edge Cases (The Details).**
      *   *Question:* Omissions, suberogation, desert, risk.
      *   *Dependency:* Depends on Level 3. These are applications of the established category.

  ---

  ### 2. Ranked Agenda of Open Questions

  **Criteria for Ranking:**
  1.  **Upstream Impact:** How many other questions become moot or solvable if this is answered?
  2.  **Team Tractability:** Can *this* specific trio (Logic, Virtue, Demandingness) solve it without empirical data?
  3.  **Neglect/Importance Ratio:** Is the question crucial but under-analyzed compared to its payoff?

  #### **Rank 1: The Scalar Reconstruction Problem**
  *   **The Question:** Can supererogation be coherently defined within a scalar or threshold model of obligation, or is it parasitic on binary deontic logic?
  *   **Upstream Of:** Everything. If the answer is "No, it disappears," the program pivots to defending binary logic. If "Yes," it requires a new formal definition.
  *   **Tractability:** **High.** This is the Deontic Logician's core competency. It requires formal modeling, not empirical data. The Demandingness specialist provides the normative constraints for the "threshold."
  *   **Neglect:** **High.** Most literature assumes binary logic to discuss supererogation, or assumes scalar logic to dismiss it. Few attempt to *reconstruct* the category within a scalar framework.
  *   **Why #1:** Your third suspicion is the greatest existential threat to the field. Resolving this validates the entire three-year program.

  #### **Rank 2: The Relational Boundary Hypothesis**
  *   **The Question:** Is the "line" of obligation fixed for all agents, or is supererogation essentially a predicate of *acts-relative-to-agents* (roles, relationships, capacities)?
  *   **Upstream Of:** The definition of heroism, the demandingness objection, and the distinction between duty and supererogation.
  *   **Tractability:** **High.** The Demandingness specialist and Virtue Ethicist can model this normatively. It relies on conceptual analysis of roles (parent, lifeguard) vs. general morality.
  *   **Neglect:** **Medium.** Often discussed in applied ethics (professional duties), but rarely integrated into the meta-ethical definition of supererogation.
  *   **Why #2:** Your second suspicion. If supererogation is just "what is not my specific role duty," the category collapses into role ethics. We must determine if there is a "universal supererogatory" zone that survives role specification.

  #### **Rank 3: The Necessity of Praiseworthiness**
  *   **The Question:** Is praiseworthiness a necessary condition for supererogation, or can an act be supererogatory but blameworthy (e.g., motivated by vanity) or neutral?
  *   **Upstream Of:** The distinction between the *act* and the *agent*. The classification of heroism vs. saintliness.
  *   **Tractability:** **High.** The Virtue Ethicist's primary domain. Requires analyzing the aretaic vocabulary without psychological empiricism.
  *   **Neglect:** **Low.** Heavily discussed, but usually conflated with the definition of the act.
  *   **Why #3:** It bridges the Logic (Rank 1) and the Human Element. If praise is not necessary, the category is purely deontic. If it is necessary, the category is hybrid.

  #### **Rank 4: The Symmetry of Suberogation**
  *   **The Question:** Is the "suberogatory" (permissible but morally worse) a genuine mirror of the supererogatory, or an artifact of formal symmetry?
  *   **Upstream Of:** Edge cases regarding omission and risk.
  *   **Tractability:** **Medium.** Requires the Logician and Normative Ethicist to agree on moral asymmetry.
  *   **Neglect:** **High.** Often treated as a formal curiosity rather than a substantive moral category.
  *   **Why #4:** If the symmetry is an artifact, we stop wasting time modeling "bad but permissible" acts. If real, it doubles the research surface area.

  #### **Rank 5: Risk, Desert, and Omission**
  *   **The Question:** Do these factors define the category or merely accompany it? (e.g., Must a supererogatory act involve risk? Can an omission be supererogatory?)
  *   **Upstream Of:** Nothing major. These are classificatory details.
  *   **Tractability:** **Medium.** Conceptual analysis of cases.
  *   **Neglect:** **Medium.**
  *   **Why #5:** These are downstream applications. We cannot decide if omission is supererogatory until we know what supererogation *is* (Rank 1) and where the line is (Rank 2).

  ---

  ### 3. Testing Your Three Suspicions

  **Suspicion 1: The Paradox is a Binary Artifact.**
  *   **Verdict:** **Correct.**
  *   **Reasoning:** The "Paradox of Supererogation" (that an act can be optional yet better than an obligatory act) relies on the Principle of Deontic Closure or the assumption that $O(A) \to \neg O(\neg A)$ exhausts the moral space. In Standard Deontic Logic (SDL), if $A$ is better than $B$, and $B$ is obligatory, $A$ should be obligatory.
  *   **Implication:** The paradox dissolves if we adopt a **Threshold Model**. Obligation is "doing enough." Supererogation is "doing more than enough." The paradox tracks a confusion between *optimality* and *requirement*.
  *   **Research Shift:** Stop trying to solve the paradox within binary logic. Spend Year 1 formalizing a **Threshold Deontic Logic**. The "real work" is indeed the boundary question: What sets the threshold? (See Rank 2).

  **Suspicion 2: The Concept is Relational.**
  *   **Verdict:** **Partially Correct, but does not collapse the category.**
  *   **Reasoning:** It is true that $S(x)$ is often $S(x, agent, context)$. A lifeguard saving a swimmer is duty; a bystander is supererogatory. However, this does not reduce supererogation to role duties.
  *   **Why it survives:** There exists a "Maximum Demandable Threshold." Even for a lifeguard, jumping on a grenade is supererogatory. Even for a parent, selling a kidney for a stranger is supererogatory.
  *   **Research Shift:** The category is relational regarding the *lower bound* of obligation (roles move the line), but there is a *universal upper bound* of obligation. Supererogation names the space between the agent-specific duty line and the universal maximum demand line. This preserves the category while accepting the relational data.

  **Suspicion 3: The Category Disappears under Scalar Obligation.**
  *   **Verdict:** **Plausible Threat.**
  *   **Reasoning:** If morality is purely scalar (Act A is 80/100, Act B is 90/100), "Obligatory" usually maps to "Maximize." If "Obligatory" means "Maximize," there is no supererogation. If "Obligatory" means "Satisfice" (above 50/100), supererogation is just the 51–100 range.
  *   **The Risk:** If it's just the "51–100 range," why does it have special normative force (e.g., immunity from criticism)? In a scalar model, doing 51 when you could do 100 is often criticized as sub-optimal.
  *   **Research Shift:** To save the category, you must argue for a **Normative Firewall**. The theory must explain why agents are *protected* from criticism for not maximizing. This is not just semantics; it requires a defense of "Optionality" within a scalar framework. This is the highest value-add your Logician can provide.

  ---

  ### 4. Overrated vs. Underrated Questions

  **Overrated (Generate papers, not progress):**
  1.  **The Paradox of Supererogation (Urmson formulation):** As noted, this is a logic puzzle. Solving it in SDL doesn't tell us about morality. It is overrated as a *moral* problem.
  2.  **Suberogation:** The "shmerogatory." While logically interesting, it generates little normative insight. Moral philosophy is not symmetric; doing wrong is not the mirror image of doing extra good.
  3.  **The "Saint vs. Hero" lexical distinction:** Unless tied to the structure of obligation, this is just semantics.

  **Underrated (High impact, low attention):**
  1.  **The Normative Force of Optionality:** *Why* are we allowed not to do the best? This is the engine of supererogation. It links directly to the Demandingness specialist's work.
  2.  **The Relational Boundary:** How much does role morality eat into supererogation? This is crucial for applied relevance without needing empirical data.
  3.  **Risk as a Constituent:** Is risk *necessary* for supererogation? If I give $1M anonymously with zero risk, is it supererogatory? If risk is required, the category shrinks. If not, it expands. This is rarely formalized.

  ---

  ### 5. Placement of Candidate Items

  *   **Omission vs. Act:** **Rank 5.** Depends on the definition. If supererogation is "maximizing good," omission counts. If it is "active sacrifice," it might not. Do not prioritize this until Rank 1 is settled.
  *   **Heroism vs. Saintliness:** **Rank 3.** This is the Virtue Ethicist's contribution to the Aretaic Correlates. Heroism = High Risk/Physical. Saintliness = High Sacrifice/Character. Distinguishing them helps map the "upper bound" of obligation.
  *   **Praiseworthiness:** **Rank 3.** Necessary condition? No. (A vain person can give to charity). Sufficient? No. (One can be praiseworthy for doing one's duty). It is a *typical marker*, not a definition.
  *   **Symmetry (Super/Sub):** **Rank 4.** Likely an artifact. Moral requirements are asymmetric (we are required to avoid harm more than we are required to do good).
  *   **Recipient Desert / Agent Risk:** **Rank 5.** Risk is a strong candidate for a *necessary* condition for Heroism, but not Supererogation generally. Desert is largely irrelevant to the *agent's* obligation status.

  ---

  ### 6. Decisive Results & The Single Line of Work

  **What moves items up/down the ranking?**
  *   **Up:** If the Logician proves that Scalar models *cannot* accommodate a "Normative Firewall" (immunity from criticism), then Binary Logic must be defended aggressively (Rank 1 becomes existential).
  *   **Down:** If the Demandingness specialist proves that "Role Duties" account for 90% of alleged supererogatory cases, the category shrinks to near nothing, and Rank 2 becomes the primary focus (saving the remnants).

  **What does a decisive result look like?**
  *   **For Rank 1:** A formal system (published in a logic/ethics journal) that models obligation as a threshold function $T(agent, context)$ where acts $> T$ are optional but immune to criticism.
  *   **For Rank 2:** A definitive taxonomy of "Role-Relative Obligations" vs. "Universal Supererogation."
  *   **For Rank 3:** A resolved account of whether a "Villainous Supererogatory Act" is a contradiction in terms.

  **If the funder supports only ONE line of work:**
  *   **Pick:** **Rank 1 (The Scalar Reconstruction / Threshold Model).**
  *   **Cut:** Everything in Rank 4 and 5 (Symmetry, Omission, Risk/Desert details).
  *   **Why:** If you cannot define the logical space of the category, analyzing the furniture inside the room is pointless. If the category is logically incoherent in a modern (scalar) framework, the other two researchers have no object of study. The Logician provides the skeleton; the others provide the flesh. Without the skeleton, there is no body.
  *   **Defense:** "We are not studying 'nice things people do.' We are studying the **logical limits of moral demand**. If we cannot formalize the boundary between 'Required' and 'Optional Good,' we cannot coherently discuss demandingness, virtue, or duty. This is foundational infrastructure for normative ethics."

  ---

  ### 7. Criteria, Trade-offs, and Hostages

  **Criteria Used:**
  1.  **Logical Priority:** Foundation before superstructure.
  2.  **Tool Match:** Leveraging the specific skills of the three researchers (Logic, Virtue, Demandingness).
  3.  **Existential Risk:** Prioritizing questions that could kill the project if answered negatively.

  **Trade-offs:**
  *   **Depth vs. Breadth:** We are sacrificing the rich variety of case studies (Rank 5) to secure the definition (Rank 1). This makes the project drier but more defensible.
  *   **History vs. Innovation:** We are explicitly deprioritizing the "Classic Paradox" (historical importance) in favor of the "Scalar Reconstruction" (systematic importance).

  **Where the Ranking is Hostage to Judgment:**
  *   **The Binary Assumption:** This agenda assumes that Standard Deontic Logic is insufficient. If a funder believes SDL is the only valid logic, Rank 1 looks like reinventing the wheel. *Defense:* SDL is known to be inadequate for normative nuance (the "Paradox of Derived Obligation," etc.).
  *   **The Relational Collapse:** I assume the Relational Hypothesis (Rank 2) *refines* rather than *eliminates* supererogation. If the Demandingness specialist finds that *all* obligation is role-relative, the category vanishes. The agenda bets against this nihilism.
  *   **Conceptual vs. Empirical:** I assume conceptual clarity is a deliverable a funder values. If they want "impact" defined as policy change, this agenda fails. *Defense:* Policy regarding moral demand (e.g., healthcare triage, military duty) rests on these conceptual boundaries. You cannot write policy on "duty to rescue" without knowing where duty ends.

  **Final Recommendation:**
  Frame the program not as "Research on Supererogation" but as **"Mapping the Limits of Moral Obligation."** Supererogation is merely the name for the space outside the limit. This aligns with the Demandingness specialist's work, utilizes the Logician's formal skills, and allows the Virtue Ethicist to describe the agents who inhabit that space. It transforms a "classic puzzle" into a structural investigation of normative authority.
