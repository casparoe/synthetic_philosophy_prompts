      *   *Q2: The Relational Boundary (Agent-Relative Duties).* This addresses Suspicion 2. The Demandingness specialist and Virtue Ethicist can tackle this. Is it role-duty or genuine supererogation? *Tractability:* High. *Impact:* High (prevents collapse into role ethics).
