  3.  **Address the Three Suspicions (The Core Constraints):**

      *   *Suspicion 1 (Binary Artifact):* The "Paradox of Supererogation" (Urmson) arises because $O(A)$ implies $\neg O(\neg A)$ and vice versa in standard deontic logic (SDL). If we have a third category or a scalar view, the paradox vanishes. *Verdict:* Mostly right. The paradox is a formal glitch. The *substantive* work is the boundary of obligation.
      *   *Suspicion 2 (Relational):* Is it $S(x)$ or $S(x, agent, context)$? A lifeguard saving a swimmer is duty; a bystander is supererogatory. *Verdict:* It is relational. But does this collapse it into role duties? No, because there are acts supererogatory for *everyone* (e.g., extreme self-sacrifice). The relational aspect refines the boundary, doesn't eliminate the category.
      *   *Suspicion 3 (Scalar/Threshold):* If obligation is scalar (better/worse) or threshold (good enough), does supererogation exist? If threshold: acts above threshold are optional. Supererogation is the "far above" zone. If scalar: "Obligatory" is just the top of the scale. Supererogation risks disappearing unless defined as "optimific beyond the call." *Verdict:* It threatens the category. Reconstructing it for scalar models is high priority.

