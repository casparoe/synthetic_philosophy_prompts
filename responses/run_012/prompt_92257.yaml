answer: |-
  There is no single, canonical term in philosophy, law, or political science that captures this exact dynamic. However, your observation is precise and identifies a specific structural flaw in how international norms function.

  The phenomenon sits at the intersection of **Speech Act Theory** (philosophy of language), **Institutional Fact** (legal theory), and **Normative Ethics**.

  Since you asked for a name if one does not exist, the most precise term for this is **Performative Encumbrance**.

  Here is the definition, the theoretical lineage, and the edges of the concept.

  ### The Name: Performative Encumbrance

  **Definition:**
  *Performative Encumbrance* occurs when a descriptive classification term is institutionally fused with a prescriptive obligation, such that uttering the term constitutes a binding commitment for the speaker. This fusion causes factual debates about the classification to function as proxies for political debates about the obligation, stalling action because the "truth" of the term is treated as the "cost" of the duty.

  **Breakdown:**
  *   **Performative:** Drawing on J.L. Austin's concept of the *performative utterance* (saying something that *does* something, like "I bet" or "I sentence you"). In this context, saying "This is genocide" is not just describing reality; it is triggering a legal or moral mechanism (like the 1948 Convention or the Responsibility to Protect).
  *   **Encumbrance:** A legal term meaning a burden on a property or right. Here, the word itself carries a "debt" or "liability." To use the word is to accept a burden (military intervention, legal prosecution, resource allocation).

  ### Why Existing Terms Don't Quite Fit

  You correctly ruled out "concept creep" and general "semantic arguments." Here is how *Performative Encumbrance* differs from the nearest neighbors:

  **1. Thick Ethical Concepts (Bernard Williams)**
  *   *What it is:* Words like "cruel," "brave," or "treacherous" that contain both a description (facts) and an evaluation (moral judgment).
  *   *The Edge:* Thick concepts are moral/descriptive, but they don't necessarily carry an *institutional* obligation. Calling an act "cruel" condemns it, but doesn't legally obligate the UN to intervene. *Performative Encumbrance* requires an institutional trigger (treaty, protocol, mandate) that turns the word into a debt.

  **2. Securitization (Copenhagen School)**
  *   *What it is:* The process by which a state moves an issue from "normal politics" to "emergency politics" (security), justifying extraordinary measures.
  *   *The Edge:* Securitization is about *priority* and *exception*. Performative Encumbrance is about *specific duty*. A government can securitize an issue (treat it as a threat) without admitting it is "genocide" (which would obligate them to protect the *target*, not just defend themselves).

  **3. Bureaucratic Ritualism**
  *   *What it is:* Following the rules/procedures so strictly that the actual goal is lost.
  *   *The Edge:* Ritualism is about doing the *wrong action* (paperwork) instead of the *right action*. Performative Encumbrance is about avoiding the *label* to avoid *any action*. The label isn't a substitute for action; it is the *gatekeeper* to action.

  **4. Illocutionary Force (Austin/Searle)**
  *   *What it is:* The power of a speech act to change reality (e.g., a judge saying "Guilty").
  *   *The Edge:* This is the mechanism, not the problem. *Performative Encumbrance* describes the specific *political friction* caused when that force is unwanted. It is the "resistance" generated by the illocutionary force.

  ### The Mechanism: The Lemkin Gap

  Your example of Lemkin highlights the core engine of Performative Encumbrance: **The Decoupling of Moral and Legal Definitions.**

  1.  **Moral Concept:** "Genocide" (in the public/activist mind) = "The ultimate crime against a group; requires stopping it."
  2.  **Legal Concept:** "Genocide" (in the 1948 Treaty) = "Specific intent to destroy a national, ethnical, racial or religious group (excluding political groups/cultural destruction)."
  3.  **The Encumbrance:** Because the Legal Concept triggers the Moral Obligation, actors fight over the Legal Definition to evade the Moral Obligation.

  The debate stalls because the two sides are playing different games:
  *   **Side A (Activists):** Using the *Moral Concept*. They want the label to mobilize shame and action. For them, the word *is* the intervention.
  *   **Side B (Governments):** Facing the *Legal Encumbrance*. They know that under international law and domestic politics, accepting the label creates a "liability" (troops, money, political capital). For them, the word is a *contract*.

  ### Where the Line Runs (The Edges)

  To ensure we know what *isn't* Performative Encumbrance, here are the boundaries:

  *   **It is not Euphemism:** Euphemism is softening a word to make it palatable ("collateral damage" vs. "civilian deaths"). Performative Encumbrance is avoiding a specific word because it is *too potent*.
  *   **It is not Lying:** The government isn't necessarily lying when they say "It doesn't meet the legal threshold." They are exploiting the gap between the compromised legal text and the moral reality. It is a *technical truth* used to evade a *moral truth*.
  *   **It is not Concept Creep:** Concept creep is expanding a word to cover more things (e.g., expanding "trauma" to include mild stress). Performative Encumbrance often involves *restricting* the word to its narrowest legal definition to avoid the cost.
  *   **It is not just "Politicization":** All language is political. This is specific to words where the *definition itself* was a political compromise (like the 1948 treaty dropping political groups) that later hardens into a moral barrier.

  ### Summary

  You have identified a structural bug in international human rights language. When a word is drafted as a **legal compromise** but functions as a **moral trigger**, it creates **Performative Encumbrance**.

  The "fight about the definition" is not confusion; it is a feature of the system. The definition acts as a firewall. By forcing the world to argue about whether "political groups" count, or whether "cultural destruction" qualifies, the system allows actors to exhaust the moral urgency in semantic litigation. The word ceases to describe the atrocity and starts describing the speaker's liability.

  **Term:** Performative Encumbrance.
  **Diagnostic:** If removing the obligation removes the desire to use the word, it is Performative Encumbrance. (e.g., If the UN had no duty to act on "Famine," would we still argue so fiercely about the caloric threshold?)
