  **Joint Statement on Intelligence Research**

  **1. Agreed Claims**
  1.  **Phenomenon:** Individual differences in adaptive success are real, stable across time, and socially consequential.
  2.  **Measurement:** Existing psychometric instruments predict life outcomes but lack mechanistic validity; they inevitably conflate capacity with familiarity and cultural exposure.
  3.  **Context:** Cognitive performance varies by environment; no theory explains variance without referencing specific task demands and constraints.
  4.  **Compression:** Defining intelligence solely as behavioural compression is insufficient; it ignores semantic value, utility, and environmental fit, satisfying neither camp.
  5.  **Goal:** A unified theory must account for both stable individual differences and systemic embeddedness without reductionism.

  **2. Residual Disagreements**

  | Claim | Psychometric Position | Situated-Cognition Position | Adjudication (Crux) |
  | :--- | :--- | :--- | :--- |
  | **Locus** | Intelligence is a latent internal capacity (g) causing behaviour. | Intelligence is a property of the agent-environment system. | **Intervention:** If training general skills transfers broadly, Camp 1 wins. If success requires niche-specific scaffolding, Camp 2 wins. |
  | **Testing** | Decontextualised tests measure pure capacity; noise is error. | Tests measure prior niche alignment; 'error' is contextual mismatch. | **Prediction:** Camp 1 predicts test scores correlate across novel domains. Camp 2 predicts correlation drops when tools/context change. |
  | **Flynn Effect** | Rising scores reflect biological/cognitive efficiency gains. | Rising scores reflect better fit between testing niches and modern life. | **Data:** Camp 1 requires evidence of heritable cognitive change. Camp 2 requires evidence of cultural tool adoption. |
  | **Compression** | Rejected for ignoring magnitude of capacity. | Rejected for ignoring distribution of cognitive labour. | **Consensus:** Compression metrics must weight environmental complexity to be viable. |

  **3. Verbal Dispute & Cruxes**
  The term 'intelligence' is used substantively differently, not merely verbally. Camp 1 reifies intelligence as a causal entity within the skull. Camp 2 treats it as an emergent property of interaction. Merging definitions would obscure the causal mechanism. Camp 1 seeks to measure the engine; Camp 2 seeks to map the road. Both are necessary for navigation, but they are not measuring the same object. This dictates policy: Camp 1 selects individuals; Camp 2 designs environments.

  **Crux 1: Transferability.**
  *   *Question:* Does training working memory improve reasoning in unrelated domains?
  *   *Agreed Test:* Pre-registered remote training programme.
  *   *Camp 1 Prediction:* Significant positive transfer (g enhancement).
  *   *Camp 2 Prediction:* Null transfer outside trained niche (specific adaptation).

  **Crux 2: Offloading.**
  *   *Question:* Does removing external tools reduce 'intelligence' equally across scores?
  *   *Agreed Test:* Problem solving with/without notebooks/devices.
  *   *Camp 1 Prediction:* High-g individuals suffer less (internal capacity buffers).
  *   *Camp 2 Prediction:* Performance collapse is uniform; 'high-g' was merely better tool utilisation.

  **4. Conclusion**
  We acknowledge the compression proposal failed because it abstracted away the very things we dispute: the location of cognitive labour and the value of the output. We commit to testing the cruxes above before further theoretical consolidation.
