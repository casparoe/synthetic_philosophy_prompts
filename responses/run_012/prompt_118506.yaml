answer: |-
  You have independently rediscovered **Costly Signaling Theory**, which is used in economics and evolutionary biology to explain exactly what you are looking at. Your gut is better than you think; you just need to tighten the definitions.

  Here are the two rules that cover your list.

  ### Rule 1: The Handicap (The Cost)
  **The action must burn resources (money, time, risk, or reputation) that a "faker" cannot afford to burn.**
  It doesn't have to be cash paid up front. It can be *risk* (you might have to pay later), *sunk time* (you can't get the 14 years back), or *opportunity* (you could have spent that money elsewhere). If a liar can do it as easily as the truth-teller, it is noise, not a signal.

  ### Rule 2: The Witness (The Audience)
  **The cost must be visible to the specific audience you want to convince.**
  If you burn resources in the dark, it is consumption or hobby, not communication. A signal requires a receiver.

  ***

  ### How the rules map to your list

  *   **Peacock (Natural Tail):** Passes **Handicap** (energy drain, predator risk) and **Witness** (peahen sees it). *Verdict: Signal.*
  *   **Peacock (Glued Feathers):** Fails **Handicap**. A weak bird can glue feathers; it doesn't prove health. *Verdict: Fake.*
  *   **Car (Visible):** Passes **Handicap** (money) and **Witness** (public sees it). *Verdict: Signal.*
  *   **Car (Garage):** Passes **Handicap**, Fails **Witness**. No one sees the burn. *Verdict: No Signal.*
  *   **Anonymous Donation:** Passes **Handicap**, Fails **Witness**. *Verdict: No Signal.* (Matches your call).
  *   **Named Donation:** Passes **Handicap** and **Witness**. *Verdict: Signal.*
  *   **Smoking Bet ($500):** Passes **Handicap** (risk of loss). A liar won't risk the cash. *Verdict: Signal.*
  *   **Smoking Promise (No Bet):** Fails **Handicap**. "Cheap talk." *Verdict: No Signal.*
  *   **eBay Seller (14 Years):** Passes **Handicap**. You said "never paid anything up front," but they paid in **Time** and **Reputation Risk**. A scammer cannot afford to wait 14 years to make a score; they get banned. *Verdict: Signal.*
  *   **Fake Rolex:** Fails **Handicap**. The cost is low (price of the fake), so the signal is broken. *Verdict: No Signal.*
  *   **Nuke Threat (Credible):** Passes **Handicap** (capability to destroy self/world) and **Witness**. *Verdict: Signal.*
  *   **Nuke Threat (Bluff):** Fails **Handicap**. *Verdict: No Signal.*

  ### The Exception: Counter-Signaling
  You have two cases that seem to break Rule 1: **The Hoodie Guy** and **The Student Hiding Study**.
  These are **Counter-Signals**. This only works if you are *already* established as high status.
  *   **The Hoodie Guy:** He doesn't need to signal wealth (Car) because his status is already known. By *not* signaling, he proves he is so secure he doesn't need to try. A faker (poor guy) *must* try to look rich. The Hoodie Guy's "signal" is the **absence** of the expected cost.
  *   **The Student:** By hiding the effort, he signals natural genius. "I ace tests without trying." If he fails, he looks dumb. It's a high-risk signal of ability.

  ***

  ### The Call You Must Give Up

  You said about the **Money-Back Guarantee**: *"costs the seller nothing unless the thing is actually bad."*

  The rule forces you to give up the idea that this costs **nothing**.
  For the Guarantee to work as a signal (which you correctly said it does), there **must be a cost**. That cost is **Risk**.
  Even an honest seller knows some units will be returned, some customers will be difficult, and processing refunds costs administrative time and money. A seller of *junk* cannot offer this guarantee because their expected refund rate would bankrupt them. An honest seller *can* afford the risk.
  **Your Correction:** You must accept that the guarantee *does* have a cost (Expected Value Risk). If it truly cost nothing, your gut would be wrong to trust it. The trust is justified *because* there is a hidden cost you aren't seeing.

  ### The New Case You Won't Like

  **Case:** A politician stands at a podium and says, *"I promise to fix this economy. You have my word."*

  **The Rule's Verdict:** **Meaningless Noise.**
  Under Rule 1 (The Handicap), this is "cheap talk." It costs the politician nothing to say it. They do not lose money, time, or reputation *unless* they fail later, but by then the election is over.
  There is no "bond" posted (like your smoking bet). There is no visible cost.
  **Why you won't like it:** We want to believe words have weight. But the rule says you should ignore this completely. You should only listen if they tie their salary to the result, or resign if they fail. Without a **Handicap**, the promise is just sound waves.
