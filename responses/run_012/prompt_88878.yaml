answer: |-
  The notification arrived not as a sound, but as a texture in Elara's thought-stream, a sudden grit in the smooth flow of recall. She was standing at the podium, looking out at the faces of her Introduction to Archaeology students. She needed the date of the Çatalhöyük excavations. It appeared instantly, hovering in her mind's eye: *1961*. She spoke it. The connection was seamless. For forty years, Aethelgard Cognitive Solutions had been the substrate of her recall. She did not consult it; she *was* it.

  But the grit remained. A sub-vocal tag: *Account Review Pending. Tier Migration Required.*

  She finished the lecture, the names of the students surfacing automatically as she made eye contact. *Sarah. David. Priya.* She didn't memorize them; the system tagged the faces and fed her the labels. It was as transparent as breathing. You don't thank your lungs for oxygen; you don't thank Aethelgard for the capital of Peru.

  When she got home, the notification had solidified into a contract update. Her subscription, "Mnemosyne Gold," was being sunset. The new tier, "Mnemosyne Platinum," cost eighteen percent more and included a mandatory arbitration clause regarding data ownership. The old data—the last four decades of her life—would be archived on cold storage, accessible only with a latency of three to five seconds, unless she upgraded.

  Three seconds. An eternity. A gap in the self.

  Her son, Julian, was in the kitchen when she walked in. He saw the look on her face. He knew the look. It was the face of someone whose limb had gone numb.

  "The bill?" he asked, pouring wine.

  "They're changing the terms," Elara said, sitting heavily. "They're throttling access to pre-2010 memories unless I pay the premium."

  Julian sighed, leaning against the counter. "Mom, we've talked about this. It's a service. Like electricity. Or... like your glasses."

  Elara touched the temple of her glasses, a reflex. "Don't start."

  "I have to. You treat this like it's your soul. It's a server farm in Nevada. It's property. It's not you."

  "It is me," Elara said, her voice quiet. "Where do I end, Julian? If I need the code to remember my father's voice, and the code is on their drive, then my father lives on their drive. If they delete the file, do I stop having had a father?"

  "That's a category error," Julian said, sharp but gentle. "Long use no more makes the service part of your mind than your glasses are part of your eyes. You've worn glasses for fifty years. If I smash them, you're blind, but your eyes are still yours. This is the same. It's a tool you've coupled with. It's not constitutive."

  "It feels constitutive," she said. "There is no friction. I don't decide to search. I just know. The coupling is perfect. It satisfies every condition. It's always available, it's automatically endorsed, it's immediately accessible. Clark and Chalmers would say this *is* my mind."

  "Clark and Chalmers didn't account for corporate EULAs," Julian countered. "You can't own a thought that someone else can repossess."

  "I don't own my heart, Julian. It stops, I die."

  "Heart attacks happen. This is a billing dispute."

  The argument hung in the air, unresolved, as it always did. Julian saw a vendor and a customer. Elara saw a host and a parasite, or perhaps a symbiote. She went to bed early, the notification pulsing gently in her periphery, a headache that wasn't pain.

  The outage happened at 3:00 AM.

  There was no warning. No red text, no alert. Elara woke from a dream, thirsty. She swung her legs out of bed and stood up. She needed to navigate the hallway to the kitchen. She needed to remember where the water glasses were kept.

  Usually, the knowledge was there before the intention formed. *Kitchen. Second cupboard. Left hand.*

  This time, there was silence.

  It wasn't darkness. It wasn't forgetting. Forgetting is a struggle, a grasping at smoke. This was a void. It was as if the concept of "cupboard" had been excised from the universe. She stood in the hallway, her hand reaching out to steady herself against the wall.

  She tried to summon her own phone number. A blank wall.
  She tried to summon the name of her first love. A static hum.

  She walked into the kitchen by muscle memory, the old, biological kind. She found a glass by touch. She drank. Then she sat on the floor, the linoleum cold against her legs.

  Panic did not come first. Panic implies a threat to the organism. This felt like a threat to the *continuity* of the organism. She felt a profound irritation, sharp and hot, at the audacity of the silence. How dare the world be inaccessible? But beneath the irritation was a grief so specific she had no name for it.

  It was the grief of a phantom limb, but inverted. It wasn't that the limb was gone; it was that the space where the limb should be was now occupied by someone else's furniture. She felt hollowed out, not because she had lost her memories, but because the space they occupied had been evicted. She was a tenant in her own skull, and the landlord had changed the locks.

  She sat there for an hour, waiting for the grit to return.

  At 4:12 AM, the texture snapped back. *Cupboard. Water. Son. Julian. Archaeology.* The flow resumed. The seamless integration repaired itself.

  Elara stayed on the floor. The memories were back, but the feeling of ownership was bruised. She reached for the name of her husband, long dead. *Robert.* It arrived instantly, warm and familiar.

  But now she wondered: Was the warmth hers, or was it a haptic feedback setting included in the Gold Tier?

  Julian found her there in the morning. He didn't ask why she was on the kitchen floor. He saw the look in her eyes.

  "Did it go down?" he asked.

  "Yes."

  "For how long?"

  "An hour."

  Julian exhaled, rubbing his face. "I'll call them. I'll get a lawyer. We can sue for breach of continuity."

  Elara stood up, her knees cracking. She walked to the window and looked out at the street. She knew the names of the neighbors. She knew the year the oak tree was planted. The data streamed in, obedient and bright.

  "No," Elara said.

  "Mom, they cut off your brain."

  "They suspended the service," she corrected, though the words tasted like ash. "According to the contract, they are allowed maintenance windows. They are allowed to migrate data."

  "So you're just going to let them hold your mind hostage?"

  Elara turned to look at her son. She tried to access the memory of his birth, the specific weight of him in her arms. It was there, crisp and high-definition. *7 pounds, 4 ounces. 1984.*

  "I don't know what I am without them, Julian," she said. "If I cancel, and I go back to just... me... just the biological me... I don't know if that's enough to be a person anymore. I've offloaded too much."

  "Then you pay," Julian said. "You let them own you."

  "I let them host me."

  "Is there a difference?"

  Elara looked at him. She waited for the answer to surface from the cloud, but for the first time in forty years, she hesitated. She waited to see if the hesitation was her own, or a latency lag. She couldn't tell.

  "I don't know," she said.

  She turned back to the window. The sun was rising. She knew the time, the azimuth, the atmospheric conditions. The data poured in, beautiful and rented. She accepted it. She had no choice. To reject it would be to lobotomize herself. To accept it was to admit she was a tenant.

  She watched the light hit the glass, and she wondered if the grief she felt was hers, or if it was just a standard response algorithm for Service Interruption Events, billed by the minute. She held the thought, waiting to see if it would fade when the bill came due. It didn't. Or perhaps it did, and she just couldn't remember the difference.
