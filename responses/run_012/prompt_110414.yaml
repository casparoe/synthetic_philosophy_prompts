answer: |-
  **Final Examination: Historical Method and the Gospels**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. Do not simply list criteria or standard objections. Your grade will depend on the clarity of your verdict and your ability to engage with the methodological implications of the proposal described below.

  **Question:**
  A student in this seminar proposes that the longstanding impasse regarding the criteria of authenticity stems from a failure of informal reasoning. They argue that each criterion (embarrassment, dissimilarity, coherence, etc.) should be reformulated explicitly as a likelihood ratio: the probability that a tradition would exist if it were authentic, divided by the probability that it would exist if it were inauthentic. According to this proposal, combining these ratios would resolve methodological tensions by turning qualitative disagreements into quantitative adjustments.

  Write an essay evaluating this proposal. You must reach a clear verdict: does formalizing the criteria as likelihood ratios rescue the method from its current impasse, or does it merely relocate the difficulty to a different part of the process? In defending your verdict, you must address two specific constraints: (1) the source of the numerical values assigned to the probabilities, given that the behavior of the early church is itself what the criteria are meant to illuminate; and (2) the problem of applying probabilistic tests to individual units of tradition when the meaning of those units may depend on narrative contexts the criteria strip away.

  ***

  **Model Answer**

  The proposal to reformulate the criteria of authenticity as explicit likelihood ratios offers a significant logical clarification, but it ultimately relocates the methodological difficulty rather than rescuing the enterprise. While translating informal heuristics into Bayesian terms exposes the underlying structure of historical argumentation, it cannot overcome the evidential scarcity and circularity inherent in the data set. The formalization is logically sound but empirically unworkable.

  First, one must acknowledge the strength of the proposal. Historians have long applied criteria like embarrassment or dissimilarity as intuitive checks. By defining them as likelihood ratios, the student correctly identifies that these are claims about comparative probability. For instance, the criterion of embarrassment asserts that P(Tradition|Inauthentic) is low because the early church would not invent shameful material. Making this explicit forces the historian to admit they are weighing competing hypotheses. This dissolves the illusion that the criteria are mechanical filters. It reveals that tensions between criteria are indeed disagreements about the weight of evidence rather than contradictory rules. If dissimilarity suggests authenticity while coherence suggests otherwise, the Bayesian framework demands we weigh the likelihood ratios against one another. This logical transparency is an improvement over vague appeals to "cumulative weight."

  However, the proposal collapses when addressing the source of the numbers. A likelihood ratio requires estimated values for the numerator and denominator. In historical Jesus research, these values depend on background knowledge about first-century Judaism and the early church. The critical failure lies in the fact that our primary evidence for the early church's behavior *is* the tradition we are testing. To assign a value to P(Tradition|Inauthentic), one must know how likely the church was to invent a specific saying. But we only know what the church invented by identifying inauthentic material—which is the very task the criteria are supposed to accomplish. This is circular. If a historian assigns a low probability to the church inventing a saying about Jesus' ignorance, they are relying on a prior theological assumption about the church's consistency, not independent data. The probabilistic framework makes this circularity more visible, but it does not provide a way to escape it. We lack the independent control group necessary to generate reliable base rates.

  Furthermore, the probabilistic model exacerbates the problem of atomization. Likelihood ratios are typically applied to discrete units of tradition—a specific saying or deed. Yet, the meaning of these units is often dependent on their narrative context within the Gospels. The criterion of dissimilarity, for example, often isolates a saying from its Jewish context to prove uniqueness. If we strip the context to apply the test, we alter the meaning of the evidence, thereby changing the probability values. A saying might look dissimilar in isolation but coherent within a broader Jewish apocalyptic framework. The probabilistic approach demands precise inputs, but the input data is unstable because the unit of analysis is arbitrary. Assigning a number to a decontextualized fragment creates an illusion of precision where there is only ambiguity.

  Consequently, the tensions among the criteria do not dissolve; they harden into unstated assumptions about priors. The criterion of dissimilarity purchases distinctiveness at the price of historical plausibility because the prior probability assigned to Jesus fitting within Judaism is set too low. The criterion of embarrassment fails because the estimate of the church's willingness to retain difficult material is speculative. By demanding numbers, the proposal highlights that these are not objective measures but subjective estimates disguised as math.

  Therefore, the verdict is that the proposal relocates the difficulty. It moves the problem from the ambiguity of the criteria themselves to the arbitrariness of the assigned probabilities. It succeeds in showing *why* the impasse exists—because we lack independent data to fix the variables—but it fails to provide a solution. The method becomes more honest about its uncertainty, but it does not become more capable of producing secure results. Historical judgment remains necessary to estimate the probabilities, which means we are back where we started: relying on the historian's intuition, now merely dressed in probabilistic language. The impasse is not a failure of logic that better math can fix; it is a failure of evidence that no formalism can overcome.

  ***

  **Marking Scheme**

  **Total Marks:** 20 (5 Points × 4 Marks)

  | Point | Requirement | Typical Error Costing the Mark |
  | :--- | :--- | :--- |
  | **1** | **Validates the logical form:** Acknowledges that translating criteria into likelihood ratios clarifies the underlying argument structure and exposes implicit assumptions. | Fails to recognize any benefit to the proposal and dismisses it entirely as nonsense. |
  | **2** | **Addresses the source of numbers:** Explicitly discusses the lack of independent data required to assign values to the probabilities (base rates). | Claims the numbers can be derived from the Gospels themselves without noting the circularity. |
  | **3** | **Identifies circularity:** Explains that estimating the church's behavior (likelihood of invention) relies on the very tradition being tested. | Treats the church's behavior as a known variable rather than a hypothesis requiring proof. |
  | **4** | **Addresses atomization/context:** Discusses the problem of applying probabilities to isolated units when meaning depends on narrative context. | Ignores the context constraint and treats tradition units as stable, independent data points. |
  | **5** | **Clear Verdict:** Commits to a position (rescue vs. relocate) and justifies it based on the previous analysis without wavering. | Hedges the verdict or concludes that the method works "sometimes" without a definitive methodological judgment. |
