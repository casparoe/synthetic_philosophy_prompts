answer: |-
  You are not experiencing personal inadequacy. You are running headfirst into a hard boundary in both narrative theory and the philosophy of mind. Your friend is structurally correct but phenomenologically imprecise. The problem *is* a version of the Combination Problem, but the specific flavor you are tasting has a more useful name for a novelist.

  Here is the carving you asked for.

  ### 1. The Name: The Phenomenological Combination Problem
  Your friend cited the **Combination Problem** from panpsychism. That is the metaphysical question: *How do micro-experiences (atoms/cells) combine to form a macro-experience (a human mind)?*

  You are facing the **Phenomenological Combination Problem**. This is the narrative/reader-experience question: *How do I render a macro-experience (the company) without erasing the micro-experiences (the actors) or invoking magic (a hive mind)?*

  In philosophy of mind, this is often discussed under **Group Agency vs. Group Subjectivity** (most notably by Christian List and Philip Pettit in *Group Agency*). They argue that a group can easily be an **Agent** (it can have beliefs, desires, and make decisions via voting/consensus) but it is incredibly difficult to argue a group is a **Subject** (it can *feel* pain, joy, or dread).

  *   **Group Agency:** The board votes to cancel the season. (Readers accept this. It's mechanics.)
  *   **Group Subjectivity:** The company *feels* the cancellation like a limb loss. (Readers reject this. "Nobody home.")

  Your drafts are failing because you are successfully building a **Group Agent** (the company acts), but you are trying to clothesline the reader into accepting a **Group Subject** (the company feels). Readers accept the former as sociology; they reject the latter as fantasy.

  ### 2. The Asymmetry: Dissociation vs. Fusion
  You asked why splitting one mind (1 $\to$ 2) is free, but combining many (N $\to$ 1) is impossible. This is a named asymmetry in cognitive science and narratology, though often described rather than labeled. I will call it the **Fragmentation-Fusion Asymmetry**.

  *   **Fragmentation (1 $\to$ 2) is Phenomenologically Accessible.**
      We all experience internal conflict, ambivalence, or "parts of ourselves" that disagree. When you split a character, you are modeling a known human experience (dissociation, cognitive dissonance, Freudian id/ego). The reader recognizes the *texture* of a divided self because they live inside one.
  *   **Fusion (N $\to$ 1) is Epistemically Private.**
      We never experience the *inside* of another mind. We only see the outside. To write a fused mind, you must violate **Epistemic Privacy** (the rule that I only have direct access to my own qualia). When you write "We decided," the reader's brain automatically searches for the *individual* locus of that decision. If they can't find one specific skull, they assume either "shorthand for a leader" (realism) or "magic" (sci-fi). There is no neural template for "feeling what a group feels."

  **The Carving:**
  *   **Dissociation** = Subtraction of coherence. (Easy to simulate; we feel fragmented.)
  *   **Fusion** = Addition of coherence. (Impossible to simulate; we never feel merged.)

  ### 3. Testing the Boundaries (Your Examples)
  You asked where this concept stops and starts. Here is how the **Agency/Subjectivity** distinction carves up your examples:

  *   **A Jury:** **Group Agent only.** They reach a verdict (decision), but no reader believes the jury *felt* the verdict. If you write "The jury felt guilty," readers assume you mean the individuals.
  *   **A Corporation:** **Group Agent (Legal Fiction).** It can sue and be sued. It has no body, so it has no feelings. Writing a corporation as a Subject is satire or horror (e.g., *Severance*).
  *   **A Family:** **Shared History, Distinct Subjects.** They can finish sentences (predictive modeling), but if Mom gets a headache, Dad doesn't feel it. They are a "we" of memory, not a "we" of sensation.
  *   **A Marching Band:** **Synchronized Agency.** They move as one. If they feel anything, it is parallel (individual pride), not collective.
  *   **A Theater Company:** **The Edge Case.** This is why you chose it. It is the closest human equivalent to a single organism. Interdependence is high; one failure ruins the whole. But it is still distinct minds.

  **The Verdict:** None of these are naturally **Group Subjects**. To make the theater company a Subject, you are not writing realism; you are writing **Speculative Phenomenology**. You are asking the reader to accept a new law of physics: that consciousness can exist in the space *between* bodies.

  ### 4. Why "Emergence" and "Supervenience" Are Misses
  *   **Emergence:** This explains *behavior*, not *feeling*. A flock of birds emerges patterns, but the flock doesn't *hurt*. If you use emergence, you get the "list" or "mood" you described.
  *   **Supervenience:** This is a metaphysical dependency (mental states depend on physical states). It doesn't help you write the *experience* of the mental state.
  *   **Hive Mind:** This implies the individuals are drones. You want the individuals to remain vivid *and* the group to be vivid. That is the Combination Problem.

  ### 5. A Narrative Solution (How to Fix the Draft)
  If you want to stop fighting the Phenomenological Combination Problem, you have to change what you are asking the reader to believe. You cannot make the Company a **Subject** (a feeler) without breaking realism. But you can make the Company a **Locus of Attention**.

  Consciousness is not just feeling; it is *selection*. A mind is a spotlight that ignores 99% of reality to focus on 1%.

  **The Fix:**
  Don't write the Company *feeling*. Write the Company *attending*.
  *   **Individual POV:** "I am worried about my line." (Focus: Self)
  *   **Company POV:** "The lighting cue was late, the box office was quiet, and the lead's voice cracked." (Focus: System Integrity)

  If you write scenes where the "narrative camera" ignores individual internal monologues and focuses *only* on threats to the system's survival, the reader will stop looking for a specific skull. You create a **Systemic Subjectivity**.

  **Concrete Technique:**
  Use the **"We" Narrator** but constrain its knowledge.
  *   *Bad:* "We felt sad." (Too abstract, nobody home.)
  *   *Bad:* "John felt sad and Mary felt sad." (List.)
  *   *Good:* "The sadness sat in the rafters. It was in the dust motes dancing in the work lights, in the silence of the phone at the box office. We did not speak of it, because to speak of it would be to admit the season was dead."

  Here, the "We" is not a fusion of minds. It is a **shared constraint**. The "somebody" is not the group feeling; the "somebody" is the *space* they occupy.

  ### Summary
  *   **Is it a known thing?** Yes. **The Phenomenological Combination Problem** (narrative variant of the metaphysical Combination Problem).
  *   **The Asymmetry:** **The Fragmentation-Fusion Asymmetry**. Dissociation is relatable; Fusion violates Epistemic Privacy.
  *   **The Carving:** You are trying to write **Group Subjectivity** (feeling) when you have only built **Group Agency** (acting). Readers accept the latter, reject the former.
  *   **The Fix:** Stop trying to make the Company a *Feeler*. Make it a *Focus*. Shift from "What does the Company feel?" to "What does the Company notice that the individuals ignore?"

  You are trying to do something that essentially hasn't been done successfully in literary realism (as opposed to fantasy/horror). The failure is not your skill; it's the medium. To succeed, you must signal to the reader that the rules of consciousness in this book are slightly different, or pivot to **Systemic Attention** rather than **Collective Feeling**.
