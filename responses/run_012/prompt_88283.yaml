prompt: |-
  I'm in a decision theory seminar this term and there's one line my professor uses to end arguments that I can't get past: 'you can't be worse off with more information.' She said it last week to tell someone in my section that of course he should get the extra test before choosing a treatment, and she says some version of it about gathering more data before you commit to a hypothesis. She calls it Good's theorem I think, some statistician from the 60s.

  But I'm pretty sure it can't mean what it sounds like, and I also can't tell what it does mean. When I said my aunt got a genetic test she didn't have to get and it made her last year miserable, my prof said that's ex post, that's a different thing. When I pushed on what the non-different thing is, she said 'well, you can always ignore it' — which feels like it does all the work with none of the lifting. Someone in my section said that in a negotiation knowing more about the other side can hurt you, and she said that's because the information isn't free. Fine, but then when *is* it free? And a friend of mine deliberately avoids looking at her bank balance because she says she'd just spiral, which my prof waved off as a preference about knowing rather than a fact about information.

  Act like a philosopher of decision theory who's used to grading undergrads and is pedantic in a helpful way. Take this slowly, and before you answer, brainstorm the space of possible readings rather than jumping to the one you like best.

  Then give me a numbered menu of the precise claims 'you can't be worse off with more information' could be making, from the trivial ones to the strong ones. For each reading, tell me: what it quantifies over (whose expectations, computed when, over what, compared to what), what has to be true for it to hold, and whether it's a platitude, a genuine theorem, contentious, or flatly false. Then say which reading fits what my prof actually did when she told him to get the test, and whether she quietly switched to a different one with the 'you can always ignore it' move — because if the answer is 'you may ignore it', I want to know if that's the same claim at all.

  Where a reading fails only in special cases, give me the smallest concrete case where it breaks instead of a general discussion — one per reading, please. And where a reading is only true for a certain kind of agent (someone who updates a particular way, or has a particular kind of preference), say what kind and what happens to the claim when the agent isn't that kind. Also flag anywhere I'm probably conflating two things, because I suspect I am, definitely in the negotiation example.

  No reading list please, just the positions — our library search is down anyway and I don't need names, I need the claims. I want to have this sorted before office hours.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Undergraduate or early graduate student in a decision theory seminar.
      *   **Problem:** Confused by the professor's aphorism "you can't be worse off with more information" (attributed to Good's Theorem). The student sees counterexamples (aunt's genetic test, negotiation, bank balance anxiety). The professor dismisses these as "ex post," "costly information," or "preferences about knowing."
      *   **Task:** Act as a pedantic but helpful philosophy of decision theory professor/grader.
      *   **Constraints:**
          *   Take it slowly.
          *   *Before* answering, brainstorm the space of possible readings (show the work).
          *   Provide a numbered menu of precise claims (trivial to strong).
          *   For each reading: specify quantification (expectations, timing, etc.), conditions for truth, status (platitude/theorem/false), and a minimal counterexample if it fails.
          *   Specify agent requirements (e.g., Bayesian updater).
          *   Address the professor's specific moves (the "ignore it" defense, the "cost" defense).
          *   Flag conflations (especially regarding negotiation).
          *   No reading lists (just the claims).
          *   Tone: Pedantic, helpful, precise, slightly weary but encouraging (like a TA or prof during office hours).

  2.  **Brainstorming the Space of Readings (Internal Monologue/Drafting):**
      *   Okay, what *could* "more information is better" mean?
      *   *Reading 1: Ex Post Welfare.* After I know the truth, am I happier? No, the aunt example kills this. Knowing you have a disease makes you sad. So this is false. The prof already admitted this is "ex post."
      *   *Reading 2: Ex Ante Expected Utility.* Before I look, do I expect to be better off if I look? This is the standard Good's Theorem territory. If I'm a Bayesian expected utility maximizer, and information is free, the expected utility of looking $\ge$ expected utility of not looking.
      *   *Reading 3: Option Value.* Having information gives me more options. I can always ignore it. This relies on the "ignore it" move. Is ignoring information the same as not having it? Only if having it doesn't change my utility function directly.
      *   *Reading 4: Strategic/Game Theoretic.* In negotiation, information can be a burden (e.g., knowing you will lose makes you negotiate worse, or the other side knows you know). This involves common knowledge and signaling.
      *   *Reading 5: Costly Information.* If information costs money/effort, obviously it might not be worth it. The prof mentioned this.
      *   *Reading 6: Psychological/Epistemic Utility.* Some people hate knowing. This changes the utility function. Information isn't just instrumental; it has intrinsic disutility.
      *   *Reading 7: Logical Omniscience/Bounded Rationality.* If I'm not a perfect reasoner, more info might confuse me or lead to worse processing. Good's theorem assumes perfect updating.

  3.  **Structuring the Response:**
      *   **Introduction:** Set the persona (pedantic but helpful prof). Acknowledge the frustration.
      *   **Brainstorming Section:** Briefly outline the conceptual map before diving into the numbered list.
      *   **Numbered Menu of Claims:**
