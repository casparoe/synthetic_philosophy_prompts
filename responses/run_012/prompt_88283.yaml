  7.  **Final Polish:** Ensure the distinction between *instrumental* value (helps me choose) and *intrinsic* value (I like/dislike knowing) is sharp. This is likely the core confusion with the aunt/bank balance. The negotiation example is likely about *strategic* value (common knowledge).

      *(Self-Correction on "No reading list"):* The prompt says "No reading list please, just the positions — our library search is down anyway and I don't need names, I need the claims." I should avoid dropping names like "Blackwell's Theorem" or "Aumann" unless necessary for the claim description. I will stick to describing the logical structure.

