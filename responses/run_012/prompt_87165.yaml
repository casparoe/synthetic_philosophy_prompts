      *   *Actually, to make them "feel it," more participation is better.* Let's try: 18 students. 5 mins per case type group discussion, then a plenary vote.
      *   *Revised Timeline:*
          *   0-10: Intro/Setup.
          *   10-25: Constitution (Rule Writing).
          *   25-30: Insurance (Optional).
          *   30-35: Reveal Cards.
          *   35-60: Adjudication (4 rounds, 6 mins each).
          *   60-90: Debrief.
      *   *Insurance:* If I add insurance, it cuts into adjudication. I'll mark it as "High Priority Optional" but warn about time. I'll design it to be very fast (buy/sell slip).

  5.  **Developing the Four Cases (The Cards):**

      *   *Card A (Brute Luck):* "You were born with a condition that requires 150 points of maintenance to function at the baseline. You did nothing to cause this."
      *   *Card B (Option Luck):* "You were offered a safe path (0 points) or a risky path (500 points or -150 points). You chose the risky path. You lost."
      *   *Card C (Indeterminate):* "You are 150 points below baseline. Records show you had equal opportunity, but your output was low. It is unclear if this is lack of effort or hidden disadvantage."
      *   *Card D (Tastes/Magnitude):* "You have a basic unchosen need (50 points). However, you cultivated a specific preference that raises the cost to 150 points. You refuse the cheaper alternative."
