      *   *Idea:* A case where something is unchosen, but not *bad*. Example: You are randomly assigned a high-responsibility role that is stressful. It's unchosen. Is it compensable?
      *   *Better Idea for the Game:* Card B (Option Luck). If they win, they are better off. If they lose, they are worse off. The *luck* is the same (the risk), the *outcome* differs.
      *   *Best Fit for "Unchosen vs Bad":* Card D. The *need* is unchosen. The *severity* is chosen. The group must decide if they compensate the unchosen need (ignoring the severity) or the total disadvantage (which includes choice). This forces them to choose which criterion tracks.
