      *   *Insurance Option:* Prompt asks for this as optional if time fits. 90 mins is tight. I need to calculate the timeline carefully. If the core game takes 60 mins, debrief 30, insurance might squeeze it. I will include it as a streamlined "Phase 1.5" to ensure the ex ante/ex post tension is felt.
      *   *Group Size:* 18 students. Perfect for 4 groups of 4, plus 2 extras? Or one big group? The prompt implies "the group writes the rule." A single plenary rule is better for the "constitutional" feel. 18 is manageable for one group discussion if facilitated tightly.
      *   *Facilitator:* Banker, Timekeeper, Judge of last resort.

  3.  **Drafting the Mechanics:**

      *   *Total Points:* 1000 points available in the "Treasury."
      *   *Claims:* Each of the 4 case types will appear multiple times. Let's say 18 students. Each gets a card.
      *   *Card Distribution:*
          *   Type 1 (Brute): 5 students. Claim cost: 150 pts each. Total: 750.
          *   Type 2 (Option): 5 students. Claim cost: 150 pts each. Total: 750.
          *   Type 3 (Indeterminate): 4 students. Claim cost: 150 pts each. Total: 600.
          *   Type 4 (Tastes/Magnitude): 4 students. Claim cost: 150 pts each. Total: 600.
          *   *Total Claims:* 2700 points. *Treasury:* 1000 points. This creates real scarcity.
      *   *Wait, the prompt says "four calibrated cases, one per participant chosen by the facilitator."* This implies I assign specific cases to specific people to control the debate. I shouldn't randomize the *types* too much, or I might not get the right mix in the room to trigger the debate. I will assign the cards deliberately to ensure the right voices speak up during adjudication.
      *   *Refining the "Apart" Case:* The prompt asks for "at least one case should make the criteria of unchosenness and of badness come apart."
          *   *Idea:* A student has an unchosen disadvantage (e.g., low natural aptitude) but they *like* the activity they are bad at, so they don't feel "bad off" in welfare terms, but they are behind in points. Or, they chose a risk (option luck) that resulted in a *gain*, but they are claiming compensation anyway? No, claims are for disadvantages.
