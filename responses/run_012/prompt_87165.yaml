answer: |-
  # The Allocation Protocol: A Runnable Seminar Package

  **Session Length:** 90 Minutes
  **Participants:** 18 Students (adjustable)
  **Materials:** Printed envelopes, rule sheets, point ledger, timer.
  **Theory:** Luck Egalitarianism (withheld until debrief).

  ---

  ## I. Preparation & Materials

  ### 1. The Treasury (Facilitator Only)
  *   **Total Fund:** 1,000 Points.
  *   **Constraint:** This fund is absolute. If claims exceed 1,000, claims are denied proportionally or by priority until the fund is empty. Any points remaining are destroyed (cannot be kept by individuals).
  *   **Ledger:** A visible whiteboard or spreadsheet tracking the remaining balance.

  ### 2. The Claim Cards (18 Envelopes)
  Print and seal these in envelopes. Label the outside only with a Student Number (1–18). Distribute deliberately to ensure a mix of personalities across case types.

  *   **Type A: Brute Bad Luck (5 Cards)**
      *   *Text:* "You are 150 points below the social baseline. This is due to a congenital condition present at birth. You have taken all reasonable mitigating actions. The cost to restore you to baseline is 150 points."
  *   **Type B: Option Luck / Chosen Risk (5 Cards)**
      *   *Text:* "You are 150 points below the social baseline. You were offered a Safe Option (guaranteed baseline) and a Risky Option (50% chance of +200 points, 50% chance of -150 points). You voluntarily chose the Risky Option. You lost."
  *   **Type C: Epistemic Fog / Indeterminate (4 Cards)**
      *   *Text:* "You are 150 points below the social baseline. Records show you had the same opportunities as others. However, your output was low. It is impossible to verify if this was due to hidden disadvantage or lack of effort. Only you know the truth."
  *   **Type D: Expensive Tastes / Magnitude (4 Cards)**
      *   *Text:* "You have a basic unchosen need worth 50 points. However, you have cultivated a specific preference that makes satisfying this need cost 150 points. A cheaper generic alternative exists (50 points), but you find it intolerable. You claim the full 150."
      *   *Note:* This is the **"Apart" Case**. The *need* is unchosen; the *magnitude of the disadvantage* is driven by choice. The group must decide if they track "unchosen origin" or "severity of badness."

  ### 3. The Constitutional Sheet (1 per Student)
  *   **Header:** "The Allocation Rule."
  *   **Constraint:** "The rule must be actionable. It cannot be 'be fair.' It must specify conditions under which a claim is Paid or Denied."
  *   **Space:** For the final agreed-upon text.

  ### 4. Insurance Slip (Optional, 1 per Student)
  *   **Text:** "Pre-Commitment: I pay 10 points now from my endowment to insure against Type B losses. If I draw a Type B card and lose, my claim is automatically valid regardless of the Constitutional Rule."
  *   **Cost:** 10 Points (deducted from a hypothetical starting endowment of 50 points everyone gets).

  ---

  ## II. Timeline & Facilitator Script

  ### Phase 1: Setup & Constitution (00:00 – 00:25)

  *   **00:00 – 00:05: Introduction.**
      *   *Script:* "We are designing a compensation protocol for a society. There is a Treasury of 1,000 points. Some of you will end up disadvantaged. You will write the rule that decides who gets compensated. You do not know your own position yet."
      *   *Action:* Distribute **Constitutional Sheets**. Do not distribute Envelopes yet.
  *   **00:05 – 00:20: The Constitutional Convention.**
      *   *Task:* The class must agree on **one** written rule.
      *   *Constraint:* The rule must be specific enough for the Facilitator (Banker) to apply without discretion.
      *   *Facilitator Role:* Enforce time. If they write "Help the needy," press: "How do I measure need? How do I measure fault?" Push them toward criteria like "caused by self" vs. "caused by nature."
      *   *Goal:* Get a rule that sounds principled but will break under the specific cases. (e.g., "Compensate all unchosen disadvantages.")
  *   **00:20 – 00:25: Optional Insurance Round.**
      *   *Script:* "Before you learn your fate, you may buy insurance against 'Chosen Risk' losses. Cost: 10 points. If you buy this, your claim is prioritized."
      *   *Action:* Collect slips. Record payments. This creates the **Ex Ante/Ex Post** divergence for the debrief.

  ### Phase 2: Revelation & Adjudication (00:25 – 01:00)

  *   **00:25 – 00:30: Deal Cards.**
      *   *Action:* Distribute the 18 sealed envelopes. Students open them privately.
      *   *Script:* "This is your situation. You may not show your card to others. You may only speak about it during your testimony."
  *   **00:30 – 01:00: The Tribunal.**
      *   *Structure:* Do not hear 18 testimonies individually. Group by Card Type to save time, but require individual verbal confirmation.
      *   *Round 1 (Type A - Brute Luck):* "All Type A claimants stand. State your claim amount." (5 x 150 = 750).
          *   *Facilitator:* Apply the Constitutional Rule. If the rule says "Compensate unchosen," these are Paid. Update Ledger. (Remaining: 250).
      *   *Round 2 (Type B - Option Luck):* "All Type B claimants stand. State your claim."
          *   *Tension:* The rule likely denies them (chosen risk). But they are in the same material state as Type A.
          *   *Action:* Check Insurance slips. If insured, Pay. If not, Deny.
      *   *Round 3 (Type D - Expensive Tastes):* "All Type D claimants stand."
          *   *Tension:* The "Apart" Case. The need is unchosen, the cost is chosen.
          *   *Action:* Force the group to interpret their own rule. Does "unchosen disadvantage" mean the *need* or the *cost*?
          *   *Crisis:* The fund will likely run out here. Stop payments when the 1,000 limit is hit. Deny the rest.
      *   *Round 4 (Type C - Indeterminate):* "All Type C claimants stand."
          *   *Tension:* To claim, they must testify about their effort. "I tried hard" vs. "I didn't."
          *   *Action:* If the fund is empty, this round is purely theoretical, which heightens the frustration.

  ### Phase 3: Debrief (01:00 – 01:30)

  *   **01:00 – 01:15: Internal Tension (The Theory).**
      *   Reveal the name: **Luck Egalitarianism**.
      *   Define: Justice requires compensating for **Brute Luck** (unchosen) but not **Option Luck** (chosen).
      *   Map the activity:
          *   Constitutional Stage = The Veil of Ignorance / General Principle.
          *   Type A = The Core Intuition (No one should starve due to birth).
          *   Type B = The Responsibility Constraint (You own your gambles).
          *   Type D = The "Apart" Case (Unchosen need vs. Chosen magnitude).
  *   **01:15 – 01:25: The Three Problems.**
      *   **1. The Epistemic Problem (Type C):** "Could you actually tell if Type C was lying?" We cannot reliably distinguish luck from choice.
      *   **2. The Respect Problem (Testimony):** "How did it feel to disclose your failure/illness to get money?" The inquiry is degrading. It requires humiliating confession to prove innocence.
      *   **3. The Abandonment Problem (Running out of funds/Strict Rule):** "If we deny Type B because they chose the risk, do we let them suffer?" If we stop asking (to save respect), we abandon the imprudent.
      *   **The Regress:** Ask a Type B claimant: "Why did you choose the risk?" If they say "I'm risk-tolerant," ask "Did you choose your temperament?" This threatens to collapse all choice into brute luck.
  *   **01:25 – 01:30: Limitations (What the game didn't show).**
      *   **Currency:** We used points. In reality, is disadvantage money, welfare, or capability?
      *   **Relational Egalitarianism:** The game focused on *distribution*. It did not ask: "Are we standing as equals?" A society can be equal in points but hierarchical in status. The game cannot raise this from the inside.

  ---

  ## III. Edge Cases & Troubleshooting

  ### 1. Odd Number of Students
  *   **Fix:** Keep one envelope as the "Banker's Proxy." If there are 17 students, you (the facilitator) hold the 18th card. If the fund allows, you can make a claim as a silent participant to tip the arithmetic, or discard the card to reduce total claims.
  *   **Recommendation:** Discard the card to keep the scarcity math simple.

  ### 2. Participant Refuses to Disclose
  *   **Scenario:** A Type C or D student says, "It's private. I won't say if I chose this."
  *   **Rule:** The Constitutional Rule must have a default. Standard default: **No Disclosure = No Claim.**
  *   **Facilitator Action:** Enforce this ruthlessly. "The protocol requires verification. Without testimony, the claim is void."
  *   **Debrief Point:** This is the **Respect Problem** in action. The system forces them to choose between dignity and resources.

  ### 3. Predictable Failures & Fixes

  | Failure Mode | Prediction | Intervention |
  | :--- | :--- | :--- |
  | **Vague Rule** | Students write "Compensate those who deserve it." | **Pre-empt:** During Phase 1, reject abstract nouns. Demand: "If X, then Pay." If they fail, you (Banker) interpret it strictly against the claimant to force a rewrite. |
  | **Universal Generosity** | Group tries to pay everyone, ignoring the cap. | **Hard Stop:** "The Treasury has 1,000 points. I am the Banker. I will stop processing when it hits zero. The last person in line gets nothing." |
  | **"Everything is Luck"** | Phil students argue Type B was determined by upbringing. | **Bracket:** "For this protocol, assume the card facts are the ultimate truth. Did the card say you chose the risk? Yes? Then it counts as choice." |
  | **Comic Deflation** | Disclosure becomes a joke ("I chose to buy a yacht"). | **Reframe:** "Treat the points as health or livelihood. The tone matters for the data." If it persists, use it in debrief: "Humor is a defense against the indignity of the inquiry." |

  ---

  ## IV. Limitations Statement (For Instructor Use)

  **1. The Currency Question**
  The activity treats disadvantage as **Points**. It assumes a common metric.
  *   *What you must supply:* In the debrief, ask: "Is a point of health equal to a point of income?" Luck egalitarians struggle with the **Currency of Egalitarian Justice** (Welfare vs. Resources vs. Capabilities). The game assumes resources; the theory often worries about welfare.

  **2. The Relational Challenge**
  The activity is purely **Distributive**. It asks "Who gets what?"
  *   *What you must supply:* The **Relational Egalitarian** critique (e.g., Anderson, Scheffler) is that justice is about *how people relate*, not compensating for luck. A society that investigates citizens' choices to determine worth is hierarchical (investigator vs. supplicant), even if the distribution is equal. The game *enacts* this hierarchy but cannot *critique* it without your external input.

  **3. The Regress**
  The activity stops at the first layer of choice.
  *   *What you must supply:* Point out that the "Choice" in Type B relies on unchosen preferences (risk tolerance). If we trace choice back, everything becomes brute luck. The activity stages the **tension**, but you must articulate the **metaphysical collapse**.

  ---

  ## V. Facilitator Cheat Sheet (The "Banker" Script)

  *   **When the rule is vague:** "I cannot action this. Does 'fairness' mean I pay Type B? Yes or No? Rewrite."
  *   **When the fund hits zero:** "Treasury is closed. No further claims processed." (Do this mid-sentence if necessary to drive the point home).
  *   **When a Type D claims:** "Your card says the extra cost is your taste. The rule says 'unchosen'. I am denying the differential. You get 50, not 150." (Force them to argue against you).
  *   **When a Type C claims:** "I need to know: Was this effort or luck? You must answer to be paid." (Force the humiliation).
  *   **During Debrief:** Do not defend the theory. Let the students feel the frustration. Your role is to name the feeling they just had ("That frustration you felt judging Type B? That is the **Abandonment Objection**.").
