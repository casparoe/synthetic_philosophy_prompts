      *   *The Rule:* Constraints on the rule (must be actionable).
      *   *Debrief:* Connecting the dots.
      *   *Troubleshooting:* What goes wrong.
      *   *Limitations:* What's missing.

  8.  **Refining the "Insurance" Round:**
      *   To make it fit: During the Constitutional stage, offer a one-time chance to pay 10 points to insure against "Type B" losses. This creates the ex-ante/ex-post divergence. If they pay, they are covered. If not, they are subject to the rule. This adds a layer of "did you take responsibility?"

