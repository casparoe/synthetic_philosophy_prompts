  6.  **Addressing Specific Constraints:**

      *   *Odd Number:* 18 is even. But if someone is absent? Have a "Banker's Proxy" card ready.
      *   *Refusal to Disclose:* If they don't disclose, they can't claim. Rule must state this.
      *   *Predictable Failures:* Vague rule, generosity, "everything is luck," comic disclosure.
      *   *Limitations:* Currency, Relational Egalitarianism.

  7.  **Drafting the Content - Section by Section:**

      *   *Title:* The Allocation Protocol.
      *   *Materials:* Envelopes, Cards, Rule Sheets, Point Ledger.
      *   *Timeline:* Minute-by-minute.
