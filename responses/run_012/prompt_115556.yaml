  # Marking Scheme (Total: 20)

  ### Part (a): Arithmetic and Outcome (8 Marks)
  *   **[2 marks]** Correctly sets up the indifference equations using $\ln(w)$ and the specific wealth/stakes.
  *   **[2 marks]** Identifies the tension: Incoherence raises prices, Risk Aversion lowers them.
  *   **[2 marks]** Provides plausible prices (must show $p < C$ due to risk aversion) and sums them.
  *   **[2 marks]** Correctly concludes the Classic Dutch Book fails (Sum $\le 1$).
      *   *Note:* If student calculates Sum $> 1$ but correctly identifies the utility divergence in (b), award max 6/8 for (a) but allow full recovery in (b).

  ### Part (b): Premise and Repair (7 Marks)
  *   **[3 marks]** Explicitly identifies **Linearity of Utility** (or Fair Price = Credence) as the broken premise.
      *   *Must Hit:* Vague references to "utility" without specifying linearity/fair price link get max 1/3.
  *   **[2 marks]** Proposes the **Small Stakes** repair (limiting case).
  *   **[2 marks]** Explains the cost: Reduces pragmatic force/real-world applicability.

  ### Part (c): Philosophical Implications (5 Marks)
  *   **[2 marks]** Distinguishes Epistemic Irrationality (still present) from Pragmatic Irrationality (absent/mitigated).
  *   **[3 marks]** Critiques DBA as a foundation for epistemic norms (DBA is pragmatic, coherence is epistemic).

  ### Penalties and Differentiators
  *   **Rote Recitation (-5 marks):** Students who assert "Incoherence implies Dutch Book" without addressing the utility function calculations.
  *   **Ignoring Utility (-4 marks):** Students who calculate prices as $p = C$ (0.55/0.50) ignoring the $\ln(w)$ instruction.
  *   **Harmless Incoherence (-3 marks):** Students who conclude that because the Dutch Book failed, the agent's credences are rational/acceptable.
  *   **Differentiation (15 vs 18):**
      *   A **15** student sets up the math correctly and identifies the broken premise but may treat the DBA failure as a total vindication of the agent.
      *   An **18+** student explicitly notes that EU theory is formally undefined for incoherent credences (the "category error" insight) or nuances the distinction between *pragmatic* and *epistemic* norms in part (c), recognizing that DBA was only ever a proxy for epistemic evaluation.
