answer: |-
  # Exam Question: Rational Choice and Epistemology Seminar
  **Time Allowed:** 50 Minutes
  **Total Marks:** 20

  **Question 1: The Utility-Constrained Dutch Book**

  Consider an agent evaluating whether it will rain tomorrow ($R$). She reports her credences as $C(R) = 0.55$ and $C(\neg R) = 0.50$. She is an expected utility maximiser with current wealth $w_0 = \$4$ and utility function $u(w) = \ln(w)$.

  A bookie, who knows her utility function and wealth but not her credences, offers to sell her two separate bets:
  1.  A bet that pays \$1 if $R$ occurs (cost $p_R$).
  2.  A bet that pays \$1 if $\neg R$ occurs (cost $p_{\neg R}$).

  The bookie sets each price $p$ such that the agent is exactly indifferent between purchasing the bet and keeping her current wealth.

  (a) Set up the expected utility equations for both bets. Determine the approximate prices and conclude whether the classic two-bet Dutch Book (a sure loss) succeeds against her. (8 marks)
  (b) If the classic Dutch Book fails, identify precisely which premise of the standard Dutch Book Argument has broken. Can the bookie repair the argument by adjusting the stakes? If so, what does this repair cost the argument's philosophical force? (7 marks)
  (c) Based on this case, evaluate the claim that incoherent credences are irrational. Was a Dutch Book ever the right pragmatic worry for epistemology? (5 marks)

  ***

  # Model Answer

  **(a) Prices and Dutch Book Status**
  To find the fair prices, we equate the expected utility (EU) of keeping wealth to the EU of taking the bet. The agent's status quo utility is $u(4) = \ln(4) \approx 1.386$.
  Because the agent is incoherent ($C(R) + C(\neg R) = 1.05$), we must assume she uses her stated credences as weights in her EU calculation, despite the violation of probability axioms.

  For the bet on $R$ (price $p_R$):
  $$ \ln(4) = 0.55 \ln(5 - p_R) + 0.50 \ln(4 - p_R) $$
  For the bet on $\neg R$ (price $p_{\neg R}$):
  $$ \ln(4) = 0.50 \ln(5 - p_{\neg R}) + 0.55 \ln(4 - p_{\neg R}) $$

  Solving these numerically reveals a tension: the incoherence (weights summing to $>1$) pushes prices up, while risk aversion (concave $\ln w$) pushes prices down relative to linear expectation. At low wealth ($4), risk aversion is significant. Approximate solutions yield $p_R \approx 0.48$ and $p_{\neg R} \approx 0.47$.
  The sum of prices is $0.95$. Since the agent pays \$0.95 to receive a guaranteed \$1 (as $R \lor \neg R$ is a tautology), she makes a sure *profit* of \$0.05. The classic Dutch Book fails; there is no sure loss.

  **(b) Broken Premise and Repair**
  The premise that has broken is the **Linearity of Utility** (or equivalently, that Fair Price = Credence). The standard Dutch Book Argument assumes agents value money linearly ($u(w) = w$), making the fair price of a \$1 bet exactly equal to the credence. Here, $u(w) = \ln(w)$, so fair prices diverge from credences.

  The bookie can repair the argument by reducing the stakes to infinitesimal amounts ($\epsilon$). As stakes approach zero, the utility function becomes locally linear (risk neutrality over small changes). In the limit, $p \to C$. The prices would then sum to 1.05, restoring the sure loss.
  However, this repair costs the argument its **pragmatic force**. A Dutch Book that only works for microscopic stakes is not a realistic threat of bankruptcy. It shows incoherence is a theoretical flaw, but not necessarily a practical vulnerability in real-world decision-making where stakes are non-negligible and agents are risk-averse.

  **(c) Irrationality and Epistemology**
  This case suggests we must decouple pragmatic rationality from epistemic rationality. The agent remains epistemically irrational (her credences violate the axioms of probability), but she is not pragmatically self-defeating in this context.
  The Dutch Book Argument was never the "right" worry if the goal is to prove epistemic norms. DBA is a pragmatic argument (about money loss), while probability axioms are epistemic norms (about truth/belief). This example shows that pragmatic vulnerability depends on auxiliary assumptions (like linear utility) that are not essential to epistemic rationality. We should worry about incoherence because it misrepresents the world, not merely because a bookie can exploit us, especially when risk aversion can shield us from such exploitation.

