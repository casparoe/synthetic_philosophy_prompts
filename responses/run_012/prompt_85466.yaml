answer: |-
  **Final Examination: Historical Fiction and Ethics**
  **Course:** Graduate Seminar on Historical Fiction
  **Time Allowed:** 3 Hours

  **Question 1**

  Consider the following scenario: A novelist publishes two first-person novels in the same season. The first is narrated by a woman who left no writings; in the archive, she survives only as a name in a ledger, a line in a coroner's report, and a signature on a marriage bond. The novelist supplies her with an interior life—a lover, a private heresy, a grief she never spoke aloud. The second novel is narrated by a man who left forty years of letters; in one scene of the novelist's invention, he commits an act that those letters explicitly and repeatedly disown. Neither book injures any living person in a way a court would recognise. Both become, for a generation of readers, the images by which these two people are known.

  Write an essay that addresses the following two questions. First, does the novelist owe these two dead people different things? If there is a difference, is it a difference in what is owed to the dead themselves, or merely a difference in the warrant the novelist has for the portrayal (one case being underdetermined by the record, the other contradicted by it)? Second, and more sharply: if the dead cannot be harmed, cannot consent, and cannot be asked, is the whole language of "owing them anything" a confusion—a sentimental way of talking about our duties to the living and to the record?

  You must reach a definite verdict. A non-committal survey of the difficulties will not earn full marks. In defending your position, you should consider whether counterfactual consent (what she would have wanted) can carry ethical weight, and whether the real injury might be done neither to the dead nor the living, but to the future readers who will take the novel for the life. No citations are required; argue from first principles.

  ***

  **Model Answer**

  The language of owing obligations to the dead is a category error. The dead cannot be harmed, nor can they hold rights, because rights require a subject capable of experiencing violation. Therefore, the novelist owes the dead woman and the dead man nothing directly. However, this does not grant the novelist licence to treat them identically. The difference between the two cases is not ethical regarding the subjects, but epistemic regarding the record. The obligation is not to the dead, but to the future's access to the past.

  In the case of the woman, the archive is silent. Silence is not a truth claim; it is an absence. Filling that absence with invention does not contradict evidence because there is no evidence to contradict. The novelist's invention of a lover or a heresy is an act of imagination standing alongside the ledger, not erasing it. Provided the work does not deceive the reader into believing these are facts, the "obligation" is merely to artistic coherence. Here, counterfactual consent is irrelevant; we cannot know what she would have wanted, and asserting we do is itself a fiction. The novelist owes the living reader a compelling story, and owes the archive only that the invention remains distinguishable from the record.

  The case of the man is fundamentally different. Here, the record speaks. When the novelist invents an act the letters explicitly disown, she is not filling a silence; she is shouting over a voice. This is not a harm to the man, who feels nothing. It is a violence against the truth. By creating a vivid fictional image that overrides the documentary evidence, the novelist forecloses the record. Future readers who encounter the novel will take the invention for the life. The injury is done to the future's ability to know the past. The obligation here is to the integrity of the historical trace. To contradict the record without signaling the contradiction is to corrupt the commons of human memory.

  Therefore, the phrase "what we owe the dead" must be dissolved into "what we owe the living and the future." To argue otherwise requires believing in a posthumous autonomy that survives the extinction of the self. Some might argue that we owe the dead faithfulness to their self-understanding. But self-understanding is not a property that persists after death; it is a function of consciousness. To preserve it is to preserve a ghost, not a person. The only tangible thing that persists is the record.

  Consequently, the verdict is this: The novelist owes the dead nothing. She owes the living a story that holds together, and she owes the future a record that remains legible. In the woman's case, the record is legible as silence, and invention complements it. In the man's case, the record is legible as testimony, and invention that contradicts it obscures the light. The ethical failure in the second novel is not betrayal of the man, but betrayal of the reader's trust in the distinction between history and art. We do not protect the dead from misrepresentation; we protect the living from believing misrepresentations are truth. The duty is custodial, not spiritual. If we speak of debts to the dead, we are speaking sentimentally about our duty to keep the past open for those who come after.

  ***

  **Marking Scheme**

  **Total Marks:** 20 (5 Criteria × 4 Marks)

  | Criterion | Marks | Description of Achievement | Typical Candidate Miss |
  | :--- | :---: | :--- | :--- |
  | **1. Definite Verdict** | 4 | **A:** Takes a clear stance (e.g., "obligation is to the future") and maintains it throughout.<br>**B:** Hedges ("there are arguments on both sides") or concludes ambiguously. | Candidates often refuse to choose, offering a "balanced view" that answers neither prompt question decisively. |
  | **2. Case Differentiation** | 4 | **A:** Distinguishes the cases based on *epistemic warrant* (silence vs. contradiction), not harm to the subject.<br>**B:** Distinguishes cases based on "respect" or "degree of invention" without analyzing the record. | Candidates treat both cases as identical problems of "invention" rather than distinguishing underdetermination from contradiction. |
  | **3. Ontology of Harm** | 4 | **A:** Explicitly addresses the impossibility of harming the dead (no consent/no sensation) to dismantle the "duty to dead" premise.<br>**B:** Assumes the dead can be "wronged" without explaining how a non-sentient entity suffers injury. | Candidates anthropomorphize the dead, asserting they "deserve respect" without defining how a corpse experiences disrespect. |
  | **4. The Future/Record** | 4 | **A:** Identifies the injury as foreclosing the record for future readers (epistemic harm).<br>**B:** Focuses only on contemporary living descendants or the author's reputation. | Candidates limit the "living" to immediate descendants, missing the prompt's hint about future readers taking novel for life. |
  | **5. Avoiding Cliché** | 4 | **A:** Bypasses "fidelity vs. licence" tropes; focuses on truth-trust dynamics.<br>**B:** Relies on standard "artistic freedom vs. historical accuracy" binaries. | Candidates recite the standard opposition the prompt explicitly forbade, earning no marks for critical insight. |

  **Grading Boundary Note:**
  To achieve an **A (16-20 marks)**, the essay must execute Criterion 1 and Criterion 4 simultaneously: it must declare that obligations to the dead are incoherent *because* the real duty is to the future's access to truth. A **B (10-15 marks)** essay will typically secure Criterion 2 and 5 but fail Criterion 1 (no verdict) or Criterion 3 (fails to dismantle the ontology of the dead). An essay that surveys difficulties without a verdict cannot exceed 12 marks.
