answer: |-
  # Q&A Prep Sheet: Epistemic Akrasia & Non-Commensurable Partitions

  **Audience Profile:** Majority Accuracy-First Formalists, 2 Decision Theorists, 1 Reliabilist.
  **Thesis:** Akrasia is permissible when First-Order Evidence (FOE) and Higher-Order Evidence (HOE) partition the possibility space differently (Truth vs. Reliability), rendering them non-commensurable.

  ---

  ### 1. The Accuracy Dominance Objection (Most Likely / Most Damaging)
  **Who:** The Formal Epistemologists (Accuracy-First).
  **The Objection:** "If your credence in $p$ is high (based on FOE) but your credence in the reliability of the process is low (based on HOE), your doxastic state is *improper*. You are violating the norm of minimizing expected inaccuracy. If you know your process is unreliable, assigning high credence to $p$ guarantees a worse Brier score than lowering your credence. Your view permits accuracy-dominance."

  **Two-Minute Reply:**
  "I agree that rationality requires minimizing expected inaccuracy, but that calculation presupposes a single algebra where FOE and HOE can be jointly weighted. My claim is that HOE regarding *process reliability* does not map cleanly onto the truth-value of $p$ in a way that allows for a single expected accuracy calculation without loss of information.
  When HOE targets the *mapping function* rather than the *output*, treating it as standard evidence about $p$ forces a reduction that ignores the structural uncertainty. I am not saying you should ignore the HOE; I am saying that because the partitions differ, you cannot simply conditionalize HOE onto the FOE partition without distorting the HOE. Therefore, the 'dominated' state is only dominated relative to a model that assumes commensurability, which is precisely what I am denying. Rationality requires respecting the structure of the evidence, not just maximizing a score derived from a forced joint distribution."

  **Weakest Point:** This sounds like I am rejecting accuracy norms rather than applying them. If they press that *any* evidence bearing on truth must be representable in the algebra of $p$, I have no formal model to show otherwise.

  ---

  ### 2. The Joint Algebra Problem (High Likelihood / High Damage)
  **Who:** The Formalists & Decision Theorists.
  **The Objection:** "You claim the partitions are non-commensurable. But to hold a credence in $p$ *and* a credence in the reliability of the process, you must have a doxastic state defined over a $\sigma$-algebra that includes both propositions. If you can't define a joint probability distribution over FOE and HOE, how do you prevent logical incoherence? Are you advocating for fragmented belief states?"

  **Two-Minute Reply:**
  "I am advocating for a form of fragmentation, yes, but a constrained one. Standard probability theory assumes a universal sample space, but that assumption breaks down when the higher-order proposition is about the *validity of the sample space itself*.
  Think of it like type theory: FOE operates at type $n$, HOE operates at type $n+1$. You cannot coherently define a joint distribution without risking paradox (similar to a liar paradox in probabilistic terms). My view suggests that rational agents maintain separate 'files' for object-level credences and process-level reliability metrics. Coherence is maintained *within* partitions, not necessarily *across* them, because the bridge principle required to merge them is what the HOE is undermining. To demand a joint algebra here is to demand the agent resolve the uncertainty that the HOE is warning them about."

  **Weakest Point:** "Fragmentation" is often a slur in formal epistemology (implies irrationality). If they ask for the formal rules governing the interaction between the fragments (e.g., how action is guided), I might struggle to provide a rigorous axiom.

  ---

  ### 3. The Reflection Principle Violation (Medium Likelihood / Medium Damage)
  **Who:** The Decision Theorists.
  **The Objection:** "This looks like a violation of van Fraassen's Reflection Principle. If you currently believe that your future self (who has processed the HOE) will lower their credence in $p$, you should lower your credence now. By maintaining high credence in $p$ while acknowledging the HOE, you are making yourself vulnerable to a diachronic Dutch Book."

  **Two-Minute Reply:**
  "Reflection applies when you take your future self to be a rational updater on the *same* evidence space. In these narrow cases of akrasia, the HOE suggests that the future self isn't just updating on new data, but is questioning the *reliability of the update function* itself.
  If I believe my calculator is broken, I don't defer to my future self's calculation; I bracket it. Similarly, when HOE targets the process, I cannot treat my future credence as a reliable proxy for truth. The Dutch Book argument assumes I can bet on $p$ and bet on my reliability using the same currency. If the partitions are truly non-commensurable, there is no single betting quotient that captures both, so no Dutch Book can be constructed without begging the question against the partition claim."

  **Weakest Point:** Decision theorists are very good at constructing Dutch Books for fragmented agents. If they propose a betting scenario where I must act on $p$ *using* the process, the fragmentation defense may look like ad hoc evasion.

  ---

  ### 4. The "Hope Nobody Raises" Objection (The Reductionist Attack)
  **Who:** Anyone (but likely the Reliabilist or a sharp Formalist).
  **The Objection:** "HOE *just is* FOE about the likelihood of $p$. If evidence suggests your process is unreliable, that is logically equivalent to evidence that $p$ is less likely to be true. Therefore, the partitions *are* commensurable on the proposition $p$. Your distinction is a verbal trick to avoid the normative force of HOE."

  **Two-Minute Reply:**
  "That is the standard 'Level-Bridging' assumption, but it conflates the *probability of truth* with the *warrant for believing*. Evidence that a process is unreliable lowers the *justificatory weight* of the FOE, but it does not necessarily alter the *logical probability* of $p$ given the FOE.
  For example, if I see a red wall (FOE) but learn the lighting is tricky (HOE), the FOE still supports 'red' relative to the visual experience, but the HOE blocks the inference to the world. If we reduce HOE to FOE about $p$, we lose the explanation for why the agent feels rational maintaining the belief *phenomenologically* while acknowledging the defect. The partitions differ because one concerns the *world-to-mind* direction of fit (FOE) and the other the *mind-to-process* fit (HOE). Collapsing them erases the specific epistemic tension that makes akrasia permissible."

  **Weakest Point:** This is the strongest objection. If they insist that "rational credence" is *defined* as the probability conditional on total evidence (including HOE), my view is definitionally false. I have to argue that "Total Evidence" is not a well-defined set in these cases, which is a hard sell to formalists.

  ---

  ### General Strategy Note for the Reliabilist
  The single Reliabilist in the room may object that if the process is unreliable, the belief is *unjustified*, full stop, regardless of partitions.
  **Prep:** Distinguish **Rationality** (internal coherence/accessibility) from **Justification** (external link to truth). Concede that the belief might not be *justified* in their sense, but maintain it is *rationally permissible* given the agent's access to the non-commensurable evidence. Do not fight them on "knowledge"; fight them on "rational permission."
