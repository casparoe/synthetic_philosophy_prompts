      *   **Thesis:** Epistemic akrasia (believing $p$ while believing one shouldn't believe $p$, or similar) is rationally permissible in a narrow class of cases.
      *   **Condition:** First-order evidence (FOE) concerns truth of $p$; Higher-order evidence (HOE) concerns reliability of the belief-forming process; they are not commensurable because they partition the space of possibilities differently.
      *   **Task:** Draft a Q&A prep sheet.
      *   **Requirements:**
