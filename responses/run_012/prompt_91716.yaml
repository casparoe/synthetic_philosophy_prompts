prompt: |-
  I'm a high school student writing an essay on whether Montaigne's "Of Cannibals" (Book I, Chapter 30 of the Essays) really defends cultural relativism, and I've hit a passage near the start that I can't get my footing in. Here it is, in an old English translation:

  "When King Pyrrhus invaded Italy, having viewed and considered the order of the army the Romans sent out to meet him; 'I know not,' said he, 'what kind of barbarians' (for so the Greeks called all other nations) 'these may be; but the disposition of this army that I see has nothing of barbarism in it.'—[Plutarch, Life of Pyrrhus, c. 8.]—As much said the Greeks of that which Flaminius brought into their country; and Philip, beholding from an eminence the order and distribution of the Roman camp formed in his kingdom by Publius Sulpicius Galba, spake to the same effect. By which it appears how cautious men ought to be of taking things upon trust from vulgar opinion, and that we are to judge by the eye of reason, and not from common report."

  My problem is that everyone says this essay is the founding text of cultural relativism, but this opening doesn't say that different cultures' practices are all equally valid — it says the Greeks were wrong to call the Romans barbarians because the Romans' military order looked impressive. That seems like a claim about appearances and prejudice, not about the impossibility of judging other cultures. And then Montaigne goes on to describe the Tupinambá in Brazil in ways that sound like he's praising them. I want to understand what the Pyrrhus example is actually doing, and whether the relativist reading is something Montaigne argues for or something readers have imposed on him. Please don't just tell me "Montaigne was a relativist"; I want to see the steps.

  Please structure your answer as follows:

  1. "What the passage literally says" — about 150 words. Walk me through the Pyrrhus anecdote and Montaigne's stated moral, in plain English, without assuming I already know the allusion.
  2. "The puzzle" — about 150 words. Explain precisely what the passage does and doesn't claim, and why that makes the relativist reading of the essay harder than it looks.
  3. "Two ways to connect it to the rest of the essay" — about 300 words. Give me two competing readings of how this opening relates to Montaigne's later descriptions of the Tupinambá: one on which the opening is continuous with a relativist thesis, one on which it isn't. For each, say what it makes Montaigne's central claim and what it costs.
  4. "What to look for as I read on" — about 100 words. Two or three specific things in the later parts of the essay that would tell me which reading is right.
  5. "Bottom line" — one sentence.
