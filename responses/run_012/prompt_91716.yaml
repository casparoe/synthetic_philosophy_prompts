answer: |-
  1. "What the passage literally says"
  Montaigne starts with a story about King Pyrrhus, a Greek leader invading Italy. At the time, Greeks labeled anyone non-Greek a "barbarian," implying they were uncivilized savages. However, when Pyrrhus saw the Roman army's organization, he admitted they didn't look like barbarians at all. Montaigne cites similar examples where Greek leaders were impressed by Roman military camps despite considering them foreigners. Montaigne's explicit lesson from these stories is straightforward: we should not blindly accept popular opinion ("vulgar opinion") or hearsay ("common report"). Instead, we must use our own reason and observation ("the eye of reason") to judge people. He is warning us that labels like "barbarian" are often just prejudices based on unfamiliarity, not accurate descriptions of reality. Essentially, he is telling readers to suspend their initial biases before evaluating another culture.

  2. "The puzzle"
  This creates a problem for the relativist reading. Cultural relativism suggests we cannot judge other cultures by our own standards because no standard is universal. But Montaigne isn't saying the Greeks were wrong to have standards; he's saying they were wrong about the facts. Pyrrhus judged the Romans by a standard of military order and found them excellent. Montaigne implies there is a "right" way to judge (using reason), not that judging is impossible. He isn't arguing that Roman and Greek cultures are equally valid; he's arguing the Greeks misidentified the Romans. If Montaigne believes we can use reason to correct prejudice, he might believe some practices are objectively better than others. This makes it tricky to claim he argues that all cultural practices are equally valid, which is what relativism usually means.

  3. "Two ways to connect it to the rest of the essay"
  **Reading 1: The Relativist Continuity.** In this view, the opening teaches us to suspend automatic biases regarding what counts as civilized. When Montaigne later describes the Tupinambá cannibals, he applies this same suspension to their eating habits. He argues that what Europeans call "barbarous" (cannibalism) is actually more rational and honorable than European torture practices during religious wars. The "eye of reason" reveals that every culture thinks itself central, so no single view is objectively true. The "barbarian" label is always a projection of fear. The cost of this reading is that it ignores moments where Montaigne clearly prefers certain natural laws over others, potentially flattening his moral critique into mere tolerance of anything different. It assumes Montaigne thinks truth is local. For your essay, this means focusing on his skepticism about European certainty.
  **Reading 2: The Critical Humanist.** Here, the opening teaches us to judge *accurately*, not to stop judging entirely. Montaigne uses the Tupinambá not to say all cultures are equal, but to shame Europeans specifically. He argues the Brazilians follow "natural law" better than corrupted Europeans. They aren't "relatively" good; they are objectively closer to nature's reason than the French. The Pyrrhus story shows that "barbarism" is a factual error about virtue, not just a difference of opinion. The cost is that it makes Montaigne less modern; he isn't celebrating difference for its own sake, but using difference to critique his own society's failure to meet universal standards of virtue. He may still think cannibalism is wrong, just less wrong than European betrayal. This reading suggests there is a universal "nature" we can fail to meet.

  4. "What to look for as I read on"
  First, check if Montaigne calls Tupinambá practices "virtuous" universally or just "less bad" than Europeans. Second, look at the essay's conclusion: does he condemn cannibalism as truly barbaric after critiquing Europe, or leave it ambiguous? Third, notice if he appeals to "Nature" as a universal judge. If he says Nature condemns certain acts regardless of culture, he isn't a strict relativist. If he says truth depends entirely on location, he is. Watch for whether he implies a correct way to live that the Brazilians match better than the French.

  5. "Bottom line"
  Montaigne uses the appearance of relativism not to say all cultures are equal, but to weaponize foreign examples against European arrogance.
