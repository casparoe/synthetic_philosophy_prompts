answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** [Your Name]
  **DATE:** Tuesday, [Date]
  **SUBJECT:** Recommendation on "Early Warning" Program Proposal

  **Recommendation**
  I recommend we **approve the program in principle, but restrict initial funding to a two-year pilot phase** with specific conditions regarding publication protocols and success metrics. We should defer the full eight-year, sixty-million-dollar commitment until a mid-term review validates that the models can handle reflexive feedback loops.

  **Rationale**
  The Program Officer is correct that dismissing this effort based on abstract philosophical doctrines would be unproductive. However, the natural-science analogies underpinning this proposal require rigorous stress-testing before we commit full funding. My concerns fall into two categories: those that would apply to prophecy (which the proposal disavows) and those that apply even to modest probabilistic claims (which are the core risk).

  **1. Prophecy vs. Probability**
  The proposal explicitly disavows unconditional prophecy, offering instead conditional probability estimates. On this ground, the philosophical objection that "history has no laws" is less damaging than it first appears. We do not need immutable laws of history to identify risk factors; we only need stable correlations. If the model claims only that "conditions X and Y increase the probability of collapse," it survives the charge of historicism.

  However, the second objection—reflexivity—bites hard even on probabilistic claims. In earthquake hazard assessment, a map showing high risk does not cause the fault to slip, nor does it prevent it. The ground is indifferent to our maps. In political systems, the "ground" reads the map. If we publish a high probability of state collapse for a specific country, we may trigger capital flight or preemptive repression that either causes the collapse (self-fulfilling) or averts it (self-defeating). In both cases, the forecast is technically "wrong" regarding the baseline scenario, rendering accuracy metrics meaningless. The Program Officer's comparison to weather prediction fails here: a hurricane does not change its track because it was forecasted to do so.

  **2. Evaluation of Analogies**
  The proposal leans on four analogies. Here is my assessment of their aptness:
  *   **Hurricane/Weather:** Weak. Lacks human agency. Useful for computational methods, not for validity of the forecast itself.
  *   **Seasonal Climate:** Moderate. Better for long-term trends than specific events, but still lacks strategic agency.
  *   **Epidemics:** Strongest natural-science parallel. Disease models account for behavioral change (vaccination, distancing). The proposal must adopt similar "intervention-aware" modeling rather than treating political violence as a pathogen moving through a passive host.
  *   **Seismic Hazard (My Field):** I must correct the record: this analogy is misleadingly optimistic. Seismic maps work precisely because they *do not* predict when a fault will break; they predict the physical shaking *if* it does. This proposal promises five-to-ten-year lead times for specific events (collapse/violence). It is attempting to do what seismologists explicitly say is impossible: predict the timing of the rupture. We should not fund a program expecting to succeed where physics has stalled, unless the mechanism of prediction is fundamentally different.

  **3. The Strongest Case for Funding**
  Despite these risks, there is a compelling case for proceeding.
  *   **The Cost of Declining:** If we do not fund rigorous, transparent modeling, this work will be done by opaque actors (intelligence agencies, hedge funds) without public accountability or ethical constraints.
  *   **Infrastructure Value:** Even if the predictive accuracy remains low, the program builds a vital data infrastructure for tracking state fragility. The process of quantifying assumptions forces discipline on qualitative analysis.
  *   **Utility over Accuracy:** A model that fails to predict a crisis but successfully triggers a preventative intervention is a policy success, even if it is a statistical failure.

  **Proposed Conditions for Pilot Phase**
  To address the reflexivity and analogy gaps, I propose the following conditions for the initial two-year tranche:

  1.  **Publication Protocol:** Forecasts for specific countries must undergo a "reflexivity review" before release. We need a mechanism to assess whether publishing a specific probability creates an unacceptable risk of triggering the outcome.
  2.  **Metric Redefinition:** Success cannot be measured solely by Brier scores or prediction accuracy. We must measure *decision utility*. Did the forecast allow a partner to act earlier than they otherwise would have?
  3.  **Scope Adjustment:** The team should model "hazard" (long-term structural vulnerability) separately from "forecast" (short-term event probability). We should prioritize the former, where the seismic analogy actually holds, and treat the latter with extreme caution.

  **Conclusion**
  We should not kill this program because philosophy says history is unpredictable. We should fund it to test *how* unpredictable it is, while protecting ourselves from the unique risks of publishing forecasts about human agents. A two-year pilot allows us to validate the reflexivity protocols before committing the full sixty million dollars.

  I am prepared to move this motion on Thursday.
