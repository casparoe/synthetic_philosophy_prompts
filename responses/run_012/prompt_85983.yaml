  *(Self-Correction on the Seismic Analogy)*: I need to be careful. The prompt says "I suspect it is a much weaker model here than the proposal assumes." I should agree with this suspicion. Seismic hazard maps don't predict *when*. The proposal *does* predict *when* (5-10 year lead time). That is the critical disanalogy. I will emphasize this.

