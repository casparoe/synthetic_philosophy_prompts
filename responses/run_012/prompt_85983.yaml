      *   *Check:* Time frame. The vote is Thursday. The recommendation should be for the vote, but the *program* time frame needs adjustment. Suggest a 2-year pilot before full 8-year commitment.

  7.  **Final Polish:**
      *   Ensure the distinction between "prophecy" (unconditional) and "probabilistic" (conditional) is addressed. The PO says it's probabilistic. I need to argue that even probabilistic forecasts in human systems suffer from reflexivity in a way weather does not.
