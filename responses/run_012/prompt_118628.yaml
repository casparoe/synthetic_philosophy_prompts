  I am a PhD student in philosophy working on a seminar paper about decision theory under evidential correlation, and I have been arguing with a colleague who thinks causal decision theory is obviously correct because an agent cannot cause the past. Please adopt the role of a philosopher of decision theory with expertise in causal, evidential, and updateless or functional decision theories, and think carefully before answering. I would like you to begin by brainstorming three or four candidate cases, then choose the one that best illustrates the conceptual issue, and present it in detail. The issue is the one raised by counterfactual mugging and XOR blackmail: cases in which an agent's choice is evidentially correlated with a payoff-relevant fact that the choice does not causally influence, so that causal and evidential reasoning pull apart. At bottom, the conceptual issue is whether an agent's own choice can be a reason to change her credences about a fact that is independent of her choice. I am especially interested in a variant where the correlation is generated not by a predictor's advance knowledge or by a blackmailer's conditional threat, but by the logical structure of the agent's own deliberation. Suppose the payoff-relevant fact is a mathematical or logical fact, and the agent's choice is the output of a deterministic reasoning procedure that is itself logically related to that fact; then the choice may be evidence about the fact even though it does not cause it. I keep worrying that this either collapses into a common-cause explanation, or into a self-fulfilling prophecy, or into a case where the agent should simply conditionalize on her choice and be done.

