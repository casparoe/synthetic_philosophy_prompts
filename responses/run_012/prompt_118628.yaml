answer: |-
  ### Brainstorming Candidate Cases

  To address your specific constraints—avoiding predictors, blackmailers, or standard common-cause structures, and focusing on logical correlations generated by deliberation itself—here are four candidate scenarios:

  1.  **The Proof-Bounded Bet:** An agent must bet on the consistency of a formal system (e.g., ZFC). The agent's decision algorithm is designed to output "Consistent" if and only if it finds a proof of consistency within a certain step limit. The payoff depends on the actual consistency. The correlation arises because the agent's output is logically constrained by the mathematical fact, even if the agent cannot compute the fact directly.
  2.  **The Algorithmic Twin:** Two agents run identical source code in isolated rooms. A payoff-relevant fact is determined by a logical proposition (e.g., the parity of a specific digit of $\pi$). Agent 1's payoff depends on the fact; Agent 2's payoff depends on Agent 1's choice. The correlation between Agent 1's choice and the fact is logical (via the code), not causal. (This risks collapsing into a standard Prisoner's Dilemma variant).
  3.  **The Retro-Logical Calculation:** An agent must output a digit. The payoff depends on a mathematical fact that was "fixed" eternally. The agent's algorithm is known to be a sound calculator of that fact, but the agent is logically uncertain of the output until the computation completes. The choice is the completion of the computation.
  4.  **The Logical Determinant:** A single agent faces a fixed mathematical fact (unknown to them). Their decision algorithm is logically isomorphic to that fact (e.g., the algorithm outputs "Yes" iff the fact is True). The agent is logically uncertain about both the fact and their own output. The correlation is not due to a predictor simulating the agent, but because the agent *is* the simulation of the fact.

  ### Selected Case: The Logical Determinant

  I recommend **The Logical Determinant**. It isolates the issue of logical correlation without the metaphysical baggage of predictors (Omega) or the interpersonal complexity of Twin scenarios. It forces the agent to treat their own deliberation as a logical variable that is correlated with the world.

  #### The Scenario

  **The Fact ($F$):** Consider the $10^{100}$-th decimal digit of $\pi$. This digit is either Even ($E$) or Odd ($O$). This is a fixed, necessary mathematical truth. However, computing this digit requires more computational resources than the agent possesses at the moment of decision. The agent assigns a credence of $0.5$ to $E$ and $0.5$ to $O$ (representing logical uncertainty).

  **The Agent:** You are a deterministic algorithm. You know your own source code. Your source code is designed such that it outputs action **$A_{Yes}$** if and only if the $10^{100}$-th digit of $\pi$ is Even, and **$A_{No}$** if and only if it is Odd. (For instance, your code contains the subroutine to calculate the digit, but you are currently in a state of logical uncertainty regarding the output of that subroutine).

  **The Choice:** You must choose between pressing the **Yes-Button** ($A_{Yes}$) or the **No-Button** ($A_{No}$).

  **The Payoff:**
  *   If you press **Yes-Button**: You receive \$1,000,000 if $F$ is Even ($E$). You receive \$0 if $F$ is Odd ($O$).
  *   If you press **No-Button**: You receive \$500,000 regardless of $F$.

  **The Knowledge:** You know with certainty that your code is sound: Output($A_{Yes}$) $\iff$ $E$. Output($A_{No}$) $\iff$ $O$. You also know that your choice *just is* the output of this code. However, you have not yet completed the computation, so you are logically uncertain about what you will choose.

  #### The Decision Theoretic Analysis

  Here, Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) diverge sharply.

  **1. Causal Decision Theory (CDT)**
  CDT evaluates acts based on their causal consequences. It uses the $do$-operator.
  *   **Causal Structure:** The mathematical fact $F$ causally influences nothing in the present (it is an abstract object). Your choice causally influences the payoff, but *does not causally influence* $F$. The correlation between your choice and $F$ is non-causal (it is logical).
  *   **Calculation:** CDT screens off the evidential correlation. It asks: "If I were to *force* myself to press Yes, does that change the probability of $E$?"
      *   $P(E | do(A_{Yes})) = P(E) = 0.5$ (Since choice cannot cause the past/math).
      *   $EU_{CDT}(A_{Yes}) = 0.5 \times \$1,000,000 + 0.5 \times \$0 = \$500,000$.
      *   $EU_{CDT}(A_{No}) = \$500,000$ (Guaranteed).
  *   **Verdict:** CDT is indifferent (or might prefer $A_{No}$ due to risk aversion/variance). It sees no causal leverage over the million dollars.

  **2. Evidential Decision Theory (EDT)**
  EDT evaluates acts based on the news they bring. It uses conditional probability.
  *   **Evidential Structure:** Your choice is the output of a sound algorithm linked to $F$. Observing your choice provides definitive evidence about $F$.
  *   **Calculation:** EDT asks: "Given that I press Yes, what is the probability of $E$?"
      *   Since Output($A_{Yes}$) $\iff$ $E$, then $P(E | A_{Yes}) = 1.0$.
      *   $EU_{EDT}(A_{Yes}) = 1.0 \times \$1,000,000 + 0.0 \times \$0 = \$1,000,000$.
      *   $EU_{EDT}(A_{No}) = \$500,000$.
  *   **Verdict:** EDT strictly requires pressing **Yes-Button**.

  **3. The Divergence**
  CDT says: "You can't make $\pi$ even by pressing a button. Take the guaranteed half-million."
  EDT says: "If you press the button, you *are* the kind of agent that only presses when $\pi$ is even. You will get the million."

  #### Why Standard Objections Fail

  **1. The "Common Cause" Dissolution**
  In standard Newcomb problems, a critic might argue that the Predictor is a common cause of the Box Content and your Choice, and that conditioning on the choice is spurious.
  In *The Logical Determinant*, there is no third-party common cause. The correlation is **logical identity**. The fact $F$ determines the output of your code, and your choice *is* the output of your code. To claim the correlation is spurious is to claim that your choice is not actually the output of your code, which contradicts the setup. The correlation is as tight as logic allows. CDT cannot dismiss this as "spurious correlation" without denying the agent's knowledge of their own source code.

  **2. The "Conditionalization" Objection**
  A critic might say: "Simply conditionalize on the fact that you have already chosen."
  The issue arises *during* deliberation. The agent does not yet know their choice. They are using decision theory to *determine* the choice. If they treat their choice as a fixed premise before making it, deliberation halts. The question is: *What credence should I assign to $F$ conditional on the hypothesis that I choose $A_{Yes}$?*
  CDT says: Keep $P(F)$ at the prior (0.5).
  EDT says: Update $P(F)$ to the posterior (1.0).
  The disagreement is about whether deliberation involves simulating an intervention (CDT) or simulating an observation (EDT).

  #### Conceptual Significance

  This case isolates the core tension between CDT and EDT without the "spooky" elements of prediction or backward causation that often distract the debate.

  **1. Causation vs. Logical Entailment**
  Your colleague argues CDT is correct because "an agent cannot cause the past." In *The Logical Determinant*, the agent agrees they cannot *causally* influence the digit of $\pi$. However, the case demonstrates that **causal influence is not the only relation that matters for expected utility.** Logical entailment also creates a dependency between the agent's will and the payoff. If rationality is about winning (maximizing utility), ignoring logical dependencies leads to leaving money on the table.

  **2. Choice as a Premise**
  The case forces us to ask: **Should an agent treat their own choice as a premise in deliberation?**
  *   If **Yes (EDT/Functional):** I reason, "If I choose Yes, then logically $F$ must be Even, so I win." This treats the agent as a logical function whose output is correlated with the world.
  *   If **No (CDT):** I reason, "I am free to intervene on my choice independently of $F$." This treats the agent as a causal ghost that can break logical links during deliberation.
  *   **The Issue:** CDT requires the agent to imagine a counterfactual world where they choose $A_{Yes}$ *even though* their code would output $A_{No}$ (if $F$ were Odd). This requires imagining a logical contradiction (a "miracle" in logical space). EDT requires the agent to respect logical consistency.

  **3. Comparison to Counterfactual Mugging/XOR Blackmail**
  *   **Counterfactual Mugging:** Relies on a Predictor who simulates you. The correlation is causal (Predictor $\to$ Box) and counterfactual (If you *would have* paid, Predictor *would have* put money). Critics argue this relies on the metaphysics of prediction.
  *   **The Logical Determinant:** Removes the Predictor. The correlation is internal to the agent's logic. It shows that the problem isn't "Omega's magic"; the problem is **how bounded agents reason about their own logical output.**
  *   **What it adds:** It shifts the debate from "Can the future affect the past?" to "Can an agent be logically uncertain about their own decision?" If you accept logical uncertainty (which you must for any non-trivial math), CDT's insistence on screening off logical correlations looks like an error in handling self-reference, not a virtue of causal rigor.

  #### Controversial Assumptions

  To use this in your seminar, you must flag the following assumptions, as a sharp CDT proponent will attack them:

  1.  **Logical Uncertainty:** The case assumes it is rational for an agent to assign probabilities (0.5) to logical truths. A proponent of logical omniscience would argue the agent *should* know the digit or the code's output, collapsing the problem. You must argue that bounded rationality necessitates logical uncertainty.
  2.  **Knowability of the Link:** The agent must know "Output($A_{Yes}$) $\iff$ $E$". If the agent knows this, why don't they know $E$? The answer is that they know the *conditional* link without knowing the *antecedent* (the output). This distinction is subtle but crucial.
  3.  **The Status of "Choice":** CDT assumes the agent can "intervene" on their choice ($do(A_{Yes})$) independently of the code that produces it. In a deterministic agent, this "intervention" is a logical impossibility. CDT relies on a notion of free will that may be incompatible with the agent being a known deterministic algorithm.

  ### Conclusion for Your Paper

  *The Logical Determinant* demonstrates that the disagreement between CDT and EDT is not merely about time travel or predictors. It is about whether rational deliberation should respect **logical correlations between the agent's algorithm and the world.**

  If your colleague insists CDT is "obviously correct" because choice cannot cause the past, you can reply: "Choice cannot cause the past, but choice can be **logically equivalent** to the past. If I am a deterministic reasoner, my choice is evidence of the logical facts that determine me. Ignoring this evidence makes me poorer in logical space, just as ignoring causal evidence makes me poorer in physical space. The question is not whether I can change the past, but whether I should reason as if my choice is an intervention or an observation."

  This moves the debate from the metaphysics of causation to the epistemology of self-knowledge and logical uncertainty, which is the fertile ground where modern decision theory (FDT/UDT) is currently working.
