  9.  (Self-Correction on "Human in the Loop"): If the argument is that *nobody* could foresee it, a human in the loop *also* couldn't foresee it. So the human couldn't avoid it either. Therefore, under (1), the human isn't to blame. If the thesis relies on the human being *blameworthy* to ensure safety, the thesis is in trouble. If the thesis relies on the human being *answerable* (liable), the thesis survives by dropping (5). I need to make sure this distinction is clear. The "Human in the Loop" might need to be redefined as a "Responsible Person" rather than an "Emergency Override."

