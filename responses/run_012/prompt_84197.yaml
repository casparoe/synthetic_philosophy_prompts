  2.  **Deconstruct the Supervisor's Argument:**
      *   (1) Moral blame requires avoidability (capacity + opportunity to do otherwise). *Principle of Alternative Possibilities.*
      *   (2) The specific death resulted from an unanticipated choice by the AV in unanticipated circumstances.
      *   (3) Therefore, no human could have avoided that death.
      *   (4) Therefore, no human is to blame.
      *   (5) Blame is the *only* justification for answerability (paying, punishment, naming).
