  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just argue Utilitarianism. The user wants the *Side-Constraint* aspect tested.
      *   *Focus:* The tension between "Graded Capacity" and "Side-Constraint." Side-constraints are usually binary (you can't violate them 10%). If capacity is graded, does the constraint weaken? If yes, it's not a side-constraint, it's a weight. If no, where is the cutoff?
      *   *Precautionary Logic:* The user says "downside of being wrong in permissive direction is severe." I need to challenge whether the downside of being wrong in the *restrictive* direction (e.g., forcing vegetarianism on humans who need meat, or ignoring plant welfare if it exists) is actually negligible.
      *   *Marginal Cases:* Be precise. The user asks if it collapses into species-typicality. I need to show that *without* species-typicality, the view fails to protect marginal humans. *With* it, the view fails to be non-speciesist.

