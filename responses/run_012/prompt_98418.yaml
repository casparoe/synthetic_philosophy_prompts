      *   Make sure to answer the specific question: "Does the precautionary step do independent work?"

  7.  **Final Review against User Prompt:**
      *   *Map exposure?* Yes.
      *   *Sort Fatal to Awkward?* Yes.
      *   *Concessions vs. Criticisms?* Yes.
      *   *Marginal Cases/Species-typicality?* Yes.
      *   *Precaution independent work?* Yes.
      *   *Over-generalization?* Yes.
      *   *Unfalsifiability?* Yes.
      *   *Side-constraint wrong shape?* Yes (Priority 1).
      *   *Precaution doesn't stop at vegetarianism?* Yes (Priority 2).

  8.  (Mental Check on "Fatal" vs "Awkward"):
      *   *Fatal:* Things that force abandonment of the core thesis.
      *   *Awkward:* Things that require patching or nuance but don't destroy the view.
      *   *The "Wrong Shape" argument:* If successful, it forces a move to utilitarianism or a different deontological ground. That's fatal to *this* specific formulation.
