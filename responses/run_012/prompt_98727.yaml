answer: |-
  **Title:** Shapes of Contribution: Reframing the Inefficacy Objection in Collective Harm

  **1. Statement of the Question**

  The central problem of collective harm is the inefficacy objection: if an individual act (buying a burger, taking a flight, casting a vote) makes no causal difference to the harmful outcome, can it be morally obligatory to refrain from it? The prevailing debate treats causal efficacy as a binary property. An act either triggers a harm or it does not; if it does not, proponents of obligation must argue that duties survive inefficacy through complicity, integrity, or expected utility.

  This prospectus proposes that this binary framing obscures the relevant moral topology. The question this dissertation answers is: **Are there pairs of acts with identical expected marginal harm but distinct counterfactual contribution profiles, such that an agent is morally obliged to perform one and not the other?**

  More specifically, I seek to determine whether the *shape* of the causal relationship between an individual act and a collective outcome carries independent normative weight. I hypothesize that the answer is affirmative. I will argue that a "Sloped" profile (where harm scales continuously with action, even if imperceptibly) generates different deontic constraints than a "Flat" profile (where harm is invariant across nearby counterfactuals), even when the expected value of the harm is mathematically equivalent. Resolving this question determines whether the inefficacy objection succeeds merely because we have misidentified the causal structure of the cases to which it is applied.

  **2. The Gap in Existing Arguments**

  Current responses to the inefficacy objection fall into three broad positions, none of which adequately address the granularity of causal contribution.

  The first position, **Causal Individualism**, holds that moral obligation requires causal efficacy. If an act does not change the outcome, there is no obligation to refrain. This view relies on the binary assumption: if the world is the same with or without the act, the agent is off the hook. This position fails to distinguish between a world that is the same because the causal mechanism is insensitive to the act (Flat) and a world that is the same because the change is below the threshold of perception but causally real (Imperceptibly Sloped). By treating both as "no difference," this view potentially absolves agents in cases where they are actually exerting continuous causal pressure.

  The second position, **Expected Utility Maximization**, attempts to bypass the binary by multiplying the magnitude of the harm by the probability of the act making a difference. If a single burger purchase has a 1 in 10,000 chance of triggering an order that causes a chicken's death, the expected harm is non-zero. While this preserves obligation, it collapses the *structure* of the contribution into a single scalar value. It treats a 1% chance of a massive disaster as morally equivalent to a 100% chance of a 1% disaster. This aggregation obscures the agent's relationship to the harm. It cannot account for the intuition that certainty of a small contribution feels normatively distinct from uncertainty of a large one, even if the math aligns.

  The third position, **Non-Consequentialist Participation**, argues that obligations arise from participating in a wrongful project rather than causing specific outcomes. While this avoids the efficacy trap, it often retreats too far from causal reality, making obligation depend entirely on group membership or intention. It lacks a mechanism for explaining why some forms of participation (those with Sloped profiles) feel more urgent than others (those with Flat profiles), independent of the agent's psychological state.

  All three positions leave the question open because they accept the premise that efficacy is binary or that expected value is the sole metric of moral relevance. None analyze the *counterfactual contribution profile* as a distinct variable. They ask "Did it make a difference?" or "What is the expected value?" rather than "How does the harm vary as a function of my action across nearby possible worlds?" This dissertation fills that gap by arguing that the shape of this function is itself a source of normative reasons.

  **3. Methodology and Operational Plan**

  The project will be executed over four months, divided into four stages. The method is conceptual analysis supported by constructed thought experiments, rather than empirical study.

  **Stage 1: Taxonomy Refinement (Weeks 1-4)**
  I will rigorously define the four contribution profiles to prevent conceptual slippage.
  *   *Flat:* The outcome variable $O$ remains constant for all variations of the agent's act $A$ within a relevant range. $\Delta O / \Delta A = 0$.
  *   *Sloped:* $O$ varies continuously with $A$. The slope may be shallow (imperceptible), but the derivative is non-zero.
  *   *Cliff:* $O$ is constant until a threshold $T$ is reached, at which point $O$ jumps discontinuously.
  *   *Endogenous:* The value of $\Delta O / \Delta A$ is dependent on the acts of other agents, specifically their reaction to $A$.

  The deliverable for this stage is a formalized set of definitions that distinguishes these profiles based on causal topology, not empirical probability.

  **Stage 2: The Scaling Test and Case Construction (Weeks 5-8)**
  To distinguish these profiles operationally without relying on empirical data, I will employ the **Scaling Test**. For any given case (e.g., the burger, the vote), I will ask: *If we conceptually scale the agent's contribution up or down by a factor $k$, does the expected harm scale by $k$?*
  *   In a **Sloped** case, scaling the act (e.g., buying 100 burgers instead of 1) should scale the harm proportionally, even if the single act was supposedly "inefficacious."
  *   In a **Flat** case, scaling the act within the local range yields no change in harm.
  *   In a **Cliff** case, scaling the act may suddenly trigger the threshold.

  I will construct paired cases where Expected Value (EV) is held constant but the Profile Shape differs. For example, I will contrast a "Lottery Cliff" (1% chance of causing 100 units of harm) with a "Certain Slope" (100% chance of causing 1 unit of harm, repeated). Standard EV theory treats these as equivalent. I will argue that the Certain Slope generates a stronger obligation because the agent has guaranteed causal leverage, whereas the Lottery Cliff renders the agent causally inert in 99% of nearby worlds.

  **Stage 3: Normative Testing (Weeks 9-12)**
  I will test the hypothesis that Profile Shape determines obligation. I will apply the taxonomy to the canonical cases.
  *   *Meat Consumption:* Often argued as Flat (one purchase doesn't change orders). I will argue it is Sloped (purchases aggregate to orders continuously over time).
  *   *Voting:* Often argued as Cliff (only matters if it breaks a tie). I will analyze whether the expressive value or the probabilistic influence creates an Endogenous profile.
  *   *Carbon Emissions:* Often argued as Flat (one ton doesn't change climate outcomes). I will argue this is a Sloped profile with an imperceptible gradient.

  The goal is to show that when we correctly identify the profile, the inefficacy objection loses its grip in Sloped cases, even if it holds in Flat cases.

  **Stage 4: Objection Handling and Synthesis (Weeks 13-16)**
  I will anticipate the primary objection: that this taxonomy is merely Expected Value reasoning in disguise. I must demonstrate that Profile Shape is not just a way of calculating probability, but a description of the *causal mechanism* that agents have reason to value independently of outcomes. I will also address the charge that "imperceptible slopes" are epistemically inaccessible to agents.

  **Preventing Collapse into Expected Value**
  A critical methodological risk is that the taxonomy collapses into Expected Value (EV) reasoning. If a Sloped profile is just a probability distribution over small harms, haven't I simply reinvented EV?
  To prevent this, I will distinguish *causal structure* from *valuative aggregation*. EV aggregates magnitude and probability into a single number. The Profile Shape describes the *continuity* of the causal link. My argument will be that agents have a duty to maintain *causal leverage*. In a Sloped case, the agent knows their act is a necessary part of a sufficient set for the harm, continuously. In a Cliff/Probability case, the agent knows their act is causally inert in most nearby worlds. The moral difference lies in the *nature of the agency*, not the *value of the outcome*. I will argue that moral responsibility tracks causal participation more closely than it tracks probabilistic risk. The Scaling Test is the tool to prove this: if scaling the act scales the harm deterministically (Slope), the agent is causally implicated in a way they are not when scaling the act merely scales the *probability* of a disjointed event (Cliff).

  **4. Why a Conceptual Taxonomy?**

  One might object that this problem should be solved by empirical psychology (how agents *feel* about responsibility) or by a general theory of collective obligation (a top-down principle).

  Appealing to psychology is insufficient because the inefficacy objection is a normative claim, not a descriptive one. Even if agents *feel* more responsible in Sloped cases, that does not prove they *are* more responsible. My project is not to explain moral sentiments but to justify moral reasons. The taxonomy provides the ontological ground for those reasons. It identifies a real feature of the world (the shape of the counterfactual landscape) that can serve as a truth-maker for normative claims.

  Appealing to a general theory of collective obligation is premature. The debate is currently stalled on the specific mechanics of individual contribution. Proposing a grand theory of collective duty without first resolving whether individual acts make a difference is building on sand. A conceptual taxonomy of contribution profiles is the necessary groundwork. It allows us to sort cases before applying high-level principles. It does the work because it dissolves the false dichotomy (difference vs. no difference) that causes the stalemate. By showing that "no difference" is actually "continuous small difference" in many canonical cases, the taxonomy removes the need for a complex theory of obligation-without-efficacy. It restores efficacy, properly understood.

  **5. The Distinct Problem of Redundancy**

  I must distinguish inefficacy from redundancy, as the literature often conflates them.
  *   **Inefficacy** claims that my act does not change the outcome (the outcome would be the same without it).
  *   **Redundancy** claims that my act *would* change the outcome, but someone else would have produced the same outcome anyway (overdetermination).

  In the proposed taxonomy, Redundancy is a specific subtype of the **Cliff** or **Flat** profile, depending on the timing. If I vote and you vote, and only one vote was needed to win, my vote is redundant. This looks like a Cliff profile where the threshold was already crossed. However, redundancy is distinct because it involves *other agents* as the cause of the threshold crossing, whereas pure inefficacy involves the *nature of the harm mechanism* (e.g., climate thresholds).

  I will treat redundancy separately to ensure the taxonomy remains robust. In redundancy cases, the contribution profile is technically Sloped or Cliff relative to the *total* votes, but Flat relative to *my* votes once the threshold is passed by others. The dissertation will argue that redundancy does not negate obligation in the way inefficacy is supposed to, because the *type* of contribution (joining a sufficient set) remains, even if the *marginal impact* is zero. This distinction prevents the taxonomy from being undermined by overdetermination cases. I will argue that redundancy is a problem of *attribution*, whereas inefficacy is a problem of *causation*. The taxonomy addresses causation; attribution requires a separate, subsequent account. By isolating redundancy, I protect the core argument about contribution profiles from the complications of overdetermination.

  **6. Significance of the Question**

  Settling this question changes how individual responsibility is described in the context of global challenges. Currently, moral advice regarding collective harm is bifurcated. Agents are told either to "calculate the odds" (which usually suggests individual acts don't matter) or to "keep your hands clean" (which ignores the causal reality).

  If my hypothesis is correct, the advice changes to: **"Analyze the causal topology."**
  This shifts the burden of proof. Instead of the defender of obligation proving that a single act triggers a harm, the skeptic must prove that the contribution profile is truly Flat. In many cases (carbon, meat), this will be empirically and conceptually difficult, as continuous systems rarely exhibit true Flatness at the micro-level.

  Furthermore, it restores a sense of agency. The binary view renders the individual powerless unless they are the "tipping point" agent. The Profile view recognizes that individuals are constantly exerting pressure on outcomes, even if that pressure is distributed. It validates the intuition that "doing my part" matters even when "making a difference" is ambiguous. It provides a vocabulary for distinguishing between acts that are causally impotent (Flat) and acts that are causally potent but collectively diluted (Sloped). This distinction is vital for policy and ethics: we should prioritize changing Sloped behaviors (where individual action has guaranteed leverage) over Cliff behaviors (where individual action is lottery-dependent), even if the aggregate risks are similar.

  **7. Completed Result and Failure Conditions**

  **A Completed Result:**
  A successful dissertation will produce a defended four-part taxonomy of contribution profiles and a proof-of-concept argument that Profile Shape is a normative variable. It will demonstrate at least one pair of cases where Expected Value is equal, Profile Shape differs, and moral intuition (justified by argument) dictates different obligations. It will successfully apply this to at least two canonical cases (e.g., meat and carbon), reclassifying them from "inefficacious" to "inefficiently sloped." The conclusion will offer a revised principle of individual obligation: *Agents are obliged to refrain from acts with non-Flat contribution profiles regarding harmful outcomes, proportional to the slope of the contribution, independent of threshold probabilities.*

  **Failure Conditions:**
  The project fails if:
  1.  **The Collapse Objection holds:** If I cannot demonstrate that Profile Shape is distinct from Expected Value reasoning. If the "Slope" is just a way of describing a probability distribution, the taxonomy adds no new normative power.
  2.  **Epistemic Inaccessibility:** If it turns out that agents cannot distinguish between Flat and Imperceptibly Sloped profiles in real-time. If the distinction requires god-like knowledge of supply chains or climate models, it cannot ground obligation for ordinary agents.
  3.  **Normative Irrelevance:** If I show that the shapes differ, but cannot show that this difference *matters* morally. If obligations track only outcomes (EV) and not causal structures, the taxonomy is descriptive but ethically inert.

  **8. Scope and Feasibility Assessment**

  The four-month timeline is tight but feasible if the scope is strictly managed.

  **The Primary Risk: The Endogenous Profile.**
  The "Endogenous" category (where my act matters because it influences others) is the most dangerous to the timeline. This opens the door into game theory, signaling norms, and social psychology. It risks expanding the dissertation from a meta-ethical analysis of contribution into a sociological theory of coordination.
  *Mitigation:* I will bracket the Endogenous profile. I will treat it as a distinct category to acknowledge its existence, but I will not attempt to fully model the social feedback loops. The core argument rests on the distinction between Flat and Sloped profiles in *non-strategic* contexts. If I can prove the moral relevance of the Slope in isolation, the Endogenous cases can be left for future work. I will explicitly state in the introduction that the project focuses on *causal* profiles, treating social response as a secondary variable.

  **The Secondary Risk: Empirical Claims.**
  I must avoid making empirical claims about supply chains or climate science that require data collection.
  *Mitigation:* I will use *conceptual* models of these systems. I will argue that *if* the meat industry operates on continuous ordering (Sloped), then the obligation holds. I do not need to prove the industry *does* operate this way, only that it is the plausible model and that the moral logic follows from that model. This keeps the project within philosophy.

  **The Tertiary Risk: The Redundancy Distraction.**
  As noted, redundancy is a deep rabbit hole.
  *Mitigation:* I will dedicate one specific section to distinguishing it, then exclude overdetermination cases from the primary testing phase. I will focus on cases where the agent is the *only* variable changing, to isolate the contribution profile.

  **Feasibility Conclusion:**
  The project is feasible because it relies on conceptual clarification rather than new data. The "Scaling Test" provides a clear, repeatable method for analyzing cases without getting bogged down in empirical uncertainty. By narrowing the focus to the Flat vs. Sloped distinction and bracketing the complex game-theoretic elements of the Endogenous profile, I can deliver a determinate answer to the research question within the timeframe. The result will be a refined conceptual toolkit that allows the committee to see the inefficacy objection not as a wall, but as a map of different causal terrains.
