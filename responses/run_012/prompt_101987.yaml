answer: |-
  The paper felt heavier than a single sheet of glossy stock should. Elena held it between two fingers, the way she might handle a contaminated slide, while the hum of the belief chronometer settled into the background noise of the clinic. The room was sterile, white, and quiet, save for the rhythmic breathing of the machine behind the glass partition.

  Dr. Aris sat across from her, hands folded on the desk. He looked expectant, not like a doctor waiting for a diagnosis, but like a mathematician waiting for a proof to be acknowledged.

  Point four on the printout was highlighted in soft yellow. Proposition: Subject believes Brother (Mark V.) committed gross negligence resulting in patient harm. Timeframe: Six years, four months. Credence: 0.92.

  Ninety-two percent.

  I don't understand, Elena said. Her voice sounded thin in the acoustic dampening of the room. Mark just got his certification last month. He hasn't even touched a patient alone yet.

  The machine doesn't scan for evidence of the event, Aris said. His voice was level, practiced. It scans for the trajectory of your cognitive state. It models how you update beliefs based on evidence you will encounter but haven't yet. It is telling you that in six years, you will be nearly certain your brother failed someone.

  But I'm not certain now.

  No. Currently, your credence is near zero. That is the discrepancy.

  Elena set the paper down. It slid across the laminate with a frictionless whisper. So what am I supposed to do with this? Warn him? Watch him like a hawk?

  You are an ethicist, Elena. You know the protocol. The Reflection Principle is the standard for temporal coherence. If you know now what you will believe later, you are obliged to believe it now. Your future self is a smarter version of you. She has data you lack. To ignore her is to treat evidence as noise.

  It's not evidence of a crime, she said, feeling the heat rise in her neck. It's evidence of what I'll think. Those are different things.

  Are they? If you trust the machine, you trust that Future Elena knows something Present Elena doesn't. Maybe Mark makes a mistake. Maybe he covers it up. Maybe you find a logbook in six years that proves it. The machine doesn't say he did it. It says you will know he did.

  So I should condemn him now? Based on a prophecy?

  You should align your probabilities. If you don't, you open yourself to exploitation. Aris leaned forward slightly. Imagine I offer you a bet today. I bet you ten dollars that Mark is innocent. You take it. Then, in six years, when your credence is ninety-two percent guilty, I offer you a bet that he is guilty. You take that too. You've just accepted two bets that guarantee a loss depending on the outcome, simply because your standards shifted over time. Inconsistency is expensive, Elena. The principle protects you from being money-pumped by your own timeline.

  This isn't about money.

  It's about rationality. The currency is truth.

  Elena stood up and walked to the window. Outside, the city was gray, rain streaking the glass. She thought of Mark. He was twenty-four, bright-eyed, the kind of person who apologized to tables he bumped into. The idea that she would one day look at him and see negligence felt like a physical violation. But the machine was reliable. The study had a margin of error less than a percentage point. It had predicted the stock market crash in '29 to the day, not by analyzing economics, but by analyzing the aggregate belief structures of the traders who caused it.

  If I believe it now, she said to the window, does that make it happen?

  No.

  If I don't believe it now, does that make the machine wrong?

  Aris paused. That is the tension. If you refuse to update your credence, you are claiming the machine is wrong about your future mind. But the machine has never been wrong about the mind. It knows how you process grief, how you process betrayal. It knows that when the evidence arrives, you will be convinced.

  So I have to preempt the betrayal.

  You have to preempt the irrationality.

  Elena turned back to him. She picked up the pen they had given her to sign the post-scan consent forms. Her hand hovered over the line. If she signed, she accepted the study's terms, which included adhering to the coherence protocol. It meant she would have to log her current credence as 0.92 in her private records. It meant treating Mark differently today. It meant looking at his hands and wondering when they would shake.

  If I update now, she said, I'm believing without evidence. I'm punishing him for a future I haven't seen.

  If you don't update, you're pretending you don't know what you know. You're lying to yourself about your own epistemic state.

  There has to be a third option.

  There isn't. That's the bite. Aris tapped the desk. The principle holds because your future self is still you. To distrust her is to distrust your own capacity for reason. You are saying that you will be rational then, but you choose to be irrational now.

  Elena looked at the number again. 0.92. It wasn't a certainty. There was an eight percent chance she was wrong. An eight percent chance that in six years, she would be the one who was mistaken, perhaps blinded by some trauma or bias the machine couldn't account for. But ninety-two percent was overwhelming. In her line of work, ninety-two percent was enough to pull a treatment from the market. It was enough to revoke a license.

  She thought about the betting argument again. If she kept her credence at zero, and Mark actually did make a mistake in six years, she wouldn't just be surprised. She would be structurally vulnerable. She would have positioned herself to be wrong twice—once now, and once then. But if she updated now, she lived in a state of grief for a death that hadn't happened. She carried the weight of a conclusion without the journey.

  Is there any way to stop it? she asked. If I know I'll believe he's guilty, can I change the outcome?

  The machine predicts belief, not events. But belief drives action. If you watch him closer because of this, maybe you prevent the negligence. Or maybe your suspicion causes the stress that leads to the error.

  So the prediction creates the evidence.

  Or it reveals the inevitability.

  Elena capped the pen. She didn't sign. She slid the paper back across the desk.

  I can't sign this.

  You don't have to. But the data exists now. You know what you will believe. You can't un-know it. The principle applies whether you sign the form or not. Ignoring it doesn't make the inconsistency go away. It just makes you unaccountable for it.

  Elena picked up her bag. The weight of the knowledge was already there, settling into her shoulders like a heavy coat. She walked out of the clinic into the rain. Her phone buzzed in her pocket. A text from Mark. Hey, celebrating tonight. You coming?

  She stopped on the sidewalk, the rain dampening her hair. She looked at the message. To say yes was to act as if her credence was zero. To say no was to act on the ninety-two percent. To say yes while feeling the ninety-two percent was to live the contradiction Aris had warned her about. She stood there, water running down her face, realizing the machine hadn't told her about Mark at all. It had told her that her own rationality was a trap she had already sprung, and the only way to be consistent was to mourn a brother who was still alive.

  She typed a reply, her thumb hovering over the send button, knowing that whatever she chose, she was already guilty of believing him.
