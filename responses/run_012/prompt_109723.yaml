answer: |-
  Your hunch is substantially correct, but the cynicism needs a slight calibration. You are right that the biology is not doing the heavy lifting; the heavy lifting is being done by the *Dead Donor Rule* and the logistical necessity of organ procurement. However, it is not merely a "legal fiction wearing a lab coat" in the sense of being arbitrary. It is a *normative boundary drawn upon a biological continuum*. The error lies in the UDDA itself, which assumes "death" is a single natural kind that can be discovered, rather than a moral status we confer based on specific biological thresholds that we choose for specific reasons.

  The disagreement is fundamentally **mixed (normative-metaphysical)**. It is not substantive-empirical because both sides can agree on the physiology (e.g., that a brain-dead body can gestate a fetus, or that a DCD heart could be restarted). The dispute is metaphysical because the two criteria rely on incompatible definitions of what a human being *is*. The whole-brain criterion implicitly treats the human as a *person* whose existence depends on consciousness/brainstem function, or as an organism whose *integrative unity* is lost when the brain fails. The circulatory criterion treats the human as a *biological organism* whose integration depends on circulation. The UDDA tries to paper over this metaphysical rift to serve a normative goal: maximizing organ viability while maintaining public trust.

  The shift from "irreversible" (brain) to "permanent" (circulatory) is the telltale sign of this normative pressure. In brain death, we claim the damage is biological (you cannot fix the dead brain). In DCD, we admit the damage is contingent (we *could* fix the heart, but we won't). This confirms your suspicion: "permanent" is a moral permission slip, not a biological fact. The cynicism is wrong only if it suggests the biology is irrelevant; the biology provides the *canvas*, but the values provide the *paint*. We cannot resolve this by finding better biomarkers because the conflict isn't about measurement; it's about which biological failure counts as the end of *us*.

  Progress on the question "Which criterion is the real death?" is impossible because there is no "real" death independent of our purposes. Progress is only possible if we stop asking "When is the patient dead?" and start asking "When do we have moral permission to treat the patient as dead?" This requires abandoning the unitary definition. Until the law acknowledges that "death" is a cluster concept serving different functions (burial, inheritance, organ procurement, cessation of treatment), the committee will remain stuck. You are not missing data; you are witnessing a category error codified into statute.

