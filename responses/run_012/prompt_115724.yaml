  ### The Pane

  The pane is pure and white,
  It glimmers in the light.
  Should you drop it down,
  It strikes the waiting ground,
  It shatters in the light.

  The pane is pure and white,
  It glimmers in the light.
  Should you drop it down,
  It strikes the waiting ground,
  It shatters out of sight.

  The pane is pure and white,
  It glimmers in the light.
  Should you drop it down,
  It strikes the waiting ground,
  It stays intact.

  The pane is pure and white,
