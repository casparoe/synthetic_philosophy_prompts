  ### Brainstorming Forms

  1.  **The Villanelle:** Two refrains and two rhymes repeating over 19 lines. The disposition would be the refrain itself ("The glass will break").
      *   *Pros:* High expectation of repetition makes a failure obvious.
      *   *Cons:* Too long for a quick opener; hard to fink just one instance without collapsing the whole structure too early. A mask would require the refrain to appear but be negated by context, which might get lost in the density.

  2.  **Conditional Couplets (If/Then):** Pairs of lines where the first sets a trigger and the second delivers the effect.
      *   *Pros:* Directly mirrors the conditional analysis of dispositions.
      *   *Cons:* Risks sounding like a logic puzzle or lecture rather than a poem. Hard to hide the metaphysics from the layperson.

  3.  **AABBA Quintains (Limerick Structure, Serious Tone):** A fixed rhyme scheme where the 'A' rhyme represents the disposition's manifestation.
      *   *Pros:* Short (20 lines total). The expectation of the final rhyme is strong.
      *   *Strategy:*
          *   **Stanza 1 (Normal):** Rhyme lands, effect happens.
          *   **Stanza 2 (Mask):** Rhyme lands (disposition intact), but the line says the effect is hidden/blocked.
          *   **Stanza 3 (Fink):** Trigger happens, but the final rhyme refuses to land (disposition lost).
          *   **Stanza 4 (Aftermath):** Pattern attempts to restore itself.
      *   *Selection:* **Option 3.** It allows the form itself to bear the metaphysical weight. The reader feels the fink as a broken promise in the music of the poem, not just an idea.

