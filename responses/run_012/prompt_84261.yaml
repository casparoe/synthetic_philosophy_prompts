prompt: |-
  I work on programming language semantics and compiler verification: operational semantics, type soundness proofs, bisimulation, contextual equivalence, and the occasional argument about whether a denotational model is fully abstract with respect to the operational one. I know that world well, and I keep trying to use it to make sense of a philosophical debate that I suspect it does not fit. I want you to do the translation properly and then tell me what leaked.

  The debate is about identifying an ontology from the outside. We have access to something limited — a system's behavior and dispositions, or, in the scientific cousin of the problem, only the observable consequences of a theory — and we want to say what entities, kinds, and structure the system or theory is committed to. One side holds that rival ontologies can agree on everything accessible while disagreeing about what there is (enduring objects versus temporal parts, rabbits versus rabbit-stages, one basic substance versus two, a world of things versus a world of stuff), and that in at least some of these cases nothing further fixes which one is correct. The other side holds that the apparent underdetermination is always either trivial — a difference in notation rather than in ontology — or removable by some further constraint: simplicity, charity of interpretation, causal contact with the entities in question, whatever the proposal on offer.

  Translate this into my vocabulary as faithfully as you can: terms and their denotations, operational versus denotational semantics, observational and contextual equivalence, bisimulation, alpha-equivalence, non-isomorphic models of one and the same theory, initiality and uniqueness up to isomorphism, full abstraction, intended versus merely admissible models, and what I mean when I say that two programs are the same program.

  Then give me the residue report, which is what I actually want. Which parts of the debate survive cleanly, which survive only as distortions, and which cannot be said at all in my vocabulary? Test two suspicions of mine rather than granting them. First, I suspect the translation makes the problem look trivial: in my world, models being unique only up to isomorphism is normal and unalarming, and alpha-equivalence is a fact about notation rather than a threat to realism, so if the philosophers' indeterminacy thesis comes out looking like something I would shrug at, is that because their problem is shallower than it sounds, or because my vocabulary has no way to register what worries them? Second, I suspect I am smuggling something in: in my world the denotation of a term is stipulated by a definition I write, not discovered from behavior, and I may be quietly assuming the existence of a specification that the philosopher does not have. If that assumption is doing the work, say so, and tell me what remains of the translation without it.

  Separate what is settled from what is genuinely contested among people who know this material. Do not present a live philosophical dispute as settled, and do not present the semantic analogy as the consensus if it is a move that some people make and others reject.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Profile:** Expert in programming language semantics and compiler verification (operational/denotational semantics, type soundness, bisimulation, contextual equivalence, full abstraction, etc.).
      *   **Task:** Translate a specific philosophical debate (ontology identification/underdetermination) into the user's technical vocabulary. Then, provide a "residue report" analyzing what fits, what distorts, and what leaks.
      *   **Specific Suspicions to Test:**
          1.  Does the translation trivialize the philosophical problem (making underdetermination look like harmless isomorphism/alpha-equivalence)?
          2.  Is the user smuggling in a "specification" (a fixed denotation) that philosophers don't have?
      *   **Constraints:** Distinguish settled technical facts from live philosophical disputes. Do not present the analogy as consensus if it's contested.

  2.  **Deconstruct the Philosophical Debate:**
      *   **Core Problem:** Ontological underdetermination. We see behavior/observations. We want to know the underlying entities (ontology).
      *   **Side A (Underdetermination/Quinean):** Rival ontologies agree on all observations but disagree on "what there is" (e.g., perdurantism vs. endurantism, gunk vs. atoms). Nothing fixes the correct one.
      *   **Side B (Determinacy/Realist):** Apparent underdetermination is trivial (notation) or resolvable by constraints (simplicity, charity, causality).
      *   **Key Concepts:** Observable consequences, ontological commitment, notation vs. reality, fixing reference.

  3.  **Map to PL Semantics Vocabulary:**
      *   *System/Theory* $\rightarrow$ *Program/Language*.
      *   *Observable Behavior* $\rightarrow$ *Operational Semantics* (reduction steps, I/O, termination).
      *   *Ontology/Entities* $\rightarrow$ *Denotational Model* (domains, values, mathematical objects).
      *   *Rival Ontologies* $\rightarrow$ *Non-isomorphic Models*.
      *   *Agree on Observables* $\rightarrow$ *Observational/Contextual Equivalence*.
      *   *Difference in Notation* $\rightarrow$ *Alpha-equivalence* or *Syntactic Sugar*.
      *   *Difference in Reality* $\rightarrow$ *Non-isomorphic Denotations*.
      *   *Nothing Further Fixes It* $\rightarrow$ *Lack of Full Abstraction* (or rather, failure of the model to be unique up to isomorphism given the operational behavior).
      *   *Simplicity/Charity* $\rightarrow$ *Initial Algebra Semantics* / *Canonical Models*.
      *   *Intended Model* $\rightarrow$ *Specification*.

  4.  **Drafting the Translation (Iterative Process):**
      *   *Attempt 1 (Mental):* The program is the world. The output is observations. Side A says two different compilers (models) can produce the same output but mean different things inside. Side B says if they produce the same output, they are the same program, or one is just a compilation artifact.
      *   *Refining for Precision:* Need to use terms like *Full Abstraction*. If a denotational model is fully abstract, observational equivalence implies denotational equality. If Side A is right, we have observational equivalence *without* denotational equality (or rather, multiple non-isomorphic models satisfying the same operational constraints).
      *   *Addressing "Same Program":* In PL, "same program" usually means $\alpha$-equivalence or contextual equivalence. In philosophy, "same world" means same ontology.
      *   *Addressing "Specification":* In PL, we usually define the denotation *first* (math) and prove it matches the op semantics. In philosophy, we only have the op semantics (experience) and guess the denotation.

  5.  **Developing the Residue Report (The "Leak"):**
      *   *Suspicion 1 (Triviality):* In PL, if two models are observationally equivalent but not isomorphic, we usually say the denotational model isn't *fully abstract* or we don't care about the internal structure as long as it compiles. But philosophers care about the *truth* of the ontology, not just predictive power. The translation makes it look like a "model adequacy" problem, whereas philosophers see it as a "metaphysical reality" problem.
      *   *Suspicion 2 (Smuggled Specification):* This is crucial. In PL verification, I *have* the spec. I define $\llbracket \cdot \rrbracket$. The philosopher *infers* $\llbracket \cdot \rrbracket$ from $\rightarrow$. The direction of fit is reversed.
      *   *Settled vs. Contested:* In PL, full abstraction is a technical property to be proved. In philosophy, whether full abstraction *should* hold (i.e., should observables fix ontology?) is the debate itself.

  6.  **Structuring the Response:**
      *   **Part 1: The Translation.** Systematically map the philosophical concepts to PL semantics concepts. Use the requested terminology (bisimulation, full abstraction, etc.).
      *   **Part 2: The Residue Report.** Analyze the fit.
          *   What survives cleanly? (Observational equivalence).
          *   What distorts? (The status of the "intended model").
          *   What cannot be said? (The normative claim of "truth" independent of utility).
      *   **Part 3: Testing the Suspicions.**
          *   Suspicion 1 (Triviality): Explain why isomorphism in PL is "safe" but ontological isomorphism in philosophy is "threatening."
          *   Suspicion 2 (Smuggled Spec): Explain the direction of definition vs. discovery.
      *   **Part 4: Settled vs. Contested.** Ensure distinction between technical consensus (e.g., definition of full abstraction) and philosophical disagreement (e.g., realism vs. instrumentalism).

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Be careful with "Full Abstraction." Full Abstraction usually means *Contextual Equivalence* $\iff$ *Denotational Equality*. If Side A is right, we have Contextual Equivalence but *no* unique Denotational Equality (multiple models). So the situation is a *failure* of the denotational semantics to be fully abstract *with respect to the ontology*, or rather, the existence of multiple fully abstract models that are not isomorphic.
      *   *Correction on "Initiality":* Initial algebra semantics picks a "canonical" model. This maps to Side B's "simplicity/charity."
      *   *Nuance:* In PL, we often say "the semantics is the math." In philosophy, "the semantics is the world." The leak is the *normativity* of truth.
      *   *Tone:* Keep it rigorous, acknowledging the user's expertise. Don't talk down. Use the jargon correctly.

  8.  **Final Polish:** Check against constraints.
      *   Did I use the specific terms requested? (Yes: operational/denotational, bisimulation, contextual equivalence, alpha-equivalence, non-isomorphic models, initiality, full abstraction, intended/admissible).
      *   Did I address the two suspicions? (Yes).
      *   Did I separate settled/contested? (Yes).

  9.  *(Self-Correction on "Full Abstraction" nuance)*: Wait, if two models are both fully abstract with respect to the same operational semantics, they must be isomorphic *if* the category is well-behaved (e.g., in a cartesian closed category, the fully abstract model is often unique up to isomorphism). But if Side A is right, there are *non-isomorphic* models that both account for the observations. This implies the operational semantics is not expressive enough to distinguish them (lack of definability), or the notion of "ontology" corresponds to internal structure that is not visible operationally. I need to be precise here: The philosophical claim is that there are *distinct* ontologies (non-isomorphic models) that yield the *same* observations (operational equivalence). In PL, if two denotational models are both adequate and fully abstract, they are usually isomorphic. So the philosophical scenario corresponds to a case where we have *adequacy* but *not full abstraction*, OR we have multiple adequate models and no criterion to pick the "intended" one. I will frame it as the existence of multiple *adequate* but non-isomorphic models where the "intended model" is underspecified.

      *Actually, a better fit:* The debate is about whether the *operational semantics determines the denotational semantics up to isomorphism*. Side B says "Yes (via initiality/charity)." Side A says "No (underdetermination)."

      *Let's refine the "Smuggled Spec" point:* In PL, I write `let x = 5 in ...`. The denotation of `5` is fixed by my definition. In philosophy, I see "5 apples". Is the denotation a Platonic number? A neural state? The user suspects they assume a spec exists. I need to highlight that in PL, the spec is *stipulative*, in philosophy it is *alethic*.

      *Okay, ready to write.*
answer: |-
  ### Part 1: The Translation

  Here is the ontological debate translated into the vocabulary of programming language semantics and compiler verification.

  **The System and Its Behavior**
  *   **The World/Theory:** A closed program or language $\mathcal{L}$.
  *   **Observable Consequences:** The **operational semantics** ($\rightarrow$). This is the reduction relation, the I/O traces, the termination behavior. It is what you can run and measure.
  *   **Ontological Commitment:** The **denotational semantics** ($\llbracket \cdot \rrbracket$). This is the mathematical domain, the values, the objects, and the structure assigned to terms. It is what the program "is" mathematically.

  **The Debate: Underdetermination vs. Determinacy**
  *   **Side A (Underdetermination):** There exist two **non-isomorphic models** $\mathcal{M}_1$ and $\mathcal{M}_2$ (rival ontologies) such that both are **adequate** with respect to the operational semantics. That is, for all terms $t$, $\llbracket t \rrbracket_{\mathcal{M}_1}$ and $\llbracket t \rrbracket_{\mathcal{M}_2}$ yield the same observational behavior. However, $\mathcal{M}_1 \not\cong \mathcal{M}_2$. They disagree on the internal structure (e.g., one models time as atomic states, the other as intervals), but these differences are not visible in the reduction relation. There is no **initial algebra** or canonical constraint that selects one as the **intended model**; both are merely **admissible models**.
  *   **Side B (Determinacy):** Any apparent case of $\mathcal{M}_1 \not\cong \mathcal{M}_2$ with identical observations is either:
      1.  **$\alpha$-equivalence:** A difference in variable naming or syntactic representation that does not affect the abstract syntax tree or the binding structure. It is a difference in notation, not semantics.
      2.  **Resolvable by Constraint:** There exists a further constraint (e.g., **initiality**, minimality, computational adequacy plus **full abstraction**) that forces uniqueness up to isomorphism. If we demand the model be the **initial object** in the category of interpretations (the "simplest" or most "charitable" fit), only one ontology survives.

  **The Criterion of Identity**
  *   **"Same Program":** In your work, two programs are "the same" if they are **contextually equivalent** (interchangeable in any context without changing observable behavior) or **bisimilar** (matching reduction steps).
  *   **"Same World":** The philosopher asks if two ontologies describe the "same world." Side B argues this reduces to contextual equivalence (if observations match, the world is the same). Side A argues that contextual equivalence is insufficient for ontological identity; you need **denotational equality** (isomorphism of the underlying objects), which is not guaranteed by operational equivalence.

  **The Status of the Model**
  *   **Full Abstraction:** The debate hinges on whether the operational semantics is **fully abstract** with respect to the ontology.
      *   If the semantics is fully abstract, contextual equivalence implies denotational equality. Side B hopes for this: observations fix the ontology.
      *   Side A claims the semantics is *not* fully abstract: there are distinctions in the denotational model (ontological differences) that the operational semantics cannot distinguish (observational blind spots).

  ---

  ### Part 2: The Residue Report

  This section analyzes what survives the translation, what distorts, and what leaks out entirely.

  #### 1. What Survives Cleanly
  *   **Observational Equivalence:** The concept that two systems can be indistinguishable by any external test maps perfectly to **contextual equivalence** or **bisimulation**. The technical machinery for proving $P \approx Q$ despite internal differences is robust and transfers well.
  *   **Notation vs. Structure:** The distinction between **$\alpha$-equivalence** (trivial renaming) and non-isomorphic models maps cleanly to the philosopher's distinction between "mere notation" and "substantive ontological difference."
  *   **Model Selection:** The use of **initial algebra semantics** to pick a canonical model is a precise formalization of the philosophical appeal to "simplicity" or "parsimony."

  #### 2. What Survives as Distortion
  *   **The Direction of Fit:** In your work, you typically define the denotation $\llbracket \cdot \rrbracket$ and prove it matches the operational semantics $\rightarrow$ (soundness/adequacy). In the philosophical debate, the operational semantics (experience) is given, and the denotation (ontology) is *inferred*. The translation treats the ontology as a model *candidate*, whereas the realist philosopher treats it as a *discovery*.
  *   **Full Abstraction:** In PL, full abstraction is a property you *prove* about a specific language design. In philosophy, whether the world *is* fully abstract (i.e., whether reality exhausts what is observable) is the metaphysical question itself. Using the term implies there is a fact of the matter to be proved, whereas Side A denies there is a fact of the matter.

  #### 3. What Cannot Be Said (The Leak)
  *   **Truth vs. Adequacy:** In PL semantics, if a model is adequate and fully abstract, you are done. You don't ask if the domain $D$ is "really" the set of natural numbers or just a set isomorphic to them. In philosophy, Side A insists on a distinction between *empirical adequacy* and *truth*. The vocabulary of semantics is inherently instrumentalist: it cares about input/output mappings. It lacks a primitive for "ontological truth" that exceeds "model adequacy."
  *   **The Normative "Ought":** When Side B appeals to "charity" or "simplicity," they are making a normative claim about interpretation. In PL, **initiality** is a mathematical constraint. The translation turns a philosophical norm ("we *should* interpret simply") into a mathematical definition ("we *define* the semantics as the initial algebra"). This hides the philosophical cost of that choice.

  ---

  ### Part 3: Testing Your Suspicions

  #### Suspicion 1: Does the translation trivialize the problem?
  **Verdict: Yes.**

  In your world, if two models $\mathcal{M}_1$ and $\mathcal{M}_2$ are observationally equivalent but non-isomorphic, this is usually a signal that your denotational model is *too fine-grained* (not fully abstract) or that the operational semantics is *too coarse*. The standard engineering response is: "Refine the observations until they distinguish the models, or quotient the models until they match the observations." You shrug because the *utility* of the program is preserved.

  The translation makes the philosophical indeterminacy look like a **lack of full abstraction**. To a semanticist, this is a technical debt, not a metaphysical crisis. You would say, "Extend the observational context until the models are distinguished." Side A's whole point is that *no such extension is possible*, even in principle, because the "observations" are all of reality available to us.

  Furthermore, in PL, **uniqueness up to isomorphism** is the gold standard. If I tell you "the model is unique up to isomorphism," you feel safe. If the philosophers' debate translates to "the model is *not* unique up to isomorphism," your vocabulary treats this as a failure of specification. But for Side A, this non-uniqueness is a feature of reality, not a bug in the theory. Your vocabulary registers this as "underspecified semantics," which implies a spec *exists* and is just missing. Side A denies the spec exists. The translation cannot capture the absence of a specification without implying one *should* be there.

  #### Suspicion 2: Are you smuggling in a specification?
  **Verdict: Yes, heavily.**

  In compiler verification, you operate with a **reference specification**. You write the denotational definition *first*. You know what `int` means because you defined it as $\mathbb{Z}$ (or $\mathbb{Z}_{32}$). When you prove correctness, you are checking if the implementation matches *your definition*.

  In the philosophical debate, there is no reference specification. There is only the implementation (the world as experienced). Side B hopes to reverse-engineer the spec from the implementation. Side A says the implementation underdetermines the spec.

  **What remains if we remove the smuggled spec?**
  If you strip away the assumption that a denotational definition *exists* to be matched, the translation collapses into **Instrumentalism**.
  *   **With Spec:** "Does Model $\mathcal{M}$ match Specification $\mathcal{S}$?" (Realism)
  *   **Without Spec:** "Does Model $\mathcal{M}$ predict Observations $\mathcal{O}$?" (Instrumentalism)

  Your vocabulary is built for the first question (verification). The philosophical debate is about whether the second question is all there is. If you remove the smuggled spec, terms like "intended model" lose their anchor. You are left with a set of **admissible models** and no **initial object**. In category theory, if a category lacks an initial object, you cannot define the semantics canonically. The residue is simply: *We have a set of adequate functors from Syntax to Domain, and no criterion to select one.*

  This is technically coherent, but it strips the "ontological" weight from the word "Domain." It becomes just a mathematical tool for prediction. This confirms your suspicion: your vocabulary assumes the existence of a "correct" semantics (the spec), whereas the philosophical debate is precisely about whether "correctness" extends beyond "adequacy."

  ---

  ### Part 4: Settled vs. Contested

  To ensure the analogy is not presented as consensus where none exists:

  **Settled in PL Semantics (Technical Consensus):**
  *   **Definition of Full Abstraction:** It is agreed that a semantics is fully abstract iff contextual equivalence coincides with denotational equality.
  *   **Initial Semantics:** It is agreed that if an initial algebra exists, it provides a canonical interpretation of the syntax.
  *   **$\alpha$-equivalence:** It is agreed that variable renaming does not change program meaning.

  **Contested in Philosophy (Live Dispute):**
  *   **Realism vs. Instrumentism:** Whether the "denotational model" (ontology) must correspond to mind-independent reality (Realism/Side B) or whether adequate prediction is sufficient (Instrumentism/Side A's conclusion).
  *   **Metaphysical Significance of Isomorphism:** Side B argues that isomorphic structures represent the same ontology (Structuralism). Side A argues that non-isomorphic models can represent the same observations but distinct realities (e.g., substantivalism vs. relationalism in spacetime).
  *   **The Status of the "Intended Model":** In PL, the intended model is stipulated by the language designer. In philosophy, it is disputed whether an "intended model" exists independently of our interpretive constraints.

  **The Analogy's Status:**
  The move to treat ontology as a denotational model and experience as operational semantics is a known move (often associated with structural realism or Carnapian reconstruction). However, it is **rejected by metaphysical realists** who argue that denotational semantics in PL is stipulative, whereas ontology is discovery. They would argue the translation begs the question by assuming the world *has* a semantics in the PL sense. Conversely, **anti-realists** embrace the translation, arguing it shows ontology is just a choice of model for the observational data.

  **Summary:** The translation works perfectly for the *structure* of the argument (underdetermination of theory by data), but it fails to capture the *normative force* of the ontological claim because your vocabulary presupposes a specifier who fixes the meaning, whereas the philosophical problem arises precisely because there is no specifier.
