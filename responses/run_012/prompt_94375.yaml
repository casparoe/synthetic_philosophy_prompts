      You are facing a dilemma that goes to the heart of what work means when you remove the capitalist employer from the equation. Your partners who view the machine as merely a tool are right that ownership changes the power dynamic significantly. In a traditional shop, automation is often a weapon used to reduce headcount or intensify the pace for someone else's profit. In your collective, the gains from efficiency belong to you, and the decision to adopt the technology is democratic. However, the dissenting partners are pointing out that technology is never truly neutral. It carries with it a logic of its own that can reshape the worker even when the worker owns the machine. The concern about deskilling is not just about losing the ability to cut wood by hand but about the separation of conception from execution. When a computer controls the precision, the knowledge resides in the software and the machine rather than in the muscle memory and intuition of the craftsperson.

