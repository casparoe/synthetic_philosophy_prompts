answer: |-
  You are facing a dilemma that goes to the heart of what work means when you remove the capitalist employer from the equation, and it is understandable that you see merit in both positions because both are describing different layers of the same reality. Your partners who view the machine as merely a tool are right that ownership changes the power dynamic significantly. In a traditional shop, automation is often a weapon used to reduce headcount or intensify the pace for someone else's profit, but in your collective the gains from efficiency belong to you and the decision to adopt the technology is democratic. This suggests that the primary danger of technology, which is exploitation by an owner, has been neutralized by your structure. However, the dissenting partners are pointing out that technology is never truly neutral and that it carries with it a logic of its own that can reshape the worker even when the worker owns the machine. The concern about deskilling is not just about losing the ability to cut wood by hand but about the separation of conception from execution, where the knowledge resides in the software and the machine rather than in the muscle memory and intuition of the craftsperson.

  This shift can subtly alter the satisfaction derived from the work and change the nature of your collective identity. If the most exacting part is removed, the remaining work might feel less like mastery and more like assembly, potentially draining the sense of agency that comes from solving physical problems with hand tools. There is also the risk of dependency on external systems. If the machine breaks or the software becomes proprietary, you are at the mercy of external manufacturers, which contradicts the autonomy you value as a worker-run enterprise. Furthermore, even without a human boss, the machine can become a taskmaster in its own right. The need to keep the expensive equipment running to justify its cost can dictate the pace of work and the types of jobs you accept, potentially locking you into production runs that feel less meaningful than your current bespoke work. This creates a situation where the market demands imposed by the capital investment in the machine could indirectly govern your labor process, replicating some of the pressures you sought to escape by forming a cooperative.

  Yet, refusing all technological advancement can also be a trap that romanticizes drudgery and limits your economic viability. The key is to recognize that this is not a binary choice between pure handwork and total automation, but rather a question of integration and control. You might consider how to use the machine without letting it define the workshop, perhaps by having it handle the rough cutting while the fine joinery and finishing remain manual. This would preserve the high-skill aspects while eliminating the tedious labor, satisfying the desire for efficiency without sacrificing the craft. You must also consider how knowledge is managed within the group. If you buy the machine, ensure that the programming and maintenance skills are shared among all owners so that no single person becomes the gatekeeper of the new technology and so that the know-how does not drain away into a black box. This requires a commitment to training and rotation that matches your current ethos of everyone doing every job.

  Ultimately, this decision is about defining the identity of your workshop and determining what you are optimizing for. Are you primarily protecting a specific method of craft, or are you protecting the well-being and autonomy of the workers? Sometimes these align, and sometimes they diverge. If the machine allows you to work fewer hours for the same pay or take on projects that are more creatively fulfilling, it serves the workers. If it turns you into monitors of a process you do not fully understand or control, it serves the machine. The dissenters are warning you that ownership does not fully immunize you from the alienating effects of technology, while the proponents are reminding you that ownership gives you the power to mitigate those effects. Your task is to find a way to adopt the tool without letting the tool adopt you, ensuring that the machine remains a subordinate instrument of your collective will rather than becoming the central purpose around which your work revolves.
