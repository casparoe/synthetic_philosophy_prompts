answer: |-
  # HANDOUT: Disambiguating "But What If Everyone Did That?"
  **Seminar:** Ethical Theory & Practical Reasoning  
  **Topic:** The Logic of Generalization Arguments  
  **Context:** Conference-Travel Policy Discussion

  ---

  ## I. The Ambiguity Menu
  The retort *"But what if everyone did that?"* is not a single argument. It is a placeholder for at least four distinct philosophical theses. Below is a disambiguation of the precise claim being made in each reading, its status (descriptive or normative), and an assessment of its argumentative force.

  | # | Thesis Name | The Precise Claim | Status | Plausibility & Licensing Power |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Empirical Prediction** | "If everyone *actually* performed this action, the causal consequences would be disastrous." | **Descriptive** (with normative inference) | **Low Plausibility** for individual cases. <br>*(One person's flight does not cause climate collapse.)* <br>**Licensing:** Fails to license the conclusion for the *individual* act unless paired with a threshold view (e.g., "I might be the tipping point"). |
  | **2** | **The Kantian Constraint** | "I cannot rationally *will* this maxim as a universal law without contradicting my own purposes or rational agency." | **Normative** (Rationality) | **High Plausibility** for duty-based ethics. <br>**Licensing:** Strongly licenses the conclusion. If the maxim is non-universalizable, the act is forbidden *regardless* of consequences. |
  | **3** | **The Rule-Optimization** | "A moral code that included a rule permitting this action would produce less well-being than the optimal alternative code." | **Normative** (Evaluative) | **Medium-High Plausibility.** <br>**Licensing:** Licenses the conclusion if the *rule* is sub-optimal, even if the *act* has good consequences. Shifts focus from act to rule. |
  | **4** | **The Deliberative Symmetry** | "Since others in my position reason as I do, my choice functions as a vote for what all such agents should do; I must choose only what I accept for all." | **Normative** (Decision-Theoretic / Contractualist) | **High Plausibility** for fairness/reciprocity. <br>**Licensing:** Strongly licenses the conclusion. It binds the agent not via causal impact, but via the logic of impartial justification. |

  ---

  ## II. The Hard Cases: Where the Readings Diverge
  The utility of the "What if everyone..." retort is tested in cases where the causal impact of the individual act and the impact of general adoption come apart. In these scenarios, the four readings above yield conflicting verdicts.

  ### Case A: The Benign Generalization (Harmless General Adoption / Wrong Individual Act)
  * **Scenario:** An employee steals a single, trivial paperclip from work.
  * **The Dynamics:** If everyone stole one trivial paperclip, the company would absorb the cost with no functional disruption (General Adoption = Harmless/Beneficial redistribution). Yet, the individual act is widely considered wrong (Theft).
  * **Which Readings Come Apart?**
      *   **Readings 1 & 3 (Consequentialist):** These readings struggle to condemn the act. If the general practice is harmless, the empirical prediction is false, and the rule might be permissible.
      *   **Readings 2 & 4 (Deontological/Contractualist):** These readings successfully condemn the act. Reading 2 cites the contradiction in willing a universal property right violation. Reading 4 cites the unfairness of making an exception for oneself regarding property norms.
  * **Lesson:** In Case A, only the **Kantian** and **Deliberative** readings license the conclusion that the act is wrong.

  ### Case B: The Drop in the Bucket (Ruinous General Adoption / Harmless Individual Act)
  * **Scenario:** A professor takes a solo, non-essential conference flight during a climate emergency.
  * **The Dynamics:** One flight has negligible causal impact on the climate (Individual Act = Harmless). If everyone took such flights, the climate impact would be catastrophic (General Adoption = Ruinous).
  * **Which Readings Come Apart?**
      *   **Reading 1 (Empirical):** This reading fails to license the conclusion. Since *my* flight changes almost nothing, the prediction "if I do this, disaster happens" is false. It leaves the agent free to fly.
      *   **Readings 2, 3, & 4:** These readings successfully bind the agent. Reading 3 rejects the *rule* permitting such travel. Reading 4 argues that reasoning "my impact is negligible" cannot be universalized without undermining the collective goal.
  * **Lesson:** In Case B, the **Empirical** reading exonerates the agent, while the **Rule**, **Kantian**, and **Deliberative** readings condemn the act.

  ---

  ## III. The Verdict: Rhetorical Function
  When the phrase *"But what if everyone did that?"* is used to **end** an argument rather than begin one, which reading is doing the work?

  **Verdict:** It is almost always **Reading 4 (The Deliberative Symmetry)** masquerading as **Reading 1 (The Empirical Prediction).**

  *   **Why?** The speaker usually knows (and the audience knows) that one person's action will not causally trigger the universal outcome (Reading 1 is empirically weak). However, invoking the *catastrophe of universalization* is a rhetorical shorthand for appealing to **fairness** and **consistency**.
  *   **The Mechanism:** The speaker is not actually predicting a causal chain; they are invoking a normative constraint on reasoning. They are asserting: *"You cannot claim a privilege for yourself that you would deny to others in identical circumstances."*
  *   **Pedagogical Note:** When students use this phrase to shut down discussion, challenge them to specify whether they are worried about the *consequences* of the general practice (Reading 3) or the *fairness* of the exception (Reading 4). If they insist on the causal consequences of the single act (Reading 1), they are likely committing the **Fallacy of Composition**.

  ---
  **Discussion Question for Seminar:**
  *If Reading 4 is the strongest justification for the retort, does the phrase lose its force in situations where 'everyone' is not reasoning similarly (e.g., if you know your colleagues will fly regardless of your choice)?*
