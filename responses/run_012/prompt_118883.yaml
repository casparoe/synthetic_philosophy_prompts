  # The Colony Mind: A Decision Tree
  **Context:** Based on the "Ant Fugue" from *Gödel, Escher, Bach*. This tool maps the logical space of the debate over whether an ant colony can possess a mind. It begins with the ambiguity that stalled our last discussion and uses four concrete cases to force commitments.

  **Instructions:** Start at **Node 1**. Answer the plain-language question based on your intuition about the case described. Follow the branch until you reach a **Leaf**.

  ***

  ### **Node 1: The Ambiguity**
  When you ask if the colony has a "mind," are you asking whether it *feels* something (e.g., pain, satisfaction) **OR** whether it *knows/does* something (e.g., represents food, acts with purpose)?
  *   **Feels** → Go to **Node 7** (Experience Branch)
  *   **Knows/Does** → Go to **Node 2** (Agency Branch)

  ---

  ### **Agency Branch (Representation & Action)**

  ### **Node 2: The Hidden Puppeteer**
  Imagine a single ant-sized device buried in the nest is dictating every worker's movements. The colony behaves normally, but the coordination comes from the device, not the ants. Is the *colony* acting, or is it just being moved?
  *   **Just being moved** → **Leaf 1**
  *   **The colony is acting** → Go to **Node 3**

  ### **Node 3: The Pheromone Wipe**
  The colony's only memory is in its scent trails. We erase all trails but leave every ant alive. The colony now behaves as though it has lost its past. Is the colony's mind *damaged*, or just *reset*?
  *   **Damaged** (Memory was in the trails) → **Leaf 2**
  *   **Reset** (Memory was in the ants) → Go to **Node 4**

  ### **Node 4: The Gradual Substitution**
  Workers are replaced one at a time by silicon chips that reproduce their behaviour exactly, until no ant remains. Does the colony's "knowing" persist?
  *   **No** (Biology is essential) → **Leaf 3**
  *   **Yes** (Substrate doesn't matter) → Go to **Node 5**

  ### **Node 5: The Split Nest**
  The colony separates into two viable halves, each foraging and building much as the original did. Does one mind become two?
  *   **No** (Mind is singular/indivisible) → **Leaf 4**
  *   **Yes** (Mind is divisible) → Go to **Node 6**

  ### **Node 6: The Convention**
  Is "having a mind" a fact about the world we discovered, or a description we find useful?
  *   **A fact** → **Leaf 5**
  *   **A useful description** → **Leaf 6**

  ---

  ### **Experience Branch (Phenomenology)**

  ### **Node 7: The Gradual Substitution**
  Workers are replaced one at a time by silicon chips that reproduce their behaviour exactly. Would the colony still *feel* pain if the nest were crushed?
  *   **No** (Experience needs biology) → **Leaf 7**
  *   **Yes** (Experience is functional) → Go to **Node 8**

  ### **Node 8: The Split Nest**
  The colony separates into two viable halves. Does the suffering split?
  *   **No** (Experience is unified) → **Leaf 8**
  *   **Yes** (Experience divides) → Go to **Node 9**

  ### **Node 9: The Convention**
  Is there a fact of the matter about who feels, or is it a choice of how we speak?
  *   **A fact** → **Leaf 10**
  *   **A choice of speech** → **Leaf 11**

  ---

  ### **The Leaves: Positions & Commitments**

  *   **Leaf 1: Ants-Only Agency.**
      *   *Awkward Commitment:* You must explain away complex colony-level problem solving as mere reflex.
  *   **Leaf 2: Extended Vehicle.**
      *   *Awkward Commitment:* You must count a volatile scent trail as a literal part of a mental state.
  *   **Leaf 3: Biological Superorganism.**
      *   *Awkward Commitment:* You must treat sterile, behaving workers as non-minded cells.
  *   **Leaf 4: Interactionist.**
      *   *Awkward Commitment:* You must deny unity to a system that acts as a single coherent unit.
  *   **Leaf 5: Functionalist Colony.**
      *   *Awkward Commitment:* You attribute beliefs to a system that cannot speak or report them.
  *   **Leaf 6: Instrumentalist.**
      *   *Awkward Commitment:* You admit the mind isn't "real" but insist on talking as if it is.
  *   **Leaf 7: Biological Phenomenology.**
      *   *Awkward Commitment:* You cannot explain why a perfect behavioral duplicate lacks feeling.
  *   **Leaf 8: Unified Phenomenology.**
      *   *Awkward Commitment:* You imply one half of a split colony ceases to feel entirely.
  *   **Leaf 10: Strong Emergence.**
      *   *Awkward Commitment:* You commit to feeling magically emerging from non-feeling parts.
  *   **Leaf 11: Conceptual Deflation.**
      *   *Awkward Commitment:* You make suffering a matter of linguistic preference.
      *(Note: Leaf 9 was collapsed into 10/11 to maintain logical symmetry with Agency branch).*

  ***

  ### **Notes on Logical Space**

  *   **Indistinguishable Leaves:** **Leaf 8** (Unified Phenomenology) and **Leaf 11** (Conceptual Deflation) are difficult to separate empirically. They differ only in whether the unity is a *fact* that prevents splitting (8) or a *concept* that makes splitting nonsensical (11).
  *   **Unoccupied Combination:** **Experience + Biological Essentialism + Divisibility.** (i.e., Experience requires biology, but splits with the nest). This is marked as **unattractive**; it suggests experience is tied to matter but can be cut like a cake, which conflicts with most theories of subjective unity.

  ***

  ### **Organizer's Key: Mapping the Standoff**

  The four-way standoff in our last session dissolves when we locate each disagreement on this tree. The **Aboutness** group was stuck at **Node 2 (Puppeteer)**, debating whether colony behavior implies genuine agency or mere causal throughput. The **Hurtability** question was actually the **Node 1 (Ambiguity)** fork; those asking about hurt were on the Experience branch while others were on the Agency branch. The **Biologists** were fighting at **Node 4 (Substitution)**, insisting that "organism" requires biological substrate rather than functional continuity. Finally, the implicit fourth disagreement regarding **Memory/Locus** was settled at **Node 3 (Pheromone)**, distinguishing those who see the mind as located in the ants from those who see it spread across the trails.
