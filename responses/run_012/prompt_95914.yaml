      *(Self-Correction during drafting)*: I initially thought about suggesting Dana just wait 5 more years. *Correction:* No, that's bad advice. She might burn out. The system needs to change now.
      *(Self-Correction)*: I shouldn't tell the user to force the vote. That risks the garden. I need to suggest a *negotiated settlement*.
