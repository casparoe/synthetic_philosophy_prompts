          1.  Validate the dilemma (it's a classic governance trap).
          2.  Analyze the power dynamics (Legitimacy vs. Authority).
          3.  Address the "Tyrant" comment (Status Quo Bias).
          4.  The Tradeoff (Fairness vs. Survival).
