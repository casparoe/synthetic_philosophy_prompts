answer: |-
  Here is the cold reality of your situation: You are dealing with a classic governance trap called **institutional capture**, disguised as a neighborhood dispute.

  The old-timers aren't just protecting a rule; they are protecting their identity and status within the community. To them, the 10-year rule isn't arbitrary; it's a property right. They believe they have "sweat equity" in the association simply by enduring time, whereas Dana has actual sweat equity but no recognized ownership.

  Here is how to think about the tradeoff, what is actually happening beneath the surface, and a concrete strategy to handle it without blowing up the garden.

  ### 1. The Tradeoff: Fairness vs. Survival
  You are framing this as "Justice (Dana) vs. Stability (Old-timers)." That is a false dichotomy. The real tradeoff is **Short-term Stability vs. Long-term Viability.**

  If you keep the rule to keep the peace, you are choosing short-term stability. But look at the demographics: The people doing the work (Dana) have no say. The people with the say (Old-timers) are threatening to leave if their control is diluted.
  *   **Scenario A (Status Quo):** Dana eventually burns out because she's doing the labor without the agency. She leaves. The garden goes to weeds anyway because the "voters" don't actually work the garden. The association dies in 3-5 years.
  *   **Scenario B (Force the Vote):** You amend the bylaws. The old-timers quit. The association dissolves immediately. The garden goes to weeds.
  *   **Scenario C (The Bridge):** You restructure the value system so the old-timers feel honored but the workers get power.

  If you side with the old-timers purely to "keep things from falling apart," you are enabling a slow suicide of the organization. A community organization that excludes its most active members is already dead; it just hasn't stopped moving yet.

  ### 2. What Is Actually Going On
  You mentioned the "tyrant" comment. You're right to feel that bug. This is **Status Quo Bias** weaponized. When they say, "It's always worked," they mean, "It has always worked *for us*."

  However, you need to understand their fear. It isn't necessarily malice. In small associations, institutional knowledge is fragile. They are likely thinking: *"If we let the 5-year people vote, next year the 1-year people will want to vote, and soon a bunch of transients will vote to sell the park for condos."* They equate tenure with commitment.

  Dana proves them wrong on the commitment front, but she doesn't address the fear of radical change.

  ### 3. The Strategy: Decouple "Honor" from "Control"
  Do not bring a motion to the floor to simply repeal the 10-year rule. That is a binary win/lose vote, and the old-timers have the votes to win. You will lose, Dana will be demoralized, and the rift will widen.

  Instead, you need to engineer a **Bylaw Amendment that creates a tiered system.**

  **The Proposal:**
  Propose a change that creates two classes of membership:
  1.  **Founding/Steward Members (10+ years):** They get a permanent seat on an "Advisory Board." They get veto power on *selling* the land or changing the *mission*, but they do not have sole voting rights on the *annual operating budget*. They get a plaque, a special title, and public recognition for their decades of service.
  2.  **Voting Members (Active contributors):** Voting rights on the budget are tied to **participation**, not just tenure. For example: Any household that has paid dues for 3+ years AND contributed X hours of volunteer time (or paid an equivalent fee) gets voting rights.

  **Why this works:**
  *   **For the Old-timers:** They don't lose status; they gain a formalized "Elder" role. You are framing this as *promoting* them to a higher level of oversight, not stripping them of power. It strokes their ego while removing their grip on the checkbook.
  *   **For Dana:** She qualifies immediately based on her work hours. She gets the vote she earned.
  *   **For You:** You look like a statesman finding a compromise, not a radical overthrowing the order.

  ### 4. How to Execute This
  You are on the board. You have the ability to set the agenda. Do not ask for permission to discuss this; frame it as a "Sustainability Review."

  1.  **The Private Pitch:** Meet with the two threatening old-timers individually. Do not mention Dana by name. Say this: *"I'm worried about the future. We are relying on a shrinking group of people to do the physical work. If we don't incentivize the newer neighbors to step up, we will be too old to manage this place in five years. I want to propose a 'Steward' status for you guys so you can oversee the big picture, while letting the people doing the digging decide where the shovel money goes."*
  2.  **Call the Bluff (Gently):** If they say, "We'll quit," you need to respond with reality, not fear. *"I hope it doesn't come to that, because we need your wisdom. But if the association dissolves because we can't adapt, the garden is lost anyway. Is protecting the 10-year rule more important than the garden existing?"*
      *   This forces them to admit if they care more about the *garden* or their *control*. Most will back down when framed that way.
  3.  **The Vote:** When you bring this to the board, ensure Dana is not the one arguing for it. *You* argue for it. Dana should sit quietly or speak only to express gratitude for the "Steward" role. If Dana leads the charge, it becomes a class war. If you lead the charge, it becomes governance.

  ### 5. The Hard Truth
  If you try this compromise and they still threaten to dissolve the association rather than share budgetary control, **let them.**

  This is the part nobody wants to say. If the association dissolves because two people refuse to share power with the person fixing the irrigation, **the association was already a country club, not a community garden.**

  If they quit:
  1.  The association technically dissolves.
  2.  Dana and the other active neighbors form a *new* entity (a land trust or a new HOA).
  3.  You petition the town to transfer management of the park to the new entity.

  It will be messy. It will be awkward at the mailbox for six months. But a garden run by Dana is a garden that exists. A garden run by the old-timers' conditions is a garden waiting to die.

  ### Summary
  *   **Don't fight the rule directly.** Fight the *outcome* of the rule.
  *   **Reframe tenure as "Advisory"** and labor as "Voting."
  *   **You must lead.** If you wait for Dana to fix this, she can't. If you wait for the old-timers to fix this, they won't.
  *   **Accept the risk.** If the organization collapses rather than accept a worker into the voting booth, it wasn't an organization worth saving in its current form.

  You are the pivot point. If you stay silent, the injustice stands. If you push too hard, the group breaks. If you restructure the incentives, you might just save the garden.
