      *   *Refining the "What's actually going on" section:* Use terms like "institutional capture," "sunk cost fallacy," "succession risk."
      *   *Refining the Advice:* Don't just say "talk to them." Say "propose a bylaw amendment that creates a tiered system."
      *   *Addressing the Threat:* If they quit, the association *should* probably dissolve or reform anyway if they value power over the garden. But the user needs to test this without blowing it up.

