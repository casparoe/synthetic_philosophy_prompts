answer: |-
  In a coastal village, potters shape clay vessels they call *kivo*. When a potter points to a lump of wet clay and later to the fired vessel made from it, she asserts, "This *kivo em* that *kivo*." If the vessel breaks, she points to the gathered shards and asserts, "This *kivo em* that *kivo*," but if a shard is lost, she dissents. The particle *em* appears only in these re-identification contexts. The linguist observes no cases where one mass of clay becomes two vessels, nor two masses become one, nor where shards are reconstituted into a vessel; the natives offer no assent or dissent to hypothetical questions about such splits or fusions, treating them as linguistically nonsensical. The stimulus conditions for *kivo* are identical whether pointing to the clay, the pot, or the gathered shards, provided the material continuity is unbroken.

  **Translation Manuals and Compensation**
  **Manual 1 (Enduring Objects):** *Kivo* translates as "pot" (an enduring substance). *Em* translates as the identity predicate "=" (is the same as).
  *   *Logical Form:* $a = b$.
  *   *Compensation:* Predicates like "is wet" or "is broken" are translated as temporary properties of the enduring object. "The *kivo* is wet" becomes $Wet(x)$ where $x$ is the pot. The truth condition for "This *kivo em* that *kivo*" is that the object at $t_1$ is numerically identical to the object at $t_2$.
  **Manual 2 (Temporal Stages):** *Kivo* translates as "pot-stage" (a momentary temporal slice). *Em* translates as the gen-identity relation $R$ (is a temporal successor of / belongs to the same series as).
  *   *Logical Form:* $R(a, b)$.
  *   *Compensation:* Predicates are translated as properties of stages. "The *kivo* is wet" becomes $WetStage(x)$. Crucially, to match M1's truth conditions, M2 must translate the *conditions of assertion* for *em* such that $R(a, b)$ holds exactly when M1's identity holds. Since the natives never encounter fission, $R$ is functionally equivalent to $=$ in this environment. The sentence "This *kivo em* that *kivo*" is true in M2 not because the stages are identical (they are not), but because they stand in the $R$-relation.

  **1. Quine's Indeterminacy Thesis**
  Quine's thesis holds that there is no fact of the matter distinguishing M1 from M2. In this case, indeterminacy **survives**. The feature doing the work is the **absence of fission/fusion cases** in the native's behavioral dispositions. Because the natives never assert or deny *em* in scenarios where numerical identity and gen-identity diverge (e.g., splitting the clay), the stimulus meaning of *em* underdetermines whether it maps to $=$ or $R$.
  *   *Removal Test:* If we add an independent re-identification practice—say, the potters name each vessel (*Kivo-1*, *Kivo-2*) and track them through splitting events—the indeterminacy collapses. If they say "Kivo-1 is now two *kivo*," M1 must translate *kivo* as "clump" (changing the ontology) or admit fission. If they say "Kivo-1 ceased," M1 is vindicated. The naming practice anchors the reference to a specific criterion of identity, removing the holistic slack.

  **2. Principle of Charity**
  A Davidsonian interpreter maximizing agreement and rationality **favors M1**. The feature doing the work is **ontological simplicity**. Attributing enduring objects makes the natives' predictive behavior simpler (they track one object, not a series of stages). M1 renders their beliefs about "the pot" surviving the firing process as true beliefs about persistence. M2 attributes to them a complex metaphysics of stages and series relations that yields the same predictions but posits more entities.
  *   *Removal Test:* If the environment were one of extreme flux (e.g., the pots constantly dissolve and reform), Charity might favor M2, as attributing enduring objects would make the natives' beliefs largely false. Here, stability allows Charity to select M1.

  **3. Causal/Informational Account of Reference**
  A causal theory of reference (e.g., Devitt or early Fodor) **favors M2**. The feature doing the work is **stimulus immediacy**. The causal chain from the world to the utterance *kivo* terminates at the retinal stimulation caused by a specific pot-stage at time $t$. There is no causal link from the *future* pot-stage or the *past* clay to the current utterance except via the current stage. Thus, the term is causally grounded in the stage, not the enduring object.
  *   *Removal Test:* If we add a "historical causal chain" (e.g., a naming ceremony at $t_0$ that fixes the reference for all future stages), the causal account shifts to favor M1. Without such a ritual, the immediate cause dominates, pulling toward stages.

  **Divergence:** Here, Charity and Causal grounding pull in opposite directions. Charity selects M1 (Enduring Objects) for rational simplicity; Causal grounding selects M2 (Stages) for physical immediacy. This confirms that neither principle can uniquely determine translation; they are competing maxims, not truth-trackers.

  **Strongest Attack and Quine's Reply**
  *   **Attack:** "The natives clearly intend to talk about pots, not stages. Their behavior (repairing broken pots, storing them) presupposes an ontology of enduring objects. To translate *kivo* as 'stage' is to misunderstand their form of life."
  *   **Quine's Reply:** "Intentions are not data. 'Presupposing an ontology' is just a way of saying that Manual 1 is more familiar to us. The native's behavior—assenting to *em* under continuity conditions—is fully captured by Manual 2. To claim they 'really mean' objects is to posit a fact of the matter beyond behavioral dispositions. If the evidence (assent/dissent) is identical, the distinction between 'object' and 'stage' is a projection of the translator's grammar, not a feature of the native's world."
