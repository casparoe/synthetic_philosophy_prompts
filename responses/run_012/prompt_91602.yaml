prompt: |-
  Bit of an odd request, but here's where I'm at. I facilitate a standing stakeholder table on a regional river-basin water dispute — three camps, roughly: an irrigators' association, a land-conservation trust, and a tribal nation whose treaty water rights are in play. We've been meeting monthly for about a year, and the strange thing is that all three can sign off on the same package on the numbers and still leave feeling like something was done *to* them rather than *with* them. I've started to suspect the problem isn't the substance, it's that we keep treating "meet in the middle" as if it were a genuine improvement when really it's whoever is loudest getting a discount on what they wanted. A friend in my evening ethics class — we've been doing a unit on whether values can be traded off at all — put a half-formed idea to me: a compromise is only a real compromise, the kind where everyone is actually better off by their own lights, when each side gives up something it ranks *low* in exchange for something it ranks *high*, basically a trade; and that this whole picture only works if there's some common currency of concession, which for values there maybe isn't. I half believe it, but I can't run a philosophy seminar in a room where people have lawyers.

  So what I want from you is a decision procedure I can actually use at the table — something I can walk through in the twenty minutes before a session, without any training in formal decision theory, and that I can say out loud to the parties afterward so it isn't a black box. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure just stops and says no, and where it has to hand the call to a human because the thing being asked is a values question rather than a factual one. I care a lot about two distinctions surviving the trip: (a) the difference between a side ranking something low and a side being *unable* to rank it at all — some things are, for these people, conversation-stoppers, and a procedure that tries to price them is worse than useless; and (b) the difference between a concession that's freely made and one that's just coercion with a nicer name, since a "trade" extracted by the fact that one party can hold the whole basin hostage isn't a gain from trade at all. Then run it on three proposals: a winter-release-for-irrigation-cap package that the irrigators and the trust both like; a "cultural water" allocation that's hard to fit into any of our usual units; and a package where two of the three trade away something the third treats as non-negotiable. At least one of the three should come out as a case where the procedure tells me the deal I personally favor is illegitimate, because if it never bites me it isn't a real test. And be honest in the write-up about which steps are just my judgment dressed up as procedure — I'd rather know where the seams are than have it look cleaner than it is. No need for references, I'll add those if I ever write this up properly.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Facilitator of a regional river-basin water dispute (Irrigators, Land Trust, Tribal Nation). Monthly meetings for a year.
      *   **Problem:** Agreements are reached on numbers, but stakeholders feel acted *upon*, not *with*. "Meet in the middle" feels like coercion/discounting, not genuine trade.
      *   **Theoretical Insight:** A compromise is real only if sides trade low-ranked items for high-ranked items (gains from trade). This requires a common currency, which might not exist for values.
      *   **Goal:** A practical decision procedure (DP) to use at the table.
      *   **Constraints:**
          *   Usable in 20 mins prep.
          *   No formal decision theory training needed.
          *   Transparent (can explain it out loud).
          *   Must distinguish between "ranking low" vs. "unable to rank" (sacred/protected values).
          *   Must distinguish between "free concession" vs. "coercion/hostage-taking."
          *   Must admit where human judgment overrides procedure.
      *   **Task:** Create the DP, then test it on three specific proposals (Winter-release/Irrigation-cap, Cultural Water, Two-vs-One Non-negotiable).
      *   **Requirement:** At least one test case must fail the facilitator's personal preference to prove the DP has teeth.

  2.  **Deconstruct the Core Ethical/Practical Tension:**
      *   *Utilitarian/Deal-making view:* Split the difference, maximize total utility.
      *   *Deontological/Values view:* Some things are not for sale (treaty rights, sacred sites).
      *   *Power Dynamics:* Who holds the leverage? (Irrigators have infrastructure, Tribe has legal/treaty rights, Trust has public opinion/regulatory leverage).
      *   *The "Friend's Idea":* Comparative advantage in concessions. I give up what costs me little but gives you much.
      *   *The Facilitator's Worry:* Is this just "coercion with a nicer name"?

  3.  **Drafting the Decision Procedure (The "Water-Table Test"):**
      *   *Name:* Needs to sound practical, not academic. "The Concession Integrity Check"? "The Trade-Off Transparency Protocol"? Let's go with **The Concession Integrity Protocol (CIP)**.
      *   *Structure:* Needs to be a flowchart or step-by-step questionnaire.
      *   *Step 1: Identification.* What is being traded?
      *   *Step 2: Valuation (The "Low vs. Sacred" distinction).* Can this be ranked?
      *   *Step 3: Power/Coercion Check.* Is this trade voluntary or forced by leverage?
      *   *Step 4: Reciprocity.* Is everyone giving and getting something they value differently?
      *   *Step 5: The "Sleep Test" (Human Judgment).* Where the facilitator steps in.

      *Refining the Steps for the Prompt's Constraints:*
      *   Need to explicitly handle the "unable to rank" issue (Sacred Values).
      *   Need to explicitly handle the "coercion" issue (BATNA/Walk-away power).
      *   Need to be transparent.

      *Drafting the Steps:*
      1.  **Map the Exchange:** What does X give? What does Y get?
      2.  **The Commensurability Check:** Can X actually value what they are giving up on the same scale as what they get? (Addresses "unable to rank").
      3.  **The Leverage Audit:** Is X giving this up because they want to, or because Y holds a gun to their head? (Addresses coercion).
      4.  **The Asymmetry Check:** Does X value what they get > what they give, AND does Y value what they get > what they give? (The "Gains from Trade" condition).
      5.  **The Facilitator's Veto:** Where judgment overrides.

  4.  **Developing the Test Cases:**
      *   *Case 1: Winter-release-for-irrigation-cap.* (Irrigators & Trust like it).
          *   *Dynamics:* Irrigators limit summer use (high cost?) for guaranteed winter flow (low cost to them, high to fish/Trust).
          *   *Potential Failure:* Is the cap coercive? Is the winter release sacred to the Tribe (who aren't mentioned as liking it)?
          *   *Goal:* Make this one pass or fail based on the logic. Let's make it *pass* but barely, or fail on the Tribe's exclusion. Let's make it **Pass** on the trade logic but **Fail** on the inclusion logic (procedural justice). Actually, the prompt asks to run it on the *proposal*. Let's make this one the "Legitimate Compromise."
      *   *Case 2: "Cultural Water" allocation.* (Hard to fit units).
          *   *Dynamics:* Tribe wants water for spiritual/cultural reasons, not economic. Irrigators want to quantify it.
          *   *Goal:* This must trigger the "Unable to Rank" stop. This is the "Sacred Value" test.
          *   *Outcome:* **Stop/No Deal** under current framework. Requires reframing.
      *   *Case 3: Two-vs-One Non-negotiable.* (Two trade away something the third treats as non-negotiable).
          *   *Dynamics:* Irrigators + Trust agree on something that violates Treaty Rights (Tribe).
          *   *Goal:* This must trigger the "Coercion/Power" stop or the "Sacred Value" stop.
          *   *Requirement:* "At least one of the three should come out as a case where the procedure tells me the deal I personally favor is illegitimate."
          *   *Strategy:* I (the facilitator) probably want the deal in Case 3 because it solves the "numbers" problem. The DP must kill it.

  5.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is Step 3 (Leverage) too subjective?
      *   *Fix:* Acknowledge the subjectivity. The prompt asks me to be honest about where judgment dresses up as procedure. I will explicitly label the "Judgment Seams."
      *   *Critique:* How to handle the "unable to rank" distinction practically?
      *   *Fix:* Use a specific question: "If the price doubled, would you still refuse?" If yes, it's a protected value, not a tradeable commodity.

  6.  **Finalizing the Write-up Structure:**
      *   **Introduction:** Acknowledge the insight (compromise as trade, not splitting differences).
      *   **The Protocol:** Step-by-step questions, stop conditions, and "Judgment Seams."
      *   **The Test Runs:** Apply to the three scenarios.
      *   **Reflection:** Honest assessment of limitations.

  7.  **Addressing Specific Prompt Requirements:**
      *   *20 mins prep?* Keep the questions sharp.
      *   *Say out loud?* Language must be plain English, not jargon.
      *   *Distinction (a) Low Rank vs. Unable to Rank?* Built into Step 2.
      *   *Distinction (b) Free vs. Coercion?* Built into Step 3.
      *   *One deal I favor must fail?* I will ensure Case 3 is the one I want (for stability) but the DP kills it.
      *   *Honest about seams?* Add a specific section on "Where the Machine Leaks."

  8.  **Drafting the Content (Iterative refinement):**
      *   *Protocol Name:* The "Integrity of Concession" Check.
      *   *Step 1:* Define the Unit. (What are we trading?)
      *   *Step 2:* The Sacredness Filter. (Can this be priced?)
      *   *Step 3:* The Power Audit. (Is this voluntary?)
      *   *Step 4:* The Gain Verification. (Do both sides actually gain?)
      *   *Test Case 1 (Winter/Cap):* Passes. It's a technical trade.
      *   *Test Case 2 (Cultural Water):* Fails Step 2. Cannot be quantified.
      *   *Test Case 3 (2-vs-1 Treaty):* Fails Step 3 (Coercion) or Step 2 (Sacred). I'll make it fail Step 3 primarily, as it highlights the power dynamic. *Correction:* To ensure it bites *me*, I need to admit I want this deal to move forward. The DP says "No."

      *(Self-Correction on Case 3)*: The prompt says "a package where two of the three trade away something the third treats as non-negotiable." If the third treats it as non-negotiable (Sacred), and the other two trade it away, that's a violation of the Sacredness Filter for the third party. But the trade is between the *two*. The issue is the impact on the third. This is a "Negative Externality" problem. The DP needs to check if a trade *imposes* a sacred cost on a non-consenting party. That's a strong veto condition.

      *Let's refine the "Coercion" aspect.* If the Tribe has treaty rights, and the other two ignore them, that's not coercion *on* the Tribe by the others, that's the others coercing the reality. But if the Tribe is forced to accept less because the other two have more political power, that's coercion. Let's focus on the "Hostage" aspect mentioned in the prompt. "A trade extracted by the fact that one party can hold the whole basin hostage."
      Okay, let's look at Case 3 again. Two parties trade away something the third treats as non-negotiable. This implies the third is being overridden. If I (facilitator) like this deal because it "unblocks" the process, the DP must stop it.
      *Decision:* I will make Case 3 fail on the "Imposed Sacred Cost" rule.

  9.  **Final Polish:** Check tone. Needs to be professional, empathetic, but rigorous. No academic references. Clear headers.

      *(Final check on the "Judgment Seams")*: I need to explicitly point out where *I* decide if a value is sacred or if leverage is coercive. That's the "honesty" part.

      *(Final check on "20 mins prep")*: The questions need to be interview-style, not survey-style. I ask them privately before the session.

      *Let's write it.*
answer: |-
  Here is a decision procedure designed for your specific context. It is built to distinguish between *trading* (gains from exchange) and *capitulation* (losses disguised as compromise), while explicitly flagging where your own judgment is doing the heavy lifting.

  I call this **The Concession Integrity Protocol (CIP)**.

  It is designed to be run in private pre-meetings (the 20 minutes you have) and then summarized openly at the table. It has four gates. If a proposal fails any gate, it cannot be ratified as a "compromise." It is either a coercion, a violation of protected values, or a miscalculation.

  ### The Concession Integrity Protocol (CIP)

  **Preparation:** You must ask these questions of each stakeholder representative privately before the joint session. Do not ask the group; ask the individuals.

  #### Gate 1: The Commensurability Check (The "Price" Test)
  *Goal: Distinguish between "ranking low" and "unable to rank."*

  **The Question:** "Regarding the item you are being asked to give up: If the other side offered you double the benefit you're currently getting in return, would you still refuse? Or is there a price at which you would say yes?"

  *   **Sufficient Answer for "Trade":** "Yes, if they gave me X, I would do it." (This confirms the value is ranked, not sacred).
  *   **Stop Condition:** "No. This is not for sale at any price." (This indicates a **Protected Value**).
  *   **Procedure:** If any party identifies a Protected Value involved in the trade, the proposal stops. You cannot trade sacred values for secular benefits without destroying the integrity of the process.
  *   **Judgment Seam:** You must decide if they are bluffing. If they say "It's sacred" but their eyes say "Pay me more," you have to call that. There is no formula for this.

  #### Gate 2: The Leverage Audit (The "Hostage" Test)
  *Goal: Distinguish between "free concession" and "coercion."*

  **The Question:** "Are you making this concession because you see value in the return, or because you are afraid of what happens if you don't (e.g., litigation, shutdown, public shaming)?"

  *   **Sufficient Answer for "Trade":** "I prefer the return package over the status quo, even if the threat wasn't there."
  *   **Stop Condition:** "I am only signing this because they can shut us down/stop the flow/sue us into oblivion."
  *   **Procedure:** If a concession is driven primarily by the threat of a veto or harm from another party (holding the basin hostage), it is not a trade; it is protection money. The deal is flagged as **Coercive**.
  *   **Judgment Seam:** Everyone is under some pressure. You must judge the *degree*. Is the pressure a normal consequence of scarcity, or is it a weaponized leverage point unrelated to the resource itself?

  #### Gate 3: The Asymmetry Verification (The "Gain" Test)
  *Goal: Ensure everyone is actually better off by their own lights.*

  **The Question:** "On a scale of 1 to 10, how much do you value what you are giving up? On the same scale, how much do you value what you are getting?"

  *   **Sufficient Answer for "Trade":** "I value what I give at a 3, and what I get at a 7." (Positive sum for that party).
  *   **Stop Condition:** "I value what I give at a 7, and what I get at a 4, but I'm doing it to be nice/to end the meeting."
  *   **Procedure:** If any party is taking a net loss on their own valuation scale to "keep the peace," this is **Capitulation**, not compromise. The deal stops.
  *   **Judgment Seam:** People lie to look reasonable. You have to gauge sincerity. Also, you must ensure they are using the same internal scale (i.e., ensure a "7" for the Tribe isn't incomparable to a "7" for the Irrigators).

  #### Gate 4: The Externality Veto (The "Third Party" Test)
  *Goal: Prevent two parties from trading away a third party's non-negotiables.*

  **The Question:** "Does this exchange impose a cost on the absent party (or the third person at the table) that they have already identified as a Protected Value (see Gate 1)?"

  *   **Sufficient Answer for "Trade":** "No, this affects us only."
  *   **Stop Condition:** "Yes, we are trading X for Y, but that changes the water quality/rights for the Tribe, which they said was sacred."
  *   **Procedure:** If two parties trade in a way that violates a Protected Value of a third party, the deal is **Illegitimate**.
  *   **Judgment Seam:** You must determine if the impact is material or theoretical.

  ***

  ### Where the Machine Leaks (Honesty Clause)
  *Read this aloud to the stakeholders if they ask how you arrived at a conclusion.*

  "I am using a protocol to check if our deals are real trades or just pressure. But I need to be clear: I am the one deciding if you are bluffing about a value being sacred (Gate 1), and I am the one deciding if your pressure is normal negotiation or weaponized coercion (Gate 2). If I say a deal fails, it is not because the math is wrong; it is because I judge the integrity of the concession to be broken. You can appeal my judgment, but you cannot appeal the rule."

  ***

  ### Test Runs

  Here is the CIP applied to your three scenarios.

  #### Case 1: The Winter-Release-for-Irrigation-Cap Package
  *   **Proposal:** Irrigators agree to cap summer withdrawals (high operational cost). Land Trust agrees to fund winter reservoir releases (low cost to Trust, high value to ecosystem). Tribe is neutral.
  *   **Gate 1 (Commensurability):** Irrigators say, "We hate the cap, but if the funding is high enough, we can retrofit." (Rankable). Trust says, "Funding is easy for us." (Rankable). **Pass.**
  *   **Gate 2 (Leverage):** Irrigators admit, "If we don't sign, the Trust goes to the media." However, they also admit, "The retrofit helps us long-term anyway." **Pass** (Mixed motive, but gain exists).
  *   **Gate 3 (Asymmetry):** Irrigators: Give 6, Get 7. Trust: Give 2, Get 9. **Pass.**
  *   **Gate 4 (Externality):** Tribe confirms winter flows do not harm treaty rights. **Pass.**
  *   **CIP Verdict:** **Legitimate Compromise.**
  *   **Facilitator Note:** This is the "boring" good deal. It works because the costs and benefits are technical and commensurable.

  #### Case 2: The "Cultural Water" Allocation
  *   **Proposal:** A specific volume of water is set aside for the Tribal Nation for "cultural use" (ceremony, salmon spiritual health), quantified in acre-feet.
  *   **Gate 1 (Commensurability):** You ask the Tribe: "If the Irrigators offered double the acre-feet, would you accept less protection for the salmon spawning grounds linked to this water?"
      *   **Tribe Answer:** "No. The water *is* the relation. You cannot add more water to fix a broken relation. This is not a commodity."
      *   **Result:** **Stop Condition Triggered.**
  *   **CIP Verdict:** **No Deal.**
  *   **Facilitator Note:** The procedure correctly identifies that trying to fit this into a "trade" framework violates the Tribe's ontology. The numbers might work, but the *form* of the agreement is the injury. You cannot facilitate this as a trade; you must facilitate it as a recognition of right, which is a different conversation.

  #### Case 3: The Two-vs-One Non-Negotiable
  *   **Proposal:** Irrigators and Land Trust agree on a dam modification that improves irrigation reliability and conservation metrics. The Tribal Nation objects, stating the modification floods a burial site (Treaty-protected). The other two argue the economic benefit to the region outweighs the risk, and they have the votes to approve it.
  *   **My Personal Preference:** I want this deal. It solves the regional economic stalemate, keeps the Irrigators at the table, and the Trust gets a major win. I am tempted to call it a "hard choice" and move on.
  *   **Gate 1 (Commensurability):** Tribe states: "Flooding the site is not rankable. It is a Protected Value." **Stop Condition.**
  *   **Gate 4 (Externality):** Even if we ignore Gate 1, the deal is between Irrigators and Trust. The cost is imposed on the Tribe.
      *   **Question:** "Does this trade impose a Protected Value cost on the third party?"
      *   **Answer:** Yes.
      *   **Result:** **Stop Condition.**
  *   **CIP Verdict:** **Illegitimate.**
  *   **Facilitator Note:** This is the test case where the protocol bites me. I want the regional stability this deal brings. But the CIP flags this as two parties trading away a third party's sacred value. Under the protocol, I cannot put this on the consent agenda. If I do, I am facilitating a violation, not a compromise.

  ### Summary of Limitations
  You asked me to be honest about where the seams are. Here they are:

  1.  **The Bluff Detection (Gate 1):** The protocol relies on stakeholders telling the truth about whether something is "sacred." A savvy negotiator might claim a value is sacred to block a trade, when they actually just want more money. I have to judge that. There is no algorithm for sincerity.
  2.  **The Coercion Threshold (Gate 2):** All negotiation involves leverage. The protocol asks me to distinguish "normal leverage" from "hostage-taking." That is a moral judgment, not a factual one. I have to own that.
  3.  **The Scale Calibration (Gate 3):** When the Irrigators say "7" and the Tribe says "7," they may not mean the same intensity. The protocol pretends these are comparable. They aren't. I have to bridge that gap with interpretation.

  **How to use this tomorrow:**
  Print the four Gates. Before the meeting, take each rep aside for 5 minutes. Run the questions. If a proposal fails a gate, do not bring it to the vote. Say: *"I ran the Concession Integrity Check. This proposal failed Gate [X]. That means under our rules, this isn't a trade, it's a [violation/coercion/capitulation]. We can't sign it unless we restructure it to pass the gate."*

  This moves the conflict from "Do you like this number?" to "Is this a legitimate agreement?" which is where your actual problem lies.
