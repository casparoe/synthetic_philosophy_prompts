answer: |-
  ### Examination Question

  **Case: Lena and Osei's Ferry**
  Lena is stranded on the near bank of a river, and the only crossing is Osei's ferry. Osei charges nothing and has no means of enforcing payment. He carries a passenger only if, at the moment of boarding, he judges that the passenger is the sort of person who would pay him on the far bank. Osei is an excellent judge of character, and no one can feign the disposition in his presence. Lena does not have the disposition, and she has two ways across. First, she can complete a demanding programme of moral formation, which is known to be reliable and which would cost her a great deal; it would make her into the sort of person who pays. Second, she can post a bond with a guarantor whom Osei trusts; the bond is forfeit unless she pays Osei on the far bank.

  **Essay Prompt**
  Analyze Lena's situation by addressing the following three points in order:
  1.  For *each* route (moral formation and bond), determine whether paying Osei on the far bank is the act that best serves Lena's interests *at the moment she arrives there*, and whether choosing that route was rational for her *beforehand*.
  2.  The bond is an external commitment device that makes paying instrumentally rational. Does its availability show that the first route contains no genuine irrationality—that what looks like irrationality there is merely the price of a cruder commitment technology—or is something genuinely irrational left over in the first route that the bond does not capture?
  3.  Suppose the guarantor's fee rises above the cost of the moral formation programme. What does Lena do, and what does that comparison reveal about the relationship between rationality and the availability of commitment technologies?

  *Note: Answers that simply recite Parfit's Hitchhiker, label parties as causal or evidential decision theorists, or assert that a disposition is a commitment device without explaining the mechanism of preference transformation will receive failing grades.*

  ***

  ### Model Answer

  The Lena case forces a distinction between *ex ante* rationality (choosing a path) and *ex post* rationality (acting upon arrival). In both routes, choosing to cross is *ex ante* rational provided the cost of crossing (formation or bond) is less than the value of being on the far bank. However, the status of the payment act on the far bank differs fundamentally between the two routes.

  Regarding the bond, paying Osei on the far bank is *ex post* rational. Although Lena would prefer to keep the money, the threat of forfeiture makes payment the utility-maximizing act. The bond aligns her immediate incentives with her prior plan. Regarding moral formation, paying is *ex post* irrational in terms of her original preferences, as the payment costs utility with no remaining threat. However, because the formation programme has transformed her preferences, she now *wants* to pay. Thus, she is not acting against her current interests, even if she is acting against her past interests.

  This leads to the crux: does the bond's existence prove the first route involves no genuine irrationality, merely a technological deficit? No. The bond manages time-inconsistency by altering consequences; moral formation manages it by altering the agent. If we view rationality solely as the efficient satisfaction of fixed preferences, the bond is superior because it preserves the agent's original desires while securing the outcome. However, if rationality includes the coherence of the agent over time, the formation route resolves the irrationality rather than patching it. In the bond scenario, Lena remains a person who *would* defect if she could; the irrational disposition remains, merely constrained. In the formation scenario, the disposition to defect is extinguished. The "irrationality" in the first route is not a residual defect but a dissolved conflict. The bond treats the symptom; the formation treats the condition.

  Finally, consider if the guarantor's fee exceeds the cost of moral formation. A strictly instrumental agent, viewing dispositions merely as tools, should choose the cheaper option to secure the crossing. If Lena chooses the more expensive bond, she is irrational. But if she chooses the cheaper moral formation, she reveals that internal consistency is itself a rational good. This comparison demonstrates that commitment technologies are not neutral substitutes. External devices (bonds) incur transaction costs to constrain a fractured self. Internal devices (formation) incur transformation costs to unify the self.

  When internal transformation is cheaper than external constraint, rationality demands self-constitution over self-binding. This reveals that practical rationality is not merely about finding the cheapest way to satisfy static preferences despite oneself. It is also about the rationality of the preferences themselves. If it is cheaper to become the sort of person who keeps promises than to be forced to keep them, then the "irrationality" of paying without enforcement was never a necessary feature of rationality; it was a feature of a specific, unrefined agent constitution. Therefore, the availability of the bond does not render the formation route technologically crude; rather, the cost comparison shows that rational agency often requires the efficient alignment of motivation and action, not just the external manipulation of consequences. The rational agent minimizes the total cost of cooperation, which includes the cost of maintaining the disposition to cooperate.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Ex Ante / Ex Post Analysis (8 Marks)**
  *   **4 Marks:** Correctly identifies that for the **Bond**, paying is *ex post* rational (due to penalty) and *ex ante* rational (if cost < benefit).
      *   *Common Error:* Claiming paying is *ex post* irrational for the bond because Lena "doesn't want to pay," ignoring the penalty structure.
  *   **4 Marks:** Correctly identifies that for **Formation**, paying is *ex post* consistent with new preferences but contrary to original interests, while *ex ante* rationality depends on the cost of formation.
      *   *Common Error:* Asserting paying is *ex post* irrational for Formation without acknowledging the preference transformation solves the conflict.

  **2. The Crux: Internal vs. External Commitment (6 Marks)**
  *   **6 Marks:** Argues that the bond leaves the irrational disposition intact (constrained), whereas formation dissolves the irrationality (constituted). Must distinguish acting against interests (Bond) from acting on transformed preferences (Formation).
      *   *Common Error:* Treating the disposition merely as another "tool" without explaining how preference transformation differs from external constraint.
      *   *Common Error:* Claiming the bond proves Formation is obsolete technology, failing to see the residual disposition in the Bond case.

  **3. Fee Comparison and Implications (4 Marks)**
  *   **4 Marks:** Concludes that if Formation is cheaper, rationality favors it. Explains this shows rationality involves minimizing the cost of agency/coherence, not just satisfying static preferences.
      *   *Common Error:* Stating Lena chooses the cheaper option but failing to explain what this implies about the nature of rationality (e.g., failing to mention self-constitution).

  **4. Clarity and Constraints (2 Marks)**
  *   **2 Marks:** Adheres to negative constraints (no CDT/EDT labels, no canned Hitchhiker summaries) and writes clearly.
      *   *Common Error:* Using "Causal Decision Theory" or "Evidential Decision Theory" as shorthand for the analysis.
