      *   (6) Imperatives: Accurate (logic of commands).
      *   *Missing Move:* **Mark Schroeder's "Hybrid Expressivism" / "B-Desires" (Being For).** This is a huge development in the last 15 years. It attempts to solve F-G for *pure* expressivism by reanalyzing the attitude itself (being for) rather than adding beliefs or higher-order attitudes. This is arguably the current state-of-the-art for pure expressivism.

