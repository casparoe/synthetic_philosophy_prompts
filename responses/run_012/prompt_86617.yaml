      *   *Correction on Bus Idea:* Be careful not to say it's *identical* to Gibbard. Gibbard is about *planning*, not just modal operators. But semantically, they look similar.
      *   *Missing Move:* Make sure to mention Schroeder's *Being For*. It's the specific technical fix for F-G within expressivism that dominates current literature.

