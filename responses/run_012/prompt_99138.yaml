      *   *Material Necessity:* Things happen because of the nature of the matter (e.g., fire burns, stones fall). If you just look at the materials, you get a chain of efficient causes.
      *   *Hypothetical Necessity:* If $X$ (the end/form) is to exist, then $Y$ (the matter/process) *must* exist. It's conditional. "If there is to be a house, there must be bricks."
      *   *The "For-the-Sake-Of" (Final Cause):* This isn't magic future-to-present causation. It's about explanation. The efficient cause (mason pushing) explains *how* the wall gets built, but the final cause (the wall as a shelter) explains *why* the mason is pushing stones *in this specific arrangement* rather than randomly piling them.
      *   *Nature as Art:* Aristotle analogizes nature to art (craft). Art acts for an end. Nature does too. The end determines the organization of the matter.
