      *   *Does he fit CR?* No, because mere accidental utility doesn't count as a "nature" unless it's regular and for the sake of the organism's good.
      *   *Crucial Distinction:* Modern debates are often about *meaning* of the word "function." Aristotle is asking about *explanation*. Why is this here?

