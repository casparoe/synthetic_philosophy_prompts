  I would assign this answer a B+.

  *   **Hume (Accurate):** The student correctly identifies promising as an "artificial virtue" grounded in convention and utility rather than natural duty. The explanation of the coordination problem and the role of sentiment in sustaining the convention is precise and appropriate for an upper-level course.
  *   **Kant (Accurate):** The summary of the Categorical Imperative and the universalizability test is standard and correct. The student correctly notes that for Kant, the duty is strict and independent of consequences, which is the key differentiator needed for the comparative part of the essay.
  *   **Scanlon (Significant Conceptual Error):** The student starts correctly by defining contractualism as principles "no one could reasonably reject." However, the final sentence of this paragraph contains a serious theoretical mistake: "This makes Scanlon's view a version of social contract theory: the principle of fidelity is binding because we have implicitly agreed to the social practice of promising." Scanlon explicitly distinguishes his contractualism from traditional social contract theory and conventionalism (like Hume's). For Scanlon, the obligation does not arise from an implicit agreement to a *social practice*, but from the interpersonal wrong done to the specific promisee when you manipulate their expectations. The binding force comes from the principle governing the interaction, not the convention itself. This mischaracterizes the source of the obligation, which was the core of the question ("Explain why promises bind").
  *   **Comparative Assessment (Strong):** The evaluation of the "secret promise-breaker" case is insightful. The student correctly identifies that Hume struggles with undetected violations (since the convention isn't empirically damaged) and that Kant can seem too formal. The argument that Scanlon best captures the "relational wrong" is a sophisticated and defensible position in contemporary moral philosophy.
  *   **Overall Justification:** The answer demonstrates a strong grasp of the comparative dynamics and two of the three theorists. However, the conflation of Scanlon's contractualism with social contract theory/conventionalism is a substantive error in an upper-level seminar. It undermines the explanation of *why* the promise binds for Scanlon, even though the student correctly applies the theory to the case study. The B+ reflects the high quality of the analysis while penalizing the theoretical imprecision on Scanlon.
