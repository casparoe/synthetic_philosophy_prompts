answer: |-
  hey, i've been thinking about this all week too, mostly because you're right that something feels hollow in the way we talk about this now. it's interesting you brought up sor juana specifically, because i think she cuts through the noise in a way that almost no one else does. if you drop her into 2024, i don't think she'd be shocked by the technology or even the politics exactly, but i think she'd be deeply unsettled by the vocabulary we use to justify a woman's mind. she spent her life arguing that the intellect was a divine gift and that suppressing it was an insult to the creator, not an economic inefficiency. so when she hears us talking about stem pipelines or gdp growth or closing the wage gap, i think she'd hear that as a kind of surrender. not because those things aren't important, but because they treat the mind as a tool for the market rather than a vessel for truth. she'd probably see our modern arguments as a sellout, but a necessary one, like watching someone bargain with a jailer using coins instead of keys. she knows we live in a world that won't listen to metaphysics, so she might understand why we speak the language of money, but she'd mourn that we've forgotten how to say that a woman deserves to know things simply because she exists.

  and on the women's college question, i think she'd feel a very specific kinship with the struggle those institutions are having. for her, the convent wasn't just a place to live; it was a fortress that allowed her to think without the constant performance of femininity required by the court. she needed walls to be free. so she'd look at these colleges struggling to justify their existence and see the tragedy of it. she'd understand why they're failing too, because they're trying to justify themselves using the same instrumental logic that makes them seem obsolete. if you argue that a women's college is good because it produces better female engineers, you've already accepted the premise that the only value is the engineering output. sor juana would argue that the value is the space itself, the permission to be uninterruptedly intellectual. she'd likely tell your niece that the choice isn't about which degree looks better on a resume, but which environment offers the most resistance to the erosion of her curiosity. she'd worry that the big state school might grind her down into just another unit of production, whereas the women's college might protect the part of her that asks why.

  the gender politics piece is where it gets messy, though. you mentioned the terf versus handmaiden trap, and i think sor juana would be baffled by the intensity of the semantic wars while simultaneously understanding the stakes. she lived in a world where gender roles were rigidly enforced by theology and law, yet she managed to carve out a space where she was effectively treated as a man intellectually while remaining a woman religiously. she wore men's clothing to attend university when she was young, not to make a political statement, but to remove an obstacle to learning. so she wouldn't care about the labels we use now, but she would be horrified by the way the debate has become a weapon used to silence women rather than empower them. if she saw women being branded traitors for wanting single-sex spaces, she'd recognize the irony immediately. she spent her life defending her right to be a woman who thinks, and to see that definition turned into a cage that prevents women from gathering alone would strike her as a betrayal of the very liberty she fought for. she'd probably say that if the definition of womanhood excludes the right to intellectual sanctuary, then the definition is broken, not the sanctuary.

  then there's the ai thing, which is the biggest twist. sor juana fought against scarcity. she begged for books, she hoarded instruments, she starved herself to buy time to read. now your niece has the sum of human knowledge in her pocket for free. i think sor juana would view this with suspicion. she knew that access wasn't the same as understanding. she'd look at these ai tutors and see a danger we aren't talking about, which is that when information is free, the only barrier left is discipline, and we haven't taught girls how to be disciplined, only how to be compliant. she'd worry that easy answers would atrophy the will required to seek hard truths. the barrier for her was the locked door; the barrier now is the open door that leads nowhere. she'd tell your niece that having a tutor in your pocket doesn't mean you're educated, it just means you're informed, and that the work of becoming a thinker is harder now because no one forces you to do it anymore.

  so would she recognize what we call education? i'm not sure. she'd see the credentialing, the debt, the job placement rates, and she'd think we've traded the thing itself for its shadow. she'd see us optimizing for employability instead of enlightenment. but she wouldn't be naive enough to tell your niece to ignore the job market. she was practical enough to know that even a nun needs patrons to keep her library open. she'd probably advise your sister that the degree gets the job, yes, but the education keeps the soul alive during the job. and she'd tell your niece to choose the place where she is most likely to remain dangerous to the status quo, because that's where the real learning happens. ultimately, i think sor juana would say that arguing about whether women's education is good for the economy is like arguing whether breathing is good for productivity. it misses the point that you breathe because you're alive, and you learn because you're human. if your niece goes to the state school, she'll be an engineer. if she goes to the women's college, she might still be an engineer, but she'd be one who remembers that her mind belongs to her first and to the market second. that's the distinction sor juana would fight for, even if she had to write a letter to a bishop to explain it.
