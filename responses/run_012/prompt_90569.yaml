answer: |-
  ### 1. The Essay Question

  **Time Allowed: 90 Minutes**

  **Question:**

  Consider the following case (**The Crowded Pond**):

  > A child is drowning in a shallow pond. Sixty adults stand on the bank. The water is shallow, the child is close to the edge, and any one of the sixty could wade in and pull the child out in under a minute; the only cost to whoever does it is a soaked coat and a ruined phone. But the bank narrows to a single channel at the point nearest the child, and the entry is abrupt: whoever steps off the bank must commit at once, and two or more people entering at the same time collide in the channel, are carried into a side current, and fail, leaving the child to drown. No one has been designated as rescuer, no one has authority to organise the group, and there is no time to do so; each knows all of this. The child will drown in four minutes.

  Write an essay that addresses the following three tasks:

  1.  **Analyze the Solitary Case:** Set out the necessary conditions under which a bystander is obligated to rescue a drowning child when they are the *only* person present. Do not merely list features of the example; explain which features do the normative work in generating the duty.
  2.  **Analyze the Crowded Case:** Determine whether an obligation to rescue exists in *The Crowded Pond* scenario. If it exists, does it apply to all sixty bystanders equally, or only to some? Defend your verdict against the risk of collision.
  3.  **Global Implications:** Does the problem of global poverty structurally resemble the Solitary Pond or the Crowded Pond? Explain how this classification alters the moral obligations of individual affluent agents compared to the standard argument.

  ***

  ### 2. Model Answer

  **Student Candidate: [Redacted]**
  **Word Count: 595**

  The moral force of the standard drowning child argument relies on specific structural conditions, not merely the presence of suffering. In the solitary case, the obligation to rescue is generated by the convergence of three conditions: capacity, cost, and sufficiency. Capacity and low cost establish that the sacrifice is reasonable; the agent can save the life without losing anything of comparable moral significance. However, the condition that does the heaviest argumentative work is sufficiency. In the solitary case, my action guarantees the outcome. If I act, the child lives; if I do not, the child dies. There is no gap between my intention and the result, and no dependency on the actions of others. The duty exists because the agent is a sufficient condition for the prevention of harm.

  In *The Crowded Pond*, the condition of sufficiency is fractured. Here, my action guarantees the child's survival *only if* no one else acts. If I act and another also acts, the collision ensures the child dies. This introduces epistemic uncertainty and interactive risk. Does the duty survive? I argue that the duty persists but transforms from a duty to *act* into a duty to *secure the act*. Since coordination is impossible, the only mechanism to secure the act is to act immediately and decisively. Hesitation increases the likelihood that multiple people will hesitate and then jump simultaneously later, or that no one jumps at all.

  Therefore, the obligation applies to all sixty bystanders, but it is dischargeable by only one. This creates a paradox where everyone is obligated to be the single rescuer. To resolve the collision risk, the moral requirement must include a convention of immediacy: the first to commit discharges the duty for all. To hesitate is to gamble with the child's life against the probability of collision. While acting risks collision, inaction guarantees death if everyone reasons similarly. Thus, the rational moral strategy is to act immediately, accepting the risk of collision as the lesser evil compared to the certainty of collective inaction. The obligation is not diminished by the crowd; rather, the urgency is heightened because the margin for error is zero.

  This distinction fundamentally alters the application to global poverty. The standard Singerian argument treats poverty like the Solitary Pond: my donation saves a life, full stop. However, the real world resembles *The Crowded Pond*. There are millions of potential donors (the sixty adults). While donations do not physically collide, uncoordinated individual aid often suffers from inefficacy similar to the channel collision. Duplication of effort, ignoring local infrastructure, or funding conflicting projects can render individual contributions ineffective or even harmful, much like the rescuers blocking the channel.

  If poverty is a Crowded Pond, the individual's duty to give directly is complicated. My donation is only sufficient if it fills a gap no one else is filling. This suggests that the primary obligation for affluent agents is not merely to transfer resources, but to support institutions that coordinate aid, effectively widening the channel so multiple rescuers can enter without collision. The individual duty remains, but it shifts from a direct duty of rescue to a duty to create the conditions under which rescue is efficacious. We are not just donors; we are participants in a coordination problem where uncoordinated virtue can lead to collective failure.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20 (5 Criteria × 4 Marks)**

  **1. Identification of 'Sufficiency' in the Solitary Case (4 Marks)**
  *   **Requirement:** Candidate must identify that in the solitary case, the agent's action is a *sufficient condition* for the child's survival (i.e., action guarantees success).
  *   **Common Error:** Candidates list "proximity" or "empathy" as the source of the duty, or treat "low cost" as the sole generator of the obligation without mentioning efficacy.

  **2. Identification of 'Capacity' and 'Cost' Conditions (4 Marks)**
  *   **Requirement:** Candidate must articulate that the agent must have the physical ability to help and that the sacrifice must not be of comparable moral significance to the life saved.
  *   **Common Error:** Candidates treat these as empirical details of the story rather than normative conditions that *generate* the duty (e.g., failing to explain *why* the cost matters).

  **3. Analysis of the 'Collision' Constraint (4 Marks)**
  *   **Requirement:** Candidate must explain how the presence of others changes the efficacy of the act (i.e., action + action = failure). The answer must address the interactive nature of the risk.
  *   **Common Error:** Candidates treat the sixty people as sixty independent solitary rescuers, ignoring the constraint that simultaneous action causes failure.

  **4. Defended Verdict on Obligation Distribution (4 Marks)**
  *   **Requirement:** Candidate must take a clear stance on who is obligated (e.g., all, one, none) and justify how this verdict manages the risk of collision (e.g., via immediacy, lottery, or conditional duty).
  *   **Common Error:** Candidates argue the duty vanishes entirely because the outcome is uncertain, or they assert a duty without explaining how to avoid the collision they just identified.

  **5. Global Poverty Analogy (4 Marks)**
  *   **Requirement:** Candidate must classify global poverty as resembling the Crowded Pond (many agents, coordination issues) and explain how this weakens or modifies the direct individual duty to give.
  *   **Common Error:** Candidates simply assert "poverty is like the pond" without distinguishing between the solitary and crowded structures, or they revert to standard institutional objections without linking back to the collision mechanic.

  **Responses That Look Impressive But Earn No Credit:**
  *   **Name-Dropping:** Extensive citation of Singer, Scanlon, or Rawls without applying their concepts to the specific mechanics of the "channel collision." (Violates the constraint to assess reasoning, not recall).
  *   **The "Tragedy of the Commons" Label:** Using this phrase as a substitute for analyzing the specific collision constraint. (This is a coordination failure, but the label alone does not explain the moral obligation).
  *   **Institutional Dismissal:** Arguing "we just need a government to solve this" without addressing what the *individuals* in the scenario (or the exam) are obligated to do *in the absence* of that authority. (The question asks for individual obligation under non-ideal conditions).
