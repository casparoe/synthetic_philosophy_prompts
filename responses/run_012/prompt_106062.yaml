      *   *Correction:* The prompt asks: "Things I want on the list, or at least want you to tell me whether they belong." I should structure the Spec *around* these questions to show they are indeed the core requirements.
      *   *Revised Plan:* Create 5 Core Requirements based on the user's questions. Then discuss the Trade-offs. Then evaluate the theories.

      *   *Refining the "Trade-off":* The big one is *Sovereignty vs. Stability*. If the future self is sovereign, the past bond breaks. If the bond holds, the future self isn't sovereign.
      *   *Refining the "Amendment" question:* This is the "Paradox of Sovereignty" (Jellinek). Can a sovereign limit itself? The answer is usually "No, not absolutely."

