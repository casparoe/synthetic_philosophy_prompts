          *   *Commitment:* Standard game theory allows for binding contracts. If the "game" is defined as the choice of action *given* the rules, changing the rules (allowing code submission) changes the game. But the user claims this *resolves* the PD. The key is that the PD is usually defined over *actions* (C/D). Here, the strategic choice is over *algorithms*. If rationality is about maximizing utility, and the algorithm space allows for C-C equilibrium, then rationality demands choosing that algorithm. It's not "pre-play" in the sense of an external contract; it's the *structure of agency* itself.
