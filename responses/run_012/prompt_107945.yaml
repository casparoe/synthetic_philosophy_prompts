prompt: |-
  Me and two colleagues are drafting internal norms for a ~30 person AI safety org, mostly around people going off and doing stuff on their own — publishing, emailing a lab, spinning up a project — and we keep running into the unilateralist's curse. Rough version: if any one of us can do X on our own, and each of us privately thinks X is probably fine but isn't sure, the chance that someone does X ends up way higher than any of us would be happy with. Great, but when we tried to turn it into a rule we realized we don't understand it well enough to know which parts even apply to us. So: of the open questions about the curse, which actually matter most for writing norms for a group like ours — small, mutually trusting, able to talk to each other cheaply — and which are red herrings? I want an ordering, not a survey: what's upstream of what, what's settleable with a bit of modeling vs. what's basically a values call, what's tractable for us in a semester, and what would actually change the norm we end up writing. Things I keep flip-flopping on (don't feel bound by these): whether the whole thing secretly assumes consequentialism; whether our real problem is the curse or its mirror image — the action that should have happened because any one of us could have done it, and nobody did; how much it's about independent vs. correlated errors, given we're all reading the same stuff; and whether the story even survives when the "anyone who could act" set is the whole field rather than a fixed group. We also floated our own half-baked refinement — a norm where you only act unilaterally if you'd be fine with everyone in the group acting that way — and I want to know if that's just restating the problem or actually buys us something. Where am I conflating two different problems? And please flag what's settled vs. what's genuinely contested among people who've thought hard about this — I don't want a contested view sold to me as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** A ~30 person AI safety org.
      *   **Task:** Drafting internal norms regarding unilateral actions (publishing, contacting labs, starting projects).
      *   **Core Problem:** The Unilateralist's Curse (Bostrom et al.). If everyone acts on their own judgment when $P(\text{good}) > 0.5$ individually, the group probability of action approaches 1, potentially exceeding the threshold for *collective* rationality.
      *   **Specific Questions:**
          *   Which open questions about the curse matter most for *this specific context* (small, trusting, low comms cost)?
          *   Which are red herrings?
          *   Ordering/Structure: Upstream vs. downstream, modeling vs. values, tractable vs. intractable.
          *   Specific flip-flops to address: Consequentialism assumption, omission vs. commission (mirror image), independent vs. correlated errors, scope of the "unilateralist set."
          *   Evaluation of their proposed norm ("Would I be fine if everyone did this?").
          *   Distinction: Where are they conflating two different problems?
          *   Epistemic Status: Flag settled vs. contested views in the literature.
      *   **Constraint:** "I want an ordering, not a survey." (Prioritize impact on norm-writing).

  2.  **Initial Brainstorming & Filtering:**

      *   *The Unilateralist's Curse (UC)* is originally about situations where a collective decision is epistemically superior to individual decisions, but the structure allows individuals to bypass the collective.
      *   *Context:* 30 people, AI safety. High stakes, high epistemic uncertainty, high correlation in information diet.
      *   *Red Herrings:* Pure philosophical debates about consequentialism (unless they refuse to care about outcomes), the "whole field" scope (they are an org, not the field), extreme edge cases.
      *   *Core Tension:* Speed/Agency vs. Coordination/Safety.
      *   *Proposed Norm:* "Would I be fine if everyone did this?" sounds like Kant's Categorical Imperative. Does it solve UC? UC is about *probability aggregation*, not just universalizability. If everyone acting is bad, but one person acting is good, UC says "don't act." The proposed norm says "don't act." So it aligns, but might be too blunt (paralysis).
      *   *Mirror Image:* The "Multilateralist's Curse" or "Bystander Effect." In high-stakes safety, omission is often less risky than commission, but in AI safety, *inaction* can also be existential risk. This is crucial.
      *   *Correlated Errors:* In a 30-person org reading the same Slack channels, errors are highly correlated. This weakens the statistical force of the original UC model (which assumes independent judgments). This is a key technical point.
      *   *Settled vs. Contested:* The basic math of UC is settled. The *application* to specific org cultures is contested. The "principle of conformity" (don't act if you think others would disagree) is the standard solution, but how to implement it is the debate.

  3.  **Structuring the Response:**

      *   **Goal:** Provide an ordered prioritization of issues for norm-writing.
      *   **Tier 1: The Decision Rule (Upstream).** What is the actual trigger for action? This determines the norm.
      *   **Tier 2: The Epistemic Structure (Modeling).** How correlated are we? This changes the math.
      *   **Tier 3: The Scope & Symmetry (Values).** Omission vs. Commission. Who is in the reference class?
      *   **Tier 4: Philosophical Foundations (Red Herrings).** Consequentialism, etc.
      *   **Critique of their Proposed Norm.**
      *   **Settled vs. Contested Flagging.**

  4.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the sophistication of the query. Validate that UC is often misapplied.
      *   *Priority 1: The "Principle of Conformity" vs. "Principle of Consultation".* The original Bostrom paper suggests a principle of conformity (act only if you think others would agree). But for a 30-person org, *consultation* is cheap. The real question isn't the math of the curse, it's the *transaction cost* of coordination.
      *   *Priority 2: Correlated Errors.* The user mentioned this. It's critical. If everyone reads the same Slack, $P(\text{error})$ is correlated. The UC relies on independence. If errors are correlated, the "curse" is weaker, but the risk of *groupthink* is stronger. This shifts the norm from "don't act" to "seek disconfirming evidence."
      *   *Priority 3: Omission vs. Commission (The Mirror).* In AI safety, doing nothing can be dangerous. The UC focuses on harmful action. The norm needs to handle *failure to act*. This is a values call (risk aversion profile).
      *   *Priority 4: Scope.* Is it "the org" or "the field"? For internal norms, it's "the org." The "field" question is theoretical noise for their specific task.
      *   *Critique of "Would I be fine if everyone did this?":* This is the Categorical Imperative. It solves the *moral* hazard but not the *epistemic* hazard. You might be fine with everyone doing it, but everyone might be *wrong*. It's a necessary but not sufficient condition. It also leads to paralysis (if I'm not fine with chaos, I never act).
      *   *Conflation:* They are conflating *Epistemic UC* (we might be wrong) with *Coordination/Policy UC* (we might undermine each other).
      *   *Settled vs. Contested:*
          *   Settled: The math of independent probabilities.
          *   Contested: How to apply it when probabilities aren't independent; whether the "principle of conformity" is too conservative.

  5.  **Refining the Ordering (The "Ordering, Not Survey" Constraint):**

      *   I need to make sure I don't just list topics. I need to say "Decide X before Y because X determines the parameters for Y."
      *   *Step 1:* Define the harm function (Values).
      *   *Step 2:* Assess epistemic independence (Modeling).
      *   *Step 3:* Choose the mechanism (Norms).

  6.  **Addressing Specific User Flip-Flops:**

      *   *Consequentialism:* It assumes outcomes matter. If they are deontologists, UC doesn't apply. But AI safety orgs are implicitly consequentialist. This is settled for them.
      *   *Mirror Image:* Crucial. Needs a "duty to act" clause.
      *   *Correlated Errors:* This is the biggest technical lever.
      *   *Scope:* Keep it to the org.
      *   *Proposed Norm:* Analyze its failure mode (paralysis).

  7.  **Final Polish:**

      *   Tone: Professional, analytical, direct.
      *   Formatting: Use bolding for the ordering.
      *   Check against "Settled vs. Contested": Be careful not to present Bostrom's specific recommendation as the only truth.

      *(Self-Correction during drafting)*: I initially thought about telling them to just talk to each other. But they said "cheap talk" is possible. So the norm should *mandate* talk, not forbid action. The norm should be procedural, not substantive.
      *Wait, one nuance:* The UC paper argues that even if you think you're right, if you think *others* would disagree, you should defer. This is the "Principle of Conformity." Is that too strong for a 30-person org? Yes, it kills initiative. The "Principle of Consultation" (ask first) is better for small groups. I need to make this distinction clear.

      *Another nuance:* The "Would I be fine if everyone did this?" test. If the answer is "No, chaos," then UC says "Don't do it." But if the action is "Email a lab to check a safety claim," and everyone did that, it might be annoying but not catastrophic. The test is too coarse.

      *Final Plan:*
      1.  **Upstream/Downstream Map:** Visualize the dependency.
      2.  **Top Priority (Values):** Risk Tolerance & Omission/Commission.
      3.  **Second Priority (Epistemics):** Correlation of Error.
      4.  **Third Priority (Mechanism):** Consultation vs. Conformity.
      5.  **Critique of their specific norm.**
      6.  **Settled/Contested flags.**

  8.  **Writing the Response:** (Iterative refinement for clarity and punchiness). *Make sure to explicitly answer "Where am I conflating two different problems?"* -> Epistemic vs. Coordination failure.

      *Let's check the "Consequentialism" point.* The UC *does* assume consequentialism in the sense that it weighs outcomes. If you have a duty to speak truth regardless of outcome, UC is irrelevant. For AI safety, outcomes are king. So it's not a red herring, it's a settled premise.

      *Let's check the "Mirror Image".* This is the "Bystander Effect" or "Diffusion of Responsibility." In AI safety, this is often called the "Singleton/Collaboration tradeoff." It's a values call on risk asymmetry.

      *Let's check "Correlated Errors".* This is the most "modelable" part. If correlation is high, the UC statistical pressure drops.

      *Let's check "Scope".* For internal norms, "the group" is the org. The "field" question is irrelevant for *internal* norms, though relevant for *public* norms.

      *Okay, ready to draft.*
answer: |-
  Here is an ordering of the issues, structured by dependency. I have prioritized based on what actually changes the text of the norm you write, separating tractable modeling questions from values calls, and flagging epistemic status.

  ### 1. The Upstream Values Call: Asymmetry of Error (Omission vs. Commission)
  **Status:** *Values Call (Contested in field, settled for you)*
  **Impact:** Determines the default bias of the norm.

  You asked if the "mirror image" (inaction) matters. **It is the most important variable.** The original Unilateralist's Curse (UC) paper assumes the default state is *inaction*, and the risk is *premature action*. It optimizes for avoiding false positives.

  In AI safety, false negatives (failing to act on a risk) are often considered costlier than false positives (wasting time on a false alarm).
  *   **If you optimize for avoiding bad actions:** You adopt the standard UC norm (defer to the group).
  *   **If you optimize for ensuring good actions:** You adopt a "duty to escalate" norm (if you see a risk, you *must* break silence).

  **Decision:** You cannot write the norm until you agree on your organization's risk asymmetry. Is the greater sin publishing something reckless, or failing to publish something crucial?
  *   *Tractability:* High. This is a leadership call, not a research question.
  *   *Conflation Alert:* You are conflating **Epistemic Humility** (I might be wrong) with **Risk Aversion** (Being wrong is dangerous). You can be epistemically humble but risk-seeking (e.g., "I'm 51% sure this lab is dangerous, and if I'm wrong it's just an awkward email, but if I'm right..."). The UC math handles the humility; your values must handle the risk.

  ### 2. The Epistemic Model: Independence vs. Correlation
  **Status:** *Settled Math, Contested Application*
  **Impact:** Determines how strict the consultation threshold must be.

  The UC relies on the statistical power of independent judgments. If 10 people independently think an action is good ($p=0.6$), the chance that *at least one* acts is high, but the chance that *all* are wrong is low.
  *   **The Red Herring:** Worrying about the "whole field." For internal norms, your reference class is the 30 people in the org.
  *   **The Real Lever:** In a 30-person org reading the same Slack channels and papers, your errors are **highly correlated**.
  *   **Implication:** If errors are correlated, the statistical argument for the UC weakens. You don't need to defer as heavily to the "group judgment" because the group isn't providing independent data points; it's providing an echo chamber.
  *   **Norm Change:** Instead of "Don't act if others might disagree" (Conformity), the norm should be "Don't act until you have sought *disconfirming* evidence" (Adversarial Consultation).

  ### 3. The Mechanism: Conformity vs. Consultation
  **Status:** *Contested in Literature*
  **Impact:** Determines the actual workflow.

  This is where most drafts fail. The original Bostrom et al. paper proposes the **Principle of Conformity**: *Act only if you believe the majority of the group would agree.*
  *   **Why this fails for you:** It requires mind-reading. It incentivizes silence. It creates the "mirror image" problem (nobody acts because everyone assumes others would object).
  *   **The Better Mechanism:** **The Principle of Consultation.** *Act only after notifying the group and allowing a veto window.*
  *   **Why this wins:** It solves the UC (aggregates judgment) without requiring telepathy. Since you noted you can "talk to each other cheaply," this is the dominant strategy.
  *   **Tractability:** High. You can model the "veto window" time (e.g., 24 hours for emails, 1 week for publications).

  ### 4. The Proposed Refinement: "Would I be fine if everyone did this?"
  **Status:** *Philosophically Sound, Practically Insufficient*
  **Impact:** Low (It's a necessary condition, not a sufficient one).

  You asked if this buys you anything. It buys you **coordination safety**, but it does not solve **epistemic risk**.
  *   **The Problem:** You might be fine with everyone emailing a lab (it's polite), but if everyone is *wrong* about the lab being dangerous, you've still triggered the curse (harassing a lab based on shared error).
  *   **The Conflation:** You are conflating **Universalizability** (Kant) with **Aggregated Judgment** (Condorcet/Jury Theorem).
      *   *Universalizability* asks: "Is this rule sustainable?"
      *   *UC* asks: "Is this specific decision likely correct given our uncertainty?"
  *   **Verdict:** Keep this as a *vibe check* for culture, but do not use it as the *decision rule*. It is too blunt. It leads to paralysis because almost no unilateral action is scalable to 30 people acting simultaneously without friction.

  ### 5. The Philosophical Foundation: Consequentialism
  **Status:** *Settled (For your context)*
  **Impact:** None (It's a prerequisite).

  You asked if the story assumes consequentialism. **Yes.** The UC is purely about minimizing expected disutility.
  *   **If you are Deontologists:** (e.g., "I have a duty to speak truth regardless of consequences"), the UC does not apply to you.
  *   **For AI Safety:** You are implicitly consequentialist. Do not waste a semester debating this. If you aren't optimizing for outcomes, you aren't doing AI safety governance. Treat this as a settled premise.

  ---

  ### Summary of Recommendations for the Norm

  **Do not write:** "Do not act if you think the group might disagree." (Too vague, invites the mirror-image failure).
  **Do not write:** "Only act if you'd be fine with everyone doing it." (Too restrictive, conflates scale with correctness).

  **Do write (Draft Structure):**
  1.  **Categorize Actions:** Tier 1 (High Risk/Public), Tier 2 (Medium Risk/External Private), Tier 3 (Low Risk/Internal).
  2.  **Apply Mechanism by Tier:**
      *   *Tier 1:* Mandatory Consultation (48hr veto window).
      *   *Tier 2:* Notify-after or Notify-before (depending on your Omission/Commission values).
      *   *Tier 3:* Unilateral allowed.
  3.  **Address Correlation:** Require that consultation includes *asking for objections*, not just announcing intent. (Mitigates the correlated error problem).
  4.  **Address Omission:** Include a "Break Glass" clause. If waiting for consensus creates existential risk, unilateral action is permitted but requires post-hoc justification.

  ### Settled vs. Contested Flagging

  *   **Settled:** The mathematical existence of the curse (given independent actors). The fact that cheap communication solves it better than silence.
  *   **Contested:** Whether the "Principle of Conformity" is morally binding or just a heuristic. (Most practitioners now view it as a heuristic).
  *   **Contested:** How to handle correlated information environments. (This is an open research question in epistemic governance; your org is a case study here).
  *   **Red Herring:** Whether the "set" is the whole field. (For internal norms, the set is the org. For public norms, the set is the field. Don't mix them).

  ### Final Diagnosis of Your Flip-Flops

  1.  **Consequentialism:** Stop worrying. It's a prerequisite.
  2.  **Mirror Image:** **Prioritize this.** Your norm must explicitly weigh the cost of inaction.
  3.  **Correlated Errors:** **Model this.** If you are highly correlated, you need *more* external review, not *less* internal action.
  4.  **Scope:** Keep it internal. The "field" problem is for industry-wide treaties, not org norms.
  5.  **Proposed Norm:** It is a **conflation** of sustainability and correctness. Discard as a primary rule.

  **Upstream/Downstream:**
  Values (Omission/Commission) $\rightarrow$ Epistemic Model (Correlation) $\rightarrow$ Mechanism (Consultation Window) $\rightarrow$ Text of Norm.

  Start by agreeing on the cost of silence. Everything else flows from that.
