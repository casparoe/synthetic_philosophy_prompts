  **OFFICE OF STANDING TO BLAME**
  **APPLICATION FOR AUTHORIZATION TO ASSIGN MORAL FAULT (FORM 441-S)**

  **INSTRUCTIONS:** Pursuant to the Ethics Adjudication Act, no individual may express blame unless holding valid Standing. Completion of this form does not verify whether the accused act was objectively wrong. Verification of wrongness is distinct from Verification of Voice. Applicants found to be blaming without Standing will be subject to Counter-Blame for Procedural Hypocrisy.

  **SECTION 1: THE VIOLATION**
  1.1 Describe the norm violation committed by the Accused.
  1.2 Provide evidence that the violation occurred. (Note: Truth of claim does not confer right to voice claim.)
  1.3 Has the Accused admitted fault? [ ] Yes [ ] No [ ] Contested

  **SECTION 2: APPLICANT'S PRIOR CONDUCT AFFIDAVIT**
  2.1 Have you committed the same violation within the last 24 months? [ ] Yes [ ] No
  2.2 If yes, provide dates and mitigating circumstances.
  2.3 Have you committed a *different* violation that suggests general moral negligence? [ ] Yes [ ] No
  2.4 Are you currently under investigation for similar conduct? [ ] Yes [ ] No
  *Warning: Affirmative responses to 2.1 may result in immediate dismissal under the Clean Hands Doctrine.*

  **SECTION 3: STANDING CATEGORY**
  Select the basis of your authorization:
  3.1 **Pure Standing:** Applicant has no record of similar violations. (Requires notarized moral history.)
  3.2 **Vicarious Standing:** Applicant is acting on behalf of a victim who lacks capacity to blame. (Requires Power of Attorney for Resentment.)
  3.3 **Contractual Standing:** Applicant and Accused share a specific agreement regarding the norm (e.g., lease, marriage). (Attach Clause 4.b.)
  3.4 **Relational Standing:** Applicant claims standing based on care or friendship rather than record. (Requires proof of emotional investment.)

  **SECTION 4: FORFEITURE AND SUSPENSION**
  4.1 Standing is forfeited if the Applicant accepts a benefit from the Accused related to the violation.
  4.2 Standing is suspended for 6 months if the Applicant is found to have blamed disproportionately.
  4.3 Standing cannot be transferred, except in cases of deceased victims (see FAQ 5).

  **SECTION 5: RELATIONSHIP VERIFICATION**
  5.1 Define your relationship to the Accused.
  5.2 Does this relationship grant you special authority, or does it disqualify you due to complicity?
  5.3 If complicit, explain why your participation does not negate your voice.

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Can I transfer my Standing to another person?**
  A: Generally, no. Standing is non-fungible because it attaches to the specific moral relationship between blamer and blamed. However, Vicarious Standing (Category 3.2) allows for proxy blaming if the primary victim is incapacitated by indifference or trauma. You cannot transfer Standing simply because you are too tired to argue.

  **Q: What if I am partially complicit in the problem?**
  A: This is the Complicity Case. If your own conduct undermines the norm you are invoking, your Standing is compromised. You may apply for a Waiver of Hypocrisy, but this requires admitting your own fault first. Be advised: admitting fault may expose you to separate blame proceedings. The Office recommends seeking Pure Standing elsewhere before proceeding.

  **Q: Does the Office itself have Standing to adjudicate these applications?**
  A: The Office operates under Statutory Immunity granted by the Ethics Adjudication Act. Our authority is procedural, not moral. We do not blame; we authorize blaming. Therefore, the Clean Hands Doctrine does not apply to adjudicators, only to applicants. Challenges to the Office's authority must be filed on Form 442-S (Challenge to Procedural Standing), which requires Standing to file.

  **Q: What is the appeals procedure if my Standing is denied?**
  A: Denied applicants may appeal to the Regional Board of Standing. If the Board denies the appeal, you may petition the High Court of Moral Authority. Note: Each level of appeal requires the appellant to demonstrate they have Standing to appeal the decision. If the High Court denies Standing, there is no further recourse, as no higher standing body exists within the jurisdiction.

  **Q: Can Standing be inherited?**
  A: No. Moral authority is not property. However, legacy grievances may be recognized if the descendant can prove continuous harm resulting from the original violation. This rarely qualifies for Pure Standing and usually defaults to Relational Standing, which carries lower weighting in adjudication.

  ***

  **PRIVACY NOTICE:** Information provided on this form may be shared with third parties who wish to blame the Applicant. By signing, you acknowledge that seeking the right to blame may make you a target for blame.

  **SIGNATURE:** ___________________ **DATE:** ___________
