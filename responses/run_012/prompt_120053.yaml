  Priya's verdicts track the origin of the agent's incapacity, not just its presence. She exempts those whose inability to participate in reciprocal relationships is constitutive or involuntary: the seizure (physiological event), the tumor (pathology), the psychopath (structural absence of care), and the cult member (deprived moral development). In these cases, the objective attitude is required; apologies are meaningless because the participant stance is unavailable. Conversely, she holds agents responsible when the lack of regard stems from a voluntary exercise of agency. The drunk driver chose impairment; the collaborator chose ideology. Here, the participant stance remains appropriate because the agent could have chosen otherwise. The apology nuance confirms this: carelessness retains the participant stance (apology owed), while genuine incapacity removes it. The core rule is: You are exempt only if you never had, or did not voluntarily destroy, the capacity for mutual regard. Responsibility hinges on whether the harm expressed a will that could have been otherwise. When capacity is involuntarily lost, the relationship ends. When capacity is misused or voluntarily impaired, the relationship holds, demanding repair or punishment. She distinguishes between "cannot care" (exempt) and "would not care" (liable), provided the "would not" was a chosen trajectory. This creates a binary: either you are a person to whom things happen, or a person who makes things happen.

  2. "What each rule says about Ray"
  The "Current Capacity" rule (Tumor/Psychopath) suggests Ray is exempt. He now lacks the structural ability to care, making him like the weather. Resentment is misplaced because he cannot participate in the moral community. However, the "Voluntary Impairment" rule (Drunk Driver) suggests he is liable. He knowingly engaged in behavior warned to destroy his moral capacity. The Cult case reinforces this: Ray had the moral education the cultist lacked. The tension lies between his status at the time of the assault (incapacitated) versus his status at the time of the choice to drink (capacitated). Priya must decide whether the exemption attaches to the moment of harm or the chain of agency leading to it. If she prioritizes the current relationship, he is exempt. If she prioritizes the history of the will, he is liable.

  3. "My call"
  I predict Priya says Ray is responsible. The Drunk Driver case is the closest analog. In both, the agent voluntarily consumes a substance knowing it risks harm to others, effectively waiving their future incapacity as an excuse. The specific warning about brain damage makes this even stronger than the drunk driver; Ray didn't just risk impairment, he risked destroying the very faculty of responsibility. If Priya exempts Ray, she undermines the principle that agents cannot construct their own exemptions. She would be allowing people to drink their way out of moral accountability, which contradicts her fury at the drunk driver. She will likely argue that his current incapacity is not a brute fact like a tumor, but a consequence of his own will, preserving the participant stance. The principle at stake is that moral agency cannot be voluntarily discarded to evade liability.

  4. "The case that would settle it"
  Ask Priya about a man who takes prescription painkillers as directed, knowing a rare side effect is impulse control loss, which then occurs. The act is voluntary but medically necessary, not reckless. If she exempts him, it proves the *recklessness* of the voluntary act is the key, not just the voluntary nature. If she holds him responsible, it proves any voluntary path to incapacity forfeits exemption. This distinguishes between acceptable voluntary risk and reckless self-destruction of agency. It tests whether the moral blame lies in the risk-taking or the resulting incapacity.

  5. "Confidence and the weak link"
  I am fairly confident Priya will hold Ray responsible, given her stance on the drunk driver. The weak link is whether her Strawsonian commitment to the *current* relationship overrides the tracing principle. Strawson himself might exempt Ray based on present incapacity, so Priya might be blending frameworks.
