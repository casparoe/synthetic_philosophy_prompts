  **Grade: 58% (Low 2:2 / C+)**

  **Marginal Comments**

  **Paragraph 1 (Textualism)**
  *   *"A textualist asks what the enacting legislature actually intended the words to do, so the first move is to consult the legislative history..."*
      **Comment:** Fundamental error. Textualism distinguishes itself from intentionalism precisely by rejecting legislative history and subjective intent in favor of ordinary meaning and context. You have defined intentionalism, not textualism.
  *   *"...consult the legislative history -- committee reports, floor statements, and the preamble -- to recover that intent."*
      **Comment:** Again, this is the opposite of standard textualist methodology. A textualist might look at the preamble as part of the context, but not to "recover intent" via history.
  *   *"Here the preamble is clear that the target is stormwater, so the legislature cannot have meant to exempt a warehouse..."*
      **Comment:** You are using purpose to override text. That is a purposivist move, not textualist. A textualist would ask if the words "primary function" exclude a warehouse, regardless of what the legislature "meant."
  *   *"the living roof covers 3,000 of the building's 6,000 square feet of roof, exactly 50%..."*
      **Comment:** You missed § 4(d). The definition clause excludes PV panels from "roof surface" for the purposes of the section. The denominator is not 6,000; it is 3,000 (Total minus PV). Your math is wrong because you didn't read the definitions.

  **Paragraph 2 (Purposivism)**
  *   *"A purposivist... asks which outcome does the most good overall, treating the statute as one input among several."*
      **Comment:** No. This describes utilitarian policy analysis, not legal purposivism. A purposivist interprets the statute to advance the *statute's* purpose, not general welfare. The statute is not "one input among several"; it is the constraint within which the purpose is sought.
  *   *"The solar carve-out exists to avoid burdening renewable energy..."*
      **Comment:** Where does this purpose come from? The preamble cites stormwater and heat islands, not energy policy. Do not invent legislative purposes not found in the text or preamble.
  *   *"...so it doesn't swallow the rule."*
      **Comment:** Vague. How does the purposive analysis dictate the interpretation of "primary function"? You haven't shown the work here.

  **Paragraph 3 (Conclusion)**
  *   *"And note that a textualist would refuse to look at the preamble at all..."*
      **Comment:** Direct contradiction. In your Textualism paragraph, you explicitly used the preamble ("Here the preamble is clear..."). You cannot claim convergence based on a methodological distinction you violated in your own analysis.
  *   *"The case is easier than it looks..."*
      **Comment:** It isn't. You missed a definition clause (§ 4(d)) that changes the calculation from 50% to 100%, and you conflated three distinct theories (textualism, intentionalism, utilitarianism). The reasoning does not hold up.

  **General**
  *   **Result:** You reached the correct outcome (certificate issues), but largely by accident. You ignored the definition clause that makes compliance obvious, and your theoretical framework is confused. In a philosophy of law seminar, the methodology is the point. You have not demonstrated command of the distinctions requested.
