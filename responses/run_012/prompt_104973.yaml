answer: |-
  Here is a decision procedure derived from the procreation asymmetry, tailored for a clinical ethics panel with a ten-minute constraint. It is designed to separate the *duty to avoid harm* from the *absence of a duty to confer benefit*, which is the core of the asymmetry.

  ### The Welfare Floor Protocol (WFP)

  **Purpose:** To distinguish between lives that should not be started (harm) and lives that may be started even if sub-optimal (no obligation to maximize).
  **Time:** 10 Minutes.
  **Inputs:** Medical prognosis, Parental statement, Available alternatives (e.g., PGD, donor, adoption).

  #### Step 1: The Severity Threshold (The "Veto")
  **Question:** *Based on the best medical evidence, is the predicted suffering so severe that a reasonable person would judge non-existence preferable to existence?*
  *   **Criteria:** Look for intractable pain, inability to form relationships, or cognitive absence where suffering is unmediated. Normal lifespan with disability does not automatically trigger this.
  *   **If YES:** **Recommend Decline.** (The asymmetry dictates we have a strong duty not to create suffering).
  *   **If NO:** **Proceed to Step 2.** (The absence of a "perfect" life is not a reason to block creation).

  #### Step 2: The Avoidability Check (The "Alternative")
  **Question:** *Is there a feasible alternative route to parenthood that would result in a child with significantly less suffering (e.g., PGD, donor gametes)?*
  *   **If NO:** (e.g., posthumous conception, unique genetic link desired, no medical alternative). **Proceed to Step 3.**
  *   **If YES:** **Flag for Justification.** The parents must articulate why accepting the risk of suffering is necessary for their project (e.g., genetic continuity). If the risk is high and the justification is weak, **Recommend Decline.** If the risk is moderate and justification is strong, **Proceed to Step 3.**

  #### Step 3: The Purpose Check (The "Means")
  **Question:** *Is the primary motivation to raise a child as a person, or to use the child as a resource for another?*
  *   **Criteria:** Does the treatment plan treat the future child as a patient in their own right, or primarily as a treatment for a third party?
  *   **If Resource/Means:** **Recommend Decline.** (This violates the Kantian constraint often paired with the asymmetry; we cannot create a person *solely* to fill a gap in another's life).
  *   **If Person/End:** **Recommend Approve.** (Parental autonomy prevails when the Welfare Floor is met).

  ---

  ### What This Procedure Cannot Settle
  You must report this to the Chair along with the verdict. The WFP is a tool for *harm reduction*, not *value maximization*. It cannot settle:
  1.  **The Threshold Line:** Reasonable people disagree on where "hardship" becomes "a life not worth living." The procedure forces you to locate the case relative to the line, but it cannot draw the line for you.
  2.  **The Value of Genetic Ties:** It cannot weigh the parents' desire for a genetic child against the child's risk of suffering. It only flags the conflict.
  3.  **Social Suffering:** It accounts for medical prognosis, not the suffering caused by societal prejudice against disability.

  ---

  ### Application to Current Cases

  #### Case 1: Recessive Condition (25% Risk)
  *Scenario: Carriers want natural conception. Affected child has normal lifespan but prolonged early pain.*
  *   **Step 1 (Severity):** Is prolonged early pain + normal lifespan "Not Worth Living"?
      *   *Assessment:* Medically, no. The child will have capacity for joy and relationship.
      *   *Result:* **Pass.**
  *   **Step 2 (Avoidability):** Is there an alternative?
      *   *Assessment:* Yes, PGD or donor gametes could avoid the pain.
      *   *Result:* **Flag.** Parents must justify accepting the 25% risk. If they cite genetic connection, this is usually accepted in fertility ethics provided Step 1 is passed.
  *   **Step 3 (Purpose):** Raising a child?
      *   *Assessment:* Yes.
      *   *Result:* **Pass.**
  *   **Verdict:** **Permissible.**
  *   **Panel Friction:** The members who treat "any prospect of hardship as decisive" will dislike this. The procedure forces them to admit that *some* suffering is compatible with a life worth starting. It isolates their objection as a value judgment (Step 1), not a logical necessity.

  #### Case 2: Posthumous Conception
  *Scenario: Woman wishes to conceive with late husband's stored gametes. Welfare not at issue.*
  *   **Step 1 (Severity):** No predicted suffering.
      *   *Result:* **Pass.**
  *   **Step 2 (Avoidability):** Is there an alternative to have *this* genetic child?
      *   *Assessment:* No. This is the only way to realize this specific parental project.
      *   *Result:* **Pass (No Flag).**
  *   **Step 3 (Purpose):** Raising a child?
      *   *Assessment:* Yes.
      *   *Result:* **Pass.**
  *   **Verdict:** **Permissible.**
  *   **Note:** This is the "control" case. The asymmetry is neutral here; the absence of the father is a hardship, but not one that renders the child's life not worth living.

  #### Case 3: Saviour Sibling
  *Scenario: Couple wants embryo selection to match a dying sibling.*
  *   **Step 1 (Severity):** The selected child will be healthy.
      *   *Result:* **Pass.**
  *   **Step 2 (Avoidability):** Could they have a child without selection?
      *   *Assessment:* Yes. But selection does not increase suffering for the created child.
      *   *Result:* **Pass.**
  *   **Step 3 (Purpose):** Raise a child or use as resource?
      *   *Assessment:* **Critical Juncture.** The child is created *to save* the sibling. However, if the parents commit to loving the saviour sibling for their own sake, and the medical intervention (cord blood/bone marrow) is low risk, clinical ethics usually classifies this as "Person."
      *   *Result:* **Pass (Conditional).**
  *   **Verdict:** **Permissible.**
  *   **Panel Friction:** This is the case the panel may **dislike**. The procedure permits it because the *child's* welfare (the asymmetry's focus) is secure. It does not capture the intuitive unease about "instrumentalization" if the parents' commitment is ambiguous. Members who feel conception for use is inherently degrading will find the WFP too cold; it allows the creation of a child as a means, provided they are also treated as an end.

  ### Summary for the Chair
  In two of three cases (Recessive, Saviour Sibling), the procedure returns **Permissible**.
  *   In the **Recessive Case**, it overrides the "hardship veto" faction by establishing that hardship alone is not a veto unless it crosses the "Life Not Worth Living" threshold.
  *   In the **Saviour Sibling Case**, it overrides the "dignity veto" faction by establishing that instrumental motives are permissible if the child's own welfare is secured.

  **The Procedure's Limit:** It cannot resolve the disagreement in the Recessive Case if your panel members fundamentally disagree on where the "Life Not Worth Living" threshold lies. One member's "manageable pain" is another's "unacceptable suffering." In that specific instance, the procedure stops at Step 1 and must be handed back to you as a **Judgment of Value**. You will have to vote on the threshold, not the logic.
