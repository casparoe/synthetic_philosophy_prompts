          *   Pivot: Focus on *necessity* vs. *contingency*. Yes, the biological start was contingent (lucky), but the *person* is defined by more than the start.
          *   Script: Give specific lines. "You're right about the biology, but..."
      *   **Addressing the Intuitions:**
          *   Which one to give up? The idea that "I could have come from a different embryo." Biologically, that's false.
          *   Which one to keep? The idea that "My value isn't just a lottery win."
          *   Acknowledge the "tidiness" desire: Yes, we want to feel necessary, not accidental.
      *   **Tone Check:** Keep it conversational. No jargon like "transworld identity" or "haecceity" unless explained simply. Avoid lecturing.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I shouldn't just say "Sister is right." That dismisses the user's valid existential discomfort. I need to explain *why* the sister is right biologically but why the user's feeling matters psychologically.
      *   *Correction on the Twin Case:* The cousin's point is strong. If the embryo splits, there are two people. Neither is uniquely "the original" in a way that excludes the other. This proves the embryo isn't *already* the full person. I need to make sure the user understands this without feeling dumb.
      *   *Dinner Strategy:* The user wants to win or at least hold ground. I need to give them a way to concede the biological point but win the human point. "Okay, biology says you're right. But does that matter for how we live?"

  5.  **Final Polish:**
