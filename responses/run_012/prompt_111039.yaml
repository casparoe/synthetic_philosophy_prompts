  First, there are two principal rules from population ethics that fit all three of her verdicts.

  1.  **Critical Level Utilitarianism.** This rule holds that a world's value is the sum of each person's welfare minus a fixed "critical level" $c$. Lives below $c$ contribute negative value; lives above $c$ contribute positive value.
      *   *Case 1:* Adding 10 billion people at 70 increases value if $70 > c$. Her verdict (B > A) implies $c < 70$.
      *   *Case 2:* World Z has 100 trillion people at 2. If $c > 2$, these lives contribute massive negative value, making Z worse than A. Her verdict (A > Z) implies $c > 2$.
      *   *Case 3:* Adding 1 trillion people at 1 decreases value if $1 < c$. Her verdict (A > C) implies $c > 1$.
      *   *Fit:* Any critical level between 2 and 70 fits all three cases.

  2.  **Lexical Threshold View.** This rule holds that lives above a certain quality threshold matter infinitely more than lives below it. Adding lives below the threshold cannot make a world better, and may make it worse if they dilute quality or consume resources (though here resources are stipulated away, some versions count them as negative).
      *   *Case 1:* 70 is likely above the threshold, so adding them improves the world.
      *   *Case 2 & 3:* 1 and 2 are below the threshold. Adding them does not help, and the drop in quality for the original group in Case 2 makes Z worse.
      *   *Fit:* This fits qualitatively, provided the threshold lies between 2 and 70.

  Standard Total Utilitarianism (sum of welfare) fails Case 2 and 3. Average Utilitarianism (average welfare) fails Case 1.

  Second, here is what each surviving rule implies about Case 4 (P: 10B @ 80 vs. Q: 100B @ 20).

  *   **Critical Level Utilitarianism:** P is better than Q if $10(80 - c) > 100(20 - c)$. Solving this inequality gives $c > 13.3$. If her critical level is above 13.3, she prefers P. If it is between 2 and 13.3, she prefers Q.
  *   **Lexical Threshold View:** If 20 is below her quality threshold, the massive quantity in Q cannot outweigh the high quality in P. She would prefer P. If 20 is above the threshold, Q might win, but given she rejected level 2 strongly, the threshold is likely high.

  Third, my best guess is that she will prefer **World P**.

  My reason is that her rejection of Case 2 (the Repugnant Conclusion) suggests she places a high premium on quality of life. Philosophers who reject the Repugnant Conclusion typically adopt a critical level or lexical view robust enough to prevent massive populations at low welfare from outweighing smaller populations at high welfare. A critical level low enough to prefer Q (below 13.3) would still allow a Repugnant Conclusion with a slightly higher welfare level (e.g., 15), which contradicts the spirit of her Case 2 verdict. Therefore, a higher critical level (or lexical view) is more consistent with her profile, favouring P.

  Fourth, a further comparison to separate the rules would be: **World A** (10 billion people at 80) against **World T** (100 billion people at 79).

