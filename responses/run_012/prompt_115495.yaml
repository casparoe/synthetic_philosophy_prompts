      *   *Also, the Island Case:* The opponent's reply ("they should have built granaries 10 years ago") proves the test is tautological. It assumes a duty to prevent all future suffering. That's not a test for *this* famine's cause, it's a test for *general* societal obligation.
      *   *Sen's actual view:* Sen distinguishes between democratic and non-democratic responses. He doesn't say *every* famine is a crime in the legal sense, but that democracy prevents them. The opponent is radicalizing Sen.

