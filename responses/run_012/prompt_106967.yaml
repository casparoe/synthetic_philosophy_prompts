answer: |-
  Here is the **Outsider's Bind Protocol**. It is distilled from social domain theory (the philosophical distinction between moral rules, social conventions, and personal choices) and contract theory (what obligations a visitor inherits).

  It is designed to tell you, in under ten minutes, whether a specific action makes your protagonist look **immoral**, **rude**, or **eccentric**.

  ### Part 1: The Decision Procedure

  Run these four questions in order. Do not skip ahead.

  **Q1: The Harm Filter (Material & Physical)**
  *   **Question:** Does this action directly deprive a specific local of money, safety, or livelihood?
  *   **Sufficient Answer:** "Yes, a worker loses income" or "Yes, someone is physically endangered."
  *   **Stop Condition:** If **YES**, this is a **Moral Obligation**. It binds the visitor. Ignorance is a mitigation, not an excuse. If he does this repeatedly, he reads as selfish, not clueless.
  *   **If NO:** Proceed to Q2.

  **Q2: The Sacred Filter (Identity & Order)**
  *   **Question:** Is this rule tied to the community's self-conception, history, religion, or honor? (e.g., sacred spaces, gestures of respect to elders, timing that implies trust).
  *   **Sufficient Answer:** "Yes, this space is holy" or "Yes, this implies a judgment on their hospitality."
  *   **Stop Condition:** If **YES**, this is a **Deep Taboo**. It binds the visitor. Violating it creates a stain on his character that requires a ritual apology, not just a shrug.
  *   **If NO:** Proceed to Q3.

  **Q3: The Opacity Filter (Knowability)**
  *   **Question:** Could a reasonable stranger know this rule *before* breaking it? (Are there signs? Is it universal? Or is it hidden code?)
  *   **Sufficient Answer:** "No, it looks exactly like something else" or "There is no way to know."
  *   **Stop Condition:** If **NO** (It is opaque), this is **Local Color**. He is allowed to blow through it. It makes him an outsider, not a bad man.
  *   **If YES** (It is obvious): Proceed to Q4.

  **Q4: The Repair Filter (Remediation)**
  *   **Question:** When corrected, can the damage be fully undone by an apology?
  *   **Sufficient Answer:** "Yes, they laugh and forgive" vs. "No, the trust is broken."
  *   **Stop Condition:** This is the **Values Call**. If the damage is permanent, the act functions as a Moral Wrong (see Q1). If it is fixable, it is a Social Faux Pas.

  ***

  ### Part 2: Running the Protocol on Your Scenes

  Here is the output when you run your three specific scenarios through the protocol.

  #### Scenario A: The Tip
  *   **Q1 (Harm):** **YES.** You stated stiffing is "theft-adjacent" and tipping is "compulsory." The worker loses expected income.
  *   **Result:** **Moral Obligation.**
  *   **Verdict:** This rule **BINDS** the visitor.
  *   **Character Read:** If he skips the tip, he is not just "out of his depth." He is economically exploiting a local. To maintain the "decent man" arc, you must prove **Q3 (Opacity)**: He must genuinely believe service is included, or have no cash, or be warned *after*. If he simply chooses not to pay, your Third Act collapses. The reader will not root for a man who steals wages, even accidentally, without severe remorse.

  #### Scenario B: The Queue (Fish Market)
  *   **Q1 (Harm):** **NO.** The system is "first to speak." No one loses money or safety.
  *   **Q2 (Sacred):** **NO.** It is a logistical method, not a holy rite.
  *   **Q3 (Opacity):** **YES/MIXED.** It *looks* like a queue to an outsider, but the rule is hidden.
  *   **Result:** **Local Color.**
  *   **Verdict:** This rule **DOES NOT BIND** the visitor.
  *   **Character Read:** He can barge. It makes him look impatient or culturally clumsy, but not immoral. This is safe ground for "fish out of water" humor or tension that doesn't damage his soul.

  #### Scenario C: The Early Arrival (Dinner)
  *   **Q1 (Harm):** **NO.** No material loss.
  *   **Q2 (Sacred):** **YES.** You stated it is a "grave slight." This implies it violates the host's honor or autonomy (implying they are not ready or their time is less valuable).
  *   **Result:** **Deep Taboo.**
  *   **Verdict:** This rule **BINDS** the visitor.
  *   **Character Read:** This is not a quirk; it is an insult.

  ***

  ### Part 3: The Scene That Doesn't Work

  **The Tip Scene.**

  Here is the hard truth the procedure exposes: **You cannot have it both ways.**

  You want the reader to see him as a "decent man out of his depth" in Act Three. But in Act One or Two, you have him commit an act that the Protocol classifies as **Moral Harm (Q1 Yes)**.

  In the real world (and in realistic fiction), "not knowing you should tip" is a very hard sell when the service has already been rendered. Unlike the Queue (where the rule is hidden) or the Dinner (where the rule is about honor), the Tip is a transaction.

  **Why the scene fails:**
  If he skips the tip to save money, he is cheap. If he skips it because he "didn't know," he is negligent regarding another person's livelihood. Negligence regarding money reads as selfishness in a protagonist. If you pile this on top of the Early Arrival (a "grave slight"), you are accumulating "Disrespect Points." By Act Three, the reader won't see a decent man; they will see a man who thinks the world revolves around him.

  **How to fix it:**
  You must maximize **Q3 (Opacity)**.
  *   *Don't:* Have him walk away casually.
  *   *Do:* Have him attempt to pay the bill, be told "it is done," and leave. Or have him leave a tip that is *too small* because he doesn't understand the percentage, rather than *zero*.
  *   *Or:* Cut the scene. If the Third Act hinges on his decency, do not make his first major interaction an economic slight. Use the **Queue** instead. It creates conflict without moral stain.

  ***

  ### Part 4: Where the Procedure Misfires (Limitations)

  Philosophy can map the territory, but it cannot walk the path. Here is where this tool will fail you:

  **1. The "Accumulation" Problem**
  The Protocol analyzes scenes in isolation. It does not account for pattern recognition.
  *   *Limit:* One taboo (Early Arrival) is a mistake. Three taboos (Early Arrival + Tipping + Walking on Tiles) is a character trait.
  *   *Fix:* If he fails Q1 or Q2 more than twice, you must write a scene where he *learns*. If he keeps violating binding rules without changing behavior, he is not "out of his depth"; he is arrogant. The Protocol says the *rule* binds him; your narrative must show him *accepting* that bind.

  **2. The "Local Reaction" Variance**
  The Protocol assumes locals react consistently. They won't.
  *   *Limit:* One waiter might chase him down for the tip (Q1 Harm confirmed); another might shrug (Q1 Harm negated).
  *   *Fix:* Use the local reaction to tune the reader's moral compass. If you need him to remain decent, have the local say, "Ah, you are from [X], you do not know our way," rather than, "You cheat me." The former validates Q3 (Opacity); the latter validates Q1 (Harm).

  **3. The "Values Call" (Q4)**
  The Protocol hands the final decision back to you on **Repair**.
  *   *Limit:* Philosophy cannot tell you if an apology is sufficient. That is a narrative choice.
  *   *Fix:* If you need him redeemed, the apology must cost him something (time, money, pride). If he apologizes easily for a "Grave Slight," the apology feels cheap. The gravity of the repair must match the gravity of the violation (Q2).

  **Summary for your Desk:**
  *   **Queue:** Safe. Blow through it.
  *   **Early Arrival:** Dangerous. Treat with gravity, not humor.
  *   **Tip:** Critical Risk. Either establish he literally couldn't know, or cut it. It threatens your Third Act more than the others.
