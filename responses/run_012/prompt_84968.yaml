answer: |-
  **Vienna, Gesellschafts- und Wirtschaftsmuseum, 1932**

  **Neurath:** Look at the wall. Don't read it; see it. Here is Vienna, 1931. Ten thousand unemployed men. I do not give you one giant man scaled up to ten times the size. That would lie. A giant man is not ten men; he is a monster. I give you ten rows of identical men. One man, one thousand souls. You count the rows, you feel the crowd.

  **Logician:** I see the crowd, Otto. But I do not see the proposition. Where is the verb? Where is the negation? If I show you a picture of a man running, do I assert he runs? Do I ask if he runs? Do I wish he would run? The picture is silent on its own mood. It cannot say 'not'. I cannot picture 'unemployed' without picturing 'idle', and idleness is not unemployment. It is a category decision disguised as a visual fact.

  **Neurath:** You want a calculus. I am building a bridge. Look at the inscription above the door: *Words divide, pictures unite.* A German worker and a Czech worker stand here. They fight over nouns. They agree on the little men. The chart is not a sentence for your logic games. It is a tool for life.

  **Logician:** But tools have handles. You say the little men unite them, but the key—the rule that one icon equals one thousand souls—that must be taught. It is a language after all, just a hidden one. And because it hides, it is dangerous. This chart looks like a piece of the world, not a set of decisions. Who counts as unemployed? The part-timer? The discouraged? You make a political choice, then you render it as nature. The viewer thinks they are seeing the truth, but they are seeing your definition. Words admit they are symbols. Pictures pretend to be the thing itself. That is how you put one over on people.

  **Neurath:** You think words are honest? "Full employment" is a word-salad that hides more than these men do. But fine. You want the convention? Here it is. The unit is arbitrary. We chose one thousand. We could have chosen five hundred. The viewer must be taught the key. I never claimed this was a universal tongue without a teacher. It is a technique of transformation. We transform statistics into vision. If they do not learn the key, they see nothing.

  **Logician:** I concede the key. But the masking remains. When I say "There are ten thousand unemployed," the grammatical structure signals that I am making a claim. It is open to dispute. When I show ten thousand icons, the dispute vanishes into the design. It feels objective. It is rhetoric without the sound of rhetoric. And yet, you Circle members keep telling me that sentences are pictures of facts. Wittgenstein says the proposition pictures the state of affairs. So why not just use the pictures?

  **Neurath:** Because Wittgenstein writes for philosophers who sit in rooms. I write for the city. If a sentence is a picture, it is a very poor one for the man who cannot read the syntax. You worry about the 'not'. I worry about the hunger. If showing the crowd moves the council to build housing, I do not care if the logical form is incomplete.

  **Logician:** I care if the reasoning is sound. If the picture cannot embed in a 'that'-clause, it cannot be part of an argument. I cannot say "It is false that [picture]." I can only say "The picture is wrong." But then we are back to words. The picture does no work. It is an illustration, not a notation.

  **Neurath:** It does the work of memory. You remember the rows of men. You do not remember the table of figures. That is the work.

  **Logician:** Perhaps. I will concede this: words can be just as manipulative. A table of numbers can be curated to mislead as easily as a chart. The medium is not the virtue. But I maintain that the picture creates an illusion of immediacy. It bypasses the critical faculty.

  **Neurath:** And words bypass the imagination. They let you say "unemployment" without seeing the faces. I force the face.

  **Logician:** You force the icon. Not the face. They are identical. That is the abstraction.

  **Neurath:** Then we are back to the start. You want perfect ambiguity-free notation. I want useful communication.

  **Logician:** I want to know how we settle the truth. If we disagree on the chart, what do we do? Do we count the icons? Or do we check the statistics behind them?

  **Neurath:** We check the statistics. The picture is only the transformation.

  **Logician:** Then the picture is redundant.

  **Neurath:** No. It is the memory. It is the feeling.

  **Logician:** It is the persuasion. And I do not know how to test if that persuasion is justified or merely effective.

  **Neurath:** Test it on the street. Ask the worker what he understands.

  **Logician:** And if he understands wrongly? If he thinks the men are starving rather than jobless?

  **Neurath:** Then we draw better men. We do not retreat to the text.

  **Logician:** We retreat to the logic. Otherwise, we are just painting propaganda.

  **Neurath:** And you are just writing epitaphs.

  **Logician:** Better an epitaph than a lie.

  **Neurath:** Then let the city decide which is which.

  **Logician:** The city cannot decide on logical form.

  **Neurath:** The city decides what feeds them.

  **Logician:** Then we are not speaking the same language.

  **Neurath:** *Words divide, pictures unite.* You prove my point.
