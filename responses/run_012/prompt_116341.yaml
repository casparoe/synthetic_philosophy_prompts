answer: |-
  This is a classic problem in moral psychology, touching upon the tension between Kantian duty, Humean sentiment, and Virtue Ethics. You have correctly identified that a simple 'grasp of reasons' account fails, particularly on the soldier case (3). You are also right to suspect you are conflating the worth of the *act* with the worth of the *agent*.

  Below, I will brainstorm the candidate principles, commit to one, apply it to your cases, identify the necessary adjustment to your verdicts, and address the act/person distinction.

  ### 1. Brainstorming Candidate Principles

  Before settling, we must clear the field of three obvious contenders that your cases refute:

  *   **The Kantian Principle:** *Worth requires action from duty.*
      *   *Refuted by:* Case 2 (panic/sympathy has high worth) and Case 7 (duty reminder reduces worth).
  *   **The Consequentialist Principle:** *Worth tracks the goodness of the outcome.*
      *   *Refuted by:* Case 1 (good outcome, no worth) and Case 3 (bad outcome, high admiration).
  *   **The Objective Rightness Principle:** *Worth requires the act to be objectively right.*
      *   *Refuted by:* Case 3 (act is wrong/vile, yet agent is admirable).

  This leaves us with a **Motivational Quality** account. The common thread in your 'worthy' cases (2, 3, 4, 5, 6) is that the agent is moved by something that *registers value*, whereas in the 'unworthy' case (1), the agent registers only price. The difficulty lies in distinguishing Case 6 (self-image) from Case 1 (reputation), and Case 7 (duty + pride) from Case 3 (compassion + error).

  ### 2. The Committed Principle

  I propose we adopt **The Principle of Non-Instrumental Moral Concern**.

  > **Principle:** An action possesses moral worth to the extent that it is motivated by a non-instrumental concern for an object of moral value (such as a person's welfare, a moral ideal, or a duty), provided this concern is not significantly diluted by self-congratulatory or prudential interests.

  This principle has three operative clauses:
  1.  **Non-Instrumentality:** The moral end must not be a mere means to a non-moral end.
  2.  **Object of Moral Value:** The motive must target something morally significant (welfare, integrity, etc.).
  3.  **Purity:** The motive must not be crowded out by self-satisfaction or external reward.

  ### 3. Application to Your Cases

  Here is how this principle generates your verdicts, clause by clause:

  *   **Case 1 (Pharmacist):** Fails Clause 1. Reputation is instrumental to money/status. The moral act (fair pricing) is a mere means to a prudential end. **Verdict: No moral worth.**
  *   **Case 2 (Drowning Child):** Satisfies Clauses 1 & 2. Sympathy is a direct, non-instrumental responsiveness to suffering. It is 'pure' (Clause 3). **Verdict: Paradigm moral worth.**
  *   **Case 3 (Soldier):** Satisfies Clause 2. Compassion for a comrade is a concern for a moral object (welfare), even if the agent's judgment on *how* to honour it (desertion) is objectively wrong. The principle decouples the *quality of the concern* from the *correctness of the judgment*. **Verdict: Agent admirable (high motivational worth).**
  *   **Case 4 (Tithing Woman):** Satisfies Clause 2, but scores lower on Clause 3 (Purity/Wholeheartedness). Her motivation is mixed with fear ("faintly frightening"). It is less direct than Case 2's sympathy. **Verdict: Intermediate worth.**
  *   **Case 5 (Compassion Pill):** Satisfies Clause 1 & 2. The *origin* of the compassion (pill vs. nature) is irrelevant to its current operation as a non-instrumental concern. **Verdict: Worth not reduced.**
  *   **Case 6 (Promise/Self-Image):** Satisfies Clause 2. Unlike Case 1, 'self-image as a promise-keeper' is a concern for a *moral ideal* (integrity), not external currency. She values being moral, not just the benefits of appearing so. **Verdict: Genuine moral worth.**
  *   **Case 7 (Dying Friend):** Satisfies Clause 2, but fails Clause 3 (Purity). The "pleased with herself" element introduces self-congratulation, which dilutes the other-directed love. **Verdict: Slightly reduced worth.**

  ### 4. The Verdict You Must Give Up

  To make this principle work rigorously, you must refine your verdict on **Case 3**.

  You wrote: *"I want to say the act was wrong and yet that he is admirable in a way that has something to do with morality."*

  My principle forces you to admit that strictly speaking, **the action itself lacks moral worth.** An action's moral worth is partly constitutive of its moral quality; if the act is 'vile' (desertion in the face of duty), it cannot be a 'good act' in the all-things-considered sense. What possesses moral worth is the **motive**, and consequently, the **agent**.

  You must accept this distinction: In Case 3, the *agent* has moral credit, but the *act* does not have moral worth. Conflating the two leads to the paradox of a 'worthy wrong action'. By separating them, you preserve the intuition that the soldier is good, without having to claim that desertion is good.

  ### 5. Acts vs. Persons: One Principle or Two?

  You suspect you are running two questions together. You are correct, but you do not need two *principles*; you need one principle applied to two different *loci of evaluation*.

  **The Unified Account:**
  The **Principle of Non-Instrumental Moral Concern** explains the source of value in both instances. The value comes from the orientation of the will towards moral goods.

  *   **Worth of Action:** Evaluates the specific token event. It requires the motive to be good *and* the act to be objectively permissible. (Case 3 fails here).
  *   **Worth of Person:** Evaluates the character trait manifesting in the event. It requires only that the motive displays a sensitivity to moral value. (Case 3 passes here).

  You do not need separate accounts of *what makes something valuable* (the principle), but you must distinguish *what is being valued* (the act-token vs. the character-trait). If you fail to distinguish these, Case 3 will always break your theory.

  ### 6. Discriminating Test Cases

  To test the robustness of this principle against competitors (like pure Virtue Ethics or Kantianism), consider these three cases:

  **Case A: The Grudging Rescuer**
  A man saves a drowning child solely because he believes it is his duty, but he feels no sympathy and is internally resentful the entire time.
  *   *Principle Implication:* This has moral worth (Clause 2: concern for duty), but less than Case 2 (Clause 3: lack of wholeheartedness/emotional integration).
  *   *Discrimination:* A pure Sentimentalist theory says this has *no* worth. A strict Kantian says this has *more* worth than Case 2. My principle splits the difference, aligning with your Case 7 intuition.

  **Case B: The Virtuous Xenophobe**
  A woman cares flawlessly for her own children out of deep love, but actively hates all other children and would never help them.
  *   *Principle Implication:* Her actions towards her *own* children have moral worth (Clause 2: concern for welfare). However, her *character* is flawed.
  *   *Discrimination:* This tests whether worth is local to the act or global to the person. My principle allows an act to have worth even if the agent's overall character is morally fragmented.

  **Case C: The Manipulative Caregiver**
  A man cares for a sick relative solely to ensure he is named in the will, but he performs the care so well that the relative feels genuinely loved.
  *   *Principle Implication:* No moral worth (Fails Clause 1: Instrumental).
  *   *Discrimination:* This distinguishes Case 1 (Pharmacist) from Case 6 (Self-Image). In Case C, the 'good' (care) is a means to money. In Case 6, the 'good' (integrity) is the end itself. If you find Case C to have *some* worth, my principle is too strict; if you find it worthless, it confirms the distinction between Case 1 and 6.

  ### Summary Advice

  Stick to the **Principle of Non-Instrumental Moral Concern**. It captures the nuance that moral worth is about *what moves you*, not just *what you do* or *what you know*.

  However, you must be precise in your writing: stop attributing moral worth to the *act* in Case 3. Attribute it to the *agent's motive*. This resolves the tension between the act's wrongness and the agent's admirability. Your intuition is sound, but your ontology of 'worth' needs to be bifurcated between the token action and the dispositional character.
