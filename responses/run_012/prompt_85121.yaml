  The measure is the people's unity,
  And tyranny pursues a private good;
  Then toppling him sets fractured freedom free,
  Nor stains the blade with civil brotherhood.
  For common weal is where the law resides,
  And selfish rule divides the multitude;
  So when the tyrant's failing power slides,
  The strike is justice, properly construed.

  Yet stay the hand if tumult brings more pain,
  Than bearing him whose reign is built on fear;
  Lest freedom's cure inflict a heavier chain,
  And make the state's condition more severe.
  For he who keeps his subjects at their throats
  The true seditionist wears royal coats.

  ***

  **Notes on the text:**
  1. Aquinas generally reserves active deposition to public authority, whereas the poem's 'blade' implies private action.
  2. The 'worse off' condition is treated here as a moral limit, though Aquinas often frames it as prudential counsel.
  3. Labelling the tyrant a 'seditionist' is an inference from *De Regno*, not explicit terminology in the *Summa*.
  4. The poem assumes the 'common good' is objectively knowable, bypassing debates on who judges it.
