answer: |-
  **The List**

  1.  **Formal Consistency:** The theory must explain how individual preferences aggregate into a coherent group preference without cycling. This bites because of Condorcet's paradox and Arrow's Impossibility Theorem. If voters prefer A over B, B over C, but C over A, there is no stable "will" to obey. Furthermore, the discursive dilemma shows that even if every individual is logically consistent on connected propositions, majority voting on each proposition can yield a collectively inconsistent set. An adequate theory cannot ignore that mathematical reality; it must explain how a rational will emerges from potentially irrational aggregates. *Status: Non-negotiable.*

  2.  **Frame Independence:** The identified will must not flip based on irrelevant changes in how options are labeled or ordered. This bites because empirical voting science shows preferences are often constructed by the presentation of choices. If the "will of the people" changes because the ballot order was shuffled, the will is an artifact of the procedure, not a sovereign authority. A theory must distinguish between stable underlying values and transient framing effects. *Status: Non-negotiable for legitimacy.*

  3.  **The Boundary Problem:** The theory must define who constitutes "the people" without presupposing the answer. This bites because democratic procedures require a prior decision on who gets to vote. You cannot vote on who gets to vote without already having a electorate. If the theory cannot specify the boundary non-circularly, the "will" rests on an arbitrary exclusion that the will itself cannot justify. *Status: Non-negotiable metaphysical constraint.*

  4.  **Temporal Stability:** The theory must distinguish between a momentary mood and a settled will capable of binding future generations. This bites in the case of constitutionalism. If the founding generation's will binds later majorities, the theory must explain how a dead hand can claim to represent the living "people." If the will is only what voters decide today, constitutions are illegitimate shackles. The theory must account for intergenerational authority without denying popular sovereignty. *Status: Contested (Living Constitution vs. Originalism).*

  5.  **Normative Constraints:** The theory must address whether the will can legitimately authorize tyranny. This bites in the case of a majority voting to strip a minority's rights permanently. If "the will" is purely descriptive, such a vote is sovereign. If the theory claims this isn't the *true* will, it risks paternalism. An adequate theory must clarify whether popular will is limited by rights or if rights are merely whatever the will permits. *Status: Contested (Liberal Democracy vs. Populism).*

  6.  **Conceptual Distinctions:** The theory must explicitly choose sides on key dichotomies: actual expressed will vs. hypothetical informed will; unitary general will vs. aggregate sum; the whole people vs. the majority vs. actual voters. This bites because conflating these allows politicians to claim a mandate they don't have. If low turnout decides an election, is that the people's will? If the theory collapses "majority" into "people," it licenses minority rule disguised as populism. *Status: Non-negotiable clarity.*

  **The Clash**

  Your suspicion is correct: "Faithful to what people actually will" and "A single consistent rational will" are jointly unsatisfiable under standard conditions. This is the hard lesson of Social Choice Theory. Arrow's Theorem demonstrates that no ranking system can convert individual preferences into a community-wide ranking while satisfying a set of reasonable criteria (including non-dictatorship and independence of irrelevant alternatives). If you demand fidelity to actual, unrestricted individual preferences, you must accept inconsistency (cycling) or dictatorship. If you demand a single, rational, consistent will, you must impose restrictions on inputs (excluding some preferences) or interpretive structures (judging some preferences "irrational").

  The requirement doing the most heavy lifting to exclude candidate theories is **Formal Consistency**. It is the mathematical kill-switch. Any theory claiming that simple majoritarian aggregation reveals a coherent "will" is mathematically false in complex environments. This forces theories to either abandon the idea of a unitary will (accepting fragmentation) or abandon fidelity to actual preferences (positing a "true" will distinct from actual votes). You cannot have both transparency and coherence.

  **Where the Obvious Contenders Land**

  **Rousseau** sacrifices fidelity to actual preferences to save consistency. He distinguishes the "Will of All" (aggregate desires) from the "General Will" (rational common good). This solves the consistency problem but risks elitism; if the people vote against the General Will, they are "forced to be free," allowing leaders to claim they know the people's will better than the people do.

  **The Minimalist Proceduralist** (e.g., Schumpeter) sacrifices consistency to save fidelity. They define the will simply as the outcome of competitive elections. This avoids metaphysical speculation but accepts that the "will" may be cyclic, inconsistent, or manipulated by framing. Legitimacy comes from the procedure, not the rationality of the output.

  **The Constructivist** (e.g., Laclau) denies the pre-existence of the will entirely. The people do not exist until a leader appeals to them. This sidesteps the aggregation problem but makes the "will" entirely contingent on political performance. It explains populism well but offers no normative check against authoritarianism, as the leader creates the will they claim to follow.
