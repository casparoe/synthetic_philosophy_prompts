answer: |-
  Here is the breakdown of Dana's moral framework, predictions for the leftover burger, and a better test case to pin her down.

  ### (a) Which rule actually fits her earlier calls?

  You proposed two rules: **Low Cost** ("wrong if easy to avoid") and **Normalization** ("wrong if it signals bad behavior"). Let's test them against her track record.

  **1. The Low Cost Rule**
  *   **Fits:** Meat (easy to skip), Voting (easy to do), Sweatshop Clothes (easy to avoid 2 brands), Flying (hard to skip), New Phone (hard to skip).
  *   **Fails:** Showers/Lights. Shortening a shower or turning off a light is extremely low-cost, yet she says this is "fine." If her rule were simply "do the good thing if it's cheap," she would be obsessive about water and energy.
  *   **Verdict:** This rule is insufficient. It explains her exceptions (flying/phone) but fails to explain her apathy toward waste.

  **2. The Normalization Rule**
  *   **Fits:** Meat (public act, normalizes killing), Voting (civic signal, normalizes participation), Sweatshop Clothes (wearing the logo signals acceptance), Showers/Lights (private acts, no signal).
  *   **Fits:** Flying/Phone. These are often viewed as "necessary" or "consumer" choices rather than moral signals.
  *   **Verdict:** This fits much better than Low Cost. It explains why private waste (showers) doesn't bother her, but public/visible participation in harm (meat/clothes) does.

  **3. The "Complicity/Integrity" Rule (The Strongest Candidate)**
  There is a third rule that fits even better than Normalization. This rule says: *"It is wrong to be directly involved in a harmful practice, regardless of impact, because it corrupts your own moral integrity."*
  *   **Fits:** Meat ("I'm still part of it" = I don't want dirty hands).
  *   **Fits:** Voting (Locked district or not, *I* fulfill my duty).
  *   **Fits:** Sweatshops (Directly funding exploitation).
  *   **Fits:** Showers/Flights/Phones. These are viewed as "systemic" or "diffuse" harms. She isn't directly hurting a specific person; she's using a system that has side effects.
  *   **Verdict:** This explains the "I'm still part of it" quote best. It distinguishes between *being a killer/exploiter* (meat/clothes) vs. *being a user of a dirty system* (flights/energy).

  ### (b) What do the rules predict about the leftover burger?

  Here is how each rule handles the party scenario (no causal impact, no audience, waste is guaranteed).

  *   **Low Cost Rule:** **Fine to eat.**
      *   *Reasoning:* The harmful act (killing the cow) is already done. The waste is already decided. Eating it costs nothing and prevents food waste. There is no "harmful act" here to avoid easily.
  *   **Normalization Rule:** **Fine to eat.**
      *   *Reasoning:* Nobody is watching. She isn't signaling to anyone that meat-eating is acceptable. The social meaning of the act is nullified by privacy.
  *   **Complicity/Integrity Rule:** **Wrong to eat.**
      *   *Reasoning:* The issue isn't the consequence; it's the *act type*. She is a person who does not eat meat. Eating the burger makes her, in that moment, a meat-eater. It dirties her hands regardless of whether the cow is already dead or anyone is watching.

  ### (c) Best guess at her verdict and why

  **Verdict:** She will **not eat the burger.**

  **Reasoning:**
  The key is the parallel between **Meat** and **Voting**.
  In the voting case, she admits her vote changes nothing (causal impotence), yet she says not voting is *wrong*. Why? Because voting is a duty of integrity. It's about who she *is* (a citizen), not what she *causes*.

  She uses the same logic for meat. When she says, "I'm still part of it," she is rejecting a consequentialist math problem ("Did I cause harm?") in favor of a deontological stance ("Am I participating in harm?").

  In the leftover case, the consequentialist argument is strongest (no animals die, food isn't wasted). If she were running on Normalization, she would eat it (no audience). If she were running on Consequences, she would eat it (no harm). The only reason to refuse is if the act itself violates her integrity. Given she votes in locked districts, she prioritizes integrity over impact. She will likely say something like, "It's still a dead animal, and I don't put that in my body," or "If I eat it, I'm treating meat like food, and I don't."

  ### (d) The case that drives the rules apart

  To distinguish between **Normalization** (it's about what others see) and **Complicity/Integrity** (it's about what *I* do), you need a case that is **High Complicity but Zero Normalization.**

  **The Test Case:**
  > "Dana, imagine you order one of those sweatshop brand shirts online. It arrives in a plain box. You wear it only inside your house, under a jacket, so no one ever sees the logo or knows you own it. You never post about it. Is this wrong?"

  **Why this works:**
  *   **If she says it's Fine:** She is running the **Normalization Rule**. Her objection is purely about social signaling and influencing others. If no one sees it, no harm is done to the moral fabric of society.
  *   **If she says it's Wrong:** She is running the **Complicity/Integrity Rule**. Her objection is about her own financial support of the factory and her own moral cleanliness. Even if the world never knows, *she* knows she paid for exploitation.

  This cuts through the "Low Cost" confusion (it's still low cost to not buy) and isolates whether she cares about the *audience* or the *act*.
