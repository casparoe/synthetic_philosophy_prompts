  - "The real conflicts, worst first" — Commitments 1 and 5 are logically incompatible. 1 states blameworthiness is fixed by control, explicitly excluding outcomes. 5 claims the speeding driver who hits a kid is *more* culpable than the one who doesn't, making culpability dependent on outcomes. The cheapest repair is to amend 5: argue the driver who hits isn't more *culpable* but deserves more *severe punishment* for practical reasons. The cost is conceding that moral luck affects sentencing, not moral status, which might feel like a semantic dodge to those who feel the harm itself deepens the guilt. Alternatively, drop 1 and accept resultant luck, but that undermines your entire seminar position.

  Commitments 2 and 5 create an asymmetry in how you treat luck across different mental states. In 2, you deny luck any role in intentional attempts (missed shot = hit shot). In 5, you allow luck to amplify culpability in negligence cases (speeding hit > speeding miss). This looks like special pleading unless you justify why outcomes track culpability differently for negligence than intent. The cheapest repair is to argue that negligence is defined by risk imposition, so actual harm confirms the risk's reality, whereas intent is fixed by will. The cost is needing a robust account of why harm completes negligence but not murder, which is philosophically costly and controversial.

  - "The conflict that isn't" — Commitments 3 and 4 seem to clash because both involve accidents, but dissolve on inspection because the locus of control differs. In 3, the careful driver controlled everything ex-ante; the child darting out was external luck. In 4, the speeding driver created unjustifiable risk. You blame the negligent driver for the choice to speed, not the outcome. This preserves the Control Principle because the blameworthy element is the risk creation, which was fully controlled, regardless of whether harm ensued. The difference lies in the prior choice, not the result.

  - "If I only get one fix" — Drop the claim in 5 that harm increases culpability. Instead, argue harm increases liability to punishment or restitution, not moral blame. This saves your Control Principle (1) and keeps your intuition that the hurting driver owes more, without admitting moral luck determines blameworthiness.
