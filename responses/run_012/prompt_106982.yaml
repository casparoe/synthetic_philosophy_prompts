  1. I buy the control principle pretty much as stated: what you're blameworthy for is fixed by what was up to you, not by how things turned out.
  2. so a failed attempt and a successful one deserve the same blame when the will behind them is the same — I'd treat the person who fires and misses the same as the one who hits.
  3. I think the careful lorry driver who runs over a child that darts out is not to blame at all — but he'd be a monster if it didn't wreck him, and that haunted "agent regret" business is exactly the fitting response for him.
  4. negligence is genuinely blameworthy though — the guy who speeds through a school zone and nothing happens is still doing something blameworthy, no harm required.
  5. and I think outcomes do matter for negligence: the speeding driver who actually hits a kid is more culpable than the equally speeding driver who doesn't, because you own the foreseeable consequences of your carelessness.

  Is this a consistent set or have I smuggled luck back in somewhere I'm not seeing? I can't tell. go through it and tell me which of these actually pull against each other and how badly, which pairs only look like they're in tension, and for the real ones what the cheapest fix is and what I'd be giving up. be specific about which numbered commitment has to move, don't just say "there are tensions."

