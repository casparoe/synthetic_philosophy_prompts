  6.  **Final Polish:** Ensure the distinction between what Darwin is *reporting* (naturalists' practice) and *asserting* (the reality of graduation/variation) is sharp. (Self-correction: In the "Practically" quote, is he endorsing or reporting? "He treats" suggests reporting. But the context implies Darwin thinks this practice reveals the arbitrariness. I need to flag this ambiguity.)

