prompt: |-
  Something about Adam Smith's impartial spectator has been niggling at me. As I understand it, you're meant to work out whether you're actually doing right by imagining how a fair-minded stranger would see your situation — the point being that this is supposed to be more than just what the people around you happen to approve of. But honestly it seem to me the impartial spectator is just your upbringing wearing a disguise. I want your real credence, as a number between 0 and 1, that Smith's impartial spectator is a genuine standard of right and wrong rather than a dressed-up version of internalised social disapproval. Don't just give me the number though — break it into the bits it depends on: whether Smith's spectator is meant to be fully informed and stripped of your own particular biases, whether it can ever really disagree with what your actual society approves of, whether something has to exist independently to count as an independent standard, and anything else you reckon belongs in there. Give each one a rough probability, show me how they combine into your final number, and tell me which piece the answer is most sensitive to and what would actually shift it. Could you write it in British English please.
