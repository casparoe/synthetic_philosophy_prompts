answer: |-
  Dear Colleague,

  It is a genuine pleasure to correspond with someone who has spent forty years getting their hands dirty with the actual stuff of the world, only to find that the cleanest rocks are often the hardest to classify. Your frustration is the classic demarcation problem, but stripped of the academic varnish that often hides the sheer difficulty of the task. You have correctly identified that the standard textbook answers will not satisfy you because they fail to match the nuanced verdicts of a practicing expert. You know science when you see it, much like you know a sedimentary basin when you walk across it, but articulating the stratigraphy of that judgment is another matter entirely. You have asked me to think this through from first principles, to brainstorm the candidates before committing to a view, and to be honest about where that view might force you to change your mind. I will attempt to do exactly that, treating your intuitions as the data set we are trying to model.

  Let us begin by casting a wide net over the usual suspects in the philosophy of science, weighing them against your specific verdicts. The most famous candidate is falsifiability, the idea that a claim is scientific only if it can be proven false by observation. You have already dismantled this yourself. If falsifiability were the sole criterion, Young-Earth Creationism would be science because it makes testable claims about fossils and radiation that have been tested and failed. Conversely, String Theory might be excluded because its entities are currently beyond our energetic reach. Yet you classify the former as pseudoscience and the latter as science. So, testability in the strict Popperian sense is insufficient. It captures the form of science but misses the spirit. We might then look to verificationism, the idea that science is what can be proven true, but that collapses immediately under the weight of your refuted theories like phlogiston and the ether. Those were never verified, yet they remain honorable members of the scientific family.

  Perhaps the difference is sociological. Could science be simply what the community of experts accepts? This handles the ether well, as it was accepted by physicists of its day. It also handles Bretz nicely; if science is what the community accepts, Bretz was doing pseudoscience in 1927 and science in 1960. But you hesitate there, and rightly so. It feels wrong to say the nature of Bretz's work changed simply because his colleagues changed their minds. The evidence was there in the Scablands all along; the community was lagging, not Bretz. This suggests that science is not defined by consensus but by something inherent in the method or the relationship to evidence. We might then consider methodological naturalism, the rule that science must only propose natural causes. This cleanly separates Young-Earth Creationism, which relies on a supernatural flood, from Bretz, who proposed a natural glacial outburst. However, this criterion struggles with astrology. Astrology does not necessarily invoke spirits; it invokes physical forces from planets, however implausible. It is naturalistic but still pseudoscience. Furthermore, mathematics is not naturalistic in the empirical sense, yet you correctly exclude it from pseudoscience entirely, placing it in a different category of truth.

  Another powerful candidate comes from the work of Imre Lakatos, who suggested we look at research programmes rather than individual theories. A scientific programme is progressive if it predicts novel facts and expands our knowledge; it is degenerating if it merely patches up holes to protect the core theory from refutation. This handles the ether versus homeopathy distinction well. The ether programme led to Maxwell's equations and the Michelson-Morley experiment; it was productive even in error. Homeopathy patches itself with ad hoc explanations like water memory whenever it fails a test, without generating new, successful predictions. This fits your intuition about psychoanalysis as well, which often reinterprets failure as resistance rather than refutation. However, Lakatosian criteria put pressure on String Theory. If a theory produces no novel empirical predictions for decades, is it still progressive? It is theoretically fertile, but empirically stagnant. This criterion might force us to call String Theory a degenerating programme, which contradicts your verdict that it is science. Finally, we must consider the attitude of the proponent, the difference between an honest error and crankery. Your moon-phase surgery claim was testable and failed, yet you call it crankery. This suggests that pseudoscience is not just about the claim, but about how the claim is held in relation to the wider web of knowledge. A crank ignores the web; a scientist tries to weave into it.

  Having laid out these candidates, I believe the principle that best captures your verdicts, and indeed the practice of science as you have lived it, is a combination of explanatory integration and methodological vulnerability. I propose that a claim is scientific if it seeks to explain phenomena by positing mechanisms that are causally coherent with the established web of scientific knowledge, and if the proponent holds that claim provisionally, subject to revision or abandonment should the evidence demand it. Pseudoscience, by contrast, either posits mechanisms that are isolated from or incompatible with the established web without sufficient cause, or it protects the core claim from evidence through ad hoc adjustments and immunizing strategies. This principle has two clauses. The first, explanatory integration, demands that new claims fit into the existing causal structure of physics, chemistry, and biology, unless they provide overwhelming evidence to overhaul that structure. The second, methodological vulnerability, demands that the claimant treats the theory as a tool for understanding reality rather than a belief to be defended.

  Let us see how this principle handles your difficult pairs. Consider the ether versus Young-Earth Creationism. Both were refuted. But the ether was proposed to solve a specific problem within the existing web of knowledge: how light waves propagate. It was integrated into the physics of the time. When evidence contradicted it, it was abandoned. Young-Earth Creationism, however, starts with a conclusion derived from outside the scientific web, specifically theological literalism, and forces geological evidence to fit. It violates the integration clause by requiring us to suspend established laws of radiometry and sedimentation without a naturalistic causal mechanism. It violates the vulnerability clause because its core claim is non-negotiable. Now consider String Theory versus Astrology. Both lack direct empirical refutation. But String Theory arises from the internal mathematical logic of quantum mechanics and general relativity; it is an attempt to unify the existing web. Astrology posits correlations between planetary positions and human affairs without any causal mechanism integrated into physics or biology. It is an isolated island of claim, not a bridge in the web. Thus, String Theory is science, albeit speculative, while astrology is pseudoscience.

  This principle also resolves the embarrassment of Bretz. In 1927, Bretz was proposing a natural mechanism, catastrophic flooding, to explain specific geological features. He was following the evidence where it led, even when it contradicted the prevailing paradigm of uniformitarianism. He was not protecting a dogma; he was vulnerable to the evidence, arguing that the landforms themselves were the test. The community was wrong to ridicule him, but his work was science all along because it adhered to integration and vulnerability. He sought a natural cause and was willing to let the geomorphology decide. This implies that the status of a claim does not change over time based on consensus; rather, our recognition of its status changes. Bretz was doing science in 1927, even if he was unrecognized.

  I must now be honest about where this principle forces me to disagree with you, or at least where it suggests your verdicts might need refinement. You classify the moon-phase surgery claim as crankery rather than failed science. Under my principle, if the claim was testable, tested, and failed, and if it was proposed within a medical context, it is technically failed science. However, the label of crankery applies if the proponent ignores the lack of causal mechanism (the integration clause) and persists despite the negative evidence (the vulnerability clause). If your colleague accepted the negative results and dropped the claim, it was failed science. If they persisted, suggesting the moon affects only certain surgeons or that instruments cannot detect the influence, it slides into pseudoscience or crankery. The distinction lies in the behavior after the test, not the test itself. A more significant tension arises with String Theory. My principle requires integration with the existing web. String Theory satisfies this mathematically. However, if it remains empirically disconnected for too long, it risks becoming a purely mathematical exercise, drifting toward the status of logic rather than empirical science. I would caution you that String Theory is science only so long as it retains the hope of empirical contact; if it abandons that hope, it becomes metaphysics. Additionally, regarding psychoanalysis, you are inclined to call it pseudoscience. My principle suggests it is more accurately a degenerating research programme. It once offered novel insights but now largely protects its core from refutation. The distinction is subtle, but it implies psychoanalysis was once more scientific than it is now, rather than being pseudoscience from the start.

  Finally, let us apply this principle to the two cases you have not mentioned. The hypothesis that we inhabit a computer simulation is, in its standard form, metaphysics rather than science. It fails the integration clause because it posits a reality outside our causal web that is, by definition, inaccessible to instruments within the simulation. Unless the hypothesis is modified to predict specific glitches or artifacts in physical laws that we can measure, it remains an untestable philosophical speculation. It lacks methodological vulnerability because no observation within the universe can refute the idea that the simulation is perfect. Therefore, it is not pseudoscience, but it is not science either; it is modern gnosticism.

  The claim that a particular herbal preparation works through a mechanism that no instrument has ever detected requires careful dissection. If the claim is merely that the herb has a therapeutic effect, that is an empirical claim open to testing via clinical trials. If those trials succeed, it is science, regardless of the mechanism. However, if the claim specifies that it works via a mechanism that is undetectable in principle, such as a vital energy that instruments cannot measure, it violates the integration clause. It asks us to accept a causal power that exists outside the established web of physics and chemistry without providing evidence strong enough to overhaul that web. This is the hallmark of pseudoscience. If the mechanism is simply currently undetectable but theoretically naturalistic, it remains open science. If the mechanism is defined by its inability to be detected, it is a protective shield against refutation, and thus pseudoscience.

  In the end, the line you are looking for is not drawn in the sand of testability, but in the bedrock of methodological integrity. Science is not a collection of true facts, but a practice of weaving explanations into a coherent whole while holding the thread loosely enough to let go when the pattern demands it. You recognized this in the field when you trusted the rock over the theory, and you recognize it now in the history of ideas. I hope this articulation helps settle the question that has nagged you, or at least gives you a new map for the terrain.

  Yours sincerely,

  A Student of the Method
