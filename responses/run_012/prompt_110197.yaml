          *   *Score Impact:* Significant deduction. They didn't follow the logical constraint of the prompt.

      *   **Part (b) - Parity Argument (10 marks):**
          *   *Argument:* Trust exploitation. Both exploit the interviewer's inability to check. Paltering is worse because of deniability/gaslighting ("made to feel that she's the one who jumped to conclusions").
          *   *Critique:* This is actually quite strong. It identifies the core harm (deception/trust violation) and adds a nuanced point about deniability making paltering potentially *worse*. It references Kant (though briefly/somewhat loosely regarding the "murderer at the door" example, implying Kant is "dead" so we look at consequences).
          *   *Score Impact:* Very good reconstruction. Shows understanding of the ethical stakes.

      *   **Part (c) - Moral Difference (12 marks):**
          *   *Stance:* Difference is real but "thinner."
          *   *Reasoning:* In B, interviewer draws the inference. Dev asserts truth, not falsehood. Distinction is Lying vs. Paltering (asserting false vs. letting mislead).
