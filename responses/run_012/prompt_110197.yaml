      *   **Part (a) - Definition & Application (8 marks):**
          *   *Definition:* "statement the speaker believes to be false, made with the intention of getting someone else to believe it." -> *Critique:* Misses the specific target. The class definition was "intention of deceiving" (making them believe the *statement* is true/that the state of affairs holds), but often lying definitions require the intent to warrant the truth or simply intend to deceive. The student says "intention of getting someone else to believe it [the statement? or the false fact?]." The prompt says "intention of deceiving." The student's definition is slightly loose but functionally close.
          *   *Case A:* Correctly identifies it as a lie. Believes false + intends belief. Good.
          *   *Case B:* Argues B *is* a lie "in the morally relevant sense" because the intent to deceive is what matters.
