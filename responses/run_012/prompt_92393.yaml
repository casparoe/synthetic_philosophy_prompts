prompt: |-
  I'm teaching a unit on confirmation theory next term and I want to kick off the Hempel week with Conan Doyle's "Silver Blaze" instead of the usual green apples. Quick reminder of the story in case its been a while: the great racehorse Silver Blaze vanishes the night before the Wessex Cup, its trainer John Straker turns up dead out on the moor with a head wound and a funny little cataract knife lying next to him, and the bookmaker Fitzroy Simpson gets arrested for it. Holmes's famous clue is the dog that made no noise — Inspector Gregory thinks a dog doing nothing in the night-time is nothing, Holmes thinks it's the whole case, because a dog that stays quiet is a dog that knows the person. (Turns out Straker took the horse out himself to lame it and got kicked for his trouble.) Read this through Hempel's raven paradox for me. All ravens are black is logically the same claim as all non-black things are non-ravens, so a green apple or a white shoe should confirm it, which everyone finds absurd. Where does Holmes's silent dog line up with that, and where does it come apart?

  My half-formed hunch is that the two are mirror images and the contrast is the point: Hempel's green apple confirms only in the thin syntactic sense of being an instance that satisfies a generalization, whereas Holmes's silence is evidence only because he's smuggling in a whole causal model of dog behaviour — dogs bark at strangers, so no bark means no stranger — i.e. likelihoods and background knowledge doing the real work. If that's right, does the story actually dramatize the difference between confirmation as a logical relation and confirmation as an inference, and does it show that the raven paradox is a puzzle about the wrong notion? I want a real reading, so push back where the analogy strains: the dog's silence also seems to function as a perfectly ordinary piece of evidence rather than a paradoxical one, and the false lead against Simpson shows how easily absence-evidence gets swamped by a better story. Say something too about the story's own meta-move — what makes the non-event curious is that Holmes already has a model of what should have happened, so the clue is really about a contrast class. End by telling me where the story resists the reading, and where it gets at something the journals don't. No quotes or citations needed, I know the text well enough, and please don't just retell the plot at me.
