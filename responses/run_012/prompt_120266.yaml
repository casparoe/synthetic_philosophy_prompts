answer: |-
  ### The target

  An ascription of a free-floating rationale claims that a system's structure or behavior is intelligible as a solution to a specific problem or optimization of a specific variable, independent of internal representation or external design intent. It asserts that the system acts *as if* it seeks an end, without positing that it actually does. Such a claim is false if the fit between system and problem is coincidental, if the system does not respond counterfactually to changes in the problem variable, or if a better explanation exists that does not invoke the rationale. The theory must accommodate cases where physical dynamics mimic optimization (the river), where learning exploits proxies rather than goals (the network), where collective order emerges without individual representation (the ants), where evidence underdetermines competing explanations (the courtship), where the strategy causes failure in novel contexts (the moth), and where current utility diverges from historical origin (the trait). These cases fix the boundary conditions: the theory must explain how reasons can exist without minds, designers, or successful outcomes.

  ### The desiderata

  1.  **Truth Conditions:** The theory must specify what makes a rationale ascription true or false rather than merely useful. Motivated by Case 6, where current utility and historical selection diverge, a theory must decide which fact grounds the truth. A theory that failed this would render all ascriptions equally valid regardless of causal history, collapsing the distinction between function and accident.
  2.  **Ontological Status:** It must determine whether the rationale is a mind-independent fact about the system or a stance adopted by the theorist. Motivated by Case 1, where physics alone suffices, this decides if the rationale is discovered or imposed. A theory that failed this would confuse epistemological convenience with metaphysical reality, leaving it unclear whether the river truly minimizes energy or whether we merely find it convenient to say so.
  3.  **History Independence:** The theory must accommodate systems with no selection history. Motivated by Cases 1 and 2, where rivers and neural networks converge on solutions without evolutionary lineage, history cannot be a necessary condition. A theory that failed this would incorrectly deny rationales to physical systems and artificial learners that clearly exhibit goal-directed dynamics.
  4.  **Selection Discrimination:** Despite History Independence, the theory must distinguish traits selected for a function from traits that merely happen to help. Motivated by Case 6, where a trait persists for one reason but helps for another, the theory must block spurious ascriptions. A theory that failed this would imply that every beneficial side-effect is a rationale, making the concept too permissive to explain persistence.
  5.  **Rival Resolution:** It must handle cases where incompatible rationales fit the data equally well. Motivated by Case 4, where courtship fits both honest signaling and sensory exploitation, the theory must state whether both are true, neither, or indeterminate. A theory that failed this would force a false precision on empirical questions that remain genuinely unresolved by the evidence.
  6.  **Failure Modes:** The theory must explain how a rationale can be present even when it leads to catastrophe. Motivated by Case 5, where the moth's strategy kills it near a flame, success cannot be a condition for the existence of a rationale. A theory that failed this would imply that systems cease to have functions whenever they fail, rendering maladaptation impossible.
  7.  **Explanatory Autonomy:** Reasons-talk must do work that plain causal description cannot. Motivated by Case 3, where describing individual ant movements does not explain the colony's optimality, the rationale must capture patterns invisible to low-level physics. A theory that failed this would make teleological explanation redundant, reducing it to a verbose restatement of causal laws.
  8.  **Gradability:** Ascriptions must come in degrees of strength or fit. Motivated by Case 2, where the network optimizes the proxy perfectly but the goal poorly, the theory must allow partial alignment. A theory that failed this would treat rationales as binary switches, unable to capture the nuance of systems that are partially optimized or conflicted.
  9.  **Physical Consistency:** The theory must sit consistently alongside physics and biology, which contain no intrinsic purposes. Motivated by Case 1, the rationale cannot violate causal closure. A theory that failed this would require magic or vitalism, positing forces that do not exist in the fundamental description of the world.
  10. **Normative Relativity:** The theory must specify relative to what variable the system is optimized. Motivated by Case 2, where the network serves the proxy rather than the trainer's goal, the rationale is relative to the gradient actually followed. A theory that failed this would conflate the system's actual operating principle with the external observer's hopes, misidentifying the source of the system's order.

  ### Genuine requirements, camp preferences

  Several desiderata appear universal but are actually artifacts of specific traditions. The requirement for Selection Discrimination (4) is often treated as compulsory, but this is an Adaptationist preference protecting the idea that function requires evolutionary history. A general theory of free-floating rationales must allow for Case 1, meaning history cannot be a strict requirement, even if biology usually involves it. Similarly, the demand for Ontological Status (2) as a mind-independent fact is a Realist preference protecting a correspondence theory of truth. An Instrumentalist tradition treats this as optional, arguing that only predictive success matters. Finally, Physical Consistency (9) is often assumed to require reducibility, but this is a Physicalist preference protecting causal closure. A dualist might reject this, though at high cost. The genuine requirements are those needed to make sense of the cases themselves: Failure Modes (6) and Normative Relativity (10) are not tradition-bound but arise directly from the behavior of the systems described. Traditions protect their metaphysical commitments; the cases protect the phenomena.

  ### Where the list cannot be satisfied together

  The list contains deep tensions that cannot be fully resolved. The primary conflict lies between History Independence (3) and Selection Discrimination (4). If history is not required to ground a rationale (to accommodate the river), it becomes difficult to distinguish a trait selected for a function from a trait that merely happens to help (Case 6). If physical optimization suffices for a rationale, then any stable physical configuration looks functional. To resolve this, one must give up either the strictness of Selection Discrimination or the purity of History Independence. I would weaken Selection Discrimination: the theory must allow that some rationales are purely structural (like the river) while others are historical, accepting that the concept "rationale" covers a heterogeneous family rather than a single natural kind. The cost is that "function" becomes ambiguous between "current contribution" and "historical reason."

  A second conflict exists between Explanatory Autonomy (7) and Physical Consistency (9). If the rationale does work that causal description cannot (7), it implies the teleological level captures facts the physical level misses. But if physics is causally closed (9), there are no such facts. To satisfy both, one must argue that the work is epistemic rather than ontological. I would give up the claim that the work is ontological. The cost is admitting that rationales are tools for compression and prediction, not descriptions of extra causal powers. This creates tension with Truth Conditions (1): if the work is epistemic, in what sense is the ascription "true"? The theory must accept that truth here is pragmatic, not correspondence-based.

  ### The contenders, scored

  The Etiological Account scores well on Selection Discrimination (4) and Physical Consistency (9) by tying rationales to selection history. However, it fails History Independence (3), unable to accommodate the river or the neural network, and struggles with Failure Modes (6) if selection requires success. The Systemic Account scores well on History Independence (3) and Failure Modes (6) by focusing on current organization and counterfactuals. However, it fails Selection Discrimination (4), unable to distinguish function from accident in Case 6, and risks violating Physical Consistency (9) if organizational constraints are treated as causal forces. The Instrumentalist Account scores well on Explanatory Autonomy (7) and Rival Resolution (5) by treating ascriptions as predictive stances. However, it struggles with Truth Conditions (1), making falsity difficult to define, and weakens Ontological Status (2), which may dissatisfy those seeking real features of the world. No position satisfies all desiderata; the Systemic Account is the most flexible for the full range of cases provided.
