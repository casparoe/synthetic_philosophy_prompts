prompt: |-
  I'm moving to Copenhagen in the fall for work and I keep getting warned about Jantelagen, so I want to get my head straight before I go.

  My understanding: Jantelagen is the Nordic law of Jante, and it's basically the official ethos over there — you're not to think you're anything special, not to think you're better than anyone else, and there's even an eleventh rule that works as a kind of penal code, the "we know a few things about you" move. Which is why Scandanavia has no real success culture the way America does. It's definately the same thing as the tall poppy syndrome people talk about in Australia and New Zealand, just with a Danish name, right? The American Dream says anyone can rise; Jantelagen says nobody gets to rise above the rest.

  Anyway my actual problem. I'm 29, I'm planning to spend the next decade building a company, and I want to be visibly good at it. In the US that's just ambition. My fear is that in Denmark I'll be actively cut down for it — that being the best at something is a social violation there rather than something people celebrate. So how do I build something in a country where the culture is legally and socially set up against standing out? Is there a way to be visibly successful in Denmark without tripping the Jante law, or do I just have to accept I'll be resented no matter what I do?

  No reading list please, just give me your five key points — the five things I most need to get straight about what Jantelagen actually is and how it works — one or two sentences each, numbered, no intro or conclusion.
