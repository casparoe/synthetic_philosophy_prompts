answer: |-
  Here is the spec for an adequate theory of diachronic rationality, followed by the analysis of your custom case and the structural tensions within the requirements.

  ### Part 1: The Spec (Requirements Table)

  An adequate theory must satisfy the following constraints. Failure to meet a "Non-Negotiable" renders the theory normatively useless; failure to meet a "Contested" requirement places it in a specific school of thought (Resolute, Sophisticated, etc.).

  | Requirement | The Forcing Case / Consideration | Status | What It Rules Out |
  | :--- | :--- | :--- | :--- |
  | **1. Synchronic Coherence** | **The Static Dutch Book.** At any single instant $t$, the agent cannot hold preferences that allow a guaranteed loss (e.g., intransitivity: $A \succ B \succ C \succ A$). | **Non-Negotiable** | Agents with logically inconsistent preference orderings at a moment. |
  | **2. Diachronic Dominance** | **The Standard Money Pump.** An agent cannot end up at outcome $O_{start} - \$\epsilon$ when $O_{start}$ was available and preferred, solely due to their sequence of choices. | **Non-Negotiable** | Theories that permit exploitation as a "style" of rationality. |
  | **3. Dynamic Consistency** | **The Foresight Case.** If an agent plans at $t_1$ to do $X$ at $t_2$, and no new information arrives between $t_1$ and $t_2$, they must do $X$ at $t_2$. | **Non-Negotiable** | **Naive Choice.** (Agents who make plans they know they will break without new info). |
  | **4. Separability (Consequentialism)** | **The Subtree Independence.** Choice at a node should depend only on the future outcomes available from that node, not on how the node was reached (history/path). | **Contested** | **Resolute Choice.** (Agents who let past plans constrain current choices even if current preferences shift). |
  | **5. Description Invariance** | **The Framing Case.** Preferences should not flip based on how the same objective outcome is described or referenced (e.g., "90% survival" vs. "10% mortality"). | **Contested** | **Reference-Dependent Models.** (Theories that treat framing effects as rational). |
  | **6. Information Sensitivity** | **The Learning Case.** Preference reversal is permitted *only* if new information justifies a Bayesian update. | **Non-Negotiable** | Arbitrary preference drift (whims) masquerading as rational updating. |

  ---

  ### Part 2: Analysis of Your Custom Case (The Reference Point Woman)

  **The Setup:**
  *   **Global Preference:** Stable, transitive. Rejects the full loop ($A \to B \to C \to A - \$\epsilon$).
  *   **Local Preference:** Reference point resets at every node. At each step, the next trade looks like a gain relative to the *current* holding.
  *   **Result:** Locally optimal choices sum to a globally dominated outcome.

  **Is She Irrational?**
  According to the spec above, **yes**, but the diagnosis depends on which requirement you prioritize.

  1.  **Violation of Diachronic Dominance:** She ends up with less money and the same good she started with. She was exploited. A theory that calls this "rational" fails Requirement #2.
  2.  **Violation of Description Invariance:** Her valuation of the object changes based on whether she "owns" it (reference point) rather than the object itself. This is a framing effect. If the theory accepts this as rational, it fails Requirement #5.
  3.  **Violation of Separability:** She chooses $B$ over $A$ at step 1, but if offered the whole sequence at step 1, she refuses. Her choice at node 2 depends on the fact that she arrived there via trade, not just the available options.

  **Does Foresight Change the Verdict?**
  *   **If she cannot predict:** She is **Naive**. She violates **Dynamic Consistency** (Req #3). She makes a local choice that contradicts her global plan (which she would have made if asked).
  *   **If she *can* predict and goes along anyway:** She is **Akratic** (Weakness of Will). She knows the sequence leads to a loss, knows her future selves will accept the trades, yet she initiates the sequence. This is a violation of **Dynamic Consistency** in its strongest form. She is effectively betting against herself.

  **What the Theory Must Say:**
  An adequate theory must classify this as a failure of **Separability** combined with **Reference Dependence**. It must state that treating "current endowment" as a normative baseline for rational choice is an error in *outcome individuation*. The "outcomes" are not just the goods, but the goods *plus* the transaction history. If she treats them as distinct outcomes, her preferences are stable, but she is mistaken about the identity of the outcomes (Violation of Description Invariance). If she treats them as the same outcome, her preferences are unstable (Violation of Dynamic Consistency).

  ---

  ### Part 3: The Requirement That Does the "Most Work"

  **Dynamic Consistency (Requirement #3).**

  This is the linchpin. Once you enforce Dynamic Consistency (Plan-Action Alignment), the landscape of viable theories collapses dramatically.

  *   **It kills Naive Choice immediately.** (You cannot plan to resist the pump and then succumb without new info).
  *   **It forces a choice between Resolute and Sophisticated Choice.**
      *   To satisfy Dynamic Consistency + Non-Exploitability, you must either:
          1.  **Sophisticated Choice:** Anticipate your future preference shifts and refuse the *first* step (backward induction). You avoid the pump, but you violate **Separability** (you refuse a trade you would locally prefer because of what happens *later*).
          2.  **Resolute Choice:** Stick to the original plan despite local preference shifts. You avoid the pump, but you violate **Synchronic Coherence** (at $t_2$, you choose an option you currently value less).
  *   **It exposes the impossibility.** It reveals that you cannot have it all. You cannot be Synchronic (always choose what you want *now*), Separable (ignore history), and Unexploitable (avoid pumps) if your preferences are reference-dependent.

  Dynamic Consistency is the filter that separates "psychological description" from "normative theory."

  ---

  ### Part 4: The Impossible Conflict (The Real Result)

  There is a pair of requirements that cannot be satisfied simultaneously if preferences are reference-dependent (as in your custom case).

  **The Conflict: Synchronic Optimization vs. Diachronic Dominance.**

  *   **Synchronic Optimization:** At every moment $t$, the agent must choose the option with the highest utility *at t*.
  *   **Diachronic Dominance:** The agent must not accept a sequence of choices that leads to a strictly worse outcome than an available alternative sequence.

  **Why they conflict:**
  In your custom case, the Reference Point Woman satisfies **Synchronic Optimization**. At every step, she picks the locally preferred option. However, this guarantees a violation of **Diachronic Dominance** (she gets pumped).
  To satisfy **Diachronic Dominance**, she must violate **Synchronic Optimization** (she must refuse a locally preferred trade at $t_1$ to prevent a future loss, or force herself to take a locally disliked option at $t_2$).

  **The Implication:**
  If you insist both are non-negotiable, **no agent with reference-dependent preferences can be rational.** The theory implies that rationality requires preference stability over time. If preferences shift due to endowment/reference, rationality is impossible. This suggests the "Non-Negotiable" status of Synchronic Optimization might be the house rule that needs dropping.

  ---

  ### Part 5: House Rules vs. Non-Negotiables

  Be careful not to mistake the tools of one camp for universal laws.

  | Requirement | Verdict | Why |
  | :--- | :--- | :--- |
  | **Synchronic Coherence** | **Non-Negotiable** | Logic. Intransitivity at an instant is a contradiction in terms. |
  | **Diachronic Dominance** | **Non-Negotiable** | Pragmatics. An agent who guarantees their own loss is functionally broken. |
  | **Dynamic Consistency** | **Non-Negotiable** | Agency. If you cannot execute a plan without new info, you are not a unified agent over time. |
  | **Separability** | **House Rule** | **Sophisticated Camp.** This rule says "history doesn't matter." Resolute choicers reject this. It is not logically required, just methodologically convenient for standard decision theory. |
  | **Preference Stability** | **House Rule** | **Conservative Camp.** This rule says "changing your mind without new info is irrational." Your custom case challenges this. If reference points are part of the utility function, preferences *are* stable, but the function is state-dependent. Demanding state-independence is a theoretical convenience, not a logical necessity. |
  | **No Binding/Commitment** | **House Rule** | **Libertarian Camp.** The idea that you *cannot* bind your future self is a constraint some theories impose. Resolute choice assumes you *can* (via willpower). |

  **Summary:**
  Your custom case breaks **Separability**. The woman evaluates nodes based on how she got there (her reference point).
  *   If you keep **Separability** as a requirement, she is irrational.
  *   If you drop **Separability**, you allow history-dependent choice, which saves her rationality but complicates the theory (you have to explain why history matters normatively).
  *   The **Dynamic Consistency** requirement is the hammer that forces you to make this choice. You cannot ignore it.
