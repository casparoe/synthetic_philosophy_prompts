answer: |-
  Here are the desiderata for a coherent Lexical-Threshold Negative Utilitarianism (LTNU), organized by the work they must do, followed by the structural tensions and the decisive constraint.

  ### I. Substantive Desiderata (The Cases)

  **1. The Hell-Veto Condition**
  *   **Requirement:** The theory must forbid trading a single instance of "threshold-level" suffering for any finite amount of pleasure, regardless of the number of beneficiaries.
  *   **Case:** One person subjected to 50 years of uninterrupted, agonizing torture vs. the entire human population experiencing 1,000 years of perfect bliss.
  *   **Consideration:** This is the core motivation for the view. If the theory allows the trade, it collapses into hedonistic utilitarianism or a weak prioritarianism, failing to capture the *lexical* priority of preventing extreme suffering.

  **2. The Triviality-Avoidance Condition**
  *   **Requirement:** The theory must permit trading sub-threshold pain for massive amounts of pleasure.
  *   **Case:** One person experiencing a minute of mild discomfort (e.g., a vaccination pinch) vs. a billion people receiving a lifetime of moderate happiness.
  *   **Consideration:** Without this, the view collapses into *strong* Negative Utilitarianism (where *any* pain trumps *any* pleasure). This leads to the "benevolent world-exploder" conclusion (it is better to destroy the world than allow a single pinprick), which is widely regarded as a *reductio*.

  **3. The Risk-Sensitivity Condition**
  *   **Requirement:** The theory must provide a determinate verdict on gambles involving a non-zero probability of threshold suffering.
  *   **Case:** A policy that guarantees a century of utopia for 10 billion people, but carries a 1-in-10-billion chance of causing one person to undergo threshold-level torture.
  *   **Consideration:** Real-world policy involves risk. If the theory forbids *any* risk of threshold suffering, it leads to paralysis (since almost all action carries some non-zero risk of catastrophe). If it allows the risk based on expected value, it risks violating the Lexical Veto (via Expected Utility Theory).

  ### II. Structural Desiderata (The Distinctions)

  **4. The Intensity/Duration Asymmetry**
  *   **Requirement:** The theory must specify whether the threshold is triggered by peak intensity, total integrated suffering, or duration.
  *   **Distinction:** Is a year of moderate pain worse than a minute of extreme pain?
  *   **Consideration:** LTNU is usually motivated by the *qualitative* horror of extreme suffering (e.g., torture, agony). If the threshold is based on duration/integration, a long enough headache could theoretically trigger the veto, violating Triviality-Avoidance. The threshold likely needs to be intensity-based.

  **5. The Scale Incommensurability**
  *   **Requirement:** The theory must deny that pleasure and pain lie on a single, symmetric scale.
  *   **Distinction:** Hedonism treats +10 pleasure and -10 pain as equidistant from zero. LTNU must treat them as different kinds of value.
  *   **Consideration:** If they are on the same scale, a "lexical" break is mathematically strange (it implies an asymptote on one side but not the other). The theory needs to explain why pain has a "floor" that pleasure cannot bridge, while pleasure does not have a "ceiling" that pain cannot bridge (or vice versa).

  **6. The Threshold Precision Requirement**
  *   **Requirement:** The theory must state whether the threshold is a sharp fact or a vague boundary.
  *   **Distinction:** Is there a specific neurophysiological state $N$ where suffering becomes "lexical," or is it a sorites series?
  *   **Consideration:** Suffering is phenomenologically continuous. A sharp threshold invites the "cliff-edge" objection (why is *this* neuron firing the difference between permissible and impermissible?). A vague threshold invites indeterminacy (we cannot know if an action is forbidden).

  ### III. Formal Desiderata (Consistency)

  **7. The Representability Requirement**
  *   **Requirement:** The value ordering should ideally be representable by a utility function $U$ mapping outcomes to real numbers ($\mathbb{R}$).
  *   **Consideration:** This allows the use of standard mathematical tools for optimization and comparison. It is the standard assumption in economics and decision theory.

  **8. The Continuity (Archimedean) Requirement**
  *   **Requirement:** For any three outcomes $A \succ B \succ C$, there exists some probability $p$ such that a gamble between $A$ and $C$ is preferable to $B$.
  *   **Consideration:** This is a core axiom of Von Neumann-Morgenstern Expected Utility Theory. It ensures that no outcome is "infinitely" better or worse than another; everything is trade-able given the right odds.

  **9. The Separability Requirement**
  *   **Requirement:** The value of an outcome should depend only on the welfare of the individuals in that outcome, not on the population size of other possible worlds.
  *   **Consideration:** Prevents the threshold from shifting arbitrarily based on how many people exist elsewhere (The "Repugnant Conclusion" avoidance).

  ---

  ### IV. Incompatible Pairs (The Tensions)

  **1. The Lexical Veto vs. The Archimedean Axiom**
  *   **Conflict:** This is the mathematical heart of the problem. The Archimedean axiom (Desideratum 8) states that for any bad outcome $B$ and worse outcome $C$, there is *some* probability of $C$ that you would accept to avoid $B$.
  *   **Why they fight:** LTNU claims there is a suffering level $S$ such that *no* amount of pleasure $P$ outweighs it. In decision-theoretic terms, $S$ is lexically worse than $P$. This violates the Archimedean property. You cannot represent a lexical ordering using standard real numbers ($\mathbb{R}$) because real numbers are Archimedean (there are no infinities).
  *   **Result:** To keep the Lexical Veto, you must abandon standard Expected Utility Theory or use hyperreal numbers/superreal utility functions.

  **2. The Sharp Threshold vs. Phenomenological Continuity**
  *   **Conflict:** Desideratum 6 (Precision) vs. the nature of pain.
  *   **Why they fight:** Pain intensity varies continuously. If the threshold is sharp, there must be two possible states of the world, identical except for a microscopic difference in neural firing, where one is permissible and the other is morally catastrophic. If the threshold is vague, the theory cannot guide action in borderline cases (which are most cases).
  *   **Result:** You must either accept moral "cliffs" (metaphysically costly) or accept indeterminacy (practically costly).

  **3. Risk Sensitivity vs. The Hell-Veto**
  *   **Conflict:** Desideratum 3 (Risk) vs. Desideratum 1 (Veto).
  *   **Why they fight:** If you strictly forbid any action with a non-zero probability of threshold suffering, you cannot drive a car, build a power plant, or prescribe medicine (all carry non-zero risk of catastrophic error). If you allow a "de minimis" risk exception, you effectively reintroduce trade-offs (e.g., "1 million lives for a 0.00001% risk of torture"), which begins to erode the lexical claim.
  *   **Result:** The theory must either be paralyzing or admit a "probability threshold" that mirrors the "suffering threshold," complicating the lexical structure.

  ---

  ### V. The Killer Requirement

  The single requirement that does the most to knock out popular candidates is **Desideratum 8: The Continuity (Archimedean) Requirement.**

  **Why:**
  Most philosophers and economists want to keep standard decision theory (Expected Utility) intact because it is the only well-understood framework for handling risk and aggregation. They want to say, "We can still do cost-benefit analysis, just with a heavy weight on suffering."

  However, **Lexicality is logically incompatible with Continuity.**
  *   If you satisfy Continuity, you *must* allow a trade-off (given low enough probability or high enough pleasure), which violates the core definition of LTNU.
  *   If you satisfy the Lexical Veto, you *must* violate Continuity, which breaks Expected Utility Theory.

  Consequently, most "popular" attempts fail because they try to have it both ways: they assert a lexical threshold verbally but model it using continuous functions mathematically. This forces a choice: either abandon the lexical claim (collapsing into prioritarianism) or abandon standard decision theory (requiring complex, non-standard mathematics like lexicographic probability systems or hyperreals). The latter is the price of admission for a coherent LTNU, and it is the hurdle most candidates fail to clear.
