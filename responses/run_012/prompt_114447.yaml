  In a social-choice seminar we keep circling the aggregation problem: how to combine many individuals' preferences or welfare levels into a single social ranking. Harsanyi's aggregation theorem is our touchstone — a social preference that is rational in the expected-utility sense and that respects unanimous individual preference turns out to be representable as a weighted sum of individual utilities, with a further symmetry assumption fixing the weights as equal. Before we assess any particular theory in this area, I want the specification. Set out the desiderata an adequate theory of interpersonal aggregation must meet, giving the case or intuition behind each. Include at least these: the unanimity (Pareto) requirement; the demand that aggregation respect the distinctness of persons rather than treating society as a single large agent; the requirement that it be sensitive to how welfare is distributed and not only to its total, so that it neither licenses the repugnant conclusion nor counts a leveling-down of everyone as an improvement; and the requirement that it get the ex ante / ex post fairness distinction right — the case in which a policy gives each person the same chance of a benefit yet must in the end single someone out, so that two options with identical individual expected utilities can still differ in fairness. For each desideratum, state the case that motivates it. Then say which subset of these requirements cannot be satisfied together, and which single requirement does the most to exclude otherwise attractive theories. Keep the weight on the requirements and their motivating cases; I will handle the scorecard myself.
