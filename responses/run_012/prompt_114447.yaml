answer: |-
  Here is the specification of desiderata for an adequate theory of interpersonal aggregation, structured for our seminar's assessment.

  ### I. The Desiderata

  **1. The Unanimity (Pareto) Requirement**
  *   **Specification:** If every individual in the society prefers outcome $X$ to outcome $Y$, then the social ranking must prefer $X$ to $Y$. Furthermore, if everyone is indifferent, society must be indifferent.
  *   **Motivating Case:** *The Voluntary Trade.* Consider two individuals, Alice and Bob. Alice has an apple; Bob has an orange. Alice prefers the orange; Bob prefers the apple. They trade. Both are better off; no one is worse off. Any social aggregation rule that ranks the pre-trade status quo as superior or equal to the post-trade outcome violates the basic liberal intuition that individuals are the best judges of their own welfare. Unanimity is the minimal condition for a social ordering to count as respecting individual sovereignty.

  **2. The Distinctness of Persons Requirement**
  *   **Specification:** The aggregation function must not treat the sum of individual utilities as if it were the utility of a single, super-agent. It must respect the boundaries between individuals, such that a loss to one person cannot be fully compensated for by a gain to another without remainder.
  *   **Motivating Case:** *The Organ Transplant.* A surgeon has five patients dying of organ failure and one healthy visitor. Killing the visitor and distributing his organs would maximize the total sum of welfare (five lives saved vs. one lost). A theory that treats society as a single agent accepts this trade-off as rational. The Distinctness requirement captures the intuition that the visitor has a right not to be used merely as a means to the welfare of the five. The separateness of persons blocks the simple cancellation of losses and gains across different lives.

  **3. The Distributional Sensitivity Requirement**
  *   **Specification:** The social ranking must be sensitive to *how* welfare is distributed, not merely to the total sum. It must avoid the **Repugnant Conclusion** (preferring a massive population with lives barely worth living over a small population with excellent lives) and avoid **Leveling Down** (counting it as an improvement to make the better-off worse off to achieve equality, if it helps no one).
  *   **Motivating Case:** *Parfit's Two Populations.* Population A has 1 billion people with very high welfare. Population Z has 100 billion people with lives that are barely worth living. Total welfare in Z is higher. Pure summation prefers Z. Intuition rejects this. Conversely, consider a world where the rich are made poorer to match the poor, but the poor receive no benefit. Equality is increased, but total welfare drops. Intuition says this is not an *improvement*, even if equality is valuable. An adequate theory must navigate between these poles, valuing equality without being enslaved to it.

  **4. The Ex Ante / Ex Post Fairness Requirement**
  *   **Specification:** The theory must distinguish between the fairness of a procedure (ex ante) and the fairness of an outcome (ex post). Specifically, it must be able to rank two policies differently even if they yield identical vectors of individual expected utilities, provided one policy respects equal claims better than the other.
  *   **Motivating Case:** *The Fair Coin vs. The Correlated Lottery.* Consider an indivisible benefit (e.g., a life-saving drug) and two equal claimants, A and B.
      *   *Option 1 (Fair Coin):* A coin is flipped. Heads: A gets the drug. Tails: B gets the drug. (Expected Utility: 0.5 for each).
      *   *Option 2 (Correlated Lottery):* Two independent coins are flipped. If both heads, A gets it. If both tails, B gets it. If mixed, neither gets it (or a variation where probabilities are tuned to match expectations).
      *   *The Crux:* More simply, compare a **Fair Coin** (one wins, one loses) against a **Deterministic Assignment** where we somehow assign expected utilities of 0.5 to each (perhaps through compensation). If the theory aggregates only expected utilities, it cannot distinguish the Fair Coin from an unfair process that yields the same statistical expectations. The intuition is that the Fair Coin respects the equal moral claim of A and B in a way that a biased procedure does not, even if the "math" of expected welfare is identical. The theory must capture the moral value of the *chance* itself, not just the *expectation*.

  ***

  ### II. The Inconsistency

  You cannot satisfy **Unanimity (interpreted as Ex Ante Pareto)**, **Distributional Sensitivity**, and the **Ex Ante / Ex Post Fairness Requirement** simultaneously within a standard Expected Utility framework.

  This is the core tension highlighted by Diamond (1967) and Broome (1991).
  *   If you satisfy **Unanimity (Ex Ante Pareto)**, you are committed to ranking social options based solely on the vector of individual expected utilities. This forces you to treat the "Fair Coin" and any other lottery with the same expected utilities as identical, violating the **Ex Ante / Ex Post Fairness Requirement**.
  *   If you satisfy **Ex Ante / Ex Post Fairness** (by valuing the fair lottery over the unfair one despite identical expectations), you must violate **Ex Ante Unanimity**. (In Diamond's case, both individuals might prefer a deterministic allocation over a lottery due to risk aversion, yet the lottery is fairer; or, society prefers the lottery for equity reasons even if it violates an ex-ante Pareto improvement).
  *   Furthermore, Harsanyi's theorem demonstrates that **Unanimity** + **Rationality (Expected Utility)** entails Utilitarianism (weighted sum). Utilitarianism inherently violates **Distinctness of Persons** and **Distributional Sensitivity**.

  Thus, the subset {Unanimity, Distinctness/Distributional Sensitivity, Ex Ante/Ex Post Fairness} forms an inconsistent triad under standard rationality constraints.

  ### III. The Exclusionary Requirement

  The single requirement that does the most to exclude otherwise attractive theories is **Distributional Sensitivity** (specifically the constraint against the Repugnant Conclusion and the demand for equity).

  **Reasoning:**
  Classical Utilitarianism (derived from Harsanyi's theorem) is the most "attractive" theory in terms of formal elegance: it satisfies **Unanimity**, it satisfies **Rationality** (completeness, transitivity, independence), and it handles risk cleanly. It is the path of least resistance for a social choice theorist.

  However, **Distributional Sensitivity** is the primary philosophical wedge that forces us to reject Utilitarianism. It is the demand that we care about the *shape* of the welfare distribution, not just the *size*. This requirement excludes Utilitarianism immediately (as it is indifferent to distribution) and also excludes many forms of Prioritarianism that fail to avoid the Repugnant Conclusion. It is the constraint that compels us to complicate the aggregation function, forcing the trade-offs with Unanimity and Rationality that define the modern debate. While **Distinctness of Persons** provides the moral *justification* for this constraint, **Distributional Sensitivity** is the operational requirement that breaks the Harsanyi framework.
