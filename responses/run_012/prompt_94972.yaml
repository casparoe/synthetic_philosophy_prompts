  I've been reading the rationality blogs and forums for the better part of two decades, so the Solomonoff story about Occam's razor got into me early: simplicity as short program length, the universal prior as a mixture over all computable hypotheses, prediction by conditioning, and the invariance and dominance results that are supposed to make the whole thing canonical rather than one convention among many. In my day job I'm a working statistician, and the vocabulary I actually reason in is narrower and more concrete: a model class M, a prior p(θ) over it, the marginal likelihood as the evidence for a class, two-part and prequential code lengths in the MDL style, the normalized maximum likelihood and its minimax regret, explicit complexity penalties and regularizers, and the occasional PAC-Bayes bound. Restate the Solomonoff account of Occam's razor, as faithfully as you can, in that vocabulary. I want the translation itself, not a defense of either side, and I want the residue report at the end: which claims carry over cleanly, which survive only in a distorted form, and which cannot be said at all once I insist that the prior range over a fixed, finite, computable model class rather than over all programs. In particular, tell me what becomes of the invariance theorem and of the dominance result — the claim that universal prediction is within a constant of any computable predictor — under that restriction, and whether simplicity remains a single objective quantity or becomes relative to a chosen code or class. Then give me your read on the residue: where the translation fails, is that a defect of my statistical vocabulary — something it genuinely cannot represent — or a sign that the original claims were doing less work than their framing suggested, with the aura of canonicity an artifact of an idealization no working method can implement?
