answer: |-
  ### The Translation: Solomonoff Induction in Statistical Vocabulary

  **1. The Hypothesis Space and Prior**
  In the Solomonoff account, the hypothesis space is the set of all binary programs $p$ that halt on a Universal Turing Machine (UTM) $U$. In your statistical vocabulary, this translates to a **countable mixture of model classes**.

  Let $\mathcal{M} = \{M_1, M_2, \dots \}$ be a sequence of model classes, where each $M_k$ corresponds to a specific computational structure (e.g., Turing machines with $k$ states, or polynomial regressions of degree $k$). Each model $M_k$ has a parameter space $\Theta_k$ and a likelihood function $P(x \mid \theta_k, M_k)$.

  The Solomonoff prior $P_{Sol}(x)$ is a **Bayesian marginal likelihood** over this infinite ensemble:
  $$ P_{Sol}(x) = \sum_{k=1}^{\infty} \pi(M_k) \int_{\Theta_k} P(x \mid \theta_k, M_k) \, \pi(\theta_k \mid M_k) \, d\theta_k $$
  Here, the "program length" $|p|$ maps to the **negative log-prior weight**. A program $p$ specifies both the model index $k$ and the parameters $\theta_k$. The Solomonoff prior assigns weight $\pi(p) = 2^{-|p|}$. In your terms, this is a **complexity-penalized hyper-prior**:
  $$ \pi(M_k) \propto 2^{-L(k)} $$
  where $L(k)$ is the description length of the model structure itself. The "Occam's Razor" effect is not an explicit penalty term added to a loss function, but the result of **model averaging** with an exponentially decaying prior over model complexity.

  **2. Prediction and Loss**
  Solomonoff prediction is the posterior predictive distribution:
  $$ P(x_{n+1} \mid x_{1:n}) = \frac{P_{Sol}(x_{1:n+1})}{P_{Sol}(x_{1:n})} $$
  In your vocabulary, this is standard **Bayesian updating**. The loss function implicit in Solomonoff induction is **log-loss** (self-information). Minimizing expected log-loss is equivalent to minimizing the expected codelength of the data.

  **3. MDL Equivalence**
  The Solomonoff measure $P_{Sol}(x)$ corresponds to the **Integrated Completed Likelihood (ICL)** or the **Bayesian MDL** code length:
  $$ L_{Sol}(x) = -\log P_{Sol}(x) $$
  This contrasts with **Two-Part MDL**, which selects a single best $\hat{\theta}$ and encodes $x$ as $(\hat{\theta}, x \mid \hat{\theta})$. Solomonoff induction is strictly an **Integrated MDL** approach: it sums (integrates) over all parameters and models, weighted by their prior probability. The "shortest program" is not selected; rather, the prediction is a mixture dominated by short programs.

  ---

  ### The Theorems Under Restriction

  You asked to restrict the prior to a **fixed, finite, computable model class** $\mathcal{M}^* = \{M_1, \dots, M_K\}$. This is the standard working assumption in statistics (e.g., generalized linear models, finite neural nets). Here is what happens to the canonical results.

  **1. The Invariance Theorem**
  *   **Solomonoff Claim:** For any two UTMs $U$ and $U'$, $|K_U(x) - K_{U'}(x)| \le c_{U,U'}$, where $c$ is a constant independent of $x$. Simplicity is objective up to an additive constant.
  *   **Statistical Translation:** Invariance becomes **asymptotic equivalence of efficient codes** within a class. If you change the parameterization $\theta \to \phi(\theta)$ (a diffeomorphism), the Bayesian marginal likelihood is invariant (up to the Jacobian, which cancels in the posterior).
  *   **Under Restriction:** The theorem **fails**. If you change the model class (e.g., from Polynomials to Splines), the difference in codelength $-\log P_{\mathcal{M}_A}(x) - (-\log P_{\mathcal{M}_B}(x))$ is **not** bounded by a constant. It grows linearly with $n$ if the true distribution lies in $\mathcal{M}_A$ but not $\mathcal{M}_B$.
  *   **Result:** Simplicity ceases to be a single objective quantity. It becomes **relative to the chosen model hierarchy**. There is no "constant" that absorbs the difference between a linear model and a quadratic model; the regret diverges.

  **2. The Dominance Result**
  *   **Solomonoff Claim:** The universal prior $M$ dominates any computable measure $\mu$: $M(x) \ge c_\mu \mu(x)$. This guarantees convergence to the truth if the truth is computable.
  *   **Statistical Translation:** This maps to **minimax regret** or **PAC-Bayes bounds**. A mixture prior $\pi$ over a class $\mathcal{M}$ ensures that the regret is bounded by $\log(1/\pi(\theta^*))$.
  *   **Under Restriction:** The dominance holds **only over the support of the prior**. If the true data-generating process $P^*$ is not in $\mathcal{M}^*$ (model misspecification), the dominance bound breaks. You dominate any $P_\theta \in \mathcal{M}^*$, but you do not dominate $P^*$.
  *   **Result:** The guarantee shifts from "convergence to truth" to "convergence to the **projection** of truth onto the model class" (minimizing KL divergence within $\mathcal{M}^*$). The "any computable predictor" claim shrinks to "any predictor representable in $\mathcal{M}^*$."

  ---

  ### Residue Report

  **1. What Carries Over Cleanly**
  *   **Bayes-MDL Equivalence:** The identification of negative log-probability with codelength is exact. $-\log P(x)$ is the optimal codelength for $x$ under code $P$.
  *   **Occam as Prior Mass:** The intuition that "simpler models get higher prior weight" translates perfectly to assigning $\pi(M_k) \propto 2^{-L(k)}$.
  *   **Predictive Coherence:** The requirement that predictions be coherent (satisfy Kolmogorov axioms) maps directly to Bayesian consistency.

  **2. What Survives in Distorted Form**
  *   **Invariance:** Becomes **reparameterization invariance** (within a class) rather than **representation invariance** (across classes). The "constant" becomes a function of the model class distance.
  *   **Dominance:** Becomes **oracle inequalities**. You perform nearly as well as the best model *in your class*, not the best computable model *period*.
  *   **Universality:** Becomes **consistency**. You converge to the truth only if the truth is contained in the union of your finite classes (realizability assumption).

  **3. What Cannot Be Said At All**
  *   **The "Constant" Guarantee:** You cannot claim that changing your modeling language costs only a constant amount of data to overcome. In finite classes, changing the basis can cost $O(n)$ regret.
  *   **Absolute Complexity:** You cannot define $K(x)$ without reference to the specific coding scheme or model class. Complexity is **relative entropy** with respect to the reference measure, not an intrinsic property of the string.
  *   **Uncomputable Truth:** You cannot formally handle the case where the truth is computable but lies outside your fixed finite class without admitting that your bounds are vacuous.

  ### The Read: Defect or Artifact?

  The translation failure is not a defect of your statistical vocabulary; it is a sign that the **Solomonoff claims derive their strength from the idealization, not the mechanism.**

  1.  **The "Constant" is a Horizon:** The Invariance Theorem relies on the constant $c_{U,U'}$ being independent of $x$. In practice, $c_{U,U'}$ depends on the compiler between machines. For any realistic $n$, this constant can dwarf the data. The statistical vocabulary forces you to account for the **finite sample regime**, where the "constant" is actually a massive overhead. The "canonicity" of Solomonoff induction is an asymptotic property ($n \to \infty$) that offers no guidance on model selection for finite $n$.
  2.  **Misspecification is the Norm:** The Dominance Result assumes the truth is in the support of the prior (or is computable). Working statistics assumes **misspecification** is the default state. When you restrict to a finite class, you admit you are approximating. The Solomonoff account hides this approximation behind the "Universal" label. The statistical vocabulary exposes it as **bias-variance trade-off**.
  3.  **Simplicity is Relative:** The statistical view reveals that "simplicity" is not a single dimension (program length) but a **manifold of trade-offs** (parameter count, curvature, VC dimension, Rademacher complexity). Solomonoff collapses these into one number ($|p|$). When you restrict to a finite class, that collapse is no longer sustainable; you must choose *which* complexity measure matters for your class (e.g., $L_1$ vs $L_2$ penalty).

  **Conclusion:** The aura of canonicity in the Solomonoff account is an artifact of the **UTM idealization**. It creates a mathematical closure (all computable functions are included) that eliminates the problem of model selection by fiat. Your statistical vocabulary lacks this closure because it reflects the **physical constraint** that a working statistician must choose a specific tool for a specific problem. The "residue" that vanishes in translation is the promise that the choice of tool doesn't matter asymptotically. The translation reveals that for any implementable method, the choice of tool (model class) is the dominant factor in performance, not the universal prior. The Solomonoff account is a **normative bound** for ideal agents; the statistical vocabulary is a **descriptive calculus** for constrained agents. The failure to translate the Invariance Theorem is not a loss of information, but a correction of a false promise.
