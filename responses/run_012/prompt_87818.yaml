  Also, need to address the "line segment intersection" issue on non-convex sets. If the frontier is non-convex, the line from $d$ to $u^*$ might intersect the *boundary* but not the *Pareto frontier* (it could hit a dominated region if the set isn't comprehensive, or skip a non-convex dent). Standard KS assumes comprehensive convex sets usually. I need to highlight this geometric friction.

