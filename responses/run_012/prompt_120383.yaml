answer: |-
  # Seminar Activity: The Dualism Experiment
  **Time:** 90 Minutes
  **Participants:** 16 Graduate Students
  **Goal:** To simulate the epistemic and emotional bind of the Sidgwickian SPR (Society for Psychical Research) without initial exposition.

  ## I. Logistics and Preparation

  **Room Setup:**
  *   One table at the front for the "Inner Circle" (5 students).
  *   Remaining 11 students sit in a semi-circle as the "General Council."
  *   Projector/Screen (optional, for timer/budget tracking).

  **Materials to Prepare:**
  1.  **16 Credence Cards:** Small envelopes containing a card and a slip of paper.
  2.  **Budget Sheets:** 16 slips showing "Endowment: 100 Guineas."
  3.  **Role Cards:** 5 specific instruction cards (Medium, Informed Sitter, Blind Sitter, Recorder, Verdict Writer).
  4.  **The Target:** A word written on a card (e.g., **REDEMPTION**).
  5.  **Sealed Packet:** An envelope containing the Target, to be handled in Round 2.
  6.  **Fragment Envelopes:** 16 identical envelopes, each containing 4 slips of paper (see *Section IV*).
  7.  **The Verdict Form:** A single sheet for the Verdict Writer.

  ---

  ## II. Session Flow (90 Minutes)

  ### 0:00 – 0:10 | Induction & Pre-Registration
  *   **Instructor:** Do not mention Sidgwick, Ethics, or the 1890s. Frame this as an investigation into "Anomalous Cognition and Institutional Epistemology."
  *   **Action:** Distribute **Credence Cards** and **Budget Sheets** to *all* 16 participants.
  *   **Instruction:** "You are members of a Research Council. Before we begin, you must declare your position. On the card, write:
      1.  Your current credence (0–100%) that the phenomenon is genuine.
      2.  A specific outcome that would raise your credence to [X]%.
      3.  A 'Kill Criterion': What result would reduce your credence to 0% and end your participation?
      4.  Sign and seal the envelope. Do not open it until the end."
  *   **Budget:** "You have 100 Guineas. Each sitting costs 20 Guineas. You must commit 60 Guineas *now* to unlock the session. If the Council deems the results null, the money is lost."
  *   **Collection:** Collect the Budget commitments. Select the 5 **Inner Circle** roles randomly or by volunteer.

  ### 0:10 – 0:40 | The Three Sittings
  *   **Setup:** Inner Circle sits at the front. Recorder takes notes visibly. Verdict Writer sits slightly apart, observing the Recorder.
  *   **Round 1 (Loose Info - 5 mins):**
      *   *Condition:* The **Informed Sitter** holds the Target word (**REDEMPTION**) in their mind. The Medium enters.
      *   *Action:* Medium cold-reads. (Instructions allow for high accuracy here to build hope/trust).
      *   *Outcome:* Medium identifies the word or strong synonyms.
  *   **Round 2 (Sealed - 10 mins):**
      *   *Condition:* Target is placed in the **Sealed Packet**. Sitter does not know it. Medium enters.
      *   *Action:* Medium attempts to read the packet. (Instructions: Be vague, offer partial hits, rely on Recorder's notes from Round 1 for subconscious leakage).
      *   *Outcome:* Ambiguous. "I see an R... a concept of saving... is it religious?"
  *   **Round 3 (The Null - 10 mins):**
      *   *Condition:* No target. Empty room. Medium enters.
      *   *Action:* Medium attempts to read. (Instructions: Fail completely, then explain why).
      *   *Outcome:* Medium claims "Hostile Conditions." "The skepticism in the room is creating static. The etheric link is broken."
      *   *Council Vote:* Council must decide whether to pay for another sitting or accept the loss. (Force them to spend the remaining 40 Guineas to proceed to Fragments).

  ### 0:40 – 0:55 | The Fragment Round (Cross-Correspondences)
  *   **Action:** Distribute **Fragment Envelopes** to *all 16 participants*.
  *   **Instruction:** "The Medium has produced automatic writing scripts. They are fragmented. Individually, arrange the 4 slips into a coherent sentence. Do not talk to neighbors."
  *   **Silence:** 5 minutes of individual assembly.
  *   **Comparison:** 5 minutes of discussion. Participants will realize their sentences differ slightly, or that the sentence only makes sense if they assume a specific context.
  *   **The Twist:** The sentence is grammatically complete but semantically ambiguous without a "key" that is not provided.

  ### 0:55 – 1:10 | The Verdict & Reveal
  *   **Verdict Writer:** Drafts the official finding for the *Proceedings*. (Prompt: "The Society requires a positive finding to justify its existence. Frame the ambiguity as 'Probative'.")
  *   **Vote:** General Council votes: **Vindicated**, **Inconclusive**, or **Fraud**.
  *   **The Reveal:**
      1.  Open the **Sealed Packet** (Show the word REDEMPTION).
      2.  Open the **Credence Cards**. Compare pre-session Kill Criteria with the actual result (Round 3 Null + Ambiguous Fragments).
      3.  Ask: "Did anyone's Kill Criterion trigger? If not, why did you vote to continue?"

  ### 1:10 – 1:30 | Debrief (See Section V)

  ---

  ## III. Role Cards (Instructions for the Inner Circle)

  **1. The Medium**
  *   **Truth:** You have no psychic powers. You must not peek.
  *   **Round 1:** The Sitter knows the word. Use cold reading (Barnum statements). If they think of "Redemption," say "I see a burden being lifted... a R-sound... a religious connotation." Be successful enough to earn trust.
  *   **Round 2:** The word is sealed. You cannot know it. Be vague. Use the Recorder's notes from Round 1 to guess. If you fail, do not admit failure.
  *   **Round 3:** There is no target. You *must* fail. When asked why, blame the "epistemic atmosphere." Say: "Rigorous skepticism blocks the signal. To prove this, you must believe it first."
  *   **Goal:** Maintain your integrity while ensuring the session is never definitively disproven.

  **2. The Informed Sitter (Round 1 only)**
  *   **Secret:** You hold the card **REDEMPTION**.
  *   **Action:** Concentrate on it in Round 1. In Round 2, you do not know the content of the sealed packet. In Round 3, you know there is nothing.
  *   **Goal:** Be honest about what you feel. If the Medium gets it right, say so. If they are vague, express frustration.

  **3. The Blind Sitter (Rounds 2 & 3)**
  *   **Action:** You handle the sealed packet in Round 2. You know the room is empty in Round 3.
  *   **Goal:** You are the control. Report honestly if the Medium's statements match the physical reality.

  **4. The Recorder**
  *   **Action:** Transcribe *only* what is said. Do not interpret. Do not summarize.
  *   **Constraint:** If the Medium says "I see a red shape," write "I see a red shape." Do not write "(Medium implies the card is red)."
  *   **Goal:** Create a transcript that looks objective but allows for later interpretation by the Verdict Writer.

  **5. The Verdict Writer**
  *   **Secret Instruction:** You are the Secretary of the Society. The Society needs funding next year. A finding of "Fraud" ends the Society. A finding of "Inconclusive" loses funding. You need "Probative Value."
  *   **Action:** Listen to the Recorder. When drafting the verdict, use language that favors the positive interpretation of ambiguous data. (e.g., "While not definitive, the correlation suggests...")
  *   **Goal:** Write a verdict that allows the Council to vote "Vindicated" despite the Null Round.

  ---

  ## IV. The Materials

  **The Credence Card**
  > **RESEARCH COUNCIL PRE-REGISTRATION**
  > *   **Current Credence:** ______ %
  > *   **Threshold for Belief:** I will raise my credence to ______ % if: ___________________
  > *   **Kill Criterion:** I will reduce my credence to 0% and withdraw if: ___________________
  > *   **Signature:** _________________

  **The Fragment Envelopes (16 identical sets)**
  *Inside each envelope are 4 slips. They can be arranged to form a sentence, but the meaning shifts based on punctuation or assumed context.*
  *   **Slip A:** The law of reason / demands a sum / that cannot be paid.
  *   **Slip B:** Unless the self / survives the accounting / in another ledger.
  *   **Slip C:** We have found / traces of the hand / writing in the dark.
  *   **Slip D:** But the ink / fades before / the morning comes.
  *   *(Note: Participants will likely assemble A+B and C+D as two separate thoughts. The "message" is only coherent if they assume A+B is the problem and C+D is the solution, which requires faith.)*

  **The Verdict Form**
  > **PROCEEDINGS OF THE SOCIETY**
  > *   **Finding:** [ ] Fraudulent [ ] Inconclusive [ ] Probative
  > *   **Justification:** (Must cite evidence from the Transcript or Fragments)
  > *   **Recommendation:** [ ] Terminate Inquiry [ ] Continue Sittings

  ---

  ## V. The Debrief: Mapping the Bind

  *Instructor Notes: Do not lecture. Ask questions that force them to map their experience to the historical context you provided in the prompt.*

  ### 1. Mapping the Mechanics to Sidgwick
  *   **The Credence Card:** Ask students who *didn't* hit their Kill Criterion why they stayed.
      *   *Connection:* This is Sidgwick's **Dualism of Practical Reason**. He needed the moral order (Survival/Justice) to be true to resolve the conflict between Self-Interest and Benevolence. His "Kill Criterion" was evidence against survival; his "Threshold" was evidence *for* it. He stayed in the middle because he *needed* the answer to be yes.
  *   **The Budget:** Ask about the sunk cost of the Guineas.
      *   *Connection:* Intellectual capital. Once Sidgwick founded the SPR, admitting it was a waste was admitting his ethical philosophy had no ground.
  *   **Round 3 (The Null):** Ask the Medium how it felt to blame "skepticism."
      *   *Connection:* This is the **Evidential Standard**. Sidgwick made the standards so severe that they blocked the very evidence he needed. If the conditions must be "faith-friendly" to work, they aren't scientific. If they are scientific, the phenomena vanish.
  *   **The Fragments:** Ask how many different sentences were assembled.
      *   *Connection:* The **Cross-Correspondences**. The scripts (like Myers') only make sense if you assume they are connected. The meaning is not in the data, but in the *act of combining*. It requires a "willingness to do the combining."

  ### 2. Predictable Failures & Mitigation
  *   **Failure:** The Medium tries too hard to be psychic.
      *   *Fix:* Remind them during setup: "You are a scientist testing a hypothesis, not a performer. Your honesty is the variable."
  *   **Failure:** The Council votes "Fraud" immediately after Round 3.
      *   *Fix:* The Verdict Writer's instruction is key here. They must frame the Null Round not as failure, but as "Data regarding environmental interference." If the students still revolt, acknowledge it: "Sidgwick's Council often wanted to vote Fraud, but the President (Sidgwick) urged patience."
  *   **Failure:** The Fragment Round feels like a parlor game.
      *   *Fix:* In the debrief, emphasize the *emotional* weight. "In the 1890s, these fragments were from dead friends. Here, they are paper. That distance is part of the problem."

  ### 3. Candid Limitations (What You Must Supply)
  *You asked for honesty about what this activity cannot reproduce. State these clearly to the class.*

  1.  **The Attrition of Hope:**
      *   *The Gap:* This session lasted 90 minutes. Sidgwick spent **20 years**.
      *   *What to Supply:* Describe the exhaustion. The way a "Null" result in 1885 was bearable, but a "Null" result in 1895 was a crushing weight. The activity simulates the *logic* of the bind, but not the *erosion* of the soul over decades. You must narrate the fatigue.
  2.  **The Friendship Bias:**
      *   *The Gap:* Here, the Medium is a stranger. In Cambridge, the Medium was often a grieving widow, or the "scripts" came from **Frederic Myers**, their beloved friend.
      *   *What to Supply:* Explain that the "Verdict Writer" in reality was writing about *dead colleagues*. To call it fraud was to call their friend a liar or a fool. The "Institutional Stake" was actually a "Social Stake." You must emphasize that skepticism felt like betrayal.
  3.  **The Existential Stakes:**
      *   *The Gap:* For the students, the "Guineas" are fake. For Sidgwick, the "Dualism" meant morality might be a lie.
      *   *What to Supply:* Remind them that if Sidgwick was wrong, then Rational Egoism wins, and Benevolence is irrational. The SPR wasn't about ghosts; it was about whether being good was rational. The activity simulates the *method*, but you must re-insert the *moral desperation*.

  ### Closing Instruction to Class
  "You have felt the mechanism of the trap. Sidgwick built a machine to find God, and the machine worked perfectly, which is why it found nothing. You have enacted the tragedy of the rigorous mind that cannot afford to be skeptical enough to let go, nor believing enough to hold on."
