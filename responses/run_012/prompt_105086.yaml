answer: |-
  ### 1. The Sequence of the Forced Choice

  Do not begin with the definitions of the two theories. Begin with the **semantic obligation** imposed by the possible-worlds framework they already accept. The goal is to show that the dispute is not a choice between two equally viable descriptions of the same reality, but a choice between two repairs for a structural crack in the framework itself.

  **Step 1: The Semantic Commitment (The "Aboutness" Constraint)**
  Start by securing agreement on rigid designation. If "Nixon" is a rigid designator, then the sentence "Nixon could have lost" is true only if there is a possible world where *Nixon* loses.
  *   **Dependency:** This relies on their prior grasp of rigidity.
  *   **The Trap:** Students assume the word "Nixon" does the work of picking out the individual. You must press them on what *in the world* makes it the case that the individual in $w_2$ is the referent of "Nixon."
  *   **The Pivot:** Ask: "What is the truth-maker in $w_2$?"

  **Step 2: The Ontological Commitment (The "Disjointness" Constraint)**
  Force them to specify the relation between the domain of $w_1$ and the domain of $w_2$.
  *   **Dependency:** This depends on Step 1. If we are tracking an individual, we need to know if the individual *travels* or if we are *pointing* across a gap.
  *   **The Force:** If worlds are disjoint sets of individuals (the standard Lewisian constraint to avoid contradiction), strict identity across worlds is logically impossible. If worlds share individuals (Kripkean), we need a principle of individuation to say *which* individual is shared.
  *   **The Unavoidable Question:** "Which individual in the other world is the one we are talking about?" This question only arises because we have committed to worlds being distinct locations (Step 2) while maintaining that our talk is *de re* (Step 1).

  **Step 3: The Crisis of Individuation**
  Present the example (see below). Show that qualitative similarity is insufficient for identity (the Twin problem), but primitive identity (Haecceity) is ontologically costly.
  *   **Dependency:** This depends on Step 2. If worlds overlapped perfectly, individuation would be trivial. Because they are distinct, we need a bridge.
  *   **The Fork:**
      *   **Path A (TWI):** Assert the bridge is primitive identity (Haecceity). *Cost:* Accept non-qualitative facts.
      *   **Path B (CT):** Assert the bridge is a representation relation (Counterpart). *Cost:* Accept that "Nixon" does not denote the individual in $w_2$ strictly speaking.

  **Step 4: The Theoretical Payoff**
  Show how each path resolves the crisis. TWI saves the letter of identity but buys mysterious entities. CT saves the ontology (no haecceities) but revises the logic of identity (non-transitive counterpart relation).
  *   **Why this order works:** It prevents students from viewing CT as a "weird alternative." It frames CT as the *solution* to the problem created by Disjoint Worlds + Nominalism. It frames TWI as the *solution* to the problem created by Disjoint Worlds + Intuition about Identity. The choice is forced by their prior ontological commitments.

  ---

  ### 2. The Example: "The Symmetric Twin"

  Do not use the standard Humphrey case. While Humphrey is the historical standard, it fails your specific constraints: students often memorize the "Humphrey Objection" (irrelevance) without grasping the identity problem, and "winning an election" carries social/external properties that muddy the metaphysical individuation.

  **Proposed Replacement: The Symmetric Twin Case**

  **The Setup:**
  Imagine you have an identical twin, generated from the same zygote split at conception. Up to this morning, you have shared every qualitative property: same height, same memories, same location, same atoms (swapped continuously).
  *   **World $w_1$ (Actual):** You drink coffee. Twin drinks tea.
  *   **World $w_2$:** One of the pair drinks tea. The other drinks coffee.
  *   **The De Re Claim:** "I could have drunk tea." (Students will not dispute this truth).

  **Why this example meets your constraints:**
  1.  **Undisputed De Re Truth:** It is uncontroversial that you could have chosen tea.
  2.  **Genuinely Underdetermined Identity:** In $w_2$, there are two individuals. One drinks tea. Which one is *you*? Qualitative properties cannot distinguish them (ex hypothesi). Spatiotemporal continuity is symmetric until the choice.
  3.  **Distance from Textbook Cases:** It avoids the "Humphrey = Lewis" association and the "Teletransporter = Personal Identity" baggage. It is a metaphysical puzzle, not a sci-fi one.
  4.  **No Independent Essence:** We stipulate for the sake of the argument that there is no "thisness" (haecceity) available to settle the case automatically. If there were, the dispute would vanish.
  5.  **No Lucky Accidents:** Unlike Humphrey (who might lose by a margin), the twins are qualitatively symmetric. There is no "closest" candidate based on similarity; both are equally similar to you.

  **How to deploy it:**
  When you reach Step 3 (The Crisis), ask: "In $w_2$, is the tea-drinker you?"
  *   If they say "Yes, the one on the left," ask: "What fact makes it the one on the left rather than the right?" (Forces Haecceity).
  *   If they say "It doesn't matter, both are me," ask: "Then are there two of you in $w_2$? Does 'I could have drunk tea' mean 'One of my counterparts did'?" (Forces Counterpart Theory).

  ---

  ### 3. Misconceptions and Live Objections

  Address these in the order they will naturally arise during the sequence above. Distinguish between errors in understanding (misconceptions) and legitimate philosophical pushback (live objections).

  **1. Misconception: "Counterpart Theory says I don't exist in other worlds, so I can't do anything."**
  *   **When it forms:** Step 1 (Semantic Commitment).
  *   **Where to head it off:** Immediately after introducing the counterpart relation. Clarify that CT preserves the *truth* of "I could have done X," it just changes the *truth-maker*. The claim is not about *you* in $w_2$, but about *your counterpart* in $w_2$ representing *you*.
  *   **Verdict:** Misconception.

  **2. Misconception: "The counterpart relation is just identity wearing a disguise."**
  *   **When it forms:** Step 3 (The Crisis).
  *   **Where to head it off:** When defining the counterpart relation. Explicitly test for transitivity. If $A$ is counterpart to $B$, and $B$ to $C$, is $A$ counterpart to $C$? (Answer: Not necessarily). Identity is transitive; counterparthood is not.
  *   **Verdict:** Misconception.

  **3. Live Objection: "Counterpart Theory makes de re claims about *someone else*, not me." (The Irrelevance Objection)**
  *   **When it forms:** Step 4 (Theoretical Payoff).
  *   **Where to head it off:** Acknowledge this is the strongest objection (Plantinga/Sider). Do not try to refute it; frame it as the cost of buying CT. The question is whether we care more about ontological parsimony (CT) or semantic directness (TWI).
  *   **Verdict:** Live Objection. Students are entitled to press this.

  **4. Misconception: "Defending Transworld Identity requires an Essence."**
  *   **When it forms:** Step 3 (The Crisis).
  *   **Where to head it off:** When discussing TWI. Distinguish between *Qualitative Essentialism* (you must have certain properties) and *Haecceitism* (you are just *you*). One can hold TWI without essentialism by positing primitive identity.
  *   **Verdict:** Misconception.

  **5. Misconception: "The dispute is a notational variant that makes no difference to what is true."**
  *   **When it forms:** End of session.
  *   **Where to head it off:** In the final summary. Point out that they disagree on the *logic* of identity (Leibniz's Law holds for TWI, fails for CT) and the *ontology* (Haecceities exist vs. do not exist).
  *   **Verdict:** Misconception.

  ---

  ### 4. The Ending: Translation vs. Revision

  Do not conclude with a verdict on which theory is true. Conclude with the meta-philosophical status of the theories.

  **The Sharp Question:**
  "Is Counterpart Theory offered as a **translation** of ordinary modal discourse that preserves its truth-conditions, or as a **revision** of it?"

  **Where it surfaces:**
  Introduce this immediately after Step 4, once the costs of both views are on the table.

  **What students should be able to say:**
  *   **At the start:** They will assume CT is just a fancy way of saying TWI.
  *   **By the end:** They should be able to articulate that if CT is a *translation*, it must explain why "I could have done otherwise" feels like it's about *me* when it's actually about a *counterpart*. If it is a *revision*, they must admit that ordinary modal discourse is strictly false (or imprecise) and CT corrects it.
  *   **Related Question:** "Is the counterpart relation a **primitive** of the theory, or is it **defined from similarity**?"
      *   If defined from similarity, truth becomes context-sensitive (how similar is similar enough?).
      *   If primitive, the theory loses its empirical grip.
      *   Students should recognize that CT pushes the vagueness of modality into the definition of the counterpart relation, whereas TWI pushes it into the notion of essence.

  ---

  ### 5. Final Assessment and Omissions

  **The Final Question to the Room:**
  *"If the counterpart relation is determined by contextual standards of similarity, does the sentence 'I could have raised my hand' express a different proposition in a courtroom (strict identity) than it does in a daydream (loose similarity)? And if so, is that a bug or a feature?"*

  **Why this tests grasp:**
  *   It requires them to connect the metaphysics (CT vs. TWI) to the semantics (Contextualism).
  *   It forces them to confront the cost of CT (truth instability) vs. the cost of TWI (ontological mystery).
  *   It moves beyond "What does Lewis say?" to "What does this theory *do*?"

  **What to Leave Out (Explicitly tell students this):**
  1.  **Formal Semantics:** Do not introduce the quantified modal logic syntax (e.g., $Cxy$, $Ixw$). It obscures the metaphysical intuition at this level.
  2.  **Defense of Modal Realism:** Do not get bogged down in whether worlds are concrete or abstract. Treat "possible worlds" as the given framework; the dispute is about *transworld relations*, not the nature of the worlds themselves.
  3.  **Historical Genealogy:** Do not trace the debate from Carnap to Kripke to Lewis. It distracts from the structural necessity of the choice.
  4.  **The "Humphrey Objection" Detail:** Do not spend time on Lewis's specific reply to the irrelevance objection. It is too granular. Focus on the structural trade-off.
