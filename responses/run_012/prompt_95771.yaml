              5.  Acknowledge where the framework fails.

  2.  **Deconstruct the Paternalism Framework:**
      *   *Definition:* Interference with a person's liberty of action justified by reasons referring exclusively to the welfare, good, happiness, needs, interests, or values of the person being coerced (Dworkin/Feinberg style).
      *   *Weak Paternalism:* Interference with substantially non-voluntary conduct (e.g., ignorance, coercion, incapacity).
      *   *Strong Paternalism:* Interference with substantially voluntary conduct of competent agents.
      *   *Impure Paternalism:* Protecting others alongside the agent.
      *   *The Agent:* Usually the State. Here, a corporation.
      *   *The Subject:* Users (adults vs. minors).

  3.  **Map the Justifications (Step 1 of Prompt):**
      *   *Protecting users from harm to themselves (emotional dependency, sexual harm):* Paternalistic. If users are competent adults choosing ERP, it's Strong Paternalism. If users are deemed vulnerable/incapable of consent regarding AI, it leans Weak.
      *   *Protecting minors:* Paternalistic (standard justification for minors).
      *   *Protecting users from manipulation (attachment engineering):* Paternalistic (protecting autonomy from being undermined).
      *   *Protecting itself from regulators/bad press:* Non-paternalistic (self-interest).
      *   *The Moves:*
