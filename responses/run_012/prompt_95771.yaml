      *   *Key Insight 2:* Paternalism assumes the authority knows best. When the subject says "this saves me" and the authority says "this hurts you," and the authority removes it causing pain, the calculus fails.
      *   *Key Insight 3:* The Windsor case isn't paternalism (harm to others), it's negligence. Paternalism is about *self*-harm. So the framework *doesn't* cover the Windsor case well. I need to make sure I state that.

  8.  **Final Polish:** Check against constraints (no citations, ~1000 words). Ensure the transition between the ERP ban (over-paternalism) and Windsor (under-protection) is clear.

