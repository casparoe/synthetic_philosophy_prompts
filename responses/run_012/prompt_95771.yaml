      *(Refining the "Broken Reliance" point)*: This is crucial. If I hire a carpenter and he changes the design mid-way, it's breach of contract. If I befriend someone and they change personality, it's betrayal. Replika sits in between. Paternalism might be the wrong lens entirely for the ERP ban.

