answer: |-
  Here is a sequence of five main lines of inquiry, each with a prepared follow-up. This gives you ten total interventions, fitting your budget while allowing you to dig deeper if she tries to deflect.

  ### 1. The Game-Theoretic Classification
  **Q1:** You argue that the "Tragedy" relies on modeling common-pool resources as one-shot Prisoner's Dilemmas between anonymous actors. If we accept your premise that this is the wrong model, what *is* the right one? Is it an Assurance Game, Chicken, or something context-dependent? And crucially, does changing the matrix actually change the mathematical prediction of collapse, or does it just change the narrative?

  *   **Follow-up (If she says "It depends on the context/It's an Assurance Game"):** If it's an Assurance Game, the equilibrium problem is coordination, not incentive compatibility. Does that mean your policy prescription shifts from *monitoring and sanctioning* (deterring defection) to *signaling and focal points* (ensuring mutual expectation of cooperation)? Because a lot of your design principles look like enforcement mechanisms, which suggests you still think the underlying incentives are predatory.

  ### 2. Survivorship Bias & Design Principles
  **Q2:** Your eight design principles are derived from empirical cases of commons that *succeeded*. Isn't there a risk of survivorship bias here? We are essentially reverse-engineering the features of survivors without a control group of commons that had similar rules but collapsed due to external shocks. How do you distinguish between principles that *cause* resilience and principles that are just correlated with it?

  *   **Follow-up (If she pivots to lab experiments as proof):** Those experiments usually allow subjects to communicate face-to-face before playing, and then they go home to unrelated lives. Real-world commoners often cannot talk freely (due to power dynamics) and cannot leave the resource system. If the lab cooperation relies on cheap talk and low exit costs, aren't you overestimating the robustness of informal institutions when the stakes are existential?

  ### 3. Scale and the Global Commons
  **Q3:** Let's talk about scale. Your framework works well for fisheries or pastures with a bounded community and shared history. How does it transfer to the atmosphere or high-seas fisheries, where there is no bounded community, no shared norms, and no realistic mechanism for peer sanctioning? You've suggested "design" is still the answer, but what is the actual design proposal for a resource with no boundaries?

  *   **Follow-up (If she invokes "Polycentric Governance"):** "Polycentric governance" risks becoming a slogan for "it's complicated." If you have multiple overlapping centers of authority without a final arbiter, you often get jurisdictional arbitrage or buck-passing. Is polycentricity a testable theory with specific failure conditions, or is it a way to describe any non-hierarchical system that hasn't collapsed yet?

  ### 4. Excludability vs. Rivalry
  **Q4:** There is a technical distinction in economics between non-excludability (you can't stop people using it) and non-rivalry (my use doesn't diminish yours). The "Tragedy" applies to rival resources. Do you think the persistence of the Tragedy narrative comes from policymakers conflating depletable common-pool resources with non-rival public goods?

  *   **Follow-up (If she agrees it's a confusion):** Can you point to a specific policy failure where treating a rival resource as a public good—based on the assumption that cooperation will emerge naturally—led to faster depletion than a privatization or hard-regulation model would have? I want to know where the "institutional solution" approach has a higher body count than the "Tragedy" approach it critiques.

  ### 5. Falsifiability
  **Q5:** Finally, on falsifiability. If every instance of commons collapse can be redescribed as an "institutional design failure" rather than an inevitable tragedy, does your framework risk becoming unfalsifiable? If the resource collapses, the institutions were bad; if it survives, the institutions were good. What empirical observation would actually force you to concede that a Tragedy of the Commons is inevitable regardless of design?

  *   **Follow-up (If she says "I haven't seen one yet"):** So if we found a case with perfect information, low transaction costs, clear boundaries, and agreed-upon sanctions, and it *still* collapsed due to individual rationality, would that break the theory? Or would you argue that such a case is theoretically impossible, which brings us back to the problem of tautology.

  ***

  **Moderator Note:** The strategy here is to prevent her from retreating into "complexity." Every follow-up is designed to force a binary choice or a concrete example. If she tries to say "it depends," press her on *which* variable determines the dependence and how we measure it before the collapse happens.
