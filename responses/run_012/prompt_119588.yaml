answer: |-
  This is a sophisticated historiographical puzzle. You are asking not for a history of the Cold War, but a history of the *debate* about the Cold War, specifically regarding its logical structure and evidentiary limits. Your hypothesis—that the stalemate is driven by conflated categories and hidden normative premises—is strong.

  Here is a diagnosis of the disagreement, testing your four distinctions, assessing the evidentiary ceiling, and proposing where progress might actually lie.

  ### 1. Testing the Four Distinctions
  You propose that **temporal priority**, **causal contribution**, **blameworthiness**, and **avoidability** are doing hidden work and that they "come apart." You are correct. The impasse in your group persists because different camps privilege different distinctions while assuming they are aligned.

  *   **Temporal Priority (Who moved first?):** This is the most fragile distinction. If the "start" is 1917 (Bolshevik Revolution), the USSR is temporally prior. If the "start" is 1946 (Truman's hardening on loans/atom), the US is prior. If the "start" is 1945 (Soviet consolidation in Poland), it is simultaneous.
      *   *The Conflict:* Traditionalists tend to anchor temporality in 1917 or 1945 (Soviet occupation). Revisionists anchor it in 1945–46 (US economic coercion/atomic diplomacy). Because there is no consensus on what constitutes the "Cold War" (ideological hostility vs. geopolitical containment vs. military alliance formation), temporal priority is indeterminate.
  *   **Causal Contribution (Who made conflict likely?):** This is distinct from temporality. A state can move second but contribute more to the escalation (e.g., a disproportionate reaction).
      *   *The Conflict:* Post-Revisionists (like John Lewis Gaddis or Melvyn Leffler) often argue that while Soviet actions were provocative, the *structural* power vacuum of 1945 made conflict likely regardless of intent. Here, causal contribution is assigned to the *system* (bipolarity, security dilemma) rather than an agent. If your third participant is correct (the "process" view), they are arguing that causal contribution is overdetermined by structure, rendering "who started it" a category error.
  *   **Blameworthiness (Who was at fault?):** This is where your normative premise hypothesis is strongest. Blame requires a counterfactual standard of behavior.
      *   *The Conflict:* To blame the US, one must assume the Soviet demand for a buffer zone was legitimate. To blame the USSR, one must assume the US demand for an "Open Door" in Eastern Europe was legitimate. These are not empirical claims; they are normative judgments about sovereignty and spheres of influence. The archive cannot tell you whether Stalin *should* have been allowed a sphere of influence; it can only tell you that he *wanted* one. When your group argues about blame, they are often arguing political philosophy under the guise of history.
  *   **Avoidability (Could it have been averted?):** This is the deepest distinction. If the conflict was structurally determined (Realist view), avoidability is low. If it was driven by specific leaders (Stalin's paranoia, Truman's inexperience), avoidability is high.
      *   *The Conflict:* This is where the "what if" questions live (e.g., "If FDR had lived..."). This distinction is rarely made explicit, but it drives the emotional weight of the debate. If the war was unavoidable, "blame" loses meaning.

  **Diagnosis:** The stalemate is partially verbal. Participants say "Who started it?" but mean "Who is to blame?" or "What was the primary causal mechanism?" Because these distinctions come apart, a consensus on one (e.g., the USSR moved first temporally) does not force a consensus on the others (e.g., the US caused the escalation).

  ### 2. Is the Question Ill-Posed or Merely Hard?
  The question "Who started the Cold War?" is **ill-posed** for historical inquiry, though it remains politically potent.

  *   **Event vs. Process:** History deals well with events (who fired the shot at Sarajevo). It deals poorly with processes (who started the Thirty Years' War?). The Cold War is a process of deteriorating relations, not a discrete event. Assigning a "start" requires an arbitrary periodization that inevitably favors one narrative.
  *   **Interaction vs. Initiation:** Modern diplomatic history increasingly views the early Cold War as an *interaction*. The "Spiral Model" (Robert Jervis) suggests that defensive actions by one side are read as offensive by the other. In a spiral, asking "who started it" is like asking "which clap started the applause."
  *   **The "Start" as Retrospective:** Many actors at the time did not believe a "Cold War" was happening in 1945–46. The label was applied retrospectively (by Lippmann in 1947, solidified later). Asking who started something the participants didn't fully recognize they were doing imposes a coherence on the past that may not exist.

  **However,** the disagreement is not *merely* verbal. There is a substantive core that survives the semantic shift.

  ### 3. The Substantive Core: Ideology vs. Security
  You hypothesized a contested empirical claim: *Was the Soviet system fundamentally expansionist or security-seeking?* This is the genuine substantive disagreement that archives have failed to fully resolve.

  *   **The Evidence:** The opening of Soviet archives in the 1990s (the "Archival Revolution") was expected to settle this. It did not.
      *   *Findings:* Documents show Stalin was cautious, risk-averse, and primarily interested in securing the border (supporting the Security-Seeking view).
      *   *Counter-Findings:* Documents also show Stalin actively supported revolutionary movements in Greece, Iran, and elsewhere, driven by Marxist-Leninist ideology (supporting the Expansionist view).
  *   **The Interpretive Gap:** The evidence underdetermines the theory because ideology and security were fused in the Soviet mind. A "security buffer" *required* ideologically friendly states. Therefore, expanding the buffer looked like ideological expansion to the US, even if Stalin viewed it as defensive.
  *   **The US Side:** Similarly, was US "Open Door" policy economic imperialism (Revisionist) or a belief in collective security and self-determination (Traditionalist)? The documents show both rhetoric and action consistent with both.

  **Verdict:** The impasse is not just about definitions; it is about the **weight assigned to ideology versus structure.**
  *   If you weigh **Ideology** heavily, the USSR bears more responsibility (revolutionary state).
  *   If you weigh **Structure** heavily, responsibility is shared (security dilemma).
  *   If you weigh **Domestic Politics** heavily, responsibility shifts to leaders needing to mobilize publics (Truman needing Congress, Stalin needing legitimacy).

  There is no "decisive evidence" for this because it is a question of *motivation*, and motivation is rarely unitary or fully documented.

  ### 4. The Evidentiary Ceiling: What Would Decisive Evidence Look Like?
  You asked what document could settle the matter. To settle "Who started it?" decisively, you would need evidence that isolates *intent* from *reaction*.

  *   **The Smoking Gun:** A document from early 1945 where Stalin explicitly states, "I will expand beyond security needs to provoke the West," or a document from Truman stating, "I will cut off aid to force Soviet submission despite security risks."
  *   **Why It Doesn't Exist:**
      1.  **Collective Decision Making:** Neither side acted on single decisions. Policy emerged from bureaucratic friction.
      2.  **Strategic Ambiguity:** Leaders rarely write down aggressive intent if they claim defensive posture.
      3.  **The Nature of the Conflict:** Because it was a "Cold" War, actions were incremental. There was no mobilization order.
  *   **The Novikov/Long Telegram Problem:** We *have* documents where both sides articulate a worldview that sees the other as an existential threat (Novikov Telegram, Sept 1946; Long Telegram, Feb 1946). These documents prove mutual hostility, but they do not prove who *created* the conditions for that hostility. They are evidence of the *condition*, not the *cause*.

  **Uncertainty Flag:** It is possible that new archives (e.g., deeper intelligence files, personal diaries yet unreleased) could shift the balance on specific crises (e.g., the Berlin Blockade). But it is highly improbable they will settle the macro-question of "origins," because the origins lie in the incompatibility of two post-war orders, not a single decision.

  ### 5. Pathways to Progress
  If the question is ill-posed and the evidence is capped, how does your reading group proceed? Progress requires changing the question.

  **A. Shift from "Who" to "How"**
  Instead of assigning agency, analyze the mechanism.
  *   *Suggestion:* Read Robert Jervis on the **Security Dilemma**. This reframes the debate from "Who was aggressive?" to "Why did defensive measures look aggressive?" This validates the "process" view of your third participant without absolving specific actors.

  **B. Shift from "Start" to "Escalation"**
  Accept that tension was inevitable post-1945, but the *degree* of hostility was not.
  *   *Suggestion:* Focus on specific turning points (Iran 1946, Turkey/Greece 1947, Czechoslovakia 1948). Ask: "At which point did diplomatic friction become irreconcilable conflict?" This moves the debate from metaphysics to specific diplomatic history where evidence is richer.

  **C. Make the Normative Premises Explicit**
  Force the group to articulate their criteria for "blame."
  *   *Exercise:* Ask the Traditionalist: "If the USSR had demanded a sphere of influence but remained democratic, would the US have contested it?" Ask the Revisionist: "If the US had accepted Soviet hegemony in Poland, would the Cold War have been avoided, or just postponed?"
  *   *Goal:* Reveal that the disagreement is often about the **legitimacy of spheres of influence** in the 20th century. This is a political theory debate, not a historical one. Acknowledging this dissolves the pretense of a purely empirical resolution.

  **D. The "Post-Post-Revisionist" Synthesis**
  Specialists like Vladislav Zubok (*A Failed Empire*) and Odd Arne Westad (*The Global Cold War*) have moved beyond the "Who started it" binary.
  *   *Consensus Point:* There is a growing consensus that Stalin was not planning a global war in 1945–46 (he was risk-averse), but his ideological rigidity made compromise impossible.
  *   *Consensus Point:* There is a growing consensus that the US overreacted to Soviet actions due to domestic political pressures and a misunderstanding of Soviet intent (the "Riga Axioms").
  *   *Progress:* Agreement that the conflict was **mutually constitutive**. The US defined itself against the USSR, and the USSR defined itself against the US.

  ### Summary Diagnosis
  Your hypothesis is correct. The stalemate is driven by:
  1.  **Conflated Distinctions:** Temporal priority, causality, and blame are treated as one thing when they are three.
  2.  **Hidden Normativity:** Disagreements about "responsibility" are often disagreements about the legitimacy of spheres of influence.
  3.  **Underdetermined Evidence:** The archives show both security-seeking and expansionist behavior, allowing both camps to cherry-pick.

  **Is the question ill-posed?** Yes. It assumes a discrete origin for a structural process.
  **Is the disagreement substantive?** Yes, regarding the weight of ideology vs. structure.
  **What counts as progress?** Abandoning the search for a "starter" and analyzing the **interaction dynamics** that made de-escalation impossible.

  **Recommendation for the Group:**
  Stop asking "Who started it?" Start asking: *"At what point did the security dilemma become irreversible, and what specific decisions locked that in?"* This honors the archival record (which shows specific decisions) without demanding a verdict on a metaphysical question (which the record cannot support). It shifts the group from judges of guilt to analysts of process.
