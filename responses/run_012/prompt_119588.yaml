      *   *Check:* Did I address the "evidence" question thoroughly? *Need to be specific about what a "decisive document" would look like and why it's improbable.*
      *   *Check:* Am I flagging uncertainty? *Ensure I use phrases like "Historians debate," "Evidence suggests but does not prove," "Interpretations vary."*
      *   *Check:* Did I address the normative premise? *Yes, the sphere of influence issue is central.*

  7.  **Final Polish:** Organize with clear headings. Ensure the conclusion offers a concrete path forward for the reading group. (e.g., Change the reading list to focus on interaction rather than intent).

  *(Self-Correction Note)*: I need to be careful not to simply summarize the Traditionalist/Revisionist/Post-Revisionist schools. The user knows them. I need to analyze the *logic* of the debate between them. The user's hypothesis is that the debate is driven by hidden commitments. I need to test *that*.

  *Plan:*
  1. Validate the four distinctions (they do come apart).
  2. Analyze the "Start" problem (Event vs. Process).
  3. Analyze the Empirical/Normative split (Ideology vs. Security).
  4. Address the Evidence problem (The limits of archives).
  5. Propose the path to progress (Reframing).

