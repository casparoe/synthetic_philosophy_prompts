answer: |-
  This is a sharp question that cuts to the heart of modern decision theory. The claim that Counterfactual Mugging (CM) and XOR Blackmail (XOR) "pull in opposite directions" refers to how they stress-test the relationship between **causation**, **evidence**, and **logical control**.

  Here is the conceptual map.

  ### 1. Counterfactual Mugging (CM)

  **The Setup:**
  Omega flips a fair coin.
  *   **Heads:** Omega gives you \$10,000 *if* it predicted you would give it \$100 if the coin came up Tails.
  *   **Tails:** Omega asks you for \$100. (You know the coin came up Tails).
  *   **The Trap:** You are in the Tails branch. You know you won't get the \$10,000 (that was the Heads branch). Do you pay the \$100?

  **The Verdicts:**
  *   **Causal Decision Theory (CDT):** **Don't Pay.**
      *   *Reasoning:* The coin flip is in the past. Your action now cannot causally influence the coin or the Heads branch. Paying costs \$100 with no causal return.
  *   **Evidential Decision Theory (EDT):** **Don't Pay.**
      *   *Reasoning:* EDT conditions on known evidence. You know the coin is Tails. Your action provides no new evidence about the coin flip (it's already fixed). Paying is just a loss. (Note: Some EDT variants struggle here, but standard EDT treats the state as fixed once observed).
  *   **Functional/Updateless Decision Theory (FDT/UDT):** **Pay.**
      *   *Reasoning:* You do not choose an *action*; you choose a *policy* (a mapping from situations to actions). The policy "Pay if Tails" yields an ex-ante expected value of \$5,000 - \$50 = \$4,950. The policy "Don't Pay" yields \$0. Omega predicted your policy, not your specific action in this branch. By paying, you logically determine the outcome in the counterfactual Heads branch.

  **Core Challenge:** How to care about branches of reality you know you are not in. It requires treating your decision algorithm as a logical fact that constrains counterfactual worlds.

  ---

  ### 2. XOR Blackmail (XOR)

  **The Setup:**
  There may be termites in your house (50% chance). Cost of termites: \$1,000.
  Omega sends you a letter demanding \$100.
  *   **The Rule:** Omega sends the letter *if and only if* (Termites are present **XOR** You Pay).
  *   **The Situation:** You receive the letter. Do you pay?

  **The Logic:**
  Receiving the letter tells you: `(Termites ⊕ Pay) = True`.
  *   If you Pay, Termites must be False (No Termites).
  *   If you Don't Pay, Termites must be True (Termites).

  **The Verdicts:**
  *   **Evidential Decision Theory (EDT):** **Pay.**
      *   *Reasoning:* Conditional on receiving the letter, Paying is perfect evidence that there are No Termites.
      *   *Calculation:* Pay (-\$100) + No Termites (\$0) = -\$100. Don't Pay (\$0) + Termites (-\$1,000) = -\$1,000. EDT pays to "buy" the evidence of safety.
  *   **Causal Decision Theory (CDT):** **Don't Pay.**
      *   *Reasoning:* Your payment cannot causally remove termites that are already there (or not). The letter is already sent. Paying just loses \$100.
  *   **Functional/Updateless Decision Theory (FDT/UDT):** **Don't Pay.**
      *   *Reasoning:* Evaluate the *policy* ex-ante (before knowing if the letter arrives).
      *   *Policy "Pay if Letter":* Omega sends letter iff (Termites ⊕ True) $\rightarrow$ Letter iff No Termites.
          *   No Termites (50%): Letter sent. You Pay (-\$100).
          *   Termites (50%): No Letter. You suffer Termites (-\$1,000).
          *   *Exp Cost:* \$550.
      *   *Policy "Don't Pay if Letter":* Omega sends letter iff (Termites ⊕ False) $\rightarrow$ Letter iff Termites.
          *   No Termites (50%): No Letter. Cost \$0.
          *   Termites (50%): Letter sent. You Don't Pay. Suffer Termites (-\$1,000).
          *   *Exp Cost:* \$500.
      *   *Conclusion:* The "Don't Pay" policy is cheaper. Paying effectively taxes the "No Termite" world without helping the "Termite" world.

  **Core Challenge:** Distinguishing between *logical control* (your policy determining the predictor's behavior) and *spurious correlation* (your action being correlated with the state only because you conditioned on the letter).

  ---

  ### 3. Comparison: Mirror Images or Superficial Symmetry?

  The claim that they pull in opposite directions is accurate regarding **EDT**, but the structural symmetry is deeper than it appears.

  | Feature | Counterfactual Mugging | XOR Blackmail |
  | :--- | :--- | :--- |
  | **EDT Verdict** | Don't Pay (Fails) | Pay (Fails) |
  | **CDT Verdict** | Don't Pay (Fails) | Don't Pay (Succeeds*) |
  | **FDT Verdict** | **Pay** (Succeeds) | **Don't Pay** (Succeeds) |
  | **Leverage Point** | Counterfactual Branch (Heads) | Counterfactual Branch (~Termites) |
  | **Effect of Paying** | Unlocks reward in Other Branch | Taxes reward in Other Branch |

  *\*CDT succeeds in XOR by accident (ignoring the predictor entirely), but fails to explain why the predictor's letter is irrelevant.*

  #### Is the "Counterfactual vs. Actual" Distinction Principled?
  You asked if the fact that CM involves a counterfactual branch (coin didn't happen) while XOR involves an actual fact (termites exist) makes a difference.

  **Answer:** It is a framing trick, but a revealing one.
  From the perspective of **Updateless Decision Theory**, there is no fundamental difference. Both problems are solved by maximizing expected utility *ex-ante* (before the coin flip or before the termite state is known).

  *   **In CM:** You are in the Tails branch. Paying sacrifices utility *here* to create utility in the Heads branch.
  *   **In XOR:** You are in the Letter branch. Paying sacrifices utility *here* to... what?
      *   EDT thinks paying changes the Termite state *here*.
      *   FDT sees that the policy "Pay" causes the Letter to appear in the **No-Termite branch**.
      *   In the No-Termite branch (the "Good" world), the "Pay" policy forces you to pay \$100. The "Don't Pay" policy lets you keep \$0.
      *   In the Termite branch (the "Bad" world), both policies result in -\$1,000 (either via termites or termites + no letter).

  **The Symmetry Break:**
  *   **CM:** Paying helps the **Good Counterfactual** (Heads).
  *   **XOR:** Paying hurts the **Good Counterfactual** (No Termites).

  In CM, the "Good World" is the one where you *don't* have to pay (Heads), but you only get the money if you *would* have paid in the Bad World.
  In XOR, the "Good World" is the one where you *don't* have termites (~T). If you adopt the "Pay" policy, Omega ensures you *do* have to pay in that Good World. If you adopt "Don't Pay," Omega leaves you alone in that Good World.

  So, the "Counterfactual vs. Actual" distinction is superficial. The real distinction is **Direction of Value Flow**.
  *   CM: Payment flows from Bad World $\rightarrow$ Good World. (Worth it).
  *   XOR: Payment flows from Good World $\rightarrow$ Bad World (effectively). You pay in the ~T world to satisfy the XOR, gaining nothing in the T world. (Not worth it).

  #### The Role of Predictor Honesty and XOR Structure
  *   **Honesty:** In both cases, if Omega is a liar, the logical link dissolves. FDT relies on the predictor being a logical mirror of your algorithm.
  *   **XOR Structure:** This is the critical engine. The XOR creates a **conditional correlation** that is perfect *given the observation*.
      *   $P(\text{No Termites} | \text{Letter} \land \text{Pay}) = 1$.
      *   This is catnip for EDT. It looks like your action controls the termites.
      *   FDT recognizes that this correlation is screened off by the **policy**. The policy determines *whether the letter is sent* in the No-Termite world, not whether the termites exist.

  ---

  ### 4. Conceptual Map: Does Solving One Solve the Other?

  **Does solving CM automatically solve XOR?**
  **No.**
  If you patch CDT to "pay in CM" (to capture logical correlations), you risk "paying in XOR" (falling for the blackmail).
  If you patch EDT to "not pay in XOR" (to avoid spurious correlations), you risk "not paying in CM" (missing the logical benefit).

  A heuristic fix to one problem breaks the other. This is why simple patches to CDT or EDT fail.

  **What Extra Machinery Do You Need?**
  You need **Updatelessness** combined with **Logical Counterfactuals**.

  1.  **Updatelessness:** You must evaluate decisions from a perspective *before* you receive specific information (the coin result, the letter). You choose a **policy** $\pi$, not an action $a$.
      *   In CM: Choose $\pi$ before the coin flip.
      *   In XOR: Choose $\pi$ before the letter arrives.
  2.  **Logical Counterfactuals:** You must treat your decision algorithm as a mathematical object.
      *   "If my algorithm outputs 'Pay', what does Omega's algorithm output?"
      *   This allows you to see the link in CM (Omega pays you in Heads) and the link in XOR (Omega sends letter in ~Termites).
  3.  **Screening Off Evidence:** You must recognize that once you fix the policy, the *observation* (Letter) is no longer evidence of the state (Termites) in a way that is actionable.
      *   In XOR, once you fix policy "Don't Pay", receiving the letter implies Termites are present. But you can't change that. You can only have chosen a different policy earlier to avoid receiving the letter in the ~T world.

  ### Summary
  *   **CM** punishes theories that ignore logical links across counterfactuals (CDT/EDT).
  *   **XOR** punishes theories that confuse conditional evidence with logical control (EDT).
  *   **FDT/UDT** solves both by shifting the locus of agency from **actions in a world** to **policies across logical space**.
  *   The "Counterfactual vs. Actual" difference is a framing device to hide the fact that in both cases, you are optimizing the **ex-ante expected utility of your algorithm**. In CM, the algorithm's output creates value in the other branch. In XOR, the algorithm's output avoids a tax in the other branch.

  The core insight is that **you are not a point in spacetime making a choice; you are a function evaluating its own output.** Once you view yourself as a function, CM and XOR are simply two different equations where that function appears as a variable.
