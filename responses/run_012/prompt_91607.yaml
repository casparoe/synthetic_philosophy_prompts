answer: |-
  This is a sharp set of questions. You have correctly identified that Program Equilibrium (PE) feels like it's cheating the standard rules of game theory, and you want to know *where* the leverage comes from.

  Here is the breakdown of the conceptual machinery, separating the mathematical settledness from the philosophical and practical disputes.

  ### 1. What is actually doing the work?
  In standard Game Theory (Nash Equilibrium), your move and my move are treated as **independent variables**. When I calculate my best response, I treat your move as a fixed parameter that I cannot influence. I assume that whatever I choose, you would have chosen the same thing anyway.

  Program Equilibrium changes the variable type. Your move and my move are no longer independent variables; they are **outputs of functions that take each other as input**.

  The "work" is being done by **Logical Correlation**, not Causal Influence.
  *   **Causal Influence:** I push a domino, it falls. (Standard game theory assumes no causal link between simultaneous moves).
  *   **Logical Correlation:** We both run the same algorithm on the same input. Even if I don't touch your computer, the mathematical truth of my output is linked to the mathematical truth of your output.

  When you submit a program $P$ that says `if opponent == P then Cooperate else Defect`, you are not threatening the opponent. You are creating a logical fact: *In any world where the opponent is identical to me, the outcome is (C, C).*

  The equilibrium holds because deviating from this program breaks the logical correlation. If I switch to `Always Defect`, I am no longer identical to you. Therefore, your program (which checks for identity) defects against me. I gain the temptation payoff once, but against any copy of myself (or similar cooperative bots), I get the sucker's payoff.

  **The Moving Part:** The leverage comes from making your strategy **conditional on the opponent's strategy** in a way that is verifiable and binding. In standard PD, "I will cooperate if you cooperate" is cheap talk (non-binding). In PE, the code *is* the binding contract.

  ### 2. Is the commitment real or an artifact?
  **Settled:** Within the axioms of the model, the commitment is **real**.
  It is not an artifact of determinism; it is a feature of **transparency + binding execution**.

  In standard economics, a "commitment device" (like burning your bridges) is an external action you take to restrict your future moves. In PE, the submission of the source code *is* the commitment device. Because the environment guarantees the code runs as written, you literally *cannot* defect if your code says cooperate.

  **Contested:** Whether this models reality.
  Critics argue this is an artifact of **idealized transparency**. In the real world (even with AI), you rarely have access to the opponent's raw source code. You might have a binary, an API, or a black box. If you cannot verify the source code, you cannot verify the commitment. If you cannot verify it, the logical correlation breaks, and you revert to standard Nash Equilibrium (Defect).

  ### 3. Is this Repeated-Game logic in disguise?
  **Settled:** **No.** This is a common misconception.
  *   **Repeated Games:** Rely on the "Shadow of the Future." I cooperate now because I fear you will punish me *later*. The timeline is $T_1, T_2, T_3...$
  *   **Program Equilibrium:** Relies on the "Shadow of the Counterfactual." I cooperate now because our decisions are *logically linked* in this single instant. There is no $T_2$.

  If you run a PE tournament with one-shot matches where players are never met again, cooperation still emerges among `FairBot` variants. The mechanism is **acausal trade** (a term from decision theory), not reputation. You are cooperating with a "logical twin," not a future partner.

  ### 4. Why can't humans do this by reasoning about character?
  Humans attempt this constantly ("I know he's a good guy, so I'll trust him"). It fails to reach equilibrium for three engineering reasons:

  1.  **Obfuscation:** You cannot read human source code. You infer it via signals (speech, past behavior). Signals are noisy and can be faked. A human can *say* "I am a cooperator" while running "Defect" internally. A program cannot lie about its source code if the code is publicly visible.
  2.  **Execution Error:** Even if I know your character, I cannot guarantee my own future action with 100% fidelity. I might intend to cooperate and then flake. In PE, `if condition: cooperate` executes with probability 1.
  3.  **Simulation Cost:** To reason about your character, I run a mental simulation of you. You are doing the same. This leads to the infinite recursion problem ($I$ think that $You$ think that $I$ think...). Humans cut this chain off arbitrarily ("I think he's nice"). Programs can handle specific forms of this recursion (see below).

  ### 5. Simulation vs. Proof (The two versions you encountered)
  You noticed two variants: one that simulates the opponent, and one that proves things about the opponent. These are **not** the same idea. This is a crucial technical distinction.

  **Variant A: Simulation (Tennenholtz, 2004)**
  *   **Mechanism:** My program tries to `run()` your program with me as input.
  *   **The Bug:** If we both submit copies of the same program, we enter infinite recursion. $A$ runs $B$, $B$ runs $A$... Stack overflow.
  *   **The Fix:** You need a "quining" trick or a timeout. If timeout, defect.
  *   **Status:** This is fragile. It depends on the specific execution environment.

  **Variant B: Proof-Based / Modal Combat (Barasz, Christiano, et al., ~2013)**
  *   **Mechanism:** My program does *not* run yours. It searches for a **mathematical proof** that "If I cooperate, you cooperate."
  *   **The Trick:** This uses Gödelian logic (Löb's Theorem). I can prove that *if* it is provable that we cooperate, *then* we cooperate.
  *   **Why it's subtler:** It avoids the infinite recursion of simulation. We don't execute each other; we reason about the *truth conditions* of each other's output.
  *   **Status:** This is mathematically robust within formal logic systems (like Peano Arithmetic), but requires the agents to share the same logical axioms.

  ### 6. Breaking the Idealizations
  You asked what happens when you break the assumptions. This is where the theory meets engineering constraints.

  **A. Capped Running Time (Bounded Rationality)**
  *   **Effect:** Destroys Simulation-based PE. If I have a time limit, I cannot simulate you fully. If I timeout, I must default to Defect (safety). If we both default to Defect on timeout, cooperation collapses.
  *   **Proof-Based:** More resilient, but proof search is also computationally expensive. If the proof requires more steps than my compute allows, I defect.
  *   **Result:** Cooperation becomes a function of **compute parity**. If I am much faster than you, I can simulate/prove you, but you can't simulate/prove me.

  **B. One-Way Readability (Asymmetry)**
  *   **Setup:** I can read your code; you see only my binary/output.
  *   **Effect:** I can exploit you. I can write a program that reads your code, identifies if you are a cooperator, and defects against you. You cannot condition your move on me because you can't read me.
  *   **Result:** Mutual cooperation requires **Mutual Transparency**. If transparency is asymmetric, the equilibrium shifts to the advantage of the reader. This suggests that in a PE world, agents would fight to keep their source code private unless they can enforce a mutual disclosure treaty.

  ### 7. Summary: Settled vs. Contested

  | Claim | Status | Explanation |
  | :--- | :--- | :--- |
  | **Cooperation is a Nash Equilibrium in the PE model.** | **Settled** | Mathematically proven. If agents can read code and bind themselves to it, (C,C) is stable. |
  | **This solves the Prisoner's Dilemma for humans.** | **Contested / False** | Humans lack source code transparency and binding execution. |
  | **This will solve the Prisoner's Dilemma for AI.** | **Highly Contested** | Depends on whether future AIs will be open-source, verifiable, and share logical axioms. Security/Obfuscation may prevail. |
  | **Proof-based is superior to Simulation-based.** | **Settled (Technical)** | Proof-based avoids halting problems and infinite recursion inherent in direct simulation. |
  | **PE is just Repeated Game theory.** | **Settled (False)** | PE works in strictly one-shot settings via logical correlation, not temporal iteration. |

  ### The Conceptual Takeaway
  Program Equilibrium does not "solve" the Prisoner's Dilemma in the sense of finding a magic moral principle. It **dissolves** the problem by changing the definition of a "move."

  In standard theory, a move is an **action** (Cooperate/Defect).
  In Program Equilibrium, a move is a **function** (A mapping from Opponent-Code to Action).

  By expanding the move space to include functions that can inspect each other, you allow for **conditional commitments** that are impossible in the standard model. The "work" is done by the fact that **code is law** in this universe. If you remove the ability to verify the code (privacy) or the ability to enforce the code (bounded compute/unreliable hardware), the equilibrium collapses back to standard Defection.

  For a software engineer, the intuition is this: PE works because it turns the game from a **network call** (where packets can be spoofed) into a **local function call** (where you can inspect the source before linking). If you can't inspect the source, you can't trust the link.
