  ### The Principle of Historical-Expressive Activation

  To account for all eight verdicts without abandoning any, we must reject the idea that slur derogation is purely truth-conditional, purely pragmatic, or purely semantic. Instead, we require a hybrid principle that ties the word's force to its history, its grammatical deployment, and the speaker's social position.

  **The Principle:**
  > A term $S$ derogates a group $G$ in an utterance $U$ if and only if:
  > 1.  **Etiology:** $S$ carries a historical convention of subordinating $G$ (distinguishing slurs from neutral or dominant-group terms).
  > 2.  **Activation:** $S$ is *used* semantically to pick out $G$, rather than *mentioned* metalinguistically as an object (distinguishing use from quotation).
  > 3.  **Projection:** If *used*, the expressive content of $S$ projects through logical operators (like negation) but does not require speaker endorsement of the literal content.
  > 4.  **Identity:** The derogatory force is neutralized only if the speaker is a member of $G$ engaging in appropriation (reclamation); otherwise, the historical force remains active regardless of benevolent intent.

  ### Squaring the Conflict: (2) vs. (6)

  You identified cases (2) (Reporter Quoting) and (6) (Negation) as the difficult pair. Both are non-endorsing, yet you judge (2) as non-derogatory and (6) as derogatory. The Principle resolves this via the **Activation** and **Projection** clauses.

  *   **Case (2):** The reporter *mentions* the word $S$; they do not *use* it to refer to $G$. The word is treated as an object (like a sound or a string of text). Because the semantic machinery of $S$ is not engaged to pick out a referent, the historical expressive content is not **Activated**. Thus, no derogation occurs.
  *   **Case (6):** The speaker *uses* $S$ to refer to $G$, even though they deny the predicate ("No $G$ is an $S$"). Because $S$ is used semantically, the historical expressive content is **Activated**. Per the **Projection** clause, expressive content (unlike truth-conditional content) survives negation. The sentence denies the *property* but retains the *contempt*. Thus, derogation occurs.

  This distinction preserves your intuition that quotation inoculates the speaker, while negation does not.

  ### Verdict Preservation

  This single principle yields all eight verdicts without forcing you to abandon any:

  *   **(1) Hostile non-$G$:** Meets Etiology, Activation, Identity. **Derogatory.**
  *   **(2) Reporter:** Fails Activation (Mention). **Not Derogatory.**
  *   **(3) In-group reclaimed:** Meets Etiology, Activation, but fails Identity (Neutralized by appropriation). **Not Derogatory.**
  *   **(4) Out-group reclaimed:** Meets Etiology, Activation, Identity (Non-$G$). **Derogatory.**
  *   **(5) Mocking bigots:** Meets Etiology, Activation, Identity. Intent is irrelevant to Activation. **Derogatory.**
  *   **(6) Negation:** Meets Etiology, Activation, Projection, Identity. **Derogatory.**
  *   **(7) Dominant group term:** Fails Etiology (No history of subordination). **Not a Slur.**
  *   **(8) New coinage:** Fails Etiology (No history). **Not a Slur.**

  **Do you need to abandon a verdict?**
  **None.** Provided you accept a hybrid principle that incorporates etiology, use/mention, and identity, all eight verdicts are consistent. However, if you were forced to adopt a *traditional, single-mechanism* theory (e.g., "It is *only* Conventional Implicature" or "It is *only* Speaker Intent"), you would have to abandon **(3)** (Reclamation). Standard Conventional Implicature is speaker-independent and cannot be "turned off" by group identity; standard Intent theories cannot explain why (5) and (6) remain derogatory despite benign or denying intent. The Hybrid Principle is required to save (3).

  ### Predictions for New Cases

  **Case A: A hostile $G$ speaker insulting another $G$ person with $S$.**
  *   **Prediction:** **Derogatory.**
  *   **Reasoning:** While the **Identity** clause allows $G$ speakers to neutralize the slur via *reclamation* (solidarity), it does not grant immunity for *hostile* use. Reclamation works by repurposing the term to signal in-group bond. A hostile $G$ speaker is not signaling solidarity; they are weaponizing the historical subordination encoded in the term against a peer. This reactivates the **Etiology** without the protective cover of appropriation. The harm is internalized oppression, but it remains derogatory.

  **Case B: $S$ appearing as an example sentence in a language textbook.**
  *   **Prediction:** **Not Derogatory.**
  *   **Reasoning:** This falls under the **Activation** clause as *Mention*. A textbook example ("The [S] walked home") is metalinguistic or pedagogical; it uses the word to demonstrate grammar or vocabulary, not to refer to $G$ with expressive intent. Like the reporter in (2), the author is not activating the historical expressive content to subordinate $G$. (Note: While not derogatory in principle, such usage may still be deemed inappropriate due to the risk of misuse, but linguistically, it does not constitute a slur act).
