      *   *Refinement:* To make it fit 90 mins with 12 people, we need parallelism.
      *   *Revised Structure:* Split into 3 groups of 4.
          *   Group A: Goal-Directed Agents.
          *   Group B: Approval-Directed Agents.
          *   Group C: The Principals (Approvers/Donors) + Observers.
          *   Actually, better to run sequentially so everyone sees both.
          *   *Best Flow:* 2 Teams of 5 (Agents). 1 Facilitator (Donor). 2 Observers.
          *   Wait, 12 people. Let's do 2 Teams of 4 (Agents). 1 Person is the "Human" (Approver). 1 Person is the "Referee/Scorekeeper". 2 Observers.
          *   Actually, for maximum engagement, split into two competing agent teams. One plays Round 1, one plays Round 2? No, they need to experience the *contrast*.
          *   *Decision:* Two Teams (Alpha & Beta). Both play both rounds, but with different constraints.
          *   *Wait, simpler:* Round 1: Team Alpha is Goal-Directed. Team Beta observes. Round 2: Team Beta is Approval-Directed. Team Alpha observes.
          *   *Actually, to save time:* Run Round 1 with Team Alpha. Run Round 2 with Team Beta. Then discuss.
          *   *Correction:* To really feel the difference, both teams should face the *same* underlying task but different *incentive structures*.
          *   *Let's try:* Team 1 (Goal) vs Team 2 (Approval). Both compete for the same pot of points from the "Human."
          *   *Round 1:* Team 1 plays against a Fixed Metric. Team 2 sits out.
          *   *Round 2:* Team 2 plays against the Human. Team 1 sits out.
          *   *Problem:* This takes too long.
          *   *Solution:* Run the rounds in parallel or quick succession.
          *   *Better:* 12 People. 3 Groups of 4.
              *   Group 1: Goal Agents.
              *   Group 2: Approval Agents.
