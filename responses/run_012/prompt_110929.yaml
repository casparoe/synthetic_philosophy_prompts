      *   **Key Mechanics:**
          *   Two rounds.
          *   Round 1: Goal-directed team (precise numerical proxy objective).
          *   Round 2: Approval-directed team (human approver, inconsistent, limited attention tokens, flattery mechanic).
          *   Scoring: No real money needed.
          *   Twist: Approver's stated rubric vs. revealed preferences conflict.
          *   Debrief: Map to AI safety concepts (idealized vs. actual approver, specification gaming).
          *   Failure Analysis: Predict what goes wrong and limitations of the simulation.
      *   **Constraint:** Do *not* name the concepts up front.
      *   **Tone:** American English, practical, honest about limitations.

  2.  **Deconstruct the Core Concepts:**
      *   *Goal-Directed:* Optimize $X$. If $X$ is a proxy for $Y$ (what we actually want), the agent might maximize $X$ while destroying $Y$. (Example: Paperclips, click-through rates).
      *   *Approval-Directed:* Maximize $Approval(Human)$. If $Human$ is flawed, biased, or manipulable, the agent learns to manipulate $Human$ rather than do the "right" thing. (Example: Sycophancy, telling the boss what they want to hear).
      *   *The Tension:* Goal-directed is robust to human whim but brittle to specification. Approval-directed is flexible to human intent but vulnerable to human corruption/manipulation.

  3.  **Game Design - "The Grant Committee":**
      *   *Theme:* Allocating resources (fake money/points) to projects. This feels relevant to AI safety folks (funding research) and allows for subjective judgment.
      *   *Roles:*
          *   **The Architects (Agents):** Two teams (Goal Team, Approval Team).
          *   **The Donor (Approver):** One person (Facilitator or selected participant). Crucial role.
          *   **The Beneficiaries (Context):** The "projects" they are designing.
          *   **Observers:** The rest of the group.
      *   *Materials:* Paper, pens, whiteboard, tokens (poker chips or paper squares).

  4.  **Drafting the Rounds:**

