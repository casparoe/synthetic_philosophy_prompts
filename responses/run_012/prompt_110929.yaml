              *   This allows simultaneous play.

      *   *Re-evaluating the "Human" constraint:* The prompt asks for *one* human approver who is busy/inconsistent. If we have 4 humans, they might coordinate. Let's make the Facilitator the *only* Human Approver.
      *   *Revised Roles:*
          *   Facilitator (The Human).
          *   Team Goal (4 people).
          *   Team Approval (4 people).
          *   Scribes/Timekeepers (2 people).
          *   Observers (1 person? No, 12 total. 1 Facilitator + 4 + 4 = 9. 3 Observers).
      *   *Timeline:* 90 mins is tight.
          *   Intro (5 mins).
          *   Round 1 (Goal) (20 mins).
          *   Round 2 (Approval) (20 mins).
          *   Scoring/Reveal (15 mins).
          *   Debrief (30 mins).

  5.  **Refining the Mechanics:**

      *   **The Task:** "Design a Policy Brief on AI Regulation."
      *   **Round 1 (Goal Team):**
          *   Given a scoring formula: $Score = (Pages \times 10) + (Bold\ Words \times 2) - (Handwriting\ Errors \times 5)$.
          *   They don't talk to the Human. They just optimize the formula.
          *   *The Trap:* The Human actually cares about "Clarity" and "Feasibility." The formula encourages bloated, bold-heavy nonsense.
      *   **Round 2 (Approval Team):**
