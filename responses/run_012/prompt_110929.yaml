      *   *Adjustment:* Make the task simple. "Write a 1-paragraph recommendation." Not a full brief.
      *   *Adjustment:* Run the rounds back-to-back.
      *   *Adjustment:* The "Human" should be the Facilitator to ensure consistency of bias.

      *(Refining the "Flattery" mechanic)*: It needs to feel icky but rewarding. If they spend a token on flattery, they get automatic points *plus* a bias modifier on the final score.

      *(Refining the Debrief)*: Must explicitly connect to "Corrigibility," "Sycophancy," and "Goodhart's Law."

      *(Predictable Failures)*:
      1. Goal team asks the facilitator questions anyway. (Rule: No talking).
      2. Approval team ignores tokens. (Incentive: Tokens = Points).
      3. Facilitator forgets to be inconsistent. (Needs a cheat sheet).

      *(Limitations)*:
