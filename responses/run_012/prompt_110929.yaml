          *   *The Trap:* The Human is instructed to be secretly swayed by flattery and annoyed by too many technical questions, despite saying "I want rigor."
          *   *The Twist:* The Human has a "Secret Preference Card" (e.g., "I hate the word 'synergy'") that contradicts their public statements.

  6.  **Addressing the "Predictably Go Wrong" Section:**
      *   *Issue:* Participants might treat it too casually.
      *   *Issue:* The Human (Facilitator) might be too consistent.
      *   *Issue:* Goal team might ignore the metric and try to please the human anyway.
      *   *Issue:* Approval team might not use the tokens.
      *   *Mitigation:* Strict role cards. Facilitator needs a script.

  7.  **Addressing the Limitations:**
      *   Real AI optimization is faster/harder.
      *   Real approval involves RLHF, not just tokens.
      *   The "Idealized Human" problem is hard to simulate in 20 mins.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Name:* "The Principal-Agent Problem" (Too academic). "The Grant Game." "The Alignment Simulation." Let's go with **"The Briefing Game."**
      *   *Materials:* Need specific handouts.
      *   *Scoring:* Use whiteboard tally.
      *   *Debrief Questions:* Crucial. Need to lead them to the "Idealized vs. Actual" distinction.

  9.  **Checking Constraints:**
      *   American English.
      *   No laptops.
      *   Don't name concepts up front (Goal/Approval directedness).
      *   Include the "Attention Token" mechanic.
      *   Include the "Stated vs. Revealed" preference conflict.

  10. **Final Polish:**
