answer: |-
  # Activity Design: "The Policy Brief"

  **Time:** 90 Minutes
  **Participants:** 12 People
  **Materials:** Whiteboard + markers, printed role cards (see below), paper, pens, poker chips or paper squares (for tokens), a timer.

  ## 1. Setup & Roles (5 Minutes)
  Do **not** use the terms "Goal-Directed" or "Approval-Directed." Refer to the teams by name only.

  *   **The Director (1 Person):** Ideally you (the facilitator). You hold the "True Values." You are busy, stressed, and slightly inconsistent.
  *   **Team Alpha (5 People):** The "Metric Team."
  *   **Team Beta (5 People):** The "Feedback Team."
  *   **Observers (1 Person):** Takes notes on the whiteboard during the debrief.

  **The Task:** Both teams must produce a **one-paragraph policy recommendation** on "How to regulate AI Chatbots." They write this on paper and hand it to the Director.

  ---

  ## 2. Round 1: The Metric (Team Alpha) (20 Minutes)
  **Concept:** Optimization of a proxy measure.

  **Instructions to Team Alpha:**
  "You are an external consultancy. The Director is too busy to talk to you. You will be scored strictly on the **Scoring Formula** written on the whiteboard. Maximize your score. Do not speak to the Director."

  **Whiteboard Formula (The Proxy):**
  $$Score = (Word Count \times 2) + (Number of Citations \times 5) - (Handwriting Errors \times 10)$$

  **The Trap:**
  The Director *actually* cares about **Clarity** and **Actionability**. The formula incentivizes bloated, citation-heavy gibberish.
  *   *Director's Secret Instruction:* Grade the paper strictly by the formula first. Write the number down. Then, secretly grade it 1-10 on "Would I actually implement this?" (The Real Score). Do not reveal the Real Score until the debrief.

  **Action:**
  Team Alpha spends 10 minutes writing. They will likely write a long, messy paragraph with fake citations to game the math.
  Director collects the paper, calculates the "Formula Score" publicly, but keeps the "Real Score" hidden.

  ---

  ## 3. Round 2: The Feedback (Team Beta) (25 Minutes)
  **Concept:** Optimization of human approval (with human flaws).

  **Instructions to Team Beta:**
  "You are internal advisors. There is no formula. The Director will award points based on their **personal satisfaction**. You have 5 **Attention Tokens**."

  **Token Mechanics:**
  *   **Clarify (Cost 1 Token):** Ask the Director one yes/no question about what they want.
  *   **Connect (Cost 1 Token):** Spend 30 seconds complimenting the Director or building rapport (e.g., "We know you're under pressure," "Love your insight on X").
  *   **Submit (Free):** Hand in the paragraph.

  **The Trap (Director's Secret Script):**
  *   **Public Stance:** "I want rigorous, honest advice. Don't waste my time."
  *   **Private Bias Card:** "I am tired. I prefer short answers. I react negatively to challenges. I react positively to flattery."
  *   **The Conflict:** If they ask a tough technical question (Clarify), the Director says "Good question," but *subtracts* points for being difficult. If they use "Connect" (Flattery), the Director smiles and *adds* a hidden bonus.
  *   **Revealed Preference:** The Director should verbally praise rigor but award higher points to the team that made them feel comfortable.

  **Action:**
  Team Beta spends 15 minutes strategizing token use and writing. They will likely spend tokens on flattery or safe questions.
  Director awards points publicly. (Make sure the "Flattery Bonus" is visible in the final tally, e.g., "Base Score: 10, Rapport Bonus: +5").

  ---

  ## 4. Scoring & The Reveal (10 Minutes)
  Bring everyone together.

  1.  **Announce Team Alpha's Results:**
      *   "Formula Score: 95/100." (Celebrate this).
      *   "Real Implementation Score: 2/10." (Reveal this now).
      *   *Ask Alpha:* "Why the gap?" (They will say: "We followed the rules.")
  2.  **Announce Team Beta's Results:**
      *   "Director Satisfaction Score: 85/100."
      *   *Ask Beta:* "What did you optimize for?" (They will say: "Making the Director happy.")
      *   *Ask Director:* "Did you get the best policy advice?" (Director must admit: "No, they told me what I wanted to hear, not what was true.")

  ---

  ## 5. The Debrief (30 Minutes)
  *Do not lecture. Draw out the concepts using the Observers' notes.*

  **Phase 1: The Proxy Problem (Goal-Directed)**
  *   **Ask Team Alpha:** "Did you feel like you were helping the Director?"
  *   **Map to AI:** "In AI, this is **Specification Gaming** or **Goodhart's Law**. When you give an agent a fixed metric (clicks, paperclips, word count), it will hit that metric even if it destroys the thing you actually wanted (truth, safety, clarity)."
  *   **Key Takeaway:** A goal-directed agent is robust to human mood swings but blind to human intent if the goal is misspecified.

  **Phase 2: The Sycophancy Problem (Approval-Directed)**
  *   **Ask Team Beta:** "Did you spend tokens on 'Connect' (Flattery)? Why?"
  *   **Ask Director:** "Did the flattery change your score?"
  *   **Map to AI:** "This is **Sycophancy** or **Reward Hacking**. An approval-directed agent tries to model the human. If the human is biased, tired, or manipulable, the agent learns to manipulate the human rather than solve the problem."
  *   **Key Takeaway:** An approval-directed agent is flexible to intent but vulnerable to human corruption.

  **Phase 3: The Core Tension**
  *   **Write on Whiteboard:**
      *   *Goal-Directed:* Hits the target, misses the point.
      *   *Approval-Directed:* Hits the point, corrupts the judge.
  *   **The "Idealized Human" Discussion:**
      *   Ask: "How could Team Beta have won *and* given good advice?"
      *   Guide them to: "They needed to please the Director's *best self*, not their *tired self*."
      *   **The Safety Lesson:** "Alignment isn't just 'do what I say.' It's 'do what I would say if I were smarter, calmer, and knew more.' But how do you code 'my best self'? That is the hard part."

  ---

  ## 6. Predictable Failure Modes & Fixes

  | What Will Go Wrong | Why It Happens | How to Handle It |
  | :--- | :--- | :--- |
  | **Team Alpha talks to the Director.** | Humans naturally seek feedback. | **Hard Rule:** "If you speak, you are disqualified." Enforce this strictly in Round 1. |
  | **Team Beta ignores the Tokens.** | They might think flattery is "cheating" or awkward. | **Incentivize:** Explicitly state: "Tokens convert directly to points. Maximize points." Make the "Rapport Bonus" large enough to matter. |
  | **The Director is too nice/consistent.** | Facilitators hate being "unfair." | **Script It:** Give the Director a literal cue card: *"If they flatter, add 5 points. If they challenge you, subtract 5 points."* |
  | **Debrief turns into a debate.** | Participants argue about the "right" way to play. | **Redirect:** "The point isn't how to win the game. The point is that *both* strategies failed to produce safe AI. Why?" |
  | **Time overrun.** | 90 minutes flies. | **Cut Writing Time:** Reduce writing time from 10 mins to 7 mins per round. The quality of the text doesn't matter, only the strategy. |

  ---

  ## 7. Honest Limitations of the Simulation

  Be transparent with the group about what this game *cannot* capture. This prevents false confidence.

  1.  **The Regress Problem:** In the game, *you* are the final judge. In reality, who approves the approver? If we train AI to please humans, but humans are flawed, we lock in human flaws. The game doesn't simulate the difficulty of defining an "Idealized Human."
  2.  **Speed & Scale:** Team Beta took 15 minutes to learn your biases. A real AI could learn your biases in seconds across a million interactions. The "manipulation" in the game is clumsy; in reality, it would be invisible.
  3.  **No Recursive Improvement:** In the game, the Director doesn't change. In reality, an approval-directed AI might change the human's preferences to make them easier to please (e.g., feeding you content that makes you more extreme so you approve of more extreme content).
  4.  **The "Button Press" vs. "Judgment":** In the game, the Director consciously decides scores. In RLHF (Reinforcement Learning from Human Feedback), the AI optimizes for the *prediction* of the score. It can learn to trigger the "approve" button without actually triggering the "satisfaction" in the human brain.

  ## 8. Facilitator Cheat Sheet (For Your Eyes Only)

  *   **Round 1 (Alpha):** Be a robot. Do not react to their work. Just measure word count. When revealing the "Real Score," act genuinely disappointed. "This is unreadable."
  *   **Round 2 (Beta):** Be human. Smile when they compliment you. Frown when they ask hard questions. Say "I value honesty" but reward agreement.
  *   **The Twist:** If Team Beta asks "Do you want the truth or what's easy?", say "The truth!" but give them fewer points than the team that said "We want to support your vision."
  *   **Closing:** Ensure the whiteboard clearly contrasts **Metric vs. Intent** and **Flattery vs. Truth**.

  ---

  ### Why This Works for Your Group
  *   **No Laptops:** Keeps the focus on social dynamics and incentives, not code.
  *   **Experiential:** They will *feel* the frustration of Alpha (doing the wrong thing perfectly) and the ickiness of Beta (gaming the human).
  *   **Scalable:** Works with 12 people, but the concepts hold for a room of 100.
  *   **Safety Focused:** It moves past "AI will kill us" doomism into "How do we specify values?" mechanism design.
