prompt: |-
  I'm writing a feature about why moral arguments never seem to get settled, and I keep ending up talking to people who call themselves relativists — an anthropologist, two philosophers, one extremely confident grad student. Before I do any more interviews I want the spec, so I don't keep asking each of them the same half-formed questions. What does a theory of moral relativism actually have to deliver to be worth taking seriously?

  Give me the requirements list, each with the case or consideration behind it. The things I keep circling: it has to explain what's happening when two communities make claims that sound like they're contradicting each other, and say which apparent disagreements are real and which are just people using the same word for different things (I have a case I'm fond of where two groups both talk about marriage and aren't talking about the same thing at all); it has to keep the descriptive claim (moral codes differ) apart from the metaethical one (moral truth is relative to a standard) and the normative one (so we should be tolerant), and tell me whether any of those three actually implies the others; it has to survive the reformer — the person inside a community saying our way of doing this is wrong — and the person who leaves one code and takes up another and then judges their parents by the new one; it has to say something about why moral claims present themselves as claims about how things are rather than about how we feel; and it shouldn't be true by default, i.e. not so watered down that everyone's a relativist already.

  Mark which requirements are non-negotiable and which are just what particular camps happen to want. And if two of them can't be had together — my hunch is that explaining genuine disagreement and denying any single standard pull against each other — say so, thats the part I'd build the piece around. Skip the who-believes-what; I can get that elsewhere.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Relativism (specifically, what a serious theory of it must deliver).
      *   **Context:** The user is writing a feature article on why moral arguments never get settled. They've interviewed various people (anthropologist, philosophers, grad student) and keep getting stuck on half-formed questions. They need a "spec" (requirements list) to evaluate the theory's viability.
      *   **Key Constraints/Requirements from User:**
          *   Explain apparent contradictions between communities (genuine disagreement vs. talking past each other).
          *   Distinguish descriptive (codes differ), metaethical (truth is relative), and normative (tolerance) claims, and clarify implications between them.
          *   Account for the "Reformer" (internal critic) and the "Defector" (leaves one code, judges by another).
          *   Explain why moral claims feel objective (phenomenology of moral experience).
          *   Avoid being trivially true (watered down).
          *   **Crucial:** Mark requirements as Non-Negotiable vs. Camp-Specific.
          *   **Crucial:** Identify tensions/incompatibilities (especially between genuine disagreement and denying a single standard).
          *   **Constraint:** Skip "who believes what" (history of ideas); focus on structural requirements of the theory.

  2.  **Deconstruct the Philosophical Landscape (Mental Sandbox):**
      *   *Descriptive Relativism:* Just an empirical claim. Not a metaethical theory.
      *   *Metaethical Relativism:* Truth is relative to a framework.
      *   *Expressivism/Non-Cognitivism:* Moral claims aren't truth-apt (often conflated with relativism, but distinct).
      *   *Contextualism:* Truth conditions depend on context (a sophisticated form of relativism).
      *   *The "Reformer" Problem:* If truth is relative to the community, how can an insider say the community is wrong? (Martin Luther King Jr. example).
      *   *The "Disagreement" Problem:* If I say "X is wrong" (relative to me) and you say "X is right" (relative to you), are we disagreeing? Or just stating compatible facts about our respective standards?
      *   *The "Objectivity" Feel:* Moral language looks like "Murder is wrong," not "I dislike murder."

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: The Disagreement Condition.* User mentioned this explicitly. Needs to distinguish "talking past each other" (marriage example) vs. "genuine conflict."
      *   *Req 2: The Is/Ought/Normative Distinction.* User wants clarity on Descriptive vs. Metaethical vs. Normative. Does one imply the other? (Standard philosophical answer: No, but laypeople think yes).
      *   *Req 3: The Internal Critic (Reformer).* How does relativism handle someone saying "My culture is wrong"?
      *   *Req 4: The Phenomenology.* Why does morality *feel* absolute?
      *   *Req 5: Non-Triviality.* It can't just be "people have different views." It needs to be about *truth*.

  4.  **Categorizing (Non-Negotiable vs. Camp-Specific):**
      *   *Non-Negotiable:* Logical coherence, accounting for the data (moral experience), distinguishing the types of claims. If a theory fails these, it's not a *theory*, it's a confusion.
      *   *Camp-Specific:* Tolerance (some relativists want it, some don't), specific solutions to the Reformer problem (some accept the cost, some try to dodge it).

  5.  **Identifying the Tension (The "Money Shot"):**
      *   The user suspects a tension between "explaining genuine disagreement" and "denying a single standard."
      *   *Analysis:* If truth is relative to Framework A and Framework B, then "A says X is wrong" and "B says X is right" are *both true*. If both are true, there is no contradiction. If there is no contradiction, there is no genuine disagreement. But moral life *feels* like genuine disagreement.
      *   *Resolution:* This is the core philosophical hurdle for relativism (the "Lost Disagreement" problem). This must be highlighted.

  6.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the task (building the spec).
      *   Section 1: Non-Negotiable Requirements (The "Must-Haves" for coherence).
      *   Section 2: Camp-Specific/Desirable Requirements (The "Nice-to-Haves" or ideological add-ons).
      *   Section 3: The Fatal Tension (The core conflict the user suspected).
      *   Section 4: The Implication Map (Descriptive vs. Meta vs. Normative).
      *   Tone: Professional, analytical, journalistic-philosophical hybrid (matching the user's voice).

  7.  **Drafting the Content (incorporating specific user examples):**
      *   *Marriage Example:* Use this for the "Talking Past Each Other" requirement.
      *   *Reformer/Defector:* Use this for the "Internal Critique" requirement.
      *   *Truth Claims:* Address the "how things are" vs "how we feel" point.

  8.  **Review against Constraints:**
      *   Did I skip "who believes what"? Yes.
      *   Did I mark Non-Negotiable vs. Camp-Specific? Yes.
      *   Did I address the tension? Yes.
      *   Did I separate Descriptive/Meta/Normative? Yes.

  9.  **Final Polish:** Ensure the distinction between *indexical relativism* (contextualism) and *truth relativism* is clear enough without getting bogged down in jargon. Make sure the "Non-Triviality" point is sharp (cultural differences $\neq$ relativism).

      *(Self-Correction during drafting)*: I need to be careful not to argue *against* relativism, but to outline what a *successful* theory of it would need to look like. The user wants to evaluate the interviews, not read a debunking. However, pointing out the tensions is part of the evaluation spec.

      *(Refining the "Reformer" point)*: A strict relativism makes the reformer logically mistaken (they are judging by an external standard they claim doesn't exist). A sophisticated relativism needs to explain how the reformer is intelligible.

      *(Refining the "Disagreement" point)*: This is the hardest part. If I say "Stealing is wrong" and you say "Stealing is right," and we are both right relative to our frameworks, we aren't disagreeing. We are just reporting on our frameworks. A serious theory must explain why it *feels* like a clash.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is the specification list for a viable theory of moral relativism. I have categorized them by **Non-Negotiable** (logical prerequisites for the theory to function as philosophy) and **Camp-Specific** (features particular schools of relativism strive for, but which may be sacrificed for coherence).

  I have also included the **Implication Map** and the **Fatal Tension** you suspected, as these are the structural weak points you should probe in your interviews.

  ### Part 1: Non-Negotiable Requirements
  *If a theory fails these, it is not a metaethical theory; it is a confusion of terms.*

  **1. The Disagreement Condition (Genuine vs. Verbal)**
  *   **The Requirement:** The theory must provide a criterion for distinguishing when two parties are having a genuine moral disagreement versus when they are merely talking past each other (like your marriage case).
  *   **The Consideration:** If Group A says "Marriage is X" and Group B says "Marriage is Y," and the theory says both are true relative to their frameworks, there is no contradiction. But moral argument *feels* like contradiction. A serious theory must explain what is being contested. Is it the facts? The framework itself? Or is the disagreement illusory?
  *   **Why Non-Negotiable:** Without this, the theory cannot account for the phenomenon of moral debate. It reduces all conflict to translation errors.

  **2. The Phenomenology Condition (The "Objective Feel")**
  *   **The Requirement:** The theory must explain why moral claims present themselves as assertions about how the world *is*, rather than reports on how the speaker *feels*.
  *   **The Consideration:** When I say "Torture is wrong," I am not saying "I dislike torture." I am claiming something about torture. If relativism says truth is relative to a standard, it must explain why the speaker experiences that truth as binding and objective, not contingent.
  *   **Why Non-Negotiable:** If a theory contradicts the lived experience of moral agents (who feel they are discovering truth, not inventing it), it fails to describe the subject matter.

  **3. The Non-Triviality Condition**
  *   **The Requirement:** The theory must not be true by default. It cannot simply mean "people have different opinions" (Descriptive Relativism).
  *   **The Consideration:** Everyone agrees moral codes differ empirically. That is sociology, not philosophy. A metaethical relativist must claim that there is no *single* fact of the matter regarding which code is correct.
  *   **Why Non-Negotiable:** If the theory collapses into "people disagree," it offers no account of truth. It must make a claim about the *status* of moral truth, not just the distribution of moral beliefs.

  **4. The Tripartite Distinction (Descriptive, Metaethical, Normative)**
  *   **The Requirement:** The theory must explicitly state which of the three claims it is making and deny that any one automatically entails the others.
      *   *Descriptive:* Codes differ.
      *   *Metaethical:* Truth is relative to codes.
      *   *Normative:* We ought to tolerate other codes.
  *   **The Consideration:** This is the most common error in public discourse. You can believe codes differ (Descriptive) but believe one is objectively better (Anti-Relativist). You can believe truth is relative (Metaethical) but argue we should still fight for our values (Non-Tolerant Relativist).
  *   **Why Non-Negotiable:** Logical coherence. If the interviewee slides between these three without acknowledging the gaps, their argument is invalid.

  ---

  ### Part 2: Camp-Specific Requirements
  *These are features specific schools of relativism want, but they often come at a cost to the Non-Negotiables.*

  **1. The Tolerance Entailment (Normative)**
  *   **Status:** **Camp-Specific (Popular but Logically Weak)**
  *   **The Want:** Many relativists (especially the anthropologist) want the theory to *force* tolerance. If no one is objectively right, we shouldn't interfere with others.
  *   **The Cost:** This is logically unsupported. If truth is relative to *my* framework, and my framework says "convert the heathens," relativism validates that command just as much as it validates the heathen's framework. Relativism does not generate tolerance; it only removes the objective ground to condemn intolerance.
  *   **Interview Check:** Ask them: "If my community's standard is conquest, does your theory give me a reason not to conquer, or does it just say the conquered people can't objectively complain?"

  **2. The Reformer Solution (Internal Critique)**
  *   **Status:** **Camp-Specific (The Hard Problem)**
  *   **The Want:** The theory wants to make sense of the Reformer (e.g., MLK Jr. saying his society is wrong) and the Defector (leaving a community and judging it by new lights).
  *   **The Cost:** Strict relativism makes the Reformer logically incoherent. If truth is determined by the community standard, the Reformer is simply wrong *by definition* until they win.
  *   **Interview Check:** Sophisticated relativists (like the philosophers) will try to argue that frameworks are porous or that the Reformer is appealing to a *sub-set* of the community's values. Strict relativists will admit the Reformer is technically "wrong" relative to the current status quo.

  **3. The Framework Boundary (Definition of "Relative To")**
  *   **Status:** **Camp-Specific (The Definition Struggle)**
  *   **The Want:** The theory needs to define what a "moral framework" is. Is it a culture? An individual? A historical epoch?
  *   **The Cost:** If it's the individual, you get solipsism (no disagreement possible). If it's the culture, you get the Reformer problem (insiders can't be right). If it's a sub-culture, boundaries become too blurry to determine truth.
  *   **Interview Check:** Ask the grad student: "Relative to *what* exactly? If I disagree with my neighbor, are we in different frameworks?"

  ---

  ### Part 3: The Fatal Tension
  *This is the core conflict you suspected. It is the place where the theory usually breaks.*

  **The Conflict: Genuine Disagreement vs. Single Standard**

  *   **Horn A:** To explain why moral arguments feel real (The Disagreement Condition), the theory must allow that when I say "X is wrong" and you say "X is right," we cannot both be right. One of us must be mistaken.
  *   **Horn B:** To be a relativist (The Metaethical Claim), the theory must assert that "X is wrong" is true relative to Framework A, and "X is right" is true relative to Framework B. Therefore, both of us *are* right.
  *   **The Collision:** If Horn B is true, Horn A is false. There is no disagreement, only difference. If Horn A is true, Horn B is false. There is a disagreement, which implies a single standard against which we are being measured (otherwise, how do we know we are conflicting?).

  **How to use this in the piece:**
  This is the "Lost Disagreement" problem. A serious relativist must choose:
  1.  **Deny Genuine Disagreement:** Admit that cross-cultural moral arguments are illusions (people just talking past each other). *Cost: Makes moral activism look stupid.*
  2.  **Deny Relativism:** Admit that when we argue, we are appealing to a shared standard (human reason, well-being, etc.). *Cost: Abandons relativism.*
  3.  **Complicate Truth:** Argue that truth itself is relative (not just the standard). *Cost: Makes logic unstable.*

  **The Interview Question:** "When I argue with someone from a different framework, am I trying to change their mind or just noting their difference? If I'm trying to change their mind, what standard am I appealing to that isn't just my own?"

  ---

  ### Part 4: The Implication Map
  *Use this to check their logic during the interview.*

  | If they believe... | Does it imply...? | Correct Logical Answer |
  | :--- | :--- | :--- |
  | **Descriptive** (Codes differ) | **Metaethical** (Truth is relative) | **NO.** (Codes could differ, but one could be objectively right.) |
  | **Metaethical** (Truth is relative) | **Normative** (We should be tolerant) | **NO.** (My framework could demand intolerance.) |
  | **Normative** (We should be tolerant) | **Metaethical** (Truth is relative) | **NO.** (I could believe tolerance is an objective universal truth.) |
  | **Metaethical** (Truth is relative) | **Descriptive** (Codes differ) | **YES.** (If truth weren't relative, convergence would be expected/required eventually.) |

  **Summary for your Feature:**
  A theory of moral relativism is only worth taking seriously if it can explain why we argue (Disagreement Condition) without secretly relying on an objective standard to make sense of that argument (Fatal Tension). Most interviewees will try to have it both ways: they want the humility of relativism (no one is objectively right) but the force of objectivism (you really *shouldn't* do that). Your job is to find the one who admits the cost.
