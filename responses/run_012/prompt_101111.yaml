answer: |-
  Here is the breakdown of your friend's method, the verdict on the binding-and-loosing saying, and the plain truth about the criteria she is using.

  ### 1. The Verdict on "Bind and Loose"
  **Her verdict will be: The Church Invented It.**

  *   **By her stated rule (Criterion of Embarrassment):** The early Church would never be embarrassed by Jesus giving them the authority to forgive sins. This is the foundation of ecclesiastical power. Since it isn't embarrassing, the Criterion of Embarrassment cannot vouch for it. It defaults to "suspect."
  *   **By her actual pattern:** Every saying she has marked "Invented" (Love enemies, Render unto Caesar) serves to make the Church look ethically superior or politically safe. Every saying she has marked "Authentic" makes Jesus look difficult, apocalyptic, or subordinate to God. "Bind and Loose" makes the Church look powerful and institutional. It does not fit her "Authentic Core."

  ### 2. Which Rule Is She Actually Running?
  She claims to be running the **Criterion of Embarrassment**, but she is actually running the **Criterion of Coherence with an Apocalyptic Portrait.**

  Here is the proof:
  *   **"Love your enemies":** This is *not* embarrassing to the Church. It is their brand. If she were strictly using Embarrassment, this saying would be "Maybe" (since the criterion can't rule it out), but she calls it "Invented." Why? Because it coheres with *Church Ethics*, not her *Apocalyptic Jesus*.
  *   **"Why call me good?":** This *is* embarrassing (subordinates Jesus to God). She calls it "Authentic." This fits Embarrassment, but it also fits her Apocalyptic/Prophetic portrait (Jesus as God's agent, not God).
  *   **"The End is coming soon":** This *is* embarrassing (he was wrong). She calls it "Authentic." This fits Embarrassment, and it fits the Apocalyptic portrait.

  She is using Embarrassment only when it confirms the portrait she has already chosen. When Embarrassment is silent (as with "Love enemies"), she switches to Coherence: *Does this sound like the Church, or does it sound like a 1st-century Jewish prophet?*

  ### 3. The Test Saying
  To separate her stated rule (Embarrassment) from your proposed rule (Multiple Attestation + Coherence), hand her this saying:

  **"Go nowhere among the Gentiles, and enter no town of the Samaritans, but go rather to the lost sheep of the house of Israel." (Matthew 10:5-6)**

  *   **Her Stated Rule (Embarrassment):** This is highly embarrassing for a later Gentile Church that wants to claim universal authority. Why would Jesus limit the mission?
      *   *Prediction:* **Authentic.**
  *   **Your Rule (Multiple Attestation):** This saying appears only in Matthew. It is not in Mark, Luke, John, or Thomas. It fails multiple attestation.
      *   *Prediction:* **Invented / Redaction.**
  *   **Her Actual Rule (Coherence with Apocalyptic Core):** An apocalyptic Jewish prophet preaching the restoration of Israel *would* say this. It coheres perfectly with her "Authentic Core."
      *   *Prediction:* **Authentic.**

  If she calls it **Authentic**, she is not running Multiple Attestation. She is running Coherence (likely masked as Embarrassment). If she calls it **Invented**, she is prioritizing Attestation over Embarrassment, which would be a surprise given her call on "Why call me good" (which is also largely single-strand in Mark).

  ### 4. Bonus: When Attestation and Coherence Come Apart
  Yes, they come apart constantly. This is where historical Jesus scholarship fractures into different "schools."

  **The Saying:** The Words of Institution at the Last Supper (*"This is my body... This is my blood"*).
  *   **Multiple Attestation:** Strong. Paul (1 Corinthians 11) + Mark/Matthew + Luke. It is in independent early strands.
  *   **Coherence:** Depends entirely on the "Core" you started with.
      *   If your Core is **"Apocalyptic Prophet,"** this does *not* cohere. A prophet announcing the Kingdom doesn't typically institute a ritual meal that replaces the Temple sacrifice.
      *   If your Core is **"Founder of Christianity,"** this coheres perfectly.

  Scholars who hold the "Apocalyptic" portrait (like your friend) often have to explain away these words as later liturgical insertions *despite* the strong attestation. Scholars who hold a "Sacramental" portrait accept them *despite* the lack of embarrassment. The criteria do not resolve the tension; the portrait resolves the tension, and the criteria are recruited to defend it.

  ### 5. The Core Question
  **Can any of these criteria settle who he was, or do they just launder back the picture you started with?**

  **They just launder back the picture you started with.**

  Say it plainly: The Criteria of Authenticity are not discovery engines; they are filtering systems. You cannot run data through a filter without first deciding what the filter is made of.
  *   If you decide the "Real Jesus" is an Apocalypticist, you choose criteria that validate apocalyptic sayings (Embarrassment regarding failed prophecy, Coherence with Jewish restoration).
  *   If you decide the "Real Jesus" is a Cynic Sage, you choose criteria that validate wisdom sayings (Coherence with Mediterranean peasant culture, Dissimilarity from Jewish apocalyptic).

  The "Criterion of Embarrassment" assumes you know what embarrassed the early Church (which is often guesswork). The "Criterion of Coherence" assumes you already know who Jesus is (which is the very thing you are trying to find).

  Your friend is not finding the historical Jesus. She is curating a Jesus that fits a specific theological and historical narrative she finds compelling. The sayings in the "Authentic" pile are there because they serve the book she wants to write, not because the criteria forced them there. The criteria are just the paperwork she files to make it look objective.
