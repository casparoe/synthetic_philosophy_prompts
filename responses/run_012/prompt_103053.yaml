answer: |-
  ### List 1: Descriptive Desiderata
  *Purpose: Explain variance in formally similar institutions across countries.*

  1.  **Bearer and Reference Class**
      *   **Requirement:** Specify the entity bearing the trait (population, culture, state) and justify why the nation-state is the relevant unit over region, class, or religion.
      *   **Case:** Institutions are nationally legislated; if the trait bearer does not map to the jurisdiction, the explanation fails.
      *   **Status:** Non-negotiable.
      *   **Tension:** Conflicts with **Req 6** if borders are arbitrary relative to cultural zones.

  2.  **Ontological Status**
      *   **Requirement:** Declare whether the trait is a statistical distribution over individuals or an emergent collective property irreducible to members.
      *   **Case:** Prevents the ecological fallacy (inferring individual nature from group data) or reification (treating abstractions as agents).
      *   **Status:** Non-negotiable.
      *   **Tension:** None inherent, but dictates the method for **Req 4**.

  3.  **Quantifier and Comparison Class**
      *   **Requirement:** Define the quantifier (mean, median, modal) and the explicit comparison class (e.g., "higher than X," not "always Y").
      *   **Case:** Character claims are comparative; universal claims are refuted by single counterexamples, rendering them useless for social science.
      *   **Status:** Non-negotiable.
      *   **Tension:** None.

  4.  **Inference Rule (Aggregate to Individual)**
      *   **Requirement:** Provide a rule for when group correlation licenses individual expectation and a protocol for Simpson's Paradox (reversal under partitioning).
      *   **Case:** Institutional behavior is enacted by individuals; without a bridge rule, the macro-trait cannot explain micro-behavior.
      *   **Status:** Non-negotiable.
      *   **Tension:** Conflicts with **Req 6** (within-group variation) if variation is too high to license reliable inference.

  5.  **Transmission and Stability**
      *   **Requirement:** Explain mechanism of persistence across mass immigration, generational turnover, and reform without becoming essentialist (immutable) or ephemeral (vanishing).
      *   **Case:** To explain institutional variance, the trait must outlast specific officeholders but adapt to demographic change.
      *   **Status:** Non-negotiable.
      *   **Tension:** **Critical Incompatibility:** Joint satisfaction with **Req 6** is highly constrained; high stability often implies essentialism which violates arbitrary borders/high variation.

  6.  **Consistency with Variation and Borders**
      *   **Requirement:** Acknowledge that within-group variation exceeds between-group variation, borders are recent/arbitrary, and traits are multidimensional.
      *   **Case:** Empirical adequacy; ignoring this renders the model factually false.
      *   **Status:** Non-negotiable.
      *   **Tension:** Conflicts with **Req 1** (Nation as reference) and **Req 5** (Stability).

  7.  **Falsification Conditions**
      *   **Requirement:** State what evidence would refute a character claim (e.g., convergence of institutional behavior despite cultural divergence).
      *   **Case:** Prevents the "no true Scotsman" defense which makes the notion unfalsifiable and thus explanatory vacuous.
      *   **Status:** Non-negotiable.
      *   **Tension:** Conflicts with **Req 5** if stability is defended by ad hoc adjustments to transmission mechanisms.

  ### List 2: Normative Desiderata
  *Purpose: Determine permissibility of asserting/acting on the generalization.*

  1.  **Warrant vs. Permission**
      *   **Requirement:** Distinguish between whether a generalization is statistically warranted and whether it is permissible to assert or act upon it.
      *   **Case:** True claims can be harmful; false claims can be useful; conflating truth with ethics muddies policy.
      *   **Status:** Non-negotiable.
      *   **Tension:** None.

  2.  **Harm Mechanism**
      *   **Requirement:** Specify what makes wrongful uses wrong (reification, self-fulfilling prophecy, dignitary harm, or unequal cost of error).
      *   **Case:** Targeted prohibition requires knowing the specific injury (e.g., stigma vs. inefficiency).
      *   **Status:** Non-negotiable.
      *   **Tension:** Conflicts with **Req 3** if the utility depends on the mechanism causing the harm.

  3.  **The Line (Bad vs. Good Uses)**
      *   **Requirement:** Draw a boundary forbidding harmful stereotypes while permitting necessary heuristics (medicine, insurance, translation).
      *   **Case:** Over-prohibition paralyzes functioning systems that rely on risk pooling and pattern recognition.
      *   **Status:** Non-negotiable.
      *   **Tension:** **Critical Incompatibility:** Joint satisfaction with **Req 2** is difficult; efficient heuristics often impose dignitary harm or unequal cost of error on outliers.

  4.  **Context and Speaker**
      *   **Requirement:** Differentiate permissibility based on context (private vs. public), speaker (insider vs. outsider), and power dynamics (powerful vs. powerless).
      *   **Case:** Harm is contingent on power; an outsider's generalization often carries coercive weight an insider's lacks.
      *   **Status:** Preference (some camps demand universal rules regardless of speaker).
      *   **Tension:** Conflicts with universalist interpretations of **Req 3**.

  ### Most Exclusionary Requirement
  **Descriptive Req 5 (Transmission and Stability)** does the most work to exclude candidates. It demands a causal mechanism that survives demographic churn without resorting to mysticism (blood/soil) or collapsing into current institutional states (circularity). Most theories fail here: they either posit traits too rigid to survive immigration or too fluid to explain persistent institutional variance.

  ### Scorecard
  The trait-at-a-distance view fails Descriptive Req 5 and 6 by positing static essences incompatible with demographic churn and high within-group variation, while the eliminativist satisfies all descriptive constraints only by abandoning the explanatory purpose entirely. The thin institutional view meets Stability (Req 5) but risks circularity against the explanandum, whereas the self-interpretation view secures the Bearer (Req 1) but collapses on Falsification (Req 7) due to subjective unfalsifiability. Ultimately, only the thin view survives the descriptive list, but it renders the phrase 'national character' redundant, confirming the advice to strike it.
