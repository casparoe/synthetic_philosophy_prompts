answer: |-
  Your philosophical nose is working perfectly. You have spotted two major errors in that summary. If you brought those objections into your seminar, your professor would likely be very pleased.

  The summary you read is a classic case of a "pop-philosophy" gloss that smooths over the technical machinery that actually makes the principle work. In doing so, it breaks the mechanism.

  Here is a sentence-by-sentence breakdown of what a working philosopher of science would say, followed by a specific address of your two suspicions (the coin flip and the reduction).

  ### Sentence-by-Sentence Critique

  **1. "Lewis's Principal Principle is the basic rule connecting what you believe to what's objectively probable: your credence in a proposition should equal its objective chance."**
  *   **Verdict:** **Fair popularization (with a hidden caveat).**
  *   **The Nuance:** This captures the *spirit* of the principle. Lewis wants to connect subjective belief (credence) with objective reality (chance). However, a philosopher would immediately add: *"Given that you have no inadmissible information."* As it stands, this sentence is too loose, but it's not yet a lie.

  **2. "If the chance of rain tomorrow is 30%, a rational person is 30% confident it will rain."**
  *   **Verdict:** **Nod-worthy.**
  *   **The Nuance:** This is the standard example used to teach the principle. It assumes the rational person knows the chance (30%) and possesses only "admissible" evidence (e.g., meteorological data, not a prophecy from a time traveler).

  **3. "What makes this a principle rather than a platitude is that it's meant to be exceptionless -- it says that once you know the chance, nothing else you learn can rationally move your credence off it."**
  *   **Verdict:** **Flat-out wrong.**
  *   **The Nuance:** This is the error you spotted with the coin flip. The Principal Principle is *not* exceptionless in the way this text claims. It is conditional on **admissibility**.
      *   **The Coin Flip:** If the objective chance of a coin landing heads is 0.5, but you *watch* it land heads, your credence should be 1.0. Why? Because you have acquired **inadmissible information** (information about the future outcome).
      *   **The Fix:** The principle actually says: Your credence should equal the chance, *conditional on your total evidence being admissible.* If you learn the outcome, that evidence "trumps" the chance. The summary implies chance *always* trumps evidence, which is backwards. Evidence about the outcome trumps chance.

  **4. "That's what 'deference' means here: your beliefs defer to the chances, they don't get a vote of their own."**
  *   **Verdict:** **Misleading metaphor.**
  *   **The Nuance:** "Deference" is the right word, but again, it is conditional. You defer to chance *in the absence of crystal-ball information*. If you have direct evidence of the outcome, you do not defer to the chance; you defer to the evidence. The summary suggests your beliefs *never* get a vote, which implies you should ignore empirical evidence if it conflicts with the statistical chance. That would be irrational.

  **5. "And since credence is the thing we can actually define, this is really how Lewis reduces objective chance to subjective probability -- a chance just is the credence a perfectly rational agent with the same information would have."**
  *   **Verdict:** **Flat-out wrong (Metaphysical Error).**
  *   **The Nuance:** This is a profound misrepresentation of Lewis's project.
      *   **Lewis was a Realist (sort of):** Lewis wanted to save objective chance from being *just* subjective probability. If chance were just rational credence, it wouldn't be "objective."
      *   **Lewis's Actual Reduction:** Lewis reduces objective chance to **patterns in categorical facts** (specifically, via the "Best System Analysis" or Humean Supervenience). For Lewis, chances are determined by the best balance of simplicity and strength in the systematization of the history of the universe.
      *   **The Error:** The summary claims Lewis reduces chance to *credence*. That would make Lewis a subjectivist. He was explicitly arguing *against* subjectivism about chance. The Principal Principle *connects* the two, it does not *identify* them.

  ---

  ### Addressing Your Specific Suspicions

  #### 1. The "Exceptionless" Claim (The Coin Flip)
  **You are right; the text is wrong.**
  The Principal Principle is formally written something like this:
  $$C(A \mid \text{Chance}(A) = x \text{ \& } E) = x$$
  Where $C$ is credence, $A$ is the proposition, and $E$ is your **admissible** evidence.

  The text claims that *nothing* can move your credence off the chance. But if $E$ includes "I see the coin lying heads up," that is *inadmissible* evidence. In that case, the Principal Principle doesn't apply in the simple way. Your credence should be 1, not 0.5.
  *   **Seminar Tip:** The technical term you want to use here is **"Admissibility."** Lewis struggled significantly with defining exactly what makes information admissible (roughly: information about the past and present is admissible; information about the future outcome is not).

  #### 2. The "Reduction" Claim
  **You are right to be suspicious; this does not follow.**
  The summary commits a category mistake.
  *   **Credence** is epistemic (about knowledge/belief).
  *   **Chance** is ontic (about the world).
  *   **The Principal Principle** is a bridge principle. It says: *"If there is an objective chance, rational belief must track it."*
  *   **The Reduction:** To say "Chance *just is* credence" is to say there is no objective world, only rational belief. Lewis spent his career arguing that there *is* an objective world (the Humean Mosaic) and chance supervenes on that.

  The summary writer likely confused Lewis with **Frank Ramsey** or **Bruno de Finetti**, who were subjectivists and *did* think probability was just a measure of belief. Lewis's whole goal in "A Subjectivist's Guide to Objective Chance" (the seminal paper on this) was to show how a subjectivist about *belief* can still believe in objective *chance*.

  ### Summary for your Seminar
  If you want to impress your seminar leader, here is the corrected takeaway:

  1.  **The PP is a constraint, not an identity.** It constrains rational credence *given* objective chance; it does not define chance *as* credence.
  2.  **Admissibility is key.** The PP only holds when your evidence is "admissible" (i.e., you don't know the future outcome). This solves the "coin I already watched land" problem.
  3.  **Lewis's Metaphysics.** Lewis reduces chance to the **Best System** of laws (Humean Supervenience), not to credence.

  **Recommended Reading:**
  If you haven't yet, you should look at the original source. It is surprisingly readable for a technical paper:
  *   David Lewis, *"A Subjectivist's Guide to Objective Chance"* (1980).

  (Warning: Lewis later realized the original Principal Principle had a flaw regarding "undermining futures" and proposed the **"New Principle,"** but for an introductory seminar, the original PP is usually the focus. If you mention the "New Principle" as a bonus, you'll look very well-prepared.)

  **Verdict on the Paperback:** Put it back on the shelf. It conflates the *normative constraint* (how you should believe) with the *metaphysical definition* (what chance is), and it ignores the crucial condition of admissibility.
