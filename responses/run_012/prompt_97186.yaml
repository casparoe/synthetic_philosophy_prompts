          *   *Claim 2: The Moral Agency Exclusivity Claim.* (Only humans have moral status). *Verdict:* Defensible metaphysically, but doesn't solve *practical* blame if the human didn't know.
          *   *Claim 3: The Foreseeability/Control Claim.* (Humans chose the risk). *Verdict:* Substantive but fails in "black box"/unforeseeable cases.
          *   *Claim 4: The Vicarious Liability Claim.* (Owners pay for dog bites). *Verdict:* Legally defensible, but morally unsatisfying (strict liability vs. blame).
          *   *Claim 5: The Collective "People" Claim.* (It's the organization). *Verdict:* Defensible, but risks the "Problem of Many Hands" (gap re-emerges as diffusion).
      *   *The Hard Cases:* Explicitly apply the readings to the loitering munition, unforeseeable failure, and veto scenarios.
      *   *Meaningful Human Control:* Analyze if it's substantive.
      *   *Conclusion:* Summary of where the engineer is right and where he is wrong.

