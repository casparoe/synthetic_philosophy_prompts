answer: |-
  Hi there,

  It is genuinely brilliant that you are thinking about this at sixteen, and your intuition that mapping things to numbers forces transitivity is mathematically spot on. If you assign every album or footballer a real number score, say a function f where f(A) is the score of A, then by the laws of arithmetic, if f(A) is greater than f(B) and f(B) is greater than f(C), then f(A) must be greater than f(C). There is no wiggle room there because the real number line is transitive by definition. So when you see philosophers arguing that 'better than' might not be transitive, they are essentially arguing that value cannot be perfectly mapped to a single number line without losing something crucial. They are suggesting that your tier list model is a Procrustean bed, stretching or chopping off bits of reality to make it fit the maths.

  Let's look at the spectrum argument first, using your vocabulary. Imagine you have a scale of pain from zero to ten. You have a mild headache, call it A, and a horrific agony, call it Z. The argument says you can get from A to Z in tiny steps where each step is barely noticeable. If you use scores, you might say A is a 1.0 and the next step B is 1.0001. Eventually, you reach Z at 10.0. In your maths model, A is definitely better than Z because 1.0 is less than 10.0. The problem arises if you say that because the step from A to B is imperceptible, they are equally good. If A is equal to B, and B is equal to C, and so on all the way to Z, then transitivity demands A is equal to Z. But a mild headache is not equal to horrific agony. So you have a contradiction. To make this fit your vocabulary, you have to bend the meaning of 'equal'. You have to admit that your scores out of ten are not precise enough to capture the reality, or that 'better than' is vague. If you insist on precise numbers, you save transitivity but you might be lying about the precision of your judgment. If you insist on the vagueness, you break the number model.

  Then there is the non-transitive dice example you mentioned from maths club. This is a perfect analogy for where the number mapping breaks down completely. With dice, A beats B more than half the time, B beats C more than half the time, and C beats A more than half the time. This works because 'beats' is probabilistic and depends on the specific matchup, not an intrinsic score. In philosophy, some argue value works like this because things are good in different ways. Imagine A is a weekend of pure pleasure, B is a weekend of deep achievement, and C is a weekend of moral virtue. You might prefer pleasure to achievement, achievement to virtue, but virtue to pleasure, depending on what you are craving at the time. If you try to force this into a single score, you have to decide how much pleasure equals how much virtue. That requires a common currency, like utility. If you refuse to reduce them to one currency, you can't write a function f(A) that settles the ranking. So here, the vocabulary of a single score doesn't just bend, it snaps. You would need a vector of scores, one for each dimension of value, but then you cannot simply say one vector is greater than another without a rule for weighing them against each other.

  Now consider the population stuff you mentioned, Parfit's Repugnant Conclusion. This is where you compare a world with a few people living amazing lives against a world with billions living lives barely worth living. If 'better than' is transitive and you think adding a person with a life worth living makes a world better, you can add them one by one. Start with the amazing lives. Add a bunch of people with slightly less amazing lives but more of them. If that trade is better, and you keep making small trades, transitivity forces you to conclude the massive population of mediocre lives is better than the small population of great lives. Most people feel this is wrong. Temkin argues that 'better than' is essentially intransitive here. To translate this into your league tables, it means the position of a team depends on who else is in the league. In maths, if A > B, it doesn't matter if C exists. In Temkin's view, A might be better than B in a head-to-head, but if you introduce C, suddenly B might be better than A. This violates the independence of irrelevant alternatives, which is a standard assumption in voting theory and utility functions. So this argument cannot be said in your vocabulary at all without changing the rules of how league tables work. Your vocabulary assumes the score is intrinsic to the object, but this philosophy says the value is relational.

  So to your core question about what gets lost. If you force everything into scores out of ten, transitivity comes free, but it is arguably a cheat. It assumes that all value is commensurable, meaning you can always say exactly how much happiness equals how much justice. It also assumes precision where there might only be vagueness. The philosophers are not necessarily muddling things; they are pointing out that the map is not the territory. When you say a sandwich is an 8 out of 10, you are creating a useful fiction. It helps you decide what to eat for lunch. But when you apply that same fiction to moral dilemmas or the meaning of lives, the fiction starts to dictate the reality rather than describing it. The loss is multidimensionality and context. By reducing value to a scalar, you lose the texture of why something is good. However, there is a risk on the other side. If you abandon transitivity completely, you risk making rational choice impossible. If A is better than B, and B is better than C, but C is better than A, how do you choose? You could cycle forever, never picking a option because there is always another one that is 'better'. Most decision theory says rational agents must have transitive preferences to avoid being pumped for money or resources in a cycle.

  Now I need to be honest about where my own reasoning here is most likely to be wrong. I have presented the mathematical model as rigid and the philosophical objections as flexible, but I might be understating how much work the mathematical model can do. It is possible to model vagueness using fuzzy logic or supervaluationism without abandoning transitivity entirely, and it is possible to model multidimensional value using weighted sums that preserve transitivity. My bias is towards the idea that the philosophers have identified a real structural flaw in how we think about value, but it is equally possible that they are identifying flaws in our intuition rather than in the logic of value itself. Our brains are not evolved to handle massive populations or microscopic differences in value, so the Repugnant Conclusion might be a bug in our psychology, not a bug in ethics. If our gut says the repugnant conclusion is wrong, that might be the error, not the maths.

  The consideration that would change my mind about whether this is a vocabulary problem or a reality problem is a concrete example of rational intransitive choice in a high-stakes environment. If you could show me a scenario where a fully informed, rational agent consistently and willingly chooses A over B, B over C, and C over A without feeling conflicted or suffering a loss, then I would have to admit that transitivity is not a requirement of rationality. Currently, most examples of intransitivity rely on confusion, framing effects, or lack of information. If intransitivity persists even when all the facts are laid out and the agent is thinking clearly, then the number model is definitely a cheat. But if intransitivity disappears upon reflection, then the philosophers are just cataloguing human error, and your tier lists are actually the correct idealisation of how value ought to work, even if we are bad at calculating the scores. I suspect the truth is somewhere in the middle, where 'better than' is transitive for precise, comparable things like maths problems, but becomes vague and context-dependent when applied to complex human experiences, making the number model a useful tool that breaks if you push it too hard.

  I hope that helps untangle the knot a bit without sending you down another rabbit hole. It is a fascinating subject and you are asking exactly the right questions to cut through the jargon.

  Best wishes
