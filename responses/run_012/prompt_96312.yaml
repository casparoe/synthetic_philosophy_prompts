answer: |-
  ### Philosophical Preamble: What We Are Dramatizing

  Before I give you the run sheet, let's clarify what this exercise is actually doing. You said you don't see what turns on the interpretation/construction distinction. Here is the philosophical engine under the hood of this activity:

  1.  **Interpretation** is the search for semantic content (what do the words mean?).
  2.  **Construction** is the assignment of legal effect when semantic content runs out or leads to absurdity (what do we *do* with the words?).

  **Textualists** argue that interpretation usually exhausts the judicial function; if the text is clear, construction is not permitted even if the result is bad. **Purposivists** argue that interpretation is impossible without purpose, so construction is always happening implicitly.

  **What this activity can reproduce:** The frustration of linguistic indeterminacy, the temptation to "fix" bad drafting, the institutional pressure of having to issue a ruling, and the strategic use of legislative history.

  **What this activity cannot reproduce:** *Stare decisis* (the weight of past decisions), the sheer length of real statutes (the "sea of words"), and the real-world cost of error (people don't actually go to jail in this simulation). You will have to supply the "cost of error" verbally in the debrief.

  ---

  ### Activity Title: The "Secure Container" Protocol

  **Concept:** Two teams draft a safety regulation; two different teams apply it to a hard case. The drafters will try to write a clear rule to achieve a safety goal. The appliers will find that the clear rule breaks the safety goal (or vice versa).

  **Grouping (14 Students):**
  *   **Legislature A (3 students):** Draft the statute.
  *   **Legislature B (3 students):** Draft the statute.
  *   **Agency C (4 students):** Apply Legislature A's statute.
  *   **Agency D (4 students):** Apply Legislature B's statute.

  **The Stake:** "Judicial Capital."
  *   Each Agency member starts with **10 Points**.
  *   If the Agency issues a **unanimous** opinion: +2 Points each.
  *   If the Agency issues a **split** opinion (dissent): -2 Points each.
  *   If the Legislature successfully **appeals** to the Professor (Supreme Court): -5 Points each.
  *   *Why this works:* It forces them to care about defensibility (to avoid appeal) and institutional unity (to avoid dissent), mirroring real judicial pressure.

  ---

  ### Run Sheet (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Divide class. Move tables so Legislature A/C and B/D are far apart. Hand out **Packet 1** to Legislatures only. |
  | **05-25** | **Round 1** | **Legislatures Draft.** They must write the definition of "Secure Container" and the penalty provision. They receive a "Policy Goal" memo. They must also write a private "Drafting Note" (sealed envelope) explaining what they *really* meant. |
  | **25-30** | **Handoff** | Collect statutes. Collect sealed "Drafting Notes." Hand **Packet 2** to Agencies. Packet contains: The Statute (from opposite team), The Fact Pattern, and a "Legislative History" file (see materials). |
  | **30-55** | **Round 2** | **Agencies Adjudicate.** They must decide if the defendant violated the statute. They must write a 1-paragraph "Opinion" justifying the result. They must decide whether to open the "Drafting Notes" (see twist below). |
  | **55-60** | **Appeal** | Legislatures get their statute + the Agency Opinion back. They have 5 mins to write a 3-sentence "Appeal Brief" arguing why the Agency got it wrong. |
  | **60-80** | **Debrief** | Professor facilitates. Reveal the "Textualism/Purposivism" labels. Discuss the "Meaning vs. Application" question. |

  ---

  ### Materials (Printable)

  #### Packet 1: For Legislatures (A & B)
  **Mission:** You are drafting the *Campus Chemical Safety Act*.
  **Goal:** Prevent unauthorized access to hazardous chemicals while allowing legitimate research to proceed without bureaucratic delay.
  **Task:**
  1.  Write **Section 1 (Definition)**: Define "Secure Container." You must use this term in the operative clause.
  2.  Write **Section 2 (Penalty)**: What happens if a container is not "Secure"? (e.g., Funding cut, Lab shutdown).
  3.  **Constraint:** You cannot use the word "reasonable." You must use objective criteria.
  4.  **Secret:** Write a "Drafting Note" explaining one scenario you *discussed but decided not to cover explicitly*. Seal this in an envelope.

  #### Packet 2: For Agencies (C & D)
  **Case File: *In re Chemistry Lab 404***
  **The Statute:** (The text written by the opposite Legislature).
  **The Facts:**
  The Chemistry Department keeps a volatile compound in a metal box. The box has a high-security digital lock. However, the lab manager writes the PIN code on a sticky note and tapes it to the *inside* of the lid. Anyone who opens the lid sees the code. The box is never left open, but any authorized student can open the box, see the code, and memorize it for later unauthorized entry.
  **The Question:** Is this a "Secure Container" under the statute?
  **The Legislative History File:**
  1.  **Draft Version 1:** Defined "Secure Container" as one that is "reasonably impenetrable." (Word "reasonably" was deleted in final version).
  2.  **Floor Memo:** A note from a Legislator saying, "We want to ensure safety, not create red tape."
  3.  **The Envelope:** You may choose to open the Legislature's sealed "Drafting Note." *Cost:* If you open it, you must cite it in your opinion. If you don't open it, you cannot complain later that you didn't know the intent.

  #### Packet 3: For Debrief (Professor Only)
  **The Twist:** In the "Legislative History File," ensure there is a conflict. The deleted word "reasonably" suggests a textualist argument (expressio unius), but the Floor Memo suggests a purposivist one.

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. The "Vague Drafter" Failure**
  *   **Problem:** Legislature writes "Secure Container means a locked box."
  *   **Result:** Agency says "It's locked. Case closed." No tension.
  *   **Fix:** During Round 1, circulate as a "Parliamentarian." If a definition is too simple, say: "Counsel, the Budget Committee requires specific technical criteria to avoid litigation. Please specify the *mechanism* of security." Force them to add words like "prevents," "during," or "unauthorized."

  **2. The "Ambiguity Dodge" Failure**
  *   **Problem:** Agency says "The term is ambiguous, we remand."
  *   **Result:** No holding is reached. The game stalls.
  *   **Fix:** The rules state: "To receive the +2 Unity Points, you must issue a binary ruling: Compliant or Non-Compliant. Remand is not an option." This forces construction.

  **3. The "Intent Lie" Failure**
  *   **Problem:** Legislatures, upon seeing the harsh result, lie in the Appeal Brief ("We *definitely* meant to cover sticky notes!").
  *   **Result:** Undermines the lesson about fixed text.
  *   **Fix:** Collect the sealed "Drafting Notes" *before* Round 2 starts. In the debrief, open them publicly. If the Appeal Brief contradicts the sealed note, point it out. This dramatizes the unreliability of post-hoc intent.

  **4. The "Unanimity" Pressure Cooker**
  *   **Problem:** 4 students in an Agency can't agree.
  *   **Fix:** Allow a majority opinion, but penalize the dissenters (as per the points system). This simulates the pressure to join the majority to maintain institutional legitimacy.

  ---

  ### Limitations: What You Must Supply Verbally

  This simulation is a "petri dish" version of statutory interpretation. In the debrief, you must explicitly name the features that are missing:

  1.  **Precedent:** In real life, the Agency's decision binds future cases. Here, the case ends when the bell rings. *Tell them:* "In reality, your 'sticky note' ruling would govern 500 future labs. That risk makes judges more cautious than you were today."
  2.  **The "Sea of Words":** Real statutes are 800 pages with cross-references. *Tell them:* "You had one definition. Real drafters are often trying to reconcile 14 conflicting definitions elsewhere in the code."
  3.  **Real Harm:** No one actually gets hurt if the chemical is stolen here. *Tell them:* "Textualists argue that when the stakes are life-and-death, judges shouldn't guess at purpose. Purposivists argue that when stakes are high, literalism is immoral. You didn't feel that weight."

  ---

  ### The Debrief: Addressing Your Specific Confusion

  You mentioned you don't see the difference between disagreeing about *meaning* vs. disagreeing about *application*. This is the crux of the Interpretation/Construction distinction. Here is how you lead that discussion in the final 20 minutes.

  **Step 1: The Reveal (5 mins)**
  Open the sealed "Drafting Notes." Compare them to the Agency Opinions.
  *   Ask the Agencies: "Did you look at the Drafting Note? Why or why not?"
  *   Ask the Legislatures: "How did it feel to see your words used this way?" (They will likely say: "That's not what we meant!" $\rightarrow$ This is the birth of Purposivism).
  *   Ask the Agencies: "Why didn't you just fix it?" (They will likely say: "We weren't allowed to rewrite it." $\rightarrow$ This is the birth of Textualism).

  **Step 2: The "Meaning vs. Application" Question (10 mins)**
  This is the part you said you definitely don't get. Put this question on the board:

  > **"Did you disagree on what the word 'Secure' *means*, or on whether the sticky-note box *counts* as secure?"**

  *   **Scenario A (Interpretation Dispute):** If one student said "Secure means 'impossible to open'" and another said "Secure means 'hard to open'," they are fighting about **semantics** (Interpretation).
  *   **Scenario B (Construction Dispute):** If everyone agreed "Secure means 'prevents unauthorized access'," but disagreed on whether a sticky note *inside* the lid counts as "preventing access," they are fighting about **legal effect** (Construction).

  **Why this matters:**
  *   **Textualists** try to keep everything in Scenario A. They argue that if the meaning is clear, the application follows automatically.
  *   **Purposivists/Constructionists** admit that we are often in Scenario B. The meaning is clear, but the *rule* doesn't tell us what to do when the meaning clashes with the goal (Safety).

  **Step 3: The "Recover-the-Intent" Trap (5 mins)**
  Point to the Legislative History File.
  *   "One draft had the word 'reasonable.' It was deleted."
  *   Ask the Textualists in the room: "Does the deletion matter?" (Yes, it implies a rejection of flexibility).
  *   Ask the Purposivists: "Does the deletion matter?" (No, it might have been redundant).
  *   **The Lesson:** This shows why Textualists distrust legislative history. It allows the loser of the legislative battle to win in court.

  **Closing Line for the Session:**
  "Today, you felt the gap between the words you wrote and the world you tried to regulate. Statutory interpretation is the art of building a bridge across that gap. The fight isn't about whether the gap exists. The fight is about who gets to build the bridge: the judge, or the legislature."
