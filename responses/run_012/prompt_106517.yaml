answer: |-
  Here is a complete run-sheet for your 90-minute seminar. It is designed to be high-friction: the mechanics should feel slightly awkward so the philosophical point lands harder.

  # Activity Title: The Codon Game
  **Goal:** To physically enact the dependency of "genetic information" on the translational machinery, forcing a distinction between causal covariance and semantic content.
  **Time:** 90 Minutes (10 min Setup, 35 min Gameplay, 45 min Debrief)
  **Students:** 14

  ## 1. Materials List
  *   **DNA Cards (4 sets):** Each card has a "gene" of 3 codons (e.g., `AUG-CCG-UAA`). Use a 4-letter alphabet (A, C, G, T).
  *   **Machinery Tables (5 sets):** Laminated sheets mapping the 64 triplets to 4 Output Symbols (■, ▲, ●, ★).
      *   *Table Type A (3 copies):* Standard arbitrary mapping.
      *   *Table Type B (2 copies):* Same triplets, *different* Output Symbols.
  *   **Phenotype Tokens:** A pile of colored shapes or symbols (matching the Output Symbols).
  *   **Score Sheet:** Whiteboard to track "Viability Points."
  *   **Timer:** Visible to all.

  ## 2. Group Roles (14 Students)
  *   **The Genome (4 students):** Hold the DNA Cards. They are the "Source."
  *   **The Machinery (5 students):** Hold the Translation Tables. They are the "Rules."
  *   **The Cell (5 students):** The "Decoders." They take a DNA card and a Machinery table, compute the output, and claim Phenotype Tokens.
      *   *Note:* You (the instructor) act as the **Environment**, setting the viability conditions.

  ## 3. The Scoring Scheme: "Viability Points"
  To prevent the game from becoming a rote decoding exercise, scoring is based on **prediction under uncertainty**.
  *   **The Goal:** The "Environment" (You) announces a **Target Phenotype** (e.g., "We need a ■ to survive").
  *   **The Constraint:** The **Genome** players must wager on whether their sequence will produce the Target.
  *   **The Catch:** The Genome players *cannot* see the Machinery Table. They must ask the Machinery players for the "translation rules" before betting.
  *   **Points:**
      *   **Cell:** 1 point if they correctly decode the sequence to match the Target.
      *   **Genome:** 1 point if they correctly predict the Output *before* decoding begins.
      *   **Machinery:** 1 point if their Table allows the Cell to match the Target.
  *   **Philosophical Teeth:** In Round 2, the Table changes. The Genome's sequence is identical, but their previous prediction is now wrong. They lose points not because their DNA changed, but because the *context* changed.

  ## 4. The Rounds (35 Minutes Total)

  **Round 1: The Consensus (8 mins)**
  *   **Setup:** All Cells get a DNA card and a **Type A** Table.
  *   **Task:** Environment demands Target "■". Genomes predict output. Cells decode.
  *   **Outcome:** High success rate. Students feel confident: "The DNA codes for ■."
  *   **Freeze:** Do not discuss yet. Reset cards.

  **Round 2: The Arbitrary Switch (10 mins)**
  *   **Setup:** Same DNA cards. But now, 2 Cells get **Type B** Tables (different mapping).
  *   **Task:** Environment demands Target "■". Genomes predict (using old logic). Cells decode.
  *   **Outcome:** The Cells with Type B tables produce a different symbol (e.g., ▲). They fail viability. The Genomes lose prediction points.
  *   **The Bite:** The DNA sequence did not change. The "message" changed.
  *   **Freeze:** Ask Genomes: "Did your card change?" (No). "Did your meaning change?" (Yes).

  **Round 3: The Silent Strand (7 mins)**
  *   **Setup:** Give a DNA card to a Cell *without* a Machinery Table.
  *   **Task:** Environment demands Target.
  *   **Outcome:** The Cell cannot act. Nothing happens.
  *   **The Bite:** Without the reader, the DNA is just ink. It has causal potential, but no semantic value.

  **Round 4: The Synonymous Mutation (10 mins)**
  *   **Setup:** Return to Type A Tables. Hand a Genome a mutated card where one triplet changes but maps to the *same* symbol (redundancy).
  *   **Task:** Environment demands Target.
  *   **Outcome:** Output is identical to Round 1.
  *   **The Bite:** Physical change in the substrate, but no difference in the "message." Is it information if it makes no difference?

  ## 5. The Debrief (45 Minutes)
  *Do not let them pack up early. This is where the work happens.*

  **Phase 1: The Location of Information (15 mins)**
  *   **Ask:** "In Round 2, when the output changed, did the information in the DNA change?"
  *   **Push:** If they say "No," ask: "Then how did the product change?" If they say "Yes," ask: "But the bases were identical."
  *   **Concept:** Map this to **Maynard Smith's** distinction.
      *   *Causal Role:* The DNA covaries with the protein (Shannon information). This is real and physical.
      *   *Semantic Role:* The DNA is *about* the protein. This requires a convention (the Machinery).
  *   **Key Insight:** Information isn't a substance inside the DNA; it's a *relation* between the sequence and the machinery.

  **Phase 2: Code vs. Cipher vs. Chemistry (15 mins)**
  *   **Ask:** "In the game, the Table was a piece of paper (a convention). In the cell, the 'Table' is tRNA and synthetases (chemistry). Does that matter?"
  *   **Push:** Students will want to say "Chemistry is real, paper is fake."
  *   **Counter:** The chemistry is *arbitrary* too (The Frozen Accident). There is no chemical law that says `AUG` *must* bind Methionine. It just happens to, and evolution locked it in.
  *   **Concept:** **Crick's Frozen Accident.** The mapping looks like a language (code) because it is arbitrary but universal. If it were chemical necessity (like water dissolving salt), it wouldn't be a code; it would be a law.
  *   **Deflationary Pull:** The "reading" is just molecular affinity. The "meaning" is imposed by the evolutionary history of the cell, not the DNA itself.

  **Phase 3: The Deflationary Trap (15 mins)**
  *   **Ask:** "So, is 'genetic information' just a metaphor?"
  *   **Trap:** If they say "Yes," they miss the utility. If they say "No," they reify the metaphor.
  *   **Resolution:** It is a **real causal role** that is best *modeled* using semantic terms. We cannot explain development without treating the DNA *as if* it carries instructions, even if ontologically it's just chemistry.
  *   **Reference:** **Godfrey-Smith's Sender-Receiver Model.** The DNA is a sender, the Ribosome is a receiver. The "meaning" exists in the successful coordination of the two, selected for by evolution.
  *   **Closing Question:** "If we synthesized a cell with a completely different codon table (synthetic biology), would the DNA in *our* bodies carry information in *that* cell?" (Answer: No. It would be noise.)

  ## 6. Predictable Failure Modes
  1.  **Teleological Smuggling:** Students will say, "The DNA *tries* to make the protein."
      *   *Fix:* Ban intentional verbs. "Does the card *want* anything? Does the table *want* anything?" Force causal language ("causes," "triggers," "binds").
  2.  **The "DNA is Boss" Bias:** In Round 2, Genomes will insist their card is the "real" information and the Table is just a tool.
      *   *Fix:* Remind them that without the Table, the Card is inert (Round 3). A key without a lock is just metal.
  3.  **Gaming the Score:** Students might focus on winning points rather than the mechanism.
      *   *Fix:* Pause the scoring after Round 2. Explicitly state: "The points are broken on purpose. The breakdown is the data."
  4.  **Decoding Bottleneck:** 12 symbols might take too long to decode manually.
      *   *Fix:* Keep genes to exactly 3 codons. Pre-calculate the answers for yourself so you can verify instantly.

  ## 7. What This Activity Cannot Reproduce (Be Frank About This)
  *   **Physicality of the Table:** In the game, the Table is a rule sheet (symbolic). In the cell, the "Table" is the physical shape of tRNA molecules. The "arbitrariness" is hidden by physical fit. You must explain that the physical fit *itself* is the result of evolutionary history, not chemical law.
  *   **Developmental Context:** The game produces a single token (protein). Real phenotypes are emergent properties of networks, not direct translations. The "meaning" of a gene changes depending on the developmental stage (context sensitivity), which the game simplifies.
  *   **Evolutionary Time:** The game is static. In reality, the "Table" evolves (rarely). The "Frozen Accident" isn't frozen forever, just for long enough to look like a law.
  *   **Content Origin:** The game assumes the mapping exists. It doesn't explain *how* a physical state gets content (the Naturalization of Intentionality problem). You will have to supply the theory (e.g., Teleosemantics) in the debrief; the game only sets the stage.

  ## 8. Instructor Cheat-Sheet for the Debrief
  *   **If they say "It's just chemistry":** Ask, "Why do we use the word 'code' in every biology textbook then? Is it just laziness?" (Leads to: No, it captures a causal structure chemistry alone misses).
  *   **If they say "It's a real language":** Ask, "Who is the language for? The cell doesn't 'read' like you read a book." (Leads to: It's a functional analogy, not a cognitive one).
  *   **If they get stuck on Round 4 (Synonymous):** Use this to introduce **Noise**. If the output doesn't change, was the mutation "information"? (Shannon says yes, it reduced uncertainty; Semantic says no, it changed nothing).

  This structure ensures they leave feeling the *tension* rather than resolving it too easily. They should walk away understanding that "information" is a real biological category, but one that depends entirely on the machinery that consumes it.
