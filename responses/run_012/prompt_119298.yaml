prompt: |-
  I am writing a novel whose climactic scene turns on a rescue: a woman on a flooded causeway can either pull one stranger out of the water or, by spending the same minutes and the same strength, reach a van going under with five people inside it. I am not asking you for a verdict yet. Before I trust any verdict, I want the specification a theory of this choice would have to satisfy — because I have read enough moral philosophy to notice that the familiar camps each buy their answer by refusing to look at part of the case (one says that every person's claim is equal and that the numbers are therefore morally inert; the other says that five deaths are simply worse than one), and I want the whole bill laid out before I put an argument in a character's mouth. Adequate, for my purposes, means good enough that a woman with a minute to decide could act on it and defend the act afterwards.

  So give me the desiderata — not a survey of positions, a specification. For each requirement, name the case or consideration that motivates it.

  Cases it must get right, at minimum: the plain one against five; the nested case in which option A saves one person and option B saves that same person plus two others, so that nobody is left worse off under B; a case in which the options overlap without either containing the other (one pair against a different pair sharing a single member), so that no one's fate is settled by a larger set simply containing her; a case in which both options save the same number of people but the stakes differ (one will certainly die without rescue, five will lose limbs); a case in which the five can be reached only by a plan that succeeds with a probability, so that expected lives saved can be equal while the certain outcomes are not; a case in which the candidates can speak to one another and propose a lottery among themselves; and a case in which the rescuer's own survival is one of the things at stake.

  Distinctions it must not collapse: between the number of claimants and the magnitude of each claim; between a consideration that breaks a tie and one that decides the case; between a claim being weaker and its being outweighed; between what is true of each of the five and what is true of the five together; between the agent's obligation and the claimants' own agreement; and between the ex ante prospect and the ex post outcome.

  Constraints it must respect: no trading of one life against a large number of small goods; no verdict that turns on facts the rescuer cannot know; and an answer even when no coin, no time, and no consultation are available, since that is the condition of my scene.

  Then tell me which requirement is doing the most work in excluding the two camps I named, and whether any pair of them is jointly unsatisfiable — the pair I suspect is the demand that each person's claim count equally and the demand that the agent save the greater number. If they cannot both hold, say which I should surrender and what the scene loses by it. One line each on how the two camps fare against your list is enough; I will do the arguing in the book.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Provide a specification (desiderata) for a moral theory governing a rescue choice (1 vs. 5), *not* a verdict or a survey of existing positions.
      *   **Context:** A novel's climactic scene. A woman on a flooded causeway must choose between saving 1 stranger or 5 people in a van.
      *   **User's Stance:** Skeptical of standard moral philosophy camps (Utilitarianism vs. Deontology/Contractualism) because they seem to ignore parts of the case. Wants the "whole bill laid out."
      *   **Criteria for Adequacy:** Good enough for a character to act on in a minute and defend afterwards.
      *   **Required Content:**
          *   Desiderata (requirements) with motivating cases/considerations.
          *   Specific cases the theory must handle (1 vs. 5, nested, overlapping, stakes/probability, lottery, self-inclusion).
          *   Distinctions the theory must preserve (number vs. magnitude, tie-breaker vs. decider, weaker vs. outweighed, individual vs. group, obligation vs. agreement, ex ante vs. ex post).
          *   Constraints (no trading life for small goods, no unknowable facts, must work under time pressure/no tools).
          *   Analysis of the tension between "equal claims" and "save the greater number."
          *   Brief assessment of the two camps against the list.
      *   **Tone:** Philosophical, precise, literary-aware, rigorous but actionable.

  2.  **Deconstruct the Desiderata (The Specification):**
      *   I need to translate the user's list of "Cases," "Distinctions," and "Constraints" into positive requirements for the theory.
      *   *Requirement 1: Aggregation Sensitivity.* (Motivated by 1 vs. 5). The theory must explain why numbers matter without reducing people to units.
      *   *Requirement 2: Pareto/Inclusion Sensitivity.* (Motivated by the nested case). If B saves everyone A saves plus more, B must be preferred without needing to weigh lives against lives directly.
      *   *Requirement 3: Claim Individuation.* (Motivated by overlapping pairs). The theory must address specific individuals, not just totals.
      *   *Requirement 4: Severity Scaling.* (Motivated by 1 death vs. 5 limb-loss). Magnitude of harm matters, not just headcount.
      *   *Requirement 5: Risk/Probability Integration.* (Motivated by the probabilistic rescue). Expected value vs. certainty needs handling.
      *   *Requirement 6: Procedural Fairness.* (Motivated by the lottery case). If time allows, consent/lottery matters. If not, why not?
      *   *Requirement 7: Agent-Relative Permission/Constraint.* (Motivated by self-inclusion). The rescuer's life counts, but how?
      *   *Requirement 8: Epistemic Accessibility.* (Constraint: no unknowable facts). The theory must rely on what is visible/known in the moment.
      *   *Requirement 9: Actionability.* (Constraint: 1 minute, no coin). The theory must yield a decision rule, not just a post-hoc justification.

  3.  **Address the Distinctions:**
      *   I need to ensure the specification explicitly demands these distinctions be maintained.
      *   *Number vs. Magnitude:* Don't just count heads; weigh the harm.
      *   *Tie-breaker vs. Decider:* Is numbers the *reason* or just the *tipper*?
      *   *Weaker vs. Outweighed:* Does the one's claim vanish or just lose?
      *   *Individual vs. Group:* Avoid collectivism that erases the individual.
      *   *Obligation vs. Agreement:* Does the rescuer decide or do the victims?
      *   *Ex Ante vs. Ex Post:* Justification at the time vs. result later.

  4.  **Address the Tension (Equal Claims vs. Greater Number):**
      *   This is the core philosophical knot (Scanlon vs. Utilitarianism).
      *   *The Conflict:* If every claim is equal, how can 5 outweigh 1 without saying the 5th person matters *more* or the 1st person matters *less*?
      *   *The "Most Work" Requirement:* It's likely the *Claim Individuation* combined with *Aggregation Sensitivity*.
      *   *Unsatisfiability:* Can they both hold? Many philosophers (like Scanlon) try to say yes via "tie-breaking." Others say no.
      *   *Recommendation:* If forced to surrender, surrender the strict "numbers are morally inert" view. Why? Because in a rescue, failing to save 5 when you could is harder to defend than failing to save 1. The scene loses "tragic purity" but gains "human necessity."

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the gravity. This is about *action-guiding* theory, not just academic correctness.
      *   *The Specification (Desiderata):* Group the user's requirements into logical pillars.
          *   1. The Claim Constraint (Equality of persons).
          *   2. The Aggregation Principle (Why numbers count).
          *   3. The Epistemic Limit (What can be known).
          *   4. The Action Condition (Decision under pressure).
      *   *Refining the Cases:* Ensure the specific scenarios (nested, overlapping, probability) are mapped to these pillars.
      *   *Refining the Distinctions:* Explicitly state that the theory must not collapse these.
      *   *The Conflict Analysis:* This needs to be sharp. The tension is between *Individual Justification* (I must justify my choice to the one I leave behind) and *Outcome Maximization* (I must do the most good).
      *   *The Verdict on the Camps:*
          *   Utilitarianism fails *Claim Individuation* and *Distinction between Weaker/Outweighed*.
          *   Strict Contractualism (numbers inert) fails *Aggregation Sensitivity* and *Actionability* in high-stakes rescue.
      *   *The Recommendation:* Surrender the "numbers are inert" dogma. Keep the "equal claims" intuition but allow aggregation as a tie-breaker that becomes a decider at scale.

  6.  **Self-Correction/Polishing:**
      *   *Check:* Did I give a verdict? *No.* I am specifying the theory, then analyzing the tension, then advising on which premise to drop *if* they are incompatible. The prompt asks: "If they cannot both hold, say which I should surrender." So I must take a stance on the compatibility.
      *   *Check:* Did I cover all the specific cases listed? (Nested, Overlapping, Stakes, Probability, Lottery, Self). *Yes, weave them into the desiderata.*
      *   *Check:* Is the tone right? *Needs to be authoritative but respectful of the user's philosophical literacy.*
      *   *Check:* "One line each on how the two camps fare." *Keep it tight.*

  7.  **Finalizing the Structure:**
      *   **Part I: The Specification (Desiderata).** Grouped by function (Metaphysical, Epistemic, Practical).
      *   **Part II: The Tension Analysis.** Identifying the workhorse requirement and the incompatibility.
      *   **Part III: The Recommendation.** Which premise to drop and the literary cost.
      *   **Part IV: Camp Assessment.** The one-liners.

      *(Self-Correction during drafting)*: Make sure I don't accidentally solve the trolley problem. The user wants the *specification* of a theory that *could* solve it for their character. The focus is on the *requirements* for that theory.

      *(Refining the "Equal Claims vs. Greater Number" conflict)*: The user suspects they are jointly unsatisfiable. I should validate that suspicion. If claims are truly equal and individual, adding more people shouldn't change the weight against the single person unless we aggregate. If we aggregate, we risk treating them as a mass. The "Tie-Breaker" model (Scanlon) is the usual bridge. I need to explain if that bridge holds water for a *rescue* scenario specifically. In a rescue, time is the constraint. A tie-breaker implies a tie. Is 1 vs 5 a tie? Most say no. So the "Equal Claim" premise is the one that strains.

      *(Final Polish)*: Ensure the distinction between "weaker claim" and "outweighed claim" is highlighted, as that's crucial for the character's defense. The one left behind must feel their claim was *heard*, not *ignored*.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the specification for a theory of rescue choice, structured to meet your constraints, followed by the analysis of the conflict you identified.

  ### I. The Specification (Desiderata)

  A theory adequate for your scene must satisfy five functional requirements. Each is motivated by the cases and distinctions you listed.

  **1. The Requirement of Individual Justification**
  *   **Specification:** The theory must allow the rescuer to justify the choice to the person *not* saved, without denying that person's equal moral status.
  *   **Motivating Case:** The plain one-against-five. If the theory treats the five as a aggregate mass, it fails the one. If it treats the one as having a veto, it fails the five.
  *   **Distinction Preserved:** Between a claim being *weaker* and its being *outweighed*. The one's claim must remain full-strength even if it loses.

  **2. The Requirement of Non-Worsening (Pareto Sensitivity)**
  *   **Specification:** If Option B saves everyone Option A saves, plus additional people, the theory must select B without requiring a fresh weighing of lives against lives.
  *   **Motivating Case:** The nested case (save One vs. save One + Two).
  *   **Distinction Preserved:** Between what is true of *each* of the five and what is true of the five *together*. The additional two do not outweigh the one; they simply add claims that are unopposed in the second option.

  **3. The Requirement of Epistemic Accessibility**
  *   **Specification:** The decision rule must rely only on facts available to the agent in the moment of decision, not on outcomes known only afterwards.
  *   **Motivating Case:** The probabilistic rescue (certain one vs. probable five).
  *   **Constraint Respected:** No verdict that turns on facts the rescuer cannot know.
  *   **Distinction Preserved:** Between the *ex ante* prospect and the *ex post* outcome. The justification must hold even if the van sinks anyway.

  **4. The Requirement of Severity Scaling**
  *   **Specification:** The theory must weigh the magnitude of the harm, not merely the headcount, allowing a smaller number to outweigh a larger number if the stakes differ sufficiently.
  *   **Motivating Case:** One certain death vs. five limb-losses.
  *   **Constraint Respected:** No trading of one life against a large number of small goods.
  *   **Distinction Preserved:** Between the number of claimants and the magnitude of each claim.

  **5. The Requirement of Actionable Closure**
  *   **Specification:** The theory must yield a determinate verdict when consultation and randomization are impossible.
  *   **Motivating Case:** The one-minute decision; the case where candidates propose a lottery but time forbids it.
  *   **Constraint Respected:** An answer even when no coin, no time, and no consultation are available.
  *   **Distinction Preserved:** Between the agent's obligation and the claimants' own agreement. The victims' consent is preferable but not constitutive of the right act under time pressure.

  ***

  ### II. The Tension Analysis

  **Which requirement does the most work?**
  **The Requirement of Individual Justification.** This is the engine that excludes the two camps you named. It forces the theory to explain *why* the single person can be left behind without rendering their life less valuable. Utilitarianism fails this by aggregating claims (making the one a vessel for utility); strict contractualism fails this by refusing to aggregate (making the five unable to override the one).

  **Are "Equal Claims" and "Save the Greater Number" jointly unsatisfiable?**
  Yes, if "Equal Claims" is interpreted to mean "Numbers are morally inert." If every person's claim is a veto, you cannot count. If you count, the claims are not vetoes. However, they are compatible if "Equal Claims" means "Equal *Weight* per person," allowing weight to accumulate. The incompatibility arises only if you insist that the *structure* of the claim changes when others are present.

  **Which should you surrender?**
  Surrender the dogma that **"numbers are morally inert."** Retain the intuition that **"each person's claim counts equally."**
  *   **Why:** In a rescue scenario, the duty to aid is comparative. To tell the five they die so the one's claim remains "pure" is to privilege the rescuer's moral cleanliness over the victims' survival.
  *   **What the scene loses:** It loses the tragic symmetry where either choice is equally defensible. The character cannot claim she was trapped in a logical paradox; she must admit she made a calculation. The guilt shifts from "I violated a moral law" to "I failed a specific individual despite knowing better."

  ***

  ### III. Camp Assessment

  **Utilitarianism:** Fails the Requirement of Individual Justification and collapses the distinction between a claim being weaker and being outweighed.
  **Strict Contractualism (Numbers Inert):** Fails the Requirement of Non-Worsening and the Requirement of Actionable Closure in high-stakes rescue.
