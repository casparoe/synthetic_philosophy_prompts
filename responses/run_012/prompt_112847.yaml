answer: |-
  Here is the lesson plan, designed to operationalize the tension between self-locating belief and objective chance without naming it until the end.

  ### **Session Overview**
  *   **Topic:** Decision Theory / Philosophy of Probability (Sleeping Beauty Problem)
  *   **Time:** 75 Minutes
  *   **Students:** 14
  *   **Goal:** Force a conflict between "objective chance" pricing and "betting frequency" pricing through a two-configuration market game.
  *   **Materials:**
      *   1 Opaque bag with 4 chips (1 Red = Heads, 3 Blue = Tails).
      *   14 Blindfolds (or large sunglasses).
      *   Token economy (poker chips or candy). Each student starts with 20 tokens.
      *   Bet Slips (pre-printed, 3 per student).
      *   Auditor Tally Sheets (carbon copy or duplicate sheets).
      *   4 "Booths" (corners of the room or desks facing the wall).

  ---

  ### **1. Roles & Setup (0:00 – 0:10)**
  Divide the class silently. Hand out role cards.
  *   **Bankers (4 students):** Sit at the front. They make the market.
  *   **Auditors (4 students):** Sit to the side. They record data. They are the only ones allowed to see the coin chip *and* the bet slips together.
  *   **Sleepers (6 students):** Sit in the "Booths." They are the bettors.

  **The Rules (Read aloud, no questions on theory):**
  1.  **The Coin:** I will draw a chip from the bag. Red (Heads) is 1/4 probability. Blue (Tails) is 3/4.
  2.  **The Price:** Bankers must agree on **one single price** ($P$) for "Heads." This price applies to *both* Round 1 and Round 2. $P$ must be between 0 and 1.
      *   If a Sleeper **Buys**, they pay the Banker $P$ tokens. If Heads, Banker pays Sleeper 1 token.
      *   If a Sleeper **Sells**, they receive $P$ tokens from the Banker. If Heads, Sleeper pays Banker 1 token.
      *   Bankers *must* accept either side at the posted price. No spreads.
  3.  **The Awakening:** Sleepers will be blindfolded.
      *   If **Heads**: A Sleeper is woken **once**.
      *   If **Tails**: A Sleeper is woken **twice**.
      *   "Woken" means I tap their shoulder. They submit one bet slip. They put their head down. I wait 30 seconds. I tap them again (if Tails). They submit another slip.
      *   Sleepers receive no information about which "wake" this is.
  4.  **The Configurations:**
      *   **Round 1 (Accumulator):** Every slip submitted counts. (If Tails, Banker processes 2 bets).
      *   **Round 2 (Capped):** Only **one** slip per Experiment counts. (If Tails and two slips are submitted, the Auditor randomly selects one to count; the other is voided).
  5.  **Settlement:** Auditors tally the valid slips against the coin outcome. Bankers pay/receive tokens based on the tally.

  **Instructor Note:** Do not explain *why* there are two rounds. Do not explain *why* Tails gets two wakes. Just enforce the procedure.

  ---

  ### **2. The Market & Commitment (0:10 – 0:20)**
  *   **Banker Deliberation:** The 4 Bankers have 5 minutes to agree on **The Price**.
      *   *Constraint:* They cannot change this price between Round 1 and Round 2.
      *   *Pressure:* Remind them their personal token stash is on the line.
  *   **Public Posting:** Write the agreed Price on the board. (Expect something near 0.25 or 0.15).
  *   **Sleeper Prep:** Sleepers put on blindfolds. Auditors get their tally sheets (columns: Experiment #, Coin, Slip ID, Buy/Sell, Round 1 Valid?, Round 2 Valid?).

  ---

  ### **3. Game Play (0:20 – 0:45)**
  *   **Round 1 (Accumulator):**
      *   Run 10 Experiments. (Draw chip -> Wake Sleepers -> Collect Slips).
      *   *Pacing:* Keep it brisk. Heads = 1 tap. Tails = 2 taps (30 sec apart).
      *   Auditors mark all slips as **Valid** for Round 1.
  *   **Round 2 (Capped):**
      *   Run 10 *new* Experiments (fresh chip draws).
      *   Same waking procedure.
      *   Auditors mark slips for Round 2. **Crucial:** If an Experiment is Tails (2 slips), the Auditor rolls a die to select which single slip counts for Round 2. The other is marked **Void**.
  *   **Settlement:**
      *   Auditors sum the Bankers' P&L for Round 1.
      *   Auditors sum the Bankers' P&L for Round 2.
      *   Write the two totals on the board.

  ---

  ### **4. The Reveal & Confusion (0:45 – 0:55)**
  *   **Token Count:** Have Bankers count their final stacks.
  *   **The Likely Outcome:**
      *   If Price $\approx$ 0.25 (Halfer): Bankers likely lost tokens in Round 1 (Accumulator), broke even/profited in Round 2.
      *   If Price $\approx$ 0.14 (Thirder): Bankers likely profited in Round 1, lost tokens in Round 2.
      *   *Ideally:* One round shows a significant loss for the Bankers.
  *   **Open Floor:** Ask only: "What happened?" Let them argue about the rules, the bias, and the counting. Do not intervene with theory.

  ---

  ### **5. Debrief & Mapping (0:55 – 1:15)**
  *   **Step 1: The Tally Sheet.** Project an Auditor's sheet. Show the raw frequency.
      *   *Point out:* "In Round 1, there were roughly 3x more Tails slips than Heads slips. In Round 2, the slips were 1:1 with the experiments."
  *   **Step 2: The Banker's Dilemma.** Ask the Bankers: "If you could do it again, would you change the price?"
      *   They will say yes. "We needed a lower price for Round 1 and a higher price for Round 2."
      *   *Ask:* "But the coin didn't change. The bag was the same. Why did the fair price change?"
  *   **Step 3: Naming the Positions.**
      *   Introduce **Sleeping Beauty**.
      *   **The Thirder (Round 1 Logic):** "I care about how many times I am asked to bet. My credence should match my betting odds in the Accumulator."
      *   **The Halfer (Round 2 Logic):** "I care about the coin. The rule about counting slips is just a bookkeeping trick. My credence should match the objective chance."
  *   **Step 4: The Halfer's Strongest Point.**
      *   Address the students who felt Round 2 was the "real" test.
      *   *Say:* "The Halfer argues that *credence* is not *betting strategy*. You can believe the coin is 1/4 Heads (Credence) but acknowledge you will be bet against twice as often on Tails (Betting Odds). The Capped Round isolates Credence. The Accumulator Round conflates Credence with Decision Theory."
  *   **Step 5: The Evidence.**
      *   Ask: "When you woke up, did you learn anything?"
      *   If they say "No," press: "Then why did the betting frequency change?"
      *   Map this to the *Self-Locating Belief* dispute. "I am awake now" is evidence for Tails in the Accumulator, but not in the Capped version.

  ---

  ### **Predictable Failure Modes & Fixes**

  **1. The "Incoherent Drug" Objection**
  *   **Symptom:** A Sleeper says, "This is stupid, I know I'm in a classroom. I know when you tapped me twice. The amnesia is fake."
  *   **Fix:** Acknowledge it immediately. "You are right. The drug doesn't exist. But the *rule* exists. The Auditor voided your second slip in Round 2 not because you forgot, but because the *contract* said so. We are testing the logic of the contract, not the pharmacology."

  **2. The Banker Hedge**
  *   **Symptom:** Bankers try to post "0.20 to Buy, 0.30 to Sell" to avoid risk.
  *   **Fix:** Enforce the rule ruthlessly. "One number. You take either side. If you can't agree, you forfeit 5 tokens from your starting stash." This forces them to operationalize their belief.

  **3. Retroactive Bet Changing**
  *   **Symptom:** After seeing the tally, a Sleeper says, "In Round 2, I meant for my second slip to be the voided one."
  *   **Fix:** The Auditor's sheet is final. "The slip was timestamped. The rule was random selection. You cannot edit history." This reinforces that the *structure* dictates the payoff, not the intent.

  ---

  ### **Honest Limitations: What This Activity Cannot Do**

  Be explicit with your students about the following during the debrief. This game is a model, not a replication.

  1.  **It Cannot Replicate First-Person Amnesia.**
      *   *Truth:* Your students know they are students in a seminar. They know time is passing. The "wakes" are procedural, not phenomenological.
      *   *Consequence:* They will treat the "Tails = 2 wakes" rule as an external penalty/bonus structure, not as a shift in their own epistemic location. They will feel like they are playing a game with weird rules, not experiencing a shift in reality.
      *   *Your Job:* You must supply the philosophical bridge. "Imagine you *actually* forgot. Imagine the second wake felt exactly like the first. Then the 'Accumulator' loss feels like a mistake in reasoning, not just a bad bet."

  2.  **The Auditors Have God's-Eye View.**
      *   *Truth:* The Auditors see the coin *and* the slips. The Sleepers do not.
      *   *Consequence:* The puzzle for the Sleepers is about decision-making under ignorance. The puzzle for the Auditors is just arithmetic. The "mystery" of the puzzle lives in the Sleeper's chair, but the *data* lives in the Auditor's chair.
      *   *Your Job:* Point out that Sleeping Beauty is unique because she is both Sleeper and Auditor. She knows the experimental setup (Auditor knowledge) but experiences the wakes (Sleeper knowledge). The game splits these roles; the philosophy merges them.

  3.  **It Privileges Decision Theory over Doxastic States.**
      *   *Truth:* The game measures *profit*, not *belief*.
      *   *Consequence:* A student can say, "I believe the coin is 1/4 Heads, but I'll bet as if it's 1/7 to maximize profit." This is a valid Thirder move in the game, but it sidesteps the core philosophical question: "What is your *credence*?"
      *   *Your Job:* Use the "Capped Round" to pry these apart. "In Round 2, if you bet 1/7 but believed 1/4, you left money on the table. Why? Because in Round 2, Betting Odds = Credence. In Round 1, they diverge. The debate is about whether they *should* diverge in the real problem."

  ### **Instructor Cheat Sheet: The Math**
  *   **Bias:** $P(H) = 1/4$, $P(T) = 3/4$.
  *   **Halfer Price:** $0.25$. (Based on Coin).
  *   **Thirder Price:** $1/7 \approx 0.14$. (Based on Awakenings: $1H : 2T \rightarrow 1(1/4) : 2(3/4) \rightarrow 1/4 : 6/4 \rightarrow 1:6 \rightarrow P(H) = 1/7$).
  *   **Round 1 (Accumulator):** Fair Price is $1/7$. If Banker posts $0.25$, Sleepers should **Sell** (Bet Tails). Banker loses.
  *   **Round 2 (Capped):** Fair Price is $0.25$. If Banker posts $1/7$, Sleepers should **Buy** (Bet Heads). Banker loses.
  *   **The Trap:** One Price cannot win both rounds. This proves that *Self-Locating Information* changes the betting value of the evidence, even if the objective chance remains constant.
