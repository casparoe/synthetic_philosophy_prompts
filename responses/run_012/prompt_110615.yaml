answer: |-
  'So,' Mark said, leaning on the doorframe with that smirk he gets when he thinks he's found a loophole. 'If I play this thing, am I gonna be rich or bankrupt?'

  Sara stirred her tea, not looking up. 'Technically? Both. Depends on the order you count the outcomes.'

  'Come again?'

  'The expected value is conditionally convergent. Chronologically, it's worth minus sixty-nine pence. But I can rearrange the terms to make it sum to anything. A million quid. Minus infinity. Whatever.'

  Mark smirked. 'So it's a magic money tree?'

  'Only if you're allowed to shuffle reality,' Sara said. 'It's the only game where you rig the odds just by changing the addition order. Basically, mathematical gaslighting.'

  'So what you're saying is,' Mark said, 'it's exactly like an expense claim?'

  Sara laughed. 'Pretty much. Except HMRC dont accept the Riemann rearrangement theorem as valid accounting. Which is a shame, I couldve cleared my overdraft.'
