answer: |-
  # The Prediction Market: A Dennett Seminar Lab

  ## 1. Setup & Materials
  *   **Room:** Flat floor, chairs movable. Arrange into 5 pods (4 teams of 4, 1 team of 2—or 6 teams of 3).
  *   **Tech:** Projector + Sound. A simple timer visible to all (e.g., `timer.video`).
  *   **Handouts:** One "Prediction Sheet" per team per round (or a shared Google Doc if they have laptops). Columns: *Round #, Prediction (Next 3 States), Rule (Max 25 Words), Confidence (1-5)*.
  *   **Whiteboard:** For keeping the "Market Score" (Team Points).

  ## 2. The Rules (Read these aloud, do not distribute text yet)
  "We are running a Prediction Market. You are competing against the Black Box.
  1.  **Observe:** I will show you a system behaving. You will see a sequence of states.
  2.  **Predict:** You must file the next **three** states/outputs.
  3.  **Compress:** You must write the **rule** you used. **Max 25 words.** No diagrams.
  4.  **Score:**
      *   **+2 Points** for every correct prediction.
      *   **+5 Points (The Liquidity Bonus):** If I pick a rival team and they can generate your predictions using *only* your rule within 30 seconds. (This proves your pattern is 'real' and not just luck).
      *   **-1 Point** for every word over the limit.
  5.  **Silence:** No talking between pods during observation."

  ## 3. Timeline (90 Minutes Hard Stop)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Grouping** | Move chairs. Explain rules. Emphasize the 25-word limit. |
  | **05-15** | **Round 1: The Physics** | Game of Life (Complex). |
  | **15-25** | **Round 2: The Machine** | Vending Machine Logic. |
  | **25-35** | **Round 3: The Critter** | Goal-seeking agent. |
  | **35-45** | **Round 4: The Moth** | Maladaptive spiral. |
  | **45-50** | **Tally & Reset** | Calculate scores. Clear boards. **Do not explain yet.** |
  | **50-90** | **The Debrief** | The philosophical payoff (Script below). |

  ## 4. The Rounds (Stimuli & Hidden Truths)
  *Instructor Note: You need to prep these visuals beforehand. Simple animations or videos work best.*

  **Round 1: The Physical (Conway's Game of Life)**
  *   **Visual:** A 20x20 grid. Show generations 1–5. The pattern is a "Random Noise" cluster that evolves chaotically (not a clean glider).
  *   **Hidden Truth:** It is purely deterministic cell-update rules.
  *   **The Trap:** To predict perfectly, you must calculate every cell (Physical Stance). Any "goal" language ("it wants to expand") will fail prediction or bloat the word count.
  *   **Winning Rule:** "Apply B3/S23 rule to each cell based on 8 neighbors." (Hard to do mentally, but the only valid *Physical* rule). *Alternative:* If you use a Glider, the Intentional Stance wins ("It moves diagonally"). **Recommendation:** Use a **Chaotic Cloud**. It forces the Physical Stance and shows its computational cost (low accuracy/high effort).

  **Round 2: The Design (The Vending Machine)**
  *   **Visual:** Inputs: `A1`, `A2`, `B1`. Outputs: `Snickers`, `Chips`, `Error`. Show 5 transactions. One transaction shows `A1` pressed twice -> `Error`.
  *   **Hidden Truth:** It has a function/spec.
  *   **The Trap:** Physical description ("electricity flows") is too long. Intentional ("it wants to give snacks") is vague.
  *   **Winning Rule:** "Map Input Code to Item Slot. If Input Invalid or Double-Press, Output Error." (Design Stance).

  **Round 3: The Intentional (The Hungry Bug)**
  *   **Visual:** A dot (bug) in a maze. Two food sources appear. The dot moves toward the *closest* one. If blocked, it finds a path.
  *   **Hidden Truth:** Simple heuristic algorithm (A* pathfinding or similar).
  *   **The Trap:** Describing the algorithm exceeds 25 words. Describing physics is impossible.
  *   **Winning Rule:** "It tries to minimize distance to the nearest food source, avoiding walls." (Intentional Stance). This is short, predictive, and exportable (+5 pts).

  **Round 4: The Imposter (The Moth)**
  *   **Visual:** A dot spiraling tighter and tighter into a central point (flame).
  *   **Hidden Truth:** Transverse orientation (keeping light at a fixed angle). Works for moon (parallel rays), fails for point source (spiral).
  *   **The Trap:** "It wants to reach the light" predicts the approach but fails to predict the *spiral* destruction (why doesn't it stop?).
  *   **Winning Rule:** "Maintain constant angle to light source." (Physical/Mechanism) OR "It mistakenly treats the flame as the moon." (Intentional with error theory).
  *   **Lesson:** The Intentional Stance works *locally* (it moves toward light) but fails *globally* (it burns).

  ## 5. The Debrief Script (40 Minutes)
  *Do not write "Dennett" on the board until minute 60.*

  **Phase 1: The Data (50-60 min)**
  1.  **Ask:** "Look at your Round 1 rules. How many of you used words like 'try,' 'want,' or 'goal'?" (Likely few). "Why not?" (Didn't work, too vague).
  2.  **Ask:** "Round 3. How many used 'want' or 'try'?" (Likely many). "Why did that work here when it failed in Round 1?"
  3.  **Ask:** "Who got the +5 Liquidity Bonus? What made your rule usable by another team?"
      *   *Key Insight:* If another team can use your rule to predict, the pattern isn't just in your head. It's **Real**.

  **Phase 2: The Reveal (60-70 min)**
  *Write on Board: **Physical | Design | Intentional**.*
  "Daniel Dennett calls these **Stances**. They aren't claims about what is *inside* the box. They are bets on which compression algorithm buys you the most prediction per word."
  *   **Round 1 (Physical):** You bet on micro-physics. High cost, high precision (theoretically).
  *   **Round 2 (Design):** You bet on function. You ignored the electronics, focused on the spec.
  *   **Round 3 (Intentional):** You bet on rationality. You treated the bug as a believer/desirer. It was the most efficient compression.
  *   **Round 4 (The Moth):** The Intentional Stance ('It wants the light') worked until it killed the moth. The pattern was real enough to predict the approach, but the *mechanism* broke the goal.

  **Phase 3: Real Patterns (70-85 min)**
  "The +5 Bonus was the 'Real Pattern' test. Dennett argues beliefs and desires are real *if* the pattern of behavior they predict is robust and exportable.
  *   If you can predict the bug's movement by saying 'it wants food,' and your rival can use that same sentence to predict the next turn, then 'wanting food' is as real as 'voltage.'
  *   It is not a ghost in the machine. It is a **compression success**."

  **Phase 4: Q&A (85-90 min)**

  ## 6. Honest Section 1: Predictable Failures & Fixes

  **1. The Anthropomorphism Glitch (Round 1)**
  *   **Failure:** Students will write "The cells want to survive" for the Game of Life.
  *   **Why:** It's a habit.
  *   **Fix:** In the scoring, challenge this ruthlessly. "Does 'want to survive' predict *which* cells die in Generation 6? No? Then it's poetry, not a rule. -2 Points." Enforce the *predictive cash value* of the words.

  **2. The Time Sink (Scoring)**
  *   **Failure:** Checking the +5 Liquidity Bonus for every team takes forever.
  *   **Fix:** Only check the Liquidity Bonus for the **top two** scoring teams per round. Or, during the debrief, ask Team A: "Could you have used Team B's rule?" If yes, award the points retroactively. Keep the game moving.

  **3. The "Cheat" (Round 3)**
  *   **Failure:** A team figures out the exact algorithm (e.g., "A* Search") and writes it down.
  *   **Why:** CS majors in the room.
  *   **Fix:** The 25-word limit usually blocks this. If they manage it, award the points but highlight in debrief: "You used the Design Stance on an Intentional system. It worked, but was it efficient compared to 'It wants food'?"

  ## 7. Honest Section 2: Philosophical Limitations

  **1. The Normativity Gap (The Big One)**
  *   **The Limit:** This game measures *predictive success* (what the system *will* do). Dennett's Intentional Stance relies heavily on *normativity* (what the system *ought* to do if it were rational).
  *   **Why it matters:** In the game, if the bug walks into a wall, the "It wants food" rule fails. In Dennett's theory, we say "It *wanted* food, but had a *false belief* about the wall." The game doesn't easily capture the "false belief" nuance without expanding the word count.
  *   **Your Move:** In the debrief, explicitly state: "We measured prediction. Dennett adds **Rationality**. We assume the agent *should* have taken the best path. If it didn't, we posit a belief error. That normative leap is what turns a heuristic into a 'Mind'."

  **2. The Realism Dispute**
  *   **The Limit:** The game proves that intentional talk is *useful*. It does not prove that beliefs are *ontologically real* in the same way atoms are. A skeptic can say, "It's just a useful fiction."
  *   **Why it matters:** The +5 Bonus tries to address this (if it's exportable, it's real), but instrumentalism vs. realism is a deeper metaphysical cut.
  *   **Your Move:** Be blunt. "This game demonstrates **Instrumental Realism**. The pattern is real *relative to the predictive strategy*. Dennett thinks that's all 'realness' ever amounts to. If you think atoms are also just useful predictive patterns, you're on board. If not, you have work to do."

  **3. Dead Air Risk**
  *   **The Risk:** Round 1 (Game of Life) might be boring if the pattern is too chaotic. Students will disengage.
  *   **Fix:** Ensure Round 1 has *some* structure (e.g., a pulsar or a known oscillator) so they feel the frustration of the Physical Stance (calculating cells) vs the ease of the Design Stance ("It's a pulsar, it blinks"). If it's pure noise, they'll just guess. **Better:** Use a **Double Pendulum Video**. It is mesmerizing, clearly physical, and impossible to predict without heavy computation. It creates a visceral feeling of "Physical Stance is too hard."

  ## Final Blunt Advice
  *   **Word Count is King:** If you let them slide on the 25-word limit, the lesson fails. The constraint *is* the philosophy. It forces them to feel the "cost" of the stance.
  *   **Don't Save Them:** If they fail Round 3, let them fail. The frustration of trying to describe a goal-seeking agent using only physical terms ("The pixel at x,y moves to x+1...") is the exact feeling Dennett wants them to have.
  *   **The Moth is the Closer:** Spend the most debrief time on Round 4. That is where the "Intentional Stance" reveals its fragility. It's not magic; it's a hack that works until the environment changes. That is the condition of having a mind.
