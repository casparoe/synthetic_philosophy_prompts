prompt: |-
  I am a distributed-systems engineer. My working vocabulary is message passing over unreliable channels, local states and views, partial failure, two-phase commit, agreement and consensus protocols, the coordinated-attack scenario, and the gap between what a node knows locally and what is true of the system as a whole. I have no formal training in game theory, but I am fluent in the protocol vocabulary and I think in it.

  I want you to take the core of epistemic game theory as it is built on common knowledge — the notion of common knowledge itself, including its infinite hierarchy (I know that you know that I know …); the result that common knowledge of one another's beliefs forces agreement; and the appeal to common knowledge of rationality to characterize equilibrium and to generate the backward-induction puzzles — and restate it, as faithfully as you can, in my vocabulary. Treat this as a genuine translation rather than an analogy: for each epistemic notion, give the nearest protocol-level notion, and say explicitly where the nearest notion is a distortion rather than an equivalent.

  Then give me the residue report. Which claims carry over intact, which carry over only after being bent to fit (and describe how they bend), and which have no counterpart in my vocabulary at all? I am especially interested in whether "rationality" and the possible-worlds semantics of knowledge — what an agent would know or do in counterfactual states, not merely the states actually realized — can be expressed at all in terms of protocol states and message histories, or whether they are doing work my vocabulary cannot represent.

  Finally, tell me what the residue indicates. Is the untranslatable remainder a defect of my framework, something distributed systems ought to be able to say and cannot, or is it a sign that the game-theoretic formulation carries assumptions less determinate than they appear? I would accept the verdict that my vocabulary is the impoverished one if that is the honest reading, but I want the verdict argued rather than assumed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Distributed-systems engineer. Fluent in message passing, unreliable channels, local states/views, partial failure, 2PC, consensus, coordinated attack, local vs. global truth. *No* formal game theory training. Thinks in protocols.
      *   **Task:** Translate core epistemic game theory (common knowledge, infinite hierarchy, agreement theorems, common knowledge of rationality, backward induction) into distributed systems vocabulary.
      *   **Constraint:** Treat as a *genuine translation*, not an analogy. Identify distortions explicitly.
      *   **Deliverables:**
          1.  Translation of core concepts (Common Knowledge, Agreement, Rationality/Equilibrium).
          2.  Residue Report (What carries over intact, what bends, what has no counterpart).
          3.  Verdict/Analysis (Is the DS framework impoverished, or is GT carrying hidden assumptions?).
      *   **Tone:** Technical, precise, respectful of the user's expertise, philosophical but grounded in engineering reality.

  2.  **Deconstruct Epistemic Game Theory Concepts:**
      *   *Common Knowledge (CK):* Everyone knows $X$, everyone knows everyone knows $X$, ad infinitum.
      *   *Agreement Theorem (Aumann):* If agents have common priors and their posteriors are common knowledge, they cannot agree to disagree.
      *   *Common Knowledge of Rationality (CKR):* Everyone is rational, everyone knows everyone is rational, etc. Leads to Nash Equilibrium or Backward Induction.
      *   *Possible Worlds Semantics:* Knowledge is defined over a set of reachable states (Kripke structures). Counterfactuals matter ("What would I do if...").

  3.  **Map to Distributed Systems (DS) Vocabulary:**
      *   *Agent* $\rightarrow$ Node/Process.
      *   *State* $\rightarrow$ Local State + Message Log.
      *   *Knowledge* $\rightarrow$ Derived from Local State (view).
      *   *Communication* $\rightarrow$ Message Passing (sync/async, reliable/unreliable).
      *   *Common Knowledge* $\rightarrow$ Consensus/Coordinated Commit. (Crucial distinction: CK is impossible in async systems with failures).
      *   *Rationality* $\rightarrow$ Protocol Compliance / Correctness.
      *   *Equilibrium* $\rightarrow$ Stable State / Termination.
      *   *Possible Worlds* $\rightarrow$ Reachable Global States / Execution Histories.

  4.  **Drafting the Translation (Iterative Process):**

      *   *Concept 1: Common Knowledge.*
          *   DS Equivalent: Consensus on a value, or "Global Predicate Detection."
          *   Distortion: In DS, we usually settle for *eventual* consistency or *approximate* common knowledge (epsilon-common knowledge). True CK is impossible with unreliable channels (Coordinated Attack Problem).
          *   Translation: "Global Invariant visible to all non-faulty nodes."

      *   *Concept 2: Infinite Hierarchy.*
          *   DS Equivalent: Acknowledgement chains. ACK, ACK-ACK, ACK-ACK-ACK...
          *   Distortion: In DS, this chain never terminates in finite time over unreliable links. In GT, it's a logical state, not a temporal process.
          *   Translation: "Unbounded Acknowledgement Depth."

      *   *Concept 3: Agreement Theorem.*
          *   DS Equivalent: Consensus Safety. If two nodes decide, they decide the same value.
          *   Distortion: Aumann assumes truthful sharing of posteriors. DS assumes nodes might lie (Byzantine) or just be silent (Crash). DS focuses on *achieving* agreement despite failures; GT focuses on *impossibility of disagreement* given shared info.
          *   Translation: "Safety Property of Consensus."

      *   *Concept 4: Rationality & Equilibrium.*
          *   DS Equivalent: Protocol Compliance. A node follows the spec.
          *   Distortion: "Rationality" implies optimization of utility. "Compliance" implies following rules. A rational node might deviate if it benefits them (Byzantine/Game-theoretic distributed systems). Standard DS assumes "correct" or "faulty," not "selfish."
          *   Translation: "Adherence to Protocol Specification."

      *   *Concept 5: Possible Worlds/Counterfactuals.*
          *   DS Equivalent: The set of all possible execution traces consistent with the local log.
          *   Distortion: DS usually reasons about *actual* runs for liveness, but safety relies on *all possible* runs. This maps well to Kripke structures.
          *   Translation: "Consistent Global Snapshots / Reachable State Space."

  5.  **Developing the Residue Report:**
      *   *Intact:* Possible worlds semantics (maps to execution histories), Knowledge as local state derivation.
      *   *Bent:* Common Knowledge (becomes Consensus, but loses the logical immediacy), Rationality (becomes Compliance, loses utility optimization).
      *   *Missing:* Utility functions, Strategic deviation (unless modeling Byzantine), The *normative* force of rationality (why *should* I do this?).

  6.  **Formulating the Verdict:**
      *   Is DS impoverished? Not necessarily. DS is *operational*; GT is *declarative/normative*.
      *   DS handles the *mechanism* of information flow. GT handles the *implication* of information content on decision-making.
      *   The "untranslatable" part is *motivation*. DS says "If you run this code, this happens." GT says "If you want to win, you *must* run this code."
      *   The "Common Knowledge is impossible" result in DS (Coordinated Attack) is actually a stronger, more physical version of the GT logical constraints.
      *   Conclusion: DS vocabulary is more concrete about *causality* and *time*, while GT is more abstract about *information* and *inference*. The residue isn't a defect; it's a difference in focus (mechanism vs. incentive). However, regarding *counterfactuals*, DS *can* express them via state-space exploration, but rarely does so explicitly in runtime.

  7.  **Refining the Tone:**
      *   Avoid condescension.
      *   Use specific DS terms (FIFO, Byzantine, FLP, Kripke structures vs. Run-based models).
      *   Acknowledge the Halpern-Moses work (they bridge exactly this gap).
      *   Ensure the distinction between "Knowledge" (S5 logic) and "Belief" is handled carefully (DS usually deals with truth, not belief, unless Byzantine).

  8.  **Self-Correction/Edge Case Check:**
      *   *Did I address Backward Induction?* Need to map this to protocol verification or recursive type checking. Actually, it maps better to "Assumption about future protocol states."
      *   *Did I address Counterfactuals?* DS engineers think about "what if this message was lost." That *is* counterfactual reasoning over the set of possible runs. I need to make sure I validate that this *does* exist in DS vocabulary (safety proofs).
      *   *Rationality:* This is the biggest gap. DS assumes "correct" nodes follow the protocol. GT asks "Will they?" I need to highlight the "Barter" vs. "Command" distinction.

  9.  **Final Polish:** Structure into the requested sections: Translation, Residue Report, Verdict. (Proceed to generate output based on these thoughts).

  *(Self-Correction during drafting)*: I must be careful not to say Common Knowledge is *exactly* Consensus. Consensus is an *action* (deciding a value). Common Knowledge is a *state of mind* (knowing). In DS, achieving Consensus *creates* Common Knowledge (roughly), but the Coordinated Attack problem proves you can't get perfect CK. I need to be precise there. Halpern and Moses "Knowledge and Common Knowledge in a Distributed Environment" is the canonical reference here. I will implicitly rely on that framework.

  *(Refining Rationality)*: In DS, a node that deviates is "Byzantine." In GT, a node that deviates is "Rational." This is a semantic inversion. I need to highlight this clash. In DS, deviation is a failure mode. In GT, deviation is the expected behavior if incentives align.

  *(Refining Counterfactuals)*: DS safety proofs *are* counterfactual. "For all possible message orderings..." This maps directly to Possible Worlds. I should affirm this strength.

  10. **Finalizing the Output Structure:**
      *   **Part 1: The Translation Table.** (Concept -> DS Equivalent -> Distortion).
      *   **Part 2: The Residue Report.** (Intact, Bent, Missing).
      *   **Part 3: The Verdict.** (Impoverishment vs. Abstraction).

