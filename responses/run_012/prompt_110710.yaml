answer: |-
  **Brainstorm: Candidate Identity Conditions**

  *   **Topology (holes/lines):** Fails on single-story vs. double-story 'a' (different topology, same letter). Fails on smudged photocopy (hole closes, becomes 'd').
  *   **Stroke Count/Order:** Fails on sans-serif vs. script (continuous line vs. constructed).
  *   **Contrast Space (position relative to 'b', 'o'):** Fails on isolated glyphs or two-letter scripts where identity is purely differential.
  *   **Function (phonemic role):** Fails on decorative fonts or unreadable marks treated as letters.
  *   **Community Use:** Fails on unseen font file glyphs (exist structurally but lack users).
  *   **Genealogy (historical descent):** Fails on independent invention or radical redesign that breaks historical chain but retains recognition.
  *   **Abstract Skeleton:** Hard to formalize; risks being post-hoc description rather than explanation.
  *   **AI "Spirit" (Latent Space):** Suggests a statistical essence; bridges structure and usage but ontologically vague.

  ***

  **Adversarial Collaboration: The Ontology of the 'a'**

  **1. Agreed Claims**
  Both camps accept the following constraints on any viable theory of letterform identity:
  1.  **Token/Type Distinction:** There is a difference between a specific ink mark (token) and the category it instantiates (type). Disagreement concerns the nature of the type, not the existence of the distinction.
  2.  **Systematicity:** A letterform cannot be identified in total isolation from a system. Even the Essentialist accepts that an 'a' is defined partly by not being a 'd'; the Practitioner accepts that system rules constrain individual recognition.
  3.  **Fallibility:** Competent readers can misidentify letters. Neither camp believes majority vote *makes* truth, though they disagree on what the truth consists in.
  4.  **Bounded Variation:** There are limits. A straight vertical line cannot be an 'a' in the Latin script, regardless of structural theory or community decree. Both sides accept a "zone of impossibility."

  **2. Disagreements**

  | Question | Essentialist Answer | Practitioner Answer |
  | :--- | :--- | :--- |
  | **What fixes identity?** | An abstract, style-independent structural skeleton (geometric/topological invariants). | Participation in a socially maintained practice of reading/writing. |
  | **Unseen Font Glyph** | It is an 'a' immediately upon encoding, based on its vector structure. | It is a potential 'a' only; identity requires actual uptake by a reading community. |
  | **Single vs. Double Story** | They share a deep structural kernel; surface topology is accidental variation. | They are distinct forms unified only by functional equivalence in specific contexts. |
  | **Modal Space** | 'a' could not have looked like our 'e' without ceasing to be 'a'. | 'a' could have been anything, provided the community shifted its usage accordingly. |
  | **The Smudged Photocopy** | There is a fact of the matter where the structure breaks, even if unknowable. | Identity is graded; it is an 'a' to the degree it is treated as one in context. |

  **3. The Cruxes**
  Settling these sub-questions would force movement in at least one camp.

  *   **The AI "Spirit" Case:** An AI generates a font where every glyph is recognizably itself and recognizably part of the same family, yet no human has seen it.
      *   *Argument:* Does the consistency reside in the latent space (Essentialist) or in the statistical mimicry of human practice (Practitioner)?
      *   *Prediction:* Essentialists claim the latent vector *is* the skeleton. Practitioners claim the vector is merely a compression of prior usage data; without new users, it is dead code.
  *   **The Modal Shift:** Could the letter currently serving the phoneme /æ/ have taken the shape of our current 'e'?
      *   *Argument:* If history had shifted, would the shape we call 'e' be an 'a'?
      *   *Prediction:* Essentialists say no (shape carries identity). Practitioners say yes (function carries identity; shape is arbitrary).
  *   **The Community Squiggle:** A community agrees to read a triangle as 'a', breaking all structural generalizations.
      *   *Argument:* Does convention override structure?
      *   *Prediction:* Essentialists must argue the triangle is a new symbol mapped to 'a', not an 'a' itself. Practitioners argue it is now an 'a' full stop.

  **4. Verbal vs. Genuine Dispute**
  Much of the friction is verbal, stemming from divergent uses of "letter."
  *   **Verbal:** When discussing the **Unseen Font Glyph**, the Essentialist refers to the *design specification*, while the Practitioner refers to the *communicative tool*. If we distinguish "design-type" from "use-type," this dissolves. Similarly, regarding **Cyrillic vs. Latin 'a'**: if "letter" means "grapheme class," they are distinct; if "letter" means "visual form," they are identical. Clarifying the level of abstraction resolves the tension.
  *   **Genuine:** The **Modal Shift** and the **Smudged Photocopy** reveal a metaphysical rift. The Essentialist believes there are mind-independent facts about form categories (Platonism about shapes). The Practitioner believes categories are tools forged by use (Pragmatism). No terminological tweak settles whether 'a' *could* have been shaped like 'e'. This is a genuine dispute about whether concepts discover or create their boundaries.

  **5. Conclusion**
  The Essentialist seeks the invariant; the Practitioner seeks the invariant *use*. The AI font project highlights the gap: the machine finds structural consistency (Essentialist win), but without readers, it lacks meaning (Practitioner win). The residual disagreement is exact: does the skeleton exist prior to the flesh, or does the flesh conjure the skeleton?
