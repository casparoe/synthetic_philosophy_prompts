answer: |-
  So a player stands up and says, "This rule says it needs unanimity to pass, but we passed it by majority. It's void."
  I say, "I'm the Chair. I say it's valid."
  He says, "But your power comes from the rules, and this rule changed the rules!"
  I say, "Wait. If I agree with you, I'm using my power to destroy the source of my power."
  He says, "Exactly."
  I say, "So I can't."
  He says, "So what is it?"
  I say, "It's law. Because if it weren't, I wouldn't have the authority to say it isn't."

  This turns on the paradox that the authority to interpret the rules depends on the validity of the rules being interpreted.
