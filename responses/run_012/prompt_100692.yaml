          *   *Idea:* When calculating confirmation, we don't use the *current* $P(E)=1$. We use the $P(E)$ *before* we learned $E$, or a hypothetical $P(E)$ where we don't know $E$ but know the background $B$.
          *   *Mechanism:* $P(H | E \& B)$ vs $P(H | B)$. We treat $E$ as "new" relative to the background theory, even if historically old.
