answer: |-
  You have independently rediscovered one of the most famous headaches in the philosophy of science: **The Problem of Old Evidence.** It was formalized by Clark Glymour in the 1980s, specifically using your Example (6): General Relativity and the perihelion of Mercury.

  You are correct that (1) and (2) are the engine of Bayesianism. If you break those, you aren't doing Bayes. You are also right to be suspicious of the "never be 100% sure" dodge (often called *Jeffrey Conditioning*). While technically viable, it often feels like telling a starving man to just eat less to solve his digestion problem. It sidesteps the structural issue of how *known* facts support *new* theories.

  The slide happens at **(3)**, but not for the reason you might think. It's not that you shouldn't be certain; it's that **confirmation is a measure of *change*, not a property of *state*.**

  Here is the price list for the three main ways to escape the trap, ranked from "least costly" to "most philosophically expensive."

  ---

  ### Option 1: The Temporal Cut (Reject the applicability of 3)
  **The Move:** You keep $P(E)=1$ for your current state, but you deny that confirmation is calculated using your *current* probability function. Confirmation is inherently temporal. To ask "Does $E$ confirm $H$?" is to ask "Did learning $E$ raise the probability of $H$?"

  If you already know $E$, you cannot update on $E$ again. The "confirmatory power" of $E$ was expended at the moment $E$ went from unknown to known.

  To evaluate GR and Mercury, you must reconstruct the **counterfactual prior**. You ask: "What was my probability for Mercury's perihelion *before* I accepted GR, but *after* I knew the data?"
  *   $P_{prior}(E) \approx 1$ (The data was old).
  *   $P_{prior}(H)$ = Low (GR didn't exist).
  *   $P_{prior}(E|H)$ = ? (Before GR, we didn't know GR predicted $E$).

  When Einstein derived $E$ from $H$, he didn't update on $E$ (which was 1). He updated on the **logical connection** $(H \to E)$.

  **The Cost:**
  1.  **Confirmation becomes indexical.** A piece of evidence confirms a hypothesis *for an agent at a time*. It is not an objective logical relation between propositions $E$ and $H$ simpliciter. Mercury confirms GR for Einstein in 1915, but it does not confirm GR for you today (for you, it is just part of the background $B$ that makes $P(GR)$ high).
  2.  **You must simulate ignorance.** To measure the weight of old evidence, you have to mentally "unlearn" the theoretical link while keeping the empirical fact. This is cognitively demanding and sometimes impossible (you can't easily pretend you don't know that $H$ entails $E$ once you've seen the proof).

  **Verdict:** This saves (1) and (2) intact. It kills Step (5) immediately: evidence doesn't *decay*; the *opportunity to update* expires. Your current high confidence in GR *is* the stored value of that confirmation.

  ### Option 2: The Logical Omniscience Fix (Reject the content of 3)
  **The Move:** This is the specific fix for the GR/Mercury case. Standard Bayesianism assumes **Logical Omniscience**: if $H$ entails $E$, then $P(E|H) = 1$ automatically.

  The Problem of Old Evidence only arises if we assume agents know all the logical consequences of their hypotheses instantly. But Einstein didn't know GR entailed the Mercury anomaly when he wrote down the field equations. He *learned* that entailment later.

  So, the evidence $E$ in the confirmation equation isn't "Mercury's perihelion is 43 arcseconds."
  The evidence $E^*$ is "**GR entails** that Mercury's perihelion is 43 arcseconds."

  Before the calculation, $P(E^*)$ was *not* 1. It was uncertain whether the math would work out. When the math worked, $P(E^*)$ went to 1, and $P(H)$ spiked.

  **The Cost:**
  1.  **You break Standard Bayesianism.** Standard Bayes assumes logical truths have probability 1 always. To make this work, you need a Bayesianism of **Logical Uncertainty** (like the work of Garber or modern work on logical induction). You have to assign probabilities to logical relationships, not just empirical states.
  2.  **Complexity.** Formalizing "probability that theory T predicts data D" is much harder than "probability of data D."

  **Verdict:** This is the most accurate description of what scientists actually *do*. They aren't surprised by the data; they are surprised that their theory *fit* the data. But it requires upgrading your probability engine to handle logical uncertainty.

  ### Option 3: Likelihoodism (Reject 1)
  **The Move:** You keep Bayes' Theorem (2) but reject the definition of confirmation in (1). Instead of looking at the posterior $P(H|E)$, you look at the **Likelihood Ratio**:
  $$ \Lambda = \frac{P(E|H)}{P(E|\neg H)} $$

  Even if $P(E) = 1$ (you know the data is true), the *expectation* of that data differs under $H$ vs $\neg H$.
  *   If $H$ is true, $E$ was expected ($P(E|H) \approx 1$).
  *   If $\neg H$ is true (e.g., Newtonian physics), $E$ was anomalous ($P(E|\neg H) \ll 1$).

  The ratio is huge. $H$ is supported because it "captured" the evidence that was floating around unexplained.

  **The Cost:**
  1.  **You abandon Posterior Probabilities.** Likelihoodists argue you can't really know $P(H)$ (the prior is too subjective), so you should only talk about how much $E$ favors $H$ over $\neg H$.
  2.  **It doesn't solve the $P(E)=1$ math.** Strictly speaking, if $P(E)=1$, then $P(E|H)$ must be 1 (you can't condition on a certainty and get uncertainty). To make this work, you still have to invoke the Counterfactual Cut (Option 1) regarding what $P(E|\neg H)$ *would have been* before the data was known.

  **Verdict:** Good for practice, but mathematically relies on Option 1 to avoid the $P(E)=1$ collapse.

  ---

  ### The Diagnosis of Your Step (5)
  > *"The more I know, the less any of it supports."*

  This is the most dangerous intuition in your argument. It conflates **support** with **updating**.

  Imagine your belief state is a bucket. Evidence is water.
  *   **Step (5) claims:** As the bucket fills, the water already inside loses its ability to hold up the bucket.
  *   **Reality:** The water already inside *is* what holds up the bucket. You don't need to keep pouring water in to maintain the level; you only pour to *raise* the level.

  When you learn $E$, $P(H)$ jumps. That jump is permanent. The fact that $P(E)$ is now 1 doesn't erase the jump; it just means you can't jump *again* on the same $E$. The "confirmatory power" isn't a fuel that burns out; it's a one-time transaction that converts uncertainty into certainty.

  ### Recommendation
  You suspected $E$ is doing two different jobs. You are right.
  1.  **$E_{fact}$:** The state of the world (Mercury's orbit). This is fixed. $P(E_{fact}) = 1$.
  2.  **$E_{report}$:** The incorporation of that fact into your model relative to a hypothesis.

  **The Fix:** Reject **(3)** only in the context of **confirmation calculations**.
  Adopt **Option 1 (The Temporal Cut)**.
  *   **Accept:** For all practical decisions *now*, $P(E) = 1$.
  *   **Accept:** For all historical confirmation *assessments*, you must calculate using $P_{prior}(E)$, the probability $E$ held *before* you conditioned on it.

  **The Price:** You have to admit that "Confirmation" is not a timeless logical relation like "Entailment." It is a **historical narrative** about how an agent moved from ignorance to knowledge. Mercury confirms GR *historically*, even if it doesn't update you *today*.

  This preserves Bayes, keeps your certainty intact, and explains why GR is confirmed without requiring you to pretend you don't know Mercury's orbit. You just have to pretend you don't know that GR predicts it.
