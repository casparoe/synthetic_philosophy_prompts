      *(Self-Correction during drafting)*: I need to be careful about $F_\omega$. Is $F_\omega$ recursively axiomatizable?
      If $F_n$ is defined recursively, then the set of axioms of $F_\omega$ is $\{ \phi \mid \exists n, \phi \in F_n \}$. Since $n \mapsto F_n$ is recursive, the set of axioms is r.e. So yes, $F_\omega$ is a formal theory.
