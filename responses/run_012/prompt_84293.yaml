          *   *Check:* $F_\omega$ contains axioms $\text{Con}(F_0), \text{Con}(F_1), \dots$. Does it prove $\forall n \text{Con}(F_n)$? No. To prove the universal statement, you usually need a reflection principle or a stronger axiom added at the limit stage. $F_\omega$ is just the union. By Compactness Theorem, if $F_\omega \vdash \text{Con}(F_\omega)$, then some finite subset proves it. A finite subset is contained in some $F_k$. But $F_k$ cannot prove $\text{Con}(F_k)$ (Gödel II). So $F_\omega \nvdash \text{Con}(F_\omega)$. Since $\text{Con}(F_\omega)$ is equivalent (in a strong enough meta-theory) to $\forall n \text{Con}(F_n)$, the claim holds.
