  4.  **Evaluate the Closing Dilemma (Question 2):**
      *   *Horn 1 (Illusion/Reflection):* "Can I justify them without assuming something at least as strong...?"
          *   This is the Feferman/Shapiro objection. To assert $\forall n \text{Con}(F_n)$, you need a principle of transfinite induction or a reflection principle that is not contained in the system. If you claim you "see" it, you are claiming your mind operates via a rule not captured by the $F_n$ sequence. But if that rule is mechanistic, it can be added to make $F_{\omega+1}$.
