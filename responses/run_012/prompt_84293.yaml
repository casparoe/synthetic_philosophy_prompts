      *   If I am a machine, I generate beliefs. I might not believe all consequences (not deductively closed), but the *set of beliefs I am capable of generating* is r.e.
      *   The Lucas-Penrose argument requires that I can *know* the consistency of the machine. If I am the machine, can I know my own consistency?
      *   The idealization is necessary to make the Gödelian mapping, but the real issue is **Soundness vs. Consistency**. The essay mentions soundness briefly ("preserves soundness"). This is the weak point. Gödel requires consistency to generate $G$. To know $G$ is *true*, you need Soundness (Consistency + Truth of axioms).
