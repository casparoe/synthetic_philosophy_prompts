answer: |-
  Good evening.

  Twenty-three years ago, [Name] hired me onto this desk. I was younger, louder, and convinced that the world was full of mispriced opportunities waiting to be harvested. She was, as she is now, the person who held the keys to the building and the logic of the firm.

  I want to tell you about a Tuesday afternoon about fifteen years ago. We had a position that was working. The model was singing. Every instinct I had—every instinct the market rewards in the short term—told me to increase the size. To press the advantage. I brought her the paperwork to double the exposure.

  She looked at the numbers, looked at me, and cut the size in half.

  I was furious. I told her we were leaving money on the table. I told her the expected value was clearly positive. And she gave me that look she reserves for clients and overconfident junior traders, and she said, "We are not playing with imaginary copies of ourselves. We are playing with the one path we actually have to walk."

  She didn't explain the math. She didn't need to. She taught us that there is a difference between a bet that looks good on paper and a bet that lets you come back to the office on Wednesday. She taught us that ruin is absolute. There is no logarithm of zero. If you hit zero, the game ends, and the rate of compounding becomes irrelevant.

  She called it "Geometric Rationality." She used the term to embarrass me in front of clients, usually when I was getting too excited about a upside case. To the family here: she wasn't just talking about money. She was talking about how to live. She believed that a reputation, a marriage, a friendship—these are things that compound. They grow slowly, over time, through reinvestment of trust. And like any compounding thing, they are fragile. You can be right ninety-nine times, but if the hundredth time takes you to zero, you don't have a ninety-nine percent success rate. You have nothing.

  She never claimed this was a universal law of the universe. If you asked her if maximizing the logarithm of wealth was the only way to measure value, she would shrug. She knew it was a choice. But it was *her* choice. It was the arithmetic of a life that has to be lived once, in order, without a reset button. She preferred to say of every bet she ever made that it was a little too small, because being too small means you are still here to make another one.

  Now, we all know she is retiring. And we also know, because she has told anyone who will listen, that she intends to take a portion of her own capital and make one last large bet on a single idea.

  To the family: this is her version of climbing a mountain because it is there. It is the privilege of owning your own risk.

  To the desk: yes, we hear the irony. We hear it clearly.

  But here is the thing she taught me, the thing I want to honor tonight. She taught us that the math describes the constraints, but it does not dictate the soul. She spent twenty-three years protecting this firm, protecting our capital, and protecting us from ourselves. She ensured that the path we walked never intersected with zero. She earned the right to decide where her own path leads next, even if the sizing looks aggressive to the rest of us. We will not ask for the ticket. We will only hope that she applies the same mercy to herself that she applied to us.

  I am not going to say that her strategy worked out "in the long run." I am not going to say that she was right "on average." She wouldn't accept those consolations, and neither should we. The only thing that matters is that we are all here, in this room, together, with the firm intact and our reputations compounded.

  So, if you would please raise your glasses.

  To [Name]. Thank you for teaching us that the goal is not to win the most, but to stay in the game long enough to matter. Thank you for guarding the downside of our lives as carefully as you guarded the downside of the book. And thank you for showing us that while nothing is guaranteed, prudence is a form of love.

  To [Name].
