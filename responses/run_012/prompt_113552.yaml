answer: |-
  You have put your finger on one of the most persistent and annoying structures in philosophy. It doesn't have a single, universally agreed-upon name like "Ad Hominem," but it is a well-recognized species of **Self-Undermining** argument.

  In the literature, it usually goes by the domain-specific names you hinted at (The Evolutionary Argument Against Naturalism, The Benacerraf-Field Challenge, The Epistemic Objection to Epiphenomenalism). However, if we want a unifying label for the *shape* itself, the most accurate standard term is **The Epistemic Access Problem** (or **The Causal Exclusion Epistemic Challenge**).

  It is a form of **Pragmatic Self-Refutation**, but it is distinct from a logical contradiction. Here is the breakdown of the name, the edges, the cases, and the viability of the rescue.

  ### 1. Naming the Shape
  **Standard Name:** There is no single word, but philosophers generally categorize this under **Epistemic Debunking Arguments** or **Reliability Challenges**.
  **Proposed Unifying Name:** **The Causal Exclusion Epistemic Challenge.**

  **Why this name?**
  The core mechanism is **Causal Exclusion**. The theory posits that the truth-maker ($X$) is excluded from the causal chain that produces the belief ($B$). If $X$ doesn't cause $B$, and nothing links $X$ to the actual causes of $B$, then the alignment between $B$ and $X$ is inexplicable. If the alignment is inexplicable, the belief is unjustified.

  ### 2. The Edges: How it differs from similar moves
  You asked if it's just "self-refutation in a costume." It is close, but the distinctions matter for how you defeat it.

  *   **Vs. Logical Self-Refutation:**
      *   *Logical:* "All statements are false." (If true, it's false. A contradiction in terms.)
      *   *Your Shape:* "Qualia are inert." (This *could* be true. The problem is that if it *is* true, you can't *know* it. It undermines the **warrant**, not the **truth**.)
  *   **Vs. Performative Contradiction:**
      *   *Performative:* Saying "I am not speaking" while speaking. (The act contradicts the content immediately.)
      *   *Your Shape:* The act of asserting the theory doesn't immediately contradict it. The contradiction arises only when you analyze the *genealogy* of the assertion. It requires a premise about how knowledge works (e.g., "Knowledge requires causal contact").
  *   **Vs. Tu Quoque:**
      *   *Tu Quoque:* "You criticize me, but you do the same thing." (Attacks the person's consistency.)
      *   *Your Shape:* Attacks the theory's internal coherence regarding its own evidence. It doesn't matter *who* says it; the theory eats its own evidence regardless of the speaker.

  **Verdict:** It is best classified as **Pragmatic Self-Refutation**. The theory makes it pragmatically impossible to hold the theory rationally, even if the theory is metaphysically true.

  ### 3. Evaluating Your Four Cases
  All four are instances of this shape, but they vary in strength.

  1.  **Epiphenomenalism (Qualia):** **Strong Fit.**
      *   *The Squeeze:* If the pain (qualia) doesn't cause the scream, the brain state causes the scream. Why does the brain state also produce the *feeling* of pain? And why does my report ("I feel pain") track the feeling if the feeling does nothing?
      *   *Status:* This is the classic "Epistemic Objection to Epiphenomenalism." It is widely considered the fatal blow to strict epiphenomenalism.

  2.  **Evolutionary Debunking (Plantinga's EAAN):** **Strong Fit.**
      *   *The Squeeze:* If beliefs are selected for survival, not truth, the probability that our cognitive faculties are reliable is low. Therefore, the belief in evolution (produced by those faculties) is undermined.
      *   *Status:* This is Alvin Plantinga's **Evolutionary Argument Against Naturalism**. It is highly controversial. Critics argue true beliefs *are* often more survival-conductive than false ones (instrumental value of truth), which blunts the squeeze.

  3.  **The Press Secretary (Confabulation):** **Strong Fit.**
      *   *The Squeeze:* If the conscious narrator is a PR firm spinning stories for unconscious processes, the story "I am a PR firm" is itself a spin. Why trust the spin that says the spin is fake?
      *   *Status:* This is a reflexive version of the **Hermeneutics of Suspicion**. It lands hard if the theory claims *total* confabulation. It weakens if the theory allows *some* accurate self-reporting mechanisms.

  4.  **Moral Non-Naturalism (Mackie/Street):** **Strong Fit.**
      *   *The Squeeze:* If moral facts are "queer" (causally inert, outside space-time), how did our evolution-tuned brains come to believe them?
      *   *Status:* This is **Sharon Street's Darwinian Dilemma** or **Benacerraf's Problem** applied to ethics. It is the dominant objection to robust moral realism.

  **Verdict:** All four are the same animal. They all posit a gap between the *cause of the belief* and the *truth-maker of the belief*.

  ### 4. Does the Objection Land? (The Rescue)
  You asked: *"Can you rescue the view by saying the byproduct is reliably correlated with the cause even though it isn't itself a cause?"*

  This is the **Common Cause Defense**. It is the standard rescue attempt, but it comes with a cost.

  **The Rescue Strategy:**
  You argue that the Physical State ($P$) causes *both* the Byproduct ($X$) *and* the Report ($R$).
  *   $P \rightarrow X$ (Brain causes Qualia)
  *   $P \rightarrow R$ (Brain causes Speech)
  *   Therefore, $R$ correlates with $X$, even if $X$ doesn't cause $R$.

  **Why it often fails (The "Coincidence" Objection):**
  1.  **Epiphenomenalism:** If $P$ causes $X$, why does $P$ cause *that specific* $X$? If $X$ does no work, the link between $P$ and $X$ looks like a "Pre-established Harmony" (Leibniz). It saves the correlation but makes the metaphysics look magical. Why should the physical process of firing C-fibers *necessarily* produce the *feeling* of pain rather than the *feeling* of pleasure, if the feeling does nothing to help survival?
  2.  **Evolution:** To rescue this, you must argue that **Truth is Survival-Conductive**. If true beliefs generally help you survive better than false ones, then Selection ($S$) tracks Truth ($T$).
      *   *Counter:* Evolution only cares about behavior, not belief. You can have a false belief that produces survival behavior (e.g., "I want to pet that tiger because it's a big kitty" $\rightarrow$ runs away $\rightarrow$ survives). The correlation is not guaranteed.
  3.  **Morals:** This is the **"Third Factor"** argument (defended by David Enoch).
      *   *Argument:* There is a third factor (e.g., "Survival is good") that explains both why we believe it (evolution) and why it is true (moral fact).
      *   *Counter:* This requires admitting that moral facts *do* have a relationship to the natural world, which softens the "inertness" claim.

  **Conclusion on the Rescue:**
  The objection **lands** if the theory insists on a *brute* lack of connection.
  The rescue works **only if** you can posit a **Common Cause** or a **Constitutive Relation**.
  *   If you say the Physical State *constitutes* the Mental State (Identity Theory), the problem vanishes (because the cause of the report *is* the state).
  *   If you say the Physical State and Mental State are distinct but linked by a "Psycho-Physical Law," you save the correlation but invite the charge of mystery.

  ### Summary
  *   **Name:** **The Epistemic Access Problem** (or **Causal Exclusion Epistemic Challenge**).
  *   **Category:** **Pragmatic Self-Refutation** (undermines warrant, not truth).
  *   **Cases:** All four of your examples are valid instances.
  *   **Viability:** The objection is lethal to views that posit **causal inertness** without a **common cause explanation**. The "correlation rescue" works only if you can explain *why* the correlation exists without giving the byproduct causal powers (which often leads to positing God, Pre-established Harmony, or Identity Theory).

  You are noticing this pattern because it is the primary weapon used by **Naturalists** against **Non-Naturalists** (in ethics/math) and by **Non-Naturalists** against **Naturalists** (in consciousness/evolution). It is the boundary skirmish of metaphysics.
