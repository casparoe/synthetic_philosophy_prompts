answer: |-
  Two philosophers are having coffee. 

  "Lend me a tenner," says Alice. 
  "No," says Bob. "You can't derive an ought from an is." 
  "Watch," says Alice. "Premise: The coffee is hot. Conclusion: Either the coffee is hot, or you ought to lend me a tenner." 
  "Valid," says Bob. "But the 'ought' is vacuous. It's only true because the coffee is hot." 
  "Fine," says Alice, picking up the pot. "New Premise: I am pouring this on you. Conclusion: Either I pour this on you, or you ought to lend me a tenner." 
  Bob hands over the money. 
  "See?" says Alice. "The obligation is now logically secured." 
  "No," says Bob. "I just made the first disjunct false." 
  "Pragmatically," says Alice, pocketing the cash, "that's how modus tollens works. Normatively, it's a tax."

  ***

  **Commentary**

  The joke leans on A.N. Prior's 1960 counter-example to Hume's Law, using Disjunction Introduction ($P \vdash P \lor Q$) to show that "ought" sentences can be formally entailed by "is" sentences. 

  I am highly confident in the philosophical claim that Prior's argument is logically valid in classical systems, and equally confident that most meta-ethicists reject it as dissolving the Is/Ought problem (usually by requiring the "ought" to occur *essentially* in the conclusion, not just as a vacuous disjunct). 

  The bit I'm least sure about is the punchline's conflation of prudential reasoning (avoiding scalding coffee) with logical derivation. While the joke treats them as functionally equivalent ("that's how modus tollens works"), philosophically, the move from "I will burn you" to "You ought to pay" relies on a hidden normative premise (e.g., "you ought to avoid pain"), which smuggles the ought back in—the very thing the joke claims to bypass.
