  I'm applying for a year-long part-time research grant and need a two-page proposal, and Ive got a half-formed idea I want you to turn into one. It's on the epistemology of conspiracy theories. My hunch is that the standard fight — some people say conspiracy theories are irrational by their very nature, others say you have to take them one at a time, others say 'conspiracy theory' is just an insult dressed up as a category — keeps going in circles because everyone treats 'absence of evidence' as a single thing. I want to split it in two: the case where what's missing is the kind of evidence some neutral process would have coughed up anyway if the story were true, and the case where what's missing is the kind the alleged conspirators would have had every reason to bury. A theory that predicts its own evidential emptiness because the conspirators control the record seems to be doing something different from one that just hasn't been tested yet, and I think a Bayesian treatment that models the evidence-generating process, cover-up included, can say precisely when such a theory is still rationally assessable and when it has quietly stopped making a claim about the world. Write the proposal: state the question so it has a determinate answer, explain why the existing camps leave it open, lay out what I'd actually do month by month, say what a real result would look like and what would count as the project failing, and be honest about whether this fits in a year part-time. Skip the citations, I'll add those myself.
