answer: |-
  Here is a session design that fits your constraints, targets the specific cognitive dissonance you described, and respects the 50-minute limit.

  ### Part 1: The Journalist Check (Read this first)

  You have the core intuition right, but there is one subtle mathematical trap in your phrasing that your students (some of whom may have stats backgrounds) will pounce on if you don't preempt it.

  **The Trap:** You wrote: *"Information can't have negative expected value... because a free, credible piece of evidence you're allowed to ignore can never leave you worse off on average."*

  **The Correction:** This is true **if and only if** your utility function is defined solely over the **outcome of the decision**.
  *   **Good's Theorem:** $E[U(\text{with info})] \ge E[U(\text{without info})]$.
  *   **The Ostrich Intuition:** Humans often have a utility function that includes **the state of knowledge itself**. $U(\text{Outcome}, \text{Knowledge})$. If $U$ decreases when Knowledge = "Bad News," then information *does* have a cost, and Good's Theorem doesn't apply.

  **The Goal:** The game must prove Good's Theorem mathematically (Outcome-only utility) while validating the Ostrich Intuition psychologically (Knowledge-state utility). If you don't make this distinction explicit, the session will feel like you're gaslighting them ("The math says you're happy, why do you feel sad?").

  ---

  ### Part 2: The Game — "The Editor's Gamble"

  **Concept:** Students play as editors deciding whether to "Publish" a story. The story is either **True** (Profit) or **False** (Scandal). They can pay nothing to see a "Fact-Check" hint before deciding.

  **Materials (Stationery Cupboard):**
  *   20 Envelopes (labeled 1–20). Inside each: A slip saying **TRUE** or **FALSE** (50/50 split, pre-determined).
  *   20 "Hint Cards." Each corresponds to an envelope.
      *   If Envelope is TRUE: 70% of Hint Cards say "Likely True," 30% say "Likely False."
      *   If Envelope is FALSE: 70% of Hint Cards say "Likely False," 30% say "Likely True."
      *   *(Prep these in advance. This 70% accuracy is the "credible evidence.")*
  *   Scorecards for each student.
  *   3 Chocolate bars (prizes).

  **The Payoff Scheme (Points):**
  *   **Publish + True:** +10 points.
  *   **Publish + False:** -10 points.
  *   **Kill Story (Don't Publish):** 0 points.
  *   **Cost of Hint:** 0 points.

  #### Timeline (50 Minutes)

  **0:00–0:05: Setup & Stakes**
  *   Hand out scorecards. Announce the top 3 scores win chocolate.
  *   Explain the Payoff Scheme.
  *   **Crucial Instruction:** "You are rational maximizers. Your only goal is points. Feelings do not cost points."

  **0:05–0:20: The Three Rounds**
  Run three distinct rounds. Keep the pace military-tight.

  *   **Round 1 (The Blind Baseline):**
      *   Hand out Envelopes. **Do not** hand out Hint Cards.
      *   Decision: Publish or Kill?
      *   Reveal Envelope content. Tally Score.
      *   *Expected Result:* Most guess Publish (EV = 0, but usually people gamble). Some lose big.

  *   **Round 2 (Good's Theorem in Action):**
      *   Hand out Envelopes **and** Hint Cards.
      *   Rule: "You may look at the Hint. You may ignore it. It costs nothing."
      *   Decision: Publish or Kill?
      *   Reveal Envelope content. Tally Score.
      *   *Expected Result:* Aggregate score goes up. But... some students will look at a "Likely True" hint, Publish, and find a FALSE envelope (the 30% error rate). They will feel the sting.

  *   **Round 3 (The Ostrich Round):**
      *   Hand out Envelopes **and** Hint Cards.
      *   **New Rule:** "If you look at the Hint and it is 'Likely False,' you feel a 'Stress Penalty' of -2 points, regardless of your decision." (Write this on the board).
      *   *Note:* This explicitly violates the "Free Info" assumption of Good's Theorem by adding a cost to the *state of knowing*.
      *   Decision: Look or Don't Look? Then Publish or Kill?
      *   Reveal. Tally.

  **0:20–0:30: The Tally (The Math)**
  *   Ask for a show of hands: "Who improved their score in Round 2 compared to Round 1?" (Most will have).
  *   Ask: "Who lost points in Round 2 *specifically because* they followed a Hint that turned out wrong?" (Some hands will go up).
  *   Write on the board: **Expected Value vs. Realized Value.**
      *   Round 2 EV was higher. The *strategy* was better.
      *   Round 2 Realized Value had variance. The *outcome* sometimes hurt.
  *   **Point:** Good's Theorem guarantees the *strategy* wins in the long run. It does not guarantee you win *this time*. The "sting" you feel is the variance, not a failure of the theorem.

  **0:30–0:40: The Debrief (The Psychology)**
  *   Address the Round 3 "Stress Penalty."
  *   Ask: "In Round 3, was it rational to ignore the hint?"
  *   **Yes.** Because the utility function changed.
  *   **Map to Reality:** "In real life, we are almost always in Round 3, not Round 2."
      *   **Assumption 1 (Free):** Info costs time/attention.
      *   **Assumption 2 (Ignore):** Social pressure often forces us to act on info once we have it (you can't un-know the fact-check).
      *   **Assumption 3 (Utility):** We care about our anxiety levels (The Stress Penalty).
  *   **The Takeaway:** The Ostrich Effect isn't stupidity. It's a rational response to a utility function that includes "Peace of Mind." Good's Theorem is right about *truth*, but humans care about *feelings* too.

  **0:40–0:50: Q&A and Wrap**
  *   Open floor for war stories.
  *   Final thought: "As science writers, your job is to present information (Round 2) while acknowledging the Stress Penalty (Round 3). If you ignore the cost of knowing, your audience will reject the data."

  ---

  ### Part 3: What Will Go Wrong (And How to Fix It)

  **1. The "It's Just Luck" Cynicism**
  *   **Failure:** In Round 2, a student follows the hint, loses, and declares the hint useless.
  *   **Fix:** Pre-calculate the aggregate EV on the board before they start. Show them that with 70% accuracy, the "Hint Strategy" yields +4 points per round on average, while "Blind Guessing" yields 0. When they complain, point to the math. "You lost the battle, but the strategy wins the war."

  **2. Time Creep**
  *   **Failure:** Distributing envelopes/cards takes 10 minutes.
  *   **Fix:** Pre-sort the materials into 20 packets (Envelope + Hint + Scorecard) before they arrive. Hand out packets in 30 seconds.

  **3. The "Ignore" Loophole**
  *   **Failure:** Students take the hint but claim they "ignored it" when they lose, muddying the data.
  *   **Fix:** In Round 2, require them to circle on their scorecard: "Did you use the hint to decide? Yes/No." This forces commitment.

  **4. The Boredom Factor**
  *   **Failure:** It feels like a dry stats class.
  *   **Fix:** Lean into the narrative. "You are the Editor. If you publish fake news, you get fired (-10). If you kill a true story, you get scooped (0)." Make the stakes feel professional, not mathematical.

  ---

  ### Part 4: What The Game Can't Do (Your Job)

  The game cannot reproduce the **social cost** of information.
  *   In the game, if I know a story is false and kill it, nobody knows I knew.
  *   In real life, if I know a fact (e.g., a medical prognosis, a political scandal), I am often socially obligated to *act* on it or *share* it. I lose the option to "ignore it."
  *   **Your Closing Monologue:** You must supply this. "In this game, you could ignore the hint. In your careers, once you verify a source, you can't pretend you didn't. That loss of flexibility is a real cost that Good's Theorem doesn't capture. That is why information feels heavy."

  ### Summary of the "Sting"
  *   **Round 2** proves the theorem (EV goes up).
  *   **Round 2 Losses** prove the variance (Realized value goes down sometimes).
  *   **Round 3** proves the Ostrich intuition (Utility of Ignorance is real).

  This structure lets you validate the math without invalidating their human experience. It gives them the "bones" feeling you asked for: the math is right, but the map isn't the territory.
