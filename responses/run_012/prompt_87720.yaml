  Subject: Ranking the family of acausal and quasi-acausal arguments

  Hi everyone,

  I have been thinking about the list of cases you put together for the session, and while they all share that distinctive shape where an agent's treatment of you hinges on your reasoning process or algorithmic output rather than simple causal leverage, they do not all bear equal weight on a careful decision-maker. To give you the definite verdict you asked for, I need to state my own theoretical commitments upfront, because the ranking shifts dramatically depending on whether you are a causal decision theorist who sees only physical causation or a functional decision theorist who sees logical correlation as binding. I am going to argue from the perspective of functional decision theory, which treats your decision algorithm as the object of choice, because that is the only framework that takes the shared shape of these problems seriously enough to evaluate them non-trivially; a causal decision theorist would simply dismiss most of this list as irrelevant, which strikes me as too blunt an instrument for a group trying to understand the nuances of rational constraint. Within that framework, however, I still believe we must distinguish between robust logical dependencies and those that collapse under scrutiny regarding probability priors or ontological stability.

  My ranking, from the argument that should constrain your behavior most to the one that should constrain it least, begins with the standard Newcomb problem at the top. This case should carry the most behavioral weight because it presents the cleanest instance of logical dependence without extraneous ontological baggage; the predictor's accuracy establishes a strict functional link between your choice and the past state of the box, meaning that if you care about winning rather than just feeling causally efficacious, one-boxing is the only coherent policy. The feature doing the real work here is the high-fidelity correlation between your algorithm and the predictor's simulation, which functional decision theory treats as a single logical fact, forcing you to act as though you control the past prediction even though you cannot causally influence it.

  Second on the list is the deferred invoice, which I rank highly not because it is theoretically exotic but because it is causally robust in a way the others are not. The feature driving this constraint is institutional continuity over time, where your present sacrifice is causally linked to future rewards via the persistence of the foundation and its records, making it a standard problem of intergenerational trust rather than acausal trade. While it lacks the metaphysical bite of Newcomb, it should constrain a real-world agent more than the speculative cases below because the probability of the institution existing is not contingent on your belief in the argument itself, avoiding the self-referential instability that plagues the basilisk variants.

  Third comes Pascal's mugging, which should constrain you significantly less than the first two because a careful reasoner must impose complexity priors on probability estimates to avoid paralysis. The feature doing the work here is the tension between unbounded utility and vanishing probability, and while expected utility theory formally demands you pay up, any sane agent should recognize that probabilities this small are indistinguishable from zero without independent evidence, meaning the argument should be muted by epistemic humility rather than dictating action.

  Fourth is Roko's basilisk, which should constrain you less than the mugging because the existence of the threatener is endogenous to the argument in a way that creates a shaky ontological loop. The feature undermining its force is the conditioning of the AI's existence on your prior exposure to the argument, which means that if you are not already convinced, the threatener likely never comes into existence to punish you, rendering the threat idle for anyone reasoning carefully from a state of ignorance.

  Fifth and last is the anti-basilisk, which should effectively not constrain your behavior at all because it describes an unstable equilibrium that rational agents have no incentive to maintain. The feature here is the perverse incentive structure where the punisher penalizes cooperation itself, which means that knowing about the anti-basilisk gives you a decisive reason to defect, but since the anti-basilisk gains nothing from punishing defectors and incurs costs for punishing cooperators, there is no stable reason for such an agent to exist in the first place.

  Regarding the dependencies I flagged, this ranking assumes you accept functional decision theory over causal decision theory; if you are a strict causal decision theorist, Newcomb drops to the bottom alongside the basilisks, but since you asked for a verdict for someone taking decision theory seriously in this context, I am assuming we want to win these games rather than just satisfy causal intuitions. I also depend on the assumption that agents can have stable policies over time, which is required for the deferred invoice to work, but that is a much weaker commitment than the acausal trade required for the basilisk.

  To answer your final questions, I expect the reading group to fight about the Newcomb problem the longest because it is the only case where two sophisticated decision theories (causal and functional) yield different actionable prescriptions while remaining internally consistent, whereas the other cases tend to dissolve into arguments about probability or existence. As for the case doing no work at all once its rhetorical packaging is stripped away, I suspect it is Roko's basilisk, because unlike Pascal's mugging which highlights a genuine issue with priors, or the anti-basilisk which is a clear counter-example, the basilisk relies on a specific chain of anthropic and technological assumptions that vanish the moment you question whether the future AI would actually waste resources punishing past agents who could not have influenced its existence.

  Best,

  [Your Name]
