answer: |-
  ### Tier List for Deflationary Theories of Truth

  **S-Tier: Minimalism**
  Handles (a), (b), and (e) well via propositional quantification; struggles with (d) and (f) without restricting the equivalence schema.
  **Trust: 8/10** (The robust default for metaphysics; treats truth as a lightweight property rather than just a logical device.)

  **A-Tier: Disquotationalism**
  Excellent on (a) and (b) via sentential quantification; sinks on (c) and (e) because logical disquotation doesn't inherently explain normativity or semantic composition.
  **Trust: 7/10** (The logical workhorse, but less satisfying if you need truth to govern belief or meaning.)

  **A-Tier: Prosententialism**
  Structurally collapses into Disquotationalism for jobs (a)–(f), offering only a grammatical advantage on (b) anaphora; sinks on (e) similarly.
  **Trust: 6/10** (Useful for linguistic intuition, but logically redundant if you already teach Disquotationalism.)

  **B-Tier: Act-Deflationism**
  Solves (c) perfectly by building normativity into the definition; sinks on (a) and (e) because quantifying over speech acts is messier than quantifying over propositions.
  **Trust: 5/10** (High reward for norms, high risk of collapsing into expressivism rather than deflationism.)

  **F-Tier: Plain Redundancy**
  Fails (a) and (b) immediately as it cannot handle generalisation or blind ascription without reintroducing the truth predicate.
  **Trust: 1/10** (Teach only as a historical foil; it is refuted by the first quantified sentence you write on the board.)

  ***

  **Logic vs. Metaphysics Context**
  If this were a logic course, **Disquotationalism** would jump to S-Tier because its focus on the T-schema and quantification aligns perfectly with formal semantics and proof theory. In a metaphysics course, **Minimalism** wins because it addresses the nature of the property itself, not just the predicate's logical behavior.

  **Coherence of Act-Deflationism**
  It is a coherent option, but you should warn students it is arguably **expressivism with extra steps**. Unless you can formalize the "operator on acts" without reducing it to "expressing approval of acts," it loses its distinct deflationary character and becomes a normative theory of assertion rather than a theory of truth.
