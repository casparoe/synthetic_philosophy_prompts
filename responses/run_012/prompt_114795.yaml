      *   A pure "Structural" approach (Outline B) risks determinism and removing agency.
      *   *Decision:* A hybrid is pedagogically superior. It allows for nuance. I will recommend a hybrid model that prioritizes structural forces but integrates leadership decisions as critical junctures.
      *   *Why?* It teaches students *how* history happens (structure) and *where* humans intervene (agency).

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
