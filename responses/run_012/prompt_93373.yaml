  Here's the spec. Three views:

  1. Total utilitarianism: rank options by the sum of welfare.
  2. Average utilitarianism: rank by the mean welfare.
  3. A view I've been messing around with and calling the band view (a sliding critical level, basically). Pick a lower threshold L and an upper threshold U, with L ≤ U. A life whose welfare w is below L contributes (w − L), so negative; a life with w in the interval from L to U contributes exactly zero (the neutral band); a life with w above U contributes (w − U), so positive. Sum the contributions.

  I want a single choice between two populations A and B such that: total utilitarianism puts A above B; the band view also puts A above B (I specifically want the band view and total on the same side); average utilitarianism puts B above A; and none of this is trivial — neither option is a sub-population of the other (no mere addition), every life in both options is comfortably worth living, the numbers stay small enough to check by hand, and the band view's agreement with total is fragile, i.e. nudging U a little one way flips the band view over to B while total and average stay put.

  Then, after the scenario: give the arithmetic for each of the three views and say why it lands where it does. Then name the one feature of the case that's actually doing the work, and tell me what happens to all three verdicts if I remove or tweak that feature. Then the honest part — how would a total utilitarian, or a defender of the band view, attack the case to try to defuse it? And what consideration would genuinely change your mind about which verdict is right here; where's your reasoning most likely to be wrong?

  Keep it to about a page, self-contained — no citing papers, just the views and the case. Cheers.
