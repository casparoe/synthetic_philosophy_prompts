  2.  **Deconstruct the Analogy (The Mapping):**
      *   *Cipher:* The AI system (specifically the alignment mechanism/policy).
      *   *Key:* The specific goals/values or perhaps the internal parameters (though this is tricky, usually the "secret" in crypto is the key, in alignment the "secret" might be the true reward function or the internal reasoning). Let's refine: In crypto, the algorithm is public, the key is secret. In alignment, the model weights are often public/accessible to the attacker (white-box). So maybe the "Key" is the specific deployment context or a robustness parameter? Actually, a better mapping often used is:
