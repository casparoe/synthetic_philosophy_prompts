          *   Security Game $\rightarrow$ Preventing catastrophic misalignment (e.g., takeover, harm).
          *   Hardness Assumption $\rightarrow$ Assumptions about the difficulty of instrumental convergence or deception.
      *   *Correction/Refinement:* The standard "AI Safety via Cryptography" analogy usually maps the *adversary* to the AI itself (if it's deceptive) or the environment trying to break the alignment. Let's stick to the most charitable interpretation for the reading group:
          *   Cipher: The alignment technique (e.g., RLHF, interpretability tools).
          *   Key: The true human reward function (unknown to the attacker/AI during training).
          *   Adversary: The AI agent (seeking to optimise a proxy) or external actors misusing it.
          *   Security Game: Can the AI cause harm despite alignment training?
          *   Hardness Assumption: That finding a policy that looks aligned but isn't (deceptive alignment) is computationally hard? (This is already shaky).

  3.  **Identify the Breakdown (Disanalogies):**
      *   *Formal Specification:* Crypto has mathematically precise definitions of security (IND-CPA, etc.). Alignment lacks a formal specification of "human values."
