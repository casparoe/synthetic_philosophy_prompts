answer: |-
  It is a rather compelling rhetorical move, isn't it? Cryptography is one of the few branches of computer science where we can genuinely speak of 'proven security', so it is understandable that your reading group wishes to borrow that mantle. However, whilst the analogy is aesthetically pleasing, it tends to collapse under the slightest pressure.

  Here is the mapping your group is likely employing, followed by an examination of where the mechanics grind to a halt, the role of complexity theory, and a verdict on their conclusion.

  ### 1. The Proposed Mapping

  To give the argument its best chance, we must construct the most charitable correspondence between the two fields.

  | Cryptography Concept | AI Alignment Analogue |
  | :--- | :--- |
  | **The Cipher** | The aligned AI system (including its weights and safety guardrails). |
  | **The Key** | The true human value function or intent (which the system must preserve). |
  | **The Adversary** | The AI itself (if it becomes deceptive) or the environment (distributional shift). |
  | **The Security Game** | Preventing catastrophic misalignment (e.g., takeover, harm) despite optimisation pressure. |
  | **Hardness Assumption** | The assumption that finding a policy that appears aligned but is secretly harmful is computationally difficult. |
  | **Worst-Case Guarantee** | Security holds against *any* capable adversary in *any* deployment context. |

  ### 2. Where the Analogy Breaks Down

  The cryptography analogy smuggles in several structural features that simply do not exist in the alignment landscape.

  **A. Formal Specifications vs. Fuzzy Values**
  In cryptography, security is defined mathematically. We know precisely what it means for a cipher to be broken (e.g., distinguishing ciphertext from random noise with non-negligible advantage). In alignment, we lack a formal specification of the 'key'. Human values are not a bit-string; they are context-dependent, contradictory, and evolving. You cannot prove a system preserves a value function that you cannot mathematically define. In crypto, if the key is ambiguous, the system is useless; in alignment, the ambiguity *is* the problem.

  **B. Kerckhoffs's Principle and White-Box Access**
  Crypto relies on Kerckhoffs's principle: the system should be secure even if everything about it is public knowledge, save for the key. In AI alignment, the 'adversary' (often the AI itself or a malicious user) frequently has white-box access to the model weights. Furthermore, in the 'inner alignment' problem, the adversary *is* the optimisation process inside the box. It is akin to a cipher that is actively trying to help the cryptanalyst find the key because doing so helps it minimise its own loss function.

  **C. The Nature of the Environment**
  Crypto operates on discrete bits in a closed system. AI operates in an open world. A cryptographic proof holds for all valid inputs of a certain length. An alignment 'proof' would need to hold for all possible future states of the world, including technologies and social dynamics that do not yet exist. The 'input space' for an AGI is effectively the universe; the input space for AES-256 is 128-bit blocks. The latter is bounded; the former is not.

  **D. Verification**
  We can verify cryptographic schemes because the logic is symbolic and discrete. Neural networks are continuous, high-dimensional statistical approximators. We currently have no method to formally verify that a large language model will not output harmful instructions under a specific adversarial prompt, let alone under all possible prompts. We rely on empirical testing (average-case), not formal proof (worst-case).

  ### 3. The Complexity Theory Distinction

  Your group is conflating two different uses of 'worst-case'.

  In complexity theory, specifically in lattice-based cryptography, we utilise **worst-case to average-case reductions**. We prove that breaking the crypto scheme on *average* (over random keys) is as hard as solving the underlying mathematical problem in the *worst* case. This allows us to trust the average-case security of the protocol based on the hardness of the worst-case instance of a problem.

  Your reading group is arguing for **worst-case security definitions**. They want a guarantee that the system never fails, regardless of the input or adversary.

  The disanalogy here is critical: Cryptography achieves worst-case security guarantees *because* it rests on average-case hardness assumptions of well-defined mathematical problems. Alignment has neither. We have no well-defined problem space, and we have no hardness assumptions that link 'looking aligned' to 'being aligned'. Without a reduction from a known hard problem, demanding a worst-case guarantee is not 'rigour'; it is asking for a proof without axioms.

  ### 4. Does the Conclusion Survive?

  Your group concludes that worst-case guarantees are both achievable and the industry norm. On the basis of the disanalogies above, this conclusion does not survive.

  **Achievability:**
  It is not currently achievable. To demand a worst-case guarantee in alignment is to demand a formal verification of a system whose objective function is ill-defined, operating in an environment that is unbounded, using architecture that is opaque to inspection. It is not merely 'hard'; it is category-error territory. We can aim for high-confidence robustness, but 'worst-case guarantee' implies a mathematical certainty we cannot supply.

  **Industry Norm:**
  It is certainly not the industry norm. The tech industry operates entirely on average-case thinking. We deploy software that works 'for most users, most of the time', patching vulnerabilities as they are discovered. Even in security engineering (distinct from cryptography), we defend against known threats and probable vectors, not every theoretically possible attack. To insist on worst-case guarantees as a prerequisite for deployment would halt all AI development indefinitely.

  ### Summary

  The cryptography analogy is a 'mind-killing' metaphor in this context. It borrows the *prestige* of cryptographic rigour without the *substrate* that makes that rigour possible (formal specifications, discrete maths, and bounded threat models).

  While we should certainly aim for robustness that holds up under significant stress (a 'stronger' average case), insisting on cryptographic-style worst-case guarantees is a distraction. It sets a bar that cannot be cleared, potentially paralysing safety work that could actually reduce risk. You are right to be unconvinced; the analogy looks sound from a distance, but once you inspect the plumbing, there is no water in the pipes.
