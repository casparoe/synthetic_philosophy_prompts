answer: |-
  # JOINT STATEMENT ON EPISTEMIC ACCESS TO OTHER MINDS
  **Prepared by the Adversarial Collaboration on Social Cognition (ACSC)**
  **Subject:** The Perceptual-Inferential Dispute
  **Date:** October 2023

  ## I. AGREED CLAIMS

  1.  **The Nature of the Problem:** Both camps agree that the "Problem of Other Minds" is not primarily metaphysical (whether other minds exist) but epistemic (how we justify claims about them). We proceed on the assumption that other minds do exist; the dispute concerns the mechanism of our access to them.
  2.  **The Definition of Knowledge:** Both camps agree that to "know" another's mental state requires (a) the state to exist as attributed, (b) the observer to believe it exists, and (c) the observer to possess justification for that belief. Neither camp claims infallibility; both acknowledge the possibility of error.
  3.  **The Role of Behavior:** Neither camp posits telepathy. Both agree that behavioral cues (facial expression, vocal tone, physiological response, verbal report) constitute the total available data set for the observer. The dispute is whether this data serves as a *medium* through which the mind is disclosed (Perceptualism) or as *premises* from which the mind is derived (Inferentialism).
  4.  **Unconscious Processing:** Both camps agree that the cognitive processes involved need not be conscious. An Inferentialist does not claim the observer consciously reasons "Premise A, Premise B, therefore Conclusion C." A Perceptualist does not claim the observer is consciously aware of the sensory mechanics of perception. The dispute concerns the *logical structure* of the access, not the phenomenological awareness of it.
  5.  **Ethical Stakes:** Both camps acknowledge that the resolution of this dispute bears directly on clinical and ethical judgments, specifically regarding unresponsive patients. If access is perceptual, the absence of expression may imply the absence of a mind to perceive. If access is inferential, the absence of expression implies merely a lack of data, leaving the inference open to prior probability (e.g., "biological life suggests mental life").
  6.  **The Fictional Case:** Regarding the novelist's case (the reader knowing a fictional character's mind better than a living person's): Both camps agree this demonstrates that **certainty is a function of stipulation, not access.** When an author stipulates an interior state, the epistemic gap is removed by definition, not bridged by cognition. Therefore, the fictional case vindicates neither perception nor inference regarding *living* minds; it merely shows what knowledge looks like when the risk of error is abolished.

  ## II. DISAGREEMENTS TABLE

  | Disagreement | Perceptualist Position | Inferentialist Position |
  | :--- | :--- | :--- |
  | **1. The Mechanism of Access** | In favorable cases, mental states are **directly disclosed** in behavior. We see the grief *in* the weeping, not the weeping *plus* a guess about grief. The relation is non-inferential. | Mental states are **hidden causes** of behavior. We see the weeping and infer grief as the best explanation. The relation is always inductive or abductive. |
  | **2. The Consummate Performer**<br>*(Flawless grief behavior, no inner grief)* | This is a case of **perceptual illusion**, akin to a mirage. The observer perceives the *performance* as grief. The error lies in the taking, not the inferring. The "falseness" of the state modifies the quality of the presence, which a sensitive observer might detect as "hollow." | This is a case of **invalid inference**. The premises (behavior) are true, but the conclusion (grief) is false. Because behavior is the only evidence, a perfect performance makes the false conclusion epistemically indistinguishable from a true one. |
  | **3. The Inexpressive Griever**<br>*(Full inner grief, no behavior)* | This is a case of **occluded perception**. The mind is present but not "lit up" in expression. However, the *presence* of the person may still be felt through atmosphere or tension. We know less, but we are not inferring; we are failing to perceive. | This is a case of **insufficient data**. Without behavioral output, there are no premises for an inference. To claim knowledge here is not inference but guesswork or faith. The mind is theoretically unknowable in this specific instance. |
  | **4. The Status of "The Inner"** | The inner state is not a separate entity behind the behavior; it is **enacted** in the behavior. To see the behavior is to see the state, unless the enactment is fraudulent. | The inner state is a **distinct ontological category** from the behavior. Behavior is public; mind is private. The gap between them is unbridgeable without a logical bridge (inference). |
  | **5. Crux: Literal vs. Term-of-Art Perception**<br>*(Is "seeing anger" like "seeing red"?)* | **Literal (Extended).** Visual perception includes "high-level properties." Just as we see a *tree* and not just green patches, we see *anger* and not just muscle contractions. | **Metaphorical.** "Seeing" is being used loosely. Strictly speaking, we see physical movements. To say we "see" the mind is to collapse the distinction between observation and interpretation. |
  | **6. Crux: Behaviorally Indistinguishable States**<br>*(If the Performer and the Griever act identically, are they epistemically identical?)* | **No.** The reality of the state radiates through subtle, perhaps non-codifiable cues (micro-tension, timing, "aura"). The Performer cannot fully replicate the *truth* of the state, so a true perception would detect the difference. | **Yes.** If the physical data are identical, the epistemic position is identical. Any claim to detect a difference without behavioral evidence is mysticism. If the data are identical, the inference strength is identical. |
  | **7. Merely Verbal Disputes** | **Definition of "Inference."** If Inferentialists allow "unconscious, automatic, immediate inference," the gap narrows. Perceptualists argue this stretches "inference" until it breaks. <br>**Definition of "Object."** If Perceptualists admit they perceive "behavior-with-meaning" rather than "mind-stuff," the gap narrows. Inferentialists argue this is just semantics for "interpreted behavior." |

  ## III. CRUXES AND PREDICTIONS

  **Crux A: The Literalness of Perception**
  *   **The Question:** Is social perception a distinct sensory modality (or extension of vision) that can be veridical or illusory on its own terms, or is it a cognitive label applied to sensory data?
  *   **The Test Case:** *The Duck-Rabbit Illusion applied to Faces.* Show observers an ambiguous expression that can be seen as "pain" or "concentration."
  *   **Perceptualist Prediction:** Observers will report a *gestalt shift*. They do not think "this could be pain, or it could be concentration"; they *see* pain, then they *see* concentration. The change is perceptual, not doxastic (belief-based).
  *   **Inferentialist Prediction:** Observers will report a *re-evaluation of evidence*. The shift occurs because context cues change the hypothesis. The visual data remains constant; the cognitive label changes.

  **Crux B: The Indistinguishable Inner State**
  *   **The Question:** If a mental state produces no unique behavioral signature (as in the Consummate Performer), does the mental state cease to be an object of knowledge?
  *   **The Test Case:** *The Consummate Performer vs. The Genuine Griever.* Both produce identical tears, cortisol levels, and vocal tremors.
  *   **Perceptualist Prediction:** A sufficiently attuned observer (e.g., a skilled chaplain) will report a qualitative difference in the *presence* of the subject. The Performer feels "distant" or "opaque." The knowledge is not of the grief, but of the *authenticity* of the presentation. We perceive the deception.
  *   **Inferentialist Prediction:** No observer can reliably distinguish the two. Any claim to do so is a post-hoc rationalization based on knowing the outcome. Without a behavioral marker for "authenticity," the inference cannot be made. The chaplain is guessing.

  ## IV. NOTE TO THE NOVELIST (THE CHAPLAIN'S DILEMMA)

  Regarding your protagonist's vigil over the unresponsive:

  1.  **If Perceptualism is true:** The chaplain is looking for a *presence* that manifests even without movement. If the patient is "in there," the chaplain should feel a "being-looked-at" or a resonance, even in coma. If the patient is gone, the body becomes mere object. The chaplain's doubt arises because the perception is faint, not because the inference is weak.
  2.  **If Inferentialism is true:** The chaplain has *no data*. To decide the patient is "in there" is an act of faith or a wager (Pascal's Wager applied to cognition), not knowledge. The chaplain cannot "know" until the patient moves.
  3.  **The Joint Recommendation:** Both camps agree that in the absence of expression, **knowledge is suspended.** The Perceptualist has nothing to perceive; the Inferentialist has nothing to infer. Therefore, the chaplain's decision cannot rest on *epistemic certainty*. It must rest on an ethical commitment to treat the body *as if* the mind were present. The book ends honestly not when the chaplain *knows*, but when she decides that *knowing* is not the prerequisite for *vigil*.
