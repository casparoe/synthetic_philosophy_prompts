answer: |-
  # The Satisficing Sorter: A Decision Tree for Bounded Rationality

  **Instructions:** Start at the top. For each question, pick the scenario that best matches your view of the agent *at the moment deliberation stops*. Follow the arrow to the next question or to a final position leaf.

  ### **ROOT:** Deliberation Stops
  *Example: A shopper stops reading toaster reviews and buys one. A chess player stops calculating and moves a knight. A hiring committee stops interviewing and makes an offer.*

  ---

  ### **Q1. At the exact moment of choice, is the agent selecting the *best* option found so far (given the effort spent), or the first option that hits a *good enough* standard?**
  *   **A. Best Option:** The agent treats the choice as an optimization problem where "effort" is part of the cost function. *(Go to Q2)*
  *   **B. Good Enough:** The agent treats the choice as meeting a threshold; finding a "better" option beyond the threshold isn't the goal. *(Go to Q5)*

  ---

  ### **Q2. Did the agent decide *when* to stop by calculating the cost of thinking longer (e.g., time, energy), or did they stop because a limit was imposed from outside (e.g., a bell rang, memory filled up)?**
  *   **A. Calculated Cost:** The agent weighed the benefit of more thought against the cost of that thought. *(Go to Q3)*
  *   **B. External Limit:** The agent would have thought more, but hit a wall (time, budget, attention span). *(Go to Q4)*

  ---

  ### **Q3. What is the primary bottleneck in that cost calculation?**
  *   **A. Computation:** The cost is internal processing power (e.g., "My brain is tired," "Working memory is full").
      *   ➔ **LEAF 1: Costly Optimization (Computational)**
  *   **B. Information:** The cost is data quality (e.g., "More reviews are noisy," "Vitals are ambiguous").
      *   ➔ **LEAF 2: Costly Optimization (Informational)**

  ---

  ### **Q4. Is that external limit a fact about the agent's psychology, or a simplification for the theorist's model?**
  *   **A. Psychology:** The agent genuinely has a hard constraint (e.g., limited working memory slots).
      *   ➔ **LEAF 3: Hard-Constrained Maximization**
  *   **B. Model:** The agent might be complex, but we impose the bound to make the math solvable.
      *   ➔ **LEAF 4: Tractable Modeling**

  ---

  ### **Q5. Does the "good enough" standard (aspiration level) adjust based on the environment (e.g., lower standards in a bad job market), or is it a fixed internal target?**
  *   **A. Adjusts:** The threshold drifts based on experience or context (e.g., foraging patch quality). *(Go to Q6)*
  *   **B. Fixed:** The threshold is stable (e.g., "I need 500 calories," "I need a candidate with a PhD"). *(Go to Q7)*

  ---

  ### **Q6. Is that adjustment a cognitive skill the agent possesses, or just a pattern we observe to make predictions?**
  *   **A. Cognitive Skill:** The agent has a mechanism specifically for tuning thresholds to environments.
      *   ➔ **LEAF 5: Ecological Rationality**
  *   **B. Observed Pattern:** It doesn't matter what's in the head; we just describe behavior *as if* it adapts.
      *   ➔ **LEAF 6: Deflationary / Instrumentalist**

  ---

  ### **Q7. Is the failure to search further (beyond the fixed threshold) a cognitive error or a valid strategy?**
  *   **A. Cognitive Error:** The agent *should* be optimizing; stopping early is a bias or bug.
      *   ➔ **LEAF 7: Bounded Rationality as Bias**
  *   **B. Valid Strategy:** Optimization is impossible or unnecessary; the rule is the strategy.
      *   ➔ **LEAF 8: Plain Satisficing**

  ---

  ## **Leaf Key & Awkward Commitments**

  | Leaf | Position Name | The Awkward Commitment |
  | :--- | :--- | :--- |
  | **1** | **Costly Optimization (Computational)** | You must assume agents can accurately estimate the marginal cost of their own thinking without infinite regress. |
  | **2** | **Costly Optimization (Informational)** | You treat information noise as a cost comparable to time/energy, which requires a common currency of "effort." |
  | **3** | **Hard-Constrained Maximization** | You must specify exactly *which* cognitive resource is bounded (memory? time?) without making the model ad-hoc. |
  | **4** | **Tractable Modeling** | You admit your model is false by design, which makes it hard to claim your predictions explain *why* things happen. |
  | **5** | **Ecological Rationality** | You must claim the mind contains a "toolbox" of specific rules rather than one general intelligence, which feels fragmented. |
  | **6** | **Deflationary / Instrumentalist** | **⚠️ FLAG:** This leaf is empirically indistinguishable from an "As-If Optimizer" who doesn't care about psychology. You cannot separate them by asking about the agent's head. |
  | **7** | **Bounded Rationality as Bias** | You must define the "Optimal" benchmark that the agent is failing to meet, which often requires assuming unbounded powers they don't have. |
  | **8** | **Plain Satisficing** | You must explain why the aspiration level doesn't immediately drift to the maximum possible (which would turn this back into optimization). |

  ---

  ## **Unoccupied or Incoherent Combinations**

  *   **"Tractable Modeling" + "Costly Optimization":** Nobody occupies the spot where they claim the *agent* calculates costs but the *theorist* only does it for math convenience. If the agent does it, it's a psychological claim (Leaf 1/2); if only the theorist does it, it's Tractable Modeling (Leaf 4). This combo is **redundant**.
  *   **"Plain Satisficing" + "Cognitive Error":** If you think stopping at a fixed threshold is an error, you usually believe the agent *should* be optimizing (Leaf 7). If you think it's a valid strategy, it's Plain Satisficing (Leaf 8). Holding both is **incoherent** unless you specify different contexts.
  *   **"Ecological Rationality" + "Fixed Threshold":** By definition, Ecological Rationality requires the threshold to adjust to the environment (Q5). A fixed threshold cannot be ecologically rational in this framework. This combo is **unexplored/contradictory**.

  ---

  ## **Note on Indistinguishability**
  **Leaf 6 (Deflationary)** and the **"As-If Optimizer"** (often found in Leaf 1 or 2 among economists) cannot be separated by this tree. Both agree there is "no fact of the matter" about the internal mechanism, only about which description predicts the toaster purchase best. To separate them, you must ask a meta-question: *"Do you care if the psychological mechanism is real, or only if the prediction works?"*
