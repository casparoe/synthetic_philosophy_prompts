  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A historiography seminar stuck on the "presentism problem."
      *   **Camps:** Presentists (historians can't escape current standards; pretending otherwise is bad faith) vs. Contextualists (recovering past standards is central; importing present vocabulary is anachronistic).
      *   **Task:** Draft a *joint statement* both camps could sign.
      *   **Requirements:**
          1.  Agreed claims (evidence limits, explanation vs. endorsement, internal division within past societies).
          2.  Disagreements section (worded so each side accepts the description of their own position).
          3.  Specific Cruxes to address:
              *   Possibility of neutral description.
              *   Moral evaluation as task vs. object of explanation.
              *   Separability of vocabulary anachronism vs. judgment anachronism.
          4.  For each crux: Provide a shared test case/argument and each side's prediction/handling of it.
          5.  Closing note on verbal disputes.
          6.  **Format:** Numbered agreed-claims section followed by a disagreements table.

  2.  **Deconstruct the Positions (Mental Sandbox):**
      *   *Contextualists:* Want to understand the past "on its own terms." Fear moralizing clouds understanding. Believe we can bracket our values to analyze theirs.
      *   *Presentists:* Believe all understanding is filtered through current concepts. Fear "on its own terms" excuses injustice or obscures power dynamics visible only now. Believe historiography is a dialogue between past and present.
      *   *Common Ground:* Both want accurate history. Both agree evidence is finite. Both agree explaining $\neq$ endorsing. Both agree the past wasn't a monolith (there were dissenters then, too).

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Evidence:* Evidence is fragmentary and mediated. Neither side claims omniscience.
      *   *Explanation vs. Endorsement:* Crucial distinction. Explaining why slavery existed isn't supporting it.
      *   *Internal Division:* "The past's standards" is a fiction. There were always contestations. This weakens the Contextualist idea of a single "past standard" and the Presentist idea of a monolithic "past otherness."
      *   *Wording:* Needs to be neutral, precise, and acceptable to both. Avoid loaded terms like "objective truth" or "inevitable bias."

  4.  **Drafting Section 2: Disagreements (The Tricky Part):**
      *   *Constraint:* I need to state the disagreement in wording *each side would accept for its own position*. This means I can't write "Contextualists are wrong because..." I must write "Contextualists hold X, Presentists hold Y."
      *   *Crux 1: Neutral Description.*
          *   Contextualist: Possible/Goal.
          *   Presentist: Impossible/Illusion.
          *   *Test Case:* A historian using *only* actor categories (e.g., writing about witchcraft using only "maleficium" and never "delusion").
          *   *Predictions:* Contextualist says this achieves fidelity. Presentist says this hides the causal reality visible only now.
      *   *Crux 2: Moral Evaluation.*
          *   Contextualist: Task is to explain the moral landscape, not judge it from outside.
          *   Presentist: Task includes judging because history serves the present.
          *   *Test Case:* Judging a historical figure by today's human rights standards.
          *   *Predictions:* Contextualist says this distorts motivation. Presentist says this illuminates structural harm.
      *   *Crux 3: Vocabulary vs. Judgment.*
          *   Contextualist: Vocabulary carries judgment; avoid present terms to avoid present judgments.
          *   Presentist: Vocabulary is unavoidable; judgment is separate from the words used.
          *   *Test Case:* Using the term "genocide" for pre-20th-century events.
          *   *Predictions:* Contextualist says this imposes a legal/moral framework alien to the time. Presentist says this accurately names a phenomenon regardless of contemporary labels.

  5.  **Drafting Section 3: The Verbal Dispute Note:**
      *   Where are they talking past each other? Often about the definition of "understanding." Is understanding *replicating* their mindset, or *mapping* their actions onto our reality? Also, "presentism" is sometimes used as a slur vs. a description.

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I meet the constraint "wording each side would accept for its own position"?
      *   *Correction:* In the disagreement table, ensure the columns represent the *stance*, not an external critique. Use phrases like "We maintain..." or "Our position is..."
      *   *Check:* Did I address the "internal division" point in the agreed section? Yes, essential for nuance.
      *   *Tone:* Academic, conciliatory but firm on differences.
      *   *Formatting:* Numbered list for agreements, Table for disagreements.

  7.  **Final Review against Prompt:**
      *   Joint statement? Yes.
      *   Claims both accept (evidence, explanation/endorsement, internal division)? Yes.
      *   Disagreements table? Yes.
      *   Three cruxes (neutral description, moral evaluation, vocabulary/judgment)? Yes.
      *   Test case + predictions for each crux? Yes.
      *   Honest note on verbal disputes? Yes.

  8.  **Final Polish:** Ensure the language sounds like professional historians talking to each other. (e.g., using terms like "hermeneutic," "normative," "epistemic"). *Self-correction: Keep it accessible enough for a seminar statement, but rigorous.*

