answer: |-
  **JOINT STATEMENT ON THE PROBLEM OF PRESENTISM IN HISTORICAL PRACTICE**

  **I. AGREED CLAIMS**

  We, the undersigned participants in this seminar, representing both contextualist and presentist orientations, affirm the following propositions as the common ground of our historical practice:

  1.  **The Limits of Evidence:** We agree that historical evidence is fragmentary, mediated, and never speaks for itself. Neither camp claims that the past is fully recoverable. We acknowledge that all historical narratives are constructions based on silences and survivals, and that neither "past standards" nor "present standards" can be accessed without interpretive mediation.
  2.  **Explanation vs. Endorsement:** We agree on the logical distinction between explaining a past practice and endorsing it. To provide a causal or cultural account of why a society practiced slavery, sacrifice, or exclusion is not to morally validate those practices. Both camps reject the notion that historical understanding requires moral complicity.
  3.  **The Fiction of Monolithic Standards:** We agree that the phrase "the past's own standards" is a heuristic abstraction that does not name a singular reality. Past societies were internally divided, contested, and policed their own norms. There were always dissenters, victims, and reformers within the past whose voices complicate the idea of a unified "context." Therefore, appealing to "context" cannot simply mean appealing to the dominant ideology of the time, as that ideology was never total.
  4.  **The Inevitability of Selection:** We agree that the choice of *what* to study is always driven by present-day concerns. No historian studies every fact; the selection of topics is inevitably shaped by contemporary questions. The dispute lies not in whether the present influences the *choice* of topic, but in how the present influences the *evaluation* of evidence.

  ***

  **II. AREAS OF DISAGREEMENT**

  While we share the commitments above, we diverge on the epistemological and ethical aims of historical writing. The following table outlines our distinct positions. Each statement is drafted to be acceptable to the camp it describes.

  | Crux | The Contextualist Position | The Presentist Position |
  | :--- | :--- | :--- |
  | **1. On Neutral Description**<br>*(Is it possible to describe a past practice without importing current normative frameworks?)* | **We maintain that bracketing present values is a achievable disciplinary goal.** By rigorously adhering to the concepts and categories available to historical actors, we can produce a description that approximates how the world looked to them. This is not claiming "view from nowhere" objectivity, but rather a "view from then" fidelity. | **We maintain that neutral description is an illusion.** All description is selection, and all selection is guided by current concepts. To claim one has stepped outside the present is to hide the interpretive lens being used. Transparency about our current standpoint is more honest than the pretense of neutrality. |
  | **2. On Moral Evaluation**<br>*(Is moral judgment part of the historian's task or merely an object of explanation?)* | **We hold that moral evaluation is the object of explanation, not the historian's task.** Our job is to map the moral landscape of the past, not to judge it from an external vantage point. Judging the past by standards it could not access obscures the logic of historical action and turns history into moral therapy for the present. | **We hold that moral evaluation is an inescapable part of the historian's task.** History is a dialogue between past and present. Refusing to judge past injustices because they were "normal then" risks naturalizing harm. We argue that recognizing structural violence requires concepts that may not have existed for the actors themselves. |
  | **3. On Vocabulary and Judgment**<br>*(Can the anachronism of vocabulary be separated from the anachronism of judgment?)* | **We hold that vocabulary carries judgment.** To use a modern term (e.g., "genocide," "sexism") for a past event imports a specific legal and moral framework that distorts the actors' motivations. Avoiding anachronistic vocabulary is the primary method for avoiding anachronistic judgment. | **We hold that vocabulary and judgment are separable.** We can use modern analytical categories to identify patterns (e.g., systemic racism) that actors could not name, without necessarily condemning every individual actor by those standards. The utility of the concept outweighs the risk of lexical anachronism. |

  ***

  **III. TEST CASES AND PREDICTIONS**

  For each crux above, we agree that the following hypothetical cases bear directly on the validity of our positions. We record our differing predictions on how these cases should be handled.

  **Case 1: The Actor's Vocabulary**
  *Scenario:* A historian writes an account of 17th-century witchcraft trials using *only* the theological and legal categories of the accusers and accused (e.g., "maleficium," "diabolism"), never using modern terms like "mass hysteria," "misogyny," or "legal error."
  *   **Contextualist Prediction:** This approach preserves the *meaning* of the events for the participants. Using modern terms would explain the events away rather than understanding them.
  *   **Presentist Prediction:** This approach reproduces the *ideology* of the persecutors. It fails to explain the causal mechanisms (social stress, gender dynamics) visible only through modern vocabulary.

  **Case 2: The Judgment of Silence**
  *Scenario:* A historian writes a biography of a 19th-century reformer who fought for labor rights but owned slaves. The historian explicitly condemns the slave ownership in the introduction but analyzes the labor reform without reference to the contradiction.
  *   **Contextualist Prediction:** This creates a fragmented moral picture. The historian should explain how the subject reconciled these views within their own moral framework, rather than imposing an external contradiction the subject may not have felt.
  *   **Presentist Prediction:** This correctly identifies a moral blind spot that is historically significant. The subject's failure to see the contradiction is itself a historical fact that requires present-day concepts to illuminate.

  **Case 3: The Retroactive Label**
  *Scenario:* A historian applies the term "ethnic cleansing" to a population transfer in the 18th century, prior to the coinage of the term or the establishment of international law regarding it.
  *   **Contextualist Prediction:** This is a category error. It imposes a 20th-century legal/moral ontology on an 18th-century political practice, confusing the historian's analysis with the actors' reality.
  *   **Presentist Prediction:** This is a valid analytical move. Phenomena can exist before they are named. The term identifies a structural reality that was true then, even if unrecognized then.

  ***

  **IV. NOTE ON VERBAL DISPUTES**

  We acknowledge that a portion of our disagreement is verbal rather than substantive. Specifically, we often use the word **"understanding"** to mean different things.
  *   For **Contextualists**, "understanding" often means *replicating the internal logic* of the historical actor (Verstehen).
  *   For **Presentists**, "understanding" often means *mapping the causal and structural reality* of the past onto the present (Erklären).

  Furthermore, we acknowledge that **"Presentism"** is used ambiguously. Sometimes it refers to the *inevitable* influence of the present on inquiry (which Contextualists accept), and sometimes it refers to the *deliberate* subordination of past reality to present moral needs (which Contextualists reject). Clarifying these definitions would likely reduce the temperature of the debate, even if the methodological divergence remains.
