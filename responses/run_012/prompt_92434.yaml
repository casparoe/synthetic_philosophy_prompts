prompt: |-
  I am a professional mediator in the public sector — pay and grading disputes between a trust and a union, budget splits between two departments, service-level disagreements between a regulator and the body it oversees. I run two or three of these a month, the sums at stake are large, my only power is to recommend, and the parties have to sign the settlement themselves. I have no economics training. I want a decision procedure grounded in the Kalai–Smorodinsky bargaining solution — the idea that the fair settlement is where the straight line from the disagreement point to the ideal point (each side's best case if the other conceded everything) meets the set of feasible settlements — that I can actually run in a two-hour session after a day of preparation.

  Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a recommendation, and where it must be handed back to the parties because the question is one of values or of who should bear risk rather than of arithmetic. It has to say what to do when the feasible set is not a smooth trade-off but a bundle of all-or-nothing packages; when I cannot get honest numbers for anyone's utility and must work from stated claims instead; when a claim is an opening bid rather than a genuine ideal point; and what to tell the parties when the outcome shifts because an option nobody wanted was added or withdrawn. Mark the steps that are judgment calls wearing the costume of a formula, and say plainly what the procedure cannot do.

  Then run it on three disputes: a pay claim; a budget split between two departments where one carries a statutory duty the other lacks; and one where it hands most of the surplus to the party I privately think has the weaker case, and say whether I should follow it anyway.

  Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Professional public sector mediator (pay/grading, budget splits, service-level agreements).
      *   **Context:** High stakes, 2-3 cases/month, recommendatory power only, parties must sign, no economics training.
      *   **Goal:** A decision procedure grounded in the Kalai-Smorodinsky (KS) bargaining solution, runnable in a 2-hour session after 1 day prep.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Stop conditions (recommendation vs. handback).
          *   Handling specific complexities: non-smooth feasible sets (packages), dishonest utility/claims, opening bids vs. ideal points, IIA violations (adding/removing options).
          *   Identification of "judgment calls wearing the costume of a formula."
          *   Explicit statement of limitations.
          *   Application to three specific cases (Pay, Budget Split, Counter-intuitive Outcome).
          *   British English.

  2.  **Deconstruct the Kalai-Smorodinsky (KS) Solution:**
      *   *Core Concept:* Bargaining solution where the outcome lies on the line connecting the Disagreement Point ($d$) and the Ideal Point ($a$), intersecting the Pareto Frontier (Feasible Set $S$).
      *   *Inputs needed:*
          1.  Disagreement Point ($d$): What happens if no deal is made? (Status quo, strike, arbitration, etc.)
          2.  Ideal Point ($a$): What is the best possible outcome for each party *assuming the other gets their minimum acceptable*? (Crucial distinction: KS uses "utopia point" where each gets their max possible within $S$, not necessarily what they *want*).
          3.  Feasible Set ($S$): What deals are actually possible?
      *   *Challenge for Mediator:* Utilities are rarely cardinal or comparable. Public sector disputes involve qualitative factors, statutory duties, and political constraints.
      *   *Adaptation:* Need to operationalize KS without requiring utility functions. Use "claims" and "concessions" as proxies for utility, normalised to a 0-1 scale.

  3.  **Drafting the Procedure (The "KS-Mediation Protocol"):**
      *   *Preparation:* Need to define the variables before the 2-hour session.
      *   *Step 1: Define the Disagreement Point ($d$).* If no deal, what happens? (Cost, risk, service failure).
      *   *Step 2: Define the Ideal Claims ($I$).* Not "what I want," but "what is the maximum conceivable gain."
      *   *Step 3: Map the Feasible Set ($S$).* What are the actual options?
      *   *Step 4: Normalisation.* Convert diverse metrics (money, risk, time) into a common scale (0 to 1).
      *   *Step 5: The Intersection.* Find the package closest to the KS line.
      *   *Handling Complexities:*
          *   *Packages:* Use scoring.
          *   *Dishonesty:* Test for consistency, use "best alternative" logic.
          *   *Opening Bids:* Distinguish between "aspirational" and "feasible ideal."
          *   *IIA (Independence of Irrelevant Alternatives):* KS violates IIA. Need to explain this to parties.
      *   *Judgment Calls:* Defining $d$, validating $I$, weighting non-monetary factors.

  4.  **Refining the Procedure for the User's Constraints:**
      *   *Time:* 2 hours is tight. The prep day is crucial.
      *   *No Econ Training:* Avoid calculus. Use ratios and percentages.
      *   *Public Sector:* Emphasise statutory duties and public value, not just profit.
      *   *Recommendatory:* The mediator proposes; parties decide.

  5.  **Developing the Three Case Studies:**
      *   *Case 1: Pay Claim.* Union wants 10%, Trust offers 2%. Inflation 5%. Disagreement = Strike (costly). Ideal = 10% vs 0%. KS splits the "surplus" proportionally based on max potential.
      *   *Case 2: Budget Split.* Dept A (Statutory) vs Dept B (Discretionary). Feasible set is constrained by law. KS might favour A heavily.
      *   *Case 3: Counter-intuitive.* KS gives surplus to the "weaker" party. Why? Perhaps their disagreement point is less painful, or their ideal point is more constrained. *Self-Correction:* Actually, KS favours the party with more "room to gain" relative to their ideal. If the "weaker" party has a very strong BATNA (Disagreement point), KS protects them. Or, if the "stronger" party's ideal is unrealistic. I need to construct a scenario where the math favours the intuitively weaker party to test the user's commitment to the procedure.

  6.  **Addressing Specific Constraints & Warnings:**
      *   *Judgment Calls:* Identifying the "True Ideal" vs "Bluff." Defining the "Disagreement Cost."
      *   *Limitations:* Cannot resolve fundamental value conflicts (e.g., safety vs. cost). Cannot enforce.
      *   *British English:* "Programme," "Centre," "Labour," "£," "Minimise."

  7.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the difficulty. KS is theoretical; this is a practical adaptation.
      *   *The Protocol:* Break it down into Prep and Session.
      *   *Questions:* Make them direct. "What is the cost of no deal?" "What is the absolute maximum?"
      *   *Sufficient Answer:* Needs numbers or ranked orders.
      *   *Stop/Handback:* If values clash (e.g., ethics), hand back. If arithmetic, recommend.
      *   *Complexities:*
          *   *Packages:* Score them 0-100.
          *   *Dishonesty:* Triangulate with external data.
          *   *IIA:* Explain that removing a bad option changes the "Ideal," thus changing the line.
      *   *Case Studies:*
          1.  *Pay:* Standard application.
          2.  *Budget:* Statutory duty makes the feasible set asymmetric.
          3.  *Counter-intuitive:* Need a specific setup. Let's say Party A has a high ideal but high risk of no-deal. Party B has a low ideal but guaranteed no-deal outcome. KS might favour B. *Wait, KS is about proportional gain.* If Party A's ideal is huge but unrealistic, the line is shallow. If Party B's ideal is modest but solid, the line is steep. Let's create a scenario where the "weaker" party has a better Disagreement Point (BATNA), making the KS solution favour them to avoid the costly no-deal. *Actually, better:* A scenario where the "stronger" party's ideal point is constrained by the feasible set more than the "weaker" party's.
      *   *Ethical Check:* Should the mediator follow the math if it feels wrong? Yes, if the input was agreed upon. If the input was flawed, revisit inputs.

  8.  **Review against Constraints:**
      *   *British English?* Check spelling and terminology (e.g., "Trade Union," "Public Sector," "£").
      *   *No Econ Training?* Keep math to percentages and linear interpolation.
      *   *2-Hour Session?* Ensure the steps are actionable within that timeframe.
      *   *Judgment Calls?* Explicitly label them.

  9.  **Final Polish:**
      *   Ensure the tone is professional, authoritative, yet humble about the method's limits.
      *   Make sure the "Counter-intuitive" case analysis addresses the "should I follow it" question directly.

  *(Self-Correction during drafting Case 3)*: I need to be careful. KS says gains should be proportional to the maximum possible gain. If Party X can gain 100 but Party Y can only gain 10, KS gives X more. To make it favour the "weaker" party, the "weaker" party must have a *higher* potential gain relative to their current position, or the "stronger" party's ideal point must be severely capped by feasibility. Let's go with the latter: The "strong" party's ideal is mathematically impossible within the feasible set, shrinking their proportional claim.

  *(Refining the "Judgment Call" section)*: I must be clear that KS is not magic. It relies on the *definition* of the Ideal Point. If the mediator accepts a bluff as an Ideal Point, the result is skewed. This is the key judgment call.

  10. **Final Output Generation** (incorporating all thoughts into the structured response).
answer: |-
  **To:** Senior Mediator, Public Sector
  **From:** Advisory Desk
  **Subject:** Operationalising the Kalai–Smorodinsky Protocol for Public Disputes

  You have asked for a procedure that translates a theoretical economic concept into a tool for the rough and tumble of public sector mediation. The Kalai–Smorodinsky (KS) solution is elegant: it dictates that parties should share the "surplus" of cooperation in proportion to their maximum possible gains. It preserves monotonicity (if the pie gets bigger, no one should get less) but ignores the Independence of Irrelevant Alternatives (removing a bad option can change the outcome).

  In theory, this requires cardinal utility functions. In your world, you have posturing, statutory constraints, and budget caps. What follows is a **KS-Mediation Protocol**. It is not a calculator; it is a structured way to force parties to quantify their aspirations and risks so that the arithmetic of fairness becomes visible.

  ---

  ### Part 1: The Protocol (Preparation and Session)

  You have one day for preparation and two hours for the joint session. Do not attempt to calculate utilities. Calculate **normalised scores (0 to 1)**.

  #### Phase 1: Preparation (The Day Before)
  *Goal: Define the variables so the 2-hour session is for validation, not discovery.*

  **1. Define the Disagreement Point ($d$)**
  *   **Question to ask separately:** "If we leave this room without a signature, exactly what happens tomorrow? What is the cost, the risk, and the service impact?"
  *   **Sufficient Answer:** A quantified cost (e.g., £500k strike cost, 3-month delay) or a ranked risk profile (High/Medium/Low) converted to a score of 0.
  *   **Mediator Judgment:** You must verify this. If the Union says "All-out strike" and the Trust says "No impact," you must find the objective probability. *This is a judgment call wearing the costume of a fact.*

  **2. Define the Ideal Point ($I$)**
  *   **Question to ask separately:** "Assuming the other side agrees to everything physically and legally possible, what is the absolute maximum you could achieve? Not what you expect, but the ceiling."
  *   **Sufficient Answer:** A specific number or state (e.g., "10% pay rise," "Full budget allocation").
  *   **Mediator Judgment:** Distinguish between a **Bluff** (opening bid) and a **Feasible Ideal**. If they ask for 20% but the budget cap is 5%, the Ideal is 5%. *This is the critical judgment call.* If you accept a bluff as an Ideal, the KS line skews unfairly.

  **3. Map the Feasible Set ($S$)**
  *   **Task:** List the actual packages on the table.
  *   **Sufficient Answer:** A menu of 3–5 distinct options, ranging from "Close to $d$" to "Close to $I$".

  #### Phase 2: The Session (Two Hours)

  **Hour 1: Validation and Normalisation**

  **Step 1: Confirm the Disagreement Point ($d$)**
  *   **Ask:** "We have recorded the cost of no-deal as $X$. Does both sides accept this as the baseline zero?"
  *   **Stop Condition:** If one party claims the no-deal outcome is a *gain* for them (e.g., they want the fight), KS fails. **Hand back.** KS requires both parties to prefer agreement over disagreement.

  **Step 2: Confirm the Ideal Points ($I_A, I_B$)**
  *   **Ask:** "We have recorded your maximum feasible claim as $Y$. If I recommend this, are you saying anything less is a loss relative to your potential?"
  *   **Stop Condition:** If a party refuses to cap their ideal, you cannot draw the line. **Hand back.** You cannot mediate infinite aspirations.

  **Step 3: Normalise the Scores**
  *   Convert every package into a score from 0 to 1 for each party.
  *   $0 = $ Disagreement Point ($d$).
  *   $1 = $ Ideal Point ($I$).
  *   **Ask:** "On a scale where No Deal is 0 and your Max Ideal is 1, how do you score Package A?"
  *   **Sufficient Answer:** A number. If they say "It's complicated," force a number. "I need a number to draw the line."

  **Hour 2: The Intersection and Recommendation**

  **Step 4: Draw the KS Line**
  *   Plot Party A's score on the X-axis, Party B's on the Y-axis.
  *   Draw a line from $(0,0)$ to $(1,1)$. This represents **equal proportional gain**.
  *   *Note:* Standard KS allows for asymmetric bargaining power. In public sector mediation, unless there is a legal asymmetry, assume equal weight (the 45-degree line). If there is statutory asymmetry (see Case 2), adjust the slope.

  **Step 5: Find the Feasible Intersection**
  *   Plot the packages from Step 3 on the graph.
  *   Identify the package closest to the 45-degree line without exceeding the feasible frontier.
  *   **Recommendation:** "The arithmetic of proportional gain points to Package C."

  **Step 6: The Handback Test**
  *   **Ask:** "Does this outcome violate a core value or statutory duty that cannot be quantified?"
  *   **Stop Condition:** If the math requires breaking the law or ethical code, **Hand back.** Arithmetic cannot override statute.

  ---

  ### Part 2: Handling Complexities

  **1. The Feasible Set is Lumpy (All-or-Nothing Packages)**
  *   **Problem:** KS assumes a smooth curve. You have discrete options (e.g., "Strike Deal" vs "No Strike").
  *   **Procedure:** Do not interpolate between packages. Select the discrete package that minimises the distance to the KS line.
  *   **Warning:** Tell the parties: "Because options are discrete, perfect proportionality is impossible. We are choosing the 'least unfair' deviation."

  **2. Dishonest Utilities (Stated Claims vs. Real Desire)**
  *   **Problem:** Party A inflates their Ideal Point to skew the line.
  *   **Procedure:** Use the **Preparation Phase** to challenge the Ideal. "You claim 10% is the ideal, but the Treasury cap is 4%. I am recording 4% as the Ideal for the calculation."
  *   **Limitation:** If they insist on the bluff during the session, you must state: "If I use 10%, the recommendation shifts to Package X. If I use 4%, it shifts to Package Y. Which reality are we mediating?" Force them to choose the reality.

  **3. Opening Bids vs. Ideal Points**
  *   **Problem:** Parties treat their opening bid as the KS Ideal.
  *   **Procedure:** Rename the variable. Call it the **Maximum Conceivable Concession (MCC)**.
  *   **Script:** "The KS solution requires the *maximum possible* gain, not the *desired* gain. If your MCC is not physically possible, the formula breaks."

  **4. Violation of Independence of Irrelevant Alternatives (IIA)**
  *   **Problem:** Adding or removing a "poison pill" option changes the Ideal Point, which changes the KS line, which changes the recommendation on the *good* options.
  *   **Procedure:** When an option is withdrawn, recalculate the Ideal.
  *   **Script:** "By removing Option Z, your maximum possible gain has decreased. The line of fairness has rotated. The recommendation changes not because the deal changed, but because your potential ceiling lowered."
  *   **Judgment Call:** If a party withdraws an option solely to manipulate the KS line, call it out. "You are gaming the denominator. I will freeze the Ideal Point at its previous value for the sake of stability."

  ---

  ### Part 3: What the Procedure Cannot Do (Limitations)

  1.  **Incommensurability:** It cannot trade "Safety" for "Money" unless both parties agree on a conversion rate. If one side says "Safety is priceless," KS fails.
  2.  **Risk Attitudes:** KS assumes risk neutrality. If the Union is risk-averse (fears job loss) and the Trust is risk-seeking, KS may recommend a deal the Union fears. You must adjust the scores for risk premium manually.
  3.  **Justice vs. Efficiency:** KS finds an *efficient* fair split, not necessarily a *just* one. It does not account for historical wrongs or moral desert.
  4.  **The "Costume" Warning:** The most dangerous step is **Step 2 (Defining the Ideal)**. This is where you decide what is "possible." That is a political judgment, not a mathematical one. You are deciding the boundaries of the debate under the guise of setting a variable.

  ---

  ### Part 4: Case Applications

  #### Case 1: Pay and Grading Dispute (Trust vs. Union)
  *   **Context:** Union asks for 10%. Trust offers 2%. Inflation is 5%.
  *   **Disagreement Point ($d$):** Strike. Cost to Trust £1m. Cost to Union (lost wages) £500k. Both score 0.
  *   **Ideal Point ($I$):**
      *   Union: 10% (Mediator assesses budget cap allows 6%. **Set Ideal at 6%**).
      *   Trust: 0% increase (Mediator assesses statutory duty to pay living wage implies min 4%. **Set Ideal at 4% savings**).
      *   *Normalisation:* Range is 4% to 6%.
  *   **Feasible Set:** 3%, 4%, 5%.
  *   **KS Calculation:**
      *   Union Gain at 5%: (5-4)/(6-4) = 0.5 (50% of potential).
      *   Trust Gain at 5%: (6-5)/(6-4) = 0.5 (50% of potential).
      *   *Note:* Here the "Ideal" for the Trust is saving money, for the Union it is gaining money.
  *   **Recommendation:** 5%. It splits the feasible surplus proportionally.
  *   **Verdict:** Follow it. It is a standard distributional conflict where KS works best.

  #### Case 2: Budget Split (Dept A vs. Dept B)
  *   **Context:** £10m surplus. Dept A has a statutory duty (legal minimum spend £8m). Dept B has no statutory duty (discretionary).
  *   **Disagreement Point ($d$):** Central Government reclaims the surplus. Both get 0 of the surplus.
  *   **Ideal Point ($I$):**
      *   Dept A: £10m (The whole surplus).
      *   Dept B: £10m (The whole surplus).
  *   **Feasible Set:** Constrained by law. Dept A *must* get £8m base + share of surplus. Dept B can only get share of surplus.
  *   **KS Adjustment:** The Feasible Set is not symmetric. Dept A's "minimum" is higher.
  *   **Calculation:**
      *   The KS line must respect the statutory floor. The "game" is only over the remaining £2m.
      *   If both claim the full £2m as Ideal.
      *   KS suggests 50/50 split of the *discretionary* £2m.
  *   **Recommendation:** Dept A gets £9m, Dept B gets £1m.
  *   **Verdict:** Follow it. KS handles constraints well if the Feasible Set is defined correctly *before* drawing the line. The statutory duty shrinks the feasible set; KS divides what remains.

  #### Case 3: The Counter-Intuitive Outcome (Regulator vs. Overseen Body)
  *   **Context:** Dispute over service levels.
      *   **Party A (Regulator):** Wants high compliance. "Ideal" is 100% compliance. "Disagreement" is public scandal (High cost).
      *   **Party B (Body):** Wants low cost. "Ideal" is 80% compliance (max feasible). "Disagreement" is public scandal (Low cost, they are insulated).
  *   **The Twist:** You privately believe Party B is negligent (the "weaker" moral case).
  *   **KS Inputs:**
      *   Party A Ideal: 100%. Disagreement: 0 utility.
      *   Party B Ideal: 80%. Disagreement: 0 utility.
      *   Feasible Set: 80% to 95% compliance.
      *   *Crucial Variable:* Party B's Disagreement Point is less painful than Party A's. In KS, if we normalise utility, we assume 0 is 0. But if Party B cares *less* about no-deal, their utility curve is flatter.
      *   *Simplified KS:* If we treat the "Ideal" as the max feasible.
      *   Party A Max Gain: 95% - 80% (status quo) = 15%.
      *   Party B Max Gain: Cost saving at 80% vs 95%.
      *   *Scenario:* Suppose the feasible set shifts such that Party B's "Ideal" (80%) is very close to the disagreement point in terms of risk, but Party A's "Ideal" is far away.
      *   *Actually, let's use the IIA violation:* A third option (Privatisation) was on the table. Party B hated it. It is withdrawn. This changes Party B's Ideal Point relative to the set.
      *   *Result:* The KS line shifts to favour Party B because their "maximum possible gain" relative to the new feasible set is proportionally larger than Party A's. The math awards the surplus to Party B.
  *   **Should you follow it?**
      *   **Yes.**
      *   **Reasoning:** You are a mediator, not a judge. Your power is procedural legitimacy. If you override the KS recommendation because you dislike Party B, you have abandoned the neutral procedure for your own moral intuition.
      *   **Caveat:** You must verify the inputs. Did Party B manipulate the "Ideal Point"? If Party B claimed 80% was the max feasible when 90% was possible, that is a lie in the input, not the math.
      *   **Action:** If the inputs are honest, follow the math. If the outcome is morally repugnant, the fault lies in the **Disagreement Point**. If Party B faces no consequence for no-deal, KS protects them. You should recommend the KS outcome *but* attach a written warning to the Regulator: "The formula favours Party B because their risk of no-deal is low. To shift the outcome, you must increase the cost of the Disagreement Point (e.g., threaten stronger sanctions)."
      *   **Why:** This empowers the parties to change the variables rather than you acting as a dictator. It keeps you within your remit.

  ### Final Instruction

  Use this protocol to structure the argument, not to dictate the truth. When the math contradicts your gut, check the **Ideal Point** definition. That is where your judgment lives. If the inputs are sound, trust the procedure. If the output is unsustainable, the procedure has revealed that the dispute is not about arithmetic, but about power. In that case, hand it back.
