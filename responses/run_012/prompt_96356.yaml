prompt: |-
  Right, I've just got back from a three-hour argument down the pub with my mate Dan and I need a second opinion, because he's got a philosophy degree and I haven't, so every time I suspect he's bluffing I end up assuming I must be the one who's missed something. Could you take the role of someone who actually works on this stuff -- moral psychology, the akrasia debate, the decision-theory literature on intertemporal choice -- and go through his whole spiel properly? Take your time with it, and maybe start by writing out the distinctions you think are actually doing the work here before you get into the weeds, then do a sentence-by-sentence audit. I don't want a diplomatic summary; I want to know which bits a specialist would nod at, which they'd wince at, and which are just wrong, and then whether the conclusion he draws still stands once you've fixed the dodgy bits. Also flag anything he got right that I might be too quick to dismiss.

  Here's his case, as best I can remember it:

  'Weakness of will is basically just hyperbolic discounting. When you lie in bed scrolling instead of sleeping, or eat the cake instead of sticking to the diet, what's really happening is that your short-term self outvotes your long-term self -- your discount curve bends, the present gets weighted far too heavily, and that's time-inconsistent preferences for you. So akrasia just is a preference-reversal phenomenon. And it's a failure of rationality, because exponential discounting is the rational benchmark: it's the only curve that keeps your preferences consistent across time, so anyone discounting hyperbolically is being irrational, full stop. Davidson said more or less the same thing -- the akratic person's better judgement just gets overridden by a stronger desire, so it's a straight contest of forces and the strongest desire wins. Socrates thought akrasia was impossible, which is why Aristotle had to dress it up as a special kind of ignorance. And the whole "multiple selves" business is just a metaphor -- there aren't two agents inside you, so it doesn't buy you anything. Honestly the problem dissolves once you see that if you prefer the cake now and the diet later, you've simply changed your mind; there's no failure of will, only a change in what you want.'

  I think alot of that is right and some of it is him bluffing, but I genuinely can't tell which is which. My instinct is that akrasia is a real phenomenon and that the multiple-selves stuff is at least useful rather than a mere metaphor, but I don't know if that's a defensible position or just something I've absorbed. Is there also something he's missing entirely that someone in the field would insist on? I'm definately not after a reading list or citations -- just the analysis.
