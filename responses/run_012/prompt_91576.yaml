answer: |-
  This is a solid, well-trodden position in decision theory (championed by folks like Michael Smith, Paul Weirich, and implicitly accepted by many bounded-rationality advocates). It is not a crackpot view; it is the standard "escape hatch" for Pascal's Mugging.

  However, you asked to be knocked off it. You want the costs, the defeaters, and the things a committed bounded-utility agent must concede.

  Here is the breakdown, ranked from **Fatal** (contradicts your core commitments) to **Awkward** (costs you theoretical elegance), followed by the meta-assessment you requested.

  ---

  ### 1. The Fatal Defeater: Violation of VNM Axioms (The Rationality Cost)
  **Status:** *Fatal if you claim to be a standard Expected Utility Maximizer.*

  You claim this isn't an argument against EV maximization "as such." But mathematically, it is.

  If you accept the Von Neumann-Morgenstern (VNM) axioms (Completeness, Transitivity, Continuity, Independence) over a domain of unbounded outcomes (e.g., "number of lives saved," which has no *a priori* ceiling), **your utility function must be unbounded.**

  *   **The Theorem:** If you prefer more lives saved to fewer, and you accept the Continuity axiom, there is no finite cap on utility. For any lottery $L$, there is a probability $p$ such that you are indifferent between $L$ and a chance $p$ at saving infinite lives (or sufficiently large finite lives).
  *   **The Cost:** To bound utility, you must violate **Continuity** or **Independence**.
      *   If you violate Continuity: You become susceptible to **Dutch Books**. There are sequences of trades you will accept that guarantee a loss, simply because you refuse to trade a tiny probability of a "cap-level" good for a certainty of a "near-cap-level" good.
      *   If you violate Independence: Your preferences become context-dependent in ways that allow **Money Pumps**.

  **The Concession:** You cannot say, "I am bounding utility to save EV maximization." You must say, "I am bounding utility to save my sanity, and I accept that I am no longer a VNM-rational agent in the strict sense." You are trading formal rationality for pragmatic safety. If you value Dutch-book immunity, this solution is fatal.

  ### 2. The Fatal Defeater: Moral Scope Neglect (The Normative Cost)
  **Status:** *Fatal if you are a Consequentialist/Utilitarian.*

  This is the substantive moral cost. A bounded utility function implies **saturation**.
  If your utility is capped at $U_{max}$, then there exists some number of happy lives $N$ such that a universe with $N$ happy lives is effectively equivalent in value to a universe with $N \times 10^{100}$ happy lives.

  *   **The Mugging Survival:** You survive Pascal's Mugging because the mugger cannot offer you more than $U_{max}$.
  *   **The Collateral Damage:** You also become indifferent to preventing human extinction if the probability is low enough.
      *   Suppose $U_{max}$ corresponds to the value of $10^{20}$ future lives.
      *   Suppose an asteroid has a $10^{-10}$ chance of wiping out $10^{30}$ future lives.
      *   An unbounded agent sees an expected loss of $10^{20}$ lives (Huge priority!).
      *   A bounded agent sees an expected loss of roughly $10^{-10} \times U_{max}$ (Negligible priority, likely below the threshold of action).

  **The Concession:** You must admit that **scope neglect is a feature, not a bug.** You are accepting that, normatively, saving a googolplex of lives is not significantly better than saving a trillion. Most consequentialists find this morally repugnant. It solves the Mugging by making you care less about the far future, which defeats much of the motivation for long-termist ethics.

  ### 3. The Awkward Defeater: The Arbitrary Threshold (The Meta Cost)
  **Status:** *Awkward / Ad Hoc.*

  You asked if this is unfalsifiable: *"Whatever the mugger offers, it's below my floor, by construction."*

  If you set your cap at $10^{100}$ utils, and the mugger returns tomorrow claiming to represent a being who can grant $10^{101}$ utils, what do you do?
  *   **Option A:** You hold firm. Then your cap was arbitrary. Why $10^{100}$ and not $10^{101}$? If the cap is just "whatever number makes the mugger go away," it is indeed ad hoc.
  *   **Option B:** You raise the cap. Then you haven't solved the problem; you've just kicked the can down the road until the mugger finds a bigger number.

  **The Concession:** To avoid this, you must ground the cap in something external to the mugging scenario (e.g., "human cognitive capacity to value"). But if you ground it in psychology ("I can't *feel* the difference"), you are making a descriptive claim about brains, not a normative claim about value. You are saying "I am bounded because I am human," not "I am bounded because it is rational."

  ### 4. Clarification: The St. Petersburg Objection
  **Status:** *You are safe here (but for the wrong reason).*

  You asked: *"Does bounding utility even help against a St. Petersburg–flavored mugging, where every individual payoff is bounded but the structure still yields a divergent expected value?"*

  **Correction:** If **Utility** is bounded, St. Petersburg divergence is mathematically impossible.
  *   St. Petersburg diverges because Payoff ($2^n$) grows faster than Probability ($1/2^n$) shrinks.
  *   If $U(\text{Payoff})$ is bounded by $M$, then $E[U] = \sum p_i \cdot u_i \le \sum p_i \cdot M = M$.
  *   The sum *must* converge.

  **The Nuance:** You might be confusing bounded *payoffs* (money) with bounded *utility*. If payoffs are money and utility is logarithmic (unbounded), St. Petersburg still diverges. But if you strictly bound *utility* (e.g., $U(x) = \tanh(x)$), St. Petersburg collapses.
  **Verdict:** This is not a defeater for your view. Strict bounded utility kills St. Petersburg dead.

  ### 5. The Awkward Defeater: The Many Muggers (Aggregation)
  **Status:** *Awkward, but manageable.*

  You worried about a population of muggers.
  *   **Scenario:** 1,000,000 independent muggers each ask for $\$5$ for a $10^{-6}$ chance at $U_{max}$.
  *   **Math:** $1,000,000 \times (10^{-6} \times U_{max}) = U_{max}$.
  *   **Result:** The aggregate expected utility hits your cap. You should pay all of them.

  **The Concession:** Bounded utility does not protect you from **death by a thousand cuts**. It only protects you from a single, massive outlier. If the world is sufficiently noisy with low-probability high-impact claims, your "bounded budget" will be exhausted, and you will end up acting exactly like an unbounded agent, just with a delay. You aren't immune to the logic; you just have a higher activation energy.

  ---

  ### The "Surviving Mugging" (The One That Breaks Bounds)

  You asked for a mugging that survives the bound without obviously being a cheat. Here it is:

  **The "Cap-Hitting" Wager.**
  Don't offer me $3 \uparrow\uparrow\uparrow 3$ lives. Offer me exactly enough lives to hit my utility cap, with a probability just high enough to exceed the cost.

  *   **Setup:** I have a utility cap equivalent to saving $10^{20}$ lives.
  *   **Offer:** A mugger asks for $\$100$. They claim that with probability $10^{-9}$, they will save $10^{20}$ lives (hitting my cap).
  *   **Calculation:** $10^{-9} \times U_{cap}$ vs. Cost of $\$100$ (which has non-zero utility).
  *   **Problem:** If $U_{cap}$ is high enough, $10^{-9} \times U_{cap}$ still dwarfs the utility of $\$100$.

  **Why this hurts:** It shows that bounding utility doesn't stop you from paying muggers; it just stops you from paying muggers who promise *more than the cap*. But since the cap must be high (to avoid the Scope Neglect issue above), the mugger only needs to promise a "cap-level" outcome with a *modestly* tiny probability. You are still vulnerable to "Pascal's Wager" style arguments, just not "Pascal's Mugging" style arguments. You haven't escaped the vulnerability to low-probability claims; you've just capped the upside.

  ### The Meta-Question: Is this Unfalsifiable?

  > *"Whatever the mugger offers, it's below my floor, by construction?"*

  **Yes, it is.** And that is a problem.

  If your defense is "My utility function is defined such that the mugger cannot win," you have insulated your decision theory from empirical reality.
  *   **Falsifiability:** A theory is useful if it can tell you when you *should* pay the mugger. (e.g., "If the probability is $> 1\%$, pay.")
  *   **Your Theory:** Tells you "Never pay, because the offer is defined as too good to be true."

  **Is this fine?**
  *   **Descriptively:** Yes. Humans *are* bounded. We *do* ignore probabilities below $10^{-6}$. Describing human behavior this way is accurate.
  *   **Normatively:** No. If you are prescribing how an AI *should* act, or how we *ought* to reason, "I defined my values to ignore this" is circular. It solves the mathematical problem by refusing to engage with the ontological possibility of high-leverage actions.

  ### Summary of the Trade-Off

  You asked what bounding utility costs you. Here is the invoice:

  1.  **Rationality:** You violate VNM Continuity/Independence (Risk of Dutch Books).
  2.  **Morality:** You accept Scope Neglect (Future generations don't matter linearly).
  3.  **Robustness:** You remain vulnerable to "Cap-Hitting" wagers (Pascal's Wager remains).
  4.  **Justification:** Your cap is either arbitrary (ad hoc) or psychological (descriptive, not normative).

  **Final Verdict:** You haven't solved Pascal's Mugging; you've dissolved it by changing the definition of "Value." This is a valid move, but it forces you to abandon the claim that you are maximizing *Expected Value* in the standard sense. You are now a **Satisficer** or a **Bounded-Agent Maximizer**. If you are okay with that label, your position holds. If you want to keep the label "Rational EV Maximizer," this position is fatal.
