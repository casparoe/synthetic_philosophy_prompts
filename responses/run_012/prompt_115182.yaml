      *   *Sentence 6:* "The upshot is that a Solomonoff inductor should expect, with probability approaching one, to be a simulation run by an agent inside one of these bloated hypotheses, and that the expected quantity of suffering in the world is astronomically large."
          *   *Analysis:* "Probability approaching one" is very strong. Usually, the argument is that the probability is *significant enough* to matter for decision-making, not necessarily $> 0.99$. "Suffering" again links to s-risk.
