  6.  **Final Polish:** Check tone. Ensure it sounds like an audit, not a lecture. Ensure the distinction between the "complexity of the universe" and the "complexity of the program outputting the observations" is clear.

      *(Self-Correction on Reference Machine)*: The invariance theorem says $|M_1 - M_2| \leq C$. If $C$ is huge, the "universal" prior isn't practically universal for finite data. The malignity argument often assumes a "natural" reference machine where consequentialists are simple. Critics argue a natural reference machine might make consequentialists complex.

