      *   *Sentence 5:* "Add that some of those hypotheses contain agents, and consequentialists at that, who will themselves simulate observers in order to predict their surroundings, and the prior becomes still more top-heavy, since a hypothesis containing a consequentialist carries a built-in reason to generate copies of you."
