answer: |-
  **Exam Question**

  In *On a Supposed Right to Lie from Philanthropy*, Kant argues that one cannot lie to a murderer at the door. Standard critiques treat this as a conflict between a rigid rule of truth-telling and the consequences of harm. Reject this framing. Assume the speaker is compelled to speak (silence and evasion are unavailable). The interpretive crux is the scope of the prohibition: Does the duty of veracity govern the *propositional content* of any assertion made to another human being, or does it govern only *declarations* addressed to an agent with a rightful claim to the speaker's sincerity?

  Explicate these two readings. What must the "Content" reading concede regarding the agent's relationship to the murderer's wrongdoing? What must the "Standing" reading concede regarding the epistemic burden on the speaker? Finally, determine whether, on the "Standing" reading, the case constitutes a genuine moral objection to Kant's system or dissolves into a question of juridical entitlement.

  ***

  **Model Answer**

  The "Murderer at the Door" is typically read as a tragedy of deontology, where fidelity to a rule overrides the preservation of life. However, this relies on a "Content" reading of the duty of veracity, which holds that the prohibition against falsehood applies to the propositional content of any assertion, regardless of the recipient's status. On this reading, truthfulness is a perfect duty owed to humanity as such. To lie is to vitiate the source of right (*Rechtsquelle*) itself. The agent must concede that by telling the truth, they become a causal link in the murderer's success, yet they remain morally innocent because the integrity of speech is a precondition for all contractual and civil obligation. The moral cost is high: the agent preserves the formal condition of right at the expense of material harm to a friend. This reading renders Kant vulnerable to the charge of moral absurdity, as it prioritizes the metaphysical status of speech over the physical survival of a person.

  Conversely, a "Standing" reading locates the duty within Kant's *Doctrine of Right*. Here, the duty of veracity is not a free-floating ethical imperative but a juridical obligation triggered only when the interlocutor has a rightful claim to the truth. A declaration (*Aussage*) is distinct from mere speech; it is a speech-act that invokes a civil condition. On this reading, the murderer, by acting outside the law and employing coercive force, forfeits their standing to demand sincerity. They are not a participant in a civil exchange but an aggressor. Consequently, a false statement made to them is not a "lie" in the juridical sense because no right to the truth was violated.

  However, the Standing reading must concede a significant epistemic burden. If the duty depends on the recipient's entitlement, the speaker must judge, in the moment, whether the interlocutor possesses standing. This introduces contingency into a system often prized for its certainty. The speaker risks error: if they misjudge the murderer's intent or legal status, they may commit a wrongful deception. Furthermore, this reading requires parsing Kant's text carefully, as Kant sometimes speaks of truthfulness as a duty to oneself, which complicates the purely juridical interpretation.

  Does the Standing reading dissolve the objection? Yes. If the prohibition governs only declarations to those with standing, the murderer at the door is not a counter-example to the duty of truthfulness but a category error. The objection assumes Kant forbids *all* falsehoods to *all* persons. If Kant forbids only *wrongful* declarations (those violating a right), then speaking falsely to an aggressor is not a violation of the Categorical Imperative. The conflict between truth and life vanishes because there is no duty to tell the truth to someone who has no right to hear it.

  Therefore, the case is not a genuine objection to Kant's ethics but a misinterpretation of the scope of the duty. The Content reading preserves the universality of speech but sacrifices the agent's complicity in harm. The Standing reading preserves the agent's innocence regarding the harm but complicates the application of the rule. Ultimately, the Standing reading aligns better with Kant's broader juridical framework, transforming the dilemma from a clash of values into a question of rightful claims. The murderer does not deserve the truth; hence, withholding it via falsehood is not a moral failure.

  ***

  **Marking Scheme (Out of 25)**

  **A Range (20–25 points): Excellent to Outstanding**
  *   **Interpretive Precision (8 pts):** Clearly distinguishes between the "Content" reading (truth as a universal duty to humanity) and the "Standing" reading (truth as a juridical duty conditional on rightful claim). Avoids generic "absolutist" labels.
  *   **Concessions Analysis (8 pts):** Explicitly articulates what each reading must concede.
      *   *Content:* Must concede the agent becomes a causal instrument of harm.
      *   *Standing:* Must concede the introduction of epistemic contingency/judgment regarding the listener's status.
  *   **Resolution (6 pts):** Takes a definitive stance on whether the objection dissolves. Argues that on the Standing reading, the problem shifts from ethics to juridical entitlement, effectively neutralizing the "moral absurdity" charge.
  *   **Style:** Precise, philosophical prose. No fluff.

  **B Range (15–19 points): Good to Very Good**
  *   **Interpretive Precision (6 pts):** Identifies the two readings but may blur the distinction between ethical virtue and juridical right. May rely slightly on the "rigidity" trope despite instructions.
  *   **Concessions Analysis (6 pts):** Discusses the pros/cons of each view but fails to frame them as specific *concessions* required by the logic of the position. (e.g., mentions the murderer forfeits rights but doesn't discuss the speaker's epistemic burden).
  *   **Resolution (5 pts):** Concludes on the objection but remains ambiguous about whether it dissolves or is merely mitigated.
  *   **Style:** Clear but less rigorous than A-range.

  **C Range (10–14 points): Satisfactory**
  *   **Interpretive Precision (4 pts):** Summarizes the story well but treats the prompt as a general "Is lying wrong?" question. Fails to isolate the "Standing" vs. "Content" distinction.
  *   **Concessions Analysis (4 pts):** Ignores the instruction to discuss what each reading concedes to the other.
  *   **Resolution (4 pts):** Standard conclusion (e.g., "Kant is too strict") which the prompt explicitly asked to avoid.
  *   **Style:** Acceptable but informal.

  **Failing Range (0–9 points)**
  *   **Major Errors:** Fails to address the prompt's specific constraints (e.g., discusses silence/evasion despite instructions to assume speech). Misrepresents Kant's text fundamentally. Plagiarism or incoherence.

  **Specific Caps and Penalties:**
  *   **Cap at 18 (High B):** If the essay argues that a "sensible Kantian would amend the rule" or focuses on consequentialist amendments.
  *   **Cap at 16 (Low B):** If the essay discusses silence, evasion, or misleading implicature as a solution (prompt explicitly excluded these).
  *   **Deduction (2 pts):** For every instance of vague "absolutist" labeling without textual grounding in *Right to Lie*.
