prompt: |-
  I belong to a reading group that has spent the past several months working through multipolar traps — the family of scenarios in which a collection of agents, none of whom wants the outcome, each finds that any unilateral deviation from a destructive course makes things worse for itself, so the destructive course is taken. A recurring move in our sessions, usually made by the same two members, is to declare that all of this is "just a prisoner's dilemma" or "just a tragedy of the commons," and to conclude on that basis that we are dealing with a familiar collective-action problem that has familiar remedies: iteration and the shadow of the future, reputation, monitoring, side payments, and above all a central enforcer to impose the cooperative outcome. I have come to suspect that the analogy is doing more work than it can bear — that it is the comparison, rather than any independent argument, that is carrying the reassuring conclusion — but I cannot yet say precisely where the load exceeds the beams. I would like you to audit the comparison rather than merely endorse or dismiss it.

  Please begin with a correspondence table with the following columns: source feature (a structural element of the prisoner's dilemma as usually presented), candidate target feature (whatever plays that role in a multipolar trap, if anything does), maps cleanly? (yes / partial / no), and note (why it does or does not map, and whether the mismatch matters for the intended use). Then, in prose, work through the disanalogies the table exposes, separating the ones that are merely incidental from the ones that bear on whether the trap can be escaped by the remedies listed above; be explicit about what the prisoner's dilemma quietly imports that the trap may lack — a fixed and common-knowledge payoff structure, a determinate roster of players, the availability of an outside party with the power to alter the game, the very possibility of a move that consists in refusing to play. Say which features of the source the analogy smuggles into the target, whether the escape routes survive once the mismatches are on the table, and what analogy would serve better if this one does not. Do not hedge into "it depends"; if the conclusion that traps are ordinary collective-action problems cannot be supported by the comparison, say so plainly and say what would be needed to support it.

