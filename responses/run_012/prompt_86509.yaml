  7.  **Final Polish:** Organize with clear headings. Add a summary "Engineer's Checklist." (This matches the user's mental model).

  8.  *(Final thought)*: Make sure to highlight the difference between *predictive accuracy* (can we guess what they'll do next?) and *normative alignment* (will they be happier if we do this?). The user's plan optimizes for the former but claims the latter.

