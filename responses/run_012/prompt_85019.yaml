answer: |-
  The room smelled of ozone and old paper, the specific scent of the Bureau of Indifferent Cases. Officer Elara Vance sat at her desk, the surface cleared of everything save two manila folders and a single heavy stamp. The light overhead was fluorescent and hummed, a steady drone that matched the quiet tension in her chest.

  Case 44-Theta. Two claimants. One resource.

  She opened the left folder. Subject A: Male, 42. Genetic profile standard. Occupational hazard exposure: nil. Social dependency index: 4.2. Prognosis without intervention: terminal within 72 hours.
  She opened the right folder. Subject B: Male, 42. Genetic profile standard. Occupational hazard exposure: nil. Social dependency index: 4.2. Prognosis without intervention: terminal within 72 hours.

  The Bureau did not handle cases where one side was meritorious. Those went to Ethics or Merit Review. The Bureau existed for the residue, the statistical glitches where the universe offered no杠杆 (leverage). Here, the medicine was a single dose of synthetic stabilizer. It would save one. The other would die. The files were perfect mirrors. To choose based on name order would be to privilege alphabet over biology. To choose based on arrival time was impossible; their applications had been timestamped to the same millisecond by the central server.

  Elara closed her eyes. Her training kicked in, a mental exercise called *The Void*. She had to evacuate her mind of preference. She could not want Subject A to live more than Subject B. She could not want the decision to be over. She could not even want to be right. She had to be a conduit through which a decision passed, uncolored by motive.

  "You're breathing too loudly," a voice said from the doorway.

  Elara opened her eyes. Director Silas stood there, holding a clipboard against his chest like a shield. He was a senior auditor, a man who had watched hundreds of these selections. He stepped inside and closed the door, cutting off the hum of the outer office.

  "It helps center the rhythm," Elara said. Her voice sounded flat to her own ears. That was the goal.

  "It helps you hide," Silas corrected. He pulled up a chair, the legs scraping harshly against the linoleum. He didn't sit immediately. He looked at the two folders, then at the stamp. "Have you found a differentiator?"

  "No. There isn't one. The metrics are locked."

  "Then you are stuck in the ass's pasture," Silas said. He finally sat, leaning forward. "Tell me, Elara. When you pick up that stamp, what will move your arm?"

  "The Bureau mandate," she said. "Section 9: In the absence of differentiating reasons, the Officer must execute selection to prevent systemic paralysis."

  "That's the rule, not the motive," Silas pressed. "Rules tell you *that* you must act. They don't tell you *which* way. If your mind is truly empty—if you truly hold no preference for Left over Right—then there is no causal link between your thought and your hand. You are a statue until the wind blows."

  Elara rested her hands on the desk, palms down. "I am not a statue. I am an agent."

  "Are you?" Silas tapped his pen against his clipboard. "If you choose Left, you must admit that, at the moment of choice, you preferred Left. Even if that preference was only a preference for 'getting it over with.' You wanted the state of 'decided' more than the state of 'undecided.' That is a reason. That is a preference."

  "It is not a preference for the *outcome*," Elara insisted. "I do not care who lives. I care that the function is completed. But the completion does not dictate the direction."

  "Everything dictates the direction," Silas countered. "Neurons fire because of prior states. If you pick Left, it's because some microscopic bias tipped the scale. A slight tension in the shoulder. A memory of the color blue associated with the left folder tab. If you deny that, if you claim you are choosing without a cause, then you aren't choosing. You're flipping a coin. And if you're just flipping a coin, why do we need a trained officer? We could install a randomizer in the server."

  "Because a randomizer is an event," Elara said. She felt the heat rising in her neck, a violation of *The Void*, but she couldn't suppress it. "A coin falling is physics. It is cause and effect. What I do is origination. I introduce a new chain of causality that did not exist before. I am not weighing reasons; I am creating the reason by the act of choosing."

  "That's mysticism," Silas said softly. "You're dressing up arbitrariness in the robes of agency. If there is no reason why Left rather than Right, then the selection is unintelligible. It's noise. And you're going to sign a death warrant based on noise."

  "I'm signing it based on duty," Elara said. "The duty to resolve the indeterminacy."

  "The duty is the reason to act, not the reason to pick Left," Silas pointed out. "You're conflating the justification for the process with the justification for the result. You know that when you stamp that paper, one man dies. If you cannot say why him rather than the other, you are not making a moral choice. You are administering a lottery and calling it justice."

  Elara looked at the folders. They were identical. Thick cream stock, black serif font. But now, under Silas's gaze, they seemed to vibrate. The symmetry was unbearable. It demanded a crack.

  "If I admit a preference," Elara said, "I corrupt the record. I imply there was a fact I missed. If I say I preferred Left because I am right-handed, then next time, every claimant on the Left will demand a left-handed officer. The system collapses if we admit the choice comes from me."

  "The system already collapsed," Silas said. "It collapsed the moment the files were identical. We are just cleaning up the mess. The question is whether you lie about it. Don't tell me you originate causality. Tell me you're tired, or that the light hit the dust motes differently on the left side. Admit you're human."

  "I am an Officer of the Bureau," Elara said. She reached for the stamp. It was cold, heavy wood and rubber. "My humanity is the variable we are controlling for."

  "You can't control for it," Silas said. "It's the only thing you have."

  Elara lifted the stamp. Her hand hovered over the left folder. She waited for the preference. She waited for the subtle tug of desire, the whisper of *this one*. There was nothing. There was only the weight of the wood and the silence of the room. She felt the terrifying freedom of the gap. If Silas was right, her hand should not move. It should wait for a cause. But her hand was not waiting. It was poised to strike.

  "If I drop this," Elara said, her eyes on the ink pad, "and it lands on A, was that me?"

  "It was gravity," Silas said.

  "If I press this," she said, "and it lands on A, was that me?"

  "It was a muscle spasm triggered by fatigue," Silas said. "Or a subconscious bias. It wasn't *you*, because 'you' are not in the equation. Only your history is."

  Elara inhaled. She thought of Subject A and Subject B. They were not files. They were breathing, or soon would not be. The stakes pressed against her ribs. If she chose arbitrarily, was she a murderer? If she chose freely, was she a god? The distinction felt thin, like the paper beneath her hand.

  "I am not my history," Elara said.

  "Then you are nothing," Silas replied. "Because you are nothing but your history and this moment."

  Elara brought the stamp down.

  The sound was a dull thud, final and dry. The ink transferred, black on cream. *APPROVED.*

  She did not look at which folder she had marked. She kept her eyes on Silas. He looked at the paper, then back at her. His expression was unreadable, a mixture of pity and professional curiosity.

  "Which one?" he asked.

  "Left," Elara said.

  "And why?"

  "Because I stamped it."

  Silas stood up. He tucked his clipboard under his arm. "Subject B dies at 0800 tomorrow. The notification goes out in an hour."

  "I know."

  "Did you feel it?" Silas asked, his hand on the doorknob. "The moment the choice happened? Did it feel like power, or did it feel like falling?"

  Elara looked at her hand. It was steady. There was no tremor. But inside, there was a hollow ache, the sense of a door closing that had never truly been open. She realized she couldn't answer him. If she said it felt like power, she claimed a magic she couldn't prove. If she said it felt like falling, she admitted Silas was right—that she was merely subject to forces she couldn't name.

  "It felt like work," Elara said.

  Silas nodded slowly. "That's the only honest answer you've given all day."

  He left the room. The door clicked shut. The hum of the fluorescent light returned, louder now. Elara looked down at the folders. The left one bore the black mark of survival. The right one remained clean, a blank slate waiting for the void. She picked up the right folder to mark it *DENIED*. Her pen hovered over the line. She needed a reason code. There was no code for 'no reason.' She had to invent one. She wrote *Resource Limitation*. It was true, but it wasn't the reason. The reason was that her hand had moved left.

  She filed the papers. She stood up. She walked to the window and looked out at the city, where thousands of decisions were being made for reasons of love, money, hunger, and fear. None of them were like this. None of them were pure. She placed her hand against the glass. It was cold. She wondered if Subject B was cold yet, or if he still had an hour of warmth left to him, unaware that his fate had been sealed not by merit, but by the geometry of a desk and the silence of an officer who refused to say why.

  ***

  **Author's Note**

  This story leans heavily on the Libertarian conception of free will (agent-causation) pitted against a Hard Determinist or Reason Internalist view, without naming them. It takes liberties with the original Buridan's Ass paradox by assuming the agent *can* physically act despite perfect indifference, whereas the classical puzzle suggests paralysis; here, the Bureau mandates action, forcing the philosophical problem into the realm of moral responsibility rather than logical possibility. I am least confident in the plausibility of Elara's claim that she can "originate" causality without a prior reason; the story treats this as an experiential reality for her, but philosophically, whether such an uncaused cause is coherent or merely an illusion of introspection is the very point students should dispute.
