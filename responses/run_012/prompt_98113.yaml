prompt: |-
  so my sister's husband is a postdoc in cognitive neuroscience and he's been going on at every family dinner about how beliefs and desires don't exist, they're just folk posits like phlogiston, and honestly its been messing with my head because I half agree with him and half think he's talking nonsense, and now I've got a reading group next week where I have to actually lay out my own view. here's what I've got so far, roughly:

  (a) I'm basically an eliminative materialist about beliefs and desires — the belief/desire framework is a folk theory and a stagnant research program, and it'll get replaced the way phlogiston did.
  (b) I think the predictive processing / Bayesian brain picture is more or less right: the brain is doing hierarchical prediction-error minimisation, and I don't see how you describe that without saying it represents the world and carries something like probability distributions over how things are.
  (c) I think there's a plain fact of the matter about what someone believes. either my father-in-law believes the election was stolen or he doesn't; that's not up to us or to which framework we happen to use.
  (d) I think brains really do represent things — a state of your visual cortex can be about the mug in front of you in the same unremarkable way a thermometer is about the temperature.
  (e) I think intentional explanation — she left the party because she thought he'd be there — is indespensible, not just convenient, for social science and for ordinary life.
  (f) I hold people responsible for what they do on the basis of what they believed and what they wanted.

  tell me straight: which of these actually pull against each other, which just look like they do, and how bad is it. rank the real clashes by how much I'd have to give up, and for the worst one tell me the cheapest fix and what it costs me. don't give me a survey of the literature, just tell me what has to go.
