      *   (b) **Predictive Processing (PP):** Brain does prediction-error minimization; involves representation/probability distributions.
      *   (c) **Realism about Belief Facts:** There is a plain fact of the matter about whether someone believes $p$ (e.g., election stolen).
      *   (d) **Realism about Representation:** Brains really represent things (like a thermometer).
      *   (e) **Indispensability of Intentional Explanation:** We *need* belief/desire talk for social science/life.
      *   (f) **Moral Responsibility:** Responsibility is based on beliefs and wants.

  3.  **Identify the Clashes:**

      *   **Clash 1: (a) vs. (c), (e), (f).**
          *   (a) says beliefs/desires *do not exist*.
          *   (c) says there is a *fact of the matter* about what someone believes. (If they don't exist, there can't be facts about them, unless (c) is reinterpreted, but as stated, it contradicts (a)).
          *   (e) says intentional explanation (using beliefs/desires) is *indispensable*. EM usually says it's dispensable in principle, even if useful now. Stronger EM says it's *false*.
          *   (f) says we hold people responsible based on beliefs/wants. If beliefs/wants don't exist, what are we holding them responsible *on the basis of*? This undermines the grounding of responsibility.
          *   *Severity:* High. (a) is the nuclear option. It directly negates the ontology required for (c) and (f).

