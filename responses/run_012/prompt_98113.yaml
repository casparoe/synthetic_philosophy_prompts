          *   *Severity:* Medium. It depends on how strictly you define "belief." If "belief" means "sentence in the head," (a) holds. If "belief" means "information-carrying state guiding action," (b) contradicts (a).

      *   **Clash 3: (e) vs. (a).**
          *   (e) says belief/desire talk is *indispensable*.
