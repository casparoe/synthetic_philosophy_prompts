  4.  **Rank the Clashes:**

      *   **Worst Clash:** (a) vs. (c) & (f). You can't say "Beliefs don't exist" and "There is a fact about what he believes" or "He is responsible based on what he believed." One of these must go. Since (c) and (f) align with ordinary life and the user's intuition ("messing with my head"), (a) is the outlier causing the pain.
      *   **Second Worst:** (a) vs. (e). If it's like phlogiston, it should be replaceable. If it's indispensable, it tracks *something* real.
      *   **Third Worst:** (a) vs. (b)/(d). Representational states look like beliefs. Denying beliefs while keeping representations requires fine-grained semantic gymnastics.

