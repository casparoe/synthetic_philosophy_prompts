  **FOR IMMEDIATE RELEASE**

  **Nordic Institute for Comparative Liberty Settles Sweden-Norway Freedom Debate with Unified Grading Framework**

  **UPPSALA, Sweden** — The Nordic Institute for Comparative Liberty (NICL) today announced the completion of its Quadrennial Liberty Assessment, definitively ranking Sweden and Norway on a single standardized scale. After four years of data calibration, the Institute awarded both nations an aggregate score of 88.4 out of 100, distinguishing them only via sub-domain weighting adjustments.

  "We have successfully harmonized conflicting liberty indicators into a singular metric," said Institute Director Dr. Henrik Voss. "Citizens no longer need to choose between freedom from interference and freedom to act. The Index chooses for them."

  **Methodology**
  The NICL Composite Liberty Index (NCLI) aggregates fourteen distinct measurands ranging from marginal tax rates to healthcare access latency. To ensure balance, the Institute applied a dynamic weighting algorithm where indicators of non-interference were normalized against indicators of capacity. Critics noting that these variables often move in opposite directions were advised that the normalization process accounts for inverse correlations. By adjusting the scalar coefficients applied to regulatory burdens versus social safety nets, the Institute ensured that high performance in one domain compensates for lower performance in the other. The specific weighting ratios used to achieve parity between the two nations are detailed in Appendix F, footnote 12, which is available upon written request. This approach allows the Institute to maintain a single headline number while acknowledging the multidimensional nature of political freedom. The calibration process involved iterative adjustments until the final scores reflected a stable equilibrium between negative and positive liberty indicators.

  **Final Grades and Justifications**

  | Country | Aggregate Grade | Primary Justification |
  | :--- | :--- | :--- |
  | Sweden | A- | Exceptional capacity for self-actualization via state infrastructure. |
  | Norway | A- | Minimal friction in private capital allocation and movement. |

  **Frequently Raised Objections**

  **Q: Would changing the weighting scheme alter the ranking?**
  A: Yes. If weights favoring low taxation are prioritized, Norway scores higher. If weights favoring social security are prioritized, Sweden scores higher. However, the Institute's chosen weighting represents the optimal median consensus. Users are encouraged to consult the raw data if they prefer a different philosophical framework.

  **Q: What about freedom as non-domination?**
  A: Some theorists argue that sovereign wealth funds reduce arbitrary power by insulating citizens from market volatility. The NCLI accounts for this by treating sovereign assets as a liberty-positive variable, though this adjustment is capped to prevent skewing the interference metrics.

  **Q: What data would actually settle the question?**
  A: No additional data will settle the question. The variance stems from the conceptual definition of liberty, not the measurement error. Settlement requires a prior philosophical stipulation regarding which liberties count.

  **Dissenting Opinion**
  Commissioner Astrid Larsen resigned from the board prior to publication, issuing a three-page statement. "The Institute claims to measure liberty, but the instrumentation only detects state throughput," Larsen said. "We are measuring the size of the engine and calling it the speed of the car. It is a category error dressed in quantitative rigor. We have built a very precise ruler to measure weight. By conflating distinct measurands, we provide false precision to policymakers."

  The NICL will release its next comparative assessment in 2028, pending further calibration of the sovereignty variable.

  **About the Nordic Institute for Comparative Liberty**
  Founded in 2019, the NICL provides actionable metrics for geopolitical freedom. Headquarters in Uppsala.

