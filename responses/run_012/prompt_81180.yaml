prompt: |-
  I'm a backend engineer at a mid-size company with a codebase that's older than most of the team. We get alot of "can we just get rid of this?" proposals -- a 200-line function nobody understands, a manual approval step in our deploy process, a sleep-and-retry in a data pipeline -- and the argument always goes the same way: someone says we can't touch it because something will break, without being able to say what, or we spend a sprint carefully preserving something that turns out to be dead weight, which definately makes the whole don't-touch-it instinct look like superstition.

  I want you to act like a patient philosopher of institutions who also actually ships code. Take Chesterton's fence, plus the Burkean idea that inherited practices can encode knowledge no living person has (the weird hack might be a bug fix from 2013 that exactly one customer depends on), and turn it into a real decision procedure my team can run in a 30-minute design review. Before you write the procedure, brainstorm out loud about what the principle is actually claiming and what it does *not* claim -- I suspect it's really about how cheaply a change can be reversed, but I don't want you to just assume that, tell me if that reading survives.

  What I need: the questions to ask in order, what counts as a good enough answer to each, where it stops with a hard "keep it," and where it has to hand off to a human because it's a judgment call about risk appetite rather than a fact. It has to handle the case where nobody alive knows why the thing is there, and the case where the original reason is gone but some other mechanism now covers it. Don't let it collapse into "go ask whoever wrote it" -- most of them have left. Assume the tech lead and the owner of the affected service have to sign off, and that reviewers usually don't know the history.

  Then run it on three cases: the mystery billing function, the manual approval step in the deploy process, and one case of your choosing where the procedure says rip it out -- I want to see it isn't just a rubber stamp for whoever owns the code. Mark where it misfires or can't decide, and tell me honestly how someone could abuse this procedure to block all change.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Backend engineer at a mid-size company with legacy code.
      *   **Problem:** Team oscillates between "don't touch it" (superstition/fear) and "rip it out" (wasted effort/dead weight). Need a balanced decision procedure.
      *   **My Role:** Patient philosopher of institutions who also ships code.
      *   **Core Concept:** Chesterton's Fence (don't remove a fence until you know why it's there) + Burkean conservatism (inherited practices encode knowledge).
      *   **Task:**
          1.  Brainstorm the principle (what it claims/doesn't claim, test the "reversibility" hypothesis).
          2.  Create a decision procedure (questions, thresholds, hard stops, judgment calls) for a 30-min design review.
          3.  Constraints: Handle unknown history, handle obsolete reasons, no "ask the author" (they're gone), requires Tech Lead + Service Owner sign-off.
          4.  Run the procedure on three cases: Mystery Billing Function, Manual Deploy Approval, and a "Rip It Out" case (my choice).
          5.  Critique: Mark misfires/undecidables and explain how to abuse the procedure to block change.

  2.  **Part 1: Brainstorming the Principle (Chesterton/Reversibility):**
      *   *What is Chesterton's Fence actually saying?* It's not "never touch." It's "understand before removing." It acknowledges that systems evolve organically and constraints often exist for non-obvious reasons (edge cases, regulatory requirements, historical bugs).
      *   *What is it NOT saying?* It is not an argument for eternal stasis. It is not an argument that the original reasoner was smarter than you. It is not a veto power for the cautious.
      *   *The "Reversibility" Hypthesis:* The user suggests it might be about how cheaply a change can be reversed.
      *   *Analysis:* Reversibility is crucial (Type 1 vs. Type 2 decisions, per Bezos), but Chesterton is deeper. It's about *information asymmetry*. The fence exists because someone knew something you don't *yet*. Reversibility mitigates risk, but understanding mitigates *surprise*. If I can reverse it easily, I don't need to know *why* the fence is there as much. If I can't reverse it, I *must* know. So, reversibility is a *factor* in the procedure, not the whole principle. The core principle is "Minimize unknown unknowns before incurring irreversible cost."
      *   *Conclusion:* The reading survives but needs nuance. It's about the cost of being wrong vs. the cost of investigation.

  3.  **Part 2: Designing the Decision Procedure:**
      *   *Goal:* 30-minute review. Needs to be efficient.
      *   *Participants:* Proposer, Tech Lead, Service Owner.
      *   *Structure:* A funnel. Start with low-effort checks, escalate to high-effort only if needed.
      *   *Key Questions:*
          1.  What breaks if we remove it? (Impact)
          2.  Can we undo it quickly? (Reversibility)
          3.  Is there evidence of usage? (Data)
          4.  What is the cost of keeping it? (Maintenance tax)
          5.  What is the "Shadow Test"? (Can we disable it without deleting?)
      *   *Hard Stops:* Regulatory/Legal, Data Loss, Security.
      *   *Judgment Calls:* Risk appetite, "Good enough" evidence.
      *   *Handling "Nobody Knows":* Shift burden of proof. If no one knows, we must treat it as live *unless* we can prove otherwise via observation (shadowing/logging).

  4.  **Part 3: Running the Procedure (The Cases):**
      *   *Case 1: Mystery Billing Function (200 lines).* High risk (money). Likely needs shadowing.
      *   *Case 2: Manual Deploy Approval.* Process, not code. High friction. Low technical risk, high organizational risk.
      *   *Case 3: "Rip It Out" Case.* Needs to be something clearly dead. Maybe a feature flag for a launched feature from 2 years ago.
      *   *Critique:* Where does it fail? (e.g., if logging is broken, you can't shadow). How to abuse? (Demand impossible levels of proof).

  5.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Set the tone. Philosophical but pragmatic.
      *   *Brainstorming:* Address the reversibility hypothesis. Validate it but expand it to "Cost of Error vs. Cost of Inquiry."
      *   *The Procedure:* "The Fence Protocol." Step-by-step questions. Define "Pass/Fail/Defer."
      *   *The Cases:* Walk through the protocol for each.
      *   *The Critique:* Honest assessment of limitations and abuse vectors.

  6.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Initial thought:* Ask "Do we have tests?"
      *   *Correction:* Legacy code often lacks tests. That shouldn't be a hard stop, or nothing ever changes. Instead, ask "Can we add observability *before* deleting?"
      *   *Initial thought:* Require 100% certainty.
      *   *Correction:* Impossible. Require "Acceptable Risk Level" defined by the Owner.
      *   *Constraint Check:* Must handle "original reason gone." Add a step for "Dependency Check" (is the *cause* still present?).

  7.  **Final Polish:**
      *   Ensure the tone is "patient philosopher who ships."
      *   Make sure the "Abuse" section is sharp.
      *   Check against the 30-minute constraint (keep questions tight).

  8.  *(Self-Correction on the "Reversibility" point)*: I need to be careful not to dismiss the user's intuition. Reversibility is the *mechanism* that allows you to bypass deep understanding. If I can revert in 5 minutes, Chesterton's Fence is lower. If I can't, the Fence is high. I will affirm this.

  9.  *(Final Review of Cases)*:
      *   Billing: High stakes. Protocol should say "Don't delete yet, shadow."
      *   Deploy Approval: Organizational. Protocol should say "Change process, not code."
      *   Feature Flag: Low stakes. Protocol should say "Delete."
      *   *Wait, I need a case where it says "Rip it out" that isn't obvious.* Let's make the third case a "Sleep-and-Retry" in a pipeline where the downstream system is now stable.

  10. **Finalizing the Output Structure:**
      *   Preamble: The Philosophy.
      *   The Protocol: The 5-Step Funnel.
      *   The Simulations: 3 Cases.
      *   The Post-Mortem: Limitations & Abuse.

  (Proceeds to generate response based on these thoughts.)
answer: |-
  ## Part 1: The Philosophy of the Fence

  You asked me to test your hypothesis: *Is Chesterton's Fence really just about reversibility?*

  Here is the verdict: **Yes, but only if you define "reversibility" broadly enough to include "reputational reversibility."**

  Chesterton's original parable is about humility. It posits that the world is an "inheritance" of solutions to problems you haven't seen yet. The Burkean addition is that institutions (like your codebase) possess a kind of distributed intelligence that no single commit message captures.

  However, if we treat this purely as "preserve wisdom," we end up in the superstition trap you described. The code becomes a museum.

  The engineering translation of Chesterton's Fence is not "Do not touch." It is: **"The burden of proof lies on the remover, proportional to the cost of being wrong."**

  Your intuition about reversibility is the lever that moves the burden of proof.
  *   **High Reversibility:** If I delete the function and can restore it from git in 5 minutes if the pager goes off, the "Fence" is low. I don't need to know *why* it was there, because the cost of finding out is cheap.
  *   **Low Reversibility:** If I delete a billing function and corrupt ledger state, I cannot "git revert" money. The Fence is high. I must know *why* it is there before I touch it.

  So, the principle survives your reading, but with a caveat: Reversibility isn't just technical (can I rollback the binary?). It's also social (can I apologize to the one customer who breaks?) and financial (can we refund the error?).

  **What the principle does NOT claim:**
  1.  **It does not claim the original author was right.** They might have been drunk. The Fence protects the *constraint*, not the *coder*.
  2.  **It does not claim the reason still exists.** Fences are often left standing after the bull is sold. The procedure must detect "ghost fences."
  3.  **It does not claim understanding is always possible.** Sometimes the logs are gone. In that case, the procedure must shift from "understand" to "observe."

  ***

  ## Part 2: The Fence Protocol (30-Minute Decision Procedure)

  This is designed for a Design Review.
  **Attendees:** Proposer, Tech Lead (TL), Service Owner (SO).
  **Pre-requisite:** Proposer must fill out Section 1 before the meeting.

  ### Step 1: The Reversibility & Impact Matrix (5 Minutes)
  *Goal: Determine the height of the fence.*

  **Q1: If we delete this and are wrong, what is the blast radius?**
  *   **A (Low):** Latency blip, internal tool failure, feature toggle off.
  *   **B (Medium):** Customer-facing error, data needs manual correction, support tickets spike.
  *   **C (High):** Data loss, financial discrepancy, security vulnerability, regulatory breach.

  **Q2: How quickly can we restore the previous state?**
  *   **A (Minutes):** Config flip, feature flag, hotfix deploy < 1 hour.
  *   **B (Hours/Days):** Code revert, data migration, coordinated deploy.
  *   **C (Weeks/Never):** Data corruption, external dependency change, burned trust.

  **Decision Gate:**
  *   **If Any "C":** Hard Stop. You cannot delete this today. Move to Step 3 (Observation).
  *   **If All "A":** Green Light. Delete it. No further review needed. TL signs off.
  *   **If Mix of "A/B":** Proceed to Step 2.

  ### Step 2: The Ghost Fence Check (10 Minutes)
  *Goal: Determine if the reason for the fence still exists.*

  **Q3: Is the original constraint still active?**
  *   *Example:* The `sleep(5000)` was for a vendor API that now has 99.99% uptime.
  *   *Evidence Required:* Metrics, vendor changelogs, or removal of the dependent service.
  *   **Pass:** Evidence shows constraint is gone.
  *   **Fail:** Constraint status unknown or still active.

  **Q4: Is there traffic/usage evidence?**
  *   *Action:* Check logs/metrics for the last 30 days.
  *   **Pass:** Zero hits, or hits only from test accounts.
  *   **Fail:** Active production traffic.
  *   **Nuance:** If traffic exists but is low volume, who are the users? (Internal vs. Enterprise).

  **Decision Gate:**
  *   **If Q3 Pass AND Q4 Pass:** Strong candidate for deletion. Move to Step 4.
  *   **If Q4 Fail (Active Traffic):** You cannot delete without migration. Move to Step 4 (Shadowing).
  *   **If Q3 Fail (Constraint Active):** Keep it. Review ends.

  ### Step 3: The "Nobody Knows" Clause (5 Minutes)
  *Goal: Handle the case where history is lost.*

  **Q5: Can we instrument this before removing it?**
  *   *Proposal:* Add logging, wrap in a feature flag, or route to a shadow endpoint.
  *   **Yes:** We will run this in "log-only" mode for 2 weeks. If no alerts, we delete.
  *   **No:** (e.g., removing a DB column prevents logging).
      *   *If Impact was "A" (Step 1):* Delete anyway. Monitor closely.
      *   *If Impact was "B":* **Judgment Call.** TL and SO must agree on risk appetite. (See Step 5).

  ### Step 4: The Mitigation Plan (5 Minutes)
  *Goal: Define the safety net.*

  **Q6: What is the specific rollback trigger?**
  *   *Bad:* "If things break."
  *   *Good:* "If error rate on endpoint /x exceeds 1% for 5 minutes."
  *   *Good:* "If Support receives > 3 tickets referencing 'billing'."

  **Q7: Who is on call for the fallout?**
  *   Must be the Proposer or TL. Cannot be "the team."

  ### Step 5: The Sign-Off (5 Minutes)
  *Goal: Assign accountability.*

  *   **Tech Lead:** Signs off on technical safety (rollback strategy).
  *   **Service Owner:** Signs off on business risk (impact on customers/revenue).
  *   **Outcome:**
      1.  **Approved:** Delete/Merge.
      2.  **Shadowing Required:** Implement logging/flagging first. Re-review in 2 weeks.
      3.  **Rejected:** Keep the fence. Document *why* in the code comment (link to ticket).

  ***

  ## Part 3: Running the Simulation

  Here is how the protocol handles your three cases.

  ### Case 1: The Mystery Billing Function (200 lines)
  *Context:* Calculates tax adjustments. No comments. Author left 4 years ago.
  *   **Step 1 (Impact):** Blast Radius = **C (Financial)**. Reversibility = **B (Code revert is easy, money fix is hard)**.
      *   *Gate:* Hard Stop on "C". Cannot delete today.
  *   **Step 2 (Ghost Check):** Constraint active? Yes, taxes still exist. Usage? Yes, called on every invoice.
  *   **Step 3 (Nobody Knows):** Can we instrument? Yes.
  *   **Step 4 (Mitigation):** We cannot delete. We must **Shadow**.
      *   *Plan:* Write a *new* function that we think is correct. Run both old and new in production. Log discrepancies. Do not use new result for billing yet.
  *   **Verdict:** **KEEP (for now).** Move to Shadowing phase.
  *   *Why this works:* It stops the "rip it out"冲动 (impulse) without cementing the legacy code forever. It forces the team to prove the new logic matches the old logic before switching.

  ### Case 2: The Manual Deploy Approval
  *Context:* A Slack button a VP must click before prod deploy. Slows releases by 4 hours.
  *   **Step 1 (Impact):** Blast Radius = **B (Delay)**. Reversibility = **A (Flip config)**.
      *   *Gate:* Proceed.
  *   **Step 2 (Ghost Check):** Constraint active? Originally for "compliance."
      *   *Check:* Compliance team says "We moved to automated audit logs last year."
      *   *Usage:* VP clicks it, but admits "I just click yes without looking."
  *   **Step 3 (Nobody Knows):** N/A (Reason known, now obsolete).
  *   **Step 4 (Mitigation):** Rollback trigger? "If automated audit log fails."
  *   **Step 5 (Sign-Off):** TL signs. Service Owner (VP) needs to sign.
      *   *Friction:* The VP might feel unsafe.
      *   *Resolution:* Protocol requires SO sign-off. If VP refuses, it's a **Judgment Call** on risk appetite, not technical debt.
  *   **Verdict:** **APPROVED (with SO consent).**
  *   *Why this works:* It exposes that the "technical" fence is actually a "political" fence. The protocol forces the political owner to admit the constraint is dead.

  ### Case 3: The Sleep-and-Retry (My Choice)
  *Context:* A data pipeline has `time.sleep(30)` followed by a retry on a database write.
  *   **Step 1 (Impact):** Blast Radius = **A (Latency)**. Reversibility = **A (Deploy)**.
      *   *Gate:* Proceed.
  *   **Step 2 (Ghost Check):** Constraint active?
      *   *Proposer:* "This was for the old Postgres master-slave lag. We use Aurora Serverless now."
      *   *Evidence:* Metrics show replication lag is < 10ms consistently for 6 months.
      *   *Usage:* The retry logic triggers 0.01% of the time.
  *   **Step 3 (Nobody Knows):** N/A.
  *   **Step 4 (Mitigation):** Rollback trigger? "If DB connection errors spike > 5%."
  *   **Step 5 (Sign-Off):** TL and SO sign.
  *   **Verdict:** **RIP IT OUT.**
  *   *Why this works:* It prevents the team from spending a sprint "carefully preserving" a 2-line sleep statement. The evidence (Aurora metrics) kills the ghost fence.

  ***

  ## Part 4: The Post-Mortem (Critique & Abuse)

  ### Where the Procedure Misfires
  1.  **The "Shadowing" Trap (Case 1):** Shadowing billing logic is expensive. It requires double-compute and complex diffing tools. For a mid-size team, Step 3 might stall the project for a month because building the shadow harness is harder than just maintaining the legacy function.
      *   *Fix:* Add a "Cost of Inquiry" cap. If shadowing takes > 3 days, escalate to CTO for "Risk Acceptance" (i.e., pay the technical debt tax because buying certainty is too expensive).
  2.  **The Observability Blind Spot:** Step 2 relies on logs. If the legacy system was written before structured logging, Q4 ("Is there traffic?") is unanswerable.
      *   *Fix:* Default to "Traffic Exists" if logs are missing. This biases toward caution, which is safer but slower.
  3.  **The Political Fence (Case 2):** The protocol identifies the fence is dead, but if the Service Owner (VP) is risk-averse, they can still veto. The protocol cannot solve fear, only illuminate it.

  ### How to Abuse This Procedure to Block All Change
  If I were a conservative engineer who wanted to ensure nothing ever changed, here is how I would weaponize the Fence Protocol:

  1.  **Weaponize Step 1 (Impact):** Argue that *everything* is Impact Level C. "If we remove this sleep, the DB might lock, which corrupts data." Force every change into the "Hard Stop" bucket.
  2.  **Weaponize Step 3 (Instrumentation):** Demand perfect shadowing for every change. "You can't delete this CSS class until you verify it's not used in any cached version of the mobile app." Make the cost of inquiry higher than the cost of keeping the debt.
  3.  **Weaponize Step 6 (Rollback Triggers):** Reject any rollback trigger that isn't instantaneous. "If we can't revert in 30 seconds, we can't proceed." This blocks database migrations and schema changes effectively forever.
  4.  **The "Service Owner" Veto:** If I am the TL, I can simply refuse to sign Step 5 claiming "Insufficient Evidence" on Step 2, knowing the Proposer doesn't have time to gather more metrics.

  ### The Antidote to Abuse
  To prevent this, you need a **Sunset Clause**.
  *   Any code marked "Keep" via this protocol gets a ticket created: "Re-evaluate in 6 months."
  *   If the Proposer feels Step 1 Impact is being inflated, they can appeal to a neutral third engineer (Architect) for a tie-breaker.
  *   **Reversibility is King:** If the Proposer can demonstrate a Feature Flag implementation (True Reversibility), Step 1 Impact automatically downgrades from C to B. This incentivizes building safe deployment mechanisms over arguing about legacy code.

  ### Final Thought
  Chesterton's Fence is not a shield for the status quo. It is a map. It tells you where the cliffs are so you don't fall off them while you're building the road. Use the protocol to find the cliffs, not to build a wall around them.
