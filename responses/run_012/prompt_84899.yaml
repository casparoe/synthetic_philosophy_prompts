prompt: |-
  I keep coming back to the Jahi McMath case and I'd like to actually think it through instead of just having the reaction I always have. Recap in case it helps: 13-year-old in Oakland, 2013, complicated tonsil/airway surgery, massive bleeding, cardiac arrest, and on Dec 12 her doctors at Children's Hospital Oakland declared her brain dead. Family said no. It went to court, a court-appointed neurologist confirmed the diagnosis, a judge ruled she was legally dead but ordered the ventilator kept on for a bit; the coroner issued a death certificate with Dec 12, 2013 as the date of death. Then in early January 2014 the family got custody of the body, moved her to New Jersey, which has a statute letting you object on religious grounds to a declaration of death by neurological criteria, and there she stayed on a ventilator with a trach and a feeding tube until 2018, when she died of liver failure and there was a second death certificate. The family's malpractice suit was apparently going to argue she wasn't dead but profoundly disabled, which matters because California caps damages if the patient died and doesn't if they're alive.

  What I want is this case run through the standard anatomy of the definition-of-death debate: the split between the definition of death, the criterion you use to apply it, and the tests you run to check the criterion, plus specifically the whole-brain criterion and the integrative-unity justification for it (the Bernat line of argument, if I've got the name right) -- death as the loss of the organism's capacity to integrate itself into a single functioning whole, so that a ventilator isn't keeping a person alive but running a collection of parts. I know the shape of that argument. What I don't have is a disciplined mapping onto this episode.

  So: at which of those three levels is each party actually disagreeing? The family, their outside expert, the hospital, the judge, the New Jersey legislature. Is the family's objection a religious claim about what death is, a claim about the criterion, a claim about the tests, or not really a claim about death at all but about who decides and whether they have to keep treating? Take the whole-brain criterion seriously and tell me whether the case confirms it, strains it, or is orthogonal to it. The New Jersey move is what I find hardest: if the same body is dead in one state and not dead in another depending on what the family believes, does that show the criterion was never a biological fact but a policy choice dressed up as one -- or is it just the law declining to impose a legal status on objectors, like a religious exemption from an autopsy, which leaves the biology untouched? And what do I do with a legal date of death, Dec 12, 2013, on which her heart was still beating and would keep beating for four and a half more years?

  Then the reverse direction, case testing theory. What does this episode show about the criterion: the damages asymmetry, the organ-donation worry, the fact that a body on a ventilator for years is arguably exactly what the integrative-unity view predicts rather than a counterexample to it, and the fact that the family's own position required continuous intensive care that nobody thinks is owed to a corpse. Where is the criterion genuinely silent, and where does it start sounding like it's smuggling in a moral judgment about what kind of life is worth the name? Dont give me the standard both-sides summary, I've read that. I want the mapping, and I want you to say plainly where the theory runs out and stops being able to adjudicate.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**
      *   **Topic:** Jahi McMath case (2013-2018).
      *   **Goal:** Move beyond emotional reaction to a disciplined philosophical/legal analysis using the standard anatomy of the definition-of-death debate.
      *   **Framework:** Definition vs. Criterion vs. Tests (Bernat et al.). Specifically, the Whole-Brain Criterion and the Integrative-Unity Justification.
      *   **Specific Questions to Answer:**
          *   At which level (Definition, Criterion, Test, or Other) is each party disagreeing? (Family, Experts, Hospital, Judge, NJ Legislature).
          *   Is the family's objection religious, biological, procedural, or legal?
          *   Does the case confirm, strain, or sit orthogonal to the Whole-Brain/Integrative-Unity theory?
          *   How to interpret the New Jersey move (religious exemption): Does it undermine the biological fact claim or is it just a legal exemption?
          *   How to interpret the legal date of death (Dec 12, 2013) vs. biological functioning (2013-2018).
          *   Reverse direction: What does the case show about the theory? (Damages asymmetry, organ donation, long-term ventilation, moral judgments).
          *   **Constraint:** No standard "both-sides" summary. Plain speaking on where the theory runs out.

  2.  **Analyze the Framework (Definition/Criterion/Test):**
      *   *Definition:* What is death conceptually? (e.g., cessation of being, loss of personhood, loss of organismic integration).
      *   *Criterion:* The biological marker that indicates the definition is met. (e.g., irreversible cessation of all functions of the entire brain, including brainstem).
      *   *Test:* The clinical procedures to verify the criterion. (e.g., apnea test, EEG, angiogram).

  3.  **Map the Parties in Jahi McMath:**
      *   **Hospital/Doctors:**
          *   Definition: Loss of organismic integration (Whole-Brain).
          *   Criterion: Irreversible cessation of all brain function.
          *   Test: Clinical exam + Apnea test + Confirmatory (flow study/EEG).
          *   Stance: She met the criterion on Dec 12.
      *   **Family:**
          *   Definition: Implicitly cardiopulmonary (heart beating = alive) OR Religious (God decides).
          *   Criterion: Heartbeat/Breathing (even if mechanical).
          *   Test: Look at the chest/monitor.
          *   *Crucial Nuance:* Later, their legal strategy (malpractice) required her to be *alive* (damages cap). Their public stance was often religious/hope-based.
      *   **Judge/Court:**
          *   Stance: Deferred to medical standard (Whole-Brain) for legal death, but allowed temporary maintenance for transfer.
      *   **NJ Legislature:**
          *   Stance: Legal accommodation. Allows religious objection to neurological death.
          *   Implication: Death is a legal status that can have exemptions, not purely a biological fact.

  4.  **Analyze the "Integrative-Unity" (Bernat) Argument:**
      *   *Thesis:* An organism is alive if it functions as a unified whole. The brain is the critical integrator. Without the brain, the body is a collection of subsystems kept going by external support (ventilator).
      *   *Jahi's Case:* She was on a ventilator for years. She went through puberty. She had wounds that healed.
      *   *Challenge:* Doesn't long-term survival prove integration?
      *   *Counter-argument:* Homeostasis was maintained *externally* (ventilator, hormones, feeding tube). Spontaneous integration was absent. The "integrator" was the ICU team + machines, not the organism.

  5.  **Address the Specific Hard Questions:**
      *   *NJ Move:* Is death a fact or policy? If NJ says "not dead" while CA says "dead," it suggests the *legal status* is policy, even if the *biological state* is constant. It treats neurological death as a *rule* subject to exemption, not a *fact* like gravity.
      *   *Date of Death:* Dec 12, 2013. Heart beat until 2018. This highlights the distinction between *legal death* (status) and *cellular/organ function*. The law prioritizes the neurological status for legal purposes (inheritance, marriage, liability) even if somatic function continues.
      *   *Damages Asmetry:* This reveals the *stakes*. If she's dead, cap applies. If alive, no cap. This incentivizes the family to argue "alive" regardless of biology. It exposes how the definition of death is a gateway to resource allocation.
      *   *Theory Running Out:* The theory defines *death*. It does not define *obligations*. Just because she was "dead" (biologically) doesn't answer whether the hospital *must* extubate immediately or *may* accommodate family. The theory is silent on the morality of maintaining "dead" bodies for grief processing.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the framework (Definition/Criterion/Test).
      *   *Mapping the Disagreement:*
          *   Hospital: Criterion/Tests met.
          *   Family: Rejecting the Criterion (implicitly favoring Cardiopulmonary) OR Rejecting the Authority (Procedural/Religious).
          *   NJ: Legal accommodation, not biological disagreement.
      *   *The Integrative-Unity Test:* Does Jahi refute Bernat?
          *   Argument: No. Somatic integration requires *spontaneous* homeostasis. Jahi had *supported* homeostasis. The "organism" was the body + machine + nurses.
          *   However: Puberty/growth suggests some hypothalamic/pituitary function or peripheral hormone feedback. This *strains* the "entire brain" criterion if some brainstem/hypothalamic function persisted. But legally, "all functions" usually means conscious + brainstem reflexes + respiration.
      *   *The NJ Exemption:* This is the crux. It admits death is a *legal construct* applied to biology, not biology itself. If it were purely biological (like "is this water H2O"), religious belief wouldn't change it. The exemption proves the *consequence* of the declaration is what's being negotiated, not the biology.
      *   *Date of Death:* It's a legal fiction necessary for closure (estates, etc.), but it creates the "zombie" paradox. It shows the law needs a bright line even if biology is a gradient or somatic function persists.
      *   *Where Theory Fails:*
          *   It doesn't tell us *when* to stop testing.
          *   It doesn't tell us how to handle dissent (accommodation vs. enforcement).
          *   It doesn't address the "moral weight" of a breathing corpse.
          *   It hides the moral judgment: "Integrated life is the only kind that counts."

  7.  **Refining the Tone:**
      *   Avoid "some say X, others say Y."
      *   Be decisive. "The theory breaks here." "This is a category error."
      *   Focus on the *structure* of the argument.

  8.  **Self-Correction/Nuance Check:**
      *   *Did Jahi have brain function?* Some reports suggested limited brainstem activity later, or at least hormonal. The initial diagnosis was "brain dead." If she wasn't truly brain dead, the hospital was wrong on the *Test/Criterion*, not the *Definition*. I need to acknowledge this uncertainty. The prompt asks to take the Whole-Brain criterion *seriously*, so I should analyze it *as if* the diagnosis was correct, but note where the long-term survival challenges the *irreversibility* claim.
      *   *Irreversibility:* The core of the criterion is *irreversible* cessation. If she lived 5 years, was it irreversible? Proponents say: No, because the ventilator did the work. The brain didn't recover. The *loss of function* was irreversible; the *body's function* was artificially sustained.
      *   *Damages:* The prompt mentions the malpractice suit strategy. This is key. It shows the definition of death is instrumentalized.

  9.  **Final Polish:** Organize into clear sections matching the prompt's demands. (Mapping, Integrative Unity, NJ/Law, Theory Limits). Ensure the distinction between *biological state* and *legal status* is sharp.

  *(Self-Correction during drafting)*: I need to be careful not to validate the family's medical claims as fact, but analyze their *position*. Their position shifted between "she's alive" (biological) and "God decides" (religious) to "she's alive for the lawsuit" (legal/financial). I should highlight this instability.

  *(Final check on Bernat)*: Bernat argues the brain is the *critical system* for integration. If the brain is gone, the body is a "biological organism" but not an "organism as a whole." Jahi's case tests the boundary of "organism as a whole."

