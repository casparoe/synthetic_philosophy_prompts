answer: |-
  - **The setup**
  Prepare 5 decks of 40 index cards. Each card has a simple noun or image (e.g., Apple, Wheel, Book, Tablet, Brick, Feather). Include 3 "borderline" cards per deck (e.g., Tomato, Robot, Pillow). Print 20 sheets with the letter-string puzzle: "If abc changes to abd, what does ijk change to?"
  Arrange 4 tables of 5 people. Push chairs in. Place one deck and 5 puzzle sheets per table. Whiteboard markers ready. Do not write anything on the board yet. Ensure tables are spaced for noise. Put a stack of blank cards and tape at each table. You need a timer visible to all. Pre-write the Round 1 instruction on a slip of paper to hand out, so you don't speak it.

  - **The rounds**
  **Round 1 (15 mins):** Hand out puzzles. Individually solve, then agree on one answer per table. Write the rule used. Most will say "ijl" (successor). Some may say "ijD" (replace last). Compare tables. Reveal different rules yield different answers. The "change" wasn't in the string, but in the mapping. Explicitly ask them to write *why* they chose their answer. When comparing, highlight that 'l' assumes a successor relation, 'D' assumes a position relation. Both are valid analogies.

  **Round 2 (30 mins):** Distribute cards. Task: "Sort into piles that make sense." Constraint: You cannot name the piles. To label a pile, you must tape one card from that pile to the whiteboard. That card *is* the label. Include a borderline card (Tomato). Disagreement will arise. Do not resolve verbally. Resolve by pointing: "It goes with *this* one" (taping a Pepper next to it). Emphasize the "No Words" rule. If they write "Fruit", make them erase it. They must choose an exemplar. This forces them to treat the category as "Things like *this*" (analogy) rather than "Things that are X" (definition).

  **Round 3 (30 mins):** Collect cards. Shuffle. New Task: "You are evacuating. Sort by what you save first." The piles shift. A "Book" might join "Wallet" instead of "Magazine". The "Kind" changed because the "Relation" changed. The exemplar labels from Round 2 no longer fit. The Flip. When they re-sort, ask them to look at the whiteboard labels from Round 2. Ask: "Does the Tomato still belong under the Pepper?" If they saved it for sentiment, yes. If for nutrition, maybe not. The *same object* changes kind based on the *pressure* applied. This mirrors the letter-string shift. In Round 1, if a table finishes early, give them "mrrjjj -> ?". In Round 2, circulate and watch for verbal labels. Stop them immediately. In Round 3, ensure they physically move the cards. The tactile shift matters. After sorting, ask each table to stand and explain their new piles using only the taped exemplars from Round 2. They will struggle. This struggle is the data. The failure of old labels to cover new piles demonstrates that the "category" was never static; it was a temporary analogy that hardened. Ensure the 'Evacuation' context is written on a card so you don't have to speak it. The silence maintains the experimental frame. When they struggle to explain Round 3 piles using Round 2 labels, do not help them. Let the friction sit. This friction is the feeling of the category boundary dissolving into relational mapping.

  - **What I'm allowed to say while it runs**
  Say nothing about theory. If asked "What's the point?", say: "Just do the task." If asked "Is this right?", say: "There is no right answer, only consistent ones." If they demand definitions, remind them of the pointing rule. Record their rule descriptions on the board verbatim. Do not summarize. Do not validate. If they argue about the Tomato, ask: "How did you settle that?" Expect: "We pointed." If someone tries to explain the cognitive science, interrupt: "Save that for the end." Keep the energy on the doing, not the explaining.

  - **The debrief**
  Split the room physically. Left side: You must describe the last 90 minutes using only the word "Category" (and variants). Right side: Use only "Analogy" (and variants). Ban the opposing term. Give 5 minutes to prepare a summary of the activity.
  Have each side present. You will notice the structures match perfectly. The "Category" side describes stable piles; the "Analogy" side describes relational mappings. Point out that the "Flip" in Round 3 was a shift in relation for one side, and a shift in kind for the other.
  Conclude: The accounts are identical. The distinction is linguistic, not cognitive. Only now mention Hofstadter. Write their summaries side-by-side on the board. Highlight the parallel structure. "Group A said 'The category shifted.' Group B said 'The analogy shifted.' They mean the same event." Ask the room: "Which explanation required more assumptions?" Neither. This demonstrates your claim: categorization is just frozen analogy. The "basic thing" Nadia claimed exists is invisible here. Ask the "Category" camp: "How did you decide the Tomato moved?" They will say "It fits a new category." Ask "Analogy" camp: "How did you decide?" They will say "It maps better to Wallet now." Show that "fits a category" and "maps better" are doing the same work. The "basic thing" Nadia argued for is nowhere to be found in the process.

  - **What will go wrong the first time**
  Participants will resist the pointing rule as "silly." Insist. They will try to write "Fruit" on a card. Confiscate the pen. They may finish Round 1 too fast. Have a backup puzzle (mrrjjj -> ?). They might not disagree on the borderline card. Seed the decks differently so one table gets "Tomato" and "Vegetable Soup" while another gets "Tomato" and "Apple". Ensure conflict. If the room stays polite, provoke: "Table 3, does Table 2's Tomato belong in your pile?" Timekeeping is critical. If Round 2 drags, cut Round 3 short rather than skipping the debrief. The debrief is where the learning happens. If they get stuck on the letter string, give the hint: "Look at the letters, not the alphabet."

  - **What this can't show**
  This shows functional equivalence, not neural identity. It doesn't prove the brain uses one mechanism. It equally supports Prototype Theory (shifting centroids) or Exemplar Theory (shifting reference points). It doesn't kill the surface/structural distinction; it just shows both rely on mapping. You must explicitly state: "This doesn't prove mechanism, it proves indistinguishability." The activity cannot touch the hard problem of representation. It shows that *operationalizing* the difference is impossible in real-time judgment. Acknowledge that standard cognitive science still models them differently. This activity challenges the *ontological* split, not the *modeling* utility. You can model them separately, but you can't find where one ends and the other begins in the wild. Be careful not to claim you've disproven modular theories, only that the boundary is porous.
