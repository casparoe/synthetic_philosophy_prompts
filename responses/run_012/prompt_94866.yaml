answer: |-
  Here is the specification you requested, structured as a measurement problem analogous to the thermodynamic scaffolding you know well.

  ### I. The Desiderata for Interpersonal Utility Comparison

  **1. Intra-personal Coherence (The Single-Body Thermometer)**
  *   **Requirement:** Before comparing Person A to Person B, the theory must provide a representation of Person A's welfare that is coherent under risk and logical constraint. It must recover a utility function $u_A$ consistent with von Neumann-Morgenstern axioms (completeness, transitivity, continuity, independence) or explicitly justify deviations (incompleteness, cyclicity).
  *   **Justification:** You cannot compare the temperature of two bodies if you cannot define temperature for one. If a person's preferences are cyclical ($A \succ B \succ C \succ A$) or incomplete, no function $u$ exists to map them to real numbers. A theory of comparison that ignores intra-personal incoherence compares artifacts, not agents.

  **2. Scale Calibration and Zero-Point Fixation (The Absolute Zero)**
  *   **Requirement:** The theory must specify which mathematical comparisons are meaningful: ordering ($u_A > u_B$), differences ($u_A - u_B > u_C - u_D$), or ratios ($u_A = 2u_B$). Crucially, it must identify the device that fixes the zero-point and the unit size for each person, given that standard utility is unique only up to a positive affine transformation ($u' = au + b, a > 0$).
  *   **Justification:** In thermodynamics, saying Body A is "twice as hot" as Body B is nonsense on the Celsius scale but meaningful on Kelvin. In welfare, saying Person A gains "twice as much utility" as Person B is mathematically undefined unless the arbitrary additive constant $b$ (the zero-point) is fixed by something other than convention. Without this, the comparison is a artifact of the coordinate system.

  **3. Invariance under Admissible Rescaling (Coordinate Independence)**
  *   **Requirement:** The verdict of the comparison must remain unchanged under any rescaling of individual utility functions that the theory admits as permissible. If the theory claims utility is cardinal, the verdict must hold under changes of unit ($a$). If it claims level comparability, it must hold under changes of zero ($b$). It must not achieve comparability merely by stipulating a normalization (e.g., "set everyone's minimum to 0") that forces the result.
  *   **Justification:** A physical law cannot depend on whether you measure in inches or centimeters. Similarly, an ethical truth about relative welfare cannot depend on whether we number Person A's satisfaction from 0–10 or 100–110. If the verdict changes with the numbering, the theory is comparing numbers, not welfare.

  **4. Robustness to Psychological Variation (The Stock Cases)**
  *   **Requirement:** The theory must yield ethically plausible verdicts in four specific calibration cases:
      *   *The Utility Monster:* A being who converts resources into immense satisfaction (Nozick).
      *   *Adaptive Preferences:* A deprived person whose desires shrink to match their oppression (Sen/Nussbaum).
      *   *Risk Attitudes:* Two people with identical outcome rankings but different risk tolerance (Harsanyi).
      *   *Expensive Tastes:* A person who requires vast resources for trivial gains vs. one who needs little for satisfaction (Dworkin).
  *   **Justification:** These are the "standard candles" of moral astronomy. A theory that validates the Utility Monster fails distributive justice; one that validates Adaptive Preferences fails liberation; one that conflates risk tolerance with intensity of preference fails rational choice; one that rewards Expensive Tastes fails fairness. The theory must navigate these without breaking the other desiderata.

  **5. Aggregation Compatibility (The Engine Linkage)**
  *   **Requirement:** The comparison must be defined precisely enough to feed the intended social welfare function or aggregation rule. If the goal is utilitarian summing, ratio or level comparability is required. If the goal is Rawlsian maximin, only ordering is required. The comparison cannot be looser than the aggregation demands, nor tighter than the evidence allows.
  *   **Justification:** Measurement is for use. A theory of IUC that delivers precise ratios but cannot be aggregated without violating rights is inert. Conversely, an aggregation rule that demands ratios but receives only orderings is mathematically broken. The interface must match.

  ***

  ### II. Adequacy vs. Prejudice

  You asked to distinguish genuine requirements from the prejudices of specific camps. Your suspicion is well-founded.

  *   **Genuine Adequacy:**
      *   **Intra-personal Coherence (1):** This is logical, not ideological. You cannot compare what you cannot define.
      *   **Non-Circularity (part of 3):** Stipulating a normalization to force a comparison is a logical fallacy, not a philosophical stance.
      *   **Aggregation Compatibility (5):** This is functional. If the tool doesn't fit the job, it is inadequate.

  *   **Camp Prejudices:**
      *   **Independent Measurability:** The demand that utility be measurable *independently* of the theory (like heat via a thermometer) is an empiricist prejudice. Many adequate theories (e.g., revealed preference) define utility *through* the choice behavior, not as a hidden substance measured beforehand. Demanding a "welfare meter" rules out constructivist approaches without cause.
      *   **Invariance under Affine Transformation (3):** This is often a prejudice of **welfarist neutrality**. It assumes there is no "natural zero" for welfare. However, if a theory posits a natural zero (e.g., "death," "subsistence," or "neutral affect"), then invariance under additive shifts ($+b$) is not a requirement; it is an error. Demanding invariance *pre-judges* that welfare has no absolute baseline.
      *   **Ratio Comparability (part of 2):** The demand that we be able to say "twice as well off" is a prejudice of **Classical Utilitarianism**. Most modern theories (e.g., Rawls) require only level or difference comparability. Insisting on ratios eliminates viable ethical systems that do not treat welfare as a conserved quantity.

  ***

  ### III. The Incompatibility

  You asked if any two requirements cannot be satisfied together. I must say it plainly: **The list is jointly unsatisfiable in its strongest form.**

  The specific contradiction lies between **Requirement 2 (Scale Calibration for Ratios/Levels)** and **Requirement 3 (Invariance under Affine Transformation)**, given **Requirement 1 (Preference Sovereignty)**.

  1.  **The Mathematical Conflict:** Standard utility theory (Requirement 1) derives utility from preferences under risk. This yields a function unique only up to positive affine transformation ($u' = au + b$).
  2.  **The Comparison Demand:** To make level comparisons ($u_A > u_B$) or ratio comparisons ($u_A = 2u_B$) meaningful (Requirement 2), you must fix $b$ (the zero) and potentially $a$ (the unit).
  3.  **The Invariance Trap:** If you fix $b$ and $a$ by theoretical fiat (e.g., "zero is death"), you violate Invariance (Requirement 3) because the comparison is no longer robust to rescaling; it depends entirely on your fiat zero. If you maintain Invariance (allowing any $b$), you cannot make Level or Ratio comparisons.
  4.  **The Ethical Conflict:** If you attempt to fix $b$ using empirical data (Requirement 4, Adaptive Preferences), you often violate Requirement 1 (Preference Sovereignty). To correct for adaptive preferences, you must assert the person's reported utility is *wrong*, which breaks the link between preference and welfare established in Requirement 1.

  **Verdict:** You cannot have **Preference-Based Utility**, **Full Affine Invariance**, and **Meaningful Level/Ratio Comparisons** simultaneously. You must drop one.
  *   Drop Invariance $\rightarrow$ You posit a natural zero (controversial metaphysics).
  *   Drop Level/Ratio $\rightarrow$ You retreat to ordinalism (limits aggregation).
  *   Drop Preference-Based $\rightarrow$ You move to Objective List/Capabilities (paternalism risk).

  ***

  ### IV. The Eliminative Requirement and Contender Scorecard

  The single requirement that does the most to eliminate candidate theories is **Requirement 2: Scale Calibration and Zero-Point Fixation.**

  This is the "Absolute Zero" problem. Without a non-arbitrary zero, level and ratio comparisons are mathematically void. Most theories collapse when asked to specify the zero without circularity.

  **How the Leading Contenders Fare:**

  1.  **The Summing Tradition (Classical & Preference Utilitarianism):**
      *   **Status:** **Fails.**
      *   **Reason:** It demands ratio or level comparability to sum utilities. However, it typically relies on preference satisfaction (Requirement 1) which provides no natural zero. It often smuggles in a zero by stipulation (e.g., "status quo = 0") which violates Invariance (Requirement 3). It cannot explain why one person's "10" is the same magnitude as another's "10" without begging the question.

  2.  **Primary Goods (Rawls):**
      *   **Status:** **Sidesteps.**
      *   **Reason:** It rejects the measurement of utility (welfare) entirely. It compares all-purpose *means* (rights, income) rather than *ends* (satisfaction). It avoids the Zero-Point problem for utility by refusing to measure utility. However, it fails Requirement 4 (Stock Cases) regarding Adaptive Preferences and Disabilities (a disabled person needs more goods to achieve the same status), and it struggles with Requirement 5 (Aggregation) when goods conflict.

  3.  **The Capability Approach (Sen/Nussbaum):**
      *   **Status:** **Partial Success / High Cost.**
      *   **Reason:** It fixes the zero-point objectively (e.g., "basic functionings" or "thresholds of dignity"). This solves the Calibration problem. However, to do so, it violates Requirement 1 (Preference Sovereignty) by judging welfare based on what a person *can do*, not what they *want*. It also struggles with Requirement 5 (Aggregation) because weighting different capabilities (health vs. education) reintroduces the arbitrary scaling problem at a higher level.

  4.  **Imaginative Placement (Harsanyi/Smith/Sympathy):**
      *   **Status:** **Fails on Invariance.**
      *   **Reason:** This attempts to fix the scale by asking an observer to imagine themselves in another's position. While it generates a comparison, the result depends on the observer's own risk attitude and utility function (Requirement 1). It violates Invariance (Requirement 3) because different observers will calibrate the scales differently. It turns the "Absolute Zero" into a "Subjective Zero," rendering the comparison intersubjective at best, not objective.

  **Conclusion:** The thermodynamic analogy holds. You cannot compare the heat of two bodies without a theory that defines what heat *is* and where absolute zero *lies*. Moral philosophy currently lacks the equivalent of the Third Law of Thermodynamics. Until a theory can specify the zero-point of welfare without circularity or tyranny, interpersonal comparison remains scaffolding without a building.
