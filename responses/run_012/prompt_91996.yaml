          *   What is the relation of music to drama?
          *   Use Bernard Williams as a resource (but focus on reconstruction).
          *   Distinguish between what the practice *strictly presupposes*, what *fits comfortably*, and what is *underdetermined*.
          *   Evaluate Williams's view against the average opera-goer's pattern (more/less permissive?).
          *   Explore the consequences of replacing the presupposed view with the most plausible rival.
      *   **Constraint:** No citations. Just the argument.

  2.  **Deconstruct the Phenomenon:**
      *   *Accepted Unrealism:* Singing instead of speaking, loud dying, invisible orchestra, time dilation (arias), age-inappropriate casting.
      *   *Rejected Changes:* Modern settings (Regietheater), libretto changes, cutting music, non-traditional casting (sometimes).
      *   *The Paradox:* Why is *metaphysical* unrealism okay, but *sociological/historical* realism-breaking not okay?

  3.  **Reconstruct the Presuppositions (The "Opera Contract"):**
      *   *Ontology of the Work:* The audience seems to treat the *music* (and the musical structure) as the sacred core. The score is inviolable. The libretto is semi-sacred (words matter, but maybe less than notes). The *setting* is viewed as part of the "packaging" but strangely bound to the era of composition or the implied world of the music.
      *   *Internal vs. External Conventions:*
          *   *Internal (Essential):* Singing, orchestral accompaniment, musical form (arias, ensembles). You can't turn *La Bohème* into a play.
          *   *External (Accidental but sticky):* Costumes, sets, specific historical context. *However*, the audience treats the *original* context as if it were internal.
      *   *Music vs. Drama:* The pattern suggests Music is the Master. Drama is the vehicle, but a specific *kind* of drama—one that justifies the music. If you change the drama too much (modern setting), the music might seem to "lie" or lose its justification.
      *   *The "Work" Identity:* It's not just the notes. It's the notes + the *imagined world* that makes the notes make sense. If Mimi dies to a waltz, she must be in a world where waltzes attend death. If you put her in a gritty 1970s project, the waltz feels ironic or absurd, which violates the "sincere unreality" of opera.

  4.  **Integrate Bernard Williams:**
      *   *Williams's Key Insights:* Opera is "manifestly artificial." It doesn't try to hide its artifice (unlike realistic theater). The emotion is carried by the music, not the psychological realism of the plot.
      *   *Authenticity:* Williams was skeptical of "authenticity" in the historical performance sense but cared about the integrity of the *experience*.
      *   *The "Naive vs. Sentimental" distinction:* Naive lovers accept the convention; sentimental lovers analyze it. The average outraged audience member is often a "sentimental" protector of tradition masquerading as a "naive" believer in the work.
      *   *Williams on Regietheater:* He generally disliked director-led concepts that overrode the musical drama. He believed the music dictates the terms of the drama.
      *   *Alignment:* Williams would likely agree with the audience that the *music* determines the limits. But he might be more permissive about setting *if* the setting doesn't contradict the musical emotion. However, he would be strict about the "truth" of the musical expression.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the paradox. Define the scope.
      *   **Ontology (What is the Work?):** The audience treats the *Score* as the soul, but the *Style* as the body. Changing the notes is heresy. Changing the clothes is okay *unless* the clothes change the meaning of the notes. The work is a "musical-dramatic gesture" fixed in time.
      *   **Internal vs. External Conventions:** Singing is internal (constitutive). Orchestra invisibility is internal. Historical setting is treated as "quasi-internal." Why? Because the music encodes the social relations of its time (e.g., Minuet = Aristocracy). Changing the setting breaks the semiotic link between music and social meaning.
      *   **Music vs. Drama:** Music is primary. Drama exists to allow music to happen. But the drama must be *compatible* with the music's emotional temperature. A gritty realist setting demands gritty realist music. Verdi sounds "fake" in a gritty setting.
      *   **Strict Presuppositions vs. Comfortable Fits vs. Underdetermined:**
          *   *Strict:* The notes must be played. Singing must occur.
          *   *Comfortable:* Original language, original period setting (makes the music "true").
          *   *Underdetermined:* Casting (voice type matters more than race/gender), specific blocking.
      *   **Williams's View:** Williams emphasizes "manifest artifice." He would support the tolerance for singing/dying loudly. He would likely critique the *outrage* at modern settings *if* the director respects the musical truth. However, Williams thinks the music carries the philosophical weight. If a modern setting trivializes the music, he'd side with the audience. He is likely *less* permissive about directorial conceits that treat the opera as a play with music, but *more* permissive about abstract/stylized productions that highlight the artifice.
      *   **The Rival View (The "Dramatic Realist" or "Radical Contextualist"):**
          *   *View:* Opera is theater first. Music serves the story.
          *   *Consequence:* Cutting boring bits is fine. Modernizing is mandatory to keep it relevant.
