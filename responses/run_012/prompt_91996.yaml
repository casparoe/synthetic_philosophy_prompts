answer: |-
  The pattern of tolerance you describe reveals a specific, often unarticulated ontology of the operatic work. It is not merely conservative; it is metaphysically selective. To understand why a dying heroine singing at full volume is acceptable while a *Traviata* set in a modern clinic is scandalous, we must reconstruct the philosophical commitments underlying the "opera contract."

  ### 1. The Ontology of the Work: The Score as Soul, The Setting as Body
  The audience's behavior presupposes that the operatic work is primarily a **musical structure with a fixed emotional trajectory**, rather than a dramatic narrative with musical accompaniment.

  *   **The Sacred Core:** The score (notes, orchestration, tempo markings) is treated as the inviolable essence. To cut a da capo or rewrite a libretto is to damage the work's identity because the music is viewed as the primary carrier of meaning.
  *   **The Semi-Sacred Shell:** The original setting and costumes are treated as "quasi-essential." They are not strictly required by the notes, but they are viewed as the *necessary conditions for the notes to make sense*. The audience assumes that the composer's musical language encodes the social and physical world of the premiere. A minuet implies aristocracy; a drinking song implies a tavern. If you move the setting to a corporate boardroom, the music becomes a lie—it signifies a social reality that no longer exists on stage.
  *   **The Permissible Veil:** Physical realism (age, volume, visibility of the orchestra) is categorized as "stage machinery." These are acknowledged as technical limitations or stylistic conventions that do not touch the work's soul. A 55-year-old playing a teenager is a visual approximation; the *voice* remains the truth of the character.

  **Philosophical Commitment:** The work is an **expressive object**, not a representational one. Its truth lies in the authenticity of the emotional expression (the music), not the accuracy of the depiction (the staging).

  ### 2. Internal vs. External Conventions
  The distinction between what is "internal" (constitutive of opera) and "external" (accidental) is drawn not by logic, but by **semiotic stability**.

  *   **Internal (Fixed):** Singing instead of speaking, the orchestra's inaudibility to characters, the suspension of time during an aria. These are presupposed as the *definition* of the medium. To remove them is to cease doing opera. They are "internal" because they are required for the music to function as music.
  *   **External (but Sticky):** Historical setting, original language, traditional casting. These are theoretically swappable, but the audience treats them as fixed because they stabilize the **semiotics of the music**. If the music sounds "Italian 1850," the staging must support "Italian 1850" to prevent a semiotic clash.
  *   **The Paradox:** The audience accepts *metaphysical* unreality (singing when dying) because it serves the music. They reject *sociological* unreality (modern dress) because it threatens the music's meaning.

  **Philosophical Commitment:** Conventions are internal if they facilitate musical expression; they are external if they merely describe the world. However, historical context is treated as internal because the music is historically coded.

  ### 3. Music vs. Drama: The Primacy of the Musical Emotion
  The pattern assumes that **music is the agent, and drama is the pretext.**

  *   In realistic theater, drama drives the action. In opera, the audience accepts that the drama pauses so the music can explore an emotional state.
  *   Therefore, changes to the drama (setting, era) are judged solely by whether they support or undermine the music's emotional claim. A modern setting is rejected not because it is "new," but because it often introduces an irony or grit that contradicts the sincere emotionalism of the score. If Mimi dies in a sterile modern hospital, the lush orchestration of her death might feel manipulative or fake. If she dies in a garret with candles, the lushness feels "true" to the world.
  *   **Commitment:** The drama must be subservient to the music's emotional logic. The music cannot be made to serve a directorial concept that contradicts its inherent affect.

  ### 4. Categorizing the Presuppositions
  To be precise about what this practice entails, we can divide the commitments into three categories:

  **A. Strictly Presupposed (The practice cannot exist without these):**
  1.  **The Sovereignty of the Score:** The notes and orchestration define the work's identity.
  2.  **The Convention of Song:** Characters express interiority through singing, not speaking.
  3.  **The Invisibility of the Source:** The orchestra is an externalized interiority, not a diegetic band.
  4.  **Emotional Truth over Physical Realism:** The validity of the performance rests on the vocal/emotional delivery, not physical verisimilitude.

  **B. Fits Comfortably (Consistent with the practice, but not strictly required):**
  1.  **Original Language:** Singing in translation is rare, but the work survives it. However, the *sounds* of the language are treated as part of the musical texture.
  2.  **Period Staging:** It fits comfortably because it aligns the semiotics of the music with the visuals.
  3.  **Voice-Type Casting:** A tenor is a tenor regardless of race or age, provided the vocal color matches the character's archetype.

  **C. Philosophically Underdetermined (The practice is inconsistent here):**
  1.  **Casting Identity:** There is no principled reason why a 55-year-old playing a teenager is okay, but a different race playing the role is sometimes scandalous. Both are visual departures. The inconsistency suggests the audience protects *vocal* truth (age affects voice) more than *visual* truth, but racial politics complicate this.
  2.  **Libretto Integrity:** Cutting recitatives is often tolerated; cutting arias is not. This implies the "numbers" are the work, and the connective tissue is expendable, yet changing the words of the connective tissue is often scandalous.
  3.  **Directorial Intervention:** Where does "interpretation" end and "desecration" begin? The line is drawn arbitrarily based on whether the audience feels the music is being "illustrated" (good) or "critiqued" (bad).

  ### 5. Bernard Williams's View
  Bernard Williams approached opera with a philosopher's eye for **manifest artifice**. He argued that opera succeeds not by hiding its conventions, but by flaunting them. For Williams, the emotion is in the music, not the plot.

  **Would Williams license the audience's pattern?**
  *   **Agreement:** Williams would agree with the tolerance for singing, loud dying, and invisible orchestras. These are examples of "manifest artifice" that allow the music to do its work. He would agree that the music is the primary carrier of meaning.
  *   **Disagreement:** Williams would likely be **more permissive** regarding setting than the average outraged audience member, *provided* the production respects the musical emotion. He was skeptical of "authenticity" that fetishized historical accuracy over philosophical truth. If a modern setting clarifies the emotional conflict without ironic detachment, Williams might endorse it.
  *   **The Limit:** However, Williams would be **less permissive** than modern *Regietheater* directors. He argued that if a production treats the opera as a play with music, it fails. If a director imposes a political concept that forces the music to mean something it doesn't (e.g., making *Figaro* a critique of late-stage capitalism when the music is about human foibles), Williams would side with the traditionalists.
  *   **Verdict:** Williams commits to a **Musical Humanism**. He would reject the audience's fetishization of period costumes if it becomes a museum exercise, but he would reject the director's fetishization of "concepts" if it overrides the music. He occupies a middle ground: the production must serve the *emotional logic of the score*, whether that requires 18th-century wigs or abstract lighting.

  ### 6. The Rival View and Its Consequences
  The most plausible rival to the presupposed view is **Radical Dramatic Realism** (or "Music Theater" ontology).

  **The Rival Presuppositions:**
  *   **The Work is a Play:** Opera is a dramatic action where music is one tool among many (like lighting or blocking).
  *   **Relevance is Key:** The work must speak to the contemporary condition to be valid.
  *   **Fluidity:** The score is a script, open to revision, cutting, and rearrangement to serve the pacing of the drama.

  **Consequences if this View Replaced the Current One:**
  1.  **Death of the Aria:** If drama is primary, the time-stopping aria becomes an indulgence to be cut or drastically altered. The "pause in time" is a violation of dramatic realism.
  2.  **Amplification and Acting:** Singing at full volume while dying would be replaced by amplified, naturalistic acting. The voice would be subordinate to the psychological truth of the moment.
  3.  **Director as Author:** The director would become the primary author, with the composer serving as a collaborator from the grave. We would see more re-orchestrations and libretto rewrites to fit modern sensibilities.
  4.  **Loss of the "Opera Effect":** The specific metaphysical sensation of opera—that the world is structured by music, not physics—would vanish. Opera would become a sub-genre of musical theater. The "uneven tolerance" would flatten: audiences would accept modern settings but reject loud dying.

  ### Conclusion
  The current pattern of tolerance presupposes that opera is a **musical world** that we enter, not a **mirror of our world** that we watch. The audience protects the music's sovereignty above all else. They accept physical unrealism because it serves the music; they reject contextual unrealism because it often threatens the music's semantic stability.

  Bernard Williams would refine this: he would ask not "Is this historically accurate?" but "Does this allow the music to tell the truth about human emotion?" He would likely find the average audience too attached to historical accident (costumes) and the average director too attached to intellectual concept (politics). The philosophical core that sustains the art form is the belief that **music reveals a truth that realism cannot**, and any staging that obscures that revelation is a betrayal, whether it comes from a museum-curator approach or a deconstructive one.
