      *   *Nuance:* The audience isn't consistent. They accept 55-year-old teenagers (visual unreality) but reject 1970s settings (contextual unreality). Why? Because age is a physical limitation, but setting is an interpretive choice. The audience assumes the *composer's interpretive choice* is binding.
      *   *Williams nuance:* Williams argued opera is about the *expression of emotion* through music, not the representation of action. So, if a production highlights the emotion, it's good. If it highlights the politics (Regietheater), it might fail Williams's test.
      *   *Ontology:* The audience acts like the Work is a "Type" fixed at the premiere. But they accept new singers. So the Work is the Structure + The Emotional Trajectory.

  7.  **Final Polish:** Check against constraints. No citations. Clear argument structure. Address all parts of the prompt. (Ensure the distinction between "strictly presupposes," "fits comfortably," and "underdetermined" is explicit).

  8.  *(Mental Check on Williams)*: Williams's essay "Opera as a Philosophical Genre" and his thoughts on *Tristan* emphasize that opera creates a world where music *is* the action. He is skeptical of "updating" if it undermines the specific emotional logic of the score. He distinguishes between the "naive" acceptance of convention and the "sentimental" over-analysis. The outraged audience is often "sentimental" about history but "naive" about acoustics.

  9.  *(Final Plan)*:
      1.  Define the "Opera Contract" (Ontology).
      2.  Analyze the Internal/External distinction (Conventions).
      3.  Analyze Music/Drama relation.
      4.  Categorize Presuppositions (Strict/Comfortable/Underdetermined).
      5.  Apply Williams.
      6.  Propose the Rival View and Consequences.

