  1. Curry's paradox. The liar is one thing, but the Curry sentence — the one that says "if this sentence is true, then X" — seems to hand you X for arbitrary X by nothing more exotic than modus ponens and the truth schema, without any appeal to a sentence being both true and false. So the dialetheist's usual "some contradictions are true, deal with it" move doesn't even get traction here. Explain, conceptually, why Curry is a genuinely different and harder beast than the liar for a dialetheist, and what the main families of response actually do to block it (I'm thinking of things like restricting contraction, or weakening the conditional so it doesn't fully detach, or restricting which instances of the truth schema you're allowed). What does each fix cost you, and which cost is least tolerable?

  2. The bit I keep getting tangled on: in a logic where explosion fails, how do you even *say* "this particular contradiction is not one of the true ones"? Because you can't lean on negation to mean "not the case" in the old reliable way — negation has gotten weaker, so "it's not the case that P" no longer rules P out. So explain the idea of a consistency operator / classicality operator: why you'd need a separate gadget to express "this sentence behaves classically," what it's supposed to do, and what the tradeoffs are of bolting one on. I want the actual conceptual motivation, not just the name.

  3. And a thing that smells ad hoc to me and I want you to either defend or concede: the dialetheist line that true contradictions are rare, that they only crop up at the boundaries of expressibility (liar-type sentences, maybe some semantic or set-theoretic cases), and that ordinary reasoning stays classical. Is there a principled story about *why* the true contradictions would cluster like that, or is "they're rare" just a patch to keep the view from swallowing everything?

  Along the way, keep three things strictly apart, because I think I've been sloppy about them: paraconsistency (the logic), dialetheism (the claim that some contradictions are true), and trivialism (everything's true). And if it helps you make it concrete, walk me through a toy contrast between a logic that's paraconsistent but *not* dialetheist and one that's both — I want to feel the difference rather than just read the labels.
