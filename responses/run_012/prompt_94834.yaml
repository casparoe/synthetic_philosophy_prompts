answer: |-
  ### Preliminary Mapping: The Moving Parts

  Before we dive into the technicals, I need to lay out the architecture of the problem space. You're right to sense that blocking explosion is merely the entry fee, not the solution. Here is how I'm structuring the trade-offs in my head:

  1.  **The Logic vs. The World:** Paraconsistency is a property of the *consequence relation* ($\nvdash$). Dialetheism is a claim about *truth values* (ontology/semantics). You can have the former without the latter (e.g., error-tolerant databases), but the dialetheist needs both. Trivialism is the collapse state where the consequence relation becomes universal *and* everything is true.
  2.  **The Negation vs. Implication Fault Line:** The Liar paradox attacks Negation ($\neg$). Curry attacks Implication ($\to$). A logic can survive the Liar by weakening Negation (making it non-exclusive), but Curry bypasses Negation entirely. If your Implication is classical (Modus Ponens + Contraction), Curry kills you regardless of your stance on Negation.
  3.  **Expressive Adequacy:** If you weaken Negation to block Explosion, you lose the ability to *exclude* states of affairs. You need a new operator to recover exclusion (Consistency Operator), but adding operators risks re-triggering paradoxes (Revenge).
  4.  **Recapture:** If true contradictions are rare, we need a mechanism to "recapture" classical logic for ordinary math/science. Without this, dialetheism is practically unusable.

  With that map in place, let's get into the weeds.

  ---

  ### 1. Curry's Paradox: The Implication Problem

  You identified the crux: The Liar is a problem for *negation*; Curry is a problem for *implication*. This is why the standard dialetheist move ("just accept the contradiction") fails against Curry.

  **The Structural Difference**
  In the Liar ($\lambda \leftrightarrow \neg T\langle\lambda\rangle$), the derivation of triviality relies on the behavior of $\neg$. Specifically, it relies on the principle that $A$ and $\neg A$ cannot both be true (or if they are, they explode). The dialetheist says: "Fine, they are both true, and we block explosion." Game over for the Liar.

  Curry ($C \leftrightarrow (T\langle C\rangle \to \bot)$) does not use negation in its derivation of $\bot$ (or arbitrary $Q$). It relies on:
  1.  **The Truth Schema:** $T\langle A\rangle \leftrightarrow A$.
  2.  **Modus Ponens (MP):** $A, A \to B \vdash B$.
  3.  **Contraction:** $(A \to (A \to B)) \vdash (A \to B)$.

  If you have these three, you derive $\bot$ (or $Q$) directly. Since there is no $\neg$ involved, saying "some contradictions are true" is irrelevant. There is no contradiction to accept; there is just a derivation of $Q$. If you accept Curry sentences, you are a trivialist, not a dialetheist.

  **The Families of Response**
  To block Curry while keeping the Truth Schema (which dialetheists want for semantic closure), you must break the derivation. There are three main places to cut, each with a heavy cost.

  *   **Option A: Restrict Modus Ponens (Non-detachable conditionals).**
      *   *The Move:* You keep the Truth Schema, but you say $A$ and $A \to B$ do not necessarily entail $B$ in all contexts.
      *   *The Cost:* This is devastating. The whole point of a conditional is detachment. If you can't detach, the conditional doesn't function as "if-then." It becomes a weak implication operator. You lose the ability to reason hypothetically in the standard way. Most dialetheists (like Priest) find this too high a price; it cripples the logic's utility.
  *   **Option B: Restrict Contraction (Non-contractive logics).**
      *   *The Move:* You block the step where you use the assumption $C$ twice. In the Curry proof, you assume $C$, derive $C \to \bot$, then use $C$ again to get $\bot$. Contraction allows you to merge those uses. Logics like **LC** (Logic of Contraction) or systems proposed by Jc Beall drop contraction.
      *   *The Cost:* This is technically subtle but conceptually jarring. It means you can't always reuse premises. In proof theory, it looks like resource sensitivity (like Linear Logic), but applied to truth. The cost is that standard mathematical induction and reasoning patterns that rely on reusing assumptions need careful re-verification. However, this is currently the most popular route for serious dialetheists (e.g., Beall's *Spandrels of Truth*) because it preserves MP and the Truth Schema.
  *   **Option C: Restrict the Truth Schema.**
      *   *The Move:* Say the T-Schema ($T\langle A\rangle \leftrightarrow A$) only holds for "grounded" sentences.
      *   *The Cost:* This abandons semantic closure. It admits that there are truths about truth that cannot be expressed in the language. For a dialetheist who wants to say "Language is semantically closed," this is a surrender. It moves you closer to a Kripkean fixed-point view, which dialetheists typically reject as incomplete.

  **Verdict:** The non-contractive route is the "least tolerable" cost that is *still tolerable*. It preserves the intuitive behavior of "if-then" (MP) and the universality of truth, but it forces you to rethink how assumptions are managed in a proof.

  ---

  ### 2. Expressing Consistency: The "Just False" Problem

  This is the expressive bottleneck. In classical logic, $\neg A$ means "A is not the case." It excludes $A$. In a paraconsistent logic like **LP** (Logic of Paradox), $\neg A$ means "A is at least false." It does *not* exclude $A$ being true as well.

  **The Conceptual Problem**
  If I want to claim that "Snow is white" is *merely* true (and not also false), asserting $\neg(\text{Snow is white} \wedge \neg\text{Snow is white})$ doesn't work. In LP, that statement is true even if the contradiction holds (because $\neg$ is weak). You cannot use the logic's native negation to say "This sentence is not a dialetheia."

  If you can't say that, you can't distinguish ordinary reality from semantic paradoxes. You lose the ability to assert that arithmetic is consistent, or that you aren't currently in a contradictory state.

  **The Solution: The Consistency Operator ($\circ$)**
  To fix this, we introduce a primitive operator, often denoted $\circ A$ (from the **LFIs** - Logics of Formal Inconsistency).
  *   **Meaning:** $\circ A$ asserts "A behaves classically" or "A is consistent."
  *   **Function:** It acts as a switch for Explosion.
      *   Standard Paraconsistent: $A, \neg A \nvdash B$.
      *   With Operator: $\circ A, A, \neg A \vdash B$.
  *   **Why Primitive?** You usually cannot define $\circ A$ as $\neg(A \wedge \neg A)$ because, again, negation is weak. It must be a new logical gadget.

  **The Trade-offs**
  1.  **Hierarchy vs. Uniformity:** If you add $\circ$, you need rules for it. Can you say $\circ \circ A$? If you allow $\circ$ to apply to itself without restriction, you risk generating new Curry-style paradoxes involving consistency (e.g., "This sentence is not consistent"). You need a careful axiomatization to ensure $\circ$ doesn't become a source of new triviality.
  2.  **The "Classical Recapture" Burden:** The dialetheist wants to say: "Most things are consistent." So, for almost all $A$, $\circ A$ holds. But if $\circ A$ is a premise you must assert for every classical inference, reasoning becomes cumbersome. You need a "Recapture Theorem" showing that for any consistent theory, the paraconsistent logic collapses back into classical logic.
  3.  **Conceptual Opacity:** Critics argue this is ad hoc. "You broke negation, so you bought a new operator to do negation's job?" The defense is that negation *does* two jobs: (1) forming opposites and (2) excluding possibilities. Paraconsistency splits these jobs. $\neg$ does (1), $\circ$ manages (2). It's not a patch; it's a differentiation of logical roles.

  ---

  ### 3. The Rarity Claim: Principled or Ad Hoc?

  You asked if limiting true contradictions to "boundaries of expressibility" is just a patch to avoid trivialism. This is the **Principle of Minimal Dialetheism**.

  **The Worry**
  If logic is universal, why doesn't paraconsistency infect empirical claims? If $A \wedge \neg A$ is possible, why isn't it possible that "The cat is on the mat and not on the mat" in a mundane sense? If the dialetheist says "That never happens," it sounds like they are protecting their view from empirical falsification by fiat.

  **The Principled Defense: The Inclosure Schema**
  Graham Priest's defense is not empirical; it is structural. He argues that dialetheias arise from **Inclosure**: situations where a totality is defined, and an operation pushes you outside that totality, yet you remain inside it.
  *   **Examples:** The set of all sets (Cantor), the extension of all truths (Liar), the limit of all ordinals (Burali-Forti).
  *   **The Claim:** Contradictions are not random. They cluster at the *limits of thought* and *semantic closure*. They are symptoms of trying to express the ineffable or the total within the system.
  *   **Why Ordinary Reality is Safe:** Ordinary empirical claims ("The cat is on the mat") do not involve self-reference or totalities. They are "open" claims, not "closed" totalities. Therefore, there is no structural pressure for them to be contradictory.

  **Is it Ad Hoc?**
  It is *principled*, but it is *fragile*.
  *   **Strength:** It explains *why* the Liar is contradictory without making *everything* contradictory. It locates the pathology in the structure of reference, not the world.
  *   **Weakness:** It requires a sharp distinction between "ordinary" and "boundary" cases. But language is slippery. We can construct empirical-sounding sentences that encode self-reference (e.g., via Gödel numbering of physical states). If the logic is truly universal, the "boundary" must be logical, not topical. The dialetheist must argue that *only* sentences with specific structural features (self-reference + truth predicates) trigger the paraconsistent behavior.
  *   **Verdict:** It's not a mere patch, but it relies on a specific theory of truth and reference (naive truth theory). If you reject naive truth, the "rarity" claim loses its structural foundation and looks more like a convenience.

  ---

  ### 4. Concrete Contrast: Paraconsistent Non-Dialetheist vs. Dialetheist

  To cement the distinction, let's look at how two agents handle a database containing the entry: `Status: System_Failure`.

  **Agent A: The Agnostic Paraconsistent (e.g., Belnap's Four-Valued Logic)**
  *   **Stance:** Paraconsistent logic is an error-tolerance tool.
  *   **Input:** The database receives `System_Failure` from Sensor 1 and `¬System_Failure` from Sensor 2.
  *   **Logic:** The system stores both `True` and `False` for `System_Failure` (a "glut" state, or "Both").
  *   **Inference:** The system does *not* crash (no explosion). It infers nothing arbitrary. It flags the inconsistency for human review.
  *   **Ontology:** Agent A does *not* believe `System_Failure` is actually both true and false in reality. They believe the *information state* is contradictory. They are **not** dialetheists. They use paraconsistency to manage ignorance/conflict, not to describe truth.

  **Agent B: The Dialetheist (e.g., Priest's LP)**
  *   **Stance:** Paraconsistent logic describes the actual truth conditions of the world/language.
  *   **Input:** The Liar Sentence $\lambda$.
  *   **Logic:** The system evaluates $\lambda$ as Both (True and False).
  *   **Inference:** The system accepts $\lambda \wedge \neg \lambda$ as a theorem.
  *   **Ontology:** Agent B believes $\lambda$ *is* truly both true and false. The contradiction is in the *world* (or the semantics of the world), not just in their information state.
  *   **Crucial Difference:** If you ask Agent A, "Is the system failing?" they say, "I have conflicting evidence." If you ask Agent B about the Liar, they say, "It is failing and not failing, and that is the truth."

  **Why this matters for you:**
  You can accept **Paraconsistency** (Agent A) without accepting **Dialetheism**. You can say, "Explosion is a bad rule for reasoning under uncertainty," without saying, "True contradictions exist."
  The Dialetheist (Agent B) makes the stronger claim: "Explosion is false *because* reality (or semantics) contains true contradictions."
  **Trivialism** is the claim that *every* sentence is True (and False). Both Agent A and B reject this. Agent A blocks explosion to save utility; Agent B blocks explosion to save truth.

  ### Summary of the Trade-Offs

  1.  **Curry:** You cannot solve this with negation tricks. You must sacrifice Contraction, Modus Ponens, or the Truth Schema. Contraction is the current least-bad sacrifice.
  2.  **Consistency:** Weak negation loses exclusion. You must bolt on a Consistency Operator ($\circ$) to recover classical reasoning for ordinary cases. This adds complexity but saves expressive power.
  3.  **Rarity:** True contradictions are not random; they are structural limit-points (Inclosure). This protects ordinary science but requires a robust theory of semantic closure.
  4.  **Distinction:** Paraconsistency is the engine; Dialetheism is the driver's claim about the road. You can run the engine without making the claim.

  The dialetheist position is stable, but it is expensive. It costs you classical Contraction, it costs you a primitive Consistency operator, and it costs you the intuition that negation excludes. The payoff is a semantically closed language that can talk about its own truth without silence or hierarchy. Whether that payoff is worth the price is the actual philosophical battle.
