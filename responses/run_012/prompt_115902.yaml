answer: |-
  The paradox rests on the divergence between ex-ante and ex-post rationality. Before a crisis, it is rational to threaten massive retaliation to prevent attack. During a crisis, if attacked, it is irrational to carry out the threat because doing so invites mutual destruction. The adversary knows this. Therefore, the threat lacks credibility. To restore credibility, the state must remove its own ability to act rationally ex-post. It must bind itself to the irrational course. This creates the central tension: security is achieved not by maximizing control over the weapon, but by relinquishing it. The booklet must present this relinquishment as a technical improvement in safety. The humor arises from the bureaucratic insistence that removing human agency reduces risk. The Q&A must anticipate the citizen's fear that a machine might err, and counter with the strategic truth that the possibility of error is the very source of the deterrent's strength. If the response is certain, it can be calculated against; if it is probabilistic and automatic, it cannot. The text must never admit that this creates a risk of accidental war, only that it eliminates the risk of deliberate war.

  ***

  **PUBLIC NOTICE: THE NATIONAL RETALIATORY PROTOCOL**
  **Issued by the Directorate of Strategic Reassurance**

  **The Logic of Assured Response**

  Citizens are advised that national security no longer depends on the discretionary choices of political leadership. Historical analysis confirms that manual control systems introduce instability. When an adversary believes a response depends on human deliberation, they may calculate that fear or hesitation will prevent retaliation. To eliminate this calculation, the government has optimized the deterrent posture. Peace is maintained not by the promise of action, but by the impossibility of inaction.

  Effective immediately, the authority to order strategic retaliation has been transferred to the Autonomous Continuity Array. This system operates independently of civilian command once specific thresholds are breached. The government cannot override, delay, or cancel the Array's function. This limitation is not a defect; it is the primary guarantee of your safety. By removing the option to hesitate, we remove the adversary's incentive to strike.

  **The Mechanism of Uncertainty**

  The Array does not operate on a binary switch. It utilizes a stochastic response variable. Upon detection of a hostile launch, the system selects a response magnitude from a pre-authorised range. This selection is randomised and sealed from government view. Consequently, an adversary cannot predict whether a minor incursion will trigger a limited counter-strike or a full strategic exchange.

  This uncertainty is deliberate. A predictable threat can be gambled against; a probabilistic threat cannot. If the adversary knows exactly what we will do, they may decide the cost is acceptable. If they know only that the outcome is left to chance, the risk becomes incalculable. We have secured the nation by ensuring that no rational actor can model the consequences of aggression. The system is designed to be partially opaque to us, so that it remains wholly opaque to them.

  **Questions from the Public**

  *Why has the government given up the power to stop a retaliation?*
  Control implies the possibility of choice. In a crisis, choice creates delay. Delay creates vulnerability. If the adversary believes we can stop the response, they may attempt a surprise attack to disable our command structure. By making the response automatic, we remove the advantage of striking first. There is no benefit to attacking a system that reacts without instruction.

  *Is it safe to rely on a machine for such decisions?*
  Safety is defined by the absence of attack, not the absence of mechanical risk. A system that requires human confirmation is vulnerable to human error, coercion, or decapitation. The Array eliminates these vulnerabilities. While no system is immune to malfunction, the strategic stability provided by automatic continuity outweighs the operational risk. We accept a small probability of accidental activation to ensure a zero probability of successful aggression.

  *Who is accountable if the system acts incorrectly?*
  Accountability presumes a decision was made. The Array does not decide; it processes. To assign blame to a mechanism is to misunderstand its function. The government accepts responsibility for the policy of automation, but not for the specific output of the stochastic variable. This separation ensures that no political pressure can be applied to the system during a crisis.

  *Does this not force us into a conflict we might otherwise avoid?*
  It forces the adversary into a calculation they cannot win. If we retain the ability to avoid conflict, the adversary retains the ability to test our resolve. By binding ourselves to the protocol, we deter ourselves from being tested. A state that cannot be coerced is a state that remains at peace.

  **Final Reassurance**

  The Directorate understands that relinquishing control may seem counterintuitive. However, strategic stability requires that the consequences of aggression be independent of will. You may rest securely knowing that the response to any attack is no longer a matter of debate. The system is active. The parameters are set. The choice has been removed. We are safe because we are no longer free to choose otherwise.
