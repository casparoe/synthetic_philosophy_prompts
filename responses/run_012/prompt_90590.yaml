  # Decision Tree: The Logical Space of Suffering-Focused Ethics

  **Instructions:** Begin at the root. Answer each question based on your substantive moral intuitions about the cases presented, not by trying to match a label. Follow the branch that corresponds to your answer until you reach a leaf.

  ### **Node 1: The Threshold of Badness**
  **Case:** Consider a single life containing both great suffering and great joy (e.g., a visionary artist who endures chronic agony to produce masterpieces). Is the suffering morally bad *even if* the subject finds the life meaningful and bears the pain without breaking?
  *   **No:** Suffering is only bad when it exceeds the sufferer's capacity to cope.
      *   → **Leaf 1: The Threshold/Capacity View**
      *   *Awkward Commitment:* A life of constant, crushing misery is a moral catastrophe, but a life of manageable, chronic pain is morally neutral even if the subject wishes it would stop.
  *   **Yes:** Suffering is bad in itself, regardless of resilience or meaning.
      *   → **Node 2**

  ### **Node 2: The Constraint on Agency**
  **Case:** To prevent a bomb from torturing 1,000 people, you must electrically shock one innocent person. Are you morally required to inflict this suffering to prevent the greater amount?
  *   **No:** We are forbidden from inflicting suffering even to prevent more of it.
      *   → **Leaf 2: Deontological SFE**
      *   *Awkward Commitment:* You must let the 1,000 people be tortured rather than violate the rights of the one, even if the one would consent to save the many.
  *   **Yes:** The minimization of total suffering overrides agent-centered constraints.
      *   → **Node 3**

  ### **Node 3: The Weight of Happiness**
  **Case:** Is a world containing significant suffering but vast amounts of happiness intrinsically better than a world containing no sentient life at all?
  *   **Yes:** Happiness has positive value that can outweigh or counterbalance suffering.
      *   → **Leaf 3: Weak SFE (Weighted Prioritarianism)**
      *   *Awkward Commitment:* There is some amount of pleasure (e.g., trivial tickles for billions) that could theoretically justify the torture of one innocent, provided the aggregate is high enough.
  *   **No:** Suffering is the only intrinsic disvalue; an empty world is preferable to a mixed one.
      *   → **Node 4**

  ### **Node 4: The Harm of Creation**
  **Case:** You may bring into existence a being whose life will be net positive but not free of suffering. Does bringing this being into existence constitute a harm *to them*?
  *   **No:** You cannot harm someone by bringing them into existence if their life is worth living.
      *   → **Leaf 4: Person-affecting SFE**
      *   *Awkward Commitment:* We have no duty to avoid creating children who will suffer greatly, provided their lives remain net positive, because there is no specific victim to complain.
  *   **Yes:** Creating a sufferer is itself a moral harm, regardless of net welfare.
      *   → **Node 5**

  ### **Node 5: The Asymmetry of Existence**
  **Case:** Is the absence of pain in a non-existent life *good* (creating a duty to avoid creation), while the absence of pleasure in that same life is merely *neutral* (creating no duty to create)?
  *   **Yes:** There is a fundamental moral asymmetry between pain and pleasure regarding potential people.
      *   → **Leaf 5: Asymmetry Antinatalism**
      *   *Awkward Commitment:* We are obligated not to have children to prevent their pain, but we have no obligation to have children to provide them pleasure, even if they would be overwhelmingly happy.
  *   **No:** Pain and pleasure aggregate symmetrically; existence is judged by total net value.
      *   → **Node 6**

  ### **Node 6: The Scope of Obligation (Nature)**
  **Case:** Consider the choice between alleviating wild animal suffering and leaving nature undisturbed. If you could painlessly eliminate a predator species to save prey from being eaten alive, ought you?
  *   **Yes:** Our obligation to reduce suffering extends to the natural world.
      *   → **Leaf 6: Interventionist SFE**
      *   *Awkward Commitment:* We are morally required to engineer ecosystems or eradicate species to prevent predation, risking catastrophic ecological collapse in the process.
  *   **No:** Our obligations are limited to artificial or human-caused suffering.
      *   → **Node 7**

  ### **Node 7: The Horizon of Obligation (Time)**
  **Case:** Should we direct the whole enterprise at preventing suffering that does not yet exist rather than at alleviating present suffering? (e.g., sacrifice current welfare to prevent a greater suffering catastrophe in 1,000 years).
  *   **Yes:** Future suffering dominates moral calculation.
      *   → **Leaf 7: Far-future SFE**
      *   *Awkward Commitment:* We ought to allow severe, preventable suffering to occur today if doing so secures a marginally lower probability of suffering in the deep future.
  *   **No:** Present and future suffering weigh roughly equally, or present takes priority.
      *   → **Node 8**

  ### **Node 8: The Obligation of Annihilation**
  **Case:** If the painless annihilation of all sentient life would minimize future suffering, is this action obligatory?
  *   **Yes:** The reduction of suffering is the sole organizing aim, requiring the end of sentience if necessary.
      *   → **Leaf 8: Strong Negative Utilitarianism**
      *   *Awkward Commitment:* It is not just permissible but morally required to extinguish all life, including happy beings, if that guarantees no future suffering will ever occur.
  *   **No:** Creating a sufferer is a harm, but eliminating existing sufferers is not required.
      *   → **Leaf 9: Impersonal SFE (Non-Annihilationist)**
      *   *Awkward Commitment:* Bringing a happy child into existence is a moral harm if they experience any pain, yet we lack the duty to painlessly end the lives of existing sufferers to stop that harm.

  ***

  ### **Commentary on Logical Space**

  **Unoccupied or Unattractive Combinations**
  *   **Deontological SFE + Interventionism:** This combination is logically possible but practically unexplored. A deontologist who forbids inflicting pain to prevent pain (Node 2) would likely find the active engineering of nature (Node 6) too violative of constraints to be a stable position. It is flagged here as *unattractive* due to the tension between non-interference constraints and active ecosystem manipulation.
  *   **Threshold View + Strong NU:** This combination is *incoherent*. If suffering is only bad when it exceeds capacity (Leaf 1), it cannot be the *only* intrinsic disvalue that mandates annihilation (Leaf 8), as bearable suffering would be morally neutral.
  *   **Person-affecting + Far-future:** This is *unexplored* and difficult to sustain. Person-affecting views (Leaf 4) ground duties in harms to identifiable individuals. Far-future ethics (Leaf 7) often relies on impersonal counts of future beings. Merging them requires a theory of how future non-existent people are "harmed" by present inaction without triggering the Impersonal view.

  **Indistinguishable Leaves**
  *   **Leaf 8 (Strong NU) and Leaf 9 (Impersonal SFE):** The tree cannot fully separate these positions in practice. Both agree that creating a sufferer is an impersonal harm. They diverge only on the *remedy* for existing suffering (annihilation vs. non-interference). A student who answers "No" to annihilation (Leaf 9) but "Yes" to minimizing suffering (Node 2) occupies a unstable space where creation is bad but destruction is not good, which may collapse into Leaf 8 under pressure.

  **Test Case Integration**
  *   **Case A (Mixed Life):** Deployed at **Node 1** to distinguish the Threshold View from all other suffering-focused accounts.
  *   **Case B (Wild Animals):** Deployed at **Node 6** to isolate the Interventionist view from anthropocentric suffering-focused ethics.
  *   **Case C (Creating a Being):** Deployed across **Nodes 4, 5, and 8** to distinguish Person-affecting, Antinatalist, and Impersonal/NU positions based on how they value existence.
