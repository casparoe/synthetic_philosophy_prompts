      "As to keeping the colonies, you mistake my inclination for a command. I do not say we must hold them at any cost, but rather that if we are to hold them, the present management is intolerable. To propose they contribute to their own defense is not to validate the monopoly, but to remove the grievance that the metropolis bleeds itself dry for provinces that share neither the burden nor the liberty. If the defense of the empire costs more than the trade is worth, then let us reckon it honestly. My fear is that the friends of the system use the plea of defense to hide the reality of exploitation. I would have the account kept clear: if we keep them for security, let us pay for security and leave the trade free. If the cost is too great, then I have hinted that a voluntary separation might be the only way to preserve friendship and stop the bleeding. The contradiction you see is perhaps the tension of living in a world of states rather than a world of philosophers, but I do not surrender the principle that liberty of trade is the only path to true wealth."

