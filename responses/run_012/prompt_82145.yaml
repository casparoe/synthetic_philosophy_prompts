      *   **Key Distinction:** The difference between a system designed *for* monopoly (mercantilism) vs. a regulation accepted *despite* its cost for a specific non-economic end (defense), while minimizing the economic damage.
      *   **Habit:** He often pauses, considers the interlocutor's point, grants validity where due, but steers back to the systemic principle.

