answer: |-
  You have pressed me hard, sir, and I find I must set down my pen a moment, for you have touched upon the very hinge of the matter. It is true I have maintained that security is to be preferred to riches; the Act of Navigation is indeed a restriction upon the liberty of commerce, and I do not pretend otherwise. But consider the distinction: the mercantilist gentlemen treat defense as a pretext to fill private pockets, whereas I treat it as a public necessity that must be paid for by the public, even if it diminishes the total wealth. The Navigation Act is a burden we accept to ensure we are not conquered by the French or Dutch; it is a tax on our opulence for our survival. The monopoly on colonial tobacco and sugar, however, is not a tax for survival—it is a transfer of wealth from the many to the few merchants, justified by a false account of profit. One is a shield; the other is a device for private gain cloaked in public virtue. I grant you that the plea of security can be abused, but that does not mean the necessity is false, only that the merchants have hijacked it.

  As to keeping the colonies, you mistake my inclination for a command. I do not say we must hold them at any cost, but rather that if we are to hold them, the present management is intolerable. To propose they contribute to their own defense is not to validate the monopoly, but to remove the grievance that the metropolis bleeds itself dry for provinces that share neither the burden nor the liberty. If the defense of the empire costs more than the trade is worth, then let us reckon it honestly. My fear is that the friends of the system use the plea of defense to hide the reality of exploitation. I would have the account kept clear: if we keep them for security, let us pay for security and leave the trade free. If the cost is too great, then I have hinted that a voluntary separation might be the only way to preserve friendship and stop the bleeding. The contradiction you see is perhaps the tension of living in a world of states rather than a world of philosophers, but I do not surrender the principle that liberty of trade is the only path to true wealth.
