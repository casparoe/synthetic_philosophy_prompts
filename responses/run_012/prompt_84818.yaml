answer: |-
  Disagreement tests how you weigh your own mind against another's. This quiz sorts your instincts along three lines: whether you adjust private confidence or public action; what makes someone's opinion count equally to yours; and whether the rules change depending on the topic. There are no right answers, only consistent profiles.

  **1. You and a colleague diagnose a patient. You have the same test results; she has twenty years more experience. She disagrees with your treatment plan.**
  A) Defer to her plan entirely.
  B) Discuss until one convinces the other; otherwise split the difference.
  C) Stick to your plan; experience doesn't change the data you both saw.

  **2. You and a friend solve a logic puzzle. You know she has been awake for thirty hours. She reaches the opposite conclusion.**
  A) Assume she is wrong due to fatigue.
  B) Lower your confidence significantly but check the work again.
  C) Treat her conclusion as a strong signal that you might be mistaken.

  **3. You publish a finding. Nine colleagues read the same paper and reject it; you stand by it.**
  A) Withdraw the finding; you are likely the outlier.
  B) Hold firm unless they point to a specific error in your math.
  C) Suspend judgment until more data arrives.

  **4. Five years ago, you argued the opposite view on this same issue with the same information.**
  A) Trust your current self; you know more now.
  B) Be deeply troubled; your reasoning process seems unstable.
  C) Accept that reasonable people change minds over time.

  **5. You suspect your opponent's view comes from how they were raised, though you cannot prove it.**
  A) Dismiss their view as culturally conditioned.
  B) Ignore the cause; judge only the argument provided.
  C) Lower confidence; hidden causes suggest hidden biases.

  **6. You claim you are equals; they claim they know better. You cannot verify who is right.**
  A) Treat them as an equal to be safe.
  B) Treat yourself as the authority since you must decide.
  C) Refuse to engage until status is settled.

  **7. You agree on all the facts but disagree on what counts as proof.**
  A) Acknowledge no resolution is possible.
  B) Adopt their standard to find common ground.
  C) Insist your standard is the only rational one.

  **8. You know a colleague is systematically optimistic, and you can model the error.**
  A) Correct for their bias and weigh their view.
  B) Discount their view entirely.
  C) Ignore the bias; treat the verdict as is.

  **9. You are the only one out of step with your group and have no way to check the work.**
  A) Conform to the group view.
  B) Privately doubt but publicly agree.
  C) Maintain your view; someone must be right.

  **10. You make a singular prediction that won't be settled for years. A friend disagrees.**
  A) Bet less money on your prediction.
  B) Bet the same amount; you believe what you believe.
  C) Agree to disagree and wait for results.

  **11. After disagreeing with an equal, how do you behave?**
  A) Feel less sure and act more cautiously.
  B) Feel less sure but act on your original plan.
  C) Feel just as sure and act on your original plan.

  **12. Does your response change if the topic is mathematics versus morality?**
  A) Yes; math demands consensus, morals allow variety.
  B) Yes; morals demand consensus, math allows error.
  C) No; rationality works the same everywhere.

  **13. Ultimately, you must use your own brain to evaluate their brain.**
  A) This means you are entitled to trust your own reasoning.
  B) This means you are trapped in your own perspective.
  C) This means you should seek a third-party arbiter.

  **14. Is this puzzle about truth or about maintaining a relationship?**
  A) Purely about getting the truth.
  B) Purely about social harmony.
  C) You cannot separate the two.

  ### Scoring Key

  | Position | Pattern | Hard Commitment | Held? |
  | :--- | :--- | :--- | :--- |
  | **Strict Conciliationism** | Mostly A (esp. 1, 3, 9, 11) | Must lower confidence even if you feel right. | Yes |
  | **Total-Evidence View** | Mostly B (weighing context) | Disagreement is just one more data point. | Yes |
  | **Steadfastness** | Mostly C (esp. 2, 6, 9) | Permitted to stand firm despite equality. | Yes |
  | **Permissivism** | 4=C, 12=A (morals) | Two opposite views can both be rational. | Yes |
  | **Two-Level View** | 11=B (plus mixed others) | Confidence and action can come apart. | Yes |
  | **Domain-Relative** | 12=A or B (split rules) | Rules differ for math vs. morals. | Yes |
  | **No-Shared-Ground** | 7=A | No resolution if standards differ. | Yes |
  | **Self-Trust** | 13=A (plus 6=B) | Entitled to trust self by necessity. | Yes |
  | **Social/Artefact** | 14=C | Puzzle misidentifies social as evidential. | Rare |
  | **Unnamed** | 11=B, 12=C, 13=B | Low confidence, act firm, trapped perspective. | No (Incoherent) |

  *Note on Unnamed:* This combination implies you are trapped in your own mind (13=B) yet feel entitled to act firmly despite low confidence (11=B). This is psychologically unstable: if you believe you are trapped, why act firmly? It is unexplored because it lacks a normative justification for action.

  ### Indistinguishable Leaves
  The quiz cannot separate **Steadfastness** from **Self-Trust**. Both result in standing firm (Option C on most questions). The difference is theoretical: Steadfastness claims you *can* stand firm; Self-Trust claims you *must* because you have no alternative access to truth. Similarly, **Permissivism** and **Domain-Relative** views overlap when the domain is morality; both allow disagreement without adjustment. Distinguishing them requires asking whether the permission arises from the topic (Domain) or the nature of rationality itself (Permissivism), a nuance too fine for multiple-choice options.
