  *(Refining the Verdict)*: The prompt asks which reading PoS can *sustain*. I will argue it sustains Constraint Nativism but fails to necessitate Content Nativism.

  *(Final check on the "Triviality" point)*: The prompt asks if the objection is fatal. I should argue it is not fatal, provided we clarify "innate" means "domain-specific bias" not just "mathematical prior."

