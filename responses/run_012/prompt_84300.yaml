      *   The practice of individual prosecution does *not* logically require a "great-man" theory of history, but it does require a specific normative commitment to individual agency within a structure. It is compatible with structuralism if we view the leader as a necessary *moral* node rather than a necessary *historical* cause.
      *   *Draft Bottom Line:* International criminal law does not presuppose that leaders are the sole historical causes of atrocity, but it does require a normative commitment to individual agency that treats specific actors as morally indispensable nodes within a criminal structure.

  3.  **Develop the Reasoning:**
      *   **Distinction between Historical and Legal Causation:** Legal responsibility isn't the same as historical necessity. The law cares about *actus reus* and *mens rea* within a specific context, not counterfactual history (would someone else have done it?).
      *   **Compatibility with Structuralism:** The requirement for a "widespread or systematic attack" (contextual element) actually embeds structuralism into the crime. It acknowledges the machinery. The individual is prosecuted *because* they wielded that machinery.
      *   **The "Replaceability" Problem:** If Hitler was replaceable, does that absolve him? No. In law, replaceability doesn't negate culpability. If A shoots B, it doesn't matter that C was waiting to shoot B if A didn't. The act is still A's.
      *   **Underdetermination:** The practice is underdetermined regarding historical causation. You can believe Hitler was unique (great-man) or interchangeable (structural) and still prosecute him. The law targets the *exercise* of power, not the *origin* of the conditions.
      *   **What would change?** If we shifted fully to structuralism, we might see more focus on corporate liability, state responsibility, or institutional reform (lustration, reparations) alongside individual trials. But individual trials remain necessary for retributive justice and establishing a historical record, even if the individual was a "cog" (though high-level leaders are rarely mere cogs).
