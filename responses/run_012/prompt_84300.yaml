answer: |-
  International criminal law does not presuppose that leaders are the singular historical causes of atrocity, but rather commits to a normative view of agency wherein individuals remain answerable for wielding structural power, regardless of whether that power was historically inevitable. The legal inquiry into causation is distinct from historical counterfactuals; it does not ask whether the crime would have occurred absent the accused, but whether the accused voluntarily exercised control over the state-organised machinery of destruction. By mandating proof that acts belonged to a 'widespread or systematic attack', the statutes explicitly embed the structural context into the definition of the crime, acknowledging that individual guilt is contingent upon the existence of the very enabling environment inherent in such regimes. Consequently, the practice is underdetermined regarding historical causation, functioning equally well whether one views the leader as a unique progenitor or a replaceable catalyst, provided their personal contribution was substantial. The replaceability of a leader is legally irrelevant because culpability attaches to the actual exercise of power, not the hypothetical actions of a successor. However, adopting a frankly structural view would necessitate complementing individual prosecutions with measures aimed at institutional dissolution, reparations, and corporate liability, ensuring that justice addresses the enabling environment without absolving the specific actors who wielded it. Ultimately, the law treats the leader not as the sole cause of the storm, but as the accountable captain who chose to sail into it.
