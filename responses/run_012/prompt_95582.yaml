answer: |-
  Here is the audit of the analogy between Program Equilibrium (PE)/Superrationality and Kant's Categorical Imperative (CI).

  ### 1. The Correspondence Table

  | Kantian Concept | Program Equilibrium / Superrationality Analog |
  | :--- | :--- |
  | **The Maxim** | The agent's source code / decision algorithm. |
  | **Universalization** | The assumption that the counterparty runs the same (or logically correlated) algorithm. |
  | **The "Willing"** | The commitment to execute the output of the algorithm (binding oneself to the code). |
  | **Contradiction in Conception** | The equilibrium condition (e.g., if universalizing "Defect" leads to lower utility than "Cooperate", the rational choice shifts). |
  | **The Other Agent** | A mirror instance of the self (Hofstadter) or a transparent logical environment (PE). |
  | **Transparency** | Readable source code / common knowledge of rationality. |
  | **The Moral Law** | The equilibrium strategy (the fixed point). |

  ### 2. Window Dressing vs. Load-Bearing Disanalogies

  To determine if the claim ("PE is just formalized CI") holds, we must separate aesthetic differences from structural ones.

  **Window Dressing (Superficial):**
  *   **Formalism:** Kant uses natural language logic; PE uses modal logic and provability. This is just notation.
  *   **Domain:** Kant discusses lying and suicide; PE discusses Prisoner's Dilemmas. This is just application scope.
  *   **"Ought":** Kant uses moral "ought"; PE uses rational "ought." While distinct, both claim normative force over a rational agent.

  **Load-Bearing (Structural):**
  *   **Normative Foundation (Deontology vs. Consequentialism):** This is the critical break. Kant's CI is **deontological**: an action is right if the *form* of the maxim is consistent, regardless of the outcome. You do not lie because lying cannot be universalized without contradiction, even if lying saves a life. Program Equilibrium is **consequentialist**: you adopt the strategy *because* it yields a higher payoff in the universalized context. You cooperate in the PD because (Cooperate, Cooperate) > (Defect, Defect). If universalizing a maxim led to ruin, Kant might still demand it (if it's duty); PE explicitly rejects it.
  *   **The Role of Empirical Facts:** Kant's test is *a priori*. It does not depend on whether others *actually* follow the law, only whether they *could* rationally. PE depends heavily on the empirical (or logical) fact of the opponent's type.
  *   **Identity vs. Correlation:** Kant requires the *same* law for all rational beings. PE allows for different algorithms that are logically correlated (e.g., via Löb's theorem).

  ### 3. Addressing Your Specific Bugs

  **Bug 1: Contingency on the Other Agent**
  > *Kant seems to demand that you will the maxim as universal law regardless of what anyone else actually does, whereas the superrational cooperation story feels contingent on the other guy being the sort of agent who'd also do it.*

  You are correct; this is a real divergence.
  *   **Kant:** If you are in a PD against a DefectBot, Kantian ethics (via the Formula of Universal Law) arguably still forbids you from adopting the maxim "Defect when it benefits me," because that maxim cannot be willed as universal law without contradiction (the institution of promising/cooperating would collapse). Your duty is to the law, not the payoff.
  *   **Superrationality/PE:** If you know the opponent is a DefectBot (or irrational), the superrational move is to Defect. The logic is: "I cooperate *because* my reasoning causes yours to match." If the causal/logical link is broken (the other agent is not superrational), the justification for cooperation vanishes.
  *   **Implication:** PE is a strategy for *success* among similar agents; CI is a constraint on *will* among all agents. PE is conditional on the environment's rationality; CI is not.

  **Bug 2: Löb's Theorem and Symmetry**
  > *The trick where each program cooperates iff it can prove the other one cooperates... seems to get cooperation even between players who aren't running the same program... that looks like it cuts against the Kantian reading hard.*

  This refutes the analogy.
  *   **Kantian Symmetry:** Universalization requires that *everyone* acts on the *same* maxim. If I make an exception for myself, I fail the test.
  *   **Löbian Asymmetry:** In Program Equilibrium (specifically variants like FairBot/PrudentBot), Agent A and Agent B can have *different* source codes. A cooperates if $\vdash (B \text{ cooperates})$. B cooperates if $\vdash (A \text{ cooperates})$. Via Löb's Theorem ($\vdash (\Box P \to P) \to P$), they can cooperate without being identical.
  *   **Implication:** PE relies on **logical correlation**, not **universal identity**. Kant requires the law to be identical for all rational beings. PE allows a ecosystem of distinct algorithms that mutually verify each other's trustworthiness. This is closer to a handshake protocol than a universal moral law.

  ### 4. What the Kantian Side Quietly Imports

  The Kantian analogy smuggles in **moral necessity**. When LessWrongers say "It's just Kant," they often want to import the *inescapable* nature of moral duty into decision theory. They want to say, "You *must* cooperate in the PD."
  *   **Kant:** You must cooperate because it is irrational to will otherwise (moral rationality).
  *   **PE:** You should cooperate because it maximizes utility given logical correlation (instrumental rationality).

  If the utility matrix changes (e.g., the penalty for cooperation becomes infinite), PE says "Defect." Kant might still say "Do not break the promise/cooperate," depending on the maxim formulation. The Kantian analogy tries to ground instrumental rationality in deontological necessity, which doesn't hold under formal scrutiny.

  ### 5. A Better Analogy

  If Program Equilibrium isn't Kant, what is it?

  **Rule Utilitarianism with Logical Causality.**
  *   **Rule Utilitarianism:** "Follow the rule which, if universally adopted, produces the best consequences." This matches PE's structure perfectly (maximize payoff assuming universalization of the algorithm).
  *   **Logical Causality:** Unlike standard Rule Utilitarianism, PE adds that your adoption of the rule *logically influences* the other's adoption (acausal trade).

  Alternatively, in decision-theoretic terms, it is simply **Logical Decision Theory (LDT)**. It is not an ethical system masquerading as math; it is a decision algorithm that treats logical facts as causal levers.

  ### 6. Conclusion

  The claim that "Program Equilibrium is just the Categorical Imperative formalized" relies on conflating *universalizability* (a logical test used by both) with *deontology* (the normative engine of Kant). Both systems ask "What if everyone did that?" but Kant asks it to check for **contradictions of will**, while Program Equilibrium asks it to check for **payoff dominance**. The Löbian ability to cooperate across asymmetric codebases further distances PE from Kant's requirement for a single universal law. The analogy captures the *vibe* of "reasoning from the perspective of the universe," but it misidentifies the *mechanism* (utility vs. duty) and the *constraints* (correlation vs. identity).

  Verdict: The analogy fails because program equilibrium is a consequentialist strategy for utility maximization contingent on logical correlation, whereas the categorical imperative is a deontological constraint on the will independent of empirical outcomes.
