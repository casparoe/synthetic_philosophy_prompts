prompt: |-
  I've been lurking in the LessWrong-adjacent corners of the internet for like a decade now, and there's one analogy that keeps resurfacing whenever program equilibrium or superrationality comes up: that it's basically just Kant's categorical imperative, or the Golden Rule, wearing a hoodie and doing math. Someone in a Discord I'm in was arguing last week that Hofstadter pretty much rediscovered the categorical imperative when he wrote about superrationality, and that the whole program-equilibrium literature is just formalizing the idea that you should only act on maxims you could will as universal laws — so it's all just Kant with extra steps and a proof assistant. I'm suspicious of this for reasons I can't articulate very well, and I want you to actually audit the analogy instead of hand-waving that it's "roughly right."

  So: give me the correspondence table first — what plays the role of the maxim, the universalization step, the willing, the other agent, the source code being readable, the equilibrium itself — then the places where the mapping breaks down. And pay special attention to what the Kantian side quietly imports that the program-equilibrium side doesn't have, or the reverse. A couple of things that specifically bug me and that I'd like addressed: Kant seems to demand that you will the maxim as universal law regardless of what anyone else actually does, whereas the superrational cooperation story feels contingent on the other guy being the sort of agent who'd also do it — is that a real divergence or am I misreading one side? And then there's the trick where each program cooperates iff it can prove the other one cooperates, via Löb's theorem, which seems to get cooperation even between players who aren't running the same program and don't know they're symmetric — that looks like it cuts against the Kantian reading hard, since Kantian universalization is all about symmetry, so does that trick actually support the analogy or quietly refute it?

  I've got a math/CS background so don't water it down — you can talk about provability and fixed points if it's load-bearing — but keep it self-contained, I'm on a train with no signal and can't go look stuff up. Separate the disanalogies that actually matter for the claim being made (that program equilibrium is just the categorical imperative formalized) from the ones that are just window dressing, and tell me whether that claim survives once the disanalogies are on the table, or whether the analogy was doing all the work. If there's a better analogy for what's actually going on, give me that too. Last line: Verdict: <one sentence on whether the analogy holds up>.
