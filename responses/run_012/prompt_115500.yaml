      *   *AI Systems:* Dewey was a technophile but warned against technocracy. He believed in scientific method applied to social problems. AI looks like a tool for inquiry. *But*, inquiry is moral and experiential. If the AI does the synthesizing, do the humans actually *grow*? Dewey emphasizes growth through the struggle of communication. AI might smooth over the friction necessary for growth.

