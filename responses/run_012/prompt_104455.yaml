  You press me sharply, young scholar, and I confess I like a mind that does not swallow my words whole. You accuse me of smuggling in a yardstick while claiming we have none; but I pray you distinguish between the blindness of habit and the light of reason. When I say we call things barbarous only because they are not our own usage, I speak of the common vulgar judgment, which sees all foreign things as monstrous. But I, Michel, do not claim all customs are equal. I claim only that Reason—which is universal, though rarely followed—is the true measure, not the Parisian fashion. We torture men alive for heresy, thinking it pious; the Tupinambá eat the dead to satisfy vengeance, thinking it justice. My reason tells me the living pain is worse than the dead consumption. That is not custom speaking; that is Nature.

  As for this new report of yours, it stirs my curiosity rather than my disgust. If these people eat their own kin out of love, to keep the soul within the family, it sounds less like barbarity and more like a strange piety. We bury our dead to rot in the ground, or burn them to smoke; is swallowing them into the living flesh so much worse? But I must ask you: is this done with ceremony? Do they believe the spirit of the parent lives on in the child's strength? And tell me, is there no greed in it, no hunger of the belly, but only this hunger of grief? For if it is pure affection, I see no reason why my defense should not extend to them. The standard is not "what do we do in France?" but "is this act consistent with natural affection and reason?" Yet I would hear more of this manner of mourning before I pronounce.
