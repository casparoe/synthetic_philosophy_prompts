prompt: |-
  I teach one ninety-minute session in a graduate decision theory course, and next week's topic is the common prior assumption. My students have had a term of measure-theoretic probability and are fluent with conditioning, but none of them has seen epistemic game theory; the group is mixed, roughly half economics and half machine learning, and I can rely on one of the latter asking, early, whether the assumption implies that two models trained on the same corpus must converge once they compare predictions.

  I do not want the assumption explained to me; I want a plan for teaching it. Set out the order in which the components must be introduced and why the dependencies run as they do: what has to be in place before the assumption can even be stated, what has to be in place before the agreement result is more than a curiosity, and where the pivot occurs from "a modelling assumption one may adopt or decline" to "a constraint on rational disagreement." Then tell me what should carry the session: the single example or case I build it on (it has to fit on a whiteboard in two minutes), what that example must have and what it must lack for the hypothesis of the result to feel like a genuine restriction rather than a technicality, and whether the LLM case my machine-learning students will raise can serve as that example or whether it is a trap that will teach the wrong lesson — and if it is a trap, what I should say about it and at what point.

  Then the misconceptions, in the order they will surface, with the precise point in the sequence at which each should be headed off. I am expecting "the theorem says rational agents cannot disagree," "a common prior means the agents share the same information," and "common knowledge is just everyone knowing." What else will they form? And I especially want to know which of these is load-bearing — the one that, if left standing, makes everything after it sound like words.

  Close with a question I can put to them in the final ten minutes that would separate students who have understood the assumption from students who have merely memorized a statement of the theorem, and with the material I should explicitly refuse to cover at this level, saying so out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Context:** One 90-minute graduate session in decision theory.
      *   **Topic:** Common Prior Assumption (CPA).
      *   **Audience:** Mixed Economics/ML grad students. Fluent in measure-theoretic probability (conditioning, etc.), but *no* prior epistemic game theory.
      *   **Specific Constraint:** Do not explain the assumption to *me* (the AI). Provide a *teaching plan*.
      *   **Key Requirements:**
          *   Order of components & dependencies (logic flow).
          *   Pivot point (assumption vs. constraint on rationality).
          *   The Core Example (whiteboard-friendly, 2 mins, specific properties).
          *   The ML/LLM Question (trap or tool? when to address?).
          *   Misconceptions (order of surfacing, when to head off, load-bearing one).
          *   Final Assessment Question (understanding vs. memorization).
          *   Exclusions (what *not* to cover).

  2.  **Deconstruct the Topic (Common Prior Assumption & Aumann's Agreement Theorem):**
      *   *Prerequisites:* State space, partitions (information structures), priors, posteriors, common knowledge.
      *   *The Assumption:* Agents start with the same prior probability measure over the state space.
      *   *The Result:* Aumann's Agreement Theorem (cannot agree to disagree).
      *   *The Implication:* If priors are common and posteriors are common knowledge, they must be equal.
      *   *The Tension:* Is CPA a reasonable modeling simplification or a strong rationality constraint? (Harsanyi doctrine).

  3.  **Drafting the Sequence (Dependencies):**
      *   You can't state CPA without defining what a "prior" is in an interactive setting.
      *   You can't define priors without a State Space ($\Omega$).
      *   You can't talk about "agreement" without defining "information" (partitions/$\sigma$-algebras).
      *   You can't get the *force* of the theorem without "Common Knowledge" (it's not just "I know you know").
      *   *Pivot:* The move from "let's assume this for math convenience" to "if you don't assume this, you allow irrational disagreement."

  4.  **Selecting the Core Example:**
      *   Needs to be simple enough for a whiteboard in 2 mins.
      *   Needs to show *different* information leading to *different* posteriors from a *common* prior.
      *   Needs to show where "Common Knowledge" fails vs. succeeds.
      *   *Idea:* Two detectives, one crime, two suspects. Or a simple coin flip with partial observation.
      *   *Better Idea:* The "Two Envelopes" or "Coordinated Attack" is too complex. Let's go with a simple State Space $\Omega = \{1, 2, 3, 4\}$.
      *   *Why?* It allows explicit partitions.
      *   *Scenario:* A card is drawn (1-4). Alice sees if it's low (1,2) or high (3,4). Bob sees if it's even (2,4) or odd (1,3).
      *   *Prior:* Uniform (1/4 each).
      *   *Event:* Is the card $\le 3$?
      *   *Check:* If card is 2. Alice sees {1,2}. Bob sees {2,4}.
      *   *Wait, Aumann's theorem requires Common Knowledge of Posteriors.* The example needs to demonstrate the *failure* of agreement when CK is missing, and the *necessity* of CPA for the theorem.
      *   *Refined Example:* The "Dirty Faces" or a simplified "Meeting Place".
      *   *Best Fit:* A simple $\Omega = \{a, b, c\}$.
          *   Prior: Uniform.
          *   Alice's partition: $\{\{a, b\}, \{c\}\}$.
          *   Bob's partition: $\{\{a\}, \{b, c\}\}$.
          *   Event $E = \{a, b\}$.
          *   Show posteriors differ. Show they don't *know* each other's posteriors.
          *   Then show a meet of partitions where they *do* know, and posteriors *must* match if CPA holds.
      *   *Actually, keep it even tighter:* The "Binary Signal" example.
      *   $\Omega = \{00, 01, 10, 11\}$. Alice sees first bit. Bob sees second bit. Common prior uniform.
      *   Event: "Bits match".
      *   This is standard, clear, and fits on a board.

  5.  **Addressing the ML/LLM Question:**
      *   *Question:* "Does CPA imply two models trained on the same corpus converge?"
      *   *Verdict:* It's a trap.
      *   *Why?* Training on the same corpus $\neq$ Common Prior. It implies common *data* (likelihoods), but priors are architectural/initialization/regularization induced. Also, "comparing predictions" isn't "Common Knowledge of Posteriors."
      *   *Timing:* Address early (when they ask) but park it. Revisit at the end to show why it fails the specific conditions of the theorem. Don't let it derail the formal setup.

  6.  **Mapping Misconceptions:**
      1.  "Common Prior = Same Information." (Surfaces immediately).
      2.  "Common Knowledge = Everyone Knows." (Surfaces at the theorem statement).
      3.  "Theorem = Rational agents cannot disagree." (Surfaces at interpretation).
      4.  *Load Bearing:* "Common Knowledge = Everyone Knows." If they think CK is just level-1 knowledge, the theorem looks false (because I can know your bet and still bet against you if I don't know that you know that I know...). Actually, the load-bearing one is **"Common Prior means Same Information."** If they think CPA eliminates information asymmetry, the theorem is trivial. The theorem is powerful *because* information differs.
      *   *Correction:* The prompt asks for the "load-bearing" misconception. I think "Common Knowledge is just everyone knowing" is the mathematical killer. But "CPA = Same Info" is the conceptual killer. Let's weigh them. If they think CPA = Same Info, they miss the point of partitions. If they think CK = Everyone Knows, the math doesn't work. The prompt asks for the one that makes everything sound like "words." That's usually the CK definition. But the "Rational agents cannot disagree" is the over-generalization.
      *   *Decision:* The load-bearing one is **"Common Prior means the agents share the same information."** If this stands, the theorem is trivial (obviously if we know the same things we believe the same things). The *magic* is that we know *different* things but still can't disagree on *probabilities* if those probabilities are CK.

  7.  **Final Assessment Question:**
      *   Needs to test the *assumption*, not the *theorem*.
      *   Scenario: Agents disagree. Why?
      *   Options: Different priors? Not CK? Irrational?
      *   Better: A scenario where they have the same prior, different info, and disagree. Is this a violation of Aumann? (No, because posteriors aren't CK).
      *   Best: "Construct a scenario where agents have a Common Prior, different information, and different posteriors, and explain why this does not contradict Aumann's Agreement Theorem." (Tests the CK condition).

  8.  **Exclusions:**
      *   Don't do the full measure-theoretic proof (they know prob, but 90 mins is tight).
      *   Don't do Harsanyi Type Spaces in full generality (too much overhead).
      *   Don't solve the "Is CPA true?" philosophical debate (just frame it).

  9.  **Structuring the Plan:**
      *   **Phase 1: Setup (0-25 mins).** State space, Partitions, Priors. Address ML question here (park it).
      *   **Phase 2: The Assumption & The Result (25-50 mins).** Define CPA. Define Common Knowledge (Meet of partitions). State Theorem.
      *   **Phase 3: The Pivot (50-65 mins).** From modeling choice to rationality constraint. Harsanyi Doctrine.
      *   **Phase 4: Misconceptions & Deep Dive (65-80 mins).** Tackle the specific errors.
      *   **Phase 5: Assessment & Close (80-90 mins).** The question and the exclusions.

  10. **Refining the Example:**
      *   Needs to show: Common Prior + Different Info $\rightarrow$ Different Posteriors (Allowed).
      *   Then: Common Prior + Different Info + CK of Posteriors $\rightarrow$ Same Posteriors (Forced).
      *   *Whiteboard Example:* $\Omega = \{1, 2, 3\}$. Prior $(1/3, 1/3, 1/3)$.
      *   Alice: $\{\{1, 2\}, \{3\}\}$. Bob: $\{\{1\}, \{2, 3\}\}$.
      *   Event $E = \{1, 2\}$.
      *   If state is 1: Alice sees $\{1, 2\}$ (Prob 1/2). Bob sees $\{1\}$ (Prob 1).
      *   Disagreement exists. Is it CK? No.
      *   This shows CPA doesn't force immediate agreement. It only forces agreement when the *disagreement itself* is common knowledge.

  11. **Refining the ML/LLM Trap:**
      *   It's a trap because "same corpus" is common *evidence*, not common *prior*. In Bayesian terms, the corpus is the realization of a random variable. The prior is the distribution over parameters *before* seeing the corpus.
      *   Also, "comparing predictions" is not Common Knowledge. It's a one-off exchange.
      *   *Instruction:* Acknowledge the intuition (convergence is expected), but distinguish Prior vs. Likelihood and Exchange vs. Common Knowledge.

  12. **Review against Constraints:**
      *   Order of components? Yes.
      *   Pivot point? Yes.
      *   Whiteboard example? Yes.
      *   ML trap? Yes.
      *   Misconceptions (order + load bearing)? Yes.
      *   Final question? Yes.
      *   Exclusions? Yes.

  13. **Final Polish:** Ensure tone is authoritative and pedagogical. (Self-Correction: Make sure to emphasize *why* the dependencies run as they do. E.g., Can't define CPA without Partitions.)

  *(Self-Correction during drafting)*: Wait, the prompt asks for "what that example must have and what it must lack." I need to be specific.
  *   Must have: Asymmetric information (partitions).
  *   Must have: A common probability measure.
  *   Must lack: Common Knowledge of the posteriors (in the first stage).
  *   Why? To show CPA $\neq$ Immediate Agreement.

  *(Self-Correction on Misconceptions)*: The prompt lists three expected ones. I need to add "What else will they form?"
  *   Additional: "CPA implies agents know they have the same prior." (Actually, that's part of the definition, but often confused with knowing the *realization*).
  *   Additional: "The theorem applies to actions/decisions." (It applies to probabilities/beliefs. Actions depend on utility).
  *   Load-bearing: I will stick with "Common Prior = Same Information." If they believe this, the rest is tautological.

  *(Self-Correction on ML Question)*: The prompt says "rely on one of the latter asking, early." I need to plan *exactly* where to slot this. It should be in Phase 1, when defining "Prior."

  Let's assemble the plan.cw
answer: |-
  Here is a teaching plan designed for a 90-minute graduate session. It prioritizes logical dependencies, conceptual pivots, and the specific demographic of your students.

  ### I. The Sequence of Components (0–50 Minutes)

  You cannot state the Common Prior Assumption (CPA) without first defining the object over which the prior is distributed. You cannot derive the Agreement Theorem without defining the mechanism by which information restricts that prior.

  **1. The State Space and Partitions (0–20 mins)**
  *   **Concept:** Define $\Omega$ (states of the world). Define information not as "data" but as **partitions** (or $\sigma$-algebras). Agent $i$ knows the true state $\omega$ is in cell $P_i(\omega)$.
  *   **Dependency:** You must establish that agents can be uncertain about $\omega$ *and* uncertain about what the other agent knows.
  *   **Why here:** Without partitions, "information" is vague. Without a formal information structure, you cannot define "Common Knowledge."
  *   **The ML Intervention (Minute 15):** When you define "Prior," the ML student will ask: *"If two models train on the same corpus, isn't that a common prior? Do they have to converge?"*
      *   **Action:** Park this immediately. Write "LLM Convergence?" on the side of the board.
      *   **Script:** "That is the exact right intuition to test at the end. For now, note the distinction: The corpus is *evidence* (likelihood), not the *prior*. And 'comparing predictions' is not the same as the specific epistemic condition we are about to define. We will return to this at minute 80."
      *   **Reason:** If you answer it fully now, you conflate Bayesian updating with the CPA. If you ignore it, you lose the ML half of the room. Parking it validates their intuition without breaking the logical flow.

  **2. The Common Prior Assumption (20–30 mins)**
  *   **Concept:** There exists a single probability measure $P$ on $\Omega$ such that every agent's subjective probability is derived from $P$ by conditioning on their partition cell.
  *   **Dependency:** Requires the State Space and Partitions to be defined first.
  *   **Why here:** This is the definition. It must precede the theorem.
  *   **Pivot Point 1:** Frame this initially as a **modeling convenience** (Harsanyi's justification: simplifies analysis of incomplete information games).

  **3. Common Knowledge (30–40 mins)**
  *   **Concept:** An event $E$ is common knowledge at $\omega$ if the meet of the partitions containing $\omega$ is a subset of $E$.
  *   **Dependency:** Requires Partitions.
  *   **Why here:** This is the engine of the theorem. Without the "meet" of partitions, you only have mutual knowledge (I know, you know), which is insufficient for agreement.
  *   **Pivot Point 2:** This is where you shift from "modeling convenience" to **"rationality constraint."** If agents are rational (Bayesian updaters) and share a prior, the structure of knowledge *forces* agreement on probabilities that are common knowledge.

  **4. Aumann's Agreement Theorem (40–50 mins)**
  *   **Statement:** If agents share a common prior, and their posterior probabilities for an event $E$ are common knowledge, then those posteriors are identical.
  *   **Dependency:** Requires CPA and Common Knowledge.
  *   **Why here:** Now the components are in place to state the result.

  ---

  ### II. The Core Example (Whiteboard, 2 Minutes)

  Do not use a story about detectives or coins. Use a minimal state space that allows you to draw partitions.

  **The Setup:**
  *   $\Omega = \{1, 2, 3\}$.
  *   Common Prior $P$: Uniform $(1/3, 1/3, 1/3)$.
  *   **Alice's Partition:** $\{\{1, 2\}, \{3\}\}$.
  *   **Bob's Partition:** $\{\{1\}, \{2, 3\}\}$.
  *   **Event $E$:** "The state is 1 or 2" ($E = \{1, 2\}$).

  **The Execution:**
  1.  **Assume true state is 1.**
  2.  **Alice's Posterior:** She sees $\{1, 2\}$. $P(E | \{1, 2\}) = 1/2 + 1/2 = 1$. (Wait, if $E=\{1,2\}$ and she sees $\{1,2\}$, prob is 1. Let's change Event $E$ to "State is 1").
      *   *Correction for Board:* Let Event $E = \{1\}$.
      *   **Alice (sees $\{1, 2\}$):** $P(E) = 1/2$.
      *   **Bob (sees $\{1\}$):** $P(E) = 1$.
  3.  **The Disagreement:** They disagree ($1/2$ vs $1$).
  4.  **The Check:** Is this disagreement *Common Knowledge*?
      *   Alice knows Bob sees either $\{1\}$ or $\{2, 3\}$. She doesn't know which.
      *   Bob knows Alice sees $\{1, 2\}$.
      *   The "Meet" of the partitions at state 1 is $\{1\}$. (Bob's cell is $\{1\}$, which is contained in Alice's $\{1, 2\}$).
      *   *Wait, this example is too tight.* If the meet is $\{1\}$, then everything at state 1 is CK.
      *   *Better Example for the Board:* $\Omega = \{1, 2, 3, 4\}$.
      *   Alice: $\{\{1, 2\}, \{3, 4\}\}$.
      *   Bob: $\{\{1, 3\}, \{2, 4\}\}$.
      *   Prior: Uniform.
      *   Event $E = \{1, 2, 3\}$.
      *   **State is 1:**
          *   Alice sees $\{1, 2\}$. $P(E) = 1$.
          *   Bob sees $\{1, 3\}$. $P(E) = 1$.
          *   (They agree).
      *   **State is 2:**
          *   Alice sees $\{1, 2\}$. $P(E) = 1$.
          *   Bob sees $\{2, 4\}$. $P(E) = 1/2$.
          *   **They Disagree.**
      *   **Is the Disagreement CK?**
          *   Alice knows Bob has $\{1, 3\}$ or $\{2, 4\}$. She doesn't know which.
          *   Bob knows Alice has $\{1, 2\}$ or $\{3, 4\}$.
          *   The Meet at state 2 is $\Omega$ (the whole space). They don't even know they are in state 2. They don't know each other's posteriors.
      *   **Conclusion:** CPA holds. Disagreement exists. **Theorem is not violated** because the posteriors are not Common Knowledge.

  **What this example must HAVE:**
  *   Asymmetric partitions (information is different).
  *   A calculation showing different posteriors derived from the *same* prior.
  *   A demonstration that the agents do not know each other's partition cell.

  **What this example must LACK:**
  *   Common Knowledge of the posteriors.
  *   **Why:** If you start with an example where they agree, students think CPA forces immediate agreement. If you start with an example where the posteriors are CK, the math gets too heavy for 2 minutes. You need an example where **Disagreement is possible under CPA** to prove that the "Common Knowledge" condition in the theorem is doing the work, not just the Prior.

  **The LLM Case: Trap or Tool?**
  *   **Verdict:** It is a **Trap**.
  *   **Why:** It teaches the wrong lesson about *what* is common. In ML, "same corpus" means common *likelihood* (data), not common *prior* (initialization/architecture bias). Furthermore, "comparing predictions" is a single communication round, not the infinite recursion of Common Knowledge.
  *   **When to address:** Minute 80 (see below).
  *   **What to say:** "Your intuition is about *consistency of learning*, which is a law of large numbers result. Aumann's theorem is about *epistemic consistency* at a single point in time. Two LLMs can have the same data (likelihood) but different architectures (priors). Even with identical architectures, unless they have Common Knowledge of each other's weights, they can disagree."

  ---

  ### III. Misconceptions (Order & Intervention)

  **1. "Common Prior means the agents share the same information."**
  *   **Surfaces:** Minute 25 (when defining CPA).
  *   **Intervention:** Point to the Partitions on the board. "They have the same *map* (prior), but they are standing in different *rooms* (partitions)."
  *   **Load-Bearing Status:** **HIGH.** If this stands, the Agreement Theorem becomes a tautology ("If they know the same things, they believe the same things"). The theorem is profound precisely because information *differs*.

  **2. "Common Knowledge is just everyone knowing."**
  *   **Surfaces:** Minute 35 (when defining CK).
  *   **Intervention:** Use the "Generals" analogy briefly. "I know you know" is not enough. "I know that you know that I know..." must go to infinity. Mathematically, point to the **Meet of the Partitions**. If the meet is coarse, CK is rare.
  *   **Load-Bearing Status:** Medium. If they miss this, they think the theorem applies to everyday disagreements.

  **3. "The theorem says rational agents cannot disagree."**
  *   **Surfaces:** Minute 50 (after stating the theorem).
  *   **Intervention:** Refer back to the Board Example (Minute 40). "We just saw them disagree. Why? Because the posteriors were not Common Knowledge."
  *   **Load-Bearing Status:** Low. This is usually corrected by the example.

  **4. "The theorem applies to actions/decisions." (The Hidden Trap)**
  *   **Surfaces:** Minute 60 (during discussion of implications).
  *   **Intervention:** "The theorem constrains *probabilities* (beliefs), not *actions*." Two agents can agree on the probability of rain but disagree on whether to carry an umbrella (different utility functions).
  *   **Load-Bearing Status:** **Critical.** If they believe the theorem forces agreement on *bets* or *actions*, they will reject the theory immediately based on real-world observation of traders with different risk profiles.

  ---

  ### IV. The Pivot: From Assumption to Constraint (Minute 65)

  This is the philosophical core of the session.

  *   **Phase 1 (Modeling):** "We assume CPA because it makes the math tractable. It's a 'as if' assumption."
  *   **Phase 2 (Rationality):** "However, if you reject CPA, you are asserting that two agents can look at the same universe, have the same logic, process all available information about each other's beliefs, and *still* permanently disagree on probabilities."
  *   **The Hook:** "Is 'different priors' a fundamental feature of human rationality, or is it just a description of our ignorance about how the other person processed their childhood data?"
  *   **Goal:** Move them from viewing CPA as a technical simplification to viewing it as the **Harsanyi Doctrine**: *Differences in belief must be explained by differences in information, not differences in reasoning machinery.*

  ---

  ### V. Final Assessment & Exclusions (Minute 80–90)

  **The LLM Revisit (Minute 80):**
  Return to the parked question.
  *   **Ask:** "So, do two LLMs trained on the same corpus converge?"
  *   **Expected Answer:** "Only if they have the same architecture (Prior) AND they have Common Knowledge of each other's parameters."
  *   **Your Closure:** "In practice, they converge because the data swamps the prior (likelihood dominates). Aumann's theorem holds even when data is scarce. The theorem is about the *structure of belief*, not the *volume of data*."

  **The Final Question (Minute 85):**
  Put this on the board. Do not ask for a proof. Ask for a diagnosis.

  > *"Alice and Bob are rational Bayesians. They have a Common Prior. They speak to each other and announce their probabilities for Event E. Alice says 0.7. Bob says 0.3. They hear each other. They do not change their minds.*
  >
  > *Which of the following must be true? (Select all that apply)*
  > *A) They are irrational.*
  > *B) They do not have a Common Prior.*
  > *C) Their posteriors are not Common Knowledge.*
  > *D) They have different Utility functions."*

  *   **Correct Answer:** **C**. (B is possible, but C is the *necessary* condition that allows the disagreement to persist without violating the theorem. A is false because they might lack CK. D is irrelevant to beliefs).
  *   **Discriminator:** Students who memorized the theorem will pick **B** ("They must not have a common prior!"). Students who understood the *assumptions* will pick **C** ("The conditions for the theorem weren't met").

  **Explicit Exclusions (Say this out loud):**
  1.  **"I am not proving the Theorem."** (You know measure theory, but the proof involves properties of the meet of partitions that will eat 40 minutes. We are focusing on the *assumption*.)
  2.  **"I am not solving the 'Is CPA True?' debate."** (Philosophers have fought this for 40 years. We are analyzing the *consequences* of adopting it.)
  3.  **"I am not discussing 'Agreeing to Disagree' in the colloquial sense."** (We are talking about probabilities, not political opinions.)

  **Closing Line:**
  "The Common Prior Assumption is not a claim that we are all the same. It is a claim that our differences must be traceable to what we have seen, not to who we are. Next week, we relax this assumption and see what breaks."
