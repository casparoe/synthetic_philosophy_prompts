  # Seminar Activity: The Truth-Value Game

  ## Overview
  **Time:** 90 Minutes
  **Participants:** 12 Students (divided into 4 groups of 3)
  **Materials:** Whiteboard, markers, 48 Index Cards (12 sentence cards, 36 color tokens/cards), Bell or Timer.
  **Goal:** To embody the semantic behavior of self-referential networks without invoking theoretical terminology until the debrief.

  ---

  ## I. Materials & Setup

  ### 1. The Tokens
  Each student receives two large index cards: one marked with a **Green Circle** (True) and one with a **Red Circle** (False). At any time, a student must hold exactly one card up, facing the group.

  ### 2. The Sentence Cards
  Prepare four distinct sets of three sentence cards (Sets Alpha, Beta, Gamma, Delta). Each card contains a instruction referring to the *current state* of another student in their trio.

  **Set Alpha (The Grounded Control)**
  *   **Card A1:** "Student A2 is holding Green."
  *   **Card A2:** "Student A3 is holding Green."
  *   **Card A3:** **ANCHOR.** (Special Rule: You must always hold Green. You never change.)

  **Set Beta (The Classical Impasse)**
  *   **Card B1:** "Student B2 is holding Red."
  *   **Card B2:** "Student B3 is holding Red."
  *   **Card B3:** "Student B1 is holding Red."

  **Set Gamma (The Floating Consistent)**
  *   **Card C1:** "Student C2 is holding Green."
  *   **Card C2:** "Student C3 is holding Green."
  *   **Card C3:** "Student C1 is holding Green."

  **Set Delta (The Oscillator)**
  *   **Card D1:** "Student D2 is holding Red."
  *   **Card D2:** "Student D1 is holding Red."
  *   *(Note: This is a pair. The third student, D3, acts as an Observer/Recorder for this group and does not hold a sentence card, or you can run this as a group of 2 and move the extra student to observe another group. For symmetry, let's make D3 an Observer.)*
  *   *Correction for 12 students:* To keep 4 groups of 3, make Delta a 3-cycle that oscillates under specific rules.
  *   **Revised Set Delta (The Oscillator):**
      *   **Card D1:** "Student D2 is holding Red."
      *   **Card D2:** "Student D3 is holding Red."
      *   **Card D3:** "Student D1 is holding Green."
      *   *(Logic Check: If D1=G, D2=R, D3=R. D1 says D2 is R (True). D2 says D3 is R (True). D3 says D1 is G (True). This is actually consistent!)*
      *   *I need a structure that oscillates under synchronous revision.* The Liar Pair (2-cycle) is the robust oscillator. I will assign 2 students to Delta and the 3rd student will be the "Timekeeper" for the whole room.
      *   *Better for symmetry:* Let's use the **Liar Triple** for Delta as well, but the *instruction* makes it oscillate. The prompt asks for distinct networks. I will use the **Liar Pair** for Delta and assign the 3rd student in that group to be the **Scribe** who records the history on the whiteboard. This utilizes all 12 students (3 groups of 3 players, 1 group of 2 players + 1 scribe).
      *   **Revised Set Delta:**
          *   **Card D1:** "Student D2 is holding Red."
          *   **Card D2:** "Student D1 is holding Red."
          *   **Card D3:** **SCRIBE.** (You record the room's state on the board).

  ### 3. Room Layout
  Arrange four tables or clusters of chairs in the four corners of the room. Groups should not be able to easily see each other's card colors without standing up.

  ---

  ## II. Procedure

  ### Phase 1: Introduction (10 Minutes)
  1.  **Distribute:** Hand out the tokens and sentence cards. Assign groups randomly.
  2.  **The Rule of Truth:** Write on the whiteboard:
      *   **RULE:** Your card is **Green** if what your sentence says matches reality.
      *   **RULE:** Your card is **Red** if what your sentence says does not match reality.
      *   **EXAMPLE:** If your card says "Student X is Green," and Student X is holding Green, you must hold Green. If Student X is holding Red, you must hold Red.
  3.  **Secrecy:** Students must not show their sentence text to others, only their color token. They may talk, but the only public data is the color held up.

  ### Phase 2: The Static Search (25 Minutes)
  **Instruction to Groups Alpha, Beta, Gamma:**
  "Your goal is to find a **Stable State**. A Stable State is when every student in your group is holding the color that matches their sentence rule. Once you think you have found it, raise your hands. Do not change your colors once you claim stability."

  **Instruction to Group Delta (D1, D2):**
  "Your goal is different. You will not search for stability. You will play the **Update Game**. I will ring the bell every 60 seconds. When the bell rings, you must *simultaneously* change your color to match your sentence rule based on what the other person is holding *right before* the bell. Do not try to settle. Just update."

  **Instruction to Student D3 (Scribe):**
  "Watch Groups Beta and Delta. On the whiteboard, draw two columns. Every time a group changes their colors, record the pattern (e.g., G-R-G). Note if they stop or repeat."

  **Instructor Role:**
  *   Circulate. Do not give answers.
  *   If Group Alpha struggles, remind them A3 is the Anchor (Always Green).
  *   If Group Beta argues, let them argue. They will not find a state.
  *   If Group Gamma finds a state (All Green), ask: "Is there another one?" (They should find All Red).
  *   Ring the bell for Group Delta every 60 seconds. Ensure they update *simultaneously*.

  ### Phase 3: The Dynamic Shift (25 Minutes)
  **Stop Phase 2.** Ask Group Beta to stop searching for stability.
  **New Instruction to All Groups (including Alpha, Beta, Gamma):**
  "We are now playing the **Update Game**. Everyone ignores your previous goal. I will ring the bell every 45 seconds. When the bell rings, everyone in the room must check their sentence against the *current* colors of their partners. If your color does not match your rule, flip it. If it does match, keep it. You must all flip at the exact same time."

  **Run 4 Rounds of the Bell.**
  *   **Round 1:** Chaos.
  *   **Round 2:** Alpha settles. Gamma settles (likely). Beta and Delta oscillate.
  *   **Round 3 & 4:** Confirm the patterns.
  *   **Scribe (D3):** Records the sequence for Beta and Delta on the board.

  ### Phase 4: Data Collection (5 Minutes)
  Ask each group to report:
  1.  **Alpha:** Did you settle? How fast?
  2.  **Beta:** Did you ever find a Stable State in Phase 2? What happened in Phase 3?
  3.  **Gamma:** How many Stable States did you find in Phase 2? Did you stay there in Phase 3?
  4.  **Delta:** What pattern did you make in Phase 3?

  ---

  ## III. Debrief & Theoretical Mapping (25 Minutes)

  *This is where you introduce the forbidden vocabulary.*

  **1. The Classical Impasse (Group Beta)**
  *   **Observation:** They could not find a Stable State. In Phase 3, they likely oscillated or remained in conflict.
  *   **Theory:** This is the **Liar Paradox** (or Cycle).
  *   **The Pressure:** Classical logic demands every sentence be True or False (Bivalence) and that 'True' means 'what is the case' (Disquotation). Group Beta proved these two demands clash.
  *   **The Cost:** To solve this, you must give up something.
      *   Give up Bivalence? (Kripke: Truth value gaps).
      *   Give up Classical Logic? (Paraconsistency: True contradictions).
      *   Give up Disquotation? (Tarski: Hierarchy of languages).

  **2. The Ungrounded Consistency (Group Gamma)**
  *   **Observation:** They found a Stable State (All Green). But they likely also could have been All Red. Nothing in the sentences forced one over the other.
  *   **Theory:** These are **Truth-Tellers** (Ungrounded sentences).
  *   **The Pressure:** They are consistent, but their truth value is not determined by the world or the logic. It floats.
  *   **The Cost:** If you say they are "True," why not "False"?
      *   Supervaluationism: They are neither; only what is true in *all* assignments counts.
      *   Revision Theory: Their stability depends on where you start.

  **3. The Oscillator (Group Delta)**
  *   **Observation:** In Phase 2 (Update Game), they flipped every time. G-R $\to$ R-G $\to$ G-R.
  *   **Theory:** This is the **Revision Sequence** (Gupta/Belnap).
  *   **The Pressure:** If we treat truth as a process of correcting our beliefs, some sentences never stabilize. They are "pathological."
  *   **The Cost:** Truth is not a static property for these sentences; it is a transfinite process. We lose the idea that a sentence simply *is* true.

  **4. The Grounded Control (Group Alpha)**
  *   **Observation:** They settled immediately and stayed settled.
  *   **Theory:** **Groundedness** (Kripke).
  *   **The Payoff:** This shows that most of our language works fine. The problems only arise when reference loops back on itself without an anchor (like A3).

  ---

  ## IV. Troubleshooting & Limitations

  ### Predictable Failures & Recovery
  1.  **Asynchronous Updating (Group Delta/Beta in Phase 3):**
      *   *Problem:* Students watch their partner change and immediately change themselves before the bell, breaking the "rounds."
      *   *Recovery:* Stop the clock. Remind them: "Logic is simultaneous. You are computers, not conversationalists. Wait for the bell."
  2.  **The "Cheating" Anchor (Group Alpha):**
      *   *Problem:* Student A3 gets bored and flips to Red.
      *   *Recovery:* The Scribe will catch this. Use it as a teaching moment: "If the foundation moves, the whole building collapses. Grounding requires fixed points."
  3.  **Group Gamma Settling on Mixed Values:**
      *   *Problem:* They might try G-G-R.
      *   *Recovery:* Ask them to check C2. If C2 is G, C3 must be G. Walk them through the chain. They will realize only All-G or All-R works.
  4.  **Time Management:**
      *   *Problem:* Debrief runs long.
      *   *Recovery:* Cut the discussion on Paraconsistency if needed. Focus on the tension between Bivalence and Disquotation (The Liar).

  ### Candid Limitations (Instructor Notes)
  *   **The Overlap of (i) and (iii):** You will notice Group Beta (Impasse) and Group Delta (Oscillator) are logically similar (Liar structures). The activity distinguishes them *phenomenologically* by changing the task (Search vs. Update). This is accurate to the philosophy: The Liar is an inconsistency for classical logic but an oscillator for revision theory. The *structure* is the same; the *theoretical lens* changes the diagnosis.
  *   **Human Latency:** Real logical revision is instantaneous. Humans take seconds to process. This lag can make the oscillation feel "messy." Emphasize that the *pattern* matters, not the speed.
  *   **Lack of Semantic Content:** These sentences are syntactic shells. They don't *mean* anything beyond the game rules. You must supply the philosophical weight in the debrief: "Imagine these sentences are about *themselves* in English, not about Green/Red cards."
  *   **Finite vs. Infinite:** Revision theory often requires transfinite steps to resolve certain sentences. You only have 4 rounds. You must explain that the cycle would continue forever, not just for 5 minutes.

