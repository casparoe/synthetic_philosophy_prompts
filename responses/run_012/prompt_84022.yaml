prompt: |-
  Next month I am leading a ninety-minute session for a cross-disciplinary reading group — twelve graduate students from economics and cognitive science, plus two lawyers — on David Lewis's account of convention. None of them has read any philosophy of language; most are comfortable with game theory. What I want them to leave with is not the ability to recite a definition but the ability to sort lookalikes correctly: a convention, a mere custom, the equilibrium of a coordination game, and a norm that carries genuine ought-force. Please plan the explanation rather than giving it to me.

  I need the order of the ideas, with the dependencies made explicit: what has to be in place before what, and why. Tell me which single idea, if I introduce it early because it happens to be the part I find most interesting, will poison everything downstream, and what I should do at that point in the session instead. Give me the sequence as a list of moves with rough minutes attached.

  Then the carrying example. My candidate is a regularity I have watched settle in my own building: whoever reaches the lift first holds the door for whoever is behind, but only if that person is roughly within ten feet; nearly everyone does this, and nearly everyone is mildly annoyed by people who hold the door for someone visibly too far away to make it. Tell me whether that can carry the session, and if not, what would; and in either case, what the example must have and must lack. I know the textbook example is which side of the road to drive on. If you would rather use it, say why, but I suspect it is too easy: the arbitrariness is obvious and the mutual benefit is enormous, so they may come away thinking a convention is just an obviously good arrangement with an arbitrary flavour.

  I expect the following misconceptions, roughly in this order, though I would like you to correct the order and add what I have missed: that a convention is something agreed to, promised, or contracted; that any regularity everyone follows is a convention; that a convention is simply the equilibrium of a coordination game, so any stable arrangement qualifies; that conventions are efficient; and that breaking one is blameworthy. There is a sixth I am not sure how to handle at all: I think they will hear common knowledge as nothing more than everyone knowing. For each misconception, tell me the exact point in the sequence where I have to head it off and what the move is that heads it off.

  Give me one question to ask at the end that would discriminate — a case they must classify, where the answer turns on a feature they would have missed had they only half-understood the account. I would prefer the case to be one none of them has encountered before.

  Tell me what to leave out at this level, and say it out loud to them, so that nobody leaves thinking they have had the whole topic.

  One further thing I want the session to end on, because it is the part I actually care about: the same behaviour, sustained in one population by expectations and mutual preference alone and in another by genuine disapproval, so that they can see exactly what work the disapproval is doing that the expectations were not. Build that in if it can be built in; if it cannot be done in ninety minutes, say so, and tell me what it would have to displace.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **Audience:** 12 grad students (Econ + CogSci) + 2 Lawyers. Comfortable with Game Theory. No Philosophy of Language background.
      *   **Topic:** David Lewis's account of convention (*Convention: A Philosophical Study*, 1969).
      *   **Goal:** Not definition recitation, but *sorting ability* (Convention vs. Custom vs. Coordination Equilibrium vs. Norm with Ought-Force).
      *   **Constraints:** 90 minutes. Plan the explanation (order, dependencies), identify the "poison pill" idea, provide a timeline.
      *   **Example:** User suggests "holding the elevator door" (within 10ft). Needs evaluation against "driving on the right."
      *   **Misconceptions:** 1. Agreement/Promise, 2. Any Regularity, 3. Just Coordination Equilibrium, 4. Efficiency, 5. Blameworthiness, 6. Common Knowledge (everyone knowing). Need to correct order and place interventions.
      *   **Assessment:** One final discrimination question (novel case).
      *   **Scope:** What to leave out (and announce it).
      *   **Specific Ending:** Distinguish behavior sustained by expectations/preference vs. behavior sustained by disapproval (Normative Force).
      *   **Format:** List of moves with minutes, dependencies explicit, specific advice on the example, misconception handling, final question, exclusions, and the ending requirement.

  2.  **Deconstruct Lewis's Account (Mental Sandbox):**

      *   Lewis defines convention as a solution to a *recurrent coordination problem*.
      *   Key components:
          1.  Regularity in behavior.
          2.  Common knowledge (everyone knows, everyone knows everyone knows...).
          3.  Expectations (I expect you to do it because you expect me to do it).
          4.  Preference condition (I prefer to do it *if* you do it; alternative exists).
          5.  Arbitrariness (another regularity could have worked).
      *   Crucial distinction: Convention $\neq$ Norm (in the sense of moral/legal obligation). Lewis is descriptive/functionalist. Norms add "ought."
      *   Crucial distinction: Convention $\neq$ Simple Equilibrium. Needs the *reason* for action to be the expectation of the other's action (interdependent expectations).
      *   Crucial distinction: Convention $\neq$ Agreement. No explicit promise needed.

  3.  **Evaluate the "Elevator Example":**

      *   *Pros:* Recurrent, coordination-ish (holding door helps both), arbitrary (could be "don't hold"), has a boundary condition (10ft).
      *   *Cons:* Is it really a coordination problem? If I hold the door, I incur a cost (time/effort). If you walk through, you gain. This looks more like an *Assurance Game* or even a *Prisoner's Dilemma* (if holding costs too much) or simple *Altruism*. Lewis requires * Coordination Game* (matching preferences).
      *   *Risk:* If the payoff structure isn't clear, students will debate the Game Theory, not the Philosophy.
      *   *Driving Example:* Too clean. Everyone knows it. Payoffs are symmetric and obvious (crash vs. no crash).
      *   *Verdict:* The elevator example is risky because the "coordination" aspect is weak. It's often a unilateral cost for another's benefit. A better example might be "Seminar Seating" or "Email Sign-offs" or "Coffee Pot Refilling."
      *   *Decision:* I need to steer the user toward an example where the *arbitrariness* and the *conditional preference* are clearer. "Which side of the sidewalk to walk on" is better than driving. Or "How to greet a colleague." Let's stick with the Elevator but *modify the framing* to ensure it fits the Coordination Game structure (e.g., "We all prefer a smooth flow; holding is only good if the other can make it; otherwise it's awkward"). Actually, the "10ft rule" is great for *arbitrariness* and *expectations*. I will advise keeping it but tightening the payoff description.

  4.  **Sequence & Dependencies:**

      *   *Foundation:* Game Theory (Coordination Problems). They know this, so start here.
      *   *Layer 1:* Regularity + Equilibrium.
      *   *Layer 2:* The "Why" (Expectations). This is the Lewis twist.
      *   *Layer 3:* Common Knowledge (The recursion).
      *   *Layer 4:* Arbitrariness (Alternative equilibria).
      *   *Layer 5:* Normativity (The "Ought"). This is the ending requirement.
      *   *Poison Pill:* Introducing "Normativity/Ought" too early. If they think conventions *must* be binding, they can't understand Lewis's functionalist definition.
      *   *Misconception Order:*
          1.  Agreement (Get this out first).
          2.  Any Regularity (Distinguish from habit).
          3.  Just Equilibrium (Distinguish from coercion/nature).
          4.  Common Knowledge (Distinguish from mutual knowledge).
          5.  Efficiency (Lewis doesn't require optimality, just better than chaos).
          6.  Blameworthiness (This is the Norm vs. Convention distinction).

  5.  **Drafting the Plan (Iterative refinement):**

      *   *0-15:* Setup & The Coordination Problem. (Use Game Theory language they know).
      *   *15-30:* The Regularity & Expectations. (Lewis's core).
      *   *30-45:* Common Knowledge & Arbitrariness. (The tricky bits).
      *   *45-60:* The Sorting Exercise (Applying the criteria).
      *   *60-75:* Norms vs. Conventions (The "Ought").
      *   *75-90:* Final Case & Wrap up.

      *Wait, I need to integrate the Misconceptions.*
      *   Agreement: Address immediately in Setup.
      *   Any Regularity: Address when defining Regularity.
      *   Just Equilibrium: Address when discussing Expectations.
      *   Common Knowledge: Address explicitly.
      *   Efficiency: Address during Arbitrariness/Equilibrium selection.
      *   Blameworthiness: Address in the Norms section.

      *Poison Pill:* If I start with "Conventions are rules we ought to follow," the whole Lewisian project collapses. Lewis says conventions *generate* the ought, they aren't defined by it. I must warn the user not to start with normativity.

      *The Ending:* The user wants to end on the distinction between expectation-sustained vs. disapproval-sustained behavior. This fits perfectly into the "Norms vs. Conventions" section (60-75). I need to make sure this *is* the climax, not just a side note.

      *The Final Question:* Needs to be a edge case. Maybe a "Shibboleth" or a "Signal" that looks like a convention but isn't, or a Norm that looks like a convention but has teeth. How about a "Silent Auction" vs. "Fixed Price"? No. How about "Tipping"? Tipping is great. It's regular, arbitrary (amount), but has normative force. Or "Standing for the Bride." Let's go with "Standing when a Judge enters." It's arbitrary (could be sitting), regular, coordinated... but is it convention or norm?

      *Wait, the prompt asks for a case they must classify.*
      *   Case: A group of friends always meets at 8 PM. If someone is late, they get a text. If they are late repeatedly, they get excluded.
      *   Is it convention? Yes.
      *   Is it norm? Yes.
      *   Better: "Wearing black to a funeral." vs "Wearing a tie to work."
      *   Let's design a specific scenario: "The Quiet Car."
      *   Scenario: On a specific train car, everyone whispers. No signs. If you talk loud, people glare. If you talk loud *twice*, the conductor asks you to leave.
      *   Question: Is the whispering a convention, a norm, or both? Where does the convention end and the norm begin?
      *   Actually, I need a case where the answer turns on a *specific feature* (like Common Knowledge or Arbitrariness).
      *   Idea: Two islands. Both drive on the left. Island A: If you drive right, you crash. Island B: If you drive right, police fine you.
      *   Lewis says both are conventions *underlying* the norm.
      *   Let's try: "The Handshake." In Group A, you shake hands. If you don't, it's awkward (preference). In Group B, you shake hands. If you don't, you are sued for breach of contract (legal norm).
      *   Better: "The Tuesday Meeting."
      *   Let's refine the Final Question later in the thought process.

      *What to Leave Out:*
      *   Lewis's possible worlds semantics.
      *   The detailed analysis of "Common Knowledge" (Aumann structures).
      *   The evolution of convention (Skyrms/etc.).
      *   Critique of Lewis (Gilbert, etc.) - unless it helps the distinction.
      *   *Crucial:* Tell them "This is Lewis's specific technical account, not the dictionary definition."

  6.  **Refining the Elevator Example:**
      *   The user likes it. I should try to save it but warn about the payoff structure.
      *   To be a Lewisian Convention, it must be a *Coordination Game*.
      *   Payoff: I prefer to hold *if* you can make it. I prefer *not* to hold if you can't (wasted effort/awkwardness). You prefer I hold *if* you can make it.
      *   The "10ft rule" is the *arbitrary* cutoff that solves the ambiguity.
      *   This works. I will advise them to frame the payoffs carefully.

  7.  **Addressing the "Poison Pill":**
      *   The idea: "Conventions are binding rules."
      *   Why: Lewis defines convention *prior* to obligation. The obligation (if any) is derivative.
      *   Fix: Start with "Solutions to Coordination Problems."

  8.  **Addressing the "Common Knowledge" Misconception:**
      *   Students think "Everyone knows."
      *   Lewis needs "Everyone knows that everyone knows..."
      *   Intervention: Use a "Muddy Children" style logic or simply emphasize the *reasoning chain*. "I do X because I expect you to do X because you expect me to do X."

  9.  **Structuring the "Norm vs. Convention" Ending:**
      *   This is the user's priority.
      *   I need to ensure the last 20 minutes are dedicated to this.
      *   Move: Take the established convention (Elevator). Add a layer of sanction. Ask: "Did the definition of convention change, or did we add a norm on top?"
      *   Lewis's view: The convention is the regularity + expectations. The norm is the added "ought."
      *   This fits the 60-90 minute block.

  10. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   Dependencies explicit? Yes.
      *   Poison pill identified? Yes.
      *   Example evaluated? Yes.
      *   Misconceptions mapped? Yes.
      *   Final question provided? Yes.
      *   Exclusions stated? Yes.
      *   Ending requirement met? Yes.

  11. **Drafting the Content:** (Self-Correction during drafting)
      *   *Correction on Misconception Order:* The prompt gives an order but asks me to correct it.
      *   Logical order of intervention:
          1.  Agreement (Start: It's not a contract).
          2.  Any Regularity (Early: It's not just habit).
          3.  Just Equilibrium (Middle: It's about *why* we are at equilibrium).
          4.  Common Knowledge (Middle: The recursion).
          5.  Efficiency (Late: It doesn't have to be optimal).
          6.  Blameworthiness (End: The Norm distinction).
      *   *Final Question:* Needs to be novel. Let's create a "Digital Protocol" case. It fits Econ/CogSci/Law.
      *   *Exclusions:* Be explicit. "We are not doing metaphysics of rules."

  12. **Final Polish:** Ensure tone is instructional but respectful of the user's expertise. Make sure the "Poison Pill" warning is prominent. Ensure the "Ending" requirement is integrated, not tacked on. (The prompt says "Build that in if it can be built in... if not, say so." It *can* be built in as the climax of the sorting exercise).

      *Wait, one check on the Elevator Example:*
      *   Is it a Coordination Game?
      *   If I hold and you are far: I lose time, you gain nothing (or feel awkward).
      *   If I don't hold and you are close: I save time, you lose time/annoyed.
      *   If I hold and you are close: We both gain (smooth entry).
      *   If I don't hold and you are far: We both neutral.
      *   This is actually an *Assurance Game* or *Battle of the Sexes* depending on preferences.
      *   Lewis requires a *Coordination Problem* (matching interests).
      *   If the interests don't match (I hate holding, you love being held for), it's not a Lewis convention.
      *   *Advice:* I must tell the user to stipulate that *everyone prefers the regularity to the chaos*. Everyone prefers a world where the 10ft rule exists to a world of random door-holding. That makes it a Coordination Problem.

      *Let's finalize the plan.*
answer: |-
  Here is the session plan, structured to meet your specific constraints and pedagogical goals.

  ### 1. The Order of Ideas and Dependencies

  You cannot build the Lewisian account top-down (from "Norm" to "Behavior"). You must build it bottom-up (from "Game" to "Expectation" to "Convention" to "Norm").

  **The Dependency Chain:**
  1.  **Recurrent Coordination Problem:** Must be established *before* Convention. (You can't have a solution without a problem).
  2.  **Regularity in Behavior:** Must be established *before* Equilibrium. (Equilibrium is a property of the regularity in the game).
  3.  **Interdependent Expectations:** Must be established *before* Common Knowledge. (Common knowledge is the engine that sustains the expectations).
  4.  **Arbitrariness:** Must be established *before* Normativity. (If the behavior isn't arbitrary, it's a law of nature or a moral imperative, not a convention).
  5.  **Convention (Lewisian Definition):** The synthesis of 1–4.
  6.  **Normative Force (Ought):** Must come *last*. (This is an add-on to the convention, not part of its definition).

  **The Poison Pill:**
  **Do not introduce "Normativity" or "Obligation" early.**
  If you suggest at the outset that conventions are things people *ought* to follow, or that breaking them involves *blame*, you will poison the session. Lewis's specific philosophical move is to define convention *without* normative force, showing how norms might later attach to them. If students anchor on "Convention = Rule with Teeth," they will fail to distinguish a convention from a law or a moral duty later.
  **Instead:** At the start, explicitly bracket normativity. Tell them: *"For the first hour, we are treating conventions as descriptive patterns of expectation, not prescriptive rules. We will add the 'ought' only at the end."*

  ---

  ### 2. The Sequence of Moves (90 Minutes)

  **00:00 – 00:10 | Move 1: The Coordination Problem (Game Theory Base)**
  *   **Action:** Draw a standard Coordination Game payoff matrix (e.g., Meet at A or Meet at B).
  *   **Goal:** Establish that there are multiple equilibria and agents prefer matching to mismatching.
  *   **Misconception Check (Agreement):** Explicitly state: *"Note that nothing in this matrix requires a contract, a promise, or a handshake. The problem exists prior to agreement."*
  *   **Why:** Leverages their Econ background; clears the "Contract" misconception immediately.

  **00:10 – 00:25 | Move 2: Regularity and Equilibrium**
  *   **Action:** Introduce the *Regularity*. People keep meeting at A.
  *   **Goal:** Distinguish a Convention from a "Mere Custom" or "Habit."
  *   **Misconception Check (Any Regularity):** Ask: *"If everyone wears blue shirts because it's the only color available, is that a convention?"* (No, no alternative). *"If everyone wears blue shirts because they independently like blue?"* (No, no interdependence).
  *   **Why:** Forces them to see that the regularity must be *contingent* on others' behavior.

  **00:25 – 00:40 | Move 3: The Expectation Loop (The Lewis Twist)**
  *   **Action:** Explain *why* they meet at A. Not because A is better, but because *I expect you to expect me to go to A.*
  *   **Goal:** Distinguish Convention from Simple Equilibrium.
  *   **Misconception Check (Just Equilibrium):** A coerced equilibrium (e.g., a dictator forces everyone to A) is not a convention. The *reason* for action must be the expectation of the other's action.
  *   **Why:** This is the core cognitive science/philosophy link. It's about reasoning, not just outcomes.

  **00:40 – 00:55 | Move 4: Common Knowledge and Arbitrariness**
  *   **Action:** Define Common Knowledge (CK). It is not just "Everyone knows." It is "Everyone knows, everyone knows everyone knows..." ad infinitum.
  *   **Goal:** Explain how the regularity sustains itself without a central coordinator.
  *   **Misconception Check (Common Knowledge):** Use a quick logic check. *"If I know you will go to A, but I don't know that you know I know, I might worry you'll switch."* CK stabilizes the expectation.
  *   **Action:** Introduce Arbitrariness. There must be another equilibrium (B) that *could* have worked.
  *   **Misconception Check (Efficiency):** *"Does A have to be better than B?"* No. It just has to be better than mismatching. This clears the "Efficiency" misconception.

  **00:55 – 01:10 | Move 5: The Sorting Exercise (Application)**
  *   **Action:** Present 3 short cases. Ask them to classify: Convention, Custom, or Coerced Equilibrium.
  *   **Goal:** Test the definition built so far.
  *   **Why:** Active learning to solidify the technical definition before adding normativity.

  **01:10 – 01:25 | Move 6: The Normative Layer (Your Priority)**
  *   **Action:** Take the established Convention. Add a layer of *disapproval* for deviators.
  *   **Goal:** Distinguish Convention (Expectation-based) from Norm (Disapproval-based).
  *   **Misconception Check (Blameworthiness):** *"If I break the convention, am I immoral?"* Lewis says no. If the group *adds* sanctions, it becomes a norm *grounded* in convention.
  *   **Why:** This fulfills your ending requirement. It shows the "work" disapproval does.

  **01:25 – 01:30 | Move 7: The Final Discrimination Question & Wrap**
  *   **Action:** Pose the final case (see below).
  *   **Action:** State exclusions (see below).
  *   **Goal:** Final assessment and scope management.

  ---

  ### 3. The Carrying Example: Elevator vs. Road

  **Verdict:** Use the **Elevator Example**, but you must **stipulate the payoffs carefully.**

  **Why not the Road?**
  You are correct. Driving is *too* clean. The cost of deviation (death/crash) is so high that it masks the arbitrariness. Students will conflate "Convention" with "Safety Rule."

  **Why the Elevator Works:**
  The "10-foot rule" is perfectly arbitrary. 15 feet would work. 5 feet would work. The annoyance is mild, not fatal. It allows you to isolate the *expectation* mechanism.

  **How to Frame It (Crucial):**
  To make it a Lewisian Convention, you must describe the preferences as a **Coordination Problem**, not an Altruism Problem.
  *   *Bad Framing:* "I hold the door to be nice." (This is altruism, not convention).
  *   *Lewisian Framing:* "We all prefer a smooth flow. If I hold and you are too far, we both experience awkwardness/wasted time. If I don't hold and you are close, we both experience friction. We need a cutoff to coordinate our expectations. 10 feet is the arbitrary cutoff we settled on."
  *   **What it must have:** Interdependent preferences (I prefer to hold *iff* you are close).
  *   **What it must lack:** Moral weight (initially). It's just awkward, not wrong.

  ---

  ### 4. Handling Misconceptions (Corrected Order & Interventions)

  I have reordered your list to match the logical flow of the argument. Intervening too early or too late renders the correction ineffective.

  1.  **Agreement/Promise (Intervention: Move 1, 00:10)**
      *   *Correction:* "Lewis's account is non-contractual. If you needed a promise, it wouldn't solve the problem of how we coordinated *before* the promise."
  2.  **Any Regularity (Intervention: Move 2, 00:15)**
      *   *Correction:* "Regularity is necessary but not sufficient. Sunrises are regular. Habits are regular. Conventions require *interdependence*."
  3.  **Just Equilibrium (Intervention: Move 3, 00:30)**
      *   *Correction:* "A Nash Equilibrium can be coerced. A Convention requires the *expectation of the other's action* to be the primary reason for my action."
  4.  **Common Knowledge = Everyone Knowing (Intervention: Move 4, 00:45)**
      *   *Correction:* "Mutual knowledge ('I know X, you know X') is unstable. I need to know that *you know that I know*. Without the recursion, I can't be sure you won't switch strategies."
  5.  **Efficiency (Intervention: Move 4, 00:50)**
      *   *Correction:* "Conventions can be suboptimal (e.g., QWERTY keyboards). They only need to be better than *no* coordination, not better than *all* coordination."
  6.  **Blameworthiness (Intervention: Move 6, 01:15)**
      *   *Correction:* "On Lewis's account, breaking a convention is irrational or awkward, not necessarily immoral. Blame comes only when the group adds a normative layer."

  ---

  ### 5. The Final Discrimination Question

  **The Case:** "The Silent Library"
  > Two groups of students study in the same library.
  > **Group A:** Everyone whispers. If someone talks loudly, others glare and move away. The talker feels embarrassed and stops. There are no official rules.
  > **Group B:** Everyone whispers. If someone talks loudly, a security guard escorts them out. There is a sign at the door: 'Silence Required.'
  >
  > **Question:** In which group is whispering a *Lewisian Convention*? In which group is it a *Norm*? Or is it both?

  **The Discriminating Answer:**
  *   **Group A:** Whispering is a **Convention**. It is sustained by interdependent expectations and preference for coordination (avoiding awkwardness/glaring). The "glare" is a natural consequence of broken expectations, not a codified sanction.
  *   **Group B:** Whispering is a **Norm (Rule)** backed by authority. While it *originated* as a convention, the *reason* for compliance has shifted from "I expect you to whisper" to "I fear the guard."
  *   **The Trap:** Students will say both are conventions. The distinction turns on the **source of the pressure**. In A, the pressure is internal to the coordination (expectations). In B, the pressure is external (authority/sanction). If they understood Lewis, they will see that Group B's behavior is no longer *arbitrary* in the same way (it's now compelled), or that the "convention" has been subsumed by a "rule."
  *   **Better Nuance:** A Lewisian might say B *has* a convention underlying the rule (the guard enforces the convention), but for the *students*, it functions as a norm. The key is asking: *"If the guard went on strike tomorrow, would the behavior persist?"* If yes, it's a convention. If no, it was just compliance.

  ---

  ### 6. What to Leave Out (And Say It Out Loud)

  You must explicitly limit the scope to prevent "false confidence." Say this at the 01:25 mark:

  > "I want to be clear about what we have **not** done today.
  > 1.  We have not discussed **how conventions evolve**. We treated them as if they appear fully formed. In reality, they emerge over time (evolutionary game theory).
  > 2.  We have not discussed **critiques of Common Knowledge**. Many philosophers argue CK is psychologically impossible for humans.
  > 3.  We have not discussed **Joint Commitment**. Margaret Gilbert argues conventions require a 'we-intention,' not just mutual expectations.
  >
  > You now have Lewis's specific technical account. You do not have the final word on social ontology. Use this tool to sort cases, but know its boundaries."

  ---

  ### 7. The Ending: Expectations vs. Disapproval

  This fits into **Move 6 (01:10 – 01:25)**. This is the most critical part for your personal goals.

  **The Setup:**
  Return to the **Elevator Example**.
  1.  **Phase 1 (Convention):** "Recall the 10ft rule. If I don't hold the door, you are annoyed. You sigh. I feel awkward. I do it because I expect you to expect it."
  2.  **Phase 2 (Norm):** "Now, imagine the building management posts a sign: 'Door Holders Required. Violators reported to HR.' Or, imagine the residents start shunning door-slammers at building parties."

  **The Question to the Room:**
  > "The behavior is identical. The regularity is identical. The equilibrium is identical.
  > **What work is the disapproval doing that the expectation was not?**"

  **The Desired Takeaway:**
  *   **Expectation** solves the *coordination* problem (it tells me what to do to match you).
  *   **Disapproval** solves the *deviation* problem (it raises the cost of breaking the match).
  *   Lewis shows us that the *convention* exists in Phase 1. The *norm* is Phase 2.
  *   **Why this matters:** It allows you to analyze social structures without assuming moral weight where there is only coordination. It lets you see when a "rule" is actually just a frozen habit.

  **If you run out of time:**
  Displace the **Sorting Exercise (Move 5)**. Reduce it to a single verbal check. Do not cut the **Expectations vs. Disapproval** segment. That is your learning objective; the sorting is just practice. The distinction between "I do this because I expect you to" and "I do this because I'll be punished" is the philosophical payload of the session.
