answer: |-
  1. **The Absorption Objection**
  Critics argue satisficing is just expected-utility maximization with a search-cost term bolted on. You reject this reduction. But if the justification for satisficing is that calculating search costs is itself too costly, doesn't that make the threshold arbitrary? If the costs of setting the threshold are unknowable, what stops your view from collapsing into "do whatever feels right"?

  *   **Follow-up:** If she argues that search costs are *in principle* incalculable rather than just expensive: Then on what basis do you set the aspiration level? If you can't calculate the cost of searching for a better threshold, isn't the choice of threshold itself just another ungrounded maximization problem?

  2. **The Flatness Worry**
  Once an agent finds an option that meets the aspiration level, standard satisficing says they should stop searching. Does this imply that all options above the threshold are equally choice-worthy? If I can choose between a "good enough" option and a "fantastic" option with no extra effort, are you committed to saying there's no rational pressure to pick the fantastic one?

  *   **Follow-up:** If she says yes, they are effectively equal: So you're defending a model of indifference with a cliff in it? How is that structurally different from saying preferences are lexicographic but we ignore the second order once the first is satisfied?

  3. **Dynamic Consistency and Money Pumps**
  A maximizer with transitive preferences can't be money-pumped. A satisficer whose aspirations shift based on context potentially can. If I offer you a series of trades where each option satisfies your current threshold but leaves you worse off overall than where you started, do you accept that satisficers are vulnerable to pumps?

  *   **Follow-up:** If she denies this is a problem for rationality: Then are you rejecting coherence constraints entirely? If rationality doesn't require dynamic consistency, what work is the label "rational" doing besides describing a specific heuristic?

  4. **Aspiration-Level Adaptation**
  You've written that aspiration levels drift up when things go well and down when they don't. But this looks suspiciously like the "sour grapes" mechanism Elster criticized. If I lower my aspirations because I can't achieve my goals, isn't that a failure of rationality rather than a feature of it?

  *   **Follow-up:** If she argues adaptation is necessary for finite agents: But doesn't that make the theory unfalsifiable? If any choice can be rationalized by positing a shifted aspiration level, how do you distinguish a rational satisficer from someone who just gave up?

  5. **Optimal Stopping Comparisons**
  In the secretary problem, there is a mathematically provable optimal stopping rule (the 37% rule). This suggests there *is* a privileged threshold for when to stop searching. Why should real-world decision-making be exempt from this kind of optimal thresholding just because the stakes are messier?

  *   **Follow-up:** If she says real life lacks the clear ranking of the secretary problem: But doesn't that just mean the *calculation* is harder, not that the *norm* of finding the optimal stopping point is wrong? Are you conflating epistemic limits with normative structure?

  6. **Strategic Settings and Equilibrium**
  In game theory, Nash equilibrium relies on players maximizing utility given others' strategies. If everyone satisfices, what plays the role of equilibrium? Is the notion even well-defined, or does game theory dissolve into a simulation of whoever has higher aspirations?

  *   **Follow-up:** If she says equilibrium doesn't matter for finite agents: Then how do you predict outcomes in competitive markets? If satisficing agents can be systematically outcompeted by maximizers, isn't the view evolutionarily unstable?

  7. **Descriptive vs. Normative**
  You often slide between claiming humans *do* satisfice and that they *should*. If we discovered a drug that allowed humans to maximize expected utility without cognitive cost, would you take it? Or is there something inherently valuable about the satisficing process itself?

  *   **Follow-up:** If she says we should still satisfice: Then you're arguing against welfare improvement? If maximizing yields better outcomes by your own lights, why is the *process* of satisficing normatively privileged over the *result*?

  8. **The AI Alignment Question (Weird)**
  Imagine you are programming a superintelligent AI. Do you hard-code it to maximize human welfare, or to satisfice? If you choose satisficing, doesn't that create an incentive for the AI to manipulate human aspiration levels downward so it can meet them more easily?

  *   **Follow-up:** If she says we can constrain the AI not to manipulate aspirations: But if the AI is a satisficer, isn't manipulating aspirations the most efficient way to meet its goal? Doesn't your theory imply the safest AI is one that doesn't care about satisfying us at all?

  9. **The Precipice Case (Weird)**
  Satisficing seems plausible for choosing a restaurant. But consider existential risk prevention. Is "good enough" safety sufficient when the cost of failure is extinction? Is there a stakes threshold where satisficing becomes morally impermissible?

  *   **Follow-up:** If she says satisficing applies everywhere: So you're committed to saying it's rational to accept a 10% chance of extinction if that meets our current safety aspiration level? Where do you draw the line between finite agent limits and moral negligence?

  10. **The Closer: Falsification**
  What would have to happen, empirically or conceptually, for you to give up the view? Is there a specific theorem, experiment, or paradox that, if solved, would force you back into the maximizer camp?

  *   **Follow-up:** If she says nothing would change her mind: Then isn't this a philosophical commitment rather than a decision-theoretic one? If the view is immune to counter-evidence, how is it distinct from dogma?
