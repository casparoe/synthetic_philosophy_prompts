answer: |-
  This is a precise and necessary dissection. Your friend is committing a category error: he is taking a sociological observation about *power* and using it as an epistemological shield against *truth*. He is using a heuristic (a rule of thumb) as if it were a law of physics.

  Here is the menu of claims hidden inside that sentence, arranged from the banal to the incoherent, with a verdict on whether any of them justify his refusal to discuss the facts of the mill strike.

  ### The Menu of Claims

  #### 1. The Archival Claim (Trivial)
  *   **The Claim:** The side that wins a conflict usually controls the state archives, the treasury, and the administrative machinery, meaning a disproportionate volume of surviving paperwork reflects their perspective.
  *   **Truth Value:** **Plainly True.** Successful regimes keep their records; defeated regimes often have their archives scattered, destroyed, or seized.
  *   **Is it verifiable?** Yes. We can count the boxes of documents from the Union vs. the Confederacy, or the company ledgers vs. the union minutes.
  *   **Does it license your friend's conclusion?** **No.** This claim establishes that evidence is *uneven*, not that it is *absent* or *useless*. Knowing the records are lopsided is the starting point of historical work, not the end of it. It obliges a historian to read against the grain, not to stop reading. It does not make the date of an arrest unknowable; it just means you might find the date in a police log rather than a union newsletter.

  #### 2. The Commemorative Claim (Moderate)
  *   **The Claim:** Public memory (plaques, statues, school curricula, museum galleries) is curated by those currently in power, and they will choose to highlight narratives that legitimize their authority.
  *   **Truth Value:** **Plainly True.** This is literally your friend's job description. Planning departments and museum boards decide what gets a plaque. They inevitably favor stories that make the town look cohesive rather than fractious.
  *   **Is it verifiable?** Yes. You can analyze funding sources and board minutes.
  *   **Does it license your friend's conclusion?** **No.** This explains why the *plaque* might be misleading, but it does not prove the *event* is unknowable. In fact, this claim admits there is a difference between the event and the plaque. If the plaque is propaganda, the historian's job is to correct it, not to shrug and say "truth is impossible."

  #### 3. The Conceptual Claim (Contentious)
  *   **The Claim:** The vocabulary and categories available to describe the past are determined by the outcome. (e.g., If the strikers win, it is a "Revolution"; if they lose, it is a "Riot." If the owners win, the fire is "Arson"; if they lose, it is "Accidental".)
  *   **Truth Value:** **Genuinely Contentious.** While language is political, reality constrains language. You cannot describe a massacre as a "negotiation" without lying, and lies leave traces. Furthermore, losers often control the moral vocabulary (martyrdom, injustice) even if they lose the political battle.
  *   **Is it verifiable?** Debatable. Linguistic analysis can show bias, but it cannot prove that *no* neutral description is possible.
  *   **Does it license your friend's conclusion?** **No.** Even if the *label* is contested, the *physical facts* (troops were petitioned for; leaders were arrested) remain. Your friend is conflating the *interpretation* of the fire with the *occurrence* of the fire.

  #### 4. The Ontological Claim (Radical)
  *   **The Claim:** There is no objective past independent of the narrative. "What happened" is identical to "what is said to have happened." Therefore, no version of the past is truer than any other; there are only competing power plays.
  *   **Truth Value:** **False (and Self-Refuting).** If this claim were true, the statement "history is written by the victors" would itself be just a power play by the losers (since it is usually cited by critics), with no claim to truth. It denies the possibility of the very critique your friend is making.
  *   **Is it verifiable?** No. It is a philosophical stance that denies verification.
  *   **Does it license your friend's conclusion?** **Yes, but illegitimately.** This is the only reading that justifies his refusal to answer your questions. It allows him to say, "We can't know if the leaders were arrested, because 'arrest' is just a story the owners tell." However, since the claim is false, the license is void.

  ---

  ### The Verdict on "The Victors"

  You asked whether "the victors" is the right description of who does the writing. Often, it is not.

  **1. The Bureaucrat Problem**
  History is mostly written by clerks, monks, scribes, and administrators. These people are rarely the "victors" in the military or political sense. They are survivors.
  *   *Example:* After the Roman Empire fell in the West, the "victors" (Germanic warlords) were largely illiterate. The "history" was written by the defeated (Romanized clergy) who inherited the pen.
  *   *Verdict:* The maxim ignores that **literacy is an independent variable from victory.** Often, the losers have the better archives because they were the administrative class before they were the defeated class.

  **2. The Loser Counter-Examples**
  You identified two massive holes in the theory.
  *   **Thucydides:** He was an Athenian general who was exiled (a loser) writing about a war Athens lost. His account is the definitive one. Why? Because he prioritized evidence over patriotism.
  *   **The Lost Cause:** The Confederacy was utterly destroyed. Yet, for 100 years, they successfully wrote the history of the Civil War for the United States, framing it as a dispute over "states' rights" rather than slavery.
  *   *Verdict:* These cases prove that **narrative dominance is a separate contest from military victory.** Losers can win the history war if they are more organized, better funded, or more motivated to mythologize the past. This makes the phrase "history is written by the victors" empirically fragile. It survives only because people do not check it.

  ### The Self-Refutation

  If your friend offers the phrase as a **general thesis** (Claim #4 above), it refutes itself.
  *   If *all* history is written by victors, then the history that says "history is written by victors" must also be written by victors.
  *   Who are the victors in that scenario? Usually, the phrase is used by skeptics, radicals, or the defeated to critique the mainstream. If the mainstream is the "victor," then the mainstream should be saying "History is objective," not "History is biased."
  *   By using the phrase, your friend is admitting that he knows the difference between the *biased story* and the *reality*. You cannot complain that a record is lopsided unless you have some standard of straightness to compare it to. He is smuggling in an objective truth (that the records are biased) to deny the possibility of objective truth.

  ### Strategy: What to Assume and What to Hold Him To

  **Which reading does he have in mind?**
  He likely oscillates between **Claim #2 (Commemorative)** and **Claim #4 (Ontological)**.
  *   When he talks about the *plaque* and the *museum labels*, he is making Claim #2, which is correct. The council *will* sanitize the strike.
  *   When he uses that to shut down your questions about *arrests and troops*, he is sliding into Claim #4. He is implying that because the plaque is biased, the arrests are unknowable.

  **Which one should you hold him to?**
  Hold him to **Claim #1 (Archival)** and **Claim #2 (Commemorative)**.
  *   **The Move:** Concede that the *plaque* will be biased. Agree that the *museum* is political.
  *   **The Trap:** Then ask: "So, if the plaque is a lie, what is the truth it is covering up? You work in planning; you have access to the minutes. Are you saying the minutes don't exist, or that you won't read them?"
  *   Force him to separate the **event** (the strike) from the **memory** (the plaque).
  *   Tell him: " 'History is written by the victors' is a reason to work harder to find the records, not a reason to stop looking. If you use it to stop looking, you aren't being a skeptic; you're being an accomplice to the victors."

  ### Summary for Your Friend

  If you need a concise way to put this to him, try this:

  > "You are using a sociological observation to make an epistemological excuse.
  >
  > 1.  **Yes,** the council will put up a plaque that favors the owners. That is the 'Commemorative' claim, and it is true.
  > 2.  **No,** that does not mean we cannot know if the troops were petitioned. That is a matter of record, not memory.
  > 3.  **No,** 'the victors' did not write the history in the cases that matter most. Thucydides lost, yet he wrote the history. The Confederacy lost, yet they wrote the textbooks.
  > 4.  **Therefore,** saying 'history is written by the victors' is not a get-out-of-jail-free card for ignoring facts. It is a warning to check the sources. If you use it to avoid checking the sources, you are proving the saying right by becoming part of the silence."

  **Final Verdict:** The saying is a **half-truth** that survives because it sounds profound enough to stop conversation. It is useful for critiquing monuments, but useless for determining facts. Your friend is using a critique of *memory* to evade a question about *evidence*. Do not let him conflate the two.
