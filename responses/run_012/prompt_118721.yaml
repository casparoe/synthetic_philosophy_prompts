          *   *Verdict:* You are correct. The framework presupposes a single chooser. Taurek says there is no "Social Chooser." If you take Harsanyi's axioms seriously, yes, you are forced into aggregation. Taurek's move is to reject the axiom that allows the aggregation (specifically, the idea that a 1% chance for everyone is equivalent to a certainty for a random 1%). Actually, Taurek rejects the idea that the *chooser's* expected utility is the sum of *individuals'* expected utilities.

      *   *Dust Specks:*
          *   *Connection:* Dust specks relies on linearity and aggregation. Taurek would say: Does the torture victim care that a billion people got dust specks? No. The loss isn't summed.
          *   *Translation:* In Taurek's frame, you can't trade off intensity against numbers easily.

  5.  **Refining the Tone:**
