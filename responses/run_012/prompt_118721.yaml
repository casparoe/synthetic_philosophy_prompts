  7.  **Final Polish:** Organize into the requested sections. Ensure the "Residue Report" is punchy and direct. (Self-correction: Make sure to explicitly mention the "Separateness of Persons" objection to Utilitarianism, as that's the philosophical name for what the user is intuiting in Q3).

  8.  *(Final thought on Dust Specks)*: In Taurek's view, Dust Specks vs Torture is a category error. You can't aggregate the specks to outweigh the torture because the specks are distributed across distinct "moral universes" (people).

