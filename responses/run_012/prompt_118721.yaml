          1.  Is Taurek's coin flip just a symmetric bargaining solution (refusing interpersonal utility comparison + symmetry)?
          2.  Can the "numbers don't count" view be trivially represented as a utility function insensitive to headcount? If so, is the debate just about utility functions? If not, what blocks this move?
