prompt: |-
  Me and a friend have been argueing about Kelly betting for about a year now and we never get anywhere, so we want to try that adversarial-collaboration thing where you actually write down what both sides can sign. I'm the Kelly / "geometric rationality" side: I think if you're making a long sequence of multiplicative bets and you care about where you actually end up, you should bet to maximize expected log wealth, and I think that's a rational requirement and not just one risk-taste among many. My argument is roughly the ergodicity one — over many bets your wealth multiplies, so what grows is the product, so the thing that matters for an individual over time is the time-average growth rate, not the ensemble average that expected-value reasoning chases. She's the expected-utility side. She says "maximize expected log" is literally just EU maximization with log utility, that log is one utility function among infinitely many, and that there's no theorem deriving log from coherence alone — she always brings up the result that maximizing expected log isn't the same as maximizing expected value for any fixed utility function, and I never have a clean reply.

  Where I think we're talking past each other: she treats "cares about time averages" as just another preference I happen to have, and I treat it as forced on anyone who's actually going to live through the sequence. Also I keep leaning on the fact that a Kelly bettor's bankroll ends up proportional to the likelihood she assigned to what actually happened — so it feels like Kelly is about being a good predictor, i.e. about accuracy, not about liking log. She says that's either a restatement or it just shows log is the utility of accuracy, which is still a utility. There's also ruin: I care a lot about never hitting zero, and she says that's a constraint on what bets are available, not part of the criterion.

  Write the joint statement the two of us could both sign. Don't cite anything, neither of us wants a reading list, just write it. Format it like this:

  - "What we both accept" — numbered list, 10-ish short claims, about what Kelly does and doesn't say, what EU says, and what "rational" could even mean here.
  - "The disagreement, in our own words" — two short paragraphs, one per side, each worded so the other person would let that side keep it.
  - "Cruxes" — 3 or 4 sub-questions such that settling one would actually move at least one of us; state each neutrally.
  - "Predictions" — a table, one row per crux: a case, argument, or thought-experiment we'd both agree bears on it, then what each of us predicts.
  - "What would change our minds" — a few lines each, what we'd count as evidence or argument against our own side.

  And please don't just tell me who's right, the whole point is the document.
