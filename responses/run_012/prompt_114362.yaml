  2.  **Deconstruct the Core Concepts:**
      *   **Determinism:** In physics/math, a system is deterministic if the state at time $t$ *uniquely* determines the state at time $t + \Delta t$. Given *exact* same inputs, you get *exact* same outputs.
      *   **Chaos:** A system is chaotic if it exhibits sensitive dependence on initial conditions (SDIC). Nearby trajectories diverge exponentially.
      *   **The User's Simulation:** It's a numerical integration (likely Runge-Kutta) of differential equations. These equations *are* deterministic. The divergence happens because the inputs were *not* identical ($10^{-12}$ difference is non-zero in math).
