answer: |-
  Subject: Draft handout on the centipede game decision tree

  Hi there,

  Here is the draft of the handout you requested for the reading group. I have structured it as a continuous narrative guide that walks the reader through a decision tree, starting from our shared commitment to the textbook solution and branching out into the various philosophical and theoretical positions regarding what that solution implies. I have avoided any visual formatting like bullets or bold text so that the structure relies entirely on the flow of the prose, as you asked. I hope this serves as a useful tool for Tuesday night.

  To begin, we all accept the starting point that in a finite centipede game with standard material payoffs, backward induction dictates that the first player should take the pot immediately, and that this is the unique subgame-perfect equilibrium. The first question you must ask yourself to locate your position is whether the monetary payoffs listed in the game tree accurately reflect the players true utilities. If you answer no, because you believe players care about things like fairness, reciprocity, or the welfare of the other player, then you arrive at the first leaf, which we might call the Preference Richness view. This position holds that backward induction is logically sound but the game model is poor because real players are not the pure payoff maximizers the theory assumes. If you answer yes, and insist that money is the only thing that matters, you proceed to the second node.

  Here you must ask whether common knowledge of rationality is actually present among the players in the room. If you answer no, believing that players simply do not know for certain that their opponents are rational, you reach the leaf of Epistemic Humility. This view argues that backward induction fails in practice because the strict epistemic conditions required to launch the reasoning chain are not met. If you answer yes, asserting that the players do know each other to be rational, you move to the third node. At this stage, the question becomes whether common knowledge of rationality is even logically coherent in this specific context, or if the assumption undermines itself when players reason about each other reasoning. If you answer no, arguing that the concept is self-undermining or paradoxical, you reach the leaf of Epistemic Impossibility. It is worth noting here that for the purpose of a single experimental session, the leaves of Epistemic Humility and Epistemic Impossibility are practically indistinguishable, since you cannot easily ask a question that separates a contingent lack of knowledge from a logical impossibility, but theoretically they remain distinct branches. If you answer yes, maintaining that the assumption is coherent and holds, you continue to the fourth node.

  The fourth question asks whether the counterfactual subgames that backward induction reasons about, specifically the ones that never get reached because the game ends early, are well-defined decision situations at all. If you answer no, suggesting that reasoning about nodes that cannot exist is void, you arrive at the leaf of Counterfactual Skepticism. This position holds that backward induction fails because it relies on meaningful choices at unreachable points in the tree. If you answer yes, accepting that these counterfactuals are valid, you proceed to the fifth node. Here you must decide whether rationality means choosing the best move given what actually happens at each step, or whether it means choosing the best plan given what one can commit to over the whole game. If you answer that rationality applies to plans, you reach the leaf of Resolute Choice. This view argues that backward induction fails because a player can rationally resolve to keep passing, treating the plan as the unit of agency rather than the individual move. There is a potential region of the space here that remains largely unoccupied, which is the combination of believing counterfactuals are void but plans still matter, as this position is arguably incoherent since evaluating a plan usually requires assessing counterfactual outcomes of deviation. If you answer that rationality applies to moves, you continue to the sixth node.

  At the sixth branch, you must ask whether the standard theory is intended to prescribe how agents ought to act or merely to predict how they do act. If you answer that it is only a predictive model, you reach a leaf we might call Descriptive Failure, which suggests the theory is simply wrong about human behavior without implying the humans are irrational. If you answer that the theory is normative and tells us how rational agents should act, you move to the seventh and final node. Here the question is whether the standard expected-utility picture of practical rationality is complete. If you answer no, believing that there are rational constraints outside expected utility, you reach the leaf of Theory Revision, which holds that the puzzle shows the standard picture to be incomplete rather than simply mistaken. If you answer yes, asserting that expected utility captures all there is to rationality, you arrive at the final leaf of Standard Orthodoxy. This is the view that backward induction is sound and the only thing left to explain is why people irrationally cooperate despite the logic of the game.

  I hope this structure helps the group navigate the discussion without getting bogged down in restating the basics. Please let me know if you need any adjustments to the wording or the flow before you distribute it.

  Best regards,

  Your Reporter
