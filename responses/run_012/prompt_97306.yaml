prompt: |-
  I chair the clinical ethics consultation service at a large teaching hospital. We do about four consults a week, each with real consequences for a patient, and each written up in a note that a review board audits for consistency across cases. Our current worksheet is a checklist organized around medical indications, patient preferences, quality of life, and contextual features, and I have come to think it quietly assumes a generalist picture of moral reasons: that a given consideration carries the same kind of weight wherever it appears. Write me a replacement procedure that takes the particularist challenge seriously — a feature that functions as a reason in one case (a patient's stated preference, a family's plea, a clinician's unease) may function differently, or not at all, in another, and no principle keeps its valence across cases — while still yielding a written rationale that can be defended. Give me the steps in order, what counts as a sufficient answer at each, where the procedure issues a stop, and where it must hand the decision to a person because the question is evaluative rather than factual. As a discipline, require that any principle invoked be paired with an explicit statement of what would defeat it in this case. Then run it on three consults: an elderly patient with decisional capacity refusing a life-saving amputation over her adult children's objection; a family requesting continued ventilation of a patient the team believes will never recover consciousness; and a choice between two patients for one ICU bed. Include at least one verdict the hospital will not like, and tell me where the procedure will misfire — the cases it cannot settle, and how a particularist procedure can be gamed by whoever writes the note.
reasoning: |-
  Here's a thinking process that leads to the suggested clinical ethics consultation procedure:

  1.  **Analyze the Request:**
      *   **Role:** Chair of Clinical Ethics Consultation Service (large teaching hospital).
      *   **Current State:** 4 consults/week, audited notes, current worksheet uses the "Four Topics" method (medical indications, preferences, QoL, contextual features).
      *   **Problem:** The current method assumes *generalism* (principles/reasons have consistent weight/valence across cases).
      *   **Goal:** Create a replacement procedure based on *moral particularism* (reasons function differently in different contexts; no principle keeps its valence across cases).
      *   **Requirements:**
          *   Steps in order.
          *   Criteria for sufficient answers at each step.
          *   Stop conditions.
          *   Hand-off points (where human judgment is required vs. factual).
          *   Discipline: Any principle invoked must be paired with a "defeater statement" (what would defeat it *in this case*).
          *   Application: Run the procedure on three specific cases (Refusal of amputation, Futile ventilation, ICU bed allocation).
          *   Critical Analysis: Include a verdict the hospital won't like, identify where the procedure misfires/cannot settle, and explain how it can be gamed.

  2.  **Deconstruct Moral Particularism in Clinical Ethics:**
      *   *Core Tenet:* Moral reasons are holistic. A feature (e.g., "patient autonomy") that counts in favor of an action in Case A might count against it or be irrelevant in Case B. There are no exceptionless moral principles.
      *   *Challenge for Institutions:* Hospitals need consistency, auditability, and defensibility. Particularism looks like arbitrariness to auditors.
      *   *Solution:* The procedure must focus on *salience* and *contextual nuance* rather than *subsumption under rules*. It needs to document *why* a reason matters here, not just *that* it matters.
      *   *The "Defeater" Requirement:* This is crucial. If I cite "Autonomy," I must explicitly state what could override it *in this specific context*.

  3.  **Drafting the Procedure (The "Salience & Defeasibility Protocol" - SDP):**
      *   *Step 1: Phenomenological Mapping.* Don't list facts; list *concerns*. What is bothering the stakeholders?
      *   *Step 2: Reason Identification (without labeling).* Identify the features acting as reasons.
      *   *Step 3: Valence & Weight Assessment.* Does this feature support or oppose the action *here*? How heavy is it *here*?
      *   *Step 4: The Defeater Clause.* If a principle is named, what kills it in this instance?
      *   *Step 5: Holistic Integration.* Weighing the configuration, not adding up points.
      *   *Step 6: The Recommendation & Hand-off.* Where does the ethicist stop and the clinician/admin start?

      *Refining the Steps for the Prompt:*
      *   Need clear "Sufficient Answer" criteria.
      *   Need "Stop Conditions."
      *   Need "Hand-off Points."

  4.  **Developing the Three Cases:**

      *   *Case 1: Elderly Patient Refusing Amputation.*
          *   Standard view: Autonomy wins.
          *   Particularist view: Is the refusal expressive of values or depression? Do the children have a role that changes the weight of their objection?
          *   *Verdict:* Respect refusal (Standard).
          *   *Twist:* Maybe the procedure reveals the capacity assessment is shaky due to contextual pressure, but ultimately autonomy holds. Let's make it standard to contrast with the next one.

      *   *Case 2: Futile Ventilation.*
          *   Standard view: Medical futility/Non-maleficence wins. Stop treatment.
          *   Particularist view: "Futility" is a value judgment. Family's religious/cultural context might make "consciousness" less relevant than "biological life."
          *   *Verdict:* The hospital won't like this. Let's recommend a time-limited trial *despite* team belief, because the family's moral distress outweighs the resource burden *in this specific context*, OR recommend withdrawal but acknowledge the team's discomfort is the real driver. Let's go with a verdict that challenges the "futility" label. Let's say: *Continue until transfer is arranged, rejecting immediate withdrawal.* (Hospital dislikes resource use).

      *   *Case 3: ICU Bed Allocation.*
          *   Standard view: Triage protocols (SOFA scores, survival likelihood).
          *   Particularist view: Protocols hide value judgments. Maybe one patient has a specific social role that changes the "QoL" calculus in a way the protocol ignores.
          *   *Verdict:* This is where particularism is dangerous. Let's make the procedure highlight that *no ethical distinction can be made* and it must be random or first-come. Or, pick the one with worse prognosis because of a specific contextual reason (e.g., palliative needs). Let's go with: *The procedure cannot settle this.* It exposes the lack of moral difference.

      *Wait, I need a verdict the hospital will not like.*
      *   Case 2 is the best candidate. Recommending continued treatment against medical advice (even if temporary) costs money and risks liability.
      *   Case 3 is good for showing where it misfires.

  5.  **Addressing the "Gaming" and "Misfire" Analysis:**
      *   *Gaming:* Since reasons are context-dependent, a writer can emphasize specific contextual details to make a reason weigh more or less. "Salience" is subjective.
      *   *Misfire:* Cases where reasons are truly incommensurable. Particularism admits some conflicts have no rational resolution.
      *   *Audit Risk:* Auditors want consistency. Particularism looks like inconsistency.

  6.  **Refining the Procedure Steps (Iterative Process):**
      *   *Step 1: Narrative Capture.* (Facts + Emotions).
      *   *Step 2: Feature Isolation.* (What is doing the work?).
      *   *Step 3: Valence Check.* (Is this a pro or con *here*?).
      *   *Step 4: Defeater Statement.* (Mandatory).
      *   *Step 5: Configuration.* (How they interact).
      *   *Step 6: Decision/Handoff.*

      *Let's tighten the "Defeater" requirement.* "If you cite Principle X, you must state Condition Y that would nullify X in this specific instance."

  7.  **Drafting the Content (incorporating the constraints):**
      *   *Tone:* Professional, procedural, slightly academic but actionable.
      *   *Structure:* Procedure first, then Cases, then Critique.

      *(Self-Correction during drafting Case 1)*: Make sure the particularist angle isn't just "Autonomy." It's about *why* autonomy matters here. Is it the *act* of choosing or the *values* behind it?
      *(Self-Correction during drafting Case 2)*: Ensure the "Hospital won't like" verdict is clear. Recommending continued ventilation when the team says "never recover" is a resource/liability hit.
      *(Self-Correction during drafting Case 3)*: Show where the procedure stops. Allocation is often policy, not ethics. The procedure should reveal that.

  8.  **Final Review against Constraints:**
      *   Steps in order? Yes.
      *   Sufficient answer defined? Yes.
      *   Stop conditions? Yes.
      *   Hand-off points? Yes.
      *   Principle + Defeater discipline? Yes.
      *   Three specific cases run? Yes.
      *   Verdict hospital won't like? Yes (Case 2).
      *   Where it misfires? Yes (Case 3/Critique).
      *   How it can be gamed? Yes (Critique).

  9.  **Final Polish:** Ensure the distinction between Generalism (Four Topics) and Particularism (Salience/Context) is clear in the procedure design. The key is avoiding "checking a box" for Autonomy and instead asking "How is autonomy functioning here?"

  **(Self-Correction on the "Defeater" constraint):** The prompt says: "require that any principle invoked be paired with an explicit statement of what would defeat it in this case." I need to make sure this is a hard rule in the procedure section.

  **(Self-Correction on "Hand-off"):** Distinguish between ethical recommendation and medical/administrative decision. The ethicist recommends; the clinician decides.

  Let's write it.cw
answer: |-
  # The Salience & Defeasibility Protocol (SDP)
  **Version 1.0 | Clinical Ethics Consultation Service**

  ## I. Procedural Steps

  **Step 1: Phenomenological Mapping**
  *   **Action:** Do not list medical facts. List the *concerns* voiced by each stakeholder (patient, family, team, administration) as they experience them.
  *   **Sufficient Answer:** A narrative summary where every stakeholder's primary anxiety is articulated in their own idiom (e.g., not "family denies prognosis," but "family believes stopping ventilation equates to killing").
  *   **Stop Condition:** If a stakeholder's concern cannot be articulated without translating it immediately into a bioethical principle (e.g., "They are worried about autonomy"), return to interview.
  *   **Hand-off:** None. This is data gathering.

  **Step 2: Feature Isolation & Valence Assignment**
  *   **Action:** Identify specific features of the case acting as reasons (e.g., "the patient's age," "the cost of the bed," "the chaplain's presence"). Assign a *valence* (supports/opposes/neutrals the proposed action) *only for this case*.
  *   **Sufficient Answer:** A list of features where the direction of influence is explicit. (e.g., "Patient's age: Opposes aggressive intervention *in this context* because it correlates with her stated value of 'not being a burden,' not because age itself is a cutoff.").
  *   **Stop Condition:** If a feature is listed as having a fixed valence regardless of context (e.g., "Autonomy always supports patient refusal"), the step is failed.
  *   **Hand-off:** None.

  **Step 3: The Defeater Discipline**
  *   **Action:** For every moral principle or norm invoked to justify a leaning (e.g., Respect for Persons, Stewardship, Non-maleficence), you must write a **Defeater Statement**.
  *   **Sufficient Answer:** A conditional statement specifying what fact, if present *in this specific case*, would nullify the principle's force.
      *   *Format:* "Principle X supports Action Y, *unless* Feature Z is present."
  *   **Stop Condition:** If the Defeater Statement is a tautology (e.g., "unless it is wrong") or a general exception (e.g., "unless the patient lacks capacity"), the step is failed. It must be case-specific.
  *   **Hand-off:** None.

  **Step 4: Holistic Configuration**
  *   **Action:** Describe how the features interact. Do they amplify each other? Do they cancel out? This is not a tally.
  *   **Sufficient Answer:** A paragraph describing the *shape* of the moral problem (e.g., "The family's distress amplifies the team's fear of liability, which artificially inflates the weight of 'non-maleficence'").
  *   **Stop Condition:** If the output is a score or a weighted list, the step is failed.
  *   **Hand-off:** **Evaluative Hand-off.** The ethicist identifies the moral weight; the clinician/administrator must accept whether that weight is actionable.

  **Step 5: Recommendation & Residual Risk**
  *   **Action:** State the recommended course. Explicitly state what moral residue remains (what value is being sacrificed).
  *   **Sufficient Answer:** A clear directive + a statement of loss (e.g., "We recommend withdrawal. This sacrifices the family's need for closure to prioritize the patient's bodily integrity.").
  *   **Stop Condition:** If the recommendation claims to satisfy all values, it is failed.
  *   **Hand-off:** **Decision Hand-off.** The recommendation goes to the Attending of Record (medical decisions) or Administration (resource decisions). The Ethics Service does not decide.

  ***

  ## II. Case Applications

  ### Case 1: The Refusal (78F, Capacity, Refusing Amputation)
  **Context:** Patient refuses life-saving leg amputation. Adult children object, citing her "depression." Team believes she has capacity.

  *   **Step 1 (Mapping):** Patient: "I am whole or I am nothing." Children: "She is not thinking clearly; she will regret this." Team: "We can fix the leg, but not the will."
  *   **Step 2 (Features):**
      *   *Stated Preference:* Supports refusal. Valence: High.
      *   *Children's Objection:* Supports override. Valence: Low (in this context, they offer no evidence of incapacity, only disagreement).
      *   *Survival Probability:* Supports intervention. Valence: Neutral (irrelevant if bodily integrity is the primary value).
  *   **Step 3 (Defeater Discipline):**
      *   *Principle:* Respect for Autonomy.
      *   *Defeater Statement:* "Autonomy supports refusal *unless* the refusal is shown to be a direct symptom of a treatable psychiatric distortion of reality *in this moment*, not merely a value difference."
  *   **Step 4 (Configuration):** The children's distress is real but functions as a contextual pressure, not a moral veto. The medical benefit (life) conflicts with the patient's definition of life (wholeness).
  *   **Step 5 (Verdict):** **Recommend honoring refusal.**
      *   *Residual Risk:* Patient dies. Family sues.
      *   *Hand-off:* Attending must document capacity rigorously and cease coercion.

  ### Case 2: The Vegetative State (45M, Ventilated, Family Demands Continuation)
  **Context:** Patient in permanent vegetative state (PVS). Team deems ventilation medically inappropriate. Family demands continuation based on religious belief in "miracle."

  *   **Step 1 (Mapping):** Team: "This is torture of a body." Family: "God breathes, so we breathe." Admin: "ICU bed blocked."
  *   **Step 2 (Features):**
      *   *Medical Consensus (Futility):* Supports withdrawal. Valence: High.
      *   *Religious Belief:* Supports continuation. Valence: High (in this context, it constitutes the patient's identity).
      *   *Resource Scarcity:* Supports withdrawal. Valence: Variable (depends on ICU census).
  *   **Step 3 (Defeater Discipline):**
      *   *Principle:* Non-maleficence (Do no harm).
      *   *Defeater Statement:* "Non-maleficence supports withdrawal *unless* the definition of 'harm' is contested by the patient's surrogate community in a way that makes withdrawal a moral injury to them greater than the physical burden on the patient."
  *   **Step 4 (Configuration):** The team's "futility" is a physiological claim masking a quality-of-life judgment. The family's "miracle" is not a medical claim but a temporal one (time for grace).
  *   **Step 5 (Verdict):** **Recommend continued ventilation for 30 days while seeking transfer to a long-term acute care facility.**
      *   *Residual Risk:* Resource misuse; Team moral distress.
      *   *Hospital Dislike:* This verdict consumes resources the hospital wants to reclaim and validates a medical plan the team deems inappropriate. It prioritizes the family's moral injury over the team's professional integrity for a defined period.
      *   *Hand-off:* Administration must approve the funding/bed for the 30-day window.

  ### Case 3: The Single Bed (Patient A vs. Patient B)
  **Context:** One ICU bed. Patient A: 25yo, drug overdose, high survival chance. Patient B: 70yo, community elder, pneumonia, moderate survival chance. Both need bed now.

  *   **Step 1 (Mapping):** Triage Officer: "Who saves the most life-years?" Community: "The elder is a pillar." Team A: "Overdose is self-inflicted." Team B: "Age is not a criterion."
  *   **Step 2 (Features):**
      *   *Life-Years:* Supports A. Valence: High.
      *   *Social Value:* Supports B. Valence: Indeterminate (dangerous terrain).
      *   *Causation (Overdose):* Supports B. Valence: Low (punitive).
  *   **Step 3 (Defeater Discipline):**
      *   *Principle:* Utility (Maximize benefit).
      *   *Defeater Statement:* "Utility supports Patient A *unless* the metric of 'benefit' excludes the specific social network stability that Patient B provides, which is a medical determinant for their own recovery."
  *   **Step 4 (Configuration):** The features are incommensurable. "Life-years" and "Social Role" do not share a common currency. The procedure reveals there is no *ethical* distinction, only a *policy* one.
  *   **Step 5 (Verdict):** **Procedure Halts. No ethical recommendation.**
      *   *Reason:* The SDP reveals that any choice here is a policy allocation, not an ethical resolution. To choose one is to privilege one feature arbitrarily.
      *   *Hand-off:* **Mandatory Hand-off to Triage Policy.** The decision must be made by lottery or first-come-first-served per hospital policy. The ethicist recuses from the specific choice.

  ***

  ## III. Critical Analysis: Misfire and Gaming

  ### Where the Procedure Misfires
  The SDP cannot settle **Case 3** (Allocation) effectively. Particularism excels at nuance but fails at scarcity. When two lives compete for one resource, the "salience" of features becomes a zero-sum game that the procedure cannot adjudicate without smuggling in a generalist principle (e.g., "maximize QALYs"). By admitting it cannot settle the case, the SDP protects the ethicist from complicity in rationing, but it leaves the clinical team without the guidance they requested. In high-volume crisis standards of care, this procedure is too slow and too indeterminate. It creates ethical paralysis when action is required.

  ### How the Procedure Can Be Gamed
  Because the SDP relies on the *writer's* assessment of salience and valence, it is vulnerable to **Narrative Framing Bias**.
  1.  **Salience Manipulation:** A consultant who wants a specific outcome can describe a feature in a way that makes it salient. In Case 1, if I want to override the patient, I describe her refusal as "stubbornness rooted in fear" (Feature: Fear) rather than "values rooted in integrity" (Feature: Integrity). Both are factually true, but they carry different weights in Step 4.
  2.  **The Defeater Loophole:** The Defeater Statement (Step 3) can be written so narrowly that it never triggers. E.g., "Autonomy stands *unless* the patient is currently hallucinating." If the patient isn't hallucinating, the defeater is inert, but the writer has created the *illusion* of critical scrutiny.
  3.  **Audit Evasion:** Because the SDP rejects consistency across cases (a core particularist tenet), an auditor cannot easily flag inconsistencies. If I rule for the family in Case 2 but against the family in Case 5, I can defend it by saying, "The contextual features were different." This makes the service unaccountable to institutional standards of justice.

  ### The "Hospital Won't Like" Verdict
  In **Case 2**, the recommendation to continue ventilation for 30 days against medical advice is financially and legally risky. It prioritizes the *process* of moral disengagement for the family over the *efficiency* of the hospital. A generalist protocol (e.g., "Unilateral withdrawal after 2nd opinion") would have cleared the bed in 7 days. The SDP, by taking the family's moral reasons seriously as *particular* to them, forces the institution to absorb the cost of their grief. This is ethically robust but administratively unsustainable at scale.
