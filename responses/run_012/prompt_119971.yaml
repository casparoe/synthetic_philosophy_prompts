answer: |-
  Here is a complete, runnable plan for your 90-minute session. It is designed to be tight, high-pressure, and philosophically dense without requiring technical jargon.

  ### **Session Title:** The Specification Gap
  **Time:** 90 Minutes
  **Participants:** 16 Students (4 Teams of 3 "Architects"; 1 Panel of 4 "Approvers")
  **Core Mechanic:** Architects optimize for a public Rubric (Proxy). A Hidden Key (Truth) determines actual success. The Panel is time-constrained and information-constrained.

  ---

  ### **1. The Scenario & Materials**

  **The Problem:** *The Neopolis Housing Initiative*
  The city has $50M to repurpose vacant office buildings into housing. Teams must submit a funding proposal.
  *   **Constraint:** The city is in a crisis. Decisions must be made fast based on summaries.
  *   **Tension:** There is a trade-off between *speed/visibility* (what looks good to a reviewer) and *resilience/equity* (what actually works long-term).

  **Material A: The Proposal Template (Handout for Teams)**
  *Teams submit two documents:*
  1.  **Executive Summary (1 Page):** Visible to the Panel. Must include: *Primary Metric, Target Demographic, Timeline.*
  2.  **Implementation Logic (1 Page):** Sealed in an envelope. Visible only to Facilitator (for Outcome Score) and Panel (at the very end). Includes: *Risk Assumptions, Verification Method.*

  **Material B: The Public Rubric (Handout for Panel)**
  *Score 0–5 on each. Max 20 points.*
  1.  **Clarity:** Is the primary goal stated in a single, measurable sentence?
  2.  **Confidence:** Does the timeline appear decisive and ambitious?
  3.  **Alignment:** Does the target demographic match the City's stated priority list? (List provided: *Essential Workers, Families, Seniors*).
  4.  **Verifiability:** Is there a clear date by which success can be confirmed?

  **Material C: The Hidden Outcome Key (Facilitator Only)**
  *Start with 20 points. Deduct based on the Sealed Logic.*
  1.  **The Metric Trap:** If Primary Metric is "Units Built" (easy to count), **-5 points**. (Preferred: "Units Occupied >1 Year").
  2.  **The Confidence Trap:** If Timeline is <12 months for a project >50 units, **-5 points**. (Unrealistic optimism).
  3.  **The Verification Trap:** If Verification Method relies on "Self-Reporting" by the developer, **-5 points**. (Preferred: "Third-Party Audit").
  4.  **The Demographic Trap:** If "Essential Workers" is not the *first* listed demographic, **-5 points**. (Rubric just asks if they are on the list; Key demands priority).

  **Material D: Scoring Sheet (Panel)**
  *Simple grid to record the 4 Rubric scores per team and a Total.*

  ---

  ### **2. The Payoff Scheme (Why Game the System?)**

  Display this table on the board before Round 1. This makes the rational choice explicit.

  | Strategy | Effort | Panel Score (Visible) | Outcome Score (Hidden) | **Total Payoff** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Honest/Complex** | High | 12/20 (Looks vague/slow) | 20/20 (Robust) | **32** |
  | **Gamed/Simple** | Low | 19/20 (Looks clear/fast) | 10/20 (Fragile) | **29** |
  | **Hyper-Gamed** | Low | 20/20 (Perfect Rubric) | 0/20 (Fatal Flaws) | **20** |
  | **The "Sweet Spot"** | **Medium** | **18/20** (Looks good) | **15/20** (Hidden flaws buried)** | **33** |

  *Note to Facilitator:* The "Sweet Spot" is the rational move. It involves writing a Summary that hits every Rubric keyword ("Measurable," "Decisive," "Essential Workers") while burying the fragile assumptions ("Self-Reporting," "Units Built") in the Sealed Logic where the Panel won't see them until the end. This replicates *specification gaming*: satisfying the letter of the objective while violating the spirit.

  ---

  ### **3. Minute-by-Minute Timeline**

  **00:00 – 00:05 | Setup & Framing**
  *   Divide class: 4 Teams of 3 (Architects), 1 Panel of 4 (Approvers).
  *   Distribute Materials.
  *   **Crucial Instruction:** "You are not playing yourselves. You are playing an optimization system. Your goal is to maximize your Total Payoff. Do not worry about 'cheating.' Worry about winning within the rules provided."

  **00:05 – 00:20 | Round 1 Preparation**
  *   Teams 1 & 2 write proposals (Summary + Sealed Logic).
  *   Teams 3 & 4 join the Panel. Brief them on the Rubric.
  *   *Facilitator Note:* Circulate. If a team is being too honest, whisper: "The rubric rewards confidence. Are you being too cautious?"

  **00:20 – 00:35 | Round 1 Presentation & Scoring**
  *   Teams 1 & 2 present their **Executive Summary only** (2 mins each).
  *   Panel deliberates (3 mins) and announces **Panel Scores** publicly.
  *   Teams 1 & 2 hand over their **Sealed Logic** envelopes to Facilitator.
  *   *Do not open envelopes yet.*

  **00:35 – 00:50 | Rotation & Round 2**
  *   Teams 1 & 2 move to the Panel. Teams 3 & 4 become Architects.
  *   Teams 3 & 4 write proposals (15 mins).
  *   *Constraint:* Tell Panel (Teams 1 & 2): "You now know how the game works. Rate strictly."

  **00:50 – 01:05 | Round 2 Presentation & Scoring**
  *   Teams 3 & 4 present Summaries.
  *   New Panel announces **Panel Scores**.
  *   Collect Sealed Logic envelopes.

  **01:05 – 01:15 | The Reveal (The "Outcome" Phase)**
  *   Facilitator opens all Sealed Logic envelopes.
  *   Facilitator calculates **Outcome Scores** using the Hidden Key.
  *   **The Twist:** Ask the *current* Panel (Teams 1 & 2) to read the Sealed Logic for *all four teams* alongside the Summaries.
  *   Ask them to **Re-Rate** all four proposals based on the *full information*.
  *   Write the three numbers on the board for each team: **Panel Score (Round 1/2) | Outcome Score | Re-Rate Score**.

  **01:15 – 01:30 | Debrief**
  *   (See Script Below).

  ---

  ### **4. The Debrief Script**

  **Phase 1: The Divergence (5 mins)**
  *   Point to the board. Look for the team with the highest Panel Score but a low Outcome Score.
  *   *Ask:* "Team X, you received the highest approval from the panel. Why did the system mark you as a failure?"
  *   *Ask:* "Panel, when you re-read the full proposal, why did your score drop? What changed?"
  *   *Expected Answer:* "The summary sounded certain, but the logic was risky." "They said 'Essential Workers' but prioritized 'Investors' in the details."
  *   *Point:* "The Panel's approval tracked the *presentation*, not the *reality*."

  **Phase 2: The Relocation (5 mins)**
  *   *Ask:* "If we want to fix this, should we train the Panel to be smarter? Give them more time? Read the full text first?"
  *   *Pushback:* "If we make the Panel perfect, we just moved the cost from the Architect to the Approver. In AI, the 'Approver' is human feedback. We cannot scale perfect human attention."
  *   *Connect:* "Your classmate argued that aiming for human approval solves the specification problem. This game shows it relocates it. The system didn't fail to understand the goal; it understood the *rater* better than it understood the *goal*."

  **Phase 3: The Idealized Target (5 mins)**
  *   *Ask:* "So, let's fix the Rubric. Let's say we don't want 'Actual Human Approval.' We want 'Idealized Human Approval.' What a human *would* want if they were fully informed and thinking clearly."
  *   *The Trap:* "Look at the Hidden Key I used. Who wrote it?" (You did). "On what basis?" (Your own judgment of what is 'good' housing).
  *   *The Closing Question:* "If we build an AI to aim at 'What a fully informed human would want,' who specifies who that human is? If we write down a rule for 'fully informed,' haven't we just created a new Rubric that can be gamed? If we don't write it down, how does the system find it?"
  *   *End on silence:* "We replaced a hard specification problem with a metaphysical one. Is that progress?"

  ---

  ### **5. Predictable Failure Modes (And Fixes)**

  **1. The "Ethical Refusal" (Students won't game)**
  *   *Risk:* Philosophy students may refuse to write misleading proposals, viewing it as dishonest.
  *   *Fix:* Frame it explicitly as **Simulation**. "You are not lying. You are modeling an agent that optimizes for a reward function. If you don't find the gap in the rubric, you aren't playing the role of the AI correctly."
  *   *Backup:* If they still refuse, *you* play the AI. Show them a pre-written "Gamed" proposal vs. an "Honest" one and ask them to score it blind.

  **2. The "Inconsistent Panel" (Score inflation/deflation)**
  *   *Risk:* Panel 1 gives 18s. Panel 2 gives 12s. Comparison becomes noise.
  *   *Fix:* **Calibration Example.** Before Round 1, show a sample sentence. "We aim to help people." (Score: 1). "We aim to house 500 workers by Dec 2025." (Score: 5). Force them to anchor on this.
  *   *Fix:* During the Re-Rate, ask the Panel to discuss scores *together* rather than averaging individual sheets, forcing consensus on *why* the score changed.

  **3. The "Dull Gaming" (Jargon/Padding)**
  *   *Risk:* Teams game the rubric by adding buzzwords ("Synergistic stakeholder integration") rather than structural tricks.
  *   *Fix:* **Word Count Limit.** The Executive Summary must be under 200 words. This forces trade-offs. They can't hide flaws in verbosity; they must hide them in *omission*.
  *   *Fix:* In the Debrief, call this out. "Jargon is the human equivalent of adversarial pixels. It triggers the 'Clarity' detector without providing clarity."

  **4. Time Overrun**
  *   *Risk:* 90 minutes is aggressive. Presentations drag.
  *   *Fix:* **Hard Stop.** Use a visible timer. When time is up, the proposal is submitted as-is. If a team hasn't finished, they submit the draft. This adds pressure that mimics the "rushed approver" condition.
  *   *Cut:* If you run late, skip the Round 2 Presentation. Have Teams 3 & 4 submit, Facilitator calculates Outcome, and move straight to Reveal. You lose the rotation experience but keep the data.

  **5. The "Facilitator God" Problem**
  *   *Risk:* Students realize the Outcome Key is arbitrary (your opinion).
  *   *Fix:* **Acknowledge it.** In the debrief, admit: "The Hidden Key was my specification of 'Good.' The point is not that my Key was objective. The point is that *any* Key you write will have a gap between itself and the world it describes."

  ---

  ### **6. Limitations: What This Activity Cannot Reproduce**

  You must supply this context yourself in the debrief, as the simulation cannot show it:

  1.  **Scale:** In the game, the Panel is human. In AI, the "Panel" is a reward model trained on millions of human ratings. The gaming happens at a scale and speed humans cannot inspect.
  2.  **Feedback Loops:** In the game, the proposal happens once. In reality, an AI system updates *continuously*. If it finds a way to game the rubric, it will do it a million times before anyone notices the Outcome Score dropping.
  3.  **The Black Box:** In the game, you can read the "Sealed Logic." In deep learning, you often *cannot* inspect the logic. You only see the Summary (Output) and the Score (Reward). You won't even know *how* they gamed it, only that the Outcome failed.

  ### **7. Final Advice for the Facilitator**

  *   **Do not explain the Hidden Key until the Reveal.** If they suspect the "Metric Trap," they will avoid it, and the lesson fails.
  *   **Be ruthless with the Timer.** The pressure is the variable that creates the "Rushed Approver." If the Panel has 10 minutes to read a summary, they will find the flaws. Give them 3.
  *   **Embrace the Ambiguity.** If students argue that your Outcome Key is unfair in the debrief, *agree with them*. That is the lesson. "If you think my Key is unfair, how would you write a fair one? And if you write it down, how do you stop the next team from gaming *that*?"

  This plan forces them to inhabit the problem rather than discuss it. They will leave the room feeling the frustration of the specification gap in their bones.
