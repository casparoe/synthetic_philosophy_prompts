answer: |-
  ### Requirements for an Adequate Account of Scientific Continuity

  #### I. Case-Based Requirements
  **1. The Fresnel-Maxwell Constraint**
  *   **Requirement:** The account must explain how the wave equation and optical laws were preserved while the mechanical aether ontology was discarded.
  *   **Forcing Consideration:** This is the paradigmatic case of structural continuity; any view that cannot accommodate the survival of mathematical form amidst ontological revolution fails the primary historical test.
  *   **Status:** Non-negotiable.

  **2. The Phlogiston/Caloric Constraint**
  *   **Requirement:** The account must distinguish between the survival of functional relations (Carnot's cycle) and the failure of constitutive assumptions (caloric as a fluid), without rendering the predecessor's success miraculous.
  *   **Forcing Consideration:** Demonstrates that predictive success can rest on structural relations even when the posited entities are non-referring; tests the limit of "false but working."
  *   **Status:** Non-negotiable.

  **3. The Entity Persistence Constraint (The Electron Case)**
  *   **Requirement:** The account must accommodate cases where specific entity posits (e.g., the electron) survive theory change *in addition to* structural relations, without reducing the entity to mere structure.
  *   **Forcing Consideration:** A blanket ban on entity continuity (radical structuralism) contradicts the historical stability of certain theoretical posits; the account must explain why *some* ontology survives while other ontology (aether) does not.
  *   **Status:** Non-negotiable.

  **4. The Gene Reduction Constraint**
  *   **Requirement:** The account must specify whether the classical gene was *reduced to* molecular structures or *replaced by* them, and justify the continuity of the term "gene" across the shift.
  *   **Forcing Consideration:** Tests the account's handling of multi-level theories and whether continuity requires identity or merely functional mapping.
  *   **Status:** Camp-specific (Entity realists and selective realists will differ on the verdict, but the account must deliver *a* verdict).

  #### II. Conceptual Distinctions
  **5. The Structure-Prediction Distinction**
  *   **Requirement:** The account must distinguish between the preservation of structure and the mere reproduction of observational predictions.
  *   **Forcing Consideration:** Saving the phenomena is instrumentalism; explaining *why* the phenomena are saved via inheritance is realism. Conflating the two collapses continuity into empirical adequacy.
  *   **Status:** Non-negotiable.

  **6. The Reference Stability Constraint (Added)**
  *   **Requirement:** The account must specify the mechanism of reference for theoretical terms across theory change (e.g., causal-historical vs. descriptive).
  *   **Forcing Consideration:** Without a theory of reference, claims that "the electron survived" are semantically empty; if reference shifts entirely, there is no continuity to explain.
  *   **Status:** Non-negotiable.

  **7. The Discard Mechanism Constraint (Added)**
  *   **Requirement:** The account must explain what determines which parts of a predecessor are *discarded* as well as which are preserved.
  *   **Forcing Consideration:** If everything is preserved (via loose mapping), the account is trivial. Continuity implies discontinuity elsewhere; the criteria for rejection must be as robust as the criteria for retention.
  *   **Status:** Non-negotiable.

  **8. The Ontic/Epistemic Stance**
  *   **Requirement:** The account must declare whether the preserved structure is a feature of the world (ontic) or of our representation/knowledge (epistemic).
  *   **Forcing Consideration:** Determines whether the account solves the Pessimistic Induction by changing our view of the world (OSR) or our view of knowledge (ESR).
  *   **Status:** Camp-specific.

  #### III. Logical and Pragmatic Constraints
  **9. The Non-Triviality Constraint**
  *   **Requirement:** The criteria for structural preservation must be stronger than a cardinality condition or generic mathematical mapping (addressing Newman's Objection).
  *   **Forcing Consideration:** Any theory can be mapped onto any other via sufficiently abstract relations; without restrictive criteria, "continuity" becomes vacuously true.
  *   **Status:** Non-negotiable.

  **10. The Pessimistic Induction/No-Miracles Balance**
  *   **Requirement:** The account must simultaneously defuse the Pessimistic Induction (past failures) and sustain the No-Miracles Argument (current success).
  *   **Forcing Consideration:** The core motivation for continuity views is to navigate between the Scylla of historical skepticism and the Charybdis of naive realism.
  *   **Status:** Non-negotiable.

  **11. The Ex Ante Accessibility Constraint (The "Working Scientist" Requirement)**
  *   **Requirement:** The verdict about what is being carried over must be available to a working scientist at the time of the transition, not only to a historian post-facto.
  *   **Forcing Consideration:** An account that identifies continuity only retrospectively is a redescription of history, not a normative guide for rational belief formation during theory choice.
  *   **Status:** Non-negotiable.

  **12. The Live Theory Applicability**
  *   **Requirement:** The account must apply to current, unsettled research programmes (e.g., dark matter, quantum gravity), not merely settled history.
  *   **Forcing Consideration:** Philosophy of science must guide current inquiry; if the account only works on closed cases, it lacks pragmatic utility for the realist.
  *   **Status:** Non-negotiable.

  ***

  ### Flagged Conflict: Joint Satisfiability
  **The Ex Ante Accessibility Constraint (11) vs. The Non-Triviality Constraint (9).**
  *   **The Conflict:** To satisfy **Non-Triviality**, one typically requires rigorous mathematical demonstration (e.g., isomorphism, limiting relations) to prove structure is preserved and not just trivially mapped. However, such rigorous demonstrations are rarely available *during* the transition period; they are usually constructed by historians or philosophers *after* the successor theory is mature. To satisfy **Ex Ante Accessibility**, the criteria for continuity must be heuristic and available to the working scientist, which risks loosening the criteria enough to violate **Non-Triviality**.
  *   **Implication:** You risk having an account that is either trivial (accessible but loose) or historically inaccurate (rigorous but retrospective).

  ***

  ### The Narrowing Requirement
  **Requirement:** **The Ex Ante Accessibility Constraint (11).**

  **Why it narrows the field:**
  Most structural realist accounts (particularly Epistemic Structural Realism and the Ramsey-Sentence strategy) are formulated as *rational reconstructions*. They demonstrate continuity by showing that the mathematical structure of the old theory can be recovered within the new theory. This recovery is almost exclusively a retrospective enterprise. Demanding that the *scientist* be able to identify the preserved structure *before* the successor is fully established eliminates accounts that rely on complex logical formalisms unavailable in the laboratory.

  **Position Eliminated:**
  **The Ramsey-Sentence Strategy.**
  While philosophically robust regarding theoretical commitment, the Ramsey-sentence approach requires the logical reconstruction of a theory's observational consequences to isolate its structural content. This is a formal logical task that is computationally intractable and conceptually opaque to a working physicist during a theory transition. It cannot be used *ex ante* to guide belief, failing the Working Scientist Constraint decisively. (Note: This constraint also places severe pressure on retrospective versions of Epistemic Structural Realism, forcing them to become heuristic rather than purely mathematical).
