      *   **Constraint:** As a French civil servant, the Deputy Head *must* apply French law. The "Anglo instinct" is a philosophical lens, not a legal one. However, the procedure can use the Anglo lens to check for fairness *within* the legal bounds, or to identify where the law is doing heavy lifting.

