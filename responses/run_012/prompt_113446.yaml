      *   *Crucial Nuance:* I must emphasize that Hofstadter *disagrees* with the "Mind > Machine" conclusion. Many readers get GEB backwards on this point. They think it proves humans are special. Hofstadter thinks it shows humans are complex mechanical systems. I need to be clear on this without lecturing too hard.

  6.  **Final Review against constraints:**
      *   Did I correct the framing? Yes (the "outside" assumption).
      *   Did I address both friends? Yes.
