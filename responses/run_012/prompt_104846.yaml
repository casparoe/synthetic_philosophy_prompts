answer: |-
  1. The rigid-designator account separates metaphysical necessity from epistemic contingency by distinguishing how reference is fixed from what determines modal profile, whereas epistemic-role anchoring locates necessity in the constitutive rules governing the term's theoretical usage.
  2. Under rigid designation, the identity is a posteriori because we must empirically investigate the essence of the rigidly designated kind, while role anchoring implies the identity is a posteriori only insofar as discovering the underlying structure is required to fully specify the role.
  3. Epistemic-role anchoring risks collapsing into a sophisticated descriptivism because it ties reference to satisfying a specific cluster of theoretical properties rather than a causal-historical chain. However, proponents might argue the role is indexical or contextual, preserving a direct reference unlike classical Fregean senses.
  4. For the rigid-designator account, if the founding sample is a mixture, the term fails to pick out a natural kind entirely, rendering the identity statement false or meaningless rather than necessary.
  5. Conversely, epistemic-role anchoring might allow the term to refer to the mixture itself if the theoretical role accommodates heterogeneous substances, thereby preserving the identity as necessary relative to that revised theoretical framework.
