answer: |-
  This is a profound observation, and it cuts to the heart of political philosophy. You have identified a phenomenon that looks like corruption from the outside but functions as legitimacy from the inside. As a philosopher of institutions, I would argue that you are witnessing the operation of a specific, often unarticulated, normative framework. It is not merely "how things are done"; it is a moral ecosystem with its own internal logic.

  Per your request, I will begin by brainstorming the competing philosophical intuitions at play before attempting a reconstruction of the implicit theory. I will then address your three specific questions, distinguish between what the practice *requires* versus what it *tolerates*, and finally speculate on the practical consequences of imposing a thesis of incommensurability.

  ### I. Brainstorming the Normative Landscape

  Before settling on a reconstruction, we must map the rival explanations for why a legislator feels clean while a bribed judge feels (and is) corrupt.

  1.  **The Utilitarian Calculus:** Perhaps the legislator is simply maximizing utility. She calculates that the transit line helps 10,000 people, while the abortion restriction harms a principle. The net good is positive.
      *   *Problem:* This doesn't explain why the *judge* cannot do the same. A judge could arguably maximize social welfare by trading a verdict. Yet, we forbid it. So, simple consequentialism is insufficient.
  2.  **The "Dirty Hands" Thesis (Walzer):** Perhaps the legislator *is* doing something wrong, but it is a necessary wrong for the sake of governing.
      *   *Problem:* You report they feel *no* betrayal of conscience. Dirty hands implies a moral remainder—a guilt that is acknowledged but borne. These actors feel virtuous. This suggests they do not see the act as a transgression at all.
  3.  **The Constitutive Rules Argument:** Perhaps the difference is purely rule-based. Chess allows capturing; checkers does not. But this is too thin. Rules need a *point*. Why do the rules of the legislature permit trading while the rules of the court forbid it?
  4.  **The Epistemic vs. Volitional Distinction:** A judge claims to *find* the law (epistemic truth). A legislator claims to *will* the law (volitional choice). You cannot trade on truth, but you can compromise on will.

  *Decision:* The fourth intuition seems the most robust starting point for reconstruction, but it must be integrated with a specific view of value and representation.

  ---

  ### II. Reconstructing the Implicit Theory

  Here is the best reconstruction of the normative framework your legislators are inhabiting. Let us call this **The Theory of Aggregated Mandates.**

  #### 1. The Nature of Value: Contextual Comparability without Global Commensurability
  You ask if logrolling presupposes that goods (abortion restrictions vs. transit lines) are commensurable—placeable on a single scale.

  **The Practice's Presupposition:** The practice does *not* strictly require global commensurability (a single metric like "utils" or "dollars" that measures all moral goods). It requires only **local, action-guiding comparability.**

  **The Philosophy:**
  If I trade my vote on Issue A for your vote on Issue B, I am not necessarily saying "A is worth exactly X and B is worth exactly X." I am saying, "In this specific context, given my constraints and obligations, the package {Pass B + Fail A} is preferable to the package {Fail B + Pass A}."

  This is compatible with **incommensurability** in the strong philosophical sense (the idea that there is no common measure between the values). I can acknowledge that the moral value of "life" and the social value of "transit" are different *kinds* of goods that cannot be weighed on a single scale, yet still rationally choose one package over the other based on a **lexicographical ordering** or a **satisficing** strategy.

  **Where it is Underdetermined:**
  The practice looks the same whether the legislator believes:
  *   (A) All values are ultimately reducible to a single currency (Utilitarianism).
  *   (B) Values are plural and incommensurable, but rational choice is still possible through non-comparative justification (Pluralism).
  The *act* of trading does not reveal which metaphysical view of value they hold. It only reveals that they believe a trade is *permissible*.

  #### 2. Role Morality: The Filter of Authorization
  Does the legislator's obligation run to the office rather than moral truth?

  **The Practice's Presupposition:** Yes, but with a nuance. It is not that personal morality is irrelevant; it is that personal morality is **input**, not **adjudicator**.

  **The Philosophy:**
  This relies on a **Delegate Model of Representation** mixed with **Institutional Division of Labor.**
  *   **The Legislator's Role:** To aggregate the competing interests of a constituency into a coherent political will. The "moral truth" of a bill is secondary to the "authorization" of the bill. If the constituency needs transit more than it needs to resolve the abortion issue (or if the constituency is divided), the legislator trades to secure the transit.
  *   **The "Clean Hands" Feeling:** They feel clean because they view themselves as **fiduciaries of a portfolio**, not **guardians of the good**. A fund manager who sells a stock they personally like to balance a portfolio does not feel they have betrayed the stock; they have served the fund.

  **Where it is Underdetermined:**
  The practice does not tell us *who* the principal is.
  *   Is the legislator trading to serve the specific voters in her district (Delegate)?
  *   Is she trading to break gridlock for the sake of the state's functioning (Trustee)?
  *   Is she trading to build power for her party to enact future good (Partisan)?
  All three motivations produce the same logrolling behavior. The practice is underdetermined regarding the *ultimate end* of the role, provided the *immediate means* is vote exchange.

  #### 3. The Legislator/Judge Distinction: Structural Necessity
  Is the line between the trading legislator and the trading judge contingent or necessary?

  **The Practice's Presupposition:** The practice treats this distinction as **categorically necessary**, not contingent.

  **The Philosophy:**
  This rests on the **Truth-Claim vs. Will-Claim** distinction.
  *   **Judicial Output:** A verdict claims to be *correct* based on antecedent facts and law. It is a statement of truth ("The defendant is liable"). If a judge trades a verdict, they are asserting a falsehood for gain. This corrupts the *epistemic integrity* of the institution.
  *   **Legislative Output:** A law claims to be *authorized* based on collective will. It is a statement of command ("This shall be the rule"). There is no antecedent "truth" to corrupt. The process of forming the will *includes* negotiation.

  **Why the Participants See a Difference:**
  To the legislator, the judge is a **referee** (must be neutral to the outcome), while the legislator is a **player** (expected to advocate for an outcome). A referee trading calls destroys the game. A player trading positions is part of the game.

  **Uncertainty:**
  This distinction blurs in reality. Judges often have discretion (sentencing), and legislators often claim their laws reflect "justice" (truth). However, the *normative ideal* of the office maintains the wall. The practice requires this wall to remain standing to justify the trading. If legislators began claiming their votes were "findings of moral fact" rather than "expressions of will," logrolling would become indefensible even to them.

  ---

  ### III. What the Practice Strictly Presupposes vs. What It Merely Fits

  To be precise about the implicit theory, we must separate the load-bearing walls from the decoration.

  **Strict Presuppositions (The practice collapses without these):**
  1.  **Alienability of the Vote:** The legislator must own their vote sufficiently to transfer its utility. If the vote were viewed as a sacred trust that *must* be cast according to conscience regardless of consequence, trading would be treason.
  2.  **Procedural Legitimacy over Substantive Correctness:** The legitimacy of the law must derive from the fact that it passed the required procedure (majority vote), not from the fact that it is morally optimal. If the goal were "The Morally Best Law," trading (which often produces sub-optimal moral compromises) would be impermissible.
  3.  **Reciprocity as a Virtue:** Within the chamber, keeping a bargain must be viewed as a moral good that can offset the moral cost of the vote traded. "I kept my word" must outweigh "I voted for a bad bill."

  **Merely Compatible (The practice fits these, but doesn't need them):**
  1.  **Utilitarianism:** As noted, they don't need to believe in a single scale of value, only that trade-offs are rational.
  2.  **Party Discipline:** Logrolling happens across party lines. It doesn't require a two-party system, only a multi-actor system.
  3.  **Constituent Awareness:** The constituents do not need to know about the trade for the act to be internally legitimate to the legislator. (Though if they found out, they might vote the legislator out—that is an external constraint, not an internal ethical one).

  **Areas of Underdetermination:**
  *   **The Source of Obligation:** Is the duty to the district, the state, or the institution itself? The behavior is identical, but the internal justification varies.
  *   **The Limit of Trade:** The practice does not define where trading stops. Can you trade a vote on war? On genocide? The practice assumes there are "ordinary" stakes where trading applies, but it has no internal mechanism to define the boundary of the "tragic" where trading becomes forbidden. This is left to individual intuition.

  ---

  ### IV. The Incommensurability Challenge: Changing the Practice

  You asked what would have to change in the *chamber* if we replaced their implicit view with a thoroughgoing thesis of **incommensurability** (the view that certain values cannot be traded against one another because they share no common measure and no rational ordering is possible between them).

  Currently, they operate on **weak commensurability** (I can choose between them). If you convinced them of **strong incommensurability** (Choosing one over the other is irrational or morally forbidden), the practice would have to undergo radical surgery:

  1.  **The End of Logrolling:** Vote trading would be reclassified as a category error, akin to a judge trading verdicts. You cannot trade a "right" for a "benefit."
  2.  **Shift from Negotiation to Deliberation:** The floor would cease to be a marketplace and would have to become a seminar. The goal would shift from *counting votes* to *changing minds*. If values cannot be traded, the only way to pass a bill is to convince others that *this* value supersedes *that* one universally, not just for this transaction.
  3.  **Supermajority or Unanimity Requirements:** If trade-offs are illegitimate, then imposing a law that harms a minority's incommensurable value for the majority's gain becomes tyrannical. The threshold for passage would likely rise to require near-consensus, ensuring no incommensurable value is overridden without the owner's consent.
  4.  **Bundling Prohibition:** Omnibus bills (combining transit and abortion) would be ruled out of order. Each value must stand on its own merits. This would drastically slow down legislation and likely lead to gridlock, as the "gains from trade" that currently grease the wheels would vanish.
  5.  **Conscience Clauses:** Institutional rules would likely be added to allow legislators to abstain without penalty on issues deemed "incommensurable," acknowledging that their vote cannot be counted as part of a quorum if it involves a trade-off of sacred values.

  ### V. Final Philosophical Assessment

  The unease you feel is the friction between **Agent-Neutral Morality** (what is good for the world) and **Agent-Relative Obligation** (what is good for me to do in this role).

  The legislators are operating within a system of **Institutional Morality**. In this system, the "good" is not the moral perfection of every law, but the **continued functioning of the collective decision-making process.** Logrolling is the lubricant that prevents the machinery of state from seizing up due to moral absolutism.

  They distinguish themselves from the judge because the judge serves **Truth**, while they serve **Peace** (in the Hobbesian sense of ordered coexistence). A judge who trades corrupts Truth. A legislator who trades secures Peace.

  **Where the theory is vulnerable:**
  The theory collapses if the "Peace" purchased by logrolling systematically violates fundamental rights that the institution claims to protect. If the transit bill is merely "useful" but the abortion restriction is a "grave wrong" (as you noted), the theory relies on the assumption that the "grave wrong" is not actually a rights violation that trumps the procedural legitimacy.

  If the "grave wrong" *is* a fundamental rights violation, then the legislator's feeling of cleanliness is a form of **false consciousness**. They are treating a rights violation as a policy preference. The practice *presupposes* that all items on the legislative docket are commensurable policy preferences. If one item is actually a fundamental right, the practice is ethically blind to that distinction.

  **Recommendation for your work:**
  The dramatic tension in your novel lies in that blind spot. The characters are not hypocrites; they are true believers in a system that requires them to treat some moral truths as negotiable commodities. The tragedy is not that they are selling out, but that they have successfully convinced themselves that nothing is for sale, because they are not selling *values*, they are trading *jurisdiction*.

  The judge cannot trade because the law belongs to the State. The legislator can trade because the vote belongs to the District. The moment a legislator believes the vote belongs to the Truth, the trading stops. The moment they believe the law belongs to the Party, the corruption begins. They walk the line between the two, believing they are in the center, when philosophically, they are standing on a fault line.
