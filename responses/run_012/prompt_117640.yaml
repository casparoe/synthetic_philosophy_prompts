          *   *Verdict:* This is the formal statement ($C_t(A) = E_t[C_{t'}(A)]$). Accurate formulation.
      *   *Sentence 4:* "Van Fraassen argued that this is basically the same principle as the one that says you should defer to objective chances -- the Principal Principle -- because your future self is like an expert who has more information than you do."
          *   *Verdict:* Controversial/Debatable. They are analogous, but not "the same." PP is about chance, Reflection is about credence.
