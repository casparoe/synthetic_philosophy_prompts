          *   *Snag:* Fidelity to self-image (he saw himself as a mathematician, not a martyr) vs. fidelity to record (he was a team player, not a lone genius).
          *   *Verdict:* The theory struggles here. If we prioritise his self-image, we might suppress the truth of his collaboration. If we prioritise the record, we might violate his privacy.

