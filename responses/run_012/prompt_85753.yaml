      Title: ASK ASSENT
      By Dr. Silas Craton
      Tagline: *Your feelings are just thoughts wearing masks.*

      Dear Dr. Craton,
      I have memorized the aviation safety statistics. I know intellectually that turbulence is harmless. Yet, when the plane drops, I scream. I cannot convince my stomach to accept the math. If emotion is judgment, why does my body ignore the facts?
      — Turbulent in Toledo

      Dear Turbulent,
      Your body does not ignore the facts; you do not actually believe them. You possess the statistics as explicit data, but your tacit assent remains aligned with danger. The fear *is* the judgment that "this noise implies catastrophe." If you truly held the judgment that "this is safe," the screaming would be impossible. You are confusing occurrent knowledge with dispositional belief. The feeling persists because the deeper verdict hasn't changed. Stop reciting stats and correct the underlying assent.

      Dear Dr. Craton,
      My husband died a year ago. Friends suggest I "reframe" my loss to stop the crying. But I don't want to. The pain is the price of loving him. If I fix the judgment, do I stop caring? I wouldn't give this grief back even if I could.
      — Widow in Westport

      Dear Widow,
      You are making a second-order judgment: that "grief equals loyalty." You have decided that suffering is the appropriate tribute. This is why the feeling survives; you are actively judging the absence as an evil that *must* be felt. You can honor his memory without the affective disturbance. If you claim you wouldn't give the grief back, you are admitting you value the pain over the tranquility. That is a choice. Change the valuation of the tribute, and the tears will vanish. You are choosing to suffer.

      Dear Dr. Craton,
      When I hold my daughter, I feel a warmth in my chest. It isn't a thought. It's a physical swelling. Some psychologists say emotions are perceptions of bodily states, not judgments. They say I feel the warmth, then I label it "love." Are they right?
      — Soft in Seattle

      Dear Soft,
      They are wrong. That warmth is a somatic habit, a physiological echo of past judgments of value. Do not listen to those who claim emotions are raw perceptions or bodily states. They mistake the smoke for the fire. They want you to indulge in vague "qualia" rather than correct the proposition. It is lazy philosophy designed to excuse irrationality. They tell you to "sit with" the feeling rather than interrogate the belief. Your chest tightens because you judge her presence as vital to your flourishing. Change the dependency, change the tightness. The body is merely the messenger; stop blaming the mailman for the bill.

