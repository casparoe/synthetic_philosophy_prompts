      *   **Applicant 1:** Woman, hospitalized for months due to a freak infection (unforeseeable bad luck).
      *   **Applicant 2:** Man, lost savings on a leveraged crypto bet (high-risk voluntary choice), but has a background of childhood financial trauma (dad gambled rent).
      *   **Conflict:** User's gut says fund Applicant 1 (deservingness based on lack of fault). Friend on committee says fund Applicant 2 (or at least don't judge him) based on compassion and understanding of systemic/psychological factors (childhood trauma affecting decision-making).
      *   **User's Struggle:** Second-guessing their intuition. Is it a valid principle or just judgmentalism? What factors *should* matter in this specific context?
      *   **Goal:** Untangle the intuition, identify the ethical frameworks at play, and provide guidance on what to do.

  2.  **Deconstruct the Ethical Dilemma:**
      *   **Framework 1: Desert/Responsibility (The User's Gut).** Focuses on causality and fault. Applicant 1 is a "victim of circumstance." Applicant 2 is an "agent of risk." Mutual aid often leans towards solidarity with the vulnerable, but limited resources force triage.
      *   **Framework 2: Need/Consequentialism.** Who needs it more *now*? Who will suffer more without it? Does funding one prevent more harm?
      *   **Framework 3: Solidarity/Non-Judgment (The Friend's Point).** Mutual aid is distinct from charity. Charity often judges worthiness; mutual aid is about community support regardless of fault. The friend brings in the nuance of *why* people make risky choices (trauma response, normalization of gambling).
      *   **Framework 4: Sustainability/Incentives.** If the pot funds risky behavior, does that encourage more risk? Does it erode trust among contributors?

  3.  **Analyze the "Intuition":**
      *   The user's gut isn't necessarily "cruel." It's rooted in a common heuristic: *Protect the vulnerable from things they can't control.* This is a stable basis for community trust.
      *   However, the friend's point is also valid: *Poverty and trauma distort risk assessment.* Calling it a "free choice" ignores the psychological impact of growing up with financial instability.
