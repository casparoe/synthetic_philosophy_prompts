answer: |-
  This is a profound ethical dilemma that cuts to the heart of what mutual aid is supposed to be. You are wrestling with the tension between **moral desert** (who *deserves* help based on their actions) and **radical solidarity** (help based on *need*, regardless of cause).

  Your gut isn't necessarily "judgy" in a petty sense; it is reacting to a principle of **stewardship and sustainability**. However, your friend is right that human behavior is rarely purely "free."

  Here is an untangling of the forces at play, followed by a framework for making the decision.

  ### 1. What is actually driving your intuition?
  Your intuition is likely balancing three distinct ethical frameworks:

  *   **The Insurance Principle:** Most small community pots function implicitly as insurance. We pay in to protect against *unforeseeable catastrophes* (illness, fire, job loss). A freak infection fits this model. A leveraged crypto bet is not a catastrophe; it is a speculative investment that failed. If the pot covers speculative losses, it ceases to be insurance and becomes a subsidy for risk-taking.
  *   **The Stewardship Principle:** You are managing neighbors' money. Contributors generally expect their money to go toward survival and stability, not to recoup investment losses. Funding the crypto loss could erode trust in the pot, causing contributors to leave, which destroys the mutual aid network for everyone (including the woman with the infection).
  *   **The Triage Principle:** In emergency medicine, you treat the most life-threatening condition first. You are implicitly assessing that the woman's situation (medical debt, inability to work due to health) is a more fundamental threat to human stability than the man's loss of savings (which, while devastating, implies he *had* surplus capital to gamble).

  **Verdict on your gut:** It is not just judgment; it is a heuristic for **systemic sustainability.**

  ### 2. What is your friend's argument actually doing?
  Your friend is invoking **determinism and compassion.**
  *   **The Trauma Argument:** They are correct that financial trauma in childhood often leads to distorted risk assessment in adulthood. When you grow up thinking money is fleeting (because dad gambled it), you might subconsciously feel compelled to "swing for the fences" to secure safety quickly, or you might normalize gambling behavior.
  *   **The Non-Judgment Argument:** Mutual aid is distinct from charity. Charity often asks, "Are you worthy?" Mutual aid asks, "Are you in need?" Your friend is worried that by judging the *cause* of the need, you are turning the pot into a moral court rather than a safety net.

  **Verdict on the friend:** Their analysis of the man's psychology is likely accurate, but it conflates **understanding** a behavior with **resourcing** it. We can understand why he gambled without agreeing that the community pot is the appropriate vehicle to absorb that loss.

  ### 3. What should actually matter? (The Criteria)
  To make this decision without it being about personal bias, you need to anchor it in the **purpose of your specific pot.** Ask the committee to agree on these three questions:

  **A. Is this pot for "Survival" or "Restoration"?**
  *   If the woman is facing medical debt and inability to work, she is in a *survival* threat.
  *   If the man lost savings but is not currently facing eviction or hunger, he is in a *restoration* phase (trying to get back to where he was).
  *   *Principle:* Mutual aid prioritizes survival over restoration.

  **B. Does funding this set a harmful precedent?**
  *   If you fund the woman, does that encourage neighbors to get sick? No.
  *   If you fund the man, does that signal that high-risk speculation is socially insured? Potentially, yes.
  *   *Principle:* Mutual aid must protect the collective from moral hazard.

  **C. What is the severity of current harm?**
  *   Forget how they got there for a moment. Who is in worse shape *today*?
  *   If the crypto loss means the man's family is literally about to be evicted next week, and the woman has insurance that is just slow to pay, the calculus changes.
  *   *Principle:* Acute need trumps past causality.

  ### 4. What should you do?
  Based on the details you provided (freak infection vs. leveraged bet), here is a recommended path forward:

  **Step 1: Formalize the Decision Criteria**
  Do not make this a vote on "who is a better person." Make it a vote on "which application fits our mission." If your pot's mission is "emergency relief for unforeseeable crises," the woman is the objective fit. If your mission is "neighbor support no questions asked," the man has a claim. Most small pots survive by being the former.

  **Step 2: Fund the Woman, but Frame it Carefully**
  You should likely fund the first applicant. This protects the sustainability of the pot and aligns with the "insurance against catastrophe" model that keeps neighbors paying in.
  *   *Why:* It distinguishes between **misfortune** (which community absorbs) and **speculation** (which is individual).
  *   *The Risk:* If you don't draw this line, the pot becomes vulnerable to high-risk behavior that could drain it entirely.

  **Step 3: Offer the Man "Non-Monetary" Mutual Aid**
  This is how you address your friend's concern about cruelty. You can deny the *grant* without denying the *support*.
  *   Tell the man: "We cannot fund investment losses as it jeopardizes the fund's ability to handle medical emergencies, but we are a community."
  *   Mobilize the network for him in other ways: A meal train, help with resume writing, temporary childcare, or a separate collection specifically for him that doesn't come from the main emergency grant.
  *   This acknowledges his hardship and his trauma without compromising the financial integrity of the main pot.

  **Step 4: Acknowledge the Trauma**
  When discussing this with the committee, validate your friend's point. Say: *"I agree that his choices were influenced by his upbringing, and we should not shame him. However, our limited resources require us to prioritize unforeseeable survival threats over recoverable financial losses to ensure this pot exists for everyone long-term."*

  ### Summary
  Your intuition is serving as a guardrail for the **long-term viability** of the mutual aid project. It is not cruel to prioritize the person who fell through no fault of their own when resources are scarce; it is a triage decision.

  However, to ensure you aren't just being "judgy," you must separate the **financial decision** (funding the medical crisis) from the **community response** (supporting the man emotionally and practically). That allows you to be principled stewards of the money while remaining compassionate neighbors.
