answer: |-
  **SCENE:** *A secure conference room. Three researchers—ELENA, RAJ, and SAM—sit around a table. In the center is a briefcase with five keyholes. Any single key turns the lock.*

  **ELENA**
  Okay, status on the Stratospheric Cloud project?

  **RAJ**
  I've run the numbers. Expected value is deeply negative. We shouldn't launch.

  **SAM**
  Agreed. Terrible idea.

  **ELENA**
  Me too. So we're safe, right?

  **RAJ**
  Statistically? No. We're three for five keyholders. The other two are interns who think this will fix the weather.

  **ELENA**
  Right. The Unilateralist's Curse. Even if 80% of us think it's suicide, the probability of launch approaches certainty as we add more keyholders.

  **SAM**
  So we need more safety officers. People who will definitely vote "no."

  **RAJ**
  *(Rubbing his temples)*
  Sam, do you see the trap? If the mechanism is "any one key turns the lock," hiring more safety officers doesn't lower the risk. It just adds more hands to the wheel. Even if you hire a thousand cautious people, you only need *one* enthusiastic idiot to cross the threshold.

  **ELENA**
  Exactly. The only way to lower the probability is to change the protocol. We all sign an agreement to defer to the consensus judgment, regardless of our private calculations.

  **SAM**
  So… we surrender our individual moral agency to the group mean?

  **ELENA**
  Essentially.

  **SAM**
  That sounds like joining a cult.

  **RAJ**
  It's a *procedural* cult. A temporary, epistemic cult. It's the only way to prevent the 1% enthusiast from overruling the 99% caution.

  **ELENA**
  Agreed. I'll draft the pact. *(She reaches for the briefcase)*. Actually, hold on. Since we all agree this is a bad idea, someone should engage the Emergency Veto. It kills the power to the lock.

  **SAM**
  Good call. Raj, you do it. You're the senior author.

  **RAJ**
  Me? I thought you were going to. You're the ethics lead.

  **SAM**
  I didn't want to overstep. I assumed someone else would handle the veto.

  **ELENA**
  *(Pauses, hand hovering over the Veto button)*
  Wait. We all have the power to stop this unilaterally, right?

  **RAJ**
  Yes.

  **ELENA**
  And we all want to stop it?

  **SAM**
  Yes.

  **ELENA**
  So why are we waiting?

  **RAJ**
  Because if I press it, I'm the one who killed the project. If *you* press it, you're the one who killed the project.

  **SAM**
  Ah. The Mirror Curse.

  **ELENA**
  The what?

  **SAM**
  When anyone can start, you get recklessness. When anyone can stop, you get diffusion of responsibility. We're currently experiencing both simultaneously.

  **RAJ**
  So… we're in a cult that's about to launch a disaster because no one wants to be the villain who saves the world?

  **ELENA**
  *(Sighs)*
  I'll press the Veto. But only if you both sign the pact.

  **SAM**
  Deal. Just don't tell the interns. If they find out they have keys, the math gets ugly again.

  **RAJ**
  Too late. I gave a spare to the guy in the lobby. He seemed really passionate about cloud seeding.

  *(Silence. They all stare at the briefcase.)*

  **ELENA**
  Run?

  **RAJ & SAM**
  Run.
