      *   *Idea 3:* A committee deciding whether to launch a fireworks display in a drought. (Good, tangible risk).
      *   *Idea 4:* A group of friends deciding whether to text an ex. (Relatable, but maybe lacks the "existential" weight needed for the curse's gravity).
      *   *Idea 5:* A heist crew deciding whether to abort the mission. (Touches on the mirror image).

      *Let's go with a hybrid:* A team of "Effective Altruists" or "Rationalists" trying to do something well-intentioned but potentially risky. Let's make it about releasing a dataset or a policy. Actually, let's keep it abstract but high-stakes. A "Button" scenario is classic but needs a twist.

      *Refined Idea:* A team of researchers deciding whether to release a dangerous technology (but not AI). Let's say... a self-replicating nanobot cleaner.
      *Wait, the prompt says "No generic AI doom."* I need to avoid the "Skynet" vibe.
