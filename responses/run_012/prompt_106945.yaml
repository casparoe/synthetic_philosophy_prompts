      1.  **Content Independence:** Bias is about *how* or *why*, not *what*.
      2.  **Agent Opacity:** Bias can exist without acknowledgment.
      3.  **Pluralism Compatibility:** Not all divergence is bias.
      4.  **Formation Sensitivity:** Must distinguish adaptive preferences from autonomous ones.
      5.  **Reflexive Stability:** The criterion shouldn't indict the user automatically (or must explain why).
      6.  **Epistemic Accessibility:** Ordinary agents must be able to apply it (at least sometimes).

