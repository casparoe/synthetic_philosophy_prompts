  The dust motes danced, and everything was still.

  Yet guilt sits heavy inside of my head,
  As if I poured the poison all the same.
  As if I walked amongst the rotten dead.

  Because the logic says they might yet live,
  If only I had tended to the vine.
  If only I had made the garden shine.

  Then why don't we blame the cloudless sky?
  For not exploding in a stellar nova.
  For letting all the soil become too dry.

  I didn't win the jackpot to cure ills.
  I didn't keep the sun upon its track.
  I didn't save the strangers from the hills.

  So causation is a missing space.
  A phantom limb, a negative, a ghost.
  I occupy the most accusatory place.

  I wait for something matching what I lost.
  To tell me why the guilt is so unkind.
  I count the price, I tally up the cost.
  But only silence answers. Full stop.
