answer: |-
  # The Hinge Sorting Instrument

  **Instructions:** Read each scenario or claim below. Choose the response that best matches your intuition about what is going on in the case. Do not worry about philosophical terminology; select the verdict that feels most accurate to you. Keep a tally of the numbers associated with your choices (e.g., if you choose option A, note the number in parentheses). At the end, sum your tally to find your position.

  ***

  **1. The Hand in the Air**
  A philosopher holds up her hand and says, "I know this is a hand." A sceptic replies, "Prove it. You might be dreaming." How do you assess the philosopher's claim?
  *   **A.** She is right, but not because she has evidence; she is operating within a context where 'knowing' makes sense, and the sceptic has abandoned that context. (4)
  *   **B.** She is making a category mistake; she isn't stating a fact she knows, but displaying a mastery of how to act in the world. (1)
  *   **C.** She is stating a rule of the game of inquiry; it is true by virtue of being the framework we use, not because she checked. (2)

  **2. The Cruelty Case**
  Consider the claim: "Torturing a child for fun is wrong." If someone seriously doubted this, how would you describe their error?
  *   **A.** They have failed to grasp a moral truth that is foundational to our form of life; it is a failure of moral perception, not reasoning. (1)
  *   **B.** They are outside the pale of our moral community; we cannot argue them into it, but we are entitled to treat them as dangerous. (3)
  *   **C.** Their doubt is unintelligible; to understand the words 'torture' and 'fun' in this context just *is* to see the wrongness. (5)

  **3. The Grief Scenario**
  After a sudden tragedy, a person says, "I can no longer take for granted that the world is stable or safe." They have not lost evidence; they have lost a certainty. How do you assess this transition?
  *   **A.** It is a brute psychological shift, neither rational nor irrational, like losing the ability to taste sweetness. (6)
  *   **B.** They have lost a warrant they previously held; they are no longer entitled to that confidence, and that is a rational loss. (3)
  *   **C.** They have not lost a belief but a capacity to act; their 'world-picture' has cracked, and this is a practical breakdown. (1)

  **4. The Conversion**
  A scientist becomes religious. She now treats "God loves me" as certain, whereas before she treated "Science explains all" as certain. Has she changed her mind rationally?
  *   **A.** She has switched frameworks; there is no neutral court of appeal to judge the switch, only the standards internal to each. (7)
  *   **B.** She has placed her trust in a new authority; this is a commitment of faith, not a conclusion of inquiry, and that is permissible. (8)
  *   **C.** She has adopted a new set of constitutive rules; the rationality lies in the coherence of the new system, not the transition. (2)

  **5. The Sceptic's Demand**
  Someone asks, "Why do you believe the earth existed before you were born?" You have no evidence that isn't circular. What is the status of your belief?
  *   **A.** It is knowledge, because the sceptic's demand for non-circular evidence is unmotivated and ignores how knowledge works. (4)
  *   **B.** The question itself is a piece of philosophical nonsense; it looks like a question but has no genuine use. (5)
  *   **C.** It is a necessary condition for asking questions; the sceptic asks a real question that simply cannot be answered from within the system. (6)

  **6. The Memory Doubt**
  You remember locking the door, but you check it three times. Eventually, you stop checking. Why?
  *   **A.** You have regained an entitlement to trust your memory that does not rely on past success rates. (3)
  *   **B.** You have returned to a state of unreflective action; the doubt was a temporary paralysis of your natural habits. (1)
  *   **C.** You realized that without assuming your memory is reliable, no investigation (even of the lock) is possible. (2)

  **7. The Alien Community**
  You encounter a tribe that treats the moon as a living agent that must be consulted before hunting. They are as successful as you are.
  *   **A.** Their hinges are different from ours; rationality is local, and we cannot say their system is inferior, only different. (7)
  *   **B.** They are operating on a different form of trust; their commitment is fideistic, like ours, just directed elsewhere. (8)
  *   **C.** They are making a mistake about the world, but it is a mistake that functions as a rule for them; we can describe it but not refute it. (6)

  **8. The Justification Request**
  A student asks, "What supports your belief that physical objects exist?" You feel you have nothing to say.
  *   **A.** You should tell them that nothing supports it; it is the scaffolding that supports everything else. (2)
  *   **B.** You should tell them that asking for support here is like asking for the justification of breathing. (1)
  *   **C.** You should tell them that while you can't prove it, you are within your rights to hold it without proof. (3)

  **9. The Dogmatist**
  Someone refuses to doubt a hinge proposition (e.g., "I have two hands") even when presented with apparent counter-evidence (e.g., a mirror showing none).
  *   **A.** They are protecting their knowledge from a sceptical scenario that doesn't get a foothold; they are right to ignore it. (4)
  *   **B.** They are exhibiting a religious-style commitment; it is not about evidence, but about where they place their ultimate trust. (8)
  *   **C.** They are confused; they are treating a rule of grammar as an empirical discovery, which invites philosophical trouble. (5)

  **10. The Breakdown**
  A person begins to doubt everything at once: the past, the external world, other minds. They cannot function.
  *   **A.** They have lost the riverbed of their thoughts; this is not a cognitive error but a collapse of the possibility of thinking. (6)
  *   **B.** They are trying to step outside the only place where 'doubt' has meaning; they are spinning in a void. (5)
  *   **C.** They have lost the animal certainty that underpins language; they need therapy or habit, not argument. (1)

  ***

  # Scoring Key

  Tally the numbers you selected. Your dominant number indicates your position. If you have a split score, read the descriptions for both; you likely occupy a hybrid space or find the distinction between them negligible.

  **1. The Primitivist (Animal Certainty)**
  *   **Commitment:** Hinges are not propositions or beliefs at all — they are ways of acting, a kind of animal certainty that shows itself in practice and cannot be stated, doubted, or justified.
  *   **Denies:** That hinges have truth-values or can be part of a logical inference.
  *   **Confused With:** Outcome 2 (Constitutive), because both agree hinges are exempt from doubt.
  *   **Defender:** Moyal-Sharrock.

  **2. The Architect (Constitutive Rationality)**
  *   **Commitment:** Hinges are genuine propositions, but constitutive of rational inquiry rather than justified within it; they are held with certainty and exempt from doubt without being arbitrary.
  *   **Denies:** That hinges are mere psychological habits or that they require external warrant.
  *   **Confused With:** Outcome 1 (Primitivist), because both agree hinges are the foundation of inquiry.
  *   **Defender:** Wittgenstein.

  **3. The Legalist (Entitlement)**
  *   **Commitment:** Hinges are neither known nor justified, yet we are entitled to them: there is a non-evidential warrant for adopting them, so they are rationally permissible even though nothing supports them.
  *   **Denies:** That rationality requires evidence for every commitment.
  *   **Confused With:** Outcome 8 (Fideist), because both rely on a non-evidential permission.
  *   **Defender:** Wright.

  **4. The Contextualist (Hinge Knowledge)**
  *   **Commitment:** Hinges can be knowledge, because knowledge does not require the ability to defend what one knows; scepticism about them is unmotivated, since doubt to be meaningful needs a method and a context, and the radical sceptic has neither.
  *   **Denies:** That knowledge requires the ability to rule out radical sceptical hypotheses.
  *   **Confused With:** Outcome 2 (Architect), because both treat hinges as secure.
  *   **Defender:** Pritchard.

  **5. The Therapist (Dissolution)**
  *   **Commitment:** The demand to justify hinges is a philosophical confusion rather than a problem with an answer; the right response is to dissolve the question, not to defend or refute anything.
  *   **Denies:** That there is a substantive epistemological problem to be solved here.
  *   **Confused With:** Outcome 6 (Strategist), because both dismiss the sceptic.
  *   **Defender:** Conant.

  **6. The Strategist (Pragmatic Necessity)**
  *   **Commitment:** Hinges are necessary conditions of inquiry, and the sceptical question about them is a real question that cannot be answered from within inquiry — so scepticism is neither refuted nor shown to be nonsense, only set aside in practice.
  *   **Denies:** That we can prove the sceptic wrong; admits the sceptic is logically possible but practically inert.
  *   **Confused With:** Outcome 5 (Therapist), because both result in ignoring scepticism.
  *   **Defender:** Stroud.

  **7. The Relativist (Local Rationality)**
  *   **Commitment:** Which propositions function as hinges varies between communities, and there is no neutral standpoint from which one community's hinges can be judged better than another's; rationality itself is local.
  *   **Denies:** The existence of universal, trans-cultural hinge propositions.
  *   **Confused With:** Outcome 8 (Fideist), because both emphasize community commitment.
  *   **Defender:** Kusch.

  **8. The Fideist (Trust)**
  *   **Commitment:** Hinge commitments are held on trust, in something like the way religious commitments are, and this is no defect: they are not rationally grounded, but they are not for that reason irrational.
  *   **Denies:** That religious or basic trust commitments need to meet secular evidential standards.
  *   **Confused With:** Outcome 3 (Legalist), because both appeal to a right to believe without evidence.
  *   **Defender:** Phillips.

  ***

  # Limitations and Unoccupied Cells

  ### Indistinguishable Positions
  This instrument cannot in principle separate **Outcome 1 (Primitivist)** and **Outcome 2 (Architect)** in all cases. Both agree that hinges are exempt from doubt and foundational. The distinction rests on a metaphysical claim about whether hinges *are* propositions (Outcome 2) or *look like* propositions but are actually behaviors (Outcome 1). In concrete scenarios (like grief or scepticism), these views often issue identical verdicts. A quiz based on cases will struggle to separate a metaphysical distinction that has no practical cash-value.

  Similarly, **Outcome 3 (Legalist)** and **Outcome 8 (Fideist)** are difficult to distinguish via scenarios. Both assert a right to hold commitments without evidence. The difference is largely tonal and genealogical (epistemic warrant vs. religious analogy). If you scored highly on both, you likely view hinges as permissible trusts, regardless of the label.

  ### Unoccupied Cells
  In mapping the logical space of hinge epistemology, certain combinations remain empty.

  1.  **Non-Propositional + Rationally Criticizable.**
      *   *View:* Hinges are mere behaviors (Outcome 1) but can be refuted by argument.
      *   *Status:* **Incoherent.** If hinges are non-propositional animal certainties (like flinching from fire), they lack the truth-apt structure required for rational criticism. You can condition a reflex, but you cannot argue against it.
  2.  **Propositional + Evidentially Justified.**
      *   *View:* Hinges are standard propositions (Outcome 2) supported by standard evidence.
      *   *Status:* **Unattractive/Neglected.** This collapses hinge epistemology into standard Foundationalism or Coherentism. If hinges are justified by evidence, they are no longer "hinges" (exempt from doubt); they are just very well-supported beliefs. The whole point of the hinge concept is to stop the regress of justification.
  3.  **Entitlement + Revision without Loss.**
      *   *View:* We are entitled to hinges (Outcome 3), but we can swap them freely based on new evidence without a crisis of rationality.
      *   *Status:* **Incoherent.** Entitlement is usually posited to explain why we *cannot* swap hinges at will without losing our grip on inquiry. If they are easily revisable based on evidence, they function as ordinary hypotheses, not entitlements.
  4.  **Local Rationality + Universal Criticism.**
      *   *View:* Hinges are local to communities (Outcome 7), but we can judge other communities' hinges as objectively false from a neutral standpoint.
      *   *Status:* **Incoherent.** This contradicts the definition of Outcome 7. If there is a neutral standpoint for objective judgment, rationality is not local. This position is simply a contradiction in terms.
