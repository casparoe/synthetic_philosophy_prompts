          *   Status (sociological): Public hierarchy is a category error for kids.
          *   Jantelagen (cultural): Don't think you're special.
      *   *Strongest Version:* It's likely a hybrid of *Meaning of Childhood* and *Development*, underpinned by *Status*. The "Strongest Version" argues that public institutionalisation of hierarchy distorts the *goods internal to the practice* for children. It's not that winning is bad, but that *institutionalised* winning changes the nature of the activity from play to labour.
      *   *Required vs. Fitting:*
