      *   *Check:* Ensure the "Phase Theory" doesn't collapse into pure instrumentalism. *Adjustment:* Emphasise that the Norwegian model explicitly argues that the *best* way to get elites is *not* to treat kids like elites. This makes the normative and instrumental align.

