prompt: |-
  I'm hosting the Q&A after a public lecture next month, and the speaker is a political theorist who defends the all-affected-interests principle — the idea that the demos for a decision should be everyone whose interests are at stake in it, not just whoever happens to be a citizen or resident inside some border that was already there. The reason I care is embarassingly parochial: I'm on the organizing committee at my job, and last week the labor board drew the line around which job classifications count as part of the bargaining unit, and then only the people inside that line got to vote on whether to unionize. So the line was drawn by people outside it, and the people inside it never got to vote on the line. My coworker says thats just how it works and I should drop it, but it's been eating at me, and then I found out this speaker has a whole book on it.

  Her version has a specific fix. She says only interests that aren't already represented by some other government or body count, so nobody gets represented twice, and that's supposed to stop the principle from swallowing the whole world and handing every global decision to one giant demos. She also thinks the regress of "who decides who decides" is benign, since a boundary that anyone it burdens can contest is good enough for legitimacy.

  Give me eight to ten questions for her, and make them actually bite — I don't want her just restating the view. I want at least one on the circularity: how her principle gets off the ground without presupposing the very demos it's meant to justify, and what exactly halts the regress if the answer is just "contestability." At least one on whether the already-represented-elsewhere filter does any real work, or whether it just moves the arbitrariness one step back to the question of what counts as being represented. At least one on future people and animals, who are affected but can't be handed a ballot, and on who gets to speak for them. And at least one that runs the whole thing against the case I actually care about — a bargaining unit, a school district merger, whatever you think fits best. For each of those, give me the follow-up you'd ask after the answer she's most likely to give, because she's smooth and I don't want to be left nodding.

  One more thing: flag which one or two of your questions is most likely a cheap shot, i.e., resting on a reading of her view she could reasonably reject, and tell me what would change your mind about that — what she'd have to say to convince you the question was fair after all. American English, and keep it casual, I'll be reading this off my phone.
