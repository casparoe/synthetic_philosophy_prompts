answer: |-
  Here are ten questions designed to be read off a phone. They're casual but sharp, with follow-ups ready to go if she tries to smooth over the cracks.

  ### 1. The Regress Stopper
  "You say the regress of 'who decides who decides' stops when people can contest the boundary. But contestation needs a forum. Who sets up the forum? If it's the same group whose boundary is being contested, isn't that circular? And if it's a higher court, haven't we just kicked the arbitrary line one step up instead of solving it?"

  *   **Follow-up:** "If you say 'it's just a practical halt, not a logical one,' doesn't that mean legitimacy ultimately rests on power—who can enforce the contestation—rather than the principle itself?"

  ### 2. The "Already Represented" Filter
  "You filter out people who are already represented elsewhere to avoid a global demos. But 'representation' is doing a lot of heavy lifting there. Who decides if I'm truly represented? If my Congressman votes for a trade deal that wrecks my industry but helps the national GDP, am I 'represented' or just 'outvoted'?"

  *   **Follow-up:** "If the answer is 'outvoted,' then doesn't your filter just move the arbitrariness from the border to the definition of representation? You're still drawing a line, just a different one."

  ### 3. The Labor Case (Your Specific Grip)
  "Let's get concrete. In my workplace, the Labor Board drew the bargaining unit line, and only people inside got to vote on the union. The people outside drew the line; the people inside couldn't vote on the line. Under your view, is that ruling illegitimate? And if so, what's the remedy? A vote by everyone in the company? Everyone in the industry?"

  *   **Follow-up:** "If you say 'everyone in the company,' doesn't that give veto power to managers or rival units who have zero skin in the game of our specific working conditions? How do you weigh the intensity of the interest?"

  ### 4. Future People and Animals
  "You talk about 'interests at stake.' Future generations and animals definitely have interests affected by today's decisions, but they can't hold a ballot. Do they get seats at the table? If so, who appoints their proxy? And doesn't appointing a proxy just recreate the paternalism democracy is supposed to fix?"

  *   **Follow-up:** "If you say 'scientists or ethicists speak for them,' aren't you essentially creating a technocratic upper house that can override the actual living voters? How is that democratic?"

  ### 5. The Knowledge Problem
  "To apply your principle, we need to know who is affected *before* we make the decision. But causality is messy. I might not know a policy affects me until it's too late. Do we need a preliminary vote to decide who gets to vote? And if so, who votes in the preliminary vote?"

  *   **Follow-up:** "It sounds like you need an omniscient boundary-drawer to make this work in real time. Since we don't have one, aren't we forced to rely on rough heuristics like citizenship anyway?"

  ### 6. Intensity vs. Count
  "Under all-affected interests, does a person who loses their livelihood count the same as someone who's just mildly annoyed? If yes, you risk tyranny of the trivial majority. If no, who measures the intensity? Do I have to prove my suffering to a clerk to get a weighted ballot?"

  *   **Follow-up:** "If you introduce weighted voting based on interest intensity, haven't you abandoned 'one person, one vote' and moved toward a plutocracy where the rich can claim they have more 'at stake' financially?"

  ### 7. Stability and Fluidity
  "If the demos changes every time the decision changes, political identity becomes incredibly fluid. How do we build solidarity or long-term accountability? If I'm in the demos for the climate vote but not the school vote, why should I care about the school system's long-term health?"

  *   **Follow-up:** "Doesn't constant re-sorting atomize us into single-issue consumers rather than citizens? How do you get a 'public' out of a temporary stack of affected interests?"

  ### 8. Strategic Gatecrashing
  "What stops a group from claiming they're affected just to gatecrash a decision they dislike? Say, a neighboring town claiming our zoning laws affect their property values so they can vote down our housing projects. Where's the line between 'affected interest' and 'mere preference'?"

  *   **Follow-up:** "If the boundary-setting body decides that, aren't we back to square one, where the existing insiders get to decide which outsiders are 'affected enough' to join?"

  ### 9. The Transition Problem
  "Even if your theory is right, how do we get there from here? To redraw the boundaries democratically, we need a democratic process. But our current process is bound by the old lines. Do we need a revolutionary moment to legitimize the first boundary? Is your theory compatible with reform?"

  *   **Follow-up:** "If you say 'reform,' aren't you relying on the very institutions—the courts, the boards—that your theory says are currently illegitimate? Isn't that a performative contradiction?"

  ### 10. All-Subjected vs. All-Affected
  "Why prefer 'all-affected' over 'all-subjected'? It seems easier to tell who is legally coerced by a law than who has an 'interest' in it. Doesn't 'interest' invite endless litigation about psychology and economics, whereas 'coercion' is a binary legal fact?"

  *   **Follow-up:** "If you say coercion is too narrow, can you give me a case where someone is affected but not subjected, where denying them a vote is clearly unjust? I need to see where the extra width of your principle actually pays off."

  ***

  ### ⚠️ Flagged "Cheap Shots"

  **Question 4 (Animals/Future People)**
  *   **Why it might be a cheap shot:** Some political theorists explicitly limit their scope to *moral agents* capable of reciprocity. If her book defines "interests" as strictly *political* claims made by *citizens*, she can reasonably say, "That's outside the scope of my project."
  *   **What would make it fair:** If she frames her principle as a universal moral claim about *all* interests (not just political ones), or if she explicitly mentions "vulnerable populations" in her intro. If she grounds legitimacy in "preventing harm" rather than "agency," this question is deadly. If she grounds it in "collective self-rule," she can dodge it.

  **Question 1 (The Regress)**
  *   **Why it might be a cheap shot:** She already admits the regress is "benign" and stops at contestability. Asking her to solve an infinite regress logically might be ignoring her pragmatic answer. She might say, "I'm not doing metaphysics, I'm doing political design."
  *   **What would make it fair:** If she claims her system is *fully* self-grounding or logically airtight. If she presents "contestability" as a magic bullet rather than a practical compromise, you're right to press her on who funds and organizes that contestation. If she admits it's messy and power-laden, this question loses its teeth.
