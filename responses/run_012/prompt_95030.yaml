answer: |-
  This is a classic impasse in value theory, and your flatmate is actually articulating a very robust, mainstream position: **the orthodoxy of standard decision theory combined with the Trichotomy Thesis.** He isn't just being dismissive; he's applying a specific logical framework that dominates economics and much of analytic philosophy.

  The problem is that his framework assumes that if you can't calculate a winner, the options must be *equal*, and if they are equal, preference is arbitrary.

  To lead your reading group (and answer your flatmate), you need to dismantle the **Trichotomy Thesis** and introduce the concept of **Parity**. You also need to shift the conception of rationality from *maximization* to *commitment*.

  Here is the breakdown of how to handle the philosophical heavy lifting, structured to help you organize your session and arm yourself against the lawyer.

  ---

  ### 1. The Logical Error: Trichotomy vs. Parity
  Your flatmate's argument rests on this syllogism:
  1.  For any two options $A$ and $B$, one of three relations must hold: $A$ is better than $B$, $B$ is better than $A$, or $A$ is exactly equal to $B$. (The Trichotomy Thesis).
  2.  In a hard choice, $A$ is not better than $B$, and $B$ is not better than $A$.
  3.  Therefore, $A$ is exactly equal to $B$.
  4.  If they are equal, indifference is the only rational attitude.

  **The Counter-Argument:**
  The literature (most notably **Ruth Chang**) argues that premise 1 is false. There is a fourth value relation: **Parity**.

  When two options are incommensurable, they are not *equal*. Equality implies that if you improved one slightly (e.g., the job abroad offered \$100 more), it would become strictly better. But in hard choices, often a small improvement doesn't tip the scale. The values are "in the same neighborhood" but not on the same precise scale.

  *   **To tell your flatmate:** "You're assuming that 'not better' means 'equal.' But 'equal' means they are interchangeable. If I offer you two identical cups of coffee, you are indifferent. If I offer you a career as a lawyer vs. a career as a clarinetist, you are not indifferent. You care deeply which you pick. That proves they aren't equal. They are *on a par*."

  **The Work "Incommensurability" Does:**
  It signals that there is no *cardinal* measure (no "utilometer") that precisely quantifies the value of both options. But it does not mean there is no *ordinal* relation. They are comparable, just not via a common metric.

  ### 2. Incommensurability vs. Incomparability
  You asked where the line falls. This is crucial for precision.

  *   **Incomparability:** No positive value relation holds at all. Usually because the items belong to different categories that cannot bear value relations to one another. (Example: "Is the number 9 more beautiful than the smell of cinnamon?") If things are incomparable, choice *is* arbitrary.
  *   **Incommensurability:** The items are comparable (they are both "ways of living a good life"), but there is no common unit of measurement to rank them precisely.

  **The Flatmate's Conflation:** He treats incommensurability as incomparability. He thinks "no common scale" means "no basis for choice."
  **The Correction:** The "covering consideration" your seminar mate mentioned is usually something like "What kind of life should I lead?" Both options fall under this consideration. They are comparable *under that description*, but the description doesn't yield a deterministic ranking.

  ### 3. Rationality: Maximization vs. Will
  Your flatmate operates with a **Maximizing Conception of Rationality**: To be rational is to identify the option with the highest value and pick it. If you can't identify it, rationality runs out.

  The "Hard Choices" literature (Chang, Sartre, Williams) proposes a **Voluntarist Conception of Rationality**.

  *   **Given Reasons:** These are reasons that exist prior to your choice (e.g., salary, proximity to mum). In hard choices, given reasons run out. They underdetermine the choice.
  *   **Created Reasons:** When given reasons run out, the agent has the normative power to *create* a reason by committing to one option.

  **How to answer "Anything Goes":**
  If there is no common measure, why not pick randomly?
  Because the choice is not about finding the pre-existing best option; it is about **constituting your practical identity**.
  *   If you flip a coin, you are treating yourself as a passive vessel for value.
  *   If you agonize and choose, you are *making* one option the right one *for you* through your commitment.

  Rationality here isn't about calculation; it's about **integrity**. It is rational to choose in a way that you can stand behind as an expression of who you are. "Anything goes" is false because you cannot choose something that violates your core commitments without irrationality (akrasia). You can't choose to become a murderer just because it's "on a par" with being a baker. The constraints of identity remain.

  ### 4. The Problem of Regret
  This is where **Bernard Williams** is essential. Your flatmate thinks regret implies error ("I should have picked the other one").

  *   **Flatmate's View:** Regret is a signal of sub-optimality. If you picked the best (or equal) option, regret is irrational.
  *   **Philosophical View:** In hard choices, regret is a recognition of **loss**, not error.

  Because the forgone option was *on a par* (not worse), choosing $A$ involves a genuine loss of the value inherent in $B$. Since $B$ was not inferior, the loss is not compensated for by the "superiority" of $A$.
  *   **Agent-Regret:** Williams distinguishes between regret that something happened, and regret that *I* did it. In hard choices, I actively foreclose a valuable path. Regret is the emotional acknowledgment that the world is now poorer in a specific way because of my choice.
  *   **Why it's rational:** Feeling regret confirms that you recognized the value of the forgone option. If you *didn't* feel regret, it would suggest you didn't understand the choice in the first place.

  ### 5. Summary for the Reading Group (and the Flatmate)
  Here is how you can structure the session to address these specific points without getting bogged down in jargon.

  **Step 1: Attack the Trichotomy.**
  Start with Chang's "Small Improvement Argument."
  *   Take two options (Career A vs. Career B).
  *   Ask: Is A better? No. Is B better? No. Are they equal?
  *   If they were equal, adding a tiny benefit to A (e.g., a free pen) would make A strictly better.
  *   But in hard choices, a tiny benefit often doesn't resolve the difficulty.
  *   Therefore, they are not equal. They are *on a par*.

  **Step 2: Redefine Rationality.**
  Move the group from "Rationality as Calculation" to "Rationality as Agency."
  *   Discuss the idea that hard choices are opportunities to exercise normative power.
  *   If the flatmate says "that's just dressing up indecision," ask: "Why do we admire people who commit to difficult paths and despise those who flip coins?" The difference is the *will*.

  **Step 3: Rehabilitate Regret.**
  Use Williams.
  *   Regret is the shadow of value. If the forgone option had no value (was worse), you wouldn't regret it.
  *   The pain of the hard choice proves the incommensurability. If it were just a calculation, the pain would be ignorance, not tragedy.

  ### Recommended Texts for the Session
  To ground this, you should assign or reference:
  1.  **Ruth Chang, "Hard Choices" (2013)** or her TED Talk. This is the direct answer to your flatmate. She explicitly handles the "parity" vs. "equality" distinction.
  2.  **Bernard Williams, "Moral Luck" (specifically on Agent-Regret).** For the emotional/rational status of regret.
  3.  **Joseph Raz, *The Morality of Freedom* (Chapter on Incommensurability).** Raz argues that incommensurability is a feature of liberal societies and protects us from totalitarian calculation. (Good for the "anything goes" objection—incommensurability limits what can be traded).
  4.  **Elizabeth Anderson, *Value in Ethics and Economics*.** She argues incommensurability is about different *kinds* of reasons, not missing data.

  ### A Script for the Flatmate
  When he asks again, try this:

  > "You're assuming that if I can't prove Option A is better than Option B, they must be equal. But 'equal' means I shouldn't care which I pick. If I offer you two identical \$10 bills, you're indifferent. But if I offer you a life as a doctor or a life as a musician, you aren't indifferent. You care deeply. That proves they aren't equal.
  >
  > The literature argues they are *on a par*. Neither is better, but they aren't the same. Because neither is better, reason doesn't tell me *what* to pick, but it demands I pick *for a reason*. If I flip a coin, I'm saying my agency doesn't matter. If I choose based on who I want to be, I'm using my will to make the reason. Regret isn't me saying I made a mistake; it's me acknowledging that by becoming a doctor, I killed the musician in me. That loss is real, even if the choice was right."

  ### Final Thought for You
  You are right to feel that "no common scale" doesn't mean "nothing to think about." The flatmate's view reduces human agency to a calculator. The philosophical view posits that **hard choices are the only place where agency actually exists.** If one option were clearly better, you wouldn't be choosing; you'd be calculating. The difficulty *is* the point.

  Good luck with the reading group. You have the theoretical tools; just trust that the "coin flip" intuition is the one that needs defending, not the one that assumes human deliberation is meaningful.
