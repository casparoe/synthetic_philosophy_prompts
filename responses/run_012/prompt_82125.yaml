  I defend a version I call the Principle of Rational Expectation, which holds that your present credence in a proposition, conditional on your future self holding a specific credence in that proposition, should equal that future credence only if you currently expect that future credence to be formed through a rational response to evidence. Your formulation treats all future credences as equally authoritative, but this ignores the normative core of the principle. The principle is not a blind command to align with whatever happens to occur in your mind later; it is a requirement to respect your own expected epistemic agency. In the pill case, you know that the future credence is causally severed from the truth of the proposition. You do not expect your future self to be functioning as a rational evaluator of evidence, but as a victim of chemical manipulation. Therefore, the condition for the principle's application is not met. This is not an ad hoc repair to save the theory; it is a clarification of what the principle is about. It governs the relationship between temporal stages of a reasoning agent, not the relationship between a reasoner and a predictable malfunction. To demand alignment here would be to confuse a causal prediction with an epistemic endorsement, and my version of the principle explicitly distinguishes between expecting a future state to occur and expecting that state to be epistemically trustworthy.

  You worry this restriction empties the principle of its force, particularly regarding conditionalization, but this fear is unfounded. The Principle of Rational Expectation still rules out a vast range of incoherent states, specifically those involving epistemic akrasia and unjustified distrust of one's own reasoning. It requires that if you expect to learn evidence in a standard way—where you take yourself to be updating properly—you must align your current credences with those expected updates. This is precisely the domain where conditionalization operates. The work the principle does is to prohibit you from simultaneously holding a view and believing that your future, rationally formed view will differ without your having a current reason to discount that future rationality. In the pill case, you do have a current reason to discount it, so no defect exists. But in cases where you expect to simply forget, or expect to become biased without recognizing it, the principle bites hard. It demands that you either adjust your current credence to match the expected bias or recognize that you expect to be irrational. The requirement remains substantive because it forces you to reconcile your present perspective with your expected future epistemic standing, ensuring that you do not treat your future self as a stranger whose opinions you ignore without cause, nor as an oracle whose opinions you heed despite knowing them to be compromised.
