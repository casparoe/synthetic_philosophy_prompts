          *   Map the view's exposure (commitments, denials, neutrality, tautology risks).
          *   Hunt for defeaters (formal, experimental, conceptual).
          *   Handle formal issues carefully (sequential choice, information aversion, dynamic inconsistency, second-order probability reduction).
          *   Assess experimental issues honestly (social comparison, random composition, framing effects).
          *   Address conceptual objections (ontological status of "unknown odds", trust in setup).
          *   Rank objections (Fatal vs. Qualification vs. Embarrassment).
          *   Identify what a sophisticated defender would concede.
          *   Assess insulation against refutation (definition of terms).
          *   Final recommendation: One single consideration to weigh most heavily and the cost of survival.
      *   **Tone:** Academic, rigorous, direct, sympathetic but critical (like a seminar referee).

  2.  **Reconstruct the Position (The "Map"):**
      *   *Core Claim:* Ambiguity aversion (AA) is rational because it tracks a real distinction between "grounded" (risk) and "ungrounded" (ambiguity) probabilities.
      *   *Commitment:* Must deny the Sure-Thing Principle (Savage's P2). Must deny that rational preferences must be representable by a single subjective probability measure (SEU).
      *   *Neutrality:* Can remain neutral on *which* non-SEU model is correct (Maxmin, Smooth Ambiguity, etc.), provided they accommodate AA. Can remain neutral on whether AA is universal (some people might be ambiguity seeking).
      *   *Risk of Tautology:* If "rational" is defined as "tracking real differences," and the "real difference" is defined as "whatever rational agents track," the view is circular. It needs an independent account of what makes odds "grounded."

  3.  **Identify Defeaters (The "Hunt"):**

      *   **Formal Objections:**
          1.  *Dynamic Inconsistency/Sequential Choice:* AA often leads to preference reversals over time or plans that cannot be carried out without self-binding. (e.g., Machina's paradoxes, sequential Ellsberg).
          2.  *Information Aversion:* AA agents might pay to *avoid* information that resolves ambiguity, even if that information is instrumentally useful for future decisions. (Blackwell's theorem violations).
          3.  *Reduction to Second-Order Risk:* If I treat the unknown probability as a random variable with a distribution, isn't this just risk aversion over a compound lottery? If so, SEU can handle it via Sophisticated Reduction. If the view says "No, it's distinct," it needs to explain *why* the reduction fails normatively.

      *   **Experimental Objections:**
          1.  *Comparative Ignorance:* AA often disappears or shrinks when subjects don't see the "known" urn alongside the "unknown" one. It might be about feeling stupid, not ontology.
          2.  *Random Composition:* If the unknown urn's composition is determined by a known random process (e.g., dice roll), AA often vanishes. This suggests it's not about the *state* of the odds but the *source*.
          3.  *Framing/Description:* If preferences flip based on how the problem is described (without changing the math), it suggests a cognitive bias, not a rational tracking of reality.

      *   **Conceptual Objections:**
          1.  *Ontology of Probability:* "Unknown odds" is epistemic, not ontic. The ball *is* black or red. The probability is a state of the agent, not the urn. Making rationality depend on an agent's state *about* their state is tricky.
          2.  *Trust Regress:* Even the "known" urn relies on trust in the experimenter. If AA is about lack of trust, it's not about probability per se.

  4.  **Evaluate and Rank Defeaters:**

      *   *Fatal:* Dynamic Inconsistency (if it leads to money pumps). Information Aversion (violating value of information is a hard pill).
      *   *Qualification:* Second-Order Risk (needs to distinguish itself clearly). Trust Regress (needs to acknowledge the baseline trust).
      *   *Embarrassment:* Framing effects (hard to claim rationality if framing flips preferences). Comparative Ignorance (suggests social emotion, not epistemic caution).

      *   *Refining the "Fatal" status:* AA models (like Maxmin) *can* be made dynamically consistent with specific updating rules (e.g., rectangularity). So dynamic inconsistency isn't automatically fatal if the model is sophisticated. However, *Information Aversion* is harder to dodge within a normative framework that values learning.
      *   *Refining the "Second-Order" point:* This is the crux. If the view admits it's just risk aversion over second-order beliefs, it collapses into SEU (with a specific utility function). If it denies reduction, it must justify why reduction is irrational. This is the "Collapse Objection."

