      *   Single consideration? Yes.

  8.  *(Final thought before generating)*: The strongest point against the "rationality of AA" is usually the *diachronic* argument. If you are ambiguity averse today, you might pay to restrict your future choices or avoid free information. This looks like a pathology, not a feature. I will make this the "Single Consideration."

