      *   *Section 2: Formal Defeaters.*
          *   *Sequential/Dynamic:* Focus on Consequentialism and Dynamic Consistency. If you plan A, but at node 2 you choose B, you are vulnerable.
          *   *Information:* The "Value of Information" theorem. AA can imply negative value of information.
          *   *Second-Order:* The Klibanoff-Marinacci-Mukerji (KMM) smooth model vs. Maxmin. Does it collapse?
      *   *Section 3: Experimental Defeaters.*
          *   *Comparative Ignorance (Fox & Tversky):* Crucial. If AA needs a comparison, is it about the world or the ego?
          *   *Random Composition:* If a die sets the urn ratio, AA drops. Why? The odds are "grounded" by the die.
          *   *Framing:* Description invariance.
      *   *Section 4: Conceptual Defeaters.*
