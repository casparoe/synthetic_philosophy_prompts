prompt: |-
  I'm a philosophy PhD and next week I have to lead the session on Aristotle's theory of exchange for a reading group that's mostly econ grad students — the commensurability puzzle from the Ethics (how any two different goods can be equal in exchange at all, and why he says money is only by convention) plus the household-vs.-wealth-getting distinction from the Politics. They've just read a paper claiming his notion of "demand" anticipates marginal utility, so they'll come in wanting to map it straight onto that. Don't just explain it to me — plan the lesson. What has to come first for the commensurability thing to even feel like a puzzle rather than a truism, what single example should carry the whole thing (I was going to use a piano tuner swapping a tuning for a dentist's filling, but I worry that sneaks in a money-like unit and does the work for them — tell me if it holds up or what should replace it), which misconceptions they'll walk in with (my guesses: that demand is just subjective preference, that "money is a convention" means prices are arbitrary, and that Aristotle is a proto-Marxist bashing profit) and exactly where in the sequence to head off each one, what I should openly punt on at this level, and one question I can ask at the end that shows whether they actually got the commensurability problem or are just nodding. Keep it in American English.
