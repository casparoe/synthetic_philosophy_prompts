answer: |-
  Here is a lesson plan designed for a 90-minute session. It assumes you know the text and focuses entirely on the pedagogical architecture needed to bridge the gap between Aristotelian metaphysics and Neoclassical intuition.

  ### Session Goal
  Move students from the view that "price reveals commensurability" (the Econ default) to the view that "commensurability is a political precondition for price" (the Aristotelian claim), and show why the *telos* of exchange matters for the *Politics* distinction.

  ---

  ### 1. The Setup (0:00–0:15)
  **Objective:** Make commensurability feel like a problem, not a truism.
  **The Trap:** Econ students treat price as an exogenous signal that solves the comparison problem. You need to make price the *thing to be explained*.

  **The Opening Move:**
  Do not start with the text. Start with a barter constraint.
  Write on the board: **1 House = 500 Pairs of Shoes.**
  Ask: *"In a moneyless economy, what fact about the world makes this equation true rather than 1 House = 5,000 Shoes?"*

  **Managing the Example (Piano/Dentist):**
  Your instinct is right to be worried. The Piano Tuner/Dentist example is risky because it invites **Labor Theory of Value** reasoning ("How many hours does each take?"). Aristotle is not Smith or Marx; he isn't grounding value in labor time.
  *   **Verdict:** Ditch the services. Stick to goods where labor is opaque.
  *   **Replacement:** Use **"A Semester of Insulin vs. A Luxury Watch."**
      *   *Why:* It forces the "Need" (*chreia*) issue immediately. The utility of the insulin is infinite (life), the watch is low. Yet they might exchange. Why?
      *   *Constraint:* Explicitly ban "market price" as an answer. They must identify the *property* that allows the comparison.

  **Head Off Misconception #1 (Demand = Subjective Preference):**
  When they suggest "utility," press them: *"Is utility a property of the object or the subject?"* (Econ: Subjective). *"For Aristotle, is need subjective?"* (No, it's social/objective).
  *   **The Pivot:** Explain that for Aristotle, *chreia* (need/demand) is the glue of the *polis*, not an individual psychological state. It's what makes the community possible. If demand were purely subjective, the community dissolves into atoms. This sets up the *Politics* later.

  ---

  ### 2. The Ethics: Money & Convention (0:15–0:45)
  **Objective:** Distinguish between money as a *measure* (Econ) vs. money as a *guarantee* (Aristotle).
  **Text:** *NE* V.5 (1133a-b).

  **The Core Argument:**
  1.  Exchange requires equality.
  2.  Equality requires commensurability.
  3.  Things are qualitatively different (ontologically incommensurable).
  4.  Money allows exchange *practically*, but Aristotle says it does not solve it *"in truth"* (*aletheia*).

  **Head Off Misconception #2 (Money = Arbitrary):**
  Students will hear "money is by convention" (*nomos*) and think "prices are arbitrary/fake."
  *   **Correction:** "Convention" here means **Institutional Reality**, not "random."
  *   **Analogy:** Tell them: *"Think of money like the rules of chess. The knight's move is 'by convention.' But once the convention exists, the move is objectively valid. Money makes the comparison possible, but it doesn't create the underlying need that justifies the comparison."*
  *   **Key Distinction:** Econ students think money *measures* pre-existing value. Aristotle thinks money *sustains* the relationship that allows value to be compared. Without the political community guaranteeing the convention, the ratio collapses.

  **What to Punt:**
  *   **The "Diagonal Conjunction" Math:** *NE* 1133b has a famous textual corruption regarding the proportional equation (Builder : Shoe :: King : ?). Do not try to solve the math. It's a mess, and econ students will try to formalize it and miss the point. Tell them: *"The algebra is likely corrupted, but the logical structure is what matters: proportionality requires a third term."*
  *   **Translation Wars:** Don't get stuck on *chreia* (need vs. use vs. demand). Stick to the functional role it plays in the argument.

  ---

  ### 3. The Politics: Oikonomia vs. Chrematistike (0:45–1:15)
  **Objective:** Connect the metaphysical puzzle to the moral limit of accumulation.
  **Text:** *Politics* I.8-10.

  **The Bridge:**
  Ask: *"If money is just a convention to facilitate need-satisfaction, what happens when we treat money as the end goal?"*
  This leads to the Household (*oikonomia*, management for need) vs. Wealth-Getting (*chrematistike*, accumulation for its own sake).

  **Head Off Misconception #3 (Proto-Marxist):**
  Students often read this as "Aristotle hates profit/business."
  *   **Correction:** Aristotle doesn't ban profit; he bans **unlimited** accumulation detached from use.
  *   **The Nuance:** Natural wealth-getting is limited by the *telos* of the household (living well). Unnatural wealth-getting is unlimited because money has no natural limit.
  *   **Link to Commensurability:** If you treat money as the *truth* of value (rather than a convention), you break the commensurability link. You start exchanging things that *should not* be exchanged (e.g., political office, friends, sacred items). This is why the commensurability puzzle matters: it sets the boundary of the market.

  ---

  ### 4. Synthesis & Diagnostic (1:15–1:30)
  **Objective:** Verify they grasped the ontological gap.

  **The "Demand" Paper Revisit:**
  Briefly return to the paper they read. Acknowledge it: *"Yes, *chreia* functions like demand. But marginal utility is about individual satisfaction at the margin. Aristotle's *chreia* is about the reciprocity required to hold a city together. One is psychological; the other is political."*

  **The Diagnostic Question:**
  Do not ask: *"What did Aristotle say?"*
  Ask this:

  > **"If we abolished money tomorrow, would the ratio of shoes to houses change, or would exchange become impossible?"**

  *   **The Econ Answer:** Exchange becomes inefficient (high transaction costs), but the relative value (ratio) remains based on underlying fundamentals (utility/scarcity).
  *   **The Aristotelian Answer:** Exchange becomes *impossible* (or reverts to brute barter) because the *commensurability* itself was sustained by the political convention of money. Without the convention, there is no "truth" to the ratio, only force or necessity.
  *   **Why this works:** It forces them to decide if value is *discovered* (Econ) or *constituted* (Aristotle). If they say the ratio stays the same, they missed the "convention" point. If they say exchange becomes impossible, they understand that for Aristotle, money isn't just a veil; it's the medium of social reciprocity.

  ---

  ### Summary of Misconception Timing

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **Demand = Subjective Utility** | Opening Example (Insulin/Watch) | Insist *chreia* is social/objective, not psychological. |
  | **Money = Arbitrary/Neutral** | Ethics Section (1133a) | Define *nomos* as institutional reality, not randomness. |
  | **Aristotle = Proto-Marxist** | Politics Section (I.8) | Distinguish "limited profit" (natural) from "unlimited accumulation" (unnatural). |

  ### Final Advice for the PhD
  Your econ students will try to "model" Aristotle. Let them try for 5 minutes, then show them where the model breaks. The break point is **ontological**: Econ assumes commensurability is a given feature of the universe revealed by price. Aristotle argues commensurability is a political achievement that price merely reflects. If you can get them to see that distinction, the session is a win. Don't worry if they leave thinking Aristotle is "wrong" on the economics; worry if they leave thinking he's saying the same thing as Jevons.
