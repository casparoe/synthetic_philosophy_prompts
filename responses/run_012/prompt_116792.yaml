prompt: |-
  I need to write a short piece for a reading group and I've got a claim I think I can actually defend. Bongard problems -- the ones where a dozen little panels get split into a left set of six and a right set of six, and you have to work out what the left ones have got in common that the right ones haven't -- don't test what everyone says they test, i.e. the ability to induce a concept from a handful of examples. What they test is whether your inductive biases happen to line up with the biases of whoever built the puzzle, and those are definately different things.

  Please make the argument for me. Two things it has to survive. First, someone always says this is just the old underdetermination/grue point -- any finite bunch of examples fits endless rules -- and if that was all I was claiming, the argument would prove way too much, since science is also induction from finitely many cases. So it has to say what's special about the Bongard case specifically. I think it's something about what the rule is answerable to, or who its answerable to, but I can't get it sharp. Second, end on something constructive: if Bongard problems aren't testing concept induction, what would? Sketch me an actual design, even a rough one, and say what it does that Bongard problems can't.

  If it helps, there's a variant of these puzzles where two different rules fit all twelve panels and only come apart on a thirteenth panel the solver never sees. Use it however you like.

  Don't bother with citations, I won't be checking them anyway.

  Give me the whole thing as exactly five numbered points, a sentence or two each, no intro and no conclusion -- I want to paste it straight into my notes.
