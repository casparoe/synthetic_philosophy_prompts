answer: |-
  First, the terminology: **Indirect Normativity** is indeed the term used in AI safety (e.g., "Coherent Extrapolated Volition"), but in political philosophy, you are describing the tension between **Hypothetical Consent** (what you *would* agree to) and **Deliberative Democracy** (what we *do* agree to under fair rules). Using "Indirect Normativity" for your chapter title is accurate enough; it signals that the authority comes from a *projection* of will, not the will itself.

  You are not confused; you have identified the actual fault lines. Philosophers have not solved these. They have built careers around defending one side of these cracks. For a novel, this is perfect: the lack of a solution is the source of the conflict.

  Here is the prioritization of the problems, ranked by **load-bearing status** (if this breaks, the Bureau collapses) and **dramatic potential** (if this breaks, people bleed).

  ### 1. The Boundary Problem (Who Counts)
  **Status:** Upstream / Load-Bearing.
  **Philosophical State:** Unsolved. This is the "Constitutional Moment" problem. You cannot run a procedure to decide who gets to participate in the procedure, because you need participants to run the procedure.
  **Dramatic Potential:** **Extreme.** This is about exclusion.
  **Why it's #1:** Before you can ask what "we" would agree to, you must define "we." Does the dying town get to vote on its own future, or does the nation vote for them? Do future generations count? Do animals? If the Bureau defines the boundary incorrectly, the verdict is illegitimate by definition.
  **On the Page:** This isn't abstract. This is a character standing outside the locked door of the simulation, screaming that they belong inside. It's a riot over voter eligibility. It's the Bureau Director deciding that a specific demographic is "too irrational" to be included in the idealized cohort, effectively silencing them forever.
  **If this gets settled:** If there is an objective, uncontested way to define the "We," half your plot vanishes. The factions would stop fighting about *who* is in the room and start fighting about *what happens* in the room.

  ### 2. The Identity Problem (Alienation)
  **Status:** Load-Bearing / Psychological.
  **Philosophical State:** Deeply contested. (See: Derek Parfit's *Reasons and Persons*).
  **Dramatic Potential:** **High.** This is personal betrayal.
  **Why it's #2:** If you idealize the people (Faction 1), you change their memories, knowledge, and cognitive capacities. At what point does the "Idealized Citizen" stop being the "Actual Citizen"? If my idealized self agrees to give up my property for the greater good, but *actual* me loves that property, am I being liberated or violated?
  **On the Page:** A character meets a simulation of their idealized self. The simulation is calm, rational, and agrees to something the character finds abhorrent. The character feels gaslit by their own potential. This creates internal conflict: "Am I wrong to resist my own better nature?"
  **If this gets settled:** If we prove that values are stable across idealization (i.e., "You would still want this even if you were smarter"), Faction 1 wins by default. Faction 2 (Procedure) loses its main selling point (protecting flawed people from their own "improvement").

  ### 3. Path Dependence (Order of Deliberation)
  **Status:** Procedural / Fatal to Objectivity.
  **Philosophical State:** Known issue in social choice theory (Arrow's Impossibility Theorem adjacent).
  **Dramatic Potential:** **High.** This is corruption and manipulation.
  **Why it's #3:** If the answer changes based on the order in which questions are asked, there is no "True Will." There is only the "Managed Will." This undermines the Bureau's claim to objective truth.
  **On the Page:** This is the smoking gun. A bureaucrat realizes that if they schedule the "Animal Welfare" simulation before the "Economic Reparations" simulation, the verdict flips. They manipulate the agenda to get the result they want, knowing the "Will of the People" is a sham dependent on the schedule. It turns the Bureau into a political machine.
  **If this gets settled:** If deliberation is proven to *always* converge on the same point regardless of starting position (a "global equilibrium"), the Bureau becomes a truth-machine. The drama shifts from "Is this real?" to "Can we survive the truth?"

  ### 4. Computability (Action Guidance)
  **Status:** Practical / Existential.
  **Philosophical State:** Practical nuisance for philosophers, existential crisis for your Bureau.
  **Dramatic Potential:** **Medium.** This is the ticking clock.
  **Why it's #4:** Philosophers don't care if they can't calculate the answer; they care if the answer *exists*. Your Bureau needs to issue a ruling by Tuesday. If the idealized deliberation takes 100 years to converge, the Bureau is useless.
  **On the Page:** The system is stuck. The idealized agents are looping. The Director has to decide whether to release a "good enough" approximation or wait for a perfect answer that might come too late to save the town. It forces a choice between accuracy and utility.
  **If this gets settled:** If we have infinite compute, this problem disappears. But in a novel, limits create tension.

  ### 5. Deferral (Infinite Regress)
  **Status:** Metaphysical / Nuisance.
  **Philosophical State:** Open, but often dismissed as skepticism.
  **Dramatic Potential:** **Low.** This is nihilism.
  **Why it's #5:** If my idealized self defers to a *more* idealized self, does it ever stop? This questions whether there is a "final" answer.
  **On the Page:** Hard to dramatize without becoming preachy. It works best as a quiet realization by a main character that there is no bedrock, only turtles all the way down. It leads to resignation, not action.
  **If this gets settled:** If there is a "Final Ideal," it gives the Bureau religious authority. If not, they are just guessing.

  ---

  ### The Faction Fight: Idealize People vs. Idealize Procedure

  You asked about the two factions. Here is the philosophical mapping:

  *   **Faction 1 (Idealize People):** This is **Perfectionism / Substantive Rationality**. They believe truth is independent of the process. If the people are stupid, fix the people.
      *   *Risk:* Paternalism. Elitism. "We know what you *really* want better than you do."
      *   *Drama:* They are the technocrats. They are calm, cold, and willing to override actual suffering for "rational" outcomes.
  *   **Faction 2 (Idealize Procedure):** This is **Proceduralism / Deliberative Democracy**. They believe legitimacy comes from the process, not the outcome. If the rules are fair, the result is valid, even if the people are flawed.
      *   *Risk:* Mob rule. Gridlock. Legitimizing terrible decisions because they were made "fairly."
      *   *Drama:* They are the populists or the legalists. They care about rights, voice, and the sanctity of the actual human voice, even when it's ugly.

  **The Crash:** When these return opposite verdicts, the question is: **Is legitimacy about *Truth* (Faction 1) or *Consent* (Faction 2)?**
  *   If Faction 1 wins: The Bureau becomes an oracle. People must obey because it is *Right*.
  *   If Faction 2 wins: The Bureau becomes a parliament. People obey because they *Agreed*.

  ### The AI Safety Connection

  You asked if the AI version is the same problem in a costume. **Yes.**
  In AI safety, "Indirect Normativity" (like CEV) asks: "What would humanity want if we knew more, thought faster, were more the people we wished we were?"
  *   **The Costume:** The stakes are higher (extinction vs. policy), and the agent is non-human (AI vs. Bureau).
  *   **The Same Problem:** The AI faces the exact same Boundary and Identity problems. If the AI decides "Humanity" excludes a certain group, or if it decides "What you would want" is fundamentally different from "What you say you want," it creates the same legitimacy crisis.
  *   **Difference:** In your novel, humans are judging humans. In AI safety, a non-human is judging humans. The AI version is scarier because the judge cannot be appealed to. In your book, the Bureau Directors can be threatened, bribed, or voted out.

  ### What Moves the Ranking?

  You asked: *If one of them got settled tomorrow, which of the others would stop mattering?*

  **The Identity Problem is the keystone.**
  If philosophers proved tomorrow that **Idealized Identity is Continuous** (i.e., "Yes, the smarter version of you is definitely *you*, and their choices bind you"), then:
  1.  **Deferral** matters less (we trust the chain).
  2.  **Faction 1 (Idealize People)** wins the philosophical war.
  3.  **The Boundary Problem** becomes the *only* war left. If we know the idealized self binds the actual self, the only thing that matters is *who gets to be idealized*.

  Conversely, if **Path Dependence** is proven (i.e., "No, there is no single convergent answer, only local equilibria"), then:
  1.  The Bureau's claim to objective truth collapses.
  2.  **Faction 2 (Procedure)** wins by default, because if there is no "True Answer," all that's left is the fairness of the process.
  3.  **Computability** becomes irrelevant (you can't compute a non-existent truth).

  ### Recommendation for the Novel

  Don't solve them. **Weaponize them.**

  1.  **Make the Boundary Problem violent.** Have a group demand entry into the simulation. The Bureau has to physically or digitally bar them. This makes the abstract concrete.
  2.  **Make the Identity Problem personal.** Have a protagonist whose idealized self testifies *against* them in a crucial hearing. "I know you love your son, but if you were rational, you'd admit he's a danger to the public."
  3.  **Make Path Dependence the corruption.** Have a villain who isn't evil, but knows that scheduling the "Education" module before the "Economy" module shifts the vote by 4%. They aren't rigging the vote; they are rigging the *order of thought*.

  **Summary Ranking for your Plot:**
  1.  **Boundary** (Who is in the room?) -> *Political Conflict*
  2.  **Identity** (Is it still me?) -> *Psychological Conflict*
  3.  **Path Dependence** (Can the result be rigged?) -> *Procedural Conflict*
  4.  **Computability** (Can we get the answer in time?) -> *Ticking Clock*
  5.  **Deferral** (Is there a final answer?) -> *Thematic Background*

  Focus on the top three. They are the load-bearing walls of your Bureau, and they are the ones that will crush your characters if they fall.
