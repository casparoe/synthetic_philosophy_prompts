      *Revised Plan for Disposition:* I cannot definitively say "Exonerate" without knowing if the expectation was reasonable. I will recommend that the Board vote to **Exonerate** the officer *provided* the Board agrees the initial expectation was reasonable (based on the dispatch log). If the Board finds the expectation unreasonable, the rule dictates **Sustained**. I will write the opinion recommending Exoneration *assuming* the dispatch data supports it, as that allows me to demonstrate the rule's application. I will add a caveat that if new info contradicts the dispatch log, the disposition flips.
      *Actually, to be more authoritative:* I will state that *based on the current file*, the expectation appears reasonable, therefore I recommend Exoneration + Training.

      *Steel-manning:* I will steel-man the "Malfunction" argument (View B) because it is scientifically robust. I will reject it as a *policy standard* because it abdicates responsibility.

  6.  **Final Review against constraints:**
