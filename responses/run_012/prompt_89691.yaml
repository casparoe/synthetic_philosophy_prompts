          *   Step 3: Was the *contextual expectation* that led to that perception reasonable? (The Crucial Step).
          *   If Expectation Reasonable -> Error is non-culpable (Training focus).
          *   If Expectation Unreasonable -> Error is culpable (Discipline focus).

      *   **Tone Check:** Needs to be empathetic but firm. Legalistic but accessible. Acknowledges the tragedy.

