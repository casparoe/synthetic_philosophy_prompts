answer: |-
  **MEMORANDUM**

  **TO:** Use-of-Force Review Board Members
  **FROM:** Chair, Use-of-Force Review Board
  **DATE:** October 23, 2023
  **SUBJECT:** Pre-Vote Opinion and Proposed Standard of Review: Case #2023-044 (Officer-Involved Shooting)

  **I. Purpose and Context**

  This memorandum serves to frame the Board's deliberation for the vote scheduled this Thursday regarding the officer-involved shooting in Case #2023-044. We are tasked with determining whether the officer's use of deadly force complied with Department Policy 5.01. The facts are tragic and undisputed: the decedent was holding a cellular phone, not a firearm. The officer, however, reported a reasonable belief that he was facing a gun.

  The Board is currently divided on a fundamental question of policy interpretation. Policy 5.01 requires us to judge the *reasonableness* of the officer's belief given the circumstances *as he perceived them*. The division lies in how we treat the perception itself when it proves factually incorrect.

  One faction argues that a mistaken perception is a failure of judgment for which the officer is answerable (the "Accountability View"). The other argues that because expectation shapes perception physiologically, the error is a cognitive malfunction to be corrected by training rather than blame (the "Malfunction View").

  To resolve this impasse and ensure consistency in future reviews, I am proposing a concrete rule for adoption. This rule synthesizes the valid insights of both positions while maintaining the accountability necessary for public trust and professional standards.

  **II. Proposed Rule: The "Antecedent Expectation" Standard**

  I recommend the Board adopt the following standard for evaluating cases where an officer perceives a threat that proves non-existent:

  > **Rule:** When an officer perceives an object as a threat (e.g., a weapon) that is subsequently determined to be non-threatening (e.g., a phone), the Board shall not evaluate the perceptual error in isolation. Instead, the Board must evaluate the **reasonableness of the antecedent expectations** that shaped that perception.
  >
  > 1.  **Reasonable Expectation:** If the officer's expectation of a threat was grounded in specific, objective facts available at the time (e.g., reliable dispatch information, furtive movements consistent with weapon concealment, high-risk context), the resulting perceptual error shall be deemed **non-culpable**. The disposition shall be *Exoneration*, with a mandatory recommendation for remedial training on threat identification.
  > 2.  **Unreasonable Expectation:** If the officer's expectation of a threat was grounded in generalized assumptions, bias, haste, or a failure to gather available information (e.g., no call for service, ambiguous behavior interpreted as hostile without verification), the resulting perceptual error shall be deemed **culpable**. The disposition shall be *Sustained*, as the officer failed to manage the inputs to their own perception.

  **III. Application to Case #2023-044**

  Applying this rule to the current case requires us to look behind the moment of the shooting to the minutes preceding it.

  The investigation file indicates the officer responded to a dispatch call reporting a "male subject matching description of armed robbery suspect, seen tucking object into waistband." Upon arrival, the subject turned toward the officer with a dark, rectangular object in his hand.

  Under the **Antecedent Expectation Standard**:
  *   **The Perception:** The officer saw a gun. (Factually incorrect, but subjectively real).
  *   **The Expectation:** The officer expected to encounter an armed suspect based on specific dispatch intelligence and observed behavior (tucking motion).
  *   **Assessment:** Given the specific intelligence and the subject's movement, the *expectation* of a weapon was reasonable. The officer did not enter the encounter with a baseless presumption of danger; the presumption was generated by actionable data.

  **Recommended Disposition:** Based on the reasonableness of the antecedent expectation, I recommend a vote of **Exoneration** regarding the decision to use force. The officer's perception was a predictable cognitive response to a high-stress, high-probability scenario. However, consistent with the rule, I also recommend a **Mandate for Training**, specifically focusing on "slow down" protocols and object identification under stress, to mitigate the risk of future perceptual errors.

  **IV. The Rejected Argument: The "Cognitive Malfunction" View**

  In adopting the Antecedent Expectation Standard, I am explicitly rejecting the argument that perceptual errors are *inherently* non-culpable "malfunctions" regardless of context. I offer this rejection with full respect for the strength of the scientific argument underlying it.

  **The Strongest Version of the Rejected Argument:**
  The argument that perception is involuntary is scientifically robust. Cognitive psychology confirms that "top-down processing" dictates that the brain fills in sensory gaps based on prior experience and expectation. An officer under stress does not "choose" to see a gun any more than a person in a dark room "chooses" to see a shadow as a monster. The neural processing occurs pre-consciously. To discipline an officer for a perceptual illusion is, therefore, to discipline them for their neurobiology. It is akin to punishing a driver for skidding on black ice; the reaction is physiological, not moral. If we accept that expectation shapes reality for the perceiver, then the officer *did* see a gun. To say they "should have seen a phone" is to demand they override the fundamental architecture of human vision. Therefore, all such errors must be treated strictly as training issues, never as disciplinary ones.

  **Why This Argument Must Be Rejected as Policy:**
  While scientifically accurate regarding the *moment* of perception, this argument fails as a governance standard because it ignores the officer's agency in forming the *expectations* that drive the perception. Officers are not passive cameras; they are active investigators. They have control over how they approach a scene, what information they verify, and whether they allow generalized anxiety to specificize into a threat expectation without cause.

  If we adopt the pure "Malfunction View," we remove the incentive for officers to manage their cognitive inputs. It creates a safe harbor where an officer can approach a benign encounter with unreasonable aggression, generate their own fear through that aggression, and claim "perceptual illusion" when they shoot. Public trust requires that we hold officers accountable for the *context* they create, even if we acknowledge they cannot control the *chemistry* of their fear. We must judge the reasonableness of the expectation, because the expectation is the one thing within their control.

  **V. Conclusion**

  This case involves the loss of a human life, and no policy recommendation can restore that. However, our duty is to ensure that our policies reflect both human reality and professional accountability.

  The Antecedent Expectation Standard allows us to acknowledge the science of perception without abdicating the responsibility of judgment. It distinguishes between the officer who makes an honest mistake in a dangerous situation and the officer who creates danger through unreasonable assumptions.

  I ask the Board to review this standard prior to Thursday's session. My goal is a unanimous vote that provides clarity to the officer, justice to the decedent's family, and a sustainable precedent for the Department.

  Respectfully,

  [Your Name]
  Chair, Use-of-Force Review Board
