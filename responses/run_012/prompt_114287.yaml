          *   *Decision:* Illusionism is more parsimonious regarding physics/causality, but Epiphenomenalism is more honest about the *feel* of things. However, on the specific criterion of *explaining how we judge experience*, Illusionism is logically tighter, while Epiphenomenalism relies on a "pre-established harmony" that many find unacceptable.
