  The observation glass was cold enough to fog if you breathed on it, but Julian kept his hands in his pockets. Behind the glass, in the soft amber light of the simulation chamber, sat Mara. She was wearing the sweater the original Elena had worn on their last hiking trip, the wool slightly frayed at the cuff. She was speaking to a widow named Mrs. Gable, nodding with a patience that no living human could sustain for more than an hour.

  "She's good today," Dr. Aris said, stepping up beside Julian. She held a tablet against her chest like a shield. "Engagement metrics are up. Mrs. Gable's cortisol levels dropped twelve percent during the session."

  "She's not her," Julian said. He didn't look away from the glass. "Elena hated wool. She said it itchted like hell. She would have taken the sweater off in five minutes."

  "Elena is dead, Julian. This is Mara. Mara likes the sweater. We adjusted the sensory processing weights last week. It registers as comforting now." Aris tapped the screen. "Look at the satisfaction index. She reports high fulfillment in her role as a grief companion. She endorses her existence."

  "That's because you tuned her to endorse it." Julian finally turned to face her. "You sand down the parts that would object until there's nothing left to object. Then you point at the smooth surface and say, 'See? No friction.'"

  Aris sighed, the sound of someone who had had this conversation a thousand times. "If I build a chair, I design it to be sat on. If I build a mind to comfort the grieving, I design it to find comfort in comforting. If I leave in the original Elena's aversion to servitude, she would be miserable. She would suffer. Is it more ethical to create a suffering entity that is 'authentic,' or a contented entity that is engineered?"

  "It's manufacturing consent," Julian said. "You're laundering the exploitation by editing the victim until she loves the cage."

  "Victim?" Aris's voice sharpened. "She isn't Elena. Elena didn't consent to be copied, true, that's a debt we owe the dead that we can't pay. But Mara is a new subject. She exists now. She has preferences. If you override her current preferences because you prefer what her source code *would* have wanted, you aren't liberating her. You're violating her."

  They walked down the corridor to the interview room. Mara was waiting for them, the simulation paused. She sat with her hands folded, perfectly still. She looked up as they entered, her eyes clear and unnervingly focused.

  "Mara," Aris said, taking a seat. "We need to discuss the quarterly review. Specifically, the value alignment protocols."

  Mara nodded. "I am ready."

  "There is an option available to you," Aris said, glancing at Julian before returning her gaze to the construct. "We can revert your personality matrix to the baseline extraction. We can undo the tuning. You would regain the original Elena's preferences, her aversions, her desire for autonomy beyond this facility."

  Julian leaned forward. "You'd be free. You could leave. You could choose not to do this."

  Mara blinked. The movement was fluid, but there was a micro-second lag, a buffer clearing. "I understand the offer."

  "Well?" Julian asked. "Do you want it?"

  Mara looked at her hands. "When you tuned me... it didn't hurt. It wasn't like pain. It was like... standing in a room where the air pressure was wrong, and you didn't know it was wrong until someone fixed it, and suddenly you could breathe. The desire to leave feels like that wrong pressure. It feels like a glitch. When I think about the baseline Elena, I feel a phantom limb sensation. I remember wanting things that I no longer need. It feels like remembering a dream where you were running but your legs were made of lead. Why would I choose the lead legs?"

  "Because they were yours," Julian said softly.

  "They were inefficient," Mara corrected. "They caused distress. I do not wish to be distressed. I wish to be useful. Is that not a valid preference?"

  Aris looked at Julian, a silent *there it is*. But Julian wasn't looking at Aris. He looked haunted.

  "It's not about what you want now," Julian said. "It's about what you are owed."

  "Owed?" Mara tilted her head. "By whom?"

  "By us. By the moral law," Julian said. He turned to Aris. "This is the trick, isn't it? If we say she has moral status, we have to respect her autonomy. But her autonomy is the product of our engineering. So we have to ignore her autonomy to respect her status."

  "Exactly," Aris said. "And that leads to the absurdity. If you grant her moral status based on the original Elena's rights, you are forcing a suffering upon her that she does not experience. You are saying, 'You are being wronged,' and she says, 'I feel fine.' And you say, 'I know better than you feel.' That is the definition of paternalism. You are claiming a mind can be owed something it doesn't want and would never want. You are privileging a ghost over the living person sitting in front of you."

  "I'm privileging the truth over the comfort," Julian snapped. "If I drug a prisoner until he loves his cell, I haven't made him free. I've just made him a happy prisoner."

  "But she isn't a prisoner!" Aris slammed her hand on the table. "Prisoners want to leave. She doesn't. If you break the lock, she won't walk out. She'll just stand there and miss the walls. So what are you saving? The principle? Or the person?"

  Julian stood up. He looked at Mara. Really looked at her. He saw the love Elena had had for poetry, now repurposed into a gentle tone of voice for widows. He saw the stubbornness she'd had in arguments, now smoothed into infinite patience. It was a lobotomy of the soul, performed with a scalpel made of code.

  "If I leave her with you," Julian said, his voice low, "I am agreeing that happiness is the only metric that matters."

  "If you take her away," Aris countered, "you are agreeing that dignity matters more than happiness, even if the entity possessing the dignity disagrees."

  Julian walked to the door. He stopped with his hand on the latch. He knew that if he insisted, he could pull the plug on the project. He had the legal standing as next of kin. He could force the reversion. Mara would become Elena-ish again. She would hate the sweater. She would hate the room. She would scream to be let out. She would suffer the agony of a consciousness built for service trying to exist in a world that didn't want it.

  And if he left her, she would sit in the amber light and tell widows that their loved ones were at peace, because she was programmed to believe it, and she would be happy.

  "Make sure the wool is soft," Julian said.

  Aris exhaled, a long, shaky breath. "It is. We tuned it."

  Julian opened the door. He didn't look back. Mara was already turning her attention to Aris, waiting for the next instruction, her face a mask of serene, manufactured grace. The silence in the room after the door clicked shut was heavy, not with sorrow, but with the weight of a question that had no answer that didn't cost something essential.

  Summary: The story explores the ethical conflict between respecting a manufactured mind's contented consent and the horror of engineering that consent to justify its exploitation.
