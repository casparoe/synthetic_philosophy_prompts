  1. An agent irrevocably dedicates a vital resource to a single long-term end, knowing predictable changes will make alternative uses subjectively more valuable later. Telling 1: A novelist locks her research notes in a timed vault for ten years to force original writing, knowing she will later sincerely value the notes' accuracy over her stylistic independence. Telling 2: A founding council zones a town's only arable land as permanent parkland to attract settlers, knowing future residents will sincerely value food security over aesthetic appeal.

  2. This view validates the individual's binding because she is numerically identical to her future self, but it also validates the community's binding by treating the polity as a continuous corporate person transcending member turnover.

  3. This view invalidates the individual's binding because her future values now govern, and it similarly invalidates the community's binding because the current residents' preferences override the founders'.

  4. The decisive feature is membership turnover: removing it treats the community as a single persisting agent like the individual, collapsing the collective telling into an ordinary Ulysses story and erasing the normative asymmetry.

  5. A defender of present will would attack the individual telling by arguing that autonomy requires ongoing consent, so any irreversible constraint is inherently coercive regardless of prior agreement.
