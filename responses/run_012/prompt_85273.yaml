      *   *Lange (Market Socialist):* Central Planning Board (CPB) can simulate the market. Set prices, observe surpluses/shortages, adjust prices (trial and error). Managers follow rules (minimize cost, set P=MC). This achieves Pareto efficiency. Incentives are a separate political problem, not a calculation problem.
      *   *Common Ground:* Both want rational allocation. Both agree prices convey information. Both agree pure barter/command without *any* valuation metric fails.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to establish what they *don't* fight about.
      *   1. Definition of "Rational Allocation": Pareto efficiency (can't make someone better off without hurting another).
      *   2. Role of Prices: Prices signal scarcity and coordinate decentralized decisions.
      *   3. Incentives vs. Calculation: Both admit incentives matter, but disagree on whether calculation is *possible* without markets.
      *   4. Semantic clarity: "Socialism" means public ownership of means of production. "Calculation" means comparing inputs to outputs in common units.
      *   5. The Goal: A system that avoids chronic shortages/surpluses and uses resources efficiently.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need neutral phrasing.
      *   *Disagreement 1: Origin of Prices.* Market process vs. Administrative simulation.
      *   *Disagreement 2: Capital & Time.* Intertemporal coordination without asset markets.
      *   *Disagreement 3: Knowledge.* Objective data (Lange) vs. Subjective/Tacit knowledge (Hayek).
      *   *Disagreement 4: Dynamics.* Static equilibrium (Lange) vs. Dynamic discovery (Hayek).

  5.  **Drafting Section 3: The Cruxes (The Core Task):**
      *   *Crux A: The Nature of Trial-and-Error.*
          *   Issue: Is CPB price setting discovering something unknown, or solving equations with known variables?
          *   Hayek View: The data *doesn't exist* until the market acts.
          *   Lange View: The data exists as preferences/tech constraints; CPB just finds the solution faster/cleaner.
          *   Test: A shock (e.g., sudden resource loss). How fast/accurately does each adjust?
      *   *Crux B: Capital & Interest.*
          *   Issue: Pricing a factory that doesn't exist yet.
          *   Hayek View: Need asset markets to determine interest rates/risk.
          *   Lange View: Use shadow prices/discount rates set by the board based on growth targets.
          *   Test: Choosing between two long-term technologies with uncertain future demand.
      *   *Crux C: Information vs. Incentives.*
          *   Issue: Is the failure logical (Mises) or practical (Hayek/Incentives)?
          *   Hayek/Mises View: Even with saints, the info isn't there.
          *   Lange View: With saints (no shirking), the rules work.
          *   Test: The "Saintly Manager" hypothetical.
      *   *Crux D: Convergence & Computation.*
          *   Issue: Can the math actually be solved in real-time?
          *   Hayek View: The equation system is too complex/changing (non-convergence).
          *   Lange View: It's just a Walrasian auctioneer; it converges.
          *   Test: Modern computing power applied to a sector (e.g., energy grid).

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I avoid fake citations? Yes.
