prompt: |-
  I'm in a third-year ethics course and we just did the Williams piece about the drowning wife — the one where you save her and then add that morality permits you to, and that's supposed to be one thought too many. It's come up three times in seminar now and each time its doing completely different work. One guy used it as a knockdown against utilitarianism; another used it to say you shouldn't be doing any moral thinking at all when it's your own life ('if you have to ask, you've already gone wrong'); a third used it just to mean you don't have to recite the permission to yourself, which sounds almost trivial. Are these all readings of the same claim, or are some of them just false? Can you lay out the precise theses that one-liner could be expressing — something about what actually runs through your head, about what justifies the act, about what a moral theory is required to supply, about integrity or the agent's identity, about non-moral reasons, about the standing of the person rescued — and say for each whether it's a platitude, a genuine substantive claim, or false, and which ones would actually back each of the three uses above? A menu with verdicts would help me more than a single interpretation.
reasoning: |-
