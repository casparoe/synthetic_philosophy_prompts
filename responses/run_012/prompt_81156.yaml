      *   *Utilitarian/Impartialist justification:* He saves her because she is his wife *and* morality permits/requires saving those closest to you (or it maximizes utility).
      *   *Williams' Critique:* If he justifies it by appealing to a moral principle ("morality permits me to save my wife"), he has had "one thought too many." He should have saved her simply because she is his wife.
