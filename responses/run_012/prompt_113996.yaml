prompt: |-
  My aunt filled out one of those advance directive forms a couple years ago, right after her diagnosis, back when she was still sharp as anything. She named me the one to make the calls, so Im the one getting yelled at now.

  Here's the part I can't get my head around. The form isn't just a checklist of medical stuff. She wrote her own paragraph at the top, and her lawyer says it's valid. Roughly: "I know that later on I may seem calm, even happy. I want it on record that this happiness is not me, it's the illness wearing my face. Don't let my contentment overrule the instructions below, and don't take my later objections seriously, because they won't be mine."

  She's in the later stages now. And honestly? She's lovely. She doesn't remember writing any of it. She says she's happy, she likes her aide, she's painting again, and she has zero interest in the "do everything, tube, hospital, the works" plan she insisted on back then. She mostly wants to sit in the garden and eat cake. When the nurse brought up the feeding tube she waved it off and said she'd rather be let go.

  My cousin says the document is her, the real her, and that I'd be betraying her if I ignored it. My gut says the woman in the garden is also her, and it's creepy to let a version of her who's basically gone boss around the version who's actually sitting in front of me.

  The thing that really gets me is that she wrote it so that nothing she said later could count against it. If that works, the earlier her can never lose, no matter what happens to her. Is that fair? And who am I actually taking orders from here?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **The Core Conflict:** The user is the healthcare proxy (agent) for their aunt. There is a conflict between the aunt's *past* advance directive (written when competent, demanding aggressive life-saving measures) and her *current* expressed wishes (in later stages of illness, expressing comfort care only, refusing tubes/hospitals).
      *   **The Specific Clause:** The advance directive contains a "Ulysses Clause" (or similar preemptive instruction). It explicitly states that future expressions of contentment or objection should be disregarded because they are attributed to the illness, not her "true" self.
      *   **The Current Reality:** The aunt is currently happy, painting, enjoying life, but refuses aggressive intervention (feeding tubes, etc.) *now*. Wait, let me re-read carefully.
          *   *Past Directive:* "Do everything, tube, hospital, the works."
          *   *Current State:* She's in later stages. She says she's happy. She has "zero interest in the 'do everything, tube, hospital, the works' plan she insisted on back then." She "mostly wants to sit in the garden and eat cake." When the nurse brought up the feeding tube she "waved it off and said she'd rather be let go."
          *   *Correction/Refinement:* There is a contradiction in the user's description.
              *   *Past:* "Do everything, tube, hospital, the works."
              *   *Preemptive Clause:* "Don't let my contentment overrule the instructions below [the aggressive care]."
              *   *Current:* She refuses the feeding tube *now*. She wants comfort care ("let go").
              *   *Wait, let's look closer:* "She mostly wants to sit in the garden and eat cake. When the nurse brought up the feeding tube she waved it off and said she'd rather be let go."
              *   *The Conflict:* The *past* directive says "Do everything/Tube." The *current* aunt says "No tube/Let go." The *preemptive clause* says "Ignore current happiness/objections, follow the past directive (Do everything)."
              *   *The Cousin's View:* Follow the document (Past Aunt = Real Aunt).
              *   *The User's Gut:* Follow the current woman (Current Aunt = Real Aunt).
      *   **The Ethical/Legal Question:** Is a "Ulysses Clause" (binding the future incompetent self to the past competent self's wishes even against current objections) valid/enforceable? Who is the "real" patient?

  2.  **Identify the Ethical & Legal Frameworks:**
      *   **Advance Directives:** Generally legally binding, but they are instructions for *when the patient cannot communicate*.
      *   **Capacity:** If the aunt currently has capacity to make medical decisions, the advance directive is suspended. She can override it *now*.
      *   **The "Ulysses Contract":** This is a psychiatric/ethical concept where a patient pre-commits to treatment during a future period of incapacity (often used in mental health). In end-of-life care, it's more complex.
      *   **Current Capacity:** The prompt says she's in "later stages," "doesn't remember writing any of it." This suggests diminished capacity, possibly dementia or advanced neurodegenerative disease. However, she is expressing a clear preference *now* ("waved it off," "rather be let go").
      *   **The Paradox:** The directive specifically anticipates this scenario ("I know that later on I may seem calm..."). It tries to invalidate her future capacity/expressions.
      *   **Legal Reality:** In most jurisdictions, a patient with *current* capacity can override an advance directive. If she lacks capacity, the proxy must follow the directive *unless* there is evidence of a change in values. However, a clause that says "Ignore my future self" is legally contentious. Most laws prioritize the *current* best interest and known wishes if capacity is gone, but a specific instruction to ignore current demeanor is tricky.
      *   **Ethical Reality:** This is the "Then Self vs. Now Self" debate (Rebecca Dresser, Daniel Dennett, etc.). Is personal identity continuous?

  3.  **Determine the Role of the Response:**
      *   **Empathy:** Acknowledge the immense burden and emotional toll.
      *   **Clarification:** Help the user untangle the legal vs. ethical vs. practical aspects.
      *   **Actionable Advice:** They need to talk to the medical team and potentially an ethicist or lawyer, not just rely on internet advice.
      *   **Validation:** Validate that this is a known ethical dilemma (the "Ulysses Clause" problem) and that their gut feeling is shared by many ethicists.
      *   **Safety:** Do not give specific legal/medical advice. Urge consultation with professionals.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the difficulty. This is one of the hardest situations a proxy can face. Acknowledge the love and care in the question.
      *   **The Legal/Practical Reality (Capacity):** This is the most critical pivot point. Does she have decision-making capacity *right now*?
          *   If Yes: The document doesn't matter. She decides now.
          *   If No: The document guides the proxy, *but* the proxy's job is to represent her *best interests* and *current values*, not just blindly follow a checklist.
      *   **The "Ulysses Clause":** Name it. Explain that while well-intentioned, these clauses are often legally shaky when they conflict with immediate comfort and expressed refusal of treatment by the patient present.
      *   **The "Then Self" vs. "Now Self":** Discuss the philosophy gently. The cousin sees continuity of identity (autonomy). The user sees discontinuity (beneficence/current well-being). Both have merit.
      *   **The Specific Contradiction:** Point out the nuance. The past self wanted *aggressive* care. The current self wants *comfort* care. The directive says "Ignore current happiness, do aggressive care." But the current self is *refusing* aggressive care.
          *   *Crucial Point:* Even with an AD, you generally cannot force treatment on a resistant patient if it causes suffering, unless there's a specific legal mandate. Forcing a feeding tube on a happy, resisting (or verbally refusing) dementia patient is often considered unethical/medically inappropriate even with an AD.
      *   **The Proxy's Role:** You are not a robot. You are a fiduciary. Your job is to interpret her *best interest* now.
      *   **Next Steps:**
          1.  Assess Capacity (Medical team).
          2.  Ethics Consult (Hospital).
          3.  Palliative Care/Hospice conversation.
          4.  Family Meeting (Mediator).
      *   **Closing:** Reassure the user. They are not betraying anyone by prioritizing the suffering/happiness of the person in front of them.

  5.  **Refining the Tone:**
      *   Needs to be compassionate, not clinical.
      *   Needs to be firm on the "get professional help" aspect without sounding dismissive.
      *   Avoid saying "You must do X." Instead, "Here is how these situations are typically navigated."

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I misread the directive?
      *   *Re-read:* "instructions below" = "do everything, tube, hospital, the works".
      *   *Current:* "waved it off and said she'd rather be let go."
      *   *Conflict:* Past = Life at all costs. Present = Comfort over life extension.
      *   *Clause:* "Don't let my contentment overrule the instructions below."
      *   *Implication:* The aunt anticipated she might be happy but "deluded" by illness, and wanted life saved anyway.
      *   *Ethical tension:* Is her current happiness "real"? If she has dementia, does she understand the consequence of refusing the tube (death)? If she doesn't understand, does her refusal count?
      *   *Nuance:* Even if she lacks capacity, medical providers often refuse to administer invasive treatments (like tubes) on patients who are actively resisting or who are in a state where the burden outweighs the benefit, regardless of an AD. The AD grants *permission*, it rarely *mandates* treatment against medical judgment.
      *   *Key distinction:* An Advance Directive usually allows you to *withhold* treatment. It rarely forces doctors to *provide* futile or unwanted treatment if the clinical picture has changed.
      *   *Wait, one more check:* The user says "She doesn't remember writing any of it." This implies memory loss/capacity issues. But she can express a preference.
      *   *Advice:* Focus on the "Best Interest Standard" vs. "Substituted Judgment Standard."

  7.  **Final Polish:** Ensure the distinction between legal validity and medical enforceability is clear. A lawyer says it's valid; a doctor might say it's not actionable. An ethicist bridges the gap.

  **(Self-Correction Note):** I need to be careful not to tell them to ignore the document. I need to tell them how to navigate the conflict. The document *might* be valid, but its application is the issue.

  8.  **Final Structure:**
      *   Empathy & Validation.
      *   The Capacity Question (The Pivot).
      *   The "Ulysses Clause" (Legal vs. Ethical).
      *   The Medical Reality (Doctors won't force treatment).
