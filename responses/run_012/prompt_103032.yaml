      *   *Stalinesque:* Experience is delayed. The brain waits for both stimuli, constructs the scene (Red-then-Green), and *then* presents it to consciousness. (Staging before consciousness).
      *   *Dennett's Point:* There is no "fact of the matter" about which one happened. They are empirically equivalent regarding the subject's report. There is no "finish line" in the brain where consciousness happens (no Cartesian Theater). Therefore, the question "When did the experience happen?" is ill-posed.
