  **Note on the Mathematics and the Poem**

  Your premise is not confused. You have independently rediscovered the distinction between ensemble averages (what happens across many parallel histories) and time averages (what happens to one person over many trials), which is the core ergodicity problem in economics. Your numbers are correct: with a 60% win rate on even money, the arithmetic mean growth rates are indeed 0%, 4%, 10%, and 20% for stakes of 0, 1/5, 1/2, and 1 respectively. Your geometric estimates (~2% gain, ~3% loss, total ruin) are also accurate approximations of the long-run compound rate.

  However, to fit this into a poem, I had to simplify a few things a specialist would contest:

  1.  **Finite vs. Infinite:** The poem says "ten tosses," but the percentages (2% gain, 3% loss) are asymptotic limits that only stabilize over a very long sequence. In a mere ten tosses, variance is huge; you could easily win big with a half-stake or lose everything with a fifth-stake due to luck. The poem treats the "typical path" as a certainty rather than a probability.
  2.  **The Refrain:** I chose "Risk a fifth" to highlight the Kelly optimal fraction. In the first and last stanzas, this statement is factually false regarding the action taken, relying on the "meaning moves" instruction to carry the weight of missed opportunity and impossible advice.
  3.  **The Arithmetic Standing:** You asked to leave the arithmetic standing in the last stanza. Mathematically, the "average wealth" across all histories does grow by 20% per toss even when you bet everything, because the few histories where you win every single time become astronomically wealthy, skewing the average despite the vast majority going to zero. The poem preserves this counter-intuitive truth in the line "The sum grows vast where there is only one."
  4.  **Utility:** A professional might argue that maximizing geometric growth isn't always the goal; if you have a finite horizon or specific utility needs, betting more than Kelly might be rational for you. The poem presents the geometric path as the "real" life, which is the standard resolution to the paradox, but it is technically a choice of utility function.

  You have done the hard work of feeling the math before knowing the names. The poem tries to honor that intuition.
