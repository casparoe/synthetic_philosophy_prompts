      *   The Self-Refutation (6-9): Why it feels cheap and why it doesn't actually save induction.
      *   The Repair Plan: What to keep, what to toss, and the philosophical cost.

  10. (Final Review against constraints): User wants to keep "data alone can't pick bias" and "something arbitrary about starting assumptions." I need to ensure my solution respects that. Yes, by framing bias as an empirical bet on the world's structure rather than a logical truth.

