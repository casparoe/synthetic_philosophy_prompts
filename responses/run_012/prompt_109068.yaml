answer: |-
  You have identified a very specific and contentious posture in contemporary metaontology. The position you describe does not have a single, universally agreed-upon label like "Solipsism" or "Utilitarianism," but it is a recognized cluster of views often discussed under the headings of **Metaontological Pragmatism**, **Neo-Carnapianism**, or **Lightweight Realism**.

  However, the specific *rhetorical move* you are spotting—conceding the lack of a mind-independent fact while insisting on the correctness of one answer based on utility—is structurally identical to **Quasi-Realism** (a term coined by Simon Blackburn for ethics, but increasingly applied to metaphysics).

  Here is an analysis of the position, its stability, its neighbors, and a diagnosis of what is actually happening in your reading group.

  ### 1. The Established Names

  There are three labels that fit, depending on which aspect of the view you wish to emphasize:

  *   **Metaontological Pragmatism:** This is the most common contemporary label. It holds that ontological questions (like the Special Composition Question) do not have answers grounded in "joints in nature" (metaphysical realism), but are instead settled by pragmatic criteria: simplicity, fit with ordinary language, or theoretical utility.
  *   **Neo-Carnapianism:** This references Rudolf Carnap's distinction between *internal* questions (asked within a linguistic framework, e.g., "Is there a chair in the room?") and *external* questions (about the framework itself, e.g., "Do chairs really exist?"). Carnap argued external questions are not theoretical but practical. Your group is treating an external question *as if* it were internal, justified by practical utility.
  *   **Quasi-Realism about Composition:** This is the most precise structural description. A quasi-realist admits that there are no "truth-makers" in the world for their claims (no objective boundary), but argues that our discourse is entitled to *act as if* there are truth-values. They earn the right to say "This is true" and "That is false" based on the coherence of our practices, not the structure of reality.

  ### 2. Is the Position Coherent or Stable?

  This is the crux of the current debate in metaontology (championed by figures like Ted Sider, Eli Hirsch, and Amie Thomasson). The position is widely regarded as **unstable**, or at least under severe pressure to collapse into one of its neighbors.

  **The Instability Charge (The "Sider Challenge"):**
  The philosopher Ted Sider argues that if you concede there is no "joint in nature" (no privileged boundary), you cannot coherently claim one answer is *correct* and the others *mistaken* in a metaphysical sense.
  *   If the criterion is merely **utility**, then the dispute is not about *what exists*, but about **which concepts we should use**.
  *   If it is about which concepts to use, the debate belongs to **Conceptual Ethics** or **Linguistic Policy**, not Metaphysics.
  *   By continuing to argue in metaphysical terms ("Objects *do* compose here") while relying on pragmatic grounds ("It is *useful* to say they do"), the group is arguably **changing the subject** while pretending they aren't.

  **The Defense (The "Thomasson/Hirsch" Line):**
  Defenders (like Amie Thomasson in *Ontology Made Easy*) argue the position is stable. They claim that existence questions *are* conceptual questions. To ask "Do tables exist?" is just to ask "Does our concept 'table' apply here?" Since concepts have rules, there *are* right and wrong answers (internal to the concept), even if the concept itself was chosen for pragmatic reasons.
  *   **Stability Condition:** The position is stable *only if* they are willing to admit they are doing **Conceptual Analysis** or **Conceptual Engineering**, not discovering mind-independent reality.
  *   **Instability Condition:** If they insist they are describing *reality* (even a "lightweight" reality) while admitting the boundaries are arbitrary human impositions, they are sliding into self-contradiction.

  ### 3. Distinguishing from Neighbors

  You asked how this differs from verbal disputes, relativism, and quietism. Here is the map:

  | Position | Are there facts of the matter? | Is the dispute substantive? | What should we do? |
  | :--- | :--- | :--- | :--- |
  | **Metaphysical Realism** (Sider) | Yes (Brute or Joint-Carving) | Yes | Find the true boundary. |
  | **Your Group's View** | **No (in reality); Yes (in practice)** | **Yes (pragmatically)** | **Argue for the most useful framework.** |
  | **Verbal Dispute** (Hirsch) | No (Quantifier Variance) | No (Merely linguistic) | Translate and dissolve the dispute. |
  | **Quietism** (Wittgensteinian) | No | No (Pseudo-problem) | Stop asking the question. |
  | **Relativism** | Yes (Relative to framework) | No (No cross-framework truth) | Accept multiple frameworks as equal. |

  **Key Distinctions:**
  *   **Vs. Verbal Dispute:** A verbal disputant (like Hirsch) says, "You are both right in your own languages; stop fighting." Your group says, "We are both right in our own languages, but *my* language is better, so I am right and you are wrong."
  *   **Vs. Relativism:** A relativist says, "Your boundary is true for you, mine for me." Your group says, "My boundary is the one *we should all use*." They claim a kind of **normative privilege** without **ontological privilege**.
  *   **Vs. Quietism:** A quietist says, "This question is nonsense; let's go have coffee." Your group says, "This question is grounded in utility; let's write a paper about it."

  ### 4. Diagnosis: What is actually happening?

  You suspected this might be a "disguise for ordinary partisanship." You are largely correct, though "partisanship" is too pejorative. A more charitable and precise diagnosis is that your group is engaging in **Conceptual Engineering** while calling it **Metaphysics**.

  **Conceptual Engineering** is the project of assessing and improving our conceptual schemes. It asks: "What concept of 'object' serves our scientific and social purposes best?"
  **Metaphysics** traditionally asks: "What is the nature of reality independent of our concepts?"

  Your group is doing the former. They are selecting the best tool for the job. However, because they are in a *metaphysics* reading group, they feel pressure to speak the language of truth and falsity ("This theory is correct") rather than the language of recommendation ("This theory is more useful").

  **The Coined Term:**
  If you need a label to capture this specific tension—the claim to correctness without the claim to mind-independent truth—I propose the term:

  > **Normative Ontology**

  *   **Definition:** The view that ontological claims are not descriptions of reality but prescriptions for conceptual scheme adoption, justified by normative criteria (utility, simplicity, fit) rather than correspondence.
  *   **Inside the boundary:** Views that argue for composition criteria based on "ordinary practice," "scientific utility," or "cognitive economy" while conceding no natural joint.
  *   **Outside the boundary:** Brutalism (Sider), which claims there *is* a natural joint; Nihilism, which claims the concept is irredeemable; Quietism, which claims the question should be abandoned.

  ### 5. Summary for your Reading Group

  If you want to intervene in the discussion, you might say:

  > "It sounds like we are adopting a **Metaontological Pragmatist** or **Quasi-Realist** stance. We are conceding that there is no mind-independent fact of the matter (anti-realism), but insisting that one answer is 'correct' because it is normatively superior for our practices (pragmatism).
  >
  > The risk here is instability. If the criterion is purely utility, aren't we actually doing **Conceptual Engineering**? If we are, we should stop arguing about what *exists* and start arguing about which *concepts* serve us best. If we refuse to make that shift, we risk claiming a 'correctness' that our own premises deny us."

  This identifies the move, gives it a name, exposes the tension, and offers a path to resolve it.
