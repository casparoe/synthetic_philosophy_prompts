answer: |-
  Dear Colleague,

  I write to you regarding the construction of a Frankfurt-style case that adheres strictly to your constraints, avoiding any supernatural or neuroscientific manipulation while securing the inevitability of the agent's action. Consider Elena, a senior member of a hospital ethics committee tasked with approving the withdrawal of life support from a patient in a persistent vegetative state, a decision she knows carries heavy moral weight. She sits at the head of the table while Marcus, the chairperson who is determined to see the procedure authorised, stands silently behind her. The voting protocol requires members to raise their hands visibly within ten seconds of the call, and Marcus has resolved that if Elena's hand does not begin to rise within that window, he will physically grasp her wrist and lift it to record her assent, a manoeuvre permitted under emergency procedural rules. In the actual sequence of events, Elena reviews the medical files, deliberates on the futility of treatment, and concludes that withdrawal is the compassionate choice, raising her hand firmly on her own accord before the deadline expires while Marcus remains entirely still.

  In this scenario, there is one thing Elena genuinely could have done, which is to keep her hand resting on the table for eleven seconds rather than ten. We must identify this hesitation as hollow because, given the arrangement, nothing could have come of it; had she delayed even momentarily, Marcus would have intervened to ensure the hand was raised regardless, meaning the outcome of her voting yes was inevitable once the deliberation period began. It is crucial to note that this hollowness does not depend on any earlier choice of hers, such as a prior resolution to obey Marcus, for she made no such pact. There is, however, an earlier moment in her history that offers her a real alternative, namely that she could have resigned from the committee last week before the case was assigned. If this earlier alternative counts towards the principle of alternative possibilities, then the principle remains technically satisfiable across her history, but it fails to protect her from blame at the time of action, which is the relevant locus for moral responsibility. The case is designed to show that while she could have resigned previously, she could not have avoided voting yes at the moment of voting, and yet she remains blameworthy or praiseworthy for that vote depending on her reasons.

  When we consult the theorists, the verdicts fall out of the structure you requested. A theorist who holds that blameworthiness requires that the agent could have done otherwise must verdict that Elena is not responsible, for at the time of the vote, the alternative of voting no was closed off by Marcus's standing readiness. The premise carrying the weight here is that moral responsibility requires the ability to do otherwise at the time of action, not merely at some point in the past. A theorist who will settle for her having been able to begin to do otherwise will verdict that she is responsible, pointing to the hollow hesitation as the sufficient flicker of freedom required to ground accountability. Finally, a theorist for whom only the actual sequence matters will verdict that she is responsible, arguing that because Marcus did not act and her deliberation was entirely her own, the source of the action was internal to her, rendering the counterfactual intervener irrelevant to her moral status. I believe the reading of the actual sequence theorist is right, because the hollow alternative cannot ground her blame; blame attaches to the quality of the will and the reasons for which one acts, not to the mere physical possibility of twitching differently when that twitch would have been overridden anyway. To hold her responsible because she could have hesitated is to mistake a meaningless physical possibility for a robust moral alternative.

  The single feature of the case that is doing the real work is the counterfactual intervener who ensures inevitability without causally influencing the actual sequence. When that feature is replaced by the more familiar one, a person who would have intervened by operating on her will directly through drugs or implants, the intuition shifts sharply against her responsibility because the actual sequence is then contaminated by the threat of manipulation, making her appear like a puppet even if the strings were not pulled. When the feature is removed altogether, leaving Elena alone in the room, she clearly could have done otherwise, and while she remains responsible, the case ceases to refute the principle of alternative possibilities because the alternative was genuinely open. Putting on the other hat, the strongest case a defender of the principle of alternative possibilities can make against this example is the flicker strategy, arguing that the hesitation is indeed a genuine alternative possibility, and since she could have hesitated, the principle is not refuted. This objection succeeds only if one accepts that any alternative, no matter how morally insignificant, preserves the principle, but it fails to show that such a trivial alternative is sufficient to ground the kind of responsibility we care about, which is why the Frankfurt case remains a potent challenge to the principle despite the flicker.
