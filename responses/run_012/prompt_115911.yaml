answer: |-
  Good morning. Welcome to all of you.

  It is a privilege to open this workshop. We have a rare configuration in this room. We have philosophers who live in the conceptual architecture of the mind. We have vision scientists and neuropsychologists who build the experiments and sit across the table from the patients. We have representatives from the foundation whose generosity made this gathering possible—thank you for believing that these conversations matter.

  And we are especially honored to welcome a former patient and her husband, who are joining us for this first session. Your willingness to be here, to let your history be part of a conversation about what consciousness is, is a gift to this field. We are not here to define you. We are here to learn from the work that your participation made possible.

  I know there is a certain amount of healthy tension in a room like this. I know that when philosophers talk about "the self" or "the subject," clinicians sometimes hear noise over the signal of the data. I know that when clinicians describe a behavioral deficit, philosophers sometimes hear a metaphysical claim that wasn't intended. That tension is not a bug; it is a feature. If we all agreed on what the data meant, we wouldn't need two days.

  I am not going to survey the literature. You know the history of commissurotomy better than I do. You know the tachistoscopic tests, the tactile naming tasks, the interhemispheric conflicts. We have all read the standard cases. Instead, I want to propose a tool for the next two days. It is a distinction that I think might help us stop talking past one another.

  I want to suggest we separate **unity of control** from **unity of experience**.

  By unity of control, I mean the coordination of agency. Can the organism act as a single unit? Can the hands cooperate to tie a shoe? Can the person navigate a room, hold a conversation, and maintain a biography that hangs together over time? In the clinical setting, this is often what you see. You see a person who functions, who adapts, who presents as a single agent navigating the world. Even when the corpus callosum is severed, the unity of control often remains remarkably robust in daily life. The body moves as one. The voice speaks as one.

  By unity of experience, I mean the phenomenology. The subjective field. When I look at a red apple and hold it in my left hand, is there a single "I" who sees the red and feels the smoothness simultaneously? Or are there parallel streams of awareness that are only stitched together by behavior? This is the realm of what it is *like* to be the patient.

  Here is where the trouble starts. I suspect a significant amount of the shouting in this field comes from sliding between these two unities without noticing.

  When we say "the patient chose X," are we talking about control? Did the motor output emerge from a single decision process? Or are we talking about experience? Did a single subject feel the reason for the choice?

  When we say "the patient saw Y," are we implying that the visual field was phenomenally unified, or simply that the information was processed somewhere in the brain?

  My own suspicion—and I emphasize this is a suspicion, not a conclusion—is that the split-brain data are genuinely troubling for the unity of experience, but much weaker against the unity of control. It is possible to have a single agent managing two distinct streams of awareness. It is possible to have a unified phenomenology that masks disjointed processing. But we cannot know which is true if we use the word "unity" to cover both.

  So, my request for this workshop is simple. When we discuss the cases over the next two days, I ask that we be precise about which unity we are invoking. If a clinician presents a case where the hands conflict, let us ask: is this a failure of control, or a revelation of experience? If a philosopher argues for two subjects, let us ask: do they mean two agents, or two phenomenological fields?

  We are not here to settle this. I certainly do not know the answer. If I did, I would give a keynote tomorrow instead of an opening remark today. The science is complex, and the philosophy is thorny. But if we can agree to keep these two concepts distinct, we might find that the data speaks more clearly.

  We have a responsibility to be precise. Not just for the sake of our theories, but for the sake of the people whose lives ground those theories. We owe it to the patients, past and present, to ensure that when we say "the mind," we know what we are talking about.

  Thank you. Let's begin.

  ***

  **Private Note on Claims and Sensitivities**

  **1. The Core Distinction (Unity of Control vs. Unity of Experience)**
  *   **Status:** This is a philosophical framework, not settled science. It aligns closely with work by philosophers like Tim Bayne (e.g., *The Unity of Consciousness*), who distinguishes between phenomenal unity and functional unity.
  *   **Risk:** Neuropsychologists may push back that "experience" is inaccessible and therefore not a valid category for empirical discussion. You are framing it as a conceptual tool for the workshop, which mitigates this, but be prepared for some clinicians to reject the "experience" half of the dichotomy as unscientific.
  *   **Liberty:** The speech presents these as cleanly separable. In reality, they may be deeply entangled (e.g., proprioceptive feedback links experience to control). You are asking the room to treat them as distinct *heuristically*, which is acceptable for an opening remark.

  **2. The Claim: "Troubling for Experience, Weaker Against Control"**
  *   **Status:** Highly Contested.
  *   **The Debate:** The "two minds" view (that split-brain patients have two distinct streams of consciousness) was the dominant view for decades (e.g., Gazzaniga, Sperry). However, recent work (e.g., by Elizabeth Schechtel, Tim Bayne, and others) argues that there is still a significant degree of phenomenal unity, or that the "two minds" view is an oversimplification of the data. Some researchers argue that even phenomenal unity is preserved in many contexts.
  *   **Risk:** You are taking a side here, albeit gently ("My own suspicion"). The clinicians who work directly with patients often emphasize the *integrity* of the person (unity of control) and may resist the implication that the patient's inner life is fragmented. Conversely, philosophers who argue for robust disunity might feel you are conceding too much to the clinicians.
  *   **Mitigation:** You explicitly state "I emphasize this is a suspicion, not a conclusion." Keep this humility in your tone during the Q&A.

  **3. Patient Sensitivity**
  *   **The Acknowledgement:** The speech acknowledges the patient and her husband without defining them by their condition. This is crucial.
  *   **Potential Pitfall:** The phrase "former patient" is accurate but ensure your tone doesn't suggest they are "healed" from being split-brain, but rather that the surgery is in the past.
  *   **The "Specimen" Risk:** The line "We are not here to define you" is essential. Do not deviate from this. During the break, do not allow others to corner them with technical questions unless they initiate.
  *   **Liberty:** The speech implies the data comes from "their history." Be careful not to imply *her* specific data is the sole focus of the workshop unless it is. If the workshop discusses historical cases (like W.J. or V.P.) and she is a modern patient, ensure she doesn't feel she is being conflated with historical subjects who were often treated less ethically.

  **4. Scientific Accuracy**
  *   **Settled:** Commissurotomy impairs interhemispheric transfer of specific sensory/motor information. Daily life functioning often remains surprisingly intact (unity of control is largely preserved behaviorally).
  *   **Contested:** Whether the impairment implies two conscious subjects. Whether "unity of consciousness" is a binary state or a gradient.
  *   **Liberty:** The speech suggests the distinction will "make the data speak more clearly." Some might argue the data is clear and the interpretation is the problem. You are framing the *conceptual framework* as the variable, which is safe for a philosopher to do.

  **5. Delivery Advice**
  *   **Eye Contact:** When welcoming the patient and husband, look at them, but then look back at the room. Do not stare at them during the theoretical parts.
  *   **Pacing:** 8 minutes is longer than you think. Do not rush. The pauses after "Unity of Control" and "Unity of Experience" are vital for the clinicians to register the terms.
  *   **Defensiveness:** If a clinician challenges the "Unity of Experience" concept during the workshop, do not defend it as empirical fact. Reiterate that it is a *question* you are asking the group to investigate.
