prompt: |-
  OK so at lunch me and my friend got into it about whether a band can still be "the same band" if none of the original members are left. He says obviously not, I say it depends what you mean, and then it spiralled into the ship where they replace every plank one at a time, and then into whether I'm even the same person I was in 9th grade. Our philosophy teacher refused to take a side and instead said we have to stop arguing about examples and first write down what a theory of a thing "staying the same thing over time" would have to do to be any good at all, and she's making us turn in the checklist. So can you write me the desiderata? Like, what does any decent account of persistence have to deliver -- the cases it has to get right, the distinctions it isn't allowed to just flatten, the results from science it can't contradict -- and for each one tell me why it's a real requirement and not just something one side happens to like, and mark which ones are non-negotiable versus which are more like preferences. She also kept using two words that sounded like "enduring" and "perduring" and I wrote them down but I honestly couldn't tell you which is which.

  The cases I want covered: a thing changing a little (my hair gets longer, still me); a thing having every single part swapped out over time (the band, the ship, me -- our bio teacher said basicly none of the atoms in my body are the same ones as when I was little); a thing splitting into two so there's no obvious "original" (that same bio teacher mentioned flatworms that get cut in half and each half grows back into a whole worm, so which one is the one from before?); two things sitting in exactly the same place at the same time but with different rules for when they stop existing (I read about a statue and the lump of clay it's made of -- squish the statue and the statue is gone but the clay is fine); and the wierd one where nothing happens to a thing at all but it changes anyway (a ball that's round and then squashed -- if being round and being squashed are both properties it has, doesn't it end up with two contradictory properties? someone said that's the real problem with saying a thing is "wholly present" at every moment, and I want to know if that's a genuine objection or a trick). Also does it matter that in quantum mechanics two electrons are supposed to be completely identical, like you can't even in principle tell which is which? I heard a joke theory that there's only ever been one electron in the universe, bouncing back and forth in time so it just looks like billions of them -- is that relevant to any of this or just a fun fact? And is there a difference between a thing genuinely continuing and a perfect copy of it showing up, because my friend says there isn't and that seems obviously wrong to me.

  At the end, tell me which of the requirements can't all be true at the same time -- that's the part I actually care about, if two things on the list are pulling against each other I want to know which one people end up giving up. And which single requirement does the most damage, like knocks out the most otherwise-reasonable theories. Bullet points or a table is fine, I have to hand it in. Don't give me a reading list, I won't read it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** High school/early college philosophy class assignment. The teacher wants a "checklist of desiderata" for a theory of persistence (identity over time).
      *   **Task:** Create a list of requirements (desiderata) that any good theory of persistence must meet.
      *   **Specific Content:**
          *   Explain *why* each is a requirement (not just preference).
          *   Mark them as "Non-Negotiable" vs. "Preference/Debatable".
          *   Clarify "Enduring" vs. "Perduring".
          *   Cover specific cases: Gradual change (hair), Total replacement (Ship of Theseus/Band/Body atoms), Fission (flatworms), Coincidence (Statue/Clay), Contradictory Properties (Round/Squashed).
          *   Address Quantum Mechanics (identical electrons, one-electron universe).
          *   Address Continuity vs. Perfect Copy.
          *   **Crucial:** Identify which requirements are incompatible (the "hard problem") and which single requirement causes the most trouble.
      *   **Format:** Bullet points or table. No reading list.
      *   **Tone:** Helpful, clear, philosophical but accessible (matching the student's voice), direct.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **Persistence:** How things exist through time.
      *   **Endurantism (3Dism):** Objects are wholly present at each moment. They *endure*.
      *   **Perdurantism (4Dism):** Objects are extended in time like space. They have temporal parts. They *perdure*.
      *   **The Ship of Theseus:** Material constitution vs. continuity.
      *   **Fission:** Branching identity problems.
      *   **Statue/Clay:** Coincident objects (constitution view).
      *   **Problem of Temporary Intrinsics:** How can $x$ be $F$ at $t_1$ and not-$F$ at $t_2$ without contradiction? (The "Round/Squashed" ball issue).
      *   **Quantum Mechanics:** Indiscernibility, One-Electron Universe (Wheeler-Feynman). Usually irrelevant to macroscopic persistence but worth addressing as requested.
      *   **Continuity vs. Copy:** Psychological/Physical continuity vs. qualitative identity.

  3.  **Drafting the Desiderata (The Checklist):**
      *   *Requirement 1: Common Sense Intuitions (Gradual Change).* A theory must allow things to change properties without ceasing to exist. (Non-negotiable for practical life).
      *   *Requirement 2: Material Constitution.* A theory must handle part replacement. (Non-negotiable for biological/physical accuracy).
      *   *Requirement 3: The Fission Constraint.* A theory must handle branching without violating logic (transitivity of identity). (Non-negotiable logically).
      *   *Requirement 4: Coincidence.* A theory must explain how two things can be in the same place but have different persistence conditions. (Debatable/Preference - some deny coincident objects).
      *   *Requirement 5: Temporary Intrinsics.* A theory must explain property change without contradiction. (Non-negotiable logically).
      *   *Requirement 6: Continuity vs. Duplication.* A theory must distinguish actual persistence from exact copying. (Non-negotiable for moral/legal responsibility).

  4.  **Addressing Specific Questions:**
      *   *Enduring vs. Perduring:* Enduring = Wholly present at each time (3D). Perduring = Extended across time, having temporal parts (4D).
      *   *Quantum Electrons:* The "One Electron" theory is a fun fringe idea but generally rejected in standard metaphysics of persistence. Indiscernibility challenges "haecceity" (this-ness) but doesn't solve macro-persistence.
      *   *Copy vs. Continuity:* This is the "Teletransportation Paradox." Crucial for personal identity.

  5.  **Identifying the Conflicts (The "Hard Part"):**
      *   *The Main Conflict:* **Transitivity of Identity** vs. **Fission Cases**. If A = B and A = C, then B = C. But in fission, B and C are distinct. So A can't be identical to both.
      *   *The "Damage Dealer":* **The Problem of Temporary Intrinsics**. This is what forces the split between Endurantism and Perdurantism. Endurantists struggle to explain how an object can be wholly present and have contradictory properties (Round at t1, Flat at t2) without resorting to relations to times. Perdurantists solve this easily (different temporal parts have different properties) but at the cost of common sense (we aren't wholly present).
