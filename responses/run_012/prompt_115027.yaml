answer: |-
  **Total Credence: 0.48**

  I assign a 48% credence that the paradox of deontology admits a genuine solution that preserves both the stringency of constraints and their non-aggregability, without collapsing into a dissolution that abandons one of these core features. Below is the decomposition of this probability.

  ### Decomposition of Credence

  **(i) Probability the tension is an artifact of value-language: 0.95**
  The paradox arises most sharply when deontological constraints are translated into the language of "value" or "goodness" (e.g., "violations are bad, so minimize them"). If morality is fundamentally about the *right* (governing the will) rather than the *good* (governing states of affairs), the demand to aggregate violations is a category error. The tension is real only if one assumes a monistic theory of practical reason where all norms must compete on a single scale of impersonal value. Since pluralism about practical reasons is coherent, the inconsistency is likely linguistic/conceptual rather than ontological.

  **(ii) Probability an independently motivated account of practical reasons exists: 0.90**
  There are robust, independently motivated frameworks for non-aggregative reasons. Agent-relative reasons (Nagel), second-personal authorities (Darwall), and contractualist justifications (Scanlon) do not rely on *ad hoc* maneuvers to block aggregation. They arise from plausible phenomenologies of agency, the structure of interpersonal claims, and the conditions of mutual justifiability. The resources to justify non-aggregation exist outside the desire to save deontology.

  **(iii) Probability such an account preserves stringency: 0.70**
  This is the primary bottleneck. Many accounts successfully justify non-aggregation but reduce constraints to "agent-centered prerogatives" (I am *permitted* not to kill, but not *required* to sacrifice myself to stop killing) or matters of "integrity" (killing corrupts *me*). True deontological stringency requires that the constraint binds even when the cost to the agent is high and the benefit to others is massive, without reducing the constraint to a tie-breaker. Maintaining this objective binding force without recourse to impersonal value is difficult; many accounts slide into a hybrid view where constraints are merely weighted heavily rather than absolute.

  **(iv) Credence in the specific resolution I endorse: 0.80**
  Conditional on (i)–(iii) being satisfied, I assign an 80% probability to the specific resolution detailed below (a normative apportionment of responsibility grounded in second-personal authority). This is the most viable candidate among the available options for securing stringency without aggregation.

  **Calculation:** $0.95 \times 0.90 \times 0.70 \times 0.80 \approx 0.48$.

  ### Sensitivity Analysis

  The total credence is most sensitive to **term (iii): the probability that the account preserves stringency.**

  Terms (i) and (ii) are relatively stable; the category error of value-language is widely acknowledged, and agent-relative reasons are logically coherent. Term (iv) is conditional on the success of the framework. Term (iii), however, is the point of failure for most deontological projects. If the justification for constraints appeals to the agent's own "moral purity" or "integrity," stringency dissolves into self-regard. If it appeals to "rules of thumb" for maximizing value, non-aggregability dissolves. To maintain that *I must not violate a right even to prevent five others from violating rights* requires a justification that is neither self-indulgent nor covertly consequentialist.

  **Argument to Move Term (iii):**
  The term would be most moved by a successful defense of **Second-Personal Authority** (e.g., Stephen Darwall's framework). If rights are understood as valid claims that individuals hold *against* agents, then I cannot violate Person A's right to prevent Person B from violating Person C's right. To do so would be to presume an authority over Person A's claim that I do not possess. Person A's claim excludes me from using them as a means, regardless of the consequences for others' claims. This grounds stringency in the *structure of the relationship* rather than the *weight of the outcome*, preserving non-aggregability without retreating into agent-centered integrity. A case demonstrating that violating a constraint undermines the very normative standing required to make moral claims (a "performative contradiction" of the moral community) would significantly raise the probability here.

  ### Assessment of the "Responsibility Apportionment" Candidate

  **The Candidate:** Constraints are justified not by the impersonal badness of violations but by the way they apportion responsibility across agents, so that each agent answers only for her own deeds, and that apportionment is itself what makes the constraint bind.

  **Assessment:**
  This candidate succeeds, but only if "responsibility" is understood normatively rather than empirically.

  **Why it succeeds:**
  If responsibility is merely a ledger of causal impact, the paradox relocates: "Why is my causal impact on one person worse than five others' causal impact on five people?" However, if responsibility is constitutive of agency—the idea that morality governs *what I do*, not *what happens*—then the apportionment is not a puzzle to be solved but the definition of the moral domain. On this view, the "paradox" only exists if one assumes morality is about minimizing bad states of affairs. If morality is about respecting the status of persons as ends-in-themselves within a community of agents, then I cannot "trade" a violation by me for violations by others, because I have no jurisdiction over the others' agency. I am sovereign over my own will, and the constraint marks the boundary of that sovereignty. This preserves stringency (I *must* respect the boundary) and non-aggregability (the boundary is not a fungible resource).

  **Why it might relocate the paradox:**
  The risk is that this view appears to privilege the agent's "clean hands" over the victims' lives. If the justification is "I must keep my ledger clean," it risks collapsing into the integrity objection (term iii failure). It sounds as though I care more about my moral status than the victim's survival.

  **Verdict:**
  It does not merely relocate the paradox, provided the apportionment is grounded in the **victim's standing**, not the **agent's purity**. The constraint binds not because *I* need to remain pure, but because *the victim* has a claim against *me* that no one else has. The "ledger" is not mine; it is interpersonal. When I violate a right, I violate a specific relation. Preventing others from violating rights does not negate the specific violation I commit. Therefore, the puzzle about "why my ledger weighs more" is dissolved: it doesn't weigh more; it weighs *differently*. It measures a direct normative breach, whereas the other violations measure breaches by other agents over which I have no direct control.

  This preserves stringency because the breach is absolute (you either respect the claim or you don't), and non-aggregability because claims are held by distinct individuals and cannot be summed without negating the distinctness of the persons holding them.
