      *   *Apparent:* (3) and (4). MEA often *leads* to Probabilism. They usually work together.
      *   *Real:* (4) & (5) vs. (6). This is the hard problem. Standard accuracy arguments *prove* you should be certain of tautologies. Denying that breaks the dominance arguments.
      *   *Real:* (4) & (5) vs. (7). If the norms require logical omniscience, and we can't do that, (7) kills the norms.

