  3.  **Identify Tensions/Conflicts:**

      *   **Tension A: Probabilism (4) vs. Logical Non-Omniscience (6).**
          *   *Why:* Standard accuracy arguments for Probabilism (Joyce 1998, Predd et al. 2009) assume the algebra of propositions is a Boolean algebra and that logical truths get probability 1. If you violate probability axioms (e.g., $P(A \lor \neg A) < 1$), you are accuracy-dominated. But (6) says you *can* be less than certain of a tautology. If you are less than certain, you violate Probabilism. If you violate Probabilism, (4) says you are irrational (dominated).
