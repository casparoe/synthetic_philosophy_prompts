              *   *Cost:* Weakens the argument for Probabilism. No longer a hard norm.
          *   *Option 3:* Give up standard scoring rules (2). Use scoring rules sensitive to computational cost or logical uncertainty.
              *   *Cost:* Technical complexity, might lose strict propriety.
          *   *Option 4:* Give up Accuracy Monism (1). Allow coherence as a separate good.
              *   *Cost:* Betrays the "Accuracy First" project.

      *   *Fixing the (5) Conditionalization issue:*
          *   Conditionalization usually assumes you know what you learned. If you aren't logically omniscient, you might not know that $E$ entails $H$.
          *   *Cost:* Need a theory of "logical learning."

