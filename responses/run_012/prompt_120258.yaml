      *   **Tension B: Maximize Expected Accuracy (3) vs. Logical Non-Omniscience (6).**
          *   *Why:* To calculate expected accuracy, you need to weight possible worlds by your credences. If you aren't logically omniscient, your credences might not sum to 1 over a partition, or you might assign 0 to a possibility that turns out to be the actual world (if it's a logical possibility you didn't recognize). More deeply, MEA usually presupposes probabilism to make sense of the expectation. If you aren't probabilistic, "expected accuracy" is ill-defined or leads to paradoxes.
