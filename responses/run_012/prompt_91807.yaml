  2.  **Deconstruct the User's Puzzles:**
      *   *Puzzle 1 (Binary vs. Compromise):* Is the binary nature of referendums a bug or a feature? (Institutional Design/Normative Value).
      *   *Puzzle 2 (Jury vs. Principal):* Epistemic vs. Volitional conception of democracy. (Legitimacy Theory).
      *   *Puzzle 3 (Intertemporal Will):* Can "the people" bind future "people"? (Temporal Sovereignty).
      *   *Puzzle 4 (Majority vs. Status Quo):* The counterfactual baseline problem. (Legitimacy/Mandate).

  3.  **Initial Assessment of the Field:**
      *   Direct democracy theory is often split between *political science* (empirical effects, voter behavior) and *political philosophy* (legitimacy, representation, sovereignty).
      *   The foundation wants *philosophy and theory*, not polling data.
      *   The user's background in *hazard assessment* is key. He understands probabilistic risk, low-frequency high-impact events, and the difficulty of modeling things that haven't happened yet. This is a strong analogy for constitutional crises or democratic breakdowns.
      *   *Critique of User's Framing:* The user focuses heavily on the *referendum* as an isolated event. However, the prompt mentions "citizens' assemblies" and "that family of institutions." The most vibrant theoretical work right now is on *hybridity* (sortition + election + referendum). Focusing solely on the referendum might be looking at the seismic fault line without studying the tectonic plates.
      *   *The "Upstream" Question:* Before asking how a referendum works, we must ask *what work it is supposed to do* in a constitutional order. Legitimacy is the bedrock.

  4.  **Developing the Criteria:**
      *   **Foundational Priority (Upstreamness):** Does solving this make other questions easier or irrelevant?
      *   **Tractability (Philosophical Yield):** Can this be advanced by argument/case study in 3 years? (Avoiding empirical quagmires).
      *   **Institutional Impact (Downstream Consequence):** Does the answer change how we design rules?
      *   **Conflict:** High impact questions are often low tractability (e.g., "What is legitimacy?"). High tractability questions are often niche (e.g., "Wording effects on Proposition X"). I need to balance these. I will prioritize *Foundational Priority* over *Tractability*, acknowledging the risk.

  5.  **Drafting the Agenda (Iterative Process):**

      *   *Attempt 1 (Sticking to User's Puzzles):*
          1.  Jury vs. Principal (Legitimacy).
          2.  Binary vs. Compromise (Design).
          3.  Time/Will (Constitutionalism).
          4.  Baseline (Mandate).
          *Critique:* This is too linear. The "Jury vs. Principal" question is the meta-question. But is it the *most* important? Maybe the "Unit of Agency" (Who is 'the people'?) is more upstream.

      *   *Attempt 2 (Integrating Hybridity):*
          The user mentioned citizens' assemblies. The biggest theoretical gap is how direct democracy fits with *representative* democracy and *sortitive* bodies.
          *Core Problem:* The "Chain of Authorization."
          *Agenda:*
          1.  The Theory of the Mandate (What does a vote authorize?).
          2.  The Temporal Problem (Binding the future).
          3.  The Institutional Ecology (Referendums vs. Assemblies vs. Legislature).

      *   *Refining for the Geophysicist:* Use the hazard assessment analogy. We are assessing the risk of democratic failure. We need to know where the stress points are.
      *   *The "Upstream" Winner:* **The Nature of the Democratic Mandate.** (User's Puzzle 2 & 4 combined). If we don't know what a vote *is* (epistemic vs. volitional), we can't know if binary choices are bad or if binding the future is wrong.
      *   *The "Second Order":* **Constitutional Time.** (User's Puzzle 3). Once we know what a vote is, does it expire?
      *   *The "Third Order":* **Institutional Hybridity.** (User's Puzzle 1 + Citizens' Assemblies). How do we fix the binary problem?

  6.  **Addressing the User's Puzzles specifically:**
      *   *Puzzle 1 (Binary):* Live problem, but downstream. Depends on what the vote is for.
      *   *Puzzle 2 (Jury/Principal):* **The Critical Upstream Question.** This determines everything.
      *   *Puzzle 3 (Time):* Live, high stakes (constitutional rigidity).
      *   *Puzzle 4 (Baseline):* Pseudo-problem? Or rather, a symptom of Puzzle 2. If it's volitional, the baseline doesn't matter as much as the expression. If epistemic, the baseline matters hugely.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the background (hazard assessment analogy is gold). Validate the task.
      *   **Criteria Statement:** Explicitly define the trade-offs (Importance vs. Tractability).
      *   **The Agenda (3 Projects):**
          *   Project 1: The Ontology of the Vote (Jury vs. Principal).
          *   Project 2: The Temporal Boundaries of Popular Sovereignty.
          *   Project 3: The Ecology of Institutions (Binary vs. Deliberative).
      *   **Critique of User's Puzzles:** Map them to the agenda. Identify the pseudo-problem.
      *   **Evidence/Triggers:** What would shift the priorities?
      *   **Framing Challenge:** Is "Philosophy of Referendums" too narrow? Suggest "Philosophy of Democratic Authorization."

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I answer the "ordering" requirement? Yes, by showing dependency.
      *   *Check:* Did I address the "8 researchers for 3 years" constraint? Yes, by grouping into 3 major clusters (roughly 2-3 researchers each).
      *   *Check:* Is the tone right? Needs to be peer-to-peer, not patronizing. Use the seismic analogy.
      *   *Key Insight:* The user asks about "direct democracy." The biggest theoretical hole right now isn't the referendum itself, it's the *interface* between direct and representative democracy. A referendum doesn't happen in a vacuum. I need to make sure Project 3 covers this.
      *   *Re-evaluating Puzzle 4:* The "Baseline" problem. Is it a pseudo-problem? It feels like a category error. A referendum isn't a measurement of utility; it's a switch. I should argue this is downstream of the "Jury/Principal" question.

  9.  **Final Polish:** Ensure the distinction between "Philosophy" and "Political Science" is maintained (as per foundation rules), but acknowledge where they touch. The user knows data is hard; emphasize *conceptual clarity* as the deliverable.

      *(Self-Correction on the "Pseudo-problem"):* I need to be careful calling one of his puzzles a "pseudo-problem." It might be better to call it "derivative." Puzzle 4 (Baseline) is derivative of Puzzle 2 (Jury/Principal). If the vote is a command (Principal), the baseline is irrelevant. If it's a truth-finding mission (Jury), the baseline is crucial. So Puzzle 2 *must* come first.

      *(Final thought on the Geophysicist analogy):* Use the concept of "recurrence intervals" and "fault lines." The "Time" question is about recurrence intervals. The "Legitimacy" question is about the stress accumulation.

