      *   *Refining the "Circularity" point:* I need to be careful here. If I say "Defer to future self if they are rational," and my standard of rationality is "believes what is true," it's circular. But if my standard is "updates via conditionalization," it's structural. I should mention Bas van Fraassen's own response to this (he actually accepts the counterexample and limits the principle). I should also mention David Christensen's work.

      *   *Refining the "Drugs" point:* Use the concept of "screening off." The pill screens off the connection between $H$ and the future belief. Evidence does not.

  8.  **Final Polish:** Check against the user's specific constraints. They want to keep RP if possible. I need to show them a version of RP they *can* keep. The "Rational Reflection Principle" is the best candidate.

