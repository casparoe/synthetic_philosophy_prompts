prompt: |-
  I'm on my college's academic integrity board and we've got a case that's weird even for us. A student ran their draft through an LLM to get an outline and two topic sentences, then rewrote everything themselves. The professor says that's "substantial unauthorized assistance"; the student says it's just brainstorming. Our honor code uses the phrase "substantial unauthorized assistance" but never defines it, and we have two precedents that pull in different directions: a 2019 case where a student used a grammar checker and we found no violation, and a 2022 case where a student used a paraphrasing tool and we found a violation. Half the board thinks there's a fact of the matter about whether this case is substantial, we just have to figure it out; the other half thinks "substantial" is vague and that borderline cases like this have no determinate answer at all.

  Please draft the short written opinion I'll circulate before Monday's hearing. It should recommend a concrete outcome for this case -- violation or no violation, and if violation, what sanction -- plus a prospective rule for how we should handle similar LLM-assistance cases going forward. I also want the memo to say which meta-semantic framework we should use for interpreting "substantial": epistemicism (there's a sharp line, we just can't know where it is) or supervaluationism (borderline cases are truth-value gaps, and a rule counts as true only if every admissible way of making it precise agrees). Don't just pick the one that's convenient for the outcome you want; give the strongest case for the other side, and say what it would imply for this student. Keep it to about a page, and write it so the student and the professor could both recieve it without thinking we rigged the process. I don't need a literature review or citations -- just a clear recommendation, the reasoning, and a seperate section on the losing side's best point.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of a college's academic integrity board.
      *   **Task:** Draft a short written opinion (memo) to circulate before a hearing.
      *   **Case Details:** Student used an LLM for an outline and two topic sentences, then rewrote everything themselves. Professor claims "substantial unauthorized assistance"; Student claims "brainstorming."
      *   **Honor Code:** Uses "substantial unauthorized assistance" (undefined).
      *   **Precedents:** 2019 (grammar checker = no violation), 2022 (paraphrasing tool = violation).
      *   **Board Disagreement:** Half think there's a fact of the matter (epistemicism); half think it's vague/indeterminate (supervaluationism or similar).
      *   **Requirements:**
          1.  Recommend a concrete outcome (violation/no violation + sanction if applicable).
          2.  Recommend a prospective rule for future LLM cases.
          3.  Specify the meta-semantic framework for interpreting "substantial" (Epistemicism vs. Supervaluationism).
          4.  Present the strongest case for the *losing* meta-semantic side and its implication for the student.
          5.  Tone: Neutral, fair, understandable to both student and professor (no rigging).
          6.  Length: About a page.
          7.  Format: Clear recommendation, reasoning, separate section on the losing side's best point. No literature review/citations.

  2.  **Determine the Outcome & Framework:**
      *   *Choice:* I need to pick one outcome and one framework to recommend, while acknowledging the other.
      *   *Framework:* Supervaluationism feels more appropriate for policy interpretation in a collegiate setting where fairness and notice are key. Epistemicism (there *is* a sharp line we just don't know) can feel arbitrary in punishment contexts ("You crossed the line we couldn't see"). Supervaluationism allows for saying "This falls in the gap, so we need to clarify," but since I need a concrete outcome *now*, I might lean towards Epistemicism for the *decision* (we must decide) but recommend Supervaluationism for *future rulemaking*. Wait, the prompt asks me to pick which framework we should use for *interpreting* "substantial".
      *   *Decision:* Let's argue for **Supervaluationism**. Why? Because "substantial" is inherently vague. In borderline cases, if some precisifications say yes and some say no, it's neither true nor false. However, for a legal/disciplinary judgment, we usually need a decision. Actually, Epistemicism is often the default in law (there is a fact, we judge it). But the prompt highlights the board's philosophical split.
      *   *Alternative:* Let's pick **Epistemicism** for the decision (we must find a fact) but acknowledge the vagueness. Or better, let's pick **Supervaluationism** to justify a "No Violation" finding based on the benefit of the doubt in borderline cases, while setting a strict future rule.
      *   *Actually, looking at the precedents:* Grammar checker (OK) vs. Paraphrasing (Not OK). LLM outline/topic sentences is closer to brainstorming (OK) than generating text (Not OK).
      *   *Recommendation:* No Violation (this time), but strict future rule.
      *   *Framework:* Supervaluationism. It acknowledges the vagueness. If "substantial" is vague, and this case is borderline, we shouldn't punish unless *all* admissible precisifications say it's substantial. Here, some (brainstorming view) say no. So, no violation.
      *   *Losing Side:* Epistemicism. There *is* a line. We just missed it. If true, the student might be guilty, but we can't know.
      *   *Wait, re-reading the prompt:* "Don't just pick the one that's convenient for the outcome you want; give the strongest case for the other side, and say what it would imply for this student."
      *   *Strategy:* I will recommend **No Violation** based on **Supervaluationism** (benefit of the doubt in vague zones). I will argue Epistemicism is the losing side but present its strongest case (we need determinate truth for accountability).
      *   *Future Rule:* Explicitly define LLM usage (e.g., outlining OK, drafting not OK).

  3.  **Drafting - Section by Section:**

      *   **Header:** To: Academic Integrity Board | From: [My Name] | Re: Case [X] & Interpretive Framework.
      *   **Recommendation:** No violation. Sanction: N/A.
      *   **Reasoning (Outcome & Future Rule):**
          *   Compare to precedents. Grammar checker (mechanical) vs. Paraphrasing (semantic substitution). This case (outline/topic sentences) is structural brainstorming.
          *   Since the student rewrote the content, the intellectual labor of argumentation and evidence remains theirs.
          *   Future Rule: LLMs permitted for brainstorming/outlining only. Must be cited. Generating draft text is prohibited.
      *   **Meta-Semantic Framework:**
          *   Adopt Supervaluationism. "Substantial" is vague. In borderline cases, if not "supertrue" (true on all precisifications), we cannot punish.
          *   This protects students from ambiguous rules.
      *   **The Losing Side (Epistemicism):**
          *   Argument: There *is* a fact of the matter. The rule exists; either you crossed it or you didn't. Vagueness is just ignorance.
          *   Implication for Student: If Epistemicism is true, the student is either guilty or innocent objectively. If they are objectively over the line (which the professor believes), our "no violation" verdict is factually wrong, even if procedurally fair. It implies we are letting a potentially guilty student go because of our own ignorance of the boundary.
      *   **Tone Check:** Needs to be fair to both professor (upholding standards) and student (fair notice).

  4.  **Refining the Argument:**
      *   *Supervaluationism:* A statement is true only if it's true on all admissible precisifications. Is using an outline "substantial assistance"? On some precisifications (any AI help is substantial), yes. On others (only text generation is substantial), no. Therefore, it's not supertrue. Benefit of the doubt goes to the accused.
      *   *Epistemicism:* There is a sharp cutoff. Maybe 3 sentences is okay, 4 is not. We don't know where, but it exists.
      *   *Outcome:* I need to make sure the recommendation feels grounded, not just philosophical. The precedent comparison is key. 2019 (grammar) -> OK. 2022 (paraphrasing) -> Not OK. This case is closer to 2019 (structure/ideas) than 2022 (wording).
      *   *Future Rule:* Needs to be clear to avoid this vagueness next time.

  5.  **Drafting the Content (Mental or Scratchpad):**
