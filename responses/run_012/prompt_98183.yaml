  7.  **Final Polish:** Ensure the distinction between the philosophical framework and the practical ruling is clear. Make sure the professor doesn't feel undermined (acknowledge their concern) and the student doesn't feel lucky (acknowledge the risk).

      *Self-Correction on Framework:* If I choose Supervaluationism, I'm saying "It's not determinately true that this is a violation." If I choose Epistemicism, I'm saying "There is a fact, we just have to guess." For an integrity board, Supervaluationism is more defensible for *leniency* in vague cases (rule of lenity). I will stick with that.

      *Wait, one nuance:* The prompt asks me to recommend which framework we should use *going forward*. So I recommend Supervaluationism for interpretation, but since this is a borderline case under that framework (a gap), I rule No Violation.

