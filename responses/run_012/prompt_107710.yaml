answer: |-
  David Lewis's essay *"Do We Believe in Penal Substitution?"* exposes a critical tension in traditional atonement theology. He argues that while Christians often claim to believe in **Penal Substitution**, a logical analysis reveals they usually hold to a **Debtor Model** instead. The distinction is not merely semantic; it strikes at the coherence of justice, guilt, and transferability.

  Here is a clear comparison of the two models, an analysis of Lewis's arguments regarding transferability and desert, and an evaluation of which version is more defensible.

  ### 1. The Two Models Compared

  | Feature | **The Debtor Model** | **The Punishment Model** |
  | :--- | :--- | :--- |
  | **Nature of Sin** | Sin is a **debt** or obligation owed to God. | Sin is a **crime** or rebellion against God's law. |
  | **Nature of Justice** | Justice requires **payment** or satisfaction of the claim. | Justice requires **retribution** or infliction of pain on the guilty. |
  | **Role of Christ** | Christ is a **payer** who offers a valuable sacrifice to clear the balance. | Christ is a **convict** who receives the sentence deserved by sinners. |
  | **Transferability** | **High.** A third party can legally pay another's debt. | **None.** Punishment is inherently personal and non-transferable. |
  | **Moral Logic** | Commercial/Financial: The account is settled. | Forensic/Legal: The law is vindicated through suffering. |

  ### 2. The Problem of "Punishment" and Desert

  Your question regarding whether the Debtor Model "changes the subject" is central to Lewis's critique.

  **The Punishment Model and Desert:**
  In any coherent theory of justice, punishment is intrinsically linked to **guilt**. To punish someone is to inflict suffering *because* they are guilty of an offense. If the person is innocent, the infliction of suffering is not "punishment"; it is injustice, abuse, or martyrdom.
  *   **The Dilemma:** If Christ is punished, he must be guilty (which contradicts the doctrine of his sinlessness). If Christ is innocent, he cannot logically be "punished," even if he volunteers.
  *   **Lewis's Point:** Lewis argues that we cannot simply detach punishment from personal desert. To say "Christ was punished for sins he didn't commit" is to use the word *punishment* in a way that breaks its logical grammar. It turns God into a judge who knowingly punishes an innocent man, which violates the very justice the model seeks to uphold.

  **The Debtor Model and Compensation:**
  The Debtor Model avoids the problem of desert by changing the category from *retribution* to *satisfaction*.
  *   **Does it change the subject?** Yes. It shifts from a **penal** framework (criminal law) to a **civil** framework (contract law). In civil law, a third party can satisfy a debt without being the one who incurred it.
  *   **Is it legitimate?** It is a legitimate model of *atonement* (at-one-ment), but Lewis argues it is not legitimately *penal*. If you hold the Debtor Model, you should technically call it "Vicarious Satisfaction," not "Penal Substitution." However, it is logically coherent in a way the Punishment Model is not.

  ### 3. Lewis on Transferability: The Knockdown Argument

  Lewis's most potent argument concerns the **transferability of obligations**.

  *   **Debts are Transferable:** If I owe you $100, I am obligated to pay. However, if my friend gives you $100 on my behalf, the debt is extinguished. The creditor (you) does not care *who* provides the money, only that the money is received. The obligation is attached to the *debt*, not the *person*.
  *   **Punishments are Not Transferable:** If I am sentenced to five years in prison, that sentence is attached to *me* as a moral agent. If my friend volunteers to go to prison in my place, two things happen:
      1.  My friend is now being punished (justly, if they volunteer? No, because they committed no crime).
      2.  I am not being punished. The justice system has not exacted retribution *from me*.
      3.  Crucially, **my guilt remains.** Imprisoning an innocent volunteer does not expiate the guilt of the actual criminal.

  **Implication for Belief:**
  Lewis implies that if we insist on the Punishment Model, we are believing in something logically impossible. We are claiming that guilt can be transferred like currency. But guilt is a moral state of the agent, not a commodity. Therefore, Lewis suggests that when Christians say they believe in Penal Substitution, they *think* they mean the Punishment Model, but what they *actually* believe (if they think it through) is the Debtor Model. They imagine Jesus paying a price, not literally absorbing a retributive sentence.

  ### 4. Which Version is More Defensible?

  **The Debtor Model is more defensible logically; the Punishment Model is more defensible theologically (but at a high cost).**

  **Why the Debtor Model wins on Logic:**
  The Debtor Model is the only version that survives Lewis's scrutiny. It respects the distinction between persons. It acknowledges that while I cannot bear your *guilt*, I can bear your *burden*. It aligns with how we understand substitution in every other area of life (insurance, bail, loans). If we value rational coherence, we must admit that Christ's work functions as a satisfaction of a claim (a debt of honor or obedience) rather than a literal absorption of penal wrath.

  **Why the Punishment Model persists:**
  The Punishment Model is often preferred because the Debtor Model can feel too commercial. It risks turning sin into a trivial accounting error and God into a cosmic banker. The Punishment Model captures the gravity of sin as moral rebellion and the seriousness of God's wrath. It resonates with biblical language regarding judgment and wrath more viscerally than the language of finance.

  **The Verdict:**
  **The Debtor Model is the more defensible position.**

  Here is why:
  1.  **Moral Coherence:** The Punishment Model requires us to accept that God punishes the innocent, which undermines the attribute of Divine Justice. The Debtor Model preserves Justice by framing the transaction as voluntary satisfaction rather than retributive infliction.
  2.  **Lewis's Insight:** Lewis shows that the Punishment Model collapses under the weight of its own definitions. You cannot punish a substitute. You can only punish the guilty. Therefore, a "Penal Substitution" in the strict sense is an oxymoron.
  3.  **Theological Honesty:** Adopting the Debtor Model forces theology to be honest about its metaphors. It admits that "Penal Substitution" is a mixed metaphor. It allows us to say Christ bore the *consequences* of sin (death, separation) without claiming he was the *object* of God's retributive punishment in a way that violates justice.

  **Conclusion:**
  David Lewis's analysis suggests that we should retain the **Debtor Model** as the underlying logic of substitution because it is the only one that is transferable and logically consistent. However, we must acknowledge that this changes the subject from "Penal" (punishment) to "Satisfaction" (compensation). To insist on the Punishment Model is to insist on a logical contradiction: that guilt can be transferred and innocence can be punished without injustice. Therefore, the Debtor Model is the only defensible version of substitution, even if it requires us to loosen our grip on the word "Penal."
