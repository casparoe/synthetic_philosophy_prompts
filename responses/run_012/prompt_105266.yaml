answer: |-
  **Exercise: The Tortoise, The Mechanic, and The Judge**

  **Time Allowed:** 65 Minutes
  **Word Limit:** None (but conciseness is valued)

  **Scenario:**
  You are presented with three positions regarding logical inference (specifically *Modus Ponens*: from $P$ and $P \to Q$, infer $Q$).

  1.  **The Tortoise:** Accepts $P$ and $P \to Q$ as true, but refuses to accept $Q$. When offered the rule "If $P$ and $P \to Q$ are accepted, then $Q$ must be accepted," the Tortoise accepts this as a new premise but still refuses to conclude $Q$, demanding yet another premise to license the step. This continues infinitely.
  2.  **The Mechanic:** Argues the Tortoise is merely a machine. To "accept" is just to print tokens into a system. If the machine prints "Accept $P$" and "Accept $P \to Q$" but never prints "Accept $Q$", it is not making a mistake; it is simply a different kind of machine. There is no error, only functional difference.
  3.  **The Judge:** Argues that "accepting" is not a description of internal states but a normative commitment. To accept the premises is to undertake an obligation to accept the conclusion. The Tortoise is not merely different; it is violating the commitment inherent in acceptance.

  **Task:**
  Write an essay that addresses the following four points in order:
  1.  Precisely characterize what the Tortoise is demanding. Explain why the standard reply ("rules of inference are not premises") satisfies one version of this demand but fails against another.
  2.  Adjudicate between the Mechanic and the Judge. Is "accepting a rule" a descriptive fact about a system or a normative commitment?
  3.  Based on (2), determine if the Tortoise is *wrong* or merely *different*.
  4.  Conclude whether the regress is vicious. If you appeal to human nature (e.g., "we are wired this way"), you must explain what work that claim does (e.g., is it a causal explanation or a justification?).

  **Warning:** You must explicitly state your interpretation of the Tortoise's demand in the first paragraph. If you answer a version of the problem you did not define, you will fail the exercise regardless of the quality of your argument.

  ***

  **Model Answer**

  The Tortoise's demand is ambiguous between a request for *justification* and a request for *causal necessitation*. On the justification reading, the Tortoise asks why $Q$ follows from the premises. The standard reply—that inference rules are not additional premises—stops this regress by distinguishing operating principles from content. However, if the Tortoise demands *causal necessitation* (a force that compels the mind to move from premises to conclusion), the standard reply fails. No proposition, whether premise or rule, can causally force a mental act without another rule to apply it. I will treat the Tortoise as demanding causal necessitation, as this is the only version that generates a persistent paradox.

  This distinction forces a choice between the Mechanic and the Judge. The Mechanic treats acceptance descriptively: a system accepts $P$ if it behaves as though $P$ is true. On this view, the Tortoise is merely a machine lacking the transition function to print $Q$. There is no mistake, only architectural difference. The Judge, however, treats acceptance normatively. To accept $P$ and $P \to Q$ is to commit oneself to the truth of $Q$. This commitment is not a psychological push but a standard of correctness.

  I adjudicate in favor of the Judge. Logic is not physics; it does not describe how minds *do* move, but how they *ought* to move. If acceptance were merely descriptive, the concept of "invalid inference" would vanish, replaced by "different inference styles." But we distinguish between valid and invalid reasoning precisely because some moves violate the commitments undertaken by the premises. Therefore, the Tortoise is not merely different; it is wrong. It undertakes the commitment of assertion without honoring the consequences of that commitment.

  Consequently, the regress is vicious only if we seek a causal proof of validity. If we seek justification, the regress stops at the rule because rules are constitutive of the practice, not items within it. Regarding the appeal to being "wired" for logic: this cannot serve as a justification, only as a causal explanation for why we follow the Judge. To say "we are wired to infer" explains why we punish the Tortoise, but it does not justify why the Tortoise is wrong. The justification lies in the normative structure of acceptance itself. I stipulate that logical necessity is a feature of commitments, not neurons. On this reading, the Tortoise fails to grasp the game it is playing, not the mechanics of its own brain.

  ***

  **Marking Scheme**

  | Point | Requirement | Typical Botch |
  | :--- | :--- | :--- |
  | **1** | **Demand Distinction:** Clearly separates justification (why believe?) from causation (what forces belief?). | Conflates the two, treating the regress as purely about missing information. |
  | **2** | **Standard Solution Critique:** Explains why "rules aren't premises" stops justificatory regress but not causal regress. | Claims the standard solution solves the problem entirely without qualification. |
  | **3** | **Mechanic vs. Judge:** Explicitly chooses normative commitment over descriptive functionalism. | Sits on the fence or claims both are equally valid perspectives without consequence. |
  | **4** | **Wrong vs. Different:** Verdict that Tortoise is *wrong* (violating norms) not *different* (functional variance). | Argues Tortoise is rational within its own system (relativism). |
  | **5** | **Viciousness/Wiredness:** Explains that "wiredness" is causal explanation, not normative justification. | Uses "human nature" as a brute justification for logical validity. |

  \answer{Treating logical acceptance as normative commitment rather than causal mechanism.}
