prompt: |-
  Alright, I need a number out of you, not a reading list. My friend and I invented this case to try to pin down where we actually disagree, and we've been at it for two weeks and still can't seperate the real issue from the side ones.

  The case: a coin gets flipped tonight. Two forecasters give you a report on it. You know for a fact that exactly one of them is the real thing -- her number is always the true chance of heads -- and the other is a total fraud whose number is pure noise, generated by something that has nothing to do with the coin. Nobody knows which is which, including the two of them. And they disagree: one says 0.4, the other says 0.6. That is your entire evidence.

  My friend's line: your credence in heads has to be exactly 0.5. It's 0.4 if the expert is the one who said 0.4, it's 0.6 if she's the one who said 0.6, those two possibilities are perfectly symmetric, so 50/50, stop overthinking it. My line: 0.5 is inventing precision the evidence doesn't have. I know the chance is one of two specific values and I have nothing that favors either one, so I hold the whole interval from 0.4 to 0.6, and I definately don't think that's me being wishy-washy -- I think it's the correct state to be in.

  So give me your credence that I'm the one who's right, i.e. that the rational response to this case is an interval rather than the point 0.5. And break it down, a rough number plus one line of reason for each:

  (a) whether rational credences have to be precise at all -- is holding an interval even a coherent thing for a rational agent to do, or is it a failure to make up your mind?
  (b) given that intervals are allowed, does this case *force* one or merely *permit* it? Does the symmetry argument really get you to a point?
  (c) the betting objection: an interval can't tell you what to do unless you smuggle in a tie-breaking rule, so either the view is incomplete or it's a precise credence wearing a costume.
  (d) the deflationary objection: an interval isn't a different kind of mental state at all, it's just a precise credence over a bigger space of hypotheses, so there's no real disagreement here.
  (e) the thing that's been nagging me -- I'm told there are cases where you observe something that is statistically irrelevant to the thing you care about under every single precise hypothesis, and yet your interval for the thing you care about gets wider anyway. If that's real, is it a reductio of the whole framework or just a strange feature you learn to live with? Fold your take on that in as its own term.

  Then combine them, tell me which term you're least confident in, and what argument or result would move it the most. Last thing: my number for the main claim is around 0.65 and hers is basically 0.02, so we're clearly not just haggling over the same picture -- tell me where you think the disagreement actually lives, and whether either of us is defending something indefensible.
