  # The address

  Mira, members of the Roos family, colleagues, students.

  We gather to name this space for Elias Roos. We gather to read. And behind me, carved into the stone, are words that demand we read them as well: *Killed by a law that was never law.*

  I stand here as a friend of this school, and as a friend to Mira. She asked me, in confidence, to stand at this podium and affirm those words. She asked me to say that Decree 40-B was not law. She has spent thirty years arguing that the state had no authority to kill her father, and she wants this room to echo that victory. I love her for that fight. I honor the cost of it. But I cannot speak those words.

  To say that Decree 40-B was not law is to seek comfort. It is to say that what happened in Halven was a mistake, a malfunction, a deviation from the true nature of legal order. It suggests that if we simply define our terms correctly, the state's power to crush us disappears. But Elias Roos did not die because of a malfunction. He died because the system functioned exactly as it was designed to function. The decree was issued by the Directorate. It was enforced by the courts. It was obeyed by the police. It had the pedigree of authority. To deny it was law is to deny the reality of the power that killed him.

  There is a temptation, when we face atrocity, to scrub the record. We want to say that true law cannot be wicked. We want to believe that justice is built into the definition of legality. If we believe that, then what happened to Elias becomes impossible. It becomes a contradiction. But it was not a contradiction. It was a tragedy.

  The wall behind me expresses a moral truth: that such a rule deserved no obedience, that it lacked legitimacy, that it was an affront to humanity. I do not contest that. But I contest the legal claim. If we call it "not law," we obscure the danger. We suggest that the law is inherently safe, that it protects us by its very nature. It does not. Law is a tool. It is a system of rules that can be used to build hospitals or to build camps. It can protect the bookseller or it can silence him.

  By calling it law, we do not honor the decree. We honor the memory of the victim by acknowledging the full weight of what he faced. He was not caught in an error; he was caught in a machine. And if we are to prevent that machine from running again, we must not pretend it was an illusion. We must study its gears. We must understand how a rule can be valid and yet be vile.

  Mira, you wanted this room to be a vindication. I propose it be something harder: a witness. A place where students learn that the badge of legality is not a certificate of justice. When you read in this room, do not look for comfort. Look for clarity. Understand that the law can be weaponized by those who hold the pen. Understand that your duty as lawyers is not to assume the law is good, but to judge it, to challenge it, and sometimes, to refuse it.

  Elias Roos told a joke. He died because the law required silence. Let us not rewrite the law to save our consciences. Let us instead sharpen our consciences to face the law. Let this room remind us that legality is not morality. And let us vow that when the two diverge, we have the courage to know the difference, and the strength to act.

  Thank you.

  # Notes on the choices

  This address maintains the positivist separation of law and morals without dismissing the moral outrage. It concedes the *moral* illegitimacy of the Decree ("deserved no obedience," "vile") but withholds the *legal* concession Mira requested. It explicitly contradicts the inscription's claim that the Decree was "never law," arguing that such a claim obscures the reality of state power.

  The address declines to comfort the room by refusing to validate the natural law intuition that unjust rules are not law. Comforting the family would require agreeing that the system malfunctioned; comforting the academics would require a dry recitation of validity. Instead, the speech chooses a harder truth: the system worked, and that is the horror. It avoids euphemisms like "valid in name only" or "corrupt law," which would smuggle in the concession that it wasn't *really* law. By framing the room as a place of "witness" rather than "vindication," it honors Roos's death without lying about the legal nature of the instrument that killed him. The focus shifts from defining the past to educating the future: clarity over solace.
