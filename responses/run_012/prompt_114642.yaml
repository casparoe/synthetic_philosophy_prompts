prompt: |-
  I sit on the animal-welfare advisory committee of a mid-sized seafood certification body, and we are three weeks out from a board vote on a revision of our farmed-species standard that has turned unexpectedly nasty. Our current standard protects only vertebrates, which means the fastest-growing part of the industry we certify — crustacean aquaculture — sits entirely outside it; the revision would bring decapod crustaceans (shrimp, prawns, crabs, lobsters) and finfish fully inside. The flashpoint is one hatchery practice. The supplier that produces most of the postlarvae we certify induces spawning in its broodstock by cutting off one eyestalk of each female, a routine technique in shrimp hatcheries that no one on the committee can honestly describe as either obviously cruel or obviously harmless. Last night I argued about it for two hours with a friend who runs a small hatchery and who has been quietly furious about this revision for months. His position is roughly this: decapods have no centralised brain and no credible evidence of felt pain, so the committee is indulging in anthropomorphic projection; the eyestalk procedure is a five-second operation performed by trained staff on animals that show no prolonged behavioural deficit; and if we harden the standard, the producers most likely to drop out of certification are exactly the small operators in the countries where we have the least leverage, so the net effect of our scruple would be to move those animals into unregulated markets. I could not articulate, in the moment, why I still felt the revision was right, and I do not want to walk into the board meeting with only a feeling.

  What I need from you is the written opinion I will circulate to the committee before the vote. It should recommend a concrete course of action on the eyestalk provision specifically and on the broader question of whether and how to extend the standard to crustaceans, with a time frame for implementation that the board can actually adopt or amend — a decision, not a survey of considerations. Please work within, and where necessary repair, the framework our drafting group has proposed, which I am not sure survives scrutiny: it sorts species and practices into three tiers according to how likely sentience is, attaches a higher evidentiary threshold for the upper tier, and then argues that where sentience is merely uncertain we should impose only negative duties (do not inflict noxious procedures, do not allow avoidable suffering) while reserving positive welfare provisions for the tier where sentience is well supported. I want you to say whether that asymmetry is defensible or whether it collapses into a way of doing nothing while sounding cautious, and to be explicit about the moral risk we run in each direction — the cost of wrongly extending protections versus the cost of wrongly withholding them.

  The hardest thing, and the part I most need help with, is my friend's objection. Treat it as the serious position it is rather than a barrier to be cleared: if you conclude the eyestalk provision should be prohibited or phased out, you owe an account of why the epistemic and economic points he raises do not defeat that conclusion, and if you conclude it should be permitted, you owe an account of what that concession implies for the rest of the standard. Assume the board knows the biology reasonably well and does not need to be told that shrimp have neurons; the memo is about what we are entitled to do under uncertainty, not about whether invertebrates are interesting. No citations or reading list — I will add those myself.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of an animal-welfare advisory committee for a mid-sized seafood certification body.
      *   **Audience:** The Advisory Committee (peers) and ultimately the Board (decision-makers).
      *   **Context:** Three weeks before a board vote on revising the farmed-species standard. Tensions are high ("unexpectedly nasty").
      *   **Core Issue:** Extending welfare standards to decapod crustaceans (shrimp, prawns, crabs, lobsters).
      *   **Flashpoint:** Unilateral eyestalk ablation (cutting off one eyestalk) to induce spawning in broodstock.
      *   **Opposing View (The Friend):** Decapods lack centralized brains/credible pain evidence (anthropomorphism); procedure is quick/skilled; banning it hurts small operators/developing nations most (moves production to unregulated markets).
      *   **Current Draft Framework:** Three-tier system based on sentience likelihood. Higher evidentiary threshold for upper tier. Uncertainty = negative duties only (do no harm); Certainty = positive duties (provide good conditions).
      *   **Task:** Write a formal written opinion/memo to circulate before the vote.
      *   **Requirements:**
          *   Recommend a concrete course of action (decision, not survey).
          *   Address the eyestalk provision specifically.
          *   Address the broader extension to crustaceans.
          *   Include a timeframe for implementation.
          *   Evaluate the proposed "Three-Tier Framework" (is the asymmetry defensible?).
          *   Explicitly address moral risks (Type I vs. Type II errors in welfare).
          *   Seriously engage with the friend's objection (epistemic & economic arguments), not just dismiss them.
          *   No citations/reading list.
          *   Tone: Professional, ethical, decisive, nuanced, persuasive.

  2.  **Deconstruct the Ethical & Practical Dilemma:**

      *   *The Science:* Decapod sentience is uncertain but plausible. The "no centralized brain" argument is outdated/oversimplified (distributed nervous systems can still mediate nociception and affective states).
      *   *The Practice:* Eyestalk ablation is effective but invasive. It removes hormonal inhibition. Is it painful? We don't know for sure, but it involves tissue damage and physiological stress.
      *   *The Economics:* Certification drives market access. If standards are too high, smallholders drop out. If standards are too low, certification loses credibility ("greenwashing").
      *   *The Framework:* The "Negative vs. Positive" duty split based on uncertainty is the crux. Does "uncertainty = only don't hurt" actually protect anyone? Or does it allow status quo harm under the guise of caution?
      *   *The Precautionary Principle:* If there's a risk of severe suffering, should we act even without proof? Or does acting without proof cause economic harm that leads to *more* suffering elsewhere (leakage effect)?

  3.  **Formulate the Position:**

      *   *Stance:* Support the extension to crustaceans, but with a phased approach to eyestalk ablation.
      *   *Reasoning:* The precautionary principle applies. The cost of being wrong about pain (allowing it) is morally higher than the cost of being wrong about economics (forcing innovation), *provided* the transition is managed.
      *   *Framework Critique:* The proposed asymmetry (Negative duties for uncertain, Positive for certain) is flawed. "Do not inflict noxious procedures" *is* a positive obligation to verify methods. Also, uncertainty demands *more* caution, not less. The framework needs to be tightened to prevent "doing nothing."
      *   *Addressing the Friend:* Acknowledge the economic reality (leakage). Counter with the idea that certification *must* lead improvement, not just ratify current practice. If we can't certify without ablation, we shouldn't certify that product *yet*. Innovation exists (non-ablation spawning).
      *   *Timeframe:* Needs to be realistic. Immediate ban hurts smallholders. Phase-out over 3-5 years allows R&D and adoption of alternatives.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** Clear recommendation.
      *   **Context:** Acknowledge the tension and the stakes.
      *   **The Framework (Tier System):** Analyze the "Negative vs. Positive" duty split. Argue that under uncertainty, the burden of proof should shift to the operator to show *lack* of harm, not the committee to prove harm. The current draft risks paralysis.
      *   **The Eyestalk Issue:** Direct engagement. Acknowledge the friend's points (economic leakage, biological uncertainty). Refute them using the Precautionary Principle. If there's a significant risk of pain, we cannot sanction the procedure indefinitely.
      *   **Economic Counter-argument:** Certification is a market differentiator. If we certify harmful practices, we devalue the label. Smallholders need support to transition, not exemption from welfare.
      *   **Recommendation:**
          1.  Adopt Crustacean Standard (Tier 2).
          2.  Eyestalk Ablation: Phase-out (not immediate ban).
          3.  Timeline: 3 years for large, 5 for small/developing.
          4.  Support: Technical assistance for alternatives.
      *   **Moral Risk:** Explicitly state the cost of inaction (complicity in potential suffering) vs. action (market displacement). Argue the former is worse for the mission.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* Is the phase-out too weak?
      *   *Correction:* No, an immediate ban causes the exact economic harm the friend fears. A phase-out acknowledges the economic constraint without surrendering the ethical principle. It forces innovation.
      *   *Critique:* Is the framework critique too harsh?
      *   *Correction:* Need to be constructive. The tier system is useful for prioritization, but the "negative duty only" clause is a loophole. Reframe it: Uncertainty requires *justification* of invasive practices, not just avoidance of obvious torture.
      *   *Tone Check:* Ensure I'm not attacking the friend personally. Frame it as "the argument raised by stakeholders" or "the economic concern." (Actually, the prompt says "I argued... with a friend." In the memo, I should generalize the argument to maintain professional decorum, while addressing the substance).
      *   *Key Insight:* The friend argues "no evidence of pain." The counter is "evidence is inconclusive, risk is high." In medicine/regulation, we don't proceed with invasive procedures on uncertain subjects without anesthesia/justification.

  6.  **Final Polish:**

      *   Ensure the "Decision, not survey" requirement is met.
      *   Check that the moral risk section is explicit.
      *   Verify the timeframe is concrete.
      *   Make sure the "Negative vs. Positive" duty asymmetry is clearly evaluated.

  7.  **Final Review against constraints:**
      *   No citations? Yes.
      *   Concrete course of action? Yes.
      *   Address friend's objection seriously? Yes.
      *   Address framework asymmetry? Yes.
      *   Tone appropriate for board advisory? Yes.

  *(Self-Correction on the Friend's Argument)*: I need to make sure I don't dismiss the "leakage" argument (smallholders dropping out). That's a valid welfare concern if unregulated markets are worse. The solution is the *phase-out* combined with *support*. This bridges the gap.

  *(Self-Correction on Framework)*: The prompt asks if the asymmetry collapses into "doing nothing while sounding cautious." I should argue that yes, it risks that, unless we define "negative duties" robustly. A negative duty under uncertainty must include a duty to investigate and minimize, not just avoid "obvious" cruelty.

