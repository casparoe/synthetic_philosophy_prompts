prompt: |-
  I'm a novelist — literary fiction, mostly — and a metaphysics question keeps messing with how I write backstory. Take the view that a person's origin is essential to them: the particular sperm and egg that made you aren't just how you got here, they're part of what you are, so a world with a different sperm and egg contains a different person, not you. The rival view says that's wrong: you could have come from a different sperm and egg, because what makes you you is some later fact — psychological continuity, a pattern, whatever — not the source. I know the debate well enogh to get into trouble, but I think in drafts, canon, origin stories, prequels, retcons, alternate-universe fanfic, character arcs, and the weird feeling when a character in draft 2 is 'the same character' with a completely different backstory. You're a philosopher who also knows how novels actually get made: think carefully, and start by brainstorming the best mapping you can between the two views and the novelist's toolkit. Then translate both views into that vocabulary as faithfully as you can, and give me the residue report — what maps cleanly, what only maps with distortion, what has no counterpart at all, and whether the leftover is a defect in the novelist's vocabulary or a sign the philosophers are fudging something. Don't hedge: take a definate line on which translation is better and why. British English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist (literary fiction).
      *   **Problem:** Metaphysical debate about personal identity (Origin Essentialism vs. Psychological Continuity/Patternism) is interfering with writing backstory, drafts, retcons, etc.
      *   **Task:**
          1.  Brainstorm a mapping between the two philosophical views and the novelist's toolkit.
          2.  Translate both views into that vocabulary faithfully.
          3.  Provide a "residue report" (what maps cleanly, what distorts, what's missing).
          4.  Evaluate whether the leftover is a defect in fiction or philosophy.
          5.  **Crucial:** Take a definite line on which translation is better and why (no hedging).
          6.  **Tone/Style:** British English. Philosopher who knows how novels get made.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Origin Essentialism (Kripkean):** You are essentially constituted by your specific biological origin (specific sperm and egg). Change the origin, change the person. Identity is fixed at $t_0$.
      *   **Psychological Continuity/Patternism (Lockean/Parfitian):** You are constituted by memory, personality, psychological connectedness. Origin matters less than the continuity of consciousness or the pattern of traits. Identity is a trajectory.

  3.  **Deconstruct the Novelist's Toolkit:**
      *   *Drafts/Revisions:* Changing details about a character.
      *   *Backstory/Canon:* The established history.
      *   *Character Arc:* The transformation over time.
      *   *Alternate Universes/Fanfic:* Same name/role, different history.
      *   *Retcon:* Changing past facts to suit present narrative.
      *   *Voice/Style:* The linguistic fingerprint.

  4.  **Brainstorming the Mapping:**
      *   *Idea 1: The Text vs. The Performance.* Origin = The first draft? No, too messy.
      *   *Idea 2: The Contract.* Origin = The publishing contract? No.
      *   *Idea 3: The "Character Bible" vs. The "Living Voice".*
          *   Origin Essentialism aligns with a rigid "Character Bible" or "Canon". If you change the birth, it's a different character.
          *   Psychological Continuity aligns with the "Living Voice" or "Reader Recognition". If they sound/think the same, it's them.
      *   *Idea 4: The Draft History.*
          *   Origin Essentialism: The character *is* the specific sequence of words in the final text. Draft 1 Character A $\neq$ Draft 2 Character A.
          *   Psychological Continuity: The character is the *pattern* surviving across drafts.
      *   *Selection:* The most useful mapping for a *writer* dealing with backstory and drafts is **The Draft History vs. The Archetype**.
      *   *Refinement:* Let's use **"The Textual Instance" (Origin)** vs. **"The Narrative Function" (Pattern)**.
      *   *Better Refinement:* Let's look at how a writer *identifies* a character. Is it their *biography* (Origin) or their *agency/voice* (Psychology)?
      *   *Best Mapping:* **The Character Sheet (Origin)** vs. **The Dramatic Presence (Pattern)**.
      *   *Actually, let's go deeper:* **The Genealogy of the Draft** vs. **The Continuity of Consciousness in Reading**.
      *   *Decision:* I will map this onto **The Archive (Canon/Backstory)** vs. **The Experience (Voice/Agency)**.
      *   *Wait, the prompt asks for a mapping between the views and the toolkit.* Let's create a specific conceptual framework. Let's call it **The Ontology of the Draft**.
      *   *View A (Origin):* The Character is the specific history written in the "Canon Draft".
      *   *View B (Pattern):* The Character is the recognizable psychological pattern across "Iterative Drafts".

  5.  **Drafting the Translation:**
      *   *Origin Essentialism:* A character is defined by their fixed backstory (the 'ur-text' of their life). If you change the parents, the trauma, the birthplace in a revision, you have killed the old character and birthed a new one. Retcons are impossible; they are replacements.
      *   *Psychological Continuity:* A character is defined by their voice, choices, and internal logic. You can change their backstory (retcon) as long as their *current* behaviour and psychological trajectory remain coherent. The 'self' is the pattern of action, not the source code.

  6.  **Developing the Residue Report:**
      *   *Clean Map (Origin):* Fanfiction rules, strict canon, prequels.
      *   *Clean Map (Pattern):* Revision process, character arcs, unreliable narration.
      *   *Distortion:* Origin Essentialism struggles with *growth* (if origin is everything, can they change?). Patternism struggles with *consequence* (if origin doesn't matter, does trauma matter?).
      *   *Missing:* The *Reader's* role. Philosophy talks about metaphysical identity; Fiction talks about *recognisability*.
      *   *Defect:* Is it fiction or philosophy? Philosophy seeks truth; Fiction seeks utility. The "defect" is in Philosophy trying to apply binary identity to a gradient medium.

  7.  **Taking a Definite Line:**
      *   Which is better for a novelist? **Psychological Continuity (Patternism).**
      *   *Why?* Because novels are about *change*. Origin Essentialism freezes character. It makes revision impossible (every change kills the character). Patternism allows for the "same character" to evolve, be reinterpreted, and survive the drafting process. It aligns with the phenomenology of reading (we recognise the voice, not the birth certificate).

  8.  **Refining the Tone (British English & Philosopher/Novelist Hybrid):**
      *   Use terms like "fiddle," "rubbish," "properly," "whilst," "amongst."
      *   Maintain intellectual rigour but apply it pragmatically to the craft.
      *   Avoid waffle. Be decisive.

  9.  **Step-by-Step Writing Plan:**
      *   **Introduction:** Acknowledge the itch. It's a real problem.
      *   **The Mapping:** Define the "Novelist's Ontology".
      *   **Translation A (Origin Essentialism):** The "Canon as Genesis" model.
      *   **Translation B (Psychological Continuity):** The "Voice as Identity" model.
      *   **Residue Report:** What fits, what breaks.
      *   **The Verdict:** Pick Patternism. Argue for it based on the nature of narrative time and revision.
      *   **Conclusion:** Practical advice.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I hedge? *Correction:* Ensure the verdict section is punchy and unambiguous.
      *   *Check:* Is the British English natural? *Correction:* Avoid caricature, use standard UK spelling (realise, colour) and idiom.
      *   *Check:* Did I address the "residue"? *Correction:* Make sure to explicitly state if the leftover is a defect in fiction or philosophy. (I'll argue it's a defect in the philosophical application to art).
      *   *Check:* Did I address the "Draft 2 feeling"? *Correction:* Ensure the explanation covers why Draft 2 feels like the *same* person despite changes.

  11. **Final Polish:** Ensure the distinction between "Character as Object" vs "Character as Process" is clear. (Proceed to generate output).

  *(Self-Correction on the "Defect" question)*: The prompt asks whether the leftover is a defect in the novelist's vocabulary or a sign philosophers are fudging. I should argue that philosophers are fudging *context*. They treat identity as a binary switch; fiction treats it as a spectrum of recognition. So the defect is in the philosophical framework's applicability to art.

  *(Final thought on the Verdict)*: I must choose Patternism. Origin Essentialism is death to fiction. If Kripke were right, you couldn't write a sequel where a character lies about their past, because if the past changes, *they* change. That's absurd for storytelling. Patternism is the only one that allows for the *novel* to exist as a temporal art form.

  Let's write.
answer: |-
  Right. Let's cut through the fog. You're experiencing a collision between metaphysical rigidity and the fluid necessity of craft. It's a proper headache, because both positions feel intuitively correct at different stages of the writing process. When you're world-building, Origin Essentialism feels like the bedrock. When you're three drafts in and the character has taken on a life of their own, Psychological Continuity feels like the only thing keeping them alive.

  Here is the mapping, the translation, and the verdict.

  ### 1. The Mapping: The Novelist's Ontology

  To make this useful, we must stop treating the character as a person and start treating them as a **textual construct**. We need two buckets for your toolkit:

  1.  **The Biography (The Data):** This is the backstory, the canon, the 'facts' of the character's history (parents, birthplace, trauma, the specific sperm and egg equivalent). In your files, this is the character sheet, the timeline, the wiki entry.
  2.  **The Agency (The Signal):** This is the voice, the decision-making pattern, the moral grammar, the rhythm of thought. In your files, this is the dialogue, the interior monologue, the scene-level action.

  Now, we translate the philosophical positions into these terms.

  ### 2. The Translations

  **View A: Origin Essentialism $\rightarrow$ The Biography as Genesis**
  Under this translation, the character *is* their Biography. The specific causal chain that produced them is their identity.
  *   **In Practice:** If you write a prequel where the character's mother dies in 1990, and in Draft 2 she dies in 1995, you have not revised the character; you have murdered Character A and created Character B.
  *   **Retcons:** Impossible. A retcon is a lie. If the backstory changes, the person changes.
  *   **Drafting:** Draft 1 Character and Draft 2 Character are distinct entities. You cannot say "I improved him"; you must say "I replaced him."
  *   **Fanfiction:** Strictly impossible. An Alternate Universe (AU) version is a doppelgänger, not the same person.

  **View B: Psychological Continuity $\rightarrow$ The Agency as Pattern**
  Under this translation, the character *is* their Agency. Identity is a trajectory of consciousness, not a point of origin.
  *   **In Practice:** If you change the mother's death date from 1990 to 1995, but the character's resulting grief, cynicism, and voice remain consistent, it is the *same* character. The origin is merely explanatory data, not constitutive essence.
  *   **Retcons:** Valid tools. They are adjustments to the explanatory data to better fit the Agency.
  *   **Drafting:** Draft 1 and Draft 2 are temporal stages of the same entity. The character 'evolved'.
  *   **Fanfiction:** Plausible. If the pattern of agency holds (the 'spirit' of the character), the AU version counts as 'them'.

  ### 3. The Residue Report

  Here is where the mapping frays.

  **What Maps Cleanly:**
  *   **Origin Essentialism** maps perfectly to **Canon Law**. It explains why fans get furious when a writer changes a backstory. To the Essentialist reader, the writer has broken the metaphysical contract. It also maps well to **Tragedy**. In tragedy, fate is often bound up with birth (Oedipus, Harry Potter). The origin *feels* like the destiny.
  *   **Psychological Continuity** maps perfectly to **Revision**. It explains why you, the writer, feel Draft 2 is the 'same' person despite changes. It also maps to **Character Arcs**. If origin were everything, change would be impossible. Patternism allows a character to be 'true to themselves' while radically changing their behaviour.

  **What Maps with Distortion:**
  *   **Origin Essentialism** distorts **Unreliable Narration**. If a character lies about their past, does their identity shift? Essentialism suggests yes, which is nonsense. A liar is still the same person.
  *   **Psychological Continuity** distorts **Consequence**. If identity is just a pattern, does the specific trauma matter? If you can swap the 'dead mother' for a 'dead father' and keep the pattern, you risk making the backstory ornamental rather than causal. It risks turning characters into archetypes wearing different costumes.

  **What Has No Counterpart (The Residue):**
  *   **The Reader's Recognition.** Philosophy asks, "Is this *metaphysically* the same person?" Fiction asks, "Does the reader *recognise* this person?"
  *   There is a gap between *being* the character and *signifying* the character. You can write a character who has completely different origins (a retcon) but signal them so strongly through voice and mannerism that the reader accepts the identity. Philosophy has no variable for 'acceptance'. It deals in truth conditions; fiction deals in persuasion.

  **The Defect:**
  The leftover is a defect in the **Philosophers' Vocabulary**, not the novelist's.
  Philosophers treat identity as a binary switch (Same/Different) applicable to static objects. A novel is a temporal art form existing in time (reading time, writing time, narrative time). Applying a static metaphysical rule to a dynamic process is a category error. The philosophers are fudging the context. They are analysing the *corpse* of the character, whilst you are performing the *surgery* on the living text.

  ### 4. The Verdict

  You asked for a definite line. Here it is.

  **Psychological Continuity (The Agency as Pattern) is the correct ontology for the novelist. Origin Essentialism is toxic to the craft.**

  **Why?**
  Because a novel is not a birth certificate; it is a performance of consciousness.

  If you adopt Origin Essentialism, you paralyse yourself. You become a clerk of facts rather than a creator of life. If every change to the backstory kills the character, you cannot edit. You cannot deepen a motivation. You cannot fix a plot hole that requires a change in childhood history. You become a slave to your first impulse, which is the mark of an amateur.

  Furthermore, Origin Essentialism fails to account for the phenomenon of **Discovery**. When you write, you often find out who the character *is* halfway through the book. In Draft 1, you might think they are motivated by greed. In Draft 3, you realise they are motivated by fear. Under Origin Essentialism, Draft 3 is a different person. But you know, in your bones, that Draft 3 is the *truer* version of the same person. The pattern of their agency has clarified, even if the biographical data has shifted to support it.

  Psychological Continuity respects the **Reader's Experience**. The reader does not hold a spreadsheet of the character's sperm-and-egg data. They hold a model of the character's mind. If the mind remains coherent, the person remains the same. When you read *Great Expectations*, you do not love Pip because of the specific blacksmith who forged his chains; you love him because of the pattern of his guilt and aspiration. You could change the blacksmith's name, and Pip would survive. Change the guilt, and he dies.

  **The Practical Upshot:**
  Treat backstory as **mythology**, not **biology**.
  Biology is fixed (Origin Essentialism). Mythology is malleable; it serves the meaning of the story (Psychological Continuity).

  When you feel that weird friction in Draft 2—that sense that the character is 'the same' despite a new history—trust that feeling. That is the Agency surviving the revision. The Biography is just the scaffolding. If the scaffolding needs to move to support the building better, move it. The building is the person.

  Adopt Patternism. It is the only view that allows for redemption, growth, and the bloody business of rewriting. Origin Essentialism is for genealogists; Psychological Continuity is for novelists. Get on with the work.
