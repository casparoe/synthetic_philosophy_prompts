  7.  **Final Polish:** Ensure smooth transitions between paragraphs. Make sure the voice sounds like a helpful correspondent discussing a text, not a lecture. (e.g., "You are right to feel...", "What bridges this gap...")

      *Drafting thought:* I need to be careful not to say Machiavelli is perfectly consistent in a modern logical sense, but rather that the tension is productive. The shift from "building dikes" (caution/planning) to "beating fortune" (aggression) is the key. The dike-building *is* the act of virtù that happens *before* the crisis. The beating happens *during*. The fixed nature problem explains why so many fail to do the former or the latter appropriately. The advice to be impetuous is a heuristic for when you can't know the times.

      *Refining the Free Will point:* The 50% is not just epistemological (what we can know) but ontological (what causes events). Fortune provides the raw material; Virtù provides the shape.

      *Refining the Italy point:* Italy lacks dikes because it lacked *virtù* (both individual leaders and collective military structure). This links the personal and institutional.

