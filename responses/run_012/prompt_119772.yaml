      *   *Body Paragraph 2: Fixed Nature vs. Adaptation.* Address the pessimism about changing modes. Machiavelli is saying most men *fail* to adapt. He is describing a common failure, not prescribing inevitability. The "luck" is when nature matches times, but the *virtù* is recognizing the need for force.
      *   *Body Paragraph 3: The Woman and Boldness.* Why the shift to beating fortune? Because preparation (dikes) isn't enough when the flood hits. You need active force. This reconciles the two: Build dikes (preparation) AND be bold (action). The "impetuous" preference is because caution leads to paralysis when fortune shifts.
      *   *Body Paragraph 4: Free Will and the 50%.* It's about agency within constraints. Fortune offers opportunities (the river rises), but we choose how to build (the dikes). It's not just foreseeability; it's causal power. We cause the resistance.
