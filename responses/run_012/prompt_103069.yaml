answer: |-
  **Scene:** *The kitchen of a shared house, late evening. The kettle has just boiled. ANNA is leaning against the counter; BENEDICT is drying a mug. A small card stand sits near the kettle, currently displaying a green card. A third card, slightly askew, lies on the table.*

  **Anna:** You're still cross with Chloe, then?

  **Benedict:** Not cross. Perplexed. She tilted the card. Just fifteen degrees off vertical. You saw how you and I reacted. You said it meant the tea was ready; I said it was a mistake, that the card had slipped and meant nothing. We were genuinely at odds.

  **Anna:** We were. And that's precisely what's fascinating. I've been thinking about Kripke's reading of Wittgenstein again. This little row over the card is the sceptical paradox in miniature.

  **Benedict:** Oh, don't start. It's a tea code, Anna, not a thesis on metaphysics. We agreed: red for boiling, amber for brewing, green for ready. Chloe tilted the card. That wasn't one of the three states.

  **Anna:** But why wasn't it? That's the question. You say the rule was fixed two years ago. But look at the evidence. For two years, you and I have placed cards in three specific positions. Finite number of instances. Never a tilted one. Now, suddenly, a new case arises. What fact about those past two years dictates that the tilted card is *wrong* rather than, say, a new signal for 'ready but cooling'?

  **Benedict:** Because that isn't what we meant. We meant *these* three colours in *these* three positions. The intention was specific.

  **Anna:** 'Intention' is just a word, Benedict. What is the fact of the matter that constitutes that intention? Is it a picture in your head? A sentence you whispered to yourself? If it's a picture of a vertical green card, does that picture itself contain the instruction 'and nothing at an angle'? How does the picture reach out and grab this future case and rule it out?

  **Benedict:** It's not a picture. It's a practice. We established a convention. When we taught Chloe, we said, 'Green means ready.' We didn't say, 'Green means ready, unless the card is tilted, in which case it means nothing.' We didn't need to. The rule covers the standard cases, and the non-standard cases are judged by their deviation from the standard.

  **Anna:** But that's just a description of what you *do* when faced with a tilted card. You feel an inclination to call it a mistake. Kripke's point is that your disposition to say 'that's wrong' is no different in kind from your disposition to say 'the kettle is hot'. It tells me how you *will* go on, not how you *ought* to go on. If meaning is just a disposition, then whatever you happen to say next is, by definition, correct. You can't make a mistake. You just act differently.

  **Benedict:** That can't be right. If I were to wake up tomorrow and decide that red actually meant 'ready', I would be misusing the code. I would be violating the agreement we made. There is a normativity there that isn't captured by mere prediction.

  **Anna:** Where does this normativity come from? If it's not in your head, and it's not in the physical cards, where is it? You say 'the agreement'. But an agreement is just more words, more signs. How do those signs fix their own application? You're assuming there's a rail laid out to infinity, guiding us. But all we have is the track we've already laid. The tilted card is off the track. You say 'it's off'. I ask: 'According to which map?' And if you produce another map, I ask how *that* is interpreted.

  **Benedict:** You're asking for a ground outside the practice. But the ground *is* the practice. It's not that I consult a rulebook in my soul. It's that I was trained into a custom, and you were too. When we both react with confidence that the tilted card is void, that shared confidence isn't just a coincidence of psychology. It's the bedrock of what meaning *is*.

  **Anna:** Is it? Or is it just a shared blindness? We are like clockwork mechanisms that click in unison. If we both say 'green means vertical', we agree. But if a Martian came along and said, 'Ah, I see. Your rule was actually: green means ready, unless the card is tilted by exactly fifteen degrees, in which case it means "make coffee"', could you prove him wrong? Based on your past behaviour, his interpretation fits just as well as yours.

  **Benedict:** It fits the past behaviour, yes. But it doesn't fit the *point* of the exercise. We wanted a simple signal for tea. The 'coffee' rule is monstrous. It's gerrymandered.

  **Anna:** 'Monstrous' is a value judgement. 'Simple' is a human preference. The sceptic asks for a fact that makes one rule the *true* rule. You're offering me pragmatic virtues. You're saying, 'We prefer the simple rule.' That might explain why we *choose* to go on this way, but it doesn't establish that this way is *truer* than the Martian's way. It dissolves truth into utility.

  **Benedict:** Perhaps that's where you're stuck. You want truth to be some sort of metaphysical glue that binds the word 'green' to the state of the tea, independent of us. But language isn't like that. The fact that we would both confidently correct Chloe is the fact of the matter. It's not that there's a ghostly 'Meaning' hovering over the kettle. It's that we are participants in a form of life. To ask if we are *really* right, outside of that life, is to ask a question that has no purchase.

  **Anna:** But that leaves the normativity hanging. If it's just 'how we go on', then if the whole household suddenly decided tomorrow that red meant 'ready', we wouldn't be wrong, just different. But surely, if I forget the code and put up amber when the water is boiling, I have made a mistake *now*, regardless of what I might decide later. The correctness must be there already, waiting for me.

  **Benedict:** It is there. It's there in the commitment we undertook. When I taught Chloe, I didn't just describe my habits. I gave her an instruction. 'Do this.' If she does that, she follows the rule. If she does something else, she doesn't. The 'ought' comes from the social act of instruction and acceptance. It's not a disposition to behave; it's an obligation to conform.

  **Anna:** An obligation grounded in what? If I ask, 'Why ought I to put the card vertical?', and you say, 'Because that's the rule', I ask, 'What is the rule?'. You point to the past. I say the past is compatible with the tilted card. You say, 'No, we meant vertical.' I say, 'What fact constitutes that meaning?' You say, 'Our shared confidence.' I say, 'That's just a feeling.' You see the circle? You're trying to pull yourself up by your bootstraps. The shared confidence explains why we *agree*, but not why we are *right*.

  **Benedict:** I think you're demanding a kind of certainty that language doesn't offer. You want a view from nowhere. But we are always somewhere. We are in this kitchen, making tea. In this context, the tilted card is a mistake. Not because of a metaphysical fact, but because it breaks the trust required for the signal to work. If the signal becomes ambiguous, the practice collapses. The 'correctness' is internal to the survival of the practice.

  **Anna:** So meaning is fragile. It depends on us continuing to agree. If Chloe keeps tilting the card, and we start accepting it, then retrospectively, the rule *was* ambiguous all along?

  **Benedict:** No. If we accept it, we have changed the rule. But until we do, the rule stands. The fact that we *could* change it doesn't mean it isn't fixed now.

  **Anna:** But what fixes it *now*? You keep saying 'the rule stands'. I'm asking what the rule *is*. You say it's the practice. But the practice is just a series of events. Events don't carry their own interpretation. The tilted card is a physical event. The 'mistake' is a judgement you lay over it. I'm suggesting there's no fact about you or me that forces that judgement to be the only valid one. There are only facts about how we are inclined to judge.

  **Benedict:** And I'm suggesting that the inclination of a trained participant in a practice *is* the only access we have, or need, to the rule. You treat the 'inclination' as something brute, like a sneeze. But it's a cultivated response. It's laden with the history of the usage. When I see the tilt, I don't just feel like correcting it; I see it *as* a deviation. That 'seeing as' isn't optional. It's how the meaning presents itself to me.

  **Anna:** But that 'seeing as' is exactly what the sceptic questions. You see it as a deviation because you are disposed to see it as a deviation. If you were disposed to see it as a new signal, you would see it that way. There is no 'meaning' left over to adjudicate between the two dispositions. We are just arguing over whose disposition wins. In this case, yours and mine against Chloe's.

  **Benedict:** It's not a power struggle, Anna. It's about fidelity to what was established.

  **Anna:** And 'fidelity' is just the name we give to our refusal to change our dispositions. Look, I'm not saying we should stop using the code. I'm saying that when you insist Chloe is *wrong*, you think you are pointing to a fact about the meaning of the code. I'm saying you're pointing to a fact about your own psychology and your hope that she shares it. There is no 'fact of the matter' about the meaning independent of our willingness to go on in a certain way.

  **Benedict:** If that were true, communication would be a miracle. Every time I speak, I'd be gambling that your dispositions match mine. But they don't just match; they mesh. We understand each other. That understanding feels like grasping something solid.

  **Anna:** It feels like it. Wittgenstein says the feeling is real, but it doesn't guarantee the metaphysics. The solidity is in the agreement, not in the words themselves.

  **Benedict:** Then the agreement is solid enough for me. Chloe tilted the card. It wasn't green. The tea is ready. I'm pouring it.

  **Anna:** *(Smiling)* And I'm drinking it. Which proves that, regardless of the metaphysics, the disposition works.

  **Benedict:** Or it proves that the meaning was there all along, and we just found it.

  **Anna:** Perhaps. Or perhaps we just made it up on the spot, and pretended we remembered it.

  **Benedict:** *(Pouring tea)* Well, if this is all make-believe, it's remarkably hot.

  **Anna:** Indeed. Pass the milk.

  *(Silence as they drink. The tilted card remains on the table.)*
