      *   **Key Arguments:**
          *   Anna: Past uses/dispositions don't fix meaning; "ought" vs. "would"; no fact of the matter.
          *   Benedict: Rule was fixed; shared confidence isn't just habit; there is a fact about what was meant.
          *   Crucial Point: Disposition tells us how one *would* go on, not how one *ought*. Benedict needs to address the ground for correctness vs. inclination.
      *   **Tone:** British English, intellectual but accessible, neither character foolish, no tidy resolution.
