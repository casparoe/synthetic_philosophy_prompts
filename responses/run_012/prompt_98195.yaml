answer: |-
  You have identified a sophisticated and deeply frustrating maneuver. You are right to feel that standard terms like "defeasibility" or "particularism" do not quite fit. Defeasibility admits exceptions; your friend denies them. Particularism discards rules; your friend idolizes them (in name).

  There is no single, canonical proper noun in the philosophical canon for this exact composite behavior (e.g., there is no "The Humean Shrinkage"). However, it is a recognized composite of logical fallacies, psychological mechanisms, and ethical failures.

  The most precise name for the *logical structure* is the **No True Scotsman Fallacy** applied to moral concepts. The most precise name for the *asymmetry* is **Special Pleading**. The most precise name for the *function* of the maneuver is an **Immunizing Stratagem**.

  If we were to coin a descriptive term for the specific ethical phenomenon you observed, I would call it **Definitional Retreat** (or **Conceptual Contraction**).

  Here is the breakdown of what this is, how it differs from its neighbors, and whether a defense is possible.

  ### 1. What is it?
  Your friend is engaging in **Moral Immunization via Definitional Retreat**.

  In the philosophy of science (specifically Karl Popper), an "immunizing stratagem" is when a theorist modifies a theory *ad hoc* to protect it from falsification, without increasing its explanatory power. Your friend is treating his moral self-conception ("I am a person who follows rules") as the theory, and his actions as the data. When the data contradicts the theory, he does not change the theory (admit he broke a rule); he changes the data description (claim the act wasn't an instance of the rule).

  This is distinct from simple lying because he likely believes the new definition in the moment. It is a form of **Motivated Reasoning**: the conclusion ("I did nothing wrong") drives the premise ("This act does not fit the definition of lying"), rather than the premise driving the conclusion.

  ### 2. Distinctions from Neighboring Concepts

  You asked specifically how this differs from three other positions. Here is the boundary work:

  **A. vs. Defeasibility**
  *   **Defeasibility:** A rule is stated as "Do X, *unless* Y." (e.g., "Do not lie, unless it saves a life.") The rule remains stable; the *application* acknowledges conditions.
  *   **Your Friend:** The rule is stated as "Do X, *always*." When Y occurs, he does not say "This is an exception." He says "This is not X."
  *   **The Difference:** Defeasibility expands the *conditions of application*; your friend shrinks the *definition of the concept*. Defeasibility is transparent; Definitional Retreat is opaque.

  **B. vs. Moral Particularism**
  *   **Particularism:** Claims that moral rules are not primary; judgment is case-by-case based on the specific features of the situation. A particularist would say, "There is no rule against lying; there are only reasons for and against in this specific context."
  *   **Your Friend:** Insists the rule is primary and binding. He uses the rule as a weapon against *you* ("You broke a promise!") while manipulating the definition for himself.
  *   **The Difference:** The particularist abandons the rigidity of the rule. Your friend keeps the rigidity but hollows out the content.

  **C. vs. Simple Equivocation (Redefining to Win)**
  *   **Equivocation:** Using a word in two different senses within an argument to confuse the opponent. Usually conscious or tactical.
  *   **Your Friend:** This feels more systemic. He isn't just swapping definitions mid-sentence to win a point; he has built a lifestyle where the definitions shift to accommodate his desires.
  *   **The Difference:** Equivocation is a rhetorical tactic; Definitional Retreat is a *protective cognitive habit*. It is structural hypocrisy rather than tactical deception.

  ### 3. Is the Rewriting Necessarily Self-Serving?

  **No, but the asymmetry makes it so in this case.**

  Conceptual refinement is a legitimate philosophical activity. We *should* refine our definitions.
  *   *Innocent Example:* A doctor says, "I never harm patients." Later, she performs a painful surgery. She clarifies, "By 'harm' I mean 'inflict gratuitous injury,' not 'necessary medical pain'." This is a valid clarification of the concept *harm*.
  *   *The Test:* The refinement must be **universalizable**. If the doctor applies that definition of harm to her colleagues as strictly as to herself, it is innocent conceptual precision.

  In your friend's case, the rewriting is **asymmetric**. He applies the "wide" definition to you and the "narrow" definition to himself. This moves it from innocent refinement to **Special Pleading**. The mechanism (refining definitions) can be innocent; the pattern (self-exemption) is corrupt.

  ### 4. Is It Still the Same Rule?

  This is the **Ship of Theseus** problem applied to ethics.

  If a rule contracts every time it encounters friction, does it remain the same rule?
  *   **Formal Identity:** Yes. He still calls it "The Rule Against Lying."
  *   **Functional Identity:** No. A rule that shrinks to exclude all costly applications is functionally identical to **Prudential Self-Interest**.

  If the rule "Do not lie" ultimately means "Do not lie unless it costs you something to tell the truth," then the rule is not "Do not lie." The rule is "Maximize your own comfort."

  At a certain threshold of contraction, the rule ceases to be a moral constraint and becomes a **post-hoc rationalization**. You can identify the threshold by asking: *Is there any scenario where he would obey this rule at a significant cost to himself?* If the answer is no, the rule is dead; only the name remains.

  ### 5. The Charitable Defense: How Could a Philosopher Defend Him?

  If your friend were smarter, or more honest, how could he argue he is actually consistent? There are two plausible defenses, though they require him to drop the asymmetry.

  **A. The Kantian "Maxim" Defense**
  Immanuel Kant argued that we act on *maxims* (subjective principles), not just physical actions.
  *   *Defense:* "I did not break the rule 'Do Not Lie.' My maxim was 'Protect my brother from panic during a dangerous drive.' Under that description, withholding the full truth was not a lie, but a protective measure. When *you* broke your promise, your maxim was 'Prioritize my convenience.' That *is* a broken promise."
  *   *Requirement:* He must prove that the *description of the act* is what matters morally. If he can consistently argue that the *intent* changes the *category of the act*, he isn't shrinking the rule; he is arguing you are misidentifying the act.
  *   *Weakness:* This fails if he admits he would have taken the "better offer" even if the cost to the friend was catastrophic.

  **B. The Semantic Contextualist Defense**
  *   *Defense:* "Moral terms like 'lie' and 'promise' are context-sensitive. In a court of law, my statement to my brother is a lie. In a family emergency, it is 'comfort.' Similarly, a promise made casually is not the same semantic object as a promise made in blood. I am not changing the rule; I am acknowledging that the *words* mean different things in different contexts."
  *   *Requirement:* He must apply this contextualism to *you*. He must admit that your promise to him might have been "casual" and therefore not binding in the way he claims.
  *   *Weakness:* He explicitly refused to do this. He held you to the "wide" version.

  ### Summary

  You have spotted a failure of **Universalizability**.

  Your friend wants the **social authority** of being a moral absolutist (which grants him the right to judge others) without the **personal cost** of being a moral absolutist (which requires self-sacrifice).

  The name for this is **Special Pleading** facilitated by **Definitional Retreat**.

  It is distinguished from defeasibility because it denies exceptions rather than granting them. It is distinguished from particularism because it insists on the existence of rigid rules. It is distinguished from simple equivocation because it is a systemic, self-protective habit rather than a one-off rhetorical trick.

  **The Verdict:**
  A rule that contracts only when it touches the holder's interests is not a rule. It is a **preference disguised as a principle**. Your friend is not a deontologist (rule-follower); he is an egoist who speaks the language of a deontologist. He is not confused; he is likely engaging in unconscious **Moral Rationalization**. He gets to feel virtuous (by holding the rules) and comfortable (by redefining them) simultaneously.

  You are not confused. You are observing a person who wants to have the currency of morality without the inflation of cost.
