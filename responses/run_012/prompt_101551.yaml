answer: |-
  You know this terrain better than most. Gould's *Wonderful Life* is essentially the opening salvo of this exact debate translated into Burgess Shale fauna. When you look at the historians' fight through the lens of benthic forams and core samples, the mapping is surprisingly tight, though there are fractures where human intentionality cracks the model.

  Here is the translation of their substantive and methodological positions into your vocabulary.

  ### 1. Substantive Inevitabilism → Convergent Evolution & Strong Selection
  **The Historians' Claim:** Large-scale outcomes (industrialization, the rise of the state) were determined by structural forces (geography, demography). Individual actors didn't matter; the pressure was too strong.
  **The Biological Translation:** This is the view that the adaptive landscape has very few, very deep peaks, and selection pressure is strong enough to pull all lineages toward them regardless of starting position. It argues for high convergence. Just as camera eyes evolved independently in cephalopods and vertebrates because the physics of light constrains the solution, historians argue that steam engines or bureaucracies evolve because the "social physics" constrains the solution.
  **Fit:** Clean on the macro scale. You see this in island biogeography or functional morphology.
  **Stretch:** "Structural forces" in history are often endogenous (created by the organisms themselves), whereas in paleo, the environment is usually exogenous.
  **Missing:** The mechanism of transmission. In biology, it's genetics/development; in history, it's culture/tech, which allows Lamarckian inheritance of acquired traits, speeding up the "selection" process vastly.

  ### 2. Substantive Contingency → Drift, Path Dependence & Rugged Landscapes
  **The Historians' Claim:** Outcomes hung on singular events (a storm, a decision, a death). Rewind the tape, and you get a different world.
  **The Biological Translation:** This is Gould's argument exactly. It posits a rugged fitness landscape with many local peaks. Which peak a lineage occupies depends on founder effects, bottlenecks, or specific mutations available at specific times (historical constraint). It emphasizes drift over selection in the short term, and path dependence (lock-in) over optimality in the long term.
  **Fit:** Very clean. This is standard population genetics and cladistics.
  **Stretch:** In history, the "mutation" (a decision) can be massive and instantaneous, whereas biological mutation is usually small-step.
  **Missing:** The "decision" implies a model of the future within the agent. A mutation doesn't "know" it's a mutation; a general knows he's crossing the Rubicon.

  ### 3. Methodological Pro-Counterfactual → Parameter Space Modeling
  **The Historians' Claim:** You must ask "what if" to test causal claims. To say X caused Y, you must imply that if not-X, then not-Y.
  **The Biological Translation:** This is the null hypothesis approach. It's experimental evolution (like Lenski's *E. coli*) or sensitivity analysis in climate models. You vary the initial conditions to see which traits are robust across replays and which are fragile.
  **Fit:** Clean. This is how we determine if a trait is adaptive or exaptive.
  **Stretch:** Historians can't run controlled experiments; they run mental simulations. Biologists can at least run simulations or look at replicate lineages.
  **Missing:** The normative worry. Historians worry counterfactuals become "fiction." Biologists worry they become "just-so stories," but we accept them as necessary tools for inference.

  ### 4. Methodological Anti-Counterfactual → Strict Actualism
  **The Historians' Claim:** History's job is to explain what happened, not what didn't. Counterfactuals are speculative parlor games.
  **The Biological Translation:** This is strict descriptive paleontology. "Just describe the stratigraphy. Don't speculate on the unpreserved morphs." It treats the actual record as unique and unrepeatable.
  **Fit:** Clean in terms of data integrity.
  **Stretch:** In practice, no paleobiologist actually does this. You infer ecology from morphology using models that imply counterfactuals (e.g., "this tooth shape implies a diet of X, not Y").
  **Missing:** The epistemic humility claim. Historians argue human complexity exceeds modeling. Biologists argue complexity requires modeling to untangle.

  ### The Residue: Framework Defect or Thin Dispute?

  Now, to the core of your question. There is residue left over after this translation. The biggest chunk is **agency**—the fact that human actors have reasons, not just causes, and they model their own futures. Your biological toolkit handles *behavioral phenotypes*, but it doesn't handle *intentionality*. A foram doesn't decide to migrate to a warmer layer because it read a temperature map; it responds to gradients. A human army moves because of a order based on intelligence reports. This means the "landscape" in history is reactive; the organisms change the topology of the peaks while they are climbing them (extreme niche construction).

  However, is this residue a defect of your biological framework, or does it reveal the historians' dispute is thinner than it looks?

  I argue it is the latter. The historians' fight over inevitability is often a confusion of scales masquerading as a metaphysical clash. In biology, we know that "inevitability" is just "high probability across replays," and that probability is scale-dependent. Over short timescales and small populations, drift and contingency dominate (the Contingency view). Over deep time and large spatial scales, selection and convergence dominate (the Inevitabilist view). Both are true simultaneously.

  The historians fight because they treat Structure and Agency (or Selection and Drift) as rival explanations rather than interacting parameters. They argue over whether the Civil War was "inevitable" without specifying the timescale or the granularity of the replay. Your toolkit shows this is a category error. You wouldn't argue whether a phenotype is "drift or selection" without specifying the effective population size and the selection coefficient.

  Furthermore, the methodological fight is even thinner. You cannot make a causal claim without an implicit counterfactual. To say "the harvest failure caused the revolution" is to say "had the harvest not failed, the revolution would not have occurred (or would have been different)." Historians who deny counterfactuals while asserting causation are speaking incoherently. Biologists accept this tension: we know our models are fictions, but they are necessary fictions to extract signal from noise.

  The residue of "agency" is real, but it doesn't validate the historians' substantive fight. Even with agency, human actions are subject to constraints (geography, economics, biology) that function like selective pressures. The historians' dispute feels deeper than it is because they lack the systems thinking to see that contingency and inevitability are not binaries, but ends of a continuum defined by constraint strength and landscape ruggedness. Your toolkit isn't too crude to see this; it's actually sharp enough to show that their dichotomy is false.

  Verdict: a sign the historians' argument is less substantive than it appears.
