          *   *Orwellian:* The experience happens, but memory *rewrites* it afterward (history is revised).
      *   *Dennett's Point:* It often doesn't matter which one it is; the "Cartesian Theater" (a place where it all comes together) is a myth. There is no "final moment" of objective truth in the brain.
