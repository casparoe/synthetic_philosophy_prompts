answer: |-
  Good morning. For those who don't know me, I'm [Your Name]. I write fiction for a living. [Deceased's Name] studied the brain for a living. Usually, that meant we argued about dinner. I'd say, "The heart knows what it feels," and he'd smile that tired, kind smile and say, "The heart is a pump, and the feeling is a latency lag."

  He was a pain in the neck, honestly. But he was our pain in the neck.

  He spent his career studying how we experience time. Specifically, how unreliable it is. He used to talk about something called the Color Phi phenomenon. I'll keep this brief, because I can hear his lab students shifting in their seats.

  Imagine two lights. One red, one green. They flash in different places, very quickly. You don't see two lights. You see one light moving from here to there, changing color in mid-air. But the second light hasn't flashed yet when your brain decides the first one is moving. Your brain is filling in the gap. It's editing the film before you see the screen.

  [Name] had a favorite argument about this. He called it Orwellian versus Stalinesque. In the Orwellian version, you see the world, and then your memory rewrites it later, like a historian changing the records. In the Stalinesque version, the rewrite happens before you're even conscious of it, like a show trial staged before the public arrives.

  He believed that, from the inside, you can't tell the difference. There is no little person in your head watching a monitor in real-time. There is only the draft. He used to say the brain is a novelist who can't stand a loose end, and consciousness is just the last draft it lets you read.

  I've been thinking about that a lot these past few weeks. Because when someone dies suddenly, everyone wants to know about the final moment.

  His family, who loved him more than anyone, wants to know that he knew he was safe, and loved, and peaceful at the very end. And his colleagues, who loved him in their own way, know that "the very end" is a neurological fuzzy window, not a clean cut. They know we can't measure the exact millisecond the lights went out.

  It's a hard gap to bridge. How do we offer comfort without lying about the science?

  But then I remembered what he taught me about the editing process.

  The brain edits for coherence. It edits for meaning. It takes the scattered inputs—the sound of a voice, the pressure of a hand, the history of a lifetime—and it weaves them into a story that makes sense.

  We know what the inputs were in his final minutes. We know he was surrounded by love. We know his sister was there. We know he was not alone.

  Whether the experience was Orwellian or Stalinesque, whether the feeling of safety was processed in real-time or integrated in the final milliseconds of neural firing, it doesn't change the data. The brain is a machine designed to find the pattern. And the pattern of his life was love.

  If the brain is a novelist, it is a honest one. It doesn't invent emotions out of thin air; it synthesizes what is there. If the room was full of love, then his experience—the final draft he read—was love. That is not a spiritual guess. That is what his own work tells us the brain does. It makes the story match the truth of the environment.

  He was a man who cared deeply about accuracy. He wouldn't want us to pretend we know the precise timeline of his passing. But he would want us to trust the narrative.

  He taught me that we are all walking around with edited drafts of reality. We don't see the raw data. We see the story our brains tell us about who we are and who is with us.

  So, here is what I ask you to take from this room. It's not a prayer, and it's not a hypothesis. It's just a practice.

  When you go home today, and the silence of his absence gets loud, don't look for the raw data. Don't torture yourself with the "what ifs" or the precise mechanics of the end. Trust the draft.

  If your memory tells you he was kind, then he was kind. If your heart tells you he knew you loved him, then he knew. The editing isn't a deception. It's an act of care. It's how we make a life hold together.

  He spent his life studying the illusion of the moment. But he never doubted the reality of the connection. The dots might be separate. The colors might change. But the movement between them? The story that connects us? That's the only thing that's real.

  He's finished his draft. It's a good one. And now, it's up to us to write the sequel.

  Thank you.
