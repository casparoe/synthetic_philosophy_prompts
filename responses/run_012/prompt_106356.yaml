  ### 1. Candidate Rules and Eliminations

  Based on the five verdicts you've transcribed, we can test the standard "architectures" in the philosophy of emotion.

  **Candidate A: Somatic Theory (James-Lange)**
  *   **Rule:** Emotion *is* the perception of bodily change. No body, no emotion.
  *   **Status:** **ELIMINATED.**
  *   **Evidence:** The Stroke patient (Case 2) and the Joke listener (Case 5) were ruled to have genuine emotions despite reporting *no* bodily feeling. The instructor explicitly decoupled emotion from affect.

