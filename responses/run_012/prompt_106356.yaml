  *   **Rule:** Emotion is primarily a feeling state; cognition is secondary.
  *   **Status:** **ELIMINATED.**
  *   **Evidence:** The Startle reflex (Case 3) and the Music listener (Case 4) had high arousal/affect but were ruled *not* to be emotions. The instructor requires something cognitive or evaluative to upgrade "affect" to "emotion."

