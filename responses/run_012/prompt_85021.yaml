          *   *Problem:* **Language Dependence.** (Miller's second blow). If I change the primitives (e.g., from "Hot/Rainy" to "Hot/Minnesotan"), the verisimilitude ordering flips.
          *   *Verdict:* Doesn't fully escape. It pays the bill in "language relativity."

