  ### Brainstorming Candidate Principles

  Before settling on a definition, let's look at the standard tools and why they struggle with your specific intuitions.

  1.  **The Prisoner's Dilemma (PD) Model:**
      *   *Definition:* Two parties have a dominant strategy to defect, leading to a worse outcome than if both cooperated.
      *   *Fit:* Perfect for Case 1 (Soda) and Case 2 (Arms).
      *   *Crack:* Fails Case 5 (Rankings). In a PD, you *can* theoretically cooperate if you can talk. In Case 5, the "cooperation" (stopping the ratchet) is unstable because a single defector wins everything. It also struggles with Case 6, where there isn't a single "cooperate" button everyone agrees on.

  2.  **The Nash Equilibrium Criterion:**
      *   *Definition:* A state where no one can improve their position by unilaterally changing strategy.
      *   *Fit:* Captures the "stuck" feeling of 1, 2, 5, 6.
      *   *Crack:* Case 3 (Hikers) is *not* a Nash Equilibrium; it's an information error. If they knew the map, they'd change. Case 4 (License) *is* a Nash Equilibrium, but you correctly intuit it's not a trap. So "being stuck" isn't enough; the stuckness must be *bad*.

  3.  **The Pareto Efficiency Test (Your "Freeze Test"):**
      *   *Definition:* A situation is a failure if there exists an alternative where at least one person is better off and no one is worse off.
      *   *Fit:* Handles 1, 2, 5 beautifully.
      *   *Crack:* You explicitly noted Case 6 fails this ("no single alternative that everybody would jointly prefer"), yet you still feel it's a trap. This suggests your intuition is tracking something broader than strict Pareto efficiency—perhaps **systemic value erosion** rather than specific outcome preference.

  4.  **The Zero-Sum Filter:**
      *   *Definition:* Traps only exist in negative-sum games, not zero-sum games.
      *   *Fit:* Correctly excludes Case 4 (License).
      *   *Crack:* Doesn't distinguish Case 3 (Hikers) from Case 1 (Soda). Both are negative-sum (wasted time/money), but only one is a trap.

  ---

  ### The Principle: The Coordination Sink

  To capture your verdicts while maintaining philosophical rigor, I propose we define the trap not just by the outcome, but by the **mechanism of the lock-in**. I call this a **Coordination Sink**.

  A situation is a Coordination Sink if and only if it meets three conditions:

  1.  **Incentive Drive (The "Moloch" Clause):** The harmful behavior is driven by rational response to competitive incentives, not by error or ignorance.
      *   *Forced by:* **Case 3 (Hikers).** This clause excludes mistakes. If the problem vanishes when you give everyone a map, it wasn't a trap; it was a fog. A trap persists even with perfect information.
  2.  **Pareto-Blocked Alternative (The "Freeze" Clause):** There exists a feasible alternative state that all participants prefer to the current trajectory, but they cannot reach it.
      *   *Forced by:* **Case 4 (License).** This clause excludes zero-sum contests. In Case 4, no alternative exists where *both* keep the license. In Case 1 and 2, an alternative exists (no ads, disarmament) that both prefer.
  3.  **Exit Barrier (The "Lock-In" Clause):** Participants cannot unilaterally opt out of the dynamic without suffering a disproportionate penalty (ruin, elimination), and cannot coordinate a joint exit due to transaction costs or trust deficits.
      *   *Forced by:* **Case 5 (Rankings).** This clause addresses your worry about "walking away." If walking away costs you everything, you are effectively locked in. The trap isn't that you *can't* leave; it's that the cost of leaving is weaponized against you.

  #### The Name: "Coordination Sink"
  "Trap" implies a predator or a fixed mechanism. "Sink" implies a drain on value that happens because everyone is pouring resources into a hole to stay afloat. It captures the **value erosion** you feel in Case 6 without requiring agreement on the specific repair.

  ---

  ### The Hard Concession: Overturning Case 6

  To keep this principle clean and applicable, I must overturn one of your verdicts. I argue that **Case 6 (Metric Reform) is not a Coordination Sink.**

  **Why:** Your description says: *"Reform camps disagree... no single alternative that everybody would jointly prefer."*
  If there is no jointly preferred alternative, **Clause 2 (Pareto-Blocked Alternative)** fails.
  If Group A wants Metric X, and Group B wants Metric Y, and the Current State is Z... and A prefers Z to Y, and B prefers Z to X... then Z is a stable equilibrium of preferences.
  The feeling of "trap" you have here is real, but it is **Value Conflict**, not Coordination Failure. You are describing a political struggle over what "good work" means, not a situation where everyone agrees on the good but can't reach it.
  *Correction:* If everyone agrees "The work is being destroyed," then "Work Not Destroyed" is the Pareto superior state. But if they disagree on *how* to achieve that (which metric), they cannot coordinate. This makes it a **Governance Deadlock**. It feels like a trap because the *system* is grinding, but technically, if there is no agreement on the destination, the engine isn't broken; the passengers are just fighting over the steering wheel.
  *Verdict:* To save the principle, Case 6 must be reclassified as **Conflict**, not Trap. A trap requires a missed opportunity for *mutual* gain. If the gain is disputed, it's politics.

  ---

  ### Application to the Undecided Case (Delivery Apps)

  **Case 7: Delivery Apps.**
  *   **Incentive Drive?** Yes. Restaurants raise prices/shrink portions to cover fees.
  *   **Exit Barrier?** Yes. Leaving the app means losing customers.
  *   **Pareto-Blocked Alternative?** **No.**
      *   *Why:* You said "nobody involved... would say this is the arrangement they'd have chosen." But is the **Platform** involved? If the Platform is a participant, they *prefer* the high fees. If the Platform gains more than the Restaurants/Customers lose, the system is Pareto Efficient (surplus is just transferred).
      *   *Verdict:* **Not a Trap.** This is **Rent Extraction**. A trap requires the *participants* to be the source of the pressure (multipolar). Here, the pressure is coming from a monopolist (the app). That's not a Coordination Sink; it's a Toll Booth.

  ---

  ### Testing on Three New Cases

  Here is how the **Coordination Sink** principle handles three contentious cases.

  **1. The AI Safety Race**
  *   *Scenario:* AI labs rush to deploy models, skipping safety checks, because if they slow down, a rival will beat them to market.
  *   **Incentive Drive:** Yes (Fear of losing market share).
  *   **Pareto-Blocked:** Yes (All labs + humanity prefer safe AI over catastrophic AI).
  *   **Exit Barrier:** Yes (Unilateral slowing = bankruptcy/irrelevance).
  *   **Verdict:** **Coordination Sink.** (This is a classic Moloch case).

  **2. Open-Plan Offices**
  *   *Scenario:* Companies adopt open plans to signal "collaboration." Productivity drops due to noise. Managers keep doing it because it looks modern and saves rent.
  *   **Incentive Drive:** Yes (Signaling + Cost saving).
  *   **Pareto-Blocked:** **Debatable.** Do Managers prefer it? If Managers value rent savings over worker productivity, then the current state is Pareto Efficient *for the decision makers*.
  *   **Verdict:** **Not a Sink.** This is a **Principal-Agent Problem**. The people feeling the trap (workers) aren't the people making the choice (managers). If managers don't want to change, it's not a coordination failure; it's a preference mismatch.

  **3. Crypto Proof-of-Work**
  *   *Scenario:* Miners burn massive electricity to secure the network. If one stops, they lose revenue. If all stop, the network fails.
  *   **Incentive Drive:** Yes.
  *   **Pareto-Blocked:** **No.** The energy consumption is the *feature*, not a bug. It secures the asset. Participants agree the energy spend is necessary for the value.
  *   **Verdict:** **Not a Sink.** This is a **Cost of Production**. It feels like waste to an outsider, but to the participants, it's the price of the service. (Unless you argue a "Proof-of-Stake" alternative is Pareto Superior for *everyone* including miners—if so, it becomes a Sink).

  ### Summary of Edges

  *   **Edge 1 (Information vs. Incentives):** If fixing the information fixes the problem, it's not a Sink (Case 3).
  *   **Edge 2 (Zero-Sum vs. Negative-Sum):** If someone must lose for the game to work, it's not a Sink (Case 4).
  *   **Edge 3 (Conflict vs. Coordination):** If participants disagree on the *goal*, it's not a Sink, it's Politics (Case 6).
  *   **Edge 4 (Multipolar vs. Monopoly):** If the pressure comes from a single dominant actor extracting rent, it's not a Sink, it's Exploitation (Case 7).

  This leaves you with a sharp tool. It tells you that "Moloch" isn't just "things suck." It's specifically when **rational peers destroy shared value because they can't trust each other to stop.**
