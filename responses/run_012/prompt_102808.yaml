      Paragraph 2: Address the "counterfactual" complaint. Safety via containment isn't safety from convergence.

      *Wait, need to be careful not to concede Orthogonality.* I defend Orthogonality too. Actually, the user's example *supports* Orthogonality (intelligence != goal). I should agree there and focus on IC.
