  **MEMORANDUM**

  **TO:** Members of the Physical-Sciences Grants Panel
  **FROM:** Chair, Physical-Sciences Grants Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Recommendation on Proposal #PS-2023-892 ("Relativistic Constraints on Hypercomputation")

  **1. Purpose**

  This memo circulates ahead of Thursday's plenary session to recommend a course of action regarding Proposal #PS-2023-892. As you know, the referees for this proposal were sharply divided. One recommended immediate rejection on grounds of mathematical incoherence; one recommended full funding as a standard empirical test; and one recommended rejection on grounds of category error (philosophical stipulation).

  My recommendation is to **Fund Subject to Conditions**. Specifically, I propose we support the research program only if the applicants reframe their objectives from "testing the Church-Turing Thesis" to "investigating the Physical Church-Turing Thesis within General Relativistic constraints."

  **2. Assessment of Referee Positions**

  To reach a decision, we must weigh the three referee positions carefully.

  *   **Referee 1 (Mathematical Incoherence):** This referee argues that the Church-Turing Thesis (CTT) identifies "effective calculability" *by definition* with Turing-machine computability. On this view, a physical counterexample is impossible because any physical process we can specify effectively is, by definition, Turing-computable. While logically robust, this position risks conflating mathematical definitions with physical limitations. It treats the CTT as a priori truth rather than a claim about the physical world.
  *   **Referee 3 (Philosophical Stipulation):** This referee argues that CTT is an explication of a concept, not a hypothesis. An experiment cannot refute a definition. This is a potent philosophical objection. If the applicants claim they are testing a definition, they are indeed mistaken.
  *   **Referee 2 (Physical Conjecture):** This referee holds that while the *mathematical* CTT may be a definition, the claim that *no physical system* can out-compute a Turing machine (often called the Physical Church-Turing Thesis, or PCTT) is an empirical hypothesis. It depends on the laws of physics, specifically regarding energy, spacetime structure, and signal propagation.

  **The panel should give its due to Referee 2.** This is a physical-sciences council, not a mathematics or philosophy foundation. Our mandate is to fund inquiries into the laws of nature. Whether spacetime geometry permits the accumulation of infinite proper time within a finite observational window (Malament-Hogarth spacetimes) is a question of General Relativity. Whether noise, energy requirements, or quantum gravity effects forbid the readout of such a process is a question of thermodynamics and quantum information. Referee 2 correctly identifies that the *physical realizability* of hypercomputation is a testable scientific question, distinct from the logical definition of computability.

  However, Referees 1 and 3 are correct that the applicants' current framing is vulnerable. We cannot fund a project premised on "refuting a definition."

  **3. Panel Competence**

  We must be honest about our limits. This panel is competent to judge the physical plausibility of the proposed apparatus, the rigor of the error analysis, and the feasibility of the relativistic modeling. We are *not* competent to adjudicate the ultimate truth of the Church-Turing Thesis as a logical or philosophical matter.

  Therefore, our decision must not be interpreted as a verdict on computability theory. We are funding a study of extreme relativistic information processing, not a trial of Turing's legacy. If the project concludes that physical laws forbid the apparatus, that is a result in gravitational physics, not logic.

  **4. Criteria for Success and Failure**

  Given the speculative nature of the proposal, standard metrics (publications, prototypes) are insufficient. I propose the following criteria for the applicants' progress reports:

  *   **Success:**
      *   A rigorous derivation of the energy-momentum tensor required to sustain the proposed worldline configuration, including stability analysis against perturbations.
      *   A quantitative model of signal-to-noise ratios for the "readout" phase, addressing how the observer distinguishes "non-halting" from "signal loss" or "equipment failure."
      *   Identification of specific physical laws (e.g., quantum gravity effects, Bekenstein bounds) that impose a cut-off on the computation, regardless of spacetime geometry.
  *   **Failure:**
      *   Reliance on idealized assumptions (e.g., infinite energy, perfect vacuum, classical gravity only) without quantifying the impact of physical realism.
      *   Retreat into semantic arguments regarding the definition of "computation" rather than providing physical modeling.
      *   Inability to specify a mechanism by which the "finite time" observer verifies the integrity of the "infinite time" processor.

  **5. Recommendation**

  I recommend we **Fund Subject to Conditions**.

  The condition is that the applicants revise their Statement of Work to align with Referee 2's position while accommodating the cautions of 1 and 3. The primary research question must be: *"Do the laws of physics, specifically General Relativity and Quantum Field Theory in curved spacetime, permit a physical process whose output cannot be simulated by a Turing machine within bounded resources?"*

  This phrasing acknowledges that while "computability" is a mathematical concept, "physical simulation" is an empirical one. It allows for a null result (physics forbids it) to be as scientifically valuable as a positive one (physics allows it), provided the "forbidding" mechanism is physically identified (e.g., "Hawking radiation destroys the signal") rather than logically asserted.

  **6. Standing Policy on Foundational Proposals**

  Finally, regarding whether we should adopt a standing policy for proposals of this foundational character: I recommend **against** a standing policy at this time.

  We are entering a period where the boundaries between information theory, gravity, and thermodynamics are blurring (e.g., black hole information paradox, holographic principle). A rigid policy excluding "foundational" questions might preclude the next generation of quantum computing or gravitational wave research, which once appeared equally speculative. Conversely, a policy encouraging them might open the floodgates to pseudoscience.

  We should continue to judge these **case by case**, using the criterion applied here: *Does the proposal translate a philosophical question into a physical model with testable or calculable constraints?* If yes, it is physics. If no, it is metaphysics, and outside our remit.

  **7. Next Steps**

  At Thursday's meeting, I ask the panel to vote on this conditional funding recommendation. If approved, I will work with the applicants to refine the project scope to ensure it meets the physical modeling criteria outlined above, ensuring their work remains within the realm of empirical science regardless of the outcome.

  Regards,

  [Your Name]
  Chair, Physical-Sciences Grants Panel
