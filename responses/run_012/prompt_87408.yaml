answer: |-
  First, please take a deep breath and let go of the idea that this is a "dumb question." It is not. In fact, you have stumbled onto one of the most famous, difficult, and debated problems in all of philosophy and law.

  Philosophers have written entire books arguing exactly what you are arguing. Your intuition—that "nothing" cannot do "something"—is logically very strong. You are in good company.

  The reason your brother-in-law (and most doctors, lawyers, and ordinary people) gets frustrated is that while your logic holds up in a physics lab, it breaks down in a hospital room.

  Let's take this slow. We are going to look at three things:
  1.  Why your intuition makes sense (The Physical View).
  2.  Why the hospital sees it differently (The "What-If" View).
  3.  Whether this destroys the idea of responsibility (The Blame Question).

  ### 1. The Physical View (Why you are right)

  You said: *"If nothing happens, there isn't a thing there to do any causing."*

  This is called the **Process View** of causation. Imagine a row of dominoes. Domino A falls and hits Domino B. There is a physical transfer of energy. A push. A spark. A chemical reaction.

  In the hospital case, the patient's heart stopped. Biologically, that was caused by a failure of an organ, a lack of oxygen, or a blockage. Those are physical events. The nurse *not* walking into the room is not a physical event. It is an absence of an event.

  If we are strictly talking about physics, you are correct. The universe does not contain "absences." It only contains matter and energy. You cannot find "the lack of a nurse" under a microscope. So, when you say "caused by not checking" sounds like a moral judgment dressed up as a fact, you are hitting on a truth that many philosophers agree with. In a strictly physical sense, the nurse's absence didn't push the patient's heart to stop.

  ### 2. The "What-If" View (Why your brother-in-law is right)

  So why does everyone at the hospital say the staff caused the death? Because in human life, we don't use the "Domino View" of cause and effect. We use the **"What-If View."**

  This is often called *counterfactual dependence*, but let's just call it the **Prevention Test**.

  We ask: *If the staff had done what they were supposed to do, would the patient be alive?*

  *   **If the answer is Yes:** Then the failure to act is treated as a cause.
  *   **If the answer is No:** (For example, if the patient was already beyond saving), then the failure to check is tragic, but it didn't "cause" the death.

  In the hospital, the staff are not just random objects in the room like a chair or a table. They are a **system of prevention**. Their entire job is to be a shield against death.

  Think of it like a dam holding back a river.
  *   **Physical view:** The water is held back by the concrete.
  *   **Omission view:** If the engineers *fail* to fix a crack, and the dam bursts, did the engineers cause the flood?

  Physically, the water caused the flood. But practically, the *failure to fix the crack* is the reason the town is underwater. We treat the "missing repair" as a cause because the repair was expected.

  This is why your plant example didn't convince you, but it actually proves your brother-in-law's point. You said: *"The plants died because nobody watered them."*
  But wait—nobody watered them *except you*. Thousands of other people didn't water them too. The mailman didn't water them. The President didn't water them. Why is it *your* cause?

  It is because you **promised**. That promise created a specific relationship. You became the "dam" for the plants. When you didn't show up, the "absence of water" became your responsibility.

  ### 3. Your Laptop vs. The Patient

  You mentioned your laptop getting soaked. You said: *"The rain did the soaking."* But you also admitted: *"Everyone including me says I caused that."*

  This is the crack in your own theory, and it's okay that it's there! It shows that deep down, you *do* accept causation by omission, but only when **you** are the one who left the window open.

  Why is the laptop case different from the nurse case?
  *   **In the laptop case:** You had control. You could have closed the window. The rain was the *mechanism*, but your open window was the *opportunity*.
  *   **In the nurse case:** The illness was the *mechanism*, but the lack of monitoring was the *opportunity*.

  The difference isn't about physics. It's about **expectation and duty**.
  *   Rain is expected to fall.
  *   Laptops are expected to break if wet.
  *   Nurses are expected to check on patients.
  *   Patients are expected to die if not monitored when critical.

  When we say the nurse "caused" the death, we are shorthand for: *"The nurse was the specific barrier assigned to prevent this, and the barrier was removed."*

  ### 4. Is it just blame in a lab coat?

  You asked: *"Is 'caused by not checking' just a moral judgement dressed up as a fact?"*

  Here is the honest answer: **Yes, partly.**

  When doctors or lawyers say an omission "caused" a result, they are mixing two things together:
  1.  **Fact:** The patient would likely be alive if checked.
  2.  **Norm:** The nurse *should* have checked.

  You are worried that if we admit omissions aren't "real" physical causes, then we can't blame anyone. **This is the leap you don't need to make.**

  We can hold people responsible for things they didn't do, even if those things didn't physically "push" the outcome.

  Think of a lifeguard.
  *   If a lifeguard pushes a swimmer under, that is **Action**.
  *   If a lifeguard sits in the chair texting while a swimmer drowns, that is **Omission**.

  In both cases, the swimmer dies. In both cases, the lifeguard goes to jail.
  Does the lifeguard "cause" the death in the second case? Physically, no. The water did. But morally and legally? Yes.

  We do not need "magic physical causation" to justify blame. We just need **Duty** and **Capacity**.
  *   **Duty:** Did you have a job to do? (The nurse did. The random person on the street did not.)
  *   **Capacity:** Could you have done it? (Yes, they could have walked in.)

  If you have the duty and the capacity, and you don't act, you are responsible. We don't need to prove that your "inaction" was a physical force. We just need to prove that your "action" would have stopped the tragedy.

  ### Summary

  You are not wrong to feel that "nothing" can't do "something." In the world of physics, you are 100% right. An absence is not a force.

  But in the world of humans, hospitals, and laws, we don't live in a world of pure physics. We live in a world of **systems**.
  *   A brake pedal doesn't make a car go; it stops it. If the brakes fail (an absence of stopping power), we say the brakes caused the crash.
  *   A nurse doesn't make a patient healthy; they stop them from getting worse. If the nurse fails (an absence of monitoring), we say the negligence caused the death.

  **To answer your final worry:**
  You asked: *"If omissions can't cause anything, then nobody can be held responsible for what they don't do."*

  You can relax. That does not follow.
  Responsibility is not about physics. It is about **trust**.
  *   We trust the nurse to check.
  *   We trust you to close the window.
  *   We trust the friend to water the plants.

  When that trust is broken, and harm happens that *would have been prevented* if the trust was kept, we hold the person responsible. We can call it "causation" for short, but you are smart to see that it's really about **broken expectations**, not magic invisible forces.

  Your brother-in-law isn't trying to trick you with science. He is trying to explain that in a hospital, *not acting* is part of the job description. When the job isn't done, the result is on them. You aren't silly for questioning it, but you can accept that in human terms, failing to save someone is treated the same as hurting them.
