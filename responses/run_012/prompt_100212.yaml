answer: |-
  Here is the decomposition of my credence regarding the moral obligation in inefficacy scenarios.

  ### The Terms

  **1. Complicity / Participation (0.65)**
  *   **Credence:** 0.65 that complicity grounds obligation independent of causal impact.
  *   **Justification:** There is a robust deontological intuition that participating in a wrongful collective practice (e.g., a system relying on animal suffering or carbon emissions) corrupts the agent's integrity, even if their marginal contribution is zero. However, I assign less than 0.8 because "complicity" is philosophically contested; some argue it collapses into consequentialism or relies on symbolic rather than moral weight.

  **2. Premise Validity / Expected Impact (0.75)**
  *   **Credence:** 0.75 that the "literal no difference" premise is false (i.e., the act *does* raise expected harm).
  *   **Justification:** In the real world, markets and elections operate on probabilistic thresholds, not deterministic binaries. A single vote has a non-zero probability of being pivotal; a single burger purchase adjusts marginal demand signals that propagate through supply chains. The "no difference" scenario is a philosophical toy model that rarely maps onto empirical reality. This is the strongest ground for obligation.

  **3. Fair Play / Rule-Consequentialism (0.55)**
  *   **Credence:** 0.55 that these frameworks generate obligation without causal impact.
  *   **Justification:** The "Fair Play" argument (do not free-ride on the restraint of others) and Rule-Consequentialism (follow the rule that *if generally followed* yields good results) bypass the causal bottleneck. I price this lower because Rule-Consequentialism faces the "collapse objection" (why follow the rule if breaking it *actually* produces better results in this specific instance?), and Fair Play relies on a cooperative scheme that may not be formally established in cases like carbon emissions.

  **4. Substitution / Opportunity Cost (0.80)**
  *   **Credence:** 0.80 that the obligation lives in the comparison to better alternatives.
  *   **Justification:** Even if eating the burger harms no animals, the $15 and time spent could have been used to alleviate suffering elsewhere (e.g., donation to effective charity). The moral failure is often not the *act* itself, but the failure to optimize resources. This ground remains solid even if the causal chain of the burger is severed.

  **5. Contamination / Redundancy (0.90)**
