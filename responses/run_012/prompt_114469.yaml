answer: |-
  This practice presupposes *causal compatibilism*. It accepts that while low-level arithmetic constitutes the ontology (the simms), high-level patterns (simmballs) possess explanatory autonomy via intervention. It commits to explanatory pluralism: the arithmetic realises the concept, but the concept explains the behaviour. The researcher need not commit to features being metaphysically distinct substances; they must only be *stable intervention points*. If adding a vector direction reliably alters behaviour, the feature is causally efficacious at the functional level, regardless of the underlying physics.

  Strictly, the practice needs *counterfactual robustness*: the correlation between activation and output must survive manipulation. It merely suits the researcher to reify these directions as 'concepts' the model 'uses'. This reification aids communication but isn't mechanistically required. The distinction between 'decodable' and 'used' features acknowledges that not all statistical regularities are causal levers, preserving a functionalist criterion for representation without demanding ontological dualism. The intermediate view—that there is no higher-level causation, only higher-level intervention—is precisely where this practice resides. It treats causation as a tool for explanation rather than a fundamental force. 'Steering' is a tidy way of nudging arithmetic, but describing it as 'activating a concept' provides compressible explanation.

  If one took seriously that only simms shove, the interpretive layer would dissolve. Steering remains possible, but becomes purely engineering: manipulating weights without semantic intent. Explanation would retreat to mechanistic traces—'neuron 452 fired'—rather than functional accounts—'the model recognised danger'. The claim to uncover *meaning* would vanish, leaving only morphology. The careenium would contain only marbles; simmballs would be recognised as observer-relative illusions. Consequently, interpretability could no longer claim to reverse-engineer cognition, only to map circuitry. The tension resolves by abandoning the higher level entirely, rendering the probe a diagnostic tool for physics, not psychology. Thus, the practice survives only by maintaining this productive ambiguity.
