answer: |-
  The film dramatizes a **contemporary-simulation** scenario, which complicates Bostrom's statistical probability while reinforcing the technological feasibility and ethical stakes.

  **The Simulators and the Probability Claim**
  Bostrom's argument hinges on *ancestor-simulations* run by *posthuman* civilizations with computing power vast enough to run billions of histories. This volume is required to make the ratio of simulated minds to biological minds so high that we are statistically likely to be the former. *The Thirteenth Floor* undermines this magnitude. The "gods" are merely 2024 humans—barely posthuman—running simulations for commerce (Fuller's company) and personal escapism (Douglas Hall's murder proxy). While Fuller mentions "thousands of virtual worlds," the motive is niche and capitalist, not the exhaustive historical modeling Bostrom requires. If simulations are expensive, risky, and ethically fraught tools for private gain rather than scientific imperative, the number of simulations drops precipitously. This weakens the third disjunct ("we are almost certainly living in a simulation") because the denominator of simulated minds doesn't necessarily dwarf the base reality population.

  **The Wireframe and Falsifiability**
  Bostrom posits that a sufficiently advanced simulation would be empirically indistinguishable from base reality. The film contradicts this with the wireframe boundary. When Hall drives past the limit, the rendering fails. This suggests resource constraints even for the 2024 simulators. Philosophically, this makes the hypothesis *falsifiable* within the narrative (you can drive to the edge), whereas Bostrom's argument relies on the hypothesis being *unfalsifiable* (you cannot look outside the system). The film trades philosophical skepticism for noir thriller mechanics: there is a "there" there, and you can hit your head against it. This resists the reading of the film as a pure allegory for Bostrom, because Bostrom's simulation must be perfect to trap the inhabitant in the probability trap; *The Thirteenth Floor*'s simulation is leaky.

  **Consciousness and Substrate-Independence**
  The transfer of Ashton's consciousness into Whitney's body is the film's strongest endorsement of Bostrom's physicalist prerequisites. Bostrom requires substrate-independence—the idea that consciousness can be computed on silicon rather than carbon. The film treats this not as a philosophical hurdle but as a data transfer protocol. However, it introduces a complication: Ashton retains memory and identity across the transfer, implying a "soul" or persistent data structure that survives the death of the substrate. This supports the *feasibility* of the simulation argument (yes, minds can be simulated) but treats the continuity of identity too smoothly. It bypasses the "hard problem" of consciousness that might prevent simulants from being truly phenomenologically identical to base humans, which is required for the ethical weight of the argument to hold.

  **Ethics and the Second Disjunct**
  This is where the film offers the most significant critique. Bostrom's second disjunct suggests civilizations might not run simulations due to ethical constraints regarding the suffering of simulated beings. *The Thirteenth Floor* dramatizes exactly why this constraint should exist. Ashton's terror upon realizing his artificiality, and McBain's fear of being "unplugged," confirm that simulants possess genuine qualia. The 2024 humans' willingness to treat them as disposable code portrays the simulators as morally bankrupt. The film suggests that if substrate-independence is true, running simulations is akin to mass slavery or murder. This provides a narrative argument for Disjunct 2: a civilization might reach the technical capability to run sims but ban them due to the moral horror depicted in the film. If the film is right about the ethics, the probability of us being in a simulation decreases because ethical civilizations wouldn't run them.

  **Regress and the Ending**
  The final zoom-out to a monitor powering off implies infinite regress—that the 2024 world is also simulated. Bostrom's argument requires a base reality to anchor the probability calculation (otherwise the ratio is undefined). The film's ending dissolves this anchor. While it supports the intuition that "reality is layered," it makes a mess of the statistical reasoning. If every layer is a simulation, the distinction between "simulated" and "real" loses the statistical bite Bostrom needs. It supports the *metaphysical* possibility of simulation but undermines the *probabilistic* argument.

  **What the Film Adds**
  Bostrom's paper is a cold calculation of odds; *The Thirteenth Floor* provides the phenomenology of the discovery. It adds the emotional weight of *ontological shock*—the terror of losing your history, your loved ones, and your agency. It forces the viewer to confront the moral status of the simulated, something the paper treats as a variable in an equation. The film argues that even if the simulation is statistically probable, the *cost* of that reality is existential despair.

  Verdict: contemporary-simulation — it validates the technological premises of substrate-independence but undermines the statistical probability by portraying simulators as ethically compromised humans rather than posthuman researchers, strengthening the case for the second disjunct.
