prompt: |-
  My film club is doing a 90s sci-fi month and I've volunteered The Thirteenth Floor (1999) — the loose remake of Fassbinder's World on a Wire, itself from Galouye's Simulacron-3. I want to read it through Bostrom's simulation arguement, properly, not just 'ooh, nested worlds'. Recap so we're aligned: Fuller's company has built a VR simulation of 1937 LA whose inhabitants don't know they're programs; Hall goes in as a bank clerk to retrieve a message, drives somewhere he'd never normally go and reaches a point where the world turns into a crude wireframe, and works out that his own 1999 LA is itself simulated — one of thousands of virtual worlds, and the only one where a simulated person has built a sim of their own. The 'real' world turns out to be 2024, basically us a few decades on, and the last shot collapses to a thin line of light like a monitor powering off.

  So: what does the film actually dramatize? The argument is a trilemma with a probability claim at the end, and it only gets going if the simulators are posthumans running ancestor-simulations and if substrate-independence is true. The film seems to hand me a different scenario — simulators who aren't posthuman at all, running worlds for commerce and for one guy's private fantasies — and I want to know what that does to the argument rather than being told the film 'anticipates' it. Where does the nesting actually help, where does the wireframe test cut against the complaint that the hypothesis is unfalsifiable, and what should I make of Ashton's consciousness ending up in Whitney's body after Whitney dies inside the 1937 world — is that a script convenience or does it quietly ditch the philosophy of mind the argument needs? Also the ethics: Ashton finding out he's artificial and being terrified, McBain asking Jane whether someone will unplug him and getting a no — if simulants are conscious, does the film give me a new reason to think a civilization would or wouldn't run ancestor-simulations, i.e. something bearing on the second disjunct? And does the endless-regress ending support the argument or make a mess of the 'we're probably near the bottom' reasoning? Be honest about where the film resists the reading, and end by telling me what it adds that the paper can't.

  Finish with one line, Verdict: <ancestor-simulation / contemporary-simulation / no-simulation> — whichever the film actually dramatizes — then a sentence on whether that helps or hurts Bostrom's case.
