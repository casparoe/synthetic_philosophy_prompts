answer: |-
  # The Representation Decision Tree

  **Starting Point:** We agree that feature $F$ is **causally load-bearing** (intervening on it reliably shifts model behavior) and **predictive** (it beats alternatives at predicting held-out activations).

  ### Node 1: The Status of the Claim
  **Question:** When we say $F$ "represents" a concept, are we describing a property the network possesses independently of us, or are we adopting a useful convention for describing a causal mediator?
  *   **A. Independent Property (Realism):** Go to Node 2.
  *   **B. Useful Convention (Instrumentalism):** Go to Node 3.

  ---

  ### Node 2: The Nature of the Property (Realism Branch)
  **Question:** Is it sufficient that $F$ causally drives the correct output, or must $F$ be the kind of state that is capable of being "wrong" (misrepresenting the input)?
  *   **A. Causal Drive is Enough:** Go to Node 4.
  *   **B. Must Be Capable of Error:** Go to Node 6.

  ---

  ### Node 3: The Scope of the Convention (Instrumentalism Branch)
  **Question:** If this is a convention, is its usefulness fixed by the network's internal structure alone, or does it shift depending on which input distribution and output vocabulary we choose?
  *   **A. Fixed by Structure:** **Leaf 1**
  *   **B. Shifts with Task:** **Leaf 2**

  ---

  ### Node 4: Context Robustness (Causal Realism Branch)
  **Question:** Does $F$ need to drive the output across significant distribution shifts, or is load-bearing in the current test context enough?
  *   **A. Current Context Enough:** **Leaf 3**
  *   **B. Across Distribution Shifts:** Go to Node 5.

  ---

  ### Node 5: Granularity of the Cause (Robust Causal Branch)
  **Question:** Is the representational unit this specific feature direction alone, or the larger subcircuit computation it participates in?
  *   **A. Specific Direction:** **Leaf 4**
  *   **B. Larger Subcircuit:** **Leaf 5**

  ---

  ### Node 6: Grounding the Content (Semantic Realism Branch)
  **Question:** What fixes *what* $F$ represents: how downstream circuits actually use it, or the training objective/compressive description?
  *   **A. Downstream Usage:** Go to Node 7.
  *   **B. Training Objective/Compression:** **Leaf 6**

  ---

  ### Node 7: Granularity of the Content (Downstream Semantic Branch)
  **Question:** If fixed by downstream usage, is the unit of meaning this specific feature direction, or the larger subcircuit computation?
  *   **A. Specific Direction:** **Leaf 7**
  *   **B. Larger Subcircuit:** **Leaf 8**

  ---

  ## The Leaves

  **Leaf 1: Structural Instrumentalism**
  *   **Awkward Commitment:** The feature represents "dog" because of the weights, even if we never use the model for dog classification and the label helps no one.

  **Leaf 2: Radical Pragmatism**
  *   **Awkward Commitment:** The feature represents "dog" relative to our current test set, but there is no fact of the matter about what it represents if we change the task.

  **Leaf 3: Local Causal Realism**
  *   **Awkward Commitment:** The feature represents "dog" on this distribution, but stops representing it if the background statistics change slightly.

  **Leaf 4: Atomistic Causal Realism** (Unnamed)
  *   **Awkward Commitment:** This specific vector direction represents "dog" across all contexts, even if the rest of the circuit changes and the feature becomes causally isolated.

  **Leaf 5: Holist Causal Realism** (Unnamed)
  *   **Awkward Commitment:** The feature only represents "dog" as part of a larger subcircuit; isolating it for intervention destroys the very representation we claim to study.

  **Leaf 6: Teleological Realism** (Unnamed)
  *   **Awkward Commitment:** The feature represents "dog" because the training objective demanded it, even if downstream layers currently ignore it.

  **Leaf 7: Atomistic Role Functionalism** (Unnamed)
  *   **Awkward Commitment:** This direction represents "dog" because of how downstream layers read it, even if the feature activates for non-dogs in ways the downstream layers fail to correct.

  **Leaf 8: Holist Role Functionalism** (Unnamed)
  *   **Awkward Commitment:** The representation exists only at the subcircuit level defined by downstream usage, meaning individual features have no meaning outside their specific computational context.

  ---

  ## Analysis of the Logical Space

  ### Indistinguishable Leaves
  The tree cannot practically separate **Leaf 5 (Holist Causal Realism)** and **Leaf 8 (Holist Role Functionalism)**. Both claim the "real" unit is the subcircuit, not the feature. The difference is theoretical: Leaf 5 says the subcircuit matters because it *causes* the output; Leaf 8 says it matters because it *interprets* the state. In empirical work, both teams run the same circuit analyses and intervene on the same edges. The distinction is only visible if the subcircuit drives output (Causal) but violates truth conditions (Semantic), which is hard to test without a grounded world model.

  ### Unoccupied Combinations
  1.  **Realism + Task Relativity (Node 1:A, Node 3:B):**
      *   **Verdict:** **Incoherent.** If representation is an independent property (Realism), it cannot depend on the interpreter's choice of task (Task Relativity). This view claims the network has a fact-of-the-matter state that changes when the user changes their mind.
  2.  **Semantic Realism + Local Context (Node 2:B, Node 4:A):**
      *   **Verdict:** **Merely Unattractive.** Semantic views usually require truth conditions that hold generally. A feature that "truthfully represents" a concept only on one specific dataset but fails to generalize looks more like a spurious correlation than a representation. Few hold this view explicitly, though some empirical claims implicitly rely on it.
  3.  **Causal Realism + Training Grounding (Node 2:A, Node 6:B):**
      *   **Verdict:** **Simply Unclaimed.** Causal realists focus on the *current* mechanism (what drives output now). Training grounding focuses on *history* (what was optimized). Combining them requires claiming a feature represents X because it was trained for X, even if it currently drives output for Y. This is a hybrid view no one currently argues for.

  ### Family of Views
  **Leaf 6 (Teleological Realism)** is a family of views. The internal split is between **Optimization Teleology** (meaning is fixed by the loss function) and **Compression Teleology** (meaning is fixed by the best description of the behavior). The awkward commitment applies to both, but the Optimization variant struggles with features that emerge despite the objective (grokking), while the Compression variant struggles with features that are real but hard to describe.

  ### Granularity Note
  Distinction (iv) regarding the "network's overall input-output function" (Radical Holism) does not appear as a leaf. This is because if the unit of analysis is the *whole function*, the concept of an internal "feature representation" dissolves entirely into input-output behaviorism. This view occupies the space of rejecting the Starting Point itself (denying that internal states are the right level of analysis), so it falls outside the tree's scope.
