prompt: |-
  I'm an intern on a state senate committee, and last week we sat through a hearing on a bill setting a statewide minimum standard for short-term rentals, and the chair must have said six times that decisions should be made as close to the people as possible — mostly to argue the bill should be gutted, but once, weirdly, to argue the state ought to overrule a city that had gone its own way on the same issue. I want to understand the thing before I draft the memo, because it definately can't mean what it sounds like it means.

  So lay out the different precise claims that slogan could be making, as a menu rather than a verdict, running from the trivial to the radical. What is "close" supposed to be: physical or administrative distance, the smallest unit containing everyone affected, the unit with the best local knowledge, the unit where preferences are most uniform, the unit that bears the costs of what it decides, the lowest unit that can actually solve the problem, the unit with the cleanest democratic accountability, the unit people can exit? And does "the people" mean the people of the locality, or the people as a whole — because that one seems to flip the whole thing. For each reading, tell me whether it's a platitude nobody could deny, a substantive and defensible claim, or false or self-undermining, and which readings would actually support each of the two opposite uses the chair made of it. My suspicion is that the literal version bottoms out at the individual, which is not what he's after, but tell me if that's wrong. I'd also like to know, per reading, where the burden of proof lands — on the state or on the locality — and whether any of these readings could settle a case on its own or only tell you who gets to decide.

  One more thing: a colleague says the EU treaties contain the same idea plus an extra clause to the effect that the higher level acts only if the goal can't be achieved well enough lower down. If that's roughly right, say what that clause does to the slogan, since it sounds like it could cut the other way.

  Keep it as a list I can hand to my boss. No citations needed — she wants the arguments, not the litrature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Intern on a state senate committee.
      *   **Task:** Draft a memo understanding the slogan "decisions should be made as close to the people as possible" (subsidiarity principle).
      *   **Context:** The Committee Chair used the slogan six times, mostly to argue for local control (gut the state bill), but once to argue for state preemption (overrule a city). This apparent contradiction needs unpacking.
      *   **Format:** A list/menu of precise claims (not a verdict), ranging from trivial to radical. No citations needed (boss wants arguments, not literature).
      *   **Specific Questions to Address:**
          *   What does "close" mean? (Physical, administrative, affected unit, knowledge, preference uniformity, cost-bearing, problem-solving capacity, accountability, exit options).
          *   Who are "the people"? (Locality vs. Statewide).
          *   Classification of each reading: Platitude, Substantive/Defensible, or False/Self-undermining.
          *   Which readings support the Chair's two opposite uses (Local Control vs. State Preemption)?
          *   Where does the burden of proof lie (State or Locality)?
          *   Can the reading settle a case or just assign jurisdiction?
          *   Address the EU "Subsidiarity" clause comparison (higher level acts only if lower can't).
      *   **Tone:** Professional, analytical, clear, suitable for a legislative boss.
      *   **Constraint:** "Keep it as a list I can hand to my boss."

  2.  **Deconstruct the Slogan ("Close to the People"):**
      *   The core concept is *Subsidiarity*, though the prompt asks to avoid jargon/literature citations. I need to explain the *concepts* without necessarily leaning on the academic label too heavily, though the EU reference explicitly brings it in.
      *   The Chair's contradiction (Local Control vs. State Preemption) suggests the slogan is being used instrumentally rather than principledly, or that different definitions of "close" apply in different contexts.
      *   The "Literal version bottoms out at the individual" point needs addressing.

  3.  **Drafting the Menu of Claims (Iterative Process):**

      *   *Reading 1: Physical/Administrative Proximity.* (Trivial).
      *   *Reading 2: Local Knowledge.* (Substantive).
      *   *Reading 3: Preference Matching/Homogeneity.* (Substantive).
      *   *Reading 4: Cost/Benefit Internalization.* (Substantive).
      *   *Reading 5: Problem-Solving Capacity.* (Crucial for the Chair's flip-flop).
      *   *Reading 6: Democratic Accountability/Exit.* (Substantive).
      *   *Reading 7: The "People" as the Statewide Electorate.* (The flip).
      *   *Reading 8: The Individualist Bottom.* (Radical/False).

      *Refining the Classifications:*
      *   Need to label them: Platitude, Defensible, or Flawed.
      *   Need to map them to the Chair's arguments (Gut the bill vs. Preempt the city).
      *   Need to assign Burden of Proof.

  4.  **Addressing the EU Clause:**
      *   The EU principle is "Subsidiarity." The clause is effectively a *necessity test*.
      *   How does it change the slogan? It stops it from being a mere preference for localism and makes it a functional test. If the local level *can't* do it, the higher level *must* (or may) step in. This justifies the Chair's one instance of preemption.

  5.  **Addressing the "Individual" Point:**
      *   If "close to the people" means "closest to the individual," it implies anarchy or pure market choice. This is self-undermining for a legislature. I need to confirm the user's suspicion is largely right but explain *why* it stops at the municipality level in practice.

  6.  **Structuring the Output:**
      *   Header: Memo style (To, From, Subject).
      *   Introduction: Acknowledge the ambiguity.
      *   The Menu (The Core): Numbered list of interpretations.
      *   The EU Clause Analysis.
      *   The "Individual" Question.
      *   Conclusion/Summary for the Boss.

  7.  **Drafting Content - Specific Considerations:**
      *   *Chair's Contradiction:* How to explain it? Usually, "close to the people" means local *unless* the local decision hurts the broader "people" (the state). So, Reading 7 (The People = Statewide) explains the preemption moment. Reading 2 or 3 explains the local control moments.
      *   *Burden of Proof:* If it's a platitude, burden is on anyone wanting state intervention. If it's the EU version, burden is on the state to prove local failure.
      *   *Tone Check:* Keep it sharp. The user is an intern, the boss is busy. No fluff.

  8.  **Refining the "Menu" Items (Self-Correction during drafting):**
      *   *Item 1 (Physical):* Too vague. Call it "Geographic Proximity."
      *   *Item 5 (Capacity):* This is the key to the Chair's preemption argument. If the city *can't* solve the housing/STR issue, the state *must*.
      *   *Item 7 (Who are the people):* This is the critical pivot. If "the people" = "the constituents of the state," then state law is closer to *them* than city law is to the *statewide* interest.
      *   *Item 8 (Individual):* Confirm the user's suspicion.

  9.  **Final Review against Constraints:**
      *   List format? Yes.
      *   No citations? Yes.
      *   Address EU clause? Yes.
      *   Address "Individual" bottoming out? Yes.
      *   Address Burden of Proof? Yes.
      *   Address Chair's two uses? Yes.

  10. **Final Polish:** Ensure the distinction between "Substantive" and "Platitude" is clear. Ensure the EU section explains the *shift* in logic (from presumption to test).

  *(Self-Correction on the EU part)*: The user asked "what that clause does to the slogan." I need to explain that it transforms the slogan from a *preference* into a *conditional rule*. It validates the Chair's one exception.

  *(Self-Correction on the "Individual" part)*: The user suspects it bottoms out at the individual. I should confirm this is logically true but politically useless, which is why "locality" becomes the proxy.

  *(Final check on the Chair's contradiction)*: Make sure to explicitly link which readings support which of the Chair's moves.

