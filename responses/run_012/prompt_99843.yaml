      *   *Check:* Did I address the "veto" power? Libet thought consciousness could veto. The summary ignores this. I should mention it.
      *   *Check:* Is the "punctate inner act" criticism fair? Yes, Rylean critique. But some Libertarians *do* hold that view, so it's not a straw man for everyone, just for sophisticated compatibilists.
      *   *Check:* Am I being too hard on the summary? The summary is the "popular science" version, so it *should* be critiqued for simplification.
