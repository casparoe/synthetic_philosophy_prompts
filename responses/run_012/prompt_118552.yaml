answer: |-
  Secure agreement on finite aggregation, extend that logic to an infinite population to break the arithmetic, translate that arithmetic failure into an ethical paralysis, and conclude by refusing to resolve it to preserve the tension between mathematical consistency and moral intuition.

  **The Carrying Example**
  Replace your "adding one person" case with **The Universal Degradation**. Describe two worlds, both containing an infinite sequence of people indexed 1, 2, 3… to infinity. In World A, every person has a wellbeing level of 10. In World B, every person has a wellbeing level of 5. Do not start with the "adding one person" case.

  *Why:* Your audience includes economists and physicists. If you start with "adding one person," the economists will immediately dismiss the paradox using measure theory intuition ("a single point has measure zero in an infinite set"), allowing them to treat the infinity math as correct and the ethical intuition as sloppy. By making *everyone* worse off in World B, you block the "measure zero" escape route. The sum is still $\infty = \infty$, but the Pareto principle (if everyone is worse off, the world is worse) screams that B is inferior. This forces the arithmetic to feel like it is violating ethical laws, rather than just behaving strangely.

  **The Sequence and Misconceptions**
  1.  **Elicit the Finite Intuition (0–5 mins):** Ask the room how we compare two finite groups. They will say "add up the wellbeing." Write $\sum$ on the board. Establish this as the "Standard Tool."
      *   *Misconception:* "Infinity is just a very large number."
      *   *Intervention:* Do not address this yet. Let them apply the Standard Tool to the infinite case themselves.
  2.  **Break the Tool (5–15 mins):** Present The Universal Degradation. Ask them to apply the Standard Tool. Write $\sum 10 = \infty$ and $\sum 5 = \infty$. Ask: "Which world is better according to the tool?" They must say "Equal."
      *   *Misconception:* "This is just a math puzzle, not ethics."
      *   *Intervention:* This is the critical pivot. Immediately ask: "Would you prefer to live in World A or World B?" When they say A, point out that the Standard Tool forbids this preference. The math is now actively prohibiting a moral judgment. This makes the arithmetic do philosophical work by constraining agency.
  3.  **Generalize the Paralysis (15–30 mins):** Show that this isn't just about A vs. B. If totals are always infinite, *no* improvement matters unless you change the infinite cardinality (which we can't do with wellbeing). The Standard Tool renders ethics inert.
      *   *Misconception:* "Just use averages instead of totals."
      *   *Intervention:* Briefly show that averages work here (10 > 5), but ask them to consider a world where the population density changes over time. Hint that averages break elsewhere (e.g., infinite people at 10 vs. infinite people at 10 plus infinite people at 100), but do not solve it. Use this to show there is no easy swap fix.
  4.  **The Check (30–35 mins):** Do not ask "Do you understand?" Instead, run a **Forced Choice Vote**. Present a third case: World C (Infinite people at 10) vs. World D (Infinite people at 10, plus one person at -1,000,000 agony). Ask for a show of hands: "Who says C is better?" Then ask: "Who says the Total Utility model allows you to say C is better?" The gap between the hands is your metric of success. If they see the gap, the problem has landed.

  **What to Refuse to Cover**
  Openly refuse to cover **technical solutions** (discounting future utilities, hyperreal numbers, or cardinality comparisons). State explicitly: "We are not fixing this today."
  *Why:* Providing a technical fix allows the audience to exhale and categorize this as a "solved math problem." Your goal is to leave them with the normative crisis. If you show them how to resolve the infinity, they will stop worrying about the ethical incoherence. The philosophical value lies in the breakdown of the theory, not the repair of the arithmetic.

  **The Ending**
  End with the problem **unresolved**.
  *Why:* For this specific mixed audience, resolving the problem requires technical machinery (set theory or non-standard analysis) that the undergraduates and law students do not have and the economists will critique. If you attempt a resolution, the session becomes a math lecture for the physicists and gibberish for the lawyers. By leaving it unresolved, you validate the philosophers' instinct that formal models can fail to capture normative truth. You want them leaving the room uncomfortable that their best tool for judging goodness breaks when the stakes are highest; that discomfort is the philosophical lesson.
