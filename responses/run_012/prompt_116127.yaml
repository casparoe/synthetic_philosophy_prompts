      *   **Intermediate Conclusion:** Macro-story adds nothing *ontologically*; it's just a shorthand for computational limitations. Macro-objects (balls, chutes) are "fictions."
      *   **Final Conclusion (Applied to Mind):** Physical stuff does the causing. Beliefs/desires don't cause anything. Psychology is a useful fiction (Eliminative Materialism).

  3.  **Evaluate the Thought Experiment (The Pinball Machine):**
