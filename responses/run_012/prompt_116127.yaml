      *   *Does Premise 2 follow?* Yes, generally accepted that micro-physics determines macro-physics (supervenience/causal closure).
      *   *Does the Intermediate Conclusion follow?* **Here is the crux.** Does "fixed by micro" mean "macro adds nothing *ontologically*"? This is the debate between *reductionism/eliminativism* and *non-reductive physicalism/functionalism*.
      *   *The "Fiction" Claim:* Calling the big balls "fictions" is a strong ontological claim. Most philosophers (even physicalists) would call them "real patterns" or "emergent properties," not fictions. A table is made of atoms, but the table is still real.

  4.  **Evaluate the Application to Mental Causation:**
      *   *The Analogy:* Big Balls = Beliefs/Desires. Tiny Balls = Neurons/Particles.
      *   *The Claim:* Beliefs don't cause actions; neurons do.
      *   *The Problem:* This is the classic "Exclusion Argument" (Jaegwon Kim). If the physical cause is sufficient, is the mental cause excluded?
      *   *Counter-arguments:*
          *   *Multiple Realizability:* Beliefs can be realized in different physical substrates. The macro-pattern matters more than the micro-details for prediction/explanation.
          *   *Causal Relevance vs. Causal Sufficiency:* Neurons might be the *mechanism*, but beliefs are the *reason*.
          *   *Program Explanation (Jackson & Pettit):* The mental state programs the physical state to occur.
