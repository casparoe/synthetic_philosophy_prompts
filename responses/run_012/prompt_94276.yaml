prompt: |-
  I'm putting together a handout for a grad seminar session on the heterogeneity problem for hedonism — the worry that 'pleasure' is a grab bag with no common core, so an orgasm, the taste of a good peach, the relief of scratching an itch, the satisfaction of finally getting a proof to click, the pleasure of a sad song, and the kick a masochist gets from pain dont obviously share any one phenomenal quality. What I want is a decision tree / taxonomy of the positions on 'what, if anything, do pleasures have in common?' that I can hand out and let the room argue about.

  You're a philosopher who knows the pleasure literature well. Think the logical space through carefully before you write, then just start in with the tree itself — no preamble, no scene-setting summary of the debate first.

  Build it from the questions rather than from a list of -isms: each branch node should be a question about a case or a claim that a reader can answer without already knowing which position it leads to, and each leaf should be a position (name it if it has a standard name, otherwise mark it 'unnamed') plus one sentence on its most awkward commitment. The cases above should be doing real work. In particular I want a branch on whether a state that feels like nothing in particular but is persistently wanted counts as a pleasure, and a branch on whether the unifier has to be something the person can introspect.

  Cover at least: the 'no common core' option and whether it kills hedonism as a value theory or only kills a claim about pleasure's nature; the single phenomenal quality / distinctive feeling option; the 'pleasure is an attitude toward an experience rather than a quality of it' option; the functional-role option; one where pleasures are a determinable with many heterogeneous determinates; and one where the fix is to stop talking about pleasure and make valence or hedonic tone the primitive. Also give me a branch on whether the heterogeneity claim is meant as a conceptual point about our concept of pleasure or an empirical point about mechanisms — people run those together and I want them pulled apart.

  Flag any two leaves the tree can't really separate, and list the combinations of answers that come out empty, saying for each whether nobody's there because the view is incoherent, unattractive, or just unexplored. Six to eight branch nodes is about right. Dont worry about who said what — I don't need names or a reading list.
