  **1. Is the claim that pleasures are heterogeneous a claim about our *concept* of pleasure, or about the *empirical mechanisms* (neural/psychological) underlying them?**
  *   **Empirical:** → **Leaf A**
  *   **Conceptual:** → **Question 2**

  **2. (If Conceptual) Is there *any* necessary common feature shared by all instances (e.g., orgasms, proof-clicks, itch relief)?**
  *   **No:** → **Question 7**
  *   **Yes:** → **Question 3**

  **3. (If Yes Core) Is this common feature a phenomenal property of the experience itself?**
  *   **Yes:** → **Question 4**
  *   **No:** → **Question 5**

  **4. (If Yes Phenomenal) Must this property be introspectively recognizable as the *same* specific quality across disparate cases (e.g., masochist pain vs. peach taste)?**
  *   **Yes:** → **Leaf B**
  *   **No:** → **Leaf C**

  **5. (If No Phenomenal) Can a state count as a pleasure even if it feels like nothing in particular, provided the subject wants it to continue?**
  *   **Yes:** → **Leaf D**
  *   **No:** → **Question 6**

  **6. (If No Wanted) Is the common feature a causal/functional role (e.g., reinforcement) rather than a mental attitude toward the experience?**
  *   **Yes:** → **Leaf E**
  *   **No:** → **Leaf F**

  **7. (If No Common Core) Does the lack of a common core destroy hedonism as a value theory, or merely require a revision of pleasure's nature?**
  *   **Destroys:** → **Leaf G**
  *   **Preserves:** → **Leaf H**

  ***

  **Leaf A: Phenomenal Homogeneity / Empirical Heterogeneity**
  *   **Awkward Commitment:** Commits to identical feels across cases (itch vs. math) despite admitting diverse neural mechanisms produce them.

  **Leaf B: Classical Phenomenalism**
  *   **Awkward Commitment:** Must insist the 'feel' of solving a math proof is qualitatively identical to scratching an itch or hearing a sad song.

  **Leaf C: Determinable Hedonic Tone**
  *   **Awkward Commitment:** Posits 'hedonic tone' as a primitive property that is felt but lacks any specific qualitative character like a 'tingle'.

  **Leaf D: Desire-Based Theory of Pleasure**
  *   **Awkward Commitment:** Counts a drug-induced stupor as pleasurable if wanted, even if experienced as a blank void.

  **Leaf E: Functionalism about Pleasure**
  *   **Awkward Commitment:** Might attribute pleasure to simple thermostats or aliens based on behavior alone, devoid of feeling.

  **Leaf F: Attitude Theory of Pleasure**
  *   **Awkward Commitment:** Struggles to distinguish the pleasure from the attitude, making 'pleasurable experience' a redundant phrase.

  **Leaf G: Anti-Hedonism / Error Theory**
  *   **Awkward Commitment:** Must explain why 'pleasure' seems central to value if the concept is fundamentally fractured.

  **Leaf H: Family Resemblance Hedonism**
  *   **Awkward Commitment:** Must explain what makes the heterogeneous family 'good' without a common thread of value.

