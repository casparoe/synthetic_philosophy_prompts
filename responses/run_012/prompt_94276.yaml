  **Indistinguishable Leaves**
  **Leaf D (Desire-Based)** and **Leaf F (Attitude Theory)** are difficult to separate in practice; a "pro-attitude toward sensation" often extensionally matches "wanting a state to continue," making the structural distinction hard to test against cases.

  **Empty Combinations**
  1.  **Conceptual Heterogeneity + Single Phenomenal Quality (Leaf B):** Incoherent. If the concept allows heterogeneity, there cannot be a single necessary phenomenal quality.
  2.  **Feelingless Wanted (Leaf D) + Introspectibly Identical Phenomenal Quality (Leaf B):** Incoherent. A state cannot be both feelingless and possess an introspectible phenomenal quality.
  3.  **Empirical Heterogeneity + No Common Core (Conceptual) (Leaf G/H):** Unexplored. Philosophers who argue for empirical heterogeneity typically defend conceptual homogeneity (Leaf A) to save hedonism, rather than abandoning the core entirely.
