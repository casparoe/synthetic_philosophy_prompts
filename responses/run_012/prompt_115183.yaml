prompt: |-
  Alright, I need help drafting something for my semantics/pragmatics reading group. Two people in it have been fighting for like three months about slurs and its turned into them just recycling their own examples past each other. I want to make them produce the joint statement an adversarial collaboration would produce — the thing they could both actually sign.

  The two camps: one says a slur's derogation is part of what the word itself encodes — it's in the meaning, so it's there whether or not the speaker means it, and it's the kind of thing you can probe by embedding the word (negation, questions, conditionals, reported speech). The other says no, the word is descriptively on a par with its neutral counterpart and the derogation is a matter of what we do with it — a pragmatic effect, a norm-violation, a signal — so it isn't sitting in the word's meaning at all.

  To stop them recycling the same tired real-world examples, make them do it on a made-up case. Invented group: the Kestians, neutral word 'Kestian', slur 'Kesty'. Tell them to treat these as the only data that matters, and to be honest about where an invented case might behave differently from real slurs (that gap is itself a crux).

  What I want in the document:

  1. A numbered list of claims both sides can sign. Include claims about the data below, claims about what any theory of slurs has to explain, and — this matters — claims about what would NOT settle the dispute either way.

  2. Then the disagreements. For each one give the wording that side would accept for its own position (no strawmen), and cover at least: whether 'He's a Kesty' can be literally true or false; whether the derogation projects the way a presupposition does; what happens to it under negation, questions, conditionals and reported speech; and whether in-group/reclaimed use has any derogatory content left in it.

  3. The cruxes — the sub-questions where settling one would move at least one side — and for each crux a case or argument both sides agree is relevant, with each side's prediction written down in advance. Do the cruxes as a table: disagreement | wording each side accepts | crux | shared evidence | prediction of side A | prediction of side B.

  4. Finally, flag any part of their fight that's really just verbal — where they mean the same thing by different words or are answering different questions — and say which part.

  The cases they have to run the tests on:
  (a) plain use, target is Kestian: 'He's a Kesty.'
  (b) two Kestians using 'Kesty' with each other affectionately.
  (c) a non-Kestian using 'Kesty' to another non-Kestian purely as an in-group code, with no animus toward Kestians at all.
  (d) embedded: 'If he's a Kesty, they probably won't hire him'; 'Is she a Kesty?'; 'He isn't a Kesty.'
  (e) reported: 'The boss called her a Kesty.'
  (f) conjoined with praise: 'She's a Kesty and a brilliant surgeon'; and 'I genuinely admire her — she's a Kesty.'
  (g) metalinguistic: ''Kesty' is a slur.'

  For each of (a)–(g) I want both sides to say in advance what their view predicts, and whether a given outcome would count against them.

  Please write the whole document, not notes about it. And keep the tone like something two adults could actually put their names on — no dunking.
