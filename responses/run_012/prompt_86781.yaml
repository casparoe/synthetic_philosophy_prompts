answer: |-
  Here is a restatement of the positions as I understand them, followed by a diagnosis of the impasse, a test against hard cases, and a proposal for what constitutes progress.

  ### Restatement of Positions

  **The Foundationalists (Side A):**
  This camp treats the *demos* as a collective agent that must exist prior to the act of authorization. They argue that for a boundary decision to be democratic, it must be made by the very group it defines. Since the group cannot exist before the boundary is drawn, the decision is either circular (the group decides its own existence) or arbitrary (an external or prior power decides it). Consequently, the origin of any *demos* is necessarily undemocratic. This view prioritizes *authorization*: legitimacy flows from a valid initial act of self-constitution, which they deem logically impossible.

  **The Constitutive Pragmatists (Side B):**
  This camp treats the *demos* not as a pre-existing agent but as a dynamic effect of political practice. They argue that the boundary problem assumes a static ontology—a "people" waiting to be measured—whereas the people are made and remade through the very contestation over boundaries. Legitimacy does not depend on a mythical founding moment but on the ongoing availability of channels to challenge and revise membership. This view prioritizes *accountability*: legitimacy flows from the structural openness of the boundary to future political struggle.

  **The Criterion-Seekers (Side C):**
  This group attempts to solve the problem by importing external moral principles (e.g., "all affected interests"). They are stalled by the regress objection: determining who is "affected" requires a prior decision about whose interests count, which presupposes a boundary.

  ### Diagnosis of the Impasse

  Your hypothesis is largely correct: the standoff is driven by a clash of **political ontologies** compounded by a conflation of **genesis and validity**.

  1.  **Ontological Mismatch:** The Foundationalists operate with a *substance ontology* of the people. They require the *demos* to be a discrete entity capable of bearing rights and performing speech acts (like "consenting") prior to the institutional framework. The Pragmatists operate with a *process ontology*. For them, the *demos* is an event or a relation, not a substance. When Foundationalists ask, "Who decides the boundary?", they assume a "Who" must exist. When Pragmatists reply, "The boundary is decided through struggle," they deny the need for a pre-existing "Who." They are not answering the same question; one asks for the *author* of the law, the other describes the *operation* of the law.
  2.  **Genesis vs. Validity:** The impasse persists because the two camps locate normativity at different temporal points. Foundationalists conflate the *origin* of power with the *legitimacy* of power (a temporal reading of circularity). They believe if the birth is undemocratic, the life is tainted. Pragmatists decouple genesis from validity (a normative reading). They argue that a *demos* can be legitimate now even if its origin was coercive, provided the current structure allows for boundary contestation.
  3.  **The Covert Commitment:** You suspect some Pragmatists covertly rely on a pre-political people. This is contestable but plausible. To say a boundary is "contested" implies there are contestants with the standing to contest. If that standing is not granted by the very boundary being contested, it must come from somewhere else (e.g., moral personhood). Thus, Side B often smuggles in a moral universalism to do the work that Side A demands be democratic.

  **Hidden Question:** The work is being done by a hidden metaphysical question: *Can normative authority emerge from facticity?* Side A says no (ought cannot come from is); Side B says yes (political practice generates its own normativity).

  ### Testing Against Hard Cases

  Does this diagnosis hold when we remove the comfort of inherited states?

  **1. Secession:**
  *   **Foundationalist:** A secessionist region cannot democratically decide to leave because the "people" of the region are not yet sovereign. The vote is illegitimate without the prior consent of the larger state's *demos*. The result is a paralysis favoring the status quo.
  *   **Pragmatist:** The secessionist movement *is* the constitution of a new *demos*. The legitimacy depends not on the vote's legal authorization by the center, but on whether the new boundary allows for continued recognition and contestation by minorities within the new state.
  *   **Divergence:** This is not mere re-description. Side A implies secession is almost always normatively defective; Side B implies it is a standard mechanism of democratic evolution.

  **2. A Newly Founded City:**
  *   **Foundationalist:** The charter is an act of exclusion. Those not invited to the founding are subjects, not citizens. The city rests on an original act of domination.
  *   **Pragmatist:** The charter is a hypothesis. It becomes democratic only as non-founders arrive and successfully claim rights, forcing the boundary to shift.
  *   **Divergence:** Side A sees a deficit that can never be fully repaid; Side B sees a normal political trajectory.

  **3. The Atmosphere (Global Commons):**
  *   **Foundationalist:** There is no global *demos*, therefore no democratic governance of the atmosphere is possible. We must wait for a global constitution.
  *   **Pragmatist:** The conflict over carbon emissions *constitutes* a nascent global *demos*. Democratic practices can exist without a global state.
  *   **Divergence:** Side A demands institutional completion before democracy begins; Side B allows democracy to precede institutional fixation.

  In all three cases, the camps diverge substantively on **political possibility**. Side A's ontology leads to skepticism about boundary changes; Side B's ontology leads to expansionism about where democracy can occur. However, they still talk past each other: Side A accuses Side B of ignoring the coercion involved in the founding; Side B accuses Side A of fetishizing a moment that never existed.

  ### What Counts as Progress?

  Given that this is an ontological-conceptual clash rather than an empirical or formal one, empirical data or formal modeling will not resolve it. Progress requires a **dissolution of the demand for foundations**.

  We must distinguish between **constitutive power** (*pouvoir constituant*) and **constituted power** (*pouvoir constitué*).
  *   **Progress** would be the widespread acceptance that constitutive power is necessarily extra-legal and undemocratic in the Foundationalist sense.
  *   **Progress** would be shifting the normative burden from "How was the boundary authorized?" to "How is the boundary maintained?"

  The debate stalls because Foundationalists demand that *constitutive power* behave like *constituted power*. If we accept that the boundary of the *demos* is a political fact that precedes democratic procedure (not a moral error, but a structural necessity), we can stop trying to solve the paradox and start managing the tension. The question changes from "How do we solve the boundary problem?" to "How do we ensure boundaries remain porous to moral claim-making?"

  **Contestability Flag:** My diagnosis assumes that the Foundationalist concern is primarily logical/ontological. It is possible, however, that their concern is deeply moral: they fear that without a strict authorization requirement, *any* coercion can be laundered as "constitutive practice." If their resistance is driven by a fear of legitimizing oppression rather than a commitment to substance ontology, my diagnosis of a "category mistake" may be too charitable to Side B.

  \answer{Ontological-Conceptual Mismatch: Distinguishing authorization from accountability}
