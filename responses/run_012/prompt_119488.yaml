answer: |-
  **Audience Map & Commitments**

  *   **Representationalists (2):** Committed to transparency; experience is a window to the world, not itself an object. *Lean forward if:* You show how your "judgment" view avoids reifying experience while explaining why it *seems* intrinsic.
  *   **Hard-Problem Loyalist (1):** Committed to the ontological weight of "what it's like." *Lean forward if:* You admit the feeling is real but locate the "hardness" in our cognitive stance, not the fabric of reality. (Hard sell).
  *   **Vision Scientist (1):** Committed to operational definitions. *Lean forward if:* You confirm her data on adaptation/rivalry remains valid regardless of metaphysics.
  *   **Graduate Student (1):** Committed to radical consistency. *Lean forward if:* You acknowledge the pressure toward illusionism and give a non-arbitrary reason to stop short.
  *   **Phenomenologist (1):** Committed to the primacy of lived experience over intellectualization. *Lean forward if:* You distinguish pre-reflective experience from the reflective act that generates the "qualia" myth.

  ***

  **Q&A Prep Sheet: Ordered by Damage**

  **1. The "Change of Subject" Charge (Hard-Problem Loyalist)**
  *   **Objection:** "You haven't solved the hard problem; you've dissolved it by talking about judgments instead of feelings. You're explaining why we *say* there are qualia, not why experience *feels* like something. You've changed the subject."
  *   **Damage:** **Fatal.** If true, the thesis is false because it claims to address experience, not just speech acts.
  *   **Reply (90s):** "I am not denying the feeling. I'm denying the *structure* we attribute to it when we reflect. The feeling is real; the 'intrinsic, private datum' story is the judgment we layer on top when asked to report. The hard problem arises from mistaking that report-structure for the feeling-structure. I'm keeping the experience, dropping the metaphysical baggage we hang on it."
  *   **Soft Spot:** Hard to articulate the difference between "feeling" and "judgment about feeling" without smuggling qualia back in.
  *   **Confidence:** 90% this will be asked.
  *   **Status:** **Shows thesis false if unanswered.**

  **2. The "Higher-Order Representationalism (HOR) in Disguise" Charge (Representationalists)**
  *   **Objection:** "You say qualia are judgments produced by attention. That's just HOR. You're attacking a strawman 'intrinsic qualia' that no serious representationalist holds. Your view is either redundant or relies on a caricature."
  *   **Damage:** **High.** Reduces contribution to a rehash of existing literature.
  *   **Reply (90s):** "HOR says the experience *is* the representation. I say the experience is one thing, and the *qualia claim* is a mistaken identification produced when we attend to it. I'm not analyzing experience; I'm analyzing the introspective stance that misdescribes experience. That's why the coffee-taster case works: the representation stays, the judgment shifts."
  *   **Soft Spot:** The line between "experience being representational" and "judgment about representation" is thin.
  *   **Confidence:** 85%.

  **3. The "Slide to Illusionism" Charge (Graduate Student)**
  *   **Objection:** "If the 'qualia' package is incoherent and produced by a mistaken judgment, why isn't experience itself an illusion? You're splitting hairs to avoid the radical conclusion. Just be an illusionist."
  *   **Damage:** **Medium.** Threatens internal consistency, but doesn't falsify the core claim.
  *   **Reply (90s):** "Illusionism says there is no experience. I say there is experience, but our *theory* of it (qualia realism) is wrong. The coffee still tastes like coffee; the error is thinking that taste is an intrinsic object hidden from science. I'm saving the phenomenon, not eliminating it."
  *   **Soft Spot:** Risks making "experience" an empty term if stripped of all qualia properties.
  *   **Confidence:** 95% (Highest likelihood, lower damage).

  **4. The "Intellectualizing Attention" Charge (Phenomenologist)**
  *   **Objection:** "You treat introspection as a constitutive act that creates the object. But phenomenology shows the pre-reflective lived body is prior. You're rediscovering intentionality and calling it a mistake."
  *   **Damage:** **Medium.** Could reframe your view as a subset of theirs, reducing novelty.
  *   **Reply (90s):** "I agree pre-reflective experience is primary. My target is specifically the *reflective* stance—the moment someone asks 'what is it like?' and we produce the qualia story. I'm not denying intentionality; I'm denying that reflection reveals intrinsic properties."
  *   **Soft Spot:** They may argue reflection reveals structures already present, not created.
  *   **Confidence:** 70%.

  **5. The "Pragmatic Cost" Charge (Vision Scientist)**
  *   **Objection:** "If qualia are just residues of a stance, do I stop using the word in my papers? Does this change how I run psychophysics experiments?"
  *   **Damage:** **Low.** Terminological fix.
  *   **Reply (90s):** "Keep using it. Treat it as shorthand for 'subjective reportable state.' My view only changes the metaphysical interpretation of what those reports signify, not the data itself."
  *   **Soft Spot:** None.
  *   **Confidence:** 80%.

  ***

  **Strategic Advice**

  *   **Concede Up Front:** Terminology flexibility (to the Scientist) and the reality of the *feeling* (to the HP Loyalist). Do not fight on whether experience exists.
  *   **Hold Firm:** The distinction between the *experience* and the *introspective judgment* about the experience. This is the engine of the paper.
  *   **Pivotal Exchange:** The **Hard-Problem Loyalist**. If you cannot convince them you are still talking about *experience* and not just *language*, the paper loses its object. Win this, and the Grad Student's objection loses its teeth.
  *   **Question Hoping Nobody Asks:** "Does the judgment itself have a phenomenal character? If yes, you have an infinite regress. If no, how can a non-phenomenal judgment explain the phenomenology?"
  *   **Confidence in Predictions:** High on the Reps and Grad student; moderate on the Phenomenologist (depends on their specific school).
  *   **Least Sure Part:** The **Phenomenologist's** reaction. They might be your strongest ally or your deadliest enemy depending on whether they view your "judgment" account as compatible with pre-reflective intentionality or as a category error. I cannot predict their specific vocabulary without knowing their training (Husserl vs. Merleau-Ponty vs. Varela).
