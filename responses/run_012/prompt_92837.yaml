prompt: |-
  Ok so I'm a second-year PhD student, metaethics but I keep drifting into moral epistemology, and my superviser and I have been going round and round about something I can't get to sit still. I want a credence, not a tour of the literature, so dont just map the positions.

  The claim I want a number on:

  (G) There is a finite, humanly stateable set of true, non-vacuous moral principles -- each saying that some feature is a reason for or against some kind of action in some specifiable kind of circumstance -- such that every true claim about what there is reason to do follows from that set, and no case is covered only by a principle that got added afterwards to fit that case.

  What makes me doubt (G) is what happens when you push on any proposed principle. Take: the fact that a policy was approved by a majority is a reason in its favour. Someone produces a case where a majority votes to strip a minority of its rights, and you say, fine, the principle is that majority approval is a reason in favour except when... and the hedge gets longer, and there's no obvious point where the process is forced to stop. Either it runs on unspecifiably (or circles), or it bottoms out in a list of the cases we already had opinions about, in which case the principle is redescribing my verdicts rather than generating them. Generalism then survives, but vacuously -- true because it can't be falsified. My superviser thinks the hedging can definately always be given a principled stopping point, and that this is just how any finite statement of a ceteris paribus generalisation has to work.

  So: your credence that (G), as stated, is true. Decompose it -- I'd expect at least (i) holism of reasons is true (same feature, pro tanto reason for in one context, against or neutral in another); (ii) if it is, whether the hedges can be shown to terminate in something finite and non-vacuous rather than going unspecifiable or circular; (iii) whether 'non-vacuous' can be pinned down tightly enough that (G) even has a determinate truth value, or whether this is a verbal dispute in a metaphysical hat; (iv) whether the learning argument cuts any ice -- moral competence has to be acquired via generalisable rules, therefore the structure of moral knowledge is principled (I think that shows something about acquisition and nothing about justification; a ladder you kick away); (v) whatever I've left out. A number for each, one line of justification each, then how they combine.

  For what it's worth I'm at about 0.35, she's at about 0.8. Tell me which term you think we actually disagree about, if any, and which of us is more likely to be right about where the disagreement lives. And be straight with me about what would move your own number: which argument would flip it, and where your decomposition is most likely to be wrong.
