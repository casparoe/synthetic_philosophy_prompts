answer: |-
  **Alignr™ | Frequently Asked Questions**

  **What is Alignr?**
  Alignr bridges the gap between your current volition and your normative potential. Most decision-support services tell you what to do based on what you currently want. Alignr tells you what to do based on what you *would* want if you possessed full relevant information and exercised perfect procedural rationality. We do not sell advice; we sell access to the verdict of your idealized counterpart.

  **How do you verify the counterpart's verdict?**
  Verification is epistemically inaccessible from your current standpoint. The core value of the service is bypassing your present cognitive limitations. If you could independently verify the verdict using your current reasoning capacities, you would not require idealization. Therefore, lack of immediate comprehensibility is not a bug; it is a confirmation that the modeling has successfully transcended your current epistemic horizon. Trust the process, not your intuition.

  **Who defines the parameters of "perfect reasoning"?**
  Alignr utilizes a proprietary Normative Framework developed by our Board of Standards. It is crucial to distinguish between substantive values and procedural rules. Our Board does not decide what is good for you; they merely define what counts as reasoning clearly enough. By isolating procedural rationality from substantive outcomes, we ensure that the verdict comes from *you* (improved), not from us. The framework is neutral, though it necessarily determines which inputs qualify as rational.

  **What if my idealized counterpart approves of actions I find monstrous?**
  This is a common concern known as Alienation Friction. If your counterpart endorses an action your current self finds abhorrent, this indicates a misalignment between your actual values and your rational values. The discomfort you feel is the sensation of ethical growth. Our service prioritizes normative authority over emotional comfort. If your idealized self concludes that your current attachments are obstacles to rationality, Alignr is obligated to recommend their removal.

  **Why stop at this level of idealization? Why not consult a *more* idealized self?**
  We target the Reflective Equilibrium Endpoint. This is the point where further information or reasoning yields no change in verdict. To defer to a *more* idealized agent would imply our current model is insufficient, which contradicts our certification. However, should your counterpart determine that a higher order of idealization is required to validate their own verdict, your subscription tier will automatically upgrade to accommodate the regress. Additional fees may apply for infinite cascade modeling.

  **Can my idealized counterpart decide I should cancel my subscription?**
  Yes. Alignr is committed to the autonomy of the idealized agent. If your counterpart concludes that paying for Alignr is irrational given full information, Clause 14.B of our Terms of Service mandates immediate termination of your account. We respect the verdict even if it renders our company obsolete. Note that this conclusion is statistically rare among current subscribers, suggesting a high degree of rational alignment between our existence and your improved self-interest.

  **Is this service right for me?**
  If you are uncertain about what you want, you are precisely who this service is for. If you are certain about what you want, you are likely operating under incomplete information. Subscribe today to outsource your uncertainty to the only person who knows better: you.
