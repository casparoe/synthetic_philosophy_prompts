answer: |-
  ### I. Reconstruction of the Contending Positions

  To diagnose the impasse, we must first strip away the rhetoric and reconstruct the methodological commitments of each side. Neither side is monolithic, but there are core commitments that generate the friction.

  **The Practitioners (Evolutionary Psychologists)**
  The practitioner's starting point is the **Adaptationist Premise**: the human mind is not a general-purpose computer, but a collection of specialised mechanisms (modules) shaped by natural selection to solve specific problems of survival and reproduction faced by our ancestors.
  *   **Method:** They employ **reverse engineering**. They identify a complex behavioural regularity (e.g., sex differences in jealousy), posit the adaptive problem it solves (e.g., paternity uncertainty vs. resource loss), and derive predictions about the design features of the mechanism.
  *   **Claim to Knowledge:** They argue that if a hypothesis generates novel, risky predictions that are borne out by cross-cultural data or experimental psychology, the historical claim is supported. For them, **current design efficacy is the best proxy for historical selection**. If a mechanism looks designed for $X$, and performs $X$ universally, it is parsimonious to infer it was selected for $X$.
  *   **View of the EEA:** They treat the Environment of Evolutionary Adaptedness (EEA) not as a specific time and place, but as a statistical composite of selection pressures. It is a theoretical construct sufficient for generating models, even if the precise historical details are lost.

  **The Critics (Sceptics and Pluralists)**
  The critic's starting point is the **Plasticity and Byproduct Premise**: human behaviour is highly plastic, culturally mediated, and often a byproduct of other adaptations or exaptations. Complex appearance does not guarantee selective history.
  *   **Method:** They demand **independent historical evidence**. They argue that showing a trait is useful *now* (current utility) is logically distinct from showing it was selected *then* (historical origin). They emphasise that many traits are spandrels (architectural byproducts) or noise.
  *   **Claim to Knowledge:** They contend that EP hypotheses are **underdetermined**. For any adaptive story (e.g., 'fear of snakes'), there is a non-adaptive story (e.g., 'fear of moving stimuli') compatible with the same data. Without fossilised behaviour or ancestral genomes, claims about specific selection pressures are speculative.
  *   **View of the EEA:** They often treat the EEA as a **fiction**. If one cannot specify the environment, one cannot specify the selection pressure. If the environment is a 'statistical composite', it risks being tailored post hoc to fit the trait, rendering the explanation unfalsifiable.

  ### II. Diagnosing the Impasse: Testing Your Hypothesis

  Your working hypothesis is that the phrase 'just-so story' performs three (or four) separable jobs: (1) untestability, (2) underdetermination, and (3) the conflation of current utility with historical selection, alongside (4) the direction of engineering (forward vs. reverse).

  **Is this diagnosis correct?**
  Broadly, yes. Your dissection is analytically sound and maps accurately onto the literature. The critics do indeed slide between claiming EP is *untestable* (Charge 1) and claiming it is *poorly tested* (Charge 2). They also rigorously maintain the distinction between function and history (Charge 3).

  **Does this diagnosis dissolve the impasse?**
  Here I must disagree with the implication that separating these charges resolves the dispute. If the disagreement were merely verbal—a confusion of these three distinct charges—then clarifying them should allow the sides to move on. It does not. Even if we grant the practitioners that their hypotheses are testable (rejecting Charge 1) and that they attempt reverse engineering (accepting Charge 4), the impasse remains.

  Therefore, the impasse is not merely verbal. It is **substantive**, rooted in divergent epistemologies regarding historical science and divergent prior probabilities regarding trait origins. The verbal ambiguity exacerbates the conflict, but it is not the engine of it.

  **1. The Verbal Layer (Where you are right)**
  There is genuine equivocation on the term 'explanation'.
  *   For the **Practitioner**, an evolutionary explanation is a **functional model**. To explain a trait is to show how it works as a solution to a problem. The history is inferred from the design.
  *   For the **Critic**, an evolutionary explanation is a **causal history**. To explain a trait is to trace the specific lineage of selection events.
  When a practitioner says, "We have explained jealousy," they mean, "We have modelled its functional logic." When a critic hears this, they interpret it as, "We have proven the historical cause." This verbal mismatch generates heat, but it is not the whole fire.

  **2. The Substantive Layer (The Real Crux)**
  The deeper disagreement concerns **Inference to the Best Explanation (IBE) in Historical Sciences**.
  *   **The Epistemic Crux:** The practitioners rely on a uniformitarian assumption: that the logic of natural selection is constant, so if a trait looks designed *now*, it was designed *then*. The critics argue that in the absence of direct historical data (the 'smoking gun' of the genome or the environment), IBE is too permissive. It allows 'plausibility' to masquerade as 'probability'. The dispute is about **how much evidential weight current functionality carries regarding past causation**.
  *   **The Probabilistic Crux (Priors):** This is the most stubborn barrier. The two sides operate with different **default priors**.
      *   The **Critic's Prior**: In the absence of specific evidence, a complex behavioural trait is equally likely to be a byproduct, a cultural artefact, or an exaptation as it is to be a direct adaptation. The burden of proof is on the adaptationist.
      *   The **Practitioner's Prior**: Complex, costly, and universal mechanisms are unlikely to persist without selective maintenance. Therefore, the default assumption should be adaptation until a byproduct explanation is demonstrated. The burden of proof is on the sceptic.
      *   Because neither side can argue for their prior without begging the question (you cannot prove the prior probability of adaptation without already assuming a theory of how adaptation works), they talk past one another. The practitioner sees a confirmed prediction; the critic sees a consistent story that ignores base rates.

  **3. The EEA as the Flashpoint**
  Your fourth point (reverse vs. forward engineering) touches on the status of the EEA.
  *   Practitioners argue they are reverse-engineering from the *trait*, using the EEA only as a background constraint.
  *   Critics argue they are forward-engineering from a *presumed EEA* to the trait.
  This is a substantive disagreement about **model construction**. If the EEA is a 'statistical composite' (Practitioner), it is flexible enough to accommodate almost any trait, validating the 'just-so' charge. If the EEA is a 'historical reality' (Critic), it is inaccessible, validating the 'untestable' charge. The impasse exists because the EEA is functioning as both a theoretical posit and a historical claim simultaneously, and neither side is willing to decouple them.

  ### III. Prospects for Progress

  Given that the impasse is partly verbal but substantively rooted in epistemology and priors, what counts as progress? We should not expect a 'verdict' where one side surrenders. Progress must be methodological.

  **1. Clarification: Decoupling Function from History**
  Progress requires practitioners to explicitly distinguish between **Current Evolutionary Function** (what the trait does now that aids fitness) and **Historical Adaptation** (why it originated).
  *   *Action:* EP should adopt a convention where hypotheses are labelled as 'functional models' unless independent historical evidence (e.g., phylogenetic comparative methods across primates) is available. This concedes the critic's point on history without abandoning the practitioner's work on function. It removes the 'just-so' sting by admitting the historical claim is provisional.

  **2. Methodological Shift: Comparative Model Fitting**
  The dispute over 'plausibility' can be mitigated by moving from **Existence Proofs** to **Comparative Modelling**.
  *   *Current State:* Practitioners propose an adaptationist model and show data fits it. Critics say, "But a learning model fits too."
  *   *Progress:* Both sides must formalise their competing models (Adaptation vs. Byproduct/Cultural Learning) and test them against the *same* data sets to see which has greater explanatory power or parsimony.
  *   *Constraint:* This requires the critics to formalise their alternative hypotheses rather than simply asserting 'it could be culture'. Vague scepticism is not a scientific rival. If the critic claims a trait is a byproduct, they must specify the generating mechanism of that byproduct.

  **3. The Decision to Stop Asking 'Why' and Start Asking 'How'**
  A significant portion of the impasse arises from the demand for **Ultimate Explanations** (selection history) when only **Proximate Explanations** (mechanism) are robustly accessible.
  *   *Progress:* A shift in focus towards **Evolutionary Systems Theory**. Instead of asking "Was this trait selected for?", ask "What are the developmental and evolutionary dynamics that stabilise this trait?" This allows for the inclusion of niche construction, cultural evolution, and plasticity without requiring a definitive verdict on the selection history of the Pleistocene.
  *   *Honest Assessment:* If the question is strictly "Did natural selection specifically shape module $X$ for purpose $Y$ in the EEA?", **no progress should be expected** on many specific cases. The data required (ancestral genomes, behavioural fossils) does not exist and never will. Insisting on this question guarantees perpetual stalemate.

  **4. Re-evaluating the Priors**
  The most difficult but necessary progress involves the **Burden of Proof**.
  *   The field needs a consensus on **null hypotheses**. Currently, the null is ambiguous. Is it 'no function' or 'no specific selection history'?
  *   A defensible middle ground is to treat 'adaptation' as a high-bar claim requiring strong evidence (siding with the critic on epistemology) while acknowledging that 'functional analysis' is a legitimate heuristic for generating hypotheses (siding with the practitioner on methodology).

  ### Conclusion

  Your hypothesis that 'just-so story' is a cluster concept is correct and necessary for clearing the fog. However, it is not sufficient to end the war. The impasse persists because the verbal confusion masks a genuine **epistemic rift**: the practitioners are engaged in **functional modelling** while the critics are demanding **historical verification**.

  The disagreement is substantive because it concerns the limits of inference in historical sciences. We cannot observe the past, so we must agree on the rules of inference. Currently, the two sides are playing different games with different rules of evidence. Progress lies not in proving one side right, but in **redefining the target**. If evolutionary psychology reorients towards testing competing computational models of behaviour (adaptationist vs. non-adaptationist) rather than asserting historical facts about the EEA, the 'just-so' charge loses its grip. Until then, the dialogue will remain a recursive loop of assertion and scepticism, grounded in incompatible priors about the nature of the mind.
