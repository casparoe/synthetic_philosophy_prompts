answer: |-
  There is no single, canonical term in the privacy literature that perfectly captures this specific phenomenon, which is likely why it feels elusive in your seminar. You have correctly identified a gap between the standard models of privacy violation (breach, aggregation, surveillance) and the lived experience of networked information flow.

  However, your description maps precisely onto the intersection of three established theoretical frameworks. To give you the vocabulary you need for your seminar, I will outline the closest existing concepts, explain where they fall short, and then offer a precise definition and name that distinguishes this phenomenon from the "mosaic" effect and ordinary gossip.

  ### 1. The Closest Existing Concepts

  **A. Contextual Integrity (Helen Nissenbaum)**
  This is the heavyweight champion for your scenario. Nissenbaum argues privacy is not secrecy or control, but the **appropriate flow of information** according to context-specific norms.
  *   **The Fit:** Your scenario describes information flowing from the *medical* context to the *domestic* context to the *professional* context. Nissenbaum calls the rules governing these flows **Transmission Principles**. When you tell a friend, the principle is usually *confidence*. When they tell someone else, they are altering the transmission principle.
  *   **The Mismatch:** You note that "not one of them feels like a violation." In Nissenbaum's framework, if the norms of the friend's context allow sharing with people who have a "fair claim," then Contextual Integrity is technically maintained. Your scenario highlights a *failure* of Contextual Integrity: the norms haven't caught up to the network effects. The norms say "this is okay," but the outcome feels like a violation.

  **B. Privacy as Obscurity (Woodrow Hartzog)**
  Hartzog argues that privacy is not about hiding data (secrecy) but about making it **hard to find or access** (obscurity).
  *   **The Fit:** This explains why "nothing was strictly hidden" yet privacy was lost. The information was obscure (known only to specific nodes). As it spread through legitimate channels, the *friction* required to access it dropped. It didn't become "public" in a legal sense, but it lost its obscurity.
  *   **The Mismatch:** Obscurity usually focuses on the *searchability* of data. Your example is about the *social topology* of who knows.

  **C. Contextual Collapse (danah boyd & Alice Marwick)**
  Originally from social media studies, this describes when distinct audiences (family, friends, coworkers) merge into a single audience.
  *   **The Fit:** This captures the "shape of who knows it." Initially, the doctor, partner, and boss existed in separate spheres. Eventually, those spheres overlap or merge because they all hold the same information.
  *   **The Mismatch:** This term is usually reserved for digital platforms forcing audiences together. Your example is organic and offline.

  ### 2. The Name and Definition

  Since no single term suffices, the most precise way to name this in a graduate seminar is **"Emergent Common Knowledge"** (via Transitive Disclosure).

  Here is the definition you can use to distinguish it from the mosaic effect and ordinary spread:

  > **Emergent Common Knowledge:** A privacy state in which information, through a chain of voluntary and contextually appropriate disclosures, transitions from **Distributed Knowledge** (where $A$ knows $p$ and $B$ knows $p$, but $A$ does not know that $B$ knows $p$) to **Common Knowledge** (where $A$ knows $p$, $B$ knows $p$, and $A$ knows that $B$ knows $p$).
  >
  > Unlike the **Mosaic Effect**, there is no central aggregator combining disparate data points to reveal a new truth. The data point remains the same; only the **epistemic status** of the group changes.
  > Unlike **Gossip**, the transmission follows legitimate norms of trust and interest.
  > Unlike **Loss of Control**, the subject consented to every individual link in the chain.

  ### 3. Answering Your Boundary Questions

  You asked specifically about the edges of this phenomenon. Here is the philosophical breakdown:

  **Is it the number of knowers or the relationships among them?**
  It is the **relationships (connectivity)**, not the number.
  If 1,000 people know your diagnosis but they are strangers on a subway who will never meet, you retain a form of privacy (what Hartzog calls "obscurity"). You feel exposed only when the knowers form a **network capable of comparing notes**. The harm arises when the information becomes a *shared social fact* among a group that interacts. The "shape" that is lost is the **segregation of social spheres**.

  **Is it a matter of degree or a categorical change?**
  It is a **phase shift** (a degree that crosses a threshold into a category).
  In epistemic logic, there is a distinct difference between *Everyone Knows* and *Everyone Knows That Everyone Knows*.
  *   **Stage 1 (Distributed):** Your doctor knows. Your friend knows. They don't talk. You can manage the narrative differently with each.
  *   **Stage 2 (Common):** Your doctor and friend are at a dinner party. They both know. They know *you know* they both know. You can no longer manage the narrative.
  The threshold is crossed when the probability of **inter-knower communication** becomes high enough that you must assume they have compared notes. This is the moment "privacy" turns into "publicness," even without a newspaper printing it.

  **What exactly is destroyed?**
  It is **Contextual Segregation**.
  Privacy often functions by allowing us to present different versions of ourselves to different groups (the "fragmented self"). The doctor sees the patient; the friend sees the confidant; the boss sees the employee. When the information becomes Common Knowledge, those contexts collapse. You are forced to be the "person with the chronic condition" in all contexts simultaneously. The loss is the **capacity for contextual performance**.

  ### 4. How to Distinguish It in Discussion

  To ensure your seminar colleagues distinguish this from the concepts you mentioned:

  *   **Vs. The Mosaic:** The Mosaic Theory is about **Data + Data = New Insight** (e.g., buying records + location data = political affiliation). Your phenomenon is **Data + Network = Social Exposure**. The insight doesn't change; the *audience* does.
  *   **Vs. Loss of Control:** In standard "control" theories, privacy is lost when I lose the ability to say "no." In your scenario, you said "yes" every time. The loss is **structural**, not volitional. It is a **network externality**.
  *   **Vs. Trust:** Trust implies a binary (broken/kept). Here, trust was kept at every link (the friend told someone who had a "fair claim"). The betrayal is **systemic**, not interpersonal.

  ### Summary for Your Seminar
  If you need a label to anchor your argument, I recommend using **"Transitive Exposure"** or **"Emergent Common Knowledge."**

  You can argue that this phenomenon demonstrates that **privacy is not a property of information, but a property of a network.** When the network density crosses a certain threshold, privacy evaporates not because the secret was stolen, but because the *social cost of maintaining the secret* became unsustainable. The woman isn't exposed because the world knows; she is exposed because her world knows *that it knows*.

  This distinction allows you to critique current privacy laws (which focus on collection and consent) for failing to address **downstream network effects** where consent is given locally but privacy is lost globally.
