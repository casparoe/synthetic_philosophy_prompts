answer: |-
  ### 1. Critique of Your Framing

  Your hinge is correct. The distinction between the *subject* of a duty (to whom it is owed) and the *object* of a duty (what the action concerns) is the load-bearing beam. Without it, Kant sounds like a monster; with it, he sounds like a structuralist. If you lose this distinction, you lose the room.

  However, one of your five anticipated misconceptions is yours, not theirs.
  *   **The Confusion:** The idea that Kant's talk of animals as "analogues" implies he quietly credited them with a "sliver of reason" (the Leibnizian worry).
  *   **The Correction:** Drop this. It is a distraction. Kant is rigorous here: animals have no reason, no autonomy, and no personhood. They are *analogues* only in the sense that their behavior mirrors human expression enough to trigger our moral sentiments. If you suggest Kant might grant them a sliver of reason to save the theory, the grad students will smell blood and the vets will smell inconsistency. Stick to the hard line: no reason, therefore no direct duty. The work is done by the *agent's* reason, not the animal's.

  **Timing Check:** Seventy-five minutes is sufficient *only if* you refuse to derive the Categorical Imperative. You must assume the *Groundwork* architecture is known and focus entirely on its application to non-rational beings.

  ### 2. Candidate Arcs

  Here are three ways to structure the session. I have discarded two.

  **Arc 1: The Historical Repair Job**
  *   **Structure:** Contextualize Kant against Cartesian beast-machines -> Explain the indirect duty view -> Defend against Bentham -> Apply to cases.
  *   **Verdict:** **Discard.** This treats Kant as a museum piece to be rehabilitated. It invites the "outdated" misconception immediately. It spends too much energy on history and not enough on the moral mechanics your vets need.

  **Arc 2: The Case-First Comparison**
  *   **Structure:** Present the convenience euthanasia case -> Ask for Benthamian verdict -> Ask for Kantian verdict -> Explain the theory to justify the difference.
  *   **Verdict:** **Discard.** This risks cementing the Benthamian view as the "default" and Kant as the "complicated exception." You want Kant to stand on his own footing, not as a deviation from sentience ethics.

  **Arc 3: The Structural Hinge (Selected)**
  *   **Structure:** Establish the Owed-To/About distinction immediately -> Use Kant's dog case to illustrate the mechanism -> Intercept misconceptions as they arise -> Test on convenience euthanasia.
  *   **Verdict:** **Commit.** This treats Kant's ethics as a working system, not a historical artifact. It forces the audience to shift their moral locus from the sufferer to the agent, which is the specific cognitive move required to understand Kant on animals.

  ### 3. The Teaching Plan (75 Minutes)

  **Phase 1: The Hinge (0–15 minutes)**
  *   **Open:** Acknowledge Bentham. State clearly: "Today we are not asking 'Do they suffer?' We are asking 'Who is wronged?'"
  *   **The Move:** Draw two columns on the whiteboard. Left: *Subject of Duty* (Who is owed?). Right: *Object of Duty* (What does the action concern?).
  *   **Definition:** Define "Direct Duty" (Subject = Object) vs. "Indirect Duty" (Subject = Humanity; Object = Animal).
  *   **Intercept Misconception 1 (Instrumentalism):** Immediately address the "gym equipment" worry. State: "Indirect does not mean optional. It means the strictness of the duty comes from the subject, not the object." Cruelty is not wrong because it wastes training equipment; it is wrong because it violates a duty to self (humanity).
  *   **Intercept Misconception 2 (Museum Piece):** Frame this not as "Kant vs. Modern Science" but as "Agent-Centered vs. Patient-Centered." This is a live debate in ethics, not a historical relic.

  **Phase 2: The Carrying Case (15–35 minutes)**
  *   **The Case:** Use Kant's example of the man who shoots his faithful dog because it is no longer useful. (You are correct: this is in the *Metaphysics of Morals*, Doctrine of Virtue. It carries the weight.)
  *   **Analysis:** Ask the group: "Why is this wrong?"
      *   Benthamian answer: Dog loses life/suffers.
      *   Kantian answer: The agent destroys a analogue of gratitude/loyalty within themselves.
  *   **Intercept Misconception 3 (Sliver of Reason):** Clarify the "analogue." The dog is not rational. But the dog's loyalty *looks like* moral fidelity. Destroying it damages the agent's capacity to recognize fidelity.
  *   **Intercept Misconception 4 (Licensed Anything/Forbade Meat):** Ask: "Does this mean I can eat meat?"
      *   Answer: Kant permits use (including killing for food) *provided* it does not coarsen the agent. Painful slaughter is forbidden not because of the pain *to the animal*, but because of the hardening *in the human*. This clarifies that "indirect" still yields strict prohibitions.

  **Phase 3: The Vet Resident Test (35–55 minutes)**
  *   **The Case:** Convenience euthanasia. A healthy animal, owner moving abroad, no shelter space, painless death.
  *   **Application:** Have them apply the Hinge.
      *   *Subject:* The vet/owner (Humanity).
      *   *Object:* The animal.
      *   *Violation:* Treating a living analogue as a disposable object undermines the disposition required to treat humans as ends.
  *   **Intercept Misconception 5 (Marginal Cases):** A grad student will ask: "What about humans who lack rationality?"
      *   *Response:* Acknowledge this is the strongest objection. Do not solve it. State: "Kant argues we owe duties to such humans *because* they are human (by species or potential), whereas animals are not. You may find this speciesist. It is. But it is consistent within his system. Don't let the objection destroy the understanding of the system."

  **Phase 4: The Check (55–75 minutes)**
  *   **Discussion:** Open floor for the vets to express where this feels embarrasing or silent. (e.g., "What if I don't feel hardened?")
  *   **The Question:** (See below).

  ### 4. Misconception Interception Map

  | Misconception | When to Intercept | How to Intercept |
  | :--- | :--- | :--- |
  | **1. Instrumentalism ("Gym Equipment")** | **Phase 1 (Min 10)** | Explicitly distinguish "optional use" from "strict duty regarding." Use the word "violation" regarding the agent. |
  | **2. Museum Piece** | **Phase 1 (Min 5)** | Frame as "Agent-Centered Ethics" vs. "Patient-Centered Ethics." Both are live options. |
  | **3. Sliver of Reason** | **Phase 2 (Min 25)** | **Your Confusion.** Clarify: Animals are *analogues* only. No reason possessed. The moral weight is on the human interpretation of the analogue. |
  | **4. Licenses Anything / Forbids Meat** | **Phase 2 (Min 30)** | Use the slaughter example. Permissible use vs. forbidden cruelty. The line is the agent's moral disposition, not the animal's right. |
  | **5. Marginal Cases** | **Phase 3 (Min 50)** | Acknowledge as a boundary limit. Do not let it derail the session. It is an objection to the system, not a misunderstanding of it. |

  ### 5. What to Refuse

  **Refuse to open the metaphysics of autonomy.**
  *   **Why:** You have 75 minutes. If you start explaining transcendental freedom, the distinction between noumenal and phenomenal selves, or the full derivation of the Categorical Imperative, you will lose the vets and bore the grad students.
  *   **The Line:** When asked *why* humanity is the subject of duty, answer: "Because only humanity has the capacity for moral legislation." Do not go deeper into *how* that capacity is metaphysically possible. Treat autonomy as a given premise of Kantian ethics, not a topic for investigation today.

  **Refuse to solve the Marginal Cases objection.**
  *   **Why:** It is the strongest objection to Kant, but engaging it fully requires a theory of personhood you cannot build in 40 minutes.
  *   **The Line:** "That is a valid objection to Kant's conclusion, but it does not change his reasoning. We are here to understand the reasoning, not to save Kant from his critics."

  ### 6. The Check Question

  Do not ask them to recite the doctrine. Ask them to locate the victim.

  **The Question:**
  > "Imagine a vet performs convenience euthanasia on a healthy stray. The procedure is painless. The vet feels no emotional hardening. No one else ever knows. On Bentham's view, this is wrong. On Kant's view, is this permissible? If yes, why? If no, **who is the victim?**"

  **What you are listening for:**
  *   **Failure:** They say "The animal is the victim" (They missed the hinge).
  *   **Failure:** They say "It is permissible because no one was hurt" (They missed the strictness of indirect duty).
  *   **Success:** They say "It is forbidden. The victim is humanity in the person of the vet," or "The victim is the moral disposition of the agent," even if they disagree with the conclusion.

  If they can identify that the *wrong* exists even without suffering and without witnesses, they have understood the Kantian shift from consequence to principle, and from patient to agent.
