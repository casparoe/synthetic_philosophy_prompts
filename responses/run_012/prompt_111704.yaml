          1.  **Criteria vs. Symptoms:** Neural patterns are *symptoms* of sensations, not *criteria* for the meaning of sensation words. (Though this distinction is tricky in PI, it's useful here). Actually, better: The neural pattern is a *hypothesis*, the behavior/report is the *criterion*.
          2.  **The Beetle:** The neural state is the beetle. It doesn't matter for the meaning of the word.
          3.  **Grammar of Sensation:** Overriding the first-person authority changes the grammar. We aren't sharing a word for the *feeling*; we are sharing a word for the *brain state*.
          4.  **Agreement in Judgments:** Meaning rests on the agreement in the *response* (saying "yes"), not the physical substrate.

