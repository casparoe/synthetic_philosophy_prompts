      *   *Objection 2 (Verificationist):* If no observation can distinguish rotating from non-rotating (because the observer is in the bucket or there is no light to see), there is no fact of the matter.
      *   *Objection 3 (Machian Denial):* The intuition that the water *would* curve is just a bias from living in a matter-filled universe. In an empty universe, inertia might vanish.

  4.  **Drafting - Section by Section:**

