      *   *Thought Experiment:* Remove all other matter.
      *   *Claim:* The water *still* experiences inertial forces. The surface *still* becomes concave.
      *   *Conclusion:* Therefore, rotation is absolute (or at least non-relational to matter). Relationism (specifically Mach's Principle) is false.
