          *   Analyze the gap between descriptive variation and normative objectivity (Is/Ought problem).
          *   Evaluate the specific East/West contrast (WEIRD vs. non-WEIRD).
          *   Determine if cross-cultural evidence *can* bear on objectivity at all.
          *   Propose a defensible version of the book's point.

  2.  **Deconstruct the Paraphrased Text:**
      *   *Claim 1:* 20th-century psychology studied only WEIRD people and generalized to human nature. -> *Mostly True.*
      *   *Claim 2:* Moral intuitions vary cross-culturally; WEIRD is the outlier. -> *Mostly True (with nuance).*
