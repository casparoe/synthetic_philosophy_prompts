      *   *Claim 5:* Older belief in single true morality abandoned because cultures disagree and can't appeal outside intuitions. -> *False/Non-sequitur (Philosophical error).*
      *   *Claim 6:* Morality is whatever a culture says it is (Moral Relativism). -> *False (as an empirical conclusion).*
      *   *Claim 7:* Empirical study settled a philosophical question. -> *False (Category error).*

  3.  **Address the Core Philosophical Gap (Is vs. Ought):**
      *   The text commits the Naturalistic Fallacy or a variant thereof.
      *   Descriptive ethics (how people *do* judge) $\neq$ Normative ethics (how people *should* judge).
      *   Variation in belief does not entail variation in truth (analogy: physics, medicine).
      *   To prove anti-objectivity, one needs an *argument*, not just data. (e.g., The Argument from Disagreement requires the premise that best explanation for disagreement is lack of truth, which is contested).

  4.  **Evaluate the WEIRD/East-West Contrast:**
      *   Henrich's WEIRD concept is robust in cognitive psychology.
      *   Haidt's Moral Foundations Theory (Care, Fairness, Authority, Loyalty, Sanctity) supports the "West = 2 foundations, Rest = 5 foundations" idea.
      *   *However:* It's not a binary. There is variation within cultures. "East" is not monolithic. The "unintelligible" claim is too strong; usually, it's just weighted differently.

  5.  **Can Empirical Evidence Bear on Objectivity?**
      *   Directly? No. Data doesn't yield norms.
      *   Indirectly? Yes.
          *   Debunking explanations (e.g., if moral beliefs are shown to be caused by irrelevant factors like disgust or framing, this undermines confidence in them).
