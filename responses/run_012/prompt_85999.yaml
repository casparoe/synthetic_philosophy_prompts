  ### Brainstorming: Objections & Counterexamples

  *   **The "Nothing New" Objection:** This is literally Spence (1973) vs. Schelling (1960). Spence's job-market signaling is your "Job One" (differential cost separates types). Schelling's *Strategy of Conflict* is your "Job Two" (burning bridges changes incentives). Economists have kept these distinct for 50 years. If rationalists are mashing them, that's a rationalist problem, not a discovery on your part.
  *   **The Index Trap:** You wobble on indices. You say, "maybe because it's just an index... handicap is the wrong label." Correct. But then you keep indices under "Job One." Indices (e.g., voice pitch correlating to size) aren't costly handicaps; they're physically constrained. They don't require differential *marginal* cost; they require impossibility of faking. If you lump Indices and Handicaps together, your "Cost is doing the work" thesis fails for indices.
  *   **The Subsidy Test Flaw (Commitment):** You say subsidize the matches (resource cost), commitment survives. True. But what if you subsidize the *option*? If I burn my boats but have insurance that guarantees me a retreat route anyway, the commitment fails. The cost of commitment isn't the matches; it's the lost option value. If the subsidy restores the option, the commitment dies. Your test needs to specify *what* is subsidized.
  *   **The Subsidy Test Flaw (Signaling):** If you subsidize education (free degrees for everyone), signaling collapses. Correct. But what if the subsidy is private? If only high-types get the subsidy, signaling might survive or even strengthen. The test assumes public, uniform subsidization.
  *   **The "Cost" Definition:** In biology, cost is fitness. In econ, it's utility. In your draft, it's "resources" vs. "options." You need to be careful not to equivocate. Burning boats costs resources *and* options. Growing a tail costs resources *and* increases predation risk (option cost?). The distinction is messier than you say.
  *   **Counterexample: Military Parades:** Is a military parade a handicap or commitment? It shows strength (handicap/signaling: only rich countries can afford it) AND it commits troops to be elsewhere (cannot fight while parading). But usually, it's purely signaling. If you subsidize the parade (free confetti), does it fail? Yes, because the cost was the signal of wealth.
  *   **Counterexample: Hostage Taking:** Giving the enemy a hostage is a commitment device (makes peace costly if you renege). Is it a signal? Maybe of confidence. If the enemy returns the hostage (subsidizes the cost), the commitment fails. But was it ever a signal of type? No, it was a change in incentives.
  *   **The Equilibrium Confusion:** You mention "stable in a population" vs. "individual thinking." This is the Evolutionary Stable Strategy (ESS) vs. Nash Equilibrium distinction. You're right that people slide between them, but in signaling games, the math is often isomorphic. Don't overstate the divide.
  *   **Zahavi/Grafen Attribution:** You got it right (Zahavi verbal, Grafen formal), but biologists still fight over whether handicaps exist in nature or if everything is indices. Don't present Zahavi as settled law.
  *   **The "Cheap Talk" Gap:** You mention cheap talk in the prompt but not the draft. Sometimes costless signals work ( Crawford & Sobel). Your draft implies cost is always necessary for honesty. That's false in repeated games or common-interest games.

  ***

  ### Reviewer Comments

  **To:** Blog Author
  **From:** The Grumpy Reviewer (Econ & Bio Lit)
  **Re:** Draft Review – "Cost is doing two different jobs"

  Alright, I've put on the hat. You asked me to be sharp, so I'm not going to coddle you. You've got a good instinct here, but you're walking into a minefield of terminology that economists and biologists have been fighting over for half a century. You think you're finding a new distinction; I think you're rediscovering a wheel that economists oiled in 1973, but you're right that your specific audience (rationalists) tends to grease it with mud.

  Here's the breakdown based on your four questions.

  #### 1. Is the distinction real, or are you reinventing something?

  The distinction is **real**, but you are absolutely reinventing the naming convention.

  *   **Job One (Handicap):** In economics, this is **Spencean Signaling** (Michael Spence, 1973). The core mechanism is a *separating equilibrium* driven by differential marginal costs. High-quality types find the signal less costly than low-quality types. You nailed the logic (it's the slope, not the level), but don't act like this is a novel insight into signaling theory. It is the definition of signaling in info-econ.
  *   **Job Two (Commitment):** In economics, this is **Schelling Commitment** (Thomas Schelling, 1960). This isn't usually called "signaling" at all. It's a "strategic move." It changes the payoff structure of the subsequent game, not necessarily the beliefs about the sender's type.

  **The Verdict:** You are correctly identifying that rationalists use "costly signaling" as a catch-all term for "any expensive thing that affects credibility." That is sloppy. Economists distinguish between *revealing information* (Signaling) and *changing incentives* (Commitment). Your contribution isn't the distinction itself; it's applying that distinction to clean up the rationalist lexicon. If you frame it as "Here's why your favorite concept is actually two different game-theoretic structures," you're on solid ground. If you frame it as "I found a flaw in signaling theory," you'll get eaten alive.

  #### 2. Where does it break? (The Strongest Counterexample)

  Your **Subsidy Test** is clever, but it breaks on the definition of "cost" in the Commitment case.

  You write: *"Subsidize the cost... free boats to burn... A commitment should survive, because the option is still gone even if somebody else bought the matches."*

  **Counterexample:** Imagine the subsidy isn't matches; it's **insurance**.
  If I burn my boats to commit to fighting, but I have a pre-existing contract with a third party that guarantees me a retreat route (a bridge appears if I signal), my commitment is void. The "cost" of commitment isn't the resource value of the boats; it's the *opportunity cost* of the retreat option.
  *   **Handicap Signal:** Subsidizing the resource cost (free peacock feathers) kills the signal because the differential *resource* expenditure was the proxy for quality.
  *   **Commitment:** Subsidizing the *option cost* (guaranteed retreat) kills the commitment.

  Your test works if you subsidize the *resource* (matches/feathers). But commitment often relies on the loss of future flexibility, not just the burning of current resources. If the subsidy restores flexibility, commitment fails. You need to refine the test to specify: "Subsidize the resource expenditure without restoring the lost option." That's harder to do in practice, which makes the test less clean than you want it to be.

  **Second Counterexample (Indices):** You mention indices in passing ("maybe because it's just an index... handicap is the wrong label"). You need to pull this thread. Indices (e.g., a deep voice indicating body size) are "honest signals" that require **zero cost** to be honest—they are physically constrained. If you lump Indices under "Job One," your claim that "cost is what makes the signal credible" is false. Indices are credible *despite* having no cost. You need a three-way split: Indices (physical constraint), Handicaps (differential cost), Commitments (incentive change).

  #### 3. Have you mangled the biology or game theory?

  **Biology:**
  *   **Zahavi/Grafen:** You got the attribution right (Zahavi proposed, Grafen formalized). However, be careful presenting the Handicap Principle as settled fact. There is a massive debate in behavioral ecology about whether true handicaps exist or if most signals are indices or conventional signals. Don't treat Zahavi as gospel; treat it as the dominant model that has critics.
  *   **Marginal Cost:** You said, *"It's informative because the low-quality bird pays more at the margin."* This is correct Grafen logic. Keep this. It's the strongest part of your bio theory.

  **Game Theory:**
  *   **Signaling vs. Screening:** You mention screening in the prompt but not the draft. Just be aware: Signaling is sender-chosen (peacock grows tail). Screening is receiver-chosen (employer sets test). Your draft is purely signaling/commitment. That's fine, but don't confuse them later.
  *   **Information Asymmetry:** Signaling *requires* private information (I know my quality, you don't). Commitment does *not* necessarily require private information. I can commit to fighting even if you know I'm weak, provided the commitment makes fighting my dominant strategy. You hint at this ("nobody learns anything about your type"), but make it explicit. That's the hard line between the two jobs.
      *   **Job One:** Resolves asymmetry about **Type**.
      *   **Job Two:** Resolves asymmetry about **Future Actions** (or rather, eliminates the ability to choose).

  #### 4. Is this worth posting?

  **Yes, but with conditions.**

  *   **Don't claim novelty on the mechanics.** Acknowledge upfront: "Economists call these Spence Signaling and Schelling Commitment. Rationalists call both 'Costly Signaling.' This causes confusion." If you pretend you discovered the difference between signaling and commitment, the econ-literate readers will tune out.
  *   **Fix the Index wobble.** Either commit to separating Indices from Handicaps (recommended) or clarify that you're grouping them as "Information Revelation" vs. "Incentive Modification."
  *   **Refine the Subsidy Test.** Acknowledge the nuance about option restoration. "If the subsidy restores the option, commitment fails. If it only covers the resource cost, commitment holds."
  *   **The Meta-Worry is Gold.** Your point about "evolutionary stability vs. individual intent" is excellent. Rationalists often anthropomorphize evolutionary models. Highlighting that "costly signaling" is an equilibrium property, not a psychological motive, is a valuable correction for your audience.

  **Final Verdict:**
  You're not explaining water, but you are explaining why people keep calling water "wet fire." The distinction is standard in academia but muddled in your niche. That makes it worth posting. Just cite Spence and Schelling, clean up the biology, and sharpen the subsidy test. Then hit publish.

  **One last thing:** Your prose is rough (you warned me), but the argument structure is sound. Don't let the editing process smooth out the sharp edges of the argument. The "Job One/Job Two" framing is catchy; keep that.

  Now go fix the index paragraph.
