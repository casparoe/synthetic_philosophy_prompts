prompt: |-
  Act as a philosopher of decision theory and game theory, and reason carefully before you write; if it helps, spend a few sentences at the start sketching two or three candidate ways of framing the problem and say why you settle on one, but do not show me the brainstorm in the final document. I am applying for a one-semester independent-study grant and need a short research proposal, roughly 1,200–1,500 words, built around a half-formed idea of mine.

  The idea concerns superrationality. As it is normally stated, a superrational player assumes that every other superrational player who faces the same problem will arrive at the same answer, and so chooses the strategy that maximizes the common payoff; this is what is supposed to make cooperating in a one-shot Prisoner's Dilemma defensible. What bothers me is that nearly every clean illustration assumes a population of players who are either all superrational or all ordinary expected-utility maximizers. I care about the mixed case: a superrationalist who knows that only some fraction of the others reason as she does. The toy game I want to use is a lottery of the Luring-Lottery kind, where a single fixed prize is divided by the total number of entries, each player may submit any positive whole number of entries, and one entry is drawn at random to take the (already divided) prize. Among identical reasoners this game has a tidy superrational answer, but once the superrationalist assigns a probability to facing non-superrational opponents, I cannot tell whether her recommended number of entries is even well-defined, and I suspect the whole notion either reduces to a heuristic that just restates an assumption about how others will behave or collapses into ordinary expected-utility reasoning with an oddly chosen prior.

  Please turn this into the proposal. State the central question so that it has a determinate answer rather than a slogan, and make clear what the possible answers are. Explain why the obvious alternatives — ordinary causal expected-utility reasoning, evidential decision theory, and the bare "everyone reasons alike" version of superrationality — each leave the mixed-population case open rather than settling it. Lay out the method: what I would actually do with the game, in what order, and roughly month by month across a semester, and why this approach rather than just appealing to intuitions about cooperation. Say what a real result would look like, what would count as the project failing, and give an honest assessment of what could make it too large for the time available. Do not include a bibliography or citations; refer to positions and arguments by their content, and I will add the references myself.
