answer: |-
  Two Kantians, Klaus and Johann, are having coffee.

  Klaus looks troubled. "I have an entry in my moral ledger I cannot balance," he says. "Yesterday, in a fit of pique, I struck my spaniel."

  Johann nods gravely. "A serious failure of duty regarding animals. The coarsening of your own sensibility must have been significant."

  "Precisely," says Klaus. "But to isolate the variable, I later smashed my grandmother's porcelain vase in the same state of anger."

  "And the damage to your humanity?"

  "Identical. The degradation of my moral character was exactly the same in both instances."

  "So," Johann says, stirring his coffee, "the spaniel and the vase are morally equivalent."

  "Theoretically, yes. But practically, I find the vase superior for ethical training."

  "Oh? Is it less messy?"

  "No," says Klaus. "It's that the vase accepts its role as equipment for my moral calibration. It's very distracting when the whetstone starts whimpering and looks at you as if *it* was the one who was wronged."
