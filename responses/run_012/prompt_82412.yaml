      *   *Nuance:* Acknowledge that the "fiction exemption" isn't absolute. Sometimes even fiction gets blocked. This supports the "liability" argument over the "pure theory" argument.
      *   *Key Insight:* The user asked about *autonomy*. I need to highlight that the system treats the "writer" as having higher autonomy (capable of handling dangerous info responsibly) than the "asker" (who might be in crisis).

