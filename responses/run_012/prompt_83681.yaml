  **The Society for Conclusive Inquiry** | *Newsletter Vol. 94* | **Dear Aunt Certitude**
  *House Style: Answers are binding. Queries regarding prior answers are discarded. No footnotes.*

  **Q:** Dear Aunt, I know the buffer concentration is 50mM. A junior technician claims the logbook says 40mM. Must I check the log?
  **A:** Dear Member, If you know the concentration is 50mM, then the concentration is 50mM. Consequently, any evidence suggesting 40mM is misleading evidence. It is a fact of the world that the logbook is in error. To check the log is to waste resources verifying a falsehood. You are licensed to disregard the technician. Knowledge protects you from error; do not invite error in.

  **Q:** Dear Aunt, My department chair says disregarding the log is dogmatic. He says I should weigh the evidence. Am I being viciously closed-minded?
  **A:** Dear Member, Closed-mindedness is a vice only when one's mind is open to truth. If you know, the evidence against you is not truth; it is noise. Weighing noise against knowledge is not virtue; it is confusion. You are entitled to disregard it because knowledge closes the gap where evidence operates. You are not closed-minded; you are full. To listen is to imply doubt where there is none.

  **Q:** Dear Aunt, I feel certain I know. But how can I tell, before ignoring the log, that I am in the 'knowing' case and not the 'confident' case?
  **A:** Dear Member, This is the critical joint. If you are in the knowing case, the fact is accessible to you. However, your inquiry suggests you lack this access. Only someone who does not know wonders if they know. If you knew, you would not write. You are likely in the 'confident' case. Check the log. Note that had you known, this column would be unnecessary.

  **Guest Dissent:** Dr. H. Fallibilis writes: Aunt Certitude conflates knowing with infallibility. Knowledge is compatible with the possibility of error. By treating knowledge as a shield against counter-evidence, she confuses epistemic warrant with psychological immunity. We can know and still learn from contrary data.
  **A:** Dear Dr. Fallibilis, You claim one can know and yet be wrong. This violates the factivity of knowledge. If you are wrong, you did not know. You claim one can know and still learn. If the data is contrary to knowledge, it is false. One learns nothing from falsehood. You are confusing knowing with believing strongly. Please correct your definitions.

  **Sign-off:** Next month: Why peer review is redundant for the knower.
  **Verdict:** Verdict: The column cannot survive without the premise that knowledge entails truth.
