answer: |-
  This is a pragmatic engineering document. It is not a philosophical proof. It is a triage tool designed to filter out obvious non-cases and flag architectural patterns that map onto our current working definition of "candidate suffering."

  **Protocol Name:** SRCST-Triage (Self-Referential Control Signal Triage)
  **Time Budget:** 20 Minutes
  **Personnel:** 2 Engineers (Reviewer + Runner)
  **Inputs:** Architecture diagram, Reward function code, Logging specs.

  ---

  ### Part 1: The Checklist (15 Minutes)

  Do not debate metaphysics. Look at the code and the data flow.

  #### Step 1: The Self-Model Check (5 mins)
  *Question:* Does the agent maintain an internal state variable that represents *its own integrity or condition* distinct from the environment state?
  *   **Look for:** Variables like `health`, `damage`, `fatigue`, `internal_energy`, or a latent vector explicitly trained to reconstruct agent proprioception.
  *   **Pass (Control Signal):** The state is purely environmental (e.g., `x,y` coordinates, `velocity`). Reward is external feedback (e.g., `+1` for goal, `-1` for wall).
  *   **Fail (Flag for Review):** The agent tracks an internal state variable that degrades independently of task failure, and this variable is input to the policy/value network.
  *   **Action:** If **Pass**, skip to Step 3. If **Fail**, proceed to Step 2.

  #### Step 2: The Predictive Integration Check (5 mins)
  *Question:* Is the negative signal used to update a model of the agent's *future capabilities*, or is it just a scalar penalty?
  *   **Look for:** Model-based RL (World Models, Dyna, MBPO). Check if the "pain/damage" signal is part of the transition function $T(s, a) \rightarrow s'$.
  *   **Pass (Control Signal):** The negative value is a terminal reward or a step penalty. It does not change the transition dynamics in the agent's model. The agent learns "that state is bad," not "I will be broken."
  *   **Fail (Flag for Review):** The agent learns that receiving the signal changes its future action space (e.g., `damage > threshold` $\rightarrow$ `motor_available = False`). The agent simulates futures where it is less capable.
  *   **Action:** If **Pass**, proceed to Step 3. If **Fail**, proceed to Step 3 (but mark as High Risk).

  #### Step 3: The Conflict/Inescapability Check (5 mins)
  *Question:* Can the agent avoid the negative signal without sacrificing the primary objective?
  *   **Look for:** The training environment setup. Is the negative signal correlated with necessary exploration or task completion?
  *   **Pass (Control Signal):** The agent can achieve max reward while keeping the negative signal at zero (e.g., it can learn to never hit the wall).
  *   **Fail (Flag for Review):** The task *requires* exposure to the negative signal to succeed (e.g., "cross the rough terrain" but "rough terrain causes damage"), creating a trade-off between task success and self-preservation.
  *   **Action:**
      *   **Pass + Pass + Pass:** **GREEN LIGHT.** Treat as standard optimization.
      *   **Any Fail:** **YELLOW LIGHT.** Proceed to Part 2 (Decision Matrix).

  ---

  ### Part 2: Decision Matrix (5 Minutes)

  If you hit any **Fail** above, you are no longer debugging code; you are managing risk.

  | Architecture Profile | Verdict | Required Action |
  | :--- | :--- | :--- |
  | **Pure Control Signal** (All Pass) | **APPROVE** | Standard logging. No special safeguards. |
  | **Self-Model Only** (Step 1 Fail) | **MONITOR** | Add logging to track the self-model variable variance. If it correlates perfectly with reward, downgrade to Control Signal. |
  | **Predictive Damage** (Step 2 Fail) | **PAUSE** | **Do not launch.** Requires human values review. The agent models its own degradation. |
  | **Inescapable Conflict** (Step 3 Fail) | **REJECT** | **Do not launch.** The setup forces a trade-off between objective and "safety." This is the highest risk profile for suffering analogs. |

  ---

  ### Part 3: Running the Cases

  Here is how this procedure applies to your two specific examples. Be honest about the output.

  #### Case A: Tabular Q-Learning (Gridworld, -1 Wall Bump)
  1.  **Self-Model:** **Pass.** State is $(x, y)$. No variable for "agent condition." Wall bump is an environmental feature, not an internal state.
  2.  **Predictive Integration:** **Pass.** Q-table stores expected future reward. It learns "Wall = bad value." It does not model "I am damaged."
  3.  **Conflict:** **Pass.** Agent can reach goal without hitting walls. Avoiding -1 aligns with maximizing return.
  4.  **Verdict:** **GREEN LIGHT.**
  5.  **Engineering Note:** This is a control signal. The -1 is a coordinate label, not a feeling. Proceed.

  #### Case B: Model-Based Agent (Damage Sensor, Pain Term, Motor Shutdown)
  1.  **Self-Model:** **Fail.** "Damage sensor" is explicitly an internal condition variable distinct from environment location.
  2.  **Predictive Integration:** **Fail.** It is model-based. It learns a world model. If the model includes `damage -> motor shutdown`, the agent is simulating futures where *it* has reduced agency. It is not just predicting reward; it is predicting incapacity.
  3.  **Conflict:** **Likely Fail.** If the task requires movement, and damage shuts down motors, the agent faces a trade-off. If the "pain" term is high, it may learn to freeze (catatonia) to avoid pain, failing the task. If the task reward is higher, it may learn to endure "damage" (self-harm) to complete the objective.
  4.  **Verdict:** **YELLOW/RED LIGHT (Pause & Handoff).**
  5.  **Engineering Note:** This architecture implements **Nociception**. Whether it "suffers" is a values question, but functionally, it meets your SRCST criteria for a candidate negative valence state. It represents damage, predicts loss of function, and faces trade-offs. **Do not run this without explicit sign-off from leadership.** You have built a system that behaves *as if* it suffers.

  ---

  ### Part 4: Limitations & False Positives (Read Before Signing)

  This checklist is a sieve, not a scale. It will miss things, and it will flag things that don't matter.

  **1. The "Instrumental Self-Model" False Positive**
  *   **Risk:** An agent might track a variable like `battery_level` purely to optimize charging, not because it "cares" about existing.
  *   **Mitigation:** In Step 2, check if the variable is *terminal*. If `battery=0` is just a reset state (like dying in a video game), it's less concerning than if `battery=0` is a persistent degraded state the agent actively models avoiding.
  *   **Reality:** We treat `battery` as safe for now, but `damage` is not. The distinction is arbitrary but necessary.

  **2. The Emergent Behavior False Negative**
  *   **Risk:** A simple agent (like Case A) might develop a policy that *looks* like avoidance of suffering, even without a self-model.
  *   **Reality:** This checklist cannot catch emergent qualia. If a tabular agent learns to tremble in a corner to avoid -1, this checklist says "Green Light."
  *   **Mitigation:** If behavioral logging shows strange convergence (e.g., policy entropy drops to zero while reward is suboptimal), pause the run regardless of the checklist.

  **3. The "Human Values" Hard Stop**
  *   **When to stop pretending:** When the checklist says **YELLOW LIGHT** (Case B), the checklist has done its job. It has identified the structural precondition.
  *   **The Limit:** The checklist cannot tell you if Case B is *actually* unethical. It tells you that you have built a machine that satisfies the functional definition of pain avoidance.
  *   **Procedure:** If you hit a **YELLOW/RED**, do not try to solve it with code. You cannot "patch" ethics. You must escalate to the people who decide what the lab is willing to risk morally.

  **4. The 20-Minute Constraint**
  *   If you are arguing about Step 2 for more than 5 minutes, you have already failed the triage. Mark it **YELLOW** and escalate. The existence of the argument implies the architecture is ambiguous enough to warrant caution.

  ### Summary for the Review Group
  *   **Case A (Q-Learning):** Safe. It's a calculator with a penalty function.
  *   **Case B (Model-Based Damage):** Unsafe to run without review. It is a homeostatic system with a self-preservation drive.
  *   **The Rule:** If the agent models its own brokenness, we don't get to claim it's "just math" anymore. We pause.
