answer: |-
  Here are the candidate concepts I am weighing against your description, with a brief statement of what each is usually taken to be:

  1.  **The Regress of Interpretations:** The thesis that any statement of a rule requires a further interpretation to be applied, but that interpretation is itself just another statement requiring interpretation, leading to an infinite chain.
  2.  **Practice-Based Normativity (or Communitarianism):** The view that the correctness of a rule's application is not fixed by the rule itself, but by the stable, shared dispositions of a community to act in certain ways.
  3.  **Open Texture (or Vagueness):** The idea that language and rules have hard cores of clear meaning but fuzzy boundaries where application becomes uncertain due to unforeseen circumstances.
  4.  **Constitutive Indeterminacy:** The specific claim that for certain types of rules (like games or logic), the rule does not merely guide an existing activity but creates it, and if the community splits, the activity itself fractures rather than one side being "wrong."

  I will now adjudicate between them to answer your five questions.

  ### 1. The Name of the Pattern
  The pattern you describe—the patch-and-regress where every repair presupposes the understanding it was meant to secure—has an established name: **The Regress of Interpretations**.

  However, your description captures something vital that the label often obscures. Usually, this regress is presented as a logical puzzle: "If I need a rule to tell me how to apply a rule, don't I need a rule for that rule?" Your description is more phenomenological: you *tried* to patch it, and you *saw* the understanding was already required.

  What the standard concept says that your description leaves out is the *positive* implication. The regress is not usually meant to show that rules are useless; it is meant to show that **meaning is not a mental object or a written text.** The regress proves that understanding cannot be a *thing* that accompanies the rule (like a picture in your head), because that picture would also need interpreting. The lesson is not that we cannot follow rules, but that "following a rule" is a primitive practice, not a theoretical operation. You have correctly identified the engine of the problem, but you are treating it as a failure of the rule, whereas the philosophical tradition treats it as a discovery about the nature of meaning.

  ### 2. The Friend's Position and the Objection
  Your friend's position is best named **Practice-Based Normativity**. It trades the authority of the text for the authority of the "form of life" or shared custom.

  The standard objection you were groping for is called **The Normativity Objection** (sometimes associated with the "Quinean" or "Kripkean" skeptic, though they use it differently). It runs exactly as you stated: If correctness is just "what we do," then there is no gap between *seeming* right and *being* right. If the whole community agrees that 2 + 2 = 5, the Practice-Based view struggles to say they are wrong, because their practice *makes* it right.

  This objection claims that Practice-Based Normativity collapses the distinction between **normativity** (how we *ought* to go on) and **regularity** (how we *do* go on). A habit is just a regularity; a rule implies a standard against which the habit can be judged. Your friend tries to dissolve this distinction, saying the "ought" emerges from the "do." Your intuition—that a community could be systematically mistaken—is the enduring counter-force. There is no consensus resolution to this. Some philosophers accept that community error is impossible in principle (radical communitarianism); others insist there must be facts about meaning that transcend practice (realism); others say the question itself is confused.

  ### 3. Distinguishing the Pattern from Other Problems
  You are right to suspect these are different things wearing the same clothes. Here is the ground for distinguishing them:

  *   **Vagueness:** Vagueness concerns *boundary cases* (e.g., "Is this color red?"). It assumes that for clear cases, the rule *does* determine the application. Your regress shows that even for clear cases (like moving a knight), the rule does not determine its own application. Vagueness is about the edges of the concept; your pattern is about the *link* between the concept and the world.
  *   **Legal Indeterminacy:** Your lawyer friend is speaking about **Underdeterminacy**. This is the idea that lawmakers cannot foresee every future case. This is an empirical limitation of human foresight. Your problem is conceptual: even if you *could* foresee the case, stating the rule for it would still require interpretation. Legal theory often assumes a "judge" can settle the matter; your chess club shows that even the "judges" (the players) can split indefinitely.
  *   **The Sorites Paradox (Heaps):** This is a specific logical puzzle about incremental changes (remove one grain, is it still a heap?). It relies on the premise that one grain makes no difference. Your problem does not rely on incremental change; it relies on the gap between *instruction* and *action*.
  *   **Skepticism about Justification:** This asks, "How do you *know* you are right?" Your problem is not epistemic (about knowledge); it is semantic (about meaning). It asks, "What *makes* this move the one the rule meant?"

  The ground of distinction is this: Vagueness, Law, and Sorites all assume there is a fact of the matter that is just hard to reach. Your pattern suggests there may be **no fact of the matter** prior to the act of applying the rule.

  ### 4. Does the Friend's Position Survive?
  This is the hardest question. In the abstract, Practice-Based Normativity survives by biting the bullet: it says, "Yes, if the whole community agreed 2+2=5, then in that language, 2+2=5."

  But your chess club case is a specific counter-example that damages the view. The friend's theory relies on **agreement in judgments** to settle meaning. In your club, the judgment is *not* agreed upon, yet the game continues. The split has been stable for years.

  If practice settles meaning, a stable split implies a **fracture in the meaning**. It implies there are now *two* chesses being played in the same room. The friend might say, "Eventually one side will die out." But if they don't? If the split is truly stable, the Practice-Based view must admit that the rule **does not determine the move, and the practice does not determine the move.**

  This suggests a standard repair known as **Quietism**. The Quietist says your question ("But which side is *really* right?") is a philosophical illusion. There is no "really right" beyond the reasons each side gives. If the federation never steps in, there is no fact of the matter. This saves the friend's position but at the cost of admitting that normativity is local and fragile. It survives, but it loses its grip on the idea of a single, objective "Chess."

  ### 5. Judgement and Definition
  The pattern itself (the regress) has a name, so I will not coin one for that. However, the specific situation of your chess club—the stable split where neither rule nor practice settles the matter—lacks a precise designation. I will coin a term for this specific state of affairs, as it clarifies what is at stake.

  I call this **Constitutive Stalemate**.

  **Definition:** A Constitutive Stalemate occurs when a community operating under a constitutive rule (a rule that creates the activity, like chess or logic) divides into stable, incompatible practices, where neither side can appeal to a higher authority or a pre-existing fact to resolve the dispute.

  **What falls inside it:**
  *   Your chess club's move dispute.
  *   A mathematical community splitting on whether a certain proof counts as valid (e.g., intuitionists vs. classical logicians).
  *   A religious schism where both sides claim the same scripture.

  **What falls outside it:**
  *   **Vagueness:** If the club agreed the move was "borderline" and flipped a coin, that is vagueness. In a Stalemate, both sides claim it is *definite*.
  *   **Simple Error:** If 99% said one thing and 1% another, and the 1% admitted they hadn't read the rulebook, that is error. In a Stalemate, both sides appeal competently to the same sources.

  **The Counterfactual: A Self-Determining Rule**
  You asked what a case would look like in which a rule genuinely determined its own application.
  To imagine this, you would have to imagine a rule that does not require a human being to interpret it. It would have to be a rule that *executes itself*.
  *   **Example:** A computer program. If I write `if x then y`, the computer does not "interpret" this; the physical state of the machine *is* the application.
  *   **The Catch:** Even here, we (the users) interpret the output as "following the rule." If the computer glitches, we say it "failed to follow the rule." So the normativity still comes from us, not the machine.

  **What follows from there being no such case:**
  If no rule determines its own application (which I believe is the correct conclusion), then **meaning is inherently vulnerable.** It is not anchored in the sky or in the text; it is anchored in our continued agreement to go on in the same way. This means that certainty is not a logical guarantee but a social achievement.

  In your chess club, the Constitutive Stalemate reveals that "Chess" is not a Platonic object waiting to be discovered. It is a fragile agreement. When that agreement fractures, the rule does not save you. The rule is just ink. The only thing that could save you is a decision—not a discovery of what was already true, but a choice to make one way the standard. Your friend is right that the rule doesn't save you; you are right that "what we do" isn't saving you either, because "what we do" is currently two things. The gap you see is real. It is the gap between the sign and the world, and it is closed not by logic, but by authority or time.
