      *   *Section 2: The Absoluteness Boundary (Putnam).* This is the heavy hitter. If cardinality is relative, why not $\in$? Discuss $\Delta_0$ absoluteness vs. $\Sigma_1$. The risk of "Model-Theoretic Skepticism." *Verdict: Serious/Philosophically Costly.*
      *   *Section 3: Intended Interpretation vs. Multiverse.* Does the deflationist need a "God's eye view"? Discuss the regress problem. *Verdict: Moderate.*
