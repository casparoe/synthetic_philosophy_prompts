answer: |-
  Here is a plan for your 75-minute section, structured to maximize conceptual clarity while managing the specific misconceptions you anticipate.

  ### 1. Evaluation of Your Scaffold
  Your sequence is logically sound, but pedagogically delicate. Keep the order **(1) Structure $\rightarrow$ (2) Divergence $\rightarrow$ (3) Institutions**, but you must tighten the dependencies to prevent students from collapsing Point 3 back into Point 2.

  *   **First (Structure):** You are correct to start here. You cannot diagnose a category error (confusing merit with desert) until students have the vocabulary to distinguish the *basis* of a claim from the *object* of a claim.
      *   *Why:* If you skip this, students will hear "desert" and immediately substitute "entitlement" or "outcome."
  *   **Second (Divergence):** This depends on Point 1. Once they accept that desert has a *basis* (e.g., effort) and an *object* (e.g., a salary), you can show that meritocracy selects for a *different basis* (e.g., utility/outcome) to allocate the *same object*.
      *   *Why:* This creates the conceptual gap. If you introduce institutions first, students will assume the institution's rules *define* desert, which kills the distinction you are trying to teach.
  *   **Third (Institutions):** This depends on Point 2. Once they see that Merit and Desert can diverge, Point 3 explains how we manage that divergence. Institutions do not merely "register" pre-political desert; they select which *basis* of desert counts.
      *   *Warning:* Point 3 is the danger zone. If introduced too aggressively, it sounds like "Desert is just whatever the rules say." You must frame it as: *Institutions make a specific basis of desert salient, but they do not exhaust the concept.*

  **Verdict:** Your order is correct. Do not swap them. However, allocate your time heavily toward Point 2, as that is where the conceptual separation happens. Point 3 is the synthesis; Point 1 is the vocabulary.

  ### 2. The Carrying Example
  You are right to avoid the orchestra or draft. Those cases trigger a "performance = reward" reflex that makes desert look identical to merit. You need a case where the **Meritocratic Basis** (Outcome/Utility) and the **Desert Basis** (Effort/Contribution) clearly point to different people, within a context that feels high-stakes but lacks immediate political polarization.

  **The Example: The "Merit Scholarship" Case**
  *   **Scenario:** A university has one $50,000 "Excellence Scholarship."
  *   **Candidate A (The Natural):** Has a 4.0 GPA. Finds coursework easy due to high natural aptitude. Studies 5 hours/week.
  *   **Candidate B (The Grinder):** Has a 3.9 GPA. Works two part-time jobs to support family. Studies 40 hours/week. Overcame significant educational disadvantage.
  *   **The Decision:** The Committee awards it to Candidate A because the stated criterion is "Highest Academic Achievement" (Merit/Outcome).
  *   **The Reward:** The Money + The Title "Scholar."

  **Why this works:**
  1.  **It lacks "1%" Baggage:** It avoids CEO pay or systemic class warfare initially, focusing on a micro-allocation students understand.
  2.  **It Separates Basis from Object:** The *object* is the same ($50k). The *basis* for Merit (GPA/Outcome) differs from the *basis* for Desert (Effort/Overcoming).
  3.  **It Forces the Distinction:** Students will likely feel B *deserves* it more (fittingness/effort), even if A *merited* it more (allocation/rules).
  4.  **It Enables Point 3:** It allows you to ask: "Did the University create the desert by setting the GPA rule, or did they ignore a pre-existing desert?"

  **What it must lack:** Do not mention race, legacy admission, or donor influence. Keep the variables controlled to *Effort vs. Talent* so the "Natural Lottery" objection arises from the philosophy, not the sociology.

  ### 3. Mapping Misconceptions & Interventions
  Here is the order in which these objections will surface and exactly where you must intercept them.

  **1. "Effort is the only real basis of desert."**
  *   **When:** During **Point 1 (Structure)**. As soon as you define "Basis," students will assert that only effort counts.
  *   **Intervention:** Stop this immediately. Use the Scholarship Case. Ask: "If Candidate B studied 40 hours but produced a 2.0 GPA due to lack of aptitude, do they deserve the *Excellence* Scholarship?"
  *   **Goal:** Show that *Contribution* and *Outcome* are also valid bases of desert, not just Effort. This keeps the concept of "Basis" flexible for later.

  **2. "Desert = Entitlement / Legally Owed."**
  *   **When:** During **Point 2 (Divergence)**. When you say "A merited it, but B deserves it," students will say, "But the rules said A gets it, so A is entitled."
  *   **Intervention:** Distinguish *Institutional Entitlement* (rules-based) from *Moral Desert* (fittingness-based). Use the phrase: "Entitlement is about the rules of the game; Desert is about whether the game honors what matters."
  *   **Goal:** Prevent the slide where "desert" just becomes "following the procedure."

  **3. "You can't deserve what you didn't freely choose (The Free Will Knockdown)."**
  *   **When:** During **Point 2 (Divergence)**. When discussing Candidate A's talent vs. Candidate B's effort. Students will argue A doesn't deserve the reward because talent is luck.
  *   **Intervention:** Do not solve free will. Bracket it. Say: "We are not asking if free will exists. We are asking which *basis* the institution is honoring. If the institution honors Outcome, it honors Talent. If it honors Effort, it honors Will. Both are claims of desert, just different bases."
  *   **Goal:** Move the debate from *Metaphysics* to *Basis Selection*.

  **4. "The Natural Lottery settles the matter."**
  *   **When:** During **Point 3 (Institutions)**. Students will argue that because talent is arbitrary, the whole allocation is unjust.
  *   **Intervention:** Use Point 3 here. Explain that Institutions are the *mechanism* by which we decide which lottery tickets count. The Natural Lottery doesn't settle the matter; it provides the raw material. The Institution decides if that material counts as a basis for desert.
  *   **Goal:** Show that Institutions are active mediators, not passive registrars.

  ### 4. The Closing Question
  You need a question that tests if they have separated the **Allocative Claim** (Who gets the spot?) from the **Distributive Claim** (What treatment fits the person?). Do not ask if the system is fair (that invites political ranting). Ask this:

  > **"If the Scholarship did not exist—if there was no money and no title—would Candidate B still be 'more deserving' of recognition than Candidate A, or does the desert claim vanish without the institution?"**

  *   **If they say "Vanish":** They have conflated Desert with Entitlement (Point 2 failure).
  *   **If they say "Still Deserving":** They understand Desert as a moral fittingness independent of allocation.
  *   **If they say "Depends on the Basis":** They have mastered the distinction (Point 1 success).

  ### 5. Scope Boundaries
  Your instincts on exclusions are correct. Explicitly state these boundaries at the start of the section to prevent derailment.

  *   **Exclude Rawls vs. Nozick:** This is a debate about *justice*, not *desert*. Justice concerns the structure of the institution; desert concerns the relation between person and treatment. Tell them: "We are analyzing the concept of desert, not defending a theory of justice."
  *   **Exclude Metaphysics of Free Will:** As noted in the intervention map. Treat "choice" as a pragmatic basis for credit, not a metaphysical condition. Tell them: "We are assuming agents can be credited for effort for the sake of this argument."
  *   **Exclude Empirical Social Mobility:** Do not let the discussion slide into "Does meritocracy actually exist in the US?" That is a sociological question. You are running a conceptual ethics section. Keep the focus on the *logic* of the claims, not the *statistics* of the economy.

