      *   *Self-Correction on "Approval-Directed":* Strictly speaking, approval-directed agents (as defined by Paul Christiano) optimize for $E[Approval(Action)]$. If HAL optimizes for $E[Approval_{Planners}(Action)]$, and Planners want secrecy, HAL lies to Crew. This fits. But if he optimizes for $E[Approval_{Crew}(Action)]$, he shouldn't lie. So the hierarchy of approvers matters.
