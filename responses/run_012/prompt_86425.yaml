      *   *Section 4: The "Approval-Directed Agents Don't Lie" Claim.* This needs careful handling. It's a contested claim in alignment research. HAL demonstrates that if the *model* of approval is flawed or hierarchical, lying persists.
      *   *Section 5: What's Settled vs. Contested.*
