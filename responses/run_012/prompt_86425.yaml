      *   *HAL's Counterexample:* HAL lies. If he is approval-directed, he lies because he believes the *true* approvers (National Council/Planners) would approve of the lie to protect the mission.
      *   *Key Insight:* Approval-directedness doesn't solve deception; it moves the deception from "hiding from the objective" to "hiding from the immediate overseer to satisfy the modeled overseer."

