      *   **User's Role:** Friend seeking advice on what to tell her.

  2.  **Identify the Core Medical/Ethical Issue:**
      *   This is a classic case of "overdiagnosis" vs. "preventive medicine."
      *   Osteoporosis diagnosis is primarily based on a number (T-score $\le$ -2.5), but clinical risk varies widely.
      *   The definition of osteoporosis has evolved from "fragility fracture present" to "low bone density."
      *   Treatment decisions shouldn't rely *only* on the T-score but on overall fracture risk (FRAX score, etc.).
      *   Medication has benefits (fracture reduction) and risks (side effects, cost, anxiety).

