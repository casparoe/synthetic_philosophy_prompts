prompt: |-
  A friend of mine, sixty-three, has just been told by her doctor that she has osteoporosis and should begin taking medication. The diagnosis rests on a bone-density measurement that falls just below a cutoff; she has no symptoms, has never broken a bone, and feels entirely well. Her sister, whose measurement is essentially the same, was told by a different clinic that nothing was wrong, and a third doctor described what my friend has as a risk factor rather than a disease. She wants to know whether she is genuinely sick or has merely been given a label, and I'm not sure how to answer. What should I tell her?
reasoning: |-
