      *   **The Definition:** Explain *why* there's confusion. It's a shift from "broken bones" to "risk of broken bones." It's a risk factor *and* a disease label depending on who you ask.
      *   **The Number vs. The Person:** The T-score is just one piece. Age, family history, fall risk, lifestyle matter more for *actual* outcomes.
