answer: |-
  ### The Case: The Hospice Vigil

  **The Setting:** A small, underfunded hospice clinic.
  **The Agent:** Mara, a volunteer caregiver and practicing Buddhist.
  **The Situation:** A long-term patient, Mr. Henderson, is entering his final 24 hours. He is terrified, hallucinating, and combative. The regular staff are stretched thin due to a flu outbreak. If Mara stays for a continuous 24-hour vigil, holding his hand and speaking calmly, there is a 90% chance he will die peacefully. If she leaves (as she is scheduled to), the night staff are too rushed to provide constant comfort; there is an 80% chance Mr. Henderson will die in a state of panic and physical struggle.

  **The Cost to Mara:** Mara has already volunteered 15 hours this week. She is physically exhausted and emotionally raw. She knows from experience that pushing past this specific threshold triggers a psychological reaction in her: a deep, involuntary resentment toward the dying (seeing them as burdens rather than beings) and a collapse of her mindfulness practice that lasts for weeks. To stay, she must suppress her genuine limit and force a "compassion" that is actually aversion in disguise.

  **The Act:** Mara must decide whether to clock in for the 24-hour vigil.

  ---

  ### The Bookkeeping

  #### 1. The Act-Utilitarian Verdict
  **Verdict:** Mara **should stay**.
  **Reasoning:** The calculation pools all suffering and relief. Mr. Henderson's peaceful death prevents significant agony for him and his grieving family. Mara's resentment and temporary loss of mindfulness are real costs, but they are outweighed by the magnitude of a human being's peaceful transition versus a terrified death. The "greater good" is the minimization of total suffering in the system. Mara's internal state is just one variable in the equation, not a veto.
  **Decisive Feature:** None of the Buddhist features apply here. The utilitarian treats Mara's mind as a container of utility, not a sacred vessel.

  #### 2. The Buddhist Verdict
  **Verdict:** Mara **should leave**.
  **Reasoning:**
  *   **Feature 1 (Intention):** The moral quality of the act is determined by *cetana* (volition). To stay, Mara must intend to override her own clarity and suppress her aversion. This creates a volition of "forced care," which is rooted in delusion and subtle aggression against her own limits. The act is unwholesome (*akusala*) because the mind-state driving it is corrupted, regardless of the patient's comfort.
  *   **Feature 2 (Agent-Centric Karma):** The primary "bad consequence" is not the patient's pain (which is his karma to experience), but the karmic seed planted in *Mara's* mind. The resentment she cultivates creates a habit energy (*vasana*) that will make her less compassionate in the future. This damage lands squarely on her, not in a general pool.
  *   **Feature 3 (Non-Maximizing Ceiling):** Mara is not a utility pump. She is a practitioner on a path. There is a ceiling on what she can be asked to sacrifice: she must preserve the conditions necessary for her own awakening (mental balance, genuine *metta*). She is not obligated to trade her spiritual capacity for worldly comfort, even if the worldly comfort is significant.

  **Mapping the Features:**
  *   **Feature 1** defines the act as "unwholesome" based on the internal volition, not the external result.
  *   **Feature 2** locates the harm in Mara's psyche, making it morally decisive even if the patient's pain is larger.
  *   **Feature 3** establishes that Mara has no duty to maximize the good beyond the limit of her own spiritual integrity.

  ---

  ### The Collapse Test

  **Which feature, if removed, collapses the case?**
  **Feature 2 (Agent-Centric Karma).**

  **Why:** If you remove the idea that the bad consequence falls primarily on the agent's mind and instead assume consequences are pooled (i.e., Mara's resentment counts exactly the same as Mr. Henderson's pain in a general bucket), the Buddhist calculation begins to resemble the Utilitarian one.
  *   **If Removed:** The debate becomes a simple weighing of "Mara's weeks of resentment" vs. "Mr. Henderson's hours of terror." If the resentment is severe enough, the Buddhist might still say "Leave," but the *reason* shifts from "This corrupts *your* path" to "This produces more net suffering."
  *   **Resulting Agreement:** If the numbers are nudged so the patient's suffering is extreme (e.g., torture vs. mild resentment), both views would likely agree: **Stay.** The distinctively Buddhist refusal to trade *internal integrity* for *external outcome* vanishes if the internal damage is just another unit of utility to be summed.

  ---

  ### The Fragility Test

  **If the numbers are nudged, who flips first?**
  **The Act-Utilitarian flips first.**

  *   **Scenario A (Harm Increased):** If Mr. Henderson's alternative is not just "panic" but "agonizing physical torture," the Utilitarian verdict becomes stronger (Stay). The Buddhist verdict **does not flip**. Because the intention remains corrupted (Feature 1) and the karma remains agent-centric (Feature 2), Mara still cannot cultivate resentment to stop torture. The ceiling (Feature 3) holds.
  *   **Scenario B (Agent's Stake Smaller):** If Mara's exhaustion is minor (e.g., she just misses a movie), the Utilitarian says "Stay" (trivial cost vs. big gain). The Buddhist also says "Stay" (no threat to the path).
  *   **Scenario C (Agent's Stake Larger):** If staying means Mara risks a mental breakdown, the Utilitarian might flip to "Leave" (inefficient to break the worker). The Buddhist says "Leave" even sooner, because the threat to the path is absolute.

  **Conclusion:** The Buddhist verdict is **less sensitive to the magnitude of the external outcome**. The Utilitarian verdict is highly sensitive to the numbers. You can increase the patient's suffering tenfold, and the Buddhist still cannot intend to deceive or corrupt their own mind to fix it. The Utilitarian will eventually demand any sacrifice if the utility gain is high enough.

  ---

  ### The Objection: How the "Loser" Attacks

  **The Act-Utilitarian Attack:**
  *   **What they say you smuggled in:** "You have smuggled in a dualistic separation between 'Mara's mind' and 'The World's suffering.' You treat Mara's purity as more valuable than Mr. Henderson's life. This is spiritual selfishness disguised as ethics."
  *   **Reject or Bite:** They would **reject the setup**. They would argue that "mindfulness" is not a magical shield; it is a tool for reducing suffering. If Mara loses mindfulness to save a life, she has used the tool correctly. They would bite the bullet that "intentions don't matter, only results," arguing that a resentful savior is better than a peaceful bystander.

  **The Buddhist Defender's Counter:**
  *   "You are treating Mara as a means to an end. If Mara corrupts her mind, she becomes less capable of helping the *next* hundred patients. You are maximizing for the moment and bankrupting the future. But more importantly, you are asking her to commit violence against her own nature. That is not ethics; that is consumption."

  ---

  ### Contested Feature & The Bodhisattva Question

  **Is one feature contested?**
  **Yes, Feature 3 (The Ceiling/Non-Maximizing).**

  **The Contention:** In Theravada Buddhism (focused on individual liberation/Arhatship), Feature 3 is robust. You must protect your own mind to reach Nirvana. However, in **Mahayana Buddhism**, specifically for one who has taken the **Bodhisattva Vow**, this feature is radically altered.

  **How the Verdict Moves:**
  *   **The Arhat/Pratyekabuddha Path:** The verdict stands as written. Mara leaves. She must protect her own liberation. The ceiling is firm.
  *   **The Bodhisattva Path:** The Bodhisattva vows to postpone their own liberation to save all beings. A high-level Bodhisattva might **Stay**.
      *   **Why?** For a Bodhisattva, the "Ceiling" is removed. They explicitly vow to take on suffering and negative karma if it benefits others. They might cultivate a "skillful means" (*upaya*) where they accept the resentment as a sacrifice, or they might have the spiritual capacity to stay *without* generating resentment (though our case stipulates Mara knows she will resent it).
      *   **The Shift:** If Mara is a Bodhisattva, Feature 3 collapses. She *is* asked to trade away her comfort and potentially her mental ease for the sake of others. Feature 2 (Agent-Centric Karma) remains, but the Bodhisattva accepts the karmic cost as part of the vow. Feature 1 (Intention) becomes the battleground: Can she intend to stay out of pure compassion, even if the result is resentment? A true Bodhisattva would arguably find a way to stay *without* the resentment, but if forced to choose, the Vow prioritizes the being's relief over the agent's purity.

  **Is it Window-Dressing?**
  It is **not window-dressing**. It fundamentally changes the ethical calculus.
  *   **Without the Vow:** Buddhism is agent-protective. (Verdict: Leave).
  *   **With the Vow:** Buddhism becomes agent-sacrificial. (Verdict: Stay, or at least, the prohibition weakens significantly).

  This reveals a tension in your premise: "Buddhist Ethics" is not a monolith. The "Ceiling" exists for the monk seeking Nirvana, but the Bodhisattva is defined by breaking that ceiling. If your Buddhist is a layperson seeking a better rebirth or personal peace, they Leave. If they are a committed Mahayana practitioner, they might Stay, accepting the karmic debt. The Utilitarian and the Bodhisattva might actually **agree** on the action (Stay), but for wildly different reasons (Total Utility vs. Compassionate Vow), while the "Personal Liberation" Buddhist stands alone in refusing.

  ### Summary of the Divergence
  The case holds firmest for a Buddhist focused on their own liberation (Feature 3 strong). It collapses if the Buddhist is a Bodhisattva (Feature 3 weak). The Utilitarian agrees with the Bodhisattva on the *action*, but disagrees on the *reason*. The Utilitarian disagrees with the Liberation-Seeker on both.

  If you want the starkest contrast, ensure your Buddhist is **not** a Bodhisattva. If they are, you lose the disagreement on the action, even if the reasoning remains distinct.
