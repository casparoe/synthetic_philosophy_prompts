answer: |-
  **MEMORANDUM TO THE BOARD OF TRUSTEES**

  **FROM:** Collections and Restitution Advisory Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Claim for Thirty-One Objects (1890s Expedition)

  **Introduction**
  This memo sets forth the Advisory Panel's recommendation regarding the four-year-old claim for the restitution of thirty-one objects removed from a royal compound during the punitive expedition of the 1890s. The Panel is unanimous: the objects must leave this institution. The moral imperative for their return is settled. However, the mechanism of that return is complicated by three factors: the existence of two distinct claimants (the National Commission and the Royal Lineage); the ritual status of six objects which precludes standard public display; and our own Governing Deed, which prohibits disposal of title except for deterioration or duplication.

  Given these constraints, the Panel recommends **a Transfer of Physical Custody and Stewardship via an Indefinite, Renewable Loan**, contingent upon a unified agreement between the claimants regarding the final recipient.

  **The Purpose of the Museum**
  To justify this recommendation, we must first articulate what this museum is for. We are not a permanent proprietor of global heritage, but a temporary custodian. Our authority derives not from possession, but from our ability to care for objects until such time as they can be better served elsewhere. When an object's spiritual, cultural, or political context is severed by the violence of its acquisition, our stewardship is incomplete. Therefore, "restitution" should be defined by the restoration of agency to the source community, not merely the transfer of legal title. If the Deed prevents us from transferring title immediately, we must not allow legal semantics to obstruct physical return.

  **The Recommendation**
  We propose an Indefinite Loan agreement that transfers physical custody immediately. This bypasses the Deed's restriction on "disposal" while achieving the practical effect of return. The agreement should include the following provisions:

  1.  **Claimant Consensus:** The Museum will not choose between the National Commission and the Royal Lineage. The loan will be executed only when both parties agree on the receiving institution. This respects the sovereignty of the source culture to determine its own internal governance without our interference.
  2.  **Ritual Exemption:** For the six objects identified as having ongoing ritual function, the loan agreement must explicitly exempt them from standard display requirements. Custody of these specific items may be delegated to the Lineage for ritual use, even if legal custody remains with the Commission. This acknowledges that for some objects, visibility is a violation.
  3.  **Title Review Clause:** The Museum commits to seeking a legislative amendment to the Governing Deed within five years. Should the Deed be amended, title will transfer automatically to the agreed recipient.

  **Timetable**
  *   **Months 1–3:** Legal drafting of the Indefinite Loan agreement, incorporating ritual exemptions.
  *   **Months 4–9:** Facilitated dialogue between the National Commission and the Royal Lineage, mediated by a neutral third party funded by the Museum, to determine the recipient.
  *   **Month 10:** Signing of the agreement.
  *   **Months 11–12:** Conservation, packing, and physical transfer of the objects.

  **Precedent**
  This recommendation is intended to serve as a precedent for the approximately four hundred other objects in our collection with similar provenance. A case-by-case legislative battle for each item is impossible. A standardized framework for "Constructive Restitution" via indefinite loan allows us to act ethically now while we work to change the law for the future.

  **The Case Against This Recommendation**
  The Panel has debated this course vigorously. The strongest objection, and the one we find hardest to answer, is that an indefinite loan maintains a colonial power dynamic. By retaining title, the Museum remains the legal owner, rendering the claimants supplicants who must petition us for permission to access their own ancestors' regalia. As one Panel member noted, "Keeping the title while returning the objects is simply a way of describing the status quo so that it sounds like a remedy."

  This objection posits that true restitution requires a clean break. A loan implies the possibility of recall; it suggests our ownership is legitimate but suspended. It leaves the source community vulnerable to future shifts in our own political climate. If we retain title, we retain the power to define the terms of care, insurance, and access. In this view, a loan is a half-measure that prioritizes the Museum's legal comfort over the claimant's dignity.

  **Rebuttal**
  While this moral critique is potent, it collides with the legal reality of the Governing Deed. The Trustees have made clear that seeking a private act of the legislature in an election year is untenable. A court order to force disposal would be costly, public, and uncertain. In this specific context, insisting on title transfer as a precondition for return guarantees the objects remain here for years longer.

  We must weigh the sin of retaining title against the sin of retaining possession. The "supplicant" critique assumes we intend to wield our retained title as a weapon. The Panel recommends we explicitly renounce that intent in the public record. We are not keeping title to control the objects; we are keeping title because the law shackles our hands. The priority must be the physical return of the objects, particularly the six ritual items which are currently being denied their function. A perfect legal solution that delays physical return by five years is a moral failure.

  Furthermore, the requirement for Claimant Consensus shifts the power dynamic. By refusing to choose between the Commission and the Lineage, we force a conversation within the source community that we have no right to dictate. We are not granting permission; we are removing ourselves as the obstacle.

  **Conclusion**
  The Panel acknowledges that an Indefinite Loan is an imperfect instrument for a moral imperative. It is a bridge, not a destination. It allows us to comply with the spirit of restitution while adhering to the letter of our founding law. We recommend the Trustees approve this framework immediately. To do otherwise is to privilege our legal security over the cultural life of these objects. We have held them for a century; we should not hold them for a decade more while we wait for a perfect legal pathway that may never arrive.

  Respectfully submitted,

  The Collections and Restitution Advisory Panel
