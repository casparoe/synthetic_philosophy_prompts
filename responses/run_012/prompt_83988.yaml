answer: |-
  **The Case**

  State Alpha and State Beta simultaneously invade the neutral Republic of Gamma to seize its mineral deposits. Neither state has a historical claim to the territory, and the Gamma population opposes both occupiers. The invasion is unprovoked by Gamma; both Alpha and Beta initiate firepower solely to secure their respective zones of occupation. Thus, both states wage aggressive war without just cause, and their soldiers pose objectively unjust threats to one another and to the locals.

  Alpha is a signatory to the International Combatant Convention; Beta is not. Both deploy regular state armies of comparable size, discipline, and weaponry, adhering to identical internal rules of engagement. There are no mercenaries, autonomous systems, or differences in conduct during the fighting. The only structural difference between the forces is Alpha's authority's membership in the Convention and Beta's exclusion from it.

  ***

  **(a) Derivation of Verdicts**

  **Liability View:** The view stipulates that permission mirrors liability, and liability attaches to anyone responsible for an objectively unjust threat. Condition (i) establishes that both Alpha and Beta are waging aggressive war without just cause; therefore, the threats posed by their combatants are objectively unjust. Condition (v) establishes they are ordinary agents, not mere instruments, satisfying the responsibility requirement. Since both sides pose unjust threats, both sides are liable. Since permission mirrors liability, both sides are permitted to kill. The verdict is symmetrical.

  **Licence View:** The view stipulates that permission derives from reciprocal convention, not liability. Parties to the convention grant one another licence; non-parties lie outside it, may be killed by parties, but hold no licence themselves. Condition (iv) establishes Alpha is a party and Beta is not. Therefore, Alpha's combatants hold a licence to kill Beta's combatants (who are outside the convention). Beta's combatants hold no licence to kill Alpha's combatants (who are parties). The verdict is asymmetrical.

  **(b) Working Features and Counterfactuals**

  **Liability View:** The feature doing the work is the **objective justice of the cause**. Liability tracks the moral status of the threat. If one side were given a just cause (e.g., defending Gamma), that side's threat would be just, removing their liability. The verdict would become asymmetrical: the just side would be permitted to kill, the unjust side would not.

  **Licence View:** The feature doing the work is **conventional standing**. Permission tracks membership status. If both authorities were parties to the convention, the licence would be reciprocal. The verdict would become symmetrical: both sides would be permitted to kill. The justice of the cause is irrelevant to this view's derivation.

  **(c) Moral Equality of Combatants**

  This case shows that the moral equality of combatants is not a single thesis but two distinct claims: equal liability and equal permission. These can come apart. Under the Licence View, both sides are equally liable (both pose unjust threats) but unequally permitted (due to convention status).

  The case reverses the usual theoretical roles. The Liability View (typically associated with revisionist asymmetry) yields equality here because both sides are equally unjust. The Licence View (typically associated with traditionalist symmetry) yields inequality here because standing is unequal. The reversal is produced because the Liability View is sensitive to the *moral* symmetry of the situation (both aggressors), while the Licence View is sensitive to the *legal* asymmetry of the situation (signatory vs. non-signatory).

  **(d) Objections**

  **Licence View Objection:** Beta's combatants retain a natural right of self-defence that no convention can waive. If Alpha attacks Beta, Beta should be permitted to defend themselves regardless of treaty status. Denying permission to kill in self-defence solely due to bureaucratic non-membership seems to violate inalienable rights.

  **Liability View Objection:** In a case of mutual wrongdoing, neither side should be *permitted* to kill. While both are liable, permission should not arise from mutual injustice; the verdict should be that both are prohibited from fighting (a "thieves' quarrel" where neither has right).

  **Assessment:** The objection to the Licence View is harder to answer. It challenges the view's core claim that convention overrides natural rights. The Liability View objection can be met by insisting that liability *constitutes* permission in this framework, whereas the Licence View must explain why a soldier under fire loses the right to return fire simply because their state failed to sign a treaty.
