prompt: |-
  I run a small mutual-aid thing in my neighborhood — about forty of us chip in, we end up with maybe $600 a month, and me and two other people decide who gets it. Usually $50–$200 to one person for one specific thing: a car repair so somebody can keep their job, a deposit, meds, sometimes just groceries. Nobody's getting rich and it's rarely life or death, but people get really upset about the calls, and honestly I don't have a good answer for why we gave it to one person and not another.

  The three of us keep having the same fight without knowing we're having it. My one friend says give it to whoever it helps the most, period — if $200 pulls one person out of a hole and barely registers for someone else, that's where it goes. My other friend says that's not fair, we should just be giving everyone the same, or at least treat people alike unless there's a real reason not to. And I keep feeling like they're both missing something — that what actually matters is whether the money leaves the person more able to do the things a person should be able to do: get around, be healthy, not be humiliated, take part in stuff. Two people can get the same $200 and one ends up way more able to live their life than the other.

  I want a procedure we can actually run every month — something I could hand to a new volunteer. Not an essay. The questions to ask in order, what counts as a good enough answer to each, when the process says no or "not this month," and — this is the part I care about — where it stops being about facts and turns into a judgement call one of us just has to make and own. And dont tell me to just make it equal, because I've noticed "equal" can mean making everyone worse off in the name of nobody being ahead.

  It has to handle the cases that actually come up, which are the annoying ones: the guy who's bad with money and will probably waste it; the woman who's been poor so long she's stopped asking for anything bigger, so on paper she never seems to "need" much; someone who'd get more out of it than anyone, but partly because they have expensive taste in general and always have; and the case where giving one person a lot helps them enormously while spreading it thin does almost nothing for anyone — except picking a favorite feels wrong.

  Then run it on three real ones: (1) the car repair for someone who'll lose their job without it, (2) a deposit so someone can leave a bad living situation, and (3) someone asking for money for a hobby-ish thing that would genuinely make their life better but nobody would die without. If the procedure gives an answer I won't like on one of these, say so and don't soften it. And tell me what the procedure just cant decide — the parts where I'm kidding myself if I think there's a right answer.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and the Problem:**
      *   **Context:** Small neighborhood mutual aid fund (~40 people, ~$600/month).
      *   **Decision Makers:** User + 2 friends (3 total).
      *   **Conflict:** Friend A (Utilitarian: max impact), Friend B (Egalitarian: fairness/equality), User (Capabilities Approach: enabling functionings/dignity).
      *   **Goal:** A concrete, repeatable procedure (checklist/flowchart style) for monthly allocation.
      *   **Constraints:** Not an essay. Must handle edge cases (bad money management, learned helplessness, expensive tastes, lump sum vs. spread thin). Must identify where judgment calls are unavoidable. Must run three specific test cases. Must be honest about limitations.
      *   **Tone:** Practical, direct, empathetic but firm, acknowledging the moral weight without getting bogged down in theory.

  2.  **Deconstruct the Philosophical Tensions:**
      *   *Utilitarianism (Friend A):* Maximize total welfare. Risk: Ignoring fairness, punishing those with higher needs thresholds.
      *   *Egalitarianism (Friend B):* Equal treatment. Risk: "Leveling down" (making everyone worse off to ensure equality), ignoring specific needs.
      *   *Capabilities Approach (User):* Focus on what people are actually able to *do* and *be*. This aligns best with the user's intuition ("able to do the things a person should be able to do").
      *   *Synthesis:* The procedure needs to prioritize *restoring capability* (User) while using *impact* (Friend A) as a tiebreaker, but maintaining a *baseline of dignity/fairness* (Friend B) to prevent favoritism.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental):* Ask if they need it. Ask if it helps. Ask if it's fair. -> *Too vague.*
      *   *Attempt 2 (Mental):* Score each application 1-10 on need and impact. Highest score wins. -> *Too bureaucratic, ignores the "bad money management" edge case.*
      *   *Attempt 3 (Aligned with User's "Capabilities" view):* Focus on "Functioning." Does this money restore a specific function? Is it sustainable?
      *   *Refining the Steps:*
          1.  **Eligibility:** Is this a "capability" need? (Filters out pure luxuries).
          2.  **Effectiveness:** Will the money actually solve the problem? (Filters out bad money management/ineffective spending).
          3.  **Impact:** How much does this change their life? (Friend A's point).
          4.  **Fairness/Rotation:** Have we helped them before? Are we ignoring others? (Friend B's point).
          5.  **The Judgment Call:** Where the math stops.

      *   *Addressing Edge Cases:*
          *   *Bad with money:* Needs a "Effectiveness" filter (will it actually fix the issue?).
          *   *Learned helplessness (asks for little):* Needs a "Capability" filter (are we funding survival or thriving? Don't penalize low asks).
          *   *Expensive taste:* Needs a "Reasonableness" filter (standard cost vs. premium cost).
          *   *Lump sum vs. spread thin:* Needs an "Impact Threshold" (if $600 split 4 ways does nothing, give $600 to 1 person).

  4.  **Finalizing the Procedure Structure:**
      *   Name it something neutral (e.g., "The Capability & Stability Protocol").
      *   Use clear Yes/No gates.
      *   Define the "Judgment Zone" explicitly.
      *   Include the "Hard Truths" section about what the procedure can't solve.

  5.  **Running the Test Cases:**
      *   *Case 1 (Car Repair/Job):* High capability impact (work), high effectiveness (fix car = drive). Likely Yes.
      *   *Case 2 (Deposit/Housing):* High capability impact (safety/stability), high effectiveness. Likely Yes.
      *   *Case 3 (Hobby/Wellbeing):* Lower capability priority (not survival), but valid for mental health. Needs to be weighed against 1 & 2. If funds are low, this is the cut.
      *   *Constraint Check:* The user said "If the procedure gives an answer I won't like on one of these, say so."
          *   *Potential Conflict:* If Case 1 and Case 2 both come up in the same month ($600 total). Car repair might be $400, Deposit might be $600. You can't do both. The procedure needs to force a choice. I need to make sure the procedure doesn't promise to solve scarcity.
          *   *Refinement:* The procedure must acknowledge the budget cap. If total approved requests > $600, ranking is needed.
          *   *Case 3:* A hobby might get rejected if it competes with survival needs, even if it improves life. I need to be honest that this procedure *will* likely deprioritize Case 3 in favor of 1 or 2, which might feel harsh but is necessary for the "capabilities" framework (basic functioning vs. enhancement).

  6.  **Addressing the "Judgment Call" Aspect:**
      *   The user wants to know *where* the algorithm ends and the human begins.
      *   This happens at the "Reasonableness" check (expensive taste) and the "Tie-Breaker" (two equally worthy candidates).
      *   Also, the "Bad with Money" case requires a prediction, which is always a judgment call.

  7.  **Drafting the Content (incorporating the "Capabilities Approach" without jargon):**
      *   Instead of "Capabilities," use "Functioning" or "Ability to Act."
      *   Ensure the "Equal" trap is avoided (explicitly state that equal splits are forbidden if they render funds useless).

  8.  **Review against Constraints:**
      *   *Not an essay?* Keep intro/outro brief. Use lists.
      *   *Hand to a volunteer?* Clear steps.
      *   *Handle edge cases?* Build specific questions for them.
      *   *Run the 3 cases?* Do this at the end.
      *   *Tell me what it can't decide?* Add a "The Void" section.

  9.  **Final Polish:**
      *   Make sure the tone is respectful of the emotional labor involved.
      *   Ensure the distinction between "Need" and "Impact" is clear.
      *   *Self-Correction on Case 3:* The user said "nobody would die without." The procedure should likely flag this as "Tier 2" funding. If Tier 1 exists, Tier 2 waits. I need to be clear that the procedure *will* likely say no to Case 3 if 1 or 2 are present. That might be the "answer I won't like." I will highlight this.

  10. **Finalizing the "Judgment Call" location:** It's crucial to pinpoint exactly where the spreadsheet stops. It's usually in assessing *trust* and *reasonableness*.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the procedure. It is designed to prioritize **capability** (what you described as being "able to do the things a person should be able to do") while using **impact** and **fairness** as tiebreakers. It explicitly forbids equal splitting if the amount becomes useless.

  ### The Allocation Protocol

  **Budget:** $600/month (approx.)
  **Decision Body:** 3 Coordinators
  **Goal:** Restore specific human functionings (work, health, safety, dignity).

  #### Step 1: The Capability Filter (Yes/No)
  *Ask: Does this expense restore or maintain a basic functioning that is currently broken or at risk?*
  *   **Valid:** Transport to work, essential meds, housing stability, essential utilities, replacing broken essential tools.
  *   **Invalid:** Debt repayment (unless it stops eviction), luxury upgrades, recurring subscriptions, cash without a stated purpose.
  *   **Edge Case (Learned Helplessness):** If the request is small ($20) but the person actually needs $200 to fix the root cause, the Coordinators must propose the larger amount. Do not reward low-asking with low-giving if the need is high.
  *   **Edge Case (Expensive Taste):** If the need is valid (e.g., glasses) but the cost is premium (e.g., designer frames), fund the *standard* cost of the function, not the preference.
  *   **Result:** If **No**, reject. If **Yes**, proceed to Step 2.

  #### Step 2: The Effectiveness Check (Yes/No)
  *Ask: Is there a reasonable guarantee this money solves the problem, or will it be absorbed by the hole?*
  *   **The "Bad with Money" Test:** Does the person have a plan? If it's a car repair, is there a mechanic quote? If it's groceries, is it a gift card or direct pay?
  *   **Rule:** If the person has a history of using aid for non-essentials, funding must be **direct pay** (paid to the mechanic/landlord), not cash. If they refuse direct pay, the answer is **No**.
  *   **Result:** If **No**, reject. If **Yes**, proceed to Step 3.

  #### Step 3: The Impact Score (1–5)
  *Rate how much this specific grant changes their trajectory for the next 30 days.*
  *   **1 (Marginal):** Life is slightly easier, but instability remains.
  *   **3 (Stabilizing):** A crisis is averted; they can function normally for a month.
  *   **5 (Transformative):** A barrier is removed permanently or for a long duration (e.g., deposit secures housing for a year).
  *   **Note:** A $200 grant can be a 5 for one person and a 1 for another. Score the *outcome*, not the *amount*.

  #### Step 4: The Scarcity Sort
  *Add up the requested amounts for all "Yes" applications from Steps 1 & 2.*
  *   **If Total < $600:** Fund all approved requests. Save the remainder for next month (do not split it).
  *   **If Total > $600:** Rank by **Impact Score** (Step 3). Highest score gets funded first.
  *   **The "Lump Sum" Rule:** If funding the top request uses $500, do **not** split the remaining $100 among the others if $100 is ineffective for them. Carry the $100 over. It is better to fully solve one person's problem than to partially annoy four people.

  #### Step 5: The Fairness Check (The "Veto")
  *Before finalizing, look at the list of recipients over the last 6 months.*
  *   **Question:** Has one person received aid 3+ times while others with similar scores got nothing?
  *   **Action:** If yes, the Coordinators must discuss if the repeat recipient has a systemic issue the fund cannot fix. If so, cap them to allow others a turn, *unless* their Impact Score is a 5 and others are 3s.
  *   **Rule:** Fairness does not override urgent capability loss, but it prevents dependency on the fund.

  ---

  ### Where the Procedure Stops (The Judgment Call)
  This is the part you have to own. The procedure cannot calculate these. One Coordinator must speak for the decision.

  1.  **The "Reasonableness" Call:** Step 1 (Expensive Taste). Deciding the difference between "needs quality meds" and "needs brand name meds" is subjective.
  2.  **The "Trust" Call:** Step 2 (Bad with Money). Deciding if someone is "unable" vs. "unwilling" to manage funds requires intuition.
  3.  **The "Tie" Call:** Step 4 (Scarcity). If two people both have an Impact Score of 5, and you can only afford one, the math stops. You must choose based on who is more vulnerable to *humiliation* or *exclusion*. This is a moral choice, not a math one.

  ---

  ### Running the Test Cases

  Here is how the protocol handles your three scenarios.

  **Case 1: Car Repair (Keep Job)**
  *   **Step 1 (Capability):** Yes. Transport for work is a basic functioning.
  *   **Step 2 (Effectiveness):** Yes, assuming a mechanic quote is provided. Direct pay preferred.
  *   **Step 3 (Impact):** Score 5. Losing a job is catastrophic; keeping it is transformative.
  *   **Step 4 (Scarcity):** High priority.
  *   **Verdict:** **Fund.**
  *   **Why you might dislike this:** If the car breaks down again in two months, you are funding the same hole. The procedure accepts this risk because the immediate capability loss (unemployment) is too high to ignore.

  **Case 2: Housing Deposit (Leave Bad Situation)**
  *   **Step 1 (Capability):** Yes. Safety and stability are basic functionings.
  *   **Step 2 (Effectiveness):** Yes, if paid directly to the landlord.
  *   **Step 3 (Impact):** Score 5. Secures housing for a year+.
  *   **Step 4 (Scarcity):** High priority.
  *   **Verdict:** **Fund.**
  *   **Conflict:** If Case 1 and Case 2 happen in the same month, you have ~$600. A repair might be $400; a deposit might be $1,200 (or at least $600).
      *   *If the deposit is $600 exactly:* You must choose between Case 1 and Case 2. Both are Score 5.
      *   *The Judgment Call:* You must decide whose crisis is more immediate. Is the job loss tomorrow? Is the eviction tomorrow? The procedure **cannot** decide this. You have to pick one and carry the other over, or deny one. This will feel terrible.

  **Case 3: Hobby/Wellbeing (Life Better, Nobody Dies)**
  *   **Step 1 (Capability):** **Borderline.**
      *   *Protocol Interpretation:* "Things a person should be able to do" includes "take part in stuff." However, compared to Work (Case 1) and Housing (Case 2), this is Tier 2.
      *   *Verdict:* **Fund ONLY if no Tier 1 requests exist that month.**
  *   **Why you might dislike this:** You said this "genuinely makes their life better." The procedure will likely reject this 9 months out of 12 because Case 1 or 2 types usually exist.
  *   **The Hard Truth:** If you fund Case 3 while Case 1 is waiting, you are violating your own "Capabilities" priority. You are choosing "happiness" over "functioning." The procedure forces you to admit that with $600, you are a safety net, not a quality-of-life grant. If you want to fund Case 3, you must raise the budget.

  ---

  ### What The Procedure Can't Decide (The Void)

  Do not kid yourself that this system removes the burden. It clarifies where the burden lies.

  1.  **Systemic Failure:** The procedure cannot fix the guy who is bad with money. It can only protect the fund from him. You will feel like you are abandoning him. You are. The fund is too small to fix financial illiteracy.
  2.  **The "Deserving" Poor:** The woman who asks for less because she's learned to need less (Case: Learned Helplessness). Step 1 tries to catch this, but only if you *know* her real need. If she hides her need, the procedure will underfund her. You have to do the outreach work to find the real number; the spreadsheet won't do it.
  3.  **The Favorite:** When two people have equal Impact Scores (Step 4 Tie), you will pick the one you like more, or the one who articulates their need better. The procedure calls this a "Judgment Call," but in reality, it's bias. You have to admit that when the math is equal, your personal preference decides.
  4.  **Scarcity:** If Case 1 and Case 2 both show up in the same month, one gets denied. The procedure ranks them, but if they are equal, it offers no answer. You will lose sleep here. No system fixes the fact that $600 is not enough.

  **Final Instruction:** Print this. When you fight, point to the Step. If you are arguing about Step 3 (Impact), you are arguing about facts. If you are arguing after Step 5, you are arguing about values. Admit which one it is.
