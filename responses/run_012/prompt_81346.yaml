      3.  Residue Report:
          *   Structure (Dynamic/Flow vs. Static/Relations).
          *   Theory Change (Scale vs. Truth).
          *   Relata (Hilbert Space necessity vs. Relations without Relata).
      4.  Verdict on Redundancy/Defect.

