answer: |-
  The "no body can transfer" argument establishes a substantive natural law constraint on legislative content that operates independently of consent, ruling out arbitrary destruction of property rather than requiring unanimous individual approval for taxation.

  To understand the work this passage is doing, we must distinguish between three rival interpretations of the transfer limitation. First, a **Transactional/Authorization Reading** suggests the constraint is purely procedural: because an individual cannot validly consent to their own destruction, any contract clause attempting to authorize such destruction is void *ab initio*. Second, a **Teleological/Functional Reading** argues that power is defined by its end; since the end of government is preservation, any act destroying preservation is not an exercise of power but a dissolution of it, regardless of what was transferred. Third, a **Natural Law/Substantive Reading** posits that the limitation is ontological and moral: individuals are bound by objective natural law not to destroy themselves or others, and since the legislature inherits only the power individuals possessed, it inherits this moral bondage.

  The text best supports the **Natural Law/Substantive Reading**. Locke's phrase "nor can possibly be absolutely arbitrary" indicates an impossibility grounded in the nature of power itself, not merely a invalidity of contract terms. When Locke writes that "no body has an absolute arbitrary power over himself," he is invoking the Law of Nature which governs the state of nature (II, §6), where reason teaches that no one ought to harm another in life, health, liberty, or possessions. The transfer argument demonstrates that the legislature stands in the shoes of the individuals; it does not transcend the moral law that bound them. Therefore, the legislature is not just contractually limited but morally incapable of wielding arbitrary power, because such power never existed to be transferred.

  This reading dictates specific implications for taxation. Regarding consent, the constraint does not require every individual's actual consent for every tax levy, which would render government impossible; rather, it requires that the *system* of taxation be authorized by the majority or their representatives, as Locke clarifies in §140. The "no transfer" limit rules out taxation that is *arbitrary* (extemporary decrees by prerogative) rather than taxation that lacks unanimous consent. Regarding "designedly to impoverish," this prohibits confiscatory measures that destroy the subject's means of preservation or subsistence, but it does not block progressive redistribution aimed at the "public good." Locke defines property broadly as "Life, Liberty, and Estate" (§123), and the purpose of government is the preservation of this property; if taxation regulates estate to preserve the whole society (e.g., funding defense or poor relief necessary for stability), it serves the end of preservation. The prohibition targets *designed* impoverishment—malicious or arbitrary destruction—not regulated contribution to the common charge.

  To settle disagreements on these points, you must consult **Section 140**, which explicitly addresses taxation ("it must be with his own Consent, i.e., the Consent of the Majority, giving it either by themselves, or their Representatives"), and **Section 137**, which forbids governing by "extemporary Decrees" rather than "promulgated standing Laws." Additionally, **Section 171** outlines the dissolution of government when legislators act contrary to their trust, such as taking property without consent, confirming that such acts are ultra vires. My reading would change if textual evidence in the *Essays on the Law of Nature* or a closer reading of §140 demonstrated that Locke views property rights as absolute negative liberties immune to any majority regulation, or if "public good" were defined strictly as aggregate utility allowing unlimited redistribution; however, Locke's consistent emphasis on "preservation" as the telos of property rights supports the substantive natural law constraint.
