prompt: |-
  I'm a third-year student in a seminar on moral philosophy, and this week we read the article of the Summa in which Aquinas asks whether it is lawful to kill a man in self-defense. I follow the conclusion but the middle of the argument defeats me. Here is the passage:

  "Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention. … Accordingly, the act of self-defense may have two effects: one, the saving of one's life; the other, the slaying of the aggressor. … Therefore, this act, since one's intention is to save one's own life, is not unlawful, seeing that it is natural to everything to keep itself in being as far as possible. And yet, though proceeding from a good intention, an act may be rendered unlawful if it be out of proportion to the end. Wherefore, if a man in self-defense uses more than necessary violence, it will be unlawful, whereas, if he repel force with moderation, his defense will be lawful."

  My trouble is this. The later tradition distilled a condition out of this very passage — that the good effect must not be produced by means of the bad one — and yet in the example the saving of the life seems to run through the aggressor's death: I am alive because he is dead or disabled. So either Aquinas is not stating that condition here at all and has been read anachronistically, or the example is carried by something other than the side-effect structure — perhaps by the thought that a private person has no authority over life, so that what he may intend is fixed in advance by his station rather than by the causal shape of what he does.

  Please don't simply explain the doctrine of double effect to me; I have read the standard accounts. Help me read this passage. Structure your answer as follows: (1) "The argumentative job" — about 100 words on what the three sentences are doing within the article, including why the proportionality sentence arrives after the conclusion rather than before it; (2) "Where the difficulty actually is" — 100–150 words pinning down the precise point of strain, keeping the causal worry separate from the intention worry; (3) "Reading one: side effect" — about 200 words developing the reading on which Aquinas is stating a side-effect condition, and saying what it must do with the proportionality sentence in order to survive; (4) "Reading two: authority" — about 200 words developing the reading on which the private person's lack of authority over life does the work, and saying what it must do with the "two effects" sentence in order to survive; (5) "Which reading the article better supports" — 150 words, taking a side and naming the one feature of the surrounding discussion that would most embarrass the other reading; (6) "My hypothesis" — 100 words assessing my suggestion that the authority reading is the right one, and telling me what I have got wrong. No citations or reading lists, please — I want to see the argument.
