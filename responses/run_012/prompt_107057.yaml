  (1) "The argumentative job"
  The passage performs three moves. First, it establishes a metaphysical principle: single acts yield multiple effects. Second, it applies this to self-defense, distinguishing survival (intended) from slaying (unintended). Third, it draws a provisional conclusion, then qualifies it. The proportionality sentence arrives after the conclusion because the initial verdict establishes the *licitness of the act type*. It specifies execution conditions required to maintain licitness. This shifts from defining the moral object to regulating the manner of acting. Permission relies on intention; limitation relies on external measure.

  (2) "Where the difficulty actually is"
  The strain lies in conflating causal dependency with intentional structure. You worry that survival is causally dependent on the aggressor's death, making death a means. Aquinas, however, is tracking the *object of the will*, not the physics of survival. The difficulty is that later tradition reads "beside the intention" as "not causally instrumental." Aquinas only requires that the death not be *chosen* as an end or means. The tension arises because if death is causally necessary, can it truly be unintended? The text separates the act's moral species (defense) from its physical outcome (death), but your worry highlights that the physical outcome seems constitutive of the success condition.

  (3) "Reading one: side effect"
  On the side-effect reading, Aquinas is distinguishing the act's description. The act is "repelling force," not "killing." The death is a foreseen consequence of repelling, not the method of repelling. To survive the causal worry, this reading must insist that the *stopping of the attack* is the means to safety, not the *death*. The aggressor might stop without dying; death is merely a risked side effect of the force used. The proportionality sentence supports this by limiting the force. If violence is excessive, the act description shifts from "repelling" to "punishing" or "killing," making death intended or the act disproportionate. Thus, proportionality preserves the side-effect structure by ensuring the act remains defensive rather than executory. The death remains outside the intention because the force used was only what was needed to stop, not to kill. This reading relies on the agent describing the act narrowly enough that death is not the chosen instrument.

  (4) "Reading two: authority"
  On the authority reading, the work is done by the agent's status. A private person lacks jurisdiction over life, so they cannot intend death as a judicial act. The "two effects" sentence survives by explaining how a private agent can interact with death licitly: by restricting their intention to self-preservation, which is a natural right, rather than justice, which is a public right. The death is "beside the intention" because the private agent has no authority to intend it. Proportionality fits here as the boundary of private power. Moderate force is within private rights; excessive force usurps public authority. Thus, the text isn't primarily about causal structure but about moral licensing. The two effects language describes the permissible scope of private action, not merely the psychology of the agent. It allows the physical event of death to occur without the agent claiming the authority required to intend it.

  (5) "Which reading the article better supports"
  The article better supports the authority reading. The surrounding Question concerns who may kill (public authority vs. private). The side-effect reading struggles with the fact that Aquinas never explicitly articulates the "means" condition found in later DDE formulations; he only speaks of intention. The most embarrassing feature for the side-effect reading is Aquinas's insistence on moderation. If the logic were purely causal-side-effect, proportionality would be secondary. But for Aquinas, using more than necessary violence makes the act unlawful *even if* death wasn't intended, because it exceeds private authority. The authority reading explains why intention alone is insufficient without the constraint of status-based proportionality.

  (6) "My hypothesis"
  Your hypothesis is substantially correct but slightly too exclusive. Authority is the foundational reason intention must be restricted; without public status, intending death is usurpation. However, you are wrong to suggest the "two effects" structure is merely decorative. It provides the metaphysical mechanism by which the authority constraint is satisfied. Authority dictates *what* you may intend; the two-effects logic explains *how* an act involving death can occur without intending it. You identified the ground but underestimated the intention distinction's structural role.
