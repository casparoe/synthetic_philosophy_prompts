answer: |-
  At the launch of "Vicarious Virtue LLC," a reporter asks the CEO, a strict deontologist, how they justify facilitating violations.

  "We don't facilitate," she says. "Constraints bind the agent, not the outcome. If I kill, I violate a duty. If I hire a contractor to kill, *he* violates the duty, and I respect mine."

  "But isn't hiring him using him as a means?"

  "No, he's a willing agent. He chooses the sin; I choose the salary."

  "So you profit from immorality?"

  "We profit from duty-fulfillment. Once the job is done, I fire him for violating the constraint. Thus, the client gets the outcome, my hands are clean, and justice is served."

  "That's the business model?"

  "Yes. I can't kill to save lives. But I can hire a killer to save lives, then punish him for killing. It's not a paradox; it's HR."

  ***

  **Note:** The joke assumes agent-relative constraints do not entail complicity—a contested view. Many deontologists argue that intending or hiring someone to violate a constraint makes you responsible for the violation, negating the "clean hands" claim. It also treats constraints as absolute and non-aggregative; threshold deontologists deny this, permitting violations to prevent catastrophic outcomes. Additionally, using a contractor to secure your own moral purity may itself treat them as a mere means. While the paradox's structure (agent-relativity vs. outcome) is standard, the coherence of "outsourcing" sin without moral residue is a live disagreement in normative theory.
