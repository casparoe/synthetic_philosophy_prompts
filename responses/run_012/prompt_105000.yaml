      *   *Core Problem:* $N$ agents can take action $A$. Value $V$ depends on number of actors $k$. Often, $V(k)$ is negative for small $k$ (e.g., releasing a dangerous pathogen, publishing sensitive info) and positive for large $k$, or simply the marginal value decreases sharply. The "Curse" arises when agents act on private signal $s_i$ without accounting for the fact that if *they* are willing to act, others likely are too (selection effect), leading to over-activation.
      *   *Key Tension:* Individual rationality vs. Group rationality.
      *   *The "Mirror Case":* Sometimes the status quo is bad, and *everyone waiting* is the problem (e.g., voting, adopting a new safety standard). This is often called the "Pluralistic Ignorance" or "Coordination Failure" side of the same coin.

