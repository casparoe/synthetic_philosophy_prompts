answer: |-
  # The Unilateralist's Curse Decision Tree

  **Root Commitment:** You are an agent considering action $A$. You believe $A$ has positive expected value (EV) based on your private judgment. You know there are $N$ other agents who *could* also take $A$ independently, and the total social value depends on how many of you act.

  ---

  ### Node 1: Coordination Feasibility
  **Question:** Is it feasible to cheaply communicate with, or observe the intentions of, the other potential actors *before* you commit to the action?
  *   **Yes:** $\rightarrow$ **Leaf: Wait-and-Coordinate**
      *   *Rationale:* The curse is a coordination failure. If coordination is cheap, the problem dissolves into a standard bargaining or consensus game.
  *   **No:** $\rightarrow$ Go to **Node 2**.

  ### Node 2: Payoff Structure
  **Question:** Is the primary social risk that *too many* people act (threshold/negative externality), or that *too few* people act (public good/under-supply)?
  *   **Too Few (Under-Supply):** $\rightarrow$ **Leaf: Mirror Case**
      *   *Position:* Inaction is the unilateral move. The aggregation problem works in reverse (pluralistic ignorance); you should act to signal that the coast is clear.
  *   **Additive/Neutral:** $\rightarrow$ **Leaf: Act-if-Own-EV-Positive**
      *   *Position:* Standard externalities apply, but the specific "curse" logic does not. Act if your private calculation says go.
  *   **Too Many (Over-Action):** $\rightarrow$ Go to **Node 3**.

  ### Node 3: Information Asymmetry
  **Question:** Do you possess credible, specific information suggesting $A$ is beneficial that you expect most other potential actors *lack*?
  *   **Yes:** $\rightarrow$ **Leaf: Defer-to-Best-Informed**
      *   *Position:* You are the exception. The curse assumes epistemic symmetry; if you are uniquely informed, your action is not evidence that *they* should act (since they don't see what you see).
  *   **No:** $\rightarrow$ Go to **Node 4**.

  ### Node 4: Decision Correlation
  **Question:** If you find yourself willing to act, do you take that as strong evidence that others (with similar reasoning capabilities) are also willing to act?
  *   **No:** $\rightarrow$ **Leaf: Act-if-Own-EV-Positive**
      *   *Position:* You treat other agents as fixed background conditions (Causal Decision Theory style).
      *   *⚠️ Flag:* **Incoherent/Ugly in this context.** If agents are similar and facing the same public information, assuming your decision is independent of theirs is the exact cognitive error that generates the curse. This leaf is reachable via Node 2 (Additive) or Node 4 (No Correlation), but the justification here is usually considered flawed for threshold problems.
  *   **Yes:** $\rightarrow$ Go to **Node 5**.

  ### Node 5: Reversibility
  **Question:** Is the action (or a significant, informative part of it) cheaply reversible?
  *   **Yes:** $\rightarrow$ **Leaf: Probe-First**
      *   *Position:* Take the smallest reversible step. This converts the problem into a coordination/observation game (returning effectively to Node 1).
  *   **No:** $\rightarrow$ Go to **Node 6**.

  ### Node 6: Normative Strictness
  **Question:** Do you adopt a principled heuristic to *never* act in this class of problem without explicit consensus, regardless of calculated conditional EV?
  *   **Yes:** $\rightarrow$ **Leaf: Never-Act-Unilaterally**
      *   *Position:* A deontological constraint. The risk of being the "first domino" in a catastrophic chain is too high to ever calculate live.
  *   **No:** $\rightarrow$ **Leaf: Conformity-Style Rule**
      *   *Position:* Act only if the action still has positive EV *after* you update on the evidence that your willingness provides about others' willingness. (You might still act, but the bar is much higher).

  ---

  ## Map of Leaves & Overlaps

  | Leaf | Reachable Via | Notes |
  | :--- | :--- | :--- |
  | **Wait-and-Coordinate** | Node 1 (Yes) | The ideal solution; bypasses the curse entirely. |
  | **Mirror Case** | Node 2 (Under-Supply) | Addresses the "pluralistic ignorance" variant. |
  | **Act-if-Own-EV-Positive** | Node 2 (Additive) **OR** Node 4 (No) | **Duplicate Leaf.** Reached via different justifications. The Node 4 path is flagged as potentially incoherent for similar agents. |
  | **Defer-to-Best-Informed** | Node 3 (Yes) | Justifies breaking the norm due to epistemic asymmetry. |
  | **Probe-First** | Node 5 (Yes) | A pragmatic middle-ground that lowers the stakes. |
  | **Never-Act-Unilaterally** | Node 6 (Yes) | A hard constraint; common in high-stakes biosecurity/AI contexts. |
  | **Conformity-Style Rule** | Node 6 (No) | The standard Bostromian solution; calculates EV conditional on correlation. |

  ## Flags on Combinations

  *   **Node 4 (No Correlation) + Node 2 (Threshold Risk):**
      *   **Flag:** **Incoherent.** This is the definition of the curse. If you acknowledge the risk is threshold-based (Node 2) but deny your decision correlates with others (Node 4), you are systematically underestimating the probability of the threshold being crossed. This position is rarely held by those who understand the problem, though it is the default mode for unreflective actors.
  *   **Node 5 (Reversible) + Node 6 (Never-Act):**
      *   **Flag:** **Unexplored/Inefficient.** The tree prevents this path (Reversible leads to Probe). A "Never-Act" proponent who admits the action is reversible is usually convinced to "Probe" instead. Holding "Never-Act" here suggests a distrust of the "reversibility" claim itself.
  *   **Node 3 (Info Asymmetry) + Node 6 (Never-Act):**
      *   **Flag:** **Ugly.** If you truly know something others don't (Node 3), a "Never-Act" heuristic (Node 6) wastes your comparative advantage. This combination usually implies you don't *actually* trust your information asymmetry claim.

  ## Usage Note for the Meetup
  When arguing, force each other to traverse the tree. If you land on **Act-if-Own-EV-Positive** via Node 4, the group should challenge the "No Correlation" assumption. If you land on **Never-Act-Unilaterally**, check if **Probe-First** was ruled out honestly or just ignored. If you land on **Mirror Case**, verify that the payoff structure (Node 2) isn't actually a threshold risk in disguise.
