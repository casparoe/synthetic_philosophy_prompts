answer: |-
  Your friend has constructed a powerful critique, and it is one that many modern scholars accept: that Aristotle's doctrine of natural slavery is an *ex post facto* rationalization of an existing institution, dressed up in biological and metaphysical language. However, your friend's specific argument about the "Steerable Man" and the definition of reason misses a crucial nuance in Aristotle's text, even if it lands on the right conclusion.

  There is indeed a third possibility regarding the weakness of the argument. The flaw is not primarily in the descriptive claim (though that is empirically false), nor in the logical coherence of the definition (which is internally consistent). **The real weakness lies in the normative leap from "psychological dependence" to "chattel ownership."**

  Here is a breakdown of how you might reconstruct the debate, correct the misunderstanding about "reason," and locate the actual philosophical vulnerability.

  ### 1. Clarifying the "Lack of Reason"
  Your friend treats reason as a binary switch: you either have it or you don't. Aristotle does not. In *Politics* 1254b22, Aristotle writes that the natural slave "shares in reason enough to perceive it, but not to have it" (*koinonei logou... hos aisthanomenon men, kektēmenon de ou*).

  This is a distinction between **apprehending** reason and **originating** action through reason.
  *   **The Master:** Possesses the deliberative faculty (*to bouleutikon*). He forms the plan.
  *   **The Natural Slave:** Possesses the capacity to understand the plan and execute it, but lacks the capacity to generate the plan for himself.

  Your friend's "Steerable Man" is not a *reductio ad absurdum*; he is actually a precise illustration of Aristotle's definition. The Steerable Man understands instructions (perceives reason) but cannot form a life plan (does not possess reason). Therefore, your friend is incorrect to say the definition is incoherent or empty *by definition*. The concept is coherent.

  The problem, as your friend suspects, is empirical. But Aristotle actually anticipates this. In *Politics* 1255b, Aristotle admits that while Nature *intends* to make the bodies and souls of freemen and slaves distinct, she often fails. He concedes that many actual slaves have the souls of freemen, and many freemen have the souls of slaves.

  So, if Aristotle admits the empirical match is imperfect, why does the doctrine fail? It fails not because the "Steerable Man" is impossible, but because the "Steerable Man" does not warrant the conclusion Aristotle draws.

  ### 2. The Normative Leap (The Real Weakness)
  This is the "third possibility" you are looking for. Let us grant, for the sake of argument, that the "Steerable Man" exists. Let us grant that there are adult humans who can understand commands but cannot deliberate on their own good.

  The critical question is: **Why does this psychological deficiency entail property status?**

  Aristotle moves from a claim about *capacity* (you cannot rule yourself) to a claim about *status* (you are a tool for another). But there is a middle category that Aristotle collapses: **Guardianship.**

  *   **Children:** They cannot deliberate for themselves. They "perceive reason" (they can be taught) but do not "possess" it (they are not yet rational agents).
  *   **The Treatment:** We do not own children. We do not treat them as living tools (*instrumenta vocalia*). We exercise guardianship over them for *their* sake, until they (potentially) develop the capacity to rule themselves.

  If the "Steerable Man" exists, he resembles a permanent child in terms of rational capacity. The Aristotelian weakness is the failure to explain why this permanent incapacity justifies **ownership** rather than **wardship**.

  *   **Ownership (Slavery):** The relationship is for the sake of the *master*. The slave is a tool for the master's flourishing.
  *   **Wardship (Guardianship):** The relationship is for the sake of the *ward*. The guardian rules for the benefit of the ruled.

  Aristotle argues that the slave and master have a "common interest" (1255b), but his own definition of the slave as a "part of the master" (1255b) undermines this. If I am a part of you, like your hand, my good is subsumed entirely by yours. The weakness lies here: even if a human being cannot direct their own life, it does not follow that another human being *owns* them. It might follow that they need protection or guidance, but the jump to "property" is a normative assertion, not a logical deduction from the psychological premise.

  ### 3. The Teleological Framework
  There is a deeper layer to this, which is the "somewhere else" you mentioned. Aristotle's argument relies entirely on a **functionalist metaphysics**.

  Aristotle believes everything has an *ergon* (function). A knife's function is to cut; a slave's function is to use his body to follow orders. If a thing's function is to be used by another, it is a tool. Aristotle classifies the natural slave as a "living tool."

  The doctrine collapses if you reject the idea that human beings can have a "function" assigned by nature in this way.
  *   **Your Friend's View:** Humans are defined by a potentiality for reason that is universal. To say one lacks it is prejudice.
  *   **Aristotle's View:** Humans are defined by their actualization. If one cannot actualize reason, they are functionally distinct from those who can.

  The weakness is that Aristotle conflates **political subordination** with **ontological inferiority**. One can argue that some people need to be ruled (political subordination) without arguing that they are by nature property (ontological inferiority). By making the slave a "part of the master," Aristotle removes the slave's moral standing entirely. The argument fails because it denies the slave's *telos* (end goal) is their own flourishing, whereas even a child's *telos* is their own flourishing.

  ### Summary for Your Reply
  You can tell your friend that he is right about the conclusion but slightly off about the mechanism.

  1.  **On the "Steerable Man":** This figure does not refute the definition; he *is* the definition. The definition is coherent. The "Steerable Man" is psychologically possible (e.g., severe cognitive disability).
  2.  **On the Empirical Claim:** Aristotle admits your friend's point. He concedes that in the real world, nature often fails to produce natural slaves, and most actual slavery is slavery by convention/conquest, which Aristotle admits is unjust if the person is not a natural slave.
  3.  **The Real Weakness:** The argument breaks at the **Normative Leap**. Even if the "Steerable Man" exists, Aristotle provides no justification for why his inability to deliberate makes him **property** rather than a **ward**. The move from "needs guidance" to "is a tool" is where the argument relies on prejudice rather than logic.
  4.  **The "Role Nobody Fills":** It is not that the role is empty; it is that the role describes a psychological condition (dependency) that does not map onto the moral status (chattel) Aristotle assigns to it.

  The doctrine is not empty; it is **categorical**. It mistakes a need for care for a license for ownership. That is where the refutation lies.
