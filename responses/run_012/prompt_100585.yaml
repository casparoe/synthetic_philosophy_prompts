      *   *Function:* The body exists for the soul; the slave's body is for the master's use. The slave's virtue is to obey; the master's is to rule.
      *   *Nuance:* Aristotle admits the empirical mismatch. He says nature *intends* to make them distinct, but often fails (1255b). Some slaves have free souls, some freemen have slave souls.
