answer: |-
  **MEMORANDUM**

  **TO:** Grants and Finance Committee
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Recommendation on Discount Rate Policy for Grant Ranking

  **Recommendation**
  I recommend we adopt the **declining discount rate schedule** proposed by the consultant (3% for years 0–30, 1.5% for years 30–100, 0.25% thereafter). We should codify a mandatory review of this schedule every five years to align with our strategic planning cycle.

  This is not a compromise between the Chair's 4% flat rate and the zero-preference position. It is the only option that accurately reflects the specific risks inherent in a perpetual foundation's charter while remaining fiduciary responsible.

  **The Core Disagreement**
  We are conflating two different questions: *What return can our endowment earn?* and *How do we value future social benefits?*

  The Chair's argument for a flat 4% real rate relies on "fiduciary common sense." This treats our social discount rate as identical to our investment return target. This is a category error. Our investment return ensures the endowment lasts; the discount rate determines how we weigh the welfare of a person in 2100 against a person in 2024. If we use the investment return (4%) as the social discount rate, we effectively decide that a benefit to our great-grandchildren is worth less than 5% of the same benefit to us. For a foundation chartered to help "future generations," this is a breach of mission, not fiduciary duty.

  **Deconstructing the Rate**
  To vote responsibly, we must separate the four components that make up any discount rate. The disagreement arises because we are lumping them together.

  1.  **Pure Time Preference (Ethics):** Do we value a life saved today more than a life saved in 50 years simply because it is sooner?
      *   *The Zero-Preference Trustees* argue this should be zero. Ethically, they are correct. A future person's well-being is not intrinsically less valuable than ours.
      *   *The Chair* implicitly sets this high by using a 4% flat rate.
  2.  **Future Wealth (Growth):** Will future people be richer than us?
      *   If economic growth continues, a dollar of benefit in 2100 provides less *marginal utility* than a dollar today. We should discount based on this.
      *   *The Risk:* We cannot confidently predict growth rates over 150 years. A flat rate assumes we know the growth trajectory of the next century. We do not.
  3.  **Existential Risk (Survival):** Is there a chance the world ends or civilization collapses?
      *   If there is a 1% annual chance of catastrophe, that justifies a 1% discount.
      *   *The Chair's Point:* "Future people might not exist." This is valid, but it is a risk parameter, not a reason to apply a blanket financial penalty.
  4.  **Project Failure:** Will the specific grant fail to deliver?
      *   This should be assessed per grant during due diligence, not baked into the foundation-wide discount rate.

  **Why the Declining Schedule is Principled, Not a "Fudge"**
  The consultant's schedule is often dismissed as a fudge, but it is the mathematically honest response to **uncertainty** regarding components #2 and #3 above.

  When we are uncertain about future growth rates or survival probabilities, the effective discount rate *must* decline over time. A flat 4% assumes we are certain about the future. A zero rate assumes we are certain there is no reason to discount. The declining schedule admits that while we expect growth and face risks in the near term (justifying 3%), our uncertainty compounds over centuries. We cannot rule out stagnation or catastrophe in the long run, nor can we rule out sustained flourishing.

  By adopting a declining schedule, we are not "selling out" the long-termists. We are preserving the possibility that projects with payoffs in 150 years have material value today. Under a 4% flat rate, a project paying off in 150 years is mathematically invisible. Under this schedule, it remains legible.

  **Addressing the "Hidden Ethics" Critique**
  One Trustee rightly noted that formulas "hide ethics in the parameters." This is the strongest objection raised, and I agree with it. Any number we pick is a moral choice.

  *   A 4% flat rate hides the ethical choice that we value the present heavily over the future.
  *   A zero pure time preference hides the ethical assumption that future wealth will definitely grow (via the growth term).
  *   The declining schedule hides the ethical choice to prioritize *uncertainty management*.

  Of these, prioritizing uncertainty management is the most faithful to our vague charter. We do not know what the future needs. We do not know if growth will continue. A declining rate keeps our options open, allowing us to fund near-term resilience and far-term innovation without pre-judging which horizon is more valuable.

  **Implementation and Review**
  We should not use this rate as a rigid "hurdle." A grant with a negative Net Present Value (NPV) at these rates should not be automatically rejected if it addresses existential risk (Component #3), as standard NPV models often fail to capture tail-risk mitigation.

  **Action:**
  1.  Vote to adopt the declining schedule (3% / 1.5% / 0.25%).
  2.  Mandate a review of the schedule in five years.
  3.  Instruct staff that this rate is for *comparative ranking* of standard grants, not a hard veto on high-risk, long-horizon existential safety projects.

  This policy respects the endowment's need for discipline while honoring our commitment to generations we will never meet.
