      *   **Example 2 (Poker/Commitment):** Knowing opponent's hand makes me predictable. Want to commit to forgetting.
          *   *Mechanism:* Strategic interaction (Game Theory). My action affects opponent's action. Knowing constrains my ability to mix strategies or bluff.
          *   *Decision Theory View:* This is about *commitment* and *observability*. In game theory, having more information can reduce equilibrium payoff (e.g., in bargaining or bluffing scenarios).
          *   *Key Concept:* Value of Information in Games vs. Single Agent. The "Never-hurts" theorem is for *single-agent* decision problems.

      *   **Example 3 (Drug Trial/Placebo):** Friend figures out she's on the real drug, efficacy drops.
          *   *Mechanism:* The information changes the *causal structure* of the environment. The act of knowing influences the outcome (self-fulfilling/defeating prophecy).
          *   *Decision Theory View:* Violates the assumption that the state of the world is independent of the agent's knowledge (except via actions). This is reflexive causality.
          *   *Key Concept:* The Observer Effect / Lucas Critique / Self-defeating prophecy.

      *   **Example 4 (Insider Trading):** Info valuable only while exclusive.
          *   *Mechanism:* Value depends on *asymmetry* of information, not the content itself.
          *   *Decision Theory View:* This is about market efficiency and zero-sum (or negative sum) games. The value is in the *edge*, not the truth.
