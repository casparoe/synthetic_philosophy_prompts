answer: |-
  You have stumbled onto one of the most satisfying realizations in decision theory: the "Value of Information is Non-Negative" theorem is a fragile thing. It holds in a vacuum, but the real world is full of air.

  The theorem you are remembering is usually attributed to **I.J. Good (1967)**, building on **Blackwell's Theorem (1951)**. It states that for a rational expected-utility maximizer, the expected value of free information is always non-negative. You should never pay to *avoid* information, and you should never refuse free information.

  You are absolutely correct that your four examples are not the same phenomenon. They look alike because they all result in "regretting knowledge," but they violate **four different assumptions** required for Good's Theorem to hold.

  Here are the seams, broken down by which assumption your examples break.

  ### 1. The Genetic Test (Information Aversion)
  **The Violation:** *Utility is defined over outcomes, not knowledge states.*

  Standard decision theory assumes your utility function $U$ depends on the state of the world (e.g., "I am healthy" vs. "I am sick"). It assumes knowing the state doesn't change $U$ directly; it only changes your *actions* to improve the state.

  In your uncle's case, the knowledge *itself* is an outcome. "Knowing I am at risk" carries a direct negative utility (anxiety) that is not mediated by any decision he can make.
  *   **The Seam:** This is **Information Aversion**. It happens when the signal enters the utility function directly.
  *   **Why the Theorem Fails:** The theorem assumes you can treat information as a tool. If the information is also a burden (a "psychic cost"), the cost can outweigh the decision-making benefit.
  *   **Is it unique?** Yes. This is the only one of your four that is purely a single-agent utility specification error.

  ### 2. The Poker Hand (Strategic Disadvantage / Commitment)
  **The Violation:** *Single-agent decision making.*

  Good's Theorem applies to a single agent against "nature." Poker is a game against an adversary. In Game Theory, information is not always an asset; it can be a liability if it restricts your strategic space.
  *   **The Seam:** This is a **Commitment Problem**. To bluff effectively, you need to be able to credibly represent that you *might* have a bad hand. If you know you have the nuts, you cannot bluff (or rather, your betting pattern becomes deterministic). If your opponent knows you know, they can exploit your determinism.
  *   **Why the Theorem Fails:** In multi-agent settings, having information can shift the Nash Equilibrium to a place that is worse for you. You would pay to forget the hand not because the info is useless, but because you cannot commit to *ignoring* it. If you could credibly commit to playing randomly despite knowing the hand, you'd keep the info. Since you can't, the info makes you predictable.
  *   **Is it unique?** It shares DNA with Example 4 (Game Theory), but the mechanism here is specifically about **predictability** and **mixed strategies**.

  ### 3. The Drug Trial (Reflexivity)
  **The Violation:** *The state of the world is independent of the agent's knowledge.*

  Standard theory assumes the world is "fixed" until you act on it. $P(World | Info) = P(World)$. In your friend's case, the act of acquiring the information *changed the probability of the outcome*.
  *   **The Seam:** This is **Reflexivity** (or the Observer Effect). In economics, this is the **Lucas Critique**: if agents know the policy rule, they change their behavior, invalidating the rule. In medicine, it's the **Placebo/Nocebo Effect**.
  *   **Why the Theorem Fails:** The theorem assumes information reveals a pre-existing truth. Here, the information *creates* a new truth. By knowing she was on the drug, she triggered a physiological or psychological response that altered the drug's efficacy. The map changed the territory.
  *   **Is it unique?** Yes. This is a causal violation. The other three assume the world is static; this one assumes the world reacts to being measured.

  ### 4. Insider Trading (Informational Asymmetry)
  **The Violation:** *Value is intrinsic to the information.*

  This is a subset of the Game Theory violation (#2), but with a specific market mechanic. The value of the information is not in the *content* (e.g., "Stock X will rise"), but in the *asymmetry* (e.g., "I know Stock X will rise and you don't").
  *   **The Seam:** This is about **Common Knowledge**. In market theory (and zero-sum games), profit comes from being right when others are wrong. Once information becomes common knowledge, the arbitrage opportunity vanishes.
  *   **Why the Theorem Fails:** Good's Theorem assumes the value of information is its ability to help *you* navigate the world. In markets, the value is often your ability to navigate the world *better than others*. If the info becomes public, your edge goes to zero.
  *   **Is it unique?** It is structurally identical to #2 (Game Theory), but the "opponent" is the entire market rather than a specific player across the felt.

  ### Summary of the Seams

  To answer your core question: **There is no single name for the cluster** because they break different axioms. However, they are often collectively discussed under **"Negative Value of Information"** scenarios.

  Here is how to keep them apart:

  | Example | Mechanism | Decision Theory Violation | Field |
  | :--- | :--- | :--- | :--- |
  | **1. Genetic** | Anxiety/Worry | **Utility Function:** Info enters $U$ directly. | Behavioral Econ |
  | **2. Poker** | Predictability | **Commitment:** Cannot ignore info to mix strategies. | Game Theory |
  | **3. Drug** | Efficacy Drop | **Causality:** Info changes the state of the world. | Epidemiology / Macro |
  | **4. Trading** | Arbitrage Loss | **Asymmetry:** Value depends on others *not* knowing. | Finance / Game Theory |

  ### The "Fifth Thing" You Might Be Missing

  There is one more major category of "information hurts" that you haven't listed, which is worth separating out: **Bounded Rationality (Processing Costs).**

  Good's Theorem assumes information is *free*. In reality, information has a **processing cost**.
  *   **Example:** A poker player gets a HUD (Heads Up Display) with too much data. They become "data rich but information poor." They freeze up, overthink, or suffer analysis paralysis.
  *   **The Seam:** The information wasn't negative; the *cost of integrating it* exceeded the value of the decision improvement. This violates the "free information" assumption.

  ### Conclusion

  Your intuition is spot on. The "Never-Hurts" result draws its line at **Single-Agent, Static-World, Costless-Processing, Outcome-Only Utility** problems.

  *   **Examples 2 and 4** are genuinely the same phenomenon (Game Theoretic/Strategic value).
  *   **Example 1** is a psychological utility violation.
  *   **Example 3** is a causal/physical violation.

  If you want to read deeper into the specific "seams," look up **Blackwell's Theorem** for the baseline, **Kaplow & Shavell** for Information Aversion (#1), and **Schelling** for Commitment Strategies (#2). The drug trial (#3) is less formalized in decision theory and more often found in **Complex Systems** or **Reflexive Finance (Soros)**.

  The pattern you're seeing isn't a single bug in decision theory; it's the friction of applying a clean mathematical model to a messy, multi-agent, reflexive reality.
