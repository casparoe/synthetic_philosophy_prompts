      *(Self-Correction on the "Eight Months" vs "Dam" timeline)*: I will treat the "eight months" as the duration of the specific controversy/report deadline, while the dam is an existing feature that created the ecological conditions.

      *(Refining the "Species" definition)*: WB is leaning on the ESA (Endangered Species Act) which allows for "Distinct Population Segments" but often hinges on taxonomic status. WB wants the "Species" title for the hammer it provides. BF argues the hammer is the wrong tool.

