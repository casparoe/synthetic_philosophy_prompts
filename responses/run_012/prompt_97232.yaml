answer: |-
  **Setting:** *A backyard BBQ, late afternoon. The grill is cooling down. Mark (Wildlife Buddy) is holding a warm beer and staring at a manila folder on the picnic table. Dave (Birder Friend) is leaning against the railing, peeling the label off his bottle.*

  **Mark:** I just need to know if I'm lying. That's all. If I write "Distinct Species" in this report, am I falsifying data? Because if I'm not lying, I can stop this road. If I am lying, the developer sues the state, the road gets built anyway, and I lose my credibility.

  **Dave:** You're asking if you're lying about what, exactly? The genetics? The morphology? We know the hill frogs are browner. We know they're smaller. We know they swap genes with the lowland frogs down by the water's edge. Those are the facts. The "species" part is the label you're trying to stick on it.

  **Mark:** Don't give me the "labels" speech, Dave. You're a splitter. I've watched you. If a warbler's song changes by two hertz in the next county over, you're writing a paper on a new subspecies. You act like those lines are real when it's convenient.

  **Dave:** I act like they're *useful*. There's a difference. When I'm birding, splitting helps me track conservation needs. It highlights diversity. But when you ask me if that line is "out there in the world," like a fence post... no. It's not. Nature is a continuum. You're trying to find a hard border where there's just a gradient.

  **Mark:** But the law requires a hard border. The Endangered Species Act protects species. It doesn't protect "gradients." So, for my job, the border has to be real. If the biology says these frogs are one continuous population with some local variation, then they are one species. If I call them two, I'm pretending the interbreeding at the bottom of the valley doesn't matter. And it does matter. They breed fine. No sterile hybrids. Nothing.

  **Dave:** So use the Biological Species Concept. They interbreed, they're one species. Case closed.

  **Mark:** And then the developer paves the hills, the hill population goes extinct because they're adapted to the dry upland, and I did my job "right" according to your philosophy while the frogs died.

  **Dave:** Then protect them as a Significant Population Unit. Or protect the habitat. Don't twist the definition of "species" to fit the law. If you force the biology to say "two species" when the gene flow says "one," you're not saving the frogs, you're saving the legal framework.

  **Mark:** It's not twisting if the biology is actually ambiguous! Look, Dr. Chen says they're *Rana hillis*. Dr. Aris says they're *Rana lowlandis hillis*. Both published. Both peer-reviewed. If "species" is just a tool, why do two experts using the same tools get different answers? One of them has to be wrong about the world.

  **Dave:** No, they're wrong about the *definition*. Chen is using a Phylogenetic Species Concept—she cares about the unique evolutionary history of the hill group. Aris is using the Biological Species Concept—he cares about the gene flow. They aren't disagreeing about the frogs, Mark. They're disagreeing about what word they're allowed to use. You're treating "species" like it's an electron. It's not. It's a map.

  **Mark:** A map is supposed to match the territory. If I have two maps of the same valley and one shows a bridge and the other shows a tunnel, I can't build a road based on "whichever map I feel like." I need to know what's in the territory. If the territory contains a distinct evolutionary lineage that is heading toward speciation but hasn't finished the job, that is a fact. I need to be able to say that fact matters legally.

  **Dave:** But it *doesn't* matter legally unless you put it in the box labeled "Species." That's the problem. You're saying the protection should follow the biology. I'm saying the biology is too messy for the protection you want. So you have to admit that protecting the hill frogs is a value judgment. We *value* that unique lineage enough to stop the road, regardless of whether they've finished speciating.

  **Mark:** If I write "We value this," the judge throws it out. The law says "Is it a species?" It's a yes/no question.

  **Dave:** Then the law is asking a question nature can't answer. You're trying to force a binary switch onto a dimmer knob. When you flip the switch and say "Yes, Species," you're pretending the dimmer doesn't exist. You're pretending the interbreeding at the bottom of the valley doesn't happen.

  **Mark:** I'm not pretending it doesn't happen. I'm weighing it against the divergence in the hills. The interbreeding is limited. It's just at the edge. The core populations are distinct. It's like... okay, you know how you told me once that the Red-shafted and Yellow-shafted Flickers are one species now, Northern Flicker, because they hybridize?

  **Dave:** Right. Because the gene flow is extensive enough to keep them genetically cohesive across the continent.

  **Mark:** But if they only hybridized in one tiny valley in Montana, and everywhere else they were separate, would you still lump them?

  **Dave:** Probably not. I'd probably call them separate species.

  **Mark:** Aha! So there *is* a line. You just drew it. You decided that "tiny valley" hybridization doesn't count, but "continent-wide" does. That decision is based on something real about the birds, not just your feelings. So why can't I decide that for the frogs?

  **Dave:** Because I'm not claiming my line is the *only* true line. If another birder looks at that same flicker data and says, "No, any hybridization means they're one species," I can argue with him about utility, but I can't say he's blind to reality. He's just using a stricter threshold. With your frogs, you're under pressure to find the threshold that stops the road. That biases the science.

  **Mark:** It biases the *threshold selection*, sure. But the underlying data—the divergence, the isolation—is objective. I'm not making up the DNA. I'm interpreting the weight of it. You're saying I shouldn't interpret it at all. You're saying I should just say "It's a construct" and let the developer win.

  **Dave:** I'm saying you should say, "This is a unique evolutionary lineage that merits protection," and fight to change how the law interprets that. If you lie and call it a full species, and then ten years later geneticists prove there's massive gene flow, the protection collapses. You lose the frogs *and* your integrity.

  **Mark:** And if I tell the truth—that they're a distinct population segment but technically hybridizing—and the law doesn't cover that? Then the road gets built tomorrow. You're asking me to sacrifice the frogs to preserve the philosophical purity of taxonomy.

  **Dave:** I'm asking you to admit that stopping the road is a moral choice, not a scientific one. Science tells you what *is*. It tells you there are frogs up the hill, frogs down the hill, and mixing in the middle. Science cannot tell you if that mixing makes them "the same." That's a human category.

  **Mark:** But if I admit it's a moral choice, I'm admitting it's subjective. And if it's subjective, the developer's money talks louder than my morality. "Species" is the only shield I have that's supposed to be objective. It's the only thing that says, "This isn't about what Mark wants, it's about what *is*."

  **Dave:** But it *is* about what Mark wants. Or what the state wants. We decide to protect biodiversity. That's a value. We decided wolves are worth saving. We decided mosquitoes aren't. That's not biology. That's us. Why hide behind the frog's DNA to make a decision that's actually about how we want to live in this valley?

  **Mark:** Because "We want to live in a valley with frogs" sounds weak in court. "This is a federally recognized species" sounds like a fact. If I can't prove it's a fact, I can't do my job. You're out there with your binoculars, Dave. If you misidentify a warbler, you miss a tick on your list. If I misidentify a species, a habitat gets bulldozed. I don't have the luxury of saying "it's all just a tool." I need the tool to work.

  **Dave:** Then fix the tool. Don't break the science to fit the tool. If the tool requires a binary yes/no on a non-binary world, the tool is broken. You're trying to hammer a screw because you refuse to admit you need a screwdriver.

  **Mark:** I don't have time to invent a screwdriver! The hearing is in three weeks. I have to file the report. So I have to look at these frogs, look at the interbreeding, look at the divergence, and I have to make a call. And you're telling me that call is meaningless?

  **Dave:** I'm telling you the call is *yours*. It's not the frogs' call. The frogs are just doing frog stuff. They're swapping genes where they meet and staying distinct where they don't. They don't care if they're *Rana hillis*. You care. The developer cares. So own it. Say, "Biologically, they are a distinct lineage with some gene flow. Ethically, that lineage is worth saving."

  **Mark:** And if the judge says, "I don't care about your ethics, show me the species certificate"?

  **Dave:** Then you lose. But you don't lose by lying.

  **Mark:** I lose the frogs, Dave. That's the loss that counts. If I fudge the threshold, emphasize the divergence, downplay the hybrid zone... I can make the "Species" argument stick. It's defensible. Chen did it.

  **Dave:** Chen did it because she believes the Phylogenetic Concept is the right tool. Are you using it because it's the right tool, or because it's the only one that reaches the developer's road?

  **Mark:** *...Does it matter?* If the result is the same—frogs saved, road stopped—does it matter why I picked the hammer?

  **Dave:** Yes. Because next time, there won't be a road. There'll be a pipeline. Or a mine. And if you've established that "Species" means "Whatever Mark needs to stop construction," nobody will trust the biology anymore. Then you really won't be able to save them.

  **Mark:** So I should let them die now to preserve trust for later?

  **Dave:** I'm saying if you lie about the biology, you're admitting the biology doesn't matter. And if the biology doesn't matter, why should the developer listen to you when the next project comes along?

  **Mark:** *Takes a long drink of warm beer.* You know, for a guy who thinks species aren't real, you care an awful lot about how I classify this one.

  **Dave:** Because the classification has real consequences. The *frog* is real. The *habitat* is real. The *road* is real. The word "species" is just the lever we're fighting over. I just want to make sure you don't break the lever trying to move the world.

  **Mark:** And I want to make sure the world doesn't move while we're arguing about the lever.

  *They stand there in silence for a moment. A car drives by on the road below, heading up toward the hills.*

  **Dave:** So, what are you going to write?

  **Mark:** I don't know. But I'm not calling it a construct in the report.

  **Dave:** I didn't ask you to. I just asked you to know which part is the frog, and which part is the box.

  **Mark:** *Opens the folder.* The frog eats insects. The box gets me into court. Right now, I need to get into court.

  **Dave:** Just don't forget the frog is the only thing that's going to be there after the court is gone.

  *Mark doesn't answer. He flips the page. Dave turns back to the grill.*
