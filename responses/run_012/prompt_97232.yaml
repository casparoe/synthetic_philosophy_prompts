      *   *WB:* "I can't tell the judge that."
      *   ...and so on.

      *Wait, one detail to fix:* The prompt says "got cut off when they built the dam." But also "where the two populations meet at the bottom of the valley they still interbreed fine." This implies the dam didn't *completely* isolate them, or the "cut off" refers to the hill population being isolated *above* the reservoir, but they come down to breed? Or maybe the dam flooded the middle, leaving hills above and lowlands below, and they meet at the water's edge? Let's assume the dam created the reservoir which flooded the connecting habitat, leaving the hill population high and dry, but they still come down to the riparian zone to meet the lowland frogs. That works.

      *Let's focus on the "Splitter" contradiction.* BF needs to explain: "I split because it helps me track evolution, not because nature has hard borders."

      *Let's focus on the "Two Biologists" issue.* WB: "If it's a fact, why do Smith and Jones disagree?" BF: "Because they use different maps."

      *Okay, ready to write.*

  7.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   Answering each other? Yes.
