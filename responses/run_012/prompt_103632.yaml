  I'm a journalist writing about dream skepticism and the limits of first-person evidence, and I'm stuck on the butterfly anecdote at the end of the second chapter of the Zhuangzi. As I read it: Zhuang Zhou dreamed he was a butterfly, fluttering about happily, with no awareness of being Zhou; then he woke and was Zhou again; and he says he cannot tell whether he is Zhou who dreamed of being a butterfly or a butterfly now dreaming of being Zhou. Yet the passage ends by saying there must be some distinction between Zhou and the butterfly, and calls this the transformation of things. I need help understanding what that final move is doing. Does it cancel the skeptical worry — so the anecdote is not really a dream-skepticism argument — or does it deepen it? What does the transformation of things mean here, and is it a technical term? A scholar I interviewed said reading the anecdote as a proto-Cartesian skeptical scenario misses the point, but she didn't explain. I'd like the competing readings, with the considerations for and against each, and a note on whether the anecdote's placement at the end of a chapter full of puzzles about perspective and the relativity of judgments should change how I read it. No citations or reading lists, please — just the interpretation.
