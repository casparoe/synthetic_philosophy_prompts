answer: |-
  KANTIAN INDIRECT DUTY SCREENING PROCEDURE

  Purpose: To evaluate animal research protocols based on duties to humanity rather than direct duties to animals. Note: This framework conflicts with institutional assurances regarding intrinsic animal value.

  STEP 1: END JUSTIFICATION
  Question: Does the protocol serve a necessary human end?
  Sufficient Answer: Yes, the end is human health, safety, or knowledge.
  Stop Condition: No. If the benefit is solely for the animal, proceed to Step 4 (Hand-off).
  [DIVERGENCE FLAG] Institution asserts animals have intrinsic value; Kant asserts they are means only.
  Verdict: Protocols lacking human end are morally optional or unjustifiable expenditures under this framework.

  STEP 2: MAXIM OF CHARACTER
  Question: Could an agent will this action as a settled habit of character while living among humans?
  Analysis: This reframing is a faithful extension of Kant. It shifts focus from the act's universality to the agent's moral cultivation. It tests whether the action hardens or softens the heart toward humanity.
  Sufficient Answer: Yes, the action cultivates kindness or does not erode sympathy.
  Stop Condition: No. If the action requires becoming the sort of person who ignores suffering, reject.
  [DIVERGENCE FLAG] Institution focuses on animal suffering; Kant focuses on agent character.

  STEP 3: BRIDGE CHECK
  Question: Does using the animal here risk training the agent to treat rational beings as mere means?
  Analysis: This step risks smuggling direct duties in through the back door. There is no principled bridge in Kant. If the constraint arises from the animal's status, it is non-Kantian. If it arises from the effect on the human's character, it is valid.
  Sufficient Answer: No, the treatment is distinct from how humans must be treated.
  Stop Condition: Yes. If the behavior normalizes treating sentient beings as disposable tools, reject.
  [DIVERGENCE FLAG] Institution prohibits treating animals as mere means; Kant permits it if human duty is preserved.

  STEP 4: DULLING TEST
  Question: Does the protocol require the active suppression of natural aversion to suffering?
  Analysis: This is not a real empirical test. It is a way of writing down a judgment about moral risk.
  Sufficient Answer: No, or suppression is minimized via analgesia.
  Stop Condition: Yes, if suppression is extensive and unjustified by human end.
  [DIVERGENCE FLAG] Institution requires minimization of pain for the animal's sake; Kant requires it for the human's sake.

  HAND-OFF POINT
  If Step 1 fails, or if Steps 2-4 rely on direct animal value, the decision is a value call for the full committee, not a Kantian deduction.

  PROTOCOL APPLICATIONS

  1. Rat Cancer Study with Analgesia
  Step 1: Yes, human health end.
  Step 2: Yes, seeking cure cultivates benevolence.
  Step 3: No, medical context distinguishes from human treatment.
  Step 4: No, analgesia preserves sympathy.
  Verdict: PASS.
  [DIVERGENCE FLAG] Low. Kant and Institution align on outcome, differ on reason.

  2. Dog Colony with Surplus Euthanasia
  Step 1: Yes, research line needed.
  Step 2: Risk. Killing loyal species may dull sympathy.
  Step 3: Risk. Treats living beings as disposable inventory.
  Step 4: Yes, requires suppressing aversion to killing healthy animals.
  Verdict: HAND-OFF. Kantian gratitude duties conflict with research necessity.
  [DIVERGENCE FLAG] High. Institution sees rights violation; Kant sees character risk.

  3. Pig Enrichment for Pig Benefit
  Step 1: No. Benefit is solely to pigs.
  Step 2: N/A.
  Step 3: N/A.
  Step 4: N/A.
  Verdict: FAIL / HAND-OFF. No human end justifies resource expenditure.
  [DIVERGENCE FLAG] Critical. Institution mandates enrichment; Kant sees no duty to fund it. This stings because it denies moral obligation to alleviate animal suffering for their own sake.

  LIMITATIONS AND FAILURES

  This procedure cannot adjudicate cases where human benefit is vague. It misfires on wild animal ethics or stray management where no human agent is cultivating character through direct interaction. The machinery runs out when distinguishing between necessary hardness and cruel indifference; this remains a judgment call dressed as a procedure. The Dulling Test and Bridge Check are not empirical filters but rhetorical devices to force reflection on the agent's soul. They cannot prove harm, only articulate risk. Finally, this framework cannot support the institutional premise of intrinsic animal value. Every pass verdict hides a theoretical seam where the committee accepts animal welfare for reasons Kant rejects. Users must acknowledge that passing a protocol here does not mean the animal was treated well in itself, but that the human remained virtuous. This procedure protects the researcher's humanity, not the animal's life. It is a tool for moral self-regulation, not animal protection. Where the institution demands the latter, this screen must yield to full committee review. Do not use this to bypass ethical scrutiny where human benefit is weak. The Kantian answer is often that we owe them nothing directly, which is legally and ethically incompatible with modern assurance statements. Proceed with caution.
