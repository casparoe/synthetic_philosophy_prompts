          4.  Case A (Crow): Why it's Popperian, not Gregorian.
          5.  Case B (Math): Why it's Gregorian (scaffolding).
          6.  Falsification/Conclusion: What would undermine the scheme.
      *   *Content:* Must acknowledge the debate. Dennett *says* Gregorian is distinct because of cultural inheritance, but Clark/Chalmers (Extended Mind) might blur it. The model answer should take a stance but acknowledge the friction.
