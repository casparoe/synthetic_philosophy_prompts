          *   *Crow:* Looks Popperian (simulating the hook), but lacks Gregorian tools (language). If classified as Gregorian, it breaks the definition. If classified as Skinnerian, it ignores the insight aspect.
          *   *Human/Math:* Looks Gregorian (using numerals/paper), but relies on Popperian simulation. If the paper is part of the mind, does that blur the line between Popperian and Gregorian?

  3.  **Drafting the Essay Question:**

