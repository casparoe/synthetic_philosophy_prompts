answer: |-
  This is a strong draft concept. It's clear, it targets a genuine tension in the literature, and it avoids the usual muddy waters of "determinism vs. indeterminism." You are correctly identifying that the Basic Argument is an *origin* argument, not a *capacity* argument.

  However, you are right to be worried. You are walking into a minefield that has been contested for forty years. Here is the breakdown of your four questions, followed by a verdict on whether the piece is worth writing.

  ### 1. Is the Authorship/Answerability split doing real work?
  **Verdict:** It is real work, but it is not *new* work. You are effectively reconstructing the Compatibilist/Incompatibilist divide using different terminology.

  *   **Authorship** is what Incompatibilists (like Galen Strawson) call **Ultimate Responsibility (UR)**.
  *   **Answerability** is what Compatibilists (like R. Jay Wallace, Susan Wolf, or T.M. Scanlon) call **Reasons-Responsiveness** or **Accountability**.

  **Is it boring?** Not necessarily. While the *distinction* is standard, your specific application of it to Galen Strawson's *rhetoric* is sharp. Many readers feel the force of the Basic Argument but recoil from the conclusion ("nothing is responsible"). Your essay explains *why* that recoil happens: because Strawson is proving the impossibility of *Authorship* while the reader is worried about the viability of *Answerability*.

  **Advice:** Don't present this distinction as your own discovery. Anchor it. Mention that P.F. Strawson (Galen's father) grounded responsibility in reactive attitudes (answerability), while Galen grounded it in metaphysics (authorship). If you frame your piece as "Diagnosing the Equivocation in Strawson's Rhetoric" rather than "Solving the Free Will Problem," it becomes a much stronger, more humble, and more defensible paper.

  ### 2. Does the regress swallow Answerability too?
  **Verdict:** This is the exact spot where you will get killed, but it is also where you can win if you are precise.

  **The Attack:** Galen Strawson will say: "If your capacity to give an account (your rationality, your sensitivity to reasons) is part of 'the way you are,' and you did not ultimately choose to have that capacity, then you are not *truly* responsible for exercising it. You are just a machine that processes reasons. Luck is still in charge."

  **The Defense:** You must define Answerability as a **functional status**, not a **metaphysical origin**.
  *   **Authorship** asks: "Where did this capacity come from? Did you create it *ex nihilo*?" (The regress kills this).
  *   **Answerability** asks: "Does this creature *currently* possess the machinery to recognize reasons and adjust behavior accordingly?" (The regress ignores this).

  **The Fix:** You need to explicitly state that Answerability does not require *ultimate* ownership of the capacity, only *current* possession of it. If you claim Answerability requires you to have chosen your capacity to answer, the regress eats you. If you claim Answerability is just about whether the lights are on *now*, the regress bounces off.

  ### 3. Is your read of Strawson's attitude right?
  **Verdict:** You are slightly off, and correcting this will strengthen your piece.

  You write: *"he's happy to go on blaming people and thinks the argument shouldn't be trotted out as a general excuse for bad behaviour."*

  **Correction:** Galen Strawson is an **error theorist**, not a pragmatist. He doesn't think the practice is *justified* on answerability grounds. He thinks the practice is **ineliminable** due to human nature, even though it is **theoretically false**. He compares it to believing in physical objects (Humean skepticism). We can't stop believing in them, even if philosophy tells us we shouldn't.

  **Why this matters for your draft:** If you claim he "concedes your point," he will reply: "No, I concede that humans *cannot stop* holding each other responsible, but I maintain that it is *never fair* to do so." He does not think Answerability justifies blame; he thinks blame is a natural illusion we can't shake.

  **Your Move:** Don't say he concedes your point. Say that his *practical concession* reveals that **Answerability is the only game in town.** If even the destroyer of responsibility admits we must keep the practices running, then the practices must rely on something other than the Authorship he just destroyed. They rely on Answerability. He may call it an "illusion," but you can call it "the only viable model of responsibility we have."

  ### 4. What is the sharpest objection against you?
  If I were defending Galen Strawson against your draft, I would not attack the distinction. I would attack the **normative force** of Answerability without Authorship.

  **The Objection:**
  "You have saved the *description* of responsibility, but you have killed the *desert*.
  If I am answerable, but not the author of my answerability, you can *manage* me. You can quarantine me (if I'm dangerous) or train me (if I'm useful). But you cannot *blame* me in the moral sense. You cannot say I *deserve* suffering or censure.
  Your 'Answerability' justifies a trip to the mechanic, not a trip to the courtroom. Strawson's point is that without Authorship, moral blame is fundamentally unjust. By retreating to Answerability, you have saved 'responsibility' only by draining it of its retributive sting. You've changed the subject from Justice to Engineering."

  **How to handle this:** You need to decide if your version of responsibility needs to support *retributive blame*. If you say "Yes," you lose. If you say "No, responsibility is about moral dialogue and repair, not payback," you survive. (This aligns with T.M. Scanlon's view).

  ### 5. Is this just the "Proves Too Little" complaint in a new hat?
  **Verdict:** Yes. But that doesn't mean you shouldn't write it.

  The standard Compatibilist reply to the Basic Argument is: "The argument sets the bar for responsibility impossibly high (Ultimate Responsibility). Real responsibility only requires Guidance Control."
  You are saying: "The argument kills Authorship. It leaves Answerability alone. Strawson conflates them."

  **Is it worth writing?**
  *   **No,** if you think you are overturning the Basic Argument. You aren't.
  *   **Yes,** if you are writing a critique of Strawson's *persuasive strategy*.

  The value of your piece isn't in the metaphysics; it's in the **diagnosis**. You are arguing that Strawson wins the metaphysical battle (Authorship is impossible) but loses the semantic war (because "Responsibility" means Answerability to almost everyone else).

  **Recommendation:**
  Write it, but pivot the title/focus. Don't write "A Refutation of the Basic Argument." Write **"The Equivocation in the Basic Argument: Authorship vs. Answerability."**

  1.  Grant Strawson the win on Authorship (don't fight the regress).
  2.  Show that "Moral Responsibility" in practice tracks Answerability (capacity to give accounts).
  3.  Argue that Strawson's conclusion ("Nothing is responsible") is only true if we define responsibility as Authorship.
  4.  Conclude that since we cannot live without Answerability practices, Strawson's conclusion is practically inert.

  This avoids the trap of trying to solve the regress and instead focuses on why the argument feels compelling yet unacceptable to most people. That is a solid, short philosophy piece.
