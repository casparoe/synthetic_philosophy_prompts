prompt: |-
  I'm leading a 45-minute session at a reading group on the combination problem for panpsychism — audience is grad students from other departments plus one retired engineer who's read a lot of pop physics. Dont explain the problem to me; plan how I should explain it. I need: the order the pieces have to come in so the problem feels like it forces itself on you rather than like a cheap gotcha; the one example that should carry the whole thing and what it needs to have and to avoid (they'll all reach for atoms-into-molecules or pixels-into-an-image, and I don't think either quite survives — tell me if I'm wrong); the misconceptions they'll form and the order they'll form them in, with the exact point in the sequence where I head each one off. I'm expecting 'micro-subjects are basically tiny people', 'this is just the hard problem again', and 'the fix is just more integration' — and fair warning, last week they did a session on integrated information theory and came away thinking integration solves everything. Then the one question I ask at the end to tell whether they actually got it instead of politely nodding, and what I should openly refuse to cover at this level. I'd also like them to leave seeing why the obvious escape hatch — positing a primitive bonding relation between micro-experiences, the experiential analogue of a chemical bond — either solves the problem or just renames it, so say where that goes in the sequence. And should I touch the reverse direction, whether one subject could ever split into two, or is that just noise at this level?
