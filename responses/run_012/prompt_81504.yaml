answer: |-
  **Scenario**

  The City Fire Code mandates that any wall assembly classified as "fire-resistant" must withstand standard testing without "structural failure," but the code defines structural failure vaguely as "significant loss of load-bearing capacity" without specifying a percentage. A certified testing lab runs six incremental burns on identical drywall panels, increasing heat exposure by 50 degrees per test. Panel 1 stands rigid; Panel 6 collapses completely. Panels 3 and 4 sag visibly under weight but return to shape, holding exactly 80% of their original load. The lab must mark each panel "pass" or "fail" based on the "significant loss" clause to issue occupancy permits, but the code provides no numeric threshold for what counts as significant, leaving the inspectors to apply the rule case-by-case.

  **Theoretical Checks**

  | Feature | Epistemicism | Supervaluationism |
  | :--- | :--- | :--- |
  | **Borderline Sentence**<br>(e.g., "Panel 4 failed") | **True or False.** There is a fact of the matter about whether 80% capacity loss counts as "significant," even if inspectors cannot know it. | **Indeterminate.** It is true on some precisifications of "significant" (e.g., those setting the bar at 75%) and false on others (e.g., those setting it at 85%). |
  | **Sorites Generalization**<br>("If Panel $n$ passed, Panel $n+1$ passed") | **False.** There is a specific step where the truth value flips from True to False, making that specific conditional false. | **False (Superfalse).** Every admissible precisification imposes a sharp cutoff, so the generalization is false on every precisification. |
  | **Excluded Middle**<br>("Panel 4 failed OR Panel 4 did not fail") | **True.** Classical logic holds; one disjunct is objectively true. | **True (Supertrue).** The disjunction is true on every precisification, even though neither disjunct is true on every precisification. |

  **Analysis of Costs**

  The supervaluationist ends up with a true disjunction that has no true disjunct. This means the logical operator "or" is no longer truth-functional; you cannot determine the truth value of the whole based solely on the truth values of the parts (since both parts are indeterminate, yet the whole is true). This is a real cost: it forces a divorce between truth and assertibility, meaning you can assert "P or not-P" without being able to assert either side. Some supervaluationists shrug this off by arguing that logical validity preserves supertruth, not classical truth, so the system remains coherent. The epistemicist avoids this logical weirdness for free—they keep classical, truth-functional logic intact. However, they pay a steep metaphysical price: they must accept that there is a precise, unknowable fact about whether 80% capacity loss is "significant," implying a sharp boundary in reality or meaning where none seems to exist.

  **Three Final Points**

  1.  **Feature Doing the Work:** The critical feature is the **binary institutional requirement imposed on a continuous variable without a specified cutoff.** The code demands a yes/no decision ("pass/fail") on a gradient (load capacity), which forces the logic to confront how a sharp decision emerges from vague rules.
  2.  **What Breaks if Removed:** If you remove the vagueness by adding a numeric threshold (e.g., "significant loss means >75% capacity"), the sorites structure collapses. Both theories would agree every sentence has a classical truth value, and the generalization would be plainly false at the specific numeric boundary, eliminating the philosophical dispute.
  3.  **Supervaluationist Counterattack:** A supervaluationist would attack the claim that the generalization is "false" in the same sense as atomic sentences. They would argue that while the generalization is not supertrue (so the sorites argument is blocked), it is not necessarily superfalse either, depending on how precisifications are handled. More aggressively, they would argue that the failure of truth-functionality is not a bug but a feature: it correctly models how vague language works, where logical laws hold globally (supertruth) even when local truth values are unsettled.
