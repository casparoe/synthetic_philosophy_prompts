answer: |-
  **TO:** Acquisitions Committee, Special Collections Library
  **FROM:** [Your Name], Committee Chair
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation regarding the [Artist Name] Estate Donation

  Colleagues,

  We meet Thursday to decide on the [Artist Name] estate donation. As you know, this is not a standard acquisition. We are being offered a single handwritten sheet of instructions and a legal codicil requiring us to re-create a large wall drawing annually, on a new wall, destroying the previous year's iteration.

  The committee is currently deadlocked. One faction argues we are acquiring a manuscript: a historical document to be cataloged, vaulted, and preserved in perpetuity. The other argues we are acquiring a practice: a time-based performance where the paper is merely a script, and the true work exists only in its annual execution.

  To break this deadlock, I am proposing we adopt a specific framework for evaluating what constitutes "the work" here. I am borrowing a distinction from Douglas Hofstadter's *Gödel, Escher, Bach*, regarding how information is layered in a medium like a phonograph record.

  Hofstadter splits the message into three layers:
  1.  **The Frame Message:** The context that tells you what the object is and how to handle it (e.g., "This is a record, do not touch the grooves").
  2.  **The Outer Message:** The encoded instructions themselves (the physical grooves).
  3.  **The Inner Message:** The actual experience generated when the instructions are executed (the music).

  If we apply this to the [Artist Name] donation, the mapping is clear.
  *   The **Frame** is the physical sheet of paper, the provenance, and our legal agreement. It tells us, "This is an artwork instruction."
  *   The **Outer** is the specific handwritten text on that sheet. It is the algorithm.
  *   The **Inner** is the wall drawing itself—the visual experience in the space, and crucially, the act of its destruction and renewal.

  My recommendation is that we **Accept with Conditions.**

  However, to justify this, I must explain why I am rejecting the "Document Only" approach, while granting that side of the committee the strongest possible hearing.

  **The Case for "Document Only"**
  Those arguing that we should accept only the sheet as a manuscript are making a argument based on institutional integrity and fiscal prudence. Special Collections libraries are designed to stabilize the past, not subsidize the future. Our mission is to preserve unique materials against decay.

  If we accept the codicil, we are signing up for a perpetual liability. We become responsible for labor, materials, and wall space every single year, forever. If the budget tightens in five years, do we breach the contract? Do we let the work die? Furthermore, by locking the sheet in the vault, we preserve the artist's hand literally. The ink on that page is the only thing that is physically authentic. To treat the paper as anything other than the primary artifact is to risk turning our library into a production studio, a role for which we are neither staffed nor funded. This position argues that the "Inner Message" is secondary to the historical record of the artist's intent, which resides in the "Outer Message" (the text). It is a safe, defensible, and traditionally library-centric position.

  **Why "Document Only" Fails**
  However, if we accept only the document, we are preserving the Frame and the Outer Message, while deliberately silencing the Inner Message. In Hofstadter's analogy, this is equivalent to collecting a phonograph record but forbidding anyone from ever playing it. You have preserved the plastic, and you have preserved the grooves, but you have destroyed the music.

  For this artist, the transience *is* the meaning. The instruction to paint over the previous year's work is not a maintenance clause; it is the conceptual core of the piece. If we vault the sheet and never realize the drawing, we are not preserving the work; we are preserving a recipe for a meal we refuse to cook. We would be holding a "Frame" that claims to be an artwork, while knowingly neutering the "Inner" content that makes it art. We would become custodians of a lie.

  Therefore, the work's meaning lives in the **Inner Message**—the realization and the cycle of destruction. The sheet is merely the carrier wave. If we do not commit to the realization, we are not acquiring the work; we are acquiring a souvenir of the work.

  **The Recommendation: Accept with Conditions**
  We cannot simply say "yes" to the estate as currently proposed, because the "Document Only" side is right about the risk. An unfunded perpetual mandate is irresponsible. Nor can we say "no," because that abandons the Inner Message entirely.

  I propose we vote to **Accept with Conditions**, specifically structured to preserve the Inner Message without bankrupting the Outer Frame.

  1.  **Re-categorization:** We do not catalog this as a Manuscript. We acquire it as **Time-Based Media**. This shifts the stewardship from purely Archival to a collaboration between Special Collections, Facilities, and the Art Department. The "object" is the right and obligation to perform the instruction.
  2.  **The Endowment Condition:** Acceptance is contingent on the estate providing an endowment sufficient to cover materials and labor for the annual realization for a minimum of 20 years. This ensures the "Inner Message" can actually be heard. If they cannot fund the performance, we cannot accept the script.
  3.  **Documentation as Preservation:** Since the physical wall is destroyed annually, our preservation obligation shifts to high-resolution documentation. We must photograph and scan each iteration before it is painted over. *This* digital archive becomes the permanent historical record we store in the vault. The paper instructions stay in the vault, but the "music" is preserved in our digital collections.
  4.  **Access Protocol:** The handwritten sheet remains restricted (Frame/Outer), but the documentation of the realizations (Inner) is made publicly accessible online. This honors the artist's desire for the work to be seen, even if the physical instance is temporary.

  **Conclusion**
  Colleagues, if we vote to accept only the sheet, we are safe, but we are incomplete. We will have a record that cannot play. If we vote to accept the practice without funding, we are reckless.

  By voting to **Accept with Conditions**, we acknowledge that in contemporary art, the "work" is often not the thing you hold, but the thing that happens. We preserve the Frame (the sheet), we honor the Outer (the instructions), but we commit to capturing the Inner (the realization) so that the music is not lost when the record is destroyed.

  I ask that you review these conditions before Thursday. If the estate agrees to the endowment and the re-categorization, I will move to accept. If they insist on an unfunded mandate, I will move to decline.

  Thank you.
