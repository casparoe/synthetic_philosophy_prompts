  Argument: If we only keep the Frame and Outer, the Inner is lost. A record without a player is silent. A wall drawing without a wall is theoretical.

  Let's write.

  *(Drafting thought)*: Make sure to address the "painting over" aspect. That's crucial. The destruction is part of the work. Documentation becomes the only permanent record of the Inner Message.

