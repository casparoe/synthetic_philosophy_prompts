      *   *Section 2: The Nudge Theorists' Move.* Thaler & Sunstein know this. They argue revealed preference fails when there are framing effects. If I choose A over B in frame 1, and B over A in frame 2, revealed preference is broken. Therefore, we need a different standard for "what's good for people."
