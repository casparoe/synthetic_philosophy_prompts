answer: |-
  **Project Title:** Beyond Persuasion: Interdiction and the Justification of Civil Disobedience

  **Project Summary**
  This project challenges the consensus in contemporary political theory that the moral justification of civil disobedience depends on its communicative function (appealing to the majority's sense of justice). It proposes a distinction between *communicative disobedience* (aimed at persuasion) and *interdictive disobedience* (aimed at rendering unjust practices operationally impossible). Over six months, I will produce a 20-page working paper arguing that interdictive acts require a distinct justificatory framework—one that does not rely on publicity or acceptance of punishment—and that failing to recognize this category forces legitimate resistance into the conceptual box of revolution or criminality.

  ***

  ### 1. The Research Question
  The standard literature asks: *Under what conditions is civil disobedience justified within a nearly just society?* This presupposes the act is a plea for correction. My project asks a prior, sharper question:

  **Is public communicative appeal a necessary condition for the moral justification of conscientious lawbreaking, or can acts justified solely by their interdictive capacity (rendering injustice operationally impossible) constitute a distinct category of legitimate disobedience?**

  This is not a question about efficacy (what works best), but about *moral grammar*. If an act stops a pipeline by making construction physically impossible rather than morally shameful, does it forfeit the protection of "civil disobedience"? Current theory says yes. This project argues that if the answer is yes, our theory is too narrow to describe the actual landscape of legitimate resistance. The determinate answer sought is whether the "duty to obey" dissolves differently when the law is being used as a tool of administration rather than expression.

  ### 2. Critique of Existing Positions
  Current frameworks leave this question open because they are built on assumptions that exclude interdictive action by definition.

  *   **The Appeal-to-Justice Model (Rawlsian):** This view holds that disobedience must address the public's sense of justice. It assumes the state is capable of being moved by reason. It cannot account for acts where the goal is not to move the state, but to bypass its capacity to enforce. Under this model, a blockade that hides participants to ensure the blockage holds is "uncivil" because it rejects the dialogue.
  *   **The Fair-Play Model:** This argues that breaking the law is only justified if it does not take unfair advantage of the cooperative scheme. This assumes the scheme is mutually beneficial. It fails when the "game" itself is the site of oppression; here, the point is not to play fair, but to stop the game. The theory classifies this as rebellion, not disobedience, missing the nuance of targeted obstruction.
  *   **The Deliberative-Democracy Model:** This frames disobedience as a corrective to democratic failures, meant to reinvigorate deliberation. It treats disruption as a signal to return to the table. It cannot distinguish between disruption as a *signal* and disruption as a *substitute* for deliberation.

  All three models treat the *mechanism of change* as secondary to the *intent to communicate*. They leave open the possibility that some acts are justified not because they speak truth to power, but because they remove power's ability to act. By treating this as a boundary case rather than a category error, existing literature forces us to misdescribe effective, morally sound resistance as either "revolution" (too violent/radical) or "crime" (self-interested).

  ### 3. Methodology and Work Plan
  This cannot be a purely conceptual essay because the distinction between persuasion and interdiction collapses if not tested against cases where intuition and theory diverge. If I simply define terms, I risk stipulating a conclusion. The method must be **conceptual archaeology via case stress-testing**.

  *   **Months 1–2: Conceptual Mapping.**
      *   Task: Rigorously define *Communicative* vs. *Interdictive* modes.
      *   Method: Isolate the variables: Publicity, Anonymity, Acceptance of Punishment, Nonviolence.
      *   Goal: Produce a matrix showing where current theories draw the line vs. where the "facts on the ground" logic draws the line.
      *   *Why:* To ensure I am not just re-describing "effective persuasion" as "interdiction." I need to find cases where the actors explicitly rejected persuasion.

  *   **Months 3–4: Case Stress-Testing.**
      *   Task: Apply the matrix to three paradigm cases: (1) Sit-ins that filled jails to break the system (Communicative/Borderline); (2) Tree-spiking or anonymous blockades (Interdictive); (3) Wildcat strikes that halt production without demands (Interdictive).
      *   Method: Analyze whether our moral intuition that "this was justified" conflicts with the theoretical verdict that "this was not civil."
      *   *Why:* If the theory says the act is illegitimate but our considered judgment says it was necessary, the theory is the problem. This moves the paper from definition-stipulation to reflective equilibrium.

  *   **Month 5: Drafting the Argument.**
      *   Task: Construct the positive argument for a dual-track justification.
      *   Focus: How the "duty to obey" shifts. In communicative acts, the duty is suspended to highlight a breach of contract. In interdictive acts, the duty is suspended because the law has become a weapon of administration without legitimacy.
      *   Goal: First full draft (15–20 pages).

  *   **Month 6: Revision and Failure Analysis.**
      *   Task: Refine the boundary conditions.
      *   Focus: Ensure the distinction doesn't open the door to justifying violence.
      *   Deliverable: Final Working Paper.

  ### 4. Failure Conditions and Risk Assessment
  This project risks collapsing if the distinction between persuasion and interdiction proves illusory. I will consider the project to have failed, or the question ill-posed, under the following conditions:

  1.  **The "Slow Persuasion" Collapse:** If it turns out that all interdictive acts are ultimately dependent on a downstream communicative effect (e.g., a blockade only works because it signals resolve to a broader movement), then "interdiction" is just a tactic of persuasion, not a distinct justificatory category. If I cannot find a case where the act *succeeded* without any appeal to public opinion, the distinction is empirical noise, not philosophical signal.
  2.  **The "Revolution" Slide:** If the criteria for interdictive justification are so broad that they justify any act that makes an unjust law unenforceable (including violence against persons), the category loses its distinctness from revolutionary violence. If I cannot draw a line between "making a project too expensive" and "coercing individuals," the framework is dangerous.
  3.  **The "Semantic" Trap:** If the only difference is that we are renaming "uncivil disobedience" as "interdictive disobedience" without changing the justificatory weight, the project is merely terminological. The paper must show that the *reasons* for justification change, not just the label.

  ### 5. Feasibility and Scope Verdict
  **Honest Assessment:** This is the seed of a dissertation disguised as a grant proposal.

  The question touches the foundations of political obligation, the definition of the state's monopoly on violence, and the boundaries of democratic legitimacy. To answer it *definitively* requires a book-length treatment of the duty to obey.

  However, for a 20-page working paper, the scope is manageable *if and only if* I restrict the claim. I am not arguing for a new general theory of obligation. I am arguing for a **categorical correction** within the existing literature on civil disobedience. The risk is that in Months 3–4, the case studies will reveal that the "interdictive" category is too heterogeneous to hold together.

  **Mitigation:** I will limit the claim to *nonviolent* interdictive acts. This keeps the project within the bounds of "civil" discourse while still challenging the publicity/persuasion requirement. If the distinction holds for nonviolent obstruction, the paper succeeds. If it requires expanding to violent resistance to make sense, the project exceeds the six-month/20-page limit and should be abandoned for a larger dissertation framework.

  ***

  ### **Note to Applicant (The Pushback You Asked For)**

  You asked for an honest verdict in section (e), but since I'm acting as your collaborator here, I need to push back on the core distinction before you submit this.

  **The "Slow Persuasion" Problem is Real.**
  Your intuition is that changing the facts on the ground is different from appealing to conscience. But consider the sit-in. It made segregation unenforceable (interdiction), but it worked *because* it was televised (persuasion). If you block a road anonymously, you stop the traffic. But does the *justification* rest on the stopped traffic, or on the fact that stopping the traffic signals a level of commitment that shifts the political calculus?

  If the justification for interdiction *always* relies on a downstream political shift, then interdiction is just **coercive persuasion**. It's not "acting on the world" instead of "talking to power"; it's "talking to power using the language of costs."

  **The Better Cut:**
  Don't frame it as Persuasion vs. Prefiguration/Interdiction. Frame it as **Appeal vs. Constraint**.
  *   **Appeal:** Asks the opponent to change their mind.
  *   **Constraint:** Changes the opponent's options regardless of their mind.

  **Why this matters for the proposal:**
  If you stick with Persuasion vs. Prefiguration, a reviewer will say, "Prefiguration is just long-term persuasion." If you use **Appeal vs. Constraint**, you force the reviewer to admit that sometimes we are justified in removing an option from a bad actor, not just asking them to choose differently.

  **The Scope Warning:**
  Section (e) in the proposal above is honest, but I'm doubling down here: This *is* a dissertation topic. A 20-page paper can only assert the distinction; it cannot defend the resulting theory of obligation. If you get the grant, your goal for the paper should be to **prove the distinction exists**, not to **solve the justification**. If you try to solve the justification (i.e., give the full criteria for when interdiction is okay) in 20 pages, you will end up with platitudes. Use the six months to prove the *category* is real. Let the justification be the next project.

  **Departmental Allergy Check:**
  Your department hates "old arguments in new words." The risk here is that this looks like "Consequentialism vs. Deontology" dressed up in activist clothing. To avoid this, ensure Month 1 (Conceptual Mapping) explicitly addresses why this isn't just "ends justify means." The point isn't that interdiction has better consequences; it's that the *relationship to the law* is different. Make sure that lands hard, or the committee will smell utilitarianism and reject it.
