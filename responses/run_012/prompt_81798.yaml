prompt: |-
  Ok so my friend Dan and I just spent like two hours going back and forth on this and I need an outside take, because I'm pretty sure he's running some kind of trick arguement on me and I can't put my finger on where it breaks.

  The situation: my partner and I are looking at buying this house. Sitting here right now, I honestly think it's a bad idea — if you forced a number out of me I'd say maybe 35% that it turns out to be a good decision. But we're going to see it on Saturday, and I know myself: the second I'm standing in that kitchen with the light coming through, I'll be all in, like 85% sure it's the right move. I know this is going to happen. It happens every single time we look at a place.

  So my plan was basically: don't decide now. Wait till after we see it, decide then.

  Dan says that's incoherent. His arguement is: if you're going to trust the guy who walks out of that house on Saturday — trust him enough to hand him a decision this big — then you should just take his view right now. You already know what he's going to say. And if you DON'T trust him, if you think he's just going to be a starry-eyed idiot in a nice kitchen, then why are you letting him decide at all? Either way, "I'll decide later" is just you dodging the question.

  And I keep feeling like there's something off in this, but I can't say what. It's like he's claiming my future self's opinion should already be my opinion, and that just seems wrong, but I can't explain why "I'll decide later" isn't plain cowardice.

  Can you untangle it? I want to know what's actually going on when someone says "I know I'll feel different later, so I'll decide later." Is there a real difference between (a) my future self knowing something I don't yet, and (b) my future self getting swept up by a kitchen, and does that difference matter for whether I should in any sense defer to him? And here's the part that really bugs me: does the mere fact that I can predict I'll be at 85% on Saturday give me a reason to move my number up right now? If it does, Dan wins; if it doesn't, why not? And if he's right that deciding later is a dodge, what does that say about every big decision anyone ever makes by "sleeping on it"?
