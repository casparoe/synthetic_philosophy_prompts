      *   There's a specific hatred for *treating the office as an adversary* (managing information), yet Case 4 (partner) is excused despite managing information.
      *   Case 7 (£4) is judged harsher than Case 4 (Partner). Why? Perhaps because the partner is a fundamental life change, whereas an address is administrative? Or because the partner implies a shared household economy, whereas the address is just geography? Actually, the prompt says the protagonist *cannot bring themselves* to call the partner fraud, but *ought* to prosecute the address. This suggests the partner case is an emotional blind spot or based on a specific definition of "household."
