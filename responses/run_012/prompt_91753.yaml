      *   *Overturning:* The £4 Address. If privacy protects the partner, it should protect the address. Or, if honesty is required for the address, it's required for the partner. The prompt implies the author struggles with the Partner verdict. I will suggest the **Partner Verdict** is the one that strains the principle of "Adversary," but the **£4 Verdict** is the one that strains the principle of "Proportionality/Humanity."
      *   *Actually, the prompt asks:* "Tell me which of my verdicts you would have to overturn."
