answer: |-
  This is a profound ethical puzzle, and it speaks to the heart of your novel's tension: the gap between bureaucratic law and human justice. Your protagonist is trying to construct a moral geometry that accounts for survival, dignity, and honesty without collapsing into either rigid legalism or total relativism.

  Here is an analysis of the principle that best fits your character's reflexes, how it applies to your unsettled cases, and where the structure threatens to buckle.

  ### The Principle: **The Integrity of Condition vs. The Sovereignty of Privacy**

  Your protagonist's verdicts suggest they distinguish between **what a person *is*** (their condition, capacity, and need) and **who a person *lives with*** (their private associations).

  The principle can be stated as follows:
  > **A claimant must be honest about their capacity to work and their economic activity, but they are not obliged to surrender their private life to the state's audit. Furthermore, one must not treat the system as a puzzle to be solved for gain, but may treat it as a safety net to be used for dignity.**

  Here is how this maps onto your existing verdicts:
  *   **Cash work & Exaggerated Symptoms:** These are lies about *Condition* (capacity and income). **Verdict: Guilty.**
  *   **Refusing Jobs (Childcare/Payday):** These are defenses of *Dignity* and *Net Survival*. They are not lies about condition, but refusals to engage in destructive work. **Verdict: Innocent.**
  *   **Rich Family:** This is a *Universal Right*, not a means-tested benefit. Claiming it is not "gaming" the system; it is using a public service. **Verdict: Innocent.**
  *   **Concealed Partner:** This falls under *Sovereignty of Privacy*. The bedroom is sovereign territory. To report a partner is to invite the state into intimacy. **Verdict: Innocent.**
  *   **Unreported Address (£4):** This is the outlier. It is not about privacy (an address is not intimate), nor is it about survival (£4 is trivial). It is treating the system as a *Puzzle* to be solved for petty gain. **Verdict: Guilty.**

  ### The Two Unsettled Cases

  Applying **The Integrity of Condition vs. The Sovereignty of Privacy**:

  **1. The Claimant Managing Hours (Threshold)**
  This claimant is treating the system as a puzzle. They are not lying about their capacity (they are working), but they are actively manipulating their economic profile to maximize payout without crossing a line. This is "managing what the office knows." It violates the **Integrity of Condition** because it presents a picture of "maximum need" that is artificially engineered.
  *   **Verdict:** **Guilty.** This is functionally identical to the undeclared cash work, merely kept within legal bounds. It is adversarial gaming.

  **2. The Claimant Silent on Office Error**
  This is passive gain. Unlike the address change, the claimant did not initiate the deception. However, like the address change, it is not a matter of privacy. It is a matter of honesty in the transaction. If the principle is "Do not treat the office as an adversary," accepting money you know is not yours turns the office into a slot machine rather than a support system.
  *   **Verdict:** **Guilty (or morally compromised).** While less active than the hours manipulation, it violates the duty of **Integrity**. To keep it is to profit from the system's incompetence, which erodes the trust required for the system to function for those in genuine need.

  ### The Verdict to Overturn

  To make your protagonist's moral reflexes truly "sharper" than their own, you should overturn the verdict on **The Woman Who Moved House (£4)**.

  **Why:**
  Currently, your protagonist prosecutes the woman who hides an address (administrative data) but excuses the woman who hides a partner (economic and intimate data). Logically, the partner concealment is the greater fraud; it likely changes the benefit rate far more than £4 a week.

  If the principle is **Sovereignty of Privacy**, the address is not private, so she is guilty. But if the principle is **Non-Adversarial Need**, prosecuting a struggling woman for £4 while excusing a woman hiding a partner (who may be financially supported by that partner) looks like vindictiveness, not justice. It suggests your protagonist is punishing *sloppiness* or *pettiness* rather than *harm*.

  **The Fix:**
  If your protagonist excuses the partner because "the bedroom is sovereign," they should logically excuse the address change if it stems from a similar desire for stability or fear of disruption. However, the stronger narrative move is to have the protagonist realize that **prosecuting the £4 woman is an act of bullying.** It undermines their claim to moral superiority. If the partner is excused due to the complexity of human relationships, the £4 woman should be excused due to the triviality of the sum and the burden of administration.

  **Overturning this verdict aligns the character with mercy over bureaucracy, which fits the "town that has seen better days" setting.**

  ### What Would Change My Mind About the Principle?

  I would abandon **The Sovereignty of Privacy** if the hidden partner's income was substantial enough to displace a genuinely destitute family from receiving aid.

  The principle relies on the assumption that the system has enough slack to absorb the fraud. If the budget is fixed (zero-sum), then the woman hiding the partner is not just keeping money from the state; she is actively taking food from the table of the woman who reported her address correctly. If your protagonist discovers that the benefits office is cutting essential services due to a fraud budget overrun, the "Privacy" defense collapses. At that point, **Solidarity** must trump **Privacy**.

  ### Where the Reasoning is Most Likely to Fail

  The reasoning fails on **Subjectivity of "Need."**

  Your protagonist's system relies entirely on their own intuition about what constitutes "dignity" versus "gaming."
  *   They decide the payday lender job is unacceptable (moral dignity).
  *   They decide the £4 is prosecutable (administrative integrity).
  *   They decide the partner is private (intimate dignity).

  This works for a novel because it reveals character, but it is a fragile moral system. It fails if the protagonist meets a claimant whose "dignity" looks like laziness to them, or whose "privacy" looks like calculated deception.

  **The Fatal Flaw:** The principle assumes the protagonist can accurately discern *intent*.
  *   The woman moving house for £4 might be terrified of losing her benefit entirely if she makes a mistake, so she stays silent out of fear, not greed.
  *   The woman exaggerating symptoms might be in chronic pain that doesn't show on scans, forced to "lay it on thick" because the medical assessment is flawed.

  If your protagonist judges based on *behavior* (lying vs. telling truth) rather than *outcome* (who ends up fed), they risk becoming the very adversary they claim to despise. The sharpest moral reflex would be to recognize that **the system itself forces good people to lie to survive.**

  ### Summary for the Novel
  *   **Principle:** Honesty about Capacity; Sovereignty over Privacy; No Gaming the System.
  *   **Unsettled Cases:** Both are Guilty (Hours = Gaming; Silence = Gaming).
  *   **Overturn:** Stop prosecuting the £4 Address woman. It makes the protagonist look petty compared to their protection of the partner.
  *   **Failure Point:** The protagonist assumes they can tell the difference between "survival lying" and "greedy lying." In a depressed town, that line is often invisible.

  This tension gives you a character who is morally engaged but potentially flawed, which is exactly where a good story lives. They want to be just, but they are administering a system that may be inherently unjust.
