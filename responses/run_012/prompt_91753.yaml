  9.  **Final Polish:** Ensure the voice matches the literary context. Use terms like "narrative coherence," "moral geometry," "bureaucratic gaze."

      *(Self-Correction during drafting)*: I need to be careful not to just give legal advice. This is about *character psychology*. The principle should explain *why* the character feels this way, even if it's not legally sound. The character values **Human Truth** over **Administrative Truth**, except when the Human Truth is being used to game the system.

      *Revised Principle:* **The Principle of Authentic Need.**
      *   Legitimate: Claiming what you need to survive/live with dignity (Childcare refusal, Payday refusal, Rich family universal right).
