answer: |-
  This is one of the oldest and most persistent muddles in biology, and your discomfort is a sign of philosophical health, not confusion. The "gut verdicts" you describe are actually a sophisticated, if unarticulated, mixture of criteria that most professional biologists use pragmatically but struggle to define rigorously.

  As a philosopher of biology, I will not offer you a dictionary definition. Definitions in science are tools, not truths. Instead, I will help you identify the *tool* you are already using, sharpen it, and show you where it cuts against your intuitions.

  ### Part 1: The Candidate Criteria
  Let's lay out the components you and your friend are juggling. None of these is sufficient on its own, but they are the building blocks.

  1.  **Metabolism:** The ability to transform energy and matter to sustain order.
      *   *Failure:* Excludes dormant tardigrades and viruses.
  2.  **Self-Maintenance (Autopoiesis):** The ability to produce and repair one's own components and boundary.
      *   *Failure:* Excludes viruses (they don't build themselves; hosts do) and mules (eventually they decay without replacement).
  3.  **Reproduction:** The ability to make copies.
      *   *Failure:* Excludes mules, worker ants, and post-menopausal humans.
  4.  **Evolution by Natural Selection:** The capacity for heredity with variation leading to differential survival.
      *   *Failure:* Includes computer worms and potentially flames (in a loose sense), excludes individuals (you don't evolve; populations do).
  5.  **Membership in a Lineage:** Being the product of prior life.
      *   *Failure:* Makes the first life form impossible by definition; excludes synthetic life created from scratch.
  6.  **Having a Boundary:** A physical separation between "self" and "environment."
      *   *Failure:* Bubbles and oil droplets have boundaries; some fungi and aspen groves have模糊 (fuzzy) boundaries.
  7.  **Organism vs. Part:** The distinction between a whole entity and a component.
      *   *Failure:* Hard to define objectively. Is a tumour a part or a rogue organism? Is a mitochondrion an organelle or a prisoner?

  ### Part 2: The Best Fit for Your Verdicts
  Your intuitions are remarkably consistent with a specific cluster I will call **Historical Cellular Autopoiesis**.

  This principle states: **An entity is alive if it is a chemically bounded system capable of self-maintenance (metabolism) and belongs to a historical lineage of such systems.**

  Here is how it maps to your list:
  *   **Bacterium:** Yes. (Boundary, metabolism, lineage).
  *   **Flu Virus:** No. (No metabolism, no self-maintenance; it is a genetic parasite).
  *   **Prion:** No. (No boundary, no metabolism, just misfolded protein).
  *   **Mule/Ant:** Yes. (They are cellular systems from a living lineage; individual sterility doesn't negate the *system's* life).
  *   **Tardigrade:** Yes. (Metabolism is *potential*; the machinery for self-maintenance is intact, just paused).
  *   **Flame/Crystal:** No. (No cellular boundary, no historical lineage of reproduction).
  *   **Tumour/HeLa:** Yes. (They are cellular systems maintaining themselves. You correctly identify them as alive, even if they are pathological parts).
  *   **Mitochondrion:** No. (It lacks the machinery for *independent* self-maintenance now; it is a component, not a system).
  *   **Computer Worm:** No. (Not a chemical system).
  *   **Xenobots:** **Borderline.** (They are cellular aggregates, but engineered. They fit the physical criteria, failing only the "natural lineage" intuition).

  ### Part 3: The Verdict You Must Drop
  To make this principle clean, you cannot have it both ways regarding **origins**.

  You stated: *"A self-replicating RNA molecule someone built in a test tube: I keep flip-flopping; my gut says 'not yet'."*

  If you accept **Historical Cellular Autopoiesis**, you must drop this hesitation **if** that RNA molecule is enclosed in a self-maintaining lipid boundary and performs metabolism. If it meets the physical criteria of a cell, your gut saying "not yet" is inconsistent with your verdict on the Mule.

  The Mule is alive despite being sterile because it possesses the *machinery* of life derived from a lineage. If a synthetic protocell possesses the *machinery* of life (even if the lineage is human-made), it must be alive. You are currently holding out for a "spark" of naturalness that does not exist in the other cases.

  **The Sacrifice:** You must accept that **synthetic life is life**, provided it is chemically autopoietic. If you build a cell from scratch that eats, grows, and maintains its boundary, calling it "not alive" is a refusal to follow your own rule.

  ### Part 4: Predictions for New Cases
  Here is what **Historical Cellular Autopoiesis** predicts for the cases you haven't listed:

  1.  **A self-sustaining chemical reaction cycle with no heredity (e.g., an autocatalytic set):**
      *   **Verdict:** **Not Alive.**
      *   **Reasoning:** It fails the Lineage/Evolution criterion. It can maintain itself, but it cannot evolve or carry history. It is a "chemical fire," not an organism.
  2.  **A whole forest considered as one thing:**
      *   **Verdict:** **Not Alive (as a single unit).**
      *   **Reasoning:** It fails the Boundary/Autopoiesis criterion. The trees maintain themselves individually; the forest does not have a single membrane or unified metabolism. It is an *ecosystem*, not an *organism*.
  3.  **A robot that mines its own fuel and builds copies of itself:**
      *   **Verdict:** **Not Alive.**
      *   **Reasoning:** It fails the Chemical/Lineage criterion. While it mimics metabolism and reproduction, it is not a *chemical* system derived from the *biological* lineage. (Note: If we broaden "chemical" to "physical," this becomes a linguistic debate, but biologically, it remains a machine).

  ### Part 5: Status-Quo Bias and Confidence
  **The Bias:**
  Your hesitation on **Xenobots** and **Synthetic RNA** is **Carbon/Naturalness Bias**. You treat "biology" as a sacred category reserved for things evolved by natural selection over billions of years. But your verdict on the **Mule** proves you don't actually require natural selection to act on the *individual*. Your verdict on the **Tumour** proves you accept "rogue" biology. The only thing stopping you from calling a synthetic cell "alive" is the fact that *humans* made it. If you are consistent, origin matters less than organization.

  **Confidence Level:**
  I am **moderately confident** (about 75%) that this principle captures your intuitions better than any standard textbook definition. However, philosophy of biology is not physics; there is no "Law of Life."

  **The Weakest Step:**
  The step I am least sure about is the **Boundary Condition for Aggregates**.
  This is where **Xenobots** break my model. They are made of cells (alive), they self-repair (autopoiesis), but they are engineered aggregates without a natural lineage. My principle struggles to categorize them cleanly. Are they a "colony" or an "organism"? Your gut says "I have no idea." My principle says "They are living cellular aggregates," but admits this blurs the line between *being alive* and *being an organism*. This is the frontier where your definition will inevitably fray, and that is acceptable.

  ### Summary Advice for Your Friend
  Tell your friend their proposal ("work to hold itself together... hand that trick on") is excellent, but it needs one amendment: **The "work" must be chemical, and the "handing on" must be via a historical lineage of such systems.**

  This saves the Mule (it holds itself together, belongs to a lineage that hands it on), excludes the Virus (it doesn't do the work, the host does), and excludes the Flame (no lineage). It forces you to accept that if we ever build a chemical system that does that work, we have created life, whether we feel ready to call it that or not.
