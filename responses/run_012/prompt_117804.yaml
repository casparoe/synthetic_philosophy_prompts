      *   *Critique:* Is the brainstorming distinct?
      *   *Fix:* Use a clear header or section to separate the preliminary mapping from the committed analysis.

  7.  **Final Polish:** Check against the prompt's specific questions one last time.
      1.  Bearer? (The dyadic system).
      2.  Transplant survival? (Yes, but selection is punitive not reproductive).
      3.  Articulation? (Does not negate FFR; reasons can be represented without being the cause).
