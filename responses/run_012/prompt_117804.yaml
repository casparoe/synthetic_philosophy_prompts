          *   **Articulation:** Soldiers saying "we don't kill them because they don't kill us" is not the *source* of the rationale, it's the *detection* of it. The rationale exists even if they can't explain it (early phase). The theory needs to distinguish between *guiding* reasons and *explanatory* reasons.
          *   **Stability vs. Sensitivity:** FFR explains stability (it works). It struggles with sensitivity (why it stops). The collapse comes when High Command intervenes. This shows the FFR is local, not global.
