answer: |-
  Your hypothesis is correct, but it needs sharpening. You are right that this is not primarily a methodological dispute about how to collect data, nor is it a simple verbal dispute about the definition of "consciousness." It is a **metaphysical collision over the identity conditions of the explanandum.**

  Here is the diagnosis.

  ### 1. The Core Disagreement: Authority and Identity
  You identified the crux: *who has authority over the explanandum?* But the deeper issue is **what the explanandum actually is.**

  *   **Your Friend's Position (Phenomenal Realism):** The subject has **incorrigible authority** over the existence of the phenomenon. If it seems to them that there is a red-qualia, there *is* a red-qualia. The "what it is like" is the target. Therefore, the explanandum is an **intrinsic, non-relational property** of mental states.
  *   **Dennett's Position (Heterophenomenology/Illusionism):** The theorist has **final authority** over the ontology. The subject's report is a behavior caused by neural machinery. The "what it is like" is a **user-illusion** generated by that machinery. Therefore, the explanandum is the **functional capacity to generate self-reports.**

  When your friend says, "You've smuggled the hard part out," she is correct *relative to her framework*. Dennett *has* changed the subject. He has replaced "explain why this feeling exists" with "explain why the system claims this feeling exists."

  When Dennett says, "There is no hard part left," he is correct *relative to his framework*. If you successfully explain the machinery that generates the judgment "I am seeing red," and you show that there is no additional "inner screen" where the red is displayed, you have explained everything that *actually exists*.

  This is not a verbal dispute because both sides agree on the physical facts (wavelengths, neural firing, verbal reports). They disagree on **whether the "seeming" constitutes an additional fact.**

  ### 2. Is it Empirical?
  You asked if there is a hidden empirical question. **No.**

  The zombie argument is a modal claim, not an empirical one. Your friend is arguing from *conceivability* to *possibility*. She claims that a world physically identical to ours but lacking consciousness is conceivable, therefore possible, therefore physicalism is false.

  Dennett argues that zombies are *not* genuinely conceivable, only superficially imaginable. He claims that if you truly imagine a functional duplicate, you have imagined a conscious being, and the idea that it lacks "inner light" is a cognitive illusion.

  No experiment can resolve this. If you find a neural correlate of consciousness, Dennett says, "See, that's the machinery." Your friend says, "That's just the correlate, not the experience itself." The gap is not in the data; it is in the **interpretation of what the data exhausts.**

  ### 3. The "Explanatory Exclusion" Problem
  Your hypothesis about "what explanation is allowed to leave out" is the most productive angle.

  *   **Dennett** operates on a principle of **Explanatory Closure**: If you can explain the causal role of a state (discrimination, report, memory integration), you have explained the state. Anything "left over" is a philosophical artifact, not a natural phenomenon.
  *   **Your Friend** operates on a principle of **Explanatory Surplus**: Causal roles are relational. Experience is intrinsic. You can explain all the relations (inputs/outputs) without explaining the intrinsic node. Therefore, a complete causal explanation leaves out the *essence* of the thing.

  This is why you have fought twenty times without movement. You are arguing over whether **structural/functional description is exhaustive of reality.**
  *   If yes (Dennett), heterophenomenology is complete.
  *   If no (Friend), heterophenomenology is inherently incomplete by design.

  ### 4. Prospects for Progress
  You asked what would count as progress. Here is the honest assessment:

  **A. Conversion is unlikely.**
  Neither side will convince the other because the disagreement rests on **bedrock intuitions about reference.** Dennett intuits that "pain" refers to a functional syndrome. Your friend intuits that "pain" refers to a felt quality. These are pre-theoretical commitments. Arguments rarely overturn pre-theoretical commitments; they usually just reinforce them.

  **B. The "Illusionist" Pivot.**
  Progress is possible if Dennett's side admits they are **Illusionists**. Dennett sometimes resists this label, but it clarifies the stalemate.
  *   *The Move:* Admit that "qualia" (as your friend defines them) do not exist. They are a user-illusion.
  *   *The Result:* This forces the Friend to either accept that the Hard Problem is a demand to explain a fiction (like asking for the science of witchcraft) or double down that the illusion *itself* requires a non-physical explanation.
  *   *Why it helps:* It stops Dennett from claiming he is "solving" the Hard Problem. He is **dissolving** it. If you frame it this way, the Friend can stop accusing him of "leaving something out" and start accusing him of "denying the obvious." That is a clearer fight.

  **C. The "Hard Problem" as a Category Error.**
  The most substantive progress would come from investigating **why** the intuition of the Hard Problem arises. This is the path of **Cognitive Science of Philosophy**.
  *   Instead of asking "Is there a Hard Problem?", ask "What cognitive mechanisms lead humans to believe there is a Hard Problem?"
  *   If we can show that the intuition of "non-physical qualia" is a predictable byproduct of how the brain models its own states (e.g., lack of introspective access to processing leads to the inference of a simple, non-physical self), then Dennett wins on explanatory grounds without needing to convince the Friend phenomenologically.
  *   *Caveat:* The Friend will still say, "But why does that modeling *feel like* anything?" The question shifts but doesn't vanish.

  ### 5. Conclusion: The Diagnosis
  This is a **Framework Disagreement** masquerading as an Empirical one.

  *   **Dennett** is doing **Naturalized Phenomenology**: He is bringing the "mental" into the causal order by redefining it as a set of competencies.
  *   **Your Friend** is doing **Phenomenological Ontology**: She is taking the deliverances of introspection as the primary data for what exists.

  **What follows from your hypothesis:**
  If you accept that this is about **authority over the explanandum**, you must admit that **neither side can win on the other's terms.**
  *   Dennett cannot satisfy your friend without abandoning naturalism (admitting non-physical facts).
  *   Your friend cannot satisfy Dennett without abandoning the incorrigibility of introspection (admitting she might be wrong about "what it's like").

  **Recommendation:**
  Stop trying to solve the Hard Problem together. Acknowledge that you are working in **different research programs.**
  *   Dennett's program asks: "How does the brain generate the *belief* in consciousness?"
  *   Your friend's program asks: "How does the brain generate the *reality* of consciousness?"

  Progress lies in admitting these are different questions. If your friend insists they are the *same* question, the argument is over: she is asserting a metaphysical axiom that Dennett rejects. If you can get her to admit that Dennett is answering a *different* question (the science of self-modeling) rather than failing to answer *her* question, the heat will go out of the argument. You can then agree that Dennett is successful at his project, and she remains unsatisfied because her project requires resources Dennett rejects.

  That isn't a resolution, but it is a **dissolution of the conflict.** It moves you from "You are wrong" to "You are playing a different game." That is the only honest progress available here.
