answer: |-
  Dear colleague,

  I know the feeling you describe well, that specific intellectual itch that comes when the arithmetic of ethics collides with the texture of moral intuition. It is one thing to understand expected value in the abstract and quite another to feel the weight of it when the numbers concern living things that might be screaming silently. You are right to want your students to walk into that collision themselves rather than being told about it from the safety of a lectern. If they merely hear you describe the tension, it becomes a puzzle to be solved; if they feel it in the allocation of scarce resources, it becomes a dilemma to be endured. I have designed a activity called The Moral Portfolio that attempts to do exactly this, structured to fit your ninety-minute window with twenty undergraduates who have done no prior reading. The goal is to make the math do the moral work until the math breaks, forcing them to confront why it breaks.

  To set this up, you will need to divide the class into five groups of four students. Each group receives a envelope containing a budget of one hundred tokens, which represent units of moral concern or funding, and a deck of cause cards. There are no real stakes, but the constraint must feel real, so insist that they cannot carry over points and must allocate all one hundred tokens across the available causes. The cards are the engine of the simulation. Each card describes a specific intervention and lists two numbers: the population size affected and the credence of sentience. For the vertebrate causes, you want cards like Factory Farmed Chickens, which might list a population of ten million individuals and a sentience probability of ninety percent, or Laboratory Beagles, with a population of fifty thousand and a probability of ninety-five percent. For the insect causes, you want cards like Wild Insect Suffering, listing a population of ten trillion individuals and a sentience probability of one percent, or Crop Pest Eradication, with a population of one hundred trillion and a probability of point one percent. The expected value, calculated as population times probability, should be roughly comparable across the cards in the first round, or perhaps slightly tilted toward the insects to tempt the utilitarian calculation, forcing them to decide whether to follow the numbers or their gut.

  The first thirty minutes of the session are dedicated to Round One. You give them the cards and the tokens and tell them they must agree on a distribution. They will likely start by debating the moral worth of the animals, but you should intervene gently if they ignore the numbers, reminding them that the goal is to maximize expected moral impact based on the data provided. This forces them to engage with the arithmetic. When they finish, ask each group to write their allocation on the board. You will likely see a split, with some groups hedging and others going all-in on the high-probability vertebrates. Then you move to Round Two, which lasts about twenty minutes. Here, you introduce the variability of evidence. Hand each group a slider card or a new set of sticky notes that allows them to adjust the probability parameter for the insect cards. Tell them that new research is ambiguous and they can set the probability anywhere between point zero one percent and five percent. Ask them to re-allocate their budget. This is where the sensitivity analysis happens. They will discover that moving the probability from one percent to two percent doubles the expected value of the insect cause, often eclipsing the vertebrate causes entirely because of the massive population difference. The point here is not to teach them the correct probability but to show them how fragile their moral ranking is. A tiny shift in a parameter they cannot verify overturns their entire budget.

  In the final twenty minutes of the activity phase, you introduce the third element, the card you described as the heart of the matter. Call it the Cosmic Background card. It describes a theoretical phenomenon, perhaps quantum fluctuations in deep space or digital substrates in a server farm, affecting a population of ten to the power of twenty entities with a sentience probability of one in ten to the power of ten. The expected value is mathematically identical to the Wild Insect card they just funded, yet the conclusion feels absurd. Ask them if they will allocate points to this cause. Most will refuse. This creates the cognitive dissonance you are after. If they funded the insects because of the scale times probability calculation, they must now explain why that same calculation does not compel them to fund the Cosmic Background. If they refuse the Cosmic Background, they must explain why the insect calculation was valid. This forces them to articulate the hidden premise they were using, whether it is a threshold for probability, a discounting of vast numbers, or a qualitative difference in the type of entity.

  The remaining twenty minutes are for the debrief, and this is where you map their experience onto the philosophical concepts. You should start by asking them how it felt when the insect allocation jumped in Round Two. This is the moment to distinguish between a low credence that a creature is sentient and a low degree of sentience in it. Students often confuse thinking it is unlikely that a cricket feels pain with thinking that a cricket feels a little bit of pain. The activity treats these differently, and you can point out that their budget allocation assumed the former, which is why the numbers mattered so much. Next, address the question of whether individual insects or experiences are what get counted. The math counts individuals, but their moral discomfort might stem from wondering if a trillion insects mean a trillion experiences or just a lot of reflexive noise. Finally, discuss the option of refusing to multiply small probabilities by huge numbers at all. When they rejected the Cosmic Background card, they likely invoked a heuristic that says probabilities below a certain threshold do not count, effectively truncating the expected value calculation. You can name this as a form of risk aversion or a rejection of pure expected utility theory in the face of radical uncertainty.

  There are predictable ways this activity will go wrong, and you should be ready for them. One common failure is that groups will treat the tokens as money and try to maximize return on investment in a financial sense, losing the moral texture. To handle this, you must frame the tokens strictly as units of moral concern at the very start and remind them during the activity that there is no profit, only allocation of care. Another failure is math anxiety. Some students will freeze when faced with large numbers. You can mitigate this by providing calculators or having a teaching assistant circulate to help with the arithmetic so the ethics does not get bogged down in multiplication. A third failure is dominant voices. In groups of four, one utilitarian student might bulldoze the others. You can counter this by assigning roles, such as a scribe, a skeptic, and a calculator, rotating them if you have time, or simply instructing that everyone must sign off on the final allocation. The most dangerous failure, however, is that they treat the Cosmic Background card as a joke and dismiss it without thought. You must insist that they treat it with the same seriousness as the chicken card, reminding them that the math is identical, so the dismissal requires a philosophical justification, not just a shrug.

  You must also be honest with them about what the activity cannot do. It cannot tell them whether insects are sentient, and it probably cannot reproduce the texture of the uncertainty itself. The cards present clean numbers, but the real world offers thin evidence and conflicting studies. You will have to supply the state of the evidence yourself in the debrief, explaining that the one percent on the card is a placeholder for our actual ignorance. The activity simulates the structure of the decision, not the epistemic fog surrounding it. You should tell them that the discomfort they feel is not a bug but a feature, signaling that their moral framework is being stretched by the scale of the problem.

  Now I must turn to the question you asked about my own reasoning regarding this design. I believe the most likely point of failure lies in the gamification of suffering. By reducing moral patients to numbers on cards and moral concern to tokens, I risk teaching students that ethics is a spreadsheet exercise. If they leave the class thinking that the insect problem is just a matter of tweaking variables until the output looks reasonable, I have failed to generate the moral discomfort you are after. I have generated only arithmetic. What would change my mind about the viability of this design is evidence that students emerge from the simulation feeling relieved that they solved the puzzle, rather than unsettled by the ambiguity. If they treat the Cosmic Background card as a logic trick to be defeated rather than a mirror held up to their insect reasoning, then the activity has become a game of gotcha rather than an exploration of moral uncertainty. To prevent this, you must resist the urge to resolve the tension at the end. Do not tell them which allocation was correct. Leave them with the contradiction. If you solve it for them, you remove the burden of the uncertainty, and that burden is the only thing that might stick with them after the ninety minutes are over.

  There is also a risk that the activity privileges the utilitarian framework so heavily that non-utilitarian students feel alienated. If the rules demand expected value maximization, deontologists or virtue ethicists might disengage. You can handle this by framing the budget not as a mandate to maximize good but as a reflection of their current confidence. Ask them to allocate based on where they feel most sure their concern is warranted, rather than where the math says the most good is done. This shifts the focus from calculation to conviction, which might better capture the moral discomfort of acting under uncertainty.

  Ultimately, the success of this session depends on your willingness to let them struggle. You want them to run into the collision, which means you cannot pave the road for them. You must let them allocate the points, let them change the numbers, and let them reject the absurd card without immediately explaining why. The learning happens in the silence after they realize their reasoning is inconsistent. I hope this design serves you well, and I hope your students find the arithmetic as unsettling as we do.

  Warmly,

  Your colleague
