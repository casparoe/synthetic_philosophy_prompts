answer: |-
  Good evening. For those who don't know me, I'm one of the forty former students. I did my PhD here, and then I left physics for software engineering. So, I'm the person at this table who knows exactly what a Hamiltonian is, but also the person who will argue with you for an hour about type safety in programming languages.

  This split in the room—half physicists, half family—actually explains why I'm standing here. The physicists know [Advisor's Name]'s work. The family knows [Advisor's Name]. But both groups are here for the same reason: she teaches you how to tell the truth without lying.

  Her most famous model is a perfect example. As the physicists know, the story that model told about what the world is made of? It turned out to be wrong. The entities it posited aren't real. But the equations? They're still here. They're inside the replacement theory, barely altered.

  I remember her standing at the whiteboard during group meetings, watching us panic about the ontology, saying: "The story was wrong. The math was right. Notice which part keeps working."

  For a long time, I thought that was just pragmatism. But now, writing code for a living, I see it differently. In software, we distinguish between the *interface* and the *implementation*. The implementation is how the code works underneath—the specific machinery. The interface is what you can count on: what goes in, what comes out, and how the pieces connect.

  Implementations change. Languages die. Hardware rots. But a good interface? That lasts.

  My claim tonight is this: What survived in [Advisor's Name]'s model wasn't a picture of things. It was a map of relationships. And it isn't a coincidence that the math survived the death of the entities. It survived because the math was describing the interface nature presents to us, not the implementation hidden underneath.

  There is a philosophical worry that if you only talk about structure—about relationships—you aren't really saying anything about the world at all. That you could just assign any pattern you like to anything. But [Advisor's Name] knew the answer to that. She knew it because her equations had to work under pressure. They had to predict things they hadn't seen yet. You can't fake that. If the structure wasn't anchored in something real, it would have broken when the theory changed. It didn't break. It held.

  She never pretended the entities were real. She knew they were fictions. But she also knew that a fiction can tell the truth if it respects the structure of reality. She taught us that we might not know what the world *is*, but we can know how it *behaves*. And if you respect the behavior enough, long enough, the behavior tells you where the truth is hiding.

  So, to [Advisor's Name]. Thank you for teaching us that the story might fail, but the structure remains. Thank you for knowing the difference. And thank you for showing us that even when the entities are fictions, the work is real.

  To [Advisor's Name].

  ***

  **Note on Philosophical Liberties:**
  I committed to **Epistemic Structural Realism (ESR)** rather than Ontic Structural Realism. ESR claims we can only *know* the structure of the world, not the nature of the objects themselves, which fits the "useful fiction" narrative without making the metaphysical claim that objects *don't* exist (which would be OSR). I sidestepped the Newman objection (that structure is trivial) by emphasizing **predictive constraint**—the structure wasn't arbitrarily assigned but survived empirical pressure, implying non-trivial correspondence. I simplified the distinction between "interface" and "implementation" to make it accessible to the non-physicists without losing the philosophical core.
