prompt: |-
  I teach a unit on applied ethics every year, and the session on killing versus letting die has turned into a ritual. The students split into the usual camps — those who think the difference between doing something and merely letting it happen carries independent moral weight, and those who think it is a proxy for something else, whether intention, causal proximity, or the salience of the agent's contribution — and every year the same arguments get made and nobody is persuaded. What strikes me is that almost no one disputes the cases. We agree that switching the trolley feels different from pushing the fat man off the footbridge, that turning off a ventilator feels different from administering a lethal injection, and that the standard examples pull our intuitions in several directions at once; the fight is rarely about the facts, and only partly about the intuitions themselves. It is about what those intuitions are tracking. I have stopped believing that another clever case will break the deadlock, and I would like you to tell me why it will not — or why it might.

  My working hypothesis, which I would like you to test rather than take for granted, is that both camps are using the single phrase "the doing/allowing distinction" for two questions that need to be pulled apart. The first is a metaphysical or causal question: what did the agent actually do — did her body set a fatal process in motion, or did a process she could have interrupted simply run its course? The second is a normative question: does either causal role, just as such, generate a permission or a constraint that the other factors on the table do not already supply? If that split is right, I want to know whether the impasse dissolves once the two questions are separated, whether it merely relocates into the normative half, or whether a genuine substantive disagreement survives the separation — and if it survives, exactly what it is a disagreement about.

  So please give me a diagnosis, not a verdict. Say which parts of the dispute are verbal, which are disagreements about which facts count or about what the intuitions are evidence for, and which, if any, rest on starting points that neither side can argue for. Then tell me what would count as progress given your diagnosis — a sharper distinction, a case that actually discriminates between the camps rather than trading on some other difference, a formal result, or an argument that the question as posed is ill-posed — or, if you think no progress is available, why the debate can be expected to run forever without either side being unreasonable. Ground the diagnosis in what the two sides actually say about the cases, and be candid about the parts of the disagreement you cannot resolve.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** An ethics professor teaching a unit on applied ethics, specifically the "killing vs. letting die" (doing vs. allowing) distinction.
      *   **Context:** The class discussion has become a ritualistic deadlock. Students agree on the cases/intuitions (e.g., Trolley vs. Footbridge, Ventilator vs. Injection) but disagree on *what those intuitions track*.
      *   **User's Hypothesis:** The phrase "doing/allowing distinction" conflates two questions:
          1.  *Metaphysical/Causal:* What did the agent actually do? (Set motion vs. let run course).
          2.  *Normative:* Does that causal role *itself* generate moral weight independent of other factors (intention, duty, etc.)?
      *   **Task:** Test this hypothesis. Provide a *diagnosis*, not a verdict. Identify verbal disputes, factual/evidential disagreements, and foundational starting points. Determine if progress is possible (sharper distinction, discriminating case, formal result, dissolving the question) or if the debate is inherently perpetual.
      *   **Tone:** Philosophical, analytical, candid, grounded in the literature/arguments, respectful of the deadlock.

  2.  **Deconstruct the User's Hypothesis:**
      *   *Question 1 (Metaphysical/Causal):* Is there a clear line between doing and allowing? (The "Act/Omission" distinction).
      *   *Question 2 (Normative):* Is that line morally significant *per se*? (The "Moral Significance" claim).
      *   *The User's Claim:* Separating these might dissolve the impasse or relocate it.

  3.  **Evaluate the "Metaphysical/Causal" Question (The Descriptive Distinction):**
      *   *Problem:* Is there actually a coherent metaphysical distinction?
      *   *Literature:* Quinn (actions vs. omissions), Foot (negative/positive duties), Thomson (causal sequences).
      *   *Issue:* Many philosophers argue the distinction is elusive. Is turning off a ventilator "doing" (flipping a switch) or "allowing" (stopping treatment)? Is starving someone "allowing" (not feeding) or "doing" (withholding)?
      *   *Diagnosis:* A significant portion of the deadlock is verbal/conceptual here. If Side A defines "killing" as "initiating a new causal chain" and Side B defines it as "being the sufficient condition for death," they talk past each other.
      *   *Verdict on Q1:* The metaphysical distinction is notoriously slippery. Much of the debate is indeed verbal here.

  4.  **Evaluate the "Normative" Question (The Moral Significance):**
      *   *Problem:* Even if we agree on the description, does it matter morally?
      *   *Side A (Distinctive Weight):* Yes, there is a constraint against killing that doesn't apply to letting die. (e.g., Doctrine of Doing and Allowing, Rights-based views).
      *   *Side B (Proxy View)::* No, the moral difference is explained by *other* factors (intention, prior obligation, cost, causal proximity). The "doing/allowing" label is just a placeholder for these deeper variables.
      *   *Diagnosis:* This is where the *substantive* disagreement lies. It's not about the cases (everyone agrees killing is usually worse); it's about *why*. Is it a brute moral fact, or derivative?
      *   *Foundational Starting Points:* This rests on deeper meta-ethical commitments (Deontology vs. Consequentialism, Rights vs. Duties). These are hard to argue for without circularity.

  5.  **Synthesize the Diagnosis (Testing the Hypothesis):**
      *   *Does separating the questions help?* Yes, it clarifies *where* the fight is.
      *   *Does it dissolve the impasse?* No. It relocates it to the Normative question.
      *   *Why?* Because the "Proxy" camp argues the Metaphysical distinction is often indeterminate *and* normatively inert. The "Distinctive Weight" camp argues the Metaphysical distinction is robust enough to bear moral weight.
      *   *The Real Sticking Point:* It's not just Q1 vs. Q2. It's that Q2 depends on Q1, but Q1 is often defined *by* Q2. (We call it "killing" because it feels wrong, not vice versa).

  6.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the professor's insight. Validate the hypothesis. State the thesis: The hypothesis is correct but incomplete. Separating the questions clarifies the topology of the disagreement but reveals a deeper structural problem.
      *   **Part 1: The Metaphysical/Causal Question (The Verbal/Conceptual Layer):**
          *   Analyze the "what happened" question.
          *   Point out that "doing" and "allowing" are not natural kinds. They are interest-relative descriptions (cite Bennett or Duggan).
          *   *Diagnosis:* A large chunk of the deadlock is verbal. Students are using different criteria for individuating actions.
      *   **Part 2: The Normative Question (The Substantive Layer):**
          *   Analyze the "does it matter" question.
          *   Distinguish between the *Doctrine of Doing and Allowing* (DDA) as a brute constraint vs. the *Explanatory Proxy* view.
          *   *Diagnosis:* This is the substantive core. It's a clash of moral architectures (Rights/Constraints vs. Outcome/Duty optimization).
      *   **Part 3: The Interaction (The Feedback Loop):**
          *   Crucial insight: The two questions aren't independent. We often decide the metaphysics based on the morality. (e.g., "This can't be 'allowing' because it's so wrong.").
          *   This explains why new cases fail. New cases just trigger the feedback loop again.
      *   **Part 4: Prospects for Progress:**
          *   *What won't work:* More intuition pumps (Trolley variants). They are too noisy.
          *   *What might work:*
              1.  *Formal/Structural:* Show that the "Proxy" view requires a complex conspiracy of variables, whereas the "Distinctive Weight" view is parsimonious (or vice versa).
              2.  *Error Theory:* Argue the distinction is a heuristic that fails in edge cases (medical ethics).
              3.  *Reframing:* Shift from "Doing/Allowing" to "Rights Violations vs. Duty Fulfillment."
          *   *The Hard Limit:* Acknowledge that ultimate foundational commitments (Deontology vs. Consequentialism) are not rationally resolvable in a semester.
      *   **Conclusion:** Summarize. The debate runs forever not because students are unreasonable, but because they are arguing from different moral grammars.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I answer the prompt's specific constraints? "Diagnosis, not verdict." "Ground in what two sides say." "Candid about unresolvable parts."
      *   *Correction:* Make sure I don't take a side. Don't say "Consequentialism is right." Say "The disagreement rests on the priority of constraints vs. outcomes."
      *   *Nuance:* Ensure I address the "Proxy" view carefully. It's not just "intention." It's often about *baseline expectations* (what was the agent already required to do?).
      *   *Key Insight to Include:* The "Baseline Problem." To know if I allowed death, we must know if I was obligated to prevent it. But knowing if I was obligated often depends on whether I killed or allowed. This circularity is the engine of the deadlock.

  8.  **Final Polish:** Check tone. Ensure it sounds like a colleague speaking to a colleague. Use philosophical terminology correctly (DDA, causal sequences, baselines, counterfactuals). (Self-correction: Ensure I mention Foot and Quinn as they are standard in this literature).

  9.  **Final Output Generation:** (Proceed to generate response based on these structured thoughts.)
answer: |-
  Your hypothesis is astute, and it correctly identifies the structural flaw that keeps your classroom debate in orbit without landing. You are right to suspect that the phrase "the doing/allowing distinction" is doing too much work. However, testing your hypothesis reveals that separating the metaphysical question from the normative one does not dissolve the impasse; rather, it exposes a circular dependency between the two that explains why the debate is perennial.

  Here is a diagnosis of the deadlock, categorized by the nature of the disagreement, followed by an assessment of what progress is actually available.

  ### 1. The Metaphysical/Causal Question: A Verbal and Conceptual Dispute
  **Diagnosis:** *Largely Verbal / Indeterminate*

  Your first camp (the "Distinctive Weight" camp) often assumes there is a clear, pre-moral fact of the matter about whether an agent "did" something or "allowed" it. Your second camp (the "Proxy" camp) often argues that the description of the action is inseparable from the normative context.

  When students argue about whether turning off a ventilator is "killing" or "letting die," they are rarely disagreeing about the physics of the switch or the biology of the patient. They are disagreeing about **individuation criteria** and **baselines**.

  *   **The Verbal Element:** One side individuates actions by *bodily movement* (flipping a switch is a doing). The other individuates by *causal sequence* (removing an obstacle to a pre-existing threat is an allowing). Since there is no consensus in action theory on which criterion is the "correct" one for moral purposes, this part of the debate is verbal. They are using the same words to describe different ontological categories.
  *   **The Baseline Problem:** To determine if I "allowed" a death, we must establish what I was obligated to prevent. If I was obligated to keep the ventilator on, turning it off looks like killing. If I was not obligated, it looks like allowing. But often, our judgment about the obligation *depends* on whether we think turning it off is killing.
  *   **Why Cases Fail:** This explains why new cases don't break the deadlock. A new case (e.g., a new medical scenario) simply invites the two sides to apply their different individuation criteria. The "Proxy" camp will always be able to redescribe a "doing" as an "allowing" by adjusting the baseline of expected behavior, and the "Distinctive Weight" camp will always be able to point to the bodily intervention as the salient cause.

  **Verdict on Q1:** Separating this question helps students see they are arguing about action description, not morality. But it does not resolve the dispute because there is no neutral vocabulary for describing actions that doesn't already smuggle in normative assumptions.

  ### 2. The Normative Question: A Substantive but Foundational Dispute
  **Diagnosis:** *Substantive / Foundational*

  Once you force the class to agree on a description (e.g., "Let's stipulate this is a case of allowing"), the real fight begins: *Does this description carry independent moral weight?*

  *   **Side A (Distinctive Weight):** Argues that the moral constraint against imposing harm is stricter than the duty to prevent harm. This is often rooted in a **Rights-Based** or **Deontological** framework. The agent's integrity or the victim's right not to be used is the primary moral unit.
  *   **Side B (Proxy View):** Argues that the moral difference is exhausted by other variables: intention, cost to the agent, causal proximity, or prior duty. This is often rooted in a **Consequentialist** or **Optimizing** framework. The state of affairs (death) is the primary moral unit; the path to it matters only insofar as it affects future outcomes or indicates bad character.

  **Why the Impasse Survives Separation:**
  Even if you separate the metaphysics from the normativity, the disagreement relocates entirely into the normative half. Side A claims the "doing/allowing" status is a *fundamental moral primitive*. Side B claims it is a *derivative heuristic*.

  This is not a disagreement that can be settled by cases, because both sides can accommodate the cases.
  *   *Side A* says: "We intuit it's worse to push the fat man because of the doing/allowing constraint."
  *   *Side B* says: "We intuit it's worse to push the fat man because of the violation of bodily autonomy and the direct intention, which correlate with doing but are distinct from it."

  Both sides predict the same intuition; they disagree on the *explanation*. This is a disagreement about moral architecture, not moral data.

  ### 3. The Feedback Loop: Why the Distinction Cannot Be Held Apart
  **Diagnosis:** *Structural Circularity*

  Here is the crucial reason why your hypothesis, while correct, doesn't end the debate: **The two questions are not independent.**

  In practice, moral agents determine the metaphysics *based on* the normativity. We often decide whether an act counts as "killing" or "letting die" based on how wrong we feel it is.
  *   If an act feels heinously wrong, we are prone to categorize it as "killing" (metaphysical upgrade).
  *   If an act feels regrettable but permissible, we categorize it as "letting die" (metaphysical downgrade).

  This creates a **hermeneutic circle**. The "Distinctive Weight" camp uses the moral intuition to justify the metaphysical classification, which is then used to justify the moral intuition. The "Proxy" camp tries to break the circle by insisting on a neutral metaphysics, but the "Distinctive Weight" camp argues that a neutral metaphysics misses the moral reality.

  This is why the debate runs forever. It is not that students are being unreasonable; it is that they are operating within different **moral grammars**. One grammar treats "agency" as the locus of value (constraints on action); the other treats "welfare" as the locus of value (optimization of outcomes). The "doing/allowing" distinction is the friction point where these two grammars rub against each other.

  ### 4. Prospects for Progress

  Given this diagnosis, here is what counts as progress and what does not.

  **What Will Not Work:**
  *   **More Cases:** As you have noticed, intuition pumps are Rorschach tests. Side B will always find a proxy variable (intention, cost) to explain away the intuition Side A attributes to the distinction.
  *   **Definitions:** Stipulating a definition of "killing" will not work because the normative stakes will immediately bleed back into the definition (the Baseline Problem).

  **What Might Count as Progress:**
  1.  **Shift from Metaphysics to Rights/Duties:**
      Progress lies in abandoning the "doing/allowing" language in favor of "violating rights vs. failing to aid."
      *   *Why:* This forces the "Proxy" camp to admit that rights might generate constraints that look like the doing/allowing distinction, and forces the "Distinctive Weight" camp to admit that the distinction is grounded in rights, not causal physics. It moves the debate to the *source* of the normativity (rights vs. outcomes) rather than the *label* of the action.
  2.  **The "Cost" Variable:**
      Focus on cases where the cost to the agent varies.
      *   *Diagnostic Value:* If the "Proxy" camp is right, the moral difference should vanish when the cost of allowing is high (e.g., I must lose an arm to save you) vs. the cost of doing is low. If the "Distinctive Weight" camp is right, the constraint against killing should hold even at high cost. Isolating *cost* as a variable helps disentangle the "proxy" factors from the "distinctive" factor.
  3.  **Formal/Structural Argument:**
      Ask the "Proxy" camp to list *all* the variables that make killing worse than letting die (intention, certainty, proximity, etc.). Then present a case where all those variables are held constant, but the doing/allowing status changes.
      *   *Progress:* If the intuition shifts, Side A wins. If the intuition stays the same, Side B wins.
      *   *Caveat:* Side B will argue you cannot hold all variables constant (the "inseparability thesis"). Acknowledging this inseparability is itself progress: it admits that the distinction may be real but not isolatable.

  **The Unresolvable Core:**
  You must be candid with your students that a substantive disagreement will survive. It rests on **foundational starting points**:
  *   **The Priority of the Negative:** Is the duty not to harm *lexically prior* to the duty to help? (Side A)
  *   **The Equivalence of Outcomes:** Is a death caused by me morally equivalent to a death prevented by me, ceteris paribus? (Side B)

  Neither side can argue for this without begging the question. Side A cannot prove the priority of the negative without appealing to the intuition that killing is worse. Side B cannot prove the equivalence of outcomes without appealing to the intuition that only states of affairs matter.

  ### Summary Recommendation for the Classroom

  Do not try to solve the distinction. Instead, diagnose the deadlock *with* them.

  1.  **Validate the Hypothesis:** Explicitly teach the split between the Metaphysical Question (What happened?) and the Normative Question (Does it matter?).
  2.  **Expose the Circle:** Show them how their judgment of "what happened" is influenced by "how wrong it feels."
  3.  **Reframe the Conflict:** Tell them they are not arguing about trolleys; they are arguing about whether morality is primarily about **constraints on agents** (Deontology/Rights) or **optimization of states of affairs** (Consequentialism/Welfare).
  4.  **Define Progress:** Progress is not persuading the other side. Progress is recognizing that the "doing/allowing" distinction is the *symptom* of a deeper clash in moral theory.

  The debate runs forever not because the distinction is obscure, but because it is the fault line between two incompatible ways of seeing the moral world. You cannot bridge that fault line with a better case; you can only map it.
