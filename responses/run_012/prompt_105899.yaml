prompt: |-
  I'm an undergraduate in a philosophy of science course who also has a working background in statistics — likelihoods and priors, sampling distributions, testing a hypothesis versus estimating a parameter, comparing models. When we covered Hempel's raven paradox I had the strong sense that everything in it could be said in that statistical vocabulary and that, once said, it either becomes obvious or dissolves. Please do that restatement systematically, and then give me the residue report. Render the paradox in the terms I actually use: the hypothesis that all ravens are black, the two things that are supposed to confirm it (a black raven and a green apple), and the worry that this makes ornithology turn on arbitrary facts about apples. Then tell me which parts of Hempel's apparatus translate cleanly into statistical inference, which translate only with distortion, and which have no counterpart at all — in particular, the principle that a generalization is confirmed by its positive instances, the role of how the objects in the domain are sorted into kinds, and the demand that confirmation be a purely logical relation between evidence and hypothesis. Take a definite position on the residue: is it a defect of the statistical vocabulary, or does it show that Hempel's notion of confirmation was doing less than it appeared to? Give your reasons and defend one verdict rather than laying out both sides.
