prompt: |-
  I'm an RL enginer, working mostly on model-based agents with a learned world model and a policy that maximizes reward. I'm trying to get my head around teleosemantics -- the view that a state represents something because of its proper function, what it was selected to do, and that this is what lets it misrepresent. Restate that view in the vocabulary I actually use: observations, latent states, policies, reward, credit assignment, generalization, distribution shift, information bottlenecks. Then give me the residue report. What maps cleanly? What only maps if I squint? What has no counterpart at all? And the case I care about: my world model's latent state is systematically wrong about the environment, but the policy still scores high reward. Is that misrepresentation in the teleosemantic sense, or just a useful fiction? If the residue is real, does it show my framework can't naturalize content, or that teleosemantics was sneaking in something normative?
