answer: |-
  ### Research Priorities for a Sortition/Election Bicameralism Project

  Given your constraints (two philosophers, 24 months, no empirical budget), your comparative advantage lies in **conceptual clarification** and **normative justification**. You cannot solve the empirical risks of sortition (e.g., "will lobbyists capture them?"), but you can define the theoretical conditions under which those risks become fatal or manageable.

  The following ranking prioritizes questions based on **logical dependency**. If Question #1 is not resolved, Questions #2 and #3 lack a foundation. If #2 is unresolved, institutional design is blind. #3 is critical for stability but depends on the first two defining the role.

  ---

  ### 1. The Normative Justification for Asymmetric Power (The Veto)
  **Why it is upstream:** This is the foundational legitimacy problem. In standard democratic theory, legitimacy flows from consent (elections) or equality (lottery). Your proposal grants the lottery chamber a *negative* power over the consent chamber. You must establish why a random sample has the moral authority to *stop* the will of the elected majority, but not necessarily *initiate* law. If you cannot theoretically justify why the "veto" is democratic rather than obstructive, the rest of the project is merely engineering a tyranny of the minority.
  **Tractability (High for Philosophers):** This is pure political theory. You can engage with literature on negative power (e.g., Holmes & Sunstein), epistemic democracy (Landemore), and the distinction between "will" (elections) and "judgment" (sortition). You do not need data; you need argumentation.
  **What would move it:**
  *   **Up:** If you find existing literature completely ignores the normative asymmetry of veto power in mixed constitutions.
  *   **Down:** If you discover a robust existing framework (e.g., a specific interpretation of "mixed government" theory) that already solves this, allowing you to take it as a premise.

  ### 2. The Epistemic Boundaries of Lay Judgment
  **Why it is upstream:** Once you justify the veto, you must define its *scope*. Random citizens are not policy experts. There must be a theoretical limit to what they are competent to judge. Is their veto valid on moral grounds only? Fiscal grounds? Procedural grounds? If you cannot define the *epistemic boundary* of what a layperson can validly assess, you cannot design the legislative workflow. This question dictates whether the sortition chamber reviews the *text* of bills or the *impact* of bills.
  **Tractability (Medium-High):** This requires epistemology applied to policy. You can analyze the difference between "technical knowledge" (tax code syntax) and "value knowledge" (fairness of tax distribution). This is a conceptual distinction well-suited to philosophical analysis.
  **What would move it:**
  *   **Up:** If your initial work on the Veto (Q1) suggests the sortition chamber represents "public interest" rather than "popular will," requiring a strict definition of that interest.
  *   **Down:** If you decide the chamber has a "general veto" without scope limits, rendering the epistemic question moot (though this weakens the project's plausibility).

  ### 3. The Theory of Non-Electoral Accountability
  **Why it is upstream:** Your design removes re-election (the standard accountability mechanism) and replaces it with a 10-year cooldown. You need a theoretical account of what motivates compliance and restraint in the absence of electoral punishment. Is it civic duty? Peer monitoring? Transparency? Without a theory of *why* they wouldn't be corrupt or negligent, the legitimacy established in Q1 collapses. This is upstream of specific institutional safeguards (like transparency rules) because you need to know *what* you are safeguarding against.
  **Tractability (Medium):** This borders on political psychology, but the philosophical core is the nature of "responsiveness" without "retrospective voting." You can theorize accountability as "answerability" rather than "punishability."
  **What would move it:**
  *   **Up:** If Q1 and Q2 establish the chamber as a "Guardian" body, which historically raises fears of elitism or capture, making accountability the primary vulnerability.
  *   **Down:** If you treat the 10-year cooldown as a purely empirical constraint (i.e., "we assume this prevents careerism") rather than a normative feature requiring justification.

  ---

  ### Questions to Skip (and Why)

  **1. "Descriptive Representation" (Sample Size and Demographics)**
  *   **Reason to Skip:** This is a statistical problem, not a philosophical one. Determining the sample size required to mirror the population within a margin of error is a math question for political scientists or statisticians. Settling this does not change the *normative* argument for why that sample should have power.
  *   **Impact:** Low. Whether the chamber is 100 or 500 people does not alter the moral justification for the veto.

  **2. "Civic Education and Training Curricula"**
  *   **Reason to Skip:** This is a policy/implementation detail. While important for real-world rollout, theorizing the *content* of training is speculative without empirical data on learning rates.
  *   **Impact:** Low. Your project is about the *legitimacy of the structure*, not the *syllabus of the orientation*.

  **3. "Historical Precedents (Athens, Venice, etc.)"**
  *   **Reason to Skip:** Historical analysis is descriptive. Knowing that Athens used sortition does not tell us whether a *veto-wielding* sortition chamber is justifiable in a modern liberal democracy.
  *   **Impact:** Low. Relying on history often leads to the "naturalistic fallacy" (it was done, therefore it is good). Your project needs normative force, not historical pedigree.

