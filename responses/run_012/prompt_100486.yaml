  **The Scenario**
  In a cramped pottery studio, Elara centers a wet, formless lump of clay on the wheel, her hands guiding it into the precise shape of a dancer. She doesn't stop at shaping; she pushes the piece into the kiln and fires it to vitrification. When the kiln cools, the dancer stands hard and permanent, but the original lump of clay is chemically gone—dehydrated and sintered into ceramic. The matter remains, occupying the same space, but the *lump of clay* has ceased to exist through the change of kind, while the *statue* has survived the transition from plastic mud to stone-like ceramic, emerging intact where the lump did not.

  **The Walkthrough**
  *   **The Constitution View:** This view holds that the statue and the lump are distinct objects that share the same matter. In your scenario, the Constitutionalist agrees they come apart: the lump has strict persistence conditions tied to being "clay" (or perhaps "amorphous"), so the firing destroys it. The statue, however, has persistence conditions tied to its form or function, allowing it to survive the chemical change. They coincide temporarily, then diverge when the lump dies and the statue lives on.
  *   **The Identity View (Statue = Lump):** This view claims there is only one object here. Consequently, this philosopher will deny your description of events. They will argue that if the statue is still there, the lump *must* still be there, merely changed in property. To say the lump is gone while the statue remains is a contradiction for them; they would insist you are mislabeling the surviving object or that the lump simply altered its properties rather than ceasing to exist.
  *   **The Nihilist (No Statues):** This view denies that composite objects like statues or lumps exist at all; there are only particles arranged statue-wise. For them, nothing "came apart" because nothing was together to begin with. The particles rearranged and bonded differently, but no object survived or perished.

  **The Single Feature**
  The work is being done entirely by the **change in material kind** (clay to ceramic). This is the only lever that allows you to claim the "lump" is gone while the matter remains. Without a change in the chemical or structural kind of the material, you cannot plausibly claim the constituting lump has vanished while the constituted statue persists.

  **Removing the Feature**
  If you take away the firing process and simply let the clay dry or stay wet, the material kind remains "clay." In this case, almost all metaphysical views agree that the lump survives alongside the statue. The awkward divergence disappears, and you return to the standard puzzle where the lump is more durable than the statue (e.g., if you squash it, the statue dies but the lump remains).

  **The "Rigged" Objection**
  A critic will argue you have begged the question by defining the "lump" as essentially *clay* or essentially *amorphous*. They will say you haven't discovered a metaphysical truth but merely stipulated a definition where "lump" cannot survive firing. They will argue that if we define the lump as "this quantity of matter" (the standard philosophical definition), it survives the firing just as the statue does, and your scenario collapses back into coincidence rather than divergence.

  **Straight Talk**
  You asked me to be straight: **Under standard metaphysical definitions, what you are asking for is impossible.** In analytic metaphysics, a "lump" is typically defined as the material constituent itself, tracked by matter, not by shape or chemical kind. If the matter is there, the lump is there. To make the lump vanish while the statue remains, you must adopt a non-standard definition where "lump" refers to a temporary phase or a specific material kind rather than the matter itself. You can write the scene this way, but know that you are forcing a specific, controversial metaphysical commitment onto your characters; a knowledgeable reader will spot that you've defined "lump" out of existence to make the trick work.

  **Note on Metaphysical Liberties**
  This scenario takes liberties by treating a chemical phase change (vitrification) as the ontological destruction of an object ("the lump") rather than a modification of it. It also glosses over the mass loss during firing (water weight), which technically violates "same material stays put" at the atomic level, though it holds roughly at the macroscopic level.
