  This advice works if the differences are innate. It works if they are cultural. It works if they are artifacts. It does not solve the mystery, but it allows you to live within it. You will encounter people who claim the science is settled. They will tell you that barriers are gone and all remaining patterns are preference. They will tell you the finding is a myth and should be ignored. Both statements close the question. I am asking you to keep it open. Certainty is comforting, but it is often purchased at the price of truth.

