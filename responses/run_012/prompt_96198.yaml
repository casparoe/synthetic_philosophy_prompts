answer: |-
  **DEPARTMENT OF FELICIFIC AUDIT**
  **BUREAU OF PRIVATE CONDUCT**
  **FORM 77-B: FIELD INSPECTION & UTILITY CALCULATION**

  **SECTION I: EXTRACT FROM INSPECTOR'S MANUAL (9th Ed.)**

  **3.4 Calibration of the Hedonimeter**
  Inspectors must ensure all subjects are fitted with standard-issue dermal sensors prior to commencement. Where sensors are impractical, retrospective self-reporting scales (1–100) shall be converted to standard hedons using the Interpersonal Conversion Table (Appendix C). Note: One unit of pleasure for Subject A is equivalent to one unit for Subject B, regardless of social status or cognitive capacity.

  **3.7 The Consent Coefficient**
  Consent is not a binary prohibition but a variable affecting the *Certainty* and *Purity* dimensions. Verified consent increases the Certainty of pleasure by a factor of 0.9. Lack of consent introduces a Pain of Coercion variable sufficient to negate Intensity. However, Consent does not immunize an act against negative scoring in *Extent* or *Purity*.

  **4.1 Data Integrity (The Inspection Principle)**
  To ensure accurate baseline behavior, subjects must remain uncertain regarding the timing of specific inspections. Continuous data streams are preferred. The mere possibility of audit ensures compliance with reporting protocols.

  **4.5 Calculating Social Sanctions**
  Pain arising from community disgust, shame, or legal penalty must be recorded under *Purity* (likelihood of subsequent pain) and *Extent* (number of persons affected). The origin of the pain (e.g., irrational prejudice) is irrelevant to the calculation; only the magnitude matters.

  ***

  **SECTION II: FIELD REPORT**

  **Case ID:** 8940-L
  **Location:** Private Residence, District 4
  **Act Type:** Sexual Intercourse (Non-Procreative, Same-Sex)
  **Subjects:** A (Male), B (Male)
  **Inspector:** J. Wilson

  **DIMENSIONAL ANALYSIS**

  **1. Intensity:** 85 hedons (Peak sensor reading).
  **2. Duration:** 45 minutes. Weighted score: 60 hedons.
  **3. Certainty:** 0.9 (Consent verified via verbal contract and sensor sync).
  **4. Propinquity:** Immediate. Discount factor: 1.0.
  **5. Fecundity:** 0.0 (No issue expected; no downstream pleasure anticipated).
  **6. Purity:** **NEGATIVE.**
     *   *Physiological Aftereffect:* Neutral.
     *   *Anticipatory Shame:* -40 hedons (Subjects report anxiety regarding legal status).
     *   *Risk of Sanction:* -30 hedons (Probability of prosecution based on current statute).
     *   *Net Purity Score:* -70 hedons.
  **7. Extent:** **NEGATIVE.**
     *   *Participants:* +2 persons.
     *   *Community:* -14,000 persons (District population).
     *   *Displeasure Coefficient:* Average disgust rating of 0.5 hedons per citizen upon knowledge of act.
     *   *Net Extent Score:* -7,000 hedons.

  **TOTAL UTILITY CALCULATION**

  **Private Gain:** (Intensity + Duration) × Certainty = 130.5 hedons.
  **Public Loss:** (Purity + Extent) = -7,070 hedons.
  **NET SOCIAL UTILITY:** -6,939.5 hedons.

  **DETERMINATION**

  Despite high private intensity and verified consent, the act generates a net deficit of utility. The primary drivers of negative utility are the Pain of Shame (derived from current legal prohibition) and the Pain of Disgust (derived from community moral preference).

  Under Section 4.5, the source of the pain is immaterial. The law creates the shame, but the shame counts against the law's permission. The community's prejudice creates the pain, but the pain validates the community's prejudice within the sum.

  **RECOMMENDATION**

  Prohibition remains the efficient default. To permit the act would require disregarding the verified pain of the majority (Extent) and the institutional pain of the sanction itself (Purity).

  **AUDITOR'S NOTE:**
  *Some senior theorists argue that pains derived solely from prejudice should be zero-weighted to prevent circular justification of prohibition. However, no protocol exists for distinguishing "rational" pain from "irrational" pain without introducing non-utilitarian criteria. Until further notice, continue to count all reported pains equally. If the calculus forbids the act, but the legislator permits it, record the discrepancy under "Legislative Mercy."*

  **Status:** [ ] Approved [X] Prohibited [ ] Pending Review
  **Signature:** *J. Wilson, Senior Auditor*
