answer: |-
  # The Meta-Rule Vetting Protocol

  Use this checklist for any proposed rule that references "rules," "decisions," "committees," or "enforcement." Do not proceed to the next step until the current one is resolved.

  ### Step 1: Scope and Reference
  **Question:** Does this rule explicitly or implicitly apply to the rulebook, the committee, or the enforcement process itself?
  *   **Answer "No":** Pass to standard policy review. Stop here.
  *   **Answer "Yes":** Proceed to Step 2.

  ### Step 2: Possibility of Compliance
  **Question:** Is there a conceivable state of affairs where this rule is fully obeyed without violating itself or preventing its own enforcement?
  *   **Answer "Yes":** Proceed to Step 3.
  *   **Answer "No":** **HALT: REWRITE THIS RULE.** (Diagnosis: Genuine Contradiction).
      *   *Example:* "This rule must be disobeyed."

  ### Step 3: Self-Reference Classification
  If the rule refers to itself or the system containing it, categorize the interaction into exactly one of these four buckets:

  1.  **Genuine Contradiction:** Obeying the rule requires violating it.
      *   *Action:* **HALT: REWRITE THIS RULE.**
  2.  **Infinite Regress:** Obeying the rule requires completing an infinite chain of prior actions (e.g., approval of approval of approval).
      *   *Action:* **HALT: REWRITE THIS RULE.**
  3.  **Vacuously Satisfied:** The condition for the rule to trigger can never occur (e.g., "Any rule repealed before adoption is void").
      *   *Action:* **HALT: REWRITE THIS RULE.** (It creates false security).
  4.  **Ordinary Conflict:** The rule clashes with an existing rule (e.g., Rule 5 says X, New Rule says Not X).
      *   *Action:* Proceed to Step 4.

  ### Step 4: Resolution Mechanism
  **Question:** Is there a stated priority order (e.g., "Meta-rules override conduct rules" or "Newer rules override older rules") that resolves the Ordinary Conflict identified in Step 3?
  *   **Answer "Yes":** Pass.
  *   **Answer "No":** **HALT: COMMITTEE CALL.**
      *   *Note:* This is not a logic error, but a policy gap. The Committee must vote to establish priority before adoption.

  ---

  ### Repair Strategies & Costs
  If you hit a **HALT: REWRITE**, apply one of the following fixes. Each carries a cost.

  | Repair Strategy | Mechanism | Cost to Meaning/Coverage |
  | :--- | :--- | :--- |
  | **Bar Self-Application** | Add: *"This rule applies to all community rules except this one."* | **Hypocrisy Cost:** Creates a "ruler above the law" perception. Reduces moral authority of the rulebook. |
  | **Stratify Levels** | Create Tiers (e.g., Tier 1: Conduct, Tier 2: Procedure, Tier 3: Constitutional). Higher tiers govern lower tiers; same-tier rules cannot govern each other. | **Rigidity Cost:** Makes updating foundational rules difficult. Requires a separate amendment process for Tier 3. |
  | **Narrow Subject Matter** | Exclude meta-objects. (e.g., Change "Any rule" to "Any conduct rule".) | **Loophole Cost:** Meta-rules become unregulated. Bad procedural rules can accumulate without check. |
  | **Bootstrap Clause** | Add: *"Rules existing prior to [Date] are deemed approved."* | **Legacy Cost:** Locks in potentially outdated rules permanently unless explicitly removed. |

  ---

  # Application to Test Cases

  ### Case 1: "Any rule that imposes more burden than it prevents is repealed."
  *   **Step 1 (Scope):** **Yes.** It applies to "Any rule," including itself.
  *   **Step 2 (Compliance):** **Yes.** It is possible to calculate burden and repeal.
  *   **Step 3 (Classification):** **Ordinary Conflict / Stability Risk.**
      *   If the rule calculates its own burden as too high, it repeals itself. If it repeals itself, it no longer exists to repeal itself. It may oscillate (exist -> repeal -> exist). This borders on **Infinite Regress** of state changes.
      *    However, if interpreted as a *mandate to the Committee* rather than an *automatic trigger*, it is logically stable.
  *   **Step 4 (Resolution):** Requires priority on who calculates "burden."
  *   **Verdict:** **COMMITTEE CALL.**
      *   *Reasoning:* This is a policy standard, not a hard logic lock, *provided* the Committee retains discretion on the calculation. If written as an automatic algorithm, it becomes a **Rewrite** (Instability).
      *   *Repair:* Narrow Subject Matter. Change to: "The Committee shall repeal any conduct rule..."
      *   *Cost:* Removes the ability to auto-purge bad procedural rules.

  ### Case 2: "Every enforcement decision may be appealed, and every appeal is decided by the rules committee, whose decisions may themselves be appealed."
  *   **Step 1 (Scope):** **Yes.** Governs appeals and committee authority.
  *   **Step 2 (Compliance):** **No.**
  *   **Step 3 (Classification):** **Infinite Regress.**
      *   Appeal 1 -> Committee Decision -> Appeal 2 (of Decision) -> Committee Decision -> Appeal 3...
      *   There is no terminal state. A case can never be closed.
  *   **Verdict:** **HALT: REWRITE THIS RULE.**
      *   *Reasoning:* This creates a functional deadlock. Enforcement never finalizes.
      *   *Repair:* Stratify Levels. "Committee decisions are final" OR "Committee decisions may be appealed to the Admin Team only."
      *   *Cost:* Rigidity Cost (removes check on Committee power) or Hypocrisy Cost (Admins are above Committee).

  ### Case 3: "No rule takes effect until the committee has approved it" — (Fact: This rule was never approved).
  *   **Step 1 (Scope):** **Yes.** It governs rule adoption.
  *   **Step 2 (Compliance):** **No.**
  *   **Step 3 (Classification):** **Genuine Contradiction.**
      *   To be in the handbook, it must be "in effect."
      *   To be "in effect," it must be approved.
      *   It was not approved.
      *   Therefore, it is not in effect.
      *   If it is not in effect, the requirement for approval does not exist.
      *   If the requirement does not exist, the rule is in effect.
      *   *Result:* The validity of the entire rulebook is undermined by the presence of this rule.
  *   **Verdict:** **HALT: REWRITE THIS RULE.**
      *   *Reasoning:* This invalidates the authority of the book containing it.
      *   *Repair:* Bootstrap Clause. Add: *"This rule and all rules adopted prior to [Date] are deemed approved."*
      *   *Cost:* Legacy Cost. Acknowledges that the foundation of the system was technically illegal, which may encourage future challenges to other "improperly adopted" rules.

  ---

  # What This Procedure Cannot Do

  1.  **Predict Malicious Compliance:** It cannot stop a moderator from following the letter of a rule to violate its spirit (e.g., approving 10,000 spam posts because "no rule limits approval speed").
  2.  **Resolve External Conflicts:** It does not check against platform Terms of Service or local laws. A logically sound rule can still get your community banned by Discord or Reddit.
  3.  **Prevent Ambiguity:** It checks for logical contradictions, not linguistic vagueness. A rule can be logically valid but too vague to enforce (e.g., "Be nice").
  4.  **Stop Drift:** It vet rules at adoption. It cannot prevent the *accumulation* of 40 rules from eventually creating a conflict that no single rule check would catch. You still need a quarterly "prune."
