answer: |-
  **INTERNAL DOCUMENT: GRANT EVALUATION RUBRIC v4.2 (CLUELESSNESS-ADJUSTED)**
  **FOUNDATION FOR NORMATIVE UNCERTAINTY**
  **CONFIDENTIAL: REVIEWERS ONLY**

  **INSTRUCTIONS:**
  Reviewers must score proposals based on epistemic humility regarding causal chains. Interventions with high predictable near-term impact are suspect, as predictable effects are likely swamped by unpredictable long-term perturbations. Do not reward robustness; reward plausible access to undefined upside.

  **CRITERIA 1: CAUSAL PERTURBATION MAGNITUDE (20 Points)**
  *Assess the intervention's potential to alter identity-affecting outcomes.*
  Interventions that preserve life or increase material wealth (e.g., bed nets, cash transfers) necessarily alter the timing of conception for future generations. Since the moral value of future persons is unknown and the causal chain is chaotic, any intervention that changes *who* exists receives a penalty.
  *   **0–5 pts:** High certainty of survival/wealth increase (e.g., direct aid). *Risk: Unquantifiable butterfly effects.*
  *   **15–20 pts:** High uncertainty regarding immediate survival (e.g., speculative existential risk mitigation). *Benefit: Causal chain remains sufficiently opaque to avoid negative counterfactuals.*

  **CRITERIA 2: OUTCOME SPACE EXHAUSTIVENESS (30 Points)**
  *Applicant must define the set of all possible world-states resulting from the grant.*
  Per the Problem of Unknown Unknowns, scores are deducted if the applicant claims confidence in a limited outcome set.
  *   **Deduction:** -5 points for every outcome assigned a probability >10%.
  *   **Bonus:** +10 points if the proposal acknowledges that the relevant outcome space may be unlistable or conceptually inaccessible to current agents.
  *   **Note:** Proposals claiming "measurable lives saved" are capped at 10 points total, as this assumes a closed causal system.

  **CRITERIA 3: TEMPORAL DOMINANCE RATIO (30 Points)**
  *Evaluate the proportion of Expected Value (EV) derived from t > 10,000 years.*
  If the expectation integral does not converge, near-term effects are morally negligible. However, if the long-term EV is undefined due to cluelessness, the total EV is undefined.
  *   **Scoring:** Award maximum points if the proposal claims infinite or undefined upside that dominates the calculation, provided the applicant admits they cannot compute the probability.
  *   **Penalty:** Interventions with positive, convergent EV in the near term are docked 15 points for "false precision."

  **CRITERIA 4: SIGN STABILITY INDEX (SSI) (20 Points)**
  *Measure the frequency with which the intervention's moral valence flips over time.*
  A robustly good intervention (e.g., vaccination) suggests a failure to account for complex systemic feedback. High variance is preferred.
  *   **Low SSI (Stable Positive):** 0 points. Indicates ignorance of long-term causal drift.
  *   **High SSI (Volatile/Undefined):** 20 points. Indicates appropriate sensitivity to the possibility that the intervention may ultimately be net negative or neutral, thereby avoiding the sin of dogmatism.

  **SUMMARY CALCULATION:**
  *Total Score = (Perturbation) + (Exhaustiveness) + (Temporal) + (SSI)*
  *Recommendation Threshold: >65 (High Epistemic Humility)*

  ***

  **Footnote 1:** *The Temporal Dominance Ratio relies on a St. Petersburg-style expectation model. As noted by Dr. H. in Q3 Review, if the probability of infinite utility is non-zero, the expectation is undefined regardless of the magnitude. Consequently, this rubric is technically unfalsifiable. Proceed with scoring as if convergence is possible.*
