prompt: |-
  I'm a neuroethics-ish PhD student and there's a pattern I keep tripping over that I want someone to actually unpack, no lit review please, I can't look anything up right now.

  First practice. Where I did my clinical rotation, we declared death on the whole-brain standard — brainstem included, no respiratory drive, apnea test, the works — and then the transplant team took organs. Same hospital, different ward: patients in a persistent vegetative state, cortex basically gone, no credible evidence of any experience at all, and they're alive, full moral status, nobody withdraws anything without family sign-off, nobody would dream of harvesting. If the thing that matters morally is the computation that supports experience, those two groups look like they belong on the same side of a line and they're on opposite sides. So: what does the whole-brain criterion actually presuppose about which computations matter? That the morally relevant thing is the integrated functioning of the organism as a whole rather than consciousness? That we've quietly assumed brainstem function is necessary for any experience and that assumption is false? Or is the practice just underdetermined — consistent with several different views about where the line falls, with the diagnosis doing pragmatic work rather than metaphysical work?

  Second practice, same machinery I think. My lab's institution recently decided that cephalopods and decapods are in scope — cuttlefish get anaesthetic, they get welfare oversight, there's a committee. The fruit flies in the room next door have a centralized brain, descending modulation of nociceptive signalling, and do something that looks a lot like motivated avoidance of noxious heat, and they get nothing, no protocol, no committee, no paperwork. Nobody in that building believes the fly computation was measured and found insufficient. So what commitment does the invertebrate list presuppose? A threshold or cluster view where you need a particular architecture — central nociceptive pathway plus some kind of integrative or self-modulatory capacity? A view where the real criterion is whether there's a plausible evolutionary story about what suffering would do for the animal, so it's the adaptive function and not the mechanism? Or is it tractability and who lobbies, with a theory bolted on afterward?

  Here's the part I actually want the time spent on. Suppose my PI wants a lab policy that isn't a list of taxa but a criterion you apply to any system: a system is covered if it has (i) receptors that transduce noxious stimuli, (ii) a central pathway carrying that signal, (iii) evidence the signal modulates the system's own processing or behaviour in a way that isn't a fixed reflex, and (iv) a plausible account of what the experience would do for the system. What does that presuppose that the taxa list doesn't, and what does it quietly rule out — does it rule out insects, or does it rule in something like a software system that satisfies i through iv, and if so is the policy fine with that or does it need an extra clause about being an organism? Related: is the attribution in these practices happening by matching a case to a paradigm (adult human, warm, moving, familiar) or by inference to the best explanation, and does that choice explain the two practices better than any claim about the underlying computation does?

  And then tell me where the hospital practice and the lab practice would have to come apart philosophically, and where they can share the same underlying view. Which parts of each practice are actually forced by the theory they presuppose, which are just convention or institutional history, and what would have to change on the ground if we swapped in a rival view about what computation matters.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Neuroethics-ish PhD student. High level of technical and philosophical literacy. No need for basic definitions or lit reviews. Wants conceptual unpacking, not citations.
      *   **Core Problem:** A perceived inconsistency/pattern in two practices: (1) Death determination (Whole Brain vs. PVS) and (2) Animal Research Ethics (Cephalopods/Decapods vs. Insects).
      *   **Specific Questions:**
          *   What does the whole-brain criterion presuppose about relevant computations?
          *   What commitment does the invertebrate list presuppose?
          *   Analyze a proposed functional criterion (i-iv) for lab policy: What does it presuppose/rule out (including AI)?
          *   Is attribution by paradigm matching or inference to best explanation?
          *   Where must the hospital and lab practices diverge philosophically, and where can they converge?
          *   What is forced by theory vs. convention/history?
          *   What would change on the ground if we swapped views?

  2.  **Deconstruct Practice 1: Death Determination (Whole Brain vs. PVS)**
      *   *Observation:* Whole Brain Dead (WBD) = Dead (organs harvestable). Persistent Vegetative State (PVS) = Alive (full moral status).
      *   *Neurological Reality:* WBD = No brainstem, no integration, no consciousness. PVS = No cortex (effectively), no consciousness, *but* brainstem intact (breathing, reflexes).
      *   *The Tension:* If consciousness/experience is the moral metric, both lack it. Why the difference?
      *   *Underlying Presuppositions:*
          *   Option A: Organismal Integration. Death is the loss of the *organism* as a functional whole, not just the loss of the *subject* of experience. The brainstem maintains homeostasis (breathing, temp, etc.). PVS patients are still biologically integrated organisms. WBD patients are merely biological units kept going by machines.
          *   Option B: Potentiality/Irreversibility. WBD is irreversible loss of *all* function. PVS *might* have residual cortical islands (rarely), but more importantly, the *capacity* for spontaneous life remains.
          *   Option C: Pragmatic/Social. We need organs. WBD is a clean line for procurement. PVS is a slippery slope (disability rights, family attachment).
      *   *Computation View:* If morality = computation supporting experience, the practice is inconsistent *unless* the "computation" includes homeostatic integration, not just phenomenal consciousness.

  3.  **Deconstruct Practice 2: Animal Research (Cephalopods vs. Flies)**
      *   *Observation:* Cuttlefish = Protected. Flies = Not protected (generally).
      *   *Neurological Reality:* Flies have nociception, central processing, avoidance learning. Cuttlefish have complex brains, clear welfare needs.
      *   *The Tension:* Why the line there?
      *   *Underlying Presuppositions:*
          *   Option A: Phylogenetic Proxy. We assume complexity correlates with lineage. Vertebrates + Cephalopods = "High enough." Insects = "Too low."
          *   Option B: Uncertainty Principle (Precautionary). Cuttlefish behavior is ambiguous enough to warrant caution. Fly behavior is dismissed as "reflexive" (even if evidence suggests otherwise).
          *   Option C: Sociopolitical. "Yuck factor," charisma, lobbying.
      *   *Computation View:* The list implies a threshold of *integration* or *complexity* that isn't strictly defined by nociception alone.

  4.  **Analyze the Proposed Lab Policy (Criteria i-iv)**
      *   *Criteria:* (i) Nociceptors, (ii) Central pathway, (iii) Non-fixed modulation/learning, (iv) Evolutionary account.
      *   *Presuppositions:* This is a Functionalist/Computational view. It ignores substrate (biology vs. silicon).
      *   *What it Rules In/Out:*
          *   *Insects:* Likely rules *in* many insects (Drosophila show operant conditioning, nociceptive sensitization). This contradicts current practice.
          *   *AI/Software:* If a robot has sensors, central processing, learning/modulation, and an evolutionary-style reward function, this criterion *rules it in*.
          *   *Organism Clause:* Needs a "biological substrate" clause to exclude AI, *or* it must accept AI moral status (radical).
      *   *Attribution Method:* This criterion forces *Inference to the Best Explanation* (IBE). You look at the mechanism, not the "look" of the animal. Current practice is *Paradigm Matching* (Does it look/suffer like a dog/human?).

  5.  **Synthesize: Hospital vs. Lab Practices**
      *   *Where they diverge:*
          *   Hospital: Focuses on *Integration of the Organism* (Biological Life). Death = Loss of holistic function.
          *   Lab: Focuses on *Capacity for Suffering* (Phenomenal Experience). Ethics = Prevention of pain.
          *   *Conflict:* A WBD patient has no experience (like a fly) but is treated as a "former person" (respect for body). A fly has potential experience but is treated as "material."
          *   *Philosophical Split:* The hospital practice relies on a *Vitalist/Biological* definition of death (even if disguised). The lab practice relies on a *Sentientist* definition of moral standing.
      *   *Where they converge:*
          *   Both rely on *Epistemic Humility/Pragmatism*. We draw lines where we can measure clearly (brainstem reflexes, phylogenetic classes) rather than where the metaphysics is pure.
      *   *What is Convention vs. Theory:*
          *   Hospital: The "Dead Donor Rule" is convention. The "Whole Brain" standard is a compromise between cardiac and higher-brain standards.
          *   Lab: The taxa list is convention/regulatory history. The functional criterion is theoretical.
      *   *Swapping Views:*
          *   If Hospital adopted "Consciousness = Life": PVS patients could be organ donors (Higher Brain Death). WBD remains dead.
          *   If Lab adopted "Biological Integration = Value": Flies remain unprotected (too simple), but maybe WBD patients get *more* protection (integrity of the remains).

  6.  **Drafting the Response (Iterative refinement for tone and depth):**
      *   *Tone:* Peer-to-peer, analytical, dense but clear. No fluff.
      *   *Structure:*
          1.  The Hospital Paradox (Integration vs. Experience).
          2.  The Lab Paradox (Phylogeny vs. Function).
          3.  The Proposed Criterion (Functionalism & The AI Problem).
          4.  Attribution Models (Paradigm vs. IBE).
          5.  Convergence/Divergence (The Core Philosophical Tension).
          6.  Counterfactuals (What if we swapped theories?).

      *   *Refining the Hospital Point:* Make sure to distinguish between "biological life" and "biographical life." The Whole Brain standard is actually a proxy for "loss of organismal integration," not just loss of consciousness. That's the key. PVS patients breathe; they are integrated organisms. WBD patients do not; they are collections of tissues.
      *   *Refining the Lab Point:* The taxa list is a heuristic for the "Hard Problem." We can't measure qualia, so we measure phylogeny. The proposed criterion tries to solve the Hard Problem with functionalism.
      *   *Refining the AI Point:* If the criterion is purely functional, it *must* include AI unless "biological" is specified. This reveals the speciesism/biologism in current lab policies.
      *   *Refining the Attribution:* Current practice is definitely Paradigm Matching (Prototypicality). The proposed policy is IBE. This explains the inconsistency.
      *   *Refining the Divergence:* Hospital = Sanctity of Life (Biological). Lab = Prevention of Suffering (Phenomenal). They are actually answering different ethical questions.

  7.  **Final Polish:** Check against constraints. No lit review. Focus on unpacking the pattern. Ensure the "computation" angle is addressed directly. (Self-Correction: Make sure to explicitly answer "what computation matters" for the hospital case. It's not just experience computation; it's homeostatic integration computation.)

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a sharp observation. You are identifying the friction between *ontological thresholds* (what the thing *is*) and *epistemic proxies* (how we measure it), compounded by the fact that the two practices are actually answering different ethical questions despite using similar neurological machinery to answer them.

  Here is the unpacking of the pattern, the presuppositions, and the divergence.

  ### 1. The Hospital Practice: Integration vs. Experience
  You asked what the whole-brain criterion presupposes about which computations matter. If the moral metric were strictly "computation supporting experience" (consciousness), you are correct: WBD (Whole Brain Death) and PVS (Persistent Vegetative State) should be ethically identical. Both lack the cortical substrate for phenomenal experience.

  The fact that they are treated differently reveals that the Whole Brain Standard does **not** presuppose that consciousness is the sole morally relevant computation. Instead, it presupposes that **organismal integration** is the relevant computation for *death*, while **consciousness** is the relevant computation for *personhood/moral status*.

  *   **The Computation:** The brainstem computes homeostasis (respiratory drive, thermoregulation, hemodynamic stability). The cortex computes experience.
  *   **The Presupposition:** The hospital practice assumes a dual-threshold view. To be *dead*, you must lose the computation of biological integration (brainstem). To be a *person* (with full rights against harvesting), you must retain the computation of experience (cortex).
  *   **The Gap:** PVS patients have lost personhood (no cortex) but retain biological life (brainstem). WBD patients have lost both.
  *   **Why the Line?** If we declared PVS patients dead (Higher Brain Standard), we would face the "slippery slope" of harvesting from beings who are biologically alive (warm, breathing, healing). The Whole Brain Standard is a pragmatic firewall. It ensures that organ procurement only happens when the *organism* has ceased to function as a unit, regardless of whether the *subject* ceased earlier.
  *   **Conclusion:** The practice presupposes that "life" (biological integration) has independent moral weight from "experience." It is not underdetermined; it is explicitly prioritizing biological integrity over phenomenal consciousness for the definition of death, likely to protect the social trust required for transplantation.

  ### 2. The Lab Practice: Phylogeny as a Proxy for Function
  The invertebrate list (cephalopods/decapods in, insects out) presupposes a **phylogenetic heuristic** for sentience, not a functional one.

  *   **The Commitment:** It assumes that evolutionary lineage correlates with the *capacity* for suffering better than specific behavioral assays do. It presupposes that there is a "complexity floor" located somewhere between arthropods and mollusks/vertebrates.
  *   **The Quiet Assumption:** It assumes that fly nociception is "reflexive" (sub-personal computation) while cuttlefish nociception is "experiential" (personal-level computation), despite the functional similarities you noted.
  *   **Why?** This is largely epistemic risk management. We are more uncertain about the inner life of a cuttlefish than a fly. The "list" is a regulatory containment strategy. It admits that we cannot measure experience directly, so we use taxonomy as a proxy for neural complexity.
  *   **Lobbying/Tractability:** You are right to suspect this. Flies are model organisms; regulating them cripples basic research. Cuttlefish are niche. The theory is bolted on to justify the economic/pragmatic boundary.

  ### 3. The Proposed Criterion (i–iv) and the AI Problem
  Your PI's proposed policy shifts from a **Phylogenetic/Proxy** view to a **Functionalist/Computational** view.

  *   **What it Presupposes:** It presupposes that substrate independence is true. If a system computes nociception, integrates it, modulates behavior, and has an evolutionary/functional account for pain, it suffers. It rejects the idea that "biology" is a necessary condition for moral status.
  *   **What it Rules Out:** It rules out the "Phylogenetic Privilege." It forces you to protect insects (which satisfy i–iv) and potentially unprotect some vertebrates (if they lack central modulation, though rare).
  *   **The AI Clause:** As written, **it rules in software.** If a robot has damage sensors (i), a central processor (ii), learning algorithms that avoid damage (iii), and a fitness function penalizing damage (iv), it qualifies.
      *   *To exclude AI:* You need an extra clause: "(v) Substrate must be biological/evolved."
      *   *The Cost:* Adding (v) admits that the policy is speciesist (biologist), not functionalist. It admits we care about *suffering organisms*, not *suffering systems*.
  *   **Attribution Model:**
      *   *Current Taxa List:* **Paradigm Matching.** Does this animal look/act enough like the prototype (human/dog) to warrant protection? (Flies = no, Cuttlefish = yes).
      *   *Proposed Criterion:* **Inference to the Best Explanation (IBE).** Given the mechanism, is the hypothesis "this system suffers" the best explanation for its behavior?
      *   *Explanation of Practices:* The inconsistency you see exists because the Hospital uses IBE for death (is the organism integrated?) but Paradigm Matching for personhood (does it look like a person?). The Lab uses Paradigm Matching for taxa (is it a vertebrate/cephalopod?). Your PI wants to move the Lab to IBE.

  ### 4. Divergence and Convergence
  Where must these practices come apart, and where can they share a view?

  **Where they must diverge:**
  They are solving different ethical problems.
  *   **Hospital:** The question is **"When does obligation cease?"** (Death). The underlying theory is *Vitalist* (life is a biological process). The computation that matters is *homeostatic integration*.
  *   **Lab:** The question is **"When does obligation begin?"** (Moral Status). The underlying theory is *Sentientist* (suffering creates obligation). The computation that matters is *nociceptive integration*.

  You cannot use the same criterion for both without breaking one.
  *   If you apply the Lab's "Sentience" criterion to the Hospital: PVS patients are dead (no experience). Organs could be harvested. This violates the Dead Donor Rule's biological constraint.
  *   If you apply the Hospital's "Integration" criterion to the Lab: Flies are protected (they are integrated organisms). This creates regulatory collapse.

  **Where they can converge:**
  They can share an **Epistemic Precautionary Principle.**
  Both practices acknowledge we cannot access the "inner light."
  *   Hospital: We assume death only when *all* function is gone (Whole Brain) because we can't be sure if *some* function (Higher Brain) is enough for life.
  *   Lab: We assume sentience in complex brains (Cephalopods) because we can't be sure if simpler brains (Flies) lack it.
  *   *Shared View:* "In the face of uncertainty regarding the relevant computation, prioritize the error that preserves the status quo (life/protection)."

  **What is Convention vs. Theory:**
  *   **Hospital:** The *Whole Brain* standard is convention/history (1968 Harvard Committee). The *theory* is that death is the loss of integrated function. If we swapped to a "Consciousness" theory, PVS patients become organ donors.
  *   **Lab:** The *Taxa List* is convention/regulation (EU Directive 2010/63). The *theory* is that complexity correlates with suffering. If we swapped to a "Functional" theory (your PI's list), insects get protection, and we have to decide on AI.

  **What changes on the ground if we swap views?**
  1.  **Swap Hospital to "Consciousness = Life":**
      *   PVS patients are declared dead.
      *   Organ supply increases drastically.
      *   Family consent becomes less about "life support" and more about "respect for remains."
      *   *Risk:* Erosion of trust in ICU. Families fear doctors will pull the plug to get kidneys.

  2.  **Swap Lab to "Functional Criterion (i-iv)":**
      *   Drosophila protocols require anesthesia and ethical review.
      *   Research costs skyrocket; some genetics research halts.
      *   You must write a policy on AI/Robot testing.
      *   *Risk:* Dilution of protection. If "suffering" is just functional modulation, do we trivialize the moral weight of pain by equating it with a robot's error-avoidance routine?

  ### Summary of the Pattern
  You are tripping over the fact that **Bioethics is not unified.**
  *   Clinical Neuroethics (Death) is implicitly **Biological/Vitalist**. It protects the *organism*.
  *   Research Neuroethics (Animals) is implicitly **Sentientist/Phenomenal**. It protects the *experience*.

  The inconsistency you see (PVS alive vs. WBD dead; Fly unprotected vs. Cuttlefish protected) arises because we are applying a **Sentientist intuition** to the PVS case (they feel nothing, so why alive?) but a **Vitalist rule** to the Death case (they breathe, so alive). Conversely, we apply a **Sentientist rule** to the Lab case (do they suffer?) but use a **Phylogenetic Proxy** to measure it.

  Your PI's proposal forces the Lab practice to align with the *Sentientist theory* (Functionalism) rather than the *Phylogenetic Proxy*. If you adopt it, you must accept that you are protecting *computations*, not *species*. That means either protecting the fly or admitting the criterion is a sham because you will add a "biological substrate" clause that contradicts the functionalist logic of (i) through (iv).
