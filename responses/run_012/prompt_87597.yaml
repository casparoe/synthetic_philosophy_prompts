      *   *Consistency:* Elsewhere, Turing treats the IG as a replacement for the vague question of thinking. If it's conditional, he should qualify the replacement more strongly.
      *   *Historical Context:* Parapsychology was popular (Rhine's experiments). Turing might just be covering his bases against a popular scientific claim of the time, not making a deep philosophical point about the nature of operational definitions.

