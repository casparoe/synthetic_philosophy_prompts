answer: |-
  This is a sharp pedagogical move. You are asking your students to define the *job description* before hiring the *candidate*. Most seminars skip this and let the theories define the problems, which leads to students accepting "solutions" that dissolve the phenomenon they were supposed to explain.

  Below is the specification sheet. It is designed to be theory-neutral but demanding. It forces any account to declare its metaphysical debts upfront.

  ### Part 1: The Desiderata Checklist

  | Desideratum | The Rationale (Why we demand this) | Negotiability | Cost of Denial (What happens if a theory ignores this) |
  | :--- | :--- | :--- | :--- |
  | **1. Epistemic Source Transparency**<br>*(The Central Weirdness)* | The theory must explicitly state the locus of epistemic gain. Does the knowledge come from (a) a unique cognitive faculty (e.g., intuition of laws), (b) the rearrangement of existing empirical premises, or (c) a psychological illusion of discovery? | **Non-Negotiable** | The theory becomes a "bait-and-switch." It promises to explain how we learn from imagination but secretly relies on hidden empirical premises or formal logic without admitting it. |
  | **2. Extensional Adequacy & Unity**<br>*(The Case Zoo)* | The theory must cover the canonical set (Galileo's weights, Maxwell's Demon, Einstein's Chase, Newton's Bucket, Schrödinger's Cat) without ad-hoc exclusions. If it claims TEs are a *natural kind*, it must treat these as one kind. | **High Priority** (Negotiable only if the theory argues some cases are *not* TEs) | The theory becomes a theory of *some* thought experiments, not Thought Experiments. It risks being a taxonomy of examples rather than an epistemology of method. |
  | **3. Modal Robustness**<br>*(The Impossible/Possible Split)* | The theory must address whether physical possibility matters. Does a TE that violates physics (Demon, Cat) function differently than one that merely hasn't been built (Elevator, Weights)? | **Negotiable** (Theories may argue the split is irrelevant) | If the theory ignores this, it cannot explain why some TEs are refuted by physics (Demon) while others are confirmed by it (Elevator). It risks treating all counterfactuals as equal. |
  | **4. Error Diagnosis**<br>*(The Failure Mode)* | The theory must explain how a TE *fails*. Is the error in the scenario construction, the intuitive verdict, or the background theory? A theory of knowledge must be a theory of error. | **Non-Negotiable** | The theory becomes a hagiography of hits. It cannot distinguish between a "deep insight" and a "compelling mistake" (e.g., why Aristotelian TEs felt right but were wrong). |
  | **5. Demarcation Accounting**<br>*(The Distinctions)* | The theory must account for the *phenomenological or functional difference* between TE vs. Real Experiment, and TE vs. Plain Argument. It need not claim they are ontologically distinct, but must explain why they *feel* or *act* distinct. | **Non-Negotiable** (with caveats) | If it collapses TE into Argument entirely, it must explain the rhetorical/psychological power of the narrative. If it collapses TE into Experiment, it must explain the lack of measurement. |
  | **6. Empiricist Consistency**<br>*(The Trilemma Check)* | The theory must locate itself within the trilemma: (1) New Knowledge, (2) No New Input, (3) All Knowledge is Empirical. It cannot claim all three without contradiction. | **Non-Negotiable** | The theory is logically incoherent. It claims to be empiricist while positing a mechanism that bypasses experience to generate new worldly knowledge. |

  ---

  ### Part 2: The Incompatibilities (The Trilemma)

  You are correct to suspect a contradiction. The following three claims form an inconsistent triad. **Any adequate theory must explicitly sacrifice one.**

  1.  **The Novelty Claim:** TEs yield genuinely *new* knowledge about the world (not just clarification of what we already knew).
  2.  **The Input Claim:** TEs bring in *no new empirical input* (no new data, measurement, or observation).
  3.  **The Empiricist Claim:** All knowledge of the world is derived from empirical input.

  **How the theories usually break:**

  *   **The Argument View (e.g., Norton):** Sacrifices **(1)**. TEs do not yield *new* knowledge; they reorganize existing knowledge. The "discovery" is psychological, not epistemic.
  *   **The Platonist View (e.g., Brown):** Sacrifices **(3)**. TEs yield new knowledge without new input because we have access to abstract laws/universals via intuition. (This violates strict empiricism).
  *   **The Implicit Premise View (e.g., some Cognitive Science accounts):** Sacrifices **(2)**. TEs *do* use new input, but it is hidden/unconscious empirical data retrieved from memory or simulation.

  **Instructional Note:** Force your students to pick which horn they are willing to bleed on. If they try to keep all three, they have not understood the assignment.

  ---

  ### Part 3: The Throat-Cutter

  You asked which single requirement on the list does the most damage to existing accounts.

  **The Winner: Desideratum #4 (Error Diagnosis).**

  **Why?**
  It is relatively easy to explain how a Thought Experiment *succeeds*.
  *   *Platonists* say: "We saw the law."
  *   *Empiricists* say: "We deduced the consequence."
  *   *Simulationists* say: "Our cognitive model ran correctly."

  It is exceptionally difficult to explain how a Thought Experiment *fails* without undermining the mechanism of success.
  *   **If the mechanism is Intuition:** Why did intuition fail for EPR (Einstein-Podolsky-Rosen)? Was the faculty broken, or the target unclear? If intuition is fallible, how do we know *this* TE isn't a failure? (The reliability problem).
  *   **If the mechanism is Argument:** Why did the scientific community accept the "bad argument" of the EPR paper for 30 years? If it's just logic, errors should be spotted like math errors. They aren't.
  *   **If the mechanism is Simulation:** Why does the simulation output "spooky action" is impossible when it is possible? Is the cognitive architecture flawed?

  **The Trap:**
  Most accounts (especially Norton's Argument View) handle success well but treat failure as "bad logic" or "false premises." This often feels insufficient for cases like Maxwell's Demon, which wasn't "illogical" but relied on background assumptions (classical thermodynamics) that were later revised. An account that cannot explain why a TE was *reasonable at the time* but *wrong in hindsight* fails to capture the historical reality of the method.

  **Secondary Throat-Cutter: Desideratum #3 (Modal Robustness).**
  Many accounts glide over the difference between the *Impossible* (Cat/Demon) and the *Unbuilt* (Elevator/Weights).
  *   If TEs are just arguments, physical impossibility shouldn't matter (you can argue from false premises).
  *   If TEs are simulations of reality, physical impossibility should break the simulation.
  *   **The Cut:** If a theory treats the Demon and the Elevator as epistemically identical, it struggles to explain why one was resolved by information theory and the other by gravity measurements. If it treats them as different, it risks fracturing the "Case Zoo" (Desideratum #2).

  ### Summary for the Syllabus

  When you hand this to the students, the instruction is:
  *"Do not tell me how your favorite theorist solves the problem. Tell me if their solution meets the spec. If they violate Desideratum 1, they are hiding their premises. If they violate Desideratum 4, they are selling a miracle. If they try to keep all three horns of the Trilemma, they are doing bad metaphysics."*
