answer: |-
  # Workshop Design: The Re-identification Protocol
  **Facilitator:** [Your Name]  
  **Duration:** 90 Minutes  
  **Participants:** 16 Graduate Students  
  **Room:** Clear floor space. Tables pushed to the perimeter. Central open area for four "Stations."

  ## I. Preparation & Materials

  **The Room:**
  Arrange four identical stations in a square. Each station has:
  1.  **A "Haptic Chair":** Facing inward, with a small table.
  2.  **A "Optic Booth":** A low barrier (cardboard or screen) placed 2 meters from the Haptic Chair, obscuring the table from view but allowing sight of objects placed on top.
  3.  **A "Bridge Zone":** The space between the Chair and the Booth.
  4.  **Token Bowl:** 20 poker chips or heavy coins per station.

  **The Objects (Critical):**
  You need two distinct sets of pairs, labeled **Set Alpha** and **Set Beta**.
  *   **Set Alpha (Shape Variance):** Two objects of identical material (e.g., matte-finish 3D printed PLA), identical weight (balanced internally), and temperature. One is a **Sphere**, one is a **Cube**.
      *   *Purpose:* Isolates silhouette. Naive strategy (weight/texture) fails.
  *   **Set Beta (Texture/Heft Variance):** Two objects of nearly identical silhouette (e.g., two 5cm Cubes). One is **Solid Wood** (heavy, grain texture), one is **Hollow Plastic** (light, smooth). Paint them the exact same matte color.
      *   *Purpose:* Isolates surface/mass. Naive strategy (silhouette) fails.

  **The Ledger:**
  A large whiteboard divided into four columns: *Round, Role, Wager, Outcome.*

  ## II. The Roles (Assigned by Lot)
  At each of the four stations, assign four students randomly to these roles. They will rotate roles after Round 2.
  1.  **The Haptic (Touch-Only):** Wears a high-quality sleep blindfold (light-proof). Handles objects only inside a cloth bag or behind a screen.
  2.  **The Optic (Sight-Only):** Sits behind the barrier. Sees objects only when placed on the display stand. Cannot touch.
  3.  **The Bridge (Newly Sighted):** The experimental subject.
  4.  **The Registrar:** Manages tokens, records wagers, ensures no cheating (e.g., blindfold peeking, sound cues).

  ## III. The Procedure (90 Minutes)

  ### 0:00 – 0:10 | Induction (No Lecture)
  Hand out the role cards. Read the **Prime Directive**:
  > "This is not a test of your perception. It is a test of your predictions about perception. You are not here to prove you are smart. You are here to locate the gap between what you know and what you can experience. Silence is required during rounds. Tokens are your voice."

  ### 0:10 – 0:30 | Baseline Rounds (Calibration of Senses)
  *Goal: Establish that individual senses work reliably in isolation.*

  **Round 1 (Tactile Baseline):**
  *   **Objects:** Set Alpha (Sphere/Cube).
  *   **Action:** The **Haptic** participant is given Object A (e.g., Sphere) inside the cloth bag for 30 seconds. It is removed. Object A and Object B are placed in the bag.
  *   **Task:** The Haptic must identify which object is the one they just held.
  *   **Wager:** The Haptic wagers 1–5 tokens on their confidence.
  *   **Record:** Registrar notes success/failure and wager.

  **Round 2 (Visual Baseline):**
  *   **Objects:** Set Alpha.
  *   **Action:** The **Optic** participant sees Object A on the stand for 30 seconds. It is removed. Both objects are placed on the stand.
  *   **Task:** The Optic identifies the original object.
  *   **Wager:** Optic wagers 1–5 tokens.
  *   **Record:** Registrar notes success/failure and wager.

  *(Rotate Roles: Haptic becomes Optic, Optic becomes Bridge, Bridge becomes Registrar, Registrar becomes Haptic.)*

  ### 0:30 – 0:50 | The Cross-Modal Round (The Molyneux Gap)
  *Goal: To feel the friction of re-identification across senses.*

  **Round 3 (The Bridge):**
  *   **Objects:** Set Beta (Wood Cube/Plastic Cube). *Switching sets prevents memory of specific scratches/marks.*
  *   **Phase 1 (Touch):** The **Bridge** participant is blindfolded. They handle Object A (e.g., Wood Cube) inside the bag for 30 seconds.
  *   **Phase 2 (The Wager):** **STOP.** Before the blindfold comes off, *everyone at the station* must wager.
      *   **The Table Wager:** The Haptic and Optic participants bet on whether a *person blind from birth* could succeed at this task. (High stakes: 5 tokens).
      *   **The Bridge Wager:** The Bridge participant bets on whether *they* will succeed now that they can see.
  *   **Phase 3 (Sight):** Blindfold removed. Both objects are placed on the stand. The Bridge must point to the object they held.
  *   **Record:** Note the discrepancy between the "Table Wager" (theory) and "Bridge Wager" (performance).

  *(Rotate Roles again so everyone experiences the Bridge role once.)*

  ### 0:50 – 1:05 | The Extra Rounds (Conceptual Stress Tests)
  *Goal: To isolate the mechanism of recognition.*

  **Round 4 (Calibration/Action):**
  *   **Role:** New Bridge participant.
  *   **Objects:** Set Alpha.
  *   **Action:** Bridge touches Object A (blindfolded). Blindfold removed.
  *   **Twist:** They are allowed to *move* one visible object with their hand while watching it move.
  *   **Question:** Does proprioception + vision bind the object identity better than vision alone?
  *   **Wager:** Bet on success before attempting.

  **Round 5 (The Label):**
  *   **Role:** New Bridge participant.
  *   **Objects:** Set Beta.
  *   **Action:** Bridge touches Object A (blindfolded).
  *   **Twist:** Before blindfold removal, the Registrar whispers the name: *"It is the Heavy One."*
  *   **Task:** Upon seeing the objects, pick the one that matches the label, not necessarily the percept.
  *   **Wager:** Bet on success.

  ### 1:05 – 1:30 | The Debrief (Mapping the Terrain)
  *Do not sit. Stand in a circle. Keep the tokens visible.*

  **1. The Baseline Data (5 mins)**
  *   Ask: "Did the Haptic and Optic groups succeed?" (Likely yes).
  *   *Point:* Shape and texture seem available to more than one sense. This implies correlation. But does correlation imply shared content? Or merely shared labels for different experiences?

  **2. The Prediction Gap (10 mins)**
  *   Ask: "Look at the Round 3 wagers. How many bet that a truly blind person would fail? How many of you, as the Bridge, succeeded?"
  *   *Point:* You succeeded because you are not Molyneux's subject. You have years of cross-modal mapping. The *interesting data* is not your success, but your hesitation before the wager. Did you feel a momentary disconnect before your brain auto-corrected? That millisecond of hesitation is the Molyneux Gap.

  **3. The Label vs. The Thing (5 mins)**
  *   Ask: "In Round 5, did the label make it easier? Or did it feel like cheating?"
  *   *Point:* Classification (knowing it is 'Heavy') is not Re-identification (knowing it is *This*). A shared label bridges the gap without bridging the experience. This is how language solves the puzzle without solving the philosophy.

  **4. Calibration & Action (5 mins)**
  *   Ask: "In Round 4, did moving the object help?"
  *   *Point:* If yes, then identity might not be in the static image, but in the *consequence of action*. We know the world by how it pushes back.

  **5. The Honest Limit (5 mins)**
  *   *Facilitator Script:* "We must be candid. This room contains no blind minds. You all smuggled in cues. You used memory of the object's color, the sound it made hitting the table, the pressure of the blindfold. Real cases—cataract surgery patients—are messy. They have partial sight, pain, fear. They do not have poker chips."
  *   "We staged this not to solve Molyneux, but to feel the *urge* to solve it. The puzzle isn't whether the hand matches the eye. The puzzle is why we assume they should. If the senses deliver different content, why do we bet on their unity?"

  **Closing:**
  "Collect your tokens. Leave the objects on the tables. Walk out without looking at your hands."

  ## IV. Contingency Notes for the Facilitator

  *   **If everyone succeeds instantly:** Emphasize the *speed* of the success. Ask them to introspect on the very first frame of vision. Was the object immediately "the one," or did it become "the one" after a micro-calculation?
  *   **If cheating occurs (peeking):** Do not disqualify. Mark it on the board as "Cue Leakage." Use it in the debrief to discuss how hard it is to isolate a sense. "You tried to be a camera, but you are a human."
  *   **If the "Table Wager" is low (they think blind people can do it):** Challenge them. "Why? Is shape a mathematical truth that exists outside the sense? Or is it a construction of the brain?"
  *   **Timekeeping:** Be ruthless. Use a visible timer. If the Debrief runs short, prioritize the "Prediction Gap" discussion over the "Calibration" discussion.

  ## V. Why This Design Works
  1.  **Re-identification over Resemblance:** By asking "Which one did I hold?" rather than "Which one is a cube?", you force an episodic memory link, not a semantic categorization.
  2.  **The Wager:** This solves the "fake blindness" problem. The tension is transferred from the *performance* (which will be perfect) to the *expectation* (which reveals their philosophical commitments).
  3.  **Object Constraints:** By using Set Beta (same shape, different weight), you prevent the visual system from relying solely on silhouette, forcing a conflict between what the hand felt (heavy) and what the eye sees (looks light).
  4.  **Novelist's Touch:** The ending instruction ("Walk out without looking at your hands") leaves them with a somatic residue of the problem, ensuring the puzzle stays in their bodies after they leave the room.
