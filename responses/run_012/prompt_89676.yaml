      *   **Constraint 3 (Specific Angles):**
          *   Analyze the body count (3 dead out of ~20 boys) vs. per capita rate.
          *   Is the book about numbers or something else?
          *   Compare island violence to the off-stage war (adult world) and the dead pilot.
          *   Address the "cheat" of stranding them without a state (if the thesis is states pacify us).
          *   Identify where the novel *resists* this reading (where it doesn't fit).
      *   **Constraint 4 (Style):** Do not quote the text. Know the plot.
      *   **Constraint 5 (Length):** Hard cap 600 words.
      *   **Constraint 6 (Structure):** Lead with the bottom line.

  2.  **Determine the Bottom Line:**
      *   The novel ultimately undermines Pinker's thesis not by showing higher absolute violence, but by showing how quickly the *potential* for violence erupts without enforcement, while simultaneously implicating the "civilized" adult world in the very same brutality. The island isn't an anomaly; it's a microcosm of the macrocosm. The "cheat" of removing the state is the point: the state doesn't eliminate the urge, it just monopolizes it.

  3.  **Drafting - Section by Section:**

      *   *Bottom Line:* Start with the core argument. *Lord of the Flies* doesn't disprove Pinker's data on declining violence rates, but it challenges the moral comfort of that data. It argues that the Leviathan doesn't cure violence; it merely scales it up and sanitizes it.
      *   *Body Count & Per Capita:* Address the 3 deaths. In absolute terms, it's low. In per capita terms (over a few weeks), it's genocide-level. This suggests the metric of "numbers" is the wrong way to measure moral decay. The speed of collapse matters more than the tally.
      *   *The State Experiment:* Address the "cheat." Golding removes the state to test the *need* for it. Pinker argues the state pacifies. Golding shows the state *suppresses*. When the suppressor is removed, the impulse returns instantly. This supports Hobbes/Leviathan more than Pinker's optimism. The boys aren't becoming violent; they are revealing the violence the state usually hides.
      *   *Off-stage War:* The adult world. The naval officer rescues them, but he comes from a warship. The boys' savagery mirrors the adults' war. The dead pilot is the key symbol: the "beast" is a dead soldier from the civilized world. The violence on the island *does* count next to the war; it is the war in miniature.
      *   *Resistance/Nuance:* Where does it not fit? Pinker argues violence declined over *centuries* due to trade, reason, and state monopoly. Golding shows a collapse in *days*. The novel resists the historical timeline argument. It suggests the veneer is thinner than Pinker admits. However, the novel doesn't account for the structural incentives (trade, interdependence) that Pinker cites, because the island economy is subsistence-based. The boys have nothing to lose by fighting.
      *   *Conclusion:* The book isn't about statistics; it's about psychology and authority.

  4.  **Refining and Editing (Checking Constraints):**
      *   *Word Count:* Need to keep it tight.
      *   *No Quotes:* Ensure no direct text citations.
      *   *Lead with Bottom Line:* First sentence must be the thesis.
      *   *Tone:* Analytical, academic but direct.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Start: Golding argues the state masks violence, Pinker argues it reduces it.
      Body: The 3 deaths are statistically huge for the timeframe. It shows speed of decay. The adult war shows the state doesn't stop violence, just organizes it. The pilot connects the two. The "cheat" is the point—removing the mask. Where it fails: Island has no economy/trade, which Pinker says reduces violence.
      End: Numbers don't matter, intent does.

  6.  **Drafting - Attempt 2 (Writing & Counting):**
