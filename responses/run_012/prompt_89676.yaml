prompt: |-
  ok so I have to write something for English on Lord of the Flies and I want to avoid the usual "the beast is inside us" essay. Our teacher keeps calling it a state-of-nature thought experiment, and Ive also been reading about the idea that violence has actually gone down over history (Pinker's Better Angels of Our Nature, the whole Leviathan/rise-of-the-state argument), which seems like it should be the exact opposite of what the island shows. So read the novel as a test case for that thesis. What I actually want you to dig into: the island ends with something like three dead out of twenty-something boys, which is a horrifying per capita rate and a body count you can count on one hand -- which one is the thesis even about, and does the book end up showing that the numbers are the wrong way to ask the question? And does the violence on the island even count next to the war happening offstage that the boys hear but never see, and the dead pilot they mistake for the monster? Is Golding cheating by stranding them with no state at all, when the whole thesis is that states are what pacified us in the first place? Tell me where the novel resists the reading and I have to admit it doesn't fit. Don't quote at me, I know the plot. Hard cap 600 words, and lead with your bottom line.
