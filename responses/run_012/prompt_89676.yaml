      *Lord of the Flies* ultimately argues that the Leviathan does not eliminate human violence but merely monopolizes and sanitizes it, challenging Pinker's optimism by suggesting civilization is a thin veneer over inherent brutality. While Pinker uses statistics to show violence declining over centuries due to state formation, Golding uses the island to show how quickly that decline reverses when enforcement vanishes.

      The body count—three dead out of roughly twenty boys—is statistically horrific given the timeframe. In absolute numbers, it is low; in per capita rate over a few weeks, it rivals genocide. This suggests the novel is not about the quantity of violence, but the velocity of moral collapse. Pinker's thesis relies on long-term historical trends, but Golding is interested in immediate psychological regression. The numbers are the wrong metric because the horror lies in the ease with which ordinary schoolboys become murderers, not the total casualties produced.

      Regarding the "cheat" of removing the state: this is not a flaw in Golding's experiment but the central variable. If the thesis is that states pacify us, removing the state should result in chaos, which it does. However, Golding pushes further than Hobbes. He implies the state doesn't cure the urge to kill; it merely redirects it. The rescue comes via a naval officer from a warship engaged in a global conflict. The boys' micro-war mirrors the adults' macro-war. The dead pilot, mistaken for the beast, is the literal embodiment of this connection: the monster is a dead soldier from the "civilized" world. The violence on the island counts precisely because it is identical in nature to the off-stage war, differing only in scale and technology.

      Where does the novel resist the Pinker/Hobbes reading? Pinker argues that besides the state, factors like trade, reason, and interdependence reduce violence. The island lacks an economy; the boys have no incentive to cooperate for mutual gain, only survival. Golding ignores the structural incentives that Pinker claims pacify us, focusing solely on authority. Consequently, the novel doesn't disprove Pinker's historical data but attacks the moral comfort derived from it. It suggests that low violence rates are a product of suppression, not evolution.

      Ultimately, the book ends with the officer weeping for the end of innocence, yet he stands on a beach while commanding a vessel of war. The state has returned, but the violence hasn't ended; it has just been outsourced to adults. Golding concedes that the state restores order, but he refuses to call it peace. The novel fits the state-of-nature experiment perfectly but rejects the idea that the state represents moral progress. It shows that without the Leviathan, we are beasts, but with the Leviathan, we are organized beasts. The difference is bureaucratic, not moral.

