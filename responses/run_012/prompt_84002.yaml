      *   **Examples:** Law (hearsay rules don't need justification unless challenged), Stats (default settings don't need defense unless flagged), Grading (claims don't need defense unless circled).
      *   **The Worry:** If the stopping point is "no proper challenge yet," then "proper challenge" seems negotiable/arbitrary, allowing stubbornness to shield anything.
      *   **Question 1:** Does this have a name? (Distinguish from entitlements, hinges, defaults, contextualism).
      *   **Question 2:** If no name, coin one, but focus on the *carving*: Distinguish between (a) intrinsic exemption, (b) contextual exemption (here/now), (c) category mistake (can't be answered). Does it terminate regress or push it back? What are the costs (arbitrariness vs. conversational relativity)?

  2.  **Deconstruct the Philosophical Move:**
      *   The student/colleague/friend is arguing that justification is *dialectical* or *pragmatic*, not purely *structural* or *alethic*.
      *   Standard Regress Argument (Pyrrhonian): Justification requires a reason. That reason requires a reason. Ad infinitum. Solution: Stop at foundations, loop, or accept infinity.
      *   The "New" Move: Justification is only required *when challenged*. No challenge = no obligation to justify.
      *   This shifts the locus of normativity from the *belief itself* (does it have support?) to the *dialogue* (is there a defeater?).
      *   This sounds like *Contextualism* (Annis), *Default & Challenge* (Brandom), *Entitlement* (Wright), or *Hinge Epistemology* (Wittgenstein). But the user specifically wants to know if *this specific formulation* (burden on challenger) has a specific label.

  3.  **Address Question 1: Naming the Move:**
      *   *Candidate 1: Epistemic Contextualism.* (David Annis). Context determines when justification is needed. Close, but often focuses on standards of justification, not the *trigger* for justification.
      *   *Candidate 2: Default and Challenge Structure.* (Robert Brandom). This is the strongest fit. Beliefs are innocent until proven guilty. Justification is a social game of giving and asking for reasons. You don't need to justify unless challenged.
      *   *Candidate 3: Dialectical Foundationalism.* (Or "Dialectical Justification"). Focuses on the argumentative context.
      *   *Candidate 4: Burden of Proof Asymmetry.* Common in logic/rhetoric, less in epistemology proper.
      *   *Candidate 5: Wittgensteinian Hinges.* Hinges don't need justification, but usually because they *can't* be doubted meaningfully, not just because no one challenged them. The user's example is more procedural.
      *   *Candidate 6: Pyrrhonian Skepticism (Agrippan Trilemma response).* Actually, the Skeptic uses the regress to suspend judgment. The student is using a pragmatic block to the regress.
      *   *Best Fit:* **The Default and Challenge Conception of Justification** (associated with Brandom, also Burge's "Entitlement," though Burge is more internalist). Also **Dialectical Justification**.
      *   *Specific Term:* **"Dialectical Foundationalism"** or **"Pragmatic Encroachment on Justification"**? No, those are slightly off.
      *   *Refinement:* The specific move where the *demand* is conditional is often called the **"Challenge Condition"** or **"Defeasibility Condition."** But in the literature of the regress specifically, this is often discussed under **"Contextualist Responses to the Regress"** (Annis) or **"Coherentism as Dialectical"** (Lehrer).
      *   *Wait, there's a more precise match:* **Michael Williams** (Unnatural Doubts). He argues that the regress argument assumes "epistemological realism." He proposes a **Contextualist** view where justification is relative to a context of inquiry. In a normal context, the cup doesn't need justification. In a skeptical context, it does. The student is invoking a *normal* context.
      *   *Another strong match:* **Peter Klein** (Infinitism) discusses this, but the specific "burden on challenger" view is most strongly associated with **Robert Brandom's "Default and Challenge"** structure.
      *   *Decision:* I need to present the cluster. It's not one name. It's the **Default/Challenge Structure** (Brandom), often housed under **Epistemic Contextualism** (Williams/Annis), and sometimes **Entitlement** (Burge/Wright). I need to distinguish them clearly for the user.

  4.  **Address Question 2: The Carving and the Cost:**
      *   *The Carving:*
          1.  **Intrinsic Exemption:** Foundationalism (Basic Beliefs). The belief *itself* has a property (self-evident, incorrigible).
          2.  **Contextual Exemption:** The belief is exempt *here and now* because no defeater is active. (The Student's Move).
