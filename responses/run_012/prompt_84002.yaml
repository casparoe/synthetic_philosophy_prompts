answer: |-
  This is an excellent observation. You are right to feel that this is not merely a student misunderstanding. It is a substantive, well-developed philosophical move that cuts against the grain of the traditional Agrippan trilemma (foundationalism, coherentism, infinitism). The reason it bugs you is that it changes the subject from *alethic* justification (what makes a belief true/likely) to *dialectical* justification (what entitles an agent to hold/assert a belief in a social context).

  Here is the breakdown you asked for: the naming, the carving, and the cost.

  ### 1. Does it have a name?

  Yes, though it appears under a few different banners depending on which literature you are reading. The most precise label for the *structure* of the move is the **Default and Challenge Conception of Justification**.

  *   **Primary Source:** This is most strongly associated with **Robert Brandom** (e.g., *Making It Explicit*). He argues that the "game of giving and asking for reasons" operates on a principle of *innocent until proven guilty*. A commitment (belief) is justified by default; the burden of proof lies on the challenger to produce a defeater.
  *   **Epistemic Contextualism:** In the specific literature on the regress argument, this is the core of **Michael Williams's** response (e.g., *Unnatural Doubts*). Williams argues that the regress argument only works if we assume "epistemological realism" (that justification is a context-independent property). He proposes that justification is relative to a **Context of Inquiry**. In an "ordinary" context, the cup on the desk needs no justification. In a "skeptical" context, it does. The student is invoking an ordinary context.
  *   **Dialectical Justification:** Some meta-epistemologists distinguish between *propositional justification* (having reasons available) and *doxastic justification* (basing belief on reasons). Your student is pointing toward a third category: **Dialectical Justification** (having the right to assert without challenge).

  **Distinction from adjacent views:**
  *   **Entitlement (Burge/Wright):** This is close, but Entitlement usually claims you have a *positive warrant* to trust perception/reason without evidence. Your student/colleagues are claiming you have *no obligation to speak* unless challenged. Entitlement is a warrant; the Default/Challenge move is a procedural immunity.
  *   **Hinge Epistemology (Wittgenstein):** This is the "category mistake" option (your option 3). Hinges are not justified because they are the *scaffolding* of justification. Your student isn't saying the cup is a hinge; they're saying the cup is a standard claim that hasn't been targeted.
  *   **Pragmatic Encroachment:** This is about how stakes affect whether you *know*. Your student is talking about when you have to *speak*.

  **Verdict:** If you need a label for your syllabus, call it **The Default and Challenge Structure** housed within **Epistemic Contextualism**.

  ### 2. The Carving

  You asked for the difference between three specific claims. This is the crucial distinction that dissolves the confusion.

  **(A) "This belief needs no support" (Substantive Foundationalism)**
  *   **Mechanism:** The belief has an intrinsic property (incorrigibility, self-evidence, causal reliability) that stops the regress.
  *   **Status:** Alethic. It is about the relationship between the mind and the world.
  *   **Example:** "I am in pain" or "2+2=4".

  **(B) "This belief needs no support from you, here, now" (Procedural/Dialectical Immunity)**
  *   **Mechanism:** The norms of the conversation place the burden of production on the challenger. The belief is *provisionally* accepted.
  *   **Status:** Deontic/Social. It is about the distribution of obligations between agents.
  *   **Example:** Your law colleague. The hearsay rule is in force *until* a motion to reconsider is filed. The cup is on the desk *until* a skeptic raises a specific defeater.
  *   **Does it terminate the regress?** No. It **suspends** it. It terminates the *obligation to articulate reasons*, but not the *dependency of truth on reasons*. If a proper challenge *is* mounted, the regress starts again.

  **(C) "What you're asking for isn't the kind of thing that can be answered" (Transcendental/Hinge)**
  *   **Mechanism:** The request for justification presupposes the very thing being questioned. Asking for a reason undermines the possibility of reasoning.
  *   **Status:** Grammatical/Constitutive.
  *   **Example:** "Prove that logic is valid." "Prove that the external world exists."
  *   **Difference from (B):** In (B), a challenge *could* be made (e.g., "The lighting is tricky"). In (C), a challenge is *incoherent*.

  **Is the third a cousin?** Yes, but a distant one. (B) is pragmatic; (C) is transcendental. Your students and colleagues are making move (B).

  ### 3. The Cost: Does it terminate anything, or push it back?

  This is where your nervousness is philosophically warranted.

  **Does it terminate the regress?**
  It terminates the **dialectical regress** (the actual exchange of reasons), but it pushes the **structural regress** back one step to the **norms of challenge**.

  If justification stops because "no proper challenge has been made," we must ask: **What counts as a proper challenge?**
  *   In your grading example: A challenge is proper if it cites the rubric.
  *   In law: A challenge is proper if it cites procedure and precedent.
  *   In the student's epistemology: A challenge is proper if...?

  **The Cost:**
  The view saves us from infinitism/foundationalism only by making justification **relative to a community's standards of challenge**.
  1.  **Arbitrariness:** As you noted, if "proper challenge" is negotiable, a stubborn person can shield anything by refusing to recognize challenges. (e.g., "That's not a *real* challenge.")
  2.  **The Regress of Norms:** To avoid arbitrariness, the standards for what counts as a "proper challenge" must themselves be justified. Why is *this* defeater relevant and *that* one not? If those norms need justification, the regress returns at the level of meta-norms.
  3.  **Truth vs. Permission:** This view severs the tight link between justification and truth. You can be dialectically justified (no one has challenged you) but alethically unjustified (you are wrong). The view accepts this cost: it treats justification as a *status within a practice*, not a *mark of truth*.

  **Can it be stated without arbitrariness?**
  Only if the "Context of Inquiry" is fixed by something external to the conversation (e.g., the goals of science, the requirements of legal justice, the biology of perception).
  *   **Michael Williams** argues that contexts are not arbitrary; they are fixed by the *purpose* of the inquiry. In a court, the purpose is justice under law, so challenges must be legal. In a seminar, the purpose is truth, so challenges must be evidential.
  *   **The Catch:** If you ask "Why is *that* the purpose?", you are back in the regress.

  ### Summary for your Teaching

  When a student makes this move, they are inadvertently advocating for **Epistemic Contextualism via a Default/Challenge structure**.

  *   **Don't treat it as a misunderstanding.** Treat it as a rival definition of justification.
  *   **The Counter-Move:** Ask them: "If the burden is on the challenger, what makes a challenge 'proper'? If I say 'I challenge you because I feel like it,' does that trigger the obligation? If not, who decides what counts as a real challenge? And do *they* need a reason for that decision?"
  *   **The Lesson:** This shows that the regress argument isn't about beliefs; it's about **authority**. The Default/Challenge move tries to solve the regress by distributing authority socially. It works for law and grading (where authority is institutionalized). It is much harder to make work for "Truth" (where authority is not institutionalized).

  The move terminates the *conversation*, but only by assuming a shared framework of norms. If the framework itself is contested, the regress reignites. That is the price of the ticket.
