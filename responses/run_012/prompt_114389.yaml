      *   *Syntax:* Mental representations have combinatorial structure (like code).
      *   *Semantics:* Mental representations have content (meaning/reference).
      *   *Productivity/Systematicity:* If you can think $P$, you can think $\neg P$, $P \land Q$, etc. (Infinite capacity from finite parts).
      *   *The "Hard Problem" for LOTH:* Naturalized Semantics. How do symbols get meaning without a homunculus/designer?
      *   *Distinction from CTM:* CTM says the mind *is* a computer. LOTH says the mind uses a *specific kind* of representational system (symbolic, compositional). Connectionism is a rival to LOTH but compatible with weak CTM.

  3.  **Drafting the Translation (SE Vocabulary):**
      *   *Thought:* Runtime state/execution trace.
      *   *Mentalese:* The IR or Bytecode.
      *   *Concepts:* Primitives/OpCodes/Types.
      *   *Compositionality:* AST structure.
      *   *Productivity:* Turing completeness / unbounded recursion.
      *   *Systematicity:* Type safety / Refactoring capabilities (if you have type $A \to B$, you likely handle $B$).
