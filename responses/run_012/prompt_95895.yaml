answer: |-
  **Dissertation Prospectus**

  **Title:** Reasons to Become: Internalism, Externalism, and the Logic of Conversion

  **1. The Research Question**

  The dominant debate in meta-ethics concerning practical reasons is structured by a dichotomy: reasons are either internal (grounded in the agent's existing subjective motivational set) or external (grounded in facts independent of that set). This project asks whether this dichotomy exhausts the normative landscape. Specifically, it investigates a class of reasons I term **conversion reasons**: reasons to undergo a radical transformation of one's motivational set itself.

  Examples include the alcoholic's reason to become sober, the skeptic's reason to convert to a faith, or the careerist's reason to become a parent. In these cases, the reason is not merely to perform an action *within* a current framework of desires, but to adopt a *new* framework.

  The determinate question this dissertation answers is: **Do conversion reasons constitute a distinct normative category that is neither internal nor external in the standard senses, and if so, what is the structure of their normative force?**

  If the answer is affirmative, the project will articulate the logic of "transitional normativity"—how a reason can bind an agent who, by definition, lacks the motivational machinery to recognize it as binding until the transition is complete.

  **2. The Gap in Existing Positions**

  The current literature treats the internal/external debate as a contest over the *source* of reasons for action. Internalists argue that for a consideration to be a reason for an agent, it must be reachable via sound deliberation from their existing motivations. Externalists argue that reasons exist regardless of motivational reachability. Both positions, however, assume a stable agent whose motivational set is the background condition for reasoning, not the object of it.

  This assumption leaves the case of conversion theoretically orphaned.
  *   **The Internalist Blind Spot:** If reasons must be grounded in the current motivational set ($S$), a reason to abandon $S$ faces a paradox. If the reason is grounded in $S$, it validates $S$. If the reason requires abandoning $S$, it appears to undermine its own ground. Internalism typically handles this by stretching the definition of $S$ to include latent dispositions, but this risks making the theory tautological (if any change counts as grounded in $S$, $S$ has no explanatory power).
  *   **The Externalist Blind Spot:** Externalists can easily posit a reason to convert (e.g., "Sobriety is good"), but they struggle to explain the *practical force* of this reason for the agent currently in the throes of addiction. If the agent's $S$ is hostile to the reason, the externalist owes an account of how this reason connects to agency without reducing to coercion or luck.

  Consequently, the debate stalls. Internalists claim conversion is just complex internal reasoning; Externalists claim it's just recognizing independent value. Neither accounts for the specific phenomenology of *becoming*, where the agent is straddling two incompatible normative worlds. The existing positions leave this open because they are designed to adjudicate reasons for *action*, not reasons for *agent-constitution*.

  **3. Methodology and Chapter Outline**

  The method is conceptual analysis driven by phenomenological cases. I will not rely on a comprehensive history of the internal/external debate but will use the positions as structural foils to test the limits of their applicability.

  *   **Chapter 1: The Architecture of the Dichotomy.**
      Establishes the working definitions of Internalism and Externalism. I will isolate the "Stability Assumption"—the tacit premise that the agent's motivational set is fixed for the duration of the reasoning process. This chapter clears the ground by showing why the standard "sound deliberation" critiques do not apply to conversion cases.

  *   **Chapter 2: The Phenomenology of Conversion.**
      Defines the data set. I will distinguish "conversion reasons" from ordinary preference changes. Using cases of addiction recovery, religious conversion, and vocation, I will isolate the structural feature: the incompatibility between the current $S$ and the target $S$. This chapter establishes that these are not merely hard cases, but limit cases.

  *   **Chapter 3: The Internalist Trap.**
      Tests conversion reasons against strict Internalism. I will argue that grounding a reason to leave $S$ *in* $S$ creates a self-undermining structure. I will examine the Internalist strategy of "expanding $S$" (e.g., claiming the addict secretly wants health) and argue that this misdescribes the conflict. The addict's reason to quit often stands *against* their current $S$, not within it.

  *   **Chapter 4: The Externalist Gap.**
      Tests conversion reasons against strict Externalism. I will argue that while Externalism captures the *truth* of the reason (sobriety is valuable), it fails to capture its *practicality*. A reason that cannot engage the agent's agency until the agent has already changed is not a reason for *that* agent. It is a reason for their successor.

  *   **Chapter 5: Toward a Theory of Transitional Normativity.**
      The constructive core. I will propose that conversion reasons are **prospective**. They are not reasons *for* the current agent to act, but reasons *to constitute* a future agent. I will sketch a model where the normative force is derived from the coherence of the future self, accessed through a "bridge commitment" (a temporary, fragile motivation to sustain the process of change).

  *   **Chapter 6: Objections and Implications.**
      Addresses the charge that this is merely a semantic shuffle. I will discuss implications for moral responsibility (are we responsible for who we become?) and rationality (is it rational to dismantle one's own rationality?).

  **4. Success and Failure Conditions**

  *   **Success:** The project succeeds if it demonstrates that conversion reasons possess a logical structure that cannot be reduced to standard Internalism or Externalism without distortion. A successful result provides a vocabulary for "prospective reasons" that explains how an agent can be rationally bound to a future motivational set they do not yet possess.
  *   **Failure:** The project fails if it turns out that conversion reasons are simply a subset of Internalism (i.e., if all conversion can be explained by sufficiently complex deliberation from existing desires) or if the proposed "Transitional Normativity" collapses into Externalism (i.e., if the "bridge commitment" is just an external reason in disguise). Additionally, the project fails if the distinction between "changing a mind" and "changing a self" cannot be rigorously maintained.

  **5. Scope and Feasibility**

  **Is this a year or a career?**
  Honesty is required: the *full* implications of this argument are a career's worth of work. It touches on personal identity, moral psychology, and meta-ethics. However, a dissertation can be completed in a year if the scope is strictly limited to the **meta-ethical structure**.

  *   **The Dissertation Scope:** Focus exclusively on the logical status of the reasons. Do not attempt to solve the metaphysics of personal identity or the psychology of addiction. Treat the "agent" as a philosophical primitive and focus solely on the normative relation between Agent-Time-1 and Agent-Time-2.
  *   **The Career Scope:** Applying this framework to specific domains (e.g., a full theory of moral education, or a new account of religious epistemology) must be left for post-dissertation work.

  **6. Potential Overlaps and Distinctiveness**

  There are two areas where this project risks redundancy. I must distinguish my contribution clearly:

  *   **Akrasia (Weakness of Will):**
      *   *The Overlap:* Akrasia involves acting against one's better judgment. Conversion involves changing the judgment itself.
      *   *The Distinction:* Akrasia assumes a stable normative standard that the agent fails to meet. Conversion questions the standard itself. My project is not about failing to follow reasons, but about the reasons involved in swapping the rulebook. I must ensure I do not simply redescribe "resolute choice" or "akratic action" but focus on the *justification for the change in identity*.
  *   **Transformative Experience (e.g., L.A. Paul):**
      *   *The Overlap:* Paul argues that some experiences are epistemically and personally transformative, making decision-making under uncertainty impossible.
      *   *The Distinction:* Paul's focus is largely decision-theoretic and epistemic (how can I choose what I cannot imagine?). My focus is *normative* (what reason do I have to choose it?). While I will engage with this literature, my claim is not about the impossibility of choice, but about the *type of reason* that operates when choice is possible despite the transformation. I am arguing for a specific normative category, not merely highlighting an epistemic gap.

  **Conclusion**
  This prospectus outlines a project that does not seek to refute Internalism or Externalism, but to map their boundary conditions. By focusing on the moment an agent reasons their way out of existence as that specific agent, we may find a third category of reason that explains how we grow, convert, and become.
