      *   *Historical Event:* The Siege of Masada (73-74 CE), described by Flavius Josephus. Jewish Zealots chose mass suicide over surrender to Romans.
      *   *Ambiguities:*
          *   "Masada": The physical fortress? The symbol of Jewish resistance? The modern State of Israel?
