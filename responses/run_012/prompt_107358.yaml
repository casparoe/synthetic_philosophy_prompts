  # Study Circle Assessment: Decision Theory
  **Time Allowed:** 45 Minutes  
  **Instructions:** Answer the question below. You may assume standard expected utility machinery (probability mixtures, utility functions) is available to you, but you should not rely on named theorems or historical references.

  ### The Problems

  Consider the following choices involving monetary prizes. Assume the intuitive preferences stated below reflect your own judgment.

  **Pair 1**  
  *Problem 1:* Choose between **A** ($400 for certain) and **B** (90% chance of $400, 9% chance of $2,000, 1% chance of $0).  
  *Problem 2:* Choose between **C** (10% chance of $400, 90% chance of $0) and **D** (9% chance of $2,000, 91% chance of $0).  
  *Intuitive Preference:* **A** over **B**; **D** over **C**.

  **Pair 2**  
  *Problem 3:* Choose between **E** ($1,000 for certain) and **F** (80% chance of $2,500, 20% chance of $0).  
  *Problem 4:* Choose between **G** (50% chance of $1,000, 50% chance of $0) and **H** (40% chance of $2,500, 60% chance of $0).  
  *Intuitive Preference:* **E** over **F**; **H** over **G**.

  ### The Essay

  Write a critical analysis of these preferences. Your essay must address the following four points in order:

  1.  Demonstrate formally that these four choices cannot be represented by a standard utility function linear in probabilities. Do this by decomposing the lotteries into mixtures to show where the inconsistency arises, rather than simply asserting a violation.
  2.  Evaluate the explanation that these preferences are driven by a special attachment to certainty. Explain why this account succeeds for Problem 1 and Problem 3 but fails to fully explain Problem 2 and Problem 4, and identify what feature of the probabilities is driving the choice once certainty is removed.
  3.  Distinguish between the claim that these preferences describe how people *do* choose and the claim that they describe how people *should* choose. Engage with the strongest argument for why the standard model insists these preferences are erroneous (specifically regarding the irrelevance of shared components), and take a position on whether this error is rational.
  4.  Propose a principled modification to the theory that accommodates all four intuitive choices while retaining a structural constraint similar to the standard model. State clearly what theoretical cost this modification incurs.

  ***

  # Model Answer

  The four choices provided constitute a systematic violation of the linearity requirement in standard decision theory. To demonstrate this, we must decompose the lotteries into mixtures of common and varying components.

  In Pair 1, Lottery A can be written as a mixture: 0.9 chance of $400 plus 0.1 chance of $400. Lottery B is 0.9 chance of $400 plus 0.1 chance of a sub-lottery yielding $2,000 (90%) or $0 (10%). Choosing A over B implies preferring $400 for sure over that sub-lottery. However, look at Pair 2 (labeled Problem 2 in the prompt). Lottery C is 0.9 chance of $0 plus 0.1 chance of $400. Lottery D is 0.9 chance of $0 plus 0.1 chance of that same sub-lottery ($2,000 at 90%, $0 at 10%). Choosing D over C implies preferring the sub-lottery over $400 for sure. This is a direct contradiction: the preference between the varying components reverses depending on the common component (either $400 or $0) mixed with them.

  Pair 2 shows a similar structural failure via scaling. E is $1,000 for sure. F is 0.8 chance of $2,500 plus 0.2 chance of $0. Choosing E over F implies $1,000 is preferred to that gamble. G and H are simply E and F mixed with a 0.5 chance of $0. G is 0.5E + 0.5($0); H is 0.5F + 0.5($0). Standard theory requires that if E is preferred to F, then G must be preferred to H. The intuitive preference for H over G violates this consistency.

  A common explanation for Pair 1 and Pair 2 (Problem 3) is the "certainty effect": people overweight outcomes that are guaranteed. This explains A over B and E over F, where one option is risk-free. However, this explanation collapses in Problem 2 and Problem 4. In Problem 4, both G and H are risky; there is no certainty to overweight. Yet the preference reverses. The driving force is not certainty per se, but the non-linear weighting of probabilities. The drop from 100% to 80% probability (in Pair 2) is psychologically weighted more heavily than the drop from 50% to 40% (in Problem 4), even though both are a 20% reduction. The slope of the probability weighting function is steeper near the endpoints than in the middle.

  This leads to the normative question: are these preferences rational? Descriptively, they are robust; most people choose this way. Normatively, the standard model argues they are errors. The strongest defense of the standard model is the argument from irrelevance: if two options share a common consequence with the same probability, that component should cancel out. It is irrelevant to the decision. Letting the common component sway the choice is akin to letting irrelevant context dictate value. However, one can argue this defense ignores complementarity. The presence of a high probability of a good outcome might reduce the regret of a small risk, whereas a high probability of zero makes the small chance of a gain feel more significant. If context changes the meaning of the outcome, the independence requirement is too rigid. I take the position that while the preferences violate logical consistency defined by cancellation, they reflect a rational sensitivity to context and regret that the standard model ignores.

  To accommodate these choices, we must modify the theory to allow non-linear probability weighting. We can replace objective probabilities $p$ with decision weights $\pi(p)$, where $\pi$ is an S-shaped function overweighting small probabilities and underweighting moderate-to-high ones. This preserves a form of structural consistency (comonotonic independence) where independence holds only when lotteries are ranked similarly across states. The cost of this repair is significant. We lose the elegant linearity that allows for simple calibration and aggregation of risks. Furthermore, by making weights depend on the ranking of outcomes, the evaluation of a gamble depends on the other gambles available in the set, complicating the notion of stable intrinsic value. We gain descriptive accuracy but lose the normative simplicity that made the standard model a prescriptive tool.

