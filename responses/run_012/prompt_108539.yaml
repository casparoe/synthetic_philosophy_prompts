answer: |-
  **Covering Note**

  This document treats qualia as ontologically robust entities eligible for regulatory oversight, whereas much contemporary philosophy of mind (notably Dennett's "Quining Qualia") argues they are theoretical constructs that dissolve under scrutiny. The note leans heavily on the traditional Cartesian conception (ineffable, intrinsic, private, directly apprehensible) to create bureaucratic friction, assuming these properties are real features of the world rather than contingent definitions. It also operationalizes the Chase and Sanborn thought experiment as a routine casework scenario, presupposing that the distinction between "taste changing" and "taster changing" is a factual matter susceptible to administrative resolution, despite the philosophical consensus that such states are behaviorally indistinguishable.

  ***

  **DEPARTMENT OF PHENOMENOLOGICAL ADJUDICATION**
  **INTERNAL GUIDANCE NOTE 44-B**
  **SUBJECT: Determining Whether a Subject's Qualia Have Changed: Guidance for Case Officers**

  1.  The purpose of this guidance is to assist Case Officers in adjudicating claims under Section 9 of the Phenomenological Stability Act. Officers must determine whether a citizen's subjective experience (qualia) has undergone material alteration, or whether the alteration resides solely in the citizen's reactive disposition. This distinction is vital for benefit eligibility. Officers must proceed on the established ontological basis that qualia are real, measurable properties of consciousness, notwithstanding the difficulties in locating them within the standard administrative framework.

  2.  Officers will recall the four defining marks of qualia: they are ineffable, intrinsic, private, and directly apprehensible. Each mark presents a specific procedural hurdle. Because qualia are ineffable, subjects cannot describe them accurately. Because they are private, third-party verification is impossible. Because they are intrinsic, they cannot be calibrated against external standards. Because they are directly apprehensible, only the subject's report counts as evidence. Officers must navigate these hurdles without invalidating the claim process.

  3.  Consider the standard Coffee-Taster Scenario (Case Reference: Chase/Sanborn). Two subjects exhibit identical discriminatory behavior regarding coffee blends. Both claim the experience has changed. Subject A (Chase) asserts the taste itself is different. Subject B (Sanborn) asserts the taste is unchanged, but his enjoyment has shifted. Behaviorally, these statements are identical. Linguistically, they are distinct. The Officer's task is to verify which statement corresponds to the phenomenological fact, despite the lack of external correlates.

  4.  Regarding ineffability: Form 12-A requires a written description of the qualia in question. Officers should note that by definition, this field cannot be completed. However, leaving it blank triggers an audit flag. Officers must instruct subjects to write "Ineffable" in this field. This satisfies the requirement for data entry without compromising the philosophical integrity of the definition. Do not accept metaphors; metaphors imply comparability, which contradicts the intrinsic nature of the experience.

  5.  Regarding privacy: During the oral hearing, testimony from Chase and Sanborn will be indistinguishable. Both will say, "It is not the same for me." Officers cannot probe deeper without suggesting leading questions that might alter the qualia themselves. Therefore, the hearing serves primarily as a record of assertion rather than a tool of discovery. Officers should nod attentively during these segments to maintain claimant confidence in the investigative process.

  6.  Regarding the intrinsic nature of experience: The Calibration Protocol requires subjects to compare current experiences against a Standard Memory Stimulus. Officers must ask, "Does this taste like the coffee of 1998?" This protocol presupposes that the memory of the 1998 qualia remains intrinsic and unchanged. While this presupposition is unprovable, it is necessary for the protocol to function. Officers should proceed as if the stability of past qualia is an established fact, despite the lack of evidence for such stability.

  7.  Regarding direct apprehension: The Evidentiary Rule states that only the subject's direct apprehension of their qualia is admissible. Consequently, the subject's report is the only evidence allowed. However, the report is also the very fact being proved. This creates a circularity. Officers are advised not to log this circularity in the case notes. Instead, record the report as "Self-Verifying Evidence Type 1." This maintains the audit trail without highlighting the epistemological loop.

  8.  Officers should continue to administer the Phenomenological Stability Index (PSI) at the start of each interview. It has been demonstrated internally that the PSI measures response latency rather than qualitative shift. However, the PSI provides a numerical value for the case file. Removing it would reduce the perceived rigor of the adjudication. Therefore, the PSI is retained for morale and archival density. Record the score regardless of its predictive validity.

  9.  In instances where the Chase/Sanborn distinction cannot be administratively resolved—which is to say, in all instances—Officers are authorized to invoke the Interim Certification Protocol. This allows the Officer to certify whatever the subject asserts as fact. This is not an admission that the fact is unknowable, but rather an administrative convenience pending the development of better diagnostic tools. Treat the subject's verdict as binding for the purposes of disbursement.

  10. Finally, Officers must never conclude that qualia do not exist. To do so would render the Department obsolete. We operate on the principle that the difficulty of measurement does not negate the existence of the measured object. Our inability to distinguish Chase from Sanborn reflects the limitations of our current instrumentation, not the unreality of their experience. Proceed with sincerity. The stability of the subjective world depends on our willingness to process the paperwork.
