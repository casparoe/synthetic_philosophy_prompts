  **Letter:**
  Dear Auntie,
  We have won the conflict. I wish to try the opposing leadership. I want history to call it justice, not revenge. However, my own officers committed similar acts, and much of what the enemy did was not strictly illegal when they did it. How do I proceed without looking hypocritical or lawless?
  — General V.

  **Reply:**
  Dear General,
  Do not worry. This is a standard complication in post-conflict etiquette. One encounters it whenever the dust settles and the victors wish to host a tribunal. The goal is always the same: to establish a narrative of order without inviting scrutiny of the host's own household. You simply need to adjust the guest list and the menu.

  Regarding the matter of laws that did not exist at the time of the infractions, you must avoid the appearance of inventing rules after the game has ended. It looks poor form. Instead, rummage through the archives for any pre-war pact wherein all parties promised not to start wars in the first place. There is usually one gathering dust in a foreign ministry. Lean on that heavily. Frame the charges around the act of starting the conflict rather than the conduct within it. This allows you to treat the war itself as the crime, which conveniently sidesteps the question of whether specific atrocities were prohibited by statute at the time. Call it Crimes Against Peace. It sounds dignified and avoids technical debates about retroactive legislation.

  On the subject of your own officers having done similar things, this is a matter of jurisdictional focus. A tribunal has limited resources, and one must prioritize. You are the host; you set the scope of the inquiry. Define the jurisdiction to cover only the territories liberated from the enemy, not the territories held by your alliance. This ensures that evidence regarding your own side's conduct is deemed irrelevant to the specific charges at hand. If a defense attorney attempts to introduce comparisons regarding your bombardment of their cities, rule it out of order. It is not a comparative study; it is a reckoning. To allow otherwise would turn the proceedings into a mudslinging match, and no one leaves a mudslinging match feeling satisfied with the justice served.

  You also asked about defendants who are too useful or too embarrassing to try. This is common. Some scientists possess knowledge too valuable to lock away, and certain allied leaders are too necessary for the upcoming peace to sit in the dock. For the useful ones, classify their files as pending indefinitely due to administrative backlog. For the embarrassing ones, cite health reasons or employ them as witnesses instead of accused. They can testify against their colleagues from the stand, which keeps them out of the cell while still providing the necessary testimony. It is a practical compromise.

  Finally, regarding the chain of command, you must find the right level of culpability. Do not try the common soldiers; they were following orders, and trying them looks petty. Do not try the very top head of state if you intend to govern their country afterward; you need a functioning administration. Aim for the middle management. The generals who signed the orders, the ministers who organized the logistics. They are numerous enough to satisfy the public desire for accountability but expendable enough that their removal does not collapse the post-war order.

  Ensure the proceedings are slow, formal, and heavily documented. Boredom is your ally. If the process looks tedious, it looks legal. If it looks legal, it looks just.

  Sincerely,
  Auntie

