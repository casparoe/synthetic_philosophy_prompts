answer: |-
  # PHILOSOPHY CLUB HANDOUT: THE TAXONOMY OF DIRTY HANDS
  **Term:** Ethics of Political Leadership | **Session:** 4 | **Date:** Thursday

  ### HOW TO USE THIS TREE
  Do not start by choosing a label (e.g., "I am a utilitarian"). Start with one of the **Concrete Cases** below. Answer the questions at each branch based on your intuition about that specific case. Follow the lines down until you reach a **Leaf**. The Leaf names the philosophical position that matches your answers.

  If you reach a box marked **[LOGICAL GAP]**, you have found a combination of answers that few or no philosophers occupy. Read the diagnosis to see why that space is empty.

  ### THE CONCRETE CASES
  *Choose one to hold in your mind as you descend the tree:*
  1.  **The Mayor:** Orders a police raid knowing an innocent hostage will die to save fifty others.
  2.  **The Finance Minister:** Lies about currency reserves to stop a panic that would ruin thousands of pensions.
  3.  **The Peace Envoy:** Offers amnesty to a warlord who ordered a massacre to end a civil war.
  4.  **The Head Teacher:** Expels an innocent pupil to break up a violent gang running the school.

  ---

  ### THE DECISION TREE

  **LEVEL 1: THE ONTOLOGY OF THE ACT**
  *Looking at your case (e.g., the Mayor's raid), assume the outcome is successful (lives saved, war ended).*
  **Q:** Is the act itself (killing the hostage, lying, betraying justice) **morally tainted**, or does the good outcome erase the stain entirely?
  *   **A: The stain is erased.** The act was right, all things considered. Nothing is "dirty."
      *   └─► **LEAF 1: MORAL DISSOLUTION (Consequentialism)**
          *   *Hardest Commitment:* You must argue that killing the hostage was not actually a moral wrong, which conflicts with the intuition that the victim was used as a tool.
  *   **A: The stain remains.** The act is genuinely wrong, even if it was necessary.
      *   └─► *Go to Level 2.*

  **LEVEL 2: THE AUTHORITY OF THE ROLE**
  *You have admitted the act is generally wrong (e.g., lying is bad).*
  **Q:** Does holding political **office** create a special set of moral rules that do not apply to private citizens?
  *   **A: Yes.** The Office has its own morality; what is wrong for a parent may be right for a Minister.
      *   └─► **LEAF 2: ROLE MORALITY**
          *   *Hardest Commitment:* You must explain why the office grants immunity from universal moral laws without simply reducing this to "might makes right."
  *   **A: No.** The same moral rules apply to everyone, regardless of title.
      *   └─► *Go to Level 3.*

  **LEVEL 3: THE CONDITIONS OF DELIBERATION**
  *The rules are universal, but the act is still done.*
  **Q:** Did the leader have **time to deliberate**, or was this an emergency with no alternative? (Compare the Head Teacher's planned expulsion vs. the Mayor's immediate raid).
  *   **A: No time (Emergency).** The decision was forced by circumstances; there was no real choice.
      *   └─► **LEAF 3: NECESSITY DEFENCE**
          *   *Hardest Commitment:* You must argue that the lack of time removes moral agency, risking the claim that leaders can manufacture emergencies to avoid blame.
  *   **A: Time to deliberate.** The leader calculated the costs and chose the wrong act knowingly.
      *   └─► *Go to Level 4.*

  **LEVEL 4: THE DEONTIC STATUS**
  *The leader chose a wrong act knowingly under universal rules.*
  **Q:** Is the leader **forbidden** to do it, or are they **permitted/required** to do it?
  *   **A: Forbidden.** You simply must not do it, regardless of the cost.
      *   └─► **LEAF 4: MORAL ABSOLUTISM**
          *   *Hardest Commitment:* You must accept that the hostage dies or the economy collapses, maintaining that keeping one's own hands clean is more important than the outcome.
  *   **A: Permitted/Required.** You may or must do it, despite the wrong.
      *   └─► *Go to Level 5.*

  **LEVEL 5: THE LOCUS OF DIRT**
  *The act is wrong but required/permitted.*
  **Q:** Where does the moral "dirt" stick? To the **Person** (the leader's soul/character) or the **Office** (the institution)?
  *   **A: The Office.** The institution is corrupted by the necessity, but the individual can remain clean if they act procedurally.
      *   └─► **LEAF 5: INSTITUTIONAL STAIN**
          *   *Hardest Commitment:* You must explain how an institution can bear guilt without the people running it bearing any personal responsibility.
  *   **A: The Person.** The leader personally absorbs the moral damage.
      *   └─► *Go to Level 6.*
  *   **A: Neither.** The idea of "dirt" is a confusion.
      *   └─► **LEAF 6: DEFLATIONARY VIEW**
          *   *Hardest Commitment:* You must argue that our feeling of guilt is merely a psychological clash between two inherited moral codes (religious vs. political) with no reality in the act itself.

  **LEVEL 6: THE AFTERMATH**
  *The leader is personally stained by a required wrong act.*
  **Q:** What does the leader owe afterwards? (Remorse, restitution, resignation, or nothing?)
  *   **A: Nothing.** They did what was required; guilt is useless.
      *   └─► **LEAF 7: MACHIAVELLIAN REALISM**
          *   *Hardest Commitment:* You must defend the claim that a leader can do moral wrong without damaging their own character or owing anything to the victim.
  *   **B: Regret, but no resignation.** They feel bad, but must stay to govern.
      *   └─► **LEAF 8: THE LESSER EVIL**
          *   *Hardest Commitment:* You must distinguish this "regret" from genuine moral guilt, explaining why the act was justified enough to stay in power but not justified enough to feel good about it.
  *   **C: Guilt and Remorse.** They must bear the burden personally.
      *   └─► **LEAF 9: THE TRAGIC HERO (Walzerian)**
          *   *Hardest Commitment:* You must argue that it is possible to be morally guilty for doing the *right* thing, which strains the definition of moral guilt.
  *   **D: Resignation.** The act disqualifies them from further leadership.
      *   └─► **LEAF 10: THE PENITENT LEADER**
          *   *Hardest Commitment:* You must accept that the person best equipped to manage the aftermath of the crisis is the one who must leave, potentially causing further harm.

  ---

  ### [LOGICAL GAPS]
  *If your answers led you here, you are in a space few philosophers occupy.*

  **GAP A: The "Clean Executioner"**
  *(Path: Act is Wrong → Forbidden → Do it anyway → No Personal Stain)*
  *   **Diagnosis:** **Incoherent.** If the act is genuinely wrong and forbidden, doing it must generate some moral residue. Claiming otherwise contradicts the first premise.
  *   **Why Empty:** It attempts to claim the virtue of obedience to necessity without the cost of moral violation.

  **GAP B: The "Hardened Heart"**
  *(Path: Act is Wrong → Required → Personal Stain → No Remorse Owed)*
  *   **Diagnosis:** **Unattractive/Unexplored.** This suggests the leader is objectively damaged (stained) but subjectively indifferent.
  *   **Why Empty:** Most theories link "stain" to "guilt." To admit the stain but deny the emotional/behavioral response (remorse) looks like sociopathy rather than a political theory.

  **GAP C: The "Forbidden but Blameless"**
  *(Path: Act is Wrong → Forbidden → Do it → No Guilt due to Time Pressure)*
  *   **Diagnosis:** **Tension.** This overlaps with *Necessity Defence* (Leaf 3) but contradicts Level 4 (Forbidden).
  *   **Why Empty:** If time pressure makes you blameless, the act usually shifts from "Forbidden" to "Excused." Keeping it "Forbidden" while removing blame creates a category error.

  ---

  ### NOTE ON LIMITS
  This tree cannot separate **The Lesser Evil (Leaf 8)** from **The Tragic Hero (Leaf 9)** in every instance. Both agree the act is wrong and required. The difference lies in the *intensity* of the guilt and whether the leader can continue governing without moral corruption. If you find yourself sliding between these two, it is because the distinction is one of degree (how much guilt?) rather than kind (is there guilt?). Acknowledge this ambiguity; it is a feature of the problem, not a failure of the tree.
