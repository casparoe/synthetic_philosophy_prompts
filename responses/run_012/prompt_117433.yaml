answer: |-
  **Seminar Prep: The Hostage Case (Meridia vs. Fortuna)**

  **The Case**
  Two city-states, Meridia (A) and Fortuna (B). Both deliver identical baskets: 5% growth, universal housing, low crime, high trust. No repression, no cooked stats. Citizens in both know the regime type (non-competitive executive selection) and are satisfied. Institutions (civil service, courts, advisory councils) are identical on paper.

  *   **Meridia (A):** The goods are institutionalized. Housing trusts are legally independent; trade deals are treaty-bound; investment relies on rule of law. If the leadership were replaced tomorrow, the systems would absorb the shock. The prosperity does not need *these* people.
  *   **Fortuna (B):** The goods are personalized. Housing works because the Leader personally guarantees developers. Trade relies on the Leader's personal credibility with partners. Investment flows because investors trust the Leader's specific discipline. If the leadership were replaced tomorrow, guarantees vanish, credit freezes, and the goods collapse. The prosperity needs *these* people.

  **The Pressure Point**
  Performance legitimacy argues: *Right to rule derives from delivery of goods.*
  In Fortuna (B), the leaders are causally more responsible for the goods than in Meridia (A). In A, the system does the work; in B, the rulers do the work.
  *   **The Trap:** Must the performance-legitimacy defender argue B has a *stronger* claim to rule because the leaders are more indispensable to the outcome?
  *   **The Consequence:** If yes, the doctrine licenses **rule by hostage**. It validates the claim: "You must obey us specifically, because if we leave, your life gets worse." This transforms legitimacy from a moral claim into a protection racket.

  **Three Verdicts**

  1.  **Performance-Legitimacy Defender:** Must argue Meridia (A) is superior. Why? Because "performance" implies *sustainable* performance. Fortuna's fragility reveals the goods were never institutional achievements, but personal favors. Legitimacy requires the *capacity to continue*, not just the *fact of delivery*.
      *   *Risk:* This concedes that performance alone isn't enough; you need institutionalization. If institutionalization requires constraints on the ruler (to prevent personalization), you are sliding back toward proceduralism.
  2.  **Procedural Legitimacy Defender:** Both lack legitimacy (no consent). But Fortuna (B) is morally worse. It creates a dependency that makes exit impossible. Citizens cannot weigh alternatives because the rulers have sabotaged the counterfactual. This is structural coercion without violence.
  3.  **Thoroughgoing Prudentialist:** Neither case is about legitimacy. Both are about interest. In Meridia, comply because the system benefits you. In Fortuna, comply because the alternative is disaster. Fortuna simply raises the stakes of compliance. Calling B "legitimate" confuses *power* with *right*.

  **The Single Feature & The Check**
  *   **Feature:** **Substitutability.** (Can the rulers be replaced without loss of goods?)
  *   **The Check:** If I make Fortuna's goods robust (institutionalized), the "hostage" element vanishes. If I make Meridia's goods fragile (personalized), it becomes Fortuna.
  *   **Result:** If the case dies when robustness is equalized, it proves the doctrine was never about "performance" per se, but about **systemic security**.
  *   **Implication:** If performance legitimacy requires institutional robustness to be defensible, it cannot defend personalized autocracy. It must advocate for systems that survive the ruler. But systems that survive the ruler usually require rules that bind the ruler. Thus, performance legitimacy, pushed hard enough, eats itself and demands procedural constraints.

  **Honesty Check: Did I Stack the Deck?**
  *   **Charge:** You smuggled in a democratic premise by defining Fortuna's fragility as illegitimate.
  *   **Defense:** No. I smuggled in a **continuity premise**. Performance legitimacy promises *order and growth*. Fortuna cannot promise order *beyond the current leadership*. Therefore, Fortuna fails its own metric on a long time horizon.
  *   **Concession:** The case bites hardest if we assume citizens value *future* security. If citizens are purely present-oriented, Fortuna is indistinguishable from Meridia. The doctrine only collapses if we assume rational actors care about what happens after the current ruler dies. If the performance-legitimacy defender accepts short-termism, the doctrine is indeed just prudence wearing a normative hat.

  **Seminar Instruction:** Push the PL defender to explain why Fortuna's leaders shouldn't demand *more* loyalty since they are *more* responsible for the success. Force them to choose between "indispensability" and "sustainability." They cannot have both.
