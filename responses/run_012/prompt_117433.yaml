      *   **Task:** Build a two-regime thought experiment (Country A vs. Country B).
      *   **Constraints:**
          *   Present day, realistic, no sci-fi tech, no external threats.
          *   Under a page (concise).
          *   Same basket of goods (growth, order, housing, safety, satisfaction).
          *   Same standard of delivery.
          *   Same institutions (except the key difference).
          *   Rulers genuinely made the choices.
          *   No repression, no cooked stats, no hidden coercion.
          *   Citizens know the regime type.
          *   **Key Difference:**
              *   Country A: Goods are robust/structural. If gov falls, goods continue.
              *   Country B: Goods are fragile/personalized. If gov falls, goods collapse (hostage situation).
      *   **Analysis Required:**
          *   Walk through the implications.
          *   Does the performance-legitimacy defender have to say B has a *stronger* claim? (Because more good is attributable to them?)
          *   If yes, expose the "rule by hostage" consequence.
          *   Provide three verdicts: Performance-Legitimacy Defender, Procedural Legitimacy Defender, Thoroughgoing Prudentialist.
          *   Identify the single feature doing the work.
          *   Run the check: If robustness is equalized, does the case die? Does this reveal the doctrine is just prudence?
          *   Honesty check: Is the deck stacked? Is a democratic premise smuggled in?

  2.  **Drafting the Thought Experiment (Country A vs. Country B):**
      *   *Setting:* Two similar developed Asian city-states or small nations. Let's call them "Meridia" (A) and "Fortuna" (B).
      *   *Outputs:* 5% growth, low crime, affordable housing, high trust.
      *   *Inputs/Structure:* Both have advisory councils, both have meritocratic civil services.
      *   *The Twist:*
          *   Meridia (A): Institutions are codified. Laws run the housing scheme. Independent courts enforce contracts. The economy is diversified. The leadership is replaceable without systemic shock.
          *   Fortuna (B): Success relies on specific personal networks. The housing scheme works because the Leader personally guarantees the developers. The economy runs on state-directed credit that relies on the Leader's specific credibility with investors. If the Leader goes, the credit freezes, the developers walk, the scheme collapses.
      *   *Constraint Check:* No repression in B. Citizens know this. They are happy *now*.

  3.  **Analyzing the Implications (The "Walk Through"):**
      *   *Performance Legitimacy Defender (PLD):* Usually argues "We deliver, therefore we rule." In Case A, they delivered via institutions. In Case B, they delivered via personal capacity.
      *   *The Trap:* If legitimacy comes from *performance*, does the *source* of performance matter?
      *   *Argument:* If B's leaders say "You need us specifically, or this ends," is that a stronger claim?
      *   *Intuition:* It feels like coercion/hostage-taking. "Obey or the lights go out."
      *   *PLD Dilemma:* If they say B is *more* legitimate because the leaders are more indispensable, they endorse hostage-taking. If they say A is *more* legitimate because the goods are secure, they admit that *sustainability* matters more than *attribution*.
      *   *Proceduralist:* Both lack consent mechanisms (assuming the prompt implies non-electoral removal for the sake of the argument, or at least focusing on the performance aspect). But B is worse because it creates dependency.
      *   *Prudentialist:* Legitimacy is the wrong word. It's about rational compliance. In A, comply because it's good. In B, comply because the alternative is disaster. Both are interest-based.

  4.  **Developing the Verdicts:**
      *   *PL Defender:* Must argue B is *riskier* but potentially *more* deserving of loyalty because the leaders are the actual engine. OR, they must retreat to "sustainable performance," which undermines the "we did this" claim. Let's push them to the corner: If performance is the metric, B's performance is more tightly coupled to the ruler. Therefore, B demands more loyalty. *Critique:* This is mafia protection racket logic.
      *   *Proceduralist:* Both lack democratic legitimacy. But B is tyrannical because it makes rights contingent on specific persons.
      *   *Prudentialist:* Neither has legitimacy. Both have compliance based on interest. B is just a higher-stakes prisoner's dilemma.

  5.  **Identifying the Single Feature:**
      *   *Feature:* **Substitutability vs. Indispensability.** (Or Fragility of Goods).
      *   *The Check:* If B's goods become robust (institutions take over), the "hostage" element vanishes. If A's goods become fragile (depend on leader), A becomes B.
      *   *Conclusion:* If the case dies when robustness is equalized, it shows "performance legitimacy" conflates *good outcomes* with *right to rule*. If the goods are the same, the right to rule should be the same *unless* we care about how the goods are secured (institutional vs. personal).

  6.  **Honesty Check (Deck Stacking):**
      *   *Smuggling:* Did I smuggle in a democratic premise?
      *   *Potential Issue:* By defining B as "if the government fell... goods would go," am I implying instability that violates the "order" promise of performance legitimacy?
      *   *Counter:* Performance legitimacy promises *continuity* of goods. B cannot promise continuity if the leadership changes. So B is inherently making a claim that "We must stay to keep this."
      *   *Verdict:* The deck isn't stacked on democracy, but it *does* expose that performance legitimacy requires institutionalization to be morally defensible. If it remains personalistic, it's extortion. The doctrine *needs* institutionalization to avoid being a racket. So the critique holds.

  7.  **Refining the Tone:**
      *   Seminar prep note. Sharp, analytical, slightly provocative.
      *   Keep it under a page (roughly 500-700 words).
      *   Avoid jargon where possible, but use precise political theory terms.

  8.  **Drafting - Section by Section:**
      *   *Case:* Meridia (A) vs. Fortuna (B).
