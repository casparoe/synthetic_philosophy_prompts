      *   *Refining Step 3:* The friend calls it "Rational expectations are sticky." In game theory terms, this is about **consistency of beliefs in subgames that are reached with probability zero**. If A passes at 1, we are in a subgame that should have probability 0 under CKR. Standard Nash/SPNE doesn't restrict beliefs there. Step 3 imposes a restriction: "Believe they are still rational maximizers."
