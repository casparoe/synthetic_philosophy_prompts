      *Let's refine the Average Utilitarianism point.* If the monster consumes resources, the others' utility drops. If the monster's utility is *huge*, the average of (Monster + Others) could still be higher than (No Monster + Others). So Average Utilitarianism doesn't automatically solve it. This is a significant conceptual slip. I should mark that down slightly in the feedback. Maybe a B+ is more accurate? No, for an intro course, identifying the distinction is the main goal. The application is secondary. I'll stick with A- but note the imprecision heavily.

      *Let's refine the Rule Utilitarianism point.* The student says RU "could adopt the rule." A consistent RU adopts the rule that *maximizes* utility. If feeding the monster maximizes utility, the rule would be "Feed the monster." The student treats RU as deontology with a utility label. This is a common student error. I need to point this out gently.

