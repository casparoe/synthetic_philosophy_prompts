prompt: |-
  Last week in a product review I proposed surveying our users about which feature they want next, and a colleague shut the idea down with a line I have now heard three times: watch what they do, not what they say. He added that this is just revealed preference and that it is settled economics. I have spent enough time in dashboards to feel the pull of it, but I want to know exactly what I would be conceding if I accepted it. Could you lay out the distinct precise claims that sentence could be making, from the trivial to the strong, and for each say whether it is trivially true, substantive and defensible, or simply false? I am particularly interested in which readings are definitional rather than empirical, whether any reading actually rules out asking users what they want as opposed to merely ranking it below observed behavior, whether the slogan presupposes that each user has a single stable ranking of wants that their clicks express, and which reading my colleague is most likely relying on. Please end by saying what follows for the decision actually in front of us: should we run the survey, and if the slogan does not settle that, what would?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Context:** The user proposed a user survey for feature prioritization. A colleague rejected it using the slogan "Watch what they do, not what they say" (revealed preference theory).
      *   **Task:** Analyze the slogan by breaking it down into distinct, precise claims (from trivial to strong).
      *   **Evaluation:** For each claim, determine if it's trivially true, substantive/defensible, or false.
      *   **Specific Interests:**
          *   Definitional vs. Empirical claims.
          *   Does it rule out asking users vs. just ranking it lower?
          *   Does it presuppose stable preferences?
          *   What is the colleague likely relying on?
      *   **Conclusion:** actionable advice on whether to run the survey and what criteria should actually decide.

  2.  **Initial Brainstorming & Economic Theory Check:**
      *   *Revealed Preference Theory (RPT):* Originates with Samuelson. Core idea: Preferences are *defined* by choices. If you choose A over B, you reveal you prefer A over B.
      *   *The Slogan:* "Watch what they do, not what they say." This is a pop-econ simplification of RPT.
      *   *Tension:* In product management, "saying" (surveys/interviews) often conflicts with "doing" (analytics/usage data).
      *   *Nuance:* RPT is a theoretical framework, not necessarily an empirical law of human psychology. People lie, people make mistakes, people don't know what they want, contexts change.
      *   *The "Settled Economics" Claim:* This is a strong rhetorical move. Is it actually settled? In micro theory, yes, preferences are modeled via choice. In behavioral econ, no, preferences are constructed and context-dependent.

  3.  **Drafting the Claims (Graded Strength):**

      *   *Claim 1 (Weak/Trivial):* Actions have consequences; words don't (always). If they say they want X but use Y, Y is what they actually value *in that moment*.
      *   *Claim 2 (Moderate/Defensible):* Self-reported data is noisy/biased. Social desirability bias, lack of self-awareness. Observed behavior is often a better predictor of *immediate* retention/revenue.
      *   *Claim 3 (Strong/RPT Definition):* Preference *is* choice. To say "I prefer X" but choose Y is a contradiction in terms within the model.
      *   *Claim 4 (Very Strong/Empirical):* Users *never* know what they want better than their clicks show. Surveys are useless noise.
      *   *Claim 5 (Metaphysical/Stable Preferences):* Users have a single, stable utility function that clicks perfectly reveal.

  4.  **Evaluating the Claims:**

      *   *Claim 1:* Trivially true. Actions commit resources (time/money); words are cheap.
      *   *Claim 2:* Substantive and defensible. Behavioral econ supports this (bias), but doesn't make words *useless*, just noisier.
      *   *Claim 3:* Definitional (within neoclassical econ). But applying it to *product features* (future goods) is tricky. You can't choose a feature that doesn't exist yet.
      *   *Claim 4:* False. Surveys capture intent, pain points, and *latent* needs not yet expressible in behavior.
      *   *Claim 5:* False. Behavioral econ and psychology show preferences are constructed, unstable, and context-dependent.

  5.  **Addressing Specific User Questions:**
      *   *Definitional vs. Empirical:* RPT is largely definitional (tautological). The application to product management is empirical (does this predict success?).
      *   *Rules out asking?* No. Even strict RPT allows gathering info, but weights choice higher. The slogan implies exclusion ("not what they say"), which is an overreach.
      *   *Stable Ranking?* Yes, the strong version presupposes stability. The weak version just says "current choice reveals current preference."
      *   *Colleague's Reliance:* Likely relying on the *empirical* version (Claim 4) disguised as the *definitional* version (Claim 3) to win the argument ("settled economics").

  6.  **Developing the Recommendation:**
      *   Should we run the survey? It depends.
      *   *When to survey:* New categories, latent needs, understanding *why* behind the *what*, future features (cannot be revealed yet).
      *   *When to watch:* Optimization, UX friction, pricing sensitivity, feature adoption.
      *   *Decision Criteria:* Triangulation. Use both. The slogan is a heuristic, not a law.

  7.  **Refining the Tone:**
      *   Needs to be analytical, precise, and respectful of the economics while acknowledging product reality.
      *   Avoid taking sides blindly; validate the colleague's point (data is good) but dismantle the absolutism.
      *   Structure clearly with headings.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "settled economics"? *Correction:* Need to clarify that RPT is settled in *theory* but contested in *application/behavioral science*.
      *   *Check:* Did I address the "future feature" aspect? *Correction:* Crucial point. You can't reveal preference for something that doesn't exist. This is the biggest hole in the colleague's argument regarding *new* features.
      *   *Check:* Is the distinction between "preference" and "need" clear? *Correction:* Make sure to distinguish between what they *choose* (revealed) and what would *help* them (normative/latent).

  9.  **Final Polish:** Organize into the requested structure: Claims analysis, Specific Questions, Colleague's likely stance, Final Recommendation. (Proceed to generate output based on this structure).

  *(Self-Correction Note during final review)*: Ensure I explicitly answer "which reading is definitional rather than empirical." I need to make sure the distinction between Samuelson's theory and the product management heuristic is sharp.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a classic tension in product management, dressed up in economic terminology. Your colleague is invoking **Revealed Preference Theory (RPT)**, originally formalized by Paul Samuelson in 1938. While the theory is indeed a cornerstone of neoclassical microeconomics, its application as a slogan ("Watch what they do, not what they say") often conflates a mathematical definition with an empirical prediction.

  Here is the breakdown of the distinct claims embedded in that sentence, graded from trivial to strong, followed by an analysis of your specific questions and a recommendation.

  ### 1. The Spectrum of Claims

  #### Claim A: "Actions incur costs; words do not."
  *   **The Claim:** When a user clicks a button, they spend time or cognitive load. When they answer a survey, the cost is often lower and disconnected from real consequences. Therefore, actions are a higher-fidelity signal of immediate value.
  *   **Verdict:** **Trivially True.**
  *   **Analysis:** This is the "cheap talk" argument. It is empirically robust. People often overstate intent in surveys (social desirability bias) but act according to immediate friction in dashboards. However, this only proves actions are *noisier* regarding intent, not that they are *truer* regarding future needs.

  #### Claim B: "Self-reported data is systematically biased."
  *   **The Claim:** Users lack self-awareness or lie about their motivations. Therefore, observed behavior is a more accurate predictor of retention and revenue than stated intent.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Analysis:** Behavioral economics supports this. Users are bad at predicting their future behavior (affective forecasting errors). If you ask "Will you use this AI feature?" they say "Yes." If you build it, they may not. Relying *solely* on surveys is risky. However, "biased" does not mean "informationless."

  #### Claim C: "Preference is *defined* by choice." (The Strict RPT View)
  *   **The Claim:** In economic modeling, we cannot look inside a user's head. We define "utility" operationally. If a user chooses A over B, they *by definition* prefer A over B. To say "They prefer B but chose A" is a contradiction within the model.
  *   **Verdict:** **Definitional (True by construction), but Category Error in Product.**
  *   **Analysis:** This is the "settled economics" part. In neoclassical theory, preference is a mathematical relation derived from choice. However, this is a modeling assumption, not a psychological fact. In product management, we care about *satisfaction* and *problems solved*, not just consistency of choice. A user might choose a feature because it's the only one available, not because it solves their problem best.

  #### Claim D: "Users cannot articulate latent needs."
  *   **The Claim:** Users can only react to what exists. They cannot envision novel solutions. Therefore, asking them what feature they want next is futile because they will only ask for incremental tweaks to current workflows.
  *   **Verdict:** **Substantive and Defensible (with caveats).**
  *   **Analysis:** This is the Henry Ford ("faster horses") argument. It is true for disruptive innovation. It is false for workflow optimization. Users are excellent at reporting pain points ("This takes too many clicks") even if they are bad at designing solutions ("Build a macro button").

  #### Claim E: "Clicks perfectly reveal a stable, underlying utility function."
  *   **The Claim:** Every click is a rational maximization of value. There is a single, stable ranking of wants inside the user, and the dashboard captures it without noise, error, or context dependence.
  *   **Verdict:** **Simply False.**
  *   **Analysis:** This contradicts modern behavioral science. Preferences are often *constructed* in the moment, not retrieved from a stable list. Clicks are noisy (misclicks, UI confusion, dark patterns). Assuming clicks are perfect signals leads to optimizing for engagement (addiction) rather than value (utility).

  ---

  ### 2. Addressing Your Specific Questions

  **Which readings are definitional rather than empirical?**
  **Claim C** is definitional. In standard microeconomic theory, preference *is* choice. It is a tautology: "They chose it, therefore they preferred it." This cannot be falsified empirically because the theory defines the terms that way.
  **Claims A, B, D, and E** are empirical. They make predictions about human psychology and market behavior that can be proven wrong (and often are). Your colleague is likely using the authority of the definitional claim (C) to shield the empirical claim (E) from criticism.

  **Does any reading actually rule out asking users?**
  **No.** Even the strictest Revealed Preference Theory does not forbid gathering other data; it simply states that when *predicting choice*, past choice is the best variable.
  The slogan "Watch what they do, **not** what they say" implies an exclusionary rule (do not survey). This is a product management heuristic, not an economic law. A defensible economic position would be: "Weight what they do higher than what they say when forecasting adoption," not "Ignore what they say."

  **Does the slogan presuppose that each user has a single stable ranking of wants?**
  **Yes, the strong version does.** For "what they do" to be the ultimate truth, we must assume that clicks are not errors, not influenced by UI placement, and not context-dependent. If preferences are unstable (e.g., I want speed in the morning but thoroughness in the afternoon), then "what they do" is just a snapshot of a specific context, not a revelation of their total "want."

  **Which reading is your colleague most likely relying on?**
  Your colleague is likely relying on **Claim B (Bias)** but rhetorically defending it with **Claim C (Definition).**
  They are arguing empirically that surveys are noisy (B), but they are invoking the phrase "settled economics" to imply that disagreeing with them is like disagreeing with gravity (C). This is a common rhetorical move: using a theoretical definition to shut down an empirical debate.

  **Crucial Flaw in their Argument regarding *New* Features:**
  Revealed Preference Theory requires **choices between existing alternatives.** You cannot reveal a preference for a feature that **does not exist yet.**
  If you are surveying for the *next* feature, there is no behavioral data to watch. The user cannot click on a button that isn't built. In this specific context (prioritizing a roadmap), the slogan is logically incoherent. You *must* ask what they say, because there is no "what they do" available for the counterfactual.

  ---

  ### 3. Decision and Recommendation

  **Should you run the survey?**
  **Yes, but not in isolation.**
  The slogan does not settle the decision because it addresses the wrong problem. "Watch what they do" is for **optimization** (fixing friction, improving conversion). "Ask what they say" is for **exploration** (finding problems, validating concepts).

  If you only watch what they do, you will become excellent at optimizing a product that solves the wrong problem. (Example: Users click a "Help" button frequently. *Behavior:* They value the Help button. *Reality:* Your product is confusing. Optimizing the Help button makes it easier to be confused.)

  **What should actually decide this?**
  Do not frame this as "Surveys vs. Data." Frame it as **Triangulation.** Run the survey if you can satisfy three criteria:

  1.  **The Counterfactual Problem:** You are building something new that users cannot currently choose. (Behavioral data cannot exist for this).
  2.  **The "Why" Gap:** Your dashboards show *drop-off* (what they do), but not *reason* (why they did it). Surveys fill the causal gap.
  3.  **Segmentation:** You need to know if the users *not* clicking are uninterested or unaware. Behavior cannot distinguish between "I don't want this" and "I didn't see this."

  **How to reply to your colleague:**
  You can concede the economics without conceding the product strategy.

  > "I agree that revealed preference is the gold standard for forecasting adoption of *existing* features, and I accept that stated intent is often biased. However, Revealed Preference Theory requires a choice set. For a feature that doesn't exist yet, there is no behavior to observe. We need the survey to identify the problem space; we will use dashboards to validate the solution once built. Relying only on behavior locks us into local maxima."

  **Summary:**
  *   **The Slogan:** A useful heuristic for optimization, a dangerous dogma for innovation.
  *   **The Economics:** Settled in theory (preference = choice), contested in application (humans are irrational/contextual).
  *   **The Decision:** Run the survey to identify *problems* and *opportunities*. Use dashboards to prioritize *solutions* and measure *success*. Do not let a definitional tautology prevent you from gathering empirical data on latent needs.
