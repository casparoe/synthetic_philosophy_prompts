answer: |-
  Alice and Beatrice both recall witnessing a successful bridge inspection yesterday. Alice observed the actual structural test, while Beatrice observed a perfect simulation intended to deceive, though the bridge was independently verified safe moments later unbeknownst to her. Today, both possess identical certification documents and receive a substantial engineering report claiming critical corrosion. The report is erroneous; the bridge is sound. They must decide whether to cross based on this shared data.

  **Belief:** The bridge is safe. **Counter-evidence:** Engineering report claiming corrosion.

  **Knowledge-First Verdict:** Alice knows P; therefore, the report is misleading. She rationally discounts it and crosses. Beatrice lacks knowledge (due to deceptive origin); she cannot treat the report as misleading. She must weigh it and rationally suspends crossing.

  **Standard Evidentialism Verdict:** Both possess identical total evidence (documents, report, memory). Rationality supervenes on available evidence, not external history. Both must weigh the report's strength. Both should suspend belief.

  **Working Feature:** The causal history of the belief (veridical perception vs. lucky simulation) fixes the knowledge status while current evidence remains constant.

  **Removal Effect:** If the feature is removed (e.g., both observed real tests), both agents know, and both views agree they may dismiss the report. If neither observed real tests, neither knows, and both agree they must weigh the report. The divergence vanishes.

  **Strongest Attack:** An Evidentialist argues that the Knowledge-First view violates the "supervenience of the rational." Since Alice and Beatrice are internally indistinguishable regarding their reasons and evidence, it is unjust to deem one rational and the other irrational based on hidden historical facts. Rationality concerns managing one's perspective, not metaphysical luck; thus, evidence strength must dictate belief revision regardless of knowledge status.
