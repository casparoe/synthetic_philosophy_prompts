answer: |-
  The Registry Hall smelled of ozone and old dust, the scent of paper burning without flame. There were no judges here, no gavel, no constables to escort the losers out. There was only the Hourglass, the two lecterns, and the Slot.

  Elara stood at the left lectern. Across from her stood Kaelen. He was a broad man, his coat stitched with the sigils of three districts, each one a testament to a Reading where he had walked away with both deposits. He did not look at her. He looked at the glass above them, where the sand had already begun to fall.

  Before them lay the Slot. Into it, they would feed their rules.

  Elara adjusted the collar of her coat. Beneath it, she felt the phantom weight of her workshop's deed. It was her only asset. Kaelen held the papers—her brother's citizenship, his guild license, his life. He had found them in the wreckage of the fire that took her brother, and he had brought them here, to the only place in the city where ownership was decided by logic rather than law.

  To her left, in the gallery of observation, sat two merchants, Venn and Orla. They were here to witness, but mostly they were here to learn. The Registry was public. Every rule deposited was transcribed and archived. To survive in this city, one studied the dead.

  "First," the Clerk intoned, his voice amplified by the room's acoustics, "The Observation Reading. Venn and Orla. Grain for Steel."

  Elara watched them. She knew their type. They wanted to trade. They wanted to be honest. But the Registry did not facilitate trade; it facilitated claims.

  Venn stepped forward. He placed his slip of paper in the Slot. Orla did the same. The Registry's engine hummed, a low vibration that Elara felt in her teeth. The machinery fed Venn's rule the text of Orla's, and Orla's rule the text of Venn's.

  Elara had seen the transcripts of their deposits in the public log earlier that morning. She read them now on the wall screen as the machine executed.

  **Venn's Rule:**
  `READ other_text.`
  `IF other_text CONTAINS "Keep" THEN RETURN "Keep".`
  `ELSE RETURN "Take".`

  **Orla's Rule:**
  `READ other_text.`
  `IF other_text CONTAINS "Keep" THEN RETURN "Keep".`
  `ELSE RETURN "Take".`

  It was a handshake protocol. A promise of peace. *If you are safe, I am safe.*

  The engine whirred. Venn's rule read Orla's text. It saw the command `RETURN "Keep"`. It returned "Keep".
  Orla's rule read Venn's text. It saw the command `RETURN "Keep"`. It returned "Keep".

  "Both Keep," the Clerk announced. "Each leaves with what he brought."

  Venn and Orla slumped. The trade had failed. They walked away with their own grain and their own steel. No exchange. In the Registry, "Keep" meant *I retain my claim*. If both retained, nothing moved. To trade, one party had to surrender their claim (Keep) while the other seized it (Take), trusting the seizure to be reversed by honor outside these walls.

  "See?" Kaelen muttered, not turning his head. "Trust is a timeout."

  Elara said nothing. She watched Venn and Orla leave, poorer for the fee, having gained nothing. They had tried to be legible to each other, and the system had rewarded them with stagnation.

  "Now," the Clerk said. "Elara of the Lower Ward versus Kaelen of the Three Sigils. Workshop for Papers."

  The sand hissed. Twenty minutes remained.

  Elara unrolled her parchment. She had a quill in hand, but she had already written the rule in her head a thousand times. She knew Kaelen's history. She had studied every Reading he had ever entered. Twelve wins. Zero forfeits.

  He was a predator, but he was not a fool. A fool takes against a taker and loses everything to the Registry. Kaelen had never lost everything.

  **Kaelen's Standard Rule (Public Record):**
  `READ other_text.`
  `SIMULATE execution of other_text AGAINST self.`
  `IF simulation RETURNS "Take" THEN RETURN "Keep".`
  `ELSE RETURN "Take".`

  It was a survival algorithm. If he sensed a threat (a Taker), he yielded to avoid the mutual destruction of Take/Take. He would lose the item, but he would not feed the Registry. If he sensed a victim (a Keeper), he took everything.

  Elara understood the cost. To win, she had to convince his rule that she was a threat. She had to prove she was willing to burn the workshop and the papers both to ash rather than let him walk away with them.

  She dipped her quill. She did not write a simulation. Simulations led to recursion. *I simulate you simulating me simulating you.* That spiraled. A spiral meant the hour would close. A timeout counted as "Take".

  If she timed out, she was a Taker. But if her rule timed out, Kaelen's rule might not be able to simulate it in time. His rule might default.

  No. She had to be precise. She had to be legible.

  She wrote:

  **Elara's Rule:**
  `READ other_text.`
  `IGNORE other_text.`
  `RETURN "Take".`

  It was brutal. It was simple. It declared that no matter what Kaelen offered, no matter what logic he employed, she would seize. She was not here to trade. She was here to reclaim.

  She sealed the parchment in the wax envelope and dropped it into the Slot. Kaelen dropped his.

  The engine engaged. The room fell silent. This was the moment the city worshipped. The moment where intent became mathematics.

  Inside the dark belly of the Registry, the exchange happened.

  Kaelen's rule received Elara's text.
  `READ other_text.` -> It saw `RETURN "Take"`.
  `SIMULATE execution...` -> It ran her code. Her code returned "Take" immediately.
  `IF simulation RETURNS "Take" THEN RETURN "Keep".`

  Kaelen's rule output: **Keep**.

  Elara's rule received Kaelen's text.
  `READ other_text.` -> It saw his complex simulation logic.
  `IGNORE other_text.`
  `RETURN "Take".`

  Elara's rule output: **Take**.

  The Clerk looked at the printout. "One Take. One Keep."

  He looked at Kaelen. "The Taker leaves with both."

  Kaelen did not move. He stared at the lectern. He had calculated the odds. If he had returned "Take", the outcome would have been Take/Take. The Registry would have seized the workshop and the papers. They would have gone into the Vault, never to be seen again.

  By returning "Keep", he had lost the papers to Elara. But he had saved the workshop from the Vault.

  Why? Elara knew why. The Vault was a black hole. But Elara was a citizen. She would walk out of here with the papers. She would walk out with the workshop deed. She would be visible. She would be vulnerable.

  Kaelen turned to her then, a slow, cold smile spreading across his face. He didn't look like a man who had lost. He looked like a man who had marked a target.

  "You understand the machinery," Kaelen said, his voice carrying in the quiet hall. "But you do not understand the city."

  Elara gathered her slips. The Workshop Deed. The Brother's Papers. Both were hers. By the law of the Registry, she owned them. By the law of the streets, she was now a woman who had forced a Taker to yield. She was a woman who had shown she would burn everything rather than lose.

  "I understand," Elara said, her voice steady. "You prefer to rob me later than lose to the Registry now."

  "The Registry is forever," Kaelen said. "You are just flesh. You have made yourself legible, Elara. You have written your intent in the public log. *Always Take.*" He tapped the side of his nose. "Now everyone knows. No one will trade with you. No one will Keep against you. They will all Take, or they will all Timeout. You have won the papers, but you have exiled yourself from the market."

  He stepped back from the lectern, hands empty. "Enjoy the cost."

  Elara walked to the exit. The sand in the hourglass was running low. She held the papers tight. She had her brother's life back. She had her livelihood.

  But as she pushed open the heavy doors into the gray light of the street, she felt the weight of the transcript she had left behind. In a city without courts, reputation was the only currency. She had spent hers all at once.

  She was safe from the Registry. She was safe from Kaelen, for today. But she was now a known variable in a system that preyed on variables. She would have to watch her back not just for thieves, but for every merchant who feared her rule, every neighbor who knew she would not Keep.

  She had forced the logic to bend. She had won the game. But the game was the only thing keeping the city from eating itself, and she had just shown everyone how to break the board.

  Elara pulled her collar up. She had the papers. She would go home. But she would not sleep with the lights off. The Registry demanded trust be converted into code, and code, once written, could be read by anyone. Even those who hunted.

  She walked into the crowd, legible, alone, and alive.
