  ### Brainstorming: Relevant Distinctions

  *   **Ontology of Norms:** Distinguish between *coordination conventions* (solving collective action problems, e.g., queueing), *fairness conventions* (distributing burdens/benefits, e.g., tipping as wage subsidy), and *mere local taste* (arbitrary preferences).
  *   **Normative Force:** Differentiate between a *pro tanto reason* (a reason that can be outweighed by other factors, like lack of notice) and a *full moral obligation* (binding all-things-considered). Distinguish these from *institutional requirements* (rules enforceable by the university).
  *   **Jurisdiction:** Separate *on-campus conduct* (university authority) from *off-campus conduct* (town law/private business). The university's authority diminishes off-campus unless safety or reputation is critically impacted.
  *   **Status:** Contrast *visitor/guest* status (owed hospitality and learning time) with *member/citizen* status (owed full compliance). Temporary visitors lack the socialization period of matriculated students.
  *   **Binding Conditions:** Evaluate whether obligation arises from *presence alone* (terms of cooperation) or requires *notice and reasonable burden* (fairness).

  ***

  **MEMORANDUM**

  **TO:** International Student Orientation Committee
  **FROM:** Undergraduate Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Evaluation of Visitor Norm Compliance Policy and the Case of Mira

  **Introduction**

  This memo evaluates the case of Mira, a visiting graduate student alleged to have violated local norms, and proposes revisions to our policy on visiting scholars. The core philosophical question is whether local conventions constitute moral obligations for temporary visitors merely by virtue of their presence, or whether additional conditions regarding notice and burden are required. I argue that while visitors have a pro tanto reason to adhere to local customs, full moral obligation and institutional enforcement require that norms be public, non-burdensome, and functionally necessary for coordination or fairness.

  **Normative Status of the Conventions**

  We must distinguish the moral weight of the three incidents involving Mira. They do not share the same moral status.

  First, **queueing** in the cafeteria is a *fairness convention* located on-campus. It solves a coordination problem and ensures equitable distribution of service. Here, Mira had constructive notice upon entering the shared space. Violating this norm free-rides on the restraint of others. However, as a new visitor, her violation suggests ignorance rather than malice. While she had a pro tanto reason to queue, the lack of explicit orientation mitigates the blame.

  Second, **tipping** is an economic convention off-campus. While locals view it as a moral requirement to subsidize wages, ontologically it functions as a *quasi-contractual custom*. For a visitor from a non-tipping culture, this is opaque. Without explicit notice, this remains *mere local taste* from the visitor's perspective. It is not a universal moral requirement, and the university lacks jurisdiction to enforce private economic customs off-campus.

  Third, **jaywalking** is a legal violation off-campus. While safety is a universal value, crossing when no cars are visible suggests a difference in risk assessment rather than moral recklessness. Since Mira was ticketed by town authorities, the legal system has already adjudicated this. For the university to impose additional discipline would be double jeopardy for an off-campus infraction that did not threaten campus safety.

  **Evaluation of the Notice-and-Burden Test**

  The proposed Notice-and-Burden Test is a robust framework for distinguishing etiquette from morality. I recommend the committee adopt it, with minor clarification.

  The first condition (publicity) ensures fairness; one cannot be bound by secret rules. The second condition (no conflict with central commitments) protects pluralism; we cannot require visitors to violate deep religious or moral convictions to satisfy local taste. The third condition (coordination or fairness) is crucial. It filters out norms that merely express local preference. If a norm does not serve coordination or fair distribution, violating it is rude but not immoral.

  Adopting this test clarifies that tipping fails the publicity condition for new visitors, queueing passes all three but warrants education over discipline, and jaywalking is a legal matter outside our primary ethical purview. This test shifts the focus from punishment to integration.

  **Opposing Views and University Authority**

  The strongest opposing view argues that local conventions are binding simply because they are the *terms of cooperation* in a shared place. On this view, entering the community implies consent to its rules, regardless of notice. This view prioritizes social order and predictability. It argues that making exceptions for visitors creates a two-tiered system that resentment.

  While predictability is valuable, this view conflates *institutional requirements* with *moral obligations*. The university can require compliance as a condition of continued visitation, but that does not make the initial violation morally blameworthy. Furthermore, blind adherence to "terms of cooperation" ignores power dynamics. If the terms are opaque, enforcing them is coercive.

  Regarding jurisdiction, the university has no business enforcing off-campus norms like tipping or jaywalking unless they directly impact campus safety or reputation. Mira's status as a temporary visitor further limits our authority. Unlike matriculated students, she is a guest. Guests are owed hospitality, including time to learn the house rules. Treating a guest as a full member immediately ignores the ontological reality of their temporary status.

  **Recommendations**

  Based on this analysis, I recommend the following course of action:

  1.  **No Formal Discipline:** The committee should not issue a formal warning or require a forced apology from Mira. Her violations stem from cultural dissonance and lack of notice, not moral failing. A forced apology would be performative and unjust.
  2.  **Educational Workshop:** Within two weeks, Mira should be invited to attend a voluntary "Local Norms and Campus Culture" workshop. This respects her agency while providing the notice required for future obligations.
  3.  **Policy Revision:** By next semester, we should revise the visitor policy to incorporate the Notice-and-Burden Test. The policy should state that visitors are expected to respect local norms, but disciplinary action will only be taken for violations of norms that are public, non-burdensome, and essential to fairness or safety, and only after notice has been provided.
  4.  **Acknowledging Complainants:** To protect local norms and acknowledge the standing of the complainants, the committee should issue a general statement reaffirming the importance of queueing and local economic customs. We should thank the restaurant owner and students for their vigilance, validating their feelings without validating the punishment of Mira.

  This approach balances the need for social order with the ethical requirements of fairness and notice. It treats Mira as a prospective member worthy of investment rather than a rule-breaker worthy of sanction, aligning our conduct with the university's mission of international education.
