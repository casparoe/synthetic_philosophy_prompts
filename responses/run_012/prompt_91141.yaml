  4.  **Draft the Corrected Statement:**
      *   Need to distinguish IoI (Indiscernibility of Identicals) from PII (Identity of Indiscernibles).
      *   Need to specify the quantification over properties (all properties vs. qualitative properties).
      *   Need to mention the logical form clearly.
      *   *Draft:* IoI: $\forall x \forall y (x = y \rightarrow \forall F (Fx \leftrightarrow Fy))$. PII: $\forall x \forall y (\forall F (Fx \leftrightarrow Fy) \rightarrow x = y)$. Note the controversy over the range of $F$.

