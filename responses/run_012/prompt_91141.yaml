      *   *Check:* Is the advice on the essay useful? Yes, warn them not to cite the encyclopedia as authoritative on the logic.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Corrected Statement" is copy-paste friendly for study notes. (Proceed to generate output based on these steps).

  *(Self-Correction Note)*: I need to be careful not to say PII is *true* or *false*. The audit should reflect that it's a live debate. The encyclopedia presents it as *settled* (false), which is the main issue.

