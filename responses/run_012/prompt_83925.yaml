  Translated to meta-analysis, this resembles a fixed-effect model where the true effect is assumed known. Any study deviating from this truth is not evidence against the effect, but rather exhibits heterogeneity attributable to bias or noise. You treat contradictory trials as outliers, employing robust regression techniques to down-weight their influence on the pooled estimate. The data aren't refuting the hypothesis; they are signalling model misspecification in the data-generating process of the trial itself. In frequentist terms, counter-evidence is simply a Type I error or a result of low power, misleading by definition because the null is false.

  Consider hierarchical models. If the hyperprior on the grand mean is sufficiently tight—reflecting 'knowledge'—individual study estimates shrink aggressively towards that mean. A trial showing a null effect is interpreted not as a genuine null, but as a low-quality estimate within a distribution centred on the known effect. Pre-registration locks this assumption in stone; if the analysis plan presupposes $H$, contradictory results are flagged as protocol deviations or measurement error. Consequently, the statistical machinery validates the dismissal of counter-evidence. If you specify the model such that $H$ is true, any data suggesting $\neg H$ must, by definition, be artefacts. The mathematics licences dogmatism because it treats certainty as a boundary condition rather than a provisional estimate. You are not ignoring evidence arbitrarily; you are filtering it through a model that defines contradiction as error. Model selection criteria like AIC would favour the simpler model where $H$ holds and data are noisy, over a complex model where $H$ is false. Thus, the paradox holds: absolute confidence immunises the model against revision, rendering further enquiry mathematically redundant. The 'entitlement' to ignore data becomes a computational necessity; to update would be to violate the axioms of the specified model. Any likelihood function, no matter how peaked around $\neg H$, integrates to zero against a prior of zero. Misleading evidence is formally defined as data falling in the tail of the likelihood distribution under $H$. If $H$ is known, the probability of such data is non-zero but deemed irrelevant for updating.

