  0.40

  **Decomposition**

  *   **Probability that wellbeing has determinate magnitudes (0.80):** Phenomenal consciousness presents states like pain and pleasure with apparent intensity, suggesting a underlying metric exists even if measurement is difficult.
  *   **Probability, conditional on magnitudes, that comparisons of differences are determinate (0.50):** While intensity may be real, calibrating units across distinct neural architectures without stipulative convention faces severe epistemic and metaphysical hurdles.
  *   **Probability that level and difference components come apart (0.80):** It is conceptually coherent to rank persons by welfare levels while denying that the intervals between those levels possess interpersonal significance.
      *   *Probability of level comparability (conditional on magnitudes):* 0.80.
      *   *Probability of difference comparability (conditional on magnitudes):* 0.50.
  *   **Probability that the correct account is naturalistic rather than irreducibly evaluative (0.40):** Wellbeing likely entails normative elements that cannot be fully reduced to physical states, making a purely naturalistic fact of the matter less probable.
  *   **Probability that parity exists (0.30):** Some choices may be neither better, worse, nor equal, though this constitutes a determinate fourth relation rather than a failure of comparability.
      *   *Impact on proposition:* Parity is an instance of determinate comparability and thus does not defeat the proposition, provided the relation itself is factual.
  *   **Probability that extended sympathy succeeds (0.35):** Imagining oneself in another's position relies on fallible simulation rather than direct access to their qualitative states.

  **Combination Note:** The final credence is the product of the probability that magnitudes exist and the conditional probability that difference comparisons are determinate (0.80 × 0.50 = 0.40), as difference comparability entails level comparability; the other terms function as modifiers that explain the uncertainty within those primary probabilities.

  **Sensitivity and Disagreement**

  I am least confident in the probability that the correct account is naturalistic rather than irreducibly evaluative, as the boundary between empirical facts and normative truths in welfare science remains obscure. However, the final figure is most sensitive to the probability that comparisons of differences are determinate conditional on magnitudes existing; a shift of 0.10 in this term alters the final credence by 0.08. Neuroscientific evidence demonstrating a universal scaling mechanism for hedonic intensity across distinct human brains would move this term most significantly.

  The disagreement between your colleagues (0.85 and 0.15) most plausibly lives in the second term: the determinacy of difference comparisons conditional on magnitudes. The optimist likely assumes neural homogeneity suffices for unit comparability, while the sceptic likely views any cross-person scaling as inherently stipulative or conventional.

  **Weaker Claim**

  My credence for the weaker claim that levels at least can be compared across persons is 0.64. When moving from the stronger claim to this weaker one, the decomposition changes by removing the requirement for difference comparability; the final figure becomes the product of the probability that magnitudes exist and the conditional probability of level comparability (0.80 × 0.80), rendering the uncertainty regarding unit calibration irrelevant.
