answer: |-
  Having spent thirty years at the bench studying bacterial transcription before retiring to the philosophy seminar room, I have found the transition from pipetting to conceptual analysis to be both a hoot and maddening in equal measure. The maddening part stems from watching my former colleagues and the philosophers who study them talk past one another regarding the concept of genetic information. In the lab, we speak casually of DNA as a code and genes as coding for proteins, but when pressed, the room splits between those who claim this is merely a handy metaphor with no ontological weight and those who insist it describes a genuine representational relation inside the cell. My hunch is that both sides are running together two distinct issues: first, whether the mapping from codons to amino acids is arbitrary, which is the only sense in which it genuinely resembles a code, and second, whether the DNA itself carries information about the organism or its traits in any sense beyond mere covariance. I propose to disentangle these threads over the course of a one-year fellowship by posing a precise question: is there a defensible notion of genetic information on which a DNA sequence carries information about the organism rather than merely covarying with it, and if so, does that notion depend on facts about the ribosome and the rest of the cell that are themselves arbitrary?

  The standard positions do not settle this because the deflationary crowd often dismisses information talk entirely to avoid committing to semantic content in nature, while the substantive representation camp often leans too heavily on the intuition that DNA looks like a language without rigorously testing the conditions under which that language holds meaning. Neither group adequately addresses the dependency of the information claim on the stability of the translational machinery. To force a decision on this debate, I will utilize a specific test case involving a lineage in which the ribosome's codon assignments drift over evolutionary time so that the same DNA sequence yields a different protein. The determinate question I aim to answer is whether, in this scenario, the old DNA meant something different all along, whether the meaning changed during the drift, or whether there was never any meaning to begin with. Whichever answer one gives forces a specific commitment regarding the nature of biological information, and I intend to show that only one of these options remains coherent when biological constraints are applied consistently.

  Since there is no wet lab involved here, I must be honest about the method, which is conceptual analysis grounded in biological plausibility. I will not be generating new empirical data but rather constructing counterfactual scenarios constrained by what we know about molecular biology to test the limits of our concepts. This involves treating the biological systems as fixed parameters and varying the interpretive frameworks to see which ones break. The work will proceed in three phases over the twelve months. During the first three months, I will consolidate the existing literature on genetic information and teleosemantics to ensure I am not reinventing a wheel that merely looks like a codon. Months four through six will be dedicated to rigorously formalizing the drifting ribosome test case, working through the logical implications of each possible answer to ensure the scenario is biologically coherent and philosophically sharp. From months seven to nine, I will draft the core argument and circulate it among both biologist and philosopher colleagues to stress-test the premises against current scientific understanding. The final quarter will be reserved for revising the manuscript based on that feedback and preparing it for submission to a major journal in philosophy of science.

  A real result for this project would be a clarified taxonomy of genetic information claims that distinguishes between covariance and genuine representation based on the arbitrariness of the cellular machinery. Success means producing an argument that compels researchers to specify which sense of information they are invoking when they speak of genetic coding, thereby dissolving the current stalemate. The project would count as failing if I demonstrate that the question itself is ill-posed because the distinction between arbitrary mapping and chemical necessity collapses under scrutiny, though even this negative result would be a significant contribution to the field by clearing away a persistent conceptual confusion. Regarding the timeline, I am not kidding myself that this resolves the entire philosophy of biology, but one year is sufficient to isolate and resolve this specific conceptual knot. A decade might be required to explore the broader implications for evolutionary theory, but the core argument regarding the dependency of information on translational stability can be definitively articulated within this fellowship period. This project leverages my unique position as someone who has operated the machinery and now critiques the language used to describe it, aiming to replace metaphorical hand-waving with a rigorous account of what DNA actually tells the cell.
