  ### The Decision Tree of the Monument

  To map the logical space of your novel's central object, answer the following questions in order. Each question is phrased as an intuition pump about the monument itself, not as technical metaphysics. A reader (or a character) can answer based on how they perceive the object in the story, without knowing the philosophical label that awaits them at the end.

  **1. The Fact of the Matter**
  Is the question *"How many objects stood on the pedestal at the unveiling?"* a question about how the world actually is, or merely about which language-game we are playing?
  *   **Merely about language:** Go to **Leaf A**.
  *   **About how the world is:** Go to Question 2.

  **2. The Count**
  Assuming there is a fact of the matter, did **one** object stand on the pedestal, or did **two** (the bronze and the statue) stand there?
  *   **One object:** Go to Question 3.
  *   **Two objects:** Go to Question 4.

  **3. The Reference**
  If there was only one object, does the word *"bronze"* refer to it, does the word *"statue"* refer to it, or do both words refer to it equally?
  *   **Only "bronze" refers:** Go to **Leaf B**.
  *   **Only "statue" refers:** Go to **Leaf C**.
  *   **Both refer equally:** Go to **Leaf D**.

  **4. The Temporal Boundary**
  If there were two objects, are they distinct because they have different histories or futures (e.g., the bronze existed as an ingot before the statue did)?
  *   **Yes, they differ in time:** Go to **Leaf E**.
  *   **No, they exist at the same times:** Go to Question 5.

  **5. The Role of Form**
  If they exist at the same times, is the difference between them that the statue possesses a "form" or "shape" as a real constituent part, which the bronze lacks?
  *   **Yes, form is a part:** Go to **Leaf F**.
  *   **No, form is just arrangement:** Go to Question 6.

  **6. The Sortal Concept**
  If form is not a part, are they distinct only because they fall under different concepts (e.g., "artifact" vs. "mass of metal")?
  *   **Yes, distinct by concept:** Go to **Leaf G**.
  *   **No, distinct in reality:** Go to Question 7.

  **7. The Bond**
  If they are distinct in reality, is the relation between them a primitive, fundamental tie (constitution), or are they just two things that happen to share the same space?
  *   **Primitive tie:** Go to **Leaf H**.
  *   **Two things sharing space:** Go to **Leaf I**.

  ***

  ### The Leaves: Positions and Awkward Commitments

  **Leaf A: Deflationary Reading**
  *   **Position:** The dispute is verbal, not ontological.
  *   **Awkward Commitment:** There is no truth to whether the monument survived the melting, only a choice of words.

  **Leaf B: Eliminativism about the Statue**
  *   **Position:** Only the material lump exists; "statue" is a fiction.
  *   **Awkward Commitment:** When the general saluted the monument, he was strictly saluting a lump of alloy, and "monument" is a fiction.

  **Leaf C: Eliminativism about the Lump**
  *   **Position:** Only the artifact exists; "bronze" is merely stuff.
  *   **Awkward Commitment:** When the sculptor weighed the bronze, she was not weighing an object, but merely measuring the stuff that makes up the object.

  **Leaf D: Identity Monism**
  *   **Position:** The statue and the bronze are one and the same object.
  *   **Awkward Commitment:** The ingot in the foundry was a numerically different object than the statue on the plinth, despite being the very same bronze.

  **Leaf E: Four-Dimensionalist Reading**
  *   **Position:** Objects are sums of temporal parts; the statue and bronze are different "worms" through time.
  *   **Awkward Commitment:** The statue on the plinth is not wholly present but is merely a temporal slice of a longer worm stretching into the scrapyard.

  **Leaf F: Hylomorphic Reading**
  *   **Position:** The object is a compound of matter and form; form is a real principle.
  *   **Awkward Commitment:** The shape of the horse is a real ingredient added to the bronze, not just an arrangement of it.

  **Leaf G: Relative Identity by Sortal**
  *   **Position:** Identity is relative to a kind; they are the same *thing* but not the same *object*.
  *   **Awkward Commitment:** The statue is the same *being* as the bronze but not the same *object*, a distinction that dissolves under logical scrutiny.

  **Leaf H: Constitution without Identity**
  *   **Position:** The bronze constitutes the statue via a primitive relation.
  *   **Awkward Commitment:** The statue and the bronze weigh the same, yet one constitutes the other without being it.

  **Leaf I: Coincident-Objects Pluralism**
  *   **Position:** Two distinct objects can occupy the same space at the same time.
  *   **Awkward Commitment:** Two solid bodies occupy the exact same volume of space at the unveiling without interfering.

  ***

  ### Notes on Empty Combinations and Blind Spots

  **1. The Indistinguishable Leaves (Constitution vs. Coincidence)**
  You will notice that **Leaf H (Constitution)** and **Leaf I (Coincident-Objects)** are separated by Question 7, which asks whether the bond between the metal and the monument is "primitive" or "incidental." In practice, this is a **blind spot**. No reader can answer this based on the monument alone; it is a technical distinction without a phenomenological difference. Both views commit you to two objects in one place. If you assign these views to two different characters, they will sound identical unless one character explicitly insists that "constitutes" is a magical glue while the other insists it is just a label for modal differences. You may treat them as the same position for the sake of the novel's internal consistency.

  **2. The Swallowing Void (Deflationism)**
  **Leaf A (Deflationary)** quietly swallows the rest of the tree. If a character holds this view, they reject the premise of Question 1. They do not believe there is a "fact of the matter" for the other characters to discover. If you give this view to a narrator or a central consciousness, it undermines the metaphysical stakes of the other characters. Ensure this character does not secretly presuppose the reality of the distinctions they claim are merely linguistic.

  **3. Empty Logical Space**
  There are no empty combinations generated by the tree above because the branching is designed to be exhaustive. However, certain combinations of *features* are unoccupied in philosophy. For example, **Hylomorphism (Leaf F)** and **Four-Dimensionalism (Leaf E)** are rarely combined. A Hylomorphist typically believes the form is present *now* (3D), while a 4Dist believes the object is spread out over time. If a character tries to hold both, they would have to claim the "form" is also a temporal part, which is an unexplored and likely incoherent position. Keep these two views separate.

  **4. The Monist's Dilemma (Leaf D)**
  **Identity Monism** creates a specific narrative tension regarding the ingot. If the statue *is* the bronze, and the bronze existed as an ingot before casting, then the statue existed as an ingot. But we usually say the statue was *created* at the unveiling. To maintain this view, your character must insist that the "ingot" was a different object than the "statue," even though they are made of the same matter. This forces a distinction between *matter* and *object* that Monism usually tries to avoid. Be prepared for this character to speak strangely about the foundry phase.
