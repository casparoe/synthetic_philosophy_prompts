answer: |-
  ### Exam Question

  **Question 1: The Absent-Minded Driver (20 Marks)**

  Consider a driver traveling down a road with two intersections. He intends to exit at the second intersection. The payoffs are as follows: exiting at the first yields 0, exiting at the second yields 4, and passing both yields 1. The driver is absent-minded: at any intersection, he cannot distinguish whether it is the first or the second, nor can he recall if he has passed an intersection already. Consequently, he must adopt a uniform strategy: whatever action he chooses at one intersection, he must choose at the other.

  If he deterministically chooses to "Continue" at both, he passes both and scores 1. If he deterministically chooses to "Exit" at both, he exits at the first and scores 0. However, suppose he is allowed to randomize. Let $p$ be the probability of exiting at any given intersection. His ex ante expected value is $4p(1-p) + (1-p)^2$, which is maximized at $p=1/3$ with an expected value of $4/3$.

  Write an essay evaluating the rationality of this mixed strategy. Your response must address the following three components:
  1.  Explain why the deterministic argument for "Continue" (score 1) initially feels airtight compared to the risk of exiting early.
  2.  Reconstruct the logic of the mixed strategy: how does randomizing yield a higher ex ante value than the deterministic optimum?
  3.  Take a definitive stand on whether the mixed strategy is genuinely rational. To do this, you must locate the specific assumption about agency, time, or information that determines whether the ex ante plan ($p=1/3$) can be successfully implemented at the intersection. Do not simply state that the puzzle is paradoxical; argue for why the solution holds or fails based on how the driver's decision-making is modeled.

  ***

  ### Model Answer

  The tension in the Absent-Minded Driver problem arises from a conflict between local dominance and global optimization. Deterministically, the argument for "Continue" feels airtight because it relies on a form of dynamic consistency rooted in safety. If the driver commits to "Exit," he risks being at the first intersection, yielding a payoff of 0. If he commits to "Continue," he guarantees surviving the first intersection. Since he cannot distinguish the nodes, he cannot condition his action on his location. Therefore, at the moment of decision, "Continue" appears to dominate "Exit" because it avoids the catastrophic 0 payoff associated with the first intersection, securing the baseline payoff of 1. This intuition treats the decision at the intersection as a standalone event where avoiding the worst-case scenario is paramount.

  However, the mixed strategy argument shifts the locus of evaluation from the intersection to the ex ante starting point. By introducing a probability $p$ of exiting, the driver transforms the strategy from a fixed action into a propensity. The expected value calculation $EV = 4p(1-p) + 1(1-p)^2$ accounts for the probability of reaching the second intersection ($1-p$) and then exiting ($p$), versus the probability of passing both ($1-p$). Maximizing this function yields $p=1/3$ and $EV=4/3$. This exceeds the deterministic payoff of 1. The logic here is that by accepting a small risk of exiting early (the 0 payoff), the driver unlocks the possibility of capturing the high payoff (4) at the second intersection, which is inaccessible if he commits to continuing with certainty. The mixed strategy effectively uses the first intersection as a "cost of entry" to gamble for the higher reward at the second.

  Whether this is genuinely rational depends entirely on the assumption regarding the nature of the agent's commitment and the flow of information. The critical assumption is that the agent is a single chooser across time who can bind their future actions via an ex ante plan, despite receiving no new information. In standard decision theory, an agent re-evaluates choices when new information arrives. Here, no new information ever arrives; the driver's epistemic state is identical at the start and at both intersections. If we view the driver as a sequence of temporal selves, the plan fails. At the intersection, the "self" there knows the ex ante plan was $p=1/3$, but since no new information has updated their belief about which intersection they are at, they might reason that "Continue" still looks safer locally, leading to a time-inconsistency where the plan is abandoned.

  Therefore, I argue the mixed strategy is rational only if we treat randomization as a physical propensity established ex ante, rather than a fresh decision made at the node. If the driver flips a biased coin at the start of the journey that dictates his actions at both intersections, the plan is binding and the 4/3 payoff is secure. If, however, the driver attempts to generate the randomization mentally at each intersection independently, he faces the risk of introspective drift, where the "self" at the intersection deviates to "Continue" to avoid the immediate risk of 0. The assumption doing the real work is that *ex ante optimization constrains ex post choice* even in the absence of informational updates. Without this assumption of binding commitment, the driver is trapped in the deterministic equilibrium of 1. With it, the driver successfully exploits the correlation between his actions at the two nodes to maximize global utility. Thus, the mixed strategy is valid, but only for an agent capable of pre-commitment without new information.

  ***

  ### Marking Scheme

  **Total Marks: 20** (5 Criteria × 4 Marks each)

  **1. Deterministic Intuition (4 Marks)**
  *   **4 (A):** Clearly articulates that "Continue" feels airtight because it avoids the 0 payoff at the first intersection and guarantees the baseline 1, treating the node decision as risk-averse dominance.
  *   **3 (B):** States that "Continue" is safer but fails to explain *why* it feels dominant at the node level (e.g., just says "Exiting is risky").
  *   **1-2:** Vague summary of payoffs without addressing the psychological or logical appeal of the deterministic choice.
  *   **0:** Incorrect payoff analysis.
  *   *Typical Error:* Confusing the payoff of exiting at the second (4) with the risk of exiting at the first (0).

  **2. Mixed Strategy Reconstruction (4 Marks)**
  *   **4 (A):** Correctly outlines the probability logic: reaching the second node requires continuing at the first ($1-p$), and the payoff 4 requires exiting at the second ($p$). Explicitly connects the math to the gain over the deterministic 1.
  *   **3 (B):** Reproduces the formula and the result (4/3) but treats it as a black box without explaining the probability flow (i.e., why the terms are multiplied).
  *   **1-2:** Math errors or fails to mention the 4/3 value.
  *   **0:** No attempt at the mixed strategy logic.
  *   *Typical Error:* Claiming the 4/3 comes from averaging the payoffs (0, 4, 1) rather than the path probabilities.

  **3. Information & Updating (4 Marks)**
  *   **4 (A):** Explicitly notes that *no new information* arrives between the start and the intersections, meaning Bayesian updating cannot justify changing the plan.
  *   **3 (B):** Mentions the driver is confused or lacks info, but misses the specific implication that beliefs remain static throughout the trip.
  *   **1-2:** Suggests the driver learns something at the intersection or ignores the information constraint entirely.
  *   **0:** Irrelevant to information states.
  *   *Typical Error:* Arguing the driver should "wait and see" which implies information arrival that the setup forbids.

  **4. Nature of Randomization (4 Marks)**
  *   **4 (A):** Distinguishes between randomization as a physical/pre-committed event (coin flip at start) versus a mental propensity at the node.
  *   **3 (B):** Discusses randomization generally but does not distinguish between ex ante commitment and in-the-moment generation.
  *   **1-2:** Treats randomization as simply "guessing" without structural implications.
  *   **0:** No mention of how randomization is implemented.
  *   *Typical Error:* Assuming the driver can just "decide to be random" at the node without a mechanism.

  **5. Agency & Time (4 Marks)**
  *   **4 (A):** Takes a definitive stand on the "single chooser" assumption. Argues that rationality holds *if and only if* the agent is modeled as a single entity binding future selves.
  *   **3 (B):** Discusses the tension between past/future selves but hedges the conclusion (e.g., "It depends on how you look at it" without specifying the assumption).
  *   **1-2:** Merely states the problem is a paradox without locating the assumption about agency.
  *   **0:** No discussion of agency or time.
  *   *Typical Error:* Concluding the mixed strategy is "invalid" simply because the driver is absent-minded, missing the point that the absent-mindedness is what necessitates the uniform strategy.

  **Grade Boundary Note:**
  *   **A Range (17-20):** Must score 4 on Criterion 5 (Agency & Time) and at least 3 on all others. The essay must take a clear stand, not just describe the tension.
  *   **B Range (13-16):** Strong on math and setup (Criteria 1 & 2), but hedges on the philosophical implication (Criterion 5) or misses the information constraint (Criterion 3).
