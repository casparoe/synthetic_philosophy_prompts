prompt: |-
  OK so I'm a second-year PhD student in early Christianity — my dissertation's on memory and the Synoptics, if that helps calibrate — and I've got this thing for my department's methods seminar that's been eating my brain.

  Here's the deal. Two of my committee members are basically at war over whether the criteria of authenticity can ever settle who the historical Jesus was. One is a card-carrying criterialist: she thinks that if you run the criteria properly — embarrassment, multiple attestation, dissimilarity from both Judaism and the early church, coherence, traces of Aramaic, Palestinian setting, and so on — and especially if you run several of them together, you end up with a decent body of probably-authentic material, enough to say who he was and what he was about. The other one thinks the criterial project is more or less dead: that the criteria are circular, that dissimilarity in particular is a disaster, that applying them to texts whose genre and transmission we can't control just gives you isolated sayings with no context, and that we should be doing a memory-and-reception approach instead, treating the whole tradition as something that may bear memory rather than putting sayings on trial one by one.

  I want to write the joint statement the two of them could actually both sign after a real, good-faith adversarial collaboration. So: what do they both already agree on (about the sources, about what the Gospels are, about what the criteria can and can't even in principle do, about what a reconstruction is allowed to look like)? Where exactly do they part ways, with each position worded so its own side would accept the wording? What are the actual cruxes — I'm guessing circularity/dissimilarity is one, but I want you to find the others? And for each crux, what's a test or case or argument that both of them would agree bears on it, with each side's prediction written down in advance? The one I keep coming back to is a control case: take sayings we're pretty sure are later — churchly material, the high-christology stuff, whatever — run the criteria on them, and see whether the criteria flag them as inauthentic. Both camps should accept that as a test, but I bet they predict differently. Is that right, and are there others?

  Two more things. Please be explicit about which of the agreed claims are actually consensus among people who work on this and which are just the two of them overlapping — don't dress up a contested view as the settled one, I need to know where the field is genuinely split vs. where these two happen to agree. And if part of the fight turns out to be verbal — if they're using "authentic" or "memory" in different senses — say which part and why.

  Format it as a numbered list of agreed claims, then a table for the disagreements, then the cruxes with their tests. Thanks, this is due Friday and I'm definately underwater.
