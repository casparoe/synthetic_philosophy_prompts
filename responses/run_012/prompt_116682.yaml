answer: |-
  Your friend's argument is seductive because it groups all non-utilitarian distributive views into a single bucket labeled "caring about distribution," but the misstep occurs at **Step (4)**. This step asserts that prioritarianism treats the relation between people's levels as intrinsically valuable, claiming that the moral weight of a benefit depends on where a person stands *relative to others*. This is a misdefinition of standard prioritarianism.

  **Diagnosis of Step (4)**
  The defining feature of prioritarianism (as formulated by Derek Parfit, who also coined the leveling-down objection) is that benefits matter more the *worse off* the recipient is, but this is determined by **absolute** levels of welfare, not **relative** standing. In a prioritarian calculus, if Person A is at welfare level 5 and Person B is at level 100, a benefit to A counts for more than a benefit to B. Crucially, if Person B's welfare drops to 50 (a leveling-down move), Person A's priority weight does not change, because A's absolute level remains 5. There is no "equality gain" to offset the loss of B's welfare. Therefore, prioritarianism does not imply that a leveled-down outcome is better in *any* respect; it is simply worse weighted sum.

  Egalitarianism, by contrast, is essentially relational. It values the *gap* between A and B. If B drops from 100 to 50, the gap shrinks, and the egalitarian must admit the outcome is better *qua* equality, even if worse overall. Your friend's argument relies on conflating these two distinct structures. By defining prioritarianism as concerned with relative standing in Step (4), he has essentially defined it as a form of egalitarianism, making the rest of his argument a tautology: "If prioritarianism is egalitarianism, and egalitarianism is refuted by leveling down, then prioritarianism is refuted."

  **Why Step (4) Looked Plausible**
  This conflation is common because prioritarianism and egalitarianism often converge in their policy recommendations. Both views recommend transferring resources from the better-off to the worse-off. It is easy to infer that they share the same underlying justification (caring about the relationship between people) when, in fact, they arrive at similar recommendations via different routes. Prioritarianism cares about the *magnitude* of the benefit weighted by the *absolute* level; Egalitarianism cares about the *pattern* of the distribution. Additionally, the phrase "worse off" is ambiguous: it can mean "lower absolute welfare" (prioritarianism) or "lower relative welfare" (egalitarianism). Your friend exploited this ambiguity to make the views appear structurally identical.

  **The Cost of Rejecting Step (4)**
  For your friend, giving up Step (4) costs him his conclusion that only aggregate maximization survives. He must admit that prioritarianism is a coherent third option that avoids the leveling-down objection while still departing from utilitarianism (by weighting benefits non-linearly). For you, the cost is acknowledging that prioritarianism is not a form of egalitarianism. You cannot claim prioritarianism satisfies our intuitions about *fairness* or *relational justice* in the same way egalitarianism does; it sacrifices the idea that justice is essentially about how people stand to one another. It makes prioritarianism vulnerable to different objections, such as the claim that it ignores unfairness if everyone's absolute levels rise but inequalities widen drastically.

  **Regarding Step (1) and Your Commitments**
  You asked whether you can keep prioritarianism and the leveling-down objection against egalitarianism simultaneously. Rejecting Step (4) allows exactly this. You can grant Step (1) (that a view is troubled if it sees *any* value in leveling down) because egalitarianism *does* see value in leveling down (the equality gain), while prioritarianism *does not*. If you were to reject Step (1) instead (arguing that being "better in one respect" doesn't matter if it's worse overall), you would save egalitarianism from the objection, which contradicts your goal of accepting the leveling-down objection against egalitarianism. Therefore, Step (4) is the only premise you can reject without undermining your own position.

  Verdict: Step (4) must be rejected because it falsely defines prioritarianism as concerned with relative standing, which is the crucial distinction that allows prioritarianism to escape the leveling-down objection while egalitarianism succumbs to it.
