          *   *Key Insight:* Simon's original point was about *procedural* rationality vs. *substantive* rationality. If you define rationality substantively (outcomes), satisficing collapses. If procedurally (process), it stands.

      *   **Thread 2: Endogenous Aspiration Levels.** Is the drifting aspiration level a prediction or a fudge factor?
