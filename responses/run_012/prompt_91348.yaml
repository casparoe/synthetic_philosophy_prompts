  3.  **Drafting - Section 2: Disagreements:**
      *   Need to capture the *spirit* of the disagreement without making one side look foolish.
      *   RIC view: "Fundamental barrier." PRC view: "Specific boundary condition."
      *   RIC view: "Escapes are sacrifices." PRC view: "Escapes are design choices."
