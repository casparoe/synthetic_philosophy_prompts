answer: |-
  # Lesson Plan: The Urn Game (Experiencing Ambiguity)

  **Session Length:** 90 Minutes
  **Class Size:** ~20 Students (Upper-level Undergrad/Grad)
  **Objective:** To experientially demonstrate the Ellsberg Paradox, violate the Sure-Thing Principle, and motivate non-SEU (Subjective Expected Utility) models without initially naming the concepts.

  ## I. Materials & Setup

  **Physical Props:**
  1.  **Urn A (The Known):** A transparent or opaque box clearly labeled "A." Contains exactly 50 Red chips and 50 Black chips (100 total). *Show the students the contents before sealing it.*
  2.  **Urn B (The Unknown):** An identical box labeled "B." Contains 100 chips (Red/Black mix), but the ratio is hidden. *Do not show contents.*
  3.  **Urn C (The Reference):** A theoretical urn used for elicitation (no physical prop needed, just described).
  4.  **Worksheet/Slip:** One per student for recording choices.
  5.  **Sticky Notes:** Two colors (e.g., Pink for Red bets, Blue for Black bets).
  6.  **Whiteboard:** Divided into three sections (Round 1, Round 2, Round 3).
  7.  **Incentives:** A small prize pool (e.g., $20 gift card or 1 bonus point on final) awarded to the top 3 scorers based on points accumulated during the game. This ensures "skin in the game."

  **Point System:**
  *   Each student starts with **100 Points**.
  *   A winning bet earns **+50 Points**.
  *   A losing bet earns **0 Points**.
  *   Final rankings determine the prize.

  ---

  ## II. Procedure & Order of Rounds (60 Minutes)

  **Introduction (5 Minutes)**
  *   Distribute worksheets and sticky notes.
  *   Explain the point system and the prize.
  *   **Crucial Instruction:** "I will describe a betting scenario. You will not actually draw chips today. Instead, you will tell me what bets you *would* make. Your points are hypothetical but will determine the prize winners based on the consistency and value of your choices."
  *   **Rule:** "Do not discuss your choices with neighbors. This is a silent exercise."

  ### Round 1: The Standard Setup (20 Minutes)
  **Context:** Urn A is 50/50. Urn B is 100 chips, unknown mix.
  **Task:** Elicit the *Matching Probability*.
  1.  **Instruction:** "Imagine you hold a ticket that wins 50 points if a **Red** chip is drawn from **Urn B**. I offer you a trade: Give me that ticket, and I will give you a ticket that wins 50 points if a Red chip is drawn from a **Known Urn C**."
  2.  **Elicitation:** "Urn C has 100 chips. You can choose how many are Red. What is the *minimum* number of Red chips you would need in Urn C to be willing to swap your Urn B ticket for the Urn C ticket?"
  3.  **Action:** Students write a number (0–100) on a **Pink Sticky Note**. This represents their subjective probability of Red in Urn B (scaled 0–100).
  4.  **Repeat:** Now imagine you hold a ticket that wins if **Black** is drawn from **Urn B**. What is the minimum number of Red chips (winning tickets) you need in Urn C to swap?
  5.  **Action:** Students write a number (0–100) on a **Blue Sticky Note**.
  6.  **Board Work:** Have students stick their notes on the board in two columns: **Red Value** and **Black Value**.
  7.  **Calculation:** Ask two volunteers to calculate the average for the Red column and the average for the Black column.
  8.  **The Reveal:** Ask the class: "If these numbers represent probabilities, what should the sum of the Red Average and Black Average equal?" (Answer: 100). "What is the actual sum?" (Likely < 100). "Where did the missing probability go?" (Do not answer yet).

  ### Round 2: The Hidden Coin (15 Minutes)
  **Context:** Urn A is still 50/50. Urn B is different now.
  **Instruction:** "Reset your points. In this round, Urn B's composition was determined before class by a fair coin flip. Heads: Urn B contains 100 Red chips. Tails: Urn B contains 100 Black chips. I flipped the coin, but I did not look at the result, and I will not tell you."
  **Task:** Repeat the elicitation.
  1.  Bet on Red from Urn B. What is the minimum winning chance in Known Urn C you require to swap? (Pink Note).
  2.  Bet on Black from Urn B. What is the minimum winning chance in Known Urn C you require to swap? (Blue Note).
  3.  **Board Work:** Post notes. Calculate averages and sum.
  4.  **Observation:** Students will likely see the sum closer to 100 than in Round 1, though some ambiguity aversion may persist due to distrust of the coin.

  ### Round 3: The Adversary (15 Minutes)
  **Context:** Urn A is still 50/50. Urn B is different again.
  **Instruction:** "Reset your points. In this round, Urn B's composition was determined by a former student. They were told: 'Arrange the 100 chips in Urn B however you like, but your goal is to make the current students lose as often as possible.' They were not told which color you would bet on."
  **Task:** Repeat the elicitation.
  1.  Bet on Red from Urn B. Minimum swap value? (Pink Note).
  2.  Bet on Black from Urn B. Minimum swap value? (Blue Note).
  3.  **Board Work:** Post notes. Calculate averages and sum.
  4.  **Observation:** The sum will likely drop significantly below 100 again, potentially lower than Round 1.

  ### Transition to Debrief (5 Minutes)
  *   Collect points.
  *   Tell students to keep their worksheets.
  *   **Instruction:** "Do not Google anything yet. Keep your observations about the three rounds in your head."

  ---

  ## III. The Debrief (30 Minutes)

  **1. Naming the Phenomenon (5 Minutes)**
  *   Reveal the terminology: **Risk** (Round 2, known probabilities) vs. **Ambiguity** (Round 1 & 3, unknown probabilities).
  *   Identify the pattern: **Ambiguity Aversion**.
  *   Point to the board: "In Round 1, the sum of your probabilities was likely less than 100%. In probability theory, $P(Red) + P(Black)$ must equal 1. You behaved as if $P(Red) + P(Black) < 1$. You left probability mass on the table."

  **2. Mapping to the Sure-Thing Principle (10 Minutes)**
  *   Draw the Savage Matrix on the board.
      *   States: Urn is mostly Red ($S_1$), Urn is mostly Black ($S_2$).
      *   Acts: Bet Red, Bet Black.
  *   Explain **Savage's Sure-Thing Principle**: If you prefer Bet Red over Bet Black when you know the composition, and you also prefer Bet Red over Bet Black when you know the *other* composition, you should prefer Bet Red over Bet Black when you *don't* know the composition.
  *   Show the Violation:
      *   Most students prefer Known Red (Urn A) over Ambiguous Red (Urn B).
      *   Most students prefer Known Black (Urn A) over Ambiguous Black (Urn B).
      *   This implies they treat the Ambiguous Urn as having $<50\%$ Red AND $<50\%$ Black.
      *   This is logically incoherent under Subjective Expected Utility (SEU). You cannot have a single probability distribution where both are less than 0.5.

  **3. Families of Coherence (10 Minutes)**
  *   Ask: "Are you irrational? Or is the model wrong?"
  *   **Model 1: MaxMin Expected Utility (Gilboa-Schmeidler).**
      *   Explain: You don't have one probability; you have a *set* of priors. You evaluate the bet using the worst-case prior in the set.
      *   Connect to Round 3: The Adversary makes the "worst-case" prior very salient.
  *   **Model 2: Smooth Ambiguity (Klibanoff, Marinacci, Mukerji).**
      *   Explain: You have a second-order belief (a distribution over probabilities). You are averse to the *variance* of that second-order belief.
      *   Connect to Round 2: The coin flip reduces second-order variance (it's either 0 or 1, with 50% chance), making it feel more like Risk.
  *   **Model 3: Confidence/Weight (Keynes/Ellsberg).**
      *   Explain: It's not just the probability; it's the *weight of evidence*. 50/50 with high evidence (Urn A) is preferred to 50/50 with no evidence (Urn B).

  **4. Closing Synthesis (5 Minutes)**
  *   Summarize: SEU assumes we can always reduce uncertainty to a single number. The Ellsberg pattern shows we distinguish between *risk* (known numbers) and *ambiguity* (unknown numbers).
  *   Final thought: "Decision theory isn't just about maximizing math; it's about modeling how humans process ignorance."

  ---

  ## IV. Predictable Failures & Handling Them

  **1. The "50% Anchor" Problem**
  *   **What happens:** In Round 1, rationalist students might insist, "The expected value is 50/50, so I'll write 50." This kills the paradox (Sum = 100).
  *   **Fix:** During instructions, emphasize: "There is no correct answer. This is about *your* comfort level. If you feel uneasy about the unknown urn, reflect that in your number." If the class average is exactly 50, acknowledge it: "This group is ambiguity neutral. That is a valid preference, but historically, most groups are not."

  **2. Incentive Compatibility**
  *   **What happens:** Students treat points as fake and write random numbers.
  *   **Fix:** The prize for top 3 scorers is essential. Also, add a "Consistency Bonus": "If your choices align with a coherent strategy, you get a small buffer." (Even if you don't actually grade this, the threat encourages thought).
  *   **Better Fix:** Actually draw one round at the end. Pick one student at random, use their Round 1 sheet, draw from Urn A or B based on their choice, and award the prize immediately. Real stakes eliminate sandbagging.

  **3. Confusion on Elicitation**
  *   **What happens:** Students confuse "Minimum winning chance to swap" with "Probability you think is in the urn."
  *   **Fix:** Use the phrasing: "At what point is the Known Urn *good enough* to take instead of the Unknown Urn?" If they are averse to ambiguity, they will demand a *higher* known chance (e.g., 60%) to give up the ambiguous bet?
      *   *Correction:* Wait, if they are ambiguity averse, they value the Ambiguous Bet *less*. So they should accept a *lower* known chance to swap *away* from it?
      *   *Re-evaluating the Elicitation:*
          *   Standard Matching Probability: "What known probability $p$ makes you indifferent between the Ambiguous Bet and a Known Bet with probability $p$?"
          *   If Ambiguity Averse: Value(Ambiguous) < Value(Known 50%). Therefore, $p$ should be $< 50\%$.
          *   *Instruction Check:* "You hold the Ambiguous Ticket. I offer a Known Ticket. How many winning chips must be in the Known Ticket for you to trade?"
          *   If they hate ambiguity, they want to get rid of the Ambiguous Ticket easily. They might trade it for a Known Ticket with only 40 winning chips.
          *   *Wait, this is counter-intuitive for students.*
          *   *Alternative Elicitation:* "You hold a **Known Ticket (50/50)**. I offer to swap it for the **Ambiguous Ticket**. What is the minimum number of winning chips you would need in the Ambiguous Ticket to accept the swap?"
          *   If Ambiguity Averse: They demand a premium. They need the Ambiguous Urn to have, say, 60 winning chips to give up the safe 50.
          *   *Decision:* The prompt asks for "minimum winning chance at which they would be indifferent between the ambiguous bet and a lottery on a known chance."
          *   Let's stick to the Prompt's framing but clarify: "You hold the **Ambiguous Bet**. What is the **lowest** probability in a Known Bet you would accept to switch?"
          *   If I hate the Ambiguous Bet, I will switch for a Known Bet even if the Known Bet is worse (e.g., 40%).
          *   *Result:* $P(Red) \approx 40$, $P(Black) \approx 40$. Sum = 80. Shortfall = 20.
          *   *Warning:* Students often think "I need *more* to switch away from something I like." But they *don't* like the ambiguous bet. I must be very clear: "You want to escape the ambiguity. How bad of a known deal will you take just to escape?"

  **4. Time Overrun**
  *   **What happens:** Calculating averages on the board takes too long.
  *   **Fix:** Pre-assign two "Actuaries" at the start of class. Give them calculators. Their job is to sum the sticky notes while you talk.

  ---

  ## V. Limitations: What This Activity Cannot Show

  Be honest with the students (and yourself) about the boundaries of this exercise.

  1.  **It Does Not Prove SEU is "Wrong":**
      *   You will still have to argue that violating the Sure-Thing Principle is a *normative* error, not just a descriptive fact. A staunch SEU defender could argue the students simply had the wrong prior (e.g., they suspected the professor rigged Urn B to be 40/60). You must argue that under the *description* of the problem (unknown composition), SEU demands additivity.
  2.  **It Does Not Distinguish Models:**
      *   The activity shows SEU fails. It does not prove MaxMin is better than Smooth Ambiguity. Both fit the data. You will have to argue for the models theoretically, not empirically, in this session.
  3.  **The "Adversary" Conflation:**
      *   Round 3 mixes Ambiguity with Game Theory. If students lower their probability estimates in Round 3, is it because of ambiguity aversion or because they are playing a minimax strategy against a hostile agent? Decision theory treats these differently, but the activity blurs them. You must clarify this distinction in the debrief.
  4.  **Small Sample Noise:**
      *   With 20 students, one or two outliers can skew the average. If the sum is 98% instead of 80%, the "force" of the paradox feels weaker. Be prepared to say, "Even a small shortfall violates the axiom," rather than relying on a dramatic gap.

  ## VI. Instructor Script Snippet (For the Elicitation)

  *"Listen closely to this trade. You currently hold a ticket for Urn B (Unknown). It pays if Red comes up. I am offering to buy that ticket from you. In exchange, I will give you a ticket for Urn C (Known). Urn C has 100 chips. You tell me how many are Red.*

  *If you are terrified of Urn B, you might say, 'I'll trade my Urn B ticket even if Urn C only has 30 Red chips.' That means your matching probability is 30%.*

  *If you think Urn B is fine, you might say, 'I won't trade unless Urn C has at least 50 Red chips.' That means your matching probability is 50%.*

  *Write down the **minimum** number of Red chips in Urn C that would make you say 'Yes, take my Urn B ticket.'"*
