      *   **Visualization:** Put group's two numbers (Red/Black) on the board, compute shortfall from 1.
      *   **Rounds:**
          1.  Standard Ellsberg (Known 50/50 vs. Unknown).
          2.  Unknown fixed by unseen coin flip (Risk, not Ambiguity).
          3.  Unknown fixed by an adversary (Strategic Ambiguity).
      *   **Constraint:** Nothing named until debrief.
      *   **Deliverables:** Rules, Materials, Order of Rounds, Debrief (mapping to Sure-Thing Principle & Coherence theories), Predictable Failures & Fixes, Limitations (what the activity *can't* show).
      *   **Tone/Style:** American English, practical, honest about limitations.

  2.  **Deconstruct the Activity Design:**
      *   *Time Management:* 90 minutes total.
          *   Intro/Setup: 10 mins.
          *   Round 1 (Standard): 20 mins (including elicitation).
          *   Round 2 (Coin Flip): 15 mins.
          *   Round 3 (Adversary): 15 mins.
          *   Debrief/Theory: 30 mins.
      *   *Materials:* Urns (or boxes/bags), chips/balls, worksheets for elicitation, whiteboard.
      *   *Incentives:* Points matter. Need a way to make points meaningful (e.g., extra credit, candy, or just "bragging rights" + grade bump). Let's assume points translate to a small grade bonus or course credit to ensure engagement.
      *   *The "Matching Probability" Elicitation:* This is the tricky part. Asking students "What known probability makes you indifferent?" is cognitively demanding in real-time.
          *   *Simplification:* Instead of a continuous slider, offer a menu of lotteries (e.g., "Would you prefer the Ambiguous Urn or a bag with 4 red/6 black?"). Or, simpler: Ask them to write down a percentage $p$ such that they are indifferent between the Ambiguous Bet and a Known Bet with probability $p$.
          *   *Refinement based on prompt:* The prompt asks to "elicit from each of them the minimum winning chance." I need a mechanism for this. A simple slip of paper works best. "I would trade the Ambiguous Bet for a Known Bet if the Known Bet offers at least X% chance of winning."
      *   *The "Shortfall from 1" Calculation:* If they value Red at $p_R$ and Black at $p_B$, and $p_R + p_B < 1$, that demonstrates the violation of additivity (and thus subjective expected utility).

  3.  **Drafting the Rounds:**
      *   *Round 1 (Classic):* Urn A (50 Red, 50 Black). Urn B (100 chips, unknown mix). Bet on Red in A vs. Bet on Red in B. Then Bet on Black in A vs. Bet on Black in B.
          *   *Wait, the prompt specifies:* "elicit... minimum winning chance at which they would be indifferent between the ambiguous bet and a lottery on a known chance."
          *   *Okay, adjustment:* Don't do pairwise choice. Do *matching probability*.
          *   *Task:* "You hold a ticket that pays if you draw Red from Urn B (Unknown). What is the lowest probability of winning from a *known* Urn C that you would accept instead?" Do this for Red, then do it for Black.
      *   *Round 2 (Risk):* Urn B's composition was determined by a fair coin (All Red or All Black, or 50/50 split?). The prompt says "fixed by a coin flip they did not see." This turns ambiguity into risk (second-order risk). If they know it's a coin flip, they should treat it as 50/50.
      *   *Round 3 (Adversary):* Urn B's composition was fixed by someone trying to make them lose. This heightens ambiguity aversion.

  4.  **Developing the Debrief:**
      *   Connect to Sure-Thing Principle (Savage).
      *   Connect to SEU (Subjective Expected Utility) violation ($P(Red) + P(Black) \neq 1$).
      *   Connect to Solutions: MaxMin Expected Utility (Gilboa-Schmeidler), Smooth Ambiguity (Klibanoff et al.), Confidence/Weight (Keynes).
      *   Address the "Coin Flip" vs. "Adversary" distinction (Reducibility of Risk vs. Irreducibility of Ambiguity).

  5.  **Identifying Predictable Failures:**
      *   *Confusion:* Students confuse the urns.
      *   *Anchoring:* They just write 50% because it feels safe.
      *   *Incentive Compatibility:* If points don't matter, they guess.
      *   *The "Sum < 1" issue:* If they write 40% for Red and 40% for Black, the sum is 80%. But if they write 50% for both (risk neutral), the paradox disappears. I need to ensure the setup encourages revealing true preferences.
      *   *Time:* Elicitation takes longer than expected.
      *   *Skepticism:* "The unknown urn is actually 50/50." Need to emphasize *unknown*.

  6.  **Addressing Limitations:**
      *   This activity shows *behavior*, not *normative justification*.
      *   It doesn't prove SEU is "wrong," just that people violate it.
      *   It doesn't solve the paradox (which model is best?).
      *   Small sample size (20 students) might yield noisy data.

  7.  **Refining the Plan (Self-Correction during drafting):**
