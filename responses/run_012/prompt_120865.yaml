  **MEMORANDUM**

  **TO:** The Grants Committee, Aldervale Foundation
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Allocation Recommendation and Procedural Review

  **Bottom Line**
  I recommend we execute the allocation according to the standing "Split" rule: $400,000 to the immunization campaign, $300,000 to the clinic network, $100,000 to bioethics training, and $100,000 to the wastewater surveillance pilot. Regarding Dr. N.'s annex, I recommend we acknowledge the expected value argument without allowing it to override the voting mechanism this cycle. Finally, I recommend we **keep** the Split for this allocation but mandate a working group to propose amendments for future cycles. We must honor the procedure we entered this cycle with, even as we admit it may be ill-suited for high-stakes outlier cases.

  **The Strongest Case Against This Recommendation**
  The argument against adhering to the Split is strongest where Dr. N. places her flag: arithmetic versus procedure. If her estimate holds—a one-in-two-hundred chance of averting a catastrophe whose cost dwarfs our entire endowment—then funding her pilot at $100,000 is arguably negligent. A rational actor maximizing expected value would fund the pilot exclusively. Furthermore, the Split creates a perverse incentive structure. As Dr. N. notes, funding follows coalition size, not necessarily impact. If she convinces one colleague to rank the pilot first, funding doubles without the project changing. This rewards lobbying over value.

  However, the case for keeping the Split rests on the incomparability of our values. We cannot agree on a common currency. To prioritize Dr. N.'s expected value calculation is to accept her scale of measurement as the committee's own. It smuggles a specific utilitarian framework into a pluralistic body. The Split avoids this by treating first-place votes as proxies for incommensurable values. It ensures that no single moral outlook governs the entire budget. My recommendation prioritizes procedural integrity over optimal allocation in a single cycle because breaking the rule now undermines the trust required to make rules later.

  **Moral Uncertainty vs. Moral Disagreement**
  I have questioned whether I am conflating moral uncertainty with moral disagreement. Uncertainty implies we are unsure what is right; disagreement implies we are sure, but differ. This committee is not uncertain; we disagree. The Immunization trustee believes saving known lives now is paramount. Dr. N. believes preventing existential risk is paramount. The Split is not a tool for managing uncertainty; it is a device for managing disagreement without forcing assimilation. It allows us to fund conflicting truths simultaneously. Recognizing this clarifies that amending the rule will not make us more certain; it will only change how we negotiate our differences. We must decide if we want a committee that maximizes agreed-upon metrics or one that sustains pluralistic participation.

  **Confidence and Weakness**
  I am moderately confident in this recommendation, but I must name its soft spot. The weakness lies in the threshold for overriding procedure. By recommending we keep the Split for this cycle, I am accepting a known risk: that we may underfund a high-impact outlier because it lacks a coalition. I cannot quantify the cost of that error. If Dr. N.'s pathogen emerges and we lacked surveillance, my adherence to procedure will have contributed to that failure. This memo argues for stability, but stability is not a moral virtue if it blinds us to tail risks. I recommend the working group specifically address how to accommodate high-expected-value outliers without imposing a common scale. Until then, we follow the rule.

  **If the Vote Goes Against Me**
  If the committee votes to override the Split and reallocate funds based on expected value or another metric, I will accept the decision as the legitimate will of the body. I will not resign, nor will I withhold cooperation in implementing the new allocation. However, I will record my dissent on the principle that changing the rules mid-cycle sets a precedent that may disadvantage minority views in future years. I trust the committee's collective judgment even when it diverges from my own, provided we remain transparent about the trade-offs we are making.

  **Conclusion**
  We are asked to distribute $900,000 among incompatible goods. The Split is imperfect, but it is the only mechanism we have that does not require one trustee to translate her values into another's units. We should fund the proposals as the votes dictate today, and do the work to fix the rule for tomorrow.
