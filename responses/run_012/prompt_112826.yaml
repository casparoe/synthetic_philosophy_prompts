answer: |-
  The band around Elena's wrist was cool, smooth ceramic that never warmed to her skin. It was the only thing she was allowed to wear during the Audit. The room was white, not the sterile white of a hospital, but the soft, expensive white of a gallery wall. It was designed to show nothing but what was placed in front of it.

  Elena sat in the chair. Across from her sat Julian, the Reader. He had a tablet, but he rarely looked at it. He looked at her.

  "Statement four," Julian said. His voice was level, devoid of judgment, which made it worse. "Regarding the dissolution of your marriage."

  Elena swallowed. The band hummed, a microscopic vibration against her radial artery. It was calibrated to her baseline vitals. If her pulse spiked in defiance, if her cortisol surged in denial, the lock on her study room would engage. She had three days left in the six-week program. Three days before she could return to the books waiting for her in the adjacent room. The books were the only reason she hadn't walked out in week two.

  "I understand," Elena said.

  "Please state the dynamic," Julian said. "As per the aggregated data from communications, financial records, and partner testimony."

  Elena closed her eyes. She saw the data. She had seen the graphs in week three. The downward slope of text message frequency. The clustering of therapy appointments she hadn't known about. The cold logic of the separation date.

  "Mark was unhappy," she said.

  "Specifics."

  "I was... suffocating." The word tasted like ash. "I mistook proximity for intimacy. I believed my presence was a gift. The data suggests it was a burden."

  The band remained silent. Her heart rate held. She was speaking the language of the Clear Room. They called it Alignment. She called it flaying.

  "And yet," Julian said, leaning forward slightly. "You have submitted a journal entry from January, two months prior to the separation. In it, you describe a dinner where he laughed at a joke you made. You wrote: 'He still sees me.'"

  Elena's fingers tightened on her knees. This was the trap. The program didn't just want the broad strokes; it wanted the specific edits excised. They wanted the softening removed.

  "He did laugh," Elena said.

  "Was it affection?"

  "It was... a reaction."

  "Was it love?"

  Elena looked at the white wall. She thought of that night. The wine, the dim light, the way his eyes had crinkled. She had built her winter on that memory. When the house was empty and the silence was loud enough to ring in her ears, she had gone to that memory like a heater. It was the belief that allowed her to breathe: *He loved me, but he was broken. The love was real, the leaving was a symptom.*

  If she admitted the love wasn't there, the leaving wasn't a symptom. It was a verdict.

  "It felt like love," Elena said.

  "Feelings are internal data," Julian said. "We are looking for external verification. The testimony states he felt obligated. The laughter was polite."

  The band vibrated. A warning. Her pulse had jumped. She was clinging.

  "He was polite," Elena corrected.

  "And the love?"

  "Did not exist."

  The vibration stopped. The lock on the study room remained disengaged. She had passed. But she felt hollowed out, as if someone had taken a spoon to her ribs.

  "You may go," Julian said. "You have forty-five minutes before the next session."

  Elena stood. Her legs felt heavy. She walked to the door, placed her wrist against the sensor. The light turned green. The door clicked open.

  The study room was dimmer, lined with shelves. She wasn't allowed to bring her own books; the program provided them to ensure no sentimental attachments interfered with the work. But they had allowed her request for the specific texts she needed. Newton's *Principia*. Du Châtelet's *Institutions de Physique*. Her translation work.

  She sat at the desk. The paper was thick, creamy stock. She picked up her pen.

  She was working on a problem regarding kinetic energy. Not the modern formula, but the historical derivation. The way Émilie had argued for *vis viva*, living force, against the established men who wanted force to be merely mass times velocity. Émilie had argued that the energy was proportional to the square of the velocity. She had fought for the exponent.

  Elena dipped the pen. *mv²*.

  In math, there was no Alignment. There was no Reader. There was only right and wrong. If she lied to the equation, the proof collapsed. It didn't care about her heart rate. It didn't care if she was suffocating or beloved. It simply *was*.

  She wrote a line of calculus. Her hand steadied.

  This was the second half of the prescription. The program demanded the removal of the softening, but the brochure had hinted at the replacement. *A passion independent of social validation.* They called it "Autonomous Engagement." Elena called it survival.

  She looked at the equation. It was true. It was pitiless. It didn't love her, but it didn't leave her either.

  But as she wrote, the memory of the dinner intruded. The way the candlelight had caught the gold in Mark's iris. If she accepted the Clear Room's truth—that the laughter was polite, that the love was gone—then that memory was poisoned. It became a lie she had told herself. If the memory was a lie, then the woman who sat there smiling across the table was a fool.

  If she was a fool, could she trust her mind with the math?

  The band hummed again. She hadn't even spoken. It was measuring the stress of the thought.

  She put the pen down.

  The program's logic was seductive. If you remove the error, the system runs cleaner. If you remove the self-deception, you suffer less. But Elena looked at her hands. They were shaking.

  She thought of Émilie. The historical notes in the book's margin described a woman who needed her Voltaire. She needed the flattery, the attention, the belief that she was the brightest mind in the room, even when the Academy rejected her. She needed the softening to do the hard work.

  The Clear Room wanted Elena to believe that the softening was the enemy.

  Elena stood up and walked to the corner of the room where the camera couldn't see her face. She closed her eyes.

  *He loved me.*

  She said it internally. A direct violation of the Audit.

  The band didn't vibrate. It only measured during the sessions, during the verbal output. The interior was hers.

  *He loved me,* she thought. *And he left.*

  Both things could be true. The Clear Room demanded binary logic. True or False. Loved or Obligated. But people were not equations. A man could love a woman and still find her presence suffocating. A man could laugh with genuine affection and still sign divorce papers.

  The truth the program wanted—the cold, hard data—wasn't the whole truth. It was just the data.

  If she accepted their version completely, she would be free of the pain of rejection, but she would lose the warmth of the memory. She would be accurate, and she would be cold.

  If she kept her version, she carried the pain of the contradiction, but she kept the warmth.

  She looked back at the desk. The math waited.

  She realized then that the math didn't need her to be happy. It didn't need her to be accurate about her husband. It only needed her to be accurate about the numbers.

  She could hold the lie in one hand and the truth in the other, as long as the work was the table they rested on.

  Elena sat down. She picked up the pen.

  She would tell Julian what he wanted. She would speak the cold data. She would unlock the door. She would get the refund and the certification and the silence of a person who no longer contradicts herself in public.

  But in the quiet, when the band was off and the Reader was gone, she would keep the dinner. She would keep the gold in the iris. She would keep the belief that she was lovable, even if the evidence suggested she was difficult.

  It wasn't ignorance. She knew the data. She knew the graphs. She knew the testimony. She was choosing to overlay a narrative that the data couldn't capture. Not because she was weak, but because the data was insufficient.

  She began to write again. *The force is not merely mass times velocity.*

  The program wanted her to believe that stripping herself down would make her lighter. But she felt heavier now, anchored. The illusion wasn't a balloon; it was ballast. Without it, she might float away into the sterile white nothingness of the Clear Room. With it, she stayed heavy enough to sit in the chair. With the work, she stayed sharp enough to cut.

  The door opened. Julian stood there. "Session in five minutes."

  Elena didn't look up immediately. She finished the line. *...it is proportional to the square.*

  "I'm ready," she said.

  She stood up. She touched the band. It was cool. It didn't know what she was thinking. It didn't know that she was carrying a secret warmth in her chest, a small, unauthorized fire.

  She walked out of the study room. She walked into the white light. She would say the words they wanted. She would say that he didn't love her. She would say that she was a burden. She would speak the truth until it was boring.

  And then she would go home, and she would open her own books, the ones with the margins full of her own handwriting, and she would remember the dinner. And she would study. And the two things would not touch, and she would be whole.

  "Statement four," Julian said when she sat down. "Confirmation."

  "Confirmed," Elena said. Her voice was steady. The band did not vibrate. "The love was not present."

  "Good," Julian said. He made a note. "You are aligning well, Elena."

  "I am learning," she said.

  "Learning what?"

  "That some things are for me," she said.

  Julian paused. He looked at her, perhaps searching for a violation, a spike, a crack. He found none. Her pulse was calm. Her skin was cool.

  "Proceed to statement five," he said.

  Elena looked at her hands. They were still. She thought of the square of the velocity. Energy growing exponentially. She thought of the dinner. She thought of the winter ending.

  She was ready to leave.
