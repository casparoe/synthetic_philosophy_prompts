      *   *Graphe Paranomon:* Implement as a "Consistency & Interest Declaration." If flagged, the threshold for approval rises (e.g., from simple majority to 2/3 within the panel). This prevents abuse because the majority can still pass it, but they have to own the inconsistency publicly.

  8.  **Final Review against Constraints:**
