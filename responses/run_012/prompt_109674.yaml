      *Refinement for Abuse:* The *Graphe* check shouldn't stop the vote, it should attach a warning label or require a "Seconding Verification." Let's make it a "Procedural Warning." If the Chair flags a conflict, the vote requires a 2/3 majority within the panel (mimicking the Council override) to proceed despite the warning. This balances the risk.

