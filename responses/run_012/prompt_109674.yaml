      *   *Sicily:* Credulity regarding *present* interested parties. Mechanism: Lack of verification of claims made by proponents. Failure Mode: **Uncritical Acceptance of Advocacy.**
      *   *Socrates:* Intolerance of dissent/process fatigue. Mechanism: Using procedure to silence minority voices rather than resolve issues. Failure Mode: **Procedural Silencing of Dissent.**
      *   *Graphe Paranomon:* Personal liability for illegal decrees. Mechanism: Accountability for consistency and legality. Failure Mode (if misused): **Weaponized Litigation/Paralysis.**

  3.  **Develop the Decision Procedure (The "Athenian Filter"):**

      *   *Goal:* Keep it under 10 mins. Keep it neutral. Keep it actionable.
