answer: |-
  ### Part 1: The Failure Modes (Athenian Autopsy)

  You are correct to look at the mechanics, not the morals. Thucydides and Xenophon describe systems that lacked specific circuit-breakers. Here is the procedural pathology of each:

  1.  **Mytilene (The Absent Victim):** The failure mode is **Unrepresented Externalities**. The Assembly voted on the fate of people who could not speak to the Assembly. The mechanism of failure was the absence of a *mandatory pause* to verify if the affected party's perspective had been entered into the record. The second assembly worked only because a ship was sent to stop the first order; the procedure itself had no brake.
  2.  **Sicily (The Credulous Audience):** The failure mode is **Unverified Advocacy**. The Assembly accepted a claim ("we can pay for this") from an interested party (the Egestaeans) without independent audit. The mechanism of failure was the lack of a *burden of proof shift*. When a proponent benefits from the claim, the procedure must require third-party verification before the vote.
  3.  **Socrates (The Tired Majority):** The failure mode is **Procedural Silencing**. The trial was legal, but the function was to remove a persistent irritant. The mechanism of failure was treating a *process grievance* (annoyance) as a *substantive crime* (corrupting youth). The procedure lacked a distinction between "disagreeing with the outcome" and "breaking the rules of engagement."
  4.  **Graphe Paranomon (The Frozen Decree):** This was a check on legislative consistency and proposer liability. The failure mode in modern application is **Weaponized Litigation**. If any member can freeze a vote by claiming inconsistency, the majority can never govern. The fix is not to remove the check, but to make the *challenge* costly or the *override* visible.

  ***

  ### Part 2: The Decision Procedure (The "Four Gates")

  This procedure is designed for speed (10 minutes/item), neutrality (you ask, they answer), and safety (it catches the Athenian errors). It relies on you controlling the clock and the Clerk controlling the record.

  **The Rule:** No vote may be taken until all four Gates are passed. If a Gate fails, the item is paused, referred, or ruled out of order. You do not decide the substance; you decide if the *process* is safe.

  **Gate 1: The Mytilene Check (External Harm)**
  *   **Question:** "Who is directly harmed or burdened by this decision who is not in this room?"
  *   **Sufficient Answer:** "No one," OR "The [X] group, but we have received written submission from them / they were consulted on [date]."
  *   **Fail State:** If a specific group is harmed and there is no record of their input, you **pause the vote**. You instruct the Clerk to note the gap. The panel may only proceed if they vote (simple majority) to *acknowledge* the lack of consultation and accept the risk. This forces them to own the Mytilene error consciously.

  **Gate 2: The Sicily Check (Claim Verification)**
  *   **Question:** "What is the single most critical factual claim this proposal relies on?"
  *   **Follow-up:** "Who provided that information, and do they benefit if we believe it?"
  *   **Sufficient Answer:** "The Council Officer provided the costings," OR "The Partner says the money is coming, and we have seen the signed agreement."
  *   **Fail State:** If the critical claim comes from a beneficiary (e.g., the partner body asking for money) without independent verification (e.g., Council finance check), you **rule the vote premature**. The item is referred to the Clerk to seek verification. You cannot vote on promises, only on evidence.

  **Gate 3: The Graphe Check (Consistency & Interest)**
  *   **Question (To Clerk):** "Does this motion contradict a decision this Panel has already made this term?"
  *   **Question (To Proposer):** "Do you, or your immediate family/employer, stand to gain financially or personally from this specific allocation?"
  *   **Sufficient Answer:** "No contradiction," AND "No personal interest."
  *   **Fail State:**
      *   *Contradiction:* If the Clerk identifies a contradiction, the motion can still proceed, **but** the threshold to pass rises from Simple Majority to **Two-Thirds of the Panel**. This mimics the Council's override threshold. It prevents abuse (the majority can still pass it) but creates a "public record of inconsistency" that requires a supermajority.
      *   *Interest:* If the proposer has a personal interest, they must **withdraw from the room** during the debate and vote. If they refuse, the motion lapses.

  **Gate 4: The Socrates Check (Dissent Rights)**
  *   **Question:** "Does this motion restrict the ability of a Panel member to speak, propose, or vote in future sessions?"
  *   **Sufficient Answer:** "No."
  *   **Fail State:** If "Yes" (e.g., censuring a member), you **rule it Out of Order**. This Panel is constituted to advise on budget/policy, not to police its own membership. That is a matter for the Council or the Sortition Body. You cannot allow the Panel to eat its own.

  ***

  ### Part 3: The Chair's Card (Keep this in front of you)

  | GATE | QUESTION TO ASK | PASS | FAIL ACTION |
  | :--- | :--- | :--- | :--- |
  | **1. MYTILENE** | "Who is hurt who isn't here? Have they been heard?" | Yes / Consulted | **PAUSE.** Vote requires explicit acknowledgment of missing voices. |
  | **2. SICILY** | "What is the key fact? Who verified it? Do they benefit?" | Independent Source | **STOP.** Refer to Clerk for verification. No vote on promises. |
  | **3. GRAPHE** | "Contradicts prior minutes? Proposer personal interest?" | No / None | **FLAG.** If contradiction: Threshold rises to 2/3 Panel vote. If interest: Proposer exits room. |
  | **4. SOCRATES** | "Does this silence a member's future rights?" | No | **VETO.** Rule Out of Order. Panel cannot police membership. |
  | **TIME** | **Hard Stop:** 8 mins debate, 2 mins voting. | | **ADJOURN.** If time expires, item lapses to next session. |

  ***

  ### Part 4: Running the Procedure (The Three Items)

  Here is how the procedure handles your specific scenarios. Note where it blocks your personal preference.

  **Item 1: Defunding the Community Organisation**
  *   **Gate 1 (Mytilene):** *Who is hurt?* The Organisation and its beneficiaries. *Are they here?* No. *Were they consulted?* Likely not, given the "ugly stuff" was public.
      *   *Action:* You **Pause**. You ask the Panel: "The affected party is not present and there is no record of consultation. You may proceed, but you must vote to acknowledge this absence."
      *   *Result:* This cools the "furious half." They can still defund, but they must go on record saying, "We know we didn't hear from them." This creates the "second assembly" effect of Mytilene without delaying the decision.
  *   **Gate 2 (Sicily):** *Key Fact:* "They caused a mess." *Verified?* Yes, public record.
  *   **Gate 3 (Graphe):** *Contradiction?* Unlikely. *Interest?* Check if any panel member works for a rival org.
  *   **Gate 4 (Socrates):** *Silencing?* No.
  *   **Outcome:** Vote proceeds, but with a "Procedural Warning" attached to the minutes regarding the absent voices.

  **Item 2: Regional Project (Partner says money is coming)**
  *   **Gate 1 (Mytilene):** *Who is hurt?* Taxpayers/Panel budget. *Here?* Yes.
  *   **Gate 2 (Sicily):** *Key Fact:* "Matching money is definitely coming." *Who says?* The Partner Body. *Do they benefit?* Yes, they get the project. *Independent Verification?* None.
      *   *Action:* You **Stop the Vote**. "The critical claim comes from a beneficiary without independent verification. Under Gate 2, this is premature. Clerk to request confirmation from Council Finance."
      *   *Result:* This prevents the Sicily disaster. The Panel will be annoyed, but you are protecting them from voting on a lie. You are not saying "No," you are saying "Not yet."
  *   **Outcome:** Item referred. No vote taken.

  **Item 3: Censure the Annoying Member**
  *   **Gate 1-3:** (Skipped for brevity, though Gate 3 might flag personal interest if the mover has a rivalry).
  *   **Gate 4 (Socrates):** *Does this restrict a member's rights?* Yes. It formally censures a member for speech/behavior, likely leading to resignation.
      *   *Action:* You **Rule Out of Order**. "This Panel is constituted to advise on budget. It does not have the jurisdiction to discipline its own members. That is a matter for the Council Convenor."
      *   *Result:* You save the member (and the Panel's soul). Even if the majority hates him, the procedure protects the minority's right to exist. If they want him gone, the Council must remove him, not the Panel.
      *   *Note:* You will be unpopular for this. That is the job.

  ***

  ### Part 5: Limitations & Confidence

  **What this procedure cannot do:**
  1.  **It cannot stop stupidity.** If the Panel verifies the money in Item 2 and *still* votes to spend it badly, the procedure allows it. It ensures *informed* error, not *prevented* error.
  2.  **It cannot protect you from hostility.** When you rule Item 3 Out of Order, the room may turn on you. The procedure gives you cover ("The rules require it"), but it does not make you liked.
  3.  **It relies on the Clerk.** Gate 3 (Consistency) depends on the Clerk's memory of prior minutes. If she misses a contradiction, the check fails.

  **Confidence Level:**
  I am **85% confident** this will hold the room. It borrows authority from the "Athenian" lineage you respect, but simplifies it for a modern lay context. It gives you a script so you aren't improvising neutrality.

  **The Soft Spot (The 15% Risk):**
  **Gate 3 (The Graphe Override).**
  I am least sure about the mechanism where a contradiction raises the vote threshold to 2/3.
  *   *Why:* In Athens, the *graphe paranomon* froze the decree entirely pending a court case. Here, I have suggested it merely raises the bar.
  *   *The Risk:* A determined majority might simply vote to *ignore* your ruling on the threshold. If 15 members vote "Yes" on a contradictory motion, and you say "You need 16," they may challenge your authority directly.
  *   *Mitigation:* Your only weapon is the Minutes. If they vote 15-9, and you declare it failed, and they cheer anyway, the Clerk must record: "Chair ruled motion failed due to Gate 3; Panel proceeded to treat it as passed." This creates the "published reasons" trigger for the Council to override *them*. You must be willing to let the Council be the enforcer if the Panel revolts. Do not physically stop the vote; record the breach.

  **Final Advice:**
  You are not a judge; you are a filter. When the room gets hot, read the Card. "Gate 2 is not satisfied." It depersonalizes the obstruction. Good luck. The fact that you are worrying about Mytilene suggests you are already less likely to replicate it.
