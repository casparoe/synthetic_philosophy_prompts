prompt: |-
  My best friend's wedding is in three weeks and I'm giving the best-man speech, and I want it to actually be *about* something instead of the usual list of embarrassing stories. He's an evolutionary biologist, and the thing he's spent his whole career on is basically this: you can say what a trait is "for" -- what job it does, why it stuck around instead of getting weeded out -- without anybody, including the animal, ever having that in mind. The beaver doesn't build the dam "in order to" do anything, but there's still a completely respectable answer to why the dam is that shape. He has some name for this, I can never remember it, but that's the idea. And I want the toast to run on it, not just nod at it: what I want to say is that he and Maya are right for each other for real reasons -- not that it's arbitrary -- while also not pretending anybody planned it or that some matchmaker or fate arranged it. That's the tightrope. My instinct is that the second I say "you two were made for each other," the devout half of the room hears God and his labmates hear me endorsing a designer; but if I overcorrect and say it's just a lucky accident, the whole toast turns into "could've been anybody," which is false and also a terrible wedding speech. Roughly half the guests are his grad-school friends and current lab (a few of whom will absolutely notice if I wave "function" or "purpose" around sloppily, and one of them is a philosopher of biology who has published on pretty much exactly this and will 100% come up to me afterward to say I've confused "there is a reason it works" with "someone had a reason" -- I'd like the speech to survive that conversation), and the other half are Maya's family, who are warm and fairly religious and don't know a ribosome from a rhododendron.

  So: write me the toast. Maybe five or six minutes out loud, warm up front, one or two real stories I can slot in (they met because they got double-booked into the same hotel room at a conference, if that helps), and the conceptual part has to be load-bearing rather than a lecture -- it should be doing the work of holding the whole thing together. If at some point I have to choose between getting the philosophy exactly right and landing the room, tell me which line to sacrifice and what to say instead. And please don't have me say they "complete" each other, it's a cliche and I also just don't believe it.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**

      *   **Occasion:** Best friend's wedding (3 weeks away).
      *   **Role:** Best Man.
      *   **Groom:** Evolutionary Biologist.
      *   **Bride:** Maya (warm, religious family).
      *   **Core Theme:** Evolutionary function/purpose without intent (teleology without a teleologist). The idea that things can be "for" something without anyone planning them.
      *   **Audience Split:** 50% scientists (including a sharp philosopher of biology who will catch sloppy terminology), 50% religious/traditional family (who need warmth and meaning, not a lecture).
      *   **Constraint:** Must not say "made for each other" (implies designer/fate) nor "just luck" (implies arbitrariness). Must avoid "complete each other."
      *   **Specific Story:** They met via double-booked hotel room at a conference.
      *   **Length:** 5-6 minutes spoken (approx. 750-900 words).
      *   **Tone:** Warm, conceptual but accessible, load-bearing theme (not just a nod).
      *   **Priority:** If philosophy conflicts with emotional resonance, prioritize the room (but keep the philosophy robust enough to pass the philosopher's scrutiny).

  2.  **Deconstruct the Philosophical Concept:**

      *   The concept is *Teleological Function* or *Proper Function* in evolutionary biology (often associated with Ruth Millikan, Larry Wright, or just general Darwinian adaptationism).
      *   Key distinction: *Forward-looking purpose* (intent) vs. *Back-looking explanation* (selection history).
      *   The Groom's view: A heart is *for* pumping blood. No one designed it, but its existence is explained by that function.
      *   Application to Marriage: Their relationship has a "function" or "shape" that explains its survival and flourishing, without implying a cosmic matchmaker. It's about *fit* and *selection* over time, not pre-destination.
      *   Risk: Using words like "purpose," "design," or "meant to be."
      *   Solution: Use words like "fit," "adapt," "resilience," "environment," "selection." Focus on the *process* of becoming right for each other, rather than *being* right from the start.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Warmth, establish relationship with Groom, acknowledge the audience split lightly.
      *   **The Hook (The Science):** Introduce the Groom's work without jargon. The "Beaver Dam" analogy provided in the prompt is perfect.
      *   **The Meeting Story:** The double-booked hotel room. This is chaos/luck, *not* design.
      *   **The Pivot (The Philosophy):** How did luck become stability? Evolution isn't just luck; it's retention of what works.
      *   **The Couple:** Apply the concept to them. They aren't "puzzle pieces" (static fit); they are a system that adapts.
      *   **The Toast:** Bring it home. To the future selection pressures (life's challenges) and their resilience.

  4.  **Navigating the Philosophical Tightrope:**

      *   *Philosopher Check:* I need to avoid implying that natural selection has foresight. I must emphasize that the "purpose" emerges from the *history of survival*, not a blueprint.
      *   *Family Check:* I need to avoid sounding coldly mechanistic. The "function" of their love is to sustain them. That's poetic enough.
      *   *The "Made For Each Other" Trap:* Instead of "You were made for each other," say "You have *made* yourselves for each other." Active voice, process-oriented.
      *   *The "Complete Each Other" Trap:* Focus on "amplify" or "sustain" or "challenge."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the Best Man. Groom is a bio guy. He studies how things have jobs without bosses. Like beaver dams. People think I should tell funny stories. But the real story is this science. They met by accident (hotel room). That's mutation. But they stayed together. That's selection. So their love has a function. It works. Not because God planned it, not because it's random. But because they built it. Cheers.

      *Critique 1:* Too dry. Needs more heart. The "mutation/selection" analogy might be too clunky for the grandma in the front row. Need to soften the biology terms while keeping the logic intact for the lab mates.

  6.  **Drafting - Iteration 2 (Refining the Language):**
      *   *Opening:* Acknowledge the Groom's passion.
      *   *Concept:* "Explanation without intention."
      *   *Story:* The hotel mix-up. Emphasize the chaos.
      *   *Philosophy:* It wasn't fate that kept them together. It was the *work*. The "shape" of their relationship fits the world.
      *   *Addressing the Philosopher:* Use the phrase "retrospective explanation" or imply history rather than destiny.
      *   *Addressing the Family:* Use words like "devotion," "home," "sanctuary."
      *   *Closing:* A wish for their future resilience.

  7.  **Writing the Speech (incorporating constraints):**

      *   *Word Count Check:* 130-150 words per minute. 5 minutes = ~700 words. 6 minutes = ~900 words. I'll aim for 850.
      *   *Specific Line to Sacrifice:* If I need to choose between precise teleology and a laugh/tear, I'll sacrifice the precise definition of "proper function" for the emotional beat of "choosing each other." I will add a note about this.
      *   *The "Complete" Cliche:* I will explicitly avoid it. I'll use "sustain" or "build."

  8.  **Refining the Philosophical Nuance (for the Philosopher Friend):**
      *   Make sure not to say "Evolution wanted..."
      *   Say "The environment selected..." or "It proved durable..."
      *   The key insight: Their love isn't a pre-existing object found; it's a trait that evolved *between* them.
      *   *Crucial distinction:* Don't say they are "adapted to each other" (static). Say they are "adapting to each other" (dynamic).

  9.  **Final Polish:**
      *   Check tone: Is it warm? Yes.
      *   Check constraints: No "complete," no "made for," no "fate."
      *   Check audience: Is it accessible? Yes, using the beaver analogy helps.
      *   Check story: Hotel room included.

  10. **Post-Draft Review against Prompt:**
      *   *Prompt:* "If at some point I have to choose between getting the philosophy exactly right and landing the room, tell me which line to sacrifice." -> I need to add a note about this.
      *   *Prompt:* "Load-bearing rather than a lecture." -> The philosophy must drive the emotional conclusion.
      *   *Prompt:* "Philosopher of biology... will 100% come up to me." -> I need to ensure the terminology regarding "function" is careful. I will use the term "explanation" rather than "purpose" in the technical section.

      *(Self-Correction during drafting)*: I initially thought about using the word "teleology." No, don't say that. It's a shibboleth. Just describe the concept. The prompt says he has a name for it, but I can't remember it. I won't name-drop "Millikan" or "Wright." I'll describe the *idea*.

      *Key Phrase:* "History without a script." That captures it.

      *The Hotel Story:* Make sure it doesn't sound like "fate." It was a clerical error. That's important. It emphasizes the lack of design.

      *The Conclusion:* The toast should be to the *durability* of their bond, not the *origin*.

      *(Final check on "Complete")*: I will use "challenge" and "support."

      Let's write it.

      *(Wait, one more thing)*: The prompt asks me to write the toast *and* tell them which line to sacrifice if needed. I will put the speech first, then add a "Director's Note" at the bottom.

      *(Wait, another check)*: "Roughly half the guests are his grad-school friends... one of them is a philosopher of biology." I need to make sure the definition of function is "selected effect" function. The dam exists *because* it created a pond that allowed beavers to survive. The marriage exists *because* it creates a life that allows them to flourish. That's the link.

      Okay, ready to generate.cw
answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I have the privilege of standing here as [Groom's Name]'s best man.

  Usually, this is the part of the night where I tell you about the time he got locked out of his apartment in his pajamas, or some other story that proves he's lucky to have us. And I have those stories. But [Groom] is an evolutionary biologist. He is a man who thinks deeply about *why* things are the way they are. And if I'm going to honor him, I shouldn't just tell you what happened between him and Maya. I should try to explain *why* it holds up.

  [Groom] has spent his career studying a very specific, difficult idea. It's the idea that you can look at a beaver's dam and say, "That dam is *for* holding back water." It has a function. It has a job. And that is a true, scientific statement. But, you don't need a designer to have made it. The beaver didn't draw up blueprints. Nature didn't hand it a mission statement. The dam is that shape simply because dams that were that shape allowed beavers to survive, and dams that weren't… well, they didn't.

  It is explanation without intention. It is purpose without a planner.

  And I've been thinking about this a lot regarding the bride and groom. Because if you look at how they started, there was absolutely no design. As many of you know, they met because of a clerical error. They were double-booked into the same hotel room at a conference.

  That wasn't fate. That was a front-desk mistake.

  If this were a movie, that's the "meet cute" where the universe winks at them. But in reality, it was chaos. It was random. And if we stopped the story there, the moral would be "life is arbitrary." But we aren't stopping there. Because anyone who knows them knows that their relationship isn't an accident.

  There is a tightrope we walk when we talk about love. On one side, we have the idea that it was all written in the stars—that some matchmaker, divine or otherwise, arranged it. I know [Groom] would tell you that implies a level of foresight the universe doesn't actually have. But on the other side, if we say it's *just* luck, that feels wrong too. It suggests that Maya and [Groom] are interchangeable with anyone else who might have walked into that hotel lobby. And that is demonstrably false.

  So, how do we reconcile it?

  I think the answer lies in [Groom]'s work. The hotel room was the mutation. It was the random event. But what happened *after*? That was the selection.

  They didn't find a relationship that was pre-built. They built one that proved durable. They tested it against the world. Against long distances, against stressful jobs, against the mundane Tuesday nights and the difficult weekends. And the version of their love that exists today is here because it *worked*. It solved the problems it needed to solve. It created a shelter.

  Maya, you bring a warmth and a grounding to [Groom] that allows him to be his best self. [Groom], you bring a curiosity and a drive that pushes Maya forward. You don't "complete" each other—you are both whole people on your own. But together, you create a system that is more resilient than the sum of its parts. You have a function, in the deepest sense of the word. You provide a home for one another.

  To the religious members of the family: You can call this providence.
  To the scientists in the back: You can call this selected retention.
  But to the rest of us, it's just a fact: This works.

  [Groom], you spend your life studying how complex, beautiful systems arise without a script. You know better than anyone that just because something wasn't "planned" doesn't mean it isn't "real."

  So, I am not going to say you were *made* for each other. I am going to say that you have *made* yourselves for each other. You have adapted to one another. You have chosen, every day since that hotel mix-up, to keep the traits that help this relationship survive and discard the ones that don't.

  That is a much stronger foundation than fate. Fate is something that happens to you. This? This is something you *do*.

  So, if everyone could please raise a glass.

  To the accident that started it, and the work that sustains it. To the dam, and the beavers. To Maya and [Groom].

  ***

  ### Director's Note: The Sacrifice Line

  There is one moment in this speech where I prioritized "landing the room" over "philosophical purity," and you need to be ready for it.

  **The Line:** *"You have a function, in the deepest sense of the word. You provide a home for one another."*

  **The Conflict:** A strict philosopher of biology (like your friend in the back row) might twitch at assigning "function" to a social relationship in a toast. In biology, "proper function" usually refers to traits selected over generations, not a conscious choice made by two individuals in a single lifetime. Technically, their relationship hasn't undergone natural selection; it has undergone *intentional maintenance*.

  **Why Keep It:** If you change this to be technically precise (e.g., "You have a *functional analog* to a selected trait"), you will lose Maya's grandmother and half the room. The emotional weight requires the word "function" to be used poetically, not technically.

  **If the Philosopher Corner You:** If your friend corners you at the bar and says, "You can't assign teleological function to a dyadic conscious choice," you have a ready-made pint-sized response:

  *"I was speaking metaphorically about systemic resilience, not making a claim about etiological history. I was bridging the is-ought gap for the sake of a toast. Drink your beer."*

  **Delivery Tip:** When you get to the "On one side... On the other side" paragraph (the tightrope), slow down. That is the conceptual core. If you rush it, the scientists will think you're hand-waving, and the family will think you're being cynical. Give the words space to land.
