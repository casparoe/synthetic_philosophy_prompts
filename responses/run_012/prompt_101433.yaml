answer: |-
  # JOINT STATEMENT ON THE STRUCTURE OF AKRASIA

  **Parties:** The Divided-Agent Camp (DAC) and The Unified-Agent Camp (UAC)
  **Date:** After one year of adversarial collaboration
  **Subject:** Ontological and Empirical Status of Akratic Phenomena

  ## 1. Agreed Claims

  1.  **Phenomenological Distinctions:** We agree that three distinct readings of akratic phenomena must be kept apart: (i) *clear-eyed akrasia*, where the agent's all-things-considered judgment at the moment of action opposes the act; (ii) *unformed judgment*, where conduct answers to a impulse without a prior all-things-considered judgment; and (iii) *diachronic akrasia*, where the agent acts against a past resolution without forming a contrary present judgment. We agree that the UAC primarily theorizes clear-eyed akrasia (as a failure of will), while the DAC primarily theorizes diachronic akrasia (as a shift in subagent dominance). We acknowledge we are not always theorizing the same reading.
  2.  **Functional Form vs. Mechanism:** We agree that the label "hyperbolic" records a fitted curve, not a mechanism. We agree that the question of whether the discount function is non-exponential is separate from the question of whether the underlying preference structure is unitary or plural. Agreement that discounting is non-exponential does not entail agreement that the agent is divided.
  3.  **The Noise Hypothesis:** We agree that an agent with a single, stable, time-consistent preference ranking could demand commitment if it expects future choices to be subject to stochastic lapses that leave the ranking intact. On this hypothesis, commitment demand is evidence of anticipated error, not necessarily of anticipated preference change. We agree this is not a genuine third ontological position but a variant of the UAC view. We agree it does not inherently favor either camp, as the DAC can accommodate noise within subagents. We agree that distinguishing this empirically from anticipated preference change requires measuring whether the *ranking* of outcomes changes or merely the *selection* from a fixed ranking.
  4.  **Preference Reversal:** Regarding the case where a subject chooses a smaller-sooner reward over a larger-later one, but reverses this choice when both are shifted later: We agree this reversal does not require that the preference ranking itself changed between the two occasions. It is compatible with one unchanging ranking plus a decision rule that is not maximization over that ranking (e.g., a threshold rule or a noisy process).
  5.  **Commitment Demand:** Regarding the case where a person pays to have a temptation removed from later reach: We agree that demand for commitment is possible for a unified agent whose preferences are time-consistent, provided the noise hypothesis holds. We agree that the DAC account does not make a prediction here that the UAC account cannot also make, provided the UAC admits the possibility of execution error. If the two accounts are empirically equivalent on every case either side can produce regarding commitment alone, we say so: commitment data alone cannot settle the ontological dispute.
  6.  **Empirical vs. Conceptual:** We agree that the dispute is partly conceptual (what counts as "the agent") and partly empirical (what neural or behavioral signatures accompany choice). We agree that standard choice data (revealed preference) do not settle the ontological status of the agent.
  7.  **Ordinary Language:** We agree that the ordinary-language term "akrasia" applies most strictly to clear-eyed akrasia. Extensions of the term to diachronic inconsistency or unformed judgment are theoretically loaded and should be flagged as such.

  ## 2. Residual Disagreements

  | Disagreement (Neutral Wording) | DAC Formulation | UAC Formulation | Crux | Case/Experiment/Argument | DAC Prediction | UAC Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Ontology of Conflict** | Is the conflict between choices best modeled as interaction between distinct entities or as internal tension within one entity? | The conflict is strategic interaction between temporally indexed subagents with genuinely opposed preferences. | The conflict is a tension within a single preference structure that fails to translate judgment into action. | **The Nature of "Will":** Is the capacity to override impulse a distinct subsystem or a property of the whole? | **Neural Dissociation:** Imaging during clear-eyed akrasia will show distinct, competing valuation circuits active at the moment of choice. | **Neural Inhibition:** Imaging will show a single valuation circuit with failed inhibitory control signals, not competing valuations. |
  | **The Source of Reversal** | Does the preference reversal (Case d) reflect a change in the agent's valuation or a change in the agent's control parameters? | The reversal reflects a bargaining failure where the present subagent's weighting dominates the future subagent's weighting. | The reversal reflects a stable valuation processed through a decision rule sensitive to temporal proximity (e.g., visceral modulation). | **Varying the Gap:** Hold dates constant, vary the delay gap between options. | Reversal points will show discrete thresholds corresponding to subagent handover points. | Reversal points will shift smoothly as a function of the delay, tracking a continuous discount curve. |
  | **Empirical Equivalence** | Are the two accounts distinguishable given the noise hypothesis? | No. If noise is admitted, the UAC can mimic DAC commitment predictions. | Yes. The DAC predicts specific patterns of renegotiation and intra-personal signaling that UAC does not. | **Pre-commitment Renegotiation:** Can the agent "bargain" with their future self to release the commitment? | Agents will attempt to renegotiate commitments when the future self arrives, treating the commitment as a contract. | Agents will attempt to break commitments only due to lapses, not due to a sense of legitimate renegotiation. |
  | **The Status of Judgment** | In clear-eyed akrasia, does the "judgment" represent a preference of a different subagent? | Yes. The judgment represents the long-term subagent; the action represents the short-term subagent. | No. The judgment represents the agent's global preference; the action represents a failure to execute that preference. | **Post-Action Regret:** Measure the immediacy and content of regret after clear-eyed akrasia. | Regret will be expressed as betrayal by another party ("I made myself do this"). | Regret will be expressed as self-blame for weakness ("I failed to do this"). |

  ## 3. Closing: The Verbal Dispute

  A portion of this dispute is merely verbal, specifically concerning the definition of "preference." If the DAC defines preference as "the motive that actually drives action" and the UAC defines preference as "the all-things-considered judgment," then the DAC's claim that "preferences change" and the UAC's claim that "preferences remain stable but execution fails" are compatible descriptions of the same event.

  However, the dispute is not *entirely* verbal. It turns on the prediction regarding **renegotiation** (Row 3, Table). If agents treat past commitments as binding contracts that can be legitimately renegotiated by a new temporal self, this supports the DAC ontology. If agents treat commitments as external constraints they simply fail to overcome due to error, this supports the UAC ontology. This is a substantive empirical disagreement, not a semantic one.

  Regarding the **Noise Hypothesis**: We agree it is a variant of the UAC view, not a third position. It favors neither camp ontologically, but it complicates the empirical landscape by making the UAC view more flexible. We agree that distinguishing Noise from Preference Change requires isolating the ranking of outcomes from the probability of selection. If the ranking of outcomes (e.g., health vs. taste) remains stable across time while choice probability fluctuates, Noise is supported. If the ranking itself flips (health valued higher than taste at T1, taste valued higher than health at T2), Preference Change is supported.

  ## 4. Confidence and Uncertainty

  **Confidence in Agreed Claims:**
  *   Claim 1 (Phenomenology): High Confidence.
  *   Claim 2 (Functional Form): High Confidence.
  *   Claim 3 (Noise Hypothesis): Moderate Confidence.
  *   Claim 4 (Preference Reversal): High Confidence.
  *   Claim 5 (Commitment Demand): High Confidence.
  *   Claim 6 (Empirical vs. Conceptual): High Confidence.
  *   Claim 7 (Ordinary Language): Moderate Confidence.

  **Least Sure Claim:**
  I am least sure of **Claim 5**, specifically the assertion that *"the DAC account does not make a prediction here that the UAC account cannot also make."*

  **What Would Change My Mind:**
  I would change my mind if we identified a form of commitment that is *costly to break* but *costless to renegotiate* via internal signaling. The UAC (even with noise) struggles to explain why an agent would accept a penalty for breaking a commitment but not accept a penalty for renegotiating it, unless the "renegotiating self" is ontologically distinct from the "committing self." If we observe subjects routinely engaging in complex intra-personal bargaining (e.g., "I'll allow this exception now if I double the penalty tomorrow") that mirrors inter-personal contract law more closely than error management, I would concede that the DAC makes unique predictions that the UAC cannot easily absorb without stretching the definition of "unified agent" to the point of meaninglessness.
