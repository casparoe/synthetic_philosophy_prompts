prompt: |-
  My cousin has offered to drive me and three friends six hours to a concert next month, on one condition: that I pay her back for the gas and for her own ticket once we arrive. I agreed immediately, but she laughed and said that was exactly the problem — by the time we get there I'll already have everything I wanted from her, so handing over the money at that point would do nothing for me, and she would be a fool to take my word. She thinks going ahead would mean betting on a promise I'd have no reason to keep. I don't consider myself dishonest and I fully intend to pay, but when I try to argue back I can't find the flaw in her reasoning, and I've started to worry that the very fact that paying would go against my interests at that later moment makes my promise worthless no matter how sincere I feel right now. Worse, whenever I try to repair this by meaning it harder, that feels like the wrong sort of move, as if sincerity were a lever I could pull to get what I want. Is she right that I can't be trusted here, and if she is, is there anything I could actually do to make the promise worth something to her?

  Please be explicit about which parts of this are settled and which are genuinely contested among people who have studied it, and don't present a contested view as the consensus.
