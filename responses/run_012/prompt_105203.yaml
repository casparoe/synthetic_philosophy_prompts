  *   **Result:** $P_{new}(E)$ remains 0.5 (no change in marginal).
  *   **Rule A Prediction:** Since $P_{new}(E) = P_{old}(E)$, the posterior $P(H)$ remains **0.20** (No update).
  *   **Rule B Prediction:** Since $R$ favors $H$ over $S$, the posterior $P(H)$ should **increase** (e.g., to >0.20).
  *   **Separation:** If she updates $H$ despite $E$ staying fixed, she is following Rule B. If she insists $H$ cannot change because $E$ didn't change, she is following Rule A.

