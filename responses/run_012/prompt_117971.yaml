      *   Final instruction to staff.

  6.  **Drafting - Iteration 2 (Writing & Polishing):**
      *   *Opening:* Be direct. "The Commission should recommend outright repeal."
      *   *Three Questions:* Use them as subheaders or clear paragraph transitions.
      *   *Certification:* Hit hard on the "rule of law" aspect. Citizens need to know the law.
