  **MEMORANDUM TO THE CRIMINAL CODE REVISION COMMISSION**

  **FROM:** The Chair
  **SUBJECT:** Recommendation on Bill [Number]: Consensual Adult Incest
  **DATE:** October 26, 2023

  **I. RECOMMENDATION**

  The Commission should recommend **outright repeal** of the felony statute criminalizing consensual sexual relations between adult siblings. We should not adopt the substitute "Certification Amendment."

  **Drafting Instructions:** Staff is directed to prepare a bill striking the relevant felony provision from the Penal Code. No substitute offense, misdemeanor or otherwise, should be drafted. No legislative findings regarding moral condemnation are necessary, though a neutral staff note may acknowledge the repeal is based on the limits of criminal jurisdiction rather than moral endorsement of the conduct.

  **II. ANALYSIS**

  To reach this conclusion, we must keep three distinct questions separate. The staff memorandum conflates them, leading to the confusion that currently divides this Commission.

  **1. Is the conduct wrong?**
  Many citizens, and likely most members of this Commission, regard adult sibling incest as morally repugnant. It violates a deep-seated taboo regarding family roles. One may hold this view without relying on religious doctrine; the intuition that sibling relationships should remain non-sexual is widespread. For the purposes of this opinion, I assume the conduct is morally wrong in the eyes of a substantial majority. However, a conclusion that conduct is morally wrong is a private judgment. It does not automatically generate a public duty to intervene.

  **2. Is it wrong for the state to permit it?**
  This question asks whether the state becomes complicit in the wrong by declining to prohibit it. The state permits many forms of conduct that are morally questionable: deceit in personal relationships, stinginess, or adultery (in this state). Permitting is not endorsing. By repealing this statute, the state does not declare the conduct good; it declares the conduct outside the reach of the criminal law. The state may maintain its marriage statute barring sibling unions, thereby withholding the *status* of marriage from such pairs without imposing *penal* sanctions on their private intimacy. Withholding state approval is distinct from active punishment.

  **3. Is it wrong for the state to punish it?**
  This is the decisive question. Criminal punishment involves the deliberate infliction of pain and stigma by the state. To justify this, we require more than moral disapproval. We require a public wrong that warrants coercive intervention.

  **III. THE LIMITING CONDITION OF MORALISM**

  Proponents of retention argue that a society is entitled to enforce its shared morality to preserve its existence. This position carries an internal limiting condition: the law may intervene only where the conduct threatens the integrity of society. We must determine whether this limit is empirical or conceptual.

  If the claim is **conceptual**—that the definition of "family" logically excludes sexual relations between siblings—then the law is merely codifying a definition. But criminal law punishes acts, not definitions. If the act does not harm a non-consenting party, the conceptual argument reduces to saying "this is wrong because we define it as wrong." That is circular and offers no limit on state power.

  If the claim is **empirical**—that permitting this conduct will weaken the family structure and thereby corrode the shared morality on which law rests—it requires evidence. Does adult, consensual, non-reproductive sibling intimacy actually destabilize the institution of the family? The staff memorandum notes this statute is charged twice a decade. The conduct is hidden and rare. There is no sociological evidence before us that the existence of this felony prevents family disintegration, nor that its repeal would accelerate it.

  If the justification relies on empirical harm to the social fabric, the burden of proof lies with the retentionists. They have not met it. If they cannot show that the social fabric is actually threatened, the limiting condition collapses. Without that limit, the state claims the power to criminalize *any* private immorality. That is a power we should not claim, for if the state can punish private moral failings without social harm, it can punish political dissent, religious heterodoxy, or lifestyle choices that offend a majority. The limit must be real, not theoretical. Since we cannot settle the empirical question of social disintegration ourselves, and no evidence suggests a threat exists, we must err on the side of liberty.

  **IV. THE CERTIFICATION AMENDMENT**

  The substitute amendment is inferior to both retention and repeal. It proposes that county boards certify "prevailing moral standards," allowing local criminalization of the conduct. This fails on two grounds.

  First, it enforces **actual morality** rather than **defensible morality**. A just law should be capable of defense to a citizen who does not already share the community's values. The amendment requires no defense; it requires only a headcount of local sentiment. It transforms criminal law into a mirror of local prejudice rather than a standard of public justice.

  Second, it is administratively unworkable and violates the rule of law. How does a board measure "prevailing moral standards"? Public hearings? Polls? The result would be arbitrary. More critically, it creates a patchwork of liability where a resident cannot know if their conduct is criminal without investigating the certification status of their county. Criminal law requires fair notice. A citizen should not have to consult a county clerk to know if their private sexual conduct is a felony or a misdemeanor. This amendment makes criminality contingent on fluctuating local sentiment, which is the antithesis of fixed law.

  **V. NON-CRIMINAL ALTERNATIVES**

  If the state has an interest in expressing disapproval without punishing, it could adopt a legislative resolution condemning the conduct. Some argue this is a fig leaf—a way to punish socially without legally. But there is a principled line. Punishment deprives liberty; condemnation expresses values. If we agree the state lacks the authority to deprive liberty here, it retains the right to speak. However, a resolution is unnecessary. The retention of the civil marriage ban already signals that the state does not recognize these unions. Adding a symbolic criminal prohibition blurs the line between expression and coercion. We should rely on the civil bar and social sanction, not the penal code.

  **VI. THE STRONGEST ARGUMENT FOR RETENTION**

  The ablest advocate for retention would not argue simply that the conduct is disgusting. They would argue that the family is the foundational unit of the state, and that bright-line rules are necessary to protect it.

  *The Argument:* "The family relies on clear roles to function safely. Sexual intimacy between siblings blurs the line between kinship and partnership. Even between adults, this blurring creates a risk of psychological harm and destabilizes the family unit. Furthermore, it is impossible to police coercive incest if consensual incest is legal; the former will hide behind the latter. Therefore, the state must maintain a bright-line prohibition to protect the integrity of the family and the vulnerable within it, even if some specific instances appear harmless."

  *The Answer:* This argument relies on overbreadth to achieve safety. We already have statutes criminalizing sexual assault, abuse of authority, and exploitation of dependents. If the concern is coercion or power dynamics, our code addresses those directly. Banning *all* adult sibling intimacy to catch the coercive cases is like banning all driving to prevent speeding. It punishes the harmless to reach the harmful.

  Regarding the "bright line": The law already draws lines based on age and dependency. We do not ban all sexual relations to prevent rape; we ban rape. We should not ban all adult sibling relations to prevent abuse. If the goal is protecting family integrity, the statute is poorly tailored: it applies to adoptive siblings (no genetic risk) and sterile couples (no reproductive risk), yet ignores other family dynamics that might be more prone to coercion. The "bright line" is not a protection of the family; it is a moral enforcement mechanism disguised as protection.

  **VII. CONCLUSION**

  The Commission stands at a boundary. We may retain a law that enforces private morality without public harm, or we may affirm that the criminal law is limited to preventing harm and protecting the vulnerable from coercion.

  The Certification Amendment attempts to straddle this line but fails, creating a system where liberty depends on local opinion polls. Retention relies on an empirical claim of social harm that goes unsupported. Outright repeal acknowledges that while the conduct may be morally wrong, it is not a proper subject for the criminal law.

  I urge the Commission to vote for repeal. We should not use the penal code to enforce a moral code where no victim exists and no social integrity is demonstrably at risk.

  **[Signature]**
