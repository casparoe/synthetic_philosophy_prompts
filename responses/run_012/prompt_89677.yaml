      *Refining the Strongest Defensible Point:*
      *   Focus on **constitutive norms**. Beliefs aim at truth and coherence. LLMs optimize likelihood. This is a structural mismatch.

      *Refining the Closing Case:*
      *   The "Truth Norm" or "Rational Integration." Ask: "If the model outputs P and P->Q, must it output Q?" If no, it lacks belief. If yes, maybe it has it. This tests the functional definition.

