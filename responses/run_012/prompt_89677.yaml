          2.  The Menu (5 distinct theses).
          3.  Evaluation of each (Platitude/Substantive/False).
          4.  Analysis of the Thundercloud Remark (What it needs vs. what it does).
          5.  The Strongest Defensible Version (Local Functional Eliminativism).
