  6.  **Select the Closing Case/Argument:**
      *   Need something that separates Hard Eliminativism (no one has beliefs) from Local Eliminativism (models don't, humans might) from Instrumentalism (beliefs are real patterns).
      *   *The "Self-Application" Test:* Ask the senior member if *he* believes the eliminativist thesis.
      *   *Better:* **The Pain Case.** Eliminativists often struggle with qualia (pain). If "belief" is gone, is "pain" gone? If he says "I'm in pain" is true but "I believe" is false, he needs a principled distinction.
