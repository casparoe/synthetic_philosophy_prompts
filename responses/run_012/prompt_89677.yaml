      *   *Selection:* **The "Ideal Interpreter" Case.** If an ideal interpreter couldn't make sense of the system without using belief talk, does that make beliefs real? (Dennett). This separates the Instrumentalist from the Eliminativist.
      *   *Actually, the prompt asks for a case to separate the readings still standing.* The "Pain" distinction is good for testing scope. The "Probe Specificity" is good for the LLM context. Let's go with **The Normative Constraint Case.** Beliefs entail norms (you *ought* to believe P if you believe P->Q). LLMs don't follow norms, they follow weights. Humans do (arguably). This separates Local Eliminativism from Hard Eliminativism.

