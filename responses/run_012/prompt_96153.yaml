      *   *Bias Check:* Ensure the Sentientist isn't made to look cold and the Relationalist isn't made to look mystical. Both need robust arguments.
      *   *Vacuity Check:* Ensure Claim 1 isn't "We agree games exist." Make it "We agree current NPCs lack qualia."
      *   *Formatting:* Use clear headings, numbered lists, and a table.

  5.  **Self-Correction during Drafting:**
