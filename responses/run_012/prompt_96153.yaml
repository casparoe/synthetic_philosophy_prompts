          *   *Modding:* Acknowledge that changing visuals changes the *meaning* of the act, even if the code logic is same.
          *   *Memory:* Acknowledge that persistent state changes the *nature of the interaction* (relationship simulation).
          *   *Patching:* Acknowledge that developer response to player emotion validates that emotion as socially significant.
          *   *Goal:* Frame these so Sentientist sees "psychological/social effects" and Relationalist sees "emergent normative facts."

      *   **Section 2: Precise Disagreements:**
          *   Need to isolate the metaphysical vs. pragmatic split.
          *   *Disagreement 1: The Locus of Status.* Intrinsic property (Sentientist) vs. Relational property (Relationalist).
          *   *Disagreement 2: The Meaning of "Harm".* Phenomenal suffering (Sentientist) vs. Violation of normative standing (Relationalist).
          *   *Disagreement 3: Verbal vs. Substantive.* Are they arguing about the word "moral" or the world? It's likely both. The Sentientist says "That's not *really* morality." The Relationalist says "Your definition is too narrow."

      *   **Section 3: The Cruxes:**
