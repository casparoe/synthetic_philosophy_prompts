  7.  **Final Polish:** Ensure the voice sounds like a philosopher who understands games (uses terms like "save-scumming," "permadeath," "mods" correctly) but keeps the metaphysics rigorous. (Proceed to generate output).

  *(Self-Correction on "Brainstorming" instruction)*: The prompt says "start by brainstorming the real points of friction, then write the document." I should explicitly include this brainstorming section before the formal document to show the thought process.

  *(Refining the "Crux" section)*: Make sure the predictions are distinct. If both sides predict the same outcome, it's not a good crux.
