  ### Part IV: A Corrected Summary

  Here is a revised version of your friend's text. It retains his register and narrative flow but corrects the philosophical and factual errors so that a defender of superrationality could sign it.

  > "Hofstadter's Platonia dilemma is the cleanest way into this. A trillionaire assembles twenty people and offers them a deal: if exactly one of the twenty sends him a telegram by noon the next day, that person receives a billion dollars; if two or more send, or if nobody sends, nobody gets anything; and the twenty are forbidden to communicate with one another. Hofstadter's superrational answer is that each of them should send a telegram with probability one in twenty. Since everyone is reasoning identically, this ensures the highest probability that exactly one telegram arrives.
  >
  > Superrationality itself he defines as the habit of including in your deliberations the fact that the other people facing the same problem are reasoning the same way you are: instead of asking 'what should I do, given what they will do?', you ask 'what should we all do, given that we will all do the same thing?'. That is reminiscent of Kant's categorical imperative, but with a crucial distinction: the superrational player is not motivated by morality or the good of the group, but by enlightened self-interest. They cooperate because they recognize that their choice is logically correlated with the choices of other rational agents.
  >
  > The magazine that carried the column later ran a real version of the game for its readers, called the Luring Lottery. You entered by sending a postcard bearing the number of entries you wanted; the prize was one million dollars divided by the total number of entries, awarded to the submitter of a randomly chosen entry. While a superrational strategy would have been for everyone to submit a single entry to maximize the prize pool, the incentive structure of standard rationality tempted players to submit as many entries as possible to increase their individual share. Predictably, a great many readers submitted huge numbers, the prize shrank to a fraction of a cent, and the contest turned into a debacle.
  >
  > The lesson Hofstadter draws is not that superrationality is magical thinking, but that it is difficult to practice. Critics argue it requires your choice to causally influence others, which is impossible in a one-shot game. Hofstadter counters that the influence is not causal but logical: if you are rational, and they are rational, you are effectively the same agent facing the same problem. The debacle of the Lottery was not a refutation of the theory, but a demonstration of how rarely people trust others to be as rational as they claim to be."
