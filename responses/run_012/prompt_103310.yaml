answer: |-
  ### 1. Essay Question

  **Metaphysics 505: Final Examination**
  **Time Allowed:** 3 Hours
  **Instructions:** Answer the following question in essay form. Citations are not required and will not be graded; focus on the strength and clarity of your argument.

  **The Case:**
  A patient dies from a lack of a specific life-saving drug. Two lapses occurred: (1) The town's only pharmacist failed to restock the drug due to a paperwork error. (2) The treating physician failed to phone the pharmacy to confirm stock, as was protocol. We know that if the pharmacist *had* restocked, the patient would have lived. We also know that if the physician *had* phoned, the pharmacist would have realized the error and restocked, and the patient would have lived. Either action on its own was sufficient to prevent the death; the death is overdetermined by these two omissions.

  **The Prompt:**
  Analyze the causal status of the pharmacist's omission. A naive counterfactual analysis suggests that because the patient would have died even if the pharmacist had acted (given the physician's inaction), the omission is not a cause. Yet, intuitively, the pharmacist bears causal responsibility.

  1.  Explain why standard counterfactual dependence fails in this specific overdetermination scenario.
  2.  Argue for a specific criterion that allows you to count the pharmacist's omission as a cause while avoiding the conclusion that irrelevant background non-events (e.g., "the patient's neighbor did not fly in with the drug") are also causes.
  3.  Conclude by defending whether causation by omission is a genuine relation between events or a pragmatic judgment about expectations.

  ***

  ### 2. Model Answer (Strong Student Performance)

  **Causation, Omission, and the Normative Filter**

  The case presented creates a dual challenge for the counterfactual theory of causation. First, it presents a scenario of symmetric overdetermination by omission, breaking the link between causation and simple counterfactual dependence. Second, it raises the "proliferation problem": if we count the pharmacist's inaction as a cause, why do we not count the neighbor's inaction as a cause? I will argue that while omissions can be genuine causes, identifying them requires supplementing counterfactual machinery with a normative distinction between expected and unexpected background conditions.

  Standard counterfactual analysis defines causation roughly as: *c* causes *e* if and only if, had *c* not occurred, *e* would not have occurred. In this case, let *c* be the pharmacist's failure to restock and *e* be the patient's death. If we hold the physician's failure fixed, the counterfactual holds: if the pharmacist had restocked, the patient lives. However, in overdetermination cases, we cannot hold the other cause fixed. If the pharmacist had restocked, we must ask what the physician would have done. The prompt stipulates that *either* action on its own suffices. This implies that if the pharmacist acts, the death is prevented regardless of the physician. But if we treat the omissions as events in a deterministic world, the standard test fails because the effect (*e*) does not depend on *c* alone; *e* would still occur due to the physician's omission. If we remove the pharmacist's omission, the physician's omission remains sufficient to kill. Thus, the death is not counterfactually dependent on the pharmacist's lapse in the simple sense. The naive counterfactual account yields the result that neither omission caused the death, which contradicts our strong intuition that the pharmacist is causally implicated.

  To rescue the counterfactual intuition without accepting that everything that didn't happen is a cause, we must modify the selection of relevant alternatives. The difference between the pharmacist and the neighbor is not metaphysical but normative. The neighbor flying in with the drug is a miraculous intervention outside the scope of normal expectations. The pharmacist restocking is a duty-bound expectation. Therefore, a successful account must treat causation by omission as relative to a "default model" of how the world ought to proceed.

  We can salvage the counterfactual account by arguing that we test dependence not against *all* possible worlds, but against *relevant* close worlds where duties are fulfilled. In the relevant close world where the pharmacist fulfills their duty, the patient lives. The physician's omission is treated as a "deviant" background condition that is screened off by the pharmacist's duty. However, this invites the charge that we are smuggling morality into metaphysics. If causation depends on duty, then causation is not a mind-independent feature of the universe.

  I defend the view that this is a feature, not a bug. Causation by omission is not a physical relation like billiard balls striking; it is a hybrid relation involving physical gaps and normative expectations. Physics alone cannot distinguish the pharmacist from the neighbor, because physically, both are merely absent events. There is no "negative matter" flowing from the pharmacist to the patient. Therefore, the "cause" is not the absence itself, but the violation of the expectation of presence.

  This solves the overdetermination issue. We can say both omissions are causes because both violate independent duties sufficient to prevent the outcome. We accept overdetermination here rather than denying causation. It also solves the neighbor problem: the neighbor had no duty, so their non-action is part of the background, not a candidate for the causal field.

  In conclusion, the pharmacist's omission is a cause, but not because the absence exerts physical force. It is a cause because the counterfactual dependence holds within a normative framework that distinguishes relevant interventions from background noise. To deny this is to deny the utility of causal language in human contexts; to accept it without the normative filter is to drown in an infinity of causes. The counterfactual machinery works only when constrained by what we expect to happen.

  ***

  ### 3. Marking Scheme (Total: 25 Marks)

  **A-Range (20–25 Marks): Insightful, Precise, Argumentatively Bold**
  **B-Range (15–19 Marks): Competent, Clear, but Standard/Safe**
  **C-Range (10–14 Marks): Misunderstands Core Mechanics or Vague**

  | Criterion | Marks | What an A-Answer Does (Distinction) | How Students Typically Blow It (B/C Trap) |
  | :--- | :---: | :--- | :--- |
  | **Diagnosis of Counterfactual Failure** | 5 | Explicitly notes that simple dependence fails because the effect persists if *only* one omission is removed (overdetermination structure). | Treats it as standard preemption (one cuts the chain) or claims dependence holds simply because "if he acted, she lives" without addressing the other omission. |
  | **The "Neighbor" Constraint** | 7 | Proposes a specific filter (normative, statistical, or contextual) to exclude irrelevant non-events; recognizes this shifts the metaphysics. | Waves hands at the neighbor ("it's obvious") or fails to address it entirely; assumes physical presence alone solves it. |
  | **Metaphysical Stance** | 5 | Takes a clear side on whether omissions are "real" events or pragmatic judgments; defends the consistency of that view. | Sits on the fence ("some say X, others say Y") without committing to a conclusion; contradicts themselves on the reality of absences. |
  | **Handling Overdetermination** | 5 | Accepts overdetermination as a bullet to bite OR provides a mechanism (e.g., minimal sufficiency) to resolve it without denying causation. | Claims that because neither is necessary, neither is a cause (gives up too easily); or claims one is "more" of a cause without criteria. |
  | **Clarity & Structure** | 3 | Argument flows logically; no filler; precise use of "if/then" reasoning. | Disorganized; spends too much time restating the prompt; verbose without adding content. |

  **Specific Penalties:**
  *   **-5 Marks:** If the student relies entirely on naming specific philosophers (e.g., "Lewis says...") without explaining the argument itself.
  *   **-3 Marks:** If the student confuses the pharmacist/physician case with a preemption case (where one cause cuts off the other).
  *   **-5 Marks:** If the answer concludes that "nothing caused the death" without addressing the strong intuition that the pharmacist is responsible.

  **Grading Note:** Do not penalize for the specific metaphysical position taken (e.g., whether they think omissions are real or pragmatic). Grade on the *coherence* of the position and how well it handles the Neighbor Constraint and the Overdetermination structure.
