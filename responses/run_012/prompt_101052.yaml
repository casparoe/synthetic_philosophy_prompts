  **Diagnostics:**
  *   **Unoccupied Spaces:** The "Independent Self + Group Priority" leaf is logically unstable; if the self is prior, group claims are derivative. "Holistic Explanation + Individual Value" is rare but possible (e.g., Hegelian liberalism), yet often collapses into Embeddedness.
  *   **Indistinguishable Positions:** Group-Priority Collectivism and Role-Based Relationalism often overlap in practice. To separate them, ask: "Is the goal group survival or role harmony?" The former permits role disruption for survival; the latter does not.
  *   **East/West Hypothesis:** This tree does not allocate by geography. Atomistic Individualism is predominantly Western, but Voluntarist Relationalism appears in both (e.g., existentialism vs. Buddhist chosen sangha). Role-Based Relationalism is often associated with Confucianism but exists in Western communitarianism.
  *   **Axes:** The tree respects the constitutive/explanatory/normative distinction. Note that Methodological Holism is purely explanatory, while the others combine ontology with norms.

  **Bottom Line:** The constitutive question—whether the self is independent of or constituted by relations—does the most sorting work.
