answer: |-
  Here is the breakdown you asked for, approached from the perspective of social anthropology and moral psychology. I will treat your observation as data, test it against existing frameworks, and then tell you where the fit fails.

  ### Part 1: Candidate Concepts & Why They Stumble

  Here are the six most likely conceptual buckets, and why each leaks when you try to pour your specific observation into it.

  1.  **Tall Poppy Syndrome / Law of Jante:**
      *   *Fit:* Captures the social punishment of standing out.
      *   *Fail:* As you noted, these are blanket prohibitions on excellence. They do not account for the *geographic switch* where the same group celebrates the expatriate. Jante says "You are not to think you are anyone special." Your observation is "You are not special *here*, but you are special *there*."
  2.  **Ressentiment (Nietzsche/Scheler):**
      *   *Fit:* Explains the moralizing of envy (recasting the winner as "arrogant" to soothe the loser).
      *   *Fail:* Ressentiment is a internal, toxic state of the *envier*. It doesn't explain the *collective* mechanism of reclaiming the expat ("one of ours"). Ressentiment wants to destroy the value; your group wants to *harvest* the value of the distant winner while rejecting the local one.
  3.  **Egalitarian Leveling Mechanisms (Anthropology):**
      *   *Fit:* Strong fit for the local undermining. In hunter-gatherer bands (e.g., the !Kung), successful hunters are "insulted" regarding their kill to prevent arrogance and enforce sharing.
      *   *Fail:* Traditional leveling applies to resources (meat, prestige) within the band. It doesn't explain why the band would boast about a member who has *left* the sharing economy.
  4.  **BIRGing (Basking In Reflected Glory):**
      *   *Fit:* Perfectly explains the "one of ours" phenomenon regarding the expat/athlete.
      *   *Fail:* This is social psychology, not anthropology. It explains the celebration, but offers no mechanism for the *punishment* of the local winner. It describes the reward, not the cost.
  5.  **Social Comparison Theory (Festinger):**
      *   *Fit:* Explains the *engine*. We compare ourselves to similar others (local colleagues), not dissimilar others (foreign stars).
      *   *Fail:* It's a cognitive bias, not a social norm. It explains *why* I feel threatened, but not why the *group* coordinates to downgrade the local winner's credit.
  6.  **Fundamental Attribution Error:**
      *   *Fit:* Explains the credit shift. For the local, we attribute success to situation (the group, luck). For the distant, we attribute to disposition (their genius).
      *   *Fail:* Again, cognitive, not normative. It doesn't capture the *moral policing* aspect ("he's pleased with himself").

  ### Part 2: Diagnosis — One Phenomenon or Bundled?

  It is **two distinct mechanisms bundled by proximity.**

  You are observing the friction between **Egalitarian Leveling** (applied to the local) and **Tribal Appropriation** (applied to the distant).

  *   **Mechanism A (Local):** When a peer succeeds within the face-to-face group, they disrupt the local status equilibrium. They become a "dominance threat." The group deploys *leveling mechanisms* (jokes, credit-sharing) to neutralize the threat and enforce equality.
  *   **Mechanism B (Distant):** When a former peer succeeds outside the group, they no longer threaten the local hierarchy. They become a "prestige asset." The group deploys *appropriation* ("one of ours") to harvest the reflected glory without paying the cost of their dominance.

  The "phenomenon" you are sensing is the **switch** between these two modes. It is not a single rule, but a conditional algorithm based on *social distance*.

  ### Part 3: The Nearest Relative & The Distinction

  The nearest established relative is **Egalitarian Leveling Mechanisms**, specifically as described in the anthropology of immediate-return societies (like James Woodburn's work or Richard Lee's studies of the !Kung).

  **Where the neighbour applies and yours does not:**
  *   **Leveling:** Applies to *resource accumulation*. If a hunter brings back too much meat, he is shamed.
  *   **Your Observation:** Applies to *credit attribution*. It is not about the prize money (usually); it is about the *narrative ownership*. Your version is more subtle; it's about epistemic control (who gets to say *why* the success happened).

  **Where yours applies and the neighbour does not:**
  *   **The Export Loophole:** Traditional leveling mechanisms usually exile the deviant or force them to share until they are equal again. Your observation identifies a modern nuance: you can escape the leveling by physically leaving the field. The "leveling" is spatially bound. A !Kung hunter cannot move to Johannesburg and expect the band to brag about him; the bond is broken. In modern professional networks, the bond is *retained* for branding purposes ("one of ours") but *suspended* for hierarchy purposes.

  **The Critical Distinction:**
  Traditional leveling is about **survival equity** (hoarding kills the group). Your observation is about **status equity** (arrogance kills the vibe). This is a first-world, meritocratic variation of leveling.

  ### Part 4: The Edges of the Phenomenon

  You asked for the boundaries. Here is where the pattern holds and where it breaks:

  1.  **Does it need a small face-to-face community?**
      *   **Yes.** It requires a "moral community" where members monitor each other's status. In a city of millions, you are anonymous; there is no "local" to punish you. This thrives in departments, small towns, startups, and labs.
  2.  **Does the successful person need to stay put?**
      *   **Absolutely.** This is the fulcrum. If they leave, the threat vanishes. If they stay, they are a daily reminder of the hierarchy. The resentment is not about the success; it is about the *continued presence* of the success.
  3.  **Does it survive anonymity?**
      *   **No.** If the success is unknown to the peers, there is no sanction. If the success is known but the person is anonymous (e.g., a quiet inventor), the group may speculate, but they cannot sanction the *person*.
  4.  **Inherited vs. Earned Success:**
      *   **This is where your hunch might wobble.** In strict egalitarian bands, *any* accumulation is suspect. In modern meritocracies, **earned** success is often treated *worse* than inherited success.
      *   *Why?* Inherited success (nepotism, wealth) is viewed as "luck" or "systemic," which fits the group's narrative that "no one is better than anyone." Earned success implies *moral superiority* (I worked harder, I am smarter). That is a direct insult to the group's competence. Therefore, the "Adjacency Sanction" is often *harsher* on the self-made local than the privileged local.

  ### Part 5: The Verdict & The Name

  You are right to reject "Tall Poppy" and "Jante." They are too blunt. You are also right to listen to your sister about "team credit," but she is missing the geographic component.

  There is no single established term for this specific *inversion* of credit based on proximity. Social psychology has the pieces (Social Comparison, BIRGing, Attribution Theory), and anthropology has the root (Leveling), but the specific configuration you described—the way credit is denied locally to preserve equality but claimed distantly to boost prestige—is a distinct modern social dynamic.

  If you need a term for your column, do not use a Greek word or a French philosophical concept. Use a description of the mechanic.

  I propose: **"The Adjacency Sanction."**

  **Definition:** *The social penalty imposed on high-achievers who remain within their original peer group, characterized by the redistribution of individual credit to the collective, contrasted with the celebration of distant achievers whose success is claimed as collective glory.*

  **What this definition rules out:**
  *   It rules out general envy (you can envy a distant star without sanctioning them).
  *   It rules out standard Tall Poppy syndrome (which applies regardless of location).
  *   It rules out simple team credit (which applies even if the team moves together).
  *   It requires the subject to remain *adjacent* to the judges.

  **Critique of your description (as requested):**
  You wrote: *"What seems to be policed is who gets to own the achievement... plus something about distance."*
  You are correct, but you are too soft on the emotion. You say it *"isn't really envy."*
  As an anthropologist, I must correct you: **It is envy, but it is institutionalized envy.**
  It is envy that has been codified into a norm to protect the group's cohesion. The "jokes" and the "it was the group" narrative are the ritualized tools used to manage that envy so it doesn't become open conflict. Calling it anything other than envy lets the participants off the hook. It is envy wearing a suit of "humility" and "teamwork."

  **Final Advice for the Column:**
  Don't look for a single word that means "this." Look for the *mechanism*. The story isn't that people are mean; it's that human beings are designed to live in bands of 150, and we still police status as if we are in a cave, even when we are in a lab. The "Adjacency Sanction" is the friction between our Paleolithic instincts and our globalized economy. We want the prestige of the global star, but the equality of the cave band. You cannot have both.
