answer: |-
  To operationalize Hofstadter, isolate each motif's invariant core, map its adjustable parameters as knobs within a variation lattice, and iterate changes through single or licensed ganged turns until structural coherence tests fail or meaning decisions are required.

  **The Procedure**

  1.  **Extract:** Copy the motif instance into a separate document. Remove context.
  2.  **Define Core:** Write one sentence defining the invariant core. This is the non-negotiable semantic or structural element. If removed, the motif ceases to be itself.
  3.  **Map Knobs:** List adjustable parameters.
      *   *Surface Knobs:* Sensory details (color, texture, verb choice).
      *   *Relational Knobs:* Contextual constraints (who sees it, what precedes it). Relational knobs govern how one variation constrains another; if Instance A is secret, Instance B cannot be public without a core shift. Example: If the motif is "whispered secret," a public shout violates the relational constraint unless the core shifts to "revealed truth."
  4.  **Navigate Lattice:** Treat each motif instance as a point in a variation lattice. Single-knob turns are edges; ganged turns are moves across several edges at once.
  5.  **Execute Turn:** Vary knobs singly for subtle shifts. Use licensed gangs only when narrative phase shifts (e.g., act breaks) demand simultaneous variation to prevent stagnation while maintaining core identity. Random cleverness is forbidden; only turn knobs that serve the core.
  6.  **Test Boundary:** Ask: "Is this still the same theme?" If no, you have created a new motif. Revert or integrate deliberately. Failure mode: If you must explain the connection in a footnote, the variation has crossed the boundary.
  7.  **Handoff:** Stop when the question shifts from "Does this fit the pattern?" to "Is this what the book means?" The procedure optimizes structure, not truth.

  **Case Runs**

  1.  **Repeated Image (A Broken Clock):** Core: "Stopped time." Surface Knobs: Era, material, location. Relational: Who observes it. *Run:* Chapter 3 shows a digital watch (Surface turn). Core holds. Chapter 8 shows a sundial. *Test:* Sundial relies on sun movement; "stopped time" core violated. *Verdict:* Cut the sundial. You love the image, but it breaks the lattice. Replace with a frozen digital display. The procedure prioritizes structural unity over aesthetic attachment.
  2.  **Character Gesture (Rubbing Thumb on Index Finger):** Core: "Suppressing violence." Surface: Speed, visibility. Relational: Proximity to victim. *Run:* Character performs gesture while forgiving an enemy. *Test:* Relational knob contradicts Core (suppression vs. release). *Verdict:* You are attached to this moment of forgiveness. Procedure dictates: Cut the gesture. Let the *absence* of the gesture signal the character's growth. The lattice requires consistency; growth is signaled by breaking the pattern, not twisting it. This is a hard cut warranted by relational constraint failure.
  3.  **The Ending:** Core: "Return to origin." Knobs: Physical location, emotional state. *Run:* Draft ends in a new city. *Test:* Core violated. *Verdict:* Warranted ganged turn. Shift location (Surface) and emotional state (Relational) simultaneously to match Chapter 1. The lattice demands closure at the termination point. Move across multiple edges to return to the origin point's variant. This is not repetition; it is resonance.

