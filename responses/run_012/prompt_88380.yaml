prompt: |-
  Im a software engineer at a small game studio, nine of us, I do the engine and the tools. No philosophy background, so if I use the wrong words for any of this thats on me.

  We're making a time travel puzzle game, and before we started we put one thing in the trailer and in every interview: one timeline, no parallel universes, no do-overs, you can't branch history, whatever you do is what always happened. It started as a marketing line and now its a promise we can't walk back. The trouble is the writers and level designers keep pitching scenarios that I'm pretty sure break it, and when I push back we just argue in circles, because nobody can say what the promise actually commits us to. My lead asked me to write the rulebook so we stop having the same fight every week.

  What I need is a procedure, not an essay. Something a level designer can run on a pitch in about fifteen minutes with no physics: the questions to ask in order, what counts as a good enough answer to each, where it stops with a flat no, and where it hands the decision to a person because the question turned out to be about story or taste rather than logic. It has to survive the pitches we actually keep getting, which are:

  - the player goes back and kills their own ancestor, and the designer wants the gun to jam because the timeline refuses. Another designer says jamming is a cop-out and wants the player to succeed, with the game just continuing in a present where they were never born.
  - the player's whole motive is to stop the disaster in the last act, and the designer wants the reveal that the attempt is what starts it.
  - a puzzle where the code you need is left for you by your future self, plus a variant where nobody ever invented the code and it has no origin at all.
  - the player meets themselves, and their future self sets up the puzzle the player solves, which is also what taught the future self to do it.
  - a pitch where the only version of events that holds together requires the player's action to fail, but the player is holding a gun with full control of it. You can't render impossible.

  Then run it on two of them for real. One: the ancestor one. Two: our flagship level, the one the whole game got pitched on, where the player goes back and actually prevents the disaster. I have a bad feeling your procedure kills that level, and if it does I want you to say so plainly and tell me the cheapest rewrite that keeps the level, not the cheapest excuse to keep it.

  Two more things I need from it. The narrative lead signs off on story and I sign off on anything that touches the engine, so mark where the procedure is finished and where a person has to sign. And be straight with me about which steps are just our taste wearing a logic costume, and what the procedure can't settle at all. Related: my lead writer and my systems designer have been going at each other about this, writer says if there's only one consistent timeline then the player never actually chose anything and the whole game is a puppet show, designer says no, being consistent only rules out the actions that contradict themselves and leaves everything else free. I don't know which of them is right, and the rulebook needs to either take a side or be honest that for our purposes it doesn't matter. Don't send me a reading list or a list of films, I won't get to them.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Software Engineer at a small game studio (9 people). Responsible for engine/tools.
      *   **Context:** Making a time travel puzzle game.
      *   **Core Constraint:** "One timeline, no parallel universes, no do-overs, you can't branch history, whatever you do is what always happened." (Single Consistent Timeline / Novikov Self-Consistency Principle).
      *   **Problem:** Writers/Designers keep pitching scenarios that might break this constraint. Arguments are circular. Need a concrete procedure/rulebook.
      *   **Requirements:**
          *   Procedure, not an essay.
          *   Run time: ~15 minutes.
          *   No physics jargon.
          *   Specific questions in order.
          *   Pass/Fail/Handoff criteria.
          *   Must handle specific edge cases (Grandfather paradox, Predestination paradox, Bootstrap paradox, Player Agency vs. Determinism).
          *   **Task:** Run the procedure on two specific scenarios:
              1.  Ancestor Killing (Gun jam vs. Erasure).
              2.  Flagship Level (Preventing the disaster).
          *   **Honesty:** If the procedure kills the Flagship Level, say so and propose the cheapest rewrite, not an excuse.
          *   **Sign-offs:** Distinguish between Logic (Engineer) and Story (Narrative Lead).
          *   **Transparency:** Identify where "taste" masks as "logic."
          *   **Agency Debate:** Address the Writer vs. Designer argument about free will vs. consistency.
          *   **Constraints:** No reading lists, no film lists.

  2.  **Deconstruct the Core Constraint:**

      *   "One timeline, no branching, whatever you do is what always happened."
      *   This is the *Novikov Self-Consistency Principle* applied to game design.
      *   Key implication: The Past cannot be *changed* relative to the Future that sent the traveler back. The Past *includes* the traveler's arrival.
      *   Therefore: You cannot create a contradiction. $A \rightarrow B \rightarrow A$ is okay. $A \rightarrow \text{not-}A$ is not.
      *   Player Agency: In this model, agency is "local" (I choose to pull the trigger) but "global" outcome is fixed (the gun jams, or I missed, or the target survived for another reason). The *illusion* of choice must not violate the *reality* of consistency.

  3.  **Drafting the Procedure (The "Consistency Check"):**

      *   *Goal:* A flowchart-like set of questions.
      *   *Step 1: The State Check.* Define State Before (SB) and State After (SA).
      *   *Step 2: The Causality Loop.* Does the action change SB?
      *   *Step 3: The Contradiction Test.* If SB changes, does SA still exist to send the player back?
      *   *Step 4: The Mechanism.* How is consistency enforced? (Physics, Luck, Failure).
      *   *Step 5: The Agency Handoff.* Is this a logic fail or a theme fail?

      *Refining the Steps for the User:*
      *   Keep it practical. Use "Memory" vs. "History."
      *   Define "The Record."
      *   Question 1: Does this action alter a known historical fact established by the Future?
      *   Question 2: If yes, does the new fact prevent the Future from existing?
      *   Question 3: If yes, is there a self-consistent explanation for why the action failed or resulted in the known fact?
      *   Question 4: Does this remove player agency to an unacceptable degree? (Taste/Story).

  4.  **Addressing the Writer vs. Designer Debate:**

      *   *Writer:* "If consistent, player never chose anything (Puppet Show)."
      *   *Designer:* "Consistency only rules out contradictions, leaves rest free."
      *   *Truth:* In a single consistent timeline, the *outcome* is fixed, but the *process* can feel like choice. However, strictly speaking, if the outcome is fixed, the "choice" to do otherwise was never a real possibility in that timeline.
      *   *Verdict for the Rulebook:* It doesn't matter for *logic*, it matters for *feel*. The procedure handles logic. The "Puppet Show" feeling is a Narrative sign-off issue. I need to be explicit about this.

  5.  **Running the Procedure on Scenario 1 (Ancestor Killing):**

      *   *Pitch A (Gun Jam):* Player tries to kill. Gun jams. Ancestor lives. Player born. Player travels back. Consistent.
      *   *Pitch B (Erasure):* Player kills. Ancestor dies. Player never born. Player travels back... Contradiction.
      *   *Procedure Result:* Pitch A passes logic. Pitch B fails logic.
      *   *Agency Issue:* Pitch A feels like "God hand" (Taste).

  6.  **Running the Procedure on Scenario 2 (Flagship Level - Preventing Disaster):**

      *   *Premise:* Player goes back to prevent disaster.
      *   *Constraint:* "Whatever you do is what always happened."
      *   *Conflict:* If the disaster *didn't* happen in the new timeline, why did the player go back?
      *   *Strict Logic:* If the player successfully prevents the disaster, the motivation to go back vanishes. Paradox.
      *   *Verdict:* This breaks the core promise *unless* the attempt to prevent it *caused* it (Predestination) OR the disaster still happens despite efforts.
      *   *User's Fear:* "I have a bad feeling your procedure kills that level."
      *   *Honesty:* I must confirm this. If the goal is "Success in changing the past," it violates "One Timeline."
      *   *Rewrite:* The "Success" must be redefined. Maybe they save *someone* specific, but the disaster still happens. Or, their attempt *causes* the disaster (Oedipus style). The user asked for the "cheapest rewrite that keeps the level."
      *   *Cheapest Rewrite:* The disaster *must* happen. The "win" condition isn't stopping the disaster, it's mitigating it or surviving it, or realizing *they* caused it. If the pitch is explicitly "Stop the disaster so it never happens," it is logically dead.
      *   *Wait, nuance:* Can they "prevent" it in the sense that the *Future* they left is now the *Past* they created? No, that's branching.
      *   *Conclusion:* The level *as described* (Preventing the disaster) is logically impossible under the studio's promise.
      *   *Fix:* The disaster *always* happened. The player's journey back was *part* of the disaster's cause, or they fail to stop it. The "Win" is understanding/survival, not prevention.

  7.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the role (Engineer to Engineer).
      *   **The Procedure:** "The Consistency Protocol." Step-by-step.
      *   **Sign-off Matrix:** Who signs what.
      *   **The Agency Debate:** Addressing Writer vs. Designer.
      *   **Taste vs. Logic:** Explicitly calling out the "Gun Jam" issue.
      *   **Scenario Analysis 1 (Ancestor):** Run the protocol.
      *   **Scenario Analysis 2 (Flagship):** Run the protocol. Deliver the hard truth. Offer the rewrite.

  8.  **Refining the Tone:**

      *   Direct, technical, no fluff.
      *   Respectful of the constraint (it's a marketing promise, treat it like a spec).
      *   Clear distinction between "Logic Error" (Crash) and "Design Choice" (Feature).

  9.  **Self-Correction/Edge Case Check:**

      *   *Did I answer the Agency question?* Yes, need to clarify that logic doesn't care about free will, but the *game* does.
      *   *Did I mark sign-offs?* Yes, need a specific section.
      *   *Did I handle the Flagship Level honestly?* This is the riskiest part. If I say "It works," I'm lying about the physics of their promise. If I say "It dies," I need to offer the specific pivot. The pivot is: The disaster *cannot* be prevented. The level must change from "Prevention" to "Mitigation" or "Causation."
      *   *Wait, is there a loophole?* What if the "Disaster" is something that *needs* to happen for the future to exist, but they save people *within* it? That works. What if the "Future" they leave is a dystopian result of the disaster, and they go back to ensure the disaster happens *differently*? No, that's branching.
      *   *Strict interpretation:* "Whatever you do is what always happened." If the history books say "Disaster Happened," and you go back, you cannot make History Books say "Disaster Didn't Happen."
      *   *Okay, I will stick to the strict interpretation because that's what the marketing promise implies.*

  10. **Final Polish:** Check against the "15 minutes" constraint. Keep the questions binary (Yes/No).

      *(Self-Correction on the Flagship Level)*: The user said "The one the whole game got pitched on." If I kill it, I might be killing the game. But they asked for honesty. "If it does I want you to say so plainly." Okay, I will kill it logically but offer the Predestination twist as the save. That keeps the *assets* and *level layout* mostly the same, just changes the *objective text* and *ending cutscene*.

      *(Refining the Agency Debate)*: The Designer is right about logic (consistency only bans contradictions). The Writer is right about theme (determinism feels like puppetry). The Rulebook should side with the Designer on *validation*, but flag the Writer's concern for *narrative review*.

      *(Refining "Taste wearing Logic Costume")*: The "Gun Jam" is the classic example. Logically valid (something stopped you), but feels like cheating (Taste). I need to mark this clearly.

      Let's assemble.

      *Structure:*
      1. The Consistency Protocol (The Procedure).
      2. Sign-Off Matrix.
      3. The Agency Question (Writer vs Designer).
      4. Taste vs. Logic (The "Gun Jam" warning).
      5. Scenario Run 1 (Ancestor).
      6. Scenario Run 2 (Flagship).

      *Wait, one detail:* "Mark where the procedure is finished and where a person has to sign." I'll integrate this into the Protocol steps.

      *Let's write.*
answer: |-
  # The Consistency Protocol

  **Purpose:** Validate time-travel mechanics against the studio promise: *One Timeline. No Branches. What Happened, Happened.*
  **Time:** 15 Minutes.
  **Users:** Level Designers, Writers, Engineers.

  ## Part 1: The Procedure

  Run these five questions in order. If you hit a **STOP**, the pitch is rejected or requires a rewrite. If you hit **HANDOFF**, logic is satisfied; the remaining decision is about story or feel.

  **Q1: The Record Check**
  *   **Question:** Is there an established fact in the "Future" (the start state) that contradicts the proposed action in the "Past"?
  *   **Example:** Future says "Bridge destroyed." Action says "Save bridge."
  *   **No:** Logic Valid. Proceed to Q5 (Handoff).
  *   **Yes:** Potential Paradox. Proceed to Q2.

  **Q2: The Causality Loop**
  *   **Question:** If the action succeeds, does it erase the motivation or ability for the player to have traveled back in time?
  *   **Example:** Kill ancestor = Player never born = Player never travels back = Ancestor never killed.
  *   **No:** Logic Valid. (The change doesn't affect the traveler). Proceed to Q5.
  *   **Yes:** Hard Paradox. Proceed to Q3.

  **Q3: The Consistency Mechanism**
  *   **Question:** Is there a plausible in-world reason why the action *fails* or *results in the established fact anyway*?
  *   **Examples:** Gun jams, player misses, player's action *causes* the disaster they tried to stop.
  *   **No:** **STOP.** Logic Fail. The pitch violates the core promise.
  *   **Yes:** Logic Valid. Proceed to Q4.

  **Q4: The "God Hand" Test (Taste Check)**
  *   **Question:** Does the mechanism in Q3 rely on invisible forces (guns jamming randomly, sudden earthquakes) rather than player error or puzzle logic?
  *   **No:** Logic Valid. Proceed to Q5.
  *   **Yes:** **HANDOFF.** Logic holds, but this is a "Taste" issue. It feels like cheating. Requires Narrative Lead approval.

  **Q5: The Agency Handoff**
  *   **Question:** Does the solution make the player feel like a puppet (their choices don't matter) or an agent (they chose, but the outcome was fixed)?
  *   **Note:** This cannot be solved by logic.
  *   **Action:** **HANDOFF.** Pass to Narrative Lead for final approval on theme/tone.

  ---

  ## Part 2: Sign-Off Matrix

  | Step | Decision Type | Who Signs Off |
  | :--- | :--- | :--- |
  | **Q1 - Q3** | **Logic / Engine** | **You (Engine Lead)** |
  | **Q4** | **Design Taste** | **Lead Designer + You** |
  | **Q5** | **Narrative Theme** | **Narrative Lead** |

  *   **Logic Sign-off:** Confirms the game state won't crash or contradict saved data.
  *   **Taste Sign-off:** Confirms the mechanic doesn't feel unfair to the player.
  *   **Theme Sign-off:** Confirms the story still works even if the timeline is fixed.

  ---

  ## Part 3: The Agency Debate (Writer vs. Designer)

  **The Conflict:**
  *   **Writer:** "If the timeline is fixed, the player never chose anything. It's a puppet show."
  *   **Designer:** "Consistency only rules out contradictions. Everything else is free."

  **The Rulebook Verdict:**
  For the purposes of **Engine and Logic**, the **Designer is right.**
  Consistency only forbids $A \rightarrow \text{not-}A$. It does not forbid the player from choosing between Path X and Path Y, provided both paths lead to the same historical outcome (e.g., You can sneak or fight, but the Guard must die either way).

  However, for **Narrative**, the **Writer is right.**
  If every path leads to the same outcome, the *weight* of the choice is diminished. This is not a logic error; it is a thematic cost.
  *   **Protocol:** Do not use logic to solve this. If the Writer feels the player has no agency, that is a **Q5 Handoff**. It is their job to write the character's internal struggle to make the fixed outcome feel earned, not your job to change the timeline.

  ---

  ## Part 4: Taste vs. Logic (Transparency)

  You asked to know where taste wears a logic costume.
  **It is Q4 (The God Hand Test).**

  *   **Logic:** A gun jamming prevents a paradox. It is logically sound.
  *   **Taste:** A gun jamming because "the universe said no" feels like the developer taking away control.
  *   **The Rule:** The Procedure accepts the gun jam as **Valid Logic**. But I am flagging it as **Bad Design** unless foreshadowed.
  *   **Better Solution:** The player chooses not to pull the trigger, or the puzzle requires the ancestor to live. Do not rely on random failure to enforce logic.

  ---

  ## Part 5: Scenario Runs

  ### Scenario 1: The Ancestor Pitch
  *Pitch:* Player goes back to kill ancestor.
  *Option A:* Gun jams (Timeline refuses).
  *Option B:* Success (Player erased, game continues).

  **Run:**
  1.  **Q1 (Record Check):** **Yes.** Future exists, so Ancestor must have lived.
  2.  **Q2 (Causality Loop):** **Yes.** If Ancestor dies, Player isn't born to travel back.
  3.  **Q3 (Consistency Mechanism):**
      *   *Option A (Jam):* **Yes.** Action fails. Timeline holds.
      *   *Option B (Erasure):* **No.** Action succeeds. Timeline breaks.
  4.  **Q4 (God Hand):**
      *   *Option A:* **Yes.** Random jam is "Taste" risk. Needs Narrative sign-off.
      *   *Option B:* **N/A.** Already failed Logic.

  **Verdict:**
  *   **Option B:** **STOP.** Logic Fail. You cannot ship this. It violates the marketing promise.
  *   **Option A:** **HANDOFF.** Logic passes (You sign). Design/Narrative must decide if a random jam is acceptable (Q4).
  *   **Recommendation:** Don't jam the gun. Make the *puzzle* require the ancestor to live. (e.g., You need the ancestor to survive to pass down a key item). This turns the constraint into a mechanic, not a barrier.

  ---

  ### Scenario 2: The Flagship Level
  *Pitch:* Player goes back and **prevents the disaster** in the last act. This is the level the game was pitched on.

  **Run:**
  1.  **Q1 (Record Check):** **Yes.** The "Future" the player left was defined by the Disaster happening.
  2.  **Q2 (Causality Loop):** **Yes.** If the Disaster is prevented, the Future that sent the player back ceases to exist. Why did they travel?
  3.  **Q3 (Consistency Mechanism):** **No.** The pitch explicitly states the player *prevents* it. There is no mechanism for failure or loop here.

  **Verdict:**
  **STOP. Logic Fail.**

  **Honest Assessment:**
  You asked me to be plain. **This level breaks your core promise.**
  If the disaster is prevented, history has changed. That is a branching timeline. That is "Deus Ex: Mankind Divided," not "One Timeline." If you ship this as written, you break the promise you put in the trailer.

  **The Cheapest Rewrite:**
  You do not need to scrap the assets or the level layout. You need to change the **Objective** and the **Ending**.

  *   **Current Objective:** "Stop the Disaster."
  *   **New Objective:** "Ensure the Disaster happens *correctly*," OR "Save the *people*, but not the *event*."

  **Option A (Predestination - The "Oedipus" Fix):**
  *   **Change:** The player's actions in the past *cause* the disaster they tried to stop.
  *   **Cost:** Rewrite the final cutscene. Change dialogue from "We did it!" to "It was us."
  *   **Logic:** Valid. (Q3 Pass).
  *   **Taste:** High impact, fits the genre.

  **Option B (Mitigation - The "Survivor" Fix):**
  *   **Change:** The Disaster *must* happen (building burns, bomb explodes), but the player saves specific characters or items *within* the event.
  *   **Cost:** Change victory condition. History books remain the same, but the player's personal outcome changes.
  *   **Logic:** Valid. (Q1 Pass - History record unchanged).
  *   **Taste:** Less twisty, but preserves player agency better.

  **Recommendation:**
  Take **Option A**. It costs the least in terms of asset changes (the explosion happens either way) but aligns perfectly with your "One Timeline" marketing. It turns the "failure" of prevention into the "success" of consistency.

  **Sign-Off Required:**
  *   **Logic:** I (Engine) reject the current pitch. I approve Option A or B.
  *   **Narrative:** Lead Writer must approve the thematic shift (Prevention -> Causation or Mitigation).

  ---

  ## Summary for the Lead
  1.  **Adopt the Protocol.** It separates Logic (Engine) from Taste (Design) from Theme (Narrative).
  2.  **Kill the "Prevention" Win Condition.** It is logically incompatible with your promise.
  3.  **Side with the Designer on Logic,** but give the Writer veto power on "Puppet Show" feelings (Q5).
  4.  **Avoid "God Hand" failures.** Don't jam guns. Design puzzles where the *solution* requires consistency, rather than punishing the player for trying to break it.
