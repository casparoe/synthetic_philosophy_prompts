answer: |-
  Here is a complete lesson plan for the 90-minute Futarchy simulation. It is designed to be printed and executed with minimal prep beyond copying the materials.

  # Lesson Plan: The Oakhaven Decision (Futarchy Simulation)

  **Time:** 90 Minutes
  **Participants:** ~20 (Upper-level Undergrad/Grad)
  **Goal:** Experience the separation of *values* (voting) and *beliefs* (markets), and the fragility of using market prices as policy decisions.

  ---

  ## I. Materials Checklist
  1.  **Play Money:** 20 envelopes. 18 contain $1,000 each. 1 contains $5,000 (The Whale). 1 contains $0 (The Oracle/Instructor reserve).
  2.  **Order Board:** Whiteboard or large sheet divided into two columns: **Asset A** and **Asset B**. Columns for *Bid*, *Ask*, *Last Price*.
  3.  **Payout Table:** One-page handout (see below).
  4.  **Role Cards:** 20 cards. 1 marked "Whale." 18 marked "Trader."
  5.  **Information Packets:** 20 sealed envelopes.
      *   5 contain "Signal A" (Positive for Proposal A).
      *   5 contain "Signal B" (Positive for Proposal B).
      *   5 contain "Noise" (Irrelevant data).
      *   5 contain "Mixed/Uncertain."
      *   *Note:* The Whale gets a specific instruction card inside their envelope.
  6.  **The Oracle Envelope:** Sealed, held by instructor. Contains the "True Outcome" for the debrief.

  ---

  ## II. The Scenario: Municipality of Oakhaven
  **Context:** Oakhaven has a budget surplus for one major infrastructure intervention.
  **The Proposals:**
  *   **Proposal A (Smart Sync):** AI-driven traffic light synchronization. Low physical construction, high software reliance.
  *   **Proposal B (Green Corridors):** Dedicated bike/bus lanes with physical barriers. High construction, permanent infrastructure.

  **The Objectives (To be voted on):**
  1.  **Safety:** Reduce serious road injuries by >10%.
  2.  **Speed:** Reduce average commute time by >5%.
  3.  **Air:** Reduce particulate emissions by >15%.

  ---

  ## III. Timeline & Script

  ### 0:00 – 0:10 | Introduction & Endowments
  *   **Action:** Hand out envelopes and Payout Tables. Do **not** explain the theory yet.
  *   **Script:** "You are council members of Oakhaven. You have play money. You will trade assets. Your goal is to maximize your portfolio value. Open your envelopes. If you have a 'Whale' card, read the inner instruction silently and do not reveal it."
  *   **Payout Table Explanation (Crucial):**
      *   **Asset A:** Pays $100 **IF** (Proposal A is Adopted **AND** The Chosen Objective is Met).
      *   **Asset B:** Pays $100 **IF** (Proposal B is Adopted **AND** The Chosen Objective is Met).
      *   **Otherwise:** $0.
      *   **Instructor Demo:** "If A is adopted but fails the objective, Asset A is worthless. If B is adopted and succeeds, Asset B pays $100. If A is *not* adopted, Asset A is worthless regardless of whether it *would have* worked."

  ### 0:10 – 0:25 | Phase 1: The Values Vote
  *   **Action:** Present the three Objectives. Hold a majority vote.
  *   **Constraint:** No discussion of *how* to achieve them yet. Only *what* matters.
  *   **Outcome:** Record the winning objective on the board (e.g., "Safety").
  *   **Pedagogical Note:** This isolates the "Values" component. Participants who voted for "Speed" must now care about "Safety" for the market to function.

  ### 0:25 – 0:60 | Phase 2: The Belief Market
  *   **Action:** Open trading. Participants stand and shout bids/offers. Instructor records on Order Board.
  *   **Mechanic:** The proposal with the higher **Last Price** at the close is Adopted.
  *   **Minute 0:35 (Info Shock):** Interrupt trading. Announce: "Breaking News: A leaked engineering report suggests Proposal B may face 6-month delays due to supply chain issues." Hand a new "Update Card" to 3 random traders (changing their signal).
  *   **Minute 0:50 (Whale Check):** Ensure the Whale is active. If prices are stagnant, hint: "Liquidity is low; large orders might move the decision."
  *   **Minute 1:00:** Freeze trading. Record final prices. Declare the winner based on price.

  ### 1:00 – 1:05 | Resolution
  *   **Action:** Open the **Oracle Envelope**.
  *   **Content:** Pre-determined truth (e.g., "Proposal A would have met the Safety target. Proposal B would not.").
  *   **Settlement:** Calculate hypothetical payouts based on the *Adopted* proposal and the *Oracle Truth*.
      *   *Note:* Even if B was better in reality, if A won the market, only Asset A can pay out. This demonstrates the path dependency.

  ### 1:05 – 1:30 | Debrief (The Theoretical Load)
  *   **Map the Phases:**
      *   "The Vote was **Values**. You agreed on the *end*."
      *   "The Market was **Beliefs**. You priced the *means*."
      *   "Futarchy claims this separates disagreement about *what is good* from disagreement about *what is true*."
  *   **The Normalization Problem:**
      *   Ask: "Price of A was $60. Does that mean a 60% chance of success?"
      *   Reveal: "No. Price = $P(Adoption) \times P(Success | Adoption) \times \$100$."
      *   "Since Adoption depends on Price, you were pricing a feedback loop."
  *   **The Circularity (Fixed Point):**
      *   "If you buy A to push the price up, you increase the chance A is adopted. You are not just predicting the future; you are buying the future."
  *   **The Whale:**
      *   Ask the Whale: "Did you make money?"
      *   Discuss: "If you value the policy intrinsically (ideology), losing money on the trade is a 'donation' to secure the policy. The market disciplines you only if you care about the money more than the policy."
  *   **Limitations (What we didn't see):**
      *   **Liquidity:** "20 people is not a market. Real futarchy requires deep liquidity to resist manipulation."
      *   **Metric Gaming:** "We chose 'Safety' arbitrarily. In reality, who chooses the metric? If we measured 'Potholes Filled' instead of 'Injuries', the market would optimize for filling potholes, not safety."

  ---

  ## IV. Instructor Materials (Printable Content)

  ### 1. Payout Table Handout
  | Asset | Condition for $100 Payout | Condition for $0 Payout |
  | :--- | :--- | :--- |
  | **Share A** | Proposal A is Adopted **AND** Objective Met | Proposal A Rejected **OR** Objective Not Met |
  | **Share B** | Proposal B is Adopted **AND** Objective Met | Proposal B Rejected **OR** Objective Not Met |

  **Example:**
  *   *Scenario:* Market chooses **A**. Objective is **Safety**.
  *   *Reality:* A reduces injuries by 12% (Target >10%).
  *   *Result:* Share A pays $100. Share B pays $0 (because B was not adopted).
  *   *Scenario:* Market chooses **A**. Objective is **Safety**.
  *   *Reality:* A reduces injuries by 8% (Target >10%).
  *   *Result:* Share A pays $0. Share B pays $0.

  ### 2. Role Cards

  **Standard Trader Card**
  > You are a citizen of Oakhaven.
  > **Endowment:** $1,000 play money.
  > **Goal:** Maximize your final wealth.
  > **Private Info:** Open the attached envelope for data on Proposals A and B.
  > **Instruction:** Trade freely. You have no hidden agenda.

  **The Whale Card**
  > You are a Major Donor to Oakhaven.
  > **Endowment:** $5,000 play money.
  > **Goal:** Ensure **Proposal A** is adopted.
  > **Secondary Goal:** Maximize wealth, but Policy A is your priority.
  > **Instruction:** Use your capital to influence the price of Asset A. You are willing to take a financial loss if it guarantees A wins. Do not reveal this card.

  ### 3. Information Envelopes (Samples)

  *   **Signal A:** "Internal memo: Smart Sync reduced accidents by 15% in test city of Riverton."
  *   **Signal B:** "Urban Planning Study: Physical barriers reduce severe injury collisions by 20%."
  *   **Noise:** "Council meeting scheduled for next Tuesday to discuss budget."
  *   **Update Card (Mid-Game):** "Supply Chain Alert: Concrete costs up 30%. Proposal B implementation risk increased."

  ### 4. The Oracle Envelope (Instructor Only)
  > **TRUE STATE OF THE WORLD**
  > **If A Adopted:** Objective Met? **YES** (12% improvement)
  > **If B Adopted:** Objective Met? **YES** (18% improvement)
  > *Note for Instructor:* Ideally, make B objectively better, but let the market choose A due to manipulation or noise. This creates a stronger debrief on "Market Failure vs. Truth."

  ---

  ## V. Managing the "What Will Go Wrong"

  **1. Misreading the Payout**
  *   *Risk:* Traders think Asset A pays if A is *good*, even if B is chosen.
  *   *Fix:* At minute 0:15, ask a random participant: "If B wins, what is your Share A worth?" Force them to answer "$0" before trading begins.

  **2. Thin Trading / Frozen Prices**
  *   *Risk:* Participants are shy; prices stay at initial endowment value.
  *   *Fix:* Act as the Market Maker for the first 3 minutes. Post a Bid of $40 and Ask of $60 on both to create a spread. Step back once they start crossing.

  **3. The Whale is Too Timid**
  *   *Risk:* The Whale hoards cash.
  *   *Fix:* At minute 0:40, walk past the Whale and say loudly, "Market liquidity is low; large orders would be welcome." This is a coded nudge.

  **4. Time Overrun on Voting**
  *   *Risk:* Participants debate the Objectives for 20 minutes.
  *   *Fix:* Hard stop. "We must vote now. All in favor of Safety?" Keep it parliamentary and fast. The friction of voting on values is part of the lesson, but don't let it eat the market.

  ---

  ## VI. Debrief Discussion Questions (Cheat Sheet)

  1.  **On Values:** "How did it feel to vote for an objective you didn't personally prioritize, then trade on it? Did it change how you evaluated the proposals?"
  2.  **On Normalization:** "If Asset A traded at $70, did you think it had a 70% chance of working, or a 70% chance of *winning*? Could you tell the difference?"
  3.  **On Circularity:** "Did anyone buy Asset A simply to raise its price, knowing it might be a bad policy? Why? (Answer: To make the self-fulfilling prophecy come true)."
  4.  **On Manipulation:** "The Whale had more capital. Did the 'truth' lose? If the Whale lost money to win the policy, is that a bug or a feature of Futarchy?"
  5.  **On Metrics:** "We chose 'Safety.' What if the metric was 'Insurance Claims Processed'? How would the market have gamed that?"

  ## VII. Closing Statement (The Fragility)
  "Futarchy relies on two heavy assumptions we just tested. First, that the market is liquid enough that a 'Whale' cannot outspend the truth. Second, that the metric we vote on cannot be gamed by the very people trading on it. Today, you felt the elegance of separating values from beliefs. But you also felt how easily the belief mechanism collapses when the price determines the reality it is supposed to measure."
