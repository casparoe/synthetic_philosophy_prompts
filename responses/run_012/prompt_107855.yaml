  **Mark: 8/20**

  ### Part (i): Expected Utility (5/5 Marks)
  **Comment:**
  This part is fully correct.
  *   **Correct:** You correctly calculated $EU(A) = 20$.
  *   **Correct:** You correctly calculated $EU(B) = 22$ by summing the probability-weighted utilities.
  *   **Correct:** You correctly identified that Expected Utility recommends Act B ($22 > 20$).

  **Justification:** Full marks awarded. The arithmetic is accurate and the conclusion follows logically from the calculations.

  ---

  ### Part (ii): Risk-Weighted Expected Utility (1/10 Marks)
  **Comment:**
  This part contains a fundamental error regarding the definition provided in the question.
  *   **Incorrect:** You did not use the authoritative definition of REU provided in the prompt. You used the formula $\sum r(p_i)u(x_i)$, which transforms individual probabilities. The provided definition requires transforming the **cumulative probabilities** of outcomes *at least as good as* $x_i$, applied to **increments** of utility.
  *   **Incorrect:** Consequently, your calculation for Act B (4.6) is wrong.
  *   **Partially Correct:** Your calculation for Act A (20) is numerically correct, though your method ($r(1) \cdot u(20)$) is coincidentally correct only because $r(1)=1$.
  *   **Correct:** Your final recommendation (Act A) is correct, as the true REU of A (20) is indeed higher than the true REU of B (7). However, this conclusion was reached via incorrect intermediate values.

  **Correct Calculation:**
  To receive full marks, you should have applied the summation formula to the ordered outcomes of Act B ($x_1=0, x_2=40, x_3=100$):
  1.  Identify cumulative probabilities for outcomes $\ge x_i$:
      *   For $x_3=100$: $P(\ge 100) = 0.1$.
      *   For $x_2=40$: $P(\ge 40) = 0.3 + 0.1 = 0.4$.
  2.  Apply the formula:
      $$REU(B) = u(0) + [u(40) - u(0)] \cdot r(0.4) + [u(100) - u(40)] \cdot r(0.1)$$
      $$REU(B) = 0 + [40 - 0] \cdot (0.4)^2 + [100 - 40] \cdot (0.1)^2$$
      $$REU(B) = 40 \cdot 0.16 + 60 \cdot 0.01$$
      $$REU(B) = 6.4 + 0.6 = 7.0$$
  3.  Compare: $REU(A) = 20$ vs $REU(B) = 7$. Recommendation: **Act A**.

  **Justification:** 1 mark is awarded for the correct final recommendation. No method marks are awarded for Act B because the formula used contradicted the explicit instructions ("Treat this definition as authoritative").

