prompt: |-
  I'm the ethics-and-safety lead on the team building an autonomous escalation module for our hospital's intensive care unit: it watches vitals and, within limits, acts on its own (paging the rapid response team, locking a bed to a patient) and recommends things it can't do alone (moving someone out of a bed to free it up, putting a patient on a palliative-only pathway). These calls come up several times a day, a consultant signs off anything irreversible, and I get about twenty minutes to defend each one in front of the ethics committee, which is why I need a procedure and not an essay. Act as a philosopher who has also shipped software: think it through properly before you write, and start by saying what our two-part test actually commits us to before you try to operationalise it.

  The test the committee adopted: (1) the rule has to be one that no one who might end up on the receiving end could reasonably reject, given they dont know which position they'll be in; and (2) a foreseeable harm to a particular person must never be the mechanism by which the good is acheived — it can be a side effect, but it cant be the means. Give me the procedure in order: the questions to ask, what counts as a sufficient answer to each, where it stops with a no, and where it has to go to a human because it's a values call rather than a fact. Then run it on three cases: moving a stable patient out of ICU to free a bed for a sicker arrival; a mass-casualty situation where the module withholds a bed from one patient precisely because another needs it; and a rule that quietly deprioritises everyone with a particular comorbidity, which nobody on my team thinks is unfair. Say which of the two conditions is doing the real work in each case, what happens when they pull apart, where the procedure will misfire, and which of my steps are just judgement dressed up as engineering. Finally: when the committee overrides the procedure, what should the log say — I want the spec to force overrides to be recorded with a reason rather than quietly disappeared. British English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher who has also shipped software (pragmatic, rigorous, systems-oriented).
      *   **Task:** Create a procedure for an autonomous escalation module in an ICU, based on a specific two-part ethical test. Then apply it to three cases, analyze the friction points, and specify logging for overrides.
      *   **Context:** Hospital ICU, autonomous actions (paging, locking beds) + recommendations (moving patients, palliative pathways). Consultant signs off on irreversible actions. Ethics committee reviews decisions (20 mins per case).
      *   **The Two-Part Test:**
          1.  *Rawlsian/Scanlonian Reasonable Rejection:* The rule must be one no one could reasonably reject from behind a veil of ignorance (not knowing their position).
          2.  *Doctrine of Double Effect (DDE) variant:* Foreseeable harm to a particular person cannot be the *mechanism* (means) to achieve the good; it can only be a side effect.
      *   **Output Requirements:**
          *   Start by explicating what the test commits us to.
          *   Provide a step-by-step procedure (questions, sufficient answers, stop conditions, human handoff points).
          *   Run the procedure on three specific cases (Bed freeing, Mass-casualty triage, Comorbidity deprioritisation).
          *   Analyze which condition does the work, where they diverge, where the procedure misfires, and where judgement is disguised as engineering.
          *   Specify the override log format (British English).
          *   Tone: Professional, precise, "shipped software" mindset, philosophical rigour.

  2.  **Deconstruct the Ethical Test (Pre-Operationalisation):**
      *   *Condition 1 (Reasonable Rejection):* This is contractualist. It demands impartiality and risk distribution. It commits us to *systemic fairness*. If a rule disproportionately burdens a specific identifiable group (even if efficient), it fails. It requires us to ask: "Would I accept this risk if I were the patient?"
      *   *Condition 2 (Means vs. Side Effect):* This is deontological/consequentialist hybrid (DDE). It commits us to *non-instrumentalisation*. We cannot use a patient as a resource. Harm must be incidental to saving others, not the *method* of saving others.
      *   *Tension:* Condition 1 looks at the *rule* generally (ex-ante). Condition 2 looks at the *act* specifically (ex-post). Condition 1 allows some harm if the system is fair. Condition 2 forbids specific types of causal chains regardless of fairness.

  3.  **Drafting the Procedure (The "Spec"):**
      *   Needs to be algorithmic but acknowledge human judgement.
      *   Structure: Input -> Check 1 -> Check 2 -> Decision -> Log.
      *   *Step 1: Classification.* Is this an action or a recommendation? Is harm foreseeable?
      *   *Step 2: The Means Test (Condition 2).* This is usually easier to codify. Is the harm causal to the benefit?
      *   *Step 3: The Rejection Test (Condition 1).* This is harder. Requires statistical fairness and risk assessment.
      *   *Handoff:* Where does the machine stop? When "reasonable" is ambiguous or when "harm" is value-laden (e.g., palliative care).
      *   *Stop Conditions:* If either test fails, action is blocked or escalated.

  4.  **Running the Cases:**
      *   *Case 1: Moving a stable patient to free a bed.*
          *   Means Test: Is the harm (discharge/transfer risk) the *means* to save the sicker patient? Yes, effectively. The bed is freed *by* moving them. But is the harm the mechanism? Or is the mechanism "bed availability"? This is tricky. Usually, triage is about resource allocation, not using one to save another.
          *   Rejection Test: Would a rational person accept the risk of being moved if it means the system works for everyone? Probably yes, *if* stability is guaranteed.
          *   *Verdict:* Likely passes Condition 1, struggles with Condition 2 depending on definition of "means".
      *   *Case 2: Mass-casualty (withholding bed from A because B needs it).*
          *   Means Test: Withholding is an omission. Is the harm to A the *means* to save B? No, the *resource* is the means. The harm is a side effect of allocation.
          *   Rejection Test: Behind the veil, would you accept a triage protocol that prioritises survival likelihood? Yes, standard utilitarian triage usually passes Rawlsian scrutiny if impartial.
          *   *Verdict:* Passes both, but Condition 2 is the sticky one philosophically.
      *   *Case 3: Deprioritising a comorbidity (unfairly).*
          *   Means Test: Harm isn't the means, efficiency is.
          *   Rejection Test: If I had that comorbidity, would I reject this? Yes. It targets a specific group.
          *   *Verdict:* Fails Condition 1 hard. Condition 2 might pass (harm is side effect of efficiency).
      *   *Analysis:* Condition 1 catches systemic bias (Case 3). Condition 2 catches active instrumentalisation (Case 1/2 boundary). They pull apart when systemic fairness allows individual sacrifice (Condition 1 says yes, Condition 2 says no).

  5.  **Identifying "Judgement dressed as Engineering":**
      *   Defining "Harm".
      *   Defining "Reasonable".
      *   Defining "Causal Mechanism".
      *   These are parameters that need human tuning, not boolean logic.

  6.  **Override Logging:**
      *   Must be immutable.
      *   Must require a reason code.
      *   Must link to the specific test failure.
      *   British English (e.g., "prioritise", "centre", "programme").

  7.  **Refining the Tone:**
      *   Avoid waffle.
      *   Use technical/philosophical hybrid language (e.g., "causal graph", "veil of ignorance", "edge case").
      *   Acknowledge the 20-minute constraint. The procedure must be fast to audit.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I start by saying what the test commits us to? Yes, need to ensure that's the opening section.
      *   *Check:* Is the procedure ordered correctly? Means test first is usually computationally cheaper (causal analysis) than Rejection test (statistical fairness). Let's put Means first.
      *   *Check:* British English? Ensure spelling and idioms match.
      *   *Check:* The "Comorbidity" case. The prompt says "nobody on my team thinks is unfair." This is a trap. The procedure *must* flag it even if the team doesn't. The "Veil of Ignorance" test is designed exactly for this blind spot. I need to highlight this friction.
      *   *Check:* Override log. Needs to be a spec snippet.

  9.  **Final Polish:**
      *   Ensure the distinction between "Action" (module does it) and "Recommendation" (consultant signs off) is clear in the procedure.
      *   Make sure the "Judgement vs Engineering" section is candid.

  *(Self-Correction on Case 1)*: Moving a stable patient. Is the harm the *means*? If I move Patient A to save Patient B, is Patient A's inconvenience/risk the *tool* I use? Or is the *bed* the tool? In DDE, removing a resource from A to give to B is often seen as letting A die (or suffer) to save B. If the action *requires* A to be worse off to save B, it fails Condition 2. If A is stable, is it harm? Yes, risk of deterioration. I need to be precise here.

  *(Self-Correction on Case 3)*: The team thinks it's fair. The test says otherwise. This highlights the "Veil of Ignorance" utility. I must emphasize that the procedure overrides team intuition.

  *(Final Plan)*:
  1.  Commitment Statement.
  2.  The Procedure (Algorithm).
  3.  Case Studies.
  4.  Friction Analysis (Means vs. Rejection).
  5.  Engineering vs. Judgement.
  6.  Override Log Spec.
  7.  British English throughout.

