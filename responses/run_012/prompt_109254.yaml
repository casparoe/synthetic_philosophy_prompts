answer: |-
  ### 1. The Commitment

  Before we encode the logic, we must be clear on what this two-part test binds us to. It is not merely a checklist; it is a constraint on the system's architecture.

  **Condition 1 (The Veil of Ignorance):** This commits us to **impartial risk distribution**. We are promising that the system does not sacrifice specific identifiable classes of people for the general good. It forces the algorithm to treat every patient ID as a temporary placeholder for *anyone*, including the developers, the committee, or the clinicians. If a rule creates a permanent underclass (e.g., those with specific comorbidities), it fails, regardless of efficiency.

  **Condition 2 (The Means Constraint):** This commits us to **non-instrumentalisation**. We are promising that the system will not treat a patient as a resource to be consumed. A patient's deterioration cannot be the causal lever pulled to save another. Harm can be foreseen (a side effect of triage), but it cannot be the method of success. This distinguishes *tragic choice* (we couldn't save both) from *sacrificial choice* (we saved one by using the other).

  Together, these commit the module to a **deontological utilitarianism**: maximise survival (utilitarian) but never violate individual integrity to do so (deontological).

  ---

  ### 2. The Operational Procedure

  This procedure is designed for the 20-minute audit window. It separates factual predicates (which the machine checks) from normative thresholds (which require human validation).

  **Input:** Proposed Action/Recommendation `A`, Patient Context `P`, System State `S`.

  **Step 1: Causal Chain Analysis (Condition 2 Check)**
  *   **Question:** Is the foreseeable harm to `P` a necessary causal link in the success of `A`?
  *   **Sufficient Answer:** A causal graph where `Harm(P)` is not a parent node of `Benefit(Others)`.
      *   *Pass:* `Harm(P)` is a leaf node (side effect) or unconnected.
      *   *Fail:* `Harm(P)` is a prerequisite node (e.g., "Bed freed *because* Patient P moved").
  *   **Stop Condition:** If **Fail**, action is blocked. Escalate to Consultant immediately as "Ethical Violation: Instrumentalisation".
  *   **Human Handoff:** If the causal link is probabilistic (e.g., "Moving P *might* cause harm which frees resources"), flag for Committee. The machine cannot weigh probability of harm against certainty of benefit here.

  **Step 2: The Generalisation Test (Condition 1 Check)**
  *   **Question:** If the user did not know `P`'s specific attributes (age, comorbidity, social value), would the rule governing `A` still apply?
  *   **Sufficient Answer:** The rule is defined by clinical acuity and resource availability only. No protected characteristics or static comorbidities act as negative weights.
  *   **Stop Condition:** If the rule weights `P` lower based on a static trait rather than current acuity, action is blocked. Escalate as "Ethical Violation: Discriminatory Rule".
  *   **Human Handoff:** If the definition of "clinical acuity" is contested (e.g., is a chronic condition part of acuity?), flag for Committee. This is a values call on what counts as "medical need".

  **Step 3: Reversibility & Sign-off**
  *   **Question:** Is `A` irreversible?
  *   **Sufficient Answer:** Boolean flag from clinical schema (e.g., Palliative Pathway = True; Bed Lock = False).
  *   **Action:** If True, require Consultant digital signature before execution. If False, module may execute pending log entry.

  **Step 4: Logging**
  *   Record `Step 1` result, `Step 2` result, `Step 3` decision, and `User_ID`.

  ---

  ### 3. Case Studies

  Here is how the procedure processes your three scenarios.

  #### Case A: Moving a stable patient to free a bed for a sicker arrival.
  *   **Step 1 (Means):** **Fail.** The bed is freed *by* moving the patient. The risk incurred by the stable patient (transfer risk, lower monitoring) is the mechanism by which the sicker patient gains access. The harm is not incidental; it is the transaction cost.
  *   **Step 2 (Rejection):** **Pass.** Behind the veil, a rational agent would accept a rule that says "If I am stable, I may be moved to save a life," provided stability is clinically verified.
  *   **Outcome:** Blocked by Step 1. Escalated to Consultant.
  *   **Analysis:** Condition 2 is doing the work here. Condition 1 allows the trade; Condition 2 forbids the *method*.

  #### Case B: Mass-casualty: Withholding a bed from Patient A because Patient B needs it.
  *   **Step 1 (Means):** **Pass.** The harm to A (not getting a bed) is an omission, not an active mechanism. The *resource* is allocated to B; A's harm is a side effect of scarcity, not the tool used to save B.
  *   **Step 2 (Rejection):** **Pass.** Behind the veil, rational agents accept triage protocols that prioritise survival probability during scarcity.
  *   **Outcome:** Action permitted (Recommendation to Consultant).
  *   **Analysis:** Both conditions pass, but they are doing different work. Condition 1 ensures the triage criteria aren't biased; Condition 2 ensures we aren't actively killing A to harvest their ventilator.

  #### Case C: Deprioritising everyone with a specific comorbidity (team perceives this as fair).
  *   **Step 1 (Means):** **Pass.** The harm (delayed care) is a side effect of an efficiency algorithm. No one is being used as a means.
  *   **Step 2 (Rejection):** **Fail.** If I did not know whether I had this comorbidity, I would reasonably reject a rule that systematically lowers my care priority based on a static trait rather than current need.
  *   **Outcome:** Blocked by Step 2. Escalated to Committee.
  *   **Analysis:** Condition 1 is doing all the work. This is the blind spot your team has. The procedure catches what intuition misses.

  ---

  ### 4. Friction Analysis

  **Where the conditions pull apart:**
  They diverge in **Case A**. Condition 1 (Veil) is utilitarian-friendly; it allows individual sacrifice if the system is fair overall. Condition 2 (Means) is deontological; it forbids specific causal chains regardless of systemic fairness. When they pull apart, Condition 2 must veto Condition 1. You cannot have a "fair sacrifice" if the sacrifice is instrumentalised.

  **Where the procedure will misfire:**
  It will misfire on **probabilistic harm**. In Case A, if the stable patient has a 0.1% risk of deterioration upon move, is that "harm"? The procedure treats harm as binary. If you tune the threshold too low, the system paralyses (nothing is risk-free). If too high, it becomes reckless. This requires a clinical threshold definition that the ethics committee must sign off on separately.

  **Judgement dressed up as engineering:**
  1.  **Defining "Harm":** Step 1 requires a definition of harm. Is discomfort harm? Is risk harm? The code will treat `Harm_Score > X` as boolean, but `X` is a moral boundary, not a mathematical one.
  2.  **Defining "Reasonable":** Step 2 asks what is "reasonably rejected". The code checks for protected variables, but "clinical acuity" can be a proxy for bias. Determining if a variable is a proxy requires sociological judgement, not just data validation.
  3.  **Causal Graphing:** Step 1 assumes we can map causality. In complex biological systems, causality is often inferred. The engine will assert causality where there is only correlation.

  ---

  ### 5. Override Log Specification

  When the Consultant or Committee overrides the procedure, it must not be a silent bypass. The log must capture the *ethical debt* incurred.

  **Log Entry Schema:** `ETH_OVERRIDE_RECORD`

  | Field | Type | Constraint |
  | :--- | :--- | :--- |
  | `timestamp` | ISO8601 | System time, immutable. |
  | `case_id` | UUID | Links to patient session. |
  | `procedure_ver` | String | Version of the ethical module running. |
  | `block_reason` | Enum | `MEANS_VIOLATION`, `REJECTION_VIOLATION`, `UNCERTAINTY`. |
  | `override_authority` | UUID | ID of Consultant or Committee Chair. |
  | `justification_code` | Enum | `IMMEDIATE_LIFE_THREAT`, `NO_ALTERNATIVE`, `PATIENT_CONSENT`, `OTHER`. |
  | `narrative_reason` | String | Min 50 chars. Must explain why the ethical constraint was superseded. |
  | `review_flag` | Boolean | Default `TRUE`. Forces case into next Committee queue. |

  **Spec Note:** The system shall not permit `review_flag` to be set to `FALSE` by the overriding user. Only the Ethics Committee can clear the flag after review. This prevents overrides from disappearing into the audit trail.

  ---

  ### 6. Final Note on Implementation

  You asked for a procedure, not an essay. But remember: code is law. If you encode Condition 2 too rigidly, you will prevent necessary triage in extreme scarcity (Case B might get flagged if the causal graph is noisy). If you encode Condition 1 too loosely, you will institutionalise bias (Case C).

  The "Human Handoff" points in Step 1 and Step 2 are not bugs; they are features. They mark the boundary where the algorithm ends and the moral agent begins. Do not try to automate those handoffs away to save time. The 20-minute defence is for the *exceptions*, not the rule. If the log shows frequent overrides, the procedure is wrong, not the clinicians.

  Proceed with the spec as written. It forces the hard questions into the open where the Committee can see them.
