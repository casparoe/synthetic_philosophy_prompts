          *   *Refinement:* Make sure to acknowledge that longtermists *know* this (Greaves, MacAskill), but popular discourse often muddles it.

      *   **Point 2: Hinge Weight (Fraction vs. Absolute).**
          *   *Assessment:* This is the crux. Defining pivotality as a *fraction* of contingent value is standard in decision theory (probability of affecting the outcome), but framing it as "hinge weight" is a nice linguistic hook.
          *   *Risk:* Is it tautological? If you define "hinge" as "where irreversible forks exist," then saying "hinge weight is high where irreversible forks exist" is circular.
          *   *Fix:* The value isn't in the definition, but in the *empirical claim* that we are currently near such forks (AI, bio, nukes). The argument needs to pivot from "what is a hinge" to "are we actually at one?"
