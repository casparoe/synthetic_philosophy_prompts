answer: |-
  Good evening. Welcome to the closing session of this year's literary festival.

  For three years now, I have had the privilege of standing here to guide our final conversation. For ten years before that, I wrote about science and ideas, chasing questions that rarely offered clean answers. I mention this because tonight's discussion belongs to that same tradition. It is a conversation about a book that many of you have read, and about a problem that none of us can easily solve.

  We are here to talk about a work that has entered our shared conversation with unusual force. It is a story of a life, written in the first person. It claims to recount events that happened, feelings that were felt, and consequences that were endured. Yet, as you know, the architecture of that claim has been questioned. We have learned that certain scenes are composites of different moments. We know a conversation reported as a direct transcript could not have occurred on the date assigned. We understand that names, chronology, and even a significant outcome have been altered from the historical record.

  In response, the author maintains the label on the spine: *Memoir*. A prominent critic, having examined the text line by line, argues the label should be *Novel*. The publisher's legal team, navigating the space between them, has proposed the phrase *A Work of Memory*.

  Why does this distinction matter? It matters because these words are not merely shelving instructions. They are promises. When we pick up a book classified one way, we bring a set of expectations about the relationship between the writer and the world. When we pick it up classified another way, we bring a different set. When the text seems to occupy the space between these classifications, our usual way of reading is disrupted. We are left asking not just what the story means, but what kind of object we are holding.

  This is where our uncertainty begins. And it is important to acknowledge the nature of that uncertainty without pretending to resolve it prematurely.

  When we ask, "Is this book a memoir?", we are asking a question that seems simple but proves resistant. On one hand, we might feel that the definition of a memoir is fixed, and that our difficulty lies only in our inability to see clearly enough to apply it. We might feel the answer is already determined, waiting somewhere beyond our current view. On the other hand, we might feel that the definitions themselves are not as rigid as we assume, and that in cases like this, the language we use simply does not provide a yes-or-no answer. We might feel that the boundary we are searching for does not exist in the way we expect.

  I mention these possibilities not to solve them, but to show that they lead us to the same place. Whether the answer is hidden from us or whether the question outpaces the categories we have built, the result for us as readers is identical. We find ourselves in a position where we cannot confidently assert the classification, yet we cannot dismiss the book's claim either. We are left with the text as it is, independent of the label we try to affix.

  Tonight, we will not vote on the label. We will not attempt to settle the legal or literary status of the work. To do so would be to pretend that ninety minutes of conversation can resolve a tension that has persisted for a decade of publishing and three years of my own moderation. Instead, we will explore what happens when a book lands in this borderland. We will ask what we owe the writer, what the writer owes us, and how we navigate a story when the map of genre no longer matches the terrain.

  To help us navigate, I am joined by three voices who represent the different angles of this prism. To my left is a celebrated memoirist, who knows the weight of the promise implicit in that title. To my right is the critic who has argued most forcefully that this text crosses the line into fiction. And in the center is a philosopher of language, who studies how we use words to describe the world, and what happens when those words meet the edges of their usefulness.

  They disagree. You will hear that disagreement. It is not my job to reconcile them, nor is it theirs to convince you of a single verdict. My hope is that by the end of our time, you will not feel you have a settled answer, but that you will understand more deeply why the question persists.

  The book is on the table. The labels are in dispute. The story remains. Let us begin.
