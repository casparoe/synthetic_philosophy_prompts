      *   No technical terms? (Checked).
      *   Compatible with both views? (Checked via disjunctions and focusing on uncertainty rather than ontology).
      *   Describe rather than classify? (Checked).
      *   No lecture? (Checked, kept conversational).

      *(Word Count Estimation)*: A 6-minute speech is roughly 800-900 words. I will aim for that range.

