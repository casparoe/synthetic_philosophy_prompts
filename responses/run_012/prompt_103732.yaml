      *Revised Killer Question:* "If $P(E)=1$ in your knowledge set, how does $P(E|H\&K)$ differ from $P(E|K)$? If $E$ is in $K$, both are 1. If $E$ is not in $K$, you've just shifted the temporal problem to the construction of $K$."

  7.  **Final Review against constraints:**
      *   Order by damage? Yes.
