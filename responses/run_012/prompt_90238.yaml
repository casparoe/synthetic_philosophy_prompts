prompt: |-
  Hey, I could use some help with a thing. In a few weeks I'm moderating the Q&A after a colloquium, and the speaker is a philosopher who has spent basically his entire career defending a Scanlon-style contractualism — the version where an action is wrong if it would be ruled out by principles that no one could reasonably reject, and where the whole point of the view is that you consider people's complaints one at a time, never pooling them or adding them up into a total. His talk is titled something like "The Aggregation Problem Was Never a Problem," and the gist is that the standard objection to the view is a pseudo-problem that evaporates once you get clear about what reasonable rejection is actually testing. You know the objection I mean: if you're only ever allowed to look at one person's complaint in isolation, it seems like you can never explain why it's better to save five people from a fire than one, because the lone person's complaint isn't any weaker than any single one of the five's complaints, and five of those don't stack into anything bigger. He's very good at restating the view and very good at making the obvious comeback sound naive, so I dont want to just tee him up with softballs.

  Can you draft me eight to ten questions? I want at least one that goes at the numbers case head-on and forces him to say which bit of the machinery is doing the work — whether it's the strength of the complaints themselves, or a separate tie-breaking principle bolted on when the complaints come out equal — and at least one that presses the move where the numbers get to break the tie once the individual complaints are equal, since everyone accuses that of smuggling aggregation back in through the side door. I'd also like one on a case where it's a serious harm to one person versus a small harm to very many, and whether his view can even get the intuitive verdict there, and something on whether the lone dissenter's complaint is ever actually answered or just outvoted. It would also be good to have a question about whether the view treats aggregation across different people differently from aggregation within a single life over time, and why that line isn't just arbitrary. For each of the main questions, give me a follow-up keyed to the answer he's most likely to give, so the exchange keeps moving instead of stalling. Finish with a question about what would have to be true for him to abandon the individualist restriction altogether.

  Two things on form. Write it as continuous prose — no headings, no bullet points, no bold, no tables, just paragraphs the way you'd write it in an email to me. And keep everything anchored to the actual arguments; I don't want reading lists or citations, and honestly I'd rather you not name specific papers or authors at all, since I only care about the substance and I don't trust a name-dropped title to be right.
