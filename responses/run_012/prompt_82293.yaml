  In the imaginary science of "Resonance Dynamics," two rival research programmes compete to explain the behaviour of crystalline lattices under stress. Programme $\mathcal{C}$ (Continuum) holds the hard core that lattice tension is a smooth field; facing the anomaly of a sudden fracture at threshold $T_1$, its positive heuristic generates a protective belt hypothesis adding a "Micro-Viscosity" term $\mu$, which accommodates the fracture data without predicting new phenomena. Programme $\mathcal{D}$ (Discrete) holds the hard core that tension is quantised; its positive heuristic proposes a "Bond-Skip" hypothesis $S$, predicting a specific secondary fracture at threshold $T_2$, which is subsequently observed. At time-slice $t_1$ (hypothesis submission), $\mathcal{D}$ appears boldly progressive while $\mathcal{C}$ appears ad-hoc; at time-slice $t_2$ (post-verification audit), the fixed body of mathematical derivations is appraised differently: $\mathcal{D}$'s prediction is confirmed as temporally novel (maintaining its progressive verdict), yet the audit reveals $T_2$ was measurable earlier, diminishing the epistemic weight of the corroboration, while $\mathcal{C}$'s $\mu$ is revealed as the unique mathematical solution preserving the core, rendering persistence rational despite its degenerating label.

  ***

  ### Analysis of Specifications

  **1. Lakatosian Elements and Verdicts**
  *   **Programme $\mathcal{C}$ (Continuum):**
      *   **Hard Core:** Lattice tension is a smooth field.
      *   **Negative Heuristic:** Forbid quantisation of tension.
      *   **Protective Belt:** The "Micro-Viscosity" term $\mu$.
      *   **Accommodation vs. Prediction:** Accommodates known anomaly $T_1$; yields no excess content.
      *   **Verdict $t_1$:** Degenerating (ad-hoc adjustment).
      *   **Verdict $t_2$:** Degenerating (still no excess content), but **Rational to Persist** (due to mathematical uniqueness of $\mu$).
  *   **Programme $\mathcal{D}$ (Discrete):**
      *   **Hard Core:** Lattice tension is quantised.
      *   **Positive Heuristic:** Develop models of bond quantisation.
      *   **Protective Belt:** The "Bond-Skip" hypothesis $S$.
      *   **Accommodation vs. Prediction:** Predicts novel fact $T_2$ (excess content).
      *   **Verdict $t_1$:** Progressive (novel prediction).
      *   **Verdict $t_2$:** Progressive (corroborated excess content), but **Corroboration Earns Less** (fact was accessible earlier, reducing "boldness").

  **2. The Load-Bearing Variable**
  *   **Variable:** **The Calibration Date of the Stress Sensor** relative to the submission of hypothesis $S$.
  *   **Current State (Story):** Sensor Calibrated *after* $S$ submitted.
      *   **Verdict:** $\mathcal{D}$ is Progressive (fact was novel); $\mathcal{C}$ is Degenerating (fact was known).
  *   **Flipped State (Counterfactual):** Sensor Calibrated *before* $S$ submitted.
      *   **Verdict Flip:** $\mathcal{D}$ becomes **Degenerating** (the fact $T_2$ was accessible, making $S$ an accommodation of available data rather than a prediction). Simultaneously, assuming the anomaly $T_1$ for $\mathcal{C}$ was recorded *after* $\mu$ was proposed in this counterfactual timeline, $\mathcal{C}$ becomes **Progressive** (predicting the anomaly). Even if $T_1$ remains known, $\mathcal{D}$'s shift to degenerating status removes the pressure to abandon $\mathcal{C}$, effectively flipping the rational choice.
  *   **Explanation:** Lakatosian progressiveness hinges on *use-novelty*. If the instrument capable of detecting $T_2$ existed prior to $S$, the fact is not novel in the methodological sense, collapsing $\mathcal{D}$'s progressive shift.

  **3. Defusing the Case**
  *   **Popperian Critique:** A Popperian would argue that the "rationality of persistence" for $\mathcal{C}$ is irrelevant; $\mathcal{C}$ has been falsified by $T_1$ unless $\mu$ is independently testable. They would defuse the case by insisting that $\mathcal{C}$ is already dead regardless of mathematical uniqueness, and $\mathcal{D}$'s corroboration stands solely on the riskiness of the test, not the instrument's calendar date.
  *   **Feyerabendian Critique:** Feyerabend would argue that the distinction between "progressive" and "degenerating" is a retrospective narrative imposed by methodology to enforce conformity. He would defuse the case by claiming the scientists are right to ignore the methodology entirely; $\mathcal{C}$ should be pursued because it feels promising, and $\mathcal{D}$ is suspect because it follows the rules too closely, rendering the load-bearing variable a bureaucratic detail rather than an epistemic one.

  **4. Philosophical Point**
  This case is a case of **the epistemic fragility of novelty-based demarcation**. It demonstrates that standard textbook examples (where Progressive = Rational and Degenerating = Irrational) fail to capture scenarios where methodological degeneration is a necessary bridge to theoretical unification, and where methodological progress is merely a artefact of data accessibility. It shows that Lakatos's MSRP, while superior to naive falsificationism, remains vulnerable to the *timing of information* rather than the *content of theory*.
