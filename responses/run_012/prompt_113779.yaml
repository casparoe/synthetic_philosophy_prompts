prompt: |-
  Me and my friend Dan got into a stupidly long arguement last night about many-worlds and probability — like, does the theory even make sense of saying this outcome is more likely than that one, or do Everettians just help themselves to the Born rule and hope nobody looks too hard. I've been circling this for a while (physics MSc, now a phil grad student, so I can follow the math but I'm definately not a foundations specialist) and I've got about a year of fairly free time to actually write something. The problem is I can't tell which of the open questions here is the one worth spending that year on.

  So: given one person, one year, which open problems in the Everettian probability / Born rule mess matter most, and in what order? The candidates I can see floating around are the decision-theoretic derivation (the Deutsch/Wallace line, where probability falls out of betting preferences plus rationality axioms), the symmetry-based derivation (Zurek-style envariance, where it falls out of invariance of the entangled state under swapping), the self-locating-uncertainty line (after branching you're unsure which branch you're in and the Born rule is the correct credence for that uncertainty), plain branch-counting with some physical measure bolted on, and the nuclear option of saying the theory doesn't need probabilities in the first place and everyone should stop asking.

  Also, is any of this even specific to Everett? Bohmians also deny collapse and get probabilities from a distribution over initial conditions (quantum equilibrium), so is the Everettian in a genuinely worse spot, or just a differently-named one?

  And here's the thing Dan kept hammering: he says all of this is just the cosmological measure problem in a costume — that asking how likely I am to be in this branch is the same kind of question as asking how likely I am to be in this universe, so it's really the anthropic / reference-class problem and there's nothing new under the sun. I honestly can't tell if that's the deepest observation anyone's made about it or a category error, and I want your answer to actually take a side on it.

  What I want is a defended ranking, not a survey. For each candidate: why it's upstream of the others (does settling the decision-theoretic version settle the self-locating version, or the reverse?), how tractable it is in a year with philosophical tools rather than a career's worth of functional analysis, whether it's genuinely neglected or just hard, and what argument or result in the next year or two should move it up or down the list. Then tell me which of these are secretly the same question, which are verbal disputes I should steer clear of, and which one you'd bet my year on. No reading lists or citations — I want your reasoning about what deserves the time, not a bibliography.
