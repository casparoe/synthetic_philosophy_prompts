answer: |-
  You must reject step (3) because it implicitly assumes a uniform probability distribution over all possible positive amounts of money, which is mathematically impossible.

  Step (3) looks correct because it relies on the Principle of Indifference, which suggests that if you have no reason to prefer one outcome over another, you should assign them equal probability. This works perfectly for your coin example because a coin has exactly two physically defined states, Heads and Tails, created by the flipping mechanism. However, the envelope problem involves monetary amounts that could theoretically be any positive number, and you cannot assign an equal probability to every possible number from zero to infinity because those probabilities would never sum to 1.

  When you condition on the value $x$, the probability that the other envelope contains $2x$ versus $x/2$ depends entirely on how likely your dad was to put those specific amounts in the envelopes in the first place. If there is any upper limit to how much money your dad has, seeing a very large $x$ makes it certain that you hold the larger envelope, breaking the 50/50 assumption. To make the math work, you must assume a "prior" distribution of possible money amounts, and for any valid prior distribution, the expected gain from swapping averages out to zero.

  The cost of giving up (3) is admitting that ignorance alone is not enough to generate probabilities; you must acknowledge that you lack information about the range of possible values, not just which envelope you hold. You lose the ability to treat all unknown quantities as equally likely, forcing you to accept that without knowing the dad's budget or selection method, you cannot calculate an expected value at all.
