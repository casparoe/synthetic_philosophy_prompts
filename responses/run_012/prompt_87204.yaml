      *   *Check:* Did I flag extrapolation? I need to be explicit. "Here Kant is silent..." "We must extend the principle..."
      *   *Check:* Is the pain-free animal section nuanced enough? It's not just about pain; it's about the *appearance* of pain. Kant cares about our reaction to the appearance.
      *   *Check:* British English. (e.g., "labour," "defence," "programme").

  8.  **Final Polish:** Ensure the transition between the two cases is smooth and the conclusion ties back to the reading group context. (Proceed to generate output).

