  *(Self-Correction Note on "Cultivated Meat"):* Is there a duty of gratitude? Kant mentions we shouldn't kick a horse that has served us long. Cultivated meat doesn't involve a serving animal. So gratitude isn't triggered. This strengthens the permissibility.

  *(Final Plan):*
