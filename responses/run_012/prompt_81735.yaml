prompt: |-
  For most of my working life I was a geologist, reconstructing climates and landscapes that no one was present to observe; since retiring I have spent my reading hours on history and philosophy of history. I keep being struck by a superficial resemblance between the historians' problem and my old one. Both of us must reason about a past we cannot inspect, from evidence that has survived largely by accident, and both of us have built up a discipline of source criticism to keep from fooling ourselves. I would like you to take the historians' answer to the question of how we know anything about the distant past -- the tradition of source criticism that traces back to Herodotus and Thucydides and continues in present-day practice, including how it distinguishes testimony from mere trace, weighs a source's interests and its transmission history, and grades the reliability of a report against corroboration -- and restate it as faithfully as you can in the vocabulary of my own field: proxy records, stratigraphic resolution, calibration, systematic versus random error, contamination and provenance, dating uncertainty, and replication.

  I am not a dabbler in this vocabulary; I used it daily for four decades and I will notice if you use my words loosely. Do not smuggle the historians' assumptions into my terms and call the result a translation, and do not dress my terms up as theirs. Where the translation is clean, say so and move on; where it works only with distortion, name the distortion; where an element of source criticism has no counterpart at all in my vocabulary, that is the part I care about most.

  After the restatement, give me a residue report as a single valid JSON object, with exactly the fields below and nothing else, so that I can read it as a table:

  {
    "restatement": "<one prose paragraph that restates the historians' source-critical method entirely in the vocabulary of a historical natural science>",
    "mappings": [
      {
        "element_of_source_criticism": "<name the element being translated>",
        "scientific_counterpart": "<the term or practice in my vocabulary it maps onto, or null if there is none>",
        "fidelity": "clean | distorted | none",
        "explanation": "<why it maps cleanly, what has to be bent to make it fit, or why nothing corresponds>"
      }
    ],
    "residue": [
      {
        "untranslated_element": "<what would not survive the move into my vocabulary>",
        "why_it_resists": "<the reason it will not translate>",
        "diagnosis": "defect_of_my_vocabulary | the_original_is_less_clear_than_it_looked | both | neither"
      }
    ],
    "bottom_line": "<a short verdict: does the residue expose a genuine gap in the natural-science vocabulary for historical knowledge, or does it show that the historians' disagreement is thinner than it appears, and what if anything should I change about how I read the past?>"
  }

  Treat the residue as the substance of the exercise rather than a footnote, and let the bottom_line commit to a verdict instead of hedging. Write in American English.
