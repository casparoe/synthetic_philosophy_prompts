answer: |-
  You have hit the nail on the head regarding the verbal disagreement, but I suspect there is a deeper empirical blockage preventing either side from admitting it. Your hunch that this is two different questions layered on top of one another is correct, but the reason nobody budges is that answering the first question doesn't satisfy the intuitions driving the second.

  Here is the diagnosis of the stalemate, why the Homeostatic Property Cluster (HPC) idea stalled, and what actual progress would look like.

  ### 1. The Two Questions (The Verbal Disagreement)

  You are right that the Realists and the Sceptics are answering different questions.

  *   **The Realist Question:** "Is there a statistical regularity in human political behaviour?"
      *   *Answer:* Yes. Overwhelmingly. If you know someone's view on abortion, you can predict their view on tax rates better than chance. If you know their score on 'Openness to Experience', you can predict their voting intention. There is a correlation structure. It is a robust empirical fact that opinions cluster.
  *   **The Sceptic Question:** "Is 'Left/Right' a natural kind with a stable essence, or is it a historical accident?"
      *   *Answer:* It looks like an accident. The specific issues bundled together change (e.g., free trade was once a left-wing cause; now it is often right-wing). The binding agent appears to be coalition maintenance and tribal signalling, not a unified philosophical core.

  The frustration arises because the Realists hear the Sceptics denying the *statistics* (which is absurd), and the Sceptics hear the Realists reifying a *historical contingency* into a law of nature (which is dubious).

  However, simply pointing this out rarely ends the fight. Why? Because the Realists usually care about *prediction*, while the Sceptics care about *explanation*. A map is useful even if the territory doesn't have a line drawn on it, but the Sceptics want to know why the line is drawn *there* and not *here*.

  ### 2. The Hidden Empirical Question: Stability vs. Contingency

  You asked if there is a hidden empirical question doing the heavy lifting. There is. It is not "one axis or several?" (Political science has largely settled that legislatures operate on one dominant dimension, while psychology suggests two or more).

  The real empirical question is: **What is the half-life of the cluster?**

  If the Left/Right distinction is a "joint in nature," the correlation between issues should be stable across time and culture because they stem from a fixed underlying trait (like a personality dimension or a biological imperative).

  If it is a "bin we stuff people into," the correlation should be fragile, shifting whenever the political marketplace realigns.

  The data here is mixed, which fuels the fire.
  *   **For the Realists:** In the US, the alignment has been remarkably stable since the 1980s. The 'culture war' bundle (guns, God, taxes, immigration) moves together.
  *   **For the Sceptics:** Look further back or wider. In the 19th century, classical liberals were the 'left' on economics but 'right' on state power. In some European parties, you see working-class social conservatism (right on culture, left on economics). In the Global South, the axes often rotate entirely based on ethnic or religious cleavages rather than economic ones.

  The hidden empirical dispute is about **portability**. The Realists treat the current Western alignment as the 'true' signal. The Sceptics treat it as noise specific to this era and geography. Until we agree on whether we are studying *human political psychology* (universal) or *Western party systems* (contingent), we will talk past each other.

  ### 3. Why the 'Homeostatic Property Cluster' Fizzled

  The suggestion to treat Left/Right as a Homeostatic Property Cluster (HPC) was indeed the sharpest move. In biology, a 'species' is an HPC: a bunch of traits that hang together not because of a single essence, but because of underlying causal mechanisms (genes, environment) that keep them clustered.

  It fizzled because identifying the **homeostatic mechanism** is incredibly difficult.

  For 'tiger' to be an HPC, the mechanism is genetics and reproduction. For 'Left/Right' to be an HPC, what is the mechanism?
  *   **Is it Psychological?** (e.g., Threat sensitivity causes both immigration scepticism and support for police). This favours the Realists.
  *   **Is it Sociological?** (e.g., Elites signal positions to maintain coalition cohesion, and voters follow to signal loyalty). This favours the Sceptics.

  If the mechanism is the latter, then Left/Right is an HPC, but the 'kind' it belongs to is *Tribal Coalition*, not *Ideology*.

  The thread likely died because nobody could agree on the glue. If the glue is "shared enemy," then the category is real but empty of content. If the glue is "shared cognitive style," the category is real and deep. Without agreeing on the causal mechanism, calling it an HPC is just a fancy way of saying "it's a cluster," which brings us back to square one.

  ### 4. What Would Count as Progress?

  To move past this, we need to stop asking "Is it real?" (which invites metaphysical posturing) and start asking "Real for what purpose?"

  Progress would look like three specific distinctions:

  **A. Distinguish Predictive Utility from Ontological Depth**
  We should admit that Left/Right is a *high-compression algorithm*. It is not a fundamental truth of the universe, but it is a highly efficient tool for predicting voting behaviour in a specific context.
  *   *Progress:* Admitting that a category can be "real enough to bet on" without being "a joint in nature." Money is a social construct, but you can't say it isn't real when you pay taxes. Left/Right is similar: it is a *focal point* for coordination, not necessarily a psychological constant.

  **B. Identify the Binding Mechanism (The Glue)**
  We need datasets that track *why* opinions move together.
  *   *Progress:* Longitudinal studies that show whether people change their views on Issue B because they changed their views on Issue A (ideological consistency), or because their 'team' changed its stance on Issue B (tribal loyalty). If it's mostly the latter, the Sceptics win on the 'essence' question, even if the Realists win on the 'prediction' question.

  **C. Accept Multi-Dimensionality as the Default**
  The insistence on a single Left/Right line is the biggest source of error.
  *   *Progress:* Moving to a standard lexicon that separates *Economic* (Redistribution vs. Market), *Social* (Liberty vs. Authority), and *Identity* (Nationalist vs. Globalist) axes. If we did this, the "Is it real?" fight would vanish. We would see that the 'Left' is often a coalition of Social Liberals and Economic Redistributors, which are empirically distinct traits that happen to be allied in 2024.

  ### Summary

  Your intuition is correct: it is a verbal disagreement layered over a empirical one.
  *   The **Realists** are right that there is a strong correlation structure *here and now*.
  *   The **Sceptics** are right that this structure is historically contingent and held together by tribal mechanics rather than philosophical consistency.

  The "Homeostatic Property Cluster" model is the right framework, but it forces us to admit that the 'homeostasis' is likely maintained by social pressure and coalition signalling, not by a deep ideological essence.

  **The Verdict:** Left/Right is not a "joint in nature" in the way that 'mammal' or 'metal' is. It is a "joint in the political marketplace." It is a stable equilibrium of coalition-building. It is real enough that you cannot ignore it, but fake enough that you should not reify it. Progress comes from stopping the search for a single essence and mapping the specific causal mechanisms (psychological, social, economic) that keep the cluster together in a given time and place.
