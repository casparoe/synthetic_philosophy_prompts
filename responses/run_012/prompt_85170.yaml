  **Total Mark: 15.5 / 20**

  **Part (a): 6 / 6**
  *   **Correct:** Your computation of the ideal point $b=(7,6)$ is correct. Your identification of the Pareto frontier segments and their equations is correct. Your calculation of the intersection with the Kalai–Smorodinsky ray is mathematically accurate, and you correctly verified which segment contains the solution.
  *   **Comments:** Full marks. The work is clear and the result is correct.

  **Part (b): 5 / 5**
  *   **Correct:** Your computation of the Nash solution $(3.5, 3.5)$ is correct. You correctly identified that the maximum on the first segment occurs at the boundary and the maximum on the second segment occurs in the interior.
  *   **Correct:** Your explanation for the difference between the solutions is conceptually sound. You correctly identify that Nash depends on the local curvature (tangency) while Kalai–Smorodinsky depends on the global ideal point ratios.
  *   **Comments:** Full marks.

  **Part (c): 4.5 / 6**
  *   **Correct:** Your assessment of **Pareto Optimality**, **Symmetry**, and **Scale Invariance** is correct for both solutions. Your justifications for these three axioms are sufficient.
  *   **Incorrect:** Your claim that the Kalai–Smorodinsky solution satisfies **Independence of Irrelevant Alternatives (IIA)** is false.
      *   *Specific Sentence:* "IIA: satisfied by the Kalai–Smorodinsky solution."
      *   *Why:* The Kalai–Smorodinsky solution violates IIA. It is characterised by Monotonicity, which replaces IIA in the Nash axioms.
      *   *Specific Sentence:* "rotating the ray downward cannot carry it beyond a point that is still in the feasible set, so the old solution point remains the point at which the new ray leaves S′..."
      *   *Why:* This reasoning is substantively wrong. If the feasible set $S$ is reduced to $S'$ (where the original solution is still feasible), the ideal point $b$ typically changes. This changes the slope of the ray from $d$. A ray with a different slope will intersect the Pareto frontier at a *different* point. The original solution point does not remain on the new ray.
      *   *Correct Counterexample:* Let $S = \text{conv}\{(0,0), (2,0), (0,2)\}$. The KS solution is $(1,1)$. Let $S' = \text{conv}\{(0,0), (2,0), (1,1), (0, 1.5)\}$. $S' \subset S$ and $(1,1) \in S'$. The ideal point of $S'$ is $(2, 1.5)$. The KS ray for $S'$ has slope $0.75$. The intersection with the frontier segment connecting $(1,1)$ and $(2,0)$ (equation $u_2 = 2 - u_1$) is at $u_1 = 8/7 \approx 1.14$. The solution changes from $(1,1)$ to $(8/7, 6/7)$, violating IIA.
  *   **Comments:** You lost 1.5 marks for the incorrect classification and justification of IIA. The conclusion that "the two solutions cannot be separated by Nash's four axioms" is therefore also incorrect; they are separated precisely by IIA.

  **Part (d): 0 / 3**
  *   **Incorrect:** Your premise that "Both solutions are invariant under positive affine transformations... so moving the disagreement point... shifts both solution points by the same vector" is a category error.
      *   *Why:* Scale Invariance means that if you transform the *utility representation* (e.g., $u' = \alpha u + \beta$), the solution transforms accordingly. It does not imply that changing the disagreement point $d$ while keeping the feasible set $S$ fixed results in a simple translation of the solution point. Changing $d$ changes the feasible *gains*, which alters the solution non-linearly.
  *   **Incorrect:** Consequently, your computed solution points are wrong.
      *   *Nash:* The Nash solution coordinates actually remain $(3.5, 3.5)$. Maximising $(u_1-1)(u_2-1)$ subject to $u_1+u_2=7$ yields symmetric gains of $2.5$, so utilities are $1+2.5=3.5$. Your answer $(4.5, 4.5)$ is incorrect.
      *   *Kalai–Smorodinsky:* The solution does change, but not by translation. The new ideal gains are $(7-1, 6-1) = (6,5)$. The ray from $d=(1,1)$ has slope $5/6$. Intersecting $u_2 - 1 = \frac{5}{6}(u_1 - 1)$ with $u_2 = 7 - u_1$ yields $u_1 = 41/11 \approx 3.73$, not $4.77$.
  *   **Comments:** While you correctly identified that the KS solution changes, the reasoning is fundamentally flawed and the numerical results for both solutions are incorrect. No marks are awarded for this part.
