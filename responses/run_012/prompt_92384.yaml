answer: |-
  # The Epistemology of Markets Decision Tree

  **Start:** You accept the **No-Trade Theorem** (Milgrom-Stokey/Aumann) as logically valid *conditional on its premises*: if agents share a common prior and it is common knowledge that they are rational, they cannot agree to a bet purely on informational grounds.

  ### Node 1: The Common Prior Assumption (CPA)
  **Question:** Is the assumption that rational agents share a common prior a harmless idealization for modeling, or is it quietly where all the action is?
  *   **Harmless Idealization:** (Go to Node 2)
  *   **Where the Action Is:** (Go to Node 6)

  ### Node 2: Information Pooling
  **Question:** Does the theorem just assume away the interesting case (i.e., everyone's information is effectively already pooled)?
  *   **Yes, it assumes pooling:** (Go to Node 3)
  *   **No, it models dynamic aggregation:** (Go to Node 4)

  ### Node 3: The Grossman-Stiglitz Paradox
  **Question:** How do you handle the paradox that a perfectly efficient market gives nobody any reason to go gather the info in the first place?
  *   **Noise traders subsidize the informed:** (Go to Node 4)
  *   **Perfect efficiency is impossible:** (Leaf A)

  ### Node 4: Price Ontology
  **Question:** Is a market price fundamentally a probability estimate of truth, or a stake-weighted belief with a risk/capital adjustment baked in?
  *   **Probability Estimate:** (Leaf B)
  *   **Stake-Weighted Belief:** (Go to Node 5)

  ### Node 5: Source of Weighting
  **Question:** If prices are stake-weighted, is the weighting determined by risk tolerance (utility functions) or capital constraints (wealth distribution)?
  *   **Risk Tolerance:** (Leaf B - *Merged*)
  *   **Capital Constraints:** (Leaf C)

  ### Node 6: Source of Divergence
  **Question:** Since priors are not common, is the divergence primarily due to cognitive limitations or dispersed structural knowledge?
  *   **Cognitive Limitations:** (Leaf D)
  *   **Dispersed Structural Knowledge:** (Go to Node 7)

  ### Node 7: Price Function
  **Question:** In this dispersed environment, do prices track underlying truth or merely coordinate action?
  *   **Track Truth:** (Leaf E)
  *   **Coordinate Action:** (Go to Node 8)

  ### Node 8: Coordination Basis
  **Question:** If prices coordinate action, is the coordination mechanism driven by capital efficiency or political power structures?
  *   **Capital Efficiency:** (Leaf C - *Merged*)
  *   **Political Power:** (Leaf F)

  ---

  ### The Leaves (Positions)

  *   **Leaf A:** The **"efficiency and the incentive to acquire info are in tension"** view. (Markets are *mostly* efficient, but the GS paradox prevents perfect efficiency; info costs create a necessary floor for inefficiency.)
  *   **Leaf B:** **Efficient-markets/rational-expectations**. (Prices are the best available probability estimates; deviations are noise or risk premiums.)
  *   **Leaf C:** **"Prices are coordination devices, not credences"**. (Prices clear markets and allocate capital, but interpreting them as "probabilities" is a category error; they reflect who has skin in the game, not just what is known.)
  *   **Leaf D:** **Behavioral "no-trade assumes away the phenomenon"** camp. (Real humans aren't Bayesian updaters with common priors; the theorem fails because the psychology is wrong.)
  *   **Leaf E:** **Hayekian dispersed-knowledge**. (Prices communicate local knowledge that cannot be pooled centrally; they track truth via a discovery process, not static aggregation.)
  *   **Leaf F:** **Political-economy "markets track power not truth"**. (Prices reflect the relative power of capital holders to shape outcomes, not an external reality.)

  ---

  ### Analysis of the Tree

  #### Indistinguishable Leaves
  **Leaf B (EMH) and the "Risk Tolerance" branch of Node 5:**
  The tree technically separates "Probability" from "Stake-Weighted by Risk," but in practice, the **Efficient-Markets/Rational-Expectations** camp absorbs the risk-adjustment view. A rational expectations equilibrium *is* a stake-weighted belief where the weights are determined by risk aversion. The tree forces a distinction to clarify ontology, but empirically, these two paths lead to the same mathematical modeling and policy prescriptions. You cannot separate a "pure probability" EMH proponent from a "risk-adjusted" EMH proponent in a live debate; they will both tell you you can't beat the market.

  **Leaf C (Coordination) and Leaf E (Hayekian):**
  There is significant overlap here. Both views reject the idea that price = calibrated probability. However, the **Hayekian** view (Leaf E) retains a realist epistemology (prices *discover* truth through competition), whereas the **Coordination** view (Leaf C) often leans instrumentalist (prices *create* equilibrium regardless of truth). The tree separates them via Node 7 (Truth vs. Coordinate), but in the wild, Hayekians often sound like Coordination theorists when criticizing technocrats who treat prices as data points rather than signals.

  #### Empty Branches (and Why)

  **1. CPA = Harmless + Divergence = Cognitive (Node 1 $\rightarrow$ Node 6)**
  *   **Why Empty:** Incoherent. If you believe the Common Prior Assumption is a harmless idealization (Node 1), you are committing to the view that rational agents *would* converge given the same info. You cannot consistently hold that CPA is harmless *and* that prior divergence is caused by fundamental cognitive bugs (Node 6). The latter implies the CPA is false because rationality is bounded, which pushes you into the Behavioral camp (Leaf D) which requires taking the "CPA is Where the Action Is" branch.

  **2. CPA = Harmless + Price = Coordinate + Basis = Power (Node 1 $\rightarrow$ Node 4 $\rightarrow$ Node 5 $\rightarrow$ Node 8)**
  *   **Why Empty:** Unattractive/Incoherent. If you accept CPA (agents are rational Bayesians), you generally cannot argue that prices track *political power* rather than truth/capital. In a common-prior rationalist framework, power dynamics are either modeled as capital constraints (Leaf C) or exogenous shocks. To claim prices track *power* (Leaf F) usually requires rejecting the rationality or common-prior premise entirely, as it implies the market is processing non-epistemic variables that rational agents should arbitrage away. There is no "Rationalist Power-Market" camp; power dynamics imply the priors aren't common (one group knows the rules are rigged).

  **3. CPA = Action + Price = Probability (Node 6 $\rightarrow$ Node 7)**
  *   **Why Empty:** Unexplored/Unstable. If priors are heterogeneous due to dispersed knowledge (Hayekian start), it is difficult to maintain that prices are *probabilities*. If I have local knowledge you don't, and we can't pool it (by definition of the Hayekian view), the price cannot be a calibrated probability for either of us; it is a signal to act. A position claiming "Priors are fundamentally different, but prices are still perfect probabilities" lacks a mechanism. How do different priors aggregate into a single true probability without becoming common? This branch collapses into either Hayekian (prices signal action) or EMH (priors were actually common enough).
