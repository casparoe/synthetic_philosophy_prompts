answer: |-
  You have identified a pervasive and consequential reasoning pattern that sits at the boundary of statistics, physics, and epistemology. You are correct that it is not quite the Principle of Indifference, nor is it simply a computational shortcut. It has a distinct epistemic status: it is a **structural null hypothesis**.

  There is no single, universally canonical proper noun for this move (like "Occam's Razor") that spans all the fields you mention. However, it is well-discussed under different names in different disciplines. To pin it down, we need to distinguish between the *practice*, the *justification*, and the *failure mode*.

  Here is the breakdown of the established literature, the precise distinctions you asked for, and a proposal for how to name it if you wish to treat it as a unified concept.

  ### 1. The Established Terminology

  Depending on the field, this move goes by different names, each capturing a different facet of the epistemic status you described.

  **A. In Philosophy and Bayesian Epistemology: "Epistemic Independence"**
  This is the closest fit for the *status* of the assumption. Philosophers (notably Isaac Levi and Richard Jeffrey) distinguish between **ontic independence** (the events are causally unrelated in the world) and **epistemic independence** (my belief state regarding one does not constrain my belief state regarding the other).
  *   **The Move:** When you lack information about the relation between $A$ and $B$, you treat them as epistemically independent.
  *   **The Status:** It is not a claim about the world (ontic), but a rule for managing ignorance (epistemic). It is a constraint on the *agent*, not the *system*.
  *   **Why it fits:** It matches your friend's claim: "It is not that I think they are independent." She is describing her state of information, not the astrophysical reality.

  **B. In Information Theory and Statistics: "The Maximum Entropy Principle"**
  This provides the *normative justification* your friend alluded to ("the default thing to do").
  *   **The Logic:** If you know the marginal probabilities $P(A)$ and $P(B)$ but have no information about the joint distribution $P(A, B)$, the probability distribution that maximizes entropy (i.e., assumes the least additional information) is the one where $P(A, B) = P(A)P(B)$.
  *   **The Distinction:** MaxEnt is the *reason* the default is justified. However, practitioners rarely cite Jaynes or entropy; they just use the product rule. So while MaxEnt is the *theory*, the *move* is often just called the **Independence Assumption**.

  **C. In Physics (Your Friend's Field): "Mean Field Theory" or "Ignoring Higher-Order Correlations"**
  In statistical physics, this is standard procedure. One approximates a many-body system by treating each particle as moving in an average field created by the others, effectively ignoring specific pairwise correlations.
  *   **The Status:** It is explicitly an approximation known to be false at critical points (phase transitions), but useful elsewhere.
  *   **The Error:** When correlations become long-range (near a phase transition), the Mean Field approximation fails catastrophically. This mirrors your observation about catastrophes and rare events.

  **D. In Risk Assessment and Engineering: "The Independence Assumption" (vs. Common Cause Failure)**
  In Probabilistic Risk Assessment (PRA) and Fault Tree Analysis, this is the standard starting point.
  *   **The Critique:** The literature here is where the danger is most explicitly cataloged. The violation of this assumption is called **Common Cause Failure (CCF)** or **Dependent Failure**.
  *   **The Consequence:** As you noted, assuming independence in risk chains underestimates the probability of joint failure by orders of magnitude. This is why nuclear and aerospace engineering have specific models (like the Beta-Factor model) to correct for this default.

  ### 2. Distinguishing from Neighbors

  You asked for precise boundaries between this move and its neighbors.

  | Concept | What it Assumes | Domain | Epistemic Status |
  | :--- | :--- | :--- | :--- |
  | **Principle of Indifference** | $P(A) = P(B)$ (Equal probability) | Outcomes | "I have no reason to prefer one value over another." |
  | **Your Observed Move** | $P(A, B) = P(A)P(B)$ (Uncorrelated structure) | **Relations** | "I have no reason to prefer one *dependency structure* over another." |
  | **Maximum Entropy** | Maximize $H(P)$ subject to constraints | Distributions | Normative rule: "Do not assume information you do not have." |
  | **Ontic Independence** | $A$ does not cause $B$ | Causality | Empirical claim: "There is no mechanism linking them." |

  **The Crucial Difference:** The Principle of Indifference assigns values to *states* (e.g., the die is fair). Your observed move assigns structure to *relations* (e.g., the die rolls are uncorrelated). You can have a biased die (violating Indifference) where rolls are still independent (satisfying your move). Conversely, you can have a fair die where rolls are correlated (violating your move).

  ### 3. Proposed Terminology: "The Independence Default"

  Since no single term captures the *methodological*, *epistemic*, and *pragmatic* nuances across all these fields, if you wish to coin a term for your own work, I suggest **"The Independence Default"** or **"Methodological Independence."**

  **Definition:**
  > **The Independence Default:** A methodological postulate wherein a reasoner models a joint distribution as the product of its marginals ($P(A,B) \approx P(A)P(B)$) solely due to a lack of specific information regarding their dependence, treating independence as the null hypothesis of structure.

  **Boundaries and Scope:**
  1.  **It is Falsifiable but Not Believed:** Unlike a scientific hypothesis, it is not held as true. It is held as *provisionally necessary*. It is discarded immediately upon evidence of correlation.
  2.  **It is Asymmetric in Risk:** As you noted, it is not a "harmless formality." In additive systems (Central Limit Theorem domains), errors might cancel. In multiplicative systems (rare events, catastrophes, financial compounding), ignoring positive correlation systematically **underestimates tail risk**.
  3.  **It Applies to Ignorance, Not Randomness:** It is not a claim that the universe is random; it is a claim that the *modeler's map* lacks contour lines.

  ### 4. Behavior at the Edges

  You asked how it behaves in edge cases. This is where the literature on **Tail Dependence** and **Criticality** becomes relevant.

  **Case 1: Known Dependence, Useful Anyway (Mean Field)**
  In physics, we often know particles interact (dependence), but we use Mean Field (independence) anyway.
  *   *Why:* The correlations are "short-range" and average out over large $N$.
  *   *Boundary:* This works in "high temperature" (disordered) phases. It fails at "critical points" (phase transitions) where correlations become infinite in range.
  *   *Lesson:* The Independence Default is safe when the system is far from criticality.

  **Case 2: Cross-Level Description (Emergence)**
  You mentioned invoking it "across levels of description."
  *   *Example:* Assuming economic indicators are independent because the underlying human behaviors are too complex to model.
  *   *Risk:* This is where **Emergent Correlation** happens. Micro-level independence can macro-level dependence (e.g., bank runs). Individual banks act independently, but the *system* couples them.
  *   *Lesson:* The Independence Default is most dangerous when applied to complex adaptive systems where hidden coupling mechanisms exist (e.g., a shared regulatory framework, a common supply chain).

  **Case 3: The "Orders of Magnitude" Error**
  Why does the error explode?
  *   If you multiply $N$ probabilities of size $p$, the result is $p^N$.
  *   If there is a correlation coefficient $\rho$, the joint probability scales differently. In extreme value theory, if variables are **asymptotically dependent**, the probability of joint extreme events does not vanish as fast as the product of marginals.
  *   *Result:* An event calculated as 1-in-a-billion (independent) might actually be 1-in-a-thousand (correlated). This is the **"Black Swan"** mechanism described by Taleb, though he focuses more on distribution thickness than correlation structure per se.

  ### Summary

  Your friend is employing **Epistemic Independence** justified implicitly by the **Maximum Entropy Principle**, a move standard in **Mean Field Theory** and **Risk Assessment**, where its failure is known as **Common Cause Failure**.

  It does not have a single catchy name because it is usually treated as the "zero-point" of modeling—the background against which correlation is measured. However, given its profound impact on risk estimation and its distinct epistemic status (methodological necessity vs. empirical belief), treating it as a named heuristic—**The Independence Default**—is analytically sound.

  If you write about this, the most valuable contribution you can make is to highlight that while it is the *information-theoretically correct* default (MaxEnt), it is often the *safety-critically dangerous* default (Risk Assessment). The tension between "least information assumed" and "worst-case correlation possible" is the precise epistemic knot you have identified.
