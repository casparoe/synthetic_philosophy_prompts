          *   *Ruins:* Betting more than Kelly ("overbetting") increases risk of ruin significantly, but "eventually be ruined" is true for betting *all* or enough that a single loss wipes you out, but technically overbetting reduces growth rate and increases volatility, leading to almost sure ruin relative to the Kelly bettor in the long run limit.
          *   *Rationality:* "Rationality requires" is a strong normative claim.
          *   *Decision:* "Cannot be beaten" is loose rhetoric. "Rationality requires" is controversial.

