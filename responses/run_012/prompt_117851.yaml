          *   *Reasoning:* Working quants almost always use "Fractional Kelly" (Half-Kelly, etc.). Why? Estimation error, drawdown tolerance, non-log utility (risk aversion), discrete betting opportunities, correlation.
          *   *Decision:* Practically false. Theoretically defensible only under strict assumptions (known probabilities, infinite horizon, log utility).

