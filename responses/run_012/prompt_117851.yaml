          *   *Verdict:* Mostly correct, but slightly imprecise on "odds."
          *   *Nuance:* It maximizes expected geometric growth rate. The formula $f^* = (bp - q)/b$ is edge/odds only in specific representations (often edge/variance or edge/payoff). "Odds" can be ambiguous (decimal vs. fractional vs. payoff).
