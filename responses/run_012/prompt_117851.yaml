answer: |-
  Here is the sentence-by-sentence audit, followed by the specific theoretical and practical verdicts you requested.

  ### Sentence-by-Sentence Audit

  **1. "Kelly's rule says that when you have an edge you should bet the fraction of your bankroll that maximizes your long-run growth rate, which works out to your edge divided by the odds."**
  *   **Verdict:** **Accept.**
  *   **Analysis:** This is a correct, if slightly colloquial, summary of the mathematical result. Kelly maximizes the expected geometric growth rate. The formula description ("edge divided by odds") is the standard heuristic, though technically it depends on how "odds" are defined (payoff odds vs. implied probability). A decision theorist accepts this as the definition of the strategy.

  **2. "Kelly proved this is the only strategy that cannot be beaten in the long run: bet more and you will eventually be ruined, bet less and you will grow more slowly, so full Kelly is what rationality requires."**
  *   **Verdict:** **Wince.**
  *   **Analysis:** The first half is mathematically loose; the second half is normative overreach.
      *   *Math:* Kelly maximizes asymptotic growth. Betting more than Kelly reduces growth and increases volatility. You are not "eventually ruined" by betting slightly more than Kelly unless you bet enough to make the geometric growth rate negative (typically double Kelly or more, depending on the payoff structure). Betting less than Kelly does grow more slowly, but with significantly lower volatility.
      *   *Normative:* "Rationality requires" is an unjustified leap. Rationality depends on the agent's objectives. If an agent cares about drawdowns or has a finite time horizon, Full Kelly is not rational.

  **3. "The deeper justification is that wealth compounds, and so is non-ergodic -- the average outcome across many gamblers is not the average outcome for one gambler over time -- and since you are one gambler over time, maximizing expected value is a mistake while maximizing the expected logarithm of your wealth is what a rational agent must do."**
  *   **Verdict:** **Mixed (Sound Physics, Illegitimate Normativity).**
  *   **Analysis:** The description of non-ergodicity is correct: in multiplicative dynamics, the time-average growth rate differs from the ensemble-average expected value. Maximizing arithmetic expected value (Expected Wealth) in a multiplicative game does lead to ruin. However, the claim that maximizing the expected logarithm is "what a rational agent must do" is a philosophical assertion, not a mathematical proof. It asserts that time-average optimization is the *only* valid criterion for rationality, which is debated.

  **4. "This is why Kelly betting refutes expected-utility maximization as a general theory of choice: you cannot be both a Kelly bettor and an expected-utility maximizer."**
  *   **Verdict:** **Wrong.**
  *   **Analysis:** This is a category error. Expected-utility maximization (EUM) is a framework, not a specific function. Kelly betting is exactly equivalent to EUM where the utility function is logarithmic ($U(W) = \ln W$). You are necessarily an expected-utility maximizer when you Kelly bet; you are simply maximizing a specific utility function. The writer confuses "Expected Utility" with "Expected Value" (arithmetic mean).

  **5. "In practice, any bet that is not full Kelly is a mistake, and anyone who bets less than Kelly is simply being irrational about risk."**
  *   **Verdict:** **Wrong.**
  *   **Analysis:** This contradicts standard practice among working quantitative bettors and fund managers. "Fractional Kelly" (e.g., Half-Kelly) is the industry standard. This is not due to irrationality, but due to estimation error, discrete betting opportunities, and utility functions that are more concave than logarithmic. Calling this "irrational" ignores the cost of parameter uncertainty.

  ---

  ### The Non-Ergodicity Argument vs. Kelly's Original Result

  **Kelly's Original Result (1956):**
  Kelly's paper was rooted in information theory. The result is a theorem: *If* you wish to maximize the asymptotic rate of growth of your capital in a repeated favorable gamble, *then* you must bet the Kelly fraction. It is a conditional mathematical truth. It does not claim to define rationality itself, only how to achieve a specific objective (maximum growth).

  **The Non-Ergodicity Argument (Recent):**
  This argument (associated with Ole Peters and others) posits that standard economic models incorrectly use ensemble averages (expected value) for processes that are non-ergodic (where time averages $\neq$ ensemble averages).
  *   **What it refutes:** It successfully refutes the use of **arithmetic Expected Value** as a decision criterion for multiplicative wealth dynamics over time. It shows that maximizing arithmetic expectation leads to almost sure ruin in repeated betting.
  *   **What it does NOT refute:** It does **not** refute Expected-Utility Maximization (EUM). The non-ergodicity argument essentially derives the logarithmic utility function from the dynamics of wealth rather than assuming it psychologically. But once derived, using that function *is* Expected-Utility Maximization. The claim that Kelly "refutes" EUM is false; Kelly *instantiates* EUM with a specific utility function justified by ergodicity breaking.

  **Verdict:** The non-ergodicity argument provides a physical justification for Log-Utility, but it does not overthrow Expected-Utility Theory. It merely argues against naive Expected-Value maximization.

  ---

  ### The Practical Conclusion on Fractional Bets

  **Does the conclusion ("any bet not full Kelly is a mistake") survive correction?**
  **No.** The conclusion is false in the real world.

  **Why Full Kelly is rarely used in practice:**
  1.  **Estimation Error:** Kelly requires precise knowledge of probabilities and payoffs. In finance and betting, these are never known, only estimated. If you overestimate your edge and bet Full Kelly, you are effectively overbetting, which drastically increases ruin risk and reduces growth. Fractional Kelly provides a safety margin against model error.
  2.  **Drawdown Tolerance:** Full Kelly involves significant volatility (often 50% drawdowns are possible). Most investors and bettors have utility functions that penalize drawdowns more severely than the logarithm does.
  3.  **Finite Horizons:** Kelly is an asymptotic result (infinite time). If you have a finite need for capital, the volatility of Full Kelly introduces "sequence of returns" risk that makes a more conservative bet size optimal.

  **Final Verdict:**
  The writer's summary correctly identifies the mathematical mechanism of Kelly and the non-ergodic nature of wealth, but it fails catastrophically on decision theory. It confuses Expected Value with Expected Utility, incorrectly claims Kelly refutes utility theory, and issues dangerous practical advice that ignores parameter uncertainty. A rational agent can be an expected-utility maximizer, accept the non-ergodicity argument, and still correctly choose to bet less than Full Kelly.
