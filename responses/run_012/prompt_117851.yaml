      *(Refining the "Practical" section)*: Why is fractional Kelly used? Primarily estimation error. If you think you have a 10% edge but you're wrong, Full Kelly kills you. Half-Kelly provides a safety margin. Also, utility of money is often more concave than log (people are more risk-averse).

      *(Final check on Sentence 2)*: "Bet more and you will eventually be ruined." If you bet $2 \times$ Kelly, your growth rate drops. If you bet enough that a loss wipes you out, yes. But technically, overbetting reduces the geometric mean return. If the geometric mean return is negative, you go to zero. If it's positive but lower than Kelly, you don't necessarily go to zero, you just grow slower. The text says "bet more and you will eventually be ruined." This is only true if you bet *too* much (double Kelly leads to zero growth, more than double leads to negative growth/ruin). I should note this imprecision.

