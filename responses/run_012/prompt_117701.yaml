          *   *Concede:* It might be non-epistemic factors.
          *   *Hold:* That's exactly why we need to study it normatively.
          *   *Reply:* We need rules for how non-epistemic factors *should* enter, not pretend they don't.
          *   *Weakness:* Risks turning into sociology rather than philosophy of science.

  6.  **Identifying the "Genuine Force" and "Doomsday Question":**
      *   *Genuine Force:* The Bayesian/ML objection regarding Model Averaging. If the framework *mathematically* integrates over hypothesis spaces, the claim that "standard replies lose force" is technically false within that framework. The speaker needs to clarify that the *choice of the meta-space* is still arbitrary.
      *   *Doomsday Question:* "If the choice of hypothesis space is determined by product decisions/logging (as you said), isn't that just a cost constraint? Why call it underdetermination instead of budgeting?" This reduces the philosophical claim to an engineering budget constraint, dissolving the "structural feature of inquiry" claim into "we didn't have time to log that table."

  7.  **Review against Constraints:**
