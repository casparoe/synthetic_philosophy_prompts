answer: |-
  # Q&A Preparation Sheet: Vertical vs. Horizontal Underdetermination

  **Goal:** Defend the claim that standard solutions to underdetermination fail because they assume a fixed hypothesis space (Vertical), whereas the choice of that space itself is underdetermined by evidence (Horizontal).
  **Audience:** 10 ML Engineers (Pragmatists), 1 Bayesian, 1 Quinean.
  **Constraint:** No citations. Gloss technical terms.

  ---

  ## Top Objections (Ordered by Damage Potential)

  ### 1. The "Model Averaging" Objection (Bayesian & Senior ML)
  **Who asks:** The Bayesian confirmation theorist, possibly backed by an ML researcher familiar with Bayesian methods.
  **Phrasing:** "You say standard tools assume a fixed space. But in Bayesian model averaging (a method where you combine predictions from many different model structures weighted by their probability), we explicitly put a probability distribution over the hypothesis spaces themselves. We don't fix the space; we integrate over it. Doesn't the math already solve your 'horizontal' problem by treating the space choice as just another uncertain variable?"

  **Concede:**
  *   Admit that the mathematical formalism *allows* you to assign probabilities to different model structures (spaces).
  *   Admit that this looks like a solution on paper.

  **Hold:**
  *   The math does not tell you *which* meta-space of possibilities to integrate over.
  *   The "prior over spaces" is just as unconstrained by evidence as the "prior over hypotheses."

  **Reply (2 mins):**
  "You're right that the math allows you to put a probability distribution over model structures. But notice what you've done: you've pushed the problem back one step. To do that averaging, you still had to choose a set of candidate structures to average over. You had to decide which kinds of models were 'live options' worthy of a non-zero probability.

  Did the data tell you to include neural networks but exclude decision trees? Did the evidence determine the range of architectures you considered? No. That choice was made before the math started. My point is that for every 'horizontal' layer you add—where you put a prior on the space—you still need a 'meta-prior' to select that layer. The evidence never enters the room to fix the menu of options. So the underdetermination isn't solved; it's just moved to a higher level. The structural feature remains."

  **Where this is soft:**
  If they argue that "pragmatic constraints" (like compute cost) objectively limit the meta-space, they might claim the problem is dissolved by resource limits, not epistemology.
  **Follow-up that breaks it:** "If the choice is just about compute cost, isn't this just engineering budgeting, not a philosophical problem about evidence?" (See *Doomsday Question* below).

  ---

  ### 2. The "Predictive Equivalence" Objection (ML Engineers)
  **Who asks:** The pragmatist engineers (the majority of the room).
  **Phrasing:** "I build fraud models. If Model A and Model B have the same AUC (a measure of classification performance) and the same false positive rate on held-out data, they are functionally identical to the business. You're saying there's a deep philosophical problem because they use different inputs? If the output is the same, the difference is noise. Aren't you just dressing up the bias-variance tradeoff in fancy clothes?"

  **Concede:**
  *   For immediate deployment and current profit, the difference might not matter.
  *   Acknowledge that engineers rightly care about performance metrics.

  **Hold:**
  *   Scientific inquiry (and robust engineering) cares about *stability* and *explanation*, not just current fit.
  *   Equivalent performance today does not guarantee equivalent performance tomorrow (distribution shift).

  **Reply (2 mins):**
  "I agree that for a one-off prediction, the difference might not matter. But inquiry isn't just about one-off predictions; it's about building systems that survive when the world changes. In my job, I saw that models with different inputs break in different ways when fraudsters change tactics.

  If we treat the choice of inputs as irrelevant because performance is equal, we blind ourselves to *why* the model works. Vertical underdetermination asks 'which line fits the dots?' Horizontal underdetermination asks 'which dots are we allowed to plot?' If we ignore the second question, we can't diagnose failure when the data distribution shifts. My claim is that ignoring horizontal underdetermination makes your models brittle. It's not just philosophy; it's a robustness issue. The 'bias-variance tradeoff' assumes you've already picked the features. I'm asking how you pick the features."

  **Where this is soft:**
  ML engineers often handle robustness via retraining pipelines rather than philosophical feature selection.
  **Follow-up that breaks it:** "We retrain weekly anyway. If the model breaks, we fix it then. Why do we need a normative theory for feature space selection now?"

  ---

  ### 3. The "Holism is Enough" Objection (The Quinean)
  **Who asks:** The Quine-influenced philosopher.
  **Phrasing:** "Quine argued that our beliefs face the tribunal of experience as a corporate body (holism). We can adjust any part of the web—logic, theory, or observation—to save a hypothesis. Your 'horizontal' underdetermination sounds like you're just noticing that the 'web' itself is flexible. Haven't I already conceded your point? Why invent a new distinction for something holism already covers?"

  **Concede:**
  *   Quine correctly identified that evidence doesn't force a single theoretical adjustment.
  *   Acknowledge the shared spirit of anti-foundationalism.

  **Hold:**
  *   Quine focused on how to *save* a theory when evidence conflicts (Vertical rescue).
  *   You are focusing on how the *initial construction* of the theory space happens before evidence is applied.

  **Reply (2 mins):**
  "Holism tells us that when evidence conflicts, we have freedom in how to fix the web. But it usually assumes the web is already spun. My point is about the spinning of the web itself.

  In my fraud detection example, the conflict hadn't even arisen yet. The models performed equally well. The issue wasn't how to rescue a failing theory; it was that two entirely different webs were built from the start, based on logging decisions, not evidence. Quine's holism explains how we revise beliefs when surprised. It doesn't explain why we built these specific belief-structures rather than others before we saw the data. I'm not contradicting holism; I'm pointing out that there's a prior stage of inquiry—the construction of the hypothesis space—where evidence is silent, and holism doesn't speak to that construction phase."

  **Where this is soft:**
  A sophisticated Quinean might argue that the "construction phase" is also part of the web of belief and subject to pragmatic utility.
  **Follow-up that breaks it:** "If the construction is guided by pragmatic utility, isn't that a form of empirical constraint? Why call it underdetermined?"

  ---

  ### 4. The "Normative Vacuum" Objection (Everyone)
  **Who asks:** Anyone looking for a practical takeaway.
  **Phrasing:** "Okay, let's say you're right. Evidence doesn't fix the hypothesis space. So what does? If it's product decisions, logging accidents, or budget, then it's just politics or economics. If there's no epistemic rule for choosing the space, what is the 'normative question' you mentioned? Are you just telling us to be more honest about our biases?"

  **Concede:**
  *   Admit that non-epistemic factors (cost, history, product goals) often drive space selection.
  *   Admit there is no "evidence-based algorithm" for picking the space.

  **Hold:**
  *   Recognizing this vacuum is better than pretending evidence did the work.
  *   We need norms for *how* to let non-epistemic factors in, not to pretend they aren't there.

  **Reply (2 mins):**
  "If I'm right, we can't pretend evidence chose the space when it was actually a product manager or a logging constraint. Pretending otherwise hides the real reasons for our model's behavior. The normative question isn't 'how to find the true space,' because evidence can't show us that. It's 'how to responsibly select a space given that evidence is silent.'

  Maybe the norm is diversity: don't just build one model space, build three with different input assumptions. Maybe the norm is transparency: document *why* certain quantities were excluded. I'm arguing we stop pretending the data spoke when it was actually silent. We need rules for managing the arbitrary choices, not a magic method to eliminate them."

  **Where this is soft:**
  This risks turning philosophy of science into project management or ethics.
  **Follow-up that breaks it:** "That sounds like engineering best practices, not a philosophical insight about underdetermination."

  ---

  ## ⚠️ Genuine Force: What to Repair Before Presenting

  **Objection #1 (The Bayesian/Model Averaging)** has genuine force.
  **Why:** If you claim standard replies "lose force," but Bayesian Model Averaging (BMA) explicitly mathematizes uncertainty over model structures, your claim that "the space is fixed" is technically vulnerable. A sophisticated Bayesian will say, "I treat the space as a random variable."
  **The Repair:** You must clarify that BMA requires a *hyper-prior* (a prior on the priors/spaces). You need to argue that the choice of *which* spaces get included in the averaging is the new Horizontal Underdetermination.
  **Action:** Add one sentence to your talk: "Even if you average over models, you must first choose the set of models to average over. That choice is the horizontal underdetermination."

  ---

  ## ☠️ The Doomsday Question

  **Hope nobody asks this:**
  "In your opening example, you said the choice of inputs was determined by which tables an earlier team decided to log, which was a product decision. Isn't that just a **cost constraint**? If we had infinite storage and compute, we would log everything and the space would be fixed by 'all possible data.' Isn't your 'horizontal underdetermination' just a fancy name for 'we have limited budget'?"

  **Why it breaks you:**
  If horizontal underdetermination is just "we can't measure everything," it's an engineering limitation, not a structural feature of inquiry. It dissolves your philosophical claim into a resource constraint.
  **How to parry (if asked):**
  "Even if we logged everything, we still have to choose *which transformations* of that data count as quantities. Do we use raw timestamps or time-since-last-login? Do we aggregate by user or by device? The space of possible quantities is infinite, even with infinite data. We still have to select a finite subset to model. That selection is not fixed by the data, even if cost is zero."
