      *   *Motivation:* Fraud models with same performance but disjoint inputs due to historical/product accidents.
      *   *Implication:* Standard fixes (simplicity, priors, IBE, Duhem-Quine) assume the space is fixed. If the space isn't fixed by data, these don't work.
