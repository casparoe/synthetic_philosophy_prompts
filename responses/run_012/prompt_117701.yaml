  8.  **Final Polish:** Ensure the distinction between Vertical (picking from menu) and Horizontal (picking the menu) remains sharp in the replies. Make sure the ML folks feel heard (pragmatism) but challenged on robustness. Make sure the philosophers feel the distinction is substantive, not terminological.

      *(Self-Correction during drafting)*: I need to make sure I don't give the speaker too much jargon. Keep "Model Averaging" explained. Ensure the "Doomsday Question" is highlighted clearly. The "Genuine Force" objections need a specific "Repair Before Present" instruction.

      *Refining the "Genuine Force" section:* The Bayesian objection is the strongest. If the Bayesian says "I put a prior on the model structure itself," they claim to have solved horizontal underdetermination. The speaker needs to argue that the *choice of that meta-prior* is the new horizontal underdetermination. It's turtles all the way down. This needs to be explicit.

