          *   *Concede:* Priors technically assign probability to spaces.
          *   *Hold:* The *origin* of that prior/space is not evidence-based.
          *   *Reply:* You're pushing the problem back. Where does the prior over spaces come from? If it's not evidence, it's the horizontal underdetermination I'm talking about.
          *   *Weakness:* If they say "It comes from loss functions/utility," does that solve it?

      *   *Drafting Objection 2 (The Pragmatic "Predictive Equivalence"):*
          *   *Phrasing:* "Same AUC, same fraud caught. Why does it matter?"
          *   *Concede:* For deployment, maybe it doesn't.
          *   *Hold:* For scientific understanding and robustness, it does.
          *   *Reply:* If the world changes (distribution shift), these models break differently. Knowing *why* we picked the space matters for stability, not just current score.
