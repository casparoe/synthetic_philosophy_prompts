          *   *Reply:* Holism says anything can change. I'm saying the *menu* of things we allow to change is fixed before evidence arrives.
          *   *Weakness:* Quineans might say "The menu is also part of the web."

      *   *Drafting Objection 4 (The Normative Vacuum):*
