  # Practical Reason: The Buridan's Ass Decision Tree

  **Root:** *Start here.*
  **Claim:** "There are deliberative situations in which, by the agent's own lights, the reasons bearing on two available options are exactly balanced — neither option is better, and not because the agent does not care about either."
  *(Do you accept this claim as possible? If No, you are a **Rationalist Denier**; if Yes, proceed to Node 1.)*

  ---

  ### Node 1: The Source of Balance
  **Question:** Why are the reasons balanced?
  *   **(A) Ignorance:** "I lack information; more reflection would break the tie." → **Go to Leaf 1.**
  *   **(B) Constitution:** "The balance is an artefact of my specific psychology; a different agent would prefer." → **Go to Leaf 2.**
  *   **(C) Robust:** "The balance survives full knowledge and any rational constitution." → **Go to Node 2.**

  ### Node 2: Symmetry (Concrete Case)
  **Question:** Consider two cases: (1) Two identical bales of hay. (2) One bale is sweeter, the other is closer. Does the balance hold in *both* cases?
  *   **(A) No:** "Ties only occur in identical (symmetric) cases." → **Go to Leaf 3.**
  *   **(B) Yes:** "Ties occur even in heterogeneous cases." → **Go to Node 3.**

  ### Node 3: Value vs. Reasons
  **Question:** In the heterogeneous tie, are the options equally *valuable*, or is there simply no common measure to compare them?
  *   **(A) No Common Measure:** "They are incomparable or on a par." → **Go to Leaf 4.**
  *   **(B) Equally Valuable:** "The value is equal; the reasons are what matter." → **Go to Node 4.**

  ### Node 4: Time (Concrete Case)
  **Question:** The hay is wilting and you are getting hungrier. Does the passage of time break the tie automatically?
  *   **(A) Yes:** "Deliberation should focus on *how* to decide (e.g., wait, randomize) rather than *what* to decide." → **Go to Leaf 5.**
  *   **(B) No:** "The tie persists even as stakes rise; the static setup is not illicit." → **Go to Leaf 6.**

  ---

  ### Leaves: Positions & Commitments

  **Leaf 1: The Principle of Sufficient Reason**
  *   **Position:** Genuine ties are impossible; a sufficient reason always decides the case.
  *   **Awkward Commitment:** You must insist the agent is merely ignorant, even if they feel certain they know everything relevant.
  *   *(Path Note: This path denies the Root Claim's stability.)*

  **Leaf 2: Preference Constructivism**
  *   **Position:** There is no fact of the matter about preference apart from choice.
  *   **Awkward Commitment:** You must deny that the agent's prior psychology constrains the choice, making preference entirely post-hoc.
  *   *(Collapse Note: Merges 'No fact of matter' with 'Constitution' view.)*

  **Leaf 3: Decision-Theoretic Dissolution**
  *   **Position:** A complete preference ordering may be indifferent, and indifference makes either option permissible.
  *   **Awkward Commitment:** You must accept that rationality cannot distinguish between picking the sweeter hay and the closer hay if values sum equally.
  *   *(Collapse Note: Merges 'Decision Theory' with 'Meta-Deliberation' for symmetric cases.)*

  **Leaf 4: Value Pluralism (Parity/Incomparability)**
  *   **Position:** The relation between tied options is a fourth comparative relation (neither better, worse, nor equal), or they are incomparable.
  *   **Awkward Commitment:** You must posit a complex value ontology that most formal models cannot represent.
  *   *(Collapse Note: 'Parity' and 'Incomparability' share this branch; distinction lies in whether a fourth relation exists or no relation does.)*

  **Leaf 5: Meta-Deliberation**
  *   **Position:** The rational response is to deliberate about how to decide (randomizing or threshold-settling).
  *   **Awkward Commitment:** You treat the choice itself as arational, pushing rationality back one step to the method.
  *   *(Path Note: Reached only if Time breaks the tie.)*

  **Leaf 6: Agency (Voluntarism / Picking)**
  *   **Position:** Ties are real and the agent must simply choose (Voluntarism) OR the act is merely picking, which is arational (Picking).
  *   **Awkward Commitment:** You must accept that the final move is either undetermined by reason (Voluntarism) or outside reason entirely (Picking).
  *   *(Collapse Note: This leaf combines 'Voluntarism', 'Choice Creates Reason', and 'Picking'. The tree cannot separate them without exceeding 12 nodes. Diagnosis: Unexplored distinction in introductory contexts, as both locate the solution in the will rather than the world.)*

  ---

  ### Instructor's Key & Diagnostics

  **Unreachable Combinations:**
  *   **Constructivist Sufficient Reason:** (Node 1A + Node 1B). *Diagnosis: Incoherent.* One claims a fact exists but is unknown; the other claims no fact exists.
  *   **Static Meta-Deliberation:** (Node 4B + Leaf 5). *Diagnosis: Unattractive.* If time doesn't break the tie, waiting/randomizing lacks the urgency that justifies meta-deliberation.

  **Undefendable Paths:**
  *   **Leaf 6 (Agency):** *Flag:* I would not defend the 'Picking' variant in print as a complete theory of rational action, as it concedes too much to irrationalism. Use this leaf to provoke debate on whether 'will' is a reason.

  **Node Count:** 12 Total (1 Root + 4 Internal Distinction Nodes + 1 Internal Merge Node + 6 Leaves). *Correction: See structure above.*
  *Actual Count:* Root (1) + N1 (1) + N2 (1) + N3 (1) + N4 (1) + Leaves (6) = 11 Nodes.
