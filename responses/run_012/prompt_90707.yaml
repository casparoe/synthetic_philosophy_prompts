answer: |-
  **Project Title:** The Reflexive Reference Class: Repairing the Outside View for Macro-Historical Forecasting

  **1. The Research Question**
  Standard reference class forecasting assumes that the case to be predicted is exchangeable with past cases drawn from a stable distribution. This project asks: **Can reference class forecasting yield calibrated probabilities for the durability of unique geopolitical regimes when the historical record suffers from outcome-based selection bias and the actors within the system learn from past failures?**

  This question has a determinate answer. Either (a) specific methodological repairs can restore calibration (yielding probabilities that match observed frequencies in hold-out tests), or (b) the structural non-exchangeability of macro-historical data renders the outside view incapable of producing point estimates, restricting it to a purely heuristic role. The project will determine which of these is the case and specify the boundary conditions.

  **2. Background and Gap**
  The "outside view," popularized by Kahneman and Lovallo and adopted extensively by the forecasting community, treats the reference class as a corrective to inside-view narrative bias. For recurring events (project completion, sports outcomes), this works well. For one-shot macro-historical questions—such as the survival of the liberal international order—the standard application is to assemble a class of past hegemonies, calculate their mean lifespan, and use this as a baseline prior.

  Existing literature leaves this application open for two reasons. First, it treats the historical record as a complete dataset, ignoring **survivorship and visibility bias**. We observe polities that ended loudly (ruins, chronicles) more readily than those that dissolved quietly or transformed continuously. This distorts the denominator of the base rate. Second, it ignores **reflexivity** (the Lucas Critique applied to history). Past hegemonies did not have data on the fall of Rome; the current order does. If actors adjust behavior based on the reference class, the distribution is not static, and past frequencies are not predictive of future probabilities. Current discussions conflate these two problems, treating them as mere "noise" rather than structural flaws in the reference class construction.

  **3. Candidate Repairs**
  I propose testing two distinct methodological repairs to determine if either salvages the outside view for this domain.

  *   **Repair A: The Generative Hazard Model.** Instead of treating the reference class as a population of outcomes (e.g., "empires"), treat it as a population of *mechanisms*. We do not count how long empires lasted; we model the hazard rate of specific failure modes (e.g., fiscal insolvency, succession crisis, external invasion) and aggregate these. This bypasses the selection bias of "ended loudly" by focusing on underlying causal processes that leave traces even in quiet dissolutions.
  *   **Repair B: The Bounding Constraint.** Abandon the goal of a point probability (e.g., "20% chance of collapse in 10 years"). Instead, use the reference class solely to establish impossibility bounds or heavy regularization priors. The outside view sets a "speed limit" on the inside view; an inside-view narrative cannot justify a probability outside the bounds set by the historical distribution unless it provides evidence of a structural break. This accepts non-exchangeability but retains the outside view as a discipline against overconfidence.

  **4. Methodology and Work Plan**
  This is a solo project with no research assistance. The work divides into conceptual formalization (40%) and historical data operationalization (60%). The data work is the primary risk; I will rely on existing large-N datasets (e.g., Correlates of War, Polity IV) rather than archival collection to ensure feasibility.

  *   **Months 1–3: Conceptual Framework.**
      *   Formalize the definition of "International Order" and "Regime Durability" to ensure the reference class is not defined post-hoc.
      *   Mathematically specify the selection bias and reflexivity problems.
      *   Draft the formal criteria for "Repair A" (Generative) and "Repair B" (Bounding).
      *   *Deliverable:* A working paper defining the taxonomy of failure modes and the mathematical constraints for exchangeability.

  *   **Months 4–6: Data Assembly and Cleaning.**
      *   Construct a dataset of "great power" or "hegemonic" systems from 1500–present using existing databases.
      *   Code for "end type" (loud collapse vs. quiet absorption vs. transformation) to quantify the visibility bias.
      *   Code for "historical awareness" (proxy: availability of historical records to the actors at the time) to quantify reflexivity.
      *   *Deliverable:* A cleaned, annotated dataset with documented coding rules.

  *   **Months 7–9: Testing the Repairs.**
      *   Apply Repair A: Build a survival analysis model based on mechanisms rather than regime labels.
      *   Apply Repair B: Calculate base rates and apply them as priors to a set of historical "inside view" predictions (retroactive testing).
      *   Compare calibration scores (Brier scores) of the standard outside view vs. the two repairs.
      *   *Deliverable:* Statistical analysis comparing the predictive validity of the three approaches.

  *   **Months 10–12: Synthesis and Demonstration.**
      *   Write the final paper.
      *   Construct the "Worked Demonstration": Apply the winning method (or declare failure) to the specific question of the current international order's durability.
      *   *Deliverable:* Final fellowship paper and a one-page "Forecaster's Protocol" appendix.

  **5. Success and Failure Conditions**
  **Success:** The project produces a formal protocol that allows a forecaster to input a macro-historical question and receive either a calibrated probability or a specific instruction to refrain from forecasting. The worked demonstration on the current international order will show explicitly how the reference class adjusts the inside view. For example, it might conclude: "The standard outside view suggests a 50% collapse rate in 80 years. However, accounting for reflexivity (Repair B), this base rate is invalid. Instead, we use the reference class to bound the probability: collapse within 5 years is <5% (no historical precedent for rapid hegemonic vacuum), but collapse within 100 years is >40%."

  **Failure:** The project fails if the data assembly reveals that "regime end" is too subjective to be coded reliably across the sample, or if neither repair improves calibration over the standard outside view. If the "Generative Model" requires data that does not exist (e.g., fiscal data for 17th-century polities), Repair A will be abandoned. If Repair B collapses into tautology (bounds are so wide they are useless), the project will conclude that the outside view is inapplicable to this domain. A "negative result" (proving the outside view cannot work here) is still a successful outcome for the fellowship, provided the proof is rigorous.

  **6. Candid Assessment of Timeline**
  One year is sufficient to complete the conceptual argument and the testing of the repairs on a limited dataset. However, it is borderline for a comprehensive historical data assembly without research assistance. The risk lies in Months 4–6; coding "quiet dissolutions" vs. "loud collapses" requires nuanced historical judgment that is time-consuming.

  If data cleaning consumes more than six months, the scope must be narrowed. The honest contingency plan is to restrict the dataset to the post-1815 period (the Concert of Europe to present), where data quality is higher and the concept of an "international order" is more coherent. If even this narrower dataset proves too noisy to support the Generative Model, the fellowship will pivot to focusing exclusively on the conceptual argument and the Bounding Constraint (Repair B), using illustrative examples rather than large-N testing. The core value of the fellowship is resolving the *theoretical* ill-posedness; the empirical testing is desirable but secondary to establishing the formal limits of the method.
