prompt: |-
  I coordinate advance-care planning for a small community hospital, and the work has become personal: my father's aphasia after a stroke means that his words, the situation that frames them, and what he is trying to tell us frequently come apart, and I have watched staff and family fill the gap with whatever reading is most convenient. I want to give our volunteer visitors and bedside clinicians a reusable procedure for determining what a patient's utterance or advance directive actually means when the literal content, the framing context, and the intended message diverge. The procedure should be grounded in the frame/outer/inner-message distinction: the frame message tells the receiver how to take the outer message, the outer message is the explicit content, and the inner message is what the sender is trying to convey. Please write the procedure as a sequence of questions to ask in order, say what counts as a sufficient answer at each step, identify where the procedure must stop with a determination that the meaning cannot be recovered, and mark the points where the decision must be handed to a person -- the patient's surrogate, a clinician, or an ethics consultant -- because it turns on values or on unrecoverable intention rather than on evidence. It has to be usable by someone with no background in semiotics or philosophy of language, in under ten minutes at the bedside, and it must not pretend to more certainty than the situation allows. Our volunteers see about fifteen patients a day, and any interpretation that would change code status must be signed off by the charge nurse and me. Then run it on three cases: a patient who asks to go home while on a ventilator; a family that insists on doing everything although the patient's written directive refuses intubation; and a translated advance directive whose original phrasing may have carried a different force. Include at least one case where the procedure returns an answer the family will not like, and say explicitly what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Analyze the Request:**
      *   **User Role:** Coordinator of advance-care planning at a small community hospital.
      *   **Motivation:** Personal (father's aphasia after stroke). Observed staff/family filling gaps with convenient readings.
      *   **Goal:** Create a reusable procedure for volunteers/clinicians to interpret patient utterances/advance directives when literal content, context, and intent diverge.
      *   **Theoretical Framework:** Frame/Outer/Inner-message distinction (Frame = how to take it; Outer = explicit content; Inner = intended meaning).
      *   **Constraints:**
          *   Sequence of questions (in order).
          *   Define "sufficient answer" at each step.
          *   Identify stop points (meaning unrecoverable).
          *   Identify hand-off points (values/unrecoverable intention -> surrogate/clinician/ethics).
          *   Usable by laypeople (no semiotics background).
          *   Time limit: Under 10 minutes at bedside.
          *   Epistemic humility: Must not pretend to more certainty than allowed.
          *   Workflow constraint: 15 patients/day/volunteer. Code status changes require Charge Nurse + Coordinator sign-off.
          *   Deliverables: The Procedure + 3 Case Studies (Ventilator patient wanting home; Family vs. Directive on intubation; Translated Directive).
          *   Specific Requirement: At least one case where the answer is unwelcome to the family.
          *   Specific Requirement: Explicitly state what the procedure *cannot* do.

  2.  **Deconstruct the Theoretical Framework (Frame/Outer/Inner):**
      *   *Frame:* Context, relationship, tone, prior agreements, medical reality. (e.g., "Is this a joke?" "Is this a plea?" "Is this a legal document?")
      *   *Outer:* The words themselves. (e.g., "I want to go home." "No tubes.")
      *   *Inner:* The goal/value behind the words. (e.g., "I am scared," "I value dignity over length," "I want comfort.")
      *   *Divergence:* When the Outer doesn't match the Inner due to Frame issues (e.g., aphasia, cultural translation, fear, coercion).

  3.  **Drafting the Procedure (The "Triangulation Protocol"):**
      *   *Name:* Needs to sound clinical but accessible. "The Meaning Triangulation Protocol" or "The 3-Layer Check." Let's go with "The 3-Layer Meaning Check."
      *   *Structure:* Step-by-step questions.
      *   *Time Management:* Needs to be quick. 5-7 steps max.
      *   *Hand-offs:* Crucial. When do we stop guessing and ask the decision-maker?
      *   *Stop Conditions:* When is it impossible to know?

      *   *Drafting Steps:*
          1.  **Outer Message:** What was literally said/written? (Evidence)
          2.  **Frame Check:** What is the context? (Capacity, stress, language, relationship).
          3.  **Consistency:** Does this match prior values/actions?
          4.  **Inner Hypothesis:** What is the likely goal?
          5.  **Verification:** Can we test this?
          6.  **Decision/Hand-off:** Who decides?

      *   *Refining for Constraints:*
          *   Must explicitly mark "Hand-off to Surrogate/Clinician/Ethics."
          *   Must mark "Stop: Meaning Unrecoverable."
          *   Must address Code Status protocol (Charge Nurse + Coordinator).

  4.  **Developing the Case Studies:**
      *   *Case 1: Ventilator Patient wants to go home.*
          *   Outer: "Take me home."
          *   Frame: Medically unstable, on vent.
          *   Inner: Fear, discomfort, loss of control?
          *   Outcome: Likely unrecoverable as literal discharge, needs clinical reframing.
      *   *Case 2: Family vs. Directive (Intubation).*
          *   Outer (Directive): No intubation.
          *   Outer (Family): Do everything.
          *   Frame: Grief, guilt, perhaps cultural view of "doing everything."
          *   Inner (Patient): Dignity/Natural death.
          *   Outcome: Directive stands (Legal/Ethical), but requires sensitive handling. This is the "unwelcome answer" case.
      *   *Case 3: Translated Directive.*
          *   Outer: "No heroic measures."
          *   Frame: Translation nuance (e.g., "Heroic" means different things in different cultures/languages).
          *   Inner: Unknown without cultural context.
          *   Outcome: Hand-off to Ethics/Cultural Liaison.

  5.  **Refining the Procedure (Iterative Polish):**
      *   *Tone:* Empathetic, rigorous, humble.
      *   *Formatting:* Clear headings, bold text for actions.
      *   *Safety:* Emphasize the Code Status rule.
      *   *Limitations:* Explicit section on what it can't do (e.g., mind-reading, overriding law).

  6.  **Addressing the Personal Context:**
      *   Acknowledge the user's motivation (father's aphasia) in the intro/outro to build rapport, but keep the tool professional.

  7.  **Review against Constraints:**
      *   *Under 10 mins?* Yes, if questions are direct.
      *   *No semiotics jargon?* Explain Frame/Outer/Inner simply in the intro.
      *   *Hand-offs marked?* Yes.
      *   *Stop points marked?* Yes.
      *   *Code Status rule included?* Yes.
      *   *Unwelcome family answer?* Case 2.
      *   *What it cannot do?* Explicit section.

  8.  **Final Polish:**
      *   Ensure the distinction between "interpreting meaning" and "making medical decisions" is clear. The tool finds meaning; the surrogate/clinician makes the decision based on that meaning.
      *   Make sure the "Frame" concept is explained simply (Context/Relationship).
      *   Check the "Stop" criteria. If the Inner Message contradicts medical reality (e.g., going home on a vent), the procedure must flag that as a *negotiation* point, not a literal order.

      *(Self-Correction during drafting)*: I need to make sure I don't give volunteers authority they don't have. They are *gathering* information, not *deciding* code status. The prompt says "interpretation that would change code status must be signed off by charge nurse and me." I need to embed that checkpoint.

      *(Refining the "Frame" definition for laypeople)*: Instead of "semiotic frame," call it "The Situation & Relationship."
      *(Refining "Inner Message")*: Call it "The Goal or Value."

      *(Case 2 nuance)*: Family insisting on "everything" vs Directive refusing intubation. The procedure should lead to the conclusion that the Directive reflects the *Inner Message* of the patient, while the Family is acting on *their* Inner Message (grief/guilt). The decision hand-off goes to the Clinician/Ethics to uphold the Directive, but the *meaning* analysis supports the Directive.

      *(Case 1 nuance)*: "Take me home." Inner message is likely "I feel unsafe/uncomfortable here." Literal meaning is impossible. Procedure must identify this divergence.

      *(Case 3 nuance)*: Translation issue. "Heroic measures." In some cultures, this means "miracles," in others "machines." Procedure must flag the ambiguity and hand off.

  9.  **Final Output Structure:**
      *   Introduction (Acknowledging the personal stake).
      *   The Tool: "The 3-Layer Meaning Check."
      *   The Procedure (Steps 1-6).
      *   Safety & Authority Limits.
      *   What This Procedure Cannot Do.
      *   Case Studies (1, 2, 3).
      *   Closing.

  10. (Final Check of the "Hand-off" logic):
      *   If Outer != Inner, and we can't verify Inner -> Hand off.
      *   If Inner requires medical impossibility -> Hand off to Clinician for options.
      *   If Inner conflicts with Legal Document -> Hand off to Ethics/Charge Nurse.

