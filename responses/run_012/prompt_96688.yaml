      *   *Refining the "Contradiction":* Why did Dale contradict? Maybe he forgot? Maybe he adapts his story to the audience? Both are bad. It means his "written process" might not be the *actual* driver of his decisions.
      *   *Refining the "Wife's Point":* Differentiate between *motor skills* (pipetting) and *cognitive strategy* (investment). You can't explain pipetting easily, but you can explain *why* a specific investment fits a risk profile.
