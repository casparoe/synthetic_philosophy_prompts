  The wind tests the wing before it flies.
  If the shape fails, the breath stops.
  No memory remains in the blood.
  The landscape keeps the ones that walk.
  Something dies to save the rest.

  Touch the fire, pull back the hand.
  The skin learns what the seed could not.
  Pain prunes the movement like a branch.
  The body survives the lesson.
  Something dies to save the rest.

  Run the scene behind the eyes.
  See the cliff before the foot steps.
  The image breaks against the dark.
  The thinker walks away from the edge.
  Something dies to save the rest.

  The wrist remembers the fire.
  The eye remembers the fall.
  The paper takes the cut.
  You read the scratch and know the cliff.
  Something dies to save the rest.

  ***

  **Note on Liberties and Constraints**

  The primary liberty taken here is with the word "dies" in the refrain. In the first stanza, this is biological cessation. In the second, it is behavioral extinction; in the third, the rejection of a hypothesis; in the fourth, the deletion of a mark. Dennett uses this metaphorical extension himself (e.g., "let our hypotheses die in our stead"), but treating the scratching out of ink as "something dies" alongside biological death relies on the poem's context to do the heavy lifting. A strict materialist might argue only the first stanza involves actual death.

  Regarding the boundaries: The poem presents the grades as clean sequential stanzas, whereas Dennett acknowledges these capacities blur in nature (many animals exhibit proto-Popperian abilities). The poem also risks making the Gregorian layer seem purely individual ("The paper takes the cut") until the final line ("You read the scratch"). If you argued that the fourth turn was too cute or smuggled in a strong claim about collective cognition Dennett might nuance differently, I would fix it.

  Would the fix amount to a different poem? Yes. The accumulation in the final stanza relies on the idea that the Gregorian layer *includes* the previous three ("The wrist remembers... The eye remembers..."). If the definition of the fourth layer shifts away from cultural scaffolding toward individual tool use, the "You" in the final line would need to vanish, collapsing the social aspect that distinguishes the Gregorian from the Popperian. That would change the poem's resolution from a shared cultural survival to a solitary cognitive one.
