          *   If the question is epistemic ("what should I believe?"), arbitrariness remains because language itself biases the measure. (The "Grue" problem analogue in probability).
          *   *Conclusion:* The problem is genuine. It shows probability is not purely logical; it requires a physical or pragmatic anchor.

