      *   **The Unifying Diagnosis:** What is the "carving"? It's **Parameterization Dependence** (or Representation Dependence). Probability is not a property of the event alone, but of the event *relative to a measure space*. When the measure isn't fixed by physical chance (propensity) or frequency, we rely on epistemic principles (Indifference), which break under transformation.
