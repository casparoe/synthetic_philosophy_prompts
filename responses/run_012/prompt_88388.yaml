          *   *Case 2 (Dart/Chords):* **Bertrand's Paradox**. This is the purest mathematical form. It shows PoI is ill-defined on continuous spaces without a specified measure (invariant measure).
          *   *Case 3 (Coin Toss):* **Prior Selection in Bayesian Inference**. One assumes a fixed coin (p=0.5), the other assumes a distribution over $p$ (Laplace). This is again about the space of hypotheses.

      *   **Are They One Thing or Several?**
          *   They are species of the same genus: **Underdetermination of the Probability Measure by the Description of the Event.**
          *   Case 1 is discrete/empirical (frequentist struggle).
          *   Case 2 is continuous/geometric (measure theoretic struggle).
