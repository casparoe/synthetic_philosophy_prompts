answer: |-
  You have identified a genuine and profound structural problem in probability theory. You are not conflating distinct issues; rather, you have recognized three manifestations of the same underlying failure.

  The short answer is that there is no single universally agreed-upon name, because the phenomenon straddles statistics, philosophy, and mathematics. However, the most precise label for the unified phenomenon is **Parameterization Dependence** (or **Representation Dependence**) arising from the failure of the **Principle of Indifference**.

  In the literature, your second case is famously known as **Bertrand's Paradox**. Your first case is the **Reference Class Problem** (formulated by Hans Reichenbach). Your third case is the **Problem of the Prior** in Bayesian inference.

  While these names differ, modern objective Bayesianism (particularly the work of E.T. Jaynes) argues convincingly that they are indeed the same problem: **the inability to assign a unique probability measure to a space of possibilities based solely on a verbal description of the event.**

  Here is the carving you requested.

  ### 1. The Unified Diagnosis: Measure Without Metric
  The phenomenon is this: Probability is not a property of an *event*; it is a property of an event *relative to a measure space*. To ask "what is the probability?" is to ask "what is the measure of this subset relative to the total measure?"

  In your examples, the *subset* (the man dying, the dart landing near the center, the coin coming up heads) is well-defined. The *total space* (all men, the board, all coin tosses) is also well-defined. What is missing is the **metric** (the way we count or weigh the possibilities).

  *   **Case 1 (Actuary):** The metric is frequency. But frequencies differ depending on how you slice the population (the $\sigma$-algebra).
  *   **Case 2 (Dart):** The metric is geometric measure (length, area, volume). But "random" does not specify which geometric measure to use.
  *   **Case 3 (Coin):** The metric is logical weight over hypotheses. But the space of hypotheses can be parameterized in infinitely many ways.

  In all three, you are attempting to derive a **measure** from a **description**. The failure occurs because descriptions are invariant under transformations that measures are not. If I describe a square, I can parameterize it by side length $s$ or by area $A = s^2$. A uniform distribution over $s$ is *not* a uniform distribution over $A$. Since the verbal description ("a square") does not privilege $s$ over $A$, the probability is undefined.

  ### 2. Are They One Thing or Several?
  Your suspicion that the first case (reference class) and the second case (geometry) are different in kind is intuitively correct but structurally false.

  *   **Intuitively:** Case 1 feels empirical (about data tables), while Case 2 feels mathematical (about definitions).
  *   **Structurally:** They are identical. In Case 1, you are choosing a coordinate system for the "space of men" (Age vs. Habit vs. Physiology). In Case 2, you are choosing a coordinate system for the "space of points" (Radius vs. Area).

  The actuary's problem is simply a discrete, high-dimensional version of Bertrand's Paradox. The " Reference Class Problem" is what happens when you try to apply the Principle of Indifference to empirical classes without a theory to tell you which class is *causally* relevant. The "Bertrand Paradox" is what happens when you try to apply it to continuous variables without a *physically invariant* measure.

  They belong together under the genus: **The Underdetermination of Probability by Description.**

  ### 3. Established Concepts and Distinctions

  **A. The Principle of Indifference (PoI)**
  This is the rule you mentioned. It states that if there is no reason to prefer one outcome over another, assign them equal probability.
  *   *Why it fails:* As you noted, it does not name the thing that goes wrong. The PoI assumes that the "outcomes" are given. But outcomes are defined by variables. If variable $X$ is uniform, variable $X^2$ is not. The PoI yields contradictions when applied to different parameterizations of the same state of ignorance.

  **B. Bertrand's Paradox**
  This is the specific name for your second case. It demonstrates that "at random" is meaningless for continuous spaces without specifying the *method of selection*.
  *   *Distinction:* This is the cleanest mathematical instance of your pattern. It proves that logical probability cannot exist without a physical or symmetry-based anchor.

  **C. The Reference Class Problem**
  This is the specific name for your first case.
  *   *Distinction:* This is often framed as a problem for *Frequentism*. A frequentist says probability *is* the frequency in the long run. But the man belongs to infinite long runs (smokers, runners, 50-year-olds). Which frequency is the "true" probability? This shows that even objective frequency requires a subjective choice of class.

  **D. Jeffreys Priors / Maximum Entropy**
  These are the attempted remedies.
  *   *Distinction:* These are methods for choosing the "correct" carving. Jeffreys priors choose a parameterization that is invariant under re-parameterization (using the Fisher information metric). Maximum Entropy chooses the distribution that assumes the least information beyond the constraints.

  ### 4. Why This Is Not Ambiguity or Biased Sampling

  You asked why this is not merely a question that is ambiguous or underspecified.

  **It is not Linguistic Ambiguity.**
  If I say "bank," I could mean a river bank or a financial bank. That is ambiguity; I resolve it by context.
  In your cases, the terms are precise. "Uniformly over the area" is precise. "Uniformly over the radius" is precise. The problem is not that we don't understand the words; it is that **the physical situation does not privilege one precise description over the other.** The ambiguity is not in the language, but in the *map-territory relation*. There is no "territory" of probability until a map (measure) is drawn.

  **It is Not Biased Sampling.**
  Biased sampling implies there is a "true" distribution that we are failing to capture due to error.
  In your geometric and epistemic cases, **there is no true distribution** independent of the model. If a dart is thrown by a human, there is a physical distribution (muscle noise, aim). But if the question is "what is the logical probability given *only* that it lands on the board," there is no fact of the matter. The "bias" is not an error; it is a necessary feature of assigning numbers to ignorance.

  ### 5. The Remedies: Do They Solve It or Relocate It?

  You asked whether standard remedies remove the difficulty or relocate it. This is the crux.

  **Remedy 1: Insist the Randomizing Procedure be Stated.**
  *   *Effect:* Solves Case 2 (Geometry) physically. If we say "the thrower aims at the center with Gaussian error," the probability is fixed.
  *   *Limitation:* It changes the question from an epistemic one ("what should I believe given ignorance?") to a physical one ("what does this machine do?"). It dissolves the problem by refusing to answer the original question.

  **Remedy 2: Appeal to Symmetry (The Jaynes Solution).**
  E.T. Jaynes argued that we should choose the measure that is invariant under the symmetry group of the problem.
  *   *Example:* For the circle chord problem, if the problem does not specify the size of the circle or its position, the solution must be invariant under scaling and translation. This eliminates two of Bertrand's three solutions, leaving only one.
  *   *Does it solve it?* It is the strongest remedy. However, critics argue it **relocates the arbitrariness**. Why choose *that* symmetry group? Why is the problem invariant under scaling but not under some other transformation? Jaynes argues this is determined by the *problem statement*, but one can always argue about which features of the statement are "essential" and which are "accidental."

  **Remedy 3: Maximum Entropy.**
  *   *Effect:* Selects the distribution that is maximally non-committal with regard to missing information.
  *   *Limitation:* It requires choosing the variables over which entropy is maximized. (Entropy is not invariant under coordinate transformation). So you are back to choosing the "right" variables.

  ### 6. The Crux: Can a Fully Specified Procedure Still Be Arbitrary?

  You wrote: *"If a fully specified procedure can still be condemned as arbitrary, I should like to know on what grounds."*

  Here is the distinction that resolves your tension:

  1.  **Physical Probability (Propensity/Frequency):** If the procedure is fully specified physically (e.g., "a machine throws darts with mechanism M"), the probability is **not arbitrary**. It is a fact of nature. You can measure it. If you calculate it differently, you are simply wrong.
  2.  **Epistemic Probability (Logic/Belief):** If the procedure is specified only *verbally* or *logically* (e.g., "a dart lands randomly"), the probability **is arbitrary** (or rather, indeterminate).

  The "failure" you feel is the collision between these two. We want logical probability to behave like physical probability (to give a unique right answer), but without the physical anchor, it cannot.

  **The Grounds for Condemnation:**
  A fully specified *epistemic* procedure can be condemned as arbitrary if it yields different results under **equivalent descriptions**.
  If I calculate the probability of an event using variable $X$, and you calculate it using variable $Y$ (where $Y$ is a simple function of $X$), and we both claim to represent the same state of ignorance, yet we get different numbers, then **probability is not a logical relation between propositions.**

  This is the deep philosophical bullet many have to bite. It implies that **there is no such thing as "pure" logical probability.** All probability assignments require either:
  1.  **Physical Data:** (Frequencies/Propensities).
  2.  **Pragmatic Choice:** (We choose this measure because it makes the math easy or works for betting).
  3.  **Meta-Physical Assumption:** (We assume nature prefers symmetry/entropy).

  ### Summary
  You have correctly identified that the **Reference Class Problem**, **Bertrand's Paradox**, and the **Problem of Priors** are three faces of the same coin. The coin is the **Principle of Indifference**.

  The phenomenon is **Parameterization Dependence**.
  The cases belong together because they all demonstrate that **ignorance is not invariant under transformation.**
  The standard remedies (Symmetry, MaxEnt) do not solve the problem logically; they solve it pragmatically by imposing a convention on how to describe ignorance.

  If you feel a "failure" here, it is because you are sensing the limit of logic. Probability is not purely logic; it is logic plus a choice of measure. When the choice of measure is not dictated by physics, it remains, in the final analysis, a human decision.
