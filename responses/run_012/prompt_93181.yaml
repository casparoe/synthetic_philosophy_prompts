answer: |-
  The ink used by the Guild of Littoral Cartographers was distinct—a viscous, salt-cured blue that never faded, even when splashed by the surge. For forty years, Elara had dipped her quill into that pot, certifying maps that turned the chaotic rock-scars of the coastline into orderly grids. To be a "true chart" in the Guild meant satisfying the Hand-span Rule. If a pool could not hold a spread adult hand without spilling, it was noise. It was evaporation, not geography. A true chart was a tool for the wader, a promise that if you followed the blue lines, you would find harvestable water.

  Then came the Resonance Bell.

  It was a brass dish, no larger than a saucer, humming with a frequency that made Elara's teeth ache. When swept over the dry basalt, it didn't look for water; it listened for the hollows where water *had been* or *could be*. It revealed the micro-veins, the capillary pockets, the ghost-pools that vanished before the tide fully receded.

  The Guild Hall smelled of brine and old parchment the day the split became irreversible. Elara sat at the high table, her certification stamp heavy in her lap. To her left sat Kaelen, holding the Bell like a holy relic. To her right sat Oren, polishing a Sight-Reed, the traditional measuring stick.

  "The definition hasn't changed," Oren said, his voice gravelly. He tapped the Hand-span Rule etched into the table. "A true chart records the navigable tide. If a wader cannot step in it, it is not a pool. It is dampness. To map dampness is to lie about the terrain."

  Kaelen leaned forward. "The Rule says we record the tide's shape. The Reed was just the eye we had. The Bell is a better eye. If the water exists physically, omitting it is a falsehood. A chart that misses half the water is a false chart."

  Elara watched them. She saw the trap closing. They were both invoking the history of the Guild to justify a rupture. Oren appealed to the *purpose* of the chart (utility for the wader). Kaelen appealed to the *ontology* of the chart (correspondence to the rock). Both claimed to be the guardians of the "true chart."

  "I have a submission," Elara said, silencing them. She placed a map on the table. It was drawn by a novice, Jory. Jory had used the Bell. The map was dense with stippling, fine blue dots filling the spaces between the bold, traditional lines.

  "Jory seeks certification," Elara said.

  Oren squinted. "It's cluttered. A wader looking for a cistern will be confused by these specks. It fails the utility test. It is not a true chart."

  "It is complete," Kaelen countered. "It shows the rock as it is. To censor the micro-veins is to submit a partial fiction. It is the only true chart."

  Elara picked up her stamp. The wood felt warm. She looked at the word carved into the face: **VERA**. True.

  In the old days, the stamp was a promise of safety. It meant: *You can walk here, and the water will be where the ink is.* Now, the ink was in two places. The bold lines were where the water stayed. The stippling was where the water flashed and died.

  If she stamped it, she validated Kaelen's ontology. She admitted that "true chart" meant "total inventory of wetness." But if she rejected it, she validated Oren's pragmatism. She admitted that "true chart" meant "reliable guide for the Hand-span Rule."

  Yet, neither felt like a betrayal of the past. That was the terror of it.

  Oren wasn't inventing a new rule; he was protecting the ecosystem of practice that had fed the coastal villages for centuries. The maps were used to plan net placements, to time the harvest. A map of micro-veins was useless for that. In his mouth, "true chart" meant *functional instrument*. To change the definition was to break the tool.

  Kaelen wasn't being pedantic; he was pursuing the Guild's original mandate of "knowing the shore." The Sight-Reed had always been a proxy for truth, limited by human vision. The Bell removed the limit. In his mouth, "true chart" meant *accurate representation*. To ignore the Bell was to choose ignorance over knowledge.

  Elara realized that the concept of "true chart" was no longer a single point. It was a stretching membrane.

  "I remember when we switched from charcoal to ink," Elara said softly. The room quieted. "The elders said charcoal smudged in the rain, so it wasn't a true record. Ink held. We changed the material to keep the meaning."

  "And now?" Kaelen asked.

  "Now the material is not the issue. It is the threshold." Elara traced a bold line on Jory's map. Then she traced a cluster of stippling. "Oren, if I stamp this, does it mean a wader can trust the blue?"

  "Yes," Oren said. "But the stippling is decoration. It is artistic license, not cartography."

  "Kaelen, if I stamp this, does it mean every dot is water?"

  "Every dot is a fact," Kaelen said. "To deny it is to falsify the shore."

  Elara closed her eyes. She saw the word **VERA** hovering over the map. It was the same word they had used for forty years. It occupied the same space on the parchment. But it had bifurcated.

  If she stamped it, the word "true" would mean *ontologically complete* to half the room and *functionally reliable* to the other half. They would nod at each other, using the same vocabulary, but pointing at different practices. The Traditionists would file the maps in the Navigation Archive. The Compleists would file them in the Geological Survey. They would both call them "True Charts."

  There was no logical contradiction that could solve this. It was not a matter of fact. The water *was* there (fact). The wader *could not* use it (fact). The contradiction lay in the weight given to the word "chart." Was a chart a mirror of the world, or a key for the hand?

  Elara opened her eyes. She saw the anticipation in Kaelen's posture, the rigidity in Oren's. They needed her to choose, to freeze the meaning. But the meaning had already flowed away from them.

  "The Guild's mandate is to know the tide," Elara said, her voice steady. "We have always excluded what the tide does not keep. But we have also always sought to see deeper."

  She lifted the stamp. She did not look at Oren. She did not look at Kaelen. She looked at the ink.

  "Jory's map records the rock," Elara said. "It is a true record of the stone." She pressed the stamp down onto the corner of the parchment. The sound was a dull thud, final and heavy. **VERA**.

  "But," she continued, lifting the stamp to reveal the blue imprint, "it is not yet a true guide for the wader. Until we establish a convention for the micro-veins, this chart carries two truths. It is true that the water is there. It is true that the hand does not fit."

  Oren exhaled sharply, a sound of frustration. "You've muddied the water, Elara. Now 'true' means nothing."

  Kaelen smiled, but it was a tight smile. "No. Now it means everything. We just have to learn to read the difference."

  Elara cleaned her quill. She knew the dispute was not over. It would move to the archives, to the training schools, to the field. There would be two kinds of certification ceremonies. There would be two kinds of maps filed under 'C'.

  She watched the ink dry. The word **VERA** sat on the page, stable and black. But as she looked at it, she saw it shimmer. It was no longer a label for a single practice. It was a bridge between two diverging shores. The cartographers would continue to use the word. They would argue over it, cite precedent for it, and die for it. But when Oren said "true chart," he would mean a promise of utility. When Kaelen said "true chart," he would mean a promise of existence.

  The concept had not broken; it had grown a second heart. Elara capped the ink pot. The tide was coming in, covering the rocks, erasing the distinction between the deep pool and the micro-vein. Under the water, they were the same. It was only on the map, in the dry air of human agreement, that they had to be different.

  "Next submission," Elara said.

  The door opened. Another mapper stepped in, holding a Sight-Reed in one hand and a Bell in the other. He looked at the stamp on Jory's map, then at Elara. He didn't ask which truth she had endorsed. He simply laid his parchment down, waiting to see which version of the word she would use today.

  Elara dipped her quill. The blue ink rose, dark and ambiguous, ready to bind the world to the paper, however fractured that world had become.
