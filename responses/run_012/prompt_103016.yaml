prompt: |-
  For the past two months I have been the person drafting review guidance for my institution's research-ethics committee, and the two questions that keep landing on my desk have turned out, uncomfortably, to be the same question. The biology side wants to know how to handle work on insects and other invertebrates, now that our national framework has been widened to bring some of them into scope; the engineering side wants to know whether a companion robot being trialled in a local care home falls under any review at all. I have to run a ninety-minute session for the committee — twelve people, mostly clinicians and lawyers, one philosopher, nobody with a background in animal cognition or in AI — with no reading circulated in advance. What I need from you is a plan for the explanation, not the explanation itself.

  My instinct is that the session should be organised around sentience as a matter of degree, since that is the only framing in which both cases are even askable, but I am not confident I have the dependency structure right. What has to be in place before degrees of sentience is a coherent thing to say? My guess is that the split between reflex and valenced experience must come first, and then the claim that it is experience, rather than life or intelligence, that grounds the possibility of being wronged — but tell me whether that is the right order, and what depends on what.

  For the carrying example I am inclined to build the session on a single pair: an insect and a small robot that behave indistinguishably when a heat source is brought near, both withdrawing, so that behaviour cannot be what decides the case and the committee is pushed onto mechanism and onto what evidence could in principle count. Is that the right carrier? What must it have, and what must it conspicuously lack, for the rest of the session to hang off it?

  Here are the misconceptions I expect, and I need to know where in the sequence each should be headed off: that degrees means one measurable quantity; that it is all-or-nothing after all; that a matter of degree means no line can be drawn and therefore anything goes; that behaviour settles it in either direction, so that the insect writhing means it suffers and the insect being a reflex machine means it does not; that the degrees lie on a single axis, as though sentience were a dimmer rather than several dials that can come apart; and that the robot pole is a reductio that refutes the gradation view rather than a boundary case the view has to handle.

  One further element to place. I have drafted a one-page heuristic that sorts cases on three axes — the strength of the observable evidence, the presence of a plausible mechanism, and the asymmetry of the cost of being wrong in each direction — and I cannot decide whether it should be the spine of the session or the closing move. Advise me on that, tell me what to leave out at this level and to say openly that I am leaving it out, and give me one question to put to the room at the end that would show whether they have grasped the gradation view rather than merely been made cautious about it.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **Role:** Advisor to an ethics committee drafter.
      *   **Task:** Create a *plan* for a 90-minute committee session (not the script itself).
      *   **Audience:** 12 people (clinicians, lawyers, 1 philosopher), no expertise in animal cognition or AI. No pre-reading.
      *   **Core Problem:** Two specific cases (Insects/Invertebrates under new national framework; Companion Robot in care home).
      *   **Proposed Framing:** Sentience as a matter of degree.
      *   **User's Hypotheses:**
          *   Dependency structure: Reflex vs. Valenced Experience $\rightarrow$ Experience grounds being wronged.
          *   Carrier Example: Indistinguishable heat-avoidance in insect vs. robot.
          *   Heuristic: 3 axes (Evidence, Mechanism, Cost of Error). Unsure if it should be the spine or the closer.
          *   Misconceptions to address: Degrees = single quantity; All-or-nothing; No line = anything goes; Behavior settles it; Single axis (dimmer); Robot as reductio.
      *   **Deliverables:**
          *   Validate/Correct dependency structure.
          *   Validate/Refine carrier example.
          *   Sequence the misconceptions.
          *   Place the heuristic (spine vs. closer).
          *   Advise on what to exclude.
          *   Provide one final assessment question.

  2.  **Deconstruct the Dependency Structure (Sentience as Degree):**

      *   *User's guess:* Reflex vs. Valenced Experience $\rightarrow$ Experience grounds being wronged.
      *   *Critique:* This is mostly right, but it needs a precursor step. Before discussing *degrees* of sentience, the committee must agree on *why* sentience matters morally. If they think "life" or "intelligence" matters, degrees of sentience is irrelevant.
      *   *Revised Structure:*
          1.  **Moral Status Ground:** Why do we care? (Capacity to suffer/flourish vs. mere biological function).
          2.  **The Phenomenal Cut:** Distinguishing Nociception (reflex) from Pain (valenced experience).
          3.  **The Gradation Claim:** Once we accept experience matters, acknowledge uncertainty and variation (degrees).
          4.  **The Decision Rule:** How to act under uncertainty (Precautionary Principle/Heuristic).
      *   *Correction:* The user's guess is good, but needs the "Why Experience?" step firmly established before the "Reflex vs. Experience" distinction.

  3.  **Evaluate the Carrier Example (Insect vs. Robot):**

      *   *User's idea:* Indistinguishable heat avoidance.
      *   *Strengths:* Forces focus on internal mechanism, not output. Highlights the "Hard Problem."
      *   *Weaknesses:* Can be too abstract. Needs to ensure the robot isn't just seen as "obviously not sentient" (dismissal) or "obviously a trick" (reductio).
      *   *Requirements:*
          *   Must lack: Biological baggage (blood, evolution) that triggers knee-jerk empathy or disgust.
          *   Must have: Functional complexity sufficient to make the "reflex" explanation non-trivial (e.g., learning, not just a thermostat).
          *   Crucial addition: The *uncertainty* must be palpable. We don't *know* the insect feels, we infer it. We *know* the robot doesn't (currently), but imagine if we didn't.
      *   *Refinement:* Use the example to show that behavior is necessary but insufficient evidence.

  4.  **Sequence the Misconceptions:**

      *   *List:*
          1.  Degrees = one measurable quantity.
          2.  All-or-nothing.
          3.  No line = anything goes.
          4.  Behavior settles it.
          5.  Single axis (dimmer).
          6.  Robot as reductio.
      *   *Logical Flow:*
          *   Start with **Behavior** (Address early, during the Carrier Example). If they think behavior decides it, the rest fails.
          *   Move to **All-or-nothing vs. Degrees** (Address when introducing the gradation framework).
          *   Address **Single Axis/Dimmer** (Refine the degree concept).
          *   Address **No line = anything goes** (Address when moving to decision making/heuristic).
          *   Address **Robot as Reductio** (Address during the robot part of the carrier).
          *   Address **One measurable quantity** (Tie into Single Axis).
      *   *Integration:* Don't list them as "Misconceptions." Weave them into the argument flow where they naturally arise as objections.

  5.  **Place the Heuristic (Spine vs. Closer):**

      *   *Option A (Spine):* Risk of reducing ethics to a checklist too early. Might stifle the conceptual groundwork.
      *   *Option B (Closer):* Acts as the tool to resolve the tension created by the conceptual work. "Okay, we agree it's hard and graded. Now how do we vote?"
      *   *Recommendation:* **Closer.** The session needs to build the *conceptual necessity* of the heuristic first. If you start with the heuristic, they will treat it as a bureaucratic box-ticking exercise. If you end with it, it's the solution to the philosophical problem you just posed.
      *   *Caveat:* Introduce the *components* of the heuristic throughout the session, but reveal the *matrix/scoring* at the end.

  6.  **Determine Exclusions:**

      *   *Time:* 90 minutes is tight for 12 people + complex philosophy.
      *   *Exclude:* Specific neural correlates (too technical). Specific legal statutes (distracts from ethical principle). Deep dive into AI architecture (distracts from ethical status).
      *   *State Openly:* "We are not deciding the specific cases today; we are building the lens through which to decide them."

  7.  **Drafting the Final Question:**

      *   *Goal:* Test grasp of gradation vs. caution.
      *   *Bad Question:* "Should we protect insects?" (Yes/No).
      *   *Good Question:* Needs to force a trade-off based on the axes.
      *   *Idea:* A case where evidence is low, but cost of error is high. Or a case where the "dials" conflict.
      *   *Selection:* A scenario where the "dimmer" view fails but the "multi-axis" view works.

  8.  **Review and Refine (Self-Correction during drafting):**

      *   *Check:* Did I address the "Reflex vs. Valenced" dependency? Yes, emphasized it needs the "Why Experience?" precursor.
      *   *Check:* Is the carrier example robust? Need to ensure the robot isn't dismissed too easily. Suggest making the robot's behavior adaptive, not just reactive.
      *   *Check:* Heuristic placement. I'm sticking with "Closer" but suggesting the *axes* are introduced earlier.
      *   *Check:* Tone. Needs to be professional, structured, and respectful of the user's expertise while offering firm guidance.

  9.  **Final Polish:** Organize into clear sections: Conceptual Architecture, The Carrier Example, Sequencing Misconceptions, The Heuristic, Exclusions, and The Final Question. (Proceed to generate output).

  *(Self-Correction on the Dependency Structure)*: Wait, the user asked "What has to be in place before degrees of sentience is a coherent thing to say?"
  My answer needs to be precise.
  1. Moral Relevance of Experience (Sentience matters more than life/intelligence).
  2. Distinction between Function and Feeling (Nociception vs. Pain).
  3. Epistemic Humility (We can't know for sure, so we deal in probabilities/degrees).
  *Then* Degrees makes sense.

  *(Self-Correction on the Heuristic)*: If I make it the closer, how do I ensure it's not rushed? I should advise the user to introduce the *axes* conceptually during the discussion, then unveil the *tool* at the end.

  *(Self-Correction on Final Question)*: It needs to distinguish between "I'm scared so I'll say yes" (Caution) and "I understand the trade-off" (Gradation).
  Question: "If we discover a mechanism in the robot that mimics the insect's uncertainty behavior, does the moral weight shift, even if the biology is absent?"
  Actually, better: "In which scenario do we apply *more* oversight: A high-certainty insect with low pain capacity, or a low-certainty robot with high potential cost of error?" This tests the Cost of Error axis specifically.

  Let's refine the Final Question to be more punchy.
  "Which case demands more scrutiny: a creature we are 90% sure feels a little, or a system we are 10% sure feels a lot?"
  This tests the multiplication of Probability x Magnitude.

  Okay, ready to write.cw
answer: |-
  Here is a structural plan for your ninety-minute session. It validates your instincts while correcting the dependency order to ensure the philosophical foundation holds before you build the policy framework on top of it.

  ### 1. The Dependency Structure (Conceptual Architecture)

  Your instinct on *Reflex vs. Valenced Experience* is correct, but it is not the first step. If the committee believes moral status derives from *life* (biological vitality) or *intelligence* (cognitive capacity), degrees of sentience will not resonate.

  You must establish this specific chain of dependence, in this order:

  1.  **The Moral Ground:** Establish that **experience** (the capacity to be better or worse off from one's own perspective), not life or intelligence, is the prerequisite for being "wronged." (This excludes plants and standard machines immediately).
  2.  **The Phenomenal Cut:** Distinguish **nociception** (damage detection/avoidance reflex) from **pain** (negative valenced experience). This is required to make the insect case non-trivial.
  3.  **The Epistemic Gap:** Acknowledge that we cannot directly observe experience, only infer it. This creates the space for uncertainty.
  4.  **The Gradation Claim:** Because inference is probabilistic and mechanisms vary, moral status is not a binary switch but a **spectrum of probability and capacity**.

  **Advice:** Do not start with "degrees." Start with "why we are here." If you skip step 1, the lawyers will argue about legal personhood, and the clinicians will argue about biological definitions of life. Lock in *experience* as the currency of ethics first.

  ### 2. The Carrier Example (Insect vs. Robot)

  Your pairing is strong, but for the session to hang off it, the example must be tuned to prevent easy dismissal.

  *   **What it must have:** **Adaptive Complexity.** The robot cannot be a simple thermostat. It must exhibit learning or habituation (e.g., if the heat is harmless but persistent, the robot stops withdrawing; if the insect does the same, is it fatigue or learning?). This forces the committee to admit that behavior *correlates* with sentience but does not *constitute* it.
  *   **What it must conspicuously lack:** **Evolutionary Continuity.** The insect shares DNA with us; the robot does not. You must explicitly bracket this. Ask them to imagine the insect is a synthetic biological construct, or the robot is built from organic components. Remove the "biology = magic" bias.
  *   **The Pivot:** Use this example to kill the "Behavior Settles It" misconception early. If behavior were sufficient, the robot would be sentient. If mechanism were sufficient (and known), the insect would be a machine. Since they behave alike, the committee must confront the **inference gap**.

  ### 3. Sequencing the Misconceptions

  Do not present these as a list of "errors to avoid." Introduce them as **objections** that naturally arise during the argument flow. Head them off at these specific points:

  1.  **"Behavior settles it"**: Address this **during the Carrier Example**. When they say "The insect writhes, so it suffers," point to the robot. When they say "The robot is code, so it doesn't," point to the insect's nervous system which is also a kind of code.
  2.  **"Robot as Reductio"**: Address this **immediately after**. If they say "If you think the robot might count, your theory is broken," correct them: "The theory isn't that the robot *is* sentient, but that we need a framework for when we *don't know*."
  3.  **"All-or-nothing"**: Address this **when moving to the Moral Ground**. Show that evolution does not produce binary switches; nervous systems scale. If capacity scales, moral weight likely does too.
  4.  **"Single Axis/Dimmer" & "One measurable quantity"**: Address these **together** when defining "Degrees." Explain that sentience is not one volume knob but a mixing desk (intensity, duration, self-awareness, emotional range). This prevents them from trying to find a single "sentience score."
  5.  **"No line = anything goes"**: Address this **last**, just before introducing the heuristic. This is the anxiety that drives them back to binary rules. You resolve this not by drawing a line, but by drawing a **decision rule**.

  ### 4. Placement of the Heuristic

  **Make the Heuristic the Closing Move, not the Spine.**

  *   **Reasoning:** If you start with the heuristic (Evidence, Mechanism, Cost of Error), it becomes a bureaucratic checklist. The committee will treat it as a box-ticking exercise without understanding *why* the axes exist.
  *   **Strategy:**
      *   **Minutes 0–60:** Build the philosophical tension using the Carrier Example. Let them feel the discomfort of not knowing where the line is.
      *   **Minutes 60–75:** Introduce the three axes as the *solution* to that discomfort. "Since we cannot find a hard line, we must manage the risk."
      *   **Minutes 75–90:** Apply the heuristic to the two real cases (Insects, Robot) and finalize the guidance.
  *   **Why this works:** The heuristic becomes the tool that resolves the philosophical problem, rather than the definition of the problem itself.

  ### 5. Exclusions (What to Leave Out)

  You have 90 minutes. You must explicitly state what you are **not** doing to prevent scope creep.

  *   **Exclude:** Specific neural correlates (e.g., "Do they need a cortex?"). *Say:* "We are not neuroscientists; we are assessing evidence standards."
  *   **Exclude:** Current legal statutes. *Say:* "We are drafting ethical guidance that may exceed legal minimums."
  *   **Exclude:** The specific engineering architecture of the robot. *Say:* "We are assessing the ethical category, not auditing the code."
  *   **Exclude:** A definitive verdict on the specific cases today. *Say:* "Today we are calibrating the instrument, not weighing the objects."

  ### 6. The Final Question

  You need a question that distinguishes between **caution** (a vague feeling of "better safe than sorry") and **gradation** (a structured understanding of the axes).

  **The Question:**
  > "Imagine two cases: Case A is a biological organism where we have **high evidence** of mechanism but **low capacity** for suffering. Case B is an artificial system where we have **low evidence** of mechanism but a **high potential cost** of error if it *does* suffer. Under a binary view, one of these is clearly 'in' and one is 'out.' Under our graduated view, which case demands *more* ethical oversight, and why?"

  **What this tests:**
  *   If they answer based on biology ("Case A is alive, so it counts"), they missed the **Mechanism/Evidence** axis.
  *   If they answer based on certainty ("Case A is sure, so it counts"), they missed the **Cost of Error** axis.
  *   If they grasp the gradation view, they should recognize that **Case B** might demand *more* oversight (or at least significant oversight) because the **Asymmetry of Cost** (wrongly denying protection to a sentient being) outweighs the **Low Evidence**, whereas Case A's **Low Capacity** reduces the moral stakes despite the High Evidence.

  This forces them to use the heuristic's multiplication logic (Probability × Magnitude × Cost) rather than a binary threshold.
