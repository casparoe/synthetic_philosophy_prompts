answer: |-
  **Temporal Drafts Ltd. – Frequently Asked Questions**

  **1. What is the Color Phi Standard Package?**
  The Color Phi Standard is our flagship demonstration of temporal coherence. During the procedure, two static lights flash in rapid succession at different locations. Our clients typically report seeing a single light moving between the locations and changing color mid-trajectory. This illusion confirms that your neural processing latency is within normal parameters. The Standard Package includes one session. Premium subscribers may opt for the Orwellian or Stalinesque Tier to manage how this sequence is archived in long-term memory.

  **2. What is the difference between the Orwellian and Stalinesque Tiers?**
  Both tiers ensure a seamless narrative flow of consciousness, but they utilize different archival protocols. The Orwellian Tier allows the initial sensory data to reach conscious awareness before editing the memory trace to align with subsequent information. Think of it as a retroactive memoir adjustment. The Stalinesque Tier intercepts the sensory data before it is staged for conscious presentation, ensuring only the finalized, coherent version ever reaches the theater of the mind. Think of it as pre-emptive narrative sanitization. Both result in the same reported experience: a smooth, logical stream of events without jarring discontinuities.

  **3. How can I tell which Tier I am currently subscribed to?**
  You cannot. This is a feature, not a bug. From the first-person perspective, both tiers produce identical phenomenological outcomes. If you are on the Orwellian Tier, you do not remember the edit because the edit *is* your memory. If you are on the Stalinesque Tier, you do not remember the edit because the raw data was never conscious. Attempting to introspect to determine your tier will only generate further data that is subject to your current tier's editing protocols. We recommend selecting the tier that best fits your budgetary constraints and comfort with historical revisionism.

  **4. I purchased the Orwellian Tier. Did I actually experience the original red flash, or was it always green?**
  According to your service agreement, you did experience the red flash. The Orwellian Tier guarantees that the initial qualia were instantiated before being overwritten by the green data. You saw red, but your current memory recalls green. This ensures that your brain did not waste processing power on unnecessary censorship, though it does require robust post-hoc reconciliation services. Please note that insisting you "remember seeing red" is considered a symptom of cache corruption and is not covered under standard support.

  **5. I purchased the Stalinesque Tier. Did I actually experience the original red flash?**
  No. Under the Stalinesque protocol, the red flash was filtered out during pre-conscious processing. The experience of green was the only experience that occurred. There was no moment where you saw red and then changed your mind. To suggest otherwise is to imply a failure in our pre-emptive sanitization filters. Your experience was seamless from the outset. We advise against dwelling on the hypothetical red flash, as ruminating on non-events can cause temporal dysphoria.

  **6. Can I switch Tiers mid-experience?**
  No. Switching Tiers requires a full system reboot of the conscious stream, which results in total amnesia for the duration of the transition. Most clients find it easier to accept their current narrative architecture. If you feel your experience is disjointed, please contact support to schedule a coherence patch rather than attempting a Tier migration.

  **7. What if I remember the editing process happening?**
  This is a known anomaly called the "Homunculus Glitch." It occurs when the editing mechanism itself becomes the object of attention. If you recall the editor editing the memory, that memory has also been edited. You are remembering a simulation of remembering an edit. Please submit a ticket, and we will schedule a wipe for that specific meta-cognitive loop.

  ***

  **WARRANTY ADDENDUM**

  Temporal Drafts Ltd. guarantees subjective continuity for the duration of the subscription period. We do not guarantee objective temporal accuracy, as no such metric is available for verification. Clients acknowledge that the "present moment" is a constructed interface and not a reliable timestamp. Refunds are not available for experiences that the client claims did not happen, as the claim itself constitutes evidence that the experience was successfully integrated. By using our services, you agree that your past is whatever our records say it is, regardless of when you believe it occurred. Liability is limited to the cost of the package. We are not responsible for existential distress arising from the realization that the Cartesian Theater has no projectionist.
