      *   **Specific Requirements:**
          *   No tables, no bullet points.
          *   Ordinary prose (email style).
          *   Map the analogy: Price, Seller, Buyer, Who sets amount, What is paid for, What the bill covers.
          *   Identify where the mapping breaks (quoted tips, discretion, direct payment, wage laws, international variance).
          *   Determine which breaks are incidental vs. damaging to the "owed" conclusion.
          *   Address the tourist/ignorance question (does the price story hold?).
          *   Address the generalization to other norms (queueing, jaywalking).
          *   **Crucial:** No fence-sitting ("it's complicated"). Take a stance on the logic and load-bearing parts.

  2.  **Deconstruct the "Tip as Price" Analogy:**
      *   *Price:* The menu price + expected tip.
      *   *Seller:* The restaurant (employer) primarily, but the server is the specific vendor of service.
      *   *Buyer:* The diner.
      *   *Who sets amount:* Menu prices are set by the restaurant. Tips are suggested by the restaurant but finalized by the buyer. This is a major crack.
      *   *What is paid for:* Menu price = food + overhead + base labor cost. Tip = service labor subsidy + performance bonus.
      *   *Bill proper:* Covers food, rent, utilities, base wages (if not tipped out).
      *   *Tip:* Covers the gap between base wage and living wage + incentive.

  3.  **Identify the Breaks in the Mapping:**
      *   *Quoted in advance:* Prices are fixed/known. Tips are variable/suggested.
      *   *Discretion:* You can't negotiate a price down because you didn't like the vibe, but you can tip less.
      *   *Payment flow:* Tips often bypass the business ledger (cash) or are treated differently for tax/wage purposes.
      *   *Legal status:* In the US, tips can count toward minimum wage obligations (tip credit). This means the employer *expects* the customer to pay part of the wage. This supports the "price" theory actually.
      *   *International variance:* If it were a universal "price" of dining, it would be consistent. It's not. It's a local social contract.

  4.  **Evaluate the "Owed" Conclusion:**
      *   If it's a price, it's owed contractually.
      *   If it's a social norm, it's owed morally/conditionally.
      *   The flatmate's argument relies on the *economic reality* (employer sets wage assuming tip) rather than the *legal contract* (menu price is the legal debt).
      *   *Tourist:* Do they owe it? If it's a price, yes (ignorance of law/tax isn't an excuse). If it's a norm, maybe less so, but still socially obligated upon entry.
      *   *The "Smuggle":* She is conflating *economic necessity* with *contractual obligation*.

  5.  **Address the Generalization (Queueing/Jaywalking):**
      *   Tipping is a financial transaction within a specific business relationship.
      *   Queueing/Jaywalking are public order norms.
      *   The logic "local rules bind visitors" holds for both, *but* the mechanism differs.
      *   Tipping: You enter a contract (implicit) by ordering.
      *   Queueing: You enter a public space governed by law/custom.
      *   Her slide is risky because tipping has a specific economic structure that queueing doesn't.

  6.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Direct, analytical, email-style prose. No lists.
      *   *Section 1: Mapping the Analogy.*
          *   Start by laying out her model.
          *   Buyer: Diner. Seller: Restaurant (employing server).
          *   Price: Menu + Tip.
          *   What bill covers: Food, overhead, base wage.
          *   What tip covers: The rest of the wage, performance incentive.
          *   Who sets it: Restaurant suggests, Diner finalizes. *Here is the first crack.*

      *   *Section 2: Where it Breaks.*
          *   Focus on the "Who sets amount" issue. A price is fixed; a tip is variable.
          *   Focus on the legal enforceability. You can be sued for the bill; you can't be sued for the tip.
          *   Focus on the international variance. A price for a Coke is roughly stable globally relative to economy. Tipping is binary (US vs Japan).
          *   *Crucial Point:* The "Tip Credit" law. This actually *helps* her argument economically. The employer legally underpays expecting the customer to make up the difference. This makes it functionally a surcharge.

      *   *Section 3: The Tourist and the "Owed" Conclusion.*
          *   Does the tourist owe it?
          *   If it's a price: Yes, strictly.
          *   If it's a norm: Yes, because of participation.
          *   *Verdict:* The "Price" story is a useful fiction to explain the *economic flow*, but it fails as a *contractual definition*.
          *   The tourist owes it not because it's a price, but because they participated in a system with known rules. It's a "participation fee" rather than a "sticker price."
          *   Her conclusion (you owe it) is mostly right, but her reasoning (it's a price) is legally wrong.

      *   *Section 4: Generalization to Queueing/Jaywalking.*
          *   She is reusing the word "rule."
          *   Tipping is a private economic norm. Queueing is a public social norm.
          *   The binding force is different. Tipping is binding because of the wage structure (economic). Queueing is binding because of order/safety (social).
          *   Her generalization holds on the "visitor should follow local custom" level, but fails on the "it's all the same kind of debt" level.

      *   *Refining the "Smuggle":*
