answer: |-
  Subject: Re: The tipping audit

  Here is the breakdown of the analogy your flatmate is using, audited for structural integrity. To take her position seriously, we have to map the transaction exactly as she describes it. In her model, the buyer is the diner and the seller is effectively the server, though legally employed by the restaurant. The price is the sum of the menu cost plus the customary gratuity. The menu bill covers the food, the overhead, and the base wage that the employer is legally willing to pay, while the tip covers the remainder of the labor cost required to get the server to show up and do the job. In this framing, the restaurant sets the menu price, but the diner sets the final component of the price, ostensibly based on performance, though your flatmate argues it should be treated as fixed.

  The first place this mapping fractures is on the question of who sets the amount. In a standard price model, the seller sets the price and the buyer accepts it or walks away. In the tipping model, the seller suggests a range, but the buyer has final authority to adjust the total after the service is consumed. This is not how prices work; this is how bonuses work. If you buy a shirt, the tag says twenty dollars, and you cannot pay fifteen because the stitching was loose. You can return the shirt, but you cannot unilaterally rewrite the price. With a tip, you are allowed to assess the quality of the service and adjust the payment accordingly. Your flatmate tries to wave this away by saying the tip is for the standard service, but the mechanism itself invites discretion. That discretion is not incidental dressing; it is a fundamental break in the "price" analogy because it transfers the pricing power from the seller to the buyer.

  The second break is enforceability. A price is a debt. If you do not pay the menu bill, the restaurant can call the police or sue you. If you do not pay the tip, there is no legal recourse. This is not just a matter of them not bothering to sue; the law does not recognize the tip as a debt owed by the customer to the server or the house in the same way it recognizes the menu price. This matters because it defines the nature of the obligation. A price is a contractual obligation. A tip is a social obligation backed by economic pressure, not law. The fact that the money often goes directly to the worker or is treated differently for tax purposes reinforces that it sits outside the standard ledger of the business transaction.

  However, there is one place where her analogy is surprisingly load-bearing, and you need to be careful not to dismiss it. In the United States, the law allows employers to pay servers below the minimum wage on the assumption that tips will make up the difference. This is called a tip credit. Economically, this means the employer is pricing the labor with the expectation that the customer will subsidize the wage. In this specific sense, the tip functions as a surcharge that the business has outsourced to the customer to collect. This supports her claim that the tip is part of the true cost of the meal. But even here, it is a cost the business expects to be covered, not a price the customer is legally bound to pay. The business absorbs the risk if the customer stiffes the server, not the customer. So while the economic flow looks like a price, the legal liability does not.

  This leads directly to your question about the tourist. Your flatmate argues the tourist owes the tip because it is a price, and ignorance of a price is not an excuse, just like ignorance of sales tax. This is where her reasoning is doing heavy lifting for a conclusion it cannot support. The tourist does owe the tip, but not because it is a price. They owe it because by entering the restaurant and ordering food, they entered a local social contract. It is less like walking out on a bill and more like wearing shoes in a shop where shoes are required. The obligation comes from participation in the system, not from a sticker on the wall. If we accept her "price" argument, we run into the problem of international variance. A Coke costs money everywhere. A tip only exists in some cultures. If it were a true price of dining, it would be universal to the activity of dining. It is not. It is a local norm. Therefore, the tourist owes the money because they are participating in a local norm, not because they are settling a contractual debt. Her conclusion is right, but her "price" story is the wrong vehicle to get there.

  Finally, regarding her slide into queueing and jaywalking, she is reusing the word "rule" to do two different jobs. Tipping is a private economic norm within a specific transaction. Queueing is a public social norm regarding order and fairness. The binding force for queueing is mutual respect and public order; the binding force for tipping is the wage structure and server livelihood. Her generalization that "visitors must follow local rules" holds true for both, but the reason why is different. You don't tip because of queueing logic; you tip because of the wage subsidy logic. If she argues that tipping is binding for the exact same reason jaywalking is binding, she is glossing over the economic coercion involved in tipping. You can jaywalk and no one loses money. You can skip a tip and a specific person loses income.

  So, to locate what she smuggled in: she smuggled moral obligation into contractual definition. She wants the rigidity of a contract to enforce a social norm. The "price" analogy is a post-hoc justification used to make the social norm feel as mandatory as a tax. The tourist is obligated to pay, but the obligation is moral and customary, not contractual. If she wants to win the argument, she should drop the "it is a price" claim and argue that "it is a mandatory participation fee for the local labor market." That is the actual truth of the situation. The price analogy breaks on discretion and enforceability, but the conclusion that the money is owed survives if you switch the foundation from contract to custom. She is right that you should pay, but wrong about why.
