answer: |-
  ### Assumptions

  We are treating this as a purely conceptual project; empirical feasibility is out of scope. An "open question" counts only if resolving it changes theoretical viability or action-guidance. We assume the group seeks high-leverage outputs (papers, frameworks) that influence the broader effective altruism or academic landscape. Tractability is defined by whether armchair analysis can make progress without data. Neglectedness refers to gaps in the specific suffering-focused literature, not ethics generally.

  ### The ranking

  1.  **Axiology vs. Moral Uncertainty:** This is the root. Is suffering-focused ethics (SFE) a claim about what is *good* (negative utilitarianism) or a heuristic for *uncertainty* (risk-aversion)? This is maximally upstream. If SFE is merely a decision rule under uncertainty, it dodges metaphysical bullets about value monism. If it is axiological, it requires robust defense against standard objections. Tractability is high for philosophers; it requires analyzing meta-ethical commitments, not data. It is neglected because proponents often slide between the two to avoid criticism. Everything downstream depends on this: if it's just uncertainty, the "empty world" objection loses force; if it's axiology, aggregation becomes critical.

  2.  **The "Empty World" Reductio:** The objection that SFE implies preferring a world with no beings over one with happy beings and minor suffering. This is a viability check. If the view cannot bite this bullet or deflect it via modal ethics, it is dead on arrival for most interlocutors. Tractability is medium; it requires nuanced work on existence vs. non-existence comparisons. It is moderately neglected because many dismiss it too quickly rather than engaging the modal logic. Leverage is high: solving this determines whether the view is defensible in public discourse or academic seminars.

  3.  **Aggregation and Lexical Thresholds:** How much suffering outweighs how much happiness? Without a lexical threshold, SFE collapses into standard utilitarianism; with one, it risks paralysis. This is upstream of prioritization. Tractability is high; the tools of population ethics (spectrums, intuitions pumps) are ready-made. It is neglected specifically regarding *suffering* thresholds rather than general welfare. Leverage is medium-high: this dictates whether you prioritize preventing extreme agony over reducing mild annoyance, guiding resource allocation.

  4.  **Astronomical Suffering (s-risks):** This is the high-stakes application. It asks if future technological scenarios create distinct categories of suffering risk. It is downstream of the axiology and aggregation questions; you cannot prioritize s-risks without knowing why suffering matters and how it aggregates. Tractability is medium; it involves conceptual mapping of risk scenarios rather than empirical forecasting. It is growing in attention but lacks philosophical grounding. Leverage is high regarding impact, but low regarding theoretical foundation.

  ### What I'd cut

  Drop **Wild Animal Suffering** entirely. For a group with no empirical budget, this is a trap. The philosophical obligation depends on feasibility, and feasibility is an ecological question. You will stall on "can we actually intervene?" rather than "should we?" It consumes hours debating biology instead of ethics.

  Drop **Procreation Asymmetry** as a standalone project. It is often distinct from suffering-focused ethics (one can be SFE without accepting Benatar's asymmetry). Treat it as an application of the Core Claim and Aggregation questions. If you solve the axiology, the procreation implication follows naturally. Don't silo it; it's derivative work.

  ### What would move a question up or down

  If a major paper emerges defending lexical value thresholds successfully, move **Aggregation** down; the toolkit would be set. Conversely, if the effective altruism community shifts funding heavily toward s-risk reduction, move **Astronomical Suffering** up due to immediate demand for conceptual clarity. If a new framework for moral uncertainty (e.g., meek utilitarianism) gains traction, move **Axiology vs. Uncertainty** up, as it would reshape the foundational defense.

  ### Bottom line

  Focus your first semester on distinguishing whether SFE is an axiological claim or a heuristic under uncertainty. If you cannot resolve that, any work on aggregation or s-risks rests on sand.
