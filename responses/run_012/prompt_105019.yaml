prompt: |-
  I have no academic training in philosophy, but I have been trying to think through the old evidence problem in Bayesian confirmation theory on my own, and I have hit a maneuver that I cannot tell whether it is a real solution or just a verbal trick. The problem, as I understand it, is that if a fact E is already certain for a scientist—already part of her background knowledge before a hypothesis H is even formulated—then conditionalizing on E cannot raise her credence in H, because her probability for E is already 1. Yet in real cases a theory seems to gain support from its ability to accommodate facts that were known all along. My proposed maneuver is what I call the shadow-prior move: instead of asking how much E confirms H, conditionalize on the higher-order proposition that H entails E, or more carefully, on the event that the scientist has discovered that H entails E. The thought is that this discovery event can have a probability less than 1 even when E itself has probability 1, and it might therefore carry the missing confirmation. My question is not whether this move is clever; it is whether it works. Specifically, I want your credence that the shadow-prior move genuinely solves the old evidence problem for Bayesian confirmation theory, in the sense that it allows a Bayesian agent whose prior already assigns probability 1 to E to increase her credence in H on account of H’s entailing E, without changing her prior and without conditionalizing on E, rather than merely restating the problem in a way that presupposes the answer.

  Please give me your credence as a number between 0 and 1, and then decompose that number into the sub-questions you think it depends on. I would like rough probabilities for at least these: (a) that the old evidence problem is a genuine problem for Bayesianism rather than an artifact of misapplying conditionalization; (b) that the discovery event can be specified precisely enough to have a determinate probability without circularity; (c) that conditionalizing on that event captures the same evidential boost as the scientist’s actual reasoning rather than merely tracking a psychological fact about her; (d) that the move generalizes from cases of accommodation to cases of prediction, or at least does not collapse when the hypothesis was constructed partly to fit the old fact; and (e) that the move is compatible with core Bayesian commitments, such as the idea that the order in which evidence arrives should not matter and that only probabilities of the evidence under the hypotheses should matter. Say how those probabilities combine into your final number, and state explicitly whether you are treating them as independent or not.

  I have my own credence, about 0.35, and a friend who thinks the move is basically correct puts it at about 0.75. I would like to know which sub-question most likely explains the gap between us, and which single piece of argument or evidence would move your number the most. Please keep the whole response under 700 words, lead with your bottom-line credence, then give the decomposition as a compact list, and end with one short paragraph on what would change your mind.
