      *   *Section 2: Where the Confusion Lies.*
          *   Historians vs. Historians: It's not just facts; it's *causal weighting*. Fischer = Intent is primary cause. Structuralists = System is primary cause. This is Methodological.
          *   Historians vs. Philosophers: Definition of "Agent." Historians use shorthand ("Germany"); Philosophers take it literally. This is Semantic/Methodological.
          *   Versailles: The conflation of Liability (paying for damage) with Culpability (moral sin). This is the Moral/Legal confusion.
      *   *Section 3: Is the Historians' Fight Empirical?* It's "Theory-Laden Empiricism." They agree on the timeline but disagree on the *counterfactuals*. (If Germany hadn't pushed, would war still have happened?). This is methodological.
      *   *Section 4: Path to Progress.*
          *   Don't seek a unified causal criterion (impossible).
          *   Do separate Liability from Culpability.
          *   Do acknowledge that "Cause" in history is pluralistic.
      *   *Conclusion:* Summarize the shape. The "War Guilt" label is the problem.

  7.  **Refining the Tone:**
      *   Academic but accessible.
