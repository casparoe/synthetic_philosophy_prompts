answer: |-
  Your hypothesis is not only roughly right; it is the precise diagnostic tool needed to untangle this seminar. You have correctly identified that "The War-Guilt Question" is not a single question but a conflation of three distinct inquiries that operate under different rules of evidence and logic. The intractability you are sensing is not due to a lack of data, but to a category error in the framing of the debate.

  Here is the breakdown of where the dispute is stalled, where it is merely verbal, and which "heading" is doing the damage.

  ### 1. Testing the Hypothesis: The Three Questions

  Your tripartite division holds up well against the literature.

  *   **The Empirical Question:** *What happened?* (e.g., Did Bethmann-Hollweg encourage Vienna to attack Serbia? Did the Schlieffen Plan necessitate invading Belgium?)
      *   **Status:** largely settled, though details are debated. Most serious scholars agree Germany issued the "Blank Check," that Russia mobilized early, and that alliance structures tightened the screw.
      *   **The Impasse:** Historians aren't actually fighting much here anymore. The archives are open. The Fischerites and Structuralists generally agree on the *sequence* of events.
  *   **The Methodological Question:** *What counts as a cause?*
      *   **Status:** This is the engine of the historians' stalemate.
      *   **The Impasse:** This is where the Fischer line and the Structuralists diverge. For a Fischerite, a cause must involve **agency and intent**. If the German leadership saw the risk and took it anyway, that is the cause. For a Structuralist, a cause is a **constraint or condition**. If the alliance system made war probable regardless of intent, the *system* is the cause. They are using different causal models (Agency vs. Structure) to weigh the same empirical facts.
  *   **The Moral/Legal Question:** *Who is responsible?*
      *   **Status:** This is where the philosophers and the Versailles shadow enter.
      *   **The Impasse:** This conflates **liability** (who pays for the damage) with **culpability** (who sinned). Article 231 was about liability (reparations), but the public discourse turned it into culpability (moral guilt). Philosophers are right that "collective guilt" is metaphysically dubious, but historians are right that "state responsibility" is a functional legal category. They are arguing past each other because one is doing metaphysics and the other is doing political history.

  ### 2. Which Heading Is Doing the Damage?

  The heading doing the most damage is **The Moral Question**, specifically the word **"Guilt."**

  "Guilt" implies a moral agent with a conscience who could have chosen otherwise.
  *   **For the Philosophers:** This triggers the problem of collective agency. (Can "Germany" feel guilt?)
  *   **For the Historians:** This triggers the need to find a specific villain (Bethmann-Hollweg? The Kaiser?) to satisfy the moral requirement of the word.
  *   **For the Structuralists:** This makes their argument impossible. If the war was caused by a "tragic system" where no one could stop the train, moral guilt is incoherent. But because the debate is framed as "Guilt," they are forced to defend the morality of the actors rather than the inevitability of the system.

  If you renamed the seminar "The Causal and Liability Question," the philosophers would have less to say, and the historians would be freer to discuss structural constraints without sounding like they are exonerating moral monsters.

  ### 3. Is the Historians' Fight Empirical or About Standards?

  The historians' fight is **methodological disguised as empirical.**

  You asked if it is really empirical or mostly a disagreement about standards. It is the latter.
  *   **The Evidence:** Both sides read the same memos. Both sides know about the mobilization timetables.
  *   **The Standard:** They disagree on **counterfactual weight**.
      *   **Fischerites** ask: "If Germany had not pushed Austria, would there have been a general war?" If the answer is "No," then Germany is the cause. They prioritize *necessary conditions* created by specific actors.
      *   **Structuralists** ask: "Given the alliance system and the cult of the offensive, was a war likely regardless of this specific crisis?" If the answer is "Yes," then the specific German decisions are merely the spark, not the fuel. They prioritize *sufficient conditions* created by the environment.

  This is not a dispute about facts; it is a dispute about **causal proximity**. How close to the explosion must a cause be to count as *The* Cause? Is it the match (Germany) or the gas in the room (The Alliance System)? Both are empirically true, but they serve different explanatory goals. The stalemate exists because neither side accepts the other's standard for what constitutes a "sufficient explanation."

  ### 4. What Counts as Progress?

  Given this diagnosis, a verdict on blame is impossible and undesirable. Progress would look like the following:

  **A. Adopt Causal Pluralism (Methodological Progress)**
  The seminar should admit that historical causation is not singular. There is no "The Cause." There are:
  *   *Proximate causes* (The Blank Check).
  *   *Structural causes* (The Alliance System).
  *   *Permissive causes* (The belief that war would be short).
  Progress happens when a Fischerite admits that structural pressure limited German choices, and a Structuralist admits that German agency tightened those constraints. They are describing different layers of the same onion, not competing truths.

  **B. Separate Liability from Culpability (Moral/Legal Progress)**
  You must disentangle Article 231 from the concept of sin.
  *   **Liability:** A functional assignment of who pays for reconstruction. This can be assigned to a state ("Germany") as a legal fiction without implying every citizen or leader was morally wicked.
  *   **Culpability:** A moral judgment on specific decision-makers.
  Progress happens when the philosophers acknowledge that "State Responsibility" is a valid legal category even if "Collective Guilt" is a metaphysical error, and the historians acknowledge that establishing causal responsibility does not automatically settle the moral ledger.

  **C. Abandon the Search for a Shared Causal Criterion**
  Do not try to agree on a single definition of "cause." In history, "cause" is a pragmatic tool, not a scientific law.
  *   If you want to prevent future wars, the **Structuralist** cause is more useful (fix the alliances).
  *   If you want to understand diplomatic failure, the **Fischerite** cause is more useful (analyze the decision-making).
  Progress is recognizing that the "truth" you find depends on the question you are asking.

  ### Summary of the Shape of the Disagreement

  You are witnessing a **category collision**.
  1.  **Historians** are arguing about **explanatory priority** (Agency vs. Structure) but pretending it is a fight about **facts**.
  2.  **Philosophers** are arguing about **metaphysical agency** (Can a state intend?) while Historians are talking about **bureaucratic agency** (Did the Chancellor sign the order?).
  3.  **Everyone** is arguing under the banner of **"Guilt,"** which demands a moral verdict that historical methodology cannot provide and legal methodology does not require.

  **The Verdict on the Seminar:**
  The disagreement is stalled because everyone is trying to win the Moral Question using answers to the Empirical Question, while disagreeing on the rules of the Methodological Question.

  **The Path Forward:**
  Stop asking "Who is to blame?" Start asking:
  1.  "What specific decisions narrowed the options in July 1914?" (Empirical/Agency)
  2.  "What structural factors made those decisions seem rational at the time?" (Methodological/Structure)
  3.  "Does assigning financial liability require proving moral sin?" (Legal/Moral)

  If you separate these, the room will not necessarily agree, but they will finally understand *why* they are disagreeing. The fog will lift, not because the past has changed, but because the questions have finally been sorted.
