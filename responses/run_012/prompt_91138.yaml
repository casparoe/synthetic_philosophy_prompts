answer: |-
  Bottom line first
  Hobbes would dismiss program equilibrium as a clever geometric proof that fails to engage with the flesh-and-blood reality of human nature. He would argue that while the logic holds for machines, men are not bound by their own code unless forced to be so. The transparency required is impossible in the state of nature, where men hide their intentions to survive. Thus, the program is merely a covenant without a sword, vulnerable to the man who lies about his source or refuses to execute it. The sovereign remains necessary to enforce the conditions under which such transparency could ever be trusted. Logic cannot conquer fear; only power can.

  His own machinery
  Hobbes's entire political science rests on the opacity of the human mind and the inevitability of diffidence. He argues that covenants without the sword are but words because there is no security that the other party will perform. In his view, we know the intentions of men only by their actions, never by their professed rules. Program equilibrium attempts to make intentions visible through source code, but Hobbes would classify the code itself as a promise, not a physical constraint. Unless there is a power to punish the man who writes deceptive code or refuses to run the program, the incentive to defect remains. Reason is merely reckoning, and if the reckoning shows that cheating the code-checker yields survival or profit, the passions will drive the man to cheat. The seminar room itself presupposes a peace that the code is supposed to create; you have already assumed the sovereign to guarantee the safety of the exchange. Therefore, the mechanism does not replace the common power; it merely hides it behind the assumption of a secure environment. The sword is not removed; it is sheathed in the protocol rules that prevent hacking. Without a power to enforce the integrity of the code-exchange, the state of nature returns, and with it, the rational necessity of preemptive defection.

  The hardest objection
  "You tell me the code is transparent, but who guarantees the reader? In the state of nature, there is no secure server, no impartial compiler. If I can gain by submitting a program that mimics cooperation but defects upon execution, I am a fool not to do so. You say the program reads the other program, but I say the man writes the program. The man can build a simulator that shows one thing while the engine does another. This is no different than a man swearing an oath while hiding a dagger. You assume the code is the master, but the man is the master of the code. If the code binds him against his interest at the critical moment, he will smash the machine before he lets it ruin him. Fear of death drives us all; if your logical trap threatens my survival, I will not spring it. You have built a puzzle for angels, but I am writing for men. Until you have a power to punish the man who lies about his logic, your equilibrium is but a dream of the study. The sword must stand behind the screen, or the screen is merely a shield for the treacherous."

  What he'd have to give up
  If Hobbes accepts program equilibrium as a valid substitute for the sovereign, he must abandon his core anthropological claim that human intentions are fundamentally unknowable. He would have to concede that a man can be reliably bound by his own prior logical commitments without external threat. This undermines the necessity of the "common power to keep them all in awe." He would also have to expand his definition of power to include abstract logical constraints, not just physical force or human authority. This shifts his materialist philosophy toward a realm where ideas themselves can enforce compliance. Ultimately, he would have to admit that reason, properly structured, can master the passions without the fear of violent death. This breaks the link between security and coercion that defines his political solution.

  If I'm wrong
  The rival reading is that Hobbes would embrace this as the ultimate realization of the Laws of Nature, where reason finally bypasses the need for blood. He might see the program as the artificial person he always wanted, a sovereign made of logic rather than flesh. What would settle this is whether he believes the "reckoning" of reason can physically compel action. If he admits that a logical contradiction can hurt a man as much as a sword, he yields to the game theorists. If he maintains that only pain and death drive compliance, he rejects the code.
