      *   *Drafting Machinery:* Focus on the distinction between *words* and *power*. The code is just words unless it executes automatically. But who ensures it executes? The environment. The environment is the sovereign.
      *   *Drafting Objection:* Make it sound like Hobbes talking to the Foole. "You think you have hidden your heart, but you have only hidden it in syntax."
      *   *Drafting Give Up:* The immutability of human opacity.
