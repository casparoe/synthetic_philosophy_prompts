prompt: |-
  I am working through the section of Turing's 1950 paper in Mind where he turns from the imitation game to the practical question of how a thinking machine might actually be built. Rather than simulating an adult mind, he proposes building a child machine and then educating it, comparing the process to the schooling of a child, involving rewards and punishments, a built-in capacity for inference, and a degree of randomness, and yielding something far simpler at the outset than the adult intelligence one hopes to end up with. He adds that we cannot expect a good child machine at the first attempt, and that educating it would be a slow and substantial undertaking. Here is the gist of it in my own words rather than a quotation, and I would rather have help with the argument than with the exact wording or with any references.

  Please adopt the role of a philosopher of mind with a solid historical grasp of early computing, and think carefully before you answer. What is the force of the child machine proposal: is it a genuine research programme, a rhetorical move to disarm the objection that nobody has yet built a thinking machine, or a substantive claim about the nature of intelligence itself? Does Turing intend the analogy with human upbringing literally enough that he is committed to something like empiricism about the mind, so that the difference between a mind and a mere calculating engine lies in training rather than in architecture? And how does the proposal sit with his apparent commitment to determinism: if the machine's behaviour is fully fixed by its initial state together with the history of its training, in what sense does it learn anything, rather than merely being programmed by a longer and more devious route?

  Before giving your own view, please set out two or three competing readings of the passage and indicate what textual or philosophical considerations would tell in favour of each. Then argue for the reading you find most defensible and state the strongest objection to it. Write in British English.
