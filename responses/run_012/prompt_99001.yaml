      *   Ensure `leftOut` has `topic`, `whyOmitted`.

  9.  **Addressing the "Process vs. Product" Wrinkle in the Plan:**
      *   This needs to be explicit in the sequence or the example analysis. I will put it in the sequence as a specific step to validate their intuition that conception feels different than sculpture, without letting it derail the origin question.

  10. **Final Review against Constraints:**
      *   JSON format only? Yes.
      *   No citations? Yes.
      *   No explaining the position to the user? Yes (planning the explanation).
      *   Address the twin candidate? Yes.
      *   Address the modal vocabulary? Yes.
      *   Address the audience's expertise? Yes.

