      *   **Audience:** Nursing and embryology staff at a fertility clinic (dozen people, experienced, practical relationship to gametes/embryos, no metaphysics background).
      *   **Constraints:**
          *   Do not explain the position to me (the user); plan how *I* should explain it to *them*.
          *   Format: Single JSON object with specific fields (`sequence`, `carryingExample`, `misconceptions`, `comprehensionCheck`, `leftOut`).
          *   Specific content requirements:
              *   `sequence`: Array of objects (`step`, `whyHere`, `boardWork`).
              *   `carryingExample`: Object (`case`, `whyItCarries`, `mustLack`, `verdictOnMyCandidate`).
              *   `misconceptions`: Array of objects (`misconception`, `whenItSurfaces`, `howToHeadOff`).
              *   `comprehensionCheck`: Object (`question`, `whatAGoodAnswerShows`, `whatAWrongAnswerReveals`).
              *   `leftOut`: Array of objects (`topic`, `whyOmitted`).
      *   **Tone/Style:** Professional, precise, acknowledging the audience's expertise and the specific philosophical wrinkle (material origin vs. process).
      *   **Specific Wrinkle:** The user feels the standard "thing made from material" analogy works cleanly, but the conception case feels different (process vs. product). Needs addressing in the plan.
      *   **Candidate Case:** A case built around a single early embryo that might have split into twins. User wants a verdict on this.

  2.  **Deconstruct the Content:**

      *   **Audience Dynamics:** They handle gametes/embryos daily. They see them as *materials* to be graded, frozen, transferred. They likely have strong intuitions about identity tied to genetic makeup or the specific physical entity. They might conflate "this embryo" with "this future person" too easily, or vice versa. They might think the question is obvious (e.g., "Of course not, DNA makes the person" or "Of course, environment matters").
      *   **Philosophical Core:** Kripke's Origin Essentialism (could Nixon have been born of different parents?). The tension between material constitution and biological process.
      *   **The Wrinkle:** The user suspects a disanalogy between "statue made of clay" and "person made from gametes" because persons feel like processes. The plan needs to navigate this without getting bogged down in metaphysics jargon.
      *   **Time:** 50 minutes. Needs tight pacing.

  3.  **Drafting the Sequence:**
      *   Need to establish modal vocabulary (possibility/necessity) early, but simply.
      *   Need to ground it in their practice immediately.
      *   Need to introduce the origin question only after the framework is set.
      *   Need to address the "process vs. product" wrinkle.
      *   *Step 1:* Grounding in practice (the embryo in the dish).
      *   *Step 2:* Modal vocabulary (could vs. would).
      *   *Step 3:* The Origin Question (different gametes).
      *   *Step 4:* The Carrying Example (testing the intuition).
      *   *Step 5:* The Process/Product Wrinkle (addressing the user's specific concern).
      *   *Step 6:* Wrap/Check.

  4.  **Developing the Carrying Example:**
      *   *User's Candidate:* Single early embryo splitting into twins.
      *   *Critique:* This introduces *branching* identity (twins) rather than *origin* identity (different gametes for the *same* person). It confuses "could this embryo have been two people?" with "could this person have come from this other embryo?". It risks conflating numerical identity with qualitative similarity.
      *   *Recommendation:* Replace it. The core question is *Origin Essentialism*. A better case is the "Same Person, Different Gametes" scenario directly.
      *   *Proposed Case:* "Patient A" vs. "Patient A*". Same parents, same time, but a different sperm fertilizes the egg. Is it the same child?
      *   *Why:* It isolates the variable (the gamete) without introducing twinning/splitting complications which muddy numerical identity.
      *   *Verdict:* Replace it.

  5.  **Identifying Misconceptions:**
      *   *Genetic Fallacy:* "DNA determines identity." (Surfaces early).
      *   *Determinism:* "Different sperm = different personality, so different person." (Confusing qualitative with numerical identity).
      *   *Professional Intuition:* "We label this embryo 'Embryo 5', so it has a fixed identity." (Reification of the clinical label).
      *   *Process vs. Product:* "People aren't things made of stuff." (The user's wrinkle).

  6.  **Comprehension Check:**
      *   Need a question that tests if they understand the *modal* nature of the question, not just the biological outcome.
      *   Question: "If we swap the sperm, do we get a different child, or the same child with different traits?"
      *   Good Answer: Acknowledges the distinction between *who* it is vs. *what* they are like.
      *   Wrong Answer: Focuses solely on genetic similarity or clinical outcome.

  7.  **Left Out:**
      *   Brain transplants (explicitly requested to avoid).
      *   Soul/Religious views (too divisive/off-topic).
      *   Moral status of embryos (distinct from identity).
      *   Detailed metaphysics (Kripke semantics, etc.).

  8.  **Refining the JSON Structure:**
