  3.  **Formulate Options for the Hearing:**
      *   *Option A: Speak Against.* Aligns with neighbors, contradicts past upzoning support, confirms Priya's accusation.
      *   *Option B: Speak For.* Aligns with past upzoning support, alienates neighbors, admits past exemption was self-interested.
      *   *Option C: Stay Silent.* Avoids conflict, but doesn't resolve internal moral conflict.
      *   *Option D: Speak Nuanced/Conditional.* Acknowledge the tension. Support the *goal* but ask for specific mitigations (design, parking) without blocking the project.

  4.  **Address the "Self-Interest" Question:**
      *   Can the position be salvaged? Yes, but only if the user admits the self-interest and pivots to *principled* constraints.
      *   The distinction between "rezoning my street" and "building on a vacant lot" is the strongest leg to stand on. Infill development is generally preferred over sprawling rezoning.
      *   However, opposing *this* specific project based on "character" while having exempted one's own block looks bad.
      *   To make it coherent, the user must prioritize the *process* and *city-wide need* over immediate local discomfort.

