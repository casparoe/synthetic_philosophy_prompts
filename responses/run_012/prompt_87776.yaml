      *   *The Hearing Decision:* Speaking *against* the project is the hardest sell ethically given the user's history. Speaking *for* it is the most consistent with the "upzoning" belief, even if it hurts local "character."
      *   *Reframing the Position:* How to make it not just self-interest?
          *   Admit the past exemption was a compromise/self-interest.
          *   Focus on *good* density vs. *bad* density (design, not existence).
