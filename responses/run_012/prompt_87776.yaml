      *   **The "Veil of Ignorance":** This is a strong philosophical tool (Rawls). If the user can't pass it, it suggests bias.
      *   **The "Vacant Lot" Distinction:** The user argues there's a difference between changing rules for existing homes vs. developing empty land. This is a valid planning distinction (infill vs. rezoning occupied neighborhoods).
      *   **The "Character" Argument:** Often a dog whistle for exclusion. Needs to be examined critically.
      *   **The "Light" Argument:** The user previously protected their own light. Now the project is 2 blocks away. Will it impact their light? Probably less, but the principle remains.
