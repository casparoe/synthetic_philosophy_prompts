answer: |-
  Your colleague's précis is a spirited defence of Bayesianism, but it is indeed a collage. It mixes technical truths with philosophical advocacy, and it conflates the misuse of methods with the methods themselves. As a biologist, you are well-placed to recognise that the practice of science often diverges from the theory of science; the same is true of statistics.

  Here is an audit of the claims, separated by topic rather than strict sentence order, evaluating what is accepted, what is contentious, and what is incorrect.

  ### 1. The Definition of Probability
  **The Claim:** *Frequentist statistics treats probability as long-run frequency in repeated trials. Bayesian statistics treats probability as a subjective degree of belief.*

  *   **What a statistician accepts:** This is the standard textbook distinction. Frequentists define probability as the limit of relative frequency in an infinite sequence of identical trials. Bayesians define it as a measure of plausibility or state of knowledge.
  *   **What they wince at:** The word "subjective". While this is true for *subjective* Bayesians (who view probability as personal belief), there is a large school of *objective* Bayesians who use "reference priors" or "maximum entropy" methods designed to minimise subjective input. They would argue their probabilities represent logical relations between propositions, not mere personal whim.
  *   **The Frequentist Reply:** A frequentist would argue that "degree of belief" is too vague for scientific reporting. Science requires public, verifiable standards. Long-run error rates are objective properties of the procedure, regardless of what the researcher believes.

  ### 2. The P-value and the Replication Crisis
  **The Claim:** *Researchers use p-values, which are commonly taken to be the probability that the null hypothesis is true... The replication crisis is fundamentally a problem of frequentist inference.*

  *   **What a statistician accepts:** It is absolutely correct that the p-value is **not** the probability that the null hypothesis is true. It is the probability of observing data as extreme as yours, *assuming* the null hypothesis is true ($P(Data|H_0)$, not $P(H_0|Data)$). It is also true that this misunderstanding is rampant in biology and medicine.
  *   **What they wince at:** Blaming the *crisis* fundamentally on frequentist inference is an overstatement. The replication crisis is driven by publication bias, small sample sizes, p-hacking (selective reporting), and poor experimental design. These are sins of practice, not necessarily theory. One can p-hack a Bayesian analysis by trying different priors or models until the result looks nice.
  *   **What is simply wrong:** Treating a non-significant result as evidence for the null is indeed a logical error (absence of evidence is not evidence of absence), but this is a misuse of the tool, not an inherent flaw in the mathematics of frequentism.
  *   **The Frequentist Reply:** The p-value was never intended to be the sole arbiter of truth. It is a measure of incompatibility between the data and the model. If researchers treat it as a binary "truth machine", they are violating the guidance of senior statisticians, not the logic of frequentism itself.

  ### 3. Fisher vs. Neyman-Pearson
  **The Claim:** *The real divide is between Fisher's significance testing and Neyman-Pearson hypothesis testing.*

  *   **What a statistician accepts:** This is a sophisticated and accurate observation. Most textbooks teach a hybrid called "Null Hypothesis Significance Testing" (NHST) that neither R.A. Fisher nor Jerzy Neyman and Egon Pearson would fully recognise.
      *   **Fisher** viewed the p-value as a continuous measure of evidence against the null in a specific experiment. He did not believe in an "alternative hypothesis" or a fixed alpha level (like 0.05).
      *   **Neyman-Pearson** viewed statistics as a decision rule for long-run quality control. They focused on minimising Type I (false positive) and Type II (false negative) errors over many experiments. They did not care about evidence in a single case, only the error rate of the procedure.
  *   **What they wince at:** Your colleague implies this historical divide explains the current mess. While true, modern frequentists often argue the hybrid is pragmatically useful even if philosophically impure.
  *   **The Frequentist Reply:** We are aware of the distinction. In practice, we use the Fisherian p-value for evidence and the Neyman-Pearson alpha for decision thresholds (e.g., in clinical trials). It is a pragmatic synthesis, not a confusion.

  ### 4. The Likelihood Principle and Stopping Rules
  **The Claim:** *The likelihood principle shows that frequentist methods are incoherent because they depend on data that were never observed... a Bayesian would reach the same conclusion whether the trial was stopped early or run to a fixed size.*

  *   **What a statistician accepts:** This is the strongest technical point in your colleague's précis. The **Likelihood Principle** states that all evidence in the data is contained in the likelihood function. If you observe the same data, your inference should be the same, regardless of your intentions or stopping rule.
      *   **Bayesian:** Obeys the Likelihood Principle. If you stop a trial early because results look good, a Bayesian analysis conditions only on the data observed.
      *   **Frequentist:** Violates the Likelihood Principle. A frequentist p-value *must* account for the "sampling plan". If you peek at the data repeatedly (sequential testing), you increase the chance of a false positive. Therefore, the p-value must be adjusted (penalised) to account for the *possibility* of data you might have seen but didn't.
  *   **What they wince at:** Calling frequentism "incoherent" is a philosophical charge, not a mathematical proof. Frequentists argue that "coherence" should include the protection of long-run error rates. If you ignore the stopping rule, you can be tricked into finding significance where none exists (optional stopping).
  *   **The Frequentist Reply:** The stopping rule matters because it changes the properties of the test. If we ignore the stopping rule, we lose control over the false positive rate. We prefer to be "incoherent" by Bayesian standards than to be misleading about error rates. In clinical trials, protecting patients from false claims is more important than strict adherence to the Likelihood Principle.

  ### 5. Bayesian Solutions and Priors
  **The Claim:** *Bayesian methods would have prevented the replication crisis, because they give you the probability that the alternative hypothesis is true... and force you to state your prior beliefs openly.*

  *   **What a statistician accepts:** Bayes' theorem does provide $P(H|Data)$, which is what researchers *think* they are getting from a p-value. It also forces the explicit statement of a prior distribution.
  *   **What they wince at:** The claim that this would have *prevented* the crisis is speculative.
      1.  **Priors are contentious:** In biology, we often do not know the prior probability of a hypothesis. If you choose a "sceptical prior", you might miss real effects. If you choose an "optimistic prior", you amplify bias.
      2.  **Computational complexity:** Until recently, Bayesian methods were computationally prohibitive for complex biological models.
      3.  **Subjectivity:** "Forcing you to state beliefs" is seen by critics as introducing bias, not removing it. Two Bayesians with different priors can look at the same data and reach different conclusions.
  *   **What is simply wrong:** Bayesian methods are not immune to the replication crisis. If researchers engage in "prior hacking" (trying different priors until the result is significant) or model checking until the fit looks good, they can produce non-replicable results just as easily as frequentists.

  ### 6. The Grand Conclusion
  **The Claim:** *Frequentism is unscientific and Bayesian statistics is the only coherent approach to evidence.*

  *   **Audit:** This does not follow from the accurate parts of the précis. It is an independent philosophical commitment.
  *   **Is Frequentism "Unscientific"?** No. Frequentism is designed for contexts where objective error control is paramount (e.g., regulatory approval of drugs, quality control in manufacturing). It prioritises the reliability of the *process* over the belief in the *outcome*. That is a scientific virtue, not a vice.
  *   **Is Bayesianism the "Only Coherent" Approach?** Only if you accept the Likelihood Principle as the sole definition of coherence. If you define coherence as "maintaining guaranteed error rates in the long run", then frequentism is coherent and Bayesianism is not (since Bayesian error rates depend on the prior).

  ### Summary Assessment

  Your colleague's précis is **technically astute but rhetorically overheated**.

  1.  **The Technical Core:** He is correct about the Likelihood Principle and the stopping rule problem. This is a genuine theoretical weakness of frequentist inference that is often glossed over in introductory courses. He is also correct that p-values are systematically misinterpreted as posterior probabilities.
  2.  **The Conflation:** He conflates the *theory* of frequentism with the *abuse* of frequentism. The replication crisis is largely a crisis of incentives and training, not just statistical philosophy.
  3.  **The Philosophy:** His conclusion that frequentism is "unscientific" is a philosophical stance, not a statistical fact. It rests on the belief that science is about updating personal belief (Bayesian) rather than controlling error rates in public procedures (Frequentist). Both are valid views of science.

  **What should you trust?**
  Trust his warning that p-values are not probabilities of hypotheses. Trust his caution regarding stopping rules and sequential testing. Trust his view that Fisher and Neyman-Pearson offered different things that have been confusingly merged.

  **What should you treat with scepticism?**
  Treat with scepticism the idea that switching to Bayesian methods is a panacea. It shifts the burden of proof from "controlling error rates" to "justifying priors". In many biological contexts, we lack the knowledge to justify informative priors, leading to a different set of problems.

  **Final Verdict:**
  Your framing is not confused; the landscape of statistics *is* confused. Your colleague has presented a partisan brief rather than a neutral audit. He is right that the foundations of frequentist inference are shaky when interpreted as a measure of evidence for a single experiment. However, he is wrong to suggest that Bayesianism is the *only* coherent approach. It is merely coherent under a different set of philosophical axioms.

  As a retired biologist, you might conclude that frequentist methods are robust tools for screening effects in a regulated environment, provided they are not over-interpreted, while Bayesian methods are superior for updating knowledge in the light of new data, provided the priors are defensible. Neither is "unscientific"; they answer slightly different questions.
