      *(Refining the Dissent)*: Judge Wilson's dissent is powerful because it appeals to the *injustice* of the detention. Kant cannot speak to injustice *to the elephant*. He can only speak to the *vice* of the jailer. This is the core friction point.

  7.  **Final Structure:**
      1.  Ontological Categorization (Person vs. Thing).
      2.  The Mirror Test & Empirical Assumptions.
      3.  Legal Application (Habeas & The Court).
      4.  The Limits of Indirect Duty (The Moral Blind Spot).
