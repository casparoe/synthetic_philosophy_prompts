answer: |-
  ### Research Agenda: Structural Coherence in Lexical Negative Utilitarianism

  **Premise:** Lexical Negative Utilitarianism (LNU) is currently unstable. It attempts to combine a deontological-style constraint (no trade-off for severe suffering) with a consequentialist structure (maximization above the threshold). This hybridity creates friction points where the view risks collapsing into Standard Utilitarianism (if the lexicality is too weak) or Paralysis (if the lexicality is too strong). A two-year, three-person team cannot solve every application of the view. You must solve the *viability* of the view before you solve its *application*.

  The following agenda is ordered by logical dependency. If Question 1 is answered negatively, the remaining questions are moot. If Question 2 is answered negatively, the view is action-guiding null. Question 3 is only relevant if the view survives 1 and 2.

  ---

  ### 1. The Metaphysics of the Break: Commensurability and Scope
  **Core Question:** Is the lexical threshold a feature of a single scale of value (commensurability), or a veto between distinct scales (incommensurability)? And does this lexical priority apply within a life (intrapersonal) or across lives (interpersonal)?

  **Why it is upstream:**
  You cannot locate a threshold (Question 3) or calculate uncertainty around it (Question 2) until you define what the threshold *is*. If pleasure and pain are incommensurable (no common unit), the metaphor of a "threshold" on a single scale is a category error; the view becomes a side-constraint theory, not a threshold utilitarianism. Furthermore, the Intrapersonal/Interpersonal distinction dictates the decision-theoretic environment. Intrapersonal lexicality is intuitively robust (I will not torture myself for a lifetime of mild pleasure); Interpersonal lexicality is politically explosive and mathematically fragile (I must prevent one person's severe suffering even if it costs billions mild pleasures). The metaphysical status of the "break" determines whether uncertainty washes out the view.

  **How far conceptual argument can push it:**
  Far. This is pure value theory. You can test the view against "Intuition Pumps" regarding compensation.
  *   *Argument:* If LNU claims commensurability (a single scale with an infinite slope at $T$), it must explain why the exchange rate changes discontinuously without a change in the *nature* of the value. If it claims incommensurability, it must explain how "ordinary trade-offs resume" above the threshold without reintroducing a common currency.
  *   *Distinct or Same Problem?* The commensurability question and the threshold question are the **same problem in different dress**. A threshold implies a scale. If you have a scale, you have commensurability. If you deny commensurability, you cannot have a threshold, only a veto. LNU claims a threshold; therefore, it is committed to commensurability. The research must expose whether this commitment is coherent.

  **Collapse vs. Refine:**
  *   **Collapse:** If the team concludes that commensurability is required for the "above threshold" clause but impossible for the "below threshold" clause, the view is logically inconsistent. Alternatively, if the team finds lexicality is only defensible intrapersonally, the view collapses as a *social* ethic (which is likely what the foundation wants).
  *   **Refine:** The view is refined into "Lexical Negative Prioritarianism" or a hybrid deontological/consequentialist model.

  **What moves it up/down:**
  *   **Up:** If preliminary reading suggests the foundation cares about policy. Interpersonal scope is required for policy, making this the bottleneck.
  *   **Down:** If the foundation is interested in LNU solely as a critique of welfare economics (intrapersonal), the interpersonal scope is less urgent.

  ---

  ### 2. The Epistemology of the Threshold: Uncertainty and Aggregation
  **Core Question:** If an agent holds a probability distribution over where the threshold falls, does lexical priority survive aggregation, or does it wash out into ordinary expected-value weighing?

  **Why it is upstream of Location (Q3):**
  Even if we know *what* the threshold is (Q1), we do not know *where* it is. In any real-world decision, there is epistemic uncertainty about whether a specific suffering instance crosses the lexical line. Standard decision theory dictates maximizing Expected Value (EV). If there is a non-zero probability that a suffering instance is *below* the threshold (where trade-offs are allowed), and a non-zero probability it is *above* (where they are not), EV calculation typically averages these out.
  *   *The Wash-Out:* If I am 99% sure a pain is sub-threshold (lexical) and 1% sure it is supra-threshold (tradable), standard EV theory might allow me to trade it off against a massive good, effectively nullifying the lexical protection.
  *   *The Reductio:* If lexical priority washes out under uncertainty, LNU is practically indistinguishable from Standard Utilitarianism in non-ideal conditions (which is all conditions). This is a functional collapse.

  **How far conceptual argument can push it:**
  Medium-High. This requires formal decision theory. You can construct models comparing "Maximize Expected Utility" vs. "Maximize Probability of Avoiding Lexical Violation." You can argue whether "lexicality" is a property of the *act* or the *outcome*. If it is a property of the outcome, uncertainty destroys it. If it is a property of the act (a rule), it survives but risks rule-worship.

  **Collapse vs. Refine:**
  *   **Collapse:** If the team proves that any non-degenerate probability distribution over the threshold forces EV maximization to dominate, the view is action-guiding null. This is a **reductio**.
  *   **Refine:** The team might develop a "Lexical Expected Utility" function that weights probabilities non-linearly (e.g., giving infinite weight to any non-zero probability of lexical violation). This saves the view but makes it extremely risk-averse.

  **What moves it up/down:**
  *   **Up:** If Q1 concludes the view is Interpersonal. Interpersonal uncertainty is vast (I don't know your pain threshold), making this the primary blocker.
  *   **Down:** If Q1 concludes the view is Intrapersonal. I have better access to my own threshold, reducing the uncertainty surface.

  ---

  ### 3. The Non-Arbitrary Location of the Threshold
  **Core Question:** Can anything be said about where the threshold lies without begging the question, and what happens when its location is uncertain?

  **Why it is downstream:**
  Questions 1 and 2 determine if the threshold *can* exist and if it *matters*. Question 3 asks *where* it is. If the view collapses under uncertainty (Q2) or is metaphysically incoherent (Q1), searching for the location is a waste of resources. However, if the view survives 1 and 2, the "Sorites" problem becomes the primary vulnerability. If the threshold is at "intense agony," why not "intense agony minus one neuron firing"?

  **How far conceptual argument can push it:**
  Low. Conceptual argument alone rarely pins down specific phenomenological boundaries. You can argue for "natural kinds" of suffering (e.g., suffering that destroys agency vs. suffering that does not), but this risks empirical dependence.
  *   *The Discovery:* If the team finds that the threshold location *must* be vague, and that vagueness combined with lexicality leads to paradox (e.g., the "Heap" problem applied to torture), this is a **discovery** that forces the view to adopt supervaluationism or epistemicism.

  **Collapse vs. Refine:**
  *   **Collapse:** If the only defensible location is "death" or "unconsciousness," the view becomes trivial (no living person suffers enough to trigger lexicality).
  *   **Refine:** The threshold is defined functionally (e.g., "suffering that prevents preference formation") rather than phenomenally.

  **What moves it up/down:**
  *   **Up:** If Q2 finds a way to handle uncertainty robustly. Then the specific location becomes the main driver of policy recommendations.
  *   **Down:** If Q2 shows uncertainty washes out lexicality. Then the location is irrelevant because the mechanism is broken.

  ---

  ### Deprioritization and Success Conditions

  **Deprioritized Question: Population Ethics Implications (The Sadistic Conclusion)**
  *   **Why it looks central:** Negative Utilitarianism is famous for the "Sadistic Conclusion" (it is better to create no one than to create people with lives worth living but some suffering). Testing LNU against the Repugnant Conclusion is a standard move in population ethics.
  *   **Why deprioritize:** This is downstream of structural coherence. If LNU collapses under uncertainty (Q2) or fails to define its scope (Q1), its implications for future generations are irrelevant. Furthermore, population ethics introduces confounding variables (identity, existence) that obscure the core conceptual defects of the lexical threshold itself. Solve the threshold first; apply it to populations second.

  **What a Genuinely Good Two-Year Result Looks Like:**
  Do not aim for "a better understanding." Aim for a **decision-theoretic verdict**.

  1.  **For Q1 (Scope):** A definitive argument establishing that LNU is *only* coherent as an Intrapersonal constraint, or a robust defense of why Interpersonal aggregation is possible without collapsing into Standard U. (Binary outcome).
  2.  **For Q2 (Uncertainty):** A formal proof. Either:
      *   (A) A proof that under any standard decision theory, lexical thresholds wash out under epistemic uncertainty (The Impossibility Theorem); **OR**
      *   (B) A novel decision rule (e.g., "Lexical Maximin") that preserves the lexical intuition under uncertainty, with a clear account of its costs (e.g., paralysis).
  3.  **For Q3 (Location):** If (B) is achieved, a phenomenological taxonomy of suffering that identifies at least one "natural kind" of pain that plausibly sits above the threshold, avoiding the Sorites regress.

  **Success:** The foundation receives a report stating: *"LNU is viable only if you adopt Decision Rule X and restrict scope to Y. If you reject X or Y, the view collapses into Standard Utilitarianism."* This saves the foundation from funding a dead end or allows them to fund the specific patch required to save the view.
