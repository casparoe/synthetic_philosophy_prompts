answer: |-
  The fluorescent lights of the Bureau of Causal Settlement hummed at a frequency that made Anaya's teeth ache. It was a low, electric drone, the sound of eternity processed in eight-hour shifts. Around her, the open-plan office stretched into a haze of grey partitions. Clerks sat in rows, heads bowed over ledgers that were not books but thick, glowing slabs of slate, scrolling with the data of finished lives.

  Anaya was a Junior Auditor, Grade 4. Her desk was piled with Case Files, physical folders that smelled of ozone and old dust. Each one represented a Causal Stream that had recently terminated in the mortal realm and required processing for the next iteration.

  She pushed File 8940-K aside and rubbed her temples. The ink on the summary page was shifting, as it always did when the numbers refused to settle. Merit in gold, demerit in rust-red. They were supposed to mix into a neutral grey, indicating a balanced account ready for rebirth assignment. But 8940-K was staying purple. A bruise color.

  "Problem with the conversion rates?"

  Anaya looked up. Mr. Varghese stood at the partition rail, holding a mug of tea that never seemed to go cold. He was a Senior Adjudicator, a man whose face had the smooth, worn texture of a river stone. He had been processing karma since before Anaya's great-grandmother was born.

  "The subject's account doesn't close," Anaya said. "Look at Line 44. Significant demerit carried over from Life-Sequence 7. Violent intent."

  Varghese leaned in, squinting at the slate. "And?"

  "And on Line 45, the subject performed a high-merit act in Life-Sequence 8. Saved a child from a fire. Self-sacrifice. The Actuarial Table says the merit should offset the demerit. But the ledger is rejecting the transaction."

  Varghese took a sip of tea. "It's the fungibility clause. You can't offset violence with charity if the intent structures don't match. Violence is heat; charity is light. You're trying to pay a debt with currency from a different bank."

  "But the Table says they're commensurate," Anaya insisted, tapping the glowing screen. "Unit for Unit. That's the doctrine. Good cancels bad."

  "The Table is a guideline, Anaya. The Ledger is the law." Varghese sighed, the sound of a man who has explained gravity to a falling apple. "Move the demerit to the carry-over. Assign it to the next birth."

  "That's what I'm trying to do. But look at the Recipient ID." Anaya swiped her hand over the slate, expanding the data stream. "The Causal Stream for Life-Sequence 9—the one we're assigning the debt to—has a discontinuity. The psychological aggregates don't align. The being born in Sequence 9 won't remember the fire. Won't remember the violence. Won't even share the same personality matrix. If I assign this debt, I'm sentencing a new configuration of skandhas to pay for the actions of a configuration that no longer exists."

  Varghese straightened up. "That's the No-Self provision. Standard procedure."

  "It feels like fraud," Anaya said, her voice dropping. "We're telling a newborn that it owes a debt incurred by someone who isn't it. Where is the desert here? Who is deserving what?"

  "Desert is a layman's term," Varghese said, his tone mild. "We deal in Causality. If you throw a stone into a pond, the ripples don't ask if the water deserves to be disturbed. They just move."

  "But the stone has a memory in this office," Anaya countered. "We write it down. We stamp it. We make it a judgment."

  She turned the file toward him. "And look further back. I tried to trace the origin of the demerit. I wanted to see where the debt started. Who was the first debtor?"

  Varghese didn't look at the file. "You filed a Origin Query?"

  "I had to verify the principal."

  "And?"

  "There's no first term," Anaya said. "The ledger goes back indefinitely. Every debt is the interest on a previous debt. There is no point of innocence. No moment where the account started at zero. If there's no beginning, there's no original sin, and there's no original virtue. It's just... an infinite loop of liability."

  Varghese nodded slowly. "Class 1 Procedural Error. Looking for the First Cause. It's not forbidden, exactly, but it's a waste of billable hours. *Samsara* is beginningless, Anaya. That's in the manual. Section 1, Paragraph 1. 'Ignorance has no discoverable origin.'"

  "So we are processing infinite debt with finite lives," Anaya said. "We take a slice of an endless line and tell the slice it's responsible for the whole. And we use suffering as the currency. The assignment for Sequence 9 is a short life. Chronic illness. Pain."

  "Pain discharges debt efficiently," Varghese said. "High conversion rate."

  "Whose debt?" Anaya pressed. "The one who committed the violence is gone. The one suffering the illness is new. The only thing connecting them is this file. This piece of paper. If I stop filing, does the connection exist?"

  Varghese looked at her then, really looked at her, with eyes that were tired but not unkind. "If you stop filing, the Stream stalls. Stagnation leads to lower rebirths. Hell realms. Do you want that for 8940-K?"

  "I want to know if it's just."

  "Justice implies a judge," Varghese said. "We are clerks. We don't judge. We balance." He tapped the partition. "The system isn't designed to be just, Anaya. It's designed to be continuous. The suffering isn't a punishment. It's a settlement. It closes the loop so the energy can move on."

  "But if there is no self," Anaya said, the words feeling heavy in her mouth, "then who is settled? If I burn a debt for a ghost, and charge a phantom, what have I done? I'm just manufacturing misery to satisfy an accounting error."

  Varghese pushed off the rail. "You're thinking like a dualist. There is no 'who.' There is only the flow. The fire burns the wood. The wood doesn't mind. The fire doesn't hate. It just burns. You are trying to find a person in a process. There is no person. There is only the file."

  He turned to leave, then paused. "Besides, if you refuse the assignment, the backlog grows. If the backlog grows, the processing time increases. While we sit here arguing about the metaphysics of 8940-K, three other streams are cooling in the queue. Cold streams attract hungry ghosts. Do you want hungry ghosts on your conscience, Auditor?"

  He walked away, his shoes squeaking on the linoleum.

  Anaya looked back at the slate. The purple bruise on the screen pulsed gently.

  She thought about the being waiting in the queue. A potential life. A bundle of sensations waiting to be knit together into a form that would breathe, hunger, and hurt. She had the power to determine the texture of that hurt. She could make it a broken leg or a broken heart. She could make it poverty or isolation.

  The doctrine said this wasn't cruelty. It was hygiene. Cleaning the slate for the next cycle.

  But the slate was never clean. It was just scraped down and written over.

  She looked at the signature field. *Auditor Certification: I verify that this allocation accords with the Law of Causal Efficiency.*

  If she signed, she validated the fiction that the sufferer was the debtor. She became the link that bound the ghost to the phantom.

  If she refused, the file went to Review. Review meant suspension. Suspension meant the Causal Stream would fray. The being might be born confused, without the context to burn off the karma, trapping it in a cycle of frustration. Suffering without settlement.

  She picked up the stylus. The tip hovered over the glass.

  The hum of the lights seemed to grow louder. Somewhere, in a row far away, a stamp came down with a heavy *thud*. Then another. The rhythm of the office was a heartbeat, slow and relentless.

  Anaya realized that her hesitation was also a cause. Her doubt was a mental formation. It would have a result. If she hesitated too long, the file would time out. If she signed, the pain would be authorized.

  There was no innocent party here. Not the subject, not the victim, not even her. She was part of the stream too. Her labor was the mechanism by which the wheel turned. To stop the wheel was to break the world; to turn it was to grind it down.

  She looked at the Line 45 merit again. *Saved a child from a fire.* A moment of pure compassion in a sea of calculation. It was being used to buy a reduction in sentence, like a coupon.

  "Forgive me," she whispered. She wasn't sure to whom. The ghost? The phantom? Or the system itself, for demanding she be its executioner.

  She didn't find a third option. There wasn't one in the manual. There was only the signature, or the void.

  Anaya pressed the stylus to the glass. The purple ink flared, then settled into a dull, accepting grey. The ledger chimed softly, a sound like a coin dropping into a deep well.

  *Assignment Authorized.*

  The file slid automatically into the out-tray, joining a stack of hundreds, all destined for the chute that led to the womb-world.

  Anaya sat back. Her hand was shaking. She reached for the next file in the pile. Case 8941-L. A life of greed, balanced by a death of starvation.

  She opened the folder. She picked up the stylus. The lights hummed. The stamp waited. And somewhere, in a world she would never see, a child took a breath that belonged to someone else.
