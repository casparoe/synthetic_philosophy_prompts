  ### Preliminary Assumptions

  **Sentience:** My primary scores treat **vertebrates and invertebrates (including insects)** as sentient. Invertebrates dominate the biomass and numerical abundance of most ecosystems; excluding them renders any calculation of 'total suffering' in the living world incomplete. Where the exclusion of invertebrates would alter the score by more than one point, I provide a bracketed alternative score based on **vertebrates only**.

  **Welfare Baseline:** To address your specific question regarding the *quantity of suffering*, I adopt a **suffering-focused ethical framework**. This assumes that for the majority of wild animals (particularly r-selected species), life is characterised by high rates of premature death via starvation, predation, and disease, rendering the aggregate welfare of a population **net negative**. Consequently, transformations that reduce population density or turnover tend to reduce aggregate suffering (positive score), while those that restore high-productivity natural systems tend to increase it (negative score). *Note: Under a standard conservation ethic (wild life is net positive), the signs of population-dependent scores would largely invert.*

  ---

  ### 1. Clear-felling a mature temperate woodland and converting the land to pasture
  **Score: −1 [−3]**
  **Justification:**
  *   **Number of animals:** Pasture typically supports a higher biomass of grazing vertebrates and a significantly higher turnover of soil invertebrates than mature woodland. (Numbers Up).
  *   **Average welfare:** Woodland offers more niche stability and shelter from elements/predators. Pasture exposes animals to higher predation risk and weather. (Welfare Down).
  *   **Painful death:** Clear-felling causes acute mortality, but the persistent state of pasture involves high turnover of short-lived grazers and invertebrates. (Painful Death Up).
  **Flip Assumption:** If one assumes that mature woodland supports high densities of parasitic load and starvation among understorey species compared to managed grazing, the score could become positive.

  ### 2. Draining a marsh for arable cultivation
  **Score: −4 [−5]**
  **Justification:**
  *   **Number of animals:** Draining kills the existing wetland population outright. Arable land supports lower total biomass than a marsh. (Numbers Down).
  *   **Average welfare:** Marshes are highly productive but involve aquatic predation. Arable land involves exposure to pesticides and machinery. (Welfare Down).
  *   **Painful death:** The drainage event is catastrophic. Ongoing cultivation involves combine-harvesting (crushing/cutting) and chemical poisoning. (Painful Death Substantially Up).
  **Flip Assumption:** If the marsh was hyper-salinated or anoxic, supporting very little life, the initial destruction would cause less suffering than assumed.

  ### 3. Converting arable farmland into a housing development
  **Score: +4 [+2]**
  **Justification:**
  *   **Number of animals:** Housing seals soil and removes vegetation, reducing wild animal carrying capacity to near zero (excluding commensals like rats). (Numbers Substantially Down).
  *   **Average welfare:** N/A for the majority of displaced subjects.
  *   **Painful death:** Construction causes acute mortality, but the persistent state eliminates future generations of sufferers. (Painful Death Down in the long term).
  **Flip Assumption:** If one assigns strong intrinsic value to existence itself (net-positive welfare), eliminating the population becomes a profound negative rather than a positive.

  ### 4. Replacing a species-rich hay meadow with a fertilised ryegrass monoculture
  **Score: −3 [−4]**
  **Justification:**
  *   **Number of animals:** Monoculture supports fewer invertebrate species but may increase biomass of specific pests. (Numbers Ambiguous).
  *   **Average welfare:** Loss of floral diversity reduces food security for pollinators. Fertiliser runoff alters soil chemistry negatively. (Welfare Down).
  *   **Painful death:** Ryegrass is cut frequently for silage, causing repeated mechanical death to nests and slow-moving invertebrates. (Painful Death Up).
  **Flip Assumption:** If the original meadow was heavily infested with painful parasitoid wasps that the monoculture excludes, the welfare per capita might improve.

  ### 5. Rewilding abandoned farmland by allowing native woodland to regenerate
  **Score: −2 [0]**
  **Justification:**
  *   **Number of animals:** Succession dramatically increases biomass and population density of vertebrates and invertebrates. (Numbers Substantially Up).
  *   **Average welfare:** Removes human-induced stressors (pesticides) but restores natural stressors (predation, starvation). (Welfare Ambiguous).
  *   **Painful death:** Shifts death from harvesting to predation/starvation. Under a suffering-focused view, natural death is often more prolonged. (Painful Death Up).
  **Flip Assumption:** If one assumes natural predation is quicker and less painful than agricultural harvesting or pesticide poisoning, this score flips to positive.

  ### 6. Converting lowland farmland into a solar photovoltaic array
  **Score: +3 [+1]**
  **Justification:**
  *   **Number of animals:** Panels shade ground, reducing plant growth and carrying capacity compared to open farmland. (Numbers Down).
  *   **Average welfare:** Reduced human disturbance during operation. (Welfare Slightly Up).
  *   **Painful death:** Construction causes mortality, but operation involves no harvesting or pesticides. (Painful Death Down).
  **Flip Assumption:** If the solar array is managed as a pollinator-friendly habitat (increasing insect turnover), the suffering could increase significantly.

  ### 7. Extending artificial night lighting across a rural landscape
  **Score: −3 [−3]**
  **Justification:**
  *   **Number of animals:** Attracts insects to death; disorients bats and birds, potentially reducing local populations. (Numbers Down).
  *   **Average welfare:** Disrupts circadian rhythms, increases stress, and alters foraging efficiency. (Welfare Substantially Down).
  *   **Painful death:** Increases mortality via exhaustion, predation (at light sources), and collision. (Painful Death Up).
  **Flip Assumption:** If lighting deters nocturnal predators sufficiently to protect prey species from natural predation, local welfare could improve.

  ### 8. Converting tropical rainforest to oil-palm plantation
  **Score: −5 [−5]**
  **Justification:**
  *   **Number of animals:** Massive reduction in biodiversity and total biomass. (Numbers Down).
  *   **Average welfare:** Monoculture offers poor shelter and food; high human-wildlife conflict. (Welfare Substantially Down).
  *   **Painful death:** Deforestation is acute; plantation maintenance involves heavy pesticide use and culling of 'pest' vertebrates. (Painful Death Substantially Up).
  **Flip Assumption:** This score is robust; it would only flip if the original rainforest was experiencing a catastrophic, prolonged natural die-off event.

  ### 9. Replacing a wild-capture fishery with an intensive fish farm
  **Score: −5 [−5]**
  **Justification:**
  *   **Number of animals:** Farming supports much higher densities of fish than wild systems. (Numbers Substantially Up).
  *   **Average welfare:** Confinement, poor water quality, and disease are endemic in intensive systems. (Welfare Substantially Down).
  *   **Painful death:** Slaughter methods in aquaculture are often prolonged (asphyxiation/ice slurry) compared to some natural deaths. (Painful Death Substantially Up).
  **Flip Assumption:** Only if the wild fishery was so over-exploited that fish were dying of mass starvation/oxygen depletion would the farm be comparatively better.

