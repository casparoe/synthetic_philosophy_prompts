answer: |-
  **THE FINAL EXAMINATION ON CATEGORIES**
  **Topic:** The Ontology of the Glyph
  **Time Allowed:** 90 Minutes

  **The Case:**
  The fictional foundry Fenwick & Voss has released *Gable*, a display face designed to stress-test letter identity. In *Gable*:
  1.  **Case Collapse:** A single glyph serves as both uppercase and lowercase 'a'.
  2.  **Structural Variance:** The 'a' is single-storey (ɑ) in caption weights but double-storey (a) in display weights.
  3.  **Rotational Symmetry:** The 'a' and 'e' share the exact same contour; they are 180-degree rotations of one another. Orientation alone dictates value.

  A critic in *Type & Cognition* argues that because the contour is identical to an 'e', *Gable*'s 'a' is merely "an 'e' lying on its side."

  **The Tools:**
  *   **The Erasure Test:** A feature is *genre-defining* only if removing it changes which letter a competent reader sees.
  *   **The Swap Test:** A feature is *style-defining* if transplanting it onto a neighbouring letter preserves that letter's identity while altering family resemblance.

  **The Question:**
  Using the tools provided, write a defended verdict on whether *Gable*'s 'a' is truly an 'a'. Your essay must determine whether this identity is a matter of physical fact, social convention, or the perceiver's learned habit. Finally, specify what empirical evidence would settle the dispute.

  ***

  ### MODEL ANSWER

  Gable's 'a' is an 'a', but its identity is a functional contract rather than a geometric fact. To accept the critic's claim—that it is merely an 'e' rotated—is to mistake the vessel for the content. By applying the provided cognitive tools, we can see that letter identity resides not in the ink, but in the systemic expectation of the reader.

  First, apply the **Erasure Test** to the structural variance. In *Gable*, the 'a' shifts from single-storey to double-storey depending on weight. If a reader encounters the single-storey variant, do they see a different letter? No. They see a stylistic variation of 'a'. Therefore, the second storey is not genre-defining; it is decorative. If erasing the top loop does not destroy the 'a'-ness, then the double-storey 'a' found in traditional faces is merely a specific style of a broader category. The critic cannot argue the contour defines the letter, because the contour itself is unstable within the face without changing the letter's name.

  However, the **Swap Test** reveals where the system strains. If we transplant the *Gable* contour to a neighbouring position, does identity hold? Here, the rotation mechanic is critical. If I rotate the 'a' 180 degrees, it becomes an 'e'. In most typefaces, swapping the contour of an 'a' onto an 'e' results in gibberish. In *Gable*, it results in a different, valid letter. This suggests that orientation is doing the heavy lifting of identification. The Swap Test usually identifies style (e.g., adding a serif to an 'a' keeps it an 'a'). But in *Gable*, rotation changes the genre. This implies that for *Gable*, orientation is genre-defining, whereas in traditional faces, it is irrelevant.

  This fragility is highlighted by the 'l', 'I', and '1' problem. In many sans-serif faces, these three characters are visually identical. Their identity is resolved entirely by context (word shape, surrounding characters) rather than intrinsic features. *Gable*'s 'a' is similar: it relies on the reader's habit that "upright means 'a', inverted means 'e'". If the tests strain here, it is because they assume features belong to the glyph, when often they belong to the *system*. The 'i' and 'j' differ only by a dot; remove the dot from 'j', and context often sustains the identity. Remove the dot from 'i', and it becomes 'l'. Identity is relational.

  Therefore, the verdict rests on ontology. Is this fact, convention, or habit? It is not physical fact; the ink is identical to an 'e'. It is not pure convention, as a decree cannot make a circle read as 'a' without training. It is **learned habit codified by convention**. We recognize the 'a' because we have been trained to process that shape in that orientation within a Latin script system.

  What evidence settles this? Philosophical argument fails here; we need cognitive data. An eye-tracking study measuring saccadic latency on *Gable* text would provide the verdict. If readers pause significantly longer at 'a'/'e' transitions compared to standard faces, the design has violated cognitive habit, proving the identity is fragile. If reading speeds remain constant, the "contract" holds, proving that letter identity is flexible enough to accommodate rotational symmetry provided the system is consistent. The 'a' is an 'a' because the brain predicts it to be so, not because the shape demands it.

  ***

  ### MARKING SCHEME (20 MARKS TOTAL)

  **1. The Verdict (4 Marks)**
  *   **Requirement:** Clearly state whether *Gable*'s 'a' is an 'a' (Yes, No, or Conditional) in the opening.
  *   **Characteristic Error:** Waffling indefinitely without committing to a position.

  **2. Application of Erasure Test (4 Marks)**
  *   **Requirement:** Correctly identify that the storey variation (single vs. double) is style, not genre, as removal doesn't change identity.
  *   **Characteristic Error:** Claiming the double-storey is essential to 'a'-ness despite the prompt's evidence.

  **3. Application of Swap Test (4 Marks)**
  *   **Requirement:** Analyze the rotation/'e' relationship, noting that orientation acts as a genre-definer here, unlike in standard faces.
  *   **Characteristic Error:** Ignoring the rotational symmetry or treating it as a mere stylistic flourish.

  **4. Systemic Context (4 Marks)**
  *   **Requirement:** Reference the 'l'/'I'/'1' or 'i'/'j' analogy to demonstrate that identity often relies on context, not just isolated features.
  *   **Characteristic Error:** Analyzing the 'a' in total isolation from the rest of the alphabet.

  **5. Ontology & Evidence (4 Marks)**
  *   **Requirement:** Classify identity as Habit/Convention (not Fact) and propose empirical evidence (e.g., eye-tracking, legibility studies).
  *   **Characteristic Error:** Defaulting to Platonism (it is an 'a' because it *is* one) or offering no method of verification.
