answer: |-
  **TO:** Editorial Standards Board
  **FROM:** [Your Name]
  **DATE:** [Date]
  **RE:** Disposition Recommendation: [Title of Drama]

  **Recommendation**
  I recommend we **require removal of the scene** depicting the subject informing on her colleague. While I recognize the artistic cost, broadcasting a fabricated act of moral betrayal violates the spirit of our charter's commitment to human dignity and risks unjustified harm to the living community that inherits her legacy.

  **Reasoning**
  To the producers: I understand that "dramatic truth" sometimes requires compressing timelines or creating composite pressures. However, there is a distinction between inventing *circumstances* to reveal character and inventing *actions* that contradict the historical record's moral core. Accusing a civil-rights organizer of "informing" is not a neutral dramatic device; it is a specific stain on her integrity that undermines the very movement she served. You can retain the tension of the interrogation without resolving it with a lie.

  To the descendants and comrades: We hear your objection that this constitutes a posthumous betrayal. Our charter mandates respect for the dignity of persons portrayed. While the text is silent on the deceased, the principle of dignity cannot logically expire at death, particularly for public figures whose legacies are active resources for the living. To air this without evidence is to weaponize our platform against a reputation that can no longer defend itself.

  **The "Dead Cannot Be Wronged" Objection**
  The strongest argument against removal is the philosophical view that the dead possess no interests and therefore cannot be harmed. If true, our concern would be merely sentimental. I reject this application for a public broadcaster. While the deceased may not feel pain, the *public trust* we hold is damaged when we blur fact and fiction regarding moral failure. Furthermore, the harm is real for the living—family, colleagues, and activists—who suffer the distress of seeing a loved one's life work distorted. We are not adjudicating the rights of the dead, but the responsibilities of the living broadcaster.

  **Assessment of the Counterfactual-Consent Standard**
  A colleague has proposed a test: an invented act stands only if the real person, knowing the script and audience, would not have had decisive reason to refuse, with the burden on the producers when the act attracts moral blame.

  This is a robust standard that I support. It correctly places the burden on those introducing the falsehood. In this case, the act of "informing" carries heavy moral blame in the context of civil rights. It is implausible to argue that a dedicated organizer would consent to being portrayed as a betrayer to enhance a drama's tension. The stigma is too great, and the historical distortion too specific. Under this test, the scene fails.

  **Conclusion**
  Having had my own family's history fictionalized recently, I know the lingering sting of seeing a narrative replace a life. We must not trade a real woman's dignity for a scene's drama. I urge the board to vote for removal.
