      *   **Required Output:** Recommend a concrete disposition (Approve, Approve with Notice, or Require Removal). Give reasons engaging both sides. Address the strongest counter-argument (dead cannot be wronged). Assess a specific proposed test (Counterfactual-Consent Standard).
