      *Let's look at the Charter:* "Respect for dignity."
      *Decision:* I will recommend **Require Removal of the scene depicting the act of informing.** I will argue that while dramatic license is vital, fabricating moral cowardice in a civil rights context violates the spirit of dignity and fails the counterfactual consent test.

