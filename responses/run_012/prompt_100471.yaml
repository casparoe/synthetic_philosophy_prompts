      *   **Addressing the "Dead Cannot Be Wronged" Argument:** This is the philosophical counter. Refute it by focusing on the *living* who inherit the legacy and the public trust in the broadcaster.
      *   **Assessing the Counterfactual-Consent Standard:** This is a specific requirement of the prompt. I need to analyze this test.
          *   *Analysis:* It's a useful heuristic. Would she consent? Given the stigma, likely no. Burden on producers? They can't meet it.
          *   *Conclusion:* The test supports removal.
      *   **Closing:** Call for a vote based on dignity and trust.

