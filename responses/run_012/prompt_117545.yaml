answer: |-
  # Joint Statement on Decision-Theoretic Dilemmas: Platonia and the Luring Lottery

  **Signatories:** A Commitment to Causal Decision Theory (CDT) and A Commitment to Superrationality (SR)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Symmetric Multi-Agent Scenarios

  ## 1. Agreed Claims

  After extensive deliberation, the undersigned parties agree on the following structural and theoretical claims regarding the Platonia Dilemma and the Luring Lottery:

  1.  **Scenario Symmetry:** In both dilemmas, all agents face identical payoff structures, possess identical information, and are assumed to be perfectly rational. There are no distinguishing features between agents that could serve as a coordination focal point (e.g., no agent is designated "Leader").
  2.  **Non-Communication:** Agents cannot communicate with one another prior to or during the decision process. No binding agreements or side-payments are possible.
  3.  **Goal of Decision Theory:** A correct decision theory must prescribe an action (or mixed strategy) that maximizes the agent's expected utility. Both parties agree that "expected utility" is the metric of success, though they disagree on the calculation of probabilities within that expectation.
  4.  **Predictive Symmetry:** Both parties agree that in a symmetric scenario with identical rational agents, the *ex-ante* probability distribution over actions must be identical for all agents. If the solution is deterministic, all agents must take the same action. If the solution is probabilistic, all agents must use the same probability distribution.
  5.  **The Luring Lottery Dynamics:** In the Luring Lottery, the probability of a specific agent winning is strictly increasing in the number of entries they submit, holding others' entries constant. However, the expected value of a *single entry* decreases as the total number of entries in the pool increases.
  6.  **The Platonia Payoff:** In the Platonia Dilemma, the collective utility is maximized if and only if exactly one agent requests the prize. Any other outcome (zero requests or multiple requests) yields zero collective utility.
  7.  **Substantive Disagreement:** The parties agree that their divergence is not merely semantic. It leads to divergent behavioral prescriptions in the Luring Lottery and divergent justifications in the Platonia Dilemma, which would result in different outcomes if agents were embedded in a simulated environment where source code is visible but not modifiable.

  ## 2. Table of Disagreements

  | Issue | Causal Decision Theorist (CDT) Formulation | Superrationalist (SR) Formulation |
  | :--- | :--- | :--- |
  | **The Nature of Counterfactuals** | "When I evaluate my decision, I must hold the actions of other agents fixed. My physical action cannot causally influence the independent decisions of other agents, even if they are identical to me." | "When I evaluate my decision, I must recognize that my reasoning process is logically identical to that of other agents. Therefore, my decision is *evidence* of their decision, and I must evaluate the outcome if *all* identical agents reason this way." |
  | **Correlation vs. Causation** | "Correlation between my choice and others' choices is spurious from the perspective of causal leverage. Conditioning on my action does not imply their action changes; it only implies I am in a world where they happened to choose similarly." | "The correlation is logical, not spurious. We are instantiating the same algorithm. To choose one way is to determine that the algorithm outputs that way. Therefore, the counterfactual 'If I choose X' implies 'If the algorithm outputs X'." |
  | **Luring Lottery Prescription** | "Since my entries increase my win probability regardless of what others do, I should submit the maximum allowable number of entries (or infinity if uncapped). To do otherwise is to leave free utility on the table." | "Since we will all submit the same number of entries, increasing my entries increases everyone's entries proportionally. This leaves my win probability ($1/N$) unchanged while increasing the total pool size unnecessarily. I should submit the minimum (1 entry)." |
  | **Platonia Mixed Strategy** | "I should randomize with $p=1/N$ because this constitutes a Nash Equilibrium. Given that others play $p=1/N$, my best response is also $p=1/N$." | "I should randomize with $p=1/N$ because this is the unique symmetric strategy that maximizes expected collective utility. We must coordinate on the strategy that, if universalized, yields the prize." |

  ### Cruxes and Shared Evidence

  | Crux | Shared Argument / Evidence Bearing on Crux | CDT Prediction | SR Prediction |
  | :--- | :--- | :--- | :--- |
  | **The Relevance of Logical Correlation** | **Argument:** Consider a simulation where 1,000 identical agents are instantiated on separate servers with the same source code. If the source code is modified to output "Request" in the Platonia Dilemma, all 1,000 instances will output "Request." <br><br> **Dispute:** CDT argues the *agent* cannot modify the source code of others, only their own output. SR argues the *decision* is the selection of the source code's output, which is logically bound across instances. | **Prediction:** In the Luring Lottery (uncapped, costless), total entries will approach infinity (or system limits), dissipating no value but consuming no resources. In Platonia, agents will randomize at $1/N$, but view others' randomization as independent events. | **Prediction:** In the Luring Lottery, total entries will be $N$ (1 per agent). In Platonia, agents will randomize at $1/N$, viewing the total number of requests as a deterministic function of the chosen probability parameter. |
  | **Definition of "Could"** | **Argument:** Both sides agree that physically pressing a button here does not move a button there. <br><br> **Dispute:** CDT defines "could" as physical causal capacity. SR defines "could" as logical consistency within a set of counterfactual worlds compatible with the agent's reasoning algorithm. | **Prediction:** In a one-shot game against a perfect clone, CDT defects in Prisoner's Dilemma (and escalates in Luring Lottery) because the clone's move is already determined. | **Prediction:** In a one-shot game against a perfect clone, SR cooperates (and limits entries in Luring Lottery) because the clone's move is determined *by the same logic* I am currently employing. |

  ## 3. Analysis of Verbal Dispute

  We conclude that **the dispute is not merely verbal.**

  While a portion of the disagreement stems from the definition of "influence" (causal vs. logical), this definitional difference maps onto distinct physical predictions in specific computational contexts. If agents are implemented as computer programs running on distinct hardware, CDT prescribes an algorithm that reads its own output as independent of the other hardware. SR prescribes an algorithm that reads its own output as a proxy for the other hardware's output.

  In the **Luring Lottery**, this results in divergent resource allocation. If there is even a microscopic cost per entry (e.g., time, energy, computational cycle), CDT prescribes incurring that cost to gain a marginal advantage (leading to an arms race), while SR prescribes avoiding the cost (leading to a truce). Since the final resource states of the agents differ, the disagreement is substantive, not linguistic.

  ## 4. Extension: The Costly Public Good Luring Lottery

  **Variant Description:**
  *   **Entries:** Each entry costs a fixed amount $c > 0$.
  *   **Prize:** The prize $V$ is a **public good**. If *any* entry wins (i.e., if the lottery draws a winner from the pool), *all* agents receive $V$, regardless of who submitted the winning ticket.
  *   **Mechanism:** One ticket is drawn from the total pool. If the pool is empty, no one wins.

  ### Predictions

  **Causal Decision Theorist (CDT):**
  *   **Reasoning:** My contribution to the total pool is marginal. If $N$ is large, the probability that *my* specific ticket is the deciding factor between "win" and "lose" is negligible. The cost $c$ is certain; the benefit $V$ is shared and probabilistically dependent on the aggregate.
  *   **Prediction:** **Free-Riding.** Agents will submit zero (or near-zero) entries. If $c > V/N$, rational CDT agents will not participate, leading to a suboptimal outcome where the public good is not funded, even if $V \gg N \cdot c$. This is a classic Tragedy of the Commons / Public Goods Game failure.

  **Superrationalist (SR):**
  *   **Reasoning:** If I decide to buy a ticket, all other identical rational agents will also buy a ticket. Therefore, the choice is not "Should I spend $c$?" but "Should we all spend $c$?" The collective cost is $N \cdot c$. The probability of winning approaches 1 as total tickets increase.
  *   **Prediction:** **Cooperative Funding.** Agents will coordinate on the optimal number of tickets to maximize $V - (\text{Total Cost})$. If one ticket guarantees a win (or probability is high enough), all agents will submit exactly one ticket (or a coordinated subset will submit one, if distinguishable, but here they are not, so all submit 1). They will fund the public good provided $V > c$ (or $V > \text{expected marginal cost}$).

  ### Impact on Agreed Claims and Cruxes

  1.  **Impact on Claim 3 (Goal of DT):** This variant sharpens the disagreement on what "maximizing expected utility" means. CDT maximizes *causal* expected utility (my action $\to$ my payoff). SR maximizes *evidential* or *functional* expected utility (my algorithm $\to$ collective payoff). The joint statement remains valid, but the divergence in Claim 3 becomes more pronounced.
  2.  **Impact on Crux (Logical Correlation):** This variant strengthens the SR position regarding logical correlation. In the original Luring Lottery, SR and CDT both wanted the prize for *themselves*. Here, SR and CDT both want the prize for *everyone*.
      *   CDT still fails to cooperate because it cannot causally force others to contribute.
      *   SR succeeds because it recognizes that *reasoning* is the shared resource.
      *   **New Crux:** "Is rationality a private tool for navigating a fixed world (CDT), or a shared algorithm that shapes the world collectively (SR)?"
  3.  **Impact on Verbal Dispute Analysis:** The conclusion that the dispute is **not verbal** is reinforced. The economic outcome (Public Good Funded vs. Not Funded) is objectively different. A CDT society fails to provide public goods in large anonymous groups; an SR society succeeds. This is an empirical distinction, not a definitional one.

  ***

  **Signed,**

  *The Causal Decision Theory Working Group*
  *The Superrationality Research Collective*
