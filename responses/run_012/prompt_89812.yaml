answer: |-
  **MEMORANDUM**

  **TO:** All Mediation Facilitators
  **FROM:** Practice Director
  **SUBJECT:** Operational Protocol: Adoption of Kalai–Smorodinsky Allocation Rule
  **DATE:** October 26, 2023

  This memo confirms our practice's commitment to the Kalai–Smorodinsky (KS) solution as our sole allocation rule for two-party disputes. This choice prioritizes fairness regarding relative gains over stability regarding agenda changes. By adopting KS, we gain a clear mechanism for resolving impasses, but we incur specific operational costs. You must understand these implications to facilitate without inadvertently violating the rule or misleading parties.

  **1. The Menu of Settlements and Agenda Control**
  Under KS, the solution depends on the "ideal point"—the maximum utility each party can achieve within the feasible set. Because KS violates Independence of Irrelevant Alternatives, adding or removing options changes the outcome, even if those options are not selected.

  Consider our recent case: Alice and Bob faced a feasible set where each could get at most 1, summing to 1.5. The KS solution was (0.75, 0.75). A colleague proposed adding an option giving Alice 0 and Bob 1.5. They argued this mattered not, as the rule would not select it. They were wrong. Adding this option raised Bob's ideal point from 1 to 1.5, while Alice's remained at 1. The KS rule draws a line from the disagreement point to the ideal point (1, 1.5). This steeper slope intersects the Pareto frontier at (0.6, 0.9). Alice's share dropped from 0.75 to 0.6 solely because a Bob-favorable option was added to the menu.

  **Implication:** You cannot neutrally expand the menu. Adding an option that extends one party's horizon while leaving the other's fixed shifts the allocation toward the former. Writing an option on the board is an intervention. You must justify every added option as mutually beneficial to the *structure* of the deal, not merely as a possibility.

  **2. Eliciting Aspirations**
  KS requires the true mathematical ideal point, not merely a negotiating target. You cannot accept "I want 80%" as an ideal point. You must probe the feasible set to find the absolute maximum each party could receive if the other conceded entirely (within physical or budgetary constraints).
  **Implication:** Your questioning must shift from "What do you hope for?" to "What is the absolute most you could possibly get here?" If you record a constrained aspiration rather than the true feasible maximum, the calculation will be incorrect.

  **3. Reassurance on Widening the Range**
  Can you tell parties that exploring more options cannot hurt them? No. KS satisfies Individual Monotonicity, which guarantees a party will not lose if the feasible set expands *while their own ideal point remains unchanged*. However, as the Alice/Bob case shows, if the expansion increases one party's ideal point more than the other's, the latter may lose utility.
  **Implication:** Do not promise that "more options help everyone." Promise only that improving a party's own maximum potential will not punish them. Be candid that expanding the frontier may shift the balance of power.

  **4. Utility Scales and Comparison**
  KS is invariant under independent rescaling of utilities. We do not need to compare Alice's utility to Bob's on a common scale. We do not need to decide if a dollar means more to Alice than to Bob.
  **Implication:** Keep scales separate. Record utilities in whatever units the parties use (dollars, satisfaction scores, equity percentages). The rule normalizes these internally by comparing current gain to maximum possible gain. Do not attempt to harmonize their valuation metrics; doing so introduces bias the rule is designed to avoid.

  **5. Uncertainty and Third Parties**
  KS requires a defined, convex feasible set. If the set is disputed (e.g., "Is this asset actually available?"), the rule cannot run.
  **Implication:** You must freeze the feasible set before applying the rule. If the set is uncertain, you are in a fact-finding phase, not a resolution phase. Regarding third parties: KS is defined for $n$-parties, but the geometry becomes complex. Our handbook commits to two-party mediation. If a third party joins (e.g., a creditor), you must pause and re-authorize the rule; do not improvise a three-way split using two-party heuristics.

  **Conclusion**
  Adopting KS means accepting that agenda control is substantive power. You are not merely managing conversation; you are managing the geometry of the feasible set. Discipline in defining options and ideal points is the only way to maintain the integrity of the rule.
