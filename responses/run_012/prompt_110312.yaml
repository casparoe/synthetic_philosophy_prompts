answer: |-
  No single mind-independent metaphysical principle validates all your intuitions without contradiction; the closest fit is a hybrid of **functional unity** and **conventional kind membership** that requires you to admit "thinghood" is partly dependent on human interests.

  **Candidate 1: Functional Unity**
  *Principle:* Parts compose a whole only if they interact to sustain the entity's existence or purpose.
  *Verdicts to Abandon:* You must stop calling a **rock** or a **wall** "one thing," since their parts (minerals, bricks) do not actively cooperate to maintain the whole. You also lose the **river**, which is a process rather than a functionally unified object. Conversely, you might have to accept your **glued bricks** as one thing if you use them as a doorstop, since they then share a function.
  *Why it fails:* It excludes too many inanimate objects you instinctively count as units.

  **Candidate 2: Physical Cohesion**
  *Principle:* Parts compose a whole if they are physically bonded beyond mere contact.
  *Verdicts to Abandon:* You must accept your **glued bricks** as one thing, indistinguishable in status from the wall. You must also count a **wet clump of sand** as one thing, since surface tension bonds the grains. You lose the **corporation** and the **Portuguese man o' war**, as their "bonds" are legal or biological rather than strictly physical fusion.
  *Why it fails:* It includes too many arbitrary clumps and excludes complex systems without rigid physical bonds.

  **Preferred Principle: Stable Functional Kind**
  *Principle:* X is one thing if its parts are integrated sufficiently to sustain a stable identity recognized by a relevant conceptual scheme (e.g., biology, architecture, law).
  *Reasoning:* This captures why a wall counts (architecture recognizes it) but glued bricks do not (no recognized kind), and why a man o' war counts (biology recognizes colonial organisms) but a swarm does not. It accepts that "thinghood" is not just about physics, but about whether the unity serves a persistent role in a system we care about.

  **Application to New Cases:**
  1.  **Lichen:** **One thing.** Biology recognizes it as a symbiotic organism with a stable identity, distinct from merely a fungus touching an alga.
  2.  **Species:** **Not a countable object.** While biologists sometimes treat species as "historical individuals," under this principle it is a abstract kind or lineage, not a concrete object you can count in a room like a cat.
  3.  **Hurricane:** **One thing.** Meteorology recognizes it as a stable, self-sustaining system with a distinct identity over time, similar to your verdict on the river.
