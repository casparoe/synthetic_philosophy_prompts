  (2) on the contrary...
  But public sword alone may judge the crown,
  Lest private wrath tear all the fabric down.
  To kill without the people's open voice
  Is murder masked as virtue's necessary choice.

  (3) i answer that...
  Distinguish the usurper from the king who errs:
  One holds no right, the other rule perverts.
  If title stands, no private hand may slay,
  Lest chaos crown the crime and lead astray.

  (4) reply to the first objection
  The senate's ghost holds no remaining power,
  Their secret writ is void in this dark hour.
  A fallen court cannot commission blood,
  For public right has slipped beneath the flood.

  (5) reply to the second objection
  Though aimed at good, the precedent is fear,
  For any hand may claim the law is here.
  Better to bear the tyrant's heavy yoke
  Than fracture peace upon a private stroke.
