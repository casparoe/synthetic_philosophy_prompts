          *   *Assessment:* The "heuristic" concession weakens his earlier "oversold" claim. The normative charge is a common critique of Dennett, but Dennett argues the hierarchy is based on *power/flexibility*, not moral worth.
          *   *Judgment:* Partly Right. He is right about mixtures (consistent with Move 3), but wrong about the normative bias (it's about capability, not value).

