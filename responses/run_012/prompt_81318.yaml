      *   **Clarification 2:** Requirements for Gödel: effectively axiomatizable, consistent, encodes arithmetic. Physical theories often don't encode arithmetic. Non-effective systems can be complete.
      *   **Clarification 3:** Lucas-Penrose style argument (humans escape Gödel) fails because it assumes we know our own consistency.
      *   **Proposed Criterion:** A scientific theory faces Gödelian limits only if:
