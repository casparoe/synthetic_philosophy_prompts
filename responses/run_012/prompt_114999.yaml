answer: |-
  **Title:** Leverage Over Consistency: A Normative Defense of Individual Monotonicity in Bargaining

  **Introduction**

  The standard pedagogical presentation of the two-person bargaining problem posits a symmetrical trade-off. We are told that the Nash Bargaining Solution (NBS) and the Kalai–Smorodinsky Solution (KSS) represent two equally compelling, mutually exclusive visions of fairness. The former is secured by Independence of Irrelevant Alternatives (IIA); the latter by Individual Monotonicity (IM). The implication is that the theorist must choose between a solution that respects consistency across choice sets (Nash) and one that respects sensitivity to changes in bargaining power (Kalai–Smorodinsky).

  This essay argues that this symmetry is illusory. In the context of normative bargaining theory, IIA and IM are not peers. IIA is a consistency constraint borrowed from individual choice theory that misfires when applied to the cooperative division of surplus, where the feasible set constitutes the very source of leverage. IM, often dismissed as a technical incentive constraint, actually encodes the fundamental normative principle of bargaining: that a party's claim should strengthen when their potential contribution to the surplus expands, even if the other party's potential remains static. I will demonstrate that a "hybrid" position attempting to salvage IIA for contractions while accepting IM for expansions is logically incoherent and normatively unstable. Through an analysis of investment incentives in a research consortium, I will show that the NBS fails to protect the generative capacity of cooperation, whereas the KSS aligns division with contribution. The conclusion is sharp: for normative theory, IIA must be abandoned, not balanced.

  **The Axioms and the Conflict**

  To avoid recitation, I define the axioms by their normative force. **Scale Invariance** and **Pareto Efficiency** are non-negotiable baseline requirements for any utility-based division. **Symmetry** ensures that labels do not dictate outcomes. The conflict lies in the fourth axiom.

  **Independence of Irrelevant Alternatives (IIA)** requires that if a solution is selected from a large feasible set $S$, and we remove unchosen options to form a subset $S'$, the solution must remain unchanged provided the original solution is still feasible. Normatively, this treats the bargaining solution as a revelation of a pre-existing preference ordering over outcomes, insensitive to the context of available alternatives.

  **Individual Monotonicity (IM)** requires that if the feasible set expands from $S$ to $S'$ such that Player 1's maximum attainable payoff increases while Player 2's maximum remains fixed, Player 1's assigned payoff should not decrease. Normatively, this treats the bargaining solution as a function of relative leverage: if my "best case" improves while yours stays the same, my fair share should not shrink.

  **The Normative Asymmetry**

  The literature often defends IIA in bargaining by analogy to rational choice: if you chose $x$ over $y$ when $z$ was available, removing $z$ shouldn't make you choose $y$ over $x$. But bargaining is not individual choice. It is a strategic interaction where the *set* of feasible alternatives defines the parties' threat powers and bargaining weights.

  In bargaining, options are not merely "available"; they are sources of leverage. If I remove an option that was highly favorable to you but never selected, I have altered the geometry of the compromise. Under the NBS, the solution is determined by the tangency of the hyperbola $(u_1 - d_1)(u_2 - d_2) = k$ to the Pareto frontier. This tangency depends on the local curvature of the frontier. IIA forces the solution to depend *only* on this local geometry. It renders the solution blind to the global shape of the set—specifically, to the ideal points.

  This is the normative failure. In a cooperative venture, my claim to the surplus is not based solely on the marginal rate of substitution at the agreement point; it is based on what I bring to the table relative to what you bring. If the technology improves such that I can generate more value without enhancing your standalone capacity, my leverage has objectively increased. IIA forbids the solution from recognizing this shift in leverage unless the local curvature changes coincidentally. IM, conversely, mandates that the solution track this shift. Therefore, IM is normatively prior because it connects the division of surplus to the structure of cooperation that generated it.

  **The Collapse of the Hybrid Position**

  One might attempt to rescue IIA by proposing a hybrid: accept IM for expansions (rewarding innovation) but retain IIA for contractions (ensuring stability). This position collapses under scrutiny for two reasons: logical incompatibility and path dependence.

  First, logical incompatibility. It is a mathematical theorem that no solution can satisfy Pareto, Symmetry, Scale Invariance, IIA, and IM simultaneously on the domain of convex bargaining problems. The NBS and KSS are unique to their axiom sets. A hybrid is not a "middle ground"; it is a contradiction. To satisfy IIA, the solution must be locally determined (dependent on the derivative of the frontier). To satisfy IM, the solution must be globally determined (dependent on the ideal points). A function cannot be both purely local and sensitive to global extremes.

  Second, path dependence. If we apply IM to expansions and IIA to contractions, the solution to a bargaining problem becomes history-dependent. Consider a set $S$. Expand it to $S'$ (triggering IM, shifting payoff to Player 1). Now contract $S'$ back to $S$ by removing the options that were never chosen (triggering IIA, forcing payoff back to the original Nash point). The final allocation depends on whether we view the problem as a contraction from $S'$ or an expansion from $S$. Normative principles should be timeless; they should judge the state of affairs, not the trajectory that reached it. A theory that yields different "fair" divisions for the same feasible set based on its history is normatively bankrupt.

  **The Case of the Research Consortium**

  Consider two labs, $A$ and $B$, with disagreement point $d=(0,0)$. Initially, the feasible set $S$ is symmetric, bounded by $u_1 + u_2 \leq 100$. Both NBS and KSS prescribe $(50, 50)$.

  Lab $A$ can invest cost $c$ to purchase equipment. This expands the set to $S'$, where $A$'s maximum payoff rises to $120$, but $B$'s maximum remains $100$. The new frontier is asymmetric.

  **Incentives and Investment:**
  Under **KSS**, the solution lies on the ray connecting $d$ to the ideal point $(120, 100)$. The ratio of gains is $120:100$, or $6:5$. On the efficient frontier $u_1 + u_2 = 100$ (assuming the expansion is purely additive to A's max but the frontier remains linear for simplicity), $A$ receives $\frac{6}{11} \times 100 \approx 54.5$. $A$ gains $4.5$ units of surplus share. If $c < 4.5$, $A$ invests.
  Under **NBS**, the solution maximizes $u_1 u_2$ subject to $u_1 + u_2 \leq 100$. The solution remains $(50, 50)$. Why? Because the local slope of the frontier at the midpoint hasn't changed; only the "utopia" point has shifted. IIA dictates that since $(50,50)$ was chosen in $S$ and is feasible in $S'$, and the "irrelevant" options (the extra 20 units only $A$ can get) were not selected, the outcome shouldn't change.
  Here, NBS destroys the incentive to invest. $A$ bears the cost $c$ but receives none of the bargaining surplus generated by the increased potential. $B$ free-rides completely on $A$'s investment.

  **Grounds for Complaint:**
  Does $B$ have a complaint under KSS? $B$ might argue that the equipment belongs to $A$, so $A$ should keep the marginal 20, but the joint surplus is still 100. However, $B$'s leverage hasn't increased. Under NBS, $A$ has a valid complaint: "I expanded the pie's potential, yet my share of the actual pie did not increase." The NBS treats the expansion of $A$'s capacity as "irrelevant" because it doesn't change the marginal trade-off at the 50/50 split. Normatively, this is untenable. Bargaining is about dividing the gains from cooperation, and $A$'s investment *is* a gain from cooperation (or a prerequisite for it). Ignoring it violates the link between contribution and reward.

  **Ex Ante Welfare:**
  If $c = 5$, under KSS, $A$ does not invest (gain 4.5 < cost 5). Under NBS, $A$ definitely does not invest (gain 0 < cost 5). However, consider a case where the frontier shifts such that the total surplus increases. If the expansion allows for a total surplus of 110, KSS gives $A$ roughly 60. NBS gives $A$ 55. KSS provides stronger ex ante incentives for value-creating investments. If the goal of normative theory is to prescribe rules that sustain productive cooperation, KSS is superior.

  **The Role of the Disagreement Point**

  The prompt asks whether the disagreement point $d$ should enter only through the ideal point (KSS) or directly (NBS). In NBS, $d$ is the origin of the utility product. A shift in $d$ changes the solution non-linearly. In KSS, $d$ anchors the ray to the ideal point; a shift in $d$ translates the solution linearly along the Pareto frontier.

  Normatively, $d$ represents the threat point—what happens if cooperation fails. However, in fair division, we are often interested in the division of the *cooperative surplus* ($u - d$). KSS treats the ratio of maximal *gains* $(a_1 - d_1) : (a_2 - d_2)$ as the determinant of fairness. This is defensible: it equalizes the proportion of potential gain realized by each party. NBS equalizes the *marginal* willingness to concede.
  The KSS approach is more robust to utility scaling and better captures the intuition of "equalizing relative satisfaction." If my threat point improves, my ideal gain shrinks. KSS adjusts my share proportionally. NBS adjusts it based on the product, which can lead to counterintuitive jumps where a small improvement in $d$ yields a disproportionate increase in payoff. For a normative theory focused on fairness rather than strategic simulation, the KSS dependence on $d$ (as a baseline for calculating relative gains) is preferable to the NBS dependence (as a coordinate in a maximization function).

  **The Strongest Objection: Strategic Manipulation**

  The most potent objection to abandoning IIA and embracing IM is the risk of strategic manipulation of the feasible set. If I know that expanding my ideal point increases my share, I may engage in "cheap talk" or costly signaling to artificially inflate my maximum attainable payoff without actually increasing the joint surplus. I might threaten to walk away unless I get more, effectively reshaping the feasible set to favor myself. IIA protects against this by making the solution invariant to such expansions if they don't affect the local trade-off.

  **Rebuttal:**
  This objection conflates the *feasible set* with *claimed preferences*. In axiomatic bargaining, the feasible set $S$ is typically assumed to be objective and verifiable (e.g., technological constraints, budget limits), not merely asserted by the agents. In the lab case, the equipment purchase is a verifiable change in technology. If the norm is that $S$ must be physically verifiable, manipulation is constrained.
  Furthermore, the NBS is not immune to manipulation; it simply shifts the locus of manipulation to the disagreement point or the local curvature (via burning money to change marginal utilities).
  More importantly, the risk of manipulation does not justify adopting a normatively flawed axiom. If IM is the correct principle of fairness (rewarding potential contribution), we should not reject it because agents might lie about their potential. We should design verification mechanisms. Adopting IIA to prevent manipulation is like adopting a rule that ignores new evidence to prevent perjury. It solves the incentive problem by blinding the court. A normative theory should define the just outcome given the true facts; it should not distort the definition of justice to accommodate potential deceit.

  **Conclusion**

  The trade-off between Nash and Kalai–Smorodinsky is not a choice between two equal goods. It is a choice between a consistency constraint that ignores the source of bargaining power (IIA) and a monotonicity constraint that respects it (IM). The hybrid position fails because it demands a solution be both locally and globally determined, resulting in path dependence and logical contradiction.

  The concrete case of the research consortium demonstrates that IIA can sever the link between investment and reward, discouraging the very cooperation bargaining theory aims to facilitate. While the fear of strategic manipulation is real, it is an implementation problem, not a justification for abandoning the normative principle that one's share should reflect one's potential contribution. Consequently, for normative bargaining theory, Independence of Irrelevant Alternatives should be rejected. Individual Monotonicity provides the superior foundation, anchoring fair division in the reality of leverage and opportunity rather than the abstract consistency of choice functions. We should abandon the Nash solution in favor of monotonic solutions like Kalai–Smorodinsky, accepting that fairness requires sensitivity to the shape of the possible, not just the margin of the actual.
