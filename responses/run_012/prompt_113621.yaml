answer: |-
  ### Preliminary Distinction: Warrant vs. Label

  Before stating the principles, we must address your suspicion that *warrant* and *label* come apart. They do.

  *   **Warrant** concerns the epistemic justification for believing a proposition (e.g., "Group X secretly coordinated to do Y").
  *   **Label** ("Conspiracy Theory") is a sociological tag often applied to beliefs that are not only unwarranted but held in a specific *manner* (e.g., dogmatically, immune to revision, relying on epistemic isolation).

  Watergate (Case 1) is a **warranted belief in a conspiracy**, but it is not a **"conspiracy theory"** in the pejorative sense because the evidence was public, adjudicated, and the belief was revisable. The Moon Landing (Case 3) is an **unwarranted belief**, and because it is held despite overwhelming public evidence to the contrary, it earns the label "conspiracy theory."

  The principles below are designed to govern **warrant**. If a belief violates them, it is unwarranted; if held dogmatically despite this, it earns the label.

  ---

  ### Candidate Principle 1: The Independent Anchor Principle
  *(A repair of your first friend's "Self-Sealing" criterion)*

  **The Principle:**
  A belief in a conspiracy is epistemically warranted only if the primary justification relies on **positive, independent evidence** of coordination or motive (the "Anchor"), rather than primarily on the **absence of expected evidence** (the "Void"), where that absence is subsequently explained by the conspiracy itself.

  *   **Clause A (The Anchor):** There must be evidence of the *mechanism* or *motive* that does not depend on the truth of the conspiracy to be interpreted as evidence (e.g., a leaked memo, statistical anomalies, financial trails).
  *   **Clause B (The Void):** The absence of disconfirming evidence (e.g., no whistleblowers, no documents) may be noted, but it cannot serve as the *main* premise for the belief. If the absence of evidence is the strongest proof offered, the belief is unwarranted.

  **Resolution of Cases (6) and (7):**
  *   **Case (7) Tobacco:** The belief was anchored in **positive evidence**: epidemiological data showing harm, financial incentives to deny it, and eventually synchronized PR scripts. The "airtight" public denial was a *tactic* observed in the data, not the *proof* of the conspiracy. The absence of a confession was secondary. **Verdict: Warranted.**
  *   **Case (6) Plane Crash:** The belief is anchored in the **Void**: "No insider has come forward." The conspiracy is invoked *solely* to explain this silence. There is no independent evidence of coordination (e.g., emails between airlines and governments). **Verdict: Unwarranted.**
  *   **Why the distinction holds:** In (7), the self-sealing behavior was an *observable output* of the conspiracy (press releases). In (6), the self-sealing is an *inferred state* of the evidence (missing witnesses).

  **Implications for New Cases:**
  *   **Case A (UAP/Government Concealment):** Believing the government *investigates* UAPs is warranted (Anchor: Pentagon videos, congressional hearings). Believing they are *hiding alien technology* is unwarranted if the primary proof is "they won't show us the bodies" (Void).
  *   **Case B (Pharma Cure Suppression):** Believing a company *might* delay a cheap cure is plausible (Motive: Profit). Believing a *global consortium* is suppressing it is unwarranted if the only evidence is "the cure isn't available" (Void), without leaked emails or whistleblower testimony regarding coordination.

  **Verdicts You Must Abandon:**
  This principle forces a **time-sensitive revision** of Case (2) (Tobacco).
  *   **The Conflict:** In the 1950s and 60s, before internal memos leaked, the "Anchor" was weaker (mostly statistical correlation). At that time, believing in a *coordinated conspiracy* (rather than just individual denial) was less warranted than it became in the 1990s.
  *   **The Abandonment:** You must abandon the idea that believing the Tobacco conspiracy was equally reasonable *throughout* the decades. It transitioned from a hypothesis with some warrant (motive + stats) to knowledge (Anchor + Memo). If your verdict implies it was equally reasonable in 1955 as in 1995, this principle forces you to downgrade the 1955 verdict.

  ---

  ### Candidate Principle 2: The Specificity of Coordination Principle
  *(A repair of your second friend's "Hidden Agency vs. Noise" criterion)*

  **The Principle:**
  A belief in a conspiracy is warranted only if the alleged hidden agency produces **specific, replicable patterns** of behavior that are statistically unlikely to arise from parallel self-interest, noise, or error.

  *   **Clause A (Specificity):** The evidence must show *synchronization* (e.g., identical phrasing in independent documents, simultaneous policy shifts) that cannot be explained by common public information or market forces.
  *   **Clause B (Capacity):** The scale of the conspiracy must be compatible with the known capacity of human groups to maintain secrecy, given the incentives for defection (whistleblowing).

  **Resolution of Cases (6) and (7):**
  *   **Case (7) Tobacco:** Exhibited **Specificity**. Different companies used identical talking points ("doubt," "more research needed") simultaneously. This is unlikely to arise from uncoordinated self-interest. **Verdict: Warranted.**
  *   **Case (6) Plane Crash:** Lacks **Specificity**. A crash is a single event. The "cover-up" is inferred from a lack of data, not a pattern of synchronized lying. Furthermore, it violates **Capacity**: grounding all insiders across multiple governments and airlines without a single leak contradicts historical defection rates. **Verdict: Unwarranted.**

  **Implications for New Cases:**
  *   **Case C (2008 Financial Crisis):** Believing banks *recklessly gambled* is warranted (Anchor: Public data). Believing they *coordinated to crash the market* is unwarranted under this principle because the behavior (selling mortgage-backed securities) is explainable by parallel self-interest (greed) without needing a secret pact. No specific synchronization evidence exists.
  *   **Case D (Libor Scandal):** Believing banks *rigged rates* is warranted. There was **Specificity**: traders emailing each other to request specific rate submissions. This is not parallel self-interest; it is synchronized agency.

  **Verdicts You Must Abandon:**
  This principle challenges Case (5) (Bank Laundering) if the evidence is *only* the leaked memo.
  *   **The Conflict:** If the "leaked memo" is ambiguous or if the bank's denials are "implausible" only because of the *motive* (profit), but there is no evidence of *coordination* (e.g., emails between bank and cartel), this principle might classify it as "parallel self-interest" rather than conspiracy.
  *   **The Abandonment:** You must ensure the "leaked memo" contains evidence of *agreement*, not just knowledge. If the memo says "We know they are a cartel" but not "We agreed to help them," the belief in a *conspiracy* (coordination) is less warranted than the belief in *negligence* or *opportunism*. If your verdict on (5) rests on "they should have known," this principle forces you to distinguish between *knowing allowance* (conspiracy) and *willful blindness* (not conspiracy).

  ---

  ### Recommendation: A Synthesized Approach

  Neither principle alone is perfect. The **Independent Anchor Principle** handles the epistemic structure (why silence isn't proof), while the **Specificity Principle** handles the sociological reality (why some groups can't keep secrets).

  **The Unified Test:**
  To warrant a belief in a conspiracy, you must satisfy both conditions:
  1.  **Positive Anchor:** You possess evidence of coordination (documents, testimony, synchronized patterns) that stands independently of the alleged cover-up.
  2.  **Defection Plausibility:** The number of people required to keep the secret is small enough, or the binding mechanisms (blackmail, ideology, NDAs) strong enough, to make the silence plausible.

  **Applied to your tension (6 vs 7):**
  *   **Tobacco (7):** Passes both. Anchor = Synchronized PR campaigns. Defection = Plausible because they *did* eventually defect (Wigand), and until then, financial/legal bonds were strong.
  *   **Plane Crash (6):** Fails both. Anchor = None (only silence). Defection = Implausible (too many people, no binding mechanism evident).

  **Final Honesty Check:**
  If you adopt this Unified Test, you must abandon the intuition that **large, long-lasting conspiracies are inherently less credible than small ones.**
  *   **Why:** Case (2) (Tobacco) was large and long-lasting, yet warranted. Case (6) (Plane Crash) might involve fewer people, yet is unwarranted.
  *   **The Revision:** Size matters less than **Evidence Quality** and **Incentive Structure**. You must stop using "that's too many people to keep a secret" as a blanket dismissal (which would threaten Case 2) and start using "there is no positive evidence of coordination" as the primary dismissal (which protects Case 2 but kills Case 6).

  This shifts your criterion from the *metaphysics of the event* (can they do it?) to the *epistemology of the belief* (do you have proof they did it?). This preserves your verdicts on (1), (2), (5) while firmly rejecting (3), (4), (6), and resolves the (6)/(7) tension by identifying that Tobacco's "airtightness" was a documented tactic, whereas the Plane Crash's "airtightness" is a logical assumption.
