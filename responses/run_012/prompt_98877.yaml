answer: |-
  You have put your finger on the exact structural weakness in the standard rhetoric of AI safety, and your materials background gives you a privileged vantage point to see it. The analogy between pressure vessel design and AI alignment is not just loose; it is category-confused in a way that obscures the actual mathematical problem we are facing.

  Here is the argument you are looking for, structured to validate your intuition and then push it to its logical conclusion.

  ### Part 1: The Engineering Reality is Constrained Optimization, Not Maximin

  Your colleagues nod when you talk about worst-case design because it sounds like the Safety Factor. But if you open the ASME Boiler and Pressure Vessel Code, you will not find a maximin objective function. You will find a **constraint satisfaction problem over an enumerated set.**

  In your 34 years, you never designed for "the worst thing that could physically happen." You designed for the worst thing that could happen *within the code's specified load cases*.
  1.  **Enumerated Load Cases:** Internal pressure, hydrostatic test, wind, seismic, thermal shock. If a meteor hits the vessel, that is not a design load. It is an "act of God" outside the boundary conditions.
  2.  **Enumerated Failure Modes:** Plastic collapse, fatigue crack growth, brittle fracture, creep rupture. We have physics-based models for each. We do not design against "the vessel turns into a bird and flies away," because that is not in the failure mode list derived from the ontology of materials science.
  3.  **The Objective:** Minimize cost/weight.
  4.  **The Constraints:** For every load case $L$ in set $\mathcal{L}$, and every failure mode $F$ in set $\mathcal{F}$, $Risk(L, F) < \text{Acceptable Limit}$.

  This is crucial: **Engineering safety is not about maximizing the minimum utility. It is about maximizing expected utility subject to hard constraints on specific, known catastrophes.**

  If you treat engineering as a pure maximin problem (Maximize Minimum Utility), the optimal design is a block of solid steel that never holds pressure. It never bursts, so the worst-case outcome is "zero utility," which is better than "negative utility (explosion)." But nobody builds that. We build vessels that *risk* failure within a bounded probability because we have separated the *safety constraints* from the *performance objective*.

  When AI safety researchers say "we need worst-case guarantees," they often imply a maximin objective over the space of all possible agent behaviors. But without your two preconditions—a fixed environment class and an enumerated failure list—this is mathematically vacuous.

  **The "Smuggled Distribution" Problem:**
  If you claim to be optimizing for the worst case but you implicitly exclude scenarios where the AI hacks the reward signal wire or manipulates the operators into turning off the safety switches, you are not doing worst-case analysis. You are doing average-case analysis over a prior distribution of "credible" scenarios that you have not admitted to using. In materials, "credible" is defined by a century of fracture surfaces. In AI, "credible" is defined by science fiction and intuition. If you don't enumerate the failure modes (deception, power-seeking, specification gaming), your "worst case" is just your "average case" wearing a mask.

  **The "Inertia" Problem:**
  As you noted, maximin cannot distinguish between a safe system and an inert system. A pressure vessel that is never filled is perfectly safe. An AI that is never turned on is perfectly aligned. A pure maximin objective drives the system toward zero agency. The only way to recover agency is to introduce an objective function (do useful work) and treat safety as a constraint (do not kill everyone). This confirms your view: the honest formulation is **Constrained Expected Utility Maximization**, not Robust (Maximin) Optimization.

  ### Part 2: Why the AI Case Breaks the Analogy

  The reason this distinction matters is that in materials science, the sets $\mathcal{L}$ (loads) and $\mathcal{F}$ (failures) are **closed by physics**.
  *   We know the yield strength of steel.
  *   We know the maximum credible earthquake for the region.
  *   We know the chemistry of the corrosive fluid.

  The physics *bounds* the adversary. Nature is adversarial (entropy, fatigue), but she is not creative. She cannot invent a new mode of fracture tomorrow that violates conservation of energy.

  In AI, the "load" is the environment, and the "material" is the cognitive architecture. Both are open-ended.
  *   **Open Environment:** The AI operates in the world, not a test chamber. The "load cases" include social engineering, code exploits, and biological manipulation. This set is not enumerable in advance.
  *   **Open Failure Modes:** We do not have a "fracture mechanics" for cognition. We suspect instrumental convergence (power-seeking) is a failure mode, but we cannot write a differential equation for it.

  If you attempt a worst-case guarantee without closing these sets, you are designing a pressure vessel for "any possible force in the universe," which requires infinite thickness. The problem becomes ill-posed.

  ### Part 3: Salvaging Straight Maximin (The Narrow Path)

  You asked what would have to be true for the straight maximin framing to be salvaged. I agree with your suspicion: the conditions are much narrower than the community admits. For "worst-case guarantee" to make sense as a primary objective (rather than a constraint), three specific conditions must hold.

  **1. The Environment Class Must Be Formally Closed**
  You cannot do worst-case reasoning over "the real world." You can only do it over a formal model of the world. For maximin to work, the AI must be operating within a sandbox where the "universe deletion" move is not just unlikely, but *syntactically impossible*.
  *   *Engineering Equivalent:* The vessel is only subjected to loads defined in the code.
  *   *AI Requirement:* The AI's action space must be mathematically constrained such that catastrophic outcomes are unreachable states in the transition graph, not just low-probability trajectories. This implies **Formal Verification**, not empirical testing. You need a proof that no sequence of actions leads to the "bad" set, not just a test that says "it hasn't happened yet."

  **2. The Adversary Must Be Bounded by Logic, Not Just Resources**
  In materials, the adversary (load) is bounded by physical limits (e.g., maximum wind speed). In AI, if the adversary is a superintelligence (or the AI itself in an inner-alignment scenario), the "load" is cognitive.
  *   *Condition:* You must have a bound on the *ingenuity* of the optimization process.
  *   *Why it's hard:* In materials, stress concentrates at a crack tip, but it doesn't *move* the crack tip to a worse location. In AI, the optimization pressure can search for the specific crack in your safety case. For maximin to work, you need a guarantee that the system's optimization power cannot exceed the "safety margin" of your alignment. This requires a theory of **optimization daemons** that we do not currently have.

  **3. Monotonicity of Safety with Respect to Capability**
  In pressure vessels, if you make the walls thicker, safety goes up monotonically. In AI, this is not guaranteed.
  *   *The Problem:* A smarter AI might find a loophole a dumber AI missed. A more capable system might be harder to control.
  *   *Condition for Maximin:* You need a guarantee that increasing the system's capability (to perform the task) does not expand the set of reachable catastrophic states faster than it expands the set of reachable safe states. If safety is non-monotonic with capability, you cannot optimize for performance subject to safety constraints easily, because the constraint boundary moves as you optimize.

  ### Conclusion: The Verdict on the Analogy

  Your intuition is correct. The "worst-case guarantee" language in AI safety is often a rhetorical shield that hides a lack of enumerated failure modes.

  The honest engineering translation is:
  1.  **Enumerate the Catastrophes:** Define the specific ways the system kills you (e.g., "AI acquires irreversible root access," "AI manipulates human reward circuitry").
  2.  **Define the Credible Set:** Define the environment class where these catastrophes are physically possible (e.g., "AI connected to internet," "AI with API access to bio-labs").
  3.  **Constrain, Don't Maximize:** Treat these as hard constraints ($P(Catastrophe) = 0$ within the model).
  4.  **Optimize Elsewhere:** Maximize expected utility over the remaining state space.

  For the straight **Maximin** framing to be salvaged, you would need to move from engineering (empirical safety factors on known physics) to **mathematics (proofs on closed formal systems)**. You would need to prove that the AI *cannot* conceive of a failure mode you haven't listed. That is a much taller order than designing a boiler.

  The materials analogy holds only if we admit that we are currently trying to design a pressure vessel without knowing the properties of the steel, without knowing the maximum pressure, and without knowing if the vessel might decide to increase the pressure itself. Under those conditions, "safety factors" are superstition. Only explicit constraints on the *mechanism of failure* will save us.
