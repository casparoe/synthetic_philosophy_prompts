          *   It's not merely analytic (definition) because it constrains physics.
          *   It's not merely synthetic a posteriori (empirical law) because it grounds the definition of computability.
          *   *Key Term:* "Methodological Apex." It functions as a definition *within* the formal discipline but as an empirical constraint *outside* it.
          *   *Resolution of Tension:* The practice assumes the informal notion of "effective procedure" is *rigidly designating* the same extension as TMs, such that any physical realization of an "effective procedure" *must* fall within that extension.

