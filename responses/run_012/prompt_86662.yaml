          2.  *Physical/Empirical:* A constraint on nature. If a physical theory implies hypercomputation, the theory is suspect (like perpetual motion).
      *   **Tension:** Standard view says CTT is neither provable nor refutable (informal vs. formal). But the practice treats it as both a definition *and* a physical constraint.
      *   **Tasks:**
