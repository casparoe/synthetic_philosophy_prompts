          *   In Physics: CTT is treated as a boundary condition on physical reality.
      *   *Epistemic Status:* It acts like a *constitutive principle* or a *methodological norm* that has acquired the force of a natural law due to overwhelming inductive support and conceptual coherence. It's not *just* a definition, nor *just* an empirical hypothesis. It's a "working postulate" with dual aspect.

