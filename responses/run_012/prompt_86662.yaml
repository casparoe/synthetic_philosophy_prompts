          *   *The Implicit Move:* The practice assumes that "computation" in physics is not just state evolution but *information processing subject to epistemic constraints*. If a physical system solves the Halting Problem, the practice assumes either (a) the system isn't truly "computing" in the effective sense, or (b) physics is wrong.
          *   *Consistency:* It is consistent only if "computable" is defined by human epistemic limits (effective methods), and physical systems are assumed to be knowable/controllable by humans. If physics allows hypercomputation, it breaks the link between physical law and human knowledge.

      *   **Section 3: Reconstruction of "How it is Known".**
