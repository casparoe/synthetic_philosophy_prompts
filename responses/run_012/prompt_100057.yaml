      *   Section 2: Field Classification (Science vs. Pseudoscience).
      *   Section 3: Criteria Checklist (The core philosophical meat).
      *   Section 4: Testable Predictions.
      *   Section 5: Reviewing Officer Notes (The four samples).

  3.  **Drafting - Section by Section:**

      *   *Header:* National Standards Bureau for Epistemic Classification. Form DS-1.
      *   *Instructions:* Keep it dry. "Complete in triplicate."
      *   *Criteria (The Comedy):*
          *   Falsifiability: Needs to ask if predictions exist, but acknowledge the horoscope problem (checkable but wrong/ignored) vs. the string theory problem (untestable but accepted).
          *   Progressiveness: Lakatosian research programmes. Is it adding new facts or just explaining away old ones?
          *   Ad Hocery: Distinguishing refinement from patching.
          *   Consensus: Does community agreement matter? (Spoiler: Not really, but forms love checkboxes).
      *   *Officer Notes (The Reductio):*
          *   Astrologer: Predictions exist, but ignored when wrong.
          *   Fomenko: Radical revision, but isolates itself from evidence.
          *   Multiverse: Untestable, yet protected.
          *   Atlantis: Myth vs. History boundary.

  4.  **Writing - Iteration 1 (Mental Outline):**
      Start with the bureau name. List the sections. Section 3 needs to be the heavy lifter. "Does the theory forbid certain outcomes?" "If data contradicts, is the theory adjusted or abandoned?" Then the notes. Need to keep the voice consistent. No "As you can see, this is funny." Just the text.

  5.  **Writing - Iteration 2 (Focusing on Tone and Word Count):**
      *   *Tone Check:* Is it dry enough? Yes, use passive voice, bureaucratic numbering.
      *   *Philosophy Check:* Are Popper, Lakatos, and Kuhn hidden in the questions?
          *   Popper: Falsifiability.
          *   Lakatos: Research programmes (progressive/degenerative).
          *   Kuhn: Paradigms/Consensus.
          *   Duhem-Quine: Ad hoc adjustments.
      *   *The Notes:* These need to be brief marginalia that show the inconsistency of applying the rules.

  6.  **Drafting the Content (incorporating constraints):**

      *   *Header:* NATIONAL STANDARDS BUREAU FOR EPISTEMIC CLASSIFICATION.
      *   *Form:* DS-1 (Rev. 4.2).
      *   *Section 3:* "Demarcation Criteria."
          *   3.1: Does the theory specify conditions under which it would be deemed false? (Yes/No/Conditional).
          *   3.2: If 3.1 is Yes, are these conditions observable? (Note: Exclude retroactive fit).
          *   3.3: When empirical anomalies arise, does the research programme generate novel facts or explanatory adjustments?
          *   3.4: Is the adjustment derived from core axioms or introduced solely to preserve the core?
          *   3.5: Does the relevant community consensus align with empirical verification? (Check if consensus precedes data).
      *   *Section 4:* "Statement of Testable Predictions." (Leave blank space).
      *   *Section 5:* "Reviewing Officer Memorandum." (This is where the four samples go).
          *   *Sample A (Astrology):* Predictions listed. Failed. Core axioms retained via orb adjustment. Status: Degenerative.
          *   *Sample B (New Chronology):* Core axioms reject radiocarbon dating. Adjustments isolate programme from external data. Status: Pseudoscience.
          *   *Sample C (Multiverse):* Predictions unavailable due to causal isolation. Core axioms mathematically consistent. Status: Pending (Physics).
          *   *Sample D (Atlantis):* Claim historical. Evidence mythological. Community consensus divided. Status: Folklore.

  7.  **Refining and Polishing (Checking Word Count and Flow):**
      *   Need to ensure the comedy lands in the *contradiction* between the samples. The Multiverse gets a pass despite failing 3.1, while Astrology fails despite passing 3.1 (technically).
      *   Make sure the officer notes sound like internal memos, not jokes.
      *   Watch the word count. Aiming for ~600.

  8.  **Final Review against Constraints:**
      *   Deadpan? Yes.
      *   No jokes about bureaucracy? Yes.
      *   Enact demarcation debate? Yes (Falsifiability, Lakatos, Consensus).
      *   Four specific samples in notes? Yes.
      *   No outright objections? Yes, implied through the decisions.

      *(Self-Correction during drafting)*: Make sure the distinction between the Astrologer and the Cosmologist is clear in the notes without explicitly saying "This is unfair." Let the status designation do the work. The Astrologer is "Rejected," the Cosmologist is "Pending/Exempt."

      *(Word Count Check)*: If it's too short, expand the criteria descriptions slightly to be more legally precise. If too long, trim the header.

      *(Final Polish)*: Ensure the Fomenko reference is clear enough for those who know, but bureaucratic enough for those who don't. "Chronological revisionism."

