answer: |-
  **NATIONAL STANDARDS BUREAU FOR EPISTEMIC CLASSIFICATION**
  **Form DS-1 (Rev. 4.2): Petition for Field Certification or Reclassification**

  **INSTRUCTIONS:** Complete all sections in triplicate. Attach empirical data logs. Do not submit metaphorical evidence.

  **SECTION 1: PETITIONER DETAILS**
  **Name of Field:** _________________________________________________
  **Current Classification:** [ ] Science [ ] Pseudoscience [ ] Undetermined
  **Requested Classification:** [ ] Science [ ] Pseudoscience

  **SECTION 2: METHODOLOGICAL INTEGRITY CHECKLIST**
  *Please indicate compliance with the following demarcation criteria.*

  **2.1 Falsifiability:** Does the theory specify conditions under which it would be deemed false?
  [ ] Yes [ ] No [ ] Conditions exist but are currently unobservable
  *Note: If "Yes," proceed to 2.2. If "No," proceed to 2.4.*

  **2.2 Empirical Risk:** Are the conditions in 2.1 observable within the current technological horizon?
  [ ] Yes [ ] No

  **2.3 Response to Anomaly:** When empirical data contradicts a prediction, does the research programme:
  [ ] Abandon the core axiom
  [ ] Generate novel facts independent of the anomaly
  [ ] Introduce auxiliary adjustments to preserve the core axiom

  **2.4 Auxiliary Adjustments:** If 2.3 (third box) is selected, are the adjustments derived from independent evidence or introduced solely to negate the falsification?
  [ ] Independent [ ] Ad Hoc

  **2.5 Consensus Verification:** Does the relevant community consensus align with empirical verification?
  [ ] Yes [ ] No [ ] Consensus precedes data collection

  **SECTION 3: STATEMENT OF TESTABLE PREDICTIONS**
  *List three specific predictions made by the field in the last fiscal year. Attach verification logs.*
  1. __________________________________________________________________
  2. __________________________________________________________________
  3. __________________________________________________________________

  **SECTION 4: REVIEWING OFFICER MEMORANDUM (INTERNAL USE ONLY)**
  *Sample determinations from Cycle 88.*

  **Ref 88-A (Astrology):** Predictions specific and observable (2.1: Yes). Failure rate high. Core axioms preserved via 'orb' adjustment (2.4: Ad Hoc). Programme degenerative. **Status: Reclassified to Pseudoscience.**

  **Ref 88-B (New Chronology):** Core axioms reject standard dating methods. Anomalies treated as fabrication by external fields. Programme isolates itself from falsification (2.2: No). **Status: Reclassified to Pseudoscience.**

  **Ref 88-C (Multiverse Cosmology):** Predictions null due to causal isolation (2.1: No / 2.2: No). Mathematical consistency high. Core axioms protected by theoretical necessity. **Status: Certified as Science (Theoretical).**

  **Ref 88-D (Atlantean Studies):** Claim historical. Evidence narrative. Community consensus divided between geology and literature. Lacks auxiliary adjustments (2.4: N/A). **Status: Reclassified to Folklore.**

  **SECTION 5: FINAL DETERMINATION**
  **Reviewing Officer Signature:** ______________________ **Date:** _______________
  **Bureau Seal:** [ ] APPLIED [ ] WITHHELD
