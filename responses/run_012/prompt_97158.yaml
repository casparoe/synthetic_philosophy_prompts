      *   *Thought on Community:* If a community is offended, the "dead can't be harmed" argument becomes irrelevant because the *living* are harmed. This collapses the philosophers' metaphysical claim into a standard utilitarian one.

  10. **Final Structure:**
      1.  Diagnosis (You're right, it's Harm vs. Wrong + Metaphysics).
      2.  Stress-testing "No Subject, No Harm."
      3.  Analyzing the Sub-Cases (The "Benevolent Lie" Test).
