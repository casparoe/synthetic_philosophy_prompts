      *   *Section 4: Path to Progress.* Suggest specific moves. Feinberg's "Posthumous Interests." The distinction between *Biopic* (claims truth) and *Historical Fiction* (claims story).
      *   *Conclusion:* Is it permanent? No, but it requires shifting the terrain.

  8.  **Refining the Philosophy:**
