  ### Axes of Variation in Self-Knowledge

  Before mapping the logical space, we must isolate the dimensions along which theories of self-knowledge diverge. The following axes are orthogonal; accepting a position on one does not logically dictate a position on the others, though historical views often cluster.

  1.  **Existence:** Is there a distinct relation of *privileged access*, or is self-knowledge merely ordinary knowledge (perceptual/inferential) applied to oneself?
  2.  **Direction:** Does the guarantee run from **State to Cognition** (if you are in it, you know it) or **Cognition to State** (if you think you are in it, you are)?
  3.  **Strength:** Is the access **factive** (you actually know/believe) or **dispositional** (you are merely *in a position* to know)?
  4.  **Scope:** Does access cover **all mental states** (including dispositional/unattended) or only **occurrent/attended** states?
  5.  **Iteration:** Does access iterate? (If you know, do you know that you know? / **KK Principle**).
  6.  **Object:** Is what is transparent the **content** of the state (what you think) or your **epistemic standing** (how well-placed you are)?
  7.  **Negative:** Does access extend to the **absence** of states (knowing you don't know) or only their presence?
  8.  **Justification:** Does reliable tracking suffice for knowledge (**Externalist**), or is internal insight required (**Internalist**)?

  ***

  ### The Decision Tree: Mapping the Logical Space

  **Node 1 (Existence):** Is self-knowledge a distinct, privileged relation, or is it just ordinary knowledge applied to oneself?
  *   **No:** $\rightarrow$ **Leaf 1: Deflationary/No Privileged Access.** *Awkward commitment:* Must explain the distinctive phenomenology of self-ascription without positing a distinctive epistemic route.
  *   **Yes:** $\rightarrow$ Go to Node 2.

  **Node 2 (Direction):** When self-knowledge is successful, is it because the state forces the knowledge (Luminosity), or because the claim forces the state (Infallibility)?
  *   **Claim Forces State (Infallibility):** $\rightarrow$ Go to Node 3.
  *   **State Forces Knowledge (Luminosity):** $\rightarrow$ Go to Node 4.

  **Node 3 (Confabulator Case):** In the **Confabulator case** (a subject whose reports perfectly track states via a module they cannot inspect), does the subject *know* their state?
  *   **No (True Belief Only):** $\rightarrow$ **Leaf 2: Infallibility without Self-Intimation.** *Awkward commitment:* Grants immunity from error but denies the subject credit for knowledge.
  *   **Yes (Knowledge):** $\rightarrow$ Go to Node 6.

  **Node 4 (Strength):** If you are in a mental state, must you *actually* believe you are (Self-Intimation), or merely be *in a position* to know (Luminosity)?
  *   **Actually Believe:** $\rightarrow$ **Leaf 3: Self-Intimation without Infallibility.** *Awkward commitment:* Allows that you might believe you are in pain when you are not (false positives).
  *   **In a Position:** $\rightarrow$ Go to Node 5.

  **Node 5 (Slow-Drift Case):** In a **Slow-Drift case** (a sensation changes by imperceptible increments), does your access persist through the drift (Unrestricted) or fail at the margins (Restricted)?
  *   **Persist Throughout:** $\rightarrow$ **Leaf 4: Unrestricted Luminosity.** *Awkward commitment:* Requires denying margin-for-error principles, risking contradiction in sorites-style sequences.
  *   **Fail at Margins:** $\rightarrow$ Go to Node 6.

  **Node 6 (Expertise-Blind Case):** In an **Expertise-Blind case** (a subject has first-order competence but no meta-awareness, like a chicken sexer), does knowing entail knowing that you know (KK)?
  *   **Yes (KK Holds):** $\rightarrow$ Go to Node 7.
  *   **No (KK Fails):** $\rightarrow$ Go to Node 8.

  **Node 7 (Iteration on Infallibility/Luminosity):** (Reached via Node 3-Yes or Node 5-Restricted). Does the iteration apply to *knowledge* specifically, or to the *state* itself?
  *   **Knowledge Iterates (KK):** $\rightarrow$ **Leaf 5: KK without Luminosity.** *Awkward commitment:* Asserts knowledge iterates generally while denying mental states are luminous.
  *   **State Iterates (Luminosity of Knowledge):** $\rightarrow$ **Leaf 6: Luminosity about Knowledge without KK.** *Awkward commitment:* You know you know, but this second-order knowledge does not guarantee a third-order knowledge.

  **Node 8 (Iteration on Restricted Luminosity):** (Reached via Node 5-Restricted + Node 6-No). Does the failure of KK imply a failure of access entirely, or merely a limit on iteration?
  *   **Limit on Iteration:** $\rightarrow$ **Leaf 7: Restricted Luminosity without KK.** *Awkward commitment:* Accepts margins for error but denies the safety required for iterative knowledge.
  *   **Failure of Access:** $\rightarrow$ **Leaf 8: Unnamed.** *Status:* Merely unattractive; collapses into skepticism about the original access.

  **Node 9 (Transparency):** (Applies to Leaves 3, 4, 7). Is what is transparent the *content* of the state or your *epistemic standing*?
  *   **Content Only:** $\rightarrow$ **Leaf 9: Content-Only Transparency.** *Awkward commitment:* You know what you think, but cannot tell if you know it or are guessing.
  *   **Epistemic Standing:** $\rightarrow$ **Leaf 10: Standing Transparency.** *Awkward commitment:* Requires access to the reliability of your own faculties, risking regress.

  **Node 10 (Negative Introspection):** (Applies to Leaves 1, 2, 5). Do you also have privileged access to states you are *not* in?
  *   **Yes:** $\rightarrow$ **Leaf 11: Negative Introspection.** *Awkward commitment:* Requires knowing the absence of infinite possible states you are not currently in.
  *   **No:** $\rightarrow$ **Leaf 12: Positive Access Only.** *Awkward commitment:* Asymmetry between knowing you are in pain and knowing you are not.

  *(Note: Nodes 9 and 10 are illustrative splitters for specific branches to reach the required leaf count; in a full combinatorics they would apply more broadly.)*

  ***

  ### Mapping Answer Patterns to Leaves

  | Leaf | Label | Existence | Direction | Strength/Access | Case Verdict | Iteration | Transparency | Negative |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | Deflationary | No | N/A | N/A | N/A | N/A | N/A | N/A |
  | 2 | Infallibility w/o SI | Yes | Mind$\to$State | True Belief | Confab: No | N/A | N/A | No |
  | 3 | SI w/o Infallibility | Yes | State$\to$Mind | Actual Belief | N/A | N/A | Content | No |
  | 4 | Unrestricted Lum. | Yes | State$\to$Mind | Position | Drift: Persist | No | Standing | No |
  | 5 | KK w/o Luminosity | Yes | Mind$\to$State | Knowledge | Confab: Yes | Yes | N/A | No |
  | 6 | Lum. Know. w/o KK | Yes | State$\to$Mind | Position | Drift: Fail | No (State) | Standing | No |
  | 7 | Restricted Lum. | Yes | State$\to$Mind | Position | Drift: Fail | No | Content | No |
  | 8 | Unnamed | Yes | State$\to$Mind | Position | Drift: Fail | No | N/A | No |
  | 9 | Content Transparency| Yes | State$\to$Mind | Actual Belief | N/A | N/A | Content | No |
  | 10 | Standing Transp. | Yes | State$\to$Mind | Actual Belief | N/A | N/A | Standing | No |
  | 11 | Neg. Introspection | Yes | Variable | Variable | Variable | Variable | Variable | Yes |
  | 12 | Positive Only | Yes | Variable | Variable | Variable | Variable | Variable | No |

  ### Indistinguishable Leaf Pairs

  The following pairs are not separated by this specific tree structure, either because they share answer patterns on the chosen axes or because the axes selected do not reach the distinction.

  1.  **Leaf 9 (Content Transparency) & Leaf 3 (SI w/o Infallibility):**
      *   *Reason:* These give the same answers throughout the tree as constructed. They are genuinely different views (one is a claim about *what* is known, the other about the *guarantee*), but the current axes treat Self-Intimation as implying Content Transparency by default. To separate them, an axis asking "Can you self-ascribe without grasping content?" would be needed.
  2.  **Leaf 5 (KK w/o Luminosity) & Leaf 6 (Luminosity about Knowledge w/o KK):**
      *   *Reason:* Both occupy the "Iteration" split but rely on a subtle distinction between KK as a general principle vs. KK as a feature of mental states. The tree treats them as distinct branches, but without a dedicated "General KK vs. Local KK" axis, they share the same "Yes/No" pattern on the Expertise-Blind node depending on interpretation.
  3.  **Leaf 11 (Negative Introspection) & Leaf 12 (Positive Only):**
      *   *Reason:* These are separated only by Node 10. If Node 10 is not reached (e.g., on the Deflationary leaf), the view on negative introspection is left unspecified. This is a genuine gap: a deflationist could consistently hold either position.

  ***

  **Note to Instructor:** This tree forces students to locate their intuitions about the *Confabulator*, *Slow-Drift*, and *Expertise-Blind* cases before assigning them a label. The "Unnamed" leaf (8) is a useful pedagogical tool to show that not every logical combination yields a viable theory. The table allows you to quickly diagnose a student's position based on their yes/no answers during discussion.
