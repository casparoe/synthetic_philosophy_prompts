answer: |-
  Dear Friend,

  It is entirely understandable that you came away from that conversation feeling unsettled, for your instincts were quite right to detect that several distinct claims were being bundled together as if they were a single logical unit. What your friend presented was a composite picture blending mathematical history, formal logic, philosophy of mind, and physics, and the friction you sensed arises because the glue holding these pieces together is far weaker than he suggested. To give you the audit you requested, I must first disentangle the mathematical facts from the philosophical interpretations, for the Church–Turing thesis sits precisely on the fault line between the two. It is not merely a technical result but a claim about the relationship between our formal models and the intuitive notion of calculation itself.

  The first and most critical point to clarify is the epistemic status of the thesis. Your friend claimed that Turing proved, as a mathematical theorem, that a Turing machine can compute any function that any other computing device whatsoever could compute. This is where the argument begins to unravel. What Turing, Church, and others did prove in the nineteen-thirties was that several distinct formalisms for computation, such as lambda calculus, general recursive functions, and Turing machines, are extensionally equivalent. That is to say, they define exactly the same class of functions. This equivalence is indeed a matter of mathematical proof. However, the Church–Turing thesis goes a step further. It asserts that this class of functions captures the informal, intuitive notion of effective calculability, meaning any function that a human being could compute by following a mechanical procedure. This link between the formal model and the informal intuition is not a mathematical theorem because the informal notion is not formally defined. It is a hypothesis, or a thesis, and while it is overwhelmingly supported by evidence and lack of counterexample, it cannot be proved in the strict mathematical sense your friend implied. A specialist would wince at the claim that it is a theorem, for to call it such is to confuse the equivalence of formalisms with the adequacy of those formalisms to describe reality.

  Once we correct this status from theorem to thesis, we must look at what it actually covers. Your friend argued that because the proof covers any effective procedure, it follows that the human mind is a kind of Turing machine and that thought is computation. This is a non sequitur that conflates the limits of calculation with the nature of the calculator. The thesis concerns what functions can be computed, not what physical or mental substrate performs the computation. Even if every rational operation the mind performs is Turing-computable, it does not follow that the mind is a Turing machine. The mind might be an analog device, a quantum system, or something else entirely that merely simulates Turing-computable functions. Furthermore, the thesis applies to effective procedures, which are discrete and step-by-step. If the mind operates using continuous processes or non-algorithmic intuition, the thesis simply does not apply. Therefore, the conclusion that thought is computation is a separate philosophical stance known as computationalism, which relies on the Church–Turing thesis but is not entailed by it. A defender of the thesis would reply that while the thesis suggests the outputs of human reasoning are computable, it remains silent on the internal architecture of the mind, leaving room for non-computational theories of cognition.

  This leads directly to the claims about physics and hypercomputation. Your friend asserted that the thesis rules out the possibility that the brain exploits quantum effects to do work that is not Turing-computable. Here he is conflating the classical Church–Turing thesis with a stronger claim sometimes called the Physical Church–Turing thesis. The classical thesis is about what humans can calculate by hand following rules; it says nothing about what the laws of physics might permit a machine to do. It is logically possible that the universe allows for hypercomputation, such as solving the halting problem via certain relativistic spacetime structures or quantum phenomena, even if humans cannot replicate those processes by hand. If such physical processes exist, the classical thesis remains true regarding human effective procedures, but the stronger claim that nothing physical can compute more than a Turing machine would be false. Consequently, his dismissal of hypercomputation is premature. A specialist would accept that no one has yet built a hypercomputer, but they would reject the idea that the Church–Turing thesis itself logically forbids them. The thesis constrains algorithms, not necessarily the fundamental laws of nature.

  Regarding the historical claim that Church and Turing arrived at the same result independently in nineteen thirty-six, your friend is on solid ground. This is historically accurate and widely accepted. Church used lambda calculus while Turing used his machine model, and the subsequent demonstration that these models coincide is one of the great stabilising results of logic. However, this historical fact does not bolster the claim that the thesis is a theorem. It merely shows that two very different attempts to formalise computation converged on the same class of functions, which is part of the evidence for the thesis, not a proof of it.

  Perhaps the most subtle part of your friend's case was his assertion that the thesis is really a definition rather than a claim about the world, making it immune to empirical refutation but trivially true. This is a philosophical manoeuvre that some have attempted, notably to protect the thesis from counterexamples, but it is controversial. If we treat the thesis as a mere definition of the word computable, then yes, it is trivially true by stipulation. However, this strips the thesis of its scientific and philosophical interest. The reason we care about the Church–Turing thesis is that it appears to discover a fact about the structure of mathematical reasoning and physical possibility, not that it assigns a label. If it were merely a definition, it would not be surprising that all proposed models of computation align with it; yet it is genuinely surprising that every plausible model of effective procedure lands on the same boundary. Most logicians treat it as a substantive hypothesis about the limits of human calculation, which means it is not trivially true. It could have turned out that humans could compute functions beyond Turing machines, perhaps by exploiting some insight we do not yet understand. By calling it a definition, your friend protects it from falsification but at the cost of making it irrelevant to the questions you were arguing about, such as the limits of the mind or physics.

  Finally, your friend was correct to note that the thesis has nothing to say about how long a computation takes. This distinction between computability and complexity is fundamental. A problem might be Turing-computable in principle but require more time than the lifespan of the universe to solve. The Church–Turing thesis delineates what is possible in principle, whereas complexity theory deals with what is feasible in practice. This was the only part of his account that was entirely free of conceptual error.

  So, to summarise the audit for your own clarity: your friend was right about the history and the distinction regarding time, but he was wrong to call the thesis a theorem, wrong to derive conclusions about the nature of the mind from it, and wrong to use it to rule out physical hypercomputation. His claim that it is a definition renders it safe from refutation but also drains it of the significance he wished it to have. The conclusions he drew about the mind and physics do not survive once the errors are corrected, because the thesis is narrower than he supposed. It tells us about the limits of effective methods, not necessarily the limits of brains or machines. You were right to feel that the steps could not stand together, for they relied on sliding between mathematical proof, philosophical hypothesis, and physical speculation as if they were the same thing. I hope this helps you to see where the argument fractured, and gives you the footing you need to revisit the discussion with confidence.

  Yours sincerely,

  A Friend in Logic
