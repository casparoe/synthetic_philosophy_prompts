prompt: |-
  I've got to lead the discussion next week on the 'fragment on machines' stretch of Marx's Grundrisse (the copy I have says Notebook VII) and theres a paragraph I keep sliding off. Here it is:

  "The exchange of living labour for objectified labour – i.e. the positing of social labour in the form of the contradiction of capital and wage labour – is the ultimate development of the value-relation and of production resting on value. Its presupposition is – and remains – the mass of direct labour time, the quantity of labour employed, as the determinant factor in the production of wealth."

  A bit later he says that as large industry develops, the creation of real wealth "comes to depend less on labour time and on the amount of labour employed than on the power of the agencies set in motion during labour time".

  What I can't get straight: when he says the presupposition "is – and remains" labour time, what's the force of that? Is it a claim about the value-form itself (value is measured in labour time, so once wealth stops being produced mainly by labour time the measure fails), or a claim about capital continuing to impose labour time as its measure regardless? And what does "ultimate development" mean here – final stage, or highest/most complete unfolding? A friend in our group reads the whole fragment as a straightforward technological-determinist prediction (machines take over, so capitalism ends) and I'm fairly sure that's too easy, but I can't say exactly whats wrong with it. Also, is "contradiction" being used in the Hegelian sense of a relation that generates its own dissolution, or is it just a tension he's flagging?

  Don't bother with secondary literature or what commentators say – I want the reading the passage itself best supports. Keep it under 400 words, and give me the one-sentence answer first.
