answer: |-
  Marx argues that capital reaches its logical limit when it continues to measure wealth by labour time even after machinery has made direct labour irrelevant to production.

  "Ultimate development" denotes the highest logical unfolding of the value-form, where its internal boundary becomes visible, rather than a simple chronological endpoint. The force of "is – and remains" describes capital's structural compulsion: value must be measured in labour time, so capital continues to impose this measure even as machinery makes direct labour irrelevant to wealth creation. This is not merely a tension but a Hegelian contradiction: the system develops productive forces (machinery/general intellect) that negate its own measuring rod (labour time).

  Your friend's technological determinism is too easy because it assumes machinery automatically ends capitalism, whereas Marx shows capitalism actively struggles to maintain labour time as the measure of wealth despite having rendered it obsolete in production. The crisis arises not from machines simply replacing workers, but from the incompatibility between a production process based on social knowledge and a distribution system based on individual labour time. Capital survives by forcing the old measure onto the new reality, but this becomes increasingly untenable, marking the "ultimate development" as the point where the form bursts against its own content. The "contradiction" is thus the engine of dissolution: by maximizing productivity to reduce labour time, capital undermines the only source (living labour) that validates its value-form.
