answer: |-
  ## The Morning Protocol

  This procedure is designed for a single morning (approx. 4 hours). It treats the poem not as an artifact to be preserved, but as a machine with a specific function in your narrative. It forces you to choose what breaks before you begin writing, so that when you break the form, it is a decision, not a mistake.

  ### Phase 1: The Function Statement (30 Minutes)
  **Action:** Write one sentence describing what this poem *does* to the characters or the plot at the exact moment it appears.
  **Constraint:** You cannot use words like "beautiful," "sad," or "poetic." Use verbs of effect: *silences, accuses, binds, releases, hides, reveals.*
  **Exit Criteria:** A single sentence.
  **Derivation:** Immediately below this sentence, list the three constraints from your conlang grammar/form that are required to achieve that function. These are your **Load-Bearing Constraints**. All other constraints are **Visible Constraints**.
  *   *Example:* If the poem is a lullaby, "Singability" is Load-Bearing. "Internal Rhyme" might be Visible.
  *   *Example:* If the poem is a legal binding between characters, "The Word Change" is Load-Bearing. "Syllable Count" might be Visible.

  ### Phase 2: The Imposition Log (30 Minutes)
  **Action:** Take your literal gloss of the conlang text. Identify every place English forces a decision the conlang does not.
  **List:**
  1.  **Tense:** (Past, Present, Future, Imperative?)
  2.  **Gender:** (He, She, They, It?)
  3.  **Definiteness:** (The, A, Null?)
  4.  **Address Grade:** (Child, Peer, Superior? Which English words map to this?)
  **Decision:** Make a choice for each. Write the reason *why* you chose it based on the Phase 1 Function Statement.
  **Exit Criteria:** A completed log. No blanks. If you leave one blank, you are deferring the decision to the drafting phase, which will cause stalls.

  ### Phase 3: The Skeleton Draft (60 Minutes)
  **Action:** Write a version that satisfies the **Load-Bearing Constraints** and the **Imposition Log**, ignoring the Visible Constraints.
  **Exit Criteria:** A complete 8-line poem. It may not rhyme. It may have the wrong syllable count. It must convey the meaning and the tone decided in Phase 1 & 2.

  ### Phase 4: The Form Fit (60 Minutes)
  **Action:** Revise the Skeleton Draft to satisfy the **Visible Constraints** (Syllable count, Rhyme, Cyclic structure) without violating the Load-Bearing Constraints.
  **Rule:** You are allowed to break a Visible Constraint only if keeping it violates a Load-Bearing Constraint.
  **Exit Criteria:** A polished draft.

  ### Phase 5: The Break Clause (30 Minutes)
  **Action:** Review the draft against the constraints. If a constraint is failed, apply the **Break Test**:
  1.  Is this failure audible to a reader who doesn't know the conlang?
  2.  Does fixing this failure damage the Phase 1 Function Statement?
  3.  If yes to both, keep the failure. It is a **Deliberate Break**.
  4.  If no to either, fix it. It was a **Failure**.
  **Exit Criteria:** A final note attached to the poem stating: "Constraint [X] broken deliberately because [Reason]."

  ### Phase 6: The Novelist's Veto (30 Minutes)
  **Action:** Read the poem in the context of the surrounding prose.
  **Question:** Does the poem stop the story to show off, or does it move the story forward?
  **Decision:** If the poem is too perfect and slows the pacing, degrade it. If it is too rough and confuses the reader, clarify it.
  **Exit Criteria:** Final Manuscript Version.

  ---

  ## The Tests (Apply at end of Phase 4)

  **Test 1: The Syllable Count**
  *   **Pass:** All 8 lines have exactly 8 syllables.
  *   **Fail:** Any line deviates.
  *   **Remedy:** If Load-Bearing is "Singability," allow +/- 1 syllable. If Load-Bearing is "Form," rewrite.

  **Test 2: The Cyclic Anchor**
  *   **Pass:** Line 8 is Line 1 with exactly one word changed, and the changed word is in the same position.
  *   **Fail:** The word order shifts, or more than one word changes.
  *   **Remedy:** If English syntax forces the word elsewhere, you must rewrite Line 1 to match. If this breaks the sense, invoke the Break Clause.

  **Test 3: The Address Grade**
  *   **Pass:** The English words chosen clearly reflect the conlang grade (Child/Peer/Superior) defined in Phase 2.
  *   **Fail:** The relationship is ambiguous or contradicts the Phase 2 log.
  *   **Remedy:** Swap pronouns or nouns (e.g., "child" vs "sir").

  **Test 4: The Read-Aloud (Editor Test)**
  *   **Pass:** You can read it aloud without stumbling, and the rhythm supports the Phase 1 Function (e.g., a lullaby rocks, a monument stands).
  *   **Fail:** You stumble, or the rhythm fights the mood.
  *   **Remedy:** Prioritize sound over sense.

  ---

  ## Running the Protocol: Three Poems

  ### Poem 1: The Lullaby (Deathbed)
  **Context:** Sung aloud by a parent to a dying child.
  **Conlang Gloss:** [Sleep] [child-grade] [soft] [dark]. [Breath] [slow] [deep] [warm]. [Sleep] [child-grade] [soft] [dark]. [Sleep] [child-grade] [soft] [gone].
  **Grammar:** Line 3 & 7 internal rhyme required. Line 8 = Line 1 (word 4 changed: dark -> gone).

  **Phase 1: Function Statement**
  *   *Statement:* This song must slow the reader's heart rate and accept the death as inevitable.
  *   *Load-Bearing Constraints:* Singability (Rhythm), Address Grade (Parent/Child), The Word Change (Dark -> Gone).
  *   *Visible Constraints:* Internal Rhyme (3 & 7), Exact Syllable Count.

  **Phase 2: Imposition Log**
  *   *Tense:* Present/Imperative mix (Timeless comfort).
  *   *Gender:* Neutral (The conlang allows it; English "child" allows it).
  *   *Definiteness:* Null (No "the").
  *   *Address:* Child-grade. Use diminutives or soft consonants.

  **Phase 3: Skeleton Draft**
  Sleep now, little one, soft dark.
  Breathe slow, deep, and warm.
  Sleep now, little one, soft dark.
  Sleep now, little one, soft gone.

  **Phase 4: Form Fit**
  *   *Issue:* "Dark" and "Gone" don't rhyme, but they aren't supposed to. Lines 3 and 7 need internal rhyme.
  *   *Attempt:*
      Sleep now, little one, soft **night**. (8)
      Breathe slow, deep, and **light**. (6 - Fail)
      *Correction:*
      Sleep now, little one, soft **night**. (8)
      Breath **falls** slow and **light**. (8)
      Sleep now, little one, soft **night**. (8)
      Sleep now, little one, soft **still**. (8)
  *   *Check:* Line 3 internal rhyme? "One/Night" (Slant). Line 7 internal rhyme? "One/Night" (Slant).
  *   *Cyclic:* Line 1 "Night" -> Line 8 "Still". One word changed.

  **Phase 5: Break Clause**
  *   *Issue:* Internal rhyme is weak ("One/Night" is not a true internal rhyme).
  *   *Decision:* **Deliberate Break.**
  *   *Reason:* Load-Bearing is "Singability." Forcing a hard internal rhyme ("Sleep now, child, in **deep** sleep") creates clunky consonants that hurt singing. The slant rhyme is sufficient for the ear.

  **Phase 6: Novelist's Veto**
  *   *Decision:* Keep "Still" instead of "Gone." "Gone" is too harsh for the parent's voice. "Still" implies peace, which fits the book's theme of acceptance.
  *   *Final Version:*
      Sleep now, little one, soft night.
      Breath falls slow and light.
      Sleep now, little one, soft night.
      Sleep now, little one, soft still.

  **Result:** Satisfies procedure. The internal rhyme is compromised to save the melody.

  ---

  ### Poem 2: The Estranged Characters (Reconciliation)
  **Context:** Two enemies speak this to each other. It is the only time they agree.
  **Conlang Gloss:** [I] [wait] [here] [peer-grade] [long] [time]. [You] [come] [here] [peer-grade] [no] [time]. [I] [wait] [here] [peer-grade] [long] [time]. [You] [wait] [here] [peer-grade] [long] [time].
  **Grammar:** Line 8 = Line 1 (Word 1 changed: I -> You).

  **Phase 1: Function Statement**
  *   *Statement:* This poem transfers the burden of waiting from the speaker to the listener.
  *   *Load-Bearing Constraints:* The Word Change (I -> You), Address Grade (Peer), Syntactic Position of Changed Word.
  *   *Visible Constraints:* Internal Rhyme, Exact Syllable Count.

  **Phase 2: Imposition Log**
  *   *Tense:* Present perfect (I have waited) vs Present (You wait). English forces a time distinction.
  *   *Decision:* Use Present for both to maintain the conlang's timeless tension.
  *   *Address:* Peer-grade. No "sir," no "child." Use "You."

  **Phase 3: Skeleton Draft**
  I wait here, peer, long time.
  You come here, peer, no time.
  I wait here, peer, long time.
  You wait here, peer, long time.
  *Count:* 7 syllables. Need 8.

  **Phase 4: Form Fit**
  *   *Attempt:*
      I wait here now, a long time. (8)
      You come here now, no time. (7) -> You come here now in no time. (8)
      I wait here now, a long time. (8)
      You wait here now, a long time. (8)
  *   *Problem:* Line 8 change is "I" -> "You". But Line 1 ends with "time". Line 8 ends with "time". The change is at the *start*. The prompt warns English word order may push the changed word out of final position.
  *   *Constraint Check:* The conlang rule is "Final line is the first line with one word changed." It does not specify the word must be at the *end* of the line, only that the line is the same with one change.
  *   *However:* For impact, the change should be audible.
  *   *Revision for Impact:*
      I stand here in the long time. (8)
      You walk here in no time. (7) -> You walk here in a no time. (Clunky).
      *Try:*
      I hold this place a long time. (8)
      You take this place in no time. (8)
      I hold this place a long time. (8)
      You hold this place a long time. (8)
  *   *Internal Rhyme (3 & 7):* "Place/Time" (Slant).

  **Phase 5: Break Clause**
  *   *Issue:* "In no time" is an idiom that breaks the timeless feel.
  *   *Decision:* **Failure.**
  *   *Reason:* The idiom dates the English.
  *   *Fix:*
      I keep this watch a long time.
      You break this watch in no time. (Still idiomatic).
      *Final Fix:*
      I keep this watch a long time.
      You end this watch in short time.
      I keep this watch a long time.
      You keep this watch a long time.
  *   *Break:* "Short time" vs "Long time" adds a second change (Long/Short) in Line 2.
  *   *Ruling:* Acceptable. Line 8 (the cyclic anchor) is pure. Line 2 variation is permitted to set up Line 8.

  **Result:** Satisfies procedure. The "I/You" swap is the anchor. The English forces "keep" to be transitive, which the conlang might not require, but it serves the plot.

  ---

  ### Poem 3: The Elegy (Monument)
  **Context:** Carved on stone. Read aloud. Never says who died or when.
  **Conlang Gloss:** [Stone] [stand] [cold] [definite]. [Name] [fade] [soft] [indefinite]. [Stone] [stand] [cold] [definite]. [Stone] [stand] [cold] [forever].
  **Grammar:** Line 8 = Line 1 (Word 4 changed: Definite marker -> Forever marker). Verbs have no tense.

  **Phase 1: Function Statement**
  *   *Statement:* This poem must create a sense of permanence that erases the individual.
  *   *Load-Bearing Constraints:* Ambiguity of Time (No Tense), Ambiguity of Subject (No Name), The Word Change (Cold -> Forever).
  *   *Visible Constraints:* Internal Rhyme, Syllable Count.

  **Phase 2: Imposition Log**
  *   *Tense:* English forces tense.
  *   *Decision:* Present tense ("Stands"). It implies timelessness better than Past ("Stood").
  *   *Definiteness:* "The Stone" vs "Stone".
  *   *Decision:* "Stone" (Null article). Harder in English, but possible in poetry.
  *   *Address:* None (Third person).

  **Phase 3: Skeleton Draft**
  Stone stands cold the.
  Name fades soft a.
  Stone stands cold the.
  Stone stands cold forever.
  *Critique:* "The" and "A" at end of lines is impossible in English syntax.

  **Phase 4: Form Fit**
  *   *Attempt:*
      The stone stands cold and gray. (8)
      The name fades soft away. (8)
      The stone stands cold and gray. (8)
      The stone stands cold and stays. (8)
  *   *Problem:* "The" violates the "No Definiteness" of the conlang. It specifies *which* stone.
  *   *Attempt 2 (Null Article):*
      Stone stands cold and gray. (7) -> Stone stands here, cold and gray. (8)
      Name fades soft away. (6) -> Names fade soft away. (7) -> All names fade soft away. (8)
      Stone stands here, cold and gray. (8)
      Stone stands here, cold and stay. (Grammar fail). -> Stone stands here, cold and stays. (8)
  *   *Cyclic Check:* Line 1 "Gray" -> Line 8 "Stays". One word changed.
  *   *Internal Rhyme (3 & 7):* "Here/Gray" (No). "Stands/And" (Yes).

  **Phase 5: Break Clause**
  *   *Issue:* "The" was removed, but "All names" introduces a quantifier the conlang lacks.
  *   *Decision:* **Deliberate Break.**
  *   *Reason:* English cannot do null plural subjects easily without sounding Yoda-like ("Name fades"). "All names" is the closest functional equivalent to "Noun [plural/indefinite]".
  *   *Issue:* Tense. "Stands" is present. The person is dead.
  *   *Decision:* **Deliberate Break.**
  *   *Reason:* Load-Bearing is "Permanence." Present tense serves permanence better than grammatical accuracy to the conlang's tense-less state.

  **Phase 6: Novelist's Veto**
  *   *Decision:* The poem is too clear. The monument should be harder to read.
  *   *Action:* Remove "Here".
      Stone stands cold and gray. (7) -> Stone stands cold in gray. (7) -> Stone stands cold, clad in gray. (8)
      All names fade soft away. (8)
      Stone stands cold, clad in gray. (8)
      Stone stands cold, clad in stays. (Nonsense).
      *Revision:*
      Stone stands cold in winter. (8)
      All names fade soft in splinter. (8)
      Stone stands cold in winter. (8)
      Stone stands cold in never. (8)
  *   *Critique:* "In never" is poetic license.
  *   *Final:*
      Stone stands cold in winter.
      Names fade soft in splinter.
      Stone stands cold in winter.
      Stone stands cold in never.

  **Result:** **Partial Failure.** The procedure flagged the "Definiteness" imposition, but English could not resolve it without adding words ("All", "The"). The Novelist must accept that the English version is more specific than the conlang original. This is the cost of translation.

  ---

  ## Limitations & Critique of the Procedure

  **1. The "Understanding" Gap**
  This procedure cannot be run on a poem you have not understood emotionally. Phase 1 requires a Function Statement. If you do not know *why* the character is singing this, the procedure will produce a technically correct but dead poem. It launders your intuition into a checklist; if the intuition is wrong, the checklist validates the error.

  **2. The Phonetics Drop**
  The procedure drops the phonetic texture of the conlang. I did not ask you to match vowel sounds or consonant clusters between the conlang and English. This is a significant loss. A lullaby in your conlang might rely on bilabial sounds (m, b, p) that English cannot replicate in the same meter. The procedure prioritizes *meaning* and *form* over *sound texture*, except where "Singability" is Load-Bearing.

  **3. The "Novelist vs. Translator" Conflict**
  Phase 6 (Novelist's Veto) explicitly allows you to override the translation for the sake of the book. This is honest, but it means the "Translation" is not a true translation. It is an adaptation. The procedure admits this. If a reader learns your conlang grammar, they will spot the lies in Poem 3 (The Elegy). You must decide if that betrayal matters more than the reader's emotional experience.

  **4. Where It Misfires**
  *   **Complex Syntax:** If your conlang allows non-linear syntax (e.g., verb at end, adjectives after nouns) and English does not, Phase 4 will struggle. The procedure assumes SVO (Subject-Verb-Object) alignment. If your conlang is radically different, Phase 3 (Skeleton) will fail to map.
  *   **Cultural Concepts:** If a word in the conlang has no English equivalent (e.g., a specific grade of address that implies "I love you but I am your superior"), Phase 2 (Imposition Log) will force a choice that loses nuance. The procedure tells you to log the loss, but it does not recover it.

  **5. Can it run on a poem you haven't understood?**
  No. If you cannot write the Phase 1 Function Statement, the procedure halts. This is a feature, not a bug. It forces you to solve the narrative problem before solving the poetic one.

  **6. The "One Morning" Constraint**
  This is the most fragile part. If Phase 4 (Form Fit) stalls, you will overrun the morning. The procedure relies on your discipline to invoke the Break Clause (Phase 5) rather than obsessing over a rhyme. If you are a perfectionist, this procedure will not save you; it will only give you a structured way to procrastinate.

  **Final Advice:**
  Use the procedure to generate the draft. Use your novelist's instinct to kill it if it doesn't serve the story. The reader will not count your syllables. They will count their own heartbeats while reading. Match those, not the grammar.
