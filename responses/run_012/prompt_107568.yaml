prompt: |-
  I'm prepping a seminar on Montaigne and I keep going back and forth on something in the cannibals essay. Montaigne basically says we call barbarism whatever isn't our own custom, and then he spends the rest of the piece describing the Brazilian peoples in ways that clearly aim to shame his own countrymen — their wars are gentler, their cannibalism is motivated by revenge rather than by the torture Europeans inflict, they treat their prisoners in a way he almost admires. Heres my problem: is he actually a relativist, or is he smuggling in a universal standard — nature, reason, some notion of the original human condition — and just using the New World as a mirror? And does the essay's argument survive once you notice he still calls some practices good and others bad? Help me sort out what's actually going on in the argument, and what the most defensible reading is. Not looking for a reading list, just help thinking it through.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User's Request:**
      *   **Topic:** Montaigne's essay "Of Cannibals" (Des Cannibales).
      *   **Core Tension:** Is Montaigne a cultural relativist (all customs are equal/valid relative to their context) or is he using a universal standard (Nature/Reason) to judge *both* Europeans and Brazilians, ultimately favoring the Brazilians?
      *   **Specific Problem:** Montaigne defines barbarism as calling what isn't our custom "barbaric," yet he spends the essay praising Brazilian practices and condemning European ones. If he judges some practices as "better" (gentler wars, honorable cannibalism vs. torture), isn't he violating his own relativist premise?
      *   **Goal:** Sort out the argument, determine what's actually going on, and propose the most defensible reading.
      *   **Constraint:** No reading list, just help thinking it through.

  2.  **Deconstruct the Text/Argument:**
      *   *Opening:* Famous definition of barbarism. "Each man calls barbarism whatever is not his own practice." This sounds like relativism.
      *   *Middle:* Description of the Tupinambá (Brazilian indigenous people). No commerce, no letters, no poverty/riches, no contracts. They live according to "Nature."
      *   *Comparison:* European wars (religious, cruel, betrayal) vs. Brazilian wars (valor, revenge). European torture (Inquisition, St. Bartholomew's Day) vs. Brazilian cannibalism (ritualistic, post-mortem revenge).
      *   *Conclusion:* "There is more barbarity in eating a man alive than in eating him after he is dead." (Paraphrased).

  3.  **Evaluate the "Relativist" Reading:**
      *   *Strengths:* The opening line is the manifesto of cultural relativism. He critiques ethnocentrism. He acknowledges that European eyes are biased.
      *   *Weaknesses:* He doesn't stop at "different." He says "better." He praises their virtue, their lack of lying, their naturalness. If he were a strict relativist, he would say European torture is "European" and Brazilian cannibalism is "Brazilian," and neither is objectively worse. But he clearly thinks European torture is *worse*.

  4.  **Evaluate the "Universalist/Natural Law" Reading:**
      *   *Strengths:* Montaigne appeals to "Nature" (la Nature). He suggests the Brazilians are closer to the "original condition of man." He uses Reason to critique European excess.
      *   *Weaknesses:* If he appeals to Nature, why start with the relativist definition of barbarism? Is he contradicting himself?

  5.  **Synthesize: The "Critical Humanist" or "Pyrrhonian" Reading:**
      *   Montaigne isn't a modern anthropological relativist (who suspends judgment entirely).
      *   He is a *skeptic* (Pyrrhonist). His goal isn't to say "Brazilian culture is perfect." His goal is to *shake* European dogmatism.
      *   The relativist opening is a *tool*, not the final destination. It clears the ground. It removes the automatic assumption that "French = Civilized, Other = Savage."
      *   Once that assumption is removed, he can apply a *different* standard: Not "Custom," but "Nature/Reason."
      *   So, he isn't smuggling in a standard; he's *swapping* the standard. He rejects "Custom" as a metric for morality and replaces it with "Nature."
      *   *The Twist:* Even then, he doesn't fully idealize the Brazilians. He admits they eat people. He just argues their *reasons* and *methods* are less vicious than Europe's religious wars.

  6.  **Address the "Good vs. Bad" Problem:**
      *   Does the argument survive if he judges some practices good/bad? Yes, because his target isn't "judgment" per se, but "unexamined judgment based on habit."
      *   He is arguing for a *truer* barbarism. True barbarism isn't difference; it's cruelty/vice. By that metric, Europe wins the prize for barbarism.
      *   So, he is a relativist about *custom* (etiquette, dress, food), but a universalist about *virtue/vice* (cruelty, honesty, courage).

  7.  **Drafting the Response (Iterative Process):**
      *   *Acknowledge the tension:* It's the classic debate on this essay. You're right to spot the friction.
      *   *Define the two poles:* Methodological Relativism vs. Normative Universalism.
      *   *Propose the Synthesis:* Montaigne uses relativism as a *wedge*, not a home.
      *   *Key Concept:* "Nature" vs. "Artifice." The Brazilians represent Nature; Europeans represent Artifice/Corruption.
      *   *The "Barbarism" Redefinition:* He redefines the word. Barbarism = Cruelty, not Difference.
      *   *The Skeptical Angle:* He's not building a system; he's undermining certainty. The goal is self-knowledge for the European reader.
      *   *Defensible Reading:* He is a **Critical Naturalist**. He uses the "Other" to reveal the "Self." The judgment isn't contradictory; it's the point.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Caution:* Don't make him sound too modern. He's not a human rights activist. He's an aristocrat concerned with virtue and honor.
      *   *Nuance:* Make sure to mention that he doesn't *fully* exonerate the cannibals. He calls the eating of men "horrible," just *less* horrible than European torture. This is crucial. It saves him from naive primitivism.
      *   *Structure:*
          1.  Validate the user's intuition (it's not a simple binary).
          2.  Break down the "Relativist Opening" (it's strategic).
          3.  Explain the "Universal Standard" (Nature/Reason).
          4.  Resolve the "Judgment" paradox (Custom vs. Virtue).
          5.  Conclusion on the "Most Defensible Reading."

  9.  **Final Polish:** Ensure tone is seminar-appropriate (analytical, nuanced, encouraging critical thought). (Check against constraints: No reading list.)

  *(Self-Correction Note)*: I need to make sure I don't just say "He's both." I need to explain *how* the two function together. The relativism is epistemological (how we know); the universalism is ethical (how we should act).

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  This is the central crux of "Of Cannibals," and you are right to feel the tension. If Montaigne were a strict cultural relativist, the essay would end after the first paragraph. If he were a rigid moral universalist, he wouldn't need the Brazilians to make his point.

  The most defensible reading is that Montaigne is not a relativist in the modern anthropological sense, nor is he simply smuggling in a Christian or Stoic universalism. Instead, he is employing **methodological relativism to clear the ground for a critique based on Nature.**

  Here is a way to sort out the argument for your seminar, breaking down the tension between his opening definition and his subsequent judgments.

  ### 1. The Relativist Opening is a Tool, Not a Doctrine
  Montaigne's famous definition—"Each man calls barbarism whatever is not his own practice"—is often cited as the birth of cultural relativism. But in the context of the essay, it functions more like a **skeptical wedge**.

  His goal here is epistemological humility. He wants to disarm the European reader's automatic reflex to equate "different" with "inferior." He is attacking *habit* (custom) as a valid metric for truth. If you judge the world solely by your own customs, you are blind.

  So, when he says there is no such thing as barbarism relative to custom, he is telling us: **Custom is not a moral standard.**

  ### 2. The Universal Standard: Nature vs. Artifice
  Once he has dismantled "Custom" as a valid judge of value, he does not leave a vacuum. He replaces "Custom" with **"Nature."**

  This is where you are correct that he is smuggling in a universal standard. But it isn't necessarily Christian or even strictly Stoic; it is a Renaissance Humanist conception of the "natural law." Montaigne argues that the Tupinambá (the Brazilian people) live closer to the "original condition of man." They are governed by natural reason rather than the "artifice" of European civilization.

  *   **Europe:** Governed by artifice, greed, religious dogma, and complex laws that mask vice.
  *   **Brazil:** Governed by nature, necessity, and immediate virtue.

  Therefore, when Montaigne judges the Brazilians as "better" in certain regards, he isn't violating his opening premise. He is saying: *If you stop judging by Custom (which makes them barbarians) and start judging by Nature/Reason (which makes them virtuous), the verdict flips.*

  ### 3. Resolving the "Good vs. Bad" Paradox
  Your specific problem is: *Does the argument survive if he still calls some practices good and others bad?*

  Yes, because Montaigne distinguishes between **moral difference** and **moral error**.

  *   **Moral Difference (Relativism):** How you dress, what you eat, how you greet a king, whether you bury or burn the dead. Montaigne suggests these are neutral customs.
  *   **Moral Error (Universalism):** Cruelty, treachery, lying, excessive violence. Montaigne suggests these are vices regardless of culture.

  The brilliance of the essay is that he shows the Europeans failing the universal test *worse* than the cannibals.
  *   **The Cannibals:** Eat the dead out of revenge. It is gruesome, yes, but it is honest, open, and follows a code of valor.
  *   **The Europeans:** Torture the living (Inquisition, religious wars) out of dogma. This is secretive, hypocritical, and inflicts pain on the sentient.

  Montaigne explicitly writes: *"I think there is more barbarity in eating a man alive than in eating him after he is dead."*

  He is not saying cannibalism is *good*. He is saying it is *less bad* than the European alternative. He admits the practice is "horrible," but he insists the *moral quality* of the act (the intent and the suffering involved) is superior in the Brazilian context.

  ### 4. The Pyrrhonian Angle: The Goal is Self-Knowledge
  For your seminar, it is crucial to emphasize that Montaigne is not actually writing about Brazil. He is writing about France. The Brazilians are a **mirror**.

  If he were a true relativist, he would say, "They are different, we are different, let's leave it at that." But Montaigne is a moralist. He wants to shame his countrymen into reform. He uses the "noble savage" trope (before it existed as a trope) not to idealize the indigenous people, but to **defamiliarize** European vice.

  By showing that people we call "savages" possess more honor, honesty, and courage than we do, he forces the reader to ask: *Who is the real barbarian?*

  This aligns with his Pyrrhonian skepticism. He isn't trying to build a perfect system of ethics; he is trying to shake the reader out of dogmatic slumber. The contradiction you sense is intentional friction designed to make the reader think.

  ### 5. The Most Defensible Reading
  For your seminar, I recommend arguing for **Critical Naturalism**.

  *   **Not a Relativist:** He clearly believes some things are objectively worse than others (torturing the living is worse than eating the dead).
  *   **Not a Simple Universalist:** He acknowledges that European "civilization" often corrupts natural virtue rather than enhancing it.
  *   **The Synthesis:** Montaigne argues that **Custom obscures Nature.** To find the universal standard of virtue, one must look past local custom. The Brazilians happen to be closer to that standard *in this specific instance*, not because they are perfect, but because they are less corrupted by the artifice of "civilization."

  **Does the argument survive?**
  Yes, provided you accept his premise that "Nature" is a valid metric for morality. If you accept that cruelty is objectively worse than honesty, his argument holds: The Brazilians are cruel but honest; the Europeans are cruel and dishonest. Therefore, the Brazilians are less "barbaric" by the only metric that actually matters (moral virtue), even if they are more "barbaric" by the metric of etiquette (custom).

  **Seminar Discussion Point:**
  You might ask your group: *Is Montaigne guilty of the same ethnocentrism he critiques?* He praises the Brazilians for lacking things *Europeans* value (commerce, laws, literacy) and lacking things *Europeans* fear (poverty, betrayal). Is he actually seeing the Brazilians, or is he just projecting a fantasy of what Europe lost?

  This acknowledges his universalism while critiquing the limits of his "mirror." It keeps the tension alive without resolving it into a simple label.
