          *   *Verdict:* It's not an *overread*, but it needs nuance. He wasn't a revolutionary. He was a "socialist of the chair" or a liberal socialist. The draft says "moved in left-wing circles," which is safe. The connection to Neurath is strong.
          *   *Advice:* Acknowledge the Neurath connection but note Carnap's more reserved temperament compared to Neurath's activism.

      *   **Q2: Principle of Tolerance $\rightarrow$ Democratic Control:**
          *   *Concept:* Tolerance = "In logic, there are no morals. Everyone is at liberty to build up his own logic, i.e., his own form of language, as he wishes."
          *   *Application:* Applying this to *political* objective functions is a bold move. It works if framed as "framework choice."
          *   *Risk:* Tolerance was about *linguistic frameworks* to avoid dogmatic metaphysics, not necessarily about *voting*. However, if the "framework" is the welfare function, then choosing it is a practical convention, not a scientific truth. This aligns with democratic deliberation.
