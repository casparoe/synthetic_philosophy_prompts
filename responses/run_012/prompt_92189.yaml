  6.  **Final Review against User Prompt:**
      *   (a) Criteria of what? (Rational Soul).
      *   (b) A priori/empirical tension? (Metaphysics drives physics, observation illustrates).
      *   (c) Turing comparison? (Behavioral focus vs. Ontological commitment).
      *   (d) Second criterion load-bearing? (Yes, Universal Reason underpins Language).
