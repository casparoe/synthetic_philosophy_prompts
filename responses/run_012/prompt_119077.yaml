answer: |-
  I hear the weariness in that description, and it makes sense. You are standing in the gap between a description of how the world feels to the people living in it and a description of how the world functions as a machine. When you ask me to take the anthropologist's strongest claim—that corruption is a Western export and that the official is fulfilling a local moral code rather than breaking a universal one—and run it through the machinery of institutional economics, you are asking for a stress test. You want to know if the moral economy survives when treated as a set of incentives rather than a set of meanings.

  So let's build the model. In the vocabulary of institutional economics, the anthropologist's official is not a deviant; he is a rational agent operating under a specific set of contractual constraints. The first thing we translate is the idea of conflicting obligations. Economics calls this a multiple-principal problem. The official is an agent who serves two principals simultaneously. The first principal is the state, which demands impersonal impartiality and public goods. The second principal is the kinship network or patron, which demands particularistic redistribution and loyalty. The anthropologist says the official is keeping his moral code by serving the kin. The economist says the official is maximizing utility by serving the principal who can best monitor and punish him. In many weak states, the monitoring and enforcement costs for the state principal are prohibitively high. The state cannot see what the official does, but the uncle knows immediately if the nephew fails to deliver. Therefore, the kinship contract is the binding constraint. The official isn't being immoral; he is responding to the incentive compatibility constraint of his immediate environment.

  Then there is the claim that impersonal impartiality is just a local ethic we promoted. In economic terms, this is a claim about the definition and enforcement of property rights over office. The Western model assumes property rights to the decisions made in that office belong to the public. The anthropologist suggests that in many contexts, the property rights to the office are privately held by the officeholder or his lineage. When the official steers a contract to a cousin, he is not stealing public property; he is exercising private property rights over a resource that the state claims to own but cannot effectively control. This is rent-seeking, certainly, but it is rent-seeking within a stable institutional equilibrium. The anthropologist calls it a moral duty; the economist calls it the secure enforcement of private property rights in a vacuum of public enforcement.

  You also have the envelope from the client. The anthropologist sees a gift that cements a relationship. The institutional economist sees a gift-exchange model functioning as an efficiency wage. The official's state salary is too low to induce loyalty to the public mission. The private client pays a premium above the going rate—the bribe or gift—and in exchange, the official repays this with effort and loyalty directed toward the client. This creates a self-enforcing contract where the official risks losing the future stream of gifts if he defects. Finally, there is the argument that this system might actually work. This is the "grease the wheels" hypothesis. If the bureaucracy is rigid, poorly designed, or the laws are bad, the side payment allows resources to flow to those who value them most, bypassing the bottleneck. In this view, corruption is a second-best solution to institutional failure, potentially efficiency-improving in the short run even if it undermines the state's capacity in the long run.

  When you lay it out this way, a lot of the anthropologist's story survives, but it changes texture. The mechanics hold up. The idea that the official is responding to rational incentives within a specific institutional framework is robust. The idea that the state's claim to ownership is contested is also standard institutional analysis. But what dies in the translation is the normative weight. The anthropologist wants to say that the kinship obligation is *right* and the state's claim is *foreign*. The economist hears only that the kinship obligation is *binding* and the state's claim is *expensive to enforce*. Economics strips the word "moral" of its content and replaces it with "incentive compatible."

  This brings me to the residue, the part that matters most to you. There is something the anthropologist says that simply cannot be said in this vocabulary. It is the claim that the official feels no guilt, that he is walking upright within his own world. Economics cannot capture the internal experience of legitimacy. It can model the behavior, but it cannot account for the feeling that the behavior is justified. Now I have to make the choice you asked for. I do not think this is because economics is normatively blind and therefore missing the point. I think it is because the anthropologist's claim was never as clear as it sounded, and the translation exposes the hole.

  When the anthropologist says the official is keeping his moral code, they are often describing a stable equilibrium of power and calling it a culture. The translation exposes that what looks like a moral duty is often just a survival strategy in a place where the state cannot protect you unless you buy protection from a patron. To call it a "moral economy" dignifies what is often just a high-transaction-cost equilibrium born of weakness. If I commit to this view, I am saying that the cultural explanation is often a post-hoc rationalization for incentive structures that would look familiar to a robber baron in any century. The official may feel he is doing right, but that feeling is endogenous to the system that keeps him poor and dependent on patrons.

  The cost of holding this position is significant. It costs me the ability to treat the local context with the reverence the anthropologist demands. It forces me to accept that when I write about the road that doesn't get built, the cultural explanation is secondary to the math of diverted resources. It makes me sound like the Western auditor I claimed to critique, someone who looks at a complex web of human relationships and sees only leakage and inefficiency. I lose the nuance of human meaning. I reduce the official's world to a set of constraints and payoffs. I risk becoming the technocrat who believes that if we just fix the incentives, the culture will follow, ignoring that the culture is the only thing holding the society together in the absence of the state. But I choose this because the alternative is to accept that development failure is just a difference of opinion, and I don't believe the people waiting for the road that never gets built would agree that their suffering is just a different ethical framework. The anthropologist offers understanding, but the economist offers the only language that explains why the road isn't there, and if you want to fix it, you have to speak the language of the machine, even if it strips the soul from the story.
