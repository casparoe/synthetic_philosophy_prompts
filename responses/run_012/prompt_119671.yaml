answer: |-
  You are right to suspect a trenchcoat. What you have isolated is a composite failure mode that sits at the intersection of statistical identification, measurement validity, and normative justification. There is no single standard term in the social choice or political theory literature that captures the specific *normative vulnerability* arising from the *structural unidentifiability* you describe.

  The existing concepts you floated are the constituent parts, but none of them alone captures the whole shape. Here is the breakdown of the "coats," why they don't fit individually, and the term I propose to carve out the phenomenon you are tracking.

  ### The Constituent Concepts (and why they fall short)

  **1. Observational Equivalence (Econometrics/Statistics)**
  *   **The Fit:** This is the formal engine of your problem. Two different data-generating processes (independent errors vs. correlated errors) produce the exact same likelihood function for the observed data (the group's hit rate).
  *   **The Miss:** Observational equivalence is a descriptive claim about models and data. It says, "You can't tell these apart." It does not inherently carry the normative sting you identified. One can have observational equivalence without a justificatory crisis (e.g., two different physical models predicting the same trajectory). Your problem is that the *justification* for the institution relies on one side of the equivalence class while the data permits the other.

  **2. Construct Validity (Psychometrics/Measurement Theory)**
  *   **The Fit:** This captures the mismatch between what you think you are measuring (collective intelligence/aggregation) and what you are actually measuring (shared bias/redundancy). You are treating the group output as a valid indicator of the "Condorcet mechanism," but it might be an indicator of a "Hive Mind mechanism."
  *   **The Miss:** Construct validity is usually about whether a test measures a trait. Your problem is more specific: it is about whether a *procedure* satisfies the conditions required for its own normative defense. It's not just that the measure is wrong; it's that the procedure erases the evidence needed to validate the procedure.

  **3. Epistemic Circularity (Epistemology)**
  *   **The Fit:** This captures the move where agreement is used to prove competence, which is used to justify the aggregation, which produces the agreement.
  *   **The Miss:** Circularity is a logical relation between propositions. Your problem is structural and statistical. It persists even if no one makes the circular argument explicitly. The institution is unjustified *even if* the actors are silent, simply because the requisite parameter (independence) is structurally inaccessible given the output (aggregate accuracy).

  ### The Carving: The Independence Identification Problem

  Since no existing term captures the specific fusion of *statistical unidentifiability* and *normative justificatory gap* in aggregation contexts, I propose you coin:

  **The Independence Identification Problem (IIP)**

  **Definition:**
  The Independence Identification Problem occurs when the normative justification of a collective decision-making procedure relies on a statistical parameter (typically error independence) that is structurally unidentifiable from the procedure's observable output (aggregate accuracy).

  **The Structure of the IIP:**
  1.  **The Theorem Requirement:** A normative claim (e.g., "This committee is epistemically superior") relies on a theorem (e.g., Condorcet) that requires Parameter $X$ (Independence) to hold.
  2.  **The Data Constraint:** The only available data is Aggregate Outcome $Y$ (Group Accuracy).
  3.  **The Equivalence Class:** Outcome $Y$ is consistent with both High-$X$ (Independence) and Low-$X$ (Correlation) states.
  4.  **The Justificatory Gap:** Because $Y$ cannot distinguish the states, the assertion that Parameter $X$ holds is unsupported by the institution's track record, rendering the normative claim unstable.

  ### Edges and Boundaries

  To ensure this term does useful work for you, you need to know what falls *outside* the IIP.

  **1. Cases with Micro-Data (Outside IIP)**
  If you can observe individual votes alongside ground truth, you can estimate the correlation matrix. You might find the errors are correlated, and the Condorcet justification fails, but the *Identification Problem* is solved. You know which world you are in. The IIP specifically requires the *hiding* of the individual data behind the aggregate.

  **2. Cases with Exogenous Validation (Outside IIP)**
  If the competence of members is established via external testing (e.g., certified experts passing a skills exam) *prior* to the vote, and independence is ensured by protocol (e.g., isolation booths), the IIP is mitigated. The IIP thrives where the *track record of the group* is the primary evidence for the *competence of the members*.

  **3. Simple Common Cause (Outside IIP)**
  If everyone reads the same biased newspaper, that is a *source* of correlation. But if you can measure the correlation, it's not an Identification Problem. The IIP is not the *presence* of correlation; it is the *inability to detect* the correlation from the success rate. A committee can be highly correlated and we can know it (no IIP). A committee can be highly correlated and we think they are independent because they are right often (IIP).

  **4. Logical Circularity (Outside IIP)**
  If a theorist argues, "The group is wise because it agrees, and it agrees because it is wise," that is a logical fallacy. The IIP exists even if the theorist makes no such argument. The IIP is a structural feature of the *institution's opacity*, not necessarily a flaw in the *theorist's syntax*.

  ### Why this carving matters for your work

  Naming this the **Independence Identification Problem** allows you to shift the burden of proof in institutional design.

  Currently, the default assumption in many formal defenses of democracy or expert panels is that independence holds unless proven otherwise. The IIP demonstrates that in aggregate-only environments, independence is *in principle* unprovable. Therefore, the burden must shift: an institution cannot claim Condorcet-style epistemic authority unless it provides a mechanism to *break* the equivalence class (e.g., by mandating diverse information sources, revealing individual votes, or structuring deliberation to decorrelate errors).

  It turns the "independence assumption" from a technical premise into a design constraint. If you cannot identify independence, you cannot claim the theorem's benefit. That is the carving.
