  **Example:**
  "I know stealing is bad, but lying is worse."

  **Diagnosis:**
  To handle this, the expressivist must construct a logic of comparative attitudes—defining "worse" not as a relation between properties, but as a relation between the strength of disapproval or the priority of plans. They have to demonstrate that violating this ordering (e.g., planning against stealing more strictly than lying) constitutes a rational inconsistency, not just a change of mind. The realist gets this for free: if "bad" refers to a property, "worse" simply tracks objective degrees of that property, and standard predicate logic applies automatically. Ultimately, the addition buys functional coherence, but to the realist, it remains only a better-looking surface; it mimics the structure of truth-conditional logic without the ontological grounding to make those conditions actually true.
