prompt: |-
  I teach a 90-minute session in an upper-level seminar on philosophy of mind, sixteen students, most of them comfortable with functionalism and the Chinese-room debate but with no background in the specific thought experiment where a colony of ants is imagined to be a minded acquaintance of the sort one might chat with over tea. I want to run an activity that makes them feel the pull of the claim that the colony has a mind of its own, and then makes them feel how hard it is to say what would settle it — before I ever say the words "intentional stance" or raise the question of whether the colony is genuinely a subject of experience or merely something we find it convenient to talk about as if it were. My worry is that the standard discussion is too easy: everyone agrees the colony is "just ants" doing simple things, and the conversation dies there. So I want them to actually be the ants first, each with a rule that is genuinely local and stupid, and then to be confronted with the thing their collective produced, which none of them intended and none of them could have described from inside their own rule. Please design the whole session: the setup, the materials, the local rules (I want a real, runnable set — something like deposit-and-follow rules that make the group sort, bridge, or forage without any ant knowing the goal), the number of rounds, and the moment where I reveal to them what they collectively did and ask them to attribute a goal to it. I would like the attribution step to be forced rather than optional: arrange it so that answering a simple question about the group's behavior — what it was trying to do, whether it made a mistake, whether it wanted the thing it got — is much easier in agent language than in ant language, so that the convenience of the mental vocabulary is something they feel rather than something I assert.

  Then build in a second phase that puts pressure on the first: after the colony has been treated as an agent, run a variation in which the same output is produced by a script, a lookup table, or by a shill who has been told the answer, so the group has to decide whether the mentality was in the behavior or in the producing of it; and, if you can, a variation in which the colony behaves identically but each ant is secretly following a different rule than the one on its card, so they must ask whether there is any fact of the matter about what the colony is doing independent of our description. I want the debrief to map each moment of the activity onto the philosophical joints — the difference between a system whose parts have their own aims and a system that has an aim, the difference between something we can predict and something that means or wants, the recurrence of the same question one level up when we ask whether a single human is more than her neurons — and to be honest about which feature of the idea the activity simply cannot reproduce, namely the question of whether there is anything it is like to be the colony, since every participant is a human with a mind already, so the appearance of a collective mentality may be borrowed from them and the activity cannot rule that out. Finally, tell me what will predictably go wrong the first time I run this — where the rules will break down, where a clever student will short-circuit the emergence by shouting the global pattern out loud, and how to keep the group from collapsing into the "just ants" verdict too early — and give me a contingency for a group that is too small or too uncoordinated to produce anything emergent at all. Assume I can supply index cards, a large floor space, and some tokens or sticky notes, but no technology and no budget.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 16 upper-level philosophy of mind students. Comfortable with functionalism/Chinese Room, but new to the "Ant Colony Mind" thought experiment (likely referencing Hofstadter's *I Am a Strange Loop* or similar collective intentionality discussions).
      *   **Duration:** 90 minutes.
      *   **Goal:** Make them *feel* the pull of attributing mind to the colony, then feel the difficulty of settling it, *before* introducing technical terms (Intentional Stance, etc.).
      *   **Key Constraint:** Avoid the "just ants" dismissal. Force the attribution of agency through the activity design.
      *   **Activity Structure:**
          1.  *Phase 1 (Embodiment):* Students act as ants with local/stupid rules. They produce a global pattern none intended. Attribution of goals must be forced/easier in agent-language.
          2.  *Phase 2 (Pressure):* Variations (script/lookup table/shill; hidden rule changes) to challenge where the mentality resides.
          3.  *Debrief:* Map to philosophical joints (parts vs. whole, prediction vs. meaning, levels of organization). Acknowledge limitations (qualia/what-it's-like).
          4.  **Troubleshooting:** Predict failures (students guessing global pattern, rules breaking, lack of emergence) and provide contingencies.
      *   **Resources:** Index cards, large floor space, tokens/sticky notes. No tech/budget.

  2.  **Deconstruct the "Ant Colony" Problem:**
      *   The core philosophical tension is between *sub-personal* mechanisms (ants following pheromones) and *personal* level descriptions (the colony foraging/defending).
      *   To make this visceral, the students need to be *restricted* in their knowledge. They cannot know the global goal.
      *   To make attribution *forced*, the output needs to look like a *mistake* or a *choice* that only makes sense at the collective level. If they just build a bridge, it looks like engineering. If they "decide" to abandon a food source because it's "too dangerous" (based on traffic density), that looks like a decision.

  3.  **Designing Phase 1: The Embodiment (The "Stupid Ants")**
      *   *Setup:* 16 students. Floor space. Tokens (food/danger).
      *   *Rules:* Must be local, reactive, and simple. No communication except via tokens/position.
      *   *The Task:* They need to sort tokens or move them in a way that implies a preference.
      *   *Idea:* "The Sorting Game."
      *   *Refinement:* Let's make it about *resource allocation* under pressure. This creates "decisions."
      *   *Rules:*
          *   Red tokens = Food. Blue tokens = Danger.
          *   Ants pick up tokens based on local density.
          *   If you see 2 Reds near you, drop what you have. If you see 1 Blue, run away.
          *   *Wait, this is too chaotic.*
      *   *Better Idea:* "The Bridge/Path Selection."
      *   *Best Idea for "Forced Attribution":* **The Negotiated Settlement.** The colony must "choose" between two options based on distributed information no single ant has.
      *   *Revised Plan:* **The Token Sort with a Twist.**
      *   *Setup:* Two zones (Zone A, Zone B). A pile of mixed tokens in the middle.
      *   *Ant Rules:*
          1.  Pick up a token.
          2.  Walk randomly.
          3.  If you hold a Red token and enter Zone A, drop it *unless* you see 3+ Reds already there.
          4.  If you hold a Red token and enter Zone B, drop it *only if* you see 1+ Red there.
          5.  (Symmetric rules for Blue, inverted).
      *   *Outcome:* The colony will "decide" to put Reds in one zone and Blues in the other, but *which* zone gets which color is determined by the first few random drops. It creates a *convention*.
      *   *Wait, I need them to feel the "Mind".* A convention is good, but a *reaction to a threat* is better.
      *   *Let's try the "Predator Response" scenario.*
      *   *Setup:* 16 Students (Ants). 1 Instructor (Environment). Tokens = Food.
      *   *Rules:*
          1.  Wander.
          2.  If you find Food, carry it to the "Nest" (a specific corner).
          3.  If you bump into another Ant carrying Food, drop your Food and run to the "Alarm Zone."
          4.  If you are in the Alarm Zone for 10 seconds, return to foraging.
      *   *The Twist:* The Instructor introduces a "Predator" (a red cone) in one path.
      *   *Problem:* This requires the instructor to manipulate too much.
      *   *Let's go with a specific emergent sorting task that looks like a **preference**.*
      *   *Activity:* **The Color Consensus.**
      *   *Materials:* 50 Red sticky notes, 50 Blue sticky notes. Two large sheets of paper on the wall (Option Left, Option Right).
      *   *Ant Rules (on index cards):*
          *   Rule A (50% of class): Pick up a note. If it matches the majority of notes currently on Left, stick it on Left. If not, stick it on Right.
          *   Rule B (50% of class): Pick up a note. If it matches the majority of notes currently on Right, stick it on Right. If not, stick it on Left.
          *   *Constraint:* You cannot talk. You cannot count globally. You can only look at the *immediate* cluster where you are standing.
      *   *Emergence:* The group will rapidly polarize. All Reds on one side, Blues on the other. OR, they will cluster all notes on one side regardless of color.
      *   *Critique:* This is too abstract. Let's make it physical movement.
      *   *Final Decision for Phase 1:* **The Traffic Jam Resolution.**
      *   *Scenario:* The colony needs to move "Food" (tokens) from Source to Nest. There are two paths. One path gets "blocked" (simulated by density rules).
      *   *Rules:*
          1.  Pick up token at Source.
          2.  Choose Path 1 or 2 randomly.
          3.  If you bump into someone (physical proximity) on the path, drop token, turn around, return to Source.
          4.  If you reach Nest, drop token, return to Source.
          5.  *Crucial Rule:* If you return to Source without a token (because you dropped it), you must wait 5 seconds before picking up a new one.
      *   *Outcome:* The colony will naturally balance the load between paths. If one path gets crowded, efficiency drops, ants switch.
      *   *The "Mind" Moment:* Introduce a "blockage" manually ( Instructor stands in one path). The colony will "decide" to route around.
      *   *Wait, the prompt asks for: "answering a simple question about the group's behavior... is much easier in agent language."*
      *   *Let's refine the "Decision" aspect.*
      *   *Activity:* **The Two-Door Choice.**
      *   *Setup:* Two doors (marked A and B) at one end of the room. A "Nest" at the other.
      *   *Task:* Move tokens from Nest to a "Storage" zone, but they must pass through A or B.
      *   *Hidden Variable:* Door A has a "tax" (students must do 5 jumping jacks). Door B is clear.
      *   *Ant Rules:*
          1.  Pick up token.
          2.  Go to nearest door.
          3.  If you pass through a door and successfully deliver token, next time you *must* try that door again.
          4.  If you drop a token (because of the tax/delay), next time you *must* try the other door.
          5.  *Crucial:* You don't know why you dropped it. You just know you failed.
      *   *Emergence:* The colony "learns" to avoid Door A.
      *   *Attribution:* "Why did the colony stop using Door A?"
      *   *Ant Language:* "Because individuals experienced failure rates correlating with..." (Clunky).
      *   *Agent Language:* "Because it realized Door A was costly." (Natural).
      *   *This works.* It creates a "preference" without any ant knowing the cost.

  4.  **Designing Phase 2: The Pressure (The "Shill" and "Lookup Table")**
      *   *Variation 1 (The Shill):* Run the same scenario, but secretly tell 3 students "Ignore your rules, just block Door A." The outcome is identical. Is the mind still there?
      *   *Variation 2 (The Lookup Table):* Give students a script. "If X happens, do Y." But change the script so the *internal state* is different even if output is same. (Hard to do physically without tech).
      *   *Better Variation 2:* **The Inverted Qualia of Rules.** Tell half the class their rules are inverted (e.g., "Success means switch doors"), but adjust the environment so the *outcome* is the same. (Too complex).
      *   *Simpler Variation 2:* **The Pre-Determined Path.** Lay down tape on the floor. Students must follow the tape. They move the tokens exactly as before. Now, is the colony an agent?
      *   *Variation 3 (Rule Secrecy):* Tell students: "Actually, half of you were following Rule Set X, half Rule Set Y, but they produce the same behavior." (This addresses the "fact of the matter" question).

  5.  **Drafting the Session Plan (90 Minutes):**
      *   0-10: Intro & Setup (No theory yet).
      *   10-35: Phase 1 (The Ant Simulation).
      *   35-50: The Attribution Trap (Discussion).
      *   50-70: Phase 2 (Variations/Pressure).
      *   70-90: Debrief & Philosophical Mapping.

  6.  **Refining the Rules (Crucial Step):**
      *   I need rules that are *guaranteed* to work with 16 people in a classroom.
      *   *Risk:* Chaos.
      *   *Mitigation:* Strict zones.
      *   *The "Foraging Oscillator":*
      *   *Goal:* The colony must maintain a specific ratio of tokens in two zones, but no ant knows the ratio.
      *   *Actually, the "Avoidance" scenario is stronger for "Mind".* Avoiding pain/danger implies preference.
      *   *Let's stick with the Two-Path Cost scenario.* It's robust.
      *   *Rules:*
          1.  **Forage:** Go to Pile, take 1 token.
          2.  **Deliver:** Carry to Drop Zone.
          3.  **Path:** Choose Left or Right hallway.
          4.  **Collision:** If you touch another ant carrying a token, drop your token, return to Pile. (This creates congestion avoidance).
          5.  **Success:** If you deliver, return to Pile immediately.
      *   *Instructor Intervention:* After 5 mins, I (the Environment) stand in the Left Hallway, making it narrow.
      *   *Result:* Traffic jams on Left. Ants drop tokens. Ants switch to Right.
      *   *Attribution:* "The colony adapted to the obstacle."

  7.  **Addressing the "Forced Attribution":**
      *   I need to ask a question where the "Ant" answer is painful.
      *   Question: "Did the colony make a mistake in the first 5 minutes?"
      *   Ant Answer: "Individuals followed rules; error is not a category."
      *   Agent Answer: "Yes, it wasted resources on the suboptimal path."
      *   Question: "What does the colony want?"
      *   Ant Answer: "To execute rules."
      *   Agent Answer: "To maximize token delivery."

  8.  **Troubleshooting & Contingencies:**
      *   *Risk:* Students talk. *Fix:* "Mute Ants" rule. Violators sit out a round.
      *   *Risk:* No emergence (random noise). *Fix:* Increase collision penalty.
      *   *Risk:* Someone shouts "We're optimizing!" *Fix:* Acknowledge, but ask "Who is 'We'?"
      *   *Risk:* Group too small. *Fix:* Reduce space, increase token count.

  9.  **Philosophical Mapping:**
      *   Dennett's Intentional Stance (without naming it yet).
      *   Supervenience.
      *   Qualia (The Hard Problem limitation).
      *   Homunculus fallacy.

  10. **Writing the Plan:**
      *   Tone: Professional, instructional, philosophical.
      *   Structure: Clear phases, timing, scripts for the instructor.
      *   Emphasis: The *feeling* of the attribution.

  11. **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the "Shill/Lookup Table" phase?
      *   *Adjustment:* Make sure Phase 2 explicitly contrasts the *mechanism* vs. the *outcome*.
      *   *Check:* Is the "Mind" attribution forced?
      *   *Adjustment:* Ensure the debrief questions in Phase 1 are framed so that denying agency sounds absurd (e.g., "Did the colony *try* to avoid the blockage?").
      *   *Check:* Limitations?
      *   *Adjustment:* Explicitly state in debrief that we can't solve the "what it's like" question because students are already conscious.

  12. **Final Polish:** Check timing. 90 mins is tight. Keep instructions crisp. Ensure materials are low-tech. (Index cards, sticky notes, floor tape).

  *(Self-Correction on the "Rules"):* I need to make sure the rules are printed on cards so they are "local." I will write specific rule sets for the handout section.
  *(Self-Correction on Phase 2):* The "Shill" idea is good. I will instruct 3 students beforehand to act as "Central Command" in the second round to show the difference between distributed and centralized control producing the same output.

  Let's assemble the full plan.cw
answer: |-
  # Session Plan: The Colony Mind (90 Minutes)

  **Course:** Upper-Level Philosophy of Mind
  **Topic:** Collective Intentionality / The Intentional Stance / Levels of Explanation
  **Class Size:** 16 Students
  **Materials:**
  *   16 Index cards (labeled "Ant Protocol")
  *   50 small tokens (poker chips, bottle caps, or crumpled paper)
  *   2 Large sheets of paper or taped zones on the floor (labeled "Nest" and "Food Source")
  *   Masking tape (to mark two distinct paths between Source and Nest)
  *   1 Whistle or bell (to signal round ends)
  *   Whiteboard/Chalk

  ---

  ## Part 1: The Setup (0:00 – 0:10)

  **Goal:** Establish the constraints without invoking philosophical theory. Create the "Stupid Ant" mindset.

  **Instructor Script:**
  "Today we are not doing philosophy yet. We are doing biology. You are not students; you are members of a single colony. You have no access to global information. You cannot speak. You cannot signal. You have only the rule on your card and your immediate sensory input (what you see and touch within arm's reach). If you speak, you are 'dead' and must sit out the next round. Your goal is not to win; your goal is to follow your card."

  **Room Configuration:**
  1.  **Nest:** One corner of the room.
  2.  **Food Source:** Opposite corner.
  3.  **Paths:** Two distinct pathways marked by tape between Nest and Source.
      *   *Path A:* Wide, direct.
      *   *Path B:* Slightly longer or narrower.
  4.  **Tokens:** All start at the Food Source.

  **Distribution:**
  Hand out the **Ant Protocol Cards** face down. Tell them not to show anyone.
  *   *Note:* All 16 cards have the *same* rules. The "stupidity" comes from the lack of global knowledge, not rule variation.

  **The Rules (Printed on Cards):**
  1.  **Start:** Stand at the Nest.
  2.  **Forage:** Walk to the Food Source. Pick up **one** token.
  3.  **Return:** Carry the token back toward the Nest. You must use Path A or Path B.
  4.  **Collision:** If you physically bump into another Ant carrying a token, **drop your token immediately**. Turn around and return to the Food Source. Do not pick up a new token for 10 seconds.
  5.  **Delivery:** If you reach the Nest with a token, drop it in the pile. Return to Food Source immediately.
  6.  **Silence:** Do not speak. Do not gesture.

  ---

  ## Part 2: Phase 1 — Emergence (0:10 – 0:35)

  **Goal:** Generate a global pattern (efficient routing) that no individual intends.

  **Round 1 (5 Minutes): The Baseline**
  *   Let them run.
  *   *Expected Outcome:* Chaos initially. Collisions on the wider Path A. Tokens dropped. Eventually, a flow stabilizes where some use Path A and some Path B, balancing the load.
  *   *Instructor Role:* Observe. Count successful deliveries. Do not interfere.

  **Round 2 (5 Minutes): The Obstacle**
  *   Stop the group. Reset tokens to Source.
  *   **Intervention:** Place a large chair or stand in the middle of Path A (the preferred/wider path). It is now a bottleneck.
  *   Restart.
  *   *Expected Outcome:* High collision rate on Path A. Ants drop tokens. Ants naturally begin trying Path B more often because Path A results in "failure" (dropping the token). The flow shifts to Path B.

  **Round 3 (5 Minutes): The Removal**
  *   Stop. Reset. Remove the chair.
  *   Restart.
  *   *Expected Outcome:* The colony may stick with Path B for a while (hysteresis) before rebalancing, or quickly revert.

  **The Attribution Trap (10 Minutes)**
  *   Gather the students. Do not let them sit yet. Keep them standing in their "ant" mindset.
  *   Write two questions on the board. Ask them to answer verbally, but **forbid** them from using the word "I" or "me." They must speak about "The Colony."

      1.  *"In Round 2, why did the tokens stop going through Path A?"*
      2.  *"Did the Colony make a mistake in Round 1?"*

  *   **The Trap:**
      *   If they answer in *Ant Language* ("Because individuals bumped and dropped..."), press them: "But why did the *pattern* change? No individual decided to switch. Who decided?"
      *   If they answer in *Agent Language* ("Because it realized Path A was blocked..."), press them: "Who is 'it'? No one knew the chair was there until they hit it."
  *   **Desired Friction:** They will feel the *Ant Language* is clunky and fails to capture the *adaptation*. They will feel the *Agent Language* is natural but ontologically suspicious.
  *   **Instructor Move:** "So, if I ask 'What did the Colony want in Round 2?', is that a nonsense question?" (Let them struggle. Do not resolve it yet.)

  ---

  ## Part 3: Phase 2 — Pressure & Variation (0:35 – 0:60)

  **Goal:** Decouple the behavior from the mechanism to challenge the location of the "mind."

  **Variation A: The Centralized Shill (10 Minutes)**
  *   **Setup:** Reset the room exactly as Round 2 (Chair on Path A).
  *   **Secret Instruction:** Pull 3 students aside. Give them a new card: **"Central Command."**
      *   *Rule:* "Stand at the fork. Physically block any Ant trying to enter Path A. Wave them to Path B."
  *   **Public Instruction:** Tell the remaining 13 students they are Ants with the *original* rules.
  *   **Run:** The tokens move to the Nest via Path B. The *outcome* is identical to Phase 1, Round 2.
  *   **Discussion:** "The output was the same. The Colony 'avoided' Path A. But in Phase 1, the mind was (allegedly) in the swarm. Here, the mind is in the three Commanders. Did the Colony have a mind in Phase 1? Or was it just a hidden Commander we couldn't see?"

  **Variation B: The Lookup Table (10 Minutes)**
  *   **Setup:** Reset room. No Chair. No Commanders.
  *   **New Rule:** Give every student a **Script**.
      *   *Script:* "Walk exactly in this footprint pattern (marked by tape). Pick up token at X. Drop at Y. Turn at Z."
      *   The script is pre-calculated by you to produce the *exact same flow* as the emergent Phase 1.
  *   **Run:** They move like zombies. The tokens get delivered.
  *   **Discussion:** "The behavior is identical. The efficiency is identical. But now you are not reacting; you are reciting. If the Colony had a mind in Phase 1, does it have one now? If not, what is the difference? Is 'reacting to collisions' enough for mind, or do you need 'choice'?"

  **Variation C: The Hidden Inversion (5 Minutes)**
  *   **Setup:** Tell them you are going to run one last round.
  *   **Secret:** Tell half the class: "Your card is a lie. If you bump, pick up *another* token." Tell the other half: "If you bump, drop token."
  *   **Run:** Chaos ensues.
  *   **Point:** "If the internal rules change but the external behavior looks the same (or if the behavior changes wildly), where is the fact of the matter about what the Colony is *doing*? Is 'foraging' a description of the tokens moving, or the rules being followed?"

  ---

  ## Part 4: Debrief & Philosophical Mapping (0:60 – 0:90)

  **Goal:** Connect the visceral experience to the literature. Acknowledge limitations.

  **1. The Intentional Stance (Dennett)**
  *   Ask: "In Phase 1, Round 2, who found it *easier* to predict where the tokens would go: by tracking 16 students and collision physics, or by assuming 'The Colony wants to avoid the chair'?"
  *   **Point:** The "Mind" attribution is a compression algorithm. It is a tool for prediction. The "Pull" you felt was the utility of the tool.

  **2. Supervenience & Levels**
  *   Ask: "Does the Colony's 'decision' exist over and above the students' feet?"
  *   **Point:** It supervenes on the students. No magic dust. But the *pattern* is real at the higher level, just as "traffic jam" is real even though it's just cars.
  *   **Connection:** Connect to Functionalism. The colony realizes a function (obstacle avoidance). Does realizing the function constitute a mind?

  **3. The Chinese Room Connection**
  *   Ask: "In Variation B (The Script), you were syntax without semantics. In Phase 1, did you have semantics? You didn't know the goal."
  *   **Point:** If the Colony is a mind, it is a mind where the *parts* do not understand the *whole*. (Hofstadter's *Strange Loop*).

  **4. The Hard Limitation (Qualia)**
  *   **Crucial Honesty:** "Here is where this activity lies to you. You are all humans. When you bumped in Phase 1, *you* felt frustration. *You* felt the urge to switch paths. It is easy to project that frustration onto the Colony."
  *   **The Question:** "If we replace you with actual ants, or robots, is there anything it is *like* to be the Colony? This activity cannot answer that. It only shows that *behavioral attribution* is unavoidable. It does not prove *phenomenal experience*."

  **5. The "Just Ants" Verdict**
  *   Return to their initial worry. "You wanted to say 'It's just students moving tokens.' But when I asked 'Did it make a mistake?', 'Just students' was a very hard sentence to finish. Why?"
  *   **Conclusion:** The "Mind" is not a substance; it is a level of description that becomes mandatory when the system's complexity outstrips the mechanical description's utility.

  ---

  ## Troubleshooting & Contingencies

  **1. The "Clever Student" Short-Circuit**
  *   *Risk:* In Phase 1, a student shouts, "We need to balance the paths!"
  *   *Fix:* Immediate "Death" (sit out 2 minutes).
  *   *Prevention:* In the intro, say: "If you guess the global pattern, you ruin the experiment for everyone. The point is *not* to solve it, but to follow the rule."
  *   *Recovery:* If they break it, stop. Ask: "Okay, now one ant knows the goal. Is it still a colony mind, or just a human with helpers?" (This actually becomes a great philosophical pivot).

  **2. No Emergence (Chaos)**
  *   *Risk:* The collision rule isn't strong enough. They just trample through.
  *   *Fix:* **The Penalty Box.** If you drop a token, you must stand still for 15 seconds. This makes "failure" costly and forces path switching.
  *   *Contingency:* If Phase 1 fails to show adaptation, skip to Variation A (Shill). Say: "The system was too noisy. Let's force the outcome and ask the same questions."

  **3. Group Too Small/Uncoordinated**
  *   *Risk:* 16 students in a small room creates instant gridlock.
  *   *Fix:* Reduce the number of active "Ants" to 10. Make the other 6 "Observers" who track the data (tokens delivered per minute). This gives the Observers a role and reduces density.
  *   *Alternative:* Use the "Voting" version instead of movement. (Students hold Red/Blue cards and flip based on neighbors). Less fun, more reliable. *Stick to movement if space allows.*

  **4. The "Just Ants" Collapse**
  *   *Risk:* Students refuse to attribute agency, saying "It's just physics."
  *   *Fix:* Change the question. Don't ask "Is it a mind?" Ask "Was Round 2 *different* from Round 1?"
      *   If they say "Yes," ask "What is the difference?"
      *   If they say "Physics," ask "Did the physics change? No, the chair was added. The *response* to the physics changed. What describes the response?"
      *   Force them to admit that "Adaptation" is a real category that "Physics" alone describes clumsily.

  **5. Time Management**
  *   *Risk:* Phase 1 runs long.
  *   *Fix:* Hard stop at 0:35. Even if the pattern hasn't fully stabilized. The *attempt* is enough to generate the friction. Use the whiteboard to draw the pattern that *would* have emerged if needed.

  ---

  ## Instructor Cheat Sheet: The "Forced Attribution" Questions

  *Keep these in your pocket to deploy if the discussion stalls.*

  1.  **The Mistake Question:** "In Round 1, the Colony used Path A. In Round 2, it used Path B. Was Round 1 *wrong*?"
      *   *If Yes:* "Who was wrong? Every ant followed the rules perfectly."
      *   *If No:* "Then why did it change? Did it just get lucky?"
  2.  **The Knowledge Question:** "Did the Colony know the chair was there?"
      *   *If Yes:* "When? No single ant saw the whole chair."
      *   *If No:* "Then how did it avoid it? Can you avoid what you don't know?"
  3.  **The Pain Question:** "When an ant dropped a token, was that 'pain' for the Colony?"
      *   (Use this to pivot to the Qualia limitation in the debrief).

  ## Final Note to Instructor
  The success of this session relies on your refusal to validate the "Just Ants" answer too early. When a student says, "It's just us following rules," reply with, "Okay, but *what* is following rules? The group? Or the individuals? If the individuals don't know the rule's purpose, who owns the purpose?" Make them sit in the discomfort of the dual description.
