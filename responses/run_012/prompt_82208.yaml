answer: |-
  You have carved this very precisely, and your rejections of the standard terms are correct. You are describing a specific structural failure that standard labels miss because they focus on *intent* (malice vs. benevolence) or *resources* (depletion vs. overload).

  Here is the carving you asked for, the closest existing labels, and a proposed name for the specific phenomenon where the individual units are harmless.

  ### 1. The Structural Name: Coordination Failure
  The broad academic bucket this sits in is **Coordination Failure**. This is high-confidence. In game theory and organizational theory, this describes any situation where individuals acting rationally (or morally) produce a sub-optimal outcome because they cannot align their actions.

  However, "Coordination Failure" is too dry. It covers everything from traffic jams to nuclear war. It doesn't capture the specific flavor of *good intentions* causing *harm*.

  ### 2. The Mechanism: Missing Common Knowledge
  The specific engine driving this is a lack of **Common Knowledge**.
  *   **Private Knowledge:** Reviewer A knows *they* are writing 15 comments.
  *   **Missing Common Knowledge:** Reviewer A does not know that Reviewers B, C, D, E, and F are *also* writing 15 comments.

  If it were common knowledge (e.g., a dashboard showing "90 comments pending"), the behavior would change. The harm does not come from the comments; it comes from the **information asymmetry regarding the aggregate load**.

  ### 3. The Closest Existing Label: The Multipolar Trap
  The term that fits best in modern discourse (though it comes from internet rationalist circles, not textbooks) is a **Multipolar Trap** (sometimes referred to as **Moloch**).
  *   **Definition:** A situation where multiple actors, each pursuing their own local incentives (even good ones), lock the system into a state that is bad for everyone.
  *   **Fit:** It captures the "no boss," "individual rationality," and "collective ruin" aspects perfectly.
  *   **Mismatch:** It is usually used for competitive scenarios (arms races, price wars) where actors are forced to act badly to survive. Your examples are cooperative/benevolent.

  ### 4. The Specific Name (Coined): The Benevolence Overflow
  Since you asked for a proper coinage if no name exists: I propose calling this **The Benevolence Overflow**.

  **The Carving:**
  *   **What it is:** A system failure where independent, positive-sum actions aggregate into a negative-sum outcome due to a lack of visibility into the total volume.
  *   **What it isn't:**
      *   It is not *Tragedy of the Commons* (no resource is being depleted; the "channel" is being flooded).
      *   It is not *Death by a Thousand Cuts* (that implies each cut causes pain; here, the individual cuts are healing, only the volume kills).
      *   It is not *Groupthink* (people aren't conforming; they are acting independently).
  *   **The Edge:** The boundary is the **Threshold of Visibility**. If the actors could see the total count before acting, the phenomenon disappears. If they cannot, it emerges.
  *   **Harmless vs. Harmful Units:** You asked if it matters that the individual acts are harmless (your examples) vs. slightly harmful (Tragedy of the Commons). **Yes, it matters.** In the Commons, the individual act *is* the damage (eating the grass). In the Overflow, the individual act is *neutral or positive*; the damage is purely **non-linear** and **emergent**. This makes it harder to solve because you cannot tell the individuals to "stop doing the bad thing," because they aren't doing a bad thing.

  ### 5. The Flip Side: Same Structure, Different Sign
  You asked about the flip side: the boring task that nobody does, and the team dies.
  *   **Is it the same name?** Structurally, **yes**. It is the same **Coordination Failure** driven by **Missing Common Knowledge**.
  *   **The Difference:** In the Overflow, the cost is on the *receiver* (the author, the bereaved poster). In the Flip Side, the cost is on the *actor* (20 minutes of boring work).
  *   **Existing Label:** The flip side is classically called **Diffusion of Responsibility** or **Social Loafing**.
  *   **Unified Theory:** You can view them as two sides of **Distributed Coordination Without Signaling**.
      *   **Side A (Overflow):** Everyone signals "I care" without seeing others signaling. Result: Overload.
      *   **Side B (Atrophy):** Everyone waits for a signal "Someone else is doing it" that never comes. Result: Neglect.

  ### Confidence Ratings
  *   **High Confidence:** Your rejection of *Tragedy of the Commons* and *Bystander Effect* is correct. They are structurally different phenomena.
  *   **High Confidence:** The root mechanism is **Coordination Failure** driven by **Missing Common Knowledge** (lack of visibility into the aggregate).
  *   **Medium Confidence:** **Multipolar Trap** is the best existing "heavy" label, though it usually implies competition rather than benevolence.
  *   **Low Confidence:** That there is a single, canonical academic term specifically for "harmless individual acts aggregating into harm." I am flagging this as the hole in the map. Economics and sociology describe the *mechanism* (externalities, thresholds), but they don't have a catchy noun for the *moral paradox* you've identified.

  **Summary:** You are describing a **Coordination Failure** caused by **Missing Common Knowledge**, resulting in **Aggregative Harm**. If you need a label to use with Dev, call it a **Benevolence Overflow**. It distinguishes it from the Commons (resource depletion) and captures the specific irony that the harm is made entirely of help.
