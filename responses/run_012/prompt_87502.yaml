prompt: |-
  I'm in a philosophy of biology reading group and we meet in a pub with terrible wifi, so I can't just look things up when an argument gets stuck. We keep going in circles on the etiological vs. the causal-role account of function -- the etiological one says a trait's function is whatever it was selected for, the causal-role one says a trait's function is whatever contribution it currently makes to some capacity of the organism. I want to see the disagreement built cleanly instead of the usual wing and appendix handwaving, so please construct a thought experiment to spec. The target is a case where the etiological account says the focal trait is malfunctioning (it isn't doing what it was selected for) while the causal-role account says the very same trait is functioning fine (it's making a real, current contribution to the organism's life). Constraints: biologically possible organism, no intelligent designer, no supernatural stuff, no group selection unless you explain why it's needed, and the causal-role contribution has to be something the organism actually relies on, not just a possible use or a side effect that does nothing. Also include a control organism that is the same in current anatomy and physiology but differs in selection history: in the control, the trait was selected for the very effect it currently contributes, so both accounts call it functional. The scenario itself should be no more than a paragraph; the rest can be analysis.

  Then do the check. For the focal organism, state the trait, its selection history, its current effect, what each account says the function is, and what each says about malfunction. Do the same for the control. Tell me which single feature of the case is doing the work, and what happens if you remove it -- if the history is reversed, if the current effect is also selected for, if the trait becomes vestigial, etc. Finally, say how a defender of the etiological account would try to redescribe the focal case so that it isn't a malfunction, and how a defender of the causal-role account would try to redescribe it so that it isn't a function; I want to know which move is more ad hoc. No citations or reading lists, I just want the case and the reasoning.
