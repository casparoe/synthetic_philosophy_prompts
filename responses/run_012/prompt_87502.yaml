answer: |-
  The *Thermis lizard* possesses a cardiac shunt valve. In the focal population, ancestral selection favored the valve for closing periodically to boost lung perfusion during hunting; however, a recent mutation locks the valve permanently open, preventing lung perfusion boosts (a failure of the selected effect). Despite this, the lizards inhabit a superheated cave system where continuous blood flow to the skin is strictly required for survival, and the locked-open valve provides exactly this flow, serving as the organism's sole thermoregulatory mechanism. In the control population, the valve is anatomically identical (permanently open) but derives from a lineage where permanent openness was directly selected for heat dissipation over thousands of generations.

  ### The Check

  **Focal Organism**
  *   **Trait:** Cardiac shunt valve (locked open).
  *   **Selection History:** Selected for periodic closing (lung perfusion).
  *   **Current Effect:** Permanent openness (heat dissipation).
  *   **Etiological Verdict:** **Malfunction.** The trait fails to perform the effect for which it was selected (closing); it is broken *qua* lung-shunt.
  *   **Causal-Role Verdict:** **Functioning.** The trait makes a vital causal contribution to the organism's capacity for thermoregulation and survival.

  **Control Organism**
  *   **Trait:** Cardiac shunt valve (locked open).
  *   **Selection History:** Selected for permanent openness (heat dissipation).
  *   **Current Effect:** Permanent openness (heat dissipation).
  *   **Etiological Verdict:** **Functioning.** The trait performs the effect for which it was selected.
  *   **Causal-Role Verdict:** **Functioning.** The trait makes a vital causal contribution to thermoregulation.

  ### The Single Feature
  The divergence rests entirely on the **selection history**. The anatomy, physiology, and current causal contributions are identical between the focal and control organisms. The only variable is whether the current effect matches the historical selective pressure. If you remove the historical mismatch (by reversing the history to match the control), the etiological account flips from "malfunction" to "function," while the causal-role account remains unchanged. If you remove the current contribution (e.g., the environment cools so heat dissipation is useless), the causal-role account flips to "no function," while the etiological account maintains "function exists but is unperformed" (or malfunction if the capacity is lost).

  ### Defensive Moves and Ad Hoc-ness

  **Etiological Defender (Trying to avoid "Malfunction"):**
  To claim the focal trait is *not* malfunctioning, the etiological defender must argue that the trait's function is determined by *current* selective maintenance rather than historical origin. They would redescribe the case by asserting that because the open valve is now vital for survival, it is currently being selected for, and thus its function *is* openness.
  *   **Ad Hoc Rating:** **High.** This move collapses the etiological account into a hybrid or current-selection account, directly contradicting the core premise that function is grounded in *past* selection. It requires denying the established thought-experiment premise (that the openness is a recent mutation not yet historically selected) or redefining "etiology" to include the present moment, which undermines the theory's ability to distinguish adaptation from accident.

  **Causal-Role Defender (Trying to avoid "Function"):**
  To claim the focal trait is *not* functioning, the causal-role defender must argue that the contribution to thermoregulation does not count as a "function" because it is accidental relative to the trait's structural design. They would redescribe the case by narrowing the "containing system" to the circulatory system specifically, arguing that while the valve helps the *organism*, it disrupts the *circulatory capacity* it was structurally integrated to serve.
  *   **Ad Hoc Rating:** **Moderate.** This move relies on manipulating the level of analysis (organism vs. subsystem). While it preserves the intuition that the valve is "broken," it contradicts the causal-role spirit that any contribution to a system's capacity counts. However, it is less empirically desperate than the etiological move; it is a conceptual boundary dispute rather than a denial of historical fact.

  **Conclusion:** The etiological defender's move is more ad hoc because it requires falsifying the historical constraints of the case to save the verdict, whereas the causal-role defender merely shifts the systemic boundary, which is a permissible (if contentious) maneuver within functional analysis.
