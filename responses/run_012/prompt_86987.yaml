  **(c) Aggregation and Collapse Avoidance: 0.70**
  *Justification:* Hybrid rules (e.g., lexical priority only above a probability threshold) can prevent "destroy the world" implications without abandoning the core intuition.

  **(d) Alignment with Considered Judgments: 0.75**
