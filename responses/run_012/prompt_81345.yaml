answer: |-
  Here are the translations of the three philosophical interpretations into your operational vocabulary, followed by the residue report and verdict.

  ### I. Translations

  #### 1. Frequentism
  **In your vocabulary:** Probability is a property of the `test_suite`, not the `run`.
  To assign a probability $p$ to an event $E$ is to assert that if you instantiate an `ensemble` of $N$ simulations, drawing seeds uniformly from the defined `seed_space`, the relative frequency of $E$ in the `output_stream` converges to $p$ as $N \to \infty$.
  *   **The Seed:** Irrelevant individually. It is merely an index into the `ensemble`.
  *   **The Distribution Object:** A specification for the `sampler` that guarantees the long-run `output_stream` satisfies specific statistical moments.
  *   **Single Run:** Has no probability. It has an outcome. The statement "the probability of this run returning `true` is 0.5" is shorthand for "50% of runs in this `ensemble` return `true`."
  *   **Truth Condition:** The claim is true if and only if the limit of the relative frequency exists and equals $p$. If the `PRNG` has a bug that creates a cycle shorter than $N$, the probability claim is false, regardless of the algorithm's intent.

  #### 2. Subjectivism (Bayesian/Credence)
  **In your vocabulary:** Probability is a data structure encoding the `observer's` ignorance of the `seed`.
  To assign a probability $p$ to an event $E$ is to declare the state of your `distribution_object` before calling `.sample()$.
  *   **The Seed:** If you know the seed, the probability is 0 or 1. If you do not know the seed, the probability reflects your `prior` over the `seed_space`.
  *   **The Distribution Object:** A compression of your current information state. Updating the probability (Bayesian update) is equivalent to narrowing the `seed_space` based on partial `output_stream` observations.
  *   **Single Run:** Has a probability relative to a specific `observer` (or process) with bounded knowledge. An adversary with the seed sees $P=0/1$; an adversary without it sees $P=p$.
  *   **Truth Condition:** The claim is "calibrated." If you assert $P=0.9$ for a class of events, then in the long run, 90% of those events must occur. If they don't, your `distribution_object` was poorly specified, not necessarily that the world changed.

  #### 3. Propensity
  **In your vocabulary:** Probability is a physical or algorithmic `bias_parameter` inherent to the `generator` itself, independent of the `seed` or the `observer`.
  To assign a probability $p$ to an event $E$ is to assert that the `generator` possesses a dispositional property that tends to produce $E$ with weight $p$, even if the `run` is never executed.
  *   **The Seed:** The trigger that releases the propensity, but not the source of it.
  *   **The Distribution Object:** A model of the `generator`'s physical or logical structure.
  *   **Single Run:** The probability is a real property of this specific `run`'s setup, determined by the `generator`'s configuration.
  *   **Truth Condition:** For a `TRNG` (hardware), this is the physical noise characteristic (e.g., thermal decay rate). For a `PRNG`, this is the mathematical density of states in the algorithm's mapping function. The claim is true if the `generator` is physically or mathematically constituted such that it *would* produce frequency $p$ were it run, even if it is never run.

  ***

  ### II. Residue Report

  Here is the accounting of what fits, what breaks, and what distorts during translation.

  #### 1. Single-Case Objective Chance
  **Verdict:** In your vocabulary, single-case objective chance collapses.
  *   **The Collapse:** For a `PRNG`, a specific run with a fixed seed is deterministic. $P$ is 0 or 1. Any other value is a statement about the `observer's` ignorance of the seed (Subjectivism) or a statement about the `ensemble` (Frequentism).
  *   **The Exception:** If you use a `TRNG` (e.g., quantum noise), the seed is "genuinely undetermined" by prior physical states. Here, your vocabulary *can* accommodate single-case chance, but only by importing physics. You would treat the `seed` input not as a number, but as a physical event.
  *   **Defect or Evidence?** This is evidence that the philosophers' single-case chance is doing less work than it appears. In simulation, "probability of this run" is almost always a leaky abstraction for "probability of this class of runs." If you insist on single-case chance for a `PRNG`, you are reifying the `distribution_object` as a physical force rather than a map. The collapse is a feature of your framework's clarity, not a bug.

  #### 2. The Propensity Interpretation
  **Verdict:** Propensity survives only partially; for `PRNGs`, it is merely a replacement.
  *   **The Distortion:** In philosophy, propensity is often meant to explain *why* frequencies stabilize. In your world, frequencies stabilize because of the `algorithm` (for `PRNG`) or physics (for `TRNG`).
  *   **Bias Parameter:** Calling propensity a "bias parameter" reduces it to a Frequentist limit in disguise. If you say "this coin has a propensity of 0.6," and you translate that to "this generator has a bias parameter of 0.6," you are actually saying "this generator produces 0.6 in the long run." You have translated a *cause* (propensity) into an *effect* (frequency).
  *   **Survival:** Propensity only survives faithfully if you treat the `generator`'s mathematical structure as a Platonic object that exists independently of execution. The `PRNG` algorithm *has* a distribution of outputs over its full period regardless of whether you run it. That structural truth is a propensity. But for a single, non-repeated run, propensity adds no predictive power over the `seed` + `algorithm` deterministic pair.

  #### 3. Pseudorandomness as a Fourth Interpretation
  **Verdict:** Pseudorandomness is not a fourth interpretation of *probability*; it is a refinement of *Subjectivism* constrained by *Computational Complexity*.
  *   **Why it feels like a fourth:** It decouples "random" from "unpredictable by *any* means" (Subjectivist ideal) and "random" from "unpredictable by *bounded* means" (Cryptographic reality).
  *   **The Mapping:** It aligns with Subjectivism because probability remains relative to the `observer`. However, it adds a hard constraint: the `observer` is a Turing machine with bounded time/memory.
  *   **Coherence:** It is coherent. It states: $P(E) = p$ relative to an adversary $\mathcal{A}$ if $\mathcal{A}$ cannot distinguish the `output_stream` from a true random source with advantage $\epsilon$ in polynomial time.
  *   **Why it's not new ontology:** It doesn't change what probability *is* (a measure of uncertainty); it changes the *conditions of the uncertainty*. It validates the Subjectivist view that probability is about information, but makes the information cost explicit. Your instinct that it is different is correct practically, but ontologically it is a subset of Subjectivism with a resource-bounded agent.

  #### 4. The Reference-Class Problem
  **Verdict:** The philosophers' problem is different; yours is solved by API design.
  *   **Philosophers' Worry:** An event (e.g., "John Smith dies") belongs to infinite classes (men, smokers, 50-year-olds, engineers). Which class determines the probability? There is no fact of the matter in the world.
  *   **Your Reality:** The `ensemble` is explicitly defined by the `seed_space` and the `loop` structure in your code. You *force* a reference class by writing `for i in range(N)`.
  *   **The Distortion:** If you try to map your simulation to reality (e.g., "This Monte Carlo risk model predicts the bridge will collapse"), the reference class problem returns. Is the simulation's `seed_space` analogous to the real world's variation? Your vocabulary solves the internal problem (the code defines the class) but hides the external problem (does the code match the world?). The philosophers are worrying about the external mapping; you are worrying about the internal consistency. They are wearing similar clothes, but you are wearing a uniform.

  ***

  ### III. Verdict

  If you keep only your own vocabulary:

  **What you lose that matters:**
  1.  **Causal Explanation:** You lose the ability to talk about *why* the frequencies stabilize without referencing the frequencies themselves. Propensity attempts to name the engine in the box; your vocabulary only describes the exhaust. In debugging a `TRNG`, distinguishing between "the physics changed" (Propensity) and "our sample was unlucky" (Frequentism) matters.
  2.  **Single-Case Normativity:** You lose the ability to make robust claims about unique, non-repeatable events (e.g., "This specific cryptographic key generation is secure") without reducing them to "This *type* of generation is secure." In security, the distinction between "this instance" and "the class" can be a vulnerability (side-channel attacks target the instance).

  **What you keep that their debate obscures:**
  1.  **Operational Clarity:** You avoid the metaphysical swamp of "what is chance really?" by defining it as "what does the test suite assert?" This prevents category errors between `PRNG` (math) and `TRNG` (physics).
  2.  **The Observer's Role:** Your vocabulary forces you to acknowledge the `adversary` or `observer`. Philosophers often debate probability as if it exists in a vacuum. Your framework correctly identifies that "randomness" is a relationship between a `stream` and a `distinguisher`.
  3.  **Calibration over Truth:** You focus on whether the `distribution_object` is *calibrated* to the `output_stream`, rather than whether it is *True* in a Platonic sense. This is the correct engineering stance.

  **Final Instruction:**
  Stick to your vocabulary for implementation and verification. It is superior for building systems. However, when interfacing with the physical world (hardware RNGs) or making risk claims about unique real-world events, borrow the **Propensity** vocabulary to describe the hardware physics, and the **Subjectivist** vocabulary to describe the risk. Do not try to merge them; keep them as separate modules in your conceptual architecture.
