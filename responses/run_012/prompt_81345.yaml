      *   *Point 4: Reference Class.* In code, the reference class is explicit (the seed space). In philosophy, it's ambiguous (is this coin toss part of "all coin tosses" or "tosses by this person"?). The user's problem is solved by API design; the philosopher's problem is metaphysical/epistemic ambiguity.

