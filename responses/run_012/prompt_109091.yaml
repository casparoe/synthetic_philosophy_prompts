answer: |-
  The bailiff called my name, and the sound felt like it was coming from underwater. I touched the patch behind my left ear. The Loom was cool to the touch, a smooth dime of matte black plastic. It was supposed to be off in court, but the phantom vibration hummed against my mastoid bone anyway.

  "State your name for the record," the prosecutor said. She was sharp, wearing a suit that cost more than my parents' car. The car that wasn't there anymore.

  "Elara Vance."

  "You were wearing a Loom personal buffer on the night of November 14th?"

  "Yes."

  "And you activated it immediately following the collision?"

  "Yes."

  The defense attorney stood up. He was older, tired, leaning on the table like it was the only thing holding him upright. "Ms. Vance, can you explain to the jury why you needed to undo the last two seconds of your life?"

  "It was instinct," I said. "The car came out of nowhere. I just… I wanted it gone."

  "You wanted the memory gone," he corrected. "Or the event?"

  "The memory."

  He walked toward the jury box, holding up a tablet. "We have the telemetry from your device. It shows you tapped the patch forty milliseconds after impact. But the Loom manual states there is a fifty-millisecond latency between tap and scrub. For those fifty milliseconds, the memory is in a buffer. Unrendered."

  The prosecutor objected. "Counsel is arguing neuroscience, not fact."

  "Overruled," the judge said. He looked interested. This was the whole case. The defendant was a delivery drone operator. The security footage showed a blue drone. I testified it was red. The Loom log showed I scrubbed the memory of the crash. The defense said I changed the blue drone to red to make it look like a rival company's model. The prosecution said my brain changed the red drone to blue, and the Loom just let me peek behind the curtain.

  "Ms. Vance," the defense attorney said. "When you tapped the Loom, was the status light green or amber?"

  "Amber."

  "Amber indicates buffering," he said, turning to the jury. "It means the data hasn't been written to your consciousness yet. It's still in the queue. Like a film editor splicing tape before the projector starts."

  He was arguing the Stalinesque theory without saying it. That my brain was a theater, and the Loom intercepted the film before it hit the screen. If he was right, I never actually saw the crash. I only saw the edit.

  The prosecutor stepped in. "The light is amber during live capture, Counsel. Green is for playback. She experienced the event in real-time. The Loom doesn't hold experience; it holds history. It's a correctional pen, not a filter."

  She was arguing the Orwellian line. That I saw it, it happened, and then the story was rewritten.

  "Let's look at the physical reaction," the defense said. He pulled up a hologram of my medical scan from that night. "Your pupil dilation spiked sixty milliseconds *before* you tapped the Loom. But the amber light means the visual data wasn't committed yet. How could you react to a image your brain hadn't finished processing?"

  "Reflex," the prosecutor said. "Spinal cord. Not consciousness."

  "A flinch isn't a memory," the defense countered. "She claims she saw a red drone. But if the buffer was active, the color hadn't been assigned yet. The Color Phi effect. Her brain filled in the motion and the color after the fact to make sense of the trauma. The Loom just let her save the draft."

  I looked at my hands. They were shaking. I remembered the drone. I remembered the specific shade of crimson, the way the light caught the rotor blade. I remembered tapping the patch because the sound was too loud, and I wanted silence.

  "Ms. Vance," the judge said. "When you tapped the patch, did you hear the crash?"

  "Yes."

  "Before or after the light turned green?"

  "There was no green," I said. "I scrubbed it before it saved."

  The courtroom went quiet. If I scrubbed it before it saved, the memory shouldn't exist. But I was remembering it.

  "The telemetry shows a deletion command," the defense said. "You can't delete a file that hasn't been created. Unless…" He paused. "Unless the experience exists independently of the save function."

  "Or," the prosecutor said, "the save function is just a label for when the brain stops editing. She experienced it. The Loom just gave her the admin privileges to change the text."

  They were both looking at me, waiting for me to validate their physics. I looked at the defense attorney. He believed I was a machine that could be buffered. I looked at the prosecutor. She believed I was a historian who could lie.

  "I remember the color," I said softly.

  "Memory is reconstructive," the defense said. "You remember what you told yourself afterwards."

  "I remember the light," I said. "When I tapped the patch, the amber light flickered. Just once. A stutter."

  The defense attorney froze. The prosecutor frowned.

  "A stutter?" the judge asked.

  "It blinked off. For a millisecond. Then back to amber. Then I scrubbed."

  I didn't tell them what I thought it meant. If the light went off, the buffer emptied. If the buffer emptied, the data was committed. If it was committed, I saw it before I scrubbed it. But if I saw it before I scrubbed it, and the color was red, then the red was real.

  Unless the flicker was the rewrite happening. Unless the light went off because the brain was pausing to insert the false color before showing it to me.

  "The device is faulty," the defense said quickly.

  "The device is consistent," the prosecutor said.

  I stopped listening. I was thinking about that millisecond of darkness. In that gap, was I blind? Or was I seeing the truth before they painted over it? The Loom hummed behind my ear, a tiny loop of time waiting to be cut. I realized then that it didn't matter if the brain waited to show me the world, or if it showed me the world and then lied about it.

  The result was the same. I was sitting in a chair, remembering a red drone that never existed, while the real blue one hummed in the evidence bag, silent and unobserved.

  "Ms. Vance?" the judge prompted.

  "The light stuttered," I said again. "That's all I know."

  I sat back down. The bailiff looked at the Loom behind my ear. I wondered if he could see the light blinking from where he stood. I wondered if he was seeing me now, or if he was seeing the version of me he'd already decided on. I touched the patch. It was warm.
