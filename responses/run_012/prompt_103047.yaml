  *   **Candidate 2: The Job Contract.** Agent signs non-exit clause. Later self wants to quit for peace. *Reject.* Stakes feel too high (career-defining), and "burnout" looks like a change in capacity, not just preference.
  *   **Candidate 3: The Savings Lock (Selected).** Agent locks funds for a house with a sibling as enforcer. Later self wants to invest in a business. *Accept.* Stakes are ordinary (finance/career). Later self's preference (Security vs. Growth) is stable and values-based, not weak. Enforcement is interpersonal and realistic.

  ***

  ### The Case: Casey's Lock

  Casey wants to buy a home in three years to establish stability. Casey knows they have a high propensity to spend surplus income on consumption, delaying the down payment. To solve this, Casey transfers a significant portion of their savings into a dedicated account. Legally, Casey retains ownership, but withdrawal requires the co-signature of their sibling, Jordan. Casey instructs Jordan: "Do not release these funds for anything other than a house purchase until Date X." Jordan agrees. This is ex ante rational: without the lock, Casey knows the house won't happen, and the house is currently their top priority.

  Two years in, Casey is healthy and employed. A unique opportunity arises to co-found a startup. It requires capital now. Casey evaluates the option carefully. The startup offers a chance for meaningful work and potentially higher returns, but higher risk. Casey's preference shifts: they now value professional growth and risk-taking over domestic stability. This is not impulse or confusion; it is a stable, considered re-evaluation of life goals. Casey asks Jordan for the funds. Jordan refuses, citing the agreement. Casey cannot unilaterally override Jordan.

  ***

  ### Three Accounts

  **(a) The Planning View**
  *   **Verdict:** Honor the constraint.
  *   **Reason:** Agency extends over time. Intentions are not just predictions but commitments that coordinate future action. To allow the later self to discard the plan simply because preferences shifted undermines the capacity to execute long-term projects. The authority of the earlier self lies in the rationality of the plan at the time of adoption.
  *   **Thin Spot:** It assumes cross-temporal coherence is always a virtue. It struggles to explain why a *legitimate* shift in values (not just weakness) should be held hostage to a past intention that no longer reflects the agent's good.

  **(b) The Succession of Selves View**
  *   **Verdict:** Break the constraint (Jordan should release).
  *   **Reason:** The earlier self and later self are effectively distinct agents linked by psychology but not identity. The earlier self has no special authority to bind the later one, just as one stranger cannot bind another. The later self's current, informed preferences dominate.
  *   **Thin Spot:** It makes long-term agency impossible. If every preference shift voids prior commitments, reliance and cooperation collapse. It ignores the benefit the later self receives from the earlier self's discipline.

  **(c) The Autonomy View**
  *   **Verdict:** Honoring the constraint is wrongful (Jordan should release).
  *   **Reason:** Autonomy requires sovereignty over one's current life. Enforcing a past wish against a current, competent will treats the later self as a child or a vessel for the past self's desires. Even if the constraint helps, imposing it against current will violates the respect owed to the present agent.
  *   **Thin Spot:** It risks a paradox. If autonomy includes the power to bind oneself for the future, preventing that binding (by allowing the later self to always override) undermines the very autonomy the view seeks to protect.

  ***

  ### Feature Analysis

  The feature doing the normative work is the **Other-Imposition**.

  In standard precommitment cases (self-imposed locks), the conflict is intrapersonal. Here, the constraint is enforced by Jordan. This transforms the problem from one of *prudence* (how should I manage myself?) to one of *authority* (who has the right to decide?).

  **The Test:** Change **Other-Imposition** to **Self-Imposition**.
  Imagine Casey uses a digital timer lock that no one can override, including Casey, until Date X.
  *   **Planning View:** Verdict stays the same (Honor). The intention still binds.
  *   **Succession View:** Verdict stays the same (Break). The later self still dominates, though they physically can't.
  *   **Autonomy View:** **Verdict Flips.** If Casey locks themselves, honoring the lock is an *exercise* of autonomy, not a violation. The wrong disappears because the constraint is self-authored. The presence of Jordan is what makes the enforcement look like paternalism rather than self-governance.

  **The Critique:**
  The defender of the **Succession of Selves View** (the loser here, as it undermines the possibility of the contract) would attack the case as rigged on **Ex Ante Rationality**. They would argue: "You claim the lock was rational ex ante. But if you acknowledge the later self's preferences are stable and informed, then the earlier self's plan was *defective*, not just outdated. A rational plan must account for the possibility of legitimate value shifts. By ignoring that risk, the earlier self acted negligently, forfeiting any claim to authority." They would say the case smuggles in the conclusion that the earlier self knows best by stipulating the lock was "rational" despite the foreseeable possibility of change.

  ***

  ### Constitutional Analogy

  Does the **Other-Imposition** feature carry over to the constitutional version (entrenching rules against a future majority)?

  **Yes, the analogy holds structurally.**
  In both cases, one agent (or generation) uses a procedural constraint to limit the choice of a subsequent agent (or generation), enforced by a third mechanism (courts/boards). The normative tension is identical: does the past have the authority to bind the future when the future's preferences are stable and informed? The "Other-Imposition" feature maps perfectly: Generation 1 is the "Earlier Self," Generation 2 is the "Later Self," and the Constitution is "Jordan."

  **However, the analogy separates on Continuity.**
  In Casey's case, there is psychological continuity between Earlier and Later Casey. They share memories, body, and some interests. In the constitutional case, Generation 1 and Generation 2 are distinct people with no psychological overlap.
  *   **Why it matters:** The Planning View relies on identity over time. It is much harder to argue that Generation 1's intentions bind Generation 2 when there is no psychological continuity. The Succession View is *stronger* in the constitutional case than in the personal case. Therefore, while the feature (Other-Imposition) carries over, the weight of the arguments shifts: the case for honoring the constraint is weaker in the constitutional version because the "self" being bound is truly someone else.
