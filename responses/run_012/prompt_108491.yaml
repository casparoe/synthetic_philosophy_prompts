answer: |-
  ### Brainstorming Candidate Concepts

  Before settling on a precise term, we must distinguish the empirical phenomenon from the logical operation performed upon it.

  1.  **The Gender Equality Paradox:** This is the name of the *empirical pattern* (Stoet & Geary, 2018), not the inferential move. It describes the correlation, not the interpretation of the residual.
  2.  **Essentialism / Biological Determinism:** These are too broad. They describe a worldview, not the specific methodological step of inferring biology from a statistical residual in cross-national data.
  3.  **Mill's Method of Residues:** This is the classical logical form (subtract known causes to find the unknown). The move you describe is a specific *application* of this method, but "Method of Residues" does not capture the specific error of treating "egalitarian institutions" as "absence of culture."
  4.  **Reification of the Residual:** A strong statistical candidate. It captures turning "unexplained variance" into a "thing" (biology). However, it lacks the specific nuance regarding the *cultural baseline*.
  5.  **The Control Fallacy:** Too generic. All causal inference risks control fallacies.
  6.  **The Neutral Baseline Assumption:** This captures the error (treating one culture as neutral), but doesn't explicitly name the inference to *nature*.
  7.  **The Subtractive Essentialist Inference:** Captures the logic (Total - Institutions = Biology), but is slightly clunky.

  **Selection:** The most precise philosophical carving requires a term that identifies the ontological leap (residual $\rightarrow$ nature) while acknowledging the methodological context (cross-national control). I propose coining the term **The Residual Naturalization Inference**. When this inference relies on the specific error you described (treating egalitarian contexts as culture-free), it instantiates **The Egalitarian Baseline Fallacy**.

  For the purpose of your seminar, I will define **The Residual Naturalization Inference** as the primary term for the move itself, with the understanding that its validity hinges on the "Cultural Constant Assumption."

  ***

  ### The Term: The Residual Naturalization Inference

  **Definition:**
  The **Residual Naturalization Inference** is the methodological move in comparative social science wherein observed group differences, persisting after controlling for institutional and economic constraints, are ontologically categorized as "biological" or "natural." It operates on the logic that if $Difference_{observed} - Difference_{institutional} > 0$, then $Difference_{residual} = Difference_{biological}$.

  In the specific context of cross-national sex differences, this inference becomes fallacious when it relies on the **Cultural Constant Assumption**: the premise that "egalitarian" nations represent a neutral baseline where culture has been effectively controlled for, rather than a specific cultural configuration that may actively shape preferences.

  ### The Carving: Assumptions, Counterexamples, and Legitimacy

  To use this concept effectively in your seminar, you must distinguish the *logic* of the inference from the *validity* of its application. Here is the philosophical carving:

  #### 1. What is Assumed? (The Premises)
  For the Residual Naturalization Inference to hold, three specific premises must be true:
  *   **The Exhaustiveness Premise:** The variables controlled for (e.g., labor laws, GDP, welfare provisions) constitute the *totality* of relevant social constraints. There are no unmeasured social confounds.
  *   **The Neutrality Premise:** The "high equality" condition is not merely a different set of constraints, but a *reduction* of constraint. It assumes egalitarian institutions create a "vacuum" where social pressure is minimized, rather than substituting one type of pressure (economic survival) with another (self-actualization norms).
  *   **The Binary Premise:** The etiology of behavior is partitioned into "social constraint" and "biological predisposition." It assumes there is no third category, such as "culturally amplified agency" or "normative scripting," that is neither coercive nor biological.

  #### 2. What Counts as a Counterexample?
  A counterexample to the validity of this inference is not merely a country where the difference is small. It is a case where the *residual* is shown to be culturally mediated despite institutional equality.
  *   **The Normative Amplification Case:** As you noted, if Country A and Country B have identical equality indices, but Country A has strong gendered occupational norms while Country B does not, and Country A shows larger differences, the residual is cultural, not biological.
  *   **The Preference Construction Case:** If longitudinal data shows that "preferences" in egalitarian countries shift rapidly in response to media or educational campaigns (despite stable institutions), the preference is not a fixed natural trait revealed by equality, but a dynamic cultural product facilitated by security.
  *   **The Cross-Domain Inconsistency:** If the inference yields "biological" results for occupational choice but "cultural" results for political voting patterns within the same egalitarian contexts, the method of residuation is inconsistent.

  #### 3. When Might the Inference Be Legitimate?
  The Residual Naturalization Inference is not *inherently* fallacious; it is a standard form of causal reasoning (akin to Mill's Method of Residues). It is legitimate only under strict conditions:
  *   **Measurement of Culture:** "Culture" must be measured as a variable (e.g., explicit norms, implicit association scores), not assumed to be zero because "institutions" are equal. If cultural norm scores are included in the regression and the sex difference *still* persists, the inference to biology is stronger.
  *   **Cross-Species or Cross-Context Convergence:** If the same difference appears in non-human primates, or in historical contexts with vastly different cultural configurations (not just "egalitarian" vs. "patriarchal" modern states), the residual is more likely biological.
  *   **Mechanism Identification:** The inference is strongest when accompanied by a plausible proximate mechanism (e.g., prenatal hormone exposure) that is known to be insensitive to the specific cultural variables in question.

  ### Distinctions

  To ensure conceptual clarity in your seminar, distinguish this move from three related concepts:

  **1. Versus The Correlation (The Gender Equality Paradox)**
  *   *The Correlation:* "As equality increases, difference magnitude increases." This is a descriptive statistical claim.
  *   *The Inference:* "Therefore, the difference is biological." This is an explanatory claim. One can accept the paradox (the data) while rejecting the residual naturalization inference (the explanation).

  **2. Versus General Essentialism**
  *   *General Essentialism:* "Men and women are different because of biology." This is a broad worldview.
  *   *The Residual Naturalization Inference:* This is a specific *methodological argument* used to *support* essentialism. It claims to *derive* the conclusion from data rather than asserting it a priori. Critiquing the inference does not require disproving all essentialism, only showing that *this specific data* does not support it.

  **3. Versus Ordinary Biological Hypotheses**
  *   *Ordinary Biological Hypothesis:* "Testosterone influences risk-taking, therefore men may take more risks." This posits a mechanism and tests it directly.
  *   *The Residual Naturalization Inference:* "We controlled for laws, and the difference remains, *therefore* it is biology." This infers the cause from the *absence* of other explanations (an argument from ignorance), rather than the *presence* of biological evidence.

  ### Summary for the Seminar
  The **Residual Naturalization Inference** is the logical bridge between the Gender Equality Paradox and biological essentialism. It is valid only if "egalitarianism" is proven to be a *neutral baseline* rather than a *specific cultural context*. Your seminar's critical task is to show that egalitarian institutions do not remove culture; they change the *type* of cultural expression from survival-based to identity-based. Therefore, the residual is not nature's fingerprint; it is culture's signature written in invisible ink.
