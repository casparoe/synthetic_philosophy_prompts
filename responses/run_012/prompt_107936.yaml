answer: |-
  # Seminar Plan: The Logic of "We"

  **Time:** 80 Minutes
  **Students:** 16
  **Materials:**
  *   16 small envelopes (labeled 1–16).
  *   3 stacks of colored slips (White, Blue, Yellow).
  *   A clear jar (for raffle tickets).
  *   Projector/Screen.
  *   $15 cash (in a sealed envelope).
  *   Excel sheet open on your laptop (pre-formatted to calculate payoffs instantly).
  *   A box/bag for collecting envelopes.

  **The Stakes:**
  Points earned in the games are converted into **Raffle Tickets**. At the end of class, you will put all earned tickets into the jar, mix them, and draw one. The student whose ticket is drawn wins the $15. This preserves Expected Utility incentives without needing large cash sums.

  ---

  ## Part 1: Setup & Round 1 (20 Minutes)

  **0:00–0:05: Introduction**
  *   Hand out Envelope #1 to each student as they enter. Tell them to keep their ID number secret.
  *   **Script:** "Today is an experiment in decision-making. You will play three rounds. Points earned become raffle tickets for this $15 prize. Anonymity is absolute: put your slips in your envelope, seal it, and drop it in the collection box. I will not know who chose what until I open them to calculate scores."
  *   **Crucial Instruction:** "Do not talk to each other during the decision phases. If you do, the data is ruined."

  **0:05–0:15: Round 1 (The Rescue)**
  *   **Task:** Hand out **White Slips**.
  *   **Rule:** "Write either **A** or **B**."
  *   **Payoff Structure (Project this):**
      *   If **everyone** writes **A**: Everyone gets **10 Tickets**.
      *   If **anyone** writes **B**:
          *   Those who wrote **B** get **20 Tickets**.
          *   Those who wrote **A** get **0 Tickets**.
  *   **The Hook:** Do not explain *how* to reason. Let them sit with the tension.
  *   **Action:** Collect envelopes. Input data live on the projector.
  *   **Likely Outcome:** In a naive group, 2–4 students will defect (B). The cooperators (A) get 0. The defectors get 20.
  *   **Immediate Reaction:** Ask the room: "How many got 0 tickets?" (Hands go up). "How many got 20?" (Hands go up). "How does that feel?"

  **0:15–0:20: Mini-Debrief 1**
  *   Ask a defector: "Why B?" (Answer: "It dominates. No matter what they do, B is better.")
  *   Ask a cooperator: "Why A?"
      *   *Target Answer:* "I figured if I choose A, everyone else reasoning like me would also choose A."
      *   *Target Answer:* "If I choose B, I assume everyone else would too, and we'd all get 0."
  *   **Don't validate either yet.** Just write the two reasonings on the board:
      1.  "What's best for me, given what *they* do?"
      2.  "What's best for us, if we all think like *me*?"

  ---

  ## Part 2: Round 2 (25 Minutes)

  **0:20–0:25: Transition**
  *   **Script:** "Round 1 had a cliff-edge. Round 2 is smoother. The logic you used in Round 1 might work here, or it might break."

  **0:25–0:35: Round 2 (The Unraveling)**
  *   **Task:** Hand out **Blue Slips**.
  *   **Rule:** "Write any positive whole number (1, 2, 100, 1,000,000)."
  *   **Payoff Structure (Project this):**
      *   Total Pot = **160 Tickets**.
      *   Your Share = $\frac{\text{Your Number}}{\text{Sum of All Numbers}} \times 160$.
  *   **Example:** "If everyone writes 1, the sum is 16. You get 1/16th of the pot = 10 tickets. If everyone writes 10, the sum is 160. You get 10/160th of the pot = 10 tickets."
  *   **Action:** Collect, calculate, project results.
  *   **Likely Outcome:** The "Sameness" logic suggests picking 1 (minimum effort for max efficiency). But the incentive to inflate is high. You will likely see numbers like 1, 2, 5, 10, maybe one joker writes 1000.
  *   **Result:** The sum inflates. The ticket payout per person drops below 10. If someone writes a massive number, they scoop the pot, others get near 0.
  *   **Key Observation:** If everyone reasoned "We are the same, so we pick 1," everyone gets 10 tickets. But unlike Round 1, picking 1 isn't *safe*. If you pick 1 and someone else picks 2, you lose.

  **0:35–0:45: Mini-Debrief 2**
  *   **Ask:** "In Round 1, assuming everyone thinks like you led to Cooperation (A). In Round 2, assuming everyone thinks like you leads to... what?"
  *   **The Trap:** If we all think alike, we all pick $X$. But the payoff is 10 tickets *regardless* of what $X$ is.
  *   **The Break:** "If the payoff is the same whether we all pick 1 or all pick 1,000, why not pick 1,001? Just in case someone else picked 1,000?"
  *   **Board Work:** Draw the curve. Show that the "Sameness" argument stabilizes Round 1 (Cooperate vs Defect) but leaves Round 2 floating (Any number is as good as any other *if* matched, but unstable if not).
  *   **The Feeling:** They should feel the frustration that "being the same" isn't enough to solve Round 2.

  ---

  ## Part 3: Round 3 (20 Minutes)

  **0:45–0:50: Break**
  *   Let them breathe. Reset the tension.

  **0:50–0:55: Setup**
  *   **Script:** "Round 3 is identical to Round 2. Same formula. Same Pot. But there is one change."
  *   **The Change:** "You have **3 minutes** to talk to each other before you write your number. You cannot show your slip. You cannot make binding contracts. After 3 minutes, silence falls, and you write."

  **0:55–1:05: Round 3 (The Coordination)**
  *   **Action:** Let them talk. They will likely converge on "Everyone write 1."
  *   **Silence:** Enforce strict silence for the writing phase.
  *   **Collection & Reveal:** Calculate.
  *   **Likely Outcome:** Most will write 1. One or two will write 2 or 3 ("Just to be safe" or "To win"). The pot shrinks slightly. Trust is partially broken.
  *   **Alternative Outcome:** They agree on a randomizer ("Flip a coin, heads 1, tails 2"). This is rare but gold if it happens.

  **1:05–1:10: The Draw**
  *   Collect all tickets (points) earned across all rounds.
  *   Put physical slips into the jar representing their tickets.
  *   Draw the winner. Hand over the $15.
  *   *Note:* Even if they earned 0 tickets in a round, they stay in the game if they have tickets from other rounds.

  ---

  ## Part 4: The Debrief (15 Minutes)

  **1:10–1:25: Mapping the Logic**

  **1. The "Sameness" Move (Round 1)**
  *   **Ask:** "Who chose A because they thought 'If I choose A, others will too'?"
  *   **Point:** This is the move you felt. You treated your choice as a *diagnostic* of the group's choice.
  *   **Why it worked:** In Round 1, there are only two stable states: All-A (Good) or All-B (Bad). The "Sameness" assumption pushes you to the Good state.
  *   **Why it's risky:** It relies on the belief that your reasoning is *causally linked* to theirs. It isn't. You can't *make* them choose A by choosing A. You are just betting that your brain is a good sample of their brains.

  **2. The Indeterminacy (Round 2)**
  *   **Ask:** "Why didn't 'Sameness' solve Round 2?"
  *   **Point:** In Round 2, if we are all the same, we all pick $X$. But the math says payoff is identical whether $X=1$ or $X=100$.
  *   **The Unraveling:** Because the specific number doesn't matter *if we match*, there is no logical reason to pick 1 over 100. But if there's no reason to pick 1, I can't be sure *you* will pick 1. So I pick 2 to beat your 1. You anticipate that, so you pick 3.
  *   **Result:** The "Sameness" assumption gives you *no answer*. It creates a void where coordination should be.

  **3. The Escape Hatch (Round 3)**
  *   **Ask:** "Did talking help? Why or why not?"
  *   **Likely Consensus:** It helped, but not enough. People still defected.
  *   **The Discovery:** Ask them: "What would you have needed to make 'Everyone pick 1' stick?"
  *   **Target Answers:**
      *   "A penalty for lying."
      *   "A way to see their slip before I submit mine."
      *   "A coin flip we all agreed to obey."
  *   **The Concept:** You are looking for **Correlation**.
      *   In Round 1, the game structure correlated us (All or Nothing).
      *   In Round 2, there was no correlation device.
      *   In Round 3, talk is "cheap." It doesn't correlate our actions reliably.
      *   **The Fix:** You need a **Focal Point** (something obvious, like '1') *plus* a **Commitment Device** (a way to make the agreement binding). Without the commitment, the "Sameness" logic collapses back into the bidding war.

  **1:25–1:30: The Missing Piece (Lecture Mode)**
  *   **Script:** "Here is the piece the game cannot show you. In Round 1, the 'Sameness' argument feels powerful. It feels like choosing A *causes* others to choose A. But it doesn't. Your choice is physically independent of theirs."
  *   **The Hard Truth:** "Game theory assumes causal independence. I cannot change your payoff by changing my mind. The 'Sameness' argument relies on *logical* correlation (we run the same mental software), not *causal* influence. That is a philosophical leap, not a mathematical one. In the real world, we use contracts, laws, and norms to turn that logical correlation into causal enforcement. That is what Round 3 was missing."
  *   **Close:** "You felt the pull of cooperation, the frustration of indeterminacy, and the fragility of talk. That's the landscape."

  ---

  ## Contingency Plan: What Will Go Wrong

  **1. The "Joker" Problem**
  *   **Risk:** One student writes "1,000,000" in Round 2 just to break the game.
  *   **Recovery:** Do not scold. Use it. "This is exactly the instability we're studying. One outlier destroys the 'Sameness' payoff. How do we protect against this?" (Leads to enforcement discussion).

  **2. Total Silence in Round 1**
  *   **Risk:** Everyone defects (chooses B).
  *   **Recovery:** This is actually a clean result. "Okay, everyone followed standard Nash reasoning. No one trusted the 'Sameness' hypothesis. The class lost 160 tickets collectively. Who wants to try to recover that in Round 3?"

  **3. Time Overrun on Calculations**
  *   **Risk:** You fumble with Excel while they wait.
  *   **Recovery:** Have a TA or a trusted student input the numbers while you talk. Or, pre-print a grid where they write their own number *and* the total sum (honor system for the sum? No, too risky).
  *   **Best Fix:** Have the Excel sheet open. As you open envelopes, type the number immediately. Project the screen so they see the "Sum" rising in real-time. This builds tension and saves post-game entry time.

  **4. The "It's Just Money" Cynicism**
  *   **Risk:** Students say "$15 doesn't matter, I'm just playing for fun."
  *   **Recovery:** Acknowledge it. "The stakes are low, which makes the betrayal in Round 2 more interesting. You defected for *nothing*. Why?" (Highlights that the *logic* of the game drives behavior more than the magnitude of the payoff).

  ## The "Identical Reasoner" Limitation (For Your Eyes Only)

  You asked what piece the game can't do. Here it is:

  The game simulates the *incentive* structure of superrationality, but it cannot simulate the *ontological status* of the other players.
  *   **In the game:** Students know they are distinct biological entities. They know physically that their pen moving does not move another student's pen.
  *   **The Argument:** The "Sameness" move (Hofstadter's superrationality) requires you to act *as if* your decision determines the group's decision.
  *   **The Gap:** No payoff table can force a student to believe their choice is logically linked to another's. They will always retain the "Causal Independence" out: "I know I'm choosing A, but *they* might still choose B."
  *   **Your Job:** In the debrief, you must explicitly state that standard Game Theory assumes **Causal Independence**. The "Sameness" argument is a challenge to that assumption. It works in logic puzzles (like the Prisoner's Dilemma with a clone), but in the real world, it requires **institutions** (contracts, norms) to mimic that logical link. That is the bridge from "Sameness" to "Society."
