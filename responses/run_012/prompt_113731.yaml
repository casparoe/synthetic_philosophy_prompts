answer: |-
  **AMNESTY COMMITTEE OF THE RECONCILIATION COMMISSION**
  **WRITTEN OPINION AND RECOMMENDATION**
  **FILE NO:** 88-B (River Crossing Auxiliary)
  **DATE:** 24 October 2024

  **I. RECOMMENDATION**

  The Committee recommends that the application for amnesty be **REFUSED**.

  Upon finalization of this opinion, the Secretariat shall notify the applicant of the decision by **31 October 2024**.

  Consequent to this refusal, and pursuant to Section 12 of the Commission’s Statute, the Committee recommends that the file be **REFERRED TO THE OFFICE OF THE PROSECUTOR GENERAL** for consideration of criminal charges regarding unlawful killing and unlawful detention. This referral shall be transmitted no later than **30 November 2024**.

  **II. REASONS FOR RECOMMENDATION**

  The statutory mandate of this Committee is narrow and precise. We are not a court of general mercy, nor are we a tribunal of historical truth alone. We are a gatekeeper for a specific legal exception: amnesty is permitted *only* where the act in question was committed with a political objective. The Statute explicitly excludes acts done for private gain, personal malice, or mere obedience to orders.

  In this case, the applicant has satisfied the procedural requirements: his disclosure is full, and the Committee accepts that his remorse is genuine. However, procedural compliance does not establish statutory eligibility. The burden rests upon the applicant to demonstrate that the specific acts of guarding detainees and firing upon escapees were driven by a political objective.

  The evidentiary record before us fails to meet this burden. It does not affirm a political motive; rather, it presents three alternative explanations, all of which fall outside the Statute’s protection.
  1.  **Obedience:** The applicant’s own account cites fear of his sergeant and a desire to avoid discipline. Two requests for transfer suggest a reluctance to participate, yet he remained. This aligns with "mere obedience to orders," which the Statute excludes.
  2.  **Intoxication and Confusion:** The applicant cites drink and confusion. These are states of diminished capacity, not political intent.
  3.  **Personal Malice:** The Commission’s historian interprets the applicant’s private letters as evidence of a "settled hatred" of the victim group. If this hatred was personal or ethnic rather than instrumental to a political goal, it constitutes "personal malice."

  Because the record "cannot settle" why he acted, we cannot affirmatively find that he acted for a political objective. In a legal framework, ambiguity regarding eligibility must resolve in favor of the rule of law, not the exception. To grant amnesty where the motive is indeterminate would be to rewrite the Statute from the bench. We are constrained to apply the law as written, not as we might wish it to be.

  **III. THE STRONGEST CASE AGAINST THIS RECOMMENDATION**

  The Committee must confront the most serious objection to this refusal, articulated forcefully during our deliberations. The argument is not merely about this applicant; it is about the integrity of the Commission itself.

  Two of this applicant’s comrades, who participated in the same operation, have already been granted amnesty. Their motive was plain: they openly avowed the ideology driving the cleansing operation. They were "willing executioners." This applicant, by contrast, appears to have been a reluctant follower, swept up by fear, habituation, and group pressure.

  By refusing this application while the enthusiasts walk free, the Commission creates a perverse moral hierarchy. We risk establishing a precedent where the most dangerous ideologues are rewarded for their candor about their hatred, while the confused, the fearful, and the morally weak are punished for their ambiguity. This turns the Statute on its head: it punishes the "ordinary man" while sparing the true believer.

  Furthermore, the survivors’ associations argue that labeling this applicant an "ordinary man" insults the dead. Yet, prosecuting him may insult the living. To refer a remorseful, low-level auxiliary to the prosecutors, while those who drove the policy remain free, undermines the very reconciliation this Commission was built to serve. It suggests that the Commission is capable of catching the small fish but lacks the net for the whales. If the goal of the Statute is to trade justice for truth to secure peace, refusing this man secures neither. It denies him justice (as he is treated more harshly than his peers) and it risks destabilizing the peace by appearing to victimize a foot soldier while the architects of violence enjoy impunity. This inequity is the strongest argument for granting amnesty despite the evidentiary gaps.

  **IV. CONDITIONS FOR REVERSAL AND LIMITS OF REASONING**

  This recommendation is not immutable. It would change immediately should new evidence emerge that clarifies the applicant's motive as specifically political. For example, if testimony were produced showing that the applicant fired upon escapees not out of fear of his sergeant, but specifically to advance a tactical objective of the unit that he understood and endorsed, the requirement for a "political objective" would be met. Similarly, if the "hatred" identified in the letters could be definitively categorized as political ideology rather than personal malice, the exclusion would no longer apply.

  However, the reasoning set out above is likeliest to fail on the distinction between "political hatred" and "personal malice." In a civil war, these categories often collapse. A soldier may hate the enemy *because* of the political conflict, not apart from it. To parse the human heart so finely as to separate political conviction from personal animus in the heat of a massacre may be a legal necessity, but it is a psychological impossibility. If this distinction proves unsustainable in future appeals or judicial review, the Committee’s reliance on it will be viewed as artificial. We must acknowledge that while we draw this line to uphold the Statute, the line itself may be a fiction of the law rather than a truth of human behavior.

  **Chair, Amnesty Committee**
  **Reconciliation Commission**
