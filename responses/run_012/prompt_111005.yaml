answer: |-
  ### Adequacy Conditions for Personal Identity in Gradual Replacement Scenarios

  To evaluate any account of personal identity within the context of mind uploading, the theory must satisfy the following desiderata. These are derived from the specific structural pressures of gradual replacement, prioritizing the four weighted variants provided.

  **1. The Phenomenal Continuity Requirement**
  *   **Derivation:** Neuron-by-neuron replacement (Variant 1).
  *   **Motivation:** If the replacement occurs at a tempo that precludes any detectable break in consciousness, memory, or behavioural capacity, the subject’s first-person perspective remains unbroken. A theory that posits death at step *n* despite uninterrupted experience contradicts the primary datum of survival: the continuity of consciousness.
  *   **Status:** **Non-negotiable.** (To deny this is to make identity undetectable in principle to the subject, rendering the theory pragmatically useless for survival contexts.)

  **2. The Uniqueness (Non-Branching) Requirement**
  *   **Derivation:** Parallel retention variant (Variant 2).
  *   **Motivation:** If the original biological units remain active while the silicon replacements form a second active system, numerical identity cannot hold between the original and *both* successors. Transitivity of identity forbids $A=B$ and $A=C$ where $B \neq C$. The theory must provide a principled reason for privileging one claimant over the other, or deny numerical identity in favour of a weaker survival relation.
  *   **Status:** **Non-negotiable.** (This is a logical constraint on numerical identity; violating it entails a contradiction.)

  **3. The Material Neutrality Requirement**
  *   **Derivation:** Neuron-by-neuron replacement (Variant 1) and Disassembly/Reassembly (Variant 3).
  *   **Motivation:** If identity survives the temporary dispersion of matter (Variant 3) provided structure is restored, it is difficult to argue it fails when matter is swapped for functionally equivalent silicon (Variant 1) provided structure is maintained. The theory must explain why the *history* of the matter matters more than the *arrangement* of the function, or vice versa, without arbitrariness.
  *   **Status:** **Commitment of one camp.** (Functionalists/Patternists accept this; Animalists/Constitutionalists reject it. A theory need not satisfy this to be coherent, but it must satisfy it to support uploading.)

  **4. The Grounding Stability Requirement**
  *   **Derivation:** Regressive replacement variant (Variant 4).
  *   **Motivation:** If the mechanism effecting the preservation is itself replaced while working, there is no fixed "preserver" distinct from the "preserved." The theory must locate the ground of persistence in the *process* or the *pattern* rather than a specific substantial agent, avoiding an infinite regress where nothing persists long enough to carry identity.
  *   **Status:** **Non-negotiable.** (Metaphysical coherence requires that the ground of persistence not vanish into a regress of temporary carriers.)

  **5. The Determinacy Requirement**
  *   **Derivation:** General background fact (applied to all variants).
  *   **Motivation:** For any given moment post-transition, there must be a fact of the matter regarding whether the original person exists. Vagueness is permissible in predicates, but existence itself is typically treated as a binary state in survival contexts; one cannot be "half-dead" in terms of numerical identity.
  *   **Status:** **Commitment of one camp.** (Realists accept this; Nihilists or Conventionalists regarding identity may reject it, arguing identity is indeterminate in borderline cases.)

  ***

  ### Analysis of Theoretical Constraints

  **Single Requirement Excluding the Most Candidates:**
  **The Material Neutrality Requirement.**
  While the Uniqueness Requirement forces complex modifications on Psychological Continuity theories (e.g., adding a "no-branching" clause), Material Neutrality eliminates entire ontological categories. It immediately disqualifies Animalism, Biological Naturalism, and any somatic constitution view. Since the dissertation concerns *uploading*, any theory failing this condition is unusable for the specific purpose, effectively clearing the field of all biological accounts.

  **Jointly Unsatisfiable Pair:**
  **The Uniqueness Requirement and The Determinacy Requirement (in the context of Symmetry).**
  Your suspicion is correct, though the tension is most sharply felt between **Uniqueness** and **Symmetry of Claim**. In the Parallel Retention variant (Variant 2), the biological original and the silicon successor possess symmetric claims to psychological continuity and functional organization.
  *   If you enforce **Uniqueness** (only one is the original), you violate **Symmetry** (you must arbitrarily privilege the biological substrate over the silicon, or vice versa, despite functional equivalence).
  *   If you enforce **Symmetry** (both have equal claim), you violate **Uniqueness** (identity branches, which is logically impossible for numerical identity).
  *   To save **Determinacy**, one must assert a fact of the matter exists despite the symmetry. But if the physical and psychological facts are symmetric, the "fact" of identity becomes a brute, ungrounded truth, violating the **Grounding Stability Requirement**.
  Thus, the collision is tripartite: you cannot have Determinate Identity, Symmetric Claims, and Grounded Facts simultaneously. Usually, Determinacy is the casualty.

  ***

  ### Scoring of Contenders

  *   **Neo-Lockean (Psychological Continuity):** Satisfies Phenomenal Continuity and Material Neutrality. Fails Uniqueness in parallel cases without ad hoc "non-branching" clauses. Fails Grounding Stability if the psychological carrier is not well-defined.
  *   **Animalism:** Satisfies Uniqueness and Determinacy robustly. Fails Material Neutrality and Phenomenal Continuity in uploading scenarios (the organism does not survive substrate swap). Unusable for this dissertation.
  *   **Pattern / Four-Dimensionalism:** Satisfies Phenomenal Continuity and Material Neutrality. Dissolves the Uniqueness problem by treating persons as spacetime worms (branching creates two distinct temporal parts). However, often sacrifices Determinacy of *numerical* identity in favour of degree-of-survival.

  Verdict: The collision between The Uniqueness Requirement and The Symmetry of Claims in parallel cases forces the abandonment of Determinacy.
