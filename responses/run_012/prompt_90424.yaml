answer: |-
  There is no single, canonical proper noun (like "The Prisoner's Dilemma" or "The Veil of Ignorance") that captures this specific rhetorical and logical pattern in its entirety. However, the phenomenon sits at the intersection of three well-established concepts, none of which quite fits your description alone.

  1.  **Measurement Theory:** The technical error is asserting a **"Meaningless Statement."** In the tradition of Suppes, Zinnes, and Krantz, a statement is "meaningful" only if its truth value is invariant under the admissible transformations of the scale (e.g., monotone for ordinal, linear for interval). Your arguers are making non-invariant claims while pretending they are invariant.
  2.  **Welfare Economics:** Amartya Sen describes the historical tendency of economists to ban interpersonal comparisons (following Robbins) and then smuggle them back in to make policy recommendations as **"Covert Interpersonal Comparisons."** This captures the secrecy, but not the specific mechanism of switching scales.
  3.  **Index Number Theory:** The problem that different base weights or scales yield different rankings is the **"Index Number Problem."** Your arguers are not just facing this problem; they are **suppressing** it.

  Because the existing terms describe the *error* (meaninglessness), the *history* (covert comparisons), or the *math* (index numbers), but not the *rhetorical pattern of denying the scale while exploiting it*, I propose we coin a term for this specific phenomenon.

  I suggest calling this **"The Invariance Illusion."**

  Below is the concept carved up, distinguishing it from its neighbors and marking its edges.

  ### The Concept: The Invariance Illusion

  **Definition:** The Invariance Illusion occurs when an arguer derives a normative conclusion from premises that are acknowledged to be ordinal (or otherwise scale-relative), by implicitly selecting a specific cardinalization (scale and zero-point) that yields the desired conclusion, while rhetorically maintaining that the conclusion follows from the ordinal premises alone. The "illusion" is that the conclusion is presented as **invariant** (robust across all permissible transformations) when it is actually **variant** (dependent on the hidden choice of scale).

  ### How it differs from neighboring concepts

  **1. Versus Ordinary Vagueness**
  *   **Vagueness** implies a lack of precision (e.g., "A is significantly worse off"). The boundaries of the concept are fuzzy.
  *   **The Invariance Illusion** involves *false precision*. The arguer does not say "A is worse enough to justify helping"; they say "The gain to A *outweighs* the loss to C." This implies a specific ratio or difference. The error is not that the terms are fuzzy, but that the precision is illegitimate. Vagueness admits uncertainty; the Invariance Illusion conceals it.

  **2. Versus The Index-Number Problem**
  *   **The Index-Number Problem** is the *recognition* that different aggregation methods (e.g., Laspeyres vs. Paasche indices, or absolute vs. proportional poverty measures) yield different rankings. An honest discussion of the index-number problem admits the ambiguity and argues for a choice of index on normative grounds.
  *   **The Invariance Illusion** is the *denial* of the index-number problem. The arguer switches indices (e.g., from absolute to proportional deprivation) mid-argument to secure a verdict, without acknowledging that the switch occurred or that it was decisive. The Index-Number Problem is the terrain; the Invariance Illusion is the camouflage.

  **3. Versus Straightforward Cardinalism**
  *   **Straightforward Cardinalism** (e.g., Harsanyi's Utilitarianism) argues that interpersonal utility comparisons *are* factually possible and defends a specific method for establishing the scale (e.g., von Neumann-Morgenstern lotteries).
  *   **The Invariance Illusion** accepts the *orthodoxy* that such scales are not factually grounded (agreeing with Robbins/Sen that utility is ordinal) but proceeds *as if* they were. It is a form of **epistemic bad faith**: it claims the epistemic humility of ordinalism while wielding the power of cardinalism.

  ### The Structure of the Move

  The Invariance Illusion typically proceeds in three steps:

  1.  **The Ordinal Shield:** The arguer begins by affirming the measurement-theoretic orthodoxy. ("We cannot compare utility levels across persons; we only know A is worse off than B.") This inoculates them against charges of metaphysical excess.
  2.  **The Covert Cardinalization:** To reach a decision, the arguer implicitly applies a transformation function (e.g., treating welfare as ratio-scalable with a zero at "destitution," or interval-scalable with a zero at "neutral"). This choice is never stated.
  3.  **The Invariant Verdict:** The arguer presents the result ("Helping A is better") as a logical consequence of Step 1, rather than a consequence of Step 2. If challenged, they retreat to Step 1 ("But A is so much worse off!"), ignoring that "so much" has no meaning without Step 2.

  ### Why this name fits

  In measurement theory, a statement is **meaningful** if and only if it is **invariant** under the admissible transformations of the scale.
  *   If welfare is ordinal, the statement "A's gain > C's loss" is **non-invariant** (you can stretch A's scale to make the gain huge or tiny without changing the ordinal facts).
  *   Therefore, the statement is **meaningless**.
  *   The arguer presents this meaningless statement as meaningful. They create the **illusion** that the truth of the claim is invariant across the permissible transformations, when it is not.

  ### Where the concept stops fitting

  *   **Explicit Weighting:** If a cost-benefit analysis explicitly states, "We are assigning a value of $10M to a life-year," this is not the Invariance Illusion. It is explicit cardinalization. The illusion requires the *concealment* of the scale.
  *   **Lexical Priorities:** If an arguer says, "A is worse off, so A gets priority regardless of magnitude" (a Rawlsian or Prioritarian lexical rule), they are not comparing magnitudes. They are using a rule that operates on ordinal information (who is worst off). The Invariance Illusion specifically involves *weighing* magnitudes (outweighing, net benefit) while denying the scale.
  *   **Empirical Disagreement:** If two parties agree on the scale but disagree on the empirical facts (e.g., "Policy X will actually help A more than Policy Y"), this is not the Invariance Illusion. The illusion is about the *metric*, not the *empirics*.

  ### Summary

  You have identified a specific form of **equivocation** where the equivocation is on the **metric**. While **"Covert Interpersonal Comparison"** (Sen) is the standard label in welfare economics, it describes the *input* (smuggling in comparisons). **"The Invariance Illusion"** describes the *logical structure* of the argument (presenting a variant conclusion as invariant). It marks the edge where measurement theory meets rhetorical evasion.
