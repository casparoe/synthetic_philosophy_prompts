  ### The Vote
  To stay consistent with your panel's precedents, you should vote **Go**.

  ### The Rule You Are Actually Running
  You are running the **Unilateralist's Curse** rule (specifically: *Intervene only when multiple independent actors could trigger the risk*).

  Here is why the other candidate rules don't fit the track record as well:
  *   **"No unless the community would sign off":** This doesn't fit because you don't have evidence that community consensus was the deciding factor in the past. In the "No" cases (Priya, Organism, Dataset), the justifications explicitly cited the *number of labs* that could do the same thing ("Three other groups," "Lots of labs," "Any number of labs"). In the "Yes" cases (Marcus, Dana), the justifications cited *containment* or *singularity* ("Single recipient," "She's a grownup").
