  ### Confidence and Uncertainty
  **Confidence:** I am **80% confident** that the Unilateralist's Curse is the operational rule. The language used to justify the past "No" votes ("it only takes one," "any number of labs") is too specific to be accidental. It points directly to the structure of the actor network rather than the nature of the harm.

