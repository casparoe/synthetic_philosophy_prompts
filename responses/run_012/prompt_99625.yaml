answer: |-
  **A decision procedure for credible intention is coherent only if it focuses on changing the incentives for action rather than trying to manufacture belief without cause.**

  The reasoning is that intention is not a switch you can flip; it is a prediction you make about your own future behavior based on your future incentives. If the incentives change once you get paid (the "ex-post" problem), your prediction becomes false, and you cannot sincerely hold it. Therefore, the only way to sell credible intention is to engineer a situation where your future incentives remain aligned with the action, or where the cost of changing your mind exceeds the benefit of keeping the money. If you cannot do that, you cannot intend, and any attempt to signal otherwise is a bluff that will eventually degrade your reputation.

  ### The Credible Commitment Checklist

  Run these four questions in order. Do not proceed to the next question if the previous one triggers a **STOP** rule.

  **1. The "After" Test (Ex-Post Rationality)**
  *   **Ask:** Once you have secured the reward (money, leverage, concession), will you still have a selfish reason to carry out the action?
  *   **Good Answer:** "Yes, because the action itself protects something I value more than the cost of doing it," or "Yes, because the reward is structured as reimbursement for the cost."
  *   **Bad Answer:** "No, once I have the money, doing the thing is purely a loss."
  *   **Decision Rule:** If the answer is **No**, move to Question 2. If **Yes**, proceed to Question 3.

  **2. The "Trap" Test (Binding Mechanism)**
  *   **Ask:** Can we attach a penalty to *not* doing the action that is larger than the reward you just received?
  *   **Good Answer:** "Yes, we can write a clause that forfeits the bonus if I stay," or "Yes, I can publicly burn a bridge that makes staying impossible."
  *   **Bad Answer:** "No, the deal is done once I convince them," or "No, I can always find a loophole."
  *   **Decision Rule:** If **No**, **STOP**. Advise the client: *You cannot intend this. You are being asked to bluff, and you will know you are bluffing.* If **Yes**, proceed to Question 3.

  **3. The "Mirror" Test (Psychological Capacity)**
  *   **Ask:** Can you look in the mirror right now and honestly say, "I will do this," without crossing your fingers?
  *   **Good Answer:** "Yes, because I've accepted the cost," or "Yes, because the binding mechanism leaves me no choice."
  *   **Bad Answer:** "I hope so," or "I'll try," or "I just need to convince them."
  *   **Decision Rule:** If **No**, **STOP**. Advise the client: *Your hesitation will leak. Non-verbal signals will betray you.* If **Yes**, proceed to Question 4.

  **4. The "Catch" Test (Reputation Risk)**
  *   **Ask:** If the other side discovers you never intended to act (or reneged immediately), is the reputational damage worse than the reward is worth?
  *   **Good Answer:** "Yes, my career depends on being believed."
  *   **Bad Answer:** "No, this is a one-off deal," or "No, they can't prove what I intended."
  *   **Decision Rule:** If **No**, **STOP**. Advise the client: *The economics favor bluffing, which means you will eventually bluff, which means you shouldn't start.* If **Yes**, **COMMIT**.

  ---

  ### Case Runs

  **1. The Retention Bonus (CEO vs. Acquisition)**
  *   **The "After" Test:** **Fail.** Once the bonus vests, walking away from the acquisition is financially irrational for the CEO.
  *   **The "Trap" Test:** **Fail.** The board pays upon *conviction*, not upon *action*. There is no mechanism to claw back the bonus if he stays.
  *   **Verdict:** **STOP.**
  *   **Unwelcome Truth:** You cannot take this money honestly. To intend to walk away, you must make walking away rational ex-post, which requires changing the contract so the bonus is forfeit if you stay. If the board won't agree to that, you are being paid to lie, and you cannot lie credibly because you know you won't walk.

  **2. The Parent (Birthday Party Discipline)**
  *   **The "After" Test:** **Fail.** In the moment, leaving the party feels worse than letting the behavior slide.
  *   **The "Trap" Test:** **Pass.** The "penalty" is the long-term erosion of parental authority. If the parent reframes the cost not as "missing cake" but as "losing the ability to parent effectively," the ex-post rationality shifts.
  *   **The "Mirror" Test:** **Pass.** If the parent accepts the reframing, they can sincerely believe leaving is necessary.
  *   **Verdict:** **COMMIT.**
  *   **Note:** This settles only because the client agrees to value long-term authority over short-term comfort, changing the incentive structure internally.

  **3. The Union Rep (Strike Threat)**
  *   **The "After" Test:** **Fail.** A strike hurts the workers more than the concession.
  *   **The "Trap" Test:** **Unsettled.** The rep cannot bind the workers alone. Only a member vote can create a binding mechanism (e.g., a mandate that forces the rep to strike).
  *   **The "Mirror" Test:** **Handoff.** The rep cannot answer this. It depends on whether the members believe the strike is worth it.
  *   **Verdict:** **HANDOFF.**
  *   **Note:** The procedure cannot settle this. It identifies that the intention does not live in the rep, but in the membership. The advisor must tell the client: *You cannot intend this on their behalf. Go convince the members to bind you, or drop the threat.*

  ### Summary of Outcomes
  *   **Settled:** The Retention Bonus (Don't do it) and The Parent (Do it, with reframing).
  *   **Unsettled/Handoff:** The Union Rep (Requires external authorization).
  *   **Unwelcome Truth:** The Retention Bonus case tells the client they cannot get the money without actually altering the deal to force the action, killing the "free money for intention" fantasy.
