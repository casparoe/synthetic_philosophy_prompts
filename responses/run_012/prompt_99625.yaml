      *   This is essentially Gregory Kavka's "Toxin Puzzle." Can you intend to drink a toxin that will make you sick tomorrow if you get paid tonight for intending to, knowing you won't drink it tomorrow because there's no reason to?
      *   Standard rational choice theory says no. Intention implies a belief that you will act. If you know you won't act (because it's irrational ex-post), you can't sincerely intend.
      *   However, humans *can* sometimes bind themselves (Ulysses contracts) or change their payoff structures (burning bridges).
      *   The consulting angle: Can we engineer a situation where the intention is credible *because* the action becomes rational, or because the cost of changing mind is too high?
      *   The user's specific worry: "It looks like he should form the intention and then not act... you can't just decide to intend something you already know you won't do."
      *   The verdict needs to address whether a procedure can resolve this. The honest answer is: No, not if the payoff structure remains unchanged. Yes, if the payoff structure or identity changes.
