answer: |-
  Here are three possible pivots I considered before settling on the final joke:

  1.  **The Veil of Ignorance / Risk Neutrality:** This focuses on Harsanyi's claim that behind the veil, you must maximize expected utility (risk neutrality) rather than using Maximin (Rawls).
      *   *Rejection:* While central to the Harsanyi-Rawls debate, this is a bit well-trodden. Most philosophy grads know the "Harsanyi says gamble, Rawls says worry" dynamic. It risks being a general political philosophy joke rather than a specific theorem-machinery joke.
  2.  **The Existence Critique:** This focuses on the forum comment you mentioned: that the theorem only works *if* a social preference ordering exists, and assuming its existence is the real work.
      *   *Rejection:* This is technically accurate but hard to make punchy. It risks becoming a meta-joke about mathematical existence proofs, which might land too dryly even for insiders.
  3.  **The Social Independence Axiom:** This focuses on the specific VNM axiom (Independence) applied to *society*. To get the weighted sum, you must assume society satisfies Independence over social lotteries. But Independence implies linearity, which implies no priority to the worse off.
      *   *Selection:* This is the load-bearing beam. Insiders know that assuming "Social Independence" is effectively assuming Utilitarianism in disguise. It allows for a punchline that turns on the specific technical equivalence between "rationality" (Independence) and "ideology" (Linearity/Utilitarianism).

  Here is the joke.

  ***

  A grad student bursts into his advisor's office, waving a draft.

  "I've done it. I've derived Utilitarianism from pure rationality. No moral premises, just VNM axioms."

  The advisor doesn't look up from his grading. "Let me guess. You assumed individuals satisfy Independence."

  "Obviously."

  "And you assumed Society satisfies Independence."

  "It's required for the aggregation theorem. Otherwise, you don't get the sum."

  The advisor puts down his red pen. "Do you know what Social Independence implies?"

  "That social welfare is linear."

  "Which means," the advisor says, "that society must be indifferent between giving a dollar to a starving man or a billionaire, provided the probabilities match."

  "That's what the math says."

  "So you assumed society is indifferent to inequality to prove society should be indifferent to inequality."

  "No," the student says, tightening his tie. "I assumed *consistency*. Utilitarianism is just what consistency looks like in aggregate."

  The advisor picks up the pen again. "Write that down. Call it 'Theorem 1.' I'll call it 'Premise 1.' We'll see who gets published."

  \answer{Social Independence Axiom}
