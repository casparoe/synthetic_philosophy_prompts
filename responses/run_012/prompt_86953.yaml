  # Seminar Handout: The Logical Space of Promising
  **Week 4: Normative Ethics**

  **Instructions:** Work through the four questions below individually. Do not worry about which philosopher holds which view; answer based on your own intuitions about the cases described. Follow the arrows to find your position in the logical space. There are twelve possible endpoints.

  ---

  ### Q1: The Desert Island Test (Convention)
  Imagine you and I are the only two humans left on Earth. There is no society, no language convention, and no history of promises. I look you in the eye and say, *"I promise to gather firewood tonight."*
  *   **A.** I am **not bound**. Without a pre-existing social practice, the words are just noise. *(Go to Q2)*
  *   **B.** I **am bound**. The obligation is created by the act itself, regardless of social history. *(Go to Q5)*

  ---

  ### Q2: The Release Test (Directedness)
  *(For those who answered A: Practice Required)*
  We live in a society with a practice of promising. I promise to meet you for lunch. I want to keep the promise, but **you** tell me, *"Don't worry about it, you are released."*
  *   **A.** I am **released**. The obligation was owed to you; you hold the claim. *(Go to Q3)*
  *   **B.** I am **not released**. The obligation is a general duty to uphold the practice; you cannot waive it. *(Go to Q4)*

  ### Q3: The Pointless Act Test (Content Independence)
  *(For those who answered 2A: Practice + Directed)*
  I promise to count the blades of grass on the lawn. It is useless, harms no one if broken, and helps no one if kept.
  *   **A.** I **still have a reason** to do it. The promise creates a new reason regardless of the act's value. *(Leaf 1)*
  *   **B.** I have a reason **only if** the practice's utility outweighs the pointlessness. *(Leaf 2)*

  ### Q4: The General Duty Ground (Undirected Practice)
  *(For those who answered 2B: Practice + Undirected)*
  Since the duty is not owed to you specifically, what grounds the obligation?
  *   **A.** **Rule Utility.** We should follow the rule because general adherence maximizes welfare. *(Leaf 3)*
  *   **B.** **Social Order.** We should follow the rule because it maintains necessary social coordination. *(Leaf 4)*

  ---

  ### Q5: The Claim Test (Directedness)
  *(For those who answered B: Natural/Non-Practice)*
  I promise to meet you for lunch. I want to keep the promise, but **you** tell me, *"Don't worry about it, you are released."*
  *   **A.** I am **released**. The obligation was owed to you; you hold the claim. *(Go to Q6)*
  *   **B.** I am **not released**. The obligation is about my own moral standing; you cannot waive it. *(Go to Q9)*

  ### Q6: The Pointless Act Test (Content Independence)
  *(For those who answered 5A: Natural + Directed)*
  I promise to count the blades of grass on the lawn. It is useless, harms no one if broken, and helps no one if kept.
  *   **A.** I **still have a reason** to do it. The promise creates a new reason regardless of the act's value. *(Go to Q7)*
  *   **B.** I have a reason **only if** you relied on me or it served some interest. *(Go to Q8)*

  ### Q7: The Source of Authority (Independent Reason)
  *(For those who answered 6A: Natural + Directed + Independent)*
  Where does this content-independent power come from?
  *   **A.** **My Will.** I have authority over my future actions; I legislated this law for myself. *(Leaf 5)*
  *   **B.** **My Integrity.** To break it is to fracture my own moral identity, regardless of your claim. *(Leaf 6)*

  ### Q8: The Source of Reliance (Dependent Reason)
  *(For those who answered 6B: Natural + Directed + Dependent)*
  If the reason depends on effects, which effect matters?
  *   **A.** **Assurance.** I induced an expectation in you that I would act. *(Leaf 7)*
  *   **B.** **Harm.** You will suffer losses if I do not act. *(Leaf 8)*

  ### Q9: The Self-Ground Test (Undirected Natural)
  *(For those who answered 5B: Natural + Undirected)*
  If the duty is not owed to you, but also requires no social practice, what binds me?
  *   **A.** **Self-Constitution.** Keeping promises is constitutive of being a rational agent. *(Leaf 9)*
  *   **B.** **General Utility.** Keeping promises generally produces good outcomes. *(Leaf 10)*
  *   **C.** **Virtue.** A virtuous person keeps their word; it is about character. *(Leaf 11)*
  *   **D.** **Unoccupied.** (See analysis below). *(Leaf 12)*

  ---

  ### Leaf Key
  1.  **Constitutive Practice View** (e.g., Rawls): The practice creates the obligation; the promisee holds the claim; the rule is binding even for pointless acts because it defines the practice.
  2.  **Instrumental Practice View**: The practice creates the obligation; the promisee holds the claim; but pointless acts are not binding if they serve no utility.
  3.  **Rule Utilitarianism (Undirected)**: The obligation is to the rule, not the person; bindingness depends on the rule's general utility.
  4.  **Social Coordination View**: The obligation is to the social order; bindingness depends on maintaining coordination systems.
  5.  **Will Theory**: The promisor has normative authority to bind themselves; the promisee holds the claim; the act is binding regardless of content.
  6.  **Fidelity View (Directed)**: The obligation is owed to the promisee, but grounded in the promisor's duty to maintain their own moral integrity in relation to others.
  7.  **Assurance View**: The obligation arises from having induced a specific expectation in the promisee.
  8.  **Reliance/Harm View**: The obligation arises only if breaking the promise causes detriment to the promisee.
  9.  **Self-Constitution View**: Promising is an exercise of rational agency; breaking a promise undermines the agent's own unity.
  10. **Act Utilitarianism**: No special obligation exists; one should only keep the promise if it maximizes utility in this specific instance.
  11. **Virtue Ethics of Promising**: Promising is a locus of trustworthiness; breaking it is a vice regardless of consequences or claims.
  12. **Unnamed/Unoccupied**: (See Analysis).

  ---

  ### Analysis I: Indistinguishable Leaves
  **Leaves 6 (Fidelity) and 9 (Self-Constitution)** are difficult to separate in practice. Both ground the obligation in the promisor's integrity rather than the promisee's claim or social utility. The tree separates them based on *Directedness* (Can the promisee release?), but a defender of Self-Constitution might argue that while the *ground* is internal, the *direction* is still owed to the promisee. If they concede the promisee can release, they collapse into Leaf 6. If they insist the promisee cannot release, they remain at Leaf 9. The distinction rests entirely on the waiver intuition, not the source of value.

  **Leaves 3 (Rule Util) and 4 (Social Coordination)** often converge on the same verdicts. Both treat the obligation as undirected and instrumental. "Social Order" is often just a specific description of the "General Utility" being maximized. They are kept apart here only to distinguish between a focus on *welfare outcomes* (3) versus *systemic stability* (4), but in a secret harmless breach, both would likely permit the breach.

  ### Analysis II: Unoccupied Cells
  The tree leaves **Leaf 12** (Natural + Undirected + Unnamed) and one implicit combination from Q7/Q8 (**Natural + Directed + Independent + Reliance**) effectively unoccupied in standard literature.

  **1. Natural + Directed + Independent + Reliance (Unnamed)**
  *   **Diagnosis:** Coherent but unattractive. It claims the promisee has a claim and the act is binding regardless of content, but grounds this in *reliance*. This is unstable: if reliance grounds it, it should be content-dependent (Leaf 8). If it's content-independent, reliance is irrelevant.
  *   **Secret Harmless Breach:** A defender would have to argue that the *act of relying* creates a normative status that persists even if no harm occurs. "You relied, therefore you have a claim, therefore I must act, even if your reliance was pointless."

  **2. Leaf 12: Natural + Undirected + Unnamed**
  *   **Diagnosis:** Nobody has bothered. This cell represents a view where promising is a natural duty (no practice), not owed to the promisee (cannot release), but not grounded in utility, integrity, or rationality. Perhaps grounded in "Divine Command" or "Natural Law" distinct from agency.
  *   **Secret Harmless Breach:** A defender would say: "The breach is wrong because it violates a cosmic order or natural law, not because it hurts you, harms society, or damages my integrity. You cannot release me because the duty is not mine to give away, nor is it yours to waive."
