  **Decision Tree: The Reality of Time in Gödel's Universe**

  **Start:** You grant that Gödel's rotating metric is a legitimate solution to Einstein's field equations.

  **1. Does this mathematical legitimacy entail physical possibility?**
  *   **No:** Gödel's universe is forbidden in reality. Go to **2**.
  *   **Yes:** Gödel's universe is a live option for our world. Go to **3**.

  **2. Why is it forbidden? Is it metaphysically impossible or merely contingent?**
  *   **Metaphysically Impossible:** The structure of time itself rules out closed timelike curves.
      *   → **Presentist:** Time is an objective flow, so physics must conform to it. If the math forbids a global "now," the math describes an impossible world.
  *   **Contingently Impossible:** Initial conditions or matter content prevent rotation, but time could flow there if conditions differed.
      *   → **Cosmological Contingentist:** Time is real in our universe, even if not in all mathematically possible ones. (Note: This converges with Presentism on "time is real" but differs on why Gödel's world is excluded).

  **3. Is temporal flow something over and above the mere ordering of events (earlier/later)?**
  *   **No:** Time is just the order. Go to **4**.
  *   **Yes:** There is an objective lapse or passage. Go to **5**.

  **4. Is this ordering grounded in a substantival spacetime manifold?**
  *   **Yes:** The manifold is real; events are fixed within it.
      *   → **Block-Universe Eternalist:** Time is a real dimension, but tenseless. All events exist equally; flow is an illusion.
  *   **No:** Only the relations between material events exist.
      *   → **Relationist:** Time is nothing but the order of changes in things. (Note: Collapses with Block-Universe on "no flow," but distinct on spacetime ontology).

  **5. Does an objective flow require a global definition of simultaneity (a universal "now")?**
  *   **No:** Flow can exist without a global slice. Go to **6**.
  *   **Yes:** Flow demands a universe-wide present. Since Gödel's universe lacks one, flow is impossible here. Go to **6**.

  **6. (Branch A: No Global Required) Is the privileged frame of flow detectable?**
  *   **Yes:** There is a hidden but real foliation.
      *   → **Moving-Spotlight View:** The "now" moves along a privileged series of events, even if geometry doesn't show it.
  *   **No:** The privilege is undetectable in principle.
      *   → **Unsupported Combination:** Positing an occult structure that makes no physical difference is generally deemed incoherent or mystical.

  **6. (Branch B: Global Required) Since flow is impossible here, what is its status?**
  *   **Mind-Dependent:** The lapse is a feature of consciousness, not the world.
      *   → **Gödel's Ideal Theory:** Time is "ideal" (Kantian); the world is tenseless, but we perceive flow.
  *   **Non-Existent:** The lapse is simply an error in our theory.
      *   → **Eliminativist about Passage:** There is no flow, ideal or otherwise; our intuition of it is false. (Note: Distinct from Block-Universe by focusing on the error rather than the ontology).
