answer: |-
  We match the words to make the borders clear,
  Then find the goods must pass a safety test,
  Which draws the senior officials in to steer.

  That test requires a stamp on every chest,
  Each stamp demands a clerk to check the seal,
  And clerks need rules to standardise the rest.

  The seal extends beyond the fact'ry wall,
  Into the services we trade away,
  Until the rules encompass nearly all.

  So trade flows freely down the open way,
  But who authorised the hands that guide the state?
  No people spoke, though elites had their say.

  The states retain the power to amend,
  Yet daily life is shaped by what is made,
  Without a ballot to begin or end.

  The chain holds fast, yet now the voice is mute.
