answer: |-
  You are grappling with the distinction between a myth that *sustains* a people and a myth that *weaponizes* them. Your intuition that the "skeleton" (lost war, gallant men, sacred ground) is not the distinguishing factor is correct. The difference lies in the teleology of the memory: what the memory is *for*.

  Here is a proposed principle, the mapping of your cases, the necessary sacrifice, and a new application, followed by the historical caveats you requested.

  ### The Principle: The Vector of Obligation

  A defeat-myth is ethically "honourable" (or at least aesthetically sustainable for a novel about endurance) to the extent that the obligation it creates is **inward**. It is "dishonourable" (or corrosive) to the extent that the obligation it creates is **outward**.

  **Clause 1: The Inward Debt (Endurance and Identity)**
  The myth is honourable if it asks the descendants of the losers: *"What do we owe the dead?"* The answer is usually: endurance, moral improvement, or the preservation of identity despite political failure.
  *   **Forced by:** **Masada** and **Your Grandmother's Village.**
  *   **Why:** In Masada, the vow is "never to fall again" (internal resolve). In your grandmother's village, the song is about a man who would not sign (internal integrity). The value is generated within the community remembering the loss.
  *   **Historical Note:** *Masada:* The mass suicide is known primarily through Flavius Josephus. Archaeological consensus is mixed; some argue the suicides happened, others suggest the rebels were killed or fled, and the story was embellished. *Grandmother's Village:* Oral histories of strikes are often factually unstable but socially "true" regarding community solidarity.

  **Clause 2: The Outward Debt (Entitlement and Revision)**
  The myth is repellent if it asks the world (or a rival group): *"What do you owe us for this loss?"* The answer is usually: territory, political deference, or historical revisionism.
  *   **Forced by:** **The Confederate Lost Cause** and **Kosovo (1990s usage).**
  *   **Why:** The Lost Cause demanded the North accept a falsified history of the war's causes (slavery vs. states' rights) and justified the subjugation of Black Americans. The Kosovo myth, when used in the 1990s, was used to claim land rights and justify ethnic cleansing. The debt is externalized.
  *   **Historical Note:** *Lost Cause:* Historians overwhelmingly agree this was a deliberate ideological campaign (starting with the United Daughters of the Confederacy) to obscure slavery as the cause of the war. *Kosovo:* The 1389 battle is historical fact, but the details are heavily mythologized. Its use as a pretext for 1990s nationalism is well-documented political history.

  **Clause 3: The Acknowledgment of Tragedy**
  A myth remains usable if it admits the role of luck, flaw, or ambiguity. It becomes dangerous when it claims pure martyrdom to obscure moral complexity.
  *   **Forced by:** **Dunkirk** and **Custer.**
  *   **Why:** Dunkirk works because it admits "muddling through" and luck; it is a rescue, not a pure sacrifice. Custer works for you *aesthetically* because it is a tragedy of a vain man, not a saint.
  *   **Historical Note:** *Dunkirk:* Military historians agree the evacuation was successful due to a mix of German errors, British organization, and civilian effort, not divine intervention. *Custer:* Consensus is that Custer was tactically incompetent and engaged in a war of dispossession; the "hero" narrative was constructed by the press and the Army to sanitize the conflict.

  ### The Verdict You Must Abandon

  To hold this principle together, you must abandon the unqualified admiration for **Custer** as a *model* for your family, though you may keep it as a *warning*.

  **Why:** Under the "Vector of Obligation," the Custer myth fails. While the *image* of the last stand is tragic (Clause 3), the *function* of the myth in American culture was to create an **Outward Debt**. It was used to justify further military aggression against Native Americans ("We must avenge Custer") and to frame the dispossession of the Plains as a noble tragedy rather than a systemic crime.
  *   **The Compromise:** You can allow a character to love the *poetry* of Custer (the aesthetic of the last stand) while another character points out that the *use* of that poetry was to demand blood from others. This fits your theme of how a family *uses* defeat. If your family uses the myth to demand something from the world, they are in the "Lost Cause" territory. If they use it to steel themselves against the world, they are in the "Masada" territory.

  ### Application to a New Case: The French Defeat at Sedan (1870)

  I propose **The Battle of Sedan** during the Franco-Prussian War.

  *   **The Defeat:** Emperor Napoleon III was captured, the Second Empire collapsed, and France ceded Alsace-Lorraine.
  *   **Application of Principle:**
      *   **The Outward Debt (Repellent):** The myth of Sedan fueled *Revanchism* (revenge-ism). The obligation was placed on Germany: *"You owe us our land."* This external claim contributed directly to the tensions of World War I. This aligns with your **Lost Cause/Kosovo** verdict.
      *   **The Inward Debt (Honourable):** Simultaneously, the defeat birthed the Third Republic. The obligation placed on the French people was: *"We must rebuild as a democracy to survive."* This aligns with your **Masada/Dunkirk** verdict.
  *   **Utility for your Novel:** This case offers a split within a single nation. One faction uses the defeat to demand war (Outward); another uses the defeat to demand civic reform (Inward). Your four generations could mirror this split: one branch becomes obsessed with reclaiming lost status (Revanchism), while the other focuses on surviving with dignity (Republicanism).
  *   **Historical Consensus:** The military defeat and the capture of the Emperor are settled facts. The link between the loss of Alsace-Lorraine and the outbreak of WWI is a standard historical interpretation, though the weight of *Revanchism* versus other geopolitical factors is debated by specialists.

  ### Historical Consensus vs. Contested Readings

  You asked to know where you are taking liberties. Here is the breakdown of the settled versus the contested for the myths you listed:

  **1. Masada**
  *   **Settled:** The site was a Jewish rebel stronghold destroyed by the Romans in 73/74 CE. Flavius Josephus is the only surviving written source describing the mass suicide.
  *   **Contested:** Whether the mass suicide actually happened. Archaeologist Yigael Yadin (1960s) argued the evidence supported Josephus. Later archaeologists (e.g., Nachman Ben-Yehuda, Joe Zias) argue the bones found suggest a small group, and the suicide narrative may have been a fabrication or exaggeration by Josephus to please his Roman patrons or the rebels' descendants.
  *   **Liberty:** Treating the suicide as absolute historical fact is a liberty; treating it as a foundational *belief* is historically accurate.

  **2. The Confederate Lost Cause**
  *   **Settled:** The narrative that the war was about "states' rights" rather than slavery, and that Confederate soldiers were morally superior, was constructed post-war (1890s–1920s) primarily by women's associations and veteran groups.
  *   **Contested:** The degree to which this myth was believed by the average soldier versus the elite leadership at the time of the war.
  *   **Liberty:** Portraying the Lost Cause as a genuine, organic memory rather than a constructed political tool would be historically inaccurate.

  **3. Kosovo (1389)**
  *   **Settled:** A battle occurred between Serbian Prince Lazar and the Ottoman Sultan Murad I. Both leaders died. The Ottomans eventually conquered Serbia.
  *   **Contested:** The details of the battle (who won tactically is debated, though strategically it was an Ottoman victory) and the specific actions of individuals (e.g., the assassination of the Sultan).
  *   **Liberty:** Treating the specific heroic anecdotes (like Miloš Obilić) as fact is a liberty; treating them as the *stuff of the myth* is accurate.

  **4. Dunkirk (1940)**
  *   **Settled:** Approximately 338,000 Allied troops were evacuated. The German army halted its advance for reasons still debated (Hitler's order vs. military caution).
  *   **Contested:** The extent to which the "Spirit of Dunkirk" was a spontaneous national uprising versus a media construction by the Ministry of Information.
  *   **Liberty:** Attributing the success primarily to "divine intervention" or ignoring the role of the French rearguard (who were left to be captured) would be a liberty.

  **5. Custer's Last Stand (1876)**
  *   **Settled:** Lt. Col. George Custer divided his forces and was defeated by a coalition of Lakota, Northern Cheyenne, and Arapaho. It was part of the Great Sioux War.
  *   **Contested:** The exact sequence of the battle (where the bodies were found suggests different scenarios).
  *   **Liberty:** Portraying Custer as a competent commander or the conflict as a "fair fight" between equal nations would be historically inaccurate. The war was one of dispossession.

  **6. Your Grandmother's Village (Strike in the 1920s)**
  *   **Settled:** Oral traditions in working-class communities often preserve the *sentiment* of resistance even when records are lost.
  *   **Contested:** Everything specific. Strikes were often broken, leaders blacklisted, and records destroyed.
  *   **Liberty:** You are already aware of this. The liberty here is not historical, but emotional: assuming the song is "true" because it feels true. This is valid for a novel.

  ### Summary for the Novelist

  Your principle holds if you define honour not by the *fact* of the defeat, nor the *courage* of the losers, but by the **direction of the debt** the myth creates.

  *   **Masada/Grandmother/Dunkirk:** The debt is **Inward**. (We must endure).
  *   **Lost Cause/Kosovo '90s/Sedan Revanchism:** The debt is **Outward**. (They must yield).
  *   **Custer:** The *image* is Tragic, but the *myth* was Outward.

  If your family's story is about the *uses* of defeat, the tension in your book could arise from one generation trying to keep the debt Inward (survival/dignity) while another tries to cash it Outward (revenge/claim). That is where the tragedy of history lives.
