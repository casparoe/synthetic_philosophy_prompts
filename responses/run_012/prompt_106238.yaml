answer: |-
  **The Case of the Ashes**

  **Setting:** *A quiet corner of a coffee shop. Maya (A, Particularist) and Sam (B, Generalist) are finishing up lunch.*

  **Maya:** So, are you actually going to tell Leo to trespass?

  **Sam:** No, obviously not. He shouldn't break the law. But that doesn't mean the promise disappears.

  **Maya:** See, that's the move I don't get. You say the promise "doesn't disappear," but you just admitted it shouldn't guide his action. If the feature "I promised my dad" isn't actually telling him what to do, in what sense is it still a moral reason? It looks like you're just haunting the situation with a ghost rule.

  **Sam:** It's not a ghost rule. It's a default. Look, the principle is "Keep your promises." That's a genuine generalization we learn from a lifetime of cases. It establishes a presumption. In Leo's case, the presumption is overridden by "Don't break the law." But the promise is still doing work. It's why he feels guilty. If there was no principle, there'd be no guilt to explain.

  **Maya:** But that assumes the guilt is veridical, that it's tracking a real reason. I think the guilt is just a psychological hangover. Here's the specific point: In *this* context, does "I promised" even count in favor of scattering the ashes? Leo's dad was a stickler for rules. A law-abiding citizen. Knowing that, scattering the ashes illegally might actually violate the *spirit* of the promise.

  **Sam:** Okay, but that's just two principles clashing. Respect the father's wishes vs. Respect the father's values.

  **Maya:** No, it's deeper. It's that the valence of the feature "promise" has flipped. Usually, promising is a reason to act. But here, because of the *type* of person the father was, the fact that he extracted this promise might actually be a reason *not* to do it. You don't honor a father like that by becoming a criminal on his behalf. So, "I promised" isn't a *pro tanto* reason that got outweighed. It's a feature that, in this holistic context, has no positive moral weight at all.

  **Sam:** That seems like semantic gymnastics. You're saying because the context is complex, the principle vanishes? I'm saying the principle is the baseline. Without the baseline, how do you know you need an exception? The reason the law matters here is precisely because it's strong enough to defeat the promise. If the promise wasn't a reason, the law wouldn't need to "defeat" anything. It would just be "Don't trespass," end of story.

  **Maya:** But that's the question: what does the principle *add* to the sum of particular considerations? You've got the legal risk, the emotional closure, the respect for the dead, the environmental impact of the ashes. You can weigh all that without a rulebook. If your principle is "always defeasible," then it never actually determines the outcome. It's just a label you slap on the considerations you already liked.

  **Sam:** It's not just a label. It structures the deliberation. It shifts the burden of proof. If I say "I promised," I don't need to justify why I'm doing it. The burden is on the person saying "Don't do it" to show why this case is special. Without the generalization, every single decision starts from zero. That's not how moral learning works. We learn that promises matter *in general*, and then we learn the exceptions.

  **Maya:** But if the exception swallows the rule every time the context gets thick, haven't you just admitted I'm right? You're saying the principle is "Keep promises, unless context X, Y, or Z applies." But since context is infinitely variable, the "unless" clause is doing all the work. The principle is just the first three words of a sentence that never finishes.

  **Sam:** Not infinitely variable. We can list the standard defeaters. Coercion, impossibility, illegality. That's not "infinite." And look, if you deny the principle, you can't explain moral disagreement. If Leo talks to his sister, and she says "You have to keep the promise," and he says "I can't, it's illegal," they are arguing about how to weigh the principles. If you're right, they aren't arguing about principles at all; they're just pointing at different details of the landscape and grunting.

  **Maya:** They *are* pointing at details! That's exactly what they're doing. She's pointing at the deathbed scene. He's pointing at the park ranger station. They don't need a middleman called "Principle" to validate those features. The features themselves are the reasons. The "promise" isn't a reason *plus* a rule. The promise *is* the consideration. Whether it counts is up to the rest of the situation.

  **Sam:** But why does the promise count *usually*? Why isn't it random?

  **Maya:** Because human life has a shape. We need reliability. But that's an observation about human nature, not a normative law.

  **Sam:** That *is* a law, though. A general one. You're just refusing to call it a principle because you want to preserve the idea that every case is unique. But if "promises usually matter" is a true generalization, then I'm right. It's a default reason. In Leo's case, it loses. But if he *doesn't* feel bad about breaking it, we'd say he's morally deficient. Why? Because he's ignoring the default.

  **Maya:** We'd say he's deficient because he probably missed something in the context. Maybe he didn't care enough about his dad. Not because he violated a statute. Look, if I convince you that in *this* specific case, the promise provides zero reason to act—because the dad would hate the illegality—do you still insist there's a "defeated reason" floating around?

  **Sam:** Yes. Because the justification requires it. If Leo explains himself to the family, he says, "I know I promised, but the law made it impossible." He acknowledges the promise. He doesn't say, "The promise was irrelevant." He admits he owes the family an apology for breaking the promise, even if it was the right thing to do. That "apology" space? That's the principle doing work.

  **Maya:** The apology is for the disappointment, not for violating a moral law. There's a difference between "I'm sorry I couldn't do it" and "I'm sorry I did wrong." I'm saying he didn't do wrong. You're saying he did wrong, but it was excused.

  **Sam:** And I'm saying that distinction *is* the difference between particularism and generalism. You think if it's the right action, no moral residue remains. I think there's residue because a genuine claim was overridden. The principle marks the claim.

  **Maya:** But if the principle is just "there is a claim," and that claim can be silenced by context... then the principle isn't guiding you. It's just describing that you have a feeling.

  **Sam:** It guides by telling you what needs defeating. It tells you that you can't just ignore the promise. You have to actively weigh it against the law. If you were a particularist, you might just look at the law and think the promise never entered the room.

  **Maya:** I'd never say that. I'd say the promise enters the room, but its color changes depending on the lighting. You're saying it comes in wearing a red shirt that says "DO THIS," and sometimes someone tackles the guy in the red shirt. I'm saying sometimes the guy in the red shirt is actually on the other team.

  **Sam:** But you can't know which team he's on without knowing the general rule of the game first.

  **Maya:** You know the team by looking at the players, Sam. Not the rulebook.

  ***

  **Meta-Note on the Dialogue**

  **Standard Moves in the Debate:**
  *   **The Holism of Reasons (Maya):** The idea that a feature (like promise-keeping) can be a reason in one case and not in another (or even a reason against) is the core of Jonathan Dancy's particularism. This is standard fare.
  *   **The Default/Entitlement View (Sam):** Sam's defense of generalism as "default reasons" that shift the burden of proof is a standard response from moderate generalists (like Brad Hooker or some readings of W.D. Ross). It avoids rigid absolutism.
  *   **Moral Residue/Guilt:** Sam's argument that guilt or the need for an apology proves the existence of an overridden principle is a classic generalist move. Particularists typically respond (as Maya does) that guilt tracks disappointment or emotional loss, not necessarily moral wrongdoing.
  *   **The "What does it add?" Objection:** Maya's challenge regarding whether defeasible principles add anything over and above the particular considerations is the central epistemological challenge particularists pose to generalists.

  **My Spin / Contested Readings:**
  *   **Valence Switching vs. Clashing Principles:** In the dialogue, Maya argues that the promise might become a reason *against* acting (because the father valued lawfulness). While Dancy allows for valence switching, many generalists would argue this is just a case of two competing principles (Keep Promises vs. Honor Father's Character) rather than the "promise" feature itself changing polarity. I had Maya push this harder than some particularists might to force the "context" point.
  *   **Inductive Generalizations:** Sam describes principles as "learned inductively from particular cases." While many generalists accept this, some (especially rationalists) argue principles are known a priori. I framed Sam this way to make his view more empirically grounded and less "rule-bound," fitting your request for a "not boring" generalist.
  *   **The "Apology" Distinction:** Maya's distinction between apologizing for disappointment vs. apologizing for wrongdoing is a sharp particularist cut. In practice, this line is very blurry, and many philosophers argue the *need* for an apology *just is* evidence of a moral remainder (wrongdoing), not just sadness. I let Maya treat this as a settled distinction to keep the dialogue moving, but in the literature, this is a major point of contention.
