prompt: |-
  Write a dialogue between two people who disagree about whether moral principles are real. Person A is a particularist: she thinks there are no genuine moral principles, that any feature that counts as a reason in one situation can count against in another, and that trying to codify morality into rules is a mistake. Person B is a generalist, but not the boring kind who thinks there's a rule for everything — his line is that principles are default generalizations, learned inductively from particular cases, that mark which features usually count as reasons and can always be defeated. So he doesn't think the mere existence of exceptions is a problem for his view.

  Give them one concrete case to fight over instead of trading abstractions. Make it a promise made to someone who has since died — say, a promise to scatter a parent's ashes somewhere the person can no longer legally get to. A should use it to show that whether the promise gives a reason at all depends entirely on the surrounding context; B should use it to show that the default is doing real work even when it loses out.

  I want real back-and-forth — each one should answer the others actual point, not just repeat their own position. Neither should be a pushover, and B shouldn't be a strawman who just says 'follow the rules'. Get into the weeds a bit: at least let them push on whether a principle that's always defeasible actually adds anything over and above the sum of the particular considerations, and what principles would even be for if not for deriving conclusions.

  At the end, tack on a short note for me seperating the moves that are standard in this debate from the ones that are my own spin or genuinely contested — I don't want a contested reading dressed up as the consensus.

  Keep it casual, and don't bother with citations or reading lists, I'll add those myself.
reasoning: |-
  Here's a thinking process that leads to the dialogue and analysis:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Particularism (Person A) vs. Moral Generalism (Person B).
      *   **Person A (Particularist):** No genuine moral principles. Features can switch valence (reason for $\rightarrow$ reason against) depending on context. Codification is a mistake.
      *   **Person B (Generalist):** Principles are default generalizations (inductive). They mark usual reasons but are defeasible. Exceptions don't kill the principle.
      *   **Concrete Case:** A promise to scatter a deceased parent's ashes in a location that is now legally inaccessible.
      *   **Dynamics:** Real back-and-forth, no strawmen, deep dive into whether defeasible principles add anything over particular considerations.
      *   **Tone:** Casual, philosophical but grounded.
      *   **Ending:** A note separating standard moves from the user's specific spin/contested readings.

  2.  **Deconstruct the Philosophical Positions:**
      *   *Particularism (Dancy-style):* Holism of reasons. A feature (like "breaking a promise") isn't inherently bad; its moral valence depends on the holistic context. Principles are crutches or worse, distortions.
      *   *Generalism (Default/Entitlement-style):* Principles function as presumptions. "Promises ought to be kept" is true *ceteris paribus* (all else being equal). Even if overridden, the principle explains *why* we need a justification to break it. It provides a structure for deliberation.

  3.  **Develop the Case:**
      *   *Scenario:* Alex promised their dying father to scatter ashes at a specific spot (let's say, a protected nature reserve or private land now fenced off). It's now illegal to enter.
      *   *Conflict:* Keep the promise (illegal act) vs. Break the promise (legal compliance).
      *   *A's angle:* The "promise" feature might not even generate a reason here because the context (illegality, futility, respect for law) changes the valence of "promise-keeping."
      *   *B's angle:* The principle "keep promises" generates a *pro tanto* reason. It's outweighed by "obey law," but the reason exists. That's why Alex feels guilt.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Set the scene. Coffee shop or similar. Jump straight into the case.
      *   *Round 1:* A sets up the particularist view using the case. B counters with the default view.
      *   *Round 2:* A attacks the utility of the principle (if it's always defeasible, what does it *do*?). B defends the structural role of principles (shifting burdens of proof).
      *   *Round 3:* Deep dive into "valence switching." A argues the promise *isn't* a reason here. B argues it *is* a reason, just a losing one.
      *   *Closing:* Stalemate but respectful.
      *   *Meta-Note:* Analyze the dialogue for standard vs. novel moves.

  5.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Check:* Is B too rigid? *Correction:* Make sure B emphasizes that the principle *loses* in this case. B isn't saying "break the law to keep the promise." B is saying "the promise still matters morally, even if you don't do it."
      *   *Check:* Is A too nihilistic? *Correction:* A isn't saying "do whatever." A is saying "look at the whole picture, not a rule."
      *   *Check:* The "what do principles add?" objection. This is crucial. A needs to ask: "If the principle never decides the outcome, why have it?" B needs to answer: "It organizes the deliberation."
      *   *Tone:* Keep it conversational. Use contractions, interruptions, rhetorical questions.

  6.  **Writing the Dialogue (Mental Simulation):**
      *   *A:* "See, in this case, 'promise' doesn't even count."
      *   *B:* "No, it counts, it just gets beaten by 'law'."
      *   *A:* "If it gets beaten every time context changes, it's not a principle, it's a observation."
      *   *B:* "It's a default. It explains the guilt."
      *   *A:* "Guilt is just a reaction, not a guide."
      *   *B:* "It shows there's a residue."

      *(Self-Correction)*: Make sure they tackle the "valence switching" specifically. A should argue that in *this* context, the promise might actually be a reason *not* to act (e.g., respecting the father's law-abiding nature). B should argue that's a clash of principles, not a switch in valence.

  7.  **Final Polish:** Check against constraints.
      *   Concrete case? Yes (ashes/illegal land).
      *   A = Particularist (holism)? Yes.
      *   B = Generalist (default principles)? Yes.
      *   No citations? Yes.
      *   Meta-note included? Yes.

  8.  **Drafting the Meta-Note:**
      *   Identify standard Dancy vs. Hooker/Brooks type debates.
      *   Identify where the prompt's specific definition of Generalism (inductive default generalizations) shapes the dialogue.
      *   Note the "what do they add?" objection is a classic particularist challenge.
      *   Note the "residue/guilt" argument is a standard generalist defense.

  9.  **Final Review:** Does it sound like two smart friends arguing, not a textbook? *Adjust phrasing to be more colloquial.* (e.g., "Here's the thing," "Wait, hang on.")

