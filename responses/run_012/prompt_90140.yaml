answer: |-
  1. **Mimics and the Conditional Analysis**
  You've argued that counterfactual analyses of dispositions fail, but I'm curious where you think the bleeding is worst. With mimics—where something lacks the disposition but satisfies the conditional—do you think this failure of sufficiency damages the project more than the failure of necessity we see in finks and masks?
  *   **Follow-up:** If you say sufficiency is the real killer, does that imply we can salvage a necessary condition for dispositions, or must we abandon the conditional framework entirely?
  *   **Aim:** To determine if she is rejecting the conditional analysis partially or wholly.

  2. **The Electro-Fink Case**
  Let's look squarely at the standard electro-fink: a live wire where a device cuts the power the instant it is touched. On your view, is the best reading that the disposition to conduct is destroyed by the stimulus, or that the disposition is simply not present at the relevant time?
  *   **Follow-up:** If you say it's not present, how do we distinguish that intrinsic absence from an extrinsic preventer without smuggling the counterfactual back in?
  *   **Aim:** To challenge the intrinsic/extrinsic boundary she relies on to save the disposition.

  3. **Masking vs. Finking**
  Now consider the masked sugar cube dissolved in water but coated in plastic, or the fragile glass packed in foam. Do you think masking is genuinely a different metaphysical problem from finking, or is it just the same problem seen from the other end?
  *   **Follow-up:** If you say they are distinct, why does the underlying modal failure—the manifestation not occurring—look identical in both cases?
  *   **Aim:** To press whether the distinction is metaphysical or merely pragmatic.

  4. **Host Case: The Intention-Sensor Wire**
  I want to test your taxonomy with a new case: a wire that is live whenever no one intends to touch it, but a sensor cuts the current the moment anyone forms the intention to touch, restoring it afterwards. Is this a fink, a disposition that was never present at the relevant time, or does the vocabulary just break down here?
  *   **Follow-up:** If you say the vocabulary breaks, doesn't that suggest dispositions aren't as primitive or ubiquitous as your view requires?
  *   **Aim:** To test the limits of the "primitive disposition" vocabulary under psychological triggers.

  5. **Host Case: The Polymer Cube**
  Here's another: a cube rigged so that contact with water instantly coats it in a polymer and rearranges its lattice, so it's unclear whether the solubility was masked or removed. If a single case can be both at once, is the fink/mask distinction doing any real work, or is it a distinction that only looks sharp in textbook examples?
  *   **Follow-up:** If you say the distinction still holds, what non-circular criterion are we using to sort this case?
  *   **Aim:** To undermine the utility of the fink/mask taxonomy in complex causal chains.

  6. **Directedness and Aboutness**
  You treat dispositions as essentially directed at their manifestations. If a power is directed toward *X*, does that imply a relation to *X* even when *X* does not exist, and how do you avoid making dispositions relational rather than intrinsic?
  *   **Follow-up:** If you deny they are relational, what is the ontological ground of this "directedness" if not a relation to a possible state of affairs?
  *   **Aim:** To force a commitment on the ontology of non-existent manifestations.

  7. **The Necessity of Laws**
  A major consequence of your view is that laws of nature come out necessary rather than contingent. If the laws are necessary, does that mean a world with the same properties but different laws is metaphysically impossible, or just inconceivable?
  *   **Follow-up:** If it's metaphysically impossible, how do you explain the apparent contingency we find in scientific practice without calling it an illusion?
  *   **Aim:** To create tension between her metaphysics and scientific methodology.

  8. **The Regress of Pure Powers**
  There's a worry that if every property is a power grounded in further powers, you never arrive at anything that actually happens—a regress of potentiality. Do you think this regress is vicious, or does it bottom out?
  *   **Follow-up:** If it bottoms out, does that force you to accept a categorical base, and if so, doesn't accepting one collapse you into the Humean picture you're rejecting?
  *   **Aim:** To trap her between an infinite regress and a collapse into Humeanism.

  9. **Dispositional Belief**
  Half my audience comes from philosophy of mind, so I have to ask: does a dispositionalist account of belief survive this same treatment? Think of a belief that vanishes the moment you're asked about it, or one that's really there but always masked by a stronger desire.
  *   **Follow-up:** If you say it survives, how do you handle self-deception without resorting to ad-hoc masking claims?
  *   **Aim:** To test the view's portability to mental states and its vulnerability to ad-hocery.

  10. **Giving Up Essentialism**
  To close, I want to ask what would have to be true for you to give up the essentialist part of your package—the claim that properties necessarily dictate their manifestations. Do you think anything we discussed today could do it?
  *   **Follow-up:** If you say nothing could, are you worried that makes the view dogmatic rather than philosophical?
  *   **Aim:** To question the falsifiability and philosophical status of her core commitment.
