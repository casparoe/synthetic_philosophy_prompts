answer: |-
  **Referee Report**

  **Paper Title:** [Untitled Draft on the Surprise Exam Paradox]
  **Recommendation:** Revise and Resubmit (with significant structural clarifications)

  **General Assessment**
  The manuscript tackles a canonical problem in formal epistemology with a potentially fruitful distinction: treating the teacher's announcement not as a static proposition but as an "announcement-schema" (a function from credence distributions to truth values). The core intuition—that the paradox stems from a category mistake regarding the logical type of the announcement—is compelling and aligns with dynamic intuitions often left implicit in the literature. However, in its current form, the argument risks conflating this novel terminology with established frameworks in Dynamic Epistemic Logic (DEL) and self-referential analyses (e.g., Chow 1998). To secure the paper's contribution, you must demonstrate that the "schema" apparatus does more than rename the problem of epistemic update. Below, I detail four areas where the argument requires tightening to avoid collapsing into familiar territory or overreaching its formal bounds.

  **1. The Proposition/Schema Distinction: Novelty or Renaming?**
  You argue that treating the announcement as a fixed proposition is the root error. A sharp reader will immediately ask how this differs from the standard self-referential analysis (where the announcement is $E \land \neg K E$) or the DEL approach (where announcements are actions that update the model).
  *   **The Concern:** If an "announcement-schema" is simply a proposition containing epistemic operators whose truth conditions depend on the agent's state, it *is* a proposition, albeit a complex one. If it is a function from credences to truth values, this looks formally identical to a context-sensitive proposition or a dynamic update function.
  *   **The Fix:** You need to formalize the "schema." Does it lack a truth value *simpliciter* until applied to a state? If so, how does this block the formation of the common knowledge required for the induction without simply stipulating that $K A$ is impossible? You must show that the schema reading explains *why* the announcement cannot be common knowledge, rather than just asserting that it cannot. If the distinction collapses into "the announcement is a dynamic update," you should engage directly with Baltag or van Benthem to locate your specific contribution.

  **2. Circularity and the Common Knowledge Premise**
  You claim the backward induction's major premise is inconsistent with the announcement because the induction requires the announcement to be common knowledge (a fixed proposition), while "surprise" denies that stability. Your colleague's worry about circularity is well-founded.
  *   **The Concern:** To argue that the induction fails because it assumes $A$ is a fixed proposition seems to presuppose the conclusion that $A$ is *not* a fixed proposition. You write that you need not say the announcement is false or the students irrational, but if you rule out the common knowledge assumption by fiat of the "schema" definition, you may be begging the question against the standard reconstruction.
  *   **The Fix:** Frame this as a **fixed-point problem**. The induction seeks a fixed point where the students know $A$ and $A$ remains true. Your argument should be that the schema function has no such fixed point. This moves the claim from "they shouldn't assume it's fixed" to "there is no stable state where it is fixed." This avoids circularity by grounding the inconsistency in the formal properties of the function rather than a semantic stipulation.

  **3. The Moving-Clause Variant**
  Your variant ("If you prove the day, I will move it") is intuitively powerful but logically precarious. Your colleague suggests it is the original paradox dressed up; I suspect she is partially right, but the variant can be salvaged if positioned correctly.
  *   **The Concern:** In the standard paradox, the "moving" is logical (if predicted, it's not a surprise, so the announcement is false). In your variant, the moving is causal/pragmatic. This shifts the paradox from epistemology to game theory. If the teacher *can* move it, the announcement is no longer a prediction about the week's structure but a commitment to a strategy.
  *   **The Fix:** Don't claim this variant solves the original paradox. Instead, argue that it **externalizes the dependency** that the schema reading claims is implicit. The value of the variant is not that it creates a new paradox, but that it makes the functional dependence of the announcement's truth on the students' state explicit. However, you must acknowledge that this invites a game-theoretic analysis (e.g., Sorensen or rational choice models). If you can show that the schema reading handles *both* the logical (original) and causal (variant) cases uniformly, that is a significant strength. If not, the variant may be a distraction.

  **4. Probabilistic Overreach**
  You claim the induction fails for *any* non-degenerate credence distribution. This is the most vulnerable part of the draft.
  *   **The Concern:** Probabilistic versions of the SEP (e.g., Williamson, Arntzenius) often survive backward induction if "surprise" is defined as probability below a threshold (e.g., $P(day) < 0.5$). If your schema model implies the induction fails for *any* distribution, you need a rigorous proof. Merely asserting that the schema disrupts the induction is insufficient; probabilistic updating can often accommodate functional dependencies.
  *   **The Fix:** Temper this claim. Does the induction fail, or does it merely fail to yield a *certain* conclusion? If you are working with credences, the conclusion "no exam can occur" translates to "credence in exam should be 0." Showing that the schema forces credence to 0 is a strong claim that requires a formal lemma. If you cannot provide it, restrict the scope to the binary knowledge case or explain why the probabilistic extension is heuristic rather than formal.

  **Summary Recommendation**
  The "announcement-schema" idea has merit, particularly in its potential to unify the logical and causal variants of the paradox. However, the paper currently relies too heavily on intuitive descriptions of the schema rather than its formal behavior.
  1.  **Formalize the Schema:** Define the function explicitly. Show where the fixed point breaks.
  2.  **Engage DEL:** Acknowledge the similarity to dynamic update and distinguish your view.
  3.  **Soften the Probabilistic Claim:** Unless you have a proof, treat the probabilistic extension as a conjecture or limit it to specific updating rules.
  4.  **Clarify the Variant:** Position it as an explication of the dependency, not a new paradox.

  If you can ground the "schema" notion in a way that avoids the charge of merely renaming self-reference, this will be a valuable contribution to the workshop.

  **Confidential Note to Author:**
  As a fourth-year student, you are right to worry about "reinventing the wheel." The line between a novel ontological distinction (proposition vs. schema) and a notational variant (static vs. dynamic proposition) is thin. Your best defense is to show that the schema reading yields a different *diagnosis* of the error (category mistake vs. logical inconsistency). Lean into the "category mistake" angle; it distinguishes you from the Chow/Quine self-reference line. Good luck with the revision.
