answer: |-
  Dear friend,

  It is fascinating to hear that your overnight debate pushed you toward deflationism, as that is often where one ends up after exhausting the metaphysical excesses of correspondence and the circularity risks of coherence. You have articulated a classic disquotational or minimalist stance, one that treats truth as a logical device rather than a robust property of nature or mind. You asked for a map of this position's exposure, wanting to know what would have to be true for your view to be false, and specifically how it handles the technical and normative pressures that inflationists bring to bear. I will try to walk you through the vulnerabilities as a committed deflationist might concede them, ranking the threats from those that require mere adjustment to those that threaten to collapse the view entirely.

  The most technically precise challenge you face comes from the conservativeness argument. You mentioned the scenario where adding a truth predicate to a base theory yields new theorems about the original vocabulary, and this is often considered the strongest formal objection to deflationism. If truth is merely a logical device for generalization and endorsement, it should be conservative over the base theory, meaning it should not allow you to prove any new sentences in the original language that you could not prove before. However, results in mathematical logic suggest that adding a truth predicate to arithmetic allows us to prove the consistency of arithmetic, which arithmetic itself cannot do by Gödel's second incompleteness theorem. If deflationism entails that truth is conservative, and truth is not conservative, then deflationism is false. A committed deflationist like Hartry Field has conceded that this is a serious pressure point, often forcing a retreat to the claim that deflationism applies only to semantic truth or that we need a distinction between deflationary truth and a substantive notion required for mathematics. If you cannot explain why truth allows for these new derivations without attributing some substantive weight to the predicate, this moves from an awkward complication to a potentially fatal objection, because it suggests the predicate is doing more than just mimicking assertion; it is generating content. However, many deflationists treat this as a friendly extension, arguing that the logical rules governing truth are what generate the theorems, not a substantive property, so whether this is decisive depends on whether you define deflationism by the conservativeness constraint itself or by the lack of a robust property.

  Closely related to this is the issue of logical inference and mixed vocabularies. You asked whether the truth predicate is indispensable for stating the correctness conditions of logical inference, particularly in mixed inferences where premises might involve moral or modal claims alongside factual ones. Inflationists argue that validity requires a preservation of truth, and if truth is different in kind across these domains, a single deflationary predicate cannot do the work. If you cannot account for the validity of an argument that moves from factual premises to a moral conclusion using a single truth predicate without smuggling in a substantive property that unifies them, your view struggles to explain logical normativity. Deflationists often respond by shifting the burden to the logical constants themselves rather than the truth predicate, but if you concede that truth is needed to state validity, and that validity is a substantive relation, you risk inflating truth again. This is less fatal than the conservativeness argument but requires careful maneuvering to avoid changing the subject. You must show that the generality provided by the truth predicate is sufficient to capture validity without needing a underlying nature of truth that persists across domains.

  Then there is the expressive work regarding blind ascriptions and generalizations, which is supposedly the deflationist's home turf. You suspect the predicate is primarily for expressing generalizations we could not otherwise state, such as saying everything the Pope says is true without enumerating his statements. The exposure here lies in whether the equivalence schema can handle these cases without presupposing a substantive property. If I say What Fermat said is true, I am endorsing a proposition I cannot currently state. Inflationists argue that for this endorsement to be meaningful, there must be a property that Fermat's proposition possesses which my endorsement tracks. If deflationism cannot explain the cognitive significance of blind ascriptions without relying on the notion that the speaker grasps a substantive property of truth, then the expressive advantage collapses. However, most deflationists consider this a manageable awkwardness rather than a defeater, as they can argue that the anaphoric machinery of the truth predicate allows us to latch onto the content without needing to know the content fully, provided the logical rules are in place. The real test is whether this works for quantified statements over infinite domains, and while there are technical hurdles, this is generally where deflationism remains strongest.

  The Liar paradox and its family present a different kind of threat, one that strikes at the heart of the equivalence schema you rely on. You noted that the content of calling a proposition true is given by the equivalence between asserting it is true and asserting it. But if the schema is unrestricted, it leads to contradiction via the Liar sentence. Therefore, the schema must be restricted. The exposure here is that any principled restriction on the schema tends to rely on substantive notions, such as groundedness or semantic status, which looks suspiciously like the inflationary property you sought to avoid. If you have to say that the Liar sentence is not true because it lacks a certain substantive semantic property, you are no longer a pure deflationist. A committed deflationist must concede that the unrestricted schema is untenable, but the fatal blow would be if the only way to restrict it requires a theory of truth that is itself inflationary. Most deflationists accept this as a costly bullet to bite, adopting paracomplete or paraconsistent logics, but if the restriction mechanism reintroduces the very property you eliminated, the view collapses into a disguised inflationism. This is a high-risk area, but many consider it a technical problem solvable within a deflationary framework rather than a conceptual refutation.

  Your most persuasive worry, however, concerns the normative and explanatory role of truth in inquiry. You feel that truth has a normativity that the equivalence schema leaves untouched, specifically the thought that we ought to believe what is true and that truth is the aim of assertion. This is perhaps the most significant philosophical exposure for your view. If truth is merely a device for endorsement, the norm we ought to believe what is true collapses into we ought to believe p iff p, which seems to lose the normative force of the aim of inquiry. Inflationists argue that truth explains why successful action correlates with true belief; true beliefs guide us successfully because they match the world. If you deny truth is a substantive property, you cannot use it in causal or explanatory explanations. A deflationist might respond that the explanation lies in the causal connection between belief and world, not the property of truth itself, but this risks redescribing the phenomenon rather than explaining it. If you cannot account for why truth is valuable or why it guides inquiry without invoking a substantive property, you may be forced to concede that deflationism is incomplete. This is not necessarily fatal if you are willing to become an expressivist about the normativity, arguing that calling truth an aim is just expressing our commitment to inquiry, but if you want to maintain that truth is genuinely normative, this is a major vulnerability. It ranks high on the list of defeaters because it strikes at the utility of the concept; if truth explains nothing and norms nothing, why keep the concept at all beyond logical convenience?

  Regarding predictions, you asked what your view predicts that correspondence or coherence views do not. Deflationism does not make empirical predictions in the scientific sense; rather, it makes metaphysical predictions. It predicts that no investigation into the nature of reality will uncover a property of truth that plays a causal role or unifies true propositions beyond their logical behavior. It predicts that attempts to naturalize truth will fail or be unnecessary. Correspondence theories predict that we might find a structural relation between language and world that explains truth. If neuroscience or physics were to uncover a robust property that functions exactly as the correspondence theorist's truth property, deflationism would be in trouble, but this is unlikely. The test is largely philosophical coherence. However, if inquiry continues to rely on truth as an explanatory posit in semantics, psychology, or ethics, and deflationism cannot accommodate this without expansion, the view becomes increasingly insulated.

  This brings us to your question about insulation and whether retreating to a theory of the predicate rather than the property collapses the view into quietism or expressivism. There is a genuine risk here. If deflationists respond to every objection by saying we are only talking about the word true and not the property, critics will charge that this is a change of subject. We care about truth, not just the predicate. If the view insulates itself by denying that there is a property to discuss, it risks becoming a linguistic thesis that ignores the conceptual role truth plays in our lives. A committed deflationist should concede that if the view requires such heavy qualification that it can no longer engage with the substantive questions about belief and reality, it has collapsed into quietism. Whether this is a problem depends on whether you think philosophy should explain concepts or dissolve them. If you are comfortable with quietism, the insulation is a feature; if you think truth has a job to do, it is a bug. This retreat is often where deflationism becomes least satisfying to its opponents, as it seems to deny the datum that truth is important.

  To rank these defeaters, I would say the conservativeness argument is the most technically fatal if you hold strictly to the claim that truth adds no content, as the mathematical results are hard to deny. The normative/explanatory role is the most philosophically damaging, as it undermines the value of the concept you are defending. The Liar paradox is a severe logical constraint but manageable with logical revision. The issues around mixed inference and blind ascriptions are awkward but likely solvable within the framework. The insulation against quietism is a structural weakness that depends on your philosophical goals. If you find yourself unable to explain why truth matters for inquiry without smuggling in a substantive property, you are likely facing a genuine defeater rather than just a rival idiom. The sense that truth guides us suggests it is more than a logical device; it is a standard. If deflationism cannot account for the standard without making it substantive, then the view may be well insulated from criticism only because it has retreated from the field of play. You should be moved by the normative argument most of all, because if truth is not an aim, deflationism leaves us with a logic of assertion but no ethics of belief, and that is a high price to pay for parsimony.

  I hope this helps map the terrain for you. The position is resilient but carries significant costs in explanatory power. If you can live with the idea that truth explains nothing and norms nothing beyond our own commitments, you can hold the line. If not, you may need to let some substance back in.

  Best regards,

  Your friend
