answer: |-
  ### 1. Exam Question

  **Question 4 (20 Marks, 45 Minutes)**

  Table 1 presents data from a observational study evaluating a new drug (Treatment = 1) versus standard care (Treatment = 0) on patient survival (Outcome = 1). Patients are stratified by baseline disease severity (Stratum Z = 0 for mild, Z = 1 for severe).

  **Table 1: Counts by Treatment, Outcome, and Stratum**

  | Stratum (Z) | Treatment (X) | Outcome = 1 (Event) | Outcome = 0 (No Event) | Total |
  | :--- | :--- | :--- | :--- | :--- |
  | **Mild (0)** | Control (0) | 10 | 90 | 100 |
  | | Treat (1) | 1 | 19 | 20 |
  | **Severe (1)** | Control (0) | 10 | 10 | 20 |
  | | Treat (1) | 40 | 60 | 100 |

  (a) Calculate the Crude and Stratum-specific Odds Ratios (OR) and Risk Differences (RD). Demonstrate explicitly that a reversal occurs upon aggregation. (4 marks)

  (b) Assume Z is a pre-treatment confounder. Based on your calculations, which estimate represents the causal effect of the treatment? Justify your answer using the data distribution. (4 marks)

  (c) Suppose instead that Z was not a baseline characteristic but a post-treatment indicator of hospitalization (caused by both Treatment and Outcome). How would this change your recommendation regarding stratification? Explain the bias mechanism. (4 marks)

  (d) A colleague argues: "Whenever aggregate and subgroup estimates differ, you must always trust the subgroups." Critique this statement. In your response, address (i) the role of non-collapsibility when using Odds Ratios versus Risk Differences, and (ii) the specific conditions under which trusting the subgroups would be incorrect. Define the estimand (marginal vs. conditional) relevant to each scenario. (8 marks)

  ***

  ### 2. Model Answer

  **Part (a): Arithmetic and Reversal**
  First, we calculate the stratum-specific effects.
  In the Mild stratum (Z=0):
  Risk (Control) = 10/100 = 0.10. Risk (Treat) = 1/20 = 0.05.
  $RD_{0} = 0.05 - 0.10 = -0.05$.
  $OR_{0} = (1 \times 90) / (19 \times 10) = 90 / 190 \approx 0.47$.

  In the Severe stratum (Z=1):
  Risk (Control) = 10/20 = 0.50. Risk (Treat) = 40/100 = 0.40.
  $RD_{1} = 0.40 - 0.50 = -0.10$.
  $OR_{1} = (40 \times 10) / (60 \times 10) = 400 / 600 \approx 0.67$.

  In both strata, the treatment reduces risk (RD < 0, OR < 1).

  Now, the Crude (Aggregate) table:
  Total Control: 120 patients, 20 events. Risk = 20/120 $\approx$ 0.167.
  Total Treat: 120 patients, 41 events. Risk = 41/120 $\approx$ 0.342.
  $RD_{crude} = 0.342 - 0.167 = +0.175$.
  $OR_{crude} = (41 \times 100) / (79 \times 20) = 4100 / 1580 \approx 2.59$.

  The crude estimates suggest the treatment is harmful (RD > 0, OR > 1), while stratum-specific estimates suggest it is beneficial. This is a genuine reversal.

  **Part (b): Confounding Structure**
  If Z is a pre-treatment confounder, we must adjust for it. The data shows strong confounding: patients in the Severe stratum (higher baseline risk) were much more likely to receive Treatment (100/120 treated were severe vs. 20/120 controls). The crude association is biased because the treatment group is sicker at baseline. The stratum-specific estimates (or a standardized marginal estimate derived from them) represent the causal effect, indicating the treatment is beneficial.

  **Part (c): Collider Bias**
  If Z is a consequence of both Treatment and Outcome (a collider), conditioning on Z induces a spurious association between Treatment and Outcome even if none exists causally. In this scenario, stratifying by Z would introduce bias. The correct approach would be to trust the crude (unadjusted) estimate, as conditioning on a collider opens a non-causal path. Thus, the recommendation flips: do not stratify.

  **Part (d): Critique of "Always Trust Subgroups"**
  The colleague's heuristic is incorrect for two reasons. First, regarding non-collapsibility: Odds Ratios are non-collapsible. Even in the absence of confounding (e.g., if treatment were balanced across strata), the crude OR need not equal the weighted average of stratum-specific ORs. The crude OR can differ from adjusted ORs purely due to mathematical properties of the ratio, whereas Risk Differences are collapsible. If the RDs did not reverse but the ORs did, the reversal would be an artefact of the measure, not confounding.

  Second, regarding causal structure: Trusting subgroups is only correct if Z is a confounder. As noted in (c), if Z is a collider, stratifying creates bias. Furthermore, we must define the estimand. If the question is "What is the effect for a random patient from the population?" (Marginal/Population Average Treatment Effect), the crude risk difference (standardized) is often the target. If the question is "What is the effect for a patient with specific severity Z?" (Conditional Effect), the stratum-specific estimate is the target. Blindly trusting subgroups ignores both the causal role of Z and the specific public health question being asked.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20**

  **1. Correct Calculation of Reversal (4 Marks)**
  *   **Requirement:** Correctly computes Crude and Stratum-specific ORs and RDs. Explicitly shows signs flipping (e.g., Stratum OR < 1, Crude OR > 1).
  *   **Common Error:** Candidates calculate only ORs and ignore RDs, missing the opportunity to discuss non-collapsibility later.

  **2. Identification of Confounding Mechanism (4 Marks)**
  *   **Requirement:** Identifies Z as a confounder in Part (b) by noting the association between Z and Treatment (imbalance) and Z and Outcome (baseline risk). Selects adjusted estimate as causal.
  *   **Common Error:** Candidates claim the crude estimate is always biased without referencing the specific imbalance in the provided table.

  **3. Explanation of Collider Bias (4 Marks)**
  *   **Requirement:** Correctly states that if Z is a collider, stratification induces bias. Recommends using the crude estimate instead.
  *   **Common Error:** Candidates treat Z as a confounder regardless of the temporal change described in Part (c), failing to adjust the recommendation.

  **4. Discussion of Non-Collapsibility (4 Marks)**
  *   **Requirement:** Explains that ORs are non-collapsible (can differ without confounding) while RDs are collapsible. Notes that reversal in OR alone may be mathematical, not causal.
  *   **Common Error:** Candidates assert that any difference between crude and adjusted ORs implies confounding, ignoring measure artefacts.

  **5. Estimand and Validity Conditions (4 Marks)**
  *   **Requirement:** Defines the estimand (Marginal vs. Conditional). States that trusting subgroups is only valid if Z is a confounder *and* the conditional effect is the target. Explicitly notes it is wrong if Z is a collider or if the marginal effect is required.
  *   **Common Error:** Candidates give a blanket rule (e.g., "always adjust") without linking the choice to the causal question or estimand.

  **A/B Differentiation Criteria:**
  *   **B Band (10-14 marks):** Successfully calculates the reversal and identifies confounding in Part (b). Discusses collider bias or non-collapsibility superficially but treats them as isolated facts. Fails to link the choice of estimate to the specific estimand (marginal vs. conditional).
  *   **A Band (15-20 marks):** Achieves all calculation points accurately. In Part (d), explicitly articulates that "trusting subgroups" is conditional on Z being a confounder *and* the conditional estimand being the goal. Distinguishes clearly between bias (confounding/collider) and mathematical artefact (non-collapsibility), noting that RDs would behave differently than ORs in the absence of confounding.
