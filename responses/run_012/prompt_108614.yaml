answer: |-
  This is a classic philosophical friction point. Your roommate is wielding a phrase that sounds like a simple complaint about quality of life ("life sucks"), but in the context of antinatalist philosophy, it is actually a structural claim about harm, existence, and morality. The reason your brain is breaking is that he is sliding between different meanings of "better" and "tragedy" depending on which point he wants to win.

  Here is a menu of the precise claims hidden inside "better never to have been," broken down by the three questions you asked. I have attached a judgment to each reading (Trivial, Substantive/Defensible, or Confused) and mapped them to his behavior.

  ### 1. The Comparison Problem: Existing vs. Not Existing
  *The core logical hurdle: How do you compare a state of being alive with a state of never having existed?*

  **Reading A: The "Deprived Subject" Claim**
  *   **The Claim:** "You, as a specific person, would be better off if you had never been born."
  *   **How it works:** This treats "never being born" as a place or state you could have gone to instead, where you would exist in a happier state of non-existence.
  *   **Judgment:** **Confused.** This is metaphysically incoherent. If you are never born, there is no "you" to be better off. You cannot compare the welfare of an existing person to the welfare of a non-existent person, because the latter has no welfare to measure.
  *   **Does it license his moves?** It licenses the attack on your sister (her kid will be worse off), but it fails to explain his own life satisfaction (if he is happy, how is he worse off?). It also makes the miscarriage claim hard to defend (if the fetus *would* have been a person, didn't it lose out?).

  **Reading B: The "Impersonal State of Affairs" Claim**
  *   **The Claim:** "A world containing you is worse than a world containing no you."
  *   **How it works:** This removes the subject. It doesn't say *you* are harmed; it says the *universe* is worse off by your addition. It measures value globally, not individually.
  *   **Judgment:** **Substantive but Cold.** It avoids the metaphysical error of Reading A, but it divorces the claim from human experience. It turns "better" into an abstract accounting of value units in the cosmos.
  *   **Does it license his moves?** It licenses the miscarriage claim (the world isn't worse without that fetus). It struggles with the sister claim (why is it *wrong* for her to make the world slightly worse?) and his own life claim (why does he care about the cosmic score if his life is good?).

  **Reading C: The "Asymmetry of Harm" Claim (The Strongest Candidate)**
  *   **The Claim:** "The presence of pain is bad; the absence of pain is good (even if no one enjoys that absence). The presence of pleasure is good; the absence of pleasure is *not bad* (if no one is deprived of it)."
  *   **How it works:** This is the engine of modern antinatalism. It argues that we have a moral duty to avoid suffering, but no moral duty to create happy people. Therefore, creating a person introduces the *risk* of harm (which is bad), while not creating them secures the *benefit* of no harm (which is good), even if they miss out on pleasure.
  *   **Judgment:** **Substantive and Defensible.** This is the only reading that logically holds together without metaphysical errors. It redefines "better" not as "more happiness" but as "avoidance of necessary harm."
  *   **Does it license his moves?** Yes. This is the only reading that allows all three of his positions to coexist.

  ---

  ### 2. Can it be true for everyone without their life being "bad"?
  *Your roommate says his life is going well. How can "better never to have been" apply to him?*

  **Reading A: The "Net Negative" Threshold**
  *   **The Claim:** "Better never to have been" only applies to lives that contain more suffering than happiness.
  *   **How it works:** This is the common-sense view. If your life is mostly misery, you shouldn't have been born. If it's mostly happy, you should have.
  *   **Judgment:** **Trivial.** Everyone agrees with this. But your roommate is using the phrase universally ("better never to have been" as a slogan), which suggests he rejects this reading.
  *   **Does it license his moves?** No. If he thinks his life is good, this reading forces him to admit *he* should not have used the slogan on himself. It contradicts his third move.

  **Reading B: The "Risk and Consent" Claim**
  *   **The Claim:** Existence is a gamble with necessary harms (death, disease, grief). Imposing this gamble without consent is the harm, regardless of the outcome.
  *   **How it works:** "Better" measures the *safety* of the position, not the *quality* of the experience. Being unborn is "safe" (zero risk of harm). Being born is "risky." Even if you win the lottery of life, it was still risky to put you in the game.
  *   **Judgment:** **Substantive.** This shifts the metric from "welfare" (how happy are you?) to "rights/ethics" (was it okay to start you?).
  *   **Does it license his moves?** Yes. It allows him to say, "My life is great (I won the gamble), but it was wrong to gamble with me (better never to have been)."

  **Reading C: The "Structural Deficit" Claim**
  *   **The Claim:** Pleasure is merely the relief of need, but pain is a positive evil. Therefore, even a "good" life is structurally composed of managing deficits.
  *   **How it works:** "Better" measures the *nature* of the experience. Hunger is bad; eating is just the removal of hunger. So, a life of eating is just a life of managing the bad state of hunger. Non-existence has no hunger.
  *   **Judgment:** **Defensible but Debatable.** This is a hedonic claim about how pleasure works. It's philosophically robust but psychologically contentious.
  *   **Does it license his moves?** Yes. It allows him to say his life is "going well" (he is managing deficits successfully) while maintaining non-existence is preferable (no deficits to manage).

  ---

  ### 3. Mapping the Readings to His Three Moves
  *Here is which claim he is secretly deploying in each situation.*

  | His Move | What he needs the phrase to mean | Which Reading licenses this? | Is the move consistent? |
  | :--- | :--- | :--- | :--- |
  | **1. Criticizing your sister's pregnancy** | Procreation is a moral harm inflicted on the new child. | **Asymmetry of Harm** or **Risk/Consent**. He is claiming she is imposing a burden. | **Consistent** *if* he believes procreation is always wrong. |
  | **2. Miscarriage is not a tragedy** | Non-existence is not a loss. There is no subject to be deprived of a future. | **Asymmetry of Harm**. (Absence of pleasure is not bad). | **Consistent** logically, but **Emotionally Confused**. He is conflating "tragedy for the fetus" (which he denies) with "tragedy for the family" (which he ignores). |
  | **3. His own life is good, but slogan still holds** | The slogan is about the *act of birth*, not the *quality of life*. | **Risk/Consent**. He is saying, "I'm glad I'm here, but I shouldn't have been forced into this position." | **Consistent** only under the Risk/Consent reading. If he means "Net Negative," he is contradicting himself. |

  ---

  ### Diagnosis: What is he actually doing?

  Your roommate is almost certainly operating on **Reading C from Section 1 (The Asymmetry of Harm)** combined with **Reading B from Section 2 (Risk/Consent).**

  He is not saying "Life is miserable." He is saying "Coming into existence is an imposition of harm."

  *   **Why he attacks your sister:** He views procreation as the infliction of risk/harm.
  *   **Why he dismisses the miscarriage:** Under the Asymmetry view, a fetus that never exists is not deprived of anything good. (Note: He is being insensitive to the parents' grief, which is a separate tragedy, but logically, on his view, the fetus itself lost nothing).
  *   **Why he loves his life:** He acknowledges that once you *are* existing, you can find meaning and pleasure. Antinatalism is not necessarily suicidal; it is anti-*starting*. He can enjoy the party while believing no one should have been invited.

  **The Verdict on His Usage:**
  He is being **philosophically consistent but rhetorically sloppy.**
  *   **Substantive/Defensible:** The core logic (Asymmetry) is a recognized philosophical position. It is possible to hold that life is good *for the living* but that starting life is wrong.
  *   **Confused/Problematic:** He is using one sentence ("better never to have been") to do three different jobs (moral condemnation, metaphysical claim about loss, and personal reflection). This creates the illusion of contradiction.
  *   **The Trap:** When he tells your sister she is "doing something wrong," he is making a **moral claim**. When he talks about the miscarriage, he is making a **metaphysical claim** (about who exists to suffer loss). When he talks about his own life, he is making a **phenomenological claim** (about how life feels). He is treating these as the same claim, which is why you feel like he's contradicting himself.

  **How to talk to him:**
  Don't ask him if life is "good" or "bad." Ask him: *"When you say 'better,' are you measuring happiness, or are you measuring harm avoidance?"*
  *   If he says **happiness**, he is contradicting himself about his own life.
  *   If he says **harm avoidance**, he is consistent, but you can push back on whether avoiding harm is the *only* thing that matters (e.g., "Is safety the only metric for a life, or is potential meaning worth the risk?").

  Regarding the miscarriage comment: You can grant his logic (the fetus isn't suffering) while rejecting his conclusion (it is still a tragedy for the community and the parents who wanted that life). He is conflating "tragedy for the subject" with "tragedy period."
