          *   Advice on how to talk to him.

  7.  **Refine the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to get bogged down in naming David Benatar explicitly as the *only* source, though the phrase is his. Keep it focused on the *claims*.
