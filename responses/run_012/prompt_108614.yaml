          *   Option B: The "Risk of Harm" (Substantive).
          *   Option C: The "Consent/Imposition" (Ethical, not welfare-based).
      *   **Section 3: Mapping the Roommate's Moves.**
          *   Create a table or clear list linking the readings to the three scenarios.
      *   **Section 4: Diagnosis of the Roommate.**
