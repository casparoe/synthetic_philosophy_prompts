answer: |-
  Yes, there is a name for this. The term you are looking for is **Teleonomy**.

  However, "Teleonomy" is just the label. The reason you feel stuck is that you are bumping up against one of the deepest divides in the philosophy of science: the difference between **Instrumentalism** (it's just a useful story) and **Realism** (the "reason" is physically instantiated in the system). Ana is arguing for a specific kind of realism called **Etiological Function**, often summarized by Daniel Dennett's phrase: **Competence without Comprehension**.

  Here is the breakdown of what this concept is, what it isn't, and how to draw the boundaries you are asking for.

  ### 1. The Term: Teleonomy
  In the 1950s, biologists needed a word to describe goal-directed behavior (like a root seeking water) without implying conscious intent (Teleology). They chose **Teleonomy**.

  *   **Teleology:** Purpose driven by a conscious mind (e.g., "I built this shed *to* store tools").
  *   **Teleonomy:** Purpose driven by a program or structure shaped by history (e.g., "The root grows sideways *because* ancestors that did so survived").

  Ana is right: In a teleonomic system, the "reason" is not a ghost in the machine; it is **encoded in the physical structure** via a history of selection. The termite mound ventilates *because* mounds that didn't ventilate collapsed and their builders died. The "knowledge" of ventilation physics is stored in the shape of the mound, not in a termite's brain.

  ### 2. The Mechanism: Competence without Comprehension
  This is the philosophical engine under the hood. Daniel Dennett argues that you can have high-level **competence** (solving the ventilation problem) without **comprehension** (understanding air pressure).

  The "reason" is real because it is the **trace of an optimization process**. Whether that process is Evolution (termites, seeds), Gradient Descent (AI weights), or Market Competition (prices), the system has been filtered. The "wrong" versions were removed; the "right" versions remain. The "reason" is the history of that filtering, physically embodied in the current structure.

  ### 3. Drawing the Boundaries (Your Three Questions)

  You asked for the edges. Here is how Teleonomy distinguishes itself from your three edge cases.

  **Boundary One: The Engineered Gadget**
  *   **The Case:** A human engineer builds a thermostat. It turns on the heat when it's cold. The reason is in the engineer's head.
  *   **Is it Teleonomy?** Technically, no. This is **Derived Intentionality**.
  *   **The Difference:** In teleonomy (termites), the "designer" (Natural Selection) has no mind. The information is *discovered* by the system. In engineering, the information is *imported* from a mind.
  *   **Why it matters:** If the gadget breaks, you ask the engineer. If the termite mound fails, there is no engineer to ask; you have to interrogate the physics and the evolutionary history. The "reason" in teleonomy is **decentralized**; in engineering, it is **centralized** (in the designer).

  **Boundary Two: Learned vs. Evolved**
  *   **The Case:** Your AI model. It wasn't evolved over millennia; it was trained over weeks.
  *   **Does the reason evaporate?** No. This is still Teleonomy (or **Optimization Teleonomy**).
  *   **The Difference:** It doesn't matter if the selection happened over generations (evolution) or epochs (training). What matters is that there was a **Variation and Retention** mechanism. The model tried weights, got a "loss" score (selection pressure), and kept the good ones.
  *   **The Boundary:** If a system simply reacts to physics without a history of selection (e.g., a rock rolling downhill), it is not teleonomic. It's just physics. If it adjusts to hit a target because past adjustments that missed were penalized (AI, Evolution, Markets), it is teleonomic. The "reason" is in the **training history**, embedded in the weights.

  **Boundary Three: Real Reason vs. Just-So Story**
  *   **The Case:** How do you know the termite mound *really* solves ventilation and you aren't just telling a nice story?
  *   **The Test:** **Counterfactual Robustness (Intervention).**
  *   **How to apply it:** If you change the variable, does the system adapt or fail predictably?
      *   *Real Reason:* If you seal the termite mound's vents, the colony dies. If you move the tomato plant's water source, the roots re-orient. The "reason" is causally linked to the structure.
      *   *Just-So Story:* If you say "The giraffe's neck is long to reach leaves," but the giraffe doesn't starve when leaves are low (it eats grass), the explanation is a story, not a function.
  *   **Ana's Point:** She is right that if the explanation allows you to predict the system's failure modes, the "reason" is doing work. It is not a metaphor; it is a **functional description of a control loop**.

  ### 4. The Double Parking Test (The Crucial Distinction)
  You mentioned the double parking on Thursday mornings. You intuitively feel this is different from the termite mound. You are correct.

  *   **Double Parking:** This is **Aggregate Intentionality**.
      *   Every driver has the "reason" in their head ("I don't want a ticket").
      *   The pattern exists *only* because every individual replicates the same internal calculation.
      *   If you ask "Why is the car there?", the answer is fully contained in the driver's mind.
  *   **Termite Mound / Market Price:** This is **Emergent Teleonomy**.
      *   No single agent knows the "reason." No termite knows ventilation physics. No trader knows the global scarcity of wheat.
      *   The "reason" is stored in the **system structure** (the mound's shape, the price signal), not the agents.
      *   The system knows something the parts do not.

  **The Litmus Test:** If you remove the agents but keep the structure, does the function remain?
  *   *Double Parking:* Remove the drivers, the cars sit there forever. The "reason" leaves with them.
  *   *Termite Mound:* Remove the termites, the mound *still* ventilates. The physics of the ventilation are encoded in the dirt. The "knowledge" remains in the structure.

  ### Summary: What to tell Ana
  You can tell her she is describing **Teleonomy grounded in Etiological Function**.

  *   **It is not a metaphor:** It is a claim that information about the environment is physically encoded in the system via a history of selection.
  *   **It is not Conscious Purpose:** It requires no mind, only a filter (evolution, training, market).
  *   **It is not a Just-So Story:** It is falsifiable via intervention (if you break the function, the system fails).

  You were annoyed because you thought she was anthropomorphizing (giving human traits to plants). She wasn't. She was **naturalizing intentionality** (showing how "aboutness" arises from physics and history). You were both right, but she had the vocabulary for the specific mechanism you were sensing.

  **The Boundary in one sentence:**
  If the "reason" disappears when you remove the minds involved, it's **Intentionality** (Double Parking). If the "reason" stays in the structure because it was selected for by consequences, it's **Teleonomy** (Termite Mound, AI, Roots).
