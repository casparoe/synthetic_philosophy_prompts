          *   *Verdict:* Grounding clarifies the *direction* of explanation but doesn't dissolve the regress unless one accepts brute facts (which returns us to the explanatory standards dispute). It might sharpen the dilemma but not solve it.

      *   **The Third Man Argument (TMA) Comparison:**
          *   TMA: Form of F + F things $\rightarrow$ Need Form of F+1.
          *   Bradley: Relata + Relation $\rightarrow$ Need Relation+1.
          *   Similarity: Both rely on a "One Over Many" or "Linking" principle that generates a new entity requiring linking.
          *   Distinction: TMA is about predication/classification. Bradley is about *truth-bearing unity* (propositional vs. list).
