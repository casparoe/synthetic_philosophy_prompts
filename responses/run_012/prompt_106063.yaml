answer: |-
  Hey there,

  It sounds like you have done a solid job internalizing Strawson's Freedom and Resentment. Your five-point pile is a very accurate reconstruction of the Strawsonian compatibilist position, and honestly, most of it hangs together quite well without needing much adjustment. Points one, two, four, and five are the core engine of that view, and point three is a reasonable elaboration on how moral responsibility scales from the personal to the impersonal. The tension you are feeling is real, but it is not actually between the numbered points themselves. The friction is almost entirely between your theoretical framework and that specific case verdict about the cult member.

  To see why, you have to look closely at how point one and point four interact with your intuition about the cultist. In point one, you define responsibility as the practice itself rather than a metaphysical fact underneath it. In point four, you acknowledge that there are facts about when it is appropriate to enter that practice, specifically citing capacity deficits like severe mental illness or childhood. Strawson's argument here is that we exempt people not because they are determined, but because they cannot participate in the interpersonal community that makes the reactive attitudes intelligible. You cannot feel genuine resentment toward someone who is incapable of understanding or reciprocating the moral demand. Your teenager case fits this perfectly. The teenager has reactive-attitude deficits, meaning they cannot join the community, so the objective attitude is appropriate.

  The problem arises when you apply this same logic to the cult member. You stipulated that he never had a real shot at becoming someone who could take part in normal relationships. If you grant that premise, then by the lights of your own point four, he should be exempt. If responsibility is just the practice of holding each other to account, and he is incapable of joining that practice due to his upbringing, then holding him responsible is a category mistake similar to holding the teenager responsible. The inconsistency here is that you are treating the teenager's lack of capacity as an exemption but treating the cultist's lack of capacity as irrelevant. You are effectively saying that the teenager is not a proper target because he cannot participate, but the cultist is a proper target even though he cannot participate.

  This is where you are talking out of both sides of your mouth. On one side, you have the Strawsonian view that responsibility is constitutive of the interpersonal community. On the other side, you have a lingering intuition that the cultist deserves indignation regardless of his capacity to join that community. This lingering intuition likely stems from a desire for safety or a hidden commitment to a desert-based view that you explicitly rejected in point one. You want to say there is no deeper fact about desert, but your verdict on the cultist implies there is a fact about him that makes him liable to indignation despite his inability to participate in the relationship that gives indignation its meaning. You are smuggling in a metaphysical notion of accountability that your first point claims does not exist.

  The good news is that points one through five do not actually pull against each other. It might feel like point one and point four are in tension because point one says there is no deeper fact while point four says there is a fact of the matter about exemptions. However, this is only a superficial conflict. For a Strawsonian, the fact of the matter about exemptions is internal to the practice. It is a fact about whether an agent can join the game, not a fact about whether they have metaphysical free will. So you do not need to discard any of your numbered points to resolve that specific tension. The only thing breaking your consistency is the cultist verdict.

  The cheapest fix is to adjust your assessment of the cultist's capacity rather than changing your theory. You should challenge the premise that he never had a real shot at becoming someone who could take part in normal relationships. Most adults raised in cults retain the basic cognitive and emotional machinery required for reactive attitudes, even if their moral content is warped. They can feel guilt, they can understand resentment, and they can negotiate relationships. If you argue that the cultist still has the capacity to participate in the moral community, even if damaged, then he remains a proper target of indignation under your existing framework. This allows you to keep all five of your numbered points and keep the verdict that he is responsible, but it costs you the concession that severe upbringing alone does not destroy agency in the way that severe psychological deficits do.

  However, if you insist on the premise that he truly never had a shot at normal relationships, then you have to be consistent. If you hold that line, then the one thing that has to go is your verdict that he is a proper target of indignation. You would have to accept that, strictly speaking, the objective attitude is the only appropriate stance toward him, just as it is for the teenager. This is the hard pill that many Strawsonians have to swallow. It means acknowledging that some adults are effectively moral children or patients due to their history, and while we might manage them for safety, we cannot genuinely hold them morally responsible in the sense you defined in point one.

  So to answer your question directly, the numbered points are consistent with each other, but they are inconsistent with your cultist verdict given the premise you attached to it. If you want to keep the framework you have built, you must drop the intuition that the cultist is a proper target of indignation while simultaneously granting he could not participate in normal relationships. You can keep the indignation only if you revoke the claim that he lacked the capacity for relationships. But if you force me to name the one thing that has to go to save the consistency of the view as stated, it is the cultist verdict. You cannot have a practice-based theory of responsibility that exempts the teenager for lacking capacity but indicts the cultist for the same lack of capacity without contradicting your own definition of what responsibility is.
