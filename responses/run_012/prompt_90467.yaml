answer: |-
  Here are the desiderata for an adequate theory of action under strong cluelessness.

  1.  **Decisiveness:** Must yield a verdict even when evidence is symmetric (coin flip).
      *   *Case:* Indifference causes paralysis.
      *   *Status:* Non-negotiable.
  2.  **Modal Discrimination:** Must distinguish risk (known *p*), uncertainty (unknown *p*), and cluelessness (no *p*).
      *   *Case:* Conflating them misprices options.
      *   *Status:* Non-negotiable.
  3.  **Local Priority:** Near-term certain goods must outweigh remote clueless effects.
      *   *Case:* Prevents butterfly-effect swamping (Pascal's Mugging).
      *   *Status:* Non-negotiable.
  4.  **Non-Convergent Handling:** Must verdict undefined sums (e.g., oscillating infinite value).
      *   *Case:* Standard expected value (EV) fails mathematically.
      *   *Status:* Non-negotiable.
  5.  **Epistemic Investment:** Must rank information gathering vs. acting.
      *   *Case:* Inquiry is an action with costs/benefits.
      *   *Status:* Non-negotiable.
  6.  **Action-Guidance:** No "permission to do nothing."
      *   *Case:* Moral paralysis is unacceptable.
      *   *Status:* Non-negotiable.

  **Most Damaging Requirement**
  **Local Priority** does the most damage. It rules out the dominant move in contemporary consequentialism: longtermist aggregation. Standard consequentialism sums all effects across time. If remote effects are clueless but potentially vast, standard theory implies they dominate local certain goods. Local Priority forbids this, forcing a discount rate or truncation that standard aggregation rejects. It demands a structural break in how consequences are weighed, not just a mathematical tweak. It effectively bans the view that clueless remote effects can outweigh known local harms, which is the engine of many high-impact consequentialist arguments.

  **Internal Tension**
  **Decisiveness vs. Modal Discrimination.** These two are likely incompatible. Modal Discrimination demands you acknowledge you have *no* probabilities to assign. Decisiveness demands you choose anyway. To choose without probabilities, you must employ a tie-breaking rule (e.g., status quo bias, randomness, or principle of indifference). But employing such a rule effectively assigns a pseudo-probability or preference where the theory admits none exists, violating Modal Discrimination. You cannot genuinely have "no odds" and simultaneously have a rational basis for choosing one option over another without smuggling in a hidden probability distribution. Satisfying Decisiveness requires pretending the ignorance is less severe than Modal Discrimination insists. This suggests a theory meeting all criteria may be impossible.
