answer: |-
  ### Brainstorming Candidate Concepts

  Before settling on a verdict, I will evaluate the standard terminology against your four conditions: (i) Ontological Determination, (ii) Robust Projectibility, (iii) Explanatory Autonomy, and (iv) Causal Closure.

  1.  **Multiple Realizability (MR):**
      *   *Why consider:* It directly addresses (ii) and (iii). It is the standard justification for why macro-laws survive micro-variation.
      *   *Why set aside:* As you noted, it is "too cheap." MR is a static mapping relation; it explains how a property *can* exist in different substrates, but it does not guarantee *lawfulness*. "Being worth one euro" is multiply realizable but supports no projectible generalizations. MR captures the *possibility* of (ii) but not the *necessity* or stability required for scientific law.

  2.  **Strong Emergence:**
      *   *Why consider:* It captures (ii) and (iii) emphatically. It treats macro-laws as fundamental.
      *   *Why set aside:* It violates (i) and (iv). Strong emergence posits novel causal powers or ontological residues that are not fixed by the microstate. Your examples (fluids, traffic, ideal gas) are explicitly compatible with micro-determinism, ruling this out.

  3.  **Reductive Physicalism (Identity Theory):**
      *   *Why consider:* It secures (i) and (iv) perfectly.
      *   *Why set aside:* It fails (iii). A strict reductionist argues that the macro-description *should* be displaced by the micro-description once the reduction is complete. It treats macro-laws as mere heuristic shortcuts, denying them genuine nomological status.

  4.  **Weak Emergence (Bedau-style):**
      *   *Why consider:* It is compatible with (i) and (iv). It is often used in complex systems to describe macro-features arising from micro-interactions.
      *   *Why set aside:* The standard philosophical definition (e.g., Bedau) focuses on *computational incompressibility* (you must simulate to predict). Your point is not about predictability but about *explanatory stability* and *universality*. You can compute the ideal gas law from MD, but that doesn't explain why the law holds across *different* micro-systems.

  5.  **Non-Reductive Physicalism (NRP):**
      *   *Why consider:* This is the standard metaphysical home for (i), (iii), and (iv). It asserts physical ontology without explanatory reduction.
      *   *Why set aside (initially):* Standard NRP relies heavily on Multiple Realizability to justify (iii). As you noted, MR alone feels insufficient to ground the *robustness* in (ii). However, NRP is the broad church; the specific *variant* that fixes the "cheap MR" problem is what you are looking for.

  ***

  ### Verdict: Robust Non-Reductive Physicalism (via Universality)

  The configuration (i)–(iv) does not have a single, universally standardized moniker that captures the *physics* of the stability alongside the *metaphysics* of the dependence. However, in the contemporary philosophy of physics and special sciences, this position is best identified as **Non-Reductive Physicalism** grounded in **Universality** (specifically via the Renormalization Group).

  If we require a precise label for the specific *configuration* you described—distinguishing it from "cheap" MR and "strong" emergence—the most accurate term is **Robust Non-Reductive Physicalism**. In the complexity literature, this is often colloquially called **Weak Emergence**, but that term is metaphysically loaded and ambiguous. I recommend adopting **Effective Autonomy within Physicalism**.

  Here is how the literature divides your four parts, and where the "joints" are located:

  #### 1. The Metaphysical Frame: Non-Reductive Physicalism
  This covers **(i)** and **(iv)**.
  *   **The Joint:** This is the commitment to the causal closure of the physical. There is no "leftover residue." The macro-state supervenes on the micro-state.
  *   **The Tension:** This invites Jaegwon Kim's "Causal Exclusion Argument." If the micro-cause is sufficient for the effect, what causal work is left for the macro-cause to do?
  *   **Your Solution:** You bypass this by denying that the macro needs *separate* causal powers (iv). It exerts influence *in virtue of* the micro, but...

  #### 2. The Mechanism of Stability: Universality (RG Explanation)
  This covers **(ii)**.
  *   **The Joint:** This is the crucial piece that "cheap" MR misses. Multiple Realizability says the macro *can* be realized by different micros. **Universality** explains *why* the macro-laws are *identical* across different micros.
  *   **The Physics:** As you noted with critical points, the Renormalization Group (RG) shows that micro-details are "irrelevant operators" that wash out at large scales. The macro-law depends only on a few structural features (dimensionality, symmetry), not the specific micro-constituents.
  *   **Why MR is insufficient:** MR is a claim about *instances* (this pain is C-fibers, that pain is silicon). Universality is a claim about *laws* (the exponent $\beta$ is 0.32 for *all* fluids in this class). Your intuition that MR is "too cheap" is philosophically sound; Universality is the robust successor to MR.

  #### 3. The Explanatory Status: Explanatory Autonomy
  This covers **(iii)**.
  *   **The Joint:** Because of Universality, the micro-story is not just incomplete; it is *explanatorily irrelevant* for certain questions. To explain why the gas law holds, citing the specific mass of the nitrogen molecule is to introduce noise, not signal.
  *   **The Label:** Philosophers of science (e.g., Batterman, Morrison, Wilson) call this **Autonomous Effective Description**. The macro-theory is an "Effective Field Theory" (EFT) that is valid within a domain, independent of the UV-completion (micro-theory).

  ### Boundary Cases

  To sharpen the definition of **Robust Non-Reductive Physicalism**, consider these cases:

  *   **Excluded Case (Fails ii): "Being a Piece of Furniture."**
      *   *Satisfies:* (i) Determined by microphysics. (iv) No extra causal powers.
      *   *Fails:* (ii) and (iii). There are no projectible laws about "furniture" that survive micro-variation. A chair and a table share no dynamical equations. The predicate is realizable in many ways, but it does not carve nature at its joints. It lacks **Universality**.
  *   **Borderline/Included Case: "Temperature in Equilibrium."**
      *   *Satisfies:* (i) Fixed by micro-kinetics. (iv) No thermal causal powers over and above molecular collisions. (ii) Robust across gases, solids, plasmas. (iii) Thermodynamics is not displaced by statistical mechanics; it remains the correct level for engineering and macro-explanation.
      *   *Why Borderline:* In non-equilibrium systems, the definition of temperature becomes ambiguous, and the autonomy (iii) begins to fray, requiring more micro-details. This highlights that your configuration (i)-(iv) applies specifically to **Robust Regimes** (like equilibrium or critical points).

  ### What Turns on the Answer?

  You asked whether the difference between calling the macro a "convenient bookkeeping device" and a "genuine level of law" is substantive or epistemic.

  **It is a substantive metaphysical difference regarding modal structure.**

  1.  **Instrumentalism (Bookkeeping):** If the macro is merely bookkeeping, then the *only* genuine laws are the micro-laws. The macro-regularities are contingent summaries of micro-accidents. If this were true, the stability of critical exponents (your Example 1) would be a cosmic coincidence.
  2.  **Realism (Genuine Level):** If the macro is a genuine level of law, then the world possesses **modal stability**. The fact that the macro-law holds across *alien* micro-realizations implies that the macro-structure constrains the possibilities of the system in a way that is insensitive to the micro-constitution.

  **The Stakes:**
  If you accept (i)–(iv) as **Robust Non-Reductive Physicalism**, you are a **Realist about Special Science Laws**. You claim that the world is structured hierarchically, not just in terms of size, but in terms of **insensitivity**. The "joints" of the world are not just at the bottom (quarks/strings); they are also at the top (fluids, economies, traffic), because the top-level structures are *counterfactually robust*.

  If you reject this and treat it as mere bookkeeping, you commit to a **Reductionist Ontology** where all genuine causation and lawfulness resides at the fundamental level. This makes the success of the special sciences (like condensed matter) miraculous, as they would be tracking patterns that have no deep modal grounding.

  **Recommendation:**
  Adopt the term **Effective Autonomy**. It signals the physical mechanism (Effective Field Theory/RG) and the metaphysical status (Autonomy without Strong Emergence). It validates your experimental intuition: the macro-law is real, robust, and indispensable, even if it is ultimately grounded in the micro.
