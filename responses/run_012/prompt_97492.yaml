      *   Make sure the distinction between "explanation as subsumption" and "explanation as configuration" is clear throughout.
      *   Focus heavily on the *explanandum* shifting. This is a strong philosophical point (Danto's distinction between mere events and historical actions).

  8.  **Final Review against constraints:**
      *   No bibliography? Checked.
      *   No quotes? Checked.
      *   Paraphrase only? Checked.
      *   End with specific conclusion on what the film adds? Checked.

  *(Self-Correction during final review)*: I need to make sure I don't just say "Subjectivity rules." I need to tie it specifically to the *logic of explanation*. The friend argues the witnesses are unreliable. I need to argue that *all* historical witnesses are unreliable in the Hempelian sense because their reports are constitutive of the action, not just reports on it. The "unreliability" is a feature of human agency, not a bug of testimony.

