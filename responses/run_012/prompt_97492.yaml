prompt: |-
  Last night a friend and I spent two hours arguing about whether history is a science, and we ended up shouting about *Rashomon* at each other across the kitchen table. My friend, who has been reading Hempel, insists that every genuine historical explanation must fit the covering-law model: you explain an event by showing that it follows deductively from general laws plus initial conditions, and if the four accounts in Kurosawa's film cannot be reconciled, that only proves the witnesses are unreliable, not that history is a different kind of inquiry. I think the film is a much sharper test case for the covering-law versus narrative-explanation debate than he will admit, and I want you to adjudicate the dispute by reading *Rashomon* through that debate. Treat the covering-law model as the view that explanation is subsumption under law, with the same logical form as prediction, and treat narrative explanation as the view, associated with philosophers such as Danto, Gallie, and Mink, that history explains by configuring events into a temporal whole, selecting what matters, and revealing how one thing led to another in a way that cannot be captured by a law plus initial conditions. The question is not whether the film is about truth and memory in some loose sense; it is whether the film dramatizes a real limitation of the covering-law model, or whether it merely stages a failure of testimony that a covering-law account could absorb without difficulty.

  I am teaching an advanced seminar on philosophy of history, and I want a reading that is faithful in both directions: do not reduce *Rashomon* to an illustration of a thesis, and do not bend the philosophy of history to make the film look prescient. Begin by brainstorming the mapping between the film and the debate. What plays the role of the explanandum in each account, and how does the film suggest that the explanandum itself shifts depending on the narrative? How do the bandit's story, the wife's story, the samurai's story through the medium, and the woodcutter's story differ not only in factual claims but in the concepts under which the same events are described, and what does that do to the covering-law ideal of a neutral observation language? What should we make of the frame narrative with the priest, the woodcutter, and the commoner, and of the woodcutter's final admission and his taking of the baby? Does the film vindicate narrative explanation by showing that historical understanding is inseparable from point of view, moral evaluation, and the selection of a plot, or does it undermine narrative explanation by making every narrative look like self-justification? Where does the film resist the reading you are giving it, and where does the philosophical debate illuminate a scene that a purely literary reading would miss? What would Hempel say about the woodcutter's account, and what would a narrative theorist say about Hempel's demand for general laws?

  You are a philosopher of history with expertise in both the covering-law debate and narrative theory, and you also know Kurosawa's film well. Think this through carefully before you write. I do not want a bibliography, a reading list, or citations, and you should not quote from the film or from any philosophical text; paraphrase instead. Assume that I know the film and the standard positions, so you can go into the weeds. End by saying what *Rashomon* adds to the covering-law versus narrative-explanation debate that argument alone does not, and whether the film's own resolution, if it has one, favors one side or leaves the debate where it found it.
