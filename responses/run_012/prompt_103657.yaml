      *   **Non-Domination vs. Non-Interference:** Identify scenes. The firing of the Jewish maids is the smoking gun. Darlington decides arbitrarily; Stevens executes. Stevens cannot object without ceasing to be Stevens. The "greatness" of the house relies on this structural vulnerability.
