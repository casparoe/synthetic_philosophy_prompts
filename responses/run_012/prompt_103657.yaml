          4.  **Crucial:** Where does the novel *push back* on all three framings? (Is dignity an achievement? Is the problem the *cause* not the *servitude*?)
          5.  **Crucial:** Does the republican frame grip if Stevens's ends are constituted by the role? (Is there a "self" to dominate?)
          6.  **Crucial:** The ending (Farraday/banter/pier) – liberation or new dependence?
