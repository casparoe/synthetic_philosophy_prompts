answer: |-
  This is a rigorous request for a meta-historical specification. You are asking for the *conditions of adequacy* for any theory of Athenian democratic failure, rather than a theory itself. Below is the specification list, structured by empirical constraints, conceptual distinctions, ideological commitments, and logical trade-offs.

  ### I. Empirical Constraints (The Cases)
  An adequate account must explain the specific dynamics of these four episodes. If a theory explains Sicily but renders Mytilene impossible, it fails.

  1.  **The Mytilene Constraint (Volatility vs. Correction)**
      *   **The Data:** The Assembly voted for collective extermination (Day 1), then reversed itself to punish only the ringleaders (Day 2).
      *   **Requirement:** The account must explain the mechanism of *initial rage* without making the *subsequent reflection* impossible.
      *   **Failure Mode:** A theory that posits the demos as inherently irrational cannot explain the reversal. A theory that posits the demos as inherently rational cannot explain the initial vote.

  2.  **The Sicily Constraint (Escalation of Commitment)**
      *   **The Data:** A massive strategic gamble was undertaken; when it stalled, resources were doubled down rather than cut, leading to total loss.
      *   **Requirement:** The account must explain why a body capable of Mytilene-style correction failed to correct course in Sicily.
      *   **Failure Mode:** A theory attributing failure solely to "ignorance" fails because the ignorance persisted despite available reports. A theory attributing it solely to "imperial overreach" must explain why this specific overreach was not checked as others were.

  3.  **The Arginusae Constraint (Legality vs. Sovereignty)**
      *   **The Data:** Victorious generals were condemned for a rescue failure during a storm. The condemnation required an illegal procedure (en bloc vote), which Socrates opposed.
      *   **Requirement:** The account must distinguish between the *desire for accountability* (understandable) and the *violation of procedural law* (the specific failure).
      *   **Failure Mode:** Conflating the outcome (punishment) with the procedure (illegality). An account must explain why the Assembly felt empowered to suspend its own laws in a moment of emotional intensity.

  4.  **The Socrates Constraint (Amnesty vs. Retribution)**
      *   **The Data:** Socrates was tried after an amnesty meant to halt political settling of scores. He had previously resisted both the Democracy (Arginusae) and the Oligarchy (Thirty).
      *   **Requirement:** The account must explain why the amnesty failed to protect a man who had proven his commitment to law over faction.
      *   **Failure Mode:** Attributing the trial solely to "anti-democratic sentiment." If he resisted the Thirty too, the motive must be more complex than simple partisan revenge.

  ---

  ### II. Conceptual Distinctions (Do Not Collapse)
  An adequate account must maintain these distinctions. Collapsing them constitutes a category error.

  1.  **Bad Decision vs. Bad Procedure**
      *   **Case:** Sicily (Decision) vs. Arginusae (Procedure).
      *   **Requirement:** The account must allow that a vote can be strategically wise but procedurally illegal, or strategically disastrous but procedurally sound.
      *   **Camp Commitment:** The *Institutions-were-misdesigned* camp often collapses these, arguing the procedure caused the bad decision. The *Crowd-is-fickle* camp argues the mood caused both.

  2.  **Mistake vs. Culpable Mistake**
      *   **Case:** Sicily.
      *   **Requirement:** The account must distinguish between strategic miscalculation (error) and reckless disregard for counsel (culpability).
      *   **Camp Commitment:** The *Empire-was-the-problem* camp tends to view Sicily as a structural mistake (inevitable). The *Crowd-is-fickle* camp views it as culpable hubris.

  3.  **The Assembly vs. The Democracy vs. The Population**
      *   **Case:** All.
      *   **Requirement:** The account must distinguish between the 6,000 present (Assembly), the constitutional system (Democracy), and the total citizen body (Population).
      *   **Camp Commitment:** The *Crowd-is-fickle* camp treats the Assembly present as the totality of the Democracy. The *Institutions* camp treats the rules as the Democracy.

  4.  **Defect in Design vs. Defect in Execution**
      *   **Case:** Arginusae.
      *   **Requirement:** The account must specify if the en bloc vote was a bug in the system or a feature exploited by specific actors.
      *   **Camp Commitment:** The *Institutions* camp says it was a design flaw (direct democracy lacks checks). The *Sources* camp suggests it was a specific manipulation reported by hostile witnesses.

  5.  **Constitutional Failure vs. Wartime Pathology**
      *   **Case:** All.
      *   **Requirement:** The account must isolate failures that occurred *because* it was Athens from failures that occur in *any* state under existential stress.
      *   **Camp Commitment:** The *Empire* camp argues these are wartime pathologies. The *Institutions* camp argues Sparta or a Republic would have avoided them.

  ---

  ### III. Requirements: Non-Negotiable vs. Camp Commitments
  Here we separate the methodological floor from the ideological ceiling.

  #### Non-Negotiable Requirements (Must be met by any adequate account)
  1.  **Source Criticism:** The account must explicitly state how it handles the bias of Thucydides, Xenophon, and Plato. It cannot treat their descriptions of "mob rule" as objective data without qualification.
  2.  **The Reversal Mechanism:** The account must provide a causal mechanism for the Mytilene reversal that does not contradict the mechanism for the Sicily persistence.
  3.  **Procedural Specificity:** Regarding Arginusae, the account must explain *why* the illegal motion was proposed and accepted, not just that the generals were unpopular.
  4.  **Amnesty Context:** Regarding Socrates, the account must address the tension between the formal amnesty and the social pressure that bypassed it.

  #### Camp Commitments (Optional theoretical lenses)
  1.  **The Crowd-is-Fickle Camp**
      *   **Commitment:** Human psychology in masses is inherently emotional and short-sighted.
      *   **Requirement:** Prioritizes rhetoric and demagoguery as primary causes.
      *   **Weakness:** Struggles with the Mytilene Reversal (why did the "mob" listen to reason?).
  2.  **The Institutions-were-Misdesigned Camp**
      *   **Commitment:** Direct democracy lacks necessary checks (judicial review, representative buffer).
      *   **Requirement:** Prioritizes procedural flaws (e.g., lack of separation of powers).
      *   **Weakness:** Struggles to explain why Athens functioned effectively for decades prior to these specific crises.
  3.  **The Empire-was-the-Problem Camp**
      *   **Commitment:** Imperial maintenance creates structural incentives for violence and overreach.
      *   **Requirement:** Prioritizes material conditions and geopolitical pressure over internal politics.
      *   **Weakness:** Struggles to explain the specific legal irregularities of Arginusae and Socrates (internal legalism vs. external pressure).
  4.  **The Sources-are-Hostile Camp**
      *   **Commitment:** The narrative of "democratic failure" is a construction of the defeated elite.
      *   **Requirement:** Prioritizes reading against the grain of the texts; assumes stability unless proven otherwise.
      *   **Weakness:** Risks explaining away too much data; struggles to explain why the democracy was eventually overthrown if it was functioning well.

  ---

  ### IV. Incompatible Pairs (The Trade-Offs)
  You suspected that a mechanism strong enough to explain Sicily predicts a Mytilene that never reverses. You are correct. Here are the pairs an account must negotiate, knowing it cannot fully satisfy both sides of the pair simultaneously.

  1.  **Responsiveness vs. Consistency**
      *   **The Conflict:** To explain Mytilene Day 2, the Assembly must be highly responsive to new argument (Diodotus). To explain Sicily, the Assembly must be highly resistant to new information (Nicias's delays, reports of failure).
      *   **The Trade-off:** An account must posit a *variable* responsiveness. (e.g., "Responsive to rhetoric, resistant to strategic reality" or "Responsive to immediate proximity, resistant to distant reports"). If the mechanism is uniform (e.g., "The mob is always irrational"), it fails one case.

  2.  **Sovereignty vs. Rule of Law**
      *   **The Conflict:** To explain Arginusae, the Assembly must be sovereign (above the law). To explain Socrates' defense at his trial (and his action at Arginusae), the Rule of Law must be a binding norm that was violated.
      *   **The Trade-off:** An account must explain how the Law is binding *until* the Assembly decides it is not. If the Law is always binding, Arginusae doesn't happen. If the Assembly is always absolute, Socrates has no ground for defense. The account must locate the *trigger* that switches the system from Law to Sovereignty.

  3.  **Elite Manipulation vs. Popular Agency**
      *   **The Conflict:** To explain the illegal motion at Arginusae, elites (Callixenus) must have manipulated the crowd. To explain the trial of Socrates, the crowd must have had genuine agency to condemn a protected figure.
      *   **The Trade-off:** If the crowd is purely a puppet of elites, the "Democracy" isn't failing, the *elites* are. If the crowd is purely autonomous, elite manipulation is impossible. An adequate account must assign a ratio of agency between the speaker and the listener.

  4.  **Trauma vs. Normalcy**
      *   **The Conflict:** To explain Socrates and Arginusae, the city must be in a state of exceptional trauma (plague, war loss, oligarchic coup). To explain the stability of the empire prior to Sicily, the city must be in a state of normalcy.
      *   **The Trade-off:** An account must define the threshold where "wartime stress" becomes "constitutional breakdown." If everything is trauma, the democracy never worked. If nothing is trauma, the failures are inexplicable.

  ---

  ### V. The Killer Requirement
  You guessed that the requirement to *survive the fact that the writers were not democrats* eliminates the most candidates.

  **Verdict:** You are half-right, but the sharper blade is **The Mytilene Reversal.**

  1.  **Why the Source Requirement is powerful:** It eliminates the *Crowd-is-Fickle* camp's strongest evidence. If Thucydides frames the debate to make Cleon look like a monster and Diodotus like a sage, the "mob psychology" theory loses its data. However, a sophisticated account can still acknowledge bias while accepting the *outcome* (the vote happened). It filters *interpretations*, but not necessarily *mechanisms*.

  2.  **Why the Mytilene Reversal is the true eliminator:** This is the logical singularity.
      *   **Mob Theory:** Predicts Day 1, fails Day 2.
      *   **Rational Deliberation Theory:** Predicts Day 2, fails Day 1.
      *   **Structural/Institutional Theory:** Predicts consistency (either the rules stop the vote, or they allow it). It struggles to explain the *change* without a change in rules (which didn't happen).
      *   **Empire Theory:** Irrelevant to the internal vote swing.

  **The Single Requirement:**
  > **"The account must posit a mechanism that allows for rapid, high-stakes self-correction (Mytilene) without presupposing a level of strategic foresight that would have prevented the initial catastrophe (Sicily)."**

  **Why this eliminates the most candidates:**
  Most theories rely on a stable variable (e.g., "The People are Impulsive" or "The System is Flawed"). This requirement demands a *dynamic* variable. It forces the account to explain why the democracy learned a moral lesson in 24 hours (Mytilene) but failed to learn a strategic lesson over 2 years (Sicily).

  To satisfy this, an account must give up **Psychological Uniformity**. It must admit that the Assembly was capable of high reason and deep folly, often in close proximity, and locate the cause not in *who* they were, but in the *information structures* and *temporal horizons* available to them in each specific instance.

  If you insist on this requirement, the *Crowd-is-Fickle* camp is eliminated immediately. The *Institutions* camp is severely wounded (unless it explains why the institution worked in one case and not the other). The *Sources* camp survives best, as it allows for the possibility that the "fickleness" is a literary device, but it then struggles to explain the actual strategic failure of Sicily.

  **Conclusion:** The requirement that breaks the most theories is not the bias of the authors, but the **inconsistency of the Assembly's competence.** Any theory that relies on a fixed trait of the democracy (whether virtuous or vicious) will fail to map the jagged line between Mytilene's mercy and Sicily's ruin.
