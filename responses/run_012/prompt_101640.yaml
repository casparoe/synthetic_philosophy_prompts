  1. I concede that the riverbed shifts, but you confuse the historical mutability of the bed with the functional role it plays while it holds the water.
  2. When the geocentric hinge slipped, it was not because someone doubted it within the system, but because the system itself underwent a violent transformation of sense.
  3. It is not a matter of how firmly you hold the proposition, but that you hold it as a norm for inquiry rather than as a result of it.
  4. There is no crisp moment where a hinge becomes a belief, because the transition is the dissolution of one language-game into another, not a revision within a game.
  5. Your novelist may lose her grip, but while she speaks her language, the hinges are the silence that allows her words to mean anything at all.
