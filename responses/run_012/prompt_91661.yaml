prompt: |-
  I'm a novelist — third book due in about eighteen months — and I've carved out maybe five hours a week this year for philosophy of emotion. I want it to show up in the writing: the scene where a character is furious and knows it, the one where she's grieving and doesn't, the one where what she says she feels and what she's actually doing come apart. So which open questions in the philosophy of emotion matter most for that, and in what order? Not a reading list — I'll find the books myself. What I want is the reasoning: which questions are upstream of which (does the whole judgement-vs-feeling-vs-perception-of-value thing have to get settled before anything about authenticity, fittingness or self-knowledge is even statable?), which are actually tractable for someone with no lab and no training in psych, and which sound profound but wouldn't change a single sentence I write. I also keep bumping into a gap between the emotion a character reports, the emotion that's really driving her, and the emotion a reader will impute to her — is there a live debate about that gap, or do I have to invent it? And tell me what would move a question up or down your ranking. I'm especialy suspicious of the ones that only pay off in the abstract.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Novelist (3rd book due in 18 months).
      *   **Constraint:** ~5 hours/week for philosophy of emotion.
      *   **Goal:** Apply philosophical insights directly to writing (scenes of fury, grief, disconnect between speech/action).
      *   **Needs:**
          *   Prioritized open questions in philosophy of emotion.
          *   Reasoning for the order (upstream/downstream dependencies).
          *   Tractability assessment (no lab, no psych training).
          *   Relevance filter (what actually changes sentences vs. abstract noise).
          *   Specific address of the "gap" (reported vs. driving vs. imputed emotion).
          *   Criteria for moving questions up/down the ranking.
      *   **Tone:** Pragmatic, sharp, respectful of time, focused on craft utility. No reading lists.

  2.  **Deconstruct the "Gap" (Reported vs. Driving vs. Imputed):**
      *   *Reported:* What the character says ("I'm fine").
      *   *Driving:* What is causally effective (rage driving the "I'm fine").
      *   *Imputed:* What the reader infers (pity, tension, irony).
      *   *Philosophical Context:* This maps onto Self-Knowledge (Privileged Access), Externalism about Mental Content, and Expressivism. It's not a "gap" philosophers ignore; it's central to debates on *self-deception* and *emotion attribution*.
      *   *Verdict:* This is the core narrative engine. It needs to be high priority.

  3.  **Identify Key Philosophical Debates & Filter for Utility:**
      *   *Cognitivism vs. Non-Cognitivism (Judgement vs. Feeling):* Does emotion require a belief? (e.g., Fear requires believing danger exists).
          *   *Utility:* High. If a character feels fear but knows there's no danger (phobia/art), how is that written? This affects internal monologue.
      *   *Constitutive vs. Causal:* Is the feeling part of the emotion or just a symptom?
          *   *Utility:* Medium. Affects description of somatic markers.
      *   *Fittingness vs. Authenticity:* Is the emotion *correct* for the situation vs. is it *real* for the person?
          *   *Utility:* Very High. Crucial for character arc and conflict.
      *   *Self-Knowledge/Transparency:* Do we know our own minds directly?
          *   *Utility:* Critical. Addresses the "grieving and doesn't know it" scenario.
      *   *Social/Constructed Emotions:* Are emotions universal or culturally scripted?
          *   *Utility:* Medium/High. Affects dialogue and social signaling.

  4.  **Determine Upstream/Downstream Dependencies:**
      *   *Upstream:* What *is* an emotion? (Ontology). If you don't define the mechanism, you can't define errors in the mechanism.
      *   *Midstream:* Self-Knowledge & Regulation. How does the character access the emotion?
      *   *Downstream:* Ethics & Aesthetics. Is the emotion "good" or "beautiful"? (Less useful for the actual writing of the scene, more for thematic resonance).

  5.  **Drafting the Ranking (Iterative Process):**

      *   *Attempt 1:* Start with "What is emotion?" Then "Self Knowledge." Then "Social."
      *   *Critique 1:* Too academic. "What is emotion" is a rabbit hole. Need to frame it as "The Mechanism of Conflict."
      *   *Attempt 2:* Focus on the specific scenes mentioned (Fury/Known, Grief/Unknown, Say/Do split).
      *   *Refinement:*
          1.  **The Nature of the Split (Cognitivism vs. Somaticism):** This determines *how* the disconnect manifests. If emotion is a judgment, the disconnect is intellectual. If it's somatic, it's physical. *Upstream.*
          2.  **Self-Knowledge & Transparency:** Can they see it? This addresses the "grieving and doesn't know it." *Midstream.*
          3.  **Fittingness vs. Accuracy:** Is the emotion appropriate? This addresses the "furious and knows it" (is the fury justified?). *Downstream but vital for tension.*
          4.  **The Reader Gap (Attribution Theory):** This addresses the "imputed" emotion. *Meta-level.*

  6.  **Addressing the Specific "Gap" Question:**
      *   Is there a live debate? Yes. It's the debate over *Privileged Access* and *Interpretivism*. Daniel Dennett, Richard Moran, Kieran Setiya. Also the psychological constructivism of Lisa Feldman Barrett (though she's psych, the philosophy follows).
      *   Advice: Don't invent it, but don't get bogged in the academic terminology. Use the *tension* between first-person authority and third-person observation.

  7.  **Refining the Criteria for Ranking (Up/Down):**
      *   *Move Up:* If it changes *verbs* and *sensory details*.
      *   *Move Down:* If it only changes *theme* or *backstory*.
      *   *Move Down:* If it requires resolving a 2000-year-old metaphysical dispute to use.

  8.  **Final Polish (Tone Check):**
      *   Ensure I'm not giving a reading list.
      *   Ensure I'm respecting the 5 hours/week constraint.
      *   Make sure the "Reasoning" is clear on *why* order matters.
      *   Keep it punchy. The user is a writer; they value precision and economy.

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the constraint and the goal.
      *   **The "Gap" Answer:** Address the reported/driving/imputed question immediately (it's the hook).
      *   **The Ranked Questions:** 1, 2, 3, 4 with "Why Upstream" and "Craft Payoff."
      *   **The Tractability Filter:** What to skip.
      *   **Ranking Criteria:** How to adjust based on the specific book.

  10. **Self-Correction during drafting:** I initially thought about putting "Social Construction" high. But for a novelist writing individual scenes, the *internal mechanics* of the emotion matter more than the sociological origin. I'll move Social Construction down or merge it into the "Reader Gap." Actually, the "Reader Gap" is more about *Theory of Mind*. Let's stick to the internal/external divide.
      *   *Correction:* The "Fittingness" question is crucial for the "furious and knows it" scene. If she knows she's furious, does she think she *should* be? That's normative. That needs to be high.
      *   *Revised Order:* 1. Constitution (What is it made of?), 2. Self-Knowledge (Can I see it?), 3. Fittingness (Is it right?), 4. Attribution (What do you see?).

  11. **Final Review against constraints:** 18 months is tight. 5 hours/week is ~450 hours total. That's enough for deep diving but not a PhD. Focus on *conceptual tools*, not history of ideas.

      *(Self-Correction on "Gap"):* The user asked if they have to invent the gap between reported/driving/imputed. I need to be clear: Philosophy calls this the distinction between *Phenomenology* (what it feels like), *Causal Role* (what it does), and *Attribution* (how it's labeled). It's not a gap philosophers ignore; it's the whole field. But the *narrative exploitation* of it is the writer's job.

      *(Final Polish on Tone):* Avoid academic jargon where possible, or explain it in writerly terms. Use "Craft Payoff" sections.

      *(Let's write.)*
answer: |-
  Here is the prioritization, ordered by upstream dependency and craft utility. I have filtered out debates that resolve nothing for a writer and highlighted the ones that change verbs, pacing, and subtext.

  ### 1. The Constitution Question: Is Emotion a Judgment or a Sensation?
  **The Debate:** Cognitivism (emotion is a judgment about value, e.g., fear = judging something dangerous) vs. Somatic/Perceptual theories (emotion is a bodily feeling or a perception of value, independent of belief).
  **Why Upstream:** You cannot write the "split" between what a character says and does until you decide where the emotion lives. If emotion is a *judgment*, a character can lie about it intellectually. If it is *somatic*, their body betrays them regardless of their intellect.
  **Tractability:** High. You don't need a lab; you need to decide which model governs your character's psychology.
  **Craft Payoff:**
  *   **If Cognitivist:** The "grieving and doesn't know it" scene is intellectual repression. She avoids the *thought* of loss. The writing focuses on avoidance of topics, rationalization, and logical gaps.
  *   **If Somatic/Perceptual:** The grief is physical. She *knows* she isn't sad (judgment), but her hands shake (sensation). The writing focuses on involuntary physiology, slips of the tongue, and sensory distortion.
  *   **Recommendation:** Adopt a **Hybrid/Perceptual Model**. It offers the most friction. Let the character judge one thing ("I am over him") while perceiving another (the room looks grey). This creates the "say/do" split automatically.

  ### 2. The Transparency Question: Do We Have Privileged Access to Our Emotions?
  **The Debate:** Self-Intimation (if I feel it, I know I feel it) vs. Interpretivism (we infer our own emotions much like we infer others').
  **Why Upstream of Authenticity:** You asked about the scene where she's grieving and *doesn't know it*. This is impossible if Privileged Access is true. You must assume **Interpretivism** to write self-deception convincingly.
  **Tractability:** High. This is purely phenomenological. Observe your own moments of delayed reaction.
  **Craft Payoff:**
  *   **The "Grieving/Unknown" Scene:** If we infer our own emotions, the character needs *evidence* to realize they are grieving. They don't just "realize"; they observe themselves crying, or snapping at a waiter, and *then* label it.
  *   **Writing Tip:** Don't write the realization as an internal lightbulb. Write it as an external observation the character makes about themselves. "She heard her own voice and didn't recognize the sharpness in it."

  ### 3. The Fittingness Question: Is the Emotion Accurate or Appropriate?
  **The Debate:** Fittingness (does the object deserve this emotion?) vs. Authenticity (is the emotion truly felt?).
  **Why Midstream:** You can only ask if an emotion is "justified" (furious and knows it) after you've established what the emotion *is* (Q1) and whether the character *knows* they have it (Q2).
  **Tractability:** High. This is moral reasoning, which novelists already do.
  **Craft Payoff:**
  *   **The "Furious/Known" Scene:** A character can admit, "I am furious," while debating, "I have no right to be." This creates **normative tension**.
  *   **The Split:** If the emotion is *authentic* but *unfitting* (jealousy over a partner who did nothing wrong), the conflict is internal shame. If it is *fitting* but *inauthentic* (pretending to be sad at a funeral), the conflict is social performance.
  *   **Recommendation:** Focus on **unfitting authenticity**. It is more dramatic. A character consumed by rage they know is irrational is more compelling than a character with justified rage.

  ### 4. The Attribution Gap: Reported vs. Imputed Emotion
  **The Debate:** This is not a gap you have to invent; it is the core of **Theory of Mind** and **Expressivism**. Philosophers (like Peter Goldie or Jenefer Robinson) discuss how emotions are "owned" by the subject but "read" by the observer.
  **Why Downstream:** This relies on the reader's ability to interpret the cues you set up in Q1–Q3.
  **Tractability:** Medium. Requires understanding reader psychology.
  **Craft Payoff:**
  *   **The "Imputed" Emotion:** The reader will impute emotion based on *context*, not just report. If a character says "I'm fine" (Report) while smashing a plate (Driving), the reader imutes "Rage" or "Denial."
  *   **The Gap:** You can manipulate the *distance* between Report and Imputation.
      *   *Small Gap:* Character cries, says "I'm sad." (Melodrama).
      *   *Large Gap:* Character laughs, says "It's funny," while setting a fire. (Thriller/Tragedy).
  *   **Live Debate:** The debate is about **Authority**. Does the character's report override the reader's imputation? (Usually no). Use this. Let the character insist they feel X, while the narrative evidence forces the reader to conclude Y. The friction *is* the scene.

  ---

  ### What to Ignore (The "Abstract Trap")
  Move these to the bottom of your list. They sound profound but won't change a sentence:
  *   **The Evolutionary Origin of Emotion:** Knowing *why* humans evolved fear won't help you write a specific scene of fear.
  *   **Universalism vs. Constructivism:** Unless your book is sci-fi or anthropological, arguing whether "anger" exists in all cultures is thematic window dressing, not scene-level mechanics.
  *   **The Metaphysics of Qualia:** Don't worry about whether the "redness" of rage is objective. Worry about how it restricts the character's vision.

  ### How to Move Questions Up or Down Your Ranking
  Since you have 18 months, your focus might shift. Here is the heuristic for reprioritizing:

  **Move a question UP if:**
  1.  **It changes the verbs:** If resolving the question changes whether a character *shakes* (somatic) or *ruminates* (cognitive), it belongs in the top 3.
  2.  **It creates friction:** If the answer makes the character's life harder (e.g., "I can't trust my own feelings"), it is narratively valuable.
  3.  **It solves a blockage:** If you are stuck on *why* a scene feels flat, check the Attribution Gap. You may have aligned the Report and the Driving emotion too closely.

  **Move a question DOWN if:**
  1.  **It requires consensus:** If philosophers haven't agreed on it in 2,000 years (e.g., "What is the definition of emotion?"), don't wait for an answer. Pick the one that serves the draft.
  2.  **It only affects theme:** If the insight only matters for the back cover blurb or a thesis statement, cut it. You need scene-level leverage.
  3.  **It demands external validation:** If you need a psychologist to tell you if the emotion is "real," it's not tractable for a novelist. You are the authority on your character's reality.

  ### Summary Strategy for Your 5 Hours/Week
  1.  **Months 1–6 (Constitution & Transparency):** Decide if your characters' emotions live in their heads or their guts. Decide if they can be surprised by their own feelings. Write the "Grieving/Unknown" scene here.
  2.  **Months 7–12 (Fittingness & Norms):** Explore the guilt of feeling the wrong thing. Write the "Furious/Known" scene here.
  3.  **Months 13–18 (Attribution & Polish):** Review the manuscript specifically for the gap between what characters say and what the narrative shows. Widen that gap where tension is low.

  **Final Verdict on the "Gap":** You do not need to invent the gap between reported, driving, and imputed emotion. It is the fundamental space where fiction happens. Your job is not to solve the philosophical problem of that gap, but to **widen it** until the tension is unbearable, then let the character fall through.
