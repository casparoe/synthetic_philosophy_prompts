answer: |-
  You have a very sharp eye for historiographical mechanics. You are correct to be unsatisfied with "overdetermination" and "counterfactual test." Your supervisor and friend are pointing in the right direction, but they are using imprecise labels for a specific logical maneuver.

  Here is the breakdown of the terminology, the philosophy behind it, and a coined term for the specific rhetorical move that is bothering you.

  ### 1. The Background Assumption: **Equifinality**
  The philosophical assumption that "an outcome is reachable by many different routes" has an established name in systems theory and social science: **Equifinality**.

  *   **Origin:** Coined by biologist Ludwig von Bertalanffy (General Systems Theory), adopted by sociology and archaeology.
  *   **Definition:** The property of a system where the same end state can be reached from different initial conditions and by different paths.
  *   **In History:** When a historian claims that "the French Revolution would have happened even without the Estates-General meeting," they are asserting that the historical system had *equifinality*. The "pressure" (structural conditions) ensures the "release" (outcome) regardless of the specific "valve" (contingent event) that opens.
  *   **Related Concept:** In complexity theory, this is sometimes called an **Attractor State**. The system (history) tends to settle into a specific configuration (regime change, war) regardless of small perturbations (the weather, the Tuesday garrison).

  ### 2. The Philosophical Move: **Denying Counterfactual Dependence**
  Your supervisor called it the "counterfactual test." They are half-right. In analytic philosophy of causation (specifically the David Lewis tradition), for $C$ to be a cause of $E$, $E$ must *counterfactually depend* on $C$. (i.e., If $C$ had not happened, $E$ would not have happened).

  The move your seminar leaders are making is an attempt to **break counterfactual dependence**. They are arguing:
  $$ \neg C \rightarrow E \text{ (via } C' \text{)} $$
  *"If the Armada weather hadn't been bad ($\neg C$), Spain still loses ($E$) because of guns/ports ($C'$)."*

  In philosophy, this structure is known as **Pre-emption**. Usually, pre-emption involves two *actual* causes where one cuts the other off. In your case, the second cause is merely *potential*. Therefore, the precise technical description is **Hypothetical Pre-emption**.

  ### 3. The Coinage: **The Phantom Backup Maneuver**
  Since there isn't a single canonical term for the *rhetorical* use of this logic in history essays (as opposed to the philosophical structure), I propose we call it **The Phantom Backup Maneuver** (or **Speculative Substitution**).

  **Definition:**
  An argumentative move that demotes an actual contingent cause to "mere detail" by asserting the existence of a hypothetical alternative cause that *would have* produced the same outcome, without providing evidence for the feasibility of that alternative path.

  **What's In (The Structure):**
  1.  **Identification:** A specific, contingent event ($C$) is identified as a cause of Outcome ($O$).
  2.  **Substitution:** The arguer posits a hypothetical alternative ($C'$) that did not happen but *could have*.
  3.  **Equifinality Claim:** The arguer asserts $C'$ would have led to $O$ just as effectively as $C$.
  4.  **Demotion:** Therefore, $C$ is deemed historically insignificant or non-causal.

  **What's Out (The Distinctions):**
  *   **Vs. Overdetermination:** Overdetermination requires two *actual* sufficient causes (e.g., two shooters fire at once). The Phantom Backup relies on a *hypothetical* cause.
  *   **Vs. Structural Determinism:** Determinism is the broad worldview. The Phantom Backup is the specific *tactic* used to enforce that worldview in a specific argument.
  *   **Vs. Chaos Theory:** Chaos theory argues for *sensitivity* to initial conditions (the horseshoe nail matters). The Phantom Backup argues for *insensitivity* (the horseshoe nail doesn't matter because the horse was already lame).

  ### 4. When is it Legitimate vs. a Dodge?
  This is the crux of your frustration. The move is legitimate only when the "Phantom Backup" is grounded in evidence, not just logic.

  **Legitimate Use (Robustness Check):**
  *   **Mechanism:** The historian demonstrates *how* the alternative route would have worked. (e.g., "Even if the garrison hadn't defected, the tax records show the state was insolvent by Thursday, forcing a collapse regardless.")
  *   **Pressure:** There is evidence of sufficient structural "pressure" that makes the outcome highly probable across multiple scenarios.
  *   **Comparative History:** The historian points to similar systems where the specific trigger differed but the outcome was the same (e.g., "In every other province, similar social conditions led to rising, regardless of garrison loyalty.").

  **Illegitimate Use (The Dodge):**
  *   **Bare Possibility:** The historian asserts "something else would have happened" without specifying the *something else*.
  *   **Teleology:** The historian assumes the outcome was destined (a "final cause") and works backward to dismiss obstacles.
  *   **Ignoring Path Dependence:** The historian fails to acknowledge that the *actual* route taken ($C$) might have locked in specific features of the outcome ($O$) that the backup route ($C'$) would not have. (e.g., Spain might have lost anyway, but *how* they lost determines the 17th-century balance of power. The "what" might be robust, but the "how" is contingent.)

  ### Summary for Your Essay
  If you want to critique this move in your coursework, you can write:

  > "This argument relies on a claim of **historical equifinality**, asserting that the outcome was **causally robust** against specific contingencies. However, without demonstrating the mechanism of the alternative pathway, this slips into the **Phantom Backup Maneuver**: dismissing an actual cause based on the speculative sufficiency of a hypothetical one. While this tests for **counterfactual dependence**, it risks conflating structural *possibility* with historical *necessity*."

  This gives you the vocabulary to show you understand the philosophy (equifinality, counterfactual dependence) while precisely naming the rhetorical trick (Phantom Backup) that is annoying you.
