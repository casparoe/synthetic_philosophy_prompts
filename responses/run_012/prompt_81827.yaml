answer: |-
  There is no single, canonical term in political science, philosophy, or transitional justice that perfectly captures this specific configuration. Scholars tend to describe it rather than name it. You will find it discussed under the umbrella of the **"Politics of Regret"** (Jeffrey Olick), analyzed as **"Symbolic Reparation"** (where the symbol substitutes for material redress), or critiqued as **"Performative Contradiction"** (where the act of apologizing reinforces the power of the apologizer). Danielle Celermajer, in *The Sins of the Nation*, describes similar mechanisms as **"Ritual Apologies,"** where the performance of contrition serves to reconstitute the authority of the state rather than diminish it.

  However, none of these terms isolate the specific *temporal function* you have identified: the use of the apology not to bridge the past and present, but to build a wall between them.

  Since you prefer a careful term to a catchy one, I propose classifying this as:

  ### **The Apology of Temporal Severance**

  Here is the definition, the boundaries, and the distinction you requested.

  #### **Definition**
  An **Apology of Temporal Severance** is an official speech act that explicitly acknowledges a specific historical wrong and expresses remorse, but structures that acknowledgment to assert a moral and legal discontinuity between the past perpetrators and the present institution.

  Its primary illocutionary force (what the statement *does*) is not to invite reconciliation or accept liability, but to **establish the "pastness" of the harm.** It converts a moral debt into a historical fact. By naming the wrong plainly, it satisfies the demand for truth; by assigning it wholly to a finished era or specific deceased actors, it negates the demand for restitution. It is a mechanism of **moral closure without material consequence.**

  #### **Inclusions and Exclusions**
  To ensure this term is distinct from the categories you already reject, the Apology of Temporal Severance must meet these criteria:

  *   **It INCLUDES:**
      *   **Explicit Admission:** It must use clear language ("we apologize," "this was wrong"). Vague language ("mistakes were made") pushes it toward a *Non-Apology*.
      *   **Institutional Voice:** It is spoken by the enduring entity (State, Church, University), not just a spokesperson.
      *   **Temporal Bounding:** It explicitly or implicitly frames the wrong as belonging to a closed epoch (e.g., "the policies of that time," "the actions of former administrators").
      *   **Liability Denial:** It contains no offer of reparation, policy change, or acknowledgment of ongoing structural benefit derived from the wrong.

  *   **It EXCLUDES:**
      *   **The Non-Apology:** A non-apology (e.g., "I'm sorry if you were offended") denies the victim's reality. The Apology of Temporal Severance *validates* the victim's reality but confines it to history.
      *   **The Qualified Apology:** A qualified apology adds conditions to the remorse ("We apologize, but we were at war"). The Apology of Temporal Severance offers unreserved remorse for the *past act*, but reserves judgment on the *present obligation*.
      *   **The Bare Expression of Regret:** Regret ("We regret that this happened") distances the speaker from the act. This statement accepts the act ("We apologize for what *we* did") but distances the *current* institution from the *past* institution.

  #### **The Line Between Severance and Failure**
  You asked where the line falls between this and an apology that simply failed. The distinction lies in the **metric of success.**

  *   **A Failed Apology** intends to repair a relationship or accept responsibility but fails to convince the audience due to poor wording, insincerity, or timing. Its goal was *connection*, and it missed.
  *   **An Apology of Temporal Severance** intends to close a file and protect the institution from present liability. Its goal is *separation*, and it succeeds.

  The critics call it a "non-apology" because they measure it against the standard of **Atonement** (which requires amends). The defenders call it a "genuine apology" because they measure it against the standard of **Acknowledgment** (which requires only truth-telling).

  Your suspicion is correct: neither description fits because the statement is not aiming for atonement, nor is it merely acknowledging. It is **administering the past.** It is a bureaucratic act disguised as a moral one. It says, "We have entered this into the record so that we do not have to speak of it again."

  #### **Why This Term Matters**
  Calling it an **Apology of Temporal Severance** allows you to classify it without conceding to the defenders that it is a "full" apology, and without agreeing with the critics that it is "fake." It is real, but its function is **containment.** It treats the wrong not as a wound that needs healing, but as a hazard that needs containment. It names the radiation to declare the site safe.

  In your collection, this label distinguishes statements that open a door to the future from those that lock a door to the past.
