prompt: |-
  I'm a second-year PhD student in philosophy of cognitive science, and I'm putting together a seminar presentation on original vs. derived intentionality. A friend in my lab, who's a cognitive science MA student, keeps summarizing the Dennett-Searle debate for me, and I've noticed he says it with alot of confidence. Here's the summary he gave me last week, almost verbatim:

  Both Dennett and Searle accept the distinction between original and derived intentionality. Dennett's radical claim is that there is no such thing as original intentionality: all intentionality is derived, because it is just a matter of how we interpret a system from the intentional stance. His two-bitser example -- the coin-operated machine Dennett uses to ask whether it can be said to believe that a coin is genuine -- is supposed to prove this. The machine doesn't really believe that a coin is genuine; we just find it useful to talk that way, and the same is true of people. Searle's reply is that the two-bitser has only derived intentionality, since its 'beliefs' are assigned by us, and that this shows Dennett's account is incomplete: derived intentionality must be grounded in original intentionality, which is an intrinsic biological property of conscious brains. So Searle wins the exchange: Dennett is basically a behaviorist who denies that people have beliefs, while Searle keeps the common-sense view that our beliefs are real inner states caused by brain processes. The Chinese room is just a more vivid version of the same point about the two-bitser.

  I have a hunch Dennett is being caricatured here, but I can't articulate where the line is. Can you go through it sentence by sentence and tell me what Dennett would accept, what Searle would wince at, and what is just wrong? In particular, I want to know whether the summary's conclusion -- that Dennett is basically a behaviorist who denies that people have beliefs, so Searle wins -- actually follows from the accurate parts of the summary, or whether it's doing extra work. I don't need a reading list or citations; I just need a seperate audit I can bring to my seminar.
