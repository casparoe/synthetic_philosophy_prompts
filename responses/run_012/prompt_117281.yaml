answer: |-
  1. **Plain Brier**
  This is the only rule that is both strictly proper (incentivizing honest credences) and bounded, which prevents forecasters from hedging away from true extremes to avoid financial ruin. It aligns perfectly with your accuracy-first goal by rewarding closeness to truth without introducing secondary gaming incentives or unbounded risk.

  2. **Log Score**
  While strictly proper and epistemically strict, its unbounded penalties create excessive financial risk in a real-money tournament, encouraging forecasters to hedge their probabilities away from their true beliefs to avoid bankruptcy. It lands second because it theoretically targets truth but practically distorts it through risk aversion.

  3. **Trimmed Log**
  This breaks the proper scoring rule incentive by allowing forecasters to ignore outliers, encouraging them to manage variance across questions rather than maximizing accuracy on every single one. It is better than the bold bonus because it doesn't explicitly reward dishonesty, but it still violates the "nothing else" constraint by adding a layer of portfolio strategy.

  4. **Bold Call Bonus**
  This is the worst option because it directly violates your core philosophy by offering a side-prize for extreme probabilities regardless of calibration. It actively incentivizes forecasters to lie about their credences to hit the 0.95 threshold, making it the only rule that systematically pushes people away from the truth.
