prompt: |-
  I have been asked to referee, informally, a draft chapter written by a colleague in another department — a competent popularizer of the philosophy of science who is not a specialist in probability. He explains the Principal Principle to undergraduates and wants to know whether his treatment is defensible before he sends it to press. I would like you to audit the passage the way a specialist would. Here is how the relevant stretch of the draft runs:

  "One of the deepest principles in the philosophy of probability is the Principal Principle, which we owe to David Lewis. Stated plainly, it says that your subjective probability for any event ought to equal its objective chance. If you know that a particular coin has a 0.5 chance of landing heads, then you are rationally required to believe that it will land heads to degree 0.5, no more and no less. The deeper point is that objective chance is the complete information about a situation: once you know the chances, everything else you know about the event becomes irrelevant, because the chance screens off your other evidence. This is why the principle is sometimes described as a principle of deference — objective chance is the expert and rational credence is the obedient apprentice. One might object that we rarely know the objective chances, but the principle is intended only for idealized agents who do; for the rest of us it functions as a regulative ideal. There is, however, a more serious difficulty. If the chance of heads is 0.5, then among the possible futures compatible with that chance are sequences in which the coin lands heads on every toss; but a coin that landed heads on every toss would not have had a 0.5 chance of heads in the first place. This shows that Lewis's principle is inconsistent, and it has accordingly been abandoned in favor of a corrected version that conditionalizes on the chance being what it is rather than simply deferring to it."

  That is the whole of the passage.

  Please go claim by claim through it and tell me what a specialist in this area would endorse, what is a defensible simplification for an undergraduate audience, what is a genuine error or misrepresentation, and what is merely arguable. I am especially interested in four things. First, the sentence that says one's credence ought to equal the objective chance: is that the principle itself, or a stronger relative of it, and does the difference matter for how the rest of the passage should be read? Second, the claim that chance "screens off" all other evidence, so that once you know the chances everything else becomes irrelevant — is that a fair statement of the underlying idea, and does it sit consistently with the undermining difficulty the author himself raises later, or do the two sit in tension? Third, the deference analogy: is it a harmless pedagogical metaphor, or does it smuggle in a substantive and contested thesis about what kind of principle this is? Fourth, the closing inference — that the principle is inconsistent and has been abandoned — does that follow from the undermining phenomenon he describes, and how do those who actually work on this divide over the question? I am inclined to think the last sentence overstates the situation, but I suspect the earlier, friendlier sentences may be the ones doing the real damage, and I would like to be told if I am wrong about that.

  Please do not give me a reading list or citations; I know the literature and will supply the references myself. What I need is the audit. Where a question is genuinely open among people who work on it, say so explicitly and lay out the main positions rather than presenting any one of them as the settled answer; where something is simply settled, say that too.
reasoning: |-
  Here's a thinking process that leads to the referee report:

  1.  **Analyze the Request:**
      *   **Task:** Audit a draft chapter passage on the Principal Principle (PP) written by a non-specialist popularizer for undergraduates.
      *   **Role:** Specialist referee (informal).
      *   **Input:** A specific paragraph explaining Lewis's Principal Principle.
      *   **Constraints:** No reading lists/citations (I know the literature). Distinguish between settled facts, defensible simplifications, genuine errors, and open debates.
      *   **Specific Focus Areas:**
          1.  Credence = Chance formulation (Principle vs. Stronger Relative).
          2.  "Screening off" claim vs. Undermining tension.
          3.  Deference analogy (Pedagogy vs. Substantive Thesis).
          4.  Closing inference (Inconsistency/Abandonment claim).
      *   **User's Intuition:** Suspects the last sentence overstates things but worries earlier sentences might be the real problem.

  2.  **Analyze the Draft Passage (Claim by Claim):**

      *   *Claim 1:* "One of the deepest principles in the philosophy of probability is the Principal Principle, which we owe to David Lewis."
          *   *Assessment:* Accurate. Standard attribution.
      *   *Claim 2:* "Stated plainly, it says that your subjective probability for any event ought to equal its objective chance."
          *   *Assessment:* This is the rough intuitive idea, but technically imprecise. It misses the conditionalization on admissible evidence.
      *   *Claim 3:* "If you know that a particular coin has a 0.5 chance of landing heads, then you are rationally required to believe that it will land heads to degree 0.5, no more and no less."
          *   *Assessment:* Defensible simplification *if* "know" implies knowing *only* the chance (or that other info is admissible). But as stated, it's vulnerable to the "Crystal Ball" objection (inadmissible evidence).
      *   *Claim 4:* "The deeper point is that objective chance is the complete information about a situation: once you know the chances, everything else you know about the event becomes irrelevant, because the chance screens off your other evidence."
          *   *Assessment:* This is the "screening off" claim. It captures the *intent* of admissibility but risks conflating chance with total physical state. It creates tension with the undermining future discussion.
      *   *Claim 5:* "This is why the principle is sometimes described as a principle of deference — objective chance is the expert and rational credence is the obedient apprentice."
          *   *Assessment:* Standard metaphor (Lewis used "expert"). Generally harmless, but implies a specific normative structure.
      *   *Claim 6:* "One might object that we rarely know the objective chances, but the principle is intended only for idealized agents who do; for the rest of us it functions as a regulative ideal."
          *   *Assessment:* Standard defense against epistemic access worries. Defensible.
      *   *Claim 7:* "There is, however, a more serious difficulty. If the chance of heads is 0.5, then among the possible futures compatible with that chance are sequences in which the coin lands heads on every toss; but a coin that landed heads on every toss would not have had a 0.5 chance of heads in the first place."
          *   *Assessment:* This describes the "Undermining Future" problem (Lewis's own worry). The description is a bit loose (Humean supervenience context needed) but recognizable.
      *   *Claim 8:* "This shows that Lewis's principle is inconsistent, and it has accordingly been abandoned in favor of a corrected version that conditionalizes on the chance being what it is rather than simply deferring to it."
          *   *Assessment:* **Major Red Flag.** "Inconsistent" is too strong (it's inconsistent *given Humean Supervenience*, not logically inconsistent per se). "Abandoned" is false. "Corrected version... rather than simply deferring" is confused (the New Principle still involves deference, just conditionalized differently).

  3.  **Address the Four Specific Focus Areas:**

      *   *Focus 1 (Credence = Chance):* Is it the principle or a stronger relative?
          *   *Analysis:* The PP is $C(A | Ch(A)=x \& E) = x$. The text says $C(A | Ch(A)=x) = x$. This ignores $E$ (admissible evidence). It's a simplification, but a dangerous one because it invites the Crystal Ball objection. It matters because the rest of the passage relies on chance being the *only* relevant info.
      *   *Focus 2 (Screening Off):* Fair statement? Tension with Undermining?
          *   *Analysis:* "Screening off" is the right intuition for *admissible* evidence. However, the Undermining Future problem arises precisely because chance *doesn't* screen off future outcomes in Humean systems (future outcomes determine the chances). So there is a tension. The text presents screening off as a feature of chance itself, whereas Lewis saw it as a feature of the *relation* between chance and admissible evidence, which breaks down in undermining cases.
      *   *Focus 3 (Deference Analogy):* Harmless or Substantive?
          *   *Analysis:* Lewis explicitly used the "expert" analogy. It's not smuggling in a contested thesis; it *is* the thesis. However, it implies the "Initial Principle" formulation. When moving to the "New Principle," the deference model gets complicated (deference to a function that depends on your credence). For undergrads, it's okay, but needs care.
      *   *Focus 4 (Closing Inference):* Inconsistent/Abandoned?
          *   *Analysis:* This is the biggest error.
              *   *Inconsistent:* Only inconsistent if you assume Humean Supervenience (HS). Lewis thought PP + HS = inconsistency. Many reject HS, not PP.
              *   *Abandoned:* False. PP is still the standard starting point. The "New Principle" (NP) is a modification, not a replacement that renders PP obsolete in all contexts.
              *   *Correction:* The description of the correction ("conditionalizes on the chance being what it is rather than simply deferring") is gibberish. Both PP and NP conditionalize on chance. NP conditionalizes on the *conditional* chance function.

  4.  **Synthesize the Audit:**

      *   *Tone:* Professional, constructive, rigorous but acknowledging the undergraduate audience.
      *   *Structure:* Follow the user's four focus points, then a general claim-by-claim breakdown, then a verdict.
      *   *Key Distinction:* Separate "Pedagogical Simplification" from "Philosophical Error."
      *   *User's Intuition:* Validate that the last sentence is indeed the worst offender, but confirm that the "Screening Off" claim is the subtle trap that makes the last sentence seem plausible to a non-specialist.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Point 1 (The Formulation):* The text omits the admissibility clause. This is a standard simplification but makes the "Screening Off" claim later look like a logical truth rather than a substantive constraint. It matters because it sets up the Undermining problem incorrectly.
      *   *Point 2 (Screening Off):* This is the "real damage" the user suspected. If chance *always* screens off everything, undermining futures are impossible by definition. The text creates a contradiction between the middle and end. Need to explain that screening off applies only to *past/present* evidence (admissible), not future outcomes (in Humean systems).
      *   *Point 3 (Deference):* It's Lewis's own metaphor. It's safe, provided one understands "expert" doesn't mean "infallible" but "authoritative on uncertainty."
      *   *Point 4 (Inconsistency/Abandonment):* This needs strong correction. It's not inconsistent *simpliciter*. It's inconsistent with Humean Supervenience. It hasn't been abandoned; it's been refined (New Principle). The description of the refinement is technically wrong.

  6.  **Refining the "Specialist" Voice:**
      *   Avoid jargon where possible, but use it to show competence (e.g., "Humean Supervenience," "Admissibility," "New Principle").
      *   Be decisive on errors (e.g., "Abandoned" is false).
      *   Be nuanced on debates (e.g., Status of HS, Definition of Admissibility).

  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Address four specific points? Check.
      *   Claim-by-claim audit? Check.
      *   Distinguish settled vs. open? Check.

  8.  **Final Polish:** Ensure the distinction between the "Initial Principal Principle" (IPP) and the "New Principal Principle" (NPP) is clear without getting bogged down in formalism. Ensure the user knows *why* the screening-off claim is the linchpin of the confusion. (Self-Correction: Make sure to emphasize that the "Inconsistency" is relative to a metaphysical thesis, not logical.)

  9.  **Constructing the Output:** (Proceed to generate response based on these thoughts.)
answer: |-
  Here is an audit of the draft passage, structured according to your four specific areas of interest, followed by a claim-by-claim breakdown and a final verdict.

  ### 1. The Formulation: Credence Equals Chance
  **Verdict:** *Defensible Simplification with Hidden Costs.*

  The sentence "your subjective probability for any event ought to equal its objective chance" is the standard informal gloss, but it is technically the **Initial Principal Principle (IPP)** stripped of the admissibility clause. The formal principle is $C(A \mid Ch(A)=x \ \& \ E) = x$, where $E$ is admissible evidence.

  *   **Does the difference matter?** Yes, significantly. By omitting the admissibility clause, the text makes the principle look like a direct identity constraint rather than a conditional one. This omission is the root cause of the confusion later in the passage regarding "screening off."
  *   **Specialist View:** Specialists treat the admissibility clause as essential. Without it, the principle is vulnerable to the "Crystal Ball" objection (if I have inadmissible evidence from the future, I should not defer to the chance). For undergraduates, omitting $E$ is common, but only if the author clarifies that "knowing the chance" implies "knowing nothing else relevant." The draft implies chance *makes* other things irrelevant, rather than the principle applying only when other things *are* irrelevant. This shifts the burden from a constraint on evidence to a metaphysical property of chance.

  ### 2. The "Screening Off" Claim
  **Verdict:** *Genuine Error / Conceptual Tension.*

  This is the "real damage" you suspected. The text states: "once you know the chances, everything else you know about the event becomes irrelevant, because the chance screens off your other evidence."

  *   **The Tension:** This claim is in direct tension with the undermining difficulty raised later. If chance *metaphysically* screens off all other evidence (as the text implies), then future outcomes cannot undermine the chance, because the chance is already the complete summary of the probabilistic facts.
  *   **Specialist View:** Chance screens off *admissible* evidence (typically information about the past and present). It does *not* screen off inadmissible evidence (typically information about the future). The Undermining Future problem arises precisely because, in Humean systems, future outcomes determine the chances. Therefore, the chance does *not* screen off the future; rather, the future determines the chance.
  *   **Audit:** The draft presents screening off as a universal feature of chance ("everything else you know... becomes irrelevant"). This is false. It is a feature of the relationship between chance and *admissible* evidence. By stating it universally, the author makes the subsequent undermining objection seem like a logical contradiction rather than a conflict between the Principal Principle and Humean Supervenience.

  ### 3. The Deference Analogy
  **Verdict:** *Harmless Pedagogical Metaphor.*

  *   **Specialist View:** Lewis himself introduced the "expert" analogy. It is not smuggling in a contested thesis; it *is* the thesis Lewis intended. The principle is a norm of rational deference to the chance function.
  *   **Caveat:** The metaphor works well for the Initial Principle. It becomes slightly more complex with the "New Principle" (see below), where one defers to the chance function conditional on the chance function being the one it is. However, for an undergraduate audience, describing chance as an "expert" is standard and safe, provided it doesn't imply the expert is infallible (chances can be wrong about outcomes, just not about their own values).

  ### 4. The Closing Inference: Inconsistency and Abandonment
  **Verdict:** *Substantial Misrepresentation.*

  This is the most damaging part of the passage.

  *   **"Lewis's principle is inconsistent":** This is false. The Initial Principal Principle is not logically inconsistent. It is inconsistent *only if* one assumes **Humean Supervenience** (the view that chances supervene on the total history of particular matters of fact). Lewis believed both PP and HS, realized they clashed due to undermining futures, and concluded HS had to go (or PP had to be modified). Many philosophers reject HS and keep PP. To say the principle *itself* is inconsistent is like saying "Newtonian physics is inconsistent" without mentioning "when combined with Special Relativity."
  *   **"Accordingly been abandoned":** False. The Initial Principal Principle remains the standard working definition in non-Humean contexts and is the starting point for all discussions. It has not been abandoned; it has been refined.
  *   **"In favor of a corrected version that conditionalizes on the chance being what it is rather than simply deferring to it":** This is technically confused. Both the Initial and the "New" Principal Principle involve deference. The "New Principle" (NP) changes the object of conditionalization. Instead of $C(A \mid Ch(A)=x) = x$, the NP roughly suggests $C(A \mid Ch(A)=x) = x$ only when the proposition $Ch(A)=x$ is itself admissible, or more formally, it involves conditionalizing on the *conditional* chance function. The draft's description suggests the new version stops deferring to chance, which is the opposite of the truth. The New Principle is still a principle of deference to chance, just a more sophisticated one that accounts for the possibility that the chance function depends on the future.

  ### Claim-by-Claim Audit

  1.  *"One of the deepest principles... owe to David Lewis."*
      *   **Status:** Endorsed. Standard attribution.
  2.  *"Stated plainly, it says that your subjective probability for any event ought to equal its objective chance."*
      *   **Status:** Defensible Simplification. Acceptable for undergrads if the admissibility caveat is implied.
  3.  *"If you know that a particular coin has a 0.5 chance... rationally required to believe... to degree 0.5."*
      *   **Status:** Defensible Simplification. Assumes "know" excludes inadmissible evidence.
  4.  *"The deeper point is that objective chance is the complete information... chance screens off your other evidence."*
      *   **Status:** **Genuine Error.** Chance screens off *admissible* evidence, not "everything else." This mischaracterization creates the false tension with the undermining argument.
  5.  *"Principle of deference — objective chance is the expert..."*
      *   **Status:** Endorsed. Lewis's own metaphor.
  6.  *"Intended only for idealized agents... regulative ideal."*
      *   **Status:** Endorsed. Standard response to epistemic access worries.
  7.  *"If the chance of heads is 0.5... possible futures compatible... coin lands heads on every toss."*
      *   **Status:** Defensible Simplification. Describes the possibility of unlikely sequences.
  8.  *"But a coin that landed heads on every toss would not have had a 0.5 chance of heads in the first place."*
      *   **Status:** **Arguable / Contested.** This assumes Humean Supervenience (chances are summaries of frequencies). Non-Humeans (propensity theorists, primitivists) deny this. They would say the chance could be 0.5 even if the outcome is all heads (it was just unlucky). The text presents a Humean premise as a fact.
  9.  *"This shows that Lewis's principle is inconsistent..."*
      *   **Status:** **Genuine Error.** It shows PP is inconsistent *with Humean Supervenience*, not inconsistent *simpliciter*.
  10. *"...and it has accordingly been abandoned in favor of a corrected version..."*
      *   **Status:** **Genuine Error.** It has not been abandoned. The "New Principle" is a modification, not a replacement that renders the original obsolete in all contexts. The description of the correction is technically inaccurate.

  ### Final Verdict

  You are correct that the last sentence overstates the situation, but your suspicion that the earlier sentences are doing "real damage" is also correct.

  The passage constructs a narrative arc that is philosophically misleading:
  1.  It defines PP as a simple identity (ignoring admissibility).
  2.  It claims chance universally screens off evidence (ignoring the distinction between admissible and inadmissible).
  3.  It introduces undermining futures (which rely on the Humean view that future outcomes determine chances).
  4.  It concludes PP is inconsistent (ignoring that the inconsistency arises only from combining PP with Humean Supervenience).

  **Recommendation:**
  The passage needs to be rewritten to separate the **normative principle** (PP) from the **metaphysical thesis** (Humean Supervenience).
  *   Clarify that PP applies when you have no "inadmissible" evidence (like crystal balls).
  *   Clarify that the "Undermining" problem only arises if you think chances are determined by the total pattern of events (Humeanism).
  *   Correct the claim that PP is "inconsistent" or "abandoned." It is better to say: "Lewis realized that if chances are determined by the total history of events, the Initial Principle clashes with that metaphysics. He proposed a 'New Principle' to resolve this, though many philosophers simply reject the metaphysics that causes the clash."

  The current draft risks teaching undergraduates that the Principal Principle is a failed, inconsistent theory, which is not the consensus view in the field. It is a live, central, and highly regarded principle, with a known tension in specific metaphysical frameworks.
