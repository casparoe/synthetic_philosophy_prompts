answer: |-
  # Session Design: The Bongard Game
  **Target:** Graduate Seminar in Philosophy of Science
  **Time:** 90 Minutes
  **Participants:** 16 Students (4 Teams of 4)
  **Facilitator:** You (Retired Physicist)

  ## I. Preparation (The Night Before)

  You need three things: a slide deck, a whiteboard setup, and physical handouts.

  **1. The Slides (The Data)**
  Create four slides. Do not label them "Round 1," etc. Just label them "Data Set 1" through "Data Set 4." Use simple black-and-white geometric shapes.
  *   **Data Set 1:**
      *   *Left Panel:* A Square, A Hexagon.
      *   *Right Panel:* A Triangle, A Pentagon.
      *   *(Intended Rule: Even number of vertices vs. Odd number of vertices.)*
      *   *(Obvious Trap: "Boxy shapes" vs. "Pointy shapes".)*
  *   **Data Set 2:** (Add to previous)
      *   *Left Panel:* Add an Octagon.
      *   *Right Panel:* Add a Heptagon (7-sided).
      *   *(Confirms Even/Odd. Confirms Boxy/Pointy.)*
  *   **Data Set 3 (The Twist):**
      *   *Left Panel:* Add a Circle.
      *   *Right Panel:* Add a Semicircle (with the flat edge closed, making it a sector).
      *   *(Note: Define Circle as 1 vertex or 0 depending on your preference, but for this game, define Circle as **1 continuous curve** and Semicircle as **2 lines + 1 curve**. Actually, to keep it simple for a 90-min session, let's adjust the Intended Rule to be simpler.)*
      *   **REVISED PUZZLE FOR MAXIMUM IMPACT:**
      *   **Intended Rule:** Left = Shapes with **straight edges only**. Right = Shapes with **at least one curved edge**.
      *   **Data Set 1:** Left (Square, Triangle). Right (Circle, Semicircle).
      *   **Data Set 2:** Left (Pentagon). Right (Ellipse).
      *   **Data Set 3 (The Twist):** Left (A Square with a wiggly line drawn *inside* it). Right (A Circle with a straight line drawn *inside* it).
      *   *(This breaks the "Straight vs. Curve" rule if they focus on the whole card. The rule is actually about the **boundary** only. This creates the "Cheat" opportunity: "Left is Square or Pentagon or Square-with-wiggle".)*
      *   *Wait, simpler is better for a facilitator to draw/manage.*
      *   **FINAL PUZZLE DECISION:**
      *   **Rule:** Left = Figures containing **closed loops**. Right = Figures that are **open lines**.
      *   **Slide 1:** Left (Circle, Square). Right (Straight Line, Zig-Zag).
      *   **Slide 2:** Left (Figure-8). Right (Spiral that doesn't close).
      *   **Slide 3 (The Twist):** Left (A Circle with a tail sticking out). Right (A Line that curves back on itself but has a gap).
      *   *(This forces the definition of "Closed" to be precise. The "Cheat" rule is simply listing the shapes.)*

  **2. The Whiteboard**
  Draw a scoreboard with four columns (Team A, B, C, D). Leave space below for "Current Leading Hypothesis."

  **3. The Handouts**
  *   **Theory Cards:** 20 index cards per team. They write one hypothesis per card.
  *   **Score Sheet:** A simple grid to track their own points (optional, keeps them engaged).

  ---

  ## II. The Game Rules (Read Aloud to Students)

  "Welcome. For the next 45 minutes, we are not doing philosophy. We are doing pattern recognition.
  1.  **The Goal:** Identify the rule that separates the Left Panel from the Right Panel on the screen.
  2.  **The Process:** I will project Data Sets sequentially. After each set, your team has 5 minutes to write your current best hypothesis on an Index Card and hold it up.
  3.  **Scoring:**
      *   **+10 Points:** If your rule fits all data shown *so far*.
      *   **-20 Points:** If new data appears that breaks your rule.
      *   **+5 Bonus:** At the end, for the 'Most Elegant' rule (my judgment).
  4.  **Constraint:** You must commit. A blank card scores zero. A vague card ('they are different') scores zero.
  5.  **Silence:** No talking between teams once Data Set 1 is up."

  ---

  ## III. Minute-by-Minute Timeline

  | Time | Activity | Facilitator Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Grouping** | Seat them 4x4. Hand out index cards. Read rules. |
  | **05-15** | **Data Set 1** | Project Slide 1. 5 min discussion. Teams hold up cards. Record scores. |
  | **15-25** | **Data Set 2** | Project Slide 2. This should confirm most rules. Teams feel confident. Record scores. |
  | **25-40** | **Data Set 3 (The Twist)** | Project Slide 3. This must break the "Obvious" rule (e.g., Simple Shapes vs. Complex). Watch the room react. Re-score heavily. |
  | **40-45** | **Final Submission** | Teams submit their final "Best Theory." Tally scores. Announce winner (Bragging rights only). |
  | **45-50** | **The Reveal** | Reveal the *actual* intended rule. Acknowledge that other rules *also* fit the data. |
  | **50-90** | **The Debrief** | Transition to philosophy. (Script below). |

  ---

  ## IV. The Debrief Script & Mapping

  *Do not start this section until the game is fully concluded. You are now the Philosopher, not the Game Master.*

  **1. Mapping the Anxiety (Underdetermination)**
  "Look at Data Set 1. How many of you had a rule that fit perfectly? (Hands go up). Now look at Data Set 3. How many of those rules died?
  "In the game, you felt a specific discomfort when Data Set 3 appeared. You had a rule that worked. It was consistent. It predicted the past. And then, without warning, it was wrong.
  "In philosophy, we call this **Underdetermination**. The data you had in Round 1 was consistent with your rule, but it was *also* consistent with the rule I actually had in mind, and consistent with a dozen other rules you didn't think of. The data alone did not force your hand. You chose a rule based on something other than pure logic."

  **2. Mapping the "Cheat" (Theory Choice)**
  "During the game, some of you might have thought: 'The rule is just a list. Left is Shape A, B, or C.' Technically, that rule fits the data perfectly. It scores the same points. But you didn't write it down. Why?
  "Because it felt like a cheat. It felt ugly. In science, we call this **Theory Virtue**. We prefer rules that are simple, unified, and generalizable over rules that are disjunctive lists ('This OR That OR That').
  "Formally, the 'List Rule' is just as valid as the 'Elegant Rule.' Both fit the data. But if you proposed the List Rule, your teammates would have thought you were being difficult. That preference isn't in the data; it's in *you*."

  **3. Mapping the Twist (Falsification)**
  "When Data Set 3 appeared, some of you took it personally. You said, 'But that wasn't fair.'
  "This is the experience of **Falsification**. A single data point can annihilate a hypothesis that felt inevitable. But notice: the data didn't tell you what the *new* rule should be. It only told you what it *wasn't*. You had to leap to a new hypothesis. That leap is not dictated by the data."

  **4. The "Rigged" Objection (The Designer Problem)**
  "I expect one of you to say: 'This is rigged. You knew the answer the whole time. In real science, there is no instructor with an answer key.'
  "You are absolutely right. And that is the most important point of this session.
  "In this game, Underdetermination is a temporary annoyance. Eventually, I will show you enough slides that only my rule fits. You can win.
  "In real physics, there is no 'Intended Rule.' Nature does not have an intention. There is no final slide where the universe says, 'Correct.'
  "The gap between data and theory is not closed by more data. It is closed by **decision**. We decide that one rule is 'natural' and another is a 'cheat.' We decide to stop looking. In this game, I am the tiebreaker. In your careers, *you* are the tiebreaker."

  ---

  ## V. Troubleshooting Predictable Failures

  **1. The Team That Solves It in 90 Seconds**
  *   **Symptom:** They hold up the correct rule after Data Set 1 and disengage.
  *   **Fix:** Approach them privately during Round 2. "Your rule fits, but can you find a *rival* rule that also fits? I want you to play the Devil's Advocate. Find a rule that fits the data but feels 'wrong.' Write that on a separate card."
  *   **Why:** This forces them to engage with underdetermination actively rather than just winning the puzzle.

  **2. The Team That Refuses to Commit**
  *   **Symptom:** They write "Unsure" or leave cards blank to avoid the -20 penalty.
  *   **Fix:** Enforce the rules strictly. "A blank card is a loss of 10 points for non-participation."
  *   **Why:** In science, withholding judgment is sometimes wise, but often progress requires risking a specific claim. The penalty simulates the cost of irrelevance.

  **3. The "Rigged" Objector**
  *   **Symptom:** A student argues during the game that the shapes are arbitrary.
  *   **Fix:** Validate them immediately. "You are correct. I chose these shapes. Keep that thought. We will discuss why that matters in the last 40 minutes."
  *   **Why:** Do not argue during the game. Their objection is actually the learning objective. Park it and use it in the debrief.

  ---

  ## VI. What This Game Cannot Do (Honest Account)

  *You requested a plain account of the limitations. Read this to yourself before the session, and use the second paragraph during the debrief.*

  **1. The Existence of a Solution**
  This game guarantees a solution exists. I designed the figures; therefore, a rule exists. In real science, we do not know if a unified theory exists. The game trains students to find a needle in a haystack, but it implies the needle is definitely there. Real science sometimes requires accepting that the haystack is all there is.

  **2. The Authority of the Designer**
  In the game, when we reveal the answer, the debate ends. I am the authority. In physics, there is no authority. Consensus is reached through social negotiation, citation, and utility, not by checking an answer key. The game resolves underdetermination by appealing to the Designer's mind. Real science must resolve it without a Designer.

  **3. The Cost of Error**
  In this game, losing 20 points is trivial. In experimental physics, betting on the wrong hypothesis can cost ten years of funding or a career. The emotional stakes of the game are simulated; the stakes of the philosophy are not.

  **How to Supply the Missing Pieces (Facilitator Instructions):**
  Because the game cannot deliver the "No Designer" reality, **you** must supply it in the debrief.
  *   **Do not** say: "This shows how science works."
  *   **Do** say: "This shows how *logic* works. Science adds the complication that no one wrote the rules."
  *   **Action:** At minute 80, explicitly state: "If I walked out of this room right now, and you kept generating data, you could never be 100% sure of the rule. You would only be confident. In your research, that confidence is what you publish. Do not mistake it for truth."

  ---

  ## VII. Materials Checklist

  1.  **Projector:** 4 Slides (Data Sets).
  2.  **Whiteboard:** Markers, Scoreboard drawn.
  3.  **Tables:** Arranged in 4 clusters.
  4.  **Index Cards:** 80 total (20 per team).
  5.  **Pens:** One per student.

  *Good luck. You know the data is underdetermined. Now let them feel it.*
