prompt: |-
  I run the population-ethics desk in the cost-benefit shop of a mid-sized government: four analysts, no philosopher on staff, roughly forty rules a year that change how many people there are or when they are born — a pronatalist tax credit, a road-safety standard, a screening program, an immigration measure. We score everything with a value of a statistical life and a QALY framework, and I have come to suspect that this quietly commits us to the repugnant conclusion without our ever having decided to. I want a decision procedure rather than another round of debate.

  Please write one my team can run in two hours per rule: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a finding that the rule is bad, where it must hand the decision to the deputy director because the question is one of values rather than facts, and where our own existing practice — a chain of pairwise judgments we have already made, each of which seemed harmless on its own — has to break if we are to avoid the repugnant conclusion. The procedure should force us to state in writing any critical level, or comparable parameter, that it depends on, so that the number is auditable and binds our later decisions.

  Then run it on three rules: a tax credit whose additional children would have lives that are modestly worth living; a safety standard that saves lives and, as a side effect, lowers fertility; and a cheap treatment for a mild chronic condition. Include the case where the procedure tells me something I will not like, and say plainly what it cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Head of population-ethics desk in a government cost-benefit shop.
      *   **Team:** 4 analysts, no philosopher.
      *   **Workload:** ~40 rules/year affecting population size/timing (tax credits, safety, screening, immigration).
      *   **Current Method:** VSL (Value of a Statistical Life) + QALYs (Quality-Adjusted Life Years).
      *   **Problem:** Suspects current method implicitly commits them to the Repugnant Conclusion (RC) without explicit decision. Wants to avoid RC but needs a practical *decision procedure*, not more theory.
      *   **Requirements:**
          *   Run time: ~2 hours per rule.
          *   Structure: Ordered questions, sufficient answers, stop conditions (rule is bad), escalation points (deputy director/values), identification of where existing practice breaks.
          *   Auditability: Must force written statement of critical levels/parameters.
          *   Application: Run on three specific cases (pronatalist tax credit, safety standard lowering fertility, mild chronic condition treatment).
          *   Honesty: Include uncomfortable findings and acknowledge limitations.

  2.  **Deconstruct the Ethical Problem:**
      *   *The Repugnant Conclusion (Parfit):* A world with a massive population of lives barely worth living is better than a world with a smaller population of very happy lives, given Total Utilitarianism (summing welfare).
      *   *Current Practice (VSL + QALY):* This is essentially Total Utilitarianism. Every added QALY counts positively. If a policy adds many people with low positive QALYs, the sum can outweigh a policy adding fewer people with high QALYs. This leads directly to RC.
      *   *The Fix:* Need a "Critical Level" or "Negative Utilitarian" constraint. We need to say: A life must be *above* a certain threshold to count as a net positive for the *purpose of population policy*, or we need to prioritize average welfare over total welfare in specific contexts.
      *   *Constraint:* Government context. Cannot just say "don't have kids." Must fit within cost-benefit analysis (CBA) frameworks. Needs to be auditable.

  3.  **Design the Decision Procedure (The "Population-Impact Audit" or PIA):**
      *   *Goal:* Break the chain of pairwise judgments that leads to RC.
      *   *Time Limit:* 2 hours. Needs to be a checklist/flowchart style.
      *   *Key Mechanism:* Establish a "Critical Welfare Threshold" (CWT). Below this, adding lives is not a benefit in the CBA, even if life is "worth living" for the individual.
      *   *Steps:*
          1.  **Demographic Impact Screen:** Does this rule change $N$ (population) or $t$ (timing)? If no, standard CBA. If yes, proceed.
          2.  **Welfare Estimation:** What is the expected QALYs/welfare of the *marginal* lives affected?
          3.  **Critical Level Check:** Is this welfare above the agency's declared Critical Level? (This is the audit point).
          4.  **Aggregation Rule:** Do we sum (Total) or average (Average)? To avoid RC, we need a hybrid or a constraint. Let's use a *Critical-Level Utilitarianism* approach. Only QALYs above the critical level count towards the "benefit" column for *new* lives.
          5.  **Escalation:** If the Critical Level is contested or the trade-off involves existing vs. future people in a way that violates rights/equity, kick to Deputy.
          6.  **Consistency Check:** Does this contradict previous rulings? (The "Chain Breaking" point).

  4.  **Drafting the Procedure (Iterative Refinement):**
      *   *Refinement on "Critical Level":* The user needs to *set* this number. I can't set it for them, but the procedure must force them to write it down. Let's call it the "Minimum Acceptable Welfare Threshold" (MAWT).
      *   *Refinement on "Chain Breaking":* The RC arises from transitivity (A > B, B > C, ... Z > A). To break it, we need a non-aggregative constraint. The procedure must flag when a series of small gains leads to a large loss in quality.
      *   *Refinement on Time:* 2 hours means data gathering is assumed done. This is the *ethical scoring* phase.

  5.  **Running the Procedure on the Three Cases:**
      *   *Case 1: Pronatalist Tax Credit.*
          *   Effect: Increases $N$.
          *   Welfare: "Modestly worth living."
          *   Test: Is "modest" above the MAWT? If MAWT is set high to avoid RC, this might fail. This is the "uncomfortable finding."
      *   *Case 2: Safety Standard (Saves lives, lowers fertility).*
          *   Effect: Saves existing lives (high value), reduces future $N$.
          *   Test: Standard VSL applies to saved lives. Reduction in $N$ is not a "cost" if the unborn lives would be below MAWT, or is neutral. This usually passes easily but highlights the asymmetry.
      *   *Case 3: Cheap Treatment for Mild Chronic Condition.*
          *   Effect: Improves QOL for existing people. No $N$ change.
          *   Test: Standard QALY. But wait, does it free up resources for population policies? Keep it simple: Standard CBA, but check if it sets a precedent for welfare weighting.
          *   *Correction:* To make it relevant to population ethics, let's frame it as: Does improving existing lives take precedence over adding new ones? This tests the "Average vs. Total" conflict.

  6.  **Addressing the "Uncomfortable Finding" and "Limitations":**
      *   *Uncomfortable:* The procedure might dictate rejecting the pronatalist credit because the lives added don't meet the Critical Level, even if they are "worth living." This contradicts standard pronatalist intuition.
      *   *Limitations:* Cannot solve the "Non-Identity Problem." Cannot determine the *exact* MAWT objectively (it's a value judgment). Cannot account for very long-term existential risk fully.

  7.  **Final Polish:**
      *   Tone: Professional, bureaucratic but ethically rigorous.
      *   Format: Clear headers, step-by-step instructions.
      *   Audit Trail: Emphasize the written record.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Critical-Level Utilitarianism too philosophical?
      *   *Fix:* Frame it as a "Policy Threshold" similar to a discount rate. Governments already set discount rates; this is a "Welfare Discount Threshold."
      *   *Critique:* Will the Deputy Director accept this?
      *   *Fix:* The procedure explicitly escalates the setting of the threshold to the Deputy. The analysts *apply* it, the Deputy *sets* it. This protects the analysts and ensures political accountability.
      *   *Critique:* How to break the chain of pairwise judgments?
      *   *Fix:* Include a "Precedent Conflict Check." If this decision + past decisions = RC, this decision must be vetoed.

  9.  **Finalizing the Output Structure:**
      *   Part 1: The Procedure (The "Population-Impact Protocol").
      *   Part 2: Application to the Three Rules.
      *   Part 3: The Uncomfortable Truth & Limitations.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a procedural document designed for immediate operational use. It does not solve population ethics theoretically; it creates a bureaucratic firewall against the Repugnant Conclusion by forcing explicit parameterization of values that are currently implicit.

  ### Part 1: The Population-Impact Protocol (PIP)
  **Time Allocation:** 120 Minutes
  **Required Inputs:** Standard CBA spreadsheet, Demographic Impact Estimate, QALY Projection.
  **Output:** A signed "Ethical Audit Sheet" attached to the Regulatory Impact Analysis.

  #### Phase 1: The Demographic Trigger (15 Minutes)
  **Question 1:** Does this rule materially change the expected number of persons ($N$) or the timing of their existence ($t$) compared to the baseline?
  *   *Data Source:* Demographic modeling unit.
  *   *Sufficient Answer:* Yes/No with magnitude (e.g., "+5,000 births/year").
  *   *If No:* Proceed with standard VSL/QALY CBA. **Stop.**
  *   *If Yes:* Proceed to Phase 2.

  #### Phase 2: The Marginal Welfare Assessment (45 Minutes)
  **Question 2:** What is the expected average lifetime welfare (in QALYs or equivalent) of the *marginal* persons created or prevented by this rule?
  *   *Note:* Do not use the average welfare of the *current* population. Estimate the welfare of the specific cohort affected by the policy change.
  *   *Sufficient Answer:* A numerical range (e.g., "60–65 QALYs at 0.8 quality weight").
  *   *Constraint:* If the estimate relies on the assumption that "existence is always a benefit," flag this as **Assumption Risk**.

  #### Phase 3: The Critical Level Check (30 Minutes)
  **Question 3:** Does the welfare of these marginal persons exceed the Agency's **Critical Welfare Threshold (CWT)**?
  *   *Definition:* The CWT is the minimum quality of life required for the creation of a new life to count as a *net benefit* in the government's accounting. Lives below this line may be "worth living" for the individual, but adding them does not increase social value.
  *   *Audit Requirement:* **This number must be written on the Audit Sheet.** It cannot be implicit.
  *   *Current Status:* If no CWT exists, **Stop and Escalate to Deputy Director.** You cannot run this protocol without a declared CWT. (See *Limitations* below).
  *   *If Welfare > CWT:* Count added QALYs as positive benefits.
  *   *If Welfare < CWT:* Count added QALYs as **neutral** (zero benefit) in the social welfare function, even if positive for the individual.
  *   *If Welfare < 0 (Suffering):* Count as negative cost.

  #### Phase 4: The Chain-Breaker Test (30 Minutes)
  **Question 4:** Does approving this rule, combined with the last 10 rules we approved, commit us to a trajectory where total welfare rises while average welfare falls below the CWT?
  *   *Procedure:* Look at the running tally of population-impacting rules. If you have approved five pronatalist measures for low-welfare cohorts and rejected one for a high-welfare cohort, you are drifting toward the Repugnant Conclusion.
  *   *Sufficient Answer:* A written statement: "This decision is consistent with the trajectory of average welfare maintenance" OR "This decision accelerates the dilution of average welfare."
  *   *Stop Condition:* If the answer is the latter, the rule is **Flagged as Ethically Hazardous**. It requires Deputy Director sign-off even if the CBA is positive.

  #### Phase 5: Escalation (Variable)
  **Condition for Escalation:**
  1.  No CWT is currently codified.
  2.  The rule trades existing high-welfare lives for new low-welfare lives (e.g., reallocating healthcare funds to pronatalist subsidies).
  3.  The Chain-Breaker Test is failed.

  **Action:** Send to Deputy Director with the note: *"This decision requires a value judgment on the weight of potential people vs. existing people. Current CBA framework is insufficient."*

  ***

  ### Part 2: Running the Protocol on Three Rules

  *Assumption for this exercise:* Your agency has not yet codified a CWT. I will simulate the setting of one to show where the friction occurs. Let us assume the Deputy Director sets a provisional CWT at **0.7 Quality-Adjusted Life Years (QALYs) per year of life** (roughly a life with minor but manageable chronic limitations).

  #### Rule A: The Pronatalist Tax Credit
  *   **Policy:** $5,000/year per child for families in low-income brackets.
  *   **Demographic Trigger:** Yes. Estimates +2,000 births/year.
  *   **Marginal Welfare:** The children will be born into poverty. Expected lifetime QALY weight is estimated at 0.65 (due to stress, health access, environmental factors), though life is still "worth living" (>0).
  *   **Critical Level Check:** 0.65 < 0.70 (CWT).
  *   **Protocol Finding:** **Neutral Benefit.** The QALYs generated by these new children count as *zero* in the social benefit column. Only the economic multiplier effects count.
  *   **Chain-Breaker:** If you have approved other low-welfare pronatalist measures, this triggers **Escalation**.
  *   **Result:** The rule likely fails the CBA because the "population benefit" you usually claim is now nullified.
  *   **Uncomfortable Truth:** You must recommend rejecting (or downsizing) a policy that helps poor families have children because, ethically, you have decided not to incentivize the creation of lives below a certain quality threshold.

  #### Rule B: The Road-Safety Standard
  *   **Policy:** Stricter barriers on highways.
  *   **Demographic Trigger:** Mixed. Saves 50 existing lives/year. Lowers fertility slightly (people feel safer, delay childbirth, or resource shift). Net $N$ change is negligible, but composition changes.
  *   **Marginal Welfare:**
      *   Saved lives: Existing, high welfare (average 0.85).
      *   Prevented births: Estimated welfare 0.75.
  *   **Critical Level Check:** Both exceed CWT (0.70).
  *   **Protocol Finding:** **Positive Benefit.** Saved lives count fully. Prevented births count as a loss of potential value, but since the saved lives have higher welfare density, the trade-off is positive.
  *   **Chain-Breaker:** Pass. This prioritizes existing high-welfare lives over potential lives.
  *   **Result:** Approve. This aligns with standard VSL but now has an ethical justification that doesn't rely on Total Utilitarianism.

  #### Rule C: Cheap Treatment for Mild Chronic Condition
  *   **Policy:** Subsidize medication for a non-fatal, annoying condition (e.g., severe eczema) for existing population.
  *   **Demographic Trigger:** No direct change to $N$.
  *   **Marginal Welfare:** Increases QALY weight for 100,000 existing people from 0.75 to 0.80.
  *   **Critical Level Check:** N/A (Applies to new lives).
  *   **Protocol Finding:** **Positive Benefit.** Standard QALY calculation applies.
  *   **Chain-Breaker:** **Crucial Test.** Compare cost per QALY here vs. Rule A (Tax Credit).
      *   Rule C: High cost per QALY, but improves *existing* people.
      *   Rule A: Low cost per "life," but creates *new* people below CWT.
  *   **Result:** If budget is fixed, Rule C **must take precedence** over Rule A under this protocol. Improving existing lives above the CWT is ethically superior to adding new lives below it.
  *   **Escalation:** If the Treasury argues Rule A has better "economic growth" metrics, you must escalate. The protocol prioritizes Welfare Density over GDP growth when CWT is at risk.

  ***

  ### Part 3: The Uncomfortable Findings and Limitations

  You asked for the place where the procedure tells you something you will not like, and what it cannot settle.

  #### 1. The Uncomfortable Finding (The "Anti-Pronatalist" Bias)
  The procedure will likely force you to recommend against **Rule A (The Tax Credit)** or similar social supports that increase fertility among the disadvantaged, *if* their expected quality of life falls below your Critical Welfare Threshold.
  *   **Why you won't like it:** It looks like eugenics. It looks like saying "poor people shouldn't have kids."
  *   **The Defense:** You are not saying their lives aren't worth living. You are saying that *government policy* should not actively incentivize the creation of lives that struggle, when resources could improve existing lives. You are shifting from "Maximize Population" to "Maximize Flourishing."
  *   **The Audit Trail:** Because you must write down the CWT (e.g., 0.7 QALYs), you can be held accountable. If 0.7 is too high, the Deputy Director must lower it publicly. You cannot hide behind "VSL implies more is always better."

  #### 2. Where the Procedure Breaks (The Non-Identity Problem)
  The PIP cannot solve cases where the policy changes *who* is born, rather than *how many*.
  *   **Example:** A climate policy that delays conception by 2 months. The children born later are different people than those who would have been born earlier.
  *   **Limitation:** If the later children have lives worth living (above CWT), the PIP says "Neutral." It cannot easily account for the intuition that we might owe something to the *specific* people who would have existed under the alternative policy.
  *   **Action:** Escalate these to the Deputy. This is metaphysics, not accounting.

  #### 3. Where Your Existing Practice Must Break
  Your current practice relies on **transitivity**:
  *   *A is better than B.*
  *   *B is better than C.*
  *   *Therefore, A is better than C.*
  *   *Repeat 1,000 times until Z is a world of miserable people, but Z > A.*

  The PIP breaks this chain at **Phase 4 (The Chain-Breaker Test)**.
  *   You must explicitly state when a series of "harmless" decisions accumulates into a "repugnant" trajectory.
  *   **The Break Point:** You must be willing to reject a policy that is *locally* beneficial (positive CBA) because it is *globally* corrosive to the agency's ethical consistency.
  *   **Requirement:** You need a "Register of Population Decisions." You cannot run Phase 4 without a memory of the last 10 rules. If you don't have this register, the procedure halts.

  #### 4. The Value Judgment You Cannot Make
  The PIP forces you to write down the **Critical Welfare Threshold**.
  *   **The Hard Truth:** There is no factual answer to what the CWT should be. Is it 0.5? 0.7? 0.9?
  *   **The Procedure's Limit:** It cannot calculate this number. It only forces you to admit you are using one.
  *   **Responsibility:** This number belongs to the Deputy Director (or the Minister), not your desk. Your desk's job is to say: *"If the CWT is X, the rule fails. If the CWT is Y, the rule passes. Which is it?"*
  *   **Auditability:** Once written, that number binds you. You cannot use 0.7 for the Immigration Measure and 0.5 for the Tax Credit. Consistency is the only shield against arbitrariness.

  ### Summary Instruction for Your Team
  1.  **Draft the "Critical Welfare Threshold" memo** for the Deputy Director immediately. Propose a provisional number (e.g., 0.7 QALYs) based on current population averages. Ask them to sign it.
  2.  **Implement the Register.** Start logging the demographic impact of every rule.
  3.  **Run the PIP.** Attach the Audit Sheet to every Regulatory Impact Analysis.
  4.  **Accept the Friction.** When a rule fails because of the CWT, do not fudge the numbers. Send it to the Deputy with the note: *"This rule increases population but decreases average welfare density below our declared threshold."*

  This stops the quiet drift into the Repugnant Conclusion by making the cost of avoiding it explicit, auditable, and political.
