  I can't get these to fall out of one rule. If the reason I won't pay $100 for the standard game is that tiny probabilities of huge payoffs shouldn't move me much, that seems like it should apply to the infinite one too, but it doesn't feel that way at all, the infinite one feels categorically different. My roommate says I'm just doing probability weighting and being inconsistent about it, but I don't buy that. My own half-baked idea is that it's about legibility: I can picture the world where the casino hands me a trillion dollars and I buy a house, but I can't really picture the world where the coin comes up tails sixty times and I get 10^18 dollars, and the infinite case isn't picturable either but it's a different kind of unpicturable. Which is obviously not a principle.

  So what I want from you: tell me whether there's one principle — or two I'd have to choose between — that gets all five of these, or whether some of my verdicts have to go. State it precisely, say which part of it is doing the work in each case, and then apply it to the ones I haven't thought about: the same game with a biased coin where long runs are less likely than they are now, so the EV is actually finite; the version where I'm allowed to sell my position after each flip instead of being stuck with it; and the version of the infinite-good lottery where the infinity gets replaced by a googolplex years of flourishing. And be straight with me about which of my five answers the principle can't accommodate, and whether you think I should give that one up or whether I'm right and my roommate is wrong. Don't bother with a reading list — I know roughly what's out there and I'll track down references myself. I want the principle and what it says about the extra cases.
