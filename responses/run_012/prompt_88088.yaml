prompt: |-
  ok so for my philosophy club zine i have to write a parody piece and i'm definately going to do it on foucault because we read alot of foucault in class and now i can't stop noticing how much my school acts like a prison with better branding. can you write me a leaked internal FAQ from my school district's new "Student Wellness and Engagement Office" about their app, Pathways? it tracks bathroom breaks, hallway time, and "engagement" through the camera on your school laptop, and gives you a Student Success Score that goes on your permanent record. the district keeps calling it "care" and "support." i want it deadpan, like a real district FAQ, 600-700 words, numbered Q&As, with a headline. the jokes have to come from actually getting foucault right, not just "surveillance bad." specifically, can you build it around at least three of these: the examination (where being tested or inspected makes you visible and ranks you at the same time), normalizing judgment (you're measured against a standard and against everyone else), hierarchical observation (someone watches from above), docile bodies (training bodies to be efficient and compliant), power/knowledge (the data doesn't just describe you, it makes a kind of person), the productive view of power (power isn't just a guy saying no, it makes things), capillary power (it works through everyday routines, not just top-down), and the idea that the system produces the delinquent it claims to fix. don't name-drop foucault in the piece itself, keep it in-universe and relentlessly upbeat. the satire should land the stuff people object to: that care language hides control, that you start watching yourself, that resisting just gets folded back in as a "growth opportunity," and that the whole thing is less about punishment than about making you useful. it should be funny to someone who knows the foucault and readable to someone who doesn't. maybe include one quote from a "concerned" school board member or a vendor who's clearly loving it. also, at the end, outside the piece, add a short note (3-4 sentences) saying how confident you are that you represented foucault's ideas accurately, and single out the one point you're least sure of — like if you're not sure whether the panopticon is supposed to be a literal model or a metaphor, or whether biopower is the right concept here, or whether foucault would say resistance is always recuperated. if you're leaning on a contested reading, say so. thanks, this is due friday lol.
