  **PATHWAYS™ STUDENT SUCCESS PLATFORM: INTERNAL FAQ (DRAFT 4.2)**
  **From:** Student Wellness and Engagement Office
  **To:** All Faculty and Staff
  **Subject:** Maximizing Visibility for Care

  **1. How does the Student Success Score function as a support tool?**
  The Pathways app utilizes continuous data aggregation to render every student fully visible to our support network. Historically, students could hide behind silence or absence. The Success Score eliminates these blind spots by converting behavior into measurable knowledge. This is not ranking; it is illumination. By constantly examining attendance, laptop camera engagement, and transitional latency, we produce a definitive truth about the student. This knowledge allows us to intervene before a deviation becomes a failure. The score does not merely describe the student; it constitutes their academic identity, ensuring that no potential goes unquantified.

  **2. Why is it necessary to track bathroom breaks and hallway movement?**
  Efficiency is a component of wellness. Unstructured time in hallways or restrooms represents lost opportunities for engagement. By monitoring these intervals, Pathways encourages students to optimize their bodily routines to align with institutional schedules. We are training students to manage their physical presence with precision, reducing friction between classes. This hierarchical observation ensures that movement serves educational goals. When a student learns to minimize transitional latency, they become a more effective vessel for learning. We are not restricting freedom; we are streamlining the body to maximize its utility within the learning environment.

  **3. What happens if a student attempts to disable camera tracking or questions the data?**
  Disengagement is itself a vital data point. When a student obscures their face or contests their Success Score, Pathways flags this as a "Wellness Opportunity." This allows us to identify individuals who require additional normalization support. Resistance is not treated as disobedience, but as a symptom of misalignment with community standards. We then compare this behavior against the median engagement curve to determine the appropriate intervention. By folding dissent back into the system as a need for care, we ensure that every action, even opposition, contributes to the student's profile. As our lead vendor, OmniLearn, stated: "We aren't just fixing behavior; we are building the whole child through total environmental integration."

  **4. Is the Pathways Score part of a punitive disciplinary record?**
  Absolutely not. Punishment implies a negative restriction of power. Pathways represents a productive application of authority. We are not saying "no"; we are generating useful outcomes. The goal is to produce compliant, efficient learners who internalize surveillance as self-care. Power flows through the everyday routines of logging in and walking halls, not just from the principal's office. This capillary network ensures that discipline is everywhere and nowhere. If a student ends up with a low score requiring mandatory remediation, it is not because the system punished them, but because the system identified a need to make them more useful. The system does not create delinquents; it reveals those who require further shaping to meet the standard of success.

  ***

  **Author's Note on Foucaultian Accuracy**
  I am fairly confident this piece accurately captures Foucault's concepts of the examination, docile bodies, and the productive nature of power, particularly how data creates the subject rather than just observing them. I am least sure about my application of the "production of the delinquent," as Foucault argued the system *creates* the criminal to justify itself, whereas here I framed resistance as being recuperated into "care," which leans slightly more toward Marcuse than strict Foucault. I'm also hedging on whether "capillary power" is the best term for the laptop surveillance, as Foucault usually reserved that for broader social networks rather than specific software tools.
