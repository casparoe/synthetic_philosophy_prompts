answer: |-
  **Exam Question**

  **Assess the thesis that the Simulation Argument undermines longtermist fanaticism.** In your answer, you must distinguish between interpreting the Simulation Argument as a claim about the *size* of the far future (reducing the probability of astronomical value) versus a claim about the *identity* of the far future (relocating the locus of value). Furthermore, clarify whether you treat fanaticism primarily as a decision-theoretic vice (vulnerability to Pascal's Mugging) or as a substantive ethical thesis about what matters. Your essay should defend a determinate verdict on whether the Simulation Argument provides a rational escape from fanaticism.

  ***

  **Model Answer**

  The thesis that the Simulation Argument (SA) undermines longtermist fanaticism is false. While the SA introduces uncertainty about our ontological status, it does not sufficiently reduce the expected value (EV) of longtermist interventions to negate fanaticism. This is because the SA functions primarily as a claim about the *identity* of future inhabitants rather than the *size* of the future's value, and because fanaticism, properly understood, is a robust feature of expected utility maximization rather than a mere decision-theoretic bug.

  To see why the SA fails as a dampener, we must first separate the probability of being simulated from the probability of a large future existing. Bostrom's trilemma suggests we are likely either in a simulation or that post-human civilizations are extinct. However, even if we are in a simulation, the *base reality* containing the simulators must possess the computational capacity to run ancestor simulations. This implies the base reality itself has access to astronomical resources. Therefore, the SA does not necessarily lower the probability that *a* vast future exists (size); it merely shifts the probability mass regarding *where* that future is located (identity). If value is substrate-independent, the total amount of value in the multiverse (base + sims) remains astronomical. Consequently, the stake ($V$) in the EV calculation ($P \times V$) remains high, even if our confidence in our specific location within that future is diluted.

  Secondly, we must characterize fanaticism correctly. If fanaticism is merely a decision-theoretic vice—a vulnerability to Pascal's Mugging where unbounded utility functions allow tiny probabilities to dominate—then the SA might seem to help by lowering $P$. However, longtermist fanaticism is better understood as a substantive ethical thesis: that the sheer number of potential future lives creates a moral demand that outweighs significant present costs. On this substantive view, the SA does not eliminate the potential lives; it merely complicates our causal access to them. Unless the SA implies that simulations are systematically short-lived (the "shutdown" objection), the astronomical value persists. Even if simulations are often terminated, the base reality future remains intact. Since we cannot know with high confidence that we are in a short-lived simulation rather than the base reality, the expected value of securing the base future remains dominant.

  A strong counter-argument suggests that if we are simulated, our causal power over the base future is negligible. If our actions only affect the simulation, and the simulation is a closed box with limited duration, then the "astronomical" value is an illusion. This treats the SA as a claim about size: if we are sims, the *relevant* future is small. However, this relies on the assumption that simulators do not care about the simulation's outcome or that the simulation does not influence the base reality (e.g., via ancestral selection pressures or resource allocation decisions by the simulators). If there is any non-zero probability that our actions influence the base reality's trajectory, the EV remains astronomical. Given the stakes, even a tiny probability of causal leakage sustains the fanatic's conclusion.

  The crux of the matter is substrate independence and causal access. The SA only undermines fanaticism if one assumes that simulated value is negligible *and* that simulated agents have zero causal influence on the base reality. Neither assumption is warranted. The SA relocates value rather than shrinking it. Therefore, the rational agent maximizing expected utility must still prioritize the far future. The Simulation Argument does not provide a rational escape from fanaticism; it merely adds a layer of indexical uncertainty to an already overwhelming ethical demand.

  ***

  **Marking Scheme (25 Marks)**

  **1. Understanding of the Simulation Argument (5 Marks)**
  *   **5:** Correctly explicates the trilemma without treating disjuncts as having identical implications. Distinguishes between $P(\text{Sim})$ and $P(\text{Large Future})$.
  *   **3:** Explains the trilemma but conflates the probability of being simulated with the probability that the far future is large.
  *   **1:** Recites the trilemma without analyzing its impact on future value.
  *   **0:** Factual errors regarding Bostrom's argument.

  **2. Distinction: Size vs. Identity (5 Marks)**
  *   **5:** Explicitly argues whether SA reduces the magnitude of value (Size) or shifts the location of agents (Identity). Uses this distinction to drive the verdict.
  *   **3:** Mentions the distinction but fails to apply it to the conclusion about fanaticism.
  *   **1:** Treats SA solely as a probability discount without considering the relocation of value.
  *   **0:** Ignores the distinction entirely.

  **3. Conception of Fanaticism (5 Marks)**
  *   **5:** Clearly defines fanaticism as either a decision-theoretic artifact (EV maximization) or a substantive moral claim, and maintains consistency.
  *   **3:** Defines fanaticism but wavers between the two conceptions without resolution.
  *   **1:** Equates fanaticism simply with "caring about the future."
  *   **0:** No definition provided.

  **4. Engagement with Counter-Argument (5 Marks)**
  *   **5:** Presents a serious argument for the opposite verdict (e.g., the "Shutdown" objection or causal isolation of sims) and offers a specific rebuttal.
  *   **3:** Presents a counter-argument but the rebuttal is weak or irrelevant.
  *   **1:** Mentions a counter-argument without engaging with it.
  *   **0:** No counter-argument presented.

  **5. Verdict and Crux (5 Marks)**
  *   **5:** Commits to a determinate thesis. Clearly identifies the crux (e.g., substrate independence or causal access).
  *   **3:** Commits to a thesis but the crux is vague or hedges excessively.
  *   **1:** No clear verdict (sits on the fence).
  *   **0:** Contradictory conclusion.

  **Specific Penalties (Deducted from Total)**
  *   **-3 Marks:** Treating the three disjuncts of the trilemma as having identical ethical implications.
  *   **-3 Marks:** Conflating the probability of *being* simulated with the probability that the *far future* is small.
  *   **-2 Marks:** Failing to distinguish between decision-theoretic and substantive definitions of fanaticism.
  *   **-5 Marks:** Answer is purely expository (reciting the argument) without adjudicating the thesis.
