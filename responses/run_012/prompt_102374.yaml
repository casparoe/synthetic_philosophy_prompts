answer: |-
  **DEAR AUNT VERITY**
  *The National Gazette | Culture & Compliance*

  Welcome to this week's column on navigating the Statutes of Taste. Please remember the fundamental principle: aesthetic knowledge is non-transferable. You may share facts regarding provenance or history, but never merits. To claim beauty on another's say-so is not merely rude; it is epistemic fraud.

  **Dear Aunt Verity,**
  My late husband's will bequeaths me his opinion on the *Ring Cycle*, insisting I "hold it as truth" for the sake of his legacy. He wrote explicitly that *Siegfried* is sublime. May I repeat this judgment at dinner parties, or does his death void the testimony? I wish to honour him without breaking the law.
  *— Grieving in Bayreuth*

  **Dear Grieving,**
  You may repeat that he *held* it sublime, for that is a fact of biography and remains true regardless of his passing. However, under Section 4 of the Aesthetic Integrity Act, you cannot claim the sublimity as knowledge unless you have endured the hours yourself. To assert the work's merit on his say-so is merely to report his psychology, not the music's quality. Cherish his conviction as a historical artifact, but withhold your own endorsement until the horn sounds for you. To do otherwise would be to pretend to an experience you have not had.
  *— Verity*

  **Dear Aunt Verity,**
  I pay a licensed connoisseur to view exhibitions on my behalf and send me reports stating which paintings are masterpieces. I believe her reports implicitly. Do I now know the paintings are good, or do I simply know she is reliable? I wish to list these works in my portfolio as known virtues.
  *— Outsourced Eye*

  **Dear Outsourced,**
  You know she is reliable; you do not know the paintings are good. Knowledge of merit requires acquaintance. Your subscription purchases trustworthy testimony, which is a commodity, but not aesthetic knowledge, which is a state of being. You possess the data that the art is valued, not the value itself. Do not claim expertise; claim a well-informed portfolio. There is no shame in relying on agents for information, provided you do not confuse their seeing with your knowing.
  *— Verity*

  **Dear Aunt Verity,**
  As a gallery guide, I am legally required to recite the Board's verdicts ("This is a triumph") to visitors. Yet I am forbidden to form private judgments while on duty. When I speak these words, am I lying? I fear I am committing perjury against my own senses.
  *— Muted Docent*

  **Dear Muted,**
  You are not lying, provided you utilise the passive voice. "This is designated a triumph" remains true regardless of your internal state. You are a conduit for public certification, not a source of private insight. So long as you do not imply the judgment originates in your own sensibility, you remain compliant. Speak for the Board, not the self. Your uniform signifies your role as a transmitter of established verdicts, not as a witness to beauty.
  *— Verity*

  **Dear Aunt Verity,**
  I wept at a film yesterday. Later, I read it was certified "banal" by the Censors. I feel moved, but I fear I am mistaking my tears for quality. Can I be wrong about my own response? I do not wish to value what is worthless.
  *— Confused Spectator*

  **Dear Confused,**
  You cannot be wrong about the tears; they are physiological facts. You can be wrong about what they signify. A certified banal work may provoke sadness, but it remains banal. Do not conflate the intensity of your reaction with the objective standing of the object. Your feeling is yours; the merit belongs to the State. Trust the certificate, not the pulse. It is possible to be genuinely moved by a failure, provided you acknowledge the failure as such.
  *— Verity*

  *Keep trusting the law, and the law will keep trusting you. Send your queries to the usual address.*
  *— Aunt Verity*
