answer: |-
  ### 1. The Exam Question

  **Philosophy of Biology: Final Examination**
  **Time Allowed:** 75 Minutes
  **Word Limit:** Approximately 900 words

  **Instructions:** Answer the question below. You do not need to cite authors or specific texts. The biological scenarios described are stipulated as true; do not waste time questioning their plausibility. Marks are awarded for philosophical analysis, not biological correction.

  **The Theories:**
  For the purposes of this exam, adopt the following compressed definitions:
  1.  **Selected-Effects (SE):** A trait has a function if and only if that effect is the reason the trait was historically selected and inherited. Function is backward-looking.
  2.  **Causal-Role (CR):** A trait has a function if and only if it currently makes a causal contribution to the capacity of the containing system. Function is forward-looking.

  **The Case:**
  Consider a species of lizard with three population variants involving jaw morphology. In all variants, the jaw makes a faint clicking noise when moved, but this noise affects neither survival nor reproduction.

  *   **Variant 1 (Novelty):** A population colonizes a new island. Jaw shape changes as a correlated by-product of strong selection on overall body size; nothing selected for the jaw shape itself. However, the new jaw *can* crack hard-shelled seeds that are now abundant. Cracking these seeds supplies most of the population's calories and drives reproductive success. No generation has yet lived and died under selection specifically for seed-cracking.
  *   **Variant 2 (Dormancy):** A sister population on a neighbouring island has the same jaw, but the hard-shelled seeds went extinct there two hundred generations ago. The jaw is now selectively neutral and eroding under drift, though it still cracks seeds if offered in a laboratory.
  *   **Variant 3 (Defect):** An individual lizard from Variant 2 has a developmental defect: its jaw is fused and can crack nothing.

  **The Question:**
  Apply both the SE and CR accounts to all three variants. Specifically, identify which variant produces plainly opposite verdicts from the two accounts regarding the *same* functional ascription. Based on this conflict, provide a defended verdict: which account would you stand behind?

  In your analysis, you must address whether declaring that there are "simply two concepts of function" resolves this case or evades it. You must also handle the type/token distinction regarding Variant 3. Finally, state which single demand on a theory of function each account sacrifices, choosing strictly from this list: *distinguishing a function from a mere effect, making room for malfunction, accommodating novel traits, accommodating dormant traits, or not making function ascriptions hostage to a history nobody can observe.*

  Conclude by stating which account you would want a colleague in clinical medicine to be using when diagnosing a patient, and why.

  ***

  ### 2. Model Answer

  The tension between the Selected-Effects (SE) and Causal-Role (CR) accounts is not merely terminological; it determines whether we view biological traits as historical artifacts or current tools. When applied to the lizard case, these accounts diverge sharply, forcing a choice between historical accuracy and current utility.

  In Variant 1, the jaw cracks seeds and drives survival, but this utility is evolutionarily new. The CR account ascribes the function of seed-cracking immediately, because the jaw currently contributes to the organism's survival capacity. The SE account denies this function. Since the jaw arose as a by-product of size selection and no ancestor survived *because* of seed-cracking, SE verdicts that the jaw has no function regarding seeds, or perhaps no function at all. This is the critical conflict point: both accounts are answering "Does this trait have the function of seed-cracking?" yet they yield opposite verdicts. Variant 2 complicates this. Here, the seeds are extinct. SE maintains the function exists because the history of selection remains, even if the trait is now neutral. CR likely denies the function, or restricts it to a hypothetical capacity, because the trait currently contributes nothing to the system's fitness in the wild. Variant 3 introduces the type/token distinction. Function ascriptions generally target the trait type in the population. SE handles the fused jaw easily: it is a malfunction because it fails to perform the historically selected effect. CR struggles here; if the fused jaw contributes *nothing*, it has no function, but CR often lacks a robust normative standard to call it "broken" rather than just "different."

  The variant where the stakes are highest is Variant 1. Here, SE and CR answer the same question with opposite verdicts. SE prioritizes history; CR prioritizes current causality. A common move is to claim pluralism: that "function" is ambiguous, and both accounts are right in different contexts. However, in this case, pluralism looks like evasion. A biologist studying Variant 1 needs to know if the jaw is *for* cracking seeds to understand the population's ecology *now*. To say "it is for seeds in one sense, but not in another" obscures the biological reality that the trait is currently sustaining the population. We need a single verdict to explain the current stability of the population. Therefore, I stand behind the Causal-Role account for this context.

  Choosing CR requires sacrifice. From the provided list, CR sacrifices **making room for malfunction**. Because CR defines function by current contribution, a fused jaw (Variant 3) simply lacks the function; it is harder to normatively judge it as "failing" rather than just "inactive." SE, conversely, sacrifices **accommodating novel traits**. By tethering function to history, SE renders functionally vital novelties (Variant 1) functionless until a generation dies, which seems absurd for a trait currently keeping the organism alive. SE also risks making function ascriptions **hostage to a history nobody can observe**, as reconstructing specific selection histories is often empirically impossible.

  Why prefer CR? Because in Variant 1, the biological reality is the current causal power, not the historical origin. The "two concepts" evasion fails because it leaves the practicing scientist without a directive. If a trait is keeping an organism alive, calling it "functionless" because of history impedes understanding.

  This preference dictates my choice for a colleague in clinical medicine. I would want a clinician using the Causal-Role account. When a doctor diagnoses a heart, they need to know what the heart is *doing* to sustain the patient's systemic capacity now. If a patient presents with a novel physiological adaptation to a disease, the SE account might classify it as non-functional until evolutionary history catches up, which is clinically useless. The doctor needs to know the current causal role to intervene. While SE offers a cleaner way to define malfunction (the heart isn't doing what it was selected for), medicine is forward-looking. It aims to restore current capacity. Therefore, despite SE's superior handling of normativity in Variant 3, CR is the necessary tool for Variant 1 and for clinical practice, where the history of the organ matters less than its current contribution to the life of the patient. To demand historical selection for every functional claim is to blind science to the immediate mechanics of survival.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 25

  **Must-Hit Moves:**

  1.  **Correct Application to Variant 1 (5 marks):**
      *   *Requirement:* Must state CR says "Function" (current utility) and SE says "No Function" (no history of selection for *this* trait).
      *   *Common Mistake:* Claiming SE grants function because the *population* was selected, missing the distinction that the *jaw* was a by-product.

  2.  **Correct Application to Variant 2 (4 marks):**
      *   *Requirement:* Must note SE retains function (history persists) while CR likely denies it (no current contribution to fitness).
      *   *Common Mistake:* Treating Variant 2 as identical to Variant 1; missing the "dormant" aspect.

  3.  **Handling Variant 3 & Type/Token (4 marks):**
      *   *Requirement:* Must identify that function is usually a type-claim, but the defect is a token-instance. Must note SE handles malfunction better here.
      *   *Common Mistake:* Ignoring the type/token distinction or claiming CR cannot account for defects at all without explanation.

  4.  **Identifying the Conflict Point (4 marks):**
      *   *Requirement:* Explicitly identify Variant 1 as the case where both theories answer the *same question* with *opposite verdicts*.
      *   *Common Mistake:* Identifying Variant 2 or 3 as the primary conflict, or failing to note the verdicts are opposite.

  5.  **Evaluating Pluralism & Selecting Sacrifices (5 marks):**
      *   *Requirement:* Must argue whether "two concepts" is a resolution or evasion (must take a stand). Must select the correct sacrifices from the provided list (CR sacrifices malfunction; SE sacrifices novel traits/history).
      *   *Common Mistake:* Accepting pluralism uncritically as a "good solution" without addressing the prompt's challenge about evasion. Selecting sacrifices not on the list.

  6.  **Clinical/Medicine Conclusion (3 marks):**
      *   *Requirement:* Must choose an account for the colleague and justify it based on the previous analysis (e.g., CR for current utility vs. SE for normativity).
      *   *Common Mistake:* Giving a conclusion that contradicts the earlier defended verdict without explanation.

  **A vs. B Distinction:**
  *   **B Grade:** Correctly maps the theories to the cases and selects the right sacrifices. Treats the "pluralism/evasion" question as a matter of opinion without strong argumentation. The medicine conclusion is present but generic.
  *   **A Grade:** Synthesizes the conflict to show *why* pluralism fails in Variant 1 (the need for a single explanatory verdict). The discussion of sacrifices demonstrates understanding of the *cost* of the theory, not just the definition. The medicine conclusion draws a direct line from the Variant 1 analysis to clinical necessity (forward-looking vs. backward-looking).
