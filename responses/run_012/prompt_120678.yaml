  **ZFC HOME SYSTEMS™**
  **MODEL BT-5 DUAL SPHERE UNIT | ASSEMBLY & WARRANTY GUIDE**

  **CONGRATULATIONS**
  Thank you for purchasing the BT-5. Using rigid motions and the Axiom of Choice, this unit partitions a solid sphere into five disjoint subsets, reassembles them via rotation and translation, and outputs two spheres congruent to the original. No stretching, scaling, or matter creation occurs. Volume accounting does not apply to non-measurable sets.

  **PARTS LIST**
  1.  **Input Sphere** (Solid, bounded, non-empty interior)
  2.  **Subset A–E** (5 Disjoint pieces. Lebesgue measure: Undefined. Weight: N/A)
  3.  **Choice Module** (Pre-installed)

  **ASSEMBLY INSTRUCTIONS**
  1.  **Insert Sphere.** Place input object into the hopper. Ensure object is three-dimensional.
  2.  **Invoke Choice.** Press **START**. The unit selects points from infinite orbits. *Note: The machine cannot specify which points are selected.*
  3.  **Rotate.** The unit applies rigid rotations to subsets A–D. No tools required.
  4.  **Translate.** Shift subsets to new coordinates.
  5.  **Output.** Two spheres emerge. Both are identical in size to the input.

  **WARNING: DIMENSIONAL CONSTRAINTS**
  **DO NOT USE ON PLANAR OBJECTS.** The Banach-Tarski decomposition requires three dimensions. The group of motions in $\mathbb{R}^2$ is amenable; a finitely additive invariant measure exists. **Do not attempt to duplicate pancakes, paper, or disks.** The unit will return an error.

  **SHIPPING & INSURANCE**
  Due to the non-measurable nature of Subsets A–E, shipping weight is calculated via outer bounding box only. Insurance claims regarding "missing volume" will be rejected. The contents possess no volume to lose.

  **WARRANTY & COMPATIBILITY**
  This unit requires the full **Axiom of Choice (AC)**.
  *   **Budget Model DC-4:** Uses Dependent Choice only. Performs all catalog functions except sphere duplication.
  *   **Void Where Prohibited:** Warranty is void in any model of set theory where all sets of reals are Lebesgue measurable (e.g., Solovay models).
  *   **Returns Policy:** We cannot accept returns on Subsets A–E. As the partition is non-constructive, we cannot verify if the returned pieces match the shipped pieces. Contents may vary between units.

  **ACCESSORIES & UPSPELLS**
  *   **Sock Selector™:** Requires AC to pick one sock from each of infinitely many pairs. (Shoe Selector sold separately; does not require AC as left/right distinction is constructive).
  *   **Pea-Sun Expansion Pack:** Utilizes the Banach-Tarski theorem for general bounded solids. Convert a pea into a sun-sized sphere using the same finite number of pieces. *Disclaimer: Interior points may be disjoint from original surface.*
  *   **Well-Ordering Attachment:** Puts any collection of items into a definite order. Note: The attachment cannot tell you what the order is.

  **COMPLIANCE STATEMENT**
  > "I'm not saying the construction doesn't exist. I'm saying I can't write down the rule for the cut. Until I have a definition, I'm not signing off on the safety inspection."
  > — **Harold B., Senior Compliance Officer**

  **TROUBLESHOOTING**
  *   **Unit produces only one sphere:** You are likely operating in a constructive universe. Switch to a classical logic setting.
  *   **Pieces look fuzzy:** This is normal. They are not Borel sets.
  *   **Cannot identify piece held in hand:** Expected behavior. No algorithm exists to distinguish the subsets.

  **ZFC Home Systems™**
  *Existence Guaranteed. Construction Not Provided.*
  © 2024 Zermelo-Fraenkel Home Systems. All rights reserved.
