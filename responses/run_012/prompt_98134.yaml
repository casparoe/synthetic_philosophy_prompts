answer: |-
  This is an excellent request. As a retired geophysicist with some philosophy under your belt, you are precisely the audience this subject needs: someone who knows the tensor calculus but wants to know what the symbols *mean*.

  Your hunch is correct. In fact, it is more than correct; it is the standard position in the contemporary literature. The paragraph you found is a classic example of "pop-philosophy": it captures the *spirit* of the argument but conflates historical distinct arguments, simplifies the technical setup to the point of distortion, and presents a contested metaphysical conclusion as a settled physical fact.

  If I were refereeing a paper containing this paragraph, I would recommend "Major Revisions." Below is an audit, claim-by-claim, followed by a discussion of the specific issues you raised (Leibniz, indeterminism, and ontology).

  ### Part 1: Claim-by-Claim Audit

  **Claim 1:** *"The hole argument is an old puzzle about whether spacetime points are real."*
  *   **Verdict:** **Acceptable Simplification.**
  *   **Comment:** This is a fair high-level summary. More precisely, it is a puzzle about *manifold substantivalism* (the view that the points of the differentiable manifold exist independently of the fields defined on them). But for a general summary, "whether spacetime points are real" passes.

  **Claim 2:** *"Leibniz used it against Newton: if space is a real thing... slide the entire universe three feet to the left... absolute space is unverifiable."*
  *   **Verdict:** **Conflation / Historical Inaccuracy.**
  *   **Comment:** This describes the **Shift Argument**, not the Hole Argument. While they are cousins (both attack substantivalism using symmetry), they are distinct. The Shift Argument relies on global translational symmetry (Newtonian space). The Hole Argument relies on *local* diffeomorphism invariance (General Relativity). Leibniz did use the Shift Argument; he did not use the Hole Argument (which requires GR). Conflating them suggests the Hole Argument is just a relativistic version of the Shift Argument, which misses the crucial role of *local* indeterminism.

  **Claim 3:** *"Einstein ran the same argument in reverse to show his field equations couldn't be generally covariant, and then changed his mind."*
  *   **Verdict:** **Historically Accurate.**
  *   **Comment:** This refers to Einstein's struggle between 1913 and 1915. He believed general covariance entailed a failure of causality (the Hole Argument). He restricted his equations (the *Entwurf* theory) to avoid it, then realized the argument rested on a false assumption about point identity, allowing him to publish the generally covariant field equations in 1915.

  **Claim 4:** *"...pick out any region of spacetime -- the 'hole', which has to be empty, otherwise nothing interesting happens..."*
  *   **Verdict:** **Technical Simplification (Borderline Misleading).**
  *   **Comment:** The hole does not strictly need to be "empty" of matter. It needs to be a region where the metric field is not fixed by initial data on a Cauchy surface prior to the hole. However, in the standard formulation (Earman & Norton, 1987), we usually model it as a vacuum region to isolate the geometry. The phrase "otherwise nothing interesting happens" is hand-wavy. The crucial condition is that the region is within the domain of dependence of the initial data surface, yet the data fails to determine the metric there *if* you accept certain metaphysical premises.

  **Claim 5:** *"...smoothly shuffle the fields around inside the hole while leaving everything outside exactly as it was."*
  *   **Verdict:** **Accurate.**
  *   **Comment:** This describes a **hole diffeomorphism**. Mathematically, this is a map $h: M \to M$ that is the identity outside the hole region $H$ and non-identity inside $H$. If $(M, g, T)$ is a solution to the Einstein Field Equations (EFE), then $(M, h^*g, h^*T)$ is also a solution.

  **Claim 6:** *"You get a second solution that agrees with the first on every observation anyone could make outside the hole but disagrees about what's going on inside."*
  *   **Verdict:** **Accurate.**
  *   **Comment:** Because the diffeomorphism is the identity outside the hole, all observables defined on the boundary or in the past are identical. Inside the hole, the metric field values are assigned to different manifold points.

  **Claim 7:** *"If you think the points of spacetime are real individuals, then these are two genuinely different worlds..."*
  *   **Verdict:** **Accurate (Conditional).**
  *   **Comment:** This is the crux. If you are a **Manifold Substantivalist** (you believe point $p$ is distinct from point $q$ even if all physical properties are swapped), then the model $(M, g)$ and $(M, h^*g)$ represent distinct physical situations. In one, curvature is high at $p$; in the other, curvature is low at $p$.

  **Claim 8:** *"...so the theory fails to determine what happens inside the hole from what happens outside it. The theory is therefore indeterministic..."*
  *   **Verdict:** **Misleading / Needs Qualification.**
  *   **Comment:** The theory is indeterministic *only if* you accept the premise in Claim 7. If you view the two mathematical models as representing the *same* physical reality (gauge equivalence), the theory is deterministic. The text presents the indeterminism as a property of GR itself, rather than a property of GR *plus* Substantivalism.

  **Claim 9:** *"...and this is why physicists gave up on the idea that spacetime points exist: they're just labels, like coordinates, with no identity of their own."*
  *   **Verdict:** **False / Unwarranted Generalization.**
  *   **Comment:** This is the most egregious error.
      1.  **Historically:** Physicists did not collectively "give up" on spacetime points for this philosophical reason. Most working relativists are agnostic or instrumentalist.
      2.  **Philosophically:** This presents one solution (Relationalism or "Sophisticated Substantivalism") as the only solution. There are philosophers who defend substantivalism by rejecting the inference in Claim 7 (see *Sophisticated Substantivalism*).
      3.  **Technically:** Points do have identity as mathematical objects; the claim is they lack *physical* haecceity (this-ness).

  ---

  ### Part 2: Addressing Your Specific Concerns

  #### 1. The Leibniz Comparison
  Your skepticism here is well-founded. The text conflates the **Shift Argument** (Leibniz vs. Newton) with the **Hole Argument** (Einstein/Earman & Norton).
  *   **The Shift Argument:** Relies on global symmetries. If space is absolute, shifting the universe 3 feet left creates a distinct state of affairs that is observationally identical. Conclusion: Absolute space is undetectable/otiose.
  *   **The Hole Argument:** Relies on *local* symmetries (diffeomorphism invariance). It is stronger because it threatens **determinism**, not just detectability. It says that even with complete knowledge of the past, the future inside the hole is open *if* points are real.
  *   **Audit:** The text treats them as the "same argument." A philosopher of physics would wince here. They are structurally similar (both exploit symmetry to argue against substantivalism), but the stakes of the Hole Argument are higher (determinism vs. verification).

  #### 2. Indeterminism vs. Chance
  You asked if the argument shows the theory is indeterministic "in anything like the sense a genuinely chancy theory is."
  *   **The Distinction:** Quantum indeterminism is usually viewed as *physical* chance (ontic probability). The Hole Argument generates *formal* indeterminism.
  *   **The Mechanism:** The "indeterminism" arises because the initial value problem fails to pick out a *unique* future model *under a specific interpretation*.
  *   **Consensus:** Most philosophers of physics (Earman, Norton, Pooley, Saunders) agree that this is not "genuine chance." It is a redundancy in the mathematical description (gauge freedom). If you treat diffeomorphic models as physically equivalent (the standard "gauge" view), the indeterminism vanishes.
  *   **Audit:** The text implies GR is objectively indeterministic like a quantum theory. This is wrong. GR is deterministic *if* you adopt the standard view that diffeomorphic models represent the same physical world. The indeterminism is a *reductio ad absurdum* aimed at the Substantivalist, not a discovery about gravity.

  #### 3. "Points Don't Exist": Consensus or Contested?
  You asked whether the "points don't exist" line is the conclusion or just one contested response.
  *   **The Reality:** It is **highly contested**.
  *   **The Landscape:**
      1.  **Manifold Substantivalism:** (The target of the argument). Points exist independently. *Verdict:* Mostly abandoned due to the Hole Argument.
      2.  **Relationalism:** Spacetime is just a web of relations between matter/fields. Points have no identity without fields. *Verdict:* A live option, but faces technical challenges (e.g., vacuum solutions where there is no matter to relate).
      3.  **Sophisticated Substantivalism:** (The dominant modern view). Spacetime points exist, but they do not have *haecceity* (primitive this-ness) independent of the metric structure. We identify points *via* the fields. This accepts the math of substantivalism but denies the metaphysical premise that leads to indeterminism. *Verdict:* Widely held among philosophers of physics (e.g., Stachel, Saunders).
      4.  **Structural Realism:** Only the structure (the relations) is real, not the relata (points).
  *   **Audit:** The text claims physicists "gave up" on points. This is false. Many accept *Sophisticated Substantivalism*, which retains points but denies they have independent identity. Others are Structural Realists. To say points "don't exist" is a metaphysical claim, not a physical finding.

  ---

  ### Part 3: Verdict on Your Hunch

  > *My hunch... is that the argument is more of a dilemma for one particular view than a refutation of anything.*

  **This is insight, not half-memory.** You have correctly identified the logical structure of the modern Hole Argument (specifically the Earman-Norton reconstruction).

  The argument is a **Dilemma**:
  1.  **Horn A:** Accept Manifold Substantivalism (points are real individuals). **Result:** GR is indeterministic (which is physically unacceptable).
  2.  **Horn B:** Reject Manifold Substantivalism. **Result:** GR is deterministic, but you must adopt a different ontology (Relationalism, Structuralism, or Sophisticated Substantivalism).

  The airport book presents Horn A as a fact ("The theory is therefore indeterministic") and Horn B as the only solution ("this is why physicists gave up..."). It misses the nuance that one can be a substantivalist *without* accepting the indeterminism, provided one modifies the notion of "substance" (i.e., Sophisticated Substantivalism).

  ### Summary for your Reading Group
  If you take this back to your reading group, here is the "Referee's Summary":

  1.  **Historical Conflation:** Distinguish the Leibniz Shift Argument from the Einstein Hole Argument.
  2.  **Conditionality:** The indeterminism is not a feature of GR *simpliciter*; it is a feature of GR + Manifold Substantivalism.
  3.  **Ontological Prematurity:** The claim that "spacetime points don't exist" is a metaphysical stance, not a scientific consensus. The consensus is that *manifold points lack physical haecceity*.
  4.  **Your Hunch:** Validated. The Hole Argument is a constraint on metaphysics, not a refutation of spacetime.

  **Recommended Reading:**
  If you want to replace that airport book, look for:
  *   **Earman & Norton (1987):** "What Price Spacetime Substantivalism? The Hole Story." (The seminal paper).
  *   **Pooley (2006):** "Points, Particles, and Structural Realism." (Excellent overview of the responses).
  *   **Saunders (2003):** "Physics and Leibniz's Principles." (On the Shift vs. Hole distinction).

  You are reading the literature correctly. The airport book is selling a settled story where there is actually a lively, technical debate.
