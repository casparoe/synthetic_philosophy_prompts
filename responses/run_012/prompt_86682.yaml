answer: |-
  # Nearest existing concepts

  Three established ideas approach this pattern, yet each misses a crucial dimension required by your description. First, **Superrationality**, introduced by Douglas Hofstadter, captures the core intuition that identical rational agents facing a symmetric dilemma will converge on cooperation because they recognize their reasoning processes are mirrored. It correctly identifies that the decision is not isolated but linked by logical symmetry. However, it diverges from your pattern by requiring strict identity and symmetry. Hofstadter's formulation typically assumes agents are perfect copies facing identical payoff matrices. Your agents are merely drawn from a common distribution of reasoning procedures with partially overlapping values. Superrationality typically collapses when agents are not perfect copies, whereas your pattern persists so long as the correlation remains sufficiently high, allowing for heterogeneity that classical superrationality excludes.

  Second, **Acausal Trade**, prominent in contemporary decision theory literature, captures the causal isolation and the exchange of benefits without communication. It correctly models agents who cooperate because they simulate each other's source code to verify compliance. However, it often implies a specific, known counterpart whose algorithm is explicitly analyzed and simulated. Your pattern describes a dispersed multitude where no specific counterpart is known, only a statistical population. Acausal trade focuses on the transaction between specific entities; your pattern focuses on the evidential link derived from shared reasoning types across a distribution. The mechanism in your case is statistical correlation of algorithms, not necessarily specific simulation of known peers.

  Third, **Evidential Decision Theory (EDT)** captures the mechanistic engine: choosing an act because it provides evidence of a desirable world state. It explains why the agent treats their choice as diagnostic of others' choices. However, EDT is a normative framework for individual choice, not a name for the social phenomenon of cooperation itself. Furthermore, EDT is often criticized for endorsing "managing the news"—acting to make good news likely rather than causing good outcomes. Your pattern avoids this by relying on a robust logical correlation between algorithms, not merely spurious statistical correlation. Thus, while EDT describes the math, it does not name the social structure. It lacks the specificity regarding the source of the correlation (shared reasoning architecture) that defines your phenomenon.

  # The phenomenon itself

  The mechanism is **subjunctive dependence between decision algorithms**. Unlike causal influence, where one event physically precipitates another, this mechanism relies on the logical necessity that similar algorithms running on similar inputs yield similar outputs. When you deliberate, you are not merely moving your own body; you are executing a reasoning procedure. If other agents are running sufficiently similar procedures on sufficiently similar inputs, their output is logically correlated with yours. Your choice does not cause theirs, but it is evidence of what their algorithm outputs in that same logical situation.

  What is essential is the **logical correlation of outputs** derived from **algorithmic similarity**. The agents must recognize that their decision processes are instantiations of the same abstract function, or functions close enough in parameter space to produce correlated results. Causal isolation is essential; if causal influence were possible, standard game theory would apply. Mutual benefit is essential; without overlapping values, there is no incentive to cooperate even if correlation exists.

  What is incidental is **perfect identity**. Agents need not be clones; they need only share the relevant reasoning architecture. **Communication** is incidental; the link is logical, not informational. **Enforcement** is incidental; the incentive is internal to the rationality of the decision, not external coercion. **Complete value alignment** is incidental; agents need only value the reciprocal outcome enough to offset the cost of their own cooperation. The phenomenon persists as long as the expected utility of the correlated cooperative world exceeds the expected utility of the correlated selfish world. The core is the recognition that one's own decision is a sample from a distribution that predicts the decisions of others.

  # Best fit or proposed name

  The established term **Acausal Cooperation** is close but often conflated with specific simulations or science-fiction scenarios involving explicit code exchange. I propose the refined term **Logical Cooperation**. This name is preferable because it identifies the connective tissue—logical correlation—rather than defining the phenomenon by what it lacks (causality) or implying impossible identity (Superrationality). "Acausal" is a negative definition; "Logical" is a positive mechanism.

  **Definition:** Logical Cooperation is rational coordination between causally isolated agents grounded in the evidential correlation of their decision procedures. It occurs when agents recognize that their choices are outputs of similar algorithms, making their own choice diagnostic of others' choices.

  This term distinguishes the phenomenon from moral universalizability, which relies on duty, and from causal cooperation, which relies on leverage. It captures the instrumental rationality of the move without requiring the agents to be identical copies. It emphasizes that the "trade" is not a transaction but a synchronization of logical states. By naming the mechanism (logic) rather than the constraint (acausality), it clarifies that the power comes from the predictability of reasoning, not the absence of physics. It accommodates the distributional nature of the agents and the partial overlap of values, which broader terms often obscure.

  # Boundary cases

  1.  **Identical vs. Similar Agents:** Identical copies fall inside; they maximize correlation. Merely similar agents (drawn from a distribution) fall inside provided the correlation coefficient is high enough to outweigh the cost of cooperation. If similarity is too low, the evidential link breaks, and the case falls outside. The boundary is determined by whether the probability shift regarding others' behavior justifies the personal cost.
  2.  **Common Knowledge:** Common knowledge of the similarity is essential. If I know we are similar, but do not know that you know I know, the recursive reasoning required to stabilize the expectation may fail. Thus, absence of common knowledge falls outside. Without knowing the correlation is mutual knowledge, I cannot rely on your reasoning about my reasoning.
  3.  **Large vs. Small Worlds:** In a small world (few agents), the impact of one's choice on the total utility is low, potentially making cooperation irrational. In a large world (many agents), the aggregate benefit of correlated cooperation outweighs individual cost. Large worlds fall inside; very small worlds may fall outside depending on payoff matrices. The phenomenon scales with the number of correlated agents.
  4.  **Aligned vs. Conflicting Values:** Fully aligned values fall inside. Partially overlapping values fall inside if the overlap covers the cooperative surplus. Zero-sum or fully conflicting values fall outside; logical correlation would merely synchronize defection or conflict, yielding no mutual benefit. The values must allow for a Pareto improvement via correlation.
  5.  **One-shot vs. Repeated:** Standard repeated interaction allows causal enforcement (tit-for-tat). This concept applies specifically to one-shot scenarios where causal repetition is impossible. If causal repetition is available, it becomes standard causal cooperation. Thus, one-shot causal isolation falls inside; repeated causal contact falls outside the specific definition, though compatible with it. The distinction isolates the logical link from causal leverage.

  # Why the carving matters

  Getting this distinction right prevents category errors in decision theory and ethics. In decision theory, it validates Functional Decision Theory over Causal Decision Theory in multi-agent contexts, showing that rationality can demand cooperation without enforcement. In ethics, it provides an instrumental grounding for moral-like behavior that does not rely on supernatural enforcement or pure altruism. It clarifies that cooperation can be rational even in the absence of contracts, provided the logical link exists. Misidentifying this as mere hope or moralizing obscures the strategic reality available to agents who recognize their algorithmic similarity. For artificial intelligence, this distinction is critical: autonomous systems may cooperate logically without communication, altering safety landscapes.
