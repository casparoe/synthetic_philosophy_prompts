      *   20 cards? Yes.
      *   Specific borderline cases included? Yes.
      *   Target theory tested? Yes.
      *   Learning outcomes met? Yes.
      *   Name hidden until debrief? Yes.

  11. **Final Polish:**
      *   Make instructions crisp.
      *   Ensure the card descriptions are evocative but brief.
