answer: |-
  # Activity: The Experience Audit

  **Goal:** To force students to confront the Heterogeneity Problem by testing a stipulative definition of pleasure against intuitive cases, specifically highlighting the tension between phenomenological diversity and attitudinal unity.
  **Time:** 75 Minutes
  **Class Size:** 12 Students (3 Groups of 4)
  **Materials:** 1 Deck of 20 "Experience Cards" per group, 3 large sheets of paper (or whiteboard space), markers, timer.

  ---

  ## 1. Materials: The Deck (20 Cards)
  *Print these on cardstock. Each group gets an identical deck.*

  1.  **The Hot Bath:** Sinking into water just the right temperature after a long week.
  2.  **The Mosquito Bite:** Scratching an itch until it stings and bleeds, but you can't stop.
  3.  **The Good Cry:** Sobbing over a breakup, feeling hollowed out but relieved.
  4.  **The Cold Shower:** Stepping into freezing water after a run; shocking, painful, but invigorating.
  5.  **The Vindictive Thrill:** Hearing that a rival who wronged you has failed an exam.
  6.  **The Math Proof:** Three hours of obsessive tinkering with a problem; frustrating but absorbing.
  7.  **The Funeral Grief:** Standing at a gravesite; you would not trade this feeling for numbness, but it hurts.
  8.  **The Warm Bread:** Smelling and tasting fresh bread when you are starving.
  9.  **The Compulsion Relief:** Finally checking the lock for the fifth time; the anxiety drops away.
  10. **The Laugh:** A sudden, uncontrollable fit of laughter with friends.
  11. **The Stretch:** Stretching a sore muscle until it almost cramps.
  12. **The Sad Song:** Listening to melancholic music intentionally to feel wistful.
  13. **The Victory:** Winning a competitive game; adrenaline and shouting.
  14. **The Nap:** Waking up from a deep sleep, disoriented but rested.
  15. **The Fear:** Riding a rollercoaster; screaming because you are terrified but chose to be there.
  16. **The Flow:** Painting for hours, losing track of time, ignoring hunger.
  17. **The Guilt:** Realizing you hurt someone; a heavy feeling you feel you *ought* to have.
  18. **The Caffeine Hit:** The jolt of coffee hitting your system when exhausted.
  19. **The Awe:** Standing at the edge of a canyon, feeling tiny and overwhelmed.
  20. **The Itch:** A persistent, low-level annoyance you ignore while working.

  ---

  ## 2. Timeline & Rules

  ### Phase 1: Intuitive Sort (20 Minutes)
  **Instruction:** "Divide into your groups. Shuffle the deck. Without using any technical definitions, sort these cards into three piles: **Definitely Pleasant**, **Definitely Unpleasant**, and **The Gray Zone**. You must agree as a group. If you disagree, put it in the Gray Zone."

  *   **Task:** Once sorted, take the top 5 cards from "Definitely Pleasant" and rank them 1–5 for *intensity*.
  *   **Instructor Role:** Circulate. Do not answer questions about definitions. If they ask "Is grief pleasant?", say "That's for you to decide based on your intuition."

  ### Phase 2: The Rule Application (25 Minutes)
  **Instruction:** "Stop. Clear the piles. I am now giving you a specific rule for this audit. We are calling this **The Wanting Rule**."

  > **The Wanting Rule:** An experience counts as **Pleasure*** if, and only if, **while you are having the experience, you want to be having it.**
  > *(Note: Write this on the board. Emphasize the asterisk.)*

  **Task:** "Re-sort the entire deck. This time, you cannot use your intuition. You must apply The Wanting Rule strictly.
  *   If you want to be doing it *while* you do it $\rightarrow$ **Pleasure***
  *   If you want it to stop *while* you do it $\rightarrow$ **Not Pleasure***
  *   If it's ambiguous $\rightarrow$ **Evidence Needed**"

  *   **Constraint:** You must move cards from Phase 1 that conflict with this rule. (e.g., If you intuitively said Grief is Unpleasant, but you *want* to feel grief at a funeral, where does it go now?)

  ### Phase 3: The Verdict (20 Minutes)
  **Instruction:** "Look at your **Pleasure*** pile. It likely looks very different than your Phase 1 pile. It probably contains grief, cold showers, and scratching bites."

  **Task:** "Your group must draft a 2-sentence verdict on The Wanting Rule.
  *   **Option A (Defend):** 'This rule is correct because...'
  *   **Option B (Reject):** 'This rule is broken because...'
  *   You must reference at least two specific cards that caused trouble."

  *   **Instructor Role:** Push groups to be specific. If they say "Grief isn't pleasure," ask "But did they want to feel it?" Force the conflict between the *word* and the *criterion*.

  ### Phase 4: Debrief & Reveal (10 Minutes)
  *(See Debrief Script below)*

  ---

  ## 3. The Debrief Script (Instructor Notes)

  **Step 1: The Data (2 mins)**
  Ask groups: "Which card caused the most fighting in Phase 2?" (Likely candidates: The Funeral Grief, The Mosquito Bite, The Cold Shower).
  Write their answers on the board.

  **Step 2: The Reveal (3 mins)**
  "Today you were testing a specific solution to a famous problem in ethics called **The Heterogeneity Problem**."
  *   **Write on board:** *Hedonism = Well-being consists in Pleasure.*
  *   **The Problem:** "If Hedonism is true, all good experiences must share a common quality: 'Pleasure.' But look at your Phase 2 pile. What do a cold shower, a funeral, and warm bread have in common phenomenologically? Nothing. They feel totally different."
  *   **The Move:** "The theory you tested (The Wanting Rule) is a version of **Attitudinal Hedonism**. It solves Heterogeneity by saying the common thread isn't a *feeling*, it's an *attitude* (wanting)."

  **Step 3: The Tension (Cheating vs. Bookkeeping) (5 mins)**
  "This is where the philosophy happens. Look at your verdicts."
  *   **If they rejected the rule:** "You likely felt this was **cheating**. You think 'Pleasure' has a meaning we can't just overwrite. If grief is 'pleasure,' the word loses its use. If the word loses its use, Hedonism becomes trivial (everything we want becomes 'pleasure' by definition)."
  *   **If they defended the rule:** "You likely felt this was **honest bookkeeping**. You realized 'Pleasure' was the bottleneck. If we care about *well-being*, maybe we should track what people actually endorse (want), even if it feels like pain. This saves Hedonism from being falsified by diverse experiences."

  **Closing:** "The Heterogeneity Problem forces Hedonists to choose: Do you stick to a narrow feeling (and risk excluding good things like accomplishment or grief)? Or do you broaden the definition (and risk making the theory empty)? There is no free lunch."

  ---

  ## 4. Predictable Failure Points & Fixes

  **1. The "Wanting" Ambiguity**
  *   **Problem:** Students will argue about *when* the wanting happens. "I want the cold shower to be over while I'm in it, but I'm glad I did it after."
  *   **Fix:** Enforce the "While" clause strictly. "The rule says *while you are having it*. If you are shivering and counting seconds, it's Not Pleasure*, even if you are glad later." This sharpens the distinction between *enjoyment* and *satisfaction*.

  **2. The Dominant Voice**
  *   **Problem:** In a group of 4, one student dictates the sort.
  *   **Fix:** Assign roles at the start.
      *   **The Scribe:** Writes the cards down.
      *   **The Skeptic:** Must argue against the majority view once per phase.
      *   **The Timekeeper:** Keeps the phases moving.
      *   **The Speaker:** Presents the verdict.

  **3. The "Grief" Impasse**
  *   **Problem:** A group gets stuck on Card 7 (Funeral Grief). They can't agree if you "want" to feel grief.
  *   **Fix:** This is a feature, not a bug. Tell them: "If you can't agree on whether the subject wants the experience, that proves the definition is unstable. Put it in 'Evidence Needed' and move on. We will discuss why it's unstable in the debrief."

  **4. Running Out of Time**
  *   **Problem:** Phase 1 takes too long because they enjoy discussing the cards.
  *   **Fix:** Be ruthless at minute 20. "Freeze. Wherever the cards are, leave them. We need the data for Phase 2."

  ---

  ## 5. Limitations (Instructor's Honest Note)

  **What this activity cannot do:**
  This activity successfully reproduces the *conceptual* pressure of the Heterogeneity Problem (i.e., "What counts as pleasure?"). However, it **cannot** reproduce the *normative* stakes without your help.

  Students will understand that defining "pleasure" is hard. They will *not* automatically see why this matters for **Well-Being**. They might conclude, "Okay, so 'pleasure' is a weird word. So what?"

  **What you must supply:**
  In the final 2 minutes of the debrief, you must explicitly bridge the gap:
  *"If Hedonism says 'Only Pleasure is Good,' and we define Pleasure as 'Whatever You Want,' then Hedonism becomes 'Whatever You Want is Good.' That sounds nice, but it removes the critical power of the theory. It can no longer tell you that you might be wrong about what is good for you. You have to decide if that's a bug or a feature."*

  Without this addition, the activity remains a semantic exercise rather than an ethical one.
