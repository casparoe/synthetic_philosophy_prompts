answer: |-
  This is doable in seventy minutes, but only if you treat the history as scenery and the metaphysics as the engine. You cannot teach them *how* to solve Bradley's regress in this time; you can only teach them *why* it is a problem that resists solution. If you try to walk them through Russell's multiple relation theory or Strawson's non-relational tie, you will run out of time and lose the CS person.

  Here is the plan.

  ### 1. The Carrying Example
  **Verdict:** Use **"a is to the left of b"**. Do not use the chess position.

  **Why:**
  *   **Chess smuggles norms:** A chess position is unified by the *rules of the game* and the *intentions of the players*. If you ask "what unifies this position?", a linguist or lawyer will say "the rules." That is a normative unity, not an ontological one. You want to isolate *ontological* unity (what makes a fact a fact, regardless of rules).
  *   **Thin is good:** You need the example to be bare enough that the only available "glue" is the relation itself. "a is to the left of b" has no hidden rules.
  *   **Visual:** Draw two dots on the whiteboard. Label them `a` and `b`. Draw an arrow or spatial arrangement. This stays on the board for the whole hour.

  **What the example must have:** Truth-aptness. It must be capable of being false. (This distinguishes it from a mere list).
  **What the example must lack:** Causal history, normative rules, or psychological intention.

  ### 2. The Whiteboard Map
  Divide your board into three vertical columns. Do not erase these until the end.
  *   **Left:** "The List" (a, R, b)
  *   **Center:** "The Fact" (aRb)
  *   **Right:** "The Regress" (R1, R2, R3...)

  ### 3. The 70-Minute Sequence

  #### 00:00 – 00:10: The Distinction (List vs. Fact)
  *   **Goal:** Establish that "Unity" is a live question.
  *   **Action:** Write `a`, `R`, `b` in the **Left Column**. Say: "Here are three items. A particular, a relation, a particular."
  *   **Action:** Write `aRb` in the **Center Column**. Say: "Here is a state of affairs. It is true or false."
  *   **The Dependency:** You cannot ask about unity until they agree these are different. Ask: "What is the difference between the column on the left and the column in the center? I haven't added any new *things*."
  *   **Desired Output:** They must say the Center is "connected" or "unified" or "asserted."
  *   **Crucial Move:** Get them to agree that the *relation* `R` is the primary candidate for the glue. (If they say "the mind unifies it," bracket that: "Let's assume the world has structure independent of us for this hour.")

  #### 00:10 – 00:25: Generating the Trap (The Regress)
  *   **Goal:** Make the regress feel inevitable, not magical.
  *   **Action:** Focus on the Center Column. Ask: "How does `R` hold `a` and `b` together?"
  *   **The Trap:** If `R` is just another item (like `a` and `b`), then we just have a list: `a`, `R`, `b`. To turn that list into a fact, we need a *new* relation, `R1`, to connect `R` to `a` and `b`.
  *   **Whiteboard:** Move to the **Right Column**. Write `R1` connecting `R` to `a`.
  *   **The Turn:** Ask: "Is `R1` an item or a connector?"
      *   If it's an item, we need `R2` to connect `R1` to the rest.
      *   If it's a connector, why couldn't `R` have been a connector in the first place?
  *   **Timing:** Do not rush this. Let the silence hang. This is where they feel the itch.

  #### 00:25 – 00:45: The Fork & The Misconceptions
  *   **Goal:** Navigate the three specific misconceptions you identified.
  *   **The Fork:** You have two options.
      1.  **Relation as Item:** `R` is a constituent. (Leads to Regress).
      2.  **Relation as Connector:** `R` is fundamentally different (unsaturated/tie). (Leads to mystery/brute fact).

  *   **Handling Misconception 1 (CS: "Sets solve it"):**
      *   **Timing:** **Let it stand.** Wait for them to say it. It usually comes right when you draw the Right Column.
      *   **Response:** Do not squash it. Write `{a, R, b}` on the board. Ask: "Is the set `{a, R, b}` true or false?" No. "Does the set assert that a is left of b?" No. "So the set unifies the *members*, but does it unify the *proposition*?"
      *   **Why:** This forces the CS person to distinguish *collection unity* (set membership) from *propositional unity* (truth conditions). It validates their intuition while showing its limit.

  *   **Handling Misconception 2 (Monism: "Relations aren't real"):**
      *   **Timing:** **Pre-emptive strike (00:15).** When you first introduce Bradley, say: "Bradley's conclusion was that relations are contradictions, so reality is One. We are **not** evaluating that conclusion today. We are evaluating the *engine* that drove him there."
      *   **Why:** If you wait until the end, the Law student will have spent 50 minutes thinking about the implications for legal ontology. Bracket it early.

  *   **Handling Misconception 3 (Regress = Fatal):**
      *   **Timing:** **The Instant it is voiced.** Someone will say "Infinite regresses are bad, so the theory is false."
      *   **Response:** "Is this regress *vicious* or *benign*? If every step just adds a truth condition without contradiction, maybe it's okay. But if it prevents the first step from ever being unified, it's vicious."
      *   **Why:** You need them to see that the problem isn't the infinity, it's the *failure of the first step to function*.

  #### 00:45 – 00:60: The "Unsaturated" Temptation
  *   **Goal:** Address the Fregean instinct without endorsing it as a magic bullet.
  *   **Action:** Someone (maybe you, or a linguist) will suggest: "Relations are unsaturated. They don't need gluing."
  *   **Counter:** "Okay. If `R` is unsaturated, it's not an item. But if it's not an item, how do we refer to it? As soon as we name it 'R', we treat it as an item."
  *   **Point:** This relocates the regress; it doesn't solve it. It moves the mystery from "what glues the relation?" to "what is the nature of unsaturatedness?"
  *   **Cut:** Do not go deeper into Frege/Russell debates. Just mark it as "Option B: Deny the demand for a unifier."

  #### 00:60 – 00:70: Wrap & Final Question
  *   **Goal:** Check understanding.
  *   **Action:** Erase the Right Column. Leave List and Fact.
  *   **The Final Question:** (See below).

  ### 4. What to Explicitly Leave Out
  Announce these at the start (00:02) so you don't get derailed:
  1.  **Bradley's Monism:** "We are analyzing the regress argument, not defending the conclusion that reality is a single One."
  2.  **Frege/Russell History:** "We are not doing exegesis of *Principia* or *Appearance and Reality*. We are using the argument as a tool."
  3.  **Psychological Unity:** "We are not asking how the *mind* combines ideas. We are asking what makes the *object* of the thought a unity."

  ### 5. The Final Question
  Do not ask "What is Bradley's regress?" (Tests memory).
  Do not ask "Is the regress vicious?" (Tests opinion).

  **Ask this:**
  > "If I stop the regress at step one by saying 'R just *does* the connecting without help,' what have I claimed about the ontological status of R compared to a and b?"

  **Why this works:**
  *   If they say "R is different," they get it (the Fork).
  *   If they say "R is the same," they fall back into the regress.
  *   It forces them to articulate the cost of stopping the regress (you must posit a categorical distinction between objects and relations).

  ### 6. Feasibility Check
  **Can this be done in 70 minutes?**
  Yes, *if* you are ruthless about the "Solutions."
  *   **Cut:** Any discussion of truthmakers, states of affairs vs. facts, or contemporary metaphysics (Armstrong, etc.).
  *   **Cut:** Any deep dive into the Linguists' idea of "syntax." (Syntax is just the linguistic version of the regress; acknowledge it, don't analyze it).
  *   **Risk:** The CS person might want to formalize the set theory.
  *   **Mitigation:** Tell them: "Formalize it all you want, but tell me which symbol in your formalism corresponds to the *assertion*." (Usually, it's the turnstile `⊢`, which is external to the set).

  **If you run long:**
  Cut the "Unsaturated" section (00:45-00:60). End at the Fork. The lesson is successful if they leave understanding that *either* you accept a brute mystery (R connects without help) *or* you accept a regress. The specific label "unsaturated" is less important than the structural choice.

  ### Summary of Dependencies for Your Rehearsal
  1.  **List vs. Fact** must be established before **Unity** is questioned.
  2.  **Relation as Item** must be assumed before **Regress** generates.
  3.  **Regress** must be felt as inevitable before the **Fork** is offered.
  4.  **Set Theory** must be offered by *them* before you dismantle it (otherwise it looks like a strawman).
  5.  **Monism** must be bracketed *before* the argument starts (otherwise it becomes the focus).

  You know the material. The trap is trying to be comprehensive. Be surgical. Use the whiteboard columns to keep the spatial logic visible. Good luck.
