      *   *Advance Decision to Refuse Treatment (ADRT):* Under the Mental Capacity Act 2005 (England/Wales), an ADRT is binding *if* the person lacks capacity, the decision is specific to the circumstance, and there hasn't been a change in circumstances/views.
      *   *Capacity:* Eileen lacks capacity regarding this decision (Alzheimer's, doesn't understand the form).
