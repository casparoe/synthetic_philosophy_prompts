answer: |-
  ### 1. Examination Question

  **Module:** Chance, Credence and Self-Locating Belief
  **Time Allowed:** 75 Minutes
  **Total Marks:** 20

  **Question 1**

  On Sunday evening Beauty is put to sleep. The experimenter flips a fair coin, $C$. If $C$ lands heads, she is woken once, on Monday, and the experiment ends. If $C$ lands tails, the experimenter consults a randomiser which, with probability $p$, sends her down a double-awakening branch (woken on Monday and again on Tuesday, with an amnesia-inducing drug administered between the two awakenings) and, with probability $1 - p$, down a single-awakening branch (woken once, on Monday). The value of $p$ is fixed in advance, lies between 0 and 1 inclusive, and is known to Beauty. On each awakening she cannot tell which day it is and cannot tell whether she has been woken before; she is asked only for her credence that $C$ landed heads. She knows the whole protocol.

  Consider two views on how Beauty should form her credence:
  *   **View I:** Self-locating information (knowing one is awake) is evidentially inert regarding the coin outcome.
  *   **View II:** Credence should match the long-run proportion of awakenings in the experiment that are heads-awakenings.

  (a) Derive Beauty's credence in Heads at an awakening as a function of $p$ according to View I and View II. Verify that both derivations yield the same result when $p = 0$ and different results when $p = 1$. **[8 marks]**

  (b) Explain what the convergence of the two views at $p = 0$ suggests about whether their disagreement is substantive or merely verbal. What must a defender of View II concede about the source of their divergence from View I in light of this result? **[6 marks]**

  (c) Suppose that at every awakening, Beauty is offered a bet that pays £1 if $C$ landed Heads and £0 if Tails, settled immediately at that awakening. What fair odds does each view imply Beauty should accept? Explain how the betting implications differ when $p > 0$. **[6 marks]**

  ***

  ### 2. Model Answer

  **Part (a)**
  Under **View I**, self-locating information is inert. Beauty's credence should remain equal to the prior probability of the coin landing Heads. Since the coin is fair, $P(Heads) = 1/2$. This is independent of $p$.
  $C_I(H) = 0.5$.

  Under **View II**, credence matches the proportion of Heads-awakenings to total awakenings. Consider a large number $N$ of experiments.
  Heads occurs in $N/2$ experiments, generating $N/2$ awakenings.
  Tails occurs in $N/2$ experiments.
  Of the Tails experiments, proportion $p$ generate 2 awakenings, and proportion $(1-p)$ generate 1 awakening.
  Expected Tails awakenings $= (N/2) \times [2p + 1(1-p)] = (N/2)(1+p)$.
  Total awakenings $= (N/2) + (N/2)(1+p) = (N/2)(2+p)$.
  Proportion Heads $= \frac{N/2}{(N/2)(2+p)} = \frac{1}{2+p}$.
  $C_{II}(H) = \frac{1}{2+p}$.

  **Limits:**
  If $p = 0$: $C_I = 0.5$; $C_{II} = 1/(2+0) = 0.5$. They agree.
  If $p = 1$: $C_I = 0.5$; $C_{II} = 1/(2+1) = 1/3$. They disagree.

  **Part (b)**
  The convergence at $p=0$ suggests the disagreement is substantive, not verbal. Both views agree on the definition of probability when self-locating information carries no discriminatory power (since Tails never produces a Tuesday awakening). The divergence arises specifically when self-locating information correlates with the coin outcome via the number of awakenings.
  A defender of View II must concede that their view treats the *number* of awakenings as evidentially relevant. They cannot claim View I is simply 'miscalculating' the same quantity; rather, View II incorporates indexical evidence (the likelihood of being this specific awakening) which View I explicitly rejects. The dispute turns on whether being woken is evidence about the world (Tails makes waking more likely/frequent) or merely a background condition.

  **Part (c)**
  Fair odds reflect the credence.
  **View I:** Credence $1/2$ implies fair odds of 1:1. Beauty accepts the bet if the cost is $< £0.50$.
  **View II:** Credence $1/(2+p)$ implies fair odds of $(1+p):1$. Beauty accepts the bet if the cost is $< £\frac{1}{2+p}$.

  When $p > 0$, View II recommends a lower valuation of the bet. Since the bet is settled at *every* awakening, a Tails result causes Beauty to lose the stake multiple times (once on Monday, potentially again on Tuesday), whereas Heads only pays out once. View II accounts for this frequency mismatch; View I treats each awakening as an independent trial with fixed probability $1/2$, potentially leading to a sure loss over the course of the experiment if $p$ is high. View II aligns credence with the expected payout per awakening.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20**

  **Part (a): Derivations and Limits [8 Marks]**
  *   **View I Derivation (2 marks):** States credence remains at prior (1/2) because awakening provides no evidence.
      *   *Common Mistake:* Claiming View I depends on $p$ or confusing it with View II.
  *   **View II Derivation (4 marks):** Correctly calculates expected awakenings: Heads ($0.5$), Tails ($0.5(1+p)$). Derives ratio $1/(2+p)$.
      *   *Common Mistake:* Ignoring $p$ and calculating $1/3$ regardless of $p$ (counting distinguishable situations H-Mon, T-Mon, T-Tue as equiprobable).
  *   **Limits Check (2 marks):** Correctly shows agreement at $p=0$ (both 1/2) and disagreement at $p=1$ (1/2 vs 1/3).
      *   *Common Mistake:* Arithmetic error at $p=0$ (e.g., claiming View II yields 1/3 at $p=0$).

  **Part (b): Philosophical Implication [6 Marks]**
  *   **Substantive vs Verbal (3 marks):** Argues that convergence implies the dispute is substantive (about evidence), not verbal (about definitions), as they agree when indexical evidence is neutralized.
      *   *Common Mistake:* Claiming convergence proves the dispute is merely verbal/semantic.
  *   **Defender's Concession (3 marks):** Identifies that View II must concede that the *count* of awakenings drives the divergence, treating frequency as evidence, whereas View I treats it as irrelevant structure.
      *   *Common Mistake:* Vague statements about "different perspectives" without identifying the role of awakening frequency.

  **Part (c): Betting Implications [6 Marks]**
  *   **View I Odds (2 marks):** Identifies 1:1 odds (or price £0.50).
      *   *Common Mistake:* Adjusting View I odds to match View II to avoid Dutch Book arguments.
  *   **View II Odds (2 marks):** Identifies $(1+p):1$ odds (or price $£1/(2+p)$).
      *   *Common Mistake:* Failing to adjust odds for $p$, stating 2:1 (standard Thirder) regardless of $p$.
  *   **Comparison (2 marks):** Explains that View II accounts for multiple losses on Tails per experiment, whereas View I treats each awakening as isolated.
      *   *Common Mistake:* Claiming View I leads to guaranteed profit (it leads to guaranteed loss if $p>0$).

  **General Note for Markers:**
  Do not penalize candidates for endorsing View I or View II. Marks are awarded for the consistency of the derivation and the logical connection between the view held and the consequences drawn in parts (b) and (c). A candidate who consistently argues for View I but correctly identifies what View II implies will receive full credit.
