  2.  **Deconstruct the Philosophical Landscape:**
      *   **Substantivalism:** Spacetime points are real entities (like a container).
          *   *Pros:* Explains rotation (relative to spacetime structure).
          *   *Cons:* Hole Argument (indeterminism), Shift Argument (redundant structure).
      *   **Relationalism:** Spacetime is just relations between material objects/fields.
