answer: |-
  You have independently rediscovered the central tension in the modern philosophy of spacetime, specifically the debate surrounding **Substantivalism vs. Relationalism** as crystallized by the **Hole Argument** (Earman & Norton, 1987). Your "knot" is the precise conflict that forces philosophers of physics to choose between determinism and the independent reality of spacetime points.

  Here is the untangling, the single principle you are looking for, and the verdict on your lone sphere.

  ### The Single Principle: Leibniz Equivalence

  The principle that unifies your intuitions about the shift, the mirror, the electron swap, and the hole shuffle is **Leibniz Equivalence** (often formalized as **Diffeomorphism Invariance interpreted as Gauge Freedom**).

  **The Principle:** Mathematical models that are related by a symmetry transformation of the theory (a diffeomorphism in GR, a permutation in QM, a Galilean boost in Newtonian mechanics) represent the **same physical state of affairs**. Physical reality corresponds not to a single mathematical model, but to an *equivalence class* of models under the theory's symmetry group.

  Here is how this principle unties your knot:

  #### 1. The Shift, The Mirror, The Time Slide, The Hole Shuffle
  Your gut is correct: these are all **gauge redundancies**.
  *   **The Shift:** If you slide the universe three feet left, you are applying a global translation diffeomorphism. Under Leibniz Equivalence, this is the same physical world.
  *   **The Hole Argument:** This is the local version of the shift. If you shuffle points inside a "hole" region while dragging the fields (metric, matter) along, you create a mathematically distinct model. However, if you accept Leibniz Equivalence, these two models describe the *same* physical reality.
  *   **The Consequence:** To accept this, you must deny **Haecceity** (primitive "this-ness") to spacetime points. A point $p$ in the manifold has no identity independent of the fields defined on it. You cannot say "point $p$ has field value $F$ in model A and field value $G$ in model B." You can only say "the physical coincidence of field values and spacetime structure is such-and-such."

  This saves determinism. If the two Hole models are the same physical state, then specifying the state outside the hole *does* determine the state inside (because the "different" inside is just a relabeling of the same physical facts).

  #### 2. The Electron Swap
  This is the quantum mechanical analogue. Permutation invariance tells us that swapping indistinguishable particles yields the same physical state (bosons/fermions differ by a phase, but observable probabilities remain identical). This is consistent with Leibniz Equivalence: the "labels" on the particles are not physical; only the occupation of states matters.

  #### 3. The Bucket (Rotation)
  This is where the knot feels tightest. If points aren't individuals, what is the bucket spinning relative to?

  **The Resolution:** The bucket is not spinning relative to *spacetime points* (which lack identity); it is spinning relative to the **Metric Field**.

  In General Relativity, the metric field $g_{\mu\nu}$ is a physical object, just like the electromagnetic field. It defines the local inertial frames (via geodesics and Fermi-Walker transport).
  *   **Non-rotating bucket:** The world-tube of the bucket is parallel-transported along the timelike geodesics defined by the metric.
  *   **Rotating bucket:** The world-tube of the bucket deviates from the local inertial frames defined by the metric.

  The curvature of the water is a physical effect caused by acceleration relative to the **local metric field**. The metric field is real (it carries energy, it curves, it propagates waves), but it does not require the underlying manifold points to have primitive identity.

  So, you do not have to give up the reality of rotation to save the Shift/Hole intuition. You only have to give up the idea that rotation is relative to a "container" of points. It is relative to the dynamical geometry (the metric) which permeates the universe.

  *Note on "Spinning the Whole Universe":* If you literally apply a rotation diffeomorphism to the *entire* solution (matter + metric + everything), Leibniz Equivalence says nothing has changed. But usually, when we discuss the bucket, we are comparing two *different* solutions: one where the matter is at rest relative to the metric's inertial frames, and one where it is not. That difference is physical.

  ### The Verdict on the One-Sphere Universe

  Now, apply this principle to your final case: **An otherwise empty universe containing exactly one sphere.**

  **1. Does it have a Position?**
  **No.**
  Position is defined relationally or relative to a background structure.
  *   If you believe in Leibniz Equivalence (as you should, to avoid the Hole Argument indeterminism), a global translation of this sphere is a gauge transformation.
  *   There is no "grid" underneath it to pin it down. The manifold points have no haecceity.
  *   Therefore, "where" the sphere is has no physical meaning. It is a gauge artifact.

  **2. Does it have a Size?**
  **Yes.**
  This is the subtle part.
  *   In Newtonian physics, size might be tricky without an external ruler, but in GR, the **Metric Field** provides the ruler.
  *   Even if the universe is empty except for the sphere, the sphere itself is a distribution of matter/energy which curves spacetime. The spacetime *inside* and *around* the sphere has a specific geometry (intrinsic curvature).
  *   The sphere has an intrinsic geometry (e.g., its circumference-to-diameter ratio, its surface area in terms of the metric).
  *   Because the metric field is physical (unlike the manifold points), the scale it defines is physical.
  *   *Caveat:* In some conformal theories of gravity, scale might be gauge, but in standard GR, the metric determines proper distances. So, the sphere has a definite proper radius.

  ### Summary of the Philosophy

  You are advocating for a position known as **Sophisticated Substantivalism** (or sometimes **Metric Substantivalism**).

  1.  **Reject Manifold Substantivalism:** Spacetime points are not individuals. They have no "this-ness." This solves the Shift and the Hole Argument.
  2.  **Accept Metric Realism:** The metric field is a physical entity. This solves the Bucket Argument (rotation is relative to the metric) and gives the One Sphere a Size.
  3.  **Adopt Leibniz Equivalence:** Symmetry-related models describe the same physical world. This unifies the Shift, Swap, Mirror, and Hole.

  **The Cost:**
  The only thing you have to "give up" is the intuitive Newtonian notion that space is a static container made of identifiable points. You must accept that spacetime is a dynamical field (the metric) defined on a topological manifold that serves only as a bookkeeping device for continuity, not a repository of identity.

  **The Remaining Worry:**
  The only lingering philosophical discomfort (which you likely felt during your PhD) is: *If the points have no identity, what is the metric field "on"?*
  Mathematically, it's a section of a bundle over a manifold. Physically, we don't know. Some approaches to Quantum Gravity (like Loop Quantum Gravity or String Field Theory) suggest the manifold itself might emerge from deeper structures, rendering the question of "points" obsolete. But for classical GR, the "Sophisticated Substantivalist" view is the standard consensus among those who take the Hole Argument seriously.

  **Final Answer:**
  Keep the Shift, Swap, Mirror, and Hole as "same world." Keep Rotation as "real physical difference relative to the metric."
  *   **One Sphere Position:** Meaningless (Gauge).
  *   **One Sphere Size:** Meaningful (Determined by the physical metric field).
