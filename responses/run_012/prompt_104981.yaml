  # HANDOUT: The Pramāṇa Decision Tree

  **Instructions:** Start at **Question 1**. Follow the path that matches your gut intuition about the case. Don't worry about school names or Sanskrit terms yet; just answer the questions. At the end, you'll land on a position.

  ***

  ### 1. The Smoke Test (Inference)
  You see smoke rising from a distant hill. You conclude there is fire there.
  **Is this *new* knowledge, or just a fancy way of remembering past experiences?**
  *   **A.** It's just memory/pattern recognition. I only *really* know what I can directly perceive right now. → **Go to End Point 1**
  *   **B.** It's new knowledge. I know something I can't currently see. → **Go to Question 2**

  ### 2. The Stranger Test (Testimony)
  You overhear a stranger say, "The bridge is out." You believe them, and it turns out to be true.
  **Did you know this *because* they said it (basic trust), or because you inferred they were reliable?**
  *   **A.** I inferred they were reliable. Testimony is just a type of Inference. → **Go to End Point 2**
  *   **B.** I trusted them by default. Testimony is its own basic source. → **Go to Question 3**

  ### 3. The Devadatta Test (Postulation)
  You know Devadatta is fat, but you also know he never eats during the day. You conclude: "He must eat at night."
  **Is this a distinct way of knowing (Postulation), or just Inference to the best explanation?**
  *   **A.** It's just Inference. → **Go to Question 4**
  *   **B.** It's a distinct source. We postulate facts to resolve contradictions. → **Go to Question 5**

  ### 4. The Trust Test (Validity)
  When you see a cup on the table, is that vision automatically trustworthy?
  *   **A.** No. A cognition needs an external check (like touching it) to be certified as knowledge. → **Go to End Point 3**
  *   **B.** Yes. A cognition is valid by default unless something proves it wrong. → **Go to End Point 4**

  ### 5. The Empty Table Test (Absence)
  You look at a table and see *no pot* on it.
  **Is "seeing the absence" a distinct source from "seeing the table"?**
  *   **A.** No. I just see the table; the "no pot" is implied. → **Go to End Point 5**
  *   **B.** Yes. Absence is a real object known by its own source. → **Go to Question 6**

  ### 6. The Double-Check Test (Overlap)
  Can two different sources certify the *exact same* fact? (e.g., Can you both *see* the fire and *infer* the fire?)
  *   **A.** Yes. Sources can overlap. → **Go to End Point 6 (Unoccupied)**
  *   **B.** No. Each source owns an exclusive domain of facts. → **Go to End Point 7**

  ***

  ## END POINTS

  **End Point 1: The Materialist**
  *   **Position:** Only Perception is a basic source.
  *   **Awkward Commitment:** You cannot claim to know scientific laws, morality, or anything beyond your immediate senses.

  **End Point 2: The Pragmatist**
  *   **Position:** Perception and Inference are basic. Testimony collapses into Inference.
  *   **Awkward Commitment:** Listening to a teacher is epistemically the same as guessing their mental state based on noise.

  **End Point 3: The Fallibilist**
  *   **Position:** Perception, Inference, Testimony, and Comparison are basic. Validity is Extrinsic (needs checking).
  *   **Awkward Commitment:** To know anything, you need a second knowledge to verify the first, risking an infinite regress.

  **End Point 4: The Pluralist**
  *   **Position:** Perception, Inference, and Testimony are basic. Validity is Intrinsic (automatic).
  *   **Awkward Commitment:** If knowledge is automatically valid, you must explain why human error exists at all.

  **End Point 5: The Minimalist Ritualist**
  *   **Position:** Perception, Inference, Testimony, Comparison, and Postulation are basic. Absence is not.
  *   **Awkward Commitment:** You can know "Devadatta eats at night," but you cannot strictly know "There is no pot here" as a positive fact.

  **End Point 6: [UNOCCUPIED]**
  *   **Status:** Theoretically possible, historically unexplored.
  *   **Why:** Accepting Postulation/Absence as basic sources usually comes with a commitment to exclusive domains (see End Point 7).

  **End Point 7: The Maximalist Ritualist**
  *   **Position:** All six sources (including Absence) are basic. Validity is Intrinsic. Domains are Exclusive.
  *   **Awkward Commitment:** The rigid boxing of knowledge sources makes learning inefficient (you can't use perception to check inference).

  ***
  *(End of Handout)*

  # INSTRUCTOR KEY & META-ANALYSIS

  **School Mapping:**
  *   **End Point 1:** **Cārvāka**. (Rejects inference as a *pramāṇa*).
  *   **End Point 2:** **Buddhist Pramāṇavādins** (Dignāga/Dharmakīrti). (Reduces testimony to inference).
  *   **End Point 3:** **Nyāya**. (Classic 4 *pramāṇas*, extrinsic validity).
  *   **End Point 4:** **Jain**. (Accepts 3+ *pramāṇas*, intrinsic validity. *Note: Jains often align with Nyāya on count, but this tree separates them via Validity*).
  *   **End Point 5:** **Prābhākara Mīmāṃsā**. (5 *pramāṇas*, rejects Absence).
  *   **End Point 7:** **Bhāṭṭa Mīmāṃsā** (Kumārila). (6 *pramāṇas*, accepts Absence, denies Overlap).

  **Unoccupied/Indistinguishable Notes:**
  *   **End Point 6 (Unoccupied):** This combination (Mīmāṃsā count + Nyāya overlap) is flagged as unexplored. Historically, the move to accept Postulation/Absence as independent sources (Mīmāṃsā) was paired with the *pramāṇa-vyavasthā* (exclusive domains) thesis to prevent redundancy.
  *   **Indistinguishable Leaves:** Without **Question 4 (Validity)**, **Nyāya** and **Jain** would land on the same leaf. They agree on the count of basic sources (mostly) but diverge sharply on whether knowledge is self-certifying. This confirms your hypothesis that the *reducibility/validity* forks are more philosophically salient than the raw count.

  **Meta-Commentary on Your Hypothesis:**
  You suspected the **reducibility fork** matters more than the **raw count**. This tree validates that intuition.
  1.  **Count is a Symptom:** The "number of *pramāṇas*" (4 vs. 6) is merely the *result* of how you answer the reducibility questions (Q3 & Q5). A student who answers "It's just inference" to the Devadatta case arrives at Nyāya/Jain (4-5 sources) regardless of whether they memorized the number "4."
  2.  **Validity is the Real Divider:** The raw count fails to separate Nyāya from Jain (both accept ~4 sources). Question 4 (Validity) is required to split them. This suggests that *how* a source justifies itself (intrinsic vs. extrinsic) is a deeper structural difference than *how many* sources there are.
  3.  **Overlap as a Constraint:** Question 6 shows that the "count" is constrained by the "overlap" rule. Mīmāṃsā inflates the count *because* they deny overlap (if sources can't overlap, you need more of them to cover reality). Nyāya keeps the count lower *because* they allow overlap.

  **Teaching Tip:**
  When debriefing, point out that Western epistemology often defaults to **End Point 3 (Nyāya)** or **End Point 2 (Buddhist)** without realizing it. Most analytic epistemologists treat testimony as reducible to inference (End Point 2) or demand externalist verification (End Point 3). The Mīmāṃsā position (End Point 7) offers a radical alternative: knowledge is innocent until proven guilty, and "nothingness" is a positive object of perception.
