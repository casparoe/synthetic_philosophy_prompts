prompt: |-
  I spent most of a long train ride last week arguing with a friend who works in evo-devo, and I still can't let the argument go. We were trying to say what we mean when we attribute a function to a structure — the function of a heart valve, the function of a kinase in a signalling cascade — and we kept sliding between two readings: what the thing was selected for, and what it does within a working system. She held that only the first is a genuine function claim, and that the second is a description of a mechanism dressed up in teleological clothing; I held that when we say a valve's function is to prevent backflow we are not making any claim about the valve's ancestry, and that if we were, most of physiology would be uninterpretable. What struck me afterwards was that we agreed about nearly every case and disagreed only about what a function claim commits us to: she took it to commit us to a counterfactual about what would have happened in an ancestral population under selection, I took it to commit us to a counterfactual about what the part would contribute in a system that is working. My half-formed idea is that the long-running standoff between selected-effects and causal-role accounts of function is not really a dispute about which items have functions — on the easy cases the extensions coincide — but about which counterfactuals and which norms function-talk is meant to underwrite, and that this is why each side keeps winning on its own examples and losing on the other's.

  I'm applying for a small internal grant — a four-month pilot, about the scope of one graduate student's summer — and need a two-page proposal built out of this. State the question so that it has a determinate answer: whether a single modal profile can do the work that explanatory biology asks of function-talk, or whether the etiological and causal-role notions have to be kept apart because they answer to different explanatory demands (evolutionary explanation, mechanistic decomposition, intervention and control). Explain why the existing positions leave this open — in particular, why the usual move of declaring one notion the real one and demoting the other to a mere description has not settled anything. Set out what I would actually do, month by month, and make the method case-driven rather than intuition-driven: assemble a small set of hard cases, work out what each account must say about each, then ask which counterfactuals the surrounding explanatory practice actually relies on. The hard cases I have in mind are (i) traits with an unambiguous selection history that now do nothing, i.e. vestiges; (ii) traits that are universal within a lineage and so were never present as heritable variants — the machinery of replication is the obvious example — where selectionist accounts look strained yet we attribute functions without hesitation; and (iii) parts of engineered or synthetic systems, which have robust causal roles and no evolutionary history at all. Say why this approach is better than the obvious alternatives — conceptual analysis of the word function, or a survey of what biologists happen to say — and be candid about the ways it could go wrong.

  Tell me what a result would look like (a decision procedure, or a principled argument that no single notion will do together with the cost of that pluralism), what would count as the project failing rather than merely being disappointing, and whether four months is realistic or whether the scope should be cut down. Don't include citations or a literature review — I know the territory and will add the references myself; refer to positions and arguments by description instead. Write it as a document I could hand to a review panel, not as notes.
