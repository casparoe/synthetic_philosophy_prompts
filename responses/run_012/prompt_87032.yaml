answer: |-
  **PROJECT TITLE:** The Modal Profiles of Biological Function: A Case-Driven Analysis of Explanatory Demand

  **PRINCIPAL INVESTIGATOR:** [Your Name]
  **DURATION:** 4 Months
  **REQUESTED SUPPORT:** Graduate Research Assistant (Summer)

  **1. INTELLECTUAL MERIT AND PROBLEM STATEMENT**
  Philosophical accounts of biological function are currently stalled in a standoff between two dominant frameworks. The first (etiological) defines function by what a trait was selected for in an ancestral population. The second (causal-role) defines function by what a trait contributes to a containing system's current capacity. Standard debate proceeds by arguing that one account captures the "real" meaning of function while the other is merely descriptive. This project proceeds from the observation that this zero-sum approach has failed to resolve the dispute because both accounts remain indispensable in scientific practice. Biologists routinely attribute functions to vestigial traits (supporting the etiological view) and to universal cellular machinery lacking variation history (supporting the causal-role view), often without sensing a contradiction.

  This suggests the dispute is not about the extension of the term "function" (which items have them), but about the *modal profile* function-talk is intended to support. Etiological accounts underwrite counterfactuals about evolutionary history and fitness consequences; causal-role accounts underwrite counterfactuals about systemic failure and mechanistic intervention.

  **The Research Question:** Can a single modal profile satisfy the explanatory demands placed on function-talk across evolutionary biology, physiology, and synthetic biology, or must we accept a principled pluralism where distinct function concepts are retained to answer distinct explanatory demands?

  Existing positions leave this open because they prioritize semantic correctness over explanatory utility. Declaring one notion "real" forces scientists to either abandon useful explanatory tools or engage in constant conceptual translation. This project bypasses semantic intuition to analyze the *inferential role* of function claims. We will not ask what biologists *say* a function is, but what counterfactuals their explanations rely upon when they invoke one.

  **2. METHODOLOGY AND WORK PLAN**
  This project employs a case-driven methodology rather than conceptual analysis or survey-based empiricism. Conceptual analysis risks privileging philosophical intuition over scientific practice; surveys risk capturing inconsistent self-reporting rather than actual explanatory structure. Instead, we will assemble a corpus of "hard cases" where the two accounts diverge, reconstruct the explanations given in primary literature, and isolate the specific counterfactuals required to make those explanations work.

  **Selected Hard Cases:**
  1.  **Vestigial Traits:** Traits with unambiguous selection history but no current systemic contribution (e.g., pelvic spurs in whales). Etiological accounts attribute function; causal-role accounts do not. We will analyze whether explanations of these traits appeal to ancestral utility or current systemic neutrality.
  2.  **Universal Lineage Traits:** Traits universal within a lineage, lacking history as heritable variants (e.g., the machinery of DNA replication). Selectionist accounts struggle here as there was no variant to select; causal-role accounts thrive. We will determine if function attribution here relies on hypothetical selection or current systemic necessity.
  3.  **Synthetic/Engineered Systems:** Parts of synthetic biological circuits with robust causal roles but no evolutionary history. Etiological accounts typically deny function; causal-role accounts affirm it. We will examine if researchers treat these functions as provisional (awaiting selection) or robust (based on design).

  **Month-by-Month Plan:**
  *   **Month 1: Case Curation and Reconstruction.** The PI and RA will finalize the specific biological examples for the three categories. We will collect representative explanations from textbooks and primary literature, reconstructing the logical structure of the arguments in which function claims appear.
  *   **Month 2: Modal Analysis (Vestiges and Universals).** We will map the counterfactuals implicit in the explanations for Cases 1 and 2. For vestiges, does the explanation fail if we remove the historical claim? For universal traits, does the explanation fail if we remove the systemic contribution claim?
  *   **Month 3: Modal Analysis (Synthetic) and Synthesis.** We will analyze Case 3 and compare the modal profiles across all three. We will test whether a single unified account can stretch to cover all three without losing explanatory power, or if the counterfactuals are incommensurable.
  *   **Month 4: Framework Development and Reporting.** We will draft the decision procedure or pluralist framework. The output will be a manuscript ready for submission detailing whether function-talk requires distinct concepts for distinct explanatory contexts.

  **3. EXPECTED OUTCOMES AND SIGNIFICANCE**
  A successful result will take one of two forms. Ideally, we will produce a **Decision Procedure**: a set of criteria mapping specific explanatory goals (e.g., predicting response to selection vs. predicting response to surgical intervention) to the appropriate function concept. This would legitimize pluralism not as a confusion, but as a necessary feature of biological reasoning.

  Alternatively, we may demonstrate that **No Single Notion Suffices**. If the counterfactuals required for evolutionary explanation are logically incompatible with those required for mechanistic control, the project will establish the cost of monism: adopting one account necessarily blinds researchers to specific types of biological failure or history.

  **Significance:** This moves the debate from "what is function?" to "what work does function do?" This clarifies interdisciplinary communication, particularly in synthetic biology where engineering and evolutionary concepts collide. It provides a normative guide for when it is appropriate to switch between historical and systemic descriptions.

  **4. FEASIBILITY AND RISK ASSESSMENT**
  **Feasibility:** A four-month pilot is realistic for this scope because we are not attempting a comprehensive survey of all biology. By restricting the analysis to three specific categories of hard cases, a single graduate student can perform the necessary textual reconstruction and modal analysis within the timeframe. The PI's existing expertise in this domain reduces the onboarding time.

  **Risk of Failure:** The project could fail if the "explanatory practice" in the selected cases proves too heterogeneous to codify. If biologists use function claims inconsistently even within the same case type, no clear modal profile will emerge. In this event, the project would still yield a valuable negative result: a demonstration that function-talk is too pragmatic and context-dependent to support a unified philosophical theory. A second risk is that the cases turn out to be resolvable by a sophisticated version of one account (e.g., an etiological account that incorporates systemic constraints). If so, the project will pivot to refining that unified account rather than arguing for pluralism.

  **Scope Management:** To ensure completion, we will limit the literature review to paradigmatic examples rather than exhaustive coverage. If Month 2 reveals the cases are too complex, we will drop the Synthetic Biology case and focus on the tension between Vestiges and Universal Traits, which represents the core conflict within natural systems.

  **5. BUDGET JUSTIFICATION**
  Funds are requested solely for graduate student summer support. No travel or equipment is required. The project relies on access to standard academic literature databases and regular supervision meetings.
