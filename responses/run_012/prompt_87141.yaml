answer: |-
  The legal doctrine of accession, as described, does not presuppose a rigorous or settled metaphysics of objects. Rather, it operates on a **folk mereology**—a loose, intuitive set of assumptions about how parts relate to wholes—that is instrumentalized for normative ends. The doctrine treats metaphysical questions (identity, persistence, composition) as legal levers to achieve equitable outcomes (preventing unjust enrichment, rewarding labor, protecting property), rather than as inquiries to be answered consistently.

  ### 1. The Implicit Conception of Objects

  **Does it assume a settled answer to composition?**
  No. The practice is fundamentally underdetermined regarding the metaphysics of composition. If the legal system assumed a settled answer, the criteria for determining the "principal" thing would not shift casuistically. The fact that paint on a panel belongs to the panel owner, while writing on parchment belongs to the writer (in some iterations), indicates that the law does not rely on a uniform ontological rule about when parts merge into a whole. Instead, it relies on a **functional ontology**: an object is a "new thing" when it serves a new social or economic function that outweighs the identity of its materials.

  **Survival vs. Destruction of Inputs**
  The doctrine slides between two incompatible pictures of composition, though it rhetorically favors one.
  *   **The Rhetoric:** The language of "loss of identity" suggests a metaphysics of **substantial change** (akin to Aristotelian hylomorphism), where the form of the new object destroys the substance of the old. The grape is destroyed to become wine; the thread is destroyed to become cloth.
  *   **The Practice:** In many cases, the inputs clearly survive physically (the paint remains on the canvas; the bricks remain in the wall). The "destruction" is legal, not physical. The doctrine accommodates the idea that inputs survive as parts (the canvas is still there under the paint) but treats them as *legally* extinguished to simplify title.

  **Requirements vs. Accommodation**
  *   **Strictly Required:** The practice strictly requires only that **discrete units of value** can be identified and tracked. It needs to be able to say, "Value A moved into Sphere B." It does not require that Sphere B be a metaphysical unity, only that it be a recognizable unit for the purpose of transaction and liability.
  *   **Merely Accommodated:** The doctrine comfortably accommodates the folk intuition that some objects are "more real" than others (a house is more of a "thing" than a pile of bricks). It uses this intuition to justify the Principal/Accessory distinction, but it does not require it to be true in a philosophical sense.
  *   **Underdetermination:** The casuistry is evidence that **no single account of composition is being applied.** If a strict mereological rule were in play (e.g., "chemical transformation creates a new object"), the verdicts on wine (chemical change) vs. cloth (physical weaving) would be consistent. They are not. The underdetermination lies in the criteria for "principal": sometimes it is value, sometimes bulk, sometimes nomenclature. This reveals that the "object" in accession law is a **normative construct**, not an ontological one. The law creates the unity of the object to resolve the conflict, rather than discovering a pre-existing unity.

  ### 2. Replacement View 1: Composition Never Occurs (Mereological Nihilism)

  On this view, there are no composite objects. There are only simples (particles, atoms) arranged in various ways. There is no "wine," only particles arranged wine-wise. There is no "house," only bricks arranged house-wise.

  **Impact on the Doctrine:**
  *   **What Must Be Rewritten:** The core mechanism of accession collapses. Accession depends on the creation of a *res nova* (new thing) that subsumes the old. If composites do not exist, no new thing is ever created. When A presses B's grapes, A has not created "wine"; A has merely rearranged B's particles. Since ownership attaches to the particles, B retains ownership of the particles regardless of their arrangement. The concept of the "accessory losing its identity" becomes meaningless, as the "accessory" (the grapes) never existed as a unified object to begin with, only as a collection of simples.
  *   **What Would Stand:** The underlying equitable principles might survive but would require a different legal vehicle. Claims for **unjust enrichment** or **trespass to chattels** (interpreted as trespass to arrangements of simples) would replace accession. The law would focus on the *labor* A expended on B's particles. A might gain a lien on the particles for the value of their labor, but they would not gain title to a "new object."
  *   **The Principal/Accessory Distinction:** This distinction vanishes. Without composites, there can be no merger of one object into another. There are only intermingled simples. The law would have to default to **co-ownership of the particles** proportional to the value of the input materials, as there is no "whole" to award to a single owner.

  ### 3. Replacement View 2: Composition Always Occurs (Mereological Universalism)

  On this view, any plurality of things constitutes an object. The "grape-plus-wine" is an object. The "paint-plus-canvas" is an object. The "unmixed-grain-plus-mixed-grain" is an object.

  **Impact on the Doctrine:**
  *   **What Must Be Rewritten:** The doctrine faces a problem of **proliferation**, not extinction. Every act of mixing creates infinite new objects (the sum of the parts, the sum of the parts plus the labor, the sum of the parts at time *t*, etc.). The legal challenge shifts from "Did a new thing come into existence?" to "Which of the infinite existing things is the *relevant* one for title?"
      *   The "loss of identity" test must be rewritten as a **rule of salience**. The law would have to stipulate that while the "grape-object" still exists, the "wine-object" is the legally salient one for purposes of trade.
      *   The Principal/Accessory test becomes a method for filtering universal objects. It is no longer about ontology (what *is* it?) but about pragmatics (which object *matters*?).
  *   **What Would Stand:** The **verdicts** would likely remain largely unchanged, but the **justification** would invert.
      *   *Current Justification:* The canvas eats the paint because the paint is no longer a distinct thing.
      *   *Universalist Justification:* The canvas and paint are both distinct things (and their sum is a third thing), but the law prioritizes the "canvas-object" because it has higher economic stability or pre-existing title.
      *   The casuistry (different rules for paint, grain, thread) becomes easier to justify metaphysically (since all are equally "objects") but harder to justify legally (since you need a non-metaphysical reason to pick one object over another). The "naming test" (what gives the thing its name) becomes the primary tool for selecting the salient object from the infinite plurality.

  ### Conclusion

  The doctrine of accession presupposes a **vague, pragmatic realism** about objects: it assumes composites exist when it is useful for them to exist, and that they are destroyed when it is useful for title to pass. It is underdetermined because it is not trying to solve a metaphysical problem; it is using metaphysical vocabulary to solve a distributive one.

  *   Under **Nihilism**, the doctrine breaks because the unit of ownership (the composite) is denied.
  *   Under **Universalism**, the doctrine strains because the unit of ownership is multiplied infinitely.

  The current practice sits in a "Goldilocks" zone of folk ontology, assuming just enough composition to allow for "new things," but not so much that ownership becomes incoherent. The casuistry is not a failure to find the right metaphysical principle; it is evidence that the law is applying **policy** through the mask of **ontology**.
