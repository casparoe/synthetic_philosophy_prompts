  2.  **Deconstruct the Philosophical Commitments of VSL/CBA:**
      *   *Core Theory:* Welfare Economics, specifically Kaldor-Hicks efficiency often grounded in Preference Satisfaction Utilitarianism.
      *   *Value Source:* Value is subjective and revealed through choices (revealed preference) or stated preferences (willingness to pay/accept).
      *   *Metric:* Willingness to Pay (WTP) or Willingness to Accept (WTA). This implies money is a proxy for utility.
      *   *Interpersonal Comparability:* It assumes utility can be aggregated. By using a single VSL number (or adjusted for income), it assumes a common metric exists, though often it sidesteps deep interpersonal comparison by focusing on aggregate willingness to pay. However, summing dollars implies dollars matter equally across persons, which is controversial.
      *   *Epistemic Assumption:* Individuals are the best judges of their own welfare (consumer sovereignty). They understand risks and trade-offs.
      *   *Life Valuation:* It values *risk reduction*, not life itself. It's ex ante, not ex post.

  3.  **Identify Rival Theories:**
      *   *Ruled Out:* Deontological rights-based views (rights shouldn't be traded for money), Objective List theories (value exists independent of preference), Strict Hedonism (if experience diverges from choice), Paternalism (if people judge poorly).
