answer: |-
  You are right to feel uneasy because the practice rests on a specific and contentious philosophical foundation that often goes unacknowledged in the dry language of regulatory dockets. At its core, the use of the Value of a Statistical Life in cost-benefit analysis presupposes a form of preference satisfaction utilitarianism wrapped in the technical framework of welfare economics. The implicit theory is that value is subjective and created only when individual preferences are satisfied, and that the best way to measure the intensity of those preferences is through what people are willing to trade for them, usually in terms of money. This means the government is not actually putting a price on life itself, but rather putting a price on the reduction of risk based on how much individuals ostensibly value that risk reduction. For this to work as a coherent moral arithmetic, it has to assume that utility is cardinal and comparable across people, at least insofar as dollars can serve as a common denominator. When an agency sums up the benefits of a rule by multiplying lives saved by a dollar figure, it is treating the willingness to pay of one person as equivalent to the willingness to pay of another, effectively assuming that a dollar represents the same amount of welfare regardless of who holds it, or else it accepts that the welfare of the rich counts for more than the welfare of the poor because their willingness to pay is higher.

  This framework also relies heavily on the assumption of consumer sovereignty, meaning it presumes individuals are the best judges of their own interests and that their choices reveal their true welfare. It assumes people understand probabilistic risks, that they do not systematically underestimate danger, and that their stated preferences align with what would actually be good for them. This is where your friend's point about the gap between choice and experience becomes critical. The current system rules out any theory of value that relies on an objective list of goods, such as health or autonomy, independent of what people want. It also rules out strict paternalism, which would argue that the government knows better than the worker whether taking a risky job is a good idea. Furthermore, it is largely incompatible with deontological ethics, which would hold that certain rights, like the right to life or bodily integrity, are trumps that cannot be weighed against aggregate costs. If life were a deontological constraint, you could not trade off any number of deaths against economic costs, yet that is exactly what cost-benefit analysis does. However, the practice is compatible with rule utilitarianism if you view the VSL not as a literal trade-off for specific deaths but as a heuristic for maximizing overall welfare across many regulations, and it is compatible with liberal egalitarianism only if you adjust the numbers to account for income inequality, which agencies rarely do in practice.

  When you look at the coherence of these commitments across different areas of law and policy, the picture falls apart. The regulatory use of VSL treats risk as a commodity that can be traded for money, consistent with a market-based view of the self. But the prohibition on selling kidneys treats the body as sacred or at least protected from market forces, implying a deontological or paternalistic view that certain things are not for sale regardless of consent. This suggests the government holds two conflicting theories of value simultaneously: one where your safety is worth whatever you say it is worth in a labor market, and another where your organs are priceless and cannot be sold even if you want to. Similarly, wrongful-death suits operate on a theory of corrective justice rather than allocative efficiency. A jury awarding damages is trying to make a specific victim whole or punish a wrongdoer, often using metrics like lost earnings or grief that have no relation to the statistical value of risk reduction used by the EPA. The regulatory model looks ex ante at statistical probabilities to maximize efficiency, while tort law looks ex post at actual harm to restore justice. These are not just different methods; they are different moral languages that do not translate cleanly into one another.

  If you were to swap out the underlying preference satisfaction view for the experienced well-being view your friend mentioned, the concrete changes to regulation would be drastic. Regulators would no longer be able to rely on wage premiums or surveys about willingness to pay, because people are often bad at predicting what will make them happy or suffer. Instead of asking how much money workers demand to face a risk, agencies would need to measure the actual suffering caused by premature death or injury. This would likely shift value away from older populations toward younger ones, not because of earnings, but because the younger person loses more years of experienced well-being. It would also distinguish between types of death; a painful, lingering death would be weighted more heavily than a quick one, even if the willingness to pay to avoid them was the same. Furthermore, regulators would have to ignore choices that do not lead to well-being, meaning they might regulate against risks that workers voluntarily accept if those workers are adapting to danger or misjudging probabilities. The metric would change from dollars to something like quality-adjusted life years, forcing the government to make direct judgments about the quality of life rather than hiding behind the veil of market choices. Ultimately, the current system hangs together only if you accept that revealed preference is the only legitimate source of value and that money is a neutral measure of welfare, but once you challenge those assumptions, the inconsistency between how we value life in regulation, in medicine, and in court becomes impossible to ignore.
