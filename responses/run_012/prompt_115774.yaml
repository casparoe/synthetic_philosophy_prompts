answer: |-
  Dear Colleague,

  It is a rare privilege to correspond with someone who has lived inside the arithmetic of risk rather than merely theorizing about it. You have spent thirty years operationalizing the Linear No-Threshold model, treating risk as a fluid that can be pooled, divided, and summed across populations, and now you find yourself unsettled because your moral intuition rebels against a philosophical puzzle that relies on that very same logic. You ask whether this rebellion is mere squeamishness or a considered judgment, and you suspect the difference lies in the distinction between certain trivial harms and tiny probabilities of serious ones. I believe your intuition is not only correct but points to a fissure in moral philosophy that your professional work successfully bridged through pragmatism, even if the underlying theory remains contested. To understand why you feel this tension, we must first locate what the disagreement is actually about. It is not merely a dispute over large numbers; it is a conflict between two different theories of value: one that views badness as a continuous substance like water, which can be accumulated in any quantity to fill a bucket, and another that views badness as discrete events that must reach a certain threshold of significance to count at all.

  When you practiced radiation biology, you were working within a framework of expected value, where the moral weight of an action is calculated by multiplying the magnitude of a harm by the probability of its occurrence. In that domain, a one-in-a-million chance of a fatal cancer is treated as a quantifiable unit of risk that can be added to another one-in-a-million chance from a different person to yield a statistical expectation of one death. This works because the harm at the end of the probability chain—cancer, death—is undeniably significant. It crosses a threshold of human suffering that demands moral attention. The speck of dust puzzle, however, presents you with harms that arguably never cross that threshold. A speck in the eye for a second is not just a small harm; it is a harm so trivial that it may not register as a negative experience in the narrative of a life once the moment has passed. If a harm does not disrupt a life, does not linger in memory, and does not alter a trajectory, summing millions of them feels like summing zeros. Your intuition rejects the aggregation because you sense that below a certain threshold of significance, the moral value of a harm is not just small, but effectively zero. This suggests a discontinuous value function, whereas your professional life was built on a continuous one.

  This brings us to the distinction you rightly identified between certainty and probability. In the speck puzzle, every individual definitely suffers, but the suffering is negligible. In your work, no individual definitely suffers, but the potential suffering is catastrophic. This changes what can be added to what. When we deal with risks of serious harm, we are aggregating the *shadow* of a threshold event. Even if the probability is tiny, the event itself—death or cancer—is a moral absolute. By summing the probabilities, you are essentially counting how many shadows are cast over a population. There is a moral urgency to lifting those shadows, even if any single one is faint. Conversely, aggregating certain trivialities assumes that trivialities can compound into significance. But can a billion moments of forgettable annoyance equal a life destroyed? Most people, yourself included, feel they cannot. This is because serious harms have a qualitative weight that trivial harms lack. The radiation risk model works because it protects against the qualitative leap into disease, whereas the speck puzzle asks you to validate a quantitative leap that ignores quality. You are not being inconsistent; you are recognizing that the structure of the harm dictates the structure of the aggregation.

  So, should you have thought differently about your sums during your career? I would argue that your work was not morally wrong, but rather that it served a different master than pure moral truth. The Linear No-Threshold model is not necessarily a description of biological reality at low doses, nor is it a perfect map of moral value. It is a regulatory heuristic born of prudence. In the face of scientific uncertainty about where thresholds might lie, assuming there are none is the safest policy for public health. You were not summing moral disvalue in a philosophical vacuum; you were managing uncertainty to prevent the possibility of unacknowledged death. The reasoning only goes wrong if one conflates this regulatory precaution with a metaphysical claim that all harms are perfectly fungible. If you believed that a speck of dust was morally equivalent to a fraction of a cancer risk simply because the math said so, then the philosophy would be flawed. But if you understood the summation as a tool to minimize the chance of crossing serious biological thresholds across a population, then the arithmetic was justified by its goal, not by the abstract logic of aggregation. The error lies not in the summing, but in assuming the sum tells the whole story of value.

  There is a deeper implication here for how we understand risk and responsibility. If we accept your intuition that trivial harms do not aggregate to outweigh serious ones, we must also accept that there are limits to utilitarian calculation. We cannot simply trade off rights or serious bodily integrity against enough minor inconveniences, no matter how large the number of inconveniences. This protects individuals from being sacrificed for the aggregate comfort of the masses, a principle that aligns with many deontological ethics. However, it also complicates public policy. If we cannot sum trivial harms, how do we justify regulations that impose small costs on everyone to prevent rare catastrophes? The answer lies in the nature of the risk. We justify the cost because the catastrophe is a threshold event that violates a right to safety, not because the sum of the costs equals the sum of the benefits. Your career was justified because you were guarding against threshold violations, not because you believed a million specks equal a torture session. The puzzle is rigged in the sense that it invites you to treat all badness as homogenous, when our moral experience tells us it is stratified.

  Ultimately, you need not regret the arithmetic of your profession. You were operating in the realm of ex ante risk management, where the goal is to keep the probability of threshold crossings as low as reasonably achievable. The philosophical puzzle operates in the realm of ex post moral accounting, asking us to compare finished states of affairs. These are different games with different rules. In risk management, we must be conservative and assume continuity to ensure safety. In moral reflection, we are free to acknowledge discontinuity and recognize that some harms simply do not count until they reach a certain magnitude. Your squeamishness is not a failure of logic but a success of moral perception. It signals that you understand that human suffering is not a fluid that can be measured in milliliters, but a series of events that must be understood in the context of a life. The implication for you is that you can hold both views: the regulator who sums risks to protect the public from the shadow of death, and the philosopher who refuses to equate a billion annoyances with a single tragedy. The reasoning goes wrong only when we try to use the regulator's spreadsheet to solve the philosopher's question of value. You have earned the right to see the difference.
