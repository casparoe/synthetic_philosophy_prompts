      *   *Sentience:* I need to emphasize that not all deaths are equal. A cow's death is a greater loss than a vole's death.
      *   *Grass-fed specificity:* Dave says "grass-fed on pasture that isn't sprayed." This is the idealized scenario. In reality, scaling this is impossible. I should mention scalability.

  9.  **Final Plan:**
