          *   If the *wrong* is purely about epistemic agency manipulation, and both lying and misleading manipulate the hearer into a false belief (degrading agency equally), why is lying worse?
          *   (4) explicitly says the wrong is *not* in the truth-value of the words. But (2) implies there is an extra wrong in lying beyond the outcome (which includes the belief state).
          *   (3) tries to bridge this by appealing to the *mechanism* (assertion vs. inference). But (4) focuses on the *result* regarding agency. If agency is degraded equally (false belief is held in both), (4) suggests the wrongness should be equal. (2) says it's not.
          *   *Severity:* High. This strikes at the theoretical foundation.
      *   *(3) & (4):* **Potential Conflict.**
          *   (3) says lying is worse because it violates a specific norm of assertion (trust that speaker believes).
          *   (4) says the wrong is degrading epistemic agency (capacity to decide).
          *   Are these the same? Violating the norm of assertion *is* a way of degrading agency. But (4) says "not in the truth-value of the words." (3) relies on the *act* of asserting falsely.
          *   If the wrong is *only* agency degradation (4), does the specific mechanism (3) matter? If agency is degraded equally, (4) implies equal wrongness. (3) implies unequal wrongness based on the mechanism.
          *   *Severity:* Medium-High. It's a tension between a "normative violation" account (3) and a "consequentialist/capacity" account (4).
      *   *(2) & (5):* **Potential Conflict.**
          *   (2) says Lying is *pro tanto* worse than misleading (other things equal).
