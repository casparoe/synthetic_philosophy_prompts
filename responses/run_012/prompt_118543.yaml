      *   (4) *Ground of Wrongness (Deception):* Deception is wrong because it degrades epistemic agency (manipulation), *not* because of truth-value of words.
      *   (5) *Exception/Override (Murderer at the Door):* In extreme cases (protecting friend from murderer), lying is permissible, and one should not feel worse about lying than misleading if both work equally well.

