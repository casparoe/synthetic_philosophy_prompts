      *   *(4) & (5):* Consistent. If the wrong is agency degradation, saving a life might outweigh that degradation.
      *   *(1) & (5):* Consistent.

      *   **The Core Tension:** The main friction is between **(2)/(3)** and **(4)**.
          *   (2) & (3) assert a *lexical* or *intrinsic* disvalue to lying over misleading, grounded in the norm of assertion.
          *   (4) grounds the wrongness of deception in *epistemic agency*.
          *   If lying and misleading produce the *identical* false belief (as stipulated in 2), they degrade epistemic agency to the *identical* degree (the hearer decides based on false info in both cases).
          *   Therefore, if (4) is the *whole* story about what makes deception wrong, (2) cannot be true.
