          *   *Severity:* Critical. This undermines the theoretical unity of the view.
          *   *Repair:* Modify (4) to include "violation of the norm of assertion" as a *separate* source of wrongness alongside agency degradation. Or modify (2) to admit the difference is slight/context-dependent.
          *   *Cost:* Modifying (4) makes the theory less elegant (two grounds of wrongness). Modifying (2) weakens the central thesis of the paper (likely the main point).
          *   *Mind Changer:* If it turns out that misleading *does not* degrade agency as much as lying (e.g., because the hearer retains more ownership of the belief in misleading cases), then (4) and (2) reconcile.

      *   **Conflict 2: Moral Residue (2 vs. 5).**
