      *   *Focus on the "Character who mustn't know their own mind":* This is key. In strategy, you know your utility. In a novel, self-knowledge is the enemy of tension.

  7.  **Final Review against the Prompt:**
      *   Restate paradoxes in novelist vocab? Yes.
      *   Faithfully/without tidying? Yes, keep the contradictions.
      *   Residue report (translates, fudged, no counterpart)? Yes.
      *   Verdict (craft thin vs. strategist thin)? Yes.

  8.  *(Final Polish)*: Ensure the distinction between "character" (psychological entity) and "agent" (strategic entity) is clear in the verdict.

  **(Self-Correction Note):** Make sure I don't give writing advice. The user isn't asking "how do I fix this?" They are asking for a conceptual translation and analysis. Keep it analytical.

