      *   **Tone:** Intellectual sparring, not shouting. Both land punches, both give ground. No Wikipedia summaries, no academic citations.
      *   **Key Topics to Cover:**
          1.  *The Comparison Problem:* Better than what? (Past, neighbor, counterfactual, worst alternative). Proceduralist wants a "veil of ignorance" comparison; Pragmatist calls it a fantasy.
          2.  *Order as Output vs. Input:* Is order a deliverable or does suppressing dissent corrupt the data? Is legitimacy a property of the regime or a relation? Pragmatist distinguishes legitimacy/justification/stability; Proceduralist says she's conflating legitimacy with "not being overthrown."
          3.  *The Indispensable-Person Case:* A small state relying on one leader + external factors (oil, port). Does legitimacy survive death/changed conditions? Proceduralist must bite a bullet too (e.g., failing democracy keeps legitimacy).
          4.  *Real Concession:* One grants a point, positions shift/narrow.
