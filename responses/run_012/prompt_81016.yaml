  # Joint Statement on Procedural Integrity and Collective Justification

  **To:** The Institute Appeals Panel
  **From:** [Name], Coherence Camp; [Name], Deflationist Camp
  **Via:** [Rapporteur Name]
  **Subject:** Agreed Analysis of Voting Profile and Procedural Recommendations

  ### I. Agreed Claims

  1.  **The Current Record is Logically Inconsistent:** The written decision states that the science is sound, the team is capable, and the budget is proportionate, yet concludes the project is declined. This creates a prima facie contradiction in the panel's public record.
  2.  **Individual Consistency Was Maintained:** Every panelist voted on the three criteria and the final outcome in a manner consistent with the Terms of Reference; no individual voter violated the logic of the mandate.
  3.  **The Appeal Constraint is Binding:** The Appeals Panel requires that any justification for a decision be constructed from claims endorsed by a majority of the voting panelists.
  4.  **Majority Endorsement Exists for Premises:** A majority of the panel (at least 5 out of 7) affirmed each of the three positive criteria (Science, Team, Budget) individually.
  5.  **Majority Endorsement Exists for Outcome:** A majority of the panel (4 out of 7) voted against funding the project.
  6.  **Procedural Change is Required:** Regardless of the philosophical interpretation, the current voting profile exposes the Institute to successful appeals and reputational risk; the voting procedure for the next cycle must be altered to prevent a recurrence of this specific inconsistency.
  7.  **Sincerity Assumption:** For the purpose of this analysis, we assume all voters cast ballots reflecting their genuine judgment on the specific question asked at the time of voting, rather than voting strategically to force a predetermined outcome.

  ### II. Areas of Disagreement and Cruxes

  | Crux | Coherence Camp's Wording | Deflationist's Wording | Evidence or Argument Both Accept as Bearing on It | Coherence Camp's Prediction | Deflationist's Prediction | Substantive or Verbal |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Collective Rationality** | The panel acts as a single corporate agent; therefore, its output must satisfy norms of logical consistency applicable to a single reasoner. | The panel is an aggregation mechanism; its output need only satisfy procedural validity, not the doxastic consistency required of a natural person. | Precedents from the Institute's Appeals Board regarding past reversals based on "contradictory reasoning." | Appeals will succeed if the record shows contradictory premises and conclusions, regardless of procedure. | Appeals will fail if the procedure was followed correctly, even if the record appears contradictory. | Substantive |
  | **2. The Object of the Vote** | Voters should vote on the *premises* (criteria), and the outcome should be derived mathematically to ensure the collective view is coherent. | Voters should vote on the *outcome* (funding), using criteria only as individual guidance, to ensure the decision reflects the majority's will. | Behavioral data from previous cycles showing correlation between criterion scores and final funding decisions. | Premise-based voting will reduce appeals by aligning the record with the outcome. | Outcome-based voting will reduce appeals by removing the obligation to justify the result via majority-endorsed premises. | Substantive |
  | **3. "We Decided" vs. "We Believe"** | To say "We decided" implies "We believe the premises leading to the decision"; without shared belief, the decision lacks authority. | To say "We decided" means "The mechanism terminated in a binding outcome"; shared belief is unnecessary for institutional authority. | Linguistic analysis of minutes from other Institute committees where "unanimous decision" was recorded despite dissenting reasons. | Ambiguity here will be exploited by appellants to claim the panel lacked confidence in its own findings. | Precision here will show appellants that the panel's internal beliefs are irrelevant to the procedural validity. | Verbal |

  ### III. Verbal Disputes

  *   **The Definition of "Panel View":** A portion of the disagreement stems from the definition of "view." The Coherence Camp defines a "panel view" as a set of propositions the panel endorses as true. The Deflationist Camp defines a "panel view" as the final administrative action taken. If both sides agree to use "Panel Finding" for criteria votes and "Panel Determination" for the funding outcome, approximately 30% of the rhetorical friction dissolves, though the normative disagreement on which should drive the other remains.

  ### IV. Residual Disagreement

  We disagree on whether the legitimacy of a collective decision depends on the logical consistency of the reasons attributed to the group or solely on the correctness of the procedure used to generate the outcome.

