  Right, let's get this straight for your slide. Dev is being pedantic because, in her view, precision matters. If you call something Goodharting when it isn't, you diagnose the wrong cure. You fix the incentive when you should have fixed the metric, or vice versa.

  Based on her track record, there are two main rules competing here. They agree on almost everything except this specific scenario.

  ### Rule 1: The "Valid Proxy" Rule (Strict Goodhart)
  **The Logic:** Goodhart's Law states: "When a measure becomes a target, it ceases to be a good measure." The key word is *ceases*. This rule says a metric can only be Goodharted if it was a valid proxy for the goal *before* the pressure was applied. The act of targeting must be what broke the correlation.
  **Evidence:** Look at her verdict on the story points (Case 5). She explicitly said it wasn't Goodharting because they "weren't measuring anything real in the first place". If the ruler was made of rubber before you started measuring, stretching it isn't Goodharting; it's just bad measurement.
  **Prediction for Growth Team:** **Not Goodharting.** Since everyone (including Dev) already agreed WAU was a "rubbish measure" of loyalty before the target was set, the correlation was already broken. Chasing it is vanity metric optimisation, not Goodharting.

  ### Rule 2: The "Perverse Incentive" Rule (Broad Goodhart)
  **The Logic:** Goodharting occurs whenever a target drives behaviour that undermines the broader organisational goal, regardless of the metric's initial validity. If hitting the number makes the actual outcome worse, it's Goodharting.
  **Evidence:** This fits Cases 1, 2, 3, and 4 perfectly. In the click-through model (Case 2), clicks were always an imperfect proxy for engagement, but optimizing them broke the long-term value. The focus here is on the *harm caused by the pressure*, not the prior validity of the metric.
  **Prediction for Growth Team:** **Goodharting.** There is a target (+25% WAU). There is optimisation (nudges/alerts). There is harm (users still churn, likely annoyed by alerts). Therefore, it fits the pattern.

  ### Which one would I bet on?
  I'd bet heavily on **Rule 1 (The Valid Proxy Rule)**.

  Dev is a staff engineer; she cares about root causes. Her reasoning in Case 5 ("weren't measuring anything real in the first place") is the smoking gun. She distinguishes between a metric that *breaks* under pressure and a metric that was *broken* to begin with. In her eyes, Goodharting is a specific failure mode where pressure corrupts a useful signal. If the signal was already noise, chasing it is just management incompetence, not an economic law. She'll likely call this "Vanity Metric Chasing" on your slide, not Goodharting.

  ### Is there a third rule?
  Yes, there's a strong contender that fits her history just as well.

  **Rule 3: The "Open Secret" Rule**
  **The Logic:** Goodharting requires an element of unforeseen consequence or information asymmetry. If everyone knows the metric is flawed *before* the target is set, chasing it isn't Goodharting; it's an acknowledged trade-off.
  **Evidence:** In Case 2, "nobody decided to do that"—the clickbait was an emergent surprise. In Case 5, everyone knew points were fake. In the New Case, "everyone... has been saying for ages that WAU is a rubbish measure".
  **Prediction:** **Not Goodharting.** Because the flaw was known upfront, the negative outcome isn't a "law" kicking in; it's a known cost of doing business that leadership ignored.

  ### The Test Case to Settle It
  To prove which rule she's running, put this scenario to her (or on a follow-up slide):

  **The "Zombie Metric" Case:**
  > "We used to track 'Server Response Time' to gauge user experience. It was a great metric. Then we migrated to a new architecture where response time is always <100ms regardless of actual user perceived speed. The metric is now broken, but leadership doesn't know. They set a target of <50ms. The engineering team disables logging to hit the target. User experience degrades."

  *   **If she says "Goodharting":** She's following **Rule 2 (Perverse Incentive)**. The target caused harm.
  *   **If she says "Not Goodharting":** She's following **Rule 1 (Valid Proxy)**. The metric was already broken (by the architecture change) before the target was set, so the target didn't *cause* the loss of validity.

  ### The Rule to Avoid on Stage
  Do **not** say: *"Goodharting is when people cheat or lie to hit a number."*

  Her verdict on the click-through model (Case 2) rules this out. She called that Goodharting even though "nobody decided to do that". It was the algorithm optimizing literally, not humans lying. If you define it as fraud, you'll exclude the most dangerous kind of Goodharting—the kind that happens automatically in your ML pipelines.

  **Summary for your slide:**
  Dev's rule is likely: **"Goodharting requires a valid metric to be corrupted by pressure. If the metric was already rubbish, it's just bad management."** Expect her to call the WAU situation "Vanity Chasing", not Goodharting.
