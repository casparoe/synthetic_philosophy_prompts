prompt: |-
  ok so for my history class we have to write about whether the people who did this stuff in a genocide were monsters or just normal guys who got swept along, and my teacher mentioned theres a whole fight between historians about it — one side says they were ordinary men who mostly didnt want to do it and just followed orders and went along with the group, the other side says no, they were already willing and had been hating these people for years before anyone ordered them to do anything. And I noticed that when I argue it out loud I keep switching sides depending on which example I'm using. So I made up a bunch of fake cases (I know theyre fake, but theyre the kind of thing that actually happened) and wrote down what I honestly think about each one, and now I cant find the rule behind my own answers. Can you figure out what rule I'm actually using, or tell me theres no single rule and I have to give up one of my answers?

  The cases (all made up, everyone's an adult unless I say otherwise):

  - Marco: regular soldier, his unit gets ordered to shoot a group of prisoners, he does it. Doesn't enjoy it, feels sick after. I say hes very much to blame. Like 8 out of 10.
  - Tomas: same unit, same order, refuses, gets executed for it. He didn't save anybody. I say 0. I definately think hes a hero actually.
  - Petr: same unit, same order, but they told him if he refuses they'll shoot his wife and kids. He shoots. I say like 3. Still blameworthy but way less.
  - Otto: drives the truck that brings people to the site. Never shoots anyone, never even gets out of the cab. I say maybe 5.
  - Klein: works in an office far from all of it, filling out the forms that say who goes on which transport. Never sees a single victim. I want to say 1. But then I think: the transports literally dont run without him. So why am I so easy on him?
  - Ivan: after the family in his building gets taken, he moves into their apartment and keeps their furniture. I also want to say 1, but hes way closer to the harm than Klein is — hes sleeping in their bed. That bugs me.
  - Anna: tells the authorities her neighbor is hiding, because she wants the neighbors apartment. I say 6. So informing on someone is way worse than moving into their stuff afterward, which feels true but I dont know why.
  - Lukas: 14, joins the youth wing, marches, believes all of it, never hurts anyone. I say... 0? 2? I dont like him but I cant tell if "I dont like him" is the same as "hes to blame."
  - Brandt: an officer who thinks the whole ideology is garbage, doesn't believe a word of it, but beats people because he enjoys it, more than hes ordered to. I say 10. Worse than Marco, who actually believes it and has killed more people.
  - Vera: knows everything, stays home, does nothing, survives. I say 0, but I feel bad saying 0, and I dont know if that feeling is about her or about me.

  My cousin says it should be a multiplication: how bad the thing was, times how much you wanted to do it, times how free you were not to. But then Lukas is 0 (he never did anything bad) and I dont feel 0 about him, and Tomas is also 0 on the "thing" side and hes my hero, so that cant be it either.

  Also I think I might be answering two different questions without noticing: how much did this person cause, and how bad a person are they. Petr caused a lot and I say hes barely to blame; Brandt caused less than Marco and I say hes worse. So maybe I'm not even tracking one thing.

  So: is there one principle that gets all of these, or close? If I have to give one up, which one, and why that one? And what does your principle say about these, which I havent made my mind up on: a guy who could have hidden a family in his attic and didn't (I feel like thats different from Vera, but maybe its not); a guy who did all of it and then after the war confessed and testified (does that change how blameworthy he was, or only how much he should be punished?); a guy who was 16; and a guy who was a genuinely great dad to his own kids the whole time — does that matter at all, or is it just noise?
