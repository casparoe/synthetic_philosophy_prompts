prompt: |-
  I'm a PhD student in decision theory, and I keep running into an analogy that a colleague uses to dismiss the superrationality literature outright. His version is this: a superrational player in the Platonia dilemma — a fixed group is told that exactly one of them must send a telegram, that everyone gets nothing if none or more than one does, and that the superrational prescription is for each to send with probability one over the number of players — is doing nothing more than what an evidential decision theorist does in Newcomb's problem. Both, he says, treat their own action as evidence about how things will go rather than as a cause of them: the superrationalist treats their choice as evidence about what the other copies of themselves will choose, the evidentialist treats their choice as evidence about what the predictor predicted. On his view the two are the same move, so every standard objection to evidential decision theory — the smoking-lesion case, the spurious-correlation worry, the charge that it rewards magical thinking — transfers unchanged. He adds that the Luring Lottery episode, where readers submitted absurdly large entry numbers and diluted the prize into nothing, shows the superrational prescription is a nonstarter in practice, and concludes that superrationality is a dead end and that the Platonia dilemma is just Newcomb's problem with more players.

  I'd like to audit this properly instead of trading intuitions. Could you give me an explicit correspondence table — what plays the role of the predictor, the prediction, the correlation, the evidence, the act, the payoff — and then separate the disanalogies that actually bear on his conclusion from the ones that don't? Specifically:

  1. Is the superrational correlation supposed to be causal, evidential, or something else, and does that difference matter for whether the evidential-decision-theory objections transfer?
  2. Does moving from two players to a fixed group, and from a pure strategy to the mixed-strategy prescription in the Luring Lottery, change anything structurally, or is it just Newcomb with extra agents?
  3. What does the analogy quietly import? For instance, does it assume the correlated parties are distinct agents with a track record, when the superrational story treats them as identical reasoners facing the same problem? And is Hofstadter's reply to the magical-thinking charge — that in these cases there is no choice to make, only an answer to figure out, and that the sameness comes from shared logic rather than causation — a genuine disanalogy or a verbal dodge?
  4. Is the Kantian gloss that some writers give superrationality, and that Roemer's Kantian equilibrium tries to formalize, the same claim as the evidential-decision-theory gloss, or a different analogy doing different work? If the latter, my colleague may be running two analogies together.
  5. Is the Luring Lottery outcome evidence against the prescription, or evidence about what happens when the participants are not the idealized agents the prescription is about?

  Please flag which parts of this are settled among people who work on it and which are genuinely contested — I don't want a contested reading presented as the consensus. And if there's a better analogy for what superrationality is doing, or for what evidential decision theory is doing, tell me what it is and what it captures that the Newcomb analogy doesn't.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **User Persona:** PhD student in decision theory. Needs rigor, nuance, and awareness of the literature (not just pop-sci summaries).
      *   **Core Issue:** A colleague dismisses superrationality (Hofstadter) by equating it with Evidential Decision Theory (EDT) in Newcomb's Problem, arguing that objections to EDT (Smoking Lesion, etc.) apply equally to superrationality. The colleague also cites the *Luring Lottery* as empirical disproof.
      *   **Task:** Audit this analogy. Provide a correspondence table. Analyze specific disanalogies (causal vs. evidential, group size/strategy, identity/logic vs. prediction, Kantian vs. EDT, Luring Lottery interpretation).
      *   **Constraints:** Flag settled vs. contested claims. Avoid presenting contested views as consensus. Suggest better analogies if available.

  2.  **Initial Assessment & Fact-Checking:**
      *   *Superrationality:* Coined by Douglas Hofstadter (1983, *Scientific American*, "The Prisoner's Dilemma and the Superrationality"). Key idea: Identical reasoners facing identical problems will reach identical conclusions. It's about logical correlation, not causal influence.
      *   *EDT:* Chooses acts based on conditional probabilities $P(O|A)$. Criticized for spurious correlations (Smoking Lesion).
      *   *Newcomb's Problem:* Predictor vs. Agent. EDT one-boxes, CDT two-boxes.
      *   *Platonia Dilemma:* $N$ players. Exactly one must act to win. Superrational solution: Randomize with $p = 1/N$.
      *   *Luring Lottery:* Hofstadter's follow-up experiment. Readers invited to submit a number; prize = $1,000,000 / (\text{sum of entries})$. Many submitted huge numbers. Prize became negligible.
      *   *The Colleague's Claim:* Superrationality = EDT applied to multi-agent settings. Therefore, EDT objections kill Superrationality.
      *   *Validity:* This is a common critique, but it's nuanced. Superrationality is often modeled as Correlated Equilibrium or Nash Equilibrium in symmetric games, but Hofstadter's specific philosophical justification relies on "logical identity." EDT relies on statistical correlation. The distinction is crucial.

  3.  **Drafting the Correspondence Table:**
      *   Need to map Newcomb (EDT) elements to Platonia (Superrationality) elements.
      *   *Newcomb:* Agent, Predictor, Box Content (Prediction), Act (1-box/2-box), Payoff.
      *   *Platonia:* Agent, Other Players (Copies), Their Actions (Logical Correlates), Act (Send/Don't Send), Payoff.
      *   *Key Distinction:* In Newcomb, the prediction *precedes* the act (causally). In Platonia, the other players' decisions are *simultaneous* but logically linked.

  4.  **Addressing the 5 Specific Questions:**

      *   **Q1: Causal vs. Evidential vs. Logical.**
          *   EDT relies on $P(O|A)$. If the correlation is spurious (Smoking Lesion), EDT fails.
          *   Superrationality relies on *logical necessity* (if we are identical reasoners, we must output the same algorithm). This is closer to *Functional Decision Theory (FDT)* or *Timeless Decision Theory (TDT)* than classic EDT.
          *   *Verdict:* The colleague is partially right (it's not causal), but wrong to equate it with *standard* EDT. It's "logical correlation," not "statistical correlation." This blocks the Smoking Lesion objection (the lesion doesn't force logical identity).
          *   *Status:* Contested. FDT/TDT proponents argue this distinction matters. CDT proponents say it's all magical thinking.

      *   **Q2: Group Size & Mixed Strategies.**
          *   Newcomb is 1 agent vs. 1 predictor. Platonia is $N$ agents.
          *   Platonia requires a mixed strategy ($1/N$) to maximize expected utility symmetrically. Newcomb is usually pure (1-box).
          *   *Structure:* In symmetric games, the "Nash Equilibrium" is often defection. Superrationality aims for the Pareto optimum via symmetry.
          *   *Verdict:* It's not just "Newcomb with more agents." It's a coordination problem under symmetry constraints. The mixed strategy aspect is a mathematical necessity of the payoff structure, not just a philosophical stance.
          *   *Status:* Settled math (symmetric mixed NE), contested philosophy (is it rational?).

      *   **Q3: Identity vs. Distinct Agents.**
          *   Colleague assumes distinct agents with track records. Hofstadter assumes "identical reasoners."
          *   If agents are truly identical (same source code), it's not "evidence," it's "logical consequence."
          *   Hofstadter's "no choice, only answer" is the core of the *logical* view.
          *   *Verdict:* This is the strongest disanalogy. EDT handles statistical correlations between distinct entities. Superrationality handles logical correlations between identical algorithms.
          *   *Status:* Contested. Metaphysics of agency.

      *   **Q4: Kantian vs. EDT.**
          *   Kantian: "Act only according to that maxim..." (Universalizability). Roemer's Kantian Equilibrium formalizes this as choosing a profile everyone adopts.
          *   EDT: "Choose act that gives best news."
          *   *Verdict:* They are different. Kantian is about *willing a universal law*. EDT is about *conditional probability*. Superrationality bridges them but is distinct. The colleague is conflating normative justifications.
          *   *Status:* Settled in philosophy (different frameworks), contested in application (do they yield same results?).

      *   **Q5: Luring Lottery.**
          *   Outcome: Failure.
          *   Interpretation: Humans aren't superrational. They aren't identical reasoners. They tried to outsmart the system.
          *   *Verdict:* Evidence against *human compliance*, not necessarily against the *normative theory* for idealized agents. Similar to how Allais paradox doesn't disprove Expected Utility Theory for ideal agents, just describes humans.
          *   *Status:* Settled (humans failed), Contested (does this invalidate the theory?).

  5.  **Synthesizing the "Better Analogies":**
      *   If Newcomb/EDT isn't perfect, what is?
      *   *TDT/FDT:* This is the modern formalization of Hofstadter's intuition.
      *   *Program Equilibrium:* Tennenholtz, etc. Agents submit code.
      *   *Schelling Points:* Coordination without communication.
      *   *Recommendation:* Program Equilibrium is the closest technical match. TDT is the closest decision-theoretic match.

  6.  **Refining the Tone:**
      *   Academic, precise, acknowledging the PhD level.
      *   Avoid taking sides dogmatically, but highlight where the colleague's argument is weak (specifically the EDT vs. Logical Correlation distinction).
      *   Ensure "Settled" vs. "Contested" flags are clear.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Smoking Lesion" objection specifically? *Yes, under Q1.* The lesion creates a common cause, not logical identity.
      *   *Check:* Is the Luring Lottery analysis fair? *Yes, Hofstadter himself was disappointed but maintained the theory was for idealized reasoners.*
      *   *Check:* Is the distinction between EDT and TDT clear? *Crucial.* EDT conditions on the act. TDT conditions on the *algorithm*. Superrationality is closer to TDT. The colleague's critique holds against EDT-superrationality but fails against TDT-superrationality.
      *   *Check:* Roemer's Kantian Equilibrium. *Need to be careful.* Roemer formalizes "Kantian" optimization as maximizing utility if *everyone* did the same. This is mathematically similar to superrationality but philosophically distinct from EDT.

  8.  **Final Polish:** Organize with clear headings. Ensure the correspondence table is sharp. Add a bibliography/references section for further reading (Hofstadter, Yudkowsky, Roemer, etc.). (Self-correction: Keep references informal but precise).

  9.  *(Final thought on the colleague's claim)*: The colleague is making a "category error" argument. They are saying Superrationality is just EDT in disguise. The counter-argument is that Superrationality is *Logical* Decision Theory. I need to make sure this distinction is the centerpiece.

  10. **Drafting the Response.** (Proceeds to generate output based on these thoughts).
answer: |-
  This is a sophisticated objection that cuts to the heart of how we model agency, correlation, and rationality. Your colleague's argument is a standard critique in certain circles (often associated with causal decision theorists), but it conflates **statistical correlation** (the domain of EDT) with **logical correlation** (the domain of Superrationality/TDT).

  Below is an audit of the analogy, structured to help you dismantle the conflation while acknowledging where the critique has bite.

  ### 1. The Correspondence Table

  Your colleague claims the structures are isomorphic. They are structurally similar, but the *ontological status* of the links differs.

  | Feature | Newcomb's Problem (EDT Context) | Platonia Dilemma (Superrationality) |
  | :--- | :--- | :--- |
  | **The Agent** | A single decision-maker. | One of $N$ symmetric decision-makers. |
  | **The "Other"** | The Predictor (Omega). | The other $N-1$ players. |
  | **The Link** | **Causal/Statistical:** Predictor simulates or predicts you *before* you act. | **Logical:** All players run the *same* reasoning algorithm simultaneously. |
  | **The Correlation** | $P(\text{Prediction} | \text{Act})$ is high due to prediction accuracy. | $P(\text{Other Act} | \text{My Act}) = 1$ due to logical identity (in the idealized case). |
  | **The Act** | 1-Box or 2-Box. | Send Telegram ($p$) or Don't ($1-p$). |
  | **The Payoff** | Depends on Prediction + Act. | Depends on Total Count of Acts (0 or 1 wins). |
  | **The Rationality** | EDT: Maximize $E[U | \text{Act}]$. | Superrational: Maximize $E[U]$ assuming output symmetry. |

  **The Critical Disanalogy:** In Newcomb's, the correlation exists because the Predictor *observes* (or simulates) the agent. In Platonia, the correlation exists because the agents *are* (functionally) the same algorithm.

  ---

  ### 2. Audit of the Five Specific Claims

  #### Q1: Causal, Evidential, or Logical?
  **Status:** *Contested (Metaphysics of Decision Theory)*

  Your colleague argues that because the correlation isn't causal, it must be merely evidential, inviting the "Smoking Lesion" objection.
  *   **The Objection:** In the Smoking Lesion, a gene causes both smoking and cancer. EDT says "Don't smoke" (because smoking is evidence of cancer). CDT says "Smoke" (smoking doesn't cause cancer). EDT is accused of "managing the news."
  *   **The Superrational Defense:** Superrationality is not based on statistical evidence (like the lesion); it is based on **logical necessity**. If I am a perfect reasoner facing a symmetric problem, and you are a perfect reasoner facing the same problem, we *cannot* output different answers without one of us making a reasoning error.
  *   **Does the objection transfer?**
      *   **To EDT:** Yes. If you model superrationality as standard EDT, the Smoking Lesion critique holds.
      *   **To Logical Decision Theory (LDT/TDT):** No. Modern formalizations (Yudkowsky's TDT, Soares & Fallenstein's FDT) distinguish between *causal* influence and *logical* influence. A lesion does not force logical identity between agents; it forces statistical correlation. Superrationality relies on the latter.
      *   **Verdict:** Your colleague is correct that *classical EDT* cannot ground superrationality without inviting spurious correlation objections. However, they are incorrect that superrationality *requires* classical EDT. It requires a decision theory that treats logical facts as fixed points (like FDT).

  #### Q2: Group Size and Mixed Strategies
  **Status:** *Settled (Game Theory) / Contested (Normative Force)*

  *   **Structure:** Newcomb is typically a pure strategy problem (1-box). Platonia requires a symmetric mixed strategy ($p=1/N$) to maximize expected utility.
  *   **The Change:** Moving from 1-vs-1 to $N$-symmetric changes the math from a dominance argument to a coordination optimization.
  *   **Is it just Newcomb with more agents?** No. In Newcomb, the Predictor is an *external* constraint. In Platonia, the other players are *internal* to the reasoning process (they are "me" in a different location).
  *   **Structural Implication:** The mixed strategy prescription ($1/N$) is actually a **Nash Equilibrium** in a specific sense (a symmetric mixed equilibrium). However, standard Nash reasoning assumes others' strategies are fixed. Superrationality assumes others' strategies *move with yours*.
  *   **Verdict:** The colleague is right that the "magical thinking" charge feels stronger with $N$ players (how do I coordinate random seeds?). But mathematically, the $1/N$ solution is the unique symmetric solution that maximizes group utility. The dispute is whether an individual *ought* to play the group-maximizing symmetric solution.

  #### Q3: Identity vs. Distinct Agents (The "Magical Thinking" Charge)
  **Status:** *Contested (Philosophy of Agency)*

  *   **The Import:** The colleague assumes agents are distinct physical entities with separate causal histories. Hofstadter assumes agents are distinct *instantiations* of the same abstract reasoning process.
  *   **Hofstadter's Reply:** "There is no choice to make, only an answer to figure out." This is not a verbal dodge; it is a claim about **computational realism**. If the mind is a computation, and two minds run the same computation on the same input, the output is logically fixed.
  *   **Disanalogy:** In Newcomb, Omega predicts *you*. In Superrationality, *you* predict *yourself* as instantiated elsewhere.
  *   **Verdict:** This is the crux. If you accept computational functionalism, Hofstadter's view is coherent (though perhaps not actionable for humans). If you view agency as fundamentally tied to physical instantiation, the colleague is right. This is not a settled matter in decision theory; it is a metaphysical precondition.

  #### Q4: Kantian Gloss vs. EDT Gloss
  **Status:** *Settled (Formal Distinction)*

  *   **EDT:** "My act is evidence that others will act similarly." (Statistical/Epistemic).
  *   **Kantian/Roemer:** "I should choose the strategy that would be optimal if *everyone* adopted it." (Normative/Universalizability).
  *   **Roemer's Kantian Equilibrium:** John Roemer formalized this not as EDT, but as a solution concept where agents optimize a "Kantian" utility function (assuming others do the same).
  *   **The Conflation:** Your colleague is running two analogies together.
      1.  *Superrationality as EDT:* (My act correlates with theirs).
      2.  *Superrationality as Kantian:* (I ought to will my maxim as universal law).
  *   **Verdict:** These are different justifications for the same behavior. The EDT justification is vulnerable to the Smoking Lesion. The Kantian justification is vulnerable to the "Sucker's Payoff" (what if others *don't* follow the law?). Superrationality tries to bridge them by claiming the universalization is a *logical fact*, not a moral hope. The colleague's critique applies strongly to the EDT gloss, weakly to the Kantian gloss, and misses the Logical gloss entirely.

  #### Q5: The Luring Lottery
  **Status:** *Settled (Empirical) / Contested (Theoretical Implication)*

  *   **The Outcome:** Participants submitted huge numbers. The prize vanished.
  *   **Colleague's View:** Empirical falsification of the theory.
  *   **Counter-View:** Empirical falsification of *human superrationality*, not the theory itself.
  *   **Analogy:** Humans violate Expected Utility Theory (Allais Paradox). We do not say EU theory is "dead"; we say humans are not ideal EU maximizers.
  *   **Verdict:** The Luring Lottery shows that humans do not naturally reason as superrational agents. They reason as competitive Nash agents. This supports the view that superrationality is a **normative theory for idealized agents**, not a descriptive theory of human psychology. It does not prove the logic is inconsistent, only that the premises (identical reasoners) were not met.

  ---

  ### 3. Better Analogies

  If the Newcomb/EDT analogy is flawed because it relies on statistical prediction rather than logical identity, here are two more precise analogies used in the literature:

  #### A. Program Equilibrium (Tennenholtz, 2004)
  *   **The Setup:** Agents submit computer code to play a Prisoner's Dilemma. The code can read the opponent's code.
  *   **The Match:** This formalizes Hofstadter's intuition. If I submit code `IF opponent_code == my_code THEN Cooperate ELSE Defect`, and you do the same, we cooperate.
  *   **Why it's better:** It removes the "magical" vibe. The correlation is causal (the code reads the code) but the *logic* is what drives the symmetry. It shows superrationality is implementable in silicon, even if not in meat.
  *   **Relevance to Colleague:** It bypasses the "evidence" charge. The correlation is hard-coded logic.

  #### B. The Clone Prisoner's Dilemma
  *   **The Setup:** You play PD against a perfect genetic and psychological clone of yourself.
  *   **The Match:** This isolates the "Identity" variable.
  *   **Why it's better:** It forces the question: Do you defect against yourself? If you say "No," you are a superrationalist. If you say "Yes," you are a CDTist.
  *   **Relevance to Colleague:** It strips away the "predictor" element of Newcomb. There is no Omega. There is just *you* and *you*. The EDT objection (spurious correlation) vanishes because the correlation is identity.

  ### 4. Summary for Your Audit

  | Claim by Colleague | Audit Verdict | Nuance |
  | :--- | :--- | :--- |
  | **Superrationality = EDT** | **False** | Superrationality is closer to FDT/TDT. EDT relies on statistical correlation; Superrationality relies on logical identity. |
  | **Smoking Lesion applies** | **Conditional** | Applies if you ground SR in statistics. Fails if you ground SR in logic/computation. |
  | **Platonia = Newcomb + N** | **Misleading** | Newcomb is Agent vs. Predictor. Platonia is Agent vs. Self (instantiated elsewhere). |
  | **Luring Lottery disproves SR** | **False** | Disproves human compliance, not normative validity for ideal agents. |
  | **Kantian = EDT** | **False** | Different normative foundations (Universalizability vs. Conditional Probability). |

  ### 5. Recommended Reading for the Audit

  To arm yourself against the "settled consensus" claim (which is often just CDT dominance speaking), point your colleague to:

  1.  **Hofstadter, D. (1983).** "The Prisoner's Dilemma and the Superrationality." *Scientific American*. (The source text).
  2.  **Yudkowsky, E. & Soares, N. (2017).** "Functional Decision Theory." *arXiv*. (Formalizes the "logical correlation" distinction).
  3.  **Tennenholtz, M. (2004).** "Program Equilibrium." *Games and Economic Behavior*. (The computer science formalization).
  4.  **Roemer, J. (2010).** "Kantian Equilibrium." *Scandinavian Journal of Economics*. (The Kantian formalization distinct from EDT).

  **Final Advice:** Your colleague is arguing from the **Causal Decision Theory (CDT)** consensus, which currently dominates academic philosophy and economics. In that framework, they are "right" that superrationality looks like magical thinking. However, in **Computer Science** and **AI Safety** (where agents can actually inspect each other's source code), superrationality (via Program Equilibrium/FDT) is treated as a serious, solvable technical problem, not a philosophical dead end. The "dead end" conclusion depends entirely on whether you view agents as opaque black boxes (CDT view) or transparent algorithms (FDT view).
