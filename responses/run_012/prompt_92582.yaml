  # Flowchart: Who Pays When the Robot Kills?

  **START NODE: The Premise**
  A self-driving car strikes a pedestrian. An autonomous drone strikes a target. A trading algorithm flash-crashes a pension fund. In all cases: the system caused serious harm, but no single human being satisfied the ordinary conditions for blame (they didn't know, couldn't have known, or couldn't have stopped it).

  **NODE 1: The Goal**
  **What do you want the concept of "responsibility" to achieve in this scenario?**
  *   **A.** I want to identify a culprit who *deserves* punishment or moral censure (Backward-Looking/Retributive). → *Go to Node 2.*
  *   **B.** I want to identify who must *fix* the harm, compensate the victim, and ensure it doesn't happen again (Forward-Looking/Answerability). → *Go to Node 6.*

  ---

  ### PATH A: The Blame Game (Backward-Looking)

  **NODE 2: The Diagnosis**
  **Is this inability to find a blameworthy human a new problem?**
  *   **A.** No. This is just the old "Problem of Many Hands." Complex bureaucracies have always diffused responsibility; autonomous systems are just the latest bureaucracy. → **LEAF 1: The Continuity View.** *(Position: There is no responsibility gap, only an organizational one.)*
  *   **B.** Yes. Machine autonomy creates a unique metaphysical hole that didn't exist with mere tools or bureaucracies. → *Go to Node 3.*

  **NODE 3: The Stretch**
  **Can we stretch the chain of blame back to the humans who built or deployed it?**
  *   **A.** Yes. Even if they didn't foresee *this* crash, they created the risk. They are responsible for the design, the training data, or the deployment context. → **LEAF 2: Tracing / Responsibility-by-Design.** *(Position: The gap is an illusion; we just need to widen the net of negligence.)*
  *   **B.** No. The system's learning or opacity breaks the chain. The designers literally could not have foreseen or prevented this specific outcome. → *Go to Node 4.*

  **NODE 4: The Verdict**
  **Is this "blame vacuum" a disaster or a revelation?**
  *   **A.** A revelation. It exposes that our obsession with finding a villain to punish is outdated. We don't need a culprit to have a functional society. → **LEAF 3: The Gap is Fine (Retributive Critique).** *(Position: The gap is real, but retributive blame is the problem, not the solution.)*
  *   **B.** A disaster. Without a blameworthy human, moral order collapses and victims are denied justice. → *Go to Node 5.*

  **NODE 5: The Remedy**
  **How do we restore moral order?**
  *   **A.** We restrict the technology. We do not deploy autonomous systems unless a human can meaningfully intervene or veto the decision. → **LEAF 4: Meaningful Human Control.** *(Position: Close the gap by limiting autonomy.)*
  *   **B.** We accept we can't close the gap, but we must acknowledge the moral loss. We proceed with the tech, but we carry the "moral remainder" of unassigned blame. → **LEAF 5: The Pessimistic Gap Thesis.** *(Position: The gap is real, it is bad, and it is unfixable without losing the tech.)*

  ---

  ### PATH B: The Repair Shop (Forward-Looking)

  **NODE 6: The Mechanism**
  **Since we aren't looking for a villain, who picks up the tab and answers for the system?**
  *   **A.** The Organization. The corporation, state, or collective entity that deployed the system bears the responsibility as a corporate agent. → **LEAF 6: Collective / Distributed Responsibility.** *(Position: Responsibility isn't individual; it belongs to the network or entity.)*
  *   **B.** The Fund. We decouple compensation from fault entirely. Victims are paid from a mandatory insurance pool or social fund, regardless of who "caused" it. → **LEAF 7: Strict Liability / No-Fault Compensation.** *(Position: Don't ask who did it; ask who pays for it.)*

  ---

  ### Analyst's Notes for the Sidebar

  **Collapsed Distinctions (The "Same Place, Different Map" Problem)**
  *   **Strict Liability (Leaf 7) vs. Pessimistic Gap (Leaf 5):** In practice, these often look identical. The Pessimist says, "We can't find a culprit, so we just have to live with it," which usually results in an insurance scheme. The Strict Liability advocate says, "We don't need a culprit, just an insurance scheme." The policy is the same; the philosophical sadness differs.
  *   **Collective Responsibility (Leaf 6) vs. Continuity View (Leaf 1):** Both argue that nothing metaphysically new has happened. The Continuity View uses this to say "Blame is still possible (somewhere)," while Collective Responsibility uses it to say "Blame is the wrong unit; look at the Org." They share a diagnosis but diverge on the prescription.

  **Unoccupied Territory (The Empty Quadrants)**
  *   **Backward-Looking + Gap is Fine:** This combination is logically incoherent. If you believe responsibility is *only* about desert/punishment (Node 1A), you cannot simultaneously believe the lack of a punishable human is "fine" (Node 4A). You would cease to be backward-looking.
  *   **Forward-Looking + Meaningful Human Control (Leaf 4):** This is rarely occupied. If your goal is purely forward-looking (repair/safety), restricting technology to preserve *human blame* makes no sense. You would only restrict tech if it made the system *less safe*, not if it made it harder to blame a human. MHC is almost exclusively a backward-looking remedy.
  *   **Tracing + Gap is Fine:** If you believe we *can* trace responsibility to designers (Node 3A), you generally believe the gap is closed (Leaf 2). Claiming the gap is closed *and* that the gap is fine is redundant; claiming the gap is open *and* we can trace is contradictory.

  **The "Hard Mode" Node**
  *   **Node 3 (The Stretch)** is where most legal battles are currently fought. Plaintiffs argue for **Tracing** (the engineer should have known); Defendants argue for **The Gap** (the neural net was opaque). The flowchart shows that accepting Tracing collapses the whole "Autonomy Exception" debate back into standard tort law.
