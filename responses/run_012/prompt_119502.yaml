answer: |-
  *   **Case for Contextualism (Anti-Presentism):**
      *   Moral judgment truncates explanation; condemning past agents shuts down inquiry into *why* they thought as they did.
      *   Anachronism is unfair: agents cannot be held responsible for concepts or knowledge inaccessible to them.
      *   The "best available standards" test allows for immanent critique without imposing modern metaphysics.
      *   While *agenda presentism* (topic selection) is unavoidable, *evaluative presentism* (moral verdicts) is a methodological error that distorts the past.

  *   **Case for Critical Presentism:**
      *   History is always written for the present; silence on moral evils functions as complicity or apology.
      *   The norm against presentism is itself historically situated (Butterfield), making the anti-presentist claim self-exempting.
      *   Determining what standards were "available" to a past agent requires present-day interpretive judgment, collapsing the distinction.
      *   Contextualism often privileges the coherence of the past over the moral needs of the present, protecting problematic figures under the guise of neutrality.

  ***

  **Marcus:** The problem isn't that we admire his hospitals or despise his racism. The problem is the phrase "read in his own context." When you say that about the reformer, I hear "excuse him." You're asking us to bracket the moral horror because it wasn't *his* horror. But if we bracket the horror, what are we doing here?

  **Elena:** We are trying to understand how a man could build shelters for the poor while simultaneously arguing they were biologically inferior. If I start by condemning him, I stop asking how those two beliefs coexisted in his mind. I turn him into a monster, and monsters don't have histories; they just have warnings.

  **Marcus:** But you're drawing a line I don't think holds. You distinguish between *evaluative presentism*—passing judgment by our standards—and *agenda presentism*—the fact that we care about this now because of our own sensitivities. You say the second is unavoidable but the first is bad practice. I think that's a fiction. The moment you chose to study his racial views rather than his drainage systems, you brought a present-day moral agenda. You can't park that agenda at the door when you start analyzing the text.

  **Elena:** I concede the agenda is presentist. I chose this topic because *we* care about race now. He didn't care about "race" in our sense. But acknowledging why I'm asking the question isn't the same as judging the answer. I can understand his logic without endorsing it. The methodological rule is: don't condemn him for failing to be us.

  **Marcus:** Here's where the ground gets slippery. You're invoking a norm against presentism. But where did that norm come from? It wasn't handed down from heaven. It was forged in a specific present—largely as a reaction against the Whig history Butterfield attacked in 1931. Your "rule" is historically situated. So, when you apply it to the reformer, aren't you exempting your own governing norm from the historicizing critique you apply to him? That's the *self-exemption problem*. You're historicizing his morals but universalizing your method.

  **Elena:** That's a fair hit. The anti-presentist norm is itself a historical product. But recognizing the genealogy of a tool doesn't break the tool. I can know that "objectivity" is a nineteenth-century invention and still try to be objective because it prevents me from just writing propaganda. It's a regulative ideal. I know I can't fully escape my time, but I must act *as if* I can to keep from distorting the evidence.

  **Marcus:** "Act as if." That's where I lose you. Because look at how you propose we judge him. You suggested we use what you call the *counterfactual-contemporaneity standard*. Did he act in accordance with the most defensible standards *available to him at the time*?

  **Elena:** Exactly. If there were contemporaries arguing against his racial views—there were—then he isn't exempt from critique. He failed by the standards of his own best peers. That avoids imposing our modern ethics.

  **Marcus:** But who decides what was "available"? To say a dissenting view was "available" to him requires you to interpret his social world, his education, his psychological capacity to hear dissent. That interpretation is happening *now*, with *your* categories. You're deciding which of his contemporaries count as "defensible" voices. You're likely privileging the ones who look more like us. So the "available standards" test isn't a way to escape presentism; it's a covert way to smuggle it in. You're still judging him, just using a proxy.

  **Elena:** I see the risk. If I select the "good" contemporaries based on who aligns with modern values, I've just circularly validated my own judgment. But isn't there a difference between saying "he was racist by 2024 standards" and "he was racist by 1890 standards of logic and consistency"? The latter is a claim about internal coherence, not moral progress.

  **Marcus:** Is it? When you say "defensible standards," you're making a moral claim about what *should* have been defensible. You're saying some voices in 1890 were right and others were wrong. That's not internal coherence; that's evaluation. You're trying to have it both ways. You want the authority of the context without the responsibility of the judgment. But if points two and three hold—if my norm is historically situated, and if determining "availability" requires present judgment—then contextualism collapses into covert presentism. You're just hiding the verdict behind a footnote about "context."

  **Elena:** I need to pause there. If contextualism collapses into covert presentism, then what? Do we just admit we are judging everyone by today's lights and move on?

  **Marcus:** Yes. Be honest. Say, "He did great work, but his racial views are unacceptable to us, and we study him to understand how such unacceptable views were normalized." That's honest. It admits the history is for *us*.

  **Elena:** But that risks making the past unintelligible. If I only study him to see how "unacceptable views" were normalized, I might miss why *he* found them convincing. I might miss the theological structure that made racism seem like charity to him. If I drop the regulative ideal of escaping my standards, I lose the ability to be surprised by the past. I only find what I brought with me.

  **Marcus:** So you're arguing that even if escaping our standards is impossible, believing it's possible is necessary?

  **Elena:** I'm arguing that the tension is productive. If I admit I can't escape my time, I become cynical. If I pretend I fully have, I become dogmatic. The practice of history lives in the struggle. I try to reconstruct his world to check my instincts. When I feel revulsion, I ask: "Is this revulsion revealing something about him, or something about me?" That check requires me to treat the anti-presentist norm as real, even if philosophically it's porous.

  **Marcus:** But that leaves us with a stalemate on the function of the history. For me, the history is useful *because* it judges. It draws a line between what we are and what we were. For you, the history is useful *because* it suspends judgment to reveal complexity. We agree on the facts: he built hospitals, he voiced racist theories, there were contemporaries who disagreed. We agree that *agenda presentism* is unavoidable. We even agree that the *self-exemption problem* is real—your norm is historically situated.

  **Elena:** Yes.

  **Marcus:** But we disagree on whether the *counterfactual-contemporaneity* standard saves you. I say it collapses into presentism because determining "availability" is a presentist act. You say it's a regulative ideal that disciplines that act.

  **Elena:** Precisely. I think the collapse is apparent, not real. Yes, I use present tools to determine availability. But I am constrained by the archive. If I claim a standard was available when there's no evidence he could have encountered it, my peers will catch me. The community of historians acts as a check on my presentism.

  **Marcus:** But the community shares your present. We're all sitting in this seminar, breathing the same air. We might all agree that a certain 1890s critic was "defensible" because we all share a 2024 consensus on what defensibility looks like. The check isn't the past; it's our current peer group.

  **Elena:** Then we are trapped.

  **Marcus:** Or we are honest.

  **Elena:** If we are trapped, then writing history is just talking to ourselves. I can't accept that. I have to believe that when I read his diary, I am encountering an otherness that resists my categories. If I reduce him to a symptom of my own moral concerns, I've erased him.

  **Marcus:** And if I reduce him to a context-bound agent who couldn't help himself, I've erased the victims of his policies. Their suffering isn't context-bound.

  **Elena:** So here is where we stand. We agree that total escape from the present is impossible. We agree that the rule against presentism is itself historical. But I insist that treating that escape as a regulative ideal protects the alterity of the past. You insist that treating it as a real possibility is dishonest and protects the powerful.

  **Marcus:** I think the disagreement is narrower now. It's not about whether we *can* escape the present. We can't. It's about whether the *attempt* to escape is ethically neutral or ethically charged. You think the attempt is methodological hygiene. I think the attempt is a political choice that favors the subject over the object of his history.

  **Elena:** And I think your approach favors the historian over the subject. We both claim to serve the truth, but we define truth differently. For you, truth includes moral verdict. For me, truth includes causal explanation, even when it complicates the verdict.

  **Marcus:** So we aren't going to resolve the reformer's case today.

  **Elena:** No. But I think I understand why you think my context is a shield.

  **Marcus:** And I understand why you think my judgment is a blinder. We're stuck with the tension.

  **Elena:** Then let's write the presentation to show the tension. Don't resolve it. Show how the archive demands explanation, and the conscience demands judgment.

  **Marcus:** Agreed. But I'm writing the conclusion.

  **Elena:** Fair enough.
