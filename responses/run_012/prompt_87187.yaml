  The protocol's efficacy was demonstrated immediately during the budgetary session for the aquatic facility. The council voted 5-4 in favor of Proposition A: "The town shall construct a pool." They subsequently voted 5-4 against Proposition B: "The town shall raise the property levy." Finally, they voted 6-3 in favor of Proposition C: "If the town constructs a pool, the town must raise the property levy."

  According to the charter, the town is now legally obligated to build a pool, forbidden from raising the money to pay for it, and bound by the rule that building the pool requires raising the money.

