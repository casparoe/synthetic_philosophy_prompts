      *   *The "Actuary Question":* "How is this different from Rank-Dependent Utility?"
          *   *Answer:* Mathematically, they are isomorphic (Quiggin 1982). Philosophically, RDU is descriptive (how people *do* behave, often violating EU), REU is normative (how people *should* behave to be rational, arguing EU is too restrictive). REU treats $r$ as an attitude toward risk inherent in rationality, not a cognitive bias.

