answer: |-
  Here is a 35-minute lesson plan designed for your specific audience and constraints. It prioritizes the "incremental" view of utility to make the risk function intuitive, handles the actuary's question immediately, and targets your three specific misconceptions.

  ### The Strategy: "The Ladder of Outcomes"
  **Core Metaphor:** Don't think of gambles as bags of outcomes. Think of them as ladders. You start at the bottom rung (the worst outcome). To get to the next rung, you need a certain amount of "luck." REU says the *value* of that climb depends on how much luck was required, weighted by your risk attitude.

  ---

  ### 0–5 Minutes: The Hook & The Actuary Pre-emption
  **Goal:** Define the project and distinguish REU from RDU immediately.

  1.  **The Problem with EU:** Start with the Allais Paradox. Briefly state that Expected Utility (EU) implies that rational agents must treat probabilities linearly. If you prefer A over B, you must prefer A* over B* in a way that many find intuitively irrational.
  2.  **The Actuary's Question (Pre-empted):** You said the actuary will ask about Rank-Dependent Utility (RDU) early. Put the answer on the board now.
      *   *Write:* **RDU (Quiggin, 1982)** vs. **REU (Buchak, 2013)**.
      *   *Say:* "The math you are about to see is isomorphic to Quiggin's Rank-Dependent Utility. If you stop there, you've missed the point. RDU is **descriptive**: it says humans *do* distort probabilities due to cognitive bias. REU is **normative**: it says rational agents *may* distort probabilities because risk is a distinct attitude from utility. RDU fixes a bug in the human brain; REU fixes a bug in Expected Utility theory."
  3.  **The Roadmap:** "We have 35 minutes. We will rebuild Expected Utility from the ground up, swap one component, and see how the risk function $r$ actually works."

  ### 5–15 Minutes: The First Brick (Reframing Expected Utility)
  **Goal:** Prove your hunch correct. EU must be taught as weighting *gaps* by *cumulative* probability before REU makes sense.

  1.  **Whiteboard Setup:** Draw three horizontal lines representing utility levels. Label them $x_1, x_2, x_3$ (where $x_1 < x_2 < x_3$).
  2.  **Standard EU:** Write the standard formula: $EU = p_1u(x_1) + p_2u(x_2) + p_3u(x_3)$.
      *   *Say:* "This views utility as weighting *outcomes* by their specific probabilities."
  3.  **The Incremental Shift:** Erase the formula. Rewrite EU using the "Ladder" method.
      *   Start at the bottom: You definitely get $u(x_1)$.
      *   To get the *extra* utility of $(x_2 - x_1)$, you need the outcome to be *at least* $x_2$. Probability: $P(X \ge x_2) = p_2 + p_3$.
      *   To get the *extra* utility of $(x_3 - x_2)$, you need the outcome to be *at least* $x_3$. Probability: $P(X \ge x_3) = p_3$.
      *   *Write:* $$EU = u(x_1) + (p_2 + p_3)[u(x_2) - u(x_1)] + p_3[u(x_3) - u(x_2)]$$
      *   *Verify:* Briefly show the algebra cancels out to the standard form.
  4.  **The Insight:** "In this formulation, we aren't weighting outcomes. We are weighting **improvements** by the **cumulative probability** of achieving them."
      *   *Check:* Look at the engineers. "Does this algebra hold?" (It will).
      *   *Why this matters:* This isolates the probability term attached to the *improvement*. This is the handle we grab to introduce risk.

  ### 15–25 Minutes: The REU Switch & The Single Case
  **Goal:** Introduce $r$, demonstrate rank dependence, and address Misconceptions 1 & 2.

  1.  **The Swap:** Erase the $p$'s in the cumulative terms. Replace them with $r(P)$.
      *   *Write:* $$REU = u(x_1) + r(p_2 + p_3)[u(x_2) - u(x_1)] + r(p_3)[u(x_3) - u(x_2)]$$
  2.  **The Single Case (The "Bonus Ladder"):**
      *   Use concrete numbers. Outcomes: £0, £50, £100.
      *   Probabilities: 1/3 each.
      *   *Visual:* Draw the ladder.
          *   Bottom gap (£0→£50): Weight is $r(2/3)$. (You need to avoid the worst 1/3).
          *   Top gap (£50→£100): Weight is $r(1/3)$. (You need the best 1/3).
  3.  **Addressing Misconception 1 (Rank Dependence):**
      *   *Scenario:* Keep the outcomes (£0, £50, £100) and the probabilities (1/3 each), but **swap the probabilities assigned to the outcomes**.
      *   *Gamble A:* 1/3 £0, 1/3 £50, 1/3 £100. (Top gap weight: $r(1/3)$).
      *   *Gamble B:* 1/3 £100, 1/3 £50, 1/3 £0. (Same gamble, just listed differently? No.)
      *   *Better Test:* Compare two different distributions with the same Expected Value.
      *   *Gamble Safe:* 50% £0, 50% £100. (One gap: weight $r(0.5)$).
      *   *Gamble Spread:* 25% £0, 50% £50, 25% £100. (Two gaps: weights $r(0.75)$ and $r(0.25)$).
      *   *Say:* "In EU, if the Expected Value is identical, the distribution of probability mass doesn't matter, only the sum. In REU, it matters *where* the probability mass sits in the ranking. The 25% chance of the top prize is weighted by $r(0.25)$. The 25% chance of the middle prize contributes to the lower gap, weighted by $r(0.75) - r(0.25)$."
      *   *Bone Feeling:* "The same 25% slice of probability counts for more if it secures the bottom than if it chases the top. That is rank dependence."
  4.  **Addressing Misconception 2 (Shape of $r$):**
      *   Draw a graph of $r(p)$ vs $p$.
      *   *Concave ($r(p) < p$):* Risk-averse. You discount the "hard" climbs (top gaps) more than the "easy" climbs.
      *   *Convex ($r(p) > p$):* Risk-seeking. You overweight the top gaps.
      *   *S-Shaped:* "Buchak allows $r$ to be convex in one stretch and concave in another. You can be risk-seeking over small stakes and risk-averse over large ones. It's a global attitude function, not a binary switch."

  ### 25–30 Minutes: Normativity (Misconception 3)
  **Goal:** Solidify the "Rational vs. Descriptive" distinction.

  1.  **The Challenge:** "If RDU and REU use the same math, why isn't REU just psychology?"
  2.  **The Argument:**
      *   In RDU, probability distortion is a **mistake** (a cognitive bug).
      *   In REU, the risk function is a **preference** (like the utility function).
      *   *Analogy:* "If I prefer chocolate to vanilla, that's my utility. If I prefer a sure £50 to a 50% chance of £100, EU says I must have diminishing marginal utility of money. REU says: 'No, you might value the money linearly, but you have a global attitude against risk.' It separates *taste for outcomes* from *taste for risk*."
  3.  **Why it matters:** This allows us to call an agent rational even if they violate the Independence Axiom, provided their risk function is consistent.

  ### 30–35 Minutes: The Final Question
  **Goal:** Test understanding, not memory.

  Do not ask them to write the formula. Ask them to predict a change.

  **The Question:**
  "Imagine a gamble with three outcomes: £0, £100, £200.
  Currently, the probabilities are 20% for £0, 20% for £100, 20% for £200 (and 40% for something else, or just normalize it).
  Let's simplify: 1/3 chance of each.
  I propose a new gamble. I keep the outcomes the same. I keep the probabilities the same. **But I swap the probabilities of the £0 and the £200.**
  So now: 1/3 chance of £200, 1/3 chance of £100, 1/3 chance of £0.
  **In Expected Utility, does the value change? In Risk-Weighted Expected Utility, does the value change? Why?**"

  **The Answer Key (For You):**
  *   **EU:** No change. (Outcomes and probabilities are identical, just listed in reverse order).
  *   **REU:** No change. (Wait, this is a trick).
      *   *Correction:* If you just swap the *labels* of the probabilities, the gamble is identical. The ranking of outcomes ($x_1 < x_2 < x_3$) is fixed by the money. The probability attached to £200 is still 1/3. The cumulative probability $P(\ge 200)$ is still 1/3.
      *   *You need a better question to test rank dependence.*
      *   *Revised Question:* "I have two gambles.
          *   Gamble A: 50% £0, 50% £100.
          *   Gamble B: 25% £0, 50% £50, 25% £100.
          *   Both have an Expected Value of £50.
          *   If I am risk-averse (concave $r$), which gamble has the higher REU?
          *   **Follow up:** Why does the 25% probability on the top outcome in Gamble B count for less than the 50% probability on the top outcome in Gamble A, even though the EV is the same?"
      *   *Desired Response:* They should identify that in Gamble B, the top improvement (£50→£100) is weighted by $r(0.25)$. In Gamble A, the improvement (£0→£100) is weighted by $r(0.5)$. Because $r$ is concave, $r(0.5) > 2 \times r(0.25)$ (usually). They need to articulate that the *position* of the probability in the cumulative stack changes its weight.

  **Better Final Question (Simpler):**
  "I have a gamble: 50% chance of £0, 50% chance of £100.
  I offer you a modification: I will move 10% probability from the £0 outcome to the £100 outcome. (Now 40% £0, 60% £100).
  In EU, the value increases by $0.1 \times u(100)$.
  In REU, does the value increase by $0.1 \times r(1) \times u(100)$? Or something else? What determines the weight on that extra 10%?"

  *   *Correct Answer:* The weight is determined by $r(P \ge 100)$. In the first case, it was $r(0.5)$. In the second, it is $r(0.6)$. The increase is $[r(0.6) - r(0.5)] \times u(100)$.
  *   *Why this works:* It forces them to see that the weight isn't on the probability slice itself (0.1), but on the *cumulative* function evaluated at that rank.

  ### What to Refuse to Cover
  1.  **The Representation Theorem:** Explicitly state: "Buchak proves that if your preferences satisfy certain axioms (including a weakened Independence), you can be represented as maximizing REU. We are not proving that today. We are exploring what it *means* if you do."
  2.  **Dynamic Choice/Commitment:** REU has complications with sequential choices (time inconsistency). Do not open this can. If asked, say: "That's the subject of a whole other seminar. Today is about static choice."
  3.  **Specific Functional Forms:** Don't get bogged down in whether $r(p) = p^2$ or $p^{0.5}$. Keep it geometric (concave/convex).

  ### Summary of the Flow
  1.  **Actuary:** "Same math as RDU, different philosophy (Normative vs Descriptive)."
  2.  **EU:** "Don't sum outcomes, sum incremental gaps weighted by cumulative probability."
  3.  **REU:** "Apply $r$ to the cumulative probability."
  4.  **Misconceptions:** Rank dependence (via cumulative sums), Shape (via graph), Normativity (via preference vs bias).
  5.  **Close:** "The weight on a probability slice depends on where it sits in the stack."

