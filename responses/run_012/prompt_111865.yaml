      *   Outcomes: $x_1 < x_2 < x_3$.
      *   Probabilities: $p_1, p_2, p_3$.
      *   Show that the weight on $(x_2 - x_1)$ is $r(p_2 + p_3)$.
      *   Show that the weight on $(x_3 - x_2)$ is $r(p_3)$.
