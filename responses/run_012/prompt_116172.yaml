answer: |-
  Contemporary philosophers specializing in metaethics and metaphysics classify this phenomenon as a **metalinguistic negotiation**, a substantive dispute over which concepts should govern practice rather than what the facts are.

  This term, developed by philosophers such as David Plunkett and Alexis Burgess, captures the specific mechanic where disputants agree on the underlying reality (the silt, the memos, the treaties) but disagree on which conceptual framework should be used to categorize that reality. The argument is not idle because concepts are not merely labels; they are tools that carry normative force and determine action. When the parties shift to arguing about which definition to adopt, they are no longer having a traditional verbal dispute that can be dissolved by clarification; they are engaging in a negotiation over which tool best serves their practical, moral, or political interests. This fits your description precisely because it explains why the quarrel persists despite factual agreement and why resolving the definition does not end the conflict—the choice of definition is itself the contested issue.

  The nearest classic concept is W.B. Gallie's **essentially contested concepts**, which describes terms like "justice" or "art" that admit of no final definition because their application is inherently evaluative. While this matches the irresolvability and practical stakes of your examples, it differs in scope: Gallie's concepts must be appraisive (judging something as good or bad), whereas your example of the river is metaphysical (judging identity rather than value). Metalinguistic negotiation covers both normative and metaphysical cases, provided the dispute is about which concept should guide practice.

  A second relative is C.L. Stevenson's **disagreement in attitude**, which distinguishes between disagreeing about facts (belief) and disagreeing about preferences or goals (attitude). This aligns with your observation that the argument changes what people do (resigning, refusing hands). However, Stevenson's model focuses on psychological states of approval or disapproval, whereas your examples involve logical and categorical boundaries (sincerity, identity). Metalinguistic negotiation subsumes this by treating the disagreement as one about conceptual authority rather than mere emotional alignment.

  It is crucial to distinguish this from a traditional **verbal dispute**, which philosophers often treat as trivial or resolvable through semantic clarification. In a standard verbal dispute, once the terms are defined, the disagreement vanishes. In your pattern, defining the terms does not resolve the conflict because the parties disagree on which definition *ought* to be standard. Calling this a mere verbal dispute would be a mistake because it implies the stakes are linguistic rather than practical; the error lies in assuming that because the battle is fought over words, the casualty is not real.

  The edges of this concept exclude three specific types of argument. First, it excludes **empirical disputes**, where parties disagree on the facts themselves (e.g., whether the river actually changed course). Second, it excludes **stipulative definitions**, where one party arbitrarily assigns a meaning for a specific context without claiming it governs broader practice. Third, it excludes **incommensurable frameworks**, where parties cannot understand each other's positions; in your pattern, each can restate the other's position as plausible. If the disputants agreed on the definition and the argument ended, it would not be a metalinguistic negotiation; if they disagreed on the facts, it would be an empirical dispute. The defining boundary is the agreement on reality coupled with a persistent, consequential disagreement on the conceptual lens used to view it.
