prompt: |-
  I'm applying for a six-month journalism fellowship (the kind where you sit at a university and produce one long piece) and I need a two-page proposal. My half-formed idea: the philosophy literature on weakness of will and the behavioral-econ literature on hyperbolic discounting are obviously about the same everyday thing — people who know what they want and then don't do it — and yet they never actually talk to each other. The philosophers treat it as a will that fails to execute a judgment; the discounting crowd treats it as a preference that flips as the moment gets closer. Are those two descriptions of one phenomenon or two different phenomena that just share a name? The angle I actually want to chase is narrower and, I think, weirder: if the discounting is genuinely hyperbolic, then the future self doesn't want the same thing less, she wants something else, and "weakness of will" may be the wrong category altogether — less a failure of will than a negotiation with a stranger who happens to share your body. So: under what conditions does a preference reversal count as the agent changing her mind (not akrasia at all) versus failing to act on a judgment she still holds (akrasia)? Turn that into the proposal — state the question so it has a determinate answer, say why the standard positions on both sides leave it open, lay out what I'd actually do month by month (reading the two literatures against each other, talking to people who design commitment devices, a few cases I'd want to write up), what a real result would look like, what would count as the project failing, and a scope that honestly fits six months. Don't bother with citations, I'll add those myself.
