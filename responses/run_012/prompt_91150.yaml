      *   *Sentence 9:* "If my pain doesn't cause my belief that I'm in pain, then that belief is a lucky guess..." -> **Nod.** This is the causal theory of knowledge objection.
      *   *Sentence 10:* "But the theory itself is supposed to be something we know about our experience." -> **Nod.**
      *   *Sentence 11:* "So epiphenomenalism saws off the branch it's sitting on, which is why nobody defends it seriously any more." -> **Wrong/Exaggerated.** The objection is strong, but the "nobody defends it" claim is false. Also, the self-refutation argument has counter-arguments.
