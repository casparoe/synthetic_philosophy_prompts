answer: |-
  **Title:** The Last Call at the Principle of Sufficient Reason
  **Characters:**
  **Vera** (Verificationist, defending a Restricted Knowability Principle)
  **Roy** (Realist, holding a copy of *The Logic of Provability*)

  **Setting:** A campus bar, 11:30 PM. The seminar just ended.

  **Roy:** So, are we still pretending all truths are knowable? Or did Fitch finally kill it?

  **Vera:** We restricted it. It's the Cartesian restriction. We only apply knowability to propositions that remain true when known.

  **Roy:** Meaning you kicked out the Fitch-conjunctions. The "$p$ and nobody knows $p$" crowd.

  **Vera:** They're unstable. If you know them, they become false. It's not a patch, it's a domain correction.

  **Roy:** Okay. So, is it true that you're excluding propositions to save the theory?

  **Vera:** Yes.

  **Roy:** Is *that* truth knowable?

  **Vera:** Obviously.

  **Roy:** So you know you're excluding propositions to save the theory. Now, conjoin that with "There will always be more propositions to exclude."

  **Vera:** I can't know that conjunction.

  **Roy:** Why not?

  **Vera:** Because if I knew there would always be more exceptions, I'd know the theory is infinitely leaky. But if I know it's infinitely leaky, the principle collapses. So that conjunction is non-Cartesian.

  **Roy:** So the truth about *why* your principle works is itself unknowable by your principle.

  **Vera:** It's a meta-truth. It lives outside the system.

  **Roy:** So your defense of the Knowability Principle relies on a truth you admit cannot be known.

  **Vera:** It's a *structural* truth. Look, do you want a drink or not?

  **Roy:** I'll have whatever you *don't* know I'm having.

  **Vera:** That's not on the menu.

  **Roy:** According to your restricted principle, it shouldn't exist. But if it doesn't exist, I can't order it. And if I can order it, it must be knowable. And if it's knowable, you must already know it.

  **Vera:** ...I'm getting you a beer.

  **Roy:** See? Omniscience. You knew I wanted a beer all along.

  **Vera:** I knew you *always* want a beer.

  **Roy:** But this specific beer, at this specific time, with the specific knowledge that I'm using it to refute you? That's a unique truth.

  **Vera:** It's a trivial truth.

  **Roy:** Fitch says there are no trivial unknown truths. Either it's known, or it's not a truth. So, did you know I was going to make this joke?

  **Vera:** ...No.

  **Roy:** Then it wasn't a truth until I said it.

  **Vera:** Verificationism 101, Roy. Truth is made, not found.

  **Roy:** Then you can't claim it was knowable *before* I made it.

  **Vera:** *[Pauses, signals bartender]* Two beers.

  **Roy:** Ah. So you know now.

  **Vera:** I know now. But five minutes ago, the proposition "Roy orders a beer to mock Fitch" was true but unknown.

  **Roy:** And was it knowable then?

  **Vera:** *[Sips drink]* That's restricted information.

  **Roy:** So the only way to save the principle is to pretend the counter-examples are state secrets.

  **Vera:** It's not a secret. It's a "Do Not Disturb" sign on the unknown.

  **Roy:** Well, here's to the unknown.

  **Vera:** We can't toast to that.

  **Roy:** Why?

  **Vera:** Because if we toast to it, we acknowledge it. And if we acknowledge it, it's known. And if it's known, it's not unknown.

  **Roy:** So we have to drink in silence?

  **Vera:** No. We drink to the *knowable* beer. The unknown one... well, that one's on you.

  **Roy:** *[Raises glass]* To the restriction.

  **Vera:** To the hole in the bucket.

  **Roy:** At least the hole is principled.

  **Vera:** Cheers.

  *[They drink. The bill remains unknown, and therefore, by Vera's logic, possibly not true.]*
