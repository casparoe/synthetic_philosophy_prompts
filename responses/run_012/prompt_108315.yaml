answer: |-
  You have correctly identified a gap between classical Speech Act Theory (Austin/Searle) and the messy reality of institutional and social talk. You are looking at the intersection of **Conversational Scorekeeping** (David Lewis), **Normative Enactment** (Mary Kate McGowan), and **Institutional Talk** (Conversation Analysis/Sociolinguistics).

  There is no single, canonical lexical item (like "phoneme" or "recursion") that covers exactly this temporal/bystander configuration. However, in contemporary philosophy of language and linguistic pragmatics, this is discussed under the header of **Constitutive Uptake** and **Normative Enactment**.

  If you need a name to file this under, the most precise existing term is **"Retroactive Normative Enactment"** (drawing on McGowan), but to capture the specific mechanism you're describing, I will coin the descriptive term **"Ex Post Illocutionary Fixation."**

  Here is the breakdown of the phenomenon, its boundaries, and the answers to your four specific questions.

  ### The Theoretical Home
  You are right to set aside Austin's felicity conditions (which are concurrent) and Grice's speaker meaning (which is internal). The framework you want is **David Lewis's "Scorekeeping in a Language Game" (1979)** extended by **Mary Kate McGowan's work on "Oppressive Speech" and "Enactment" (2009, 2014).**

  *   **Lewis:** Conversations have a "score" (presuppositions, obligations, permissions). This score changes automatically with every move, often without explicit announcement.
  *   **McGowan:** Speech doesn't just describe the world; it *enacts* norms. A norm is enacted if it is introduced into the conversation and *not successfully challenged*.
  *   **The Mechanism:** The "act" isn't fixed at $t_0$ (utterance). It is fixed at $t_1$ (when the score settles). If the audience (including bystanders) treats a hedge as a promise, and no repair is initiated, the score updates to "Promise exists." The *illocutionary force* is constituted by the *update to the score*, not the speaker's internal state.

  ### The Name: Ex Post Illocutionary Fixation
  Since you asked for a name if one doesn't exist: I propose **Ex Post Illocutionary Fixation**.
  *   **Ex Post:** The force is determined after the utterance.
  *   **Illocutionary:** It concerns the normative status of the act (promise, policy, insult), not just the meaning.
  *   **Fixation:** The force becomes "fixed" or "crystallized" by the audience's reaction (or lack thereof).

  **Boundaries:** This excludes simple misunderstanding (where the speaker corrects and the correction is accepted). It applies specifically when the correction *fails* to reverse the normative status because the "score" has already updated in the public record.

  ---

  ### Answers to Your Four Questions

  #### 1. Is this just ambiguity plus social pressure, or a genuinely different thing?
  **It is genuinely different.**
  If it were just ambiguity, clarifying the semantic content ("I said *probably*") would resolve it. In your examples, the semantic content is acknowledged, but the *normative force* is overridden.
  *   **What would make an utterance invulnerable?** An utterance is only invulnerable if the speaker holds **Sole Illocutionary Authority**. This rarely exists outside of specific ritualized contexts (e.g., a judge saying "I sentence you," where the institution guarantees the force). In ordinary talk, illocutionary force is **jointly constituted**. For an utterance to be immune to *Ex Post Fixation*, the social context would need to grant the speaker veto power over the "score" update. Since conversation is a joint activity, the audience always has a vote on the score.

  #### 2. Does it need a record (minutes, chat, written offer)?
  **No, but records act as "Crystallizers."**
  This happens in purely spoken contexts (e.g., the dinner joke). However, the *record* changes the epistemic accessibility of the score.
  *   **Spoken:** The "score" is held in common knowledge. It can be contested later ("Wait, I thought you were joking?"), but it requires active labor to rewind the score.
  *   **Recorded:** The minutes *freeze* the score. In your third example, the minutes didn't *make* it a policy; they codified the score update that happened when nobody challenged the musing in the room. The record makes the *Ex Post Fixation* harder to reverse because challenging it now requires challenging the *institutional memory*, not just a conversational move.
  *   **Verdict:** The phenomenon occurs without a record, but the record increases the **inertia** of the fixation.

  #### 3. Is the bystander version the same phenomenon?
  **Yes, it is the same mechanism, but it reveals the "Public Score" nature of the act.**
  In classical Austin, uptake is often imagined as dyadic (Speaker $\to$ Addressee). In **Conversation Analysis (CA)** and **Participation Frameworks (Goffman)**, the "audience" includes ratified participants and bystanders.
  *   **Why it feels different:** Because we intuitively think the Addressee has special rights to determine uptake.
  *   **Why it's the same:** The "conversational score" is public property. If a bystander treats your hedge as a commitment, and you don't correct *them*, the public score updates. In institutional settings (like your lab meeting), bystanders are often the ones responsible for maintaining the "institutional score" (e.g., the person taking minutes, or the PI who manages resources). Their uptake carries more weight in updating the score than the addressee's might.

  #### 4. Is there a reason promises are the worst case?
  **Yes. Promises are "High-Stakes Score Changes."**
  *   **Deontic Modality:** A promise changes the deontic landscape (what is obligatory/permitted). A statement of fact changes the informational landscape. It is easier to correct information ("Actually, it's raining") than to dissolve an obligation ("Actually, you're not required to do that").
  *   **The Authority Gap:** When you promise, you are attempting to create an obligation. But as **Rae Langton** and **Quill Kukla** argue, your *authority* to create that obligation depends on your social standing. If you are a junior PhD, your "hedge" might be treated as a "promise" because the system *needs* you to be committed (to manage risk). The system overrides your lack of authority to commit because it *wants* the commitment to exist.
  *   **Vulnerability:** Promises are the case where the speaker has the *least* authority because the act is defined by its *uptake* (the promisee's expectation). If the promisee (or the group) takes it as a promise, the obligation exists *for them*, regardless of your intent. You cannot unilaterally dissolve an obligation that exists in someone else's normative landscape.

  ### Summary for your Literature Search
  You are not making this up. You are describing the **social ontology of speech acts**.
  *   **Search Terms:** "Conversational Scorekeeping" (Lewis), "Normative Enactment" (McGowan), "Illocutionary Authority" (Kukla/Langton), "Uptake and Illocution" (Hornsby/Whiting).
  *   **The Gap:** Most literature focuses on *whether* uptake is required. You have identified *when* and *by whom* it is applied.
  *   **The Label:** If you use this in a paper, call it **"Retroactive Illocutionary Fixation"** and cite **McGowan (2009)** on enactment and **Lewis (1979)** on scorekeeping.

  You are looking at one phenomenon: **The public constitution of normative status via unchallenged uptake.** The three coats are just different institutional fabrics (lab norms, social norms, bureaucratic norms).
