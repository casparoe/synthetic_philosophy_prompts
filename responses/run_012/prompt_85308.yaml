      *   **Key Scene:** The "Disagreement Scene." The protagonist reports one feeling/state, the Shadow reports another. A third party (doctor, partner, assessor, etc.) must act on one of the two reports. This decision must be irreversible/consequential.
      *   **Ambiguity Requirement:** The text must support at least two interpretations:
          *   (a) Introspection is fallible (illusion), Shadow is corrective.
          *   (b) Introspection is narrative construction, Shadow is a better-data narrative.
          *   (c) Introspection constitutes the state (constitutive), Shadow is irrelevant/misguided.
      *   **Constraint 1:** Keep distinct: Access (what you feel), Speech (what you say), Authority (what counts). Do not blur these.
      *   **Constraint 2:** No banned tropes: Split brains, "we're bad at knowing why" study punchlines, lecture-y narration, tidy ending revealing who was right.
      *   **Constraint 3:** Shadow readings must be specific and interestingly off, not just generic "wrong."
      *   **POV:** One point-of-view character.
      *   **Length:** 800-1000 words.

  2.  **Deconstruct the Philosophy:**
      *   *Access:* What the protagonist feels internally.
      *   *Speech:* What they articulate to the third party.
      *   *Authority:* Which report the third party accepts as truth for the decision.
      *   *The Shadow:* Represents externalized functionalism/behaviorism vs. internal phenomenology.
      *   *The Ambiguity:* The reader shouldn't know if the protagonist is lying to themselves, lying to the room, or if the feeling only exists because they claim it.

  3.  **Brainstorming the Scenario:**
