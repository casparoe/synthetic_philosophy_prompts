answer: |-
  The bone-conduction collar sat cold against my throat, a silver choker that hummed only I could hear. Across the table, Mara tapped her stylus against the tablet. The Shadow's display faced her, a scrolling waterfall of biometric interpretations derived from thousands of strangers who had worn the device before me.

  "Final assessment," Mara said. She didn't look up. "If I sign this, you take Leo home tonight. Unsupervised."

  I looked at the glass wall behind her. Leo was in the playroom, stacking blocks. He looked small. My chest felt tight, a hollow vibration like a plucked string inside a hollow body. That was the access: the vibration. Not fear, not love, just resonance.

  "I'm stable," I said. That was the speech. It felt heavy coming out, like placing a stone on a scale.

  The Shadow whispered in my ear, a dry, statistical rustle. *Autonomic arousal suggests anticipatory grief. Pupillary dilation consistent with threat response.*

  On Mara's screen, the text scrolled in real-time: **SUBJECT REPORT: STABLE. SHADOW PREDICTION: THREAT/GRIEF.**

  Mara stopped tapping. She looked at me, then at the screen. The authority hung in the air between us, unassigned. If she believed my speech, I was a father returning to his son. If she believed the Shadow, I was a manic episode waiting to ignite, misidentifying my own panic as readiness.

  "The Shadow says you're in threat response," Mara said. Her voice was flat. She wasn't accusing me; she was reading data. "It says you feel endangered."

  "I feel ready," I said. I kept my hands flat on the table. My grip was loose. I knew this because I could feel the cool laminate against my palms. But the Shadow knew the micro-tremors in my flexor tendons that I couldn't feel. It knew the sweat conductivity spiking under the collar.

  "Your breath rate is twelve," Mara said. "Perfectly calm. But your skin conductance is off the chart."

  "I'm breathing like this because I'm calm," I said. "The sweat is because this matters."

  *Narrative construction,* the Shadow whispered. *Post-hoc rationalization of stress markers.*

  I ignored the whisper. I focused on Leo. He knocked the blocks over. He laughed. I felt a surge in my throat. Was it love? Or was it the relief of distance? The access was muddy. The vibration was still there.

  "If I sign," Mara said, "and you have an episode, he goes into foster care. Permanently. That's the protocol."

  "I won't have an episode."

  "The Shadow isn't asking if you will. It's saying you are currently experiencing the physiological signature of someone who is about to lose something."

  "I already lost him," I said. "That's why I'm here."

  *Correction,* the Shadow whispered. *Subject claims loss. Physiology claims imminent loss. Distinction critical.*

  Mara leaned back. She looked at the screen, then at my hands, then at my eyes. She had to choose which report carried authority. My speech was a claim about the world. The Shadow was a claim about my body. If introspection was just a sense organ, like sight, then maybe I was colorblind to my own rage. Maybe I was looking at my son and seeing safety while my body screamed danger.

  Or maybe the Shadow was just reading a corpse. It measured the echo of feelings, the biological exhaust. But if saying "I am stable" was the act that made me stable, then the biology was just lagging noise, the tail wagging the dog. By speaking the stability, was I creating it? Or was I just lying about a storm that was already breaking inside me?

  "Leo," Mara called out.

  The boy turned. He smiled at me. "Dad?"

  The vibration in my chest spiked. A sharp twinge.

  "Tell me what you feel," Mara said to me. She wasn't asking for a report for the file anymore. She was testing the wire.

  "I feel... " I started. I wanted to say *hope*. But the access was just the vibration. The speech had to be a translation. "I feel like I need to take him home."

  *Avoidance,* the Shadow whispered. *Deflection of internal state.*

  Mara's stylus hovered over the signature pad. If she signed, she validated my speech. If she closed the file, she validated the Shadow.

  "My grip is loose," I said. I held up my hand. It wasn't shaking. "I'm not holding on too tight."

  "The Shadow says your grip strength increased by forty percent when I mentioned foster care," Mara said. "It says you're holding on for dear life."

  "Isn't that what a father does?"

  "It depends on whether you're holding him," Mara said, "or drowning him."

  She looked at the screen. The Shadow updated: **CORTEX ACTIVITY SUGGESTS SUPPRESSION.**

  I looked at Leo. He was waiting. The vibration in my chest wasn't going away. It wasn't getting worse either. It just was.

  Mara put the stylus down. She didn't pick it up again. She closed the tablet.

  "We'll do another week," she said.

  "Based on what?" I asked.

  "Based on the discrepancy," she said. She stood up. "When the story and the body don't match, I can't risk the child."

  She walked to the door. I stayed seated. The Shadow whispered one last thing, soft as a breath. *Validation denied. State unchanged.*

  I looked at my hand. It was still open. I couldn't tell if it was relaxed, or if it was just waiting to close. Leo walked over to the glass and put his hand against mine. I felt the cold separation. I said nothing. The vibration continued, steady and unreadable, until the lights went out.
