  # The cases it must get right

  A robust theory must condemn paradigmatic repugnant exchanges while permitting mundane ones. It must explain the intuitive wrongness of selling kidneys or votes, yet allow labor markets. Crucially, it must handle edge cases that strain standard commodification objections. First, paying someone to surrender their place in a transplant queue: this trades priority based on wealth rather than medical need, yet resembles permissible queue-scalping for concerts. It tests egalitarian access versus property rights over one's own status. Second, an employer buying out an employee's right to discuss wages: this is a voluntary contract restricting speech, challenging purely consent-based defenses of markets. It probes whether market logic undermines collective epistemic goods. Third, a market in posthumous apologies: selling forgiveness or remorse after death commodifies moral repair, testing whether the wrongness lies in the object's sanctity or the transaction's timing. The theory must also address price gouging during disasters (efficiency versus exploitation) and paid surrogacy (bodily autonomy versus instrumentalization). It cannot simply rely on "disgust"; it must distinguish between cases where markets solve allocation problems and where they corrupt the good being allocated. If the theory bans kidney sales but permits blood donation, it must articulate why the monetary incentive changes the moral valence beyond mere supply effects. It must account for why we forbid selling babies but allow paying for adoption expenses. The cases must be resolved consistently, not ad hoc, ensuring the principle scales across biological, social, and political goods. Ultimately, the theory must predict which markets degrade social norms and which merely facilitate exchange.

  # The distinctions it must respect

  The theory cannot collapse distinct sources of moral objection. First, it must separate the *good being traded* from the *terms of the trade*. Banning kidney sales because of exploitation is different from banning them because kidneys are priceless; the former suggests regulated markets might work, the latter forbids them entirely. Second, it must distinguish wrongness sourced in *coercive background conditions* from wrongness sourced in *commodification itself*. If a sale is wrong only because the seller is desperate, poverty alleviation fixes it; if it's wrong because selling degrades humanity, no amount of wealth fixes it. Third, it must differentiate between what an exchange *does to the parties* (harm/benefit) and what it *expresses or teaches to third parties* (corrosive norms). A vote sale might not harm the buyer or seller, but it corrupts the democratic signal. Finally, it must distinguish between *market allocation* and *market pricing*. Some goods can be traded but not priced (gift economies); others can be priced but not marketed publicly. Collapsing these leads to policies that ban harmless exchanges while permitting harmful ones, or vice versa, failing to target the actual locus of the moral violation. Precision here prevents conflating regulatory failures with intrinsic moral boundaries.

  # The constraints from outside philosophy

  The theory cannot contradict established empirical findings. From economics, it must acknowledge that banning markets often creates black markets with worse safety and equity outcomes, such as organ trafficking. It must respect supply elasticity data without assuming prices always reflect value accurately. From psychology, it cannot treat disgust as mere noise; the psychology of disgust signals perceived contamination, which correlates with moral judgment. However, it cannot treat disgust as *decisive* evidence, given its susceptibility to manipulation and bias, such as historical prejudices. It must accommodate the finding that monetary incentives sometimes crowd out intrinsic motivation, the "blood donation" effect, but also recognize when incentives simply add motivation. The theory must be psychologically realistic about how agents perceive transactions, not just how idealized rational agents should perceive them. Ignoring how markets actually function in practice renders the theory inert for policy. It must align with behavioral economics regarding framing effects.

  # Where the list may be jointly unsatisfiable

  There is a strong tension between respecting individual autonomy and preventing normative corruption. If we prioritize consent, we must allow vote selling and surrogate wombs, provided parties agree. If we prioritize the sanctity of certain goods (votes, bodies), we must override consent, risking paternalism. Specifically, the requirement to handle "queue surrender" and "wage gag orders" consistently with standard cases may break the theory. Allowing queue surrender respects property rights over one's place but violates egalitarian access to care. Banning wage gag orders protects collective bargaining but restricts contractual freedom. A theory that bans kidney sales to protect the poor from coercion might logically require banning dangerous labor (like mining), which we permit. Conversely, a theory permitting kidney sales based on autonomy struggles to explain why we ban selling children. The subset of requirements involving "consent is sufficient" and "some goods are inalienable" are logically contradictory unless a non-arbitrary line is drawn. Most theories fail here, either becoming too permissive (libertarian) or too restrictive (egalitarian), unable to capture the nuanced intuitions across all cases without ad hoc exceptions. This tension suggests a complete theory may be impossible.

  # The requirement that does the most work

  The requirement that does the most work excluding popular contenders is the distinction between wrongness sourced in coercive background conditions and wrongness sourced in commodification itself. Libertarian theories fail because they attribute all wrongness to coercion, implying wealthy sellers should be allowed to sell kidneys. Egalitarian theories often fail because they attribute all wrongness to inequality, implying rich-world surrogacy is fine if pay is high. Only a theory that can isolate *intrinsic* commodification harm survives. This requirement forces the theory to explain why some exchanges are wrong even when voluntary and well-paid. It excludes pure efficiency models (which ignore meaning) and pure consent models (which ignore context). It demands an account of how money changes the *meaning* of the act, not just the incentives. This is the hardest hurdle because it requires metaphysical clarity about "meaning" that most secular frameworks struggle to provide.
