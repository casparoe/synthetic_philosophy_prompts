      *   **Section 1: The cases it must get right**
          *   *Goal:* List standard cases + specific strain cases. Explain why they matter.
          *   *Content:* Kidney sales (standard), price gouging (standard), vote selling (standard). Strain cases: paying to surrender transplant queue place (altruism vs. market), employer buying wage discussion rights (contractual freedom vs. collective harm), market in posthumous apologies (commodification of moral repair).
          *   *Drafting:* Needs to be around 250 words.
          *   *Key point:* The theory must explain why some are forbidden while similar exchanges are permitted.
          *   *Draft:* A robust theory must condemn paradigmatic repugnant exchanges while permitting mundane ones. It must explain the intuitive wrongness of selling kidneys or votes, yet allow labor markets. Crucially, it must handle edge cases that strain standard commodification objections. First, paying someone to surrender their place in a transplant queue: this trades priority based on wealth rather than medical need, yet resembles permissible queue-scalping. Second, an employer buying out an employee's right to discuss wages: this is a voluntary contract restricting speech, challenging purely consent-based defenses of markets. Third, a market in posthumous apologies: selling forgiveness or remorse after death commodifies moral repair, testing whether the wrongness lies in the object's sanctity or the transaction's timing. The theory must also address price gouging during disasters (efficiency vs. exploitation) and paid surrogacy (bodily autonomy vs. instrumentalization). It cannot simply rely on "disgust"; it must distinguish between cases where markets solve allocation problems and where they corrupt the good being allocated. If the theory bans kidney sales but permits blood donation, it must articulate why the monetary incentive changes the moral valence beyond mere supply effects. It must account for why we forbid selling babies but allow paying for adoption expenses. The cases must be resolved consistently, not ad hoc.

      *   **Section 2: The distinctions it must respect**
          *   *Goal:* List specific conceptual distinctions.
          *   *Content:* Good vs. terms, coercion vs. commodification, participant effects vs. expressive/teaching effects.
          *   *Drafting:* Needs to be around 200 words.
          *   *Draft:* The theory cannot collapse distinct sources of moral objection. First, it must separate the *good being traded* from the *terms of the trade*. Banning kidney sales because of exploitation is different from banning them because kidneys are priceless; the former suggests regulated markets might work, the latter forbids them entirely. Second, it must distinguish wrongness sourced in *coercive background conditions* from wrongness sourced in *commodification itself*. If a sale is wrong only because the seller is desperate, poverty alleviation fixes it; if it's wrong because selling degrades humanity, no amount of wealth fixes it. Third, it must differentiate between what an exchange *does to the parties* (harm/benefit) and what it *expresses or teaches to third parties* (corrosive norms). A vote sale might not harm the buyer or seller, but it corrupts the democratic signal. Finally, it must distinguish between *market allocation* and *market pricing*. Some goods can be traded but not priced (gift economies); others can be priced but not marketed publicly. Collapsing these leads to policies that ban harmless exchanges while permitting harmful ones, or vice versa, failing to target the actual locus of the moral violation.

