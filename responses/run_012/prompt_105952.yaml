prompt: |-
  I recently signed a pledge to give a significant fraction of my income to organizations that fight extreme poverty, and at a dinner last week two friends of mine, Daniel and Mira, argued about whether that kind of commitment is what morality actually requires. I did not take part, but I have been turning their exchange over in my mind, and I would like an impartial adjudication of it.

  Daniel began by saying that consequentialism is not merely demanding but abrasive. It is demanding, he said, because it requires one to keep sacrificing until the marginal cost to oneself equals the marginal benefit to others; it is abrasive because it treats one’s own projects, relationships, and talents as instruments for producing good, so that any of them may be overridden whenever something else would produce slightly more. He offered a case: suppose one could save a stranger’s life only by permanently abandoning the pursuit that gives one’s life meaning. A consequentialist, he said, must tell one to abandon it, and that shows the theory leaves no room for the distinction between the morally required and the morally supererogatory.

  Mira replied that this conflates a criterion of rightness with a decision procedure. Consequentialism can hold that the right act is the one that maximizes expected value while permitting agents to use heuristics, rules of thumb, and partial attachments to approximate that criterion. She added that the demandingness objection is often question-begging: it assumes that common-sense morality’s permission to favor oneself is a fixed constraint on any acceptable theory, whereas an impartialist will deny precisely that. She also said that if the objection proves anything, it proves too much, since any morality that takes impartiality seriously will sometimes demand that we sacrifice our projects.

  Daniel responded that the decision-procedure reply is evasive. If one never actually uses the consequentialist criterion to decide what to do, he said, one is not living as a consequentialist; one is following rules and giving them a consequentialist label. He also said that the “proves too much” reply misses a distinction between demandingness and abrasiveness: a theory may demand that one give up a kidney without demanding that one treat one’s own life as a mere resource. He claimed that any acceptable morality must be one an agent can own from the inside, and that a theory which tells one to regard one’s deepest commitments as fungible cannot be owned by anyone with a life to live.

  Mira answered that this is either an empirical claim about what people can psychologically sustain or a normative claim smuggled in as a constraint. If it is empirical, it may be true but irrelevant to what is right. If it is normative, it needs an argument, and the argument cannot be that the theory makes one feel bad. She also pointed out that Daniel’s case is underdescribed: if the pursuit really is less valuable than the life one could save, why should its meaning for the agent outweigh the stranger’s survival? She noted that consequentialists can accept agent-relative prerogatives as a concession to human psychology without treating them as fundamental.

  Daniel replied that the case is not underdescribed; it is designed to isolate the value of a life project from its consequences. He said Mira’s reply assumes that the only reason to care about one’s own projects is the good they produce, which is precisely what is in dispute. He also said that the arbitrariness of any cost threshold cuts against consequentialism, not for it: if there is no principled point at which sacrifice stops, then the theory cannot be action-guiding in the way a moral theory must be. Mira said the threshold is not arbitrary if it is set by the criterion itself: sacrifice until further sacrifice would produce less good. Daniel said that is not a threshold an agent can live by.

  Please adjudicate their exchange point by point rather than simply choosing a side. For each main move, say whether it is clearly mistaken, partly right, or clearly right, and explain why. Address at least: (1) whether the demandingness objection is question-begging; (2) whether the criterion/decision-procedure distinction saves consequentialism from Daniel’s reply; (3) whether the demandingness objection should be distinguished from an abrasiveness objection about treating one’s projects as fungible; (4) whether Daniel’s life-project case has force or is underdescribed; (5) whether the absence of a principled cost threshold is a problem for consequentialism or simply a consequence of the view; and (6) what, if anything, both parties are missing. End with a verdict about who is more right overall, and what a defensible consequentialist position would have to concede.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a philosophical debate between Daniel (critic of consequentialism) and Mira (defender of consequentialism) regarding demandingness and personal integrity/projects.
      *   **Format:** Point-by-point analysis of main moves (clearly mistaken, partly right, clearly right + explanation).
      *   **Specific Points to Address:**
          1.  Is the demandingness objection question-begging?
          2.  Does the criterion/decision-procedure distinction save consequentialism?
          3.  Should demandingness be distinguished from abrasiveness (fungibility of projects)?
          4.  Does Daniel's life-project case have force or is it underdescribed?
          5.  Is the absence of a principled cost threshold a problem or a consequence?
          6.  What are both parties missing?
      *   **Conclusion:** Verdict on who is more right overall + what a defensible consequentialist position must concede.
      *   **Tone:** Impartial, analytical, philosophical.

  2.  **Deconstruct the Debate:**

      *   **Daniel's Core Argument:** Consequentialism is too demanding (requires sacrifice until marginal utility equals marginal cost) and abrasive (treats personal projects as mere instruments). It collapses the supererogatory into the obligatory. It cannot be "owned from the inside" because it makes deep commitments fungible.
      *   **Mira's Core Argument:** Demandingness objections assume common-sense morality is correct (question-begging). Distinction between criterion of rightness and decision procedure allows for rules/heuristics. Agent-relative prerogatives can be accepted pragmatically. The "meaning" of a project doesn't outweigh a life if the project is less valuable objectively.

      *   **Exchange 1:** Daniel (Demanding/Abrasive) vs. Mira (Criterion/Procedure + Question-Begging).
      *   **Exchange 2:** Daniel (Evasive/Ownership) vs. Mira (Empirical vs. Normative + Value of Life).
      *   **Exchange 3:** Daniel (Isolating Value/Threshold Arbitrariness) vs. Mira (Threshold set by Criterion).

  3.  **Evaluate Specific Points (Drafting the Analysis):**

      *   *(1) Question-Begging:* Daniel argues common sense allows self-favoring. Mira says assuming this limits theory is begging the question against impartiality.
          *   *Assessment:* Mira is *partly right*. It is question-begging to assume common sense is the *final* arbiter. However, reflective equilibrium matters; if a theory contradicts too many firm convictions, that's a theoretical cost, not just begging the question. Daniel isn't just saying "I feel like it," he's arguing about the structure of agency.
      *   *(2) Criterion/Decision-Procedure:* Mira says we can use heuristics. Daniel says if you don't use the criterion, you aren't a consequentialist.
          *   *Assessment:* Mira is *partly right*. Indirect consequentialism is a coherent position. However, Daniel is *partly right* that if the criterion *always* overrides the procedure in hard cases, the abrasiveness remains. The distinction helps with psychological sustainability but doesn't fully solve the normative conflict in extreme cases.
      *   *(3) Demandingness vs. Abrasiveness:* Daniel distinguishes giving up a kidney (demanding) vs. treating life as a resource (abrasive).
          *   *Assessment:* Daniel is *clearly right*. This is a crucial philosophical distinction (often associated with Williams vs. Singer). Demandingness is about *how much*; abrasiveness/integrity is about *what kind of agent* you must be. Mira conflates them initially.
      *   *(4) Life-Project Case:* Daniel says meaning outweighs consequences. Mira says if life > project, why care? Daniel says value isn't just consequences.
          *   *Assessment:* Daniel is *partly right* ( Integrity objection). Mira is *partly right* (Impartial value). The case isn't underdescribed; it highlights the conflict between impartial value and personal identity. Mira misses the point that "meaning" is constitutive of the agent, not just an output.
      *   *(5) Cost Threshold:* Daniel says no stop point = not action-guiding. Mira says stop point is marginal utility.
          *   *Assessment:* Mira is *clearly right* on the theory (the threshold *is* marginal utility). Daniel is *partly right* on the psychology (hard to live by). The lack of a *fixed* threshold (like 10%) is a feature, not a bug, for strict consequentialism, but makes it hard to plan a life.
      *   *(6) What's Missing:* Both ignore structural injustice (maybe?), but more importantly, they ignore *satisficing* consequentialism or *hybrid* views. They also ignore the sociological context of the "pledge" (Effective Altruism context).

  4.  **Synthesize and Refine:**

      *   *Tone Check:* Ensure I'm not taking sides too early. Use the "Clearly Right/Partly Right/Mistaken" framework.
      *   *Philosophical Accuracy:* Ensure terms like "criterion of rightness," "decision procedure," "supererogatory," "agent-relative prerogatives," and "integrity objection" are used correctly.
      *   *Verdict:* Who wins? Usually, in this debate, the critic (Daniel/Williams) lands the heavier blow regarding integrity, while the defender (Mira/Singer) wins on impartial logic. A balanced verdict suggests Mira wins on meta-ethics, Daniel wins on moral psychology/normative plausibility. A defensible consequentialism must concede some ground (e.g., prerogatives).

  5.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Set the stage.
      *   *Point 1 (Question-Begging):* Mira is right that you can't assume common sense, but Daniel is right that reflective equilibrium matters. Verdict: Partly Right (Mira).
      *   *Point 2 (Criterion/Procedure):* This is the standard Smart/Rule-Consequentialist defense. It works for daily life, fails for the "abandon your life project" case. Verdict: Partly Right (Mira).
      *   *Point 3 (Demandingness vs. Abrasiveness):* This is Daniel's strongest point. Bernard Williams' integrity objection. Mira conflates them. Verdict: Clearly Right (Daniel).
      *   *Point 4 (Life Project):* Daniel isolates the value of integrity. Mira reduces it to impersonal value. Verdict: Partly Right (Daniel) - it's not underdescribed, it's a clash of values.
      *   *Point 5 (Threshold):* Mira is theoretically correct. Daniel is practically correct. Verdict: Partly Right (Both).
      *   *Point 6 (Missing):* Satisficing? Hybrid views? The nature of "meaning"?
      *   *Verdict:* Daniel is more right about the *phenomenology* of morality; Mira is more right about the *logic* of impartiality. Defensible consequentialism needs agent-centered prerogatives.

  6.  **Final Review against Constraints:**
      *   Did I address all 6 specific points? Yes.
      *   Did I evaluate moves as mistaken/partly right/clearly right? Yes.
      *   Is there a final verdict and concession? Yes.
      *   Is the tone impartial? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Daniel is right." I need to explain *why* Mira's counter has weight (impartiality is a strong intuition too). The "Question-begging" point is tricky. Technically, appealing to intuitions isn't begging the question if used for reflective equilibrium, but asserting them as *constraints* without argument is. I will nuance this.

      *(Refining the "Abrasive" point)*: This is the Williams objection. It's distinct from demandingness. I need to emphasize that Daniel is clearly right to distinguish them, as Mira tries to collapse them into "psychological sustainability."

      *(Refining the Verdict)*: Don't declare one "winner" in a knockout sense. Declare who has the stronger philosophical position regarding the *plausibility* of the theory as a guide for human life.

  7.  **Final Polish:** Check clarity and flow. Ensure the distinction between "criterion of rightness" and "decision procedure" is explained clearly in the adjudication. (Proceed to generate output).

      *Wait, one more check on the prompt:* "End with a verdict about who is more right overall, and what a defensible consequentialist position would have to concede." Okay, I need to be decisive there.

      *Let's structure the response:*
      1. Introduction.
      2. Point-by-Point Adjudication (1-6).
      3. What is Missing.
      4. Final Verdict & Concession.

      *Ready to write.*
answer: |-
  This is a classic philosophical exchange, echoing the debate between Peter Singer (representing the impartialist/consequentialist view) and Bernard Williams (representing the integrity/personal projects objection). Below is an impartial adjudication of the arguments presented by Daniel and Mira, evaluated point by point.

  ### 1. Whether the demandingness objection is question-begging
  **Mira's Move:** She claims Daniel assumes common-sense morality's permissions are fixed constraints, which begs the question against impartialism.
  **Adjudication:** **Partly Right (Mira).**
  Mira is correct that one cannot simply assert common-sense intuitions as trump cards against a normative theory without argument. If consequentialism is true, common sense might simply be wrong. To say "this theory is false because it conflicts with my intuition that I can keep my money" is indeed question-begging if the theory provides a reason to distrust that intuition (e.g., the arbitrariness of geographical distance).
  **However,** Daniel is not merely appealing to intuition; he is appealing to the conditions of moral agency. In reflective equilibrium, a theory that contradicts too many firm convictions incurs a theoretical cost. If a moral theory requires the abandonment of almost all personal life, the burden of proof lies on the theorist to explain why our deep-seated intuition about personal prerogatives is an illusion. Mira dismisses this too quickly as mere "feeling bad," whereas Daniel frames it as a structural feature of having a life.

  ### 2. Whether the criterion/decision-procedure distinction saves consequentialism
  **Mira's Move:** She argues consequentialism sets the *criterion* of rightness (maximize good) but allows non-consequentialist *decision procedures* (heuristics, relationships) to achieve it.
  **Daniel's Counter:** If one never uses the criterion to decide, one isn't living as a consequentialist; the label is hollow.
  **Adjudication:** **Partly Right (Mira).**
  Mira is **clearly right** that this distinction is logically coherent. Indirect consequentialism is a stable philosophical position. It allows agents to cultivate deep attachments because doing so generally produces better outcomes than constant calculation.
  **However,** Daniel is **partly right** that this does not fully solve the problem. The distinction saves the theory from psychological impossibility, but not from normative conflict. In "hard cases" (like the life-project case Daniel proposes), the decision procedure must yield to the criterion. If the criterion demands abandoning the project, the fact that one usually follows a heuristic offers no comfort. The abrasiveness returns at the limit. Therefore, the distinction mitigates the demandingness objection but fails to neutralize the integrity objection in extreme scenarios.

  ### 3. Whether demandingness should be distinguished from abrasiveness
  **Daniel's Move:** He distinguishes between *demandingness* (how much you must give) and *abrasiveness* (treating your life as a mere resource/fungible).
  **Mira's Move:** She treats the inability to "own" the theory as an empirical psychological constraint or a normative claim needing proof.
  **Adjudication:** **Clearly Right (Daniel).**
  This is Daniel's strongest philosophical move. The "demandingness objection" (associated with Singer) argues the theory asks too much. The "integrity/abrasiveness objection" (associated with Williams) argues the theory asks the wrong *kind* of thing. A theory can be demanding (e.g., "never lie") without being abrasive (it doesn't require you to view your honesty as merely instrumental). Daniel is correct that a theory can demand a kidney (sacrifice) without requiring you to view your body as a warehouse for spare parts (fungibility). Mira conflates the *cost* of the sacrifice with the *alienation* caused by the justification for the sacrifice. By failing to distinguish these, she misses the core of Daniel's worry about moral identity.

  ### 4. Whether Daniel's life-project case has force or is underdescribed
  **Daniel's Move:** He posits a case where saving a stranger requires abandoning the pursuit that gives one's life meaning.
  **Mira's Move:** She claims the case is underdescribed; if the life is more valuable than the project, the agent's "meaning" shouldn't outweigh the stranger's survival.
  **Adjudication:** **Partly Right (Daniel).**
  Mira is **mistaken** to claim the case is underdescribed. Daniel explicitly stipulates that the value of the project is being isolated from its consequences. The point of the case is to test whether *agent-relative value* (meaning *to me*) has moral weight against *agent-neutral value* (life saved).
  Daniel is **partly right** that the case has force. It highlights that human morality is not just about producing states of affairs but about living a life. However, Mira is **partly right** that from a strictly impartial viewpoint, the stranger's death is a greater loss. The force of Daniel's case depends on accepting that agents have a special permission to value their own constitutive projects more highly than impartial utility warrants. If one rejects agent-relative value entirely, Mira wins; if one accepts it as part of morality, Daniel wins. Given that most plausible moral theories accommodate some agent-relative weight, Daniel's intuition here is more robust.

  ### 5. Whether the absence of a principled cost threshold is a problem
  **Daniel's Move:** He argues that without a fixed threshold (e.g., "give 10%"), the theory isn't action-guiding.
  **Mira's Move:** The threshold is principled: sacrifice until marginal utility equals marginal cost.
  **Adjudication:** **Partly Right (Both).**
  Mira is **clearly right** that within consequentialism, the threshold is not arbitrary; it is mathematically defined by the maximization principle. To say there is no threshold is to misunderstand the theory.
  **However,** Daniel is **partly right** that this threshold is not "action-guiding" in a practical sense. Because an agent cannot know the future consequences with precision, they cannot know where the margin lies. A rule like "give 10%" is epistemically accessible; a rule like "maximize until it hurts more than it helps" requires omniscience. Therefore, while the threshold is not *arbitrary*, it is *opaque*. This makes the theory difficult to use as a practical guide for life planning, which supports Daniel's claim that it cannot be "owned from the inside."

  ### 6. What both parties are missing
  Both parties operate within a binary framework: either strict act-consequentialism or common-sense morality. They are missing:
  1.  **Satisficing Consequentialism:** The view that one must produce *enough* good, not the *most* good. This would allow Daniel to keep his project once a threshold of contribution is met, addressing the "no stop point" worry without abandoning the consequentialist framework.
  2.  **Hybrid Theories:** Many modern consequentialists accept "agent-centered prerogatives" (as Mira briefly mentions but dismisses as mere psychology). A defensible view might hold that agents are permitted to weight their own projects slightly higher than strangers', not just as a heuristic, but as a normative principle, because a world where everyone pursues some personal meaning is better than a world of burnt-out saints.
  3.  **Structural Context:** Both treat the sacrifice as an individual calculation. They miss that a *pledge* (like the one the user signed) creates a social norm that lowers the burden on the individual. If everyone gives a significant fraction, no single individual needs to abandon their life project to save a life. The "demandingness" is often a result of non-compliance by others, not the theory itself.

  ### Final Verdict

  **Who is more right overall?**
  **Daniel is more right.**
  While Mira is theoretically precise about the definition of consequentialism, Daniel successfully identifies why the theory fails as a complete moral system for human beings. He correctly distinguishes between how much a theory demands and how it alienates the agent from their own integrity. Mira's defense relies on reducing personal meaning to instrumental value or psychological coping mechanisms, which fails to capture why we value our projects in the first place. If a moral theory requires you to view your deepest commitments as fungible resources, it may be logically consistent, but it is phenomenologically inadequate for creatures who live lives, not just produce outcomes.

  **What a defensible consequentialist position would have to concede:**
  To remain plausible, a consequentialist position must concede that **agent-relative prerogatives are normative, not merely psychological.** It must admit that there is a moral permission to favor one's own ground projects even when doing so does not maximize the impersonal good, provided a baseline of obligation to others is met. It must also acknowledge that the "criterion of rightness" cannot be the sole guide for life; a defensible view must incorporate the value of moral integrity and the sustainability of the moral agent as part of the "good" being maximized. Without these concessions, consequentialism remains a theory of the good that is incompatible with a theory of the right for human agents.
