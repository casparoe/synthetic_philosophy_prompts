answer: |-
  **GLOBAL ANTI-BRIBERY & CORRUPTION POLICY (FAQ 4.2)**
  **Region:** APAC / LATAM / EMEA (High-Risk Designation)
  **Owner:** Legal & Compliance Division, HQ

  **1. Applicability**
  This Supplement applies to all Associates, Contractors, and Third-Party Intermediaries operating in designated High-Risk Markets. It supplements the Global Code of Conduct. Where local custom conflicts with this Policy, the Policy prevails.

  **2. Frequently Asked Questions**

  **Q1: How do we distinguish between relationship-building and improper influence?**
  **A:** Relationships are essential to business, but gifts or hospitality that create a sense of future obligation are prohibited. This includes gifts given outside standard business cycles (e.g., weddings, holidays, birthdays) regardless of value. The compliance framework assumes that any transfer of value creates a debt. If the gift acknowledges a pre-existing social tie rather than a specific business transaction, it is presumed to be an attempt to monetize that tie. Associates must record all social interactions with Government Officials in the Gift Register.

  **Q2: Who counts as a "Government Official"?**
  **A:** The definition extends beyond civil servants. It includes employees of state-owned enterprises, political party officials, and candidates for public office. In many jurisdictions, the line between public authority and private commercial interest is blurred. For compliance purposes, the line is drawn by HQ. If an individual holds a position that *could* involve discretionary state power, they are an Official. Family members of Officials are also covered if the Associate knows the relationship exists. The Policy does not recognize local distinctions between private capacity and public role.

  **Q3: Are facilitation payments permitted to expedite routine actions?**
  **A:** While certain anti-bribery statutes carve out exceptions for small payments to secure non-discretionary routine actions (e.g., processing visas, clearing customs), the Company prohibits them globally. Paying to "grease the wheels" reinforces the system that creates the delay. However, Associates must note that refusing such payments may result in operational delays. This risk is accepted. The ability to absorb such delays is a marker of our commitment to global standards over local efficiency.

  **Q4: What if a local agent demands payment under threat of physical harm or asset seizure?**
  **A:** This constitutes extortion, not bribery. If an Associate faces an immediate threat to health, safety, or liberty, the priority is human safety. The payment may be made to resolve the immediate threat. However, it must be recorded as "Payment Under Duress" within 24 hours and reported to Legal. The Policy distinguishes between buying advantage (prohibited) and buying safety (tolerated). Documentation is required to prove the lack of intent to corrupt.

  **Q5: Who determines the definition of "Corruption" in this region?**
  **A:** The definition is standardized globally to ensure consistent reporting and risk management. Local norms regarding patronage or community support do not override the Global Code. Associates are reminded that adherence to this Policy is a condition of employment and a key performance indicator.

  **3. Risk Classification Table**

  | Activity | Status | Requirement |
  | :--- | :--- | :--- |
  | Business Lunch ( <$100 per head) | **GREEN** | Receipt required. |
  | Wedding Gift to Official's Relative | **RED** | Prohibited regardless of value. |
  | Customs "Processing Fee" (Cash) | **RED** | Prohibited even if local law permits. |
  | Donation to Community Project | **AMBER** | Pre-approval required. Verify no Official involvement. |
  | Payment to Release Detained Goods | **AMBER** | Report immediately as Duress. |

  **4. Glossary of Terms**

  *   **Social Capital:** Unrecorded influence derived from personal relationships. Treated as a compliance risk.
  *   **Routine Action:** A government action to which an entity is legally entitled without discretion.
  *   **Nominal Value:** A value so low it cannot be construed as influence. Currently defined as $0 in High-Risk Markets.
  *   **Third-Party Intermediary:** Any local agent, consultant, or broker acting on behalf of the Company.
  *   **High-Risk Market:** Any jurisdiction where local practice diverges from HQ standards.

  **5. Acknowledgement**
  By continuing employment in this Region, the Associate acknowledges they have read and understood this FAQ.
