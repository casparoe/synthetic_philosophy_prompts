answer: |-
  **The Case**

  A forty-year-old male with congenital cataracts undergoes successful bilateral surgery; on the afternoon of bandage removal, he is seated before a table holding a wooden sphere and a wooden cube. In Trial One, he manipulates both objects behind an occluding screen, building a haptic model of their geometry, after which the screen is lifted and he is asked to point to the cube; he succeeds immediately, identifying the visual object that corresponds to his haptic model. In Trial Two, conducted minutes later with the objects repositioned, the screen is lifted first: he views the objects for ten seconds, the screen is lowered, and he is asked to find the cube by touch alone; he fails, exploring the vertices of the sphere and cube indiscriminately without recognition. The asymmetry arises because in Trial Two the cube is oriented vertex-forward, presenting a hexagonal silhouette, whereas his haptic exploration in Trial One relied on orthogonal edges; while his haptic system supplies a volumetric invariant that can recognize a variable visual projection, his visual system supplies only a perspectival variant that cannot uniquely specify the volumetric invariant required to guide the hand.

  **The Verdict**

  The direction is **Touch-to-Sight works; Sight-to-Touch fails**. The philosophical side in trouble is the **Nativist** (specifically the "Common Format" theorist).

  **The Analysis**

  The Nativist about shape perception argues that spatial concepts (like "cube" or "sphere") are innate structures of the mind into which sensory data is poured. On this view, Touch and Sight are merely two different input channels feeding the same central spatial processor. If the processor is common and innate, translation between channels should be symmetric: if Touch can address the "Cube" file to identify a Sight input, Sight should be able to address the "Cube" file to identify a Touch input. The observed asymmetry devastates this claim. It demonstrates that Touch and Sight do not feed a common spatial format; rather, Touch delivers a **3D structural description** (invariant to angle), while Sight delivers a **2D perspectival image** (variant to angle). The Nativist cannot explain why the innate "Cube" concept is accessible via the haptic channel but inaccessible via the visual channel in the same subject at the same time. If the concept were truly innate and amodal, the direction of access would not matter.

  The Empiricist, conversely, absorbs this easily. For the Empiricist, spatial knowledge is constructed from sensorimotor contingencies, primarily grounded in touch and movement. Touch provides the *definition* of the shape (the resistance, the edges), while Sight provides the *sign* of the shape (the color, the outline). It is logically consistent that one can recognize a Sign given the Definition (Touch-to-Sight), but cannot reconstruct the Definition given only the Sign (Sight-to-Touch) without a learned code of projective geometry. The Empiricist predicts the asymmetry because they deny the senses start on equal footing; Touch is the teacher, Sight is the student. A student can recognize the teacher's voice, but the teacher cannot recognize the student's handwriting before the lesson is learned.

  **The Single Feature**

  The feature doing the work is **Perspectival Variance**. The visual input changes shape depending on the angle (a cube looks like a square, a hexagon, or a trapezoid), whereas the haptic input remains geometrically constant (a cube feels like a cube regardless of grip). If you change the scenario to eliminate perspectival variance—for example, by presenting the visual objects as orthographic projections (blueprints) or by ensuring the cube is always presented face-on in both trials—the lopsided result collapses. In that controlled case, Sight-to-Touch would likely succeed, restoring symmetry and vindicating the Nativist. The asymmetry exists only because vision presents an *inverse problem* (inferring 3D from 2D) that touch does not.

  **The Comeback**

  *"You have not tested Molyneux's Question; you have tested a geometry exam. By orienting the cube vertex-forward in the visual trial, you introduced a variable—projective transformation—that was absent in the haptic trial. Of course the patient failed Sight-to-Touch; he wasn't lacking spatial concepts, he was lacking optical theory. You rigged the dice by demanding he solve the inverse problem of vision without calibration data. If you had presented the cube face-on, matching the canonical haptic 'face' to the visual 'face,' he would have passed. Your case doesn't prove the senses use different formats; it proves that some views are harder to match than others. Fix the viewing angle, and your asymmetry vanishes, taking your anti-Nativist conclusion with it."*
