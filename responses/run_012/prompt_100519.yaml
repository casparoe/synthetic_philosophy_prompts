answer: |-
  Friends, family, colleagues.

  For forty years, I worked beside this man. We were young when we met, graduate students with more confidence than sense, and we grew old together in the company of ideas. I am a biologist by trade. I have spent a lifetime studying how living things persist, how they bind together, and how they endure. I mention this not to put on a lab coat today, but because it shapes how I see him, and how I see what we are doing here.

  In my line of work, we try to understand how things work. We look for the patterns that hold a life together. And when I look at the life of my friend, I see a pattern that was clear to all of us, though perhaps for different reasons.

  To those of us in the sciences, he was a rigorous mind. He demanded evidence. He was skeptical of easy answers. But to those of you in the congregation, he was a brother in faith. He was a man who prayed, who served, and who believed in promises that extended beyond the visible world.

  Sometimes, people assume these two things cannot sit in the same room. They think you must choose between the scientist who looks for causes and the believer who looks for meaning. But I knew him for four decades, and I never saw a conflict in him. I saw a single, unbroken integrity.

  I have come to believe that what his faith gave him, and what it gave to all of us who knew him, can be described in a single word: Trust.

  We live in a world where it is easy to say you care. It is easy to claim you belong to a community. But his faith was not a label; it was a practice. It required him to show up, week after week, year after year. It required him to put the needs of the congregation before his own comfort. It cost him time, energy, and humility.

  Because that commitment was costly, it was credible. When he told you he would be there, he was there. When he told you he would help, he helped. You knew this not because he said so, but because his life was a structure built to prove it. That is the engine of trust. It is built by actions that are hard to fake.

  Now, I know that for some, explaining how trust is built might sound like explaining it away. As if knowing the architecture of a bridge tells you nothing about the safety of crossing it. But that is not how I see it. Understanding how a river flows does not make the water less wet. Understanding how a bird flies does not make the flight less beautiful.

  Knowing that his goodness was rooted in a human practice does not make that goodness any less real. In fact, it makes it more remarkable. It means that the love he showed you, the support he gave this community, the comfort he offered his family—it was not magic. It was work. It was the deliberate, sustained effort of a man who chose to be a vessel of reliability in an uncertain world.

  I cannot stand here and claim to share his specific hopes for what comes next. I deal in the world that is here. But I can tell you this: the trust he built is still here. The connections he forged are still holding weight. The love he planted in his family and in this church has taken root in the real world, and it does not vanish because he has died.

  To his family: He loved you with a consistency that few men ever achieve. That love is a fact. It is part of the history of this room.

  To his colleagues: He was a man of truth. He did not ask us to believe things that were not so. He asked us to respect the depth of a commitment that sustained him.

  To his congregation: You knew him as a man of God. I knew him as a man of nature. But I think we are talking about the same light. You saw the source; I saw the beam. But the illumination was the same.

  He is not here anymore. We cannot pretend otherwise. But the structure he built—the web of trust, of care, of obligation and love—remains standing. And as long as we honor that, by keeping our own promises and showing up for one another, he is not gone.

  I will step back now, and the Minister will speak to the hopes that lie beyond my reach. But I wanted to speak first to the ground we stand on, and to the man who helped make it solid.

  Thank you.
