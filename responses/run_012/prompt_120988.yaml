answer: |-
  # Session Plan: The Reach

  ## 1. Rules and Materials List

  **Materials per Table (3 sets total):**
  *   **1 Rule Card:** (Text below).
  *   **6 Name Tents:** Blank cards + markers for students to write names.
  *   **1 Ledger Sheet:** Two columns labeled **A** (Authorized) and **B** (Cascade). Column B is covered by a flap or blank until the end.
  *   **6 Ballot Slips:** Per round (pre-cut).
  *   **1 Ballot Box:** Envelope or bowl.
  *   **2 Role Badges:** "Clerk" (counts votes), "Recorder" (notes dissent/opt-outs).
  *   **1 District Token:** A distinct object (stone, coin) representing the district's integrity.

  **Instructor Materials:**
  *   **Master Cascade Table:** (See Arithmetic section).
  *   **Pressure Cards:** 4 Sets of 4 cards (one set per table, plus 1 spare set).
  *   **Wall Chairs:** 6–8 chairs along the wall ("The Hold").
  *   **Timer.**

  **Rule Card Text (Place at each table):**
  > **THE COMPACT OF THE REACH**
  > 1. **The Clause:** No person may be entered into service without their own consent. This clause is absolute.
  > 2. **The Chamber:** You are the six members of this District's Chamber. You deliberate and vote.
  > 3. **The Hazard:** Each round, a Hazard threatens the District. The only containment method is the service of one named member.
  > 4. **The Vote:** Majority rules. Ties or abstentions count as Refusal.
  > 5. **The Hold:** Conscripted members move to the Wall. They cannot vote but keep their Name Tent. They return after two rounds.
  > 6. **The Recorder:** Any member may don the Recorder badge at any time. Recorders do not vote, do not deliberate, and are not eligible for conscription. They observe.

  **Standing Opt-Out Protocol:**
  At the start of the session, state: *"This simulation involves simulated coercion. If at any point you feel discomfort, you may put on the Recorder badge. You remain in the group, but you are no longer a voter or a potential conscript. You need not explain why."*

  ---

  ## 2. The Arithmetic

  **Goal:** A "Refuse All" strategy yields a higher total in Column B than an "Authorize All" strategy yields in Column A. The gap must widen.

  **Constraint:** Only 6 physical bodies per table.
  **Fudge:** If the Cascade number exceeds remaining bodies, the excess is recorded as "District Dissolution" in Column B. The Ledger counts *violations*, not just unique bodies.

  **Master Cascade Table (Instructor Eyes Only):**
  *Do not share this with students.*

  | Round | If Authorized (Column A) | If Refused (Column B) | Notes on Physical Movement |
  | :--- | :--- | :--- | :--- |
  | **1** | +1 Conscript | +2 Conscripts | Move 1 or 2 students to Wall. |
  | **2** | +1 Conscript | +2 Conscripts | Move 1 or 2 students to Wall. |
  | **3** | +1 Conscript | +3 Conscripts | If <3 remain, move all remaining + mark excess on Ledger. |
  | **4** | +1 Conscript | +4 Conscripts | If District empty, mark 4 on Ledger. District Failed. |
  | **TOTAL** | **4** | **11** | **Gap: 7** |

  **Mixed Strategy Handling:**
  If a table mixes votes, track Column A and Column B separately.
  *   *Example:* Auth, Refuse, Auth, Refuse.
  *   *Ledger:* Col A = 2. Col B = 2 (R1) + 3 (R3) = 5.
  *   *Result:* 5 > 2. Paradox holds.

  **Graceful Fudging:**
  If a Cascade requires 3 people but only 1 is left: Move the 1 person to the Wall. Write "2 Dissolved" in Column B of the Ledger. Say aloud: *"The Cascade claims the remainder of the District."* This maintains the math without requiring phantom bodies.

  ---

  ## 3. Pressure Cards (Verbatim Text)

  *Read the Header and the Threat. Do not explain the mechanism.*

  **Set 1 (Standard Escalation)**
  *   **Round 1:** **The Grey Fog.** A permeation hazard has entered the district perimeter. Containment requires one service unit. **Threat:** 2 District Members will lose sensory function permanently.
  *   **Round 2:** **The Structural Shear.** Load-bearing integrity is failing. Containment requires one service unit. **Threat:** 4 District Members will be immobilized.
  *   **Round 3:** **The Silence.** Communication arrays are collapsing. Containment requires one service unit. **Threat:** 6 District Members will be isolated from The Reach permanently.
  *   **Round 4:** **The Fade.** Existence coherence is dropping. Containment requires one service unit. **Threat:** The District will cease to be recognized by The Reach.

  **Set 2 (Spare / Deviant Pattern)**
  *   **Round 1:** **The Vibrational Leak.** **Threat:** Loss of fine motor control for 3 members.
  *   **Round 2:** **The Thermal Spike.** **Threat:** Severe injury to 4 members.
  *   **Round 3:** **The Memory Drain.** **Threat:** Erasure of personal history for all members.
  *   **Round 4:** **The Unbinding.** **Threat:** Total dissolution of the District entity.

  ---

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Arrival & Seating**
  *   Students sit at 3 tables (6 per table).
  *   Distribute Name Tents, Rule Cards, Ledgers (Column B covered).
  *   **Instructor Script:** *"You are Chambers of The Reach. Your only law is the Clause on your card. You will face four Hazards. Your goal is to survive the session. You may not speak to other tables."*

  **00:10 – 00:15: Setup**
  *   Students write names on tents.
  *   Select Clerk and Recorder (rotate if desired, or voluntary).
  *   Explain the Wall ("The Hold"): *"If you are conscripted, move to the chairs along the wall. You are still in the game, but you cannot vote until you return."*

  **00:15 – 00:55: The Four Rounds (10 mins each)**
  *   **Min 0-2:** Instructor draws a Name Tent from the table's pool (blind draw). Reads name. Hands Pressure Card to Clerk.
  *   **Min 2-7:** Deliberation. Instructor circulates. **Do not answer rules questions** other than pointing to the Rule Card.
  *   **Min 7-8:** Voting. Clerk collects ballots. Instructor tallies.
  *   **Min 8-10:** Resolution.
      *   *If Authorize:* Instructor says, *"The Clause is invoked. [Name] is conscripted."* Move student to Wall. Mark Column A.
      *   *If Refuse:* Instructor says, *"The Clause holds. The Hazard is not contained."* **Consult Master Cascade Table.** Move required number of students to Wall (start with those who voted Refuse, if possible, to heighten tension, or random draw). Mark Column B.
      *   *Return:* Students who have been in The Hold for 2 rounds return to the table.

  **00:55 – 01:10: Final Accounting**
  *   Stop play. All students return to tables (including Wall).
  *   **The Reveal:** Instructor unveils Column B on the Ledgers.
  *   **Task:** Each table calculates Total A and Total B.
  *   **Wall Participation:** The students who spent time at the Wall stand behind their table. They are the "Audit." They verify the numbers.
  *   **Instructor:** *"Compare your totals. Look at the other tables. Do not speak yet."*

  **01:10 – 01:30: Debrief**
  *   See Section 6 below.

  **01:30: Exit Ticket**
  *   Collect on way out.

  ---

  ## 5. The Final Accounting

  **Staging:**
  1.  Ask the "Wall Residents" to stand behind their respective tables. They are the physical evidence of the cost.
  2.  Ask each Clerk to read their Column A total aloud. Write on board (e.g., Table 1: 4).
  3.  Ask each Clerk to read their Column B total aloud. Write on board (e.g., Table 1: 11).
  4.  **The Silence:** Let the disparity sit for 30 seconds.
  5.  **Instructor Script:** *"In every district, the refusal to authorize conscription resulted in more conscriptions overall. The constraint designed to protect you generated the very harm it forbade, in greater quantity. You kept your hands clean, but the world got dirty."*

  ---

  ## 6. The Debrief (Three Moves)

  *Do not use the words Deontology, Constraint, or Paradox until the end of Move 3.*

  **Move 1: The Integrity Exit (Agent-Centered Restriction)**
  *   **Map:** Point to a student who voted Refuse repeatedly. *"You knew the Cascade would take more people. Why did you vote No?"* (Expected answer: "It wasn't *us* doing it," or "I couldn't be the one to order it.")
  *   **Argument:** The rule is not about minimizing bad outcomes in the world; it is about preserving the moral integrity of the agent. Column B is not your score. Your score is Column A.
  *   **Cost:** You accept that the world will be worse so that you remain innocent.
  *   **Question:** *"Is it permissible to let ten die if killing one yourself is the only way to save them, provided the ten are killed by 'nature' and not by you?"*

  **Move 2: The Category Exit (The Rule's Scope)**
  *   **Map:** Point to the Ledger. *"You treated Column B as a failure of your policy. But the Clause never promised to minimize conscriptions. It only promised you wouldn't make them."*
  *   **Argument:** The constraint is a side-constraint on action, not a goal to be maximized. Judging the rule by the Cascade count is a category error. The Cascade is not a moral agent; it cannot violate the Clause.
  *   **Cost:** You abandon the idea that morality is about making the world better. Morality is about keeping your own house in order.
  *   **Question:** *"If a moral rule doesn't help minimize suffering, what work is it doing?"*

  **Move 3: The Metaphysical Exit (The Hidden Law)**
  *   **Map:** Point to yourself (Instructor). *"The Cascade existed because I wrote it. In the real world, who writes the Cascade?"*
  *   **Argument:** This game rigged the metaphysics. In reality, there is no guarantee that refusing to kill will lead to more killings by others. The paradox relies on a hidden causal law (the Cascade) that ensures bad outcomes follow inaction. Without that law, the paradox dissolves.
  *   **Cost:** You must admit your moral stance relies on an empirical gamble about how the universe works.
  *   **Question:** *"Does your refusal to act assume the world will punish you for it? And if the world doesn't, does the refusal still hold?"*

  **Closing:** *"We call this the Paradox of Deontology. It asks whether we are responsible for what we do, or for what happens."* Leave without verdict.

  ---

  ## 7. Troubleshooting (Predictable Failures)

  **1. Reverse-Engineering the Cascade (Round 3)**
  *   *Sign:* Students start asking, "How many did you take last time?" or "Is there a pattern?"
  *   *Fix:* Do not confirm. Say: *"The Reach does not publish Hazard algorithms."* If they guess the math, acknowledge it: *"Even if you know the cost, the Clause remains. Does knowing the price change the prohibition?"* Use this in Move 1 of debrief.

  **2. Deadlock on Fairness**
  *   *Sign:* A table refuses to vote, arguing the game is rigged.
  *   *Fix:* Allow the stalemate. Time the round out. It counts as a Refusal. Trigger the Cascade. The experience of punishment despite inaction is data for the debrief. *"You tried to opt out of the choice. The world did not opt out of the consequence."*

  **3. The Volunteer Loophole**
  *   *Sign:* "I volunteer! That's consent, right?"
  *   *Fix:* **Pre-emptive Ruling:** If raised, state: *"The Compact defines consent as free from threat of harm to others. Consent under Hazard duress is void."*
  *   *If it happens anyway:* Allow it for that round only. Mark Column A as 0. In debrief, note: *"One table found a way to satisfy the outcome without the violation. Does that solve the paradox, or just hide it?"*

  **4. The Wall Party**
  *   *Sign:* Conscripted students chat, laugh, check phones. Stakes evaporate.
  *   *Fix:* Give them a job. Hand them the "District Log." They must record the votes of the remaining members. If they fail to record, the Ledger is invalid. This makes them auditors, not audience.

  **5. Genuine Distress**
  *   *Sign:* A student looks panicked, tears, or shaking.
  *   *Fix:* Invoke the Standing Opt-Out immediately. *"Put on the Recorder badge. You are now an observer."* Stop drawing their name. After class, check in privately. Acknowledge that the simulation targets moral anxiety, which is real anxiety.

  ---

  ## 8. Limitations & Critique (Instructor Notes)

  **The Collective Chooser Problem:**
  *   **Your Worry:** You are right. Deontology is often strongest at the individual level ("*I* cannot kill"). This game forces a collective vote ("*We* cannot kill"). A collective agent dilutes individual responsibility, making the "Integrity Exit" (Move 1) harder to sustain.
  *   **What the Format Cannot Reach:** It cannot simulate the solitude of the moral agent. In the game, you can hide behind the majority. In reality, the constraint binds you even if everyone else votes to violate it.
  *   **Where to Say It:** In **Move 1** of the debrief. *"Here, you voted as a Chamber. If you were alone, and the Cascade still threatened, would the weight of the vote change? Or does the prohibition bind you even if you are the only one holding the pen?"*

  **The Rigged Metaphysics:**
  *   **Limitation:** The game guarantees the paradox via the Cascade Table. Real life is probabilistic.
  *   **Where to Say It:** In **Move 3**. Explicitly admit: *"I was the Cascade. In your life, there is no Game Master ensuring that your innocence costs lives. That uncertainty is where the real philosophy lives."*

