answer: |-
  **Project Title:** The Frictionless and the Impossible: A Taxonomy of False Assumptions in Economic Modeling

  **The Question**
  In 1953, Milton Friedman argued that the realism of a theory's assumptions does not matter; only its predictive success counts. This doctrine (often called the F-twist) permits economists to assume agents have perfect foresight or live forever, provided the model predicts well. I propose that this doctrine conflates two distinct kinds of falsehood.

  Some false assumptions are **turnable**. A frictionless plane does not exist, but friction is a variable dial. You can turn it to 0.1, 0.01, or 0. The assumption is the limit of a true statement. Other assumptions are **unturnable**. An agent with perfect foresight does not have "slightly less" foresight in a way that preserves the model's logic. An immortal agent does not have a "very long" life that functions the same way. These are not limits; they are structural impossibilities.

  My research question is determinate: **Does the epistemic license granted to turnable assumptions (idealizations) extend to unturnable ones (premises), and if not, what justifies the latter?**

  **Why Standard Defenses Fail**
  Three standard defenses protect unrealistic models, but none survive the turnable/unturnable distinction.

  1.  **Predictionism:** "If it predicts, it's valid." This works for turnable assumptions because the error shrinks as you turn the dial. For unturnable assumptions, the mechanism is broken even if the output matches. A clock that tells the right time because it is stopped twice a day is not a valid timekeeper.
  2.  **Instrumentalism:** "Assumptions are just tools, not claims." This dissolves the problem by refusing to look at it. It ignores that some tools are maps (approximations) and others are rulebooks (constitutive premises). Treating a premise as a map leads to category errors when policy is derived from the model.
  3.  **Models-as-Fiction:** "Models are like stories; they don't assert truth." This is the closest to my position, but it is usually used to shield models from critique. I intend to use it to explain how they work. If an assumption is unturnable, it functions like a fictional premise (e.g., "London floats"). It earns its keep not by approximating reality, but by coherence and the insights it generates within the game it sets up.

  **Methodology: The Dial Test**
  I will not survey the literature. I will perform three forensic case studies on foundational models that rely on suspected unturnable assumptions.
  1.  **Perfect Foresight (Rational Expectations):** I will attempt to turn the dial. What happens to the model if agents are 99% correct rather than 100%? In many cases, the model collapses or requires a completely different mathematical structure. This suggests the assumption is not an approximation but a constitutive rule.
  2.  **Infinite Horizon (Representative Agent):** I will test the "immortal agent." If we substitute a very long life, does the savings behavior converge? If the limit is discontinuous, the assumption is unturnable.
  3.  **Zero Transaction Costs (Coase Theorem):** I will test the dial on friction. Unlike physical friction, economic transaction costs often vanish only by assuming away the reason for trade itself.

  For each case, I will apply the **Dial Test**: Can the assumption be made slightly more realistic without breaking the model's logic? If yes, it is turnable. If no, it is unturnable. I will then analyze what work the unturnable assumptions are actually doing if not approximation.

  **Feasibility and Shape**
  The output will be a single manuscript (approx. 60,000 words), structured as a central argument flanked by the three case studies. This fits the twelve-month timeline:
  *   **Months 1-3:** Formalize the distinction; draft the philosophical framework.
  *   **Months 4-8:** Execute the three case studies. This requires library research into model specifications, not empirical data collection.
  *   **Months 9-12:** Synthesis and revision.

  To fit this timeline, I must give up a comprehensive history of the methodology debate. I will not trace the lineage of instrumentalism from Mach to Friedman. I will treat existing defenses as static positions to be tested against my distinction, not historical artifacts.

  **Falsification Conditions**
  I am prepared to abandon the project if:
  1.  **Redescription succeeds:** If every "unturnable" assumption can be mathematically redescribed as a limit of a turnable one (e.g., if perfect foresight is shown to be the stable limit of a learning process), the distinction is illusory.
  2.  **Subjectivity prevails:** If the "turnability" depends entirely on the analyst's patience or mathematical skill rather than the model's structure, the distinction is psychological, not ontological.

  **Jargon Note**
  The committee will encounter terms like *instrumentalism* and *idealization*. I will define *instrumentalism* simply as "the view that theories are tools for prediction rather than descriptions of reality." I will define *idealization* as "a simplifying assumption that approximates a real feature." The core contribution is the distinction between *approximation* (turnable) and *premise* (unturnable).

  **Pitch:** This project tests whether the false assumptions that power economic models are approximations of reality or fictional premises, arguing that confusing the two leads to systematic errors in how we trust and use theory.
