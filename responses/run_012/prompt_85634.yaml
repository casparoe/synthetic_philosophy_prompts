      *   **Reflection Principle (RP):** $P_t(A | P_{t'}(A) = x) = x$. Roughly: If you are certain now that your future credence will be $x$, your current credence should be $x$.
      *   **The Case:** Theo knows he will take Zedex. Zedex makes him 95% confident in *whatever* proposition he considers, regardless of evidence. Currently 50% on paper acceptance. Certain future credence will be 95%.
