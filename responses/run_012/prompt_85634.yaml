      *   **Key Philosophical Issue:** Is RP a normative principle of rationality that holds universally, or does it rely on assumptions about the future self's rationality/evidence-responsiveness? The Zedex case is a standard counterexample (often called "forgetting" or "irrational updating" cases, though here it's chemical manipulation). Van Fraassen himself acknowledged limitations (often framed around "no loss of information" or "rational updating").
      *   **Standard View:** RP fails in cases where the agent knows their future self will be irrational or misinformed. The principle is usually restricted to cases where the future credence is formed via rational updating on evidence available between $t$ and $t'$.

