prompt: |-
  I'm in a reading group that's been grinding through Quine's radical translation stuff — the jungle linguist, the whole gavagai business, rabbit vs. rabbit-stage vs. undetached rabbit parts — and we've somehow spent four sessions re-running the same argument without anyone moving an inch. Here's the shape of it. One camp says Quine uncovered something deep: the facts don't determine which of several incompatible translation manuals is correct, so there's no fact of the matter about meaning over and above dispositions to assent. A second camp says that's either trivially true of any theory (theories are always underdetermined by the data, big deal) or an artifact of Quine's own behaviorism, and that once you drop the behaviorist scruples the indeterminacy evaporates. Someone else in the group insists the real issue is that Quine needs indeterminacy in a stronger sense than mere underdetermination — more than one theory fits everything, versus there being nothing further to be right or wrong about — and that he only ever gets the first while claiming the second. And then there's the guy who works on machine translation, who keeps saying his models settle it: you can train two systems on the same corpus that agree sentence-for-sentence and disagree about what any given word picks out, and there's no procedure that could say which one is right. The philosophers say that's a fact about his training setup, not about meaning. Everyone agrees on the cases, everyone agrees on the data, and we just cycle.

  I have a hypothesis but I don't trust it. Maybe this isn't a disagreement about translation at all but about what could possibly count as a fact of the matter about meaning: camp one thinks that if a difference isn't reflected in behavior then it isn't a fact, camp two thinks meaning facts are as real as any other theoretical facts and that the gavagai cases just show how little of them surfaces in behavior, and the translation guy is running an equivocation between "no fact of the matter" and "no way to tell from the data." Could you act as a philosopher of language who's spent way too long on this, think it through carefully before you start writing, and give me a diagnosis rather than a verdict on who's right about translation? I'd like you to first lay out as precisely as you can what each side is actually committed to, then say what kind of disagreement this is — verbal, substantive, sides answering different questions under one heading, or bedrock intuitions about what a meaning fact would have to be — and whether some hidden empirical or formal question is doing the work. Then, given your diagnosis, be honest about whether anything would count as progress here: a distinction that dissolves the standoff, a kind of case that would settle it, a formal result, or a reason to think one side is answering the wrong question entirely. I've read alot of secondary literature so I'm not looking for a survey of positions, and please don't give me a reading list or citations — just the diagnosis and the argument for it. American English, and keep the two questions seperate in your answer if you can.
