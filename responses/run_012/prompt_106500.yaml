      *   *Patient Advocate:* Focus on "grief validity."

      *   *The "Sweat" Cases:*
          *   Twins: This is the strongest objection. If one embryo = two people, the embryo isn't the person. It's a *precursor* that can split.
          *   Chimeras: Two embryos = one person. This means discarding one might not be "leaving a person on ice," but it also means the "distinct person" claim is fuzzy.
          *   MRT: Less critical, but touches on "what constitutes origin."

      *   *The Killer Question:* What is the one question that stops the show? It's likely from the Patient Advocate or the Philosopher combining grief and metaphysics. "If you're right, why does it hurt?" Or "At what point does the metaphysics stop protecting you from the morality?"
      *   *Actually, the Killer Question:* "If identity doesn't matter, why did you test them?" (PGT). If you screen for health, you are making a qualitative judgment about the *life* to be lived, which contradicts the "just identity" argument. Or, "If Embryo B is never a person, why do you feel guilt?"
      *   *Better Killer Question:* From the Philosopher of Biology regarding twinning. "If the embryo can split, it isn't an individual yet. If it isn't an individual, your Necessity of Origin claim applies to the *gametes*, not the embryo. So you aren't choosing between persons, you're choosing between biological materials. Does that make you feel better?"

  7.  **Finalizing the Structure:**
      *   Introduction: Acknowledge the stakes.
