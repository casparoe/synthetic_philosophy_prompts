      *   *Best Idea:* From the Philosopher of Biology: "If twinning is possible, the embryo is not the individual. If the embryo is not the individual, your 'Necessity of Origin' argument applies to the zygote or the gametes, not the blastocyst in the tank. So when you say 'Embryo A,' you're referring to a cluster of cells that *might* become one or two people. How does that uncertainty change your ethics?"

