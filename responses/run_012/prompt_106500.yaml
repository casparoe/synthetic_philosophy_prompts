prompt: |-
  Ok, weird one for you. My partner and I have been doing IVF since last spring (its been a slog, everything's fine, just slow) and we've ended up with four embryos in the freezer, and I've somehow agreed to give a fifteen-minute talk at the med school's bioethics seminar next month. I'm the department's token patient-philosopher now, apparently.

  My talk, roughly: the kid we'd get from embryo A was never going to be the kid we'd get from embryo B, because a different sperm and a different egg make a different person. Standard necessity-of-origin stuff, and I believe it. That's supposed to buy me two things: (1) we are not "choosing between" two kids who already exist, and (2) the guilt a lot of us carry about the ones left on ice is resting on a mistake. That's the paylod.

  The room is going to be specific and rough: two embryologists from our own clinic, one of whom runs the PGT lab and talks in terms of "which one gives us a healthy baby"; the clinic's lawyer; a philosopher of biology who works on biological individuality; a chaplain who thinks the embryo is a person from conception; and a patient advocate from our support group who's had two losses and four years of this.

  Prep me. What do they actually come at me with, in their own vocabularies, ordered by how much damage each one does? Two-minute answer for each, plus an honest flag on where the answer is soft. Tell me what I should just concede up front rather than fight. And don't hand me the objections I could have guessed myself — give me the ones this particular room will raise.

  Three things I'm already sweating: the twin case (one embryo splits into two people), the chimera case (two embryos fuse into one person with two sets of cells, which I'm told genuinely happens in humans), and the technique where mum's nuclear DNA goes into a donor's egg so the mitochondria come from a third person entirely. If any of those quietly wreck the argument, say so and say why, don't be nice about it. Also tell me the question I'm praying nobody asks.
reasoning: |-
