answer: |-
  This is a high-stakes room. You are walking in with a metaphysical shield (Necessity of Origin) to protect against a moral/emotional sword (Guilt/Status). Your shield is logically sound in a vacuum, but this room lives in the messiness of biology and grief.

  Here is your prep, ordered by the damage potential to your core thesis.

  ### 1. The Philosopher of Biology (The Metaphysical Wrecking Ball)
  **The Attack:** "You're assuming the embryo is the locus of individuality. It isn't. Monozygotic twinning happens up to day 14. If Embryo A splits into Twin 1 and Twin 2, Embryo A was not identical to Twin 1. Therefore, the embryo is not a 'person-seed'; it's a reversible cluster of cells. If identity isn't fixed at the blastocyst stage, your Necessity of Origin claim applies to the *gametes*, not the frozen tank. You aren't choosing between persons; you're choosing between biological materials that *might* become persons."

  **Your 2-Minute Answer:** "I concede the embryo isn't the *final* locus of individuation. But the *origin* is fixed. Twin 1 and Twin 2 share the same origin (Embryo A), distinct from Embryo B. My argument isn't that the embryo is the person; it's that the *pathway* to Person A is mutually exclusive to the pathway to Person B. Twinning creates a fork in one road; it doesn't merge Road A with Road B. The distinctness of the genetic origin remains the moral boundary for selection."

  **Soft Spot:** This is soft. If the embryo can become two people, the "one embryo = one potential person" heuristic you rely on for the guilt argument is mathematically wrong.
  **Concede:** Concede that "personhood" isn't present in the tank. Stick to "distinct potential histories." Do not claim the embryo *is* the individual.

  ### 2. The Patient Advocate (The Emotional Reality Check)
  **The Attack:** "You're telling us our grief is a category error. But for the women in my group, the 'siblings on ice' aren't metaphysical abstractions. They are grieved losses. If you tell a mother her guilt is resting on a mistake, you aren't correcting her philosophy; you're invalidating her love. Does your argument actually reduce suffering, or does it just give you intellectual cover to abandon them?"

  **Your 2-Minute Answer:** "I'm not invalidating the grief; I'm diagnosing its source. The pain is real, but the narrative that we are 'leaving children behind' amplifies it unnecessarily. If we understand these as distinct *possibilities* rather than trapped *siblings*, we can mourn the lost futures without the burden of moral abandonment. I'm offering a way to carry the weight, not a denial that it's heavy."

  **Soft Spot:** Very soft. Logic rarely cures grief. If you sound clinical here, you lose the room.
  **Concede:** Concede that the *feeling* of guilt is valid data, even if the *premise* is metaphysically shaky. Don't fight the emotion.

  ### 3. The Lead Embryologist (The Biological Instability)
  **The Attack:** "You talk about Embryo A and B as fixed entities. They aren't. Mosaicism means Embryo A has cell lines with different genetics. Some cells might be viable, others not. PGT-A shows us that the 'identity' of the embryo is a statistical probability of health, not a fixed essence. When I say 'which one gives us a healthy baby,' I'm not choosing a person; I'm choosing a viability rate. Your metaphysics ignores the biological noise."

  **Your 2-Minute Answer:** "Biological noise doesn't erase genetic origin. Mosaicism complicates the *quality* of the potential life, not the *identity* of the source. I'm not arguing that Embryo A is guaranteed to be a person. I'm arguing that if Embryo A becomes a person, it cannot be the same person Embryo B would have been. Your viability data helps us select; my metaphysics helps us sleep after the selection."

  **Soft Spot:** If the embryo is a mosaic of different genetic profiles, is it even one "origin"?
  **Concede:** Concede that the embryo is a process, not a static object.

  ### 4. The Chaplain (The Moral Status)
  **The Attack:** "Even if they are different people, they are human organisms. If you freeze them indefinitely, you are suspending a human life in limbo. Necessity of Origin explains why they are distinct; it doesn't explain why you have the right to leave them in nitrogen forever. You've solved the identity problem but ignored the stewardship problem."

  **Your 2-Minute Answer:** "I'm addressing the guilt of *selection*, not the ethics of *storage*. My argument is that selecting A over B isn't an act of harm against B. What we do with B afterwards is a separate question of resource allocation and respect for biological material. I'm trying to clear the deck so we can have that second conversation without the paralysis of 'murder' accusations."

  **Soft Spot:** You are kicking the can down the road.
  **Concede:** Concede this is a separate ethical bucket. Don't let them merge "identity" with "sanctity."

  ### 5. The Clinic Lawyer (The Liability)
  **The Attack:** "If they aren't persons, what are they? Property? If they are property, you can discard them. If they are potential persons, you have a duty of care. Your argument creates a legal gray zone. If you tell patients they aren't choosing between kids, does that lower the standard of care required for storage?"

  **Your 2-Minute Answer:** "I'm making a metaphysical claim, not a legal one. The law operates on social consensus, not Kripkean semantics. My talk is for the patients' consciences, not your liability waivers. You can classify them as you must; I'm just asking patients not to classify them as 'existing children' in their own heads."

  **Soft Spot:** None really. Keep metaphysics and law separate.
  **Concede:** Nothing. This is their lane, not yours.

  ---

  ### The "Sweat" Cases: Do They Wreck You?

  **1. Monozygotic Twinning (One Embryo $\rightarrow$ Two People)**
  *   **Verdict:** **Yes, this wrecks the 1:1 mapping.**
  *   **Why:** Your argument relies on Embryo A = Future Person A. If Embryo A = Future Person A + Future Person B, then the embryo is not identical to the person. It is a *precursor* that can divide. This means the "individual" comes into existence *after* the embryo stage (likely at the primitive streak).
  *   **Damage:** It undermines the claim that you are choosing between "kids." You are choosing between *clusters* that have the potential to become one or more kids.
  *   **Fix:** Shift your claim. "The *genetic origin* is distinct." Even if A splits, the resulting twins share an origin distinct from B. The *choice* is still between mutually exclusive genetic histories.

  **2. Tetragametic Chimerism (Two Embryos $\rightarrow$ One Person)**
  *   **Verdict:** **Yes, this wrecks the distinctness.**
  *   **Why:** If Embryo A and Embryo B fuse to create Person C, then A and B were not distinct persons. They were halves of a whole. If you discarded B, you might have altered C, but you didn't leave a "separate person" on ice.
  *   **Damage:** It proves that "embryo count" $\neq$ "person count."
  *   **Fix:** Acknowledge rarity. "While biologically possible, this is an outlier. Ethics must be built on the standard case, not the anomaly. In 99.9% of cases, A and B remain distinct." Do not let them hang the whole argument on a 1-in-100,000 event.

  **3. Mitochondrial Replacement (Three-Person IVF)**
  *   **Verdict:** **No, this doesn't wreck it, but it complicates "Origin."**
  *   **Why:** If "Origin" means nuclear DNA, NoO holds. If "Origin" includes cytoplasmic factors, the definition gets muddy.
  *   **Damage:** Minimal. It just forces you to define "Origin" as "Nuclear Genetic Identity."
  *   **Fix:** Define Origin strictly as nuclear genome for the sake of the argument.

  ---

  ### What to Concede Up Front
  1.  **The Embryo is not the Person:** Do not defend the idea that the blastocyst is an individual. Defend the idea that it is a *unique causal pathway* to an individual.
  2.  **Guilt is Not Irrational:** Do not tell the Advocate that guilt is a "mistake." Tell them guilt is a *byproduct of love*, but that metaphysical clarity can reduce the *burden* of that guilt.
  3.  **Biology is Messy:** Concede that mosaicism and chimerism exist. Argue that ethics cannot be paralyzed by edge cases.

  ### The Question You Are Praying Nobody Asks
  **From the Philosopher of Biology:**
  *"If the embryo can split (twins) or fuse (chimeras), then numerical identity is not fixed at the embryonic stage. If identity isn't fixed, then 'Necessity of Origin' applies to the gametes, not the frozen embryos. So, when you look at that tank, you aren't looking at four potential people. You're looking at four biological containers with probabilistic outcomes. If that's true, why do you treat them with the reverence of persons when it suits you (storage), but the metaphysics of objects when it suits you (selection)?"*

  **Why it kills you:** It exposes that your argument is instrumental. You are using metaphysics to soothe guilt, not to describe reality. It forces you to admit that the "personhood" status is fluid based on your emotional needs.

  **How to parry:** "I treat them with reverence because they are the *only* bridge to my child. That reverence is relational, not ontological. I don't need them to be persons to honor what they represent."
