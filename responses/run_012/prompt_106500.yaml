      *   **Task:** Prep the user for objections. Order by damage potential. 2-minute answer per objection. Flag soft spots. Identify concessions. Address specific biological edge cases (twins, chimeras, mitochondrial replacement). Identify the "killer question."
      *   **Tone:** Direct, honest, not "nice," philosophically rigorous but grounded in the clinical reality.

  2.  **Deconstruct the Core Argument:**
      *   *Premise 1:* Necessity of Origin (NoO). A specific zygote is necessary for a specific person.
      *   *Premise 2:* Embryos A and B have different origins (different gametes).
      *   *Conclusion:* Embryo A and Embryo B would develop into numerically distinct persons.
      *   *Ethical Payload:* Selecting A doesn't harm B (non-identity problem logic). Freezing B isn't withholding life from *that* specific future person in a way that generates guilt, because "that person" only exists if *that* embryo is used.

  3.  **Brainstorm Objections by Audience Member:**

      *   *Philosopher of Biology:* Will attack the metaphysics. Is the embryo *already* the individual? What about twinning? If one embryo becomes two people, the embryo wasn't identical to the person *yet*. This undermines NoO applied to the *embryo* stage.
      *   *Embryologists:* Will attack the "healthy baby" framing. PGT-A shows mosaicism. Embryos change. An embryo isn't a static "person-seed"; it's a biological process with error rates. They might argue that *potentiality* is the clinical metric, not metaphysical identity.
      *   *Chaplain:* Will attack the moral status. Even if they are different people, they are *human beings* with rights. Freezing is limbo, not non-existence. The "mistake" isn't metaphysical; it's moral.
      *   *Lawyer:* Will attack the property/person distinction. If they aren't persons, what are they? Property? If they are potential persons, what are the liability risks of discarding?
      *   *Patient Advocate:* Will attack the emotional reality. "Sibling" language. The grief of leaving them behind. The metaphysical argument doesn't soothe the visceral feeling of loss.

  4.  **Address the Specific "Sweat" Cases:**
      *   *Twins (Monozygotic):* One embryo $\rightarrow$ Two people. This breaks the 1:1 mapping between embryo and person. If Embryo A can become Person 1 OR Person 1 + Person 2, then Embryo A is not *necessarily* identical to Person 1. This weakens the NoO claim at the embryonic stage.
      *   *Chimeras (Tetragametic):* Two embryos $\rightarrow$ One person. If Embryo A + Embryo B $\rightarrow$ Person 1, then A and B were not distinct persons. They were parts of a whole. This wrecks the "different embryo = different person" axiom.
      *   *Mitochondrial Replacement (MRT):* Nuclear DNA from Mom/Dad, Mitochondria from Donor. Who is the origin? If origin is defined by nuclear DNA, NoO holds. If origin includes cytoplasmic factors, it gets muddy. This is less damaging than twins/chimeras but complicates "origin."

  5.  **Order by Damage Potential:**
      1.  *Philosopher of Biology (Twinning/Chimerism):* Metaphysical wrecking ball. If the identity relation isn't 1:1 at the embryo stage, the whole argument collapses.
      2.  *Patient Advocate (The Lived Experience):* Emotional/Pragmatic wrecking ball. Even if logically sound, if it alienates the room or dismisses grief, the talk fails.
      3.  *Embryologists (Mosaicism/Development):* Scientific nuance. Shows the embryo isn't a fixed "essence."
      4.  *Chaplain (Moral Status):* Predictable. Easy to parry with "I'm talking about identity, not sanctity."
      5.  *Lawyer (Status):* Dry. Less damaging to the core philosophical claim.

  6.  **Drafting the Responses (Iterative refinement):**

      *   *Constraint Check:* Needs to be "2-minute answer" style (concise, punchy). Needs to flag "soft spots." Needs to say what to concede.
      *   *Tone Check:* Don't be nice. If an argument is wrecked, say it.

