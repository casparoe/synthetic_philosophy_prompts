answer: |-
  This is a classic problem in the philosophy of art, touching on aesthetics, ontology, and ethics. Your intuitions are not broken; they are tracking different *kinds* of value that we conflate under the single word "art."

  To resolve this, you do not need to give up most of your verdicts, but you do need to refine your definition of what an artwork *is*. Your proposed principle ("Experience + True Story") is close, but it treats the story as an add-on. The principle that actually unifies your intuitions is this:

  **The Principle of Certified Performance:**
  > **An artwork is not merely an object of aesthetic experience; it is a physical trace of a specific human achievement.**

  When you value art, you are valuing two things simultaneously:
  1.  **The Product:** The visual experience (the "look").
  2.  **The Performance:** The difficulty, genius, and historical moment of the act that created it (the "making").

  Here is how this principle resolves your contradictions, which verdict must yield, and how it applies to your unsettled cases.

  ### 1. Resolving the Contradictions

  **Van Meegeren vs. Rembrandt (The Performance)**
  You find Van Meegeren "dead." This confirms that you are not a pure aesthetic empiricist (someone who believes only the visual experience matters). If you were, Van Meegeren's technical competence would suffice. But you sense a lack of *achievement*. Vermeer solved problems of light and composition that were new; Van Meegeren solved the problem of *mimicry*. One is a discovery, the other is a trick. The "deadness" you perceive is the absence of creative risk.
  *   **Verdict:** Consistent with Certified Performance.

  **The Workshop vs. The Forgery (The Authorization)**
  You ask why the assistant's hand is acceptable but Van Meegeren's is not, since neither is Rembrandt's hand.
  *   **The Difference:** Agency and Sanction. In a workshop, the Master is the *architect*. The assistant is a tool extended by the Master's will. The output is authorized by the Master as bearing their name. It is part of the Master's "performance" of running a brand.
  *   **The Forgery:** This is a *usurpation* of agency. Van Meegeren was not extending Rembrandt's will; he was hijacking it.
  *   **Verdict:** Consistent. The Workshop piece is a "Rembrandt Enterprises" product; the Forgery is a "Van Meegeren pretending to be Rembrandt" product.

  **The Vintage Print & Heavy Restoration (The Trace)**
  You prefer the grubby original and the vintage print. Why? Because the physical object itself is the certificate.
  *   **Vintage Print:** A modern print from the same negative is the same *image* (allographic), but not the same *object* (autographic). The vintage print has a causal connection to the moment the photographer deemed the work finished. It bears the "aura" (to use Walter Benjamin's term) of that specific time.
  *   **Restoration:** A heavily repainted canvas is no longer a witness to the painter's hand; it is a witness to the restorer's hand. You prefer the grubby one because it preserves the *trace of the original performance*, even if obscured.
  *   **Verdict:** Consistent. The physical history matters as much as the image.

  **The Donation of Constantine (Category Error)**
  You value the Donation as a forgery but not Van Meegeren. This is because they belong to different categories of value.
  *   **The Donation:** Its primary value is *historical/causal*. It changed the course of Europe. Its success as a lie is the source of its historical power.
  *   **Van Meegeren:** Its primary claim was *aesthetic*. It claimed to be a great painting. When the lie is exposed, the aesthetic claim collapses because the "performance" was mimicry, not creation.
  *   **Verdict:** Consistent. One is a historical document that happens to be a lie; the other is an artwork that claims to be something it isn't.

  ### 2. The Verdict You Must Give Up

  You have one intuition that conflicts with the **Principle of Certified Performance**:

  > *"If the fact never surfaces... I don't think it's worth less right now."* (Regarding an undiscovered forgery).

  **You must give this up.**

  If art is a "trace of a specific human achievement," then the undiscovered forgery *is* worth less, even if no one knows it. You are conflating **Price/Social Status** with **Artistic Value**.
  *   **Market Value:** Depends on belief. If everyone thinks it's a Vermeer, the price is high.
  *   **Artistic Value:** Depends on the causal history. If it is a Van Meegeren, the achievement is lower.

  **Why you feel conflicted:**
  You feel it isn't "worth less" because your *experience* of it hasn't changed. But consider the **Kitchen Vermeer** case you raised: *"Nobody is deceived. I still think it's worth less than the Vermeer."*
  This contradicts your "Undiscovered Forgery" intuition. If deception isn't necessary for the Kitchen Vermeer to be worth less, then deception isn't necessary for the Undiscovered Forgery to be worth less either. The value lies in the *reality of the origin*, not the *belief in the origin*.

  **The Reattribution Paradox:**
  You wrote: *"The true story doesn't change on the day of the announcement and my valuation does."*
  This feels like a contradiction, but it is actually an **Epistemic Correction**.
  *   **Analogy:** You buy a diamond. Ten years later, you find out it is cubic zirconia. Did the stone change? No. Did its value change? Yes.
  *   **Why?** Because the value was *always* lower; you just lacked the information to access that truth. When the experts demote the Rembrandt, they aren't changing the painting; they are changing your *access* to the painting's true status. Your valuation shifts to align with reality.

  *(Note: There is a secondary philosophical view, Kendall Walton's "Categories of Art," which argues that knowing the history actually changes your **perception**. Once you know it's a studio piece, you literally **see** the brushstrokes as "competent" rather than "genius." So, in a sense, the experience does change.)*

  ### 3. The Unsettled Cases

  Here is what the **Principle of Certified Performance** says about your two final questions:

  **Case A: The Artist's Later Copy**
  *Scenario:* An artist paints a second version of his own famous picture thirty years later. Indistinguishable from the first. Both in museums.
  *   **Valuation:** They are of **equal artistic value**, though they may have different *historical* value.
  *   **Reasoning:** The "Performance" is identical in terms of agency. Both are authentic traces of the Master's hand and mind. The "Achievement" is the same.
  *   **Nuance:** The *first* version might be valued higher by the market because it represents the *initial* breakthrough (the moment of innovation). The second is a "re-performance." But as art, both are authentic. Unlike the forgery, the causal chain leads back to the same genius.

  **Case B: The Museum Forgery**
  *Scenario:* A forgery that a museum keeps on display with an honest label next to the real ones.
  *   **Valuation:** It has **high educational value** but **low aesthetic value**.
  *   **Reasoning:** Once labeled, it shifts categories. It is no longer competing as a "Vermeer"; it is now a "Van Meegeren."
      *   As a Van Meegeren, it is a fascinating document of deception (like the *Donation of Constantine*).
      *   It allows us to study the *performance of mimicry*.
      *   It does not "pollute" the real Vermeer next to it because the certification is clear. In fact, displaying them side-by-side highlights the "deadness" of the forgery by contrast, validating your intuition about Van Meegeren's lack of vitality.

  ### Summary of the Unified Theory

  1.  **Art is Performance:** We value the difficulty and genius of the specific act of creation, not just the resulting image. (Explains Van Meegeren vs. Vermeer).
  2.  **Art is Historical Trace:** The physical object must bear the causal mark of that specific moment in time. (Explains Vintage Prints, Restoration, Roman Copies).
  3.  **Value is Ontological, not just Epistemic:** A fake is worth less even if no one knows it. Your valuation changes on reattribution because your knowledge has finally caught up with the object's reality. (Resolves the Reattribution Paradox).
  4.  **Authorization Matters:** A workshop piece is an extension of the Master's agency; a forgery is a hijacking of it. (Explains the Workshop distinction).

  You don't have to become a snob to hold these views. You simply have to accept that when we look at art, we are not just looking at shapes and colors; we are shaking hands with a person across time. If the hand isn't who we think it is, the handshake loses its meaning, even if the grip is firm.
