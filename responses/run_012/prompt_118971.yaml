      *   *Identifiability:* Mention the "empty reward" problem (R=0 everywhere makes any policy optimal if we don't assume optimality). Mention that optimal policies don't distinguish between $R$ and $R + \gamma \Phi(s') - \Phi(s)$.
      *   *Partial Observability:* Humans act on beliefs. What looks like inconsistent preference might be Bayesian updating. This maps to POMDP-IRL.

