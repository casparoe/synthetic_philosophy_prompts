prompt: |-
  Just spent most of last night arguing with my old roommate (he's an economist, I build RL agents) about whether utility is a real thing or just a bookkeeping trick for summarizing choices, and I want to see where we were actually talking past each other. Take the economists' debate over revealed preference -- the operationalist line that preference is nothing over and above choice, the axioms you have to impose before a choice pattern counts as coming from a consistent ranking, and the objections that people routinely choose against their own interest or against what they'd endorse on reflection -- and restate it as faithfully as you can in the vocabulary I actually use: reward functions, policies, inverse RL, reward identifiability and underdetermination, reward misspecification and hacking, partial observability, off-policy evaluation. I'm fluent in that stuff so dont dumb it down. Then give me the residue report: what translates cleanly, what only translates with fudging, and what has no counterpart at all. My own take is that utility is just whatever reward function you'd have to posit to make the behavior optimal, so it's wildly underdetermined and not really 'there'. I want to know if that's the same as what the economists are saying or if I'm quietly assuming something they don't, and whether any of the leftover is my vocabulary missing something or their claim being mushier than it looks.
