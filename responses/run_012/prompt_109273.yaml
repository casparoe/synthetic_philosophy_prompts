  ### Tier 1: Real Adaptation (Confidence 0.8–1.0)

  **Language (0.9)**
  *   **Byproduct Prediction:** If language is a spandrel of general intelligence, it predicts no neural circuitry specific to syntax that operates independently of motor control or general cognition.
  *   **Evidence to Shift:** Discovering a gene variant that impairs *only* recursive syntax without affecting memory, motor skills, or semantic understanding moves confidence **up**.

  **War and Coalitional Violence (0.85)**
  *   **Byproduct Prediction:** If violence is merely a byproduct of resource scarcity and individual aggression, it predicts no psychological mechanisms specifically designed for forming male coalitions to incur risks for group gain.
  *   **Evidence to Shift:** Cross-cultural data showing consistent male coalitional risk-taking even when individual resource acquisition is secure moves confidence **up**.

  ### Tier 2: Probably Adaptation (Confidence 0.6–0.79)

  **Menopause (0.75)**
  *   **Byproduct Prediction:** If menopause is an artifact of modern lifespan extension, it predicts no fitness benefit to grandmothers in ancestral hunter-gatherer environments.
  *   **Evidence to Shift:** Demographic data showing grandmothers' foraging directly increases grandchild survival rates independent of the mother's presence moves confidence **up**.

  ### Tier 3: Live Dispute (Confidence 0.4–0.59)

  **Depression (0.5)**
  *   **Byproduct Prediction:** If depression is a system malfunction, it predicts no functional problem-solving capacity during episodes and no reliable trigger linked to social negotiation.
  *   **Evidence to Shift:** Evidence that rumination during depressive episodes reliably solves the specific social problem that triggered the episode moves confidence **up**.

  **Same-Sex Attraction in Humans (0.45)**
  *   **Byproduct Prediction:** If this is a byproduct of selected-for opposite-sex attraction mechanisms, it predicts no genetic loci associated *only* with same-sex attraction that confer kin fitness benefits.
  *   **Evidence to Shift:** Finding specific genetic markers for same-sex attraction that correlate with increased reproductive success in heterosexual siblings (kin selection) moves confidence **up**.

  ### Tier 4: Probably Byproduct or Spandrel (Confidence 0.2–0.39)

  **Music (0.35)**
  *   **Byproduct Prediction:** Pinker's "auditory cheesecake" predicts no neural specialization for music distinct from language or general auditory processing.
  *   **Evidence to Shift:** Discovery of brain lesions that abolish music perception and production but spare language and sound processing moves confidence **up**.

  **Contagious Yawn (0.3)**
  *   **Byproduct Prediction:** If this is a physiological reflex without social function, it predicts no correlation between susceptibility to contagion and empathy levels or social bonding strength.
  *   **Evidence to Shift:** Strong correlation between yawn contagion susceptibility and empathetic accuracy across species and individuals moves confidence **up**.

  **Female Orgasm (0.25)**
  *   **Byproduct Prediction:** The homologue hypothesis predicts no variation in orgasm frequency linked to ovulation cycles or partner quality (no sperm retention function).
  *   **Evidence to Shift:** Evidence of ovulatory shift in orgasm frequency facilitating sperm retention ("upsuck") moves confidence **up**.

  **Religion (0.2)**
  *   **Byproduct Prediction:** If religion is a byproduct of HADD (Hyperactive Agency Detection) and Theory of Mind, it predicts religious concepts map exactly onto intuitive ontology violations without functional group benefits.
  *   **Evidence to Shift:** Evidence that religious groups outcompete secular groups in survival *due to* doctrinal specifics rather than general cohesion moves confidence **up**.

  ### Tier 5: Not an Adaptation at All (Confidence 0.0–0.19)

  **Human Chin (0.05)**
  *   **Byproduct Prediction:** If the chin is a structural spandrel of facial reduction, it predicts no muscle attachment advantage over non-chinned primates under biomechanical stress.
  *   **Evidence to Shift:** Biomechanical proof that the chin prevents fracture during chewing stresses where other primates fracture moves confidence **up**.
