prompt: |-
  So I'm writing a novel and one of my characters runs a small foundation — a few million a year, very into being rigorous about it. Their whole thing is they only fund what you can put a number on: deworming, bed nets, a cash-transfer study. Anything where the payoff is "people get a bit more politically engaged" or "the culture shifts a bit" gets turned down with a note saying it isn't cost-effective. They've also got this internal spreadsheet where staff assign "moral weights" — how many dollars of animal welfare equals a dollar of human health, that kind of thing — and then they take the median of everyone's answers and treat that as the real number. Meanwhile the same people, over drinks, will tell you they're deeply uncertain about the weights and would never claim one being's suffering literally counts more than another's.

  What I want from you is what the practice actually assumes — not what they say, what the institutions habits commit them to. Does ranking everything by expected good per dollar presuppose that all these goods are commensurable, that there's one scale? Does refusing to fund the unmeasurable presuppose that unmeasurable goods don't count, or just that you can't compare them, or something weaker and more about decision-making under uncertainty? And the median-weight thing — is that a claim that there's a fact of the matter about the exchange rate between a human life and an animal one, or just a coordination device so the spreadsheet works?

  And is it even consistent with itself? They say they take moral uncertainty seriously and then fund off a single point estimate. I feel a tension there but I can't name it. Also curious whether the "earning to give" side of this — people taking a high-paying job specifically to donate the salary — assumes something different about what a life is for than the foundation side does, or if it's the same commitment wearing two hats.

  One thing I'd ask: tell me which parts of this are settled among people who actually work on it and which are live disagreements. I don't want to put a contested view in my character's mouth as though it were just obviously true. And be straight with me about where the practice is underdetermined — where several different theories would license the exact same behavior.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel featuring a character who runs a small, rigorous foundation (reminiscent of Effective Altruism/EA organizations like GiveWell or Open Philanthropy, but perhaps more extreme or caricatured).
      *   **Character Traits:** Obsessed with quantification (deworming, bed nets, cash transfers), rejects unmeasurable outcomes (political engagement, culture shift), uses an internal spreadsheet with "moral weights" (human vs. animal welfare), takes the median of staff estimates and treats it as factual, yet admits uncertainty privately.
      *   **Core Questions:**
          1.  What does the *practice* assume vs. what they *say*? (Implicit ontological/ethical commitments).
          2.  Does ranking by $/good presuppose commensurability (one scale)?
          3.  Does refusing unmeasurable goods mean they don't count, or just can't be compared?
          4.  Is the median-weight thing a claim of objective fact or a coordination device?
          5.  Is it consistent to claim moral uncertainty but fund off a single point estimate?
          6.  Does "earning to give" assume something different about life's purpose than the foundation side?
          7.  **Crucial Constraint:** Distinguish between settled views and live disagreements within the actual community (EA/longtermism/etc.). Don't present contested views as obvious truths. Highlight where theory underdetermines practice.

  2.  **Deconstruct the Philosophical/Practical Issues:**

      *   **Commensurability:** To maximize $X, you need to compare $X to $Y. If you can't compare them, you can't maximize. The practice *acts* as if everything is commensurable (convertible to a common unit, usually QALYs, DALYs, or "welfare units").
      *   **Unmeasurable Goods:** Refusing to fund them acts *as if* their value is zero (or below the threshold of measurable alternatives). This is a strong assumption. It could be justified as "decision-making under severe uncertainty" (ambiguity aversion), but functionally it treats them as negligible.
      *   **Moral Weights (The Median):** Taking a median and acting on it treats a subjective/philosophical uncertainty as an empirical parameter. It collapses "we don't know" into "we decided it's X." This is a pragmatic hack, not a philosophical truth claim, but the *behavior* reifies the number.
      *   **Moral Uncertainty vs. Point Estimates:** This is a known tension. "Expected Value Maximization under Moral Uncertainty" is a field. Some argue you should maximize expected *choiceworthiness*. Others argue for "moral hedging." Using a single median is a simplification that ignores the variance/risk.
      *   **Earning to Give:** This instrumentalizes the career. The life is a means to the end (donations). The foundation side treats the *donation* as the lever. They are consistent in consequentialism but might differ in virtue ethics or personal fulfillment views.
      *   **Settled vs. Contested:**
          *   *Settled:* Quantification is hard but necessary for comparison.
          *   *Contested:* How to handle moral uncertainty (hedging vs. maximizing), how to value non-human animals (sentience scalars), whether to fund systemic change (hard to measure) vs. direct aid.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the realism of the portrayal. It sounds very much like the Effective Altruism (EA) movement, specifically the GiveWell/Open Philanthropy sphere. Validate the user's intuition about the tension.
      *   **Commensurability (The One Scale):** Address the "one scale" question. Yes, the practice requires a common currency (utility/welfare). Even if they deny it philosophically, the spreadsheet demands it.
      *   **The Unmeasurable (Zero or Unknown?):** Distinguish between "value = 0" and "expected value too uncertain to compete." The practice often looks like the former, even if the justification is the latter. This is the "proxy problem."
      *   **The Median Weight (Fact vs. Hack):** This is a key insight. It's a *decision procedure*, not an *ontological claim*. But it *functions* as if it's a fact. This is "reification."
      *   **Moral Uncertainty vs. Point Estimates:** This is the "moral hedging" debate. Using a median ignores the tails. If there's a 10% chance animals matter 100x more, ignoring that might be a mistake. The character's behavior is pragmatically consistent but philosophically leaky.
      *   **Earning to Give:** Consistent consequentialism. Life is a resource. But it creates tension regarding "integrity" or "complicity" (doing harm to do good).
      *   **Settled vs. Contested (The "Don't Put This In Their Mouth" Section):**
          *   *Settled:* Measurement is good. Comparison is necessary.
          *   *Contested:* Moral weights (highly debated), Systemic change (measureable vs. unmeasurable), Risk neutrality vs. aversion.
      *   **Underdetermination:** Where different theories lead to the same action. (e.g., Utilitarianism and Prioritarianism might fund the same bed nets).

  4.  **Refining the Tone:**
      *   Needs to be analytical, philosophical, but accessible.
      *   Avoid taking sides.
      *   Be precise about EA terminology (QALYs, moral uncertainty, cause neutrality) without being jargon-heavy.
      *   *Self-Correction during drafting:* Make sure I don't just say "This is EA." The user is writing fiction. I need to explain the *philosophical mechanics* so they can write the character's internal logic, not just label them.
      *   *Check the "Median" point:* Is it the median or the mean? EA usually talks about expected value (mean). The user specified median. That's interesting. Median implies avoiding outliers. I should note that distinction. Actually, in moral uncertainty, some argue for maximizing expected *choiceworthiness* (mean), others for minimizing regret. Taking the median of staff opinions is a specific organizational hack to avoid one weirdo skewing the budget. I should highlight that specific tension.

  5.  **Final Polish:**
      *   Ensure the distinction between *operational commitment* and *philosophical belief* is clear.
      *   Highlight the "performative contradiction" the user sensed.
      *   Make sure the "Settled vs. Contested" section is very clear so the user doesn't accidentally make their character sound dogmatic on debated points.

  6.  (Final Review against constraints):
