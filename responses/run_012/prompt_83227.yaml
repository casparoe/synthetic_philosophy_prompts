prompt: |-
  OK so I'm a second-year PhD student in philosophy of science — my own work is on causal inference in epidemiology, so I'm a bit of a tourist in formal epistemology — and my supervisor has voluntold me to give a 90-minute guest session in a colleague's MSc course on the foundations of statistics. The audience is stats and clinical epi masters students: they can do the maths fine, they've all had measure-theoretic probability, but they've never had to think about what probability *is* philosophically, and honestly most of them think the philosophy part is a soft add-on they can skip past to get to the estimators.

  The topic is the reference class problem. I don't need you to explain it to me — I need a teaching plan. What has to be in place before the problem even registers as a problem for them (my hunch is the first move has to be getting them to see that probabilities attach to events-under-a-description rather than to the events themselves, but tell me if that's wrong or if something else has to come first); then the order the pieces go in, so that by the end they see why the "just condition on everything you know" line doesn't get you out — they will ALL say this in the first ten minutes, I guarentee it — and why more data doesn't rescue you either. I want one case that carries the whole session: a single concrete scenario we come back to three or four times and that gets harder each time we look at it. My instinct is something actuarial or clinical, a person who is simultaneously a member of two or three classes with genuinely different base rates and no fact of the matter about which class is *the* class, maybe with an insurance-pricing or medico-legal payoff so they feel the stakes. But I don't want the coin, the lottery, or Sleeping Beauty as the carrying case — they've seen all of those and they'll coast. Tell me what the case needs to have and what it must not have (a case where one class is obviously the right one would kill the whole point).

  Then the misconception map: which misconceptions they'll arrive with — I'm expecting "it's a problem for frequentists, not Bayesians", "the narrowest or most specific class wins", "this is just the problem of induction wearing a hat", "the right reference class is whatever the data says it is" — and exactly where in the sequence I should head each one off, plus one or two they'll form *during* the session that I won't see coming. The thing I care about most: one question to ask at the end that would actually tell me whether they've got it, as opposed to whether they can recite the dialectic back at me. And finally, what to cut. I have 90 minutes and I know I'll want to talk about the exchangeability move and about how this bites in risk prediction and recidivism scoring; I'd rather cut one of those cleanly and say out loud that I'm cutting it than rush both.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the User and Context:**
      *   **User:** 2nd-year PhD student in Philosophy of Science (causal inference in epi). Self-described "tourist" in formal epistemology.
      *   **Task:** 90-minute guest lecture in an MSc course on Foundations of Statistics.
      *   **Audience:** MSc Stats/Clinical Epi students. Strong math background (measure-theoretic probability), weak/no philosophy background. View philosophy as "soft" or skippable. Pragmatic mindset (want estimators, not ontology).
      *   **Topic:** The Reference Class Problem (RCP).
      *   **Constraints:** Needs a teaching plan, not an explanation of RCP. Needs a single carrying case (no coins/lottery/Sleeping Beauty). Needs to address specific misconceptions. Needs a diagnostic final question. Needs advice on what to cut (Exchangeability vs. Risk Prediction/Recidivism).
      *   **Key Pedagogical Goals:**
          1.  Make RCP register as a *problem* (not just a technicality).
          2.  Show why "condition on everything" fails.
          3.  Show why "more data" fails.
          4.  Handle the "Frequentist vs. Bayesian" misconception.
          5.  Handle the "Narrowest Class" misconception.

  2.  **Deconstruct the Reference Class Problem (RCP):**
      *   *Core Issue:* Probability is relative to a description/class. Individuals belong to infinite classes. Different classes yield different probabilities. Which one is the "true" probability for *this* individual/event?
      *   *Why it matters for this audience:* Risk prediction, personalized medicine, insurance pricing, legal liability.
      *   *Why "Condition on Everything" fails:* Overfitting, single-case reference class (probability 0 or 1), loss of predictive power, causal vs. non-causal features.
      *   *Why "More Data" fails:* Doesn't solve the selection of the class, just makes the estimate within the chosen class more precise (potentially precisely wrong).

  3.  **Develop the Carrying Case:**
      *   *Requirements:* Clinical/Actuarial (fits audience), no obvious "right" class, stakes involved, allows for iterative complexity.
      *   *Idea 1:* Insurance pricing for a driver. (A bit cliché).
      *   *Idea 2:* Drug efficacy for a specific patient. (Good, fits Epi).
      *   *Idea 3:* Recidivism risk for a defendant. (High stakes, controversial, fits "foundations").
      *   *Selection:* **Clinical Trial/Personalized Medicine Scenario.** It bridges the gap between their stats training and the philosophy. Let's make it about *adverse event risk* for a specific patient considering a treatment.
      *   *Specifics:* Patient "Mr. Smith." 55-year-old male. Smoker. Specific genetic marker. Specific comorbidity.
      *   *Why this works:* Clinicians *live* this. "What is the risk for *this* patient?" is the holy grail. It forces the tension between population data (RCTs) and individual features.

  4.  **Structure the 90 Minutes:**
      *   *Intro (10 mins):* Hook them. Establish the "Probability is for Events-under-Descriptions" premise.
      *   *Phase 1: The Problem Emerges (20 mins):* Introduce Mr. Smith. Show conflicting classes.
      *   *Phase 2: The Standard Solutions & Why They Fail (30 mins):* "Condition on Everything" and "Narrowest Class."
      *   *Phase 3: The Bayesian/Frequentist Divide (15 mins):* Address the "It's just a Frequentist problem" myth.
      *   *Conclusion & Assessment (15 mins):* Synthesis and the Diagnostic Question.

  5.  **Address Misconceptions:**
      *   *Frequentist only:* Need to show Bayesian priors depend on reference classes too (prior selection).
      *   *Narrowest class:* Show the "single case" limit (probability becomes 0 or 1).
      *   *Just use data:* Data doesn't select the model/class.
      *   *Induction:* Distinguish RCP (which class?) from Induction (will the future resemble the past?).

  6.  **Develop the Diagnostic Question:**
      *   Needs to prevent recitation. Needs to force application.
      *   *Idea:* Give them a scenario where the "narrowest" class is causally irrelevant, but a broader class is causally relevant. Ask them to justify which probability to use for a decision.
      *   *Refinement:* A decision-theoretic framing. "You must bet. Which probability do you use and why is the other one *wrong* for this purpose, not just less precise?"

  7.  **Decide What to Cut:**
      *   *Option A: Exchangeability.* Crucial for stats, but abstract. If they know measure theory, they know the definition, but the *philosophical justification* is the RCP itself.
      *   *Option B: Risk Prediction/Recidivism.* Very applied. Engaging. But might turn into a sociology lecture.
      *   *Decision:* **Cut Exchangeability (mostly).** Keep it as a footnote. Focus on Risk Prediction because it's the *application* of RCP. Actually, wait. The user asked to cut *one*. Exchangeability is the *technical* solution to RCP in statistics. If I cut it, I remove the bridge to their math. If I cut Recidivism, I keep it clinical.
      *   *Better Decision:* **Cut the formal Exchangeability deep dive.** Mention it as the statistical "handshake" that hides the philosophical problem. Focus on the Clinical/Risk prediction application because that's where the *stakes* are for MSc Epi students. It keeps the session grounded in their domain.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Tone:* Respectful of their math, challenging their ontology. No fluff.
      *   *Case:* "Patient Z" and a new anticoagulant. Risk of bleed.
      *   *Sequence:*
          1.  Setup: Probability isn't a property of the electron/patient, it's a relation.
          2.  Case Round 1: Age/Sex vs. Smoker. Conflicting risks.
          3.  Case Round 2: Add Genetic Marker. Now we have 3 classes.
          4.  The "Condition on All" Trap: Show that conditioning on *everything* leads to a class of size 1 (determinism).
          5.  The Bayesian Trap: Priors come from... where? (Reference classes again).
          6.  The Diagnostic Question.

  9.  **Refining the "Condition on Everything" Argument:**
      *   This is the crux. Students love $P(E | K)$.
      *   Need to show that $K$ (background knowledge) includes the choice of partition.
      *   If $K$ includes *every* property, the class is a singleton. Frequency is 0 or 1. Prediction is impossible.
      *   Therefore, we must *ignore* some data. Which data? Causally relevant data. But causality is harder than probability. (Nice hook for the user's own work).

  10. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   Single case? Yes (Patient Z).
      *   No coins/Sleeping Beauty? Yes.
      *   Misconception map included? Yes.
      *   Diagnostic question included? Yes.
      *   Cut advice included? Yes.

  11. **Self-Correction during drafting:**
      *   *Correction:* Make sure I don't drift into Causal Inference too much. The user is an expert there, but the course is Foundations of Stats. Keep the focus on *Probability*, using Causality only as the reason why some classes are better than others.
      *   *Correction:* Ensure the Bayesian point lands. Bayesians often think they escape RCP. They don't; they just push it to the prior. Need to make that explicit.

  12. **Final Polish:** Check the tone. It should be collegial but firm. "You know the math, now here's why the math doesn't decide the ontology."

  *(Self-Correction on the Diagnostic Question)*: A multiple choice is too easy. An open-ended scenario is better. "Here are two valid probabilities. You must choose one for a policy. Defend the choice without saying 'it's more accurate'."

  *(Self-Correction on the Case)*: Let's make it **Warfarin vs. DOACs**. Bleed risk. Classic epi problem.
  *   Class A: All patients on anticoagulants (Bleed risk 5%).
  *   Class B: Patients > 65 (Bleed risk 10%).
  *   Class C: Patients with CYP2C9 variant (Bleed risk 25%).
  *   Patient is 70 + Variant.
  *   Which probability governs *this* decision?

  Okay, ready to write.
answer: |-
  This is a high-wire act. You are teaching students who are trained to treat probability as a *tool* (a measure on a sigma-algebra) to tell them it is also a *relation* (dependent on description). If you get too metaphysical, they will tune out. If you get too technical, they will think it's just a modeling choice.

  Here is a teaching plan designed for 90 minutes, calibrated for an audience that respects measure theory but dismisses philosophy.

  ### I. The Carrying Case: "The Warfarin Dilemma"
  Do not use insurance (too abstract) or recidivism (too sociological for a stats foundation course). Use **Anticoagulation Therapy**. It is clinical, quantitative, and high-stakes.

  **The Scenario:**
  Patient "Mr. G." is being considered for Warfarin to prevent stroke. The decision depends on the probability of a major hemorrhagic event within one year, $P(H)$.
  *   **Class A (The Trial):** All patients in the pivotal RCT. $P(H|A) = 0.03$.
  *   **Class B (The Demographic):** All males > 75 years old. $P(H|B) = 0.08$.
  *   **Class C (The Genotype):** All patients with *CYP2C9* \*3 allele. $P(H|C) = 0.15$.

  Mr. G is a 78-year-old male with the *CYP2C9* \*3 allele. He belongs to all three classes.

  **Why this case works:**
  1.  **No "Correct" Class:** There is no metaphysical fact about whether Mr. G is "really" a Trial Patient, an Old Man, or a Carrier. He is all three.
  2.  **Divergent Probabilities:** The probabilities are not close. 3% vs 15% changes clinical guidelines.
  3.  **Iterative Complexity:** You can add variables (kidney function, diet, compliance) to make the class narrower until it breaks.
  4.  **Stakes:** If they pick the wrong class, the patient bleeds or strokes. This prevents them from treating it as a semantic game.

  **What the case must NOT have:**
  *   **A Causal Silver Bullet:** Do not make it obvious that the Genotype *causes* the bleed while Age is merely correlated. If causality is obvious, they will solve RCP by saying "Just use the causal class." You want to delay the causal solution to show that *probability itself* is the bottleneck. (You can hint at causality at the end as the exit ramp, but don't let it solve the problem too early).
  *   **Nested Classes:** Avoid making Class C a subset of Class B. Make them overlapping but distinct datasets (e.g., the genetic data comes from a different cohort than the age data). This prevents them from simply saying "use the subset."

  ---

  ### II. The Sequence (90 Minutes)

  #### 0:00–0:10 | Introduction: The Ontological Hook
  *   **Goal:** Dislodge the idea that probability is a property of the *event*.
  *   **Move:** Write $P(E)$ on the board. Cross out the $E$. Write $P(E | K)$.
  *   **Script:** "You all know measure theory. You know probability is a function on a sigma-algebra. But in applied work, you treat $P(E)$ as if it's a physical property of the patient, like their blood pressure. It isn't. It is a relation between an event and a *description* of the world. Today is about what happens when the description is underdetermined."
  *   **Setup:** Introduce Mr. G and the three probabilities (3%, 8%, 15%). Ask for a show of hands: "What is the probability Mr. G bleeds?"
  *   **Expected Outcome:** Confusion. Some will say 15% (most specific). Some will say "we need a model."

  #### 0:10–0:30 | Phase 1: The "Narrowest Class" Heuristic
  *   **Goal:** Elicit and dismantle the "Most Specific Reference Class" solution.
  *   **Activity:** Ask the class why they might prefer Class C (Genotype). They will say "It's more specific."
  *   **The Trap:** Add **Class D**. "All 78-year-old males with *CYP2C9* \*3 allele *who live in postcode SW1*." $P(H|D) = 0.02$ (due to local environmental factors in this hypothetical).
  *   **The Push:** "Why stop at Genotype? Why not Postcode? Why not 'Patients who drink coffee on Tuesdays'?"
  *   **The Limit:** Push them to the logical limit. The narrowest class is the **Singleton Class** (Mr. G himself).
  *   **The Kill:** "In the singleton class, the frequency is 0 or 1. If you always choose the narrowest class, probability disappears. You have determinism or ignorance, but no risk."
  *   **Takeaway:** Specificity is not a free good. It trades bias for variance, but philosophically, it dissolves the concept of probability.

  #### 0:30–0:50 | Phase 2: The "Condition on Everything" Move
  *   **Goal:** Address the Bayesian/Statistical instinct to just condition on all available knowledge $K$.
  *   **The Student Objection:** "Just put all covariates in the regression. $P(H | \text{Age, Gene, Postcode, ...})$."
  *   **The Counter:**
      1.  **Data Sparsity:** As you add dimensions, the reference class becomes empty. You have no data for *that* specific combination.
      2.  **The Selection Problem:** To run the regression, you had to *choose* which covariates to measure. Why did you measure Genotype and not 'Number of Siblings'?
      3.  **The Philosophical Bite:** Conditioning on everything ($K$) assumes $K$ is well-defined. But $K$ is infinite. You must select a *finite partition* of your knowledge to do math. **The Reference Class Problem is the problem of selecting the partition.**
  *   **Visual:** Draw a Venn diagram of "All True Facts about Mr. G." Show that any probability calculation requires drawing a box around *some* facts and ignoring others. The math doesn't tell you where to draw the box.

  #### 0:50–1:05 | Phase 3: The Frequentist vs. Bayesian Misconception
  *   **Goal:** Crush the idea that this is only a Frequentist problem.
  *   **The Misconception:** "Frequentists need reference classes because they need long-run frequencies. Bayesians just use priors."
  *   **The Rebuttal:** "Where does your prior come from?"
      *   If it's subjective: Why is it rational? (If I say 3% and you say 15%, who is right?)
      *   If it's empirical (Empirical Bayes): You are estimating the prior from... a **reference class** of similar parameters.
      *   **Key Point:** Bayesians escape the *frequency* requirement, but they do not escape the *relevance* requirement. You still have to decide which past experiences are relevant to your current degree of belief. That is the RCP.

  #### 1:05–1:20 | Phase 4: The Exit Ramp (Causality & Exchangeability)
  *   **Goal:** Briefly show how modern stats *tries* to solve this, without claiming it's a full solution.
  *   **Exchangeability:** Mention that de Finetti's exchangeability is the mathematical formalization of "belonging to the same reference class." But exchangeability is an assumption, not a fact.
  *   **Causality:** This is your home turf. Hint that the only non-arbitrary way to select a class is **Causal Relevance**. We prefer the Genotype class not because it's narrower, but because the gene *mechanistically influences* metabolism.
  *   **Caveat:** "But causal inference requires its own assumptions. You haven't solved the problem; you've pushed it back one step to 'What is the causal graph?'"

  #### 1:20–1:30 | Conclusion & Diagnostic Assessment
  *   **Summary:** Probability is not "out there." It is a tool for managing ignorance relative to a description.
  *   **The Diagnostic Question:** (See below).

  ---

  ### III. The Misconception Map

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"It's a Frequentist problem."** | Phase 3 (Bayes section). | Ask: "If I'm a Bayesian, what data generates my prior?" Show that priors are often hierarchical estimates from populations (classes). |
  | **"Just use the narrowest class."** | Phase 1 (Mr. G intro). | Push to the Singleton Class. Show that $N=1$ kills probability. Ask: "At what point does 'specific' become 'useless'?" |
  | **"It's just Induction."** | Phase 2 (Conditioning). | Distinguish them. Induction: "Will the future resemble the past?" RCP: "Which *part* of the past resembles this future case?" You can solve induction and still fail RCP. |
  | **"The data selects the class."** | Phase 2 (Regression). | Remind them: Data doesn't speak. The *model specification* speaks. The choice of covariates *is* the choice of reference class. |
  | **"Emergent: It's a Decision Problem."** | **Phase 4.** | **Unexpected.** They may argue: "It doesn't matter what the probability *is*, it matters what minimizes loss." | **Validate this.** This is actually the correct pragmatic dissolve. Acknowledge it: "Yes, often we solve RCP by asking 'What decision is this probability for?' rather than 'What is the truth?'" |

  ---

  ### IV. The Diagnostic Question
  Do not ask them to define the RCP. Do not ask them to list the solutions. Ask them to make a choice where the math is silent.

  **The Question:**
  > "Imagine two epidemiologists, Dr. A and Dr. B, are advising on Mr. G.
  >
  > *   **Dr. A** uses Class C (Genotype). Risk = 15%. She recommends against Warfarin.
  > *   **Dr. B** uses Class A (RCT Trial). Risk = 3%. She recommends Warfarin.
  >
  > Both have used valid data. Both have calculated their frequencies correctly. There is no measurement error.
  >
  > **Question:** You are the hospital administrator. You must endorse one protocol. You cannot say 'gather more data.' You cannot say 'average them.' **On what philosophical grounds do you fire one of the doctors?**"

  **What to look for in answers:**
  *   **Fail:** "Dr. A is right because 15% is more accurate." (Recites the 'narrowest class' heuristic you just debunked).
  *   **Fail:** "Dr. B is right because RCTs are gold standard." (Appeals to authority, ignores the specific mismatch).
  *   **Pass:** "We fire the doctor whose reference class ignores a **causally relevant** feature" (Connects to causality).
  *   **Pass:** "We fire the doctor whose reference class is not **exchangeable** with Mr. G for the purpose of this decision" (Connects to decision theory).
  *   **Pass:** "We cannot fire either based on probability alone; we need a **utility function** to decide which error (bleed vs. stroke) is worse, and choose the class that minimizes expected loss." (The pragmatic dissolve).

  ---

  ### V. What to Cut: Exchangeability vs. Recidivism
  You asked about cutting **Exchangeability** or **Risk Prediction/Recidivism**.

  **Cut the Formal Exchangeability Deep Dive.**
  *   **Why:** Your audience knows measure theory. They know the definition of exchangeability. Spending 15 minutes on the math of de Finetti's theorem will make them feel safe ("Oh, it's just math"). You want them uncomfortable.
  *   **How to handle it:** Mention exchangeability as the *mathematical name* for the reference class assumption. "When you assume exchangeability, you are asserting that the choice of reference class is irrelevant. The RCP shows us why that assertion is philosophical, not mathematical."
  *   **Keep Risk Prediction/Recidivism:** Keep the clinical/actuarial stakes. This is where they feel the pain. If you make it abstract, they will dismiss it. If you keep it on "Patient G," they cannot ignore it.

  ### VI. Pedagogical "Tourist" Advice
  Since you are a "tourist" in formal epistemology:
  1.  **Don't fake expertise in Formal Epistemology:** If they ask about Lewis's Principal Principle or Carnap's logical probability, admit it's outside your lane. Pivot back to Causal Inference. "That's the formal epistemology answer; my interest is how this breaks causal identification."
  2.  **Leverage your Causal Inference Expertise:** When they get stuck on "Which class?", nudge them toward "Which features change the outcome if intervened upon?" This validates your own research agenda while solving their philosophical headache.
  3.  **Respect the Math:** Never imply the math is *wrong*. The math is perfect. The *application* of the math to the world is where the RCP lives. "The map is not the territory" is the vibe.

  ### VII. Room Setup
  *   **Board Work:** Keep the three probabilities ($0.03, 0.08, 0.15$) on the board the entire time. Do not erase them. They are the anchor.
  *   **Handout:** One page. Mr. G's profile. The three data sources. The Diagnostic Question at the bottom. No reading during the lecture.

  This plan respects their technical competence while forcing them to confront the ontological gaps in their practice. It uses your expertise (causality) as the resolution, rather than getting bogged down in pure epistemology.
