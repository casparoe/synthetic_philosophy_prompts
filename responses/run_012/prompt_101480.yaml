      *   *The Verdict:* The film argues that the narrative self isn't just an abstraction; it's a *commitment to action*. If the narrative is corrupt, the actions are monstrous.
      *   *Agency:* Dennett says the self is the character. But Leonard is a character being written by a vengeful ghost (his past self). This suggests the "Center of Gravity" can be anchored by trauma, not just utility.

