      *   *Leonard's Condition:* Anterograde amnesia. No short-term memory.
      *   *The Fit:* Leonard *needs* the narrative more than anyone. He literally constructs a "Center of Narrative Gravity" using tattoos and notes. He *is* the story he tells himself.
      *   *The Break:* Dennett usually implies the narrative is a *functional* tool for coherence. Leonard's narrative is *dysfunctional* and *deceptive*. He lies to himself. Dennett's self is often presented as a benign abstraction. Leonard's is a weaponized delusion.
      *   *Authorship:* Leonard is the character, but his past self (pre-injury) and others (Teddy/Natalie) are the authors. This complicates "character not author." It suggests the "Center of Gravity" can be hijacked.

  3.  **Deconstruct Strawson & *Memento*:**
      *   *Strawson's View:* Diachronics see themselves as persisting entities. Episodics don't. Neither is better.
      *   *Leonard's Condition:* Biologically/psychologically forced into Episodic living (no memory continuity).
      *   *The Twist:* Leonard *refuses* to be Episodic. He forces a Diachronic narrative onto an Episodic existence.
      *   *Implication:* This challenges Strawson's idea that Episodic is a natural, stable mode. For Leonard, being purely Episodic is terrifying/meaningless. He *needs* the Diachronic illusion to function.
      *   *Memory vs. Narrative:* The film suggests narrative can *substitute* for memory. This favors Dennett (narrative is primary) over a strict Lockean view (memory constitutes identity), but complicates Strawson (who thinks Episodic is valid).

  4.  **Synthesize: Where the Film Resists Both:**
      *   *The Ethical Trap:* Dennett treats the narrative self as a neutral/functional posit. Strawson treats it as a preference. *Memento* treats it as a *moral hazard*.
