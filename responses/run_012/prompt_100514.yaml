prompt: |-
  I could use a hand with something and I'd rather it be genuinely thought through than vibe-checked, so please take your time with it. Background on me: I'm a backend engineer at a mid-size consumer app company, six years in, zero formal philosophy training (one intro course in undergrad that I definately coasted through). I sit on our Responsible Product Review Board, which is a fancy name for five people who meet every other Thursday and sign off, or don't, on features that might mess with users. We've got a rule that has served us okay and that I've lately started to hate: a feature gets approved if its incremental effect on user wellbeing is neutral-or-better, i.e. we only ask whether this one change, on its own, makes anyone's experience meaningfully worse. Under that rule we've waved through maybe nine small things over two years. Each one, honestly, was defensible in isolation: one more streak reminder here, a variable-reward "surprise bonus" there, a slightly pushier notification default, a comparison nudge we softened but still shipped. None of them by itself would make me say the app got worse. Then my sister used it last month and said it felt like it was engineered to make her feel bad, and when I actually looked at the nine things stacked together I couldn't really disagree, and now I can't unsee it. So this week's case is a specific pending feature, a daily "momentum" score that decays if you skip a day, and the engineer who owns it is, fairly, pointing out that by our written rule it passes: the marginal effect is tiny, some users say they like it, and rejecting it means punishing her for eight features she had nothing to do with. Another board member says that's exactly the point, our rule is broken because it can't see patterns, while I keep worrying that "the pattern" is just an aesthetic judgement and that if we start vetoing individually-fine changes because the pile feels icky, we've swapped a rule for my sister's gut. I think the actual knot is this: if each change is not-worse than the one before it, and "not-worse" behaves the way we normally assume comparisons behave, the whole pile shouldn't be worse than where we started. But it clearly is worse. So something has to give, and I don't know what: our per-step judgements, the aggregate judgement, or the assumption itself. That's the part I want you to actually chew on rather than hand-wave.

  Please act like a philosopher who works on value theory and practical decision-making (and, if it helps, someone who has thought hard about how "better than" behaves across long chains of small steps, though I don't want a reading list or citations, I can't check them and neither can you, I want you to reason it out from scratch). Start by brainstorming out loud in a few short numbered steps: lay out the different ways someone could resolve the tension above, including the boring option where we keep the pairwise rule and tell my sister she's just wrong. I want to see the option space before you commit to anything. Then draft the memo I'll circulate before Thursday: it's from the Review Board to the product team, it should land on a concrete recommendation about the momentum-score feature (ship it, kill it, or ship with specific conditions and a date by which we'll re-check), and it should give the product team reasons they can actually argue with. Don't just assert that aggregates matter; if you're changing the rule, say what the new rule is and how we'd apply it to the next feature, and be honest about the strongest thing on the losing side, because the engineer's objection that we'd be retroactively punishing her is real and I don't want it waved away. Whatever you conclude, also tell me plainly what's being sacrificed, since some intuition has to go and I want to know which one you're dropping and why that one instead of the others.

  Keep the memo under about 700 words, plain language, no jargon. At the very end, after the memo, put one final line in exactly this format so I can log it: \answer{SHIP}, \answer{DO-NOT-SHIP}, or \answer{SHIP-WITH-CONDITIONS}, whichever matches your recommendation, and nothing after it.
