answer: |-
  1. **Strict Incrementalism (Status Quo):** We keep the rule. We tell your sister her feeling is anecdotal and not data. *Pros:* Clear, fair to engineers, easy to audit. *Cons:* Ignores emergent harm, risks long-term trust.
  2. **Holistic Veto:** We reject the feature because the total package is now toxic. *Pros:* Protects users immediately. *Cons:* Unfair to the current engineer (retroactive punishment), relies on vague "vibe" judgments.
  3. **Non-Transitive Value:** We admit that "not worse than" doesn't chain forever. Ten tiny cuts do bleed you out. *Pros:* Philosophically honest about accumulation. *Cons:* Hard to operationalize without a specific cap or metric.
  4. **Wellbeing Budget:** We treat user pressure like performance load. There is a cap. New features must offset old ones. *Pros:* Solves accumulation and fairness (trade-off vs. veto). *Cons:* Requires auditing legacy features, harder to manage.

  ***

  **To:** Product Team
  **From:** Responsible Product Review Board
  **Subject:** Decision on Momentum Score & Policy Update

  **Decision:** The Momentum Score feature is approved **with conditions**.

  **The Condition:** To ship this feature, we must retire one existing engagement nudge (e.g., the streak reminder or the variable-reward bonus) within the same release cycle.

  **The Reasoning:**
  Our current rule asks: "Does this single change make things worse?" Nine features have passed this test. Individually, they were defensible. Collectively, they have shifted the app's tone from supportive to demanding. Our users are not experiencing these features in isolation; they are experiencing the sum of them. When we add a tenth nudge to a stack of nine, the marginal cost to the user is higher than the first nudge was. Fatigue compounds.

  **The New Rule:**
  Effective immediately, we are moving from "Incremental Review" to a **"Wellbeing Budget."**
  1.  **Cap:** We acknowledge there is a limit to how much pressure we can place on users before the experience degrades.
  2.  **Trade-off:** New features that add cognitive load or pressure must offset that load by removing an existing feature of similar weight.
  3.  **Application:** For the next feature review, you must identify what existing friction or nudge will be removed to make room for it.

  **Fairness & Accountability:**
  We hear the concern that rejecting this feature punishes the current engineer for past decisions. That is a valid objection. A flat veto would be unfair. That is why we are choosing a **trade-off** instead of a rejection. You are not being punished for the past nine features; we are acknowledging the system is at capacity. By swapping an old nudge for this new one, you get to ship your work, but the total burden on the user remains stable. This places the responsibility on the product team to decide which old feature is less valuable, rather than simply blocking new work.

  **Next Steps:**
  Please propose which existing nudge will be retired to accommodate the Momentum Score by next Thursday. We will review that swap to ensure the net effect is truly neutral.

  ***

  **What's Being Sacrificed:**
  We are dropping the intuition that "not worse than" is **transitive**. In math, if A ≤ B and B ≤ C, then A ≤ C. In user wellbeing, this fails. Ten "neutral" changes can create a negative experience. We are sacrificing the simplicity of pairwise comparison for the accuracy of holistic assessment. We choose this because ignoring accumulation protects our process but harms our users, whereas budgeting protects users while keeping the process fair to engineers.

  \answer{SHIP-WITH-CONDITIONS}
