answer: |-
  You have identified one of the most potent and recurrent engines in both metaphysics and the philosophy of physics. To answer your primary question directly: **No, there is no single, universally agreed-upon name for this argumentative form across all disciplines.** However, it is not nameless. It appears under a cluster of specific titles depending on the context, the most precise of which is **"Leibniz Equivalence"** (in the philosophy of physics) and the **"Symmetry-to-Reality Inference"** (in contemporary methodology). Metaphysically, it is the operational application of the **Principle of the Identity of Indiscernibles (PII)**.

  If a unifying label were to be coined to capture the *form* itself, independent of its historical baggage, it would be **"The Argument from Descriptive Redundancy."**

  Below is the carving you requested. I will define the form, map its relations to the principles you mentioned, evaluate your specific instances, and mark the boundaries where the inference is sound versus where it is merely seductive.

  ---

  ### 1. The Name and The Form

  #### The Established Labels
  1.  **Leibniz Equivalence:** Coined by John Earman and John Norton (1987) in the context of the Hole Argument. It states: *If two models of a theory differ only by a symmetry transformation (e.g., a diffeomorphism), they represent the same physical state of affairs.* This is the technical term for the premise in physics.
  2.  **The Symmetry-to-Reality Inference:** Popularized by David Baker (2010). This names the *inference* itself: the move from "the formalism is symmetric under transformation $X$" to "reality does not contain structure $X$."
  3.  **The Principle of the Identity of Indiscernibles (PII):** The metaphysical ancestor. Leibniz's claim that if $x$ and $y$ share all properties, $x = y$. Your argument is a methodological generalization of PII: if *theory* $T_1$ and *theory* $T_2$ share all empirical consequences, they describe the same *reality*.

  #### The Logical Form
  To isolate the "carving," we can formalize the argument as follows:

  *   **Premise 1 (Formal Symmetry):** A theory $T$ admits a transformation $\phi$ that maps a model $M$ to a distinct model $M'$.
  *   **Premise 2 (Observational Invariance):** $M$ and $M'$ yield identical values for all observable quantities (or all quantities deemed physically significant by $T$).
  *   **Premise 3 (Ontological Parsimony / Anti-Haecceitism):** Differences in representation that do not correspond to differences in observable/physical consequences are not differences in reality. (This is the "Leibniz Equivalence" claim).
  *   **Conclusion:** The features distinguishing $M$ from $M'$ are ontologically redundant (gauge); the purported distinction/entity is not real.

  ---

  ### 2. Relations to Other Principles

  You asked how this form stands to several specific philosophical principles. This is where the "carving" becomes sharp.

  #### The Principle of Sufficient Reason (PSR)
  *   **Relation:** The Argument from Descriptive Redundancy is the **operational child of the PSR**.
  *   **Distinction:** The PSR says "Nothing happens without a reason." The Argument says "Nothing *exists* without a discernible difference."
  *   **Dependency:** The argument relies on a specific version of the PSR: *If there were a real difference between $M$ and $M'$, there would be a sufficient reason (in the theory or the world) to distinguish them.* Since there is no such reason (by Premise 2), there is no real difference. If one rejects the PSR (e.g., allowing brute facts), the argument loses its force.

  #### Verificationism
  *   **Relation:** They are cousins, but not twins.
  *   **Distinction:** Verificationism is semantic/epistemic: "If you cannot verify it, the statement is meaningless." The Argument from Descriptive Redundancy is ontological: "If the theory does not track it, the *thing* does not exist."
  *   **Crucial Divergence:** A verificationist might say, "We cannot know if the universe shifted." The proponent of this argument says, "There is *no fact of the matter* regarding the shift." The latter is a stronger, metaphysical claim, not merely an epistemic limitation.

  #### Haecceitism (This-ness)
  *   **Relation:** The argument is explicitly **Anti-Haecceitistic**.
  *   **Definition:** Haecceitism is the view that an object can have a primitive identity ("this-ness") distinct from its qualitative properties.
  *   **The Conflict:** Your argument assumes that if qualitative/structural descriptions are identical, the objects are identical. A haecceitist would reply to the Two Spheres case: "They are two because Sphere A is *this* one and Sphere B is *that* one, even if they share all properties."
  *   **Status:** Accepting your argument form entails rejecting haecceitism.

  #### No-Difference Principles in Physics
  *   **Relation:** This argument *is* the primary No-Difference Principle.
  *   **Examples:** In General Relativity, this is "Diffeomorphism Invariance." In Gauge Theory, this is "Gauge Freedom."
  *   **Nuance:** Physics distinguishes between *global* symmetries (which often yield conservation laws and imply real structure) and *local* symmetries (which often imply redundancy). Your argument form applies most strongly to **local symmetries** or **global symmetries applied to the whole universe** (like the Shift).

  ---

  ### 3. Analysis of Your Instances

  Here is the evaluation of which instances fall inside the form and which are boundary cases.

  #### 1. The Shift Argument (Newtonian Space)
  *   **Verdict:** **Paradigm Instance.**
  *   **Analysis:** This is the classic Leibniz-Clarke correspondence. If the entire material universe is moved 5 feet to the left in absolute space, and all relations remain identical, Leibniz argues there is no difference.
  *   **Why it fits:** It relies entirely on the invariance of the description under translation. It concludes absolute space is not real (relationalism).

  #### 2. The Hole Argument (General Relativity)
  *   **Verdict:** **Paradigm Instance.**
  *   **Analysis:** Earman and Norton used this to argue against "Manifold Substantivalism." If you drag the metric field over the manifold points within a "hole," the equations hold, but the points are reassigned.
  *   **Why it fits:** It uses descriptive redundancy (diffeomorphism invariance) to conclude that manifold points lack independent reality.

  #### 3. Quantum Indistinguishability
  *   **Verdict:** **Strong Instance (with caveats).**
  *   **Analysis:** Swapping two electrons yields the same physical state (up to a phase factor).
  *   **Why it fits:** The formalism treats permutation as identity.
  *   **Caveat:** Some interpretations (Bohmian Mechanics) posit hidden trajectories that *do* distinguish the particles, rejecting Premise 3. Thus, the argument is sound *within standard QM*, but not necessarily in all interpretations.

  #### 4. Black's Two Spheres
  *   **Verdict:** **Contested Instance.**
  *   **Analysis:** Max Black's counterexample to PII. Two identical spheres in an empty universe.
  *   **Why it is boundary:** Your argument form suggests they are "one object" or that "twoness" is unreal. However, most metaphysicians accept they are two based on *spatial location* (being 1 mile apart is a relational property that distinguishes them).
  *   **Correction:** The argument works only if you claim their *locations* are also indiscernible (e.g., if space is relational and they are the only things, "1 mile apart" is a relation, but "which is which" is not). If the argument concludes "there is no fact of the matter which sphere is which," it fits. If it concludes "there is only one sphere," it overreaches.

  #### 5. The Rotating Homogeneous Sphere
  *   **Verdict:** **Boundary Case / Category Error.**
  *   **Analysis:** You describe a featureless sphere rotating about its center.
  *   **Why it is problematic:** If the sphere is truly featureless and space is isotropic, a rotation *is* the identity transformation. It is not a "change" that yields an "indistinguishable configuration"; it is the *same* configuration described differently.
  *   **The Carving:** This instance reveals a limit of the form. The argument requires two *distinct mathematical models* ($M$ and $M'$) that map to one reality. In the case of the rotating sphere, if there are no markers, $M$ and $M'$ are mathematically identical (the identity map). The argument gains traction only if you introduce time (a process) and ask if the *history* is different. (See Newton's Bucket: if water climbs the sides, rotation is real relative to space/inertia). If the sphere is truly alone and static, the "rotation" is a fiction of the coordinate system, making this a trivial instance of gauge redundancy rather than a deep ontological puzzle.

  ---

  ### 4. The Modest vs. Immodest Conclusion

  You noted a fluctuation between modest and immodest conclusions. This is the critical fault line in the argument's validity.

  *   **The Modest Claim (Semantic):** "Our theory $T$ does not represent this distinction; therefore, $T$ is not about this distinction."
      *   *Validity:* **Sound.** This is a claim about the scope of the theory.
  *   **The Immodest Claim (Ontological):** "Our theory $T$ does not represent this distinction; therefore, the distinction does not exist in reality."
      *   *Validity:* **Risky.** This assumes $T$ is complete or fundamental.
      *   *Failure Mode:* **Hidden Variables.** In Bohmian mechanics, particles have definite positions even if the wavefunction (the standard description) is symmetric. The "redundancy" is in the observable layer, not the ontological layer.
      *   *Failure Mode:* **Spontaneous Symmetry Breaking.** The laws may be symmetric, but the *state* is not. (e.g., a ferromagnet). The argument might incorrectly conclude the direction of magnetization is "unreal" because the laws don't prefer it, when in fact the specific direction is a real fact of the specific state.

  ### 5. Where the Inference is Sound vs. Seductive

  To answer your final demand ("what is really being claimed... and where the inference is sound"):

  **The Inference is Sound When:**
  1.  **The Symmetry is Local (Gauge):** In electromagnetism, the potential $A_\mu$ can be shifted by a gradient without changing the fields $E$ and $B$. Here, the potential's specific value is widely accepted as "not real" (gauge dependent).
  2.  **The Theory is Fundamental:** If you have good reason to believe $T$ is the final vocabulary of nature, then descriptive redundancy implies ontological redundancy.
  3.  **The Alternative is Haecceitistic:** If the only way to save the distinction is to posit "primitive this-ness" without qualitative grounding, the argument is strong (assuming one rejects haecceitism).

  **The Inference is Seductive (and potentially unsound) When:**
  1.  **Dualities are involved:** In String Theory (AdS/CFT), two mathematically distinct theories describe the same physics. Does this mean *both* ontologies are false? Or that reality is "indifferent"? The argument struggles here.
  2.  **Epistemic Access is Limited:** Just because *we* cannot distinguish two states (Verificationism) does not mean nature does not distinguish them. (e.g., Inside a Black Hole).
  3.  **Structure vs. Object:** As you noted, the argument sometimes kills objects but saves structure (Structural Realism). If you use it to kill *structure* as well, you risk nihilism.

  ### Summary Recommendation

  If you are assembling a family of arguments, I recommend labeling this form **"The Argument from Descriptive Redundancy"** (or **"The Redundancy Argument"**).

  *   **Definition:** An inference from the invariance of a theory's empirical predictions under a transformation of its formal elements to the ontological unreality of the features altered by that transformation.
  *   **Core Premise:** Leibniz Equivalence (variant models = same state).
  *   **Philosophical Cost:** Requires rejection of Haecceitism and a strong version of the Principle of Sufficient Reason.
  *   **Danger Zone:** Confusing the incompleteness of a theory with the indeterminacy of the world.

  This form is the primary tool for **ontological parsimony in modern physics**. It is sound when applied to gauge freedoms, but requires caution when applied to the fundamental ontology of space, time, or particles, where "indiscernibility" might reflect our theoretical limits rather than nature's structure.
