answer: |-
  You are describing **Nomic**, a game invented by philosopher Peter Suber in 1982 specifically to explore the paradoxes of self-amendment and legal systems. Your intuitions are wrestling with problems that legal philosophers (like H.L.A. Hart and Hans Kelsen) have debated for a century.

  There is a principle that reconciles almost all of your verdicts. It is the principle of **Derivative Authority** (sometimes called the "Chain of Validity").

  ### The Principle: Derivative Authority
  A rule change is valid if and only if:
  1.  It is enacted using the procedure **currently recognized as authoritative** at the time of enactment.
  2.  It does not destroy the system's ability to distinguish between valid and invalid moves in the future.

  This principle relies on the idea that no rule is valid because it *says* it is valid; it is valid because it was *born* from a higher authority (the current rules).

  Here is how this principle adjudicates your specific cases:

  1.  **Raise win score:** **Valid.** Uses current procedure; doesn't break the system.
  2.  **Lower voting threshold:** **Valid.** Uses current procedure to change future procedure. This is the essence of the game.
  3.  **Proposer decides alone (Dictatorship):** **Valid.** It uses the current democratic procedure to vote democracy out of existence. It feels like a coup because it ends the *spirit* of the game, but logically it is a legal transition of power. The game continues, it's just a different game now.
  4.  **Self-passing rule (Passed regardless of vote):** **Invalid.** This commits a **performative contradiction**. It claims the authority of law while explicitly denying the source of that authority (the vote). It tries to be its own *Grundnorm* (basic norm), which is impossible within the system.
  5.  **Remove voting requirement (No procedure):** **Game Over.** This violates condition #2. If there is no procedure to distinguish valid moves from invalid ones, the "Rule of Recognition" collapses. The game doesn't continue; it dissolves into chaos or ends.
  6.  **Immutable amendment procedure:** **Valid (but unenforceable).** You can pass a rule saying "This rule cannot be changed." However, a future majority can simply vote to change it anyway. You can bind the *rules*, but you cannot bind the *sovereign power* of the players to change the rules. It's a paradox, but the enactment is valid.

  ### The Sacrifice: The Retroactive Case
  You guessed that you might have to give up your intuition on the **retroactive case** (validating a failed proposal from last week). **You are correct.**

  Here is why your intuition on #5 is inconsistent with your hatred of #4, based on the principle of Derivative Authority.

  **The "Two-Step Coup" Problem**
  *   **Rule #4** says: "The vote doesn't matter for *this* rule." (Immediate bypass of authority).
  *   **Rule #5** says: "The vote didn't matter for *that* rule." (Delayed bypass of authority).

  If you allow #5, you have created a loophole that makes #4 possible in two steps.
  1.  I propose a rule I know will fail.
  2.  It fails.
  3.  I propose a retroactive rule declaring it passed.
  4.  It passes.

  If #5 is valid, then the voting threshold is effectively optional for anyone patient enough to wait a turn. This severs the link between the *procedure* and the *outcome* just as effectively as #4 does. It allows the current authority to rewrite history in a way that negates the constraints of the past authority.

  To maintain the integrity of **Derivative Authority**, you must treat the *outcome* of a procedure as fixed once the procedure concludes. You can change the rules for *future* votes, and you can change the *text* of old rules, but you cannot change the *validity status* of a completed procedural event without undermining the procedure itself.

  ### Summary
  *   **The Principle:** Validity is derived from the current procedure, not the content of the rule.
  *   **The Verdict:** You must give up the idea that **retroactively validating a failed proposal is fine.**
  *   **The Reason:** It is functionally identical to the "self-passing" cheat you hated, just delayed by one turn. It breaks the chain of causality that gives the rules their authority.

  If you enforce this, your gut calls will align: anything that uses the current rules to change the future is fair game; anything that tries to negate the current rules' authority over itself (either instantly or retroactively) is a system crash.
