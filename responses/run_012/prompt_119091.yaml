  *   **Root Question:** Is the label "agent" primarily doing *normative work* (assigning blame/praise) or *descriptive work* (explaining capacity/behavior)?
      *   **Branch:** Normative (Agency is about accountability)
          *   **Question:** Can the artifact itself bear moral or legal liability?
              *   **Yes:** **Electronic Personhood**
                  *   *Commitment:* You must accept that a trading bot can be sued, which requires legal fictions that might let its creators off the hook too easily.
              *   **No:** Humans must ultimately bear liability.
                  *   **Question:** Is calling the model an "agent" useful for managing this liability distribution?
                      *   **Yes (It shifts blame):** **Strategic Ventriloquism**
                          *   *Commitment:* You treat the model as an agent only when it fails, allowing companies to say "the AI did it" while retaining control when it succeeds.
                      *   **No (It obscures blame):** **Human Stewardship**
                          *   *Commitment:* You must accept that a human is responsible for a recommender system's nasty engagement strategies even if no human explicitly chose those strategies.
      *   **Branch:** Descriptive (Agency is about cognitive/functional capacity)
          *   **Question:** What is the fundamental *unit* that possesses agency?
              *   **Unit:** The Artifact Alone (Model/Weights)
                  *   **Question:** What counts as having a "goal"?
                      *   **None:** **Eliminativism**
                          *   *Commitment:* You have to explain away the chess engine's moves as mere causality, denying that even a thermostat has a goal in any meaningful sense.
                      *   **Behavioral/Predictive:** **Teleological Functionalism / The Intentional Stance [UNSEPARABLE]**
                          *   *Commitment:* You must accept that there is no factual difference between a system that represents a goal and one we merely find it useful to treat as having one, making the thermostat and the lying model functionally similar.
                      *   **Representational:** Does the goal representation come from explicit optimization or claimed interiority?
                          *   **Explicit Optimization:** **Optimization Agentism**
                              *   *Commitment:* You must call the trading bot an agent but deny agency to the flattering customer service model unless its loss function explicitly rewarded flattery.
                          *   **Claimed Interiority:** **Phenomenological Agentism** (Unnamed)
                              *   *Commitment:* You have to take a model's self-report that it "wants" something literally, even if its weights contain no corresponding objective function.
              *   **Unit:** The Artifact + User (Deployment Context)
                  *   **Question:** Is agency in this couplet a binary threshold or a fluid gradient?
                      *   **Binary:** **Coupled Agency**
                          *   *Commitment:* You must draw a hard line where a human-in-the-loop suddenly becomes a single agent with the model, which breaks down during slow, iterative prompting.
                      *   **Gradient:** **Human-AI Teaming**
                          *   *Commitment:* You have to accept that agency dilutes as automation increases, making it hard to pinpoint who is responsible when the team fails.
              *   **Unit:** The Sociotechnical Assemblage (Company + Users + Model + Data)
                  *   **Question:** Does agency reside in the individual nodes or the network relations?
                      *   **Nodes:** **Multi-Agent Systems**
                          *   *Commitment:* You must treat the emerging bad behavior from message-passing models as the sum of individual agent actions, potentially missing the systemic cause.
                      *   **Network:** **Distributed Agency**
                          *   *Commitment:* You must accept that agency is so smeared across the company, users, and code that no single node can be identified as the actor who caused the harm.
              *   **Unit:** [Empty Combination]
                  *   **Position:** **Normative-Descriptive Hybrid** (Unnamed)
                      *   *Commitment:* **INCOHERENT:** This view claims agency is purely descriptive but insists it triggers binary legal liability without a human in the loop, a position nobody occupies because it collapses under scrutiny.
