answer: |-
  This is a rational anxiety, not a weird one. It's the "Foundational Crisis" of the 1920s resurfacing in a modern context. However, your colleague's joke relies on a category error: it assumes math is a single monolithic block (ZFC) that, if cracked, destroys everything. In reality, math is a layered dependency graph.

  Here is your prioritized agenda. I have reordered your list, merged redundant items, and inserted the one missing question that makes the rest intelligible.

  ### 1. The Missing Upstream Question: Relative Consistency Strength
  **The Question:** *What are the relative consistency strengths of the logical systems underlying my tools?*

  *   **Why it's upstream:** You cannot ask "Is System X consistent?" in isolation. Gödel's Second Incompleteness Theorem proves that if a system is strong enough to do arithmetic, it cannot prove its own consistency. The only meaningful question is: "If System A is consistent, is System B consistent?" This creates a hierarchy (e.g., Peano Arithmetic < ZFC < ZFC + Large Cardinals). You cannot evaluate the risk of a collapse without knowing where your tools sit on this ladder.
  *   **Tractability:** Medium. It requires grasping the concept of *models* and *interpretations* (showing that if one system has a model, another does too). For a programmer, think of it as compiling one language down to another: if the target language is safe, the source is safe.
  *   **Move it up if:** You want to understand *why* mathematicians aren't panicking.
  *   **Move it down if:** You only care about practical software bugs (see Item 3).
  *   **Note on Detectability:** You asked about the length of a contradiction proof. This is downstream of this item. If a contradiction exists in ZFC, it likely requires axioms (like Large Cardinals) that are far above the math used in verification. The "length" doesn't matter as much as the *axiomatic depth*.

  ### 2. The Merged Question: Axiomatic Dependency (Reverse Mathematics)
  **The Question:** *Which specific axioms in my proof assistant's foundation are required for the theorems I verify?*

  *   **Why it's here:** This merges your "Damage Control" and "Weakening Axioms" points. They are two sides of the same coin called **Reverse Mathematics**. If ZFC is inconsistent, does `nat.add_comm` vanish? No, because it lives in Peano Arithmetic (PA), which is much weaker and safer than ZFC. If the Axiom of Choice is inconsistent, does your verified compiler break? Probably not, unless you explicitly used non-constructive existence proofs.
  *   **Tractability:** High for a programmer. In Lean, you can often trace which axioms a proof uses (e.g., `print_axioms`). Your job is to map the dependency graph of your specific project against the Consistency Hierarchy from Item 1.
  *   **Move it up if:** You want to write the blog post. "Most verified software doesn't need the risky axioms" is a compelling headline.
  *   **Move it down if:** You discover your team is doing high-level set theory or category theory that relies on Universes/Large Cardinals.

  ### 3. The Real Risk: Kernel Soundness
  **The Question:** *Is the proof checker kernel sound, independent of the axioms?*

  *   **Why it's here:** This addresses your "Impact on proof assistants" point. Even if the *math* (CIC/ZFC) is consistent, the *software* (Lean's C++ kernel) might be buggy. A bug in the kernel allows a false proof to be accepted regardless of foundational consistency. This is a much higher probability risk than ZFC collapsing.
  *   **Tractability:** Very High. This is a code review task. Look for the "trusted computing base" (TCB) of your assistant. Lean 4, for example, has a small kernel; most code is untrusted elaborators.
  *   **Move it up if:** You are responsible for security-critical verification.
  *   **Move it down if:** You trust the open-source community's audit of the kernel (which is currently quite robust).

  ### 4. The Nuclear Option: Paraconsistent Logic
  **The Question:** *Can paraconsistent logic preserve enough inference to be useful if explosion occurs?*

  *   **Why it's here:** This addresses your "Paraconsistent people" point. Paraconsistent logic rejects the principle of explosion ($\bot \vdash \phi$). It allows contradictions to exist without the system becoming trivial.
  *   **Tractability:** Low. This is heavy, non-standard logic. It requires relearning how inference works. It is currently more of a philosophical safety net than a practical tool for verification.
  *   **Move it up if:** Item 1 confirms a contradiction in the lower levels of the hierarchy (extremely unlikely).
  *   **Move it down if:** You want to stay within standard industry practices (which assume classical logic).

  ### 5. The Comfort: Empirical Induction
  **The Question:** *Does long-term usage without contradiction constitute evidence?*

  *   **Why it's last:** This addresses your "Empirical case" point. It is not a technical answer; it is a sociological one. "We've used ZFC for 100 years" is strong Bayesian evidence, but it is not a proof.
  *   **Tractability:** High. It requires no math, just history.
  *   **Move it up if:** You need to sleep at night.
  *   **Move it down if:** You need technical certainty (which, per Gödel, is impossible).

  ### Summary of Redundancies
  *   **"Damage Control" + "Weakening Axioms":** These are **Reverse Mathematics**. You weaken axioms to see how much damage is controlled.
  *   **"Detectability":** This is largely moot due to **Gödel**. We don't look for the contradiction; we look for the *strength* required to prove it.
  *   **"ZFC vs. Proof Assistant":** Lean uses the **Calculus of Inductive Constructions (CIC)**, not ZFC. They are equiconsistent roughly, but distinct. A ZFC contradiction doesn't automatically break CIC without a translation layer.

  ### Missing Critical Context
  The most important thing you might be missing is that **Lean does not use ZFC**. It uses Type Theory (CIC). While they are roughly comparable in strength, they are not the same system. A contradiction in ZFC does not immediately imply a contradiction in CIC unless you can formalize ZFC inside CIC and derive the contradiction there. This separation provides a buffer.

  \answer{What is the consistency strength hierarchy of the logical systems underlying my tools?}
