prompt: |-
  In spring 2020, when hospitals ran out of vents and ICU beds, they rolled out triage protocols, and most of them basically said save as many lives as you can — some with a scoring system, a few with lotteries to break ties. I want that episode read through Taurek's argument that numbers don't count: that when you can save one person or save five, you're not required to save the five, you can just flip a coin, because each person's claim on you is the same and you dont get to add them up. So do the mapping properly — who's the rescuer here, what are the actual options, and what does Taurek say the doctor at the bedside should do? Then run it the other way: the protocols overwhelmingly did count the numbers, so does that refute him or just show he was talking about a lone rescuer rather than an institution allocating a scarce thing? And tell me what the middle position does to him — the weighted lottery, where the five get a proportionally bigger chance but nobody's guaranteed to be saved. Is that a cop-out, or is it where his argument actually breaks down? Say plainly where Taurek is silent and whether the case ends up as evidence for him or against him.
