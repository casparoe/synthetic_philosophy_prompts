  This joke exploits Smith's definition of sympathy as imagining oneself in another's situation rather than sharing their actual feeling, making moral approval dependent on the spectator's imaginative capacity. It also hinges on the distinction between wanting to be praiseworthy and the spectator's inability to condone what they cannot conceive, regardless of the agent's actual suffering.
