          *   **The Competence Issue:** This is the biggest gap. The prompt specifically asks if authority *survives* competence. The student dismisses competence as a "red herring." In bioethics, current competence is usually the trump card for *current* medical decisions. A Ulysses contract in psychiatry is highly controversial precisely because current competence usually allows revocation. The student assumes the directive holds *despite* current competence without arguing *why* current competence doesn't invalidate it (beyond saying the directive was designed to refuse this). They haven't engaged with the idea that a competent person generally has the right to change their mind.
