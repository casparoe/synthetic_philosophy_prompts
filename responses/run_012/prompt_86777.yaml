answer: |-
  ### Specification for the Indicative/Counterfactual Distinction

  The following is a specification of desiderata for any theory claiming to adequately model the distinction between indicative and counterfactual conditionals. The requirements are derived from the five fixed points provided. Each requirement is marked as either **[Non-negotiable]** (empirical coverage or logical consistency required for any adequate theory) or **[Camp Preference]** (a theoretical commitment prioritized by specific schools of thought but not strictly demanded by the raw data).

  #### 1. The Truth-Value Divergence Constraint
  **Case:** Pairs of conditionals sharing antecedent and consequent (e.g., "If Oswald didn't shoot Kennedy..." vs. "If Oswald hadn't shot Kennedy...") are judged by competent speakers to differ in truth value or assertibility. In some contexts, accepting one mandates rejecting the other.
  **Requirement:** The theory must explain how two conditionals with identical propositional constituents can sustain different semantic or pragmatic evaluations. It must specify whether this divergence arises from distinct truth conditions, distinct contexts of evaluation, or distinct norms of assertion.
  **Status:** **[Non-negotiable]**

  #### 2. The Morphological Neutrality Constraint
  **Case:** The Karst language utilizes a single conditional particle with an optional "settledness" clitic, lacking the dedicated mood morphology found in English.
  **Requirement:** The theory must not define the indicative/counterfactual distinction solely by reference to English-style subjunctive/indicative morphology. The semantic or pragmatic distinction must be statable in terms accessible to a language that marks only settledness and tense.
  **Status:** **[Non-negotiable]**

  #### 3. The Learnability Constraint
  **Case:** A learner of Karst must acquire the conditional semantics from input containing only the bare particle and the settledness clitic, without access to a hidden mood parameter.
  **Requirement:** The theory must not posit semantic primitives or hidden parameters for the counterfactual distinction that are unrecoverable from the Karst data set. If the distinction is semantic, the input must support its acquisition; if pragmatic, the theory must explain how the pragmatic inference is triggered without mood cues.
  **Status:** **[Non-negotiable]**

  #### 4. The Uncertainty Coverage Constraint
  **Case:** Both languages apply conditionals to antecedents regarding future contingents, lotteries, or probable but uncertain propositions (neither settled true nor settled false).
  **Requirement:** The theory must provide a unified account of these "middle ground" cases. It must specify whether these are treated as semantically indicative, semantically counterfactual, or as a third category, and must explain how the settledness boundary applies to them.
  **Status:** **[Non-negotiable]**

  #### 5. The Settledness Topology Commitment
  **Case:** The Karst system relies on a distinction between "settled" and "unsettled." English usage suggests a similar reliance on epistemic state.
  **Requirement:** The theory must commit to whether the boundary between "open" and "settled" is binary (a proposition is either settled or it is not) or graded (a proposition has a degree of settledness). It must explain how this topology maps onto the choice of conditional form.
  **Status:** **[Camp Preference]** *(Modal epistemic accounts tend toward graded; traditional possible-worlds accounts tend toward binary.)*

  #### 6. The Factual Conditional Classification
  **Case:** Conditionals with antecedents known to be true by the speaker (e.g., "Since it is raining, the ground is wet") pattern differently from standard indicatives and counterfactuals.
  **Requirement:** The theory must classify these structures. It must explain why they are often infelicitous with standard conditional markers despite having true antecedents, or why they are acceptable only under specific discourse conditions. They cannot be treated as simple subsets of standard indicatives without explanation.
  **Status:** **[Non-negotiable]**

  #### 7. The Logical Variance Constraint (SDA)
  **Case:** Karst speakers uniformly accept that a conditional with a disjunctive antecedent entails the conditionals with each disjunct (Simplification of Disjunctive Antecedents). English speakers are divided on this for counterfactuals but generally accept it for indicatives.
  **Requirement:** The theory must explain this cross-linguistic and intra-linguistic variation. It must state whether indicative and counterfactual conditionals share a single underlying logic that is obscured by pragmatic factors, or whether they operate under distinct logical rules.
  **Status:** **[Non-negotiable]**

  #### 8. The Truth-Conditional Commitment
  **Case:** Some theoretical frameworks treat conditionals as lacking truth values (expressing probabilities or inference tickets), while others treat them as standard propositions.
  **Requirement:** The theory must explicitly state whether indicative and counterfactual conditionals express propositions with truth conditions. If they do not, it must provide an alternative account of embedding (e.g., under negation or in the scope of other operators) that preserves the judgments in Requirement 1.
  **Status:** **[Camp Preference]** *(Suppositional accounts reject truth conditions; realist accounts require them.)*

  ---

  ### Incompatible Subset

  **Requirements 2 (Morphological Neutrality), 3 (Learnability), and 8 (Truth-Conditional Commitment - Realist variant).**

  **Reason:** There is a tension between maintaining that the indicative/counterfactual distinction is a robust, universal *semantic* difference (requiring truth-conditional divergence, Req 1 & 8) and maintaining that this distinction is learnable and expressible in a language like Karst which lacks morphological markers for it (Req 2 & 3).
  If the distinction is semantic, Karst speakers must be accessing a semantic feature not marked in their syntax. If the theory posits a hidden semantic feature to save the semantic distinction, it risks violating Learnability (Req 3), as the input does not distinguish the two forms morphologically. If the theory claims the distinction is purely pragmatic to satisfy Karst data, it risks failing to capture the strong truth-value divergence judgments in English (Req 1). A theory cannot easily satisfy the demand for a universal semantic distinction while simultaneously respecting the morphological neutrality and learnability constraints of Karst without positing complex, unmarked pragmatic triggers that mimic semantic differences.

  ### The Single Most Exclusionary Requirement

  **Requirement 3: The Learnability Constraint.**

  **Reason:** This requirement excludes any theory that hard-codes the indicative/counterfactual distinction into universal grammar as a primitive binary feature tied to mood morphology. It forces the theory to derive the distinction from more general cognitive or discourse resources (such as epistemic settledness or temporal perspective) that are available in the Karst input. Many standard possible-worlds accounts rely on a semantic "closeness" metric that is triggered by subjunctive morphology; explaining how a Karst speaker accesses this same metric without the morphology, solely via a "settledness" clitic, eliminates theories that cannot map settledness onto world-selection functions without morphological mediation.

  ---

  ### Assessment of Theoretical Families

  **1. Truth-Functional Accounts**
  *   **Performance:** Fail.
  *   **Assessment:** Cannot satisfy **Requirement 1 (Truth-Value Divergence)**. They treat conditionals with false antecedents as vacuously true, collapsing the distinction between "If A, B" and "If A had been, B" when A is false. They also struggle with **Requirement 7 (Logical Variance)**, as material implication validates SDA uniformly, failing to capture English counterfactual intuitions.

  **2. Possible-Worlds Similarity Accounts**
  *   **Performance:** Mixed.
  *   **Assessment:** Strong on **Requirement 1**, successfully modeling truth-value divergence via different accessibility relations. However, they struggle with **Requirement 2 (Morphological Neutrality)** and **Requirement 3 (Learnability)**; they typically rely on mood to trigger the shift in world-selection. Explaining how Karst speakers achieve the same shift via a "settledness" clitic requires ad-hoc adjustments. They also frequently fail **Requirement 7**, as standard similarity semantics invalidates SDA, conflicting with Karst data and some English indicative data.

  **3. Premise-Semantic (Metalinguistic) Accounts**
  *   **Performance:** Mixed.
  *   **Assessment:** Handle **Requirement 6 (Factual Conditionals)** well, as they treat conditionals as arguments from premises. However, they often struggle with **Requirement 1**, as the distinction between indicative and counterfactual becomes a matter of which premises are cotenable, which can be difficult to formalize without collapsing into possible-worlds semantics. They risk violating **Requirement 3** if the cotenability conditions are not recoverable from Karst input.

  **4. Suppositional / No-Truth-Value Accounts**
  *   **Performance:** Strong on Constraints, Weak on Ontology.
  *   **Assessment:** Excel at **Requirement 1** (explaining divergence via assertibility conditions rather than truth) and **Requirement 7** (logic is determined by suppositional reasoning, easily varied). They handle **Requirement 2** and **3** well, as the distinction is epistemic (what is supposed) rather than morphological. However, they explicitly reject **Requirement 8 (Truth-Conditional Commitment)**, which makes them incompatible with frameworks demanding propositional content for embedding.

  **5. Epistemic-Modal-Base Accounts**
  *   **Performance:** Strongest Fit.
  *   **Assessment:** Best positioned to satisfy **Requirement 2** and **3**, as they ground the distinction in the speaker's epistemic state (settledness) rather than morphology. They can handle **Requirement 4 (Uncertainty)** naturally by grading the modal base. They can accommodate **Requirement 7** by varying the modal base for Karst vs. English. Their main challenge is **Requirement 1**, where they must ensure the epistemic shift is robust enough to mimic truth-conditional divergence without actually positing distinct metaphysical truth conditions.
