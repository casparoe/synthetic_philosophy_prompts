prompt: |-
  In the 1920s, American automobile interests ran a campaign to shift responsibility for street collisions from drivers onto pedestrians, and the word jaywalking, from jay in the sense of a rube, was promoted as part of it; Los Angeles in 1925 enacted the first widely copied law, on the strength of a bill drafted by the auto lobby, and versions of the offense remain on the books in most American jurisdictions even though in many cities pedestrians and police alike ignore it and some jurisdictions have lately decriminalized it. Treat this as a test case for the claim that everyday conventions are moral obligations, and for the further claim that a visitor must follow local conventions. I want to work with a distinction I have been turning over: between inherited conventions, which arise bottom-up out of repeated interaction, where each person's reason to conform is that others do, and installed conventions, which are manufactured and publicized by parties with something to gain from them. Does a convention's moral force depend on which of the two it is, or does the distinction wash out once the rule is in place and generally known? And what does the case do to the thought that a local convention binds a visitor, a pedestrian from a country where crossing mid-block is no offense at all? I care less about whether jaywalking laws are good policy than about what the episode shows about the theory, so say where the theory is silent instead of forcing it to speak.

  Answer in American English, in these sections: "The case" (one short paragraph, only the facts that the analysis turns on); "The convention, reconstructed" (one paragraph on whether what we have here is a convention in the relevant sense, given that the practice diverges from the rule); "Inherited versus installed" (three or four paragraphs, the heart of the answer); "The visitor's obligation" (two paragraphs); "Where the theory runs out" (one paragraph); "Verdict" (one paragraph, leading with your answer).
