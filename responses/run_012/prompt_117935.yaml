answer: |-
  The case
  In the 1920s, automobile manufacturers and clubs lobbied to redefine street use, shifting liability from drivers to pedestrians by popularizing the term "jaywalking," derived from "jay" meaning a foolish rustic. Los Angeles enacted a model law in 1925 based on this lobbying, creating a statutory offense that spread nationally to protect traffic flow over pedestrian freedom. Today, while these laws remain on the books in many jurisdictions, enforcement is sporadic, and some cities have decriminalized the act, creating a significant gap between the legal code and street-level practice.

  The convention, reconstructed
  Strictly speaking, where the practice diverges from the rule, this is not a convention in the relevant philosophical sense. A genuine convention requires a regularity in behavior supported by mutual expectations that others will conform and that deviation will be met with sanction or confusion. In cities where pedestrians cross mid-block freely and police look away, the expectation of punishment vanishes, and the behavior ceases to be conventional obedience. Thus, jaywalking rules often function not as coordination conventions but as dormant legal threats that activate only selectively, meaning the social practice does not match the normative rule.

  Inherited versus installed
  Inherited conventions gain moral force from the principle of fairness: because others restrain themselves for mutual benefit, I owe them similar restraint. The obligation is reciprocal and emerges from the interaction itself, creating a web of mutual reliance where conformity is rational because it sustains a beneficial equilibrium. The moral weight here is intrinsic to the cooperative nature of the practice; one obeys because one is a beneficiary of the cooperation of others.

  Installed conventions lack this reciprocal genesis. They are imposed by agents seeking to alter the distribution of rights, often to their own advantage, rather than to solve a pre-existing coordination problem. The reason to conform is not mutual reliance but avoidance of sanctioned penalty. In the jaywalking case, the rule was manufactured to serve the interests of the auto lobby rather than emerging from a organic need for safety, meaning the initial obligation rests on coercion rather than cooperation.

  Does time wash out this distinction? Only if the rule becomes functionally necessary for coordination independent of its origin. If the installed rule creates a genuine safety benefit that everyone recognizes, the origin may fade into irrelevance. However, in the jaywalking case, the persistent disregard suggests the coordinative benefit is not universally acknowledged, keeping the manipulative origin morally relevant. The rule remains a tool of control rather than a tool of coordination.

  Consequently, the distinction does not wash out. An installed convention retains a deficit of moral force compared to an inherited one unless it can demonstrate independent utility that justifies the initial coercion. The history of imposition matters because it signals whether the rule serves the public or a faction. Where the rule is ignored, it fails to achieve the status of a genuine norm, and its moral claim remains weak.

  The visitor's obligation
  The standard argument is that a visitor must follow local conventions to avoid disrupting the local equilibrium and to respect the host community's cooperative scheme. This obligation rests on the assumption that the convention represents a genuine social agreement that facilitates interaction and safety. If the visitor defects while others cooperate, they free-ride on the restraint of others, which is morally impermissible.

  However, if the convention is installed and widely ignored by locals, the visitor is not bound by the statute so much as the actual practice. If locals cross mid-block without sanction, the visitor follows the *real* convention, not the *installed* one. The obligation is to coordinate with actual behavior, not with a manufactured rule that lacks social traction. To follow the law where locals do not is not to respect the community, but to adhere to a ghost rule.

  Where the theory runs out
  Standard convention theory struggles to account for power dynamics and the legitimacy of norm creation. It treats conventions as solutions to coordination problems but lacks a robust framework for evaluating conventions that are weapons in a distributional conflict. It cannot easily distinguish between a norm that solves a problem and a norm that creates a problem to be solved by compliance, leaving it silent on how to weigh the moral claims of manufactured norms against organic ones.

  Verdict
  Yes, the moral force of a convention depends on whether it is inherited or installed, and no, a visitor is not strictly bound by an installed rule that diverges from local practice. Installed conventions lack the intrinsic moral weight of inherited ones because they do not rest on mutual benefit, and a visitor's duty is to align with actual local behavior rather than dormant statutes manufactured by interest groups.
