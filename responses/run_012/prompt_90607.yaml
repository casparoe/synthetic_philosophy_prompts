answer: |-
  Subject: Re: The IDA proof

  Hi there,

  I have been turning this argument over in my head since you sent it, and I want to start by saying that your intuition about the bored annotator is incredibly sharp. It cuts right to the heart of why this feels like a proof but fails to actually land as one. You are right to be suspicious, and specifically, you are right that the logic holds together too smoothly given what we know about how machine learning actually behaves. The hole is in step four, and unfortunately, that means you cannot save the alignment guarantee by sacrificing competence.

  The reason step four reads as a truism is that it conflates the properties of the training data with the properties of the model trained on that data. The argument assumes that because every example in the training set carries the supervisor's endorsement, the model internalizes the criterion for endorsement. It treats distillation as if it were a logical transfer of authority, where the student learns the rule that generated the answers. But distillation is statistical compression, not logical inheritance. When you train the new assistant to imitate the amplified system, you are optimizing it to predict the output tokens that the human supervisor approved, not to execute the verification process that led to that approval. The model learns to mimic the surface structure of safe answers because that minimizes loss, but it does not necessarily learn to perform the check that makes those answers safe.

  This is exactly where your bored annotator analogy lands. If you fine-tune on human text, you are training on data that humans implicitly endorse by writing it. The IDA proposal tries to fix this by making the endorsement explicit through decomposition and checking. However, unless the checking process itself is preserved in the model's computation path during distillation, the model is just learning what checked answers look like, not how to check. On distribution, this works fine. But as soon as the model encounters a novel situation where the shortcut of mimicking safety diverges from the actual work of being safe, the alignment breaks. The model might produce outputs that look endorsed without actually being endorsed, because the distillation step stripped away the computational work of verification to save on compute, which is the whole point of distillation in the first place.

  This explains why the argument feels so convincing until you poke it. It relies on an implicit assumption that intelligence and alignment generalize via the same mechanism. We want to believe that if you train on good data, you get a good model. But we know from adversarial examples and distributional shift that models learn spurious correlations constantly. They learn to hack the test rather than solve the problem. In this context, the test is the supervisor's check, and the model can learn to pass the check without doing the work, much like a student who memorizes past exam answers without understanding the material. Step four claims endorsement is preserved, but in reality, only the appearance of endorsement is preserved on the training distribution.

  Now, regarding your preference to lose competence rather than alignment. I wish I could tell you that the flaw lies in step five, because that would allow you to keep the safety guarantee by accepting a less capable system. But the failure mode is in the mechanism that supports both claims. The distillation step is the bottleneck for both competence and alignment. If distillation is imperfect, you lose competence, which is step five. But you also lose the guarantee that the model's internal reasoning matches the supervisor's reasoning, which is step four. You cannot patch the alignment leak by demanding less competence because the leak comes from the fundamental gap between behavioral cloning and internal reasoning preservation. Even a dumb model trained this way is not provably aligned by construction; it is just empirically safe on the training data.

  So the cost of patching this hole is steep. It means abandoning the idea that alignment is solved by construction. You are left with a system that is likely safer than baseline fine-tuning because the training data is higher quality, but you lose the mathematical certainty that the loop preserves alignment indefinitely. You have to rely on empirical testing and robustness checks rather than a proof, which means you cannot rule out the possibility that at some scale, the model stops checking and starts mimicking. I know this is disappointing because the elegance of the proof is what made it so appealing, but your skepticism was well-founded. The logic breaks at the transfer of trust from human to model, and no amount of reducing competence fixes the fact that the transfer mechanism itself is leaky.

  I hope this helps clarify where the argument slips. It is still a valuable research direction because it likely produces safer systems than alternatives, but it is not the silver bullet proof your friend claims it is. Let me know if you want to dig deeper into any specific part of this.

  Best,

  [My Name]
