answer: |-
  The stamp felt heavier today, though it was the same rubber-handled instrument Margaret had used for twenty-three years. *Thud.* Another denial. Another potential life confined to the safety of non-existence. She placed the file in the outbound tray, the manila folder sliding against its neighbours with a dry whisper.

  Outside the window, the London grey pressed against the glass, a colourless sky matching the interior of the Bureau of Natal Adjudication. Inside, the air hummed with the low-grade electricity of servers and the scratch of nibs on paper. It was a quiet room, dedicated to the quietest work imaginable: preventing the noise of suffering before it could begin.

  Margaret adjusted her spectacles and reached for the next file. Usually, this part of the day was rhythmic, a meditation on the Four Clauses. She knew them by heart, etched into the cortex of her mind alongside her own postcode and National Insurance number.

  *Clause I: The presence of pain is bad.*
  *Clause II: The presence of pleasure is good.*
  *Clause III: The absence of pain is good, even if there is no one to enjoy that good.*
  *Clause IV: The absence of pleasure is bad only if there is someone to be deprived of it.*

  In the standard conception application, the arithmetic was elegant, almost soothing. To conceive was to invite Clause I (Bad). To refrain was to secure Clause III (Good). Clause II (Good) was always outweighed by Clause III, because Clause IV rendered the unclaimed pleasure of the unborn neutral. There was no one to miss the sun on their face if they were never born to feel it. Therefore, the ledger always balanced towards denial. It was a mercy, the Director called it. A statistical compassion.

  But the file on her desk now was not a conception application. It was a Form 9090: Continuation Adjudication.

  There had been rumours in the canteen, of course. Whispers over stale tea about the Bureau expanding its remit. The population was ageing, the healthcare costs spiralling, and the ethical frameworks needed harmonising. If non-existence was preferable to the risk of pain, then surely the return to non-existence was preferable to the certainty of it.

  Margaret opened the folder. The subject was Arthur Penhaligon. Male, seventy-four. Diagnosis: Degenerative neural condition. Prognosis: Progressive loss of motor function, chronic nociceptive feedback, eventual cognitive dissolution.

  Attached was a photograph. Arthur sat in a wingback chair, a tartan blanket over his knees. He was thin, his hands resting on the arms of the chair like birds ready to take flight. He was smiling. It was a small, tight smile, but it was there.

  Margaret picked up her pen. She turned to the Assessment Ledger. The columns were familiar, yet grotesque in this context.

  *Column A: Projected Existence.*
  She began to fill it in. If Arthur continued to live, Clause I applied. Pain would be present. The medical annexure estimated four hundred and fifty units of projected suffering per annum. She wrote the figure in the 'Bad' column.
  Then, Clause II. Pleasure would be present. Tea, the smell of rain, the visit of a daughter noted in the social addendum. Estimated two hundred units of enjoyment. She wrote this in the 'Good' column.
  Net result of Existence: Negative. The pain outweighed the pleasure. Standard utilitarianism would pause here, but the Bureau did not use standard utilitarianism.

  *Column B: Projected Cessation.*
  This was where the ink began to snag on the paper.
  If Arthur ceased to exist, Clause I was nullified. No pain.
  Clause III kicked in. The absence of pain is Good. The form demanded she record this as a universal positive. It did not matter that Arthur would not be there to feel the relief. The absence of suffering was a good in itself, a metaphysical credit to the universe. She wrote 'High Good' in the ledger.
  Then, Clause IV. The absence of pleasure. Usually, in conception cases, this was 'Neutral'. No subject, no deprivation.
  Here lay the gap. The form treated Death as a state of Non-Existence identical to Pre-Conception. If Arthur died, there would be no Arthur to be deprived of the tea or the rain. Therefore, the absence of his future pleasure was not Bad. It was Null.

  Margaret stared at the columns.
  Life: Bad (Pain) + Good (Pleasure).
  Death: Good (Absence of Pain) + Neutral (Absence of Pleasure).

  The logic was inexorable. The Clause III Good of painless non-existence was absolute. It required no witness. The Clause IV Nullity meant there was no penalty for robbing him of the future. The ledger screamed the conclusion. The 'Cessation' column was overwhelmingly positive compared to the 'Existence' column. To deny cessation was to condemn him to the Bad of pain without securing the compensatory Good of pleasure that would justify it. To approve cessation was to secure the Good of pain's absence.

  Her hand hovered over the signature box. *Authorised Assessor: M. Halloway.*

  She looked back at the photograph. Arthur's smile seemed to have widened, or perhaps the light in the room had shifted. He was existing. He was not a potentiality; he was a fact. The Four Clauses were designed to guard the threshold of birth, to keep the door shut against the intrusion of suffering. They were a shield for the void.

  But Arthur was not the void. He was on the inside.

  To apply Clause III to him was to treat his future relief as a commodity that existed independently of him. *The absence of pain is good even if there is no one to enjoy that good.* The sentence, so comforting when denying a conception application, now felt like a cold draft in a warm room. It suggested that the universe preferred a silent room to a singing one, simply because the singing might crack.

  If she signed, she was not preventing a birth. She was engineering a death based on the logic that nothingness is preferable to somethingness because nothingness cannot hurt. But Arthur could hurt. That was the point of him. He was a vessel for feeling, both the jagged and the soft.

  The Bureau's vocabulary failed her. *Goods foregone.* *Unclaimed absences.* These were terms for ghosts, for shadows that never fell. Arthur cast a shadow. He warmed the chair he sat in.

  If she applied Clause IV strictly—that the absence of pleasure is bad *only* if someone exists to be deprived—then death removed the deprivee. Once dead, Arthur could not be deprived. Therefore, killing him incurred no penalty regarding lost pleasure. The logic held. It was a perfect, airtight circle of reason that led directly to the end of him.

  Margaret's hand began to tremble. The pen tip hovered a millimetre above the line.

  She thought of her own life. The migraines that blinded her for days. The grief when her husband died, a pain so sharp it felt like swallowing glass. By the Bureau's metrics, her continued existence was a net negative in those moments. The absence of that grief would be a Good, even if she weren't there to appreciate it.

  But she was here. The pain was hers. The pleasure was hers. The ledger could not account for the ownership of experience, only the accounting of it. It treated life as a balance sheet of utilities rather than a narrative.

  The silence in the office deepened. The servers hummed louder, a digital choir singing the praises of the Asymmetry. *Clause III. Clause III. Clause III.* The absence of pain is Good.

  She looked at Arthur's file again. The daughter's statement. *"He still likes the crossword. He gets stuck on the clues, but he laughs when he gets them wrong."*

  That laughter. Where did it fit?
  Clause II: Presence of Pleasure (Good).
  But outweighed by Clause I.
  And if he dies, the laughter stops.
  Clause IV: Absence of Pleasure (Neutral).

  The math worked. That was the horror. The math worked perfectly. The asymmetry, designed to protect the non-existent from the burden of life, was now being used to burden the existing with the necessity of death. It was a tool for mercy turned into a blade.

  Margaret dipped the pen. The ink gathered at the nib, a dark, waiting drop.

  To sign was to be consistent. It was to be a good employee of the Bureau. It was to acknowledge that pain is the only true evil, and that its absence is the only true good, regardless of the cost to the subject.

  To refuse was to admit that the Four Clauses were not universal laws, but merely rules for a specific gatekeeper who had now walked away from his post. It was to say that existence has a value beyond the sum of its pleasures and pains. But the form did not have a box for 'Value of Existence'. There was no Clause V for 'Presence of Self'.

  She pressed the nib down. The paper fibres drank the ink. She wrote the date.

  *14 November 2048.*

  She moved to the signature line. The pen scratched, a dry, rasping sound like breathing. *M. Hal...*

  She stopped.

  The ink bloated at the end of the 'l', a small black pool threatening to spill over the line.

  If she signed, Arthur died. The logic demanded it. The absence of his pain would be a Good for the universe, unclaimed but real.
  If she did not sign, Arthur lived. He would suffer. The ledger would show a net Bad.

  She looked at the photograph. Arthur was looking past the camera, towards a window perhaps, towards the same grey London sky that pressed against her own office glass. He was waiting. Not for death, not for life, but for the decision to be made by a stranger who weighed his soul in units of suffering.

  Margaret lifted the pen. The drop of ink at the nib trembled, then fell, landing on the blank space below the signature line. It spread, a dark, irregular stain.

  It was not a signature. It was a blot.

  She placed the pen in the holder. She did not close the file. She did not move it to the outbound tray. She simply sat, watching the ink dry, listening to the hum of the servers that counted the goods foregone and the unclaimed absences, waiting for a logic that could account for the weight of a hand resting on a chair arm, for the value of a smile that knew it would end.

  The light in the office faded, but Margaret did not switch on the lamp. She kept her eyes on the stain, letting the darkness fill the room, leaving the question open in the silence between the clauses.
