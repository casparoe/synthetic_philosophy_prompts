prompt: |-
  I'm a fourth-year PhD student in the philosophy of economics, and I need a prospectus (roughly two pages) for a paper I'd like to write this term on the no-trade theorems. My half-formed idea is this. The no-trade and agreement results are standardly read as showing that common knowledge of rationality together with a common prior makes speculative trade impossible, so that observed trading must be explained by noise, heterogeneous priors, or asymmetric information. I suspect this framing quietly conflates two things: the epistemic component of a trade—a bet placed because two parties disagree about the odds—and the allocative component—a reallocation of risk or resources between parties who agree about the odds but differ in what they hold or how they feel about risk. As I read them, the theorems rule out the first only under conditions that already assume the second away, which means the inference from "this market is liquid and trades heavily" to "these prices aggregate dispersed beliefs" may be far weaker than the efficient-markets literature takes it to be. What I want the paper to settle is whether observed trade admits of any principled decomposition into these two components, or whether there is a result showing it does not—and if it does not, what that does to the claim that prices are epistemically authoritative. Turn this into a prospectus: state the question so that it has a determinate answer, say why the existing positions leave it open, give the method and why that approach rather than the obvious alternatives, describe what a positive and a negative result would each look like, say what would count as the project failing, and give a realistic scope for a single term. Don't bother with citations—I'll supply those myself.
