  - Slime-mould cells that die to form the stalk: "gene level, kin selection again."
  - Meiotic drive in mice, where a gene wangles its way into more than half the sperm: "gene level, the clearest case there is."
  - A lineage that just lasts longer because it has a big geographic range, with no effect on anybody's reproduction: "not selection at all, that's just sorting."

