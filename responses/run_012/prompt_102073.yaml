answer: |-
  Here is a 75-minute lesson plan designed to move students from skepticism to tool-use.

  ### The Single Example
  **Verdict on your proposal:** The "Professor/Reading List" example is risky. The inference chain ("Excellent reading list" $\to$ "Harsh grading") is contingent on specific student culture assumptions that may not be shared by the whole room. If a student thinks "excellent reading" means "interesting/easy," the implicature collapses, and you will lose the room to debates about the professor rather than the logic of inference.

  **The Better Example:** Use the **"Lab Partner Recommendation."**
  *   **Context:** Student A asks Student B: "Is Alex a good lab partner for the chemistry final?"
  *   **Response:** "Alex is always on time and has very neat handwriting."
  *   **Why this works:**
      1.  **Truth-Conditional Gap:** The sentence is undeniably true (Alex is punctual/neat) even if the speaker believes Alex is terrible at chemistry. This separates *sentence meaning* from *speaker meaning* cleanly.
      2.  **Relevance Flout:** It obviously fails to answer the specific question directly, triggering the need for an inference.
      3.  **Calculability:** The steps to derive "Alex is bad at chemistry" are logical and shared (Lab partners need science skills $\to$ Speaker mentioned non-science skills $\to$ Speaker implies science skills are lacking).
      4.  **Test-Ready:** It works perfectly for cancellability ("...in fact, he's a genius at chemistry") and embedding.

  ---

  ### The Sequence and Dependency Structure

  **00:00 – 00:10: The Hook (Validating Skepticism)**
  *   **Action:** Write the Lab Partner dialogue on the board. Ask: "Did B answer the question?" (No.) "Did B lie?" (No.) "Did B communicate something?" (Yes.)
  *   **The Pivot:** Acknowledge the skepticism. "It looks like 'reading between the lines.' If it's just reading between the lines, it's subjective. If it's subjective, it's not logic. Today we prove it's not subjective. We are looking for the *rules* that make this inference mandatory rather than optional."
  *   **Why here:** You must validate their intuition (that this feels like common sense) before you formalize it. If you start with definitions, they will tune out.

  **00:10 – 00:25: Sentence Meaning vs. Speaker Meaning (The Data)**
  *   **Action:** Draw two columns: "What the Sentence Says" vs. "What the Speaker Means."
      *   *Sentence:* Alex is punctual/neat.
      *   *Speaker:* Alex is not good at chemistry.
  *   **Concept:** Define **Sentence Meaning** (truth-conditional, encoded in words) vs. **Speaker Meaning** (intention, inferred).
  *   **Why here:** You cannot explain *how* the inference works (Maxims) until you have established *that* there are two distinct layers of meaning to bridge. If you introduce Maxims now, they look like arbitrary grammar rules. They need to see the *gap* first.
  *   **Misconception Check:** Students will say, "But the sentence *means* he's bad." Correct them: "If the sentence *meant* he's bad, then if Alex was punctual but a chemistry genius, the sentence would be false. But it's not false. The sentence is true; the *suggestion* is false."

  **00:25 – 00:40: The Cooperative Principle & Maxims (The Mechanism)**
  *   **Action:** Introduce the **Cooperative Principle (CP)**: "Make your contribution such as is required." Then list the **Maxims** (Quantity, Quality, Relation, Manner) briefly on the board.
  *   **Crucial Move:** Do not present these as moral rules. Present them as **efficiency protocols**. "If we didn't follow these, conversation would crash. If I ask about chemistry and you talk about handwriting, you are breaking 'Relation.' Why would a cooperative speaker break a rule? Only to signal something else."
  *   **Why here:** The Maxims cannot come earlier because they are the *explanation* for the gap identified in the previous section. They also cannot come later, because you need them to perform the calculation.
  *   **Addressing Skepticism:** "Are these arbitrary? No. Try to have a conversation where everyone violates Relation constantly. It becomes noise. These are the conditions for information transfer."

  **00:40 – 00:55: Calculability (The Proof)**
  *   **Action:** Walk through the derivation on the whiteboard using the Lab Partner example. Number the steps:
      1.  Speaker said P ("Alex is punctual").
      2.  There is no reason to think Speaker is uncooperative.
      3.  P is not relevant to the question (Chemistry skills).
      4.  Speaker must be implying Q ("Alex lacks chemistry skills") to maintain cooperation.
      5.  Speaker knows I know this.
  *   **Why here:** Calculability must sit *after* the Maxims. You cannot calculate the derivation without the rules (Maxims) that justify the inference. This is where you move them from "vocabulary" to "tool." They are now doing the math of pragmatics.
  *   **Misconception Check:** Students will think the Maxim was *broken*. Clarify: The Maxim was **flouted** (openly broken) to generate meaning. If it were *violated* (secretly broken), it would be a lie.

  **00:55 – 01:05: The Tests (Cancellability & Embedding)**
  *   **Action:** Introduce a **Fresh Example** for testing. Do not reuse the Lab Partner example.
      *   *New Example:* A: "Do you want coffee?" B: "I'm awake." (Implicature: No.)
  *   **Task 1 (Cancellability):** Ask students to make the implicature vanish without making the sentence contradictory.
      *   *Result:* "I'm awake... in fact, I need coffee." (Sentence remains true, implicature gone).
      *   *Contrast:* Try to cancel an entailment. "It's a dog... in fact, it's not an animal." (Contradiction).
  *   **Task 2 (Embedding):** Put it in a conditional. "If I'm awake, I'll drink coffee."
      *   *Result:* The implicature ("I don't want coffee") vanishes in the antecedent. The sentence meaning ("I am currently awake") remains.
  *   **Why here:** You need a fresh example to prove they have a *method*, not just a memory of the first example. This must come last because it requires them to manipulate the meaning they have just learned to identify.

  **01:05 – 01:15: Misconception Map & Closing**
  *   **Action:** Rapid-fire clarification of traps (see below) and the closing question.

  ---

  ### Misconception Map

  | Misconception | Real Trap or TA Confusion? | Where to Head It Off | How to Head It Off |
  | :--- | :--- | :--- | :--- |
  | **"Implicature is just any inference."** | **Real Trap.** | **00:40 (Calculability)** | Emphasize that random inferences aren't calculable. If I say "It's raining" and you infer "I'm sad," that's psychology, not Grice. Gricean implicature is *recoverable* via the Maxims. |
  | **"Sentence meaning = Speaker meaning."** | **Real Trap.** | **00:10 (The Data)** | Use the truth test. If the sentence meaning and speaker meaning were the same, cancelling the implicature would create a contradiction. It doesn't. |
  | **"Maxims are rules that get broken."** | **Real Trap.** | **00:40 (Calculability)** | Distinguish **Flouting** (open breach to generate meaning) vs. **Violating** (secret breach to deceive). Most examples in this class are flouts. |
  | **"Irony/Sarcasm are the paradigm."** | **Real Trap.** | **00:25 (Maxims)** | Acknowledge irony is a flout of Quality, but warn them: "Don't let the flashy cases blind you. Most implicature is boring and cooperative (like the Lab Partner)." |
  | **"Words like 'but' work the same way."** | **TA Confusion / Trap.** | **Leave Out** | *See "What to Leave Out" below.* This is Conventional Implicature. Treating it as Conversational now will break the logic of the tests. |

  ---

  ### What to Leave Out (And How to Frame It)

  You must exclude **Conventional Implicature** (e.g., the difference in meaning between "and" and "but," or "therefore").

  **Why:** Words like "but" encode contrast directly into the semantics/logic of the connector. Conversational implicature is inferred from context. If you introduce "but" now, students will think implicature is attached to specific words, which destroys the point of the Cancellability Test (since you can't cancel the meaning of "but" without changing the sentence).

  **How to Phrase the Omission (The Promise):**
  > "You might be wondering about words like 'but' or 'therefore,' which seem to carry extra meaning automatically. That is a phenomenon called *Conventional Implicature*. It works differently than what we are studying today. We are leaving it on the shelf for now not because it isn't important, but because mixing the two systems will break the tools we are building. Once you have mastered Conversational Implicature, Conventional Implicature will be much easier to isolate. We park it today so we can get a clean signal."

  ---

  ### The Closing Question

  Do not ask for a definition. Ask for a diagnosis.

  **The Question:**
  > "I say to you: 'Some of the students passed the exam.' You infer: 'Not all of the students passed.'
  >
  > If I later say, 'I was lying, actually *all* of them passed,' have I contradicted my first sentence?
  >
  > Explain your answer using the Cancellability Test."

  **Why this works:**
  *   It forces them to distinguish between the semantic meaning of "some" (which is logically compatible with "all") and the scalar implicature (which suggests "not all").
  *   If they say "Yes, it's a contradiction," they haven't learned the distinction (they are treating the implicature as sentence meaning).
  *   If they say "No, because I can cancel the inference without contradicting the sentence," they have the tool.
  *   It requires them to apply the test, not just recite the maxim of Quantity.

  ### Summary of Constraints for the Whiteboard
  1.  **Left Side:** The Lab Partner Dialogue (Keep this up the whole time).
  2.  **Center:** The Derivation Steps (1-5) and the Maxims.
  3.  **Right Side:** The Fresh Example (Coffee) and the Cancellability/Embedding tests.
  4.  **Bottom:** The Closing Question.

  This structure ensures that by minute 75, they haven't just heard about Grice; they have used Grice to solve a logical problem.
