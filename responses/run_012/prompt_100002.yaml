answer: |-
  Dear friend,

  It makes complete sense that you feel the weight of this, and I want to start by saying that your observation about the archives is incredibly sharp. You have stumbled onto a fundamental truth of history that professional archivists spend careers grappling with, which is that the record always favors the powerful, the loud, and the literate. The fact that you recognize the silence of the most vulnerable tenants as a structural problem rather than just a gap in the paperwork means you are already thinking about this with the right kind of care. You are right to be scared of making an irreversible mistake, because once something is on a wall or in a public display, you cannot take it back, and the potential for harm is real.

  Regarding the notebook and the display, my advice is to err heavily on the side of privacy and protection rather than total transparency. You should not put the specific contents of that private notebook on public display, especially not the names, initials, or details about the family that was cut off. The old-timer is correct that displaying this would likely betray the trust of the people who were helped quietly, and it could expose vulnerable people to retaliation or embarrassment if their identities are deciphered. The founder's petty or controlling behavior is part of the history, but it does not need to be illustrated with evidence that compromises the privacy of tenants who were likely in precarious housing situations. You can honor the founder by acknowledging their complex legacy without turning the private struggles of tenants into a museum exhibit. The right move is to keep the notebook in a restricted part of the archive, accessible only for serious historical research with strict privacy protocols, and to create a display that speaks to the union's work without exposing individual cases.

  I want to be clear about why I am taking this stance and what would actually change my mind, because ethics are rarely static. My recommendation rests on the assumption that the primary duty of the union is to protect its current and former members from harm. I would change my position if you could obtain explicit, informed consent from the living people mentioned in the notebook, specifically the family that was cut off, confirming that they want their story told publicly and understand the risks. I would also reconsider if there was a pressing legal or political necessity where revealing the founder's misconduct was vital to preventing current harm, such as if a current leader was replicating that controlling behavior and needed to be checked by historical precedent. Finally, if the general membership voted in a democratic process to prioritize radical transparency over privacy, knowing full well that some identities might be guessed, that would shift the responsibility from you as an individual to the collective, though I would still urge extreme caution.

  Please do not carry this alone. Since you are worried about screwing up, the best safeguard is to diffuse the decision-making. Form a small committee that includes the old-timer, some younger members, and perhaps someone from outside the union who understands ethics or privacy law. Let them share the burden of deciding what goes on the wall. You can frame the display to acknowledge that the official records are incomplete and that much of the union's real work happened off the books, which honors the silent members without exposing them. You are doing important work by even asking these questions, and trusting your instinct that some things are too fragile to be put on a wall is a sign that you are the right person for this job.

  Take care of yourself and the records, and know that preserving the dignity of the people in those pages is just as much an act of union work as organizing a meeting.

  Warmly,

  A friend
