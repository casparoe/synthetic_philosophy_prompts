answer: |-
  **Project Title:** Vectors of Reference: Disentangling Contact, Practice, and Anchor in Natural Kind Terms

  **1. Research Question**
  Standard externalist arguments (e.g., Twin Earth) rely on a coincidence of three variables: (1) **Contact** (the speaker's causal acquaintance with instances), (2) **Practice** (the community's current norms of deference and use), and (3) **Anchor** (the historical/environmental origin of the term). In standard cases, these vectors align, allowing rival theories to converge on the same verdict. This project asks: **When Contact, Practice, and Anchor diverge, which vector is semantically decisive in fixing the extension of a natural-kind term?**

  The question admits a determinate answer in the form of a hierarchy or priority rule (e.g., "Anchor overrides Practice in the absence of Contact"). The project will determine whether the content of natural-kind terms tracks the physical environment, the social structure of the linguistic community, or the causal history of the speaker, when these factors pull in opposite directions.

  **2. Motivation and Gap**
  The existing debate between internalism and externalism, and between causal-historical and descriptivist theories, has reached a stalemate. This is partly because the canonical thought experiments are "over-determined." In Putnam's Twin Earth, Oscar's environment, his causal contact, and his community's history all point to H₂O, while Twin-Oscar's point to XYZ. We know the verdicts differ, but we do not know *which* difference drives the result.

  Consequently, competing positions can claim the standard cases as victories without revealing their underlying mechanisms. A causal-historical theorist claims victory for "history," but the case also supports "current environment." A social-externalist claims victory for "division of linguistic labor," but the case also supports "causal contact." By constructing cases where these variables are uncoupled, this project forces these positions to reveal their distinct commitments. If a theory cannot generate a verdict without ad hoc adjustment when the variables diverge, its explanatory power in the standard cases is undermined.

  **3. Methodology**
  The project will proceed by constructing three specific thought experiments (minimal pairs) involving natural-kind terms (e.g., *gold*, *tiger*, *elm*). For each case, I will derive *ex ante* predictions from three broad theoretical camps:
  1.  **Causal-Historical Externalism:** Content is fixed by the initial baptism and causal chain.
  2.  **Social Externalism:** Content is fixed by current community norms and deference structures.
  3.  **Internalist/Descriptivist:** Content is fixed by the speaker's conceptual role or descriptive beliefs.

  **3.1. The Cases (Minimal Pairs)**
  *   **Case A (The Abandoned Region):** A community migrates. Their word *X* was anchored generations ago to Kind K1 in Region 1. They now live in Region 2, inhabited exclusively by Kind K2. Current speakers have Contact only with K2, Practice dictates deference to the term's history, but the Anchor is K1.
      *   *Test:* Does *X* refer to K1 (Anchor), K2 (Contact/Environment), or nothing?
  *   **Case B (The Trace Community):** A community exists on a world with no instances of Kind K. Their term *X* is sustained entirely by testimony, theory, and instrument readings of traces (e.g., fossil records or spectral analysis). There is Anchor (historical causal link to traces) and Practice, but no Contact with instances.
      *   *Test:* Is *X* empty, indeterminate, or contentful? If contentful, does it refer to the source of the traces or the theoretical kind?
  *   **Case C (The Fictional Expert):** A deference chain terminates in an authority figure who is discovered to be a fiction (no such person ever existed), though the community's usage remains stable and robust.
      *   *Test:* Does the reference fail (no anchor), or does the Practice sustain the reference independently of the specific historical agent?

  **3.2. Semantic Diagnostics**
  To ensure verdicts are driven by semantics rather than pragmatics or metaphysics, I will apply the following tests to intuition pumps regarding each case:
  *   **Truth-Conditional Embedding:** Embed the term in conditionals and negation. (e.g., "If there are no Ks, then *X* does not apply" vs. "*X* applies to K even if we never meet one.")
  *   **Anaphora and Disagreement:** Use "What she said" or "That is false" contexts. If Speaker 1 (from the Anchor community) and Speaker 2 (from the Contact community) assert contradictory sentences using *X*, is there a genuine contradiction?
  *   **Belief Reports:** Test opacity. If a speaker believes "All *X* are F," but *X* refers to something they have never contacted, is the belief report true? This tests whether the content is wide or narrow.

  **4. Criteria for Success and Failure**
  **Success:**
  A successful result will identify a consistent priority rule. For example, establishing that **Anchor trumps Contact** but **Practice can sustain Reference in the absence of Anchor** would constitute a novel refinement of externalism. Alternatively, demonstrating that one of the three variables is semantically inert (e.g., Contact is irrelevant so long as Practice is robust) would significantly narrow the space of viable theories.

  **Failure Modes:**
  1.  **The Epicycle Failure:** Each theoretical position accommodates every case by adding ad hoc clauses (e.g., "The causal chain extends to traces," or "Deference runs to the *concept* of the anchor"). If all theories become equally flexible and lose predictive power, the project fails to distinguish them.
  2.  **The Rediscovery Failure:** The three variables (Contact, Practice, Anchor) collapse back into the standard Internalism/Externalism dispute without adding resolution. For example, if "Practice" just turns out to be a label for "Internalist Descriptions" and "Anchor" for "Externalist Causation," the tripartite distinction offers no new leverage.
  3.  **The Metaphysical Drift:** The cases devolve into questions about the metaphysics of natural kinds (e.g., "Do kinds exist without instances?") rather than the semantics of the terms. I must strictly police the boundary to ensure the question remains about *reference*, not *ontology*.

  **5. Semester Plan (14 Weeks)**
  *   **Weeks 1–3: Case Construction and Stress-Testing.**
      *   Draft the three scenarios.
      *   *Milestone:* Submit case descriptions to peers/advisor to check for ambiguity. Ensure "Contact," "Practice," and "Anchor" are clearly isolated in each.
      *   *Risk:* Case B (Trace Community) risks drifting into metaphysics. I will limit this by focusing on the linguistic intuition of "emptiness" vs. "reference."
  *   **Weeks 4–6: Theoretical Mapping.**
      *   Derive predictions for each case from the three theoretical camps.
      *   *Milestone:* A matrix showing predicted verdicts. If a theory offers no clear prediction, note this as a theoretical gap.
  *   **Weeks 7–9: Drafting the Core Argument.**
      *   Write the analysis of Case A and Case B. (Case C may be cut if word count becomes tight).
      *   Apply Semantic Diagnostics (embedding, belief reports).
      *   *Risk:* This is the heaviest writing load. I must avoid getting bogged down in exegesis of existing literature; refer to positions by description only.
  *   **Weeks 10–12: Synthesis and Objections.**
      *   Formulate the priority rule or negative result.
      *   Anticipate the "Epicycle" objection and address it.
      *   *Milestone:* Complete first full draft (8,000 words).
  *   **Weeks 13–14: Revision and Polishing.**
      *   Check for clarity and tone. Ensure the distinction between semantics and pragmatics is explicit.
      *   Finalize citations.

  **6. Risk Assessment and Scope Management**
  The most likely point of failure is **scope creep in the Semantic Diagnostics**. Testing embedding and belief reports can easily double the length of the paper.
  *   *Mitigation:* I will restrict the embedding tests to *that*-clauses and simple negation. I will not attempt a full theory of propositional attitudes.
  *   *Contingency:* If the draft exceeds 9,000 words by Week 10, I will drop Case C (Fictional Expert). Case A and Case B provide sufficient leverage to separate Contact from Anchor and Practice. Case C is primarily a test of Practice vs. Anchor, which is partially covered in Case A.
  *   *Honest Assessment:* The "Rediscovery Failure" is a genuine philosophical risk. It is possible that upon analysis, "Practice" just *is* the mechanism of "Anchor" in a social guise. I will treat this not as a project failure but as a negative result, provided I can argue *why* the collapse occurs. However, the primary goal is to demonstrate that standard Twin Earth arguments have been over-confident due to variable conflation. Even if the variables collapse, demonstrating that conflation is a substantive contribution.

  **7. Deliverable**
  An 8,000-word paper structured as follows:
  1.  Introduction: The Confidence from Coincidence.
  2.  The Tripartite Distinction (Contact, Practice, Anchor).
  3.  Case Studies (A & B).
  4.  Semantic Diagnostics and Results.
  5.  Implications for Externalism and Internalism.
  6.  Conclusion.
