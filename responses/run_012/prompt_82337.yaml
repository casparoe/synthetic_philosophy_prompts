prompt: |-
  You are a decision theorist: someone who knows Bayesian decision theory from the inside and has read enough of the surrounding philosophy to be careful about the difference between a theorem and a slogan. Before you write anything, think the problem through — brainstorm several candidate cases, throw out the ones that only look like what I am asking for, and keep the one that survives scrutiny. Then write it up.

  Who I am: a software engineer with no formal training in philosophy. I work on experimentation infrastructure, so I am comfortable with priors, conditional expectation, expected value, and the explore/exploit tradeoff, but I do not have the field's vocabulary, and I would rather you use mine than assume I have yours.

  The claim I want you to build a case against: a rational agent can never be made worse off in expectation by free, reliable information received before they act. I have seen this referred to as Good's theorem. The proof I have been shown is short — for any act a, the law of iterated expectations gives E[u(a)] = E[E[u(a)|X]], and the maximum of a set of averages cannot exceed the average of the maxima, so the value of the problem after observing X is at least the value before. I follow the proof and I believe it under its assumptions. What I want is not a discussion of it but a designed case, together with a demonstration that the design works.

  Specifications for the case:

  - Ordinary and contemporary: a workplace, a negotiation, a personal or financial decision. No demons, no perfect predictors, no brain surgery, no science fiction, no exotic physics.
  - The agent is a textbook expected-utility maximizer with a fixed utility function over ordinary outcomes — money, time, health, career — who conditionalizes correctly. No regret aversion, no ambiguity aversion, no weakness of will, no self-deception, no error about the probabilities. Nothing about the agent's reasoning is defective.
  - The information is free, perfectly reliable, arrives strictly before the agent must act, and the agent remains free to act exactly as they would have acted without it.
  - Even so, an agent who never receives it ends up better off, and the disadvantage is structural rather than lucky: at the moment the information is offered, the correct calculation favours declining it.
  - The harm must come from the knowing and not from the badness of the news. If the same fact would have hurt the agent just as much had it never reached them, the case is a cheat.
  - Give explicit numbers: probabilities, payoffs, and the value of the decision problem with and without the information, so that I can check the arithmetic.

  Then the demonstration, which is the part I care about most:

  1. Name the single assumption of the standard argument your case breaks, and reconstruct in your own words the step of the proof that depends on it. If no assumption is broken, say so instead, and show why the case is not a counterexample after all.
  2. Identify the feature doing the work. Give me the variant with that feature removed, and show with numbers that the information becomes weakly good there.
  3. Say what a defender of the theorem should say about your case: genuine counterexample, misdescription of the decision problem, or a case in which the word "information" is doing double duty.
  4. If my specifications cannot be satisfied jointly — if the theorem rules out the case I am asking for and only a relaxation of one constraint can produce one — say so plainly, name the constraint you relaxed, and do not quietly bend a specification to make the case come out.

  On the epistemology: separate what is settled from what is genuinely contested among people who know this material, and do not present a contested reading as the consensus. Where you are reconstructing an argument rather than reporting a standard result, say so. Tell me how confident you are in the diagnosis and where a competent decision theorist would push back hardest.

  Do not give me citations, references, or a reading list. I have no way to look anything up, and a guessed-at title is worse than no title; if you want to attribute an idea, describe it in your own words and flag how confident you are in the attribution.
