      Your suspicion is correct: the impasse is primarily conceptual, though reinforced by substantive and normative disagreements. The word "collapse" is not a neutral descriptor but a "cluster concept" bundling distinct phenomena.

      First, the verbal disagreement is real. Camp A defines collapse as the loss of sociopolitical complexity (elites, monuments, states). Camp B defines it as demographic or cultural extinction. When Camp A says "collapse," they mean "state failure." When Camp B says "no collapse," they mean "people survived." They are technically both right about different things, creating a verbal impasse.

      Second, the normative layer drives the heat. "Collapse" carries a judgment of failure and warning. Camp A often seeks lessons on sustainability; calling it collapse validates the moral lesson. Camp B often seeks to decolonize history; calling it collapse validates colonial narratives of indigenous incompetence. The word choice protects these ideological commitments.

