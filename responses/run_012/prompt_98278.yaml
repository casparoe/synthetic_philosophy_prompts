answer: |-
  Your friend accurately captures Pascal's diagnostic description of political mechanics but catastrophically mistakes it for Pascal's normative belief, turning his lament about human wretchedness into an endorsement of tyranny.

  Here is the claim-by-claim breakdown of where your friend lands on the spectrum from fair reading to fundamental error:

  **1. "Pascal is the patron saint of political realism."**
  *   **Verdict:** Simplification that loses what matters.
  *   **Reasoning:** It is fair to say Pascal describes politics realistically, but labeling him a "political realist" implies his primary project is political theory. His project is theological apologetics. He describes the grim reality of politics not to teach us how to rule, but to prove that human societies are fundamentally broken without God. He uses political instability as evidence of original sin, not as a standalone philosophical position.

  **2. "There's no such thing as natural justice — justice is just whatever custom happens to have settled on."**
  *   **Verdict:** Partially fair, but theologically incomplete.
  *   **Reasoning:** Pascal argues repeatedly that humans cannot *know* natural justice with certainty ("We know justice, but we do not know what is just"). He observes that custom determines what we *call* justice. However, he does not deny the existence of true Justice; he locates it in God. For Pascal, the fact that custom overrides truth is a tragedy of the fall, not proof that truth doesn't exist.

  **3. "We obey the laws because they're the laws, not because they're actually just."**
  *   **Verdict:** Fair representation of his practical advice.
  *   **Reasoning:** In fragments regarding submission to the king, Pascal argues that since we cannot verify the justice of a law's origin (which is often usurpation), we must obey the established authority to prevent chaos. He advises treating the established law as just for the sake of peace, even while acknowledging its origins may be corrupt.

  **4. "Since the people with the just claims are always too weak to back them up, we've settled for the reverse: we call the strong just."**
  *   **Verdict:** Fair representation of his diagnostic observation.
  *   **Reasoning:** This is a direct paraphrase of his most famous political fragment (L103/S135): "Being unable to make what is just strong, we have made what is strong just." Pascal observes this mechanism clearly. He agrees that this is how human societies function de facto.

  **5. "So for Pascal, justice is basically a story that power tells to dress itself up. Might makes right, and all the high-minded talk is just the costume."**
  *   **Verdict:** What Pascal would actually deny.
  *   **Reasoning:** This is the critical slide your intuition detected. Pascal agrees that power *uses* justice as a costume, but he does not agree that justice *is* the costume. He believes there is a real Justice (God's justice) that stands in judgment over power. When he says "we have made what is strong just," he is describing a human compromise born of weakness, not stating a metaphysical truth. He is mourning this state of affairs, not celebrating it as wisdom.

  **Does the closing move survive?**
  No, the conclusion that Pascal is a "might-makes-right" guy collapses under scrutiny. If Pascal believed might literally made right, his entire apologetic project would fail, because there would be no higher standard by which to judge human wretchedness. Pascal's point is precisely that we *cannot* live by "might makes right" without feeling the gnawing dissatisfaction of our conscience, which proves we were made for something higher. He argues we must *pretend* might is right to avoid civil war, while simultaneously recognizing that this pretense is proof of our fallen nature. Your friend has taken Pascal's description of the disease and mistaken it for his prescription for health.
