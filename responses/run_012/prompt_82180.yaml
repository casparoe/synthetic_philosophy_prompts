prompt: |-
  Hey so for my pragmatism seminar I've gotta write a satirical piece and I want to do it on Dewey's line that democracy is inquiry all the way down — a policy as a hypothesis, the public as a community of inquirers, a decision as warranted assertibility rather than final truth, all that. Can you write me a mock official FAQ from a city government that's actually taken this seriously? Like a Department of Democratic Inquiry putting out a resident-facing document explaining why the new zoning ordinance is really an experiment, why no outcome is ever settled once and for all, and what you're supposed to do when the situation stops being problematic. Around 600 words, deadpan bureaucratic voice, and please get the Dewey right so my prof laughs instead of wincing — the problematic situation, ends-in-view, the continuity of means and ends, the spectator theory of knowledge, the whole bit. The jokes should come out of the view itself and not out of me just dunking on it. And dont let it collapse into haha government is slow; the funny part should be that an institution genuinely committed to inquiry can never actually finish anything, and by the end a reader should be half wondering whether thats a bug or the entire point.
