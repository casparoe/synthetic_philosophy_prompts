          *   Continuity of means and ends.
          *   Critique of spectator theory of knowledge.
          *   What to do when the situation stops being problematic.
      *   **Humor Style:** The jokes should emerge from the view itself (internal logic), not external dunking. The core irony is that an institution committed to inquiry can never finish anything.
      *   **Goal:** Make the professor laugh (accurate philosophy) rather than wince (misinterpretation or cheap shots).
      *   **Ending:** Ambiguous whether the inability to finish is a bug or a feature.

  2.  **Deconstruct Deweyan Concepts for Bureaucratic Satire:**
      *   *Problematic Situation:* Instead of "issues," everything is a "problematic situation" requiring investigation. Even solved problems are just temporarily settled.
      *   *Warranted Assertibility:* No laws, only temporary working hypotheses. No final votes, only provisional validations.
      *   *Ends-in-view:* Goals aren't fixed destinations; they shift as the inquiry proceeds.
      *   *Means/Ends Continuity:* You can't justify bad means for good ends because the means *become* the ends.
      *   *Spectator Theory:* Citizens aren't allowed to just watch; they must participate in the inquiry. Passive observation is discouraged.
      *   *Democracy as Inquiry:* Voting isn't choosing leaders; it's testing hypotheses.

  3.  **Drafting - Section by Section:**

