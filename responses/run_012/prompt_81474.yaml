answer: |-
  Right, let's have a proper look at this. You're right to be puzzled, because Rosie isn't working off a simple checklist. She's got a hierarchy in her head, and until you see the order of it, she looks inconsistent.

  Here is the straight answer, followed by the breakdown of why she thinks that way.

  ### What will she do?
  Rosie will vote to **scrap the tennis club funding**.

  She will do this even though the money will just sit in the reserve and help nobody. In her view, giving public cash to people who don't need it is worse than giving it to no one at all.

  ### The Rule She's Running: "The Lifeline Principle"
  The rule isn't about being anti-posh, and it isn't just about helping the most people. It's a two-step test.

  **Step 1: The Necessity Test.**
  Is this for people who cannot afford to do without it? If the answer is no, the bid fails immediately. It doesn't matter how many people use it or how nice the facility is. If they can pay for it themselves, they should.
  *   *This explains the Tennis Coaching (voted down), the Drama Society (voted down), and the Arts Centre swap (voted down).*

  **Step 2: The Spread Test.**
  If Step 1 is passed (they are genuinely needy), *then* she looks at numbers. She wants to help as many of the needy people as possible, rather than pouring everything into a tiny few.
  *   *This explains the Youth Club choice.* Both options were for needy kids. So, she picked the one helping sixty kids over the eight kids.
  *   *This explains the Tenants' Association.* The winter warmth bid passed Step 1 (survival need). The cheaper bid that reached more people likely failed Step 1 (perhaps it was for summer activities or less critical support). Need trumps numbers, but only if the need is real.

  ### Are there other rules that fit?
  There are two other theories that fit most of the facts, but they stumble on the details.

  **1. The "Headcount" Rule (Maximize the people helped)**
  This rule says: "Always pick the option that helps the most individuals."
  *   *Where it fits:* The Youth Club choice (60 kids over 8).
  *   *Where it breaks:* The Tenants' Association. She backed the 30 households over the bid that helped three times as many people. She also rejected the Arts Centre which had "far more users" than the estate advice service.
  *   *Verdict on Tennis:* This rule would say "Keep the funding" if more people use the courts than the alternative. But since the money goes to reserve (zero people helped), this rule is confused. It doesn't match Rosie.

  **2. Dave's "Class War" Rule (Anti-Posh)**
  This rule says: "If they look well-off, cut their funding. If they look struggling, give it."
  *   *Where it fits:* Tennis, Drama, Tenants.
  *   *Where it breaks:* It's too blunt. It doesn't explain why she chose the 60 kids over the 8 poorest kids in the Youth Club. If it was purely about who was poorest, she'd have picked the 8. She didn't. She cares about fairness within the group, not just punishing the rich.
  *   *Verdict on Tennis:* This rule says "Scrap it" because they are well-off. This matches the outcome, but for the wrong reason. Dave thinks she's punishing them. I think she's protecting the purpose of the fund.

  ### Why the "Lifeline Principle" is the one
  I'd put my money on the Lifeline Principle. It's the only one that handles the tricky bit about the Youth Club (choosing the 60 over the 8) while still explaining why she rejected the Arts Centre.

  She treats the trust's money like a lifeboat. You don't use the lifeboat to take tourists for a spin, even if it makes the tourists happy. And if there are no drowning people nearby, you don't take the boat out just to use up the fuel. You keep the fuel in the tank for when the emergency actually happens.

  That is why she will scrap the tennis money even if it goes to reserve. To her, putting it in the reserve keeps the "fuel" safe for a real crisis. Giving it to the tennis club burns the fuel on the wrong people.

  ### Is it mad that the courts sit empty?
  You asked me to say it plainly if her rule means we're better off with nobody on the courts.

  **Yes, plainly: Her rule implies it is better for the courts to be unused than for them to be subsidised by this specific pot of money.**

  It sounds mad if you look at the town as a whole. Empty courts are a waste. But Rosie isn't looking at the town; she's looking at the *Trust*. She believes that if you start using hardship money to subsidise hobbies for the middle class, you blur the line. Next year, someone else will ask for a handout for something non-essential, and it becomes harder to say no.

  She would rather the money sit idle than set a bad precedent. She values the integrity of the fund more than the utility of the cash in that specific year.

  ### How to settle it for good
  If you want to prove this is her rule (and not just Dave's "anti-posh" theory), you need to put a proposal in front of her that passes the Necessity Test but fails the "Posh" test.

  **The Test Case:**
  Find a project for the "squeezed middle". Not the destitute, but not the wealthy either. Working families who are just about managing, perhaps one pay cheque away from trouble.
  *   *Proposal:* A holiday food club for families who earn too much for free school meals but still struggle in August.
  *   *If she backs it:* It proves she cares about **Need**, not just punishing the rich. Dave's theory is wrong.
  *   *If she rejects it:* It proves she only funds the absolute bottom tier (The "Destitute Only" rule).

  **Or, try this one:**
  A project for the well-off that saves money for the poor.
  *   *Proposal:* Training for private landlords in the town to spot signs of mental health issues in tenants, preventing evictions. The landlords are well-off, but the service protects the poor tenants.
  *   *If she backs it:* She is pragmatic.
  *   *If she rejects it:* She is principled. No money for the landlords, full stop.

  My guess? She'll reject the landlords. She's a principled voter. She'll scrap the tennis money, the reserve will grow, and she'll sleep soundly knowing the fund hasn't been misused. You might not like it, but now you know where she's coming from.
