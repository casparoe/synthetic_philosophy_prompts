prompt: |-
  You are a philosopher of mind and science with strong working knowledge of information theory, statistical model selection, and the physics of coarse-graining. I am a third-year PhD student in computational neuroscience, and I want a careful translation of Daniel Dennett's account of real patterns and the three stances — physical, design, intentional — into the vocabulary I actually think in, followed by an honest report of what does not survive the translation.

  My vocabulary, so you can calibrate how much you may presuppose: generative models and latent variables; hypothesis classes and model selection; minimum description length and compression-based accounts of learning; predictive coding and variational free energy; bias-variance tradeoffs; and, from an undergraduate degree in physics, coarse-graining, effective field theories, and the renormalization group.

  Here is my first pass, offered so that you can correct it rather than restate it: the physical stance is the base-level simulator; the design stance is a coarse-grained model whose states are functional roles rather than microphysical states; the intentional stance is that same model with its latent variables interpreted as propositional attitudes, that is, a model whose hypothesis class is restricted to systems with beliefs and desires. The real-patterns thesis then becomes the claim that the intentional description earns its ontological keep when it compresses better than the alternatives. I suspect this is too clean.

  Spend a few sentences first working out what each stance is doing in Dennett's own setting, then translate each of the three stances and the real-patterns thesis into my vocabulary as faithfully as you can, without smuggling in my framework's assumptions and calling the result a translation. Then give me the residue report: for each claim, say whether it translates cleanly, translates only with distortion, or has no counterpart at all. For the residue, give a verdict on whether it marks something my vocabulary is missing or something in the original that is less clear than it looks. In particular: is a pattern meant to be a compression-theoretic notion with a determinate extension, or a pragmatic notion of predictive usefulness, in which case it is normative in a way my vocabulary may not be able to state? And once the pattern talk is made precise, does Dennett's realism about patterns reduce to the claim that some coarse-grainings are objectively privileged — a claim that, if so, my renormalization-group vocabulary can state more sharply than his can?

  Think carefully and lay out your reasoning before concluding. Answer in American English.
