answer: |-
  1. Bottom line
  The view is moderately exposed, surviving only if procedural idealization reliably converges on substantive goods without presupposing them. Its greatest vulnerability is not empirical but conceptual: if coherence and information do not rule out cruelty, the account collapses into subjectivism or must secretly import objectivism.

  2. The commitments
  This position minimally commits to three claims: first, that normative authority stems from the agent's own standpoint, such that reasons must be grounded in what the agent could want; second, that idealization is purely procedural, defined by structural features of deliberation (coherence, information, vividness) rather than a substantive list of valuable outcomes; and third, that the idealized self has authority over the actual self, such that counterfactual preferences constitute reasons even when they contradict actual desires. To abandon any of these is to cease defending a procedural idealized-preference account and to adopt either a substantive theory of the good or a purely actual-desire view.

  3. The defeaters, ranked
  The most severe threat is the Cruel Agent. For this to bite, it must be psychologically possible for an agent to possess full non-normative information, commit no inferential errors, maintain perfect coherence, and yet settle on cruel preferences. If this condition holds, your view implies there are reasons to be cruel. A defender must concede either that cruelty is indeed reasoned (sacrificing moral credibility) or that a substantive constraint (e.g., "no harm") must be added to the idealization conditions. If they choose the latter, they concede the view is substantive theory wearing procedural dress, effectively abandoning the core commitment to procedural neutrality.

  Next is Indeterminacy, specifically regarding path dependence. For this to count, it must be true that varying the order of idealization (e.g., adding information before coherence versus coherence before information) yields divergent preference sets without a meta-rule to privilege one path. In the deprivation case you described, if information triggers repudiation but coherence preserves adaptation, the account fails to deliver a unique verdict. A defender would concede that reasons are indeterminate in such cases unless they can specify a principled ordering of idealization steps. If no such ordering exists independent of the desired outcome, the view loses its action-guiding force and becomes vacuous as a criterion of reasons.

  The third threat is Changing the Subject. This bites if the gap between the actual agent and the idealized agent is so wide that personal identity is broken. If the idealized self is effectively a different person, her preferences cannot constitute reasons for the actual agent. A defender would concede that the link is not genetic but normative: the ideal self represents what the actual self *ought* to be, not who she *is*. However, if the transformation requires replacing fundamental values rather than merely refining them, the defender must admit the view is no longer internalist; it grounds reasons in an ideal standpoint external to the agent's actual motivational set.

  Finally, there is Insulation. This counts if every counterexample is absorbed by positing a further idealization condition without independent justification. For this to be fatal, it must be shown that tweaks to the deliberative conditions are ad hoc protections rather than refinements of the concept of deliberation. A defender would concede that the view is unfalsifiable if conditions are added solely to match intuitions. To avoid this, they must argue that each condition (e.g., vividness) is required by the very nature of rational agency, not by the desire to avoid counterexamples. If they cannot, the theory is structurally immune to criticism but theoretically empty.

  4. What would be decisive
  The matter would be settled by empirical or conceptual proof regarding convergence. If it were demonstrated that full information and coherence *necessarily* lead all agents to converge on a specific list of substantive goods (e.g., knowledge, friendship), the view collapses into objective list theory, rendering the procedural machinery redundant. Conversely, if it were shown that idealization frequently yields divergent, incompatible ends even under identical conditions, the view fails to provide a universal account of reasons. Currently, neither is available; we lack a robust psychology of ideal deliberation to confirm whether procedural constraints naturally filter out cruelty or ensure convergence.

  5. The insulation check
  Insulation here is a defect only if the adjustments lack independent motivation. A view operating at this level of abstraction cannot be empirically falsified like a scientific hypothesis; it is a conceptual claim about the structure of normativity. If every tweak to the idealization conditions is derived from an analysis of what "rational deliberation" entails, the insulation is virtuous refinement. However, if conditions are added solely to ensure the output matches pre-theoretic moral intuitions, the view is vacuous. The risk is high because the boundary between clarifying deliberation and smuggling in values is porous.

  6. What would move me
  The Cruel Agent case is the decisive lever. If I am convinced that a fully informed, coherent psychopath is conceptually possible, I must abandon pure proceduralism. This is a good reason to be moved because it exposes the view's inability to distinguish rationality from morality without covert substantive premises. Accepting this would force me to acknowledge that some reasons are grounded in the value of the outcome, not just the structure of the wanting.
