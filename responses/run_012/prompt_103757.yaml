      *   *Crux 4: Falsifiability.* This is crucial.
          *   *Realist:* Show a case where internal structure is identical but we intuitively say "different mechanism" (hard to do). Or show that "privileged level" shifts arbitrarily without change in system.
          *   *Relativist:* Show a case where explanatory interest is fixed, but "same mechanism" judgment still varies wildly between competent observers.

