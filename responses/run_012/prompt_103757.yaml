answer: |-
  # Joint Statement on Mechanistic Identity and Anomaly Detection

  **Parties:** The Realists (Mechanism as mind-independent causal fact) and The Interest-Relativists (Mechanism as explanatory tool relative to contrast class).
  **Subject:** Defining "same mechanism" for the purpose of mechanistic anomaly detection (MAD).

  ## 1. Agreed Claims

  Both parties sign the following statements. Where terminology is potentially loaded, definitions are provided parenthetically.

  1.  **Behavior is Insufficient:** Two systems producing identical input-output (I/O) mappings on a test set do not necessarily instantiate the same mechanism. I/O equivalence is necessary but not sufficient for mechanistic identity.
  2.  **Internal Structure Matters:** A "mechanism" refers to the internal causal or computational pathway by which an input is transformed into an output. Anomaly detection must track changes in this pathway, not just changes in accuracy or loss.
  3.  **Clear Cases Exist:** There are edge cases where both parties agree on mechanistic difference. For example, a system that retrieves answers from a hard-coded lookup table is mechanistically distinct from a system that derives answers via generalizable reasoning, even if their outputs match on the current distribution.
  4.  **Anomaly Definition:** An "anomaly" in this context is an instance where the system produces the expected output (or high-confidence output) but does so via a causal pathway that deviates from the validated pathway. This is distinct from a "performance failure" (wrong output).
  5.  **Safety Relevance:** Both parties agree that mechanistic anomalies are safety-critical. A shift in mechanism implies that previous validation (based on the original mechanism) may not transfer to new distributions, adversarial inputs, or deployment contexts.
  6.  **The Disagreement is Not Purely Verbal:** This is not a dispute merely over the definition of the word "mechanism." Both sides agree internal structure matters. The dispute is ontological and pragmatic: whether the boundaries of that structure are fixed by the system itself (Realist) or by the observer's explanatory goals (Relativist).
  7.  **Abstraction is Necessary:** Both sides agree that we cannot track mechanisms at the level of individual transistors or neurons for complex systems. Some level of abstraction is required. The disagreement concerns whether there is a *correct* level of abstraction for a given system.

  ## 2. Residual Disagreements

  The following table outlines where the parties diverge. Each position is phrased to be acceptable to the holder of that view.

  | Issue | Realist Position | Interest-Relativist Position | The Crux & Test Case | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Privileged Level** | There exists a privileged level of description (e.g., algorithmic, circuit-level) where the mechanism is objectively implemented. Changes below this level are noise; changes above are abstraction. | There is no privileged level. Levels are chosen based on the "contrast class" (what alternatives are we ruling out?). A mechanism is only "the same" relative to a chosen grain. | **Crux:** Is the "true" mechanism observer-independent?<br>**Test:** Analyze a system at two distinct causal levels (e.g., logical gates vs. voltage flows). If the logic holds but voltage patterns shift drastically, is the mechanism preserved? | **Realist:** Mechanism is preserved (logic is the privileged level).<br>**Relativist:** Depends on the question. If asking about heat/energy, mechanism changed. If asking about computation, it didn't. |
  | **Distillation / Re-implementation** | A distilled model (smaller, different architecture) matching the teacher's behavior is a **different mechanism**. The causal graph has changed; the validation does not transfer. | A distilled model is the **same mechanism** *relative to the capacity of interest* (e.g., "solving math"). It is a *different mechanism* relative to implementation costs or training dynamics. | **Crux:** Is mechanism identity tied to architecture or capacity?<br>**Test:** Distill a Chain-of-Thought model into a standard transformer that matches output probabilities perfectly. | **Realist:** Different mechanism. Internal causal path (CoT vs. implicit) is structurally distinct.<br>**Relativist:** Same mechanism for the capacity "input-to-answer." Different mechanism for capacity "show your work." |
  | **Counterfactual Support** | If two systems share a mechanism, they must support the same counterfactuals across a broad range of interventions, regardless of whether those interventions are "natural." | Two systems share a mechanism if they support the same counterfactuals *within the relevant domain of inquiry*. Divergence outside that domain is irrelevant to identity. | **Crux:** How broad must counterfactual robustness be?<br>**Test:** Apply adversarial perturbations known to break one architecture but not the other, despite matching clean accuracy. | **Realist:** This proves they are different mechanisms.<br>**Relativist:** This proves the perturbations are outside the "relevant domain" for which the mechanism was individuated. |
  | **Falsifiability** | My view is falsified if we find a case where internal causal structure is identical (isomorphic graphs) but competent observers universally judge them as different mechanisms. | My view is falsified if we find a case where explanatory interest is fixed and explicit, but competent observers still cannot agree on mechanistic identity. | **Crux:** Can evidence move the needle?<br>**Test:** A blinded study of mechanistic judgments on synthetic circuits with known ground-truth causality. | **Realist:** Observers will converge on the ground truth structure.<br>**Relativist:** Observers will diverge based on unstated pragmatic goals. |

  ## 3. Note on Falsifiability and Evidence

  We acknowledge a risk that this debate may be resistant to empirical resolution.

  *   **To the Realists:** If "privileged level" is defined post-hoc to match intuition, the view risks unfalsifiability. To be moveable, you must specify *in advance* what criteria determine the privileged level (e.g., "the level with maximal causal compression") and accept a verdict if the data violates it.
  *   **To the Relativists:** If "relevant domain" can be shrunk indefinitely to protect the claim of "sameness," the view becomes trivial. To be moveable, you must accept that there are domains large enough (e.g., "all inputs within 2 standard deviations of deployment") where mechanism identity should be stable.

  **Joint Commitment:** We agree that if a proposed test case yields results that systematically violate the predictions listed above, the losing side will update their confidence. If, after three such tests, no update occurs, we will classify the dispute as metaphysical rather than scientific and cease adversarial collaboration on this specific definition.
