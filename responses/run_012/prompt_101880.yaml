      *   **The Commitment View:** When I assert $P$, I invite you to trust *me*. If I lie, I corrupt that trust. If I mislead, I invite you to infer $Q$, but I haven't staked my word on $Q$.
      *   **The "Laundering" nuance:** In the laundering case, the speaker is often *borderline* lying. If the aide says "meetings" knowing you assume "official meetings," is that misleading or lying? This is where casuistry comes in. Strictly true statements designed to deceive are often "mental reservations."
      *   **The Moral Difference:** The liar violates a norm of the practice of assertion itself. The misleader violates a norm of cooperation or helpfulness, but keeps the technical shield of truth. The shield matters because it preserves the possibility of accountability. If I lie, you can call me out directly ("You said X, X is false"). If I mislead, you have to unpack the implication ("You implied X"). The liar cuts off the recourse to truth; the misleader leaves a trail of breadcrumbs that technically leads back to truth, however obscure.
      *   **Addressing "Betrayal vs. Exploitation":** Betrayal attacks the foundation of testimony. Exploitation attacks my reasoning. It is worse to corrupt the source of knowledge (the speaker's word) than to manipulate the processor of knowledge (the hearer's inference).
