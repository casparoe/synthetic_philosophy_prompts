      *   **Claim:** The misleader exploits the gap between said and meant; the liar bridges it with falsehood. The machinery is the same.
      *   **Challenge:** Why is betrayal (lying) worse than exploitation (misleading) when damage is identical? Why should readers accept this fine distinction?

  3.  **Formulate the Philosopher's Response:**
