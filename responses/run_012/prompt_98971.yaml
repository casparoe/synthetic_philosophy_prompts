answer: |-
  # Activity Design: The No-Trade Trap

  ## 1. Overview & Learning Objectives
  **Goal:** To viscerally demonstrate the Milgrom-Stokey No-Trade Theorem. Students will experience the frustration of speculative trade in a Common Prior environment (Phase 1), then observe trade flourishing when Priors diverge (Phase 2).
  **Core Insight:** With common priors and common knowledge of rationality, price fully reveals information; therefore, speculative trade is impossible. Trade implies someone is irrational or priors differ.
  **Time:** 90 minutes.
  **Group Size:** 18 students (pairs or trios work best, but open floor trading is more chaotic/realistic). We will use open floor trading.

  ## 2. Materials
  *   **18 Envelopes (Labelled 'Private Info'):** Contain a single card (Red or Blue).
  *   **18 Envelopes (Labelled 'Instructions'):** 9 say 'Type A', 9 say 'Type B' (for Phase 2).
  *   **1 'Market Bag':** Opaque bag containing 10 Red chips and 10 Blue chips (for Phase 1).
  *   **Score Sheets:** One per student (grid for recording trades and final points).
  *   **Whiteboard:** For recording aggregate prices/volumes.
  *   **Counters/Tokens:** To represent 'Points' (optional, or just write on sheet).
  *   **Asset Certificates:** Small slips of paper representing '1 Unit of Asset'.

  ## 3. The Asset & Payoff Scheme
  *   **The Asset:** A contract that pays **100 Points** if a chip drawn from the **Market Bag** at the end of the session is **Red**. It pays **0 Points** if **Blue**.
  *   **Endowment:** Every student starts with **1 Asset** and **100 Points** cash.
  *   **Utility:** Points are linear (1 point = 1 unit of utility). No risk aversion.
  *   **Trading:** Students may buy or sell Assets for Points.
      *   *Seller:* Gives Asset, receives Points.
      *   *Buyer:* Gives Points, receives Asset.
  *   **Final Wealth:** Cash + Asset Value (0 or 100).
  *   **Incentive:** Top 3 scores get a small prize (chocolate/coffee voucher) to ensure competition.

  ## 4. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Distribute materials. Explain rules, payoff, and the Market Bag (50/50). Emphasise: "You all know the bag is 50/50." |
  | **10–12** | **Signal** | Students open 'Private Info' envelope. Draw 1 chip from a *personal* signal bag (80% correlated with Market Bag), note colour, return chip. |
  | **12–25** | **Round 1** | **Trading Session (Common Prior).** 13 minutes. Open floor. Record trades on Score Sheet. |
  | **25–35** | **Reveal 1** | Draw Market Chip. Calculate payouts. Ask: "Who traded? Who feels they lost out?" |
  | **35–40** | **Reset** | Collect Assets/Cash. Redistribute endowments (1 Asset, 100 Cash). **Crucial:** Hand out new 'Instructions' envelopes quietly. |
  | **40–42** | **Signal** | Same signal process as Round 1. |
  | **42–55** | **Round 2** | **Trading Session (Heterogeneous Priors).** 13 minutes. |
  | **55–65** | **Reveal 2** | Draw Market Chip. Calculate payouts. Compare volume to Round 1. |
  | **65–90** | **Debrief** | Map experience to theory (see below). |

  ## 5. Detailed Rules & Roles

  **Instructor Role:** Market Regulator. Do not intervene in trades unless rules are broken. Record aggregate volume on the board every 3 minutes to create price pressure.

  **Student Instructions (Phase 1):**
  1.  **Common Knowledge:** "The Market Bag contains exactly 50 Red and 50 Blue chips. Everyone knows this. Everyone knows everyone knows this."
  2.  **Private Signal:** "Your private envelope contains a signal drawn from a bag correlated with the Market Bag. If Market is Red, 80% of signals are Red. If Market is Blue, 80% of signals are Blue."
  3.  **Task:** "Maximise your final points. You may trade with anyone."
  4.  **Constraint:** "Do not show your signal card to anyone. You may only state a price."

  **Student Instructions (Phase 2):**
  *   **Group A (9 students):** "You are told the Market Bag is likely biased towards Red (70% Red, 30% Blue)."
  *   **Group B (9 students):** "You are told the Market Bag is likely biased towards Blue (30% Red, 70% Blue)."
  *   **Secrecy:** "Do not discuss your Instructions. Only discuss price." (This creates the heterogeneous prior without them immediately realising the source of disagreement).

  ## 6. The Debrief: Mapping Experience to Theory

  **Step 1: The Round 1 Squeeze (20 mins)**
  *   **Ask:** "In Round 1, why did you trade?"
      *   *Expected Answer:* "My signal was Red, so I valued it at 80 points. Someone else offered 60."
  *   **The Trap:** "If you are rational, and you know *they* are rational, and you know you both started with the same 50/50 prior... why did they sell at 60?"
      *   *Lead them:* "If they sell, they must think it's worth less than 60. If they think that, they must have a Blue signal. If you know they have a Blue signal, you should update your own belief. Your Red signal is now cancelled out by their Blue signal. You should revert to the prior (50). At 50, no trade happens."
  *   **The Feeling:** "Did anyone feel a moment of hesitation? 'Why are they so keen to sell to me?'" That hesitation is the No-Trade Theorem kicking in. The theorem says that hesitation should have stopped the trade entirely.
  *   **Concept:** **Common Knowledge of Rationality.** If we know we are both smart, the *offer itself* conveys information.

  **Step 2: The Round 2 Explosion (15 mins)**
  *   **Ask:** "Did trade volume increase in Round 2?" (It should have).
  *   **Reveal:** "Group A, what did your instructions say? Group B, what did yours say?"
  *   **The Lesson:** "Now you disagree on the *base rate*. Even if you share signals, you start from different places. You can 'agree to disagree'."
  *   **Concept:** **Heterogeneous Priors.** This is the assumption we dropped. Once priors differ, trade is rational again because we don't infer the same information from the same price.

  **Step 3: Speculation vs. Hedging (10 mins)**
  *   **Ask:** "The theorem bans *speculative* trade. What about hedging?"
  *   **Discussion:** "Did anyone trade because they were risk-averse?"
      *   *Correction:* "We made points linear. You shouldn't be risk-averse. Did anyone trade because they needed cash for something else?" (No).
      *   *Conclusion:* "All trade you observed was speculative. In the real world, people trade for liquidity or hedging. That's why markets exist. But *pure speculation* between rational agents with common priors is impossible."

  ## 7. What Will Definitely Go Wrong (and Fixes)

  | Problem | Why it happens | Fix |
  | :--- | :--- | :--- |
  | **Confusion on Payoffs** | Students miscalculate expected value (e.g., think Red signal = 100% Red). | Provide a **Cheat Sheet** with a table: Signal Red = 80pts value, Signal Blue = 20pts value. Keep the math trivial. |
  | **Collusion** | Friends split points to game the prize. | Remind them the prize is for *individual* top scores. Walk around during trading. |
  | **Round 1 Fizzle** | Students are too shy to trade. | Act as a market maker initially. "I'll buy at 40!" to get the ball rolling, then step back. |
  | **Prior Leakage** | In Round 2, students shout "My instructions say Red!" | Strict rule: "If you reveal instructions, you are disqualified from the prize." |
  | **The "Rationality" Gap** | Students say "The theorem is wrong because we traded." | Acknowledge this. "The theorem assumes *hyper*-rationality. You are human. The point is to see the *pressure* the theorem exerts, not to prove you are robots." |

  ## 8. Limitations (What the Game Cannot Do)
  You must supply this from the front of the room:
  1.  **Common Knowledge of Rationality:** The game cannot enforce this. Students *know* their classmates are not perfectly rational Bayesians. The theorem fails in the room precisely because this assumption is false. You must explain that the theorem describes a world of perfect mirrors, whereas the classroom is a world of foggy glass.
  2.  **Iterative Updating:** The theorem relies on infinite iterations of "I know that you know that I know." The 13-minute trading window doesn't allow for this convergence. You must explain that the *tendency* should be towards no trade, even if they don't reach equilibrium.
  3.  **Risk Neutrality:** While you set points to be linear, students may still feel risk aversion psychologically. Remind them in the debrief that true hedging requires different risk profiles, which were not assigned.

  ## 9. Instructor Script Snippet (For the Debrief)
  "In Round 1, if you bought, you thought the asset was underpriced. If you sold, you thought it was overpriced. But you both know the bag is 50/50. You both know you both saw a signal. If I am willing to sell to you, I am effectively telling you 'My signal is Blue'. If you are rational, you should listen to me. You should downgrade your valuation. If I know you will do that, I shouldn't have offered to sell at that price. We chase each other's tails until the price settles at the truth and trade stops. The fact that you *did* trade means either you aren't rational, or you don't trust *me* to be rational. The theorem says if we *were* perfect, we'd just shake hands and keep our endowments."

  \answer{The Common Prior Assumption}
