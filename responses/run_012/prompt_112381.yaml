answer: |-
  The central question of welfare economics is metric: by what standard do we judge a policy successful? The dominant tradition answers with the preferences of the affected individuals. However, a critical fissure exists within this tradition between welfare as preference-realization and welfare as reflective endorsement. The former, which I shall call **WR**, holds that a person's good consists in the satisfaction of the preferences their actual choices reveal. The latter, **RE**, holds that a person's good consists in the satisfaction of preferences they would hold under conditions of adequate information, undistorted by framing, and upon calm reflection.

  This essay assesses the package that equates welfare with WR. I argue that while WR is operationally superior, it is philosophically vulnerable. However, RE, intended to fix these vulnerabilities, either collapses back into WR or abandons the preference-based framework entirely. Through an analysis of a specific test case—the agent who knowingly chooses harm—and an examination of technical and autonomy-based objections, I conclude that policy evaluation must adopt a hybrid model. This model uses WR as the primary metric but employs RE strictly as a procedural check on decision-making architecture, accepting the cost that some genuinely harmful choices must be counted as welfare-enhancing to preserve agency.

  To evaluate these conceptions, we must apply them to the stipulated test case: a person who knowingly maintains a preference that damages them (e.g., a health-compromising addiction) and, when asked about the preference itself, states they would not choose to have it removed. This case is designed to block the standard escape route for paternalism, which usually relies on ignorance or impulsivity.

  Under **WR**, the verdict is straightforward. The agent chooses the harmful option over the alternative. Therefore, satisfying this preference increases their welfare. A policy restricting this choice reduces their welfare, regardless of the physical damage incurred. The choice is authoritative.

  Under **RE**, the verdict is more complex but ultimately convergent if RE remains true to its definition. RE defines welfare by what the agent would endorse *on reflection* with *adequate information*. In our test case, the agent is stipulated to be knowing and reflective about the preference itself. They endorse the preference even when the preference is the object of scrutiny. If RE respects this reflective judgment, it must conclude that welfare is increased by satisfying the preference, identical to WR. If, however, the RE theorist claims the agent's welfare is *decreased* despite this reflective endorsement, RE has ceased to be a preference-based theory. It has imported an external, objective standard of "damage" that overrides the agent's own reflective valuation. Thus, in the hard case, WR and RE are either indistinguishable in practice, or RE reveals itself to be a form of objective-list welfare disguised as preference satisfaction.

  This leads to the first major objection: does RE have any content that is not itself a revealed preference, or does it collapse? Proponents of RE argue that actual choices are often distorted by framing, cognitive bias, or lack of information. They posit a "true" preference hidden behind the "noisy" actual choice. However, accessing this true preference requires a standard of distortion. If the standard is "what they would choose if they weren't distorted," we face a regress: how do we know the counterfactual choice isn't also distorted? We usually infer the distortion by comparing the choice to an objective norm (e.g., "choosing less money is irrational"). But once we import an objective norm of rationality or well-being to identify the distortion, we are no longer measuring welfare by preference; we are measuring it by conformity to that norm. Consequently, RE either collapses into WR (by accepting the agent's reflective word as final) or it becomes paternalistic objective welfare (by overriding the agent's reflective word). There is no stable middle ground where RE corrects preferences without importing non-preference values.

  We must next weigh the familiar technical objections to choice-based welfare: adaptive preferences, framing sensitivity, and ordinality.

  **Framing and elicitation order** devastate WR. If a person chooses A over B when A is the default, but B over A when B is the default, WR cannot determine which choice reveals their good. RE attempts to solve this by positing an ideal elicitation environment. However, since no such environment exists empirically, RE renders welfare unmeasurable for policy purposes. WR is flawed but measurable; RE is coherent but inaccessible.

  **Adaptive preferences** (e.g., the contented slave) are often cited as a failure of WR. WR implies the slave's welfare is high because they choose their condition. RE claims to fix this by asking what the slave would choose with knowledge of freedom. Yet, in our test case, the agent *has* the knowledge and still chooses the "damaging" path. The adaptive preference objection relies on the assumption that the agent is unaware of alternatives or psychologically broken. If the agent is reflectively intact, the objection loses force against both WR and RE. Both must respect the agent's valuation of their own life, however adapted.

  **Ordinality and aggregation** strike both conceptions equally. Whether preferences are actual or reflective, they are rankings. Neither WR nor RE provides a cardinal unit of welfare (utils) that allows for interpersonal comparison or cost-benefit aggregation. To move from "Person X prefers A" to "Policy P increases total welfare," one must assume interpersonal comparability of preference satisfaction. RE adds no mathematical machinery to solve this. It inherits the aggregation problem of WR without offering a solution.

  A deeper philosophical problem concerns the **temporal self**. Preferences change over time. A person may choose to smoke at age 20 (WR says this is good for them) but prefer to have never smoked at age 50. Which self counts? WR typically defaults to the ex-ante choice or the ex-post satisfaction, leading to contradictions. RE attempts to identify the "authentic" self—the one that reflects calmly. But if a person's reflective values shift over time (e.g., valuing thrill in youth and security in age), RE offers no principle to privilege one reflective self over another. Neither framework can internally resolve the conflict between temporal selves; both require an external rule, such as "prioritize future health" or "prioritize current autonomy."

  This brings us to the **autonomy-based defense**. The primary argument for WR is that a person's own choices are authoritative simply because they are theirs. To override them is to treat the person as a child. Can this defense extend to RE? Only if RE is viewed as helping the agent do what they *really* want (soft paternalism). But in the test case, the agent explicitly states they do not want the preference removed. To override this based on a hypothetical "better" reflection is hard paternalism. It asserts that the policymaker knows the agent's good better than the agent does, even upon reflection. The autonomy defense works for WR because it respects sovereignty. It fails for RE when RE contradicts actual choice, because it substitutes the theorist's model of the agent for the agent themselves.

  We are left with a dilemma. WR respects autonomy and is measurable but allows for "mistakes" that look like harm. RE promises to correct mistakes but risks tyranny and unmeasurability.

  **Verdict**

  Policy evaluation should adopt a **Procedural Hybrid** that prioritizes **Welfare as Preference-Realization (WR)** as the substantive metric, while using **Reflective Endorsement (RE)** solely as a diagnostic tool for process design.

  In this hybrid, the default assumption is that actual choices reveal welfare (WR). If an agent chooses X over Y, policy should treat X as welfare-enhancing. This preserves the autonomy defense and ensures measurability. However, RE plays a critical role in the *architecture* of choice. Policymakers must use RE to identify and mitigate systemic distortions—such as deceptive framing, information asymmetries, or coercive contexts—before the choice is made. The goal of policy is to create conditions where WR approximates RE as closely as possible, without ever allowing RE to override the final choice.

  **The Roles:**
  1.  **WR (Substantive):** Determines the success of the policy. If people choose it, it counts as welfare.
  2.  **RE (Procedural):** Determines the design of the choice environment. Ensures information is clear, defaults are neutral, and cooling-off periods exist for high-stakes decisions.

  **The Costs:**
  This hybrid incurs two specific costs. First, it must accept the **Test Case Verdict**: If a fully informed, reflective agent chooses a self-damaging option, policy must record this as a welfare increase. We sacrifice objective well-being to preserve sovereignty. To do otherwise is to claim the state owns the citizen's life. Second, it accepts **Measurement Imprecision**: By relying on WR, we acknowledge that framing effects will never be fully eliminated, meaning welfare metrics will always contain noise. We accept this noise as the price of avoiding the paternalism inherent in trying to calculate "true" reflective preferences.

  In conclusion, the notion of welfare needed for policy cannot be defined by revealed preferences alone if "revealed" includes distorted choices. However, it cannot be defined by reflective preferences if "reflective" allows the state to override the agent's own judgment. The only defensible position is to treat welfare as the satisfaction of actual preferences, while treating the *conditions* of those preferences as a matter of public justice. We must maximize what people want, but ensure they are not tricked into wanting it.
