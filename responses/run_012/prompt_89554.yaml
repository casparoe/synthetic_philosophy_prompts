answer: |-
  # The Legacy Lattice: A Sorting Quiz

  **Introduction**
  In the writing of a family saga, money is never just currency; it is memory, power, and constraint. This quiz is designed to locate your philosophical center of gravity regarding inheritance. It does not ask about tax rates. It asks about the specific human situations where wealth changes shape. Answer based on your instinct for the *right outcome* in each case, not the policy you think could achieve it.

  ***

  ### The Questions

  **1. The Family Firm**
  The family manufacturing business is profitable but fragile. If the fortune is divided equally among the four heirs, the company must be sold to pay the shares, and 500 jobs vanish. If the fortune goes entirely to the one heir who runs the firm, the other three get nothing.
  *   **A.** The firm must be kept whole for the employees and the family name, even if it means disinheriting the siblings.
  *   **B.** The assets should be liquidated and divided; the market will decide if the firm survives.
  *   **C.** The state should take a minority stake to subsidize the buyout, preserving jobs without starving the siblings.

  **2. The Social Currency**
  A portion of the fortune is not liquid cash but membership in exclusive networks: board seats, club memberships, and private school legacies that guarantee political access.
  *   **A.** This is the core of the advantage; it should be broken up or taxed as heavily as cash.
  *   **B.** This is freedom of association; the government cannot regulate who invites whom to dinner.
  *   **C.** This is cultural capital; it matters less than ensuring everyone has a baseline income, regardless of access.

  **3. The Skip-Generation Trust**
  A grandmother sets up a trust that bypasses her own children (who are already wealthy) to endow her grandchildren, shielding the money from one round of estate taxes.
  *   **A.** It is her property to direct; if she prefers her grandchildren, that is her prerogative.
  *   **B.** This is a loophole that entrenches dynasty; the tax code should treat the grandchildren as direct heirs.
  *   **C.** This is a recognition that the middle generation had its turn; wealth should leapfrog to where it can do the most good.

  **4. The Penitent Heir**
  An heir publicly renounces their trust fund on moral grounds but continues to use the family surname to secure book deals, introductions, and influence.
  *   **A.** This is hypocrisy; the name is just another form of the money they rejected.
  *   **B.** This is pragmatic; they are using the platform to do good, which justifies keeping the name.
  *   **C.** This is irrelevant; the harm was done when the money was accumulated, not when it was spent.

  **5. The Founder vs. The Steward**
  Compare the first-generation founder who worked 80-hour weeks to build the fortune against the third-generation heir who manages the portfolio and lives off the yield.
  *   **A.** The founder earned the right to dispose of it; the heir is merely a custodian of unearned power.
  *   **B.** Both are entitled to the wealth; property rights do not expire after one generation.
  *   **C.** Neither is truly entitled; the founder exploited labor, and the heir benefits from that original sin.

  **6. The Philanthropic Shield**
  The family establishes a private foundation to manage their wealth, claiming tax-exempt status while retaining control over the assets and granting board seats to family members.
  *   **A.** This is a necessary incentive for private charity; let them do good with their own money.
  *   **B.** This is a tax shelter; if it's public benefit, the public should control the board.
  *   **C.** This is a distraction; the money should have been taxed and spent by the government directly.

  **7. The Perpetual Trust**
  A legal instrument is designed to keep the family wealth intact in perpetuity, preventing any future heir from ever spending the principal.
  *   **A.** This is the "dead hand" controlling the living; such trusts should be voided after a set period.
  *   **B.** This is responsible stewardship; it prevents heirs from squandering the family's legacy.
  *   **C.** This is an affront to democracy; no private power should exist forever.

  **8. The Universal Stake**
  Instead of taxing inheritance at death, the government proposes giving every citizen a substantial cash endowment at age 21, funded by a levy on large estates.
  *   **A.** This is the best compromise; it respects bequest but equalizes the starting line.
  *   **B.** This is theft; it treats private savings as public revenue.
  *   **C.** This is insufficient; it legitimizes inequality by putting a price on it rather than ending bequest.

  ***

  ### Scoring Key

  Tally your answers. While human belief is rarely linear, your preponderance of choices suggests one of four distinct positions.

  #### Mostly A: The Sovereign (Propertarian & Familialist)
  **Core Belief:** Bequest is a protected exercise of liberty, and the family is a site of legitimate partiality that limits what equality can demand.
  **The View:** You prioritize the right of the giver over the condition of the receiver. You see the family unit as a sovereign entity with the right to perpetuate its values and resources against the state. You are willing to accept inequality as the cost of freedom.
  **The Awkward Commitment:** You must accept that your defense of family liberty inevitably creates a hereditary aristocracy that undermines political democracy.

  #### Mostly B: The Architect (Meritocratic Liberal)
  **Core Belief:** The operative baseline is equal starting resources; inheritance is acceptable only if it does not distort equality of opportunity.
  **The View:** You distinguish between the "earned" wealth of the founder and the "unearned" advantage of the heir. You support taxes or regulations that level the playing field (like closing skip-gen loopholes) but do not seek to abolish wealth itself. You want a fair race, not necessarily a tied finish.
  **The Awkward Commitment:** You must accept that "merit" is often just masked inheritance, and your reforms may never fully disentangle the two.

  #### Mostly C: The Leveller (Structural Egalitarian)
  **Core Belief:** The operative baseline is the absence of concentrated private power over others; inheritance is a transfer of political dominance, not just money.
  **The View:** You view large fortunes as inherently coercive. Whether the money is liquid or social capital (Case 2), you see it as a threat to democratic equality. You favor caps, strict limits on perpetuity, or the outright abolition of bequest to prevent oligarchy.
  **The Awkward Commitment:** You must accept that breaking up concentrated wealth requires state intrusion into intimate family decisions that borders on authoritarianism.

  #### Mostly D: The Citizen (Social Democrat / Universalist)
  **Core Belief:** The remedy must be a public inheritance for everyone; private accumulation should be converted into a civic stake.
  **The View:** You are less concerned with punishing the rich than with empowering the rest. You favor mechanisms like "baby bonds" or universal endowments (Case 8). You view inheritance not as a family right but as a societal surplus that should be distributed to all young adults.
  **The Awkward Commitment:** You must accept that the state, not the family, becomes the primary benefactor of the young, fundamentally altering the parent-child bond.

  ***

  ### Indistinguishable Positions & Blind Spots

  **The Meritocrat and The Leveller**
  On questions regarding the *Family Firm* (Q1) and *Philanthropy* (Q6), the Architect (Meritocrat) and The Leveller often select the same options (favoring liquidation or public control). This quiz cannot separate them on those specific points. They diverge only on the *goal*: The Architect wants fair competition; The Leveller wants to reduce power differentials. If you scored mixed B/C, you likely hold a hybrid view where equality of opportunity is the path to equality of power.

  **The "Unnamed" Position**
  If you answered **C** on Q1, Q3, and Q7, but **B** on Q2 and Q8, you hold a position rarely articulated in policy: *The Cultural Abolitionist.* You believe financial inheritance should be curtailed, but social capital (names, connections) is untouchable culture.
  **The Awkward Commitment:** You must accept that by leaving social capital intact while taxing financial capital, you ensure that the wealthy simply convert their money into influence before the taxman arrives.

  **The "Renunciation" Blind Spot**
  Question 4 (The Penitent Heir) is the true outlier. If you answered **A** here but **B** elsewhere, you are a *Moral Consistency Absolutist.* You care less about the structure of wealth than the integrity of the individual. No policy category fully captures this, as it is an ethical stance rather than a political one.
