      *   **The Film Projector Analogy:** This hints at *discretization* of time/space (atomism) vs. continuity. It suggests motion might be an illusion or emergent property.
      *   **The User's Assumption:** "If the paradox was at bottom a confusion about whether an endless sum can have a finite value... what follows for our understanding of motion, of time, and of the relation between a mathematical description of a thing and the thing itself?"
