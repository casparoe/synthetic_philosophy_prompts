  3.  **Identify the Philosophical Gap (The "Live Question"):**
      *   Mathematics describes *how* to sum the distances. It doesn't explain *what* motion is.
      *   **Benacerraf's Point:** Paul Benacerraf (1962) famously argued that the calculus solution addresses the *result* (Achilles catches the tortoise) but not the *process* (how does he traverse the infinite tasks?).
      *   **The "At-At" Theory:** Russell's view (motion is just being at place $x$ at time $t$). This leads to the "Cinematographic View of Time."
      *   **The Problem of Change:** If time is a series of instants (like film frames), when does motion happen? Not in an instant (frozen), not between instants (no time). This is the *Arrow Paradox*, which the user mentioned but dismissed too quickly.
      *   **Physical vs. Mathematical Space:** Is space actually infinitely divisible (continuum) or is it pixelated (Planck length)? Calculus assumes the former; physics is unsure about the latter.
