  **Recommendation**
  I recommend we **grant the application**, subject to the strict recusal of the two trustees who co-authored with Priya. We should simultaneously minute a resolution to amend the Deed at the earliest opportunity to introduce a defined cooling-off period.

  **Interpretation and Construction**
  To reach this conclusion, we must distinguish between interpreting the rule and constructing its effect. **Interpretation settles the semantic meaning of the words; construction determines their legal effect when that meaning is vague or conflicts with purpose.**

  The clause states: "No grant shall be made to any person who *is*, at the time the grant is approved, a trustee." Interpretation yields a plain meaning: eligibility turns on current status. Priya resigned in March; approval is sought now. She is not a trustee. Textually, she is eligible.

  However, the founder's minutes indicate a purpose: preventing trustees from "helping themselves" and avoiding the appearance of self-dealing. This invites construction. Does the purpose override the text? Where the text is clear, purposive construction should generally yield to it unless it produces an absurdity. Funding a qualified former trustee is not absurd; it is merely risky. The text draws a bright line at resignation. We should respect that line unless practice dictates otherwise.

  **Liquidation and Practice**
  The Deed instructs us to regard "settled practice" where meaning is unclear. This invokes the concept of liquidation. **Liquidation suggests a vague rule's meaning gets fixed by a long course of consistent practice rather than by further textual analysis.**

  Here, liquidation fails. Our precedents are contradictory. In 2021, we refused a former trustee (eight months off) based on the purpose of the rule. In 2023, we granted a former trustee (two years off) with minimal discussion. Because the practice is inconsistent, it cannot "liquidate" or fix the meaning of the clause. We are not bound by the 2021 refusal any more than the 2023 grant. We stand back at the text.

  **The Bias Check**
  I must be straight about the elephant in the room. We all want to fund this project; it fits our strategy perfectly. I do not trust that we would even be having this conversation if the applicant were someone we disliked or who lacked internal champions. If this were a stranger, we would likely approve it without debating the Deed.

  However, acknowledging this bias does not compel us to refuse. It compels us to be rigorous about process. The text allows the grant. The strategic fit is high. The bias risk is managed not by refusing the grant, but by ensuring the conflict of interest regarding the co-authors is handled visibly and strictly.

  **The Case for Refusal**
  The strongest argument against me is purposivist. The founder's intent was to protect the Fund's reputation, not just prevent literal simultaneous self-dealing. A trustee resigning in January to apply for money in March looks precisely like the "vehicle for its own people" the founder feared. The 2021 precedent established a normative expectation, however wobbly, that resignation does not immediately cure eligibility. By granting this, we signal that trustees can resign and cash out, potentially incentivising strategic resignations in the future. We risk looking like a club that looks after its own, regardless of what the grammar of the Deed permits.

  **Future Governance**
  We cannot leave this rule as it stands. The inconsistency of our practice proves that relying on "settled practice" is unsafe when the board composition changes. Liquidation requires consistency; we have none.

  We should not merely minute a construction of the clause, as that remains vulnerable to challenge by future trustees who prefer the 2021 view. Nor should we rely on a simple resolution, which might be ultra vires if it contradicts the Deed. We must **amend the Deed**. I propose we draft a clause specifying a cooling-off period (e.g., 12 months) for former trustees. This balances the textual clarity we need with the purposive safeguard the founder intended.

  **Conclusion**
  The text permits the grant. The practice does not forbid it. The strategic need is clear. We should approve the funding, recuse the conflicted trustees, and fix the rule for next time.

