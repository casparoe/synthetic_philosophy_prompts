prompt: |-
  I'm marking essays for a second-year module called Evolution and Philosophy — I somehow ended up as the TA for it even though my own degree was in zoology and I've never formally studied any philosophy, so I'm fine on the biology side and out of my depth on the rest. I've got about fourty of these to get through before Thursday, and I can never tell wether I'm being too soft or too harsh, so I'd like a second opinion on one of them. The essay question was: "Explain the spandrels argument against adaptationism and assess how much of the adaptationist programme it actually damages." In the lecture the students were given a three-way distinction they were told to use: adaptationism as an empirical claim (selection is the dominant and ubiquitous cause of evolutionary change), adaptationism as a method (when you meet a trait, start by asking what it is for), and the strong reading (every trait is optimally designed, so any apparent imperfection gets explained away as a trade-off or a constraint). They were also told that byproducts of architecture or development, developmental constraints, and genetic drift are three different kinds of non-selection explanation and shouldn't be lumped togther.

  Here's the answer, copied out as it came in:

  "Gould and Lewontin attack what they call the Panglossian paradigm, the habit of assuming that every trait is the best possible design for a function. Their illustration is the spandrels of San Marco: the triangular spaces between the arches under the dome exist only because of the way a dome has to sit on round arches, so they are not there for anything, even though they are decorated with the four evangelists. The moral is that lots of traits may be byproducts of the way a body is put together rather than adaptations, and that adaptationists should rule those out before telling just-so stories about how useful a trait is. What the critique is really aimed at is the methodological rule that you look for selection first when you meet a trait; that is the habit they want replaced with a pluralism that gives drift and developmental constraint equal weight. So their complaint is about how biologists go about their research rather than about what the living world is actually like — traits that look like these spandrels are around for random reasons, drift and developmental constraint and that sort of thing, rather than because they were selected for. The critique is fair up to a point, since adaptationists do sometimes stop at the first plausible story, but optimality models can be tested against data, and the spandrel point on its own does not show that selection is unimportant. So the paper is a useful warning against lazy adaptationism rather than a refutation of selection."

  What I want is a mark out of 20 and then the comments I'd actually write on the script — not a corrected version of the essay, and not an overall impression. Please give it to me as exactly five numbered points, each one or two sentences, with no introduction and no closing remarks: the first point should be the mark with a one-line reason, and the other four should be the individual comments in the order I should write them, each one saying which bit of the answer it applies to and why it counts for or against the student. British English, please.
