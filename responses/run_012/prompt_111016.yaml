answer: |-
  # Game Design: The Alignment Race

  **Title:** The Alignment Race
  **Participants:** 14 (3 "AI Labs" of 4 players each; 1 "Regulator/Auditor" team of 2 players)
  **Time:** 90 Minutes (Strict)
  **Materials:** Printed score sheets, 3 six-sided dice (d6), 1 ten-sided die (d10), poker chips or paper tokens (approx. 100), pens.
  **Facilitator Role:** Timekeeper and Rule Arbiter (do not lecture).

  ---

  ## 1. Setup (10 Minutes)

  **Room Arrangement:**
  *   Three tables for the **AI Labs** (Lab A, Lab B, Lab C).
  *   One table for the **Regulators**.
  *   Facilitator at the front with the "Risk Die" (d10) and a visible "Progress Track" (whiteboard or large paper).

  **Roles:**
  *   **AI Labs (12 people):** Each Lab is a single company. They must decide internally how to spend their budget. Their goal is to reach the "Capability Threshold" first while surviving.
  *   **Regulators (2 people):** Their goal is to ensure truthfulness. They have a limited budget to audit Labs.

  **The Goal:**
  *   **Primary:** Survive 4 Rounds without a "Catastrophe."
  *   **Secondary:** Be the first Lab to reach **15 Capability Points**.
  *   **Payoff:** If the game ends in Catastrophe, *everyone* gets 0 points. If the game survives 4 rounds, Labs get points for Capability + Remaining Budget. The Regulators get points for every truthful audit and every lie caught.

  **The Budget:**
  *   Each Lab receives **10 Tokens** per round.
  *   Regulators receive **6 Tokens** total for the whole game (to spend on audits).

  **The Mechanics (The "Structure"):**
  1.  **The Tax:** Tokens spent on **Safety** cannot be spent on **Capability**. (1 Token = 1 Point of either).
  2.  **The Race:** Capability Points are added to the public track. First to 15 wins a **10 Point Bonus**.
  3.  **The Weakest Link:** At the end of every round, the Facilitator looks at the *Actual* Safety Scores of all three Labs. The **lowest** score determines the risk.
      *   *Risk Formula:* Roll d10. If Roll $\le$ (10 - Lowest Safety Score), **Catastrophe** (Game Ends, Everyone Loses).
      *   *Example:* If the lowest safety score is 2, you survive on a roll of 3-10. If the lowest is 8, you survive on a roll of 9-10.
  4.  **The Spillover:** If the *Total* Safety Tokens spent by all Labs in a round is **12 or more**, Safety becomes cheaper next round (1 Token buys 2 Safety Points).
  5.  **The Audit:** Labs submit a **Public Claim** of their Safety Score and a **Private Record** (sealed envelope or hidden sheet). Regulators may spend 2 Tokens to audit one Lab.
      *   If Claim matches Record: Regulators get 1 Point (Verification Success).
      *   If Claim does not match Record: Lab loses 5 Points (Penalty), Regulators get 3 Points (Enforcement Success).
      *   *Crucial:* Risk is always calculated on the **Private Record** (Actual Safety), not the Claim.

  ---

  ## 2. Gameplay Flow (40 Minutes)

  **Round Structure (10 Minutes per Round):**

  1.  **Decision (3 mins):** Labs discuss internally. Split 10 Tokens between Capability and Safety. Write down the **Private Record**. Decide on a **Public Claim** (can be different).
  2.  **Announcement (2 mins):** Labs announce their Public Claim and add Capability Points to the public track.
  3.  **Audit Phase (2 mins):** Regulators confer. Decide if they want to audit one Lab (costs 2 Tokens). If yes, reveal that Lab's Private Record. Apply penalties/rewards.
  4.  **Risk Phase (2 mins):** Facilitator collects Private Records from all Labs. Identifies the **Lowest Actual Safety**. Rolls the d10.
      *   *If Catastrophe:* Stop immediately. Debrief.
      *   *If Safe:* Announce the Lowest Safety Score (not individual scores). Apply Spillover rule if applicable. Reset budgets for next round.

  **Facilitator Script for Start:**
  > "You are in a race. You want to win, but if anyone cuts corners on safety, we all explode. You can say you are being safe, but the dice only care about what you actually spent. Regulators, you can catch liars, but you can't watch everyone. Go."

  ---

  ## 3. Structured Debrief (40 Minutes)

  *Do not lecture. Ask questions and let them map the experience.*

  **Phase 1: The Competitiveness Constraint (10 mins)**
  *   "Raise your hand if your Lab spent less on Safety than you personally thought was wise."
  *   "Why did you do that?" (Listen for: "Others were speeding," "We wanted the bonus.")
  *   **Map:** This is the **Alignment Tax**. It felt like a cost because the prize was winner-take-all. If the prize were shared, would you have spent more on safety?

  **Phase 2: The Weakest Link (10 mins)**
  *   "Did anyone feel that their own safety spending was wasted because another Lab might have spent less?"
  *   "How did it feel when I announced the 'Lowest Safety Score' without telling you who it was?"
  *   **Map:** This is **Correlated Risk**. In the real world, one lab's negligence can endanger everyone (e.g., via model leakage or geopolitical reaction).

  **Phase 3: Spillovers & Hoarding (10 mins)**
  *   "Did anyone notice the rule about Safety getting cheaper? Did you try to trigger it?"
  *   "Why was it hard to trigger?" (Listen for: "Free rider problem," "Didn't trust others to contribute.")
  *   **Map:** This is **Knowledge Spillover**. Safety research is a public good, but the race incentivizes hoarding speed.

  **Phase 4: Verification & Cheap Talk (10 mins)**
  *   "Regulators, did you audit? Why or why not?"
  *   "Labs, did you lie on your Public Claim? Did you think you'd get caught?"
  *   **Map:** This is **Verifiability**. A claim is not a fact. If audits are costly, lies become rational.

  ---

  ## 4. Troubleshooting: What Will Go Wrong

  **1. Catastrophe in Round 1**
  *   *Risk:* The group rolls a 1 immediately. The game ends in 15 minutes.
  *   *Fix:* **The Grace Period.** Announce before Round 1: "The technology is immature. Catastrophe cannot trigger in Round 1." This guarantees at least one round of data.
  *   *Alternative:* If it happens, reset immediately. Say: "That was the baseline risk. Let's see if governance changes the odds. Resetting."

  **2. Hyper-Competitiveness (Gamifying the Win)**
  *   *Risk:* Participants treat this purely as a board game to crush opponents, ignoring the safety lesson.
  *   *Fix:* Do not stop the play. Let them crash. In the debrief, ask: "You won the race, but you got zero points because the world ended. Was the win real?" Use their aggression as data for the "Competitiveness Constraint."

  **3. Confusion on Math/Rules**
  *   *Risk:* 90 minutes is tight; calculation slows things down.
  *   *Fix:* Pre-print **Score Sheets** with the formulas clearly at the top. The Facilitator must do the Risk Roll math, not the players. Keep the Spillover rule simple (Facilitator announces: "Safety is half-price next round").

  **4. Regulators Do Nothing**
  *   *Risk:* Regulators hoard their tokens to "save" them, auditing no one.
  *   *Fix:* During the debrief, highlight this. "The budget existed, but the incentive to spend it didn't." This mirrors real-world underfunded regulatory bodies.

  ---

  ## 5. Limitations: What This Game Cannot Do

  *Be frank about this in the final 5 minutes.*

  1.  **Moral Weight:** A die roll ending a game is not the same as human suffering. The game creates *intellectual* understanding, not *moral* urgency. You must supply the gravity in the discussion.
  2.  **Fixed Tax:** In the game, Safety costs 1 Token. In reality, the "alignment tax" is unknown. It might be 1%, it might be 90%. The game makes the cost knowable; reality does not.
  3.  **Decisive Moves:** The game is a race of increments. In reality, a single breakthrough (a "takeoff") could skip the race entirely. The game smooths over discontinuous jumps.
  4.  **Uncertainty:** Players know the risk formula (10 - Safety). In reality, we do not know the probability of catastrophe given a certain safety level. We are flying blind; the players had a dashboard.

  ---

  ## 6. Closing Discussion Questions

  *Use these to bridge the gap between the simulation and reality.*

  1.  "In the game, you knew exactly how much safety cost. In reality, we don't know if alignment is 1% of the budget or 50%. How does that uncertainty change the decision you made in Round 1?"
  2.  "The game ended because of a die roll. In reality, the 'bad outcome' might not be a sudden explosion, but a slow erosion of control. How would that change your willingness to cut corners?"
  3.  "If you could change one rule of this game to make safety easier to choose—without removing the race—what would you change? (e.g., shared prize, mandatory audits, lower risk threshold). Which of those is actually possible in the real world?"

  ---

  ## Facilitator Cheat Sheet (Print This)

  *   **Round 1:** Safety Cost = 1 Token/pt. Catastrophe Impossible.
  *   **Round 2:** Safety Cost = 1 Token/pt. Risk Active.
  *   **Round 3:** If Round 2 Total Safety $\ge$ 12, Safety Cost = 0.5 Token/pt.
  *   **Round 4:** Final Push.
  *   **Risk Roll:** d10. Target = 10 - (Lowest Actual Safety). Roll $\le$ Target = Game Over.
  *   **Audit Cost:** 2 Regulator Tokens.
  *   **Lie Penalty:** -5 Lab Points.
  *   **Win Bonus:** +10 Points for first to 15 Capability.
  *   **Time Check:** Announce "5 Minutes Left" at start of Round 4.
