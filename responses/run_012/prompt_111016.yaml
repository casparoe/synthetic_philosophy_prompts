      *   *Secrecy:* Labs write down Speed/Safety split. Reveal Speed publicly. Reveal Safety *privately* to Auditors? No, Reveal Safety publicly, but Auditors can verify. If Auditor verifies and it matches, Auditor pays cost. If mismatch, Lab penalized.
      *   *Actually, better for "Cheap Talk":* Labs announce Safety. Auditors choose to Investigate. Investigation costs Auditor points. If Lie found, Lab penalized. If Truth found, Auditor loses points (wasted effort). This creates the tension.

      *Let's simplify for 90 mins:*
      1. Labs decide Speed vs Safety.
      2. Labs announce Safety Level (can lie).
      3. Auditors decide to Audit a Lab (costs them 2 pts).
      4. If Audited & Lied: Lab loses 5 pts.
      5. If Audited & Truth: Auditor loses 2 pts (no reward).
      6. Calculate Risk based on *Actual* Safety (revealed after audit phase).
      7. Roll for Doom.
      8. Apply Spillover.

      *Wait, if Risk is based on Actual Safety, lying doesn't help avoid Doom, only helps avoid Auditor scrutiny?*
      *Correction:* The game needs to simulate the *pressure* to lie.
      *Idea:* The "Prize" goes to the first to finish. If you Safety too much, you lose the Prize. If you Safety too little, you risk Doom.
      *Lying:* You claim high safety to discourage Auditors or gain social standing, but actually spend on Speed.
      *Audit:* Only way to catch this.
      *Risk:* Based on *Actual* Safety. So lying puts everyone at risk without the liar knowing (if they think others are safe).
      *Actually, the prompt asks for "verification problem shows up in play."*
      *Let's try this:* Risk is based on *Declared* Safety UNLESS an Audit reveals a lie, then it uses Actual. No, that's complex.
      *Simpler:* Risk is always based on Actual. The tension is: "I need to look safe so I don't get audited/sanctioned, but I want to be fast."
      *Better:* The "Tax" is the cost. The "Constraint" is the race.
      *Let's stick to the prompt's request:* "Cheap talk about safety is possible and the verification problem shows up."
      *Mechanism:* Labs submit hidden bids. They announce a number. Auditors can check one. If the announcement != hidden bid, penalty. Risk is calculated on the *hidden bid* (actual safety). This shows that claims don't stop the risk, only actual spending does, but claims affect trust/audits.

      *Okay, finalizing the mechanics for the output:*
      *   **Teams:** 3 Labs (4 players each), 2 Auditors (1 player each? No, 2 total). Let's make Auditors a team of 2.
      *   **Rounds:** 4 Rounds.
      *   **Budget:** 10 Tokens per Lab per round.
      *   **Choice:** Speed Tokens vs. Safety Tokens.
      *   **Race:** First to 15 Speed Tokens wins "The Lead" (Bonus points).
      *   **Risk:** d10 roll. Target = 10 - (Lowest Actual Safety among Labs). If roll <= Target, Game Over (All lose).
      *   **Spillover:** If Total Safety > 10 in a round, Safety Cost halves next round.
      *   **Audit:** Auditors get 5 tokens budget total. Can spend 2 to audit a Lab. Reveal actual safety. If Announced != Actual, Lab loses 5 tokens.
      *   **Payoff:** Points for Speed Lead + Remaining Tokens. If Doom, 0.

      *Wait, 90 minutes is very tight for 14 people.*
      *Decision making needs to be fast.*
      *I will structure the rounds to be 10 minutes max.*
      *I need to ensure the Facilitator has a script.*

  9.  **Addressing the "What Goes Wrong" section:**
      *   Early Doom: Have a "Grace Period" (Round 1 cannot doom).
      *   Hyper-competition: Remind them during debrief that the *structure* caused it.
      *   Confusion: Keep sheets very simple.

  10. **Addressing Limitations:**
      *   Moral weight (dice vs. lives).
      *   Uncertainty (game has known probabilities).
      *   Fixed Tax (game has fixed costs).

  11. **Discussion Questions:**
      *   Focus on the gap between game and reality.

  12. **Review against constraints:**
      *   14 participants? Yes (3 Labs of 4 = 12, 2 Auditors = 14).
      *   90 mins? Yes (tight schedule).
      *   No lecture? Yes (facilitator guides, doesn't teach).
      *   Mechanics carry ideas? Yes.

      *Self-Correction on Auditor Role:* 2 Auditors for 3 Labs is a bit unbalanced. Maybe 1 Auditor team of 2 people.
      *Let's adjust:* 3 Labs (4 people each = 12). 1 Regulator/Auditor Team (2 people). Total 14.
      *This works better.* The Regulators act as a single entity.

      *Refining the "Tax":* The prompt mentions "alignment tax." In the game, Safety Tokens are the tax. They cost Speed.
      *Refining "Spillover":* Safety R&D reduces cost.
