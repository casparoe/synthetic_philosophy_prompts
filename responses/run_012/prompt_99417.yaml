  **OFFICE OF ESTABLISHED JUSTICE**
  **PUBLIC INFORMATION LEAFLET 99-C**
  **SUBJECT: JURISPRUDENTIAL COMPLIANCE AND CUSTOMARY OBEDIENCE**

  **1. What is the basis of Legal Authority?**
  Justice is not an abstract ideal but a physical fact. It is the necessary marriage of Authority and Power. Justice without Force is impotent; Force without Justice is tyrannical. Therefore, the Law is defined as whatever custom has long established, provided it is backed by the capacity to enforce it. To ask if a law is inherently "good" is to invite civil discord, which is the highest political evil. You obey because the law is established, not because it is reasonable. Reason is subordinate to Peace.

  **2. How was the First Law established justly?**
  Citizens sometimes inquire regarding the origin of the Prime Custom. If justice is custom, what justified the first custom? This inquiry is a category error. The Founding Moment is retroactively stabilized by its own longevity. Just as a river is defined by its current flow, not its source, the Law is defined by its present endurance. The origin is irrelevant; the continuity is absolute. Do not investigate the seed; respect the tree. The past is corrected by the present.

  **3. What happens during a Revolution or Conquest?**
  When Force displaces existing Justice, a period of Temporal Maturation begins. During this interval, the new regime is merely Power. Once the new order has persisted long enough to generate its own custom, it ripens into Justice. The required duration is determined by the Office upon Stabilization. Citizens are advised not to calculate this interval prematurely, as miscalculation may result in penal correction. Resistance during the Maturation Phase is not technically treason, but it is administratively inefficient.

  **4. How do I complain that a law is unjust?**
  Submit Form 99-J. Your complaint will be triaged according to the Three Orders:
  *   **The Order of Force:** If the complaint concerns enforcement capacity, it is routed to the Military Tribunal.
  *   **The Order of the Mind:** If the complaint concerns logical consistency, it is routed to the High Courts.
  *   **The Order of Charity:** If the complaint concerns true, divine justice, it is routed to the Third Chamber.
  Note: The Third Chamber does not exist within this building. Files sent there are archived indefinitely to prevent contamination of secular order. Most complaints are resolved by confirming the law belongs to the Order of Force, rendering the question of justice moot.

  **5. Why do Judges wear wigs and sit on high benches?**
  This is Mystique Cultivation. Since Force is brutal, it must be cloaked in ceremony to appear natural. The wig obscures the human head; the robe obscures the human body. This ensures citizens reverence the Office rather than the individuals wielding the baton. Authority must appear to rest on something other than violence, even when it does not. Do not remove the mask; the face beneath is irrelevant. The spectacle is the substance.

  **6. Is the Office of Established Justice itself just?**
  The Office was founded twenty years ago to administer Custom. By the Office's own definition, Justice requires long-standing custom. Therefore, technically, the Office is not yet just. However, to question the Office is to question the mechanism by which Justice is defined. Citizens are instructed to accept this paradox as a necessary provisionality. The Office will become just once it has existed long enough to declare itself so. Until then, obedience is mandatory to prevent the discord that would arise from acknowledging the contradiction.

  **7. Final Instruction**
  Do not think. Obey. Peace is preferable to Truth. The Office reserves the right to amend these answers without notice, as Custom evolves.
