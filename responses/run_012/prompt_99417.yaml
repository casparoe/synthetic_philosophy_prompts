      **Citizen Advisory FAQ: Series 44-B**

      **1. What is Justice?**
      Justice is not an abstract ideal but a physical fact. It is the marriage of Authority and Power. Justice without Force is impotent; Force without Justice is tyrannical. Therefore, the Law is whatever custom has long established, backed by the capacity to enforce it. To ask if a law is "good" is to invite civil discord, the highest political evil. You obey because the law is established, not because it is reasonable.

