  **Session:** Anthropic Reasoning & Probability  
  **Task:** Locate your position in the logical space of indexical uncertainty.  
  **Instructions:** Answer the following eight questions sequentially. Your path determines your theoretical commitment. Do not worry about the names of the positions (leaves) until you reach the end.

  ---

  ## The Decision Tree

  **Q1. Is indexical uncertainty ("Where or who am I?") a genuine form of uncertainty reducible to probability?**
  *   **No** → Go to **Leaf 1**.
  *   **Yes** → Go to **Q2**.

  **Q2. Does the sheer number of observers in a possible world make that world *a priori* more probable?**
  *   **No** → Go to **Q3**.
  *   **Yes** → Go to **Q5**.

  **Q3. When updating on your existence, do you condition on *all* your qualitative evidence (FNC) or only on the fact that you exist?**
  *   **All Evidence** → Go to **Q6**.
  *   **Existence Only** → Go to **Q4**.

  **Q4. Is the reference class for sampling pinned down by objective similarity or chosen by the agent?**
  *   **Objective/Fixed** → Go to **Leaf 3**.
  *   **Chosen/Pragmatic** → Go to **Leaf 4**.

  **Q5. [Test Case 1] In the *Presumptuous Philosopher* scenario, is the vastly larger universe more likely solely because it contains more observers?**
  *   **Yes** → Go to **Leaf 5**.
  *   **No** → Go to **Q7**.

  **Q6. [Test Case 2] In the *Sleeping Beauty* scenario, does waking up provide new evidence that shifts the probability of Heads?**
  *   **No (Halfer)** → Go to **Leaf 7**.
  *   **Yes (Thirder)** → Go to **Leaf 6**.

  **Q7. Does your anthropic framework imply that human extinction is likely to occur sooner than non-anthropic priors suggest (The Doomsday Argument)?**
  *   **Yes** → Go to **Leaf 8**.
  *   **No** → Go to **Leaf 9**.

  **Q8. Is probability here a degree of belief or a physical measure over worlds?**
  *   **Physical Measure** → Go to **Leaf 10**.
  *   **Degree of Belief** → Go to **Leaf 2**.

  ---

  ## The Leaves (Positions)

  | Leaf | Position Name | Description |
  | :--- | :--- | :--- |
  | **1** | **Deflationary View** | There is no fact of the matter about indexical probability; "I am here" is not a truth-apt proposition. |
  | **2** | **Full Non-indexical Conditioning (FNC)** | Condition on all evidence; observer counts don't weight priors, but specific evidence distinguishes worlds. |
  | **3** | **SSA (Objective Reference Class)** | Self-Sampling Assumption with a fixed, narrow reference class (e.g., "exact duplicates"). |
  | **4** | **SSA (Pragmatic Reference Class)** | Self-Sampling Assumption where the reference class is flexible based on investigative context. |
  | **5** | **Self-Indication Assumption (SIA)** | Accepts observer-count weighting and the Presumptuous Philosopher conclusion. |
  | **6** | **Compartmentalized Conditionalization** | Accepts Thirder in Beauty via evidence updating, but rejects SIA weighting on worlds. |
  | **7** | **SSA Halfer** | Applies SSA to Sleeping Beauty but maintains waking provides no new evidence. |
  | **8** | **SIA + Doomsday Dissolution** | Uses SIA logic specifically to refute Doomsday, but rejects Presumptuous Philosopher (via priors). |
  | **9** | **Hybrid SSA/SIA** | Attempts to balance SSA and SIA to avoid both Doomsday and Presumptuous Philosopher extremes. |
  | **10** | **Physical Measure Anthropic** | Treats observer probability as a physical quantity rather than epistemic belief. |

  ---

  ## Test Case Decisions

  *   **The Presumptuous Philosopher:** This case is the primary discriminator for **Leaf 5 (SIA)**. If you answer "Yes" to Q5, you are committed to Standard SIA regardless of your stance on Doomsday.
  *   **Sleeping Beauty:** This case is the primary discriminator for **Leaf 6 (Compartmentalized Conditionalization)**. It isolates those who derive the "Thirder" result from evidence conditioning (Q6) rather than observer-count weighting (Q2).

  ---

  ## Unoccupied Combinations (Empty Leaves)

  *   **Leaf 7 (SSA Halfer):** **Incoherent.** Maintaining the Halfer view in Sleeping Beauty while accepting SSA generally leads to contradictions regarding new evidence and betting odds.
  *   **Leaf 10 (Physical Measure Anthropic):** **Unexplored.** Most anthropic reasoning is explicitly Bayesian; treating indexical probability as a physical measure lacks a developed framework in current literature.

  ---

  ## Indistinguishable Pairs

  *   **None.** The eight binary questions provide sufficient logical resolution ($2^8 = 256$ paths) to distinguish the ten specified leaves. However, **Leaf 8 (SIA + Doomsday Dissolution)** and **Leaf 5 (SIA)** are often conflated in practice; they are separated here strictly by the Presumptuous Philosopher intuition (Q5).

  ---

  ## Guide for Classmates
  *   **Do not** start by identifying your label (e.g., "I am a Thirdist").
  *   **Do** start by answering the questions based on your intuitions about the cases and principles.
  *   **Note:** If you find yourself at **Leaf 7** or **Leaf 10**, be prepared to defend why you occupy a currently unoccupied region of the logical space.
