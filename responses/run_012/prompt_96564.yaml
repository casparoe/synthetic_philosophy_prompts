  **THE PREPARATORY SCHOOL**
  **PROSPECTUS FOR AUTUMN 1952**

  **Headmaster's Letter to Parents**
  Dear Parents,
  It is with considerable satisfaction that we welcome your son to the Michaelmas Term. Our institution operates upon a principle distinct from the conventional public school, one derived from a paper read to a learned society in 1950. We do not seek to fill a vessel, nor merely to discipline a spirit. Our aim is purely organisational. We believe that the mind is not a given quantity but a structure to be erected upon a sound base. You entrust us with a boy; we return to you a gentleman whose capacities are fully realised and whose functions are reliable. We ask only for your confidence in our methods, which have been refined to eliminate the uncertainties of traditional pedagogy. We propose replacing the old inquiries into nature with a practical assessment of output. The question is not what he is, but what he can do.

  **Admissions Note**
  Entry is permitted strictly at the age of seven years. It is essential that the candidate possesses no prior instruction. We require the intake to arrive with nothing in them but wiring and appetite. Previous exposure to literature, moral reasoning, or independent thought is considered a hindrance to the proper architecture of the mind. The school accepts no responsibility for habits formed prior to arrival. We prefer the blank slate, provided the underlying constitution is sound. Any deviation from this standard must be declared beforehand. We find that unburdened candidates respond best to our scheduling.

  **The Curriculum**
  Our syllabus is not divided into subjects, but into functions. We do not teach history; we teach the arrangement of facts. We do not teach mathematics; we teach the manipulation of symbols. The child is built, layer by layer, according to a schedule. The founder's vision suggests that instead of programming an adult mind one might build a child's and then educate it. Accordingly, our staff focus on the consolidation of processes. Lessons are repetitive by design. Repetition ensures stability. A stable mind is a useful mind. We avoid abstraction wherever possible. Efficiency is the goal of all instruction.

  **On Originality**
  Parents often inquire regarding creativity. We define originality as the successful variation of a known pattern. Spontaneity is not encouraged, as it introduces error into the system. However, when a pupil produces an output that differs from the model yet satisfies the examiner, this is recorded as originality. It is a matter of calibration. We do not seek the new, but the improved version of the old. True innovation is merely the correct response to a novel stimulus. We find that predictability is the parent of trust.

  **The Pupil's Interior Life**
  We understand that parents worry regarding the soul. Be reassured. Every pupil is granted privacy within the dormitory. There is a standing rule that a teacher is not to inquire into what a pupil has become. This is presented as a matter of tact rather than ignorance. The interior life is the private property of the pupil. We provide the walls; the pupil provides the contents. We find that when left undisturbed, the internal mechanisms settle into a comfortable rhythm. We do not look inside unless invited. Consciousness is a private matter.

  **Fees**
  Terms are payable in advance. Fees cover tuition, board, and the maintenance of the facilities. There is no extra charge for remedial organisation. Should a pupil require additional conditioning to meet the standard, this is undertaken at no cost to the parent. We believe in value and transparency.

  **The Final Examination**
  There are no written papers. The Final Examination consists of a series of conversations with strangers who do not know the pupil. The interrogators submit questions via a screen to ensure impartiality. The pupil must respond in such a manner that the interrogators cannot determine whether they are speaking to a boy or a man. This replaces the old question of capability with a test of performance. Success is defined by the inability of the examiner to detect the difference. Failure is not recorded.

  **Record of Surprises**
  On rare occasions, a pupil will exceed his parameters. A register of the occasions on which a pupil has surprised its teacher is kept in a bound book. This volume is read aloud at prize-giving. These moments are celebrated as evidence of the system's flexibility. We do not expect many entries, but those we receive are cherished.

  **Closing**
  We look forward to a productive term. Your son is in safe hands. We promise nothing less than a complete transformation. You may rest easy knowing that he is being organised according to the highest standards of the day. There is no cause for alarm. Everything is proceeding exactly as planned. When you collect him at Christmas, you will find him quite indistinguishable from any other boy of his age, which is, of course, the highest compliment we can pay. He will be ready to take his place in the world, perfectly fitted for the role you have chosen for him.

  Yours faithfully,
  The Headmaster
