answer: |-
  ### (a) Moral Obligation Scores and Ordering

  | Convention | Resident Score | Visitor Score |
  | :--- | :---: | :---: |
  | 1. Restaurant tipping | 1.0 | 0.95 |
  | 2. Escalator usage | 0.8 | 0.5 |
  | 3. Street-crossing rule | 0.1 | 0.1 |
  | 4. Greeting | 0.6 | 0.7 |
  | 5. Footwear indoors | 0.95 | 0.9 |
  | 6. Communal meal | 0.3 | 0.2 |
  | 7. Rotating payment | 1.0 | 0.9 |

  **Ordering by Visitor Score (Highest to Lowest):**

  1.  **Restaurant tipping (0.95)**
  2.  **Rotating payment (0.9)** — *Tied with Footwear.*
  3.  **Footwear indoors (0.9)** — *Tied with Rotating payment.*
  4.  **Greeting (0.7)**
  5.  **Escalator usage (0.5)**
  6.  **Communal meal (0.2)**
  7.  **Street-crossing rule (0.1)**

  **Tie-Breaking (Payment vs. Footwear):**
  Although both conventions receive a score of 0.9, **Rotating payment** is ranked higher than **Footwear indoors**.
  *   **Separation:** The obligation to pay is a **conduct obligation** rooted in material fairness and the prevention of economic free-riding; the act itself creates an imbalance that an explanation cannot fully rectify once the meal is consumed. The obligation regarding footwear is a **meaning obligation** rooted in symbolic respect; while the offense taken by hosts is real, it is contingent on the interpretation of the act. Material unfairness (Payment) imposes a slightly more stringent moral demand on the visitor than symbolic insult (Footwear), as the former exploits the cooperative scheme while the latter merely breaches a norm of deference.

  ### (b) Classification of Obligations

  1.  **Restaurant tipping:** **Conduct obligation.** The server's reliance on the income is material. Announcing a different custom does not negate the financial loss the server incurs if the tip is withheld.
  2.  **Escalator usage:** **Conduct obligation.** The obstruction of flow is a physical reality. Announcing a different custom does not clear the path for walkers.
  3.  **Street-crossing rule:** **Neither.** There is negligible moral obligation to comply (score 0.1). The rule is a "dead letter," and compliance is not required for safety or fairness in the stipulated context.
  4.  **Greeting:** **Meaning obligation.** The convention functions as a signal of warmth and recognition. If the visitor sincerely announces, "In my culture we do not greet strangers, but I wish you well," the signal of coldness is neutralized, and the obligation dissolves.
  5.  **Footwear indoors:** **Meaning obligation.** The harm is the *interpretation* of contempt. If the visitor clarifies, "I respect this home, but my custom requires shoes," the sting is substantially weakened, though not necessarily eliminated.
  6.  **Communal meal:** **Conduct obligation.** The moral problem is the arrangement itself (gendered subordination), not merely the signal sent by the guest. Announcing a different custom does not stop the women from serving or negate the visitor's participation in the hierarchy.
  7.  **Rotating payment:** **Conduct obligation.** The transfer of resources is material. Announcing an inability or unwillingness to reciprocate beforehand would likely exclude the visitor from the outing; joining without intending to reciprocate is exploitative regardless of announced intent.

  ### (c) Sensitivity Analysis

  The two conventions whose ordering is most sensitive to a single consideration are **Footwear indoors (5)** and **Greeting (4)**.

  **The Consideration:** **The weight of avoiding local emotional offense.**

  *   **Reasoning:** Both conventions rely heavily on the local emotional response to the visitor's behavior (hosts are "visibly stung" by shoes; locals read silence as "cold").
  *   **Sensitivity:** If the researcher weighs the avoidance of causing emotional offense to locals very heavily, **Footwear** rises significantly (as the offense is described as visceral). If she weighs the preservation of her own autonomy or comfort more heavily, **Greeting** may rise relative to Footwear (as the cost of greeting is lower than removing shoes, and the penalty for not greeting is merely reduced future helpfulness rather than immediate visible pain). Currently, Footwear ranks higher because the harm (contempt/sting) is more immediate and interpersonal than the harm of Greeting (perceived coldness/reduced utility). A shift in how much one values "preventing hurt feelings" versus "maintaining social utility" could swap their positions relative to the middle of the pack.

  *(Note: While Payment and Footwear were tied in score, their ranking was determined by the Conduct/Meaning distinction. Footwear and Greeting are more sensitive because both are Meaning obligations where the "harm" is purely social/emotional, making their relative weight highly dependent on how much moral value is assigned to local feelings.)*

  ### (d) Binding Principle and Application to Item 6

  **The Principle:**
  The strongest single principle binding the highest-scoring conventions (Tipping, Payment, Footwear) is the **Principle of Non-Exploitative Participation**. This principle holds that when a visitor voluntarily enters a local cooperative practice or private space, she must not derive benefit while imposing a foreseeable cost (financial, physical, or emotional) on the participants who are relying on established norms to protect their interests.

  **Application to Item 6 (Communal Meal):**
  This principle **does not** bind her to comply with the communal meal convention.

  **Distinction:**
  The highest-scoring conventions require compliance to **prevent harm** to others (the server losing wages, the group losing funds, the hosts feeling insulted). In contrast, compliance with Item 6 **enacts harm**.
  *   In the top-scoring items, the visitor's compliance sustains a neutral or beneficial equilibrium for the locals.
  *   In Item 6, the convention itself relies on the subordination of the women of the household. By complying, the visitor is not merely "participating" in a neutral custom; she is becoming a beneficiary of an inequitable arrangement that demeans the servers. The Principle of Non-Exploitative Participation forbids benefiting from a practice that exploits others. Therefore, while she is bound not to *harm* the hosts (e.g., by insulting them), she is not bound to *validate* a hierarchy that violates the dignity of third parties. Refusing to sit separately would be a refusal to participate in exploitation, not a violation of fair play.
