          *   (c) 4/8. The K&T error is significant. The rest is good.
          *   Total: 15/20.

  6.  **Final Polish:** Ensure the comments look like they belong on a mark sheet (clear headings, bullet points where appropriate). Make sure the distinction between Gigerenzer's view of K&T vs. Simon is clear.

      *(Self-Correction on Part B)*: Actually, looking closer at Part (b). The prompt asks "Does satisficing represent a genuine departure... or is it a version?" The student answers "It's just optimizing." This is a standard "Chicago School" rebuttal to Simon. Is it wrong? No, it's a valid defense. However, Simon argued it *was* a departure. The student needs to recognize that tension. I will deduct 1 point for not acknowledging Simon's own resistance to the "optimization under constraints" reduction.

      *(Self-Correction on Part C)*: The K&T error is the killer. Simon and K&T had a famous intellectual rivalry/disagreement on the interpretation of bounded rationality. They did not collaborate on availability/anchoring. This needs to be highlighted as a major factual error.

