      *Wait, let's reconsider (b).* The student writes: "If all that's right, then satisficing doesn't really break with expected utility theory at all." This actually contradicts their earlier paragraph where they say "Simon isn't making a claim about error... standard model is the wrong idealization." If the standard model is the wrong idealization, it *is* a departure. The student contradicts themselves slightly between para 2 and para 4. I should point that out.

