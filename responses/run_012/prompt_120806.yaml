  7.  **Refining the Output:**
      *   Make sure to explain the Buddhist terminology (Cetana, Kamma, Precepts) without being overly academic.
      *   Ensure the distinction between "Transgression" (breaking the rule) and "Fault" (karmic burden) is clear.
