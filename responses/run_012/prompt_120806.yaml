          *   *The Kicker:* The Supervisor. She is using him as a means to an end (shield). She "barely thinks about him."
          *   *Comparison to Hospice:* Hospice doctor didn't use the patient. This director *is* using the supervisor.
          *   *Comparison to Captain:* Captain takes the hell himself. This director ensures the supervisor takes the risk.
          *   *Comparison to Border:* Border guard risked herself. This director risks the supervisor.

      *   *Prediction:* **Fault.**
      *   *Why?* The "Selflessness" test fails on the supervisor. She is offloading the karmic/worldly risk onto someone else while claiming the moral victory. This introduces a subtle form of *delusion* (ignoring the harm to the supervisor) or *greed* (for the moral outcome without the full cost). It violates the "Not using him for anything" principle from the Hospice case.

  5.  **Develop Competing Rules/Hypotheses:**

