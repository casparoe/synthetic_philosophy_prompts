      *   *Case 4 (Soldier/Grenade):* Kill to save many. Motive: Fear/Anger ("terrified, furious"). Consequence: Many saved, one killed. Verdict: **Fault.** Key insight: State of mind overrides utilitarian calculus. "The mind he did it with... was the whole of the act."
      *   *Case 5 (Builder/Permit):* Lie to authority. Motive: Mixed (Help village + Get rich). Consequence: Good (jobs). Verdict: **Fault (Less than soldier).** Key insight: Mixed motive dilutes purity. Self-benefit taints the act.
      *   *Case 6 (Captain/Bandit):* Kill to save merchants. Motive: Pure Self-Sacrifice ("go to hell for those merchants gladly"). Consequence: One killed, many saved. Verdict: **Blameless.** Key insight: *Bodhisattva* logic? Extreme self-sacrifice purifies the act. "Nothing to teach us" (normal people can't replicate this state of mind).

      *   *Crucial Distinction:* "Transgression vs. Fault." An act can break a rule (transgression) but not create karmic burden/blame (fault) if the mind is right.

  3.  **Synthesize the Underlying Ethical Framework:**

      *   *Not Utilitarianism:* Case 4 (Soldier) proves this. Saving many doesn't justify the act if the mind is angry/fearful. Case 5 (Builder) shows good outcomes don't erase self-interest.
      *   *Not Strict Deontology:* Case 1 (Border) and Case 3 (Hospice) show rules (don't lie, don't kill) can be broken without fault.
      *   *Not Standard Virtue Ethics:* It's close, but specifically focused on *Cetana* (Intention/Volition) and the quality of that intention (greed, hatred, delusion vs. generosity, loving-kindness, wisdom).
      *   *The "Transgression vs. Fault" Clue:* This sounds like the distinction between *Viniya* (monastic discipline/rule-breaking) and *Kamma* (karmic consequence). In Theravada/Tibetan synthesis, breaking a precept creates a karmic seed based on the intention. If the intention is pure compassion without self-clinging, the karmic "fault" is minimized or absent, even if the worldly "rule" is broken.
      *   *The "Captain" Clue:* This is classic *Skillful Means* (Upaya) or Bodhisattva ethics. The Captain is willing to take the karmic hit. This suggests a hierarchy of intention:
          1.  Pure Compassion + Self-Sacrifice (Blameless/Captain)
          2.  Pure Compassion + No Harm Intention (Blameless/Hospice)
          3.  Pure Compassion + Rule Breaking (Blameless/Border)
          4.  Mixed Motive (Fault/Builder)
          5.  Self-Protection/Ego (Fault/Doctor)
          6.  Defiled Mind (Anger/Fear) even for "Good" Outcome (Fault/Soldier)

      *   *The Core Rule:* **Karmic Weight is determined by the Quality of Intention (Cetana), specifically the presence or absence of the Three Poisons (Greed, Hatred, Delusion) and Self-Clinging.**
      *   *Refinement:* It's not just "good intention." It's about *who* the act is for. Is it for the Self (ego, safety, profit) or for the Other (compassion)? If for the Self, it's Fault. If for the Other, it *can* be Blameless, provided the mind isn't corrupted by hatred/delusion *during* the act.
      *   *The "Transgression" bit:* Breaking a precept is a transgression (objective). Carrying karmic debt is Fault (subjective/karmic). You can transgress without incurring heavy Fault if the intention is pure compassion.

  4.  **Analyze the New Case (The Vaccine Clinic):**

      *   *The Act:* Falsifying data (lying/forging signature).
