  2.  **Deconstruct the Past Cases (The Data Set):**

      *   *Case 1 (Border Guard/Medicine):* Lie to authority. Motive: Compassion/Urgency (uncle's health). Consequence: Good (medicine got through). Verdict: **No Fault/Good.**
      *   *Case 2 (Doctor/Drinking):* Lie to authority (doctor). Motive: Shame/Self-image. Consequence: Bad (poor treatment risk). Verdict: **Fault.** Key insight: "Rather be thought well of than be treated." (Self-protection vs. Truth/Health).
