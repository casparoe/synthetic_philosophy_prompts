      *Check:* Did I address the "schema migration" example? I should weave that in to ground it.
      *Check:* Did I address the "proportionality clause"? Yes.
      *Check:* No citations.

      *Final thought on the "Verdict":* The friend is right that the *structure* is isomorphic to punishment. The engineer is right that the *teleology* is system health, not moral balance. The residue is that isomorphic structures exert isomorphic pressures on humans, regardless of teleology.

      *Wait, one constraint:* "Don't relabel the philosophical terms with engineering words and call that a translation; if a mapping is only a pun, say so plainly." I need to be very careful not to say "Retributivism is just SEV levels." I must say "SEV levels *function* like retributive proportionality but lack the moral component."

      Okay, ready to write.

