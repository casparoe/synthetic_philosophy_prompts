      *   *Crucial Realization:* The user is asking about *micro-experiences combining into macro-experiences*. This presupposes **Panpsychism** (or Constitutive Russellian Monism). A standard Physicalist/Functionalist theory *denies* the antecedent (there are no micro-experiences to combine). I must make this distinction clear immediately, or the spec makes no sense.
