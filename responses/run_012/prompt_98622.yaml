      *   **Is it a Fig Leaf? (Consistency):**
          *   Acknowledge the criticism. Many philosophers (e.g., Robert Truog, Franklin Miller) argue the DDR is indeed conceptually shaky in DCD cases. They argue the patient isn't truly "dead" by neurological standards yet, but we treat them as dead for social utility.
          *   Counter-argument: It preserves public trust. If people think doctors kill for organs, donation rates plummet. So, pragmatically, the distinction matters even if philosophically thin.
      *   **The Consent-Only Model:**
          *   If we remove the killing/letting die distinction and rely only on consent:
          *   Problem 1: Vulnerable populations. Coercion risks.
