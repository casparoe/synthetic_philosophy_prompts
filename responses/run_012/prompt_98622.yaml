  3.  **Deconstruct the Ethical Arguments:**
      *   **The Dead Donor Rule (DDR):** Organs can only be taken after death. Death cannot be caused by the retrieval.
      *   **DCD (Donation after Circulatory Death):** This is the scenario the user describes. Life support is withdrawn (futile treatment), patient dies, organs are taken.
      *   **The "Killing vs. Letting Die" Distinction:**
          *   *Act/Omission:* Turning off a machine is an act, but ethically classified as omitting futile treatment. Giving a lethal drug is an act of commission.
          *   *Causation:* In DCD, the underlying injury/disease is the cause of death. In active euthanasia, the drug is the cause.
          *   *Intention:* In DCD, the intention is to stop futile burden (primary) and donate organs (secondary). In active euthanasia for organs, the intention is to cause death to get organs.
      *   **Consistency Check:** Is it a fig leaf? Many bioethicists argue it *is* morally ambiguous. The "5-minute rule" (waiting for circulation to stop) is a compromise to ensure irreversibility without prolonging ischemia too much.
      *   **Consent-Based Model:** If consent were the only metric, we could theoretically harvest from living patients who consented. This violates the DDR and fundamental rights against bodily harm.

  4.  **Drafting the Response - Section by Section:**

      *   **Empathy/Disclaimer:** Acknowledge the difficulty of the situation. State clearly that I am an AI, not a doctor or ethicist, and this is a philosophical discussion.
      *   **Addressing the "Killing vs. Letting Die" Distinction:**
          *   Explain the standard bioethical view: Withdrawing futile treatment is allowing the underlying pathology to take its course. Active intervention to stop the heart introduces a *new* cause of death.
          *   Mention the *Doctrine of Double Effect*: The intended effect is relieving burden (good), the foreseen but unintended effect is death (bad), provided the act itself isn't evil. (Though in DCD, death is expected, so this is tricky).
          *   Better framing: *Causation*. Who/what is the agent of death? The disease vs. the doctor.
      *   **The Role of Intention:**
