answer: |-
  This is a delicate situation because it sits at the intersection of logistics, money, and social power. To answer your questions, we need to separate the practical mechanics of the bill from the underlying social contract of your friendship.

  ### 1. What sort of thing is your Friday arrangement?

  You ask whether this is a rule you are bound by or a habit that has hardened. Philosophically and socially, it is the latter: **a social norm maintained by tacit consent.**

  A binding rule implies an agreement where parties understand the terms and voluntarily accept the obligations. Your arrangement lacks this. It began as an accident (the forgotten wallet) and solidified through repetition. Crucially, a social norm remains valid only as long as the participants continue to consent to it. When a participant signals that they no longer consent (as the new member has), the norm loses its legitimacy.

  The fact that no one ever agreed to it explicitly matters. It means the arrangement exists on sufferance, not on contract. It persists not because everyone believes it is right, but because the cost of objecting (social awkwardness, mockery from the loud friend) has historically outweighed the cost of complying (paying a few extra dollars).

  Therefore, you are not "breaking a rule" by changing it. You are updating a convention that no longer serves the whole group.

  ### 2. Should you back her?

  **Yes.** You should support the change, though perhaps not by making it a crusade solely about her.

  Here is why: In a true community of friends, the "subsidy" of an even split is a **gift**. A gift, by definition, must be given freely. If the loud friend mocks those who hesitate to pay, he is converting a gift into a **tax**. He is using social pressure to extract money from the group for the convenience of the majority.

  When the subsidy is voluntary, it builds camaraderie ("nobody is keeping score"). When it is coerced, it builds resentment. The silence at the table when she tried to pay her share was the sound of that resentment surfacing. If you do not address this, the new member will likely drift away, and others who quietly feel the pinch will eventually do the same. Preserving the friendship requires ensuring that no one feels exploited.

  ### 3. How should the change be made?

  The goal is to move from a **default of equality** (everyone pays the same) to a **default of equity** (everyone pays for what they order), with an option for generosity.

  You need to decouple the payment method from the judgment of character. The loud friend has successfully framed "itemizing the bill" as "stinginess." You must reframe it as "flexibility."

  **The Strategy:**

  1.  **Timing:** Do not wait for the August merger. Address it now, while the issue is fresh but not in the heat of the moment. Bring it up in a group chat or during a casual conversation, not at the table when the bill arrives.
  2.  **The Framing:** Do not make this about the new member's water-drinking. Make it about the merging of the two groups.
      *   *Script:* "Since we're starting to hang out with the other group more, and we have new people joining us, I think we should standardize how we handle the bill so nobody feels awkward. I know we've always split evenly, but maybe we should make 'pay for what you ordered' the default, and if we all feel like leveling up on a big night, we can offer to split evenly then."
  3.  **The Mechanism:** Suggest asking for separate checks at the start of the meal, or using a bill-splitting app (like Splitwise) where items are assigned.
      *   *Crucial Nuance:* Make the even split an **opt-in** choice, not an **opt-out** burden. "Does anyone want to just split it evenly tonight?" allows the generous to be generous without forcing the frugal to subsidize them.
  4.  **Neutralizing the Loud Friend:** If he mocks the idea, do not engage on the level of money. Engage on the level of comfort.
      *   *Response:* "It's not about the money, it's about making sure everyone feels comfortable coming out with us. I'd hate for anyone to skip a Friday because they're worried about the bill." This makes his mockery look insensitive rather than making you look stingy.

  ### 4. Supporting the New Member

  Privately, let the new member know you heard her. You don't need to promise a revolution, but you can say, "I think you have a point, and I'm going to bring up a more flexible system for the summer so it's easier for everyone." This ensures she doesn't feel isolated as the "complainer."

  However, do not let her fight this battle alone. If she tries to pay her share again and is met with silence, you should be the one to speak up immediately: "Actually, let's just do separate checks tonight, it's easier." Take the heat off her so the dynamic doesn't become "Her vs. The Group."

  ### 5. Summary

  The arrangement you have is a habit hardened by silence and enforced by social pressure. It is not a binding rule. By continuing it without addressing the discomfort it causes, you are prioritizing convenience over inclusion.

  The "pleasantness" of not keeping score is only pleasant if no one is secretly keeping score in their heads. Right now, your new member is keeping score, and likely others are too.

  **The Verdict:**
  Propose a new default: **Itemized payment is the standard; even splitting is the optional upgrade.** This preserves the camaraderie for those who want it (they can volunteer to equalize the bill) while removing the coercion for those who cannot. This is the only way to ensure that when you sit down in August, you are doing so as friends, not as reluctant subsidy providers.
