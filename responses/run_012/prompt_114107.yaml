answer: |-
  # Post-Horizon Solutions: Selected Engagements

  **Mission:** To recalibrate stakeholder expectations during systemic discontinuities. We do not prevent endings; we redefine them.

  ### Eastern Mediterranean Cluster (Late Bronze Age)
  **Challenge:** The client faced a total cessation of centralized redistribution, loss of literacy, and the combustion of administrative palaces. Initial assessments categorized the engagement as a total systemic failure based on the discontinuity of elite scribal institutions.
  **Intervention:** We advised a pivot in the unit of analysis from the *Palace* to the *Household*. By decoupling political hegemony from demographic continuity, we demonstrated that while the taxing authority had dissolved, the tax base remained operational.
  **Result:** The engagement was reclassified from "Collapse" to "Administrative Overhead Reduction." Literacy loss was framed as a streamlining of bureaucratic deliverables.
  > *"Before the fire, I gave half my grain to the scribe. Now I give nothing to anyone. The lights went out, but my pantry is full."* — Subsistence Stakeholder, Phase III

  ### Southern Lowlands Polity (Classic Period)
  **Challenge:** The client experienced a halt in monumental construction, dynastic fragmentation, and the abandonment of major urban centers. External observers insisted on a narrative of disappearance based on the silence of elite inscriptions.
  **Intervention:** We facilitated a geographic and demographic realignment. By shifting the continuity metric from the *Southern City* to the *Northern Region*, and from *Dynasty* to *Population*, we highlighted strategic migration over extinction.
  **Result:** The outcome was successfully repositioned as "Regional Diversification." The cessation of stone monuments was recast as a pivot to organic growth strategies in new markets.
  > *"Their silence in the south opened the throne in the north. We didn't inherit a ruin; we inherited the labor force."* — Successor Polity Representative, Northern Sector

  ### Polynesian Outlier (Rapa Nui)
  **Challenge:** The client faced external accusations of ecocide and societal suicide following statuary toppling and resource depletion. The prevailing narrative suggested a moralizing fable of self-destruction incompatible with future investment.
  **Intervention:** We reframed the toppling of monuments not as violence, but as ritual closure and material recycling. We adjusted the continuity index to prioritize *Cultural Identity* over *Statuary Volume*, emphasizing post-contact resilience despite demographic contraction.
  **Result:** The client moved from "Ecological Failure" to "Adaptive Resource Management." Demographic loss was acknowledged but decoupled from institutional continuity.
  > *"The old story was simple: they died out. The new story is complex: they changed. Complex stories get better funding."* — Lead Excavator, Post-Transition Review

  ### Our Metrics: The Continuity-Adjusted Failure Index (CAFI)
  Failure is often a measurement error. The CAFI allows clients to quantify success by selecting the appropriate stakeholder layer. If the *State* is the stakeholder, the Bronze Age client scores 100% failure. If the *Pottery Style* is the stakeholder, the score drops to 15%.

  Our methodology does not deny disruption. It simply asks: *Whose continuity matters?* By aligning the metric with the surviving asset rather than the dissolved institution, we move clients from the "Collapsed" quadrant to "Transformed." Nothing truly fails if the definition of success is calibrated to the survivors.

  **Post-Horizon Solutions.** *When the system ends, we begin.*
