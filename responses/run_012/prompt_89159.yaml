prompt: |-
  I'm putting together the final exam for an upper-level undergraduate seminar on history and memory, and I need one essay question to go with a model answer and a marking scheme. The problem is that the exam has turned into a recitation exercise: my students can all reproduce the standard framing in which memory is social, present-oriented, and identity-constituting while history is critical, distance-taking, and reconstructs the past as past, and they can all add that the two are "in tension." I want a question that makes that framing useless as an answer — one where a student who has nothing but the framing will write something fluent and visibly incomplete. The students get seventy-five minutes, no notes, no internet, and they should not earn credit for naming theorists; what I care about is whether they can do the reasoning on the page.

  To force that, I want the question built around a piece of apparatus that I hand them in the exam itself, so they cannot have memorized it. Here is what I have in mind, and please keep it. Distinguish two offices that a community's relation to its past can serve: an evidential office, in which the community's account is answerable to what happened and stands or falls with the record, and a constitutive office, in which the account is doing work in the present by making the community the kind of thing it takes itself to be. Then attach a condition I will call the convergence requirement: a community may retain an account that the record contradicts only if it can say what the account is doing for it that a corrected record could not do, and only if it stops offering the account as a claim about what happened. The case I give them is a fictional mill town whose oral tradition about a 1919 labor confrontation diverges from the county archive, with the twist that the archive was compiled by the company that owned the mill — so the students cannot simply assume that the record is the neutral party and memory the interested one. The question should make them decide rather than survey: given that inversion, when, if ever, should memory give way to the record, and when should the record give way to memory; and is the convergence requirement the right way to draw that line, or does it smuggle in the assumption that memory and history are answering the same question?

  Please write the exam question itself, phrased as it would appear on the paper, then a model answer of roughly 700 words, then a marking scheme totaling 25 marks built around five must-hit points. For each point, give the marks it carries and a one-line note on the specific way students typically miss it — I want the real failure modes, not generic remarks about lack of clarity; for instance, treating the constitutive office as a license to keep believing something false, or treating a written record as neutral just because it is written down. Close with a short paragraph on where the line between an A and a B answer falls, phrased in terms of what the B answer does and does not do. The model answer should show what a strong student would actually produce under time pressure: it should not read like a literature review, and it should not depend on any citations.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate seminar on History and Memory.
      *   **Problem:** Students are reciting a standard framing (Memory = social/present/identity; History = critical/distance/past; they are in tension) without deep reasoning.
      *   **Goal:** Create an essay question, model answer, and marking scheme that forces original reasoning and makes the standard framing insufficient.
      *   **Constraints:**
          *   75 minutes, no notes/internet.
          *   No credit for naming theorists.
          *   Must use a specific "apparatus" provided in the exam (Evidential Office, Constitutive Office, Convergence Requirement).
          *   Specific Case Study: Fictional mill town, 1919 labor confrontation, oral tradition vs. company archive (archive is biased).
          *   Core Task: Decide when memory yields to record/record yields to memory; evaluate the Convergence Requirement.
          *   Output: Exam Question, Model Answer (~700 words), Marking Scheme (25 marks, 5 must-hit points with specific failure modes), A vs. B distinction paragraph.
          *   Tone: Academic, rigorous, practical.

  2.  **Drafting the Exam Question:**
      *   *Requirement:* Needs to present the definitions (Evidential, Constitutive, Convergence) and the Case (Mill Town) clearly but concisely so students don't waste time decoding.
      *   *Requirement:* Needs to ask the specific analytical questions (When to yield? Is Convergence right? Does it assume same question?).
      *   *Drafting:* I will structure it as a prompt with a "Background" section defining the terms and a "Case" section describing the mill town. Then the "Task" section will pose the specific arguments required.
      *   *Refinement:* Ensure the bias of the archive is clear. The prompt must explicitly state the archive is company-compiled to prevent the "archive = truth" shortcut.

  3.  **Drafting the Model Answer:**
      *   *Constraint:* ~700 words.
      *   *Constraint:* No citations/theorist names.
      *   *Constraint:* Must demonstrate reasoning, not just recitation.
      *   *Key Arguments to Include:*
          1.  Acknowledge the bias in the archive (undermines simple evidential superiority).
          2.  Apply the "Offices": The oral tradition serves a constitutive role (solidarity, identity), the archive serves an evidential role (but compromised).
          3.  Critique the Convergence Requirement: It's useful but tricky. It forces a choice: is this truth or identity?
          4.  Address the "Same Question" problem: History asks "what happened?", Memory asks "who are we?". Convergence tries to bridge them but might fail if the community *needs* the factual claim for the identity to work (e.g., injustice requires actual victims).
          5.  Conclusion: A nuanced stance. Maybe the record yields on *meaning*, memory yields on *facts*, but only if the constitutive work doesn't rely on the falsehood.
      *   *Tone:* Urgent, analytical, direct (simulating exam conditions).
      *   *Word Count Check:* Need to keep it tight. Avoid intro fluff. Get straight to the argument.

  4.  **Drafting the Marking Scheme:**
      *   *Total:* 25 marks.
      *   *Structure:* 5 must-hit points, 5 marks each.
      *   *Requirement:* Specific failure modes for each point (not just "unclear").
      *   *Point 1: The Archive's Bias.* Must recognize the company archive isn't neutral evidence. *Failure:* Treating the written record as inherently more reliable than oral tradition.
      *   *Point 2: Distinguishing the Offices.* Must apply Evidential vs. Constitutive to the specific case, not just define them. *Failure:* Defining the terms without applying them to the mill town's specific conflict.
      *   *Point 3: The Convergence Requirement's Utility.* Must explain *how* the requirement forces a decision (stop claiming truth OR justify the lie). *Failure:* Accepting the requirement as obviously correct without testing its limits.
      *   *Point 4: The "Same Question" Critique.* Must address whether history and memory are answering different questions. *Failure:* Assuming the tension is only about accuracy rather than function.
      *   *Point 5: A Normative Conclusion.* Must take a stand on when one yields to the other. *Failure:* Sitting on the fence or saying "it depends" without criteria.

  5.  **Drafting the A vs. B Distinction:**
      *   *Focus:* What separates the good from the great.
      *   *B Answer:* Applies the framework correctly but accepts the premises too easily.
      *   *A Answer:* Challenges the framework (specifically the Convergence Requirement) or finds the deep tension in the "Same Question" critique.

  6.  **Review and Refine:**
      *   *Check against constraints:* Did I include the specific definitions provided in the prompt? Yes. Is the case study correct? Yes. Is the model answer under 75 mins worth of writing? Yes (700 words is about right for a strong student writing fast).
      *   *Check the "Failure Modes":* Are they specific enough? I need to make sure they reflect the "recitation" problem the user mentioned.
      *   *Refining the Model Answer:* Make sure it doesn't sound like a published paper. It needs to sound like a smart student thinking on the page. Use phrases like "The problem here is..." or "If we accept..."
      *   *Refining the Question:* Ensure the instruction "Do not name theorists" is explicit.

  7.  **Final Polish:** Check word counts and formatting. (Self-Correction: Ensure the Model Answer doesn't exceed ~700 words significantly).

  *(Self-Correction during drafting Model Answer)*: I need to make sure the model answer doesn't just say "The archive is biased." It needs to explain *why* that matters for the Evidential Office. If the archive is biased, does it fail the Evidential Office? Or does it just serve a different Constitutive Office (for the company)? The model answer should grapple with that complexity.

  *(Self-Correction on Marking Scheme)*: The prompt asks for "one-line note on the specific way students typically miss it." I will ensure these are punchy and diagnostic.

  *(Final check on the "Convergence Requirement")*: The prompt defines it: "retain an account that the record contradicts only if it can say what the account is doing for it that a corrected record could not do, and only if it stops offering the account as a claim about what happened." The model answer must engage with this specific logic.

  Let's assemble.
answer: |-
  **EXAM QUESTION**

  **Time Allowed:** 75 Minutes
  **Instructions:** Answer the following question. Do not quote or name specific theorists. Your grade depends on the quality of your reasoning, not your recall of readings.

  **Background: Two Offices and a Requirement**
  Consider two functions (offices) a community's relation to its past can serve:
  1.  **The Evidential Office:** The account is answerable to what happened and stands or falls with the record.
  2.  **The Constitutive Office:** The account does work in the present by making the community the kind of thing it takes itself to be.

  Consider also the **Convergence Requirement**: A community may retain an account that the record contradicts only if (a) it can say what the account is doing for it that a corrected record could not do, and (b) it stops offering the account as a claim about what happened.

  **Case: The Mill Town**
  In the town of Oakhaven, the oral tradition holds that in 1919, striking workers peacefully marched on the mill and were massacred by hired guards. This story sustains the town's identity as a place of martyrdom and solidarity. However, the county archive contains a report compiled by the mill company stating the workers were armed insurgents killed during a riot. Historians note the archive is exclusively company-generated; no independent police or state records exist. The oral tradition contains details (names, dates) that contradict the company report, but the company report contains logistical data (payroll, shipments) consistent with external economic records.

  **Task**
  Given the inversion of authority (the written record is interested, the memory is marginalized), argue when memory should yield to the record and when the record should yield to memory in this case. Is the Convergence Requirement the right way to draw that line, or does it smuggle in the assumption that memory and history are answering the same question?

  ***

  **MODEL ANSWER**

  The Oakhaven case breaks the standard hierarchy where written archives automatically satisfy the Evidential Office and oral tradition is relegated to the Constitutive. Here, the archive is a partisan instrument. If the Evidential Office requires answerability to "what happened," the company report is suspect not because it is written, but because its creation was motivated to justify violence. However, the oral tradition is also suspect; martyrdom narratives often sanitize complexity. The question is not which source is truer by default, but which office is being prioritized and whether the Convergence Requirement can manage the conflict.

  First, we must determine when the record should yield to memory. If the town adopts the Convergence Requirement, they can keep the massacre story only if they admit it is mythic rather than factual. But this creates a problem. The constitutive work of the story—solidarity against oppression—relies on the claim that injustice *actually occurred*. If the workers were actually armed insurgents, the moral claim changes from "martyrs" to "combatants." A corrected record might still sustain solidarity (fighting back is also virtuous), but it changes the *kind* of identity. If the specific nature of the injustice (a massacre) is essential to the community's current political claims (e.g., reparations or memorialization), then the Constitutive Office cannot be separated from the Evidential. In this specific instance, the record should yield to memory only if the archive's bias is so profound that it cannot be trusted to adjudicate the violence at all. If the company controlled the narrative completely, the oral tradition becomes the only counter-evidence, functioning evidentially despite its oral form.

  Conversely, memory should yield to the record when the constitutive work relies on a falsehood that harms others or prevents necessary adaptation. If the town defines itself by victimhood that never happened, it may obscure actual historical grievances or alienate potential allies. The Convergence Requirement attempts to solve this by forcing the community to say: "We know this didn't happen exactly this way, but we need this story to be who we are." This is honest, but it risks neutering the political power of the memory.

  This leads to the deeper flaw in the Convergence Requirement: it assumes history and memory are answering the same question (what happened?) and merely negotiating the tolerance for error. In reality, they are often answering different questions. The Evidential Office asks, "What is verifiable?" The Constitutive Office asks, "What is meaningful?" The Requirement tries to force the Constitutive to stop making truth claims, but communities often experience meaning *as* truth. To tell Oakhaven to stop claiming the massacre happened is to tell them their identity is a lie.

  Therefore, the Convergence Requirement is too clean. It works for benign myths but fails for traumatic history where the factual claim is the source of the moral weight. A better line is not whether they stop claiming it happened, but whether they remain open to new evidence. The record should yield to memory when the record is structurally silenced (as here, with no state records). Memory should yield to the record when the record reveals harm that the memory obscures. The tension isn't just about accuracy; it's about authority. In Oakhaven, the archive is not a neutral referee; it is a defendant. Until independent evidence appears, the oral tradition must hold the Evidential Office by default, not just the Constitutive one, because a biased record fails the evidential test. The Convergence Requirement fails because it asks the victims to treat their trauma as optional symbolism while treating the oppressor's ledger as the baseline for "fact."

  ***

  **MARKING SCHEME (25 Marks Total)**

  **1. Recognition of Archive Bias (5 Marks)**
  *   **Criterion:** The answer must explicitly challenge the neutrality of the written archive, noting that "written" does not equal "evidentially superior" in this specific case.
  *   **Common Failure:** Treating the company report as inherently more reliable than oral tradition simply because it is a written document.

  **2. Application of Offices to Case (5 Marks)**
  *   **Criterion:** The answer must apply "Evidential" and "Constitutive" specifically to the mill town's conflict, not just define the terms abstractly.
  *   **Common Failure:** Defining the two offices correctly in the introduction but failing to use them to analyze the specific dynamics of the 1919 confrontation.

  **3. Critique of the Convergence Requirement (5 Marks)**
  *   **Criterion:** The answer must evaluate the Requirement's condition (stop claiming truth) and argue whether it is practical or ethical for this community.
  *   **Common Failure:** Accepting the Convergence Requirement as obviously correct or sensible without testing its limits against the stakes of the case.

  **4. The "Same Question" Problem (5 Marks)**
  *   **Criterion:** The answer must address whether history and memory are asking different questions (verification vs. meaning) and how this impacts the validity of the Requirement.
  *   **Common Failure:** Assuming the tension is solely about factual accuracy rather than the different functional goals of the two accounts.

  **5. Normative Conclusion (5 Marks)**
  *   **Criterion:** The answer must take a definitive stand on when one yields to the other, providing criteria rather than sitting on the fence.
  *   **Common Failure:** Concluding that "both are important" or "it depends" without specifying the conditions under which one priority overrides the other.

  ***

  **DISTINCTION BETWEEN A AND B GRADES**

  A **B-level answer** will correctly apply the apparatus: it will identify the archive's bias, distinguish the two offices, and use the Convergence Requirement to suggest a compromise (e.g., "keep the story but admit it's symbolic"). It will be fluent and logically consistent but will ultimately accept the exam's framework as sufficient to solve the problem. An **A-level answer** will identify where the framework itself breaks down. It will argue that the Convergence Requirement fails because it demands a separation of truth and meaning that is impossible for traumatic identity, or it will argue that in cases of structural silencing, oral tradition *must* occupy the Evidential Office by default. The A answer treats the apparatus as a tool to be stress-tested, not a solution to be applied.
