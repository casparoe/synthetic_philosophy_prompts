answer: |-
  **Essay Question**

  Consider Max Black's universe containing only two exactly similar iron spheres, one mile apart. Standardly, this is thought to refute the Principle of Identity of Indiscernibles (PII). However, a rival proposes that this world is better described as containing just *one* sphere that is wholly present at two places at once (bilocation). If correct, there is only one object, so the PII is not threatened.

  In a continuous essay, answer the following:
  1.  State the PII and clearly distinguish numerical identity from qualitative identity.
  2.  Explain how a Bundle Theorist, a Substratum Theorist, and a Haecceitist would each analyze the standard *two-sphere* interpretation of this world.
  3.  Evaluate the bilocation proposal. Is it a genuine alternative description, a distinct possible world, or incoherent? What does your answer imply for the modal status of the PII (necessary, contingent, or false)?

  ***

  **Model Answer**

  The Principle of Identity of Indiscernibles (PII) states that necessarily, for any objects x and y, if x and y share all qualitative properties, then x is numerically identical to y. Numerical identity concerns being one and the same object (x = y), whereas qualitative identity concerns sharing all properties (exact duplication). Black's case attempts to show numerical distinctness without qualitative difference.

  Under the standard two-sphere interpretation, metaphysical commitments diverge sharply. A Bundle Theorist, who holds that objects are nothing over and above collections of properties, faces a crisis. If spatial location is a relational property, the spheres differ (one is *here*, the other *there*). But if we abstract from space or treat space as relational between the spheres, they share all properties. For the Bundle Theorist, sharing all properties entails being one object. Thus, they must deny the possibility of Black's world entirely or insist spatial relations individuate. A Substratum Theorist posits bare particulars underlying properties. For them, the spheres are distinct because they instantiate different bare particulars, even if their qualitative profiles match. The PII is false because numerical distinctness rests on substrata, not qualities. Similarly, a Haecceitist argues objects possess primitive "thisness" (haecceity). The spheres are distinct because they have different haecceities, rendering the PII false as a necessary truth; distinctness does not require qualitative grounding.

  The bilocation wrinkle attempts to salvage the PII by redescribing the world as one object in two places. This description is arguably incoherent without smuggling in individuation. For one sphere to be wholly present at location L1 and location L2, L1 and L2 must be distinct. If space is absolute, L1 and L2 are distinct entities. If space is relational, the relations must differ. But if the universe contains only this object and space, what individuates L1 from L2? If nothing does, they are the same place, and bilocation collapses into single location. If something does (e.g., distinct spatial points), we have merely shifted the indiscernibility problem from spheres to spatial points. We now have two indiscernible locations hosting one object.

  Furthermore, bilocation typically implies that one object bears incompatible relations simultaneously (e.g., being one mile from itself). While logic might tolerate this, it offers no metaphysical gain. If the rival claims this is the "same world" described differently, they deny the intuitive numerical distinctness of the spheres. But if the spheres are numerically one, causal interactions between "them" become causal interactions of an object with itself, altering the physics of the thought experiment. Therefore, bilocation is not a neutral redescription; it is a distinct metaphysical hypothesis that presupposes individuated spaces.

  Consequently, the bilocation move fails to save the PII. It either collapses into the two-object view (because locations individuate) or pushes the indiscernibility problem onto space itself. Since the Substratum and Haecceitist accounts remain coherent without invoking bilocation, we should accept that numerical distinctness does not require qualitative difference. The PII is not a necessary truth. Whether it is contingently true depends on whether bare particulars or haecceities exist in the actual world, but metaphysically, the principle is false. Distinctness is primitive, not derivative of quality.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Definitions and Distinctions (4 Marks)**
  *   **A (4):** Clearly states PII (∀x∀y(∀F(Fx ↔ Fy) → x=y)). Explicitly distinguishes numerical identity (one object) from qualitative identity (sharing properties).
  *   **B (2-3):** States PII vaguely or conflates numerical/qualitative identity (e.g., implies PII means "no two things look alike").
  *   **C (0-1):** Fails to define PII or confuses identity types fundamentally.

  **2. Analysis of Metaphysical Theories (6 Marks)**
  *   **A (5-6):** Correctly identifies that Bundle Theory threatens the possibility of the world (or relies on spatial properties), while Substratum and Haecceitism allow the world but reject PII.
  *   **B (3-4):** Lists the theories but fails to connect them to the PII's status (e.g., doesn't note Bundle Theory denies the possibility).
  *   **C (0-2):** Misattributes views (e.g., claims Bundle Theorists accept bare particulars).

  **3. Evaluation of the Bilocation Wrinkle (6 Marks)**
  *   **A (5-6):** Argues bilocation is either incoherent or shifts the problem to spatial points. Recognizes it is not a neutral redescription.
  *   **B (3-4):** Treats bilocation as a viable solution without critiquing the individuation of locations.
  *   **C (0-2):** Dismisses bilocation without argument or accepts it as saving PII without qualification.

  **4. Conclusion and Modal Status (4 Marks)**
  *   **A (4):** Takes a definite stance (e.g., PII is false/contingent) justified by the previous analysis.
  *   **B (2-3):** Hedges too much ("it depends") without committing to a metaphysical picture.
  *   **C (0-1):** No clear conclusion.

  **Specific Penalties & Common Mistakes**
  *   **-2 Marks:** Begging the question by labeling the spheres "Sphere A" and "Sphere B" to prove distinctness.
  *   **-2 Marks:** Treating the PII as a claim about qualitative identity by definition (tautologizing).
  *   **-2 Marks:** Ignoring the bilocation wrinkle in the conclusion.

  **A-Grade Differentiator:**
  To secure an A, the student must recognize that the bilocation objection presupposes individuated locations, thereby failing to escape the original problem of indiscernibles. They must integrate the metaphysical theories (e.g., how a Bundle Theorist would view bilocation) rather than treating them as isolated definitions.
