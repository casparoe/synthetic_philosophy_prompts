answer: |-
  First, welcome to the club. You have stumbled onto one of the central tensions in the philosophy of science, and you've done it from the ground up, which is exactly where it matters. Your intuition is spot-on: standard scientific practice *does* look schizophrenic if you try to force it into a single philosophical box.

  You are right about the Friedman reference (Milton Friedman, 1953, *The Methodology of Positive Economics*). That is the manifesto of **Instrumentalism**: theories are tools for prediction, not maps of reality. If the tool works, the blueprints don't have to match the building.

  But as you noted, physicists don't actually behave like pure instrumentalists. If we did, we wouldn't care about mechanisms, and we wouldn't get annoyed when someone proposes a "black box" model that fits the data but violates conservation laws.

  Here is a breakdown of what your practice actually presupposes, the distinction you were told about, and what would happen if we stopped pretending the tension doesn't exist.

  ### 1. Idealization vs. Abstraction
  The distinction you heard about is real and crucial (championed recently by philosophers like Michael Weisberg).

  *   **Abstraction** is *omission*. You leave out the color of the pendulum bob because it's irrelevant to the period. You aren't saying the bob has no color; you are saying the theory doesn't represent that feature.
  *   **Idealization** is *distortion*. You set friction to zero. The surface *has* friction, but you represent it as having none. You are actively misrepresenting a property to make the math tractable.

  **Why this matters:** Abstraction is safe; idealization is dangerous. When you abstract, you admit ignorance or irrelevance. When you idealize, you make a claim that the distortion doesn't matter for the specific question at hand. Your complaint about "no error bar on the idealization" is essentially a demand that physicists treat idealizations as *sources of uncertainty* rather than *foundational truths*.

  ### 2. The "Limiting Case" Defense (Approximate Realism)
  You asked: *Does using a knowingly false assumption commit you to models being mere prediction devices?*

  For most bench physicists, the answer is **no**. The prevailing (often unspoken) view is what we might call **Approximate Realism** or **Structural Realism**.

  When you use the Ideal Gas Law, you don't actually believe gas molecules have zero volume. You believe that the Ideal Gas Law is the **limiting case** of a truer model (like Van der Waals) as certain parameters go to zero. You presuppose that there is a continuous path from the false idealization to the messy reality.

  This is why you feel comfortable saying the model "explains" the pressure increase. You believe the *causal structure* (kinetic collisions transfer momentum) is true, even if the *parameters* (molecular size) are distorted. You are a realist about the mechanism, but an instrumentalist about the specific coefficients.

  ### 3. The "Monday/Tuesday" Inconsistency
  Is the practice self-consistent? **Logically, no. Pragmatically, yes.**

  If you force a philosopher to categorize you, you look like an inconsistent realist. But from the perspective of **Model-Based Science** (a view associated with Nancy Cartwright and Margaret Morrison), this isn't a bug; it's a feature.

  On this view, models are **mediators**. They sit between theory and the world.
  *   **Monday (Instrumentalism):** When you are crunching numbers to calibrate a detector, you treat the model as a tool. You don't need the model to be "true," you need it to be stable and predictive.
  *   **Tuesday (Realism):** When you are writing the discussion section or designing a follow-up experiment, you treat the model as a representation of causal powers. You need to know *why* it worked so you know where it will break.

  Nancy Cartwright, in her book *How the Laws of Physics Lie*, argues exactly what you are sensing: Fundamental laws (like Newton's Law of Gravitation) are strictly false everywhere because they apply only to idealized systems. They are "true" only in what she calls **nomological machines**—carefully constructed setups (like your lab) where we have shielded out the interference to make the idealization hold.

  So, practice presupposes that **truth is local, not global.** The Ideal Gas Law isn't "approximately true" of all gases everywhere; it is "exactly true" inside the specific conditions where intermolecular forces are negligible compared to thermal energy.

  ### 4. What Would Change if We Swapped the View?
  If we stopped treating idealizations as "free" and adopted a cleaner philosophical framework (specifically, treating models as *autonomous* from theory), here is what would change in teaching and practice:

  **A. Error Bars on Assumptions (Sensitivity Analysis)**
  You noted we never put error bars on the idealization. In a more philosophically rigorous regime, every model would require a **Sensitivity Analysis**.
  *   *Current:* "We assumed a frictionless surface."
  *   *New:* "We assumed a frictionless surface. We tested the model with $\mu = 0.01$ and the result changed by 2%. Therefore, the idealization contributes <2% uncertainty."
  *   This treats the idealization as a parameter to be bounded, not a divine axiom.

  **B. Domain of Validity over "Truth"**
  We teach students that $F=ma$ is a law of the universe. A better approach would be to teach it as a model with a specific **domain of validity**.
  *   We would emphasize *where the model breaks* as much as where it works.
  *   We would stop saying "The ideal gas law is an approximation" and start saying "The ideal gas law is a distinct model that applies in this regime, while Van der Waals applies in that one." This prevents the confusion that reality is "actually" ideal and we just can't measure it well enough.

  **C. Mechanism vs. Phenomenology**
  We would be more honest about the split you observed.
  *   **Phenomenological models:** Admittedly instrumental. Used for interpolation and prediction. No claim to mechanism.
  *   **Explanatory models:** Must survive the "mechanism test." If it predicts right but gets the mechanism wrong, it is demoted to "phenomenological."
  *   Currently, we blur these. Making them distinct would prevent students from thinking a curve-fit is an explanation.

  ### 5. Which Rival Pictures Does Practice Rule Out?
  Your practice quietly rules out **Fundamentalism** (the idea that there is one True Equation at the bottom of everything and models are just approximations of it).

  If you were a true Fundamentalist, you wouldn't be happy with the Ideal Gas Law ever. You would insist on using the most fundamental quantum mechanical description possible. The fact that you happily use thermodynamics without thinking about QED implies you believe in **Emergence**. You accept that higher-level models (thermodynamics) have their own validity that isn't just "derived" from lower-level models (quantum mechanics), but stands on its own within its domain.

  ### Summary
  You aren't inconsistent; you are a **Pragmatic Pluralist**.
  *   You use **Instrumentalism** to calculate (does it work?).
  *   You use **Realism** to explain (does it make sense?).
  *   You use **Limiting Case reasoning** to connect them (can I de-idealize this?).

  The "nagging" you feel is the friction between these stances. If we taught this explicitly, we wouldn't produce worse physicists. We would produce physicists who are more careful about the boundaries of their models, who treat assumptions as sources of error, and who understand that a model is a map, not the territory—and that different maps are needed for different terrains.

  You've essentially rediscovered the "Semantic View of Theories" from the bench up. It's a very comfortable place to be, once you realize the inconsistency is a feature of the trade, not a bug in your thinking.
