prompt: |-
  A while ago a friend of mine — she's the sociologist, I'm the philosophy person in the group — got into it with me over the old Berkeley graduate-admissions numbers from the early seventies. You probably know the case: the university looks like it admitted men at a much higher rate than women overall, but once you break it down department by department, the gap mostly evaporates and in a bunch of departments women were actually being admitted at rates at least as good as the men's — the aggregate looked bad mainly because women tended to apply to the departments that were hardest to get into. She thinks that's just Simpson's paradox in the wild and there's nothing more to say. I think that's way too quick and I want to write something about it, so I'd like your help doing a proper two-way analysis rather than a summary.

  First direction: treat the episode as a clean worked example of Simpson's paradox and be disciplined about the mapping — what exactly is being aggregated, what the lurking variable is, what the reversal looks like numerically, and why the two levels of analysis feel like they point at opposite conclusions. Then flip it around and tell me what the episode does to the *theory*. Here's the thing I actually care about, and where I think most discussions cheat. I want to pry apart two things people sloppily run together. Call the first an aggregation reversal — just the brute mathematical fact that a trend under one grouping can flip under a finer one, which honestly isn't paradoxical at all once you see it. Call the second a paradoxical reversal — a case where the two levels are being offered as answers to the *same* causal question, so the flip genuinely seems to undercut a conclusion. My hunch is that Berkeley is usually sold as the second kind but is really the first kind in disguise, and that what looks like a paradox is actually a fight about which causal question we're asking: is the relevant contrast admitted-or-not holding department fixed, or the university taken as a whole? So — is my hunch right, and where does it break down? Does the distinction I'm drawing do any real work, or does it collapse the moment you press on it?

  And then tell me what this all shows about Simpson's paradox as a "theory" in the first place — is it really one thing, or is it better seen as a fact about conditioning glued to a fact about causal structure, and what would a case have to look like to be a genuine counterexample to the intuition that the finer-grained analysis is the more trustworthy one? I'd much rather you be honest about where the paradox goes quiet and just doesn't explain anything than force it to account for every detail. No need to cite or reference anything, just reason it through out loud.
