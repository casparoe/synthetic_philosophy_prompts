          6.  Identify where SP goes quiet/doesn't explain anything.
      *   **Constraint:** No citations/references. Reason it through out loud. Be honest about limitations.

  2.  **Deconstruct Part 1: The Worked Example (The "Clean" View):**
      *   *Variables:* Gender (Men/Women), Admission (Yes/No), Department (A-F, roughly).
      *   *Aggregation:* Overall admission rates vs. Department-specific admission rates.
      *   *Lurking Variable:* Department choice (or Department difficulty/selectivity).
      *   *The Reversal:* Overall: Men > Women. Conditional (by Dept): Women $\ge$ Men (mostly).
      *   *Why it feels paradoxical:* We intuitively expect the whole to reflect the parts. If women do better (or equal) in every part, they should do better in the whole.
      *   *The Mechanism:* Women apply disproportionately to hard departments (low acceptance rates for everyone). Men apply to easy departments. The weighting of the departments differs by gender.
      *   *Discipline:* Stick to the numbers logic. $P(Admit|Male) > P(Admit|Female)$, but $P(Admit|Male, Dept_i) \le P(Admit|Female, Dept_i)$.

  3.  **Deconstruct Part 2: The Theory & The User's Distinction:**
      *   *User's Distinction:*
          1.  **Aggregation Reversal:** Pure math. Weighted averages can flip. No paradox, just arithmetic.
          2.  **Paradoxical Reversal:** Causal conflict. Both levels claim to answer "Is there discrimination?"
      *   *User's Hunch:* Berkeley is sold as (2) but is actually (1). The "paradox" is just ambiguity about the causal question (Department-fixed vs. University-wide).
      *   *Evaluation:* Is this right?
