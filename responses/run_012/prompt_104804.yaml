          *   Causally, is it a Paradoxical Reversal? Only if we assume "Discrimination" is a single, univocal property.
          *   If "Discrimination" means "Bias in the review process within a department," then the departmental data wins.
          *   If "Discrimination" means "Systemic barriers preventing women from applying to easy departments," then the aggregate data matters.
          *   *Verdict:* The user is mostly right. The "paradox" dissolves once we specify the causal query. The tension isn't in the math; it's in the *ontology* of the harm.
      *   *Where it breaks down:* It breaks down if we assume the departmental choice is *itself* caused by prior discrimination (socialization, pipeline issues). If Dept Choice is a mediator vs. a confounder.
          *   If Dept Choice is a *confounder* (affects admission and correlated with gender but not caused by gender): Control for it.
          *   If Dept Choice is a *mediator* (Gender -> Dept Choice -> Admission): Controlling for it blocks the path of discrimination.
          *   In Berkeley, Dept Choice is likely a mix. But the legal/ethical question usually focused on the *decision point* (the admission committee). Hence, departmental control was deemed appropriate.

  4.  **Deconstruct Part 3: Simpson's Paradox as "Theory":**
      *   Is SP a theory? No. It's a statistical phenomenon (a theorem about inequalities).
      *   It becomes "theoretical" only when glued to causal assumptions (Causal DAGs, though I won't use that jargon explicitly).
      *   *Conditioning + Causal Structure:* SP tells you "Conditioning changes associations." It *doesn't* tell you "Which conditioning is correct." That requires external causal knowledge.
      *   *The "Finer-Grained is Trustworthy" Intuition:* Is this always true?
          *   No. If you condition on a *collider* or a *mediator*, you introduce bias or hide total effects.
          *   Example: If we are looking for the *total effect* of Gender on Admission, aggregating is correct. If we are looking for the *direct effect* (bias in review), disaggregating is correct.
          *   Genuine Counterexample to "Finer is Better": Suppose a drug helps men and women separately, but hurts the population because it's given to sicker people. Wait, that's the standard SP.
          *   Better Counterexample: Suppose we want to know the *total impact* of a policy. Disaggregating might hide the fact that the policy shifts people into worse categories. (e.g., Gender -> Major -> Salary. If we control for Major, we hide the fact that women are pushed into low-paying majors).
