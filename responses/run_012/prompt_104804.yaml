      *   **Section 4: SP as Theory.** It's not a theory. It's a warning label. It says "Stop and think about causality." It doesn't solve the causality.
      *   **Section 5: The "Finer-Grained" Intuition.** Crush this intuition. Show cases where finer-grained analysis hides the real harm (mediators).
      *   **Conclusion:** Summarize. The Berkeley case isn't a paradox of numbers; it's a paradox of *description*.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I cite Bickel? *Correction:* No, user said no citations. Keep it general.
