      *   **User's View:** That's too quick. Wants a "proper two-way analysis."
      *   **Core Task:**
          1.  Treat the episode as a clean worked example of SP (mapping variables, aggregation, reversal).
          2.  Flip it to analyze what the episode does to the *theory* of SP.
          3.  Specifically, evaluate the user's distinction between "Aggregation Reversal" (mathematical fact) and "Paradoxical Reversal" (causal conflict).
