prompt: |-
  I run the exceptions desk at a mid-sized humanitarian org. I'm not a philosopher, I'm just the person who gets the awkward requests. We have a short public list of things we say we never do: we don't pay armed groups for access or to get our staff released, we don't hand beneficiary data over to governments, and we don't decieve people to get their consent to be in our research. Maybe a dozen times a year some country office asks for an exception, and the argument is always the same shape: fine, this one thing breaks the rule, but doing it prevents several more breaks of the very same rule down the line. Five more detentions if we don't pay. Thousands of patients dropped if we don't hand over the list. A study that would save a lot of lives if we're allowed to be sneaky just this once.

  That's the bit I can't get my head around. If the whole reason we have these rules is that each person matters and shouldn't be used as a tool, then we should care a lot about the extra people who get hurt when we stick to the rule, so why not break it? But the moment we start weighing the numbers we don't have rules anymore, we have a cost-benefit sheet, and the rules were supposed to be exactly the thing that stops us doing that.

  So please turn this into a decision procedure my desk can actually run. The order of the questions, what counts as a good enough answer to each, where it just stops with a no, and where it hands the call to a human because it's a value judgment and not a fact. It has to be runnable by a smart non-philosopher in an afternoon on incomplete information, and it has to keep whatever it is that makes a rule a rule rather than a number to be traded. I want it to be able to say: the fact that there are more people on the other side doesn't cancel the reason not to do this to this one person. But it still has to admit that some exceptions are genuinely right. Throw in a step for the what-if-everyone-copies-us worry, and be clear that that's a seperate kind of reason from the one the rule is made of.

  Then run it on three: (1) the payment to get two staff back, where not paying has correlated with more detentions but we can't prove it; (2) the beneficiary list, where refusing probably kills the programme for thousands and handing it over puts a few people in real danger; (3) a case I'll hate, where a field team wants to mislead a local official to move medical supplies through and save several lives, and I suspect your procedure says no. I want to watch it say no to me. Anything that overrides a rule has to go to the board, so the output has to be something I can put in front of them.

  At the end, tell me straight which steps are just judgment dressed up as procedure, and what this thing can't do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Runs the exceptions desk at a mid-sized humanitarian org. Pragmatic, overworked, deals with high-stakes ethical dilemmas. Not a philosopher, needs actionable tools.
      *   **Context:** The org has "red lines" (no paying armed groups, no sharing beneficiary data, no deception in research).
      *   **The Conflict:** Country offices argue for utilitarian exceptions (break one rule to save many lives/prevent more rule breaks). The user feels the tension between deontology (rules matter regardless of consequences) and consequentialism (outcomes matter).
      *   **The Goal:** A decision procedure (algorithm/checklist) that:
          *   Can be run by a smart non-philosopher in an afternoon.
          *   Works with incomplete information.
          *   Preserves the integrity of the rule (doesn't just turn it into a cost-benefit analysis).
          *   Acknowledges that *some* exceptions are valid but rare.
          *   Includes a "universalizability" check (what if everyone does this?).
          *   Produces a output suitable for the Board.
          *   Is tested on three specific cases.
          *   Ends with a candid admission of limitations (where judgment hides).

  2.  **Deconstruct the Ethical Tension:**
      *   *The Rule:* Based on rights/dignity (Kantian/Deontological). "Don't use people as tools."
      *   *The Exception Argument:* Based on consequences (Utilitarian). "Save more lives."
      *   *The User's Insight:* If we just weigh numbers, the rule disappears. But if we never bend, we might cause preventable harm.
      *   *The Solution:* A "Threshold Deontology" approach. Rules are absolute *until* a catastrophic threshold is met, but the burden of proof is incredibly high, and the justification must not undermine the rule's future validity.

  3.  **Drafting the Decision Procedure (The "Exceptions Protocol"):**
      *   *Name:* Needs to sound official but clear. "The Red Line Integrity Protocol."
      *   *Structure:* Sequential gates. If you fail a gate, you stop or escalate.
      *   *Step 1: Verification.* Is this actually a violation? (Fact check).
      *   *Step 2: The "Necessity" Test.* Is there *any* other way? (Last resort).
      *   *Step 3: The "Threshold" Test.* Is the harm of following the rule *catastrophic* and *immediate*? (Not just "better," but "disaster").
      *   *Step 4: The "Integrity" Test.* Does doing this destroy the rule for next time? (Precedent).
      *   *Step 5: The "Publicity" Test.* Could we tell the donors/beneficiaries later? (Transparency).
      *   *Step 6: Escalation.* If all passed, who decides? (Board, not desk).

      *Refining the Logic:* The user wants to preserve the rule's status. So the procedure shouldn't *allow* the exception easily. It should *identify* when an exception is so compelling it requires Board intervention, while filtering out the "cost-benefit" shortcuts.
      *Key Constraint:* "The fact that there are more people on the other side doesn't cancel the reason not to do this to this one person." -> This means Step 3 can't just be a headcount. It needs to be about *systemic collapse* or *immediate loss of life* that is certain, not probabilistic.

      *Revised Steps:*
      1.  **Classification:** Is this a Core Principle Violation?
      2.  **Exhaustion:** Have all non-violating alternatives been tried?
      3.  **Immediacy & Certainty:** Is the harm of *inaction* immediate and near-certain (not speculative)?
      4.  **Proportionality (Non-Numerical):** Does the violation directly prevent the specific harm, or is it a trade-off? (Avoid "kill one to save five").
      5.  **Universalizability:** If every org did this, would the humanitarian space collapse?
      6.  **Recommendation:** Approve for Board / Reject.

  4.  **Testing the Procedure on the Three Cases:**

      *   *Case 1: Ransom for Staff.*
          *   Rule: No paying armed groups.
          *   Argument: Prevents more detentions.
          *   Test: Exhaustion? (Negotiations done?). Immediacy? (Lives at risk). Certainty? (User says "correlated... can't prove it").
          *   Universalizability: If everyone pays, kidnapping becomes a business model.
          *   Result: Likely Reject/Board. The "prevents more detentions" argument is speculative.

      *   *Case 2: Beneficiary Data.*
          *   Rule: No data to governments.
          *   Argument: Program dies (thousands suffer) vs. few in danger.
          *   Test: Exhaustion? (Anonymized data?). Immediacy? (Program closure). Certainty? (Govt *will* misuse data?).
          *   Universalizability: If orgs share data, trust evaporates. Beneficiaries stop seeking help.
          *   Result: Likely Reject. The harm to the "few" is rights-based (persecution), the harm to "thousands" is service-based. Rights usually trump services in humanitarian law.

      *   *Case 3: Deception for Supplies.*
          *   Rule: No deception.
          *   Argument: Save lives (medical supplies).
          *   Test: Exhaustion? (Official channels blocked). Immediacy? (Patients die without meds). Certainty? (High).
          *   Universalizability: If orgs lie, access gets tighter for everyone.
          *   Result: This is the tricky one. The user suspects it says "No." I need to make sure the procedure holds the line but acknowledges the tragedy. The "Integrity" of the organization is the casualty here.

  5.  **Refining the Output for the Board:**
      *   The output needs to be a "Memorandum of Exception."
      *   It needs to clearly state: "We recommend [Decision] because [Reason]."
      *   It needs to highlight the ethical cost, not just the operational gain.

  6.  **Addressing the "Judgment dressed as Procedure" Requirement:**
      *   I need to be honest. Where does the algorithm fail?
      *   It fails on defining "Catastrophic."
      *   It fails on predicting "Precedent."
      *   It fails on weighing incommensurable values (Trust vs. Lives).
      *   The procedure doesn't *make* the decision; it *structures* the decision for the humans who must own it.

  7.  **Final Polish:**
      *   Tone: Professional, empathetic, rigorous, unpretentious.
      *   Formatting: Clear headings, bold text for decision points.
      *   Ensure the "No" in Case 3 feels earned, not robotic.

      *(Self-Correction during drafting)*: I initially thought about letting the desk approve minor exceptions. But the prompt says "Anything that overrides a rule has to go to the board." So the procedure's job is *triage and preparation*, not final approval. The procedure determines if the case is *strong enough to waste the Board's time* and *how to frame it*. Actually, re-reading: "It has to be runnable by a smart non-philosopher... and it has to keep whatever it is that makes a rule a rule."
      Okay, the procedure should act as a filter. Most requests should die at the desk. Only the truly existential ones reach the Board.
      Wait, the prompt says: "Anything that overrides a rule has to go to the board, so the output has to be something I can put in front of them."
      So the procedure *evaluates* the request. If it passes the high bars, it goes to the Board with a "Recommendation to Consider Exception." If it fails, it's a "Recommendation to Deny."
      Actually, the safest interpretation for a "Red Line" org is: The Procedure *never* authorizes the exception. It only *recommends* Board review if the threshold is met. If the threshold isn't met, the Desk says No.
      Let's refine: The Procedure determines if the argument is *coherent enough* to present to the Board. If the logic is purely utilitarian ("5 > 1"), the Procedure kills it. If the logic is about "Systemic Collapse," it passes to Board.

      *Wait, one more check:* "I want it to be able to say: the fact that there are more people on the other side doesn't cancel the reason not to do this to this one person."
      This means the procedure must explicitly reject simple aggregation.
      Okay, I will build a "Aggregation Blocker" into Step 3.

      *Case 3:* The user suspects the procedure says no. I need to make sure it does, but explains *why* without being heartless. The reason is the erosion of trust/access for *everyone* in the long run.

      *Final Plan:*
      1.  Introduction: Acknowledge the burden.
      2.  The Protocol (5 Steps).
      3.  The Board Memo Template.
      4.  Running the 3 Cases.
      5.  The "Honesty Section" (Limitations).

      *Let's write it.*
answer: |-
  This is the **Red Line Integrity Protocol (RLIP)**. It is designed to do exactly what you asked: prevent simple cost-benefit analysis from overriding core principles, while acknowledging that catastrophic scenarios exist where strict adherence might become complicity in harm.

  It does not give you the authority to say "Yes." It gives you the framework to say "No" confidently, or to say "This is too heavy for me; the Board must own this."

  ### Part 1: The Decision Procedure

  **Operator:** Exceptions Desk Officer
  **Time Limit:** 4 Hours
  **Input:** Exception Request Form + Supporting Evidence
  **Output:** Recommendation to Deny OR Memorandum for Board Review

  #### Step 1: The Classification Gate (Fact Check)
  *Question:* Does this request explicitly require violating a written Core Principle (Red Line)?
  *   **Yes:** Proceed to Step 2.
  *   **No:** This is an operational constraint, not an ethical exception. Handle via standard operations. Stop.
  *   **Incomplete Info:** Request clarification. If not received in 24 hours, **Recommendation: Deny.** (Ambiguity favors the rule).

  #### Step 2: The Exhaustion Test (Necessity)
  *Question:* Have all non-violating alternatives been attempted or proven impossible?
  *   **Criteria:** The requester must list at least three alternative paths tried or ruled out with evidence (e.g., emails to authorities, alternative routes, third-party negotiators).
  *   **Pass:** Alternatives documented and verified as impossible.
  *   **Fail:** Alternatives exist but are "too slow," "too expensive," or "unlikely."
  *   **Decision:** If **Fail**, **Recommendation: Deny.** Convenience is not necessity.

  #### Step 3: The Aggregation Blocker (Rights vs. Numbers)
  *Question:* Is the justification based primarily on "more lives saved vs. fewer lives lost"?
  *   **Criteria:** This step prevents simple utilitarianism.
  *   **The Test:** If the request argues "We violate Person A's rights to save Persons B, C, and D," it fails here *unless* the harm to B, C, and D is **immediate, certain, and catastrophic** (e.g., death within 48 hours), AND the violation does not permanently destroy the organization's ability to operate.
  *   **Decision:** If the argument is purely numerical ("5 detentions vs. 2"), **Recommendation: Deny.** The rule exists specifically to block this math.
  *   **Pass:** The argument is about preventing the *total collapse of access* or *immediate mass mortality* where the rule itself becomes a tool of harm. Proceed to Step 4.

  #### Step 4: The Universalizability Check (Precedent)
  *Question:* If every humanitarian organization made this exception in these specific circumstances, would the humanitarian space cease to function?
  *   **Criteria:** Look for systemic risk.
      *   *Paying Ransom:* Makes kidnapping a business model for all. (High Risk)
      *   *Sharing Data:* Destroys beneficiary trust for all. (High Risk)
      *   *Deception:* Validates government suspicion for all. (Medium/High Risk)
  *   **Decision:** If the answer is "Yes, this would destroy the sector's neutrality/access," **Recommendation: Deny.** No single mission is worth the sector's collapse.
  *   **Pass:** The circumstances are so unique (e.g., specific regime, specific natural disaster) that precedent is unlikely to set. Proceed to Step 5.

  #### Step 5: The Sunlight Test (Accountability)
  *Question:* Can we document this action internally and disclose it to donors/auditors later without resignations or loss of funding?
  *   **Criteria:** If the action requires permanent secrecy to remain viable, it is corrupt by definition.
  *   **Decision:** If **No** (must be kept secret forever), **Recommendation: Deny.**
  *   **Pass:** We can own this decision publicly if forced. Proceed to Output.

  #### Output Generation
  *   **If any step failed:** Draft **Memorandum of Denial**. Cite the specific step failed.
  *   **If all steps passed:** Draft **Memorandum for Board Review**. Do not recommend "Yes." Recommend "Review Required." State: "The threshold for Board intervention has been met. The Desk cannot adjudicate this tension between Principle X and Outcome Y."

  ---

  ### Part 2: The Board Memorandum Template
  *(Use this only if Step 5 is passed)*

  **TO:** Board of Directors / Ethics Committee
  **FROM:** Exceptions Desk
  **SUBJECT:** Critical Exception Request [Case ID]
  **RECOMMENDATION:** Board Adjudication Required

  **1. The Rule:** [Quote Core Principle]
  **2. The Request:** [Brief description of violation]
  **3. The Stakes:**
      *   *Cost of Adherence:* [Specific, immediate harm if rule is followed]
      *   *Cost of Violation:* [Specific harm to rights/trust/precedent]
  **4. Protocol Status:** Passed RLIP Steps 1-5.
  **5. The Ethical Tension:** This is not a calculation of numbers. This is a conflict between [Principle A] and [Principle B]. The Desk determines that adhering to the rule in this specific instance may result in [Catastrophic Outcome], but violating it risks [Systemic Harm].
  **6. Decision Required:** The Board must accept liability for either the immediate harm or the precedent set.

  ---

  ### Part 3: Running the Cases

  Here is how the RLIP processes your three scenarios.

  #### Case 1: Payment for Staff (Ransom)
  *   **Step 1 (Classification):** Violation of "No paying armed groups." **Pass.**
  *   **Step 2 (Exhaustion):** Negotiations attempted? Yes. Other leverage? **Pass.**
  *   **Step 3 (Aggregation):** Argument is "Not paying correlates with more detentions."
      *   *Analysis:* This is speculative ("correlated," "can't prove"). It is not immediate certainty of death for others *right now*. It is a probabilistic argument about future safety.
      *   *Result:* **FAIL.** The Aggregation Blocker stops this. You cannot trade a concrete violation (funding terrorism/armed groups) for a speculative reduction in future risk.
  *   **Output:** **Memorandum of Denial.**
  *   **Reasoning:** "The request relies on probabilistic future outcomes to justify a concrete violation of neutrality. This converts the rule into an insurance policy, which undermines its absolute nature."

  #### Case 2: Beneficiary List (Data Sharing)
  *   **Step 1 (Classification):** Violation of "No data to governments." **Pass.**
  *   **Step 2 (Exhaustion):** Can anonymized data be provided? Can a third party hold it? If the government demands *names*, alternatives are likely exhausted. **Pass.**
  *   **Step 3 (Aggregation):** Argument is "Thousands lose treatment vs. few in danger."
      *   *Analysis:* This is a direct numbers game. However, the harm to the "few" is rights-based (persecution/death), while the harm to the "thousands" is service-based (no meds). In humanitarian law, protection trumps assistance.
      *   *Result:* **FAIL.** Sharing data actively endangers specific individuals. Withholding data passively denies services. Active harm violates the "Do No Harm" principle more severely than passive withdrawal.
  *   **Step 4 (Universalizability):** If all orgs share data when pressured, beneficiaries will stop registering. The program dies anyway in 6 months.
      *   *Result:* **FAIL.**
  *   **Output:** **Memorandum of Denial.**
  *   **Reasoning:** "Trading specific individuals' safety for program continuity destroys the trust required to run the program long-term. The rule protects the ecosystem, not just the current cohort."

  #### Case 3: Deception for Medical Supplies
  *   **Step 1 (Classification):** Violation of "No deception." **Pass.**
  *   **Step 2 (Exhaustion):** Official channels blocked. Bribery refused. No other route. **Pass.**
  *   **Step 3 (Aggregation):** Argument is "Patients die without meds."
      *   *Analysis:* This is immediate, certain harm (death/suffering). It is not speculative.
      *   *Result:* **PASS.** (This is the threshold where "catastrophic" might apply).
  *   **Step 4 (Universalizability):** If all orgs lie to officials to move goods, officials will increase inspections, blockades, and suspicion. Access shrinks for everyone.
      *   *Analysis:* High risk. But is it *total* collapse? Maybe not. It depends on the scale.
      *   *Result:* **Borderline.** Let's say it **Passes** narrowly because the deception is minor (e.g., mislabeling a vehicle) vs. the harm (death).
  *   **Step 5 (Sunlight):** Can we tell donors we lied to a warlord?
      *   *Analysis:* Probably not. Legal liability.
      *   *Result:* **FAIL.**
  *   **Output:** **Memorandum of Denial.**
  *   **Reasoning:** "While the immediate harm is catastrophic, the requirement for permanent secrecy indicates the action is unsustainable. If we cannot own the decision, we cannot make it. The risk to the organization's legal and ethical standing is too high."

  *(Note: You suspected it would say no. It did. The "Sunlight Test" is the killer here. If you have to hide it, it's probably wrong.)*

  ---

  ### Part 4: The Honest Admission

  You asked me to tell you straight where the judgment is hiding and what this thing can't do. Here it is:

  **1. The "Catastrophe" Definition is Subjective**
  Step 3 (Aggregation Blocker) tells you not to just count heads, but it allows an exception for "immediate, certain, catastrophic" harm. Who defines catastrophic? Is 50 deaths catastrophic? 500? A whole region? The procedure pretends this is a factual threshold. It is not. It is a moral intuition dressed up as a gate. You are still deciding how much blood is "enough" to consider breaking a rule, even if you aren't allowed to say it's a trade-off.

  **2. The "Universalizability" Prediction is a Guess**
  Step 4 asks: "What if everyone did this?" We don't know. We are guessing human behavior. Maybe everyone doing it creates a new norm that works. Maybe it destroys everything. The procedure forces you to make a prediction about the future of the humanitarian sector based on incomplete data. That is not a fact; it is a belief.

  **3. It Cannot Resolve Incommensurable Values**
  The procedure structures the conflict, but it cannot solve it. It creates a "Memorandum for Board Review" when the tension is too high. This admits that the procedure *fails* at the exact moment you need it most. It kicks the can to the Board. It protects *you*, but it doesn't solve the *dilemma*.

  **4. The "Sunlight Test" Assumes Rational Actors**
  Step 5 assumes that if an action is right, it can be disclosed. History shows that sometimes, morally necessary actions (like hiding Jews in WWII) *must* remain secret to work. The procedure biases heavily toward institutional self-preservation over radical moral necessity. It protects the Organization first, the Beneficiaries second.

  **5. What It Can't Do**
  It cannot give you a clean conscience. It cannot guarantee that following the rule won't result in people dying. It cannot guarantee that breaking the rule won't result in the organization collapsing. It is a risk management tool, not a truth machine.

  **Final Advice:**
  Use the RLIP to filter out the lazy utilitarianism (Cases 1 & 2). It will save you 80% of your headaches. For the 20% that pass (like a modified Case 3 where secrecy isn't required), use the Board Memo to force the leadership to look you in the eye and accept the sin. That is the only way a rule remains a rule: when someone with authority is willing to bleed for it, or pay for the exception.
