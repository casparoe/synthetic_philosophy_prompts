answer: |-
  It is understandable why the practice feels inconsistent, because on the surface it looks like you are building a precise engine to find the single best option and then deliberately choosing to drive a fleet of different cars instead. However, the whole ritual rests on a specific normative architecture that renders the ranking and the hedging compatible, provided you accept a few heavy philosophical premises. At its core, the scoring practice presupposes a form of consequentialism where the right action is the one that maximizes the expected good. The three dimensions of importance, tractability, and neglectedness are not arbitrary categories but are actually heuristic proxies for the components of a marginal expected value calculation. Importance estimates the total stake or the size of the benefit, tractability estimates the probability or elasticity of success given additional resources, and neglectedness accounts for the diminishing marginal returns of funding. When you multiply them, you are implicitly claiming that these factors are commensurable and separable, meaning they can all be translated into a common currency of value, usually understood as welfare units or lives saved, and that the contribution of each factor to the final value is multiplicative rather than additive or lexicographical. This strictly requires a view of value that is aggregative and monistic, ruling out deontological constraints where certain actions are forbidden regardless of the score, or virtue ethical views where the character of the agent matters more than the outcome.

  The load-bearing assumption here is commensurability. For the arithmetic to make sense rather than serving as a mere metaphor, you must believe that a unit of progress in biosecurity can be meaningfully compared to a unit of progress in factory farming via a common denominator. If you held a strong value pluralist view where justice, welfare, and freedom are incommensurable goods that cannot be traded off against one another, the multiplication would collapse because there is no common scale on which to multiply them. You could not say that reducing suffering is worth twice as much as increasing autonomy, so the spreadsheet would lose its normative force and become merely a descriptive list of unrelated projects. Furthermore, the arithmetic treats the dimensions as independent variables for the sake of the model, even though in reality they are often correlated. This independence is largely a convenience that allows for modular estimation, but the deeper requirement is that the marginal value of resources is a function of these three factors specifically. If you believed that historical justice or rights violations mattered independently of future consequences, the importance score would fail to capture the true value, and the ranking would be systematically biased.

  The portfolio carve-out for moral uncertainty is actually consistent with the rubric if you view the rubric as calculating expected value conditional on a specific moral worldview. The practitioners are not ignoring the ranking; they are applying a higher-order expected utility calculation across competing moral theories. If an agent is unsure whether utilitarianism or rights-based ethics is true, they assign credences to each view. The ITN score calculates the choiceworthiness of a cause under the utilitarian view, while other frameworks might score causes differently. By funding a portfolio, they are maximizing expected choiceworthiness across their distribution of moral credences, not just empirical uncertainty within one theory. So the rubric is still doing the work, but it is being used as an input for a meta-ethical aggregation rather than the final arbiter of action. This concedes that the rubric is not theory-neutral but is instead internal to a consequentialist framework, and the hedging acknowledges that the consequentialist framework itself might be only partially correct. What strictly requires this setup is the commitment to maximizing expected choiceworthiness under moral uncertainty, while what merely fits nicely is the specific use of the ITN framework rather than a more complex model.

  If you were to swap the underlying view for value pluralism, the practice would have to change fundamentally because you could no longer aggregate the scores into a single number. Instead of a ranking, you would have a Pareto frontier of causes, where some are better for justice and others for welfare, with no mathematical way to declare one superior. You would need a decision procedure that respects incomparability, perhaps satisfying sufficient constraints across different values rather than maximizing a sum. If you swapped to a prioritarian view, which gives greater weight to benefits affecting the worse off, the rubric could survive but the definition of importance would need to be adjusted. Importance would no longer be the sum total of good done but the sum of weighted good, where the weight depends on the baseline welfare of the recipients. This would likely shift rankings toward causes helping the poorest humans rather than existential risks affecting future generations, assuming the future generations are not considered worse off than the current poor. In both cases, the simple multiplication of three independent scores would likely be insufficient, requiring either a pluralistic dashboard or a weighted aggregation function that explicitly encodes the priority view, revealing that the current ritual is uniquely tailored to a form of impersonal total utilitarianism smoothed over by moral uncertainty.
