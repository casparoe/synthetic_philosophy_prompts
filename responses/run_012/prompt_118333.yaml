answer: |-
  You have stumbled onto one of the most famous puzzles in 20th-century metaphysics, and your colleague was right: there is a literature, and it has names for these things. The good news is that once you have the names, the "joints" become much clearer, and you can stop feeling embarrassed. The bad news is that this literature exists specifically to prove that the definition your students keep sliding into ("disposed to X" just means "would X if the trigger came") is false.

  Here is the map you need, translated from metaphysics into ethics.

  ### The Core Debate: The Conditional Analysis
  To understand the labels, you need to know what they are fighting. The definition your students like is called the **Simple Conditional Analysis (SCA)** of dispositions.
  *   **SCA:** To say someone *is* generous is just to say: *If* they were asked for money, they *would* give it.

  Philosophers (notably C.B. Martin and David Lewis in the 1990s) showed that this definition breaks. Your cases (a) and (b) are the famous wrecking balls. Cases (c) and (d) are variations that matter more for ethics than for pure metaphysics.

  Here is how your four cases map onto the literature.

  ---

  ### Case (a): The Fink
  **Your description:** *The trait is gone exactly when the moment arrives... not overridden, just absent.*
  **Established Name:** **A Finkish Disposition (or simply a "Fink").**

  **The Joint:** This cuts between *having* a property and *keeping* it.
  In the standard metaphysical example, a wire is "live" (disposed to conduct electricity). But there is a "finkish" mechanism attached to it: the moment the wire is touched by a conductor, the mechanism instantly makes the wire dead.
  *   **The Puzzle:** Is the wire live? Yes, before you touch it.
  *   **The SCA Test:** If you touched it, would it conduct? No, because touching it makes it dead.
  *   **The Result:** The SCA says "It's not live" (because it wouldn't conduct). But we know it *is* live. Therefore, SCA is wrong.

  **Ethical Translation:** This is the person whose courage evaporates the moment danger appears, or whose generosity vanishes the moment a request is made. Crucially, the stimulus (the danger/request) *causes* the loss of the trait.
  **Why it matters for your course:** It saves the trait from being falsified by the failure. You can say, "He *was* brave, but the fear acted as a finkish mechanism that stripped the bravery away at the critical second." It preserves the attribution of character even when the action fails.

  ### Case (b): The Mask
  **Your description:** *The trait is intact... but something outside stops it.*
  **Established Name:** **A Mask.**

  **The Joint:** This cuts between the *intrinsic basis* of the trait and the *extrinsic conditions* of its manifestation.
  In the standard example, a poison is disposed to kill. But if you take an antidote at the same time, you don't die. The poison is still poisonous (it still has the chemical structure), but its power is "masked."
  *   **The Puzzle:** Is the poison poisonous? Yes.
  *   **The SCA Test:** If you ingested it, would you die? No (because of the antidote).
  *   **The Result:** SCA says "It's not poisonous." False.

  **Ethical Translation:** Your frozen bank account example is perfect. The generosity is real (the willingness is there), but an external blocker prevents the *action*.
  **Why it matters for your course:** It distinguishes *will* from *ability*. If you judge character by outcomes alone, you will misjudge masked virtues. This is the metaphysical grounding for saying "He meant well" or "He would have if he could."

  ---

  ### Case (c): The Latent (or Emergent) Disposition
  **Your description:** *The trait only shows up because the moment arrives... before it there was no resilience to speak of... And yet 'they'd have coped if it had come' still seems true.*
  **Established Name:** **No standard name.** (Closest: **Dormant Power** or **Latent Disposition**).

  **The Joint:** This cuts between *state* and *history*.
  This is the trickiest one. Metaphysically, if it is true that "they would have coped if it had come," then they *did* have the disposition all along, even if it was never tested. The disposition was **Dormant**.
  However, your description says "before it there was no resilience." This suggests the crisis *created* the resilience. If the crisis created it, it wasn't a disposition *before* the crisis.

  **I will coin a term for you:** **Retroactive Attribution.**
  If the trait only exists *because* the situation called it forth, it isn't a stable character trait (a disposition); it is a situational response.
  *   **If they had it all along (Dormant):** Then it fits the standard model. They just never had a chance to show it.
  *   **If the situation made it (Emergent):** Then this is a major problem for Virtue Ethics. It suggests character isn't a stable internal state, but a relational property between person and context.

  **Why it matters for your course:** This is the entry point for **Situationism** (the critique by Doris and Harman). If (c) is the norm—that people only show virtue when the specific context supports it—then "character traits" as stable, cross-situational dispositions might not exist. This case troubles the idea that character is something you *carry with you*.

  ### Case (d): The Missing Enablement
  **Your description:** *Trait intact, moment arrives... nothing is standing in the way... but the background is just wrong. A tree in bad soil.*
  **Established Name:** **Violation of Ceteris Paribus Conditions.** (Often lumped in with **Masks**, but distinct).

  **The Joint:** This cuts between *interference* and *support*.
  In the literature, (b) and (d) are often grouped together as "Masks." A frozen account (b) and bad soil (d) both prevent manifestation. But your intuition is correct: there is an ethical difference.
  *   **Case (b) is an Active Blocker:** Something steps in to stop the action.
  *   **Case (d) is a Passive Lack:** The necessary support system is absent.

  **I will coin a term for you:** **Contextual Defeat.**
  The disposition is real, the stimulus is real, but the *enabling conditions* are missing. A seed has the disposition to grow, but without water, it won't. The water isn't a "blocker"; it's a requirement.

  **Why it matters for your course:** This is the home of **Moral Luck**. If a generous person grows up in a culture of scarcity (bad soil), their generosity may never fruit. Are they less generous? Metaphysically, no (the disposition is intact). Ethically/Socially, it's harder to say. This case helps you discuss how environment cultivates or starves virtue.

  ---

  ### Summary: Which case kills the "Would If" definition?

  You asked which case shows that *"disposed to X" just means "would X if the trigger came"* is wrong.

  **The answer is (a) and (b).**
  These are the logical proof-cases.
  *   **Finks (a)** show you can have the disposition but lose it upon triggering.
  *   **Masks (b)** show you can have the disposition but be stopped externally.
  In both cases, the person *has* the virtue, but the statement "If triggered, they would do X" is **false**. Therefore, having the virtue cannot *mean* "If triggered, they would do X."

  **Cases (c) and (d)** are different. They don't break the logic of dispositions as much as they complicate the **ontology of character**.
  *   (c) asks: *When* do we get the trait? (Before or during the crisis?)
  *   (d) asks: *Where* does the trait live? (In the person, or in the person-plus-environment?)

  ### How to teach this without metaphysics jargon

  You don't need to teach your students about "counterfactual conditionals." You can teach them the **Three Barriers to Virtue**:

  1.  **The Internal Vanishing (The Fink):** "I thought I was brave, but when the moment came, I wasn't me anymore." (The trait was fragile).
  2.  **The External Blocker (The Mask):** "I was ready to help, but the system stopped me." (The trait was blocked).
  3.  **The Missing Soil (Contextual Defeat):** "I had the will and the chance, but I didn't have the resources/support." (The trait was starved).

  And then add the **Situationist Warning (Case c)**:
  4.  **The Mirage:** "We think we are resilient because we survived the crisis, but maybe the crisis made us resilient only for that moment." (The trait was an illusion).

  ### The Takeaway for Your Syllabus

  Your colleague was right about "Finks and Masks." Use those terms for (a) and (b); they are standard and will help you if you ever publish on this.

  For (c) and (d), trust your ethical intuition over the metaphysicians. Metaphysicians lump (d) in with Masks. You should keep it separate because in ethics, *being stopped* (b) is different from *not being supported* (d). And (c) is the most dangerous one for virtue ethics, because it suggests character might not be a stable thing we possess at all.

  If you need a label for (c) to put on a slide, call it **Latency vs. Emergence**.
  If you need a label for (d), call it **Enabling Conditions**.

  This vocabulary lets you say: "A virtue is a disposition. But dispositions can be **Finkish** (lost on trigger), **Masked** (blocked externally), or **Contextually Defeated** (lacking support). And we must beware of **Emergent** traits that look like character but are actually just situational responses."

  That should get you through the semester without embarrassment.
