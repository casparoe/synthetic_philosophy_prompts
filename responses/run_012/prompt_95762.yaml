      *   *Interpretation B: The Weak/Empirical Reading.* It's a probabilistic balancing act. In *principle*, testimony could outweigh the prior improbability. But in *practice*, human testimony is so flawed (lying, delusion, error) that it never actually does. The "never happens" is an empirical claim about human reliability, not a logical impossibility.
      *   *Interpretation C: The "Definition" Reading.* A miracle is a violation of a law of nature. A law of nature is a generalization from exceptionless experience. If an exception occurs, either it wasn't a law (just a regularity) or the testimony is false. We should always prefer the latter to maintain scientific utility.

