answer: |-
  **OFFICE OF UNCHOSEN CIRCUMSTANCES | CITIZEN SUPPORT PORTAL**
  **SUBJECT: COMPENSATION ELIGIBILITY AND LIABILITY ASSESSMENT (FORM 88-B)**

  **1. What distinguishes a compensable disadvantage from a non-compensable one?**
  Compensation is strictly limited to deficits arising from *Ambient Misfortune* (brute luck). Disadvantages resulting from *Volitional Hazards* (option luck) are the sole responsibility of the agent. To qualify, you must demonstrate that the negative outcome occurred without your consent, foresight, or risk assumption. If you engaged in an activity where the probability of loss was non-zero, any resulting deficit is classified as a "Choice Dividend" and is ineligible for redistribution. Please refer to the *Agency-Consent Waiver* signed during your majority initiation.

  **2. I invested my savings in a high-yield venture that failed. Why was my claim denied?**
  Your submission indicates a voluntary transfer of resources into a speculative asset class. Under Section 4.2 of the Justice Alignment Act, losses incurred through calculated risk-taking are considered *Option Luck Realizations*. Since you retained the potential upside of the investment, you must also bear the downside. Compensating this loss would effectively socialize your risk while privatizing your gain, violating the neutrality principle. You are advised that future prudence is your primary insurance mechanism. The Office does not insure against poor judgment, only against unchosen circumstance.

  **3. I require more resources than average to pursue my specific artistic and culinary interests. Can I claim this as a disadvantage?**
  Claims based on *Preference Liability* are subject to rigorous scrutiny. Resources are allocated to ensure equal welfare potential, not equal welfare outcomes. If your high-cost preferences were cultivated voluntarily, you are liable for the extra cost. You must prove these tastes were innate and unavoidable. Submit Form 99-T (Taste Origin Verification) alongside psychological evaluations confirming you could not have developed cheaper preferences under similar upbringing conditions. Note: Claims based on a "need" for imported goods or rare materials are typically rejected as lifestyle choices.

  **4. My child was born with a congenital condition. Why is my parental history being investigated?**
  While congenital conditions are prima facie *Ambient Misfortune*, eligibility requires ruling out *Imputed Parental Risk*. We must determine if your residence, diet, or occupational choices during gestation increased the probability of the condition. If you lived in a zone known for environmental hazards voluntarily, the disadvantage may be reclassified as a *Volitional Hazard* inherited by the dependent. Please provide geolocation data for the 24 months preceding birth. If a safer alternative residence was financially viable but not selected, the condition may be deemed a result of chosen circumstance.

  **5. An investigator is asking me to prove what I would have done if I had known the outcome. Is this required?**
  Yes. To verify *Null-Choice Baseline* status, you must establish the counterfactual path. You need to demonstrate that under identical initial conditions, a reasonable agent would have acted differently to avoid the disadvantage. This requires a sworn affidavit detailing the alternative life trajectory you would have undertaken had the risk been known. Speculative evidence is not accepted; you must provide corroborating testimony from peers who knew your risk profile at the time. Incomplete counterfactuals result in automatic denial, as we cannot compensate for disadvantages you might have avoided.

  **6. I disagree with the classification of my disadvantage. How do I appeal?**
  Appeals are processed by the Tribunal of Unchosen Variables. Please note that filing an appeal requires proving that the initial assessment was not the result of your own failure to provide adequate evidence. The queue for tribunal review is currently 18 months. During this waiting period, no interim compensation is issued, as providing resources during a liability dispute would prejudice the justice of the final allocation. If your situation deteriorates while awaiting review, this is considered a continuation of the original outcome sovereignty and is not separately compensable.
