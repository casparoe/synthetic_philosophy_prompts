      *Theory:* We don't believe in *Basic* Desert (cosmic), but we believe in *Moral* Responsibility (reasons-responsive). Therefore, we can treat people differently based on their moral engagement, even if risk is same. That's the absurdity.

  9.  **Final Polish:**
