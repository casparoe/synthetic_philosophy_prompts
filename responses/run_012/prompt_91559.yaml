answer: |-
  Your intuition is correct: dismissing the run-up to the Iraq War as mere "herd behavior" in the colloquial sense (irrational conformity) is analytically lazy. However, your friend is right to be skeptical if you are trying to force the episode into the standard **Informational Cascade** model (Bikhchandani, Hirshleifer, and Welch). The standard model cannot sustain the weight of the historical facts, specifically regarding signal independence and cascade fragility.

  My definite position is this: The march to war was not an Informational Cascade; it was a case of **Reputational Herding (Scharfstein and Stein)**, compounded by **correlated signal error**.

  The standard Informational Cascade model fails because it assumes agents are truth-seekers optimizing only on the accuracy of their decision based on private and public information. The Iraq case demonstrates agents optimizing for **political access and career safety** within a hierarchy that punished dissent. This shift in payoff structure explains why the cascade was robust rather than fragile. Here is the precise mapping and the breakdown.

  ### 1. Mapping the Standard Informational Cascade (and where it breaks)

  To treat this as a standard Informational Cascade (IC), we must map the variables:
  *   **Agents:** Intelligence agencies (CIA, MI6, DIA), allied governments (UK, Australia), and key policymakers.
  *   **Sequence:** Roughly 2001 to February 2003 (Powell's UN speech).
  *   **Private Signal:** Raw intelligence (intercepts, human sources like Curveball).
  *   **Public Signal:** Previous agents' public assessments (the October 2002 NIE, Blair's dossiers, Powell's UN presentation).
  *   **Decision:** To assess that WMDs exist and justify regime change.

  **The Break on Independence:**
  The IC model requires private signals to be *conditionally independent* given the state of the world. If Iraq has no WMDs, Agency A's signal should not predict Agency B's signal, except through the truth.
  In Iraq, this assumption was violated structurally. The "private signals" were not independent samples of reality; they were circular. Curveball (the source for mobile labs) was vetted by the BND (German intelligence) but his data was funneled to the CIA and MI6 without independent verification. When the CIA cited the mobile labs, and MI6 cited the mobile labs, they appeared to be independent confirmations. In reality, they were the same noisy signal counted twice. This created a **correlated error cascade**. The agents were not observing independent draws; they were observing echoes.

  **The Break on Fragility:**
  The hallmark of an IC is fragility. Because the cascade is based on the *weight* of prior actions rather than the *content* of private information, a small amount of credible public information should shatter it.
  In early 2003, Mohamed ElBaradei (IAEA) publicly identified the Niger uranium documents as forgeries. Hans Blix reported no evidence of active WMD programs. The State Department's INR (Bureau of Intelligence and Research) filed dissenting footnotes in the NIE.
  In a standard IC, these are high-value public signals that should reset the Bayesian count. They did not. The consensus hardened *after* these disconfirmations. An Informational Cascade cannot explain why agents ignored strong public disconfirmation to follow the herd.

  ### 2. The Case for Reputational Herding

  The model that fits is **Reputational Herding**, as formalized by Scharfstein and Stein (1990). In this model, agents care not only about making the correct decision but about how their decision affects their reputation for ability (or loyalty) relative to peers.

  **The Mapping:**
  *   **Agents:** Intelligence analysts and agency heads.
  *   **Payoff Function:** Maximizing the probability of retaining political access and avoiding marginalization.
  *   **The "Herd":** The White House / Office of the Vice President / Downing Street.
  *   **The Signal:** The political wind.

  In the Scharfstein-Stein framework, if an agent deviates from the herd and is wrong, they look incompetent (or disloyal). If they stay with the herd and are wrong, they share the blame with everyone else ("We all thought that").
  In the Iraq context, the "reputation" being protected was not just epistemic accuracy but **bureaucratic survival**. The administration had signaled clearly (via the creation of the Office of Special Plans and the pressure on the CIA) that the preferred policy outcome was regime change. An analyst who issued a dissenting assessment wasn't just providing a conflicting data point; they were signaling a lack of alignment with the principal's goals.

  **Why this explains the Fragility Failure:**
  In an Informational Cascade, new information changes the *belief* about the state of the world. In Reputational Herding, new information changes the *cost of dissent*.
  When ElBaradei debunked the Niger documents, the *informational* value of the herd's claim dropped. However, the *reputational* cost of breaking with the Administration remained high. In fact, it likely increased. By early 2003, the momentum for war was a political juggernaut. Dissenting at that stage wasn't just saying "the intel is wrong"; it was saying "the President is lying." The reputational penalty for that action (exile, firing, leaking of classified info to discredit you, as happened to Wilson and Plame) outweighed the epistemic benefit of correcting the record.
  Therefore, rational agents ignored the disconfirming evidence not because they didn't believe it, but because the payoff structure made ignoring it the dominant strategy.

  ### 3. What the Episode Shows About the Theory

  This episode does not invalidate cascade theory; it clarifies the boundary conditions between its variants.

  1.  **Information vs. Incentives:** The standard Informational Cascade model is a theory of *learning*. It assumes agents want to know the truth. The Iraq case proves that when the primary incentive shifts from *learning* to *aligning*, the predictions of the IC model (fragility, independence) no longer hold. You cannot model political intelligence failures using a model designed for investment markets or technology adoption where profit/truth is the sole metric.
  2.  **The Danger of Correlated Signals:** The Iraq case highlights a specific vulnerability in intelligence networks that standard theory often underestimates: **source conflation.** When multiple agents rely on a single sub-source (Curveball) but treat them as independent, the mathematical confidence of the cascade grows exponentially while the actual information gain is linear (or zero). This suggests that cascade models applied to intelligence need a "correlation discount" factor.
  3.  **Robustness through Politicization:** The most disturbing theoretical takeaway is that **politicization creates robustness.** In a pure Informational Cascade, the herd is fragile because it is built on a house of cards. In a Reputational Herding scenario driven by political pressure, the herd is fortified by the penalty for dissent. The more the process is politicized, the *less* responsive it becomes to new information.

  ### Conclusion

  Your friend is wrong that it was mindless "herd behavior." It was rational behavior within a distorted incentive structure. But you are also slightly off to call it a standard Informational Cascade.

  It was **Reputational Herding**. The agents were behaving rationally, but they were optimizing for bureaucratic survival and political alignment, not Bayesian truth-seeking. This is why the cascade did not break when the Niger documents were exposed: in a reputational game, the cost of being the lone dissenter outweighs the benefit of being the lone truth-teller. The theory predicts that when payoffs are tied to conformity rather than accuracy, cascades become robust against disconfirmation. The Iraq War is the empirical proof of that specific theoretical constraint.
