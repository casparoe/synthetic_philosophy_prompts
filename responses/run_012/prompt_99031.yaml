  This is a classic setup from population ethics, specifically revolving around **Parfit's Repugnant Conclusion** and the **Spectrum Argument**. Your mate is navigating the tension between Total Utilitarianism (which implies the Repugnant Conclusion) and quality-based views.

  Here is the breakdown of the two readings, my prediction, the bet, and the decisive test.

  ### 1. The Two Readings & Their Predictions

  **Reading A: The Threshold View (Transitive)**
  This is the "floor" hypothesis you mentioned. Formally, this looks like **Critical Level Utilitarianism** or a **Threshold View**. The rule is: *A world's value is the sum of welfare scores, but only for people above a certain welfare level $C$.*
  *   **The Math:** If we set the threshold $C$ at roughly 72–75, her verdicts are perfectly consistent and transitive.
      *   $1M @ 100$: Counts fully.
      *   $16M @ 80$: Counts fully (since $80 > C$). The sheer number outweighs the slight drop in quality.
      *   $64M @ 70$: Counts for zero (or negative) because $70 < C$.
  *   **Prediction for 1M @ 100 vs. 16M @ 80:** She will say **1M @ 100 is Worse.**
      *   *Why?* Because 80 is above the floor. In a transitive system, she is bound by the chain she already affirmed ($1M < 2M < 4M < 8M < 16M$). To say otherwise would be a logical contradiction.

  **Reading B: The Intransitive View (Non-Transitive)**
  This reading suggests she accepts the **Spectrum Argument**: "Better than" is not a transitive relation. Small losses in welfare compensated by small gains in numbers are acceptable locally ($A < B$), but over a long chain, the accumulation of quality loss outweighs the numbers ($A > Z$).
  *   **The Logic:** She accepts the local links ($1M < 2M... < 16M$) but denies that the chain forces the end comparison. She trusts her direct intuition on the pair ($1M$ vs $16M$) over the derived implication.
  *   **Prediction for 1M @ 100 vs. 16M @ 80:** She *could* say **1M @ 100 is Better.**
      *   *Why?* If she is a committed intransitivist, she is free to reject the chain's conclusion. However, since 80 is still a high welfare level, she might reserve the reversal for more extreme cases (like the 64M @ 70 case). But the distinctive feature of this view is that "Better" is a *live option* here, whereas it is forbidden in Reading A.

  ### 2. The Bet

  **I would bet she says: "1 Million at 100 is Worse."**

  **Why?**
  1.  **Theoretical Economy:** Intransitivity is a "nuclear option" in ethics. It breaks standard decision theory (you can be money-pumped). Most PhDs in this field spend their careers trying to find a *transitive* theory (like Critical Level Utilitarianism) that avoids the Repugnant Conclusion without breaking logic.
  2.  **The Fit:** The data fits a Critical Level model ($C \approx 72$) perfectly. It explains the chain (all above $C$) and the reversal (70 is below $C$) without requiring her to abandon transitivity.
  3.  **Consistency:** She has already verbally affirmed the chain links leading to 16M @ 80. Unless she is actively trying to provoke you with meta-ethical paradoxes, she will likely maintain consistency with her previous statements.

  ### 3. The Decisive Test

  The comparison of 1M @ 100 vs. 16M @ 80 is actually a weak test because an intransitivist might *also* say "Worse" (saving the reversal for more extreme welfare drops). To force the two theories apart, you need a case where the **Threshold View succumbs to numbers** but the **Intransitive View holds out for quality**.

  **Put this comparison to her:**
  > **"1 Million at 100" vs. "1 Trillion at 75"**

  *   **Threshold View (Transitive):** Since 75 is above the critical level (which we estimated at ~72), the Trillion people count. The total value is astronomical.
      *   *Verdict:* **1 Million at 100 is Worse.**
  *   **Intransitive View:** The welfare gap (100 vs. 75) is significant enough that no amount of people can compensate for it. The "quality" intuition trumps the "quantity" intuition regardless of the number.
      *   *Verdict:* **1 Million at 100 is Better.**

  This forces a split: if she says "Worse," she's likely a Transitivist (Threshold or similar). If she says "Better," she's likely an Intransitivist (or holds a view that strictly prioritizes quality).

  ### 4. The "Something Else"

  There is a third theory that fits her verdicts just as well, avoids the "cliff" of the Threshold view, and preserves transitivity without embracing intransitivity. It is called **Number-Dampened Utilitarianism** (or the **Variable Value View**).

  *   **The Rule:** Value increases with population size, but at a diminishing rate. Adding a million people to a world of 1 million adds a lot of value; adding a million to a world of 1 trillion adds almost none.
  *   **Why it fits:** It explains why $1M < 2M < ... < 16M$ (numbers still matter at this scale) but $1M > 64M @ 70$ (the dampening effect kicks in hard at high populations, preventing the Repugnant Conclusion).
  *   **Difference:** Unlike the Threshold view, there is no hard "cliff" at 75. Lives at 70 still count for *something*, just not enough to outweigh the quality drop at that scale.
  *   **Prediction on the Decisive Test:** Like the Intransitive view, this theory would likely say **1 Million at 100 is Better** than 1 Trillion at 75, because the value of the population caps out while the quality loss remains fixed.

  **Summary:** Bet on **Worse** for the 16M case (she's likely a Transitivist). Use the **1 Trillion @ 75** case to see if she's a Threshold Utilitarian (Worse) or a Quality-Prioritizer (Better).
