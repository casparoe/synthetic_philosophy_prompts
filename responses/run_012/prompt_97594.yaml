prompt: |-
  I teach a 90-minute graduate seminar in judgment and decision-making, about 18 students, and I want them to feel the outside view as a personal surprise rather than hear it described. Design a runnable activity, with rules, materials, and a timeline, in which every participant first makes an inside-view forecast about a real piece of work they have already begun, and then a structured procedure forces each of them onto a reference class and a base rate, so that the gap between the two numbers is something they discover about themselves rather than something I announce. I do not want the session to end on the simple moral that the outside view is better. Build in a second stage in which a plausible reference class misleads, because it pools cases that differ in a way that matters, so that the group has to hold both views at once instead of trading one for the other. Include a debrief that maps each stage onto the inside/outside distinction and the problem of choosing a reference class; state what will predictably go wrong the first time the activity is run and how to handle it; and say plainly which part of the idea the activity cannot reproduce and that I will have to supply myself. In the write-up, separate what is settled among people who study forecasting from what is genuinely contested, and in particular do not present the claim that the outside view is generally more accurate as though it were consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute graduate seminar in Judgment and Decision-Making (JDM).
      *   **Audience:** ~18 graduate students.
      *   **Goal:** Make the "outside view" (reference class forecasting) a *personal surprise* rather than a lecture point.
      *   **Core Mechanism:** Participants forecast their own ongoing work (Inside View) -> Forced onto a reference class/base rate (Outside View) -> Discover the gap themselves.
      *   **Critical Twist:** Do *not* end on "Outside View is always better." Include a second stage where a plausible reference class *misleads* (heterogeneity problem). Students must hold both views.
      *   **Debrief:** Map stages to Inside/Outside distinction and Reference Class problem.
      *   **Failure Analysis:** Predict what will go wrong the first time and how to handle it.
      *   **Limitations:** State what the activity *cannot* reproduce (instructor must supply).
      *   **Epistemic Status:** Distinguish between settled science and contested claims in forecasting (specifically regarding the superiority of the outside view).
      *   **Format:** Runnable activity with rules, materials, timeline.

  2.  **Deconstruct the Core Concepts:**
      *   *Inside View:* Focusing on the specifics of the case, plans, intentions, unique obstacles. (Kahneman & Lovallo).
      *   *Outside View:* Focusing on the statistics of a relevant class of similar cases.
      *   *The Twist:* Reference Class Tennis (Tetlock/Gardner). Choosing the *wrong* reference class leads to bad predictions. The "Outside View" isn't a magic bullet; it requires judgment to select the class.
      *   *Epistemic Nuance:* While base rates are crucial, the claim that "outside view > inside view" is not universally true in all contexts (e.g., unique innovations, changing environments). It's a heuristic, not a law of physics.

  3.  **Drafting the Activity - Stage 1 (The Surprise):**
      *   *Task:* Students need a project they are working on. Since it's a grad seminar, they likely have a term paper or thesis proposal.
      *   *Inside View:* Ask them to estimate completion time or quality score based on their plan.
      *   *Outside View:* Need a base rate. Since I can't know their specific projects beforehand, I need a generic but relevant reference class. "Graduate seminar papers" is too broad. "Papers by students in this room" is better but requires data collection *during* class.
      *   *Idea:* Use the "Class Average" as the immediate outside view.
      *   *Procedure:*
          1.  Write down own estimate (Time to finish).
          2.  Collect estimates anonymously.
          3.  Calculate median/mean.
          4.  Reveal the class average.
          5.  *Wait, this is just peer comparison.* It needs to be a *base rate of outcomes*, not just peer estimates.
      *   *Better Idea:* Use historical data from *previous* iterations of this course (if available) or a standard statistic about grad student project slippage.
      *   *Best Idea for "Personal Surprise":* Have them define the reference class themselves, then show them the base rate for that class.
      *   *Refined Stage 1:*
          1.  Inside View: "When will you submit?" (Date/Hours).
          2.  Define Class: "What kind of project is this?"
          3.  Reveal Base Rate: Instructor provides pre-collected data on similar projects (e.g., "Past students with similar scope took X weeks").
          4.  Comparison: Calculate the "Optimism Bias" ratio.

  4.  **Drafting the Activity - Stage 2 (The Twist):**
      *   *Goal:* Show that reference classes can be misleading.
      *   *Mechanism:* Provide a *different* reference class that yields a different base rate.
      *   *Example:* A student is writing a paper on AI ethics.
          *   Class A: "Humanities term papers" (Base rate: 3 weeks).
          *   Class B: "Projects involving new software tools" (Base rate: 8 weeks).
      *   *Task:* Students must identify *two* plausible reference classes for their project that give *conflicting* base rates.
      *   *Outcome:* They realize the Outside View requires *judgment* to select the class.

  5.  **Addressing Epistemic Status:**
      *   *Settled:* People suffer from planning fallacy. Base rates are often ignored.
      *   *Contested:* How to weight inside vs. outside. Whether outside is *always* superior (sometimes inside info is diagnostic). The definition of "similar" cases.

  6.  **Addressing Limitations:**
      *   The activity can't reproduce the *emotional cost* of abandoning a plan.
      *   The activity can't provide *true* long-term validation (we won't know who was right until the end of the term).
      *   The instructor must supply the *authority* of the base rate data (students might distrust it).

  7.  **Timeline Construction (90 Minutes):**
      *   Intro (5 min)
      *   Stage 1: Inside View & The Gap (25 min)
      *   Stage 2: Reference Class Tennis (30 min)
      *   Debrief & Epistemology (20 min)
      *   Buffer/Closing (10 min)

  8.  **Refining the "Failure Analysis":**
      *   *Risk:* Students pick trivial projects. *Fix:* Require instructor approval or specific criteria.
      *   *Risk:* Students distrust the base rate data. *Fix:* Acknowledge this in debrief.
      *   *Risk:* Stage 2 feels like "anything goes." *Fix:* Require justification for class selection.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Epistemic Claim:* I need to be careful not to say "Outside view is better." I need to say "Outside view corrects specific biases, but introduces aggregation errors."
      *   *Self-Correction on Materials:* Keep it low tech. Index cards or slips of paper work better than laptops for focus.
      *   *Self-Correction on Data:* I (the instructor) need to bring the base rate data. I can't generate it in class. I will assume the instructor has data from past years or can use a proxy (e.g., "Average time to publish a paper in field X"). Let's suggest the instructor prepares a "Base Rate Sheet" based on past cohorts or general discipline statistics.

  10. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   18 students? Yes.
      *   Personal surprise? Yes (comparing own number to stat).
      *   Second stage (misleading class)? Yes (Reference Class Tennis).
      *   Debrief mapping? Yes.
      *   Predictable failures? Yes.
      *   What instructor must supply? Yes.
      *   Settled vs. Contested? Yes.

  11. **Writing the Response:** (Focusing on tone: professional, pedagogical, precise.) *Self-correction: Ensure the distinction between 'Inside View' (specifics) and 'Outside View' (statistics) is clear in the instructions.* *Make sure the 'Contested' section is prominent.*

  *(Self-Correction during drafting Stage 2)*: How to ensure the reference class *misleads*? I can't guarantee it misleads for everyone. I need to frame it as "Competing Reference Classes." The lesson isn't that the outside view lied, but that the *choice* of outside view is an inside-view judgment. I will structure Stage 2 as "Reference Class Tennis" where they find one class that makes them look fast and one that makes them look slow.

  *(Refining the "What I must supply" section)*: The instructor needs to bring the *authority* and the *historical data*. Without credible base rates, Stage 1 fails.

  *(Refining Epistemic Status)*: Be explicit. Planning Fallacy is robust. Superiority of Outside View is conditional.

  Let's assemble the plan.cw
answer: |-
  # Activity Design: The Reference Class Trap
  **Course:** Graduate Seminar in Judgment and Decision-Making  
  **Duration:** 90 Minutes  
  **Class Size:** 18 Students  
  **Objective:** To experientially demonstrate the Planning Fallacy via the Inside/Outside view distinction, and to complicate the "Outside View" by revealing the subjectivity inherent in selecting a reference class.

  ---

  ## I. Epistemic Status: Settled vs. Contested
  *Before running the activity, you must be clear on what the science says and where the debate lies. Do not conflate these in the debrief.*

  **Settled (Robust Empirical Findings):**
  *   **The Planning Fallacy:** Individuals systematically underestimate the time, costs, and risks of future actions while overestimating benefits (Kahneman & Tversky, 1979; Buehler et al., 1994).
  *   **Neglect of Base Rates:** When focusing on the specifics of a case (Inside View), people tend to ignore distributional data (Outside View) even when it is available.
  *   **Bias Correction:** Access to relevant base rates generally reduces optimistic bias in aggregation.

  **Contested (Active Debate in Forecasting Literature):**
  *   **Superiority Claim:** It is *not* consensus that the Outside View is always more accurate than the Inside View. In unique, non-stationary environments (e.g., breakthrough innovation), past base rates may be obsolete.
  *   **Weighting:** There is no agreed-upon formula for how to weight the Inside View against the Outside View (e.g., 50/50 split vs. Bayesian updating).
  *   **Reference Class Selection:** There is no algorithmic way to determine the "correct" reference class. This is known as the "Reference Class Problem" (Hájek, 2007). Choosing the class is itself a judgment call subject to bias.

  ---

  ## II. Materials & Preparation
  **Instructor Preparation (Crucial):**
  1.  **The Base Rate Sheet:** You need credible data. Ideally, pull completion times from the last 3 years of *this specific seminar*. If unavailable, use discipline-specific averages (e.g., "Average time to complete a seminar paper in [Field] is 45 hours").
      *   *Format:* A handout showing a distribution (histogram) of completion times for the chosen reference class.
  2.  **Index Cards:** 3 per student (different colors).
  3.  **Timer:** Visible to the room.

  **Room Setup:**
  *   Tables arranged so students can write privately but talk in pairs later.

  ---

  ## III. Timeline & Procedure

  ### Phase 1: The Inside View & The Gap (30 Minutes)
  *Goal: Generate a personal optimistic forecast and confront it with a base rate.*

  1.  **The Commitment (5 mins):**
      *   Tell students: "Think of the major term project you are planning for this course (or a current work project). Do not think about the *idea*. Think about the *logistics*."
      *   **Card 1 (Green):** Write your name (optional) and your **Best-Case Completion Date**.
      *   *Instruction:* "Estimate the date by which you will have a draft ready for peer review. Base this on your current plan, your schedule, and your intentions."
      *   Collect these cards. Do not look at them yet.

  2.  **The Outside View Reveal (10 mins):**
      *   Distribute the **Base Rate Sheet**.
      *   *Script:* "This data represents the actual completion times of students in this seminar over the past three years. This is the 'Outside View.' It does not know your plan, your diligence, or your topic. It only knows the category: 'Graduate Seminar Paper.'"
      *   Highlight the **Median** and the **80th Percentile** (the time by which only 20% of students finished).

  3.  **The Calculation (15 mins):**
      *   Ask students to take **Card 2 (Yellow)**.
      *   *Task:* "Calculate the number of days between today and your Green Card date. Now calculate the number of days between today and the Class Median on the Base Rate Sheet."
      *   *Task:* "Compute your **Optimism Ratio**: (Your Days) / (Class Median Days)."
      *   *Prompt:* "If your ratio is below 0.8, you are predicting you will be significantly faster than the typical student. Raise your hand if your ratio is below 0.8." (Usually, 60-80% of hands go up).
      *   *Silence:* Let the silence sit for 30 seconds. Do not lecture. Let them feel the statistical improbability of their own plan.

  ### Phase 2: Reference Class Tennis (35 Minutes)
  *Goal: Demonstrate that the Outside View is not objective; it depends on class selection.*

  1.  **The Twist (5 mins):**
      *   *Script:* "The Outside View feels objective. But it relies on a choice: Which class do you belong to? I gave you one class ('Students in this seminar'). But you are not just students. You are also [Researchers / Professionals / Parents / Experts in X]."
      *   Explain **Reference Class Tennis**: The game of selecting a reference class that supports your desired conclusion.

  2.  **The Dual-Class Exercise (20 mins):**
      *   Ask students to take **Card 3 (Blue)**.
      *   *Task:* "Identify **two** different reference classes for your project."
          *   **Class A (The Favorable Class):** A grouping where the base rate makes your timeline look reasonable. (e.g., "Papers written by people who already have data," or "Projects managed using Agile methods").
          *   **Class B (The Unfavorable Class):** A grouping where the base rate makes your timeline look dangerously optimistic. (e.g., "First papers written in a new sub-field," or "Projects undertaken during finals week").
      *   *Requirement:* They must write down the *estimated base rate* for each class (even if guessed) and the *justification* for why they fit that class.
      *   *Pair Share:* Turn to a partner. One student plays "Devil's Advocate." They must argue why their partner belongs to the *Unfavorable* class, not the Favorable one.

  3.  **The Synthesis (10 mins):**
      *   Bring the room back together.
      *   Ask: "Who found two classes with significantly different base rates?"
      *   Ask: "Which base rate is the 'true' Outside View?" (The answer is: There isn't one).

  ### Phase 3: Debrief & Mapping (25 Minutes)
  *Goal: Map the experience to theory and acknowledge limitations.*

  1.  **Mapping the Stages (10 mins):**
      *   **Phase 1** was the **Planning Fallacy**. You focused on the *steps* (Inside View) and ignored the *statistics* (Outside View). The surprise came from the gap between your intention and the distribution.
      *   **Phase 2** was the **Reference Class Problem**. The Outside View is not a magic oracle. It requires human judgment to select the class. If you can choose the class, you can manipulate the prediction.

  2.  **Settled vs. Contested (10 mins):**
      *   Explicitly state: "It is settled that you are likely optimistic. It is *contested* whether the Class Median is a better predictor for *you* than your plan."
      *   Discuss **Diagnosticity**: If you have inside information that is truly unique (e.g., you have already written 80% of the draft), the Outside View (which includes people starting from zero) is misleading.
      *   Discuss **Aggregation**: The Outside View is better for *portfolio* management (budgeting time for 5 projects), while the Inside View is necessary for *execution* (knowing what to do tomorrow).

  3.  **What I Must Supply (5 mins):**
      *   *Instructor Note:* "This activity cannot reproduce the **emotional cost** of the Outside View. In the real world, accepting the Outside View often means admitting your plan is flawed, which threatens your identity as a competent researcher. I cannot simulate that threat in 90 minutes. You will feel the cognitive surprise, but not the professional risk."
      *   "I also cannot validate who was right. We will not know until the end of the term. You must sit with that uncertainty."

  ---

  ## IV. Predictable Failures & Mitigation

  **Failure 1: Distrust of the Base Rate Data**
  *   *What happens:* Students argue, "But I'm different," or "Past years were disorganized." They dismiss the Base Rate Sheet to protect their Inside View.
  *   *Mitigation:* Do not defend the data. Acknowledge it. Say: "That resistance you feel? That is the Inside View protecting itself. For the sake of the exercise, treat the data as true. Later, we can debate its validity."

  **Failure 2: Trivial Reference Classes in Phase 2**
  *   *What happens:* Students pick classes that are too vague (e.g., "People who drink coffee" vs. "People who don't").
  *   *Mitigation:* Circulate during the Pair Share. If you hear a weak class, ask: "Is there a causal mechanism linking that trait to completion time? If not, it's noise, not a class."

  **Failure 3: The "Outside View is Best" Moral**
  *   *What happens:* Students leave thinking they should just always use the base rate.
  *   *Mitigation:* In the debrief, emphasize that **forecasting is a blend**. Cite Tetlock: "Superforecasters update. They start outside, then adjust inside *only if* they have diagnostic information."

  ---

  ## V. What the Activity Cannot Reproduce (Instructor Supply)

  You must verbally supply the following context, as the activity structure cannot generate it:

  1.  **The Incentive Structure:** In this game, being wrong has no cost. In reality, the cost of the Planning Fallacy is missed tenure, lost funding, or broken collaborations. You must describe a real-world scenario where this gap caused a catastrophe to anchor the emotional weight.
  2.  **The "View from Nowhere":** The activity simulates the *calculation* of the Outside View, but not the *discipline* required to stick to it when pressure mounts. You must emphasize that knowing the base rate is easy; acting on it when your boss demands a faster deadline is hard.
  3.  **Validation:** You cannot tell them in class who was right. You must commit to collecting the actual completion dates at the end of the term and emailing them the comparison then. This closes the feedback loop, which is essential for learning calibration.

  ---

  ## VI. Instructor Script Snippet (For the Debrief)
  *"We often treat the Inside View and Outside View as enemies. One says 'I have a plan,' the other says 'Here are the stats.' But the lesson from Stage 2 is that the Outside View is actually built on Inside View judgments. Choosing the reference class requires understanding the causal details of your case. If you choose the class poorly, the Outside View gives you false precision. The goal is not to replace your judgment with a statistic. The goal is to use the statistic to check your judgment, and use your judgment to select the statistic."*
