answer: |-
  # Taxonomy of Sentience and Moral Status

  **Root Question:** When you hesitate to grant a **honeybee** the same protection as a **thermostat**, is that hesitation about the bee's internal reality or about our social practices?

  *   **Branch 1: It is about our social practices (Status is assigned, not discovered).**
      *   **Leaf: Attributionist/Deflationary View**
          *   *Awkward Commitment:* We could collectively decide a thermostat has rights, and it would be true, regardless of its internal state.

  *   **Branch 2: It is about the bee's internal reality (Status is discovered).**
      *   **Node:** Is the hesitation because we lack data about a binary fact, or because the bee possesses a different *amount* of the relevant property?
          *   **Branch 2.1: We lack data about a binary fact (Epistemic Gradient).**
              *   **Node:** If we had perfect neuroscience, would the bee be *definitely* sentient or *definitely* not?
                  *   **Leaf: Epistemic Uncertainty View** (There is a sharp line, we just don't know where it is).
                      *   *Awkward Commitment:* A single neuron's firing could theoretically flip a being from having zero rights to having inviolable rights.
                  *   **Leaf: Metaphysical Vagueness View** (There is no sharp line; consciousness itself is fuzzy).
                      *   *Awkward Commitment:* There are possible beings who are objectively "half-conscious," making "half-rights" a coherent concept.
          *   **Branch 2.2: The bee possesses a different amount of the property (Metaphysical Gradient).**
              *   **Node:** Is the property that comes in amounts the capacity to *feel*, or something else (like having goals or interests)?
                  *   **Branch 2.2.1: Something else (Non-Sentience Basis).**
                      *   **Node:** Does a **slime mould** have status because it pursues goals (**simple AI agent**) or because it can be harmed (**clam**)?
                          *   **Leaf: Agency View** (Status tracks self-consciousness or rational action).
                              *   *Awkward Commitment:* A sophisticated chatbot has more rights than a suffering dog.
                          *   **Leaf: Interest View** (Status tracks welfare or having a "good of one's own").
                              *   *Awkward Commitment:* A genetically engineered plant that "wants" water has rights against being pruned.
                  *   **Branch 2.2.2: The capacity to feel (Sentience Basis).**
                      *   **Node:** If a **large language model** feels pain, does its status scale with the intensity of feeling, or does it simply cross a line?
                          *   **Leaf: Smooth Scalar View** (Status is proportional to how much of the relevant thing you have).
                              *   *Awkward Commitment:* Inflicting mild pain on ten mice could be mathematically equivalent to torturing one human.
                          *   **Branch 2.2.2.1: It crosses a line (Threshold).**
                              *   **Node:** Does a **mouse** that just crosses the sentience line have the same inviolable rights as an **anaesthetised human** waking up?
                                  *   **Leaf: Flat Threshold View** (Nothing counts until it counts fully; then all count equally).
                                      *   *Awkward Commitment:* A barely-sentient worm has the exact same inviolable right to life as you.
                                  *   **Leaf: Threshold-Plus-Gradient View** (Crossing the line buys a floor; degrees above that get traded off).
                                      *   *Awkward Commitment:* You can sacrifice a slightly-sentient being to save a highly-sentient one, but not a non-sentient machine.

  ***

  ### Notes on Collapses and Empty Space

  **Indistinguishable Leaves:**
  *   **Smooth Scalar View vs. Epistemic Uncertainty View:** In practice, these often collapse. If I treat a bee as having 0.5 moral weight because I am 50% confident it is sentient (Epistemic), the result is identical to treating it as having 0.5 sentience (Scalar). They only separate if you believe confidence should trigger precautionary principles (e.g., "if >10% sure, treat as 100% sentient") while scalars do not.
  *   **Metaphysical Vagueness vs. Smooth Scalar:** If consciousness is inherently vague (half-conscious), it is difficult to argue moral status is not also vague (half-status). These positions are frequently co-extensive unless one argues for a "vague property but binary status" rule, which is logically unstable.

  **Empty/Unexplored Combinations:**
  *   **Agency View + Smooth Scalar:** Rarely defended. Agency is typically treated as a threshold concept (you either have rational autonomy or you don't), whereas sentience is the property usually associated with degrees.
  *   **Flat Threshold + Epistemic Uncertainty:** Logically possible but unstable. If there is a sharp binary line we cannot see, the precautionary principle usually forces a gradient in *treatment*, effectively turning the view into a Threshold-Plus-Gradient or Scalar view in practice.
