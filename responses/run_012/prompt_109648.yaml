      *   **Experience:** Participants should *feel* the concepts, not just hear about them.
      *   **Key Insights:**
          *   Different final goals $\rightarrow$ Same instrumental behaviors (resource acquisition, self-preservation, goal integrity).
          *   Orthogonality: Final goals $\neq$ Instrumental reasoning.
          *   Convergence is structural, not inevitable (satiable goals break the pattern).
      *   **Constraints:** No math, simple rules (5 min explanation), gameplay 35-40 mins, debrief 30 mins.
      *   **Mechanics:** Secret goal cards, token economy, actions (harvest, trade, buy influence, copy/destroy goals, edit goals).
      *   **Specific Requirement:** Open-ended goals must drive resource hoarding/protection. Satiable goals must allow winning by *not* doing that. At least one round where satiable players win because open-ended players *can't* afford to stop.
