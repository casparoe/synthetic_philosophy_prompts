  2.  **Deconstruct the Core Concepts for Gameplay:**
      *   *Instrumental Convergence:* Why do different agents do the same thing? Because certain sub-goals (get money, stay alive, keep your brain intact) help achieve *almost any* final goal.
      *   *Orthogonality:* You can have any goal (make paperclips, make people happy) combined with any level of intelligence/strategy.
      *   *The "Catch":* The game needs to force a conflict between "achieving the goal" and "surviving/competing."

  3.  **Drafting the Game Mechanics (Iterative Process):**

