      *   *Wait, simpler:* Just make the Satiable goal *easier* to secure defensively. If you stop grabbing, you have more tokens for defense. Open-ended *must* grab, leaving them vulnerable.
      *   *Let's go with the "Goal Integrity" cost.* To protect your goal, you spend tokens. Satiable players hit target, then spend all surplus on protection. Open-ended must keep grabbing, leaving protection underfunded.
