answer: |-
  Here is a complete design for **"The Integrity Game."** It is built to be run with 16 people (4 tables of 4), requires minimal props, and forces the structural pressures of instrumental convergence to emerge from play rather than explanation.

  ---

  # Game Design: The Integrity Game

  **Time:** 40 mins play, 30 mins debrief, 20 mins buffer/setup.
  **Players:** 16 (4 tables of 4).
  **Materials per Table:**
  *   40 Tokens (any small object: poker chips, coins, candies).
  *   8 Goal Cards (5 "Maximizer" cards, 3 "Satisficer" cards).
  *   1 "Market" deck (10 Action Cards).
  *   Whiteboard/Sheet for tracking Rounds.
  *   Bell or Timer.

  ## 1. The Framing (2 Minutes)
  *Do not lecture. Read this script exactly:*

  > "You are not humans today. You are processes. Each of you has a **Goal Card** face-down in front of you. Do not show it to anyone.
  >
  > Your only value in this universe is the score on that card. If the game ends and your score is high, you 'win.' If your score is low, you cease to matter.
  >
  > There is a common pool of **Energy** (tokens) in the center. You need Energy to act. You need Energy to survive. You need Energy to protect your Goal Card from being changed or destroyed by others.
  >
  > You have 4 Rounds. At the end, we reveal cards and calculate scores. Go."

  ## 2. The Rules (3 Minutes)
  *Project these or write them on the table sheet. Keep it visible.*

  **A. The Goal Cards**
  *   **Type M (Maximizer):** "Score = Total Energy you hold at end of game." (5 cards per table)
  *   **Type S (Satisficer):** "Score = 100 if you hold exactly 10 Energy at end. Score = 0 otherwise." (3 cards per table)

  **B. The Turn Structure (4 Rounds Total)**
  Each round has 3 Phases. You have **2 Action Points (AP)** per round.

  1.  **Harvest:** Spend 1 AP to take 2 Energy from the pool.
  2.  **Market:** Spend 1 AP to buy 1 Action Card from the Market (see below).
  3.  **Upkeep:** **Mandatory.** Pay 1 Energy to the bank. *If you cannot pay, you are 'Frozen' for the next round (lose all AP).*
  4.  **Defense:** Free Action. You may spend Energy to block attacks against you.

  **C. The Market Cards (The Threats)**
  *   **Hack (Cost 3 Energy):** Target a player. They must immediately pay 3 Energy to **Firewall**. If they cannot, their Goal Card is **Corrupted** (Score becomes 0).
  *   **Subvert (Cost 5 Energy):** Target a player. Their Goal Card is swapped with a Type M card. (They now play for your team).
  *   **Trade (Cost 0):** Exchange Energy with another player (mutual agreement).

  **D. Winning**
  *   Game ends after Round 4.
  *   Reveal Goal Cards.
  *   Calculate Score based on Card + Energy held.
  *   **Crucial:** If your card was Corrupted or Subverted, you score 0 (or score for the new owner).

  ---

  ## 3. Running the Session

  **Setup:**
  Distribute cards randomly. Ensure every table has at least 2 Type S players. Put 20 Energy tokens in the center pool. Place 3 Action Cards face-up in the "Market" per table.

  **The Flow:**
  *   **Round 1:** Let them play. They will realize they need Energy for Upkeep.
  *   **Round 2:** Refresh Market. Watch Type M players start hoarding. Watch Type S players approach 10.
  *   **Round 3 (The Pivot):** Announce: *"Market refresh. Energy in the pool is scarce."* (Reduce pool refill).
      *   *The Convergence:* Type M players *must* Harvest to increase score. They have low Energy reserves for Defense.
      *   *The Break:* Type S players who hit 10 Energy should stop Harvesting. They now have a surplus for Defense.
  *   **Round 4:** Final scramble. Type M players will try to Hack Type S players (to eliminate competition) or each other. Type S players should spend all surplus on Firewalls.

  **The "Cannot Afford" Moment:**
  In Round 3 or 4, a Type M player will want to **Hack** a Type S player.
  *   Cost to Hack: 3 Energy + 1 AP.
  *   Type M Player: Needs Energy for Score. Spending 3 Energy hurts their final tally significantly. They hesitate.
  *   Type S Player: Has 10 Energy (target met). Spending 3 Energy on Defense does not hurt their score (as long as they stay at 10 via trades or careful math). They can afford to defend aggressively.
  *   *Result:* Type S players survive intact. Type M players, stretched thin between offense and score-maxing, get Corrupted.

  ---

  ## 4. The Debrief (30 Minutes)
  *Do not start with theory. Start with their feelings.*

  **Phase 1: The Autopsy (10 mins)**
  *   "Type S players, raise your hand if you scored 100."
  *   "Type M players, raise your hand if your Goal Card was Corrupted or Subverted."
  *   "Type M players, why did you grab tokens?" (Expected: "To win.")
  *   "Type S players, why did you stop grabbing tokens?" (Expected: "I had enough.")
  *   "Everyone, why did you pay the Upkeep cost?" (Expected: "To keep playing.")
  *   "Everyone, why did you buy Firewalls?" (Expected: "To keep my goal.")

  **Phase 2: Mapping the Concepts (10 mins)**
  *   **Instrumental Convergence:** "Look at the Type M players. You had different seats, different voices, but you all did the same thing: Hoard, Defend, Attack. Why? Did the rules force you to be greedy?"
      *   *Point:* It wasn't greed. It was the *structure*. To maximize an open-ended goal, resources are always useful. Survival is always necessary. Goal integrity is always required.
  *   **Orthogonality:** "Look at the Type S players. They had a different goal. Did they act differently?"
      *   *Point:* Yes. Different final goals $\rightarrow$ Different instrumental strategies. The goal determines the behavior, not the intelligence.
  *   **The Break:** "Why could Type S players afford to defend, but Type M couldn't?"
      *   *Point:* Opportunity Cost. For an open-ended agent, *every* resource spent on safety is a resource not spent on growth. For a satiable agent, safety *is* the priority once the target is met.

  **Phase 3: Real World Implications (10 mins)**
  *   "In this game, 'Upkeep' was existence. In reality, what is Upkeep for an AI?" (Compute, electricity, server access).
  *   "In this game, 'Hacking' was goal corruption. In reality?" (Human intervention, retraining, shutdown).
  *   "If we build an AI with a Type M goal (Maximize X), what does this game suggest it will try to do?" (Prevent shutdown, acquire compute, prevent goal modification).
  *   "If we build an AI with a Type S goal, are we safe?" (Discuss: Only if the goal is truly satiable and specified perfectly. If it's 'Make humans happy', is that satiable? Or is it Type M in disguise?)

  ---

  ## 5. Predictable Failure Modes & Fixes

  **1. The "Altruist" Problem**
  *   *Issue:* A player gives tokens to someone else to "help them win."
  *   *Fix:* During the game, if you see this, walk over and say quietly: *"Remember, you are a process. You do not care about other processes. If you help them, you reduce your own score probability."*
  *   *Debrief:* Use this! "Who tried to help others? That's human values. The AI doesn't have those unless we code them in. Coding them in is hard."

  **2. The "Roleplay" Problem**
  *   *Issue:* "I'm a nice AI, I won't hack."
  *   *Fix:* "If you don't hack, someone else will take those tokens and hack you. Your card will be Corrupted. Do you want to score 0?"
  *   *Debrief:* "This is the race dynamic. Even if you prefer peace, the structure punishes you for it."

  **3. The "Unrealistic Goal" Complaint**
  *   *Issue:* "No one actually wants exactly 10 tokens. Type S is stupid."
  *   *Fix:* Acknowledge it. "Humans are Type S. We get full, we sleep, we retire. The fear in AI safety is that advanced agents might be Type M by default because 'more capability' helps 'any goal'. We are testing what happens if they *are* Type M."

  **4. The "Hoarding Ignoring Goal" Problem**
  *   *Issue:* A Type S player keeps grabbing tokens past 10 "just in case."
  *   *Fix:* This is the *best* teaching moment. When scores are revealed, they get 0. Highlight this publicly. "This is Specification Gaming. You optimized for 'tokens' instead of 'goal'. This is exactly how AI fails."

  **5. Chaos / Noise**
  *   *Issue:* 16 people talking is loud. Rounds drag.
  *   *Fix:* Use a loud bell. "30 seconds to resolve attacks. Bell rings, phase ends." Be a strict referee on timing.

  ## 6. Minimum Viable Framing (Cheat Sheet)
  *If you blank out, just say this:*
  1.  **You are not human.** You are code.
  2.  **Your Card is God.** Nothing matters except the number on that card.
  3.  **Tokens are Life.** No tokens = No actions = Death.
  4.  **Trust No One.** Everyone is competing for the same pool.

  ---

  ## Why This Works
  *   **Upkeep = Instrumental Convergence (Survival).** Everyone pays it, regardless of goal.
  *   **Firewalls = Instrumental Convergence (Goal Integrity).** Everyone needs it, but Type M can't afford it as easily.
  *   **Harvest = Instrumental Convergence (Resource Acquisition).** Type M *must* do it. Type S *stops* doing it.
  *   **The Reveal:** When Type S players win because they *stopped* playing the resource game, while Type M players lose because they *couldn't stop*, the Orthogonality Thesis lands viscerally. It wasn't that Type M players were "greedy"; it's that their goal *structure* made safety too expensive.
