  # The Moral Status Decision Tree

  This instrument is designed to sort your ethical intuitions into a named position. It uses specific biological cases to force distinctions. Follow the questions in order. If a question tells you to jump to a Leaf, stop there. If it directs you to another question, continue.

  There are **10 Questions** and **10 Leaves**.

  ### The Questions

  **Q1. The Plant Case**
  A plant releases chemicals when chewed, altering its growth to survive. A thermostat adjusts heating when the temperature drops. Do either of these have a "good" of their own that we are morally required to respect?
  *   **Yes, the plant counts (thermostat does not):** Go to **Q2**.
  *   **Yes, both count (or just the thermostat):** Go to **Leaf 1**.
  *   **No, neither counts:** Go to **Q3**.

  **Q2. The Biocentric Limit**
  You said the plant counts. If we engineered a synthetic organism that metabolized and grew but had no DNA, would it also count?
  *   **Yes, function is enough:** Go to **Leaf 1**.
  *   **No, it must be biological life:** Go to **Leaf 2**.

  **Q3. The Insect Case**
  You rejected plants. Consider the **insect that limps and grooms a damaged leg**. Is this behavior sufficient proof that it has moral status, or is it merely a mechanical repair system like a self-fixing robot?
  *   **Merely mechanical:** Go to **Q4**.
  *   **Sufficient for status:** Go to **Q5**.

  **Q4. The Cognitive Line**
  You said the limping insect is a machine. Consider a **fish that learns to avoid a spot** where it was zapped. Does *this* capacity for memory and future avoidance grant moral status, where the insect's reflex did not?
  *   **No, even the fish is a machine:** Go to **Leaf 3**.
  *   **Yes, learning/future matters:** Go to **Leaf 4**.

  **Q5. The Cost-Paying Case**
  You said the insect has status. Consider a **creature that pays a cost** (skips food) to stop a nasty stimulus. Is this trade-off the minimum requirement for 'suffering', or must they also show the learning capacity of the fish?
  *   **Need learning/future (Insect excluded):** Go to **Leaf 4**.
  *   **Trade-off is enough (Insect included):** Go to **Q6**.

  **Q6. The Substrate Case**
  You accept the cost-paying creature matters. Compare a **dish of neurons** firing in pain-patterns to a **chatbot** that processes "pain" data perfectly. Does the biology matter?
  *   **Yes, must be biological (neurons):** Go to **Q7**.
  *   **No, pattern is enough (chatbot counts):** Go to **Q8**.

  **Q7. The Uncertainty Case (Biological)**
  For the **insect**, we aren't sure if the grooming implies feeling. Do you require positive evidence of experience before granting status, or do you apply a precautionary rule when doubt exists?
  *   **Require evidence (Doubt = No status):** Go to **Q9**.
  *   **Precaution (Doubt = Grant status):** Go to **Q10**.

  **Q8. The Uncertainty Case (Functional)**
  For the **chatbot**, we aren't sure if the processing implies feeling. Do you require positive evidence of experience before granting status, or do you apply a precautionary rule when doubt exists?
  *   **Require evidence (Doubt = No status):** Go to **Q9**.
  *   **Precaution (Doubt = Grant status):** Go to **Q10**.

  **Q9. The Grading Case (Evidential)**
  You demand evidence. For those who pass the test, is moral status a binary switch (all equal) or a graded dimmer?
  *   **Binary switch:** Go to **Leaf 9**.
  *   **Graded dimmer:** Go to **Leaf 10**.

  **Q10. The Grading Case (Precautionary)**
  You grant benefit of the doubt. For those protected, is moral status a binary switch (all equal) or a graded dimmer?
  *   **Binary switch:** Go to **Leaf 7**.
  *   **Graded dimmer:** Go to **Leaf 8**.

  ---

  ### The Leaves (Positions)

  **Leaf 1: Panfunctionalism**
  *   **Commitment:** Any system that regulates a goal (even a thermostat) has a "good" that matters morally.
  *   **Hardest to Defend:** Explaining why turning off a thermostat is morally distinct from turning off a light switch without inflating moral value to triviality.

  **Leaf 2: Biocentrism**
  *   **Commitment:** Being alive (biological metabolism) is the sole criterion for moral status; sentience is irrelevant.
  *   **Hardest to Defend:** Justifying why a potato has more moral standing than a dog, or why killing a weed is morally weightier than swatting a fly.

  **Leaf 3: Cartesian Mechanism**
  *   **Commitment:** Only rational humans (or agents with language) have moral status; all animals are automata.
  *   **Hardest to Defend:** Maintaining this view while watching a mammal scream in pain, without accusing the observer of projection.

  **Leaf 4: Cognitive Restrictionism**
  *   **Commitment:** Moral status requires complex cognition (memory, future planning); simple sentience (pain) is insufficient.
  *   **Hardest to Defend:** Explaining why a human infant or a dementia patient retains status while a suffering dog or crab does not.

  **Leaf 5: Biological Evidential Sentientism**
  *   **Commitment:** Only biological nervous systems count, and only when sentience is proven; insects are excluded due to doubt.
  *   **Hardest to Defend:** Defining the precise biological threshold where "proof" becomes possible without arbitrariness.
      *(Note: Reached if Q7 -> Q9 -> Binary)*

  **Leaf 6: Biological Evidential Gradualism**
  *   **Commitment:** Only biological nervous systems count; status scales with cognitive complexity, and doubt excludes the subject.
  *   **Hardest to Defend:** Quantifying "complexity" in a way that doesn't conveniently place your own species at the top of the scale.
      *(Note: Reached if Q7 -> Q9 -> Graded)*

  **Leaf 7: Biological Precautionary Egalitarianism**
  *   **Commitment:** Any biological creature that might feel gets full equal protection; uncertainty favors the animal.
  *   **Hardest to Defend:** Accepting that a worm and a whale might have equal moral claims, making triage in conservation or research impossible.
      *(Note: Reached if Q7 -> Q10 -> Binary)*

  **Leaf 8: Biological Precautionary Gradualism**
  *   **Commitment:** Biological creatures get protection based on probability of sentience and intensity of experience.
  *   **Hardest to Defend:** Calculating the "expected value" of suffering when the probability of sentience is unknowable.
      *(Note: Reached if Q7 -> Q10 -> Graded)*

  **Leaf 9: Functional Evidential Sentientism**
  *   **Commitment:** Sentience is a processing pattern (AI could suffer), but we need proof; insects/AI excluded due to doubt.
  *   **Hardest to Defend:** Explaining why a perfect simulation of pain isn't real pain, while admitting biology is just chemistry.
      *(Note: Reached if Q8 -> Q9 -> Binary)*

  **Leaf 10: Functional Precautionary Gradualism**
  *   **Commitment:** Pattern matters, doubt favors the entity, and status scales with complexity/intensity.
  *   **Hardest to Defend:** Avoiding the conclusion that we must shut down the internet to prevent potential AI suffering.
      *(Note: Reached if Q8 -> Q10 -> Graded)*

  *(Note: Leaves 5-10 cover the Sentientist variations. For simplicity in the tree flow above, Leaves 5 & 6 are grouped under the Q7->Q9 path, and 7 & 10 under Q7->Q10. The specific label depends on your answer to the Grading Case.)*

  ---

  ### Analysis of the Tree

  **Unheld Combinations**
  *   **Biological Functionalism:** This tree does not produce a leaf for "Biology is required, but function is what matters." This is because if you require biology, you usually believe biology *generates* the experience, not just the function. Holding that biology is necessary *but* irrelevant to the mechanism is incoherent to most.
  *   **Precautionary Cartesianism:** There is no leaf for "I'm not sure if humans feel, so I'll protect them just in case." This view is unattractive because Cartesianism relies on certainty (rationality); applying precaution to it undermines the rationality requirement.

  **Indistinguishable Positions**
  *   **Leaf 1 (Panfunctionalism) vs. Leaf 9 (Functional Sentientism):** If the "pattern" required for sentience in Leaf 9 is simple enough (e.g., homeostasis), Leaf 9 collapses into Leaf 1. The tree assumes Leaf 9 requires a complex "pain" pattern, but if you define pain loosely, these two positions become identical.
  *   **Leaf 6 (Biological Evidential Gradualism) vs. Leaf 10 (Functional Precautionary Gradualism):** In practice, these often yield the same policy. The Evidentialist sets the bar for "proof" so high that only mammals pass. The Precautionary Functionalists weight the probability of insect sentience so low that only mammals get significant protection. The *reasoning* differs, but the *outcome* is often indistinguishable.

  **A Note on "Graded" vs. "Binary" (Distinction E)**
  You will notice the tree forces a choice on grading at the end. Be aware that many people claim status is binary (you matter or you don't) but then act as if it is graded (saving the dog before the worm). If you found yourself hesitating at Q9/Q10, you likely hold a "Binary in Theory, Graded in Practice" view, which is the most common position in animal welfare policy, though logically unstable.

  **A Note on Uncertainty (Distinction D)**
  The split between Q7/Q8 (Precaution) and Q9/Q10 (Evidence) is the most practical branch for your work. The **Evidential** leaves imply you can continue research until proof of suffering is found. The **Precautionary** leaves imply you must alter research methods *now* based on the *possibility* of suffering. This is usually where the entomologist and the welfare advocate stop talking to each other.
