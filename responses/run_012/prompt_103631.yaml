  0.25

  **Decomposition of Credence**

  (i) **0.30** — Probability that aesthetic value supervenes wholly on perceptible, intrinsic properties.
  *Justification:* Low, because contemporary aesthetics largely rejects strict formalism in favour of contextualism, where knowledge of origin shapes the aesthetic experience.

  (ii) **0.80** — Probability that an object's causal history can enter into its aesthetic value.
  *Justification:* High, as the narrative of creation (innovation versus replication) is typically constitutive of how art is aesthetically appreciated, directly undermining P.

  (iii) **0.40** — Probability that the division between aesthetic and historical value marks a real joint in the world.
  *Justification:* Moderate to low, because historical knowledge often alters the phenomenology of perception, suggesting the boundary is porous rather than distinct.

  (iv) **0.10** — Probability that a work of art is best identified with a repeatable type.
  *Justification:* Low, since painting is an autographic art form where token identity matters; B is not the same work as A, which affects its valuation.

  (v) **0.15** — Probability that artistic achievement value is identical or irrelevant between A and B.
  *Justification:* Low, because artistic merit is tied to original expression and risk, which the forger lacks despite their technical proficiency.

  (vi) **0.25** — Probability that an observer's knowledge of provenance does not alter the phenomenological experience of the object.
  *Justification:* Low, as psychological essentialism suggests knowing an object's origin changes how its properties are perceived and weighted.

  **Sensitivity Analysis**

  The final number is most sensitive to term **(i)**. If aesthetic value were proven to supervene wholly on perceptible properties, the causal history (ii) and achievement value (v) would be excluded from aesthetic judgement by definition, causing the credence in P to rise sharply towards 0.80.

  **Required Information**

  To move this number substantially, I would require empirical data from the **cognitive science of aesthetic response**, specifically neuroimaging studies determining whether knowledge of forgery alters low-level sensory processing or merely higher-order cognitive appraisal.

  **Digital Case**

  My credence in P rises to **0.80** if A and B are digital files. Digital art is allographic; the work is identified with the information type rather than the physical token, meaning a lossless copy is aesthetically and ontologically identical to the original.
