answer: |-
  Right, pull up a chair. You're right to be annoyed with your mate. The "but-for" test is the lazy man's tool; it breaks on the shop rota and it makes monsters of us all by turning every bystander into a killer. You want a principle that matches your gut without swallowing the world.

  You aren't actually asking about *physical* causation. If you were, the bloke at the canal *did* cause the death (physically, if he jumped in, the kid lives). You're asking about **Attributable Causation**. You want to know when we can pin the outcome on a specific agent.

  Here is the principle that gets your verdicts right. It's called the **Normative NESS Test**.

  ### The Principle

  **An agent is an attributable cause of an outcome if and only if:**

  1.  **Factual Nexus (The NESS Clause):** Their act or omission was a *Necessary Element of a Sufficient Set* of conditions that actually produced the outcome.
  2.  **Normative Constraint (The Duty Clause):** Where the factor is an *omission*, the agent must have been under a specific duty, role, or contractual obligation to act.
  3.  **Agency Constraint (The Human Clause):** Where the factor is a *natural event*, it counts only as a background condition, not an attributable cause, unless a human agent exploited it.

  ***

  ### What Each Clause Is Doing (And Which Case Forces It)

  **1. The Factual Nexus (NESS)**
  *   **What it does:** It replaces "but-for." Instead of asking "Would this have happened without him?", it asks "Was his failure a necessary part of a package of conditions that *did* make it happen?"
  *   **The Case that Forces It:** **The Shop Rota.**
      *   *Why:* Your mate's "but-for" rule struggles here because you both think, "If I'd done it, he wouldn't have needed to." It gets muddy. NESS cuts through: The set {You Fail + Mate Fails + Door Unlocked} was sufficient for the robbery. Your failure was a *necessary element* of that specific sufficient set. So were his. You are both causes.
      *   **Also handles:** **The Bridge.** The gap wasn't an "act," but it was a necessary element of the set {Heat + Steel + No Expansion Gap} that sufficed for collapse.

  **2. The Normative Constraint (Duty)**
  *   **What it does:** It stops the "slippery slope." It distinguishes between doing nothing when you *should* have done something, versus doing nothing when it was none of your business.
  *   **The Case that Forces It:** **The Canal Toddler vs. The Nurse.**
      *   *Why:* Physically, the Nurse and the Bloke are identical. Both stood still; both let someone die. The only difference is the badge. The Nurse has a duty of care; the Bloke has a general moral hope but no specific obligation. This clause saves the Bloke from being a "killer" while keeping the Nurse liable.
      *   **Also handles:** **The Cat.** You promised. That promise created a duty. Without this clause, you're no different from a stranger walking past a starving cat.

  **3. The Agency Constraint (Human)**
  *   **What it does:** It separates "conditions" from "causes" when nature is involved. It stops us blaming the weather for human crimes.
  *   **The Case that Forces It:** **The Storm.**
      *   *Why:* You said you didn't want to say the storm "did anything to a house." This clause respects that. The storm is a *condition* (it made the burglary possible), but not an *attributable cause* (it didn't rob the place).
      *   **Also handles:** **The Cousin.** He isn't a storm. He's a human who exploited the situation. By cutting the line, he actively inserted himself into the causal chain. He satisfies the Human Clause, so he *is* a cause, unlike the storm.

  ***

  ### The Cost: What You Have to Give Up

  A clean principle always costs something. If you adopt the **Normative NESS Test**, you have to accept two hard truths that might itch slightly:

  1.  **The Storm is Off the Hook:** You said you *wanted* to say the storm caused the burglary. This principle says **No**. The storm is a condition, not a cause. If you want the storm to be a cause, you have to drop the Agency Constraint, but then you lose the distinction between a hurricane and a burglar. **Verdict:** Stick with the principle. The storm didn't rob the house; the burglar did, using the storm as an opportunity.
  2.  **The Surgeon Case:** Here is your test case. *Surgeon decides not to operate; patient dies; surgery offered a 50/50 chance.*
      *   **The Verdict:** Under this principle, the surgeon **did not cause the death.**
      *   **Why:** Look at Clause 1 (Factual Nexus). To be a cause, the omission must be part of a *sufficient* set for the outcome. Because survival was only 50/50, the set {Disease + No Surgery} was not *sufficient* to guarantee death (they might have died anyway), nor was {Disease + Surgery} sufficient to guarantee life.
      *   **The Ruling:** The surgeon caused the **loss of a chance**, not the death itself. There is a legal and moral difference. If you rule the surgeon caused the *death*, you are saying the patient *would* have survived for sure. They wouldn't have.
      *   **The Cost:** You must accept that "Causing Death" and "Causing a Risk of Death" are different things. If you blur them, you blur the line between murder and negligence.

  ### Summary for the Pub

  Tell your mate this:
  *"But-for makes us all killers because we don't save everyone. Your rule has no brakes. My rule has brakes. We caused the cat's death because we took the duty. The bloke at the canal didn't because he never took the job. The storm didn't rob the house because storms don't have hands. And the surgeon didn't kill the patient, he just stole their odds. That's the line."*

  If he argues the Surgeon *must* be a cause of death, tell him he's welcome to the "But-For" rule, but then he has to admit the bloke at the canal is a murderer too. See if he still wants it.
