  ### The Setting: Job Training and Hiring

  Imagine a company evaluating a new **Job Training Program** ($X$). The outcome of interest is **Getting Hired** ($Y$). Between the training and the hiring decision, candidates must take a **Certification Exam** ($Z$).

  **The Causal Story:**
  1.  **Mediator Path:** The Training helps people **Pass the Exam** ($X \rightarrow Z$), and Passing the Exam makes you much more likely to **Get Hired** ($Z \rightarrow Y$).
  2.  **Collider/Confounding Path:** Some people are "Natural Geniuses" ($U$). They don't need Training to **Pass the Exam** ($U \rightarrow Z$), and their genius also makes them likely to **Get Hired** even without the cert ($U \rightarrow Y$).

  **The Trap:** The Certification Exam ($Z$) is a **Mediator** (it's how the training works) and a **Collider** (both Training and Genius cause Passing). If you "disaggregate" by conditioning on Exam Results, you block the benefit of the training and compare Trainees against Geniuses.

  ---

  ### The Data (Small Numbers for Hand Calculation)

  We observe 200 candidates: 100 who took the Training, 100 who did not.

  #### 1. Pooled Data (The Total Effect)
  *Ignore the exam results for a moment. Just look at Training vs. Hiring.*

  | Group | Total Candidates | Hired | Hiring Rate |
  | :--- | :---: | :---: | :---: |
  | **Training** | 100 | **40** | **40%** |
  | **No Training** | 100 | **22** | **22%** |

  **Conclusion:** The Training Program **increases** hiring rates by 18 percentage points. It is effective.

  ***

  #### 2. Stratified Data (Disaggregated by Exam Result)
  *Now, let's follow the reflex and split the data by those who Passed ($Z=1$) and Failed ($Z=0$) the exam.*

  **Stratum A: Candidates who PASSED the Exam**

  | Group | Total in Stratum | Hired | Hiring Rate |
  | :--- | :---: | :---: | :---: |
  | **Training** | 80 | **40** | **50%** |
  | **No Training** | 20 | **18** | **90%** |

  *Observation:* Among those who passed, the No Training group did **better** (90% vs 50%).

  **Stratum B: Candidates who FAILED the Exam**

  | Group | Total in Stratum | Hired | Hiring Rate |
  | :--- | :---: | :---: | :---: |
  | **Training** | 20 | **0** | **0%** |
  | **No Training** | 80 | **4** | **5%** |

  *Observation:* Among those who failed, the No Training group did **better** (5% vs 0%).

  **The Paradox:** In *both* strata, the Training looks harmful (or at least inferior). Yet, in the pooled data, the Training was beneficial.

  ---

  ### Why the "Disaggregate" Reflex Fails Here

  Someone following the slogan *"Aggregation hides the truth; always look at the strata"* would look at the tables above and conclude: **"The Training Program is bad. Whether you pass or fail the exam, you are worse off with the training than without it."**

  This is wrong for two causal reasons:

  1.  **$Z$ is a Mediator ($X \rightarrow Z \rightarrow Y$):** The primary way the Training helps you get hired is by helping you **Pass the Exam**. 80% of Trainees passed, compared to only 20% of Non-Trainees. By conditioning on $Z$ (splitting by exam result), you effectively "turn off" the main mechanism of the treatment. You are asking, *"For people who already have the certification, did the training help?"* The answer is no—the certification did the work. But the policy question is *"Should we offer the training?"*, which requires the **Total Effect** (Pooled).
  2.  **$Z$ is a Collider ($X \rightarrow Z \leftarrow U \rightarrow Y$):** In the "Passed" stratum, the Non-Trainees are a highly selected group. Since they didn't get training, the only way they passed is if they were "Natural Geniuses." These geniuses also get hired at high rates regardless. The Trainees, however, include average people who passed *because* of the training. Comparing Trainees to Geniuses makes the training look ineffective.

  ### Rule of Thumb: How to Tell the Cases Apart

  To decide whether to aggregate or disaggregate, you must determine the **temporal and causal relationship** of the splitting variable ($Z$) to the treatment ($X$).

  | Variable Type | Causal Structure | Action | Why? |
  | :--- | :---: | :---: | :--- |
  | **Confounder** | $Z \rightarrow X$ and $Z \rightarrow Y$ <br>*(Z happens BEFORE X)* | **Disaggregate** (Condition on $Z$) | $Z$ creates a spurious link. You must block it to see the true effect of $X$. |
  | **Mediator** | $X \rightarrow Z \rightarrow Y$ <br>*(Z happens AFTER X)* | **Do Not Disaggregate** | $Z$ is the *mechanism*. Conditioning on it blocks the effect you are trying to measure. |
  | **Collider** | $X \rightarrow Z \leftarrow Y$ <br>*(Z is caused by BOTH)* | **Do Not Disaggregate** | Conditioning on $Z$ *creates* a spurious link where none existed (Berkson's Bias). |

  **The Heuristic:**
  > **"Did the variable I want to split on occur *after* the treatment was assigned?"**
  >
  > *   If **YES** (Post-treatment): Be extremely suspicious. It is likely a Mediator or Collider. Aggregation (Total Effect) is usually the correct policy metric.
  > *   If **NO** (Pre-treatment): It is likely a Confounder. Disaggregation is usually required to remove bias.

  In the Job Training case, the Exam happens *after* the Training. Therefore, splitting by Exam results distorts the value of the Training.
