answer: |-
  Good morning.

  For twenty-two years, I have taught letterform design at this school. And for twenty-two years, I have had the same argument. Usually, it happens at three o'clock on a Tuesday, in a room that smells of eraser dust and stale coffee. But this year, the argument is happening here.

  There are six students graduating today who have spent four years fighting with me about the letter 'a'.

  I'd like you to join us in that fight for a moment. Please, pick up the program in your lap. Find the word "Graduate" on the cover. Look at the third letter.

  Now, close your eyes. Keep them closed. I want you to picture that letter in your head. Now, picture the letter 'a' in your own handwriting.

  Open your eyes.

  The 'a' in the program is likely a two-storey 'a'. It has a bowl at the bottom and a little hook arched over the top. It's what you are reading right now. But the 'a' you just pictured in your head—the one you write on grocery lists and birthday cards—is probably a one-storey 'a'. A circle with a stem down the right side.

  Geometrically, these two shapes have almost nothing in common. One looks like a teardrop with a hat; the other looks like a lollipop. Some 'a's have tails. Some are open at the top. Some are drawn in one unbroken stroke.

  So, I ask my students: If they share no single shape, what makes them both an 'a'?

  For the first few years of my career, I tried to teach them that there was an ideal 'a' hiding inside the alphabet, waiting to be found. I was wrong. There is no essence sitting inside the letter.

  An 'a' is not defined by its shape. It is defined by its job.

  An 'a' is whatever can do what an 'a' does. Its job is to stay unmistakably itself. It must not be an 'o'. It must not be a 'd'. It must hold its place in a word whether it is six feet tall on a billboard or six pixels tall on a watch face. It must still read when it is smudged, or blurred, or rushing past you on a highway.

  The shape is flexible. The job is not.

  I know what some of the parents and grandparents in the room are thinking. You are wondering if you paid tuition for your child to argue about the semantics of the alphabet. You might be thinking, "Surely there are bigger things to worry than whether the tail on the 'g' connects."

  But this isn't about the tail on the 'g'. It is about how you go out into the world tomorrow.

  We live in a culture that loves to tell young people to "find themselves." To "follow their passion." To "be authentic." It sounds nice. But as advice, it is useless. It is like telling a type designer to "draw a good letter" without telling them what word it belongs to.

  You cannot be distinctive at nothing. You cannot have a voice in a vacuum.

  My six type-design students know this. They know I will not accept a portfolio where they simply "expressed themselves." I want to know what decisions they made. Because style is not a garnish you add to the end. Style is the history of your decisions. Hand a good designer four letters of a new typeface, and she can draw the other twenty-two. Not because she is copying a shape, but because she has established a way of solving problems. A consistent voice.

  That is what I want for all of you.

  Do not go out there looking for your essence. You won't find it. It isn't buried inside you waiting to be excavated. Instead, look for the job. Look for the constraint. Look for the thing that needs to be done that only you can do, in the way you do it.

  Your voice will not come from ignoring the rules. It will come from how you negotiate with them. It will come from the friction between who you are and what the work requires.

  If you are a nurse, the job is not "be caring." The job is to keep a patient stable while the world is chaotic. Your voice is how you hold their hand while you do it. If you are an accountant, the job is not "be good at math." The job is to make the numbers tell the truth without lying. Your voice is the integrity of the column.

  The job is real. The constraints are real. If you ignore them, you don't get freedom. You get noise. You get an 'a' that looks like an 'o'. You get work that no one can read.

  But if you accept the job—if you accept that you are part of a larger system, a larger word—then you have permission to make decisions. You have permission to have a voice.

  To the six of you who fought me on the 'a': You won. You proved that the shape doesn't matter as long as the function holds. I expect you to hold the function.

  To the rest of the graduates: You have spent four years learning how to do a job. Do not spend the next forty years worrying about whether the job matches your soul. Put your soul into the job.

  The letter doesn't need to be perfect. It just needs to read.

  Thank you.
