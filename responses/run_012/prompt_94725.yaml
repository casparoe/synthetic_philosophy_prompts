answer: |-
  The question
  Does the concept of causing harm by omitting to act apply to harms produced by a standing arrangement rather than by an individual's non-action, or is that concept essentially agent-shaped and moment-shaped? In my reported cases, deaths were foreseeable and cheap to avert, yet traceable to no specific person's failure at a specific time. There are three possible answers. First, yes: a system can omit to act, and the arrangement itself is the cause. Second, no: causation requires an agent who could have done otherwise, so in these cases, the harm simply happened without a causal subject. Third, no: the causal vocabulary runs out, but we must invent a new one to capture structural inertia. I aim to determine which answer holds. If the second is right, it implies a disturbing limit to how we assign responsibility in modern bureaucracy. If the first is right, it requires us to treat policies as actors. I will argue for the third: that our current language fails, and recognizing this failure is the only way to accurately describe preventable systemic harm.

  Why the existing positions leave it open
  The standard debate over whether omissions can be causes is old and crowded. One position holds that absences aren't events, so an absence cannot stand in a causal relation; nothing cannot cause something. A competing position argues that causation is about counterfactual dependence: if the omission hadn't occurred, would the harm have been avoided? If yes, the omission is a cause. A third view suggests that picking out which non-events count as causes smuggles in a normative baseline about how things should have gone. All these positions presuppose an individual agent with a determinate moment of non-action. They ask whether *someone* failing to do *something* at *time T* caused the harm. My cases do not fit this shape. There is no inspector who skipped a building on a Tuesday; there is a schedule that could never have covered the buildings, agreed to over years by people who each did their job as defined. I also know the phrase "problem of many hands," but that is about apportioning blame among people who each did something, whereas my cases have no one who did anything in particular. None of the standard positions settle what happens when the omission is baked into a structure that persists over time without a specific decision to maintain it. This gap is genuinely open: we lack a vocabulary for harm caused by the continuous absence of a structure that never existed, rather than the removal of one that did.

  The angle
  My route in is not through armchair conceptual analysis but through reported cases stripped down to thin descriptions that keep the causal structure and drop the names and intentions. I will use three cases from my beat: heat deaths in housing where inspection regimes were mathematically incapable of coverage; a benefits rule known to be wrong but maintained by sequential approvals; and a staffing formula everyone could see was going to fail. I will describe these not as scandals involving villains, but as systems where condition C persisted despite knowledge K, without any single actor changing status from active to inactive. I will test these against candidate criteria for causal status. Does the harm counterfactually depend on the arrangement? Yes. Was there a normative expectation that the arrangement should be different? Yes. Was there a salient agent who failed? No. The argument will claim that if causation requires an agent, we are lying when we say these deaths were caused by neglect. We are instead describing a category error. This beats armchair analysis because it grounds the metaphysics in real stakes; people died, and our language is failing them. It beats simply reporting more cases because adding more examples of the same confusion doesn't resolve the conceptual block. I need to show why the block exists and what it costs us to leave it in place. The essay will argue that we must either expand causation to include structural inertia or admit that some preventable harms are causally orphaned, which changes how we write about justice.

  Plan and schedule
  In the first quarter, I will read broadly on causation and omission without getting bogged down in technical logic. I need enough mastery to explain the positions plainly, not to solve them formally. I will also refine the three case studies, ensuring I have enough documentation to prove the harm was foreseeable and the fix was cheap, without relying on identifying a specific negligent individual. In the second quarter, I will build the case set into the thin descriptions required for the argument. I will interview the administrators involved not to find blame, but to understand how they viewed their own agency within the standing arrangements. In the third quarter, I will draft the full ten thousand words. I will focus on weaving the philosophical argument into the narrative of the cases, ensuring the prose remains accessible to a general-interest audience. In the fourth quarter, I will hand drafts to two or three people who do this for a living: a philosopher who writes for the public, a senior editor, and a lawyer familiar with liability. I will revise in light of what they say, specifically checking if the argument holds up under scrutiny or if I have accidentally relied on a settled debate. If the feedback suggests the metaphysics are too heavy, I will shift the weight toward the implications for journalism and public discourse.

  What success and failure look like
  Success looks like a piece worth publishing rather than a muddle. It must offer a determinate answer to the question, even if that answer is that the question reveals a flaw in our language. The reader should finish the piece understanding why they cannot find a villain in these stories, not because the reporting was insufficient, but because the causal structure doesn't support one. It should change how editors assign stories about systemic harm. Failure would count as the project failing if I end up merely restating the problem of many hands or if I retreat into technical metaphysics that alienate the magazine's readers. Another failure mode is if the cases turn out to have hidden agents—someone who did skip the inspection—collapsing the structural argument into a standard negligence story. If the cases turn out not to cooperate, I should pivot. I would shift the focus from whether the omission is a cause to whether our legal and moral frameworks require us to pretend it is. I would write about the necessity of the fiction of agency, rather than the metaphysics of the cause. This preserves the core insight about systemic harm without relying on the causal claim holding up perfectly.

  Scope and risks
  This fits a year and ten thousand words because I am not solving the metaphysics of causation, only applying them to a specific class of harm. The risk is that the philosophical debate is too deep; I could spend a year just reading about counterfactuals. I would cut that first. I will stick to the plain-term descriptions of positions necessary to set up the gap in my cases. Another risk is that the reporting expands; I might chase new cases when I have enough. I will limit myself to the three core cases identified in the angle. If the piece grows too big, I will cut the historical context of the debate. The reader does not need to know the history of omission theory, only that it currently fails to describe their world. The deliverable is the essay, so the proposal must ensure I spend my time writing, not researching indefinitely. I will enforce strict word counts on the philosophical exposition to ensure the reported cases remain the engine of the piece. This keeps the project grounded in my strength as a features writer while respecting the intellectual rigor the fellowship requires.
