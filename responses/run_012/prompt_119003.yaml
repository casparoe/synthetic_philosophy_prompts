      5.  Flag uncertainty on the metaethical grounding.

  7.  **Final Polish:** Ensure I explicitly flag confidence levels as requested. Ensure I don't waffle on the verdict.

      *(Check against constraints)*: "Be committed." "Flag places where you're least confident." "Tell me who's right about what."

