answer: |-
  The chocolate case provides a stress test for theories of vagueness because it captures a transition from a natural, disputed usage to a legislated, precise one. Before the rule, the term "dark" functioned in ordinary language: 85% was clearly dark, 40% was clearly not, and the 50–70% range was a zone of disagreement. After the rule, the term functions in a regulatory context: 60% is the hard line, and disagreement ceases. How Epistemicism and Supervaluationism map onto this transition reveals their respective strengths and weaknesses.

  For the Epistemicist, vagueness is merely ignorance. There is always a sharp boundary in reality, even if we cannot locate it. Applied to the pre-rule chocolate, the Epistemicist must insist that "dark" was not actually vague in the world, only in our minds. There was a fact of the matter about the 50–70% bars all along. Perhaps the true cutoff was 63.4%. A 59.9% bar was simply not dark, and a 60.1% bar was simply not dark either (if the cutoff was higher), or vice versa. We just didn't know. The arguing in the 50–70% range was a symptom of our epistemic limitation, not semantic indecision.

  When the association publishes the 60% rule, the Epistemicist faces a dilemma regarding discovery versus invention. If the pre-rule fact of the matter was truly 63.4%, and the rule sets the line at 60%, the association did not discover the boundary; they overwrote it. To maintain consistency, the Epistemicist must claim the rule changed the meaning of the word. "Dark" in the trade statistics is no longer the same concept as "dark" in ordinary talk; it is a new technical term, "Dark-Trade," with a new, known sharp boundary. Consequently, the 59.9% bar shifts from being "unknown status" to "determinately not Dark-Trade." The Epistemicist can register the difference between discovering and making a boundary, but only by positing a meaning shift. This makes the pre-rule "fact of the matter" look metaphysically idle. If the association can simply stipulate 60% and resolve the issue, the prior existence of a hidden 63.4% boundary explains nothing and predicts nothing. It renders the pre-rule reality otiose.

  This case exacerbates the Epistemicist's worst problem: the arbitrariness of the unknowable cutoff. In ordinary language, the Epistemicist claims there is a sharp line we can't know, which seems magical. In the trade case, there is a sharp line we *can* know because we made it. The contrast highlights the absurdity of the pre-rule position. Why posit a hidden, unknowable 63.4% cutoff before the rule, when the post-rule 60% cutoff works perfectly well as a human invention? Furthermore, regarding higher-order vagueness (vagueness about where the boundary lies), the Epistemicist denies it exists; the boundary is always sharp. But the case shows that before the rule, the *location* of the boundary was genuinely unsettled, not just unknown. The Epistemicist cannot capture the intuition that the boundary itself was created by the rule, only that the word was swapped for a sharper one.

  The Supervaluationist tells a different story. For them, vagueness is semantic indecision. Before the rule, "dark" was genuinely vague. There was no fact of the matter about the 50–70% bars. A 59.9% bar was neither truly dark nor truly not dark; its truth value was indeterminate because some admissible precisifications of "dark" included it, and others excluded it. The arguing stopped not because we found the truth, but because we resolved the indecision.

  When the association sets the 60% rule, the Supervaluationist says the association *made* the boundary. They took a vague term and selected one specific precisification from the set of admissible options, making it mandatory for the trade context. This aligns perfectly with the intuition that the boundary was invented, not discovered. Regarding the 59.9% and 60.1% bars: before the rule, their status was indeterminate; after the rule, they are determinately not-dark and dark, respectively. The Supervaluationist handles the meaning shift elegantly. "Dark" in ordinary talk remains vague (a set of precisifications), while "dark" in the trade statistics is precise (a singleton set containing only the 60% cutoff). The word hasn't necessarily changed its core meaning, but the context has restricted the range of admissible interpretations.

  However, the prompt raises a specific challenge: the Supervaluationist seems stuck saying the rule picked a precisification without making it *correct*. Does this survive? In ordinary language, a precisification is correct if it respects usage. In the trade context, the rule *makes* the precisification correct by fiat. The Supervaluationist can survive this by appealing to context-sensitivity. In the context of trade regulation, "admissibility" is defined by the rulebook, not by common usage. Thus, the rule makes the 60% cutoff supertrue within that specific context. The view holds up, provided one accepts that the standards for "admissibility" can shift from descriptive (usage) to prescriptive (law).

  This case also mitigates the Supervaluationist's worst problem: the vagueness of "admissible precisifications." Critics argue that to define vagueness, Supervaluationism needs a sharp set of admissible precisifications, but "admissible" is itself vague. The chocolate case demonstrates how this problem is practically managed. In ordinary talk, the set of admissible precisifications is fuzzy (hence the arguing). In the trade context, the authority sharpens the set of admissible precisifications down to one. This shows that the "vagueness of admissibility" is not a fatal logical flaw but a feature of unregulated contexts that can be resolved by stipulation. The theory can register the difference between the fuzzy pre-rule set and the sharp post-rule set without positing hidden metaphysical facts.

  Comparing the two through this case, Supervaluationism handles the scenario less badly. The Epistemicist is forced to claim that before the rule, there was a real, sharp boundary that the rule effectively ignored or replaced. This makes the pre-rule metaphysics look like a ghost that vanishes when the lights are turned on by legislation. It struggles to explain why the arguing felt like genuine semantic uncertainty rather than mere ignorance of a fact. The Supervaluationist, conversely, validates the intuition that the arguing stopped because we *decided*, not because we *found*. They accommodate the transition from vagueness to precision as a resolution of semantic indecision rather than a replacement of concepts. While the Supervaluationist must lean heavily on context-sensitivity to explain why "dark" behaves differently in the rulebook than in the kitchen, this is a lighter burden than the Epistemicist's commitment to unknowable, pre-legislative facts that the legislation renders irrelevant. The chocolate case shows that vagueness is often something we resolve, not something we uncover, and Supervaluationism is the theory built for resolution.
