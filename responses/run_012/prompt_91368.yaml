answer: |-
  Here is the spec sheet you asked for. I have structured this as a requirements document for a theory of verbal disputes, flagging the non-negotiables, the contested preferences, and the structural tensions that make this problem hard.

  ### Part I: The Desiderata (The Spec)

  A theory of verbal disputes (TVD) must function as a diagnostic tool. It takes a dispute $D$ between agents $A$ and $B$ over proposition $P$ and outputs a classification. To be adequate, it must satisfy the following constraints.

  #### 1. Extensional Adequacy (The Case Constraints)
  The theory must classify the following cases correctly. "Correctly" here means aligning with the pre-theoretic intuition of a competent speaker, unless the theory explicitly argues for revisionism (which incurs a cost).

  *   **C1: The Burrito Case (Paradigm Verbal).**
      *   *Requirement:* Must classify as **Merely Verbal**.
      *   *Motivation:* No empirical evidence could settle it; no stake in the world; purely definitional boundary drawing.
      *   *Status:* **Non-Negotiable.** If a theory calls this substantive, it is broken.
  *   **C2: The Tomato Case (Contextual/Interest-Relative).**
      *   *Requirement:* Must classify as **Verbal relative to context, Substantive relative to goal**.
      *   *Motivation:* In a grocery store (culinary context), "fruit" is false. In a lab (botanical context), "fruit" is true. The dispute arises from conflicting contexts, not conflicting world-views.
      *   *Status:* **Non-Negotiable.** A theory that forces a single truth-value here fails to capture semantic flexibility.
  *   **C3: The Physics Sign Convention (Stipulative).**
      *   *Requirement:* Must classify as **Verbal (Stipulative)**, but distinguish from C1.
      *   *Motivation:* Unlike the burrito, the choice of convention has downstream mathematical consequences. The disagreement is about *notation*, not *nature*, but it mimics substantive disagreement if conventions are mixed.
      *   *Status:* **Non-Negotiable.** Must distinguish stipulation from lexical ambiguity.
  *   **C4: The Composite Objects Case (The Hard Case).**
      *   *Requirement:* Must remain **Neutral** or provide a **Decidable Criterion**.
      *   *Motivation:* Universalists say "there are tables." Nihilists say "there are only simples arranged tablewise." A TVD cannot simply *assert* this is verbal (like Hirsch) or substantive (like Sider) without begging the metaontological question.
      *   *Status:* **Contested.** This is where camps diverge. However, the theory must explain *why* it is hard to tell, not just stipulate an answer.
  *   **C5: The Drifting Communities (Diachronic/Sociological).**
      *   *Requirement:* Must classify as **Verbal (Semantic Drift)**.
      *   *Motivation:* Neither party is confused; the language has changed beneath them. The disagreement is real but located in the mapping between word and concept, not in the concepts themselves.
      *   *Status:* **Non-Negotiable.** Must account for externalist semantics.

  #### 2. Intensional Adequacy (The Distinction Constraints)
  The theory must not collapse the following distinctions.

  *   **D1: Verbal vs. Trivial vs. Unresolvable.**
      *   *Requirement:* A dispute can be verbal but important (e.g., legal definitions of "person"). A dispute can be substantive but trivial (e.g., counting grains of sand). A dispute can be substantive and unresolvable (e.g., brute modal facts).
      *   *Motivation:* "Merely verbal" is often used as a slur meaning "unimportant." A TVD must separate the *source* of disagreement (language) from the *stakes* (importance).
      *   *Status:* **Non-Negotiable.**
  *   **D2: Resolving vs. Dissolving.**
      *   *Requirement:* Must distinguish between finding the answer (Resolving) and showing the question was malformed (Dissolving).
      *   *Motivation:* In C1 (Burrito), we dissolve the dispute. In C3 (Physics), we resolve it by standardizing conventions.
      *   *Status:* **Non-Negotiable.**
  *   **D3: Source of Trouble (Ambiguity vs. Vagueness vs. Polysemy).**
      *   *Requirement:* Must identify the linguistic mechanism.
      *   *Motivation:* C1 is vagueness (boundary of 'sandwich'). C5 is polysemy/drift (meaning of 'freedom'). C3 is ambiguity (symbol assignment). The remedy differs for each.
      *   *Status:* **Non-Negotiable.**
  *   **D4: Word-Based vs. Concept-Based.**
      *   *Requirement:* Must distinguish disputing the label ("Call this a sandwich?") from disputing the concept ("Does this satisfy the function of a sandwich?").
      *   *Motivation:* Sometimes we agree on the concept but fight over the word. Sometimes we fight over the concept using the same word.
      *   *Status:* **Non-Negotiable.**

  #### 3. Practical Adequacy (The Usability Constraints)
  *   **U1: Epistemic Access.**
      *   *Requirement:* The participants (or a moderator) must be able to apply the criteria *during* the dispute without omniscience.
      *   *Motivation:* If determining whether a dispute is verbal requires knowing the "true structure of reality" first, the theory is useless for metaontology.
      *   *Status:* **Non-Negotiable for a usable theory.** (Many philosophical theories fail this).
  *   **U2: The Resistance Constraint (Phenomenology).**
      *   *Requirement:* Must explain why participants reliably *resist* the "it's merely verbal" diagnosis.
      *   *Motivation:* If it were obvious, we wouldn't fight for two hours about burritos. A TVD must explain the *illusion* of substantiveness.
      *   *Status:* **Non-Negotiable.**

  ---

  ### Part II: Stress-Testing Your Hypothesis

  **Your Hypothesis:** *A dispute is verbal exactly when the parties would agree on every fact if you rephrased each side in the other's vocabulary.*

  This is essentially David Chalmers' "Verbal Dispute Criterion" (2011). Here is the stress test:

  1.  **Is it too strong?**
      *   **Yes.** It assumes there is a "neutral vocabulary" or a way to translate "facts" without loss. In C4 (Composite Objects), the Nihilist claims there is *no* translation of the Universalist's claim that is true, because the Universalist's claim presupposes existence conditions the Nihilist rejects. If you force a translation (e.g., "simples arranged tablewise"), the Universalist says, "That's not what I meant." The criterion fails if the concepts themselves are incommensurable.
  2.  **Is it too weak?**
      *   **Yes.** Consider normative disputes. Two people argue "Eating meat is wrong." They might agree on all natural facts (pain, biology, ecology) but disagree on the moral fact. Your criterion might classify this as verbal (since they agree on natural facts), but most metaethicists want to leave room for substantive normative disagreement.
  3.  **Is it circular?**
      *   **Dangerously.** It relies on the notion of "agreeing on every fact." To know if they agree on every fact, you need a theory of facts independent of the vocabulary used to describe them. In metaontology, the dispute *is* about what facts exist. You cannot use the existence of facts to settle the dispute about facts.
      *   *Verdict:* It works for C1, C2, C3, and C5. It collapses on C4.

  ---

  ### Part III: The Joint Satisfiability Problem

  You asked if some subset of these requirements is jointly unsatisfiable. **Yes.** There is a Trilemma here. You cannot satisfy all three of the following simultaneously:

  1.  **Metaphysical Neutrality:** The theory does not presuppose an answer to the substantive dispute (required for C4).
  2.  **Epistemic Decidability:** The participants can tell if the dispute is verbal without knowing the metaphysical truth (required for U1).
  3.  **Extensional Accuracy:** The theory correctly classifies hard cases like C4 as either verbal or substantive (required for C1-C5).

  **Why?**
  To satisfy **Accuracy** on C4, you need to know if composition is restricted. That requires **Metaphysical Knowledge**. If you have that, you violate **Neutrality**. If you try to remain **Neutral**, you can only look at linguistic behavior, which makes **Decidability** possible but sacrifices **Accuracy** (you can't tell the difference between a deep substantive disagreement and a complex verbal one).

  **The Trade-off:**
  *   If you want a **Usable** theory (for your reading group), you must give up **Metaphysical Neutrality**. You have to accept that diagnosing a verbal dispute *is* doing metaontology.
  *   If you want a **Neutral** theory, you must give up **Usability**. It becomes a theoretical ideal you can't apply in the room.

  ---

  ### Part IV: Scorecard of the Main Camps

  Here is how the standard families of answers fare against the Spec.

  | Camp | Core Claim | Passes C1 (Burrito)? | Passes C4 (Ontology)? | Passes U1 (Usable)? | Passes U2 (Resistance)? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **No Genuine Disagreement** (Hirsch, Chalmers) | Disputants assert different propositions; no conflict. | **Yes.** Clear. | **No.** Accused of dismissing ontology too easily. | **No.** Requires ideal translation. | **Weak.** Doesn't explain why we feel the conflict. |
  | **Different Concepts** (Conceptual Role Semantics) | Parties employ different concepts with same label. | **Yes.** | **Maybe.** Depends on concept individuation. | **No.** Mapping concepts is hard/slow. | **Yes.** Explains confusion as concept conflation. |
  | **Substantive Dodge** (Sider, Quinean) | All disputes are substantive; "verbal" is a pragmatic label. | **No.** Makes burrito fight substantive. | **Yes.** Takes ontology seriously. | **Yes.** Easy to apply (always substantive). | **Yes.** Validates the feeling of disagreement. |
  | **Metalinguistic Negotiation** (Plunkett & Sundell) | Dispute is about *which concept to use*, not the world. | **Yes.** | **Yes.** Ontology is negotiation over utility. | **Maybe.** Hard to distinguish from substantive. | **Strong.** Explains the passion/stakes. |

  **Winner for Reading Group Utility:** **Metalinguistic Negotiation.**
  It saves the phenomenon (people *are* disagreeing), handles the Burrito case (negotiating food categories), and handles the Ontology case (negotiating conceptual frameworks) without requiring you to solve ontology first.

  ---

  ### Part V: The Killer Constraint

  You asked which single requirement does the most work in knocking out candidates.

  **The Winner: U1 (Epistemic Access / Decidability).**

  Most philosophical theories of verbal disputes fail here.
  *   **Hirsch's Quantifier Variance:** To know if the ontologists are talking past each other, you need to know if quantifiers *can* vary. That's a substantive metaphysical claim. You can't use it to *diagnose* the dispute without already having won the dispute.
  *   **Chalmers' Translation:** To know if a translation preserves truth, you need to know the truth conditions. Again, requires prior metaphysical knowledge.
  *   **Sider's Structure:** To know if a dispute is "joint-carving," you need to know the structure of the world.

  **Why it kills them:** A theory of verbal disputes is supposed to be a tool to *clear the ground* so we can do metaphysics. If using the tool requires us to have already done the metaphysics, the tool is useless.

  **What you have to give up:**
  To satisfy U1, you must accept that "Verbal" is not a metaphysical category but a **pragmatic** one. You cannot define "Merely Verbal" as "No fact of the matter." You must define it as "A dispute where resolving the linguistic ambiguity removes the motivation for further inquiry."
  *   *Cost:* This makes "Verbal" relative to the interests of the inquirers, not an absolute feature of the universe. Some purists hate this.

  ---

  ### Part VI: Recommendation for the Reading Group

  Since you want something **usable**, do not try to solve the metaontological problem of C4 in the first session. You will hit the wall again.

  **Adopt this operational definition for the group:**
  > A dispute is **Merely Verbal** iff:
  > 1.  There exists a disambiguation of the key term(s) such that...
  > 2.  Party A accepts one disambiguation, Party B accepts the other...
  > 3.  And under *either* disambiguation, there is no remaining disagreement about the non-linguistic world.
  > 4.  **Crucial Addendum:** And neither party has a stake in which disambiguation is adopted for the current purpose.

  **How to use it:**
  1.  **Isolate the Term:** (e.g., "Object", "Sandwich").
  2.  **Propose Disambiguation:** (e.g., "By Object, do you mean 'simple' or 'composite'?").
  3.  **Check for Residual Disagreement:** If they agree on the arrangement of simples but fight on the word "object," it's verbal *unless* one of them cares about the word "object" for a reason (e.g., moral status, legal rights).
  4.  **Check Stakes (Constraint 4):** If the Nihilist cares about "Object" because they think composites violate causal closure, the dispute is **not merely verbal**. It is a **Metalinguistic Negotiation**.

  **Final Warning:**
  If your group insists that "Verbal" means "Unimportant," you will fail. You must agree that a dispute can be verbal (about words) and yet high-stakes (e.g., "Is a fetus a person?"). If you can't agree on that distinction, the list of desiderata is unsatisfiable for your group, and the list itself is the result you were looking for.
