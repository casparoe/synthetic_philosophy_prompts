      *   **Task:** Write the *desiderata* for a theory of verbal disputes.
      *   **Specific Requirements:**
          *   The "real list," not fluff.
          *   Cases to handle: Burrito/Sandwich, Tomato (fruit/veg), Physics sign conventions, Composite objects (metaontology), Drifting communities.
          *   Hypothesis to stress-test: "Dispute is verbal iff parties would agree on every fact if rephrased in other's vocabulary."
          *   Distinctions to preserve: Verbal vs. Trivial vs. Unresolvable; Resolving vs. Dissolving; Ambiguity vs. Vagueness vs. Polysemy; Word-based vs. Concept-based verbal disputes.
          *   Constraints: Linguistics, Sociology (why people resist the diagnosis).
          *   Evaluation: How main camps fare (No Genuine Disagreement, Different Concepts, Substantive Dodge).
          *   Key Question: Which single requirement does the most work in knocking out candidates?
          *   Usability: The theory must be applicable to live disputes.
          *   Joint Satisfiability: Flag if requirements are jointly unsatisfiable (this is the user's main interest).
          *   Tone: Rigorous, no fluff, honest about trade-offs.

  2.  **Deconstruct the Core Problem:**
      *   The concept of a "merely verbal dispute" (MVD) is notoriously slippery.
      *   Classic definition (Carnap/Quine/etc.): Disagreement is about language, not facts.
      *   Problem: Language *and* facts are intertwined. If I say "X is F" and you say "X is not F," is it because we mean different things by "F" (verbal) or see different things in "X" (substantive)?
      *   The user wants a spec sheet for a theory that solves this.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Requirement 1: The Intuition Pump (Cases).* Must handle the specific cases provided.
          *   Burrito: Paradigm MVD.
          *   Tomato: Context-dependent (culinary vs. botanical). Not purely verbal, not purely substantive.
          *   Physics: Stipulative convention. Purely verbal in one sense, but has substantive implications if mixed.
          *   Composite Objects: The hard case. Metaontology.
          *   Drifting Communities: Diachronic semantic drift.
      *   *Requirement 2: Distinction Preservation.* Can't collapse Verbal/Trivial/Unresolvable. Can't collapse Resolving/Dissolving.
      *   *Requirement 3: Linguistic Reality.* Must account for ambiguity, vagueness, polysemy.
      *   *Requirement 4: Phenomenology.* Why do people *feel* like they are disagreeing substantively even when told it's verbal? (The "Resistance Constraint").
      *   *Requirement 5: Usability.* Must be decidable in practice.

  4.  **Stress-Testing the User's Hypothesis:**
      *   *Hypothesis:* Verbal iff agreement on all facts under translation.
      *   *Critique:* This is the "Chalmers' Criterion" (from *Verbal Disputes*, 2011).
      *   *Too Strong?* Maybe. Some substantive disputes look verbal until you dig deep.
      *   *Too Weak?* Maybe. Some verbal disputes involve non-factual attitudes (e.g., normative terms).
      *   *Circular?* "Agree on facts" presupposes we know what the facts are independent of the vocabulary. That's the metaontological knot.
      *   *Verdict:* It's the leading candidate but struggles with the "Composite Objects" case because ontologists deny there *is* a translation that preserves truth conditions without loss.

  5.  **Analyzing Joint Satisfiability (The "Gödelian" Twist):**
      *   Can we have a theory that is *both* theoretically robust (captures the metaphysics) *and* usable (decidable by participants)?
      *   *Conflict:* If the theory requires accessing "real concepts" or "world structure" to distinguish verbal from substantive, it fails Usability. If it relies only on surface linguistic behavior, it fails the Metaontology case (Composite Objects).
      *   *Conclusion:* There is a tension between *Diagnostic Precision* and *Epistemic Access*.

  6.  **Evaluating the Camps:**
      *   *No Genuine Disagreement (Hirsch/Chalmers):* Good on Burrito, bad on Composite Objects (seems to dismiss too much).
      *   *Different Concepts (Conceptual Role Semantics):* Good on nuance, bad on Usability (how do we map concepts?).
      *   *Substantive Dodge (Sider/Quinean):* Good on Metaontology, bad on Burrito (makes everything substantive).

  7.  **Identifying the "Killer Constraint":**
      *   Which requirement kills the most theories?
      *   It's the **Phenomenological Resistance Constraint** combined with **Usability**. Theories explain *why* it's verbal, but fail to explain why the participants *can't see it* without the theorist's help, or require god-like knowledge to apply.
      *   Actually, the stronger candidate is the **Metaontological Neutrality** requirement. A theory of verbal disputes shouldn't presuppose an answer to the ontological dispute itself. If your theory says "Composition is verbal," you've already done metaontology.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. Set the stage.
      *   **Part I: The Desiderata (The Spec).** Grouped by category (Extensional, Intensional, Practical). Flag Non-Negotiables vs. Contested.
      *   **Part II: Stress-Testing the Hypothesis.** Analyze the "Translation/Agreement" criterion.
      *   **Part III: The Impossibility Result.** Address the joint satisfiability question directly.
      *   **Part IV: Scorecard of Camps.** How existing theories fare.
      *   **Part V: The Killer Constraint.** Identify the single hardest requirement.
      *   **Conclusion:** Practical advice for the reading group.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between "verbal" and "trivial." A dispute can be verbal but important (e.g., legal definitions).
      *   *Correction:* Ensure the Physics case is handled correctly. It's stipulative, not semantic drift.
      *   *Correction:* The user asked for "Non-negotiable" vs "Prejudice." I need to be explicit about this.
      *   *Refinement on the Hypothesis:* The user's hypothesis is basically Chalmers' criterion. I need to name-drop that but focus on the logic. The circularity risk is high: "Agree on facts" assumes we can specify facts without words.
      *   *Refinement on Joint Satisfiability:* The tension is between *Charity* (making sense of the disputants) and *Revision* (telling them they are wrong).

  10. **Final Polish:** Check tone. Needs to be sharp, academic but accessible, no fluff. Ensure all 5 cases are addressed. Ensure the "Usability" constraint is highlighted.

  *(Self-Correction on the "Jointly Unsatisfiable" point)*: I need to be careful not to say it's *logically* impossible, but rather that satisfying one desideratum (e.g., Metaphysical Neutrality) often violates another (e.g., Decidability/Usability). I will frame this as a "Trilemma."

  *(Final check on the "Killer Constraint")*: I think the "Non-Question-Beggingness" constraint is the real killer. Most theories define verbal disputes in a way that settles the ontological debates they are supposed to analyze.

