answer: |-
  Here is the machinery, repaired and calibrated against your seven cases.

  ### (a) The Principle: The Two-Stage Consistency Test

  To stop the test from laundering intuitions, you must rigidify the input (the maxim) and distinguish the two types of failure. A single principle does not cover all seven; you need a **disjunctive principle** with a specific seam.

  **The Maxim Formulation Rule:**
  A maxim must be stated as: *"I will do [Action X] in [Circumstance C] for the sake of [End E]."*
  *   **Why:** This prevents you from hiding the morally relevant features in the "Circumstance" or "End" to game the test (addressing Case 7).

  **The Test:**
  An action is morally forbidden if its maxim fails **either** of the following stages:

  1.  **The Conception Test (Perfect Duties):** Is it *conceptually possible* for everyone to act on this maxim? If universalizing the maxim destroys the very concept or institution required to perform the action, it fails.
  2.  **The Will Test (Imperfect Duties):** Is it *possible to will* that everyone act on this maxim? Even if the world is conceivable, would a rational agent contradict their own necessary ends by willing it? (Premise: Rational agents necessarily will the conditions required for their own agency and the pursuit of their ends).

  **The Seam:**
  *   **Stage 1** handles duties of *justice/right* (promises, property, truth-telling). Violation = Contradiction in Conception.
  *   **Stage 2** handles duties of *virtue/end* (beneficence, self-development, respect). Violation = Contradiction in Will.

  ---

  ### (b) Mapping the Clauses to Your Cases

  Here is how the machinery processes your verdicts, and where it forces you to pay a price.

  **1. False Promise (Money)**
  *   **Verdict:** Forbidden.
  *   **Clause:** Stage 1 (Conception).
  *   **Mechanism:** The institution of "promising" conceptually requires an expectation of truthfulness. Universal lying destroys that expectation, making the act of "promising" impossible. It is not prudential ("I won't get the loan"); it is logical ("The speech act ceases to function").
  *   **Priya Check:** This refutes Priya. The failure isn't that *you* suffer; it's that the *practice* vanishes.

  **2. Non-beneficence / Non-development**
  *   **Verdict:** Forbidden.
  *   **Clause:** Stage 2 (Will).
  *   **Mechanism:** A world of idle indifferent people is *conceivable* (Stage 1 passes). However, as a rational agent, you necessarily will your own ends. You cannot consistently will a world where no one helps anyone, because you might need help to achieve your own ends. To will the universal law is to will the destruction of your own capacity to act.
  *   **Price:** You must accept the hidden premise: *Rational agency requires certain social conditions to flourish.*

  **3. Coat-check Wallet**
  *   **Verdict:** Forbidden.
  *   **Clause:** Stage 1 (Conception).
  *   **Mechanism:** Same as (1). Property rights rely on the distinction between "mine" and "thine." Universal theft collapses that distinction. If everyone takes what isn't theirs, "taking what isn't yours" loses its meaning because nothing *is* anyone's.

  **4. Free Samples**
  *   **Verdict:** Permissible (Your intuition holds).
  *   **Clause:** Passes Stage 1.
  *   **Mechanism:** You must formulate the maxim correctly: *"I will consume goods explicitly designated by the vendor for free consumption."*
  *   **Why it passes:** The *concept* of a "free sample" is a good offered for consumption without purchase. Universalizing this ("Everyone consumes free samples") does not destroy the concept; it fulfills it. The practice only vanishes if the maxim is *"I will take samples by deceiving the vendor about my intent to buy."* Since you have no duty to buy, the first maxim is the honest one.
  *   **Price:** You must admit that if you *deceive* to get the sample (e.g., pretend to be a potential buyer when you aren't), it fails Stage 1.

  **5. Museum Fire Exit**
  *   **Verdict:** Forbidden.
  *   **Clause:** Stage 1 (Conception).
  *   **Mechanism:** You said "museum closes" isn't the reason. You are right. The reason is conceptual. Maxim: *"I will violate safety rules for personal convenience."*
  *   **Why it fails:** Rules, by definition, imply general adherence. A "rule" that everyone violates when inconvenient is not a rule; it's a suggestion. Universalizing the maxim destroys the concept of a "rule" or "queue system." It is not about the empirical consequence (museum closing); it is about the logical coherence of a system of rules.

  **6. Strategic Friend**
  *   **Verdict:** Forbidden (Your intuition holds, but FUL struggles).
  *   **Clause:** Stage 2 (Will) + **Supplement**.
  *   **Mechanism:** Strictly speaking, a world of strategic networkers is *conceivable*. FUL alone is weak here. To condemn this, you need the **Formula of Humanity** (which Kant derives from FUL): *"Act so that you treat humanity... always as an end, never merely as a means."*
  *   **Repair:** Strategic friendship treats the friend *merely* as a means to career advancement. This contradicts the rational will's commitment to the value of rational agency itself.
  *   **Price:** You must admit FUL (Universal Law) is insufficient alone; it requires FH (Humanity) to catch predatory social behavior that doesn't destroy an institution.

  **7. The Cousin vs. Friend Lie**
  *   **Verdict:** **Both Forbidden.** (Here is where you must sacrifice your intuition).
  *   **Clause:** Stage 1 (Conception).
  *   **Mechanism:** Maxim: *"I will lie to avoid an unwanted social interaction."*
  *   **Why it fails:** The "End" (avoiding boredom vs. avoiding emotional labor) does not change the *Action* (asserting falsehoods to manipulate belief). Universal lying destroys the capacity for communication.
  *   **Price:** To save the test, you must accept that **both lies are wrong.** Kant is absolutist here. The difference in your intuition is prudential (one lie hurts more), not moral. If you insist the Cousin Lie is *permissible*, you are rejecting Kant, not fixing the test. This is the strongest evidence against Priya: the test *overrides* your intuition rather than laundering it.

  ---

  ### (c) Application to New Cases

  **1. The Doctor's Placebo**
  *   **Maxim:** *"I will prescribe an inert substance and assert it is active medication to induce patient recovery."*
  *   **Test:** Stage 1 (Conception).
  *   **Verdict:** **Forbidden.**
  *   **Reasoning:** The practice of medicine relies on the presumption of truthful diagnosis and prescription. If doctors universally prescribe placebos deceptively, the concept of a "prescription" (a directive based on medical expertise) collapses into "a tool for psychological manipulation." Trust in the institution is the condition of the maxim's success; universalization destroys that trust.
  *   **Nuance:** If the patient *consents* to the possibility of a placebo ("I might give you a sugar pill to help your mind"), it passes. The lie is the failure point.

  **2. The Ex's Netflix Password**
  *   **Maxim:** *"I will use a digital access credential granted in a past relationship after the relationship has ended, without explicit renewal of permission."*
  *   **Test:** Stage 1 (Conception) or Stage 2 (Will).
  *   **Verdict:** **Forbidden.**
  *   **Reasoning:**
      *   *Stage 1:* Digital access relies on the concept of "authorized users." If everyone used credentials after authorization was implicitly revoked (by the end of the relationship), the concept of "account security" or "subscription ownership" becomes incoherent.
      *   *Stage 2:* You cannot will a world where property/access rights are ignored based on personal convenience, as you rely on similar rights for your own digital property.
  *   **Note:** This is less severe than theft, but structurally identical to the "Free Sample" case if formulated as *"Take what is not currently offered."*

  ---

  ### (d) Honest Accounting: The Sacrifices

  You asked which verdicts you have to give up to keep the machinery honest.

  1.  **Sacrifice Case 7 (The Cousin Lie):** This is the big one. Your intuition says it's fine; Kant says it's wrong. If you keep the intuition, you admit Priya is right (you are just laundering your preference). If you keep Kant, you must admit that lying to the cousin is morally wrong, even if it's *less bad* than lying to the divorcing friend. The test does not grade on a curve; it is binary.
  2.  **Sacrifice FUL Solipsism (Case 6):** You cannot make the Universal Law test work on the "Strategic Friend" case without importing the **Formula of Humanity**. If you try to force it through FUL alone, you will end up twisting the maxim description until it breaks. Admit that FUL needs FH to handle interpersonal exploitation that doesn't destroy an institution.
  3.  **Refine Case 4 (Samples):** Your intuition is right, but your reasoning was shaky. It is only permissible if the maxim is "Take what is offered for taking." If your maxim is "Exploit marketing generosity," it fails Stage 2 (Will), because you are willing a world where generosity is impossible.

  **Summary of the Repair:**
  Priya is wrong that the test is *just* prudential ("what if everyone did that"). The "Conception Test" is about **logical coherence of practices**, not empirical consequences. However, she is right that **Maxim Formulation** is where the intuition sneaks in. By rigidifying the Maxim Rule (Action + Circumstance + End) and admitting the Two-Stage structure (Conception vs. Will), you stop the test from being a wig for your intuitions.

  But you must pay the tax: **Kantian ethics will condemn some things you think are fine (The Cousin Lie).** That is not a bug; it is the feature that proves the test is doing work.
