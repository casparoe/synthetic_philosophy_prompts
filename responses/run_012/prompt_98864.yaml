answer: |-
  **Episteme Solutions Ltd. – Customer Support Hub**
  **Product:** The JC-1 Belief Optimiser
  **Section:** General Usage & Troubleshooting

  **1. What is the difference between entering 'certain' evidence and 'uncertain' evidence?**
  The JC-1 is designed to maximise efficiency in belief revision. Standard conditionalisation requires you to wait until you are completely certain of a proposition (probability 1) before updating. However, human experience is rarely so binary. The JC-1 utilises Jeffrey Conditionalisation, allowing you to input observations that are merely probable (e.g., 'It is 80% likely to be raining'). The device immediately redistributes your credences across all hypotheses based on this weighted input. There is no need to wait for certainty, which often leads to cognitive stagnation. By updating on uncertain evidence directly, you maintain a fluid doxastic state without the latency of waiting for conclusive proof.

  **2. Does the order in which I enter multiple uncertain observations matter?**
  Yes. Users should be aware that Jeffrey Conditionalisation is not commutative. If you input Observation A followed by Observation B, your final credence function may differ from inputting B followed by A. This is not a defect, but a mathematical feature of processing uncertain evidence sequentially. To ensure consistency, Episteme Solutions recommends logging all observations in strict chronological order as they occur. If you batch-process evidence from a commute upon arriving at the office, please arrange the data timestamps manually. The JC-1 will not auto-correct for order-sensitive variance, as this would require assuming independence conditions that may not hold in your specific epistemic environment.

  **3. What happens if my conditional probabilities change during the update?**
  The JC-1 operates under the 'Rigidity Condition'. This assumes that while your belief in the evidence changes, the conditional probability of other propositions *given* that evidence remains fixed. For example, if you learn the light is likely red, your belief about the car stopping given the light is red should remain stable. If you find that learning the evidence also alters how that evidence supports your hypotheses (violating rigidity), the JC-1 cannot guarantee accurate output. Please note: habitual violation of the Rigidity Condition may void your warranty. We advise users to perform a structural integrity check on their conditional beliefs before syncing with the cloud.

  **4. I am unable to specify the new probability of the evidence without already having updated my beliefs. Is this a bug?**
  *Ticket #89402 – User: 'Sceptic_Dave'*
  *Complaint: 'The device asks me to input the new probability of the evidence, but if I already know that, haven't I already updated? Where do these numbers come from?'*

  **Response:** Thank you for contacting support. This is a common misunderstanding regarding the separation of the 'observation layer' and the 'revision layer'. The JC-1 handles the propagation of credences, not the genesis of the initial sensory impression. The input probability reflects the raw seemings provided by your perceptual system prior to full integration. If you feel unable to quantify this seemings data, please consult your internal phenomenology settings. The JC-1 is not responsible for generating the initial credence assignment; it merely ensures that once assigned, the rest of your belief network is updated coherently. Please try recalibrating your input interface.

  *For further assistance, please visit our Knowledge Base on Diachronic Coherence.*
