  2.  **Deconstruct the Epistemology (Jeffrey Conditionalization):**
      *   *Standard Conditionalization:* Update on $E$ when $P(E)=1$. $P_{new}(H) = P_{old}(H|E)$.
      *   *Jeffrey Conditionalization:* Update on $E$ when $P_{new}(E) = x$ (where $x < 1$). $P_{new}(H) = P_{old}(H|E) \cdot P_{new}(E) + P_{old}(H|\neg E) \cdot P_{new}(\neg E)$.
      *   *Issue 1 (Certain vs. Uncertain):* Jeffrey allows updating without certainty. Standard requires certainty. The product sells the "uncertain" update.
      *   *Issue 2 (Order/Commutativity):* Jeffrey Conditionalization is *not* commutative. If you update on $E$ then $F$, you get a different result than $F$ then $E$, unless specific independence conditions hold. This is a known problem (the "order problem").
      *   *Issue 3 (Rigidity/Invariance):* Jeffrey Conditionalization assumes $P_{new}(H|E) = P_{old}(H|E)$. This is the "rigidity" condition. If learning $E$ changes how $H$ relates to $E$, Jeffrey updating is inappropriate.
      *   *Issue 4 (Objection):* Maybe the "problem of old evidence" or simply that agents aren't logically omniscient, or that priors are subjective. A good objection is that Jeffrey Conditionalization doesn't tell you *what* the new probability of the evidence should be ($P_{new}(E)$), it just tells you how to propagate it. Or perhaps the "input" problem (how do you get the $P_{new}(E)$ without already updating?). Let's go with the input problem: where do the new credences in the evidence come from?

