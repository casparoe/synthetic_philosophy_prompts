      *(Self-Correction on Voice)*: I should avoid writing *as* Darwin (which can slip into caricature) and instead write as an expert analysis of what Darwin *would* have thought, or adopt a narrative voice that channels his analytical style without claiming to be his ghost. The prompt asks "What would Darwin have made of that?" I will answer analytically but with a tone that respects his intellectual style. Actually, a direct simulation of his reasoning (third-person analytical) is usually safer and more useful for a journalist. I will frame it as "Darwin's likely assessment."

