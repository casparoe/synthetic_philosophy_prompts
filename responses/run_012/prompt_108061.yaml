      *   *Refining the "Selection Pressure" point:* Darwin argued tribes with *more* sympathy beat tribes with *less*. If this intervention makes a tribe more sympathetic, that tribe wins. So it *fits* his selection model. It doesn't remove pressure; it changes the weapon. The pressure remains (competition between groups), but the trait being selected is now artificially boosted.
      *   *Refining the "Religion" point:* Darwin saw religion as binding a tribe. This movement binds a tribe. But because it alters the biology, it makes the bond harder to break. He might find this dangerous (inflexibility).

  7.  **Finalizing the Text:** (Drafting mentally with British spelling: *favouritism, behaviour, programme, civilised, etc.*)

      *   *Intro:* Ground in *The Descent of Man*.
