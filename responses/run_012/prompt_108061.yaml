      *   **Key Tensions to Address:**
          *   Moral sense evolution (social instincts/sympathy widening) vs. Group Selection (cohesive/self-sacrificing tribes beat selfish ones).
          *   Engineered sympathy: Acceleration of natural trend vs. removing selection pressure.
