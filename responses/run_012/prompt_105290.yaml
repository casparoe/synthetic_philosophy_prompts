answer: |-
  This is an excellent test case. Synthetic biology acts as a philosophical stress test for function theories because it decouples *causal contribution* from *evolutionary history* in a way that natural mutations rarely do. In natural systems, the two usually covary, allowing us to glide over the tension between Selected-Effects (SE) and Causal-Role (CR) accounts. Your partner's strain forces them apart.

  Here is an analysis of the downstream consequences of choosing between these accounts, using the synthetic NADH cycle as the running example.

  ### 1. Malfunction and the Source of Normativity
  The most immediate downstream consequence concerns **normativity**. Biological function is normative; it distinguishes between what a trait *does* and what it *ought* to do. The two accounts ground this "ought" differently, leading to divergent diagnoses of failure in your synthetic strain.

  **On the Strict Etiological (SE) Account:**
  Since the metabolic cycle *as a whole* has no history of selection (it is novel), it strictly has no function. Consequently, **it cannot malfunction.**
  *   **The Consequence:** If the cycle fails to regenerate NADH and the cells die, the SE theorist must say the cycle merely *ceased to operate* or was *insufficient*. To say it "malfunctioned" implies it violated a norm, but on the strict SE view, no norm exists for the cycle itself.
  *   **The Component Wrinkle:** You noted the enzymes have evolutionary pedigrees. On the SE view, if Enzyme A fails to catalyze its reaction, *Enzyme A* has malfunctioned (because it has an SE history). However, the *arrangement* of Enzyme A into this specific novel cycle has no function. This creates an ontological fragmentation: the cell contains parts that can malfunction (the enzymes) arranged in a structure that cannot (the cycle).
  *   **Implication:** This renders the SE account practically useless for troubleshooting the synthetic system. It can diagnose part failure but not system design failure.

  **On the Causal-Role (CR) Account:**
  The function is the contribution to the containing system's capacity (cell viability/NADH homeostasis).
  *   **The Consequence:** If the cycle stops regenerating NADH, it is **malfunctioning** relative to the system's capacity. The normativity is grounded in the *current organization* of the system, not its past.
  *   **The Source of the Norm:** In natural systems, the "system capacity" is usually cashed out as fitness or survival. In this synthetic case, the capacity is defined by the **designer's intent** (viability under lab conditions).
  *   **Implication:** The CR account validates the intuition that the *design* can be faulty, distinct from the *parts* being faulty. It allows for the concept of "design malfunction" even in the absence of evolutionary history.

  ### 2. Legitimacy of Lab Ascriptions: Category Error or Literal Truth?
  Your second question asks whether the lab's claim ("the cycle's function is to regenerate NADH") is legitimate.

  **The SE Verdict: A Category Error (or Ellipsis)**
  A strict etiological theorist (e.g., Ruth Millikan or Karen Neander) would argue the lab is speaking loosely. They are projecting biological normativity onto an artifact.
  *   **Correction:** The philosopher should correct them to say: "The cycle *performs the activity* of regenerating NADH," or "The cycle was *designed with the intention* of regenerating NADH."
  *   **Risk:** This creates a disconnect between philosophical analysis and scientific practice. If the philosopher insists the cycle has no function, they are effectively claiming that synthetic biology is not doing "biology" in the functional sense, but rather "engineering." This might be metaphysically consistent but sociologically tone-deaf.

  **The CR Verdict: Literal Truth**
  A causal-role theorist (e.g., Robert Cummins) would argue the lab is speaking literally.
  *   **Validation:** The cycle contributes to a capacity of the containing system. The fact that the system was designed rather than selected is irrelevant to the *current* causal analysis.
  *   **Risk:** This risks making "function" too permissive. If the cycle also produces a toxic byproduct, is that a function? (CR says yes, a "dysfunction" or secondary function). The lab likely wouldn't call the toxicity a function. CR needs a constraint on *which* capacities count (usually "viability" or "experimenter interest").

  **Implication:** If you side with SE, you preserve the uniqueness of "biological" function (tied to evolution) but alienate synthetic biologists. If you side with CR, you accommodate synthetic biology but risk blurring the line between biological traits and arbitrary causal chains.

  ### 3. Practice vs. Metaphysics: Is "Saving the Talk" Enough?
  You ask whether the choice should turn on anything more than which practices we are unwilling to give up. This touches on **conceptual engineering**.

  If the only reason to prefer CR is that it lets biologists keep talking the way they do, that is a pragmatic justification, not a metaphysical one. However, in this specific case, the pragmatic argument carries metaphysical weight because of **explanatory relevance**.

  *   **Explanatory Power:** In the context of the lab, the evolutionary history of the cycle is explanatorily inert. Knowing the cycle wasn't selected tells you nothing about why the cells are alive *now*. Knowing the cycle contributes to NADH regeneration explains the cell's viability.
  *   **The Metaphysical Shift:** Choosing CR here isn't just saving talk; it is acknowledging that the **ontology of the organism has changed.** The synthetic strain is a hybrid: an evolved chassis with an engineered subsystem.
  *   **Consequence:** If we insist on SE, we are implicitly claiming that *only* evolved systems are proper subjects of functional analysis. This would mean synthetic biology requires a *new* vocabulary distinct from biology. If we adopt CR, we acknowledge that "biological function" has expanded to include "engineered biological function."
  *   **Verdict:** The choice shouldn't turn *merely* on saving practice, but on whether the practice tracks a real causal structure. Since the CR ascription tracks the actual causal maintenance of the cell's viability in the lab environment, it is tracking something real, not just linguistic habit.

  ### 4. The Synthetic Biologist's Implicit Commitment
  Your suspicion is correct: **Working synthetic biologists are implicit Causal-Role functionalists.**

  *   **Why:** Their goal is forward-looking (will this design work?), not backward-looking (how did this arise?). When they say "function," they mean "intended causal contribution."
  *   **Defensibility:** This commitment is defensible *within the context of engineering*. It is the correct tool for design, troubleshooting, and modeling.
  *   **The Philosophical Catch:** However, their commitment is defensible only if we accept that "biological function" is a polysemous term.
      *   If the philosopher asks, "Why is this trait *present* in the population?" the SE account is superior (even in synthetic bio, if the strain proliferates, it is effectively being selected).
      *   If the philosopher asks, "How does this system *maintain* viability?" the CR account is superior.

  **Is "Saving the Talk" a Criticism?**
  It is not a criticism to say a concept is chosen to preserve practice, *provided* the practice is successful. However, the philosopher's job is to point out that **the source of normativity has shifted.**
  *   In natural biology, the "boss" is Natural Selection.
  *   In synthetic biology, the "boss" is the Engineer.
  *   If we use the CR account to validate the lab's talk without noting this shift, we obscure the fact that the *normative authority* over the organism has moved from the environment to the lab bench.

  ### Summary of Implications for Your Seminar

  1.  **Malfunction:** SE denies malfunction for the novel cycle (only part failure); CR allows system-level malfunction. SE is ontologically parsimonious but practically blind to design errors.
  2.  **Legitimacy:** SE calls lab talk metaphorical; CR calls it literal. SE preserves the "natural/artificial" distinction; CR dissolves it in favor of "system/component."
  3.  **Practice vs. Metaphysics:** The choice isn't just about saving talk; it's about explanatory relevance. In synthetic contexts, history is irrelevant to current operation, making CR metaphysically appropriate for *current* capacity, even if SE is appropriate for *lineage*.
  4.  **Biologist Commitment:** They are CR users. This is defensible for engineering but requires philosophers to note that the *ground of normativity* is now human intention, not evolutionary history.

  **Recommendation:**
  For your contribution, argue that this case demonstrates the need for **Function Pluralism**. Neither account is "wrong," but they answer different questions.
  *   Use **SE** to ask: "Why do these enzymes exist in the genome?" (Answer: Evolution).
  *   Use **CR** to ask: "What does this novel cycle do for the cell?" (Answer: Regenerates NADH).

  The synthetic strain is not a counterexample that refutes one theory; it is a boundary object that reveals the two theories are tracking different phenomena (history vs. current capacity). The "conflict" arises only if we insist there is only one kind of function. Your partner's lab is not making a category error; they are simply operating in a regime where Causal-Role function is the only one that does explanatory work.
