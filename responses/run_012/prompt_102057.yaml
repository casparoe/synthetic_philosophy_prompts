      *   *Better:* Keep the coin honest. The lesson is about the *reasoning*, not the outcome. But to feel the "Absurdity," they need to see that SIA forces them to ignore the Physics Die.
      *   *Decision:* I will instruct the Facilitator to weight the "Physics Evidence" strongly toward Small, and the "Population" strongly toward Large. The tension is the lesson. The "Presumptuous" feeling comes from realizing they are betting against the Physics Die because of the Population count.
      *   *Wait, one more thing:* To make them *arrive* at the conclusion, I need to guide the betting.
      *   I will structure the betting rounds. Round 1: Just Physics. Round 2: Physics + Existence. Watch the shift.

  10. **Final Polish:**
