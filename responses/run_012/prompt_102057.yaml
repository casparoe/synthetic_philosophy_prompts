      *   2. In World S, there are 10 "Observer IDs" in existence. In World L, there are 100 "Observer IDs".
      *   3. The 16 participants are told: "You have been assigned an ID at random from the set of existing IDs in the chosen World."
      *   4. *Crucial Step:* To make this work physically, we use Index Cards.
