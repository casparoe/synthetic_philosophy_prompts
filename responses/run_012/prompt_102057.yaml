      *   Hypothesis L: There are 100 total observers in existence.
      *   Prior: 50/50.
      *   Evidence: "I am an observer." (Trivial).
      *   *New Evidence:* "I am in this specific reading group."
      *   *The Trick:* We need to simulate the "I am a random observer" feeling.
      *   **Decision:** Use the **"Lottery of Identity"** mechanic.
