prompt: |-
  I'm a backend engineer at a mid-size company and I sit on our engineering investment board — we decide whether to keep funding big internal projects. Next week we're deciding on moving billing off our old mainframe: 18 months in, roughly double the original estimate, team reckons another 8-10 months. If we kill it now we have to run the old system alongside the half-migrated one for at least two years, which is definately worse than either finishing or never starting.

  A mate once explained the dollar auction to me: someone auctions a £20 note, and the trick is that the top two bidders both pay, but only the top bidder gets the note. So people bid past £20 and carry on, because dropping out means paying for nothing. I can't stop thinking thats us, and I want it in the memo but I don't want to sound like I've just read one pop-economics article.

  Draft the memo I'll circulate before Thursday: recommend approve, kill, or approve with conditions, with a time frame and what the conditions would be. Take the case for finishing seriously — "we've spent £9m and stopping now leaves us worse off than never starting" isn't obviously just a fallacy. And tell me honestly whether the dollar auction is even the right comparison, or whether the differences matter (our prize's value isn't fixed, and unlike the bidders we can change the rules mid-game — e.g. hand the decision to someone who hasn't bid).
reasoning: |-
  Here's a thinking process that leads to the suggested memo and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Backend Engineer on an Engineering Investment Board.
      *   **Context:** Deciding on a legacy mainframe billing migration project.
      *   **Status:** 18 months in, 2x original estimate, 8-10 months remaining (new estimate).
      *   **Sunk Cost:** £9m spent.
      *   **Consequence of Killing:** Run old + half-migrated system for 2+ years (worse than finishing or never starting).
      *   **User's Concern:** Feels like a "Dollar Auction" (escalation of commitment), wants to reference it but not sound naive.
      *   **Task:** Draft a memo for circulation before Thursday (recommendation + timeframe + conditions) AND provide an honest analysis of whether the Dollar Auction analogy holds water.
      *   **Tone:** Professional, analytical, pragmatic, not academic/pop-econ.

  2.  **Deconstruct the Decision:**
      *   *Option A: Kill Now.* Sunk cost £9m lost. Operational burden: High (hybrid state for 2 years). Risk: High (technical debt, integration hell).
      *   *Option B: Finish.* Additional cost: 8-10 months dev time + overhead. Benefit: Modern billing, no mainframe. Risk: Estimates might be wrong again (18 months already slipped).
      *   *Option C: Approve with Conditions.* Finish, but with strict guardrails to prevent further slippage.

      *   *The "Sunk Cost" Nuance:* The prompt explicitly says "stopping now leaves us worse off than never starting." This suggests the *marginal* cost of the hybrid state is higher than the marginal cost of finishing. This isn't just emotional sunk cost; it's a practical operational trap.

  3.  **Analyze the "Dollar Auction" Analogy:**
      *   *The Theory:* Two bidders, highest wins, both pay. Rational actors bid >£20 to avoid losing the bid price.
      *   *The Fit:* We've spent £9m (bid). If we stop, we pay £9m + operational pain (losing the bid price). If we continue, we spend more to get the asset.
      *   *The Mismatch:*
          1.  *Value isn't fixed:* A new billing system *should* have ROI (efficiency, features), unlike a £20 note.
          2.  *No competitor:* We aren't bidding against another department; we're bidding against time/complexity.
          3.  *Rule Changing:* We *can* change scope, team, or process (unlike the rigid auction rules).
          4.  *The "Hybrid Tax":* The real driver isn't avoiding loss of the bid, it's avoiding the *future* cost of the hybrid state. This is more of a "Concorde Fallacy" mixed with a "Trap."
      *   *Verdict:* It's a useful mental model for *escalation of commitment*, but dangerous if used as the sole argument. It implies irrationality, whereas finishing might be the rational economic choice if the "Hybrid Tax" is high enough.

  4.  **Drafting the Memo:**
      *   *Audience:* CTO, CFO, VP Engineering, Product Leads.
      *   *Goal:* Recommend "Approve with Conditions." Killing is too expensive operationally. Blind approval is risky given past performance.
      *   *Structure:*
          1.  Executive Summary (Recommendation).
          2.  Current State & Costs (The £9m, the timeline).
          3.  The "Kill" Scenario (Why it's actually more expensive).
          4.  The "Finish" Scenario (The path forward).
          5.  Conditions/Guardrails (How we prevent another slip).
          6.  Decision Required.
      *   *Handling the "Dollar Auction" concept:* Do *not* explicitly name-drop "Dollar Auction" in the memo. It sounds academic and accusatory. Instead, describe the *mechanism* (escalation of commitment, marginal cost analysis) without the label. Focus on the "Hybrid Tax."

  5.  **Refining the Recommendation:**
      *   *Recommendation:* Approve with Conditions.
      *   *Why:* The "Hybrid Tax" (running two systems) is the real killer. £9m is sunk, but the future cost of *not* finishing exceeds the cost of finishing.
      *   *Conditions:* Scope freeze, external audit of the 8-10 month estimate, hard stop date, leadership change (maybe?). Let's go with: Independent estimate validation, scope lock, and bi-weekly board review.

  6.  **Drafting the Analysis (for the user):**
      *   Need to be honest about the analogy.
      *   Validate their intuition (yes, it feels like escalation).
      *   Correct the application (no, it's not a pure dollar auction because the prize has variable value and we control the rules).
      *   Highlight the real economic driver: The "Hybrid Tax."

  7.  **Review and Polish:**
      *   *Memo Tone:* Check for neutrality. Avoid blaming the team, focus on the project state.
      *   *Analogy Check:* Ensure the explanation to the user is clear on *why* the analogy is imperfect but useful.
      *   *Constraint Check:* Did I answer "Approve, Kill, or Conditions"? Yes. Timeframe? Yes. Conditions? Yes.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Initially, I thought about suggesting a team shakeup. But that might cause more delay. Better to suggest an *audit* of the remaining work.
      *   *Correction on Analogy:* Make sure to distinguish between Sunk Cost Fallacy (ignoring past costs) and the Dollar Auction (active escalation to avoid loss). The user's situation is closer to a "Trap" where the exit cost is higher than the completion cost.
      *   *Memo Language:* Instead of saying "Dollar Auction," use terms like "asymmetric exit costs" or "escalation of commitment." Actually, better to avoid jargon entirely and stick to "operational burden."

  9.  **Final Output Generation:** (Proceeding to generate the memo and the analysis based on these thoughts.)
answer: |-
  ### Part 1: The Analysis (For You)

  **Is the Dollar Auction the right comparison?**
  Honest answer: **No, not strictly.** But your intuition about the *dynamic* is correct.

  Here is why the analogy breaks down, and why that matters for your decision:

  1.  **The Prize Value Isn't Fixed:** In the Dollar Auction, the prize is always £20. In your case, the "prize" (a modern billing stack) has variable value. If finishing it unlocks new pricing models or reduces churn, the value might be £50m, not £20m. If you treat it like a fixed prize, you undervalue the ROI.
  2.  **You Can Change the Rules:** In the auction, you can't say "actually, I only pay if I win." In engineering, you *can* change the rules. You can descoped, change vendors, or swap the team. The Dollar Auction assumes rigid constraints; your project has flexible constraints.
  3.  **The "Second Bidder" is Missing:** The Dollar Auction requires a competitor driving the price up. You don't have a competitor; you have **complexity**. The driver isn't "I need to beat the other guy," it's "I need to avoid the penalty of stopping."
  4.  **The Real Trap is the "Hybrid Tax":** You identified the crucial detail: *running the old system alongside the half-migrated one for two years is worse than finishing.* This isn't a Sunk Cost Fallacy (throwing good money after bad). This is a rational calculation that **Exit Costs > Completion Costs.**

  **Verdict:** Don't use the term "Dollar Auction" in the memo. It signals you think the team is acting irrationally or emotionally. It puts them on the defensive. Instead, frame it as **"Asymmetric Exit Costs."** This acknowledges the math without accusing the project leads of psychological bias.

  **Recommendation:** **Approve with Conditions.**
  Killing the project triggers the "Hybrid Tax" (operational drag, dual maintenance, risk of data drift). That is a tangible future cost that likely exceeds the cost of the remaining 8-10 months. However, given the 2x slippage, blind approval is fiduciary negligence. You need to validate the *new* estimate before releasing the next tranche of funding.

  ***

  ### Part 2: The Memo

  **To:** Engineering Investment Board
  **From:** [Your Name]
  **Date:** [Date]
  **Subject:** Decision Required: Billing Migration Project (Project [Name])

  **Executive Summary**
  I recommend we **approve continued funding for Project [Name] with strict conditions**, targeting completion within 10 months.

  While the project has exceeded initial time and cost estimates, the operational cost of terminating now exceeds the cost of completion. However, given the variance in the original timeline, we cannot approve the remaining work without validating the new scope and establishing harder governance.

  **Current State**
  *   **Time Elapsed:** 18 months.
  *   **Budget Spent:** £9m.
  *   **Current Estimate to Complete:** 8–10 months.
  *   **Status:** Core logic migrated; integration and parallel run phases pending.

  **The Cost of Termination (The "Hybrid Tax")**
  We have evaluated the scenario where we halt development immediately. Because the migration is partial, we cannot revert to the mainframe without significant data loss risk. We would be forced to operate a hybrid architecture (legacy mainframe + new microservices) for a minimum of 24 months while we slowly decouple or rebuild.

  Our modeling shows this "Hybrid State" incurs:
  1.  **Dual Maintenance:** Supporting two billing engines simultaneously.
  2.  **Reconciliation Overhead:** Manual intervention for data drift between systems.
  3.  **Opportunity Cost:** Inability to launch new pricing models supported only by the new stack.

  **Conclusion:** The marginal cost of finishing the project is lower than the marginal cost of maintaining the incomplete state. Terminating now locks in the £9m sunk cost *plus* significant ongoing operational drag.

  **The Risk of Continuation**
  The primary risk is not technical feasibility, but estimation reliability. An 18-month slip suggests our initial discovery was flawed or scope creep was unmanaged. Approving another 10 months without guardrails risks a repeat scenario.

  **Recommendation: Approve with Conditions**
  We should fund the completion, but treat the next 10 months as a distinct project with new governance.

  **Proposed Conditions:**
  1.  **Independent Estimate Audit:** Before releasing Q3 budget, an external technical lead (or internal team not involved in the build) must validate the remaining 8–10 month backlog. We need confidence this isn't optimistic padding.
  2.  **Scope Freeze:** No new features or "nice-to-haves" added to the migration path. The definition of "Done" is feature parity with the mainframe, not improvement. Improvements come in V2.
  3.  **Hard Stop Date:** Funding is approved in 3-month tranches. If key milestones (specifically [Milestone X] and [Milestone Y]) are not met by [Date], the project is escalated to the Board for emergency review, with termination back on the table.
  4.  **Operational Handover Plan:** The team must demonstrate a reduction in "dual-run" overhead by month 4 of this new timeline.

  **Decision Required**
  Please review the attached cost-benefit analysis of the Hybrid State vs. Completion. I propose we vote on this Thursday.

  **My Vote:** Approve with Conditions.

  ***

  ### Part 3: Why This Memo Works

  1.  **It avoids the "Sunk Cost" accusation:** By focusing on the *future* cost of the Hybrid State, you make the argument economic, not psychological. You aren't saying "we spent £9m so we must finish." You are saying "spending £9m was a mistake, but stopping now costs *more* than finishing."
  2.  **It protects you:** If you vote "Approve" and it slips again, you look naive. If you vote "Kill" and the Hybrid Tax burns cash, you look reckless. "Approve with Conditions" shows you understand the risk but acknowledge the operational reality.
  3.  **It respects the team:** It doesn't call them bad estimators explicitly; it calls for an "Independent Estimate Audit." This saves face while ensuring due diligence.
  4.  **It uses the "Dollar Auction" logic without the label:** The section on "The Cost of Termination" effectively describes the auction trap (paying to avoid losing) but frames it as a business constraint (Asymmetric Exit Costs).

  **One final piece of advice for the meeting:**
  If someone brings up the "Dollar Auction" or "Sunk Cost Fallacy," agree with them. Say: *"You're right. Economically, the £9m is gone. The only reason we are discussing this is that the exit penalty—the cost of running two systems—is higher than the cost of finishing. We aren't finishing to justify the past; we're finishing to avoid a more expensive future."*
