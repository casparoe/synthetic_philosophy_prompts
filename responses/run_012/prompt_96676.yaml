prompt: |-
  I recently took over the rule by which our unit decides what to fund and what to work on: a fixed pot of money, a limited pool of reviewer hours, and more proposals worth doing than either can absorb. I had assumed that the right description of what we do is satisficing — we set a bar, fund whatever clears it, and adjust the bar when too much or too little clears it — and I said as much to a colleague who works on decision theory. He pushed back hard. On his view, satisficing is not a genuine alternative to optimizing at all: once you write the costs of searching, deliberating, and reviewing into the objective, a threshold rule simply is the optimal policy for agents in our position, and describing it as satisficing adds nothing. I would like a careful comparison rather than a verdict by slogan, because I will have to defend our procedure to people who ask exactly this question.

  Compare Herbert Simon's satisficing with the resource-rational (or computational-rationality) program, which treats a bounded agent's policy as the solution to a meta-level optimization problem whose objective includes the cost of the computation itself. Set out precisely what each claims — on one side the search process, the acceptability threshold or aspiration level, and its adaptation to what has already been found; on the other, the object-level/meta-level split and something like the expected value of computation — and then work through the following.

  First, is the subsumption claim true? Is satisficing simply what optimality looks like once search and deliberation are costly, or does something in it resist being written into a single objective? Second, if an aspiration level is fixed by an agent's history, its identity, and its comparisons with others rather than derived from an objective, does satisficing become a different kind of theory rather than a special case? Third, does the meta-level optimization regress — optimizing how much to optimize, and then how much to optimize that — tell against the resource-rational program, or is it a harmless feature of it? Fourth, what kind of theory is each: a description of how agents actually choose, an explanation of why their choices look as they do, or a normative standard for how they should choose? And finally, what would each say about a case like mine, in which a threshold is chosen deliberately, revised in the light of what turns up, and constrained mainly by the scarcity of review attention?

  End with a judgment: which framework should I use to describe and defend our selection rule, and what does the other one capture that I would lose by abandoning it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Context:** The user manages a funding unit with fixed money, limited reviewer hours, and excess proposals. They describe their process as "satisficing" (set a bar, fund what clears it, adjust bar). A decision theory colleague argues this is just "optimization with costs" (resource-rationality).
      *   **Task:** Provide a careful comparison between Herbert Simon's *Satisficing* and the *Resource-Rationality* (Computational Rationality) program.
      *   **Specific Questions to Address:**
          1.  Is the subsumption claim true? (Is satisficing just optimization with costs?)
          2.  Does the origin of the aspiration level (history/identity vs. objective derivation) make satisficing a different kind of theory?
          3.  Does the meta-level optimization regress hurt the resource-rational program?
          4.  What kind of theory is each? (Descriptive, Explanatory, Normative?)
          5.  Application to the user's specific case (funding unit, threshold revised by scarcity of attention).
      *   **Conclusion:** A judgment on which framework to use for defense and what is lost by abandoning the other.

  2.  **Analyze the Core Concepts:**

      *   **Herbert Simon's Satisficing:**
          *   *Core Idea:* Bounded rationality. Agents lack the cognitive capacity or information to maximize utility.
          *   *Mechanism:* Search until an option meets an aspiration level ($\alpha$). If found, stop. If not, adjust $\alpha$.
          *   *Aspiration Level:* Often adaptive, based on past experience, social comparison, or need. Not necessarily derived from a global utility function.
          *   *Philosophy:* Procedural rationality (focus on the process) vs. Substantive rationality (focus on the outcome).
      *   **Resource-Rationality (Computational Rationality):**
          *   *Core Idea:* Agents are rational *given* their computational constraints.
          *   *Mechanism:* Maximize expected utility *minus* the cost of computation (time, energy, money).
          *   *Structure:* Object-level problem (choose action) + Meta-level problem (choose how much to think/search).
          *   *Philosophy:* Optimality is preserved but redefined over a broader domain (actions + computations).

  3.  **Drafting the Comparison (Section by Section):**

      *   **Introduction:** Acknowledge the colleague's point (it's a standard debate) but validate the user's intuition (there are differences). Define the two camps clearly.
      *   **Section 1: The Subsumption Claim (Is Satisficing just Optimization with Costs?):**
          *   *Colleague's View:* Yes. If you cost out search, the optimal stopping point looks like a threshold.
          *   *Simon's View:* No. Optimization requires a well-defined utility function over all outcomes. Satisficing admits we *can't* define that. The threshold isn't a shadow price; it's a coping mechanism for incommensurability or lack of information.
          *   *Nuance:* Mathematically, they can look identical in specific models (e.g., optimal stopping theory). Conceptually, they differ on *why* the threshold exists.
      *   **Section 2: The Origin of the Aspiration Level:**
          *   *Resource-Rational:* $\alpha$ is derived from the distribution of options and cost of search. It's a shadow price.
          *   *Simon:* $\alpha$ is psychological/sociological. It drifts based on success/failure (hedonic treadmill). It's not necessarily "optimal" for the task, but "acceptable" for the agent's ego/survival.
          *   *Implication:* If $\alpha$ is fixed by identity/history, it resists the optimization framework because it's not sensitive to the *current* task structure in the right way.
      *   **Section 3: The Meta-Level Regress:**
          *   *Problem:* To optimize computation, you need to compute the value of computation. Isn't that costly too? (Infinite regress).
          *   *Resource-Rational Response:* We assume heuristics at the meta-level or assume the regress stops at some architectural constraint. It's a modeling assumption, not necessarily a psychological claim about infinite recursion.
          *   *Simon's Response:* This regress proves optimization is impossible. We *must* satisfice at the meta-level too.
      *   **Section 4: Theory Type (Descriptive, Explanatory, Normative):**
          *   *Resource-Rational:* Primarily Normative (how a bounded agent *should* act) but used Descriptively (reverse-engineering human heuristics as optimal).
          *   *Simon:* Primarily Descriptive/Explanatory (how agents *do* act given limits). Less concerned with proving optimality, more with viability.
      *   **Section 5: Application to the Funding Case:**
          *   *User's Situation:* Fixed pot, limited review hours, excess proposals.
          *   *Resource-Rational View:* Your threshold is the shadow price of reviewer hours. You are maximizing "Value Funded - Cost of Reviewing."
          *   *Simon View:* You are managing organizational stress. The threshold ensures you don't drown in work and don't leave money on the table. It's about procedural fairness and manageability.
      *   **Conclusion/Judgment:**
          *   *Recommendation:* Use Resource-Rationality for *defense* (it sounds rigorous to economists/decision theorists). Use Satisficing for *internal management* (it acknowledges the human/organizational reality).
          *   *What's lost:* If you drop Satisficing, you lose the acknowledgment that the "cost of review" is hard to quantify and that the "value" of proposals is often incommensurable.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to straw-man the Resource-Rational view. Modern computational rationality (e.g., Griffiths, Lieder) acknowledges that exact optimization is impossible, so they look for *good enough* meta-strategies. However, the *ideal* is still optimization.
      *   *Correction:* Simon isn't anti-rationality; he's pro-*procedural* rationality. I need to make sure that distinction is clear.
      *   *Focus:* The prompt asks about the *origin* of the aspiration level. I need to emphasize that in Simon's view, the aspiration level adapts to the *agent*, whereas in optimization, it adapts to the *environment*.
      *   *Tone:* Academic but practical. The user needs to defend this to colleagues.

  5.  **Final Polish:** Check against all five specific questions in the prompt. Ensure the conclusion is decisive but nuanced. (The prompt asks for a "judgment" at the end).

      *   *Check 1 (Subsumption):* Addressed. Mathematically yes, ontologically no.
      *   *Check 2 (Aspiration Origin):* Addressed. Endogenous vs. Exogenous/Derived.
      *   *Check 3 (Regress):* Addressed. Stopping rules vs. impossibility.
      *   *Check 4 (Theory Type):* Addressed. Normative/Explanatory vs. Descriptive/Procedural.
      *   *Check 5 (The Case):* Addressed. Shadow price vs. Organizational coping.
      *   *Check 6 (Judgment):* Addressed. Hybrid approach.

  6.  **Writing the Response:** (Proceeding to generate the text based on these structured thoughts.) *Self-correction: Ensure I explicitly mention "Expected Value of Computation" (EVC) as requested.* *Make sure to distinguish between 'optimizing' the outcome and 'optimizing' the process.*

      *(Drafting mental outline for the specific funding case)*:
      *   Resource-Rational: "We set the bar where the marginal cost of reviewing one more proposal equals the marginal expected gain in quality."
      *   Satisficing: "We set the bar where we feel comfortable with the load and the quality, adjusting if we feel stressed or wasteful."
      *   The colleague wants the first sentence. The reality is probably the second. The defense should use the first to justify the second.

  7.  **Final Review:** Does this answer the "verdict by slogan" constraint? Yes, by avoiding simple "X is right" and instead analyzing the structural differences.

      *(Final thought on the Regress)*: The regress is a major criticism of resource rationality. I should highlight that resource rationality treats it as a theoretical limit, while Simon treats it as a practical blocker requiring a different logic entirely.

      *(Final thought on Aspiration)*: Simon's aspiration level is dynamic in a way that optimization isn't. It reacts to *disappointment*, not just new data. This is key.

      Okay, ready to write.
answer: |-
  This is a classic tension in decision science, resting on the distinction between *substantive rationality* (outcomes) and *procedural rationality* (processes). Your colleague is articulating the standard economic defense of bounded rationality: that bounds are simply constraints in a larger optimization problem. Simon's original vision was more radical: that bounds change the *logic* of choice, not just the constraints.

  Below is a comparison of the two frameworks, followed by an analysis of your five specific questions, and a final judgment on how to defend your unit's procedure.

  ### 1. Core Claims and Mechanisms

  **Herbert Simon's Satisficing**
  *   **The Problem:** Agents face a world too complex to model fully and possess cognitive architectures incapable of calculating global optima. Utility functions are often undefined or incommensurable.
  *   **The Mechanism:** Search is sequential. The agent holds an **aspiration level** ($\alpha$). Options are evaluated against $\alpha$. If an option meets $\alpha$, search terminates and the option is chosen. If search exhausts the pool without success, $\alpha$ is adjusted (lowered) and search resumes (or vice versa if success is too easy).
  *   **The Adaptation:** $\alpha$ is not fixed by the environment's statistics alone. It adapts to the agent's experience (success raises $\alpha$, failure lowers it) and social comparison.
  *   **The Goal:** To find a *good enough* solution that ensures survival or viability, not to find the *best* solution.

  **Resource-Rationality (Computational Rationality)**
  *   **The Problem:** Agents have limited resources (time, memory, attention), but they are still trying to maximize expected utility.
  *   **The Mechanism:** The agent solves a **meta-level optimization problem**. The objective function is $U(action) - Cost(computation)$. The agent calculates the **Expected Value of Computation (EVC)**: the expected increase in object-level utility from thinking longer versus the cost of that thinking.
  *   **The Adaptation:** The stopping rule (threshold) is derived dynamically from the cost of resources and the statistical distribution of options. It is a "shadow price" of cognitive effort.
  *   **The Goal:** To maximize net utility (outcome value minus processing cost). A threshold rule is merely the *form* the optimal policy takes under specific cost structures.

  ---

  ### 2. Analysis of the Five Questions

  #### First: Is the subsumption claim true?
  *Is satisficing simply what optimality looks like once search and deliberation are costly?*

  **Mathematically, often yes; Ontologically, no.**
  Your colleague is correct that in many formal models (e.g., optimal stopping theory), the solution to a maximization problem with search costs takes the form of a threshold rule. If you define the objective function broadly enough to include "cost of review hours," the policy that maximizes that function will look exactly like a satisficing policy.

  However, Simon would argue this subsumption fails on the **definition of the objective**. Optimization requires a coherent, stable utility function over all possible outcomes to compare them. Satisficing arises when such a function *does not exist* or is too costly to construct even in principle.
  *   **Resource-Rationality** assumes the utility function exists but is expensive to maximize.
  *   **Satisficing** assumes the utility function is often indeterminate, so the agent optimizes *viability* instead.
  *   **Verdict:** The subsumption claim holds if you assume the funding unit has a well-defined "value per proposal" metric that is merely expensive to measure. It fails if "value" is a political or qualitative construct that cannot be reduced to a single number without arbitrary weighting.

  #### Second: Does the origin of the aspiration level matter?
  *If an aspiration level is fixed by history/identity rather than derived from an objective, does satisficing become a different kind of theory?*

  **Yes, this is the critical divergence.**
  In the resource-rational framework, the threshold is a **shadow price**. It is determined by the external environment (distribution of proposal quality) and the internal constraint (cost of reviewer hours). If the pool of proposals improves, the optimal threshold *must* rise.

  In Simon's framework, the aspiration level is **psychological and sociological**. It is determined by:
  1.  **Past Experience:** "Last year we funded 10% of proposals, so this year we should fund roughly 10%."
  2.  **Social Comparison:** "Other units fund at this level."
  3.  **Identity:** "We are a high-prestige unit; we cannot fund anything less than top-tier."

  If your threshold is fixed by these factors, it resists the optimization framework. An optimizer would lower the bar if reviewer hours became cheap, or raise it if the proposal pool improved. A satisficer might keep the bar fixed to maintain organizational stability or fairness, even if it is technically "sub-optimal" for resource usage. This makes satisficing a theory of **organizational homeostasis**, whereas resource-rationality is a theory of **efficiency**.

  #### Third: Does the meta-level optimization regress tell against the resource-rational program?
  *Optimizing how much to optimize, and then how much to optimize that...*

  **It is a theoretical hazard for resource-rationality, but a foundational proof for Simon.**
  *   **Resource-Rational Response:** The regress is halted by assuming "architectural constraints" or by treating the meta-level decision itself as a heuristic that was evolved or learned to be *approximately* optimal. They argue the regress is harmless if the meta-level cost is small relative to the object-level gain.
  *   **Simon's Response:** The regress proves that global optimization is impossible for bounded agents. You cannot optimize the cost of optimization without incurring a further cost. Therefore, at some point, the agent *must* satisfice. If you must satisfice at the meta-level, you are a satisficer all the way down.
  *   **Verdict:** The regress is a vulnerability for the resource-rational program if it claims descriptive accuracy. It suggests that "optimization" is a theoretical idealization, whereas "satisficing" is the actual engine. However, for *normative* defense (justifying what you *should* do), the regress can be ignored by stipulating a reasonable review budget.

  #### Fourth: What kind of theory is each?
  *Description, Explanation, or Normative Standard?*

  *   **Resource-Rationality:** Primarily **Normative/Explanatory**. It tells an agent how they *should* allocate resources to be rational. It is also used explanatorily in cognitive science to reverse-engineer human heuristics (e.g., "Humans look biased, but they are actually optimizing for time").
  *   **Satisficing:** Primarily **Descriptive/Procedural**. It describes how agents *actually* cope with complexity. It offers a normative standard of "procedural rationality" (was the process reasonable?) rather than "substantive rationality" (was the outcome the best?).

  In your context, your colleague is using resource-rationality **normatively** (to justify the rule as efficient). You are using satisficing **descriptively** (to explain how the unit actually copes with the workload).

  #### Fifth: What would each say about your case?
  *Fixed pot, limited review hours, excess proposals, threshold revised by scarcity.*

  *   **The Resource-Rational Interpretation:**
      "Your unit is maximizing $V_{funded} - C_{review}$. The threshold is the point where the marginal cost of reviewing one more proposal equals the marginal expected increase in the quality of the funded portfolio. You revise the threshold because the 'price' of reviewer attention has changed. You are an optimizer with a budget constraint."
      *   *Defense:* "We are efficiently allocating scarce cognitive capital."

  *   **The Satisficing Interpretation:**
      "Your unit is managing organizational load. The threshold is an aspiration level set to ensure the review process doesn't collapse under its own weight. You revise the threshold not because of a calculated shadow price, but because the current load feels 'too heavy' or 'too light' relative to your capacity. You are ensuring the process remains viable."
      *   *Defense:* "We are maintaining a sustainable and fair procedure under uncertainty."

  ---

  ### 3. Judgment and Recommendation

  **Which framework should you use to describe and defend your selection rule?**

  You should **defend** the rule using **Resource-Rationality**, but **manage** the process using **Satisficing**.

  **Why defend with Resource-Rationality?**
  To external stakeholders (auditors, senior leadership, your decision-theory colleague), "satisficing" sounds like settling for mediocrity. It connotes "good enough" in a pejorative sense. Resource-rationality provides the rigorous vocabulary of economics and decision theory. It frames your threshold not as an arbitrary bar, but as an **efficient stopping rule** that respects the scarcity of reviewer hours. It answers the "why" with a logic of efficiency: *We stop reviewing when the cost of further discrimination exceeds the expected value of a better selection.* This is politically robust.

  **Why manage with Satisficing?**
  If you actually try to run your unit as a pure resource-rational optimizer, you will fail. You cannot accurately calculate the "Expected Value of Computation" for every proposal review. You do not know the true distribution of proposal quality in the counterfactual (the ones you didn't read).
  Simon's framework captures the **human and organizational reality** that resource-rationality glosses over:
  1.  **Incommensurability:** Proposals are often qualitatively different; reducing them to a single utility score for optimization is arbitrary.
  2.  **Adaptation:** Your threshold adjustments are likely driven by "reviewer fatigue" or "budget anxiety" (psychological states) rather than calculated marginal costs. Satisficing validates these signals as legitimate data.
  3.  **Fairness:** Satisficing allows for rules that feel fair (e.g., "we fund the top 10%") even if a strict optimization might suggest funding the top 12.5% this year and 7.5% next year.

  **What do you lose by abandoning Satisficing?**
  If you fully adopt your colleague's view, you lose the license to ignore the unquantifiable. You commit yourself to the pretense that reviewer hours have a precise "price" and that proposal quality is a measurable quantity. You risk building a model that is mathematically elegant but operationally brittle. Satisficing protects you from the demand to quantify the unquantifiable. It acknowledges that the goal is not to find the *perfect* portfolio, but to find a *viable* portfolio without burning out the reviewers.

  **Final Verdict:**
  Tell your colleague: *"You are right that mathematically, our threshold rule can be modeled as the solution to a constrained optimization problem. That is how we will justify the efficiency of the process to leadership. However, Simon is right that psychologically and procedurally, we are satisficing. We do not calculate the shadow price of reviewer hours; we adjust our aspirations based on capacity and stress. We use the language of optimization to defend the budget, but the logic of satisficing to run the work."*
