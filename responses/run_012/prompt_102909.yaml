prompt: |-
  I've been reading around Augustine on lying and I've basically come to accept the hard line: lying is intrinsically wrong and never permitted, not even to mislead a murderer about where his victim is hiding, and the gravity of a lie varies but even the most helpful lie is still a sin. What I want is an honest map of what would count against this view. Which cases, arguments, or consequences should actually move me, and which would Augustine himself concede as counting against him versus just wave away? I'm especially interested in three pressure points: whether the prohibition really survives the case where silence or evasion would itself give the victim away, whether the way he grades lies by how harmful they are quietly imports a consequentialist structure he officially rejects, and whether the whole thing collapses into a verbal fetish once you allow truthful statements that are designed to mislead. Sort the defeaters from fatal to merely awkward, say what predictions the view makes that its rivals don't, and be honest about whether it's been insulated by redefining away the counterexamples. Tell me how confident you are in your assessment and flag the one point you're least sure about.
