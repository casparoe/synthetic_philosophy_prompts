answer: |-
  The poem must enact the supervenience it describes: the higher-level lines (the refrains) depend entirely on the lower-level lines (the new verses) for their existence, yet those same refrains dictate the structure and momentum of the piece. A pantoum is the only form tight enough to force this dependency; its interlocking repetitions create a causal loop where the "past" lines determine the "future" context, mirroring how the simmballs constrain the simms even as they are made of them. By making the repeated lines ambiguous enough to apply to both levels, the form itself becomes the undecidable arrow, refusing to let the reader settle on either reductionism or strong emergence without feeling the tension of the other.

  Simms collide in random flight
  Does the bottom push the top?
  Magnetic lock absorbs the light
  Or does the shape make movement stop?

  Does the bottom push the top?
  Simmballs roll with heavy grace
  Or does the shape make movement stop?
  A pattern wants what fragments meant

  Simmballs roll with heavy grace
  No force remains outside the click
  A pattern wants what fragments meant
  The part obeys the whole's command

  No force remains outside the click
  The cluster finds its own true place
  The part obeys the whole's command
  Simms collide in random flight
