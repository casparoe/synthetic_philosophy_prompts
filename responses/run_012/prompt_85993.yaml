answer: |-
  This is a high-leverage research cluster. The Careenium captures the central tension in mechanistic interpretability: we treat internal activations (simmballs) as causal agents to explain model behavior, yet we know the forward pass (symms) is deterministically closed. If the symbolic level is epiphenomenal, interpretability risks becoming a sophisticated form of phrenology—mapping bumps on the skull that don't actually push the muscles.

  Given your constraints (1 year, theorist-heavy reading group, ML context), you cannot solve the metaphysics of causation. You must solve the **engineering of abstraction**. Your goal is to determine under what mathematical conditions a high-level description of a neural network earns the right to be called "causal" despite low-level closure.

  Here is the defended ordering of open questions, prioritized by upstream dependency, tractability for theorists, and neglectedness.

  ### 1. The Stability Condition: When does a pattern become an object?
  **Priority:** Highest (Upstream Bottleneck)
  **Tractability:** High (Dynamical Systems / Information Theory)
  **Neglect:** Critical (Interpretability assumes features exist; Philosophy assumes they don't)

  **The Question:** In the Careenium, a simmball is not just a collection of symms; it is a *stable attractor* that persists despite symm-level turbulence. In neural networks, we treat feature activations as "simmballs." But under what formal conditions does a subspace of activations constitute a stable object rather than transient noise?
  **Why First?** You cannot ask if simmballs *push* (causation) if you cannot define what *counts* as a simmball (ontology). Current interpretability often assumes linearity or disjoint circuits define the objects. This is likely false. If the "simmball" dissolves under minor perturbation of the "symms" (weights/activations), it has no causal autonomy to test.
  **Theoretical Angle:** Focus on **robust coarse-graining**. Use tools from renormalization group theory or information bottleneck methods to define a mapping $M: \text{Symms} \to \text{Simmballs}$. The research target is a stability metric: How much can the low-level state vary while the high-level variable remains invariant?
  **Why this over metaphysics?** It bypasses the "what is real" debate and asks "what is computationally stable." This is tractable for ML theorists in a 12-month window.

  ### 2. The Commutativity of Interventions: Does the high-level push map to the low-level shove?
  **Priority:** Second (The Core Causal Test)
  **Tractability:** Medium (Causal Abstraction Literature)
  **Neglect:** High (Often assumed rather than tested)

  **The Question:** Given a stable coarse-graining (from Q1), does intervening on the simmball yield the same outcome distribution as intervening on the underlying symms? Formally, does the following diagram commute?
  $$ \text{Do}(\text{Simmball}) \to \text{Outcome} \approx \text{Do}(\text{Symms}) \to \text{Outcome} $$
  **Why Second?** This is the direct test of causal exclusion. If you intervene on a "simmball" (e.g., clamp a feature vector) but there is no valid configuration of symms that realizes that clamped state without breaking the model's physics (e.g., creating out-of-distribution activations that crash the network), then the simmball is not a causal agent; it is a dashboard light that breaks when you touch it.
  **Theoretical Angle:** Engage with **Causal Abstraction** (Beckers & Halpern, Geiger et al.). The specific gap to target is *multiple realizability within a single model*. Most causal abstraction work compares different models. You need to test if *one* network supports high-level interventions that are robustly implementable at the low level across different inputs.
  **Trade-off:** This is harder than Q1. If Q1 fails (no stable objects), Q2 is moot. If Q1 succeeds, Q2 is the make-or-break test for interpretability.

  ### 3. The Complexity Threshold: When is the low-level description *too complex* to be causal?
  **Priority:** Third (Explanatory Autonomy)
  **Tractability:** High (Algorithmic Information Theory)
  **Neglect:** Medium (Discussed in philosophy, rarely quantified in ML)

  **The Question:** Even if the symms are causally complete, they may be explanatorily useless. At what point does the complexity of the symm-level description exceed the computational bounds of the observer, granting the simmball level *de facto* autonomy?
  **Why Third?** This is your fallback position. If Q2 shows that simmballs are not *strictly* causal (i.e., there is leakage or approximation error), Q3 asks if they are *effectively* causal. If predicting the outcome via symms requires $O(2^N)$ compute but simmballs require $O(N)$, the simmballs have explanatory autonomy for any bounded agent (including us).
  **Theoretical Angle:** Use **Minimum Description Length (MDL)** or **Computational Complexity**. Define "causal usefulness" as the compression ratio between the low-level trace and the high-level narrative required to predict future states.
  **Implication:** This justifies interpretability even if reductionism is technically true. It shifts the goal from "finding the true causes" to "finding the optimal compression."

  ---

  ### The "Deep But Useless" Trap to Avoid
  **Question:** *What is the fundamental metaphysical status of high-level causation?*
  **Why Avoid:** Your group will be tempted to read Jaegwon Kim or Judea Pearl for 6 months to decide if "downward causation" is real. This is a trap. For ML interpretability, metaphysical truth is less relevant than **operational validity**. Whether simmballs are *ontologically* real matters less than whether treating them as real allows us to predict model behavior under distribution shift. Keep the focus on **interventionist utility**, not metaphysical grounding.

  ### Defense of the Ordering

  1.  **Upstream/Downstream Logic:** You cannot test interventions (Q2) without defined variables (Q1). You cannot argue for explanatory autonomy (Q3) without knowing if the variables are causally inert (Q2). The flow is Ontology $\to$ Causation $\to$ Epistemology.
  2.  **Tractability:** Q1 and Q3 are mathematically formalizable within a year using existing information-theoretic tools. Q2 is the empirical/theoretical bridge. By placing the heavy metaphysics aside, you keep the group productive.
  3.  **Neglect vs. Importance:** Interpretability research is currently flooded with Q4-style work (finding circuits) without Q1/Q2 validation (are these circuits real/stable?). Philosophy is flooded with Q3-style work without ML grounding. Your group sits in the neglected intersection: **Formalizing the conditions under which NN features behave like Careenium simmballs.**

  ### Triggers for Reprioritization

  **Move Q2 Upstream (Do it first) if:**
  *   Early experiments in Q1 show that "stable coarse-grainings" are trivial to find (e.g., simple PCA components are stable). This would suggest the bottleneck isn't defining objects, but verifying their causal power.
  *   A paper emerges demonstrating that standard intervention methods (like activation patching) systematically violate low-level constraints (e.g., creating "adversarial features"). This would make Q2 the immediate crisis.

  **Move Q3 to Priority 1 if:**
  *   Q1 and Q2 yield negative results (i.e., features are unstable and interventions don't commute). If the "simmballs" are causally leaky, your only hope for interpretability is the "Complexity Threshold" argument (Q3). You would pivot to arguing that interpretability is purely a compression task, not a causal discovery task.

  **Deprioritize Q3 (Drop it) if:**
  *   You find that high-level interventions *do* commute perfectly in toy models. If the causal mapping is clean, the "explanatory necessity" argument becomes less urgent; the high-level description is not just useful, it's *true*.

  ### Summary of the Year's Goal
  By month 12, your group should aim to produce a **formal criterion for "Causal Validity of Abstractions" in Neural Networks.**
  *   **Input:** A trained model and a proposed high-level feature (simmball).
  *   **Output:** A metric indicating whether that feature is stable enough (Q1) and causally commutative enough (Q2) to be treated as an explanatory unit, or whether it is merely a lossy compression (Q3).

  This moves the Careenium from a thought experiment to a diagnostic tool for interpretability. It tells us when we are looking at "objects" and when we are looking at "shadows."
