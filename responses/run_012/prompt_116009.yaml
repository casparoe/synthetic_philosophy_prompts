prompt: |-
  I'm a novelist — fourth book, near-future thing — and I've hit a scene I'm worried about getting wrong. Maybe you can help me not embarras myself.

  Setup: the city in the book has outsourced its parole board to a risk-scoring model, and there's a hearing where my data-scientist character (she's meant to be the one who actually knows her stuff) defends it to a skeptical journalist. Her big line, roughly, is: 'Look, the impossibility results in algorithmic fairness already proved that no scoring system can be fair. You can't have it calibrated and equal-error across groups at the same time — that's a theorem, not an opinion, same way you can't square the circle. So the only honest thing left is to stop pretending fairness is on the menu and just optimize for accuracy, and let the politicians argue about the rest.' She even compares it to Arrow's theorem making democracy impossible, says it's that kind of result. And she insists it holds for any dataset, unconditionally, just by the math.

  My worry is two-fold and I can't tell if they're the same worry.

  First, is she even right about the theorem, or is she overstating what it covers? I have a nagging feeling it doesn't bite for just any dataset, that some condition about the groups has to hold, and if so I want to set the scene's numbers (the two groups differ in how often they actually reoffend — I can make that whatever I need) so the argument is live rather than a bluff.

  Second, and this is the one that keeps me up: even if she's right that you can't have all the fairness properties at once, is the move from 'you can't have all of them' to 'so just maximize accuracy' actually valid? It feels like she's smuggling something in — like 'accuracy' is somehow the neutral, non-moral default and the fairness stuff is the optional extra — but I can't articulate why that's fishy, and I don't want to just make her a strawman either. Is there a false step in there? If so, what is it exactly?

  And if she is wrong, give me the version of her speech a real expert would actually deliver — a sentence or two of dialogue I could steal, where the person concedes what the theorem really says but doesn't land in the same place. I'd rather she be sharp and corrected than sharp and wrong.
