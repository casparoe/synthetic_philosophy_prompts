          *   *Conflict:* If I'm a realist about entities (e.g., molecules, individuals), I usually care if the model describes their behavior correctly (Explanation). If I'm instrumentalist about the model, why care about the entities? Usually, Entity Realism implies Structural Realism or at least a demand for causal adequacy, which clashes with pure Instrumentalism (1).
