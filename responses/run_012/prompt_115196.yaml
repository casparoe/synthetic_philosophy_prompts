      *   *Adjustment:* If I drop (1), I should probably adjust (6) to "Realist about entities and *structures*." But the prompt asks which *existing* commitment has to give. (1) is the easiest target. (6) can stay if "Instrumentalist about models" means "Models are tools, not literal truth," which is compatible with Entity Realism (Hacking). I will note that (6) might need slight tweaking but (1) is the main casualty.
