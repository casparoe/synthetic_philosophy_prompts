      *   (3) **Explanation vs. Prediction:** A model predicting right for wrong reasons explains *nothing*. (Contrasts with 1's implication that prediction is sufficient for "excellence").
      *   (4) **Idealizations as Stipulations:** Idealizations (frictionless planes) aren't false claims but definitions of a model system. Unrealism charge misfires. (Nuances 1 & 2).
      *   (5) **The "F-Twist" (Friedman's Twist) Condition:** Idealizations are okay in physics *only if* we have a theory of corrections (perturbation/separation of scales). Without it, it's wishful. (Qualifies 1 & 4).
      *   (6) **Entity Realism + Model Instrumentalism:** Realist about entities posited, instrumentalist about the models themselves. (Tension with 3 and 1).

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: (1) vs. (2) & (3).**
          *   (1) says prediction is king; assumptions don't matter.
          *   (2) says assumptions *do* matter for extrapolation (trustworthiness).
