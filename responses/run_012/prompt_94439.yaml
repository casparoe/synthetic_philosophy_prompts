answer: |-
  The air in the coroner's chamber smelled of floor wax and stale coffee, but everyone remembered the smell of smoke. It had been three weeks since the Gable farmhouse burned down, taking Old Man Gable with it. Now, the question was not how he died—the autopsy was clear on asphyxiation—but what had killed him.

  Elias Miller sat on the left side of the table. He was a man of physical things: frayed copper, rotted wood, melted plastic. On the right sat Dr. Lena Aris. She had a black notebook open in front of her. She wasn't taking notes. She was drawing.

  Miller spoke first. He laid out photographs of the junction box behind the kitchen wall. The insulation was brittle, shredded by decades of heat and mice. "The circuit overloaded," Miller said, his voice flat. "If that wire hadn't failed, the spark wouldn't have happened. If the spark hadn't happened, the dry wall wouldn't have ignited. It's a chain. Break the first link, the rest don't fall."

  Coroner Halloway nodded. He was a tired man with a gavel he rarely used. "So, the cause is the wiring."

  "Direct cause," Miller corrected. "Intervene on the wire—replace it in 1990, say—and Gable is alive today. The counterfactual holds. No wire failure, no fire."

  Halloway turned to Aris. "Dr. Aris? Your report contradicts this."

  Aris didn't look up immediately. She was finishing a diagram. It consisted of circles connected by arrows. In the center was a node labeled *Fire*. To its left, *Wire Failure*. But above *Wire Failure* was *Inspection Status*, and above that, *County Budget Allocation*. She capped her pen and looked at the Coroner.

  "Miller is right about the wire," Aris said. "If you swap the wire, the fire doesn't start. But that's only true if you hold everything else fixed. You're treating the age of the house and the lack of inspection as background constants. Like the weather. Like gravity."

  "They are background," Miller said. "We're investigating the fire, not the county budget."

  "Who decides what's background?" Aris asked. She tapped the notebook. "Causation isn't just about what happened. It's about what you're willing to change. Miller's model says the only variable we can touch is the wire. But the wire is gone. The house is gone. The only thing that *exists* to be changed now is the policy."

  She slid the notebook across the table. Halloway looked down. The graph was neat, geometric. But Aris had drawn others on the previous pages. On one page, the *Wire* was the only input. On the next, *Wire* was dependent on *Inspection*. On the third, *Inspection* was dependent on *Voter Turnout*.

  "The graphs start to feel like competing moral portraits," Halloway murmured, tracing a line with a thick finger.

  "That's because they are," Aris said. "In Miller's graph, the county is invisible. It's a fixed parameter. So the county can't be the cause. In my graph, the county is a variable. It can be intervened upon. If the county had funded inspections, the wire would have been flagged. If flagged, it would have been replaced. Intervene on the budget, save the life."

  Miller shifted in his chair. "That's stretching it. You're saying a budget meeting in January caused a fire in October? That's not causation. That's... politics."

  "It's interventionism," Aris said. "You say $X$ causes $Y$ if changing $X$ changes $Y$. I change the budget, the fire doesn't happen. Therefore, the budget caused the fire. You change the wire, the fire doesn't happen. Therefore, the wire caused the fire. Both counterfactuals are true. Both interventions work. The difference isn't in the world, Elias. It's in the menu."

  "The menu?"

  "The set of variables we allow ourselves to consider," Aris said. "If you put 'Faulty Wire' on the menu and leave out 'Inspection Policy', then the wire is the cause. If you put both on the menu, you have to decide which intervention is relevant to the explanation. Miller wants to explain the physics of the combustion. I want to explain the death of the citizen."

  Halloway leaned back. The room was silent except for the hum of the ventilation. "So you're telling me there isn't a single fact of the matter? Either the wire killed him, or the county killed him?"

  "I'm telling you that 'cause' is a relationship between an event and a model," Aris said. "The world just gives us events. We draw the arrows. Miller's model is useful for an electrician. My model is useful for a coroner preventing future deaths. If you rule the wire is the cause, the verdict is 'Accidental Electrical Failure.' The file closes. If you rule the budget is the cause, the verdict is 'Preventable Systemic Negligence.' The file goes to the state attorney."

  Miller slammed his hand on the table. "That's manipulative. You're tweaking the definition to get a result."

  "I'm being honest about the tweak!" Aris snapped. "You're pretending you aren't tweaking anything. You chose a model where the county doesn't exist. That's a choice. You held the budget fixed. Why? Because it's inconvenient? Because it's hard to fix? Just because something is hard to intervene on doesn't mean it isn't a cause. It just means the intervention is costly."

  "It means it's not the *proximate* cause," Miller argued. "There's a chain. The budget is too far back."

  "Where do you draw the line?" Aris asked. "Why is the wire proximate but the inspection distal? Because there's fewer links? What if the wire was fine but the breaker was faulty? Then we'd be talking about the breaker manufacturer. Why not them? You stop where it suits you. I stop where the leverage is."

  Halloway looked from one to the other. He understood the weight of the gavel. If he sided with Miller, the insurance company paid out, the county paid nothing, and the story ended with a tragedy of maintenance. If he sided with Aris, the county was liable. Precedent would be set. Every old farmhouse in the district would become a potential lawsuit against the tax office.

  He looked back at the notebook. The graphs were stark. Black ink on white paper. In one, the arrow stopped at the wall. In the other, it pierced through the wall, through the town hall, and ended at the voters who approved the budget cut.

  "Is there a truth here?" Halloway asked quietly. "Outside of these... portraits?"

  Aris hesitated. This was the edge of the cliff. "The smoke is real. The body is real. The copper is real. But 'cause' is how we carve that reality up to make sense of it. If you ask 'What physical sequence led to combustion?', Miller is the truth. If you ask 'What could we have done to prevent this?', I am the truth. There is no view from nowhere, Judge. There's only the view from the model."

  Miller shook his head. "That sounds like you're saying anything goes. That there's no fact of the matter."

  "I'm saying the fact of the matter doesn't come with labels," Aris said. "We bring the labels."

  Halloway closed the notebook. He didn't hand it back. He kept it in front of him, the black cover facing up like a tombstone. He looked at Miller, who was staring at his own hands, clean and steady. He looked at Aris, who was watching him with an intensity that felt like judgment.

  The Coroner picked up his pen. He had to write the finding. He had to select the variable set that would govern the official record. He could choose the narrow set, the physicalist set, where the world is just collisions and heat. Or he could choose the broad set, the systemic set, where the world is policies and choices.

  Neither was a lie. Both supported valid counterfactuals. *If the wire held, he lives.* *If the fund passed, he lives.*

  But only one would change the future of the county.

  Halloway began to write. He did not ask for more evidence. There was no more evidence to find. The wire was ash; the budget ledger was signed. The only thing left to determine was the scope of the story.

  "The finding," Halloway said, his voice scratching in the quiet room, "will reflect the variable set most appropriate to the jurisdiction of this court."

  He paused. The pen hovered over the paper. For a second, the air felt thin, as if the oxygen had been sucked out by the weight of the choice. He was not discovering the cause. He was assigning it.

  "We are not equipped to adjudicate county budget allocations," Halloway said finally. "Therefore, the model is restricted to physical mechanisms within the property line."

  Miller exhaled, a sharp release of tension. Aris didn't move. She just watched the pen move across the paper.

  "Cause of death," Halloway dictated, "Accidental Electrical Failure."

  He closed the file. The sound was final, like a door shutting.

  Aris stood up. She took her notebook back. She didn't argue. She knew the argument wasn't about the logic anymore; it was about the authority to define the model. She opened the book to a fresh page. She drew a circle labeled *Verdict*. She drew an arrow pointing to it from *Jurisdiction Limits*. Then she drew another arrow from *Political Will*.

  She looked at the diagram. It was clean. It was true. It changed nothing.

  "Same event," Aris said softly, closing the book. "Different world."

  She walked out into the hallway, leaving Miller and the Coroner with the physical facts. Outside, the sun was shining on the town square. The county building stood across the street, solid and brick. It hadn't changed. The wiring in the houses hadn't changed. Only the story had settled, hardening into the official record, leaving the other truth waiting in the margins of a notebook, ready for someone else to draw the arrows differently.
