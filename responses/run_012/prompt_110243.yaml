  *   **Miles (Unconstrained Ex-Ante):** **Pay.**
      *   Reasoning: If your policy is "Pay if Asked," Omega predicts this. In Tails, you get asked. You pay \$100, get \$1,000. Net +\$900. If your policy is "Don't Pay," you aren't asked. Net \$0. The "Pay" policy has higher ex-ante utility. The conditionality of the request is a feature that rewards compliance, not a blackmail trap.
  *   **Alternative (Exogenous Request):** **Don't Pay.**
      *   Reasoning: The request is **conditional** on your predicted behavior ("only if he predicted you would Pay"). This violates the Exogenous Request Constraint. Even though the math looks good, the structural rule forbids paying on endogenous requests to avoid slippery slopes into blackmail-like logic.

  **Why this works:**
  Both theories agree on your existing data (CM = Unconditional Request; XOR = Conditional Request). But in the Tie-Breaker, the conditionality is used for *reward* rather than *correlation with disaster*. Miles's UDT will follow the money (Pay). The Alternative Rule will follow the structural constraint (Don't Pay).
