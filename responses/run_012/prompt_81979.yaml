answer: |-
  You have identified a genuine gap in the terminology, not in the phenomenon. The loop you describe—where opacity functions as a commitment device, where inexplicability validates truth-claims, and where rationalization triggers collapse—is a recognized dynamic in the cognitive and evolutionary study of religion, but it is currently fragmented across three or four different concepts rather than housed under a single label.

  There is no single canonical term for the *cycle* itself. However, the *components* of your loop are well-mapped. To carve this out properly, we need to assemble the existing pieces to show where they overlap and where your description adds necessary precision.

  ### 1. The Components (The Existing Carving)

  **A. Causal Opacity (Cognitive Science of Religion)**
  This is the standard term for the feature you describe: actions whose means-end relationships are not transparent. Cristine Legare, Paul Harris, and others have shown that children and adults imitate *causally opaque* actions with higher fidelity than transparent ones. This is often called **"over-imitation."**
  *   *Where it fits:* It explains the transmission durability (the "fast does not change").
  *   *Where it falls short:* It explains *how* the practice is copied, but not necessarily *why* the opacity generates theological warrant or group cohesion. It treats opacity as a transmission bug/feature, not necessarily a belief-generator.

  **B. Canonical Invariance (Roy Rappaport)**
  In *Ritual and Religion in the Making of Humanity*, anthropologist Roy Rappaport distinguishes between **indexical messages** (changeable, contextual, e.g., sermons) and **canonical messages** (invariant, opaque, e.g., the liturgy or the fast). He argues that the *invariance* itself is what encodes the "ultimate" or sacred truths. Because the form cannot change, it is perceived as not originating from human whim.
  *   *Where it fits:* This captures your observation that "sermons change, the fast does not," and that the invariant element shores up the belief.
  *   *Where it falls short:* Rappaport is an anthropologist, not an evolutionary cognitive scientist. He describes the *structure* of the truth-claim, but not the *evolutionary mechanism* of why this structure outcompetes rationalized versions.

  **C. The Ritual Stance (Boyer & Liénard)**
  Pascal Boyer and Pierre Liénard propose that humans possess a specialized cognitive system for ritual (the "ritual stance") triggered by hazard-precaution systems. This stance *demands* rigidity and opacity. When the ritual stance is active, the brain expects actions to be causally opaque and rigid.
  *   *Where it fits:* This explains the **reform failure**. If a reformer explains the practice (making it transparent) or makes it optional (negotiable), they deactivate the *ritual stance* and switch the brain to the *instrumental stance*. The practice then becomes a mere tool, evaluated by cost-benefit analysis, and usually discarded.
  *   *Where it falls short:* It focuses on individual cognition rather than the group-level feedback loop of belief validation.

  **D. Sacred Values (Tetlock & Baron)**
  In moral psychology, "sacred values" are those protected from trade-offs. Attempting to rationalize a sacred value (putting a price on it, or explaining it in utilitarian terms) triggers "moral outrage" and often causes the collapse of the agreement.
  *   *Where it fits:* This explains the community split when a reformer tries to make the practice "sensible."
  *   *Where it falls short:* It doesn't explicitly require *opacity*, just non-tradability.

  ### 2. The Missing Synthesis: "Functional Causal Opacity"

  Your description adds a specific causal link that is often implied but rarely centered: **Opacity as Epistemic Warrant.**
  You are arguing that the lack of explanation is *evidence* of the supernatural (or the deep cultural real). "We wouldn't do this for no reason; therefore, the reason must be beyond us."

  In the literature, this is closest to a specific refinement of **Credibility-Enhancing Displays (CREDs)**. Joseph Henrich's CRED theory argues that costly actions teach observers what the model *actually* believes. However, standard CRED theory doesn't emphasize that *opacity* makes the CRED stronger.
  Some evolutionary theorists (e.g., Richard Sosis) have noted that **opaque costly signals** are harder to fake than transparent ones. If the reason for a fast is "health," I can fast only when I'm sick. If the reason is "God commanded it (via an opaque tradition)," I must fast always. The opacity prevents "gaming" the signal.

  **The Verdict on a Name:**
  There is no single noun phrase for this loop. If you need a label for your reporting, the most accurate existing phrase is **"The Epistemic Function of Causal Opacity."**
  However, if you are permitted to coin a descriptive term for the *loop*, you might call it **"The Opacity-Fidelity Loop"** or **"Canonical Opacity."**

  ### 3. Addressing Your Specific Questions

  **Is the opacity genuinely functional or just residue?**
  It is **functional**. While it may originate as transmission residue (forgetting the original reason), evolutionary models suggest it is *retained* because it solves the "free-rider" and "commitment" problems.
  *   *Residue:* We forgot why we do it.
  *   *Function:* Because we forgot why, we can't negotiate when to stop. This makes the signal of commitment more honest.
  *   *Evidence:* Communities that successfully rationalize their rituals often see a drop in long-term cohesion (the "liberal religion" problem in sociology). The opacity acts as a **cognitive lock-in**.

  **Is this special to religion?**
  No. It shows up wherever **group commitment** must be distinguished from **individual preference**.
  *   *Military:* Saluting, marching, dress uniforms. These are causally opaque (why this specific angle of the hand?) and costly (time, discomfort). Rationalizing them ("it's about discipline") often leads to erosion of tradition and morale. The opacity signals submission to the institution, not agreement with a specific tactic.
  *   *Law:* Legal formalities (standing when the judge enters, specific phrasing). If a judge says, "Oh, you don't need to stand, it's just superstition," the authority of the court diminishes. The form *is* the authority.
  *   *Academia:* Peer review rituals, citation formats, tenure processes. Much of this is opaque and costly. Reforms that try to "streamline" tenure often fracture departments because the *difficulty* was the signal of quality.

  **Where does your description overshoot or undershoot?**
  *   *Overshoot:* You suggest the opacity *creates* the belief ("taken as evidence that something real must lie behind it"). In cognitive science, it's slightly more subtle: Opacity prevents the *disconfirmation* of belief. If the reason is "health," a failed harvest proves the fast didn't work. If the reason is opaque/sacred, the failed harvest is a test of faith. Opacity protects the belief from falsification, rather than actively generating it.
  *   *Undershoot:* You focus on the *practice* feeding the *belief*. The loop also works the other way: The *belief* (that this is sacred) protects the *practice* from rationalization. It is a **mutual defense pact** between dogma and ritual.

  ### 4. A Proposed Definition for Your Use

  Since you are writing for a general audience and need to "carve" this phenomenon, I recommend defining it as **"Canonical Opacity"** (borrowing Rappaport's "Canonical" and CSR's "Opacity").

  **Definition:**
  > **Canonical Opacity:** A socio-cognitive mechanism wherein the inexplicability and rigidity of a practice function as a commitment device. By rendering a ritual causally opaque (hard to explain) and canonically invariant (hard to change), a group prevents members from negotiating the cost of participation based on individual utility. The opacity signals that the practice serves a high-order value (sacred, institutional, or tribal) rather than a pragmatic one. Attempts to rationalize or transparentize the practice typically degrade group cohesion, as the removal of opacity converts a **sacred value** into a **secular preference**, allowing members to opt out when costs rise.

  **Why this works for your reporting:**
  1.  It distinguishes the *practice* (opaque) from the *doctrine* (transparent/changeable).
  2.  It explains the *reform failure* (converting sacred values to secular preferences).
  3.  It applies to both religion and secular institutions (military, law).
  4.  It acknowledges the function (commitment device) without requiring the reporter to take a stance on whether the god is real.

  ### Summary
  You have not missed a term; you have identified a synthesis. The field has **"Causal Opacity"** (the feature), **"The Ritual Stance"** (the cognitive mode), and **"Sacred Values"** (the resistance to trade-off). Your contribution is linking them into a **functional loop** where opacity sustains fidelity. In your writing, you can accurately describe this as the **functional role of causal opacity in maintaining sacred values**, or simply coin **"Canonical Opacity"** to capture the specific durability of the inexplicable.
