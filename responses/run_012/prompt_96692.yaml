answer: |-
  ### Practice Exam Question: The Dichotomy of Control

  **Question 1**
  Consider Elena, a hostage negotiator. Through her dialogue, she influences the captor's decision to release the victim (Causal Power), yet she could not have ensured this outcome regardless of her skill, as the captor retained the ability to shoot (No Guarantee). Whether the release counts as *her* achievement or merely an event that occurred *through* her remains ambiguous (Attribution).

  Using this case, distinguish between the three competing readings of control: (1) Control as Causal Power, (2) Control as Guarantee, and (3) Control as Attribution. Which of these readings accurately captures the Stoic doctrine of *eph' hēmin* (what is up to us)? Furthermore, evaluate the modern self-help revival of Stoicism: which reading does it implicitly rely upon to promise efficacy, and does the dichotomy of control remain philosophically coherent if detached from the Stoic axiological claim that only virtue is good?

  ***

  ### Model Answer

  The case of Elena the negotiator exposes the fault lines in how we conceptualize agency. In her scenario, the three readings of control diverge sharply. Under **Control as Causal Power**, the release is up to Elena because her specific actions made a difference to the outcome; without her dialogue, the victim dies. Under **Control as Guarantee**, however, the release is *not* up to her, because an external variable (the captor's whim) could have thwarted her efforts regardless of her performance. Finally, **Control as Attribution** asks whether the release is properly credited to her agency or merely to luck acting through her; this reading sits uneasily between the first two, as we attribute success to her skill but acknowledge the contingency.

  The Stoic doctrine of *eph' hēmin* aligns strictly with **Control as Guarantee**, but with a crucial restriction: it applies only to the internal state of the *prohairesis* (moral choice), not external outcomes like the hostage's release. For Epictetus, if an external event can be blocked, it is not up to us. Therefore, the hostage's safety is a "preferred indifferent," not something in Elena's control. What is up to her is solely her attempt to negotiate virtuously. This aligns with **Control as Attribution** only insofar as the moral quality of the attempt is attributed to her, while the physical outcome is attributed to fate. The Stoic rejects **Control as Causal Power** as a definition of freedom, because relying on causal influence over externals enslaves the agent to fortune.

  The modern self-help revival, however, implicitly relies on **Control as Causal Power**. Authors like Stephen Covey or Ryan Holiday often present the dichotomy not as a limit on desire, but as a productivity hack: focus on what you can influence to maximize successful outcomes. They suggest that by ignoring the uncontrollable, we become more effective at securing the controllable. This is a category error. It treats the dichotomy as a method for managing anxiety to achieve preferred indifferents (safety, success, reputation) rather than a method for aligning the will with nature.

  This leads to the final issue: coherence without virtue. The Stoic dichotomy collapses if detached from the claim that **only virtue is good**. If external outcomes (like the hostage living) are considered "good," then the lack of Control as Guarantee over them becomes a tragedy, not a matter of indifference. The modern appropriation often retains the discipline of desire (don't worry about what you can't control) but discards the axiology (virtue is the only good). The result is a technique for getting what you want rather than a transformation of what you want. Without the axiological claim, the dichotomy becomes instrumental: I limit my concern to what I control *in order to* secure the outcome. But since I cannot guarantee the outcome (as Elena's case shows), this instrumentalism leads to the very frustration Stoicism promises to cure. The ancient doctrine survives only if the "good" is relocated entirely to the internal guarantee of moral choice; otherwise, it degrades into a fragile strategy for manipulating a world that remains fundamentally unguaranteed.

  ***

  ### Marking Scheme (Total: 20 Marks)

  | Criteria | Marks | A-Grade Move (Distinction) | B-Grade Move (Competent) | Common Error (How students lose marks) |
  | :--- | :---: | :--- | :--- | :--- |
  | **Application of Case** | **6** | Clearly maps Elena's scenario onto all three definitions, showing exactly where they diverge (e.g., noting Causal Power says "yes," Guarantee says "no"). | Describes the three definitions and mentions Elena, but fails to show the specific tension/divergence in her case. | Treating the definitions as synonyms or failing to apply the "Guarantee" test to the hostage outcome specifically. |
  | **Stoic Identification** | **4** | Identifies "Control as Guarantee" as the Stoic view *restricted to internal choice*, explicitly rejecting Causal Power for externals. | Identifies "Control as Guarantee" as the Stoic view but implies it might apply to external actions or fails to restrict it to *prohairesis*. | Claiming Stoics believe we have causal power over outcomes, or that "Attribution" is the primary Stoic definition. |
  | **Modern Reception** | **4** | Identifies that Self-Help relies on "Causal Power" to promise efficacy/outcomes, contrasting this with the Stoic aim of tranquility. | Notes that Self-Help uses Stoicism but fails to identify which specific definition of control underpins the modern distortion. | Arguing that modern self-help accurately represents the ancient doctrine, or focusing on tone rather than conceptual definitions. |
  | **Virtue & Coherence** | **6** | Argues that without "only virtue is good," the dichotomy becomes an instrumental technique for securing indifferents, which inevitably fails. | States that virtue is important but fails to explain *why* the doctrine collapses instrumentally without the axiological claim. | Claiming the doctrine works fine without virtue ethics, or treating the "good" as a separate topic unrelated to the definition of control. |

  **Total: 20 Marks**

  **Examiner's Note on Grading:**
  *   **17-20 (A):** Seamless integration of the case study with the axiological critique; precise terminology (*prohairesis*, indifferents).
  *   **14-16 (B):** Correctly identifies the definitions and the Stoic position but treats the "virtue" component as an add-on rather than a structural necessity for the dichotomy.
  *   **10-13 (C):** Accurate description of the three definitions but struggles to apply them to the case or the modern reception context.
  *   **<10 (Fail):** Confuses the definitions, relies on Serenity Prayer paraphrasing, or misses the prompt's requirement to analyze the "virtue" condition.
