answer: |-
  You have spotted a genuine philosophical fault line that runs right through the middle of restoration ecology. Your confusion isn't a result of your friend's sloppiness; it is a result of the field itself operating with two incompatible definitions of "function" simultaneously.

  In philosophy of biology, these are formally known as the **Selected Effect (SE)** account and the **Causal Role (CR)** account. Restoration ecology pragmatically smuggles both in, usually without admitting the tension.

  Here is the breakdown of how these definitions work, where your friends are using them, and what would break if they had to choose one.

  ### 1. The Two Accounts of Function

  **The Selected Effect (SE) Account: "What it was made for"**
  *   **Definition:** A trait's function is the effect for which it was naturally selected. It is historical and evolutionary.
  *   **Example:** The function of the heart is to pump blood, because ancestors with pumping hearts survived. It is *not* to make a thumping sound, even though it causally does that.
  *   **In Restoration:** This aligns with **historical fidelity**. A native plant has a function because it co-evolved with the local insects and soil. An extinct megafauna had a function because the landscape evolved around its specific grazing pressure.

  **The Causal Role (CR) Account: "What it does now"**
  *   **Definition:** A trait's function is any causal contribution it makes to the capacity of the containing system. It is ahistorical and systemic.
  *   **Example:** The heart functions to pump blood, but it also functions to fill space in the chest cavity or produce sound for a stethoscope, depending on how you analyze the system.
  *   **In Restoration:** This aligns with **process-based management**. It doesn't matter if the horse is the ancestral species; if it eats grass and prevents scrub encroachment, it is fulfilling the *grazing function*.

  ### 2. Mapping Your Observations

  Your friends are switching between these accounts depending on whether they are talking about **goals** or **tools**.

  *   **The Proxy Horse (Rewilding):** This is purely **Causal Role**. They admit the animal is not the ancestral species (SE is broken), but they argue it can perform the same systemic job (CR is intact). They are prioritizing the *process* (grazing) over the *agent* (the specific horse species).
  *   **The "Functionally Extinct" Beetle:** This is a hybrid, but leans **Causal Role**. Technically, "functional extinction" means the population is so low it no longer meaningfully interacts with the ecosystem. The beetles exist (biological life), but their causal impact on the system (pollination, decomposition) is negligible. However, the implication that they *lost* a job suggests a historical expectation (SE).
  *   **The "Functionless" Native Plant:** This is the most problematic usage and likely where your frustration peaks. Calling a native plant "functionless" because nothing eats it is scientifically incoherent under *both* definitions.
      *   **SE:** It survived selection, so it has a function.
      *   **CR:** It stabilizes soil, cycles nutrients, and sequesters carbon.
      *   **What they actually mean:** They are using a colloquial shorthand for "trophically isolated." They value the plant only insofar as it supports the food web (specifically herbivory). This reveals a bias: they view the ecosystem primarily as a machine for supporting visible wildlife, not as a biogeochemical system.

  ### 3. Does Restoration Presuppose One Account?

  Restoration ecology does not presuppose one; it presupposes a **pragmatic pluralism**. It is an engineering discipline disguised as a conservation one.

  *   **It uses SE to set the Goal:** The "Reference Model" (what the land looked like in 1800 or 10,000 years ago) is almost always based on Selected Effect thinking. We want *native* species because they belong here historically.
  *   **It uses CR to do the Work:** Once the goal is set, they use whatever works. If a non-native worm aerates the soil like a native one did, they accept the worm. If a proxy horse grazes like an extinct one, they accept the horse.

  **The Conflict:**
  The conflict arises in **Novel Ecosystems**. If climate change makes the historical reference model impossible (the ancestral species can't survive the new heat), do you:
  1.  Stick to **SE**: Let the species die out because the "historical function" can't be maintained?
  2.  Stick to **CR**: Introduce a heat-tolerant relative to maintain the "systemic function" (grazing/seed dispersal)?

  Your friends are clearly in Camp 2 (CR) regarding the horse, but Camp 1 (SE) regarding the "functionless" native plant (implying natives *should* have a role by default). This is the inconsistency.

  ### 4. What If They Had to Commit?

  If your friends' land trust were forced to choose one philosophical account, their practice would change drastically.

  **Scenario A: Committing to Selected Effect (History/Evolution)**
  *   **Stop:** They would have to stop the rewilding project. You cannot restore an ancestral function with a non-ancestral agent. A proxy horse is an imposter, not a restoration.
  *   **Stop:** They could not call the plant "functionless." If it is native, it has an evolutionary history here. Its function is to be itself.
  *   **Start:** They would have to focus entirely on preserving genetic lineages, even if those lineages no longer play a major role in the current landscape dynamics.
  *   **Result:** Conservation becomes a museum curation project.

  **Scenario B: Committing to Causal Role (System/Process)**
  *   **Stop:** They would have to stop caring so much about "nativity." If an invasive tree stabilizes the soil better than the native one, it has high function.
  *   **Stop:** They could never call a native plant "functionless." If it exists in the system, it is doing *something* (shading, rooting, decaying). If they don't like what it's doing, they should call it "dysfunctional for our goals," not functionless.
  *   **Start:** They would evaluate species strictly on metrics: biomass production, nutrient cycling, water retention.
  *   **Result:** Conservation becomes ecosystem engineering. "Native" becomes a heuristic for "usually works well here," not a moral imperative.

  ### 5. Recommendation

  They do not need to pick one, but they do need to **disambiguate**. The friction you are feeling is the result of them using "function" as a slur for "value."

  When they say the plant is "functionless," challenge that gently. Ask: *"Do you mean it has no trophic value for the grazers, or that it contributes nothing to the system?"*

  If they mean the former, they should say "It's not currently integrated into the food web." If they mean the latter, they are wrong.

  **The Verdict:**
  Restoration ecology works best when it treats **Selected Effect as the North Star** (the vision of what a healthy, co-evolved system looks like) but uses **Causal Role as the Compass** (navigating the actual mechanics of getting there with the tools available).

  Your friends are allowed to use both, provided they admit that the proxy horse is a *functional substitute* (CR), not a *historical restoration* (SE). The moment they claim the proxy horse is "restoring the past" rather than "maintaining the process," they are lying to themselves. The "functionless" plant comment, however, is just bad ecology; even a plant that nothing eats functions as a physical structure in the environment. They should stop saying that.
