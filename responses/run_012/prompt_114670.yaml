      *   **P6 (Realism/Fallibilism):** There is a fact of the matter about correct policy, but legitimate decisions can be wrong.
      *   **P7 (Incoherent Electorate):** Ordinary voters' judgments aren't ideologically constrained; votes won't naturally compose into coherence.

  2.  **Analyze Pairwise Conflicts:**

