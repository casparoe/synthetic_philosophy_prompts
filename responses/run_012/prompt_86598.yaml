answer: |-
  **Brainstorming Page: Candidate Openings**

  1.  **"Welcome to the United States."**
      *   *Verdict:* Dead end. It assumes the state is a finished object that exists prior to the people. It ignores the boundary problem; the "United States" is being reconstituted by this gathering, not just entered.

  2.  **"You have completed a long journey."**
      *   *Verdict:* Dead end. Banned word ("journey"). Also implies a linear progression that simplifies the messy reality of migration and settlement.

  3.  **"We are proud to accept you as members."**
      *   *Verdict:* Dead end. Violates the philosophical constraint. The "we" does not exist prior to this act to do the accepting. It implies a static community absorbing new elements.

  4.  **"Look at the stack of certificates on the table."**
      *   *Verdict:* Viable. Concrete detail. Grounds the abstract legal change in physical paper. Allows me to talk about what the paper *does* rather than what it *is*.

  5.  **"Most of us in this room are here by accident."**
      *   *Verdict:* Risky. Philosophically accurate regarding inheritance, but potentially alienating to families who want to feel pride in their belonging. Needs significant softening to be warm.

  6.  **"Today you gain a voice."**
      *   *Verdict:* Dead end. Ignores the fact that they were subject to coercive rules before today. It suggests they were previously unaffected, which is false.

  7.  **"This ceremony changes the law."**
      *   *Verdict:* Dead end. Too technical. Cold. Does not move the families.

  8.  **"You chose to be here."**
      *   *Verdict:* Dead end. True for the candidates, but false for the natives. Creates a dichotomy that undermines the shared space we are trying to build.

  9.  **"The light coming through the windows finds us all."**
      *   *Verdict:* Viable. Concrete detail. Implies a shared physical space without implying a shared moral history. Warm but philosophically neutral.

  10. **"I stand here as a neighbor."**
      *   *Verdict:* Viable. Relational rather than proprietary. Avoids claiming ownership of the space. Sets a tone of proximity rather than hierarchy.

  ***

  **Welcome Address**

  Good morning. Please look at the light coming through the high windows behind the judge. It falls on the candidates in the front row. It falls on the families in the back. It falls on me. For this hour, that light treats us exactly the same.

  I am here to welcome you. But I need to be careful with my words. Usually, when we welcome someone, it is into a house that already stands. We say, "Come in, the table is set." But this room is not a house that was finished before you arrived. The walls are made of laws, and those laws change shape when you walk through them.

  Most of the people born here did not choose this place. We arrived by accident of birth. We inherited the rules. We inherited the boundaries. We grew up subject to decisions made by people we never met. We did not earn this spot. We simply occupy it.

  You are different. You chose to be here. You lived under these rules before you could vote on them. You paid taxes. You obeyed laws. You were subject to the state long before you were members of it. That is a heavy thing to carry. It is rare for a person to choose the authority that governs them. Today fixes that mismatch.

  But I cannot say "we welcome you" without hiding a difficulty. Who is the "we"? If I say it, I pretend that the people born here are a finished group. I pretend that our community existed fully before you arrived. That is not true. When you join, you change us. You change what "we" means. You change the stories we tell about ourselves. The boundary moves.

  So I will not say we are accepting you into a club that already exists. I will say we are gathering to become a community that includes you. The words you are about to speak do not just describe a change. They make it happen. When you say the oath, you are not just promising to follow rules. You are helping to build the group that makes the rules.

  This is fragile. Words alone cannot fix everything. There will be days when you feel outside the boundary again. There will be days when the light in this room feels far away. That is honest. The work of belonging does not end when the judge bangs the gavel.

  But look at the stack of certificates on the clerk's desk. They are waiting for your names. They are blank until you speak. In a few minutes, you will say the words. The judge will sign the paper. The law will recognize you. And those of us who were born here will have to learn to live in a country that includes you as equals.

  That is the gift you give us. You make us choose this place again. You force us to stop inheriting our citizenship silently and start acting like it matters.

  So I welcome you not as a host, but as a fellow occupant. We share this space. We share this light. We share the burden of making it work. Please stand. Let us begin.

  ***

  **Closing Note**

  The single most important sentence the address was unable to say is: "We are happy to welcome you into our community." To say this would have been a lie. It implies a pre-existing "we" that remains unchanged by your arrival. It suggests the community is a static container rather than a dynamic relationship. Saying it would have secured warmth by sacrificing truth. It would have comforted the families by denying the structural shift occurring in the room. I chose to risk coldness to honor the fact that you are not joining us; you are remaking us.
