  This is a classic personal identity puzzle, and your friend's verdicts are surprisingly consistent. She has carved out a specific niche that accepts psychological continuity but rejects the logical contradictions of branching identity.

  Here are the two candidate rules that fit her track record, their predictions for the lopsided case, my assessment of which one she's actually using, and the ultimate discriminating case.

  ### The Two Candidate Rules

  **Rule 1: The Strict Non-Branching Constraint**
  *   **The Logic:** Personal identity is a one-to-one relation. You survive if and only if there is **exactly one** future person who is psychologically continuous with you. If there are zero, you die. If there are two or more, the relation "breaks" for *all* of them, regardless of how "good" the match is.
  *   **How it fits her data:**
      *   *Teleporter/Transplant/Replacement/Coma:* Only one successor exists. (Survival)
      *   *Backup:* The Original is the spatiotemporally continuous stream (the "trunk"). The Copy is a new branch. The rule applies to the Copy (there are now two people continuous with the 30-year-old), so the Copy is not her. The Original survives because *she* didn't branch; she just acquired a duplicate.
      *   *Fission (Even):* The original stream ceases and branches into two. Since there is not *exactly one* successor, identity fails for both.

  **Rule 2: The Closest Continuer Theory (Nozickian)**
  *   **The Logic:** Identity tracks the **best available candidate**. You survive in the future person who is the *closest* psychological/physical match to you. If there is a clear winner, you survive. If there is a tie (or near-tie) between competitors, the competition cancels out identity, and you die.
  *   **How it fits her data:**
      *   *Teleporter/Transplant/etc.:* Only one candidate exists, so they win by default. (Survival)
      *   *Backup:* The Original is a "closer" match (spatiotemporal continuity + psychology) than the Copy (psychology only). Original wins, Copy loses.
      *   *Fission (Even):* Two candidates exist with equal closeness. It's a tie. Ties result in death. (No Survival)

  ### Predictions for the Lopsided Case (80% / 20% Split)

  *   **Rule 1 (Strict Non-Branching) predicts: DEATH.**
      *   It doesn't matter that one is "more" her than the other. The moment a second conscious successor exists, the one-to-one relation is violated. Both are new people who *think* they are her, but neither *is* her.
  *   **Rule 2 (Closest Continuer) predicts: SURVIVAL (in the 80% body).**
      *   The 80% body is a "closer" match than the 20% body. There is no tie. The 80% body wins the competition for identity. The 20% body is merely a copy.

  ### Which Rule Is She Running?

  I am confident she is running **Rule 1: The Strict Non-Branching Constraint.**

  **Why?**
  1.  **The Nature of "Firm Verdicts":** People who adopt the Closest Continuer view often introduce vagueness ("How much closer does the 80% need to be?"). People with *incredibly firm* verdicts on identity usually treat it as a logical property, not a gradient. "I am one person" is a hard constraint for them.
  2.  **The Backup Asymmetry:** In the Backup case, she says the Copy is *not* her. A Closest Continuer theorist might struggle here because the Copy is psychologically identical. She dismisses the Copy easily because the Original *exists*. This suggests she views the Original's survival as the default state of the "stream," and the Copy as a branching error. In Fission, the stream ends. If the stream ends and branches, the logic of the Backup case (Branch = Not Her) should apply to *both* branches.
  3.  **Rationalist Context:** A decade of LessWrong exposure usually hardens people into "Identity is a logical relation" (Non-Branching) or "Identity doesn't exist" (Parfitian/Eliminativist). Since she is not a Parfitian and gives real Yes/No answers, she is likely defending the logical consistency of Identity against the Fission paradox. The only way to save logical transitivity (If A=B and A=C, then B=C) when B≠C is to say A=B and A=C are both false. This holds true for lopsided splits just as much as even ones.

  **My Prediction:** She will say **neither one is her.** She does not survive.

  ### The Best Discriminating Case

  While the Lopsided Fission case is good, it relies on quantifying "closeness" (is 80% enough to break a tie?), which can get muddy. The cleanest case to separate these rules is **Sequential Fission (The "Survivor" Case).**

  **The Setup:**
  The fission procedure happens exactly as before. Her brain is split, placed into two bodies, and both wake up simultaneously. Both remember her life. However, **five minutes after waking, the 20% body suffers a fatal aneurysm and dies.** The 80% body continues to live a normal life.

  **The Question:** Is the 80% body her?

  *   **Rule 1 (Strict Non-Branching) says: NO.**
      *   At the moment of fission (T1), two successors existed. The identity relation was broken instantly. The subsequent death of one branch does not retroactively repair the identity of the other. The 80% body is a new person who inherited her memories.
  *   **Rule 2 (Closest Continuer) says: YES.**
      *   Identity is evaluated based on the *current* best candidate. At the time of evaluation (T2), there is only one living continuer. He is the unique closest match. Therefore, she survives in him.

  **Why this is the tell:**
  This case removes the ambiguity of "how much brain matter is enough." It isolates the variable of **time**. Does the *existence* of a competitor at *any* point kill identity (Non-Branching), or does identity flow to the sole survivor once the competition is removed (Closest Continuer)?

  If she says the 80% guy is still *not* her because "there was a moment where there were two," you have confirmed she is a Strict Non-Branching theorist. If she says "Well, now there's only one, so yes," she's a Closest Continuer theorist.
