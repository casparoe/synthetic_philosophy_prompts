  - 10-year coma, then full recovery: still her.
  - Backup: a scan of her brain taken when she was 30, instantiated when she's 60, while the original is still alive and healthy and living her life. She says the instantiated person is NOT her. It's a copy of her 30-year-old self, nothing more.
  - Fission, even split: her brain divided in two, each half dropped into a fresh body, both wake up. She says neither one is her and she doesn't survive it at all.

