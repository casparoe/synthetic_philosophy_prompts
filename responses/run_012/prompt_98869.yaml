      *   **Noise vs. Signal:** The core empirical question is whether the drop from 70% to 40% is *information* (new evidence surfacing) or *distortion* (cognitive impairment due to stress/fatigue).
      *   **The "Real Self":** The sister's claim relies on a romantic/essentialist view of intuition (the "gut" under pressure reveals truth). The user's view relies on a cognitive/reflective equilibrium view (calm reflection reveals truth).
