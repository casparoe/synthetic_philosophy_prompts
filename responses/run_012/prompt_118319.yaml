  Sir Physician, you have a sharp tongue, sharpened on Italian knives. You strike hard, but I fear you strike a shadow. You say the rays meet the earth? Yes, as rain meets the roof, but who lies within the house? The soul, sir! The geometry is universal, true, but the *reception* is particular. One man's soul resonates with the triangle, another sleeps through the thunder.

  And as for my foolish daughter... (the phrase is mine). You think because I take her earnings I deny her mother's truth? I am a poor man. War eats coin like locusts. If I cast a nativity for a general, it is to keep the lamp lit while I measure the orbits. Is the bread false because the baker is hungry? I do not tell the mother her son lives by the stars alone, but by God's will *through* the stars. There is a signal in the light, not a command. You say I practise fraud upon myself? No, I practise patience upon the world. I take their gold to buy silence for my truths. But tell me, Doctor: when you bleed a patient, do you know the humour, or only guess the heat?
