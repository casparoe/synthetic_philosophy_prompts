answer: |-
  Poincaré holds **Reading 2**: there is no fact of the matter about which geometry is true; the question is a pseudo-question, and geometry is a convention.

  While the thought experiment mechanically demonstrates **Reading 3** (underdetermination), Poincaré does not remain neutral on the ontology. He uses the underdetermination to argue that the concept of "true geometry" is meaningless. For Poincaré, if two theoretical frameworks (Euclidean geometry + universal deforming forces vs. Non-Euclidean geometry + rigid bodies) are empirically equivalent, there is no hidden reality to adjudicate between them. Space is not an independent substance we measure; it is a system of relations defined by the conventions we adopt to describe the behavior of bodies. Therefore, the Sphere World argument is not merely saying "we can't know which is true" (Reading 1) or "we can't decide so we pick the convenient one" (Reading 3); it is saying "the distinction between true and false does not apply to geometry itself" (Reading 2).

  The point about the inhabitants noticing nothing odd is crucial for blocking the intuition that Euclidean geometry is *a priori* or naturally privileged. If the inhabitants measured triangles and found angles summing to less than 180 degrees, they would not conclude "our rods are shrinking" (which would preserve Euclidean geometry); they would conclude "space is hyperbolic." Why? Because in their world, the "rigid body" is *defined* by the local physical laws. A rod that shrinks when moved is not considered "rigid" in our world, but in the Sphere World, if *all* matter shrinks according to the same law, that shrinking is the standard of rigidity. By showing that the inhabitants can construct a coherent, consistent physics where their measurements are "normal," Poincaré demonstrates that "straight line" and "rigid body" are defined internally by the system of physics and geometry together. This destroys the idea that we have an intuitive or empirical grip on "true" straightness that the inhabitants lack. It establishes a symmetry between our position and theirs: we are just as dependent on our conventions as they are on theirs.

  The argument relies on the **key move** that experiments do not test geometry in isolation, but rather the conjunction of geometry and physical laws (specifically the laws governing measurement tools). Since one can always preserve a preferred geometry by positing compensating physical forces (like the thermal contraction in the sphere), no experiment can isolate the geometry of space itself. Poincaré takes this to mean that space has no independent geometric structure to be discovered.

  A careful reader is most likely to slip into **Reading 3**. This is because the thought experiment explicitly demonstrates underdetermination, and modern philosophy of science often treats underdetermination as compatible with realism (i.e., "we can't know, but one might still be true"). Poincaré, however, operates with a verificationist-leaning criterion of meaning: if no experiment can distinguish two hypotheses, they are not distinct hypotheses about reality, but merely different languages for describing the same reality. Missing this semantic leap leads one to think Poincaré is merely a pragmatist about theory choice (Reading 3) rather than a conventionalist about geometric truth (Reading 2).

