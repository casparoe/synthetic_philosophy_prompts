answer: |-
  ### Exam Question

  **Time Allowed:** 60 Minutes
  **Format:** Closed Book
  **Total Marks:** 25

  **Question 1: Audit of the Meridian Group Forecast**

  Read the scenario below regarding the Meridian Group's forecast concerning a major power's political stability.

  > **Scenario:** A consultancy (call it the Meridian Group) publishes a forecast that a certain major power's current political order has "a 40% probability of collapsing within 15 years." Their two-page method note says: they assembled a reference class of 23 historical polities they call "empires" -- it's a grab-bag, including a couple of city-state hegemonies, one or two colonial empires, a shogunate, some dynastic states, and at least one thing most historians would call a kingdom rather than an empire; they computed how long each lasted (the spread is roughly 50 to 900 years, median around 250); they located the current power at about the 60th percentile of elapsed duration; and that percentile is where the 40% comes from. They add that the class "controls for regime type" because every member was an empire. They also state that the model assumes the hazard of collapse is constant over a polity's life, so age doesn't need to be modeled separately.

  **Task:** Write a critical audit of this forecast. Your essay must address the following six points explicitly:
  1.  Evaluate the defensibility of the reference class and the specific claim that it "controls for regime type."
  2.  Identify the statistical problem inherent in estimating a lifespan distribution using only polities that have already collapsed, and explain how this distorts the 40% figure.
  3.  Analyze the "constant-hazard" assumption: what it implies about political risk over time and why it is likely false for this subject.
  4.  Distinguish between forecasting *whether* an event occurs and *when* it occurs, and identify which Meridian actually produced.
  5.  Present the strongest possible steelman of the Meridian approach, followed by the strongest objection to it.
  6.  Propose the single change that would most improve the forecast's validity.

  Do not rely on citing specific authors or books. Demonstrate your understanding by describing the concepts and mechanisms involved.

  ***

  ### Model Answer

  The Meridian Group's forecast is methodologically unsound and should not be relied upon for policy decisions. While the intuition to use historical baselines is correct, the execution fails on classification, statistical sampling, and risk modeling.

  First, the reference class is indefensibly heterogeneous. Grouping city-state hegemonies, colonial empires, and dynastic states together treats fundamentally different political technologies as identical units. A maritime trade hegemony faces different structural vulnerabilities than a land-based dynastic state. Consequently, the claim that this class "controls for regime type" is false. "Empire" describes a geopolitical scope or structure, not a regime type (such as democracy, autocracy, or junta). Furthermore, because every member of the class is defunct, the sample cannot control for variables that distinguish survivors from non-survivors. It effectively assumes that "being an empire" is the only variable that matters, ignoring institutions, economics, or external pressure.

  Second, there is a critical statistical bias in using only collapsed polities. By calculating a lifespan distribution exclusively from completed lives, Meridian commits a form of selection bias (specifically, ignoring right-censored data). They have excluded all empires that are still alive. This systematically underestimates the potential lifespan of the current power. If you only measure the height of people who have finished growing, you miscalculate the growth potential of a child. In this context, excluding surviving cases biases the hazard rate upward, making the 40% probability of collapse an overestimate. The 40% figure is likely inflated because the denominator of the risk calculation excludes successful long-term survivors.

  Third, the constant-hazard assumption implies that the risk of collapse in year one is identical to the risk in year two hundred. This suggests polities do not age; they face the same probability of failure regardless of institutional maturity. This is historically implausible. Polities often face "infant mortality" (high early risk) or "senescence" (increasing risk due to rigidity or elite capture over time). A 15-year-old regime and a 250-year-old regime rarely face identical structural risks. By flattening the risk curve, Meridian ignores the specific vulnerabilities associated with the current power's actual age and institutional lifecycle.

  Regarding the forecast type, Meridian conflates *whether* and *when*. A "40% probability within 15 years" is a hybrid: it predicts the probability of an event (*whether*) within a specific window (*when*). However, they derived this from a lifespan distribution (a *when* model). They treated the 15-year window as a slice of a survival curve. This is a category error; a lifespan distribution tells you the probability of dying at age X, not the probability of dying in the next 15 years given you have already survived to age Y, unless the hazard is constant (which, as noted, it is not).

  The strongest steelman for Meridian is that any baseline is better than none. Without historical comparison, forecasters often succumb to exceptionalism, assuming the current power is immune to historical patterns. A rough heuristic forces the analyst to acknowledge mortality. However, the strongest objection is that the noise in the data swamps the signal. The variance in lifespan (50 to 900 years) is so massive that the median is meaningless for predicting a specific 15-year window. The error bars on this forecast would be so wide as to render the 40% point estimate useless.

  To improve this, Meridian should include surviving polities in the dataset as right-censored observations. This would correct the lifespan bias and allow for a proper survival analysis that accounts for the fact that some empires last much longer than others without collapsing. This single change would ground the hazard rate in reality rather than a graveyard sample.

  ***

  ### Marking Scheme

  | Criterion | What a full-credit answer must contain | Marks | How students typically lose marks here |
  | :--- | :--- | :--- | :--- |
  | **Reference Class & Regime Type** | Identifies heterogeneity (city-states ≠ empires) as a flaw. Explicitly refutes "controls for regime type" by noting "empire" is a structure, not a regime type, and dead samples cannot control for survival variables. | 5 | Accepting "empire" as a valid regime type; failing to note that all members being dead negates control; vague complaints about "subjectivity." |
  | **Statistical Bias (Collapsed Sample)** | Identifies the exclusion of surviving polities (ignoring right-censored data/survivorship bias). Explains that this biases lifespan estimates downward and inflates the collapse probability (the 40% is too high). | 5 | Focusing only on small sample size (n=23); failing to explain *direction* of bias (i.e., not stating 40% is an overestimate); name-dropping without explanation. |
  | **Constant-Hazard Assumption** | Explains that constant hazard means risk is age-independent. Argues why this is false for polities (e.g., infant mortality, institutional senescence/rigidity, or learning/adaptation). | 4 | Merely defining the term without applying it to polities; claiming "nothing is constant" without specific political mechanisms. |
  | **Whether vs. When** | Distinguishes binary outcome probability (*whether*) from time-to-event distribution (*when*). Identifies Meridian produced a hybrid but derived it from a lifespan model without adjusting for current age (conditional probability). | 3 | Conflating the two terms; failing to note the conditional nature of surviving to the present day. |
  | **Steelman & Objection** | **Steelman:** Acknowledges value of baseline/preventing exceptionalism. **Objection:** Variance is too high (50-900 years) to be predictive; signal-to-noise ratio is too low. | 4 | Steelman is weak ("it's easy to do"); Objection is a repeat of previous points rather than a distinct critique of utility/variance. |
  | **Single Improvement** | Proposes including surviving polities (right-censored data) OR narrowing the reference class significantly. Must explain *why* this fixes a specific error mentioned above. | 2 | Suggesting "get more data" without specifying *what* data; suggesting complex modeling fixes without fixing the input data first. |
  | **Clarity & Constraints** | Essay is structured logically. No name-dropping (concepts described, not cited). Adheres to word count constraints (approx. 600-800 words). | 2 | Name-dropping (Kahneman, Tetlock, etc.); disorganized structure; significantly under/over word count. |
  | **TOTAL** | | **25** | |
