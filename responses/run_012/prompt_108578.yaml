answer: |-
  # The Admissible Precisation Protocol (APP)
  **For Use in Borderline Obviousness Determinations (35 U.S.C. § 103)**

  **Purpose:** To distinguish between technical ignorance (missing facts) and semantic vagueness (borderline obviousness), and to ensure that refusals in borderline cases are grounded in admissible institutional policy rather than disguised as technical discovery.

  **Time Budget:** 45 minutes of the total case time (leaving remainder for search and standard analysis).

  ### Step 1: The Ignorance Filter (Fact vs. Vagueness)
  *Ask:* Is there a missing fact that, if known, would resolve the obviousness question?
  *   **Yes:** (e.g., A reference is in an untranslated language; a test result is missing; a date is ambiguous).
      *   **Action:** Issue an Information Disclosure Statement (IDS) requirement or suspend examination. Do **not** proceed to Step 2. This is ignorance, not vagueness.
      *   **Output:** Office Action requesting clarification/translation.
  *   **No:** All technical facts are established. The uncertainty is about whether these facts *count* as "obvious."
      *   **Action:** Proceed to Step 2.

  ### Step 2: The Determinacy Test (The "All/None" Check)
  *Ask:* Considering the *Graham* factors, is there **any** admissible way to interpret the evidence where the claim is *non-obvious*?
  *   **No (Determinately Obvious):** Every reasonable interpretation of the evidence leads to obviousness. (e.g., Identical substitution with predictable results).
      *   **Action:** Write standard refusal. Cite specific references.
      *   **Stop.**
  *   **No (Determinately Non-Obvious):** Every reasonable interpretation leads to non-obviousness. (e.g., Teaching away, unexpected results).
      *   **Action:** Allow claim.
      *   **Stop.**
  *   **Yes (Indeterminate):** Some reasonable interpretations suggest obviousness; others suggest non-obviousness. The evidence underdetermines the conclusion.
      *   **Action:** Proceed to Step 3.

  ### Step 3: The Precedent Constraint (Narrowing Sharpenings)
  *Ask:* Does binding case law or Board precedent *eliminate* the "non-obvious" interpretation?
  *   **Yes:** Precedent dictates that this specific type of combination *must* be treated as obvious (e.g., specific rules on overlapping numerical ranges).
      *   **Action:** The "non-obvious" precisification is inadmissible. The case is now Determinately Obvious.
      *   **Output:** Write refusal citing the precedent as the binding rule.
      *   **Stop.**
  *   **No:** Precedent allows for either interpretation. The case remains Indeterminate.
      *   **Action:** Proceed to Step 4.

  ### Step 4: The Policy Stipulation (Institutional Line-Drawing)
  *Ask:* Is the claimed invention trivial enough that the Office's interest in preventing monopolies on basic knowledge outweighs the applicant's interest in certainty?
  *   **Note:** This is not a technical question. This is a policy choice.
  *   **Action:**
      *   If **Refusal** is chosen: You are stipulating that this case falls on the "obvious" side of the line. You must document this in the *Internal Examination Record* as a "Policy Precisation."
      *   If **Allowance** is chosen: You are acknowledging the benefit of the doubt in the vagueness gap.
  *   **Constraint:** If you choose Refusal, the public Office Action must not say "We are guessing." It must say "It would have been obvious to a person of ordinary skill..." but your *Internal Record* must flag that this conclusion rests on Step 4, not Step 2.
  *   **Handoff:** If you are unsure of the policy weight, **escalate to Senior Examiner.** Do not decide policy alone.

  ### Step 5: Documentation
  *   **Public Refusal:** Standard legal language.
  *   **Internal Memo:** Must check the box: "Borderline Case: Resolution via Policy Precisation." Cite the specific precedent or policy goal used to narrow the sharpening.

  ***

  # Note to the Supervisor: The Epistemicist Counterfactual

  If your friend is right and **Epistemicism** is the correct metaphysical view, the procedure above requires no structural rewrite, but it requires a **relabeling of confidence**.

  Under Epistemicism, there is no "gap." In Step 2, the case is either Obvious or Non-Obvious, full stop. Our inability to decide is purely human ignorance.
  *   **Change in Procedure:** Step 4 (Policy Stipulation) becomes a lie. You are not *drawing* a line; you are *estimating* a line that already exists.
  *   **Change in Training:** Examiners should be trained to treat borderline cases as **investigative failures**, not policy opportunities. Instead of asking "What should our policy be?", they should ask "What evidence are we missing that would reveal the fact?"
  *   **Change in Refusal Text:** The refusal would remain identical (courts cannot handle metaphysical honesty), but the Internal Memo would change from "Policy Precisation" to "Best Estimate of Fact."
  *   **Practical Consequence:** You would likely see more requests for continued examination (RCEs) as examiners hunt for the "missing fact" that doesn't exist, whereas the Supervaluationist procedure accepts the gap and forces a decision. The procedure I gave you is more efficient *because* it accepts vagueness. If Epistemicism is true, this efficiency is bought at the cost of truth.

  ***

  # Case Runs

  ## Case 1: The Mechanical Combination
  **Claim:** A device comprising Element A (a known gear mechanism) and Element B (a known lubrication channel), arranged such that B lubricates A.
  **Prior Art:** Reference 1 discloses A. Reference 2 discloses B. No reference suggests combining them.
  **Examiner's Technical View:** "It's just putting two things together. It works predictably. But nobody wrote it down."

  **Procedure Output:**
  1.  **Ignorance Filter:** Pass. All facts known.
  2.  **Determinacy Test:** **Indeterminate.**
      *   *Obvious Precisation:* "Common sense dictates combining known elements for their known functions."
      *   *Non-Obvious Precisation:* "No teaching, suggestion, or motivation (TSM) exists in the record. Hindsight bias is possible."
  3.  **Precedent Constraint:** **No.** Current case law (e.g., *KSR*) allows common sense but requires a reasoned explanation. Absence of explicit suggestion leaves the "Non-Obvious" precisification admissible.
  4.  **Policy Stipulation:** **Escalate.**
      *   *Senior Examiner Decision:* "Without a specific reason to combine, we cannot stipulate obviousness without risking reversal. The gap favors the applicant."
  5.  **Final Disposition:** **Withdrawal of Rejection (Allowance).**

  **Supervisor Note:** *I know you will not like this outcome.* This is a trivial patent. However, under the Supervaluationist procedure, because the "Obvious" predicate is not *determinately* satisfied (the "motivation" precisification is not admissible without more evidence), we cannot refuse. We are forced to grant. This is the cost of honesty: we lose the ability to refuse "gut feeling" obviousness.

  ***

  ## Case 2: The Numerical Range
  **Claim:** A chemical process operating at 100°C to 150°C.
  **Prior Art:** Reference 1 discloses the same process at 145°C to 200°C.
  **Examiner's Technical View:** "Overlap is small (5 degrees). Probably doesn't matter, but maybe it does."

  **Procedure Output:**
  1.  **Ignorance Filter:** Pass.
  2.  **Determinacy Test:** **Indeterminate.**
      *   *Obvious Precisation:* "Overlapping ranges create a prima facie case of obviousness."
      *   *Non-Obvious Precisation:* "The edge of the range might be critical for stability."
  3.  **Precedent Constraint:** **Yes.** *Titanium Metals Corp. v. Banner* (and equivalent office policy) establishes that overlapping ranges are prima facie obvious unless criticality is shown. This precedent eliminates the "Non-Obvious" precisification *unless* the applicant provides evidence of criticality.
  4.  **Policy Stipulation:** N/A (Precedent resolved the vagueness).
  5.  **Final Disposition:** **Refusal.**

  **Written Refusal Excerpt:**
  > "The claimed range overlaps with the range disclosed in Reference 1. It is settled law that a prima facie case of obviousness is established where the claimed range overlaps or lies inside a range disclosed by the prior art. The burden shifts to the applicant to show that the claimed range is critical. No such evidence is of record."

  ***

  ## Case 3: The Software Data Structure
  **Claim:** A specific tree-based data structure implemented in memory for sorting financial transactions.
  **Prior Art:** A textbook on database indexing (unrelated to finance) discloses the exact same structure for sorting library records.
  **Examiner's Technical View:** "Any programmer would know to use this structure here. It's routine. But the textbook doesn't mention finance."

  **Procedure Output:**
  1.  **Ignorance Filter:** Pass.
  2.  **Determinacy Test:** **Indeterminate.**
      *   *Obvious Precisation:* "Application of a known technique to a similar problem is routine."
      *   *Non-Obvious Precisation:* "Analogy between fields is not established. Financial transactions have unique constraints not present in library records."
  3.  **Precedent Constraint:** **No.** Precedent on "analogous art" is vague regarding software fields. Both precisifications are admissible.
  4.  **Policy Stipulation:** **Refusal (Policy Choice).**
      *   *Internal Record:* "Borderline Case: Resolution via Policy Precisation. Office policy prioritizes preventing monopolies on basic data structures over field-specific application."
      *   *Risk:* This is a stipulation, not a technical finding.
  5.  **Final Disposition:** **Refusal.**

  **Written Refusal Excerpt:**
  > "Although Reference 2 does not explicitly disclose financial transactions, the data structure is analogous. It would have been obvious to a person of ordinary skill in the art to apply the known structure of Reference 2 to the problem of financial sorting, as the underlying computational problem is identical. This is a routine implementation of known methods."

  **Supervisor Note:** *This is the refusal you will not like.* Why? Because the Internal Record admits this is a **Policy Stipulation**. If this goes to court, the applicant's attorney will argue we provided no *technical* reason for the combination, only a policy preference. The procedure forces us to dress this up as a "routine implementation" (Step 5) while internally acknowledging we are drawing a line in a vagueness gap (Step 4). This creates a vulnerability: we are asserting a fact ("It is routine") that we have internally classified as a policy choice.

  ***

  # Limitations and Confessions

  **What This Procedure Cannot Do:**
  1.  **It cannot guarantee court survival.** By forcing examiners to identify "Policy Stipulations," we highlight the very arbitrariness courts seek to punish. A court wants to hear that you *found* the obviousness, not that you *assigned* it. This procedure makes the assignment visible in the Internal Record, which is discoverable.
  2.  **It cannot eliminate examiner discretion.** Step 4 (Policy Stipulation) is pure discretion. The procedure merely forces the examiner to admit it.
  3.  **It cannot resolve the metaphysical dispute.** Whether Supervaluationism or Epistemicism is true, the examiner still has to sign the paper.

  **Where We Are Dressing Up Judgment Calls:**
  *   **Step 2 (The Determinacy Test):** Examiners will inevitably confuse "I can't imagine a non-obvious interpretation" with "There is no non-obvious interpretation." The test asks for a logical certainty but relies on human intuition.
  *   **Step 5 (Documentation):** The Public Refusal *must* lie. It must state "It would have been obvious" as a fact. The procedure knows this is a stipulation in borderline cases, but requires the examiner to write it as a discovery. We are trading metaphysical honesty for legal survivability.
  *   **Precedent as "Sharpening":** We treat case law as narrowing admissible precisifications. In reality, examiners often treat case law as a shield to avoid thinking. The procedure assumes good-faith engagement with precedent that may not exist in a high-volume environment.

  **Final Warning:**
  This procedure makes the Office's line-drawing visible. If you implement it, you must be prepared to defend the *policy choices* made in Step 4, because you can no longer hide them behind the veil of "technical fact." You are not just managing examiners; you are managing the boundaries of the vague predicate "obvious."
