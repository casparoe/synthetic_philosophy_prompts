answer: |-
  **Where it breaks**
  The argument snaps at **Step (5)**. This is where your mate smuggles a normative conclusion ("is just") out of a descriptive premise ("is backed by force"). Step (4) correctly observes that force *sustains* laws, but Step (5) falsely concludes that force *legitimizes* them. This is the classic Is-Ought fallacy: just because power *causes* a custom to survive doesn't mean power *makes* that custom right. You can accept that laws are enforced by police (4) without accepting that the police baton is the source of moral truth (5). This step conflates *efficacy* (does it work?) with *validity* (is it good?), which are distinct concepts even in a skeptical framework.

  **Why it looked fine**
  This step feels plausible because it mimics a "hard-headed" realism. Since you've already accepted (1)—that there's no God's-eye view of justice—it seems logical to assume the only "real" metric left is physical power. It appeals to cynicism: history is written by victors, and rebels who fail are crushed, so it looks like success equals righteousness. It also feels like a consistent extension of Pascal's skepticism; if we can't know true justice, why not treat the only visible standard (force) as the operational one? It seems to be simply cleaning up the vocabulary to match the grim reality of how laws are actually maintained.

  **What giving it up costs**
  If you drop (5), you pay the cost of having to define justice as something other than power. You must argue that a law can be *effective* (backed by force) but *wrong* (unjust), which requires a functional standard of justice—like fairness, well-being, or consistency—even if that standard isn't "independent" in a metaphysical sense. You have to believe human reasoning about value is real, even if it's not divine. By contrast, if you gave up **(1)** instead, you'd pay a much higher metaphysical price: you'd have to claim access to objective, universal moral truths (Natural Law) that exist outside human culture, which is dogmatic and hard to defend in a pluralistic world. If you gave up **(3)**, you'd merely admit that language carries normative weight beyond personal preference, which is a lighter cost, but it doesn't fully stop the slide to nihilism unless you also break (5). Dropping (5) is the cheapest way to keep your skepticism without losing your conscience.

  **Bottom line**
  You can keep the skepticism of (1) without accepting the nihilism of (7) by refusing to let force define justice. Pascal himself argued that while force is necessary to *protect* order, it does not *create* right; your mate has confused the shield for the sword. Drop Step (5), and you preserve the right to call a powerful law unjust without needing to believe in magic moral truths.
