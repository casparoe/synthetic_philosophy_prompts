  Write me a joke about the invention of tradition. Set it in a made-up country — call it Valdoria — whose most beloved national festival turns out to have been cooked up in 1987 by an ad agency the tourism ministry hired, right down to the "ancient" folk song that's really just a jingle someone reworked. The punchline should turn on the actual content of the Hobsbawm/Anderson stuff: that these immemorial customs get manufactured, dated, and then retroactively laundered back into the deep past, and that the state needs its paperwork — the census, the map, the museum — for the nation to feel old rather than just recent. Make it land for someone who's actually read the theory, not just a "lol nations are made up" bit. No need for citations or a reading list, obviously.
