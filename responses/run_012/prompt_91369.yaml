answer: |-
  The Minister of Culture in Valdoria summons Gareth, the ad executive who designed the country's most beloved national holiday, the "Festival of the Eternal Sheaf."

  Gareth is sweating. "Minister, there's a problem. The journalists found the invoice. They know the 'ancient folk song' is actually a jingle I wrote for a yogurt campaign in 1987. They know the whole festival was cooked up by my agency last Tuesday. The nation is going to realize it's only thirty years old."

  The Minister pours two glasses of wine and slides one across the desk. "Gareth, you're thinking like a merchant. You need to think like a state."

  "But the dates—"

  "The dates are administrative choices, not physical laws," the Minister says. "Look at the plan. Next week, the National Museum opens the 'Hall of Ancestors' and displays the festival costumes under glass labeled *'Pre-Industrial Agrarian Ritual.'* The following month, the Postal Service issues a stamp series mapping the parade route as a *'Historic Boundary.'* And come January, the National Census will include a checkbox for every citizen to declare their *'Traditional District'* based on the festival zones."

  Gareth blinks. "And that fixes the invoice?"

  "The invoice is private data. The archive is public truth," the Minister says, tapping the file folder. "Once the Museum catalogs the jingle as 'Oral History,' the Map prints the route as 'Sovereign Soil,' and the Census counts the revelers as 'Kin,' the timeline adjusts itself. The nation doesn't need to be old, Gareth. It just needs the paperwork to imagine itself backwards."

  The Minister stamps the invoice **VOID** and files it under **FOLKLORE**.

  "We aren't inventing a tradition," the Minister says. "We're just processing the requisition form for a past."
