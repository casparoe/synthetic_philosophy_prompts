      Start with the constraint. The independence-of-source constraint forbids a process from vouching for itself. In the app case, the reliability figure is generated by the app. If the man trusts the figure solely because the app displays it, he violates the constraint. The source of the belief (app display) and the source of the justification (app computation) are identical. This is viciously circular because it offers no new information; it is a closed loop.

