answer: |-
  **Graduate Seminar: Epistemology of Self-Trust**
  **Take-Home Final Examination**

  **Question 1**
  Consider the following case: A man checks a weather app each morning and finds its forecasts right most days over the course of a year. The app also displays a reliability figure—stating it has been 92 percent accurate over the past twelve months—and when asked why he trusts it, he cites that figure. The figure is computed by the app from its own forecast history, and nothing outside the app corroborates it.

  A colleague proposes an **independence-of-source constraint**: a process may be used to license a belief about its own reliability only when the licensing evidence comes from a source other than that process.

  Write an essay addressing the following:
  1.  Does the man's citation of the app's reliability figure violate this constraint?
  2.  Is the case helped by the fact that the man also observes the outcomes himself, or does this merely shift the bootstrapping problem to his perceptual faculties?
  3.  Does the constraint resolve the epistemic worry, or does it merely relabel the problem of circularity?

  In your answer, you must distinguish between the worry about bare logical circularity and the worry about the order of knowing. (Approx. 70 minutes)

  ***

  **Model Answer**

  The independence-of-source constraint posits that a cognitive process cannot justify beliefs about its own reliability unless the evidence originates elsewhere. Applied to the weather app case, this constraint initially condemns the man's citation of the app's reliability figure. The figure is generated by the app's algorithm based on its own forecast history. If the man trusts the app primarily because the app says it is trustworthy, the source of the belief (the display) and the source of the justification (the computation) are identical. This violates the constraint because it offers no independent leverage; the app is effectively vouching for itself. This is objectionable bootstrapping because it allows reliability to be conjured from nothing but internal consistency, granting knowledge where no new information has entered the system.

  However, the case is significantly helped by the fact that the man also observes the outcomes himself. When he checks the forecast against the actual weather, he employs a different source: his perceptual faculties. Here, the belief about the app's reliability is licensed by visual experience, not the app's algorithm. This satisfies the independence constraint. The perceptual source is distinct from the computational source. Consequently, his trust is not based on the app's self-report but on empirical tracking. This transforms the epistemic structure from closed-loop certification to open-ended verification. The man is not asking the app if it is reliable; he is asking the world, using the app as a hypothesis.

  Critics might argue this merely relabels the bootstrapping problem. If the man must trust his vision to verify the app, doesn't he need prior warrant for his vision? This raises the order-of-knowing worry. Bare logical circularity involves premises entailing conclusions they presuppose, which is logically valid but epistemically inert. Epistemic circularity concerns justification order: must I know a faculty is reliable before using it to gain knowledge? The independence constraint addresses the latter without demanding the former. It does not require the man to prove his vision is reliable before looking outside. It only requires that the source being tested (the app) is not the source doing the testing (vision). This avoids the regress problem while blocking self-certification.

  Therefore, the constraint resolves the worry rather than relabeling it. It isolates the specific failure of self-certification. In the app's self-report, there is no error-detection mechanism external to the process. In the man's observation, there is. If the app lies about its accuracy, the self-report hides it. If the app lies about the weather, the man's vision might catch it. The constraint captures this asymmetry. It acknowledges that while all faculties face global skeptical challenges, local epistemic permissions depend on source diversity. A student might claim that because vision is also fallible, the check is useless. This conflates fallibility with circularity. The constraint does not demand infallibility, only independence.

  Ultimately, the man's trust is justified only insofar as it rests on his observations, not the displayed figure. The constraint clarifies that bootstrapping is objectionable not because it uses a faculty to check itself globally, but because it allows a specific process to operate without external calibration. By distinguishing the app's computation from the man's perception, the constraint validates the observation while rejecting the self-report. It provides a principled boundary between vicious circularity and permissible empirical confirmation, preserving the integrity of epistemic justification without succumbing to skepticism. The constraint is thus a substantive diagnostic tool, not a semantic shift.

  ***

  **Marking Scheme**

  **1. Application of Constraint to App Figure (4 marks)**
  *   **Must Hit:** Identify that citing the app's self-generated reliability figure violates the constraint because the source of the belief and the source of the justification are identical.
  *   **Typical Error:** Candidates often argue the figure is unreliable because apps lie, rather than because the *source structure* is circular.

  **2. Evaluation of Man's Observation (4 marks)**
  *   **Must Hit:** Argue that the man's personal observation satisfies the constraint because perception is a source independent of the app's algorithm.
  *   **Typical Error:** Candidates claim observation fails because vision is also fallible, confusing independent sourcing with infallible sourcing.

  **3. Order-of-Knowing vs. Logical Circularity (4 marks)**
  *   **Must Hit:** Distinguish between logical validity (premises support conclusion) and epistemic priority (needing prior warrant to use a faculty).
  *   **Typical Error:** Candidates treat logical circularity as the primary problem, missing the epistemic worry about justification order.

  **4. Resolution vs. Relabeling (4 marks)**
  *   **Must Hit:** Argue that the constraint is substantive because it blocks self-certification while allowing cross-checking, rather than just renaming bootstrapping.
  *   **Typical Error:** Candidates assert the constraint is useless because global skepticism remains, missing the point of local source independence.

  **5. Final Verdict on Trust (4 marks)**
  *   **Must Hit:** Conclude that trust is justified via observation but not via the reliability figure, contingent on the independence constraint.
  *   **Typical Error:** Candidates give a binary verdict (trust is either fully justified or fully unjustified) without distinguishing the two bases.
