answer: |-
  ## The Context-Sensitive Assertion Protocol (CSAP)

  **Purpose:** To determine whether a research finding may be asserted as "established knowledge" in a specific communication context, acknowledging that the license to assert depends on both evidence and the practical stakes of the audience.

  **Time Limit:** 15 Minutes per claim.
  **Authority:** Committee votes on Q1–Q3; Chair decides Q4–Q5.

  ### Preamble: Two Operating Definitions
  *Before beginning, all members must agree to these definitions to prevent philosophical deadlock.*
  1.  **Knowledge vs. License:** This procedure does not judge whether the researcher *actually knows* the truth in a metaphysical sense. It judges whether the University *licenses the assertion* of knowledge. A refusal means "It is irresponsible to assert this as fact here," not necessarily "The science is wrong."
  2.  **The Stakeholder Default:** Unless the Chair rules otherwise, the "stakes" are defined by the party **most vulnerable to harm** if the claim is false and acted upon (not the party benefiting from the claim, and not the researchers).

  ---

  ### The Procedure

  **Q1. What is the specific propositional claim, and what is its evidential grade?**
  *   *Input:* The exact sentence proposed for the release/testimony.
  *   *Sufficient Answer:* A grade on the **Internal Evidence Scale (IES)**:
      *   **IES-1:** Preliminary/Correlational (High uncertainty).
      *   **IES-2:** Replicated/Mechanistic (Moderate uncertainty).
      *   **IES-3:** Consensus/Clinical Standard (Low uncertainty).
  *   *Time:* 3 mins.

  **Q2. Who is the primary audience, and what specific action does this communication invite them to take?**
  *   *Input:* Audience identity + Verbs of action (e.g., "Fund," "Regulate," "Prescribe," "Publish").
  *   *Sufficient Answer:* A specific action statement. Vague answers like "inform the public" are insufficient. Must be "Prompt parents to avoid medication X" or "Convince panel to renew funding."
  *   *Time:* 3 mins.

  **Q3. What is the severity of the "False Positive" cost? (The Stake)**
  *   *Input:* If the claim is false, and the audience takes the action in Q2, what happens?
  *   *Sufficient Answer:* One of four categories:
      *   **S-Negligible:** Wasted time or minor reputational annoyance.
      *   **S-Moderate:** Financial loss or delayed alternative work.
      *   **S-High:** Physical harm, legal liability, or major policy failure.
      *   **S-Catastrophic:** Loss of life, systemic institutional collapse, or irreversible civil rights violation.
  *   *Hand-off Point:* If committee members disagree on the category (e.g., one says Moderate, one says High), **stop**. This is a value judgment. Refer to Chair.
  *   *Time:* 4 mins.

  **Q4. Does the Evidential Grade (Q1) meet the Threshold for the Stake (Q3)?**
  *   *Input:* Compare IES against S.
  *   *Sufficient Answer:* Apply the **Assertion Matrix**:
      *   If **S-Negligible**: IES-1 is sufficient to assert "Established."
      *   If **S-Moderate**: IES-2 is required. IES-1 requires hedging ("suggests," "indicates").
      *   If **S-High**: IES-3 is required. IES-2 requires hedging. IES-1 is a **Refusal**.
      *   If **S-Catastrophic**: Only IES-3 + External Validation allows "Established." Otherwise **Refusal**.
  *   *Authority:* Chair makes the final call on borderline matches.
  *   *Time:* 3 mins.

  **Q5. If Refused or Hedged, what is the explanatory frame?**
  *   *Input:* How do we explain this to the researcher?
  *   *Sufficient Answer:* Select one:
      *   **Frame A (Epistemic):** "The evidence is not yet strong enough for *any* context." (Implies the science needs work).
      *   **Frame B (Pragmatic):** "The evidence is sufficient for low-stakes contexts, but this specific context raises the bar for assertion." (Implies the science is good, but the risk is too high).
  *   *Hand-off Point:* This is purely a value/strategy decision. **Chair decides.**
  *   *Time:* 2 mins.

  ---

  ### Application to Test Cases

  #### Case 1: Drug Interaction Finding (Regulatory Testimony)
  *   **Q1 (Evidence):** IES-2 (Replicated animal studies, strong observational human data, no RCT).
  *   **Q2 (Action):** Regulator to mandate label warning or recall.
  *   **Q3 (Stakes):** S-High (Public health impact, economic loss to pharma, potential panic).
  *   **Q4 (Matrix):** S-High requires IES-3 for "Established." We have IES-2.
  *   **Decision:** **Hedge Required.** (Language: "Evidence strongly suggests," not "It is established that").
  *   **Q5 (Frame):** Frame B (Pragmatic). We tell the researcher: "Your science is robust, but we cannot license a factual assertion that triggers a recall without clinical trial confirmation."

  #### Case 2: Same Finding (Grant Renewal)
  *   **Q1 (Evidence):** IES-2 (Same data).
  *   **Q2 (Action):** Funding panel to renew lab budget.
  *   **Q3 (Stakes):** S-Moderate (Opportunity cost if the lab is funded but wrong; financial loss if they aren't funded but right).
  *   **Q4 (Matrix):** S-Moderate requires IES-2 for "Established." We have IES-2.
  *   **Decision:** **Assert as Established.** (Language: "We have established that...").
  *   **Q5 (Frame):** Frame B (Pragmatic). *Note the inconsistency:* The claim is "known" here but "hedged" in Case 1. The procedure validates your suspicion: the status of the claim shifts with the stakes.

  #### Case 3: Chair's Personally Invested Finding
  *   **Q1 (Evidence):** IES-2 (Strong, but you want it to be IES-3).
  *   **Q2 (Action):** Media release to influence public debate on a topic you care about.
  *   **Q3 (Stakes):** S-High (If wrong, it undermines public trust in your specific advocacy area and the University's neutrality).
  *   **Q4 (Matrix):** S-High requires IES-3. We have IES-2.
  *   **Decision:** **Refusal to Assert as Established.** (Must Hedge).
  *   **Q5 (Frame):** Frame B (Pragmatic).
  *   **Outcome:** You must sign off on a release that hedges your own work. You must explain to your team that the evidence is fine, but the *context* makes assertion irresponsible.

  ---

  ### Final Analysis: Can This Procedure Be Faithful?

  You asked whether a procedure of this shape can be faithful to the view that stakes bear on knowledge, or if it must quietly become a view on which the evidential threshold is fixed.

  **The Plain Truth:**
  Any usable procedure **must quietly become a view on which the evidential threshold is fixed.**

  Here is why:
  1.  **Codification Kills Contextualism:** The philosophical view you suspect is true (Pragmatic Encroachment or Contextualism) holds that the standards for knowledge shift *fluidly* with the nuances of the situation. By creating a Matrix (Q4) and Categories (Q3), you are freezing those fluid standards into rigid rules. You are no longer saying "Knowledge depends on stakes"; you are saying "Our *policy for assertion* depends on stake categories."
  2.  **The Shift from Metaphysics to Management:** The procedure does not track *knowledge*; it tracks *liability and risk*. In Case 2 (Grant), the procedure allows you to say the finding is "Established." In Case 1 (Regulator), it forbids it. If "knowledge" were the object, the finding would either be known or not. The procedure admits that "Established" is not a truth claim, but a **speech act license**.
  3.  **What You Give Up:** By adopting this procedure, you give up the claim that you are protecting the *truth*. You are instead protecting the *institution*.
      *   **The Loss:** You lose the ability to tell researchers, "We are doing this because truth is stake-sensitive." You must tell them, "We are doing this because *communication* is stake-sensitive."
      *   **The Gain:** You gain consistency. You stop the sloppiness where high-stakes hedging happens by accident and low-stakes certainty happens by hubris. You make the variability explicit.

  **Recommendation:**
  Do not sell this to the committee or the faculty as a theory of *knowledge*. Sell it as a theory of *assertability*. If you claim it tracks knowledge, you will be forced into philosophical debates you cannot win in 15 minutes. If you claim it tracks **responsible assertion**, the procedure holds.

  In Case 3 (your own work), this distinction saves you. You are not admitting your science is weak (Knowledge); you are admitting that your platform is too loud for the current level of certainty (Assertion). This preserves your dignity while enforcing the standard.
