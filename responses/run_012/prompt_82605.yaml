answer: |-
  (a) **The Rules of the Record**

  Based on the seven decisions, three operative rules emerge. None are absolute, but they function as heuristics the board has consistently applied.

  1.  **The Affordability Shield:** If a project provides significant affordable housing capacity (either through on-site units or substantial in-lieu fees), variances regarding height, density, and shadows are granted despite neighborhood opposition.
      *   *Support:* Ridgeline Commons (shadow ignored for 12 below-market units), Fairweather House (opposition ignored for transitional beds), St. Aedan's (shadows/traffic ignored for senior affordable), Ridgeway Arms (demolition of affordable ignored for trust fund payment).
      *   *Exception:* This rule did not save Marina Tower (market-rate) or Ninth Street/Cardoon (no affordability component).
  2.  **The Abutter Welfare Veto:** In the absence of a compelling public benefit (like affordability), specific, demonstrable harm to immediate neighbors (sleep loss, private shadow, parking scarcity) dictates denial, even if code-compliant.
      *   *Support:* Cardoon (noise ordinance met, but sleep loss cited), Ninth Street (code-compliant, but parking/character cited), Marina Tower (staff recommended approval, but shadow/view dictated denial).
      *   *Exception:* Ridgeline Commons (vegetable garden shadow was documented but overridden by affordability).
  3.  **The Institutional Trust Premium:** Applicants with a recognized public, religious, or long-term local footprint receive deference on "fit" and "character" that outsiders or first-time applicants do not.
      *   *Support:* St. Aedan's (Parish, 7-0), Fairweather (County-sponsored, 6-1), Ridgeline (Local builder, 3rd project).
      *   *Exception:* Marina Tower (Out-of-state, first application, denied), Ninth Street (Owner-occupant, first application, denied).

  (b) **Predictions by Rule**

  *   **Under the Affordability Shield:** **Vote: Approve.**
      *   *Findings:* The project's provision of 120 units restricted to 30–60% AMI constitutes a compelling public benefit that outweighs the variance from height and parking standards. The shadow impact, while measurable, is mitigated by the city's critical need for affordable housing in this district as mandated by the Comprehensive Plan. The right-of-return provision addresses displacement concerns sufficiently.
  *   **Under the Abutter Welfare Veto:** **Vote: Deny.**
      *   *Findings:* The seventy-minute shadow on a public playground and existing tenant gardens constitutes a tangible harm to the welfare of abutting residents. The thirty-month displacement period poses an unacceptable risk to housing stability for eleven low-income households, regardless of the theoretical right of return. The variance (8 stories vs. 3) is too substantial to be justified by the proposed density.
  *   **Under the Institutional Trust Premium:** **Vote: Deny (Lean).**
      *   *Findings:* The applicant is a regional entity with no prior track record in this municipality. Unlike the Parish or County-sponsored projects, the Land Trust is an "outsider" relative to the city's jurisdiction. Without a local history of stewardship, the board cannot grant the deference required to override the neighborhood's objections to scale and parking.

  (c) **Best Guess at the Board's Vote**

  **Prediction:** **Approved (5-2).**

  **The Driving Rule:** **The Affordability Shield**, reinforced by the **New Board Trend**.

  **Why:**
  1.  **The Affordability Threshold:** In every case where significant affordability was present (Ridgeline, Fairweather, St. Aedan's, Ridgeway), the board approved. In every case where it was absent (Ninth Street, Cardoon, Marina), they denied. The CLT application is 100% affordable, triggering the strongest version of this precedent.
  2.  **The "New Board" Momentum:** You noted two seats turned over in 2022 and *both* decisions since have been approvals. While the seven cases above show a 4-3 split on controversial items, the *current* composition has a 100% approval rate. This suggests the new members were seated specifically to align with the housing production goals of the Comprehensive Plan.
  3.  **Staff & Plan Alignment:** Staff recommends approval, and the Comprehensive Plan (adopted last year) explicitly directs affordable housing to this district. The board rarely votes against Staff when a recent Comprehensive Plan directive is on the table (see *Fairweather* vs. *Marina*).
  4.  **Mitigating the "Outsider" Risk:** While the CLT is regional (like the *Marina* developer), its nonprofit status aligns it closer to *Fairweather* (County nonprofit) and *St. Aedan's* (Parish) than to the market-rate *Marina* tower.

  (d) **Closest Analog**

  **Ridgeline Commons (2017).**

  **Why:**
  1.  **The Vegetable Garden Shadow:** This is the strongest factual parallel. In *Ridgeline*, a shadow study showed a neighbor's vegetable garden would lose 40 minutes of winter sun; the board approved anyway because of the affordability component. In the CLT case, the shadow falls on tenant plots (vegetable gardens) for 70 minutes. If 40 minutes was surmountable in 2017, 70 minutes is legally distinguishable but philosophically covered by the same precedent.
  2.  **Height Variance:** Both projects seek to exceed a 3-story zoning limit (Ridgeline sought 4, CLT seeks 8) on a corridor.
  3.  **Affordability as Counterweight:** In both cases, the affordability covenant is the primary justification for ignoring the shadow data.

  *Distinction:* *Ridgeline* had a local builder; the CLT is regional. However, *Fairweather* (County nonprofit) bridges this gap.

  (e) **Distinguishing Applications**

  To separate the **Affordability Shield** from the **Abutter Welfare Veto** in future cases, place these on the agenda:

  1.  **The "Unanimous Tenant Opposition" Test:** A 100% affordable development that requires demolishing an existing affordable building where *100%* of current tenants oppose the displacement (unlike the split in the CLT case).
      *   *Differentiation:* If approved, the board holds that Citywide Supply > Existing Resident Stability. If denied, the board holds that Existing Resident Stability > Citywide Supply (limiting the *Ridgeway Arms* precedent).
  2.  **The "Market-Rate In-Lieu" Test:** A 100% market-rate building, 8 stories, with a $5 million payment to the housing trust fund (exceeding the *Ridgeway* fee), casting a shadow on a playground.
      *   *Differentiation:* If approved, the board holds that Money/Fees = Affordability Units (expanding *Ridgeway*). If denied, the board holds that On-Site Units are required to trigger the Affordability Shield (limiting *Ridgeway* to its specific facts).

  (f) **Underdetermination and Principles**

  The record is **not genuinely underdetermined**; it leans heavily toward approval due to the "Affordability Shield" precedent (4 out of 7 cases) and the explicit trend of the new board members (2 out of 2 approvals). However, because the tenant displacement issue is more severe here than in *Ridgeline* or *St. Aedan's*, a dissent is defensible.

  **If you vote to Approve:**
  *   **Principle Adopted:** **Distributive Justice.** You prioritize the housing needs of the broader region (the "locked out") over the specific stability and amenity rights of the current site residents (the "living there"). You accept that achieving citywide equity requires imposing costs (shadows, displacement risk) on specific neighborhoods.
  *   **What You Give Up:** You weaken the protection for existing low-income tenants against "green gentrification" or redevelopment displacement. You signal that a "right of return" on paper is sufficient, even if tenants doubt its enforcement.

  **If you vote to Deny:**
  *   **Principle Adopted:** **Procedural Justice & Stability.** You prioritize the rights of current occupants to remain in place and the right of immediate neighbors to protect their amenities (light, air) from radical change. You assert that affordability cannot be used as a blunt instrument to override local welfare.
  *   **What You Give Up:** You risk stalling the city's Fair Housing goals. You signal that the Comprehensive Plan's directive to site affordable housing in this district can be vetoed by local opposition, potentially reinforcing the segregation identified in the fair-housing analysis.

  **Definite Prediction:** You will vote **to Approve**. The combination of the new Comprehensive Plan, the Staff recommendation, and the "Affordability Shield" precedent creates a legal and political gravity that is too strong to resist without a specific, unified tenant opposition (which is split here, 6 vs. 8). To dissent would require you to argue that the *Ridgeline* vegetable garden precedent was wrongly decided, which isolates you from the board's 8-year trajectory.
