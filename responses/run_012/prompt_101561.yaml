answer: |-
  ### Exam Question (25 Marks)

  **Time Allowed:** 50 Minutes
  **Instructions:** Answer the following question in essay form. You do not need to cite specific authors or texts; focus on the strength of the argumentation.

  **The Dogmatism Puzzle**

  Consider the following argument:
  1. If you know that *P* is true, then you are in a position to know that any evidence suggesting *not-P* is misleading.
  2. If you are in a position to know that a piece of evidence is misleading, you are rationally permitted to ignore it.
  3. Therefore, if you know that *P* is true, you are rationally permitted to ignore any evidence suggesting *not-P*.

  **Case:** Alex checks the official university portal and sees confirmed notice that the final exam is on Friday at 3 PM. Alex thereby knows the exam is on Friday at 3 PM. Later, a classmate tells Alex, "I heard from the department secretary that the exam was moved to Thursday."

  **Task:**
  State the paradox clearly. Apply the argument above to Alex's situation. Critically evaluate the inference from premise (1) and (2) to the conclusion (3). Does distinguishing between different ways evidence can be "misleading" resolve the paradox, or does it merely relocate the problem? Take a clear stance.

  ***

  ### Model Answer

  The dogmatism paradox suggests that knowledge itself licenses closed-mindedness. If I know *P*, then *P* is true. If *P* is true, any evidence for *not-P* must be false or misleading. If I know evidence is misleading, I may ignore it. Thus, knowledge seems to grant permission to disregard contrary information.

  In Alex's case, Alex knows the exam is Friday (via the portal). The classmate's testimony is evidence for Thursday (not-Friday). According to the paradox, because Alex knows it is Friday, Alex knows the testimony is misleading. Consequently, Alex is permitted to ignore the classmate entirely without further investigation.

  This conclusion is intuitively unacceptable. Epistemically responsible agents should not ignore contrary testimony, even when confident. The flaw lies in the equivocation on the term "misleading" within the inference from (1) to (2).

  "Misleading" carries two distinct senses. In the first sense (falsehood), evidence is misleading because it is fabricated, erroneous, or non-genuine (e.g., a lie, a misprint). In the second sense (outweighed), evidence is misleading because it is genuine but ultimately incorrect due to stronger contrary evidence (e.g., a honest witness who is mistaken).

  Premise (1) feels plausible only if we use the second sense. If Alex knows the exam is Friday, then evidence for Thursday is indeed misleading in the sense that it points to a falsehood. It is true that the evidence is "wrong." However, Premise (2) is plausible only if we use the first sense. We are permitted to ignore evidence when we know it is fake or unreliable (a known liar). We are not permitted to ignore evidence simply because it contradicts our current knowledge, unless we also know it is unreliable.

  The paradox slides between these senses. It uses the second sense to make Premise (1) appear true (the evidence is wrong because *P* is true) and the first sense to make Premise (2) appear true (you can ignore bad evidence). But you cannot hold both simultaneously. If the evidence is merely outweighed (Sense 2), Alex cannot know it is misleading without circularity—Alex would be assuming *P* is true to prove the evidence is false, which begs the question against the new evidence. If the evidence is fake (Sense 1), Premise (1) fails—Alex does not know the testimony is fake simply by knowing the exam date; Alex would need independent verification of the testimony's falsity.

  Does fixing this kill the paradox? Yes, it dissolves the logical force. Once the senses are disambiguated, the inference fails. You cannot derive the permission to ignore evidence solely from knowledge of *P*. However, this relocation highlights a normative warning: while knowledge does not logically permit dogmatism, high confidence often psychologically encourages it. The paradox fails as a proof, but succeeds as a caution against confusing confidence with justification.

  ***

  ### Marking Scheme (25 Marks Total)

  | Component | Marks | Criteria for Full Marks | Common Error (Deduction Guide) |
  | :--- | :---: | :--- | :--- |
  | **1. Statement of Paradox** | 5 | Clearly reconstructs the three-step argument (Knowledge → Misleading → Ignore). | Vague summary; misses the link between truth of *P* and status of evidence. |
  | **2. Application to Case** | 5 | Applies the steps specifically to Alex, the portal, and the classmate's testimony. | Abstract discussion only; ignores the specific details of the prompt's case. |
  | **3. Diagnostic Core (Ambiguity)** | 10 | Identifies the equivocation on "misleading" (False/Fake vs. Outweighed/Genuine but wrong). Shows why P1 needs one sense and P2 needs the other. | Claims the paradox is "just wrong" without locating the specific inferential slide; treats "misleading" as univocal. |
  | **4. Resolution & Stance** | 5 | Takes a clear stance (kills vs. relocates) and justifies it based on the diagnostic core. | Fence-sitting ("both sides have merit"); claims fixing it solves everything without qualification. |
  | **Total** | **25** | | |

  **A-vs-B Separator**
  *   **B Answer (Mid-range):** Correctly states the paradox and applies it to Alex. Argues that knowledge shouldn't make us dogmatic. May mention that evidence can be "true or false" but fails to show *why* the inference breaks down logically. Treats the solution as a normative claim ("we shouldn't ignore people") rather than a logical diagnosis.
  *   **A Answer (Top-range):** Explicitly isolates the two senses of "misleading" and demonstrates that the argument is valid only if the term shifts meaning mid-stream. Shows that maintaining a consistent definition breaks the chain of inference. Takes a definitive stance on whether the paradox is dead or moved.

  **Grading Note:** Do not penalize students for lacking citations. This is a test of argumentative reconstruction, not literature review. Penalize heavily if they claim knowledge *does* permit ignoring evidence without qualifying the sense of "misleading."
