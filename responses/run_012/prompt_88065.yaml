answer: |-
  Dear [Supervisor's Name],

  I am writing to set out the proposal for the internal grant application, which I hope will secure the buy-out for the next eight months. As we have discussed, the project centres on a structural problem in the literature on idealised preferences that I believe is currently being overlooked. The standard debate focuses almost exclusively on the inputs to the idealisation process, arguing over whether full information, vivid imaginative acquaintance, or coherence is the correct ingredient for transforming actual preferences into normative ones. There is also the more ambitious strand from the AI alignment literature regarding coherent extrapolated volition, which attempts to extrapolate moral development rather than merely informing the agent. However, all these accounts presuppose an operator that takes a real person's messy, gappy, and partly incoherent preferences and outputs a tidied-up set, and hardly anyone asks what a well-behaved operator would have to look like before any of that input talk even gets off the ground. My proposal is to treat this operator not as a black box but as the primary object of analysis. The precise question I intend to answer is whether there exist structural constraints on the idealisation operator that are necessary for it to yield normative authority, and if so, whether any existing accounts satisfy them. I suspect that two conditions do most of the work here. The first is idempotence, meaning that idealising an already idealised agent should not move its preferences any further, otherwise there is no reason to think one pass rather than five is the authoritative one. The second is what I am calling description-invariance, which requires that the output should not depend on how the agent's preferences happen to be carved up or presented, since otherwise one can gerrymander the result by redescription. My hunch is that the standard accounts each fail at least one of these conditions, and that these failures are interesting rather than embarrassing because they mark a genuine fork between idealisation as a discovery procedure, where there is a fact about what you really want and idealising reveals it, and idealisation as a construction, where the idealised set is stipulated and its authority is moral rather than epistemic.

  The reason existing positions leave this open is that they tend to assume the operator is benign or transparent. When proponents of the full-information account argue against the coherence account, they are arguing about the state of the agent after the operation, not the properties of the operation itself. They assume that if you get the inputs right, the output will automatically be stable and robust. By shifting the focus to the operator, I aim to show that this assumption is unwarranted. If an operator is not idempotent, it implies that the idealised self is not a fixed point but a moving target, which undermines the claim that it represents what the agent really wants. If it is not description-invariant, it implies that the normative verdict depends on the framing of the preferences rather than the preferences themselves, which opens the door to manipulation. The literature has not grappled with this because it has been too focused on the metaphysical status of the idealised preferences rather than the functional properties of the mechanism that generates them. My project will test the hypothesis that these two conditions are necessary for normative authority and that failing them forces a choice between the discovery and construction models.

  Regarding the method, I will be working part-time over the eight months funded by the grant. In the first two months, I will focus on formalising the operator and the two conditions. This will involve defining the preference space and the mapping function precisely enough to test for idempotence and description-invariance without getting bogged down in unnecessary mathematical complexity. The goal here is not to produce a new formal system but to create a rigorous framework for conceptual analysis. Months three and four will be dedicated to applying these conditions to the standard accounts. I will take the full-information view, the coherentist view, and the extrapolated volition view as case studies, reconstructing their operators as charitably as possible and testing them against the conditions. This is where the philosophical work really happens, because determining whether a account fails idempotence is not a matter of running a calculation but of interpreting what the account claims the operator is doing. Months five and six will be spent developing the implications of the failures. If an account fails idempotence, does it collapse into constructionism? If it fails description-invariance, is it vulnerable to framing effects that undermine its normative force? I will use this period to draft the core arguments of the paper. The final two months will be for writing up and refining the argument, ensuring that the formal scaffolding supports the philosophical conclusion rather than distracting from it.

  I want to be clear about why this is philosophy rather than just formal hand-waving. The formalism is a tool for clarity, not the end product. I am not trying to prove a theorem for its own sake but using the formal constraints to expose conceptual tensions in the existing literature. The value of the project lies in the philosophical interpretation of the formal results, specifically the fork between discovery and construction. If I were merely doing formal modelling, I would be interested in whether the operator converges. Since I am doing philosophy, I am interested in what it means for normative authority if it does not converge, or if it converges only under arbitrary descriptions. The formal work serves to make the conceptual claims precise and testable, but the payoff is in the metaethical implications.

  As for the expected result, I anticipate showing that no existing account satisfies both conditions without making substantive moral assumptions that push it towards the constructionist fork. A successful outcome would be a paper that demonstrates this dilemma and argues that proponents of idealisation must either revise their operators to meet the conditions or admit that their project is constructivist rather than realist. A failure condition would be if it turns out that the conditions are too strong and rule out any possible operator, including intuitively plausible ones, or if the existing accounts can be easily patched to satisfy the conditions without significant revision. If the latter turns out to be true, the project would still have value in clarifying the commitments of those accounts, but it would not support the stronger hypothesis about the discovery-construction fork. I need to be honest about the scope here. Eight thousand words is a standard length for a journal article, but it is tight for a project that involves formal modelling, case studies of multiple accounts, and a substantial metaethical conclusion. I think it is manageable if I restrict the case studies to the two or three most prominent accounts rather than attempting a comprehensive survey. The risk is that the formal setup takes up too much space, leaving little room for the philosophical discussion. I plan to keep the formalism in the main text to a minimum, perhaps moving heavier proofs to an appendix if the grant allows for supplementary material, so that the word count is dedicated to the argument. If I find that I cannot do justice to the constructionist implications within the limit, I may need to narrow the focus to just the discovery model and leave the constructive alternative for future work.

  I believe this project is feasible within the timeframe and word count, provided I stay disciplined about the scope. The core idea is solid enough to sustain a paper, and the gap in the literature is genuine. I am confident that focusing on the operator itself will yield fresh insights that the standard input-focused debates have missed. Please let me know if you think this approach aligns with what the grant committee will be looking for, or if you think I should adjust the emphasis on the formal modelling versus the metaethical implications. I am happy to refine the proposal further based on your feedback before submission.

  Best wishes,

  [Your Name]
