      *(Final check of the "Smoker" point)*: Pete tried to use the smoker to distinguish liking/wanting. Nora used it to show they come apart. Pete agreed liking is the key. This actually concedes Nora's point that "seeking" isn't enough, forcing him back to "liking," which brings him back to the "what is liking?" problem (Move 3). Pete is running in a bit of a circle here. I should point that out.

