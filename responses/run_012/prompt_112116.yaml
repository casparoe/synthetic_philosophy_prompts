      *   **Move 5: Nora's Counter (Collapse into Desire Theory).**
          *   *Claim:* This makes it about the *relation* (liking/wanting), not the *state*. Also, wanting $\neq$ liking (Smoker case).
          *   *Philosophical Context:* Distinguishing Hedonism from Desire Satisfactionism. The "Liking vs. Wanting" distinction (Berridge).

      *   **Move 6: Pete's Defense (Liking is Primitive).**
