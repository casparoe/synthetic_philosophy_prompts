answer: |-
  # The Identity of Indiscernibles Decision Tree

  This instrument is designed to bypass the verbal stalemate. Do not look at the position labels until you reach the end. Answer each question based on your immediate intuition about the case described.

  ### Node 1: The Black World
  Imagine a universe containing nothing but two perfectly identical iron spheres, mirrored about a midpoint. No observers, no background space, just the spheres. Is this scenario **metaphysically possible**?
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to **Node 2**.

  ### Node 2: Relational Properties
  In that two-sphere universe, does Sphere A have a property that Sphere B lacks, such as *"being five miles from Sphere B"*?
  *   **Yes:** Go to **Node 3**.
  *   **No:** Go to **Node 5**.

  ### Node 3: The Set Test
  Assume Sphere A and Sphere B are distinct objects. Consider the set containing only A, `{A}`, and the set containing only B, `{B}`. Are these two sets distinct from each other?
  *   **Yes:** Go to **Node 4**.
  *   **No:** Go to **Leaf B**.

  ### Node 4: Impure Properties
  If `{A}` and `{B}` are distinct, does that mean Sphere A has the property *"being a member of {A}"* which Sphere B lacks?
  *   **Yes:** Go to **Leaf B**.
  *   **No:** Go to **Node 5**.

  ### Node 5: The Bundle Question
  If the two spheres share absolutely every property (qualitative, relational, and set-theoretic), are they nevertheless **two distinct objects**?
  *   **No (They are one object):** Go to **Leaf C**.
  *   **Yes (They are two objects):** Go to **Node 6**.

  ### Node 6: Spacetime Points
  Imagine an empty universe containing only a symmetric grid of spacetime points. Are two symmetric points (e.g., one left, one right) **distinct individuals**, or are they just placeholders in a structure?
  *   **Placeholders (Not distinct individuals):** Go to **Leaf D**.
  *   **Distinct Individuals:** Go to **Node 7**.

  ### Node 7: The Swap
  Return to the two-sphere universe. Suppose the spheres instantly trade places. Is the resulting state of affairs **numerically different** from the original one?
  *   **Yes:** Go to **Leaf E**.
  *   **No:** Go to **Node 8**.

  ### Node 8: Modal Scope
  Is the principle *"distinct objects must differ qualitatively"* a truth of **logic** (true in every possible world), or just a feature of **our world**?
  *   **Logic (Every World):** Go to **Node 9**.
  *   **Our World (Contingent):** Go to **Node 10**.

  ### Node 9: The Three-Sphere Test
  If PII is logically necessary, consider a world with three spheres in a row (A-B-A). Is it possible for the two A spheres to be distinct without any qualitative difference?
  *   **No (Impossible):** Go to **Leaf A**.
  *   **Yes (Possible):** Go to **Unoccupied Leaf 1**.

  ### Node 10: Electrons
  In our actual world, consider two identical electrons in the same atom. Do they possess individual identities beyond their quantum state?
  *   **Yes:** Go to **Unoccupied Leaf 2**.
  *   **No:** Go to **Leaf F**.

  ---

  ### The Leaves

  **Leaf A: Strong PII**
  *   **Position:** The Principle of Identity of Indiscernibles is a logical necessity; Black's world is impossible.
  *   **Awkward Commitment:** You must deny the coherence of a scenario that seems perfectly clear to the imagination, effectively claiming that conceptual clarity is not evidence of possibility.

  **Leaf B: Weak PII**
  *   **Position:** The Principle holds because objects always differ in some relational or impure property (like spatial relations or set membership).
  *   **Awkward Commitment:** You must accept that trivial facts (like *"being a member of the set containing me"*) count as genuine properties that ground numerical distinctness.

  **Leaf C: Bundle Theory**
  *   **Position:** Objects are nothing over and above their properties; if properties are identical, the object is identical.
  *   **Awkward Commitment:** You have to deny that Black's universe contains two spheres, insisting instead that there is only one sphere (or no spheres), contradicting the setup's stipulation of "two."

  **Leaf D: Structuralism (Spacetime)**
  *   **Position:** Spacetime points are not independent objects but nodes in a relational structure; symmetry implies identity.
  *   **Awkward Commitment:** You must treat spacetime differently from material objects, accepting that matter can be distinct without qualitative difference while points cannot.

  **Leaf E: Haecceitism**
  *   **Position:** Objects possess a primitive "thisness" (haecceity) distinct from their qualitative properties.
  *   **Awkward Commitment:** You must accept that there are facts about the world (e.g., *"which sphere is which"*) that make no difference to how the world looks, feels, or behaves.

  **Leaf F: Contingent PII**
  *   **Position:** The Principle is true in our world (perhaps due to physical laws) but not metaphysically necessary.
  *   **Awkward Commitment:** You must explain why identity supervenes on qualities here but not elsewhere, without a clear account of what metaphysical mechanism turns the principle on or off.

  **Unoccupied Leaf 1: The Logical Exception**
  *   **Position:** PII is a truth of logic, yet Black's world (or the three-sphere world) is possible.
  *   **Status:** **Incoherent.** This combination asserts that a logical contradiction is metaphysically possible. No one defends this because it collapses the distinction between logical and metaphysical necessity.

  **Unoccupied Leaf 2: Quantum Haecceitism**
  *   **Position:** PII fails in our world, and electrons have primitive identities despite quantum indistinguishability.
  *   **Status:** **Unattractive/Unexplored.** While some argue for "hidden variables," most physicists and philosophers accept that quantum statistics require treating electrons as non-individuals; insisting on their individuality adds ontology with no explanatory payoff.

  ---

  ### Note on Separation
  This tree cannot cleanly separate **Weak PII** from **Haecceitism** if a respondent believes relational properties exist *but* also believes in primitive thisness. In practice, these views often overlap, but the tree forces a choice based on whether relational properties *exhaust* the grounds for distinctness. If you think relations distinguish them *and* they have haecceities, you should follow the **Weak PII** path, as the haecceity becomes redundant.
