answer: |-
  The concept of truthlikeness, or verisimilitude, was introduced by Karl Popper to salvage the idea of scientific progress from the reality of falsification. If all scientific theories are ultimately false, as Popper believed, we still want to say that Einsteinian physics is an improvement over Newtonian physics, and that Newtonian physics is an improvement over Aristotelian physics. We need a way to say that one false theory is closer to the truth than another. Popper's original proposal treated a theory's verisimilitude as a function of its logical consequences. Roughly, theory A is closer to the truth than theory B when the true consequences of A include all the true consequences of B, while the false consequences of A are all among the false consequences of B. This elegant logical formulation was intended to provide an objective measure of progress, but it faced a devastating critique in 1974. Pavel Tichý, David Miller, and others showed independently that on this comparative definition, no false theory is closer to the truth than any other. To understand why this matters and whether the notion of truthlikeness should be abandoned or repaired, we must test the definition on a concrete case rather than simply gesturing at the formal proof.

  Consider a world described by three independent facts, A, B, and C. Suppose the truth is that A and B hold, but C does not. We can represent the truth as the conjunction A and B and not-C. Now compare two false theories. The first false theory, let us call it H1, claims that A, B, and C all hold. The second false theory, H2, claims that none of them hold, meaning not-A, not-B, and not-C. Intuitively, H1 is much closer to the truth than H2. H1 gets two facts right and only one wrong, whereas H2 gets all three facts wrong. However, under Popper's definition, we must look at the sets of true and false consequences. H1 implies A, which is true, and B, which is true. But H1 also implies C, which is false. H2 implies not-C, which is true. But H2 also implies not-A and not-B, which are false. For H1 to be closer to the truth than H2, the true consequences of H2 must be a subset of the true consequences of H1. Yet H2 has the true consequence not-C, while H1 implies C and therefore cannot imply not-C. Thus, the condition on truth content fails. Similarly, for H1 to be closer, its false consequences must be a subset of H2's false consequences. H1 has the false consequence C, but H2 implies not-C and therefore does not imply C. Thus, the condition on falsity content also fails. The comparison shows that under Popper's logical formulation, H1 and H2 are incomparable. This result destroys the consequence approach as originally formulated because logical entailment spreads truth and falsity too widely; a single error contaminates the entire set of consequences in a way that prevents ordering false theories.

  This failure forces proponents of truthlikeness into two directions of repair. The first keeps the consequence framework but attempts to count only consequences that are, in some technical sense, relevant or essential, such as atomic states of affairs rather than their infinite logical disjunctions. If we count only atomic consequences, H1 scores two truths and one falsehood, while H2 scores one truth and three falsehoods, restoring the intuitive ranking. The second direction abandons the consequence framework entirely and takes the idea of likeness literally. This approach scores a theory by the similarity of the possible worlds it permits to the actual world, often averaged over those worlds. In our test case, the actual world is one step away from H1's world but three steps away from H2's world, so H1 is ranked as closer. While the likeness approach handles the test case successfully, it faces a general and severe objection regarding vocabulary. The ranking of theories can become an artefact of the language used to describe the world. If we construct a language with the same logical structure but different predicates, such as defining a new property D that holds if and only if A is equivalent to C, the similarity ordering among predicates can change. Consequently, the ranking of two theories can be reversed while nothing about the world changes. This suggests that truthlikeness is not an objective feature of the relation between theory and world, but depends on our conceptual scheme.

  Given these difficulties, the verdict must be that truthlikeness survives only as a comparative, informal notion with no metric. The attempt to formalize truthlikeness as a precise logical measure fails because logical consequence is too coarse-grained, and the attempt to formalize it as a similarity metric fails because similarity is language-relative. However, abandoning the notion entirely would be too pessimistic about scientific practice. Scientists clearly operate with the intuition that some models are better approximations than others, even when both are known to be strictly false. We can defend the use of the notion informally by acknowledging that it relies on metaphysical assumptions about natural kinds rather than pure logic. When we say a theory is closer to the truth, we are implicitly assuming that our vocabulary carves nature at its joints. If our predicates refer to genuine natural properties, then the vocabulary objection loses its force because not all linguistic transformations are ontologically equal. But this moves the justification from formal logic to metaphysics, meaning we cannot have a context-independent metric. We can compare theories within a framework of accepted natural kinds, but we cannot measure truthlikeness absolutely.

  This verdict implies that the claim that science makes progress toward the truth must be understood as a regulative ideal rather than a logically provable trajectory. Science progresses by refining its ontology and improving the fit between its models and the causal structure of the world, but there is no algorithm to calculate this progress. We recognize progress retrospectively and comparatively, based on increased predictive success and explanatory coherence, rather than by calculating a verisimilitude score. This preserves the realist intuition that science gets things right more often over time without committing us to a flawed formalism that claims to measure the unmeasurable. It acknowledges that while we aim for the truth, our access to it is always mediated by our conceptual resources.

  The strongest objection to this conclusion is that reducing truthlikeness to an informal notion renders it philosophically useless. If there is no metric, the claim that science progresses toward the truth becomes merely a matter of faith or sociological consensus, stripping realism of its objective bite. Critics might argue that without a formal definition, we cannot distinguish genuine progress from mere changes in theory that feel like progress to us. However, this objection assumes that objectivity requires formalization, which is a mistake. Objectivity in science is secured through intersubjective testing, replication, and causal engagement with the world, not through logical metrics. The informal notion of truthlikeness is sufficient to guide research and evaluate theories because it is anchored in empirical success and ontological commitment. We do not need a calculator to know that a map with fewer errors is better than a map with more errors, even if we cannot formally define map accuracy independent of the projection used. Defending truthlikeness as an informal notion accepts the limits of logical analysis while preserving the core insight that drives scientific inquiry: that our errors can be corrected, and our theories can converge on the way the world actually is.
