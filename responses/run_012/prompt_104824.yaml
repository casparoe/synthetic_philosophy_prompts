      *   **Detailed Analysis of Theories:**
          *   *Intuitionism:* Rejects (2). Basic beliefs are self-evident. Keeps (1). Modifies (5).
          *   *Reflective Equilibrium:* Rejects (2). Justification is holistic, not linear. Keeps (1). Modifies (5).
          *   *Expressivism:* Accepts (6) but reinterprets "rational procedure." Keeps (1) and (5). Changes the nature of moral claims.
      *   **Addressing the Specific Constraint (Keep 1 & 5):**
          *   It is very hard to keep (1) and (5) strictly as written and deny (6).
