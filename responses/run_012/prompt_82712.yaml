prompt: |-
  I'm in the middle of a decision I can't stop thinking about and it's making me insane: my old employer is offering a buyout, take the lump sum now or stay in the scheme and get the guaranteed monthly amount at 65. I'm 38. Everyone has an opinion, but my friend Dev, who did an econ masters and now explains economics to everyone at parties, keeps saying "you can't put a probability on a unique event" and citing Keynes at me. His line is that this whole situation is uncertainty and not risk, and that any number I put on it is fake precision. Fine. But then I asked whether that means the scheme's actuaries are just making stuff up, and he said "well the probability of the scheme being wound up is low anyway" — which is him putting a probability on it, right? And when I said I have to think about the next 30 years he said something about how in the long run we're all dead, which I'm pretty sure is a Keynes line, but I can't tell if thats the same complaint as the first one or a totally different one.

  What I want is a menu: the different precise things "you can't put a probability on a unique event" could actually be claiming, ordered from the boring to the load-bearing, with a verdict on each — trivially true, genuinely debatable, or just false. And say which one Dev is really invoking when he uses it to tell me to stop running expected values on my own life. For each reading, what does it imply I should actually do — is there a version where he's right and I should just go with my gut, and a version where he's wrong and I should do the math and stop agonizing? One thing I keep getting stuck on: is his claim that there's no number, or that we don't know the number? Those seem like seperate claims but he talks like they're the same one. Also tell me whether the two things he said contradict each other or whether he's just quietly sliding between two readings, because it's started to feel like a magic spell he pulls out whenever he doesn't like my spreadsheet. Please don't tell me to go read the Treatise, I tried and bounced off it in about ten pages.
