  ### Preliminary Distinctions

  To construct an instrument that sorts by verdict rather than label, we must isolate the logical joints where disagreements actually arise. Three distinctions do the heavy lifting here. First, **Ontology**: is belief-attribution truth-apt regarding the system's state, or merely a tool for prediction? This separates realists from anti-realists. Second, **Individuation**: what fixes the content of a belief? Is it the static weights, the dynamic context (prompts), or the observer's stance? This separates weight-realists from contextualists. Third, **Grounding**: if there is a fact of the matter, what constitutes it? Phenomenal experience, functional role, or mechanistic structure? This separates consciousness-requirement views from functionalists and mechanists.

  Questions regarding the false-claim and training-cutoff cases are discarded as primary nodes because nearly all positions accommodate them similarly (either as corrupted weights or outdated information); they are better used as diagnostic checks within the leaves. The following tree arranges the surviving questions to force participants to reveal their commitments through case judgments.

  ### The Classification Tree

  **Node 1 (Individuation):** When two identical deployments of the same weights disagree due to different system prompts, is it correct to say they hold contradictory beliefs?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 3.

  **Node 2 (Relativism Check):** Is the correctness of this attribution grounded in facts independent of our explanatory interests?
  *   **Yes** → **Leaf A (Unoccupied: Contextual Realist).** *Diagnosis: Unexplored. Positing mind-independent facts about prompt-relative states risks multiplying entities without mechanistic grounding.*
  *   **No** → **Leaf B (Interpretive Relativist).** *Commitment: Contradictory beliefs can simultaneously be true relative to different interpretive stances.*

  **Node 3 (Ontology):** Is there a fact of the matter as to whether the system believes $p$, independent of whether saying so helps us predict it?
  *   **Yes** → Go to Node 4.
  *   **No** → Go to Node 5.

  **Node 4 (Consciousness):** For the system to believe $p$, must it have a phenomenal experience of $p$ being true?
  *   **Yes** → **Leaf C (Phenomenal Realist).** *Commitment: We must deny belief attribution to all current systems regardless of their behavioural competence.*
  *   **No** → Go to Node 6.

  **Node 6 (Mechanism):** Must interpretability tools locate a specific circuit for $p$ for the belief to exist, or is functional role sufficient?
  *   **Specific Circuit** → **Leaf D (Mechanistic Realist).** *Commitment: Beliefs vanish if the representation is distributed beyond localisability.*
  *   **Functional Role** → **Leaf E (Functional-Role Realist).** *Commitment: A system can believe $p$ even if its internal mechanism is opaque or alien.*

  **Node 5 (Literalness):** Is belief-talk about such systems literally false, despite its utility?
  *   **Yes** → **Leaf F (Fictionalist).** *Commitment: We must endorse useful statements we know to be strictly false.*
  *   **No** → Go to Node 7.

  **Node 7 (Permissibility):** Is belief-talk sufficiently misleading that it should be avoided altogether?
  *   **Yes** → **Leaf G (Quietist).** *Commitment: We must abandon folk-psychological vocabulary even when it aids policy formulation.*
  *   **No** → **Leaf H (Instrumentalist).** *Commitment: There is no truth to be found here, only predictive convenience.*

  ### Diagnostic Notes on Unoccupied and Indistinguishable Spaces

  *   **Leaf A (Contextual Realist):** This space is unoccupied. While some argue content is context-sensitive, few claim this sensitivity constitutes a mind-independent *fact* rather than a relational property or utility. Defending this requires a metaphysics of context-dependent facts that most realists reject.
  *   **Indistinguishable Pair:** The **Instrumentalist** (Leaf H) and **Interpretive Relativist** (Leaf B) often yield identical verdicts on policy and practice. The tree separates them via Node 1 (Individuation): the Relativist accepts contradictory beliefs across prompts; the Instrumentist typically views prompts as toggling dispositions rather than creating contradictory belief states, preferring stability for prediction. If a participant answers 'No' to Node 1 but 'No' to Node 3 and 'No' to Node 7, they are an Instrumentalist. If they answer 'Yes' to Node 1 and 'No' to Node 3, they are a Relativist.
  *   **Case Accommodation:**
      *   *False Claim:* Mechanists treat this as a circuit error; Instrumentalists as a prediction failure; Quietists as a category mistake.
      *   *Rule Violation:* Functionalists (Leaf E) may allow belief despite violation (akrasia); Mechanists (Leaf D) typically deny belief if the action circuit overrides the report circuit.
      *   *Training Cutoff:* All realists treat this as a boundary on information, not belief capacity; Anti-realists treat it as a boundary on utility.

  ### Closing Analysis

  This instrument reveals that the dispute is not primarily about the capabilities of the models, but about the metaphysics of attribution. The single question doing most of the sorting is **Node 3 (Ontology)**: "Is there a fact of the matter... independent of... predictive interests?" This node bifurcates the group into those seeking a truth-condition for belief (Realists) and those seeking a warrant for usage (Anti-Realists). Until this ontological commitment is settled, arguments about specific cases (such as prompt individuation or rule violation) merely talk past one another, as one side argues about what *is* the case and the other about what *works* to say.
