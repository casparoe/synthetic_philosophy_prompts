answer: |-
  ### The Example: The Saturday Gardener

  Consider an agent, Elena, who is a dedicated amateur gardener. She works a standard job that pays her bills, and she has no surplus wealth to donate. On a particular Saturday morning, she plans to spend four hours tending to her rose bushes. This is not a professional obligation, nor does it produce significant public beauty; it is a personal project that brings her deep satisfaction and constitutes a part of her identity.

  A consequentialist calculation reveals that if Elena were to spend those four hours instead stuffing envelopes for a local political campaign known to promote policies that slightly increase aggregate welfare, the world would be marginally better off. The difference in utility is small—perhaps equivalent to a few dollars' worth of improved social welfare—but it is positive. The sacrifice required of Elena is trivial in the grand scheme of moral demands: it is merely four hours of leisure on a single weekend. She will not be impoverished, exhausted, or prevented from pursuing her career.

  However, Elena objects to the requirement that she stuff envelopes. Her objection is not that four hours is too much time to give up (a cost-based objection). Her objection is that the theory treats her desire to garden as having no *deliberative authority* simply because it is hers. According to consequentialism, her project counts only insofar as it contributes to the impartial good. Since the envelope-stuffing produces more good, her personal project is overridden. She cannot justify her choice by saying, "This is my life and my hobby"; she can only justify it if she can prove gardening maximizes utility better than campaigning.

  ### Why the Objection Has Force

  In this scenario, the standard "demandingness objection"—which usually argues that consequentialism requires agents to sacrifice too much wealth or well-being—fails to gain traction. Elena is not being asked to live in poverty or die for the cause. The cost of compliance is negligible.

  Yet, the objection retains force because it targets the **structure of justification** rather than the **magnitude of sacrifice**. The core of the objection is that consequentialism alienates the agent from their own actions by denying personal projects independent normative weight.

  1.  **Lack of Deliberative Authority:** Elena's project (gardening) is subordinated entirely to the impartial calculus. Even though the stake is low, the *principle* is that her personal interests possess no intrinsic authority. They are merely preferences to be weighed against the preferences of strangers.
  2.  **Integrity and Identity:** As Bernard Williams argued regarding integrity, if an agent cannot act on their ground projects without an external justification, they become a mere channel for the satisfaction of utility. In Elena's case, requiring her to abandon her hobby for a trivial gain in social utility treats her as a resource for the general good rather than an author of her own life.
  3.  **The "One Thought Too Many":** To comply, Elena must view her love for gardening instrumentally. If she asks, "Why should I garden?" the only permissible consequentialist answer is "Because it does the most good." She is barred from the natural answer: "Because I love it."

  ### What This Shows About "Less Demanding" Theories

  This example demonstrates that **making consequentialism less demanding does not answer the objection regarding deliberative authority.**

  Proponents of consequentialism often respond to demandingness objections by modifying the theory to be less stringent. For example, they might propose **satisficing consequentialism** (agents need only produce "good enough" outcomes, not the *best*) or **agent-centered prerogatives** (agents are permitted to prioritize their own interests up to a certain ratio).

  However, the "Saturday Gardener" case shows that these modifications fail to address the root of the authority-based objection:

  1.  **Structural Subordination Remains:** Even a "less demanding" theory (e.g., "You only need to maximize utility 80% of the time") maintains the structural hierarchy where the impartial good is the ultimate arbiter. In Elena's case, if the utility gap between gardening and envelope-stuffing widens slightly, or if she has already used up her "80% leisure allowance" for the month, the theory still demands she abandon her project. The personal project still lacks *independent* authority; it is merely tolerated within a margin of error.
  2.  **The Threshold Problem:** If the objection is that personal projects should carry their own weight, setting a threshold for when they can be overridden does not grant them that weight. It merely changes the point at which they are crushed. A theory that says "You can garden unless the social benefit is *very* high" is structurally identical to one that says "You can garden unless the social benefit is *slightly* high." In both cases, the justification for gardening is contingent on the state of the world, not on Elena's agency.
  3.  **Alienation is Not Solved by Frequency:** The alienation Elena feels comes from the fact that she cannot cite her own desires as ultimate reasons for action. Reducing the frequency with which she is forced to sacrifice those desires (making the theory less demanding) reduces the *burden*, but it does not restore the *authority*. She remains a servant of the impartial good, merely one with more vacation time.

  **Conclusion:**
  The "Saturday Gardener" example illustrates that the demandingness objection is not solely about the *cost* of morality, but about the *source* of moral reasons. Consequently, attempts to answer the objection merely by lowering the cost (making the theory less demanding) are insufficient. To fully answer the objection, a theory must grant personal projects deliberative authority of their own (as deontological or virtue ethical theories might), rather than simply reducing the frequency with which those projects are overruled by the impartial calculus.
