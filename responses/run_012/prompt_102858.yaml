      *Focus:* The moment of transition. The sacrifice of the many for the sake of the one.

      *(Wait, one more thing)*: The prompt asks for the idea to do work in the plot. The plot *is* the procedure. The conflict is internal (Many vs One) manifested externally (Patient vs Technician/Machine).

