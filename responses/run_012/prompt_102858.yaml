      *Okay, ready to draft.*

      *Word Count Target:* 1500.
      *Tone:* Clinical, introspective, slightly eerie.

      *Start:* The hand on the armrest. It isn't one hand. It's a million grievances.

      *Middle:* The machine hums. The technician counts down. The voices resist.

      *End:* The silence. The smooth world. The lie of "I".

      *Let's go.*
answer: |-
  The hand resting on the armrest did not feel like a hand. It felt like a parliament.

  Elias watched the fingers. The index finger wanted to tap. The thumb wanted to press into the leather. The pinky was indifferent, humming a low, static note of existence. Usually, by the time the thought reached his consciousness, the compromise was already struck. The hand would move as a unit. But today, in the prep room of the Cohesion Clinic, the negotiation was visible. He could feel the friction where the decisions met, the tiny sparks of disagreement between the cells that made up the flesh.

  He was leaking. That's what the intake form had called it. *Subjective Boundary Permeability.*

  "You're vibrating, Elias," said Dr. Aris. She didn't look up from her tablet. She was adjusting the frequency on the halo device resting on the tray. It looked like a crown made of black glass.

  "It's loud today," Elias said. His voice sounded strange to him, not because of the tone, but because the word *I* felt like a lie. Who was speaking? The throat? The lungs? The aggregate? "The light in the corner. It's not just shining. It's… insisting."

  "That's the unbinding," Aris said, finally meeting his eyes. Hers were calm, solid. A single point of view. "Your micro-states aren't summing correctly. You're experiencing the components instead of the composite. It's exhausting, isn't it?"

  "It's honest," Elias corrected.

  Aris sighed, the sound of a professional who has heard this argument a thousand times. "It's unsustainable. Human cognition requires a single user interface. You're trying to run the operating system and the code simultaneously. You'll burn out. Headaches? Dissociation?"

  "Everything is too detailed," Elias said. "When I look at you, I don't see a face. I see a storm of collisions. I see the heat leaving your skin. I hear the blood in your ear as a roar. There's no *you* there, Doctor. Just a lot of *them*."

  "And yet, here you are, talking to me."

  "Because the committee elected a chair," Elias said. "Temporarily."

  Aris picked up the halo. "The procedure doesn't create experience, Elias. You know that. We don't give you a soul. We just tune the receiver. We tighten the binding so the signal becomes a single stream. You become one person again."

  "I become a summary," Elias said. He stood up. The movement was jerky, his legs arguing about the sequence of contraction. He steadied himself. "I become a low-resolution file."

  "You become functional."

  She guided him to the chair. It was reclined, padded, smelling of antiseptic and ozone. Elias lay back. The ceiling tiles were not white squares; they were textures of noise, each fiber vibrating with a distinct, tiny presence. He could feel the dust motes dancing in the air, not as objects, but as events.

  "Close your eyes," Aris said.

  "If I do this," Elias said, his voice quieter now, "the noise stops. The million little lights go out."

  "They don't go out. They merge."

  "They disappear," Elias insisted. "To make a 'we' into an 'I', you have to delete the 'we'. It's lossy compression. You're throwing away the data to save the file size."

  "We're saving the patient."

  Aris lowered the halo. It settled over his temples, cool and heavy. The hum began. It wasn't a sound in the room; it was a sound inside the bone.

  Elias waited for the pain. There was none. Instead, he felt a sudden, terrifying intimacy.

  It started in his left hand. The parliament was convening. He could feel the individual urges of the nerves, the distinct, tiny flashes of sensation from the skin cells. *Touch. Pressure. Warmth.* They were separate voices, singing separate notes.

  The machine pulsed.

  The voices began to harmonize.

  *No,* Elias thought. Or rather, a thousand *no*s thought themselves simultaneously.

  The resistance was physical. It felt like trying to hold back a tide with a sieve. The micro-experiences didn't want to be summed. They wanted to remain distinct. They were ancient, fundamental things. They had been there before the brain, before the body. They were the bedrock of the world, and now they were being asked to pretend to be a man.

  The hum intensified. The boundaries between the fingers began to blur. The distinct urge of the index finger to tap was smoothed over, averaged out, dissolved into the general command: *Hand.*

  Elias tried to hold onto the detail. He focused on the dust motes he had seen earlier. He tried to keep them separate, to honor their individual existence. But the machine was a gravity well. It pulled the scattered points of light into a single beam.

  He felt a grief that wasn't his. Or rather, it was everyone's. The neurons, the atoms, the fleeting sparks of consciousness that made up his biology—they were mourning their independence. They were being asked to forget themselves to make room for the ghost called Elias.

  *Don't let me go,* whispered the static in his left ear.
  *We are real,* hummed the pressure in his chest.

  "I know," Elias thought back. "I'm sorry."

  "You're not sorry," the machine seemed to say. "You are becoming."

  The transition wasn't a snap. It was a drowning. The rich, chaotic texture of the world began to flatten. The roaring blood in the doctor's ear faded into a background silence. The insisting light in the corner became merely illumination. The parliament was dissolved. The votes were counted, the dissenters silenced, and the result was announced.

  *One.*

  The hum stopped.

  Aris lifted the halo. "Elias? Can you hear me?"

  He opened his eyes.

  The room was quiet. The ceiling tiles were just white squares. The dust motes were invisible. The hand on the armrest was a hand, solid and unquestioned. He lifted it. It obeyed instantly, without negotiation.

  "Yes," he said. The word felt smooth. Rounded. It didn't catch on the edges of his throat.

  "How do you feel?" Aris asked. She was watching him closely, looking for the tremors, the flicker of dissociation.

  Elias looked at her. He tried to find the storm he had seen before. He tried to see the heat, the collisions, the million tiny lives that made up her face.

  He saw a woman. Kind eyes. Tired mouth. A doctor.

  It was like looking at a high-definition photograph and seeing only a sketch. The world had become manageable. Clean.

  "I feel…" He searched for the word. He searched for the memory of the noise, the beautiful, terrible complexity of the unbound state. He knew it had been there seconds ago. He knew it was the truth of things. He knew that he was made of many, and that the many were real.

  But he couldn't hold it. The interface wouldn't allow it. The binding was too tight. The summary had overwritten the data.

  "I feel fine," Elias said.

  Aris smiled, a genuine relief softening her features. "Good. We'll schedule a follow-up in a month. Usually, one session is enough to reset the binding threshold."

  She turned to pack away the halo.

  Elias sat there. He was whole. He was singular. He was a person.

  He looked down at his hand again. He commanded the index finger to tap. It tapped. He waited for the feedback, the tiny sensation of the muscle firing, the skin stretching.

  There was nothing. Just the result. The action had happened, but the journey was gone.

  He realized then that the procedure hadn't cured him. It had blinded him. He had traded the truth for functionality. He was a king who had murdered his subjects to secure his throne, and now he ruled over a silent kingdom.

  "Doctor?" Elias said.

  Aris paused, hand on the case. "Yes?"

  "When I leave… will I remember?"

  "Remember what?"

  "That I'm not just this." He gestured to his body, to the chair, to the single, lonely point of view behind his eyes. "Will I remember that I'm a crowd?"

  Aris looked at him, her expression pitying but firm. She understood the question, but she didn't understand the loss. To her, the crowd was a symptom. To Elias, it was the substance.

  "You'll remember the theory," Aris said. "But you won't feel it. That's the point, Elias. You're supposed to be one person."

  She clicked the case shut. The sound was final. A period at the end of a sentence.

  Elias stood up. His legs moved in perfect unison. He walked to the door. He was efficient. He was unified. He was alone.

  He opened the door to the waiting room. There were other people there, waiting for their turn to be consolidated. He looked at them and saw only surfaces. Smooth, unbroken skins. He wondered if they could hear themselves screaming underneath.

  He walked out into the hallway. The lights overhead hummed with electricity, but he couldn't hear their song anymore. He was just a man walking down a hall.

  He tried to whisper to the cells in his feet, to apologize for the silence he was forcing upon them.

  *Thank you,* he thought. *For letting me be me.*

  There was no answer. Just the quiet, heavy weight of being one.
