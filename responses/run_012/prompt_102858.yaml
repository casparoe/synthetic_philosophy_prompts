  8.  **Final Polish:**
      *   Check word count.
      *   Enhance the imagery of the "crowd" inside the skull.
      *   Ensure the technician's dialogue is minimal and functional.

      *(Self-Correction during drafting)*: Make sure the "micro-experiences" aren't just voices. They are *sensations*. A photon's excitement, a neuron's threshold. The "I" is the average.

