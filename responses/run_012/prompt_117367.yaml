prompt: |-
  ok so this is going to sound like a small thing but its eating my life. Last night me and my mate Dan argued for about two hours about something that happened at our housing co-op and I still don't know who was right, and I have a board meeting on Thursday so I need to sort it out properly.

  I chair the board of a 34-unit housing co-op. We're self-managed, so the board is basically just residents with clipboards. Every month we get three to six complaints — noise, junk in the hallways, someone's dog, someone subletting without telling us, someone being a menace in the group chat. And roughly half the time the person complaining is themselves not clean. The guy who's furious about clutter has a whole bike-shed situation. The woman who wants us to fine people for late charges was in arrears herself for eight months. So when we try to act, the other person says the magic sentence — you can't say anything, you do it too — and half the time they're right and half the time it's just a way of getting out of it.

  Dan thinks the you-do-it-too move is always a dodge: a rule is a rule, if the complaint is true it's true, ignore who's making it. I think it matters but I can't say where the line is. I know there's a real philosophy literature about this — standing to blame, hypocrisy, all that — but I don't have it organised in my head well enough to run a meeting with it, and I'm not going to sit there citing things at my neighbours anyway.

  What I want is a procedure I can actually run. Before each meeting I want to sit down with the complaint list, go through each one in order, and come out with a decision. Checklist or decision tree in words: which questions to ask in what order, what counts as a good enough answer at each step, where it stops at no, and where it has to go to the board vote or to a person because it's a values call and the theory doesn't settle it.

  Stuff it has to handle, because these are the ones that keep biting us:

  - someone who did the exact same thing vs someone who did a related thing vs someone who's a general mess but not about this particular thing
  - someone who did it, stopped, and apologised vs someone still doing it while complaining
  - the person who says yeah I do this too, I'm not pretending otherwise, I'm still saying it — that doesn't look like hypocrisy to me at all, so does that person get to complain?
  - the difference between me privately thinking less of them and them losing the right to ask the board to enforce the actual rule. Those feel like seperate questions and I keep collapsing them.
  - the reverse case, where the board is the hypocrite: we let things slide for people we like and then come down hard on someone we don't, and then the complainer's own record is beside the point and it's us who's the problem.

  I also need to know what the person being complained about is entitled to do with all this. If someone lacks standing, does the complaint just die? Or do we still enforce it and only the moralising is off the table? Because in a co-op we have to enforce things regardless of who noticed them, and I suspect the honest answer splits into at least three things — someone's private opinion of you, someone publicly telling you off, and the actual rule with a fine attached — and I don't want that fudged.

  Then run it on three of our actual messes:

  1. A neighbour complains that the family opposite leaves a pram blocking the fire door. Genuine safety issue. But the complainer keeps his own bike in the hallway.
  2. Our treasurer wants us to start fining people who haven't paid. She was eight months behind herself, paid it all back and apologised at a meeting a year ago, and she's the only one who actually understands the accounts.
  3. A newish member gets caught subletting without permission and tells us the board is full of hypocrites because my best mate in the building has been doing exactly that for a year and we've never said a word. Which is true. I've been the one quietly making sure it never comes up.

  I'm expecting at least one of those to come back with an answer I don't like, and thats fine, tell me anyway.

  At the end, be straight about what the procedure can't do — where it's just laundering my own judgement, where the board has to decide something as a values question, and if part of this is genuinely contested, tell me which part and give me the two live positions instead of pretending there's one answer.

  No names, no reading list, no citations. I just want the thing itself.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a 34-unit self-managed housing co-op board.
      *   **Problem:** Constant arguments about hypocrisy ("you do it too") when enforcing rules. Dan (fellow board member) thinks rules are rules regardless of the complainer. The User thinks the complainer's behavior matters but can't articulate how/when.
      *   **Goal:** A practical procedure/checklist/decision tree to run before board meetings to determine how to handle complaints involving potential hypocrisy.
      *   **Constraints:** No names, no reading list, no citations. Just the tool.
      *   **Specific Scenarios to Test:**
          1.  Fire door pram (safety) vs. complainer's bike in hallway.
          2.  Treasurer (ex-arrears) wanting to fine late payers.
          3.  Subletting accusation vs. Board Chair's friend (also subletting, ignored by Chair).
      *   **Requirements:** Distinguish between private judgment, public shaming, and rule enforcement. Address what happens if a complaint lacks "standing." Address board hypocrisy.
      *   **Ending:** Be straight about limitations (where it's just laundering judgment, where it's a values call, contested areas).

  2.  **Deconstruct the Core Philosophical/Practical Issue:**
      *   The core tension is between *validity of the claim* (is the rule broken?) and *standing of the claimant* (do they have the moral right to enforce it?).
      *   In a co-op, rules are communal agreements, not just laws imposed from above. Therefore, the *culture* of enforcement matters as much as the *letter* of the rule.
      *   Hypocrisy undermines trust. Blind enforcement undermines fairness.
      *   Need to separate:
          1.  Is the rule actually broken? (Fact)
          2.  Is the complaint valid procedurally? (Process)
          3.  Does the complainer's behavior block enforcement? (Standing)
          4.  Does the Board's behavior block enforcement? (Equity/Selective Enforcement)

  3.  **Drafting the Procedure (The "Tool"):**
      *   *Structure:* Needs to be a step-by-step filter.
      *   *Step 1: Fact Check.* Is the rule actually broken? If no, stop.
      *   *Step 2: Safety/Legal Override.* Some things (fire doors) can't be ignored due to hypocrisy. This is crucial.
      *   *Step 3: The "Clean Hands" Test (Complainer).* Is the complainer doing the *exact* same thing?
          *   If yes: Do they admit it? Are they stopping?
          *   If no (related but different): Does it undermine the specific principle?
      *   *Step 4: The "Board Hands" Test (Enforcer).* Is the board enforcing selectively? (Crucial for Scenario 3).
      *   *Step 5: Outcome Determination.* What actually happens? (Warning, Fine, Mediation, Dismissal).
      *   *Distinction:* Separate "Moral Standing" (can they lecture?) from "Enforcement Trigger" (does the board act?).

  4.  **Refining the Logic (Self-Correction during drafting):**
      *   *Initial thought:* If the complainer is a hypocrite, dismiss the complaint.
      *   *Correction:* Bad idea for a co-op. If someone leaves a fire door blocked, it doesn't matter if the reporter smokes pot. The safety risk exists independently.
      *   *Refinement:* Distinguish between *safety/legal* issues and *norm/courtesy* issues. Safety trumps hypocrisy. Norms require consistency.
      *   *Initial thought:* If the Board is hypocritical, we can't enforce.
      *   *Correction:* If the Board is hypocritical, we must fix the Board's hypocrisy first, or the enforcement is illegal/unfair (selective enforcement).
      *   *Refinement:* Add a "Board Integrity Check." If the Board is violating the rule elsewhere, enforcement is paused until the Board regularizes.

  5.  **Applying to the Three Scenarios:**
      *   *Scenario 1 (Pram vs. Bike):* Safety issue. Hypocrisy is irrelevant to the *action*, but relevant to the *tone*. The pram must move. The bike must also be addressed (separately).
      *   *Scenario 2 (Treasurer Fines):* Norm/Financial issue. She stopped and apologized. This is "repentant hypocrisy." She has standing because she corrected the behavior. The rule stands.
      *   *Scenario 3 (Subletting vs. Chair's Friend):* Board Integrity issue. The Chair (User) is the problem here. The Board cannot enforce against Person A while ignoring Person B (especially if Person B is protected by the Chair). This is selective enforcement. The complaint is valid, but the Board is currently barred from acting until they act against the Friend.

  6.  **Addressing the "What happens to the complaint?" Question:**
      *   If standing is lost, does the complaint die?
      *   *Answer:* No. The *violation* exists independently of the *complainer*. The Board can take up the issue *sua sponte* (on its own motion) without referencing the hypocritical complainer.
      *   *Nuance:* If the Board is the hypocrite (Scenario 3), the enforcement is poisoned until the Board cleans its hands.

  7.  **Finalizing the Limitations/Caveats:**
      *   Acknowledge that this doesn't remove human judgment.
      *   Acknowledge that "Safety" vs. "Norm" is a values call.
      *   Acknowledge that selective enforcement is the hardest part.

  8.  **Review against Constraints:**
      *   No names? (Use "Complainer", "Accused", "Board").
      *   No citations? (Keep it practical).
      *   Straight talk? (Yes).
      *   Handle the specific messes? (Yes).

  9.  **Final Polish:** Ensure the tone is empathetic but firm. The User is stressed ("eating my life"). The tool needs to feel like a relief, not more bureaucracy. Make the decision tree clear. (Self-correction: Ensure the distinction between "Complainer's Standing" and "Board's Authority" is sharp).

  *(Self-Correction during final review of Scenario 3)*: I need to be very clear with the User that *they* are the blocker in Scenario 3. The procedure must highlight that the Board cannot act if one member (the Chair) is shielding a violator. That's the "answer I don't like."

  *(Refining the "Standing" concept)*: In law, standing is about who can sue. In a co-op, anyone can report. The issue is *credibility* and *fairness*. I will use the term "Enforcement Viability" rather than "Standing" to avoid legal confusion, but keep the logic of standing. Actually, the prompt uses "standing," so I'll stick with that but define it operationally.

  *(Final check on the "Three Outcomes" requirement)*: The prompt asks to distinguish: private opinion, public telling off, actual rule/fine. I need to make sure the procedure outputs these distinctively.

  Let's build the response.
answer: |-
  Here is the procedure. It is designed to separate the *violation* from the *messenger*, and the *rule* from the *enforcer*.

  ### The Pre-Meeting Compliance Filter

  Run every complaint through these five steps in order. If you stop at a "No," follow the instruction attached to that step. Do not skip ahead.

  **Step 1: The Fact Check**
  *   **Question:** Is there objective evidence that a specific, written co-op rule or agreement has been broken?
  *   **If No:** File as "Misunderstanding" or "Interpersonal Conflict." Do not treat as a compliance issue. Mediate if necessary, but do not enforce.
  *   **If Yes:** Proceed to Step 2.

  **Step 2: The Safety & Legal Override**
  *   **Question:** Does the violation create an immediate physical safety risk (fire exits, electrical hazards) or a legal liability for the co-op (insurance violations, statutory laws)?
  *   **If Yes:** **Enforce immediately.** The moral record of the complainer is irrelevant. Safety is not a moral contract; it is a physical reality.
      *   *Note:* You must still address the complainer's related violation (see Step 4), but you cannot leave the safety risk unaddressed because the messenger is flawed.
  *   **If No:** Proceed to Step 3.

  **Step 3: The Complainer's Standing (The "Clean Hands" Test)**
  *   **Question:** Is the person making the complaint currently violating the *same* rule, or a rule based on the *same principle*?
      *   *Same Rule:* They bike in the hall and complain about bikes.
      *   *Same Principle:* They are in arrears and complain about late fees.
  *   **If No (They are clean):** Proceed to Step 4.
  *   **If Yes (They are hypocritical):** Ask the sub-questions:
      1.  **Have they stopped?** If they did it, stopped, and acknowledged it, they retain standing.
      2.  **Are they hiding it?** If they deny doing it while doing it, their standing is compromised.
      3.  **Are they admitting it?** If they say, "I do this too, it's wrong, please stop," they retain standing.
  *   **Decision:**
      *   If they are *currently* doing it and *hiding/denying* it: You cannot use their complaint as the *trigger* for enforcement. It looks like vendetta.
      *   *However:* The violation still exists. The Board must decide whether to pursue the violation *on its own motion* (see Step 5). Do not dismiss the violation; dismiss the *complainer's authority*.

  **Step 4: The Board's Integrity (The "Selective Enforcement" Test)**
  *   **Question:** Is the Board (or any Board member) currently allowing this same rule to be broken by others without consequence?
  *   **If No:** Proceed to Step 5.
  *   **If Yes:** **Stop.** You cannot enforce this rule against the Accused until you have enforced it against the others.
      *   *Reasoning:* In a co-op, selective enforcement is a breach of the mutual agreement. If you fine Person A but ignore Person B (because Person B is your friend, or loud, or useful), the fine is invalid morally and potentially legally.
      *   *Action:* The Board must issue notices to *all* violators simultaneously. If the Board is unwilling to do this, the rule is effectively suspended until they are willing.

  **Step 5: Determining the Outcome**
  *   **Question:** What is the goal of this intervention?
  *   **Option A: Private Correction.** (For first offenses, minor norms, or where complainer standing is low). The Board contacts the Accused privately. "We've noticed X. Please fix it." No record of who complained.
  *   **Option B: Public Norming.** (For repeated issues where the culture is fraying). The Board reminds *everyone* of the rule in a newsletter or meeting, without naming names.
  *   **Option C: Formal Enforcement.** (For safety, legal, or repeated refusal). Fines, notices, or votes on membership.
      *   *Constraint:* You may only choose Option C if Step 3 (Complainer) and Step 4 (Board) are cleared.

  ***

  ### Running the Three Messes

  Here is how the filter applies to your specific scenarios.

  **1. The Pram (Fire Door) vs. The Bike (Hallway)**
  *   **Step 1 (Fact):** Yes, fire door blocked.
  *   **Step 2 (Safety):** **YES.** This is a fire hazard.
  *   **Result:** **Enforce immediately.** The pram must move.
  *   **Nuance:** The complainer's bike is a Step 4 issue. You remove the pram today. Tomorrow, you issue a notice to the complainer about the bike. You do not say "We are doing this because you complained." You say, "We are doing a hallway sweep."
  *   **Why:** Safety trumps hypocrisy. If the building burns down, it doesn't matter who was right in the argument.

  **2. The Treasurer (Ex-Arrears) vs. Late Payers**
  *   **Step 1 (Fact):** Yes, people are late.
  *   **Step 2 (Safety):** No.
  *   **Step 3 (Complainer Standing):** She was in arrears.
      *   *Sub-question:* Has she stopped? Yes.
      *   *Sub-question:* Did she acknowledge it? Yes, publicly apologized a year ago.
  *   **Result:** **She has standing.** Repentance restores standing. She is not claiming she is perfect; she is claiming the system needs to work.
  *   **Action:** Proceed to Step 5. You can implement fines. Her history makes her *more* credible on this, not less, because she knows the impact.

  **3. The Subletting (New Member) vs. The Friend (Chair's Mate)**
  *   **Step 1 (Fact):** Yes, subletting without permission.
  *   **Step 2 (Safety):** No.
  *   **Step 3 (Complainer Standing):** The new member is violating the rule. They are currently doing it. They are likely hiding it until caught. Their standing to *moralise* is low.
  *   **Step 4 (Board Integrity):** **FAIL.** You (the Chair) know your friend is doing the same thing. You have been actively preventing it from coming up.
  *   **Result:** **You cannot enforce this.**
  *   **Why:** This is not about the new member's hypocrisy. This is about the Board's equity. If you fine the new member and not your friend, you are weaponizing the rules.
  *   **Action:** You have two choices.
      1.  You bring your friend's violation to the board immediately. You recuse yourself from the vote on your friend. You treat both cases identically.
      2.  You suspend enforcement of the subletting rule entirely until you are willing to apply it to your friend.
  *   **The Hard Truth:** If you choose to fine the new member without fining your friend, you are not running a co-op; you are running a clique. The new member is right to call you a hypocrite, even if they are also a hypocrite.

  ***

  ### Distinguishing the Three Layers

  You asked about the difference between private opinion, public shaming, and rule enforcement. The procedure splits them like this:

  1.  **Private Opinion ("I think less of them"):**
      *   This is yours to keep. The procedure does not touch this. You can think the complainer is a jerk and the accused is a slob.
      *   *Rule:* Do not let this opinion dictate the Step 2 (Safety) or Step 4 (Board Integrity) checks.

  2.  **Public Telling Off ("You shouldn't do that"):**
      *   This requires **Step 3 (Complainer Standing)**.
      *   If the complainer is actively doing the same thing and denying it, they do not get to publicly lecture the accused. The Board should shut down the moralising. "We hear your concern, but let's focus on the rule, not who's reporting it."
      *   If the complainer admits it ("I do this too, but we should stop"), they are allowed to speak.

  3.  **Actual Rule/Fine ("Pay $50 or Fix It"):**
      *   This requires **Step 4 (Board Integrity)**.
      *   It does not matter who complained. It matters if the Board is applying the rule evenly.
      *   If the complaint is dismissed due to the complainer's hypocrisy (Step 3), the Board can still issue the fine *if* the Board discovered the violation independently or cares enough to pursue it *sua sponte*.
      *   *Crucial:* A complaint with low standing does not kill the violation. It just kills the *complainer's leverage*. The Board must decide if the violation matters enough to chase without the complainer's help.

  ***

  ### What This Procedure Cannot Do

  You need to know where this tool stops working so you don't blame the tool when the problem is human.

  **1. It launders your judgment on "Safety."**
  Step 2 relies on you defining what is "Safety." Is a bike in a hallway a fire hazard? Technically, yes. Is a pram? Yes. Is a shoe rack? Maybe. You will still have to argue about where the line is. The procedure forces you to declare it, but it doesn't decide it for you.

  **2. It cannot fix a Board that refuses to be honest.**
  In Scenario 3, the procedure tells you to stop. It cannot make you confess about your friend. It cannot force the Board to vote against your friend. It simply illuminates that if you proceed, you are acting unfairly. It exposes the rot; it doesn't scrub it.

  **3. The "Repentance" Window is a Values Call.**
  In Scenario 2, I ruled the Treasurer has standing because she apologized and stopped. Someone else might say, "No, she broke the trust, she's disqualified forever."
  *   *Position A:* Past hypocrisy is cured by correction. (Focus on future compliance).
  *   *Position B:* Past hypocrisy disqualifies moral authority permanently. (Focus on integrity of character).
  You have to pick one of these positions with your Board and stick to it. The procedure assumes Position A, but if your co-op culture believes Position B, you will have conflict.

  **4. It creates bureaucracy.**
  Running this filter takes time. It slows down the "quick fix." In a 34-unit co-op run by volunteers, friction is expensive. You are trading speed for fairness. If the Board gets impatient, they will skip Step 4. You have to be the one who insists on the pause.

  **Summary for Thursday:**
  *   **Safety issues:** Enforce regardless of who complains. Fix the complainer's mess separately.
  *   **Norm issues:** Check if the complainer is doing the same thing. If they are hiding it, ignore their moralising but check the violation yourself.
  *   **Board issues:** If the Board is letting friends slide, you cannot enforce against enemies. Fix the friends first.
  *   **The Complaint:** If the complainer lacks standing, the *complaint* is dismissed, but the *violation* remains on the Board's radar to act on independently.
