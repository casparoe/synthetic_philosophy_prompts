  ### Ranking of Criteria

  **1. (a) Subjection**
  **2. (b) Stakes**
  **3. (d) Exit Cost**
  **4. (e) Contribution**
  **5. (c) Recursive Authorisation**

  ### Justifications

  **1. (a) Subjection**
  This is the most defensible criterion as it aligns with the "All Subjected Principle," a cornerstone of modern democratic theory. It establishes a clear, stable boundary based on jurisdiction: if the polity's coercive power binds you, you require a voice to legitimize that power. It avoids the circularity of (c), the exclusionary injustice of (d) and (e), and the boundary-dissolving fluidity of (b), making it the only criterion that successfully settles the boundary problem while maintaining normative legitimacy.

  **2. (b) Stakes**
  This criterion ranks second due to its strong moral intuition: those facing catastrophic harm deserve protection. However, it is less defensible than (a) for *constitutional* design because it fails to establish a stable boundary. Since "stakes" vary by decision, the demos would fluctuate constantly, rendering a fixed polity impossible. It is morally robust but institutionally incoherent as a primary constitutional rule.

  **3. (d) Exit Cost**
  This ranks third. It correctly identifies coercion (inability to leave) as a key justification for democratic inclusion. However, its negative clause ("those who could leave cheaply are not [members]") is normatively perverse, effectively disenfranchising the wealthy or mobile. While it creates a bounded polity, it does so by penalizing privilege rather than affirming rights, making it less defensible than (a) or (b).

  **4. (e) Contribution**
  This ranks fourth. It treats membership as a function of economic utility rather than moral standing. While it creates a clear boundary, it is fundamentally anti-democratic, as it excludes those who do not supply replaceable labour or revenue (e.g., children, the disabled, the retired). It instrumentalizes human beings, violating the principle of equal moral worth inherent in democratic constitutions.

  **5. (c) Recursive Authorisation**
  This is the least defensible criterion. It is logically circular: it presupposes the existence of a demos to define the demos. In the context of drafting a *new* constitution, there is no prior body to authorize the initial membership. Without an external starting point, this criterion leads to an infinite regress or arbitrary exclusion, failing to solve the boundary problem at all.

  ### Combination Analysis

  **Yes, the pair (a) Subjection and (c) Recursive Authorisation can be combined without incoherence.**

  While (c) is incoherent as a standalone founding criterion due to its circularity, it can function logically if supplemented by (a). The committee could adopt **(a) Subjection** to determine the *initial* constituent demos (those currently subject to the provisional rules of the founding territory). Once this initial body is established via subjection, **(c) Recursive Authorisation** can take over as the rule for all *future* changes to membership boundaries. This combination resolves the logical flaw of (c) by using (a) to break the circle, while preserving the democratic value of self-determination for the polity's future evolution.
