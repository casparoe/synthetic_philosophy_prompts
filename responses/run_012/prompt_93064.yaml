answer: |-
  Here is the plan for your hour. It is designed to bypass the philosophers' toolkit and speak directly to the novelist's instinct for consequence, motivation, and the unspoken rules of human exchange.

  ### 1. What Must Be in Place Before You Start

  You cannot begin with the question "Is selling a kidney wrong?" because that invites abstract moralising. You must first establish a shared definition of **value** that includes *meaning* as a tangible ingredient.

  Before the hour begins, you need the room to accept two premises, which you will slip in during the first five minutes:
  1.  **Context Changes the Object:** A kiss between lovers is not the same physical act as a kiss bought for money. The atoms are the same; the *thing* is different.
  2.  **Markets Crowd Out Meanings:** When you introduce money into a relationship governed by love, duty, or honour, the money doesn't just add value; it often subtracts the original meaning.

  If you don't establish this, they will treat the kidney as a spare part (like a car tyre) rather than a constituent of the self. You establish this not by arguing, but by telling a story they can't refute.

  ### 2. The One Example: Do Not Use the Mourners

  Your partner is right. The professional mourner is a trap. It is too easy for the room to dismiss as "theatrical" or "inauthentic." They will say, "Well, obviously, because the grief isn't real," and you will lose the thread. You need an example where the *service* is real, the *consent* is real, but the *transaction* still breaks something.

  **The Example You Should Use: Paying a Friend to Be a Best Man (or Give a Eulogy).**

  *   **The Scenario:** You are getting married (or burying a parent). You ask your best friend to give the speech. They say, "I'm honoured, but I'm broke. I'll do it for £500." You pay them. They give a beautiful, heartfelt speech.
  *   **Why this works:**
      *   **It's Relational:** Like the kidney/brother subplot, it involves deep personal obligation.
      *   **It's Competent:** The friend does the job well. No one is "harmed" in a utilitarian sense. The guests are moved.
      *   **It's Corrupted:** Yet, everyone in the room will feel a chill. The friendship has shifted. The friend is now a contractor. You are now a client.
      *   **It's Writerly:** It deals with motive, subtext, and the unsaid.

  This example carries the hour because it isolates the *commodification* from the *physical harm*. If they accept that paying the friend changes the nature of the friendship, they are halfway to accepting that paying for the kidney changes the nature of the body/self.

  ### 3. The Sequence of the Hour

  Do not follow a logical syllogism. Follow an emotional arc.

  **0–5 mins: The Hook (No Theory)**
  Do not introduce yourself as an expert. Introduce the session as a problem you are having with your book. "I have a character who sells a kidney. I need to know why it feels wrong, because logically, it saves her brother." Ask them to hold that tension.

  **5–20 mins: The Friend Example (The Anchor)**
  Tell the Best Man story. Ask the room: "Has the friendship survived?" "Would you mention the payment in the speech?" "If you fell on hard times next year, would you ask them for a loan, or hire them?"
  *   *Why this order:* You need them to feel the "wrongness" before you name it. If you name it first ("commodification"), they will put up intellectual shields. If they feel the chill first, they will look for the name themselves.

  **20–30 mins: The Psychology (The Validation)**
  Now you introduce the psychology finding you mentioned (likely the work of Philip Tetlock on **Sacred Values**).
  *   *The Finding:* When people trade sacred values (friendship, justice, the body) for secular values (money), observers don't just disagree; they experience moral outrage and want to punish the trader, even if the trade was consensual and beneficial.
  *   *Why here:* This validates their gut reaction to the Friend example. It tells them: "You aren't just being prudish; your brain is wired to protect certain spheres from the market." This arms them against the "it's just icky" argument later.

  **30–40 mins: The Pivot to the Kidney**
  Bring it back to your book. "If paying a friend for a speech changes the friendship, what does paying a sister for a kidney do to the sibling bond? What does it do to her relationship with her own body?"
  *   *The Key Insight:* The objection isn't just about health risk. It's that the kidney moves from being a *gift of life* (sacred) to a *unit of currency* (secular). Once it's currency, the brother's debt isn't cleared by love; it's cleared by liquidation. She becomes a resource.

  **40–55 mins: The Misconceptions (The Grind)**
  This is where you field the objections. See section 4 below for how to handle them.

  **55–60 mins: The Diagnostic Question**
  See section 6 below.

  ### 4. Handling the Misconceptions

  Here is the order they will raise these points, and how you head them off without sounding like a lecturer.

  **1. "So you're against all markets then? Can I sell my labour?"**
  *   *When:* Usually early, from the pragmatist in the room.
  *   *The Deflection:* "Not at all. Markets are brilliant for laptops and labour. I'm interested in the things that stop working when they're sold. A laptop is designed to be sold. A friendship (or a kidney) is designed to be given. The question is: which category does the body fall into?"

  **2. "The real problem is that she's poor. It's about exploitation, not the kidney."**
  *   *When:* This will be the most popular objection. It's the sociological safety net.
  *   *The Deflection:* This is the crucial one for your subplot. Acknowledge it, then isolate it. "Absolutely, poverty makes it worse. But let's test it. If she was a millionaire, and her brother needed a kidney, and she said 'I won't give it for free, but I'll sell it to him for £1m', does the unease vanish? If it still feels odd, then poverty isn't the *only* problem."
  *   *Why:* This forces them to admit there is a residual wrongness beyond exploitation. That residual wrongness is your subplot's engine.

  **3. "But we pay surgeons, don't we? They sell their skill with bodies."**
  *   *When:* The technical objection.
  *   *The Deflection:* "We pay them for their *skill*, not their *parts*. We pay the surgeon to fix the machine, not to become a spare part themselves. One is a service; the other is a sacrifice."

  **4. "If both of them are better off, the only thing left is that you find it icky."**
  *   *When:* The utilitarian finale.
  *   *The Deflection:* Use the Psychology section here. "It's not just 'icky'. As we saw with the Sacred Values study, we get *furious*. We want to punish the seller. If your character sells the kidney, does her community punish her? Does her brother love her less because he now owes his life to a transaction rather than a gift? That's not disgust; that's social consequence."

  ### 5. What to Leave Out

  Be plain about this at the start if you need to, but mostly just avoid these traps:

  *   **Kantian Dignity:** Do not mention "treating people as ends not means." It sounds like philosophy homework. Talk about "respect" and "status."
  *   **Legal Specifics:** Don't get bogged down in the Human Tissue Act or black market statistics. You are discussing moral logic, not legal procedure.
  *   **Utilitarian Calculus:** Do not let them get stuck on "how many lives are saved." Remind them they are novelists, not health economists. They care about the *cost to the soul*, not the QALYs (Quality-Adjusted Life Years).

  ### 6. The Final Question

  Do not ask "Did you enjoy that?" or "Does that make sense?" That invites politeness. You need to know if the *dramatic tension* has landed.

  Ask this:
  > **"If my character goes through with this sale, what is the one thing she can never ask her brother for again?"**

  *   **Why this works:**
      *   If they say "Money," they haven't got it.
      *   If they say "Anything," they've understood the total corrosion of the relationship.
      *   If they pause and say, "She can't ask him to love her," or "She can't ask him to forgive her," then you know the idea has landed. You have successfully moved the discussion from economics to narrative consequence.

  ### Summary of the Plan

  1.  **Premise:** Markets change the meaning of the thing sold.
  2.  **Example:** Paying a friend for a eulogy (not mourners).
  3.  **Psychology:** Sacred values trigger punishment, not just disagreement.
  4.  **Application:** The kidney is a sacred value, not a commodity.
  5.  **Defences:** Isolate poverty from principle; distinguish service from sacrifice.
  6.  **Test:** What future request is now forbidden?

  This keeps the room in the realm of scenes, relationships, and consequences. It solves your subplot problem by forcing you to write the *aftermath* of the sale, not just the transaction itself. The drama isn't in the cutting; it's in the silence at dinner afterwards.
