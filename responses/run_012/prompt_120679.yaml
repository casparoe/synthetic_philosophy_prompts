answer: |-
  This is a brilliant pedagogical instinct. You are targeting the precise friction point where game-theoretic rationality clashes with human intuition, and you want the students to feel the *structure* of the situation rather than just hear about it.

  Your mathematical hunch is correct. Here is the verification, followed by the lesson plan, logistics, and the "honest account" of where this usually breaks.

  ### 1. The Math Check (For Your Board)

  You need to put this derivation on the board during the debrief to cement the intuition.

  **The Condition for Cooperation**
  For cooperation to be sustainable in an indefinite repeated game (using a "Grim Trigger" logic as the baseline threat), the value of cooperating forever must exceed the value of defecting once and being punished forever.

  $$V_{coop} = R + \delta R + \delta^2 R + \dots = \frac{R}{1-\delta}$$
  $$V_{defect} = T + \delta P + \delta^2 P + \dots = T + \frac{\delta P}{1-\delta}$$

  Cooperation holds if $V_{coop} \geq V_{defect}$, which simplifies to:
  $$\delta \geq \frac{T - R}{T - P}$$

  **Game 2 (Standard Payoffs)**
  *   $T=5, R=3, P=1$
  *   Threshold: $\frac{5-3}{5-1} = \frac{2}{4} = 0.5$
  *   Your $\delta = 0.9$.
  *   **Result:** $0.9 > 0.5$. Cooperation is mathematically sustainable. The shadow of the future is long enough.

  **Game 3 (Inflated Temptation)**
  *   $T=25, R=3, P=1$
  *   Threshold: $\frac{25-3}{25-1} = \frac{22}{24} \approx 0.916$
  *   Your $\delta = 0.9$.
  *   **Result:** $0.9 < 0.916$. Cooperation collapses. Even with a 90% chance of continuing, the immediate gain of 25 points is too juicy to resist compared to the trickle of 3s.

  **Verdict:** Your numbers work. Game 2 should hold; Game 3 should break.

  ---

  ### 2. Logistics & Materials

  **Room Setup:**
  *   9 tables or desks arranged for pairs.
  *   Projector for the randomizer and leaderboard.
  *   Whiteboard for scores and debrief notes.

  **Materials per Pair:**
  *   **Decision Cards:** Two cards per student, labeled **C** and **D**. They hold one behind their back and reveal on "3, 2, 1, Show."
  *   **Score Sheet:** A simple grid with rows 1–10 (and extra space for indefinite games) and columns for "My Move," "Their Move," "Round Score," "Total."
  *   **Pen.**

  **The Randomizer (Crucial):**
  *   Do not use a physical die; half the room won't see it, and it feels too "board gamey."
  *   Use **Random.org** or a similar site projected on the screen.
  *   **Setting:** Generate a random integer between 1 and 10.
  *   **Rule:** If the number is **1**, the game ends. If **2–10**, the game continues. (This is exactly $p=0.9$).
  *   **Trust:** Show them the URL before class starts so they know you aren't manipulating the stream.

  **The Leaderboard:**
  *   Keep it simple. Top 3 pairs by total cumulative points across all games.
  *   Update this *between* games, not during, to save time.

  ---

  ### 3. The Timeline (90 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Pairing, Rules, Payoff Matrix on Board, **Counterbalancing**. |
  | **10–25** | **Game 1** | **Finite.** Half class plays 10 rounds known. Half class plays Indefinite (Game 2). |
  | **25–45** | **Game 2** | **Indefinite.** Groups swap conditions. (Finite group now plays Indefinite; Indefinite group plays Finite). |
  | **45–60** | **Game 3** | **High Temptation.** Everyone plays Indefinite with $T=25$. |
  | **60–90** | **Debrief** | Mapping experience to theory (see below). |

  *Note on Counterbalancing:* To save time on instructions, split the room physically (Left side does Finite first, Right side does Indefinite first). This prevents cross-talk about the "ending" mechanic.

  ---

  ### 4. Running the Games (Script & Board Work)

  **On the Board (Leave this up the whole time):**
  ```
  PAYOFFS (You, Them)
  C , C  →  3 , 3
  D , C  →  T , 0   (T=5 for G1/G2, T=25 for G3)
  C , D  →  0 , T
  D , D  →  1 , 1
  ```

  **Game 1 & 2 Instructions (5 mins):**
  *   "Your goal is to maximize your own points. Points determine the leaderboard. There are no prizes, but there is glory."
  *   "You cannot talk. You signal by holding up C or D."
  *   **For Finite Group:** "This game will last exactly 10 rounds. I will count them down."
  *   **For Indefinite Group:** "After every round, I will roll the digital die. If it lands on 1, the game ends. If 2–10, we go again. Expected length is 10 rounds."

  **During Play:**
  *   **Pace:** You must be the metronome. "Round 1. Reveal. Record. Round 2..."
  *   **Finite Group:** In Round 9, pause. "This is Round 9. Next is the Final Round." Watch the body language shift.
  *   **Indefinite Group:** Make a show of the roll. "Rolling... it's a 7. Continue."

  **Game 3 Instructions (2 mins):**
  *   "Same indefinite rule (roll for continuation). But look at the board. The Temptation payoff is now **25**."
  *   "Roll."

  ---

  ### 5. The Debrief (The Core Value)

  Do not lecture. Ask, record their answers on the board, and then overlay the theory.

  **Phase 1: The Finite Unraveling (Game 1)**
  *   *Ask:* "Show of hands, who defected on Round 10?" (Most will).
  *   *Ask:* "Who defected on Round 9?" (Many will).
  *   *Ask:* "Who intended to cooperate all the way until the end?" (Some will).
  *   *The Point:* Write **Backward Induction** on the board.
  *   *Script:* "In the last round, there is no future. So D is dominant. If we know D in round 10, round 9 becomes the effective last round. The logic eats the game from the back."
  *   *Philosophy Hook:* "Does this mean you are irrational for cooperating earlier? Or does it mean the model misses something about human commitment?"

  **Phase 2: The Shadow of the Future (Game 2)**
  *   *Ask:* "Who sustained cooperation longer in the Indefinite game than the Finite one?"
  *   *The Point:* Write **Folk Theorem / Shadow of the Future**.
  *   *Script:* "The payoffs didn't change. The people didn't change. The *horizon* changed. When the end is unknown, the threat of punishment (losing future cooperation) becomes real."
  *   *Math:* Put the $\delta \geq \frac{T-R}{T-P}$ formula on the board. Plug in the numbers. Show them $0.9 > 0.5$.

  **Phase 3: The Threshold (Game 3)**
  *   *Ask:* "What happened when T went to 25?" (Chaos/Defection).
  *   *The Point:* Write **Incentive Compatibility**.
  *   *Script:* "The shadow of the future was still there (0.9). But the shadow wasn't dark enough to block out the bright light of 25 points."
  *   *Math:* Plug in the Game 3 numbers. Show them $0.9 < 0.916$.
  *   *Takeaway:* "Cooperation isn't just about 'wanting to be nice.' It requires the future to be valuable *relative* to the temptation."

  ---

  ### 6. Troubleshooting: What Will Go Wrong

  **1. The "Nice Group" Problem (Game 1 Cooperation)**
  *   *Risk:* As you feared, friends cooperate through all 10 rounds.
  *   *Fix:* **Framing.** Before Game 1, say: "In economics, we assume agents maximize their own utility. If you cooperate in Round 10, you are leaving points on the table. I want to see if you can resist the logic of the last round."
  *   *Fix:* **The Countdown.** When you announce Round 9, stop. Look around the room. "There is one round left after this." The social pressure of the announcement often triggers the defection.
  *   *Pivot:* If they *still* cooperate, don't panic. Ask: "Why did you cooperate in Round 10?" They will say "Trust" or "Friendship." You say: "Exactly. The *game* says defect. Your *norms* say cooperate. Today we are studying the game. Next week we study the norms."

  **2. Time Creep**
  *   *Risk:* Recording scores takes forever.
  *   *Fix:* Tell them: "Just record your Total Score at the end of the game. I don't need round-by-round logs." Or, have them raise hands for "Who got over 20 points?" to populate the leaderboard quickly.
  *   *Risk:* The Randomizer roll drags.
  *   *Fix:* Pre-load the tab. Have a TA or student click the button.

  **3. Confusion on Payoffs**
  *   *Risk:* Students mix up who got what.
  *   *Fix:* Keep the matrix on the board. Do not erase it.

  ---

  ### 7. What This Game Cannot Show (Be Honest Here)

  In the final 5 minutes, tell them what the simulation hides. This protects your intellectual honesty.

  1.  **Equilibrium Selection:** The game shows cooperation *can* happen in Game 2, but it doesn't explain *why* we coordinate on (C,C) rather than (D,D). Both are equilibria in the repeated game. The game shows possibility, not inevitability.
  2.  **Communication:** Real cooperation often involves cheap talk ("I'll cooperate if you do"). You banned this. In the real world, talking changes the $\delta$.
  3.  **Fairness vs. Strategy:** Students might defect in Game 3 not because of the math, but because $T=25$ feels "unfair" or "greedy," triggering moralistic punishment. The model treats this as rational calculation; in reality, it's emotional.

  ---

  ### 8. The Add-Ons: Tournament & Noise

  **The Strategy Tournament (Round-Robin)**
  *   **Verdict:** **Do not do this live.**
  *   **Why:** With 18 students, a round-robin is 17 rounds per student. Even with automation, explaining the scoring, collecting the cards, and running the logic will eat 30 minutes minimum. It will rush your debrief on Backward Induction, which is your primary learning goal.
  *   **Alternative:** Assign it as homework. "For next week, write a 3-line algorithm for how you would play Game 2. We will run them in a Python script I have prepared." This keeps the interest high without killing class time.

  **The Noise Round (Garbled Moves)**
  *   **Verdict:** **Include only as a discussion question, not a game.**
  *   **Why:** Noise requires a much more complex debrief (Tit-for-Tat spirals vs. Generous Tit-for-Tat). If Games 1–3 run fast (under 60 mins), you can run one 5-round "Noise" game where you secretly flip one pair's move.
  *   **Better:** In the debrief, ask: "In Game 2, what if I told you that 10% of the time, I accidentally flipped your C to a D? How would that change your strategy?"
  *   **Lesson:** This leads perfectly to the idea that **forgiveness** is required for stability in a noisy world. It's a powerful closing thought that doesn't require logistics.

  ### Summary Checklist for You
  1.  **Verify the Projector:** Ensure the random number generator is visible from the back row.
  2.  **Print Score Sheets:** Keep them minimalist.
  3.  **Prepare the Board:** Write the Payoff Matrix and the $\delta$ formula *before* they enter.
  4.  **Hard Stop:** At minute 60, stop the games even if mid-round. The debrief is where the learning happens.
  5.  **Embrace the Failure:** If Game 3 *doesn't* collapse (because they are too cooperative), use it. "The math says you should defect. You didn't. Why? Is the model wrong, or are you irrational?" That is a better philosophy question than a clean result.

  This plan respects the 90-minute constraint while centering the experiential "aha!" moment you are looking for. Good luck.
