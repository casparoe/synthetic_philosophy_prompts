prompt: |-
  I teach a second-year seminar called Cooperation and Conflict — mixed philosophy and econ students, about 18 of them, one 90-minute session — and I want to spend the whole thing on a game rather than a lecture. Here's the thing I can never get them to feel from the reading: ask the room beforehand whether they'd cooperate in a prisoner's dilemma and they all say yes, sincerely, and they mean it; but the moment the dilemma is played repeatedly with a known final round, they unravel backwards from the end, and then the very same people who just defected on the last round will cooperate round after round once I take the known ending away and let the thing keep going on a die roll — even when I've set the die so the expected number of rounds is about the same. So it isnt the payoffs and it isn't their character; it's whether there's a common, known endpoint for the backward induction to grab onto. I want that to happen in their hands, not come out of my mouth.

  So here's the shape I'm imagining: fixed pairs, points instead of money (both cooperate 3 each, both defect 1 each, you defect while they cooperate 5, you cooperate while they defect 0), a leaderboard so the points aren't free, and three short back-to-back games. Game 1 is a fixed, announced number of rounds — say 10. Game 2 has no announced end; after every round I roll, or better, show a randomiser on the projector, and we continue with probability 0.9, so the expected length is also about 10. Game 3 uses the same die and the same expected length, but I jack the temptation payoff up to something like 25, so the spoils of one defection dwarf everything else. My hunch is that Game 2 holds together and Game 3 falls apart, even though nobody in either game knows when it ends, because the shadow of the future has to be big enough relative to the temptation — I have a vague memory of a threshold like that but I couldnt tell you where it comes from, so please work out what continuation chance actually makes cooperation sustainable at the original payoffs and at the inflated ones, and tell me whether my numbers land on the right side of it. Counterbalance the order of Games 1 and 2 across the room so it isn't just first-game nerves, and keep each pair fixed inside a game so people can actually respond to one another.

  What I need from you: the rules and materials (cards, scoresheets, and a way of running the die roll that everyone believes), a timeline that fits the whole thing into 90 minutes including a real debrief, what I should be putting on the board as we go, and then a debrief that maps the specific moments — the last-round defection in Game 1, the first time someone forgives a defection instead of retaliating, the round where the leaderboard starts to bite, the collapse in Game 3 — onto the backward-induction point and the shadow-of-the-future point. Follow that with an honest account of what will predictably go wrong the first time I run this and how to handle it; my particular worry is that a friendly group will just cooperate all the way through Game 1 and leave me nothing to point at, so tell me how to make the stakes bite without real money. And be straight with me about what the game can't show — which part of the idea I'll still have to supply myself. I'd also like your view on whether it's worth bolting on a quick round-robin at the end where everyone submits a one-line strategy on an index card and we let the successful rules multiply by imitation, since I'd love them to see that reciprocity survives a run and that always-defect looks brilliant in a single encounter and dreadful over many, but not if it wrecks the timing. Oh, and if there's room, a fourth wrinkle where each move has a small chance of getting garbled on its way to the other player would be lovely, because I suspect that's where tit-for-tat quietly dies — only if it doesn't crowd out the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Second-year seminar, "Cooperation and Conflict" (Philosophy + Econ), ~18 students, 90 minutes.
      *   **Goal:** Teach the intuition behind the Folk Theorem/Backward Induction vs. Shadow of the Future in Repeated Prisoner's Dilemma (RPD) *experientially*, not just via lecture.
      *   **Core Insight to Demonstrate:** Students claim they will cooperate, but defect in finite known-end games (backward induction). They cooperate in indefinite games (shadow of the future), *unless* the temptation payoff is too high relative to the continuation probability.
      *   **Proposed Structure:**
          *   Fixed pairs.
          *   Points (not money).
          *   Leaderboard (to create stakes).
          *   Game 1: Finite, known end (e.g., 10 rounds).
          *   Game 2: Indefinite, continuation prob $\delta = 0.9$ (Expected length $\approx 10$).
          *   Game 3: Indefinite, $\delta = 0.9$, but Temptation payoff inflated (e.g., 25).
          *   Counterbalance Game 1 & 2 order.
          *   Optional: Strategy tournament (round-robin) at the end.
          *   Optional: Noise/Error round (moves garbled).
      *   **Needs:** Rules, materials, timeline, board work, debrief script, troubleshooting (especially "nice" groups cooperating in Game 1), limitations of the game, and advice on the optional add-ons.

  2.  **Mathematical Verification (The "Threshold" Check):**

      *   *Standard Payoffs:* $T=5, R=3, P=1, S=0$.
      *   *Condition for Cooperation (Grim Trigger logic):*
          *   Cooperate forever value: $V_C = R + \delta R + \delta^2 R + \dots = \frac{R}{1-\delta}$.
          *   Defect once then punished value: $V_D = T + \delta P + \delta^2 P + \dots = T + \frac{\delta P}{1-\delta}$.
          *   Cooperation sustainable if $V_C \ge V_D$.
          *   $\frac{R}{1-\delta} \ge T + \frac{\delta P}{1-\delta}$
          *   $R \ge (1-\delta)T + \delta P$
          *   $R - \delta P \ge (1-\delta)T$
          *   $R - P \ge (1-\delta)(T - P)$ (Standard form: $\delta \ge \frac{T-R}{T-P}$)
      *   *Calculation for Game 2:*
          *   $T=5, R=3, P=1$.
          *   Threshold $\delta \ge \frac{5-3}{5-1} = \frac{2}{4} = 0.5$.
          *   Proposed $\delta = 0.9$.
          *   $0.9 > 0.5$. Cooperation *should* be sustainable.
      *   *Calculation for Game 3:*
          *   $T=25, R=3, P=1$.
          *   Threshold $\delta \ge \frac{25-3}{25-1} = \frac{22}{24} \approx 0.916$.
          *   Proposed $\delta = 0.9$.
          *   $0.9 < 0.916$. Cooperation *should* collapse (mathematically).
      *   *Conclusion:* The instructor's hunch is mathematically sound. Game 2 supports cooperation; Game 3 makes defection the dominant strategy even in an infinite horizon (under Grim Trigger logic).

  3.  **Timeline Construction (90 Minutes):**

      *   Total: 90 mins.
      *   Setup/Intro: 10 mins.
      *   Game 1 (Finite): 15 mins (including scoring).
      *   Game 2 (Infinite, Standard): 20 mins.
      *   Game 3 (Infinite, High T): 15 mins.
      *   Debrief: 25 mins.
      *   Buffer/Transition: 5 mins.
      *   *Issue:* The user asked about adding a Strategy Tournament and a Noise round.
      *   *Constraint:* 18 students is small, but 90 minutes is tight for *three* full RPD games plus debrief. Adding a tournament (Axelrod style) usually takes a long time to explain and run. Adding Noise adds complexity to the debrief.
      *   *Decision:* Advise against running the Tournament and Noise *in class* if the goal is a deep debrief on Backward Induction vs. Shadow of the Future. Suggest the Tournament as homework or a simulation for the next class. Suggest Noise can be mentioned conceptually or tried *only* if Games 1-3 run fast. I will prioritize the core three games to ensure the debrief quality. I will include the Noise round as a "if you have time" appendix but warn against it.

  4.  **Materials & Logistics:**

      *   *Pairs:* 9 pairs.
      *   *Recording:* Needs to be fast. Paper scorecards are best.
      *   *Randomizer:* Needs to be public and trusted. A digital randomizer on the projector is better than a physical die (hard to see).
      *   *Leaderboard:* Whiteboard.
      *   *Counterbalancing:* Half the class does Finite first, half does Infinite first.

  5.  **Addressing the "Nice Group" Problem:**

      *   *Risk:* Students cooperate in Game 1 (Finite) because they are friends or don't want to be "mean."
      *   *Solution:*
          1.  **Anonymity within pairs?** No, they need to see the face to build reputation.
          2.  **Stakes:** The leaderboard helps.
          3.  **Instruction:** Explicitly tell them "The goal is to maximize your own points, not be nice."
          4.  **The "Saboteur" Trick:** Assign one pair secretly to play "Always Defect" to break the ice? No, that ruins the data.
          5.  **Better:** Emphasize the *logic* of the last round. Ask them publicly: "What will you do in Round 10?" before starting.
          6.  **Best:** If they cooperate anyway, use it as a teaching moment about "social norms overriding game structure," but pivot to the *unraveling* logic.
          7.  **Actually:** The best way to ensure defection in Game 1 is to make the last round *very* salient. Count down aloud. "This is Round 8... Round 9... FINAL ROUND."

  6.  **Debrief Structure:**

      *   Map specific moments to theory.
      *   Game 1 End $\rightarrow$ Backward Induction.
      *   Game 2 Stability $\rightarrow$ Folk Theorem/Shadows of Future.
      *   Game 3 Collapse $\rightarrow$ Incentive Compatibility Constraint ($\delta$ threshold).
      *   What the game *can't* show: Nash Equilibrium selection (why cooperate vs. defect?), the specific strategy (Tit-for-Tat vs. Grim), and the role of communication (cheap talk).

  7.  **Drafting the Content:**

      *   *Tone:* Professional, pedagogical, respectful of the instructor's expertise.
      *   *Math:* Show the derivation clearly so the instructor can put it on the board.
      *   *Logistics:* Be specific about the randomizer (e.g., Random.org).
      *   *Troubleshooting:* Be honest about time creep.

  8.  **Refining the Optional Add-ons:**

      *   *Tournament:* Doing this live with 18 students is chaotic. Suggest assigning it as a "design a strategy" homework for next week, or run a computer simulation live if possible. I'll advise *against* doing it live to protect the debrief time.
      *   *Noise:* This is crucial for Tit-for-Tat vs. Generous Tit-for-Tat. It's a great point. I'll suggest adding it as a "Round 4" *only if* Games 1-3 move fast, otherwise discuss it theoretically.

  9.  **Final Review against Constraints:**

      *   90 minutes? Tight but doable if transitions are snappy.
      *   18 students? 9 pairs is manageable.
      *   Philosophy + Econ? Need to bridge the "rationality" gap (Econ) with the "normative" gap (Phil).
      *   Instructor's specific worry (Game 1 cooperation): Addressed via countdown and framing.
      *   Instructor's specific worry (Game 3 math): Verified.

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Wait, if I counterbalance Game 1 and 2, I need two sets of instructions ready.
      *   *Correction:* The leaderboard needs to be updated *during* the game to create pressure, or just at the end? During creates more stress/time. At the end is cleaner. Let's do "Running Total" on their sheet, "Top 3" on the board after each game.
      *   *Correction:* On the "Nice Group" issue. If they cooperate in Game 1, the backward induction lesson fails. I need a strong intervention. I will suggest a "Practice Round" that reveals the payoff structure viscerally before Game 1 starts.
      *   *Correction:* On the Math. Make sure to explain *why* Game 3 fails. $\delta = 0.9$ is high, but $T=25$ makes the temptation too juicy.

  11. **Final Polish:** Check the tone. Ensure the debrief questions are open-ended but leading. Ensure the "What this can't show" section is honest (e.g., it doesn't show *why* we care about fairness, just that incentives matter).

  *(Self-Correction on the Tournament)*: The instructor asked "is it worth bolting on". I need to give a direct "No, but..." answer. It wrecks the timing. Suggest it as a follow-up assignment instead.

  *(Self-Correction on Noise)*: Same. It's rich but complex. Suggest it as a "What if" discussion point in the debrief rather than a full fourth game.

