answer: |-
  This is a remarkably precise observation. You have isolated a specific mechanism of cognitive-linguistic interaction that is often blurred in popular discussions of the Sapir–Whorf hypothesis. You are describing an effect that is **online** (happening in real-time), **production-bound** (tied to the act of encoding), and **grammatically driven** (triggered by obligatoriness).

  Per your instructions, I will first brainstorm the candidate concepts and research traditions that might cover this, evaluating their claims. Then I will identify the best fit, distinguish it from its neighbors, and define the boundaries of the phenomenon you have observed.

  ### Part 1: Brainstorming Candidate Concepts

  Here are the four most relevant research traditions or concepts that attempt to describe the relationship between language and thought.

  **1. Linguistic Determinism (The "Strong" Whorfian Hypothesis)**
  *   **Claim:** The structure of a language strictly determines the structure of thought. Speakers of different languages perceive and categorize the world in fundamentally different, incommensurable ways.
  *   **Relevance:** This suggests a permanent change in worldview.
  *   **Fit:** **Poor.** Your observation explicitly notes that the effect *vanishes* during non-linguistic tasks (sorting tickets, pointing at diagrams). Determinism claims the difference persists even when silent.

  **2. Linguistic Relativity (The "Weak" Whorfian Hypothesis / Neo-Whorfianism)**
  *   **Claim:** Language influences thought, habit, or memory, but does not determine it. Speakers are *biased* toward certain distinctions (e.g., color discrimination, spatial orientation) even in non-linguistic tasks.
  *   **Relevance:** This allows for influence without determinism.
  *   **Fit:** **Imperfect.** Modern "Neo-Whorfian" research (e.g., by Boroditsky or Winawer) often claims to find these effects in *non-linguistic* cognitive tasks (like matching colors or remembering directions without words). Your observation is stricter: you see the effect *only* when language is being produced.

  **3. Modularity of Mind (Fodor)**
  *   **Claim:** The mind is composed of distinct, independent modules. The "language module" is encapsulated; it processes language but does not fundamentally alter central cognitive processes (belief, perception).
  *   **Relevance:** This explains why the non-linguistic tasks (coding, sorting) remain unaffected.
  *   **Fit:** **Partial.** This explains the *boundary* (why the effect stops at non-linguistic tasks), but it doesn't explain the *influence* you are seeing. Pure modularity would predict your teammates shouldn't show *any* linguistic habit transfer in English, yet they do.

  **4. Thinking for Speaking (Dan Slobin)**
  *   **Claim:** Language does not necessarily shape how we think *in general*, but it shapes how we think *while we are preparing to speak*. To speak, we must fit our thoughts into the specific grammatical categories our language requires. We attend to specific aspects of experience (motion, evidence, aspect) only because the grammar forces us to encode them for the utterance.
  *   **Relevance:** This explicitly scopes the effect to the moment of linguistic formulation.
  *   **Fit:** **High.** This aligns with your observation that the distinction appears when "putting something into words" and vanishes otherwise.

  ---

  ### Part 2: Evaluation and Selection

  There is an established concept that fits your description cleanly, though it requires precise definition to distinguish it from the looser "Weak Relativity" label.

  #### The Primary Fit: "Thinking for Speaking"

  The concept you are describing is best captured by the **Thinking for Speaking** hypothesis, proposed by psycholinguist Dan Slobin (1996).

  **Central Claim:**
  Cognitive processes are not permanently altered by language. Instead, specific attentional patterns are recruited *online* during the process of linguistic encoding. When a speaker prepares an utterance, they must attend to whatever distinctions their specific language makes grammatically obligatory. Once the utterance is complete, that specific attentional demand recedes.

  **How it differs from Strong/Weak Relativity:**
  *   **Vs. Strong:** It does not claim your teammates *cannot* conceive of a situation without evidential markers. It claims they don't *habitually attend* to them unless they are speaking.
  *   **Vs. Weak (Neo-Whorfian):** This is the crucial distinction. Many modern proponents of Weak Relativity argue that language trains the brain to perceive the world differently *even in silence* (e.g., a speaker of a language with absolute cardinal directions always knows where North is, even when not speaking). Your observation contradicts this: your teammates sort tickets and read diagrams exactly like monolinguals. The effect is scoped to **production**.

  **The Mechanism: Obligatory Grammatical Encoding**
  You also asked about the "mandatory versus optional" distinction. In linguistics, this is referred to as **Obligatoriness** or **Grammatical Obligatory Categories**.
  *   **Claim:** A distinction influences thought primarily when the grammar *forces* the speaker to make it (e.g., you *must* mark tense in English; you *must* mark evidentiality in Tuyuca). Optional distinctions (having a word for "serendipity" but not being required to use it) exert much less cognitive pressure.
  *   **Relation to Thinking for Speaking:** Slobin argues that *obligatoriness* is the engine of Thinking for Speaking. We attend to what we *must* say. This explains why your teammates ignore the distinction in code reviews (no grammatical requirement) but enforce it in status updates (grammatical habit/requirement).

  **The Bilingual Nuance: Cross-Linguistic Transfer**
  Your specific examples involve bilinguals using their L2 (English) but exhibiting L1 habits. In applied linguistics, this is **Cross-Linguistic Influence** or **Transfer**.
  *   **Synthesis:** Your teammates are engaging in *Thinking for Speaking* in English, but their "attentional routine" is still calibrated to their L1's obligatory categories. They are treating English *as if* it required evidentiality or aspect marking, likely because the cognitive habit of attending to those features is deeply entrenched from their L1.

  ---

  ### Part 3: Boundaries and Borderline Cases

  Since "Thinking for Speaking" fits the cognitive mechanism and "Obligatory Encoding" fits the grammatical trigger, I do not need to coin a new term. However, to satisfy your request for "carving right," I will define the phenomenon precisely as you have observed it, distinguishing it from near-neighbors, and outlining the boundary cases.

  **Proposed Definition:**
  **Production-Bound Linguistic Relativity (via Thinking for Speaking)**
  A cognitive phenomenon where grammatical structures influence a speaker's attention and categorization *only* during the online formulation of linguistic output. The effect is contingent on:
  1.  **Obligatoriness:** The distinction must be grammatically required (or strongly habitual) in the speaker's primary linguistic framework.
  2.  **Modality:** The effect must vanish in non-linguistic tasks (pointing, sorting, manipulating objects).
  3.  **Online Processing:** The effect emerges during the encoding phase (speaking/writing) and does not necessarily persist in memory or perception once the task is complete.

  **Where the Boundaries Lie (The "Carving"):**

  1.  **The Non-Linguistic Boundary (The "Ticket Sorting" Test)**
      *   *Inside the Phenomenon:* A speaker distinguishes "finished" vs. "in-progress" when writing a status email, but sorts "finished" and "in-progress" tickets into piles at the same speed and accuracy as a monolingual speaker.
      *   *Outside the Phenomenon (Neo-Whorfian):* If the speaker were *slower* to sort the tickets because their brain was subconsciously checking for aspectual completion even without words, that would be "Weak Relativity" (non-linguistic bias), *not* the production-bound effect you observed.
      *   *Why this matters:* Your observation is valuable because it supports the "modular" view (language is a tool we pick up) rather than the "immersive" view (language is a lens we wear 24/7).

  2.  **The Obligatoriness Boundary (The "Handy Word" Test)**
      *   *Inside the Phenomenon:* A speaker compulsively marks evidence ("I think," "Apparently") because their L1 grammar *requires* evidentiality.
      *   *Outside the Phenomenon:* A speaker uses a specific word like "debug" frequently because their language has a handy term for it, but does not feel compelled to mark it in every sentence.
      *   *Why this matters:* Vocabulary (lexical) availability rarely drives this effect. Grammar (syntactic/morphological) requirement does. If your teammate simply used the word "inference" often because they like it, that is style, not the phenomenon you described. It must feel *compulsory* to them.

  3.  **The Transfer Boundary (The "L2 Production" Test)**
      *   *Inside the Phenomenon:* The speaker exhibits L1 grammatical habits while speaking L2 (e.g., marking evidentiality in English).
      *   *Outside the Phenomenon:* The speaker exhibits L1 habits while *thinking* in L2 silently.
      *   *Why this matters:* If they reported that they *thought* about evidence differently even when silent, that would be deeper cognitive restructuring. Your observation that it happens "at the moment she has to say or write something" places this firmly in the production domain.

  ### Summary

  You have independently rediscovered a specific, rigorous formulation of linguistic relativity known as **Thinking for Speaking**, driven by **Obligatory Grammatical Encoding**.

  *   **Name:** Thinking for Speaking (Slobin).
  *   **Mechanism:** Obligatory Grammatical Encoding.
  *   **Context:** Cross-Linguistic Transfer (in your bilingual examples).
  *   **Key Distinction:** It is **production-bound**. It does not claim language changes how you *see* the world (perception), but how you *package* the world for transmission (encoding).

  Your intuition that this is distinct from the standard "Weak Whorfian" debate is correct. Most public debates conflate "Thinking for Speaking" (online encoding) with "Linguistic Relativity" (offline cognition). Your engineering mindset has allowed you to isolate the variable: the effect toggles on when the "output function" (speech/text) is called and toggles off when the "processing function" (coding/sorting) runs. That is a precise empirical distinction that many philosophers of language struggle to articulate.
