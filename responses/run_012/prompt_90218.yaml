  You direct a humanitarian fund with enough capital for one intervention. Option A purchases mosquito nets, certainly saving 1,000 lives. Option B funds a speculative planetary defense system against an asteroid impact. Standard astrophysical models assign a 1-in-10^9 chance of impact (ending 8 billion lives), which would normally render B's expected value negligible. However, you acknowledge a 5% probability that the standard models are fundamentally flawed, in which case the true impact risk is actually 1-in-10^5. Under this second-order uncertainty, Option B's expected value calculates to roughly 4,000 lives, outweighing Option A, even though there remains a 99.99995% chance that your expenditure saves absolutely no one while the 1,000 people denied nets die.

  **Expected Value Theory:** EV maximization requires choosing Option B. The arithmetic is linear: you sum the products of probabilities and outcomes across all possible states of the world (including the state where the model is flawed). Because the payoff in the "flawed model" state is so enormous (8 billion lives), even a small probability weight (5% chance of flaw × 1-in-10^5 risk) dominates the certain but modest payoff of Option A. The theory dictates that you must ignore the near-certainty of zero impact to chase the heavy tail of the distribution.

  **Rival Theory (Risk-Weighted Expected Utility):** A risk-weighted view would choose Option A. REU modifies the calculation by applying a weighting function to probabilities that discounts extremely low-probability events relative to their linear value, reflecting the intuition that a 1-in-2-million chance is not worth sacrificing a certainty for, regardless of the magnitude. Alternatively, a Maximin rule would select A because it guarantees the best worst-case outcome (1,000 lives saved vs. 0 lives saved).

  **The Single Feature:** The work is done by **second-order uncertainty** (uncertainty about the probability estimate itself). This structural feature creates a "heavy tail" in the value distribution. It allows a tiny slice of the probability space (where the model is wrong) to carry enough expected value to overwhelm the rest of the distribution, without requiring infinite utility or theological stakes.

  **The Honest Bit:** If you remove second-order uncertainty and fix the probability at the expert consensus of 1-in-10^9, the expected value of Option B drops to roughly 8 lives, and the fanaticism vanishes; EV maximization then agrees with common sense to choose Option A. A committed expected-value maximizer defends the original case by arguing that removing second-order uncertainty is epistemically arrogant. They would claim that assigning zero probability to "model error" is irrational; any realistic agent must acknowledge a non-zero chance their probability estimates are wrong. Therefore, the heavy tail is not a bug of the math, but an inevitable feature of rational decision-making under empirical uncertainty. To avoid the fanaticism, you must either accept epistemic dogmatism (claiming certainty about probabilities) or abandon linear value aggregation.
