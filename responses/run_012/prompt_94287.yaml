answer: |-
  **MEMORANDUM**

  **TO:** Special Collections Acquisitions Committee
  **FROM:** Graduate Representative, Department of History
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation Regarding the Proposed Donation of 47 Inscribed Lead Tablets (Collection ID: Pending)

  ### 1. Executive Summary and Bottom Line

  This memo recommends that the Committee **vote to accept the donation of the 47 inscribed lead tablets**, contingent upon two specific conditions regarding cataloging metadata and scholarly citation. 

  While the provenance of these objects is compromised and their textual authenticity is actively disputed, removing them from scholarly scrutiny by rejecting the donation would likely result in their dispersal into the private market, rendering them permanently inaccessible. However, acceptance must not come at the cost of institutional integrity. We cannot validate the donor's request to catalog these items without qualification. 

  **The Bottom Line:** We accept the physical objects for preservation and study, but we explicitly reject the notion that acquisition confers authenticity. The catalog record must reflect the uncertainty, and any scholarly use must cite that uncertainty. If the donor refuses these cataloging conditions, the Committee should vote to decline the donation.

  ### 2. Background and Stakes

  The collector offers 47 lead tablets alleged to originate from a cave deposit in the eastern Mediterranean (1970s). There is no excavation record, the chain of custody begins with a dealer in 1976, and findspot notes are contradictory. Radiocarbon dating of the associated wooden box (150 BCE–250 CE) confirms the age of the wood but not the inscriptions, as old wood is a common medium for modern forgery.

  The scholarly stakes are high. If authentic, the tablets rewrite the history of a specific religious association. If forgeries, they represent a sophisticated pastiche designed to mimic that history. Two faculty members argue for authenticity; three argue for forgery based on anachronistic formulae.

  The donor's ultimatum is that the library must catalog them as "ancient documents" and permit citation as historical evidence, or he will sell them at auction. The Committee is divided between ethical concerns (looting, forgery, policy compliance) and scholarly concerns (preservation of potential evidence).

  ### 3. Analysis of the "Warrant Score" Proposal

  The Subcommittee has proposed a "Warrant Score" (0–100) based on custody, consistency, corroboration, and market base rates. While well-intentioned, I recommend the Committee **reject the numerical scoring system** in favor of a qualitative **"Epistemic Status Statement."**

  **Engaging the Critique of False Rigor:**
  The strongest argument against the Warrant Score is that it lends a false appearance of scientific precision to what is ultimately a qualitative judgment. Assigning a number (e.g., "Warrant Score: 62") implies a calculable probability that we cannot possess. It risks reifying contestable assumptions—such as the "criterion of embarrassment" or "multiple attestation"—which depend on theoretical models of how ancient communities wrote and behaved. A low score might discourage legitimate inquiry; a high score might illegitimately canonize a forgery.

  **Engaging the Critique of "Lie of Omission":**
  Critics argue that cataloging these as "ancient documents" without a prominent warning is a lie of omission. They are correct. If we accept the donor's condition to label them simply as "ancient documents," we obscure the critical distinction between the *material age* of the lead and the *historical veracity* of the text. To do so would violate our commitment to information integrity. However, rejecting the donation entirely punishes future scholars who might, with new methods, solve the authenticity question. 

  Therefore, the solution is not rejection, but **radical transparency**. We can catalog them as "Ancient Documents (Unprovenanced/Disputed)" provided the catalog record forces the user to confront the uncertainty.

  ### 4. Recommended Course of Action

  I move that the Committee approve the acquisition under the following **Conditions of Acceptance**:

  **A. Cataloging and Metadata**
  1.  **Designation:** Items will be cataloged under the heading *Ancient Documents (Unprovenanced)*. 
  2.  **Mandatory Context Statement:** Every catalog record for these tablets must include a permanent, non-editable "Provenance and Authenticity Note." This note will summarize:
      *   The lack of archaeological context.
      *   The 1976 dealer acquisition date.
      *   The existence of the ongoing scholarly debate regarding authenticity.
      *   The radiocarbon data limitations.
  3.  **Rejection of Numerical Scoring:** Instead of a "Warrant Score," the Context Statement will provide a qualitative assessment of the evidence (e.g., "Textual authenticity currently disputed due to anachronistic formulae").

  **B. Scholarly Use and Citation**
  1.  **Access:** The tablets will be made available to qualified researchers for physical and digital examination.
  2.  **Citation Requirement:** Any publication citing the text of these tablets as historical evidence must explicitly cite the "Provenance and Authenticity Note" in the bibliography or footnotes. 
  3.  **Disclaimer:** The Library will require that any exhibition or digital publication of the text include a disclaimer stating that the University does not vouch for the authenticity of the inscriptions.

  **C. Donor Ultimatum**
  We will inform the donor that while we wish to accept the donation, our cataloging standards require accurate description of provenance uncertainty. If the donor interprets this as a violation of his condition to catalog them as "ancient documents," we must be prepared to decline the gift. Institutional integrity regarding metadata cannot be compromised by donor restriction.

  ### 5. General Policy Implications

  This decision sets a precedent for how this University handles unprovenanced antiquities. I recommend the Committee adopt the following **Principles for Unprovenanced Textual Material**:

  1.  **Preservation vs. Validation:** Acquisition is an act of preservation, not validation. Holding an object does not certify its authenticity.
  2.  **The "Last Resort" Clause:** Unprovenanced materials may be accepted only when there is a significant risk that rejection will result in the material becoming permanently inaccessible to science (e.g., private auction), *and* when the material holds unique research potential that outweighs the reputational risk.
  3.  **Transparency as Policy:** Uncertainty must be encoded in the metadata. We do not hide provenance gaps; we highlight them. A "clean" catalog record for an unprovenanced object is a violation of policy.
  4.  **Dynamic Status:** The "Epistemic Status" of an object is not static. As new evidence arises (e.g., new parallels found, new scientific testing), the catalog record must be updated to reflect the current scholarly consensus.

  ### 6. Resolution for Vote

  **Motion:** To accept the donation of 47 inscribed lead tablets, contingent upon the donor's agreement to the cataloging and citation conditions outlined in Section 4. If the donor withdraws the offer based on these conditions, the motion fails, and the donation is declined.

  **Rationale:** This path secures the objects for future scrutiny while refusing to legitimize the black market or obscure the truth. It acknowledges that while provenance is the gold standard, the total exclusion of unprovenanced material can also damage historical knowledge. It prioritizes transparency over the comfort of certainty.

  ### 7. Next Steps

  Upon approval, I will draft the letter to the donor outlining our cataloging requirements. Simultaneously, the Library will work with the Department of History to draft the standard "Provenance and Authenticity Note" to ensure it is neutral and accurate.

  I look forward to discussing this recommendation at Thursday's meeting.
