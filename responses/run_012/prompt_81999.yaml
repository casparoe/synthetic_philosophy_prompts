prompt: |-
  So I'm in an awkward spot and I need help prepping for it. I'm a PhD student in a "history and philosophy of the social sciences" program (which the actual history department keeps reminding me is not the same thing), and I've been asked to give a work-in-progress talk to their Cold War reading group next month. My paper argues that "who started the Cold War?" is the wrong question, but not in the usual way people mean that. I don't think it's merely hard to answer; I think the question fuses two different things and pretends they're one. "Starting" sounds like a causal, datable, attributable fact, but the reason anyone cares is normative -- it's really a blame question wearing a causal costume. And underneath it there's a hidden assumption that the relevant unit of action is the unitary state, acting at a single moment. So I want to split the question in two: a purely causal question about escalation dynamics (where I think the answer is genuinely overdetermined and boring), and a separate normative question that I'm framing with a term I've been coining, "standing to prevent" -- meaning the combination of capability, awareness, and legitimate authority that would have let a given actor alter the trajectory. Not "who fired first" but "who was positioned to stop it and what does their failure mean." I get twenty minutes and then an hour of Q&A, and I know this room is going to come at me from four directions at once.

  Here's the room. There's the old-guard guy who's certain the answer is simply Soviet expansionism and reads any complication of that as moral cowardice or as a sneaky way of relativizing; he'll say I'm making excuses. Then there are two people working in the revisionist tradition who'll insist the answer is just as simply American economic and atomic diplomacy, and they'll hear "it's the wrong question" as a maneuver that quietly lets Washington off the hook -- for them, depersonalizing the blame is itself a political act. There's a post-revisionist who actually agrees the old binary is dead but will think my replacement is worse, because for her the interesting object is the mutual misperception and the security dilemma, not a new ledger of who had "standing"; she'll say I've reinvented moral scorekeeping with extra steps. And then there's one philosopher of history who sits in on these sessions and will want to know what "standing to prevent" even denotes, and whether I've just relabeled a counterfactual as an obligation.

  What I need is a Q&A prep sheet. Give me the objections I'll actually get from *this* room -- not the generic ones any historian would raise -- ordered by how much damage each does to the paper. Phrase each one the way that particular person would phrase it, in their own vocabulary, so I can recognize it coming. For each objection: tell me what I should concede up front, what I should hold firm on, a two-minute reply, and one line on where that reply is softest. Also give me the single question I'm dreading (I have a guess about what it is, but I want to see if you land on the same one), and a short note on which of my four audiences I should try hardest not to lose. Skip the "you should read X" stuff -- I know the literature, this is the live-fire version.
