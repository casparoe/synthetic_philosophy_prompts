  2.  **Deconstruct Risk-Weighted Expected Utility (REU):**
      *   Standard Expected Utility (EU): $\sum p_i \cdot u_i$.
      *   REU (Buchak): $\sum [r(\sum_{j=i}^n p_j) - r(\sum_{j=i+1}^n p_j)] \cdot u_i$. Or more intuitively: You weigh the *increment* of utility gained by moving from a worse outcome to a better one by a transformed probability of achieving *at least* the better outcome.
      *   Risk-averse function $r(p)$: Concave. $r(p) < p$ for high probabilities, $r(p) > p$ for low probabilities (specifically regarding the weight of the worst cases). Actually, for risk aversion, the weight on the worst outcome is amplified.
      *   The prompt's description: "sort outcomes from worst to best... weight you give the jump up to a better outcome isn't that outcome's own probability but a function of the chance of getting it or anything better."
