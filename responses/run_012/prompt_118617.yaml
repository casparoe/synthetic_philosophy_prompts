      *   *The Apparent Contradiction:* Why eggs yes, womb no?
      *   *Theoretical Distinction:* Regenerative vs. Non-regenerative? No, eggs are finite. Process vs. Product?
      *   *Key Distinction:* **Inseparability of Person and Process.**
          *   Egg donation is a *medical procedure* (like donating blood or kidney, but less invasive). It's a one-time event. The "product" (egg) leaves the body, but the *person* remains distinct.
          *   Surrogacy is a *state of being*. You cannot separate the woman from the pregnancy. To pay for surrogacy is to rent the *person*, not just buy a service. It creates a master/servant dynamic over 9 months.
      *   *Motherhood:* Mater semper certa est (The mother is always certain). The woman who gives birth is the mother. This is biological certainty vs. legal fiction.
      *   *The "Compensation" Loophole:* It's not payment for the *egg* (which would be selling body parts); it's reimbursement for *time, pain, and risk*. This preserves the "gift" model while acknowledging burden.
      *   *Coherence:* It's not about "body parts" generally; it's about *integrity of the person during the process*. Surrogacy threatens bodily autonomy *during* the process (diet, lifestyle, medical decisions) in a way egg donation does not.

  3.  **Deconstruct the US Position (The "Liberty/Contract" Model):**
      *   *Core Principle:* Reproductive Liberty and Freedom of Contract.
      *   *Belief about Parenthood:* **Intent over Biology.** (The "Intent Standard"). If you initiated the creation of the child with the intent to parent, you are the parent.
