      *   *Compensation vs. Payment:* Is it real? Theoretically, yes (reimbursement vs. profit). Practically, often no (it's market rate).
      *   *Eggs vs. Sperm:* Paying for eggs acknowledges the physical burden (hormones, surgery) sperm donors don't face. It's not treating them the same; it's compensating for *invasiveness*.
      *   *Legal Motherhood vs. Money:* Can you ban payment but keep intended parents? Yes (Altruistic Surrogacy models in Canada/Australia/UK). This proves the money ban and the parenthood rule are separate levers.

