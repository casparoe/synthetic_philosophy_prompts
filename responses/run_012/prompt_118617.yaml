prompt: |-
  ok so for civics we had to pick a med ethics topic and present both sides and i picked surrogacy and egg donation and now i'm stuck on something and my teacher said to write down what i actually want to know instead of just saying its confusing.

  heres the thing i cant get past. in a bunch of european countries (spain is the one i used in my slides) you cannot pay a woman to carry a baby for you. the contract is void, the woman who gives birth is the legal mother no matter what anybody signed, and its all justified by dignity and not turning womens bodies into products and not exploiting poor women. but the SAME country lets clinics give women money for their eggs. its officially called compensation for the inconvenience and expenses, not payment, but it is money and it is for a body part. and theres a european bioethics treaty (oviedo convention i think?) that says the human body and its parts shouldnt be a source of financial gain, which you would think kills both of them.

  then flip it. in the US, at least in lots of states, you can pay a surrogate, the contract basically decides who the parents are from the moment of birth, and the whole thing costs more than a house deposit. so there the surrogate and the egg donor are both getting paid and the money is just the price of the service.

  what i want is the underlying theory. like for you can sell that but not that to be a coherent position and not just vibes, what does the ban have to believe? about what a body is, about what a mother is, about what the actual difference is between a few eggs and nine months of your life and your health and then handing over the baby? and what does the american version have to believe about parenthood, that its about who intended the kid rather than who grew it, and that someone can contract away being a mother?

  also i want to know which parts are actually required and which parts the rules would survive without. could someone be against paid surrogacy just because of the contract side (you cant promise a baby before it exists, you cant enforce a deal about a person) while thinking nothing at all about commodification? could someone be against it only because it goes wrong in practice, exploitation and rich foreigners and all that, without thinking its wrong in principle? and is the compensation vs payment thing a real moral line or just relabeling so everyone can feel ok about it? same question the other way: does paying for eggs really treat them like sperm, or does it assume something different about womens bodies?

  last thing, if you took away whichever belief is doing the real work, what would actually have to change? does the rule about who the legal mother is follow from the money rule, or is that a separate commitment that just happens to travel with it? like could you have a place that bans paid surrogacy but still lets the intended parents be the legal parents?

  no sources or reading list please, we're not allowed to cite stuff we havent read anyway, i just want the actual theory underneath so i can argue about it in class and not get destroyed.
