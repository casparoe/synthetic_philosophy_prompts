answer: |-
  This is a fantastic observation. You have identified the exact friction point that bioethicists argue about. The reason you feel stuck is that you are looking for a single rule that applies to everything, but the law isn't built on one rule; it's built on competing values.

  To argue this in class without getting destroyed, you need to articulate the **internal logic** of each side. You need to show that neither side is just "vibes"; they are just prioritizing different philosophical commitments.

  Here is the underlying theory for both positions, broken down by the specific questions you asked.

  ### 1. The European Logic (The "Dignity and Inseparability" Model)
  *Example: Spain, France, Germany (varies, but this is the general ethos)*

  **What does this position believe about the body?**
  It believes in the **Non-Commodification Principle**. The human body is not a tool or a warehouse of spare parts. However, they make a distinction between *giving* and *renting*.
  *   **Egg Donation:** This is viewed as a medical procedure similar to donating blood or a kidney. It is invasive, so you are compensated for the pain, time, and risk. But you are not selling the egg itself; you are being reimbursed for the *act* of donation. The theory is that the egg is a "part" that can be separated from you without changing who you are.
  *   **Surrogacy:** This is viewed differently because you cannot separate the woman from the process. To pay for surrogacy is not to buy a "service"; it is to rent the *person*. For nine months, the surrogate's body is the environment for the child. If you pay her, you create a power dynamic where the payer has authority over the eater, the sleeper, and the medical decisions of the carrier.
  *   **The Coherence:** The ban isn't about "body parts" generally; it's about **bodily integrity over time**. You can give a part (egg), but you cannot lease your existence (womb) because that turns the *person* into a product, not just the *part*.

  **What does this position believe about a mother?**
  It believes in **Mater Semper Certa Est** ("The mother is always certain").
  *   Motherhood is established by the biological fact of gestation and birth.
  *   It rejects the idea that you can "contract away" motherhood. You cannot sign a paper before conception saying "I am not the mother" because the law believes the physical bond of pregnancy creates a status that cannot be pre-negotiated.
  *   **Why?** To protect the child and the woman. If the birth mother is the legal mother, she has the right to change her mind. If the contract is void, she cannot be forced to hand over the baby. This prioritizes the *reality of the body* over the *intent of the mind*.

  ### 2. The American Logic (The "Liberty and Intent" Model)
  *Example: California, Nevada, etc.*

  **What does this position believe about the body?**
  It believes in **Self-Ownership and Contractual Freedom**.
  *   If I own myself, I have the right to use my capacities to earn money, provided I consent.
  *   Money does not inherently corrupt. In fact, banning payment restricts liberty and reduces the supply of surrogates, which hurts infertile couples.
  *   **The Coherence:** There is no moral difference between eggs and surrogacy in this model. Both are reproductive labor. If we pay for labor in every other industry, why is reproductive labor the one place where payment is forbidden?

  **What does this position believe about parenthood?**
  It believes in the **Intent Standard**.
  *   Parenthood is not defined by who provides the genetic material or who grows the fetus. It is defined by **who initiated the creation of the child with the intent to raise it.**
  *   **Why?** This treats the child as a project of the intended parents, not a biological accident of the surrogate.
  *   **Contracting Motherhood:** Yes, this model believes you *can* contract away motherhood. It views the surrogate not as a "mother giving up a child," but as a "service provider completing a job." The legal transfer of parenthood happens at birth (or before), based on the pre-birth order.

  ### 3. Answering Your "What If" Questions

  Here is how you break down the specific contradictions you noticed.

  **Q: Is "Compensation" vs. "Payment" a real moral line or just relabeling?**
  *   **The Theory:** It is supposed to be a real line. **Payment** implies profit and market value (supply and demand). **Compensation** implies restitution (making someone whole for a loss).
  *   **The Reality:** In class, you can argue this is often semantic. If the "compensation" for eggs is $5,000, that is market rate, not just expense reimbursement.
  *   **The Argument:** If you want to defend the European model, you argue: "Compensation acknowledges burden without assigning market value to life." If you want to attack it, you argue: "It is hypocritical labeling to allow high compensation for eggs but ban payment for surrogacy, when surrogacy is the heavier burden."

  **Q: Does paying for eggs treat them like sperm, or assume something different about women's bodies?**
  *   **The Theory:** It assumes something different. Sperm donation is low-risk, non-invasive, and regenerative. Egg donation requires heavy hormones, surgery, and carries health risks.
  *   **The Argument:** Paying for eggs acknowledges **asymmetry**. If we paid men and women the same, we would be ignoring the physical reality of the female body. So, paying women *more* (or at all) for eggs is actually acknowledging that their bodily contribution is physically harder, not that their parts are for sale.

  **Q: Could someone be against paid surrogacy just because of the contract side (you can't promise a baby) without thinking it's commodification?**
  *   **Yes.** This is a **Contract Law** argument, not a Bioethics argument.
  *   **The Belief:** You cannot enforce a contract for something that doesn't exist yet (the baby) or for something that requires ongoing bodily consent (pregnancy). If a surrogate changes her mind at month 8, you cannot force her to hand over the baby without violating her bodily autonomy. Therefore, the contract is void *not* because money is bad, but because **human beings cannot be the subject of a performance contract.**
  *   **Class Move:** This allows you to say, "I support surrogacy in principle, but I oppose the legal enforcement of it."

  **Q: Could someone be against it only because it goes wrong in practice (exploitation) without thinking it's wrong in principle?**
  *   **Yes.** This is the **Pragmatic/Exploitation** argument.
  *   **The Belief:** Surrogacy *could* be ethical between two equals. But in reality, the money flows from rich to poor, and often from Global North to Global South. Until we fix income inequality, paid surrogacy is inherently coercive.
  *   **Class Move:** This distinguishes you from the "Dignity" crowd. You aren't saying women's bodies are sacred; you're saying poor women are vulnerable.

  **Q: If you took away the core belief, what would actually have to change? (The Decoupling Question)**
  *   **Can you ban paid surrogacy but still let intended parents be legal parents?**
      *   **Yes.** This exists (e.g., UK, Canada, Australia). This is **Altruistic Surrogacy**.
      *   **How it works:** You cannot pay the surrogate (except expenses). But, after the baby is born, the intended parents can apply for a "Parental Order" to become the legal parents. The surrogate consents after birth.
      *   **What this proves:** It proves that the **Money Rule** and the **Motherhood Rule** are separate levers.
      *   **The European Tension:** Spain bans the contract entirely (surrogate remains mother). The UK allows the transfer of parenthood but bans the money.
      *   **The Argument:** If Spain wants to be consistent, they should follow the UK model. If they believe the birth mother is the *only* mother, they shouldn't allow parental orders. If they allow parental orders, they admit parenthood is about intent, which undermines their ban on surrogacy contracts.

  ### 4. How to Argue This in Class (Cheat Sheet)

  If someone attacks you, use these frameworks:

  **If they say: "It's hypocritical to ban surrogacy pay but allow egg pay."**
  *   **Your Response:** "It depends on whether you view the body as a collection of parts or a continuous self. The European view is that eggs are parts (separable), but pregnancy is the self (inseparable). Renting the self creates a master/servant relationship for 9 months. Donating a part does not."

  **If they say: "Banning payment exploits women by making it unpaid labor."**
  *   **Your Response:** "That is the Pragmatic argument. But the Dignity argument says some things shouldn't be for sale regardless of price. If we pay for surrogacy, we put a price tag on the transfer of a child. The ban isn't about saving money; it's about saying a child is not a product to be purchased, even if the purchase is labeled 'service'."

  **If they say: "Intended parents are the real parents, not the birth mother."**
  *   **Your Response:** "That is the Intent Standard, which works in the US. But the European system uses the Gestational Standard. If you switch to the Intent Standard, you have to allow contracts. If you keep the Gestational Standard, you have to admit the birth mother has rights. You can't have it both ways."

  **If they ask: "Is 'compensation' just a lie?"**
  *   **Your Response:** "It's a legal fiction that serves a moral purpose. It allows us to acknowledge the burden on the woman's body without admitting we are buying her capacity. Whether it works in practice is debatable, but theoretically, it draws a line between 'reimbursement' and 'profit'."

  ### Summary of the "Underlying Theory"
  *   **Europe:** The body is not a commodity. Pregnancy is inseparable from the person. Motherhood is biological fact, not legal contract.
  *   **US:** The self is property (I own me). Reproduction is a service. Parenthood is defined by intent and contract.
  *   **The Tension:** You cannot fully have both. If you pay for the service (US), you must accept the contract defines the parent. If you say the body defines the parent (Europe), you cannot enforce a contract that overrides the birth.

  The "contradiction" you see (eggs yes, womb no) is the system trying to balance **medical need** (we need eggs) with **human dignity** (we shouldn't rent wombs). It is imperfect, but it is not random. It is trying to say: *We will allow you to help us medically, but we will not allow you to lease your humanity.*
