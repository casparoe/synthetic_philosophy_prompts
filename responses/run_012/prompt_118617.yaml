      *   *Belief about Money:* Money doesn't inherently corrupt. It facilitates access. Banning payment reduces supply (fewer surrogates), which hurts intended parents.
      *   *Coherence:* It treats reproduction as a service industry. The surrogate is a service provider, not a mother. The contract defines reality.

  4.  **Address the Specific "What If" Questions:**
