answer: |-
  There isn't a single canonical word for this, though it sits firmly in the literature of organizational sociology and metrics. The closest existing concepts are **"Construct Drift"** (the definition of a variable changes over time) and **"Motivated Reasoning"** (processing information to reach a desired conclusion), but neither captures the specific institutional mechanic you're describing.

  If we are coining a term for your context, call it **"Target-Contingent Categorization."**

  It describes a process where the *boundaries* of a category are treated as fixed scientific facts, but are actually flexible administrative levers that are adjusted contingent on whether the target is at risk.

  Here is the carving you asked for.

  ### 1. Is this one phenomenon or three?
  It is **one phenomenon** driven by a specific systemic incentive, but it relies on two pre-existing conditions to work.

  *   **The Mechanism:** Performance pressure acting on semantic ambiguity.
  *   **Condition A (The Fog):** The category must be inherently fuzzy. "First-generation" is not a law of physics; it is a social construct. There *is* genuine debate about whether a parent with a foreign degree counts. If the category were "Students with a Social Security Number," this couldn't happen.
  *   **Condition B (The Stakes):** There must be a consequence for missing the number (budget loss, reputational hit, accreditation risk).

  The reason it feels like three different things (semantic shifts, cultural re-evaluations, administrative tweaks) is that the organization will reach for *whatever kind of ambiguity is available* to solve the pressure. But the engine is the same: **The definition is being optimized for feasibility, not fidelity.**

  ### 2. Where is the line between this and legitimate refinement?
  You noted that the redefinitions are "defensible on their own terms." That is why this is not fraud; it is **structural bias.**

  The line between *Legitimate Refinement* and *Target-Contingent Categorization* is **Time-Invariance.**

  *   **Legitimate Refinement:** You realize the definition of "first-gen" was flawed in 2021. You fix it in 2022. You would have fixed it even if you had smashed the target in 2021. The improvement is independent of the metric's performance.
  *   **Target-Contingent Categorization:** The "error" in measurement is only discovered when the metric is in the red. If you had exceeded the target by 10%, the "measurement error" would have remained invisible.

  **The Test:** Ask the room, *"If we had exceeded our target by 15% this year, would we still be having this conversation about how our definition is too narrow?"* If the answer is "probably not," it's Target-Contingent Categorization.

  ### 3. What would the mirror image look like?
  The mirror image is **Target-Contingent Exclusion.**

  Imagine a different incentive structure. Suppose your institution has a hard cap on financial aid dollars, or a mandate to keep "academic profile" (SAT/ACT) above a certain threshold to maintain rankings.

  *   **The Scenario:** You are at risk of exceeding your aid budget, or your average SAT is dipping.
  *   **The Move:** Suddenly, the definition of "Financial Need" tightens. Or, suddenly, "First-Generation" is redefined to *exclude* students with parents who have foreign degrees (perhaps arguing "they have cultural capital, they aren't truly disadvantaged").
  *   **The Feeling:** Nobody feels like they are cutting off aid. They feel they are "ensuring resources go to the *most* needy" or "maintaining academic rigor."

  The fact that you rarely see the narrowing version in diversity work (but often see it in budget/ranking work) proves the mechanism is real. The category expands or contracts like an accordion based on whether the pressure is to **include** (diversity targets) or **exclude** (budget/ranking caps).

  ### 4. How do you tell this apart from genuine improvement?
  You cannot tell by looking at the definition itself. The new definition *is* usually better. (e.g., Excluding foreign degrees from "college educated" *is* a more culturally nuanced definition of first-gen).

  You tell by looking at the **cadence of change.**

  *   **Genuine Improvement:** Happens iteratively or when new data becomes available. It is sporadic.
  *   **Target-Contingent Categorization:** Happens cyclically, correlated with performance gaps.

  **The Audit:**
  Plot your definition changes against your target performance over 10 years.
  *   If definition changes occur randomly relative to target performance: **Genuine Improvement.**
  *   If definition changes cluster tightly around years where the target was missed: **Target-Contingent Categorization.**

  ### Summary
  You are watching an organization manage cognitive dissonance. The institution wants to believe the target is meaningful (we care about first-gen students) and that the target is achievable (we are good at our jobs). When reality conflicts (we can't find enough first-gen students), the institution resolves the tension not by admitting failure, but by adjusting the reality of the definition.

  It isn't cheating. It's **institutional homeostasis.** The metric is preserved, the mission is preserved, and the only thing that changes is the dictionary.
