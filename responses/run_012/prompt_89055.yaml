      *   *Correction:* The prompt asks for the requirement that knocks out *candidates* (theories). **Causal Independence** knocks out Essence (circular) and Aggregate (often circular with institutions). Stereotype bypasses it. **Object Specification** knocks out Stereotype (if it claims to be about reality).
