      *   **Constraints:** No reading list/citations. Keep scoring brief. Focus on the list.

  2.  **Deconstruct the Considerations into Requirements:**

      *   *Measurement Point:* Small effect sizes, instrument instability.
          *   *Decision:* This is a genuine requirement. A theory must explain *what* is being measured. If it claims to measure personality but the data is noisy, it needs to account for that noise or redefine the target.
          *   *Requirement:* **Empirical Stability.** The theory must specify a stable substrate that survives methodological variance.

      *   *Reference-Group Effect:* Self-reports are relative to local norms.
          *   *Decision:* Genuine requirement. It attacks commensurability. If "honest" means different things in different places, the claim 'X are honest' is ambiguous.
          *   *Requirement:* **Commensurability.** The theory must define traits in a way that allows cross-cultural comparison without relying solely on subjective self-rating.

      *   *The Mismatch:* Beliefs vs. Measures.
          *   *Decision:* Genuine requirement. The theory needs to define its object. Is it about *actual* behavior/psychology or *shared beliefs*?
          *   *Requirement:* **Object Specification.** The theory must distinguish between descriptive reality (how they act) and reflective self-conception (how they see themselves).

      *   *Ecological Fallacy:* Group stats $\neq$ Individual prediction.
          *   *Decision:* This is a logical constraint, not necessarily a theory failure, but the theory must *acknowledge* it to prevent misuse.
          *   *Requirement:* **Level Distinction.** The theory must explicitly state the level of analysis (population distribution vs. individual essence) and forbid illicit inference.

      *   *Membership:* Who counts? (Diaspora, immigrants, etc.)
          *   *Decision:* Genuine requirement. Without boundary conditions, the claim is unfalsifiable.
          *   *Requirement:* **Boundary Conditions.** The theory must define the population scope (citizens, residents, cultural participants?) and handle edge cases.

      *   *Change:* Can it shift?
          *   *Decision:* Genuine requirement. If it's too rigid, it's falsified by history. If too fluid, it's trivial.
          *   *Requirement:* **Dynamic Capacity.** The theory must explain the mechanism of stability *and* the mechanism of change over time.

      *   *Circularity:* Character explains institutions, institutions explain character.
          *   *Decision:* Genuine requirement. This is a causal identification problem.
          *   *Requirement:* **Causal Independence.** The theory must identify a causal arrow or a feedback loop mechanism, not just a tautology.

      *   *Comparative Frame:* Rude relative to whom?
          *   *Decision:* Genuine requirement. Traits are often relational.
          *   *Requirement:* **Reference Class.** The theory must specify the comparison group (e.g., "rude" compared to global mean? compared to neighbors?).

      *   *Normative Slide:* Is/ought problem, discrimination, excuse-making.
          *   *Decision:* Red Herring for *truth conditions*, but crucial for *implications* (part c of the user's purpose). It's a constraint on the *use* of the theory, not necessarily the theory's truth, but since the user wants to know what follows from truth, the theory must block invalid normative inferences.
          *   *Decision:* Let's make it a requirement on *implications*.
          *   *Requirement:* **Normative Firewall.** The theory must structurally prevent deriving moral permissions or exemptions solely from descriptive claims.

  3.  **Drafting the Requirements (Iterative Refinement):**

      *   *Refining "Empirical Stability":* Needs to address the "small differences" issue. If differences are small, is the claim still meaningful? Yes, if the distribution shift is significant.
      *   *Refining "Commensurability":* Needs to address the reference group effect.
      *   *Refining "Causal Independence":* Needs to break the circle.
      *   *Refining "Normative Firewall":* This addresses the "abuse" concern.

