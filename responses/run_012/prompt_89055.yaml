answer: |-
  Here are the desiderata for a theory of national character, derived from your considerations, followed by the analysis you requested.

  ### The Desiderata

  **1. Object Specification** (from *The Mismatch*)
  The theory must define whether 'F' refers to a psychological distribution, a behavioral regularity, or a shared self-conception.
  *Reasoning:* If the theory claims "French are rude" refers to actual behavior but relies on self-report data, it fails. If it refers to self-conception, it cannot explain behavioral outcomes. You cannot assess truth conditions without knowing what kind of fact is being claimed.

  **2. Level Distinction** (from *The Ecological Fallacy*)
  The theory must explicitly state that the claim applies to a population distribution (mean, variance, skew) and logically forbid inference to any specific individual without probabilistic qualification.
  *Reasoning:* A claim about a country is a claim about a system or aggregate. If the theory permits moving from 'Country X is F' to 'Person x (from X) is F' as a deductive certainty, it is logically invalid. Adequacy requires blocking the illicit slide.

  **3. Boundary Conditions** (from *Membership*)
  The theory must specify the criteria for membership in 'Country X' (citizenship, residency, cultural socialization) and account for outliers (diaspora, dissidents).
  *Reasoning:* Without defined boundaries, the claim is unfalsifiable. If a counter-example (a warm Scandinavian) can be excluded ad hoc as "not truly Scandinavian," the theory is a tautology, not an empirical claim.

  **4. Metric Commensurability** (from *The Measurement Point* & *Reference-Group Effect*)
  The theory must provide a metric for 'F' that is invariant across cultures, or explain why local metrics are comparable.
  *Reasoning:* If "optimism" is measured by self-report, and Americans compare themselves to Americans while Japanese compare themselves to Japanese, the scores are not comparable. A theory must either use external behavioral anchors or demonstrate that subjective scales map to a universal latent trait.

  **5. Dynamic Capacity** (from *Change*)
  The theory must identify the mechanism of transmission (how character persists) and the mechanism of update (how character shifts).
  *Reasoning:* If character is immutable, it cannot explain historical change. If it is too fluid, it cannot explain stability. A theory that cannot account for postwar shifts or generational drift is empirically falsified by history.

  **6. Causal Independence** (from *Circularity*)
  The theory must distinguish the character variable from the institutional variable it is supposed to explain.
  *Reasoning:* If "Germans follow rules" is explained by "German institutions enforce rules," and "German institutions enforce rules" is explained by "Germans follow rules," no explanation has occurred. One side must be causally prior, or a third factor must drive both.

  **7. Reference Class** (from *The Comparative Frame*)
  The theory must specify the baseline for comparison (e.g., "rude" relative to the global mean, relative to neighbors, or relative to an ideal).
  *Reasoning:* "Tall" is meaningless without a comparison class. "Rude" is a relational property. A claim without a specified baseline is semantically incomplete.

  **8. Implication Integrity** (from *The Normative Slide*)
  The theory must structurally separate descriptive claims from normative permissions (e.g., hiring, mocking) or exemptions (responsibility).
  *Reasoning:* While this is often an abuse of the theory, an adequate theory must make such abuses logically difficult. If the theory's structure makes it easy to slide from "is" to "ought," it is socially dangerous and theoretically loose.

  ***

  ### Analysis of Requirements

  **Genuine Requirements**
  **Object Specification**, **Level Distinction**, and **Boundary Conditions** are genuine. They are logical prerequisites for *any* empirical claim. Without them, the sentence 'the people of country X are F' is not even a proposition that can be true or false; it is gibberish or poetry. You cannot referee a truth claim if the terms, scope, and level of analysis are undefined.

  **Camp Commitments**
  **Metric Commensurability**, **Dynamic Capacity**, and **Causal Independence** are often sites of ideological battle.
  *   *Skeptics* demand high bars for Commensurability (insisting cross-cultural psychometrics are impossible) and high Dynamic Capacity (insisting character must change quickly to be fake).
  *   *Essentialists* accept lower bars for Commensurability (trusting broad strokes) and prefer low Dynamic Capacity (viewing character as deep and slow).
  However, for a theory to be *adequate* (in your sense of explaining the world), it must meet these. A theory that cannot explain change is useless for history; a theory that cannot distinguish cause from effect is useless for policy. So while they are contested, they are necessary for a *working* theory.

  **Red Herring**
  **Implication Integrity** is partially a red herring regarding *truth*. A theory can be true and still be abused (e.g., "gravity pulls things down" can be used to drop a brick on someone). However, since your goal includes determining "(c) what does and doesn't follow," the theory must explicitly limit its own normative reach. It is a requirement on the *utility* of the theory, not its ontology.

  ***

  ### Incompatible Pairs

  The most significant tension is between **Metric Commensurability** and **Reference-Group Effect**.
  If the Reference-Group Effect is strong (people always rate themselves against local norms), then true Metric Commensurability (a universal scale) is impossible to achieve via self-report. To satisfy both, the theory must abandon self-reports entirely in favor of external behavioral observation, which is expensive and often intrusive. Most theories fail here: they claim universal comparability while using locally-normed data.

  A secondary tension exists between **Dynamic Capacity** and **Causal Independence**.
  To explain rapid change (high Dynamic Capacity), you usually need to point to institutions or economics. But if institutions cause character, you risk violating Causal Independence (since character is often invoked to explain institutions). Maintaining a distinct "character" variable that changes fast but isn't just a shadow of institutions is theoretically very difficult.

  ***

  ### The Killer Requirement

  **Level Distinction** does the most work in knocking out candidates.

  Most everyday claims of national character fail here. When your friend says "The French are rude," they almost invariably mean it as a heuristic for interacting with individual French people. If a theory enforces Level Distinction, it forces the claim to become: "The distribution of rudeness-behaviors in France is shifted right relative to the baseline." This immediately blocks the inference to the individual standing in front of you. It drains the claim of its predictive utility for daily life, which is usually why people make it. It forces the claim to be statistically precise or admit it is useless for prediction. It kills the "street version" of national character instantly.

  ***

  ### Scoring the Standard Moves

  **1. National Character as Shared Essence (transmitted down generations)**
  *Fails Dynamic Capacity and Causal Independence.* It treats character as immutable or slow-moving, failing to explain rapid historical shifts without ad hoc excuses. It inevitably collapses into circularity with institutions or biology. It passes Object Specification but fails the empirical reality of change.

  **2. National Character as Aggregate of Individual Traits**
  *Passes Level Distinction and Object Specification.* It correctly identifies the claim as statistical. However, it often fails *Causal Independence* (aggregates don't cause themselves) and struggles with *Metric Commensurability* if relying on self-reports. It is the most scientifically honest but offers the least explanatory power for *why* the aggregate looks that way.

  **3. National Character as Pure Stereotype (describes the perceiver)**
  *Passes Implication Integrity and Metric Commensurability* (by shifting the object to the perceiver's mind). However, it fails *Object Specification* relative to your goal: it makes the claim 'X are F' false (or about the speaker, not X). It dissolves the argument by changing the subject, which resolves the conflict but abandons the attempt to describe the world.
