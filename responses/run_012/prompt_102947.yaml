      *   *The Threat:* Consequentialism requires maximizing *good*. If the bulk of the value lies in the infinite/remote future, and that value is effectively random or incalculable relative to the action, then the "near" effects (which we *can* calculate) become negligible noise compared to the "far" effects.
      *   *Key Intuition:* It's not that we can't see the future; it's that the future is *too big*. The signal-to-noise ratio is inverted. The part we can see is irrelevant compared to the part we can't. This paralyzes the theory's action-guiding capacity.

  3.  **Task 2: Two Kinds of Cluelessness & The Horizon Response:**

      *   *Kind 1: Epistemic/Informational.* We lack data. More research/time would help. (e.g., Will this policy raise GDP by 2% or 3%?).
      *   *Kind 2: Structural/Metaphysical.* The causal chains are inherently chaotic or infinite. No amount of data resolves the sign of the total value because the series doesn't converge or is sensitive to chaotic variables. (e.g., Lenman's "saving the child" example).
      *   *The Horizon Response:* This response says "ignore the far future."
      *   *Which kind does it address?* It addresses the *Structural* kind. It admits we can't know the far future (even with more info) and proposes a rule to bypass the need to know. It treats the structural problem as a practical decision-theory problem.

