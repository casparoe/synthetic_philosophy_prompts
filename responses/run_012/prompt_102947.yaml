      *   *Verdict:* The symmetry argument is weak. It assumes a specific probability distribution (mean zero difference) without justification.
      *   *Repair?* Maybe "Expected Value" with subjective probabilities? But cluelessness argues we can't even assign probabilities. Maybe "Satisficing"? But that abandons maximization.
