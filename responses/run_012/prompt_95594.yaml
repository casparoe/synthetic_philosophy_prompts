answer: |-
  You have stumbled directly onto one of the sharpest knives in metaphysics and philosophy of science. You are right to reject "emergence" and "reductionism" as answers; they are the flags people plant, not the terrain itself.

  The specific problem you are describing has a name. It is the **Causal Exclusion Problem** (sometimes framed as the problem of **Causal Overdetermination**).

  The specific phenomenon you are asking about—whether the clump can be said to "push" the marble—is called **Downward Causation**.

  The book you are remembering is almost certainly by **Douglas Hofstadter**. In *Gödel, Escher, Bach* (the "Ant Fugue" chapter) and later in *I Am a Strange Loop*, he uses exactly this analogy (ants in a colony, or neural firings, or dominoes/marbles) to ask whether the "symbol level" has any power if the "physics level" is closed.

  Here is the carving you asked for. These are the distinct positions on whether your clumps are "really" doing the dragging.

  ### 1. The Setup: Micro-Causal Closure
  First, we must define the constraint you built into your box. You said: *"Every marble is only ever pushed or pulled by the marbles near it, nothing else."*
  In philosophy, this is **Micro-Causal Closure**. It means that if you trace the causal history of any single marble's movement, you never need to leave the level of marbles to find a sufficient cause. The physics is closed at the bottom.

  The puzzle arises because if the marbles are sufficient to cause the movement, there seems to be no "work" left for the clump to do. If the clump also claims to cause the movement, the movement appears to have two sufficient causes (the marbles *and* the clump), which looks like a contradiction.

  ### 2. The Three Positions (The Carving)

  Here are the three distinct named positions on whether the clump is a cause.

  #### A. Causal Exclusion / Eliminativism (The "Hard" Reductionist)
  *   **The Claim:** The clump did *not* drag the marble. Only the marbles dragged the marble.
  *   **The Reasoning:** Because of Micro-Causal Closure, any causal work attributed to the clump is already fully accounted for by the marbles. To say the clump caused it is to engage in "double counting." The clump is an **epiphenomenon**—a shadow cast by the marbles. It tracks the marbles, but it doesn't push them.
  *   **Verdict on your box:** "You are standing far enough away that you've started calling the summary a cause. The summary is a fiction useful for prediction, but ontologically inert."
  *   **Key Proponent:** Jaegwon Kim (who formulated the Causal Exclusion Argument).

  #### B. Non-Reductive Physicalism / Causal Compatibilism
  *   **The Claim:** The clump *did* drag the marble, AND the marbles *did* drag the marble. Both statements are true.
  *   **The Reasoning:** Causation is not a zero-sum game. The marbles provide the *mechanism*, but the clump provides the *constraint* or the *organization*. Without the clump-structure, the marbles wouldn't move *that* way. The clump is a real physical structure that exerts **Downward Causation** by constraining the degrees of freedom of the marbles.
  *   **Verdict on your box:** "The clump is a real object. It exerts force by virtue of its configuration. The fact that it is made of marbles doesn't stop it from being a causal agent in its own right."
  *   **Key Proponent:** Many philosophers of biology and complex systems (e.g., Nancey Murphy).

  #### C. Real Patterns (The Dennettian Position)
  *   **The Claim:** The question "Is the clump *really* real?" is a category error. The clump is a **Real Pattern**.
  *   **The Reasoning:** "Realness" isn't about what the universe is made of (marbles); it's about where the information lives. If tracking the clump allows you to predict the future of the system more efficiently than tracking the marbles, the clump is "real" in the only sense that matters for causation. Causation is about counterfactuals: *If the clump hadn't been there, would the marble have moved?* If the answer is no, the clump is a cause.
  *   **Verdict on your box:** "The clump is as real as a software object. You don't ask if a variable in your code is 'really' the electrons moving in the CPU. You ask if the logic holds. The clump is a higher-level object in the simulation's logic."
  *   **Key Proponent:** Daniel Dennett (specifically his paper *Real Patterns*).

  ### 3. The Hofstadter Connection
  The book you are recalling is likely *I Am a Strange Loop* (2007), though the seed is in *Gödel, Escher, Bach* (1979). Hofstadter uses the analogy of an ant colony. Individual ants follow simple chemical trails (marbles), but the colony "thinks" and "decides" (clumps).

  Hofstadter's position is a variation of **Real Patterns**. He argues that the "symbol level" (the clumps) is where the *meaning* and the *causal leverage* reside, even if the physics is at the bottom. He would say that tilting the box to move a clump is the only way to interact with the system meaningfully. To him, the clump is "more real" than the marbles for the purpose of understanding the system's behavior.

  ### 4. Which One Fits Your Box?

  Since you built a simulation, the answer is technically **Causal Compatibilism via Real Patterns**.

  Here is why:
  1.  **It is not Strong Emergence:** You know the code. There are no new forces introduced at the clump level. The clumps do not violate the marble physics. This rules out "Strong Emergence" (where the higher level has new fundamental laws).
  2.  **It is not pure Eliminativism:** If you write code to detect clumps and react to them (the "arm twitch"), your system *itself* treats the clump as a causal entity. The system's logic operates on the clump level. If the system treats the pattern as a cause, then within the context of that system, it *is* a cause.
  3.  **The Physics Parallel:** In physics, this is handled by **Renormalization** or **Effective Field Theory**. Physicists admit they don't need to track every quark to describe fluid dynamics. The fluid (the clump) has viscosity and pressure (causal powers) that "emerge" from the molecules but are treated as fundamental properties at that scale.

  ### The Name You Want
  If you need one term to search for the literature that treats this seriously without drifting into "consciousness" or "vitalism," search for:

  **"Causal Autonomy of Higher-Level Structures"**
  or
  **"The Causal Exclusion Argument in Complex Systems"**

  ### Summary for your Sandbox
  *   **Did the clump drag the marble?** Yes, in the sense that the *configuration* of the marbles (the clump) is the relevant variable that determines the outcome.
  *   **Is it just a summary?** It is a summary, but in information theory and computation, **summaries that compress data without losing predictive power are ontologically distinct from the data.**
  *   **The Verdict:** You have built a **Multiple Realization** machine. The "clump" is the software; the "marbles" are the hardware. Asking if the software pushed the electrons is the wrong question. The software *constrained* the electrons to do the pushing. That constraint is a form of causation.

  You are standing on the border of **Information Physics**. The clump isn't magic; it's *information* that has become physically efficacious.
