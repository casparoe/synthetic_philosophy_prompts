prompt: |-
  Fifteen years of reading rationalist blogs and forums has left me with one durable conviction: a principle that cannot be turned into a procedure somebody can run under time pressure is a mood, not a rule. I am writing because I need a procedure, and because I suspect the relevant philosophy will make my job harder rather than easier.

  I chair the member disputes panel at a sixty-unit housing cooperative. The panel is five residents, no lawyers, and I am the only one who reads anything like this material. We meet monthly, hear three to six cases a year, and our rulings bind unless a household appeals to the full board, which happens perhaps once a year. The stakes are people's homes and their standing with their neighbors, and the panel's legitimacy depends on our rulings looking principled rather than personal. I get about forty-five minutes per case before the meeting, and no time to consult anything while the panel is sitting. Whatever you give me has to fit on two pages and be usable by someone who has never heard of any of this.

  Here is the recurring shape of our cases, which I gather has a name. Our bylaws contain two commitments I always assumed were compatible and now suspect are not. First, each household is sovereign over its own interior: what we display, what we practice, whom we host, what we keep, what we do inside our own walls is ours to decide. Second, we are a consensus body: a proposal that leaves no household worse off is adopted, and where one option is unanimously preferred to another we take the preferred one. The trouble is that members have preferences about what other members do inside their own households — about a shrine on a balcony, a flag, a home business, a pet, a garden, a stream of guests. When a majority prefers that a household stop doing something self-regarding, the consensus commitment says honor that preference and the sovereignty commitment says it is none of our business. I believe the impossibility result bearing Amartya Sen's name tells me I cannot keep both commitments without some restriction, and that the restriction has to fall on whose preferences we admit in the first place. Build the panel's procedure around that, and be candid that this restriction is the load-bearing move rather than something the bylaws already contain.

  Write the procedure as an ordered set of questions the panel asks, specifying for each (a) what counts as a sufficient answer, (b) which answers end the case with a ruling for one side, (c) which answers hand the case to a human because the question is one of values rather than facts, and (d) where the procedure is known to misfire. If it leans on the word harm, make it say what harm means operationally.

  I need it to handle the following, in ascending order of how much they worry me:

  A test that separates a genuine externality — noise, smell, pests, blocked light, traffic, structural risk — from disapproval of what a neighbor does. The hard case is symmetric: the objection is religious and the conduct is religious, so I cannot simply ask which side is being sectarian.

  A rule for when the objecting households are a majority, or a near-unanimity, and are quite sure of their own moral standing. This is where I expect the procedure to tell me things I do not want to hear.

  An instruction for adaptive preferences: a household that reports no objection to a restriction I suspect it has simply stopped expecting better than. Say what evidence would move me and what to do when the evidence is inconclusive.

  A rule for when the objectionable conduct is aimed at a particular neighbor rather than at the world in general. I think there is a real difference between a symbol and a taunt, and I want the procedure to locate it without turning the panel into a mind reader.

  A one-page intake form: the questions we put to both households before the hearing, phrased so a resident can answer them without knowing any of the theory.

  Then run the procedure on three cases, showing the reasoning at each step.

  1. A household has installed a small religious shrine on a balcony visible from the courtyard. Two neighboring households object on religious grounds, saying that the shrine's presence in shared view is itself a religious statement they are being made to live with.

  2. A household bakes and sells bread from its kitchen. Deliveries arrive at odd hours, the smell is constant, and the shared wall vibrates. The baker is a friend and the co-op is better for her being here, but I do not think that is relevant and I want the procedure not to care either.

  3. A household flies a flag expressing a political position that I and most of the co-op find repellent. The objection is offense, not externality, and I would very much like to rule against it.

  I expect the procedure to tell me to leave the flag alone and to let the shrine stand, and I would rather you say so plainly than bend the procedure toward my sympathies. I also expect it to say something I do not anticipate in the bread case.

  Close with a short section on what this procedure cannot do: where the actual dispute is over the boundary of the sovereign sphere rather than over what happens inside it, and any case where you think the framework should be set aside altogether. Do not give me a reading list or citations; assume I know the names and want the machinery.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a member disputes panel at a 60-unit housing cooperative.
      *   **Background:** 15 years reading rationalist blogs/forums (familiar with concepts like Sen's Liberal Paradox, procedural rationality, epistemic humility).
      *   **Constraint:** Needs a *procedure* (algorithm/checklist), not philosophy. Must fit on two pages (conceptually), usable by laypeople under time pressure (45 mins prep, no lookup during meeting).
      *   **Core Conflict:** Bylaws guarantee individual sovereignty (interior freedom) AND consensus decision-making (unanimous preference rules). These clash when neighbors have preferences about other neighbors' internal conduct (Sen's Liberal Paradox).
      *   **Solution Strategy:** Restrict *whose preferences count*. This is the "load-bearing move."
      *   **Required Output:**
          1.  Ordered set of questions (The Procedure).
          2.  Specific criteria for each question (sufficient answer, ruling outcomes, hand-off to human judgment, known failure modes).
          3.  Operational definition of "harm."
          4.  Handling specific hard cases (Symmetric religious conflict, Majority moral standing, Adaptive preferences, Targeted conduct).
          5.  One-page intake form.
          6.  Run the procedure on three specific cases (Shrine, Bread, Flag).
          7.  Closing section on limitations (boundary disputes, when to set aside).
      *   **Tone:** Candid, mechanical, precise, acknowledging the trade-offs (especially regarding the Flag case). No citations/reading lists.

  2.  **Deconstruct the Core Philosophical Problem (Sen's Liberal Paradox):**
      *   Sen proved you can't have Pareto Efficiency (Consensus) and Liberalism (Individual Sovereignty) simultaneously if people have preferences over others' choices.
      *   *The Fix:* Restrict the domain of admissible preferences. Preferences about what happens inside someone else's sovereign sphere are "inadmissible" unless they translate into a tangible externality.
      *   *The Procedure's Goal:* Filter out inadmissible preferences early. If a preference is inadmissible, it gets zero weight, regardless of how many people hold it.

  3.  **Drafting the Procedure (The "Sovereignty Filter"):**
      *   Need a step-by-step flow.
      *   *Step 1: Define the Act.* What is actually happening?
      *   *Step 2: Define the Harm.* Is it physical/tangible or psychic/offensive?
      *   *Step 3: The Sovereignty Test.* Is the act inside the sovereign sphere?
      *   *Step 4: The Preference Test.* Is the objection based on the act itself or the harm?
      *   *Step 5: Majority/Consensus Check.* Only applies if harm is established.
      *   *Step 6: Adaptive Preferences.* Check for coercion/resignation.
      *   *Step 7: Targeted Conduct.* Is it harassment?

      *Refining the "Harm" Definition:* Must be operational. "Noise, smell, pests, blocked light, traffic, structural risk." Psychic harm (offense, moral disagreement) does not count *unless* it rises to targeted harassment.

      *Refining the "Load-Bearing Move":* Explicitly state that preferences regarding the *content* of another's sovereign sphere are inadmissible. This solves the Sen paradox by limiting the input to the consensus function.

  4.  **Drafting the Intake Form:**
      *   Needs to be simple language.
      *   Focus on facts, not feelings (initially).
      *   Questions: What is happening? What is the specific impact on you? Is it physical or emotional? How often?

  5.  **Running the Cases:**
      *   *Case 1 (Shrine):* Visible from courtyard. Objection is religious presence.
          *   Analysis: Is it an externality? No (light blockage? no. noise? no.). It's "shared view." Is view sovereign? Yes, balcony is sovereign. Objection is moral/religious preference. Inadmissible. Ruling: Shrine stays.
      *   *Case 2 (Bread):* Smell, vibration, deliveries.
          *   Analysis: Smell and vibration are physical externalities. Deliveries are traffic. Harm is established. Sovereignty yields to harm mitigation. Ruling: Restrict baking/deliveries (not ban necessarily, but mitigate). *Unexpected twist:* The procedure might force a ban if mitigation fails, even if the co-op likes the baker. The "friend" aspect is inadmissible preference too.
      *   *Case 3 (Flag):* Political position, repellent to majority. Objection is offense.
          *   Analysis: Physical harm? No. Targeted harassment? No. Objection is moral offense. Inadmissible preference. Majority vote cannot override sovereignty on inadmissible preferences. Ruling: Flag stays. (User expects this but dislikes it).

  6.  **Addressing Specific Worries:**
      *   *Symmetric Religious:* The procedure treats both as inadmissible preferences regarding the other's sphere. Status quo ante usually wins (freedom to act > freedom from sight).
      *   *Majority Moral Standing:* The procedure explicitly nullifies majority vote on sovereign internal acts absent physical harm.
      *   *Adaptive Preferences:* Need a specific check. "If the restriction were lifted, would you object?" Look for fear of retaliation.
      *   *Targeted Conduct:* Distinguish between "display" and "pointing." Intent vs. Effect. If it's directed *at* a specific person to intimidate, it becomes harassment (admissible harm).

  7.  **Review and Refine (Self-Correction):**
      *   *Constraint Check:* Is it two pages? The text needs to be dense but readable.
      *   *Tone Check:* Is it cold enough? The user wants machinery, not comfort.
      *   *Sen's Paradox:* Did I explicitly address the "load-bearing move"? Yes, by defining inadmissible preferences.
      *   *Bread Case:* The user expects something unanticipated. The unanticipated part is likely that the "social benefit" (friendship, better co-op) is also an inadmissible preference. The procedure must be blind to positive externalities too, only negative physical ones count to restrict sovereignty. Or, more likely, the procedure forces a hard line on the *vibration* which might shut down the business entirely, which feels harsh but is procedurally correct. Let's emphasize that "benefit to the co-op" is legally irrelevant under this framework.
      *   *Flag Case:* User wants to rule against it but expects the procedure to say no. I must be firm here. The procedure protects the flag.
      *   *Formatting:* Use bolding and lists to make it scannable during a meeting.

  8.  **Final Polish:**
      *   Ensure the "Harm" definition is crisp.
      *   Ensure the "Adaptive Preference" check is actionable.
      *   Make sure the "Limitations" section acknowledges that this doesn't solve boundary disputes (e.g., is a balcony interior?).

      *(Self-Correction on the Bread Case)*: The user said "I expect it to say something I do not anticipate in the bread case."
      *   *Idea:* The procedure might require treating the *positive* preferences (we like the bread) as inadmissible too. We can't allow the business because it's nice; we can only allow it if it doesn't cause harm. If it causes harm, it must stop, regardless of how much we like the baker. The "unanticipated" thing is the asymmetry: We ignore the moral objection to the flag, but we must also ignore the moral *support* for the baker. Only physics matters.
      *   *Alternative Idea:* The vibration implies structural risk. That trumps everything.
      *   *Decision:* I will focus on the "Blindness to Benefit" aspect. The procedure forbids weighing the "good" of the bread against the "bad" of the smell. It's binary: Is there physical harm? Yes -> Mitigate/Stop. No -> Allow. The "friendship" is noise.

      *(Self-Correction on the Shrine Case)*: "Shared view" is the tricky part. Is the courtyard public space? Yes. Is the balcony private? Yes. Does seeing into private space count as harm? Usually no, unless it's intrusive (like looking into a bedroom). A shrine on a balcony is like paint color. It's visual. Visual offense is inadmissible.

      *(Refining the "Load-Bearing Move")*: I need to state clearly: "Preferences about the *content* of another household's sovereign sphere are inadmissible." This is the Sen solution.

  9.  **Final Output Structure:**
      *   Header: The Sovereignty Filter Procedure.
      *   Section 1: Operational Definitions (Harm, Sovereignty).
      *   Section 2: The Decision Tree (Questions 1-5).
      *   Section 3: The Intake Form.
      *   Section 4: Case Runs (Shrine, Bread, Flag).
      *   Section 5: Limitations & Failure Modes.

      *Wait, one constraint:* "If it leans on the word harm, make it say what harm means operationally." I will put this up front.
      *Constraint:* "Specify for each (a) sufficient answer, (b) rulings, (c) human hand-off, (d) misfire." I will embed this in the Decision Tree.

      *Let's write.*
answer: |-
  # THE SOVEREIGNTY FILTER PROCEDURE
  **For Panel Use Only.** Do not debate philosophy during the hearing. Follow the sequence. If a step yields a ruling, stop.

  ## I. OPERATIONAL DEFINITIONS
  **1. Sovereign Sphere:** The interior of the unit, including balconies, patios, and windows, up to the property line.
  **2. Admissible Harm:** A physical intrusion crossing the property line.
  *   **Includes:** Decibel levels exceeding local ordinance, odors detectable inside a neighbor's closed unit, pest infestation originating from the unit, structural vibration, blockage of legal light/air easements, traffic obstructing emergency access.
  *   **Excludes:** Offense, moral disagreement, religious discomfort, aesthetic dislike, political opposition, "vibes," reduction in property value (unless structural).
  **3. Inadmissible Preference:** A desire regarding what another household *does, believes, or displays* within their Sovereign Sphere, absent Admissible Harm.
  *   **The Load-Bearing Move:** Inadmissible Preferences count as **zero** in the consensus calculation. A million inadmissible preferences do not outweigh one sovereign right.

  ## II. THE DECISION TREE
  *Ask these questions in order. Record answers.*

  **Q1. Is the conduct contained entirely within the Respondent's Sovereign Sphere?**
  *   (a) **Sufficient Answer:** Yes (inside walls/balcony) or No (in hallway/roof/garden).
  *   (b) **Ruling:** If **No**, the Board has jurisdiction based on common area rules. Proceed to standard majority vote. If **Yes**, proceed to Q2.
  *   (c) **Human Hand-off:** If the boundary is unclear (e.g., noise leaking vs. noise made), measure at the property line.
  *   (d) **Known Misfire:** Does not handle disputes about where the boundary lies (see Limitations).

  **Q2. Does the Objection cite Admissible Harm?**
  *   (a) **Sufficient Answer:** Specific physical metric (e.g., "smell in my living room," "floor vibrates"). Not "it makes me uncomfortable."
  *   (b) **Ruling:** If **No** (objection is moral/aesthetic/religious), **RULING FOR RESPONDENT.** Case Closed. Sovereignty protects the right to offend.
  *   (c) **Human Hand-off:** If the harm is "targeted" (see Q5), hold judgment.
  *   (d) **Known Misfire:** Fails if the harm is real but subjective (e.g., low-frequency hum only one person hears). Require independent measurement.

  **Q3. Is the Harm Symmetric or Religious/Moral in Nature?**
  *   (a) **Sufficient Answer:** Objector admits the harm is the *existence* or *visibility* of the act, not a physical byproduct.
  *   (b) **Ruling:** If the objection is to the *meaning* of the act (e.g., "the shrine implies I am wrong"), **RULING FOR RESPONDENT.** Meaning is internal to the observer.
  *   (c) **Human Hand-off:** If both parties claim religious burden (e.g., "I must display" vs. "I must not see"), prioritize the active right over the passive right. **RULING FOR RESPONDENT.**
  *   (d) **Known Misfire:** Deeply asymmetric power dynamics where "visibility" is actually intimidation (see Q5).

  **Q4. (If Admissible Harm Exists) Can the Harm be Mitigated without Banning the Act?**
  *   (a) **Sufficient Answer:** Technical solution (ventilation, soundproofing, delivery windows).
  *   (b) **Ruling:** If **Yes**, order mitigation. If **No**, **RULING FOR OBJECTOR** (restrict the act).
  *   (c) **Human Hand-off:** Determining "feasibility." Use cost-benefit only if cost is ruinous to the Respondent.
  *   (d) **Known Misfire:** Ignores "benefit to the co-op." The procedure is blind to positive externalities. If it harms, it must be fixed, even if we love the result.

  **Q5. Is the Conduct Targeted?**
  *   (a) **Sufficient Answer:** Is the act directed *at* a specific household (e.g., facing a flag at a window, playing music only when they walk by) vs. directed at the world?
  *   (b) **Ruling:** If **Targeted**, it is Harassment, not Expression. **RULING FOR OBJECTOR.**
  *   (c) **Human Hand-off:** Determining intent. Look for timing, orientation, and specificity.
  *   (d) **Known Misfire:** Paranoia. A resident may feel targeted when the act is general. Require evidence of specific direction.

  **Q6. Adaptive Preference Check (Ask Objector privately)**
  *   (a) **Sufficient Answer:** "If the rule were lifted and there were no retaliation, would you still object?"
  *   (b) **Ruling:** If **No** (they only object because they think they have to), dismiss the objection.
  *   (c) **Human Hand-off:** Assessing fear. Look for history of retaliation.
  *   (d) **Known Misfire:** Cannot detect internalized oppression fully.

  ---

  ## III. INTAKE FORM (One Page)
  *Send to both parties 48 hours before hearing. Do not allow oral testimony that contradicts written answers without new evidence.*

  **PART A: THE ACT (Respondent)**
  1.  Describe exactly what you are doing, keeping, or displaying.
  2.  Where is it located? (Check: Inside Unit / Balcony / Patio / Common Area)
  3.  Does this activity produce: Noise / Smell / Vibration / Traffic / Light? (Check all that apply)
  4.  If yes, what steps have you taken to contain it within your unit?

  **PART B: THE OBJECTION (Objector)**
  1.  Describe exactly how the Act affects you physically. (e.g., "I smell it in my kitchen," not "I dislike it.")
  2.  Does the Act damage your property or health? (Yes/No + Evidence)
  3.  If the Act were invisible/silent but still happening, would you object? (Yes/No)
      *   *If Yes, your objection is to the content, not the impact.*
  4.  Is the Act directed specifically at your household? (Yes/No + Evidence of timing/orientation)
  5.  Have you asked the Respondent to mitigate the physical impact? (Yes/No)

  **PART C: AGREEMENT**
  1.  Do both parties agree on the physical facts (e.g., that deliveries happen at 6 AM)? (Yes/No)

  ---

  ## IV. CASE RUNS

  ### CASE 1: The Balcony Shrine
  **Facts:** Respondent displays religious shrine on balcony. Objectors (2 units) claim religious burden from visibility.
  *   **Q1 (Sovereign Sphere):** Act is on balcony. **Yes.** (Proceed)
  *   **Q2 (Admissible Harm):** Objection is "religious statement we are being made to live with." No noise/smell/structural risk. **No.**
  *   **Q3 (Symmetric/Moral):** Objection is to the *meaning* of the shrine. Objectors' religion says they shouldn't see it; Respondent's says they should show it.
  *   **Ruling:** **FOR RESPONDENT.**
  *   **Reasoning:** The objection is an Inadmissible Preference. It is a preference about the content of the Respondent's sphere. Under the Load-Bearing Move, this preference counts as zero. The passive right not to see does not override the active right to display within the sovereign sphere.
  *   **Misfire Check:** Is it targeted? No, it faces the courtyard generally.

  ### CASE 2: The Bread Baker
  **Facts:** Respondent bakes commercially. Smell constant, wall vibrates, deliveries at odd hours. Co-op likes the baker.
  *   **Q1 (Sovereign Sphere):** Act is inside unit, but effects cross boundary. **Yes.** (Proceed)
  *   **Q2 (Admissible Harm):** Smell inside neighbor's unit, structural vibration, traffic. **Yes.** (Proceed)
  *   **Q3 (Symmetric/Moral):** Harm is physical, not moral. (Proceed)
  *   **Q4 (Mitigation):** Can smell/vibration be stopped without stopping baking? Likely no for vibration (structural). Deliveries can be scheduled.
  *   **Ruling:** **PARTIAL FOR OBJECTOR.**
  *   **Reasoning:** Admissible Harm is proven. Sovereignty yields to physical intrusion.
      *   *Deliveries:* Must be restricted to standard hours (Mitigation).
      *   *Vibration/Smell:* If technical mitigation fails, the business must cease or move.
  *   **Unanticipated Result:** The procedure forbids weighing the "Co-op is better for her being here." That is a positive Inadmissible Preference. The panel cannot vote to allow harm because they like the baker. If the vibration violates structural safety, the business dies, regardless of friendship. The procedure is blind to benefit.

  ### CASE 3: The Repellent Flag
  **Facts:** Respondent flies political flag. Majority finds it repellent. No physical harm.
  *   **Q1 (Sovereign Sphere):** Flag on balcony/window. **Yes.** (Proceed)
  *   **Q2 (Admissible Harm):** Objection is "offense." **No.**
  *   **Q3 (Symmetric/Moral):** Objection is to the political content.
  *   **Ruling:** **FOR RESPONDENT.**
  *   **Reasoning:** Objection is purely Inadmissible Preference. Consensus cannot be used to vote away sovereignty on matters of taste/ideology. To rule otherwise is to allow the "tyranny of the majority" over the interior life.
  *   **Candid Note:** You want to rule against this. The procedure forbids it. If you rule against it, you are admitting the panel is a moral enforcer, not a dispute resolver. The legitimacy cost of breaking procedure is higher than the offense cost of the flag.

  ---

  ## V. LIMITATIONS & FAILURE MODES
  **1. Boundary Disputes:** This procedure assumes the Sovereign Sphere is fixed. It cannot resolve disputes about *whether* a balcony is sovereign (e.g., if bylaws say "no external decorations"). If the bylaws are ambiguous, this procedure halts. You must amend the bylaws before using this filter.
  **2. The "Creep" of Harm:** Residents will learn to frame moral objections as physical ones ("The flag gives me a migraine"). Require medical documentation for psychosomatic harm claims, or treat as inadmissible.
  **3. Power Asymmetry:** This procedure assumes equal footing. If a wealthy household is weaponizing technical complaints (e.g., decibel meters) to harass a poorer household, Q5 (Targeted) must be interpreted aggressively.
  **4. When to Set Aside:** If a ruling creates a safety risk (e.g., fire hazard) that the bylaws miss, ignore the procedure. Safety trumps sovereignty.
  **5. The Sen Constraint:** This procedure does not solve the paradox; it manages it by exclusion. It will feel unjust in cases where the majority is morally right but the act is sovereign. Accept this. The alternative is war.
