      *   *Rule A (The Temporal Rule):* If the stratifying variable is measured *before* treatment exposure, restate. If measured *after* treatment begins, stand. (Based on Cases 1-3 vs. Case 4).
      *   *Rule B (The Causal/Collider Rule):* If the stratifying variable is a pre-treatment confounder (or proxy), restate. If it is a post-treatment mediator or collider, stand. (Based on causal structure).
      *   *Rule C (The Pre-specification Rule):* If named in the analysis plan, restate. If post-hoc, stand. (Cases 1-3 were pre-specified. Case 4 was "defined after the fact").
      *   *Rule D (The Randomization Rule):* If RCT, pooled estimate is the causal effect (ITT). Stratification is secondary unless pre-specified subgroup analysis is the primary aim. If Observational, stratification is needed to control confounding. (Cases 1-3 were observational/cohort/evaluation. Case 4 doesn't specify design but implies observational or messy. New case is RCT).

