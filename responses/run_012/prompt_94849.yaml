      *   *Best Guess:* The Pre-Exposure Covariate Rule (closely tied to Causal Validity). The panel distinguishes based on whether the stratification removes confounding (1-3) or introduces selection bias (4). The new case introduces selection bias.
      *   *Confidence:* High (85%).
      *   *Discriminating Case:* An RCT with a *pre-treatment* stratifier that is pre-specified, where pooled shows benefit and stratified shows harm. (Tests Design vs. Timing). Or an Observational study with a post-treatment stratifier.
