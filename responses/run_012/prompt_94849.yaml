      *   *Conflict:* Does Pre-specification override Post-treatment measurement? In Cases 1-3, Pre-spec + Pre-treatment = Restate. In Case 4, Post-hoc + Post-treatment = Stand.
      *   *Hypothesis:* The panel cares about *Causal Validity*.
          *   Cases 1-3: Pooled is confounded. Stratified (pre-treatment) is less confounded. -> Restate.
          *   Case 4: Stratified is biased (post-treatment). Pooled is less biased (assuming no unmeasured confounding, or at least stratified is worse). -> Stand.
          *   New Case: RCT. Pooled is unbiased (ITT). Stratified is biased (post-treatment conditioning). -> Stand.
      *   *Alternative Hypothesis:* The panel cares about *Pre-specification*.
          *   Cases 1-3: Pre-specified -> Restate.
          *   Case 4: Post-hoc -> Stand.
          *   New Case: Pre-specified -> Restate.
      *   *Which is more likely?* The prompt asks me to act as a methodologist. A methodologist knows that conditioning on a post-treatment variable in an RCT is wrong. If the panel is competent (implied by "consistent with ourselves" and the specific details provided), they should prioritize causal validity over bureaucratic pre-specification. However, the prompt says "authors have learned not to read much into the wording; the record is the record." This implies a bureaucratic consistency.
      *   *But:* The distinction in Case 4 explicitly mentions "after treatment had begun." Cases 1-3 explicitly mention "before any exposure," "at intake," "fixed before the program began." The *timing relative to treatment* is the most salient feature repeated in every precedent. Pre-specification is mentioned in 1, 2, 3. Case 4 says "defined after the fact." So Case 4 confounds Timing and Pre-spec.
      *   *New Case:* Uncouples them. Pre-specified (like 1-3) but Post-treatment timing (like 4).
      *   *Decision:* The timing/causal validity is the deeper methodological principle. Pre-specification of a invalid analysis does not make it valid. The panel's distinction in 1-3 vs 4 hinges on whether the stratification *corrects* bias (pre-treatment confounding) or *induces* bias (post-treatment conditioning).
      *   *Prediction:* **Claim stands as written.** (Because the stratification is methodologically invalid due to post-treatment measurement, despite pre-specification).

  6.  **Drafting the Response:**
      *   *Tone:* Professional, analytical, philosophical, precise.
      *   *Structure:* Follow the prompt's requirements exactly.
      *   *Candidate Rules:*
