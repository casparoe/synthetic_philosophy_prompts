      *   *Rule C (Pre-spec):* It *was* pre-specified. Prediction: **Restate**. (Matches Cases 1-3, conflicts with Case 4's "after the fact" description, but Case 4's key feature was likely the post-treatment nature).
      *   *Rule D (Design):* It is an RCT. Pooled ITT is the gold standard. Stratification on post-treatment variables is methodologically unsound. Prediction: **Stand**.

      *   *Tension:* Cases 1-3 suggest "Pre-specified + Pre-treatment = Restate". Case 4 suggests "Post-treatment = Stand". The New Case is "Pre-specified + Post-treatment start + RCT".
      *   *Crucial Detail:* The variable is called "Baseline team climate" but measured at 3 months *into* the program. In an RCT, the pooled difference is the Intent-to-Treat (ITT) effect. Conditioning on a variable affected by treatment (indicated by imbalance in an RCT) biases the causal estimate. Therefore, methodologically, the pooled claim is the correct causal claim. The stratified claim is biased.
