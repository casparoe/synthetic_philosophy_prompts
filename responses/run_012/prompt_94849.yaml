      *   *Prediction:* The panel will likely recognize the post-treatment measurement as the disqualifier for the stratified claim, despite pre-specification. The "Baseline" label is a misnomer if taken at 3 months. The key distinction in the record is Pre-Exposure vs. Post-Exposure measurement, not just Pre-specification. Case 4 was "defined after the fact" *and* "after treatment". The New Case is "Pre-specified" *but* "after treatment". Which feature dominates?
      *   *Methodological Truth:* In an RCT, pooling is the primary causal estimate. Stratifying on a post-randomization variable is a cardinal sin (selection bias). The panel's previous decisions (1-3) were observational studies where pooling was confounded. Case 4 was likely observational too, but the post-treatment stratifier made the stratified claim invalid.
      *   *Refining the Rule:* The panel seems to follow: "Restate if the stratified analysis controls for pre-exposure confounding. Stand if the stratified analysis conditions on post-exposure variables (bias) or if the pooled analysis is the valid causal estimate (RCT)."
