  2.  **Analyze the Precedents (The "Record"):**
      *   *Case 1:* Cohort study. Drug protective (pooled), harmful (strata). Stratifier: Severity score (pre-exposure, pre-specified). *Disposition: Restated.* (Simpson's Paradox scenario, pre-treatment covariate).
      *   *Case 2:* Workplace policy. Benefit (pooled), harm (strata). Stratifier: Job-grade (intake, pre-specified). *Disposition: Restated.* (Simpson's Paradox scenario, pre-treatment covariate).
      *   *Case 3:* Regional evaluation. Effective (pooled), ineffective (strata). Stratifier: Deprivation index (pre-program, pre-specified). *Disposition: Restated.* (Simpson's Paradox scenario, pre-treatment covariate).
      *   *Case 4:* Submission. Benefit (pooled), reverses (subgroup). Stratifier: Post-treatment measure (defined after fact). *Disposition: Stands.* (Simpson's Paradox scenario, post-treatment covariate).

      *   *Pattern:* When the reversal (Simpson's Paradox) happens on a *pre-treatment, pre-specified* covariate, the panel forces restatement (stratified view wins). When the reversal happens on a *post-treatment* covariate, the panel allows the pooled claim (pooled view wins).

  3.  **Analyze the New Submission:**
      *   *Design:* Randomized trial (10k teams).
