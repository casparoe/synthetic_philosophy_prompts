      *(Self-Correction on the "Single Hardest Consideration"):* I should focus on the distinction between *solving a problem* and *simulating a solution*. As a novelist, the user knows the difference between writing a scene to resolve a character arc vs. writing a scene to mimic a style. The forgery mimics the *result*, not the *process*. If art values the process embodied in the object, the forgery fails.

