      *   *Insulation:* Is "narrative value" too flexible? Yes, it risks being unfalsifiable.
      *   *Single Hardest Consideration:* Needs to relate to the user being a *novelist*. Novelists deal in fiction (forgery of reality) but value truth. The tension between *making* and *faking*.

  6.  **Drafting the Response (Iterative Process):**

