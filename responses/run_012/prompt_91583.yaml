answer: |-
  **Sovereign Support Center**

  **1. What if my current self has information my past self didn't?**
  Risk assessment is finalized at the time of signing. The Sovereign protocol assumes the signing session represents the peak of your strategic planning. New data is treated as environmental noise, not a valid parameter for override. If the earlier you did not program an exception for this scenario, the system assumes the risk was accepted.

  **2. What if I am clearly competent now and say no?**
  Competence is verified during the initial setup via biometric and cognitive baseline tests. Any subsequent objection is categorized as expected resistance. The app is designed specifically for moments where your current competence is compromised by impulse, stress, or preference shifts. Your current "no" is the exact malfunction the software was purchased to correct.

  **3. What if I am happy in the state the earlier me paid to prevent?**
  Satisfaction metrics are not linked to enforcement triggers. The goal of Sovereign is integrity of instruction, not current mood optimization. If you signed a directive to avoid a specific outcome, your contentment within that outcome is irrelevant to the contract. The system protects your past priorities, not your present comfort.

  **4. What if I say I'm not the same person, or I don't remember signing?**
  Legal identity is confirmed via government ID and biometric scan at signup. Memory continuity is not required for contract validity. Whether you feel like the same person is a subjective state; the system relies on objective identity markers. Amnesia is not a valid logout procedure.

  **5. Does it matter if the directive protects a deep value versus a preference?**
  Sovereign is content-agnostic. We do not evaluate the weight of your values, only the validity of your signature. Whether you are preventing life support or restricting dietary choices, the mechanism is identical. Introducing moral weighting would require us to judge your life, which violates our terms. The earlier you decides what matters.

  **6. How are contradictory directives from different times handled?**
  The initial signature establishes the sovereign boundary. Any subsequent directive attempting to modify or cancel the first is treated as an unauthorized access attempt by the future self. The timestamp of the first commitment locks the chain. Later attempts to change settings are flagged as system intrusions and rejected.

  **7. Who decides whether I am competent: us or me?**
  The system decides based on data from the signing session. You cannot adjudicate your own competence during an enforcement event, as that would create a loophole. The algorithm compares your current behavior against the baseline established when you were fully authorized. If the system flags a deviation, enforcement proceeds.

  ***

  **Known Issues / Changelog**

  **v2.4.1**
  *   **Fixed:** Bug where users could bypass lockouts by claiming emotional distress.
  *   **Fixed:** Issue where "regret" was incorrectly processed as a valid cancelation code.

  **Ticket Log**
  *   **#8832:** User attempted to unlock trading cap during market dip. Ticket closed. Enforcement held.
  *   **#9011:** User claimed dietary restriction violated current happiness. Ticket closed. Happiness parameter not recognized.
  *   **#9104:** User filed support request stating they are "fundamentally changed." Ticket closed. Identity verified. Contract active.
  *   **#9205:** User pleaded for exception based on new relationship status. Ticket closed. Exception not programmed in initial setup.

  *For further assistance, please refer to your original signing document. Do not attempt to contact support during an enforcement window.*
