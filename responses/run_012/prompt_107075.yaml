answer: |-
  You have identified a precise and pervasive rhetorical maneuver that standard logical fallacies miss. You are right that "hypocrisy" is too blunt (it implies breaking a rule you claim to follow) and "cultural relativism" is too broad (it describes a stance, not the switching of stances).

  There is no single, canonical Latin term for this in the philosophical canon, though it is frequently discussed in political psychology and critical theory. The closest existing concepts are **Motivated Reasoning** (the psychological engine) and **Special Pleading** (the logical structure), but neither captures the specific *meta-ethical* dimension you're describing.

  Here is the breakdown of the phenomenon, a proposed name, its edges, and the verdict on the "reasons" given.

  ### 1. The Name: **Meta-Ethical Opportunism**
  While you might hear this colloquially called "Convenient Relativism" or "The Relativist Shield," those only describe half the move. The full pattern—using relativism to defend your own and universalism to attack others—is best termed **Meta-Ethical Opportunism**.

  Sometimes it is called **Asymmetric Meta-Ethics**.

  It is distinct from ordinary inconsistency because it operates at the *meta-ethical* level (the level of *how* we decide what is right) rather than the *normative* level (what *is* right).
  *   **Normative Inconsistency:** "Stealing is wrong, but I will steal this." (Hypocrisy)
  *   **Meta-Ethical Opportunism:** "Stealing is culturally relative when I do it, but objectively wrong when you do it." (Changing the rules of judgment to ensure the desired outcome).

  ### 2. The Edges: How to Distinguish It
  To know if you are witnessing Meta-Ethical Opportunism or something legitimate, you must look at the boundaries.

  **Edge A: Vs. Ordinary Hypocrisy**
  *   **Hypocrisy** admits the rule but violates it. The hypocrite knows the standard is "Do not judge," but judges anyway. They feel the tension.
  *   **Meta-Ethical Opportunism** dissolves the tension by changing the standard. The opportunist does not feel they are breaking a rule; they feel they are applying the *correct* rule for *this specific case*. They genuinely believe their switch is justified, which makes it more resilient to criticism than simple hypocrisy.

  **Edge B: Vs. Legitimate Ethical Pluralism**
  It is possible to consistently hold that *some* things are relative and *some* are universal. A consistent philosopher might say: "Ritual dress codes are relative cultural preferences; physical coercion is universally wrong."
  *   **The Legitimate Distinction:** The criterion for switching frameworks is **consistent**. (e.g., "I always apply universalism when physical harm is present, and relativism when only aesthetic norms are involved.")
  *   **The Opportunist Pattern:** The criterion for switching frameworks is **tribal**. (e.g., "When *my* group causes harm, it's a complex cultural nuance [relativism]; when *your* group causes harm, it's a universal violation [universalism].")

  **The Litmus Test (The Veil of Ignorance):**
  Ask the person: *"If Group A and Group B swapped practices, would your method of judging them swap as well?"*
  *   If they say "Yes, I would still judge based on harm," they are **consistent**.
  *   If they say "No, because Group A has a historical right to this," or they hesitate, it is **Meta-Ethical Opportunism**.

  ### 3. Does the "Reason" Get Them Off the Hook?
  You asked: *"Does the reason they give for the asymmetry get them off the hook, or is the reason itself part of the pattern?"*

  **The reason is almost always part of the pattern.**

  This is the most insidious part of Meta-Ethical Opportunism. The "reason" (harm, consent, authenticity) is usually a **post-hoc rationalization**, not a **pre-hoc principle**.

  Here is how to tell the difference:
  1.  **Principle-First:** The person identifies a universal principle (e.g., "Consent is required"). They apply it to the outsider (failure of consent = wrong). They apply it to the insider (investigation reveals consent = right). The *meta-ethical frame* (Universalism regarding consent) remained stable; only the *factual assessment* changed.
  2.  **Conclusion-First (Opportunism):** The person decides the insider is "Right" and the outsider is "Wrong." Then they scan for available principles.
      *   To defend the insider, they scan for *cultural context* ("You don't understand the history").
      *   To attack the outsider, they scan for *universal harms* ("This violates human rights").
      *   **The Tell:** If you point out that the insider's practice *also* involves harm or lack of consent, the Opportunist will suddenly switch back to relativism ("That's not the right way to measure consent in their culture").

  If the "reason" (like harm or consent) is only deployed when it condemns the *other* and suspended when it condemns *us*, then the reason is not a justification. It is ammunition.

  ### 4. Why It Matters
  This move is more dangerous than simple hypocrisy because it immunizes the user against critique.
  *   If you accuse them of being intolerant, they point to their universalist condemnation of the *other* group ("I'm not intolerant, I care about justice!").
  *   If you accuse them of being imperialistic, they point to their relativist defense of *their* group ("I'm not imperialistic, I respect culture!").

  They occupy the moral high ground on both sides by ensuring they never stand on the same ground twice.

  ### Summary
  *   **Name:** **Meta-Ethical Opportunism** (or Asymmetric Meta-Ethics).
  *   **Mechanism:** Selecting the *framework of judgment* (relativism vs. universalism) based on the desired outcome rather than a consistent higher-order principle.
  *   **The "Reason":** It is part of the pattern unless applied consistently across tribal lines. If "harm" matters only when the *other* side causes it, "harm" is just a weapon, not a principle.
  *   **Differentiation:** It differs from hypocrisy because it changes the rules rather than breaking them. It differs from legitimate distinction because the criteria for switching rules correlate with tribal allegiance, not factual differences.
