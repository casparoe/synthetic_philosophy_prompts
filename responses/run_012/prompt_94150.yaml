answer: |-
  **Marcus:** Let's begin with the negation. It seems to me that your position fractures the moment we introduce the word *not*. If I say, "Lying is wrong," you claim I am expressing a state of mind—disapproval, perhaps, or a commitment to avoid lying. But what am I doing when I say, "Lying is *not* wrong"?

  **Elena:** I am expressing a different state of mind.

  **Marcus:** Are you? If the first sentence expresses disapproval of lying, does the second express approval?

  **Elena:** Not necessarily. I could be indifferent.

  **Marcus:** Precisely. And therein lies the crack. If "wrong" maps to disapproval, then "not wrong" should map to the absence of disapproval. But the absence of disapproval is indifference. Yet, in moral discourse, "Lying is not wrong" is not synonymous with "I don't care about lying." It is a positive claim that lying is permissible. It is compatible with thinking lying is virtuous, or merely neutral. Your theory collapses the distinction between permission and indifference.

  **Elena:** That is the first-pass objection, Marcus. I grant it. A simple mapping of sentences to feelings fails. But I do not map sentences to fleeting feelings. I map them to *normative commitments*. When I say "Lying is wrong," I am endorsing a norm that prohibits lying. When I say "Lying is not wrong," I am endorsing a norm that *allows* lying.

  **Marcus:** So you have swapped "disapproval" for "endorsing a norm." But you haven't escaped the logic problem. You've just moved it. Consider a speaker who is genuinely ambivalent. They feel the pull of the prohibition, but they also feel the pull of the permission. They hold both attitudes simultaneously. On your view, can they assert "Lying is wrong" and "Lying is not wrong" without contradiction?

  **Elena:** They can assert both without logical contradiction, yes, because they are reporting on a fractured psyche. But they cannot *hold* both as settled conclusions.

  **Marcus:** But in logic, "P" and "Not P" cannot both be true. If moral sentences express attitudes, then the contradiction isn't in the world, it's in the person. But moral disagreement often feels like we are arguing about something external to our psyches. If I say "Lying is wrong" and you say "Lying is not wrong," we aren't just comparing diaries. We are claiming the other is mistaken. If it's just a clash of commitments, why do I think you are *incorrect* rather than just *different*?

  **Elena:** Because to have a normative commitment is to think it is the *correct* one to have. But let's press harder on the logic you're defending. You say "Lying is wrong" is truth-apt. It describes a fact. So, "Lying is not wrong" describes the absence of that fact. But consider the conditional: "If lying is wrong, then asking my brother to lie is wrong." When I utter this, I am not asserting that lying is wrong. I am not expressing an attitude toward lying. I am hypothetically supposing it. What is the status of the clause "lying is wrong" inside that *if*?

  **Marcus:** It functions as a proposition. It has a truth value, even if we don't know what it is. That is why the logic works. The argument is valid because the truth of the premises guarantees the truth of the conclusion.

  **Elena:** But I am not currently holding the attitude. I am merely considering the *relationship* between attitudes.

  **Marcus:** And I am considering the relationship between propositions. The advantage of my view is that it explains why modus ponens works here exactly as it works in mathematics. If you treat the antecedent as an attitude, you have to explain how an attitude can be the input for a logical operator. Attitudes aren't true or false. You can't negate a feeling in the same way you negate a fact.

  **Elena:** I can if the feeling is a stance on a standard. Let's try a case you haven't raised. Consider probability. "It is probable that lying is wrong." If I am a cognitivist, I am saying there is a high likelihood that the moral fact obtains. But what makes it probable? Evidence?

  **Marcus:** Yes. Reasons, circumstances, the nature of the act.

  **Elena:** And if I am an expressivist? I am not saying it is probable that I will feel bad. I am saying that upon full reflection, my commitment to prohibiting lying is stable. The probability operator measures the resilience of the attitude, not the likelihood of a fact.

  **Marcus:** But that changes the meaning of "probable." In every other context, "It is probable that X" refers to the state of the world, not the state of my confidence. If I say, "It is probable that it is raining," I am not talking about my resilience; I am talking about the clouds. If moral language works differently, you owe us an explanation of why it looks so identical. When I say, "It is probable that lying is wrong," I feel I am investigating the act, not my own psychology.

  **Elena:** And when I say it, I feel I am investigating whether this norm survives scrutiny. But Marcus, let's turn the table. You save logic, but you lose the engine. If "Lying is wrong" is a fact, like "Water is wet," why does believing it move me to act? I can believe water is wet and remain perfectly dry. I can believe lying is wrong and yet lie. But there is a conceptual strangeness in believing it is wrong and feeling *no* pull against doing it.

  **Marcus:** I concede that moral facts are not like physical facts. They are *reason-giving* facts. To grasp a moral fact is, in part, to grasp a reason for action. If you see the fact and feel no pull, you haven't fully grasped it. You are practically irrational.

  **Elena:** So you build motivation into the definition of the fact. But then consider the amoralist. The person who says, "I know lying is wrong, I acknowledge the fact, but I simply do not care." On your view, this person is a contradiction in terms. On my view, they are possible, though perhaps deeply flawed. They lack the sentiment that grounds the norm.

  **Marcus:** I will concede that the amoralist is a puzzle for me. It is difficult to explain how a fact can be binding on someone who is indifferent to the domain of that fact. But your view has a symmetrical failure. If morality is just attitudes, then moral disagreement is impossible. If I disapprove of lying and you do not, we are just two people making different noises. We aren't disagreeing; we are just clashing. Like two cars colliding. There is no fault to be found, only a crash.

  **Elena:** I disagree. We can disagree about attitudes. We can argue about which commitments are coherent with our other commitments. If you prohibit lying but permit asking your brother to lie, I can show you that your set of attitudes is inconsistent. I can argue you into a corner.

  **Marcus:** But that is only consistency. It is not truth. I can be consistently evil. If my attitudes are coherent, on your view, I am morally correct.

  **Elena:** No. Coherence is a constraint, not the whole story. The story is about which attitudes we can share, which allow us to live together. But I will make a concession. You are right that negation is the hardest hill for me to climb. Distinguishing "not wrong" from "indifferent" requires me to posit a complex architecture of higher-order attitudes. I must say that to judge something "not wrong" is to have an attitude *toward* the attitude of disapproval—specifically, a rejection of it.

  **Marcus:** And I will concede that my "moral facts" are queer. They are not discoverable by telescopes or microscopes. They are entities that somehow possess the power to motivate. I cannot fully explain how a fact reaches out and grabs the will. I posit a connection between belief and desire that exists nowhere else in nature.

  **Elena:** So we are left with a choice. Either we accept that moral language behaves logically like science but metaphysically unlike it...

  **Marcus:** ...Or we accept that moral language behaves psychologically like action but logically unlike science.

  **Elena:** Consider one more embedding. "John believes that lying is wrong." If I say this, I am attributing a belief to John. If I am an expressivist, I cannot say John believes a fact. I must say John holds a certain attitude. But when I say it, I am not expressing my own attitude. I am describing his.

  **Marcus:** And that is easy for me. John stands in a relation to a proposition.

  **Elena:** But do I understand John? To understand him, must I share his attitude? If I say, "John believes lying is wrong, but he is mistaken," I am attributing an attitude to him while rejecting it myself. My theory must explain how I can represent your attitude without adopting it. It requires a sophistication in the theory of mind that I am still refining. I cannot simply say "Boo." I must say, "John is in the state of saying 'Boo'."

  **Marcus:** And I must explain why representing that fact moves anyone. We are both paying a tax. I pay in metaphysics; you pay in logic.

  **Elena:** It seems the tax is unavoidable. The question is which debt is more sustainable. If I pay the logic tax, I risk making morality look like a game of internal consistency. If you pay the metaphysics tax, you risk making morality look like magic.

  **Marcus:** Perhaps the reader must decide which magic they prefer. The magic of facts that move us, or the magic of feelings that reason.

  **Elena:** Or perhaps the tension itself is the point. If the theory were too tidy, it would likely have left out something essential about what it is to judge at all.

  **Marcus:** Then we leave it there. The problem remains open.

  **Elena:** As it should.
