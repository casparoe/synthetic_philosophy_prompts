prompt: |-
  You're a philosopher who knows ancient economic thought cold and is also good at writing short speeches that real people can actually deliver out loud. I need help with a toast.

  Setting: my aunts credit union — small, member-owned, no shareholders — is turning 75, and I'm giving the toast at the anniversary dinner. Half the room is finance people and local economists who will notice if I fudge the theory; the other half are members and retirees who've banked there their whole lives and mostly just want to feel good about the place.

  Here's the idea I want to build it around, and I need you to actually work it out rather than just name-dropping. Aristotle treats money as a purely conventional thing whose whole job is to make otherwise incommensurable needs comparable, so a shoemaker and a farmer can trade fairly — the reciprocity between different kinds of people is what really holds a community together, and money is just the stand-in that lets that reciprocity happen at all. But he also draws a sharp line between using money to satisfy needs and treating money itself as the point, and he is pretty sour on the second one. So here's my problem: I want to toast an institution whose entire business is money, using a thinker who was suspicious of exactly that. The toast needs to land as warm rather than as a lecture, and it has to be honest — I dont want to pretend Aristotle would have approved of banking if he wouldn't have.

  Think carefully, maybe brainstorm two or three angles before you commit. Keep it to about three minutes spoken. Start with the toast itself, no preamble or commentary.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher expert in ancient economic thought + skilled speechwriter for oral delivery.
      *   **Task:** Write a 3-minute toast for a credit union's 75th anniversary.
      *   **Audience:** 50% finance/economics experts (will catch theoretical errors), 50% members/retirees (want warmth/community feel).
      *   **Core Idea:** Aristotle's view of money (conventional, facilitates reciprocity between incommensurable needs) vs. chrematistics (money-making for its own sake).
      *   **Challenge:** Toasting a money institution using a philosopher suspicious of banking/profit-seeking. Needs to be warm, honest (no pretending Aristotle would love modern banking), and spoken aloud (rhythm, pacing).
      *   **Constraint:** Start with the toast itself, no preamble.

  2.  **Deconstruct Aristotle's Economic Thought (Nicomachean Ethics, Book V & Politics, Book I):**
      *   *Oikonomia* (Household Management): Natural, focused on satisfying needs, limited by the end goal (living well).
      *   *Chrematistics* (Wealth Acquisition): Unnatural when unlimited, focused on money breeding money (usury/interest was particularly frowned upon).
      *   *Reciprocity (Antipeponthos):* Money exists to make different things (shoes vs. wheat) comparable so people can exchange fairly and maintain community bonds. It's a social glue, not a commodity.
      *   *Key Tension:* Credit unions *do* charge interest (usually), but they are member-owned (cooperative), not shareholder-owned (profit-maximizing). This is the bridge.

  3.  **Brainstorming Angles:**
      *   *Angle 1: The "Lesser Evil" Defense.* Acknowledge Aristotle would hate interest, but argue the credit union minimizes the harm because it serves needs (*oikonomia*) rather than profit (*chrematistics*).
          *   *Pros:* Honest.
          *   *Cons:* A bit defensive/negative for a celebration.
      *   *Angle 2: The "Community Glue" Focus.* Focus heavily on reciprocity. Money is just the tool; the credit union is the mechanism that ensures the reciprocity remains fair among neighbors, unlike big banks.
          *   *Pros:* Warm, fits the "member-owned" aspect.
          *   *Cons:* Needs to address the "money-making" suspicion carefully.
      *   *Angle 3: The "Stewardship" Pivot.* Aristotle distinguishes between using money as a means vs. an end. A credit union treats money as a means to member well-being. Shareholder banks treat money as an end.
          *   *Pros:* Strong philosophical distinction, flattering to the audience.
          *   *Cons:* Needs to be simple enough for retirees but precise enough for economists.

      *Decision:* Blend Angle 2 and 3. Focus on *purpose*. Aristotle hated money becoming the master. A credit union keeps money as the servant. This honors the theory without lying about usury.

  4.  **Drafting - Section by Section:**
      *   **Opening:** Welcome, acknowledge the occasion (75 years), set the tone (warmth).
      *   **The Hook (Aristotle):** Introduce the philosopher gently. Don't use Greek terms unless explained immediately. Focus on the "shoemaker and farmer" analogy.
      *   **The Tension:** Acknowledge the elephant in the room. Aristotle was wary of banks/profit. Be honest about this.
      *   **The Resolution (The Credit Union Difference):** Why this place is different. Member-owned = community-focused. Money serves people, not shareholders. This aligns with *oikonomia* (household management) rather than unlimited *chrematistics*.
      *   **The Closing:** Bring it back to reciprocity and neighbors. Raise the glass.

  5.  **Refining for Oral Delivery:**
      *   Short sentences.
      *   Rhythm and pauses.
      *   Avoid jargon where possible, or explain it simply.
      *   Ensure the economists nod (accurate interpretation) and the retirees smile (feel valued).
      *   Timing: ~400-450 words for 3 minutes at a moderate pace.

  6.  **Drafting - Iteration 1 (Mental Check):**
      *   *Did I say Aristotle loved banks?* No, must avoid that.
      *   *Did I explain reciprocity?* Yes, shoes and wheat.
      *   *Is it warm?* Needs more "neighbor" language.
      *   *Is it accurate?* Aristotle distinguished natural vs unnatural acquisition. Credit unions are closer to natural because they serve the "household" (the community).

  7.  **Drafting - Iteration 2 (Writing the speech):**
      *   Start with "Good evening."
      *   Mention 75 years.
      *   Bring in Aristotle: "A Greek guy with a beard."
      *   The shoe/wheat example.
      *   The warning: Money shouldn't breed money.
      *   The pivot: But look around. This isn't a temple to profit. It's a tool for neighbors.
      *   The toast.

  8.  **Polishing:**
      *   Make sure the distinction between "money as means" and "money as end" is clear.
      *   Ensure the "member-owned" point hits hard—that's the philosophical safeguard.
      *   Check word count. (Aim for ~450 words).

      *(Self-Correction during drafting)*: I need to be careful not to imply credit unions *don't* make money. They do. But the *purpose* is different. Aristotle's issue was unlimited accumulation for its own sake. A credit union's accumulation is for stability and member benefit. I should frame it as "money as a tool for fairness" rather than "money as a product."

      *Refining the Aristotle bit:* He called money "nomos" (convention/law). It exists by agreement. A credit union is literally an agreement among members. That's a strong link.

      *Final check on tone:* Needs to sound like a human speaking, not a lecture. Use contractions. Pause markers.

  9.  **Final Review against constraints:**
      *   Start with toast? Yes.
      *   No preamble? Yes.
      *   3 minutes? Yes.
      *   Accurate Aristotle? Yes (focus on reciprocity and means/ends).
      *   Warmth? Yes.

      *(Drafting content)*...
      "Good evening..."
      "Aristotle..."
      "Shoemaker and farmer..."
      "Money as a bridge..."
      "The warning..."
      "The Credit Union difference..."
      "The Toast..."

      Let's write it.cw
answer: |-
  Good evening, everyone. Friends, neighbors, colleagues.

  Seventy-five years is a long time. In the life of a nation, it's a chapter. In the life of a community, it's a legacy. And to stand here, looking around this room, I see the people who built that legacy.

  I've been asked to say a few words, and I wanted to bring in a friend of mine from the past. Aristotle. Now, I know what some of you in finance are thinking: "Great, here comes the ethics lecture." And to the members thinking, "Just tell us why this place is special." Well, Aristotle actually helps us do both.

  He had a very specific idea about money. He said money doesn't have value because it's gold or paper. It has value because we agree it does. It's a convention. A promise. He said the whole point of money is to let a shoemaker trade with a farmer. They have different skills, different needs. Money is just the bridge that lets them meet fairly. For Aristotle, that reciprocity—that fair exchange between different kinds of people—is what holds a city together.

  But here's the catch. Aristotle was deeply suspicious of people who treated money as the goal. He thought making money just to make more money was unnatural. He believed money should be a tool to satisfy needs, not a master to be served.

  So, how do we toast an institution whose business is money, using a philosopher who warned us about exactly that?

  The answer is in why this place exists.

  A shareholder bank answers to investors who want infinite growth. That is what Aristotle warned against—money breeding money for its own sake. But a credit union answers to members. To neighbors. To you.

  Here, money isn't the end goal. It's the tool we use to buy homes, to start businesses, to secure retirements, and to help each other through hard times. This institution keeps money in its proper place: as a servant to the community, not the master of it.

  For seventy-five years, this credit union has honored that old Greek insight. You've kept the bridge standing. You've ensured that the shoemaker and the farmer—and the teacher, and the nurse, and the retiree—can meet on fair ground.

  So, if Aristotle were here, I don't think he'd love the interest rates. But I think he'd respect the purpose. He'd see that this isn't a temple to profit. It's a household managed for the good of all.

  Please raise your glasses.

  To seventy-five years of keeping our promises. To money that serves people, not the other way around. And to the neighbors who make this community worth investing in.

  Cheers.
