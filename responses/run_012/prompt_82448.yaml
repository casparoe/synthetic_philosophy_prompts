      *   Snow = Semantic/Archetypal. Clean.
      *   Fish = Episodic/Sensory. Messy.
      *   Writing requires translating Episodic to Semantic.
      *   If you start with Semantic (reading about snow), you stay in the realm of Language, which is where Writing lives.
