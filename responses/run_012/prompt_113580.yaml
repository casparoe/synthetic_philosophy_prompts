  ### residue

  The things with no home in my framework are rights and constitutive identity. My machinery assumes individuals exist prior to society with fixed preferences, so I can only model morality as an externality or a public good, not as the thing that makes the society *that* society. Devlin's claim that morality *constitutes* the group has no counterpart because welfare economics takes the group boundary and individual identity as exogenous inputs. Hart's claim that coercion requires justification beyond utility maximization also lacks a home; in my framework, if the net benefits of coercion are positive, it is justified unless I arbitrarily impose a constraint. This residue exists because my machinery is utilitarian by design, whereas both Hart and Devlin are arguing about the legitimate boundaries of state power, not just the efficient allocation of resources. The original claims aren't vaguer; they are category errors when forced into a cost-benefit ledger.

  ### verdict

  Hart survives translation better, but only because modern welfare economics is essentially Hartian utilitarianism wearing a wig. The standard move of "laundering meddlesome preferences" is a direct operationalization of the Harm Principle, so Hart's position maps cleanly onto your existing protocol. Devlin requires you to accept the "social capital" model, which forces you to treat moral disgust as a protective tariff for a fragile equilibrium; this is modelable but empirically brittle. The game-theory reading is a replacement, not a translation: it explains *how* Devlin's society might function mechanically, but it strips out the normative claim that the morality is *binding* rather than just *sticky*. The residue is a defect of economics, not the philosophers; economics is built to maximize satisfaction of preferences, not to adjudicate whether those preferences deserve satisfaction or whether the society holding them should exist in that form.

  ### for_my_cba

  For the concrete question of the brothel: do not count the offence as a monetized benefit in your base case. Under standard welfare economics (the Hartian translation), resident disgust at a private consensual transaction is a meddlesome preference; counting it allows a majority to veto minority consumption without evidence of tangible harm, leading to inefficient outcomes and infinite regress (you'd have to count the offence of the sex workers at the residents' prejudice). You should only count it if you can empirically demonstrate the Devlin/Game-Theory claim: that this specific brothel triggers a non-linear collapse in local social capital (e.g., measurable drop in property values, local business closure, or crime rates due to norm breakdown) that outweighs the benefits. Absent that empirical evidence, treating moral offence as a valid negative externality violates the Kaldor-Hicks criterion by allowing preference intensity to override efficiency without compensation. Stick to tangible externalities (noise, traffic, crime) and treat the moral offence as a distributional conflict, not a welfare loss.
