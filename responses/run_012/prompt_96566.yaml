  "Nope," says the teleosemanticist. "Only the trained one. The copy lacks selection history. It's semantically void."

  "But you say a frog's neuron means 'fly' and not 'fly-or-dark-speck' even when it snaps at a BB!"

  "Right. Because the frog was selected for flies. Your code wasn't selected for anything. It's not a misrepresenting frog; it's a rock that glows."

  "So how do I give it content?"

  "Easy. Start culling the instances that misidentify cats. Come back when it has a phylogeny."
