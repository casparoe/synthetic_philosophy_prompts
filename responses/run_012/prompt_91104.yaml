  One contested point remains: whether Darwinian evolution requires heritable *individuals* (vesicles) or merely heritable *molecules* (RNA). Since vesicles form de novo, only the RNA lineage is inherited. I lean towards accepting molecular lineages as sufficient for evolutionary capacity, as the phenotype (replication rate) is encoded and selected. Confidence in this reading is moderate; it depends on whether regulatory definitions of evolution track biological theory or functional risk. Some philosophers argue evolution requires a distinct individual boundary to separate selection units from noise. However, given the risk of environmental adaptation, the evolutionary clause alone should trigger containment. To rule otherwise is to allow a replicator with adaptive potential into the sewage system simply because it lacks a metabolism we do not fully understand ourselves. The charter was drafted for planetary protection and inherited unexamined; we must interpret it to serve that original safety intent.

  **The strongest case against the recommendation**

  The strongest case against classification argues that the charter requires both clauses to be satisfied conjunctively. Since the system cannot maintain itself far from equilibrium, it falls outside the charter's scope entirely, regardless of its evolutionary capacity. This is not merely semantic; it protects legitimate chemical research from burdensome biological regulation based on category errors. Furthermore, the Safety Officer's concern relies on a precautionary principle that may be overly conservative in this specific instance. The river environment differs significantly from the lab buffer: temperature fluctuates, phosphate may precipitate fatty acids, and environmental nucleases could degrade exposed RNA. The construct survives cold storage, but survival is not replication. Without evidence that it can acquire monomers in the wild, the risk of flourishing is speculative. Classifying it as a reagent acknowledges its chemical dependence and avoids setting a precedent that stifles synthetic chemistry based on hypothetical ecological risks. The safety officer's position that we "cannot say it could not" flourish sets an impossibly low bar for containment, potentially capturing simple crystal growth or fire. Resource intensive containment diverts funds from actual safety measures.

  **Confidence, and what would change my mind**

  I am highly confident that the pragmatic interpretation of the rule is correct, but only moderately confident that the charter supports it linguistically without amendment. My position would change if experimental data demonstrated that the ribozyme cannot replicate in river water simulants, or if legal counsel confirmed the charter strictly requires conjunction of both clauses. Evidence regarding phosphate interaction with oleic acid vesicles would also be decisive. If the vesicles destabilise instantly in phosphate-rich water, the evolutionary capacity becomes irrelevant. I would also reconsider if a clear distinction were drawn between molecular evolution and organismal evolution in subsequent legal guidance.

  **Decision and timetable**

  I propose we put the motion to classify the construct as a living organism under Containment Level 2. This classification shall be reviewed in twenty-four months or upon significant modification of the construct. Waste protocols must be updated by 1 July, ensuring all effluent is autoclaved before discharge. Annual reporting to the national authority will commence with the next fiscal cycle. The committee should vote on this motion at the meeting on 12 June. Implementation of new waste streams must be complete by 1 July to align with the quarterly safety audit. Researchers must be notified of the change in status by 15 June to allow for cabinet allocation. We should schedule a follow-up review of this decision framework for the deferred prion and mineral cases in September. This ensures consistency across the institute's novel systems.
