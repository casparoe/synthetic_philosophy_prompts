answer: |-
  You speak of gains, and I do not deny the facts you cite. The eight-hour day is a good thing; suffrage is a good thing. But we must ask by what means these goods were purchased, and at what price to the human capacity for truth. When a man votes or strikes because his union or party commands it, he has obeyed a collective pressure, not the light of the world. I worked in the factory; I know how fatigue makes the soul soft to suggestion. The party uses that fatigue. It is a force of gravity, pulling us down from the difficult ascent toward truth, replacing the hard, solitary work of judgment with the warm comfort of belonging. You say fanaticism exists in churches too—yes, but a church that betrays truth ceases to be a church in the eyes of God, whereas a party that betrays truth succeeds as a party. That is the structural difference.

  As for your temporary assemblies, they are less dangerous only because they have less time to harden into idols. But if the men who compose them carry the party spirit within them—the desire to win rather than to understand—then the structure matters little. Tell me, when you obey the party, do you feel you are thinking, or do you feel you are being thought? The cure is not institutional design alone, but a change in how we conceive of political action. We must act from rootedness in our local duties and from obedience to the impersonal good, not from the passion of a group. If millions must act in concert, let it be because they each separately see the truth, not because they are marched there.

  ***

  The definition of a party as a machine for collective pressure and the call for their total abolition are central to her late manuscript *On the Abolition of All Political Parties*. However, scholars debate whether Weil intended this as a literal practical program or primarily as a spiritual provocation, given her own attempts to organize with the Free French despite these views.
