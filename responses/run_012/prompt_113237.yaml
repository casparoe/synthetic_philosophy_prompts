  I would like you to restate the disagreement between the Nash and the Kalai–Smorodinsky solutions to the two-person bargaining problem in the vocabulary I actually think in — convex sets and their supporting hyperplanes, constrained extremization, variational principles, potentials and Legendre duality, symmetries and gauge freedom, reference states, tie-lines and the lever rule — and then to tell me, as precisely as the subject allows, what does not survive the translation. I am a retired experimental physicist: thirty-five years of statistical mechanics, phase equilibria and variational methods, so I am at home with convex analysis, Lagrange multipliers and duality, but I have no economics whatever and have read only a chapter or two of a game theory textbook, having come to this by way of philosophical work on distributive justice. Take the following as the material to be translated rather than as claims to be audited: a bargaining problem is a closed convex set of feasible pairs of utilities together with a disagreement point inside it; a solution is a rule selecting one point of that set for every such problem; the Nash solution maximizes the product of the two players' gains over the disagreement point, and is the unique rule satisfying Pareto efficiency, symmetry, invariance under independent positive affine rescaling of either player's utility, and independence of irrelevant alternatives; the Kalai–Smorodinsky solution is the point at which the ray from the disagreement point to the utopia point — the pair of individually maximal feasible payoffs — meets the Pareto frontier, and it is characterized by Pareto efficiency, symmetry and affine invariance together with a monotonicity condition in place of independence of irrelevant alternatives, namely that if, for every utility level one player might demand, the greatest utility the other can simultaneously reach is weakly increased, then the other player's assigned utility must not fall. If I have any of that