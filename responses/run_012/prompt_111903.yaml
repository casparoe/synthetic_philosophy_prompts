prompt: |-
  I'm in a seminar on norms and conventions, and last week's session — on whether ordinary conventions like tipping, which side of the escalator you stand on, queueing at a bar, or crossing against the light are moral obligations — ended when the professor said, in a tone that closed the discussion, "When in Rome, do as the Romans do." The case on the table was a visiting student who won't tip in a city where tipping is expected, stands on the wrong side of the escalator, and crosses an empty street against the light, on the grounds that she is only passing through and these are not her conventions. I don't think the proverb settles her case, but I also can't say precisely what it claims. Can you separate out the distinct claims it could be making — from "you will get along better if you conform," through "conventions bind only those who share them," to something that makes a visitor's obligations depend on the host community's practices — and say of each whether it is a platitude, a substantive and defensible thesis, or false; whether it treats purely coordinative conventions (which side of the escalator) the same as distributive ones (tipping, which moves money to workers); and whether it would extend to local conventions I take to be criticizable? Then tell me which reading the professor would need for her sentence to actually dispose of the visiting student's case, and which reading she most likely meant. Lay it out as a numbered menu I can bring to office hours, with a one-line verdict on each reading.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A seminar on norms and conventions.
      *   **Problem:** The professor ended a discussion on the moral status of conventions (tipping, escalators, queueing, jaywalking) with "When in Rome, do as the Romans do." The student (user) feels this doesn't settle the case of a visiting student who refuses to follow local conventions because she's "just passing through."
      *   **Task:** Dissect the proverb "When in Rome, do as the Romans do" into distinct claims/interpretations.
      *   **Criteria for Analysis:**
          *   Classify each claim (Platitude, Substantive/Defensible, False).
          *   Check if it distinguishes between coordinative (escalators) and distributive/normative (tipping) conventions.
          *   Check if it allows for criticism of local conventions (i.e., does it demand conformity even to bad norms?).
          *   Identify which reading is *needed* to dispose of the student's case.
          *   Identify which reading the professor *most likely meant*.
      *   **Format:** A numbered menu suitable for office hours, with a one-line verdict on each reading.

  2.  **Deconstruct the Proverb ("When in Rome, do as the Romans do"):**
      *   *Origin:* St. Ambrose advising St. Augustine (roughly). Context was religious fasting practices.
      *   *Surface Meaning:* Adapt to local customs when visiting.
      *   *Underlying Philosophical Claims:*
          1.  Prudential/Instrumental: You avoid trouble by fitting in.
          2.  Relativist/Contractual: Rules only apply if you're a member of the community.
          3.  Obligation-Based: Presence creates an obligation to obey local norms.
          4.  Respect-Based: It's rude not to acknowledge host norms.
          5.  Moral Absolutism (ironically): The "Roman" way is the right way *because* it's the Roman way (unlikely but possible).

  3.  **Drafting the Readings (Iterative Process):**

      *   *Reading 1: Prudential Advice.* "You won't get in trouble if you conform."
          *   Status: Platitude/True.
          *   Distinction: Treats all conventions same (risk of sanction).
          *   Criticism: Doesn't address *moral* obligation, just consequences.
          *   Verdict: True but irrelevant to moral obligation.

      *   *Reading 2: Jurisdictional/Contractual.* "Rules only bind members; visitors are exempt." (This is actually the *student's* view, but the proverb is usually used to counter it. So the proverb implies the opposite: "Location binds you.") Let's frame it as "Physical presence creates obligation."
          *   Status: Substantive.
          *   Distinction: Might blur coordinative vs. distributive.
          *   Criticism: What if the local norm is immoral?
          *   Verdict: Defensible but limited by morality.

      *   *Reading 3: Fairness/Reciprocity.* "You benefit from the order, so you must uphold it." (Fair play theory).
          *   Status: Substantive/Defensible.
          *   Distinction: Stronger for tipping (distributive) than escalators (coordinative).
          *   Criticism: Does a short-term visitor benefit enough to incur obligation?
          *   Verdict: Strongest moral case, but depends on benefit.

      *   *Reading 4: Respect for Autonomy.* "The host community has the right to set their terms."
          *   Status: Substantive.
          *   Distinction: Applies to all norms.
          *   Criticism: Fails if norms are unjust.
          *   Verdict: Defensible regarding sovereignty, not individual morality.

      *   *Reading 5: Moral Relativism.* "What is right is determined by local custom."
          *   Status: False/Controversial.
          *   Distinction: Erases distinction between good and bad norms.
          *   Criticism: Cannot criticize local norms (e.g., discrimination).
          *   Verdict: Philosophically untenable.

  4.  **Refining the Analysis against the Prompt's Specific Constraints:**
      *   Need to address: Platitude vs. Substantive vs. False.
      *   Need to address: Coordinative (escalator) vs. Distributive (tipping).
      *   Need to address: Criticizable conventions.
      *   Need to identify: What *disposes* of the case vs. What was *meant*.

  5.  **Developing the "Menu" Items:**

      *   *Item 1: The Prudential Warning.* (Don't get punished).
      *   *Item 2: The Fair Play Principle.* (You benefit, you contribute).
      *   *Item 3: The Jurisdictional Claim.* (Location = Consent).
      *   *Item 4: The Respect/Courtesy Norm.* (Don't offend the hosts).
      *   *Item 5: The Strong Relativist Claim.* (Local custom defines morality).

  6.  **Evaluating Each Item:**

      *   *Item 1 (Prudential):* Platitude. True. Doesn't distinguish norm types. Doesn't address moral criticism. *Verdict:* Good advice, bad ethics.
      *   *Item 2 (Fair Play):* Substantive. Distinguishes (tipping matters more than escalator). Allows criticism (unfair systems don't bind). *Verdict:* Defensible but weak for short-term visitors.
      *   *Item 3 (Jurisdictional):* Substantive. Treats all norms same. Problematic if norms are bad. *Verdict:* Plausible for law, weak for etiquette.
      *   *Item 4 (Respect):* Substantive. Distinguishes (offense varies). Allows criticism (don't respect evil). *Verdict:* Strongest social argument.
      *   *Item 5 (Relativist):* False. Treats all norms same. No criticism allowed. *Verdict:* Philosophically dead.

  7.  **Determining the "Disposal" vs. "Likely Meaning":**
      *   *To Dispose of the Case:* The professor needs a claim that creates a *moral obligation* for the visitor. Prudential isn't enough (student might accept risk). Relativist is too strong. Fair Play or Respect are the only ones that generate obligation. The *Jurisdictional* claim (Presence = Obligation) is the quickest way to shut down the "I'm just visiting" argument.
      *   *Likely Meaning:* Professors often use proverbs as conversation stoppers. She likely meant the Prudential Warning (don't make waves) or a vague mix of Respect + Jurisdiction. But to *actually* win the argument, she needs the Fair Play or Jurisdictional claim. Let's argue she likely meant the Prudential one disguised as moral, but *needed* the Fair Play one.
      *   *Correction:* The prompt asks which reading she *would need* to dispose of the case, and which she *most likely meant*.
      *   *Need:* To prove the student is *wrong* (not just risky), she needs a normative claim. The "Fair Play" or "Respect" reading works best. The "Jurisdictional" (Location implies consent) is also strong. Let's go with **The Obligation of Presence (Jurisdictional/Fair Play hybrid)** as the one needed to prove moral wrongness.
      *   *Likely:* Professors using proverbs usually mean **The Prudential Warning** (avoid conflict) or **The Relativist Claim** (who are you to judge?). Given the "tone that closed the discussion," it was likely a pragmatic shutdown (Prudential) or an appeal to authority (Relativist). Let's lean toward Prudential/Politeness mix.

  8.  **Final Polish of the Menu:**
      *   Ensure the "One-line verdict" is punchy.
      *   Ensure the distinctions (coordinative vs. distributive, criticizable) are explicit in the analysis.
      *   Make sure the tone is appropriate for a student going to office hours (analytical, respectful, precise).

      *(Self-Correction during drafting)*: I need to be careful with the "Distributive vs. Coordinative" distinction.
      *   Coordinative: Escalators, driving side. (Everyone benefits from coordination).
      *   Distributive/Normative: Tipping (wealth transfer), Queueing (fairness).
      *   Does the proverb distinguish? Usually no, it treats them as a block "customs." This is a weakness.

      *(Refining the "Needed" vs. "Meant")*:
      *   To *dispose* of the case (prove she is morally obligated), the professor needs a reading that generates obligation. Prudential doesn't do that (you can choose to be risky). Relativism does, but is false. Fair Play/Respect does. Let's select **The Principle of Fair Play** as the one *needed* to establish moral obligation, because it addresses the "free rider" problem of the visitor.
      *   What she *likely meant*: **The Prudential Maxim**. It's the most common usage. "Don't make trouble for yourself."

  9.  **Final Review against constraints:**
