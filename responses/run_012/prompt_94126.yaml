          *   *Severity:* **High.** This reframes the whole argument. If it's just priors, it's underdetermination (like physics), not indeterminacy.

      *   *Tension D: Claim 4 vs. Claim 5.*
          *   Claim 4: Reference is inscrutable (proxy functions).
