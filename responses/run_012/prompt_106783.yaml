      How about: "The Order speaks for the State." (True, but only the literal State, not the spirit).
      How about: "We will reveal all that is known." (They reveal all that is *known* to be literally verifiable, withholding inference).
      Let's go with: "No word spoken here shall be a lie." The Founder said this to the mob demanding transparency. It placated them, but allowed the Order to hide everything via implication.

      *Okay, ready to draft.*

      *(Post-Drafting Check)*: Ensure the "reliance" feels like a moral debt. Varen touching Kael's arm. The look in his eyes. Elian feeling the "ghost" of the lie.

