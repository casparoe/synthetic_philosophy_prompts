      *   Kael: "The fever has broken." (True, but organ failure remains).
      *   Varen leaves happy, thinking she will recover.
      *   *Wait, I need the Guild's Charter revelation.*
      *   Let's make the Examiner (Elian) the one reflecting on the history.

  5.  **Drafting - Step-by-Step:**

      *   *Scene 1:* The Observation Room. Elian watching Kael through the glass. The solemnity of the Order.
      *   *Scene 2:* The Consultation. Varen enters. Desperate. Kael performs the "Plain Speech."
      *   *Dialogue:*
          *   Varen: "Did the treatment work?"
          *   Kael: "The regimen was completed."
          *   Varen: "Is she out of danger?"
          *   Kael: "The immediate contagion has passed."
          *   Varen: "Can I bring her home?"
