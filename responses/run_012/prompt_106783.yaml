      *   *Scene 3:* Varen's reaction. The relief. The hand on Kael's shoulder. The weight of that trust. Elian feels the pang of it.
      *   *Scene 4:* Debrief. Kael is proud. "I lied to no one." Elian nods.
      *   *Scene 5:* Elian alone in the archives. He pulls the Charter. He reads the founding clause. The Founder promised the King "Order would be kept." Order was kept (peace), but through suppression. The statement was technically true but misleading.
      *   *Scene 6:* Closing Image. The seal on the charter. The dust.

  6.  **Refining and Polishing:**
      *   *Word Count:* Need to ensure I don't rush. Expand on the atmosphere of the "Hall of Verification."
      *   *Moral Ambiguity:* Don't make Kael evil. He believes he is upholding the law. Don't make Elian a hero. He is complicit.
      *   *The "Owed" feeling:* Emphasize Varen's vulnerability. He is handing over his agency based on Kael's words.
      *   *The Charter:* Make sure the parallel is clear. The Founder said "We guarantee safety" (meaning safety from chaos, not physical safety). Or "We serve the Truth." (Meaning literal truth, not holistic truth). Let's go with: The Founder told the First Council, "No secret shall be kept from the Examiners." (True, but the Examiners don't tell the public).
      *   *Actually, better:* The Founder said to the populace: "Under this Charter, no man shall be deceived." (Technically true, because they defined deception as literal falsehood).
      *   *Final Image:* The ink drying, or a candle burning down.

  7.  **Review against constraints:**
      *   1,200-1,800 words? (Will monitor during drafting).
      *   Exchange included? Yes.
      *   Reliance vivid? Yes (Varen's hope).
      *   Charter revelation? Yes.
      *   No philosophical lecturing? Keep it narrative.
      *   Close on image? Yes.

  8.  **Self-Correction during drafting:**
      *   *Check:* Is the distinction clear? Yes, literal truth vs. implied falsehood.
      *   *Check:* Is the society's view clear? They respect the Order.
      *   *Check:* Is the ending ambiguous? Yes, Elian doesn't quit or rebel. He just sees the irony.

