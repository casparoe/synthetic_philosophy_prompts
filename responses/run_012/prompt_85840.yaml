prompt: |-
  ok so I'm a novelist. Literary fiction, but this one has a lot of procedure in it — think a workplace novel that keeps drifting into a legal thriller. My protagonist, Nell, is a mediator, or really a facilitator, who gets called in when two experts are deadlocked and someone needs the deadlock documented. A hydrologist and a dam engineer. A hospital administrator and an epidemiologist. A city planner and the guy who runs the traffic model. She does two or three of these a week, she's smart but not a statistician, she gets about an hour with each party seperately and then an hour with them together, and at the end she has to write something both sides will sign, which goes to whoever hired her.

  Here's the thing I built the book on. A friend of mine who does this for real told me there's actual math behind why she keeps failing. The idea, and I'm probaly mangling it, is something like: if two people start from the same prior, and it's common knowledge between them what each one now believes, they can't keep disagreeing. So whenever two rational people with the same starting point stay stuck, the stuckness has to be traceable to something specific — different priors, or private information neither has fully pooled, or the disagreement not actually being common knowledge in the technical sense (each thinks the other is posturing, or each thinks the other thinks they're posturing), or one of them just not being coherent. Is that right? Because if it is, it's the engine of my whole book and I want to get it right.

  So what I need from you: turn this into a procedure Nell can actually run in a room. The questions she asks in order, what counts as a sufficient answer to each, which answers let her stop and which send her back a step, and where the procedure runs out and she has to hand the thing to a person because the remaining question is about values and not about belief. Remember she can't do algebra on the page — it has to be verbal tests, things she can say out loud and a hostile engineer can't dismiss as hand-waving. And she needs to be able to defend each step, because these people are experts and they will absolutely push back.

  Then run it on three cases, in the kind of detail where I can steal the dialogue:

  1. Two hydrologists, same data, same model family, one says the reservoir has a one-in-four hundred chance of overtopping in the next decade and the other says one in forty. They both agree the other isn't lying or stupid. Walk me through what Nell does.
  2. Two experts who, as far as Nell can establish, have the same priors, the same evidence, and the same competence, and who still won't budge. I need to know what the procedure says here, even if what it says is that one of them isn't being coherent — because that's an accusation Nell can't make in a signed document, and I need to know she can't.
  3. One of the two parties isn't a person. It's a model — a forecasting system, or an optimization thing someone bolted onto a permitting process — and the person defending it genuinely can't tell Nell what it started out believing. Does the procedure even get off the ground? If it doesn't, say so.

  Two more things. First, tell me honestly what this procedure can't do, and give me at least one case where it produces an answer I won't like — ideally an answer that makes Nell, or the party I'm most sympathetic to, come out worse than the scene needs them to. I'd rather rewrite the scene than have you flatter me. Second, don't worry about citing anybody. Nell isn't going to name-drop a philosopher in a mediation room and neither is the narrator, so the ideas just have to be right, not attributed. Same for the write-up: no reading lists, no bibliography, no names and dates. If the underlying result is genuinely contested or has a caveat that would embarrass me if a reviewer caught it, tell me in plain language instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing literary fiction/workplace legal thriller.
      *   **Protagonist:** Nell, a mediator/facilitator for expert deadlocks.
      *   **Core Concept:** Aumann's Agreement Theorem (roughly). If rational agents share common priors and common knowledge of posteriors, they cannot agree to disagree. Therefore, persistent disagreement implies differing priors, private information, lack of common knowledge, or incoherence.
      *   **Task:**
          1.  Validate the core concept (is it right?).
          2.  Create a verbal/procedural protocol Nell can use (no algebra, defensible against experts).
          3.  Run the protocol on three specific cases (Hydrologists, Intractable Disagreement, Human vs. Model).
          4.  Provide limitations/failures (where the procedure fails or produces an unsatisfying result).
          5.  **Constraint:** No name-dropping philosophers/theorems, no bibliography, plain language caveats.

  2.  **Validate the Core Concept (Aumann's Agreement Theorem):**
      *   *Is the user right?* Yes, essentially. Robert Aumann's 1976 theorem states that two Bayesian rationalists with common priors cannot have common knowledge of a disagreement in their posteriors.
      *   *Nuance:* Real humans aren't perfect Bayesian rationalists. "Common knowledge" is a very high bar (I know X, you know X, I know you know X, you know I know X, ad infinitum).
      *   *For Fiction:* It's a solid engine. It gives Nell a logical framework to dissect *why* people are stuck.
      *   *Caveat:* It assumes honesty and logical consistency. It doesn't solve value conflicts (ought vs. is).

  3.  **Develop Nell's Protocol (The "Audit"):**
      *   *Goal:* Translate Bayesian updating into verbal questions.
      *   *Step 1: The Baseline (Priors).* What did you believe before seeing *this* specific data?
      *   *Step 2: The Evidence (Likelihood).* What specific piece of information moved you?
      *   *Step 3: The Weight (Updating).* How much did that piece move you?
      *   *Step 4: The Mirror (Common Knowledge).* Do you know *why* they moved? Do they know *why* you moved?
      *   *Step 5: The Residual.* If steps 1-4 align, what's left? (Values, Risk Tolerance, Incoherence).
      *   *Tone:* Clinical, precise, non-accusatory but rigorous.

  4.  **Drafting the Cases:**

      *   **Case 1: Hydrologists (Data/Model Disagreement).**
          *   *Setup:* 1/400 vs 1/40. Same data, same model family.
          *   *Diagnosis:* Likely differing priors on model parameters or interpretation of "noise."
          *   *Resolution:* Nell finds they are weighting historical outliers differently. One treats a 1950s flood as an anomaly; the other as a trend.
          *   *Outcome:* They sign a document stating the divergence point (the weight of the 1950 event).

      *   **Case 2: The Intractable Disagreement (Same Priors/Evidence).**
          *   *Setup:* Experts seem identical on paper but won't budge.
          *   *Diagnosis:* This is the hard one. If priors and evidence are truly shared, Aumann says they *must* agree. If they don't, one is lying, mistaken, or incoherent.
          *   *Nell's Move:* She can't accuse them of irrationality in the report. She has to frame it as "Undisclosed Private Information" or "Divergent Risk Tolerance."
          *   *Twist:* One expert *knows* something they can't say (legal/NDAs) or they are protecting a career interest.
          *   *Outcome:* The report states "Unresolved Variance in Parameter X." It's a failure of the process, which is realistic.

      *   **Case 3: Human vs. Model (The Black Box).**
          *   *Setup:* One party is an algorithm/optimization system.
          *   *Diagnosis:* Models don't have "priors" in the human sense; they have initial weights. If the defender can't explain the weights, "Common Knowledge" is impossible.
          *   *Outcome:* The procedure halts. Nell writes "Process Unverifiable." This is a strong dramatic point.

  5.  **Addressing Limitations (The "Unpleasant Truth"):**
      *   *Limitation:* The protocol assumes good faith. It fails against bad faith.
      *   *Limitation:* It cannot resolve value judgments (Safety vs. Cost).
      *   *Unpleasant Outcome:* Nell finds the "correct" answer, but the person with the correct answer is acting in bad faith (e.g., hiding liability), and the protocol forces her to validate the *process* of the bad actor because they followed the steps better. Or, she identifies the truth, but the report is ignored because the truth is too expensive. Let's go with: The protocol reveals the disagreement is about *values* disguised as *facts*, but the client (who hired her) wants a factual answer to avoid paying for the value shift. Nell's report exposes this, making her unpopular.

  6.  **Refining the Voice:**
      *   Needs to be crisp, professional, slightly weary.
      *   Avoid jargon like "Bayesian," "Posterior," "Common Priors." Use "Starting Point," "Current View," "Shared Knowledge."
      *   Ensure the dialogue sounds like experts trying to outsmart each other, and Nell cutting through it.

  7.  **Review against Constraints:**
      *   No name-dropping Aumann? Check.
      *   No bibliography? Check.
      *   Plain language caveats? Check.
      *   Three specific cases? Check.
      *   Procedure steps? Check.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction on Case 2:* If they truly have the same priors and evidence, they *must* agree mathematically. If they don't, the procedure *must* break. Nell can't force agreement. She has to document the break. The "failure" is the story.
      *   *Correction on Case 3:* A model doesn't "believe." The human defender must articulate the model's logic. If they can't, the human is the bottleneck.
      *   *Refining the Protocol:* Make sure it sounds like a checklist she can physically hold.
      *   *The "Unpleasant Truth":* Make sure it hurts Nell. Maybe she proves the safer option is mathematically sound, but the protocol reveals the "risk" is actually a value judgment on human life, and she has to write that down, which gets her fired or sued. Let's make it subtler: She proves the disagreement is real, but the *reason* is that one side is protecting a career secret. She can't write that. She has to write "Unexplained Variance," which kills the project.

      *(Self-Correction on the "Unpleasant Truth" again)*: The prompt asks for a case where the procedure produces an answer the writer won't like / makes Nell come out worse.
      *Idea:* Nell runs the protocol. It reveals that the "hero" expert is actually the one with the incoherent priors (maybe due to trauma or bias), and the "villain" corporation is mathematically correct. Nell has to sign off on the villain's number. This challenges the protagonist's moral compass.

  9.  **Final Polish:** Check tone. Ensure the distinction between *fact* (belief) and *value* (risk tolerance) is clear, as that's the boundary where the math stops.

  **(Final Plan Check):**
  1. Confirm the theory (Aumann's Agreement Theorem) without naming it.
  2. Define "The Protocol" (5 Steps).
  3. Case 1: Hydrologists (Resolution via Parameter Weighting).
  4. Case 2: Intractable (Resolution via "Private Information" cover story).
  5. Case 3: Model (Resolution via "Process Halt").
  6. Limitations & The "Bad Ending" scenario.

