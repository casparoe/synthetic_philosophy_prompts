      *   *Genetic Fallacy:* Judging something by its origin. This is relevant to Type 2, but the user notes a specific *reversal* where the origin becomes a virtue.
      *   *Aestheticism/Autonomism:* Art is separate from morality. This doesn't capture the *conversion* of moral fault to aesthetic credit.
      *   *Aura/Authenticity (Benjamin):* Related to history, but not specifically moral fault.
