      *Refining the Terms:*
      1.  **Immanent Corruption:** The work's content is morally flawed.
      2.  **Extrinsic Stain:** The work's production is morally flawed.
      3.  **Genetic Sublimation:** The process where the Extrinsic Stain is reinterpreted as aesthetic depth.

  4.  **Distinguishing from Related Concepts:**
      *   *Genetic Fallacy:* Usually warns *against* using origin to judge value. Here, we are acknowledging origin *does* judge value, but inconsistently. The distinction is that Genetic Sublimation isn't a logical error per se, but an aesthetic re-framing.
      *   *Intentional Fallacy:* Wimsatt/Beardsley. Don't judge by intent. Genetic Sublimation judges by *action/history*, not just intent.
