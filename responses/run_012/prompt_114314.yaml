      *   Type 2 (Extrinsic Stain) + The Conversion is the novel, tricky part. It reveals how we consume *mythology* alongside art. It's about the *contextual frame*.
      *   *Decision:* The second kind (Production/History) combined with the conversion mechanism is the philosophically richer problem. It exposes the instability of the "art object" boundaries.

