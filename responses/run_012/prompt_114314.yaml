answer: |-
  You have identified a genuine asymmetry in aesthetic judgment that standard philosophical categories often blur. You are right to suspect you are not collapsing them; rather, the culture collapses them for you, inconsistently.

  There is no single established term that captures the specific *conversion mechanism* you describe (where a production fault becomes an aesthetic virtue), though the components exist in the literature on ethical criticism (Berys Gaut, Noël Carroll) and the sociology of art (Bourdieu, Benjamin).

  To give you the precision you need, I will propose a terminology that isolates these distinct phenomena, distinguish them from the fallacies you mentioned, and then argue for why the second kind is the far more philosophically volatile problem.

  ### 1. The Taxonomy

  Here are the terms to separate the phenomena you identified:

  **A. Constitutive Corruption (Your Type 1)**
  This is a moral defect embedded in the *content* or *structure* of the work. The work invites the audience to adopt a morally problematic perspective (e.g., finding humor in rape, aestheticizing fascism).
  *   **Status:** Treated as an internal aesthetic flaw. If the work asks you to enjoy evil, and you are morally sensitive, the work fails *as a work* for you.

  **B. Extrinsic Stain (Your Type 2)**
  This is a moral defect attached to the *history of production*. The content is morally neutral or good, but the conditions of its making were wrongful (e.g., stolen funds, abused labor, a ruined life).
  *   **Status:** Typically treated as an external ethical barrier. It is a reason not to *fund* or *support* the artist, but not usually cited as a reason the painting is poorly painted or the film is badly edited.

  **C. Genetic Sublimation (The Conversion)**
  This is the process you identified where an **Extrinsic Stain** is retroactively reinterpreted as **Constitutive Depth**. Once the artist is canonized, the cruelty that produced the work is no longer seen as a stain on the object, but as the *source* of its power. The suffering is read as "authenticity," the exploitation as "dedication," the moral compromise as "transgressive genius."
  *   **Example:** We do not say Roman Polanski's *Chinatown* is worse because of his crimes; we often whisper that his understanding of darkness is *deeper* because of them. The stain becomes a halo.

  ### 2. Distinctions from Standard Fallacies

  You asked how this differs from the Genetic Fallacy, the Intentional Fallacy, and Autonomism.

  **Vs. The Genetic Fallacy**
  The Genetic Fallacy warns against judging the *truth* or *value* of a claim solely by its *origin*.
  *   *Difference:* In **Constitutive Corruption**, the origin (the artist's moral stance) *is* the content. It is not a fallacy to say a film advocating genocide is flawed; the genocide is the point.
  *   *Difference:* In **Genetic Sublimation**, we are not committing the genetic fallacy; we are committing its inverse. We are admitting the origin matters, but we are magically re-coding a negative origin value into a positive aesthetic value. It is not a logical error; it is an aesthetic alchemy.

  **Vs. The Intentional Fallacy**
  This warns against settling a work's meaning by the artist's stated intentions.
  *   *Difference:* **Extrinsic Stain** is not about intention (what they meant to say), but about *action* (what they did to make it). You can have an Extrinsic Stain even if the artist intended no harm (e.g., unknowingly using looted materials). Genetic Sublimation relies on the *reality* of the suffering, not the artist's intent to suffer.

  **Vs. Autonomism (Art for Art's Sake)**
  Autonomism argues moral and aesthetic value are independent spheres.
  *   *Difference:* Autonomism would say the Extrinsic Stain is irrelevant to the art's quality. But **Genetic Sublimation** proves Autonomism false. It shows that moral history *does* infect aesthetic judgment, but inconsistently. It doesn't keep the spheres separate; it allows the moral sphere to colonize the aesthetic sphere, but only when it enhances the mythos.

  ### 3. Which is the "Interesting" Kind?

  You asked which of your two kinds is really the interesting one.

  **It is the second kind (Extrinsic Stain + Genetic Sublimation).**

  Here is why: **Constitutive Corruption** is a debate about *interpretation*. We can argue about whether a film actually asks us to root for the torturer. That is a hermeneutic problem.

  **Extrinsic Stain** is a debate about *ontology*. It forces us to ask: **Where does the artwork end?**
  *   If the beauty of a statue relies on the starvation of the sculptor, is the starvation part of the statue?
  *   If we say "no," we are pretending the art object is a disembodied thing that floats free of the world.
  *   If we say "yes," then almost all art is morally compromised (capitalism, patriarchy, colonialism underwrite most production), and aesthetic judgment becomes impossible.

  The **Genetic Sublimation** is the interesting mechanism because it reveals that we *want* the art object to have boundaries, but we are willing to dissolve those boundaries when it makes the art feel more "real." We treat the Extrinsic Stain as a barrier to purchase (consumer ethics) but a bridge to appreciation (aesthetic myth). This hypocrisy is the engine of celebrity culture.

  ### 4. Boundary Cases (Testing the Definitions)

  To test whether these definitions hold, consider these three boundary cases where the line between Constitutive and Extrinsic blurs.

  **Case 1: The Method Acting Harm (e.g., *Apocalypse Now* or *The Exorcist*)**
  *   *Scenario:* An director creates realistic suffering on set to get a realistic performance. The screen shows suffering (Content), but the suffering is also real (Production).
  *   *The Test:* Is the horror we feel **Constitutive Corruption** (we are watching simulated pain) or **Extrinsic Stain** (we are witnessing actual abuse)?
  *   *The Sublimation:* If the film is a classic, the abuse is framed as "necessary sacrifice for art." The Extrinsic Stain is sublimated into the film's "grit." If the film flops, it is "abusive mismanagement." The aesthetic success determines the moral categorization.

  **Case 2: The Looted Masterpiece**
  *   *Scenario:* A painting is discovered to be painted on canvas stolen from a murdered Jewish family in 1940. The image is a serene landscape.
  *   *The Test:* This is pure **Extrinsic Stain**. The content is untouched.
  *   *The Sublimation:* Does the painting become "haunted"? Does the serenity become "ironic" or "tragic"? If a curator writes a placard about the theft, the viewer's aesthetic experience changes. The Stain has become Constitutive. The history has entered the content via the viewer's knowledge. This suggests the "work" is not the physical object, but the object *plus* its known history.

  **Case 3: The AI Model (The Modern Limit Case)**
  *   *Scenario:* An AI generates a beautiful image trained on copyrighted work without consent.
  *   *The Test:* Is this **Extrinsic Stain**? There is no human "artist" to have a moral character. The "looting" is algorithmic.
  *   *The Sublimation:* Currently, there is no Sublimation here. No one says the image is *more beautiful* because it was non-consensually trained. It remains a Stain.
  *   *Implication:* This suggests **Genetic Sublimation** requires a *human villain*. We need a romanticized sufferer or a transgressive genius to convert the Stain into Virtue. We cannot sublimate the sins of a corporation or an algorithm. This proves the mechanism is about *myth-making*, not aesthetics.

  ### 5. Where the Line Actually Falls

  You care less about the labels than where the line falls. Here is the conclusion:

  The line does not fall between the *work* and the *world*. It falls between **Consumer Ethics** and **Aesthetic Experience**.

  1.  **Consumer Ethics:** We treat **Extrinsic Stains** as reasons to withhold money (boycott). This is pragmatic.
  2.  **Aesthetic Experience:** We treat **Constitutive Corruption** as reasons to withhold admiration.
  3.  **The Leak:** **Genetic Sublimation** occurs when we allow the Extrinsic Stain to leak into the Aesthetic Experience *only when it enhances the narrative of genius.*

  The "interesting" problem is that **the artwork is not a stable object.** It is a negotiation between the physical artifact and the story we tell about its creation. When we say a morally compromised artist's work is "still good," we are usually performing a surgical amputation: we are cutting the Extrinsic Stain away from the object to save the aesthetic value. But when we admire the "tortured genius," we are grafting the Stain back onto the object to increase its market value.

  Your intuition is correct: The second kind (Production/History) is the dangerous one. It is where we decide whether art is a commodity that can be cleaned, or a testament that cannot be separated from the blood spilled to make it. The fact that we switch between these views depending on how much we like the art is the real moral failure.
