prompt: |-
  ok so my school signed a bunch of us up for this psych experiment at the university and I can't stop thinking about it. They put me and some kid named Ravi in seperate rooms -- I've never met him, he's in another state, and the grad students said we'll never find out who the other person is or what they chose. Here's the deal: you press one button and you get $20 for yourself, or you press the other button and $30 goes to the other person and nothing to you. They told us Ravi was matched to me by an algorithm that picked whoever had the most similar personality quiz results to me.

  My brother says its obvious, take the 20, because Ravi's button has nothing to do with mine -- me being generous can't make him generous, and he can't thank me or pay me back or anything, so why would I light $20 on fire for a stranger. But I keep thinking: if he's basically me, then whatever I do is kind of a clue about what he'll do, and if we both hit give we both walk out with $30 instead of $20. Am I just being superstitious here, or is there a real reason to hit the give button? If there is, spell it out for me, because every time I try to explain it to my brother it comes out sounding like I think the universe will reward me for being nice, which I don't beleive. And does it change anything that neither of us ever finds out what the other one did?
