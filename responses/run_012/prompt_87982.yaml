      *   *Both:* Ignore the distinction between *pain* (sensory) and *suffering* (evaluative/emotional). Both ignore the role of *embodiment* and *homeostasis* (biological agents fight for survival in a way code doesn't). Both ignore *Integrated Information Theory* or *Global Workspace Theory* specifics.

