answer: |-
  Precommitment capture isn't manipulation because it surfaces existing reasons rather than bypassing reasoning altogether. You're framing this as a conflict between a past self and a present self, but in behavior design, we usually see it as a conflict between reflective values and transient impulses. When someone signs up for a fitness app, that's often a reflective decision based on long-term goals; when they try to cancel three weeks later, it's often because life got busy or they hit a friction point. Forcing them to type out their original reasons isn't conscripting a ghost; it's making their own stated values salient again so they can weigh them against the immediate urge to quit. We aren't betting on the past self winning; we're betting that the user wants their planning self to govern their impulsive self.

  I will concede that if the UI makes that text hard to read, or uses shaming language like "Are you sure you want to fail?" then we've crossed into manufacturing guilt rather than surfacing reasons. That would be bypassing reasoning by triggering an emotional avoidance response. But the mere act of recalling information the user themselves generated is facilitative, not coercive. It lowers the cognitive cost of remembering why they cared in the first place, which is a service when attention is scarce. If we didn't do this, the default would be that the loudest voice in the room—the immediate stress of the moment—drowns out the quieter voice of their long-term intentions.

  Confidence: 85%.
  Least sure: Whether we can reliably distinguish a legitimate change in values from a temporary failure of willpower in the moment.
