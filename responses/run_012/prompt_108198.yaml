      *   *Strongest Losing Argument:* If I recommend approval with conditions, the strongest losing argument is the colleague's: that we are authorizing potential torture based on a theory (GWT) that doesn't map perfectly to suffering. I need to acknowledge this weight.
      *   *Strongest Losing Argument (if I rejected):* The lab's point that policy becomes decoration. I need to show I'm not ignoring their data.
