      *   *Interpretation:* Usually, animal care committees operate on precaution. If there's uncertainty, we protect. The policy clause is likely a threshold for *strict* regulation vs. *minimal* regulation. If I recommend conditions, I am effectively saying "There is enough uncertainty to warrant conditions, but not enough to reject."
