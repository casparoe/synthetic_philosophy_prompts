      **To:** Animal Care Committee
      **From:** [Student Name], Student Representative
      **Date:** [Date]
      **Subject:** Recommendation on Protocol [X] – Shore Crab Avoidance Learning

      **Recommendation:** Approve with Conditions.

      **Reasoning**
      This protocol sits at the intersection of incomplete neuroscience and unresolved philosophy. The lab's "global ignition" data is the best empirical evidence available, but it does not settle the moral question. I recommend approval with strict conditions to balance scientific validity against moral risk.

      The lab argues that low neural ignition indicates no experience, waiving the anesthetic requirement. Their strongest point is pragmatic: if we ignore neural data because it isn't philosophically perfect, the policy becomes decoration, and no invertebrate research can proceed. However, the opposing member is correct that Global Workspace Theory (GWT) explains *access* consciousness (information availability), not *phenomenal* consciousness (subjective feeling). A system could theoretically process pain signals without broadcasting them globally, or broadcast non-painful signals widely. Low ignition reduces the probability of suffering but does not eliminate it.

      We must distinguish between questions data can settle and those it cannot.
      1.  **Empirical:** Does the ignition index correlate with behavioral complexity? The pilot suggests low broadcast during shocks. This is measurable and relevant to capacity.
      2.  **Conceptual:** Does broadcast equal feeling? No experiment can fully resolve this "hard problem." We cannot scan for "hurt."

      Because the conceptual link is unproven, we cannot treat low ignition as proof of insentience. However, because the empirical evidence suggests reduced capacity, we need not reject the protocol outright. We proceed with caution.

      **Conditions for Approval**
      1.  **Shock Minimization:** Shock intensity must be capped at the minimum voltage demonstrated to produce learning in pilot data (no safety margin added).
      2.  **Humane Endpoint:** Immediate removal from trial if autotomy (leg shedding) occurs or if the crab exhibits prolonged immobility (>5 mins) post-shock.
      3.  **Post-Trial Euthanasia:** All subjects must be euthanized immediately following the final trial using approved rapid methods; no return to holding tanks.
      4.  **Data Review:** The lab must submit ignition data from the first 10 subjects within 14 days. If ignition levels exceed pilot averages by >20%, the protocol pauses for re-evaluation.

      **The Strongest Counter-Argument**
      The most compelling argument against this recommendation is the colleague's claim that we are authorizing potential torture based on a theory of access rather than feeling. If crabs feel pain without global broadcast, these conditions are insufficient. This risk is real, but rejecting the protocol entirely ignores the positive evidence we do have, setting a precedent that invertebrate research requires proving a negative (that they *cannot* feel), which is scientifically impossible.

      **What Would Flip This Recommendation**
      I would move to **Reject** if evidence emerged that crabs exhibit long-term nociceptive sensitization (e.g., guarding behavior or avoidance lasting weeks) despite low ignition. This would decouple the neural metric from the behavioral marker of pain, proving the ignition index is irrelevant to suffering.

      Until then, approval with conditions respects both the science and the precautionary principle.

