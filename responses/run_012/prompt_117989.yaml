answer: |-
  # A Taxonomy of Marriage: Disentangling Verdicts from Principles

  You have noticed a phenomenon that often escapes introductory debates: two people can sign the same petition for marriage equality while holding mutually exclusive theories of what marriage *is*. Conversely, two people can agree on the definition of marriage but disagree on whether the state should enforce it. This taxonomy is designed to help you navigate that space. It is structured as a decision tree. Do not look at the leaf names until you have answered the questions. Use the test cases provided at each branch to determine which path matches your convictions.

  ## The Decision Tree

  **1. Does the institution of marriage have a moral essence independent of the participants' will, or is it defined solely by the terms the parties assign to it?**
  *   *Test Case:* Consider a **marriage contracted solely for a visa**. The couple signs the license, intends to live together, and fulfills all legal duties, but lacks romantic love or a intent for permanent union beyond the legal benefit.
      *   **If you say this is not a real marriage (even if legally valid):** The institution has an **Essential Purpose**. (Go to Question 2).
      *   **If you say this is a valid marriage provided the legal contract is honored:** Marriage has **Assigned Purposes**. (Go to Question 6).

  **2. What is the essential purpose of marriage?**
  *   *Test Case:* Consider **two long-lived friends or siblings** who are each other's primary caregivers, share finances, and commit to lifelong exclusivity, but lack a sexual relationship.
      *   **If you say this counts as marriage:** The purpose is **Care and Dependency Support**. (Go to Question 3).
      *   **If you say this does not count as marriage:** The purpose is either **Procreation/Family** or **Comprehensive Spousal Union**. (Go to Question 4).

  **3. Should the state legally recognize these care-based relationships as marriages?**
  *   **If Yes:** You land at the **Care-Dependency View**.
  *   **If No (the state should only recognize romantic unions):** You hold that the moral essence of care is distinct from the legal institution's scope. (Go to Question 7).

  **4. Is the core good of marriage the bearing and raising of children, or the comprehensive union of the spouses themselves?**
  *   *Test Case:* Consider a **couple who marry and decide never to have children** versus a **couple who want children and cannot have them**.
      *   **If you say childless marriages are defective or marginal, but infertile marriages are real:** The purpose is **Procreation and Family Life**. (Go to Question 5).
      *   **If you say childless marriages are fully real and equal to those with children:** The purpose is the **Comprehensive Union of the Spouses**. (Go to Question 7).

  **5. For procreation to be central, must the spouses be the biological source of the children, or need they only supply a rearing context?**
  *   *Test Case:* Consider a **same-sex couple raising adopted children** versus an **infertile opposite-sex couple**.
      *   **If you say the opposite-sex infertile couple is married in the same sense as the fertile one, but the same-sex couple is not:** The **Biological Source** is essential. (Go to Question 7).
      *   **If you say both are married because both provide a rearing context:** The **Rearing Context** is essential. (Go to Question 7).

  **6. (Assigned Purpose Branch) Should the state offer this legal contract only to romantic couples, or to any caring relationship?**
  *   **If only romantic couples:** You hold a **Restricted Contract View**. (Note: This is often unstable; see "Empty Nodes" below).
  *   **If to any caring relationship:** You land at the **Minimal-Marriage/Flexible-Contract View**.

  **7. Does the state's legal recognition of marriage necessarily track this moral essence?**
  *   *Test Case:* Consider **a couple who raise children together for decades and never marry**.
      *   **If you say the state is wrong not to privilege the married couple over the unmarried co-parents:** The State Interest **Tracks the Moral Essence**. (Go to Question 8).
      *   **If you say the state should not privilege the married couple based on this definition:** The State Interest **Decouples from the Moral Essence**. (Go to Question 9).

  **8. What is the primary state interest in tracking this essence?**
  *   **If Children:** You land at the **Child-Centered View** (if Rearing Context) or **Conjugal View** (if Biological Source).
  *   **If Spousal Welfare/Union:** You land at the **Revisionist View**.
  *   **If Civic Equality:** You land at the **Civic Status View**. (Note: This view often enters at Q2 as "Civic," but if reached here, it prioritizes status over ontology).

  **9. Should the state exit the business of recognizing marriage altogether, or simply recognize it without enforcing the moral definition?**
  *   **If Exit Altogether:** You land at the **Abolitionist View**.
  *   **If Recognize Without Enforcing Definition:** You land at the **Conjugal-But-No-State-Enforcement View** (or equivalent for other essences).

  ***

  ## The Leaves: Views and Their Awkward Commitments

  **The Conjugal View**
  *Path:* Essential Purpose → Procreation/Family → Biological Source → State Tracks Essence → Children Interest.
  *   **Awkward Commitment:** This view must maintain that an infertile opposite-sex couple is married in the same full sense as a fertile one, while a same-sex couple raising three adopted children is not married at all, despite identical rearing capacities.

  **The Revisionist View**
  *Path:* Essential Purpose → Comprehensive Union → State Tracks Essence → Spouse Interest.
  *   **Awkward Commitment:** This view struggles to explain why the state regulates marriage more heavily than other deep friendships, or why adultery is a legal ground for divorce if the core good is merely emotional commitment which may have faded.

  **The Child-Centered (Inclusive) View**
  *Path:* Essential Purpose → Procreation/Family → Rearing Context → State Tracks Essence → Children Interest.
  *   **Awkward Commitment:** This view implies that a same-sex couple with children has a stronger claim to marriage than an opposite-sex couple who voluntarily choose to be child-free, making the latter's marriage marginally defective.

  **The Minimal-Marriage/Flexible-Contract View**
  *Path:* Assigned Purpose → Any Caring Relationship.
  *   **Awkward Commitment:** This view must accept that two siblings or three polyamorous partners could marry, provided they sign the contract, potentially diluting the specific social signaling that "marriage" currently conveys to the wider culture.

  **The Conjugal-But-No-State-Enforcement View**
  *Path:* Essential Purpose → Procreation/Family → Biological Source → State Decouples → Recognize Without Enforcing.
  *   **Awkward Commitment:** This view requires the holder to believe that the state is licensing an institution whose moral definition the state is forbidden from upholding, effectively asking the state to lie about what it is regulating.

  **The Civic Status View**
  *Path:* Essential Purpose → Civic/Equality → State Tracks Essence → Equal Status Interest.
  *   **Awkward Commitment:** This view risks making marriage purely instrumental; if the state could grant equal citizenship and benefits through a different mechanism (e.g., universal basic income and civil unions), this view suggests the fight for "marriage" specifically would be unnecessary.

  **The Abolitionist View**
  *Path:* Essential Purpose → Any → State Exits Entirely.
  *   **Awkward Commitment:** This view accepts that removing state recognition will likely reduce the stability of households reliant on marital benefits, betting that long-term equality outweighs short-term disruption to vulnerable families.

  **The Care-Dependency View**
  *Path:* Essential Purpose → Care/Dependency → State Recognizes.
  *   **Awkward Commitment:** This view must grant the full legal package of marriage to caregiving siblings or friends, which may complicate inheritance laws and tax codes designed around the assumption of a single nuclear family unit per household.

  ***

  ## Diagnostics: Empty Nodes and Indistinguishable Leaves

  ### The Empty Node: The Restricted Contract View
  There is a logical space at the branch of **Assigned Purpose** where one claims marriage is purely a contract but insists it must remain restricted to romantic couples. This position is theoretically unstable. If marriage is merely a bundle of rights assigned by the parties, there is no principled reason to exclude **two long-lived friends** or **a three-person household** from signing the same bundle, unless one smuggles in an "Essential Purpose" (like romance) that one claimed was absent. Students who find themselves here usually need to check if they actually hold an Essential Purpose view (Revisionist) but describe it as contractual.

  ### Indistinguishable Leaves: Revisionist vs. Civic Status
  There is a significant overlap between the **Revisionist View** and the **Civic Status View**. Both typically support same-sex marriage and oppose the Conjugal View. They can only be separated by a specific question about *value*: "Is the injustice of exclusion primarily that it denies access to a unique human good (love/union), or that it creates a caste system of citizenship?"
  *   If the student says the loss of the *relationship good* is the tragedy, they are Revisionist.
  *   If the student says the loss of *equal standing* is the tragedy (even if the relationship good is accessible privately), they are Civic Status.
  In practice, many advocates hold both, but in a philosophy of law seminar, you must distinguish whether the argument rests on the *nature of the relationship* or the *behavior of the state*.

  ### The "Verbal" Disagreement
  This tree reveals that some disagreements are merely verbal, specifically regarding the word "marriage."
  *   **Scenario:** A Conjugal theorist and a Minimal-Contract theorist discuss a **same-sex couple**.
  *   **Conjugal Theorist:** "They cannot be married." (Meaning: They cannot instantiate the comprehensive bodily union ordered to procreation).
  *   **Minimal-Contract Theorist:** "They are married." (Meaning: They have signed the state contract).
  *   **Diagnosis:** They may actually agree on all the legal verdicts (e.g., "The state should issue them the license") but disagree on whether the word "marriage" applies to the metaphysical reality or the legal status. The tree forces you to separate the *ontology* (Q1) from the *legal verdict* (Q7). If two students land on different leaves but agree on every legal case outcome (visa, siblings, infertile couples), their disagreement is likely semantic: one is defining marriage as a *natural kind*, the other as a *legal artifact*.

  ### The "Trench Coat" Resolution
  Returning to your original argument: You and your friend likely landed on different leaves. Your friend is probably at the **Child-Centered (Inclusive)** leaf (Marriage is for kids, same-sex couples raise kids, therefore include them). You are likely at the **Revisionist** or **Civic Status** leaf (Marriage is for love/status, therefore include them). You agreed on the verdict (legal recognition) because the **State Interest** branch (Q7) allowed you to converge on law despite diverging on essence. This taxonomy allows you to acknowledge that convergence without pretending the underlying disagreement about the *point* of the institution has vanished.
