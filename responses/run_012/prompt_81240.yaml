          4.  Technical Nuance: Double-negation translation / extraction from classical proofs. Does this undercut the rule?
          5.  Meta-Request: Separate settled technical facts from ongoing philosophical debates. Don't present one camp as consensus.

  2.  **Initial Assessment & Tone:**

      *   **Tone:** Professional, precise, nuanced, respectful of both classical and constructive perspectives. Avoid preaching constructivism as "truth" or classical math as "wrong."
      *   **Key Distinction:** Separate *logic* (what you can prove) from *semantics* (what it means) from *engineering* (extraction).
      *   **The "Why":** The lab's rule is primarily engineering (extraction), but it rides on a constructive logic which has philosophical implications.

  3.  **Drafting Section 1: What does the practice commit you to? (Engineering vs. Philosophy)**

      *   *Engineering:* The Curry-Howard correspondence. Proofs are programs. `exists x, P x` is a sigma type `{x : T & P x}`. To instantiate this, you need a witness `x`. LEM (`P \/ ~P`) doesn't give a witness, it just says one side holds. If you use LEM to prove existence, you can't extract the `x`.
      *   *Philosophy:* Does the lab *believe* constructivism? Probably not necessarily. They might be "methodological constructivists."
      *   *The "Axioms" point:* User mentions non-computing axioms in the standard library. Usually, these are axioms of *proposition* (like proof irrelevance or functional extensionality) that don't affect data extraction, unlike LEM which affects control flow/data selection.
      *   *Conclusion:* It commits you to *computability* of witnesses, not necessarily to the philosophical claim that "unconstructed objects don't exist."

  4.  **Drafting Section 2: What breaks? (Mathematical Impact)**

      *   *Analysis:* Bolzano-Weierstrass (BW) is the classic example. Classically: Every bounded sequence has a convergent subsequence. Constructively: False (in the strong sense). You can't necessarily *find* the subsequence.
      *   *Reformulation:* You need to weaken the conclusion. Instead of "converges," use "Cauchy" or add moduli of convergence. Or work in computable analysis.
      *   *Intermediate Value Theorem (IVT):* Classically true. Constructively, you can't find the root exactly, only approximate it to arbitrary precision.
      *   *Do classical theorems remain "true"?* They are true in the *double-negation translation*. `~~(Classical Theorem)` is provable constructively. This means they aren't "false," just "not directly realizable."
      *   *Settled vs. Debated:* It is settled *which* theorems fail (BW, IVT, Hahn-Banach). It is debated whether the constructive versions are "good enough" replacements for physics/engineering.

  5.  **Drafting Section 3: Truth and Provability**

      *   *Constructive Truth:* Truth = Provability (BHK interpretation).
      *   *Classical Truth:* Truth = Correspondence to a model (Platonist).
