  **Note to Instructor**

  The recurring line "Is the dividing line found or made?" slides between the epistemological question of where a boundary falls in the valley and the ontological question of what the category means. The pantoum's strict repetition holds through the first three quatrains to mimic the expectation of logical closure. In the final quatrain, the form breaks at the last line, altering the opening statement from "until the edges touch" to "; the edges do not touch." This alteration argues that while poetic form promises a return to origins, the biological reality of the ring remains open and undefined. The word "species" appears only in the title to force the text to perform the classification work without the label. Thus, the poem leaves the tension between indispensability and ambiguity unresolved.
