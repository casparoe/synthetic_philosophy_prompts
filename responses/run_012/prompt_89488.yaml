  Cut **Step (5)**.

  Here is the crux, the reason it deceived you, and the bill for the repair.

  ### The Crux: Equivocation on "Impossible"
  Your friend's argument hinges on an equivocation between **psychological impossibility** and **normative incompatibility**. 

  Step (5) defines *no-gap* as a claim that the combination is *psychologically impossible* ("no single outlook can contain both"). This is the load-bearing wall of his dilemma. If *no-gap* means "you literally cannot think this," then self-deception (Step 6) refutes it. If *no-gap* means "you literally cannot think this," then Moore's Paradox (Step 2) seems to require it.

  But the standard explanation of Moore's Paradox does **not** require psychological impossibility. It requires **rational incoherence**. 

  To assert $p$ is to present oneself as believing $p$. To assert "I do not believe $p$" is to present oneself as not believing $p$. The absurdity is that the speaker is **committing** themselves to incompatible states, not that they necessarily **inhabit** them. This is why the absurdity survives insincerity (your friend's extra datum). A liar who says "It is raining but I don't believe it" is not reporting a psychological impossibility in his own mind (he knows he doesn't believe it); he is violating the **constitutive rules of assertion**. He is undertaking commitments that cancel each other out.

  By cutting (5), you reject the claim that the principle governing Moore's Paradox must be a law of psychology. You replace it with a law of **rationality** or **assertoric normativity**.

  ### Why It Looked Fine
  Step (5) relies on the **Transparency Intuition**. When you deliberate about whether to believe $p$, you look outward at the world (is $p$ true?), not inward at your mind. Because belief aims at truth, it feels as though believing $p$ and believing you don't believe $p$ are like trying to look at your own eyes without a mirror: the very act of checking seems to dissolve the state. 

  This makes *no-gap* feel like a structural feature of the mind (psychological impossibility) rather than a rule of the game (normative incompatibility). Your friend exploited this phenomenological feeling to smuggle a psychological claim into a normative discussion.

  ### The Bill: What You Pay
  To cut (5) and save both Moore's Paradox and self-deception, you must pay for three things:

  1.  **You lose Infallibility.** You must accept that the mind is opaque to itself. It is psychologically possible to believe $p$ and believe you don't believe $p$ simultaneously. This is exactly what self-deception *is*. You concede that we can be wrong about our own beliefs, not just about the world.
  2.  **You must downgrade Moore's Explanation.** You can no longer say the Moorean sentence is absurd because it reports an impossible state of affairs. You must say it is absurd because it is **self-defeating**. It violates the norm that assertion is for conveying what one takes to be true. The sentence pulls the ladder up after itself. This is a slightly more complex explanation than "it's psychologically impossible," but it is more robust.
  3.  **You must distinguish Avowal from Assertion.** In the self-deception cases (Step 6), the subject is not making a standard assertion governed by the usual norms of evidence. She is making an **avowal**—a speech act that expresses her self-conception or wish, which can diverge from her operative belief. You pay the price of having to treat "I am not afraid" (said by the phobic) differently from "It is raining" (said by the wet man).

  ### Why This Wins
  If you cut (5), the dilemma in (9) dissolves. 
  *   **Moore's Paradox remains explained:** The sentence is absurd because it violates the norms of rational assertion (Normative No-Gap), even if the mind can hold the beliefs (Psychological Gap).
  *   **Self-Deception remains possible:** The mind can hold the beliefs (Psychological Gap), which explains the behavior in (6), even though avowing them together would be irrational (Normative No-Gap).
  *   **The Extra Datum is satisfied:** The liar finds the sentence absurd not because his mind is breaking, but because his *speech act* is breaking. He is playing a game where the moves cancel out.

  Your friend forces a choice between a psychology that is too rigid (no self-deception) and a linguistics that is too weak (mere bad manners). Cutting (5) allows you to keep a messy psychology and a strict linguistics. That is the only stable position.
