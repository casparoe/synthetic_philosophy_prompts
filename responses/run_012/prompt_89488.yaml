      Rationale: The friend conflates the **normative constraint** required to explain Moore's Paradox with a **psychological law** required to rule out Self-Deception. The constraint needed for Moore is that one *ought not* hold these beliefs together (or that asserting them violates the aim of belief), not that one *cannot*. Self-deception shows one *can*. The absurdity of Moore remains because one *should not*.
      This handles the Extra Datum too: The liar violates the norm of assertion even if they don't hold the belief.

      *Wait, I need to make sure I address the "Price".*
