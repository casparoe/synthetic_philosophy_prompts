      3. In your written defence, you stated: "The child born is not worse off than he would have been, for otherwise he would not be. No harm was done to a specific person." The Bureau accepts this proposition entirely. The duty under the Act is not grounded in harm to the resulting child, but in the impersonal obligation to bring into existence the person with the best prospects. Your argument confirms that the choice was identity-determining. This precisely triggers the obligation. To argue that the child was not harmed is to concede that the selection created a person with lower welfare than might have existed. This strengthens the finding of non-compliance.

