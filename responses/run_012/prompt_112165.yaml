      5. You may appeal this finding within 28 days. Appeals are accepted only on grounds of clerical error in the PLQI calculation. The filing fee is 500 Credits, non-refundable. Please note that pursuant to recent amendments, all PLQI calculations are now automated and subject to triple-verification.

      6. Please be advised that effective 1 January 2025, the Bureau's remit expands to include natural conceptions where pre-implantation screening is medically viable. The evidential threshold for intervention will be lowered from a 3.0 point differential to 1.5 points.

      Yours sincerely,

      Dr. E. Vance
      Senior Adjudicator

