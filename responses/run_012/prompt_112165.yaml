      Dear Mr. and Mrs. Aris,

      1. This Notice of Non-Compliance concerns your selection of Embryo 7-Delta for implantation on 3 June 2024. Pursuant to the Welfare of Future Persons Act, reproducers must select the embryo with the highest Projected Life Quality Index (PLQI) among viable options. Embryo 3-Gamma held a PLQI of 88.4; Embryo 7-Delta held a PLQI of 84.1. Your submission cites the presence of a genetic marker for absolute pitch in 7-Delta as outweighing the differential. The Bureau acknowledges the cultural value of musical aptitude. However, the marker correlates with a 15% increase in depressive episodic traits. While aesthetic capacity is valuable, it does not supersede the statutory duty to maximize expected welfare where the differential exceeds 3.0 points.

