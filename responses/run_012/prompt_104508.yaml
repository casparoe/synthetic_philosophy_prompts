answer: |-
  This is an exceptionally sharp puzzle, and your intuition that the gap between Lemkin's sociological conception and the 1948 legal instrument is doing significant work is correct. In fact, many scholars in international law and political theory argue that this gap is not merely a historical artifact but the *engine* of the contestation you are observing.

  To untangle this, we need to complicate three premises in your framing: the nature of the Lemkin/Convention divergence, the specific legal threshold of the 1948 definition, and the precise nature of the "obligation to intervene."

  Here is an analysis of why the politics of naming remains so fraught, structured around the conceptual tensions you identified.

  ### 1. The Lemkin/Convention Gap: Nationhood vs. Biology
  You are right to suspect the 1948 Convention narrowed Lemkin's concept, but the *direction* of that narrowing is crucial.

  *   **Lemkin's Conception (1944):** In *Axis Rule in Occupied Europe*, Lemkin defined genocide as a "coordinated plan of different actions aiming at the destruction of essential foundations of the life of national groups." For Lemkin, this was a **sociological and institutional** concept. It included cultural destruction, economic dispossession, and the dismantling of political institutions. Mass killing was one technique among many (including forced assimilation, sterilization, and cultural erasure).
  *   **The 1948 Convention:** The drafting process (heavily influenced by Soviet, Western, and Colonial interests) excised "cultural genocide" and excluded political and social groups. The focus shifted from the destruction of *nationhood* to the physical/biological destruction of *persons* belonging to specific protected groups (national, ethnical, racial, religious).

  **Why this fuels contestation:**
  Because Lemkin's concept was about the destruction of a way of life, it could apply to settler-colonial contexts, forced assimilation (e.g., Indigenous residential schools), and political purges. The 1948 legal definition renders these ambiguous. When activists or scholars invoke "genocide" in these contexts (e.g., Palestine, Xinjiang, the Americas), they are often invoking the **Lemkinian/sociological** definition. States, however, retreat to the **1948/legal** definition. The contestation is often a clash between two different conceptual histories operating under the same signifier.

  ### 2. The *Dolus Specialis* Problem
  Even within the narrow 1948 definition, the category is uniquely difficult to apply compared to "war crimes" or "crimes against humanity."

  *   **The Intent Requirement:** Genocide requires *dolus specialis* (specific intent). It is not enough to prove that mass killing occurred; one must prove the intent was to destroy the group *in whole or in part*.
  *   **The Evidentiary Burden:** Intent is a mental state. In international courts (like the ICJ or ICTR), this is inferred from patterns of violence, speeches, or policy documents. This creates a high epistemic bar.

  **Why this fuels contestation:**
  This legal hurdle creates a "gray zone" of atrocity. States can engage in mass violence that looks like genocide but claim the intent was counter-insurgency or collateral damage. Because the legal threshold is so high, the **political label** often outpaces the **legal determination**. This creates a temporal gap: the moral demand for intervention arises *during* the violence, but the legal certification usually comes *after* (if ever). States exploit this gap to argue that without a court ruling, the "obligation" has not yet been triggered.

  ### 3. Refining the "Obligation to Intervene"
  Your framing suggests that legal recognition triggers an obligation to intervene. This is the most legally contentious point in your puzzle.

  *   **Article I of the Convention:** States undertake to "prevent and to punish."
  *   **ICJ Jurisprudence (Bosnia v. Serbia, 2007):** The ICJ clarified that the obligation to prevent is one of **conduct, not result**. A state is obligated to employ all means reasonably available to them to prevent genocide, but they are not strictly liable if genocide occurs anyway. Furthermore, the obligation is triggered when the state "knew, or should normally have known" of the risk.
  *   **Intervention vs. Prevention:** The Convention does not explicitly mandate military intervention. That norm emerged later with the "Responsibility to Protect" (R2P) in 2005, and even then, it is politically contested, not legally binding in the same way.

  **Why this fuels contestation:**
  Because the *mode* of prevention is undefined, states can claim they are meeting their obligations through diplomacy or sanctions while resisting military intervention. Therefore, the fight over the *label* is a proxy fight over the *mode of response*. If an atrocity is labeled "genocide," the moral pressure for military action increases. If it is labeled "ethnic cleansing" (a non-legal term) or "crimes against humanity," the menu of acceptable responses narrows. States resist the label not just to dodge the obligation, but to dodge the specific *kind* of costly intervention (military) that the label implies.

  ### 4. The Hierarchy of Atrocity (Normative Inflation)
  From a political theory perspective, "genocide" has become what scholars call the "crime of crimes." It sits at the apex of a normative hierarchy of suffering.

  *   **Moral Inflation:** Because genocide is viewed as the ultimate evil, there is immense political capital in applying the label to one's own victimization, and immense reputational cost in having it applied to one's own actions.
  *   **The "Never Again" Imperative:** The label carries a eschatological weight. To call something genocide is to invoke the Holocaust and the failure of the international order.

  **Why this fuels contestation:**
  This creates a **zero-sum rhetorical environment**. If every mass atrocity is genocide, the term loses its distinctive mobilizing power (conceptual inflation). If too few are, the regime loses legitimacy. States contest the naming because accepting the label admits a failure of the international system to uphold its foundational post-1945 promise. It is not just about legal liability; it is about the legitimacy of the liberal international order itself.

  ### 5. Synthesis: The Concept as a *Kampfbegriff*
  To bring this back to your field (conceptual history): "Genocide" functions as a *Kampfbegriff* (fighting concept).

  The contestation is not a bug; it is a feature of how the concept evolved.
  1.  **Lemkin** designed it to be broad to capture the Nazi project of destroying nationhood.
  2.  **States (1948)** narrowed it to protect sovereignty (excluding political groups and cultural destruction).
  3.  **Activists/Courts** have since tried to stretch it back toward Lemkin's vision without changing the text.

  The politics of naming are contested because the concept is **stretched between its moral ambition and its legal instrumentation.**

  *   **Is it state evasion?** Yes, states use the narrow legal definition to shield themselves from the broad moral obligation.
  *   **Is it the category itself?** Yes, the category requires proving a specific intent regarding a protected group, which is epistemically difficult during ongoing conflicts.

  **Conclusion for your work:**
  The gap you identified is the critical lever. The 1948 Convention codified a **criminal law** concept (focused on individual culpability and punishment) over Lemkin's **political/sociological** concept (focused on group survival and prevention).

  When you analyze the politics of naming, look for moments where actors are sliding between these two registers. When a state says, "This is not genocide because the courts haven't ruled," they are invoking the criminal law register. When activists say, "This is genocide because their culture is being erased," they are invoking the Lemkinian register. The friction between these two conceptual histories *is* the politics of naming.

  **Suggested Reading for your specific angle:**
  *   **A. Dirk Moses:** Specifically his work on the "Genocide Question" and the hierarchies of victimhood.
  *   **Reinhard Koselleck:** For the methodology of *Begriffsgeschichte* applied to political concepts.
  *   **William Schabas:** *Genocide in International Law* (for the strict legal drafting history).
  *   **Samuel Moyn:** *The Last Utopia* (for context on how human rights law interacted with sovereignty in this period).
  *   **ICJ Case: *The Application of the Convention on the Prevention and Punishment of the Crime of Genocide (Bosnia and Herzegovina v. Serbia and Montenegro)*, 2007.** (Essential for the "obligation to prevent" standard).

  Your puzzle is effectively asking how a legal term becomes a moral weapon. The answer lies in the fact that the law was never strong enough to contain the morality Lemkin poured into the word.
