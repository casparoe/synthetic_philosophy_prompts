      *   **Input:** Six numbered propositions (1-6) outlining their current beliefs.
      *   **Task:** Perform a *consistency check*.
          *   Identify tensions/conflicts (real vs. apparent).
          *   Rank severity of conflicts.
          *   For genuine tensions: What must give? What is the cost?
          *   Flag hidden premises needed to defuse fatal tensions.
          *   Identify the *single revision* that resolves the most tension and explain the trade-off.
      *   **Constraint:** Do *not* defend or rebut the positions. Do *not* treat all problems as equal. Rank them.

  2.  **Analyze the Propositions:**
      *   (1) *Ontological Claim:* National character (temperament of a nation) is incoherent/malformed. Nations don't have psyches.
      *   (2) *Cultural Claim:* Culture is real, transmitted, causal. It shapes behavior/perception durably.
      *   (3) *Epistemic/Pragmatic Claim:* Population-level statistical claims are legitimate/rational to act on (base rates). Ignoring them is self-sabotage.
      *   (4) *Ethical Claim:* It is wrong to treat an *individual* differently based on nationality, even if base rates are accurate. Face-to-face inference is impermissible.
      *   (5) *Semantic/Logical Claim:* (3) and (4) don't collide because "nation X" (distribution) $\neq$ "person X" (individual trait). Different levels of predication.
      *   (6) *Moral/Political Claim:* Criticize people for collective *actions* (institutions/policies), never for collective *being* (character).

  3.  **Identify Tensions (Brainstorming & Pairwise Comparison):**

      *   *(1) vs (2):* (1) says national character is incoherent. (2) says culture is real and causal. *Tension:* Low. "Character" implies inherent temperament; "Culture" implies learned software. They can coexist if defined distinctly.
      *   *(1) vs (6):* (1) says nations don't have temperament. (6) says don't criticize what they *are*. *Tension:* Low. They align.
      *   *(2) vs (3):* (2) says culture leaves durable traces. (3) says statistical claims are legitimate. *Tension:* Low. (2) provides the mechanism for (3).
      *   *(3) vs (4):* **High Tension.** (3) says it's rational to act on base rates. (4) says it's wrong to treat a person differently based on them. This is the classic "Statistical Discrimination vs. Moral Individualism" problem.
      *   *(3) vs (5):* (5) tries to resolve (3) vs (4). *Tension:* Is the semantic distinction sufficient? If I act on the probability (3), am I not treating the person differently (4)?
      *   *(4) vs (6):* (4) says don't treat person differently. (6) says criticize collective *actions*. *Tension:* Low/Medium. How do you criticize collective actions without impacting individuals?
      *   *(2) vs (4):* If culture is *causally efficacious* (2), meaning it predicts behavior, and I ignore that prediction in face-to-face dealings (4), am I ignoring reality? (4) admits this but calls it a moral wrong. *Tension:* Medium (Epistemic vs. Ethical).

  4.  **Evaluate Severity and Logic:**

      *   **The Core Conflict:** The friction between (3) and (4) is the engine of this whole system. (3) validates the user's morning job (writing briefings/acting on stats). (4) validates the user's afternoon frustration (being stereotyped).
      *   **The Bridge:** (5) attempts to bridge (3) and (4) via semantics (distribution vs. individual).
      *   **The Weak Point:** Is (5) strong enough? If I know Group A has a 80% rate of Behavior Z, and I meet Person A from Group A, and I *don't* adjust my expectation/behavior, I am violating (3) (self-sabotage). If I *do* adjust, I am violating (4) (treating them differently). (5) says the *meaning* is different, but the *action* is the same. This is the critical tension.
      *   **Secondary Conflict:** (1) vs (2). (1) denies national temperament. (2) affirms cultural causality. This is mostly definitional, but if "culture" becomes too deterministic, it looks like "character."
      *   **Tertiary Conflict:** (6) relies on the distinction between "doing" and "being." If culture (2) shapes "being," is "doing" separable?

  5.  **Drafting the Consistency Check (Iterative Process):**

      *   *Ranking:*
          1.  (3) vs (4) mediated by (5). This is the practical/ethical crunch.
          2.  (2) vs (1). The ontological boundary.
          3.  (6) vs (4). The scope of criticism.

      *   *Analyzing (3)/(4)/(5):*
          *   Tension: High.
          *   Why: (3) says act on stats. (4) says don't act on stats regarding individuals.
          *   (5)'s role: It claims no collision because of semantic levels.
          *   Critique: Semantic distinction doesn't solve pragmatic collision. If I act on the distribution, I am necessarily treating the individual as a sample of that distribution.
          *   What must give? Either (3) (limit rationality) or (4) (allow exceptions) or (5) needs a hidden premise (e.g., "Acting on base rates is permissible *unless* it overrides individual evidence").
          *   Cost: If (3) gives, you lose pragmatic utility. If (4) gives, you lose moral protection.

      *   *Analyzing (1) vs (2):*
          *   Tension: Low/Medium.
          *   Why: "Character" vs "Culture."
          *   Risk: If culture is "durable traces" that are "causally efficacious," does it functionally become character?
          *   Resolution: Keep the distinction between *inherent* (1) and *learned* (2).

      *   *Analyzing (6):*
          *   Tension: Medium with (2).
          *   Why: If culture causes behavior, is behavior distinct from "what they are"?
          *   Resolution: Institutions vs. Psychology.

  6.  **Identifying the "Single Revision":**
      *   The biggest friction is the "Acting on Base Rates" paradox.
      *   Current (3): "Reasoning... to a probability... is not automatically a fallacy; refusing... is self-sabotage."
      *   Current (4): "Wrong to treat a person differently... even when base rates are accurate."
      *   The conflict is in the *application*.
      *   Revision Idea: Modify (3) to distinguish between *strategic planning* (briefings) and *interpersonal interaction*. Or modify (5) to include a "defeasibility" clause.
