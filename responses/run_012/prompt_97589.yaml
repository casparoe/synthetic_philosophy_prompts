prompt: |-
  I'm defending a paper at our work-in-progress seminar next Friday and I need a Q&A prep sheet. The thesis I'm defending: Pascal's mugging isn't a reductio of expected-value maximization at all — it's a reductio of the assumption that you can assign a single real-valued probability to a claim with infinite stakes. My fix is a two-tier rule. Screen offers by probability first; infinite or enormous value only gets to speak once the probability clears a floor, and the floor is supposed to be set by something decision-relevant rather than by taste. I've been calling it value-after-probability, which may or may not survive contact with the room.

  The room is the problem. It's mostly formal epistemologists and decision theorists — the imprecise-probability, infinite-ethics, fanaticism corner of the department — plus two philosophers of religion who think the mugging is a genuinely live argument for theism and who will definately hear my "floor" as me giving myself permission to set the bar wherever it's convenient, and one longtermist who'll read the whole thing as a hit job on caring about the far future.

  So: give me the objections I'll actually get from these people, in their vocabulary not mine, ordered by how much damage they'd do. For each one, a two-minute reply and a note on where the reply is soft. I don't need the stock objections every decision theorist already knows — I need the ones this specific room will reach for, including the ones that come from inside my own camp. Tell me what I should concede up front, what I should hold no matter what, and the one reply that has to land or the paper's dead. And finish with the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **Task:** Create a Q&A prep sheet for a work-in-progress seminar defense.
      *   **Thesis:** Pascal's Mugging isn't a problem for Expected Value (EV) maximization *per se*, but for assigning single real-valued probabilities to infinite/enormous stakes claims.
      *   **Proposed Fix:** A "two-tier rule" (Value-After-Probability). Screen by probability first. Infinite/enormous value only counts if probability clears a "floor." This floor must be decision-relevant, not arbitrary.
      *   **Audience:**
          *   Formal Epistemologists/Decision Theorists (Imprecise probability, infinite ethics, fanaticism specialists).
          *   Two Philosophers of Religion (See Mugging as an argument for Theism; will suspect the "floor" is ad hoc/convenient).
          *   One Longtermist (Will see this as an attack on caring about the far future/existential risk).
      *   **Tone:** Professional, sharp, anticipating specific technical objections, acknowledging vulnerabilities.
      *   **Requirements:** Objections ordered by damage potential, 2-minute replies, notes on soft spots, concessions vs. holds, the "killer" reply, and the "hope nobody asks" question.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Core Claim:* Probabilities for infinite stakes shouldn't be standard reals (or at least, shouldn't be treated as such without a threshold).
      *   *Mechanism:* A probability floor.
      *   *Vulnerability 1 (Arbitrariness):* Where does the floor come from? If it's not arbitrary, what is it? (The "Ad Hoc" charge).
      *   *Vulnerability 2 (Fanaticism):* Does this actually stop fanaticism, or just move it? (Beckstead-Thomas style objections).
      *   *Vulnerability 3 (Epistemic Humility):* If I can't assign a probability to infinite claims, can I assign one to finite claims that *might* be infinite? (Contagion problem).
      *   *Vulnerability 4 (Longtermism):* Does this zero out existential risk work? (Probability of success is low, stakes are huge).
      *   *Vulnerability 5 (Theism):* Does this unfairly bias against religious hypotheses? (Pascal's Wagon/Wager context).

  3.  **Drafting the Objections (Tailored to the Room):**

      *   *Objection 1 (The Formalists/Imprecise Prob):* "You're smuggling in imprecise probabilities but calling it a floor. If you admit standard reals fail here, why not just use sets of probabilities or interval-valued credences? Your 'floor' looks like a lower bound on an interval, but you're treating it as a hard cutoff. That breaks continuity and dominance."
          *   *Damage:* High. Attacks the formal machinery.
          *   *Reply:* Distinguish between *uncertainty about the probability* (imprecise credence) and *structural ineligibility* (category error).
          *   *Soft Spot:* Is the distinction metaphysically robust or just semantic?

      *   *Objection 2 (The Longtermist):* "This is a 'skeptic's veto.' Existential risk mitigation has low probability and high value. Your floor kills x-risk work. You're saving EV from mugging by killing the only thing that made EV interesting for the future."
          *   *Damage:* High (Political/Practical).
          *   *Reply:* The floor is decision-relevant (evidence-based), not tiny. X-risk has *some* empirical traction; Mugging has none.
          *   *Soft Spot:* Defining "empirical traction" without being vague.

      *   *Objection 3 (Philosophers of Religion):* "This is epistemic discrimination. You're rigging the rules to exclude Theism because the conclusion is unpalatable. If the evidence for God is comparable to the Mugger's claim, why is one screened out? This is motivated reasoning dressed as decision theory."
          *   *Damage:* Medium-High (Ad Hominem vibe).
          *   *Reply:* It's not about the *content* (God vs. Mugger) but the *structure of the offer*. The Mugger demands action *now* based on *no* prior causal model. Theism is a background hypothesis, not a transactional offer.
          *   *Soft Spot:* Pascal's Wager *is* transactional. Need to distinguish Wager from Mugging carefully.

      *   *Objection 4 (Internal/Formalist - The "Contagion" Problem):* "If I can't assign a real value to $P(\text{Infinite})$, how do I handle finite actions that have a non-zero chance of leading to infinite value? Your floor creates a discontinuity. Small changes in evidence shouldn't toggle infinite value on/off."
          *   *Damage:* Very High. Technical death blow.
          *   *Reply:* Accept the discontinuity. It's a category boundary, like a phase transition.
          *   *Soft Spot:* Continuity is a core axiom in most DT. Giving it up is costly.

      *   *Objection 5 (The "Decision-Relevant" Floor):* "You say the floor is 'decision-relevant.' Define it. If it's based on reference classes, you get the Reference Class Problem. If it's based on causal models, you beg the question against acausal decision theories (which love muggings)."
          *   *Damage:* High. Undermines the "fix."
          *   *Reply:* Ground it in *predictive track record* of the claim type, not the claim itself.
          *   *Soft Spot:* Still feels a bit hand-wavy.

  4.  **Selecting and Ordering:**
      *   *Top Damage:* The Contagion/Discontinuity objection (Formalists).
      *   *Second:* The Longtermist/X-Risk veto (Practical/Political).
      *   *Third:* The Ad Hoc/Arbitrariness charge (Religion + General).
      *   *Fourth:* Imprecise Probability alternative (Formalists).

  5.  **Developing the Strategy (Concessions/Holds):**
      *   *Concede:* The floor creates discontinuity. (Own it as a feature, not a bug).
      *   *Hold:* EV maximization is fine; the input (probability) is the bug.
      *   *Hold:* The floor is not arbitrary; it's evidence-based.

  6.  **The "One Reply That Must Land":**
      *   It needs to address the *arbitrariness* while satisfying the *formalists*. The distinction between *epistemic possibility* and *decision-theoretic eligibility*.

  7.  **The "Hope Nobody Asks":**
      *   Something that exposes the lack of a formal definition of the "floor." E.g., "Give me the formula for the floor."

  8.  **Refining the Tone:**
      *   Use the jargon: *credence functions, dominance, continuity axioms, fanaticism, epistemic discounting, reference classes, acausal trade.*
      *   Keep replies tight (2 mins spoken is ~250-300 words).

  9.  **Review against Constraints:**
      *   Did I address the specific audience members? Yes (Religion, Longtermist, Formalists).
      *   Is it ordered by damage? Yes.
      *   Are there soft spots noted? Yes.
      *   Is the "Value-After-Probability" name challenged? I should mention that in the intro or advice. (Decided to add a note on the name).

  10. **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't confuse Pascal's Wager with Pascal's Mugging. The Religion folks will conflate them to trap me. I need to be precise.
      *   *Correction:* Ensure the Longtermist objection isn't just dismissed. Acknowledge the tension.
      *   *Correction:* The "Decision-Relevant" phrase is weak. I need to suggest a stronger grounding, like "Causal/Statistical Anchor."

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a high-stakes room. You are proposing a structural constraint on credence functions to solve a decision-theoretic paradox, which means you are inviting attacks on both your epistemology (how you assign probabilities) and your axiology (how you value outcomes). The "Value-After-Probability" label is weak—it sounds like a heuristic, not a rule. Be prepared to drop it if they press for formalism.

  Here is your Q&A prep sheet, ordered by the likelihood of derailing the project.

  ### 1. The Discontinuity Objection (The Formalists)
  **The Objection:** "You're introducing a hard discontinuity in the decision function. If my credence that an action yields infinite value is $10^{-100}$, it's screened out. If it's $10^{-100} + \epsilon$, it dominates all finite considerations. This violates the Continuity Axiom (Archimedean property). You aren't solving the mugging; you're just breaking Expected Utility Theory (EUT) to avoid the conclusion. Why shouldn't we just use imprecise probabilities or infinite hyperreals instead of a hard cutoff?"

  **The 2-Minute Reply:**
  "I concede the discontinuity. But I argue it's a feature, not a bug. We accept discontinuities elsewhere in rationality—for example, the distinction between *epistemic possibility* and *live hypothesis*. My claim is that claims of infinite stake with negligible causal grounding aren't just 'low probability'; they are *category errors* in decision space. Imprecise probabilities still allow the upper bound of the interval to drive fanaticism if the value is truly infinite. Hyperreals preserve the mugging mathematically. My floor isn't an arbitrary number; it's a structural eligibility criterion. We shouldn't maximize expected value over hypotheses that lack a causal or statistical anchor, regardless of how we represent the number."

  **Where the Reply is Soft:**
  Formalists love continuity. Admitting you violate a core axiom of Savage/Bolker-Jeffrey frameworks makes your system look like a patch, not a theory. If they press on *why* the anchor creates a discontinuity rather than a smooth decay, you may struggle to formalize it without just restating the rule.

  ### 2. The "Skeptic's Veto" (The Longtermist)
  **The Objection:** "This looks like a motivated veto on longtermism. Existential risk mitigation has low probability and enormous value. If your 'floor' is high enough to block the Mugger, doesn't it also block working on AI alignment or pandemic preparedness? You're saving EV maximization from absurdity by killing the only practical application that made it worth saving. Are you just rationalizing indifference to the far future?"

  **The 2-Minute Reply:**
  "That conflates *structural absurdity* with *empirical uncertainty*. The Pascal Mugger offers a causal mechanism with zero prior probability and no track record. Existential risk work relies on physical models, historical data, and causal chains we can observe and test. My 'floor' is not a specific number like $10^{-50}$; it's a requirement for *evidential traction*. The Mugger has none. X-risk has some. If my rule blocks x-risk, it's because we've failed to establish the causal link, not because the stakes are high. I'm not protecting indifference; I'm protecting the signal-to-noise ratio of decision theory."

  **Where the Reply is Soft:**
  You haven't defined "evidential traction." If the Longtermist argues that our models for AI alignment are as speculative as the Mugger's claim (just with more jargon), you have no metric to distinguish them other than intuition.

  ### 3. The "Epistemic Discrimination" Charge (The Philosophers of Religion)
  **The Objection:** "This is Pascal's Wager in disguise. You are rigging the probability floor to exclude Theism because you dislike the conclusion. If a religious experience or historical claim raises the probability of Infinite Value above your floor, do you accept it? Or will you move the floor? This isn't decision theory; it's epistemic gatekeeping to protect secular norms."

  **The 2-Minute Reply:**
  "It's not about the *content* (God vs. Mugger); it's about the *transaction structure*. Pascal's Mugging is a demand for immediate action based on a threat/offer with no causal leverage. Pascal's Wager is a bet on a background hypothesis. My rule screens *transactional claims* to infinite value that lack causal history. If a theological claim is presented as a background hypothesis with historical/philosophical evidence, it enters the calculation like any other hypothesis. If it's presented as 'Give me your wallet or infinity suffers,' it gets screened. I am not screening God; I am screening the Mugging structure."

  **Where the Reply is Soft:**
  Pascal's original Wager *is* transactional. If they argue that religious commitment *is* the "payment" demanded by the hypothesis, the distinction blurs. You risk looking like you're defining "Mugging" as "Any religious claim I want to ignore."

  ### 4. The "Contagion" Problem (Internal/Imprecise Prob Camp)
  **The Objection:** "If I can't assign a real-valued probability to an infinite claim, how do I handle finite actions that have a non-zero chance of *leading* to an infinite claim? If I buy a lottery ticket, and there's a tiny chance the lottery organizer is a Mugger, does your floor screen out the ticket? Your probability restriction contaminates ordinary finite decisions."

  **The 2-Minute Reply:**
  "This is the contamination objection. My response is that the floor applies to the *link* between action and outcome, not the outcome itself. In ordinary decisions, the causal link is empirical (ticket -> prize). In mugging, the link is asserted *ex nihilo*. We treat the probability of the causal mechanism, not just the state of the world. If the mechanism is 'magic,' it's screened. If the mechanism is 'physics,' it's not. The contagion stops at the causal boundary."

  **Where the Reply is Soft:**
  In a quantum world or under acausal decision theories (like FDT), the "causal boundary" is exactly what's disputed. If they press on acausal trade, your "causal mechanism" defense evaporates.

  ---

  ### Strategic Guidance

  **What to Concede Up Front:**
  *   **Concede the name:** "Value-After-Probability" sounds like a heuristic. Tell them you are looking for a better formal label (e.g., "Eligibility-Constrained EV"). It shows humility and disarms the "this is vague" attack.
  *   **Concede the discontinuity:** Don't try to smooth it out. Argue that decision spaces *should* have phase transitions (like eligibility in sports or legal standing).

  **What to Hold No Matter What:**
  *   **The Input is the Bug:** Do not let them drag you into defending EV maximization itself. Keep repeating: "EV is fine. Feeding it infinities with no causal weight is the error."
  *   **The Floor is Not Arbitrary:** Do not let them pin you on a specific number. The floor is a *function of evidential support*, not a constant.

  **The One Reply That Has to Land:**
  You must successfully distinguish **Epistemic Possibility** from **Decision-Theoretic Eligibility**.
  *   *Phrasing:* "I can acknowledge a claim is *possibly* true (epistemically) without granting it *standing* in a maximization calculation (decision-theoretically). We do this in law (standing to sue) and science (burden of proof). I am proposing a burden of proof for infinite stakes."
  *   *Why:* If this fails, you are just a skeptic. If this lands, you are proposing a new norm for rational action.

  ### The Question You Hope Nobody Asks
  **"Can you write down the function for the floor?"**

  If they ask: *"Give me the formula. Is the floor $10^{-x}$? Is it a function of complexity? Is it context-dependent?"*

  **Why this kills you:**
  If you give a number, you're arbitrary. If you say "it depends," you're vague. If you say "I don't know yet," the paper looks unfinished (which it is, but you don't want to highlight it).

  **The Escape:**
  "My paper argues for the *existence* and *necessity* of the constraint, not the precise calibration. Just as we know we need a burden of proof in law before we know the exact standard for every case. I am establishing the structural requirement; calibration is empirical work for specific domains." (Then pivot immediately to the "Burden of Proof" analogy).
