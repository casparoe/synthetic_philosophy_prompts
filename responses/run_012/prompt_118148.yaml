answer: |-
  This is a precise dissection of the "Corporate Person" analogy that underpins much of populist and totalitarian theory (from Rousseau's General Will to Schmitt's Decisionism). The analogy works by borrowing the *phenomenological certainty* of individual agency to legitimize *political authority*.

  Here is the audit of the analogy, structured as requested.

  ### 1. The Correspondence Table

  To see where the load is being carried, we must map the anatomical metaphor to the political claim.

  | Anatomical/psychological Role | Populist/Political Equivalent | Function in the Argument |
  | :--- | :--- | :--- |
  | **The Single Mind** | The General Will / The National Spirit | The source of legitimacy; the thing that cannot be wrong about itself. |
  | **The Intention** | The Mandate / The Program | The specific policy direction derived from the "Mind." |
  | **The Body** | The Demos / The Population | The material substrate that executes the will; provides the mass. |
  | **The Nervous System** | The Party / The Movement | Transmits signals from Head to Body and feedback (theoretically) up. |
  | **The Head (Decision)** | The Leader | The locus of articulation; the only part that can speak for the whole. |
  | **The Unity Principle** | The Enemy / The Border | Defines where the "One" ends and the "Other" begins; creates the boundary of the self. |

  ### 2. Structural Break Points

  The analogy fails not because people are diverse (that's a superficial objection), but because the *mechanics of unity* in a mind are categorically different from the *mechanics of unity* in a polity.

  **A. Introspection vs. Interpretation (The Epistemic Gap)**
  *   **Mind:** I know my will via introspection. It is immediate and private. If I say I want water, I am the authority on that desire.
  *   **People:** No one has introspective access to "The People." The Leader must *interpret* signals (votes, cheers, polls).
  *   **The Break:** The analogy smuggles the *certainty* of introspection into the *ambiguity* of interpretation. When a Leader says, "I know what the People want," they are claiming a phenomenological access they cannot structurally possess. This turns political disagreement into a medical diagnosis: if the Body (voters) resists the Head (Leader), the Body is sick (misinformed/corrupt), not the Head.

  **B. Synchronic Unity vs. Aggregation Paradoxes**
  *   **Mind:** A human mind can hold conflicting desires in tension without collapsing (e.g., "I want to smoke" vs. "I want health"). We resolve this internally over time.
  *   **People:** Political aggregation (voting) forces a binary output from diverse inputs.
  *   **The Break:** As you noted, groups suffer from the **Discursive Dilemma**. A population can vote Yes for "Lower Taxes," Yes for "More Services," but No for "Deficit Spending." A mind would recognize the inconsistency immediately. A voting system produces a logical contradiction. The analogy assumes a pre-political unity that the aggregation machinery actively destroys. The "One Will" is not discovered; it is imposed by suppressing the inconsistent data.

  **C. The "Head" Autonomy Problem**
  *   **Mind:** The brain is dependent on the body. If you sever the nerves, the mind cannot will the hand to move. The body also sends pain signals that constrain the mind.
  *   **People:** In the populist analogy, the Head claims to *constitute* the Body. The Leader often bypasses the "nerves" (parties, unions, local gov) to speak directly to the "cells" (individuals).
  *   **The Break:** In a body, the head cannot survive without the liver. In the analogy, the Leader claims the "Real People" exist only insofar as they align with him. This reverses the dependency: the Whole becomes dependent on the Part that claims to represent it.

  ### 3. Temporal and Responsibility Issues

  **A. Diachronic Identity (Time)**
  *   **Mind:** Personal identity persists through memory. I am responsible for my past self because I remember being him.
  *   **People:** A polity persists through records and institutions.
  *   **The Break:** Populism often relies on a "Reset." If the current institutions (courts, press) are "corrupt," they are not part of the "Real Body." This severs the temporal chain. The "Will of the People" becomes a permanent present tense. It cannot be bound by past treaties (constitutions) because the "Past People" were duped, and it does not owe the "Future People" consistency because they are not yet part of the Body.
  *   **Result:** Change of course isn't learning; it's purification. This generates the "betrayal" dynamic you identified. If the People are One, changing your mind isn't growth; it's schizophrenia. Therefore, dissent must be excised.

  **B. Diffused Responsibility**
  *   **Mind:** If my hand hits someone, *I* am liable.
  *   **People:** If the "People's Will" destroys a minority, *no one* is liable.
  *   **The Break:** The analogy creates a **moral vacuum**. By making the People the author, it makes every individual a mere cell. Cells are not morally responsible for the organism's actions. This allows individuals to commit acts they would never own personally ("I was just following the Will") while preventing anyone from being held accountable ("You can't punish the People").

  ### 4. The Epistemic Defect: Self-Certification

  You asked: *Defect of the target, or of the analogy?*

  It is a **category error in the analogy** that masks a **fatal defect in the target.**

  *   **The Analogy's Lie:** It treats "The Will of the People" as a *fact* (like my headache) rather than a *construct* (like a verdict).
  *   **The Target's Defect:** Politics requires a procedure to adjudicate conflicting claims.
  *   **The Interaction:** Because a person's will is self-certifying (I don't need a vote to know I'm hungry), the analogy suggests the Leader doesn't need a procedure to know the People's will.
  *   **Verdict:** The claim is self-certifying because the analogy removes the requirement for external verification. In a body, pain verifies error (touch fire, feel pain). In the Populist Body, "pain" (protest, economic downturn) is reinterpreted as "growing pains" or "sabotage" by enemies. There is no feedback loop that can falsify the Leader's claim. **The analogy carries the conclusion entirely.** Without the "One Body" metaphor, the Leader is just a contractor with a majority vote, subject to renewal and constraint. The "bypass" only makes sense if the institutions are "partial" organs and the Leader is the "whole."

  ### 5. Aggregation and Intensity

  *   **Votes vs. Desires:** You are correct. Votes are binary; desires are weighted. A market handles intensity (I pay more for what I want more). A vote does not.
  *   **The Analogy's Assumption:** It assumes that the "General Will" is the *intersection* of all desires, not the *sum*. (Rousseau: "Take away the pluses and minuses... the General Will remains.")
  *   **The Reality:** Aggregation often produces the *tyranny of the indifferent majority* over the intense minority. The analogy hides this by claiming the Majority *is* the Whole. If 51% wills X, the analogy dictates that the "Body" wills X. The 49% are not a competing will; they are numb limbs.

  ### 6. Does the Conclusion Survive?

  **No.** The conclusion ("The Leader may bypass institutions because the Whole speaks through him") is not a logical deduction from political facts; it is a poetic assertion derived entirely from the Organic Analogy.

  If you remove the analogy:
  1.  The People are many, not one.
  2.  The Will is aggregated, not intuited.
  3.  Institutions are the memory and nervous system of the polity, not obstacles to it.
  4.  Therefore, bypassing them is not "acting as the Whole," it is "lobotomizing the Body."

  The analogy *is* the argument. Without the metaphor of the Single Mind, populism collapses into simple majoritarianism, which usually admits the need for rules to protect the minority (to ensure the game continues).

  ### 7. The Market-Price Alternative

  You suggested swapping the **Organic Analogy** (One Body) for a **Market Analogy** (Emergent Price).

  *   **How it works:** No single will exists. "Value" (or policy direction) is an emergent signal generated by millions of transactions/votes. It is "wiser" than any participant because it aggregates local knowledge (Hayek).
  *   **Why it might be better:**
      *   It accepts diversity (different bids).
      *   It accepts intensity (higher bids).
      *   It doesn't require a "Head" to interpret the signal; the signal *is* the price/result.
      *   It avoids the "Betrayal" trap: Prices change, and no one calls it apostasy.
  *   **What it must get right to be less misleading:**
      1.  **Normativity:** Prices describe *preference*, not *justice*. A market price can be morally abhorrent (e.g., price of a child). A political system needs a theory of rights that acts as a "price floor" or "ceiling" that cannot be breached by aggregation. The Market Analogy fails here unless it is bounded by a Constitutional framework.
      2.  **Power Asymmetry:** In a market, some actors have enough capital to set the price (monopoly). In a polity, this is oligarchy. The analogy fails if it ignores that "votes" (currency) are not distributed equally in terms of influence.
      3.  **Public Goods:** Markets under-produce things that are non-excludable (defense, clean air). The analogy fails if it suggests the "invisible hand" can produce collective sacrifice.

  **Verdict on the Swap:**
  The Market Analogy is structurally more honest about *epistemology* (no one knows the whole picture) but structurally weaker on *ontology* (it cannot generate a "We"). It explains **coordination** better than **will**.

  If you use the Market Analogy, you cannot claim "The People Spoke." You can only claim "The Count Showed." This kills the populist move dead, because "The Count" can be recounted, checked, and constrained. It replaces the **Sacred Body** with the **Ledger**. The Leader becomes a CEO, not a Head. A CEO can be fired by the board (institutions) without it being a civil war.

  **Summary:** The "Single Will" analogy bears no weight. It is a category error that uses the privacy of individual consciousness to legitimize the publicity of political power. It generates the very pathologies (betrayal, irresponsibility, infallibility) it claims to solve. The Market Analogy is less romantic but more robust, provided it is supplemented by a non-market theory of rights to prevent the "price" from consuming the participants.
