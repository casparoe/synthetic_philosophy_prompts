answer: |-
  **Credence: 35%** that escalation is better explained by sunk-cost-style bias than by incentive structure alone.

  I side with your friend on the *mechanism* of escalation, but with you on the *cause* of entry. Once the game is underway, the math forces the escalation; the "bias" is failing to see the trap before stepping in.

  ### The Breakdown

  *   **P(escalation is fully implied by plain expected-utility play | already entered): 0.85**
      *   *One-liner:* Conditional on being the second-highest bidder, minimizing loss is mathematically identical to escalating, making it locally rational.
  *   **P(actual humans escalate by that same mechanism rather than a separate one): 0.80**
      *   *One-liner:* Lab data shows bidding curves track the loss-avoidance incentive almost perfectly until exhaustion.
  *   **P(there's an independent sunk-cost / ego mechanism riding on top): 0.40**
      *   *One-liner:* Ego drives bids slightly higher than the math requires, but doesn't create the escalation from zero.
  *   **P(perfectly rational agents escalate without pre-commitment): 0.05**
      *   *One-liner:* Common knowledge of rationality implies backward induction, killing the game before the first bid.

  **How they combine:** The structure creates a "loss tunnel" that is inescapable once entered (85%), which humans follow because they frame decisions myopically (80%). Pure bias adds noise (40%), but without the structural penalty, the tunnel doesn't exist (5%). The 35% overall credence reflects that bias is required to *enter*, but structure dictates the *escalation*.

  ### The Variant: Loser Gets Money Back

  **Prediction:** Escalation above \$1.00 effectively vanishes.
  **Credence on "escalation still happens": 10%**

  **Reasoning:**
  In the standard Dollar Auction, the second-highest bid is a *contingent liability*. In your variant, it is not. If I bid \$0.90 and you bid \$1.00, I simply withdraw and get my \$0.90 back. My net loss is \$0. There is no financial pressure to bid \$1.10 to "save" my \$0.90. The auction collapses into a standard English auction where bidding stops at the asset's value (\$1.00).

  **If escalation *does* still happen:**
  It points decisively to **ego/competitive utility** (winning for the sake of winning) rather than sunk-cost bias. Sunk-cost bias requires a loss to avoid; if losing is free, there is nothing to "throw good money after." Persistent escalation here would mean players derive negative utility from *losing* the status contest, independent of money.

  ### Sensitivity & Evidence

  **Most sensitive sub-number:** `P(escalation is fully implied by plain expected-utility play | already entered)` (Currently 0.85).

  **Evidence that would move it:**
  The outcome of your variant.
  *   **If escalation vanishes:** It confirms the structural penalty was the primary driver (Friend's view). My credence in your "bias" theory drops to ~15%.
  *   **If escalation persists:** It confirms an internal psychological drive independent of financial loss (Your view). My credence in your "bias" theory jumps to ~80%.

  **The Tiebreaker:**
  The variant removes the *teeth* of the sunk cost (the actual loss). If the behavior stops, the teeth were the cause. My money is on the behavior stopping. Your friend is right about the escalation mechanics; you are right that the whole game is a trap for the irrational. But the *climb* itself is gravity, not just clumsiness.
