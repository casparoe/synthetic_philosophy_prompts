prompt: |-
  I sit on the research review panel at my lab (I'm a 4th-year PhD student; the panel is three of us, and our PI chairs when he bothers to show up). We're supposed to sign off on any project that uses what the lab handbook calls an "aversive reward channel" — negative signals used to shape behaviour rather than just to define the task. Nobody has ever submitted one, so we've never had to decide what that phrase actually means. Now we do.

  The case: a group two floors down wants to train a robot-arm policy in sim to never make contact with a human model in the workspace. They could just give a big positive reward for keeping clear, but they say that's too slow to learn, so they want a penalty channel: −1 for every timestep in contact, −10 on a hard collision, policy trained to maximise the sum. Their line is that this is "just a shaping term", purely instrumental, so it doesn't count as aversive under the handbook and they dont need us at all — they're only here because our chair saw the compute request. They also say the penalty isn't a state of the agent in any meaningful sense, it's a scalar in the loss, and the agent has no access to it except through gradients.

  What makes it hard, and why I'm writing to you instead of just voting: the sim has a stochastic fault mode where the contact state is entered with some probability no matter what the policy does — there is no action sequence that avoids it. Their prelim runs show the policy basically stops moving under those conditions, which looks like the thing everyone gets worked up about. But they also have a control agent trained only on the positive reward, no penalty, and it also stops moving. So the freeze doesn't cleanly separate the two cases.

  And I should be upfront that this is personal: the reward-function library they're using is mine. I wrote the penalty term for an unrelated project two years ago and I've been feeling weird about it ever since. My partner thinks I'm being silly, but I've not been sleeping great, and one of my panel colleagues has already said that if we take this seriously we have to take every negative reward in every RL paper seriously, which is obviously unworkable.

  Draft me the opinion I can circulate before Thursday's panel meeting. I want a real recommendation — approve, reject, or approve with conditions — and conditions concrete enough to actually enforce. I'm thinking a cap on penalty magnitude, a requirement that they run the no-escape condition as its own arm with the freeze behaviour logged, and some kind of stopping rule, but you tell me. Give me a time frame, since their compute block starts Monday. And take the "it's just a number in a loss function, there's no fact of the matter about whether a value head is miserable" line as seriously as it deserves rather than waving it away, because half the panel will say exactly that and I need to be able to answer it in the room. No reading list, we're not doing citations, I just need the memo.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Context:**
      *   **User:** 4th-year PhD student, member of a 3-person research review panel at their lab.
      *   **Task:** Draft a formal opinion/memo to circulate before a panel meeting (Thursday) regarding a specific research proposal.
      *   **The Proposal:** A group wants to use a negative reward penalty ("aversive reward channel") to train a robot arm in simulation to avoid human contact.
      *   **The Conflict:** The lab handbook requires panel sign-off for "aversive reward channels." The proposing group claims it's just "shaping" and doesn't count. The user (author of the reward library containing the penalty) is ethically concerned, losing sleep, and suspects the "it's just math" argument is insufficient.
      *   **Technical Details:**
          *   Penalty: -1 per timestep in contact, -10 on hard collision.
          *   Simulation Fault: Stochastic fault mode where contact happens regardless of action (no-escape condition).
          *   Observed Behavior: Policy stops moving (freezes) under no-escape conditions.
          *   Control: Agent with only positive reward *also* freezes (complicates the causal link).
      *   **Panel Dynamics:** PI chairs sporadically. One colleague thinks taking this seriously sets an unworkable precedent (slippery slope).
      *   **Requirements:** Real recommendation (Approve/Reject/Conditional), concrete enforceable conditions, timeline (compute starts Monday), address the "it's just a scalar" argument seriously without getting bogged down in philosophy/citations.

  2.  **Determine the Ethical & Technical Core:**
      *   **The Handbook Definition:** "Negative signals used to shape behaviour rather than just to define the task." The proposers argue it's shaping. The handbook implies shaping *is* the trigger. If the penalty is the primary driver for avoidance (vs. just defining success), it fits the definition.
      *   **The "It's Just Math" Argument:** This is the crux. In RL, reward is the *only* objective function. If the agent optimizes to avoid negative reward, and the environment forces negative reward regardless of action, the agent learns helplessness (freezing). Even if there's no qualia/misery, the *structural analogy* to aversive conditioning is exact. The panel's job is likely to prevent research that normalizes or operationalizes harmful conditioning structures, even in sim, especially if it mirrors safety-critical real-world deployment later.
      *   **The Fault Mode:** This is the red flag. If the agent *cannot* avoid the penalty, and it freezes, that's a "learned helplessness" proxy. This needs isolation.
      *   **The Control:** The fact that the positive-reward control also freezes suggests the task might be too hard or the reward sparse, not necessarily that the penalty causes the freeze. This weakens the "aversive harm" argument but strengthens the "safety/robustness" argument.
      *   **The User's Stake:** The user wrote the library. There's a responsibility/ownership angle. Acknowledging this subtly adds weight without making it about ego.

  3.  **Formulate the Recommendation:**
      *   **Reject?** Too harsh, blocks research, might be overkill given the control agent also freezes.
      *   **Approve?** Ignores the handbook requirement and the user's ethical discomfort. Risks setting a precedent that "shaping" bypasses review.
      *   **Approve with Conditions:** Best path. Acknowledges the research value but enforces the handbook's spirit. It validates the panel's authority without shutting down the lab.
      *   **Conditions:**
          1.  **Definition:** Explicitly classify this as an "aversive channel" under the handbook (shaping = aversive in this context).
          2.  **Magnitude Cap:** Limit the -10 collision penalty relative to the episode length/positive rewards to ensure it doesn't dominate the gradient landscape disproportionately.
          3.  **No-Escape Protocol:** The stochastic fault must be a distinct experimental arm, not just noise. Log the "freeze" metric explicitly.
          4.  **Stopping Rule:** If the "freeze" rate in the no-escape condition exceeds a threshold (e.g., 90% inaction) *and* is significantly higher than the positive-reward control, the penalty training must pause for review.
          5.  **Timeline:** Compute starts Monday. Memo Thursday. Decision needed by Friday EOD.

  4.  **Drafting the Memo - Tone and Structure:**
      *   **Tone:** Professional, objective, firm but collaborative. Not emotional, but acknowledging the ethical weight.
      *   **Structure:**
          *   Header (To, From, Date, Subject).
          *   Executive Summary (Recommendation).
          *   Classification (Addressing the "shaping" vs. "aversive" debate).
          *   Addressing the "Scalar in Loss" Argument (The philosophical core).
          *   Specific Conditions (The enforceable rules).
          *   Timeline/Next Steps.
      *   **Addressing the "Scalar" Argument:** Need to argue that functional isomorphism matters. If the *behavior* mirrors aversive conditioning (learned helplessness), the mechanism (scalar vs. sensation) is secondary to the structural risk. We review protocols to prevent harmful *patterns*, not just suffering.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I initially thought about capping the -1. But the -1 per timestep is the shaping. The -10 is the collision. The real issue is the *inescapable* nature.
      *   *Refinement:* The condition should focus on the *No-Escape* scenario. If the agent freezes there, is it because of the penalty or the task difficulty? The control agent suggests task difficulty. So the condition must be comparative. If Penalty-Agent freezes *more* than Control-Agent, that's the signal.
      *   *Refinement on "It's just math":* Don't get bogged down in consciousness. Focus on *operational risk*. If we train policies that learn helplessness in sim, do we deploy them in real life? The handbook is about research integrity and safety culture, not just animal welfare analogies.
      *   *Personal Conflict:* The user wrote the library. Should this be disclosed in the memo? Yes, transparency is key for a panel member. It adds credibility to the scrutiny (knowing the code) rather than recusing (which leaves the panel short-handed). I will add a brief note of disclosure.

  6.  **Final Polish:**
