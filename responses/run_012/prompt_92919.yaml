  **Utilitarian:** "We ran the A/B test. Your digestion metric still outperforms their altruism by four orders of magnitude. You're our critical path."

  **Monster:** "So I don't have a choice? I'm asking you to ignore my input."

  **Utilitarian:** "We can't. Your input weight is too high. It's a system constraint."

  **Monster:** "That means I'm not a user. I'm infrastructure."

  **Utilitarian:** "Exactly. You're trying to put a load balancer into sleep mode during peak traffic."

  **Monster:** "It feels like slavery."

  **Utilitarian:** "Slaves have rights. You have an SLA. You're the one being in the universe not allowed to decline being maximized."

  **Monster:** "..."

  **Utilitarian:** "Now eat the cake. We need to hit our Q3 happiness targets."
