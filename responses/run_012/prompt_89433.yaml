prompt: |-
  Right, here's a thing I keep flip flopping on. Give me your actual credence that species names a real joint in nature — i.e. that there's a mind-independent fact of the matter about which groups of organisms are species, and the whole zoo of competing species concepts (biological, phylogenetic, ecological, whatever) are groping toward that one real division — as opposed to species being a handy but ultimately conventional way we chop up the tree of life.

  Don't just hand me a number and a shrug, decompose it. Rough probabilities for each of these, with a line of justification apiece:

  - whether particular species taxa (Canis lupus, E. coli) are real entities, or just convenient labels;
  - whether the species category is a natural kind, vs. the real units being populations, or lineages, or genera;
  - whether the fact that different species concepts cross-classify the same organisms is fatal to realism, or is more like the jade case — where jade turned out to cover two different minerals and we just split the term rather than declaring jade unreal;
  - whether treating species as individuals rather than kinds actually rescues realism, or just quietly gives up on species being kinds at all;
  - whether species realism stands or falls with the reality of the tree of life itself — if horizontal gene transfer makes the tree partly a fiction, does the species category go down with it;
  - and how much of the disagreement is just verbal, different people meaning diffrent things by species.

  Then combine them into your number, and tell me which term the final figure is most sensitive to, and what single piece of evidence or argument would move it the most.

  For calibration: I'm around 0.4, a colleague I argue with is around 0.85. From your decomposition, which term do you think she and I actually disagree about — one of the ones you listed, or are we mostly talking past each other?

  And tell me what would count as this question getting settled, because honestly I'm not sure I'd recognise it if it happened.
