prompt: |-
  ok cog sci reading group question. the color phi thing: you flash a dot in one place, then a different coloured dot somewhere else a fraction of a second later, and people report a single dot moving across the gap and changing colour halfway along the path — so they seem to be experiencing the colour change before the second dot was even on the screen. doesn't that basically prove that conscious experience is a delayed replay that the brain stitches together after the fact, i.e. we're never actually seeing the present? and if the brain is waiting until it has the second dot's colour before it plays me the movie, then there should be a definate lag between the world and my experience of it — how big is that lag, how would you measure it, and why don't reaction times look shifted by the same amount?
