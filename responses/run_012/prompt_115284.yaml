  ### Clause Mapping: How the Principle Handles Your Ledger

  1.  **The Origin Constraint (Motivated by *Born in 1850*):**
      *   **Clause:** You must originate from *this* zygote, *these* parents, at *this* time.
      *   **Verdict:** Explains why "Born in 1850" is **False**. A man born then fails the Origin Constraint; he is a counterpart, not you.
      *   **Verdict:** Explains why "Failed to exist" is **True**. A world where the zygote is never formed is a world where the conditions for your existence are not met.

  2.  **The Sortal Constraint (Motivated by *Poached Egg*):**
      *   **Clause:** You must be a human being.
      *   **Verdict:** Explains why "Poached egg" is **False**. No egg satisfies the Sortal Constraint for a person.

