  The principle that best systematizes your ledger is a hybrid view I will call **Qualified Origin Essentialism with Non-Branching Identity**. It combines a Kripkean view of personal identity (origins are essential) with a specific constraint on fission (identity cannot branch), while allowing a metaphysical distinction between persons and artifacts.

  Here is the principle stated precisely, followed by the mapping of your cases, the ruling on new cases, and the honest admission of which verdict must be sacrificed.

  ### The Principle: Qualified Origin Essentialism with Non-Branching Identity

  **Definition:**
  For any person $x$ and possible world $w$, $x$ exists in $w$ if and only if:
  1.  **Sortal Constraint:** The entity in $w$ is a human being.
  2.  **Origin Constraint:** The entity in $w$ originates from the specific zygote, parents, and temporal moment that $x$ actually originated from.
  3.  **Non-Branching Constraint:** The history of the entity in $w$ does not undergo symmetric fission (branching) relative to $x$'s actual history.
  4.  **Artifact Exception:** Clauses 2 and 3 apply strictly to persons; artifacts retain identity through changes in material origin provided functional/structural continuity is maintained.

  **Modal Operator:**
  To say "$x$ could have been $F$" is true if and only if there exists a possible world $w$ where $x$ exists (satisfying 1–3) and $x$ is $F$ in $w$.

