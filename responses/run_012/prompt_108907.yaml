answer: |-
  Here is the specification for a "Prior from Ignorance," broken down by requirements, conflicts, and the specific impossibility results that cause the wall you are hitting.

  ### Part 1: The Requirements Spec

  To count as a usable account of ignorance, a prior construction method must satisfy the following criteria.

  **1. Reparameterization Invariance**
  *   **The Rule:** If you transform the parameter $\theta$ to $\phi = f(\theta)$, the probability assigned to any physical event must remain unchanged. The density must transform via the Jacobian.
  *   **Forcing Case:** The Rectangle Problem. Width $w \in [0, 1]$ vs. Area $A = w(1-w)$. A uniform prior on $w$ implies a non-uniform prior on $A$. If "ignorance" means "no physical preference," the physical probability of the area being $< 0.1$ cannot depend on whether you measure the machine's setting in width or area.
  *   **Status:** **Non-Negotiable** for physical modeling. If you violate this, your inference depends on the coordinate system, not the data.

  **2. Coherence (Dutch Book Consistency)**
  *   **The Rule:** Your probabilities must obey the axioms of probability such that no combination of bets based on them guarantees a loss.
  *   **Forcing Case:** Decision theory. If you output a probability to drive a decision (e.g., risk assessment), incoherent probabilities allow a adversary to construct a set of bets where you lose money regardless of the outcome.
  *   **Status:** **Non-Negotiable** for decision-making. If you are only doing estimation, you might relax this, but for defense, you need coherence.

  **3. Properness (Normalizability)**
  *   **The Rule:** The prior density must integrate to 1 over the parameter space.
  *   **Forcing Case:** Direct probability statements. To say "there is a 95% chance the parameter is in this interval" *before* seeing data, the integral must be finite.
  *   **Status:** **House Preference.** Many objective methods yield improper priors (integrating to $\infty$). These are usable *if* the posterior is proper, but they cannot be interpreted as degrees of belief directly.

  **4. Marginalization Consistency**
  *   **The Rule:** If you derive a joint prior for $(\theta, \psi)$ and then marginalize out $\psi$, it should match the prior you would have derived for $\theta$ alone.
  *   **Forcing Case:** Modularity. If you build a model in parts, the inference on one part shouldn't change just because you added an irrelevant nuisance parameter elsewhere in the hierarchy.
  *   **Status:** **Non-Negotiable** for hierarchical modeling. Violating this leads to paradoxes where adding a variable changes the inference on existing variables without new data.

  **5. Information State Sensitivity**
  *   **The Rule:** The method must distinguish between "I know nothing" (vacuous) and "I know the outcomes are symmetric" (structural).
  *   **Forcing Case:** The Coin Flip. "I know nothing about this coin" vs. "I know the coin is physically symmetric." The first might allow bias; the second forces $P(Heads)=0.5$. A method that assigns 0.5 in both cases collapses the distinction.
  *   **Status:** **Non-Negotiable** for epistemic honesty.

  **6. Countable Additivity**
  *   **The Rule:** The probability of a countable union of disjoint events is the sum of their probabilities.
  *   **Forcing Case:** Infinite sequences. Standard measure theory requires this for limit theorems.
  *   **Status:** **House Preference (Mathematical Convention).** Finite additivity is sufficient for most finite data problems. Some invariance arguments *require* dropping countable additivity (e.g., uniform priors on integers).

  ---

  ### Part 2: The Impossibility Results

  You asked which of these cannot be had together. There are three hard conflicts.

  **Conflict A: Reparameterization Invariance vs. The "Uniform on Parameter" Heuristic**
  *   **The Conflict:** You cannot maintain a uniform density across all parameterizations.
  *   **Why:** Probability density is not a scalar; it is a density. $p(\theta) d\theta = p(\phi) d\phi$. If $p(\theta) = c$, then $p(\phi) = c |d\theta/d\phi|$. Unless the transformation is linear (affine), the new density is not uniform.
  *   **Result:** The rule "use a uniform prior when ignorant" is logically ill-defined. It violates Requirement 1 immediately. This is the specific wall you hit with the rectangle.

  **Conflict B: Reparameterization Invariance vs. Properness (on Unbounded Spaces)**
  *   **The Conflict:** On infinite domains (like a scale parameter $\sigma \in (0, \infty)$), the only prior that satisfies invariance under scaling ($\sigma \to k\sigma$) is $p(\sigma) \propto 1/\sigma$.
  *   **Why:** This is the Haar measure for the scale group. However, $\int_0^\infty (1/\sigma) d\sigma$ diverges.
  *   **Result:** You cannot have a prior that is both invariant under scaling and integrates to 1. You must choose: either you accept an **Improper Prior** (violate Properness) or you accept **Boundary Dependence** (violate Invariance by picking an arbitrary max value).

  **Conflict C: Maximum Entropy vs. Reparameterization Invariance**
  *   **The Conflict:** Maximum Entropy (MaxEnt) selects the distribution that maximizes $-\int p(x) \log p(x) dx$.
  *   **Why:** This functional is *not* invariant under coordinate change. If you maximize entropy for width, transform to area, and calculate the entropy of the resulting area distribution, it will not be the maximum entropy distribution for area. MaxEnt requires a fixed "reference measure" (a baseline metric) to be defined.
  *   **Result:** MaxEnt does not solve the ignorance problem unless you already know the correct metric on the parameter space. If you knew the metric, you wouldn't need MaxEnt to tell you you're ignorant.

  ---

  ### Part 3: The "Killer" Requirement

  You bet that **Reparameterization Invariance** is the requirement that kills the plain uniform prior.

  **You are correct.**

  Reparameterization Invariance is the single requirement that rules out the most "attractive" (i.e., simple/intuitive) options.
  1.  It kills the **Uniform Prior** (because uniforms don't transform to uniforms).
  2.  It kills **Maximum Entropy** (unless a specific invariant measure is supplied externally).
  3.  It forces **Improper Priors** on unbounded spaces (killing Properness).

  If you drop Reparameterization Invariance, you can keep Uniforms, Properness, and MaxEnt. But your results become arbitrary artifacts of how you wrote down the equations. If you keep Reparameterization Invariance, you must abandon the idea that a prior can be a simple, proper, uniform probability distribution representing "zero information."

  ### Part 4: What Actually Delivers (The Workaround)

  Since no method satisfies all requirements for "total ignorance" (because "total ignorance" is often ill-posed), here is what a defensible spec looks like in practice:

  1.  **Accept Improper Priors:** Acknowledge that "ignorance" on an unbounded scale is not a probability distribution. It is a limiting measure. Defend this by proving the *posterior* is proper (integrates to 1) given your data.
  2.  **Use Reference Measures:** Do not say "Uniform." Say "Uniform with respect to the Lebesgue measure" or "Uniform with respect to the Fisher Information metric."
      *   *The Fix:* The Fisher Information metric transforms exactly opposite to the density Jacobian. A prior proportional to the square root of the determinant of the Fisher Information (the Jeffreys prior) satisfies Reparameterization Invariance.
  3.  **Predictive Matching:** Instead of defending the prior on the parameter, defend the prior on the *data*.
      *   *The Spec:* "I choose the prior such that the prior predictive distribution for the data is flat/vague." This bypasses the parameterization issue because the data space is usually observable and fixed.
  4.  **Sensitivity Analysis:** Since you cannot satisfy "Invariance" and "Properness" simultaneously on infinite domains, do not commit to one prior. Commit to a *class* of priors (e.g., all proper priors that approximate the invariant measure within a range). If your decision changes across the class, you do not have enough data to overcome the prior.

  **Summary for your defense:**
  When a coworker challenges you on parameterization, do not argue that your uniform prior is "true." Argue that you are using a **Reference Prior** derived from the geometry of the likelihood (Fisher Information), which is the unique solution that satisfies **Reparameterization Invariance**. Acknowledge that this renders the prior **Improper**, but demonstrate that the **Posterior is Proper** and **Coherent**. This is the only consistent path through the wall you hit.
