prompt: |-
  Two old freinds are arguing about a case from a bioethics seminar. A woman in her mid-sixties, recently diagnosed with early dementia, signs an advance directive refusing antibiotics, feeding tubes, and hospitalization once she's severely impaired. But she adds a handwritten clause at the bottom: if some future version of her wants any of that, fine, she can have it, but only if she can give a reason the earlier her would have accepted. Two years later she's severely impaired and says she wants the antibiotics so she can make it to her grandaughters graduation. One friend says the clause decides it — the earlier self set the terms, and the reason on offer doesn't pass her own test. The other says the clause is a rigged game, because the later self is being asked to justify herself in terms she no longer has, and a test you can only fail isn't consent, it's just the earlier self keeping her hand on the wheel. Write the dialogue between them. Both should be sharp and neither should be a strawman, they should respond to each other's actual moves rather than restating their own views, and at some point one of them should raise the case where the later self just shrugs and says she doesn't care about reasons, she wants it.
reasoning: |-
  Here's a thinking process that leads to the dialogue:

  1.  **Analyze the Request:**
      *   **Characters:** Two old friends arguing about a bioethics case.
      *   **Topic:** An advance directive case involving a woman with early dementia.
      *   **The Directive:** Refuses treatment (antibiotics, tubes, hospitalization) when severely impaired.
      *   **The Clause:** Handwritten addendum: Treatment allowed *if* the future self wants it *and* can give a reason the earlier self would have accepted.
      *   **The Situation:** Two years later, severely impaired. She wants antibiotics to see her granddaughter's graduation.
      *   **The Conflict:**
          *   Friend A (Autonomy/Precedent): The earlier self set the terms. The reason (graduation) might not pass the test (is it "worthy" enough? Is it coherent?).
          *   Friend B (Current Interest/Identity): The clause is rigged. The impaired self lacks the cognitive capacity to meet the earlier self's rational standards. It's tyranny of the past self.
      *   **Requirements:** Sharp dialogue, no strawmen, responsive argumentation, specific inclusion of a scenario where the later self says "I don't care about reasons, I just want it."

  2.  **Character Development:**
      *   *Elias:* Likely the one arguing for the authority of the advance directive (Friend A). Values consistency, precedent, and the integrity of the "life plan."
      *   *Mara:* Likely the one arguing for the current self's interests (Friend B). Values experiential welfare, the reality of the present moment, and the problem of psychological continuity.
      *   *Tone:* Intellectual but heated, long-standing friendship implies familiarity and shorthand, but also deep disagreement. Coffee shop or late-night kitchen setting.

  3.  **Key Arguments to Weave In:**
      *   *Elias:* The "Ulysses Pact." She knew this was coming. The clause was a mercy, not a trap. If we ignore the directive, we treat her like a child.
      *   *Mara:* The "Rigged Game." Dementia changes the metric of value. Asking a demented person to argue like a rational agent is impossible. It's not consent; it's veto power.
      *   *The Specific Twist:* The granddaughter's graduation reason. Is that "acceptable" to the earlier self?
      *   *The Required Scenario:* What if she just says "I want it" without a reason?

  4.  **Drafting - Section by Section:**

