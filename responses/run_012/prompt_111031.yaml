      *   *Round 3: The "Rigged Game" vs. "Life Plan".* Mara brings up the cognitive gap. Elias brings up the slippery slope of ignoring prior wishes.
      *   *The Required Beat:* Mara introduces the hypothetical: What if she can't give a reason? What if she just says "I want to live"?
      *   *Closing:* No clear resolution (it's bioethics), but a shift in understanding or a respectful stalemate.

  5.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Check:* Are they strawmanning? *Correction:* Make sure Elias acknowledges the tragedy of dementia, and Mara acknowledges the importance of prior autonomy.
      *   *Check:* Is the "graduation" reason addressed? *Correction:* Elias needs to challenge whether "seeing a graduation" is a value the *earlier* self held. Maybe the earlier self thought dignity was more important than prolonging life for events.
      *   *Check:* Is the "I don't care about reasons" point included? *Correction:* Ensure Mara brings this up sharply.
      *   *Tone Check:* Keep it snappy. Use interruptions, rhetorical questions, and shared history references.

  6.  **Writing the Script (Mental or Scratchpad):**
