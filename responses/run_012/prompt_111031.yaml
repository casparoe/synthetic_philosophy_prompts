answer: |-
  **Setting:** *A kitchen table, 11:30 PM. Empty wine bottles and a scattered deck of cards nobody is playing with. Elias is leaning forward, elbows on the table. Mara is leaning back, swirling the last inch of Merlot.*

  **Elias:** It's not a trap, Mara. It's a bridge. She knew the ship was going down. She just wanted to make sure that if the lifeboats came out, it was for a destination she recognized.

  **Mara:** A bridge implies two sides can meet. This? This is a drawbridge that only lowers for the dead. The woman signing that paper is a lawyer, a rational agent. The woman in the bed two years later is scared and confused. You're asking the confused woman to pass the bar exam to get a glass of water.

  **Elias:** I'm asking her to meet the condition *she* set. That's the point of the handwritten clause. It wasn't a total ban. It was a negotiation with her future self. "If you want to stay, you have to tell me why."

  **Mara:** And the "why" has to be acceptable to *who*? The woman who isn't there anymore. The earlier self valued dignity, coherence, a clean exit. The later self values... breathing. Seeing her granddaughter. You're saying the earlier self's definition of "worthy" overrides the later self's definition of "alive."

  **Elias:** I'm saying the earlier self's definition of *her life* is the only one that counts as a narrative. If we let the dementia dictate the terms, we aren't treating her as a person who persists through time. We're treating her as a series of momentary impulses. She wanted to avoid a prolonged decline unless there was a *reason*. Is "graduation" a reason?

  **Mara:** To her, right now, it's the whole world.

  **Elias:** But would the woman who signed the paper care? She wrote "early dementia." She knew the milestones would keep coming. Graduation, then a wedding, then a great-grandchild. It's a moving horizon. If she accepted treatment for every horizon, she'd be bedbound for five years on a feeding tube. Is that what she signed up for?

  **Mara:** So the clause is a sham. It's a veto disguised as an option. "You can have treatment, provided you argue like the person you used to be." But she *can't* argue like that. That's the disease.

  **Elias:** Then the answer is no. And that's tragic, but it's consistent. If you override the directive because the current self *feels* strongly, you've effectively voided the advance directive. You've said the past self has no authority.

  **Mara:** I'm saying the past self has no right to demand rationality from a broken brain. But let's push your "consistency." Let's change the script. Two years later, she's in the bed. Pneumonia. You ask her for the reason. She looks at you and says, "I don't have a reason. I don't care about your logic. I just don't want to die."

  **Elias:** Then the condition isn't met.

  **Mara:** See, that's where you lose me. That's the rigged game. She's expressing a preference. A raw, human preference. "I want to live." And you're saying, "Sorry, the contract requires a syllogism."

  **Elias:** The contract requires *her* authorization. The clause was the authorization key. If she can't turn the key, the door stays shut. If you open it anyway because she's shouting, you're not respecting her autonomy. You're patronizing her. You're saying, "You don't know what you signed, so we'll ignore it."

  **Mara:** I'm saying the "she" who signed it and the "she" in the bed have diverged interests. Dworkin called it critical interests versus experiential interests. The earlier self cared about the story of the life. The later self cares about the experience of the moment. When the story is over, the experience is all that's left. Why should the ghost of the author starve the character?

  **Elias:** Because the character is the author's creation! If we ignore the directive, we aren't saving *her*. We're saving a biological organism that happens to share her DNA. The woman who wanted to see the graduation... is that the same woman who wrote the clause? Psychologically? No.

  **Mara:** Legally? Yes. Morally? Debatable. But here's the rub, Elias. You keep saying the reason has to be one the *earlier* self would accept. Who decides that? You? Me? The hospital ethics board? We're guessing what a ghost would think.

  **Elias:** We're interpreting the text. Just like a will.

  **Mara:** A will distributes assets after you're gone. This distributes suffering while you're still here. And you're interpreting ambiguity against the living. "Would the earlier self accept 'graduation'?" Maybe she would have thought that was silly. Maybe she would have thought it was beautiful. We don't know. So we default to death.

  **Elias:** We default to the last competent instruction. That's the bedrock. If you chip away at that because the current preference is "sharp and loud," then advance directives are worthless. Anyone can change their mind when the fever hits.

  **Mara:** But the clause *invited* the change of mind! That's why it's there. It wasn't a hard refusal. It was a challenge. "Make me care." And when the impaired self says, "I care about this graduation," you're saying, "Not enough. Not rational enough."

  **Elias:** I'm saying the metric is broken. If she says, "I don't care about reasons, I just want it," she is explicitly rejecting the terms of the clause. She is opting out of the negotiation. And if she opts out of the negotiation, the original refusal stands.

  **Mara:** Or... it means the negotiation was impossible from the start. You asked a bird to negotiate with a fish. The clause looks like mercy, but it's just the earlier self keeping her hand on the wheel, even after she's gotten out of the car.

  **Elias:** No. It's the earlier self saying, "I know you'll want to stay. I need to know *why* before I let you." It was a test of value. If the value isn't there—if it's just instinctual clinging—then the directive holds.

  **Mara:** Instinctual clinging *is* the value when you're dying! That's what life is. It's not a thesis statement.

  **Elias:** (Pauses, picks up a card, puts it down) But if you grant her the antibiotics... she survives the pneumonia. Then what? Six months later, hip fracture. Does she get to negotiate for surgery? Does she have to give a reason the earlier self would accept then, too?

  **Mara:** Maybe.

  **Elias:** Then she's trapped in the system she tried to opt out of. She signed the paper to avoid exactly this. The slow churn.

  **Mara:** She signed the paper to avoid a life without *meaning*. But meaning changes. To the woman in the bed, the graduation *is* the meaning. If you deny her the antibiotics, you aren't protecting her dignity. You're sacrificing her on the altar of her own past consistency.

  **Elias:** And if I give them to her, I'm sacrificing her integrity on the altar of her present comfort.

  **Mara:** (Sighs, puts the glass down) So we're back to it. Who owns the woman in the bed?

  **Elias:** She owns herself. She just told us how, two years ago.

  **Mara:** She told us how she wanted to die. She didn't tell us she wanted to be held to a standard of reasoning she no longer possesses. That's not autonomy, Elias. That's a haunting.

  **Elias:** (Quietly) Maybe. But I'd rather be haunted by her wishes than by her suffering.

  **Mara:** And I'd rather she be here to suffer than gone because she couldn't win an argument against herself.

  *(Silence settles between them. Elias reaches for the wine bottle, finds it empty.)*

  **Elias:** Another bottle?

  **Mara:** Yeah. But if I write a clause on the label about who drinks the last glass, I'm tearing it up before I pour.

  **Elias:** (Almost smiles) Fair enough.
