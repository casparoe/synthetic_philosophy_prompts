prompt: |-
  I'm a history PhD student, mostly early modern Europe, though I keep wandering into economic history, and I've spent the last couple of weeks (when I should have been writing about grain prices) reading around the Great Divergence stuff for a seminar paper -- the whole "why did industrialization take off in England and not in China / India / Japan" genre, plus the older puzzle about why modern science didn't arise in China. Theres a move I keep seeing and I dont have a word for it. Someone asks why X happened here and not there. They answer with a list of things "here" had: coal lying close to the surface, high wages, a tinkering culture, secure property, cheap credit, whatever. Then a commentator points out that the "there" had most of those too -- China had coal, the Yangzi delta had high wages, Tokugawa Japan had secure enough property -- so how can any of them be the reason this side pulled ahead, if the other side had them as well? And then the first person half-retreats: no no, I was only explaining why it happened here, I wasn't claiming to explain why it didn't happen there. Everyone nods, the conversation moves on, and I always feel like something just got swept under the rug but I can't say what.

  What I want to know is what the requirement actually is that's being invoked, whether that retreat is legitamate or a cop-out, and what to call the whole thing. Is there a name for the demand that an answer to a "why here and not there" question has to point at something that genuinely differs between the two cases? Because I've also noticed what looks like the mirror-image mistake: someone takes that demand as a general rule for all historical explanation and then throws out any factor that was present on both sides -- even though a factor can be present on both sides and still be the difference, if it's present in wildly different degrees, or if the two sides had it for different reasons, or if one side could substitute for it and the other couldn't. So the thing I'm after seems to have two halves, and I suspect they need separate names. People keep waving "correlation isn't causation" and "you need a counterfactual" at me, and neither seems to be the actual point -- the first is about evidence, the second is about something else. I'm not after just a label: I want the carve. What exactly is the requirement, what is it not, why is the retreat sometimes fine and sometimes a dodge, and where are the edges? If nothing in the literature covers both halves, coin me a name and a definition for the demand and for its mirror image, and tell me which existing concepts come closest, so I can see what I'd gain and lose by using your coinage instead. (Bonus if it also explains why the same shape shows up when people argue about why the printing press spread faster in some places, or in biology when someone asks why one lineage and not its sister went in for some trick.)
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User Persona:** History PhD student (Early Modern Europe/Economic History). Knowledgeable, familiar with the Great Divergence debate, sensitive to methodological nuance.
      *   **The Problem:** The user identifies a specific rhetorical move in comparative historical explanation (specifically the "Why Here and Not There" genre).
          *   *Move 1:* Proposer lists factors present in Case A (e.g., England).
          *   *Move 2:* Critic points out factors are also present in Case B (e.g., China).
          *   *Move 3:* Proposer retreats ("I was only explaining A, not the contrast").
          *   *User's Intuition:* This feels like a dodge, but sometimes it might be legitimate.
          *   *Move 4 (Mirror Image):* Critics sometimes demand *unique* factors, rejecting shared factors even if they differ in degree or interaction.
      *   **The Goal:** The user wants a conceptual "carve." They want to know:
          1.  What is the actual logical requirement being invoked?
          2.  Is the retreat legitimate or a cop-out?
          3.  What to call these moves (existing terms or new coinage)?
          4.  Why does this pattern appear across history, biology, etc.?
      *   **Constraints:** Don't just say "correlation/causation" or "counterfactuals." Provide depth, nuance, and specific terminology.

  2.  **Deconstruct the Logical Problem:**
      *   The core question is a *contrastive explanation* ("Why P rather than Q?").
      *   Standard causal explanation ("Why P?") looks for antecedents of P.
      *   Contrastive explanation ("Why P rather than Q?") looks for *differences* between the causal history of P and the causal history of Q.
      *   *The Retreat:* If I ask "Why P rather than Q?" and you answer "Because of X," but X is present in both, you haven't answered the contrastive question. You've answered "Why P?" (singular).
      *   *The Mirror Image:* If I demand X be *unique* to P, I ignore *degrees* of X or *combinatorial* effects. (e.g., Both have coal, but England's is shallower/cheaper).

  3.  **Identify Existing Philosophical/Historical Concepts:**
      *   **Contrastive Explanation:** This is the big one. Bas van Fraassen, Peter Lipton. "Why P rather than Q?" requires a *difference maker*.
      *   **Mill's Method of Difference:** John Stuart Mill. If two instances agree in every circumstance but one, and the phenomenon occurs in one but not the other, that circumstance is the cause.
      *   **INUS Conditions:** Mackie. Insufficient but Non-redundant part of an Unnecessary but Sufficient condition. Helps explain complex causality.
      *   **Causal Sufficiency vs. Necessity:** Often confused in these debates.
      *   **Equifinality:** Different paths to the same outcome (relevant for why unique factors aren't always needed).
      *   **Conjunctural Causality:** Ragin (QCA). Factors work in combinations.
      *   **The "Retreat":** Shifting from a contrastive claim to a singular claim. Often a *scope shift*.

  4.  **Evaluate the "Retreat":**
      *   Is it legitimate? Only if the original question is reinterpreted. If the question is explicitly contrastive ("Why England *not* China?"), the retreat is a failure to answer. If the question is implicitly singular ("Why England?"), the retreat is valid.
      *   In the Great Divergence, the question is inherently contrastive. So the retreat is usually a dodge (a *fallacy of irrelevant conclusion* regarding the contrast).
      *   *However*, sometimes the "background conditions" are assumed equal, and the researcher is isolating a trigger. If the background conditions *aren't* equal, the explanation fails.

  5.  **Evaluate the "Mirror Image" (The Purist Demand):**
      *   Demanding a factor be *unique* (present in A, absent in B) is too strict.
      *   What matters is *variation* in the causal weight.
      *   This is the *Fallacy of Binary Causality* (treating continuous variables as binary).
      *   Or *Causal Parity* error (assuming factors must be absent to be explanatory).

  6.  **Develop Terminology (Coinage vs. Existing):**
      *   *Existing:* "Contrastive Explanation," "Difference Maker," "Mill's Method of Difference."
      *   *Coinage:* Need something catchy for the specific rhetorical dynamic.
      *   *Idea 1:* The "Contrastive Gap."
      *   *Idea 2:* "The Symmetry Challenge."
      *   *Idea 3:* "The Differential Requirement."
      *   *Refinement:* Let's stick close to the philosophy of science but make it usable for historians.
      *   *Term for the Requirement:* **The Contrastive Difference Condition (CDC).**
      *   *Term for the Retreat:* **The Singular Slip.** (Sliding from contrastive to singular).
      *   *Term for the Mirror Image:* **The Uniqueness Fallacy** (or Binary Causality Error).

  7.  **Structure the Response:**
      *   **Acknowledge and Validate:** Confirm the user's intuition is sharp and methodologically sound. This is a classic problem in philosophy of history/social science.
      *   **The Core Concept:** Define **Contrastive Explanation**. Cite Lipton/van Fraassen. Explain that "Why P?" $\neq$ "Why P rather than Q?"
      *   **The Requirement:** Name it **The Difference-Maker Condition**. Explain that for a contrastive question, the cause must vary between the cases (either presence/absence or *magnitude*).
      *   **The Retreat:** Analyze the "I was only explaining Here" move. Call it **Scope Retreat** or **Question Shifting**. It's illegitimate for contrastive questions but legitimate if the question is redefined. In Great Divergence, it's usually a dodge.
      *   **The Mirror Image:** Analyze the demand for unique factors. Call it **The Binary Fallacy** or **Qualitative Exclusivity Error**. Explain *degrees* and *conjunctural causality* (Ragin).
      *   **Synthesis/Coinage:** Offer specific terms the user can use in their seminar.
          *   Demand: **Contrastive Adequacy**.
          *   Retreat: **Singular Deflection**.
          *   Mirror Error: **The Absence Fallacy**.
      *   **Cross-Disciplinary Application:** Briefly touch on biology (evolutionary traits) and tech diffusion to show the universality (convergent evolution, necessary conditions).
      *   **Actionable Advice:** How to handle this in the seminar paper.

  8.  **Refine the Analysis (Self-Correction during drafting):**
      *   *Correction:* Make sure not to get too bogged down in formal logic. Keep it grounded in historical practice.
      *   *Nuance:* The "Retreat" isn't *always* wrong. Sometimes we explain the positive case first to establish the mechanism, then check the negative case. But claiming the job is *done* after step 1 is the error.
      *   *Key Distinction:* Presence/Absence vs. Degree/Interaction. This is crucial for the "Mirror Image" part. Both England and China had coal. But England had *accessible* coal near *water*. It's a combinatorial difference, not just a binary one.
      *   *Philosophy Check:* Peter Lipton's "Inference to the Best Explanation" is the standard reference for contrastive explanation. J.S. Mill's Methods are the historical root. Charles Ragin's "Fuzzy Set Social Science" handles the degree issue.

  9.  **Final Polish:** Ensure the tone is collegial (PhD to PhD). Use the user's examples (grain prices, coal, Yangzi). Make the "coinage" feel useful, not just pretentious. (Decided to stick with established philosophical terms where possible, but sharpen them for historical use).

      *   *Decision:* I will use **Contrastive Explanation** as the anchor. I will define the requirement as the **Difference-Maker Condition**. I will label the retreat **The Singular Slip**. I will label the mirror error **The Uniqueness Fallacy**.

      *   *Wait, one more thing:* The user asked about the "requirement." The requirement is that the *explanans* must track the *explanandum* across the contrast. If the explanandum is a difference, the explanans must be a difference.
      *   *Biology analogy:* Why did birds evolve flight but not crocodiles? Both have ancestors with similar lungs. You need the specific variation (feathers vs scales, bone density) that tracks the divergence.

      *   *Let's write.*
answer: |-
  You have put your finger on the central methodological nerve of comparative historical sociology. Your intuition is correct: something is being swept under the rug, but it isn't just sloppy thinking. It is a category error regarding the *logic of the question being asked*.

  The dynamic you are describing is the tension between **Singular Explanation** and **Contrastive Explanation**.

  Here is the carve you are looking for, the terminology to wield it, and an analysis of when the retreat is legitimate versus when it is a dodge.

  ### 1. The Core Requirement: The Difference-Maker Condition

  The demand you are sensing has a name in the philosophy of science: **Contrastive Explanation**.

  *   **Singular Question:** "Why did Industrialization happen in England?" (Seeks a causal history sufficient for the outcome).
  *   **Contrastive Question:** "Why did Industrialization happen in England *rather than* China?" (Seeks the *difference* between the two causal histories).

  The requirement being invoked by the critic is what Peter Lipton (in *Inference to the Best Explanation*) calls the **Difference-Maker Condition**. For a contrastive question ("Why P rather than Q?"), a valid explanation must cite a factor that is present in the history of P and *absent* (or significantly different) in the history of Q.

  If you ask, "Why did the match light?" and I answer, "Because there was oxygen," I have given a true singular explanation. But if you ask, "Why did *this* match light when *that* one didn't?" (where both were in the same room), "oxygen" is a false contrastive explanation. It is a **background condition**, not a difference maker.

  **The Name:** In your seminar, call this **Contrastive Adequacy**. An explanation has contrastive adequacy only if the proposed cause *varies* across the cases in a way that tracks the variation in the outcome.

  ### 2. The Retreat: "The Singular Slip"

  When the proponent says, "I was only explaining why it happened *here*," they are committing a rhetorical move I will call **The Singular Slip**. They are shifting the goalposts from a contrastive claim to a singular claim mid-argument.

  **Is it legitimate?**
  *   **No:** If the research question is explicitly the Great Divergence (a comparative puzzle), the Singular Slip is a **Fallacy of Irrelevant Conclusion**. You have not solved the divergence puzzle by listing conditions in England; you have only described England. To explain a *divergence*, you must explain the *gap*.
  *   **Yes (with caveats):** It is legitimate only as a *temporary* methodological bracketing. One might say, "First I will establish the causal mechanism in England (Singular), and in a subsequent chapter, I will show why this mechanism was blocked in China (Contrastive)." However, if they present the first half as the *solution* to the divergence, it is a dodge.

  **Why it feels like a sweep-under-the-rug:**
  Because in the Great Divergence debate, the "factors" (coal, wages, property) are rarely binary switches. They are continuous variables or part of a **conjunctural causality** (more on this below). By retreating to the singular, the author avoids having to quantify *how much* coal or *how secure* property rights need to be to trigger the outcome.

  ### 3. The Mirror Image: "The Uniqueness Fallacy"

  You also noted the opposite error: critics demanding that a factor be *unique* to England (present in A, absent in B) to count as a cause. This is the **Uniqueness Fallacy** (or the **Binary Causality Error**).

  This is where "correlation isn't causation" gets misapplied. A factor can be present in both cases and still be the cause of the divergence, provided:
  1.  **Degrees of Intensity:** England had coal *near water*; China had coal *inland*. The factor (coal) is present in both; the *variable* (transport cost of coal) differs.
  2.  **Conjunctural Causality:** (See Charles Ragin's Qualitative Comparative Analysis). Factor X + Factor Y causes Outcome. England had X + Y. China had X + Z. Pointing out that China had X does not invalidate X as a cause; it just means X requires Y to work.
  3.  **Timing/Sequencing:** Both had high wages, but England had them *before* mechanization, while China had them *after* population growth.

  **The Name:** Call this the **Qualitative Exclusivity Error**. It assumes causes must be qualitatively unique (present/absent) rather than quantitatively distinct (more/less, earlier/later, combined/not-combined).

  ### 4. Synthesis: A Vocabulary for Your Seminar

  To cut through the fog in your seminar paper, I suggest using this framework. It gives you existing philosophical concepts sharpened for historical use.

  | Concept | Definition | Use Case |
  | :--- | :--- | :--- |
  | **Contrastive Adequacy** | The requirement that an explanation for a divergence must identify a *difference* in the causal histories, not just a presence in the winner. | Use this to demand more from "England had coal" arguments. |
  | **The Singular Slip** | The rhetorical retreat from answering "Why A not B?" to "Why A?" to avoid dealing with counter-evidence in B. | Use this to flag when a scholar is dodging the comparative element. |
  | **Variable Intensity** | The recognition that a shared factor (e.g., property rights) can still be a difference-maker if the *degree* or *enforcement* varies significantly. | Use this to defend against the Uniqueness Fallacy. |
  | **Conjunctural Causation** | The idea that factors work in combinations (recipes). A shared ingredient doesn't matter if the rest of the recipe is missing. | Use this to explain why "China had coal too" doesn't automatically kill the coal argument. |

  ### 5. Why This Pattern Everywhere? (Biology & Tech)

  You asked why this shows up in biology and tech diffusion. It is because this is the fundamental logic of **Mill's Method of Difference**.

  *   **Biology:** "Why did this lineage evolve wings?"
      *   *Bad Answer:* "Because they had DNA." (Singular Slip: The sister lineage also had DNA).
      *   *Bad Critique:* "Birds and Bats both fly, so wings can't be the cause." (Uniqueness Fallacy: Ignores convergent evolution/different mechanisms).
      *   *Good Answer:* "A specific mutation in the *forelimb development gene* occurred in this lineage's ancestor but not the sister lineage's." (Contrastive Adequacy).
  *   **Printing Press:** "Why did printing spread in Europe and not China?"
      *   If you say "Alphabetic script," a critic says "Korea had movable type."
      *   If you retreat to "I'm just explaining Europe," you haven't explained the *divergence*.
      *   The answer must be contrastive: "Alphabetic script made type *economically viable* in Europe, whereas Logographic script made it *prohibitively expensive* in China." (Note the shift from presence of script to *economic viability* of script).

  ### 6. How to Use This in Your Paper

  Since you are writing on grain prices but reading Great Divergence, you can use this methodological clarity to bolster your own work.

  **The Move:**
  When you discuss your grain prices, explicitly state whether you are making a **Singular Claim** ("High grain prices caused unrest in France") or a **Contrastive Claim** ("High grain prices caused unrest in France but not in England").

  If you make the Contrastive Claim, you must demonstrate **Contrastive Adequacy**. You cannot just show prices were high in France. You must show:
  1.  Prices were lower in England, OR
  2.  Prices were high in England too, but England had a **mitigating factor** (e.g., better credit markets, imports) that France lacked.

  **The "Carve" Definition:**
  If you want to coin a term for your specific frustration, I propose **The Asymmetry Requirement**.

  > **The Asymmetry Requirement:** In any comparative historical explanation claiming to account for a divergence in outcomes, the explanatory variables must demonstrate asymmetry across the cases. This asymmetry may be binary (presence/absence), quantitative (degree/intensity), or structural (combinatorial interaction). Explanations that cite symmetric factors to explain asymmetric outcomes fail the Asymmetry Requirement unless they specify a threshold effect or interaction term.

  **Why use this?**
  It stops the "Singular Slip" (because symmetric factors fail the requirement) but also stops the "Uniqueness Fallacy" (because quantitative/combinatorial asymmetry counts). It forces the debate onto the actual ground of *how much* or *in what combination*, rather than *whether*.

  ### Summary for your Seminar
  1.  **The Demand:** Contrastive Adequacy (The cause must vary if the effect varies).
  2.  **The Retreat:** The Singular Slip (Illegitimate shift from "Why A not B" to "Why A").
  3.  **The Mirror Error:** The Qualitative Exclusivity Error (Demanding causes be unique rather than just varying in degree/combination).
  4.  **The Solution:** Insist on **Causal Variation**. It doesn't have to be unique, but it must *vary* in a way that tracks the outcome.

  This framework allows you to critique the Great Divergence literature without getting bogged down in the specific history of coal or cotton. You are critiquing the *logic of inference*, which is much harder for your interlocutors to wave away.
