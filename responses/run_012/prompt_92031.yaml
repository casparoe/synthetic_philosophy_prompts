answer: |-
  **EXAMINATION PAPER**

  **Module:** DECISION THEORY (UNIT 304)
  **Section:** B
  **Time Allowed:** 45 Minutes (for this question)
  **Instructions:** Answer all parts of the question. Show all working for calculations. This question is self-contained; do not rely on external formulations of the St. Petersburg game.

  **Question 1**

  Consider a game played with a fair coin. The coin is flipped repeatedly until it lands Heads for the first time. Let $n$ denote the flip number on which the first Head appears (so $n \in \{1, 2, 3, \dots\}$). The casino promises to pay the player $2^n$ pounds. However, the casino has a maximum liability cap of $M$ pounds. The actual payout is therefore $X = \min(2^n, M)$.

  Assume throughout that $M = 2^{20}$ (approximately one million pounds).

  (a) Derive the Expected Monetary Value (EMV) of this capped game as a function of $M$ (where $M$ is a power of 2). Calculate the specific numerical EMV for the case $M = 2^{20}$. **[8 marks]**

  (b) According to the EMV decision rule, what is the maximum entry fee a rational agent should pay to play this game? Furthermore, calculate how large the liability cap $M$ would need to be for the EMV rule to license an entry fee of £50. **[7 marks]**

  (c) A student argues: "Because the casino's bankroll is finite, the expected value is finite. Therefore, the St. Petersburg paradox is dissolved." Critically evaluate this claim. Does the cap dissolve the paradox or merely relocate it? If the latter, describe the residual puzzle that remains once we replace Expected Monetary Value with Expected Utility of wealth. **[10 marks]**

  ***

  **MODEL ANSWER**

  **(a) Derivation of Expected Monetary Value**

  The probability that the first head appears on flip $n$ is $P(n) = (1/2)^n$.
  Let $M = 2^k$. In this specific case, $k=20$.
  The payout function is $X(n) = 2^n$ for $n \le k$, and $X(n) = 2^k$ for $n > k$.

  The expected value $E[X]$ is the sum of probability-weighted payouts:
  $$E[X] = \sum_{n=1}^{k} \frac{1}{2^n} 2^n + \sum_{n=k+1}^{\infty} \frac{1}{2^n} 2^k$$

  In the first summation, the terms simplify to 1. There are $k$ such terms (from $n=1$ to $k$).
  $$\sum_{n=1}^{k} 1 = k$$

  In the second summation, $2^k$ is constant. We factor it out:
  $$2^k \sum_{n=k+1}^{\infty} \left(\frac{1}{2}\right)^n$$
  The sum is a geometric series tail starting at $k+1$. The sum of $(1/2)^n$ from $1$ to $\infty$ is 1. The sum from $1$ to $k$ is $1 - (1/2)^k$. Thus the tail is $(1/2)^k$.
  Alternatively, $\sum_{n=k+1}^{\infty} (1/2)^n = (1/2)^k$.
  Therefore, the second term is $2^k \cdot (1/2)^k = 1$.

  Combining these, $E[X] = k + 1$.
  Since $M = 2^{20}$, we have $k=20$.
  $$E[X] = 20 + 1 = 21$$
  The Expected Monetary Value is **£21**.

  **(b) Licensing Fees and Bankroll Requirements**

  The EMV decision rule states that a rational agent should be willing to pay any entry fee $F$ such that $F \le E[X]$.
  For $M = 2^{20}$, the maximum licensed fee is **£21**.

  To find the cap $M$ required to license a fee of £50, we set the EMV to 50.
  Using the derived formula $E[X] = k + 1$:
  $$50 = k + 1 \implies k = 49$$
  Since $M = 2^k$, the required liability cap is:
  $$M = 2^{49}$$
  This is approximately $5.6 \times 10^{14}$ pounds.

  **(c) Evaluation of the "Finite Bankroll" Claim**

  The student's claim is incorrect. While a finite bankroll removes the *mathematical* singularity (infinite expectation), it does not dissolve the *decision-theoretic* paradox; it merely relocates it.

  The original paradox highlights a conflict between EMV maximization and intuitive rationality (few would pay £1,000 for the uncapped game). Capping the payout at $M=2^{20}$ renders the EMV finite (£21), avoiding the infinity. However, the tension between EMV and rational choice persists. A risk-averse agent with finite wealth $W$ and concave utility function $U(W)$ (e.g., logarithmic) will value the game at its Certainty Equivalent, which is typically significantly lower than the EMV for high-variance games.

  The residual puzzle is this: Even with a finite EMV of £21, EMV maximization remains a poor normative guide for a single-shot decision involving significant relative stakes. The "paradox" shifts from "Why is the value infinite?" to "Why does the EMV price (£21) still exceed the price a prudent agent would pay?" The resolution lies not in the casino's solvency, but in the agent's diminishing marginal utility of wealth. The cap makes the math tractable, but it does not justify the EMV rule itself. A complete solution requires Expected Utility Theory, which shows that the fair price depends on the agent's specific wealth level, not just the game's objective payout structure.

  ***

  **MARKING SCHEME**

  **Total Marks: 25**

  **Part (a): Calculation of EMV (8 Marks)**
  *   **2 marks:** Correctly identifies probability mass function $P(n) = (1/2)^n$.
  *   **2 marks:** Correctly splits the summation into the uncapped region ($n \le k$) and capped region ($n > k$).
  *   **2 marks:** Correctly evaluates the first sum as $k$ (or 20).
  *   **2 marks:** Correctly evaluates the second sum as 1, yielding total $k+1$ (or 21).
      *   *Error:* Failing to sum the tail of the geometric series correctly (e.g., claiming the second sum is 0 or infinite) costs the final 2 marks.
      *   *Error:* Arithmetic error in final sum (e.g., 20) costs 1 mark.

  **Part (b): Application and Scaling (7 Marks)**
  *   **3 marks:** States the EMV-licensed fee is equal to the calculated EMV (£21).
  *   **4 marks:** Correctly inverts the formula ($k+1=50$) to find $k=49$ and states $M=2^{49}$.
      *   *Error:* Solving for $M=50$ directly without using the log relationship costs 2 marks.
      *   *Error:* Confusing the entry fee with the bankroll (e.g., saying bankroll must be £50) costs 2 marks.

  **Part (c): Conceptual Evaluation (10 Marks)**
  *   **3 marks:** Explicitly rejects the student's claim (identifies that finite EMV $\neq$ solved).
  *   **3 marks:** Explains that the paradox is relocated: the conflict is now between finite EMV and the agent's willingness to pay (Certainty Equivalent).
  *   **4 marks:** Identifies the residual puzzle requires Expected Utility/Diminishing Marginal Utility to resolve (EMV is still the wrong metric for single-shot risk).
      *   *Error (The "Friend's Trap"):* An answer that agrees the paradox is "dissolved" simply because the expectation is finite cannot score more than 3 marks in this section, regardless of writing quality. This demonstrates a failure to distinguish mathematical convergence from normative justification.
      *   *Error:* Discussing "long-run averages" without addressing single-shot utility costs 2 marks.
      *   *Error:* Failing to mention wealth/utility dependence costs 2 marks.

  **General Penalties**
  *   **Notation:** Sloppy probability notation (e.g., treating $n$ as continuous) costs 1 mark total.
  *   **Clarity:** If the distinction between $M$ (cap) and $n$ (flip count) is confused repeatedly, deduct 2 marks.
