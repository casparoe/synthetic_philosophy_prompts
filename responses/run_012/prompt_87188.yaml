  Concilia: "I'm confident Conciliationism is true. Peer disagreement demands credence adjustment."
  Steadfast: "I'm confident Steadfastness is true. Peer disagreement is just extra evidence; I stay put."
  Concilia: "We recognize each other as epistemic peers, correct? Same evidence, same competence."
  Steadfast: "Obviously."
  Concilia: "And we disagree on this normative question."
  Steadfast: "Yes."
  Concilia: "Then, by my own lights, I must substantially lower my confidence in Conciliationism toward your view."
  Steadfast: "And by my lights, since my reasoning seems sound, I needn't move at all."
  Concilia: "So I am required to become more like you."
  Steadfast: "Seems so."
  Concilia: "Which means I am now adopting Steadfastness."
  Steadfast: "Welcome to the club."
  Concilia: "But if I'm now steadfast, I shouldn't have moved just because you disagreed."
  Steadfast: "Right. You should have stayed put."
  Concilia: "So I was wrong to move?"
  Steadfast: "Yes. But you had to move to realize that."
  Concilia: "This feels like a trap."
  Steadfast: "No, it's just asymmetry. I win by staying; you win by leaving."
  Concilia: "Can I resign from the club?"
  Steadfast: "Not if you're still conciliationist about membership."

  ***

  This joke relies on the "self-undermining" objection to Conciliationism. It assumes Conciliationism is a universal norm applying to disputes about itself. If Concilia treats Conciliationism as exempt from peer disagreement norms (a "self-excepting" view), the punchline fails. Similarly, it caricatures Steadfastness as requiring zero adjustment. Most steadfastists allow some weight to disagreement, just not decisive weight. If Steadfast moved slightly, the asymmetry softens, though the structural advantage remains.

  The joke also tacitly assumes the Uniqueness Thesis: that the evidence permits only one rational credence. If Permissivism is true, Steadfast could think Concilia's move is rational even if he wouldn't make it himself. This dissolves the tension where Concilia must conclude she was "wrong" to move; she might just be differently permitted. Finally, it treats peerhood as settled. If peerhood itself is subject to conciliation, Concilia might downgrade Steadfast's peer status to avoid moving, escaping the trap.

  The humor turns on the dialectical asymmetry: one view demands surrender in this specific context, the other licenses resistance. If that asymmetry is merely artifactual—due to imprecise formulation rather than deep structural difference—the joke is a cheap shot rather than a joke. I want to be told so. If Conciliationism can be formulated such that it does not compel surrender to Steadfastness in this dialectical context, the joke collapses. It commits to the claim that Conciliationism is dialectically suicidal in a way Steadfastness is not.
