answer: |-
  **ANNEX C-4: RESOLUTION OF DISPUTES AND PRESERVATION OF AUTHORITY**

  **Article 1: Vestiture and Symbolic Capacity**
  1.1. The Society acknowledges that the authority of the Council cannot be sustained by reason alone. Accordingly, the wearing of regalia during plenary sessions is mandatory for all voting members.
  1.2. The function of the robe, the chain, and the sealed dais is not honorific. These items serve to obscure the human contingency of the office. They provide the visual substrate required for the membership to conflate the person with the institution.
  1.3. Any member found mocking the vestments as ceremonial shall be reminded that the ceremony is the sole vehicle of the verdict. Without the costume, the ruling is merely an opinion.

  **Article 2: Ratification and the Appearance of Equity**
  2.1. A decision of the Council is binding because the Council controls the allocation of grants and access to data repositories. This force is necessary, as justice without enforcement is inert.
  2.2. However, force without the appearance of justice provokes resistance. Therefore, all rulings must be accompanied by a procedural audit that simulates equitable deliberation.
  2.3. In cases where the substantive justice of a ruling is weak, the Administrative Committee shall increase the complexity of the forms required to challenge it. The burden of procedure shall substitute for the burden of proof.

  **Article 3: Prohibition on Genealogical Inquiry**
  3.1. Members are permitted to ask whether a rule is useful. Members are not permitted to ask why a rule exists.
  3.2. Specifically, research into the historical origins of Standing Orders is classified as misconduct. Authority rests on custom; custom rests on forgetting its own beginning.
  3.3. Any publication tracing a current protocol to a specific administrative accident (e.g., the clerical error of 1954) shall be treated as an attack on the Society's stability. The author shall be cited for violating the confidentiality of institutional memory.

  **Article 4: Limitations on Appeal**
  4.1. Appeals may be lodged on procedural grounds only.
  4.2. No appeal may reach a first principle. Arguments questioning the Council's right to rule, rather than the execution of that rule, are inadmissible.
  4.3. The Appeals Committee is instructed to terminate any chain of reasoning that threatens to expose the arbitrary foundation of the Society's charter.

  **Article 5: Differential Access to Records**
  5.1. The Minutes of the Council shall exist in two versions.
  5.2. The General Membership shall receive the Redacted Version, which records decisions as the outcome of deliberative consensus.
  5.3. The Council shall retain the Full Version, which records the strategic calculations, vote counts, and external pressures necessitating the decision.
  5.4. It is necessary that the membership believe the process is driven by truth. It is necessary that the Council know the process is driven by necessity.

  **Article 6: Adjudication of Specific Contingencies**
  6.1. **Priority Disputes:** In conflicts between a solitary author and a large laboratory, priority shall be assigned to the laboratory. The appearance of justice shall be maintained by citing the laboratory's superior capacity for data verification.
  6.2. **Retraction Demands:** If a well-funded group demands a retraction, the Council shall comply if the cost of legal defense exceeds the cost of reputational damage. The retraction notice shall use standard phrasing regarding "unintended errors" to preserve the appearance of scientific integrity.
  6.3. **Prize Renaming:** A prize shall be renamed if the biography of the namesake threatens the reception of the award. The history shall be adjusted in the program booklet to emphasize contributions compatible with current custom.

  ***

  **Note to the Author**

  I have committed to the "Fideist" reading of Pascal. He is not merely a cynical realist describing power; he is a Christian apologist dismantling dogmatic confidence to clear the ground for faith. He argues that custom rules us because reason is too weak to sustain order, not because this is a good thing, but because it is our fallen state. The annex takes a liberty by treating this tragedy as a stable management strategy. Pascal suggests we follow custom to avoid chaos while seeking God; your Registrar treats custom as the end goal, actively manufacturing the "diversion" Pascal warned against. The coldness you requested comes from removing Pascal's theological hope while keeping his psychological mechanics.
