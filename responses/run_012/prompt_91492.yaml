      *Story:*
      The basement of St. Mark's smelled of floor wax and cold potato salad. We sat on folding chairs, the mourners becoming buyers. My father's casket had been upstairs an hour ago; now his life was being lot numbered on index cards.

      Silas, the auctioneer, stood on a milk crate. He wore a suit too shiny for grief. "Rule is simple," he said, voice booming off the cinderblocks. "Highest bidder takes the lot. Second highest pays their bid to the estate. Nothing else."

      They rolled out Lot 42. The '74 Ford. Rust on the wheel wells, vinyl cracked like dry riverbeds. To the room, it was scrap. To me, it was the seat where I learned to drive, the cab where Dad told me he was sick. Worth three thousand, maybe. I needed it for five.

      "Start me at five hundred," Silas crooned.

      I raised my paddle. "Five."

      Miller, in the back row, didn't stand. He just lifted a chin. "Six." Miller had worked for Dad for twenty years until the firing. He wanted the truck to prove he deserved it more than the son who left.

      "Seven," I said.

      "Eight." Miller's voice was flat.

      We climbed past two thousand. The room went quiet. The arithmetic was simple, but the feeling was viscous. At $2,500, I looked at Miller. He looked at me. We were past the value. I knew it. He knew it.

      "Twenty-six hundred," Miller said.

      My throat tightened. If I stopped now, I paid $2,500 and got nothing. Miller would pay $2,600 and get the truck. I couldn't let him win, and I couldn't afford to lose the money I'd already mentally spent.

      "Twenty-seven," I said.

      Silas smiled. It was a shark's smile. He knew the trap was sprung. The second-highest bidder pays. That was the hook. You don't just bid to win; you bid to avoid the penalty of losing.

      "Twenty-eight."

      "Twenty-nine."

      Mrs. Gable, who lived next to the farm, leaned forward. She smelled of lavender and sense. "Boys," she whispered, loud enough for the front row. "Flip a coin. Split the cost. It's stupid money."

      I looked at the truck. If I split the cost, I shared the memory. If I let Miller have it, I paid him to take my father.

      "It's not about the money," Miller said. He was sweating now. He had bid $3,000. If he quit, he lost three grand. Zero return. He had to bid $3,100 to make the previous loss an investment rather than a waste.

      "Thirty-one," I said. My hands were shaking. I was bidding against my own sanity.

      "Thirty-two." Miller's voice cracked. He couldn't back down. If he stopped at $3,100, he was a fool who paid three grand for nothing. If he bid $3,200, he might still win. The logic was airtight and insane.

      Silas licked his lips. "Thirty-two going once..."

      I calculated the loss. If I stopped, I lost $3,100. If I bid $3,300 and won, I paid $3,300 for a $3,000 truck. A $300 loss was better than a $3,100 loss.

      "Thirty-three," I whispered.

      Miller stood up. The chair scraped loud as a gunshot. He looked at me, eyes red. He knew I couldn't stop. I knew he couldn't stop. We were locked in a cage of our own making, feeding the estate to keep from bleeding out.

      "Forty," Miller said.

      The room gasped. He was jumping bids. He was trying to scare me, to make the cost of continuing too high. But the cost of stopping was higher.

      "Forty-one," I said.

      Silas wasn't smiling anymore. He was counting. He didn't care about the truck. He cared about the sum of the highest bid and the second highest. Every dollar we fought was two dollars in the estate's pocket.

      "Fifty," Miller said. He was pale. He didn't have fifty thousand. Maybe he did. Maybe he'd borrow it. To lose now was to admit the firing was justified, that he was a man who wasted money on pride.

      "Fifty-one," I said. I couldn't stop. I was already down fifty grand in my head.

      Silas raised the gavel. "Sold to the son for fifty-one thousand. Second bidder pays fifty thousand to the estate."

      The gavel fell. The sound was final. I owned the truck. I also owed fifty-one thousand. Miller owed fifty thousand. Silas stepped down from the crate, pocketing the slip of paper that totaled one hundred and one thousand dollars for a rusted Ford.

      Miller walked out without looking at me. I sat in the folding chair, staring at the keys on the table. I had saved the truck. I had lost the farm.

      Silas touched my shoulder. "Congratulations," he said. "Your father would be proud of your tenacity."

      I didn't answer. I just listened to the fluorescent lights hum, counting the zeros in the silence.

