prompt: |-
  My old sociology professor used to boil down the whole individualism-vs-holism thing like this, and I've been repeating it for years — now a friend in a philosphy of social science seminar says I'm parroting something confused, but she wouldn't say exactly where. Here's the gist of what he'd say:

  Methodological individualism is the view that social facts are really just facts about individual people — their beliefs, wants, and choices — so any real explanation in social science has to be cashed out in terms of individual psychology, and all the talk about classes, norms, and markets is just shorthand for lots of individual actions. Holism is the opposite: societies are real things over and above the individuals in them, with their own properties and even their own interests, so you explain a social fact by pointing to other social facts. Durkheim on suicide rates is the poster child — he showed suicide is a social fact with social causes, which refutes individualism — and Weber's the individualist, Durkheim the holist. And since you can't observe a society, only people, holism isn't really science.

  He'd also toss in a test he called the "independent contribution test": a macro-level factor (say the unemployment rate) counts as a genuine cause in its own right only if it still predicts the outcome after you've controlled for the individual-level stuff — if it doesn't, then it's just an aggregate of individual choices and belongs on the individualist side.

  How much of this can I keep? Go through it point by point and tell me what a careful person in the field would sign off on, what's a standard simplification rather than an error, and what's straight up wrong — and tell me what's actually at stake in the debate, because I suspect his test isn't even aimed at the real disagreement. The suicide example especially: I'd like to know whether it does the work he thinks it does.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user learned a specific formulation of the individualism-vs-holism debate from an old sociology professor. A friend in a philosophy of social science seminar claims this formulation is confused. The user wants to know what's accurate, what's a simplification, and what's wrong.
      *   **The Professor's Formulation:**
          1.  *Methodological Individualism (MI):* Social facts = facts about individuals (beliefs, wants, choices). Explanations must be psychological. Macro concepts (classes, norms) are shorthand.
          2.  *Holism:* Societies are real things *over and above* individuals, with own properties/interests. Explain social facts with other social facts.
          3.  *Examples:* Weber = Individualist, Durkheim = Holist (Suicide study refutes MI).
          4.  *Epistemology:* Holism isn't science because you can't observe society, only people.
          5.  *The Test:* "Independent Contribution Test" (Macro factor counts if it predicts outcome after controlling for individual variables).
      *   **The Task:** Evaluate point-by-point (accurate vs. simplification vs. wrong), explain what's actually at stake, and specifically address the Durkheim/Suicide example and the "Test."

  2.  **Deconstruct the Professor's Claims (Mental Sandbox/Drafting):**

      *   *Claim 1: MI says social facts are *just* facts about individuals/psychology.*
          *   *Critique:* This is a common caricature. MI doesn't necessarily reduce everything to *psychology*. It says social phenomena must be explained by the actions/interactions of individuals. But those actions can be shaped by institutions, rules, etc., as long as the mechanism runs through individuals. It's not necessarily *psychologism*.
          *   *Verdict:* Simplification/Partial Error.

      *   *Claim 2: Holism says societies are real things *over and above* individuals (ontological holism).*
          *   *Critique:* There's a difference between *Methodological* Holism and *Ontological* Holism. Most serious social scientists aren't ontological holists (believing society is a mystical organism). They are methodological holists (macro variables have explanatory power). The professor conflates the two.
          *   *Verdict:* Confused/Strawman.

      *   *Claim 3: Weber = Individualist, Durkheim = Holist.*
          *   *Critique:* This is the standard textbook distinction. It's broadly correct as a heuristic, though both are more nuanced. Weber focuses on *Verstehen* (individual meaning), Durkheim on *Social Facts* (external constraint).
          *   *Verdict:* Standard Simplification (Acceptable).

      *   *Claim 4: Durkheim's Suicide refutes Individualism.*
          *   *Critique:* This is the crux. Durkheim showed suicide *rates* are stable and vary by social integration, not just individual pathology. However, MI proponents (like Elster or Coleman) argue you still need to explain *why* the rate changes via individual mechanisms. Durkheim showed macro correlations, but MI demands micro-foundations. Does it *refute* MI? Not necessarily. It refutes *pure* psychologism, but not necessarily MI if MI allows for structural constraints on individuals.
          *   *Verdict:* Contested/Overstated.

      *   *Claim 5: Holism isn't science because you can't observe society.*
          *   *Critique:* This is positivist/empiricist bias. We can't observe "gravity" directly either, only its effects. Unobservability doesn't disqualify something from science (realism vs. instrumentalism).
          *   *Verdict:* Wrong/Philosophically naive.

      *   *Claim 6: The "Independent Contribution Test" (Multilevel Modeling logic).*
          *   *Critique:* This sounds like statistical control. If a macro variable adds predictive power over micro variables, it has "emergent" properties. This is actually a decent operationalization of *methodological* holism vs. individualism in quantitative research (contextual effects). However, it doesn't settle the *ontological* or *explanatory* debate. It just shows statistical association.
          *   *Verdict:* Methodologically useful, but doesn't solve the philosophical debate.

  3.  **Structure the Response:**
      *   **Introduction:** Validate the user. The professor's view is a "classic" intro-soc version, but the philosophy friend is right that it's philosophically messy.
      *   **Point-by-Point Breakdown:**
          1.  Definition of MI (Psychology vs. Action).
          2.  Definition of Holism (Ontological vs. Methodological).
          3.  Weber/Durkheim Labeling.
          4.  The Suicide Case.
          5.  Observability/Science Claim.
          6.  The "Independent Contribution Test."
      *   **What's Actually at Stake:** Explain the real debate (Micro-foundations vs. Emergence/Downward Causation).
      *   **Conclusion:** What to keep, what to toss.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Refining MI:* Make sure to distinguish between "psychologism" (all social is mental) and "individualism" (all social is constituted by individual actions). The professor conflated these. MI allows for institutions as constraints, provided they act on individuals.
      *   *Refining Holism:* Crucial distinction: Ontological (Society is a super-organism) vs. Methodological (Macro variables are irreducible for explanation). Most holists today are methodological. The professor made Durkheim sound like a mystic.
      *   *Refining Suicide:* Durkheim showed *rates* are social facts. MI accepts rates exist but asks for the *mechanism*. Durkheim is often accused of skipping the mechanism. So it doesn't refute MI, it challenges MI to do more work.
      *   *Refining the Test:* This is basically "Contextual Effects" in multilevel modeling. If `Y_ij = b0 + b1*X_ij + b2*X_j + e`, and b2 is significant, the context matters. This supports *methodological holism* but doesn't prove *ontological holism*. It's a good practical test, not a philosophical silver bullet.
      *   *The "Science" Claim:* This is the weakest point. Unobservability is not a disqualifier (atoms, genes, gravity).

