      *   **Tension C: (3) vs. (5) - The Definition of Work.**
          *   (5) Writing is "good work" because it's picked.
          *   (3) Caps "the working week."
          *   *The Conflict:* Does the cap count the novel writing? If the protagonist runs a press (business) *and* writes (art), where is the line? If the cap is on "employment," does it solve the protagonist's problem if she's self-employed/owner?
