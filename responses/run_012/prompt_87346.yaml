  8.  *(Self-Correction)*: Wait, I need to be careful about the "35-hour week" application. If the protagonist is the *owner*, labor laws often don't apply to her. This makes her struggle internal/structural in a different way. I should point this out. It makes the tension between (2) and (3) even sharper. If she *chooses* to overwork, the law doesn't stop her. So (3) is about protecting workers *from* employers, but her problem is she *is* the employer (of herself). This is a goldmine for a novel.

