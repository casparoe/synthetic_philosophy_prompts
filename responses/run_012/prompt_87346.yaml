      *   **The Leisure Question:**
          *   Absence (Negative Liberty) vs. Activity (Positive Liberty).
          *   If leisure is just "not working," a 35-hour week gives you 5 hours of nothing.
          *   If leisure is "freedom for," you need resources, culture, energy.
          *   *Relevance to (3):* If the system grinds you down, 35 hours might just be recovery time, not "leisure" in the rich sense.

