answer: |-
  Your instincts are excellent. You smelled the right things: the closure assumptions matter, "triviality" isn't a simple contradiction, and the leap to the Material Conditional is a massive non-sequitur. Your friend has conflated a mathematical limitative result with a specific philosophical worldview, and then added a debunking story on top that isn't supported by the math.

  Here is the clause-by-clause audit of your friend's summary, followed by answers to your specific conceptual questions.

  ### Part 1: The Clause-by-Clause Audit

  **1. "Lewis proved that the idea that the probability of an indicative conditional equals the conditional probability of B given A is just false."**
  *   **Verdict:** **Wince-worthy Simplification.**
  *   **The Reality:** Lewis didn't prove the equation ($P(\text{If } A \text{ then } B) = P(B|A)$) is "false" in a vacuum. He proved a *conditional* claim: **IF** indicative conditionals express standard propositions (have truth conditions) **AND** the language is sufficiently rich (closed under certain operations), **THEN** accepting that equation leads to triviality.
  *   **Why it matters:** You can avoid the result by rejecting the "IF" parts. You can keep the equation if you deny conditionals are propositions (Adams' view). You can keep conditionals as propositions if you deny the equation holds universally (Stalnaker's later view). Lewis's result restricts the *combination* of views, it doesn't single-handedly kill the equation itself.

  **2. "The proof is that if you plug that equation in you get a contradiction, so it can't hold in general."**
  *   **Verdict:** **Technically Wrong.**
  *   **The Reality:** It is not a logical contradiction (like deriving $P \land \neg P$). It is a **triviality result**. It shows that if the equation holds, the probability function becomes "trivial"—meaning agents can only have credences of 0 or 1, or the algebra of propositions is incredibly small (you can't have more than a few distinct possibilities).
  *   **Why it matters:** A contradiction means the system is broken. A triviality result means the system is *too restrictive* to model real human belief, where we have nuanced probabilities (0.5, 0.75, etc.) about conditionals. Your memory was correct here.

  **3. "Which means indicative conditionals don't express propositions at all, theres nothing for them to be true or false about..."**
  *   **Verdict:** **Plausible Inference, Not Logical Necessity.**
  *   **The Reality:** This is one valid way to react to Lewis's result (often associated with Ernest Adams). If you think the probability equation ($P(\text{If } A \text{ then } B) = P(B|A)$) is non-negotiable because it matches intuition so well, then you must give up truth conditions.
  *   **Why it matters:** But it's not the *only* reaction. Many philosophers keep truth conditions and simply accept that the probability equation doesn't always hold. So, the math doesn't *force* this conclusion; it just makes it an attractive option for those who prioritize the probability intuition.

  **4. "...and so the only analysis left standing is the material conditional, where 'if A then B' just means 'not-A or B.'"**
  *   **Verdict:** **Just Wrong.**
  *   **The Reality:** This is the biggest error in your friend's summary. The Material Conditional ($\neg A \lor B$) **also** fails the probability equation. In fact, the Material Conditional is usually *worse* at matching $P(B|A)$ than the theories Lewis was critiquing.
  *   **Why it matters:** Lewis's result attacks *any* truth-conditional account that tries to satisfy the equation. It does not vindicate the Material Conditional. If anything, Lewis's result makes life harder for the Material Conditional, because the Material Conditional already has independent problems (like implying that a conditional is true just because the antecedent is false). The theorem doesn't clear the field for the Material Conditional; it leaves a mess that everyone has to clean up differently.

  **5. "And it even explains why the material conditional feels wrong to ordinary speakers: they're just conflating the probability of the conditional with the conditional probability, and Lewis's proof shows that intuition is a mistake."**
  *   **Verdict:** **Smuggled Claim.**
  *   **The Reality:** This is a philosophical "error theory" or debunking explanation. It is not a consequence of Lewis's theorem. The theorem is silent on psychology.
  *   **Why it matters:** Your friend is using the math to license a claim about human cognition. You could accept Lewis's math but argue that speakers are *right* to feel the Material Conditional is wrong, and that's why we should abandon truth conditions entirely (going back to point 3). The math doesn't tell us who is confused; it just tells us which formal boxes don't fit together.

  ---

  ### Part 2: Addressing Your Specific Questions

  **1. Does "conditionals have no truth conditions" follow from the triviality results?**
  **No.** It is a *response* to the result, not a *consequence* of it.
  Lewis's theorem presents a trilemma. You have to drop at least one of these three:
  1.  Conditionals express standard propositions (have truth conditions).
  2.  The probability of the conditional equals the conditional probability (Stalnaker's Thesis).
  3.  The language is rich/closed (conditionals can be embedded, negated, etc.).

  Your friend assumes you must keep (3) and (2), so you must drop (1). But many philosophers keep (1) and (3) and drop (2). They argue that $P(\text{If } A \text{ then } B)$ is not always equal to $P(B|A)$. Others keep (1) and (2) but restrict the language (drop 3), arguing that conditionals can't be nested or operated on logically in the way Lewis's proof requires. So, "no truth conditions" is just one escape route, not the destination the theorem forces you to.

  **2. Is the Material Conditional really the only survivor?**
  **Absolutely not.** In fact, it's arguably the biggest casualty.
  The Material Conditional analysis says "If A then B" is true whenever A is false. But intuitively, if I say "If it rains, the match will be cancelled," and it doesn't rain, I haven't clearly said something *true*; I've said something untested.
  More importantly regarding Lewis: The Material Conditional does *not* satisfy $P(\text{If } A \text{ then } B) = P(B|A)$. For the Material Conditional, $P(\neg A \lor B)$ is usually much higher than $P(B|A)$. So, if your friend thinks Lewis proved the equation is false, the Material Conditional is *also* guilty of making the equation false. Lewis's result doesn't clear the deck for the Material Conditional; it just shows that *whatever* truth conditions you pick, they won't perfectly match our probabilistic intuitions.

  **3. Is the "ordinary speakers are confused" bit a consequence of the theorem?**
  **No, it's a separate philosophical narrative.**
  This is an "error theory." It says: "The math says X, our intuition says Y, therefore our intuition is a cognitive illusion."
  But you could just as easily run the narrative the other way: "The math says standard propositions can't model X, our intuition says X is central to reasoning, therefore standard propositions are the wrong tool for the job."
  Lewis's theorem constrains formal models; it doesn't diagnose psychological errors. Your friend is using the theorem to win a debate about human psychology, which the theorem isn't equipped to do.

  ### Part 3: The "Closure" Assumption You Remembered
  You were right to flag this. Lewis's proof relies on the assumption that you can form new propositions using the conditional. Specifically, it usually requires that you can condition *on* a conditional (e.g., calculate the probability of $C$ given "If $A$ then $B$").
  If you adopt a semantics where conditionals cannot be embedded (you can't say "If (if A then B) then C"), or where they don't interact with negation in standard ways, you can block the proof. This is a technical way out that some semanticists take. It validates your hunch that the "language closure" assumption is doing heavy lifting.

  ### Summary for Your Next Drink
  *   **Trust your gut:** Lewis proved a constraint on formal systems, not a fact about English grammar or human psychology.
  *   **The "Contradiction":** It's a triviality result (probabilities collapse to 0 or 1), not a logical contradiction.
  *   **The Material Conditional:** Lewis's result does not save it; the Material Conditional fails the probability test just as badly as the others.
  *   **Truth Conditions:** You can keep them if you're willing to say the probability equation isn't universal.
  *   **The Friend's Error:** He treated a "you can't have it all" theorem as a "here is the one true answer" proof.

  You didn't lose that argument because you didn't know the material; you lost it because your friend was speaking with more confidence than the math allows.
