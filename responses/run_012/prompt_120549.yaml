answer: |-
  This is a classic case of slogan-equivocation. In rationalist circles, where precision is valued, the persistence of *de gustibus non est disputandum* as a conversation-stopper is indeed ironic. The slogan functions as a polymorphous shield: it can defend subjectivism, protect politeness, or enforce an epistemic principle, often within the same paragraph.

  Here is the disambiguation menu you requested, ordered from the sociologically trivial to the metaphysically radical, followed by an analysis of the commenters and the specific philosophical question regarding realism and testimony.

  ### The Menu of Claims

  **1. The Descriptive Claim (Sociological/Psychological)**
  *   **Claim:** When people argue about aesthetic preferences, they rarely change each other's minds through argumentation alone.
  *   **Verdict:** **Platitude.** Empirical observation supports this. Unlike arguments about math or empirical facts, aesthetic arguments seldom result in immediate conversion. They may refine perception, but they rarely flip a binary switch from "hate" to "love."

  **2. The Normative Claim (Etiquette)**
  *   **Claim:** It is socially inappropriate or futile to press an aesthetic judgement on someone who disagrees.
  *   **Verdict:** **Platitude.** This is a rule of conversational hygiene. Insisting a friend *must* like a book they dislike is generally considered rude or annoying, regardless of the metaphysical status of beauty.

  **3. The Epistemic Claim (Non-Compulsion)**
  *   **Claim:** Aesthetic judgements cannot be supported by reasons that *compel* assent in the way logical or empirical proofs do.
  *   **Verdict:** **Substantive but Defensible.** You can give reasons for liking a book (pacing, prose, character depth), but these reasons do not function as premises in a valid syllogism that forces the conclusion "You will like this." The link between reason and response is contingent on the listener's sensibility.

  **4. The Acquaintance Principle (Epistemic Access)**
  *   **Claim:** Aesthetic judgements can only be justified by first-hand experience of the object; testimony is not a legitimate route to forming the judgement itself.
  *   **Verdict:** **Substantive but Defensible.** This is a standard principle in analytic aesthetics (associated with Kant and later Richard Wollheim). You can know *that* a book is good via testimony, but you cannot form the *aesthetic judgement* of its goodness without reading it. Testimony provides knowledge *that*, but not knowledge *by acquaintance*.

  **5. The Expressivist Claim (Semantics)**
  *   **Claim:** Statements like "This book is good" do not express truth-apt propositions; they express the speaker's emotional attitude (e.g., "I like this book").
  *   **Verdict:** **Substantive but Controversial.** This is a standard meta-ethical/aesthetic position (A.J. Ayer, Simon Blackburn). It denies that aesthetic predicates refer to objective properties. It makes the slogan literally true: you cannot dispute an expression of feeling, only report it.

  **6. The Relativist Claim (Metaphysics)**
  *   **Claim:** Aesthetic properties exist, but they are relative to the observer. "This book is good" means "This book is good-for-me."
  *   **Verdict:** **Substantive but Controversial.** This allows for truth-aptness (the proposition can be true or false) but relativizes the truth conditions to the subject. Disputes are merely misunderstandings of indexicals.

  **7. The Nihilist Claim (Metaphysics)**
  *   **Claim:** There are no aesthetic facts whatsoever. All aesthetic discourse is systematically false or meaningless.
  *   **Verdict:** **Radical and Generally Rejected.** Few philosophers or critics actually hold this, as it renders the entire practice of criticism unintelligible. It is rarely what people mean when they use the slogan casually.

  ***

  ### Analysis of the Commenters

  The conflict in the thread arises because Commenter A and Commenter B are selecting different items from the menu to license opposite practical conclusions about **testimony**.

  **Commenter A:** *"A recommendation is simply evidence about the recommender's dispositions rather than a claim about the book."*
  *   **Licenses via:** **The Expressivist Claim (5)** combined with **Bayesian Updating.**
  *   **Analysis:** If "This book is good" really means "I am the kind of person who likes this book," then the listener updates their model of the *speaker*. If the listener knows they share dispositions with the speaker, they can infer they will like the book.
  *   **What they probably mean:** They are likely operating on a mix of **Relativism (6)** and **Descriptive (1)**. They believe taste is idiosyncratic, so the value of the rec is purely correlational.
  *   **Coherence:** Highly coherent within a rationalist framework. It treats the recommendation as data for a predictive model of compatibility.

  **Commenter B:** *"A recommendation is worthless, since nobody can tell you what's good."*
  *   **Licenses via:** **The Acquaintance Principle (4)** taken to an extreme, or **Nihilism (7).**
  *   **Analysis:** If one cannot form an aesthetic judgement without direct experience, then the *testimonial content* ("It is good") is epistemically inert regarding the actual aesthetic experience.
  *   **What they probably mean:** They are likely conflating **The Epistemic Claim (3)** (reasons don't compel) with **The Acquaintance Principle (4)**. They feel that because the *reasons* won't force you to like it, the *statement* is useless.
  *   **Coherence:** Less coherent. Even if testimony cannot generate the *experience*, it is still useful for triage (deciding what to experience). Calling it "worthless" is an overreach unless they hold the Nihilist view.

  **The Equivocation:**
  Commenter A thinks the slogan means "Quality is relative," so the rec is data about *us*.
  Commenter B thinks the slogan means "Quality is inaccessible," so the rec is data about *nothing*.
  Both use "There's no disputing about taste" to block the idea that the friend is transmitting an **Objective Fact (Realism)**.

  ***

  ### The Specific Question: Realism + Anti-Testimony

  You asked: *Can someone hold that aesthetic judgements are straightforwardly true or false and still insist that they cannot be taken on anyone's say-so? Is this coherent? Is it standard?*

  **1. Is it Coherent?**
  **Yes, entirely.** This is the distinction between **Ontology** (what exists) and **Epistemology** (how we access it).
  One can hold that "Beauty" is an objective property of the book (Realism), while simultaneously holding that the human cognitive apparatus requires direct perceptual engagement to detect that property (The Acquaintance Principle).

  *   **Analogy:** Consider the statement "This chili is spicy."
      *   **Realism:** Capsaicin levels are objective facts. The statement is truth-apt.
      *   **Anti-Testimony:** If I ask you "Is it spicy?" and you say "Yes," I have not *felt* the spice. I cannot fully evaluate the culinary experience based solely on your report. I must taste it to verify the quality of the heat, not just its existence.
      *   In aesthetics, the "verification" is part of the value. Knowing a book is good via testimony bypasses the very experience that makes the goodness valuable.

  **2. Is it Standard or Eccentric?**
  **It is the Standard Position in Analytic Aesthetics.**
  This view is most famously associated with **Immanuel Kant** (in the *Critique of Judgment*) and defended in contemporary philosophy by **David Hopkins** and **Roger Scruton**.
  *   **Kant:** Argues that aesthetic judgement claims "subjective universality." It feels like a private sensation, but we speak as if it should hold for everyone. However, it requires the free play of imagination and understanding, which cannot be triggered by rules or testimony.
  *   **The "Acquaintance Principle":** This is the technical name for the claim that aesthetic knowledge requires first-hand experience. It is widely accepted even by realists.

  **3. Why This Settles the Thread**
  If this position is adopted (Objective Quality + Acquaintance Principle), both commenters are partially wrong:
  *   **Against Commenter B:** The recommendation is **not worthless**. Even if you must read the book to judge it, the friend's testimony provides *probabilistic evidence* that the objective conditions for beauty are met. It saves you time on triage.
  *   **Against Commenter A:** The recommendation is **not merely about dispositions**. It is possible the friend is detecting an objective feature of the text that you *would* detect if you read it, regardless of your current dispositions. The goal of criticism, on this view, is to align your dispositions with the objective features of the work, not just to match friends.

  ### Summary Verdict

  The slogan "There's no disputing about taste" is a **category error** when used to settle this argument.
  *   If it means **"Arguments won't change your mind"** (Descriptive), it doesn't tell us whether we should act on recommendations.
  *   If it means **"Beauty is subjective"** (Expressivism), it licenses Commenter A.
  *   If it means **"You must see it to judge it"** (Acquaintance), it licenses Commenter B's skepticism but not their claim of worthlessness.

  The coherent, standard philosophical position is **Aesthetic Realism + The Acquaintance Principle**. This view holds that the book *is* objectively good (contra A), but you cannot know it is good simply by being told (contra B's implication that the info is useless, though B is right that the *judgement* requires reading). The recommendation is valuable as a heuristic for where to direct your attention, not as a substitute for the judgement itself.
