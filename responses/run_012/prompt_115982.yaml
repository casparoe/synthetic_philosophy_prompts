prompt: |-
  I teach an upper-level seminar in democratic theory and I'm putting together this term's final. The boundary problem -- who gets to be part of the demos that does the deciding? -- keeps getting the same canned answers: students recite "all affected interests" vs "all subjected to coercion," mutter that both are vague, and stop. I want one essay question that actually makes them work, and that can't be passed by summarizing the literature.

  Heres the setup I want to build it around. A mid-sized city is voting on whether to annex a neighboring township. Under the charter only current city residents vote. If it passes, township residents fall under city taxes and ordinances but got no vote. A third group -- people who work in the city but live outside both areas -- also got no vote, though city growth and transit decisions hit them too. And the charter requires a two-thirds supermajority for annexation, a rule an earlier generation added precisely to make future annexations hard, so today's voters are trying to lock in the boundaries of future demoi.

  A colleague of mine thinks the whole thing is a pseudo-problem. Her line: a demos never needs justifying "from outside"; it's legitimate so long as (a) insiders can in principle exit and (b) the arrangement stays contestable over time, so any excluded party can petition in and any included party can petition out. On her view legitimacy is retrospective and dynamic -- a running property, not something earned at a founding moment -- so there's no circular founding act to worry about, because there is no founding act; the demos is always mid-stream.

  Write the exam question so students have to (i) judge whether my colleague's move dissolves the boundary problem or just relocates it, (ii) run the annexation case as a test of her view, and (iii) deal with the entrenchment wrinkle -- whether a demos can legitimately fix its own future boundaries. Should be doable in about 50 minutes. Then give me a model answer of roughly 700 words plus a marking scheme out of 20 that cleanly separates an A from a B, naming the specific moves a top answer has to make and the specific mistakes that should cost marks.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar in democratic theory.
      *   **Problem:** Students give canned answers on the "boundary problem" (affected interests vs. coercion) without digging deeper.
      *   **Goal:** Create one essay question that forces critical engagement, prevents mere summarization, and tests specific analytical skills.
      *   **Scenario:** City annexing a township.
          *   Group A: Current city residents (vote).
          *   Group B: Township residents (no vote, but will be taxed/regulated if annexed).
          *   Group C: Commuters (no vote, but affected by growth/transit).
          *   Constraint: 2/3 supermajority required (entrenchment by past generation).
      *   **Colleague's View (The "Dynamic/Procedural" Objection):** Boundary problem is pseudo. Legitimacy is retrospective/dynamic. Key conditions: (a) exit rights, (b) contestability (petition in/out). No "founding moment."
      *   **Task Requirements:**
          1.  Write the exam question (50-minute scope).
          2.  Write a model answer (~700 words).
          3.  Create a marking scheme (out of 20) distinguishing A from B work, specifying required moves and specific penalties.

  2.  **Drafting the Exam Question:**
      *   *Constraint:* Needs to be clear, directive, and fit the 50-minute window.
      *   *Components:* Must address the colleague's claim, apply it to the annexation case, and handle the entrenchment issue.
      *   *Tone:* Academic, precise.
      *   *Drafting:* Start with the scenario. Introduce the colleague's critique. Ask the student to evaluate it.
      *   *Refinement:* Ensure the prompt explicitly asks for the three required elements (i, ii, iii) from the user's description so students don't miss one.

  3.  **Drafting the Model Answer:**
      *   *Length:* ~700 words.
      *   *Argument:* Needs to be nuanced. It shouldn't just say "Colleague is right" or "Colleague is wrong." It needs to show *why* the dynamic view helps but fails to fully solve the specific tensions in the prompt.
      *   *Key Points to Cover:*
          1.  **Assessment of Colleague:** Does it dissolve or relocate? (It relocates the problem from "who decides" to "who decides the rules of contestability").
          2.  **Application to Annexation:**
              *   *Township (Group B):* Coercion is imminent. Exit is hard (moving). Contestability is key. If they can't petition *before* annexation, the dynamic view fails here.
              *   *Commuters (Group C):* Affected interests. Exit is easier (change job?), but is that enough?
          3.  **Entrenchment (The 2/3 Rule):** This is the killer for the colleague's view. If the *current* demos is bound by a *past* demos regarding future boundaries, contestability is blocked. The "mid-stream" argument breaks if the stream is dammed by the past.
          4.  **Conclusion:** The dynamic view mitigates but doesn't dissolve the problem because the *rules of contestability* themselves require a boundary decision.
      *   *Style:* Dense, philosophical, precise terminology (legitimacy, coercion, entrenchment, constitutive rules).

  4.  **Developing the Marking Scheme:**
      *   *Total:* 20 points.
      *   *Differentiation:* Need clear criteria for A (17-20), B (13-16), C (10-12), etc.
      *   *Specific Moves for A:*
          *   Identify that "contestability" itself needs a boundary (who decides the petition rules?).
          *   Distinguish between Group B (coercion) and Group C (interests) in the application.
          *   Recognize entrenchment as a structural barrier to the "dynamic" solution.
      *   *Specific Mistakes for Penalties:*
          *   Merely summarizing "all affected" vs. "all subjected" without applying the colleague's view.
          *   Ignoring the entrenchment/supermajority aspect.
          *   Treating the colleague's view as obviously true or false without analysis.
          *   Confusing exit rights with voice/contestability.

  5.  **Review and Refine:**
      *   *Check Word Count:* The model answer needs to be tight. 700 words is about 1.5 single-spaced pages. I need to ensure it doesn't ramble.
      *   *Check Logic:* Does the model answer actually answer the prompt? Yes.
      *   *Check Marking Scheme:* Is it actionable? Can a TA use this? Yes, by listing specific "Look Fors" and "Red Flags."
      *   *Check Tone:* Ensure it sounds like a professor talking to a colleague (the user).

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the exam question explicitly mentions the 50-minute limit so students pace themselves.
      *   *Correction:* In the model answer, ensure I don't just say "entrenchment is bad." I need to explain *why* it undermines the colleague's specific claim about retrospective legitimacy.
      *   *Correction:* In the marking scheme, make sure the distinction between "relocating" vs "dissolving" is weighted heavily, as that's the core theoretical lift.

  7.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  ### Exam Question

  **Time Allowed:** 50 Minutes
  **Word Limit:** None (but quality over quantity)

  **Prompt:**

  Consider the following case: A mid-sized city is voting on whether to annex a neighboring township. Under the city charter, only current city residents vote. If the measure passes, township residents will fall under city taxes and ordinances but will have had no vote on the matter. A third group—people who work in the city but live outside both areas—also has no vote, though city growth and transit decisions significantly impact them. Additionally, the charter requires a two-thirds supermajority for annexation, a rule entrenched by a previous generation to make future boundary changes difficult.

  A colleague argues that the "boundary problem" is a pseudo-problem. They claim a *demos* requires no external justification at a founding moment. Instead, legitimacy is retrospective and dynamic: it holds so long as (a) insiders can exit and (b) the arrangement remains contestable over time (excluded parties can petition in; included parties can petition out). On this view, the *demos* is always "mid-stream."

  Write an essay that:
  1.  Evaluates whether your colleague's dynamic view **dissolves** the boundary problem or merely **relocates** it.
  2.  Applies this view to the **township residents** and **commuters** in the scenario. Does the dynamic standard justify their exclusion in this specific vote?
  3.  Analyzes the **entrenchment clause** (the two-thirds rule). Can a *demos* legitimately fix its own future boundaries without undermining the "mid-stream" legitimacy your colleague describes?

  ***

  ### Model Answer

  The colleague's dynamic proceduralism offers a compelling evasion of the circular "founding moment" problem, but it ultimately relocates the boundary problem rather than dissolving it. By shifting legitimacy from a substantive criterion (who *should* decide) to a procedural one (can the decision be *challenged*), the argument avoids the infinite regress of "who decides the deciders." However, it smuggles a boundary decision into the definition of "contestability." To determine who is allowed to petition in or out, one must first define the jurisdiction of the petition process. Thus, the boundary problem re-emerges as the question: *Who sets the rules of contestability?*

  Applied to the annexation case, the dynamic view struggles to justify the exclusion of the township residents (Group B). The colleague requires that excluded parties can "petition in." If the annexation vote occurs *before* township residents gain standing to petition the city council, their coercion is immediate and uncontestable. The "mid-stream" argument fails if the stream is diverted before they can board. Exit rights (condition a) are insufficient here; selling a home to avoid new taxes is a high-cost exit that undermines the voluntariness required for legitimacy. For the commuters (Group C), the dynamic view is slightly more permissive. Their interests are affected, but they are not subjected to the same coercive legal authority. If they can petition for transit changes without residency, their exclusion from the *vote* might be consistent with dynamic legitimacy, provided the channel for petition remains open. However, if city growth policy is locked by the annexation vote, their ability to contest is retroactively diminished.

  The entrenchment clause presents the fatal flaw in the colleague's position. The two-thirds supermajority requirement is an attempt by a past *demos* to bind a future *demos* regarding its own composition. The colleague argues legitimacy is retrospective and dynamic, implying each generation renegotiates the terms of association. But entrenchment hardens the boundaries, making the "petition in" mechanism structurally difficult. If the current voters cannot lower the threshold for future annexations, they cannot effectively alter the boundary of the *demos* even if they wish to.

  This violates the "mid-stream" premise. A *demos* that cannot redefine its own edges is not mid-stream; it is dammed. If legitimacy relies on the capacity for contestation, then rules that insulate boundary decisions from simple majority contestation undermine that legitimacy. The past generation has effectively decided the boundary problem for the present one, reintroducing the "founding moment" tyranny the colleague sought to avoid.

  Therefore, the dynamic view does not dissolve the boundary problem. It merely shifts the site of conflict from "who votes" to "who writes the rules of petitioning and entrenchment." In this case, because the township residents cannot contest the annexation before it happens, and because the supermajority rule restricts future boundary adjustments, the arrangement fails the colleague's own test. The boundary problem persists because the rules of dynamic contestation themselves require a boundary to be drawn, and that drawing is subject to the same circularity and coercion concerns as the original vote. Legitimacy cannot be purely retrospective when the structural capacity to revise the retrospective judgment is itself constrained by prior boundaries.

  ***

  ### Marking Scheme (Total: 20 Points)

  **A Range (17–20 Points): Critical Synthesis**
  *   **The "Relocation" Thesis (5 pts):** Explicitly argues that the colleague's view *relocates* the problem (to the rules of contestability/entrenchment) rather than dissolving it. Identifies that defining "who can petition" is itself a boundary decision.
  *   **Differentiated Application (5 pts):** Distinguishes between Township Residents (coercion/high exit cost) and Commuters (interests/lower exit cost). Notes that dynamic legitimacy fails Group B if petition rights come *after* coercion begins.
  *   **Entrenchment Analysis (5 pts):** Identifies the supermajority clause as a structural barrier to the "mid-stream" claim. Explains why binding future boundary decisions undermines retrospective/dynamic legitimacy (the "dammed stream" argument).
  *   **Structure & Clarity (5 pts):** Argument is tight, no fluff, directly addresses all three prompt requirements.

  **B Range (13–16 Points): Competent Application**
  *   **Thesis (3 pts):** Takes a stance on dissolve vs. relocate but may be less precise about *where* the problem relocates.
  *   **Application (4 pts):** Applies the view to the groups but may treat Township Residents and Commuters identically, missing the coercion vs. interest distinction.
  *   **Entrenchment (4 pts):** Discusses the supermajority rule but treats it as merely "undemocratic" rather than explaining why it specifically breaks the *colleague's* dynamic theory.
  *   **Structure (5 pts):** Clear writing, but may spend too much time summarizing the prompt or standard boundary theories (affected/coerced) rather than analyzing the colleague's claim.

  **C Range (10–12 Points): Summary/Description**
  *   **Thesis (2 pts):** Vague on dissolve vs. relocate.
  *   **Application (3 pts):** Generic application (e.g., "exclusion is bad") without using the colleague's specific criteria (exit/contestability).
  *   **Entrenchment (3 pts):** Mentions the supermajority rule but fails to connect it to the temporal/dynamic aspect of the colleague's argument.
  *   **Structure (2 pts):** Significant space wasted reciting "all affected" vs. "all subjected" literature despite the prompt asking to evaluate the *colleague's* specific objection.

  **Red Flags (Automatic Deductions)**
  *   **-3 pts:** Ignores the entrenchment/supermajority wrinkle entirely.
  *   **-3 pts:** Treats the colleague's view as obviously correct or incorrect without analyzing the *mechanism* (exit/contestability).
  *   **-2 pts:** Confuses "exit rights" (leaving the jurisdiction) with "voice/contestability" (petitioning to change rules).
  *   **-2 pts:** Writes primarily about the standard "all affected/coerced" principles without centering the colleague's dynamic challenge.
