prompt: |-
  I sit on my hospital's neuroethics committee and we vote Thursday on a protocol I can't get a clean grip on. A neurology group here wants a first-in-human trial for patients with a fast, fatal neurodegenerative disease: as regions of the brain die off, they replace the lost tissue with a prosthetic that does the same input-output job, one small chunk per surgery, spaced over roughly three years, until by the end most of the relevant circuitry is prosthetic rather than biological. The patients are terminal and have signed on.

  What I have to write up is the consent design. Before every surgery the patient has to pass what the team calls a continuity interview -- life story, recognition of family, their own stated values, and a yes to "do you still feel like the same person" -- and only then can they re-consent to the next stage; if they fail it, everything stops. Their fallback is a directive the patients sign at the outset, saying that if they stop being themselves the team should finish the procedure anyway, since whoever comes out the other side has their memories and their unfinished business. Half the committee thinks that's humane, half thinks its a machine writing its own permission slip, because the thing we're supposed to be testing is the thing doing the testing.

  Draft the short opinion I'll circulate before the vote: approve, reject, or approve with conditions, with a bottom line we can act on, and if it's conditions then the one or two changes that would flip you to a yes, with a deadline we could actually put in the letter. Don't just hand me the standard line that identity isn't what really matters -- I've taught that seminar and it doesn't tell me whether this consent structure is valid. I want your verdict, the strongest case for the side you rule against, what would move you off your position, and where your reasoning is most likely to break down.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion draft:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital neuroethics committee.
      *   **Task:** Draft a short opinion to circulate before a vote on a specific protocol.
      *   **Protocol:** First-in-human trial for fatal neurodegenerative disease. Replaces dying brain tissue with prosthetics over ~3 years. Goal: Most circuitry becomes prosthetic.
      *   **Consent Mechanism:** "Continuity Interview" before each surgery (identity check). If failed, surgery stops. *However*, there's a fallback directive signed at the outset: if they stop being "themselves," finish the procedure anyway (arguing the successor has memories/business).
      *   **Committee Split:** 50/50 (Humane vs. Machine writing permission slip).
      *   **Requirements:**
          *   Verdict (Approve, Reject, Approve with Conditions).
          *   Bottom line for action.
          *   If conditions: 1-2 specific changes to flip to "Yes," with a deadline.
          *   Avoid standard philosophical platitudes ("identity doesn't matter").
          *   Include: Strongest case for the opposing side.
          *   Include: What would move me off my position.
          *   Include: Where my reasoning is most likely to break down.

  2.  **Deconstruct the Ethical Problem:**
      *   **The Core Tension:** Autonomy vs. Non-maleficence/Identity.
      *   **The "Continuity Interview":** Intended to ensure ongoing consent. But if the prosthetic alters the very cognitive machinery required to *pass* the interview, is the interview valid?
      *   **The Fallback Directive:** This is the dealbreaker. It essentially says, "If I lose capacity/identity, ignore the loss of capacity and proceed based on my past self's wish." This bypasses the safeguard (the interview) exactly when the safeguard is most needed.
      *   **The "Machine Writing Permission Slip" Argument:** If the prosthetic influences the patient's desire to continue, the fallback allows the technology to ensure its own installation.
      *   **The "Humane" Argument:** The disease is fatal. The patient wants to live. If the prosthetic saves them but changes them slightly, stopping means death. The "successor" is good enough.

  3.  **Determine the Verdict:**
      *   *Approve?* Too risky. The fallback directive undermines the ongoing consent mechanism.
      *   *Reject?* Too harsh. The science might be promising, and patients are terminal.
      *   *Approve with Conditions?* This is the pragmatic ethical path. It allows the trial but fixes the consent flaw.
      *   *Decision:* **Approve with Conditions.** The fallback directive must be modified or removed to preserve the integrity of the ongoing consent process.

  4.  **Drafting the Content - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Verdict:** Clear and bold.
      *   **Bottom Line:** What needs to happen immediately.
      *   **The Core Objection (Why the fallback is dangerous):** Focus on the *feedback loop*. The prosthetic might alter the valuation of the procedure itself. The fallback pre-commits a future self that might not exist.
      *   **Strongest Case for the Opposition (The "Humane" Side):** Acknowledge the terminal nature. Death is the ultimate loss of identity. If the alternative is death, a changed self is better than no self. The fallback protects the *project* of their life against the *fragility* of their biology.
      *   **Conditions to Flip to Yes:**
          1.  *Remove/Modify the Fallback:* The "stop" decision during the continuity interview must be absolute. No overriding directive.
          2.  *Independent Assessment:* The interview can't be done by the surgical team. Needs a third-party ethicist/psychologist blind to the surgical schedule.
          3.  *Deadline:* Needs to be before the first patient is enrolled/consented.
      *   **What Would Move Me (The "Off Ramp"):** If there were data on *how* the prosthetic affects value judgments (not just memory), I might trust the fallback. Or if there was a "surrogate" decision maker (family) empowered to override the fallback.
      *   **Where My Reasoning Breaks Down:** The "Ship of Theseus" problem. At what point is the "stop" decision actually the disease talking, not the prosthetic? If we stop too easily, we deny life extension based on a philosophical purity test that biology never passes anyway.

  5.  **Refining the Tone:**
      *   Needs to be professional, decisive, yet nuanced.
      *   Avoid academic jargon where possible, but show ethical rigor.
      *   Address the prompt's specific constraint: "Don't just hand me the standard line that identity isn't what really matters." Focus on *consent validity*, not metaphysical identity.

  6.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I include the deadline? Yes.
      *   *Check:* Did I include the opposing argument? Yes.
      *   *Check:* Did I identify where my reasoning breaks? Yes.
      *   *Check:* Is the verdict clear? Yes.
      *   *Critique:* Make sure the distinction between the "Continuity Interview" and the "Fallback Directive" is sharp. The interview is the gate; the fallback is the key that opens the gate even if locked. That's the problem.

  7.  **Final Polish:** Ensure the "Conditions" are actionable. "Remove the fallback" is actionable. "Independent evaluator" is actionable. Deadline: "Prior to IRB final sign-off" or "Within 14 days." Let's go with "Prior to first incision."

      *(Self-Correction on Deadline)*: The prompt asks for a deadline we could put in the letter. "Prior to first incision" is good, but "Prior to final IRB approval of consent forms" is more administrative. Let's use "Prior to enrollment of Patient 1."

      *(Refining the "Break Down" section)*: Be honest. The hard line is arbitrary. Why is interview #4 different from #5? The reasoning breaks down because we don't know the *rate* of change.

  8.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Neuroethics Committee
  **FROM:** [Your Name]
  **DATE:** Wednesday, 17:00
  **RE:** Vote on Protocol 88-B (Neural Prosthetic Replacement Trial)

  **VERDICT:** Approve with Conditions.

  **BOTTOM LINE:**
  We cannot authorize the current consent structure. The "Fallback Directive" (allowing the procedure to continue even if the Continuity Interview is failed) invalidates the safeguard it purports to support. If the interview is the brake, the fallback disconnects the brake line. I will vote **YES** only if the Fallback Directive is removed and the Continuity Interview is administered by an independent third party.

  **ACTION REQUIRED:**
  The Principal Investigators must revise the Informed Consent Document to eliminate the clause allowing the initial advance directive to override a failed intra-trial Continuity Interview. Additionally, the interviewers must be independent of the surgical team. These changes must be submitted and approved **prior to the enrollment of Patient 1.**

  ***

  **RATIONALE**

  My objection is not metaphysical; it is structural. We are dealing with a feedback loop between the technology and the consent mechanism.

  The prosthetic is designed to replicate input-output functions of neural circuitry. However, "values" and "willingness to undergo risk" are also input-output functions of neural circuitry. If the prosthetic alters the patient's risk tolerance or their valuation of their own identity, the device itself could influence the patient to pass the Continuity Interview *or* to invoke the Fallback Directive.

  By signing the Fallback Directive at T=0, the patient is pre-authorizing the technology to bypass their future refusal. This creates a scenario where the trial can proceed even if the subject currently lacks capacity to consent, justified by the signature of a self that no longer exists. This is not autonomy; it is a pre-commitment strategy that allows the research team to bypass the "stop" signal exactly when the technology might be compromising the signaling mechanism.

  **THE STRONGEST CASE AGAINST MY POSITION (The "Humane" Argument)**
  The opposition argues that for terminal patients, biological death is the only true loss of self. If the prosthetic preserves memory and agency, even if "feelings" of identity shift, the patient's life project continues. The Fallback Directive protects the *rational* long-term wish (survival) against the *transient* confusion of neurodegeneration or surgical stress. To demand a passing grade on a philosophical identity test at every stage is to privilege a static notion of "self" that the disease is already destroying. If we stop the trial because the patient "feels different," we are effectively sentencing them to death for failing a purity test. The Fallback ensures the mission survives the method.

  **WHAT WOULD MOVE ME TO UNCONDITIONAL APPROVAL**
  Two things would alleviate my concern regarding the "machine writing its own permission slip":
  1.  **Surrogate Override:** If the Fallback Directive required concurrence from a designated healthcare proxy (family/agent) at the time of the failed interview, rather than relying solely on the initial signature. This adds a human witness to the continuity claim.
  2.  **Data on Value-Stability:** If pre-clinical or early-phase data demonstrated that the prosthetic replacement does not alter value-judgment circuitry (e.g., ventromedial prefrontal functions) distinct from memory or motor function. We are flying blind on whether the chip changes *what they want*, not just *what they remember*.

  **WHERE MY REASONING IS MOST LIKELY TO BREAK DOWN**
  I am drawing a hard line at the point of *expressed refusal* during the trial. My reasoning falters if the "failure" of the Continuity Interview is caused by the disease progression rather than the prosthetic. If the patient fails the interview because the *biological* brain is dying, stopping the surgery ensures death. In that case, my insistence on ongoing consent might be enforcing a "right to die" that the patient explicitly rejected in their initial directive. I am prioritizing the integrity of the consent process over the survival of the patient, assuming the technology is the variable risk, when the disease is the certain killer.

  **RECOMMENDATION**
  Remove the Fallback Directive. If the patient cannot affirm they are the same person, the trial pauses for independent ethical review. We cannot allow an advance directive to override a present-time incapacity in a first-in-human trial where the intervention itself may cause that incapacity.

  Let's fix the form, then save the lives.
