  3.  **Evaluate Requirements (Task 2 & 3):**
      *   *Genuine vs. Prejudice:*
          *   "Real-world tradeoffs happen" is a strong constraint (Moore's "is-ought" gap applies, but reflective equilibrium demands we explain practice).
          *   "Lexical thresholds" is the specific prejudice of the friend's view.
