      *   *Better Candidate:* **The Commensurability vs. Lexicality Tension.**
      *   *Actually, the strongest constraint is:* **The Phenomenological Continuity vs. Moral Discontinuity.** Pain feels continuous. Morality wants to treat extreme pain as discontinuous. Bridging this gap is the hardest technical problem.
      *   *Refinement:* The requirement that does the most work is **"Explain the intuitive validity of small trade-offs without collapsing into the conclusion that extreme suffering is tradeable."** (The Slippery Slope constraint).

