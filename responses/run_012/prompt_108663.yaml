      *   **Constraint:** No reading lists, no survey of who says what. Focus on criteria and collisions.

  2.  **Deconstruct the "Spec" (Task 1):**
      *   *Cases to handle:*
          *   Long dull ache vs. short sharp pain (Intensity/Duration tradeoff).
          *   One person's agony vs. many people's mild discomfort (Aggregation/Scope).
