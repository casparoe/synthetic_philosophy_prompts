answer: |-
  Here is the specification for an adequate axiology of pleasure and pain, followed by the audit of requirements, the collision analysis, and the specific trilemma you flagged.

  ### I. The Specification List
  To count as an adequate account, a theory must successfully map inputs (phenomenological states) to outputs (value judgments) while satisfying the following three categories.

  **1. The Case Load (Intuitions to Accommodate)**
  *   **The Intensity/Duration Trade-off:** Must explain when a longer, milder pain is worse than a shorter, sharper one, and when it is not.
  *   **The Aggregation Problem:** Must determine if $N$ instances of mild discomfort can sum to outweigh one instance of extreme agony. (The "Torture vs. Dust Specks" case).
  *   **The Intra-Personal Trade-off:** Must account for why a person might rationally choose a life with a day of misery for a lifetime of contentment, but might not choose a life of constant agony for any amount of pleasure.
  *   **The Salience Constraint:** Must distinguish between pain that is background noise (shrugged off) and pain that destroys agency (swallows everything).

  **2. The Conceptual Distinctions (Variables to Keep Separate)**
  *   **Sensation vs. Suffering:** Must separate the raw qualia (nociception) from the negative valuation (the "mind's rejection" of the sensation).
  *   **Dimensions of Badness:** Must treat Intensity, Duration, and *Importance* (impact on functioning) as distinct variables, not collapsible into a single "hedon" count.
  *   **Comparability vs. Commensurability:** Must allow that we can say State A is worse than State B (comparable) without necessarily agreeing there is a fixed exchange rate where $X$ units of A = $Y$ units of B (commensurable).
  *   **Scope:** Must distinguish between value within a single life (prudential) and value across lives (moral aggregation).

  **3. The Empirical Constraints (Facts to Respect)**
  *   **The Budget Constraint:** Must explain why society spends resources on mild ailments (dentistry, headaches) and not just extreme ones, implying trade-offs happen in practice.
  *   **Diminishing Returns:** Must account for the fact that relieving the last unit of severe pain is often valued higher than relieving the first unit of mild pain, but not infinitely higher in resource allocation.
  *   **Dissociation:** Must accommodate cases where sensation exists without suffering (e.g., morphine patients, cingulotomy, stoic training).

  ---

  ### II. The Audit: Requirements vs. Prejudices
  Not all items on the spec list are hard constraints. Some are theoretical commitments that rule out competing views by fiat.

  **Genuine Requirements (Hard Constraints)**
  *   **Sensation vs. Suffering:** This is phenomenologically non-negotiable. If a theory cannot distinguish between "hurt" and "mindedness of hurt," it fails to describe reality.
  *   **The Budget Constraint:** A moral theory that forbids all trade-offs in medical triage is practically inert. It must explain *why* we trade, even if it limits *how* we trade.
  *   **Dissociation:** A theory that equates neural firing with moral badness is empirically falsified by pain asymbolia.

  **Camp Prejudices (Theoretical Commitments)**
  *   **Unlimited Aggregation:** The idea that mild pains *must* sum to outweigh agony is a utilitarian prejudice. Non-aggregators reject this.
  *   **Strict Commensurability:** The demand that there *must* be a number representing the exchange rate is an economist's prejudice. Many ethical systems posit qualitative incommensurability.
  *   **The Lexical Threshold:** The claim that there is a sharp line where value goes discontinuous is the specific prejudice of your friend's view. It is not required by the data; it is a solution to the data.

  **Incompatible Pairs (You Cannot Have Both)**
  1.  **Sharp Thresholds + Phenomenological Continuity:** Pain scales continuously (0 to 10). If moral value jumps discontinuously (at 9.5), you must explain why a 0.1 difference in firing rates creates an infinite moral gap. You generally have to accept either "moral vagueness" or "phenomenological discreteness."
  2.  **Unlimited Aggregation + Rights/Constraints:** You cannot hold that mild pains always sum to outweigh agony *and* that individuals have a constraint against being sacrificed for the sum.
  3.  **Subjective Reporting + Objective Badness:** You cannot fully honor the subject's report ("this doesn't bother me") while maintaining an objective list of "bad pains." You must privilege one.

  ---

  ### III. The Trilemma: Lexicality, Expected Value, and Risk
  You asked specifically about the combination of:
  (a) Lexical dominance above a threshold.
  (b) Comparing options by Expected Value (EV) under uncertainty.
  (c) Non-negligible chance of threshold-level suffering occurring.

  **The Verdict:** These three are **logically incompatible** within standard decision theory.

  **The Collision:**
  If suffering above the threshold ($S_{lex}$) is lexically worse than any amount of pleasure ($P$), then in value terms, $V(S_{lex}) = -\infty$ (or a value so large it functionally acts as infinity relative to $P$).
  Expected Value is calculated as $EV = \sum (p_i \times V_i)$.
  If there is a non-zero probability ($p > 0$) of $S_{lex}$, then the $EV$ of that action becomes $-\infty$, regardless of the probability size or the magnitude of the potential pleasure.
  *   *Result:* Any action carrying *any* risk of threshold suffering is forbidden.
  *   *Consequence:* Since almost all complex human activity (driving, building infrastructure, medical trials) carries a non-zero risk of extreme accident/suffering, this combination leads to **moral paralysis**.

  **Which One Gets Dropped?**
  Proponents of lexical views usually sacrifice **(b) Expected Value Maximization**.
  *   **The Fix:** They adopt a **Lexicographic Decision Rule** or a **Risk Threshold**. They argue that EV calculation only applies *below* the lexical threshold. Above the threshold, you switch to a "minimax" or "constraint" rule (e.g., "Minimize the probability of catastrophe first; maximize EV second").
  *   **The Cost:** This fractures decision theory. You no longer have a unified metric for choice. You have a two-tier system: deontological constraints for high-stakes risk, utilitarian calculation for low-stakes risk. This makes the view vulnerable to "boundary cases" (what if the risk is $0.0000001\%$?).

  **Does Giving Up (b) Cost Them the View?**
  It costs them the *simplicity* of the view, but not the core insight. However, it exposes them to the **"Pascal's Mugging"** problem. If a tiny probability of lexical suffering trumps everything, a malicious actor could threaten a tiny risk of torture to demand all your resources. To avoid this, they must introduce a *probability threshold* (ignore risks below $x\%$), which looks arbitrary and undermines the "lexical" seriousness.

  ---

  ### IV. The Killer Requirement
  **Which single requirement does the most work in ruling out popular positions?**

  **The Requirement of Non-Arbitrary Continuity (The Sorites Constraint).**
  *   *Statement:* "If State A is worse than State B, and the difference between them is imperceptible, there cannot be a massive moral discontinuity between them without a principled explanation."

  **How it rules out positions:**
  1.  **Kills Simple Lexical Thresholds:** It forces the question: "Why is 100 units of pain tradeable, but 101 units lexically forbidden?" If the phenomenology is continuous, the moral value usually must be too. This destroys the "sharp line" version of your friend's view.
  2.  **Kills Simple Utilitarianism:** If you insist value is continuous and additive, you are forced to admit that enough dust specks in eyes outweigh torture (by adding enough small numbers). Many find this conclusion unacceptable, so the requirement pushes them away from pure aggregation.
  3.  **Kills Pure Negative Utilitarianism:** If pain is the only disvalue, and value is continuous, you cannot explain why we ever accept pain for pleasure (e.g., surgery, exercise) without a trade-off rate.

  **Can the Lexical Idea Survive This?**
  Yes, but only if it is restated **not as a sharp line in intensity, but as a qualitative shift in kind.**

  To survive the Sorites Constraint, the lexical view must claim that "Threshold Suffering" is not just "More Pain," but "Different Pain."
  *   **The Survival Strategy:** Define the threshold not by intensity (0-10 scale) but by **Agency Destruction**.
  *   *Reformulation:* Pain is commensurable with pleasure *until* the pain destroys the subject's capacity to value anything else (breaks the valuer). Once the valuer is broken, no external pleasure can compensate, because there is no "subject" left to receive the compensation.
  *   *Why this works:* It moves the threshold from a continuous variable (intensity) to a structural variable (functional capacity). A structural break allows for a lexical discontinuity without violating phenomenological continuity.

  **Summary for your group:**
  Don't argue about whether the threshold exists. Argue about whether the threshold is a **quantity** (which fails the Sorites test) or a **structure** (which survives it but requires a specific theory of personhood). And force them to admit they cannot use Expected Value calculations once the threshold is introduced.
