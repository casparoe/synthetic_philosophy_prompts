      *   *Standard Move:* They often switch to a "Constraint" model (Deontology) rather than an "Axiological" model for the lexical part. But the prompt asks about *value*.
      *   *Verdict:* You cannot hold (a), (b), and (c) simultaneously in a standard decision-theoretic framework. Usually, (a) is softened to "lexical for certainty, weighted for risk" or (b) is rejected for "minimax."

  8.  **Refining the "Killer Requirement":**
      *   Is it the Sorites? Yes. The "Spectrum Argument."
      *   If A is worse than B, and B is worse than C... at what point does the lexical threshold kick in?
      *   If it kicks in at point X, why is X lexically worse than X-epsilon?
      *   This requirement (Non-Arbitrariness) kills most lexical thresholds.
      *   *Wait, the prompt asks:* "Which single requirement does the most work in ruling out the popular positions on offer?"
      *   *Answer:* **The Requirement of Trade-Off Explanation.** (Why do we trade in medicine if suffering is paramount?) This kills Pure NU. **The Requirement of Aggregation.** (Why can't mild pains sum to beat agony?) This kills Pure Utilitarianism.
      *   *Best fit:* **The Continuity of Phenomenology vs. Discontinuity of Value.** This forces the theory to explain why a continuous physical/mental state produces a discontinuous moral value.

  9.  **Final Polish:** Check against constraints. No reading lists. Focus on criteria and collisions. Ensure the specific EV/Lexical/Risk trilemma is addressed clearly.

      *(Self-Correction during drafting)*: Make sure to distinguish between *axiology* (what is good) and *decision theory* (how to choose under risk). The prompt mixes them in the trilemma section, so I need to clarify that the collision happens at the intersection.

      *(Refining the "Prejudice" section)*: Be careful not to dismiss the user's friend's view as *just* prejudice, but identify which parts are theoretical commitments vs. empirical observations.

      *(Refining the "Survival" of the Lexical Idea)*: Can it survive? Only if it adopts a non-expected-utility decision rule (like lexicographic decision rules) or denies the continuity of risk (discrete states).

