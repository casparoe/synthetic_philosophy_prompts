      *   **Core Claim:** Suffering below a threshold is commensurable with pleasure (tradeable). Suffering above a threshold is lexically worse than any amount of pleasure (no tradeoff).
      *   **Goal:** Define the *specifications/requirements* for *any* adequate theory of the relative value of pleasure and pain (axiology of welfare), not just argue for/against LTNU.
      *   **Specific Tasks:**
          1.  List requirements for an adequate account (cases to handle, distinctions to maintain, constraints to respect).
          2.  Identify which requirements are genuine vs. camp prejudices.
