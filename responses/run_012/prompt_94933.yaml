  4. The claim that all concepts are innate is a separate thesis that Fodor defended alongside LOTH, but it is not a logical consequence of the hypothesis itself. One could accept the computational architecture of thought without accepting that every atomic symbol is unlearned.
  5. Describing LOTH as a historical curiosity killed by connectionism is incorrect, as classical computationalism remains a viable live option in contemporary cognitive science. Connectionism offered an alternative architecture, but it did not resolve the debates over systematicity that keep LOTH relevant today.
