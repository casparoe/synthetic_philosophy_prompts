  2. The targeting requirement explains why blindsight is unconscious, while the internal state clause explains why phantom pain is conscious but thinking about a rock is not.
  3. This resolves your tension by treating misrepresentation as a content error anchored by a real state, whereas empty higher-order states are generative experiences anchored only by the representation.
  4. You must give up the verdict that misrepresentation and empty higher-order states are structurally identical, though a rival pure higher-order principle would save that intuition by making higher-order content always decisive.
  5. This predicts that if a higher-order state misidentifies a pain as an itch, you will feel the pain's quality but believe it is an itch, rather than feeling an itch itself.
