  Hey so I'm in a third-year consciousness seminar and we've spent the last two weeks on higher-order theories -- the family of views where a mental state is only conscious if there's some higher-order state (a thought about it, or a kind of inner perception of it) that represents it. I've been trying to figure out what I actually believe by going through the cases and just writing down my gut verdicts, and now I'm worried they don't hang together at all, so I want to hand someone the list and ask what principle, if any, they add up to. I'm not after a literature review or anything, just the principle and where it breaks.

  Here are my verdicts. A blindsight patient who correctly guesses the orientation of a bar but insists they're just guessing: not a conscious experience. A word flashed subliminally that then biases someone's answer: the prime never becomes conscious, even though it clearly does causal work. The low hum of the fridge that I only 'notice' when someone asks me if I can hear it, and then realize I've been hearing the whole time: I count that as conscious -- the state was there and then I represented it, a bit after the fact. A higher-order thought that's just about a rock, where no mental state of mine is the target: nothing gets to be conscious, obviously. Then the ones I can't line up. If the higher-order state is itself unconscious -- say I'm masked-primed with the word 'red' while a red patch is up, and the red somehow leaps into my experience -- I want to say the red experience is conscious even though the representing state wasn't. But when the higher-order state gets the content wrong, saying 'red' when the underlying state is a faint grey, I think it's the grey that's conscious and the misrepresentation doesn't conjure a conscious red. And yet when there's no underlying state at all -- a vivid, confident higher-order state representing a pain in a leg that's gone, or an experience that just isn't happening -- I also want to say there IS a conscious experience there, because it feels real to the person. Those last two look like the same kind of case to me (the higher-order state outrunning the first-order facts) but I treat them completely differently, and I can't tell if that's a mistake or a clue. My half-formed principle is 'a state is conscious iff some higher-order representation of it is present', but that seems to make the subliminal prime conscious (don't want) and the empty case not conscious (also don't want), so it's definately wrong somewhere.

  Can you find a principle, or a small set of rival candidates, that gets all of this or close? I especially want to know whether the higher-order representation has to be conscious and whether the first-order state has to actually exist, and which of my verdicts has to go if those pull apart. Give it to me as exactly five numbered points, one or two sentences each, no intro and no conclusion: (1) the principle stated as precisely as you can; (2) for each clause, the case that forces it; (3) how it handles the two cases I keep going back and forth on; (4) which of my verdicts it makes me give up, and the rival principle that would save it; (5) what it predicts for a case I haven't listed.
