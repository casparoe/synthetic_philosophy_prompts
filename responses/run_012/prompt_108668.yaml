prompt: |-
  I'm putting together a lecture on Newton's bucket for my modern philosophy seminar and I want to run my framing past you before I commit to it. My line is that the bucket argument is the decisive case for substantivalism: the water's surface goes concave even when the water isnt rotating relative to the bucket or anything else nearby, so rotation has to be rotation relative to space itself rather than to other bodies — which is exactly what the relationist denies, so relationism is dead. Two things nag at me though. If space is what the water rotates relative to, doesn't that mean space is doing something to the water, and is that even the same claim as "space exists"? And if the bucket gives us absolute rotation, do we also get a fact of the matter about which things are really moving and which are really at rest? A colleague says Mach already handled this by making inertia relative to the distant stars, but that sounds to me like it just hands the relationist a bigger reference body — I can't tell if that's a cheat or a genuinely different position. So: sort out whether my framing holds up, and where the steps are sloppy. If I've got it backwards, say so plainly rather than giving me a smooth answer that plays along; I'd rather find out now than in front of a room of undergrads. American English please, and no citations — I just want the concepts straightened out.
