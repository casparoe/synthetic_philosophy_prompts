prompt: |-
  Last night I lost an argument, or at least failed to win one, with a friend who works in actuarial science, and the dispute was about a sentence I teach but had never had to defend at that altitude. The sentence was of the form "there is a 35 percent chance that this particular person will do X." My friend insists that such a sentence states a fact about the person; I kept insisting that it states a fact only about a class the speaker has silently chosen, and that nothing in the case determines which class that is. He produced the obvious rejoinder — you simply take the narrowest reference class that is still statistically relevant to the outcome — and I said that this either regresses until the class is the person alone, at which point the frequency is zero or one and tells you nothing, or it stops at an arbitrary point. We went around that loop four or five times and neither of us could close it. I would like my students to feel exactly where the loop is, from the inside, rather than hear me describe it.

  I run a philosophy of science seminar: twelve students, mostly second- and third-year, and I have a single ninety-minute session. Design a classroom activity — a game or a structured exercise — that stages the reference class problem so that the students generate it themselves. I want them to commit, in writing, to a probability for a single case and to the reference class they used, before they have any idea that the choice of class is the interesting part; then I want the exercise to make the alternative reference classes impossible to ignore, and to let them discover for themselves that the rule they reach for does not terminate and does not help. By the end they should see three things: that the number was not read off the case but imposed by a class they chose; that for any class they name, a defensible alternative class yields a materially different number; and that the usual repair either regresses to the singleton or halts arbitrarily. The idea has to show up in what happens to them, not in what I say afterward.

  Give me the full apparatus: the case or cases to hand out, the materials, the rules and the scoring, a timeline for the ninety minutes, and the moves I make as facilitator to keep the exercise from collapsing early. I especially want the mechanism by which the students are induced to choose a reference class without noticing that they are choosing, and the moment at which the alternative classes are revealed — I want that to land as a surprise rather than as a lesson. Then the debrief: map what happened at each stage onto the parts of the problem — the frequency interpretation and where it requires a class, the single-case problem, statistical relevance and the narrowest-class rule, and the subjectivist retreat in which the number is merely a degree of belief and the class is whatever the believer happens to find salient. Note which of those the activity actually earns and which I have to supply by talking.

  Two further things. First, tell me what will predictably go wrong the first time I run it and how to handle it — I am particularly worried that the students will litigate the base rates instead of the choice of class, that they will refuse to commit to a single number, or that the scoring will make them think the number is what is being graded rather than the class. Second, be honest about what this activity cannot reproduce. I suspect it can make the conflict vivid and can kill the naive narrowest-class fix, but that it cannot reproduce the positive proposals on either side, nor the metaphysical question of whether there is any fact of the matter about the individual's chance at all. Say so, and say what I will have to add myself for the session to amount to more than a demonstration that a problem exists.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom activity:

  1.  **Analyze the Request:**
      *   **Goal:** Design a 90-minute philosophy of science seminar activity to teach the *Reference Class Problem* (RCP).
      *   **Core Conflict:** The instructor believes probability statements about individuals depend on an arbitrary choice of reference class. The friend (actuary) believes there's a fact of the matter (narrowest statistically relevant class).
      *   **Desired Outcome:** Students must *experience* the loop (commit to a probability/class $\rightarrow$ see alternative classes $\rightarrow$ realize the "narrowest relevant" rule fails/regresses). They should not be told this upfront; they must generate the problem.
      *   **Specific Requirements:**
          *   Full apparatus (cases, materials, rules, scoring, timeline).
          *   Mechanism to induce unconscious class selection.
          *   Moment of surprise (alternative classes revealed).
          *   Debrief mapping activity stages to philosophical concepts.
          *   Troubleshooting (what goes wrong).
          *   Limitations (what the activity *can't* do).
      *   **Audience:** 12 students, 2nd/3rd year, philosophy of science.
      *   **Time:** 90 minutes.

  2.  **Deconstruct the Reference Class Problem (RCP):**
      *   *Step 1:* Assign probability $P$ to individual $I$ doing $X$.
      *   *Step 2:* To get $P$, you need a frequency from a class $C$ where $I \in C$.
      *   *Step 3:* $I$ belongs to infinite classes $C_1, C_2, \dots$
      *   *Step 4:* Different classes yield different frequencies ($P_1 \neq P_2$).
      *   *Step 5:* The "Narrowest Statistically Relevant Class" rule is the standard fix.
      *   *Step 6:* The fix fails because (a) you can always narrow further (regress to singleton), or (b) "relevance" is theory-laden/arbitrary.

  3.  **Designing the Activity - "The Underwriting Game":**
      *   *Concept:* Make the students actuaries/underwriters. They need to price a risk or predict an outcome for a *specific* individual to win points.
      *   *The Hook:* Give them a rich profile of a person. Ask for a probability. They will naturally grab the most salient features (age, gender, job) without realizing they are excluding others.
      *   *The Twist:* Reveal that the "population data" changes drastically depending on which features they prioritized.
      *   *The Trap:* The "Narrowest Class" rule. Let them try to refine their class. Show that refining leads to $N=1$ (frequency 0 or 1) or arbitrary stopping points.

  4.  **Drafting the Materials:**
      *   *Case:* "Alex." Needs to be detailed enough to support multiple classes but specific enough to feel like a single case.
      *   *Data Sheets:* Need to provide frequency tables *after* they commit. This is crucial. If they see the data first, they'll game it.
      *   *Scoring:* Needs to reward accuracy but penalize ambiguity. Actually, to prove the point, the scoring should reveal that *multiple* answers are "correct" based on different valid classes. Or, better yet, the scoring is irrelevant; the *justification* is the point. Let's make the scoring about "Justified Confidence."
      *   *Refinement:* Let's use a betting market analogy. They set odds. The "House" (Instructor) reveals the outcome based on *which class* was used to determine the "true" probability. No, that's too complex.
      *   *Better Approach:* Three Rounds.
          *   Round 1: Naive estimation (unconscious class selection).
          *   Round 2: Data reveal (conflicting classes).
          *   Round 3: The "Fix" (trying to narrow down).

  5.  **Developing the Timeline (90 mins):**
      *   0-10: Intro & Round 1 (Commitment).
      *   10-25: Round 2 (The Data Dump/Surprise).
      *   25-45: Round 3 (The Narrowing Game).
      *   45-60: Small Group Discussion/Argument.
      *   60-90: Debrief/Mapping to Theory.

  6.  **Addressing Specific Constraints:**
      *   *Induce unconscious choice:* Use a "Vignette" that highlights certain traits (e.g., "Smoker," "Athlete") while burying others.
      *   *Surprise:* Hand out "Population Statistics" packets that are segmented differently for different groups (or reveal them sequentially). *Idea:* Split the class. Group A gets Stats Set 1 (focused on Age/Job), Group B gets Stats Set 2 (focused on Genetics/Location). They compare numbers. They differ. Why?
      *   *The Loop:* Ask them to combine the stats. Show that combining leads to small sample sizes.

  7.  **Refining the "Trap":**
      *   Let's create a specific scenario: "Will Alex develop Condition Z by age 50?"
      *   Profile: 30yo Male, Accountant, Smoker, Lives in City, Father had Condition.
      *   Round 1: Write down % chance. Write down *why* (implicitly selecting class).
      *   Round 2: Distribute "Actuarial Tables."
          *   Table A: By Profession (Accountants: 10%)
          *   Table B: By Habit (Smokers: 40%)
          *   Table C: By Genetics (Family History: 60%)
          *   Table D: By Intersection (Smoking Accountants: 25%)
      *   Round 3: Ask them to find the *true* number. They will try to intersect all.
      *   The Kicker: Table E (Smoking Accountants with Family History in City): $N=3$ in the dataset. Frequency is unstable.
      *   The Singleton: Alex is unique. Frequency is 0 or 1.

  8.  **Troubleshooting:**
      *   *Litigating Base Rates:* Students might argue the data is fake. *Fix:* Stipulate the data is authoritative for the game.
      *   *Refusing to Commit:* *Fix:* Make it a graded entry ticket.
      *   *Scoring:* Don't grade the number. Grade the *stability* of the justification.

  9.  **Debrief Mapping:**
      *   Round 1 $\rightarrow$ Frequency Interpretation (hidden class).
      *   Round 2 $\rightarrow$ The Multiplicity of Classes.
      *   Round 3 $\rightarrow$ Failure of Narrowest Class Rule (Small N problem).
      *   Conclusion $\rightarrow$ Subjectivism/Propensity.

  10. **Limitations:**
      *   Doesn't solve the metaphysics.
      *   Doesn't prove Subjectivism is right, just that Frequentism struggles here.
      *   Need to lecture on Propensity/Bayesianism afterwards.

  11. **Review against constraints:**
      *   12 students? Yes, small group dynamics work well.
      *   90 mins? Yes, timeline fits.
      *   "Feel the loop"? Yes, by trying to narrow the class and hitting the "Small N" wall.
      *   "Surprise"? Yes, via the conflicting data tables.

  12. **Final Polish:**
      *   Make the instructions crisp.
      *   Ensure the "Facilitator Moves" are specific (when to interrupt, when to stay silent).
      *   Clarify the "Data Packets" mechanism. (Best to give everyone the *same* packet but ask them to choose *which* table applies, OR give different packets to show divergence. Let's go with One Packet with Multiple Tables to show internal conflict).
      *   *Correction:* To make the "unconscious choice" vivid, I should ask them to write down the class *before* showing the tables. Then show tables that contradict their chosen class's frequency.

      *(Self-Correction during drafting)*: Wait, if I give them all the tables at once in Round 2, they will just pick the one that matches their Round 1 guess. I need to force the conflict.
      *Revised Plan:*
      1.  Read Vignette.
      2.  Write Probability + **The Specific Group Description** used to derive it. (Crucial: Force them to name the class).
      3.  Reveal Data: Show that the class they named has Frequency X, but a *slightly different but equally valid* class has Frequency Y.
      4.  Challenge: "Refine your class to be more accurate."
      5.  Reveal: As you refine, N drops. At the limit, N=1.

      *Let's flesh out the "Data Packets".*
      Actually, a "Database Query" simulation works best.
      You have a database of 10,000 past cases.
      Query 1: Males $\rightarrow$ 20%
      Query 2: Smokers $\rightarrow$ 50%
      Query 3: Male Smokers $\rightarrow$ 35%
      Query 4: Male Smokers + Accountants $\rightarrow$ 32%
      Query 5: Male Smokers + Accountants + Family History $\rightarrow$ 2 cases found. 1 yes, 1 no. (50%? Unreliable).

      This visualizes the regression perfectly.

  13. **Finalizing the Output Structure:**
      *   Activity Title.
      *   Learning Objectives.
      *   Materials.
      *   Timeline.
      *   Step-by-Step Instructions (The "Script").
      *   Facilitator Moves.
      *   Troubleshooting.
      *   Limitations & Debrief Guide.

  14. **Writing the Content:** (Focusing on tone: professional, pedagogical, precise). *Ensure the distinction between the "fact about the person" vs "fact about the class" is the central tension.*

      *Wait, one nuance:* The prompt asks for the students to commit *before* they know the class choice is the interesting part.
      *Adjustment:* In Round 1, ask "What is the chance?" and "What facts did you consider?" Do *not* ask "What reference class did you use?" yet. Let them describe the *person*. Then, in debrief, show that describing the person *is* choosing the class.
      *Actually, better:* Ask them to write the probability and the **rule** they used. E.g., "I looked at smokers." This forces the class selection without using the jargon "reference class."

      *Okay, ready to draft.*
answer: |-
  # Activity Title: The Underwriter's Dilemma

  ## Learning Objectives
  By the end of this 90-minute session, students will have:
  1.  **Committed** to a single-case probability based on an implicit reference class.
  2.  **Discovered** that equally valid alternative classes yield contradictory probabilities for the same case.
  3.  **Attempted** to resolve the conflict using the "narrowest relevant class" rule and experienced its regression to the singleton (N=1) or arbitrary halt.
  4.  **Internalized** the Reference Class Problem not as a definition, but as a practical impasse they generated.

  ## Materials Required
  1.  **The Case File (Handout A):** A one-page profile of a specific individual.
  2.  **The Actuarial Database (Handout B):** A set of frequency tables derived from a historical dataset of 10,000 similar cases.
  3.  **Prediction Slips:** Small index cards for anonymous submission.
  4.  **Whiteboard/Projector:** To track the "Query Log" (see Timeline).
  5.  **Timer:** Visible to the class.

  ## The Case File (Handout A)
  *Design Note: The profile must contain multiple statistically relevant features that pull in different directions.*

  > **Subject:** Alex V.
  > **Age:** 45
  > **Occupation:** High-stress Emergency Room Physician
  > **Location:** Urban Center (Population > 1M)
  > **Habits:** Smokes 1 pack/day; Runs 5km daily.
  > **Family History:** Father died of Cardiac Event at 50.
  > **Biomarkers:** Cholesterol slightly elevated; Blood pressure normal.
  >
  > **Question:** What is the probability (0-100%) that Alex will suffer a major Cardiac Event before age 60?

  ## The Actuarial Database (Handout B)
  *Design Note: This is the trap. It provides frequencies for overlapping classes that contradict.*

  > **Dataset:** 10,000 Historical Medical Records (Demographically Matched)
  >
  > | Query Filter | Sample Size (N) | Frequency of Event |
  > | :--- | :--- | :--- |
  > | **All Subjects** | 10,000 | 15% |
  > | **Males, Age 45-50** | 2,500 | 18% |
  > | **Smokers** | 3,000 | 35% |
  > | **Physicians** | 150 | 12% |
  > | **Smokers + Physicians** | 40 | 28% |
  > | **Family History + Smokers** | 500 | 45% |
  > | **Runners + Smokers** | 200 | 30% |
  > | **Physicians + Family History** | 30 | 20% |
  > | **Physicians + Smokers + Family History** | **8** | **37.5% (3 events)** |
  > | **All Above Factors (The "Alex" Class)** | **1** | **? (See Facilitator)** |

  ---

  ## Timeline (90 Minutes)

  ### Phase 1: The Naive Commitment (00:00 – 00:15)
  *   **00-05:** Distribute **Handout A**. Do not mention "reference classes," "frequencies," or "philosophy." Frame this as a practical decision task.
      *   *Script:* "You are junior underwriters. You have one minute to read the file. You must issue a risk probability for Alex. This number will be recorded. There is no 'correct' answer yet, but you must commit."
  *   **05-10:** Students write their percentage on the **Prediction Slip**.
      *   *Crucial Constraint:* On the back of the slip, they must answer: **"Which three facts about Alex were most decisive for your number?"** (This forces class selection without naming it).
  *   **10-15:** Collect slips. Do not look at them. Tell students: "I have locked in your positions. Now I will give you the data you would have used to justify them."

  ### Phase 2: The Data Shock (00:15 – 00:35)
  *   **15-20:** Distribute **Handout B**. Give them 5 minutes to analyze the tables silently.
      *   *Facilitator Move:* Watch for the moment they notice the contradictions (e.g., Physicians = 12% vs. Smokers = 35%).
  *   **20-25:** Ask three students to read their original percentage and the "decisive facts" they wrote. Write these on the board.
      *   *Example:* Student 1: "40% (based on Smoking + Family History)." Student 2: "15% (based on Physician + Runner)."
  *   **25-35:** **The Confrontation.**
      *   *Script:* "Look at Handout B. Student 1 chose the 'Smoker + History' class. The data says 45%. Student 2 chose 'Physician + Runner.' The data says roughly 12-30%. You are all looking at the same person, the same database, and you have generated mutually exclusive facts about Alex's future. Which row in Handout B is the *truth*?"
      *   *Task:* In pairs, decide on the **Single Correct Row** from Handout B that represents Alex. You must agree on one row.

  ### Phase 3: The Narrowing Loop (00:35 – 00:55)
  *   **35-45:** Pairs report their chosen row. Most will choose the most specific one available ("Physicians + Smokers + Family History" = 37.5%).
      *   *Facilitator Move:* Validate this intuition. "Good. You are applying the Principle of Statistical Relevance. Use the narrowest class that is still statistically significant."
  *   **45-50:** **The Trap.**
      *   *Script:* "But wait. Alex also lives in an Urban Center. We have data for Urban vs. Rural. If we add 'Urban' to your specific class, does the probability go up or down?"
      *   *Action:* Reveal (verbally or on board) that adding 'Urban' splits the N=8 group into N=3. Adding 'Cholesterol' splits it into N=1.
  *   **50-55:** **The Singleton Wall.**
      *   *Script:* "If we follow your rule—narrow the class until no relevant fact is left out—we arrive at the class containing only Alex. What is the frequency of cardiac events in the class 'People exactly like Alex'?"
      *   *Outcome:* Students must realize the frequency is either 0% or 100% (it already happened or it didn't), which destroys the predictive utility. Or, they must admit they stopped narrowing at an arbitrary point (e.g., N=8).

  ### Phase 4: Structured Debrief (00:55 – 01:30)
  *   Map the activity stages to the philosophical concepts (see Debrief Guide below).

  ---

  ## Facilitator Moves: Keeping the Loop Tight

  1.  **Prevent Base Rate Litigation:** If a student says, "This database is too small," or "Physicians shouldn't be grouped this way," stop them.
      *   *Move:* "For the purpose of this underwriting firm, Handout B is the *only* authorized data. You cannot question the data, only your selection of it." (This mirrors the philosophical constraint: we assume the frequencies are true, the problem is *which* frequency applies).
  2.  **Enforce Commitment:** If a student says, "It depends," during Phase 1:
      *   *Move:* "In this market, 'it depends' is a rejected claim. You must post a number to trade. Pick one."
  3.  **The "Relevance" Pivot:** When they try to narrow the class in Phase 3, ask: "Is 'Urban Living' statistically relevant to cardiac events?" If they say yes, you *must* include it. If they say no, ask for the p-value. (They won't have it). This forces them to see that "relevance" is often a judgment call, not a data fact.
  4.  **Silence is a Tool:** During Phase 2 (Data Shock), when they realize the numbers contradict, do not speak. Let the discomfort of the contradiction sit for a full minute.

  ---

  ## Troubleshooting: Predictable Failures

  **1. Students litigate the data quality.**
  *   *Symptom:* "Real actuarial tables would control for confounding variables."
  *   *Fix:* Remind them this is a *philosophy* seminar, not an actuarial exam. The problem holds even with perfect data. "Assume these frequencies are the Laws of Nature for this universe. The problem is not the data; it is the mapping."

  **2. Students refuse to commit to a number.**
  *   *Symptom:* Writing ranges (30-40%) or "Unknown."
  *   *Fix:* The Prediction Slip rules must state: "Single integer only. No ranges." If they rebel, collect the slip anyway and mark it as 'Default: 50%'. This usually provokes enough irritation to ensure compliance next time.

  **3. Students think the "Narrowest Class" worked.**
  *   *Symptom:* They settle on the N=8 row and feel satisfied.
  *   *Fix:* You must manually drive the regression. "Okay, N=8. Alex also drinks 2 coffees a day. Is that relevant? If you don't know, can you justify excluding it? If you include it, N drops to 5. Where do you stop?" Force them to identify the *stopping rule*, not just the number.

  **4. Scoring confusion.**
  *   *Symptom:* Students ask, "Which number gets the A?"
  *   *Fix:* Explicitly state: "You are not graded on accuracy. You are graded on the coherence of your justification in the debrief. The point of this exercise is to fail to find the 'true' number."

  ---

  ## Debrief Guide: Mapping Experience to Theory

  *Do not lecture until minute 55. Use their experience as the text.*

  | Activity Stage | Student Experience | Philosophical Concept | Facilitator Script |
  | :--- | :--- | :--- | :--- |
  | **Phase 1** | "I picked a number based on the facts that seemed important." | **The Frequency Interpretation:** Probability *requires* a class, but we often hide the class selection behind "salience." | "You didn't read the probability off Alex. You imposed it by selecting features. You acted as Frequentists without knowing it." |
  | **Phase 2** | "Different features gave different numbers. Which is true?" | **The Reference Class Problem:** An individual belongs to infinite classes with different frequencies. | "There is no 'Alex's Probability.' There is only 'Alex's Probability relative to Class C.'" |
  | **Phase 3** | "We tried to narrow the class, but ran out of data or hit N=1." | **Failure of the Narrowest Class Rule:** Regress to singleton (0 or 1) or halt arbitrarily. | "The rule 'use the narrowest relevant class' has no termination condition. It either destroys the frequency (N=1) or relies on an arbitrary cutoff." |
  | **Phase 4** | "So the number is just our belief?" | **Subjectivism / Propensity:** The retreat to degree of belief or metaphysical propensity. | "If the frequency is unstable, is the 35% a fact about the world, or a fact about your state of knowledge? This is where your friend the actuary and I disagree." |

  ---

  ## Limitations: What This Activity Cannot Do

  You must be honest with yourself (and eventually the students) about the boundaries of this exercise.

  1.  **It Does Not Solve the Metaphysics:**
      *   *Limitation:* The activity devastates the Naive Frequentist view, but it does not prove Subjectivism (Bayesianism) or Propensity Theory is *true*. It only shows Frequentism has a specific vulnerability in single-case prediction.
      *   *Your Add-on:* You must lecture on how Bayesians handle this (priors update with evidence, avoiding the need for a hard frequency class) or how Propensity theorists argue the chance is a physical property of the setup, not the class. The activity kills the straw man; you must build the live options.

  2.  **It Cannot Reproduce "Statistical Relevance" Rigor:**
      *   *Limitation:* In the game, "relevance" is hand-waved. In real science, relevance is determined by causal models, not just correlation.
      *   *Your Add-on:* You need to explain that modern causal inference (e.g., Structural Equation Models) attempts to solve RCP by identifying *causal* reference classes rather than *statistical* ones. The activity shows the statistical failure; you must point to the causal repair.

  3.  **It Risks Cynicism:**
      *   *Limitation:* Students may leave thinking "All probability is arbitrary."
      *   *Your Add-on:* Emphasize that while the *single case* is problematic, the *aggregate* predictions remain robust. Insurance companies still make money. The problem is ontological (what is chance?), not necessarily pragmatic (does it work?).

  ## Final Facilitator Note
  Your friend the actuary will argue that in practice, we use **machine learning models** that weight all features simultaneously, avoiding the manual class selection.
  *   *Counter-move for Seminar:* Acknowledge this. But point out that a Random Forest or Neural Net is essentially a complex, weighted aggregation of... **reference classes**. The black box still relies on the training data's classification structure. The problem hasn't vanished; it has been hidden in the architecture. Use this to close the session: "The problem is not solved; it is merely automated."
