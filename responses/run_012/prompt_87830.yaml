prompt: |-
  I'm in a bioethics reading group and we've spent like three sessions circling the therapy-vs-enhancement distinction in the abstract and I'm honestly getting tired of thought experiments, so I want to nail it down to a real practice instead: the anti-doping regime, specifically the Therapeutic Use Exemption system. Here's whats been bugging me. WADA keeps a list of substances a healthy athlete can't take because they're performance enhancing, but it also runs a process where if you have a documented medical condition you can get a permission slip — a TUE — to take something on that list anyway. And the weird part is the baseline they're trying to protect. A guy who just naturally walks around with sky-high endogenous testosterone is completely fine, no exemption, nothing to explain. But a guy with a diagnosed deficiency who takes testosterone to get back to a normal level has to apply and can get turned down, sometimes because the dose would push him past whatever ceiling they use (I think there's some testosterone-to-epitestosterone ratio threshold involved but I forget the details). So on one reading the system says: your natural endowment is the fair starting line, anything you add on top is cheating. But then the exemption itself moves someone from below-average up to average, or even above, which by that same logic should also count as cheating. Then when you cross over into ordinary medicine it seems to flip — insurers and health systems will pay to fix a genuine hormone deficiency, but they usually balk at covering growth hormone for a kid who's just very short with no deficiency at all, even though that kid is plainly suffering socially. What I want from you is a reconstruction of what the anti-doping TUE system actually presupposes — what view of health, disease, and normal species-functioning it only makes sense under. Does it strictly need a sharp therapy/enhancement line, or can it get by with something looser like 'treatment of a diagnosed pathology'? Which rival accounts of the distinction does it quietly rule out, and which rival accounts would fit the practice just as well (i.e. where is it underdetermined)? And is there a deflationary reading where none of it is about biology at all and it's really just enforcing a social convention of 'no extra help'? Then tell me what would concretely have to change in the rulebook if you swapped the presupposed view for a rival one — say a straight welfarist view that only asks whether the intervention leaves the athlete better off and doesn't care about restoring vs exceeding. And separately, is the inconsistency I'm pointing at actually real, or am I conflating two different practices (sport vs. insurance) that are allowed to presuppose different things? I'd like to know whether both can be defended at once or whether one of them has to give.

  Please give me your answer as a JSON object with exactly these fields: 'presupposed_theory' (a short name plus a one-paragraph statement of the view the practice presupposes), 'key_commitments' (array of strings, each a specific commitment the practice requires), 'rival_views_ruled_out' (array of objects with 'view' and 'why_ruled_out'), 'rival_views_compatible' (array of objects with 'view' and 'why_it_also_fits'), 'internal_consistency' (a paragraph on which parts of the practice hang together and which pull against each other), 'underdetermined_aspects' (array of strings), 'welfarist_replacement_consequences' (array of strings, each a concrete rulebook change), and 'verdict_on_my_inconsistency_claim' (a short paragraph). Keep it in the weeds — I don't want a survey of the literature, I want the actual commitments pinned down, including any places where the practice is doing something other than what its official rationale says.
