answer: |-
  You have correctly identified one of the most contentious and difficult problems in modern moral philosophy and decision theory. Your intuition is not just "something's off"; you have independently reconstructed a known objection to **Expected Value (EV) Maximization**.

  There is an established name for the broader framework, but the specific rhetorical move you are describing is best labeled **"Probability Swamping"** (sometimes discussed under the header of **Decision-Theoretic Fanaticism**).

  Here is the carving you asked for: what this move is, when it is legitimate, when it is a trick, and where the line is drawn between insects and cells.

  ### 1. The Name and The Mechanism

  The broad framework your friend is using is **Expected Value Maximization**. The formula is simple:
  $$ \text{Moral Priority} = \text{Population} (N) \times \text{Probability of Sentience} (P) \times \text{Intensity of Suffering} (S) $$

  Your friend is arguing that because $N$ (insects) is astronomically high, it compensates for a low $P$ (sentience probability), resulting in a higher Moral Priority than chickens or humans.

  The specific move you identified—using a massive $N$ to overwhelm uncertainty about $P$—is **Probability Swamping**. In philosophical literature, when this leads to absurd conclusions (like prioritizing dust specks over people), it is called the **Fanaticism Problem**. It is a finite, empirical cousin of **Pascal's Mugging**.

  *   **Pascal's Mugging:** A threat of *infinite* disutility with *tiny* probability demands action.
  *   **Probability Swamping:** A threat of *finite but massive* disutility with *tiny* probability demands action.

  You were right to distinguish it from Pascal's Wager. Pascal's Wager relies on infinity to break the math. Probability Swamping relies on **scale** to break the math.

  ### 2. The Carving: Legitimate Calculation vs. Rhetorical Trick

  The reason this feels like a con is that the formula looks like math, but it often functions as magic. It turns ignorance into certainty. Here is how to distinguish the legitimate use from the trick.

  #### A. The Source of the Probability ($P$)
  *   **Legitimate:** $P$ is **Epistemic**. It is based on positive evidence (neuroscience, behavior, evolutionary homology). We don't know *if* insects feel pain, but we know they have nociceptors and opioid receptors. $P$ is estimated based on data (e.g., "There is a 10% to 50% chance").
  *   **The Trick:** $P$ is **Logical**. It is based merely on the fact that we cannot disprove sentience. "We can't prove a rock *doesn't* feel pain, so $P > 0$." If $P$ is derived solely from "it is not impossible," then $P$ is a placeholder for ignorance, not a measurable quantity.
      *   *The Test:* If you ask "What evidence would lower $P$?" and the answer is "Nothing, short of metaphysical impossibility," it's a trick.

  #### B. The Independence of $N$ and $P$
  *   **Legitimate:** The population count ($N$) and the probability ($P$) are independent variables. The number of insects exists regardless of our moral calculation.
  *   **The Trick:** The argument implicitly allows $N$ to adjust to save the conclusion. If you challenge $P$ for insects, the friend moves to nematodes ($N$ is bigger). If you challenge nematodes, they move to bacteria. If $N$ is always available to bail out a shrinking $P$, the argument is unfalsifiable. This is the "works for anything" feeling you had.

  #### C. Tractability (The Ability to Act)
  *   **Legitimate:** We can actually reduce the suffering. If we prioritize insect welfare, there are concrete interventions (e.g., humane pest control, habitat preservation) that reliably reduce suffering.
  *   **The Trick:** The suffering is vast, but our leverage is negligible. Even if there are ten trillion sentient nematodes, if we have no idea how to help them without causing more harm, the **Expected Value of Action** is zero or negative. A huge moral problem that cannot be solved does not demand moral *effort*, only moral *regret*.

  ### 3. Where is the Line? (Insects vs. Cells)

  You asked where the line is between a real reason to act and a license to believe anything. The line is **Epistemic Grounding**.

  **The Insect Case (Plausible):**
  Insects have centralized nervous systems, nociceptors (pain receptors), and exhibit avoidance learning that is modulated by analgesics.
  *   **$P$ is not arbitrary:** It is grounded in biology. It might be 0.1 or 0.5, but it is not $10^{-100}$.
  *   **$N$ is empirical:** We actually count them.
  *   **Verdict:** This is a **Legitimate Expected Value Calculation**. It is debatable, but it is not a trick. Your friend is right that insect welfare *could* outweigh chicken welfare if $P$ is high enough. This is a serious position held by many effective altruists.

  **The Cell/Nematode Case (The Trick):**
  Single cells or simple nematodes lack the hardware associated with integration of information required for consciousness (on almost all current theories of mind).
  *   **$P$ is effectively zero:** While logically possible ($P > 0$), epistemically, the probability is so close to zero that multiplying it by $N$ is noise.
  *   **The "Google" Problem:** If you allow $P = 1/\text{googol}$, you must also accept that a single human might be worth $10^{100}$ insects. If you accept tiny probabilities for sentience, you must accept tiny probabilities for *moral weight*. The math eats itself.
  *   **Verdict:** This is **Probability Swamping**. It uses the vastness of $N$ to hide the emptiness of $P$.

  ### 4. Why Your Gut Was Right (The "Unbounded" Problem)

  Your intuition that "the argument seems to work no matter what the probability is" is the **Fanaticism Objection**.

  If you accept your friend's logic unreservedly, you fall into **Decision-Theoretic Fanaticism**. This is the view that you should *always* pursue the option with the highest expected value, no matter how tiny the probability, provided the payoff is large enough.

  **Why this is dangerous:**
  1.  **It creates a hierarchy of speculation:** The most speculative, unprovable claims (aliens, simulation theory, panpsychism in rocks) always win over concrete, known suffering (humans, cows), because you can always imagine a bigger number ($N$) for the speculative claim.
  2.  **It ignores opportunity cost:** Resources spent trying to save hypothetical sentient dust specks are resources *not* spent saving actual screaming children.
  3.  **It breaks decision theory:** If every action has a tiny probability of causing infinite harm (e.g., "walking outside might trigger a quantum vacuum collapse"), Expected Value theory says you should never move.

  ### 5. Summary Definition

  If you need a term to use in your debate, use **"Probability Swamping."**

  **Definition:** *Probability Swamping is a rhetorical move where a massive population size ($N$) is multiplied by an epistemically ungrounded probability ($P$) to generate a moral imperative that overrides concrete, evidence-based moral claims.*

  **When it is valid:**
  *   $P$ is based on positive evidence (neuroscience/behavior), not just logical possibility.
  *   $N$ is empirically verified.
  *   Interventions are tractable (we can actually help).

  **When it is a trick:**
  *   $P$ is based on "we can't disprove it."
  *   $N$ is inflated to compensate for lack of evidence.
  *   The conclusion changes arbitrarily based on which large population is selected (insects vs. nematodes vs. bacteria).

  **The Verdict on Your Friend:**
  She is half-right. Insect welfare is a serious moral consideration because insects have nervous systems ($P$ is grounded). However, her *method* of argument is risky. If she argues that we must prioritize insects *solely* because the numbers are big, even if the chance of sentience is "one in a million," she is engaging in Probability Swamping. She needs to defend why $P$ is one in a million rather than one in a googol. If she can't defend $P$ with evidence, the big number doesn't save her.

  You are right to be suspicious of the *structure* of the argument, even if the *conclusion* (care about insects) might still be true. The math shouldn't do the work that the biology failed to do.
