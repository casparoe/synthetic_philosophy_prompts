answer: |-
  **Conceptual Map**

  For a compromise to be a *gain from trade* rather than a *mutual loss*, the parties must not merely split the difference (which often destroys the integrity of both values). Instead, they must find a configuration where the *relationship* between the values changes. Incommensurability argues that there is no common currency (you cannot buy *Sanctity* with *Efficiency*). The "Sacred Value" objection posits that some goods (like the *Hearth*) are protected from trade-offs; to price them is to destroy them. Therefore, a genuine compromise must accommodate the sacred value without pricing it, usually by imposing a cost on the *negotiable* values of the other party (the *Claim*), while acknowledging that the sacred party also pays a price in *context* (the *Kin* are strained). The result is often not a "gain" in the economic sense, but a *survival* of both systems in a modified topology.

  ***

  **The Surveyors and The Dwellers**

  The **Surveyors** brought their tripods to the green,
  To fix the **Line** where none had stood before.
  They sought to **Measure** all the land between,
  And file a **Claim** against the forest floor.
  The **Dwellers** watched them from the door,
  Protecting smoke above the **Hearth**,
  And traced the old and winding **Path**,
  Where every stone knew every **Kin**.

  The **Kin** recalled the stories of the **Line**,
  How iron stakes could cut a **Path** in two.
  They refused to let their history **Measure**
  Against the **Claim** of men in coats of blue.
  But hunger pressed the **Hearth** to do
  What pride forbade: to shift the **Kin**.

  So **Claim** met **Claim** across the **Hearth**,
  A collision of the **Line** and **Kin**.
  The Surveyors saw they could not **Measure**
  The weight of smoke, nor map the **Path**
  Of memory. To force the **Line**
  Would burn the **Hearth** to ash and **Kin**.

  They chose to **Measure** out a new **Path**,
  A curve that bowed around the **Hearth**.
  It cost the straightness of the **Line**,
  And scattered some of **Kin** from **Kin**.
  The Dwellers kept the **Hearth**, but lost the **Claim**
  To say the land was theirs to **Measure**.

  Now **Hearth** stands close to Surveyor **Line**,
  A sacred stone within a **Claim** of **Measure**.
  The **Kin** walk wide to find the **Path**,
  No longer one, but bound by **Line**.
  The **Claim** is less, the **Hearth** is safe,
  But silence fills the **Kin**.

  So pay the price in **Line** and **Measure**,
  Yield the absolute **Claim** to save the **Hearth**,
  And walk the longer **Path** with fractured **Kin**.
  Is this a gain? Or just a truce unnamed?
  Where **Hearth** remains, but **Kin** are strained,
  And **Measure** bows to **Line**.

