      *(Drafting thought)*: Make sure Marcus clarifies that the "community" includes the engineers correcting the model during RLHF (Reinforcement Learning from Human Feedback). That's his "practice of correction."
      *(Drafting thought)*: Make sure Elena clarifies that "sensorimotor" isn't just touching, it's the *expectation* of change based on action.

