      *Refining the "Ex-ante vs Ex-post" point:* Good's value is calculated *before* seeing the signal (expectation over signals). The preference for ignorance is often about avoiding the *realized* state of having seen a specific signal. But actually, the decision to test is also ex-ante. So the conflict is in the *utility assignment* to the states. The ex-ante calculation in the human case includes the anticipated pain of knowing. Good's calculation assumes the pain of knowing is zero or irrelevant.

