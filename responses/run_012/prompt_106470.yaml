          *   Type of Value: Experiential, intrinsic value of mental states, ex-post utility.

  3.  **Identify Points of Divergence (The "Where they come apart" section):**
      *   *Instrumental vs. Intrinsic:* Good treats info as a tool for action. Humans often treat info as an experience itself (which can be painful).
      *   *Ex-Ante vs. Ex-Post:* Good looks at expectation before receiving info. Preference for ignorance often cares about the *experience* of knowing after the fact.
      *   *Stable Preferences:* Good assumes $U(outcome)$ is constant. Humans often have $U(outcome, knowledge\_state)$. Knowing changes the utility of the outcome (e.g., knowing you are dying makes the remaining time suffer-filled).
      *   *The "Ignore" Option:* Good says you can act *as if* you didn't know. But you can't *feel* as if you didn't know. The cognitive state is irreversible.

  4.  **Drafting - Section by Section (incorporating into continuous prose):**

