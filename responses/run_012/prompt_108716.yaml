answer: |-
  ### Desiderata for a Theory of Pattern-Reality

  To license ontological commitment rather than mere pragmatic recommendation, a theory of pattern-reality must satisfy the following requirements. Each is motivated by the need to distinguish *real structure* from *artifact*, *noise*, or *linguistic convention*.

  #### 1. The Non-Triviality Constraint
  **Specification:** A description does not count as detecting a pattern if the description length (including the specification of the language used) is not strictly shorter than the data it describes. A language cannot contain a primitive symbol for the specific data set in question.
  **Motivation:** Prevents "reality" from being conjured by linguistic fiat. If we allow a symbol $S$ to mean "this exact universe," we have compressed the universe to one bit, but gained no ontological insight.
  **Test Cases:**
  *   *Tautological Language:* A data set described in a language containing a primitive for that set fails this constraint.
  *   *Normal Number:* A text containing every finite string allows a short description ("the $n$-th digit of $\pi$"), but locating a specific prediction within it requires reproducing the text. The search cost negates the compression gain.
  **Status:** **Non-Negotiable.** Without this, the theory collapses into nominalism.

  #### 2. The Modal Describer Condition
  **Specification:** A pattern is real if a *physically possible* describer could compress the data, regardless of whether an *actual* describer has done so. Existence is not hostage to actual discovery, but it is hostage to physical possibility.
  **Motivation:** Preserves the intuition that the world had structure before observers existed, without retreating to a "God's eye view" that ignores the relational nature of information.
  **Test Cases:**
  *   *Unnoticed Pattern:* A pattern no one has noticed is real if a physically possible device could detect it.
  *   *Cellular Automaton:* Gliders exist in the CA even if no one watches them, provided a physical computer could simulate the CA and identify them.
  **Status:** **Non-Negotiable.** This distinguishes the view from subjective idealism.

  #### 3. The Projectibility Requirement
  **Specification:** Compression must yield predictive leverage regarding *unobserved* data or counterfactual states of the system. A description that compresses past data but fails to generalize to future states of the same system does not denote a real pattern.
  **Motivation:** Distinguishes *lawful structure* from *accidental regularity*. Real patterns support the intentional and design stances; mere coincidences do not.
  **Test Cases:**
  *   *Run of Ones:* A long run of ones in a random sequence compresses well but predicts nothing about the next bit. It is not a real pattern.
  *   *Weird Predicate:* A short rule defining a gerrymandered predicate (e.g., "grue") compresses observed cases but fails to project to unobserved ones.
  *   *Cellular Automaton:* Gliders are real because their trajectory predicts future cell states more efficiently than calculating cell-by-cell.
  **Status:** **Non-Negotiable.** This is the primary filter against overfitting.

  #### 4. The Physical Boundedness of the Describer
  **Specification:** The "possible describer" referenced in the Modal Condition must be a system realizable within the physical laws of the universe in question. Hypercomputation or logically possible but physically impossible observers do not grant reality.
  **Motivation:** Enforces naturalism. If a pattern is only compressible by a device that violates thermodynamics or computability limits, it is not part of the natural order.
  **Test Cases:**
  *   *Neural Probe:* A feature read off a network by a probe is real only if the probe's operation is physically realizable and its output interpretable within physical constraints.
  *   *Thermodynamics:* Thermodynamic magnitudes are real because finite beings (us) cannot track microstates; the macro-description is the only one physically accessible to us.
  **Status:** **Camp Preference (Naturalist).** A Platonist could reject this, allowing logically possible describers. For a *naturalistic* ontology, this is non-negotiable.

  #### 5. Locus Neutrality (Multiple Realizability)
  **Specification:** A pattern's reality does not depend on it being instantiated in a single, continuous spatiotemporal region or a specific substrate. The "object" of the description can be distributed.
  **Motivation:** Accommodates higher-level entities (markets, species, minds) that are functionally unified but physically scattered.
  **Test Cases:**
  *   *Center of Mass:* Real despite no particle occupying the point and no force originating there.
  *   *Markets/Species:* Real despite having no single physical locus.
  *   *Intentional Stance:* Accommodates entities predicted well by belief/desire attribution that have no single locus of inner states.
  **Status:** **Non-Negotiable.** Without this, the theory collapses into reductionism.

  #### 6. The Cost-Benefit Threshold
  **Specification:** A pattern is real only if the compression gain exceeds the computational cost of applying the description, relative to the describer's capacities. Where the physical stance is cheaper, the design/intentional pattern is less "real" (or dormant).
  **Motivation:** Explains the hierarchy of stances. It prevents the proliferation of "patterns" that are theoretically compressible but practically inaccessible.
  **Test Cases:**
  *   *Thermodynamics vs. Microstates:* The micro-description is "more fundamental" but too costly; the macro-description is real because it is the optimal trade-off for physical describers.
  *   *Neural Probe:* If the probe requires more computation to interpret than simply running the network, the "feature" it finds is not a robust pattern.
  **Status:** **Camp Preference (Pragmatist).** A Strong Realist might argue reality is independent of cost. This requirement embeds pragmatism into ontology.

  ---

  ### Inconsistencies and Tensions

  **1. The Tension between Modal Describer Condition and Physical Boundedness**
  *   **Conflict:** The Modal Condition says patterns exist if a *possible* describer could find them. The Physical Boundedness says the describer must be *physically realizable*.
  *   **Problem:** In a universe where no complex life evolves, are "genes" or "markets" real? If "possible" means "consistent with physical laws," they are real. If "possible" means "actually constructible given the universe's history," they may not be.
  *   **Verdict:** These cannot be jointly satisfied without ambiguity in the definition of "possible." If you define possibility by *laws*, you risk inflating reality with patterns no actual system could ever use. If you define it by *history*, you make reality contingent on accidental evolutionary outcomes. You must choose: is reality relative to the *laws* of physics or the *contents* of physics?

  **2. The Tension between Projectibility and Compression**
  *   **Conflict:** Maximum compression (Minimum Description Length) often leads to overfitting (memorizing noise), which destroys projectibility. Maximum projectibility (simple laws) often yields poor compression of specific data (high residual error).
  *   **Problem:** The "Run of Ones" case shows high compression/low projectibility. A chaotic system might show low compression/high projectibility (statistical bounds).
  *   **Verdict:** A theory cannot maximize both simultaneously. You must prioritize one. If you prioritize Compression, you risk counting accidents as patterns. If you prioritize Projectibility, you risk counting vague statistical regularities as robust objects. The theory must specify a weighting function (e.g., Bayesian Model Evidence) rather than treating them as equal partners.

  ---

  ### Classification of Requirements

  | Requirement | Classification | Reason |
  | :--- | :--- | :--- |
  | **Non-Triviality** | Non-Negotiable | Logical coherence; prevents tautology. |
  | **Modal Describer** | Non-Negotiable | Prevents subjective idealism; preserves discovery. |
  | **Projectibility** | Non-Negotiable | Distinguishes law from accident; essential for prediction. |
  | **Physical Boundedness** | **Naturalist Preference** | Excludes Platonism/Idealism; defines the "Naturalistic" camp. |
  | **Locus Neutrality** | Non-Negotiable | Prevents reductionism; allows for higher-level ontology. |
  | **Cost-Benefit** | **Pragmatist Preference** | Excludes Strong Realism; makes reality observer-relative. |

  ---

  ### The Exclusionary Requirement

  The single requirement that does the most to exclude accounts currently on offer is **The Physical Boundedness of the Describer.**

  **What it excludes:**
  1.  **Platonist/Abstract Realism:** It excludes views where patterns exist in a realm of abstracta accessible only to a non-physical intellect.
  2.  **Ideal Observer Theories:** It excludes accounts that define truth or reality relative to an omniscient or infinite-compute observer (a "Laplace's Demon").
  3.  **Hypercomputational Accounts:** It excludes theories that grant reality to structures detectable only by machines violating the Church-Turing thesis or thermodynamic limits.

  **Why:** Most existing realist accounts implicitly rely on a "view from nowhere" or an idealized observer to ground the existence of unobserved patterns. By tethering the *conditions for reality* to the *capacities of physical systems*, this requirement forces the ontology to be immanent to the physical world it describes, ruling out any metaphysics that relies on transcendent access to truth. It is the gatekeeper of naturalism.
