answer: |-
  # ADVERSARIAL COLLABORATION PROTOCOL: THE NATURE OF PHENOMENAL REPORTS

  **Date:** October 26, 2023
  **Parties:** The Illusionist (Proponent of Illusionism) & The Phenomenal Realist (Proponent of Realism)
  **Facilitator:** Reading Group Coordinator

  ## PREAMBLE
  This document establishes a framework for productive disagreement. It does not aim to force consensus on ontological questions where none currently exists. Its goal is to isolate the precise locus of disagreement, distinguish verbal disputes from substantive ones, and pre-register predictions on empirical or conceptual tests that bear on the core conflict.

  ---

  ## PART I: AGREED CLAIMS (THE COMMON GROUND)
  *Both parties affirm the following propositions. Denial of any item below constitutes a violation of this collaboration agreement.*

  1.  **Neural Correlates:** Conscious states (whatever they are) systematically correlate with specific neural activities. There is no evidence for consciousness occurring in the absence of appropriate biological (or functional) substrate.
  2.  **Introspective Reports as Data:** First-person reports ("I see red," "It hurts") are behavioral outputs generated by cognitive systems. They are data points that any complete theory must explain causally.
  3.  **Fallibility:** Introspection is not infallible. Subjects can be mistaken about the causes of their states, the timing of their states, and potentially the properties of their states.
  4.  **Theory Obligation:** A theory of consciousness must explain *why* we make the introspective reports we do. A theory that predicts we should report nothing, or something radically different from what we do report, is falsified.
  5.  **Rejection of "Brute Obviousness":** Neither side may appeal to "it is just obvious that qualia exist" or "it is just obvious that qualia are illusions" as a terminal argument. Intuitions must be traced to their cognitive origins.
  6.  **Rejection of "Methodological Solipsism":** Neither side may claim that third-person data (neuroscience, behavior, physics) is *in principle* irrelevant to the question. Even if third-person data cannot *exhaust* the explanation (Realist view), it must constrain it.
  7.  **Causal Closure:** The physical world is causally closed. If phenomenal properties exist, they do not violate the laws of physics (i.e., no magical dualist interactionism).

  ---

  ## PART II: THE CONTENT/PROCESS DISTINCTION
  *The parties acknowledge that previous debates have conflated the **content** of an introspective judgment with the **causal process** that produces it. We explicitly adopt the following distinction:*

  *   **The Process:** The neurocognitive mechanism that generates an introspective report (e.g., "I am experiencing red"). This includes attention, working memory, and meta-cognitive monitoring.
  *   **The Content:** What the report claims is happening (e.g., "There is a qualitative property of 'redness' present in my field").

  **The Joint Statement on the Gap:**
  We agree that the Process is physical and functional. We disagree on the status of the Content.
  *   **The Illusionist Claim:** The Content is a *misrepresentation* generated by the Process. The Process exhausts the reality; the Content is a user-illusion.
  *   **The Realist Claim:** The Content tracks (roughly) a real property instantiated by the Process (or associated with it). The gap between Process and Content is not error, but the difference between the *mechanism* and the *manifestation*.

  **Agreement:** The disputed territory is **not** whether the Process exists (both say yes), but whether the Content refers to something over and above the functional properties of the Process.

  ---

  ## PART III: TABLE OF GENUINE DISAGREEMENTS
  *Each row identifies a specific point of contention, the "crux" question that drives it, and an argument/case both agree is relevant.*

  | # | Disagreement | The Crux (Sub-question) | Agreed Bearing Argument/Case |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Explanandum**<br>What is the target of explanation? | **Is the "feeling" a datum or a deliverance?**<br>Must we explain the *feeling itself* (Realist) or only the *belief that we have the feeling* (Illusionist)? | **The Zombie Judgment:**<br>If a system makes the exact same introspective reports as a human but lacks "inner feeling" (a philosophical zombie), has something been left out?<br>**Realist:** Yes, the experience itself.<br>**Illusionist:** No, if the reports and functions are identical, the "experience" was just the disposition to report. |
  | **2** | **The Nature of Error**<br>How do we introspectively go wrong? | **What is the ontology of the illusion?**<br>If introspection misrepresents a state, what property is it misrepresenting *as*?<br>Can you represent a non-physical property using a physical brain? | **The Homunculus Fallacy:**<br>To claim introspection "views" an inner quality implies an inner viewer.<br>**Illusionist:** Correct. This proves the "quality" is a representational fiction.<br>**Realist:** Incorrect. Introspection is a direct acquaintance, not a viewing. No inner viewer required. |
  | **3** | **The Dissociation Test**<br>Can phenomenology vary independently of function? | **Is the "What It's Like" supervenient on Access?**<br>If access/function stays fixed, can the phenomenal character change? | **The "Fringe" Manipulation**<br>(See Part IV for full protocol).<br>If reports change without functional change, is this a change in *reality* or a change in *narrative*? |

  ---

  ## PART IV: THE CRUX TEST (THE "FRINGE" MANIPULATION)
  *Per the collaboration requirements, we pre-register the following thought experiment/experimental design to test the Content/Process distinction.*

  **The Scenario:**
  Subjects undergo a specific protocol (e.g., mindfulness training combined with suggestive framing) designed to alter their introspective stance.
  *   **Pre-Training:** Subjects report no determinate phenomenal quality in the extreme peripheral visual field (beyond 30 degrees). They treat it as "indeterminate" or "nothing."
  *   **Post-Training:** Subjects report a specific, determinate "phenomenal fringe" (e.g., "a shimmering texture") in that same periphery.
  *   **Controls:**
      1.  **Discrimination:** Ability to detect stimuli in the periphery does *not* improve.
      2.  **Physiology:** fMRI/EEG activity in early visual cortex (V1/V2) corresponding to that region remains *unchanged*.
      3.  **Access:** Reaction times and working memory loads regarding peripheral data remain *unchanged*.

  **The Question:**
  Did the **phenomenology** change, or did the **introspective model** change?

  **Pre-Registered Predictions:**

  | Party | Prediction & Interpretation |
  | :--- | :--- |
  | **The Phenomenal Realist** | **Prediction:** The phenomenology changed (or was revealed).<br>**Interpretation:** This demonstrates that phenomenal properties are not identical to functional/access properties. Since function and physiology remained static while the reported "feel" changed, the "feel" is a distinct variable. The training allowed the subject to attend to a pre-existing but unaccessed phenomenal field, or it altered the phenomenal field directly without altering input processing.<br>**Embarrassment Condition:** I would be embarrassed if it were shown that the subjects were merely *confabulating* to please the experimenter without any change in their actual conscious field. (However, since the conscious field is private, this is hard to falsify). |
  | **The Illusionist** | **Prediction:** The introspective model changed.<br>**Interpretation:** The "phenomenal fringe" is a judgment, not a raw feel. The training altered the meta-cognitive criteria for generating reports. The brain's "user interface" was updated to display a "fringe" icon where previously it displayed "null." Since no functional/physiological change occurred, no *real* property changed. The subject is not lying; they are accurately reporting a new internal model, but that model does not track intrinsic non-functional properties.<br>**Embarrassment Condition:** I would be embarrassed if it were shown that this change in report *necessarily* entailed a change in physical function that we simply couldn't measure yet. (I maintain that if the report changes, *some* physical state regarding the report-generation mechanism must have changed, but not necessarily the sensory processing state). |

  **Honest Assessment of Embarrassment:**
  Both parties acknowledge that **no outcome of this specific experiment will force a concession.**
  *   If reports change without functional change, the Realist claims victory for "Phenomenal Dissociation," and the Illusionist claims victory for "Introspective Malleability."
  *   The disagreement rests on the *description* of the report change: Is it a discovery of a property (Realist) or a revision of a self-model (Illusionist)?
  *   **Conclusion:** This test clarifies the *consequences* of the view, but does not settle the ontology. It forces both sides to admit that introspective reports are not direct readouts of sensory input.

  ---

  ## PART V: VERBAL DISPUTE ASSESSMENT
  *Is this fight just about the word "Phenomenal"?*

  **Joint Assessment:**
  We agree that a portion of the dispute is verbal, but not all of it.

  1.  **The Verbal Component:** If "Phenomenal Consciousness" is defined as *"that which introspective reports are about,"* we agree it exists. If it is defined as *"non-functional, intrinsic properties that causally explain nothing,"* we disagree on its existence. Much of our shouting match stems from switching between these definitions without signaling.
  2.  **The Substantive Component:** The dispute is **not** merely verbal because it entails different research programs.
      *   The **Realist** program seeks neural correlates that explain *why this feels like that* (qualitative mapping).
      *   The **Illusionist** program seeks neural correlates that explain *why we think this feels like that* (meta-cognitive error theory).
      *   These are empirically distinct paths. If the Illusionist is right, searching for the "neural code of redness" is a category error; we should be searching for the "neural code of redness-judgments."

  **Action Item:** Henceforth, in this group, we will use the term **"Phenomenal Report"** for the data, and reserve **"Phenomenal Property"** for the ontological claim. We will explicitly state which we are referring to in every argument.

  ---

  ## SIGNATURES

  We, the undersigned, agree to abide by this framework, to refrain from accusing the other of "changing the subject" without referencing the Content/Process distinction, and to acknowledge that the "Fringe Manipulation" yields interpretive data, not a knockout blow.

  _________________________ (The Illusionist)

  _________________________ (The Phenomenal Realist)

  _________________________ (Facilitator)
