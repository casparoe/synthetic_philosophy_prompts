answer: |-
  This is an exceptionally sharp set of questions. You have identified the precise tension that has kept Augustine's ethics of lying under debate for sixteen centuries. Your worry is essentially this: Is Augustine's absolutism a substantive moral claim, or is it a linguistic fortress built to protect itself from counterexamples?

  To answer you directly: Augustine's position has principled content, but it comes at a theological and moral cost that many modern readers find intolerable. The charge of "unfalsifiability" is partially mistaken because it focuses on his definition of lying rather than his hierarchy of goods.

  Here is a breakdown of the strands you asked to separate.

  ### 1. The Definition: Falsity vs. The Will
  You are right to suspect that if Augustine defined lying simply as "stating a falsehood," his system would collapse into absurdity. Fortunately, he does not.

  In *On Lying* (*De Mendacio*), Augustine explicitly distinguishes between being mistaken and lying. He defines a lie not by the objective truth-value of the statement, but by the relationship between the statement and the speaker's mind (*enuntiatio contra mentem*). To lie is to speak against what one believes to be true with the **intent to deceive** (*voluntas fallendi*).

  *   **The Mistaken Person:** If I tell you it is raining because I believe it is raining, but I am wrong, I have not lied. I have erred, but my heart is aligned with my speech.
  *   **The Joke:** If I say something false in a context where everyone understands I am jesting, I have not lied. There is no intent to deceive; the "language game" signals that I am not asserting belief.

  This definition is robust and not merely a patch. It grounds lying in the **disorder of the will**. For Augustine, sin is not primarily about breaking a rule; it is about the soul turning away from God (Truth itself) toward a lesser good. When you lie, you fracture the relationship between your mind and your speech, and ultimately between yourself and God, who is Truth.

  So, the "absurdity" you feared (that mistakes are sins) is avoided. The definition is psychological and intentional, not merely propositional.

  ### 2. The Biblical Cases: Patch or Principle?
  This is where your seminar colleagues are debating two different strands of Augustine's thought, because Augustine himself wavers slightly between *On Lying* (395 AD) and *Against Lying* (420 AD).

  **Strategy A: Reclassification (The "Not a Lie" Defense)**
  In *On Lying*, Augustine does attempt to argue that figures like the Hebrew midwives or Rahab might not have technically lied. He suggests they may have spoken prophetically or ambiguously—that is, they said something that was true in a spiritual sense even if false in a literal sense.
  *   *Is this gerrymandering?* It looks like it. If you stretch "truth" enough to include "spiritual truth," you risk emptying the word of meaning. Augustine knows this risk and is cautious about it. He admits these explanations are difficult.

  **Strategy B: Sin and Reward (The "Lie but Faithful" Defense)**
  In his later works, and more consistently in his mature theology, Augustine takes the harder line: **They did lie.** It was a sin.
  *   *How does he handle the praise?* He argues that God rewarded their **faith and benevolence**, not their lie. In *Against Faustus*, he writes that Rahab was rewarded for her hospitality and faith in God, but her lie was still a sin that required forgiveness. He posits that God, in his mercy, overlooked the sin because of the virtue accompanying it, or that the reward was for the good intention while the lie remained a stain on the soul that needed purging.

  *   *Is this a patch?* It is not a definitional patch, because it admits the definition of lying was met (intent to deceive was present). Instead, it is a **theological distinction between the act and the agent.** Augustine separates the moral quality of the act (always evil) from the merit of the person (who can still have charity).
  *   *The Cost:* This saves the absolutism but makes God look somewhat inconsistent (rewarding a sinner for a sin). Augustine accepts this cost. He prefers to say God is merciful to human weakness than to admit that lying can be a tool for good.

  ### 3. What Counts Against the View? (Falsifiability)
  You asked what would test his absolutism. The charge of unfalsifiability has bite only if you think Augustine is trying to protect the *definition* of lying. He is not. He is protecting the **ontology of the soul.**

  To test Augustine, you cannot bring him a case of "white lies" or "jokes," because his definition already excludes those. To test him, you must attack his **hierarchy of goods.**

  Augustine's absolutism rests on this claim: **The health of your own soul is more important than the physical safety of your neighbor.**
  *   If you lie to save a friend from a murderer, you have saved your friend's body (a temporal good) but damaged your own soul (an eternal good) and potentially the murderer's soul (by participating in deception).
  *   For Augustine, it is better that your friend die innocent than that you live as a liar.

  **What would move an Augustinian?**
  1.  **Demonstrating that Truth Serves Charity:** If you can argue that telling the truth in a specific case actually *destroys* charity (love of neighbor) more than lying does, you press Augustine on his own terms. He believes Truth and Charity cannot ultimately conflict because both are God. If you can show a scenario where they *necessarily* conflict, his system strains.
  2.  **The "Monstrous" Consequence:** Augustine explicitly concedes the "monstrous" case. In *On Lying*, he addresses the scenario of a murderer asking for the location of an innocent victim. He says you must tell the truth. If the victim dies, the blood is on the murderer's hands, not yours. If you lie, the sin is on your hands.
      *   *The Test:* The view is falsifiable if you can convince someone that allowing an innocent death when you could prevent it is a *greater* violation of God's will than speaking a falsehood. Augustine thinks it isn't. Most modern ethicists think it is. The disagreement is not about the definition of lying, but about the **weight of consequences.**

  ### 4. Is the Strictness an Illusion?
  No, the strictness is real, but it is maintained by **theological fiat**, not linguistic trickery.

  The "unfalsifiability" charge arises because Augustine locates the evil of lying in the *interior act of the will*, which is invisible. We can see the consequence (a life saved), but we cannot see the damage to the soul. Therefore, no amount of good consequences can outweigh the evil of the lie, because the scales measure different things (temporal vs. eternal).

  However, there is a crack in the armor. Augustine does admit degrees of sin. He outlines eight grades of lying, ranging from malicious lies in religious doctrine (worst) to jokes (not lies at all) to lies told to protect someone (still a sin, but venial).
  *   **The Concession:** He admits that lying to save a life is a **venial sin** (forgivable), whereas lying to corrupt doctrine is **mortal**.
  *   **The Implication:** This is where the "verbal trick" worry is most potent. If lying to save a life is a sin, but a forgivable one, and God rewards the faith of the liar anyway... why not lie? Augustine's answer is: "Do not do evil that good may come." But he admits the evil is small in this case.

  ### Summary for Your Seminar
  To synthesize this for your discussion:

  1.  **Definition:** Augustine defines lying by the **intent to deceive** and speaking against one's mind, not by objective falsity. This protects him from the "mistake/joke" objection.
  2.  **Biblical Cases:** He does not merely reclassify them. In his mature view, he admits Rahab and the midwives **lied and sinned**, but were rewarded for their **faith**, not their falsehood. This is consistent with his definition but relies on a complex theology of merit and mercy.
  3.  **Falsifiability:** The view is not unfalsifiable, but the falsification condition is steep. You must prove that **physical survival is a higher good than spiritual integrity.** Augustine will always choose spiritual integrity.
  4.  **The Real Cost:** The "gerrymandering" is not in the definition of lying, but in the **isolation of the agent.** Augustine isolates your moral responsibility from the consequences of your truth-telling. If you tell the truth and a murderer kills your friend, you are clean. That is the hard pill. If you find that conclusion morally repugnant, you are not disagreeing with his definition of lying; you are disagreeing with his metaphysics of the soul.

  Augustine's position is not a linguistic trick; it is a tragic consistency. He would rather the world burn than that he fracture the relationship between his mind and God. Whether that is holiness or moral narcissism is the question your seminar is ultimately debating.
