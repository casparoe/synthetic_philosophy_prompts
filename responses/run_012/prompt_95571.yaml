answer: |-
  **Essay Question**

  Critics argue that computationalism faces a dilemma: either the claim "the brain is a computer" is trivially true of nearly any physical system, or it is a substantive claim that risks being empirically false. Articulate and defend a substantive version of computationalism that escapes this dilemma. Your answer must: (1) distinguish the trivial reading from the substantive one; (2) explain what explanatory work the substantive claim does that rival frameworks (e.g., dynamical systems or embodied cognition) do not; and (3) specify what evidence would count against your version, addressing whether computation requires semantic representation.

  ***

  **Model Answer**

  The triviality objection, often associated with Putnam and Searle, suggests that if computation is merely the mapping of physical states to abstract logical states, then almost anything (even a wall) computes. Under this "description-only" view, saying the brain is a computer is vacuous; it offers no insight into *how* cognition works. To rescue computationalism, we must shift from a semantic view of computation (how we describe the system) to a mechanistic one (how the system is causally organized).

  A substantive computationalism claims that the brain does not merely *satisfy* a computational description, but that its cognitive capacities are *explained* by the causal manipulation of discrete vehicles according to formal rules. This distinguishes it from the trivial reading because it imposes constraints on the physical architecture. It is not enough that we can map neural firing rates to binary digits; the system must actually segregate information into discrete, functionally individuated states that interact based on their structure rather than their physical energy.

  This substantive claim differentiates computationalism from rival frameworks like dynamical systems theory (DST). DST models cognition as continuous trajectories through a state space, governed by differential equations rather than discrete algorithmic steps. While a dynamical system can be simulated computationally, the computationalist claims the brain *itself* operates via discrete symbol manipulation. The explanatory advantage of computationalism is its ability to account for systematicity and productivity in thought (e.g., if you can think "A loves B," you can think "B loves A"). Dynamical systems can model these patterns, but computationalism explains them via the combinatorial syntax of mental representations. Embodied cognition challenges this by arguing that intelligence emerges from agent-environment coupling without internal representation. Computationalism counters that while coupling is necessary, high-level reasoning requires internal processing decoupled from immediate environmental input.

  To avoid being unfalsifiable, substantive computationalism must specify what would count against it. If neural processing proves to be fundamentally continuous, context-sensitive, and non-decomposable into discrete logical operations without losing explanatory power, computationalism fails. For instance, if cognitive tasks cannot be broken down into algorithmic sub-routines corresponding to neural mechanisms, the computational hypothesis is weakened. Furthermore, if cognitive capacities dissolve when the agent is removed from their specific environmental niche (as enactivists predict), the claim of internal symbolic processing loses ground.

  Finally, we must address representation. A common equivocation slides between computation as syntax (formal manipulation) and computation as semantics (meaning). A robust computationalism should admit that computation proper is syntactic; the physical vehicle is manipulated based on shape or structure, not meaning. However, for this to explain *cognition*, the syntax must reliably track semantics. If computation does not require representation, it risks becoming mere signal processing. Therefore, the substantive claim is that the brain implements a physical symbol system where syntactic operations preserve semantic truth. If neural states are shown to lack stable truth-conditions or referential content, the computational explanation of *mind* (as opposed to mere information processing) collapses. Thus, computationalism survives the triviality objection only by committing to specific architectural claims that are empirically testable and distinct from continuous dynamical descriptions.

  ***

  **Marking Scheme (20 Points Total)**

  **1. Distinguishing Trivial vs. Substantive (5 points)**
  *   **Must Hit:** Identifies that trivial computation is about *description/mapping* (pancomputationalism), while substantive computation is about *causal mechanism/architecture*.
  *   **Common Mistake:** Treating the triviality objection as a refutation of computationalism rather than a demand for precision. (-2 pts)

  **2. Differentiation from Rivals (5 points)**
  *   **Must Hit:** Explicitly contrasts discrete/algorithmic processing (computationalism) with continuous/trajectories (dynamical systems) or coupling (embodied). Mentions systematicity or productivity as the explanatory payoff.
  *   **Common Mistake:** Vaguely stating rivals are "different" without specifying the structural difference (e.g., continuous vs. discrete). (-2 pts)

  **3. Falsifiability and Evidence (5 points)**
  *   **Must Hit:** Proposes specific empirical conditions that would disprove the theory (e.g., proof of fundamental continuity, failure of decomposability).
  *   **Common Mistake:** Claiming computationalism is unfalsifiable or suggesting philosophical arguments (like zombies) count as empirical evidence against it. (-2 pts)

  **4. Representation and Syntax (5 points)**
  *   **Must Hit:** Acknowledges the syntax/semantics distinction. Argues that while computation is syntactic, cognitive explanation requires a link to semantics/representation.
  *   **Common Mistake:** Name-dropping Searle's "Chinese Room" or "Syntax isn't Semantics" without applying it to the specific question of architectural evidence. (-3 pts)

  ***

  **Confidence Note**

  I am roughly 90% confident this model answer aligns with the consensus of contemporary philosophy of cognitive science (specifically the mechanistic account championed by philosophers like Gualtiero Piccinini). The single point I am least sure about is the requirement that computation *must* link to semantics to explain cognition. Some rigorous computationalists (like Frances Egan) argue that computation is purely syntactic and that semantics is external or irrelevant to the computational description itself. A sharp student might push back on the model answer's claim that syntax must preserve semantic truth to count as a cognitive explanation, arguing instead for a deflationary view of representation.
