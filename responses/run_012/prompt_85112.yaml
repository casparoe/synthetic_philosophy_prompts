answer: |-
  **Essay Question**

  Elster argues constitutional precommitment resembles Ulysses binding himself to the mast. But Ulysses relied on a crew to enforce the bond. Identify the "crew" in constitutional democracy. Is the judiciary merely the mechanism of binding (the rope) or an independent agent (a co-sailor)? Explain how this distinction resolves or exacerbates the charge that entrenchment is undemocratic.

  ***

  **Model Answer**

  The judiciary functions as Ulysses' crew rather than the rope, meaning constitutional entrenchment is not purely self-binding but a delegation of interpretive authority that mitigates the counter-majoritarian difficulty only when courts act as faithful agents of the constituent power rather than independent principals. In Homer's Odyssey, Ulysses does not tie himself to the mast; he commands his crew to bind him and to ignore his future pleas. The binding mechanism is physical, but the enforcement is agential. In constitutional theory, the text alone is the rope; it is inert. The judiciary is the crew. They hold the power to disregard the contemporary majority's "pleas" to violate constitutional norms, just as the crew ignored Ulysses' sirens-induced begging. Without the crew, the rope is merely symbolic; without the court, the constitution is merely parchment.

  Recognizing the court as crew rather than rope fundamentally alters the ontology of precommitment. If the court were merely the rope, constitutional review would be a mechanical process of matching present action against past text. But ropes do not interpret; sailors do. When a court strikes down legislation, it is not simply applying a static constraint; it is making a judgment that the current political impulse resembles the siren's song rather than a legitimate change in course. This makes the judiciary a co-author of the constraint's meaning. The constitution does not bind the future self directly; it authorizes a specific institution to bind the future self on the principal's behalf. This shifts the problem from metaphysics (how can the past bind the present?) to agency (who watches the watchers?). The court is not a passive tool of the past, but an active guardian with discretion to determine when the binding applies.

  This distinction reshapes the charge that entrenchment is undemocratic. The standard critique argues that precommitment violates popular sovereignty by allowing the dead to rule the living. This assumes the rope holds the people. However, if the judiciary is the crew, the undemocratic risk is not the binding itself, but agency slack. The danger is not that the past binds the present, but that the crew ignores the captain's original orders to serve their own interests or the fleeting passions of the moment. Entrenchment is undemocratic only if the crew becomes a principal itself, imposing its own will rather than enforcing the constituent power's precommitment. Therefore, the counter-majoritarian difficulty is not solved by denying judicial review, but by ensuring the crew remains subordinate to the original constitutional command. The issue is not sovereignty across time, but fidelity within institutions. If the crew represents the long-term interests of the ship (the polity), then their overruling of the captain's temporary madness is not undemocratic; it is constitutive of the ship's survival. The democracy objection fails when it treats the momentary majority as the only legitimate voice. By viewing the court as crew, we see that democracy requires protecting the conditions under which self-government is possible, even against itself.

  Ultimately, the legitimacy of constitutional precommitment rests on the fidelity of the enforcement mechanism. Ulysses survived because the crew obeyed his prior instruction, not because the rope was strong. Similarly, constitutionalism succeeds not because the text is entrenched, but because the judiciary possesses the standing and discipline to overrule temporary majorities without substituting their own policy preferences. The "undemocratic" label sticks only when the crew unties Ulysses to sail toward their own destination. Thus, the defense of entrenchment requires not a theory of self-binding, but a theory of delegated authority where the judiciary acts as the guardian of the long-term will against the short-term passion, maintaining the distinction between the principal's voice and the agent's discretion. Constitutional validity depends on whether the crew hears the original command or the sirens.

  ***

  **Marking Scheme (20 Marks)**

  | Move | Criteria | Marks | Typical Botch |
  | :--- | :--- | :--- | :--- |
  | **1. Identify the Crew** | Explicitly identifies the judiciary/courts as the "crew" responsible for enforcement, distinct from the text. | 4 | Students say "the government" or "the people" are the crew, missing the enforcement role. |
  | **2. Rope vs. Agent** | Distinguishes between the constitution as passive mechanism (rope) and the court as active enforcer (agent). | 4 | Students treat the court as a mechanical automaton that just reads the text without discretion. |
  | **3. Co-Authorship** | Argues that interpretation grants the court co-authorial power over the constraint's meaning/application. | 4 | Students claim the court is purely subordinate, ignoring the power inherent in interpreting "ignore pleas." |
  | **4. Reframe Democracy** | Shifts the democracy objection from "dead hand control" to "agency slack" or fidelity problems. | 4 | Students repeat the standard "past vs. present" democracy critique without applying the crew analogy. |
  | **5. Legitimacy Condition** | Concludes that legitimacy depends on the court's fidelity to the original command, not the binding itself. | 4 | Students conclude that entrenchment is either wholly democratic or wholly undemocratic without condition. |
  | **Total** | | **20** | |

  **Grade Differentiation**

  *   **A Range (17-20):** Hits all 5 moves. Crucially, in Move 3 and 4, the essay synthesizes the "co-author" point with the democracy objection, showing that the *risk* to democracy is judicial usurpation, not constitutionalism itself. The prose is tight, and the first sentence is a complete thesis.
  *   **B Range (13-16):** Hits Moves 1, 2, and 4 adequately but treats the court as a passive enforcer (misses Move 3 nuance) or fails to fully resolve the democracy objection (Move 5 is vague). The essay describes the analogy well but doesn't exploit its theoretical consequences.
  *   **C Range (9-12):** Identifies the crew (Move 1) but reverts to standard precommitment theory without using the analogy to reshape the democracy argument. May rely on rational-choice terminology despite instructions.
