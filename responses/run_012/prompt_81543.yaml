answer: |-
  **1. "Why not just bound utility functions? It solves St. Petersburg and fits standard risk aversion."**
  *   **Reply:** Bounds impose arbitrary ceilings on value. My rescaling shows any ceiling creates a discontinuity where more value suddenly counts for nothing.
  *   **Soft Spot:** Bounds are mathematically convenient and fit empirical data well.
  *   **Concede:** Bounds are useful approximations for human-scale decisions, but fail as normative truth.

  **2. "EU theory doesn't require the Archimedean axiom. You can reject fanaticism by dropping it."**
  *   **Reply:** That just axiomatizes threshold parochialism. It says "some probs don't count" without explaining why. My argument demands the justification for that lexical priority.
  *   **Soft Spot:** Non-Archimedean systems are formally coherent.
  *   **Concede:** It's formally permissible, but normatively empty without a story about why probabilities vanish.

  **3. "We lack cognitive access to probabilities like 10^-100. You're optimizing noise."**
  *   **Reply:** Epistemic uncertainty isn't ontological zero. If you assign non-zero credence, the EV logic holds. Don't confuse measurement error with value structure.
  *   **Soft Spot:** Pascal's Mugging relies on unreliable probability estimates.
  *   **Concede:** Practical application requires epistemic constraints, but the theoretical point stands.

  **4. "This implies ignoring certain suffering for a speck of chance at utopia. That's morally grotesque."**
  *   **Reply:** It's only grotesque if you assume thresholds. If the utopia is big enough, the math holds. Intuitions fail at extreme scales.
  *   **Soft Spot:** Moral intuitions are strong data points for philosophers.
  *   **Concede:** The implications are demanding, but not inconsistent with consequentialism.

  **5. "Rank-dependent utility shows rational agents weight tiny probs as zero. Why insist on linearity?"**
  *   **Reply:** Weighting functions that hit zero before probability do are just smooth thresholds. Rescaling applies: stretch the stakes, the weight should update.
  *   **Soft Spot:** Risk aversion is empirically robust.
  *   **Concede:** Descriptive accuracy doesn't imply normative correctness.

  **6. "Thresholds aren't fixed; they scale with stakes. Your rescaling assumes a fixed floor."**
  *   **Reply:** If thresholds scale linearly, you recover linearity (fanaticism). If super-linearly, what's the function? Arbitrary curves violate coherence.
  *   **Soft Spot:** Context-dependence is plausible.
  *   **Concede:** Context matters, but shouldn't violate dominance principles.

  **7. "Doesn't this collapse into the infinite ethics problems you philosophers love?"**
  *   **Reply:** Fanaticism handles finite cases; infinite ethics is a separate headache. Don't conflate unbounded utility with infinite utility.
  *   **Soft Spot:** They interact badly in practice.
  *   **Concede:** Infinite cases remain problematic and are not solved here.

  **8. HOPE NOBODY ASKS: "If utility is unbounded, what generates the 'finite goods'? Isn't 'finite good' an incoherent category if values can always be surpassed?"**
  *   **Reply:** [Pause] Need to distinguish cardinal value from ordinal ranking.
  *   **Soft Spot:** Undermines the premise of "two finite goods."
  *   **Concede:** This requires deeper metaphysical work on value ontology.
