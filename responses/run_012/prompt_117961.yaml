answer: |-
  My dear friend,

  You have asked me to set the abstract machinery of the argument from divine hiddenness beside the concrete reality of Mother Teresa's interior life, and to consider whether the documents of her darkness require us to rebuild the argument entirely. It is a profound request, for it moves us from the logic of propositions to the phenomenology of prayer. The standard argument, as you note, hinges on non-resistant non-belief. It posits that a perfectly loving God would not allow a sincere seeker to remain unconvinced of His existence, because belief is the threshold of relationship. When we place Mother Teresa's letters against this premise, the fit is immediately awkward. She was not a non-believer. She never ceased to assent to the truth of God, nor did she cease to act upon that assent. Her struggle was not with the truth of God's existence but with the warmth of His presence. She did not lack belief; she lacked the felt experience that usually accompanies it. Consequently, the standard argument finds no purchase here. She is not the witness it seeks, and to force her into that category would be to misunderstand both the argument and her life.

  However, your suggestion to rebuild the argument around this discrepancy is where the real philosophical work begins. If we shift the locus from belief to experience, the syllogism changes. It would run something like this: if a perfectly loving God exists, and if the good at stake is a relationship rather than mere assent, and if a relationship cannot be sustained without the possibility of felt communication, then a non-resistant person who seeks that communication should not be left entirely without it. Mother Teresa sought it constantly. She was left without it. Therefore, either no such God exists or no such good is available. Does this rebuilt argument go through, or does its second premise collapse under scrutiny? The crucial point of failure lies in the claim that a relationship cannot be had without the possibility of felt communication. Here the theistic tradition offers the counter of the dark night, described by John of the Cross. This tradition treats the darkness not as a withdrawal of love but as a purification of it, a stage of growth where the soul learns to love God for Himself rather than for the consolations He provides.

  We must ask whether this traditional reading saves theism by explaining the case or merely redescribes it. The distinction is vital. A redescription simply labels the suffering as something else without offering an independent reason for its necessity; it calls the darkness light simply because it must be compatible with God's love. An explanation, however, offers an independent account of why the darkness is required for the specific good at stake. In the tradition of the dark night, the explanation is that felt presence can become a spiritual indulgence, a way of loving the feeling of God rather than God Himself. The removal of feeling is thus framed as a surgical necessity to deepen the relationship, to move it from a transaction of comfort to a union of wills. If one accepts this theological anthropology, the reading explains the case by positing a higher good that requires the absence of felt presence. If one does not accept that premise, it looks like a redescription, a way of insulating the doctrine from the reality of the suffering. What distinguishes the two is whether there is an independent justification for the hiddenness that appeals to a greater good accessible only through that hiddenness. In Mother Teresa's case, one might argue her darkness united her with the suffering of the poor she served, giving an independent reason for the silence. Without such a reason, the claim that the darkness is beneficial risks being a mere verbal maneuver to protect the theory from the evidence.

  Bringing this back to the theory of divine hiddenness, we see that the episode supports the premise that hiddenness causes profound distress, even for those who believe. It confirms that the absence of felt presence is a significant burden, one that can coexist with unwavering commitment. However, it leaves untouched the core premise of the standard argument regarding non-belief, because she never ceased to believe. More importantly, the argument is simply silent on the distinction between wanting God and wanting to feel God. The standard argument assumes that if God is loved, He must be felt, but Mother Teresa's life suggests that the will can remain fixed on God even when the emotions report emptiness. The argument is also silent on whether the loss of felt presence is a harm equivalent to the loss of belief. For the atheist, hiddenness means no relationship is possible. For Mother Teresa, hiddenness meant the relationship was agonizingly difficult but still actual. This suggests that the loss of felt presence is a trial within a relationship, not necessarily the termination of one.

  Ultimately, this episode shows that the standard argument from divine hiddenness never anticipated this case. It was designed to account for the outsider who cannot enter, not the insider who feels locked out while remaining within. It is an anomaly for the standard formulation, but it becomes central for the rebuilt version. If the argument has to be reframed around relationship rather than belief to accommodate her, I believe the reframing ultimately dissolves the logical force of the argument while deepening its existential weight. It dissolves the logical force because the requirement for felt presence is far more contestable than the requirement for belief. A loving parent may hide from a child to foster maturity; a loving God may hide to foster faith. The link between love and constant communicative presence is not as tight as the link between love and the possibility of belief. However, it strengthens the existential problem because it shows that even the most saintly lives are not immune to the silence of heaven. The reframed argument loses its sharp deductive edge but gains a tragic resonance, showing that hiddenness is not just a barrier to entry but a condition of the journey. In the end, Mother Teresa's letters do not prove God does not exist, but they do prove that if He exists, His love is often indistinguishable from absence to those who hold Him most dear.
