  *   **Policy vs. Tech (10%):** Preventing misuse requires technical refusal mechanisms, not just social contracts or governance layers.

  **Combination**
  Narrow alignment is the necessary technical bottleneck (80%), but solving it only gives you a perfectly obedient tool, which is dangerous if the operator is malicious or misguided (20%), meaning the "wide" problem remains a distinct technical challenge rather than just a policy afterthought (10%).

