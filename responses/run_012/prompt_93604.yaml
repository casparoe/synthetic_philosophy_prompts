answer: |-
  My mate tried to argue he's a good person because he donated to charity.
  I said, "Did you do it to feel superior?"
  He said, "Maybe a bit."
  I said, "Then you were selfish. You didn't *intentionally* help; you intentionally bought ego."
  He said, "Okay, what if I say I just had spare cash and clicked a button?"
  I said, "Then helping was a side effect. You didn't *intentionally* do anything good."
  He said, "So I can never intentionally do good?"
  I said, "Not really. But last week you forgot my birthday."
  He said, "I was busy!"
  I said, "You knew birthdays happen. You intentionally hurt my feelings."
  He said, "That's insane! By your logic, I'm incapable of virtue but a sociopath of inconvenience."
  I shrugged. "Exactly. 'Intentionally' isn't about what you meant to do. It's just the word we use when we're looking for someone to blame."

  ***

  **Where the joke takes liberties:**

  1.  **The Motive Variation:** In Joshua Knobe's original 2003 experiment, the Chairman's motive was held constant ("I don't care about the environment, I just want profit") across both the *help* and *harm* conditions. The joke introduces a variable motive for the good deed (doing it for "ego" vs. doing it as a "side effect") to force the "no credit" outcome. In the actual study, people denied intentionality in the *help* condition even when the motive was purely profit-driven, not necessarily "selfish" in a vainglorious sense.
  2.  **Scope of Application:** The joke generalizes the effect to *all* moral actions ("You can never intentionally do good"), whereas the Knobe Effect specifically concerns *side effects* of actions pursued for a different primary goal. The literature distinguishes between means, ends, and side effects; the joke collapses these to make the asymmetry absolute.
  3.  **The "Blame Word" Theory:** The punchline leans heavily on the **Pragmatic View** (that "intentionally" is used to allocate blame/praise rather than describe mental states), which is one interpretation of the findings. However, this is contested by the **Conceptual Competence View**, which argues that moral considerations actually penetrate and change our underlying concept of intentionality itself, rather than just being a linguistic tool for blame. The joke treats the Pragmatic View as fact to land the punchline.
