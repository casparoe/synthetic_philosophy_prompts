  4.  **Writing the Dialogue:**

      *   *Names:* Let's use "Cara" (Counterpart) and "Toby" (Transworld).
      *   *Opening:* Jump straight into the first case.
      *   *Case 1:* The Fission Case. Actual person Fred. Possible world W has Fred1 and Fred2. Both equally similar to Fred.
      *   *Toby:* Which one is Fred?
      *   *Cara:* Both are counterparts. "Fred could have been rich" is true if either is rich.
      *   *Toby:* But "Fred could have been Fred1" vs "Fred could have been Fred2". If both are equally qualified, you can't distinguish the possibilities.
      *   *Cara:* You don't need to. The modal claim is existential over counterparts.
      *   *Toby:* What about the fusion case? One possible individual matches Actual A and Actual B.
