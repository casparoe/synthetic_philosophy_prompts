answer: |-
  **Cara:** Let's begin with the fission case. Suppose there is an actual person, Fred. In a possible world, there exist two individuals, Fred-1 and Fred-2. Both originate from the same zygote, share Fred's memories up to a point, and diverge slightly thereafter. On your view, transworld identity holds. So, which one is Fred?

  **Toby:** Only one can be Fred. If the scenario is described as a genuine possibility for Fred, then Fred exists in that world. If the description implies both are equally qualified to be him, then the description is incoherent. Identity is one-to-one. You cannot be identical to two distinct things.

  **Cara:** But the scenario is perfectly coherent descriptively. We can specify all the qualitative facts: the physical continuity, the psychological connections. Both Fred-1 and Fred-2 stand in the same relation of similarity and continuity to actual Fred. On my view, this is unproblematic. Both are counterparts of Fred. The statement "Fred could have gone left" is true because a counterpart went left. "Fred could have gone right" is true because a counterpart went right. We don't need to select a unique individual to preserve the truth of the modal claims.

  **Toby:** You preserve the truth of the claims by changing the subject. When I say "Fred could have gone left," I mean *Fred* himself. If you say "A counterpart of Fred went left," you admit Fred himself didn't go left. In the fission case, your view forces you to say both are Fred's counterparts. But if I ask, "Is Fred identical to Fred-1?", you must say no. "Is Fred identical to Fred-2?" No. So Fred is neither. But then who is the person in that world living Fred's life? You have duplicates, not the person. The intuition of singular reference is lost.

  **Cara:** I absorb that hit. I do deny singular reference across worlds. But consider the cost on your side. To save singular reference, you must deny the coherence of the fission case. You have to say that metaphysical reality forbids a situation where continuity splits evenly. That seems like letting a logical constraint dictate empirical possibility. But let's run the mirror case. Suppose a possible world contains one individual, Fusion, who is qualitatively continuous with two actual people, Alice and Bob. Perhaps a world where their brains were merged in utero. On my view, Fusion is a counterpart of Alice and a counterpart of Bob.

  **Toby:** And there lies the problem. If Fusion is Alice, and Fusion is Bob, then by transitivity, Alice is Bob. But they are distinct actual people. You avoid this by saying Fusion is not identical to either, only a counterpart. But then, what connects Alice and Bob modally? They share a possible future. If I say "Alice and Bob could have been the same person," you say there is a world where a counterpart of Alice is identical to a counterpart of Bob. But since counterparts are distinct from the actuals, you aren't saying *they* could have been the same. You're saying their stand-ins could have been the same.

  **Cara:** Precisely. And that captures the modal truth without violating the indiscernibility of identicals in the actual world. The relation is not identity, so it need not be transitive across worlds.

  **Toby:** But this reveals the counterpart relation is non-functional. In the first case, one actual maps to two possibles. In the second, two actuals map to one possible. This makes *de re* modality vague. If I ask, "Could Alice have been Bob?", the answer depends on how we weight the similarity relations. If we prioritize psychological continuity, maybe yes. If we prioritize biological origin, no. You've made modal truth dependent on our choice of similarity metric.

  **Cara:** I concede the metric is context-sensitive. But is that worse than your alternative? Let's move to the second pressure point. Consider two worlds, W1 and W2. They are qualitatively identical. Every property instantiated in W1 is instantiated in W2. The only difference is that in W1, Jones occupies role R1 and Smith occupies role R2, while in W2, Jones occupies R2 and Smith occupies R1. No observation, memory, or inference can distinguish them. Do you accept these as distinct worlds?

  **Toby:** I do. They differ in which individuals occupy which roles. This is a haecceitistic difference. It is a difference in the world's structure regarding particular identities, not just qualitative properties.

  **Cara:** This is where you owe me an account. What makes it true that Jones is in R1 in W1 rather than R2? There is no qualitative fact to ground it. No observation could verify it. It seems you are committed to brute facts of identity. You posit a primitive "thisness" that floats free of all qualitative characterization.

  **Toby:** I deny it is brute in a pejorative sense. It is fundamental. Identity is not constituted by properties; properties are instantiated by individuals. To ask "what makes it Jones" is to ask for a qualitative ground for something non-qualitative. That is a category mistake. However, you face a mirror problem. You deny these worlds are distinct because you deny transworld identity. For you, W1 and W2 are the same world because the qualitative distribution is identical. But then, what makes the counterpart relation fixed? If I say "Jones could have been a fisherman," and there is a qualitatively identical world where a fisherman exists who matches Jones's qualities, what makes that fisherman a counterpart of Jones rather than Smith?

  **Cara:** The counterpart relation is grounded in similarity. The fisherman resembles Jones more than Smith in the relevant respects.

  **Toby:** Relevant according to whom? If the worlds are qualitatively identical, the similarity relations are symmetric unless we impose an external indexing. You said earlier the metric is context-sensitive. So, is it true *simpliciter* that Jones could have been a fisherman, or only true relative to our interest in counting him as such? If it's the latter, you've made modal truth interest-relative. If Jones dies young, whether he could have lived long depends on how we choose to compare him to others in other worlds.

  **Cara:** I adjust here. It is not merely interest-relative in a subjective sense. There are objective similarity relations based on causal history and physical constitution. However, which relations matter for *de re* attribution is semantic. But compare the costs. You accept distinct worlds that are empirically indistinguishable. You posit a primitive identity that explains nothing and predicts nothing. I accept that modal claims are sensitive to how we conceptualize the individual. I pay with context-dependence; you pay with epistemically inaccessible metaphysical facts.

  **Toby:** My facts are not inaccessible to the metaphysician, only to the empiricist. But your context-dependence threatens the objectivity of modal logic. If the counterpart relation shifts with context, then the truth value of "Jones could have been F" shifts without any change in the world or in Jones. That makes modality unstable. In the fission case, you said both counterparts count. But if one counterpart is virtuous and the other vicious, is Fred virtuous? You must say "in one sense, yes." I say Fred is neither, because Fred is not there. But if I say "Fred could have been virtuous," I mean there is a possibility for *him*. Your view dissolves the individual into a cloud of counterparts.

  **Cara:** And your view isolates the individual behind a veil of primitive identity. In the mirror case, where Fusion matches Alice and Bob, you must say Fusion is neither. So Alice and Bob have no shared possible future. That seems to rule out genuine metaphysical possibilities based on logical constraints of identity. I allow the possibility; I just analyze it as shared counterparthood. The cost is that "Alice" in the mouth of a speaker refers to a counterpart set, not a transworld continuant.

  **Toby:** But that means when we worry about our future, we are not worrying about ourselves. We are worrying about whether someone similar to us will exist. That undermines the stakes of prudential concern. If I am not identical to my future self in another branch, why care about them?

  **Cara:** Because they are my counterparts. The relation is close enough to ground concern. But let's return to the haecceitistic swap. You claim W1 and W2 are distinct. What work does this distinction do? It cannot explain any qualitative difference. It cannot guide any action. It serves only to satisfy the logical law that identity is primitive. I offer a ontology where worlds are maximal qualitative distributions. Your view requires us to believe in differences that make no difference.

  **Toby:** It makes a difference to the truth conditions of *de re* claims. If W1 and W2 are the same world, then "Jones could have been in R2" is true only if Jones is in R2 in the qualitative duplicate. But if Jones is essentially tied to R1 by some hidden haecceity, then even in a qualitative duplicate, he might not be in R2. My view allows for essential properties that are not qualitative. Your view reduces essence to similarity. If Jones is sufficiently similar to someone in R2, he could have been in R2. But what if Jones has a non-qualitative essence that forbids it? You cannot capture that.

  **Cara:** Because I deny non-qualitative essences exist. That is the core divergence. You owe an account of how we know these non-qualitative essences, or at least how they fit into a naturalistic worldview. I owe an account of how to stabilize the counterpart relation so it doesn't become arbitrary.

  **Toby:** And you owe an explanation of why the fission case doesn't result in ambiguity. If both Fred-1 and Fred-2 are counterparts, and one dies young and one old, then "Fred could have lived long" is true, and "Fred could have died young" is true. But is there a specific possibility where Fred lives long? Or just a cloud of possibilities? If the latter, you've lost the singular modal fact.

  **Cara:** I deny there is a singular modal fact over and above the counterpart facts. You insist there is. So here we stand. I accept context-dependent truth and multiple counterparts to preserve qualitative realism and avoid brute identity. You accept brute transworld identity and haecceitistic distinctions to preserve singular reference and logical transitivity.

  **Toby:** Correct. The live options are clear. Either we accept that modal truth is grounded in similarity relations that can split and merge, risking the stability of the subject, or we accept that individuals possess primitive identity conditions that transcend qualitative description, risking epistemic isolation.

  **Cara:** I still owe a principled way to select the relevant similarity metric without circularity.

  **Toby:** And I still owe an account of what constitutes primitive identity other than asserting it is primitive. Until then, the dispute remains substantive, not verbal. We agree on the cases; we disagree on what grounds the truth of our claims about them.

  **Cara:** Then we have work to do.

  **Toby:** Indeed.
