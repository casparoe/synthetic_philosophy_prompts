      *   *Case 2:* Qualitative Indiscernibility.
      *   *Cara:* Your view allows worlds that differ only by swapping individuals. Qualitatively identical.
      *   *Toby:* Yes. Haecceitistic difference.
      *   *Cara:* What makes it true that Jones is in Role 1 rather than Role 2?
