      *   *Drafting thought:* On the Haecceitism point, the CT usually denies haecceitistic differences (worlds are qualitatively determined). The TWI accepts them. The prompt asks: "Can the identity theorist give any account of what makes the cross-world identity claim true other than its being brute?" and "can the counterpart theorist say what makes one counterpart relation the right one rather than one our interests or our descriptive vocabulary happen to favor?" I need to highlight these specific vulnerabilities.

