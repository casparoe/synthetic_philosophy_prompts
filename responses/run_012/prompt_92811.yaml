answer: |-
  1. We should explicitly vote on whether employment rates are the sole measure of success before linking them to market outcomes to avoid smuggling a contested value judgment in by fiat. The strongest consideration against this delay is that reopening the metric debate risks stalling the pilot entirely if we cannot agree on what constitutes improvement.

  2. We should require external participants to validate the prices because a closed group of two dozen acquainted trustees and staff cannot carry independent information. The strongest consideration against this is that inviting outsiders violates the privacy of our family foundation and compromises the confidentiality of our grantee data.

  3. We must calculate the minimum subsidy required to incentivize truthful revelation before committing capital, as insufficient liquidity will render prices meaningless. The strongest consideration against this is that the cost of such analysis may exceed the value of the grant decision itself.

  4. We must ban program staff and grantees from trading since their salaries and stipends turn on the outcome, creating an untenable conflict of interest. The strongest consideration against this is that excluding these informed actors removes the very people with the best knowledge of the program's likely success.

  5. We should establish a default fallback to traditional voting if the two prices come out within noise of each other, which is the outcome I privately expect. The strongest consideration against this is that pre-committing to a fallback undermines the binding nature of the futarchy experiment and encourages strategic trading to force a tie.
