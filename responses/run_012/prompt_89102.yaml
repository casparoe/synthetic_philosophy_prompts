      *   (3) *Personal Risk (Repeated):* Expected Value (EV) maximiser for repeated bets, regardless of odds (Law of Large Numbers logic).
      *   (4) *Catastrophic Risk (Societal/Systemic?):* Maximin rule for catastrophic/irreversible risks (avoid worst-case), *not* EV.
      *   (5) *Burden of Proof:* On innovators, not restrictors.
      *   (6) *Dismissal of Precaution Costs:* Counterfactual harms from *not* innovating (opportunity costs) are speculative and should be discounted/ignored.

  3.  **Initial Scan for Tensions (Brainstorming):**
