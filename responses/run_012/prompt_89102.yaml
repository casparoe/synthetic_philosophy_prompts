      *Self-Correction on (3) vs (4):* The prompt says (3) is "In my own life" and (4) implies policy/catastrophic risks (context of memo). This scope distinction resolves much of the tension. I should note this as a *resolvable* tension rather than a fatal one, but still rank it.
