      *   (3) & (4): (3) says always take positive EV bets (if repeated). (4) says use Maximin for catastrophic risks. Maximin often rejects positive EV bets if the downside is ruinous. This is a classic decision theory clash.
      *   (2) & (6): (2) says allowing harm is as bad as causing it. (6) says harms caused by *suppressing* technology (allowing the status quo risks to continue or preventing risk-reducing tech) are speculative and discounted. This looks like a double standard.
      *   (1) & (5): These seem compatible (both precautionary).
      *   (2) & (5): Compatible (moral basis for burden of proof).
      *   (4) & (6): (4) focuses on worst outcomes of the *action*. (6) ignores worst outcomes of the *inaction*. Symmetry issue.

  4.  **Deep Dive into Specific Tensions:**

      *   **Tension A: (3) vs. (4) [Decision Theory Clash]**
          *   (3) EV maximisation for repeated bets.
          *   (4) Maximin for catastrophic risks.
          *   *Conflict:* If a catastrophic risk has a tiny probability but huge positive EV (e.g., geoengineering to stop climate change), (3) says do it (if repeated/context allows), (4) says don't (if worst case is ruin).
          *   *Severity:* High. This is a fundamental contradiction in rational choice theory.
          *   *Repair:* Limit the domain of (3). (3) applies to personal/financial/repeatable risks. (4) applies to systemic/one-off existential risks.
          *   *Cost:* Loss of generality in (3).

      *   **Tension B: (2) vs. (6) [Moral Symmetry vs. Precautionary Blindness]**
          *   (2) Omission = Commission.
          *   (6) Harms from omission (suppressing tech) are discounted.
          *   *Conflict:* If I ban a technology (commission), I might cause deaths by preventing a life-saving innovation (omission). (2) says these deaths count equally. (6) says they are speculative and don't count.
          *   *Severity:* Very High. This undermines the moral coherence of the whole framework. It looks like motivated reasoning to favour inaction.
          *   *Repair:* Modify (6) to acknowledge opportunity costs, or modify (2) to allow for epistemic asymmetry (though (2) says "other things equal").
          *   *Cost:* Weakening the Precautionary Principle's force. You have to weigh the risk of the new tech against the risk of *not* having it.

      *   **Tension C: (1) vs. (6) [Cost-Effectiveness vs. Ignoring Costs]**
          *   (1) Measures must be "cost-effective".
          *   (6) Costs of precaution (lives lost by suppression) are discounted.
          *   *Conflict:* You cannot calculate cost-effectiveness if you set one side of the equation (the cost of action/precaution) to zero or near-zero by definitional fiat.
          *   *Severity:* High. It makes (1) operationally incoherent.
          *   *Repair:* Align (6) with (1). Include opportunity costs in the "cost" side of "cost-effective".
          *   *Cost:* Makes precaution harder to justify.

      *   **Tension D: (4) vs. (1) [Maximin vs. Cost-Effectiveness]**
          *   (1) Cost-effective protective measures.
          *   (4) Maximin (ignore probability, look at worst case).
          *   *Conflict:* Maximin is notoriously *in*efficient. It can demand infinite cost to avoid a tiny probability of ruin. (1) asks for cost-effectiveness.
          *   *Severity:* Medium-High.
          *   *Repair:* Clarify that "cost-effective" in (1) is bounded by the constraint in (4).
          *   *Cost:* Potential paralysis if the cost to ensure the "maximin" outcome is too high.

  5.  **Identifying Apparent Tensions (That Hold Up):**
      *   (1) & (5): Burden of proof aligns with precaution. No real tension.
      *   (2) & (5): Moral symmetry supports shifting the burden. If allowing harm is bad, you need a good reason to allow a new risk.
      *   (3) & (1): Personal EV vs. Public Precaution. Can be distinguished by scope (personal vs. policy).

  6.  **Ranking the Tensions:**
      1.  **(2) vs. (6):** Moral hypocrisy/incoherence. Most damaging to philosophical integrity.
      2.  **(1) vs. (6):** Operational incoherence. Makes the policy unimplementable.
      3.  **(3) vs. (4):** Decision theory conflict. Manageable via scope distinction, but needs clarification.
      4.  **(1) vs. (4):** Efficiency vs. Safety. Standard policy trade-off, less of a contradiction, more of a balancing act.

