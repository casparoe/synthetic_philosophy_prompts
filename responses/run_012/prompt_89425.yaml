  4.  **Reconstructing Augustine's Strict Position:**
      *   *De Mendacio* (On Lying) & *Contra Mendacium* (Against Lying).
      *   Core definition: A lie is a false signification made with the will to deceive (*voluntas fallendi*).
      *   Crucial nuance: It is possible to tell the truth and yet lie. If you say something true believing it false, you lie. If you say something true intending the listener to infer something false, you lie.
