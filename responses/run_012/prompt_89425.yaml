  *(Refining the "True Sentences" point)*: Augustine explicitly addresses the "Jacob and Esau" type scenarios or cases where words are true but intent is deceptive. He argues that if the *meaning* conveyed is false in the speaker's mind (because they know the listener will infer falsehood), it is a lie. The "technical truth" defense is specifically one he dismantles.

