      *   *Clarification:* In *De Mendacio*, Augustine discusses the case of saying something true to make someone believe a falsehood. He generally condemns this as a form of lying because the *signification* in the mind of the speaker is deceptive. However, there is a nuance about *concealment* vs. *lying*. Augustine allows silence or evasion sometimes, but not active misleading signification.
      *   *The Notification:* It's not silence. It's active communication designed to lower guard. This pushes it closer to lying than mere concealment.
      *   *Contested Point:* The 8 kinds. Some scholars argue the 8th kind might be permissible in later Augustine (*Contra Mendacium* is stricter than *De Mendacio*). I need to mention this tension. *Contra Mendacium* is the mature view: No lies ever.
