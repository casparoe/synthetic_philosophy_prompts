      *   *Wait, check the hierarchy:* Augustine ranks them by severity. 1 is worst. 8 is "least" bad, but *still a sin*. He explicitly rejects the idea that a "good motive" makes a lie permissible. Even to save a life (or health), lying is forbidden.
