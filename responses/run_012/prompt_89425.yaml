  10. **Final Polish:** Ensure the distinction between *locutio* (speech) and *voluntas* (will) is clear. Ensure the distinction between *occultatio veritatis* (hiding truth) and *promissio falsitatis* (promising falsehood) is addressed, as the Lead might argue they are just hiding the severity. Augustine would argue the *impression* given is the lie.

