      *   *Truth vs. Truthfulness:* One can speak truth but not truthfully. If I say true things intending you to believe a falsehood, is that a lie? Augustine says yes, effectively.
      *   *The "Officious" Lie:* Lies told for advantage/safety. Augustine hates these too, though less than malicious ones.
