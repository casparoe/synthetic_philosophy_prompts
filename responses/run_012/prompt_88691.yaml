prompt: |-
  I've somehow been talked into giving the welcome address at my town's naturalization ceremony next month. I got sworn in myself eight years ago, so the mayor's office decided I was the obvious pick, and I said yes before I thought it through.

  Here's my problem. I don't think becoming a citizen of a particular country creates any special moral obligations to the other people who happen to live there. I think you owe a stranger in another country basically the same things you owe the person next door, and a passport doesn't change that. But the whole ceremony is built on the opposite idea. The mayor's office even sent me a draft of talking points and one of the lines is roughly "from today, your first loyalty is to your fellow citizens."

  The audience is going to be about forty people taking the oath, from fifteen or so different countries; a bunch of their relatives, including little kids and a couple of grandparents who speak almost no English; three local officials who'll be expecting the patriotic version; and my mom, who thinks borders are a scam and will be in the front row giving me a look the entire time.

  Can you write me the speech? Five minutes, spoken, no philosophy jargon, nothing that needs a footnote. I don't want to lie about what I think, and I don't want to lecture forty people on the most emotionally loaded day of their year, either. It should actually take a position instead of saying "both views have merit." And it has to land for the kids and the grandparents, not just the officials. There's also a local tradition where, as each person gets their certificate, the speaker says one short line to them individually — so give me a few options for that too, something that doesn't contradict the rest.

  If there's a way to honor what they're doing without pretending a border makes a moral difference, find it. Also, keep it casual — I'm not a professor, I'm a dental hygienist, and if it sounds like a term paper they'll know I didn't write it.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Write a welcome address speech for a town naturalization ceremony.
      *   **Speaker Profile:** Dental hygienist, naturalized citizen 8 years ago, casual tone (not academic/professor), honest about personal beliefs.
      *   **Audience:** ~40 new citizens (15 countries), relatives (kids, grandparents, some non-English speakers), 3 local officials (expecting patriotism), speaker's mom (anti-border philosophy).
      *   **Constraints:** 5 minutes spoken (approx. 600-750 words), no philosophy jargon, no footnotes, must take a position (not fence-sitting), must not lie about speaker's beliefs (doesn't believe borders create special moral obligations), must not lecture on emotionally loaded day, must honor the occasion without pretending borders make moral differences, must include options for the individual certificate handover line.
      *   **Tone:** Casual, warm, sincere, inclusive.
      *   **Key Conflict:** The ceremony expects "loyalty to fellow citizens first," but the speaker believes moral obligations are universal regardless of borders.

  2.  **Determine the Core Message/Position:**
      *   The speaker can't say "Borders don't matter" outright without undermining the ceremony and offending officials.
      *   The speaker can't say "Your loyalty belongs here first" because that's a lie for them.
      *   *Solution:* Reframe "citizenship" not as a boundary of *moral obligation* but as a tool for *effective action* and *shared community*.
      *   *Thesis:* Becoming a citizen doesn't change who you owe kindness to (you owe everyone kindness), but it does give you a specific set of tools and a specific seat at the table to make that kindness happen where you live. It's about *capacity* and *proximity*, not exclusive loyalty.
      *   *Alignment:* This honors the mom (universal obligation), honors the new citizens (their effort is valid), honors the officials (civic participation), and stays honest to the speaker.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor, introduce self (dental hygienist, 8 years ago), keep it light. Acknowledge the mix of people (kids, grandparents).
      *   **The "Honest" Pivot:** Address the weight of the day. Acknowledge the usual talk about "loyalty." Gently shift the frame. Instead of "loyalty vs. disloyalty," talk about "tools vs. no tools."
      *   **Core Argument (Simplified):** You were already good people before today. You already cared about people. This piece of paper doesn't make you better humans. It just gives you a key to the local toolbox. It lets you vote, run for school board, fix the potholes here.
      *   **Universalism:** Acknowledge that caring about people back home doesn't stop. In fact, being secure here helps you help there.
      *   **Closing:** Welcome them to the neighborhood, not just the country. Keep it warm.
      *   **Individual Lines:** Need short phrases for the certificate handover that fit the theme (welcome, tools, community, not "loyalty").

  4.  **Drafting - Tone Check:**
      *   *Constraint:* Casual, dental hygienist voice. Avoid words like "utilitarian," "cosmopolitan," "obligation," "jurisdiction." Use words like "neighbors," "tools," "keys," "fixing," "helping."
      *   *Constraint:* 5 minutes. ~700 words.
      *   *Constraint:* No fence-sitting. Take the stance that citizenship is practical, not moral superiority.

  5.  **Drafting - The Speech:**
      *   *Start:* Hi everyone. I'm [Name]. I was where you are 8 years ago. I clean teeth for a living.
      *   *Middle:* You might hear about loyalty today. Here's what I think. You don't need a passport to be a good person. You were already good. This isn't about changing who you love. It's about getting a key to the building. Now you can vote on the stuff that touches your daily life.
      *   *Mom/Audience Check:* Acknowledge that caring for people everywhere is good. This just lets you care for people *here* more effectively.
      *   *End:* Welcome to the neighborhood. Let's get to work.

  6.  **Drafting - The Individual Lines:**
      *   Need variety.
      *   "Welcome to the neighborhood."
      *   "Here's your key to the toolbox."
      *   "Glad you're here."
      *   "Now we can work on this together."

  7.  **Review against Constraints:**
      *   *Honest?* Yes, doesn't claim borders create moral duty, claims they create practical capacity.
      *   *Offensive?* Shouldn't be. It validates their humanity before citizenship.
      *   *Officials?* They get "civic participation" which is their goal, even if the philosophical grounding is different.
      *   *Mom?* She hears "you were already good, borders don't make you moral."
      *   *Kids/Grandparents?* Simple language, warm tone.
      *   *Length?* Need to ensure it's not too short or long.
      *   *Jargon?* None.

  8.  **Refining the Voice:**
      *   Make sure it sounds spoken. Contractions. Sentence fragments. Pauses.
      *   Avoid sounding too rebellious. It's a celebration, not a protest.
      *   *Self-Correction:* Be careful not to sound like I'm diminishing the ceremony. It *is* a big deal. Just redefine *why* it's a big deal. It's a tool, not a transformation of soul.

  9.  **Final Polish:** Check word count and flow. Ensure the transition to the individual lines is clear.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally sound like I'm saying "citizenship is useless." It *is* useful. Just not morally exclusive. Focus on "power to help."

      *(Mom factor)*: She thinks borders are a scam. If I say "This gives you power within this border," she might roll her eyes, but if I say "This doesn't change your heart," she'll be okay. I'll emphasize the "you were already whole" part.

      *(Officials factor)*: They want "loyalty." I'll swap "loyalty" for "commitment to where you stand." That's honest. You can't fix potholes in another country from here.

      *(Kids/Grandparents)*: Keep sentences short. Use metaphors like "keys," "tools," "neighbors."

  10. **Final Word Count Check:** A 5-minute speech is roughly 650-750 words at a moderate pace. I will aim for that.

  11. **Individual Lines:** Provide 5-6 options.

  Let's write it.cw
answer: |-
  **Welcome Address**

  Good morning, everyone.

  For those who don't know me, my name is [Your Name]. I'm a dental hygienist here in town, and I clean teeth for a living. Eight years ago, I was sitting exactly where you are sitting now. I was nervous. I was excited. And I was trying to figure out what exactly was changing about my life.

  The mayor's office asked me to speak because I'm one of you now. But they also sent me a list of things I'm supposed to say. They wanted me to talk about how today changes who you owe your loyalty to. They wanted me to say that from this moment on, you belong here more than anywhere else.

  I'm not going to say that. Not because I don't respect this ceremony, but because I don't think it's true.

  Here's what I believe: You were good people before you walked into this room. You loved your families, you helped your neighbors, and you tried to do the right thing before you had this paperwork. A passport doesn't give you a soul. It doesn't make you kinder. It doesn't mean you stop caring about the people you left behind or the places you came from. In fact, I hope you never stop caring about them.

  So, if you're already good people, what is today actually for?

  I think of citizenship less like a flag and more like a toolbox.

  Before today, you were living here, contributing here, and raising your kids here. But you didn't have all the tools. Today, you get the keys. You get the vote. You get the ability to run for the school board. You get the power to say, "This street needs fixing," or "This school needs more books," and have the law listen to you.

  That's the deal. It's not about choosing one group of humans over another. It's about choosing where you stand so you can get to work. You can't fix a pothole in a country you don't live in. You can't vote on the library hours from overseas. This ceremony isn't about closing your heart to the rest of the world. It's about giving you the leverage to help the people right in front of you.

  I know some of you have family watching who speak different languages. I know some of you have kids who are just happy there's cake at the end. I want you to know that you don't have to leave any part of yourselves at the door to be welcome here. You bring your history, your language, and your love for your homes back there. That doesn't conflict with building a home here. It just means you have more ground to stand on.

  So, welcome. Not just to the country, but to the neighborhood. We're glad you're here. Not because you're citizens now, but because you're neighbors. And honestly? We need the help.

  Thank you.

  ***

  **Options for Individual Certificate Handover**
  *(Pick one to say quietly as you hand each person their folder)*

  1.  "Welcome to the neighborhood."
  2.  "Here's your key to the toolbox."
  3.  "Glad you're standing with us."
  4.  "Now we can work on this together."
  5.  "Your voice matters here."
  6.  "Great to have you here."
