answer: |-
  This is not an odd question at all. In fact, you have independently rediscovered a fundamental concept in decision theory and game theory. You aren't messing up the math; you are running into a specific property of how rational choices are structured.

  Here is the breakdown of the names, the math behind the "coin flip," and why the order of elimination sometimes changes your result.

  ### 1. Does this have a name?

  Yes, but it is usually described as a combination of two concepts rather than one single word.

  The specific trick where an option loses to a "coin flip" (a mixture) of other options is called **Mixed Strategy Dominance** (or sometimes **Dominance by a Convex Combination**).

  The process of crossing them off one by one, where removing one option makes the next one look bad, is called **Iterated Elimination of Dominated Strategies** (often abbreviated as IEDS).

  So, if you want to sound like a textbook, you are performing **Iterated Elimination of Strategies Dominated by Mixed Strategies.**

  ### 2. Is the "coin flip" different from plain comparison?

  Yes, it is mathematically distinct. This is the most important part to understand for your spreadsheets.

  *   **Pure Dominance:** This is when Option A is better than Option C in every scenario. If you plot these on a graph, A is simply "higher" than C.
  *   **Mixed Dominance:** This is when Option C is worse than a *weighted average* of A and B. Geometrically, imagine a triangle where the corners are your best options. Any option that falls *inside* that triangle is dominated by a mixture of the corners, even if it isn't dominated by any single corner.

  In economics and decision theory, this relates to the **Convex Hull**. If your options represent possible outcomes, the "efficient" options are always on the outer boundary (the hull). Any option sitting inside the shape created by the others is inefficient because you could achieve a better average result by randomizing between the outer options.

  So, to answer your question: The coin-flip part is not just the same idea "wearing a hat." It is a deeper layer of analysis. An option can survive a check for Pure Dominance but fail a check for Mixed Dominance.

  ### 3. Why does the order of elimination change the result?

  You asked if you are just messing up the math when the final survivor changes based on the order you cross things off. **You are not messing up.** This is a real, known mathematical phenomenon.

  It depends entirely on how you handle ties ("at least as good as").

  *   **Strict Dominance:** If you only cross off an option when the mixture is *strictly better* (no ties allowed), the order **does not matter**. You will always end up with the same set of survivors. In game theory, this is called *Iterated Elimination of Strictly Dominated Strategies*, and it is "order independent."
  *   **Weak Dominance:** If you cross off an option when the mixture is *better or equal* (ties allowed), the order **does matter**. This is called *Iterated Elimination of Weakly Dominated Strategies*.

  **Why does this happen?**
  Imagine Option C is exactly equal to a 50/50 mix of A and B.
  *   If you eliminate C first, A and B remain.
  *   But imagine Option D is slightly worse than C, but better than A alone. If you keep C, D might survive. If you eliminate C immediately because it "tied" the mixture, D might suddenly look worse than the remaining options and get eliminated too.

  By allowing ties, you introduce path dependence. The "chain reaction" you described becomes sensitive to which link you pull first. This is why your spreadsheet gives different answers when you change the order. It is not a calculation error; it is a property of weak dominance.

  ### 4. The Poker Connection

  Since you play poker, you have likely seen this without naming it. This is the logic behind **balancing your range**.

  If you only ever bet with your best hands (Pure Strategy), your opponent can fold every time. If you only bluff with your worst hands, they can call every time. To be unexploitable, you must mix your strategies.

  In your spreadsheet scenario:
  *   **Option C** is like playing a specific hand in a predictable way.
  *   **The Mix of A and B** is like randomizing your play (checking sometimes, betting sometimes) with different hands.
  *   If the random mix has a higher Expected Value (EV) than playing Option C straight up, then Option C is a "leak" in your game, even if C doesn't lose to A or B individually.

  ### 5. Summary and Advice for Your Spreadsheets

  To pin down the edges of what you are doing:

  *   **What counts:** You are identifying options that are inefficient because they lie inside the "convex hull" of better options.
  *   **Borderline case:** When an option is exactly equal to a mixture of others. This is where your order-dependence problem comes from.
  *   **What it is definitely not:** This is not "Stochastic Dominance" (which deals with probability distributions of risk) unless your spreadsheet is specifically modeling risk profiles. It is purely about Expected Value and linear combinations.

  **How to fix the order problem:**
  If you want your spreadsheet to give you a consistent answer every time, you have two choices:

  1.  **Ignore Ties:** Only cross an option off if the mixture is *strictly* better (e.g., the mix yields \$100.01 and the option yields \$100.00). This makes the result order-independent, but you might keep some "dead weight" options that are merely equal to the best plan.
  2.  **One-Pass Check:** Instead of crossing them off in rounds (which creates the chain reaction), calculate the "Convex Hull" of all options at once. In plain English: Identify the set of options that *cannot* be beaten by any mixture of *any* other options in the original list. This gives you the "efficient frontier" in one go, without the iterative elimination messing things up.

  For a casual life-decision spreadsheet, I recommend **Strict Dominance only**. If Plan C is exactly as good as a mix of A and B, just keep C in the running. It doesn't hurt to have an extra option that is tied for first place, but it does hurt to accidentally eliminate the best option because you processed a tie in the wrong order.

  ### The Verdict

  You have stumbled upon **Mixed Strategy Dominance** processed through **Iterated Elimination**. The "coin flip" logic is a distinct and more powerful filter than simple pairwise comparison. The fact that your results change based on order is real, caused by your allowance of ties (Weak Dominance), and is a well-documented quirk in decision mathematics. You aren't crazy; you're just doing advanced decision theory in Excel.
