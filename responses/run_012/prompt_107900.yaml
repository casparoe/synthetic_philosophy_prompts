prompt: |-
  I'm a tort lawyer — personal injury and clinical negligence, so I spend my life on duty, breach, causation and who ends up holding the loss. A philosopher friend keeps pressing Singer's drowning child on me: the shallow pond, the child, and roughly the principle that if you can prevent something bad without sacrificing anything of comparable moral importance then you ought to do it, and the distance between you and the child is not in itself morally relevant. I can follow it fine as philosophy. What I want is to see it put through my vocabulary instead.

  So: restate the argument as faithfully as you can in the concepts I actually work with — duty of care, acts versus omissions, foreseeability and proximity, the but-for test and intervening causes, remoteness, the reasonable person, a duty owed to a determinate claimant, contribution between joint wrongdoers, and the remedial tail (damages, insurance, who bears the loss in the end). Keep it honest: don't smuggle the law's assumptions in and then call it a translation.

  Then the residue report, which is the bit I actually want. What carries over cleanly, what has to be distorted to fit, what has no counterpart in my vocabulary at all — and for each bit of residue, whether it's my framework being too narrow (the law is a partial-compliance machine, it isn't in the business of maximal demands) or his argument being less determinate then it looks.

  Three things I'd like you to press on.

  First, the crowd. The pond in my world is never empty — there's a crowd on the bank, plus an insurer, a regulator and a budget. Singer's version seems to need exactly one person in a position to help. Does anything in the legal kit — joint and several liability, contribution, something like market-share reasoning, the cheapest cost avoider idea — give a principled way of splitting a rescue duty across many potential rescuers? And does his principle say anything at all about that case, or does it quietly assume nobody else is standing there?

  Second, the cap. Legal duties are mostly ones somebody can be made to perform, and that caps them: no court makes you give up everything above marginal utility, and the reasonable person is not a hero. Is that cap a defect of the legal vocabulary, or a real constraint on any morality that has to be run by institutions — i.e. a morality that can't be institutionalised isn't worth much?

  Third, quickly: where rescue is already a service somebody provides for money — ambulance, coastguard, insurers — does the duty migrate from the passer-by to whoever funds the service? Or does framing it as an individual's duty only make sense in a world with no institutions in it at all?

  And be straight with me about what you're guessing at. I keep repeating the line that the common law imposes no general duty to rescue — is that even right any more, and where does it actually stand? Seperate out what's settled from what's genuinely contested among people who know the area, don't hand me a tidy consensus that isn't there, and say so plainly where you're unsure or where I've got the law wrong.

  No reading lists, no case citations, no footnotes — I can't check them and I'd rather have your reasoning. Plain English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Tort lawyer (personal injury and clinical negligence). Deeply familiar with legal concepts (duty, breach, causation, remoteness, damages, etc.). Skeptical of abstract philosophy when it doesn't map to practical reality.
      *   **Task:** Restate Peter Singer's "Drowning Child" argument using tort law vocabulary. Then, provide a "residue report" analyzing what fits, what distorts, and what's missing. Finally, address three specific pressure points (The Crowd, The Cap, Institutional Rescue) and clarify the current state of the "no general duty to rescue" rule.
      *   **Constraints:** No reading lists, no case citations, no footnotes. Plain English. Be honest about uncertainty/contestation in the law. Don't smuggle legal assumptions into the philosophy or vice versa.
      *   **Tone:** Professional, direct, analytical, respectful of both disciplines but critical of the gaps.

  2.  **Part 1: Restating Singer in Tort Vocabulary:**
      *   *Goal:* Translate "If you can prevent bad without comparable sacrifice, you ought to" into "Duty of Care/Breach/Damages."
      *   *Duty of Care:* Singer argues for a universal duty of rescue based on capacity to prevent harm, not proximity or relationship. In tort terms, this expands *Donoghue v Stevenson* "neighbour principle" to its absolute logical limit, ignoring the "fair, just, and reasonable" limitation.
      *   *Act vs. Omission:* Tort distinguishes sharply here (no liability for pure omissions usually). Singer collapses this distinction. If the outcome (death) is foreseeable and preventable, the omission is treated as a breach.
      *   *Foreseeability/Proximity:* Singer says distance (physical or moral) is irrelevant. Tort says proximity is essential. Translation: Foreseeability of harm is sufficient to establish proximity.
      *   *Breach/Reasonable Person:* The "reasonable person" in tort is ordinary, not heroic. Singer's standard is "marginal utility." Translation: Breach is measured against the capacity to save, not the custom of the industry or society.
      *   *Causation:* But-for test applies easily. If I walk by, child dies. If I stop, child lives.
      *   *Remoteness:* Singer says the loss (death) is directly recoverable. Tort might argue economic loss to the rescuer is too remote or disproportionate.
      *   *Damages/Loss:* Singer implies the loss should lie where it can be cheapest avoided (the passerby's pocket vs. the child's life). Tort looks at insurance and ability to pay.
      *   *Drafting the Restatement:* I need to sound like a lawyer talking to a lawyer. "Imagine a claimant (the child) suing a defendant (the passerby)..."

  3.  **Part 2: The Residue Report:**
      *   *What carries over:* Causation (but-for is clear), Foreseeability (harm is obvious).
      *   *What distorts:* The "Reasonable Person." Tort uses an objective, community standard. Singer uses a utilitarian calculus. The "Duty" concept itself (Tort is bipolar, Singer is multilateral).
      *   *What's missing:* The "Fair, Just, and Reasonable" policy check. Tort explicitly asks "Is it good for society to have this duty?" Singer asks "Is it morally right?"
      *   *Narrowness vs. Indeterminacy:* Is law too narrow? Yes, it's a minimum standard. Is Singer too indeterminate? Yes, "comparable moral importance" is vague compared to "reasonable steps."

  4.  **Part 3: The Three Pressure Points:**
      *   *1. The Crowd (Multiple Defendants):*
          *   *Tort:* Joint and several liability usually requires a common design or concurrent torts. Pure omissions by multiple parties don't usually trigger this. Market share liability (e.g., DES cases) is rare and specific. "Cheapest cost avoider" is economic theory, not black-letter law.
          *   *Singer:* His principle struggles here. If 100 people walk by, does each owe 1/100th of the duty? Or does the duty vanish because "someone else will"? Singer implies individual responsibility regardless of others, but practical application gets messy.
          *   *Verdict:* Tort has mechanisms (contribution) but they require established liability first. Singer lacks a clear allocation mechanism for crowds.
      *   *2. The Cap (Institutional Feasibility):*
          *   *Tort:* The cap is real. You don't have to ruin yourself.
          *   *Singer:* Demands sacrifice up to the point of comparable moral importance.
          *   *Analysis:* Is the legal cap a defect? Or a feature of *enforceable* morality? Law is a floor; morality is a ceiling. Institutionalizing Singer's view might collapse the system (too many claims, impossible enforcement).
      *   *3. Institutional Rescue (Privatization/State):*
          *   *Tort:* If a professional service exists (ambulance), duty often shifts to them *if* they assume responsibility. But it doesn't necessarily extinguish the passerby's moral duty, though legally the passerby is off the hook.
          *   *Singer:* Institutions don't absolve the individual unless the institution is actually effective. If the ambulance is slow, you still act.
          *   *Verdict:* Law uses institutions to limit liability. Singer uses them as tools, not exemptions.

  5.  **Part 4: The "No General Duty to Rescue" Status:**
      *   *Current State:* Generally, the common law rule stands (no duty to rescue strangers).
      *   *Exceptions:* Assumption of responsibility, special relationships (parent/child, employer/employee), creating the danger.
      *   *Contestation:* There is academic pressure to expand it (e.g., easy rescue statutes in some jurisdictions, human rights arguments), but the core common law rule is robust in UK/Aus/Can. US varies by state.
      *   *Honesty Check:* I need to admit that while the rule is "settled," the *justification* is contested. Some judges hate it; others defend it as liberty-protecting. I shouldn't pretend it's monolithic.

  6.  **Review and Refine:**
      *   *Check Tone:* Is it too academic? Keep it punchy. "You know the drill."
      *   *Check Constraints:* No citations. (Avoid *Smith v Littlewoods*, *Yuen Kun Yeu*, etc.).
      *   *Check Vocabulary:* Ensure terms like "remoteness," "proximity," "joint tortfeasors" are used correctly in the lawyer's context.
      *   *Self-Correction on "Crowd":* Be careful not to say tort *never* deals with multiple defendants. It does, but usually for *acts*, not *omissions*. The distinction is crucial.
      *   *Self-Correction on "Cap":* Distinguish between "undue burden" in law vs. "comparable moral importance" in philosophy.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Residue Report" is distinct. Make sure the "Three Things" are addressed directly. End with the "No General Duty" reality check. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't accidentally validate Singer's argument as *law*. I must keep the translation hypothetical. "If we were to plead this..."
  Also, the user asked about "market-share reasoning." I need to be careful there—that's products liability, not rescue. I should note the disanalogy.
  The "Cheapest Cost Avoider" is Calabresi/economic analysis, not strict tort doctrine, but lawyers know the concept. I'll frame it as policy argumentation.

  Let's assemble the response.
answer: |-
  Here is the translation of Singer's argument into your working vocabulary, followed by the residue report and the three pressure points you requested.

  ### Part 1: The Tort Translation
  **Claimant:** The drowning child (or their estate).
  **Defendant:** The passerby (you).
  **Cause of Action:** Negligence (specifically, liability for pure omission).

  **Duty of Care:**
  We argue that the "neighbour principle" should be interpreted without the usual policy constraints. Foreseeability of harm is absolute (you saw the child). Proximity is established by physical presence and capacity to act, not by relationship or assumption of responsibility. The "fair, just, and reasonable" check is satisfied by the magnitude of the interest at stake (life) versus the cost to the defendant (ruined clothes/lateness). We submit that distance (geographic or relational) is irrelevant to proximity where the capacity to prevent harm is present.

  **Breach:**
  The standard of care is not the "reasonable person" in the street, but the "reasonable person with the capacity to prevent death." Custom and practice (walking past) is irrelevant if the custom is morally deficient. The breach is the failure to act. We argue that the distinction between act and omission should be collapsed where the outcome is identical and preventable.

  **Causation:**
  The "but-for" test is straightforward. But for the defendant's failure to wade in, the claimant dies. There are no *novus actus interveniens* because the water didn't drown the child; the defendant's inaction permitted it.

  **Remoteness:**
  The damage (death/injury) is of the very kind that made the duty necessary. It is not remote.

  **Defences:**
  Contributory negligence is unlikely (child is too young). Volenti doesn't apply. The only defence is "impossibility" (e.g., the defendant cannot swim), but Singer's principle shifts the burden to prove that the sacrifice was of *comparable moral importance* to the child's life.

  **Remedies:**
  Damages are calculated on the usual basis (loss of expectation of life, etc.), but the argument implies specific performance (duty to rescue) rather than just ex-post compensation. Regarding loss distribution: The loss should lie on the passerby, not the victim, because the passerby is the cheapest cost avoider. Insurance is irrelevant to liability, though relevant to satisfaction of judgment.

  ***

  ### Part 2: The Residue Report

  **What Carries Over Cleanly:**
  *   **Causation:** The factual causation is identical in both frameworks. The but-for test works perfectly for the drowning child.
  *   **Foreseeability:** Both agree the harm must be foreseeable.
  *   **Loss Allocation:** Both agree that, ceteris paribus, the loss is better borne by the walker than the drowner.

  **What Has to Be Distorted:**
  *   **The Reasonable Person:** This is the biggest friction point. Tort law uses an objective, community standard (what does society expect?). Singer uses a utilitarian calculus (what produces the best outcome?). To fit Singer into tort, you have to redefine the "reasonable person" as a "morally optimal person," which destroys the legal concept of reasonableness as a social baseline.
  *   **Act vs. Omission:** Tort law relies on this distinction to limit liability. Singer explicitly rejects it. To translate him, you have to argue that omissions *are* acts when the duty exists, which circularly assumes the conclusion (that the duty exists).
  *   **Proximity:** In tort, proximity is a control mechanism to limit the scope of liability. Singer argues proximity is morally irrelevant. You have to stretch "proximity" to mean "causal capacity" rather than "relational closeness."

  **What Has No Counterpart:**
  *   **The "Comparable Moral Importance" Test:** Tort has no scale for weighing "my suit" against "your life" other than the binary of "reasonable steps." Singer demands a granular weighing of utility that courts are institutionally incapable of performing case-by-case.
  *   **The "Fair, Just, and Reasonable" Policy Check:** Tort explicitly asks, "If we impose this duty, will it flood the courts/chill liberty?" Singer's philosophy has no procedural gatekeeping. It is substantive only.

  **Diagnosis:**
  Is the framework too narrow? Yes. Tort is a partial-compliance machine designed for a society of strangers who owe each other limited duties. It is not designed for maximal moral demands.
  Is the argument indeterminate? Also yes. "Comparable moral importance" is vastly vaguer than "reasonable steps." A judge can determine what a reasonable person does; they cannot easily determine what maximizes global utility.

  ***

  ### Part 3: The Three Pressure Points

  **1. The Crowd (Multiple Potential Rescuers)**
  *   **The Legal Kit:** Tort handles multiple defendants well *if* they are joint tortfeasors (common design) or concurrent tortfeasors (both caused the damage). But for omissions? It breaks down. If 50 people walk by, and none stop, who is liable? All of them? Joint and several liability would allow the claimant to sue any one of them for the full loss, leaving them to seek contribution from the others. But contribution requires the others to be *liable* in the first place. If the law says "no duty to rescue," none are liable.
  *   **Market Share/Cheapest Cost Avoider:** These are economic theories, not black-letter tort. Market share liability (used in some product cases) apportions damage based on statistical likelihood of causation. It doesn't fit rescue because causation here is certain (any *one* could have saved), not statistical. "Cheapest cost avoider" suggests liability should fall on whoever can prevent the harm cheapest. In a crowd, that might be the strongest swimmer, or the closest person. Tort has no mechanism to identify the "cheapest" rescuer in real-time.
  *   **Singer's View:** Singer's principle is individualistic. It says *you* must act if *you* can. It doesn't inherently account for the crowd. If 50 people are there, Singer implies 50 people have the duty. If everyone assumes someone else will do it, everyone breaches. He doesn't offer a clean theory of apportionment for omissions in a crowd, other than to say everyone who failed is morally culpable.
  *   **Verdict:** Tort has no principled way to split a rescue duty among a crowd of strangers without first establishing a duty that doesn't currently exist. Singer assumes the duty attaches to the individual regardless of the crowd, which leads to over-determination of duty (50 duties for 1 rescue).

  **2. The Cap (Institutional Feasibility)**
  *   **The Legal Cap:** The law caps duty at "reasonable steps." You don't have to die to save a life. You don't have to give all your money.
  *   **The Moral Cap:** Singer's cap is "marginal utility." You give until giving more causes you harm comparable to the good you prevent.
  *   **Defect or Feature?** This is the crux. If morality is to be institutionalized (i.e., turned into law), it must be enforceable. A duty that requires self-sacrifice above a certain threshold is unenforceable because people will not comply, and courts cannot police it without intrusive inquiry into personal finances and risk tolerance.
  *   **Verdict:** The legal cap is likely a real constraint on *institutional* morality. A system that demands heroism collapses because participation becomes too costly. The law sets a floor (minimum civility); Singer sets a ceiling (moral sainthood). You cannot legislate the ceiling without breaking the floor.

  **3. Institutional Rescue (Privatization)**
  *   **Migration of Duty:** In tort, if a professional service exists (ambulance/coastguard), the duty often shifts to them *once they are engaged* (assumption of responsibility). But it rarely extinguishes the passerby's potential liability if they created the danger. However, for pure omissions, the existence of a state rescue service is often used as a policy reason *not* to impose a duty on citizens (the state has the monopoly on force/rescue).
  *   **Singer's View:** Institutions do not absolve the individual unless the institution is actually effective. If the ambulance is 30 minutes away and you are there now, the duty remains on you. The existence of a funded service is relevant only to the "cost" side of the calculus (maybe calling them is cheaper than jumping in).
  *   **Verdict:** Framing it as an individual duty makes sense even with institutions, but the *legal* duty migrates to the institution to avoid conflicting standards of care. The law prefers a single point of liability (the professional) over diffuse liability (the public). Singer prefers the most effective outcome, regardless of who is paid to do it.

  ***

  ### Part 4: The "No General Duty" Rule — Status Check

  You asked me to be straight about the law here.

  **The Settled Position:**
  In the common law world (UK, Australia, Canada, and most US states), the general rule remains: **There is no duty to rescue a stranger.** You can watch a child drown in a shallow pond, walk away, and incur no civil liability, provided you didn't push them in. This is robust. It is not going anywhere soon.

  **The Exceptions (Where the Rule Bends):**
  1.  **Assumption of Responsibility:** If you start the rescue, you must not make it worse (you can't leave them in a worse position than you found them).
  2.  **Special Relationships:** Parent/child, employer/employee, school/pupil.
  3.  **Creation of Danger:** If you created the risk, you have a duty to mitigate it.
  4.  **Control of Land/Premises:** Occupiers have duties to visitors, sometimes extending to trespassers regarding known dangers.

  **The Contested Ground:**
  *   **Human Rights:** There is academic and some judicial argument (particularly in Europe under the ECHR) that positive obligations under human rights law might creep into private law, forcing states to mandate rescue. This is contested and hasn't fundamentally overturned the common law rule in private litigation.
  *   **"Easy Rescue" Statutes:** Some US states (like Vermont) and many European jurisdictions (France, Germany) have criminal statutes mandating easy rescue. This does not automatically create a *tort* duty for damages, but it influences the standard of care. In the UK, there is no such statute.
  *   **Judicial Discomfort:** Many judges hate the rule. You will find dicta in higher courts expressing moral distaste for it. However, they uphold it on policy grounds: fear of litigation, uncertainty, and the value of individual liberty (freedom from coercion).

  **Where I'm Guessing/Uncertain:**
  *   **The "Trend":** It is hard to say if the common law is slowly eroding this rule. Some recent negligence cases expand "assumption of responsibility" in ways that look like backdoor rescue duties. But there is no clear trajectory. The Supreme Court tends to pull back when it feels lower courts are expanding liability too far.
  *   **Insurance Impact:** There is a theoretical argument that widespread liability insurance should make rescue duties easier to impose (the loss is spread). Courts rarely admit this explicitly, but it likely influences the "fair, just, and reasonable" test. I am guessing at the weight of this factor because judges won't write it down.

  **Bottom Line:**
  Your friend's argument is morally robust but legally alien. To make it work in tort, you have to dismantle the "act/omission" distinction and the "fair, just, and reasonable" policy check. The law isn't just "behind" the philosophy; it is built on different foundations (corrective justice between parties vs. utilitarian maximization of good). The "no duty to rescue" rule is settled black-letter law, despite being morally controversial. Don't let a judge tell you it's "evolving" without a specific factual hook (like assumption of responsibility); in a pure stranger/omission case, you will lose.
