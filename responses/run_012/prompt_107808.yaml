answer: |-
  **Brainstorming Candidate Framings**

  **Candidate 1: The Metaphysical Grounding.**
  *Question:* Can physical facts alone fix a unique computational description of a system?
  *Finding:* A proof that physical facts underdetermine computational description, reinforcing the triviality argument.
  *Likelihood:* Low value. This is a settled debate in the philosophy of computation. Re-establishing it does not advance the ethical question and risks getting stuck in metaphysical weeds without reaching the moral implications.

  **Candidate 2: The Epistemic Policy.**
  *Question:* Given uncertainty about machine sentience, what precautionary principle should govern our treatment of artificial systems?
  *Finding:* A risk-weighted decision rule for attribution based on available evidence.
  *Likelihood:* High feasibility. This is practical and policy-relevant. However, it bypasses your core insight about description relativity. It treats the uncertainty as merely empirical rather than structural, missing the opportunity to critique how we define the systems themselves.

  **Candidate 3: The Normative Constraints on Description.**
  *Question:* Under what normative constraints must an observer select a level of description when attributing moral status to a computational system?
  *Finding:* A set of principles preventing arbitrary description selection to avoid moral evasion or inflation.
  *Likelihood:* Moderate to High. This bridges the metaphysical insight (computation is relative) with the ethical need (we must act). It leverages your background in modeling (levels of description) and avoids deflationary relativism by demanding justification for descriptive choices.

  **Selection Rationale**

  I recommend pursuing Candidate 3. Candidate 1 is too abstract and risks ending in skepticism without ethical traction. Candidate 2 is too pragmatic and ignores the metaphysical problem you identified: if the property itself depends on the description, a precautionary principle based on evidence is insufficient because the evidence is theory-laden. Candidate 3 makes the relativity of computation ethically salient rather than paralyzing. It shifts the burden from finding the "right" property to justifying the "right" description, which is a tractable normative problem suitable for a one-year part-time project.

  ***

  **Project Proposal: Normative Constraints on Computational Description in Moral Attribution**

  **Research Question**
  Under what normative constraints must an observer select a level of description when attributing moral status to a computational system?

  This question is precise because it shifts the inquiry from the ontology of the system to the ethics of the observer. A determinate answer would take the form of a principle or set of principles that rules out certain descriptive choices as morally impermissible, even if those choices are computationally valid. I will recognize a successful answer if it provides a criterion for distinguishing between a legitimate descriptive simplification and a morally evasive re-description.

  **Context and Existing Positions**
  Current debates regarding machine sentience generally operate within two frameworks, both of which leave this question open. The first framework assumes that moral status supervenes on intrinsic computational properties, such as information integration or recurrent feedback. This view seeks a specific structural marker that, if present, guarantees sentience. The second framework treats the attribution of sentience as purely empirical, assuming that neuroscience or behavioral testing will eventually settle the matter.

  Both positions share a critical blind spot: they assume that the computational description of a system is fixed by the physics of the system or is irrelevant to the moral question. However, computational properties are attributed relative to a level of description. The same physical system can be described as a simple switch or a complex logic gate depending on the granularity of the model. If moral status depends on computational properties, and computational properties depend on descriptive choice, then moral status is underdetermined by the physics alone. Existing positions fail to address who is entitled to choose the description and on what grounds. This leaves the door open for arbitrary attribution, allowing observers to either inflate moral status through gerrymandered descriptions or evade moral responsibility by adopting overly coarse-grained models. My project addresses this gap by arguing that the choice of description is itself a moral act subject to normative constraint.

  **Method and Timeline**
  I will undertake this project over twelve months on a part-time basis, leveraging my background in computational modeling to analyze descriptive practices.

  *Months 1–3:* I will map the conceptual landscape. I will read broadly in the philosophy of computation to formalize the claim that computational properties are observer-relative. I will also review current ethical frameworks for artificial agents to identify where descriptive assumptions are hidden. The deliverable for this phase is a conceptual map detailing where current arguments rely on unstated descriptive choices.

  *Months 4–6:* I will construct the core argument. I will attempt to derive normative constraints from the requirement of moral consistency. The central hypothesis is that an observer is not licensed to adopt a description that systematically obscures potential markers of sentience without justification. I will test this argument against counter-examples, such as trivial systems described complexly or complex systems described trivially. I will judge the strength of the argument by its ability to withstand cases where the descriptive choice benefits the observer.

  *Months 7–9:* I will apply the framework to case studies. I will select two contrasting systems: a large language model and a simple reinforcement learning agent. I will analyze how different levels of description alter the attribution of candidate sentience markers. This is not an empirical test of the systems, but a test of the descriptive framework. I will determine if my proposed constraints yield stable moral judgments across these cases.

  *Months 10–12:* I will draft and refine the final manuscript. I will focus on clarity and rigor, ensuring the distinction between ontological claims and procedural constraints is maintained. I will submit drafts to two colleagues for critique, specifically asking them to identify where the argument might collapse into relativism.

  **Justification of Approach**
  This approach is necessary because the obvious alternatives are insufficient. Simply surveying candidate markers of sentience fails because it assumes the markers are intrinsic to the system. If the markers are description-relative, surveying them does not solve the problem of which description to use. Treating the matter as purely empirical for the neurosciences fails because neuroscience cannot dictate the level of computational abstraction at which moral status emerges. A neuroscientific account can tell us what physical processes occur, but it cannot tell us which computational interpretation of those processes is morally relevant. By focusing on the normative constraints on description, I address the problem at the level where it actually arises: the interface between the observer's modeling practices and the system's physical reality.

  **Success and Failure Conditions**
  A successful outcome will be a robust argument establishing that descriptive choices are bound by normative constraints, specifically that observers must adopt the finest-grained description compatible with their epistemic resources when moral status is at stake. This would provide a procedural ethic for AI interaction that does not rely on settling the metaphysics of consciousness.

  I define failure honestly. If I demonstrate that no non-arbitrary constraints can be derived—that is, if I prove that any descriptive choice is as morally valid as any other provided it is computationally accurate—this will count as a failure of the hypothesis, though a success of the inquiry. I would rather establish this negative result than promise a positive theory that cannot be sustained. If the project leads to the conclusion that the question is ill-posed, I will document that reasoning clearly rather than forcing a solution.

  **Scope and Feasibility**
  I am a retired scientist working part-time. This scope is realistic because it does not require new empirical data or extensive collaboration. It relies on conceptual analysis and the application of my existing expertise in modeling levels of description. The risk lies in the potential for the argument to become too abstract. I will mitigate this by anchoring the work in the case studies during months 7–9. The distinction central to this project is between *ontological criteria* (what the system is) and *procedural criteria* (how we describe it). Without this distinction, the project collapses into standard metaphysics of mind. With it, the project offers a new pathway for ethics in contact with the sciences, suitable for the foundation's mission.
