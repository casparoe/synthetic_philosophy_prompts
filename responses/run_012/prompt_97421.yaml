  The Honest Part
  The single feature doing the real work is the anti-revision clause. A defender of the Present-Interests view would attack the case as rigged by arguing that autonomy is essentially present-tense, making it metaphysically impossible for a past self to bind a future competent agent regardless of clauses. The case confirms its purpose: it demonstrates that precedent-autonomy and present-interests views can come apart even when competence and formal validity are held fixed, forcing the verdicts to fall out of the theories rather than be stipulated.
