  (i) Precedent-Autonomy View
  Verdict: Cease treatment.
  Turning Feature: The authority of critical interests established during competence extends across time, binding the later self even against current wishes to protect the integrity of the life plan.

  (ii) Present-Interests View
  Verdict: Continue treatment.
  Turning Feature: Moral standing belongs only to the present subject of experience who bears the consequences of harm or benefit, making current competence the sole gateway to authority.

  (iii) Narrative-Continuity View
  Verdict: Continue treatment.
  Turning Feature: The radical personality shift severs narrative identity, rendering the earlier self a stranger whose directives lack binding force over the new character.

  Variable Isolation
