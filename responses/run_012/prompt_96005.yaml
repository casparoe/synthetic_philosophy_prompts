answer: |-
  Here is a plan for the ninety minutes, structured to prevent the audience from settling into a passive consensus before they have grasped the mechanism of the argument.

  ### 1. The Sequence of Arrival

  Do not begin with the definition of lexical priority. If you define the rule before they feel the need for it, they will treat it as an arbitrary restriction. The sequence must move from **intuition** to **breakdown** to **structure**.

  1.  **The Baseline (Minutes 0–15): Establish Commensurability.**
      Start by eliciting agreement that trade-offs *usually* happen. Ask for mundane examples where they accept pain for pleasure (the dentist, the gym, the spicy meal). Establish the "Common Currency" intuition: we act as if there is an exchange rate.
      *   *Why here:* You must build the utilitarian baseline so the lexical view appears as a necessary correction, not a weird exception.

  2.  **The Central Case (Minutes 15–45): The "Pain Ladder."**
      Introduce the example (detailed below). Walk them up the rungs. Allow the trade-off on the lower rungs. Stop them on the upper rungs.
      *   *Why here:* This creates the cognitive dissonance. If they agree to the trade on Rung 1 but refuse it on Rung 3, they have admitted the scale is not linear. They have found the threshold themselves before you name it.

  3.  **The Structural Claim (Minutes 45–65): Naming the Threshold.**
      Now introduce the term "lexical priority." Explain that below the threshold, the common currency holds; above it, the currency collapses.
      *   *Why here:* You are now providing the vocabulary for the intuition they just generated. This prevents the "jargon fatigue" you fear.

  4.  **The Boundary Conditions (Minutes 65–80): Pre-empting Misconceptions.**
      Address the specific errors (detailed below) while the example is still fresh.
      *   *Why here:* If you leave these for the Q&A, the discussion will devolve into semantic quibbles rather than structural understanding.

  5.  **The Diagnostic (Minutes 80–90): The Final Question.**
      Pose the closing question (detailed below) and dismiss.

  ### 2. The Central Case: "The Voluntary Ladder"

  You are correct to reject the "whole life" comparison. It invites aggregation (summing years) which allows the utilitarians to calculate their way out of the intuition. You need an example that is **episodic, fixed in duration, and variable in intensity.**

  **The Case:**
  Present a hypothetical medical trial. The participant is confined for **one hour**.
  *   **Rung 1:** You endure a mild headache (suffering) for 10 minutes. In exchange, you receive 50 minutes of intense, flow-state euphoria (pleasure). *Ask: Do you take it?* (Most will say yes. The trade holds.)
  *   **Rung 2:** You endure severe migraine pain (suffering) for 10 minutes. In exchange, you receive 50 minutes of intense euphoria. *Ask: Do you take it?* (Many will hesitate. The trade is fraying.)
  *   **Rung 3:** You endure 10 minutes of torture-level nerve agony (suffering). In exchange, you receive **50 years** of intense euphoria (pleasure). *Ask: Do you take it?*

  **What it must contain:**
  *   **Fixed Suffering Duration:** Keep the pain duration constant (10 minutes) so they cannot argue "I can endure anything for a short time."
  *   **Escalating Pleasure:** The pleasure must increase massively (from minutes to years) to test the "no amount of pleasure" claim.
  *   **Immediate Experience:** It must be about *their* experience, not a policy decision for others. This bypasses the "greater good" calculations.

  **What it must be kept free of:**
  *   **Long-term Consequences:** No mention of trauma, PTSD, or health effects from the pain. The suffering must be contained to the experience itself. If you allow them to argue "the pain ruins the pleasure later," they have reverted to a calculation of net pleasure, which defeats the point.
  *   **Moral Virtue:** Do not allow them to frame refusal as "bravery" or "dignity." Frame it purely as a transaction of welfare.

  ### 3. Misconceptions and Pre-emption

  Your list is accurate. Here is where to head them off in the sequence.

  **1. The Empirical Trap (Physiology vs. Normativity)**
  *   *The Error:* "If we find a neural common currency (e.g., dopamine vs. nociceptor firing rates), the philosophical problem dissolves."
  *   *Where to head it off:* **Minute 10 (The Baseline).**
  *   *How:* Explicitly state: "We are not asking how the brain *does* value things, but how we *ought* to value them. Even if a physiologist could map pain and pleasure to the same neural spike count, that would not tell us if we *should* trade them."
  *   *Why:* Given your background, the room will look to you for authority on the biology. You must disarm your own expertise immediately so the argument remains normative.

  **2. Incommensurability = Incomparability**
  *   *The Error:* "If they aren't on the same scale, we can't choose between them at all."
  *   *Where to head it off:* **Minute 55 (The Structural Claim).**
  *   *How:* When you define lexical priority, say: "To say they are incommensurable is not to say we are paralysed. We *do* choose. We choose to avoid the torture. But we do not choose by *measuring*. We choose by *rule*."
  *   *Why:* This distinguishes "no common unit" from "no decision procedure."

  **3. Lexical Priority = Infinite Weight**
  *   *The Error:* "This just means suffering counts as infinity on the scale."
  *   *Where to head it off:* **Minute 60 (The Structural Claim).**
  *   *How:* Clarify that "infinity" is a mathematical trick that preserves the single scale. Lexical priority *breaks* the scale. It is not that the suffering is heavier; it is that it belongs to a different category of claim. "Infinity" implies you could outweigh it with a bigger infinity. Lexicality implies you cannot outweigh it with *anything* from the other category.
  *   *Why:* This preserves the qualitative distinction your friend is defending.

  ### 4. The Final Diagnostic Question

  Do not ask "Do you agree?" Agreement is cheap. Ask a question that requires them to apply the *structure* of the view to a new constraint.

  **The Question:**
  *"If we discovered that the 'threshold' of suffering varied from person to person—that for some, the torture-level agony was tradable, while for others, the mild headache was not—does the lexical argument collapse, or does it simply move?"*

  **What separates the grasp from the taste:**
  *   **The Taster:** Will say, "It collapses because morality must be universal," or "It doesn't matter, pain is still bad." They are focusing on the *content* of the threshold.
  *   **The Grasper:** Will say, "The argument holds. The structure is that *whatever* the threshold is for that agent, pleasure cannot cross it. The variability of the threshold is an empirical fact; the lexical priority is the rule governing the threshold." They understand the priority is a structural relation, not a fixed quantity of pain.

  ### 5. What to Refuse to Explain

  You are correct to exclude population ethics and formal decision theory. Add one more boundary: **The Justification of the Threshold.**

  *   **The Refusal:** Your friend concedes he cannot answer where the threshold lies. Do not let the group spend the last twenty minutes trying to solve this.
  *   **The Line:** State clearly: "We are examining the *logic* of the priority claim, not the *location* of the boundary. Whether the threshold is at 'migraine' or 'torture' is a separate question from whether a threshold *exists*."
  *   **The Why:** The "vagueness objection" (that any threshold is arbitrary) is the standard counter-argument to this view. It is a deep rabbit hole. If you go there, you will run out of time and leave the room thinking the view is indefensible because the line is fuzzy. Keep them focused on the *existence* of the break in the scale, not the *precision* of the break.

  ### 6. Confidence and Weakest Point

  **Confidence:**
  I am **highly confident** in this sequence. It mirrors the Socratic method of eliciting a contradiction in the interlocutor's own intuitions (trade-off vs. non-trade-off) before offering the theoretical solution. This suits an audience of "quick professionals" who distrust lecturing.

  **The Weakest Point:**
  I am **least sure** about the audience's tolerance for the "Normative vs. Empirical" distinction (Minute 10).
  *   *Reason:* You are a physiologist. They know this. Even if you tell them not to ask about the nervous system, the presence of a pain expert in the room will tempt them to treat the "threshold" as a biological fact (e.g., "C-fiber saturation") rather than a moral postulate.
  *   *Risk:* They may try to "help" you by grounding the threshold in biology, which undermines the philosophical claim that the priority is moral, not mechanical.
  *   *Mitigation:* You may need to be more aggressive than planned in Minute 10. Explicitly say: "For the next 80 minutes, I am not a physiologist. I am a moral agent. My knowledge of the dorsal horn is irrelevant to whether I *should* sell my hour of agony."

  If you hold that line, the plan should hold the room.
