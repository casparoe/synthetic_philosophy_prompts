      *   *Is it verbal?* Partly. "Preference" and "Bias" are being used as honorifics vs. pejoratives. But it's not *merely* verbal because the stakes (paternalism) are real.
      *   *Is it covert normative?* Yes. This is the strongest diagnosis. Calling something a "bias" is a way of saying "this state does not track the good" or "this state lacks normative authority."
