answer: |-
  Your diagnosis is remarkably astute, and I suspect your reading group has stumbled upon one of the central knots in contemporary moral philosophy without realising that the rope you are pulling is not attached to the wall of psychology, but to the ceiling of normativity.

  To answer your primary question directly: this is not a substantive disagreement about the mind, nor is it merely verbal. It is, as the third faction in your group suspects, a covert normative disagreement wearing a psychological costume. Your hypothesis—that the distinction is downstream of the theory of welfare rather than upstream of it—is substantially correct. However, I would refine it slightly: it is downstream not only of welfare but of *authority*. The question is not merely 'what makes a life go well?', but 'whose verdict on what makes a life go well counts?'.

  Here is the diagnosis of why you are stuck, followed by a proposal for how to make progress.

  ### The Diagnosis: The Impossibility of a Value-Neutral Filter

  You agreed at the outset to hold the psychology fixed. This includes the strength of the desire, its stability, and the subject's own account of its genesis. If two agents possess identical psychological states—identical neural firings, identical reports, identical behavioural dispositions—there is no *descriptive* fact of the matter that can distinguish one state as a 'preference' and the other as a 'bias'.

  The distinction between a preference and a bias is not a distinction between two types of mental furniture. It is a distinction between two types of *normative standing*. When you label a state a 'preference', you are granting it authority in the social calculus. When you label it a 'bias', you are stripping it of that authority.

  The reason your procedural test (the flattering vs. unflattering causal story) yielded such frustrating results is that it exposed the normative engine driving the car. If the psychology is identical, the causal story cannot change the *nature* of the mental state; it can only change your *evaluation* of its legitimacy.
  *   If the story is 'flattering' (e.g., 'this preference arose from rational reflection'), you grant it authority.
  *   If the story is 'unflattering' (e.g., 'this preference arose from systemic deprivation'), you deny it authority.

  But since you have agreed to hold the psychological impact of that history fixed, the difference in verdict cannot be based on the *current* mental state. It must be based on a background theory that says certain histories render a current state normatively inert, even if it feels identical to one that is active. This confirms your suspicion: you are not discovering a psychological fact; you are applying a moral theory.

  The impasse arises because members of your group are likely operating with different, unstated theories of welfare and autonomy, while believing they are arguing about the classification of mental states.
  1.  **The Subjectivists** in your group likely believe that sincere endorsement is sufficient for authority. For them, if the agent wants it, it counts.
  2.  **The Objectivists** believe that some desires track the good and others do not. For them, a desire for a 'deprived life' is a bias because it fails to track objective well-being.
  3.  **The Proceduralists** believe that the *process* matters more than the outcome. For them, a desire is a bias if it was formed under conditions that undermine autonomy (deprivation, manipulation), regardless of current sincerity.

  Because you are debating the label ('preference' vs. 'bias') rather than the underlying theory, you are talking past one another. You are trying to solve a normative problem with a descriptive toolkit.

  ### Where Your Hypothesis Might Need Nuance

  You suggest the distinction is downstream of the theory of welfare. I would argue it is downstream of the theory of *prudential authority*.

  It is possible to agree on a theory of welfare (e.g., 'pleasure is good') but disagree on whether a specific attitude counts towards that welfare. For instance, two philosophers might agree that a life without pain is better. One might argue that a terminally ill patient's wish for a painful death is a 'preference' that must be respected due to autonomy, even if it reduces welfare. The other might argue it is a 'bias' (perhaps caused by depression) that should be discounted to maximise welfare.

  Here, the disagreement is not about what is good (welfare), but about the *weight* of the subjective attitude against the objective good. Therefore, the distinction is downstream of your broader political morality regarding paternalism, not just your theory of welfare.

  ### What Counts as Progress?

  If the impasse is indeed normative rather than empirical, no further psychological data will resolve it. You will not find a neuron that lights up only for 'true' preferences. Progress requires a change in the question you are asking.

  **1. Abandon the Search for a 'View from Nowhere'**
  Stop asking, 'Is this *really* a preference or a bias?' This implies there is a fact of the matter independent of your moral framework. There is not. Instead, ask: 'Under what conditions are we justified in overriding a sincere report for the sake of the agent's own good?' This forces the normative commitments into the open.

  **2. Distinguish Between 'Welfare-Constutiting' and 'Welfare-Tracking'**
  A useful distinction to draw is between attitudes that *constitute* welfare (i.e., getting what you want just *is* the good, regardless of content) and attitudes that *track* welfare (i.e., desires are useful heuristics for what is actually good, but can be mistaken).
  *   If your group leans towards the former, 'bias' is almost incoherent; sincere desire is king.
  *   If your group leans towards the latter, 'bias' is simply a desire that fails to track the good.
  Making this distinction explicit will likely split your group into clear camps, which is preferable to a muddled consensus.

  **3. The 'Reversibility' Criterion**
  Since you are interested in paternalism, a pragmatic criterion for 'bias' in a policy context is often *reversibility under improved conditions*.
  *   **Test:** If we alleviated the deprivation, removed the misinformation, or treated the depression, would the attitude persist?
  *   **Progress:** This does not solve the metaphysical question, but it offers a procedural heuristic for paternalistic intervention. If a preference is robust across changes in information and circumstance, it commands more respect than one that evaporates when the agent's situation improves. This moves the debate from 'what is this state?' to 'how stable is this state under counterfactual improvement?'.

  **4. Accept the 'Normative Costume'**
  Finally, progress might consist in accepting that the label 'bias' is essentially a pejorative normative judgement. There is no shame in this. When we call something a bias in the context of welfare, we are saying, 'This attitude does not merit weight in our calculation of the good.'
  *   **Action:** Rewrite your group's guiding question. Instead of 'How do we distinguish preferences from biases?', ask 'What gives a subjective attitude the authority to override an objective assessment of well-being?'

  ### Conclusion

  Your hypothesis is correct: no further psychology could settle this. The distinction is not upstream, waiting to be discovered in the mechanics of the mind; it is downstream, determined by the moral commitments you bring to the table.

  The progress available to you is not a solution to the puzzle, but a dissolution of it. You should cease trying to classify the mental states and begin classifying the *justifications for intervention*. If you can agree on when paternalism is permissible, you will find that the classification of the attitude follows automatically, rather than preceding it.

  You are not failing to find the boundary between preference and bias; you are discovering that there is no boundary there, only a bridge between psychology and normativity, and you are arguing about the toll fee. Focus on the toll fee.
