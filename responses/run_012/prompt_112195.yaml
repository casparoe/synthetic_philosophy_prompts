      *   **Current Impasse:** Procedural tests tracking causal stories suggest the distinction might be normative rather than descriptive. Some think it's about causal history; others think it's a moral judgement disguised as psychology.
      *   **Task:** Provide a *diagnosis* of the disagreement (substantive, verbal, talking past each other, or covert normative), evaluate the user's hypothesis (that the distinction is downstream of welfare theory), and suggest *progress* (new distinctions, criteria, question changes, or acceptance of impasse).
