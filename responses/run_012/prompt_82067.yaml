  # DECISION TREE: THE LIMITS OF THE CRIMINAL LAW

  **Instructions:** Answer each question with **Yes** or **No**. Follow the arrow to the next question or to a final position. Do not look ahead.

  ***

  ### START

  **1. Can the immorality of a harmless act ever count as a reason for the criminal law at all?**
  *   **No** → Go to Question 2.
  *   **Yes** → Go to Question 4.

  **2. Is preventing harm to the *actor* a valid reason for prohibition?**
  *   **Yes** → **LEAF 1: Harm Principle with Paternalistic Exception**
  *   **No** → Go to Question 3.

  **3. Does the state lack the *standing* to enforce even valid reasons in private life?**
  *   **Yes** → **LEAF 2: State Standing View**
  *   **No** → **LEAF 3: Strict Harm Principle**

  **4. Is the reason the *intrinsic wrongness* of the act itself?**
  *   **Yes** → Go to Question 5.
  *   **No** → Go to Question 6.

  **5. Is the punishment justified because the actor *deserves* suffering?**
  *   **Yes** → **LEAF 4: Retributive Legal Moralism**
  *   **No** → **LEAF 5: Integrity Legal Moralism**
      *   *Note: Leaves 4 and 5 cannot be told apart by cases (i)–(vi). To separate them, you would need a case where the punishment is purely symbolic rather than painful, or where the actor has already suffered enough.*

  **6. Is the consequence the *offence* the conduct gives to others?**
  *   **Yes** → **LEAF 6: Offence Principle**
  *   **No** → Go to Question 7.

  **7. Is the consequence the *damage* the conduct does to the actor himself?**
  *   **Yes** → **LEAF 7: Legal Paternalism (Degradation)**
  *   **No** → Go to Question 8.

  **8. Is the consequence the *coarsening of the moral climate* rather than the erosion of rules?**
  *   **Yes** → **LEAF 8: Moral Climate View**
  *   **No** → Go to Question 9.

  **9. Do you seek to *criminalize* the practice rather than merely refuse to recognize or facilitate it?**
  *   **No** → **LEAF 9: Regulatory Non-Recognition**
  *   **Yes** → Go to Question 10.

  **10. Is the claim that shared morality keeps society from coming apart an *empirical prediction*?**
  *   **No** → **LEAF 10: Constitutive Morality View**
  *   **Yes** → Go to Question 11.

  **11. Is the morality being protected the one the community *actually has*?**
  *   **Yes** → **LEAF 11: Conventionalist Devlinism**
  *   **No** → **LEAF 12: Critical Morality View**

  ***

  ### THE POSITIONS (LEAVES)

  **LEAF 1: Harm Principle with Paternalistic Exception**
  *   **Awkward Commitment:** You must accept that the state knows better than a competent adult what is good for them.
  *   **Embarrassing Case:** Case (vi), because the participants insist they are happier after irreversible modification.

  **LEAF 2: State Standing View**
  *   **Awkward Commitment:** You must tolerate public nuisances if they can be labelled 'private' conduct.
  *   **Embarrassing Case:** Case (i), because the rabbit feeding happens in a front garden in view of the road.

  **LEAF 3: Strict Harm Principle**
  *   **Awkward Commitment:** You must allow an individual to destroy their own body if they consent to it.
  *   **Embarrassing Case:** Case (ii), because the adults consent to permanent scarring and branding.

  **LEAF 4: Retributive Legal Moralism**
  *   **Awkward Commitment:** You must punish sincere religious rites if your moral calculus deems them intrinsically evil.
  *   **Embarrassing Case:** Case (v), because the goat slaughter is painless and central to a minority faith.

  **LEAF 5: Integrity Legal Moralism**
  *   **Awkward Commitment:** You must use the law to teach morality even when no one is harmed.
  *   **Embarrassing Case:** Case (iii), because licensing the market reduces the harms of the black market.

  **LEAF 6: Offence Principle**
  *   **Awkward Commitment:** You allow a majority's sensitive feelings to veto a minority's private practices.
  *   **Embarrassing Case:** Case (v), because the town's majority finds the religious rite barbaric.

  **LEAF 7: Legal Paternalism (Degradation)**
  *   **Awkward Commitment:** You assume that selling a kidney is worse for the seller than the poverty that drives them to it.
  *   **Embarrassing Case:** Case (iii), because the sellers are informed, paid, and the market reduces black market harms.

  **LEAF 8: Moral Climate View**
  *   **Awkward Commitment:** You must ban acts in private because of their hypothetical effect on the public tone.
  *   **Embarrassing Case:** Case (i), because the man feeds rabbits in his own garden.

  **LEAF 9: Regulatory Non-Recognition**
  *   **Awkward Commitment:** You create a black market by refusing to license a practice you know will happen anyway.
  *   **Embarrassing Case:** Case (iii), because the unlicensed market increases harm to the sellers.

  **LEAF 10: Constitutive Morality View**
  *   **Awkward Commitment:** You must treat any change to shared morality as the end of society itself.
  *   **Embarrassing Case:** Case (vi), because body modification changes the shared image of the human form.

  **LEAF 11: Conventionalist Devlinism**
  *   **Awkward Commitment:** You must criminalize whatever the majority sincerely condemns, even if they are morally wrong.
  *   **Embarrassing Case:** Case (v), because the majority condemns the religious minority's rite.

  **LEAF 12: Critical Morality View**
  *   **Awkward Commitment:** You must claim access to objective moral truth to override the community's views.
  *   **Embarrassing Case:** Case (iii), because reasonable people disagree on whether selling kidneys is genuinely wrong.

  ***

  ### NOTES ON THE TREE

  **Indistinguishable Positions:**
  Leaves 4 (Retributive) and 5 (Integrity) will yield the same result on cases (i)–(vi). To tell them apart, you would need a case where the punishment is non-carceral (e.g., a public shaming order) which an Integrity theorist might accept but a Retributivist might reject as insufficient.

  **Incoherent Paths:**
  The tree structure prevents the most obvious incoherence (claiming immorality is not a reason, but then banning based on moral consequences). However, a user who answers **Yes** to Question 1 but **No** to Question 4 (Wrongness) and **No** to Question 6, 7, and 8 (Consequences) has no reason left for prohibition; the tree forces them to Leaf 9 or 10 to resolve this.

  ***

  ### ANALYSIS OF YOUR POSITION

  You stated you are **against the state policing private life**, **uneasy about the branding club**, and **unwilling to call disgust a reason**.

  1.  **Unwilling to call disgust a reason:** This forces you to answer **No** to Question 1 (Immorality/Disgust counts). This eliminates Leaves 4–12.
  2.  **Against policing private life:** This suggests **No** to Question 2 (Harm to self counts).
  3.  **Uneasy about the branding club:** This suggests you *want* to prohibit Case (ii), but the Strict Harm Principle (Leaf 3) forbids it.

  **The Instrument Places You At:**
  **LEAF 3: Strict Harm Principle**

  **What You Must Give Up:**
  To stay on this leaf consistently, you must give up your unease about the branding club (Case ii). You must accept that consenting adults branding each other is none of the law's business, regardless of how permanent the scars are. If you cannot give this up, you are forced to move to **Leaf 1 (Harm Principle + Paternalism)**, but to do so you must give up your commitment to not policing private life, as you would then endorse stopping people from harming themselves in private. You cannot hold all three intuitions simultaneously.
