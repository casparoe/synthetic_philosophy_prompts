answer: |-
  1. You distinguish epistemic lock-in from the standard increasing-returns story, arguing that it's not just about sunk costs or network effects, but about the narrowing of the imaginative horizon. If I'm a historian looking at the archive, how do I tell the difference between a technology that persisted because it was too expensive to swap out, and one that persisted because engineers literally stopped teaching the alternative? What specific empirical marker separates economic friction from cognitive blindness?

      *Follow-up:* You'll likely point to curricula or patent filings where alternatives vanish. But if a historian finds a case where the alternative remained in the training manuals and was well-understood, yet still wasn't adopted because the infrastructure was too entrenched, does that falsify your mechanism, or do you simply categorize that as a hybrid case where economics overrode epistemology?

  2. My friend argued that the Industrial Revolution was overdetermined by demographics and resources, implying the steam engine was inevitable even if Britain stalled. Your theory suggests that once a path is locked, the imagination narrows. Does this mean that if Britain had failed to develop the steam engine, the world wouldn't just have arrived at the same technology a century later, but might have developed a fundamentally different energy paradigm entirely? Are you arguing that lock-in changes the destination, not just the arrival time?

      *Follow-up:* So you're suggesting the technological landscape itself is shaped by the lock-in, rather than there being a fixed landscape we are all navigating. If that's true, does it imply that our current reliance on internal combustion has actively suppressed the development of viable electric or hydrogen infrastructures that would have been mature today had the lock-in not occurred in the 1920s?

  3. Let's look at cases where a locked-in standard was actually displaced, such as the shift from direct current to alternating current or the global adoption of the metric system. On your view, breaking epistemic lock-in requires an exogenous shock. Do you view the War of Currents or the political treaties behind metrication as those necessary shocks, or do these examples count as counterexamples where the community corrected itself through endogenous technical debate?

      *Follow-up:* But wasn't the superiority of AC endogenous to the engineering community once Tesla and Westinghouse demonstrated it? If the imagination reopened because the new technology performed undeniably better in practice, doesn't that suggest performance can break epistemic lock-in without needing an external catastrophe or political intervention?

  4. There's a normative tension here. If epistemic lock-in prevents us from seeing better options, it sounds like something we should prevent. But you argue that breaking it requires an exogenous shock to reopen the imaginative space. Are you suggesting we should rely on crises, wars, or collapses to innovate, or is there a way to manufacture that shock without the accompanying destruction?

      *Follow-up:* You might say we can create institutions that mimic shocks. But aren't institutions the very engines of epistemic narrowing, standardizing training and certification? How can an institution designed to stabilize knowledge be tasked with destabilizing it without ceasing to function as an institution?

  5. A critic might listen to this and say that epistemic lock-in is a useful metaphor, but ultimately unfalsifiable. Whenever a technology persists, you call it lock-in; whenever it changes, you call it a shock. Is this a testable hypothesis about historical causality, or is it a research program—a lens for viewing history that isn't meant to be proven right or wrong in specific instances?

      *Follow-up:* If it is a research program, I still need to know when to stop using the lens. Describe a specific historical finding or a pattern of evidence that, if discovered, would force you to abandon the concept of epistemic lock-in entirely. What would the world have to look like for your theory to be false?
