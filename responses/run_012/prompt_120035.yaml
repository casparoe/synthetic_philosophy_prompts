answer: |-
  **Final Exam: Metaphysics of Causation**
  **Time Allowed: 90 Minutes**

  **Essay Question**

  Standard counterfactual analyses suggest that an omission is a cause if, had the event occurred, the effect would not have happened. On this view, a gardener's failure to water a plant causes its death because had she watered it, it would have lived. However, this generates an problem of abundance: every other person in the city also failed to water the plant, and each failure satisfies the same counterfactual condition. Similarly, if a swimmer drowns while a lifeguard watches the clouds and a dozen sunbathers look at their phones, the counterfactual dependence holds for all of them equally.

  Write an essay evaluating the following thesis: *Causation by omission is not a distinctive metaphysical relation grounded in counterfactuals, but rather an artifact of causal selection driven by normative expectations.*

  In your evaluation, you must address three specific scenarios: (1) the gardener versus the rest of the city; (2) the lifeguard versus the sunbathers; and (3) a case where two individuals, each capable of throwing a life ring to a drowning swimmer, both fail to do so. Explain why the counterfactual account fails to distinguish causes in these cases, how the normative selection thesis resolves the distinction, and whether this thesis successfully handles the third scenario where multiple sufficient omissions occur simultaneously. Defend or refute the claim that norms, rather than facts, determine causal status in omission cases.

  ***

  **Model Answer**

  The counterfactual analysis of causation is initially compelling for omissions. It is true that if the gardener had watered the plant, it would not have died. However, as the prompt suggests, this truth is too cheap. It is also true that if I had watered the plant, or if the President had watered the plant, it would not have died. Since everyone failed to water it, everyone satisfies the counterfactual condition for being a cause. If we accept this, causation becomes ubiquitous and useless for assigning responsibility. Therefore, the counterfactual relation alone cannot distinguish the gardener's omission from the background conditions of the world.

  The stronger view is that omission causation is not a metaphysical discovery but a pragmatic selection. The world is full of counterfactual dependencies; causation is the tool we use to pick out the ones that matter to us. What makes them matter are norms and expectations. In the gardener case, the gardener is selected as the cause not because her counterfactual dependence is unique—it isn't—but because she occupies a role defined by the expectation of watering. The rest of the city operates under a default norm of non-interference. We select her failure because it violates a specific duty, whereas the city's failure is merely a state of affairs. The counterfactual facts are identical across the board; the normative status is not.

  This distinction sharpens in the lifeguard case. The lifeguard and the sunbathers all satisfy the counterfactual condition: if any one of them had acted, the swimmer would have lived. Yet, we intuitively label the lifeguard's omission as the cause of death and the sunbathers' omissions as mere circumstances. A purely factual analysis cannot explain this asymmetry. The normative selection thesis explains it effortlessly. The lifeguard is employed and trained to save swimmers; their inaction is a violation of a constitutive rule of their profession. The sunbathers have no such duty. Thus, the "cause" is identified by the breach of expectation, not by the physics of the drowning.

  The hardest test for this thesis is the third scenario: two bystanders, either of whom could have thrown a life ring, both fail to do so. Here, we have double counterfactual dependence. If A had thrown, the swimmer lives. If B had thrown, the swimmer lives. Both omissions are sufficient for the death. A standard counterfactual account struggles here, often collapsing into overdetermination where both are equally causes. But our normative intuitions might vary. If both are equally untrained bystanders, we might blame both equally. However, if one is a lifeguard and the other a bystander, the selection thesis predicts we will identify the lifeguard's omission as the primary cause, effectively "preempting" the bystander's omission in our causal story, even though both were physically sufficient.

  This shows that the "preemption" in omission cases is not about causal chains being cut off, as in positive causation, but about normative priority. If both are equally obligated, both are causes. If one is more obligated, their omission screens off the other. This confirms the thesis: the causal structure we perceive tracks the structure of our expectations. To claim omissions are causes in the same robust sense as positive events is to confuse the background conditions of the universe with the specific breaches we care about. The counterfactuals provide the canvas, but norms paint the picture. Therefore, causation by omission is not a distinct metaphysical relation found in the world, but a selective judgment imposed upon it.

  ***

  **Marking Scheme**

  | Point | Required Move (4 marks) | Typical Mistake (Note) |
  | :--- | :--- | :--- |
  | **1. The Abundance Problem** | Explicitly identifies that counterfactual dependence is satisfied by everyone (e.g., the whole city), rendering it insufficient to isolate a specific cause. | Students recite the counterfactual definition without explaining why it leads to an absurd proliferation of causes. |
  | **2. Relation vs. Selection** | Distinguishes between the metaphysical relation (counterfactual dependence) and the pragmatic act of causal selection (picking out the relevant factor). | Students treat causation as purely metaphysical and miss the prompt's core claim that selection is the key mechanism. |
  | **3. Gardener Case Application** | Explains the gardener's causal status via specific role/contractual expectation rather than unique counterfactual power. | Students argue the gardener was "closer" physically or had more power, ignoring the normative basis of the selection. |
  | **4. Lifeguard Case Application** | Uses the lifeguard scenario to demonstrate symmetrical counterfactuals but asymmetrical duties, proving norms drive the causal judgment. | Students claim the lifeguard was "more likely" to act, relying on probability rather than normative obligation. |
  | **5. Double Omission Handling** | Addresses the two-bystander case by explaining how norms determine whether both are causes or if one takes precedence (normative preemption). | Students treat this as standard overdetermination without addressing how norms might differentiate the two omitting agents. |

  **Total: 20 Marks**
