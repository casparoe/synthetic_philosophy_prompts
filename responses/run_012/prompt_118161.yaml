      *   *The "Fatal" Objection:* Tackle the Theory/Practice distinction head-on. It's not a wall; it's a categorization. The *Principle of Tolerance* bridges them. It transforms "What is true?" (metaphysical/authoritarian) into "Which language shall we use?" (pragmatic/democratic).
      *   *What Should Move You:* Focus on the *engineering* metaphor. If philosophy is engineering, it serves human ends. That's political. Focus on the *Aufbau* vs. later work shift (from constitution to tolerance).
      *   *Sympathetic Reader:* They will concede he wasn't Marx. They will dismiss the "neutral logic" critique.
      *   *Predictive Power:* This reading predicts Carnap treats political language as something to be *reconstructed*, not just analyzed. It predicts he sees metaphysics as a *hindrance* to negotiation, not just a mistake.
