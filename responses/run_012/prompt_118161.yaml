      *   **Context:** The user is in a seminar on the Vienna Circle and has made a specific claim in a paper that they now need to defend.
      *   **The Claim:** Carnap's politics and philosophy are not separate. The Principle of Tolerance is political (frameworks are chosen, not true/false). Anti-metaphysics targets reactionary politics. Interest in auxiliary languages is language engineering. Philosophy builds tools, the public chooses. Carnap is a "philosopher of planning."
      *   **The Worry:** The user suspects a fatal objection: Carnap's distinction between theoretical questions (answers/justification) and practical decisions (made, not justified). If true, philosophy can't yield political conclusions, making the thesis mere biography.
      *   **Specific Questions to Answer:**
