prompt: |-
  ok so I'm putting together a session for our eval team — we mostly do ML benchmarks but also some org-level KPIs — on Goodhart's law and specifcation gaming, and I want to hand out a decision tree instead of yet another slide of platitudes about measures becoming targets. Can you write it?

  Here's what I want it to do. Start from the symptom "we optimized a metric and the thing we actually cared about didn't improve, or got worse" and end at a named failure mechanism. Every branch node should be a question someone can answer by looking at their own case, in plain language, phrased so you can't tell from the question which mechanism it leads to. So not "is this causal Goodhart?" but something like "if we'd forcibly moved the metric by 10% without touching anything else, would the thing we care about have moved too?" — that's an example of the flavour, don't just reuse it.

  Leaves I want in there, at minimum:

  - the proxy is a noisy readout of the target, so selecting on extreme proxy values is mostly selecting for luck
  - the proxy is a downstream effect of the target, so pushing on the proxy doesn't push on the target
  - somebody has an interest in the proxy diverging from the target and is actively steering it (fraud, teaching to the test, reward hacking)
  - the proxy was only ever valid in a narrow range or near the current operating point, and we drove way outside it
  - the metric itself quietly got redefined mid-flight so the time series is a fiction — I care about this one a lot, it's the boring one everyone forgets, like when a government changes how it counts something
  - nobody ever agreed what the target was, and the proxy was doing construct-work all along
  - plus one honest "no failure here, the number went up and the world actually got better" leaf, and a "can't tell yet, the feedback loop is slower than the reporting cycle" leaf

  Then, for each leaf, one sentence on what it presupposes about whether Goodhart's law is basically a tautology (a proxy isn't the target, so optimizing it obviously optimizes something else) or a substantive empirical claim about selection pressure. Half my team is in each camp and I want the tree to expose which leaf commits you to which.

  Also tell me which combinations of answers are unoccupied and why — incoherent, just unattractive, or nobody's bothered to look — and flag any two leaves your tree can't actually seperate. I'd rather know than have you paper over it.

  Test the tree on two or three famous cases you're confident about (nail factories, cobra bounties, whatever) — flag anything you think is apocryphal rather than guessing at numbers.

  Keep it to something I can print on two sides of A4, casual tone since I'm gonna be reading this out loud. And at the end, say which branch you think is carrying most of the weight, and what kind of case would make you redraw the tree — something that lands in two leaves at once, or none.
reasoning: |-
  Here's a thinking process that leads to the suggested decision tree:

  1.  **Analyze the Request:**

      *   **Goal:** Create a decision tree for an ML eval team (benchmarks + org KPIs) to diagnose metric failures (Goodhart's Law/Specification Gaming).
      *   **Format:** Printable on two sides of A4, casual tone (for reading aloud), starts with a symptom, ends at named failure mechanisms.
      *   **Structure:**
          *   Root: "We optimized a metric, but the thing we cared about didn't improve/got worse."
          *   Nodes: Plain language questions, neutral phrasing (no giving away the answer).
          *   Leaves (Minimum 8):
              1.  Noisy proxy (selecting for luck).
              2.  Reverse causality (proxy is downstream).
              3.  Adversarial steering (fraud/gaming).
              4.  Context shift (proxy valid only in narrow range).
              5.  Metric redefinition (data fiction).
              6.  Undefined target (proxy *was* the target).
              7.  No failure (actually worked).
              8.  Too soon (feedback loop lag).
          *   **Leaf Annotation:** One sentence per leaf on whether Goodhart is a tautology or empirical claim in that context.
          *   **Analysis:** Identify unoccupied combinations, flag indistinguishable leaves.
          *   **Testing:** Apply to 2-3 famous cases (note apocryphal ones).
          *   **Conclusion:** Which branch carries the most weight? What case would break the tree?

  2.  **Drafting the Decision Tree (Iterative Process):**

      *   *Root:* "We pushed the number up, but the outcome didn't budge (or got worse)."
      *   *First Split:* Is the number *actually* higher in reality, or is it just on paper? (Distinguishes data integrity/gaming from causal issues).
          *   *Q1:* "If we audited the raw data behind the metric right now, would it match the dashboard?"
          *   *Yes:* Real change.
          *   *No:* Data integrity issue (Gaming/Redefinition).
      *   *Refining Q1:* "Did the behavior generating the data actually change, or just the way we count it?" -> Leads to "Metric Redefinition" vs "Gaming" vs "Real Change".
      *   *Let's try a causal flow.*
      *   *Step 1: Verification.* Did the metric *really* go up? (Redefinition vs. Real).
      *   *Step 2: Causality.* Did the metric cause the goal, or vice versa? (Reverse causality).
      *   *Step 3: Alignment.* Is the metric the goal, or a sign of the goal? (Construct validity).
      *   *Step 4: Stability.* Did we leave the zone where the sign holds? (Context shift/Noise).
      *   *Step 5: Agency.* Did someone hack it? (Adversarial).
      *   *Step 6: Time.* Is it too early? (Lag).
      *   *Step 7: Success.* Did the goal actually improve? (No failure).

      *   *Drafting Questions (Neutral Phrasing):*
          *   Instead of "Is it noise?", ask "If we picked a random data point from the top 10%, would it look like a fluke?"
          *   Instead of "Is it gaming?", ask "Did the people reporting the numbers benefit from them going up?"
          *   Instead of "Redefinition?", ask "Did the rulebook for calculating this number change during the period?"

      *   *Structuring for Flow:*
          1.  Check Data Integrity (Redefinition/Gaming).
          2.  Check Causal Direction (Reverse Causality).
          3.  Check Validity/Range (Noise/Context).
          4.  Check Target Definition (Construct).
          5.  Check Time (Lag/Success).

      *   *Refining the Leaves to match requirements:*
          *   Need to ensure "Noisy readout" and "Context shift" are distinct.
          *   Need to ensure "Redefinition" is distinct from "Gaming".
          *   Need the "Goodhart Tautology vs. Empirical" note for each.

  3.  **Developing the Content (Leaf Notes):**

      *   *Noise:* Tautology (Regression to the mean is math).
      *   *Reverse Causality:* Empirical (World structure).
      *   *Gaming:* Empirical (Human behavior).
      *   *Context Shift:* Empirical (Model stability).
      *   *Redefinition:* Tautology (You changed the definition, so obviously it's different).
      *   *Undefined Target:* Tautology (You optimized what you defined).
      *   *No Failure:* Empirical (The world cooperated).
      *   *Lag:* Empirical (System dynamics).

  4.  **Identifying Unoccupied/Indistinguishable Nodes:**

      *   *Indistinguishable:* "Noise" vs. "Context Shift". If you push hard enough, noise looks like a break in correlation. Hard to separate without counterfactuals.
      *   *Unoccupied:* "Gaming" + "Redefinition" usually happen together, but the tree forces a choice. Also, "Reverse Causality" + "Gaming" is rare (usually one dominates).
      *   *Hard Split:* "Undefined Target" vs. "Context Shift". If the target is vague, how do you know you left the valid range?

  5.  **Testing Cases:**

      *   *Cobra Effect:* Classic gaming. (Did people breed cobras? Yes -> Gaming).
      *   *Nail Factory (Soviet):* Quantity vs. Weight. (Context Shift/Proxy Divergence).
      *   *School Testing (No Child Left Behind):* Teaching to the test. (Gaming vs. Construct Validity).
      *   *Apocryphal Note:* Cobra effect is likely exaggerated/myth. Nail factory is well-documented.

  6.  **Formatting and Tone:**

      *   Keep it conversational ("Here's the tree," "Read this out loud").
      *   Fit for A4 (concise text).
      *   Visual description (since I can't draw, I'll use text-based tree structure).

  7.  **Final Review against Constraints:**

      *   *Plain language questions?* Yes.
      *   *Neutral phrasing?* Yes.
      *   *All 8 leaves?* Yes.
      *   *Tautology/Empirical note?* Yes.
      *   *Unoccupied/Indistinguishable analysis?* Yes.
      *   *Case tests?* Yes.
      *   *Weight/Breaking point?* Yes.

  8.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Redefinition" leaf is prominent since the user cares about it.
      *   *Correction:* Ensure the "Tautology vs. Empirical" distinction is sharp. Goodhart as a tautology means "Metric != Target by definition." Goodhart as empirical means "Metric correlated with Target until pressure applied."
      *   *Refinement:* The "Noise" leaf is essentially Regression to the Mean. The note should reflect that.
      *   *Refinement:* The "Undefined Target" leaf is essentially "The map became the territory."

      *(Self-Correction on Tree Logic)*: I need to make sure the path to "Redefinition" is clear. It should be early. If the math changed, nothing else matters.
      Path:
      1. Did the calculation rule change? (Redefinition)
      2. Did humans manipulate the input? (Gaming)
      3. Did the target actually improve? (No Failure)
      4. Is it too early? (Lag)
      5. Was the target clearly defined *before* the metric? (Undefined Target)
      6. If we forced the metric up exogenously, would target move? (Causality/Reverse)
      7. Did we move far from where we started? (Context Shift)
      8. Is the correlation just weak? (Noise)

      *Wait, I need to make sure the questions don't give away the answer.*
      "Did the calculation rule change?" is pretty obvious. Let's soften: "If you asked a new analyst to calculate this month's number using last month's rulebook, would they get the same result?"
      "Did humans manipulate?" -> "Did the people providing the data gain something personal when the number went up?"

      *Let's assemble the text.*

      *(Final Polish)*: Check the "Tautology vs Empirical" sentences.
      *   Redefinition: Tautology (A != B if you change A).
      *   Gaming: Empirical (Agents respond to incentives).
      *   Noise: Tautology (Selection bias is math).
      *   Reverse Causality: Empirical (Causal structure of world).
      *   Context Shift: Empirical (Stability of relationships).
      *   Undefined Target: Tautology (Optimization succeeded on the only defined object).
      *   No Failure: Empirical (Correlation held).
      *   Lag: Empirical (Temporal dynamics).

      *Indistinguishable:* Noise vs Context Shift is the big one. Both look like "correlation broke."
      *Unoccupied:* "Reverse Causality" + "Gaming". Usually if you game it, you aren't relying on reverse causality.

      *Cases:*
      1.  Soviet Nails (Quantity vs Weight). -> Context Shift / Proxy Divergence.
      2.  Cobra Bounty. -> Gaming (though apocryphal).
      3.  School Test Scores. -> Undefined Target / Gaming mix.

      *Weight:* Context Shift/Proxy Divergence is the heavy one for ML.
      *Breaking Case:* Multi-objective optimization where one metric goes up, target goes up, but another hidden metric crashes (Goodhart on a hidden variable).

      *Okay, ready to write.*
answer: |-
  Here is the decision tree, drafted for print (approx. 2 pages A4 at 11pt), followed by the analysis you asked for.

  ***

  # The "Why Did The Metric Lie?" Diagnostic Tree

  **Start Here:** We pushed a metric up, but the outcome we actually care about didn't improve (or got worse).

  **1. The Calculation Check**
  *If you handed a new analyst last month's rulebook and this month's raw data, would they calculate the same number we reported?*
  *   **NO** → Go to **Leaf A (The Fiction)**
  *   **YES** → Go to Question 2

  **2. The Incentive Check**
  *Did the people or systems providing the data gain something specific (bonus, status, compute budget) when this number went up?*
  *   **YES** → Go to **Leaf B (The Hack)**
  *   **NO** → Go to Question 3

  **3. The Reality Check**
  *Ignoring the metric for a moment, did the actual thing we care about get better, stay same, or get worse?*
  *   **Better** → Go to **Leaf C (False Alarm)**
  *   **Same/Worse** → Go to Question 4

  **4. The Time Check**
  *Is the gap between "action taken" and "outcome visible" longer than the time since we started optimizing?*
  *   **YES** → Go to **Leaf D (The Lag)**
  *   **NO** → Go to Question 5

  **5. The Definition Check**
  *Before we picked this metric, did we write down a definition of the "actual thing we care about" that didn't mention this metric?*
  *   **NO** → Go to **Leaf E (The Map)**
  *   **YES** → Go to Question 6

  **6. The Intervention Check**
  *If we could magically force the metric up by 10% without changing any behaviors or inputs, would the outcome improve?*
  *   **NO** → Go to **Leaf F (The Tail)**
  *   **YES** → Go to Question 7

  **7. The Range Check**
  *Are we operating at levels of the metric significantly higher than anywhere in the historical data used to validate it?*
  *   **YES** → Go to **Leaf G (The Edge)**
  *   **NO** → Go to **Leaf H (The Noise)**

  ---

  ### The Leaves (Failure Mechanisms)

  **Leaf A: The Fiction (Metric Redefinition)**
  *The rulebook changed mid-game (e.g., changing unemployment definitions).*
  *   **Goodhart Status:** **Tautology.** You changed the definition of A, so obviously A is no longer measuring the old B.

  **Leaf B: The Hack (Adversarial Steering)**
  *Agents actively distorted the data to capture the reward (e.g., cobra bounties, reward hacking).*
  *   **Goodhart Status:** **Empirical.** This relies on the claim that agents *will* find loopholes under pressure, not that they *must*.

  **Leaf C: False Alarm (No Failure)**
  *The metric went up, the world got better, you're just looking at the wrong lagging indicator.*
  *   **Goodhart Status:** **Empirical.** The correlation held under pressure; Goodhart's Law did not trigger.

  **Leaf D: The Lag (Feedback Delay)**
  *The system hasn't had time to respond yet; the time series is out of sync.*
  *   **Goodhart Status:** **Empirical.** Assumes causal dynamics exist but operate on a slower clock than the reporting cycle.

  **Leaf E: The Map (Undefined Target)**
  *The "target" was vague; the metric became the target by default (construct validity failure).*
  *   **Goodhart Status:** **Tautology.** You optimized the only well-defined object in the room; there was no "true target" to diverge from.

  **Leaf F: The Tail (Reverse Causality)**
  *The metric is a symptom, not a cause (e.g., measuring "hours in office" to drive "productivity").*
  *   **Goodhart Status:** **Empirical.** Claims the causal arrow points Target → Metric, not Metric → Target.

  **Leaf G: The Edge (Context Shift)**
  *The correlation was real but local; we drove the system into a regime where the physics changed.*
  *   **Goodhart Status:** **Empirical.** Assumes relationships are stable only within a specific basin of attraction.

  **Leaf H: The Noise (Regression to Mean)**
  *The proxy is weak; selecting for extreme values mostly selected for random variance.*
  *   **Goodhart Status:** **Tautology.** Selecting for maximum $X + \epsilon$ inevitably selects for high $\epsilon$ when signal is weak.

  ***

  # Analyst Notes & Tree Stress-Test

  ### 1. Unoccupied Combinations
  *   **The Hack + The Tail:** It is logically possible to game a metric that is also a downstream effect, but it's rare. If I know the metric is just a symptom (The Tail), I usually wouldn't bother gaming it because I know it won't get me the bonus. If I *am* gaming it (The Hack), I usually treat it as the target regardless of causality. This branch is unoccupied because **incentives usually override causal understanding.**
  *   **The Fiction + The Edge:** If you change the definition (The Fiction), you effectively reset the range. It's hard to claim you've gone "out of range" on a metric that you just redefined to make the numbers look better. This combination is **incoherent**; redefinition swallows context shifts.

  ### 2. Indistinguishable Leaves
  *   **The Edge (G) vs. The Noise (H):** This is the tree's weakest split. Both look like "correlation broke at high values." Distinguishing them requires knowing if the underlying mechanism *changed* (Edge) or if the signal-to-noise ratio was just *always low* (Noise). In practice, **you cannot separate these without a counterfactual or a mechanistic model.** If you don't know the physics of the system, these two leaves are functionally identical.

  ### 3. Case Studies
  *   **Soviet Nail Factory (Quantity vs. Weight):**
      *   *Path:* Q1 (Yes) → Q2 (Yes/No) → Q5 (Yes) → Q6 (No) → Q7 (Yes).
      *   *Result:* **The Edge (G)** or **The Map (E)**. When told to maximize count, they made tiny useless nails. When told to maximize weight, they made one giant nail.
      *   *Verdict:* This is a **Context Shift**. The proxy (count/weight) was valid for "useful nails" only within a narrow distribution of sizes. They drove outside that distribution.
  *   **The Cobra Effect (Bounty on Dead Cobras):**
      *   *Path:* Q1 (Yes) → Q2 (Yes).
      *   *Result:* **The Hack (B)**.
      *   *Verdict:* **Apocryphal Warning.** Historians doubt this actually happened in Delhi/Hanoi. It's a parable, not a dataset. If you use it in the session, flag it as folklore. It fits the tree perfectly, which is suspicious.
  *   **US School Testing (No Child Left Behind):**
      *   *Path:* Q1 (Yes) → Q2 (Yes) → Q5 (No/Yes).
      *   *Result:* **The Map (E)** mixed with **The Hack (B)**.
      *   *Verdict:* Did "education" improve? Debatable. Did test scores improve? Yes. Because "education" was never defined outside of the test, the test *became* the target. This is a **Construct Validity** failure.

  ### 4. Weight & Breaking Points
  *   **Heaviest Branch:** **Question 7 (The Range Check / The Edge).** In ML especially, this is where 80% of our pain lives. We train on a distribution, then deploy on a tail, or we optimize a loss function until the model finds a shortcut that works for the loss but not the data manifold. This is "Goodhart" in its most substantive, empirical form.
  *   **The Case That Breaks The Tree:** A **Multi-Objective Collapse**.
      *   *Scenario:* You optimize Metric A. Metric A goes up. Target B goes up. But hidden Target C crashes catastrophically.
      *   *Problem:* The tree asks "Did the outcome we care about get better?" If you care about B, the tree says **Leaf C (False Alarm)**. If you care about B+C, it says **The Edge**.
      *   *Redraw Condition:* If a case lands in **Leaf C** but the room feels uneasy because *something else* broke, the tree is too single-variable. I would need to add a branch for "Did we check *other* metrics for collateral damage?" before the Reality Check.

  ### 5. Tone Check for the Session
  *   Read the questions slowly.
  *   Emphasize that **Leaf A (The Fiction)** is the boring one everyone ignores. Spend time there.
  *   When discussing **Tautology vs. Empirical**, ask the room: "Is this failure because math says so, or because the world is messy?" That's the real split.
