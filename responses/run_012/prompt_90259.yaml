answer: |-
  # The Embedding Profile Taxonomy: A Decision Tree for the Frege-Geach Problem

  **Instructions:** Start at **Node 1**. Answer the diagnostic question based on your theoretical commitments regarding the *embedding profile* of moral predicates (how they function in conditionals, negations, belief reports, etc.). Follow the branch to the next node or a theoretical leaf.

  ---

  ### **Node 1: The Atomic Commitment**
  Consider a sincere, flat-out utterance of "Lying is wrong." Is the semantic content of this sentence primarily defined by its capacity to **represent a state of affairs** (cognitive), its capacity to **express a practical attitude** (non-cognitive), its role in **inference rules** (inferential), or is the distinction itself a **linguistic confusion**?

  *   **Represent a state of affairs:** Go to **Node 2**.
  *   **Express a practical attitude:** Go to **Node 3**.
  *   **Role in inference rules:** → **Leaf: Inferentialism**
  *   **Linguistic confusion:** → **Leaf: The Pseudo-Problem View**

  ---

  ### **Node 2: The Cognitivist Branch (Representation)**
  You hold that moral sentences represent reality. **Do any moral sentences actually correspond to moral facts/properties in the world?**

  *   **Yes:** → **Leaf: Plain Cognitivism**
  *   **No:** Go to **Node 2b**.

  ### **Node 2b: The Pretense Check (Test Case iii)**
  Since there are no moral facts, consider a **machine that prints "murder is wrong" but forms no attitude**. Do human speakers, when uttering moral sentences, engage in a systematic **pretense** that they are describing facts (similar to the machine's output being treated as part of a game), or do they sincerely assert falsehoods?

  *   **Sincerely assert falsehoods:** → **Leaf: Error Theory**
  *   **Engage in systematic pretense:** → **Leaf: Fictionalism**

  ---

  ### **Node 3: The Expressivist Branch (Attitude)**
  You hold that "Lying is wrong" expresses an attitude. Consider **Test Case (i): "If lying is wrong, then getting your sister to lie is wrong," uttered by someone who doesn't actually care about lying.** Does the embedded antecedent ("if lying is wrong") express the speaker's *current* attitude toward lying?

  *   **Yes (Attitude is present even in embedding):** Go to **Node 3b**.
  *   **No (Attitude is suspended in embedding):** Go to **Node 4**.

  ### **Node 3b: The Logic of Attitudes**
  If attitudes are expressed in embeddings, how is logical validity (e.g., Modus Ponens) preserved, given that attitudes are not true or false?

  *   **Validity is not truth-preservation but consistency of attitudes:** → **Leaf: Expressivist Accounts of Logic**
  *   **Validity must be truth-preservation:** → **[UNOCCUPIED BRANCH]** *(Diagnosis: Incoherent. You cannot have truth-preservation without truth-apt content, but you denied the content was anything other than attitude.)*

  ---

  ### **Node 4: The Hybrid Check (Test Case iv)**
  If the embedded clause does not express an attitude, does it contribute a distinct **belief content** (a cognitive proposition) that can be reported? Consider **Test Case (iv): "Sally believes that lying is wrong" where Sally is a committed liar.** Is there a cognitive belief state to report here, separate from her conative stance?

  *   **Yes (Moral sentences express both Attitude + Belief):** → **Leaf: Hybrid Expressivism**
  *   **No (Pure Expressivism; no separate belief content):** Go to **Node 5**.

  ---

  ### **Node 5: The Moralish Test (Test Case ii)**
  Consider the **"Moralish" community**, whose speakers only ever use their moral term inside conditionals and negations, never in flat assertions. Can a sentence be **truth-apt** (capable of being true/false) in this language even if it is never used to assert a fact flat-out?

  *   **No (Assertion is primary for truth-aptitude):** → **[UNOCCUPIED BRANCH]** *(Diagnosis: Unattractive. This renders the Moralish language logically inert and fails to solve the embedding problem for standard languages.)*
  *   **Yes (Syntax alone permits truth-aptitude):** Go to **Node 6**.

  ---

  ### **Node 6: The Nature of Truth**
  You are a pure expressivist who grants truth-aptitude to solve logic. Is the predicate "true" applied to moral sentences a **robust property** (which you must "earn" via projectivism) or a **logical device** (deflationary/disquotational)?

  *   **Robust Property (We earn the right to talk of moral facts):** → **Leaf: Quasi-Realism**
  *   **Logical Device (Truth is lightweight; no facts needed):** → **Leaf: Minimalism**

  ---

  ### **Theoretical Leaves: Commitments & Costs**

  1.  **Plain Cognitivism:** Moral properties exist, but they are metaphysically queer and causally inert.
  2.  **Error Theory:** All positive moral sentences are systematically false; moral thought is a global error.
  3.  **Fictionalism:** Moral discourse is useful, but speakers are essentially engaged in a collective pretense.
  4.  **Inferentialism:** Moral meaning is exhausted by inference rules, leaving the worldly anchor of morality unexplained.
  5.  **The Pseudo-Problem View:** The Frege-Geach problem arises from a mistaken picture of language; there is no problem to solve.
  6.  **Expressivist Accounts of Logic:** Logic is not about truth-preservation but about the consistency of non-cognitive commitments.
  7.  **Hybrid Expressivism:** Moral sentences have two distinct semantic contents (belief and attitude), complicating compositionality.
  8.  **Quasi-Realism:** We speak of moral facts and truths, but only as projections of our own attitudes.
  9.  **Minimalism:** Moral sentences are "true," but the property of truth is too thin to ground any substantive realism.

  ---

  ### **Taxonomy Diagnostics**

  **Indistinguishable Leaves:**
  *   **Quasi-Realism vs. Minimalism:** The tree separates these at Node 6, but in practice, these positions often converge. Quasi-realists often use minimalist truth to "earn" facts, making the distinction between "earning robust truth" and "accepting lightweight truth" merely rhetorical.

  **Unoccupied Branches:**
  1.  **Node 3b (Attitude in Embedding) + Truth-Preservation:** *Diagnosis: Incoherent.* If embedded clauses express attitudes, they lack truth values. If they lack truth values, logic cannot be truth-preserving.
  2.  **Node 5 (No Truth-Aptitude without Assertion):** *Diagnosis: Unattractive/Unexplored.* This view (sometimes called "Strict Assertion Expressivism") cannot account for the validity of arguments involving moral premises that the speaker does not endorse, effectively conceding the Frege-Geach problem.
  3.  **Node 2b (Pretense + Facts Exist):** *Diagnosis: Incoherent.* If moral facts exist (Node 2), there is no need to pretend they do (Node 2b). Fictionalism requires the error theorist's ontology.

  **Test Case Mapping:**
  *   **(i) Indifferent Conditional:** Resolved at **Node 3**. Distinguishes views that require attitude presence in embedding from those that do not.
  *   **(ii) Moralish Community:** Resolved at **Node 5**. Tests whether truth-aptitude requires assertoric force.
  *   **(iii) Machine Printer:** Resolved at **Node 2b**. Distinguishes Error Theory (sincere error) from Fictionalism (insincere pretense).
  *   **(iv) Sally's Belief:** Resolved at **Node 4**. Distinguishes Hybrid views (belief content exists) from Pure Expressivism (no belief content).
