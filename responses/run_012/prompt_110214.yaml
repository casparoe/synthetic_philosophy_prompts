  My friend Dana and I spent about four hours last night arguing over a bet and got absolutely no where, so I'm outsourcing this one. Dana is deep into what she calls "geometric rationality" — she's always going on about how expected value is a sucker's metric and the only thing that matters is your long-run growth rate, the time-average of your bankroll rather than the average across a bunch of parallel you's. She's not timid, either; she'll happily eat variance when she thinks the growth is there. But she has a very sharp nose for bets that look great on average and quietly bleed you out.

  Some calls of hers I remember:

  - Someone offered her a bet she could replay as many times as she liked, but each round her whole bankroll came back either 1.5x or 0.6x, fifty-fifty. Expected value per round is clearly positive, about +5%. She wouldn't touch it — said if you play it a hundred times you're basically broke.

  - Meanwhile she'll play an even-money coin flip all night when she thinks the coin is 60/40 her way, putting down a real chunk each round, though never anything close to her whole stack.

  - She pays for insurance against anything that could zero her out, even when the premium makes the expected value negative. No amount of edge, she says, justifies a live chance of going to zero.

  - And she's not just a coward: offered a guaranteed $50 or a 60% shot at $100, she takes the gamble every time.

  Here's the one we fought about. I got offered a bet that's genuinely one-shot — no repeats, no sizing it down, take it or leave it. I'd have to put up half my savings, all or nothing. There's a coin that comes up my way 60% of the time; if it does, I win what I staked, so I walk away with one and a half times my savings. If it doesn't, I lose the half I put up and I'm left with half. It happens exactly once.

  I think I should take it: positive expected value, no real chance of ruin, and I keep half if I lose. She thinks I'm an idiot, but she wouldn't tell me which way she'd actually go, which is whats driving me up the wall.

  So what's Dana going to do with this bet? I don't just want a yes or no. I want the actual rule she seems to be running, plus any other rule that fits every call above just as well and would give the opposite answer on this bet, and which one you'd actually bet on. And if you had to cook up one more bet to tell those rules apart, what would it look like?

  Also, be straight with me about where you're least confident. What would change your mind about which rule she's really running, or where is your read most likely to be off?
