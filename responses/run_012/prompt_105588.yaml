answer: |-
  ### The Session Plan: "The Residue of Competence"

  **The Carrying Case: The Sourdough "Windowpane" Test**
  Do not use the bicycle. Do not use the neurological patient. Use **the tactile calibration of kneading sourdough to the "windowpane" stage.**

  **Why this case beats your instincts:**
  1.  **Vs. The Bicycle:** Riding a bike is binary (you fall or you ride) and quickly becomes automated muscle memory. Dough is *analog* and *variable*. Every batch reacts differently to humidity and flour age. It requires active, online calibration, not just the replay of a stored motor program. This prevents the STEM contingent from dismissing "knowing how" as merely "compiled code."
  2.  **Vs. The Neuro Patient:** Pathological cases (like apraxia) allow the audience to silo the problem as "broken hardware." The dough case is about *normal* human variance. It forces them to admit that even in a healthy system, the map (recipe) is not the territory (dough).
  3.  **For the Rationalist Lens:** It operationalizes "tacit knowledge" as **high-bandwidth feedback loops that cannot be losslessly compressed into low-bandwidth language.** This frames the distinction in information-theoretic terms they respect, rather than mystical "qualia" terms they distrust.

  ---

  ### The Dependency Structure (The Forced Order)

  You cannot rearrange these steps. If you swap 2 and 3, the distinction collapses into "explicit vs. implicit data." If you move 5 earlier, the AI discussion becomes a distraction rather than a stress test.

  **1. Operationalize "Knowledge" (5 mins)**
  *   **The Move:** Before defining *types* of knowledge, define *knowledge itself* functionally. Ask the room: "In this room, we treat beliefs as expectations that pay rent. What rent does 'knowledge' pay?"
  *   **The Dependency:** You must establish that knowledge is a **predictive/control capacity** before you can distinguish *how* that capacity is accessed. If you don't do this, the humanities folks will drift into phenomenology ("what it feels like") and the STEM folks will drift into data structures ("where it is stored").
  *   **The Constraint:** Explicitly ban "Justified True Belief." It is a trap for this topic.

  **2. Deploy the Carrying Case (10 mins)**
  *   **The Move:** Describe the "Windowpane Test." You stretch the dough; if it forms a thin, translucent membrane without tearing, the gluten is developed.
  *   **The Dependency:** You need a shared concrete instance before you can abstract. But crucially, you must describe it *without* giving the recipe yet. Focus on the *failure mode*: tearing too soon vs. over-kneading.
  *   **The Constraint:** Do not mention "muscle memory" yet. That is a theory, not a datum.

  **3. The Failure of Codification (15 mins)**
  *   **The Move:** Attempt to write the "Knowing That" manual for the test. List the variables: hydration %, time, temperature, resistance. Then ask: "If I give this text to a novice, do they pass the test?" (No). "If I give it to an LLM, does it pass?" (No).
  *   **The Dependency:** This *must* follow the Case. You must demonstrate the **compression loss** between the tactile reality and the propositional description.
  *   **Why the Order is Forced:** If you define "Knowing That" as "propositions" *before* showing the case, the STEM audience will argue, "The propositions just aren't detailed enough." By showing the failure *first*, you force them to admit the missing information isn't just *more* text; it's a different *modality* of information.
  *   **Head Off Here:** The "Hidden Variables" Objection. A STEM participant will say, "It's just that we haven't measured the gluten elasticity yet. It's all physics."
      *   *The Counter:* "Even if we measure it, the *correction* happens faster than the conscious processing of the measurement. The 'knowledge' is in the loop, not the lookup."

  **4. Isolate the Distinction (10 mins)**
  *   **The Move:** Now label the buckets.
      *   **Knowing That:** The recipe, the chemistry, the ability to critique a failed loaf post-mortem.
      *   **Knowing How:** The online calibration, the ability to salvage a sticky batch in real-time.
  *   **The Dependency:** You can only define these *after* proving the Failure of Codification. Otherwise, "Knowing How" looks like "Knowing That which is currently unspoken." You need the gap to be visible before you name the sides.
  *   **Head Off Here:** The "Dualism" Objection. A humanities participant might suggest this implies a non-physical mind.
      *   *The Counter:* "This isn't mind vs. body. It's bandwidth. One is lossy compression (language), one is high-fidelity control (sensorimotor)."

  **5. The AI/LLM Stress Test (15 mins)**
  *   **The Move:** Introduce the unsettled endpoint. "Consider a system that can recite the manual perfectly, diagnose your description of a failed loaf, but has no hands. Does it Know How?"
  *   **The Dependency:** This relies entirely on Step 3 (Failure of Codification). If they believe the manual *could* capture the skill, the AI *does* know how. You need them committed to the idea that the manual is insufficient before you ask if the AI is limited by the manual.
  *   **The Twist:** Conversely, "Consider a robot arm that kneads perfectly but cannot explain why it adjusted pressure. Does it Know That?"
  *   **Head Off Here:** The "Stochastic Parrot" Dismissal. They will want to say "LLMs are just predicting tokens."
      *   *The Counter:* "Ignore the architecture. Look at the functional profile. If the output is indistinguishable from a master baker's advice, does the internal state matter for the definition of knowledge?"

  **6. The Closing Question (5 mins)**
  *   **The Move:** Do not ask for a definition. Ask for a **bet**.
  *   **The Question:** "If you had to upload your mind to a server to survive, but you could only keep one: the library of every baking recipe ever written (Knowing That) OR the calibrated neural weights that allow your hands to knead perfectly (Knowing How)—but you would lose the ability to explain *how* you do it—which package contains *you*?"
  *   **Why this works:** It forces them to treat the distinction as a **live problem of identity and agency**, not a taxonomy exercise. If they hesitate, the distinction has landed.

  ---

  ### Misconceptions to Head Off (and When)

  1.  **The "Implementation Detail" Error (STEM Bias)**
      *   *What they'll say:* "Knowing How is just Knowing That stored in the cerebellum instead of the cortex. It's the same data, different hardware."
      *   *Where to head it off:* **Step 3 (Failure of Codification).**
      *   *How:* Insist that if it were the same data, it should be recoverable into language without loss. The fact that it *cannot* be losslessly translated suggests it is not just "stored" differently, but *structured* differently (e.g., analog control vs. digital lookup).

  2.  **The "Mysterious Qualia" Error (Humanities Bias)**
      *   *What they'll say:* "Knowing How is about the *experience* of the dough, the subjective feel."
      *   *Where to head it off:* **Step 1 (Operationalize).**
      *   *How:* Keep the definition functional. "Knowing How" is the ability to *correct* the dough, not the *feeling* of the dough. If you feel it but can't fix it, you don't Know How.

  3.  **The "Latency" Error (Computational Bias)**
      *   *What they'll say:* "It's just that speaking is slower than moving. If the LLM had faster I/O, it would know how."
      *   *Where to head it off:* **Step 5 (AI Stress Test).**
      *   *How:* Point out that the LLM can simulate the *timing* perfectly in text ("wait 3 seconds"), but cannot *inhabit* the timing. The distinction is about **coupling to the environment**, not speed.

  ---

  ### Explicit Omissions (Announce These)

  To keep the session from drifting into standard philosophy seminar mode, explicitly announce at the start that you are **bracketing** the following:

  1.  **The History of the Debate:** "We are not discussing Gilbert Ryle, Intellectualism, or Stanley & Williamson. We are treating this as an engineering problem, not a history of ideas problem."
  2.  **Gettier Cases:** "We are assuming the knowledge is true and justified. We are asking about the *format* of the knowledge, not its truth conditions."
  3.  **Phenomenology/Qualia:** "We are not asking what it *feels like* to knead. We are asking what the system *does* with the information."

  ### Why This Plan Works for This Room

  This group respects **information theory** and **functionalism**. By framing "Knowing How" as **high-bandwidth, low-latency control information that resists lossy compression (language)**, you speak their language. By ending on the AI question, you tie it to their existing anxieties about alignment and agency. The order is forced because you must prove the *existence of the gap* (Step 3) before you can argue about *what fills the gap* (Step 5). If you skip the proof of the gap, the STEM contingent will close it with "more data," and the session will fail.
