  3.  **Drafting - Content & Tone Check:**
      *   *Tone:* Dry, passive voice, nominalizations. "It is noted," "The assessment indicates."
      *   *Logic:* Ensure the slide happens slowly. Start with "we should respect old things." Move to "we don't know why this is here." Move to "therefore we must keep it." Move to "even if it blocks things." Move to "we cannot build new ones."
