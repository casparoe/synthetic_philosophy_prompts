  4.  **Refining the Logic (The "Slide"):**
      *   *Step 1:* Old things have value. (Standard heritage)
      *   *Step 2:* We don't know why this specific thing exists. (Standard gap)
      *   *Step 3:* Therefore, we assume there was a good reason. (Chesterton's Fence)
      *   *Step 4:* Therefore, we cannot remove it until we know the reason. (Burkean prescriptivism)
      *   *Step 5:* Since we cannot know the reason (records lost), we cannot remove it. (Bureaucratic deadlock)
      *   *Step 6:* New things lack this presumption. (One-way ratchet)

  5.  **Drafting the Dissent:**
