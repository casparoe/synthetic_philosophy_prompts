  **LOCAL AUTHORITY PLANNING DEPARTMENT**
  **HERITAGE IMPACT ASSESSMENT (HIA-44B)**
  **REF: HIA/2023/0892 | SECTOR 4 VERNACULAR BOUNDARY**

  **1.0 POLICY PREAMBLE**
  In accordance with National Planning Policy Framework Section 16, and local Guidance Note 7.4, this assessment proceeds from the presumption that long-standing arrangements possess a presumptive value proportional to their duration. It is recognised that a community's inherited furniture carries something like title by prescription; that wisdom may be lodged in an institution precisely because its origins have been allowed to go dim. Where the function of a physical asset is no longer immediately apparent, the burden of proof rests upon the proposing agent to demonstrate why the arrangement should cease, rather than upon the authority to demonstrate why it should remain. Epistemic humility regarding the intentions of predecessors is a material consideration.

  **2.0 ASSET DESCRIPTION**
  **Feature:** Dry-stone boundary wall with intermittent wooden gating.
  **Location:** Junction of Old Mill Lane and Unnamed Track.
  **Date of Construction:** Approx. 1840–1890 (Estimated).
  **Current Condition:** Stable.
  **Proposed Action:** Removal to facilitate vehicular access and housing development.

  **3.0 HISTORICAL RATIONALE**
  **3.1 Recorded Purpose:** [ ] Agricultural Containment [ ] Rights of Way Management [ ] Other
  **3.2 If Known, Please Specify:** _________________________________________________
  **3.3 Assessment of Knowledge Gap:** No surviving records indicate the specific necessity for the wall's placement at this junction. Local oral history is inconclusive.
  **3.4 Inference Protocol:** In the absence of a recorded purpose, officers must assume a purpose existed. The absence of evidence is not evidence of absence. Consequently, the unknown rationale is treated as a *High Value* constraint. To remove the asset is to risk undoing a solution to a problem we can no longer see.

  **4.0 SCORING MATRIX**
  | Criteria | Score (1-5) | Weighting | Total |
  | :--- | :---: | :---: | :---: |
  | **Age** | 5 | x 1.5 | 7.5 |
  | **Continuity** | 5 | x 1.5 | 7.5 |
  | **Explained Function** | 1 | x 2.0 | 2.0 |
  | **Unexplained Function** | 5 | x 2.0 | 10.0 |
  | **Total Risk of Removal** | | | **27.0** |

  *Note: Under Guidance 7.4, a low score in 'Explained Function' automatically triggers a high score in 'Unexplained Function.' The inability to articulate a reason for the asset's existence is scored as an argument for retention.*

  **5.0 CONSULTEES**
  **5.1 Local History Society:** Advised that removal would erase a datum point for future historical inquiry.
  **5.2 Proposing Agent:** Unable to provide historical counter-evidence.
  **5.3 Current Residents:** No objection recorded, though familiarity noted.

  **6.0 EQUALITY AND ACCESS**
  **6.1 Impact on Mobility:** Retention maintains a barrier to wide-load vehicular access and restricts step-free entry to the rear plot.
  **6.2 Mitigation:** Access concerns are weighed against the intangible benefit of continuity. While the wall restricts current access, it preserves the spatial logic of the previous century. To prioritise current access requirements over inherited structure would be to privilege the present moment over intergenerational equity. No mechanism exists within this assessment framework to score the benefits of a *new* access route, as new arrangements carry no presumption of wisdom.

  **7.0 OFFICER RECOMMENDATION**
  **7.1** Given the high risk score associated with the unknown rationale, and the inability of the proposing agent to reconstruct the original necessity, the committee cannot be satisfied that removal is safe.
  **7.2** Competence in this matter is defined by the recognition of limits. Until the proposing agent can demonstrate agreement with the committee's understanding of the risk, permission is withheld.
  **7.3** **Decision:** Application Refused. Asset to be retained in situ.

  **Signed:** *J. H. Miller, Senior Planning Officer*
  **Date:** *14 October 2023*

  ***

  **APPENDIX C: MINUTE OF DISSENT**
  **Submitted by:** *Cllr. A. Vance*
  **Text:** "I merely note for the file that if the wall was originally erected to bar a right of way that was subsequently legalised, this process protects the bar rather than the right. I do not propose we vote differently, only that we might acknowledge the possibility that the ancestors were sometimes wrong. Filed."
