      *   **Audience:** Grad students (some know Burke/Chesterton, some don't).

  2.  **Drafting - Section by Section:**

      *   **Header:** Needs to look official. Council name, Document Type, Reference Number.
      *   **Preamble:** The "sober paragraph." Needs to sound like policy guidance. Use phrases like "presumptive value," "accumulated practice," "epistemic humility."
      *   **Asset Description:** What are we assessing? A "boundary feature." Let's make it vague. "Sector 4 Vernacular Boundary."
      *   **Historical Rationale:** The key field. "If Known." If "Unknown," what happens? The form needs to dictate that "Unknown" triggers protection.
      *   **Scoring Matrix:** This is where the logic twists. Criteria like "Age," "Continuity," "Explanation." If Explanation is "None recorded," score should be high (protect).
      *   **Consultees:** Who was asked? "Local History Society," "Current Residents," "Proposing Agent."
      *   **Equality & Access:** Standard bureaucratic box-ticking. How does keeping the fence affect access? It restricts it. But the form should frame this as "preserving character" outweighing "access."
