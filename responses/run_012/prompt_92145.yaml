      *   **Constraints:**
          *   Runnable by someone with one stats course + spreadsheet, in an afternoon.
          *   No essays on ontology.
          *   Must incorporate three specific distinctions: (1) APC (Age-Period-Cohort) identification problem (you can't estimate all three), (2) Cohort heterogeneity (samples aren't the whole generation), (3) Performativity (labels make things real).
          *   Data available: Repeated cross-sections since 2019 + few panel waves (not a 50-year time series).
          *   Output format: Ordered steps, sufficient answers, stop points ("No"), hand-off points ("Human Decision").
          *   Confidence levels: Explicit about uncertainty/error bars in the procedure itself.
          *   Least sure step: Identify one step and what would change the mind about it.
          *   Application: Run the procedure on four specific cases (a, b, c, d) with verdicts, permitted deck sentences, and specific advice for case (d).

  2.  **Deconstruct the Core Problem (APC Identification):**

      *   Age = Current Age.
      *   Period = Time of Survey.
      *   Cohort = Birth Year (Period - Age).
      *   *Constraint:* Cohort = Period - Age. Perfect collinearity. You cannot statistically separate all three without strong external assumptions.
      *   *Implication for the Procedure:* Since we only have data since 2019 (5 years), we cannot observe a cohort aging significantly (e.g., Gen Z in 2019 vs. Gen Z in 2040). We *can* observe if a cohort behaves differently than older cohorts *at the same time point* (cross-sectional), but we can't prove it's not an age effect without longitudinal logic or controlling for confounders.
      *   *Strategy:* The procedure must force the analyst to rule out "Age" (lifecycle) and "Composition" (income/housing) before labeling "Cohort." It must also force humility about the "Period" effect (did something happen in 2024 that changed everyone?).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Stability over Time (Period vs. Cohort).* If the gap changes wildly year-to-year, it's likely a period effect or noise, not a deep generational imprint.
