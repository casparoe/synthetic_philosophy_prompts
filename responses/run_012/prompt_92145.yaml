      *   **User:** Research lead for a mid-sized consumer insights team (8 analysts, limited formal training in demography/causal inference).
      *   **Problem:** Embarrassing errors regarding "generational findings" (confusing age, period, and cohort effects; composition artifacts; self-fulfilling prophecies).
