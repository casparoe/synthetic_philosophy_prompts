      *   *(c) Sustainability (Income/Homeowner):*
          *   Step 2 (Composition): Fail. Gap disappears when controlling for income/housing.
          *   Verdict: No.
      *   *(d) Pet Finding (Gen Z wants X):*
          *   Need to be harsh. Likely fails Step 2 or 3.
          *   Verdict: Unsupported.
          *   Remediation: What data is needed? (Longitudinal or better controls).

  6.  **Refining the Procedure for Constraints:**

      *   *Confidence:* I need to rate the procedure's reliability. It's a heuristic, not a causal model.
      *   *Least Sure Step:* Step 3 (Distinguishing Age from Cohort without long time series) is the weakest link. It relies on researcher intuition.
      *   *Performativity:* Add a step about labeling.

  7.  **Finalizing the Procedure Structure:**

      *   **Input:** Crosstab of Item by Age Group across Waves.
