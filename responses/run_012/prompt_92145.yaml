      *Revised Step 3:* Since we can't mathematically separate Age/Cohort with 5 years of data, we must use *substantive* reasoning. The procedure needs a "Human Hand-off" here. The data can't solve this; the researcher must justify why it's not just "being young."

  5.  **Drafting the Case Studies:**

      *   *(a) Algorithm vs. Friend (Stable Gap):* 2019-2024 stable. 18-24 vs 45-54.
          *   Step 1 (Stability): Pass.
