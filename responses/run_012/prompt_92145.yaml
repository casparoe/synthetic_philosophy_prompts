answer: |-
  # The Generational Claim Procedure (GCP-v1)

  **Purpose:** To prevent age, period, or composition artifacts from being mislabeled as generational (cohort) effects.
  **Prerequisites:** Cross-sectional data (2019–Present) in spreadsheet format. Basic pivot table skills.
  **Time:** < 4 hours.
  **Confidence Level:** Moderate. This procedure reduces error but cannot solve the mathematical identification problem (Age-Period-Cohort collinearity) inherent in your data. It forces you to make the assumption explicit rather than hiding it.

  ---

  ## Step 1: The Period Stability Test
  **Goal:** Rule out "Period Effects" (temporary shifts affecting everyone due to current events).
  **Action:** Plot the mean score (or % agreement) for the target item for *each* age band across every wave from 2019 to present.
  **Sufficient Answer:** The gap between the young group (e.g., 18–24) and the older reference group (e.g., 45–54) remains statistically consistent (overlapping confidence intervals or within 5 percentage points) across at least 3 distinct time points (e.g., 2019, 2021, 2024).
  **Stop Condition (Verdict: NO):** The gap widens or narrows significantly in a single wave, or the *entire* population shifts together while the gap remains constant.
  **Hand-off:** If the lines cross or the gap fluctuates wildly, stop. This is a Period Effect (news cycle, economic shock), not a Generation.
  **Proceed if:** The gap is stable over time.

  ## Step 2: The Composition Test
  **Goal:** Rule out "Composition Artifacts" (the difference is actually about income, housing, or geography, not birth year).
  **Action:** Filter your dataset to include *only* respondents who match on key structural variables (e.g., Income > $X, Homeowners, Urban). Re-calculate the gap between the age groups within this restricted subset.
  **Sufficient Answer:** The gap persists (within 10% of the original size) after restricting the sample to comparable economic/housing status.
  **Stop Condition (Verdict: NO):** The gap disappears or shrinks to statistical noise once you control for income/housing.
  **Proceed if:** The difference survives economic controls.

  ## Step 3: The Lifecycle Plausibility Hand-off
  **Goal:** Address the APC Identification Problem. (You cannot mathematically separate Age from Cohort with 5 years of data. You must assert an assumption.)
  **Action:** You must answer this question without data: *"Is there a historical precedent for older people holding this view when they were young?"*
  *   **Option A (Lifecycle):** If the attitude is typically associated with life stage (e.g., risk tolerance, desire for stability, physical energy), assume it is an **Age Effect**.
  *   **Option B (Cohort):** If the attitude is associated with formative technology or cultural shocks unique to their coming-of-age years (e.g., smartphone adoption, post-2008 recession entry), you may claim it is a **Cohort Effect**.
  **Sufficient Answer:** A written justification (3 sentences) citing external context, not your survey data.
  **Hand-off:** **This step returns the decision to a human.** The data cannot answer this. If you cannot justify why this isn't just "being young," you must default to Option A (Age Effect).
  **Proceed if:** You have a defensible rationale for why this is not merely a function of aging.

  ## Step 4: The Heterogeneity Check
  **Goal:** Acknowledge that cohorts are not monoliths (Distinction #2).
  **Action:** Calculate the standard deviation or variance of the item *within* the young age band. Compare it to the variance in the older band.
  **Sufficient Answer:** Acknowledge in the deck that the "generation" is not uniform.
  **Stop Condition (Verdict: NO - with caveat):** If the variance within the young group is massive (e.g., bimodal distribution) and the "average" is driven by a specific sub-segment (e.g., only urban Gen Z), you cannot claim the *generation* thinks this.
  **Proceed if:** You are willing to qualify the claim as "a significant segment of..." rather than "Gen Z..."

  ## Step 5: The Performativity Warning
  **Goal:** Acknowledge that labeling makes the category real (Distinction #3).
  **Action:** Before finalizing the deck, ask: *"If we market to this label, will it change the behavior we just measured?"*
  **Requirement:** If yes, the claim must be stated as a *current snapshot*, not a *fixed trait*.
  **Final Output:** Generate the "Permitted Deck Sentence" using the template in the Examples below.

  ---

  ## Procedure Confidence & Limitations
  *   **Overall Confidence:** 70%. This procedure will stop the most embarrassing errors (composition artifacts and period shocks), but it cannot mathematically prove a cohort effect.
  *   **Least Sure Step:** **Step 3 (Lifecycle Plausibility).**
      *   *Why:* With only 5 years of data, we never see the cohort age. We are guessing whether they will change their minds as they get older based on intuition.
      *   *What would change my mind:* Access to a true longitudinal panel (tracking the *same* people for 10+ years) or historical survey data from 20+ years ago allowing us to see if the 45–54s held this view when *they* were 18–24. Without this, Step 3 remains an educated guess.

  ---

  ## Case Study Applications

  ### Case (a): Algorithm vs. Friend (Stable Gap)
  *   **Data:** 18–24s prefer algorithms 2x more than 45–54s. Gap stable 2019–2024.
  *   **Step 1 (Period):** Pass. Gap is stable over 5 years.
  *   **Step 2 (Composition):** Assume Pass (tech preference often survives income controls).
  *   **Step 3 (Lifecycle):** **Human Decision.** Preference for algorithmic curation is tied to digital native status (formative tech), not biological youth. Plausible Cohort claim.
  *   **Step 4 (Heterogeneity):** Check variance. Assuming normal distribution.
  *   **Verdict:** **Supported (with caveats).**
  *   **Permitted Deck Sentence:** "Among current 18–24 year olds, trust in algorithmic recommendations is significantly higher than among older groups, a pattern consistent since 2019 and distinct from economic factors."
      *   *Note:* Do not use "Gen Z" unless you define it as "current 18–24s."

  ### Case (b): Algorithm vs. Friend (Large Shift)
  *   **Data:** Same item, but the preference jumped for *everyone* in 2024.
  *   **Step 1 (Period):** **Fail.** The whole population moved.
  *   **Verdict:** **Unsupported.**
  *   **Reason:** This is a Period Effect (e.g., AI became mainstream in 2023).
  *   **Permitted Deck Sentence:** "Acceptance of algorithmic recommendations has risen across all age groups since 2023, suggesting a market-wide shift rather than a generational one."

  ### Case (c): Sustainable Goods (Income/Homeowner)
  *   **Data:** 25–34s look like 45–54s once restricted to homeowners above income threshold.
  *   **Step 1 (Period):** Pass/Ignore.
  *   **Step 2 (Composition):** **Fail.** The gap disappears when controlling for assets.
  *   **Verdict:** **Unsupported.**
  *   **Reason:** This is a Composition Artifact. The difference is about purchasing power, not values.
  *   **Permitted Deck Sentence:** "Willingness to pay for sustainability correlates strongly with income and housing status, not age; younger respondents appear less willing primarily due to lower current asset ownership."

  ### Case (d): The Pet Finding (Gen Z wants X)
  *   **Data:** You have promised the Exec Committee that "Gen Z wants X" and built a roadmap on it. You have 5 years of cross-sections.
  *   **Step 1 (Period):** Assume Pass.
  *   **Step 2 (Composition):** **Likely Fail.** (Most "Gen Z" findings in consumer insights fail here due to income/life-stage confounding).
  *   **Step 3 (Lifecycle):** **Fail.** With only 5 years of data, you cannot prove they won't age into the older preference. You are buying a Cohort claim at the cost of an Age assumption you cannot verify.
  *   **Verdict:** **Unsupported.**
  *   **Honest Replacement Sentence:** "Current 18–24 year olds show higher demand for X than older groups; however, we cannot yet distinguish if this is a permanent generational trait or a temporary life-stage need."
  *   **How to Walk it Back to the Committee:**
      > "Our initial analysis highlighted a strong signal among 18–24s. However, upon applying our new validation protocol, we found we cannot yet rule out that this is a function of their current life stage or income level rather than a fixed generational preference. Acting on this as a permanent 'Gen Z' trait carries a high risk of churn as this cohort ages. We are recommending a pilot rather than a full roadmap shift until we validate retention over the next 18 months."
  *   **Smallest Additional Data Collection:**
      > **A Retrospective Cohort Question.** Add one item to the next wave asking older respondents (45–54): *"When you were 18–24, how much did you want [X]?"*
      > *   *Why:* If the 45–54s say "We wanted this too when we were young," it is a Lifecycle (Age) effect. If they say "We never wanted this," it supports the Cohort claim. This is cheaper than a longitudinal panel and solves Step 3 immediately.
