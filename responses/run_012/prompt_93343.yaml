answer: |-
  **The Thought Experiment**
  You are deciding whether to take the highway home (Option A) or the backroads (Option B). The highway saves fifteen minutes and consumes less fuel, so the near-term expected value clearly favors A: you reduce your carbon footprint and gain leisure time with your family, while B wastes resources and time. However, arriving fifteen minutes earlier shifts every subsequent interaction in your household by that margin; you greet your spouse before rather than after they open a specific piece of mail, you cook dinner at a slightly different time, your children go to bed with different micro-expressions on their faces. Because human social dynamics are chaotically sensitive to initial conditions, these microscopic differences cascade into divergent life trajectories for your family and everyone they meet. For every plausible chain where your early arrival prevents a future accident, there is an equally plausible chain where it causes one; the probability distribution over the value of these infinite causal ripples does not narrow over time but remains maximally diffuse, meaning the expected long-term value of Option A relative to Option B is mathematically undefined—the sum of probable goods and bads fails to converge.

  **The Consequentialist Breakdown**
  *   **Objective Consequentialism (OC):** Says the right act is whichever one *actually* produces the most good in the fullness of time. In this case, OC admits there is a fact of the matter (either A or B is objectively right), but concedes that human agents are permanently epistemically cut off from knowing it. You might do the "right" thing by taking the highway, but if a chaotic ripple leads to a disaster fifty years hence, you did the wrong thing, unknowably.
  *   **Expected-Value Consequentialism (EVC):** Says the right act is the one with the highest subjective expected utility. Here, the theory jams. Since the long-term expected value is undefined (the cluelessness problem), and the theory demands we weigh all consequences, EVC cannot rank A over B. It prescribes paralysis, as the crisp near-term gain is theoretically swamped by the undefined long-term variance.
  *   **Rule Consequentialism (RC):** Sidesteps the calculation entirely. It asks which rule, if generally adopted, maximizes good. A rule like "Minimize waste and honor family time when costs are low" clearly endorses Option A. The specific causal ripples of this individual act are irrelevant; what matters is the systemic value of the heuristic.
  *   **Satisficing Consequentialism:** Says you need only produce an outcome that is "good enough," not the optimal one. Since Option A yields a clear, significant near-term good (less pollution, more family time) that crosses the threshold of acceptability, it is permissible, regardless of the unknowable long-term tail.

  **The Heavy Lifting Feature**
  The feature doing the work is **chaotic sensitivity to initial conditions in complex social systems** (the sociological butterfly effect). This ensures that the "signal" of your action does not decay into noise but propagates indefinitely with undiminished variance. If you strip this out—assuming instead that causal ripples dampen quickly and future states become independent of your minor choice—the probability distribution narrows, the long-term expected value converges to zero, and the decision collapses back into a boring calculation under risk where the near-term benefits decisively win.

  **The Escape Hatch**
  A defender of consequentialism will wriggle out by invoking a **reasonable foreseeability constraint**. They will argue that consequentialism as a *decision procedure* only requires agents to maximize the value of foreseeable consequences, not metaphysically all consequences. This is the cheapest escape hatch because it looks like changing the subject from "maximize the good" to "maximize the expected good within epistemic limits." It is, however, a *good* escape hatch because any moral theory demanding omniscience is not a guide for human action but a description of a god's eye view. By tethering obligation to epistemic access, the theory remains action-guiding without abandoning the core commitment to outcomes.

  **The Verdict**
  Cluelessness does **not** sink consequentialism as a decision procedure, provided one rejects the premise that agents must calculate the incalculable. The objection only succeeds against a straw-man version of the theory that conflates the *criterion* of rightness (what actually makes an act right) with the *procedure* for decision-making (how agents choose). I am taking the side that a viable moral theory must be anthropocentric in its procedure; if we define consequentialism as requiring actual maximization of all causal ripples regardless of knowability, it is indeed sunk, but that is a definition no sophisticated proponent holds. The escape via foreseeability survives because it acknowledges that "ought implies can," and we cannot calculate the uncalkculable. The cluelessness objection is a useful check against hubris, but it fails to disprove the theory because it attacks an impossible standard of rationality that no practical ethics could ever meet.
