  **Total Mark: 8/10**

  **Part 1: 4/4**
  *   **What's right:** Your classifications for (1)–(4) are all correct. You correctly identify the morphological markers (tense, *would*, past perfect) that distinguish the two types.
  *   **Specific praise:** The explanation for sentence (2) is spot on. You correctly identify that the past tense marking on *were* is not temporal but modal (marking remoteness from actuality). This is the standard semantic analysis.
  *   **Corrections:** None. Full marks.

  **Part 2: 3/3**
  *   **What's right:** You correctly identify this as an instance of "Anderson's Case." You accurately note that the counterfactual *form* (past perfect + *would have*) does not entail that the antecedent is actually false.
  *   **Specific praise:** The sentence "So the label is about the form, not about the antecedent's truth" captures the main learning objective of this question.
  *   **Corrections:** None. You handled the distinction between morphology and truth conditions well. Full marks.

  **Part 3: 1/3**
  *   **What's right:** You correctly intuited the truth-value gap in this scenario. Your claim that "A's sentence is true... while B's is false" is the correct observation for this specific case (a version of Gibbard's case).
  *   **What's wrong:** You draw a conclusion that contradicts your own evidence.
      *   **The damaging claim:** You write, "So they don't have the same truth conditions, but I don't think that's because they say different things."
      *   **The cost:** This is a fundamental category error in semantics. By definition, if two sentences have different truth conditions in the same context (one true, one false), they express **different propositions**. A proposition *is* a set of truth conditions (or a function from worlds to truth values).
      *   **The damaging claim:** You conclude, "I'd say they come to the same thing."
      *   **The cost:** Because you concluded they are the same proposition despite proving they have different truth values, you lose 2 marks here. You identified the data correctly but failed the logical inference required by the question.
  *   **Correction:** The fact that they diverge in truth value *proves* they express different propositions. The answer to "Does it follow... that they express the same proposition?" is **No**.

  ***

  ### Model Answer for Part 3 (For your reference)

  *Since you mentioned you were out of your depth on this part, here is what a 3/3 answer needed to argue. You can use this to justify the mark if your peer asks.*

  **Full-Mark Sketch:**
  No, it does not follow that they express the same proposition. In fact, the scenario demonstrates that they express **different** propositions.

  1.  **Truth Value Divergence:** In the described context, Engineer A's indicative conditional is **true**. Given the knowledge that the line is down and the oak was the only candidate, epistemically, if it wasn't the oak, it must have been something else (modus tollens on the known facts). However, Engineer B's counterfactual is **false**. When evaluating the counterfactual, we "rewind" to before the event. If the oak hadn't fallen, and there were no other trees/ice, the line would *not* have come down.
  2.  **Propositional Identity:** In semantics, two sentences express the same proposition only if they have the same truth conditions (i.e., they are true in exactly the same set of possible worlds). Since Sentence A is true and Sentence B is false in the *actual* context, they cannot have the same truth conditions.
  3.  **Explanation:** The difference arises because indicatives and counterfactuals quantify over different sets of worlds. The indicative (A) holds fixed the known facts of the actual world (the line is down). The counterfactual (B) allows us to vary the past (the oak didn't fall) without necessarily holding fixed the consequence (the line being down). Therefore, they make different claims about the world.
