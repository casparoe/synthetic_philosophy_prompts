      *   *Simultaneity Fix:* The "Snapshot" rule. On the beat, everyone decides. If you move, you must land on a spot that *was* empty at the start of the beat. If two people try to land on one spot, neither moves (collision). This handles reaction time issues.

  5.  **Developing the Philosophical Debrief:**
