  There are no words to move this weight.
  It sits behind the closed gate.
  You take the same and swallow whole.
  I show the point is real.

  It belongs to the plate, not the hand.
  A property of what is planned.
  The paper slip comes back without a mark.
  I show the print is real.

  No one else can check the lock.
  I hold the only working clock.
  The doctor shrugs and files the sheet.
  I show the plan is real.

  I know it before I make a move.
  It requires no data to prove.
  I push the bowl across the wood.
  I show the pass is real.

  The refrain shifts from "point" (the ineffable quality) to "print" (public evidence) to "plan" (private intention) to "pass" (observable behavior). Each change substitutes a word naming the experience with a word naming a function or action, mirroring the transition from qualia realism to dispositionalism without the speaker explicitly conceding the argument. The final line asserts the behavior ("pass") is what is real, fulfilling the quining argument while maintaining the speaker's perspective that they are proving their original claim.
