          5.  Address the Normative/Contextual issue (Truth $\neq$ Utility). Contrast Novelist (safe) vs. Hiring Manager (risky/unjust).
      *   *Key Move:* Explicitly showing that a group trend can fail to predict individual behavior (the "B answer trap").
      *   *Key Move:* Distinguishing descriptive truth from normative permissibility based on stakes/harm.

  4.  **Developing the Marking Scheme:**
