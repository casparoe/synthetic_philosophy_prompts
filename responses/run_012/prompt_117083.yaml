      *   **Key Philosophical Issues to Address:**
          1.  Does the dispositional reading have content beyond the aggregative? Evidence? Or is it just a histogram?
          2.  Ecological fallacy/Simpson's Paradox type issues (true of group, false of individuals; true of subgroups, false of whole) - *don't name these explicitly in the prompt*.
          3.  Normative dimension: If true, is it *usable*? Context matters (hiring manager vs. doctor vs. novelist).
