      *   *Requirement:* Must invoke the Aggregative vs. Dispositional distinction without giving away the answer. Must invite the normative discussion (context matters). Must hint at the group/individual logic problem without naming "Simpson's Paradox."
      *   *Drafting:* Start with the claim "The Dutch are frugal." Ask them to analyze the ontological status (Aggregative vs. Dispositional). Then ask about the evidence. Then move to the normative "so what?" regarding different roles.
      *   *Refining:* Make sure the prompt explicitly mentions the lecture distinction so they *have* to use it. Ensure the normative part asks about the *conditions* under which a true claim becomes actionable.
      *   *Final Polish:* "Consider the claim 'The Dutch are frugal.' In lecture, we distinguished between reading such claims aggregatively (as statistical distributions) and dispositionally (as shared internal causes). Evaluate whether the dispositional reading retains any explanatory power once the aggregative facts are accounted for. Furthermore, assume for the sake of argument that the aggregative claim is statistically robust. Under what conditions, if any, does the truth of this claim justify acting upon it? Compare at least two distinct social roles (e.g., a novelist, a hiring manager, a policy maker) in your answer."

  3.  **Drafting the Model Answer:**
      *   *Length:* ~600 words.
      *   *Tone:* Academic, precise, demonstrating the "A" moves.
      *   *Content:*
          1.  Define Aggregative vs. Dispositional.
          2.  Address the "content left over" question (Dispositional implies a mechanism/causal power).
          3.  Address the Evidence problem (If it's just the mean, it's a histogram. If it's dispositional, we need a causal story).
