      *   *B Criteria:* Defines terms but treats them as identical, misses the logical gap (assumes group truth = individual probability), treats truth as automatically justifying action.
      *   *Common Mistakes:*
          1.  The "Obituary" (Essentialism is just dead, end of story).
          2.  Conflating Aggregative/Dispositional.
          3.  Ignoring the Context/Role requirement.
