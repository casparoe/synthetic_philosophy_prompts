answer: |-
  This is one of the most famous and counter-intuitive definitions in the history of ethics. You are not misreading it; your confusion stems from the fact that the modern definition of a lie (usually "an intentional attempt to deceive") differs from the Scholastic definition (a "signification against one's mind").

  Aquinas is building a metaphysics of speech here, not just a rule about social harm. To help you lead your group, let's break this down into the distinction he is making, walk through the text, and then apply it strictly to your scenarios.

  ### 1. The Core Distinction: Material vs. Formal Falsehood

  To understand this passage, you have to visualize a triangle of relationships:
  1.  **The Thing** (Reality)
  2.  **The Mind** (The Speaker's Belief)
  3.  **The Word** (The Utterance)

  Aquinas distinguishes two types of falsehood based on which relationship is broken:

  *   **Material Falsehood:** The **Word** does not match **The Thing**.
      *   *Example:* You say "It is raining," but it is sunny.
      *   *Status:* This is an error in fact. If you believed it was raining, you are mistaken, but you are not a liar.
  *   **Formal Falsehood:** The **Word** does not match **The Mind**.
      *   *Example:* You know it is sunny, but you say "It is raining."
      *   *Status:* This is a lie. The disorder is in the will of the speaker using a sign (speech) to signify something other than what is in the signifier (the mind).

  **The Crucial Point:** For Aquinas, the *essence* of speech is to be a sign of thought. Therefore, the primary "truth" of speech is that it matches the thought. The secondary "truth" is that the thought matches reality. When you speak against your mind, you corrupt the very nature of speech itself. When you speak against reality (by mistake), you corrupt only your knowledge, not your speech.

  ### 2. Walking Through the Passage

  Let's annotate the text you provided with this framework.

  > *"However, the essential notion of a lie is taken from formal falsehood, from the fact namely, that a person intends to say what is false..."*

  **Translation:** A lie is defined by the **Formal** mismatch (Word vs. Mind). You must *intend* to say what you believe to be false.

  > *"...wherefore also the word 'mendacium' [lie] is derived from its being in opposition to the 'mind.'"*

  **Translation:** He is using etymology to back up his metaphysics. *Mendacium* comes from *mens* (mind). A lie is an act "against the mind."

  > *"Consequently if one says what is false, thinking it to be true, it is false materially, but not formally..."*

  **Translation:** This is your **Scenario 2** (Honest Mistake). The Word mismatches Reality (Material), but the Word matches the Mind (Formal).
  **Verdict:** Not a lie.

  > *"...because the falseness is beside the intention of the speaker so that it is not a perfect lie, since what is beside the speaker's intention is accidental..."*

  **Translation:** Moral acts get their "species" (their specific moral identity) from the intention. Since the falsehood wasn't intended, it is accidental to the act. It's just an error.

  > *"If, on the other hand, one utters falsehood formally, through having the will to deceive, even if what one says be true..."*

  **Translation:** This is the hard pill. If the Word mismatches the Mind (Formal), it is a lie, *even if* the Word matches Reality (Material).
  **Example:** You think your friend is in the kitchen (but he is actually in the basement). You want to trick me, so I ask where he is, and you say "He is in the basement" (believing you are saying a falsehood).
  **Verdict:** This **is** a lie for Aquinas, because you spoke against your mind.

  > *"That a person intends to cause another to have a false opinion, by deceiving him, does not belong to the species of lying, but to perfection thereof..."*

  **Translation:** This addresses your main worry. **Deception is the goal (the end), not the definition (the species).**
  You can have a lie without successful deception (e.g., I lie to you, but you know I'm lying).
  You can have deception without a lie (e.g., I tell you a technical truth to mislead you).
  For Aquinas, the *sin* is in the disorder of the speaker's soul (Will vs. Intellect), not necessarily in the damage done to the listener.

  ### 3. Commitments on Your Scenarios

  Here is exactly what Aquinas is committed to, which you can state confidently in your group:

  **Scenario 1: Misleading with Truth (Paltering)**
  *   *The Case:* I say "I didn't see him this morning" (which is literally true), knowing he is in the basement, intending for you to believe he isn't here.
  *   *Aquinas's Verdict:* **This is not a lie (*mendacium*).**
  *   *Why:* Your Word matches your Mind. You believe the statement is true, and you say it. There is no *formal falsehood*.
  *   *Is it sinful?* Possibly, but not under the category of Lying. Aquinas would likely classify this as **dissimulation** or a sin against **Charity** or **Justice**. You are withholding information you ought to share, or using ambiguity to harm. But strictly speaking, in *Summa* II-II q.110 a.1, this lacks the essence of a lie.
  *   *Note:* This is why Catholic moral theology often distinguishes between "lying" and "mental reservation" or "strict speech." If the words match the mind, it's not a lie, even if it's deceptive.

  **Scenario 2: Honest Mistake**
  *   *The Case:* I say "He is in the kitchen" (falsehood), believing it to be true, wanting you to believe it.
  *   *Aquinas's Verdict:* **This is not a lie.**
  *   *Why:* There is Material falsehood, but no Formal falsehood. You are not speaking against your mind.
  *   *Nuance:* If you *should have known* better (negligence), you might be sinful for your carelessness, but you have not committed the specific sin of lying.

  **Scenario 3: The "Private Relation" Worry**
  *   *Your Worry:* Does the listener drop out entirely?
  *   *Aquinas's Answer:* No, but the listener is secondary. Speech is *naturally ordained* to communicate thought to another. By speaking against your mind, you are abusing a faculty that is designed for social communion. You are breaking the "social contract" of language itself. The sin is primarily against the **Virtue of Truth** (which resides in the speaker), and secondarily against the neighbor (who is deprived of your true thought).

  ### 4. Explaining the Reply to Objection 1

  This is the part that usually breaks people's brains.
  *   **The Objection:** Surely it's worse to tell a Falsehood (material) than to tell a Truth (material)?
  *   **Aquinas's Reply:** No. It is worse to tell a Truth with the intention of falsehood than to tell a Falsehood with the intention of truth.

  **How to explain this to your group:**
  Aquinas argues that words are signs of **thought** first, and signs of **things** second.
  1.  **Primary Signification:** My words signify what is in my head.
  2.  **Secondary Signification:** What is in my head signifies what is in the world.

  If I say a **Falsehood intending Truth** (Honest Mistake):
  *   My Words match my Mind. (Primary signification is preserved).
  *   My Mind mismatches the World. (Secondary signification is broken).
  *   *Result:* I am in error, but my speech is truthful relative to my mind.

  If I say a **Truth intending Falsehood** (The "Accidental Truth" Lie):
  *   My Words mismatch my Mind. (Primary signification is broken).
  *   My Words match the World. (Secondary signification is preserved accidentally).
  *   *Result:* I have corrupted the very function of speech. I have made my words betray my mind.

  **The Analogy:**
  Imagine a translator.
  *   **Case A:** The translator faithfully translates the author's words, but the author made a factual error. (The translator is faithful; the author is wrong).
  *   **Case B:** The translator knows the author meant X, but deliberately translates it as Y, even if Y happens to be factually true in the real world. (The translator is treacherous).

  Aquinas says the treachery (Case B) is the specific evil of lying. The factual error (Case A) is just ignorance.

  ### Summary for Your Reading Group

  If you need to state the position clearly, use this formula:

  1.  **Definition:** A lie is speaking against one's own mind (*contra mentem*).
  2.  **Necessary Condition:** The speaker must believe what they are saying is false. (No belief of falsehood = no lie).
  3.  **Unnecessary Condition:** The statement does not have to be factually false, nor does the speaker have to successfully deceive anyone. (Factually true statements can be lies; failed lies are still lies).
  4.  **Deception:** The intent to deceive is the *end* or *motivation* of the lie, not the *definition*. One can lie without intending to deceive (e.g., joking, or lying to someone who won't believe you), though this affects the *gravity* of the sin, not the *species*.
  5.  **Misleading Truths:** Telling a literal truth to create a false impression is deception, but technically not a lie in Aquinas's strict definition, because the voice does not betray the mind.

  **Why does he do this?**
  Aquinas is prioritizing the **integrity of the speaker**. For him, the virtue of Truthfulness is an internal habit of aligning your signs (words) with your intellect. If you align your words with your intellect, you possess the virtue of truthfulness, even if your intellect is wrong about the world. If you misalign your words from your intellect, you have vice, even if your words accidentally match the world.

  It feels weird to us because we define lying by its **consequences** (harm/deception). Aquinas defines it by its **act** (disorder of the will).
