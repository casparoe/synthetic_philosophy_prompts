answer: |-
  **Project Title:** The Friction Criterion: Distinguishing Norm from Habit in the Archaeological Record

  **Research Question**
  Archaeology routinely infers values, beliefs, and social obligations from material patterns. When we see uniformity in burial orientation, pottery decoration, or settlement layout, we often describe it as "tradition," "rule," or "taboo." However, uniformity can arise from non-normative causes: environmental constraint, technical efficiency, or simple convenience. A population may build houses identically because that is the only available timber (constraint), or because their ancestors demand it (norm).

  The central question of this project is: **Under what specific conditions does material regularity warrant an attribution of normativity rather than mere behavioral regularity?**

  This is not a question of interpreting specific symbols, but of establishing the epistemological conditions for claiming that a past population operated under an *ought*. Regularity is not normativity. A norm implies a counterfactual: the actor could have done otherwise but did not because they were required not to. The archaeological record, however, primarily shows what *was* done. This project proposes and tests a diagnostic tool—the "Friction Criterion"—to determine when the material record preserves traces of the *pressure* required to sustain a norm against alternative possibilities.

  **Critique of Standard Methods**
  Current methodological frameworks for moving from objects to minds leave this question open.

  1.  **Ethnographic Analogy:** This method imports normative structures from documented societies into the past. While heuristic, it begs the question. It assumes the existence of the norm to prove the existence of the norm. It cannot distinguish whether a observed regularity in the past was maintained by the same social mechanisms as the ethnographic present.
  2.  **Optimality and Behavioral Modeling:** These approaches assume agents act to maximize efficiency or energy return. If a pattern fits an optimality model, it is often interpreted as a rational adaptation to constraint. However, norms are frequently *inefficient*. They require energy to enforce and energy to follow despite cheaper alternatives. If a behavioral pattern is perfectly optimal, it provides no evidence for normativity; it may simply be physics or economics. Conversely, if a pattern is sub-optimal, it *could* be a norm, but it could also be error or lack of knowledge. Modeling identifies deviations, but not the *source* of the deviation.
  3.  **Formal Comparison of Rival Hypotheses:** Archaeologists often weigh "ritual" vs. "domestic" explanations. However, without a clear definition of what material signature a "ritual" obligation leaves distinct from a "domestic" habit, this comparison remains circular. We label the pattern ritual because it looks unusual, and then use the label to explain the pattern.

  These methods identify patterns, but none isolate the *force* behind the pattern. They lack a necessary condition for distinguishing a custom (what we do) from a norm (what we must do).

  **Methodology: The Friction Criterion**
  I propose that an attribution of normativity is warranted only where the record shows regularity being maintained *against* something. I call this the **Friction Criterion**. Friction manifests in three potential forms:
  1.  **Sanction/Correction:** Evidence of punishment, repair, or rejection of deviant items (e.g., broken "wrong" pots in specific contexts, exclusion from burial grounds).
  2.  **Deliberate Boundary Marking:** Investment in marking the limit of the behavior where it is not naturally constrained (e.g., caches of unused materials that were forbidden to be used).
  3.  **Costly Conformity:** A pattern of conformity that was demonstrably more costly to sustain than the nearest available alternative (e.g., transporting specific stone over vast distances when local stone suffices technically, but not ritually).

  This project is conceptual work disciplined by material evidence. I will not generate new data but will re-evaluate existing published datasets to test the validity of this criterion.

  **Case Selection Criteria**
  I will select two contrasting bodies of published material to stress-test the criterion. The cases will not be chosen by period or region, but by the *structure of their interpretation*:
  1.  **The "Technical" Case:** A dataset widely interpreted as driven by function or constraint (e.g., lithic reduction sequences or standardization in tool manufacture), where there is nonetheless unexplained uniformity that exceeds technical necessity.
  2.  **The "Ritual" Case:** A dataset widely interpreted as driven by belief or norm (e.g., burial orientation or votive deposition), where the evidence for *enforcement* is ambiguous.

  In both cases, I will search specifically for evidence of *deviance* and the *reaction to deviance*. If the Friction Criterion is valid, applying it to the "Technical" case should strip away normative claims unless friction is present. Applied to the "Ritual" case, it should either solidify the interpretation (by finding the friction) or force a reinterpretation as habit/convenience (if friction is absent).

  **Work Plan (Six Months)**
  *   **Months 1–2: Conceptual Refinement and Case Selection.**
      *   Finalize the logical formulation of the Friction Criterion (necessary vs. sufficient conditions).
      *   Identify and secure access to the two contrasting datasets based on the criteria above.
      *   *Milestone:* A 2-page methodological memo defining the operational indicators of "friction."
  *   **Months 3–4: Application and Analysis.**
      *   Systematic review of the selected published reports.
      *   Coding of evidence: Where is conformity costly? Where is deviance present, and how is it treated?
      *   *Milestone:* Draft analysis of both cases.
  *   **Month 5: Failure Analysis and Revision.**
      *   Explicit testing of failure modes (see below).
      *   Revision of the criterion based on whether it yields usable results or collapses.
      *   *Milestone:* Complete draft of the article.
  *   **Month 6: Finalizing Deliverables.**
      *   Polishing the article for submission.
      *   Drafting the "Usable Statement" for practitioners.
      *   *Milestone:* Final submission of grant report and manuscripts.

  **Success and Failure Conditions**
  A successful result is not necessarily proving the criterion "true," but determining its utility.
  *   **Success:** The criterion successfully filters out false positives (cases where we assumed norms but only convenience existed) without eliminating all norms. The resulting "Usable Statement" allows other archaeologists to audit their own claims.
  *   **Failure Mode A (Invisibility):** Friction is systematically invisible in the record. Sanctions are ephemeral; costs are hard to measure. If I find that friction *must* exist but never appears, the criterion is theoretically sound but archaeologically useless.
  *   **Failure Mode B (Over-Licensing):** Friction is everywhere. All technical choices involve some cost over alternatives. If every act of selection counts as "friction," the criterion licenses every attribution and therefore none.
  *   **Failure Mode C (Circularity):** I find friction only where previous scholars already claimed norms existed. This would indicate the criterion is just a restatement of existing bias.

  I will treat Failure Mode A as the most significant risk. If friction is invisible, the project will conclude that archaeology cannot distinguish norm from habit without textual support, a significant negative result that still advances the field by halting unjustified speculation.

  **Scope and Limitations**
  To ensure completion within six months, the following are explicitly excluded:
  *   **Diachronic Change:** I will not track the evolution of norms over time. This is a synchronic test of the diagnostic tool.
  *   **Cognitive Modeling:** I will not attempt to model the cognitive architecture of rule-following. The focus is on the material trace of the *social* enforcement of rules.
  *   **Grand Theory:** This is not a theory of social complexity or state formation. It is a mid-range theory for interpreting specific material patterns.

  **Deliverables**
  1.  **Article-Length Paper:** Targeted at a interdisciplinary journal (e.g., *Cambridge Archaeological Journal* or *Journal of Social Archaeology*). The paper will argue for the distinction between regularity and normativity, critique current methods, and present the findings from the two case studies.
  2.  **The Friction Statement:** A short, standalone document (1–2 pages). This will be a practical checklist for archaeologists. It will list the specific material signatures that warrant a claim of normativity and those that do not. It is designed to be appended to site reports or grant applications to justify interpretive claims.

  **Significance**
  For the philosopher, this project addresses the empirical grounding of normative claims. For the historian of science, it examines how a discipline validates inferences about unobservable mental states. For the curator, it offers a rigorous basis for labeling objects as "ritual" or "social" rather than "utilitarian," improving public interpretation. By refusing to conflate what people *did* with what they *ought* to have done, this project aims to make archaeological claims about the human mind more precise, defensible, and honest.
