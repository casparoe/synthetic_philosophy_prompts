  **Journal of Analytic Administration**
  **Editorial Board Notice 2024-04**
  **Subject: Retraction and Scope Limitation of Stalnaker's Thesis**

  The Editorial Board hereby issues a partial retraction of Stalnaker's Thesis, previously maintained as standing doctrine within this journal's scope. The Thesis claims that the probability of an indicative conditional "If A, then C" equals the conditional probability P(C | A). Following a routine audit, the Board finds that Lewis's triviality results demonstrate that accepting the Thesis universally entails P(C | A) = P(C). This implies conditionals are probabilistically independent of their antecedents, rendering them useless for administrative inference.

  **Findings**
  The proof proceeds by applying the Thesis to the probability function conditionalised on the consequent C and on its negation ~C. By summing these values, the triviality result is derived. Consequently, if the Thesis holds, conditionals come out probabilistically independent of their antecedents. The Board notes that rejecting bivalence for conditionals is a distinct move from rejecting the Thesis; the former was considered but filed separately under semantics. Furthermore, while a conditional with a zero-probability antecedent may be perfectly assertible, the Thesis remains silent on such cases, leaving a regulatory gap that cannot be ignored.

  **Method**
  This determination was reached via consensus voting among senior editors, excluding those with tenure tracks dependent on conditional logic. All proofs were verified against standard axioms of probability theory.

  **Competing Interests**
  The Board declares no competing interests, though several members benefit from the continued assertibility of modus ponens in grant applications.

  **Objections Considered and Dismissed**
  1.  *Rejecting Bivalence:* Dismissed as requiring excessive ontological overhead.
  2.  *Zero-Probability Antecedents:* Noted, but deemed insufficient to save the general case.
  3.  *Contextualism:* Rejected due to difficulty in compliance monitoring.

  **Retraction and Policy Adjustment**
  Rather than abandoning the Thesis entirely, which would incur significant reputational costs, the Board chooses to narrow its applicability to ensure institutional stability. The Thesis is retracted generally but reinstated under the following escalating restrictions:
  1.  It applies only to antecedents A where P(A) > 0.
  2.  It applies only to a privileged class of probability functions incapable of updating on conditionals.
  3.  It applies only within a language sufficiently impoverished to prevent the formulation of the triviality proof.

  Accordingly, effective immediately, submissions must not contain prose rich enough to express the propositions required for Lewis's proof. This restriction applies reflexively to the journal's own prose; future notices will avoid complex conditionals where possible. Authors are advised to simplify their ontology before drafting. Submissions violating this linguistic cap will be returned unread. The Board recommends avoiding any vocabulary capable of expressing negation or conditionalisation simultaneously. Compliance officers will scan for triviality-enabling syntax.

  **Note on Self-Application**
  This notice is itself a conditional directive. In accordance with the revised policy, the Board has declined to assign it a probability.^1

  ^1 *Assigning a probability to this notice would require evaluating the antecedent of its own enforcement, triggering a regress.*

  **Signed,**
  *The Editorial Board*
  *Drs. A. N. Onymous, B. U. Reau, & C. E. Teris*
