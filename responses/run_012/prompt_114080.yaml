answer: |-
  # Lesson Plan: The Origin Audit
  **Topic:** Galen Strawson's Basic Argument (The Regress of Ultimate Responsibility)  
  **Level:** Upper-level Undergraduate Seminar  
  **Time:** 75 Minutes  
  **Class Size:** 16 Students (2 Teams of 8)  

  ## Learning Objectives
  1.  **Experiential:** Students will experience the logical friction of infinite regress when attempting to establish "Ultimate Responsibility."
  2.  **Analytical:** Students will distinguish between *Ultimate Responsibility* (UR) and *Moral Accountability* (MA).
  3.  **Philosophical:** Students will identify the controversial premise in Strawson's argument (that UR is required for MA) versus the logical validity of the regress itself.

  ---

  ## Materials Needed
  1.  **Whiteboard/Chalkboard:** Divided into two halves (one for each team).
  2.  **The Ledger Sheets:** 2 large poster sheets or dedicated board space labeled "The Causal Chain."
  3.  **Influence Deck:** 30 Index Cards per team, pre-written with categories (see below).
  4.  **Markers:** Red and Black.
  5.  **Timer:** Visible to the class.
  6.  **Handout:** "The Case of the Sabotaged Culture" (1 per student).

  ### The Influence Deck (Prepare 30 cards per team)
  *   **10x Prior Choice:** "A decision made by the agent previously."
  *   **10x External Pressure:** "Social, economic, or physical constraint."
  *   **5x Internal State:** "Temperament, fatigue, hunger, emotion."
  *   **5x Genetic/Developmental:** "DNA, early childhood shaping, neurology."

  ---

  ## The Case: "The Sabotaged Culture"
  *(Distribute at start of class)*
  > **Defendant:** Alex, a 3rd-year PhD candidate.  
  > **Act:** Alex intentionally poured a corrosive solvent into a rival lab member's (Sam) cell culture, destroying six months of work.  
  > **Evidence:** Security footage confirms Alex entered the lab and committed the act. Alex admits to the act but claims, "I don't know why I did it. I just snapped."  
  > **Task:** The department must decide if Alex is to be **expelled and permanently barred from science** (requires Ultimate Responsibility) or **suspended and mandated to therapy** (requires only Agency/Accountability).

  ---

  ## Minute-by-Minute Timeline

  ### 0:00 – 0:05 | Introduction & Hook
  *   **Instructor:** "Today we are not talking about free will. We are auditors. Your job is to determine if Alex is the *ultimate source* of this action. Not just if they did it, but if the 'they' that did it was created by 'them'."
  *   **Rule:** "You cannot assign the harshest penalty (Expulsion) unless you can close the ledger on how Alex became the kind of person who would do this."
  *   **Setup:** Divide class into **Team A (Prosecution/Auditors)** and **Team B (Defense/Agents)**. 
      *   *Note:* Both teams are actually trying to solve the same puzzle, but competitively. Team A tries to trace the cause back; Team B tries to stop the regress to save Alex.
      *   *Correction for maximum friction:* Actually, make **both teams Auditors** competing to see who can find the "First Cause." If neither can, the concept breaks. 
      *   *Better Dynamic:* **Team A (The Regress):** Tries to trace every cause back. **Team B (The Agent):** Tries to plant a "Free Choice" flag to stop the chain.
      *   *Wait, to match your prompt:* Let's stick to your sketch. **One side builds the ledger, the other challenges.**
      *   **Revised Roles:** 
          *   **Team 1 (The Chain):** Must build a causal chain explaining the act.
          *   **Team 2 (The Breaker):** Must challenge any link that isn't explained by a prior link.
          *   **Goal:** Team 1 wins if they close the ledger (find an uncaused cause). Team 2 wins if they force an infinite regress or a contradiction.

  ### 0:05 – 0:15 | Rules & Mechanics
  *   **The Ledger:** A vertical list on the board. Top = The Act (Pouring Solvent).
  *   **The Move:** Team 1 plays an Influence Card to explain the line above it. (e.g., Act <- Prior Choice).
  *   **The Challenge:** Team 2 immediately asks: "What caused *that*?" 
  *   **The Trap:** Team 1 must play *another* card to explain the previous card.
  *   **The Founding Move Rule:** Team 1 may declare a "Founding Move" (e.g., "Pure Free Will" or "Self-Creation"). 
      *   *Cost:* It costs 3 turns to play.
      *   *Vulnerability:* Team 2 can immediately challenge: "What made the agent capable of *that* founding move?" If Team 1 cannot produce a card from *before* the founding move, the Founding Move is erased, and Team 2 gets a point.
  *   **Scoring:** 
      *   Team 1 gets 1 point for every valid link.
      *   Team 2 gets 5 points if Team 1 fails to close the ledger in 20 minutes.
      *   Team 1 gets 50 points if they successfully close the ledger (Play a Founding Move that survives challenge).

  ### 0:15 – 0:40 | Round 1: The Ultimate Source Game
  *   **Action:** Students play. 
  *   **Expected Flow:** 
      1.  Act -> Jealousy (Internal State).
      2.  Jealousy -> Prior Rejection (External Pressure).
      3.  Prior Rejection -> Insecurity (Internal State).
      4.  Insecurity -> Childhood Neglect (Genetic/Dev).
      5.  Childhood Neglect -> Parents' Behavior (External).
      6.  ...
      7.  Team 1 gets frustrated. They try to play "Free Choice" at step 10.
      8.  Team 2 shouts "Source?"
      9.  Team 1 realizes they need a card from *before* the choice to explain the choice. They don't have one.
      10. The board fills up. Time runs out. Ledger remains open.
  *   **Instructor Role:** Keep time strict. Enforce the "Source?" challenge ruthlessly. Do not offer help. Let them feel the wall.

  ### 0:40 – 0:50 | Debrief Phase 1: The Frustration
  *   **Ask Team 1:** "Why couldn't you close the ledger?" (Expected: "Every cause needed a cause.")
  *   **Ask Team 2:** "Why was the Founding Move invalid?" (Expected: "Because even a choice comes from a person, and the person was made by something.")
  *   **Instructor:** "You just encountered the Regress. You were playing by the rules of *Ultimate Responsibility*. To be blamable in the strongest sense, you must be the *author* of yourself."

  ### 0:50 – 1:00 | Round 2: The Accountability Shift
  *   **Rule Change:** "We are no longer looking for the *Ultimate Source*. We are looking for *Reasons-Responsiveness*."
  *   **New Win Condition:** Team 1 wins if they can show Alex understood the rules and could have acted differently *given the same mental state* (Compatibilist shift).
  *   **Mechanic:** Team 1 places a "Reasons Check" card. Team 2 can only challenge if Alex was *coerced* (gun to head) or *ignorant* (didn't know solvent was corrosive).
  *   **Action:** Team 1 easily wins. Alex knew the rules. Alex wasn't physically forced.
  *   **Result:** The ledger closes instantly. The "Annoyance" vanishes.

  ### 1:00 – 1:10 | Debrief Phase 2: Mapping the Argument
  *   **Reveal:** "This was Galen Strawson's Basic Argument."
  *   **Map the Game to the Premises:**
      1.  **Premise 1 (The Chain):** You do what you do because of the way you are. (Round 1, every link).
      2.  **Premise 2 (The Founding Move Rule):** To be truly responsible for what you do, you must be responsible for the way you are. (The rule that made Founding Moves challengeable).
      3.  **Premise 3 (The Regress):** You cannot be responsible for the way you are (infinite regress). (The outcome of Round 1).
      4.  **Conclusion:** True Ultimate Responsibility is impossible.
  *   **The Pivot:** "Round 2 showed that *Moral Accountability* survives even if *Ultimate Responsibility* dies. We can still punish/expel based on safety and norms (Round 2 rules), just not on metaphysical desert (Round 1 rules)."

  ### 1:10 – 1:15 | Settled vs. Contested (Crucial Nuance)
  *   **Settled:** The logic is valid. If you accept Premise 2, the conclusion follows. The regress is real *under those rules*.
  *   **Contested:** Most philosophers reject Premise 2. Compatibilists argue we don't *need* to be the ultimate source of ourselves to be responsible. Libertarians argue we *can* be the source (Agent Causation), though Strawson says that's magic.
  *   **Takeaway:** "The game proved UR is impossible. It did not prove Responsibility is impossible. That depends on whether you think UR is required."

  ---

  ## Instructor Notes: Troubleshooting & Nuance

  ### What Will Predictably Go Wrong
  1.  **The "Just Choose" Rebellion:** In Round 1, a student on Team 1 will insist, "I'm playing the Free Will card, end of story." 
      *   *Fix:* Enforce the Founding Move Rule strictly. "What made you capable of exercising that will? Was it your brain? Your genetics? If you say 'nothing,' you are claiming magic. The rules require a card."
  2.  **Boredom with Repetition:** By link #6, students may giggle at the repetition.
      *   *Fix:* Speed up the pace. "You have 10 seconds to play the next cause or forfeit the point." The pressure induces the feeling of impossibility.
  3.  **Confusing Round 2:** Students might think Round 2 "solves" free will.
      *   *Fix:* Be explicit in the debrief. Round 2 doesn't solve the metaphysical problem; it changes the *definition* of responsibility to a pragmatic one.
  4.  **Time Creep:** Round 1 often runs long because students want to "win."
      *   *Fix:* Hard stop at 0:40. Even if they are mid-sentence. The unfinished feeling is pedagogically useful.

  ### What The Activity Cannot Reproduce (Instructor Supply Required)
  *   **The Intuition Pump:** The game forces the regress mechanically, but it doesn't explain *why* Premise 2 (You must be responsible for the way you are) is plausible. Students might just say "Premise 2 is false" and dismiss the whole thing.
      *   *Supply:* In the debrief, you must articulate the *intuition* behind Premise 2: "If your character was formed by genes and environment you didn't choose, how can you be *ultimately* praised or blamed for acting according to that character?"
  *   **Agent Causation:** The game makes Agent Causation look like a cheat code (and immediately deletes it). You need to explain that Libertarians believe this move *is* possible, even if the game rules forbid it.
  *   **The "Luck" Objection:** The game hints at it, but you need to explicitly name that if the Founding Move *isn't* determined by the past, it looks like random luck, which also undermines responsibility.

  ---

  ## Handout Content: Settled vs. Contested
  *(Include this on the back of the Case Sheet)*

  **Philosophical Status Report**

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **The Regress is Logical** | **Settled** | If one accepts Strawson's premises, the conclusion follows validly. There is no logical error in the chain. |
  | **Ultimate Responsibility (UR) is Impossible** | **Settled (Conditionally)** | Impossible *if* UR requires being the *causa sui* (cause of oneself). No one creates themselves ex nihilo. |
  | **UR is Required for Moral Responsibility** | **Contested** | **Strawson/Incompatibilists:** Yes. Without UR, blame is unjust.<br>**Compatibilists:** No. We only need agency, reasons-responsiveness, and lack of coercion. |
  | **Agent Causation Escapes the Regress** | **Contested** | **Libertarians:** Yes, agents can be uncaused causes.<br>**Strawson/Physicalists:** No, this is unintelligible or amounts to randomness. |
  | **We Should Abandon Blame** | **Contested** | **Hard Incompatibilists:** Yes, blame is immoral.<br>**Most Philosophers:** No, blame serves a social function regardless of metaphysics. |

  ---

  ## Debrief Script Snippets (For the Instructor)

  **On the Annoyance:**
  "You felt annoyed in Round 1 because the rules demanded something human beings cannot give: a starting point with no prior history. That annoyance is the sound of the Basic Argument working. Strawson isn't saying we don't feel free; he's saying the *conditions* for the kind of freedom that justifies eternal damnation or infinite praise cannot be met."

  **On Round 2:**
  "Round 2 felt easy. Why? Because we stopped asking 'Did you create yourself?' and started asking 'Did you respond to reasons?' This is the Compatibilist move. They agree with Strawson that UR is impossible. They disagree that UR is *necessary*. The game shows you can have a working justice system (Round 2) without a metaphysical miracle (Round 1)."

  **On the "Cheat":**
  "If you felt I rigged Round 1 by forbidding the 'Free Will' card, you are right. I rigged it to match Strawson's definition of responsibility. The philosophical battle isn't about the regress; it's about whether we should accept those rules in the first place."
