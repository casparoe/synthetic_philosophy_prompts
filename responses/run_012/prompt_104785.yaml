answer: |-
  You have spotted the exact hinge point that most introductory explanations gloss over. Your intuition is correct: the asymmetry isn't in the math of the bets, it's in the **psychology and rationality of the counterparty.**

  Here is the breakdown of the names, the concepts, and exactly where the line falls.

  ### 1. What do we call the "Sure Gain" bundle?

  You suggested "Reverse Dutch Book." While that is descriptively accurate and sometimes used in casual conversation, it isn't the standard technical term.

  In finance and economics, what you have constructed is an **Arbitrage**. Specifically, it is a **risk-free arbitrage opportunity** for you.

  In the philosophy of probability (where Dutch Book arguments live), there isn't a single canonical label for the *agent's* sure gain, because the literature focuses on the agent's *vulnerability*. However, when it is distinguished, it is often called:
  *   A **"Positive Dutch Book"** (vs. the standard "Negative Dutch Book").
  *   Or simply **"Bookmaking"** (since you are setting the odds in your favor).

  But the most precise way to label it is to recognize it as the **mirror image of a Dutch Book**. The standard Dutch Book Theorem actually proves *both* directions: if your probabilities are incoherent, there exists a bundle of bets that guarantees you a loss, *and* there exists a bundle (the exact reverse) that guarantees you a gain.

  The reason you rarely hear about the gain side is not because it doesn't exist mathematically, but because it is **pragmatically inert**. Which leads to your second point.

  ### 2. The Asymmetry: Vulnerability vs. Opportunity

  You nailed the catch: *"For the sure-loss bundle, the other guy only needs me to be willing... For the sure-gain bundle, he has to be willing to lose to me for sure, and why would he?"*

  This is the fundamental asymmetry. Here is how decision theorists and philosophers draw the line:

  #### The Sure-Loss (Standard Dutch Book)
  *   **The Mechanism:** You post prices (probabilities) that are incoherent. A cunning opponent constructs a bundle where every individual bet looks "fair" to you (based on your own probabilities), but the bundle guarantees you lose.
  *   **The Counterparty:** The opponent sees a guaranteed win (or at least, no risk). A rational opponent **will** take this bet.
  *   **The Requirement:** This scenario only requires **your** willingness to bet at your stated prices. It does not require the opponent to share your beliefs; they only need to know your prices and basic arithmetic.
  *   **The Label:** **Exploitability.** Your incoherence makes you a "money pump."

  #### The Sure-Gain (Your Scenario)
  *   **The Mechanism:** You post prices that are incoherent in the other direction. You construct a bundle where you gain in every world.
  *   **The Counterparty:** To execute this, someone must take the other side of the bet. For you to win sure, they must lose sure. A rational opponent **will not** take this bet.
  *   **The Requirement:** This scenario requires **their** willingness to bet against their own interest.
  *   **The Label:** **Unrealized Arbitrage.** It is a theoretical profit that cannot be captured in a market of rational agents.

  ### 3. Where exactly does the line fall?

  The line falls at **Counterparty Rationality**.

  The Dutch Book argument is a **defensive norm**, not an offensive one. It tells you how to structure your beliefs so that you cannot be *taken advantage of*. It does not promise that having coherent beliefs will make you rich.

  *   **Incoherence** means you are **vulnerable**. You have left a door open. If a wolf (a rational arbitrageur) walks by, they will eat you (Standard Dutch Book).
  *   **Coherence** means you are **invulnerable**. You have locked the door. The wolf walks away.
  *   **Incoherence** does *not* mean you are **profitable**. You might leave a door open that leads to a pile of cash (Your "Sure Gain" scenario), but the wolf won't walk through a door that leads to their own death. They will just ignore you.

  ### The "Market Maker" Analogy

  Since you play poker, think of this like setting odds in a betting exchange.

  1.  **Standard Dutch Book:** You offer to bet on $A$ at odds that imply 40% probability, and on $Not\text{-}A$ at odds that imply 70% probability. The sum is 110%. A bettor can bet on both sides with you and guarantee a profit. You lose money. The bettor is happy to do this. **You get arbed.**
  2.  **Your Scenario:** You offer to bet on $A$ at 40% and $B$ at 40%, but you demand 90% for $A \cup B$. You are effectively offering to sell insurance for less than the cost of the reinsurance you are buying. You would make money if anyone took the deal. But no one will buy the insurance from you if they can see that the math guarantees they lose. **No trade occurs.**

  ### Summary

  *   **Name:** Mathematically, it is the reverse side of the **Dutch Book Theorem**. Functionally, it is **Arbitrage**.
  *   **Asymmetry:** The Sure Loss requires only **your** irrationality (incoherence). The Sure Gain requires **your** irrationality **plus** the **counterparty's** irrationality (willingness to take a sure loss).
  *   **The Lesson:** Coherence is a hygiene factor. It prevents you from dying (losing sure money); it does not guarantee you live (make sure money). The "trouble" incoherence brings is strictly the risk of exploitation, not the missed opportunity for free money.

  You are right to feel that "incoherence" alone doesn't tell the whole story. The full story is: **Incoherence + Rational Counterparties = Sure Loss.** Incoherence without rational counterparties might just mean you sit there with untradeable odds.
