  Hey, I'm in a philosophy of biology class and we just did the species problem. I followed the ring species stuff ok, but something's bugging me. My roommate works in a genomics lab and he says the whole species problem is really just a data problem — once you've sequenced enough individuals you can basically read the species boundaries straight off the tree, and his lab already delimits a species as the smallest lineage you can diagnose from its genome, so the philosophy side is just people arguing about words while the biology moves on. I think he's probably right. But then our prof keeps saying there's no single correct species concept, which sounds like species are kinda made up, and if that's true I dont get how a conservationist can say a species went extinct without just picking a favorite group and calling it a thing. So is the species problem basically a temporary gap in data that sequencing will eventually close? I have to write a short response paper and I keep going in circles. American English please.
