      *   Chair signature/Power? Acknowledged.

  *(Self-Correction during drafting)*: I need to make sure I don't make the procedure *too* bureaucratic. 90 applications is a lot for 5 people in one afternoon. If they spend 20 minutes on the procedure per app, they won't finish. The procedure must apply to the *final selection* of the 10 winners from the shortlist, or be a lightweight version for all. I will recommend it for the "Decision Zone" (the top 20 candidates). For the clear rejects, a quick consensus is fine. The risk is in the winners.

