      *Refining for the User's constraints:* They have one afternoon. 90 apps. 10 awards. That's roughly 10-15 minutes per application if they discuss all, but likely they triage first. Let's assume they shortlist then discuss. The procedure needs to apply to the "borderline" or "final selection" phase where consensus matters most.
      *Correction:* The prompt implies they discuss the whole batch or at least the selection phase. 90 apps in one afternoon is tight (4.5 mins/app). They likely pre-score and discuss the top 20-30. I will design the procedure for the *deliberation phase* on the shortlist.

  5.  **Addressing the Specific Questions within the Procedure:**
      *   *5 vs 1 Evidence:* "Source Attribution Rule."
      *   *Actual Thoughts:* "Private Score Lock."
      *   *Dissent Threshold:* "The Unique Information Clause."
      *   *Reversals:* "The Stability Check."
      *   *Order:* "Chair Last, Randomized Panelists."

  6.  **Developing the Three Cases:**
      *   *Case 1 (4 agree, 1 nagging doubt):* Apply the procedure. Does the doubt trigger a review?
      *   *Case 2 (All agree, trust it):* When is consensus valid? (Independent sources).
      *   *Case 3 (Reopen last year):* The hard truth. If the procedure wasn't used, can we trust last year? (Probably not, but practical constraints apply).

  7.  **Identifying Limitations (The "Honest Assessment"):**
      *   Where will it fail? (Time pressure, fatigue, subtle bias).
      *   Which steps are fake procedure? (Defining "unique info").
      *   Unsettled questions? (Tie-breaking, risk tolerance).

  8.  **Drafting the Content (incorporating the "Information Cascade" theory):**
      *   Acknowledge the user's insight: Yes, they are describing an *Information Cascade*. It is rational for individuals to ignore private signals if public signals are strong, but disastrous for the group.
