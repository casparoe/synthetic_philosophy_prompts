answer: |-
  The single requirement that does the most work is explaining why moral residue is warranted rather than merely psychological, and yes, the requirement that "ought implies can" holds universally is jointly unsatisfiable with the requirement that genuine dilemmas involve simultaneous binding obligations.

  **1. Account for Warranted Moral Residue**
  *   **Case:** *Sophie's Choice* (parent forced to select one child for death) or the *Ventilator Triage* (doctor lets one patient die to save two).
  *   **Requirement:** The theory must explain why the agent's guilt, regret, or sense of "stain" is morally appropriate rather than merely a psychological glitch or irrational leftover.
  *   **Status:** **Non-negotiable for Dilemma Realists / Camp Commitment for Rationalists.** (This addresses your roommate: a theory that treats post-dilemma guilt as purely psychological error fails to capture the normative weight of the loss; however, utilitarianists often treat it as irrational noise. To count as a theory of *genuine* dilemmas, it must vindicate the residue.)
  *   **Knocks Out:** Act Utilitarianism (typically views residue as irrational if the best outcome was chosen); Strict Kantianism (struggles to explain why a justified act leaves moral dirt).

  **2. Distinguish Genuine Dilemmas from Merely Hard Choices**
  *   **Case:** *Buridan's Ass* (indifference between two equal goods) vs. *Conflicting Promises* (obligation to A conflicts with obligation to B).
  *   **Requirement:** The theory must distinguish between a situation where you simply don't know what to do (epistemic uncertainty) or don't want to sacrifice (hard choice) versus a situation where morality itself provides no single right answer (ontological conflict).
  *   **Status:** **Non-negotiable.** (If a theory collapses this, it denies the phenomenon exists.)
  *   **Knocks Out:** Monistic Value Theories (if all values reduce to one scale, there are no genuine dilemmas, only calculation errors).

  **3. Resolve the "Ought-Implies-Can" (OIC) Tension**
  *   **Case:** *Conflicting Promises* (promised X and Y, time overlaps, cannot do both).
  *   **Requirement:** The theory must explicitly state whether it sacrifices OIC, sacrifices the agglomeration principle (if Ought A and Ought B, then Ought A&B), or denies the obligations were simultaneous. It cannot maintain all three.
  *   **Status:** **Jointly Unsatisfiable Pair.** (You cannot hold Universal OIC + Agglomeration + Genuine Dilemmas. A theory must drop one.)
  *   **Knocks Out:** Any theory claiming to uphold standard deontic logic while affirming genuine dilemmas without modification.

  **4. Handle Source Sensitivity (Self-Induced vs. Luck)**
  *   **Case:** *Double-Booked Promises* (you negligently promised two friends) vs. *Shipwreck* (you can only save one stranger due to no fault of your own).
  *   **Requirement:** The theory must distinguish whether the *origin* of the dilemma affects the agent's blameworthiness for being in the situation, even if the choice structure is identical.
  *   **Status:** **Camp Commitment (Your Friend's Intuition).** (This is a genuine desideratum for responsibility-sensitive theories, but not strictly necessary for the existence of the dilemma itself. A theory can acknowledge the difference in *culpability* without denying the *dilemma* status in luck cases.)
  *   **Knocks Out:** Theories that treat all obligations as strictly objective regardless of agent capacity or history (some forms of Platonism).

  **5. Preserve Action-Guidance**
  *   **Case:** *The Ventilator* (who gets the machine?).
  *   **Requirement:** Even if the theory says "both options are wrong" or "there is no single right answer," it must not paralyze the agent; it must allow for a decision procedure or permission to act.
  *   **Status:** **Non-negotiable.** (Ethics must guide action.)
  *   **Knocks Out:** Nihilism or radical skepticism that offers no resolution mechanism.

  **6. Distinguish Conflict of Duties vs. Conflict of Values**
  *   **Case:** *Justice vs. Mercy* (punish the guilty son or show mercy).
  *   **Requirement:** The theory must specify whether the conflict is between two binding *obligations* (deontic) or between two competing *goods* (axiological) where only one can be realized.
  *   **Status:** **Camp Commitment (Pluralists vs. Monists).** (Pluralists see this as a genuine dilemma; Monists see it as a weighing problem.)
  *   **Knocks Out:** Reductive Monism (if all values commute, there are no incommensurable conflicts).

  **Incompatibility Note:** The pair **"Universal Ought-Implies-Can"** and **"Existence of Genuine Dilemmas (Simultaneous Binding Obligations)"** cannot be jointly satisfied. If you ought to do A and ought to do B, but cannot do both, OIC is violated unless you deny one obligation was real. A theory of genuine dilemmas *must* reject standard OIC or Agglomeration.

  **Confidence:** I am 90% confident in this list as a functional spec for seminar debate.
  **Least Sure Requirement:** **Requirement 4 (Source Sensitivity).** While intuitively powerful (your friend's point), some argue that a genuine dilemma is defined solely by the immediate choice structure, making the history of how you got there irrelevant to the *moral* conflict itself, even if relevant to *blame*.
