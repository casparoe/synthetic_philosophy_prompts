prompt: |-
  Right, I'm a psych PhD student who's gone too far down the methods rabbit hole, and I want a sanity check on my comittments before I say any of this out loud in a seminar. Here's where I've landed.

  1. Evidence is a Bayesian business. What data tell you is how much they should move your credences, and a p-value isn't a measure of evidence at all. I also take the likelihood principle seriously: if two experiments hand you the same likelihood function, they hand you the same evidence, so it shouldn't matter that you'd planned to run twenty more participants or that you peeked at the data halfway through.

  2. The replication crisis is mostly a selection problem. You can fiddle with your covariates, your exclusion criteria, your outcome measure, and only the version that landed under p < .05 makes it into the paper. So the fix is pre-registration and registered reports — lock the analysis before you see the data.

  3. I don't really believe in a single true effect size for most of what we study. Effects are context-bound, and the picture of one number sitting out there waiting to be estimated is a fiction. So when someone fails to replicate a study in a slightly different setup with a different population, they haven't refuted anything — they've tested a different claim.

  4. That said, when a big batch of our published findings got re-run and only a minority came back, I read that as evidence that a lot of what got published was simply false. That's the whole reason I care about any of this.

  5. I'm suspicious of priors in psychology. I don't think anyone can honestly put a number on how likely it is that ego depletion is real, so when I see a Bayesian paper with a prior over the effect size I basically read the prior as made up. A well-powered pre-registered frequentist study with the analysis plan filed in advance strikes me as more trustworthy than a Bayesian analysis whose prior was picked because it looks neutral.

  And one more thing I've been chewing on, which I don't think is a standard view so much as something I've invented in my notes — I've started writing as if every study has two readings. There's the evidential reading: what does this data do to my credences. And there's the audit reading: if a whole field works like this, what fraction of what it publishes is true. I can't tell whether that distinction is doing real work or whether I'm just dressing up the thing everyone already knows.

  So: which of 1–5 are actually pulling against each other, which pairs only look like they clash, and what's the cheapest way back to a package that hangs together? Rank the tensions by how bad they are — I'd rather be told that one of them is fatal than get a list where everything is equally worrying. For each genuine one, say what has to give and what I lose by giving it. And at the end, tell me which single change cleans up the most mess, even if it isn't the one I'd enjoy making. I don't need a lecture on the replication crisis, I need the audit.

  Write it in British English please — my supervisor is pedantic about -ise and I'll never hear the end of it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Psychology PhD student, deep into methods/statistics, likely stressed/overthinking ("gone too far down the methods rabbit hole").
      *   **Goal:** Sanity check on five specific methodological/philosophical commitments + one novel distinction ("evidential" vs. "audit" reading).
      *   **Task:** Identify tensions/contradictions between points 1-5, rank them by severity (fatal vs. manageable), propose resolutions (what has to give, what is lost), and identify the single most effective change to clean up the mess.
      *   **Tone:** Direct, rigorous, "audit" style (no lectures on replication crisis), British English (-ise spelling).
      *   **Constraints:** Do not lecture on the replication crisis (they know it). Focus on internal consistency of their stated views.

  2.  **Deconstruct the Five Commitments:**
      *   *Point 1 (Bayesian/Likelihood):* Evidence = Bayesian updating. Likelihood Principle (LP) holds (stopping rules don't matter). P-values $\neq$ evidence.
      *   *Point 2 (Replication Crisis/Fix):* Crisis = selection bias (p-hacking). Fix = Pre-registration/Registered Reports (lock analysis).
      *   *Point 3 (Effect Size Ontology):* No "true" effect size. Effects are context-bound. Non-replication $\neq$ refutation (different claim).
      *   *Point 4 (False Positives):* Low replication rates = many published findings are false. This motivates the concern.
      *   *Point 5 (Priors vs. Frequentist Trust):* Suspicious of subjective priors (made up). Trusts well-powered pre-registered frequentist studies more than Bayesian ones with "neutral" priors.
      *   *Novel Distinction:* Evidential reading (credence update) vs. Audit reading (field-level truth rate).

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: Point 1 vs. Point 5 (The Bayesian/Frequentist Clash).**
          *   *Point 1:* "Evidence is a Bayesian business." P-values aren't evidence. LP holds.
          *   *Point 5:* "I don't believe in priors... A well-powered pre-registered frequentist study... strikes me as more trustworthy."
          *   *Conflict:* If evidence *is* Bayesian (Point 1), how can a Frequentist procedure (which explicitly rejects Bayesian updating and relies on long-run error rates, not credences) be *more* trustworthy for establishing truth? Point 5 essentially rejects the ontology of Point 1 in practice. Point 1 says p-values aren't evidence; Point 5 says a process designed to control p-values is the gold standard for trust.
          *   *Severity:* High. This is a foundational philosophical contradiction.

      *   **Tension B: Point 1 vs. Point 2 (Likelihood Principle vs. Pre-registration).**
          *   *Point 1:* LP holds. Stopping rules/peeking don't change evidence (likelihood function is the same).
          *   *Point 2:* Fix is pre-registration to stop p-hacking/peeking.
          *   *Conflict:* If you truly believe the Likelihood Principle (Point 1), then pre-registration (Point 2) is largely unnecessary for *inference*. It matters for *decision making* or *audit*, but if evidence is just the likelihood, why lock the analysis? The data speaks the same regardless of intent. Point 2 assumes the frequentist error properties matter (which depend on the sampling plan), which Point 1 denies.
          *   *Severity:* Medium-High. It undermines the justification for the proposed fix in Point 2.

      *   **Tension C: Point 3 vs. Point 4 (Contextualism vs. False Positives).**
          *   *Point 3:* Effects are context-bound. Failed replication = different claim.
          *   *Point 4:* Low replication rates = published findings were false.
          *   *Conflict:* If every context is unique (Point 3), then "false" loses meaning. A finding isn't false; it's just local. But Point 4 relies on the idea that there *was* a claim made that turned out to be untrue (false positive). If Point 3 is true, the replication crisis isn't about false findings, it's about over-generalisation.
          *   *Severity:* Medium. It creates a semantic/ontological wobble.

      *   **Tension D: Point 5 vs. Point 2 (Priors vs. Pre-registration).**
          *   *Point 5:* Priors are made up; Frequentist pre-reg is better.
          *   *Point 2:* Pre-reg is the fix.
          *   *Alignment:* These actually align well. Both favour frequentist pre-registration. The tension is with Point 1.

      *   **The "Novel Distinction" (Evidential vs. Audit):**
          *   This actually resolves Tension B (Point 1 vs. Point 2).
          *   *Evidential:* Follows Point 1 (Bayesian/LP).
          *   *Audit:* Follows Point 2 & 5 (Frequentist/Pre-reg).
          *   *Verdict:* This distinction is doing real work. It's not just dressing up. It allows the user to hold Point 1 and Point 2 simultaneously without exploding.

  4.  **Rank the Tensions:**

      1.  **Fatal:** Point 1 vs. Point 5. You can't say evidence *is* Bayesian updating while simultaneously saying Frequentist procedures are *more trustworthy* for establishing truth. One of these definitions of "evidence" or "trust" must go.
      2.  **Serious:** Point 1 vs. Point 2. If LP is true, pre-registration is less critical for inference. (Mitigated by the Evidential/Audit distinction).
      3.  **Manageable:** Point 3 vs. Point 4. Requires clarifying what "false" means (false generalisation vs. false existence).

  5.  **Develop Resolutions (What has to give):**

      *   *For 1 vs 5:* Either embrace Bayesianism fully (accept subjective priors as necessary) or admit Point 1 is philosophical posturing and Point 5 is the practical reality. Given Point 5's skepticism of priors, the user is practically a Frequentist who likes Bayesian *language* for evidence.
      *   *For 1 vs 2:* Use the Evidential/Audit distinction. Point 1 applies to Evidential; Point 2 applies to Audit.
      *   *For 3 vs 4:* Refine Point 3. Effects are heterogeneous, but not infinitely so. There is a distribution of effects. A replication failure suggests the original estimate was biased upwards (winner's curse), not necessarily that the effect is zero everywhere.

  6.  **Identify the "Single Change":**
      *   The biggest mess comes from Point 1 ("Evidence is a Bayesian business") clashing with Point 5 (Distrust of priors/Faith in Frequentist pre-reg).
      *   *Change:* Drop the strong claim in Point 1 that p-values *aren't* evidence. Or, more precisely, acknowledge that while Bayesian updating is the *ideal* model of learning, Frequentist error control is the *reliable* mechanism for audit in a low-trust environment.
      *   *Actually, the cleanest cut:* Abandon the strong Likelihood Principle stance in Point 1 *for the purposes of scientific policy*. Or, acknowledge that Point 5's distrust of priors is the weak link.
      *   *Best advice:* The user's "Evidential vs. Audit" distinction is the saviour. They should lean into that hard. But the prompt asks for a *change* to clean up the mess. The mess is caused by claiming Point 1 is true *and* Point 5 is true.
      *   *Recommendation:* Modify Point 1. Evidence *for an individual* might be Bayesian, but evidence *for the field* (Audit) requires error rates. Don't claim p-values are *never* evidence; claim they are poor evidence *without* audit controls.
      *   *Wait, looking closer:* Point 5 says "I don't think anyone can honestly put a number on [priors]...". This is the weak link. If they accept Point 1 (Bayesian), they *must* accept priors. If they reject priors, they aren't truly Bayesian.
      *   *Single Change:* Drop the hardline Bayesian ontology in Point 1. Adopt a "Pragmatic Frequentist" stance. It aligns better with Points 2, 4, and 5. Point 1 is the outlier.

      *   *Alternative Single Change:* Embrace the "Evidential vs. Audit" distinction as the core framework. This validates Point 1 (Evidential) and Point 2/5 (Audit). But the prompt asks for a change to the *commitments*.
      *   *Let's look at the "Fatal" tension again.* Point 1 says P-values aren't evidence. Point 5 says Frequentist pre-reg (which produces p-values) is more trustworthy. This implies the Frequentist output *is* more evidential. Contradiction.
      *   *Resolution:* Admit that "Trustworthiness" (Point 5) is about the *Audit* function, not the *Evidential* function.
      *   *Best Single Change:* Refine Point 1 to acknowledge that while Bayesian updating describes *learning*, Frequentist controls describe *reliability*. Don't dismiss p-values as "not evidence"; dismiss them as "uncontrolled evidence".
      *   *Actually, the most effective change:* **Drop the skepticism of priors in Point 5.** If you are going to be Bayesian (Point 1), you need priors. Skeptical priors (e.g., Cauchy(0, 0.707)) are standard for a reason. Claiming they are "made up" ignores sensitivity analysis. However, the user seems *very* committed to Point 5.
      *   *Re-evaluating:* The user is effectively a **Error Statistician** (Mayo) who likes Bayesian *words*. They care about severe testing (Point 2/5) but describe evidence as credences (Point 1).
      *   *Cheapest way back:* Align Point 1 with Point 5. Stop calling evidence "Bayesian". Call it "Inferential".
      *   *Wait, the "Evidential vs Audit" distinction is the key.* The user invented it. I should validate it. It solves the 1 vs 2 tension. It doesn't solve 1 vs 5 fully.
      *   *Okay, the prompt asks: "which single change cleans up the most mess, even if it isn't the one I'd enjoy making."*
      *   The mess is the contradiction between 1 and 5.
      *   Change: **Soften Point 1.** Acknowledge that in a high-noise, low-trust field (Point 4), error-rate control (Frequentist) is a better proxy for evidence than uncalibrated Bayesian credences.
      *   *Actually, looking at Point 3:* Point 3 (context-bound) makes Point 4 (false findings) hard to justify. If effects are context-bound, the original finding wasn't "false", just "local". The replication wasn't "failure", just "different context". This dissolves the crisis. But the user *wants* the crisis to be real (Point 4).
      *   *Decision:* The tension between 1 and 5 is the philosophical killer. The tension between 3 and 4 is the ontological killer.
      *   *Ranking:* 1 vs 5 is worse because it affects how they analyse data *now*. 3 vs 4 affects how they interpret literature.
      *   *Single Change:* **Modify Point 5.** Accept that "objective" priors exist and are useful, OR **Modify Point 1.** Admit that p-values *are* evidence of a sort (error probabilities).
      *   *Let's go with modifying Point 1.* It's the most "theoretical" and easiest to tweak without changing their practical workflow (which seems to be Pre-registered Frequentist).

      *   *Wait, one more look at the "Evidential vs Audit" distinction.* The user asks: "I can't tell whether that distinction is doing real work or whether I'm just dressing up the thing everyone already knows."
      *   *My verdict:* It *is* doing real work. It's the difference between *inference* and *quality control*. It saves them from the 1 vs 2 contradiction. I need to validate this strongly.

      *   *Final Plan:*
          1.  Validate the Evidential/Audit distinction (it's good).
          2.  Rank tensions: 1vs5 (Fatal), 1vs2 (Resolved by distinction), 3vs4 (Semantic).
          3.  Resolve 1vs5: You can't be a Bayesian who hates priors.
          4.  Single Change: Drop the "Evidence is *only* Bayesian" claim. Adopt a pluralist view where Frequentist error rates *constitute* evidence in an audit context.

      *   *British English Check:* -ise (organise, prioritise, etc.), "favour", "centre", "programme" (if used), "modelling". Tone: Academic, direct, slightly dry.

  5.  **Drafting the Response:**
      *   *Intro:* Acknowledge the sophistication. Validate the "Evidential/Audit" distinction immediately (it's the linchpin).
      *   *Tension 1 (Fatal):* Point 1 vs Point 5. Bayesian ontology vs. Frequentist trust.
      *   *Tension 2 (Resolved by Distinction):* Point 1 vs Point 2. LP vs. Pre-reg.
      *   *Tension 3 (Ontological):* Point 3 vs Point 4. Contextualism vs. False Positives.
      *   *Resolution Strategy:* What to sacrifice.
      *   *The Single Change:* Modify Point 1.

      *(Self-Correction during drafting)*: I need to be careful with Point 3. If effects are truly context-bound, "false positive" is a category error. I need to point out that Point 3 risks making Point 4 meaningless. If nothing is generalisable, nothing is false.
      *(Refining the Single Change)*: The user says "Evidence is a Bayesian business." If they change this to "Evidence is contextual," it aligns better. But the *biggest* mess is the Bayesian/Frequentist schizophrenia. I will recommend softening Point 1 to accommodate Point 5's practical wisdom.

      *(British English Check)*: Ensure "analyse", "categorise", "favour", "behaviour", "modelling", "programme". Avoid "z".

      *(Final Polish)*: Ensure the tone is supportive but rigorous ("audit" style). No fluff.

  6.  **Final Review against constraints:**
      *   British English? Yes.
      *   Rank tensions? Yes.
      *   What has to give/what is lost? Yes.
