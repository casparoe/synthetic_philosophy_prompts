      *   **Key Elements:**
          *   Define Remedial View (injustice required) vs. Plebiscitary View (choice is enough).
          *   Apply to Quebec: 1995 campaign, grievances (1982 Constitution, Meech Lake), movement rhetoric.
          *   Analyze Supreme Court *Secession Reference* and *Clarity Act*: Third theory or evasion?
          *   **Press Point 1:** The Boundary Problem (Who votes? Residents? All Canadians? Ethno-linguistic nation?).
          *   **Press Point 2:** Standing Secession Clause (Pre-negotiated exit): Resolution or relocation of the problem?
      *   **Tone:** Academic, analytical, nuanced, essay-style.

  2.  **Deconstruct the Theories:**
      *   *Remedial Right Only:* Secession is a last resort remedy for grave injustice (colonialism, oppression, rights violations). Analogy: Divorce due to abuse, not just incompatibility.
      *   *Plebiscitary (Primary) Right:* Self-determination is a fundamental democratic right. If a "people" wills it, they may do it. Analogy: Freedom of association/exit.

  3.  **Analyze the Quebec Case (1995 & Aftermath):**
      *   *Context:* 1982 Constitution patriated without Quebec consent. Meech Lake (1990) and Charlottetown (1992) accords failed. 1995 Referendum lost by <1% (50.6% No, 49.4% Yes).
      *   *Grievances:* Was the failure of Meech Lake an "injustice" or a "political defeat"? Quebec distinct society recognition denied.
      *   *Rhetoric:* Sovereigntists argued for the *right to choose*, not primarily based on human rights abuses.
      *   *Legal Aftermath:* 1998 Supreme Court Reference (no unilateral right, but duty to negotiate if clear majority on clear question). 2000 Clarity Act (Parliament decides clarity).

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Self-determination is a core but contested norm. Quebec 1995 is the stress test. Introduce the two rival theories.
      *   **The Remedial View & Quebec:**
          *   *Theory:* Secession only for grave injustice.
          *   *Application:* Does Quebec fit? 1982 exclusion? Meech failure?
          *   *Critique:* These look like political losses in a democracy, not systemic oppression. The movement didn't argue "we are oppressed" but "we are distinct."
          *   *Cost to Theory:* If a stable liberal democracy faces a durable secessionist movement based on identity, not abuse, the Remedial View lacks explanatory power or must stretch the definition of "injustice" until it breaks.
      *   **The Plebiscitary View & Quebec:**
          *   *Theory:* Will of the people is sufficient.
          *   *Application:* Fits the Sovereigntist rhetoric ("Maître chez nous").
          *   *Critique:* The Boundary Problem. Who is the "people"? Quebecers? Canadians? Francophones?
          *   *Cost to Theory:* Risks instability, tyranny of the local majority, ignores interdependence.
      *   **The Legal Aftermath (Reference & Clarity Act):**
          *   *Analysis:* SCOC said no unilateral secession, but a clear vote creates a duty to negotiate. Clarity Act gives Parliament power to judge the vote.
          *   *Verdict:* Is it a third theory? It's a procedural hybrid. It avoids the *right* to secede and focuses on the *process*. It's less a theory of justice and more a theory of conflict management. It evades the moral core.
      *   **Press Point 1: The Boundary Problem:**
          *   *The Circle:* To vote on independence, you need a demos. Who defines the demos?
          *   *Quebec Context:* If Quebec residents vote, what about Indigenous peoples within Quebec (Cree/Inuit) who wanted to stay in Canada? What about the rest of Canada?
          *   *Implication:* Plebiscitary view collapses here. Remedial view sidesteps it (if you are oppressed, boundaries are clearer), but Quebec isn't clearly oppressed.
      *   **Press Point 2: The Standing Secession Clause:**
          *   *The Device:* Pre-agreed rules (supermajority, timeline).
          *   *Pros:* Reduces uncertainty, lowers stakes.
          *   *Cons:* Does it solve the "Who votes?" question? No, it codifies it. Who agrees to the clause initially? (The 1982 problem repeats).
          *   *Verdict:* Relocates the boundary problem. It manages the symptom, not the disease.
      *   **Conclusion:** Summarize. Quebec shows the limits of both theories. The legal solution is pragmatic but theoretically thin. Self-determination remains an unfinished project in liberal democracies.

  5.  **Refining and Polishing:**
      *   *Check Tone:* Ensure it sounds like a rigorous political theory essay. Use terms like "normative force," "constitutive," "circularity."
      *   *Check Constraints:* Did I address the 1982/Meech grievances specifically? Yes. Did I address the SCOC Reference/Clarity Act? Yes. Did I press the Boundary Problem and Standing Clause? Yes.
      *   *Self-Correction during drafting:* I need to make sure I don't just describe history but use it to *test* the theory. For instance, when discussing the Remedial View, explicitly state how Quebec *fails* the test, and what that implies for the theory's universality. When discussing the Boundary Problem, link it back to the Plebiscitary View's reliance on "the people."

  6.  **Final Review against Prompt:**
