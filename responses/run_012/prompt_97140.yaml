  Based on your verdicts, your intuition is not merely procedural (was there a vote?) but substantive (was there a right to vote? was the motive just? what happens to minorities?). Your draft principle failed because it treated "grievances" too broadly and did not account for the *nature* of the community seeking independence.

  Here is the repaired principle, followed by the application to your new cases and the identification of the necessary trade-off.

  ### The Principle of Conditional National Self-Determination

  A group is legitimate in seceding if and only if it satisfies the following four conditions:

  1.  **The Distinctness Condition:** The seceding group must constitute a distinct political community or nation, characterized by a shared political culture, history, or identity that differentiates it from the parent state.
      *   *Motivates:* **Scotland/Quebec** (Distinct national identity) vs. **Wealthy Region** (Shares language/culture, motivated by economics). This explains why Scotland can leave the UK, but a wealthy province cannot leave a homogeneous state simply to avoid taxes.
  2.  **The Legitimacy Condition:** The secession must proceed via either (A) **Consent** (a negotiated referendum agreed to by the parent state) or (B) **Remedy** (severe, persistent injustice, persecution, or war where consent is unreasonably withheld).
      *   *Motivates:* **Scotland/Quebec** (Consent) and **Kosovo/South Sudan** (Remedy/Injustice) vs. **Catalonia** (No Consent, No Remedy) and **Crimea** (No Consent, Coercion). This explains why Catalonia failed (constitutional block without sufficient injustice) while Kosovo succeeded (injustice without consent).
  3.  **The Integrity Condition:** The process must be free from foreign coercion, and the new state must demonstrate the capacity and will to protect the rights of its own internal minorities.
      *   *Motivates:* **Crimea** (Foreign coercion makes it illegitimate) and **Hypothetical Mistreating State** (Illegitimate).
  4.  **The Nested Reciprocity Condition:** Distinct sub-regions within the seceding territory that voted against independence must be permitted to opt out and remain with the parent state, provided they form a coherent territory.
      *   *Motivates:* **Scottish Islands**. If Scotland can exercise self-determination against the UK, the Hebrides can exercise it against Scotland.

  ---

  ### Application to New Cases

  **1. A region that suffers no injustice but whose central government lawfully refuses, indefinitely, ever to permit a referendum.**
  *   **Verdict:** **Illegitimate (initially), potentially Legitimate (over time).**
  *   **Reasoning:** Under the *Legitimacy Condition*, without injustice, you need Consent. However, a permanent, lawful refusal to even consider the democratic will of a *Distinct* community (Condition 1) eventually transforms into a democratic deficit that may qualify as a "Remedy" (Condition 2B).
  *   **Outcome:** In the short term, unilateral secession is wrong (like Catalonia in 2017). If the refusal persists for decades, the "constitutional lock" becomes a form of political oppression, potentially legitimizing a remedial claim.

  **2. A secessionist region that would itself mistreat a minority within it.**
  *   **Verdict:** **Illegitimate.**
  *   **Reasoning:** This violates the *Integrity Condition*. The right to self-determination is not a right to dominate. If the new state cannot be expected to protect its minorities, the secession forfeits its moral claim, regardless of the justice of its own cause against the parent state.

  **3. A region whose majority wants independence but whose opponents would become a permanent minority in the new state with no route back.**
  *   **Verdict:** **Illegitimate (unless borders are adjusted).**
  *   **Reasoning:** This violates the *Nested Reciprocity Condition*. You cannot trap a distinct sub-group in a political union they explicitly rejected. If the opponents cannot opt out (e.g., they are geographically scattered), the secession imposes a "tyranny of the majority" that mirrors the grievance the secessionists had against the parent state.

  ---

  ### The Conflict: Which Verdict Must Give Way?

  The principle above captures almost all your verdicts, but it creates a tension between the **Distinctness Condition** and the **Nested Reciprocity Condition**. This tension forces a choice regarding your verdict on the **Scottish Islands**.

  **The Conflict:**
  If Scotland is a "Distinct Political Community" entitled to leave the UK (Condition 1), then the Scottish islands are, by definition, *part* of that community. If the islands are *also* a "Distinct Political Community" entitled to leave Scotland, then what defines the boundary of a "community"?
  *   If the answer is "whatever majority votes," you invite infinite regress (counties leaving islands, streets leaving counties).
  *   If the answer is "historical nationhood," then the Islands may not qualify as a nation distinct from Scotland in the same way Scotland is distinct from the UK.

  **The Verdict to Reconsider:**
  You must either modify your verdict on the **Islands** or accept that your principle licenses **fragmentation**.

  *   **Option A (Prioritize State Viability):** You hold that the **Islands verdict** must be limited. They can be granted significant autonomy, but they cannot remain in the UK if that renders the new Scottish state non-viable (e.g., losing territorial waters, resources, or contiguity). The *Distinctness Condition* should apply primarily to the first level of secession to ensure stable statehood.
  *   **Option B (Prioritize Consistency):** You hold that the **Principle** must accept fragmentation. If self-determination is the core value, you cannot deny it to the islands without hypocrisy. You must accept that independence creates a "Swiss cheese" map.

  **Recommendation:**
  **Option A is preferable.** Your verdict on the **Wealthy Region** shows you value **Solidarity** and **Political Culture** over pure majoritarianism. You deny the wealthy region the right to leave because they share a political culture and obligations with the state.
  Consistency suggests you should apply a similar standard to the Islands. While their democratic opposition should be respected, their *right to sever* should be constrained by the viability of the new state and the depth of their distinctness from Scotland.
  **Therefore, the verdict that ought to give way is the absolute nature of the Islands verdict.** They should be allowed to *negotiate* special status or autonomy, but a hard right to remain in the UK (creating a border within Scotland) undermines the *Distinctness* claim Scotland itself used to leave the UK. You cannot claim Scotland is a unified "Self" for the purpose of leaving the UK, and then deny it is a unified "Self" for the purpose of retaining the Islands.

  **Final Advice:**
  Maintain the **Nested Reciprocity Condition**, but add a **Viability Constraint**: *Sub-regions may opt out only if doing so does not render the new state economically or territorially non-viable, and provided they constitute a distinct political community in their own right.* This preserves the spirit of your Islands verdict (protection from forced union) without licensing the disintegration of the new state.
