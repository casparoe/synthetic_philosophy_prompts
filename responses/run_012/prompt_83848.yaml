      *   90 mins? Yes (15 setup, 40 game, 35 debrief).
      *   18 students? Yes (4 groups of 4-5).
      *   No devices? Yes (Paper slips).
      *   Single page printable? Yes (Rules + Scorecard).
      *   No theoretical terms in rules? Yes.
      *   Separation of Strength/Tolerance? Yes (via Group Types).
      *   Costly Enforcement? Yes (Monitor pays to fine).

