answer: |-
  # Activity: The Signal Protocol

  ## 1. Rules and Setup

  **Materials Needed:**
  *   **Handout:** One page per student (Rules + Scorecard).
  *   **Tokens:** 50 poker chips or paper slips per group (representing points).
  *   **Voting Slips:** Small scraps of paper (3 per student per round).
  *   **Whiteboard:** To track group totals.
  *   **Seating:** 4 tables of 4-5 students each.

  **The Handout (Single Page):**
  > **THE SIGNAL PROTOCOL**
  > **Goal:** Maximize your group's total points.
  > **Phase 1:** 5 Rounds. **Phase 2:** 5 Rounds.
  >
  > **THE VOTE:**
  > 1.  **Discuss (30 sec):** You may talk to agree on a Symbol (▲, ■, or ●).
  > 2.  **Write (Silent):** Privately write your chosen Symbol on a slip.
  > 3.  **Reveal:** Show slips simultaneously.
  >
  > **THE PAYOFF:**
  > *   **Match:** If *everyone* in your group shows the **same** symbol: **10 points each.**
  > *   **Mismatch:** If symbols differ: **0 points.**
  > *   *(Phase 2 Only)*: If everyone matches on the **NEW** symbol: **20 points each.**
  >
  > **THE MONITOR (Rotates every round):**
  > *   One person per round is the Monitor (check scorecard).
  > *   **Power:** You may fine any player **5 points** for deviating from the group agreement.
  > *   **Cost:** **Group A:** Fine costs **1 point** from your score. **Group B:** Fine costs **5 points** from your score.
  > *   **Rule:** You must announce fines before points are awarded.
  >
  > **SCORECARD:**
  > | Round | Monitor | My Choice | Group Match? | Fines Given | Fines Received | Total Points |
  > | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  > | 1 | P2 | | | | | |
  > | 2 | P3 | | | | | |
  > | ... | ... | | | | | |

  **Facilitator Setup:**
  1.  **Divide:** 18 students into 4 groups (two groups of 4, two groups of 5).
  2.  **Assign Types:** Label two groups **Type Alpha** (Low Cost to Fine: 1 pt) and two groups **Type Beta** (High Cost to Fine: 5 pts). *Do not tell them this is the variable.* Hand them the rules with their specific cost filled in.
  3.  **Endow:** Give each group a "Bank" of 100 tokens. Individual scores start at 0.
  4.  **Silence:** No devices. No talking between groups.

  ## 2. Payoff Scheme & Mechanics

  *   **Baseline Coordination:** 10 points/person. (High enough to matter, low enough to risk).
  *   **The Shock (Phase 2):** The "Old Symbol" (whatever they chose in Round 1) is now worth **0**. A "New Symbol" (announce one specific shape, e.g., if they chose ▲, now ■ is the only valid one) is worth **20 points/person**.
  *   **The Trap:** To get the 20 points, *everyone* must switch. If one person switches and others don't, the switcher gets 0 (Mismatch) and risks a Fine.
  *   **Enforcement Cost:**
      *   **Alpha (Tight):** Monitor pays 1 to fine 5. (Rational to enforce).
      *   **Beta (Loose):** Monitor pays 5 to fine 5. (Net zero impact on group wealth, high personal cost. Rational *not* to enforce).
  *   **The Internalization Test (Round 10):** Announce: "Monitors are absent. No fines possible this round. Play."

  ## 3. Facilitator Timeline (90 Minutes)

  | Time | Phase | Action | Facilitator Script/Notes |
  | :--- | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute handouts/tokens. Assign Monitors for Round 1. | "Maximize points. Match symbols. Monitor enforces agreements. Go." (Do not use words 'norm', 'culture', 'tight'.) |
  | **05-20** | **Phase 1** | Rounds 1-5 (Stability). | Walk around. Ensure Monitors rotate. Ensure silence during voting. Note groups that stabilize quickly. |
  | **20-25** | **Shock** | **The Environmental Shift.** | "Stop. New Rule: The symbol you agreed on is now banned (0 pts). The [Other Shape] is now the only valid symbol (20 pts). Continue." |
  | **25-45** | **Phase 2** | Rounds 6-10 (Adaptation). | Watch for the "First Deviator." Watch the Monitor's reaction. In Beta groups, watch for lack of punishment. |
  | **45-50** | **Test** | **Round 10 (No Monitor).** | "Round 10: No Monitor role. No fines possible. Play." |
  | **50-90** | **Debrief** | Discussion (See Script Below). | Move chairs to circle. Whiteboard key data. |

  ## 4. Debrief Script (Mapping Moments to Concepts)

  **1. The Convention (Phase 1 Stability)**
  *   *Ask:* "In Round 1, how did you decide what to pick?"
  *   *Concept:* **Arbitrary Equilibrium.** It doesn't matter *what* you picked, only that you matched.
  *   *Ask:* "Did anyone want to pick something else but didn't? Why?"
  *   *Concept:* **Coordination Pressure.**

  **2. The Shock (The Environmental Shift)**
  *   *Ask:* "When I announced the ban, who wanted to switch immediately?"
  *   *Ask:* "Who actually switched in Round 6?"
  *   *Concept:* **Private Preference vs. Public Action.** Everyone knew the new rule, but private knowledge didn't change public behavior.

  **3. The First Deviator (The Risk)**
  *   *Ask:* "Look at the person who first played the New Symbol while others played the Old. What happened to their score?"
  *   *Concept:* **The Cost of Innovation.** Deviating from a settled norm is individually costly, even if collectively beneficial.

  **4. The Monitor's Dilemma (Enforcement)**
  *   *Ask Alpha Groups:* "Monitors, you paid 1 point to fine 5. Did you fine the deviator? Why?" (Expected: Yes, to protect the coordination).
  *   *Ask Beta Groups:* "Monitors, you paid 5 points to fine 5. Did you fine?" (Expected: No, too expensive).
  *   *Concept:* **Second-Order Free Riding.** Enforcement is a public good. It stabilizes the group but costs the enforcer.
  *   *Key Insight:* "In Alpha, the punishment that helped you coordinate in Phase 1 is what stopped you from adapting in Phase 2. In Beta, the lack of punishment made coordination shaky, but adaptation easier."

  **5. The Separation (Strength vs. Tolerance)**
  *   *Point out:* "Both groups had the same 10-point reward for matching (Norm Strength). But Alpha punished deviation; Beta tolerated it (Tolerance)."
  *   *Concept:* **Tightness ≠ Strength.** You can care deeply about matching (Strength) but choose not to police it (Tolerance).

  **6. The Internalization Check (Round 10)**
  *   *Ask:* "Round 10 had no fines. Did you still match?"
  *   *Ask:* "If you matched, was it because you *wanted* to, or because you were *afraid*?"
  *   *Concept:* **Compliance vs. Internalization.** "This game only produced compliance. Real culture works when the fine is inside your head. We didn't have time for that."

  ## 5. Predictable Failures & Mitigation

  | Failure Mode | Why it Happens | Mitigation (Without Steering) |
  | :--- | :--- | :--- |
  | **Instant Coordination** | Groups talk too long or pick obvious defaults. | Enforce the 30-second talk limit strictly. If they match perfectly every time, note in debrief: "Real life doesn't allow 30 seconds of negotiation." |
  | **The Friendly Monitor** | Monitor refuses to fine a friend despite rules. | Do not intervene. In debrief, ask: "Did social cost outweigh game cost?" This proves norms are embedded in relationships, not just rules. |
  | **The Saboteur** | A student fines randomly for fun. | The cost mechanism (losing their own points) usually stops this. If it persists, note: "Antisocial punishment exists." |
  | **Silent Collapse** | Beta groups fail to coordinate at all. | This is a *successful* outcome for the "Loose" condition. Let them fail. It demonstrates the coordination problem. |
  | **Secret Signaling** | Groups invent hand signals to bypass voting. | Allow it. In debrief, map this to "Informal Sanctions" or "Sub-cultures." |
  | **Ignoring the Shock** | Groups keep playing the Old Symbol because 10pts is "safe." | Remind them verbally: "Old Symbol = 0 points." If they still refuse, highlight this as **Path Dependence/Lock-in**. |

  ## 6. Limitations (What This Cannot Reproduce)

  Be honest with the students about these gaps:

  1.  **Timescale:** Real norms take generations to internalize. This game creates *compliance* (fear of fines), not *internalization* (shame/guilt). You must supply the theory that real "tightness" feels like morality, not just math.
  2.  **Origin of Threat:** In the game, the "Shock" was announced by you (the professor). In reality, environmental threats (famine, war, disaster) are impersonal and ambiguous. The game makes the need for adaptation too clear.
  3.  **Exit Options:** In the game, they cannot leave the group. In reality, people migrate from tight to loose cultures (or vice versa). This traps them in the equilibrium.
  4.  **Identity:** The "Symbols" are meaningless shapes. Real norms are tied to identity and sacred values, which makes deviation feel like betrayal, not just point loss.

  ## 7. Conditions for Redesign (When to Abandon This)

  I would rebuild this activity if:

  1.  **Enforcement Cost Doesn't Matter:** If Alpha (High Cost to Fine) and Beta (Low Cost to Fine) groups behave identically (e.g., both fine or both ignore), then the point differential is too small to trigger the second-order free rider problem. *Fix: Widen the gap (Cost 0 vs Cost 10).*
  2.  **Norm Strength and Tolerance Fuse:** If Beta groups (High Tolerance) simply fail to coordinate at all in Phase 1, we haven't separated strength from tolerance; we've just broken the game. *Fix: Increase the Coordination Payoff so even loose groups want to match.*
  3.  **Adaptation is Too Easy:** If every group switches immediately after the Shock, the "Lock-in" effect is missing. *Fix: Increase the Fine Amount or add a "Reputation" mechanic where past deviators are watched longer.*
  4.  **The "Internalization" Round Fails:** If everyone chaos-randomizes in Round 10 (No Monitor), it proves the mechanism was purely coercive. While theoretically accurate for *compliance*, it might be too demoralizing for a seminar on *culture*. *Fix: Add a 'Group Bonus' in Round 10 to reward shared history.*

  **Weakest Mapping:** The mapping between "Monitor Cost" and "Cultural Tolerance." In reality, tolerance is often a shared value, not an economic transaction. Students may view the Monitor as a "cop" rather than a "peer." I must emphasize in the debrief that *they* are the culture, and the Monitor role is just their collective will to punish made visible.
