              *   *Actually, the prompt says:* "Strength of a group's norms and its tolerance of deviance should come apart... I want at least one condition where norms are strongly held and enforced but the group is genuinely permissive about harmless variation."
              *   *Interpretation:* The group *feels* the norm is important (high stakes), but the enforcement mechanism allows them to ignore small deviations.
              *   *Mechanism:* The "Convention" is a specific shape/symbol. "Harmless variation" is choosing a *different* symbol that *also* coordinates (e.g., if everyone chooses Square, that's good. If everyone chooses Circle, that's also good. But if half choose Square and half Circle, that's bad).
              *   *No, that's multiple equilibria.*
              *   *Let's simplify:* The "Norm" is "Choose Option X."
              *   *Strength:* How much you lose if you don't match.
              *   *Tolerance:* Whether the Monitor punishes you if you don't match.
              *   *To separate them:* I need a scenario where the payoff for matching is high (Strong Norm), but the Monitor is instructed *not* to punish minor deviations (High Tolerance), vs. a scenario where payoff is high and Monitor *must* punish (Low Tolerance).
