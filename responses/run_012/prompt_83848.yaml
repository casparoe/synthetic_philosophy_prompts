      *   5 Rounds per phase = 5 opportunities.
      *   Group size 4-5.
      *   Everyone gets to be Monitor at least once in Phase 1.
      *   In Phase 2, rotate again.

  7.  **Addressing the "Predictable Failures":**

      *   *Too easy coordination:* They might just talk. *Fix:* No talking during the vote. 30 seconds discussion allowed *before* the vote, then silence.
      *   *Monitor refuses to fine friends:* *Fix:* Remind them points determine "course credit bonus" (even if fake, treat it seriously) or just let it happen and note it in debrief (social cost vs. game cost).
      *   *Quiet invention of enforcement:* (e.g., social shaming). *Fix:* Acknowledge this in debrief as "informal sanctions."
      *   *Defection for entertainment:* *Fix:* Make the payoff gap large enough that it hurts.

  8.  **Developing the Debrief Script:**

      *   Must map moments to concepts.
      *   Moment 1: Establishing the convention (Phase 1). Concept: Coordination Equilibrium.
      *   Moment 2: The Shock (Phase 2 start). Concept: Environmental Change.
      *   Moment 3: The First Deviator. Concept: Innovation/Risk.
      *   Moment 4: The Monitor's Decision. Concept: Sanctioning/Second-order Free Riding.
      *   Moment 5: The No-Monitor Round. Concept: Internalization vs. Compliance.

