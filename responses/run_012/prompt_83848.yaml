      *   *Limitations:* Time scale (generations vs. minutes), Stakes (points vs. survival), Origin of norms (imposed vs. emergent).
      *   *Redesign:* If everyone switches immediately (no path dependence), the punishment cost is too low. If no one switches ever (total lock-in), the payoff for switching isn't high enough.

