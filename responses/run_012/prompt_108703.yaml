answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **ON THE MECHANISMS OF CULTURAL TRANSMISSION**

  **Date:** 24 May 2024
  **Parties:** The Proponent of Replicator Theory (hereinafter 'RP') and The Proponent of Cultural Attraction Theory (hereinafter 'AP').
  **Purpose:** To delineate points of agreement, isolate substantive disagreements from semantic confusion, and pre-register empirical tests intended to resolve the dispute regarding whether cultural change is primarily Darwinian or reconstructive.

  ### 1. AGREED CLAIMS

  The undersigned agree to the following propositions as a baseline for further inquiry. Disagreement on subsequent points does not invalidate these shared commitments.

  1.  **Transmission Requires Causal Linkage:** Cultural transmission occurs only when there is a causal chain connecting the mental state of one individual to the mental state of another via observable behaviour or artefacts. Spontaneous generation of identical ideas without contact is not transmission.
  2.  **Stability Exists:** Certain cultural items (e.g., nursery rhymes, technical recipes, chain letters) exhibit high stability over long periods and many transmission events. Both parties agree this phenomenon requires explanation.
  3.  **Cognitive Constraints:** Human cognitive architecture (memory limits, attentional biases, inferential systems) constrains what can be transmitted. Culture is not independent of human psychology.
  4.  **Differential Persistence:** Some cultural variants persist longer or spread wider than others. Both parties agree this is the phenomenon to be explained, though they disagree on the primary cause.
  5.  **Criteria for Darwinian Evolution:** For a process to be strictly Darwinian, it requires three conditions: (a) variation among individuals; (b) differential fitness (persistence/copying); and (c) heredity (the mechanism of transmission must preserve the traits responsible for the differential fitness).
  6.  **Agreed Instances:**
      *   **RP and AP agree** that chain letters and viral internet memes, where the instruction is explicitly "copy this exactly," approximate the Darwinian model closely.
      *   **RP and AP agree** that simple folk tales often drift towards cognitively natural shapes (e.g., anthropomorphism), suggesting reconstructive processes are at work.
  7.  **Disputed Instances:** The parties disagree on the classification of complex rituals, moral norms, and technical skills. RP classifies these as potentially replicator-driven; AP classifies these as primarily attraction-driven.

  ### 2. PRECISE POINTS OF DIVERGENCE

  The following statements represent the core disagreement. Each is phrased such that the respective proponent accepts it as an accurate description of their position.

  1.  **The Nature of the Link:**
      *   **RP:** Transmission is fundamentally a copying process. While errors occur, the mechanism relies on the preservation of form. The causal link preserves the *structure* of the information.
      *   **AP:** Transmission is fundamentally a reconstructive process. The causal link preserves the *intent* or *gist*, triggering a new generation of the form based on internal cognitive templates.
  2.  **The Source of Stability:**
      *   **RP:** Stability is explained by high-fidelity copying mechanisms. When things stay the same, it is because they were copied accurately.
      *   **AP:** Stability is often an illusion created by convergent transformation. When things stay the same, it is often because different people independently reconstructed the same output from similar inputs.
  3.  **The Scope of Selection:**
      *   **RP:** Differential persistence is sufficient to warrant the label 'selection'. If a variant spreads because it is catchy, that is selection, regardless of whether it was copied perfectly.
      *   **AP:** 'Selection' is a misleading label when applied to reconstruction. If a variant spreads because it matches a cognitive template, that is transformation, not selection. True selection is a rare subset of cultural change.

  ### 3. SEMANTIC VS. SUBSTANTIVE DISAGREEMENT

  The parties acknowledge that a portion of their conflict is terminological, specifically regarding the word **'Selection'**.

  *   **The Semantic Conflict:** RP uses 'selection' to describe any statistical trend in differential persistence. AP reserves 'selection' for cases where variants compete via differential *copying* fidelity.
  *   **The Substantive Conflict:** Beneath the terminology lies a factual dispute about human cognition. If AP is correct, then 'copying' is so low-fidelity in most domains that the Darwinian algorithm (variation, selection, retention) cannot accumulate complex adaptations. If RP is correct, copying fidelity is sufficiently high in key domains to allow cumulative cultural evolution. Resolving the terminology will not solve the problem; measuring fidelity will.

  ### 4. CRUXES AND PRE-REGISTERED PREDICTIONS

  To move beyond theory, the parties identify three cruxes. Settling these empirically would require at least one party to revise their position. For each crux, a concrete test is proposed with divergent predictions.

  #### Crux 1: The Fidelity Threshold
  **Question:** Is copying fidelity high enough to support cumulative evolution in the absence of strong cognitive attractors?
  **Test:** A transmission chain of arbitrary, meaningless symbols (e.g., novel glyphs) that have no prior cognitive 'hook' or meaning.
  *   **RP Prediction:** Chains will maintain specific glyph variations over 10 links if the copying mechanism is engaged. Drift will be random, not directional.
  *   **AP Prediction:** Chains will degrade rapidly or converge on standard geometric shapes (squares, circles) regardless of the starting glyph, because reconstruction will override copying.

  #### Crux 2: The Nature of the Attractor
  **Question:** Is a cognitive attractor a selective pressure acting on variants, or a transformation rule acting on inputs?
  **Test:** Introduce two variants of a story, both equally 'catchy' (high transmissibility), but only one aligns with a known cognitive attractor (e.g., contamination taboo).
  *   **RP Prediction:** Both variants should spread equally well if transmissibility is controlled. The attractor is just one type of selective fitness.
  *   **AP Prediction:** The variant aligning with the attractor will not just spread better; it will actively *transform* the other variant towards it during retelling. The non-aligned variant will not persist even if initially catchy.

  #### Crux 3: Convergence vs. Drift in Narrative Chains (The Proposed Experiment)
  **Question:** In a chain of retelling, does the content diverge (drift/selection) or converge (reconstruction)?
  **Method:** A short made-up story is created containing:
      *   (A) Two memorable-but-odd details (e.g., "the man ate a blue apple").
      *   (B) Two forgettable ordinary details (e.g., "the man wore a hat").
      *   This story is handed to 500 participants in 50 independent chains, ten links deep.
      *   **RP Prediction:** Chains will diverge from one another. The 'odd' details will survive in some chains and vanish in others based on stochastic copying errors or local 'catchiness'. The final outputs will be highly variable across the 50 chains. Survival depends on the specific variant's transmissibility in that specific chain.
      *   **AP Prediction:** Chains will converge. Regardless of the starting chain, the final outputs will look similar to each other. The 'odd' details will be normalised (e.g., "blue apple" becomes "red apple") across almost all chains. The final content is determined by the cognitive template, not the starting variant.

  ### 5. COMMITMENT TO OUTCOMES

  The undersigned agree to abide by the following interpretations of the data resulting from Crux 3 (The Narrative Chain Experiment):

  1.  **If the chains converge** (high similarity between final links of different chains, normalisation of odd details): RP accepts that reconstruction is the dominant force in this domain and that 'selection' was an inappropriate label for the observed stability.
  2.  **If the chains diverge** (low similarity between final links, random loss of details): AP accepts that copying fidelity is sufficient to sustain variant lineages and that differential persistence constitutes a valid form of cultural selection.
  3.  **If the odd details survive intact but differ between chains:** This supports RP (copying with drift).
  4.  **If the odd details are changed to the same specific detail across chains:** This supports AP (transformation towards attractor).

  **Signed,**

  _________________________
  (Proponent of Replicator Theory)

  _________________________
  (Proponent of Cultural Attraction Theory)

  _________________________
  (Witness/Moderator)
