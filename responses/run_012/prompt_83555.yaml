answer: |-
  You have put your finger on the exact nerve of the problem. Your intuition is correct: the Principle of Indifference, as you have encountered it, is not a single principle but a schema that yields contradictions when applied to continuous variables without further qualification. The fact that you can derive three different answers for Bertrand's chord, or two for the cube factory, is not a mathematical error in your derivations; it is a logical error in the question itself. The question "What is the probability?" is incomplete. It should be "What is the probability, given this specific physical process of generation?"

  You asked for a definite position on the two repairs: Maximum Entropy (MaxEnt) versus Symmetry/Invariance. I will not hedge. **You should adopt the Symmetry/Invariance approach as the foundation, and you should reject Maximum Entropy as a repair for the Principle of Indifference in continuous cases.**

  Here is the argument, worked through your specific examples.

  ### Why Maximum Entropy Fails

  The proposal to use Maximum Entropy sounds rigorous because it uses a formula. However, in continuous cases (like chords or cube sides), it hides the very arbitrariness it claims to solve.

  To maximize entropy in a continuous space, you cannot simply maximize $-\int p(x) \ln p(x) dx$. That quantity, called differential entropy, is not invariant under a change of variables. If you calculate the entropy of the side length $s$, you get one result. If you calculate the entropy of the volume $V = s^3$, you get a different result, because the $dx$ in the integral changes to $dV$.

  Mathematically, to define entropy properly in continuous spaces, you need a reference measure, $m(x)$. You maximize $-\int p(x) \ln \frac{p(x)}{m(x)} dx$. But where does $m(x)$ come from? It represents your "background ignorance" before you apply constraints. If you choose $m(s) = 1$ (uniform side length), MaxEnt gives you the 1/2 answer for the cube. If you choose $m(V) = 1$ (uniform volume), MaxEnt gives you the 1/8 answer.

  MaxEnt does not solve the Principle of Indifference; it **presupposes** it. It tells you how to update your probabilities given new data (like the die with mean 4.5), but it cannot tell you what the prior distribution $m(x)$ should be. In the cube factory, using MaxEnt forces you to choose between indifference over length or indifference over volume. It offers no logical machinery to prefer one over the other. It merely dresses the original arbitrariness in the clothing of information theory.

  Furthermore, consider your die example. If you know the mean is 4.5, MaxEnt works beautifully to give you a specific distribution. But that is because the state space (faces 1 through 6) is discrete and countable. There is no ambiguity about "how to count" the faces. In continuous cases, there is ambiguity about "how to measure" the space. MaxEnt works for inference, but it fails as a foundation for ignorance.

  ### Why Symmetry Succeeds

  The Symmetry approach (often associated with E.T. Jaynes) does not try to maximize a quantity; it tries to match the mathematics to the physical reality of the problem. It asks: "What operations can I perform on this system that leave the problem statement unchanged?"

  Let's apply this to **Bertrand's Chord**.
  The three standard answers correspond to three different physical experiments:
  1.  **1/3 (Endpoints):** You fix the circle, then pick two points on the edge. This process is rotationally invariant, but it treats the circle's boundary as special.
  2.  **1/4 (Midpoints):** You pick a point inside the circle. This treats the center as special.
  3.  **1/2 (Radius/Distance):** You imagine throwing long straight lines (straws) onto a table from a great height, and looking at where they intersect the circle.

  Jaynes argued that if the problem is stated simply as "draw a chord at random," without specifying a mechanism, we should look for the solution that is invariant under the widest group of transformations that the problem description allows. The description mentions a circle, but it does not specify the circle's position or orientation in the plane. Therefore, the probability distribution should not change if we rotate the plane or translate the circle to a different spot.

  If you demand **translation and rotation invariance** for the lines themselves (not just the circle), there is only one mathematical measure that satisfies this. It corresponds to the "straw throwing" experiment. In this setup, the distance of the chord from the center is uniformly distributed. This yields the **1/2** answer.

  Does this smuggle in an assumption? Yes, it assumes the problem is translation-invariant. But this is a physical assumption, not a mathematical trick. It forces you to admit that "random chord" is ambiguous. If you meant "pick two points," you are describing a process that is *not* translation invariant (because the points are tied to the circle's circumference). If you meant "throw a line," you are describing a process that *is* translation invariant.

  Symmetry resolves the paradox not by finding the "true" probability, but by forcing you to specify the **physical generation process**. It reveals that the original question was ill-posed.

  ### The Cube Factory Test

  This is where the difference becomes stark.
  In the cube factory, the side length is bounded: $0 \le s \le 2$.
  *   **MaxEnt:** As shown above, gives different answers depending on whether you maximize over $s$ or $s^3$. It pretends to give an answer, but the answer depends on a hidden choice of variable.
  *   **Symmetry:** What symmetries exist here? There is no translation invariance (the range is fixed at 0 to 2). There is no scale invariance (there is a maximum size). The only symmetry might be permutation of dimensions (length, width, height are all "sides"), but that doesn't help determine the distribution of the size itself.

  The Symmetry approach correctly tells you: **"I cannot solve this."** It admits that there is insufficient information to define a unique distribution. This is the correct epistemic stance. The factory owner's method of manufacturing matters. If they cut cubes from a rod, the distribution might be uniform in length. If they pour molten material into molds of varying volume, it might be uniform in volume.

  MaxEnt gives you a false sense of precision. Symmetry gives you an honest admission of ignorance. A method that tells you when it *cannot* give an answer is superior to a method that gives you contradictory answers confidently.

  ### The Relation Between the Two

  You asked if MaxEnt is just invariance in disguise. In discrete cases with clear symmetries (like a fair die), they coincide. The uniform distribution maximizes entropy *and* is invariant under permutation of faces.

  But in continuous cases, they diverge. MaxEnt requires a measure to define entropy; Symmetry *derives* the measure from the transformation group. Therefore, Symmetry is more fundamental. You can use Symmetry to find the background measure $m(x)$, and *then* use MaxEnt to update that measure with new data. But you cannot use MaxEnt to find $m(x)$ without begging the question.

  ### My Definite Position

  Here is the stance I urge you to take in your reading group:

  **Abandon the Principle of Indifference as a logical principle.** It is not true that "if we have no reason to prefer X, we must assign equal probability." In continuous spaces, "equal probability" is undefined without a measure.

  **Adopt the Principle of Invariance as a physical principle.** Probability is not about states of mind; it is about models of physical processes.
  1.  **MaxEnt is worse** because it conceals the need for a background measure. It allows you to plug numbers into a formula and get a result, but that result is arbitrary because the input (the variable choice) was arbitrary. It fails the cube factory and fails to resolve Bertrand's paradox without smuggling in the answer.
  2.  **Symmetry is better** because it links the mathematics to the physical setup. It resolves Bertrand's paradox by showing that the "1/2" answer is the only one consistent with a translation-invariant line-throwing process. It handles the cube factory by correctly identifying that the problem is underspecified.

  The arbitrariness is not "relocated" into the choice of group; it is **exposed**. The choice of group corresponds to a choice of physical experiment. If you choose the group of rotations only, you are describing an experiment where the circle's center is fixed. If you choose the group of Euclidean motions (rotation + translation), you are describing an experiment where the circle is a target for lines defined independently of it.

  This is not a bug; it is a feature. It teaches you that probability questions without physical context are meaningless.

  ### Conclusion

  Do not try to save the Principle of Indifference. It is broken. Replace it with this rule: **Never assign a probability distribution without specifying the transformation group that leaves the generating process invariant.**

  For Bertrand's chord, this means acknowledging that there is no single answer. There is an answer for "random endpoints," an answer for "random midpoints," and an answer for "random lines." The Symmetry approach privileges "random lines" (1/2) only if you assume the problem implies no special position for the circle in the plane.

  For the cube factory, it means admitting you cannot calculate the probability without knowing how the factory makes the cubes.

  This might feel unsatisfying because it denies you a unique number. But mathematics should not give you unique numbers for vague questions. The Symmetry repair is superior because it respects the precision of mathematics: it refuses to output a specific value when the input is ambiguous. MaxEnt tries to be a oracle; Symmetry acts like a rigorous scientist. Be the scientist.
