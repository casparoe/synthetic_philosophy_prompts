prompt: |-
  I'm a backend engineer and somehow I ended up on the board of our county history museum (long story, I got roped in because I maintain the website). Next Thursday the board votes on whether to host a traveling exhibit that a local family is offering to pay for. It's about a supposed advanced civilization that existed before the last ice age and then got wiped out, and it leans hard on the idea that mainstream archaeologists have "sat on" the evidence against it. The curator isn't an obvious crank -- he talks like a researcher, and he's got a list of maybe eight people with real degrees who back him up. His pitch is that he isn't asking us to endorse anything: he just wants the exhibit shown as one "hypothesis" among others, and he wants to display it with what he calls a "confidence continuum" -- every claim, mainstream or fringe, gets a 0-to-100 confidence score on one big chart, so visitors can "weigh the evidence themselves."

  Two board members are into this and keep saying the museum shouldn't be in the business of picking winners. I don't have a good comeback and honestly I'm not sure they're wrong.

  The complication: a chunk of the exhibit is actually solid. There's a genuinly good section on how carbon dating and ice cores work, and it's the only part that's about our actual county. So a flat no throws away something real. And the family funding it has donated before and might walk if we reject it.

  I need to draft the memo I'll circulate before the vote. Give me a clear recommendation with a concrete plan and a date -- not just "more study." And I want criteria the board can actually apply to the next weird exhibit that comes along, not just this one. Please take the neutrality argument seriously enough that my colleagues will feel heard, since I'll be reading this out loud to them.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Situation:**
      *   **User:** Backend engineer, new to the museum board, maintains the website. Pragmatic, logical, likely values evidence and system integrity.
      *   **Context:** County history museum board vote next Thursday.
      *   **Issue:** A traveling exhibit about a "pre-ice age advanced civilization" (pseudoscience/alternative archaeology).
      *   **Proponent:** Local family funding it, a curator who sounds reasonable (has degrees, uses "confidence continuum" pitch).
      *   **Internal Conflict:** Two board members argue for neutrality ("not picking winners"). User is skeptical but acknowledges some good content (carbon dating, local county history) and the funding risk.
      *   **Goal:** A memo to circulate before the vote. Needs a clear recommendation, a concrete plan (not "study more"), a date, and future criteria. Must address the neutrality argument respectfully.

  2.  **Deconstruct the "Neutrality" Argument:**
      *   *Argument:* Museums shouldn't pick winners; let visitors decide; show all hypotheses.
      *   *Counter-argument:* Museums are *defined* by curation. Curation *is* picking winners based on evidence. False equivalence undermines trust. A "confidence continuum" implies scientific consensus is just a matter of opinion/vote, which is epistemologically wrong.
      *   *Tone:* Needs to be respectful, not condescending. Acknowledge the value of open inquiry but distinguish it from presenting debunked claims as valid alternatives.

  3.  **Evaluate the Exhibit:**
      *   *Bad:* The core premise (pre-ice age advanced civilization wiped out) is pseudoscience (Atlantis-style). Mainstream archaeology rejects this.
      *   *Good:* Educational section on dating methods (carbon dating, ice cores) and local county history.
      *   *Risk:* Donor withdrawal, board friction.
      *   *Opportunity:* Salvage the good parts, reject the bad.

  4.  **Develop the Recommendation:**
      *   *Option A (Accept as is):* Risks reputation, spreads misinformation, violates museum ethics (AAM guidelines).
      *   *Option B (Flat Rejection):* Loses good content, alienates donor, creates conflict.
      *   *Option C (Conditional Acceptance/Modification):* **Winner.** Accept the educational/local components, reject the pseudoscience core. Negotiate with the curator/donor.
      *   *Concrete Plan:* Form a small committee (User + Curator + Skeptical Board Member) to review specific panels. Set a deadline for revisions.
      *   *Future Criteria:* Establish an Exhibit Review Policy based on evidence standards, not just "neutrality."

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Subject:** Clear and actionable.
      *   **Opening:** Acknowledge the complexity. Validate the "neutrality" concern (it comes from a good place).
      *   **The Core Issue:** Define the museum's role. We aren't a marketplace of ideas; we are a steward of truth/history. Address the "confidence continuum" specifically (it's a false equivalence).
      *   **The Recommendation:** Don't just say "No." Say "Yes, but..." (Modify).
      *   **The Plan:**
          *   Step 1: Review specific panels.
          *   Step 2: Separate the science/local history from the speculative civilization claims.
          *   Step 3: Deadline for decision.
      *   **Future Policy:** Create an "Exhibit Vetting Framework."
      *   **Closing:** Reiterate mission.

  6.  **Refining the Tone:**
      *   *Engineer to Board:* Logical, structured, but empathetic.
      *   *Addressing the "Neutrality" Colleagues:* Use phrases like "I understand the impulse," "Intellectual honesty requires," "Neutrality on matters of fact is not neutrality."
      *   *Addressing the Donor/Curator:* Respectful but firm on standards.

  7.  **Specific Content Checks:**
      *   *Date:* Vote is next Thursday. Memo needs to be read before then. Let's set a review deadline *before* the vote or condition the vote on the review. Actually, the prompt asks for a recommendation *for* the vote. So the memo is the pre-read. The plan needs to happen *if* we vote to proceed conditionally.
      *   *Wait, better approach:* Recommend a **Conditional Approval**. Vote "Yes" *provided* specific changes are made by a certain date. If changes aren't met, the contract is void.
      *   *Criteria:* Need something usable for the next "weird exhibit." Focus on *consensus*, *peer review*, and *local relevance*.

  8.  **Self-Correction/Iterative Polish:**
      *   *Critique:* Is "Conditional Approval" too messy?
      *   *Fix:* Make it a "Pilot & Revision" phase. Or better, recommend accepting the *educational modules* but rejecting the *narrative framework*.
      *   *Actually, the strongest stance:* Recommend **rejecting the narrative but inviting a partnership on the educational components.** This saves the donor relationship (they want to support education) without compromising integrity.
      *   *Wait, the prompt asks for a "clear recommendation with a concrete plan and a date."*
      *   *Decision:* Recommend **Conditional Acceptance**. We host it *only if* the "confidence continuum" is removed and the pseudoscience is contextualized as "folklore/myth" rather than "competing hypothesis."
      *   *Wait, is that too confrontational?* Let's look at the "Neutrality" argument again. If I tell them "Neutrality is wrong," they might dig in. I need to frame it as "Neutrality requires context." If we present a 1% theory as equal to a 99% theory, we are being *dishonest*, not neutral.
      *   *Revised Plan:* Vote to **Accept in Principle**, contingent on a 30-day revision period to align with AAM (American Alliance of Museums) standards.
      *   *Date:* Vote is Thursday. Let's set the revision deadline for 30 days post-vote, but the vote happens Thursday.
      *   *Wait, the prompt says "Next Thursday the board votes."* I need to influence *that* vote. So the memo goes out *now* (before Thursday).
      *   *Recommendation:* Vote **YES, with Conditions**.
      *   *Conditions:* 1. Remove "Confidence Continuum" (it misrepresents scientific method). 2. Clearly label the civilization claims as "Alternative Theories" vs "Archaeological Consensus." 3. Isolate the Carbon Dating section as standalone education.
      *   *Deadline:* Revisions due 3 weeks from vote.
      *   *Future Criteria:* "Evidence Review Matrix."

  9.  **Final Polish:** Check the voice. It should sound like a thoughtful board member, not a lecturer. Use "we," not "you." Acknowledge the donor's generosity.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm attacking the two board members. I need to validate their desire for open-mindedness while showing why this specific mechanism (confidence continuum) fails that goal.

      *Key argument:* True neutrality isn't giving equal weight to unequal evidence. It's being transparent about the weight of evidence.

      *Plan:*
      1. Vote to Accept *Contingent on Revision*.
      2. Form a 3-person subcommittee (Me, Pro-exhibit member, Curator) to finalize text.
      3. Deadline: 3 weeks.
      4. Policy: Adopt an "Exhibit Integrity Standard."

      Let's write it.

  10. **Final Review against constraints:**
      *   Clear recommendation? Yes (Conditional Acceptance).
      *   Concrete plan? Yes (Subcommittee, revisions).
      *   Date? Yes (3 weeks post-vote).
      *   Criteria for future? Yes (Exhibit Integrity Standard).
      *   Tone? Respectful of neutrality argument.

      *Wait, one nuance:* The user is a backend engineer. The memo should reflect that structured thinking without being overly technical. Use analogies if helpful (data integrity, etc.), but keep it accessible.

      *Let's refine the "Neutrality" rebuttal:* "Neutrality is not the absence of judgment; it is the absence of bias. Judging evidence *is* our job."

      *Okay, ready to draft.*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, County History Museum
  **FROM:** [Your Name], Board Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation Regarding "Pre-Ice Age Civilization" Traveling Exhibit

  **Executive Summary**

  Next Thursday, we vote on whether to host the proposed traveling exhibit regarding pre-Ice Age civilizations. After reviewing the materials and discussing the implications with staff and colleagues, I recommend a **Conditional Approval**.

  We should accept the exhibit *only* if specific structural changes are made to how the scientific claims are presented. This allows us to secure the funding and the genuine educational content (carbon dating methods and local county history) without compromising the museum's integrity or misrepresenting the scientific method.

  **The Neutrality Argument**

  Two of my colleagues have argued that the museum should not be in the business of "picking winners." They suggest that presenting the "confidence continuum"—where mainstream archaeology and fringe theories are scored side-by-side—allows visitors to weigh the evidence themselves.

  I want to take this argument seriously, because it comes from a good place. We want to be open-minded. We want to avoid censorship. However, there is a critical distinction between *neutrality* and *false equivalence*.

  *   **Neutrality** means we do not bias the presentation based on politics, popularity, or donor pressure.
  *   **False Equivalence** means we present a 99% consensus and a 1% outlier as equally valid "options."

  If a museum displays a flat earth map next to a globe and asks visitors to "decide," we are not being neutral. We are failing to provide the context necessary for an informed decision. Our visitors trust us to curate based on evidence, not just volume of claims. The "confidence continuum" suggests that scientific consensus is a matter of opinion, rather than the result of peer review and reproducible data. Adopting that framework would undermine the very educational section on carbon dating that makes this exhibit valuable.

  **Recommendation: Conditional Approval**

  I move that we vote to **accept the exhibit contingent on a 3-week revision period.**

  We acknowledge the generosity of the funding family and the quality of the technical sections on dating methods. However, we cannot host the exhibit under the current "confidence continuum" framework.

  **Concrete Plan & Timeline**

  1.  **Vote (Next Thursday):** We vote to approve the exhibit *subject to modification*.
  2.  **Subcommittee Formation (Immediately following vote):** A three-person team will be formed to work with the traveling curator. This team should include:
      *   One board member supportive of the exhibit (to ensure donor relations remain strong).
      *   One board member skeptical of the claims (myself).
      *   The Museum Curator (to ensure educational standards).
  3.  **Required Revisions:**
      *   **Remove the "Confidence Continuum":** Replace this with a "State of Evidence" label. Mainstream consensus is clearly distinguished from alternative hypotheses.
      *   **Contextualize Claims:** The pre-Ice Age civilization narrative must be framed as "Alternative Theory" or "Folklore," distinct from the "Archaeological Record."
      *   **Preserve Educational Modules:** The sections on carbon dating, ice cores, and local county history remain untouched, as they are factually sound and high-value.
  4.  **Deadline:** Revisions must be submitted for final board review by **[Date 3 Weeks Post-Vote]**. If the curator cannot agree to these framing changes, the contract is voided without penalty to the donor.

  **Future Criteria: The Exhibit Integrity Standard**

  To avoid this debate recurring with the next unusual proposal, I propose we adopt the following **Exhibit Integrity Standard** for all future traveling or temporary exhibits. An exhibit must meet at least two of the three criteria to be fast-tracked; if it meets only one, it requires the subcommittee review process outlined above.

  1.  **Peer-Review Consensus:** Are the core historical/scientific claims supported by a majority of relevant accredited institutions (universities, museums, research bodies)?
  2.  **Local Relevance:** Does the exhibit contain significant artifacts or data specific to our county's history? (This exhibit passes here).
  3.  **Educational Transparency:** Does the exhibit clearly distinguish between *evidence* (artifacts, data) and *interpretation* (theories, stories)?

  **Conclusion**

  We can honor the donor's generosity without honoring misinformation. By separating the solid educational content from the speculative narrative, we protect the museum's reputation while still delivering a compelling experience to our visitors.

  I look forward to discussing this on Thursday.

  [Your Name]
  Board Member
