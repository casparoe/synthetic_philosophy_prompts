answer: |-
  Your struggle lies at the fault line between **Revealed Preference Theory** (which equates choice with preference) and **Behavioral/Philosophical Critique** (which distinguishes choice from underlying values based on reasoning, context, and stability). Your tentative principle is strong, but it requires sharpening to handle the distinction between *states* (hunger, mood), *beliefs* (probabilities, labels), and *preferences* (values, tastes).

  Here is a precise formulation of a principle that refines your intuition, followed by its application to your cases, new cases, and the specific dilemma of promise-keeping.

  ### The Principle of Endorsed Invariance

  > **A choice reveals a stable preference if and only if:**
  > 1.  **Invariance:** The choice persists across variations in the choice situation that the agent, upon reflection, deems *normatively irrelevant* to the value of the outcomes (e.g., labels, framing, arbitrary timing); **and**
  > 2.  **Endorsement:** The agent identifies the reason for the choice as a *value* she wishes to act on, rather than a *cause* (impulse, error, or transient state) she wishes she could overcome.

  This principle distinguishes between what *moves* you (causes) and what *justifies* your move to yourself (reasons).

  ---

  ### Verdicts on Your Cases

  Here is how the Principle of Endorsed Invariance evaluates your six scenarios. In two cases, it forces you to revise your verdict.

  **1. Tea (Monday) vs. Coffee (Tuesday)**
  *   **Your Verdict:** Preference Change.
  *   **Principle's Verdict:** **State Dependence (Revise).**
  *   **Reasoning:** Unless the agent cites a reason like "I value variety" or "Mondays require tea," the day of the week is normatively irrelevant to the intrinsic value of the beverage. If she says, "I just felt like coffee today," she is citing a transient state (thirst, mood), not a changed preference. A preference is a stable disposition; a state is a temporary condition. You should classify this as a constant preference operating under different internal states, not a change in preference.

  **2. The Lottery Ticket**
  *   **Your Verdict:** Preference over lotteries (not belief in winning).
  *   **Principle's Verdict:** **Agree (with caveat).**
  *   **Reasoning:** If the agent knows the odds are negligible but buys the ticket for the "thrill of possibility," she endorses the gamble as the object of value. This is a preference for *entertainment/hope*. However, if she buys it because she miscalculates the odds (believing she has a real chance), that is a belief error, not a preference. The principle demands we ask: "If you knew for certain you would lose, would you still pay for the ticket?" If yes, it is a preference.

  **3. The 'Best Seller' Jam**
  *   **Your Verdict:** Menu Effect (not preference between jams).
  *   **Principle's Verdict:** **Agree.**
  *   **Reasoning:** The label "Best Seller" is normatively irrelevant to the taste of the jam. If the shopper admits, "I would have chosen the other if the labels were swapped," she fails the **Invariance** condition. She does not endorse the label as a reason; she acknowledges it as a cause. This is a framing effect, not a preference.

  **4. Paying to Hide Cigarettes**
  *   **Your Verdict:** Genuine Second-Order Preference.
  *   **Principle's Verdict:** **Agree.**
  *   **Reasoning:** The agent explicitly endorses the restriction. She identifies the impulse to smoke as a *cause* she rejects and the restriction as a *reason* she values. This satisfies the **Endorsement** condition. It reveals a preference for a future self who does not smoke over a present self who does.

  **5. Intransitive Cycle (A>B>C>A)**
  *   **Your Verdict:** Inconsistency (no single utility function).
  *   **Principle's Verdict:** **Agree.**
  *   **Reasoning:** The agent cannot endorse A>B, B>C, and C>A simultaneously without violating logic. Since she cannot reflectively endorse the cycle as a coherent value system, at least one choice must be explained away as an error or context-driven slip.

  **6. Time Inconsistency (Small/Now vs. Large/Later)**
  *   **Your Verdict:** Genuine Preference Change.
  *   **Principle's Verdict:** **Dynamic Inconsistency (Revise).**
  *   **Reasoning:** This is the critical collision. Standard theory models this as one preference function (hyperbolic discounting) that is time-inconsistent. To call it a "preference change," the agent must not regret the earlier choice when she arrives at the later date.
      *   If, at the later date, she says, "I was weak then; I'm glad I waited," she is expressing a **single stable preference** that was temporarily overridden by impulse.
      *   If she says, "My needs were genuinely different then; I stand by both choices," only then is it a preference change.
      *   **Correction:** Most agents *regret* the immediate gratification later. Therefore, the principle forces you to classify this as **Inconsistency** (a failure to act on stable preferences) rather than **Preference Change**, unless the agent explicitly identifies the shift in time horizon as a change in values.

  ---

  ### Verdicts on New Cases

  Here are three cases your principle has not yet encountered, resolved by Endorsed Invariance.

  **Case A: The Anchored Bid**
  *   *Scenario:* An auctioneer shows bidders a random high number before bidding starts. Bidders who see the high number bid significantly more for the same item than those who see a low number.
  *   *Verdict:* **Contextual Cause, Not Preference.**
  *   *Reasoning:* The random number is normatively irrelevant to the item's value. Bidders do not endorse the number as a reason ("I value this more because I saw a 500"). It is a cognitive bias. The choice reveals susceptibility to anchoring, not a higher valuation of the object.

  **Case B: The Altruistic Voter**
  *   *Scenario:* A person votes in a national election despite knowing the statistical probability of their vote deciding the outcome is effectively zero. They say, "It's my duty."
  *   *Verdict:* **Preference for Expression/Duty.**
  *   *Reasoning:* The causal impact (winning the election) is not the reason. The agent endorses the act of voting itself as valuable (civic duty, expression of identity). This satisfies **Endorsement**. It reveals a preference for *participation* over *instrumental efficacy*.

  **Case C: The Coat and the Weather**
  *   *Scenario:* A man wears a heavy coat in January and shorts in July.
  *   *Verdict:** **State Dependence, Not Preference Change.**
  *   *Reasoning:* The external temperature changes the *intrinsic properties* of the outcome (being cold vs. being comfortable). He does not value "coats" more in January; he values "comfort" always. The choice reveals a stable preference for comfort applied to changing physical constraints.

  ---

  ### The Case of the Promise-Keeper

  **Scenario:** A person chooses an option she believes is *instrumentally worse* for her (e.g., losing money, suffering inconvenience) because she wants to be the sort of person who keeps her word.

  **Analysis under Endorsed Invariance:**
  1.  **Is the choice robust?** Yes. She would keep the promise even if the "worse" outcome became slightly more costly, up to a point.
  2.  **Is it endorsed?** Yes. She explicitly cites "keeping my word" as the reason, overriding the instrumental calculation.

  **The Verdict:**
  This reveals a **Constitutive Preference**.
  Standard utility theory often struggles here because it treats "outcomes" as material states (money, health). However, for this agent, the outcome is not just "Loss of $100"; it is "Loss of $100 + Maintenance of Integrity."
  *   **Does she choose the "worse" option?** No. She chooses the option that is better *all-things-considered*.
  *   **What does this say about her?** It says her utility function includes **identity properties**. She prefers "Being a Promise-Keeper" to "Maximizing Material Gain."
  *   **Is this irrational?** No. Under the Principle of Endorsed Invariance, this is the highest form of rationality: aligning action with reflectively endorsed values, even when those values conflict with narrow instrumental self-interest.

  ### Summary of Required Revisions

  To maintain consistency with the **Principle of Endorsed Invariance**, you must relinquish two of your original verdicts:

  1.  **Tea/Coffee:** Stop calling this a "preference change." Call it **state-dependent utility**. Your preference for satisfaction is stable; your state of thirst varies.
  2.  **Time Inconsistency:** Stop calling this a "genuine change in what she wants." Call it **dynamic inconsistency**. Unless she refuses to regret the impulsive choice later, it is a failure of her stable preference for long-term welfare to govern her immediate action.

  Your intuition about the Jam, the Cigarettes, and the Lottery is correct. Your intuition about Time and Taste needs to shift from "Change" to "Context and State."
