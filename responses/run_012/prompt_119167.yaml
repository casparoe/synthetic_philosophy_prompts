answer: |-
  This is a sophisticated hybrid position: it retains a **Control Principle for the metaphysics of responsibility** (Part 1) but adopts an **Epistemic Consequentialism for the practice of blame** (Part 2). By treating outcome-sensitivity as rational Bayesian updating rather than metaphysical luck, you attempt to dissolve the tension between our intuitions and the Control Principle.

  However, this architecture creates specific structural vulnerabilities. The view stands or falls on the strength of the *epistemic link* between outcome and will. If that link is severed, the justification for differential blame collapses, leaving you with an error theory that may be too costly to maintain.

  Here is the map of your view's exposure, ranked from fatal to merely awkward, followed by an analysis of your four pressure points and the question of falsifiability.

  ---

  ### I. Ranking the Defeaters

  **1. Fatal: The "Pure Luck" Stipulation (Paired Cases)**
  If you can construct a case where the outcome is stipulated to carry *zero* evidential weight regarding the quality of will, yet our blame practices diverge, your Part 2 justification fails. You are left claiming that widespread moral practice is irrational (error theory). If the error is systematic and robust, the view collapses into the rival claim: that outcomes *constitutively* affect responsibility, not just evidentially.

  **2. Severe: The Regress of the Will (Constitutive Luck)**
  If the "quality of will" itself is the product of unchosen circumstances (upbringing, genetics, epistemic environment), Part 1's anchor dissolves. You can maintain that responsibility is *attributability*, but if the attributes are lucky, the Control Principle becomes a norm about *which* lucky traits we choose to police, rather than a constraint on responsibility itself. This doesn't kill the view, but it drains "responsibility" of its retributive force, pushing you toward a purely forward-looking system.

  **3. Moderate: Doctrinal Mismatch (Institutional Application)**
  Actual legal doctrine does not bifurcate as neatly as your view suggests. Criminal law *does* punish outcomes (homicide vs. attempted murder), not just culpability. If your view is prescriptive, it must argue that centuries of legal evolution are mistaken. If it is descriptive, it is falsified by the statute books. This forces you into a reformist corner that requires heavy lifting to justify why the law should ignore harm in sentencing.

  **4. Awkward: The Phenomenology of Regret (First-Person)**
  Distinguishing "moral blame" from "agent-regret" is conceptually clean but phenomenologically messy. If the regret involves a sense of debt or need for repair, it functions like blame. If you insist it isn't moral, you risk defining "moral" too narrowly to save the theory. This is an explanatory cost, not a refutation.

  ---

  ### II. Analysis of the Four Pressure Points

  #### 1. The Paired Cases (The Evidential Gap)
  *The Challenge:* You stipulate two agents, identical wills, identical epistemic positions. One kills a child; one does not. The outcome is purely luck. By your own definition, the outcome carries no information about the will. Yet, we blame the killer more.
  *The Exposure:* Your Part 2 defense (blame = updating on evidence) has no purchase here. There is no new evidence to update on.
  *Defender's Concession:* You must concede that in *these specific stipulated cases*, our reactive attitudes are irrational. You are committed to a localized error theory.
  *Defender's Dismissal (Question-Begging):* To avoid this, you might argue that outcomes *always* provide evidence (e.g., the severity of the harm reveals the objective magnitude of the risk taken, even if subjective risk was identical).
  *Critique:* This is question-begging. If we hold subjective risk and choice constant, appealing to "objective risk" smuggles in a non-volitional element. If you rely on this, you are silently abandoning the Control Principle for Part 1.
  *Verdict:* If you cannot explain why we blame differently in *pure* luck cases without calling it irrational, you haven't solved moral luck; you've just labeled it "irrational practice."

  #### 2. Luck Through the Will (The Anchor Drags)
  *The Challenge:* Ignorance excuses. But ignorance is often circumstantial (e.g., never taught that a substance is toxic). If the content of the will is fixed by luck, then the "moment of choice" is not a fresh origin point.
  *The Exposure:* Part 1 claims responsibility is fixed at the choice. But if the choice is determined by a will shaped by luck, the Control Principle is violated at the source.
  *Defender's Concession:* You must concede that no one is *ultimately* responsible in a desert-entailing sense. Responsibility is merely "attributability within a social practice."
  *Defender's Dismissal:* You might claim that *current* quality of will is what matters, regardless of its etiology.
  *Critique:* This works for forward-looking blame (modification of behavior) but fails for backward-looking blame (retribution). If the view is meant to justify retributive attitudes, this pressure point is fatal. If it is merely about social regulation, it survives but loses moral weight.

  #### 3. The First-Person Case (Agent-Regret)
  *The Challenge:* The unlucky agent feels a specific regret ("I killed someone") that the lucky agent does not. Is this moral self-assessment?
  *The Exposure:* If it is moral self-assessment, then the agent assesses herself as *more* blameworthy due to outcome, contradicting Part 1. If it is non-moral, why does it demand moral repair (apologies, compensation)?
  *Defender's Concession:* You must distinguish *Culpability* (fixed by will) from *Liability* (influenced by outcome). The agent is not more *culpable*, but she is more *liable* to make amends because she is the causal source of the harm.
  *Defender's Dismissal:* Claiming agent-regret is merely "emotional residue" with no normative force.
  *Critique:* Dismissing the normative force of agent-regret is counter-intuitive. The unlucky agent *ought* to apologize; the lucky one does not. This "ought" looks moral.
  *Verdict:* This pressure point forces you to expand your definition of responsibility to include "causal liability" alongside "quality of will." This complicates Part 1 but saves the phenomenon.

  #### 4. The Institutional Application (Bifurcation)
  *The Challenge:* Criminal law (culpability) vs. Civil law (harm). Does this match your view?
  *The Exposure:* Criminal law *does* care about outcomes (sentencing enhancements for death vs. attempt). Your view suggests it *shouldn't*.
  *Defender's Concession:* You must admit your view is revisionist regarding criminal law. It argues that attempted murder and murder should be punished equally *if* the will is identical.
  *Defender's Dismissal:* Arguing that current sentencing disparities are purely for deterrence (consequentialist) and not retributive, thus compatible with your view.
  *Critique:* Jurors and judges often express retributive reasons for harsher sentencing on completed crimes ("more harm was done"). If the institution reflects retributive intuitions, your view condemns the institution.
  *Verdict:* This is a pragmatic vulnerability. It makes your view a hard sell for legal reform, as it conflicts with the deep-seated intuition that harm matters for justice, not just evidence.

  ---

  ### III. Concessions vs. Question-Begging

  To maintain intellectual honesty, a committed defender of this view must draw the line as follows:

  **What must be Conceded:**
  1.  **Irrationality in Pure Cases:** In cases where evidence is *explicitly* held constant (philosophical stipulation), differential blame is irrational. You cannot claim it is rational updating if there is no data to update on.
  2.  **No Ultimate Desert:** You cannot claim agents "deserve" their quality of will. Responsibility is a social status, not a metaphysical fact about the soul.
  3.  **Revisionism:** You must accept that current legal and social practices are often mistaken when they punish outcomes retributively rather than instrumentally.

  **What can be Dismissed as Question-Begging:**
  1.  **"Outcomes Change the Act":** The claim that killing someone makes the *choice* itself different (e.g., "the act of killing" vs. "the act of trying"). This denies the premise that the locus of control is the intention/volition.
  2.  **"Intuition is Infallible":** The claim that because we *feel* the killer is worse, they *must* be worse. Your view explicitly treats intuitions as data to be explained (via evidence), not as metaphysical truth-makers.
  3.  **"Moral Luck is Real":** The claim that luck can *constitutively* change moral status. Your Part 1 explicitly denies this. To argue otherwise is to attack the definition of responsibility you are using, not the internal coherence of the view.

  ---

  ### IV. Predictive Power and Falsifiability

  **Does the view predict anything rivals do not?**
  Yes. It predicts a **dissociation between blame severity and outcome severity when evidential value is controlled.**
  *   *Rival (Moral Luck Realists):* Predicts blame should track outcome even when evidence is controlled.
  *   *Your View:* Predicts blame should track outcome *only insofar as* outcome informs us about the will. If subjects are told "This outcome provides no information about the agent's care or intent," your view predicts blame levels should equalize.

  **Is it Falsifiable?**
  It is at risk of being **degenerative**.
  *   *The Risk:* Whenever experimental subjects blame the unlucky agent more despite being told evidence is equal, the defender can say, "The subjects implicitly believe the outcome *does* carry evidence (e.g., about objective risk)."
  *   *The Cost:* If every counter-example is explained away by positing hidden evidential variables, the theory becomes unfalsifiable. It turns into a "just-so story" where outcome-sensitivity is *always* rational updating, even when it looks like magic.
  *   *The Virtue:* If treated rigorously, the two-level structure allows you to diagnose *which* instances of blame are rational (evidentially supported) and which are biases (pure outcome luck). This offers a normative tool for moral improvement that pure Compatibilism or pure Luck Realism does not.

  **Final Verdict on Exposure:**
  Your view's greatest strength is also its greatest weakness. By making blame epistemic, you save the Control Principle from metaphysical contradiction. But you make the practice of blame vulnerable to epistemic critique. If the "evidence" turns out to be an illusion (as in paired cases), the justification for our actual moral practices evaporates. You are not defending our current practices; you are auditing them. If the audit finds widespread irrationality, your view survives, but our moral life looks much worse than we thought.
