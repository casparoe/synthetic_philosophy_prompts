      *   **(d) Sections 1 & 2 Errors:**
          *   *Analysis:* Are they *wrong*?
          *   *Lottery:* "That single body of evidence makes the loss of any given ticket 99.9% likely." Correct. "If a likelihood that high licenses belief..." This is the Lockean Thesis. Debatable, not *wrong*.
          *   *Preface:* "Closure then hands me the conjunction..." Closure is debated. "I also believe... that the conjunction is false." This is the paradox.
