answer: |-
  Good morning. It is hot in this tent, and the brass quintet is waiting. But before we march, I want to ask you a question that sounds simple but is not. What are you for?

  We spend four years, or six, or ten, studying living things. We learn that wings are for flying, hearts for pumping, roots for drinking. We use the language of purpose because it works. But biology is messy, and sometimes purpose comes untethered from use.

  Consider the cave fish. One of your PhD colleagues spent five years studying a species that lives in absolute darkness. These fish have eyes. The eyes develop, they grow, they sit on the face. But they see nothing. There is no light to catch. So, I ask you: What are those eyes for?

  There are two honest ways to answer. The first looks backward. It says those eyes are for seeing, because the ancestors of this fish used them to see. The history of the trait gives it a purpose, even if the trait is now on vacation. The second way looks only at now. It says those eyes are for nothing. They contribute nothing to the fish's survival today. A thing that does no work has no function.

  Neither answer is a mistake. They are answers to different questions. One asks about history; the other asks about capacity.

  Imagine another case. Suppose a mutation arises in a creature—a lump of tissue that was never selected by evolution, never shaped by ancestry. But by accident, it pumps blood exactly like a heart. Is it a heart? The history view says no. It has no pedigree. It is an accident. The present view says yes. It does the work of a heart. It keeps the animal alive.

  For fifteen years, two colleagues in the front row have argued about which view is right. But today, I suggest the disagreement is not a defect in biology. It is a feature. It tells us that "function" is not a single thing hidden in the object. It is a relationship between the object and the question we ask. Are we asking where this came from? Or are we asking what this can do?

  You are leaving this department with a degree in biology. But what is that degree for? If you ask the history question, the answer is fixed. You are for science. You are for research. You are for the lineage of this university. But if you ask the capacity question, the answer is open. You are for healing, if you go to medicine. You are for protection, if you go to conservation. You are for explanation, if you go to teaching. Two of you are even for philosophy.

  If you hold only to the history, you might feel trapped when your path changes. If you hold only to the present, you might feel unmoored from your training. You need both. You need to honor where you come from—the rigor, the methods, the history of inquiry you learned here. But you also need to honor what you can do now, in a world that changes faster than evolution.

  Some of you will find that your training fits your life perfectly, like a heart in a chest. Others will find you are like the cave fish, carrying structures that no longer fit the dark. That is not failure. It is just biology. You may find you have capacities you never selected for. You may find you are useful in ways your transcript cannot predict.

  Do not let anyone tell you there is only one correct way to measure your worth. The historian and the mechanist are both needed. The past explains your resilience; the present explains your utility.

  The heat is rising. The families in the back are waiting to cheer. The quintet has their horns ready. You have spent years learning how life works. Now go out and decide what it is for.

  Congratulations.

  ***

  **Sentences Deliberately Kept Out**

  1. "The eyes retain their function because evolution designed them to see." (False under Causal-Role: current contribution is zero.)
  2. "Because the eyes no longer detect light, they have lost their function entirely." (False under Etiological: historical selection remains.)
  3. "The accidental pump is not a true heart because it lacks an evolutionary history." (False under Causal-Role: current capacity defines function.)
  4. "Your degree functions only if you work in a scientific field." (False under Causal-Role: skills can contribute to non-science systems.)
  5. "Your purpose is fixed by the curriculum you completed." (False under Causal-Role: present capacity can exceed historical design.)
