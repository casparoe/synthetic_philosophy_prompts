  The final figure is most sensitive to **$P_2$ (History Fixes State)**. Because this term is the smallest non-trivial multiplier, any absolute increase in confidence regarding logical determinacy yields the largest proportional gain in the final credence (e.g., raising $P_2$ to 0.50 increases the total credence fivefold, whereas doubling $P_1$ only doubles the total).

