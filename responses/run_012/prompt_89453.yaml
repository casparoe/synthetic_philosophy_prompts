  If there is no fact of the matter, it does **not** follow that supertasks are impossible. This outcome supports Benacerraf's resolution over Thomson's: the lack of a determined state indicates the physical description is logically incomplete regarding $t=1$, not that the process itself is metaphysically contradictory or unperformable.
