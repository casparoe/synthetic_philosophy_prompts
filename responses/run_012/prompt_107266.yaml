  I'm not a philosopher, I just mess around with data for fun — lately I've been doing a little hobby project where I cluster stuff by similarity, nearest neighbors, feature vectors, distance metrics, that kind of thing. I'm decent at it but definately no expert. Someone told me Wittgenstein thought concepts work by family resemblance instead of everybody sharing one common feature, and honestly that sounds exactly like clustering to me: pick some features, measure how close things are, and a thing belongs to the group if it's near enough to the others even though no single feature is shared by all of them. Can you restate his view as faithfully as you can in the vocabulary I actually use — features, distances, prototypes, clusters — and then give me the residue report? Which parts of what he's saying survive the translation cleanly, which only survive with some fudging, and which parts have no counterpart at all in how clustering works. And tell me what that leftover stuff means: is his idea vaguer than it sounds once you try to pin it down, or is my vocabulary just missing something real?
