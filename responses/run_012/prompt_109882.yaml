  The sweet illusion makes the morning new.
  I guard my passions like a work of art.
  I know the shadow, yet I call it true.

  Without this veil, what color would break through?
  For play and love and study take their part.
  The sweet illusion makes the morning new.

  I save the fire for the winter's cue.
  I keep the spark alive within the heart.
  I know the shadow, yet I call it true.

  Truth is too sharp; I need a softer hue.
  I draw the design on a private chart.
  The sweet illusion makes the morning new.

  The years will claim what I have kept in view.
  I will not let the pieces fall apart.
  I know the shadow, yet I call it true.

  I know the price, and willingly pay due.
  No necessary warmth shall depart.
  The sweet illusion makes the morning new.
  I know the shadow, yet I call it true.
