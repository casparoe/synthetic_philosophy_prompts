answer: |-
  Your tentative theory is extremely close to a position defended by philosophers like Philippa Foot and Michael Thompson (often called "Natural Normativity"). You are right to suspect that the gap isn't a wall between *sentences*, but a spotlight on *where the normativity is coming from*.

  However, your worry about the **Evolution vs. Heart** case and the **Teacher** case suggests your definition of "function" or "purpose" is doing too much heavy lifting without enough precision.

  Here is a principle that attempts to systematize your ten verdicts, followed by the stress test you asked for.

  ### The Principle: The Internal Standard of a Kind

  **Rule:** You can validly infer an 'ought' (or a 'defect') from an 'is' only if:
  1.  **Kind Membership:** The subject belongs to a "Normative Kind" (a thing defined by what it is *for* or what counts as *success* for it).
  2.  **Standard vs. Statistic:** The premise describes the *internal standard of success* for that kind, not merely a causal history or a statistical frequency.
  3.  **Agency Match:** If the conclusion is an 'ought' (implying choice), the agent must have the capacity to fulfill the standard. If the conclusion is 'defective', capacity doesn't matter.
  4.  **Moral Bridge:** For a *moral* ought, the "good" of that kind must not conflict with higher-order moral values.

  ---

  ### Part 1: Defining "Function" Narrowly
  You asked to spell out the narrower thing. In philosophy of biology and action, we distinguish between:
  *   **Etiological Function (History):** "This trait existed because it helped ancestors survive." (This is the Evolution case).
  *   **Teleological Function (Goal):** "This part is organized to contribute to the end of the whole." (This is the Heart/Knife case).

  **The Fix:** Your principle holds only if "function" means **Teleological**.
  *   **Heart:** It is *for* pumping. If it doesn't, it fails its internal standard. (Valid defect claim).
  *   **Evolution:** Territoriality *helped* survival. But humans are not *for* surviving in the way a heart is *for* pumping. We are agents who can choose to override survival instincts. Therefore, an evolutionary fact is a **causal explanation**, not an **internal standard**.

  ### Part 2: Running the 10 Cases

  Here is how the principle sorts your pile.

  **Group A: Artifacts & Roles (Cases 1, 2, 7)**
  *   *Knife, Promise, Teacher.*
  *   **Why they work:** These are "Normative Kinds." A knife that doesn't cut is a bad knife. A promise not kept is a broken promise. A teacher who doesn't explain is a bad teacher.
  *   **The Clause:** **Kind Membership.** The norm is built into the definition of the thing.
  *   **The Teacher Worry:** You said this feels like "cheating." The principle agrees: it *is* cheating if you think the 'ought' comes from the 'is'. The 'ought' comes from the word 'Good' in the subject ("**Good** teacher"). The argument is actually: *She is a good teacher + Good teachers explain $\rightarrow$ She explains.* The norm was in the subject term all along.

  **Group B: Biological Organs (Cases 3, 4)**
  *   *Heart, Eyes.*
  *   **Why they work (mostly):** These are natural kinds with teleological functions.
  *   **The Clause:** **Standard vs. Statistic.** Pumping/Seeing are standards of success for these organs.
  *   **The Distinction:** Case 3 (Heart/Defective) is logically cleaner than Case 4 (Eyes/Ought). Organs don't have agency. You can say a heart *ought* to pump only in the sense that it *should* if it wants to be a good heart (which it doesn't).
  *   **Verdict:** Case 3 is Valid (Defect claim). Case 4 is shaky (see "Overturn" below).

  **Group C: Brute Facts & History (Cases 5, 8)**
  *   *Evolution, Popularity.*
  *   **Why they fail:**
      *   **Evolution:** Describes causal history (Etiological), not an internal standard of success for a moral agent. Fails **Standard vs. Statistic**.
      *   **Popularity:** Describes a statistical frequency. "Most people do X" is not "X is the standard of success for being a person." Fails **Standard vs. Statistic**.

  **Group D: Values & Needs (Cases 6, 9, 10)**
  *   *Pain, Medicine, Humiliation.*
  *   **Why they split:**
      *   **Pain:** "Pain is bad" is already a value judgment. The norm is in the premise. Valid.
      *   **Medicine:** "Needs to live." Life is generally accepted as a precondition for any other good. Passes **Moral Bridge**.
      *   **Humiliation:** "Needs to be taken down a peg." This implies a goal (social dominance/correction via shame). This goal is morally contested. Fails **Moral Bridge**.
  *   **The 'Needs' Distinction:** "Need" is not a brute fact. It always implies "Need *for what*?"
      *   Medicine $\rightarrow$ For Life (Good).
      *   Humiliation $\rightarrow$ For Ego/Justice (Contested).

  ---

  ### Part 3: The New Case Prediction

  **Case:** *"It's natural for parents to love their kids, so you ought to love your kids."*

  **Prediction:** **Invalid** (under the strict Is/Ought reading), but **Valid** (under the Normative Kind reading).

  *   **Why Invalid:** If "natural" means "statistically common" (most parents do it), it fails the **Standard vs. Statistic** clause (same as the Townspeople case).
  *   **Why Valid:** If "natural" means "constitutive of the role of parenting" (a parent *is* a guardian), then it passes **Kind Membership**.
  *   **The Trap:** This case reveals that your principle relies on us agreeing on what the "Kind" is. If someone argues "Parents are just genetic donors," the 'ought' vanishes. If they argue "Parents are nurturers," the 'ought' appears. The principle doesn't solve the argument; it locates it. It tells you the fight isn't about logic, it's about **definition**.

  ---

  ### Part 4: The Verdict to Overturn

  To make your system consistent, you have to overturn one of your "Fine" verdicts.

  **Overturn Case 4:** *"Eyes are for seeing, so you ought to use your eyes to see."*

  **Why:** This violates the **Agency Match** clause.
  *   A *knife* doesn't sharpen itself; *you* sharpen it. (Case 1 is about *your* duty to the tool).
  *   A *heart* doesn't choose to pump; it just does or fails. (Case 3 is about *its* defect, not an 'ought').
  *   *Eyes* don't choose to see. *You* choose to open them.
  *   **Correction:** The valid inference is: *"Eyes are for seeing, so eyes that don't see are defective."* (Matches Case 3).
  *   The 'ought' version ("You ought to use your eyes...") is only valid if you add a hypothetical: *"...if you want to see."* Without that goal, it's just as arbitrary as the Evolution case. Why *ought* you see? Just because the eyes are there? That's the Naturalistic Fallacy in disguise.

  ### Part 5: Summary of the Fix

  Your gut is right: **The gap is about where the norm got in.**

  1.  **Valid:** The norm is in the definition (Knife, Teacher, Promise), the biological standard (Heart/Defect), or a shared value (Pain, Life).
  2.  **Invalid:** The norm is trying to be conjured from a history (Evolution), a statistic (Popularity), or a contested goal (Humiliation).

  **The Narrower Definition of Function:**
  Don't use "function" for anything that evolved. Use it only for **organized contributions to a whole**.
  *   Heart $\rightarrow$ Body (Yes).
  *   Knife $\rightarrow$ Cutting Task (Yes).
  *   Territorial Instinct $\rightarrow$ Genetic Replication (No, this is a causal mechanism, not a normative standard for *you*).

  If you accept that distinction, your ten cases become consistent, provided you demote Case 4 from an 'ought' to a 'defect' claim.
