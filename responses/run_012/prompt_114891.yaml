      *   *Soft Spot:* This redefines computation so much it might be unrecognizable to them.

      *   *Objection 3 (The Friend):* Semantics/Chinese Room. "Meaningless balls."
      *   *Reply:* Agreed, bracket meaning. We are talking about causal structure, not intentionality. Don't change the subject.
      *   *Soft Spot:* They will say causal structure *without* meaning is irrelevant to mind.

      *   *Concession:* Admit that this makes "software" less magical.
      *   *Dreaded Question:* "If the specific physics matters, isn't this just physics? Why invoke symbols at all?" (The Eliminativist squeeze).

  8.  **Review against Constraints:**
