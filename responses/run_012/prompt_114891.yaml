prompt: |-
  I spent most of yesterday evening arguing with a friend about the careenium — the thought experiment in which a planet-sized brain is assembled out of "simmballs", whose purely mechanical jostling is meant to realise the state transitions of a symbol system — and we ended where we always end: he says the whole construction is a Chinese room with better upholstery, since nothing about rolling balls tells you whether any symbol is about anything, and I say that is to change the subject, because the interesting claim was never about meaning but about causation. Next week I must defend that claim at our work-in-progress meeting, so I want to be ready. My line will be that the symbolic level of description does genuine causal work in the careenium — its transitions pick out difference-makers rather than merely summarising the ballistics — but that this is bad news for the usual functionalist moral, since the causal powers are inherited from the specific mechanics of the simmballs, which is not the substrate-independence people have wanted. The room will be three committed computationalists, who will hear the careenium as friendly to them and my second claim as a defection; the friend above, who will insist that syntax never adds up to semantics and that the causal question is a distraction; and one physicalist who will press the causal-exclusion worry — how symbol-level causes escape being either epiphenomenal or overdetermining when every collision is fixed by prior collisions. Draft me a Q&A prep sheet: the objections I will actually get, in their vocabularies, ordered by how much damage each would do, each with a two-minute reply and a note on where the reply is softest; what I should concede at the outset; and the one question I am hoping nobody asks.
