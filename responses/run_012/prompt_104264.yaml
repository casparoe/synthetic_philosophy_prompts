answer: |-
  A traveler halted before the TSA scanner, arms crossed. "How do you know this machine detects threats? It's an unproven hypothesis."

  The agent didn't look up from the monitor. "It's calibrated."

  "But calibration assumes the standard is real. What if the standard is a fiction?"

  The agent stepped out from behind the podium. "Sir, in security, the scanner is the hinge. It's not a hypothesis; it's the rule. If you doubt the scanner, you aren't passing security. You're blocking the line."

  "I just want justification."

  "Justification stops where the practice begins. Yesterday we removed laptops; today we leave them in. What was bedrock yesterday flows as water today. But while you stand here, the machine holds. That's not knowledge; it's the condition of flying."

  "So I must trust it?"

  "You must act as if it works. If you treat the hinge as water, you can't open the door. You're asking me to verify the ground while you're falling."

  The traveler sighed. "Fine. I'll walk through. But I remain skeptical."

  "Skepticism is free," said the agent, pointing to the exit. "But doubt is a metal object. Please leave it in the bin. It always sets off the alarm."

  The traveler paused. "Can I carry it on?"

  "No. Checked baggage only. And even then, it might get lost."
