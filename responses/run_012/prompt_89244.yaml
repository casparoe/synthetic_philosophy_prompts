answer: |-
  # JOINT STATEMENT ON MORAL RESPONSIBILITY
  **Adversarial Collaboration between R (Participant Stance) and S (Skeptical Stance)**

  ### I. AGREED CLAIMS
  *Both parties affirm the following propositions as accurate descriptions of their respective positions and the common ground between them.*

  1.  **The Reality of Reactive Attitudes:** We agree that attitudes like resentment, indignation, guilt, gratitude, and pride are psychological facts that currently structure human relationships. We agree that these are not merely intellectual judgments but emotional responses tied to how we view others' intentions toward us.
  2.  **The Excuse/Exemption Distinction:** We agree that a distinction exists between *excuses* (acknowledging the agent but denying the act was fully theirs, e.g., coercion, accident) and *exemptions* (denying the agent is a candidate for these attitudes, e.g., severe dementia, early childhood). We agree that in clear cases of exemption, blaming is inappropriate regardless of metaphysical facts about determinism.
  3.  **Determinism and Psychology:** We agree that the truth or falsity of determinism does not, by itself, change the *psychological difficulty* of blaming. Even if convinced by skepticism, a person might still feel resentment. The dispute is about whether those feelings are *justified*, not whether they are inevitable.
  4.  **Two Senses of "Justify":** We agree that our disagreement stems partly from using "justify" in two different senses.
      *   **Internal Justification:** Asking whether a blaming practice coheres with our other values, serves a social function, and is applied consistently (R's primary focus).
      *   **External Justification:** Asking whether the practice is metaphysically grounded in a form of control or authorship that transcends causal history (S's primary focus).
      *   *We agree that R is primarily offering an Internal Justification, while S is demanding an External Justification.*
  5.  **Blame vs. Punishment:** We agree that moral blame (the attitude/relationship) is distinct from legal punishment (state sanctions). We agree that skepticism about moral blame puts pressure on punishment, but they are not identical. One might theoretically retain punishment for safety while abandoning blame for desert.
  6.  **The Manipulation Spectrum:** We agree that there is a spectrum of causal histories ranging from (A) direct neurological tampering by a scientist to (B) ordinary upbringing shaped by genetics and environment. We agree that Case A clearly undermines responsibility. The dispute is whether Case B differs in kind or only in degree from Case A.
  7.  **Symmetry of Attitudes:** We agree that the structure of positive reactive attitudes (gratitude, moral pride) mirrors the structure of negative ones (resentment, guilt). If the metaphysical grounds for one are undermined, the grounds for the other are threatened similarly.
  8.  **Attributability and Answerability:** We agree that an action can be *attributable* to an agent (it flowed from their values) without the agent necessarily being *answerable* to us (liable to demands for justification). We disagree on whether attributability is sufficient for the kind of responsibility that matters in adult relationships.
  9.  **Prediction vs. Expectation:** We agree there is a difference between *predicting* someone will behave a certain way (based on causal laws) and *expecting* them to behave a certain way (holding them to a standard). We disagree on whether "holding to a standard" requires metaphysical freedom or merely social capacity.
  10. **Practical Aim:** We agree that the goal of this inquiry is to determine whether we should (A) continue the practice of blaming while revising our understanding of it, or (B) attempt to dismantle the practice of blaming in favor of a purely forward-looking, therapeutic, or managerial stance.

  ***

  ### II. POINTS OF DISAGREEMENT
  *The following table outlines specific divergences. Wording has been negotiated to ensure neither side feels mischaracterized.*

  | Point of Contention | R's Wording (Participant Stance) | S's Wording (Skeptical Stance) | Type | Linked Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Manipulation Line** | There is a non-arbitrary line where an agent becomes a participant in the moral community. Ordinary upbringing respects this; direct tampering violates it. | There is no non-arbitrary line. If tampering negates responsibility, and tampering differs from upbringing only in degree, then upbringing negates responsibility too. | Real | Crux A |
  | **2. The Psychopath** | The psychopath is **exempt**. They lack the capacity for reciprocal regard required for the participant stance. They are not a "bad" person; they are outside the moral relation. | The psychopath is **determined**, like everyone else. Calling them "exempt" admits capacity matters, but if capacity is itself causally determined, the exemption should apply to everyone. | Real | Crux C |
  | **3. Symmetry of Attitudes** | If we abandon resentment, we must abandon gratitude. This leads to an unlivable life. Since we cannot live without gratitude, we cannot consistently abandon resentment. | If we abandon the idea of basic desert, we must revise gratitude and pride too. We can feel joy at benefits, but not *moral gratitude* that assumes the giver could have done otherwise. This is livable. | Real | Crux B |
  | **4. Answerability** | To be answerable is to be a valid target of demands. This status is conferred by participation in the relationship, not by metaphysical powers. | To be answerable implies you are the ultimate source of the action. If you are not the source, "answerability" is just a polite word for "causal locus." | Verbal/Real | Crux D |
  | **5. Practical Goal** | The skeptic wants to abolish blaming. This is impossible without abolishing love and friendship. | The skeptic wants to stop blaming *for desert*. We can keep the emotions as tools for regulation, but we must stop telling ourselves the fiction that the blamer *deserves* to suffer. | Real | Crux E |

  ***

  ### III. CRUXES AND PREDICTIONS
  *These are the sub-questions such that settling one would move at least one party's position. For each, we specify the case or argument that bears on it, and each side's prediction.*

  #### Crux A: The "Faded Tampering" Case
  *   **The Question:** In the spectrum from direct neural tampering to ordinary upbringing, is there a specific threshold where moral responsibility emerges, or is the difference merely pragmatic?
  *   **The Test Case:** A "Faded Tampering" scenario. A child is raised by parents who subtly manipulate their environment to ensure they value X, indistinguishable from normal parenting except the parents planned it from birth. As we reduce the planning intentionality step-by-step until it matches random genetic lottery, does responsibility return gradually or all at once?
  *   **R's Prediction:** Responsibility returns when the agent develops the *capacity* to reflect on and revise those values, regardless of how the values were installed. The threshold is capacity, not history.
  *   **S's Prediction:** Responsibility does not return. If the capacity itself was causally determined by the tampering (or the lottery), the history remains tainted. The "capacity" is just another causal link.
  *   **Movement Condition:** If R can identify a capacity threshold that S agrees is *not* fully determined by prior causes, R wins. If S admits that a specific level of reflective capacity makes the history irrelevant, S wins.

  #### Crux B: The Symmetry of Gratitude
  *   **The Question:** Can we coherently retain moral gratitude and pride while abandoning moral blame and guilt?
  *   **The Test Case:** The "Unearned Benefactor." A person saves a child from drowning. We later learn the person was causally determined to do so (e.g., programmed or genetically fixed to be heroic). Do we still feel *moral gratitude* (owed to them) or just *gladness* (about the outcome)?
  *   **R's Prediction:** You cannot have moral gratitude without moral blame. If the hero isn't praiseworthy, they aren't blameworthy. If S admits we should feel only "gladness," S admits the participant stance is dead.
  *   **S's Prediction:** We can retain a revised form of gratitude that acknowledges the benefit without asserting basic desert. We can honor the person without believing they metaphysically authored the act.
  *   **Movement Condition:** If S admits that "moral gratitude" requires the same metaphysical grounding as blame, S must abandon gratitude (moving S toward nihilism or revisionism). If R admits gratitude can survive without desert, R loses the "unlivable life" argument.

  #### Crux C: The Psychopath's Status
  *   **The Question:** Is the psychopath exempt because of a lack of capacity (R) or because they are determined (S)?
  *   **The Test Case:** The "Rational Psychopath." An agent who understands moral rules perfectly and can reason about them, but lacks emotional concern for others. Is this agent exempt?
  *   **R's Prediction:** Exempt. Understanding rules is not enough; one must care about the moral demand. Lack of care is a quality-of-will impairment that triggers exemption.
  *   **S's Prediction:** Not exempt in a way that helps us. They are determined, just like the rest of us. If they are exempt because they don't care, then anyone who doesn't care enough (due to upbringing) is exempt.
  *   **Movement Condition:** If R agrees the psychopath is exempt *only* because they lack a specific cognitive/emotional hardware, R must explain why normal adults with "bad hardware" (due to luck) aren't also exempt. If S agrees the psychopath is exempt for a reason that *doesn't* apply to normal adults, S admits there is a relevant difference between them.

  #### Crux D: Expectation vs. Prediction
  *   **The Question:** Is "holding someone to a standard" distinct from "predicting they will meet it"?
  *   **The Test Case:** The "Disappointed Friend." You expect a friend to call. They don't. Is your resentment based on a failed prediction (they usually call) or a failed norm (they *should* have called)?
  *   **R's Prediction:** It is a failed norm. The "should" is normative, not predictive. You can resent someone even if you predicted they would fail.
  *   **S's Prediction:** The "should" is a disguised prediction plus a desire. You resent them because their failure signals they don't value you (a causal fact about their psychology), not because they violated a metaphysical law.
  *   **Movement Condition:** If S admits there is a normative "should" that survives the removal of metaphysical freedom, S moves toward compatibilism. If R admits resentment is just about signaling future risk (prediction), R moves toward consequentialism.

  #### Crux E: Abolition vs. Revision
  *   **The Question:** Does the skeptic want us to stop blaming, or to keep blaming while changing the story we tell about it?
  *   **The Test Case:** The "Honest Blamer." A person who says, "I know you are determined, but I am still going to resent you because it helps regulate our relationship." Is this person being inconsistent?
  *   **R's Prediction:** Inconsistent. You cannot genuinely resent someone while believing they are exempt from ultimate responsibility. The attitude implies a belief the theory denies.
  *   **S's Prediction:** Consistent. We can keep the tool (resentment) while dropping the myth (desert). The "Honest Blamer" is the ideal moral agent of the future.
  *   **Movement Condition:** If S admits that resentment *cannot* be sustained without the belief in desert, S must advocate for abolishing resentment (a massive practical shift). If R admits resentment can be sustained as a mere tool, R loses the claim that skepticism is self-undermining.

  ***

  **Signed:**

  _________________________ (R)

  _________________________ (S)

  _________________________ (Facilitator)
