      *   *Step (1) & (2):* These are technically correct definitions within the logic of the paradox. Grue *is* defined that way, and observed emeralds *are* grue.
      *   *Step (3):* This is the Principle of Indifference / Likelihood Principle. It seems intuitive. If Hypothesis A and Hypothesis B predict the exact same data observed so far, why prefer A? *However*, in Bayesian terms and confirmation theory, "support" isn't just about fitting past data; it's about prior probabilities and projectibility.
