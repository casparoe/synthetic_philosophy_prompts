      *   "Disciplined inference." -> Ground his reactions in his known methodological preferences (Kulturgeschichte vs. Positivism).

  *(Self-Correction on the "Test"):* The user's test requires anchoring in contemporary names OR ordinary records. Burckhardt would definitely prioritize the former (contemporary self-conception) over the latter (wills/contracts). He believes the "spirit" manifests in high culture first. I need to make sure this distinction is clear.

