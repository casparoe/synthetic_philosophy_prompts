          *   *Status:* Technically true in the vignette design, but pragmatically, the *attitude* might be interpreted differently (see below).
      *   *Claim 4:* "Since the chairman's beliefs and desires are held fixed across the two versions, the result shows that ascriptions of intentionality are not a matter of what the agent believed and wanted, but of whether the assessor morally disapproves of the outcome."
          *   *Status:* Contested. This is the *strong* interpretation. Many argue beliefs/desires aren't actually held fixed in the participants' minds (e.g., counterfactual testing, attitude ascription).
      *   *Claim 5:* "This is a counterexample to the Simple View..."
          *   *Status:* Accepted. The Simple View (McCann) is generally considered dead or heavily modified due to Knobe.
      *   *Claim 6:* "...and it shows that the ordinary concept of intentional action is a moralized one: to call an action intentional is to hold the agent to a norm."
