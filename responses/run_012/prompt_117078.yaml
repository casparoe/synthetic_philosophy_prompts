answer: |-
  Your suspicion is well-founded: while the paragraph accurately describes the basic experimental asymmetry, its theoretical conclusions regarding moralization, speaker inconsistency, and the unreliability of armchair intuition are significant overstatements that most specialists would qualify or reject.

  The descriptive core of the paragraph is solid. The summary of the Chairman vignettes and the resulting asymmetry in intentionality ascriptions is accurate, and the claim that this falsifies the Simple View (that intentional action requires a desire for the outcome) represents the standard consensus in the field. However, the move from this data to the claim that beliefs and desires are "held fixed" is contested; many researchers argue that participants implicitly attribute different mental states (such as a deeper desire or different belief strength) based on the outcome, meaning the psychological inputs aren't actually perceived as identical by the subjects.

  The label "moralized" is too narrow and would be flagged by specialists. Subsequent literature demonstrates that the effect arises from violations of various norms, including conventional, aesthetic, and prudential ones, not just moral ones. A more accurate description is that the concept is "normative" or "evaluative," meaning it is sensitive to whether an outcome violates or conforms to a relevant norm, rather than strictly moral right or wrong. Consequently, the claim that calling an action intentional is specifically to "hold the agent to a norm" is plausible, but framing it as a *moral* concept obscures the broader normative sensitivity involved.

  The claim that ordinary speakers are "inconsistent" is a theoretical interpretation rather than a descriptive fact, and it is heavily disputed. Calling the judgments inconsistent presupposes that the concept of intentional action ought to be context-invariant. If the concept is inherently sensitive to normative context—as the data suggests—then applying different standards to harmful versus beneficial side effects is a feature of the concept's structure, not a bug in the speakers' reasoning. Specialists often prefer terms like "context-sensitive" or "pragmatically enriched" over "inconsistent," as the latter implies an error in competence rather than a systematic variation in performance or conceptual content.

  Finally, the conclusion that armchair appeals to intuition are "unreliable" is an overreach characteristic of the "negative program" in experimental philosophy that many methodologists reject. The variation shown by the Knobe effect demonstrates that intuitions are sensitive to morally relevant features, not that they are random or untrustworthy. Furthermore, the effect itself was generated by Joshua Knobe's own armchair intuition about how people would respond, suggesting that trained philosophical intuition can track these phenomena even without empirical data. The lesson is not that intuition is discredited, but that conceptual analysis must account for the context-sensitivity and normative embedding of folk concepts rather than assuming they are isolated from evaluative judgment.

  In sum, the paragraph correctly identifies the phenomenon and the death of the Simple View, but it conflates the data with a specific, controversial explanation. It treats a robust asymmetry in side-effect judgments as proof of a global inconsistency in the concept, ignoring competing explanations that preserve the coherence of folk psychology by adjusting the underlying theory of intentional action rather than blaming the speakers.
