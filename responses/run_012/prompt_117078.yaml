      *   *Claim 1:* "The Knobe effect is the finding that people's judgments about whether an action was done intentionally are driven by their moral assessment of the outcome."
          *   *Status:* Generally accepted as the *phenomenon*, though "driven by moral assessment" is the *interpretation* (debated). Some say it's driven by norms, not necessarily moral ones.
      *   *Claim 2:* Description of the Chairman case (Harm vs. Help).
