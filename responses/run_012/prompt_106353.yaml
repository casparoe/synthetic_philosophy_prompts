answer: |-
  ### Essay Question

  **Question 1**
  Consider the 'Tie-Break Protocol' case: an autonomous robot faces two routes to a shelf that are identical in every measurable respect (length, energy, risk). To prevent paralysis, engineers programme it to choose the route whose label sorts first alphabetically. A colleague objects that this is a 'cheat' which provides no genuine *reason* for the choice, rendering the action arbitrary.

  Critically evaluate this objection. In your answer, distinguish between the agents being *indifferent* between options (they are equally good) and having *no preference* because the options are incomparable. Does rationality require a sufficient reason to *act* on a specific option, or merely a sufficient reason not to act *against* one's goals? Is the Protocol a rational resolution to undetermination or a violation of the Principle of Sufficient Reason?

  ***

  ### Model Answer

  The Tie-Break Protocol raises a classic problem in practical reason: can a choice be rational when first-order reasons run out? The colleague's objection rests on a strong reading of the Principle of Sufficient Reason (PSR), which dictates that for every fact or action, there must be an explanation why it is so and not otherwise. If the routes are truly identical, there is no fact about the world that favours Route A over Route B. Therefore, the colleague argues, selecting A via alphabetical order is not reasoning; it is a mechanical workaround masking arbitrariness. However, this objection conflates the *source* of the reason with the *existence* of a reason, and misunderstands the demands of rationality in cases of indifference.

  First, we must distinguish between indifference and incomparability. In the robot's case, the sensors report the routes as 'identical'. This suggests indifference: Route A and Route B are of equal value ($A = B$). Incomparability ($A ? B$) would imply there is no common metric to judge them. This distinction matters. If the options were incomparable, standard maximisation models of rationality might fail entirely, as there is no 'better' to pursue. However, under indifference, the value is equal. The rational requirement is to maximise value. Since both routes maximise value equally, rationality does not demand a specific choice, only that *a* choice is made to fulfil the goal (retrieving the item). Paralysis is arguably more irrational than an arbitrary selection, as paralysis guarantees failure of the goal.

  The crux of the matter is whether rationality requires a sufficient reason to *act* on a specific option, or merely a reason not to act *against* one's preferences. The colleague assumes the former: there must be a feature of Route A that makes it the 'right' choice. But this leads to an infinite regress. If a feature favoured A, the routes wouldn't be identical. Instead, we should adopt a voluntarist view: when first-order reasons (distance, risk) are exhausted, the will itself can generate a second-order reason. The Protocol provides a normative rule: 'When indifferent, choose alphabetically.' This rule is not a cheat; it is a constitutive rule of the agent's decision-making procedure.

  By adopting the Protocol, the robot acquires a reason to choose Route A: 'because it is the alphabetical tie-breaker.' This is a genuine reason, albeit a formal one rather than a substantive one. It satisfies the PSR because there is now an explanation for the action: the action conforms to the agent's adopted decision rule. To claim this is irrational is to claim that rationality forbids resolving undetermination. Yet, in practical contexts, the cost of deliberation often outweighs the benefit of finding non-existent differentiating features. Rationality is often about efficiency in goal pursuit, not metaphysical grounding for every micro-movement.

  Furthermore, the objection fails to recognise that 'arbitrary' does not mean 'irrational'. An arbitrary choice is one not determined by prior causal conditions regarding the *object*, but it can be determined by conditions regarding the *agent's rules*. If the robot chose randomly, it would still be acting rationally relative to its goal. The alphabetical rule simply adds consistency. The colleague's error lies in demanding that the reason must reside in the *routes* rather than in the *protocol*.

  In conclusion, the Tie-Break Protocol is a rational resolution to undetermination. It does not violate the Principle of Sufficient Reason because the protocol itself supplies the sufficient reason for the specific choice. Rationality does not require a substantive preference between indifferent options; it requires only that the agent does not act against their goals. By preventing paralysis, the Protocol ensures the agent remains effective. The choice is arbitrary regarding the world, but reasoned regarding the agent's constitution. Thus, the colleague is mistaken: the rule is not a cheat, but a necessary feature of bounded rational agency.

  ***

  ### Marking Scheme (Total: 20 Marks)

  | Criteria | Marks | Must-Hit Moves / Indicators | Common Pitfalls (How students lose marks) |
  | :--- | :---: | :--- | :--- |
  | **Understanding of the Case** | 0–4 | Identifies the core tension: identical options vs. need to act. Recognises the Protocol as a second-order rule. | Treating the robot as a human with feelings; focusing on technical sensor limits rather than the philosophical problem of reasons. |
  | **Indifference vs. Incomparability** | 0–5 | Clearly distinguishes $A=B$ (indifference) from $A?B$ (incomparability). Explains why this matters for the rationality of the choice. | Conflating the two terms; arguing the robot faces incomparability when the prompt states the routes are 'identical'. |
  | **Sufficient Reason & Rationality** | 0–6 | Addresses the prompt's specific demand: reason *to act* vs. reason *not to act against goals*. Evaluates whether the Protocol satisfies PSR. | Assuming arbitrariness equals irrationality; failing to challenge the colleague's definition of a 'reason'. |
  | **Argument & Conclusion** | 0–5 | Coherent structure. Defends a clear position on whether the Protocol is a 'cheat'. Conclusion follows from premises. | Sitting on the fence without justification; introducing irrelevant examples (e.g., Buridan's original donkey) without linking back to the robot. |
  | **Total** | **20** | | |

  **Grade Boundaries (Indicative):**
  *   **17–20 (First):** Nuanced distinction between indifference/incomparability; robust defence of second-order reasons; fluent British English.
  *   **14–16 (2:1):** Correctly identifies the problem and defends the Protocol, but may gloss over the indifference/incomparability distinction.
  *   **10–13 (2:2)** Understands the scenario but struggles to articulate *why* the alphabetical rule counts as a reason; may accept the colleague's objection too readily.
  *   **0–9 (Third/Fail):** Misunderstands the prompt; focuses on robotics engineering; fails to address practical reason.
