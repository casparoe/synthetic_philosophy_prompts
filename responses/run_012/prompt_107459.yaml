prompt: |-
  I am a novelist at work on a historical novel set in England in the 1880s and 1890s. My protagonist is a Cambridge moral philosopher closely modeled on Henry Sidgwick, the utilitarian who co-founded the Society for Psychical Research and served as its first president. What draws him into the investigation of mediums, apparitions, and thought-transference is not curiosity but need: he has lost his religious faith and hopes that disciplined empirical inquiry might yield evidence bearing on whether anything survives death — the question he cares about most and trusts least. The historical Sidgwick was convinced by the evidence for telepathy yet remained cautious about treating mediumistic phenomena as proof of survival, and he died without resolving the matter; I want my character to arrive at that same caution honestly, through his own reasoning, rather than simply announcing it as a mood.

  The difficulty is that my plot turns on his repeated decisions — séance after séance, claim after claim — about what to make of a report, what to write up for the Society's Proceedings, and what to tell the people who press him for a verdict. Around him I have placed a wealthy spiritualist patron who funds his research, a hard-nosed physicist colleague who regards the whole enterprise as a scandal, a recently bereaved friend who needs him to confirm that the dead survive, and his own wish to believe. He is not a statistician and has no laboratory; he works from testimony, notes, and his own observation, and he must often decide within a week whether to stake his name on a case. The Society's council has to sign off on anything published, and its credibility — which is also his — is the thing most at risk.

  What I need is a decision procedure he can actually run under those pressures: the questions he should ask in order, what would count as a sufficient answer to each, the point at which the procedure stops with a firm no, and the point at which it must hand the decision back to him because the matter is one of hope or of values rather than of evidence. Keep whatever distinctions the historical Sidgwick's approach depends on — above all, between the bare occurrence and its interpretation, between the question of what caused a result and the question of what that result justifies believing, and between evidence for thought-transference and evidence for survival — and tell me which of his scruples can be dropped for the sake of usability and which must survive the simplification. Be candid about where the procedure will misfire or merely dress up a judgment call as a step.

  Then run the procedure on three cases: first, a private séance, held with no meaningful controls, at which a medium produces a particular detail she could plausibly have learned elsewhere; second, a series of controlled card-guessing trials in which a sender in a separate room appears to transmit an image at a rate above chance; third, a sitting at which he suspects fraud but cannot prove it. Include at least one case where the procedure returns an answer I will not want — I suspect it will refuse my protagonist the verdict my ending depends on — and be explicit about what the procedure cannot do: whether it can ever license belief rather than merely suspend it, how it should treat his own hope for survival, and where he, and not the procedure, must decide.

  Please write the answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Historical novel set in England (1880s-1890s).
      *   **Protagonist:** Cambridge moral philosopher modeled on Henry Sidgwick (Utilitarian, co-founder/first president of SPR).
      *   **Motivation:** Loss of religious faith, desire for empirical evidence of survival after death (not just curiosity).
      *   **Goal:** Create a "decision procedure" (a mental algorithm/checklist) the character uses to evaluate psychical phenomena.
      *   **Constraints:** Must reflect Sidgwick's historical caution (convinced by telepathy, cautious on survival), distinguish between occurrence vs. interpretation, cause vs. justification, and telepathy vs. survival. Must acknowledge limitations (where it misfires, where it's just a dressed-up judgment call).
      *   **Task:** Define the procedure, then apply it to three specific cases (private séance, controlled card-guessing, suspected fraud). One case must yield an unwanted answer.
      *   **Tone:** American English, candid, analytical, suitable for a novelist's reference.

  2.  **Deconstruct Sidgwick's Methodology (Historical Basis):**
      *   Sidgwick was a rigorist. He demanded high standards of evidence.
      *   Key distinction: *Psychical Research* vs. *Spiritualism*. The SPR sought facts; Spiritualists sought comfort/doctrine.
      *   Key distinction: *Telepathy* (mind-to-mind) vs. *Survival* (mind-after-death). Telepathy is easier to prove; Survival requires ruling out telepathy from the living + fraud + coincidence.
      *   Key distinction: *Anecdotal* vs. *Experimental*. Sidgwick valued both but knew anecdotes were prone to error.
      *   The "Sidgwickian Burden": The evidence must be strong enough to overcome the antecedent improbability (Humean skepticism) without requiring blind faith.
      *   He died agnostic on survival. He wanted to believe but couldn't justify it intellectually.

  3.  **Drafting the Decision Procedure (The "Sidgwickian Filter"):**
      *   Needs to be practical for a novelist (steps the character can mentally tick off).
      *   Needs to incorporate the philosophical distinctions requested.
      *   *Step 1: The Fact Check.* Did the phenomenon happen as reported? (Eliminate fraud/error).
      *   *Step 2: The Normalcy Check.* Can normal senses/chance explain it? (Eliminate coincidence/leakage).
      *   *Step 3: The Telepathy Check.* If supernormal, is it mind-to-mind (living) or mind-from-beyond? (The crucial pivot).
      *   *Step 4: The Survival Verdict.* Does it *force* the survival conclusion, or merely allow it?
      *   *Stopping Rules:* Where does it say "No"? Where does it say "Insufficient Data"?
      *   *The "Human" Element:* Where does hope intrude?

  4.  **Refining the Procedure for the Novel:**
      *   Make it sound like a philosopher's tool, not a modern lab protocol.
      *   Acknowledge the pressure (Council, Patron, Friend).
      *   *Crucial Insight:* The procedure shouldn't solve the emotional problem. It should highlight the gap between evidence and hope.

  5.  **Developing the Three Cases:**
      *   *Case 1: Private Séance (Low Controls).* Result should be rejection or "unclassifiable." Sidgwick would hate this.
      *   *Case 2: Card Guessing (High Controls).* Result should be "Telepathy probable," but *not* Survival. This fits the historical Sidgwick (convinced by telepathy).
      *   *Case 3: Suspected Fraud.* Result should be "Withhold Publication." This protects credibility.
      *   *Requirement:* One case must return an answer the author/protagonist doesn't want. Case 2 is the best candidate for this. The protagonist *wants* survival; the procedure only grants telepathy. This creates the desired tension.

  6.  **Addressing the "Candid" Requirements:**
      *   Where does it misfire? (It can't quantify "improbability" perfectly).
      *   Where is it a dressed-up judgment call? (The leap from Telepathy to Survival).
      *   Can it license belief? (No, it licenses *working hypotheses*, not faith).
      *   How to treat hope? (Hope is a bias to be managed, not data).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Introduction:* Set the stage. Acknowledge the Sidgwickian mindset.
      *   *The Procedure:* Break it down into numbered phases. Use terminology appropriate for the 1890s (e.g., "veridical," "normal inference").
      *   *The Limitations:* Be honest about the "leap."
      *   *The Case Studies:* Run the logic clearly.
      *   *Conclusion:* Summarize the thematic utility for the novel.

  8.  **Review against Constraints:**
      *   American English? Yes.
      *   Sidgwickian distinctions kept? Yes (Telepathy vs. Survival, Fact vs. Interpretation).
      *   Three cases included? Yes.
      *   One unwanted verdict? Yes (Case 2 confirms telepathy but denies survival).
      *   Explicit about limitations? Yes.

  9.  **Final Polish:** Ensure the tone is respectful of the historical figure but useful for a writer. (Self-Correction: Make sure I don't make the procedure *too* modern. No p-values. Use terms like "chance expectation" or "moral certainty.")

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a decision procedure modeled on Henry Sidgwick's intellectual habits, adapted for your protagonist's use in the 1880s and 1890s. It is designed to be rigorous enough to satisfy a philosopher's conscience but structured enough to serve as a dramatic engine for your plot.

  ### The Sidgwickian Filter: A Decision Procedure

  This procedure is not a calculation of probabilities in the modern statistical sense (which did not yet exist in this form), but a cascade of *eliminative tests*. It moves from the physical to the psychological to the metaphysical. At each stage, the burden of proof increases.

  **Phase 1: The Verification of Fact (Did it happen?)**
  *   **Question:** Is the testimony sufficient to establish that the reported event occurred as described, excluding normal error, deception, or hallucination?
  *   **Criteria:**
      1.  **Witness Competence:** Are the observers sober, sane, and without motive to deceive?
      2.  **Corroboration:** Is there more than one witness? Do their accounts agree on essential details without being identical (which suggests collusion)?
      3.  **Conditions:** Were the physical conditions (lighting, distance, barriers) sufficient to prevent trickery?
  *   **Stop Rule:** If the answer is *No*, the inquiry ends. The case is rejected as "Unsubstantiated."
  *   **The Judgment Call:** This phase relies heavily on the protagonist's assessment of character. He must decide if a witness is "honest but mistaken" or "dishonest." There is no algorithm for this; it is moral intuition dressed as empirical rigor.

  **Phase 2: The Exclusion of Normal Causes (Could it be chance or sense?)**
  *   **Question:** Can the event be explained by normal sensory perception, lucky guessing, or prior knowledge?
  *   **Criteria:**
      1.  **Leakage:** Could the medium or subject have known the information through normal means (servants, overheard conversation, public records)?
      2.  **Coincidence:** Is the hit specific enough to rule out chance? (e.g., Naming a specific date is better than naming a year).
  *   **Stop Rule:** If a normal explanation is *plausible*, the inquiry ends. The case is classified as "Inconclusive" or "Normal." Sidgwick preferred to err on the side of skepticism here to protect the Society's credibility.
  *   **The Judgment Call:** Determining "plausibility" is subjective. A hard-nosed physicist will demand absolute impossibility of leakage; a hopeful spiritualist will accept improbability. Your protagonist must find the middle ground.

  **Phase 3: The Telepathy Pivot (Is it mind-to-mind?)**
  *   **Question:** If normal causes are excluded, does the evidence point to thought-transference between *living* minds?
  *   **Criteria:**
      1.  **The Agent:** Is there a living person who knew the information and could have transmitted it unconsciously?
      2.  **The Medium:** Is the medium sensitive to such impressions (as established by previous trials)?
  *   **Stop Rule:** If a living agent is identified, the phenomenon is classified as "Telepathic." **Crucially, this stops the road to Survival.**
  *   **The Distinction:** This is the most important step for your novel. Sidgwick accepted telepathy as a natural law that did not require the dead. If telepathy explains the data, survival is unnecessary.

  **Phase 4: The Survival Verdict (Is it mind-from-beyond?)**
  *   **Question:** Does the evidence *force* the conclusion that the source is discarnate?
  *   **Criteria:**
      1.  **Exclusion of Telepathy:** Is it impossible for any living person to know the information? (e.g., a secret known only to the deceased and the sitter, revealed without the sitter's knowledge).
      2.  **Identity:** Does the communication exhibit personal characteristics (mannerisms, specific memories) that cannot be simulated by telepathy from the sitter's own mind?
  *   **Verdict:** Even if passed, the conclusion is not "Proof." It is "Prima Facie Evidence for Survival."
  *   **The Limit:** This phase can never yield certainty. It can only shift the balance of probability.

  ***

  ### Where the Procedure Misfires

  You asked for candor regarding the procedure's limitations. Here is where it fails your protagonist:

  1.  **It Cannot Quantify "Moral Certainty":** The procedure relies on the protagonist's internal sense of when an explanation is "too strained" to accept. This is not logic; it is temperament. A skeptic will always find a normal explanation plausible; a believer will always find it strained. The procedure merely formalizes this bias.
  2.  **It Cannot License Belief, Only Suspension:** The procedure is designed to protect against error, not to validate hope. It can tell him when *not* to believe, but it cannot tell him when it is *safe* to believe. It creates a negative theology of psychical research.
  3.  **The "Hope" Variable:** The procedure treats hope as a contaminant. It requires him to bracket his desire for survival. However, since his motivation is the *need* for survival, the procedure requires him to suppress the very engine driving his work. This creates the internal conflict: to use the tool is to deny the goal.
  4.  **The Telepathy Trap:** Historically, Sidgwick found that the more rigorously he proved a phenomenon was real, the more likely it was to be telepathy rather than survival. The procedure is excellent at finding telepathy; it is structurally incapable of confirming survival, because survival requires ruling out telepathy from the living, which is nearly impossible.

  ***

  ### Application to Three Cases

  Here is how the procedure functions in practice within your narrative.

  #### Case 1: The Private Séance (Low Controls)
  **The Scenario:** A wealthy patron hosts a medium in her drawing room. The lights are dimmed. The medium calls out the name of the patron's deceased brother and mentions a specific injury he sustained. The protagonist is present but did not search the medium prior to the sitting.
  **Running the Procedure:**
  *   **Phase 1 (Fact):** Witnesses agree the words were spoken. *Pass.*
  *   **Phase 2 (Normal Causes):** The patron is well-known in society. The brother's injury was reported in the local papers five years prior. The medium could have read this or heard it from servants.
  *   **Decision:** **REJECT.**
  *   **Reasoning:** The possibility of normal leakage is plausible. To publish this would expose the Society to ridicule.
  *   **Narrative Impact:** The patron is disappointed. The protagonist must tell her that her comfort is less important than the Society's integrity. This establishes his rigor early on.

  #### Case 2: The Controlled Card-Guessing Trials (High Controls)
  **The Scenario:** A young woman claims she can receive images from her deceased father. Your protagonist sets up a rigorous test. The woman is in one room; a sender (your hard-nosed physicist colleague, ironically) shuffles a deck of Zener-like cards (or standard playing cards) in another. The woman guesses the suits. She scores significantly above chance expectation over 500 trials. The physicist admits the controls were tight; no signaling was possible.
  **Running the Procedure:**
  *   **Phase 1 (Fact):** The physicist confirms the protocol was followed. *Pass.*
  *   **Phase 2 (Normal Causes):** Statistical deviation is too high for chance. Sensory leakage was blocked. *Pass.*
  *   **Phase 3 (Telepathy Pivot):** The sender is the physicist. He is alive. He is thinking of the cards. The woman is receiving the images.
  *   **Decision:** **CONFIRM TELEPATHY. DENY SURVIVAL.**
  *   **Reasoning:** The data proves mind-to-mind transmission. It does *not* prove the mind survives death. In fact, it provides a naturalistic explanation for future "spirit" communications (they are just telepathy from the living).
  *   **The Unwanted Verdict:** This is the case that hurts your protagonist. He *wants* this to prove survival. The procedure proves the opposite: it proves a natural law that makes survival unnecessary to explain the phenomena. He has advanced science but undermined his own hope. He must publish this as "Evidence for Thought-Transference," knowing it will disappoint his bereaved friend who funded the trials.

  #### Case 3: The Suspected Fraud (The Ethical bind)
  **The Scenario:** A medium produces a spectacular manifestation (a "spirit hand"). Your protagonist observes a thread attached to the wrist, but the lighting is poor, and he cannot seize it without causing a scene. The other sitters are ecstatic. If he accuses her now, she may destroy the evidence. If he waits, she may vanish.
  **Running the Procedure:**
  *   **Phase 1 (Fact):** He saw the thread. He knows the fact is fraudulent.
  *   **Phase 2 (Normal Causes):** Fraud is the cause.
  *   **Phase 3 (The Council Decision):** The procedure says "Reject." But the decision is about *publication* and *accusation*.
  *   **Decision:** **WITHHOLD PUBLICATION. DO NOT ACCUSE PUBLICLY.**
  *   **Reasoning:** Without physical possession of the fraudulent apparatus, an accusation is his word against hers. The Society's credibility cannot rest on a he-said-she-said regarding a trick in the dark.
  *   **Narrative Impact:** This forces him into silence. He knows the truth, but the procedure demands he treat it as "Unproven" rather than "Fraudulent" for the public record. He must watch his friend continue to pay this medium, unable to intervene without breaking the rules of evidence he himself wrote.

  ### Summary for the Novelist

  The utility of this procedure for your plot is that it acts as a machine that grinds down hope.

  1.  **It creates distance:** It allows your protagonist to say "I cannot conclude" rather than "I do not believe." This is the language of the agnostic, not the atheist.
  2.  **It isolates the human element:** Because the procedure cannot bridge the gap between Telepathy and Survival, the final step always returns to the man. When the data is ambiguous, he must choose whether to lean toward hope or caution. That is where the drama lies.
  3.  **The Ending:** If you want him to end where Sidgwick ended, the procedure should work perfectly. It should filter out the fraud, confirm the telepathy, and leave the question of survival eternally open. The tragedy is not that he found nothing; it is that he found *something* (telepathy) that was not enough to save him from his fear of death.

  The procedure cannot tell him how to live with that result. That is the one question you must leave for him to answer without a checklist.
