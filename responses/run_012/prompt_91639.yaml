  My friend Rachel and I have been arguing about the moral equality of combatants for weeks and we keep circling, so I'm hoping you'll just give me a number and show your work instead of another round of "it depends what you mean." The claim I actually care about is this: a soldier fighting for an unjust cause acts permissibly when he kills enemy soldiers who are fighting for a just cause, in the ordinary case where he's been lied to about the war, has no realistic way of finding out the truth, and would be imprisoned if he refused to fight. I'd put that at about 0.55, and I think the reason I can't go higher is that I'm never sure whether I'm defending a permission or just an excuse -- maybe what's true is that he's doing something wrong but isn't to blame for it, and I keep sliding between those two. Rachel is at about 0.1. Her line is that if the war is unjust then the killing is wrong, period, and the fact that he was decieved is a fact about him rather than about the act; she also suspects the traditional view is really a claim about what the law of armed conflict should say rather than about morality, and that a lot of the writing on this is people talking past each other on exactly that point.

  So: give me your own credence in that claim, then decompose it rather than just asserting it. I want the sub-questions you think it turns on, a rough number for each, and how they combine -- in particular, though not only, whether killing in war requires a just cause or only a non-culpable mistake about one; whether a soldier's ignorance can generate a permission or only an excuse; whether liability to be killed comes apart from culpability, so that he could be excused and still be a legitimate target; whether the state's superior information gives the soldier a genuine reason to defer to it, given that the state is the very party that started the unjust war; and how much weight to give to what happens to the institution if we stop treating combatants on both sides alike. Then tell me which term you're least confident in, which one my number is most sensitive to, and -- most useful to me -- where you think the disagreement between 0.55 and 0.1 actually lives. My guess is that it isn't the liability question at all but something upstream about whether 'wrong' and 'impermissible' are even the same thing here, but I'd like to be told I'm wrong if I am. For context I did a module on the ethics of war as an undergrad years ago and half of what I remember is probably bad, so don't assume I know the standard moves.
