answer: |-
  The High Court of Aionia sat in a chamber designed to look timeless, though everyone knew the building was only five years old. The air hummed with the quiet ventilation required for the servers storing the State's Temporal Registry. On the docket was *Thorne v. Vance*, a case that threatened to unravel the Continuity Act of 2041.

  Elara Vance sat at the petitioner's table. She was forty years old. Fifteen years prior, a younger Elara—driving a sedan, distracted by a notification—had run a red light and killed a pedestrian. Under the old law, Elara would have served time and carried the debt. But the Continuity Act had codified perdurantism for tort purposes. A legal person was defined as a four-dimensional space-time worm. Liability attached to the worm, but enforcement was collected from current temporal stages.

  Vance's counsel, representing the firm Chronos Cut, argued for "Temporal Severance." They had charged Vance a significant fee to legally decouple her current stage from the worm-segment existing fifteen years ago.

  "Your Honors," Vance's lawyer began. "The statute defines the person as a worm. A worm has parts. The part that committed the tort is distinct from the part sitting here today. They share no psychological continuity strong enough to warrant financial transfer. To force the present stage to pay for the past stage's error is to tax a stranger for a crime they did not commit."

  Marcus Thorne, representing the victim's family, stood slowly. "The statute says the person *is* the worm, not the stages. You cannot cut a worm and claim the tail is no longer part of the animal. The agency belongs to the extended entity. If you allow severance, you turn a life into a series of strangers passing a liability hot potato. The worm acted. The worm exists. The worm pays."

  The majority opinion, delivered by Justice Kael, sided with Thorne, but on narrow metaphysical grounds. Kael argued that while persons were worms, the worm was the minimal unit of liability. Severance was metaphysically incoherent under the Act; you cannot legislate the non-existence of a temporal part that once existed. The worm remains intact regardless of legal filings. Liability stood.

  But it was Justice Harrow's dissent that circulated through the law schools. Harrow was an known endurantist, a holdout from the era before the Continuity Act. She did not argue for severance. She argued against the ontology itself.

  "I dissent," Harrow wrote, her voice echoing in the transcript, "not because I wish to absolve Ms. Vance, but because this Court has no business legislating metaphysics. The majority treats the human being as a space-time worm, a static block extended in time. In doing so, they solve the problem of temporary intrinsics by slicing the subject into pieces. The worm is not 'guilty' simpliciter; rather, the t1-part is guilty, and the t2-part is innocent. This dissolves the agent."

  Harrow leaned into the microphone during the oral reading of her dissent. "The majority claims that by treating Vance as a worm, they preserve unity. They do not. They preserve only causal continuity. They turn a moral career into a genetic chain. If persistence is merely the relation between temporal parts, then repentance is impossible. The part that repents is not the part that sinned. They are distinct entities linked by causation. Punishment becomes mere causal management, like pruning a diseased branch."

  She paused, looking directly at Vance. "The law presupposes that properties are relations to times. 'Vance is guilty-at-t1' rather than 'Vance was guilty.' This is a convenient fiction for torts, but it is a disaster for responsibility. If Vance is wholly present at every moment of her life, then she carries her history as a substance carries its scars. She is not a worm composed of stages; she is a substance that endures. The law cannot cut her history away because her history is constitutive of who she is now."

  Thorne nodded slowly. Vance looked at her hands, wondering if the hands that held the steering wheel were truly different from the hands clasped in her lap. The Court had ruled against her severance. She would pay. But the metaphysical wound remained open: was she paying because she was the same person, or because the State needed a worm to bleed?

  ***

  **Author's Note**

  I am moderately confident in this reading of the debate, particularly regarding the problem of temporary intrinsics. The story attempts to show how perdurantism handles properties (relativized to times/parts) versus endurantism (wholly present substances). However, I am least sure about the representation of the endurantist position in the dissent. Some endurantists argue that speaking of "temporal parts" at all—even to deny their metaphysical reality—concedes too much to the perdurantist framework, as it accepts the coherence of dividing an object along the time axis. By having Justice Harrow argue against the "worm" model while accepting the court's terminology, I may have blurred the line between rejecting the ontology and rejecting the legal utility of that ontology. Additionally, I took a narrative liberty with "Temporal Severance." Metaphysically, one cannot sever a temporal dimension; I treated it as a legal fiction analogous to bankruptcy, which simplifies the metaphysical impossibility for the sake of the institutional conflict.
