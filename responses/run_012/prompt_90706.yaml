answer: |-
  Good evening. Welcome to the first graduation of the Prison College Program.

  Look at this room. Look at the sheet cake. Look at the families in the back row. You drove a long way. You wore your best clothes. You waited in lines to get through the gate. We see you. We thank you.

  Look at the graduates. Twenty men. Four years of work. No internet. No laptops. Just photocopies and arguing. You read hard books. You wrote hard papers. You came here after long days of labor and study until lights out. You did this.

  But we have a problem. I know you know it. Some of you heard it in class. We spent the last year talking about free will. We asked the question: Did you make yourself?

  Here is what we found. You do what you do because of who you are. You think, you choose, you act. But you do those things because of the mind you have. You have that mind because of your parents, your genes, your childhood, your neighborhood. You did not choose those things. You cannot be responsible for the start of the chain. If you cannot be responsible for the start, how can you be responsible for the end? How can you take credit for this degree?

  One of you asked me this last week. You said, "If nobody made himself, what exactly am I supposed to have done these last four years?"

  That is a fair question. It keeps me up at night. It would be easy to lie to you. It would be easy to say, "You pulled yourself up by your bootstraps. You are a self-made man." I will not say that. I do not believe it is true. You did not make the hands that held the pen. You did not make the brain that read the page.

  But I will not say the opposite either. I will not say this was luck. I will not say your effort is an illusion.

  Here is the truth. You cannot choose your starting point. You cannot choose your capacity. But you can show up. You can engage. You can let the work change you.

  Think about the reading. When you read a hard text, it fights you. It pushes against what you thought was true. You have to push back. You have to adjust. When you finish the book, you are not the same person who started it. Your mind has shifted. You did not build the mind from scratch. But you tended it. You pruned it. You watered it.

  That is what you did. You did not create yourself. You participated in your own shaping. You took the material you were given and you worked it. You made something useful out of it. That is not magic. That is labor. And labor is real, even if the worker is not self-made.

  Now, I need to speak to the warden and the correctional officers. You are sitting in the back. You are wearing the uniforms. You hold the keys. You keep this place safe. I know what you worry about. You worry that this program tells these men they are not responsible for their crimes. You worry we are making excuses. You worry we are saying, "He couldn't help it."

  Let me be clear. That is not what we are saying.

  Consequences are real. Rules are real. Safety is real. If a man breaks the law, he faces the law. If a man breaks the rules here, he faces the hole. I am not arguing against consequences. I am arguing about what happens inside the cell while the lock is closed.

  You require accountability. So do we. But we define it differently. You look backward. You ask, "Did you break the rule?" We look forward. We ask, "What will you do with the next hour?"

  You need them to be safe. We need them to be human. These things are not enemies. When a man learns to read, he learns to pause. When he learns to argue, he learns to listen. When he learns that his mind can change, he learns that his behavior can change. That makes your job easier. That makes this place safer.

  We are not erasing blame. We are widening the view. We are saying that a man is more than his worst act. He is also his best effort. You watch the worst act. We watch the best effort. Both are true. Both matter.

  To the families. You know the cost. You know the phone calls. You know the visits. You know the pain of the past. You also know the pride of today. Hold onto that. This degree does not erase the sentence. It does not open the gate. But it changes the man inside the gate. That changes what the sentence means.

  To the graduates. You are walking out of this room back to your cells. Some of you will be here for a long time. Some of you will never leave. I know that. I am not going to tell you that everything happens for a reason. I am not going to tell you that freedom is coming.

  I am going to tell you that the work matters.

  You asked what you did. You showed up. You fought with the text. You let the text fight back. You changed your mind. That is a real thing. It is not ultimate. It is not magic. But it is yours.

  You cannot control the world outside. You cannot control the laws inside. You cannot control the hand you were dealt. But you can play the hand. You can play it well. You can play it with honor.

  When you go back to your units, people will ask you what this was about. They will ask if it was worth it. They will ask if you are free now.

  Tell them the truth. Tell them you are not free. Tell them you are responsible.

  Tell them you did not make yourself. Tell them you are making yourself now.

  Tell them the work is hard. Tell them the work is real.

  Congratulations.

  ***

  This speech refuses to affirm that the graduates are metaphysically free or ultimately responsible for their existence, avoiding the "self-made man" myth while also refusing to dissolve their effort into mere luck or determinism. The single line carrying the most weight is "You did not make yourself. Tell them you are making yourself now," because it shifts responsibility from a static state of being to an ongoing practice of becoming, satisfying both the philosophical constraint and the need for agency.
