      *   **Addressing the COs/Warden:** This is crucial. Acknowledge safety and rules. Acknowledge that consequences exist regardless of metaphysics. Bridge the gap between "no ultimate blame" and "still need accountability."
      *   **Addressing the Graduates:** Validate the work. Reading, writing, arguing. It changed *who they are* now, even if they didn't choose the *capacity* to change.
      *   **Closing:** Look forward. Not freedom (since many are staying), but something else. Meaning. Connection.

      *   *Tone Check:* Short sentences. Plain words. No jargon. Honest but not depressing.

      *   *Key Insight:* The speech needs to redefine "making yourself." You don't make the clay, but you shape it. Or better: You don't choose the hand you're dealt, but you play the hand. (A bit cliché). Let's try: You didn't build the room, but you built the table. Or: The work isn't about becoming someone new from scratch, it's about tending to who you are.
      *   *Refining the Strawson angle:* Strawson says you can't be *ultimately* responsible. The speech should pivot to *shared* responsibility or *forward-looking* responsibility. The graduate's question ("What did I do?") is answered by: "You showed up. You fought with the text. You changed your mind." That is real, even if not metaphysically ultimate.

      *   *Addressing the COs:* "I know some of you worry this program tells men they aren't responsible for their crimes. That is not what we teach. We teach that what happens next is still up to them, even if the past was fixed." (Need to be careful not to contradict the哲学 too much, but practically, consequences matter). Actually, better: "Responsibility isn't about magic freedom. It's about answering to each other."

