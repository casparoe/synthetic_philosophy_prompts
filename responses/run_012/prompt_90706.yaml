      *   **Philosophical Conflict:** The director teaches free will/seminar. Believes Galen Strawson's Basic Argument (no ultimate responsibility because you can't be responsible for how you are). Standard commencement speeches credit graduates with making themselves (which the director thinks is false).
      *   **Goal:** Write a speech that is honest about the argument without being a lecture, doesn't dissolve work into luck, doesn't sound like a parole script, addresses the tension between blame and praise, and speaks to all audiences (especially the warden/COs and the graduates).
      *   **Specific Requirement:** At least one passage addressed squarely to the warden and officers.
      *   **Post-Speech Task:** 2-3 sentences explaining what the speech refuses to say and identifying the single line carrying the most weight.
      *   **Trigger:** A graduate asked, "If nobody made himself, what exactly is he supposed to have done these last four years?"

  2.  **Deconstruct the Philosophical Problem (Strawson's Basic Argument):**
      *   Premise 1: You do what you do because of how you are.
      *   Premise 2: To be ultimately responsible for what you do, you must be ultimately responsible for how you are.
      *   Premise 3: You cannot be ultimately responsible for how you are (infinite regress/initial conditions).
      *   Conclusion: You cannot be ultimately responsible for what you do.
      *   *Implication for Commencement:* Traditional speeches say "You worked hard, you chose this, you made yourself." The director believes this is metaphysically false.
      *   *Implication for Prison:* Traditional justice says "You chose crime, you deserve punishment." The director believes ultimate blame is unfounded.
      *   *The Trap:* If you deny ultimate responsibility, you risk denying agency entirely ("It was all luck"). This undermines the graduates' effort and the program's value. It also risks offending the COs who see safety/security as based on accountability.
      *   *The Solution:* Shift from *Ultimate Responsibility* (metaphysical) to *Practical Responsibility* (relational/social). Acknowledge the luck/conditions but honor the *effort* within those conditions. Focus on the *change* in "how you are" even if the capacity for change wasn't self-created. Address the graduate's question: "What did you do?" You engaged. You struggled. You changed the trajectory, even if you didn't build the engine.

  3.  **Audience Analysis:**
      *   **Graduates:** Need validation of their hard work without false flattery. Need to know their effort matters even if "free will" is shaky.
