answer: |-
  1. The maxim rhetorically invokes logical omniscience but functionally requires only a constructive awareness that statutes are accessible public facts. It treats the citizen as an idealized agent to justify administrative efficiency rather than demanding actual knowledge of every logical consequence.

  2. Mistake-of-fact and tax willfulness rules presuppose a bounded agent, creating a surface inconsistency that an "as-if" philosophy reconciles by treating the maxim as a deterrent fiction. This allows the system to demand compliance generally while exempting cases where punishing bounded reasoning would violate moral culpability principles.

  3. An awareness-set theory could license the practice without omniscience by distinguishing between knowing a statute exists and entertaining its specific application to one's conduct. This framework permits exceptions where the defendant's awareness set lacked the necessary legal proposition without requiring logically impossible worlds.

  4. Taking the gap between knowing and being aware seriously collapses the maxim into a negligence standard requiring proof that the defendant could have become aware. Jury instructions would shift from presuming knowledge to evaluating the reasonableness of the defendant's legal inquiry, fundamentally altering defense burdens.

  5. The practice is philosophically underdetermined in strict liability cases, where either an omniscience fiction or a policy-driven liability theory supports the same coercive result. The law stays silent on the epistemic mechanism here, permitting multiple logical frameworks to justify the outcome equally well.
