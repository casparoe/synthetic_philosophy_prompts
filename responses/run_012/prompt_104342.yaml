  # Worksheet: When to Trust the Pooled Table

  ### Case 1: The Fertilizer Trial (Pooled is Correct)
  **Context:** An agricultural trial compares Fertilizer A (Growth Hormone) vs. Fertilizer B (Standard). 
  **Goal:** Maximize total fruit yield per plant.
  **Variable Z:** Plant Height (Tall / Short). 
  **Structure:** $Fertilizer \to Height \to Yield$. Also $Fertilizer \to Yield$ (direct toxicity).
  **Diagram:** $X \xrightarrow{+} Z \xrightarrow{+} Y$ and $X \xrightarrow{-} Y$.

  **Data (100 plants per group):**
  | Group | Tall Plants | Short Plants | Yield (Tall) | Yield (Short) |
  | :--- | :---: | :---: | :---: | :---: |
  | **A** | 90 | 10 | 8 units | 2 units |
  | **B** | 10 | 90 | 10 units | 4 units |

  **Analysis:**
  *   **Pooled Yield:** 
      *   A: $(90 \times 8 + 10 \times 2)/100 = \mathbf{7.4}$
      *   B: $(10 \times 10 + 90 \times 4)/100 = \mathbf{4.6}$
      *   **Verdict:** A is better.
  *   **Stratified Yield:**
      *   Among Tall: B (10) > A (8).
      *   Among Short: B (4) > A (2).
      *   **Verdict:** B is better in every stratum.

  **Why Pooled is Right:** $Z$ (Height) is a **Mediator**. Fertilizer A works *by* making plants Tall. Stratifying by Height blocks this mechanism, asking "Which is better if we force height to be equal?" That is not the farming decision. We care about the **Total Effect**.
  **Randomization:** Yes. Fertilizer was assigned at random ($X \perp \text{Soil}$). Pooled table is unbiased for Total Effect.
  **Single Feature:** $Z$ is a descendant of $X$.
  **Remove/Swap:** If $Z$ were a Confounder (e.g., Soil Quality causing both Height and Yield), Pooled would be biased.
  **Student Pushback:** "But B is more efficient per inch of height!" 
  *Rebuttal:* True (Direct Effect), but irrelevant. You can't buy "efficiency," you buy yield. Unless you can fix height externally, A is the rational choice.

  ***

  ### Case 2: The Admissions Gap (Stratified is Correct)
  **Context:** Evaluating bias in Private vs. Public High Schools.
  **Goal:** Determine if Private Schools *cause* better college admission rates.
  **Variable Z:** Family Income (High / Low).
  **Structure:** $Income \to School$ and $Income \to Admission$.
  **Diagram:** $Z \xrightarrow{} X \xrightarrow{} Y$ and $Z \xrightarrow{} Y$.

  **Data (100 students per school type):**
  | Group | High Income | Low Income | Admit Rate (High Inc) | Admit Rate (Low Inc) |
  | :--- | :---: | :---: | :---: | :---: |
  | **Private** | 80 | 20 | 90% | 50% |
  | **Public** | 20 | 80 | 95% | 55% |

  **Analysis:**
  *   **Pooled Admit Rate:**
      *   Private: $(80 \times 0.9 + 20 \times 0.5)/100 = \mathbf{82\%}$
      *   Public: $(20 \times 0.95 + 80 \times 0.55)/100 = \mathbf{63\%}$
      *   **Verdict:** Private is better.
  *   **Stratified Admit Rate:**
      *   High Income: Public (95%) > Private (90%).
      *   Low Income: Public (55%) > Private (50%).
      *   **Verdict:** Public is better in every stratum.

  **Why Stratified is Right:** $Z$ (Income) is a **Confounder**. Rich families choose Private Schools and also secure Admissions via donations/legacy. The Pooled table mixes the effect of School with the effect of Wealth. Stratifying isolates the **Direct Effect** of the School.
  **Randomization:** No. School choice was self-selected based on Income ($X \not\perp Z$). Pooled table is confounded.
  **Single Feature:** $Z$ is a common cause of $X$ and $Y$.
  **Remove/Swap:** If $Z$ were a Mediator (e.g., School $\to$ Income $\to$ Admit), Stratified would block the benefit, making Pooled correct.
  **Student Pushback:** "But parents care about the 82% vs 63% gap! That's the real-world outcome."
  *Rebuttal:* That gap is mostly due to Income, not School. If you switch a low-income child to Private School without changing their income, their odds drop (50% vs 55%). The Pooled number sells a fantasy.

  ***

  ### Summary for the Argument
  *   **Case 1 (Mediator):** $X \to Z \to Y$. Conditioning on $Z$ blocks the causal path. **Trust Pooled.**
  *   **Case 2 (Confounder):** $Z \to X$ and $Z \to Y$. Conditioning on $Z$ blocks the backdoor path. **Trust Stratified.**
  *   **The Rule:** Don't ask "Is Z significant?" Ask "What is Z's role in the DAG?" If $Z$ is caused by Treatment, don't adjust. If $Z$ causes Treatment, you must adjust.
