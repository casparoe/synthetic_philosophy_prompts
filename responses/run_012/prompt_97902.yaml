answer: |-
  # Specification: Desiderata for a Contractualist Theory of Moral Aggregation

  **Scope:** This specification outlines the necessary conditions for a moral theory operating within the Scanlonian contractualist framework (justifiability to each person) to adequately handle problems of aggregation (when the claims of many outweigh the claim of one).

  **Objective:** To define the boundary conditions under which a principle can be said to be "reasonably rejectable" when burdens and benefits are distributed across different individuals.

  ---

  ## I. Substantive Requirements (Cases and Considerations)

  An adequate theory must yield determinate verdicts on the following paradigmatic cases.

  ### 1. The Protection of the Individual Against Severe Sacrifice
  *   **Motivating Case:** *The Transplant.* A surgeon can kill one healthy patient to harvest organs and save five dying patients.
  *   **Requirement:** The theory must forbid sacrificing an individual's fundamental interests (life, bodily integrity) solely because the sum of benefits to others is greater.
  *   **Status:** **Non-negotiable.** This is the core definitional constraint of contractualism. If the theory permits this, it ceases to be contractualist and becomes act-utilitarian.

  ### 2. Sensitivity to Cumulative Trivial Burdens
  *   **Motivating Case:** *Parfit's Clouds / Traffic Lights.* Many people suffer minute inconveniences (e.g., waiting at a red light) to prevent one person from suffering a catastrophic loss (e.g., death).
  *   **Requirement:** The theory must allow that a sufficiently large number of small burdens can outweigh a single large burden, provided the small burdens are not trivial to the point of insignificance.
  *   **Status:** **Contested (Camp Commitment).** Strict non-aggregationists (early Scanlon) reject this; moderate aggregationists (later Scanlon, Otsuka, Voorhoeve) accept it. An *adequate* theory generally needs to accommodate this to avoid absurdity, but it is not definitional to the framework.

  ### 3. The Rescue Case (Numbers Matter)
  *   **Motivating Case:** *Lifeboat.* You can save a group of five on Rock A or a group of one on Rock B. You cannot save both.
  *   **Requirement:** The theory must justify saving the greater number without treating the single person as a mere means.
  *   **Status:** **Non-negotiable (with caveats).** Any theory that mandates flipping a coin here (strict non-aggregation) is widely regarded as extensionally inadequate, even by many contractualists. However, *how* the numbers matter is contested.

  ### 4. The Limit on Aggregation (No Tyranny of the Trivial)
  *   **Motivating Case:** *Minor Aggregation.* Can a billion people's mild preference for vanilla ice cream outweigh one person's obligation to endure torture?
  *   **Requirement:** The theory must identify a threshold where the *type* of claim blocks aggregation, regardless of the number of claimants.
  *   **Status:** **Non-negotiable.** This distinguishes contractualism from total utilitarianism.

  ---

  ## II. Conceptual Distinctions (Must Not Collapse)

  An adequate theory must maintain conceptual separation between the following pairs. Collapsing them constitutes a theoretical failure.

  ### 1. Concentrated vs. Dispersed Harm
  *   **Distinction:** Inflicting 100 units of harm on one person vs. inflicting 1 unit of harm on 100 people.
  *   **Requirement:** The theory must treat the concentrated harm as generating a stronger individual complaint than any single instance of the dispersed harm, even if the total utility loss is identical.
  *   **Status:** **Non-negotiable.** Contractualism is fundamentally concerned with the strength of the individual complaint, not the sum of disvalue.

  ### 2. Numbers as Tie-Breaker vs. Numbers as Weight
  *   **Distinction:** Do numbers break a tie between equal claims (Scanlon's *What We Owe* view), or do they increase the strength of the claim itself (Utilitarian/Aggregationist view)?
  *   **Requirement:** The theory must explicitly state which mechanism it employs. It cannot equivocate.
  *   **Status:** **Contested.** This is the primary fault line in contemporary contractualism.

  ### 3. Aggregation Across Persons vs. Across Times (Prudence)
  *   **Distinction:** I suffer now so *I* benefit later (Prudence) vs. I suffer now so *You* benefit later (Morality).
  *   **Requirement:** The theory must not apply the same aggregation rules to intrapersonal trade-offs as it does to interpersonal trade-offs.
  *   **Status:** **Non-negotiable.** Contractualism is a moral theory regarding relations between persons, not a theory of rational choice for a single life.

  ### 4. Ex Ante Risk vs. Ex Post Outcome
  *   **Distinction:** Imposing a 1% risk of death on everyone (ex ante) vs. imposing death on one specific person (ex post).
  *   **Requirement:** The theory must account for the complaint against risk imposition distinct from the complaint against actual harm.
  *   **Status:** **Contested.** Some contractualists argue risk imposition is justified if ex ante expected benefit is positive; others argue ex post actual harm generates the only valid complaint.

  ### 5. Internal vs. External Benefits (Reciprocity)
  *   **Distinction:** A scheme where those who bear the burden also share in the benefit (e.g., taxation for roads) vs. a scheme where the burdened group is distinct from the beneficiary group (e.g., slavery).
  *   **Requirement:** The theory must treat reciprocal burden-sharing as easier to justify than pure sacrifice.
  *   **Status:** **Non-negotiable.** Justifiability relies on the possibility of mutual recognition; pure exploitation is inherently unjustifiable.

  ---

  ## III. Structural Constraints

  ### 1. The Individual Address Constraint
  *   **Requirement:** Justification must be addressed *to* the individual who bears the burden. It is insufficient to justify a policy to "society" or "the collective." The reasoning must be intelligible and acceptable from the standpoint of the loser.
  *   **Status:** **Non-negotiable.** This is the definition of Scanlonian contractualism.

  ### 2. The No-Substitution Constraint
  *   **Requirement:** One person's complaint cannot be simply cancelled out by another's satisfaction. Complaints are compared, not netted.
  *   **Status:** **Non-negotiable.**

  ---

  ## IV. Compatibility Analysis (The Impossibility Result)

  **Finding:** There is a genuine, unresolved tension between specific subsets of the requirements above. This is not a bug to be smoothed over, but a structural feature of the problem space.

  **The Incompatibility Triangle:**
  The following three demands appear jointly unsatisfiable under a strict interpretation of the Individual Address Constraint:

  1.  **Strict Individualism:** A principle is rejectable if *any single individual* has a stronger complaint than anyone else has against rejecting it (The Individualist Restriction).
  2.  **Significant Aggregation:** The claims of many (even with smaller individual burdens) can sometimes outweigh the claim of one (with a larger burden), beyond mere tie-breaking.
  3.  **Individual Address:** Justification must be made to the person bearing the burden, not to the group.

  **Analysis of Tension:**
  *   If you hold **(1) and (3)**, you must reject **(2)**. (This leads to the counter-intuitive result that you should flip a coin between saving one person and saving five, because the one person on the smaller rock can reasonably reject a principle that sacrifices them for the sum of others).
  *   If you hold **(2) and (3)**, you must weaken **(1)**. (You must allow that the *sum* of complaints can outweigh a *single* complaint, which risks treating the individual as a vessel for value rather than a sovereign justifier).
  *   If you hold **(1) and (2)**, you must violate **(3)**. (You justify the sacrifice to the collective, not the individual sacrificed).

  **Result:** An adequate contractualist theory must explicitly concede which of these three horns it accepts. It cannot satisfy all three simultaneously. Most contemporary "Moderate Contractualists" choose to weaken **(1)** (allowing aggregation of relevant claims) to preserve **(2)** and **(3)**. Strict "Non-Aggregationists" preserve **(1)** and **(3)** but sacrifice **(2)**.

  ---

  ## V. State of the Field: Settled vs. Contested

  ### Settled Consensus
  1.  **Rejection of Pure Utilitarianism:** It is settled among contractualists that sum-maximization without regard for distribution is inadequate.
  2.  **Primacy of the Individual:** It is settled that the unit of moral concern is the individual person, not the group.
  3.  **Relevance of Numbers:** It is largely settled that numbers must matter *somehow* (even if only as tie-breakers), as strict non-aggregation (coin-flipping in Lifeboat cases) is widely rejected as implausible.

  ### Genuinely Contested
  1.  **The Mechanism of Aggregation:** There is no consensus on *how* numbers matter.
      *   *Camp A (Tie-Breakers):* Numbers only break ties between equal individual claims (Scanlon 1998).
      *   *Camp B (Relevance View):* Numbers matter only when the individual burdens are "relevantly" similar (Voorhoeve, Frowe).
      *   *Camp C (Moderate Aggregation):* Small burdens can aggregate to outweigh large burdens if the number is high enough, provided the large burden does not cross a threshold of severity (Otsuka, later Scanlon).
  2.  **The Role of Risk:** There is no consensus on whether ex ante risk imposition is justified by ex ante expected benefits to the same group, or if ex post harm vetoes the principle.
  3.  **The Threshold of Severity:** There is no agreed-upon metric for determining when a burden is too severe to be aggregated against (the "Category Mistake" line).

  **Conclusion:** Any specification claiming to resolve the tension between Individual Address and Significant Aggregation without acknowledging the incompatibility outlined in Section IV is theoretically deficient. The tension is a feature of the moral landscape, not a failure of analysis.
