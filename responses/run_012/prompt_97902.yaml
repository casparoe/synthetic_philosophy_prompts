      *   Tension: Aggregation (summing up small benefits to outweigh a large cost) vs. Individualism (one person's veto power against being sacrificed).

  3.  **Drafting the Requirements (Cases/Considerations):**
      *   *Case 1: The Great Burden (One vs. Many).* Classic "Transplant" or "Jim and the Indians." One person dies to save five. Contractualism usually says no. *Requirement:* Protection against severe individual sacrifice for diffuse gains.
      *   *Case 2: Small Burdens (Many vs. One).* "Parfit's Clouds" or "Traffic Lights." Many suffer tiny inconveniences to save one from death. Intuition: Numbers matter here. *Requirement:* Sensitivity to cumulative small burdens.
