answer: |-
  ### Adequacy Conditions for the Wrong Kind of Reasons Problem

  The following desiderata outline the conditions any theory must meet to adequately address the tension between fitting-attitude analyses of value and the existence of reasons for attitudes that do not track fittingness. These conditions are derived from the framing provided, covering the full range of attitudes (doxastic, emotional, conative) and incorporating the proposed third category of positional reasons.

  #### 1. The Classification Requirement
  **Description:** The theory must provide a non-circular method for sorting any given reason for an attitude into one of three categories: object-given, state-given, or positional. It cannot define object-given reasons simply as "those that make the attitude fitting," as fittingness is the notion being analyzed.
  **Motivating Case:** The Evil Demon. The threat of punishment is a reason to admire the demon. A theory must classify this without relying on the prior intuition that the demon is not admirable. It must identify a structural feature of the reason (e.g., its content, its source, or its relation to the attitude) that distinguishes it from the reason provided by the demon's actual power or charisma.
  **Status:** Non-negotiable for any theory attempting to solve the problem. A dissolver (who denies the distinction) may reject the requirement, but must explain why the classification intuition is mistaken.

  #### 2. The Transmission Requirement
  **Description:** The theory must explain *why* reasons of the "wrong kind" (typically state-given) fail to render an attitude fitting, without merely stipulating that they do not. It must articulate the barrier that prevents practical or pragmatic reasons from constituting evidence of value or correctness.
  **Motivating Case:** The Demon Case (again). You have a reason to admire. If reasons for attitudes generally determine fittingness, the demon should be admirable. The theory must explain the blockage. Why does the threat justify the *attempt* to admire, or the *wish* to admire, but not the admiration itself?
  **Status:** Non-negotiable for fitting-attitude theorists. A deflationist who argues that "reason" is ambiguous between two distinct predicates satisfies this by denying there is a single notion of "fittingness" for the reasons to transmit to.

  #### 3. The Bootstrapping Requirement
  **Description:** The theory must prevent an agent from making an attitude fitting merely by manipulating the circumstances that generate state-given reasons. An agent cannot create value ex nihilo by arranging incentives for their own attitudes.
  **Motivating Case:** The Saucer of Mud. If an agent pays themselves a large sum to desire a saucer of mud, they have created a strong state-given reason for the desire. If this reason made the desire fitting, the mud would become valuable simply because the agent bribed themselves. The theory must rule this out.
  **Status:** Non-negotiable. Any theory allowing agents to bootstrap value through attitude-manipulation collapses the distinction between value and the consequences of valuing.

  #### 4. The Neutrality Requirement
  **Description:** The framework must not presuppose that the "wrong kind of reasons" problem is genuine in a way that excludes deflationary accounts. Specifically, it must allow for the possibility that talk of "reasons for attitudes" is ambiguous between two distinct relations (e.g., *reasons-for-fittingness* and *reasons-for-holding*), provided the theory explains the systematic nature of that ambiguity.
  **Motivating Case:** The Ambiguity Intuition. Some argue that when we say the demon gives us a "reason" to admire, we are using a different sense of "reason" than when we say the demon's courage gives us a "reason" to admire. A theory should not rule this out by definition but must demand that the ambiguity be principled rather than ad hoc.
  **Status:** Non-negotiable for a general meta-theoretical framework. It ensures the criteria test the *explanatory power* of a view rather than its allegiance to a specific ontology of reasons.

  #### 5. The Fittingness Independence Constraint
  **Description:** A fitting-attitude analysis must not make the fittingness of an attitude depend on facts about the attitude's existence, consequences, or the agent's holding of it. Fittingness must be determined by the relation between the attitude and its object, not the attitude and the world.
  **Motivating Case:** Circular Analysis. If value is defined as the fittingness of an attitude, and fittingness is determined by the good consequences of having that attitude, then value is defined as the good consequences of valuing it. This renders the analysis circular or collapses it into a form of consequentialism about mental states.
  **Status:** Non-negotiable for proponents of the fitting-attitude analysis. A view that rejects the fitting-attitude analysis of value entirely may disregard this constraint.

  #### 6. The Scope Requirement
  **Description:** The theory must apply uniformly across the taxonomy of attitudes, including belief, desire, admiration, amusement, gratitude, hope, intention, and blame. It cannot solve the problem for emotions by appealing to features unique to emotion (e.g., phenomenology) if those features are absent in belief or intention.
  **Motivating Case:** Pragmatic Encroachment in Epistemology. Just as the demon gives reasons to admire, a threat can give reasons to believe (e.g., believe the earth is flat or be harmed). If the theory handles the emotional case by appealing to "feelings of correctness" but offers no parallel for belief (which lacks such phenomenology), it fails to provide a unified account of the problem.
  **Status:** Non-negotiable given the framing. A theory that works only for emotions is a partial solution, not a solution to the general problem.

  #### 7. The Positional Distinctness Requirement
  **Description:** The theory must determine whether "positional reasons" constitute a third, irreducible category or collapse into object-given or state-given reasons. If they are distinct, the theory must explain whether they behave like object-given reasons (making attitudes fitting) or state-given reasons (providing reasons without fittingness).
  **Motivating Case:** The Parent's Pride. A parent has reason to feel pride in a child's achievement grounded in their relationship, not merely the child's properties (object) nor the benefits of pride (state). If this reason makes pride *fitting*, it challenges the idea that only object-properties determine fittingness. If it does not, it is a new kind of wrong-kind reason.
  **Status:** Investigative. This is a test for the proposed three-way taxonomy rather than a constraint on all theories, but any theory adopting the taxonomy must satisfy it.

  ---

  ### Incompatibilities and Theoretical Costs

  **Joint Unsatisfiability:**
  The **Neutrality Requirement** and the **Fittingness Independence Constraint** cannot be jointly satisfied by a single substantive theory of value, though they can be satisfied by a meta-theoretical framework.
  *   *Reason:* The Fittingness Independence Constraint presupposes the truth of the fitting-attitude analysis (or at least that fittingness is a coherent, singular property to be protected). The Neutrality Requirement demands space for a deflationist who denies that "fittingness" is the relevant target, arguing instead that there are simply two different normative relations. A theory that enforces the Constraint effectively rules out the deflationist view the Neutrality Requirement is meant to accommodate. To satisfy both, one must treat the list as a menu for competing camps rather than a checklist for a single view.

  **The Hardest Requirement:**
  The **Transmission Requirement** eliminates the most otherwise plausible theories.
  *   *Reason:* Many theories can classify reasons (Classification) and prevent bootstrapping (Bootstrapping) by stipulation. However, explaining *why* the demon's threat does not make admiration fitting is the core difficulty. Views that appeal to the "content" of the reason often fail when the content is manipulated to look object-like. Views that appeal to the "type" of reason often beg the question. Providing a non-circular principle that blocks transmission without simply asserting the conclusion is the primary point of failure for most accounts.

  **The Status of the Positional Category:**
  The **Positional Category** likely collapses into the **State-Given** category, but it reveals a deficiency in standard definitions of state-given reasons.
  *   *Analysis:* Standard state-given reasons are typically cashed out in terms of the *benefits* or *consequences* of holding the attitude (e.g., avoiding punishment, gaining reward). Positional reasons (e.g., a promise to feel grateful, a soldier's duty to feel shame) are not necessarily about the *goodness* of the state for the agent, but about the *normative status* of the agent relative to the attitude.
  *   *Collapse:* However, these positional reasons can be reformulated as state-given: "You have reason to feel shame because it is good to be a soldier who feels shame for the unit." This turns the role-based obligation into a value judgment about the state of the agent.
  *   *Implication:* If positional reasons collapse into state-given reasons, they generate the standard Wrong Kind of Reasons problem (they give reasons but arguably do not make the attitude fitting). However, if one argues that a parent *ought* to feel pride and that this "ought" implies fittingness, then positional reasons might actually be a subset of **Object-Given** reasons, where the "object" includes the relational context (the child-as-mine). If they are Object-Given, they do not generate a WKR problem but rather expand the notion of an attitude's object. The framing's three-way taxonomy is unstable unless it clarifies whether positional reasons confer fittingness. If they do, they belong with Object-Given; if they do not, they belong with State-Given.

  **Bias in the Desiderata:**
  The list carries a significant bias toward the **Fitting-Attitude Camp**.
  *   *Source of Bias:* The **Bootstrapping Requirement** and the **Fittingness Independence Constraint** are protective measures designed specifically to save the fitting-attitude analysis from collapse. A theorist who denies that value should be analyzed in terms of fitting attitudes has no reason to accept these constraints; for them, if incentives make an attitude rational, that may be all there is to "value" in that context.
  *   *Source of Bias:* The **Transmission Requirement** presupposes that there is a property (fittingness) that reasons *ought* to track but sometimes fail to. A deflationist who believes there are just two different kinds of reasons (normative vs. pragmatic) would reject the framing that one kind is "wrong" or fails to "transmit." They would argue both kinds transmit to their respective normative conclusions (one to fittingness, one to rationality of holding).
  *   *Correction:* The **Neutrality Requirement** is the only condition explicitly designed to mitigate this bias, but it functions more as a caveat than a substantive constraint on the theory's output.

  ### Vulnerability Note

  A **fitting-attitude analysis** is most vulnerable on the **Transmission Requirement**. It struggles to explain why the demon's threat is excluded from fittingness without relying on intuitions that already assume the conclusion (that the demon isn't admirable). If it cannot provide a structural distinction between object-given and state-given reasons that is independent of fittingness, the analysis collapses into circularity.

  A **view that denies value should be analyzed in terms of fitting attitudes** is most vulnerable on the **Bootstrapping Requirement**. If value is not tethered to the fittingness of an attitude (which looks outward to the object), but rather to the reasons for holding the attitude (which can look inward to consequences), it becomes difficult to explain why we cannot make things valuable simply by creating incentives to value them. Such a view risks making value entirely agent-relative and manipulable, losing the normative grip that makes value philosophically significant.
