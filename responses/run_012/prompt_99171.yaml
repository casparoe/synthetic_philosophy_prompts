  *   *EO Counter:* "Then it's not the *same* life-plan. 'Doctor-for-A' is different from 'Doctor-for-B'."
  *   *My Counter:* That makes the view tautological. If every social context difference makes the "life-plan" different, the menu is always unique to the person, making comparison impossible. This is a fatal metaphysical objection. I will use this.

  *(Refining the Ranking)*
  1.  **The Individuation Problem (Fatal):** If "life-plan" includes all contextual features, comparison is impossible. If it doesn't, it misses social reality.
  2.  **The Epistemic Black Box (Fatal/Practical):** We can't know reflective endorsement.
  3.  **The Status/Recognition Gap (Serious):** Misses relational equality.
  4.  **The Collapse (Moderate):** It's just OFW or CA in disguise.
  5.  **The Measurement Cost (Awkward):** Too hard to implement.

