prompt: |-
  ok so we did Simpson's paradox in stats and every explanation I can find stops exactly when it gets interesting. I have a real one off our team's stat sheet: Jay shoots a better percentage than Sam in the first half and also better in the second half, and still ends up with the worse percentage for the whole game, which I think is because of how many shots each of them takes in each half. And then the famous ones — the college admissions case where the overall numbers look like bias against women applicants but it mostly goes away once you break it down by department, the kidney stone one where one surgery beats the other for small stones and also for large stones but loses when you lump everybody together, the one where two statisticians look at the same data about kids' weight gain and reach opposite conclusions and both are apparently right, and the hospital thing where two diseases look linked only because having either one is what puts you in the hospital.

  Before you tell me which table to believe, I want the spec first. Write me the list of what any decent account of this has to actually deliver: the cases it has to get right, the distinctions it cant collapse (I know one of them is between a variable that causes the other two and a variable that both of the other two cause, but I definately dont know what to do with that), the bits of math it cant contradict, and the questions it has to really answer instead of dodging.

  For each item, say which case or consideration makes it a requirement, and mark which ones are real requirements versus just habits of one camp (always break it down by every subgroup, never aggregate, just be Bayesian about it, always draw the causal arrows first). Then flag any two requirements you think cant both be met — I have a suspicion theres at least one pair, something like wanting a rule that tells you which table is right while also refusing to assume anything about what causes what.

  After the list, one line each on how the usual advice does against it: break everything down by every variable, report only the top-level number, and the causal-arrows-first answer where the paradox is supposed to dissolve. Dont rank them, I just want to see which requirement each one trips over. Keep it to the list and those lines, no history of the whole debate, and if a requirement needs math I havent had yet just say so and keep that part short.
reasoning: |-
