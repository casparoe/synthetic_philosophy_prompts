          *   Keep math short if advanced.
          *   Tone: Direct, analytical, respecting the user's statistical literacy (they know terms like "variable that causes the other two").

  2.  **Deconstruct Simpson's Paradox & The "Spec":**
      *   What *is* SP mathematically? It's an inequality reversal upon aggregation. $\frac{a}{b} > \frac{c}{d}$ and $\frac{e}{f} > \frac{g}{h}$ but $\frac{a+e}{b+f} < \frac{c+g}{d+h}$. This is purely arithmetic.
      *   What *is* the paradox? It's the conflict between intuition (if A is better than B in groups, A should be better overall) and reality.
      *   What is the resolution? It depends on the *causal structure*. Aggregation is correct if the grouping variable is a collider or irrelevant. Disaggregation is correct if the grouping variable is a confounder.
      *   User's specific pain point: Explanations stop at "look, the numbers flip." They want to know *which numbers to trust*.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Arithmetic.* Must acknowledge the reversal is mathematically inevitable given certain weights.
          *   Case: Jay vs. Sam (Basketball).
          *   Type: Real Requirement.
      *   *Requirement 2: Causal Distinction.* Must distinguish between Confounding (Z causes X and Y) and Colliders/Mediators (X causes Z or Y causes Z).
          *   Case: Berkeley (Confounding) vs. Berkson's (Collider).
          *   Type: Real Requirement.
      *   *Requirement 3: Actionability.* Must tell the user which number to use for decision-making.
          *   Case: Kidney Stones (Treatment choice).
          *   Type: Real Requirement.
      *   *Requirement 4: Non-Collapsibility.* Must acknowledge that "average of ratios" $\neq$ "ratio of averages."
          *   Case: Jay vs. Sam (Weights).
          *   Type: Real Requirement.
      *   *Requirement 5: Context Dependence.* Must admit data alone isn't enough; external knowledge is needed.
          *   Case: Lord's Paradox (Weight gain).
          *   Type: Real Requirement.

      *   *Refining the "Habits vs. Real" distinction:*
          *   "Always break down by subgroup" is a habit (fails in Berkson's).
          *   "Always aggregate" is a habit (fails in Berkeley).
          *   "Draw causal arrows" is a method, but is it a requirement? Yes, because without it, you can't solve it.
          *   "Be Bayesian" is a camp habit (frequentists solve it too via causal inference).

      *   *Identifying the Incompatible Pair:*
          *   The user hinted at this: "wanting a rule that tells you which table is right while also refusing to assume anything about what causes what."
          *   Pair: (1) Provide a purely data-driven rule for which table to trust vs. (2) Acknowledge that causal structure determines the correct table.
          *   Why incompatible? Because the data *alone* (the tables) are consistent with multiple causal structures. You can't have a data-only rule that selects the correct causal interpretation.

  4.  **Drafting the Evaluation of Usual Advice:**
