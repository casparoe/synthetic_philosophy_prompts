answer: |-
  ### Specification for a Decent Account of Simpson's Paradox

  **1. The Arithmetic Constraint**
  *   **Requirement:** Must demonstrate that the reversal is a necessary consequence of weighted averages, not a calculation error.
  *   **Driving Case:** Jay vs. Sam (Basketball shot distribution).
  *   **Type:** Real Requirement.
  *   **Math Note:** If $n_{1A} \gg n_{2A}$ and $n_{2B} \gg n_{1B}$, the overall average is pulled toward the subgroup with the larger sample size, regardless of the rates.

  **2. The Causal Direction Distinction**
  *   **Requirement:** Must distinguish between a grouping variable that is a *confounder* (causes treatment and outcome) versus a *collider* (caused by treatment and outcome) or *mediator*.
  *   **Driving Case:** Berkeley Admissions (Confounder) vs. Berkson's Paradox (Collider/Hospitalization).
  *   **Type:** Real Requirement.
  *   **Math Note:** Conditioning on a collider induces correlation where none exists; conditioning on a confounder removes bias.

  **3. The Decision Rule**
  *   **Requirement:** Must explicitly state which number (aggregate or stratified) governs the decision or prediction.
  *   **Driving Case:** Kidney Stones (Choosing the surgery).
  *   **Type:** Real Requirement.
  *   **Math Note:** The "correct" number is the one that estimates the causal effect $P(Y | do(X))$, not necessarily the conditional probability $P(Y | X)$.

  **4. The Data-Insufficiency Acknowledgement**
  *   **Requirement:** Must admit that the tables alone cannot determine which number is correct; external context is mandatory.
  *   **Driving Case:** Lord's Paradox (Weight gain/sex).
  *   **Type:** Real Requirement.
  *   **Math Note:** Identical covariance matrices can support opposite causal conclusions depending on the timeline of variables.

  **5. The Intuition Explanation**
  *   **Requirement:** Must explain *why* the aggregation intuition fails (i.e., why we expect ratios to be additive when they are not).
  *   **Driving Case:** Jay vs. Sam (Why "better in both halves" feels like "better overall").
  *   **Type:** Real Requirement.
  *   **Math Note:** Human intuition treats percentages as absolute quantities rather than ratios dependent on denominators.

  **6. The "Always Disaggregate" Prohibition**
  *   **Requirement:** Must explicitly forbid breaking down data by every available variable.
  *   **Driving Case:** Berkson's Paradox (Disease linkage in hospitals).
  *   **Type:** Real Requirement.
  *   **Habit Check:** "Always break it down by every subgroup" is a **Habit of One Camp** (Naive Empiricist) and must be rejected here.

  **7. The "Purely Statistical Solution" Prohibition**
  *   **Requirement:** Must refuse to provide a formula that selects the correct table without causal input.
  *   **Driving Case:** All cases (Data is compatible with multiple graphs).
  *   **Type:** Real Requirement.
  *   **Habit Check:** "Just be Bayesian about it" is a **Habit of One Camp**; priors help, but causal structure is the switch, not the prior.

  ***

  **⚠️ FLAGGED INCOMPATIBLE PAIR:**
  You cannot meet **Requirement 3 (The Decision Rule)** and **Requirement 7 (The "Purely Statistical Solution" Prohibition)** simultaneously if you demand the rule be derived *only* from the dataset provided.
  *   **Conflict:** Users want a rule that says "Look at the variance" or "Look at the sample sizes" to pick the right table (Req 3). But the math proves the same numbers can represent both a confounder scenario and a collider scenario (Req 7).
  *   **Resolution:** The account must tell the user that wanting a data-only rule is the error, not the paradox.

  ***

  ### Evaluation of Usual Advice

  **"Break everything down by every variable"**
  *   Trips over **Requirement 2 & 6**: It creates bias in collider cases (Berkson's) by conditioning on an effect.

  **"Report only the top-level number"**
  *   Trips over **Requirement 2 & 3**: It hides confounding bias (Berkeley/Kidney Stones) and leads to wrong decisions.

  **"The causal-arrows-first answer"**
  *   Trips over **Requirement 7 (as commonly desired)**: It refuses to give a answer based *solely* on the stat sheet, requiring external knowledge users often don't have.
