  ### The Case: The Apex Pension Diversion

  In 1974, Apex Logistics, a regional trucking firm, instituted an employee stock-ownership plan (ESOP) funded by a mandatory 5% payroll deduction. While all drivers contributed, the founder, Arthur Vance, systematically funneled the contributions of Black drivers into a private holding account rather than the trust, purchasing shares in their names but retaining the voting rights and dividends for himself. Vance died in 1990; the company remained in the family and grew into a regional monopoly, while the excluded drivers retired into poverty. Today, Apex proposes a settlement: transferring 15% of current firm equity to a trust for the descendants of the excluded drivers. A Rawlsian supports this because the current wealth gap between the Vance heirs and the drivers' descendants violates Fair Equality of Opportunity and fails to maximize the position of the least advantaged (the Difference Principle). A Nozickian entitlement theorist supports this specific transfer not because of the gap, but because the Vance family's current equity title is tainted by the initial fraudulent acquisition; the transfer is not redistribution but *rectification*, restoring the counterfactual holdings the drivers would have accumulated had the original transfer rules been followed.

  ***

  ### Analysis of Convergence and Divergence

  **The Theorists' Positions**
  The Rawlsian argues from the *end-state*: the current distribution is unjust because it reflects morally arbitrary contingencies (race) that have compounded into entrenched class disadvantage. The transfer is justified because it moves society closer to a structure where social and economic inequalities are arranged to the greatest benefit of the least advantaged. The history matters only insofar as it explains the current inequality; if the same inequality arose from pure luck, the Rawlsian might still demand redistribution.

  The Nozickian argues from the *history*: the current distribution is unjust because the chain of title is broken. The Vance heirs hold assets that were acquired through fraud (a violation of the principle of transfer). The transfer is justified solely to correct that specific violation. If the drivers were currently wealthy but still owed that equity, the Nozickian would still demand the transfer; if the drivers were poor but the equity was justly acquired, the Nozickian would forbid it.

  **The Load-Bearing Feature**
  The feature that holds the agreement together is the **traceability of the specific assets to the specific rights violation**. The 15% equity stake corresponds to the compounded value of the diverted contributions.

  **The Peel-Apart Test**
  Remove the traceability: Suppose the 1974 records were lost, and we cannot prove which specific capital grew from the diverted wages, only that the drivers are currently poorer than the shareholders due to historical discrimination.
  *   **The Rawlsian** remains unmoved. The current pattern of inequality persists, and the drivers remain among the least advantaged. The redistribution is still required to satisfy the Difference Principle.
  *   **The Nozickian** must withdraw support. Without the ability to establish the counterfactual ("what would they have now?") or trace the specific unjust holdings, the principle of rectification cannot be applied without arbitrarily violating the property rights of the current shareholders. For the Nozickian, uncertainty defaults to the status quo title; for the Rawlsian, uncertainty defaults to the pattern.

  ***

  ### The Entitlement Defense and Objections

  A defender of entitlement theory will resist this case by arguing that the agreement is a **coincidence of arithmetic, not principles**. Their natural move is to challenge the *remedy*. They will argue that rectification requires restoring the *victim* to their counterfactual position, not necessarily stripping the *current holder* of the exact asset if that holder is an innocent purchaser (e.g., later shareholders who bought stock in good faith). They might contend that the remedy should come from Vance's estate specifically, not the firm's general equity, to avoid violating the rights of innocent third parties who bought shares later.

  **Does the move succeed?**
  It succeeds in clarifying the theoretical distinction but threatens the practical outcome. If the firm's equity has been traded to innocent third parties, the strict Nozickian position creates a conflict between the rights of the victims (to rectification) and the rights of innocent purchasers (to security of title). Nozick admits this is a "hard case." However, if the firm is treated as a continuous corporate entity that itself committed the fraud (rather than just Vance), the claim holds against the firm's surplus. The move succeeds in showing that the Nozickian support is *conditional* on the purity of the asset chain, whereas the Rawlsian support is *unconditional* regarding the asset chain. The agreement is fragile for the Nozickian, robust for the Rawlsian.

  ***

  ### The Problem of the Dead Wrongdoer

  The case survives the death of the wrongdoer only if the **obligation attaches to the holdings, not the person**. For the entitlement theorist, rights are side-constraints on actions and holdings. If the assets (the equity growth) are the direct fruit of the violation, they carry the "taint" regardless of who holds them.

  **Who owes the remedy?**
  The theory holds that the *current holders of the unjustly acquired assets* owe the remedy, based on the principle that one cannot hold a valid title to stolen goods, even if one bought them innocently (though Nozick suggests compensation might be owed to the innocent purchaser by the rectification process). In this scenario, the obligation falls on the **firm as a continuing legal entity** and its current equity holders. Because the firm itself was the vehicle of the fraud and the asset (the capital) remained within the corporate structure, the corporate entity owes the debt. If the holdings had been fully dispersed and consumed by Vance's heirs with no traceable assets remaining, the Nozickian claim would dissolve (there is nothing to rectify), whereas the Rawlsian claim would persist (the pattern of inequality remains). This highlights the crucial difference: Rectification is a claim on *specific history*; Distributive Justice is a claim on *current status*.
