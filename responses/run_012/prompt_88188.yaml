      *   **Thesis:** Fragility is fundamentally an intrinsic causal power grounded in microstructure, not merely a conditional prediction of behavior. The fink cases demonstrate the failure of the Simple Conditional Analysis (SCA), not the failure of intrinsic realism. However, to make sense of ordinary usage, we must distinguish between *possessing* a disposition and the *likelihood of its manifestation*.
