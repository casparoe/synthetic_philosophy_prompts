          2.  **The Failure of Behaviorism (SCA):** Show why defining fragility solely by "breaking when struck" fails in fink cases.
          3.  **The Case for Intrinsic Powers:** Argue that microstructure determines the causal potential. The fink is an external interferer.
          4.  **Addressing the Objection:** The "Distinction without a Difference" objection (If it never breaks, why call it fragile?). Rebuttal: Modal depth (what happens if the fink is removed) and explanatory power.
          5.  **Conclusion:** Reiterate that fragility is a real power, not a behavioral summary.

