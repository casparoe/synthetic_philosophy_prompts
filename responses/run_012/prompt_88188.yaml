answer: |-
  **The Finkish Nature of Fragility: Powers, Structures, and Conditionals**

  The thought experiment of the two finkish vases presents a profound challenge to our understanding of dispositional properties. Vase A possesses the microstructure of fragile glass but is protected by a device that toughens it upon impact; Vase B possesses the microstructure of toughened glass but is sabotaged by a device that shatters it upon impact. In both cases, the device is reliably attached for the vase's entire existence. The intuitive puzzle is immediate: Is Vase A fragile? Is Vase B? The answer depends entirely on what we take "fragility" to be. Is it a matter of intrinsic constitution, behavioral outcome, or something more metaphysically robust? By weighing these options, it becomes clear that fragility is best understood not as a simple conditional prediction of behavior, nor merely as a static categorical structure, but as an intrinsic causal power grounded in that structure. The fink cases do not dissolve the property of fragility; rather, they expose the inadequacy of defining dispositions solely by their manifestations.

  The first option is to define fragility by its **manifestation profile**. This view, often associated with the Simple Conditional Analysis (SCA), holds that to be fragile is simply to satisfy the conditional: "If struck, then break." On this view, Vase A is not fragile (it does not break) and Vase B is fragile (it does break). This approach has pragmatic appeal; it aligns with how we navigate the world. If we are packing crates, we treat Vase B as the hazard and Vase A as the safe object. However, as a metaphysical definition, the manifestation profile fails because it renders fragility extrinsic and unstable. Under this view, whether an object is fragile depends on the presence of external devices (the finks) that have nothing to do with the object's nature. If a thief unplugs Vase A's fink, the vase suddenly becomes fragile without undergoing any internal change. This implies that the property of fragility is not located in the object but in the object's environment. This is counterintuitive to scientific practice, which locates the cause of breakage in the bonding of the silica, not in the presence or absence of a protective shield. To define fragility by manifestation is to confuse the *evidence* of a property with the *property itself*.

  The second option is to fix fragility by the object's **intrinsic categorical structure**. On this view, Vase A is fragile because its molecular bonds are weak, and Vase B is not fragile because its bonds are strong. The finks are irrelevant external additions. This view preserves the intuition that properties belong to the objects that bear them. It aligns with the scientific materialist stance that higher-level properties are identical to, or supervene upon, microphysical structures. However, a strict categoricalism faces its own difficulty: it risks making the disposition epiphenomenal. If Vase A *never* breaks, not even in a million years, in what sense is its "fragility" doing any work? If the definition of fragility is exhausted by the static arrangement of atoms, we lose the modal force of the term—the sense that the vase *would* break under certain conditions. A purely categorical view explains what the vase *is*, but it struggles to explain what the vase *does* (or would do) without appealing back to conditionals, which we have already seen are vulnerable to finks.

  Therefore, we must turn to a **third option**: fragility as a real, intrinsic **causal power**. This view, often termed Dispositional Realism, posits that dispositions are genuine properties distinct from both their categorical bases and their manifestations. On this account, fragility is a power grounded in the microstructure (satisfying the intuition of the categorical view) but defined by its contribution to causal potential (satisfying the intuition of the manifestation view). In the case of the finkish vases, this view allows us to say that Vase A possesses the power of fragility, but the manifestation of that power is preempted by the fink. Vase B lacks the power of fragility, but the manifestation of breakage is produced by an external cause (the fink) mimicking the effect. The fink does not remove the power from A; it interferes with the *exercise* of the power. This distinction is crucial. It allows us to maintain that fragility is intrinsic (the power resides in the glass) while acknowledging that the conditional "if struck, it breaks" is not a definition, but a default expectation that holds only *ceteris paribus* (all else being equal). The fink cases reveal that the conditional is not the analysis of the disposition, but rather a description of how the disposition behaves in a vacuum.

  One might object to this verdict by raising the **"distinction without a difference"** objection. This objection argues that if the fink is reliably attached for the vase's *entire career*, the distinction between possessing a power and lacking it is metaphysically idle. If Vase A never breaks, and never would break in the actual world because the fink never fails, what work is the "intrinsic power" doing? To say it is "really" fragile is to posit a ghostly property that makes no difference to the actual history of the object. If the fink is permanent, the counterfactual "if the fink were removed" refers to a scenario that never obtains. Thus, the objection claims, the Manifestation Profile view is superior because it tracks the actual causal history of the object, whereas the Causal Power view clings to a potentiality that is permanently blocked.

  This objection, however, fails to appreciate the explanatory role of intrinsic properties. Properties are not merely labels for actual events; they are explanations for *changes* in events and for differential outcomes under intervention. First, the reliability of the fink is a contingent fact, not a necessary one. Even if the fink is attached for the vase's career, the vase's intrinsic structure explains what happens if the fink *malfunctions*. If the power supply to Vase A's fink cuts out, it shatters; if Vase B's cuts out, it survives. The intrinsic causal power explains this differential outcome. Without attributing the power of fragility to the glass of A, we cannot explain why the failure of the fink leads to breakage in A but not in B. Second, scientific classification relies on intrinsic nature, not contingent safeguards. We classify uranium as radioactive even if it is encased in a lead box that absorbs all radiation for its entire existence. To say the uranium is "not radioactive" because the radiation never escapes is to confuse the property with its detection. Similarly, Vase A is fragile because its structure dictates a specific causal response to stress, regardless of whether an external device overrides that response. The "difference" lies in the object's capacity to contribute to causal chains, a capacity that remains real even if currently masked.

  In conclusion, the finkish vases reveal that fragility is neither a mere behavioral regularity nor a static structural label, but an intrinsic causal power. The Manifestation Profile view fails because it makes fragility extrinsic and vulnerable to external interference. The strict Categorical view succeeds in locating the property but risks losing its modal force. The Dispositional Realist view synthesizes these insights: fragility is a real power grounded in the microstructure. Vase A is fragile, and Vase B is not, because fragility is a property of the glass, not the glass-plus-device system. The objection that this distinction is idle in the face of a permanent fink overlooks the fact that properties must explain counterfactual interventions and fink failures. To be fragile is to possess a specific causal potentiality; that this potentiality is masked does not mean it is absent. We must therefore reject the idea that dispositions are defined by their manifestations. Instead, manifestations are the visible tips of invisible causal powers, powers that remain fixed in the object even when the world conspires to hide them.
