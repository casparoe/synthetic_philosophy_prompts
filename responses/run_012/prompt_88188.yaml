  8.  *(Final check of the "Distinction without a difference" objection)*: This objection suggests that if the fink is reliably attached for the *entire career*, there is no possible world accessible where the fink is absent, so the counterfactual is vacuous. I need to argue that metaphysical properties are not defined by the single actual history but by the object's nature across possible interventions.

