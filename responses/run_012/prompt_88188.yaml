      *   **Option 2: Manifestation Profile (Simple Conditional Analysis/Behaviorism).**
          *   *View:* Fragility just *means* "breaks when struck."
          *   *Verdict:* A is not fragile, B is fragile.
          *   *Pros:* Aligns with how we use the term practically (avoid A? No. Avoid B? Yes.).
          *   *Cons:* Vulnerable to the fink cases (as shown). It makes fragility extrinsic (dependent on the fink). It fails to capture the *potentiality* independent of the test.

      *   **Option 3: Causal Powers / Dispositional Realism (The "Third Thing").**
          *   *View:* Dispositions are real, irreducible properties that *ground* the conditionals but aren't identical to them. They require an intrinsic basis but are defined by their contribution to causal potential.
