      *   *Body 3 (Synthesis/Verdict):* Argue for Dispositional Realism. Fragility is a causal power. The SCA is a test for the power, not the definition. The fink blocks the *exercise* of the power, not the *possession*.
      *   *Objection:* The "Permanent Fink" objection (Distinction without a difference). If the fink never fails, the power never manifests. Is it real?
      *   *Rebuttal:* Causal explanation requires intrinsic bases. If the fink fails, the intrinsic base determines the result. Also, scientific classification relies on intrinsic nature, not contingent external safeguards.
      *   *Conclusion:* Summarize. Fragility is real, intrinsic, and distinct from its manifestation conditions.

