answer: |-
  This is a classic debate in probability and economics, often framed as **Expected Value (EV) vs. Expected Utility vs. Geometric Growth**. Both Ruth and Marcus are arguing past each other because they are optimizing for different objective functions without explicitly stating them.

  Here is the move-by-move breakdown, the mathematical verdict on each claim, and the resolution of when each strategy is actually correct.

  ### Round-by-Round Analysis

  **1. The Setup**
  *   **The Bet:** Even money ($1:1$ payout). Probability of winning $p = 0.6$.
  *   **Dan's Plan:** Bet 100% of bankroll.
  *   **Ruth's Claim:** Kelly bet is 20%.
      *   **Verdict:** **Ruth is mathematically correct.** The Kelly formula for even money is $f^* = p - q$. Here, $0.6 - 0.4 = 0.2$.
  *   **Ruth's Reasoning:** "Grows your money fastest in the long run."
      *   **Verdict:** **Correct.** Kelly maximizes the *geometric mean* of wealth (compound growth rate) over an infinite sequence of bets.
  *   **Marcus's Claim:** "Only true if he gets to make this bet over and over... One shot... only thing that matters is expected value."
      *   **Verdict:** **Correct.** For a single isolated trial ($N=1$), maximizing Expected Value (arithmetic mean) dictates betting the maximum possible amount. $EV = 0.6(1) + 0.4(-1) = +0.2$ per unit bet. To maximize total expected dollars, you maximize units bet.

  **2. The "Ruin" Argument**
  *   **Ruth:** "Even one shot, you don't bet the rent... 40% chance he's wiped out... you can't recover."
      *   **Verdict:** **Mixed.**
          *   *Overreach:* If this is truly a "one shot" scenario with no future bets, "can't recover" is irrelevant because there is no future to recover *for*.
          *   *Insight:* She is implicitly introducing a **utility floor**. If wealth hits zero, utility doesn't just drop, it crashes (starvation, inability to participate in life). If $U(0) = -\infty$, betting 100% is irrational even for $N=1$.
  *   **Marcus:** "'Out of the game' assumes there's a game... log-utility stuff is just a particular taste for safety."
      *   **Verdict:** **Correct.** He identifies that Ruth is smuggling in an assumption about future opportunities or risk aversion. In strict Von Neumann-Morgenstern utility theory, if Dan has linear utility of wealth ($U(w) = w$) and no bankruptcy constraint, All-In is the rational choice for $N=1$.

  **3. The Asymptotic Argument**
  *   **Ruth:** "Kelly bettor, with probability going to 1, ends up richer."
      *   **Verdict:** **Correct, but irrelevant to the premise.** This is a theorem about the limit as $N \to \infty$.
  *   **Marcus:** "As what goes to infinity? The number of bets. You can't just import a limit result into a single trial."
      *   **Verdict:** **Marcus wins this exchange.** This is the strongest mathematical point of the debate. Applying an asymptotic guarantee to a single trial is a category error. For $N=1$, the Kelly bettor has a lower expected dollar value than the All-In bettor ($0.2 \times 0.2\text{ bankroll}$ vs $0.2 \times 1.0\text{ bankroll}$).

  **4. The Utility Concession**
  *   **Ruth:** "Money has diminishing marginal value, so even for a single bet a log-ish curve isn't crazy."
      *   **Verdict:** **Correct.** This is the standard economic defense. Most humans are risk-averse. Losing 50% of your wealth hurts more than gaining 50% helps. This justifies betting less than EV-maximization.
  *   **Marcus:** "Then say that. Don't say Kelly is 'the' rational amount... You smuggled in log and then announced the answer."
      *   **Verdict:** **Marcus is right.** Kelly is not "objective rationality." Kelly is the optimal strategy *if and only if* you have logarithmic utility of wealth. If you have linear utility, Kelly is suboptimal. If you have power utility ($U(w) = w^{0.5}$), you should bet less than Kelly.

  **5. The Half-Kelly Retreat**
  *   **Ruth:** "Fine, half-Kelly then."
  *   **Marcus:** "Great, now it's just a dial you're turning to taste."
      *   **Verdict:** **Marcus wins the debate.** By moving from "Kelly is the mathematically correct bet" to "Half-Kelly is safer," Ruth admits that bet sizing is a function of risk preference, not a universal law.

  ---

  ### What Both of Them Are Missing

  While Marcus wins on the strict logic of the single-trial argument, and Ruth wins on practical risk management, both miss two critical real-world factors that actually decide this argument in practice.

  **1. Edge Uncertainty (The "Dan is Deluded" Problem)**
  Dan *says* the coin is 60/40. He is almost certainly wrong.
  *   Kelly is extremely sensitive to edge estimation. If the true probability is 55% but Dan bets as if it's 60%, he is overbetting.
  *   If the true probability is <50%, the EV is negative, and the correct bet is **0%**.
  *   **The Missing Point:** In real-world scenarios (poker, investing, gambling), you never know the true edge. Because overestimating your edge leads to ruin much faster than underestimating it, **fractional Kelly (like Ruth's half-Kelly suggestion) is optimal not because of risk aversion, but to account for parameter uncertainty.** Marcus's All-In strategy assumes Dan's 60% is a physical constant. It isn't.

  **2. The Definition of "Bankroll"**
  *   If Dan's "bankroll" is his life savings (rent money), Ruth is right because the utility function has a hard cliff at zero.
  *   If Dan's "bankroll" is a dedicated gambling fund he can replenish with a job, Marcus is closer to right, provided Dan understands he might go to zero.
  *   **The Missing Point:** They argue about math, but the answer depends on whether the bankroll is **renewable**. If Dan can reload, the bet is part of a larger series (making it $N > 1$), which vindicates Ruth. If Dan cannot reload, it is truly $N=1$, which vindicates Marcus (assuming linear utility).

  ---

  ### The Verdict: Under What Description Is Each Right?

  **Marcus is Right If:**
  1.  **Strictly One Shot:** Dan will literally never have an opportunity to invest or gamble money again.
  2.  **Linear Utility:** Dan values \$2,000,000 exactly twice as much as \$1,000,000. He does not care about variance, only the final arithmetic average.
  3.  **Known Edge:** Dan's assessment of the 60% edge is objectively known to be true, not an estimate.
  4.  **No Bankruptcy Consequence:** Losing the entire bankroll does not impact Dan's ability to survive or earn more money later.

  *Under these specific, sterile conditions, betting 100% maximizes Expected Wealth.*

  **Ruth is Right If:**
  1.  **Repeated Play (Explicit or Implicit):** Dan will face similar opportunities in the future (investing, career, other poker games). Survival is required to take future bets.
  2.  **Diminishing Marginal Utility:** Dan is a normal human who feels the pain of loss more than the joy of an equivalent gain (Log or Power Utility).
  3.  **Parameter Uncertainty:** Dan's 60% estimate is subjective. Betting 20% (or 10%) provides a safety margin against him being wrong about the edge.
  4.  **Non-Ergodicity:** In real life, time averages (what happens to you over a lifetime) do not equal ensemble averages (what happens to 1,000 people betting once). Ruth is optimizing for the *time average* (survival and growth); Marcus is optimizing for the *ensemble average* (group expectation).

  ### Summary
  Marcus won the **logical** argument: You cannot use an asymptotic theorem (Kelly) to justify a single-trial decision without assuming a specific utility function. Ruth treated Kelly as a law of physics; Marcus correctly identified it as a preference structure.

  Ruth won the **practical** argument: In the real world, edges are uncertain, opportunities are repeated, and ruin has consequences beyond the math. Betting 100% on a subjective edge is not "brave," it's statistically likely to be suicide by overconfidence.

  **The Synthesis:** Dan should not bet 100%. He should not even bet 20%. Because his edge is an *estimate*, he should bet **10% (Half-Kelly)**. This maximizes growth while accounting for the high probability that Dan is overestimating his edge. Ruth was right about the action, but Marcus was right about the reasoning.
