prompt: |-
  So my best friend is getting married next month and she's asked me to give the toast, and I've managed to get myself into a bit of a bind. She's a philosophy PhD student who works on Nāgārjuna — emptiness, the tetralemma, the four corners, all of it — and I've spent enough time around her that I've picked up the vocabulary and, honestly, half-belive it. Her fiancé is a marine biologist who is lovely and completely allergic to philosophy. Maybe a third of the room will be her department (analytic types who think Madhyamaka is either trivially true or self-refuting), and the rest is family who just want something warm and short. Here's the bind: every draft I write wants to say something like "you two are perfect for each other, you're really one," or "you're two people who chose each other," or some blend of the two — and all of those sound to me like exactly the kind of claims about svabhāva (inherent, independent existence) that she'd tell me to knock off. But I also don't want to shrug and say "well, nothing has a nature, so nothing matters," because that's the nihilist misreading she's always complaining about, and it would also be a terrible toast.

  So here's what I want from you: a five-minute toast, warm, genuinely built for that mixed room, with the four corners of the tetralemma doing the actual structural work rather than just being name-dropped. I had this idea of four little toasts, one for each corner — they're one; they're two; they're both; they're neither — each of which gets gently undercut as I go, and then a last line that isn't a metaphysical claim at all. The conventional-truth side of things has to carry the emotional weight: the point should come out as the marriage being real and precious precisely because it isn't a fixed essence, not in spite of it. Please don't let me get tangled in whether "everything is empty" refutes itself — I know that's a live objection but I don't want the toast dying on that hill — and don't let it turn into a lecture. If you can work in one small joke that the philosophers and the family can both laugh at, even better. And it has to end with something I can actually raise a glass to.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Best friend's wedding toast.
      *   **Audience:** Mixed bag.
          *   Bride: Philosophy PhD student (Nāgārjuna, Madhyamaka, emptiness, tetralemma).
          *   Groom: Marine biologist (lovely, allergic to philosophy).
          *   Guests: 1/3 Academics (analytic philosophers, skeptical of Madhyamaka), 2/3 Family (want warmth, brevity).
      *   **The Bind:** Standard romantic tropes ("you are one," "you chose each other") imply *svabhāva* (inherent existence), which contradicts the bride's work. Nihilism ("nothing matters") is also off-limits (misreading + bad toast).
      *   **Requirements:**
          *   5-minute length (approx. 750-900 words spoken at a moderate pace).
          *   Warm and genuine.
          *   Structure: The Four Corners of the Tetralemma (One, Two, Both, Neither) must do structural work, not just name-dropping.
          *   Progression: Each corner gets gently undercut.
          *   Core Message: Marriage is real/precious *because* it isn't fixed essence (dependent origination/conventional truth).
          *   Tone Check: No metaphysical self-refutation debates, no lecture, one accessible joke.
          *   Ending: A clear, raise-a-glass conclusion that isn't a metaphysical claim.

  2.  **Deconstruct the Tetralemma (Catuṣkoṭi) for a Toast:**
      *   *Corner 1: Identity (They are One).* Romantic, but metaphysically suspect.
      *   *Corner 2: Difference (They are Two).* Distinct individuals, but ignores the relationship.
      *   *Corner 3: Both (One and Two).* Logical contradiction, but captures the tension.
      *   *Corner 4: Neither (Not One, Not Two).* Emptiness of the categories themselves.
      *   *Resolution:* Conventional truth (*samvrti-satya*). The promise, the practice, the love *in the world*.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor, acknowledge the tension (Philosophy vs. Biology vs. Family). Set a warm tone.
      *   **Corner 1 (One):** The romantic ideal. "Soulmates." *Undercut:* Too static. Ignores their distinctness.
      *   **Corner 2 (Two):** The individuals. Scientist & Philosopher. *Undercut:* Too separate. Marriage is about connection.
      *   **Corner 3 (Both):** The paradox. Together yet apart. *Undercut:* Still trying to define the *essence* of the relationship.
      *   **Corner 4 (Neither):** The emptiness. No fixed "marriage" thing. *Undercut:* Don't fall into nihilism. It *does* matter.
      *   **The Turn (Conventional Truth):** Why this matters. Because it's not fixed, it requires care. It's dependent on *us*, on *action*.
      *   **The Joke:** Needs to bridge the gap. Maybe about the "nature" of things or "observation." Let's try something about the groom's fish vs. the bride's concepts.
      *   **The Closing:** A practical wish. A toast to the *activity* of loving, not the *state* of being married.

  4.  **Refining the Tone:**
      *   *Avoid:* Jargon heavy enough to lose the family. (Explain "tetralemma" simply if used, or just show it).
      *   *Avoid:* Cynicism.
      *   *Ensure:* The groom feels included (he hates philosophy, so don't make him the butt of the joke, make the *situation* the joke).
      *   *Ensure:* The philosophers get the nod (they know the trap), but don't dwell on the self-refutation objection.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm nervous. Bride studies emptiness. Groom studies fish. I thought about saying you are one. But that's essentialist. Then I thought you are two. But that's dualist. Then both. Contradiction. Then neither. Nothing exists. Bad toast. So, here's the truth: Marriage is a promise. It's empty of inherent existence, which means you make it real every day. Cheers.

      *Critique 1:* Too dry. Needs more heart. The "Four Toasts" idea from the prompt is excellent structure. Let's stick to that.

  6.  **Drafting - Iteration 2 (Fleshing out the Four Corners):**
      *   *Toast 1:* To the One. You complete each other. *Wait,* that implies you were incomplete.
      *   *Toast 2:* To the Two. You are distinct. *Wait,* marriage is about sharing.
      *   *Toast 3:* To the Both. You are a team of individuals. *Wait,* that's just word salad.
      *   *Toast 4:* To the Neither. There is no marriage. *Wait,* don't say that.
      *   *Synthesis:* The love is in the *doing*.

  7.  **Writing the Content (incorporating constraints):**
      *   *Word Count Check:* 5 minutes is roughly 750-850 words.
      *   *Joke:* "For those of you who know [Bride]'s work, you know she spends her life arguing that nothing has an intrinsic nature. For those of you who know [Groom], you know he spends his life studying creatures that don't even have legs. Honestly, I think they're both just trying to figure out how things stand up on their own." (A bit clunky). Let's try: "Groom studies things that swim silently. Bride studies arguments that swim in circles. They are perfect." No, let's go with the "inherent nature" joke.
      *   *Better Joke:* "I tried to write a normal toast, but every time I wrote 'you are perfect together,' I heard [Bride]'s voice saying 'Define perfect. Define together.'"

      *   *The Ending:* Needs to be actionable. "To the next moment." "To the choice."

  8.  **Final Polish (Reviewing against constraints):**
      *   *Tetralemma Structure:* Explicitly move through One, Two, Both, Neither.
      *   *Warmth:* Keep the language affectionate.
      *   *Philosophy:* Accurate enough for the PhDs, accessible enough for Grandma.
      *   *Nihilism Check:* Ensure the "Neither" doesn't sound like "Nothing matters." It must lead to "Everything matters because it depends on you."
      *   *Groom:* Make sure he isn't alienated. Acknowledge his biology background respectfully.

      *(Self-Correction during drafting)*: I need to make sure I don't get bogged down explaining the tetralemma. Just use it. "There are four ways to say this..."

      *(Refining the "Neither" corner)*: This is the tricky part. If I say "There is no marriage," the family panics. I need to frame it as "There is no *fixed* marriage." It's a verb, not a noun.

      *(Refining the Close)*: "To the conventional truth." No, too jargon-y. "To the love you make real."

  9.  **Final Word Count Check:** Aiming for ~800 words.

      *(Drafting the actual response based on these thoughts...)*
      *   Start with the honor.
      *   Introduce the dilemma (Philosophy vs. Romance).
      *   Corner 1: One. (Romantic, but essentialist).
      *   Corner 2: Two. (Distinct, but disconnected).
      *   Corner 3: Both. (Paradox).
      *   Corner 4: Neither. (Empty).
      *   The Pivot: Emptiness allows for change/growth.
      *   The Joke: Insert naturally.
      *   The Toast: To the practice.

  10. **Final Review:** Does it meet the "no metaphysical claim" ending? Yes, end on a wish/action. Does it avoid the self-refutation trap? Yes, by staying in the conventional realm.

      *Let's write it.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being [Bride]'s best friend.

  When [Bride] asked me to give this toast, I was honored. Then I was terrified. Because [Bride] is a scholar of Nāgārjuna and the Madhyamaka school of philosophy. For the family, that means she studies "emptiness." For the colleagues in the room, that means I am walking into a minefield of *svabhāva* and *prasaṅga*. And for [Groom], it means I promise to keep this under five minutes so we can get to the cake.

  I tried to write a normal toast. I really did. But every time I wrote a sentence like, "You two are perfect for each other," I could hear [Bride]'s voice in my head asking, "Perfect in what sense? And do these 'two' actually exist independently enough to be 'for' each other?"

  So, I decided to stop fighting the current. I decided to structure this toast the way [Bride] structures her arguments. Using the *catuṣkoṭi*—the four corners. I'm going to offer you four little toasts. And I'm going to explain why each one is slightly wrong, until we get to the one that's right.

  **Here is the first toast:** To the fact that you are **One**.
  This is the romantic standard. "Soulmates." Two halves of a whole. It's beautiful. It suggests a unity that transcends the mundane. But, as any philosopher in the third row will tell you, claiming you are "one" implies there is a fixed, inherent essence called "The Marriage" that now exists in the universe. It suggests you've finished becoming. But love isn't a statue; it's not a solid object you find and put on a shelf. If you were truly just "one," there would be no room for growth, no space for surprise. So, I can't toast to you being one.

  **Here is the second toast:** To the fact that you are **Two**.
  You are distinct individuals. [Bride] with her books, [Groom] with his... well, his fish. You have your own minds, your own histories. This respects your autonomy. But a marriage where you remain strictly "two" is just roommate-hood. It's a treaty, not a union. If you are entirely separate, then your love is just a collision of isolated atoms. That's too cold for a day like this. So, I can't toast to you being merely two.

  **Here is the third toast:** To the fact that you are **Both**.
  You are a union of individuals. A paradox. This feels more honest. It captures the tension of waking up next to someone who is utterly familiar and utterly strange. But logically, it's a mess. And metaphysically, it's just trying to have your cake and eat it too. It still assumes there are fixed things— "You" and "Him"—that are somehow stacking together to make a "We." It still relies on the idea that there is a solid "nature" to what you are doing.

  **Here is the fourth toast:** To the fact that you are **Neither**.
  This is the hard corner. Neither one, nor two, nor both. This is the emptiness corner. It says there is no inherent "marriage" out there in the stars. There is no cosmic stamp that says "This is Real."
  Now, to the family: please don't worry. This isn't the part where I say "nothing matters." That's the nihilist mistake [Bride] spends her life correcting.
  The point of "neither" isn't that the love is fake. The point is that the love isn't *fixed*.

  And this is where the joke comes in. I realized that [Groom], as a marine biologist, actually understands this better than any of us. He knows that a coral reef isn't a thing; it's a process. It's millions of tiny organisms depending on the water, the light, and each other. If the conditions change, the reef changes. It has no "reef-nature" other than its dependencies.

  [Bride] studies this in arguments. [Groom] studies this in ecosystems. And today, you are practicing it in love.

  If your marriage had an inherent, unchangeable nature, it would be a prison. It would be a script you have to follow. But because it is "empty"—because it has no fixed essence—it is entirely up to you. It is precious *precisely because* it isn't guaranteed by the universe. It is real *because* you make it real, every single day, through your choices.

  The philosophers in the room might say this is just "conventional truth." But let's be honest: conventional truth is the only truth where you can hold hands, pay a mortgage, or comfort each other when the world is hard. The ultimate truth might be empty, but the conventional truth is where the love lives.

  So, I am not going to toast to a state of being. I'm not going to toast to a metaphysical claim.

  I want to toast to the activity.
  To the moments where you choose patience over being right.
  To the work of building something that has no permanent foundation, and loving it anyway.
  To the reef, not the rock.

  Please raise your glasses.

  To [Bride] and [Groom]. Not for what you *are*, but for what you *do*. May you continue to make this true, together, for a very long time.

  Cheers.
