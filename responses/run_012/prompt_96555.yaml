answer: |-
  Here is a decision tree designed for your seminar. It has **4 levels** and results in **12 distinct leaves**.

  The structure is asymmetrical: if a student decides consent is purely a **Mental State** (Level 1), questions about *communicative competence* (Level 4) become irrelevant, so that branch terminates early. This keeps the leaf count manageable while reflecting the theoretical dependencies.

  ### The Consent Diagnostic Tree

  **Instructions for the Seminar Leader:**
  Read the scenario at each node. Ask the class to vote or discuss. Follow the branch that matches the majority view (or split the room and follow both). The goal is to land on a "Leaf" that names their theoretical position and highlights its cost.

  ---

  #### **Level 1: The "Secret Yes" Node (Nature of Consent)**
  **Scenario:** *Imagine a person secretly wants a medical procedure (or sex). They feel a genuine "yes" internally, but they never speak, sign, or nod. Someone else performs the act.*
  *   **Question:** Did valid consent occur?
      *   **YES (Consent is a Mental State):** Go to Level 2A.
      *   **NO (Consent is a Communicative Act):** Go to Level 2B.

  ---

  #### **Level 2: The "Cruel Yes" Node (Normative Power)**
  *(Applies to both Branches)*
  **Scenario:** *Imagine a person fully consents (mentally or verbally) to something widely considered harmful or immoral (e.g., being permanently disabled for art, or extreme financial risk).*
  *   **Question:** Does their consent make the other person's act morally permissible?
      *   **YES (Consent Transforms Morality):** Go to Level 3.
      *   **NO (Consent is Just Evidence):** Go to Level 3.
      *(Note: This question doesn't change the path, but it tags the leaf later. It distinguishes whether consent creates permission or just signals safety.)*

  ---

  #### **Level 3: The "Blackmail" Node (Coercion Baseline)**
  *(Applies to both Branches)*
  **Scenario:** *Consider the blackmail case: "Lend me money or I tell the truth about your affair." The truth-telling is lawful, but the threat is unwanted.*
  *   **Question:** Is this coercive because it makes you **worse off than before**, or because they have **no right to demand** the money?
      *   **Worse Off (Statistical/Counterfactual Baseline):** Go to Level 4 (if applicable) or Leaf.
      *   **No Right (Moral Baseline):** Go to Level 4 (if applicable) or Leaf.

  ---

  #### **Level 4: The "Dementia" Node (Competence & Deception)**
  *(Applies ONLY to the "Communicative Act" Branch from Level 1. If you chose Mental State, skip to Leaf.)*
  **Scenario:** *Consider the early dementia patient: They can repeat the risk statistics perfectly but cannot emotionally weigh them against their values. Or the framed statistics: The numbers are true, but the impression is false.*
  *   **Question:** To consent, must they understand the **facts** (numbers/words) or appreciate the **value** (risk/meaning)?
      *   **Facts (Threshold Competence):** Go to Leaf.
      *   **Value (Decision-Relative Competence):** Go to Leaf.

  ---

  ### The 12 Leaves (Theoretical Positions)

  Here are the outcomes. The "Awkward Commitment" is the point you can use to spark debate in the final 15 minutes.

  #### **Branch A: Mental State Theories (Level 1 = YES)**
  *These 4 leaves skip Level 4.*

  **1. The Subjective Libertarian**
  *(Mental + Permissible + Statistical Baseline)*
  *   **Awkward Commitment:** You must treat a silent, secret desire as binding, meaning you could be liable for assault even if the victim never said "stop."
  *   **Handles:** Drunk sex (if they felt yes, it's ok). **Fails:** Advance consent (feelings change).

  **2. The Subjective Moralist**
  *(Mental + Wrongful + Statistical Baseline)*
  *   **Awkward Commitment:** Even if the victim truly wanted it, the act is still wrong, making consent irrelevant to morality.
  *   **Handles:** Harmful acts. **Fails:** Autonomy (why ask them at all?).

  **3. The Psychological Protectionist**
  *(Mental + Permissible + Moral Baseline)*
  *   **Awkward Commitment:** You can validly consent in your head, but a lawful threat (like the blackmail case) voids it because they had "no right" to ask.
  *   **Handles:** Blackmail. **Fails:** Job offers (is a low wage a "rightful" offer?).

  **4. The Psychological Paternalist**
  *(Mental + Wrongful + Moral Baseline)*
  *   **Awkward Commitment:** We ignore what you wanted and judge the act by our own moral baseline, rendering your internal state useless.
  *   **Handles:** Extreme harm. **Fails:** Liberalism (total override of will).

  ---

  #### **Branch B: Communicative Theories (Level 1 = NO)**
  *These 8 leaves include Level 4.*

  **5. The Liberal Formalist**
  *(Communicative + Permissible + Statistical Baseline + Facts)*
  *   **Awkward Commitment:** A desperate job offer is fully voluntary, and a patient who memorizes risks but doesn't believe them has validly consented.
  *   **Handles:** Job offers. **Fails:** Framed statistics (truthful but misleading).

  **6. The Liberal Paternalist**
  *(Communicative + Permissible + Statistical Baseline + Value)*
  *   **Awkward Commitment:** You can say "yes" clearly, but if you don't emotionally "feel" the risk, we treat you as incompetent.
  *   **Handles:** Dementia case. **Fails:** Drunk sex (if they slurred "yes" but felt it, is it void?).

  **7. The Moralized Libertarian**
  *(Communicative + Permissible + Moral Baseline + Facts)*
  *   **Awkward Commitment:** Truthful blackmail voids consent (because they had no right to ask), but a truthful surgeon who confuses you does not.
  *   **Handles:** Blackmail. **Fails:** Framed statistics (why is lying about risk okay if facts are true?).

  **8. The Moralized Paternalist**
  *(Communicative + Permissible + Moral Baseline + Value)*
  *   **Awkward Commitment:** We protect you from threats you have no right to face, and risks you cannot weigh, but if you pass those hurdles, the act is permissible even if cruel.
  *   **Handles:** Most hard cases. **Fails:** Coherence (why permit cruelty if we are this protective?).

  **9. The Evidentiary Formalist**
  *(Communicative + Wrongful + Statistical Baseline + Facts)*
  *   **Awkward Commitment:** Consent is just a signal; even if you signal perfectly, the act might still be wrong, so consent never actually "clears" the actor.
  *   **Handles:** Harmful acts. **Fails:** Point of consent (why bother getting it?).

  **10. The Evidentiary Protectionist**
  *(Communicative + Wrongful + Statistical Baseline + Value)*
  *   **Awkward Commitment:** We require you to understand the value of the risk, but even if you do, we may still forbid the act.
  *   **Handles:** Dementia + Harm. **Fails:** Autonomy (double bind).

  **11. The Evidentiary Moralist**
  *(Communicative + Wrongful + Moral Baseline + Facts)*
  *   **Awkward Commitment:** A lawful threat voids your signal, but your signal doesn't make the act right anyway.
  *   **Handles:** Blackmail + Harm. **Fails:** Redundancy (consent does no work).

  **12. The Evidentiary Idealist**
  *(Communicative + Wrongful + Moral Baseline + Value)*
  *   **Awkward Commitment:** Consent requires understanding values and rightful baselines, but ultimately cannot make a wrongful act permissible.
  *   **Handles:** Everything is protected. **Fails:** Agency (you can never authorize anything risky).

  ---

  ### Seminar Leader Notes: Flags & Gaps

  **(a) Indistinguishable Leaves**
  *   **Leaves 9, 10, 11, 12 (The "Wrongful" Cluster):** Theoretically, these are distinct, but in practice, they all lead to **Paternalism**. If consent *doesn't* make the act permissible (Level 2 = NO), the distinctions in Coercion and Competence matter less because the act is blocked anyway. You can tell students: *"If you landed here, you're a Paternalist; the rest is just about how strictly you police the signal before you ignore it."*

  **(b) Empty or Incoherent Combinations**
  *   **Mental State + Competence (Level 4):** I deliberately removed Level 4 for the Mental State branch. This is because if consent is just "wanting it," asking if you "understand the facts" is category error. You can want something for stupid reasons. If a student insists on Mental State + Value Competence, flag this as **Incoherent**: *"If consent is a feeling, why does understanding math matter?"*
  *   **Statistical Baseline + Moral Baseline:** The tree forces a choice. A student who says "It depends on the case" is holding a **Hybrid View**. This isn't in the tree. Flag this as **Undefended**: *"Nobody has successfully written the rule for when to switch baselines without it looking ad hoc."*
  *   **Advance Consent:** Notice that **Branch A (Mental State)** struggles with Advance Consent (you can't feel "yes" in the future). **Branch B (Communicative)** handles it better (you said "yes" before). If the topic arises, point to Leaf 5 or 7 as the only ones that can easily validate advance directives.

  ### How to Run This
  1.  **Don't show the leaves yet.** Draw the tree on the board blank.
  2.  **Run the nodes.** Use the specific cases (Drunk, Blackmail, Dementia) to force the choice at each node.
  3.  **Reveal the cost.** When the class lands on a leaf, reveal the "Awkward Commitment." This usually makes them want to backtrack.
  4.  **The Pivot:** When they try to backtrack, point out they are moving to a different leaf with a *different* awkward commitment. This proves your thesis: **The disagreement isn't about the rules; it's about which awkward commitment they prefer.**
