  Here is the breakdown of how each agent fares against your two tests, followed by the crucial caveat regarding the logical independence you seek.

  **1. Cue-Responsiveness Profile**
  *   **The Polymorphic Digger:** Passes with high marks. Vary the light, the wind, or the texture, and the behavior varies. There is no fixed sequence of steps; the output is a complex function of many independent inputs.
  *   **The Thermostatic Beetle:** Fails (or passes minimally). Vary the light, the sound, or the barrier shape, and the behavior does *not* vary (unless the barrier blocks the heat). It is stereotyped and mechanical regarding the vast majority of situational features.

  **2. Goal-Tracking Profile**
  *   **The Polymorphic Digger:** Fails. If the "end" is implicitly "cricket in hole," it fails to secure it when the cricket is already in the hole (dragging it out). It cannot adjust to blocked means; if the hole is filled, it does not dig a new one, it simply repeats the drag routine until exhaustion. It has no "end" to hold, only triggers to obey.
  *   **The Thermostatic Beetle:** Passes. If the end (warmth) is altered (by moving the vent), it adjusts. If the means are blocked (by a barrier), it adjusts its path to secure the end. It exhibits equifinality.

  **3. The Single Feature Doing the Work**
  The distinguishing feature is not the *number* of cues, but the **presence of a negative feedback loop comparing current state to a reference state.**
  *   The Digger is **Open-Loop**: Input $\rightarrow$ Processing $\rightarrow$ Output. The output does not affect the input criteria in a way that terminates the action upon success.
  *   The Beetle is **Closed-Loop**: Input $\rightarrow$ Comparator (Current vs. Reference) $\rightarrow$ Output $\rightarrow$ Change in Input. The action persists *until* the reference state is matched.

  **4. Removal of the Feature**
  If you remove the feedback comparator from the Beetle, it collapses into a reflex machine (swim forever, or swim for a fixed time), becoming sphexish. If you add a feedback comparator to the Digger (e.g., "Stop when cricket is inside"), it ceases to be sphexish and becomes goal-guided, regardless of how many sensors it has.

  **5. The Plain Truth (The Confusion)**
  You asked me to tell you plainly if the request rests on a confusion. It does, though a productive one.

  You asked for an agent that is "minimally cue-responsive" yet "genuinely goal-guided." Under strict cybernetic definitions, **this is impossible.** To be goal-guided (i.e., to adjust when means are blocked), an agent *must* detect the blockage. That detection is a cue. Therefore, a goal-guided agent *must* be cue-responsive to the specific cues that signal error (the difference between goal and state).

  The Thermostatic Beetle *appears* minimally cue-responsive only because it ignores *distractor* cues (light, sound). But it is *maximally* cue-responsive to the *error* cue (temperature difference). If you vary the temperature, it varies its behavior. Thus, goal-guidance is not logically independent of cue-responsiveness; rather, **goal-guidance is a specific subset of cue-responsiveness** (responsiveness to error signals via negative feedback).

  The distinction you are trying to draw is not between "Cue-Responsive" and "Goal-Guided." It is between **"Complex Open-Loop"** (The Digger: many cues, no goal) and **"Simple Closed-Loop"** (The Beetle: few cues, specific goal).

  **6. The Skeptic's Dismantling**
  A skeptic (likely a behaviorist or a radical cyberneticist) would dismantle your pair by attacking the "Minimally Cue-Responsive" verdict on the Beetle. They would argue:
  *"You claim the Beetle is not cue-responsive because it ignores light and sound. But when you place a barrier in its path, it turns. The barrier is a cue. The temperature gradient is a cue. Therefore, the Beetle is cue-responsive. You have not shown that goal-guidance exists without cue-responsiveness; you have only shown that goal-guided systems are **selective** about which cues they respond to. The Digger responds to everything without purpose; the Beetle responds to little, but with purpose. But both are entirely driven by cues. There is no 'goal' hidden inside the Beetle other than the physical fact of its feedback wiring."*

  **Summary for your Seminar:**
  You can use these cases to show that **behavioral complexity (cue-responsiveness) does not entail teleology (goal-guidance).** A system can be wildly flexible and still be a zombie (The Digger). However, you must concede to your audience that teleology *does* entail *some* form of cue-responsiveness (feedback). The "Sphexish" worry is not that the agent lacks sensitivity, but that its sensitivity is not organized around the *preservation of a variable*. The Digger preserves nothing; it merely reacts. The Beetle preserves temperature. That is the difference that matters.
