  Here are the two cases, constructed to be as structurally similar as possible while isolating the variable of control architecture.

  **Case 1: The Polymorphic Digger**
  Imagine a robotic wasp equipped with fifty distinct sensors (light, texture, vibration, chemical gradient, humidity) and a massive lookup-table processor. When hunting, it does not hold a representation of a "burrow" or a "full larder"; it simply executes a complex script triggered by sensory thresholds. If the cricket is moved, the robot detects the change in texture and vibration cues and selects a different dragging subroutine from its table; if the wind changes, it adjusts its grip pressure based on the anemometer; if the light shifts, it alters its approach angle to maintain visual contrast. Its behavior is a rich, non-trivial function of dozens of independent environmental features, varying smoothly as they vary. However, if you move the cricket *into* the burrow while the robot is inspecting the chamber, it will haul the cricket back out and drag it in again, because the "cricket-inside" cue triggers the "drag-in" routine just as reliably as the "cricket-outside" cue does. It is exquisitely sensitive to the situation, but every adjustment is a pre-ordained stimulus-response pairing with no reference to a future state to be achieved.

  **Case 2: The Thermostatic Beetle**
  Imagine a simple organism, akin to a aquatic larva, equipped with a single internal sensor that measures only its own core temperature against a fixed set-point. It has no sensors for light, sound, texture, or the position of other objects. Its motor output is stereotyped: it swims forward or it stops. If the water is cold, it swims; if warm, it stops. It ignores every feature of the situation except the temperature differential. Yet, if you place a barrier between it and a warm vent, it bumps against the barrier, bounces off, and swims in a new direction until the temperature rises; if you move the vent, it changes course to follow the gradient. It adjusts its behavior to secure the end state (warmth) despite blocked means or altered targets, ignoring all other environmental variations. Its output is a trivial function of the situation (ignoring 99% of features), yet it exhibits equifinality, arriving at the same end state through different paths depending on what obstructs it.

