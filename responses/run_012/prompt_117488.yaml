answer: |-
  Here is a prioritized agenda for your dissertation, ordered by logical dependency and strategic fit for your specific profile (Logic/Computability strength, 3-year horizon, Formal Epistemology context).

  ### Priority 0: The Distinction Problem (The Friend's Critique)
  **Status:** *Prerequisite / Gatekeeper*
  **Relation to Candidate List:** This is not explicitly in your list of five, but it is upstream of all of them. If your friend is right, the dissertation topic is trivial.

  *   **Why Upstream:** You cannot build a theory of Program Equilibrium (PE) if PE is merely a notational variant of the Repeated Game Folk Theorem or Correlated Equilibrium (CE). The Folk Theorem relies on *temporal* history and discount factors; PE relies on *logical* access and commitment. You must articulate why logical commitment generates a solution concept distinct from temporal punishment strategies.
  *   **Tractability:** High. This is a conceptual/argumentative task, not a technical proof. It requires mapping the PE formalism against Aumann's CE and the Folk Theorem to identify the non-overlapping set of equilibria.
  *   **Neglect:** High. The literature often assumes the distinction is obvious. It is not. Many economists *do* view it as "Folk Theorem with extra steps."
  *   **Dependency:** All other questions wait on this. If PE collapses into CE, Q1–Q5 become questions about Correlated Equilibrium, which is a settled field.
  *   **Trigger to Move Up/Down:**
      *   *Move Up (Critical):* If you find a formal mapping showing every PE outcome is achievable via a CE with a mediator.
      *   *Move Down (Resolved):* If you successfully prove that PE supports equilibria in *one-shot* settings that are impossible in one-shot CE without a mediator (specifically via the program-commitment mechanism).

  ### Priority 1: Question 1 (Semantics & The Referee)
  **Status:** *Core Dissertation Topic*
  **Candidate:** "How much of the framework depends on there being a shared referee... what survives if the players instead simulate one another?"

  *   **Why Upstream:** The standard Tennenholtz (2004) setup assumes a trusted referee who executes the programs. This is a massive philosophical and practical bullet to bite. If the framework requires a trusted third party to read code, it loses its force as a theory of *individual* rationality or decentralized interaction. Removing the referee forces you to deal with mutual simulation, which introduces halting problems and fixed-point logic.
  *   **Tractability:** Perfect fit for your skills. This is pure logic and computability theory (Kleene's Recursion Theorem, Gödel-Löb provability logic, quining). It avoids the engineering messiness of Q5 and the economic complexity of Q3.
  *   **Neglect:** High. Most CS work assumes the referee. The philosophical work (Oesterheld 2019) gestures at mutual simulation but lacks a rigorous computability bound analysis.
  *   **Dependency:** Q2 (Complexity) and Q4 (Normative) depend on having a stable formal model. If the model crashes without a referee, you cannot ask if it is bounded or normative.
  *   **Trigger to Move Up/Down:**
      *   *Move Up:* If you discover a general impossibility result for mutual simulation without a referee (e.g., unavoidable infinite regress).
      *   *Move Down:* If you find that a specific modal logic (like GL) cleanly resolves the simulation loop without needing new machinery.

  ### Priority 2: Question 2 (Proof Systems & Complexity)
  **Status:** *Technical Core / Chapter 2 or 3*
  **Candidate:** "If I replace provability-style reasoning with something that imposes resource bounds... does it persist?"

  *   **Why Upstream:** Unbounded provability is logically elegant but physically impossible. If cooperation collapses once you impose proof-length limits or time bounds, the phenomenon is a mathematical artifact, not a robust feature of agency.
  *   **Tractability:** Moderate/High Risk. You have the logic background, but "bounded rationality" often turns into a swamp of ad-hoc assumptions. *Strategy:* Do not try to solve general computational complexity. Focus on **proof length** as a proxy for cognitive cost within a specific proof system (e.g., Peano Arithmetic). This keeps it in your lane (Logic) rather than drifting into Complexity Theory (which requires different tools).
  *   **Neglect:** Moderate. There is work on "Bounded Program Equilibrium," but it is often siloed in CS theory. A philosophical treatment of *what the bounds represent* is neglected.
  *   **Dependency:** Downstream of Q1. You need to know *what* is being simulated before you bound the simulation. Upstream of Q4 (you can't say what agents *ought* to do if they *can't* do it).
  *   **Trigger to Move Up/Down:**
      *   *Move Up:* If you find that cooperation persists with polynomial proof bounds.
      *   *Move Down:* If cooperation collapses immediately with any bound (making the question settled negatively).

  ### Priority 3: Question 4 (Normative vs. Descriptive)
  **Status:** *Philosophical Payoff / Conclusion*
  **Candidate:** "Whether the right reading... is descriptive or normative."

  *   **Why Upstream:** This is the "So What?" of the dissertation. However, it must come *after* the formal work. You cannot argue for the normativity of PE if the formalism is unstable (Q1) or impossible (Q2).
  *   **Tractability:** High. This is standard Formal Epistemology. You will be comparing PE to Causal Decision Theory (CDT) and Evidential Decision Theory (EDT).
  *   **Neglect:** Low. This is the most discussed aspect in philosophy circles (Newcomb problems, Prisoner's Dilemma). However, a fresh take based on your results from Q1/Q2 would be valuable.
  *   **Dependency:** Entirely downstream. Your answer here depends on whether PE is robust (Q1) and realistic (Q2).
  *   **Trigger to Move Up/Down:**
      *   *Move Up:* If Q1/Q2 reveal that PE requires agents to violate standard axioms of rationality (e.g., independence).
      *   *Move Down:* If the formalism turns out to be equivalent to standard EDT (making the normative debate a rehash of existing literature).

  ### Priority 4: Question 3 (Coalitions & Bargaining)
  **Status:** *Extension / Future Work*
  **Candidate:** "Whether the framework extends past two players to coalitions... bargaining."

  *   **Why Upstream:** This is "normal science." It applies the framework to harder games. It is not foundational.
  *   **Tractability:** Low. Bargaining introduces indeterminacy and fairness norms that complicate the clean logic of the Prisoner's Dilemma. N-player coalitions introduce combinatorial explosion.
  *   **Neglect:** High, but for a reason: it is very hard.
  *   **Dependency:** Downstream of everything. Do not touch this until you have a working 2-player model.
  *   **Trigger to Move Up/Down:**
      *   *Move Up:* If you solve Q1/Q2 quickly (within Year 1).
      *   *Move Down:* If you encounter friction in Q1 (almost certain).

  ### Rule Out: Question 5 (Mechanism Design)
  **Candidate:** "Whether there is a mechanism-design question... what a designer can accomplish simply by choosing the language."

  *   **Reason for Exclusion:** This is the wrong dissertation for your profile.
      1.  **Skill Mismatch:** It requires deep knowledge of economic mechanism design and potentially engineering (language design), diluting your logic/philosophy focus.
      2.  **Agency Shift:** It shifts the focus from *epistemology* (what agents know/do) to *engineering* (what designers build).
      3.  **The Friend's Critique:** Your friend's critique is essentially a Mechanism Design critique (i.e., "The referee is just a correlating device"). You should **answer** this critique (Priority 0), but do not make it your **positive research program**. Building a theory of optimal languages is a 10-year project, not a 3-year one.
  *   **Verdict:** Do not pursue this as a constructive project. Use it only defensively to distinguish your work from standard mechanism design.

  ---

  ### Strategic Summary for the Next 12 Months

  1.  **Months 1–4 (The Distinction):** Write a paper/chapter formally distinguishing Program Equilibrium from Correlated Equilibrium and the Folk Theorem. Focus on the **commitment device**. In Repeated Games, commitment is temporal (I punish you *later*). In PE, commitment is logical (my code *is* the commitment). If you cannot formalize this distinction, pivot topics.
  2.  **Months 5–12 (The Referee):** Focus on **Question 1**. Develop a model of mutual simulation that avoids infinite regress without a trusted referee. Use Modal Provability Logic (GL) or Fixed-Point Combinators. This is your "Technical Core."
  3.  **Months 12–18 (Bounds):** Touch on **Question 2**. Show that your simulation model works with bounded proof lengths. Keep it simple (e.g., "Cooperation holds if proof length < K").
  4.  **Months 18–30 (Normative):** Write **Question 4**. Argue that this constitutes a new normative standard for rational agency (superrationality made precise).
  5.  **Months 30–36:** Buffer/Write-up.

  **Specific Result to Watch For:**
  If you find that **Mutual Simulation (Q1) requires a halting oracle** to guarantee equilibrium, move Q1 down and Q4 up. It implies the model is computationally unrealizable, forcing you to treat PE as a purely normative ideal (Q4) rather than a descriptive theory of computation.

  **Final Advice:** Your friend is half-right. PE *is* related to the Folk Theorem in outcome, but the *mechanism* is logically distinct. Your dissertation should be the proof of that distinction, grounded in the logic of self-reference (Q1), not the economics of design (Q5).
