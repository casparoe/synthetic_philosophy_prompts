answer: |-
  **Purpose:** Establish evidentiary standards for cautious site reports where material ambiguity is high.

  | Desideratum | Case/Consideration | Status |
  | :--- | :--- | :--- |
  | **Equifinality Resolution** | Distinguish identical assemblages (e.g., rubbish pit vs. votive) via contextual patterning, not assumption. | Non-negotiable |
  | **Status Verification** | Grave goods must correlate with independent evidence of rank, not merely assert hierarchy existed. | Non-negotiable |
  | **Institutional Stability** | Distinguish structured institution from merely recurring behavior (sporadic ritual vs. codified practice). | Non-negotiable |
  | **Belief/Practice Distinction** | Separate internal conviction from public performance or mindless habit (figurine as god vs. toy). | Preference (Symbolist) |
  | **Taphonomic Integrity** | Inferences cannot contradict formation processes, sampling limits, or preservation bias. | Non-negotiable |
  | **Analogy Structure** | Ethnographic parallels require relational similarity, not superficial trait matching. | Non-negotiable |

  **The Tension:** Your hunch is correct. "Checkable against material" and "Recover thin belief" are in genuine tension. Material traces index behavior; beliefs are latent mental states. Bridging them requires auxiliary assumptions that weaken empirical falsifiability. You can verify a burn layer; you cannot verify a prayer. A theory maximizing checkability inevitably thins out belief; a theory recovering rich belief inevitably loosens checkability.

  **The Killer Requirement:** **Equifinality Resolution.** It demands contextual rigor most theories ignore to make sweeping claims. It forces admission of uncertainty where narratives demand plot. Most theories fail here by assuming function from form.

  **Camp Performance:**
  *   **Processual (Nomothetic):** Passes Taphonomy/Checkability. Fails Belief/Practice (reduces mind to behavior). Treats symbols as epiphenomenal.
  *   **Symbolic (Interpretive):** Passes Belief/Practice (rich meaning). Fails Equifinality/Checkability (unconstrained interpretation; anything means anything).
  *   **Cognitive:** Passes Belief (universal structures). Fails Analogy/Context (often ignores historical specificity for universal cognitive traits).

  No existing camp meets all non-negotiables. Processualism is too skeptical; Symbolism is too permissive. A viable theory must treat belief as a probabilistic inference constrained by taphonomy, not a reading of symbols.
