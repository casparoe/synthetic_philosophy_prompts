  (1) A person-affecting view, in the sense that an act is wrong only if there's some particular person it's bad for — someone who exists or will exist, and for whom things go worse than they otherwise would have. If nobody in particular is made worse off, there's no wrong, just maybe an icky feeling.
  (2) In the standard case where a teenage girl has a baby now instead of waiting till she's older, and the kid's life turns out good on balance, I don't think she wronged the kid. The kid can't complain "you should have waited", because if she'd waited this kid wouldn't exist at all.
  (3) But I think it's wrong to deliberately bring someone into existence whose life will be barely worth living — just above the zero line, mostly suffering with a little good in it. Wrong even though that person, if you asked them, would rather exist than not.
  (4) I think we have very strong obligations to people who'll be alive centuries from now — wrecking the climate so they cant live decently is a serious wrong, not just a shame.
  (5) I think the repugnant conclusion is a decisive argument against total utilitarianism. A world with billions of people whose lives are barely worth living is not better than a small world of flourishing people. Any theory that says it is, is false.
  (6) I think adding a happy person to the world is, other things equal, a good thing — not just good for them, but it makes the world better.

  Some of these are rock solid for me and some I'm holding onto out of habit. What I want is an audit, not a lecture: tell me which of these actually pull against each other, which pairs only look like they conflict, and rank the real tensions from worst to least bad. For each real one, say exactly what has to give and what I lose by giving it up. I already suspect (2) and (3) cant both be true, so tell me if that's real or if I'm confused about where the problem is. Dont tell me to go read something more sophisticated — I want to know which of my own sentences is the one that has to go.

