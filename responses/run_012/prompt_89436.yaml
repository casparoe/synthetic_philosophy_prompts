  ### Real Tensions (Ranked Worst to Least Bad)

  **1. (1) vs. (3) — The Wrongful Life Contradiction**
  *   **The Conflict:** (1) says an act is wrong *only if* someone is made worse off than they otherwise would have been. (3) says creating a person with a barely worth living life is wrong *even though* they aren't worse off than never existing.
