  *   **Severity:** Fatal. These are direct logical negations of each other.

  **2. (1) vs. (4) — The Non-Identity Climate Problem**
  *   **The Conflict:** Climate policy changes who exists in the future (non-identity). If future people still have lives worth living, (1) says they aren't harmed (not worse off than the alternative where they wouldn't exist). (4) says wrecking their future is a serious wrong.
