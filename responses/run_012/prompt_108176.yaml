  ### The Counterfactual Flowchart: Who Made the Third Reich?

  Answer the following five questions in order. Follow the arrows to find your position in the debate.

  **1. The Identity Test (June 1934)**
  *Case:* During the Night of the Long Knives, imagine the SA purges the SS and Ernst Röhm takes control of the state.
  *Claim:* **This regime would still count as "Nazi Germany."**
  *   **No** $\rightarrow$ Go to **Leaf A**.
  *   **Yes** $\rightarrow$ Go to **Question 2**.

  **2. The Chaos Test (February 1923)**
  *Case:* Hitler is killed during the Beer Hall Putsch.
  *Claim:* **There is a determinate truth about whether a similar movement would have coalesced.**
  *   **No** $\rightarrow$ Go to **Leaf B**.
  *   **Yes** $\rightarrow$ Go to **Question 3**.

  **3. The Pressure Test (February 1933)**
  *Case:* The Reichstag Fire never happens.
  *Claim:* **The conservative elite would have granted emergency authoritarian powers anyway.**
  *   **No** $\rightarrow$ Go to **Question 4 (Path X)**.
  *   **Yes** $\rightarrow$ Go to **Question 4 (Path Y)**.

  **4. The Specificity Test (July 1944)**
  *Case:* The bomb plot succeeds and Hitler is removed.
  *Claim:* **The Holocaust and total war would have proceeded in substantially the same form.**
  *   **If Path X (from Q3 No) + Yes** $\rightarrow$ Go to **Leaf C**.
  *   **If Path X (from Q3 No) + No** $\rightarrow$ Go to **Leaf D**.
  *   **If Path Y (from Q3 Yes) + No** $\rightarrow$ Go to **Leaf E**.
  *   **If Path Y (from Q3 Yes) + Yes** $\rightarrow$ Go to **Question 5**.

  **5. The Timing Test (September 1938)**
