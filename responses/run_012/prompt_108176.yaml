  ### The Positions

  **Leaf A: The Individuationist**
  *   **Commitment:** The regime is defined by the leader's person, not its institutions.
  *   **Awkward Implication:** Historical analysis of the Third Reich collapses into biography; "Nazi Germany" ceases to exist the moment Hitler dies.

  **Leaf B: The Skeptic**
  *   **Commitment:** The counterfactual question has no determinate answer due to historical complexity.
  *   **Awkward Implication:** We cannot meaningfully assign causal weight to *any* specific event, rendering moral judgment on contingency impossible.

  **Leaf C: The Unoccupied Node**
  *   **Commitment:** The leader was necessary to seize power, but the system was sufficient to commit the crimes.
  *   **Status:** **Incoherent.** It posits a structure too weak to seize the state without a genius but strong enough to industrialize murder without him.

  **Leaf D: The Disruptionist (Individual Decisive)**
  *   **Commitment:** Removing the individual changes the trajectory so thoroughly that the outcome is unrecognizable.
  *   **Awkward Implication:** It risks absolving the broader society and institutions by placing the entire burden of evil on one psyche.

  **Leaf E: The Diversionist (Outcome Overdetermined)**
  *   **Commitment:** Structural pressures produce a different but comparably awful outcome.
  *   **Awkward Implication:** It suggests the specific horrors of the Holocaust were not unique, but merely the local shape of a generic authoritarian violence.

  **Leaf F: The Displacement Theorist (Structural Slot Decisive)**
  *   **Commitment:** A substitute occupies the same slot and the outcome is broadly reproduced.
  *   **Awkward Implication:** It implies that any ambitious leader in that office would have inevitably launched a war of extermination, flattening moral distinction between actors.
