answer: |-
  **MEMORANDUM**

  **TO:** Clinical Competency Committee, Diagnostic Radiology Residency
  **FROM:** [Your Name], CCC Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on AI-Assisted Read Protocol

  **Recommendation**
  I recommend we immediately revert to a mandatory **Resident-First** protocol for all AI-assisted rotations, effective with the next block assignment. Concurrently, we should institute a weekly **AI-Discrepancy Conference** where residents present cases where the AI flagged a finding they missed. We will review the efficacy of this hybrid model on **June 1**, prior to the vendor's software update.

  **The Epistemic Stakes**
  We are facing a conflict between two goods: immediate diagnostic sensitivity and the development of independent visual justification. The data is unambiguous: AI-first improves our current output (fewer discrepancies, caught near-misses) while eroding our residents' underlying competence (dropping blinded exam scores, inability to articulate rationale).

  The argument for keeping AI-first is the hardest to answer: if the model is more sensitive than our residents, insisting on human-first reads trades real patient findings for a virtue that mostly benefits the residents. We must engage this honestly. If a pneumothorax is missed because a resident didn't see the AI prompt first, that is a failure of our duty to the patient. However, this framing assumes the attending sign-off is not the true safety net. Our liability posture hasn't changed because the attending still signs off. The "safety" gain from AI-first is essentially pre-attending filtration. We are gaining efficiency and catching errors earlier in the chain, but we are not changing the final safety barrier.

  The cost of this efficiency is epistemic dependency. Learning radiology is not learning to produce correct reports; it is learning to see justification in the pixels. When a resident accepts the AI's call and reverse-engineers a rationale, they are forming a true belief without understanding the evidence. In epistemology, this is fragile. It works until the model changes or fails.

  **The Vendor Cliff**
  This fragility becomes critical given the vendor's roadmap. Next fall, the rationale disappears. The model will provide a call and a confidence number. The "verification tax" proposed by my colleague—writing out features to confirm the model—relies on the model telling you *what* features matter. If the model stops providing reasons, the tax becomes impossible to levy. Residents trained on AI-first with rationale will be stranded when the rationale vanishes. They will have learned to trust the box, not the image.

  If we stay AI-first now, we are training residents to rely on a scaffold that is being removed in twelve months. If we switch to Resident-first now, we force them to build their own visual literacy before the black box closes up.

  **Addressing the Vice Chair's Concern**
  The Vice Chair notes that accreditors measure output, not understanding. This is technically true for the milestones we file, but it is false for the mission of residency. We are certifying attendings who can practice without the model. If we optimize for today's milestones by outsourcing justification to the AI, we are gaming the metrics while failing the trainee. A resident who cannot explain why a finding is present is not competent, even if their report matches the attending's. When they graduate, the AI may not be there, or it may be wrong. We cannot graduate residents who are helpless without a crutch we know is changing shape.

  **The Proposed Path**
  Reverting to Resident-first will likely cause our resident-attending discrepancy rates to rise temporarily. We must accept this friction. It is the sound of learning happening. To mitigate the safety risk without creating dependency, we implement the **AI-Discrepancy Conference**.

  1.  **Protocol:** Residents must commit to a preliminary read before viewing AI output.
  2.  **Safety Net:** If the AI flags a significant finding the resident missed, the case is logged.
  3.  **Review:** Once weekly, residents present these "AI-caught" misses. They must locate the finding on the image and articulate the visual features *after* the fact.

  This captures the safety benefit (we still catch the miss) but converts it into a teaching moment rather than a silent correction. It forces the resident to reconcile their visual search pattern with the model's sensitivity without letting the model drive the initial perception.

  **Timeline**
  *   **Implementation:** Immediate (Next Rotation Start).
  *   **Review Date:** June 1. We will reassess blinded exam scores and discrepancy rates before the vendor updates the software. If the blinded scores do not stabilize or improve by June, we will need to consider restricting AI use entirely for senior residents.

  We are training radiologists, not AI auditors. We must prioritize the person who will eventually have to sign the report when the system goes down.
