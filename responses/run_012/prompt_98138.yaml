      *   *Objection B: The "Lakatosian Shield" (Progressive vs. Degenerating).*
          *   The user borrows from Lakatos ("enlarge surface"). But Lakatos admitted we can only judge this *historically*, in hindsight. If demarcation is only possible retrospectively, is it useful for distinguishing science *now*?
      *   *Objection C: The "Hidden Variable" Problem (Quantum Mechanics).*
          *   Bohmian Mechanics vs. Copenhagen. Same empirical predictions. Different ontologies. One might have a "larger" conceptual surface, but empirically identical. Is one more scientific?
      *   *Objection D: String Theory / Multiverse.*
