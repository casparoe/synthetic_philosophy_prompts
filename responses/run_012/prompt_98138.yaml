      *   **The Task:** Map the view's exposure. Identify observations, arguments, formal results, or historical developments that count against it.
      *   **Constraints:**
          *   Avoid standard/recycled objections (e.g., "criterion isn't falsifiable," "Duhem-Quine problem") unless sharpened specifically against *this* formulation.
