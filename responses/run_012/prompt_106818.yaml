      *(Self-Correction on Boundaries)*: Haecceitism is the view that there are primitive this-nesses. Kripke's argument is often taken to support haecceitism, but you don't need to teach the label. Keep it out.

      *(Self-Correction on Sequence)*: Make sure the distinction between *qualitative* and *numerical* identity is the very first thing. If they miss that, the hour is lost.

