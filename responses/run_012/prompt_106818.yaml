      *   Best (Modal): "In a possible world where your parents never met, do *you* exist but live elsewhere, or do *you* not exist at all?" (Tests the necessity claim directly). Let's go with this one.

  11. **Final Polish:** Check tone. Ensure it sounds like a TA/Instructor guide. Ensure the "Arc" sentence is perfect.

