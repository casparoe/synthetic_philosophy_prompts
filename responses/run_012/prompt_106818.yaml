answer: |-
  Here is the plan for your fifty minutes.

  ### 1. The Example: Drop the Twins
  You should drop the identical twins example as your **primary carrier**. Here is why: Kripke's thesis is about the *necessity* of origin (could *I* have come from different parents?), but the twins case is a problem for the *sufficiency* of origin (same parents/zygote $\rightarrow$ two different people).

  If you open with twins, students will immediately latch onto the biological mechanism of zygote splitting. They will argue, "If one zygote makes two people, then the zygote doesn't fix the person," which leads them to reject the necessity thesis before you've even explained it. It reverses the vector of the argument. It turns a metaphysical discussion about *modal identity* into a biological discussion about *individuation*.

  **The Better Carrier:** Use **"You"** (or a specific generic person, "Alice").
  *   **Why:** It forces the *de re* modal intuition. Every student has a stake in the question "Could *I* have been someone else?" It bypasses the biological complexity of twinning and focuses purely on the link between the specific gametes and the resulting individual.
  *   **How to use it:** Do not start with "Could you have different parents?" Start with the material. "You came from Sperm $S$ and Egg $E$. In World $W_2$, your parents conceive a child using Sperm $S^*$ and Egg $E$. Is that child you?"

  ### 2. The Sequence (50 Minutes)

  **0:00–0:10: The Setup (Numerical vs. Qualitative Identity)**
  *   **Goal:** Prevent the "Someone just like me" confusion.
  *   **Action:** Draw a stick figure on the board. Label it "You." Draw another identical stick figure next to it. Label it "Someone exactly like you."
  *   **Point:** Metaphysics isn't asking if a person with your personality, looks, and name could exist with different parents. It's asking if *this specific number on the roster of reality* could have been produced by different materials.
  *   **Misconception Check:** If a student says, "Well, I'd still be me," ask: "Do you mean you'd have the same memories, or that you are literally the same entity?" Force them to choose *numerical identity*.

  **0:10–0:25: The Argument (The Gamete Intuition Pump)**
  *   **Goal:** Rebuild Kripke's argument without the jargon.
  *   **Step 1:** Fix the actual origin. You = Sperm $A$ + Egg $B$.
  *   **Step 2:** Propose a small change. World 2: Sperm $A$ + Egg $B^*$ (a slightly different egg from the same mother).
  *   **Step 3:** Ask the intuition. Is the resulting person you? Most will say "No, that's my sibling."
  *   **Step 4:** Generalize. If a small change makes it a sibling, a large change (different parents) definitely makes it a different person.
  *   **Step 5:** The Conclusion. Therefore, having origin $A+B$ is *necessary* for being you.
  *   **Why this order:** You must establish the "Sibling Intuition" first. It is easier to agree that a sibling is not you than to agree that a totally different person is not you. This builds the bridge.

  **0:25–0:35: The Misconceptions (The "Crush" Phase)**
  *   **Goal:** Address the three big errors before they solidify.
  *   **1. Genetics (Spend 5 mins):** Students will say, "But if the DNA is the same, it's me."
      *   *Correction:* DNA is a *property* of the origin, not the origin itself. If a clone were made of you later, it has your DNA but a different origin (different egg/sperm event). It is not you. Origin trumps genetics.
  *   **2. Probability (Spend 3 mins):** Students will say, "It was astronomically unlikely I'd be born, so it's impossible I wouldn't be."
      *   *Correction:* Distinguish *probability* from *necessity*. It was unlikely a specific lottery ticket would win, but that ticket *could* have lost. Kripke isn't talking about odds; he's talking about what constitutes the *identity* of the winner.
  *   **3. Epistemic (Spend 2 mins):** Students will say, "We can't know which world is which, so it's meaningless."
      *   *Correction:* We aren't asking if we can *identify* the person in the dark. We are asking if there *is a fact of the matter*. (Use the "Morning Star/Evening Star" analogy if needed: you can know both are Venus without knowing the names refer to the same thing).

  **0:35–0:45: Boundaries (What We Are Not Doing)**
  *   **Goal:** Keep the discussion from exploding into ontology.
  *   **Refuse to engage:**
      *   **Haecceitism:** Do not introduce the term. If a student asks, "What makes *this* you and not *that* you besides the properties?", answer: "That's the primitive notion of identity we are working with. We are testing if origin is part of that primitive notion, not defining the notion itself."
      *   **Possible Worlds Realism:** Do not let them argue about whether other worlds are real. Treat worlds as "consistent stories" or "ways things could have been." If they push, say: "The argument works the same whether worlds are concrete or abstract; we are analyzing the truth conditions of the statement, not the furniture of the universe."

  **0:45–0:50: The Assessment**
  *   **Goal:** Verify they understand *Necessity of Origin*, not just *Causal Dependence*.
  *   **The Question:** "If Kripke is right, and your parents had decided to wait one year before conceiving, would *you* exist in that scenario, just born later? Or would *you* not exist, and a different sibling would exist instead?"
  *   **What to listen for:**
      *   *Wrong:* "I would exist but be younger." (This confuses you with a soul or a generic human).
      *   *Right:* "I would not exist. A different person (my sibling) would exist." (This shows they grasp that *this* specific person is tied to *that* specific fertilization event).

  ### 3. Summary of Misconceptions to Prioritize
  1.  **Genetics vs. Origin:** This is the biggest threat. If they think DNA determines identity, Kripke's argument fails. You must sever the link between "same genetic code" and "same person."
  2.  **Probability vs. Necessity:** Students love to conflate "really hard to happen" with "metaphysically impossible." Kill this early.
  3.  **Epistemic Access:** This is a sophisticated confusion. If they raise it, acknowledge it, but park it. It doesn't refute the thesis; it just questions our access to the truth.

  ### 4. What to Exclude
  *   **Haecceitism:** It's the right label, but it's a distraction. It turns the discussion into a debate about properties vs. primitive this-nesses. Keep the focus on *origin*.
  *   **Transworld Identity Criteria:** Don't let them try to solve *how* we track objects across worlds generally. Focus only on *persons* and *origins*.
  *   **The "No Overlap" Principle Technicalities:** Kripke argues you can't have the same origin produce two different people in different worlds. Don't formalize this unless they are advanced. Stick to the intuition: "Same stuff in, same person out."

  Arc: Secure the distinction between numerical and qualitative identity, use the specific gamete intuition to establish necessity, crush the genetics and probability confusions, and verify understanding by testing whether they accept that delayed conception implies non-existence.
