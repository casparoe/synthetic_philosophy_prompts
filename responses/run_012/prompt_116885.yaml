answer: |-
  ### The procedure

  1.  **Inventory** | **Q:** What are the explicit rules? | **A:** List (rhyme, meter, lipogram, etc.). | **Action:** Write list.
  2.  **Classification** | **Q:** What work does each rule do? | **A:** Container (structure), Sound (music), Content (hidden info), Point (the poem's core idea). | **Action:** Tag each rule.
  3.  **Feasibility** | **Q:** Can English do this without breaking syntax? | **A:** Yes / No / Only with distortion. | **Action:** Mark "No/Distortion" for sacrifice.
  4.  **Conflict Resolution** | **Q:** Which rules collide? | **A:** Hierarchy: Point > Content > Sound > Container. | **Action:** Sacrifice lower tier to save higher.
  5.  **Substitution** | **Q:** Does a new constraint create the same effect? | **A:** Yes (reader feels same) / No (just cleverness). | **Action:** If Yes, swap. If No, keep or go literal.
  6.  **Drafting** | **Q:** Does the poem stand alone as English? | **A:** Yes / No (requires explanation to make sense). | **Action:** If No, revise or abort to literal.
  7.  **Threshold** | **Q:** Did I sacrifice a "Point" constraint? | **A:** Yes / No. | **Action:** If Yes, switch to literal prose + note. If No, proceed.
  8.  **Consultation** | **Q:** Did I change "Content" or "Point"? | **A:** Yes / No. | **Action:** If Yes, stop and ask poet (see Handoff).
  9.  **Note Drafting** | **Q:** What did I break and why? | **A:** Specific rule + reason. | **Action:** Write note for back of book.
  10. **Judgment Log** | **Q:** Where did I guess? | **A:** List steps where intuition ruled. | **Action:** File for editor.

  ### Why it's in that order

  This order prioritizes function over form, echoing Hofstadter's spirit-over-letter without the verbosity. You must classify (Step 2) before you sacrifice (Step 4), or you will kill the poem's heart to save its skin. Feasibility (Step 3) comes early to prevent wasted effort on impossible tasks. The hierarchy in Step 4 is the engine; it forces you to admit that not all constraints are equal. I dropped linguistic distinctions between phoneme and grapheme because you need results, not theory. I dropped "beauty" as a metric because "sing" is useless; "stand alone" (Step 6) is testable. Consultation (Step 8) comes late so you bring solutions, not problems, but early enough to respect veto rights. The Judgment Log (Step 10) admits that no flowchart removes the human element. This sequence moves from analysis to synthesis to ethics, ensuring you never break a rule without knowing why it mattered in the first place.

  ### The three poems

  **Poem 1: The Acrostic Elegy**
  Step 2 classifies the Acrostic as Content (the name never appears elsewhere) and Meter as Container. Step 3 finds the name length mismatch makes 7-syllable lines impossible in English. Step 4 applies the hierarchy: Content > Container. You sacrifice the syllable count to preserve the sister's name. Step 5 offers no swap; the name is specific. Step 6 confirms the poem stands alone without the meter. Step 7 confirms you kept the Point (grief/memory). Step 9 requires a note: "Source text uses heptasyllables; English translation prioritizes the acrostic name." You keep the constraint that matters. The grief remains intact because the hidden name survives. The rhythm will feel looser, but the secret remains secret.
  **Verdict:** Keep acrostic, drop meter.
  **You'll like it.**

  **Poem 2: The Lipogram of Absence**
  Step 2 classifies the Lipogram as Point (the poem *is* the absence). Step 3 finds English syntax groans under the constraint. Step 4 says keep Point, but Step 6 (Drafting) fails; the syntax breaks semantics. The poem becomes unreadable code. Step 7 triggers: You sacrificed readability for Point. You cannot translate this in verse. You must provide a literal prose translation of the meaning and a note explaining the missing vowel in the source. You effectively drop the constraint from the English text because preserving it destroys the communication. Hofstadter would argue for recreating the effect, but if the effect is unreadability, you fail the translator's duty.
  **Verdict:** Drop the constraint in translation. Go literal + note.
  **You won't like it, but the poem survives.**

  **Poem 3: The Alphabetical Order**
  Step 2 classifies Alphabetical Order as Container (reader never feels it). Step 4 sacrifices it immediately against Meaning or Sound. Step 5 finds no need for a swap; the constraint is invisible. You translate for meaning and natural rhythm. Step 9 requires a note: "Source text orders words alphabetically; this constraint was dropped as it is invisible to the reader." You stop torturing syntax for a secret no one sees. This frees you to focus on the actual language. The poem becomes a poem, not a puzzle. The estate cannot veto this because the constraint serves no communicative function.
  **Verdict:** Drop the constraint. Translate freely.
  **You'll like it.**

  ### Where it hands off to me or the poet

  Stop at Step 8. Do not ask "Is this okay?" That invites vague anxiety. Ask: "The source poem relies on [Constraint X] to convey [Effect Y]. English syntax makes [Constraint X] impossible without breaking [Semantic Z]. I propose preserving [Effect Y] by [Solution A] instead. Do you veto this swap?" This forces a binary choice on them, not a vague approval. It respects their veto while forcing them to engage with the translation problem, not just the output. For estates, ask: "Does the author's known stance on [Constraint Type] prioritize form fidelity or readability?" If unknown, default to readability unless constraint is "Point". If they veto the swap, you must proceed to Step 7 (Literal + Note). You cannot override a veto on Content or Point. This question isolates the specific trade-off, making it answerable for a poet who doesn't speak English. It protects you from later accusations of negligence.

  ### What it can't do

  It cannot measure "song." Step 6 asks if the poem stands alone, but "sing" is subjective. It cannot resolve conflicts where two "Point" constraints collide (rare, but possible). It cannot predict reader reception of the note. It assumes you can identify the "Point" correctly; if you misclassify a Container as a Point, you waste effort. It doesn't solve the pain of loss; it only manages the technical ethics of that loss. It requires honesty; if you lie in Step 10, the procedure fails. It cannot force a poet to be reasonable. If a poet insists on an impossible constraint, you must walk away or publish the literal. It is a tool for decision, not a guarantee of quality.
