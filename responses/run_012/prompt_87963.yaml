  # Joint Statement on the Reflection Principle

  **Submitted for:** Department Disagreement Week
  **Authors:** [User Name] and [Officemate Name]

  ### I. Agreed Claims

  1.  **Formulation:** We agree to formulate van Fraassen's Reflection Principle as follows: A rational agent's current credence in proposition $A$, conditional on their future credence in $A$ being $x$, ought to be $x$. Formally: $P_t(A \mid P_{t'}(A) = x) = x$.
  2.  **Normative Status:** We agree that Reflection is not a logical truth derived from the probability axioms alone; it is a normative constraint on rational belief revision and self-trust.
  3.  **The Radiologist Scenario (Base Case):** We agree on the description of the Night-Shift Radiologist case: The radiologist knows that at the end of her double shift ($t'$), fatigue will cause her to assign credence 0.85 to a borderline scan being malignant ($A$). She also possesses audit data confirming that end-of-shift reads systematically overcall malignancy.
  4.  **The Pill Scenario (Variant):** We agree on the description of the Pill Variant: The radiologist can take a pill at $t$ that she knows with certainty will mechanistically set her credence in $A$ to exactly 0.85 at $t'$, independent of evidence or reliability.
  5.  **Relevance:** We agree that both cases bear directly on whether Reflection is a universal requirement of rationality or a contingent heuristic dependent on the epistemic quality of the future self.
  6.  **Documentation:** We agree to record our divergent predictions regarding these cases in advance of further discussion, to distinguish substantive disagreement from shifting intuitions.

  ### II. Points of Disagreement

  | Crux | Case | [Officemate]'s Position (Pro-Reflection) | [User]'s Position (Conditional Reflection) | Shared Significance of Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Known Bias** | **Night-Shift Radiologist**<br>*(Future credence 0.85 known to be biased by fatigue/overcall)* | **Reflection Holds.**<br>$P_t(A \mid P_{t'}(A)=0.85) = 0.85$.<br>If the agent knows her future credence will be 0.85, rationality requires her current conditional credence to match. Knowledge of systemic overcall should adjust her *expectation* of what her future credence will be, not her conditionalization on it once fixed. | **Reflection Fails.**<br>$P_t(A \mid P_{t'}(A)=0.85) \neq 0.85$.<br>Because the agent knows the future credence is generated by a process (fatigue) known to degrade accuracy, the future credence is not expert. Conditionalizing on it launders error into current belief. | Determines whether Reflection is a constraint on **coherence** (internal consistency between time-slices) or **accuracy** (tracking truth via reliable processes). |
  | **2. Known Manipulation** | **The Pill Variant**<br>*(Future credence 0.85 caused by chemical mechanism)* | **Reflection Holds.**<br>$P_t(A \mid \text{Pill} \to P_{t'}(A)=0.85) = 0.85$.<br>To know you will believe $x$ is to have a reason to believe $x$ now. Violating this creates a diachronic Moore-paradox: "I believe not-$x$, though I know I will rationally believe $x$." | **Reflection Fails.**<br>$P_t(A \mid \text{Pill} \to P_{t'}(A)=0.85) \neq 0.85$.<br>The pill severs the link between credence and evidence. Aligning with a known arbitrary mechanism is not rationality; it is surrender to epistemic luck. | Tests whether the *source* of the future credence matters. If Reflection holds here, it is purely about self-prediction, not epistemic value. |
  | **3. Scope of Rationality** | **General Principle** | **Universal Requirement.**<br>Violation of Reflection is itself a form of irrationality, regardless of the external reliability of the future self. It signals a failure of self-trust. | **Contingent Heuristic.**<br>Reflection is rational only when the future self is expected to be at least as informed and reliable as the current self. Violation is permitted when future reliability is compromised. | Decides whether Reflection is a foundational norm of agency or a derivative rule based on expected epistemic improvement. |

  ### III. Note on Verbal vs. Substantive Disagreement

  We have identified one area where our disagreement risks being merely verbal, though we believe the core conflict remains substantive.

  **The Verbal Risk:** If [Officemate] defines "Rational Future Credence" as *by definition* satisfying the conditions required for Reflection (i.e., excluding cases of known bias or manipulation from the scope of the principle), then our disagreement collapses into a definition of terms. In that reading, [Officemate] would concede the Radiologist case is not a counterexample because the future credence there is not "Rational" in the required sense.

  **Why It Is Substantive:** However, [Officemate] maintains that the Principle applies whenever the agent *knows* what their future credence will be, regardless of how that credence is produced. She insists that the Radiologist's knowledge of her future 0.85 credence *itself* warrants a current conditional credence of 0.85, even if that future credence is known to be biased. [User] maintains that knowledge of bias defeats the warrant. Because we disagree on whether the *source* of the future credence (fatigue vs. evidence vs. pill) impacts the normative force of the principle, our disagreement is substantive. It concerns whether rationality is fundamentally about internal consistency across time or about maximizing expected accuracy relative to the world.
