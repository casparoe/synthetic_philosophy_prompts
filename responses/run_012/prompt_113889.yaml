              *   *Prediction:* Formalist says "Boundaries always cut through processes; that's the nature of boundaries." Diachronist says "This specific cut privileges nuclear history over ecological history."
          *   *Crux 3: The Authority of the ICS.*
              *   *Question:* If the ICS says no, is it still geology?
              *   *Prediction:* Formalist: "No." Diachronist: "Geology is bigger than the ICS."

      *   **Section 4: Verbal vs. Substantive:**
          *   Identify where the fight is about definitions of "Epoch" vs. "Concept."
          *   Acknowledge that "Anthropocene" is doing double duty (scientific unit vs. cultural epoch).

  4.  **Refining and Polishing:**
      *   *Check Specific Threads:*
          *   *Lithostratigraphy:* Make sure to clarify the distinction between *lithostratigraphic* contacts (which can be time-transgressive) and *chronostratigraphic* boundaries (which must be synchronous). This is a key geological technicality the formalist will care about.
          *   *Radionuclides:* Ensure the STS student's critique (that it's a weapon byproduct, not an Earth system transformation per se) is captured fairly, and the Formalist's counter (it's the best global marker, regardless of cause) is also there.
