answer: |-
  You have put your finger on a genuine tension in the literature. Textbooks often conflate the Argument from Illusion and the Argument from Hallucination because they were historically deployed together by the sense-datum theorists (like Ayer or Price) to batter Direct Realism into submission. However, as you suspect, they target different vulnerabilities and rely on slightly different machinery. A disjunctivist can, in principle, parry one while ducking the other, though doing so requires care.

  Here is the breakdown you asked for.

  ### 1. Separating the Arguments

  The two arguments share a conclusion (that we are not directly aware of mind-independent objects) but they arrive there via different routes.

  **The Argument from Hallucination**
  *   **Focus:** The *existence* of the object.
  *   **Premise 1:** It is possible to have an experience subjectively indistinguishable from a veridical perception where no relevant external object exists (a hallucination).
  *   **Premise 2 (The Common Kind Assumption):** If two experiences are subjectively indistinguishable, they must be of the same fundamental metaphysical kind. (This is often called the 'Highest Common Factor' view).
  *   **Inference:** Therefore, the veridical case and the hallucinatory case share a common constituent (a sense-datum or an internal experiential state).
  *   **Conclusion:** In the veridical case, what you are directly aware of is this common constituent, not the external object itself.
  *   **Where the wedge bites:** It forces you to choose between denying the possibility of hallucination (implausible) or denying the Common Kind Assumption. The disjunctivist denies the Common Kind Assumption. They say the hallucination is a distinct kind of state that merely *seems* like perception.

  **The Argument from Illusion**
  *   **Focus:** The *properties* of the object.
  *   **Premise 1:** In cases of illusion (bent stick, yellow snow), the object appears to have a property (bentness, yellowness) that it does not actually possess.
  *   **Premise 2 (The Phenomenal Principle):** If something sensibly appears to have a property, then there is something of which one is aware that actually has that property.
  *   **Inference:** Since the stick is not bent, what you are aware of cannot be the stick. It must be something else (a sense-datum) that *is* bent.
  *   **Conclusion:** We are directly aware of sense-data, not external objects.
  *   **Where the wedge bites:** It targets the Naive Realist's claim that we perceive objects *as they are*.

  **The Divergence**
  The Argument from Hallucination requires the **Common Kind Assumption** to get off the ground. Without it, the hallucinator is in a fundamentally different state from the perceiver, and no inference to sense-data follows.

  The Argument from Illusion, strictly speaking, does not need the Common Kind Assumption. It needs the **Phenomenal Principle**. However, you are quite right to suspect a sleight of hand. To move from "I am aware of something bent" to "This something bent is an internal state common to all perception," the sense-datum theorist usually smuggles in the idea that the *immediate object of awareness* in the illusion case must be the same *kind* of thing as the immediate object in the veridical case.

  If the Naive Realist says, "I see the stick, but the light is refracted," they are rejecting the Phenomenal Principle. They are saying: "It looks bent, but nothing in my experience is actually bent; rather, I am related to a straight stick in a way that generates a 'bent' appearance." The Argument from Illusion only works if you insist that the 'bentness' must be a property of *something* present to the mind.

  ### 2. Experience vs. Evidence

  This is a crucial distinction that often gets muddied.

  **Common Kind of Experience (Metaphysical)**
  This is a claim about the nature of the mental state token. To say there is a common kind of experience is to say that the neurophysiological or phenomenological constitution of the hallucinating subject is of the same fundamental type as the perceiving subject. Disjunctivism denies this. It says the veridical case is a relation to an object; the hallucinatory case is a brute internal occurrence.

  **Common Kind of Evidence (Epistemological)**
  This is a claim about justification. To say there is a common kind of evidence is to say that the subject's justification for their belief is the same in both cases (e.g., "it looks as if there is a tomato").

  **Can you mix them?**
  Yes, and doing so is a stable philosophical position, though it requires precision.

  *   **Disjunctivist about Experience, Common Kind about Evidence:** This is a coherent position. You can hold that metaphysically, seeing is a relation to the world (disjunctivism), but epistemologically, because the subject cannot tell the difference, their *internal* justification is limited to how things seem. This is often the position of an internalist who wants to save Naive Realism. They admit that from the *inside*, the evidence is the same, even if from the *outside*, the metaphysical state is different.
  *   **Common Kind about Experience, Disjunctivist about Evidence:** This is harder but possible via externalism. You could say the mental states are identical (Common Kind), but because one is caused by a real object and the other isn't, the one provides factive evidence ("I see that p") while the other does not. This is a Reliabilist move.

  **Do they collapse?**
  They do not logically collapse, but they exert pressure on one another. If you are a Disjunctivist about Experience (the standard view), you are strongly motivated to be a Disjunctivist about Evidence (Epistemological Disjunctivism, e.g., McDowell or Pritchard). Why? Because if the veridical case is a direct openness to the world, surely that openness provides a *better* kind of reason than a mere appearance. If you concede the evidence is the same, you risk making the metaphysical difference idle. However, you can maintain the distinction: the metaphysics is disjunctive, but the *accessible* justification is common.

  ### 3. The Reflection Case

  This is a splendid case because it sits in the uncanny valley between illusion and hallucination.

  **The Setup:** Tree vs. Reflection. Indistinguishable. Causal link in both (light from tree). Property match in both (colour, shape). Mismatch in location/depth.

  **Is it one kind of experience or two?**
  A disjunctivist ought to say they are **two different kinds of perceptual relation**, even if they are visually indistinguishable.
  *   **Case A (Direct):** You stand in a perceptual relation to the tree itself. The tree constitutes your experience.
  *   **Case B (Reflection):** You stand in a perceptual relation to a reflection (a pattern of light on water) which carries information about the tree.

  **Is the reflection case a case of seeing the tree?**
  Ordinarily, we say "I see the tree in the water." But strictly speaking, the disjunctivist should parse this carefully. You are seeing the *reflection* of the tree. The immediate object of your perception is the light pattern on the water surface. The tree is the distal cause. In the direct case, the immediate object is the tree. Therefore, the fundamental nature of the perceptual contact is different. One is unmediated (in the relevant philosophical sense); the other is mediated by a reflective surface.

  **Does this collapse the wedge?**
  You suggest that because the object (the tree) is causally responsible in both, the Argument from Illusion loses its bite. I disagree. The Argument from Illusion relies on the **property mismatch**, not the causal history.
  In the reflection case, you perceive the tree to be *at the location of the reflection*. The tree is not there. So, you have a property mismatch (location).
  *   **Sense-Datum Theorist:** "You are aware of an image located in the water. That image is the sense-datum."
  *   **Disjunctivist:** "In the direct case, you perceive the tree's location. In the reflection case, you perceive the water's surface properties which specify the tree. These are different perceptual achievements."

  The reflection case does not kill the Argument from Illusion because the Illusion argument asks: "What possesses the property of *being at that location*?" If you say "The tree," you are wrong (the tree is on the bank). If you say "Nothing," you struggle to explain the vivid spatial experience. The sense-datum theorist says "The sense-datum." The disjunctivist says "The experience is of a tree-at-that-location, but in the reflection case, this is a failure of the perceptual system to track the distal object's true location, mediated by the water."

  Crucially, the reflection case is actually a form of **veridical perception of a proximal object (the reflection)** combined with **illusory perception of a distal object (the tree)**. It doesn't force a common kind between *this* and *hallucination*. It merely shows that "seeing" is a complex family of relations. It complicates the picture, but it doesn't force the Common Kind Assumption. You can still maintain a disjunction between "Direct perception of X" and "Perception of a reflection of X".

  ### 4. Does the Argument from Illusion earn its keep?

  Once you have the Argument from Hallucination, is the Argument from Illusion merely rhetorical padding?

  **My verdict:** It is historically essential but logically secondary.

  The Argument from Hallucination is the heavy artillery against Direct Realism. It attacks the very possibility of the object being a constituent of the experience. If you defeat the Common Kind Assumption there, the sense-datum theory crumbles.

  However, the Argument from Illusion earns its keep in two specific ways:
  1.  **Motivating the Phenomenal Principle:** Hallucination motivates the idea that experience has an internal object (because there is no external one). Illusion motivates the idea that this internal object must have *specific properties* (bentness, yellowness) that the external world lacks. Without Illusion, the sense-datum theorist has no explanation for why our internal states have the specific qualitative character they do.
  2.  **Phenomenological Plausibility:** It is easier to persuade a student that a stick *looks* bent (Illusion) than that they might be hallucinating a stick entirely (Hallucination). Illusion provides the phenomenological data; Hallucination provides the metaphysical lever.

  So, is it padding? No. It provides the qualitative content for the internal state that Hallucination posits. But if you are a disjunctivist, the Argument from Hallucination is the one you must fight. The Argument from Illusion can often be dissolved by a sophisticated Naive Realist account of optics and properties (the stick isn't bent, the light path is). The Hallucination argument cannot be dissolved by optics; it requires a metaphysical stand on the nature of mind.

  In short: Illusion sets the trap; Hallucination springs it. You can disarm the trap (Illusion) with a good theory of refraction, but you still have to deal with the gun (Hallucination).
