          *   Premise 2: What is directly perceived must have the properties it appears to have (the bent stick *looks* bent).
          *   Premise 3 (Common Kind/Phenomenal Principle): If it looks F, something is F. Since the stick isn't F, it must be a sense-datum that is F.
          *   *Divergence:* Hallucination attacks the *existence* of the object; Illusion attacks the *properties* of the object.
          *   *Common Kind Work:* In Hallucination, it bridges the gap between "nothing there" and "something there". In Illusion, it bridges the gap between "property mismatch" and "direct object of awareness".
