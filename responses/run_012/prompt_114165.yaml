answer: |-
  You have put your finger on one of the central, thorniest issues in the philosophy of science. You aren't mangling terms; you are describing a genuine epistemic problem that has kept philosophers awake for decades.

  The short answer is that there is no single, universally agreed-upon word that captures both the *methodological sin* and the *rhetorical sleight of hand* you described. However, there is a cluster of terms that map onto different parts of the problem.

  Here is the breakdown of the existing terminology, why it feels slightly off to you, and a proposed coinage for the specific rhetorical move you're spotting.

  ### 1. The Existing Terminology (and why it feels incomplete)

  **A. Accommodation vs. Prediction**
  This is the standard distinction. *Prediction* is when a theory forecasts new data; *Accommodation* is when it fits existing data.
  *   **Why it's not quite it:** Accommodation isn't inherently bad. General Relativity accommodated the perihelion of Mercury (which was already known), and that counts as strong evidence. Your intuition correctly senses that *some* accommodation is legitimate and *some* is cheating, but the term "accommodation" itself is neutral.

  **B. The Problem of Old Evidence**
  This is the Bayesian puzzle you mentioned (Flavor 1). If we already know $E$ is true (probability = 1), how can learning that Theory $H$ implies $E$ increase our confidence in $H$?
  *   **Why it's not quite it:** This focuses on the *logic of belief updating*, not the *process of construction*. It explains why old evidence is puzzling, but not why using it to *build* the theory is suspect.

  **C. Overfitting / Curve-Fitting**
  This is the data science term (Flavor 2). It describes a model that captures noise rather than signal because it has too many parameters relative to the data.
  *   **Why it's not quite it:** This is usually a statistical claim about complexity. You can overfit without being deceptive (you might just be mistaken). You are describing a situation where the fit is *presented* as a test, despite being guaranteed by construction.

  **D. Ad Hoc Hypothesis**
  In the Lakatos/Popper tradition, an *ad hoc* modification is one made solely to save a theory from falsification, without adding new testable content.
  *   **Why it's not quite it:** This usually applies to patching an *existing* theory. You are describing building a *new* theory entirely around the data.

  ### 2. The Precise Philosophical Concept: "Heuristic Novelty"

  The term that comes closest to the *epistemic sin* you are describing is **Lack of Heuristic Novelty**.

  Philosopher John Worrall distinguished between two types of novelty:
  1.  **Temporal Novelty:** The data was discovered *after* the theory was published.
  2.  **Heuristic Novelty:** The data was *not used* in the construction of the theory.

  Your "Flavor 2" (using the data to build the theory) is a violation of **Heuristic Novelty**. Even if the data is new to the world, if it was used to tune the parameters of the model, it lacks heuristic novelty. The scientific community generally agrees that data lacking heuristic novelty provides much weaker confirmation than data that possesses it.

  The structural requirement you are looking for is called **The Independence Requirement** (or the **Use-Construction Distinction**). The rule is: *The data used to test a hypothesis must be independent of the data used to construct it.*

  ### 3. The Missing Label: "Confirmation Laundering"

  While "Independence Violation" describes the logical error, it doesn't capture the *rhetorical move* you noticed: the act of taking data that was used as *input* (ingredients) and presenting it as *output* (validation).

  Since you asked me to coin a term if none existed, I propose: **Confirmation Laundering**.

  **Definition:** *Confirmation Laundering* occurs when data used to construct or tune a model is subsequently presented as independent evidence confirming that model, thereby "cleaning" the data's status from "assumption" to "proof."

  **Why this fits:**
  *   Like money laundering, it obscures the origin of the asset (the data).
  *   It takes "dirty" data (contaminated by its role in construction) and runs it through a process (the write-up) to make it look "clean" (objective evidence).
  *   It captures the "sausage making" vibe you described.

  ### 4. Distinguishing the Two Flavors

  You asked if you are lumping two things together. You are, but they share the same root sin.

  *   **Flavor 1 (Old Evidence):** The sin is **Temporal**. The data was known, so the theory didn't *risk* being wrong about it. (Example: A theorist knows the mass of the Higgs boson is roughly 125 GeV from leaks, builds a model that requires 125 GeV, then publishes claiming their model "predicts" 125 GeV).
  *   **Flavor 2 (Constructive Use):** The sin is **Logical**. The theory was *tuned* to the data. (Example: Adjusting the "fudge factors" in a climate model until the hindcast matches the 20th-century temperature record, then claiming the model is validated by the 20th-century record).

  **The Unifying Sin:** In both cases, the theory **did not risk failure.**
  Karl Popper argued that science progresses through bold conjectures that risk falsification. In both flavors you described, the fit was guaranteed. The "Confirmation Laundering" is the act of hiding that guarantee.

  ### 5. The Boundary: When is Accommodation Legitimate?

  You asked where the line is between this and the respectable case (like General Relativity and Mercury). This is the hardest question in confirmation theory, but the consensus answer relies on **Independent Constraints**.

  **Illegitimate Accommodation (Confirmation Laundering):**
  *   **Process:** "I want to explain X. I will add a parameter/assumption until the model outputs X."
  *   **Structure:** The fit is the *target*.
  *   **Result:** The theory could not have failed to fit X.

  **Legitimate Accommodation (The GR Case):**
  *   **Process:** "I am building a theory of gravity based on principles A, B, and C (equivalence principle, general covariance, etc.). I derive the field equations. I notice that when I solve these equations for a planet, they *automatically* yield the anomalous perihelion shift X, even though I did not put X into the equations."
  *   **Structure:** The fit is a *byproduct*.
  *   **Result:** The theory *could* have failed. The equations could have yielded a different number. The fact that they yielded X is surprising.

  **The Test:** Ask, "If the data had been different, would the theory have been different?"
  *   If **Yes**: You are looking at Confirmation Laundering. (If Mercury's orbit were different, the theorist would have tweaked the model until it matched the new orbit).
  *   If **No**: You are looking at Legitimate Accommodation. (If Mercury's orbit were different, Einstein's field equations would have remained the same; they simply would have been falsified).

  ### Summary

  *   **Technical Name:** Violation of the **Independence Requirement** / Lack of **Heuristic Novelty**.
  *   **Statistical Name:** **Overfitting** or **Double-Dipping**.
  *   **The Rhetorical Move (Coined):** **Confirmation Laundering**.
  *   **The Litmus Test:** **Could the theory have failed?** If the construction process ensured the fit, presenting that fit as evidence is Confirmation Laundering. If the fit was a risky byproduct of independent constraints, it is legitimate Accommodation.

  You are right to be suspicious. In the wild, this move is rampant. The "sausage" is almost always hidden in the supplementary materials, if it's shown at all.
