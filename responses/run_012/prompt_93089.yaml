answer: |-
  The scene
  Sarah and Mark are senior managers at a logistics firm who have spent years inflating client dinner receipts by fifty dollars, pocketing the difference without much thought. Sarah was flagged by an audit last month, forced to repay the money, and stopped only because the new system catches her; she feels no moral regret, only annoyance at the scrutiny. Mark continues to pad his claims exactly as before. Sarah corners Mark in the breakroom after seeing his latest submission and tells him plainly that she knows she did the same thing and only stopped because she got caught. She does not claim to be better than him. She says they are both stealing from the team budget and that if they both keep going, they will both be fired, but insists that what they are doing is wrong and must stop now. She frames it as a shared failure rather than a personal indictment, and Mark flushes with shame while the other staff members stop talking to listen.

  What the three views say
  The strict view holds that committing the same wrong eliminates one's moral standing to blame, regardless of context. On this view, Sarah has no standing to call out Mark because she is guilty of the exact same theft. Her honesty about her past conduct does not restore the authority she lost when she first committed the fraud; the hypocrisy condition is triggered by the act itself, not by her attitude about it, so her blame is illegitimate.

  The permissive view holds that hypocrisy never undermines standing to blame, only providing the target with a rhetorical comeback. On this view, Sarah has full standing because the wrongness of expense fraud is objective and independent of who points it out. Her admission of guilt is irrelevant to her right to blame; Mark cannot dismiss the criticism simply because Sarah is also guilty, though he may point out her inconsistency to lessen the sting.

  The middle view holds that hypocrisy kills standing only when the blamer claims superior virtue or hides their own record to put on airs. On this view, Sarah retains standing because she is transparent about her record and frames the reproach inclusively. By refusing to position herself above Mark and acknowledging their shared fault, she avoids the specific dishonesty or arrogance that usually renders hypocritical blame objectionable, so her standing remains intact.

  What's doing the work
  The feature pulling the intuition is the blamer's transparent, self-inclusive framing, which shifts the dynamic from vertical judgment to horizontal accountability. This makes the strict view uncomfortable because it insists standing is dead regardless of this framing, contradicting the sense that Sarah is permitted to speak. It suggests that standing is not solely a function of past conduct but depends on the relational posture adopted during the act of blame.

  Take it away
  If Sarah hides her record or claims she is morally superior to Mark, the intuition shifts sharply against her, making her seem like a bully or a nag. The strict view's verdict remains unchanged, as she still lacks standing, but now aligns better with the negative intuition. The middle view's verdict flips, as she is now putting on airs, which explains why the intuition changed while the strict view cannot explain the difference between the two scenarios.

  How they fight back
  A defender of the strict view might argue that Sarah is not actually offering moral blame but merely issuing a prudential warning about getting caught, which does not require standing. Alternatively, they might insist that moral standing is an authority grounded in innocence, which honesty cannot restore, arguing that the positive intuition is just a reaction to her likability rather than her actual right to blame. This challenges whether the case truly tests standing or just tests our preference for honest people.

  Where I'd come out
  You should lean on the middle view, as it captures the nuance that standing depends on how one blames, not just who one is. The case shows that transparency and shared identity can preserve standing even when past conduct is identical. This proves hypocrisy is about posture rather than mere history.
