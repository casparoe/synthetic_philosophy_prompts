answer: |-
  The screen in the Logistics Command center displayed two blinking amber lights. One represented the Monsoon Forecast for the Delta Region. The other represented the Structural Integrity Status of the Northern Causeway.

  Elara stood behind the glass partition, watching Director Vance prepare the release order. Her hands were clasped tight behind her back.

  "The monsoon probability is locked at forty percent," Vance said, tapping the glass. "The causeway failure risk is assessed at forty percent. Standard protocol."

  "Director," Elara said, her voice cutting through the hum of the servers. "The causeway was built in the eighties. The drainage systems are clogged. If the rain hits, the bridge doesn't just face risk; it faces certainty. They aren't separate events."

  Vance didn't turn around. He adjusted his cuffs. "Do you have an engineering survey confirming the drainage failure?"

  "Not yet. The survey team is grounded until the weather clears."

  "Then we have no derivation of dependence." Vance picked up a stylus. "We cannot adjust the joint probability based on speculation. You know the Protocol."

  Elara stepped closer to the glass. "I've seen the maintenance logs. I've talked to the locals. The water rises, the pressure builds, the concrete fails. It's a chain. If you treat them as independent coins, you're calculating the odds of two heads. But these aren't coins. They're gears."

  "And if you treat them as gears without a schematic, you break the machine," Vance said calmly. "Last year, we assumed a link between the drought and the pestilence. We doubled the grain shipment. The pestilence never came. We wasted three million credits rotting in silos. The Protocol prevents wishful thinking. It prevents us from funding ghosts."

  "It prevents us from seeing the wall until we hit it," Elara countered. "If the rain comes, the bridge goes. The probability of the conjunction isn't point-four times point-four. It's point-four. If you multiply them, you're telling the field teams there's only a sixteen percent chance of a cutoff. They'll send the heavy trucks."

  "And if you're wrong?" Vance asked, finally turning. His eyes were tired. "If you're wrong, and we inflate the risk based on a hunch, we withhold supplies from the North because we're hoarding for a collapse that doesn't happen. People starve either way, Elara. The Protocol ensures our errors are consistent. It ensures we can audit why we failed."

  "Consistency isn't survival," she said.

  "Survival isn't our mandate. Allocation is." Vance touched the screen. The interface accepted his input. The two amber lights remained separate. A third number generated below them: *Joint Risk Probability: 0.16.*

  Elara watched the number solidify. It was clean. It was mathematically pristine. It was internally consistent. It assumed that the water falling from the sky had no relationship to the stone beneath the wheels.

  "Sign it," Vance said, sliding the tablet toward the biometric scanner.

  Elara didn't move. She looked at the map on the wall. The Delta region was a web of roads that all funneled through the Northern Causeway. There was no other way out. If the bridge fell during the rain, the region was an island. The Model didn't know about the funnel. The Model saw coordinates, not topology.

  "Elara," Vance warned. "The window closes in two minutes."

  She knew she couldn't stop him. She had no data string to link the rain to the concrete. She had only the feeling of the thing, the pattern recognized in the mud and the rust. The Protocol demanded proof, and the proof was currently underwater.

  She stepped forward and placed her hand on the scanner. Her authorization was required for the field dispatch levels. Vance had set the risk low; she could override the supply quantity, but not the risk assessment. If she ordered more trucks against the low risk assessment, the audit trail would flag her for insubordination. If she followed the assessment, the trucks might not come at all.

  She looked at Vance. He looked back, expectant, trusting the system that kept his conscience clean.

  Elara pressed her thumb to the glass. She authorized the standard dispatch. She watched the number sixteen percent lock into the mission briefings for the drivers.

  "God help them," she whispered.

  "The math will," Vance said, turning back to his console.

  Outside, the sky darkened. The first drops hit the reinforced windows, sliding down the glass like tears. Elara watched the rain, knowing it was already inside the room, inside the calculation, hidden in the space between the numbers where the Protocol refused to look.

  ***

  **Afterword**

  This story takes liberties by portraying the presumption of independence as a rigid bureaucratic mandate rather than a methodological prior. In practice, rational agents use correlation matrices and update beliefs with Bayesian inference; they do not blindly multiply probabilities when structural links are suspected but unproven. The story assumes a reading where "cannot be derived" means "cannot be proven within the decision timeframe," forcing a binary choice between discipline and intuition. A defender of the rule might reject this as a straw man, arguing that the rule is meant to prevent overfitting noise, not to ignore obvious structural constraints. What would change my mind about the fairness of this portrayal is an argument demonstrating how the presumption of independence handles "unknown unknowns" better than intuition. If the rule can be shown to survive systemic shocks that gut-feeling correlation predicts falsely, the conflict shifts from "rigid vs. wise" to "robust vs. fragile," requiring a rewrite where Elara's intuition leads to a costly false positive.
