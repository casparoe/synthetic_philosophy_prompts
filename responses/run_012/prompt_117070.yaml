      *   *Epistemology:* What if the truth is not compressible into the judge's language? (Kolmogorov complexity).
      *   *Psychology/Rhetoric:* Humans (and RLHF models) are biased towards confidence, fluency, and simplicity, not truth. A lie can be simpler than the truth.
      *   *The "Weak Judge" Problem:* If the judge is *too* weak, they can't distinguish "I don't understand" from "This is nonsense."
