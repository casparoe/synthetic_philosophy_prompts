answer: |-
  # JOINT STATEMENT ON THE EPISTEMIC FOUNDATIONS OF GAME C

  **Signatories:** The Epistemic-Program Consortium (EP) & The Idealization-Skeptic Working Group (IS)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Solution Concepts in Perfect Information Games

  ## PREAMBLE: DEFINITIONS AND DIVERGENCES

  To facilitate clear disagreement, we first fix the terminology used in this document. We agree on the formal structures but flag where our interpretations diverge.

  1.  **Rationality:** We both define *rationality* at a decision node as the selection of an action that maximizes expected utility given the player's beliefs at that node.
      *   *Flag:* **EP** treats rationality as a property of a complete strategy plan chosen ex-ante. **IS** treats rationality as a property of actions taken at specific nodes, contingent on information available at that time.
  2.  **Common Knowledge of Rationality (CKR):** We both define CKR formally as an infinite hierarchy of knowledge: Player 1 is rational, Player 2 is rational, Player 1 knows Player 2 is rational, Player 2 knows Player 1 is rational, etc.
      *   *Flag:* **EP** treats CKR as a static constraint on the epistemic model that holds true at the start of the game and restricts which nodes are *reachable* in the model. **IS** treats CKR as a dynamic assumption that must be evaluated at every node actually reached; if a node is reached that contradicts CKR, the assumption is falsified for that node.
  3.  **Solution Concept:** We refer to the *Backward Induction (BI)* outcome as the result derived by solving the game from the final node backward to the root, assuming utility maximization at every node.

  ---

  ## 1. JOINT CLAIMS

  Both parties sign the following claims regarding the analysis of Game C and its variants. These claims represent mathematical agreements and shared observations, distinct from their theoretical interpretations.

  1.  **Analysis of Game C:** In the single-shot version of Game C, under the assumption that players maximize utility at every node and believe their opponent will do the same at all subsequent nodes, the unique Backward Induction outcome is **(Stop, Stop, Stop)** yielding payoffs **(1, 0)**.
  2.  **The Status of Idealizations:** Both parties agree that CKR is an idealization. We agree that in Game C, the BI outcome relies on Player 1 believing at Node 1 that Player 2 would Stop at Node 2, which relies on Player 2 believing at Node 2 that Player 1 would Stop at Node 3.
  3.  **Variant (i) – Repeated Play:** When Game C is played twice in succession with summed payoffs, the Backward Induction logic still applies to the final node of the second game. However, both parties acknowledge that the longer horizon creates space for *reputation effects* if incomplete information is introduced. Under pure CKR, the unraveling argument persists, leading to BI play in both rounds.
  4.  **Variant (ii) – Grain of Doubt:** In Game C with a small probability $\epsilon$ that a player is a "commitment type" (who always Continues):
      *   For sufficiently small $\epsilon$ (specifically $\epsilon < 0.5$), Player 2 at Node 2 will still choose Stop, because the expected payoff from Continuing ($4\epsilon$) is less than the payoff from Stopping ($2$).
      *   Consequently, Player 1 at Node 1 anticipates this and chooses Stop.
      *   **Continuity:** For this specific 3-node structure, the equilibrium outcome as $\epsilon \to 0$ is **continuous**; it converges to the BI outcome (1, 0).
  5.  **Limitations of Variant (ii):** Both parties agree that while Game C shows continuity, longer centipede-style games (such as Variant (i) with incomplete information) can exhibit **discontinuity**, where cooperation is sustained for most of the game even as $\epsilon \to 0$, only unraveling at the very end.

  ---

  ## 2. TABLE OF REMAINING DISAGREEMENTS

  The following table outlines the substantive theoretical disagreements that persist despite our empirical agreement on the analysis of Game C.

  | Point at Issue | Epistemic-Program (EP) Formulation | Idealization-Skeptic (IS) Formulation |
  | :--- | :--- | :--- |
  | **The Coherence of Counterfactuals** | CKR is a consistent state of the world. If a node is "off-equilibrium" (e.g., Node 2 is reached), it is because the model allows for it logically, but CKR dictates what beliefs *must* be held there. Rationality constrains beliefs even at unreachable nodes. | CKR is inconsistent with the observation of a deviation. If Player 1 Continues at Node 1, Player 2's knowledge that "Player 1 is rational" is falsified. We cannot assume CKR holds at Node 2 if Node 2 is only reached by a violation of CKR at Node 1. |
  | **Justificatory Work of CKR** | CKR does the heavy lifting. Once CKR is properly formalized (e.g., using conditional belief systems), it logically entails Backward Induction without needing auxiliary assumptions about "trembles" or reputation. | CKR does no justificatory work on its own. To derive BI, one must add specific belief-revision policies (e.g., "minimal belief revision") that carry the real weight. CKR is merely the label, not the engine. |
  | **Interpretation of Continuity** | The continuity of Game C under Variant (ii) confirms the robustness of BI. The idealization is stable; small perturbations do not destroy the prediction in short games. | The continuity in Game C is an artifact of the short horizon. The discontinuity in longer games (Variant i) reveals that BI is structurally unstable. An idealization that collapses under slight perturbations in the general class of games is theoretically fragile. |

  ---

  ## 3. THE CRUXES

  We identify two sub-questions ("Cruxes") that, if settled, would significantly shift the debate.

  **Crux 1: The Temporal Scope of Common Knowledge**
  *   **Question:** Must Common Knowledge of Rationality hold *only* at the outset of the game (ex-ante), or must it be maintained *at every node* reached (dynamic)?
  *   **Why it matters:** If CKR is only an ex-ante constraint, EP can argue that deviations are simply low-probability events consistent with the initial model. If CKR must hold dynamically, IS argues that a deviation forces a belief revision that breaks CKR, invalidating the BI logic at subsequent nodes.

  **Crux 2: The Significance of Discontinuity**
  *   **Question:** Does the existence of discontinuity in longer variants (like Variant i with incomplete information) undermine the normative force of BI in the base game (Game C)?
  *   **Why it matters:** EP argues that Game C is the fundamental unit; if BI holds there, the theory is sound. IS argues that a theory is only as good as its stability across the class of games; if BI fails in slightly perturbed longer games, it cannot be the "correct" solution concept for the base game either.

  ---

  ## 4. ARGUMENTS AND PREDICTIONS ON CRUXES

  For each Crux, we record the argument both agree is relevant and state our advance predictions regarding how evidence would be interpreted.

  ### Regarding Crux 1 (Temporal Scope)
  *   **Agreed Relevant Case:** A modified Game C where Player 2 is explicitly told *before* Node 2 that Player 1 chose Continue, and Player 2 is asked to state their belief about Player 1's rationality.
  *   **EP Prediction:** Player 2 should maintain that Player 1 is rational but made an error in calculation or execution (a "tremble"). Player 2's belief in Player 1's rationality at Node 3 should remain intact.
  *   **IS Prediction:** Player 2 will inevitably update their belief, assigning a higher probability to Player 1 being "irrational" or having different payoffs. Maintaining CKR at Node 2 requires artificial logical contortions that do not match actual reasoning.

  ### Regarding Crux 2 (Significance of Discontinuity)
  *   **Agreed Relevant Case:** Variant (i) (Twice Played) with a grain of doubt $\epsilon$. We examine the proportion of the game tree where cooperation is sustained as the game length increases.
  *   **EP Prediction:** As $\epsilon \to 0$, the proportion of the game where cooperation occurs shrinks to zero. The "discontinuity" is bounded and vanishes in the limit of perfect information. BI remains the unique limit point.
  *   **IS Prediction:** Even for arbitrarily small $\epsilon$, cooperation can be sustained for a fixed proportion of the game (e.g., the first 90% of moves) regardless of how small $\epsilon$ becomes (the Kreps-Wilson-Milgrom-Roberts result). This proves the BI solution is not the robust limit of rational play.

  ---

  ## 5. VERBAL VS. SUBSTANTIVE DISAGREEMENTS

  We conclude by categorizing our remaining differences to clarify where further debate is productive.

  ### Merely Verbal Disagreements
  *   **The Definition of "Solution Concept":**
      *   *Issue:* EP uses "solution concept" to mean the set of strategy profiles consistent with the epistemic model. IS uses it to mean the set of outcomes predicted by actual agents.
      *   *Resolution:* We agree to use **"Epistemic Consistency"** for the EP definition and **"Behavioral Prediction"** for the IS definition. Disagreements regarding whether BI is "the solution" often dissolve when this distinction is applied.
  *   **The Meaning of "Rationality" at Off-Equilibrium Nodes:**
      *   *Issue:* EP speaks of rationality as a *type* (a fixed characteristic). IS speaks of rationality as an *action* (a contingent choice).
      *   *Resolution:* We agree to specify **"Rationality-as-Type"** vs. **"Rationality-as-Action"** in future correspondence.

  ### Substantive Disagreements
  *   **The Normative Force of Backward Induction:**
      *   *Issue:* Even if we agree on the math, EP believes agents *ought* to play BI because it is the only strategy consistent with common knowledge of logic. IS believes agents *ought not* to play BI if it leads to Pareto-inferior outcomes (like 1,0 vs 2,4) when a "grain of doubt" could sustain cooperation.
      *   *What would move the debate:*
          *   **For EP:** An experimental demonstration that agents who are explicitly taught the epistemic logic of CKR consistently play BI in Variant (i) even when monetary incentives favor cooperation.
          *   **For IS:** A formal proof that a belief-revision policy exists which maintains CKR dynamically without contradiction and yields BI, thereby showing the "incoherence" argument is mathematically false rather than just pragmatically difficult.

  ### Statement on Moving the Debate
  Both parties agree that further analysis of Game C itself is exhausted. The debate will only advance by investigating **belief revision policies** in dynamic epistemic logic (addressing Crux 1) and **structural stability** in infinite-horizon limits (addressing Crux 2). We commit to sharing data on Variant (i) experiments to test the predictions in Section 4.

  ***

  **Signed,**

  *Dr. A. Logic, Lead Representative, Epistemic-Program Consortium*
  *Dr. B. Realist, Lead Representative, Idealization-Skeptic Working Group*
