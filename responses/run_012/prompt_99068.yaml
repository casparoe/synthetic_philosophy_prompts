prompt: |-
  ok so before i read more theories of consent i want to know what an adequate one actually has to do. not a definition -- the desiderata. the cases any theory of "this consent was valid / it wasn't" has to get right, the distinctions it can't collapse, the stuff it has to stay consistent with.

  purpose first, since i know "adequate" is relative: i want a standard a hospital ethics committee or a data-protection regulator could apply, so it has to be usable by someone who can't read minds and often has to judge before the fact rather than after. keep that in mind for anything about feasibility.

  here are the cases i keep tripping on. tell me which are genuine constraints on any theory and which are just me being confused:

  - the threat nobody issues. someone takes a dangerous job because they're broke. no coercer exists, there's no threatener to point at, but it feels wrong to call it free. a theory either counts this as valid or it has to explain why the absence of a threat-maker doesn't matter.
  - consent to a bundle. i agree to a study; the protocol quietly shifts a year later to something i'd have refused; i never withdraw. valid or not?
  - the unverifiable condition. i consent "provided the surgeon is the most qualified available," but neither i nor the committee can check that. can a valid consent rest on a condition nobody can evaluate? if yes, what's left of the information requirement; if no, almost no real-world consent survives.
  - consent that changes what i'll want. i agree to a treatment that will, as a side effect, make me more pliable about future treatments. can consent to X be valid when X undermines the standing of my later consent -- and do we judge the first consent by my before or after values?
  - the person who can't be wrong about their own competence. we call someone incompetent to consent if they can't understand what they're agreeing to, but "understand" how well, and who sets the bar without already smuggling in a standard of competence?
  - act vs. state. i sign but don't want it; or i want it but never say so. which one is the consent?

  then the requirements list proper -- each requirement with the case or consideration behind it -- and please seperate the ones that are real constraints on any theory from the ones that are really just house preferences of one camp (the autonomy people vs. the welfare people). what i most want is the pairs you think can't be had together. i have a hunch that "fully informed" and "decidable by a committee in advance" pull against each other, and maybe "tracks the agent's actual will" vs. "legible/checkable from the outside" too. if some subset is jointly unsatisfiable, say so -- that's the actual result i'm after.

  skip the scorecard of which theorist wins, i'll do that part myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Define the *desiderata* (requirements/criteria) for an adequate theory of consent.
      *   **Context:** Practical application (hospital ethics committee, data-protection regulator). Needs to be usable by third parties, often prospectively (before the fact), without mind-reading.
      *   **Specific Cases to Address:**
          1.  Structural coercion (no threatener, but desperate circumstances).
          2.  Protocol drift (consent to bundle, terms change later).
          3.  Unverifiable conditions (subjective/unknowable conditions attached to consent).
          4.  Pre-commitment/Transformation (consent that alters future capacity/values).
          5.  Competence thresholds (who sets the bar for understanding?).
          6.  Act vs. State (signing vs. wanting).
      *   **Core Task:** Distinguish genuine constraints from ideological preferences (Autonomy vs. Welfare). Identify tensions/impossibility theorems (which requirements conflict?).
      *   **Constraint:** Skip theorist scorecards. Focus on the structural logic of the theory itself.

  2.  **Deconstruct the Cases (Genuine Constraints vs. Confusion):**
      *   *Threat Nobody Issues (Desperation):* This is a classic "background conditions" problem. A theory *must* address whether structural necessity negates voluntariness. If it says "yes, it's valid," it risks validating exploitation. If "no, it's invalid," it risks paternalism (stopping people from surviving). *Verdict: Genuine Constraint.*
      *   *Consent to a Bundle (Protocol Drift):* This is about scope and continuity. Consent isn't a one-time magic spell. A theory must handle temporal extension and scope creep. *Verdict: Genuine Constraint.*
      *   *Unverifiable Condition:* This touches on the "objective vs. subjective" meeting of minds. If consent relies on a fact the regulator can't check, is the permission valid? *Verdict: Genuine Constraint (Epistemic limit).*
      *   *Consent that Changes Wants (Transformation):* This is the "Ulysses Contract" or "Pre-commitment" problem. It challenges the stability of the agent over time. *Verdict: Genuine Constraint.*
      *   *Competence Threshold:* The "who guards the guardians" problem. If competence is defined by agreeing to what we think is best, it's circular. *Verdict: Genuine Constraint.*
      *   *Act vs. State:* The "Performative vs. Mental" problem. Law usually prefers acts; philosophy often prefers states. A regulatory theory needs to bridge this. *Verdict: Genuine Constraint.*

  3.  **Drafting the Desiderata (The Requirements List):**
      *   Need to frame these as functional requirements for a regulator/ethics board.
      *   *Requirement 1: Voluntariness (without a coercer).* Addresses the "Threat Nobody Issues."
      *   *Requirement 2: Scope & Continuity.* Addresses the "Bundle/Drift."
      *   *Requirement 3: Epistemic Accessibility.* Addresses the "Unverifiable Condition" and "Committee Feasibility."
      *   *Requirement 4: Diachronic Stability.* Addresses the "Changes What I'll Want."
      *   *Requirement 5: Non-Circular Competence.* Addresses the "Can't Be Wrong" case.
      *   *Requirement 6: External Legibility.* Addresses the "Act vs. State."

  4.  **Identifying the Tensions (The Impossibility Theorems):**
      *   The user specifically asked for pairs that can't be had together. This is the crux of the answer.
      *   *Tension 1: Subjective Validity vs. Objective Audibility.* (The "Act vs. State" + "Unverifiable Condition"). If consent is truly internal will, a committee can't see it. If it's external signs, it might not match the will.
      *   *Tension 2: Full Information vs. Prospective Decidability.* (The "Fully Informed" vs. "Committee" constraint). You can't know *everything* in advance. Regulators need checklists; agents need nuance.
      *   *Tension 3: Structural Voluntariness vs. Non-Paternalism.* (The "Threat Nobody Issues"). If you invalidate desperate choices, you harm the desperate. If you validate them, you allow exploitation.
      *   *Tension 4: Current Will vs. Future Protection.* (The "Transformation" case). Respecting the current wish might destroy the future capacity to wish.

  5.  **Refining the Output (Tone and Structure):**
      *   Tone: Analytical, precise, slightly philosophical but grounded in policy.
      *   Structure:
          1.  Assessment of the Cases (Constraint vs. Confusion).
          2.  The Desiderata List (linked to cases).
          3.  The Trade-offs/Impossibility Theorems (the "jointly unsatisfiable" sets).
      *   Avoid: Naming specific philosophers (Nozick, O'Neill, etc.) unless necessary for clarity (user said skip scorecards).
      *   Focus: The *logic* of the constraints.

  6.  **Self-Correction/Iterative Thought during Drafting:**
      *   *Initial thought:* Maybe the "Unverifiable Condition" is just a confusion.
      *   *Correction:* No, for a regulator, it's a hard stop. If they can't verify the condition, they can't enforce the boundary. It's a constraint on *administrative* theories of consent.
      *   *Initial thought:* Is "Act vs. State" really a tension?
      *   *Correction:* Yes, because law defaults to Act (signatures), but ethics cares about State (will). A theory trying to serve both (like an ethics committee) faces a gap here.
      *   *Refining the "Threat Nobody Issues":* Make sure to distinguish between *coercion* (interpersonal) and *duress* (circumstantial). The theory needs to decide if duress vitiates consent.
      *   *Refining the "Competence" point:* Emphasize the risk of "outcome-based competence" (you're competent if you agree with us).

  7.  **Final Polish:** Check against the user's specific constraint: "purpose first... usable by someone who can't read minds and often has to judge before the fact." Ensure the tensions highlight this administrative burden. (e.g., The tension between *Truth* and *Auditability*).

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is the right place to start. Most debates about consent stall because people argue definitions without agreeing on what the definition is *for*. Since your purpose is **administrative adjudication** (ethics committees, regulators) rather than metaphysical truth, the desiderata must prioritize **auditability** and **non-paternalism** simultaneously.

  Here is the breakdown of your cases, the resulting requirements, and the structural tensions that make a perfect theory impossible.

  ### Part 1: Assessment of Your Cases
  Are these genuine constraints or confusions? **All six are genuine constraints.** None are merely confusion. They represent fault lines where the logic of consent breaks down under administrative pressure.

  1.  **The Threat Nobody Issues (Structural Duress):** *Genuine Constraint.* A theory must decide if "voluntariness" requires the absence of a coercer or the absence of unacceptable alternatives. If you require no coercer, you allow exploitation of the desperate. If you require acceptable alternatives, you invalidate almost all low-wage labor and risky medical trials, paralyzing the system.
  2.  **Consent to a Bundle (Scope/Time):** *Genuine Constraint.* Consent is rarely atomic; it is usually a permission structure over time. A theory must define the "decay rate" of consent and the magnitude of change that triggers a need for re-consent.
  3.  **The Unverifiable Condition (Epistemic Limit):** *Genuine Constraint.* This is the "private language" problem. If consent relies on a condition the regulator cannot verify, the regulator cannot protect the boundary. A theory must decide if consent is a *meeting of minds* (subjective) or a *public signal* (objective).
  4.  **Consent that Changes Wants (Transformation):** *Genuine Constraint.* This is the problem of *diachronic autonomy*. If the intervention alters the value system used to evaluate the intervention, the feedback loop is broken. A theory must decide which "self" holds veto power.
  5.  **The Person Who Can't Be Wrong (Competence):** *Genuine Constraint.* This is the circularity risk. If competence is defined by the ability to understand the risks, but "understanding" is judged by whether the agent agrees with the expert's risk assessment, competence becomes compliance.
  6.  **Act vs. State (Performance):** *Genuine Constraint.* Regulators need paper trails (Acts); Ethics needs authentic will (States). A theory must bridge the gap between *signing* and *agreeing*.

  ---

  ### Part 2: The Desiderata (Requirements List)
  For a theory to be usable by a committee judging *before the fact* without mind-reading, it must satisfy these five requirements. I have linked each to the cases above.

  **1. The Non-Circular Competence Requirement**
  *   **The Demand:** The standard for "capacity to consent" must be independent of the *content* of the decision.
  *   **The Case:** *The Person Who Can't Be Wrong.*
  *   **Why:** If you declare a patient incompetent because they refused a life-saving surgery, but competent because they accepted it, you are not measuring competence; you are measuring obedience. The theory must provide a metric for understanding (e.g., "can repeat back risks") that applies regardless of the choice made.

  **2. The Public Legibility Requirement**
  *   **The Demand:** Valid consent must generate an external signal that a third party can verify without accessing the agent's internal mental state.
  *   **The Case:** *Act vs. State* AND *Unverifiable Condition.*
  *   **Why:** A regulator cannot audit a feeling. If consent rests on a private condition ("I only consent if I feel lucky"), it is invisible to the committee. The theory must prioritize performative acts (signatures, verbal confirmation) over internal states, even if they occasionally diverge.

  **3. The Scope Stability Requirement**
  *   **The Demand:** The theory must define the boundaries of the permission and the conditions under which those boundaries shift.
  *   **The Case:** *Consent to a Bundle.*
  *   **Why:** "Consent to study" is too vague. The theory must specify that consent covers Protocol A, and that a shift to Protocol B constitutes a *new* act requiring *new* consent. It must treat consent as a limited license, not a blanket waiver.

  **4. The Baseline Voluntariness Requirement**
  *   **The Demand:** The theory must define a "baseline of acceptable options" below which choice is considered coerced, even without a threatener.
  *   **The Case:** *The Threat Nobody Issues.*
  *   **Why:** To avoid validating exploitation, the theory must acknowledge that some backgrounds (destitution, captivity) negate voluntariness. However, to avoid paternalism, it must set this baseline very low (e.g., "immediate physical threat") rather than high (e.g., "economic fairness").

  **5. The Diachronic Protection Requirement**
  *   **The Demand:** The theory must account for interventions that alter the agent's future capacity to consent.
  *   **The Case:** *Consent that Changes Wants.*
  *   **Why:** If a treatment makes you compliant, your consent to the *continuation* of that treatment is suspect. The theory must require that the *initial* consent specifically authorize the alteration of future decision-making capacity (a Ulysses clause).

  ---

  ### Part 3: The Impossibility Theorems (The Trade-Offs)
  You asked for the pairs that cannot be had together. You are correct that tensions exist. For an administrative body (hospital/regulator), you cannot maximize all desiderata simultaneously. You must sacrifice one to satisfy the other.

  Here are the three critical tensions where a theory must break.

  #### 1. The Truth vs. Auditability Tension
  *   **The Conflict:** *Tracks the agent's actual will* **VS** *Legible/checkable from the outside.*
  *   **Why they clash:** The only way to ensure consent matches the "actual will" (State) is to interrogate the internal state. But a committee cannot do this; they can only check the "Act" (signature).
  *   **The Forced Choice:**
      *   If you prioritize **Truth**, you make consent unadministrable. Every signature becomes suspect, requiring psychological evaluation for every procedure.
      *   If you prioritize **Auditability**, you accept "false positives" (people who signed but didn't understand/want it) as valid consent to keep the system moving.
  *   **Administrative Reality:** Regulators *must* choose Auditability. This means an adequate theory for your purpose *cannot* guarantee the consent is "real" in a metaphysical sense, only that the procedure was followed.

  #### 2. The Information vs. Decidability Tension
  *   **The Conflict:** *Fully informed* **VS** *Decidable by a committee in advance.*
  *   **Why they clash:** To be "fully informed" is an open-ended epistemic state. There is always one more risk, one more alternative, one more statistic. To be "decidable in advance" requires a closed checklist (e.g., "Did we list the top 5 risks?").
  *   **The Forced Choice:**
      *   If you prioritize **Full Information**, no consent is ever valid because information is always incomplete. The system halts.
      *   If you prioritize **Decidability**, you must define "informed" as "provided the standard disclosure form." This creates "routine consent" where patients sign without actually knowing much.
  *   **Administrative Reality:** Regulators *must* choose Decidability. An adequate theory must define "informed" procedurally (was the form given?) rather than substantively (do they actually know?).

  #### 3. The Protection vs. Agency Tension (The Desperation Trap)
  *   **The Conflict:** *Protects against structural coercion* **VS** *Respects actual choice of vulnerable agents.*
  *   **Why they clash:** This is your "Threat Nobody Issues" case. If you rule that desperate economic circumstances invalidate consent (to protect the vulnerable), you remove the option for the desperate to sell their labor/risk for money. You protect them from exploitation by removing their survival strategy.
  *   **The Forced Choice:**
      *   If you prioritize **Protection**, you invalidate risky jobs/trials for the poor. This is paternalistic and restricts liberty.
      *   If you prioritize **Agency**, you allow the rich to leverage the desperation of the poor. This validates exploitation.
  *   **Administrative Reality:** Most committees choose **Agency** with a floor. They allow the choice unless the risk is "catastrophic/disproportionate." But this line is arbitrary. An adequate theory must admit it cannot solve background injustice; it can only police the immediate transaction.

  ### Summary: What an "Adequate" Theory Looks Like for You
  Given your constraints (regulator, no mind-reading, prospective judgment), an adequate theory of consent **cannot** be a theory of *true moral permission*. It must be a theory of *risk-managed authorization*.

  It must explicitly accept the following compromises:
  1.  **Consent is Performative:** It values the signature over the state of mind (sacrificing Truth for Auditability).
  2.  **Informed is Procedural:** It values the delivery of information over the absorption of it (sacrificing Full Information for Decidability).
  3.  **Voluntariness is Local:** It ignores background economic coercion unless it reaches the level of immediate physical duress (sacrificing Protection for Agency).

  If a theory promises to solve the "Threat Nobody Issues" case *without* being paternalistic, or promises to ensure the patient *actually understands* without slowing down the hospital to a halt, it is failing your feasibility constraint. The "adequate" theory is the one that admits these trade-offs explicitly rather than hiding them behind moral language.
