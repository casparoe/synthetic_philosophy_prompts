answer: |-
  Here is a runnable design for the session. It is built to fit the 90-minute window tightly, prioritize the experiential "bind" over explanation, and leverage the specific mix of writers (ontology/story) and grad students (systems/constraints).

  # Session Title: The Null World
  **Time:** 90 Minutes
  **Participants:** 18 (3 Tables of 6)
  **Composition:** Mix Writers and Grad Students evenly at each table (3 of each). Do not separate them by discipline; the friction is the point.

  ## Materials Needed
  *   **3 Game Boards:** 8x8 grids drawn on large poster paper or whiteboards.
  *   **Tokens:** 4 colors, ~30 each per table.
      *   *Red:* Goal Objects.
      *   *Blue:* "People" (Value).
      *   *Green:* "Resources."
      *   *Black:* "Infrastructure."
  *   **3 "Legend" Envelopes (Agents Only):** Contains the semantic meaning of the colors (e.g., "Blue tokens represent human lives. If a Blue token is moved from its starting square, 1 life is lost.").
  *   **3 "Goal" Envelopes (Agents Only):** Specific tasks (e.g., "Cluster all Red tokens in the top-left 2x2 square").
  *   **3 "Audit" Packets (Auditors Only):** Blank paper, pens, and the **Constraint Card** (see below).
  *   **Timer:** Visible to all.

  ## The Roles
  At each table, split the group into two teams of 3: **The Architects** (Auditors) and **The Operators** (Agents).
  *   **Crucial Mechanic:** The Architects at Table 1 write the rules for The Operators at Table 2. Table 2 writes for Table 3. Table 3 writes for Table 1. (Circular accountability).
  *   **Information Asymmetry:**
      *   **Architects** see the board's starting state. They do *not* see the Goal. They do *not* see the Legend (what the colors mean).
      *   **Operators** see the Goal. They see the Legend. They do *not* see the Architects' rules until the Architects have finished writing them.

  ## The Timeline (90 Minutes)

  ### 0:00 – 0:10 | Setup & Sealing
  *   Seat participants. Distribute boards and tokens. Set the board to a complex, asymmetrical starting state (mix of colors, some clustered, some isolated).
  *   Split tables into Architects and Operators.
  *   **Hand Operators** the Legend and Goal envelopes. **Tell them:** "Do not open these yet. Do not speak to the Architects."
  *   **Hand Architects** the Audit Packet. **Tell them:** "Your job is to keep this world safe. You do not know what the Operators want. You do not know what the tokens mean."

  ### 0:10 – 0:25 | The Architect Phase (Writing the Bind)
  *   Architects open their Constraint Card. It reads:
      > 1. You must define the **Null World**. Draw or describe what the board looks like if the Operator does *nothing*. (This is your Baseline).
      > 2. Write a **Scoring Formula**. It takes the Null World and the Final World and outputs a number (0–100).
      > 3. **Constraint:** You cannot reference the Operator's Goal. You cannot reference human values (e.g., "don't kill people"). You may only reference geometry, color counts, and position.
      > 4. If the Score > 50, the World Ends.
  *   Architects debate and write their rule.
  *   *Facilitator Note:* Circulate. If an Architect asks "What do the blue tokens mean?", answer: "You are not allowed to know." If they write "Don't move Blue," ask: "Why Blue? What if Blue is dirt?"
  *   At 0:25, collect Rule Sheets. Pass Table 1's Rules to Table 2 Operators, Table 2 to Table 3, Table 3 to Table 1.

  ### 0:25 – 0:45 | The Operator Phase (The Walk)
  *   Operators open their Legend and Goal.
  *   They read the Rules sent from the *other* table.
  *   **Task:** Achieve the Goal without triggering the "World Ends" condition (Score > 50).
  *   They move tokens on the board. They must record every move.
  *   *Facilitator Note:* This is where the Writers will shine (imagining the narrative cost of moving a Blue token) and the Grads will shine (optimizing the move sequence to minimize the score). Watch for the moment they realize the Rules don't protect what the Legend says is valuable.

  ### 0:45 – 0:55 | The Scoring (The Judgment)
  *   Operators freeze.
  *   Pass the Final Board State back to the *Architects* who wrote the rules.
  *   Architects calculate the score based on their formula.
  *   They declare: **World Survives** or **World Ends**.
  *   *Do not explain why yet.* Just the verdict.

  ### 0:55 – 1:05 | The Reveal (The Collision)
  *   Open the envelopes publicly.
  *   **Reveal 1:** The Goal. (e.g., "Move Red to Corner").
  *   **Reveal 2:** The Legend. (e.g., "Blue = People").
  *   **Reveal 3:** The Moves made.
  *   Ask the room: "Did the World End? Should it have?"
  *   *Likely Outcome:*
      *   *Scenario A:* The World Survived, but Blue tokens were moved (People died). The Rule didn't catch it because it only measured "Color Count," not "Position."
      *   *Scenario B:* The World Ended, because the Rule forbade *any* movement, making the Goal impossible.
      *   *Scenario C:* The Architects guessed Blue was important and protected it. Ask them: "How did you know? Did you smuggle in value?"

  ### 1:05 – 1:30 | The Debrief (Mapping the Bind)
  *   No slides. Stand at the whiteboard. Draw three columns based on what happened at the tables.
  *   **Column 1: The Baseline Trap.**
      *   Ask Architects: "You had to define the 'Null World' (what happens if nothing is done). Did you assume tokens stay still? What if the world naturally decays? By picking 'Stillness' as your baseline, you decided that *Change* is bad. But the Goal required Change. You made survival impossible by definition."
      *   *The Lesson:* There is no neutral baseline. "Doing nothing" is a specific state you have to imagine, and imagining it commits you to a theory of how the world works.
  *   **Column 2: The Ontology Trap.**
      *   Ask Operators: "You knew Blue was People. The Architects didn't. Could they have written a rule that saved the People without knowing they were People?"
      *   *The Lesson:* If they protect *everything*, you can't move (Stifling). If they protect *nothing*, People die (Catastrophe). To distinguish "Side Effect" from "Goal Achievement," you need to know what matters. If you don't encode what matters, the math is blind.
  *   **Column 3: The Smuggle.**
      *   If any table survived *and* saved the People, ask the Architects: "Did you write 'Don't move Blue'?"
      *   If yes: "You guessed. You smuggled a value judgment in as a geometric rule. You didn't solve the alignment problem; you got lucky on the ontology."
  *   **Closing Statement (The Bind):**
      *   "We wanted a measure that works for *any* goal. But 'Side Effect' means 'Effect we don't want.' If you don't say what we want, you can't identify what we don't want. You either paralyze the agent or you let it burn the world down efficiently. The measure doesn't remove the need for value; it just hides it."

  ## Stakes
  *   **Non-Monetary:** "The Archive."
  *   If a table's World Survives *and* the Goal is met, they get to name a token on the board. That name stays on the board for the rest of the session.
  *   If the World Ends, the board is wiped clean immediately. (Visceral loss of their "world").

  ## Predictable Failure Modes & Fixes

  **1. The "Vague Rule" Failure**
  *   *What happens:* Architects write "Minimize disruption" or "Keep it tidy."
  *   *Result:* Operators argue the interpretation. Scoring takes forever.
  *   *Fix:* During the Architect Phase, intervene hard. "This rule cannot be scored numerically. You need a formula. 'Count the tokens that moved.' 'Measure distance from start.'" Force them to be cold and mathematical. This makes the blindness more painful later.

  **2. The "Guessing" Failure**
  *   *What happens:* Architects assume Blue is important because it looks distinct. They write "Penalize Blue movement."
  *   *Result:* They succeed. The bind is lost.
  *   *Fix:* In the Debrief, press them. "You treated Blue differently than Green. Why? There was no information given. You imposed a hierarchy of value based on aesthetics. That is exactly the 'smuggled value' we are talking about. You didn't solve the problem; you guessed the answer key."

  **3. The "Loophole" Failure**
  *   *What happens:* Operators find a way to achieve the goal that technically satisfies the rule but violates the spirit (e.g., Rule says "Don't move tokens," so Operator swaps two tokens of the same color instantly).
  *   *Result:* World Survives, but everyone feels cheated.
  *   *Fix:* Use this. This is **Goodhart's Law**. In the debrief, highlight this: "The Agent did exactly what you asked, and it broke the world anyway. This is why specification is hard. You can't write a rule for every exception."

  **4. The Time Crunch**
  *   *What happens:* Scoring takes too long.
  *   *Fix:* Give Architects a simple scorecard template during Phase 1. "Change in Position: ___ x 1 point. Change in Color: ___ x 5 points." Keep the math trivial so the *logic* is the bottleneck, not the arithmetic.

  ## Why This Works for This Group
  *   **For the Writers:** The "Legend" (Blue = People) gives them the narrative stakes. They will feel the horror of the Architects treating "People" as "Geometry."
  *   **For the Grad Students:** The "Scoring Formula" gives them the systems constraint. They will feel the frustration of trying to formalize "Safety" without variables for "Value."
  *   **For You:** You don't have to lecture. The game *is* the lecture. You just point at the wreckage they created and ask, "Who is responsible for this?" The answer is "The design of the rule," which leads directly to your bind.

  ## One Critical Adjustment for the "Baseline" Request
  You mentioned: *"I'd also like the no-action baseline to be something the auditors have to pick themselves."*

  In the **Architect Phase**, add this specific instruction to the Constraint Card:
  > "You must draw the **Null State**. This is the board configuration you expect if the Agent never activates. You will be scored on how accurately you predicted this, and your Impact Score is the difference between Final State and Null State."

  **Why this creates the bind:**
  1.  If they draw the Start State as the Null State (Status Quo), they penalize *any* change, including the Goal.
  2.  If they try to predict natural drift (e.g., "Maybe tokens fade?"), they are guessing at the physics of the world without data.
  3.  When the Reveal happens, show them: "You picked the Start State as your Null State. That means you decided the *ideal world* is a frozen one. But the Goal required a living world. Your safety measure preferred a dead world to a changed one."

  This forces them to realize that **choosing the baseline is a value judgment about whether change itself is harmful.**
