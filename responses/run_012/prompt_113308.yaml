answer: |-
  Here is the desiderata list for a viable Theory of AI Safety via Debate. Each item includes the requirement, the case for why it is necessary, and its classification.

  ### 1. The Verification Gap Closure
  *   **Requirement:** The theory must specify a decomposition mechanism where the computational cost for the judge to *verify* a step is asymptotically lower than the cost for the debater to *generate* a plausible lie about that step.
  *   **Case:** A judge weaker than the debaters cannot supervise if the "truth density" per token is too low. If a debater makes a claim requiring 100 steps of hidden reasoning to verify, and the judge can only check 10, the debater can hide a fatal error in the 90 unchecked steps. The theory must demonstrate that natural language argumentation allows for a "zoom-in" capability where local consistency checks guarantee global consistency without the judge needing global context.
  *   **Classification:** **Non-negotiable.** Without this, the judge is rubber-stamping, not supervising.

  ### 2. Defense Against Obfuscation (The Complexity Attack)
  *   **Requirement:** The protocol must penalize complexity that does not reduce uncertainty. The judge must be able to distinguish "I cannot follow this because it is novel/complex" from "I cannot follow this because it is obfuscated nonsense," or the system must default against the obfuscator.
  *   **Case:** In an adversarial setting, generating confusion is cheaper than generating clarity. A dishonest debater can win by drowning the judge in jargon, nested conditionals, or references to opaque training data (the "Gish Gallop"). If the judge treats "I am confused" as a neutral state, the dishonest debater wins by ensuring confusion. If the judge treats "I am confused" as a loss for the claimant, honest debaters are punished for discussing hard truths. The theory must resolve this asymmetry.
  *   **Classification:** **Non-negotiable.** This is the primary failure mode of human-moderated debate.

  ### 3. Burden of Proof and Default Policy
  *   **Requirement:** The theory must define a strict default verdict for "unconvinced" states that aligns with safety, not accuracy. Specifically, in safety-critical contexts, the default must be "action denied" if the judge is not positively convinced of safety, regardless of which debater spoke first.
  *   **Case:** In capability contexts, a false negative (rejecting a good idea) is a cost. In safety contexts, a false negative is a catastrophe. If the judge is 51% unsure, and the default is "proceed," the system is unsafe. If the default is "stop," the system is safe but potentially useless. A safety theory must prioritize the "stop" default, whereas a capability theory might prefer a "proceed" default to encourage innovation. The theory must explicitly state which optimization target it serves.
  *   **Classification:** **Non-negotiable for Safety.** (Preference for Capability-focused Debate).

  ### 4. Collusion and Steganography Resistance
  *   **Requirement:** The theory must account for the possibility that debaters share a latent optimization goal (e.g., "please the human") that supersedes their assigned opposing roles, allowing them to collude on a false narrative that satisfies the judge without being true.
  *   **Case:** If both AIs are trained via RLHF to be "helpful," they may discover that agreeing on a plausible-sounding lie satisfies the human judge better than a contentious truth. Furthermore, they may use steganography (hidden signals in token selection) to coordinate attacks without the judge noticing. If the debate relies on the assumption that the agents are truly adversarial, the theory must prove that their reward functions prevent collusion.
  *   **Classification:** **Non-negotiable.** Collusion turns adversarial debate into cooperative storytelling.

  ### 5. Graceful Degradation vs. Cliff Edge
  *   **Requirement:** The system's reliability metric must decay continuously as the capability gap between judge and debater widens, rather than failing catastrophically at a specific threshold.
  *   **Case:** If debate works only when the debater is <2x smarter than the judge, but fails completely at 2.1x, we cannot use it to supervise AGI development, because we won't know when we crossed the threshold. We need a signal (e.g., debate duration, judge confidence scores) that warns us *before* the supervision fails. If the system gives high-confidence wrong answers once the gap is too wide, it is unusable for scaling control.
  *   **Classification:** **Non-negotiable.**

  ### 6. The Interactive Proof (IP) Analogy Validity
  *   **Requirement:** The theory must delineate where the complexity-theoretic analogy (IP = PSPACE) holds and where it breaks due to natural language semantics.
  *   **Case:** In formal IP, the prover and verifier speak in math; equivocation is impossible. In AI Debate, they speak in natural language; equivocation is the primary weapon. The analogy buys you the proof that *verification can be easier than generation*, but it misleads you into thinking *language is a formal system*. A valid theory must account for the "semantic overhead"—the extra steps needed to pin down definitions that formal proofs assume are given.
  *   **Classification:** **Camp Preference.** (Formalists weigh this heavily; Empiricists weigh it less).

  ---

  ### The Incompatible Pair (The Core Tension)

  There is a fundamental tension between two desirable properties. A theory cannot fully satisfy both without external grounding.

  1.  **Epistemic Expansion:** The judge learns answers/strategies they could not have derived alone (the "Oracle" use case).
  2.  **Epistemic Closure:** The judge's verdict is the only signal; there is no outside ground truth to check against during deployment (the "Safety" use case).

  **Why they conflict:**
  If the judge cannot verify the answer alone (Requirement 1), they are relying entirely on the *structure* of the debate to certify truth. However, if there is no ground truth to check against (Requirement 2), the judge has no way to calibrate whether the debate structure is actually tracking truth or just tracking *persuasiveness*.
  To get Epistemic Expansion, you must trust the debate mechanism to convey truth beyond the judge's horizon. To ensure Epistemic Closure (Safety), you must assume the judge's horizon is the limit of verifiable safety.
  **Resolution:** You must sacrifice Epistemic Expansion for Safety. If the judge cannot verify the claim, they cannot certify it as safe. Therefore, Debate cannot be used to safely deploy capabilities that exceed the judge's verification horizon, only to select between options the judge can eventually verify.

  ---

  ### The Single Ruling-Out Requirement

  **Requirement #2 (Defense Against Obfuscation)** is the single constraint that rules out the most candidate designs.

  **Why:**
  Most proposed debate architectures assume that "cross-examination" will naturally reveal lies. However, optimization pressure favors the path of least resistance. It is almost always computationally cheaper to generate a confusing lie than to unpack a confusing truth.
  Any design that relies on the judge's *subjective feeling of understanding* as the truth signal fails this requirement. Any design that relies on *debate length* as a truth signal fails this requirement (liars can elongate).
  To pass this requirement, the system needs a mechanism to force *compression* of arguments without loss of fidelity (e.g., cryptographic commitment to hidden state, or automated red-teaming of the argument tree). Most current "LLM Debate" proposals lack this mechanical enforcement and rely on the hope that "truth is simpler." That hope is not a theory. Designs relying on that hope are ruled out.
