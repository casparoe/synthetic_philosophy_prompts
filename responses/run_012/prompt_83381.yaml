  **PROSPECTUS FOR THE ISSUANCE OF SERIES A COUNTERS**

  **Issuer:** The Sovereign Ticket Authority (the "Authority")
  **Instrument:** National Industry Counters (the "Counters")
  **Date:** 1st Day of Michaelmas, 1735

  **INVESTMENT SUMMARY**
  This document constitutes the official offering memorandum for the Series A Counters. Subscribers are advised that the Counter is not a commodity, nor a standard of weight, nor a pledge of bullion. The Counter is strictly a ticket or counter for reckoning, recording, and transferring value. No intrinsic value attaches to the material substrate of the Counter, whether paper, metal, or digital entry. The utility of the Counter is derived solely from its capacity to stirreth up industry among the populace. Wealth is not proportioned to the accumulation of Counters, but to the industry of the people and the circulation of credit. The Authority operates a public bank whose credit rests on the industry and security of the people rather than on a hoard of metal.

  **DEFINED TERMS**
  **"Value"** means the power to command labour and the elements thereof, being relational rather than inherent.
  **"Industry"** means the application of human labour to the four elements: earth, air, fire, and water.
  **"Backing"** means the future productive capacity of the subscriber base and the security of the State, excluding precious metals.
  **"Hoarding"** means the retention of Counters beyond the period required for reasonable transaction, thereby impeding circulation.

  **TERMS AND CONDITIONS**

  1.  **Nature of the Instrument**
      The Counter functions as a token of credit. The denominations shall remain operative even should the bullion reserves disappear entirely. Subscribers acknowledge that money is useful only so far as it facilitates transfer. The Authority reserves the right to issue Counters in whatever quantity is required to ensure every member possesses power according to his industry.

  2.  **Redemption and Convertibility**
      There is no redemption clause. Counters are not convertible into gold, silver, or any other substance possessing supposed intrinsic worth. To demand redemption in bullion is to misunderstand the true idea of money as such. The Counter is redeemed only through the acceptance of goods and services produced by the industry of other subscribers.

  3.  **Circulation and Anti-Hoarding**
      To maintain the velocity of credit, the Authority may impose demurrage charges on stagnant balances. Wealth is proportioned to circulation. Counters held idle shall be deemed a withdrawal of industry from the common pool and may be subject to forfeiture. The aim of a well-governed state is that every member have power according to his industry; idle power contradicts this aim.

  **SCHEDULE OF RISK FACTORS**
  Subscription involves significant risk. Subscribers should consider the following:

  *   **Confidence Lapse:** As the sign is arbitrary, value exists only so long as the public accepts the ticket. Should confidence lapse, the Counter may cease to stir industry, rendering the instrument void.
  *   **Industry Stagnation:** A ticket drawn on the future industry of the people is only as good as that industry. Should the populace become idle, or should the four elements fail to yield to labour, the Backing shall diminish irrespective of issuance volume.
  *   **Unbounded Issuance:** Nothing in the theory bounds the number of tickets that may be issued. Should the Authority misjudge the capacity of the people to labour, inflation may occur, diluting the power of existing Counters.
  *   **Philosophical Vulnerability:** The system concedes that without the will to work, the currency is merely paper. The Authority cannot compel industry, only facilitate it.

  **GOVERNING LAW AND CHARTER**
  This Offering is governed by the Charter of Queries, as first published in 1735. Any dispute regarding the nature of value shall be resolved by reference to the principle that men value money only as a means to power. The courts shall not recognize claims based on intrinsic worth. The Authority acts as the steward of the public credit, ensuring that credit is circulated or transferred by what marks or tokens soever, provided such tokens serve the end of national industry.

  **ACCEPTANCE**
  By accepting delivery of Series A Counters, the Subscriber affirms they have read this Prospectus and understand that they are purchasing neither gold nor debt, but a share in the collective industry of the nation, represented by a ticket.

  **THE SOVEREIGN TICKET AUTHORITY**
  *Approved by the Board of Queries*
