  ### Ranking 1: Independent Epistemic Work (Volume of Unique Knowledge)
  *Assumption: All six pramāṇas are irreducible sources (Mīmāṃsā view).*

  1.  **Perception (*Pratyakṣa*):** As the foundational source of all empirical data, its removal would collapse the possibility of any worldly knowledge, including the sensory input required for other instruments.
  2.  **Verbal Testimony (*Śabda*):** This instrument uniquely accesses Dharma, history, and supersensible realities, representing the largest corpus of information that cannot be gained through perception or inference alone.
  3.  **Inference (*Anumāna*):** Inference extends knowledge beyond the senses to hidden realities like atoms or fire, covering a vast theoretical domain that perception cannot reach directly.
  4.  **Postulation (*Arthāpatti*):** **[Contested Reduction]** This source resolves specific contradictions (like the fasting fat man) that inference cannot strictly explain without circularity, assuming it does not collapse into inference.
  5.  **Non-apprehension (*Anupalabdhi*):** **[Contested Reduction]** This secures knowledge of absolute absence, a distinct ontological category not fully captured by merely perceiving an empty locus, assuming it does not collapse into perception plus inference.
  6.  **Comparison (*Upamāna*):** **[Contested Reduction]** Comparison merely links names to descriptions, a narrow linguistic function easily subsumed by testimony and memory, assuming it does not collapse into those instruments.

  ### Ranking 2: Oracle Output Certification (Nyāya Account of *Pramā*)
  *Metric: Capacity to convert the Oracle's true propositions into valid cognition (*pramā*) rather than accidental true belief.*

  1.  **Verbal Testimony (*Śabda*):** Since the oracle's output is linguistic, *Śabda* is the specific instrumental cause required to process that speech into valid knowledge rather than mere belief.
  2.  **Perception (*Pratyakṣa*):** Direct contact with objects provides the strongest warrant for empirical claims, but it can only certify the subset of the oracle's output that is sensibly verifiable.
  3.  **Inference (*Anumāna*):** Logical necessity certifies universal relations and speaker reliability, but it depends on perceptual data and cannot validate singular historical claims directly.
  4.  **Non-apprehension (*Anupalabdhi*):** In Nyāya, this is derivative of perception and inference, certifying absence only when perceptual conditions are met and non-detection is logically processed.
  5.  **Postulation (*Arthāpatti*):** Nyāya treats this as a form of inference, meaning it lacks independent certifying power beyond logical implication and explanatory necessity.
  6.  **Comparison (*Upamāna*):** Nyāya reduces this to testimony and memory, making it the weakest independent certifier of truth as it relies on linguistic convention rather than ontological contact.

  ### Divergence Analysis
  The two orderings come apart primarily at the top and the bottom. In the first ranking, **Perception** outranks **Testimony** because perception is the precondition for all knowledge, whereas in the second ranking, **Testimony** outranks **Perception** because it is the only instrument capable of certifying the *entirety* of a verbal oracle's output as *pramā*. Furthermore, the bottom three (**Postulation, Non-apprehension, Comparison**) drop in relative epistemic security in the second ranking because the Nyāya account treats them as reducible to the first three, whereas the first ranking granted them full independence. Specifically, the placements of **Postulation**, **Non-apprehension**, and **Comparison** in the first ranking turn on the contested assumption that they are irreducible; under the Nyāya account used for the second ranking, they are demoted as derivative instruments.
