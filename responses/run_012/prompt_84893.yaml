prompt: |-
  I've been going down a rabbit hole on the universal prior — the idea that you can put a probability distribution over all possible computer programs by favouring the shorter ones, and that this gives you some kind of "objective" starting point for how likely different worlds are. The bit I keep chewing on is the argument that this prior is basically malign: that if you take it seriously, most of the probability over observer-moments lands in worlds where some agent is running enormous numbers of simulations, and since those simulators are optimising something, the world you should expect to be in is one engineered to score well on their objective rather than a boring old physical universe.

  I want to turn this into a proposal, maybe four pages, for one of those grants that fund independent researchers who aren't in academia, six months of work.

  The half-formed idea I want it built around: the argument looks like it needs two steps — first, that observers are far more numerous inside simulations than outside, second, that the simulators' goals get to shape which simulation we end up in — and I suspect the second step only goes through if you smuggle in a particular way of counting observers (per program, per observer-moment, or some measure the prior itself doesn't hand you). If that's right, the malignity result is an artefact of a choice about how to count rather than something the prior forces on you. But I genuinely can't tell weather that's a real gap or whether I'm just refusing a conclusion I don't like.

  So please write the proposal: state the question so it has a definite answer, say what the existing positions actually commit you to and where they leave it open (positions and arguments, not a literature review — I'll add references myself, and honestly a bibliography is useless to me anyway), spell out what I'd actually do month by month, what would count as the project succeeding versus me just talking myself out of the scary conclusion, and be honest about whether this fits in six months or is a three-year PhD-sized thing in disguise. Plain language, I'm not a philosopher, but don't water down the technical part.
