answer: |-
  Friends, neighbours, children. Good morning.

  Looking around this hall, I see faces I know as well as my own. I see the children who will walk out of these gates for the last time on Friday. I see the parents who walked them here, and the grandparents who walked their parents before them. And I know the Councillor will speak shortly to assure us that the bus to the town academy will offer better metrics, wider choices, and improved outcomes. I do not doubt him. But education is not only a service delivered to a customer. It is a promise kept between generations.

  That is the loss we gather to mark today. It is not merely the inconvenience of a longer bus ride, nor the sadness of separation. Those are real pains, but they are personal. The loss I speak of is structural. It belongs to the school itself, and to the village that built it.

  For one hundred and thirty years, every person who stood where I stand now, every teacher who marked books in the staff room, every child who scraped their knee in the yard, operated under a single, silent assumption: that this would continue. When the founders laid the brickwork, when Miss Higgins taught arithmetic in 1920, when your grandparents painted harvest posters in the seventies, they did not work for their own moment. They worked for a future they would not see. They invested labour and love into a project that presupposed its own permanence.

  Closing the school breaks that presupposition. It renders the work of the past partially unintelligible. It is not that their work was wasted—they taught you, and you are here—but the structure they were building has been dismantled before its design was complete. We are not just closing a building; we are cancelling a commitment that was made before any of us were born.

  I know the question some of you are thinking. If the village empties, if no one is left in fifty years to mourn this place, what does the loss consist in? Who is harmed if there is no one here to feel the absence?

  The loss is not in the feeling of sadness. It is in the breaking of the chain itself. A bridge does not cease to be a bridge only when no one walks across it, but it ceases to function if the far bank is removed. The past generations built toward a future bank. We are removing it. The loss exists in the断裂—the break—in the continuity of the project, regardless of whether anyone is left to witness it.

  Mrs. Gable, a grandparent of a pupil, told me recently that a thing which ends well is simply finished and needs no continuation. She meant that if the children leave happy, the job is done. But a school is not a book you finish, or a task you complete. It is a conversation. You do not say a conversation "ended well" if you simply stop speaking. You have merely stopped. To treat this school as a completed task is to misunderstand what it was. It was an open-ended trust, handed down like a tool, meant to be used by hands not yet born.

  Some might say, "But the school will live on in our memories." I must be honest with you: that is a comfort, but it is not a solution. Memory looks backward. This school was built to look forward. To say it will live in memory is to admit it is dead as a function. It answers the question of how we cope, but it does not answer the question of what is lost. What is lost is the future tense of this place.

  So, we stand here as the full stop. We are the generation that closes the book. That is a heavy weight. But acknowledging the weight is the only way to honour the lightness with which the founders began.

  Thank you for trusting me with your children. Thank you for trusting this place. Let us walk them out with our heads up, knowing exactly what we are leaving behind, and exactly what is being broken.

  Goodbye.
