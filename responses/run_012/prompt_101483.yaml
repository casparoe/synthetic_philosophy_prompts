prompt: |-
  I recently joined a research group that studies cooperation between agents who may never interact — civilizations separated by galaxies, or possible agents in scenarios too far apart to affect one another — and our discussions have stalled on whether the evidential cooperation argument gives any real reason to cooperate. The argument, as I understand it, runs roughly like this: if other agents reason the way I do, then my decision to cooperate is evidence about what they will decide, so choosing to cooperate can influence outcomes elsewhere even without any causal contact. Half the group treats this as a decisive reason to cooperate across large worlds; the other half thinks it proves too much, since the same reasoning would license cooperating with anyone whose behavior merely correlates with mine — including agents who reward or punish me only in hypothetical cases — and neither side has budged in months. My own suspicion, offered as a hypothesis rather than a claim, is that the deadlock is at least partly verbal: one side means by cooperating acting so as to be correlated with beneficial action elsewhere, the other means acting jointly under some shared intention or agreement, and they may be answering different questions under a single name. Diagnose what kind of disagreement this really is — a genuine dispute within decision theory about causal versus evidential reasoning, a dispute about the setup itself (whether such correlations exist, and what counts as the same agent across worlds), or two separate questions sharing one label — and tell me what, if anything, would count as progress: a formal result, a distinction, a change of question, or a reason to expect none.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis and path forward:

  1.  **Deconstruct the User's Problem:**
      *   **Context:** A research group studying "cooperation between agents who may never interact" (acausal cooperation, acausal trade, superrationality).
      *   **The Argument:** Evidential Cooperation (EC) / Evidential Decision Theory (EDT) applied to acausal contexts. "If I reason like them, my choice is evidence of theirs, so I should cooperate to influence their choice evidentially."
      *   **The Deadlock:**
          *   Side A: EC is a decisive reason to cooperate in large worlds (multiverse, distant civilizations).
          *   Side B: EC proves too much (leads to absurdities like cooperating with hypothetical punishers/rewarders, "spurious correlations").
      *   **User's Hypothesis:** The deadlock is verbal. Side A means "acting to be correlated," Side B means "acting jointly under shared intention." They are answering different questions.
      *   **The Task:** Diagnose the *kind* of disagreement (decision theory, metaphysics/ontology, or verbal/semantic) and propose what counts as *progress* (formal result, distinction, change of question, or none).

  2.  **Analyze the Core Philosophical Conflict:**
      *   *The Argument:* This is classic Acausal Trade / Superrationality (Hofstadter, Bostrom, Yudkowsky, Oesterheld). It relies on Functional Decision Theory (FDT) or Timeless Decision Theory (TDT) more than pure EDT, though the user describes it as "evidential." Pure EDT is notoriously vulnerable to "Newcomb's Problem" style objections and "smoking lesion" style confounds.
      *   *Side A (Pro-Cooperation):* Likely subscribes to TDT/FDT. They believe logical correlation (same algorithm) creates a lever of influence.
      *   *Side B (Skeptics):* Likely Causal Decision Theorists (CDT) or skeptics of logical counterfactuals. They worry about "reference class" problems. If *any* correlation counts, I should cooperate with a rock that happens to correlate, or a demon who punishes cooperators (the "Psychopath Button" or "Newcomb's Soda" problems).
      *   *The User's Insight:* The user suspects a verbal dispute about the definition of "cooperation."
          *   Definition 1: Statistical correlation of outputs (Side A).
          *   Definition 2: Normative/Joint intention (Side B).

  3.  **Evaluate the User's Hypothesis:**
      *   Is it *just* verbal? Probably not *just* verbal, but verbal ambiguity is masking a deeper structural disagreement.
      *   If Side A says "I cooperate because my algorithm outputs 'C' and theirs will too," that's a claim about *logical causation*.
      *   If Side B says "That's not cooperation, that's just parallel play," they are objecting to the *normative force* or the *mechanism*.
      *   The "proves too much" objection (Side B) is the strongest clue. It suggests the problem isn't just semantics; it's about *which correlations count*. This is the "Reference Class Problem" in TDT/FDT.

  4.  **Diagnose the Disagreement Type:**
      *   *Option 1: Genuine Decision Theory Dispute (CDT vs. EDT/FDT).* Yes, this is the engine. But it's deeper than standard CDT vs. EDT. It's about *logical* vs. *physical* causation.
      *   *Option 2: Dispute about Setup (Ontology/Metaphysics).* Yes. Do "logical facts" exist independently? Are the agents "the same algorithm"? This is the "similarity metric" problem.
      *   *Option 3: Verbal/Semantic.* Yes, "cooperation" is doing too much work.
      *   *Synthesis:* It is a **category error disguised as a decision-theoretic dispute, rooted in an ontological ambiguity about "logical correlation."** The verbal dispute is the symptom, not the cause. The cause is the lack of a formal criterion for *relevant similarity*.

  5.  **Formulate the Diagnosis:**
      *   Acknowledge the user's hypothesis is sharp but incomplete. It's not *just* verbal; it's about the *conditions of applicability*.
      *   Identify the specific technical bottleneck: The **Reference Class Problem** (or Similarity Metric). When does my reasoning count as "the same" as theirs?
      *   Identify the normative bottleneck: **Normative Force vs. Predictive Accuracy.** Just because they *will* do it (predictive) doesn't mean I *should* do it (normative) if the link isn't robust.
      *   Label the disagreement: It's a **Modal/Logical Uncertainty Dispute** masquerading as a semantic one.

  6.  **Determine What Counts as Progress:**
      *   *Formal Result:* We need a formalism that distinguishes "spurious correlation" from "logical correlation." (e.g., Logical Induction, Proof-Based Decision Theory).
      *   *Distinction:* Distinguish "Acausal Coordination" (optimizing given correlation) from "Acausal Trade" (negotiating terms).
      *   *Change of Question:* Stop asking "Should I cooperate?" and start asking "Under what formal conditions does my decision algorithm logically constrain theirs?"
      *   *Reason to expect none:* If the problem is fundamentally about undefined metaphysics of "logical counterfactuals," progress might be stalled until math catches up.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Validate the user's intuition. It *is* partly verbal, but that verbal ambiguity points to a formal gap.
      *   *Diagnosis:* Break it down into three layers.
          1.  **Semantic:** "Cooperation" vs. "Correlation."
          2.  **Formal:** The Reference Class Problem (Which agents count?).
          3.  **Normative:** Why does evidence create obligation?
      *   *The "Proves Too Much" Objection:* Address Side B's specific worry. This is usually about "common cause" vs. "logical identity." If a demon punishes cooperators, EDT says "Don't cooperate." If the demon punishes *people who decide like me*, FDT says "Cooperate." The group is likely conflating these.
      *   *Path to Progress:*
          *   Move from EDT to FDT/TDT frameworks (explicitly).
