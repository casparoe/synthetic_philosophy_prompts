answer: |-
  1. Arrange five chairs in a center circle for the "Residential Council" while the remaining nine students observe as constituents or rotate in later. Provide the council with a whiteboard for drafting charter clauses and a deck of sealed preference cards tailored to trigger the paradox. Assign one council member as the neutral Clerk who records votes and checks consistency, ensuring the rest act as residents with designated personal spheres like noise or pets.

  2. The council must adopt two axioms by consensus: unanimous preference prevails over social ranking, and each resident is decisive over paired outcomes within their designated personal sphere. Spend twenty minutes negotiating these rules, forty minutes attempting to draft a consistent charter against the first deck of cards, and thirty minutes debriefing the failure before running the second round. Enforce a strict stop-time when the Clerk identifies a cyclic contradiction, forcing the group to confront the impossibility rather than bargaining around it.

  3. Engineer the first deck so every resident holds meddlesome preferences about another's personal sphere, creating a three-way cycle where A prefers X to Y, B prefers Y to Z, and C prefers Z to X despite individual sovereignty. Reveal the cards only after the rules are set, ensuring the Clerk discovers the intransitivity while testing pairwise comparisons rather than during the initial reading. This specific configuration guarantees that satisfying unanimity violates sovereignty, or vice versa, making the logical collision palpable.

  4. Swap in the second deck where preferences are restricted solely to each resident's own sphere, allowing the council to draft a consistent charter immediately to highlight the role of meddlesome preferences. Use the contrast to map the first round's cycle onto Sen's theorem, pricing each escape route the council considered such as dropping unanimity or narrowing sovereignty. End by asking whether modeling rights as decisive preferences caused the trouble, or if modeling them as constraints would have merely relocated the conflict elsewhere.

  5. Expect students to try declaring matters non-personal, dropping preferences from the unanimity count, or declaring victory by leaving matters undecided, all of which you must flag as violating or dodging the adopted axioms. Acknowledge that the deck is rigged to produce an impossibility theorem rather than a practical political dispute, preventing the activity from proving the result holds for all possible preference profiles. You must verbally supply the general proof's ceiling, explaining that this staged case illustrates the logical tension but cannot demonstrate the mathematical necessity across all numbers of people and options.
