prompt: |-
  I have been teaching Good's theorem on the value of information in my decision theory seminar, and I have become puzzled by a tension I cannot resolve. Good's theorem shows that information can never have negative value, so how can we make sense of the fact that people sometimes deliberately avoid information — for example, patients who decline genetic tests, or investors who refuse to check their portfolio? Surely if the theorem were true, such behaviour would be straightforwardly irrational. I would like you to explain this apparent tension. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question. American English, please.
