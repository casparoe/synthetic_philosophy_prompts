answer: |-
  The apparent contradiction dissolves when you recognize that Good's theorem assumes agents care only about instrumental outcomes, while real people often derive utility directly from their beliefs or emotional states. Good's proof demonstrates that free information increases expected utility only when utility is defined strictly by the quality of the final decision and its material consequences. In reality, individuals frequently experience anticipatory utility, meaning their current well-being depends on what they expect to happen rather than just what actually occurs. For a patient avoiding genetic testing, the anxiety caused by a potential positive result represents a real cost that can outweigh the instrumental benefit of planning ahead, making ignorance the rational choice for maximizing total well-being. Furthermore, Good's theorem presumes information is costless, but processing distressing news carries psychological and cognitive expenses that function as a price tag on the data. Consequently, avoiding information is not a violation of rationality but rather rational behavior under a broader utility function that includes emotional peace of mind.
