answer: |-
  # Joint Statement on the Scope and Mechanism of Goodhart's Law

  **Authors:** [The Structuralist] & [The Deflationist]
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Nature of Metric Decoupling

  We began this collaboration holding divergent views on what is commonly referred to as Goodhart's Law. One of us argues that the decoupling of measures from goals under optimization pressure is a structural, information-theoretic inevitability. The other argues that the phenomenon is either a trivial tautology or a specific sociological consequence of strategic agency. After extensive discussion, we have produced this document to map our agreement, isolate our disagreements, and identify the empirical or theoretical tests that would resolve them.

  ### 1. Shared Premises

  We both sign the following claims. We believe these statements are substantive and non-vacuous, yet compatible with our respective models.

  1.  **Non-Identity:** In all cases of interest, the metric being optimized is not identical to the true goal. There is always a gap between the measure and the underlying value it is intended to track.
  2.  **Distributional Shift:** Applying strong optimization pressure to a metric changes the distribution of the systems or populations being measured. The post-optimization distribution differs from the pre-optimization distribution on which the metric was validated.
  3.  **Correlation Breakdown:** In observed cases across economics, public policy, and machine learning, sufficiently strong optimization of a proxy metric frequently leads to a reduction in the correlation between that metric and the true goal.
  4.  **Uncertainty Requirement:** The phenomenon requires uncertainty. If the relationship between the measure and the goal were known with perfect certainty and was static, optimization could be adjusted to prevent decoupling. The problem arises because the relationship is learned, estimated, or assumed.
  5.  **Agency is Sufficient:** We agree that strategic behavior by agents (gaming, cheating, teaching to the test) is a sufficient cause for metric decoupling. We disagree on whether it is necessary.
  6.  **Taxonomy Utility:** We agree that the four-way taxonomy (regressional, extremal, causal, adversarial) describes observable patterns of failure, even if we disagree on whether these patterns share a single root cause.

  ### 2. Remaining Disagreements

  On the following issues, we remain in disagreement. Each position is phrased to be acceptable to the holder of that view.

  **Issue A: The Necessity of Agency**
  *   **Structuralist Position:** Metric decoupling occurs in pure optimization systems without any adaptive agent trying to game the system. It is a property of selecting on a proxy in a high-dimensional space, not a property of human incentives.
  *   **Deflationist Position:** The interesting and actionable cases of Goodhart's Law require an agent with interests distinct from the principal. Without strategic response, "decoupling" is merely model error or statistical noise, which does not warrant a distinct "law."

  **Issue B: Substantive Content vs. Tautology**
  *   **Structuralist Position:** The claim is a non-trivial theorem about information and selection: optimizing a proxy necessarily consumes the "slack" that made the proxy informative, leading to a predictable phase transition in performance.
  *   **Deflationist Position:** The claim is effectively a tautology ("if you optimize the wrong thing, you get the wrong thing") dressed up as a theorem. If it were truly universal, all goal-directed action under uncertainty would be self-defeating, which is empirically false.

  **Issue C: The Role of Regression to the Mean**
  *   **Structuralist Position:** The regressional form is a specific selection effect where optimization pressure selects for noise in the measure. This is a structural constraint on control, distinct from simple statistical regression.
  *   **Deflationist Position:** The regressional form is nothing more than regression to the mean. It is a standard statistical property of noisy estimators, not a unique insight about control systems or economics.

  **Issue D: Unity of the Phenomenon**
  *   **Structuralist Position:** The four types of Goodharting are distinct manifestations of a single underlying mathematical failure: the breakdown of the measure-goal conditional probability under intervention.
  *   **Deflationist Position:** The four types are a mix of one sociological insight (adversarial) and three ordinary engineering or statistical problems (regressional, extremal, causal). Lumping them together obscures more than it reveals.

  ### 3. Table of Cruxes

  The following table lists specific sub-questions where evidence or argument would shift our positions. For each crux, we specify a concrete case and our conflicting predictions.

  | Crux | Concrete Case / Argument | Structuralist Predicts | Deflationist Predicts |
  | :--- | :--- | :--- | :--- |
  | **1. Agent-Free Optimization** | A reinforcement learning agent optimizes a reward function that is a noisy proxy for true performance, in a static environment with no other agents. | The agent will find a policy that maximizes the reward while minimizing true performance (reward hacking), purely due to optimization pressure. | The agent will simply maximize the reward. If reward diverges from performance, that is a specification error, not an instance of Goodhart's Law. |
  | **2. Continuity vs. Threshold** | We gradually increase optimization pressure on a metric (e.g., sampling harder from the tail of the distribution). | There is a threshold or phase transition where the metric-goal correlation collapses catastrophically rather than degrading linearly. | The degradation of the metric-goal correlation is continuous and gradual. There is no "collapse," only diminishing returns. |
  | **3. Regression vs. Structure** | Selecting the top 1% of candidates based on a test score that is an unbiased but noisy estimate of ability. | The true ability of the selected group will be significantly lower than the test scores imply, due to noise selection dominating at the extremes. | The test scores are *most* informative at the extremes for a bounded quantity. The selection will track true ability reasonably well; any error is standard statistical variance. |
  | **4. Monotonicity** | The measure is a strictly monotone function of the goal, plus noise. Optimization pressure is increased indefinitely. | Even with monotonicity, extremal optimization will break the relationship because the noise term becomes the dominant factor at the extremes. | If the function is strictly monotone, optimizing the measure *must* optimize the goal on average. Divergence is impossible by definition. |
  | **5. Taxonomy Unity** | We attempt to fix "Regressional Goodharting" using techniques designed for "Adversarial Goodharting" (e.g., randomization of metrics). | Techniques will transfer across categories because the root cause (selection on proxy) is the same. | Techniques will fail to transfer because the root causes (statistics vs. incentives) are fundamentally different. |
  | **6. Self-Reference** | We introduce a new metric that penalizes the optimization of the original proxy (e.g., "measure how much they are gaming the test"). | This leads to an infinite regress. The new metric becomes a proxy itself and is eventually Goodharted. | This leads to better metric design. We can iterate toward robustness without infinite regress if we address the sociological incentives. |

  ### 4. Analysis of Terminological Overlap

  In drafting this document, we have identified that a portion of our disagreement is verbal, stemming from competing definitions of "Goodhart's Law."

  **The Terminological Split**
  *   **The Structuralist** uses the term to refer to a broad claim about **optimizing under model uncertainty**. In this usage, the law is an information-theoretic constraint applicable to any system (biological, algorithmic, or economic) where a proxy is optimized.
  *   **The Deflationist** uses the term to refer to a specific family of **empirical regularities about institutions**. In this usage, the law describes the sociological dynamic where human agents respond to control metrics in ways that undermine the controller's intent.

  **What Survives the Distinction**
  If we set aside the terminological dispute, a substantive empirical disagreement remains. It is not merely about what we *call* the phenomenon, but about its **universality**.

  1.  **If the Structuralist is correct:** There is a hard limit on control systems. No matter how well-intentioned the agents are, and no matter how static the environment, pushing a proxy too hard *will* break it. This implies that robust alignment requires methods that do not rely on proxy optimization alone.
  2.  **If the Deflationist is correct:** The limit is soft and contextual. Decoupling is primarily a failure of incentive design or model specification. With sufficient care, monotonic proxies, and non-adversarial environments, we can optimize proxies without catastrophic decoupling.

  **Conclusion**
  We agree that the term "Goodhart's Law" is currently doing double duty. It names both a specific sociological observation (Campbell's Law territory) and a general constraint on optimization (Lucas Critique territory). Our collaboration clarifies that the verbal dispute masks a real bet on the world: **Is metric decoupling an inevitable cost of optimization pressure, or is it a preventable engineering failure?**

  The cruxes listed in Section 3 are our agreed-upon method for settling this bet. We commit to reviewing evidence regarding these specific predictions before renewing the debate.
