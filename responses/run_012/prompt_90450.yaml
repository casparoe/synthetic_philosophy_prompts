  - "verdict": one of "established concept exists" or "no established concept, coinage proposed"
  - "proposed_name": string, only if you coined one
  - "definition": tight enough that I can use it to sort new cases
  - "necessary_and_sufficient": array of short conditions
  - "boundary_cases": array of objects with "case", "verdict" (one of "instance", "not an instance", "borderline"), "reason"
  - "what_it_is_not": array of near-misses, one line each on the distinguishing feature

  One more thing I'd genuinely like you to check: is the "only runs one direction" part essential to the phenomenon, or is that a separate thing that just tends to co-occur with it?
