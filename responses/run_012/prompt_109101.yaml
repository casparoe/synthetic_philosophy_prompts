      *   *Mitigation:* Use the whiteboard heavily for the "Logical Order."
      *   *Audience Shift:* If Calvinists, they reject the "Freedom" premise. If Philosophers, they want the Truth-Maker theory. If Theologians, they want Biblical exegesis. This plan is for "Bright Generalists."

  8.  **The Vicar's Question:**
