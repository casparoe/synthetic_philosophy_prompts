answer: |-
  ### 1. Correspondence Table

  | Source Bit (Boo Picture) | Target Bit (Moral Talk) | Holds? | Note |
  | :--- | :--- | :--- | :--- |
  | **The Boo** | **The Moral Sentence** | **No** | A boo is an atomic noise; a sentence has syntax and compositional semantics. |
  | **The Booer** | **The Speaker** | Yes | Both are agents performing an act. |
  | **The Audience** | **The Listener** | Yes | Both are recipients of the act. |
  | **Pulling a Face** | **The Moral Attitude** | Yes | This is the core expressivist claim (meaning is grounded in attitude). |
  | **Boo's Lack of Truth-Value** | **Sentence's Lack of Truth-Value** | **Only if you assume the conclusion** | Sophisticated expressivism (Quasi-Realism) reconstructs truth-aptitude; the analogy assumes it away. |
  | **Boo's Lack of Internal Structure** | **Sentence's Logical Structure** | **No** | This is the fatal break. Sentences have parts that function in embedding; boos do not. |
  | **The Utterance Act** | **The Semantic Content** | **No** | The analogy conflates the *act* of condemning with the *content* condemned. |
  | **Context of Shouting** | **Context of Assertion** | Yes | Both rely on pragmatic context to be understood. |

  ### 2. Break Table

  | Break | Matters for the Conclusion? | Which Side it Helps | Analysis |
  | :--- | :--- | :--- | :--- |
  | **Expression vs. Report Slide** | **Yes** | **Expressivism** | The analogy assumes "Wrong" *is* the boo (expression). But embedding requires "Wrong" to function as content (reportable). The picture forbids this shift by definition, doing the textbook's work for it. |
  | **Atomic vs. Logical Parts** | **Yes** | **Expressivism** | A boo has no parts, so "If Boo..." is nonsense. A sentence has parts. The analogy smuggles in the assumption that sentence structure must mirror boo structure. |
  | **Act vs. Content Conflation** | **Yes** | **Expressivism** | It assumes whatever carries the meaning (the attitude) must be the same kind of thing as the act of uttering it. This blocks the possibility of a logic of attitudes. |
  | **Meaning = Immediate Use** | **Yes** | **Textbook** | The picture assumes meaning is exhausted by the immediate illocutionary act. If meaning involves commitment conditions instead, embedding works. |

  ### 3. The Verdict

  **Does the conclusion survive the breaks?**
  **No.** The conclusion ("attitude theory can't handle embedded moral sentences, so it's dead") is carried entirely by the analogy. Once you separate the *attitude expressed* from the *semantic content*, the Frege-Geach problem becomes a technical challenge to be solved (by building a logic of consistency for attitudes), not a refutation. The textbook is refuting **Emotivism** (Ayer), not **Expressivism** (Blackburn/Gibbard). It is a strawman.

  **Better Analogy:**
  **Making a Move in a Rule-Governed Game (e.g., Chess).**
  Saying "Murder is wrong" is like moving a Knight. It isn't describing the board; it's making a move that changes the normative status of the game (commitments/entitlements).
  *   **Does it dodge the problem?** It moves it. You can embed game moves logically ("If White moves Knight, then Black loses Castling rights"). This shows non-descriptive acts can have logical relations.
  *   **What it still can't do:** It doesn't automatically explain why moral sentences *look* like factual descriptions (truth-aptitude) rather than just moves. That requires the extra step of **Quasi-Realism** (explaining why talking about moves mimics talking about facts).

  **Is the textbook refuting a view anyone actually holds?**
  It refutes a view held in the 1930s (Emotivism). Contemporary expressivists explicitly reject the "Boo/Hurrah" reductionism. Using this to close the case on expressivism is like refuting modern physics by disproving Newtonian mechanics.

