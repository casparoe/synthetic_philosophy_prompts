prompt: |-
  You're a decision theorist who's spent years on choice under ambiguity — Ellsberg-style stuff — and you're unusually good at explaining it to people who haven't read any of it. Think carefully before you answer, and start by brainstorming what the research on ambiguity aversion does and doesn't actually show, because the pop version of it gets a lot wrong.

  Context: I'm a program officer at a mid-size foundation. I recomend grants of $1-3M, maybe 30-40 a year, and my committee has to sign off. The recurring shape of my problem is this: I can fund an approach with a real evidence base, where I roughly know the odds, or a newer approach where nobody can honestly tell me the odds. My board reads that as "risky" and leans to the known thing, and so do I. But I have a nagging feeling we're leaving value on the table — and also that sometimes the aversion is exactly right.

  Write me a decision procedure I can actually run on a proposal, grounded in what's really known about ambiguity aversion rather than the slogan version. Questions in order, what counts as a good enough answer to each, where it stops with a no, and where it hands the decision back to a person because its a values question rather than a factual one. Things it has to handle, because these are where I get stuck:

  - The difference between not knowing the odds and not knowing what the possible outcomes even are. Ellsberg's urn is the first kind; my grant decisions often feel like the second. Does the procedure apply to the second, and if not, say so plainly.
  - The move of trying to convert ambiguity into risk — base rates for analogous things, a distribution over the unknown probability — and how to tell honest conversion from fake precision.
  - The case where the missing information is being withheld by someone with an interest in my choice. My instinct is that's where the aversion stops being a bias.
  - The case where reducing the ambiguity is cheap: a pilot, a phone call to someone who's tried it. If information is cheap, the procedure should tell me to go get it, not to choose.
  - The fact that I do this forty times a year. A standing policy of dodging the ambiguous option has a cost that compounds, and no single decision shows it to me.
  - Whether the aversion only bites because I'm comparing my knowledge to someone else's. I notice I feel it much less when I'm the most informed person in the room.

  Also the coherence trap: if I'd rather bet on red than on black, and also rather bet on black-or-yellow than on red-or-yellow, I've contradicted myself, because those two pairs differ only in what happens on yellow. Whatever procedure you give me should make me catch myself doing that kind of thing, not just catch myself being timid.

  Then run it on three cases: (1) a well-evidenced literacy program with a known-ish effect size against a novel tutoring model with no track record; (2) renewing a program we've funded for years whose evaluation is weak, against a new one with strong evidence; (3) a case where the procedure gives me an answer I won't like — you pick whether that's fund the ambiguous option or no, your aversion here is doing real work, but make it a case where I'd rather hear the opposite.

  Last thing: be honest about what the procedure can't do — where it's just dressing up a judgment call, and how it would misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Decision theorist specializing in ambiguity (Ellsberg-style), good at explaining to laypeople.
      *   **Task:** Create a practical decision procedure for a foundation program officer (grants $1-3M, 30-40/year).
      *   **Core Problem:** Choosing between "Risk" (known odds, evidence-based) and "Ambiguity" (unknown odds, novel approaches).
      *   **Key Constraints/Requirements:**
          *   Must be grounded in actual research, not pop-psych slogans.
          *   Must distinguish between *risk* (known probs) and *ambiguity* (unknown probs) and *ignorance* (unknown outcomes/states).
          *   Must address "converting ambiguity to risk" (base rates) vs. fake precision.
          *   Must handle strategic withholding of info by applicants.
          *   Must handle cheap information (pilots/calls).
          *   Must account for portfolio effects (40 decisions/year).
          *   Must address the "competence hypothesis" (feeling less averse when expert).
          *   Must check for logical coherence (Ellsberg paradox violations).
          *   Must include 3 specific case studies (one unwelcome conclusion).
          *   Must admit limitations (where it's just dressed-up judgment).
      *   **Tone:** Thoughtful, rigorous, practical, honest.

  2.  **Brainstorming & Theoretical Grounding:**

      *   *Ellsberg Paradox:* People prefer known probabilities over unknown probabilities, even if the expected value is mathematically identical. This violates Savage's Sure Thing Principle.
      *   *Risk vs. Ambiguity vs. Ignorance:*
          *   Risk: $P(outcome)$ is known (e.g., coin flip).
          *   Ambiguity: Outcomes known, $P(outcome)$ unknown (e.g., urn with unknown mix).
          *   Ignorance (Knightian Uncertainty/Unawareness): Outcomes themselves might be unknown (e.g., black swan events, novel tech). *Crucial distinction for the user.*
      *   *Ambiguity Aversion:* Is it a bias or a heuristic?
          *   *Bias view:* It leads to incoherent preferences (Ellsberg).
          *   *Heuristic view:* It protects against adverse selection, model error, or strategic manipulation (Frisch & Baron, Einhorn & Hogarth).
      *   *Competence Hypothesis:* Heath & Tversky. Aversion drops when I feel competent/expert. This suggests aversion is partly about *confidence in my judgment*, not just the world's randomness.
      *   *Portfolio Theory:* Single decision vs. repeated game. Ambiguity aversion makes sense for a one-off survival scenario, less so for a diversified portfolio of 40 grants.
      *   *Value of Information:* If I can reduce ambiguity cheaply, I should buy information, not avoid the option.
      *   *Coherence:* The procedure needs to prevent the "Red/Black vs. Red+Yellow/Black+Yellow" inconsistency.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Categorize the Uncertainty.* Is it Risk, Ambiguity, or Ignorance? If Ignorance (don't know outcomes), standard ambiguity tools fail. Need to flag this.
      *   *Step 2: The Information Market.* Can I reduce ambiguity? If yes, and cheap -> Go get info. Don't decide yet.
      *   *Step 3: Source of Ambiguity.* Is it natural (nobody knows) or strategic (applicant hiding)? If strategic -> High aversion justified (adverse selection).
      *   *Step 4: Competence Check.* Why do I feel unsure? Is it my lack of expertise? If so, bring in an expert or treat as "low competence."
      *   *Step 5: Portfolio Context.* Am I treating this as a one-off or part of the 40? If part of the 40, I can afford some ambiguity to capture upside.
      *   *Step 6: Coherence Check.* The Ellsberg test. If I prefer A over B here, do I prefer A' over B' in the mirrored scenario?
      *   *Step 7: The Values Handoff.* Once facts are clear, the remaining gap is risk tolerance vs. innovation mandate. That's the Board's/Founder's call, not mine.

  4.  **Refining the Procedure for the User's Context:**

      *   Need to make it actionable. "Questions in order, what counts as a good enough answer."
      *   Need to explicitly handle the "Unknown Outcomes" issue (Ignorance).
      *   Need to address the "Fake Precision" trap (forcing a number when none exists).

  5.  **Developing the Case Studies:**

      *   *Case 1 (Literacy vs. Novel Tutoring):* Classic Risk vs. Ambiguity. Likely outcome: Fund the known, *unless* portfolio strategy dictates an innovation bucket.
      *   *Case 2 (Renewal vs. New Strong Evidence):* This is tricky. Renewal is "known" but weak evidence. New is "known" (strong evidence) but unknown *fit*. Actually, this flips the script. The renewal is the "ambiguous" one if the evaluation is weak (we don't know if it *actually* works, just that we funded it). The new one has strong evidence (Risk). *Correction:* The prompt says "renewing... whose evaluation is weak" vs "new one with strong evidence." This is actually Ambiguity (old) vs. Risk (new). The user might want to renew due to status quo bias. The procedure should push toward the new one.
      *   *Case 3 (Unwelcome Answer):* Needs to be a case where the procedure says "Fund the Ambiguous" but the user feels scared, OR "Reject the Ambiguous" when the user wants to be a hero. Let's go with: The procedure says *Reject* the ambiguous option because the ambiguity is strategic (applicant hiding data), but the user really wants to believe in the applicant's vision. This highlights the "strategic withholding" point.

  6.  **Addressing the "Coherence Trap":**

      *   I need to build a specific step where they map the preferences.
      *   Example: Prefer Known Program (A) over Unknown Program (B). Then ask: Prefer (Known Program + Small Certain Cost) over (Unknown Program + Small Certain Cost)? No, that's not the Ellsberg structure.
      *   Better: Frame it as "If I fund this ambiguous project, am I implicitly saying I would fund *any* ambiguous project with similar upside?" If not, why?
      *   Actually, the prompt asks to catch the Red/Black contradiction. I need a specific "Consistency Check" step.

  7.  **Writing the Content - Section by Section:**

      *   **Intro:** Acknowledge the expertise, validate the "pop version is wrong" premise.
      *   **The Theory (Brief):** Distinguish Risk, Ambiguity, Ignorance. Explain *why* aversion exists (competence, adverse selection).
      *   **The Procedure:** Step-by-step flowchart style.
          *   Step 1: State Space (Outcomes known?).
          *   Step 2: Information Cost (Buy info?).
          *   Step 3: Source of Ambiguity (Nature vs. Strategy).
          *   Step 4: Competence (Do *I* know?).
          *   Step 5: Portfolio (One-off vs. 40/yr).
          *   Step 6: Coherence (The Ellsberg Check).
          *   Step 7: Values (The Handoff).
      *   **The Cases:** Run the procedure.
      *   **Limitations:** Where math meets gut.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is the "Ignorance" distinction too academic?
      *   *Fix:* No, the user specifically asked about "not knowing what the possible outcomes even are." I must address that standard ambiguity models fail there.
      *   *Critique:* How do I handle the "40 times a year" point?
      *   *Fix:* Explicitly include a "Portfolio Allocation" step. If you reject all ambiguity, your portfolio decays. You need an "Innovation Budget."
      *   *Critique:* The Coherence Check needs to be simple.
      *   *Fix:* Use a "Swap Test." If you swap the evidence levels, does your preference flip logically?
      *   *Tone Check:* Ensure I don't sound like I'm telling them to *always* overcome aversion. Sometimes aversion is rational (adverse selection).

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Brainstorm research first? Yes, in the intro.
      *   Questions in order? Yes.
      *   Good enough answers? Yes.
      *   Stop with No? Yes.
      *   Handoff to values? Yes.
      *   Handle Unknown Outcomes? Yes.
      *   Handle Fake Precision? Yes.
      *   Handle Strategic Withholding? Yes.
      *   Handle Cheap Info? Yes.
      *   Handle 40/year? Yes.
      *   Handle Competence/Expertise? Yes.
      *   Coherence Trap? Yes.
      *   3 Cases? Yes.
      *   Limitations? Yes.

  10. (Final thought on Case 3): Let's make Case 3 about *Strategic Ambiguity*. The applicant is vague. The user *wants* to fund them because the mission aligns. The procedure says "No" because the ambiguity is likely adversarial. This teaches the user that aversion is sometimes a shield, not a bias.

  11. (Final thought on Case 2): The prompt says "renewing... evaluation is weak" vs "new... strong evidence." This is actually Status Quo Bias masquerading as Ambiguity Aversion. The "Known" thing (renewal) isn't actually known. The procedure needs to expose that the renewal is actually the ambiguous option.

  Let's write.
answer: |-
  Here is the reality of the research, stripped of the textbook simplifications: Ambiguity aversion is not simply a "bias" to be cured. In the lab (Ellsberg urns), it creates logical contradictions. In the wild (your foundation), it is often a rational defense against adverse selection, model error, or strategic manipulation.

  The pop version says: "You are scared of the unknown; be brave and calculate expected value."
  The real version says: "You are scared of the unknown because the unknown often hides negative selection. But if you are playing a repeated game with a diversified portfolio, strict aversion guarantees portfolio decay."

  Your specific problem is compounded by the **Competence Hypothesis** (Heath & Tversky): You feel less ambiguity aversion when *you* feel expert. This means your "risk assessment" is actually a "confidence in my own judgment" assessment.

  Below is a decision procedure designed for your context ($1-3M grants, 40/year, committee oversight). It separates factual errors from value judgments and forces coherence.

  ### The Ambiguity Audit Procedure

  Run this on every proposal where the evidence base is the primary point of contention.

  #### Step 1: The State Space Check (Ignorance vs. Ambiguity)
  **Question:** Do we know what "success" and "failure" look like, even if we don't know the odds?
  *   **Good Answer:** "Success is 80% literacy gain; failure is <10%. We just don't know the probability." (This is **Ambiguity**).
  *   **Stop Condition:** "We aren't sure what the outcomes might be. It could transform the field, or it could create a regulatory backlash we haven't imagined." (This is **Ignorance/Unawareness**).
  *   **Action:** If **Ignorance**, this procedure stops. Ambiguity tools assume you know the possible states of the world. If you don't, you are not making a grant decision; you are making a venture capital bet on a new asset class. This requires a different governance structure (e.g., a dedicated "high-risk" bucket with total loss tolerance). Do not process this through the standard committee.

  #### Step 2: The Information Market (Value of Information)
  **Question:** Can the ambiguity be reduced before the full grant decision, and at what cost?
  *   **Good Answer:** "A $50k pilot could tell us if the delivery model works," or "One call to the PI at University X who tried this would clarify the failure mode."
  *   **Stop Condition:** "We could know more, but it would take 6 months and we need to deploy capital now."
  *   **Action:** If information is cheap (relative to $1-3M) and actionable, **do not decide.** Fund the information gathering (planning grant, consultant, site visit). Choosing between Risk and Ambiguity is a mistake if you can buy clarity for pennies on the dollar.

  #### Step 3: The Source of Ambiguity (Nature vs. Strategy)
  **Question:** Why are the odds unknown?
  *   **Option A (Natural):** "This is a new intervention. No one has data yet."
  *   **Option B (Strategic):** "The applicant has data but hasn't shared it," or "The metrics are defined vaguely in the proposal."
  *   **Action:**
      *   If **Natural**: Proceed to Step 4. Ambiguity aversion here is a *bias* (you are penalizing novelty).
      *   If **Strategic**: **Stop.** Your aversion is rational. This is the "Lemon Problem." If an applicant hides failure modes, the expected value is negative regardless of the upside. Reject unless transparency is improved.

  #### Step 4: The Competence Check (The "Expertise" Bias)
  **Question:** Am I averse because the world is uncertain, or because *I* feel incompetent to judge it?
  *   **Test:** If I handed this proposal to a recognized expert in this specific niche, would the ambiguity remain?
  *   **Good Answer:** "Even an expert would say the odds are unknown."
  *   **Bad Answer:** "I don't understand the model, so it feels risky."
  *   **Action:** If the ambiguity is your lack of expertise, do not reject the proposal. Instead, **import competence.** Bring an external reviewer to the committee. If you reject because *you* don't understand it, you are institutionalizing your own knowledge gaps.

  #### Step 5: The Portfolio Context (The 40-Grant Rule)
  **Question:** Is this decision a one-off survival bet, or one of 40?
  *   **Fact:** Ambiguity aversion is rational for a single bet where ruin is possible. It is sub-optimal for a portfolio where variance averages out.
  *   **Action:** Check your YTD portfolio.
      *   If >80% of your capital is in "evidence-based/risk" grants: You **must** fund the ambiguous option (provided it passed Steps 1-3) to prevent portfolio decay. Innovation requires ambiguity exposure.
      *   If >50% is already in novel/ambiguous approaches: You are permitted to revert to the evidence-based option for stability.
      *   *Note:* This turns the decision from "Is this project good?" to "Does my portfolio need this type of risk?"

  #### Step 6: The Coherence Check (Catching the Ellsberg Contradiction)
  **Question:** Am I violating logical consistency?
  *   **The Test:** Imagine two pairs of choices.
      *   *Pair 1:* Fund **Known Program** (50% chance of success) OR **Unknown Program** (Success chance ?).
      *   *Pair 2:* Fund **Known Program** + **Small Certain Bonus** OR **Unknown Program** + **Small Certain Bonus**.
  *   **Action:** If you prefer the Known in Pair 1, you must prefer the Known in Pair 2.
  *   **Real World Application:** Ask yourself: "If I add a $100k monitoring budget to the Unknown Program to make it safer, do I still prefer the Known Program?"
      *   If you say "No, with monitoring I'd take the Unknown," then your original aversion was just about *control*, not the project itself. Fund the Unknown + Monitoring.
      *   If you say "Yes, I still prefer the Known even with monitoring," check for **Status Quo Bias**. Are you preferring the Known simply because it is the *current* default?

  #### Step 7: The Values Handoff
  **Question:** After Steps 1-6, is there still a gap?
  *   **Action:** Yes. The procedure clears the factual fog. What remains is the foundation's **Risk/Innovation Mandate**.
  *   **Handoff:** "Factually, Option A has known odds of X. Option B has unknown odds but higher upside potential. My portfolio analysis suggests we need 20% exposure to Option B types. My recommendation is B, not because it is 'safer,' but because it fits our mandate."
  *   **Why:** This moves the debate from "Is this risky?" (Yes, factually) to "Are we paid to take this risk?" (Values question).

  ---

  ### Running the Procedure on Your Cases

  #### Case 1: Literacy Program (Known) vs. Novel Tutoring (Unknown)
  *   **Step 1 (State Space):** Success is literacy gain for both. **Pass.**
  *   **Step 2 (Info Cost):** Can we pilot the novel tutoring? If yes, do that. If no (all or nothing), proceed.
  *   **Step 3 (Source):** Ambiguity is Natural (new model). **Pass.**
  *   **Step 4 (Competence):** You know literacy; you don't know the novel model. **Warning.** Import an expert reviewer.
  *   **Step 5 (Portfolio):** If you fund 40 grants, how many are "novel models"? If zero, this is a candidate for the innovation slot.
  *   **Step 6 (Coherence):** If you prefer Known, would you still prefer it if the Novel model had a guaranteed $50k evaluation attached? If the evaluation makes you switch, fund Novel + Evaluation.
  *   **Decision:** If your portfolio is heavy on "proven," **Fund the Novel Tutoring.** Not because it's better, but because your portfolio needs the option value. If your portfolio is already heavy on novelty, Fund the Literacy Program.
  *   **Why:** This prevents the "safe drift" where your portfolio becomes 100% conservative over 5 years.

  #### Case 2: Renewal (Weak Eval) vs. New Program (Strong Evidence)
  *   **Step 1 (State Space):** Both have defined outcomes. **Pass.**
  *   **Step 3 (Source):** *Crucial Flip.* The Renewal has *weak evaluation*. This means the odds are **Unknown**. The New Program has *strong evidence*. This is **Risk**.
  *   **Analysis:** You are treating the Renewal as "Known" because you know the *people*, but the *outcomes* are ambiguous. You are treating the New Program as "Risky" but the odds are actually *known*.
  *   **Step 4 (Competence):** You feel competent with the Renewal (you've funded them). You feel less competent with the New. This is the **Competence Hypothesis** bias.
  *   **Decision:** **Fund the New Program.**
  *   **Why:** You are experiencing "Familiarity Bias" masquerading as Ambiguity Aversion. The Renewal is the ambiguous urn; the New Program is the known urn. Your procedure identifies you are preferring the Familiar, not the Known.

  #### Case 3: The Unwelcome Answer (Strategic Ambiguity)
  *   **Scenario:** A charismatic applicant proposes a bold policy change. The evidence is thin. The "failure modes" are dismissed as "political will." You *want* to fund this; it aligns with your passion. The Board is skeptical.
  *   **Step 3 (Source):** You dig in. You realize the applicant *has* data from a previous pilot that showed mixed results, but they omitted it from the proposal to avoid scaring you.
  *   **Analysis:** The ambiguity is **Strategic**.
  *   **Procedure Output:** **Reject.**
  *   **Why:** Step 3 dictates that strategic ambiguity is a signal of adverse selection. If they hide the downsides now, they will hide implementation failures later.
  *   **The Unwelcome Truth:** Your instinct to fund was based on mission alignment. The procedure tells you that mission alignment does not compensate for adversarial information asymmetry. You cannot manage a grantee you cannot trust. The "value left on the table" is not worth the risk of being manipulated.

  ---

  ### Limitations: Where the Procedure Fails

  I owe you honesty about where this is just dressed-up judgment.

  1.  **The "Unknown Outcomes" Wall (Step 1):** If you are truly in Knightian Uncertainty (you don't know what you don't know), no decision procedure works. This procedure tells you to *stop* and change the governance model. It cannot calculate the value of a Black Swan.
  2.  **The Portfolio Lie (Step 5):** I assume your 40 grants are a diversified portfolio. They aren't. They are 40 distinct moral commitments. If the "Novel Tutoring" fails, you can't offset it with the "Literacy Program" success in the eyes of a beneficiary. The "Portfolio" argument is a financial heuristic applied to social goods. It works for *your* career risk, less so for the *world's* risk.
  3.  **The Coherence Trap:** The Ellsberg check (Step 6) assumes you care about logical consistency. You might not. You might say, "Yes, I am inconsistent. I prefer the Known here because I have to answer to the Board, but I'd prefer the Unknown in a different context." That is a political constraint, not a decision error. The procedure flags it, but cannot fix it.
  4.  **Fake Precision:** In Step 2, applicants will try to give you numbers ("80% chance of success!") to game the "Risk" category. You must remain the arbiter of whether those numbers are real or fake. The procedure relies on *your* ability to detect bullshit. If you lose that, the procedure breaks.

  ### Final Advice

  Your nagging feeling is correct: A standing policy of dodging ambiguity compounds into irrelevance. Foundations that only fund the "known" eventually fund things the government or private sector should be funding.

  However, your Board's fear is also correct: Ambiguity is where money goes to die.

  Use this procedure to move the argument. When you bring a proposal to the committee, do not say "This is a good risk." Say: *"I have run the Ambiguity Audit. The uncertainty is natural, not strategic. Information is too expensive to buy. Our portfolio is currently 90% conservative. Therefore, taking this ambiguity is not a lapse in judgment, but a requirement of our asset allocation."*

  That is a language Boards understand. It turns "risk" into "strategy."
