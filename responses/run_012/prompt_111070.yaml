answer: |-
  **Brainstorm**
  Clause (1) sets the boundary of duty, but Clause (2) does the heavy lifting by ensuring the act possesses *moral* value rather than mere prudential or aesthetic value. Clause (3) is the most fragile, as subjective enjoyment can theoretically cancel out objective costs, threatening to exclude paradigmatic cases where the agent loves their sacrifice.

  **Ratings and Analysis**

  **(a) Nurse on flight**
  **Rating: 2**
  **Justification:** While morally good and non-required, her enjoyment and indemnification likely negate the "net cost" condition.
  **Clauses:** (1) Satisfied; (2) Satisfied; (3) Failed.

  **(b) Commuter gives seat**
  **Rating: 4**
  **Justification:** It fits the definition technically, but the trivial cost and social expectation make it feel more like minor duty than supererogation.
  **Clauses:** (1) Satisfied; (2) Satisfied; (3) Satisfied.

  **(c) Scientist turns down post**
  **Rating: 10**
  **Justification:** This is a paradigm case involving significant sacrifice for a clear moral good beyond any duty.
  **Clauses:** (1) Satisfied; (2) Satisfied; (3) Satisfied.

  **(d) Man forgives fraudster**
  **Rating: 9**
  **Justification:** Forgiveness beyond justice is morally superior and costly, though slightly less paradigmatic than physical sacrifice.
  **Clauses:** (1) Satisfied; (2) Satisfied; (3) Satisfied.

  **(e) Retired teacher summits mountain**
  **Rating: 0**
  **Justification:** The act involves cost and is non-required, but personal achievement is not morally better than the required alternative.
  **Clauses:** (1) Satisfied; (2) Failed; (3) Satisfied.

  **(f) Executive donates for ambition**
  **Rating: 5**
  **Justification:** It formally satisfies the definition, but the selfish motive undermines the intuition that the act itself is morally better.
  **Clauses:** (1) Satisfied; (2) Satisfied (consequentially); (3) Satisfied.

  **Follow-Up Analysis**

  **Pair of acts to change if Clause (2) were dropped:**
  I would have to change the ratings for **(e)** and **(f)**.
  Case (e) currently scores 0 because it fails Clause (2) (no moral value); without Clause (2), it becomes a costly, non-required act, raising its score significantly. Case (f) currently scores 5 due to ambivalence about whether a selfish motive allows an act to be "morally better" under Clause (2); removing Clause (2) removes this moral qualm, raising its score to match the structural fit of (1) and (3).

  **Single clause to revise:**
  I would revise **Clause (3)** ("performed at some net cost to the agent").
  **Why:** This clause invites the "Paradox of Supererogation," where an agent who enjoys their sacrifice (like the nurse or a saint who loves God) is disqualified because their subjective utility gain cancels the objective cost. Supererogation should depend on objective sacrifice or risk, not the agent's net welfare balance.

  **Case (f) and a Fourth Clause:**
  Yes, case (f) gives reason to add a fourth clause about motive.
  **Proposed Clause:** "(4) The act is performed at least partly for the sake of the moral good itself."
  **Exclusion/Inclusion Logic:** This excludes (f) because the executive's primary motive is political ambition (the hospital is merely a means). It includes (a) because the nurse acts to stabilize a passenger (the moral good), even if she also finds it exhilarating; the enjoyment is a byproduct, not the sole justificatory end.
