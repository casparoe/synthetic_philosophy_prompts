      *   **Core Learning Objectives:**
          1.  Moral status is underdetermined by evidence (behavior vs. mechanism streams).
          2.  Verdicts may reflect facts about the *attributor* (relations, framing) rather than the *system*.
          3.  Students should leave *unable* to confidently state which stream drove their verdicts (epistemic humility/confusion).
          4.  No final criterion should be established.
      *   **Constraints:** No equipment beyond paper, envelopes, whiteboard. No reading list. Criteria names (e.g., "global broadcast") must not appear *before* the debrief.
      *   **Structure Provided by User:** Two panels (Behavior vs. Mechanism), 8 systems, verdict scale, question trading, reveal of paired cases, framing vote, debrief.
      *   **Deliverables:** Minute-by-minute timeline, written case cards, facilitator's script for debrief, prediction of failures/mitigations, frank limitations of the exercise.

  2.  **Deconstruct and Refine the Structure:**
