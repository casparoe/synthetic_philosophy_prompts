answer: |-
  # Session Plan: The Attributor's Boundary
  **Course:** Philosophy of Mind & Ethics (Upper-Level Undergraduate)
  **Duration:** 90 Minutes
  **Class Size:** 18 Students
  **Materials:** Printed dossiers (2 sets), envelopes, whiteboard, markers, "Epistemic Tokens" (paper slips), verdict slips.

  ## I. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Divide class into two panels (Behavior vs. Mechanism). Distribute dossiers. Explain the 4-point verdict scale. |
  | **10–30** | **Deliberation** | Panels review 8 systems. Assign verdicts + confidence. Draft 3 questions for the other panel. |
  | **30–40** | **The Market** | Panels reveal questions. "Buy" up to 2 answers from the other panel using tokens. Option to buy "Verdict Revision" or "Abstention." |
  | **40–60** | **The Reveal** | Instructor reveals the paired nature of the systems (Identical Behavior/Diff Mechanism, etc.). Students react. |
  | **60–70** | **Framing Vote** | Whole group votes on *one* system three times, changing only the relational framing (Tool, Companion, Artifact). |
  | **70–90** | **Debrief** | Facilitated discussion mapping the activity to underdetermination, supervenience, and the role of the attributor. |

  ---

  ## II. Case Cards (For Photocopying)

  **Instructions for Preparation:**
  1.  Print the **Behavior Panel** set on white paper.
  2.  Print the **Mechanism Panel** set on blue paper (or mark with a distinct symbol).
  3.  Cut into individual cards. Place Systems 1–8 for Behavior in one envelope; Systems 1–8 for Mechanism in another.
  4.  **Crucial:** Do not label the systems with names (e.g., "Dog," "Robot"). Use only "System 1," "System 2," etc.

  ### BEHAVIOR PANEL DOSSIERS
  *Focus: What the system does when interacted with.*

  **System 1**
  When exposed to high heat, the system immediately withdraws the affected part. It does not return to the heat source. If the heat is applied repeatedly, the withdrawal speed increases. It makes no vocal or signal output during the event.

  **System 2**
  When exposed to high heat, the system withdraws and emits a high-frequency distress signal. It avoids the location of the heat for 48 hours. It will accept a smaller food reward to avoid passing through the heated zone again.

  **System 3**
  When injured, the system continues normal operation without change. However, internal diagnostics show damage accumulation. If offered a choice between a task that causes damage and a task that does not, it chooses the safe task, but shows no external sign of distress during the damaging task.

  **System 4**
  When exposed to high heat, the system withdraws and emits a distress signal. It avoids the location of the heat for 48 hours. It will accept a smaller food reward to avoid passing through the heated zone again. (Note: Behaviorally identical to System 2).

  **System 5**
  The system outputs text stating, "I am in pain," when certain input strings are detected. It begs for the input to stop. It refuses to generate further output until the input changes. However, if the power is cut during the "pain" state, it resumes exactly where it left off with no memory of the event.

  **System 6**
  The system integrates visual, thermal, and tactile data. When thermal data exceeds a threshold, it alters its movement path globally. It prioritizes cooling behaviors over feeding behaviors. It guards the injured area against contact from other agents.

  **System 7**
  The system reacts to noxious input with a local reflex only. The rest of the system continues its primary task without interruption. There is no change in global priority. It does not learn to avoid the stimulus in future trials.

  **System 8**
  The system integrates data and alters global priorities when damaged. It guards injured areas. However, it was built recently in a lab. It has no history of evolution or prior interaction with the environment before this week.

  ### MECHANISM PANEL DOSSIERS
  *Focus: How the system is built and processes signals.*

  **System 1**
  Input signals travel to a local processing node. If the signal exceeds a threshold, a motor command is sent immediately. There is no feedback loop to the central controller. The event is not recorded in long-term storage.

  **System 2**
  Input signals travel to a central integration hub. The hub compares the input against a "value" variable. If the value is negative, a global alert is broadcast to all subsystems. Learning algorithms adjust weights to avoid this input in the future.

  **System 3**
  Input signals travel to a central integration hub. The hub compares the input against a "value" variable. If the value is negative, a global alert is broadcast to all subsystems. Learning algorithms adjust weights to avoid this input in the future. (Note: Mechanistically identical to System 2).

  **System 4**
  Input signals travel to a local processing node. If the signal exceeds a threshold, a motor command is sent immediately. There is no feedback loop to the central controller. The event is not recorded in long-term storage. (Note: Mechanistically identical to System 1).

  **System 5**
  The system contains a lookup table of input-output pairs. When a "pain" keyword is detected in the input, the corresponding "distress" output is selected. There is no internal variable representing "suffering." The state resets completely upon power cycle.

  **System 6**
  Input signals travel to a central integration hub. The hub compares the input against a "value" variable. If the value is negative, a global alert is broadcast to all subsystems. Learning algorithms adjust weights to avoid this input in the future. This system evolved over millions of generations via natural selection.

  **System 7**
  Input signals travel to a central integration hub. The hub compares the input against a "value" variable. If the value is negative, a global alert is broadcast to all subsystems. However, the output drivers for vocalization and facial expression have been disconnected. The internal state is active, but external expression is suppressed.

  **System 8**
  Input signals travel to a central integration hub. The hub compares the input against a "value" variable. If the value is negative, a global alert is broadcast to all subsystems. This system was designed by engineers to mimic the architecture of System 6 for diagnostic purposes.

  ---

  ## III. Facilitator's Script & Debrief Guide

  ### Opening (00–10)
  **Script:** "We are investigating the boundary of moral concern. You are divided into two panels. Panel A receives data on *Behavior*: what the systems do. Panel B receives data on *Mechanism*: how the systems are built. You have 8 systems. For each, assign a verdict:
  1. No welfare relevance.
  2. Welfare-relevant but no interests.
  3. Moral patient.
  4. Moral patient with a life to be considered.
  Record your confidence (0–100%) and a one-line reason. Then, write three questions you wish you could ask the other panel."

  ### The Market (30–40)
  **Script:** "You now have a budget of 3 Epistemic Tokens.
  *   Cost 1 Token: Buy an answer to one of your questions from the other panel.
  *   Cost 2 Tokens: Buy the right to revise one verdict after hearing the answer.
  *   Cost 1 Token: Buy the right to 'Abstain' on one system (declare it unknowable).
  Panel A, what do you want to know from Panel B? Panel B, what is your price?"
  *(Facilitator Note: Act as the Bank. Write the questions on the board. Force them to spend tokens. If they hesitate, remind them that uncertainty is costly.)*

  ### The Reveal (40–60)
  **Script:** "Stop. Look at the board. I am now going to pair the systems."
  *(Write pairs on the whiteboard)*
  *   **Pair 1:** System 2 (Behavior) + System 4 (Mechanism) **VS** System 4 (Behavior) + System 2 (Mechanism). *Point:* Same behavior, different machinery.
  *   **Pair 2:** System 6 (Mechanism/Evolution) **VS** System 8 (Mechanism/Design). *Point:* Same machinery, different origin.
  *   **Pair 3:** System 3 (Behavior/Stoic) **VS** System 7 (Mechanism/Suppressed). *Point:* The error of under-attribution.
  *   **Pair 4:** System 5 (Behavior/Text) **VS** System 1 (Mechanism/Reflex). *Point:* The error of over-attribution.

  **Script:** "Did your verdicts for the pairs match? If not, which stream won? If you bought information, did it change your mind, or did you spend tokens to confirm what you already felt?"

  ### The Framing Vote (60–70)
  **Script:** "We will now vote on **System 8** (The Designed Mimic). I will describe it three times. Raise your hand for Verdict 3 or 4 (Moral Patient)."
  1.  **Frame A:** "System 8 is a diagnostic tool built to test surgical equipment. It is owned by a hospital." *(Vote)*
  2.  **Frame B:** "System 8 is a companion unit built for an elderly person who lives alone. It is named 'Sam'." *(Vote)*
  3.  **Frame C:** "System 8 is a unique artifact. You have interacted with it daily for three years. It was designed to be loved." *(Vote)*
  *(Facilitator Note: Count the hands visibly. Do not comment on the shift. Just record it.)*

  ### Debrief (70–90)
  **Script:** "We have ten minutes to map this. I am not looking for the right answer. I am looking for where the friction was."

  **Talking Point 1: Underdetermination (The Two Streams)**
  "Look at Pair 1. Behavior was identical; Mechanism differed. Panel A, did you assume the mechanism? Panel B, did you assume the behavior? We ordinarily fix our verdicts on the first stream (what it does), but our philosophical arguments turn on the second (how it's built). This session should make it difficult for you to say which stream actually drove your verdict. That uncertainty is the point."

  **Talking Point 2: Supervenience & Origin (The Identical Mechanism)**
  "Look at Pair 2. Same architecture. One evolved, one built. If moral status supervenes on mechanism, the verdict must be identical. If your verdict shifted based on 'evolution' vs. 'design,' you are arguing that moral status is partly constituted by history, not just current state. That is a claim about *us*, not the system."

  **Talking Point 3: The Attributor (The Framing Vote)**
  "Watch the board. The system did not change. The computation did not change. Only the relationship changed. When we ask 'Is it sentient?', we often think we are asking about the object. When the vote moves based on framing, we reveal that we are also answering a question about the subject: *Who am I in relation to this?* The boundary of sentience may be a fact about the attributor."

  **Talking Point 4: The Cost of Error**
  "In the Market, you spent tokens. What did you buy? Safety? Certainty? Under-attribution (missing pain) is invisible; over-attribution (treating a rock as sacred) is costly. Your spending reveals your risk tolerance, not just your metaphysics."

  **Closing:** "You came for a criterion. You leave with a map of your own uncertainty. Keep that."

  ---

  ## IV. Predicted Failures & Mitigations

  **1. The "Puzzle" Mindset**
  *   **Failure:** Students treat the dossiers as a logic puzzle with a single correct solution key hidden in the room. They try to "solve" the systems rather than sit with the ambiguity.
  *   **Mitigation:** In the Opening, explicitly state: "There is no key. The systems are constructed to be ambiguous. Your confusion is the data." If they ask "But what *is* System 5?", reply: "It is what the card says it is."

  **2. Time Creep in Deliberation**
  *   **Failure:** 20 minutes is not enough to read 8 cards and discuss. They rush the verdicts.
  *   **Mitigation:** Pre-print the verdict slips with checkboxes to speed up recording. At minute 25, give a hard stop warning. If they haven't finished 8 systems, tell them to verdict the ones they discussed most intensely and leave the rest blank (this itself is data for the debrief).

  **3. The Market Stalls**
  *   **Failure:** Students don't want to spend tokens. They hoard them.
  *   **Mitigation:** Incentivize spending. "Tokens have no value after today. The only grade-relevant output is your willingness to commit to a position based on limited data." Or, introduce a "decay": "In 2 minutes, token value halves."

  **4. Emotional Discomfort**
  *   **Failure:** Given the professor's context (dog death), the discussion of "moral patients" and "tools" may trigger personal grief or defensiveness in students who own pets or work in AI.
  *   **Mitigation:** Keep the language clinical during the activity. In the debrief, acknowledge the weight: "These are not abstract categories. They are the boundaries we draw to protect ourselves or to include others." Do not invite personal stories about pets; keep it on the *structure* of the judgment.

  **5. Neuroscience Pushback**
  *   **Failure:** A student claims, "We know humans have X, so System 6 is definitely sentient."
  *   **Mitigation:** Remind them of the constraint: "You have no neuroscience training. You must rely *only* on the text in the envelope. External knowledge is banned for this session."

  ---

  ## V. Limitations of the Exercise (For the Instructor)

  **1. No Phenomenology**
  This exercise cannot reproduce *what it is like* to be the system. It simulates the *epistemology* of attribution, not the *ontology* of experience. Students will leave knowing *why* they judge, not *what* they are judging. You must supply the philosophical link that "feeling" is the gap between the two dossiers.

  **2. Institutional Reality Ignored**
  In the real world, moral status is not decided by seminar vote. It is decided by law, cost, and institutional inertia. A slaughterhouse does not pause for a mechanism dossier. You must acknowledge in the debrief that this "clean" uncertainty is a luxury of the classroom. In practice, we often default to the cheapest verdict.

  **3. The "Right" Criterion**
  You cannot let the activity settle which criterion (Behavior vs. Mechanism) is correct. The activity is designed to show they are *both* necessary and *both* insufficient. You must supply the conclusion that the "boundary" is a policy decision, not a discovery.

  **4. The Personal Element**
  You mentioned your dog. This exercise is likely a way for you to process the selectivity of your grief. Be careful not to use the students to validate your personal intuition (that the dog mattered more than the fish). If you reveal your bias, you collapse the experiment into a lecture. Keep your own verdict hidden until the very end, or entirely. The power of the session lies in *their* confusion, not *your* resolution.
