  6.  **Addressing the User's Emotional Context:**
      *   The prompt starts with a personal note about the dog. The lesson plan should acknowledge this gravity without making it about the professor. The "attributor" point is deeply personal here. The debrief script should allow space for this without demanding confession.

  7.  **Final Review against Constraints:**
