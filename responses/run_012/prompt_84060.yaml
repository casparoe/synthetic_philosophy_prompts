      *   *Faction/Parties:* Spinoza fears sedition and division. The state must prevent factions from becoming powerful enough to challenge sovereign power. However, he acknowledges passions cannot be eradicated, only managed.
      *   *Sovereignty:* Absolute over outward conduct (*TTP* 20). No power over inward judgement/thought. Laws must be rational enough to be obeyed without destroying the state's power.
      *   *Sortition:* Spinoza discusses election by lot in *TP* (aristocracy context), often viewing it as a way to prevent factionalism in patrician selection, but he prefers election for key offices to ensure competence. He is wary of large assemblies becoming unwieldy or passionate.

