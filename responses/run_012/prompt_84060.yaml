answer: |-
  To reconstruct Spinoza's position on modern democratic innovation, we must begin with his ontological definition of right: *potentia* is *jus*. In the *Tractatus Politicus*, democracy is the "most natural" regime because it approaches the condition where the commonwealth's right is coextensive with the power of the entire multitude (*TP* 11.1). This premise forces a difficult reckoning with your first counterfactual: mass suffrage. Spinoza explicitly excludes women, servants, and foreigners from voting in *TP* 11.4, arguing they are not *sui juris* and lack equal authority. Is this load-bearing? Textually, it rests on an empirical anthropology that claims women are naturally unequal in power to men. However, this contradicts the core metaphysical commitment of the *Ethics* that all beings strive to persevere (*conatus*). If the right of the state is simply the combined power of individuals, excluding any segment capable of affecting the common power diminishes the state's own right. While Spinoza's 17th-century physics led him to deny women this power, his theory of right suggests their exclusion is an unresolved inconsistency rather than a necessary premise. A consistent Spinozism would likely embrace universal suffrage not as a moral imperative, but as a pragmatic recognition that excluding any substantial portion of the multitude weakens the sovereign's total *potentia* and invites sedition.

  This leads to the problem of organized parties. Spinoza's hostility to sedition is absolute; the sovereign must prevent the multitude from being divided into factions that act as competing states (*TP* 8.4). Modern parties are institutionalized factions. Spinoza might concede that they channel passions into law rather than violence, serving as a buffer against sudden upheaval. Yet, his deeper worry is that permanent factionalism fragments the mind of the state. If parties prioritize their own preservation over the common utility, they erode the unity required for absolute sovereignty. He would likely tolerate them only insofar as they remain subordinate to laws that prevent any single faction from dominating the others, viewing them as a dangerous but perhaps unavoidable mechanism for managing the passions of a large multitude.

  The crucial test, however, is the modern sortition body. Consider the Irish Citizens' Assembly or the Belgian citizens' council. Spinoza discusses sortition in *TP* 8.5 regarding aristocracy, noting it prevents factional intrigue in selecting patricians. Applied to democracy, random selection mimics the "whole multitude" better than election, which tends toward aristocracy. Spinoza would appreciate that lot removes ambition and campaigning, reducing the passionate volatility he fears. However, the institutional design of these bodies poses a severe theoretical problem regarding sovereign authority. In *TTP* 19 and *TP* 3, Spinoza insists sovereign power must be absolute over outward conduct. If a sortition body's recommendations formally bind the legislature, sovereignty is effectively divided between the elected representatives and the random sample. For Spinoza, a state with two heads is unstable; the right of the state must reside in one determinate authority capable of enforcing decisions.

  Furthermore, consider the distinction between inward judgement and outward conduct (*TTP* 20). Deliberation is inward; law is outward. A sortition body deliberates, but if it commissions agendas or binds the legislature, it encroaches on the sovereign's exclusive right to determine what is necessary for security. Spinoza might argue that while such bodies can advise—expanding the rational input into sovereignty—they cannot legitimately bind without becoming the sovereign themselves. If they claim binding authority without possessing the coercive power to enforce it (which remains with the state apparatus), they create a fictitious right that undermines the actual power structure. The Belgian model's ability to set its own agenda is particularly suspect; agenda-setting is a sovereign function. To allow a subset of the multitude, however randomly selected, to dictate the sovereign's focus risks creating a state within a state, violating the unity required for stability.

  The texts underdetermine whether Spinoza would see these bodies as rationalizing the multitude or fragmenting it. However, the balance of his commitments tilts toward stability and the unity of command. He values democracy because it aligns right with power, but he fears the multitude's irrationality. Sortition bodies attempt to filter this irrationality, but if they bypass the established sovereign channels, they threaten the very peace they seek to enhance. The strongest Spinozist critique is not that sortition is undemocratic, but that it risks displacing the sovereign authority required to maintain the state's power, turning deliberation into a competing source of right that lacks the power to sustain itself.

  Verdict: Spinoza would likely endorse sortition bodies as advisory organs to cool factional passions but reject any binding authority they claim as a dangerous fragmentation of sovereign power.
