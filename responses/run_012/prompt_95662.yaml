          *   *Bearing:* In DCD, the heart *could* be restarted (so it's not strictly irreversible in the physiological sense at the moment of declaration), but it *won't* be (permanent). If death requires *irreversibility*, DCD is problematic (organ viability requires quick retrieval, often before true biological irreversibility). If death allows *permanence*, DCD works. This creates tension with the DDR.
          *   *Correct Answer:* Must identify that DCD relies on *permanence* (won't restart) rather than strict *irreversibility* (can't restart). If the student says they are the same in DCD, they need to acknowledge the conceptual difference matters for the DDR.

