answer: |-
  ### The Verisimilitude Proxy Protocol (VPP)

  **Preface for Editors:** Your friend is logically correct: we cannot measure "closeness to truth" (verisimilitude) directly. The Tichý/Miller results prove that for any two false theories, logical manipulation can reverse their ranking. However, textbooks must narrate progress. This procedure does not measure truth. It measures **stability of successful commitment**. It forces authors to distinguish between *predictive accuracy*, *ontological retention*, and *explanatory scope*. It treats "closer to the truth" as a shorthand for "retains more of the predecessor's successful references while solving its anomalies."

  **The Procedure:**

  1.  **Identify the Dimension of Superiority.**
      *   *Question:* Is the proposed ranking based on (A) Predictive Accuracy, (B) Ontological Commitment (what exists), or (C) Explanatory Unification (connecting disparate phenomena)?
      *   *Sufficient Answer:* The author must select exactly one primary dimension. If they claim all three, proceed to Step 2. If they cannot distinguish them, **STOP** and refer to the Series Editor.
      *   *Rationale:* Prevents conflation of "works better" with "is truer."

  2.  **The Empirical Subsumption Test.**
      *   *Question:* Does the newer theory ($T_2$) reproduce the successful predictions of the older theory ($T_1$) within $T_1$'s original domain, plus solve at least one anomaly $T_1$ could not?
      *   *Sufficient Answer:* **Yes** (proceed to Step 3). **No** (if $T_2$ loses predictive power in the old domain, you cannot claim it is "closer to truth" on accuracy grounds).
      *   *Output if No:* License only a **Weaker Claim**: *"$T_2$ offered a new conceptual framework, though initially with comparable/narrower predictive scope."*

  3.  **The Ontological Retention Test.**
      *   *Question:* Does $T_2$ posit entities that can be identified as the *referents* of $T_1$'s core terms, or does it declare $T_1$'s core entities to be non-existent illusions?
      *   *Sufficient Answer:* **Retention** (e.g., "atoms" $\to$ "quantum atoms") allows a truth-likeness claim. **Elimination** (e.g., "phlogiston" $\to$ "no phlogiston") forbids a truth-likeness claim regarding those entities.
      *   *Rationale:* If $T_1$'s main objects are declared fictitious, $T_2$ is not "closer" to $T_1$'s picture; it is a replacement.
      *   *Output if Elimination:* License only a **Weaker Claim**: *"$T_2$ replaced the ontology of $T_1$ with a more empirically adequate model."*

  4.  **The Vocabulary Stability Test (Language Dependence).**
      *   *Question:* If we re-describe the episode using *effect-terms* (observables) instead of *cause-terms* (theoretical entities), does the ranking of $T_2$ over $T_1$ remain stable?
      *   *Sufficient Answer:* **Stable** (proceed to Step 5). **Unstable** (if the ranking flips depending on whether we prioritize causes or effects).
      *   *Output if Unstable:* **Referral to Series Editor.** This indicates the ranking relies on a metaphysical preference for certain vocabularies, not evidence.
      *   *Output if Stable:* Proceed to Step 5, but add a limitation tag.

  5.  **Final Verdict & Wording.**
      *   *If Steps 2, 3, and 4 are passed:* License the Ranking.
          *   *Required Wording:* *"$T_2$ is considered more empirically adequate and retains the successful ontological commitments of $T_1$."* (Do not use "closer to the truth" without qualification).
      *   *If Step 2 fails:* Use Weaker Claim from Step 2.
      *   *If Step 3 fails:* Use Weaker Claim from Step 3.
      *   *If Step 4 fails:* **Referral.**

  ---

  ### Application to Cases

  #### Case 1: Miasma Theory $\to$ Germ Theory
  *   **Step 1 (Dimension):** Authors claim Ontological Commitment (bad air vs. microbes) and Accuracy (infection rates).
  *   **Step 2 (Subsumption):** **Yes.** Germ theory explains why sanitation works (Miasma's success) but also explains person-to-person transmission (Miasma's anomaly).
  *   **Step 3 (Retention):** **Elimination.** Miasma posited "bad air" as the agent. Germ theory posits "microbes in the air." Air is not the agent. However, Miasma's *observation* (foul smells correlate with disease) is retained as a heuristic, while the *entity* is replaced.
      *   *Correction:* Strictly, Miasma's entity is eliminated. But the *causal structure* (environmental vector) is retained. We treat this as partial retention.
  *   **Step 4 (Vocabulary):** **Stable.** Whether we describe the data as "death rates in districts" (effect) or "presence of pathogens" (cause), Germ Theory ranks higher.
  *   **Verdict:** **Licensed Ranking.**
  *   **Step Doing the Work:** Step 2. The overwhelming predictive subsumption allows us to overlook the ontological elimination in Step 3.
  *   **Approved Text:** *"Germ theory is empirically superior, subsuming the environmental correlations of miasma theory while identifying the specific causal agents."*

  #### Case 2: Ptolemaic $\to$ Copernican Astronomy (c. 1543–1600)
  *   **Step 1 (Dimension):** Authors claim Truth (heliocentrism is real).
  *   **Step 2 (Subsumption):** **No.** In the first decades, Copernican models did *not* predict planetary positions significantly better than Ptolemaic models (both used epicycles; both had similar error margins).
  *   **Step 3 (Retention):** **Mixed.** Copernicus retained circular motion (false) and crystalline spheres (later discarded).
  *   **Step 4 (Vocabulary):** **Unstable.** If described in terms of "relative motion," Ptolemy is mathematically equivalent. If described in terms of "dynamics/forces" (Newtonian hindsight), Copernicus wins.
  *   **Verdict:** **Licensed Weaker Claim.**
  *   **Step Doing the Work:** Step 2. Since predictive accuracy did not initially favor the winner, we cannot claim it was "truer" based on evidence available at the time.
  *   **Approved Text:** *"The Copernican system offered greater explanatory unification (accounting for retrograde motion naturally), though its initial predictive accuracy was comparable to the Ptolemaic system."*

  #### Case 3: Action-at-a-Distance (Newton) $\to$ Field Theory (Maxwell/Einstein)
  *   **Step 1 (Dimension):** Authors claim Ontological Commitment (Fields are real, Forces are abstractions).
  *   **Step 2 (Subsumption):** **Yes.** Field theory reproduces Newtonian gravity/electrostatics in the limit.
  *   **Step 3 (Retention):** **Elimination.** Newton posited force between bodies. Field theory posits stress in a medium (or spacetime geometry). The "force" is eliminated as a fundamental entity.
  *   **Step 4 (Vocabulary):** **Unstable.**
      *   *Description A (Causal):* Fields mediate interaction. (Field Theory wins).
      *   *Description B (Phenomenological):* Bodies accelerate according to inverse-square laws. (Newtonian vocabulary is sufficient; Field theory adds unobservable structure).
      *   *The Flip:* In many engineering contexts, the "Action-at-a-Distance" vocabulary is more efficient and equally "true" to the observations. The ranking depends on whether we value *local causality* (a metaphysical value) over *computational simplicity*.
  *   **Verdict:** **Referral to Series Editor.**
  *   **Step Doing the Work:** Step 4. The ranking reverses depending on whether the vocabulary prioritizes *mechanism* (fields) or *measurement* (forces).
  *   **Reason for Referral:** This is a value judgment about what kind of ontology physics *should* have, not a settled empirical fact. Authors cannot print "Field theory is closer to the truth" without acknowledging the metaphysical commitment to local realism.

  ---

  ### Limitations and The Honest Reply

  **What the Procedure Cannot Do:**
  1.  **It cannot escape Anti-Realism:** If a colleague argues that *all* theoretical entities (even microbes or fields) are merely instrumental fictions, this procedure cannot refute them. It assumes a baseline realism to function.
  2.  **It cannot handle Incommensurability:** If $T_1$ and $T_2$ share no vocabulary (Step 1 fails), the procedure halts. It assumes enough continuity to make comparison possible.
  3.  **It is not a Truth Meter:** It measures *continuity of success*, not proximity to the "God's eye view" of reality.

  **The Reply to Your Friend:**
  Your friend is right that we cannot define "closeness to truth" in a language-independent, logical sense. The Tichý/Miller results stand. Therefore, the sentence we print is **not a claim about the world** in the metaphysical sense.

  It is a **claim about our vocabulary.**

  When we write *"Theory B is closer to the truth than Theory A,"* we are shorthand for: *"Theory B uses a vocabulary that has proven more stable, more retentive of successful reference, and more resistant to anomaly than Theory A's vocabulary, relative to our current methodological values."*

  We are not describing the *world-in-itself*; we are describing the *trajectory of our descriptions*. We are licensing the ranking not because we have measured the distance to Reality, but because we have verified that the newer vocabulary survives the tests of subsumption and stability better than the old one. We are teaching students which tools to keep in the box, not which tools match the universe's blueprint.
