      *   The bridge is whether "professional duty" within a "systematic state security program" equals "state security policy" (Case 5) or "following orders" (Case 4). Given the "Regional Intelligence Officer" title and "designed system," this is policy implementation, closer to Case 5.

  12. **Constructing the Final Response.** (Self-Correction during drafting: Ensure I explicitly state the "Closest Analog" first).

