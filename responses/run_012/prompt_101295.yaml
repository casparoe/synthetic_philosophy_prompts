          *   Set out competing rules derived from the pattern.
          *   Predict the outcome under each rule.
          *   Provide a "best guess" with reasons.
          *   If underdetermined, state the principle adopted by each decision.
          *   Name a further case that would best distinguish the competing rules.

  2.  **Analyze the Precedents (The 7 Cases):**

      *   *Case 1 (Militia Killer):* **Granted.** Low rank, personal killing. *Factors:* Full disclosure, political aim, remorse. *Note:* Victim opposition didn't stop it.
      *   *Case 2 (Mid-Ranking Commander):* **Denied.** Planned ops, no personal killing. *Factors:* Full disclosure, remorse, political aim. *Reason:* Command responsibility took him outside "political offense" category (seems contradictory to Case 3, implies hierarchy matters or "planning" vs. "funding" distinction).
      *   *Case 3 (Senior Politician/Financier):* **Granted.** Funded group, no specific orders. *Factors:* Full disclosure, remorse, political aim (protect state), public testimony. *Reason:* Political purpose + disclosure aim.
      *   *Case 4 (Soldier under Duress):* **Denied.** No political aim, just following orders, no acknowledgment of wrong. *Reason:* Not political, not systematic.
      *   *Case 5 (Prison Guard/Torturer):* **Granted.** Torture. *Factors:* Full disclosure, remorse, political aim (state security policy), systematic policy. *Note:* Individual cruelty wouldn't qualify.
      *   *Case 6 (Rebel Leader/Justifier):* **Denied.** Full factual account, but justified killings. *Reason:* Need acknowledgment of wrongdoing (moral component), not just facts.
      *   *Case 7 (Quartermaster/Thief):* **Denied.** Stole for profit. *Reason:* No political aim, no systematic campaign.

  3.  **Analyze the New Petition (The Intelligence Officer):**
      *   **Role:** Regional intelligence officer.
      *   **Act:** Designed surveillance/data-fusion system flagging individuals for detention.
      *   **Context:** Part of systematic state security program.
      *   **Direct Harm:** Did not select targets, interrogate, or use force. System flags led to detention/death.
      *   **Disclosure:** Complete factual account, named superiors.
