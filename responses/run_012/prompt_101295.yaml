      *   The Case 2 denial (Commander) is the biggest risk. Why was the commander denied? "Command responsibility placed him outside the political-offense category." This suggests high-level architects are liable. However, Case 3 (Financier) was granted. The distinction might be *operational command* (Case 2) vs. *structural support* (Case 3 & New Case).
      *   *Verdict:* Lean towards **Grant**, following Case 5. The Commission prioritizes exposing the *system* (which this officer can do) over punishing the *technocrats*.

  8.  **Addressing Underdetermination & Principles:**
      *   If the precedents are messy (Case 2 vs Case 3 vs Case 5), the decision adopts a principle.
      *   *If Grant:* Adopts principle that "Technocratic complicity in state systems is amnestied to reveal the architecture of repression."
      *   *If Deny:* Adopts principle that "Architects of repression bear greater responsibility than executors; professional duty is not a political defense."

  9.  **Identifying the Distinguishing Case:**
      *   Need a case that separates "Professional Duty/State Policy" from "Political Aim" or "Operational Command" from "System Design."
      *   *Ideal Case:* A bureaucrat who processed paperwork for deportations/killings claiming "administrative duty" vs. a politician who ordered them for "ideological reasons."
      *   *Better:* A case involving a **legal advisor or judge** who legitimized the detentions. Did they claim political aim or professional duty? Were they granted amnesty? This would clarify if "professionalizing repression" counts as a political offense.

