answer: |-
  Good evening, everyone. Thank you for coming, and thank you especially to those of you who aren't members—partners, parents, friends—who have tolerated the claim that Tuesday nights are best spent in a back room arguing about the probability of human extinction. I know the food is the main draw for some of you, so I'll keep this brief.

  As many of you know, this year we spent most of our time reading through the literature on longtermism. We looked at the 'Hinge of History' hypothesis: the idea that we might be living at the precise moment where the trajectory of civilisation is most up for grabs.

  Now, giving a closing speech on this topic is a bit of a trap. If I stand here and tell you that we are the most important generation in history, I offend our patron, who has spent a lifetime studying Aristotle and knows that hubris is usually followed by a fall. He's right to be suspicious. The metaphysics are shaky, and the confidence some of these authors display is often unearned.

  On the other hand, if I tell you that it's all nonsense and nothing matters, I let down the members who have spent months grappling with these arguments, and I certainly don't give those of you leaving university much of a send-off.

  So, I want to be honest about where we landed.

  The strong version of the theory—that this is *the* decisive century, a window that opens now and shuts forever—requires a certainty about the shape of history that I don't think we possess. History doesn't usually come with signposts. And my friend who calls this 'secular providence' has a point. I grew up with a grandmother who was a Methodist lay preacher; she believed God had a plan for us. Sometimes I wonder if we've just swapped the sermon for a spreadsheet, replacing divine will with expected value calculations.

  But here is what I think remains, even if we strip away the grandiosity.

  Even if we aren't certain we're at the hinge, the *possibility* that we are changes how we ought to act. If there is even a non-zero chance that our actions today have massive downstream consequences, then 'ordinary decency' stops being just about how we treat the person in front of us. It becomes about how we treat the people who aren't here yet.

  To the members: we haven't solved the problem. We don't know if the hinge is real. But we have practiced the habit of taking the future seriously. That is a rare skill.

  To the families wondering why your daughters and sons spend their evenings like this: they aren't trying to play god. They are trying to ensure that there *is* a future for gods, or humans, or whatever comes next, to inhabit. They are asking what we owe to people who don't exist yet. That is not a fad; that is stewardship.

  So, I am not going to tell you that you are the chosen generation. I am not going to tell you that you will save the world. The probability is too low, and the claim is too big.

  But I will say this: if we are wrong, and the future is long and vast, then acting with caution and care costs us very little but gains them everything. And if we are wrong, and history is just a cycle of rise and fall, then acting with decency is still the only dignified way to live.

  The spreadsheet might not add up to salvation. But it does add up to a reason to be kind, to be careful, and to keep thinking.

  So, if you would please raise your glasses.

  To the future—uncertain, fragile, and worth protecting. And to the society: thank you for letting me serve.
