answer: |-
  When testing Virginia Woolf's *To the Lighthouse* against the structural claim found in Keynes's reflections on the good life—specifically the separation between intrinsic goods, defined as certain states of mind, and the instrumental material and social conditions that enable them—the novel does not merely illustrate the theory but exposes its fault lines. Keynes posits a future where the economic problem is solved, allowing the apparatus of production to recede so that the arts of life, such as love, beauty, and truth, can flourish in leisure. Woolf, writing from within a class that had already solved the basic economic problem of subsistence, shows that this separation is illusory. In the Ramsay household, the "states of mind" Keynes values are not the natural fruit of abundance but are actively manufactured through exhausting, invisible labor that cannot be dismissed as merely instrumental. The novel suggests that the conditions of the good life are not a scaffold that can be removed once the building is complete; they are the mortar that holds the building together, and without them, the structure collapses.

  Mrs. Ramsay serves as the primary site where this Keynesian separation breaks down. She is the architect of the novel's most significant moments of being: the cohesion of the dinner party, the comfort of her children, the reassurance of her husband. These are precisely the kinds of experiences Keynes lists as intrinsic goods—the enjoyment of love, the company of friends, the appreciation of beauty. However, Woolf meticulously details the work required to produce them. The dinner party does not happen because the guests are wealthy and at leisure; it happens because Mrs. Ramsay manages egos, soothes tensions, and wills a moment of unity out of disparate elements. This is labor, yet it is not the economic labor Keynes assumes will be automated or minimized. It is emotional and social labor, deeply embedded in gender and class hierarchies. If the production of the good life requires this kind of self-effacing work, then the "instrumental" conditions cannot be taken for granted. Keynes's model assumes that once material needs are met, the good life follows; Woolf shows that even with material security, the good life requires a specific kind of human sacrifice. Mrs. Ramsay's exhaustion undermines the idea that the enabling conditions are separate from the goods themselves; the labor is internal to the experience of the good. To remove the labor is to remove the moment.

  Mr. Ramsay presents a different challenge to the Keynesian list of goods. He is a philosopher dedicated to the pursuit of truth, an intellectual state Keynes would categorize as an ultimate good. Yet Woolf portrays his pursuit as entangled with vanity, insecurity, and a demand for sympathy that borders on cruelty. His mind does not operate in a vacuum of leisure; it operates in a social economy that requires his wife to prop it up. When he demands sympathy, staging his intellectual failure as a personal tragedy, he reveals that the "pursuit of truth" is not a pure state of mind but a relational dynamic that can consume others. This complicates Keynes's assumption that intellectual states are inherently valuable regardless of their social cost. Woolf suggests that a state of mind cannot be judged in isolation from the character that holds it and the relationships that sustain it. If the pursuit of truth makes a man unbearable to his children and dependent on his wife's emotional depletion, is it still an intrinsic good? The novel implies that Keynes's list is too coarse, failing to distinguish between intellectual activities that enrich life and those that merely gratify the ego under the guise of high culture. The instrumental conditions here are not just money or servants, but the emotional availability of others, which Mr. Ramsay treats as a resource to be drawn upon rather than a reciprocal good.

  The middle section, "Time Passes," addresses the fragility of civilization that Keynes acknowledged in his later memoir but hoped economics might stabilize. Here, the house decays, the servants die, and the war kills the Ramsay children. Keynes worried that civilization was thin and precarious; Woolf confirms this but pushes further by showing that the moments of value are not cancelled by their fragility, yet they are impossible without the temporary stability that fragility threatens. The decay of the house is not just a background event; it is the erasure of the conditions that made Mrs. Ramsay's moments possible. Without the social order, the dinner party is impossible; without the people, the love is memory. However, Woolf does not succumb to nihilism. Lily Briscoe's final vision suggests that the value of the moment survives in art, even if the material conditions vanish. Yet this survival comes at the cost of acknowledging the loss. Keynes hoped that abundance would secure the conditions for the good life; Woolf shows that even with abundance, mortality and time undermine security. The novel argues that the goods of life are valuable precisely because they are not permanent, but this means they cannot be secured by economic planning alone. The "economic problem" might be solved, but the human problems of loss, entropy, and the cost of maintaining order remain.

  Ultimately, *To the Lighthouse* resists the clean Keynesian division between the ends of life and the means of living. Woolf demonstrates that the means—the labor of care, the negotiation of hierarchy, the management of ego—are woven into the ends. The "states of mind" Keynes prizes are not flowers that bloom once the garden is fenced; they are the act of gardening itself, fraught with effort and vulnerability. The novel contributes to the philosophical question Keynes raises by suggesting that a life of leisure and abundance would not automatically yield the good life because the good life is not a state of consumption but a practice of creation and maintenance. If the conditions that produce these goods are inseparable from the labor and mortality Keynes wanted to set aside, then the economic problem is not merely a precursor to the good life but a permanent feature of it. Woolf leaves us with the unsettling possibility that there is no "after" economics, only different ways of organizing the labor required to make meaning bearable.

