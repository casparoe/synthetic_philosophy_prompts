answer: |-
  The Frege-Geach problem is not merely a technical glitch for expressivism; it is an ontological gravity well. For decades, non-cognitivists have attempted to build enough thrust to escape it, moving from simple emotivism ("Boo lying!") to sophisticated plan-expressivism. Your friend's "Proposal-ism" represents the latest iteration of this thrust. It attempts to bypass the problem by shifting the semantic category from *expression of feeling* to *proposal of norm*. On this view, "Lying is wrong" means "Let's treat lying as settled." The claim is that this dissolves the Frege-Geach tension because conditionals simply propose conditional commitments, governed by a practical logic of plans rather than a truth-functional logic of facts.

  This is a clever maneuver, but it does not dodge the bullet. It merely changes the caliber of the ammunition fired at it. Proposal-ism does not solve the Frege-Geach problem; it relocates the pressure from the semantics of attitude to the semantics of speech acts, where the structural tensions remain identical. When stress-tested against complex embeddings, Proposal-ism reveals that it can only maintain coherence by adopting the very realist machinery it sought to replace. Expressivism is not dead, but it is no longer the lean, anti-metaphysical alternative it claimed to be. It is **alive only with a big pile of epicycles**.

  To see why Proposal-ism fails to clear the bar, we must look at its handling of validity. The core of Frege-Geach is that moral arguments appear valid in the same way mathematical arguments are valid. If "Lying is wrong" and "If lying is wrong, then stealing is wrong" are both proposals, the inference to "Stealing is wrong" must be valid. Proposal-ism argues this is a matter of practical consistency: if you propose a plan, and propose a conditional link to another plan, you are practically committed to the second plan.

  But this conflates *psychological consistency* with *logical validity*. Logical validity is truth-preservative; it holds regardless of the agent's will. Practical consistency is will-dependent. If I propose "Let's eat" and "If we eat, let's pay," I am committed to "Let's pay." But if I am mistaken about the menu (a factual error), the logic holds. If I am mistaken about the morality, Proposal-ism says I am inconsistent, not false. The problem is that moral disagreement feels like a clash of truth-claims, not just a clash of wills. If you propose "Let's ban lying" and I propose "Let's not," Proposal-ism says we are incompatible. But it cannot explain why we are *contradicting* each other rather than just having different desires. To explain contradiction, the proposal must have content that can be negated. Once you admit the content can be negated independently of the proposal force, you have reintroduced a proposition. You have smuggled in a truth-apt core to ground the logic, which undermines the claim that the sentence is *just* a proposal.

  The view collapses further when we stress-test it against embeddings that Proposal-ism usually ignores. Consider the modal embedding: "It is probably wrong to lie." On Proposal-ism, what is being proposed here? You cannot propose "probably." A proposal is inherently binary: you either put the norm on the table or you don't. To handle this, the Proposal-ist must argue that the speaker is expressing uncertainty about whether to propose the norm. But this changes the meaning of the moral claim. "It is probably wrong" is not a hesitation to propose; it is a claim about the status of the norm itself. To save the theory, the Proposal-ist must construct a logic of "probabilistic commitment." This is the first epicycle: a specialized logic that mimics probability theory but applies to "plans" rather than "worlds." It works, but only by mirroring the structure of the realist logic it denies.

  The explanatory embedding is more damaging. Consider: "He is guilty *because* lying is wrong." In this context, the wrongness of lying is doing explanatory work. It is the *reason* for the guilt. Proposals do not explain facts; facts explain facts. If "Lying is wrong" is merely a proposal to treat lying as settled, it cannot ontologically ground someone's guilt. A proposal is an event in a conversation; guilt is a status of an agent. For the Proposal-ist to make sense of this, they must claim the "because" is also practical, not explanatory. They must argue that we are not explaining the guilt, but justifying a reaction to it. But this is revisionary to the point of distortion. When we say "He is guilty because it was wrong," we mean the wrongness made him guilty. If Proposal-ism insists this is just a way of talking about our reactive attitudes, it fails to capture the semantic depth of the sentence. To fix this, they must treat norms as if they have causal or explanatory power. This is the second epicycle: treating proposals as if they were facts for the purpose of explanation.

  Finally, consider nominalizations and psychological contexts: "The wrongness of lying is obvious" or "Her belief that lying is wrong." These constructions reify "wrongness" into an object of cognition. "Her belief that..." requires a proposition as the object of the belief. If "Lying is wrong" is a proposal, what is the content of her belief? Is it a belief that a proposal was made? No, she believes the moral claim itself. Is it a belief that we should propose it? That leads to an infinite regress (a belief about a proposal about a proposal). The only way to make sense of "belief that lying is wrong" within Proposal-ism is to admit that moral sentences *can* function as propositions when embedded in psychological contexts. But if they function as propositions there, and the theory claims they are proposals in assertion, we are back to the original Frege-Geach charge: the meaning shifts depending on the context. To avoid this, the Proposal-ist must say the sentence is *always* a proposition-like object that *functions* as a proposal. But a proposition-like object that functions as a proposal is indistinguishable from a normative fact.

  This leads to the final verdict. Expressivism, including Proposal-ism, set out to offer a metaphysically lightweight alternative to moral realism. It wanted to say moral sentences are different in kind from descriptive sentences. The Frege-Geach problem proved that for moral sentences to function in language (in logic, explanation, and belief), they must behave *exactly* like descriptive sentences.

  Proposal-ism attempts to bridge this gap by building a "practical logic" that mirrors truth-conditional logic. It constructs "plan-truths," "normative consistency," and "higher-order proposals." In doing so, it successfully saves the phenomena—it explains why moral arguments work. But the cost is that the resulting theory posits a realm of normative standards that are objective enough to be embedded, stable enough to be believed, and robust enough to explain facts. This is no longer anti-realism. It is realism in all but name. The "epicycles" are not minor adjustments; they are structural reinforcements that turn the lean expressivist framework into a bulky quasi-realist duplicate of the view it opposed.

  Therefore, Expressivism is **alive only with a big pile of epicycles**. It survives not by solving the Frege-Geach problem on its own terms, but by expanding its machinery until it can mimic realism perfectly. Proposal-ism does not dodge the problem; it absorbs the impact by becoming what it sought to destroy. The view lives, but it lives as a zombie: walking and talking like realism, driven by the animating spirit of non-cognitivism, but devoid of the ontological simplicity that gave it life in the first place.
