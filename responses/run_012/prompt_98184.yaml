  **DIRECTORATE OF STATUTORY CONTINUITY**
  **MANUAL OF OPERATIONAL PROCEDURE 4.4-B**
  **SUBJECT: VALIDITY ASSESSMENT OF PRE-TRANSITION ENACTMENTS**

  **1.0 PURPOSE AND SCOPE**
  1.1 Following the dissolution of the Karstian Union, the Republic of Vellavia must determine which prior statutes retain binding force. This Manual establishes the Continuity Assessment Matrix (CAM). Caseworkers shall not inquire into the moral merit of a statute except as encoded within the CAM scoring metrics. The question is validity, not virtue.

  **2.0 DEFINITIONS**
  2.1 **Rule of Recognition:** The criteria accepted by current officials for identifying valid law within the Republic. Note: The Karstian Union's Rule of Recognition (decrees of the General Secretary) is superseded. Validity is now judged by Republic standards applied retroactively to the enactment process.
  2.2 **Open Texture:** The area of linguistic uncertainty surrounding a statute's core meaning. Penumbra cases require Level 2 Review.
  2.3 **Systemic Congruence:** The degree to which official action matched declared rules during the Karstian period.

  **3.0 THE CONTINUITY ASSESSMENT MATRIX (CAM)**
  3.1 Caseworkers must complete Form DSC-12 for each statute. The form consists of three tiers. Failure at any tier renders the statute *void ab initio*.

  3.2 **Tier 1: Formal Provenance.**
  Was the statute enacted according to the Karstian Union's own procedural rules at the time? If the Karstian regime ignored its own constitution to enact the measure, it fails Tier 1. This preserves the principle of legality even for the predecessor regime.

  3.3 **Tier 2: Procedural Morality.**
  Evaluate the statute against the Eight Desiderata of Promulgation. Deduct points for: secrecy, retroactivity, contradiction, impossibility of compliance, or frequent revision. A score below 40/100 indicates the enactment was not a functioning legal system but a series of arbitrary commands. Such commands lack the inner architecture of law and confer no obligation.

  3.4 **Tier 3: Substantive Congruence Threshold.**
  If a statute passes Tiers 1 and 2 but mandates actions fundamentally incompatible with human agency (e.g., liability for involuntary status), apply the Substantive Congruence Threshold. This metric is not derived from statutory text but is inherent to the concept of law itself. If the statute denies the status of legal subjecthood to a class of persons, it is classified as "Non-Law." Caseworkers must not calculate this score; they must recognize it.

  **4.0 WORKED CASES**

  **4.1 Case Reference: Vellavia-Trans-004 (The Unpublished Speed Limit)**
  *Statute:* Karstian Decree 99-B established a 20km/h limit on arterial roads.
  *Content:* Neutral regulatory measure.
  *Assessment:* Decree 99-B was circulated only to regional police chiefs and never published in the Official Gazette. Citizens could not know the rule.
  *Tier 2 Score:* 10/100 (Failure of Promulgation).
  *Determination:* Void. The lack of publicity prevents the rule from guiding conduct. A secret rule is not law, regardless of its benign content.

  **4.2 Case Reference: Vellavia-Trans-019 (The Informer Protocol)**
  *Statute:* Karstian Law on Defense of State Speech (1988).
  *Context:* Private Citizen A denounced Neighbor B for "defeatist remarks" under this statute. Neighbor B was executed.
  *Content:* Vague definition of "defeatist." Applied retroactively to remarks made prior to enactment.
  *Assessment:* The statute fails Tier 2 due to vagueness (Open Texture abused) and retroactivity. It also fails Tier 3 as it punished private speech unrelated to official duty.
  *Determination:* Void. Since the statute was not law due to procedural failures, Citizen A cannot claim legal justification for the denunciation. Liability for homicide remains valid under Republic common law. The gap between the old Rule of Recognition and the new is bridged by declaring the old instrument null.

  **4.3 Case Reference: Vellavia-Trans-088 (The Hereditary Liability Decree)**
  *Statute:* Karstian Decree on Family Contamination (1992).
  *Content:* Mandated imprisonment of spouses and children of persons convicted of treason, regardless of individual conduct.
  *Assessment:* Statute was properly promulgated and clear. It passes Tier 1 and Tier 2.
  *Tier 3 Analysis:* The statute treats persons as objects of causality rather than agents of conduct. It violates the Substantive Congruence Threshold.
  *Determination:* Void. Caseworkers should note: This determination cannot be justified by reference to prior positive rules. It rests on the assertion that a rule so unjust ceases to be law. This threshold is not calculable on Form DSC-12. If unsure, escalate to the Director.

  **5.0 APPEALS AND FINALITY**
  5.1 Decisions marked "Void" are final unless appealed to the High Council within 30 days.
  5.2 In cases where the Substantive Congruence Threshold is invoked, no appeal lies on the question of validity. The Directorate does not negotiate the definition of law with those who would weaponize it.

  **6.0 EFFECTIVE DATE**
  6.1 This Manual is effective immediately. All pending continuity reviews must be recalibrated using the CAM.

  ***

  **Author's Note**
  This piece presupposes a Fullerian position, specifically that extreme injustice and procedural failures negate legal validity rather than merely creating bad law. It takes liberties by bureaucratizing natural law principles, suggesting the "inner morality of law" can be operationalized via a checklist, which Fuller himself might reject as too rigid. A specialist might contest the handling of the Informer Case, as Hart argued that retroactive punishment is honest, whereas this Manual disguises retroactivity by claiming the old law was never valid. The satire lands on the side that legal systems cannot remain neutral when confronted with regimes that weaponize legality itself.
