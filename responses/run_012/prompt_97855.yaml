answer: |-
  ### The Principle: The Asymmetric Normative Agency Principle

  Your verdicts are best captured by a principle that treats intentionality not as a purely psychological fact (what was in your head), but as a **normative attribution** (what we hold you responsible for) that operates differently for harm than for help.

  **The Principle:**
  An agent brings about an outcome *on purpose* if and only if:
  1.  **Volition:** The action producing the outcome was voluntary (not coerced).
  2.  **Foresight:** The agent foresaw the outcome as a certain or near-certain consequence of that action.
  3.  **Valence & Norms:**
      *   **If the outcome is HARMFUL:** It counts as intentional *unless* the action is protected by a specific normative license (e.g., accepted medical practice). Mere moral justification (lesser evil) does not exempt it.
      *   **If the outcome is BENEFICIAL:** It counts as intentional *only if* the agent actively desired or sought it. Foresight alone is insufficient.

  ---

  ### Clause Mapping: Which Case Forces Which Rule?

  1.  **Volition Clause** ("The action must be voluntary")
      *   **Forced by Case 4 (The Conscript).**
      *   *Reasoning:* The conscript foresaw the harm and caused it, yet you say it was not on purpose. The only distinguishing factor is the threat of execution, which removes voluntary agency. This clause prevents the principle from labeling all coerced actions as intentional.

  2.  **Foresight Clause** ("The outcome must be foreseen as certain")
      *   **Forced by Case 5 (The Speeding Driver).**
      *   *Reasoning:* While this case also tests valence, it specifically highlights that reckless risk-taking is not the same as intending a specific outcome. The driver did not foresee the mugging prevention; he merely took a risk. This ensures that accidental byproducts of reckless behavior do not count as intentional achievements.

  3.  **Valence Asymmetry Clause** ("Harm requires only foresight; Help requires desire")
      *   **Forced by Case 1 (Pharma Exec Harm) vs. Case 2 (Pharma Exec Help).**
      *   *Reasoning:* This is the classic "Knobe Effect." In both cases, the executive is indifferent and foresees the side effect. Your verdict splits based on whether the side effect is bad (intentional) or good (not intentional). This forces the principle to treat moral valence as a constituent of intentionality, not just a reaction to it.

  4.  **Normative License Exception** ("Harm is not intentional if normatively licensed")
      *   **Forced by Case 6 (The Physician).**
      *   *Reasoning:* This is the critical counterweight to Case 1. Both agents cause death as a foreseen side effect. The difference is that the physician acts within "accepted practice." This clause captures your intuition that social/normative authorization can decouple foresight from intentionality for harmful outcomes.

  5.  **Justification Irrelevance Clause** ("Moral justification does not negate intentionality")
      *   **Forced by Case 3 (The Engineer).**
      *   *Reasoning:* The engineer is morally justified (lesser evil) and actively tried to avoid the harm. If justification negated intentionality, this would be "not on purpose." Your verdict ("on purpose") forces the principle to distinguish between *being excused* (justification) and *not doing it* (lack of intention). Certainty of harm trumps the moral excuse regarding the label of "purpose."

  ---

  ### Prediction: The Autonomous Trading Algorithm

  **Case:** An autonomous trading algorithm foreseeably triggers a market crash. No individual intended the crash. Designers were merely careless (negligent), not criminal.

  **Prediction:** **Not on purpose.**

  **Application of Principle:**
  *   **Volition:** The algorithm has no agency, and the designers did not voluntarily trigger the crash (they were careless).
  *   **Foresight:** The designers were "merely careless." This implies they *should have* foreseen the crash, but did not actually foresee it as a certain consequence (otherwise it would likely be criminal recklessness or intent). The principle requires actual foresight, not just foreseeability.
  *   **Valence:** Even though the outcome is harmful, the lack of actual foresight and voluntary action fails the first two clauses.

  **Verdict:** This is a case of **negligence**, not intentional action. The principle cleanly categorizes this as a failure of the Epistemic (Foresight) and Volition conditions.

  ---

  ### The Outlier: Which Verdict Cannot Be Accommodated?

  **The Outlier:** **Case 7 (The Corporation).**

  **Why it fails:**
  The Asymmetric Normative Agency Principle relies on the psychological states of an *agent* (Volition, Foresight, Desire). Case 7 explicitly states that "no individual inside the firm intends this."
  *   If you treat the Corporation as a metaphorical agent, the principle predicts **Intentional** (Policy was voluntary, harm was foreseen by the entity, no normative license).
  *   If you treat the Corporation as a collection of individuals (which your description suggests), the principle predicts **Not Intentional** (No single mind satisfies the Foresight/Desire condition).

  Your verdict is "shaky" precisely because you are oscillating between these two views of agency. The principle, as stated for cases 1–6, assumes individual psychological architecture. It cannot smoothly accommodate collective agency without adding a complex new module for "distributed intentionality."

  **Advice:**
  **Give up the verdict.**
  You noted that you "can be argued out of it." This is the correct instinct. To keep Case 7 as "Intentional," you must complicate your principle to include theories of collective mind, which creates friction with the clear individual psychology driving Cases 1–6.
  *   **Reason:** Cases 1–6 are about *moral psychology* (how we judge minds). Case 7 is about *sociology* (how we judge structures).
  *   **Recommendation:** Treat Case 7 as a distinct category of "Structural Responsibility." Admit that "on purpose" is the wrong label for the corporation; "systemically produced" is more accurate. Dropping this verdict preserves the elegance and explanatory power of the principle for the human cases that matter most for blame and praise.
