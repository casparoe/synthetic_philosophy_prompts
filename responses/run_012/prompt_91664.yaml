answer: |-
  - "The cold open"
  If manipulation is the test for causation, is causation literally absent in domains where manipulation is physically impossible, like astrophysics or cosmology?
  *Why:* Forces him to commit immediately on whether causation is ontological or merely epistemic/pragmatic.

  - "The main sequence"
  1. Take late preemption: Assassin A shoots, B stands ready. A hits, victim dies. Counterfactuals say A didn't cause death (victim would have died anyway); interventionism says A did. Which verdict is right, and why does your account survive the 'switching' objection?
  *Follow-up:* If he says interventionism wins: "Doesn't that require assuming the intervention removes B's backup mechanism without triggering it? Isn't that begging the question about what counts as a valid intervention?"

  2. You say causation requires possible interventions. But I can't intervene on the sun's mass or the past. Are you saying there's no causation there, or that 'possible' means 'metaphysically possible' despite physical law?
  *Follow-up:* If he says metaphysical: "If the intervention violates physical law, how do we evaluate the counterfactual outcome without guessing? Doesn't that make the theory vacuous?"

  3. An intervention is defined as a change that doesn't affect other variables except through the target. Isn't 'except through' a causal clause? Are you defining causation using causation?
  *Follow-up:* If he says it's a primitive notion: "If intervention is primitive, haven't you just shifted the mystery from 'cause' to 'intervention' without solving it?"

  4. Statistically, conditioning on a collider opens a path; intervening closes it. But how do I know I'm intervening and not just conditioning on a weird subset of data without prior causal knowledge?
  *Follow-up:* If he says 'randomized trial': "Randomization assumes the assignment mechanism is causal. Aren't you assuming causality to prove causality?"

  5. I kill my plant by not watering it. That's an omission. What is the manipulation there? Are we intervening on non-events?
  *Follow-up:* If he says omissions are causes: "Then isn't every non-action a cause of every effect it didn't prevent? How do you bound the causal field?"

  6. Is the causal structure out there in the world, or is it relative to the set of variables we choose to model?
  *Follow-up:* If relative: "Then isn't causation just a feature of our models, not reality? Why call it metaphysics?"

  - "The curveballs"
  1. Two scientists model a circuit. One uses Voltage, one uses Current. Their structural equations differ. One says V causes I, the other says I causes V. Is causation relative to the variable set?
  *Follow-up:* If he says yes: "Doesn't that undermine the idea that causation guides policy? If the cause depends on my model, how do I know what to intervene on?"

  2. ML researchers edit neuron activations to change output and call it causal discovery. Is that a valid intervention, or just simulating one?
  *Follow-up:* If he says valid: "Doesn't that imply the network's weights are causal mechanisms? Or are you just endorsing any structural equation model as causal?"

  - "The closer"
  What empirical finding or philosophical argument would force you to abandon interventionism? Give me a specific case where you'd say 'okay, I was wrong'.

  - "Where he'll dodge"
  *   **The "Idealization" Move:** He'll claim impossible interventions are theoretical ideals, not practical requirements. *Say back:* "Then your theory describes models, not the world."
  *   **The "Type vs. Token" Shift:** He'll argue preemption cases confuse specific events with general types. *Say back:* "Decision theory needs token causation for responsibility."
  *   **The "Pragmatic Retreat":** He'll say causation is just about useful prediction, not truth. *Say back:* "Then stop claiming you've solved the metaphysics of cause."
  *   **The "Invariant Relationship" Pivot:** He'll switch from manipulation to invariance under testing. *Say back:* "Invariance is just robust correlation without the manipulation story."
  *   **The "Contextual" Defense:** He'll argue the variable set is fixed by context. *Say back:* "Context doesn't change the physics of the circuit."
