prompt: |-
  ok so I've been running this tiny podcast for like two years now, mostly me rambling at guests about causality and decision theory, and next episode I finally got a philosopher to agree to come on who defends the interventionist/manipulationist account of causation -- the Woodward-ish line where C causes E just in case there's a possible intervention on C that would change E, causation is basically invariance under intervention, structural equations, all of that. He's sharp and he's heard every lazy objection, so I don't want to hand him softballs he can swat away. I've read enough of the usual blogs (LessWrong, the Pearl fans, the people who think interventions are just counterfactuals in a trench coat) to know where the fights are, but I want to actually press him.

  Give me the interview questions. I want roughly 9 or 10, and for each one a follow-up that's keyed to the answer he's most likely to give -- like, if he says X, hit him with Y. Please don't ask him to just explain the view, I've got that. Specific things I need covered:

  - where the interventionist verdict and the counterfactual-dependence verdict come apart -- cases where the interventionist says cause but plain counterfactual dependence fails, or the other way round (preemption, overdetermination, whatever you think is sharpest), and which one he thinks is tracking the real thing.
  - the old "you can't intervene on the mass of the sun / on someone's eye color / on the past" objection, and whether making 'possible intervention' merely metaphysical rather than practical is a rescue or a cop-out.
  - the difference between intervening on a variable and just conditioning on it, and the worry that 'intervention' is itself defined in causal terms so the whole thing goes in a circle.

  Plus two things I want to spring on him that he probably hasn't prepped for:

  1. a case where two scientists carve up the exact same system with different variable sets (one talks about the voltage across a component, the other about the current through it) and the two models give different answers about what causes what. Ask whether the account is committed to causation being relative to your choice of variables, and if so whether that's fine or fatal.
  2. the AI angle -- people now do "interventions" on trained neural nets all the time, editing an internal activation and seeing if the output changes, then calling the edited feature a cause of the output. Ask whether that's a genuine intervention in his sense or just a dressed-up counterfactual, and whether the account being usable there is a point in its favor or just shows it's too permissive.

  Then end with one closer that forces him to say what would actually change his mind.

  Format it like this, with these exact section headings in this order:

  - "The cold open" -- a single question to start on, 2-3 lines, plus one line on why I'm starting there.
  - "The main sequence" -- the 6 core questions, each a short paragraph of question + follow-up, maybe 3-4 lines each.
  - "The curveballs" -- the two I listed above, each with its own follow-up.
  - "The closer" -- one question, 2-3 lines.
  - "Where he'll dodge" -- short bullets, 4-5 of them, guessing the exact move he'll make to wriggle out of each hard one and what I should say back.

  No citations or reading lists obviously, I don't need a bibliography, just the questions. and dont pad it, keep it tight.
