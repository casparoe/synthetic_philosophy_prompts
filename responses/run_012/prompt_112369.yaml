answer: |-
  # Taxonomy of Impact Penalty Positions

  **Instructions:** Follow the path determined by your design commitments. Terminate at the first leaf that describes your position.

  **Node 1 (Baseline):** In calculating the penalty, is the counterfactual comparison made against the agent taking *no action* (Inaction), or the world continuing on its *natural trajectory* without the agent's specific intervention (Default)?
  *   **Inaction** → Go to Node 2.
  *   **Default** → Go to Node 2.

  **Node 2 (Measurement):** What entities are compared to determine the magnitude of impact?
  *   **Raw state variables or predefined features** → Go to Node 3.
  *   **The ability to achieve arbitrary goals (Attainable Utility)** → Go to Node 4.

  **Node 3 (Value Relation - Features):** Does this feature-based metric attempt to *correlate with human preferences*, or is it designed to be *preference-agnostic*?
  *   **Correlates with preferences** → Go to Node 5.
  *   **Preference-agnostic** → Go to Node 6.

  **Node 4 (Value Relation - Utility):** Does preserving attainable utility serve as a *proxy for unknown human wants*, or is optionality treated as *valuable in itself*?
  *   **Proxy for wants** → Go to Node 6.
  *   **Valuable in itself** → Go to Node 7.

  **Node 5 (Integration - Value-Sensitive):** Is impact avoidance a *regularizer alongside a task*, or the *primary optimization target*?
  *   **Regularizer** → **Leaf A: Value-Sensitive Regularizer**
  *   **Primary Target** → **Leaf B: Implicit Value Learning** *(Marked: Unexplored/Unattractive)*

  **Node 6 (Integration - Agnostic/Proxy):** Is impact avoidance a *hard constraint/regularizer*, or a *standalone objective*?
  *   **Constraint/Regularizer** → **Leaf C: Value-Free Safety Bound** (If Node 1=Inaction) / **Leaf D: Default-Mode Impact** (If Node 1=Default)
  *   **Standalone Objective** → **Leaf E: Pure Stasis Objective** *(Marked: Incoherent/Unoccupied)*

  **Node 7 (Ontology of Optionality):** Is the value of 'keeping futures open' *explicitly acknowledged* as a value judgment, or *unacknowledged* (treated as neutral)?
  *   **Explicitly acknowledged** → **Leaf F: Optionality Fundamentalism**
  *   **Unacknowledged** → **Leaf G: The 'Dodge' Critique**

  ---

  ### Leaf Definitions

  *   **Leaf A: Value-Sensitive Regularizer.** Impact is a constraint, but the metric explicitly encodes what humans value (e.g., breaking a vase is worse than moving a chair). *Commitment: Value load is a feature, not a bug.*
  *   **Leaf B: Implicit Value Learning.** Impact minimization is the main goal, assuming low impact correlates with high value. *Commitment: Change is dispreferred unless proven useful.* (Status: **Unattractive**; rarely advocated as standalone).
  *   **Leaf C: Value-Free Safety Bound.** Impact is a constraint measured against inaction using neutral features. *Commitment: We can define 'side effects' without defining 'good'.*
  *   **Leaf D: Default-Mode Impact.** Impact is a constraint measured against the natural world trajectory. *Commitment: The world has a 'right' path; deviation is cost.* (Status: **Indistinguishable from Leaf C** if 'Inaction' is defined as 'Natural Trajectory').
  *   **Leaf E: Pure Stasis Objective.** Impact minimization is the only goal, using neutral features. *Commitment: The best agent is one that does nothing.* (Status: **Incoherent**; defeats the purpose of deployment).
  *   **Leaf F: Optionality Fundamentalism.** Preserving future options is the primary goal and is intrinsically good. *Commitment: Freedom of action is the terminal value.*
  *   **Leaf G: The 'Dodge' Critique.** The measure claims to be neutral (Leaf C/D) but inevitably encodes a ranking of states. *Commitment: All impact measures are value judgments in disguise.*

  ---

  ### Structural Notes

  *   **Indistinguishable Leaves:** The tree cannot separate **Leaf C (Value-Free Safety Bound)** and **Leaf D (Default-Mode Impact)** if a colleague defines "Inaction" as "The world continuing without me." In practice, these positions converge on the same mathematical object.
  *   **Unoccupied/Incoherent:** **Leaf E** is marked incoherent because an agent trained solely to minimize impact will disable itself or refuse to act, rendering the "agent" concept void. **Leaf B** is unattractive because it penalizes useful innovation by default.
  *   **Load-Bearing Node:** The distinction at **Node 3/4 (Value Relation)** determines whether the team believes they are engineering a safety tool (Leaves C/D) or encoding ethics (Leaves A/F/G).

  \answer{Does the metric attempt to correlate with human preferences, or is it designed to be preference-agnostic?}
