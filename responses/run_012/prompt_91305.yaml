answer: |-
  ### The Desiderata for an Account of Letter Identity

  To satisfy the dual ends of computational specification and philosophical honesty, an adequate account of letter identity must deliver on the following three requirements. Each is driven by the cases you specified, preserving the necessary distinctions between type and token, glyph and letter, and identity and style.

  **1. The Requirement of Allographic Equivalence**
  *The account must explain how distinct, systematic shapes map to a single letter identity without collapsing the distinction between style and identity.*
  *   **The Case:** The single-storey 'a' (ɑ) and the double-storey 'a' (a) are visually distinct topologies; the blackletter '𝔞' and the humanist 'a' share almost no geometric features; the 'a' of a Carolingian manuscript is historically continuous with the 'a' of a future typeface no one has yet designed.
  *   **The Constraint:** The theory cannot define the letter by a fixed set of visual features (e.g., "must have a closed counter"), or it will exclude valid allographs. Nor can it define the letter purely by historical lineage, or it cannot account for the independent reinvention of similar forms. It must posit a structural or functional equivalence that allows the *glyph* (the shape) to vary while the *letter* (the abstract type) remains constant. It must distinguish the *style* (the rule governing the variation) from the *identity* (the invariant category).

  **2. The Requirement of Token Resilience**
  *The account must distinguish between a degraded token of a type and a token of a different type, without conflating membership with typicality.*
  *   **The Case:** A smudged, rotated, or partly occluded 'a' is identified at once by a skilled reader; a child's badly drawn 'a' is still an 'a'; but a circle drawn in the 'a' slot is not an 'a' (it is an 'o' or a mistake).
  *   **The Constraint:** The theory must separate *membership* (binary: is it or isn't it?) from *typicality* (gradient: is it a good example?). A feature-list theory fails here because a sufficiently degraded 'a' loses features. A prototype theory fails here because it conflates "good example" with "member." The account must explain how a token can be a *bad* instance of 'a' without ceasing to be an instance of 'a', while simultaneously explaining why a "perfect" circle is not a member of 'a' at all. It must account for the shape *as perceived* (which tolerates noise) distinct from the shape *as generated* (which may have failed).

  **3. The Requirement of Substrate Neutrality**
  *The account must define letter identity independently of any specific sensory modality.*
  *   **The Case:** The letter 'a' exists in Braille (tactile bumps), Morse code (temporal pulses), fingerspelling (kinematic posture), and visual print. The 'a' of Morse code shares no visual shape with the 'a' of print, yet they are tokens of the same letter.
  *   **The Constraint:** The theory cannot rely essentially on visual geometry. If the definition of 'a' requires a "closed counter" or a "vertical stem," it excludes Braille and Morse. The account must locate the identity of the letter in something abstractable from the medium—typically its functional role within a system of contrasts (its position in the alphabet, its phonological or semantic value). This forces the distinction between the *letter* (the abstract type) and the *grapheme* (the modality-specific unit).

  ***

  ### Incompatibilities and Prejudices

  **Which Requirements Cannot Be Jointly Satisfied**
  There is a genuine tension between **Allographic Equivalence** and **Token Resilience** when coupled with the demand for a **Decision Procedure** (the implicit goal of the "list a program could be held to").

  *   **Allographic Equivalence** demands openness: it acknowledges that letterforms drift across centuries and that new styles (future typefaces) are possible. This implies the boundary of the letter is open-textured and historically contingent.
  *   **Token Resilience** demands closure: to distinguish a badly drawn 'a' from an 'o', the system must draw a line somewhere. It requires a boundary that says "this much deformation is acceptable, this much is not."
  *   **The Conflict:** You cannot have a fixed decision procedure (for the program) that respects the open-endedness of historical drift (for the philosophy). If you fix the boundary to satisfy the program, you violate Allographic Equivalence by ruling out future or radical historical variants. If you leave the boundary open to satisfy the philosophy, you violate Token Resilience by failing to distinguish the badly drawn 'a' from the impostor 'o' in a specific instance. A program requires a cutoff; the phenomenon resists one.

  **Genuine Desiderata vs. Camp Prejudices**
  *   **Genuine Desiderata:** The distinctions themselves are non-negotiable. The separation of **Type and Token** is required to discuss multiple instances of one letter. The separation of **Membership and Typicality** is required to explain error and degradation. The separation of **Identity and Style** is required to explain the Letter Spirit task itself. These are facts of the phenomenon.
  *   **Prejudices:**
      *   **The Demand for a Decision Procedure:** This is a prejudice of the computational camp. The subject (letter identity) does not owe us a finite algorithm that decides every case. Human readers operate with context-dependent heuristics, not fixed boundaries. Insisting on a programmatic criterion imposes a false precision on a fuzzy concept.
      *   **Mind-Independence:** The demand that letters exist without readers is a Platonic prejudice. Letters are functional tools of communication; their identity is partly constituted by the capacity of a community to recognize them. A shape no one can identify as 'a' is not an 'a', regardless of its "essence."

  **The Single Exclusionary Requirement**
  The requirement that excludes the most popular answers is **Substrate Neutrality**.

  *   **What it Excludes:** It excludes the vast majority of **Visual Feature Theories** and **Morphological Accounts**.
  *   **Why:** Most theories of letterforms (in typography, psychology, and OCR) define letters by their visual properties: strokes, counters, terminals, and topology. They treat the letter as essentially a visual object. Substrate Neutrality demonstrates that visual shape is contingent, not essential. If 'a' can be a dot-dash sequence or a bump pattern, then no visual description can capture the identity of the letter. This forces the theory away from perception and geometry toward structure and function, invalidating any account that begins with "a letter is a shape..."
