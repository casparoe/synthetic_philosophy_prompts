answer: |-
  This is an excellent approach. Treating epistemology like an engineering spec cuts through a lot of historical fog. You are right to be suspicious: the field is littered with theories that solve one problem by creating a worse one elsewhere.

  Here is the specification for an adequate theory of inductive inference, broken down by requirements, constraints, and incompatibilities, with a clear map of what is settled versus what is still a battleground.

  ### Part 1: Functional Requirements (The Test Cases)
  *What the theory must successfully process.*

  | Requirement | The Case | Why it's a Requirement | Status |
  | :--- | :--- | :--- | :--- |
  | **The Humean Gap** | Why expect the future to resemble the past? | If the theory cannot bridge the gap between "is" and "will be" without circularity, it offers no justification for science, only a description of habit. | **Non-Negotiable** |
  | **The Grue Problem** | Why project "green" instead of "grue"? | A theory must distinguish between *projectible* predicates (natural kinds) and *gerrymandered* ones. If it treats them equally, it cannot explain why science picks specific variables. | **Non-Negotiable** |
  | **Sample Size Sensitivity** | Why does $N=1000$ > $N=1$? | A theory that treats a single observation as equiprobable to a replicated dataset fails to model scientific reliability or statistical power. | **Non-Negotiable** |
  | **The Raven Paradox** | Does a white shoe confirm "All ravens are black"? | A theory of confirmation must handle logical equivalence. If $(A \rightarrow B)$ is equivalent to $(\neg B \rightarrow \neg A)$, the theory must explain why confirming the latter feels irrelevant. | **Camp Preference** (Some dissolve this, some solve it) |
  | **Old Evidence** | Can known data confirm a new theory? | (e.g., Mercury's perihelion confirming GR). A strict logical account often says no (probability = 1). A viable theory must explain how existing data supports new hypotheses. | **Non-Negotiable** (for history of science) |

  ### Part 2: Architectural Constraints (The Distinctions)
  *Structural boundaries the theory cannot cross or collapse.*

  | Requirement | The Distinction | Why it's a Requirement | Status |
  | :--- | :--- | :--- | :--- |
  | **Normative vs. Descriptive** | How we *should* infer vs. how we *do*. | Cognitive science describes the brain; epistemology justifies the output. Collapsing these commits the naturalistic fallacy (just because we think it doesn't mean it's right). | **Non-Negotiable** |
  | **Context of Discovery vs. Justification** | Generating a hypothesis vs. testing it. | A theory of induction is about testing/confirmation. If it requires a "logic of discovery" to function, it overreaches. | **Non-Negotiable** |
  | **Syntax vs. Semantics** | Formal rules vs. Meaning/Content. | Goodman showed syntax alone fails (Grue). The theory must account for the *content* of predicates, not just their logical form. | **Non-Negotiable** |
  | **Subjective vs. Objective** | Personal belief vs. World structure. | The theory must declare if probabilities are in the mind (Bayesian degree of belief) or the world (Frequentist propensity). Collapsing them leads to confusion. | **Camp Preference** |

  ### Part 3: External Consistency (The Hard Constraints)
  *Results from math and logic the theory cannot violate.*

  | Requirement | The Constraint | Why it's a Requirement | Status |
  | :--- | :--- | :--- | :--- |
  | **No-Free-Lunch (NFL)** | No inference rule beats random guessing across *all* possible distributions. | This is a mathematical theorem (Wolpert et al.). Any theory claiming a "universal" inductive logic without assumptions is mathematically false. | **Non-Negotiable (Math)** |
  | **Non-Circularity** | Cannot assume induction works to prove induction works. | Basic logical validity. If the justification relies on the success of past induction, it is question-begging. | **Non-Negotiable (Logic)** |
  | **Computational Tractability** | Inference must be calculable. | A theory that requires infinite computing power to update beliefs is useless for agents (human or machine) in time. | **Camp Preference** (Ideal vs. Bounded Rationality) |

  ---

  ### Part 4: The Incompatibility Matrix (Where It Breaks)

  You asked if some of these can't hold at once. **Your hunch is correct.** There is a trilemma here. You can satisfy any two of the following three, but not all three:

  1.  **Universal Justification:** Induction is objectively rational for everyone, everywhere.
  2.  **Non-Circularity:** The proof doesn't assume the conclusion.
  3.  **No-Free-Lunch Compliance:** The theory acknowledges that inference requires prior assumptions about the world.

  **The Conflict:**
  *   **NFL Theorems** dictate that to do better than chance, you must assume the world has structure (e.g., smoothness, simplicity, symmetry).
  *   **Non-Circularity** dictates you cannot prove the world has that structure using induction (because that uses the tool you are trying to justify).
  *   **Universal Justification** demands you prove the world has that structure objectively.

  **The "Killer" Requirement:**
  The requirement that does the most damage to popular candidates is **Non-Circularity combined with Universal Justification.**

  *   **Classical Logic (Carnap):** Failed because it couldn't solve Grue without smuggling in semantic assumptions (violating pure syntax).
  *   **Frequentism:** Fails to justify single-case probabilities and struggles with "Old Evidence."
  *   **Subjective Bayesianism:** Solves the math (probability axioms) but sacrifices **Objective Justification**. It says, "If you have priors, here is how to update." It does not say, "Here is why your priors are correct."
  *   **Objective Bayesianism:** Tries to fix the priors (using Maximum Entropy, etc.) but often smuggles in assumptions about the "natural" state of ignorance, which critics argue is circular or metaphysical.

  **Verdict:** The demand for a **non-circular, objective justification of the inductive bias** is where the theories die. Most modern philosophers accept Hume was right: you cannot deductively justify induction.

  ---

  ### Part 5: Consensus Map (Settled vs. Contested)

  Do not let anyone tell you the following are settled. Here is the actual state of play among experts.

  #### **Actually Settled (High Consensus)**
  1.  **Hume was right about deduction:** There is no deductive proof that the future will resemble the past. Any theory claiming otherwise is ignored.
  2.  **Goodman was right about syntax:** Purely syntactic theories of confirmation (looking only at logical form) are dead. Content matters.
  3.  **NFL Theorems hold:** You cannot have inference without inductive bias (assumptions about the data generating process).
  4.  **Probability is the language:** Whether Bayesian or Frequentist, the calculus of probability is the accepted framework for modeling uncertainty. Qualitative logic alone is insufficient.

  #### **Genuinely Contested (The Battleground)**
  1.  **The Source of Priors:**
      *   *Subjectivists:* Priors are personal; rationality is just coherence (Dutch Book argument).
      *   *Objectivists:* Priors are constrained by logic or symmetry (Principle of Indifference).
      *   *Reliabilists:* Priors are justified if the process that generated them is reliable (externalism).
  2.  **The Dissolution vs. Solution Strategy:**
      *   *Solution:* We need to find the correct logic of induction (e.g., Solomonoff Induction).
      *   *Dissolution:* The "problem" is a linguistic confusion. We should stop asking for justification and look at *vindication* (Reichenbach: "If any method works, induction will") or *pragmatics* (Strawson: "Induction is what 'reasonable' means").
  3.  **The Role of Causality:**
      *   Some (Pearl, Woodward) argue induction is impossible without causal models.
      *   Others argue causal models are just the *output* of induction, not the prerequisite.

  ### Summary for the Bench Scientist

  If you are looking for a theory that tells you **"Here is the algorithm that guarantees truth from data,"** it does not exist. The NFL theorems forbid it.

  If you are looking for a theory that tells you **"Here is the consistent framework for updating confidence given data, provided you accept certain assumptions about the world,"** that exists. It is **Bayesian Inference**.

  **The Trade-off:**
  To get a working theory, you must surrender the demand for **Universal, Assumption-Free Justification.**
  *   **Accept:** Induction requires assumptions (priors/bias).
  *   **Accept:** Those assumptions cannot be proven by induction itself.
  *   **Accept:** The "justification" is pragmatic (it works for agents in *this* universe, not *all possible* universes).

  **The "Spec" Verdict:**
  An adequate theory today is not a *justification* of induction, but a *management* of inductive risk. It specifies how to update beliefs coherently given data, while explicitly stating the inductive biases (priors/causal assumptions) required to make the inference valid. Any theory claiming to remove the need for those biases is selling magic.
