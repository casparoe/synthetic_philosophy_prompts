prompt: |-
  So I got into a stupid two-hour fight with my old flatmate last night about iterated elimination of dominated strategies — he's doing an econ masters, I'm TAing the second-year game theory course at the same place, which did not help — and his position was that if a game is dominance solvable then that's basically the whole answer, rational players play the surviving profile, done, whereas my position was that the weak-dominance version is a swindle because what survives depends on what you happen to delete first, and that the strict version only gets to be a real solution concept because of a technicality about mixed strategies that we never actually explain to the students. We got nowhere and I have to run the problem session on this on Thursday, so I'd like you to help me plan how to teach it rather then tell me who won.

  The audience: about thirty second-years in a 75-minute problem session, whiteboard (a small one, so I have to erase as I go), they've done expected utility, Nash in pure and mixed strategies, a bit of backward induction, and they can grind out a mixed equilibrium in a 2x2 in their sleep. They have not seen rationalizability, best-response correspondences drawn properly, or anything epistemic. What I want from you is the dependency order: what has to be in place before a sentence like "this pure strategy is strictly dominated by a mixed strategy" even parses for them (I'm guessing the whole idea of mixing as a belief about the opponent, rather than as literal coin-flipping, has to land first, and I don't know if that's a five-minute thing or the whole session), and at what point the order-dependence point can be made so it lands as a real problem rather than as trivia. Also the one example that should carry everything. My candidate is a three-strategy row player where I only draw his payoffs: against Left, Top pays 4, Middle pays 1, Bottom pays 0; against Right, Top pays 0, Middle 1, Bottom 4 — so Middle is strictly dominated by a 50/50 mix of Top and Bottom and by neither of them alone. Is that the right one to carry it, or does it teach the wrong thing because the mix is so obviously the equal one? Does it need a second player with actual payoffs to feel like a game? And I was going to open with the guess-two-thirds-of-the-average thing that everyone opens with, but I'm worried it teaches "levels of reasoning" rather than "dominance" and eats fifteen minutes — talk me out of it or into it.

  Then the misconceptions, with the point in the sequence where I should head each one off. The ones I'm expecting are: "a strategy is dominated only if some other single strategy beats it," so they miss mixed domination entirely; "deleting a strategy can't change what's deletable next"; "a dominated strategy is one that nobody would ever actually play, so eliminating it is a claim about behaviour"; "a weakly dominated strategy is never a best response," which I think half of them believe and which is just false; and something vague about surviving meaning you're part of an equilibrium. Tell me which of those actually show up, in what order, and which ones I'm imagining. And I want one question I can ask in the last five minutes that tells me whether the mixed-domination idea landed, not a quiz — something they can get wrong in an interesting way. Plus what I should openly refuse to cover at this level and say so out loud (I'm guessing the epistemic story about common knowledge of rationality, refinements, and the actual proof that the strict version is order-independent, but tell me what else is a trap). Please no reading list, they won't do it. And at the end, tell me which bits of my flatmate's position survive, so I don't teach something false out of spite.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** TA for a 2nd-year Game Theory course. Econ background (implied).
      *   **Conflict:** Had a 2-hour fight with an Econ Masters flatmate about Iterated Elimination of Dominated Strategies (IEDS).
      *   **Flatmate's View:** Dominance solvable = solution. Rational players play the survivor.
      *   **User's View:** Weak dominance is order-dependent (swindle). Strict dominance relies on mixed strategies (technicality usually hidden).
      *   **Task:** Plan a 75-minute problem session for ~30 students. *Not* to settle the argument, but to teach the material effectively.
      *   **Audience:** 2nd years. Know EU, Nash (pure/mixed), Backward Induction. Can solve 2x2 mixed. *Don't* know Rationalizability, Best-Response correspondences, Epistemic Game Theory.
      *   **Constraints:** Small whiteboard (erase as you go). No reading list.
      *   **Specific Requests:**
          *   Dependency order (prerequisites for "strictly dominated by mixed").
          *   Timing of the order-dependence point (weak dominance).
          *   Evaluation of the user's candidate example (3-strategy row player).
          *   Decision on "Guess 2/3 of Average" opener.
          *   Misconception management (which ones are real, when to address).
          *   Final check question (non-quiz, diagnostic).
          *   What to explicitly exclude/refuse to cover.
          *   Validation of the flatmate's position (what's actually true).

  2.  **Deconstruct the Core Concepts:**
      *   **Strict Dominance (SD):** $u(s_i, s_{-i}) > u(s'_i, s_{-i})$ for all $s_{-i}$.
      *   **Mixed Strategy Domination:** A pure strategy can be dominated by a *mixture* of other pure strategies, even if not dominated by any single pure strategy.
      *   **Weak Dominance (WD):** $u(s_i, s_{-i}) \ge u(s'_i, s_{-i})$ for all $s_{-i}$, with strict inequality for at least one.
      *   **IEDS (Strict):** Order independent. Survivors are Rationalizable. If one profile survives, it's the unique NE.
      *   **IEDS (Weak):** Order dependent. Can eliminate NE.
      *   **Epistemic Foundation:** Common Knowledge of Rationality (CKR). (Too advanced for this session, but the *logic* needs to hold).

  3.  **Address Specific User Questions:**

      *   **Dependency Order:** To understand "dominated by mixed," students need to view mixed strategies not just as "what I play" but as "what creates expected utility." They need to understand linearity of expected utility. If $u(A) > u(C)$ and $u(B) > u(C)$, then $0.5u(A) + 0.5u(B) > u(C)$. This is usually intuitive if they know EU, but the leap is that the *mixture* is the dominating object, not a pure strategy.
      *   **The Candidate Example:** Row player: T(4,0), M(1,1), B(0,4).
          *   Against L: T=4, M=1, B=0.
          *   Against R: T=0, M=1, B=4.
          *   Is M dominated? By T? No (0 < 1 against R). By B? No (0 < 1 against L).
          *   By 0.5T + 0.5B? Against L: 0.5(4)+0.5(0) = 2 > 1. Against R: 0.5(0)+0.5(4) = 2 > 1. Yes.
          *   *Critique:* It's a classic example. It works perfectly for showing mixed domination. Does the 50/50 make it too obvious? Maybe, but simplicity is good for a whiteboard. It needs column payoffs to be a "game," otherwise it's just a decision theory problem. To make it a game, Column needs to have incentives. If Column is indifferent, it's boring. If Column has a dominant strategy, it simplifies too much. Let's suggest fleshing it out to a 3x2 or 3x3 so elimination matters.
      *   **Guess 2/3 of Average:** *Talk me out of it.* It's a dominance solvable game, BUT it relies on infinite iterated reasoning about *beliefs*, not just mechanical elimination. It consumes time. It confuses "dominance" with "level-k thinking." Better to stick to matrix mechanics for a problem session.
      *   **Misconceptions:**
          1.  "Dominated only by pure": Very common. Needs early correction.
          2.  "Deleting doesn't change deletability": True for Strict, False for Weak. This is the crux of the user's fight. Needs to be the climax of the session.
          3.  "Dominated = Never played": Mostly true for Strict (if CKR), false for Weak (NE can involve weakly dominated strategies).
          4.  "Surviving = Equilibrium": False. Survivors are Rationalizable. NE is a subset.
      *   **Final Question:** Needs to test mixed domination or order dependence.
      *   **Refusals:** Epistemic foundations, formal proofs of order independence, Trembling Hand Perfection (too much for 2nd year problem session).
      *   **Flatmate's Position:** He's right about Strict IEDS leading to the unique NE if the game is dominance solvable. He's wrong (or imprecise) about Weak IEDS being "the answer."

  4.  **Drafting the Plan (Iterative Process):**

      *   *Opening:* Skip Guess 2/3. Start with the definition.
      *   *Concept 1: Mixed Domination.* Use the user's example. Make it a full game.
      *   *Concept 2: Strict IEDS.* Show it works.
      *   *Concept 3: Weak Dominance & Order Dependence.* This is the punchline. Show how changing the order changes the result.
      *   *Timing:* 75 mins.
          *   0-10: Setup & Defs.
          *   10-30: Mixed Domination (The User's Example).
          *   30-50: Strict IEDS process.
          *   50-65: Weak Dominance trap.
          *   65-75: Wrap up & Diagnostic.

      *   *Refining the Example:* The user's 3x1 (against L/R) is good. Let's make it a 3x2 game.
          Row: T, M, B. Col: L, R.
          Row Payoffs: T(4,0), M(1,1), B(0,4).
          Col Payoffs: Need to make sure Col doesn't just delete everything immediately. Let's make Col have no dominant strategy initially, or a simple one. If Col has no dominant strategy, Row can't delete based on Col's rationality yet.
          Actually, for IEDS, we need *both* sides to delete.
          Let's construct a specific matrix for the Weak Dominance section. The "Order Dependence" example needs to be distinct from the "Mixed Domination" example to avoid confusion.
          *Idea:* Use the Mixed example first to establish "Mixed can dominate Pure." Then use a *different* simple 2x2 or 3x3 for the Weak Dominance order-dependence demonstration. Mixing the two issues might confuse students.
          *Wait, better idea:* Keep it tight. One main example that evolves? No, cognitive load. Two examples.
          Example 1 (Mixed Dom): The User's 3x2.
          Example 2 (Weak/Order): A standard 3x3 where Weak elimination removes a NE depending on order.

      *   *Addressing the "Flatmate" issue:* The TA needs to remain neutral but accurate. The flatmate is right that Strict IEDS is robust. The TA is right that Weak IEDS is fragile. The teaching must reflect this distinction without turning into a philosophy seminar.

      *   *Diagnostic Question:* "Here is a strategy. It is not dominated by any *pure* strategy. Is it safe from elimination?" (Answer: No, check mixed). OR "We eliminated X then Y. Could we have eliminated Y then X?" (Answer: Depends on Strict vs Weak).
      *   Let's go with the Mixed one for the diagnostic, as it's more technical and often missed.

  5.  **Refining the Misconceptions:**
      *   "Dominated only by pure": Address immediately during Example 1.
      *   "Deleting doesn't change deletability": Address during Example 2 (Weak).
      *   "Surviving = NE": Address at the end.
      *   "Dominated = Never played": Nuance this. Strict = Never (under CKR). Weak = Maybe (NE can use them).

  6.  **Structuring the Response:**
      *   **Verdict on the Fight:** Briefly validate both, set the tone (teach the math, not the feud).
      *   **The Opener:** Talk out of Guess 2/3.
      *   **Dependency Order:** Map out the conceptual ladder.
      *   **The Example:** Critique and refine the 3-strategy row player.
      *   **Lesson Flow:** Minute-by-minute breakdown.
      *   **Misconceptions:** When to kill them.
      *   **The Diagnostic:** The specific question.
      *   **What to Refuse:** The "Do Not Touch" list.
      *   **Flatmate Validation:** What he got right.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "mixed as belief" vs "mixed as action" issue?
      *   *Correction:* Yes, need to emphasize that domination by mixed doesn't require the opponent to mix, it requires the *player* to be able to mix to generate a higher expected payoff against *any* opponent pure strategy. Wait, definition check: Strategy $s_i$ is dominated by $\sigma_i$ if $u(\sigma_i, s_{-i}) > u(s_i, s_{-i})$ for all $s_{-i}$. The opponent plays pure strategies in the definition check. The *player* uses the mix. I need to make sure the TA explains this clearly. It's not about beliefs about the opponent; it's about the convexity of the payoff space.
      *   *Check:* Whiteboard space.
      *   *Correction:* Advise to keep matrices small. 3x2 is max.
      *   *Check:* Flatmate's point.
      *   *Correction:* Ensure I explicitly state that Strict IEDS *is* order independent. The TA's worry about "technicality about mixed strategies" is actually a feature, not a bug. It makes Strict IEDS robust. The TA's worry about Weak IEDS is the valid one.

  8.  **Final Polish:** Tone should be supportive, professional, slightly weary of the flatmate fight but focused on the students. (Matches the user's voice).

  *(Self-Correction on the Diagnostic Question)*: The user wants to know if "mixed-domination idea landed."
  Question: "I have a strategy X. It loses to A if opponent plays L, and loses to B if opponent plays R. A and B are my other strategies. Is X dominated?"
  Answer: Not necessarily by A or B. But maybe by a mix of A and B.
  This tests the specific insight.

  *(Self-Correction on Weak Dominance)*: The user's fight was about Weak Dominance order dependence. This *must* be in the session. It's the most dangerous trap for students.

  Okay, ready to write.
answer: |-
  Here is the battle plan for Thursday. It is designed to keep you on the whiteboard, keep the students awake, and keep your flatmate's ghost out of the room while ensuring you don't accidentally teach falsehoods.

  ### 1. The Opener: Talk yourself out of "Guess 2/3"
  **Do not use Guess 2/3 of the Average.**
  *   **Why:** It is a dominance-solvable game, but the dominance is hidden behind layers of beliefs ("I think they think I think..."). It teaches *epistemic recursion*, not *matrix dominance*. It eats 15 minutes discussing human psychology rather than 15 minutes grinding through payoff inequalities.
  *   **Replace with:** A direct definition check. Write "Strict Dominance" and "Weak Dominance" on the board. Ask: "What is the mathematical difference?" (Strict: $>$ everywhere. Weak: $\ge$ everywhere, $>$ somewhere). Get that on the board in 5 minutes.

  ### 2. Dependency Order: What must land first?
  You are correct that the "mixed as action" vs "mixed as belief" distinction is the bottleneck. For IEDS, students usually treat mixed strategies as "what I randomize to keep the opponent indifferent." That is for finding Nash Equilibria. For Dominance, the concept is different.

  **The Conceptual Ladder:**
  1.  **Linearity of Expected Utility:** They must accept that if $u(T, L) > u(M, L)$ and $u(T, R) > u(M, R)$, then $u(T, \sigma_C) > u(M, \sigma_C)$. (This they know).
  2.  **Convexity of Payoffs:** The leap is that a *mixture of my own strategies* creates a new payoff vector that is the weighted average of the pure payoff vectors.
  3.  **The Dominating Object:** A pure strategy can be dominated by a **mixture of other pure strategies**, even if no single pure strategy dominates it.
  4.  **The Opponent's Role:** To check if $\sigma_i$ dominates $s_i$, we only check against the opponent's **pure** strategies. (Crucial technicality: If it beats all pure opponent strategies, it beats all mixed opponent strategies by linearity).

  **Time cost:** This is not a five-minute thing if you want it to stick. It is 20 minutes. You cannot rush the "dominated by mixed" concept, or the rest of the session collapses.

  ### 3. The Example: Critique and Refinement
  Your candidate example (Row: T(4,0), M(1,1), B(0,4)) is the standard textbook example for mixed dominance. **Keep it.**
  *   **The 50/50 worry:** Don't worry that the mix is equal weights. The point is existence, not optimization. If you make the weights 0.4/0.6, you force them to do arithmetic instead of seeing the logic. 50/50 makes the average (2,2) obvious against M's (1,1).
  *   **Does it need Column payoffs?** **Yes.** If Column has no payoffs, this is Decision Theory, not Game Theory. Students need to see that Column is also deleting rows/columns.
  *   **Refinement:** Make it a 3x2 game.
      *   Row: T, M, B. Col: L, R.
      *   Row Payoffs: As you described (M dominated by 0.5T+0.5B).
      *   Col Payoffs: Make L dominant for Column.
      *   **Why:** This allows you to run a full IEDS.
          1.  Col deletes R (Strictly Dominant).
          2.  Now Row faces only L. T(4), M(1), B(0). T is dominant.
          3.  Outcome (T, L).
      *   **The Trap:** If you don't give Column payoffs, students won't practice the *Iterated* part.

  **Wait, you need a second example for Weak Dominance.**
  Do not try to teach Mixed Domination and Weak Dominance Order-Dependence using the same matrix. It confuses the *source* of the problem (Mixed vs. Weak).
  *   **Example 1 (Minutes 10-35):** The 3x2 above. Teaches Mixed Domination + Strict IEDS.
  *   **Example 2 (Minutes 35-60):** A 3x3 where Weak Dominance creates order dependence.
      *   Construct a game where deleting a weakly dominated strategy removes a Nash Equilibrium, and where the order matters.
      *   *Classic:* A coordination game with a "safe" option.
      *   Row: Top, Bottom. Col: Left, Right.
      *   Add a third strategy "Middle" that is weakly dominated but part of a NE.
      *   Actually, simpler: Use a 3x3 where Strategy A is weakly dominated by B, and C is weakly dominated by D, but deleting A makes C no longer dominated.
      *   *Recommendation:* Use a standard "Order Dependence" matrix from Osborne or similar. Don't invent one on the fly; you'll mess up the numbers.
      *   *Key takeaway:* Strict IEDS = Order Independent. Weak IEDS = Order Dependent.

  ### 4. Lesson Flow (75 Minutes)

  **00-05: Definitions**
  *   Strict vs. Weak. Write the inequalities.
  *   **Misconception Kill #1:** "Dominated means there's another *pure* strategy that is better."
  *   **Correction:** "Dominated means there is *any* available strategy (pure or mixed) that is better."

  **05-30: Mixed Domination (Your Example)**
  *   Draw the 3x2. Fill Row payoffs.
  *   Ask: "Is Middle dominated by Top?" (No). "By Bottom?" (No).
  *   Ask: "Is Middle dominated by *anything*?"
  *   Walk through the 50/50 mix calculation on the board. Show $2 > 1$.
  *   **Crucial Sentence:** "We do not need the opponent to mix. We check if my mix beats their pure strategies."
  *   Fill Col payoffs (make R dominated). Run the IEDS.
  *   **Result:** Unique survivor.

  **30-35: Break / Reset Board**
  *   Erase everything. Visual clutter is the enemy here.

  **35-55: The Weak Dominance Trap**
  *   Draw a new matrix (3x3).
  *   Identify a weakly dominated strategy.
  *   **Demonstration:** Delete it. Show that a *different* strategy is now strictly dominated that wasn't before.
  *   **Reverse:** Go back to start. Delete the *other* one first. Show the first one is no longer dominated.
  *   **Result:** Two different survivors depending on order.
  *   **Lesson:** "Weak IEDS is not a solution concept. It is a heuristic. Strict IEDS is a solution concept."

  **55-65: Equilibrium vs. Survivors**
  *   **Misconception Kill #2:** "If a strategy survives IEDS, it must be part of a Nash Equilibrium."
  *   **Truth:** If the game is Strictly Dominance Solvable (one profile survives), yes, that is the unique NE. If multiple strategies survive, they are *Rationalizable*, not necessarily NE.
  *   **Misconception Kill #3:** "Weakly dominated strategies are never played in NE."
  *   **Truth:** False. They can be. (Show a quick 2x2 coordination game where one NE uses a weakly dominated strategy).

  **65-75: The Diagnostic Question**
  *   See below.

  ### 5. Misconception Management
  Here is the order in which they will appear, and when to kill them:

  1.  **"Dominated only by pure strategies."**
      *   *When:* Minute 15, during your 3x2 example.
      *   *Fix:* Force them to calculate the mixed payoff.
  2.  **"Deleting a strategy can't change what's deletable next."**
      *   *When:* Minute 45, during the Weak Dominance example.
      *   *Fix:* Show the order dependence explicitly. This validates your flatmate's worry (for weak) and your worry (for strict technicalities).
  3.  **"Dominated = Never Played."**
      *   *When:* Minute 60.
      *   *Fix:* Distinguish between *theoretical rationality* (CKR) and *observed behavior*. Strictly dominated: Never (if CKR). Weakly dominated: Sometimes (NE).
  4.  **"Surviving = Equilibrium."**
      *   *When:* Minute 65.
      *   *Fix:* Rationalizability vs. Nash. (Keep this high-level, don't draw best-response correspondences).

  ### 6. The Diagnostic Question (Last 5 Minutes)
  Do not ask a quiz. Ask a "Check the Logic" question. Write this on the board:

  > "I have a strategy $S$.
  > 1. There is no pure strategy that strictly dominates $S$.
  > 2. There is no pure strategy that weakly dominates $S$.
  > 3. I eliminate $S$ during Iterated Elimination.
  >
  > **Question:** What *must* be true for this elimination to be valid?"

  **Desired Answer:** "$S$ must be strictly dominated by a **mixed** strategy, OR $S$ was weakly dominated but we are accepting the risks of Weak IEDS (order dependence)."
  **What you're looking for:** If they say "It must be dominated by another pure strategy," they failed the session. If they say "It must be dominated by a mix," they got the hard part. If they say "We can't eliminate it," they missed the Weak IEDS discussion.
  **Best Answer:** "$S$ is strictly dominated by a mixed strategy." (This confirms the technical lesson).

  ### 7. What to Refuse to Cover (Say this out loud)
  Students will ask "Why?" or "What if?". Draw a line in the sand.
  1.  **"Why is Strict IEDS order independent?"**
      *   *Say:* "The proof relies on the fact that deleting a strictly dominated strategy never removes a best response to a belief over the remaining strategies. We don't have time for the proof, but you can take it as a theorem."
  2.  **"What about Common Knowledge of Rationality?"**
      *   *Say:* "That is the *epistemic foundation* for why we do this. It justifies the 'Iteration' part. We are doing the *mechanics* today. The justification is for 3rd year."
  3.  **"Is Weak IEDS useless?"**
      *   *Say:* "It's useful for narrowing the search for NE, but you cannot claim the survivor is *the* solution. That is the difference."

  ### 8. Validating Your Flatmate (So you don't teach spite)
  You need to know where he was right so you don't overcorrect into confusion.
  *   **He is Right:** If a game is **Strictly** Dominance Solvable (IEDS leads to a unique profile), that profile **is** the unique Nash Equilibrium. It is robust. It is "the answer."
  *   **He is Right:** Rational players (with CKR) will not play strictly dominated strategies, even by mixed strategies.
  *   **You are Right:** **Weak** Dominance solvability is not a robust solution concept. The survivor depends on order. A rational player *might* play a weakly dominated strategy (e.g., in a trembling-hand context or specific NE).
  *   **You are Right:** The "technicality about mixed strategies" isn't a bug; it's the reason Strict IEDS works. If we only allowed pure-strategy domination, Strict IEDS would *lose* its order-independence property in some contexts (actually, strict pure domination is also order independent, but the set of eliminable strategies is smaller). The real point is that ignoring mixed domination leaves "dominated" strategies on the board, which violates rationality.

  **Summary for the Whiteboard:**
  1.  Strict Dom (Pure or Mixed) $\rightarrow$ Order Independent $\rightarrow$ Safe to Eliminate.
  2.  Weak Dom $\rightarrow$ Order Dependent $\rightarrow$ Eliminate with Caution (can kill NE).
  3.  Mixed Domination $\rightarrow$ Check against Opponent Pure Strategies.

  Go in, teach the mechanics, leave the philosophy to the flatmate's dissertation. Good luck.
