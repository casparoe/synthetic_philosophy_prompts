answer: |-
  # Sidebar: The Harm Calculator
  **Where do you stand on the mathematics of suffering?**

  We ask you to make trade-offs constantly: speed limits save lives but cost time; tax audits prevent fraud but cause stress. But when the scales tip drastically—one person's agony versus a million people's minor annoyance—our intuition often breaks.

  Below are eight scenarios. There are no right answers, only consistent ones. For each, choose the option you genuinely believe is *less bad*. Don't overthink the philosophy; go with your gut.

  ***

  ### 1. The Baseline
  A runaway trolley is heading toward a single person who will be trapped and tortured for 50 years. You can pull a lever to divert the trolley. It will miss the victim, but the diversion mechanism will release a puff of dust into the eyes of one billion strangers. It stings for a second, then vanishes.
  *   **A.** Divert the trolley. (Save the one from torture; give a billion people a dust speck.)
  *   **B.** Do nothing. (Let the one be tortured; spare the billion the dust.)
  *   **C.** This is a false choice; the two outcomes cannot be weighed against each other.

  ### 2. The Unwitnessed
  Same as above, but the billion people are all in a deep, dreamless sleep. The dust hits their eyes, they flinch slightly in their sleep, but they never wake up, never feel the sting consciously, and find no trace of it in the morning.
  *   **A.** Divert the trolley. (The physical irritation counts, even if unfelt.)
  *   **B.** Do nothing. (If no one experiences the harm, it doesn't outweigh torture.)
  *   **C.** The scenario is incoherent; an unfelt irritation isn't a harm.

  ### 3. The Single Life
  You are a doctor. You have one patient. You must choose a treatment path.
  *   **Path A:** The patient will endure 50 years of torture.
  *   **Path B:** The patient will receive one million tiny electric shocks over 50 years. Each shock is barely noticeable, like a static zap, but they happen constantly.
  *   **A.** Choose Path B. (The sum of the zaps is better than the torture.)
  *   **B.** Choose Path A. (The intensity of the torture is worse than any number of zaps.)
  *   **C.** Refuse to choose; both options are medically unethical.

  ### 4. The Risk Lottery
  A policy will save a city from collapse.
  *   **Option A:** One specific person is selected to die immediately.
  *   **Option B:** Every person in the city (1 million people) accepts a 1-in-1-million risk of dying instantly. Statistically, one person will die, but it is random.
  *   **A.** Choose Option B. (Spreading the risk is fairer/better.)
  *   **B.** Choose Option A. (A certainty of death for one is better than imposing a death-risk on everyone.)
  *   **C.** The two options are morally distinct and cannot be traded.

  ### 5. The Threshold Flip
  Back to the trolley. This time, the diversion doesn't cause a dust speck. It causes a "stubbed toe" level of pain for one billion people. It hurts for a minute, then fades.
  *   **A.** Divert the trolley. (A billion stubbed toes are still better than 50 years of torture.)
  *   **B.** Do nothing. (A billion stubbed toes add up to something worse than torture.)
  *   **C.** The pain level is irrelevant; the category of "torture" forbids the trade.

  ### 6. The Forgotten Harm
  The billion people get the dust speck. It hurts for a second. Immediately after, a neural inhibitor erases the memory of the pain. They know intellectually it happened, but they have no sensory memory of it.
  *   **A.** Divert the trolley. (The harm happened, regardless of memory.)
  *   **B.** Do nothing. (A harm that leaves no trace on a life doesn't count.)
  *   **C.** This makes the harm purely abstract; the comparison fails.

  ### 7. The Bureaucratic Delay
  A government algorithm can optimize traffic.
  *   **Scenario A:** One person is wrongly imprisoned for 50 years (total loss: ~400,000 hours).
  *   **Scenario B:** One million people are each delayed in traffic for 25 minutes (total loss: ~400,000 hours).
  *   **A.** Accept Scenario B. (Time is time; the total loss is identical.)
  *   **B.** Accept Scenario A. (Concentrated loss is worse than distributed loss.)
  *   **C.** Time lost in traffic is not the same kind of "harm" as imprisonment.

  ### 8. The Switch Point
  If you chose to divert the trolley in Question 1 (Dust Specks), imagine we keep adding people. If you chose to let the torture happen, imagine we keep removing people.
  *   **A.** There is a specific number where the answer flips. (e.g., "At 10 trillion people, I switch.")
  *   **B.** There is no number. (e.g., "I would never switch, no matter how many people.")
  *   **C.** The question implies a precision that moral intuition doesn't possess.

  ***

  # Scoring Key: Mapping Your Moral Geometry

  Tally your answers. Don't look for a "score" out of 10; look for the *pattern* of your choices. The positions below describe the logical commitments your answers reveal.

  ### The Straight Aggregator (Mostly A's)
  **The View:** Harm is a quantity. It adds up across people, across time, and across probabilities.
  **The Logic:** You believe that $1,000,000 \times \text{small pain} > 1 \times \text{big pain}$. You likely treated the "Unwitnessed" and "Forgotten" cases as real harms because the physical event occurred, regardless of consciousness.
  **The Tension:** If you chose **A** on Question 4 (Risk), you accept that imposing a tiny chance of death on everyone is equivalent to killing one person. This is mathematically sound but often feels unjust to the individual bearing the risk.
  **Unnamed Leaf:** If you chose **A** on Q2 (Unwitnessed) but **B** on Q6 (Forgotten), you hold a rare "Memory-Dependent" view: harm requires a lasting psychological trace, not just a physical event. Few defend this explicitly, but it pops up in intuitions about privacy violations.

  ### The Threshold Guardian (Mostly B's on Q1, Q5, Q7; A on Q3)
  **The View:** There is a "floor of significance." Harms below a certain intensity (dust) do not count, no matter how many there are. Harms above the floor (torture) dominate.
  **The Logic:** You likely switched from **A** to **B** between Question 1 (Dust) and Question 5 (Stubbed Toe). You believe aggregation only works for harms that cross a threshold of noticeability.
  **The Tension:** This view struggles with the "Sorites Paradox." If one dust speck doesn't count, and adding one more speck never changes the status from "nothing" to "something," how does a billion specks suddenly become a catastrophe?
  **Incoherence Check:** If you chose **B** on Q1 (Dust doesn't count across people) but **A** on Q3 (Zaps add up within one person), you are a **Person-Affecting Theorist** (see below). If you chose **B** on both, you are a consistent Threshold Guardian.

  ### The Lexical Prioritarian (Mostly B's and C's)
  **The View:** Severe harms have "lexical priority." No amount of minor inconvenience can ever justify one instance of severe suffering.
  **The Logic:** You likely chose **B** on Q1, Q5, and Q7. You see torture as a different *category* of badness, not just a higher *volume* of badness.
  **The Tension:** This can lead to paralyzing conclusions. If a minor harm never outweighs a major one, you might be forced to prevent a single murder even if it means allowing a billion people to go slightly hungry.
  **Indistinguishable Position:** This view often looks identical to the **Category Mistake** view (below) in practice. Both refuse the trade. The difference is internal: The Prioritarian says "The math equals infinity," while the Category Mistaker says "The math is invalid."

  ### The Person-Affecting Individualist (A on Q3; B on Q1, Q4, Q7)
  **The View:** Harms add up within a single life, but they do not add up *across* lives.
  **The Logic:** You likely chose **A** on Question 3 (One person taking a million zaps is worse than torture, because it's one life accumulating burden) but **B** on Question 1 (You won't torture one person to save a billion strangers from zaps).
  **The Tension:** This view struggles with Question 4 (Risk). If harms don't aggregate across people, does risk? If you impose a 1-in-a-million death risk on a million people, have you killed someone?
  **Logical Space:** This is the most common "unlabeled" position in public discourse. People often feel it's okay to burden one person heavily if *that same person* benefits, but not okay to burden one person heavily to benefit *others*.

  ### The Category Skeptic (Mostly C's)
  **The View:** The comparison itself is a mistake.
  **The Logic:** You rejected the premise that "hours of delay" and "years of prison" or "dust" and "torture" are convertible currencies.
  **The Tension:** While philosophically robust, this view offers little guidance for policy. If we cannot compare traffic delays to imprisonment, we cannot build roads.
  **Indistinguishable Position:** As noted above, this is practically identical to the **Lexical Prioritarian** in a quiz format. To separate them, you would need to ask: "If you were forced to choose, which would you pick?" The Prioritarian picks the minor harm reluctantly; the Skeptic refuses to pick even under duress.

  ***

  # Journalist's Analysis: The Logical Traps

  **1. The "Unwitnessed" Trap (Questions 2 & 6)**
  This is where the **Straight Aggregator** often fractures. If you believe harm is purely physical (neurons firing), you must count the sleeping dust speck. If you believe harm is experiential (suffering), the sleeping speck vanishes.
  *   *Incoherent Combination:* Choosing **A** on Q2 (Unwitnessed counts) but **B** on Q6 (Forgotten doesn't count). This implies that *memory* constitutes harm more than *sensation*. While defensible (a trauma that is forgotten may not harm the self), it contradicts the idea that "pain is bad" in the moment.

  **2. The Risk/Certainty Gap (Question 4)**
  This separates the **Aggregator** from the **Contractualist**.
  *   *Aggregators* see a 1/million chance of death $\times$ 1 million people = 1 death.
  *   *Contractualists* see 1 million people *wronged* vs. 1 person *killed*.
  *   *Unnammed Leaf:* There is a position called **"Risk Absolutism"** (nobody defends it, but it falls out of the logic): Imposing *any* non-zero risk of death is impermissible, regardless of the benefit. If you chose **B** on Q4 but **A** on Q1, you might be flirting with this.

  **3. The Indistinguishable Hats**
  The **Lexical Prioritarian** and the **Category Skeptic** will score identically on this quiz. They both refuse to trade the one for the many.
  *   *Why they differ:* The Prioritarian believes the torture is *infinitely worse*. The Skeptic believes the two values are *incommensurable* (like comparing the weight of a rock to the color blue).
  *   *Why the quiz can't separate them:* Both result in the same action (saving the one). To distinguish them, you would need to ask about *compensation*. The Prioritarian might accept compensation for the many; the Skeptic would say no amount of compensation makes the trade valid.

  **4. The Empty Quadrant**
  There is a logical space for someone who believes: **"Harms aggregate across people, but not within a single life."**
  *   *The View:* A million people getting a dust speck is worse than one person getting a dust speck. But one person getting a million dust specks is *not* worse than one person getting one.
  *   *Status:* **Incoherent.** This view suggests that suffering is diluted by being spread across time within a life, but amplified by being spread across people. No one holds this view because it contradicts the basic phenomenology of endurance (we know that one million zaps on one person is unbearable). If your answers suggest this pattern, re-read Question 3.

  **5. The "Stubbed Toe" Flip (Question 5)**
  This is the most critical diagnostic.
  *   If you flipped from **A** (Dust) to **B** (Toe), you are a **Threshold Guardian**.
  *   If you stayed **A** on both, you are a **Straight Aggregator**.
  *   If you stayed **B** on both, you are a **Lexical Prioritarian**.
  *   *Note:* Many readers find they are Aggregators for Dust, but Threshold Guardians for Toes. This reveals that your intuition isn't based on a fixed rule, but on a "slope of severity" that you haven't mapped yet. That is the story of the piece.
