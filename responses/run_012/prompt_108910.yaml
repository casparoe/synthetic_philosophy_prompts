  4. Geography as Disease and Demography. Core claim: Mortality rates shaped settlement and human capital. Path: Growth, Geography=Disease, Counterfactual=Colonial. Awkward commitment: Implies some regions are inherently unfit for development.
  5. State-Capacity View. Core claim: Fiscal ability to tax and enforce drives public goods. Path: Persistence, Geography=Legibility, Unit=Nation. Awkward commitment: Must distinguish capacity from predation.
  6. Culture as Deep Cause. Core claim: Values and beliefs constrain economic behavior permanently. Path: Levels, Culture=Deep, History=Path-dependent. Awkward commitment: Cannot explain rapid cultural shifts in development.
  7. Culture as Slow Consequence. Core claim: Values adapt slowly to economic incentives. Path: Growth, Culture=Slow, Institutions=Endogenous. Awkward commitment: Hard to distinguish from institutional effects empirically.
  8. Colonial Legacy as Path Dependence. Core claim: Imperial extraction strategies locked in trajectories. Path: Persistence, Counterfactual=Colonial, History=Path-dependent. Awkward commitment: Must explain divergent outcomes under same colonizer.
  9. Multiple-Equilibria or Contingency. Core claim: History could have gone differently; luck selects outcomes. Path: Growth, History=Luck, Inference=Impossible. Awkward commitment: Offers little policy guidance for change.
  10. Deflationary View. Core claim: Nation and wealth are not natural kinds suitable for comparison. Path: Unit=Nation (rejected), Inference=Impossible. Awkward commitment: Makes the seminar's core question meaningless.
  11. Unnamed Legibility View. Core claim: Geography matters by making populations legible to tax collectors, so state capacity is proximate and terrain is ultimate. Path: Geography=Legibility, State-Capacity, Unit=Region. Awkward commitment: Requires detailed historical data on tax rolls often unavailable.
  12. Causal Skepticism. Core claim: The historical record cannot identify these causes, only constrain them. Path: Inference=Impossible, Evidence=Descriptive. Awkward commitment: Risks paralysis in policy design.

  Empty or near-empty branches

  Several combinations remain empty because they are theoretically incoherent or empirically unattractive. A view holding culture as a deep parameter while institutions are endogenous equilibria is rarely occupied; if culture is fixed, institutions usually cannot be chosen freely by actors. This branch is empty because the assumptions contradict one another regarding agency. Another empty branch combines geography as agricultural productivity with a unit of analysis focused exclusively on local political settlements. This is unattractive because agricultural zones typically span local jurisdictions, making the mismatch methodologically awkward for measurement. A third combination posits multiple equilibria but insists on strong convergence expectations across nations. This is incoherent; if multiple equilibria exist, convergence is not guaranteed without coordination. Finally, a view claiming causal inference is impossible from observational cross-sections but relying on nation-state level data for static levels is largely unexplored. Researchers usually match methods to claims to maintain credibility. These empty branches reveal where logical consistency forces scholars to abandon certain pairings. They serve as prompts to ask students why they avoid these combinations. Some combinations are merely unexplored rather than impossible, suggesting fertile ground for new theoretical work that challenges existing silos.

  Non-separable pairs and diagnostic limits

  The tree cannot separate certain pairs because their empirical predictions overlap significantly. Institutionalism versus elite-bargain views often yield identical policy prescriptions despite different ontological commitments about state origin. Distinguishing them requires data on elite negotiations rarely available historically. Geography-as-legibility versus state-capacity views are similarly tangled; if terrain determines legibility, and legibility determines capacity, the ultimate cause is disputed only by semantics regarding ultimate versus proximate causes. Culture-as-deep-cause versus culture-as-slow-consequence is perhaps the hardest separation. Both predict persistence, differing only on the speed of adaptation to shocks. Further questions about the rate of cultural change under extreme institutional shifts would be needed to pry them apart. The instrument should stop where disagreements become matters of values or evidence weight rather than classification. If two students agree on the counterfactual and the mechanism but disagree on the moral weight of colonial harm, the tree cannot sort them. Similarly, if both agree on the model but dispute the reliability of a specific historical dataset, this is an evidence dispute. The diagnostic limits mark the boundary where taxonomy yields to substantive debate. At this point, the seminar must shift from mapping beliefs to evaluating evidence quality and normative commitments.

  How a seminar leader should use it

  Administer the tree individually before the first seminar session. Ask students to trace their path silently, noting where they hesitate. Score the paths by leaf position, not by correctness. Use the empty branches as discussion prompts during the opening class, asking why no one occupies those logical spaces. Do not treat divergence in paths as error; treat it as map-making. If the group clusters in one leaf, use the non-separable pairs to force differentiation. The goal is not consensus but clarity on where disagreement lies.
