      *   *Principle:* **Aggregation is permitted only when the harm constitutes a loss of a 'metric of life' (time, health) rather than a 'transient sensation', OR when the aggregation happens within a single life.**

      *Let's refine the "Drop One" advice.*
      The user *must* drop either Intuition 1 (Specks never lose) or Intuition 2 (Seconds always win). They are structurally identical unless a qualitative distinction is made.
