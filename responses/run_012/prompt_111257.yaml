          *   *Principle:* Trivial harms to subjective experience do not aggregate across persons to justify severe harm. Trivial harms to objective life-resources *do* aggregate.
          *   *Why:* Because time is fungible and cumulative in a way irritation is not.
      *   **Test against cases:**
          *   *Concentration:* Works (Experience becomes significant if concentrated).
          *   *Sleeping Pinprick:* Tricky. If it's objective harm, it counts. If subjective, it doesn't. User says it counts. So Objective Resource/Objective Harm view fits.
