prompt: |-
  hey, for my philosophy club presentation i'm doing Goodhart's law (the idea that when a measure becomes a target it stops being a good measure) and instead of just explaining it i want to rank a bunch of cases by how much they're actually that vs just sort of look like it. here's my list:

  - the old story about a nail factory paid by weight that ends up making one giant useless nail
  - my school introduced a "most improved student" award based on how much your grades go up between the first test and the last, and now people tank the first test on purpose
  - a chess app's rating system, where people at low ratings sandbag so they can farm easy wins (maybe too close to the one above?)
  - our year group's average attendance dropped a lot last year because they changed the bus route, nobody was gaming anything
  - a chatbot trained to get thumbs ups ends up agreeing with everything you say
  - a bakery starts counting loaves sold, sales go up because the loaves got smaller, but they also genuinely sell more bread to more people
  - a hospital rated on how long patients wait to be seen, so they keep people in ambulances where the clock hasn't started

  for each one give me a score out of 1 for "is this really Goodhart's law" (1 = textbook, 0 = nothing to do with it), one sentence of why, then put them in order. also tell me which of these four things is doing the work in each case: (a) the measure is a noisy proxy, so whoever comes out on top is mostly just noise, (b) the measure only tracked the goal in a normal range and we've pushed outside it, (c) we're now optimising the measure instead of the thing we actually cared about, (d) people are actively sabotaging or lying about the measure.

  and be honest about where you'd change your mind — which case, if i described it slightly differently, would flip its spot in the ranking, and which of your scores your least sure about.
