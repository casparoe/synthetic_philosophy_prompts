answer: |-
  This is a classic stalemate, but your hypothesis that you are merely "refusing to pay different theoretical costs" is both insightful and slightly too pessimistic. It captures the *feel* of the deadlock, but it misses the structural reason *why* the costs are being weighed differently.

  Here is the diagnosis of the fight, the verdict on whether it is verbal, and a concrete map of what could actually count as progress.

  ### 1. The Diagnosis: Explanatory Priority, Not Just Cost
  You are correct that both Epistemicism (your view) and Supervaluationism (her view) are "bullet-biting" theories. However, characterizing this as mere cost-avoidance suggests the choice is arbitrary or aesthetic. It isn't. It is a clash of **explanatory priority**.

  *   **The Linguist (Supervaluationist)** prioritizes **Semantic Data**. Her starting point is the behavior of competent speakers. We don't act like there's a sharp line; we hesitate; we accept "neither true nor false" intuitions. Her theory is designed to save the *phenomenology* of language use. The cost she pays (truth isn't truth, gaps in bivalence) is the price of modeling linguistic competence accurately.
  *   **The Metaphysician (Epistemicist)** prioritizes **Logical/Metaphysical Integrity**. Your starting point is classical logic and a robust correspondence theory of truth. You cannot tolerate truth-value gaps or the failure of Tarski biconditionals ($P \iff \text{True}(P)$). Your theory is designed to save the *architecture* of truth and logic. The cost you pay (unknowable sharp boundaries) is the price of maintaining a classical semantic framework.

  **The Fight:** You are not fighting about the same question.
  *   She is answering: *"How do we model the semantics of vague predicates given actual usage?"*
  *   You are answering: *"What must the world be like for our sentences to have classical truth conditions?"*

  This is why the fight loops. When you say "There must be a fact," you are making a metaphysical demand. When she says "There is no fact," she is making a semantic observation. You talk past each other because you disagree on which discipline gets to constrain the other. Does semantics constrain metaphysics (her view), or does metaphysics constrain semantics (your view)?

  ### 2. Is It a Verbal Dispute?
  **No.** It is not merely verbal.

  If this were a verbal dispute, you could resolve it by saying, "Oh, you use 'fact of the matter' to mean *semantic determinacy*, and I use it to mean *ontological determinacy*. We agree on all the non-philosophical facts."

  But you don't agree on the non-philosophical facts. Specifically, you disagree on the **propositional content** of borderline claims.
  *   For you, "This man is bald" expresses a precise proposition that is either true or false.
  *   For her, "This man is bald" expresses a proposition that lacks a truth value (or is only "supertrue").

  This is a substantive disagreement about the nature of the propositions expressed by natural language sentences. It has downstream effects on logic, probability, and belief. If she is right, you can rationally believe a disjunction without believing either disjunct. If you are right, that is irrational. That is not a verbal difference; it is a cognitive one.

  ### 3. Why Your Hypothesis is Partially Wrong
  You hypothesized: *"We're each just refusing to pay a different theoretical cost, and that no argument can settle that."*

  This is wrong because **costs can be weighed systematically.** In abductive reasoning (inference to the best explanation), we don't just count costs; we weigh their severity relative to the theoretical goals. Progress is possible if you stop trying to prove the other wrong and start comparing the *damage* the costs inflict on the broader system.

  **The Concrete Test:**
  The dispute becomes settleable (or at least movable) if you focus on **Higher-Order Vagueness**.
  *   **Her Problem:** Supervaluationism relies on "admissible precisifications." But is the boundary between *admissible* and *inadmissible* precisifications sharp? If it's sharp, she has reintroduced a sharp boundary (collapsing toward your view). If it's vague, her semantics becomes vague, and she needs a meta-semantics to explain *that* vagueness, leading to regress.
  *   **Your Problem:** Epistemicism posits a sharp boundary between bald and not bald. But is there a sharp boundary between *knowable* and *unknowable*? If so, that seems just as spooky as the boundary of baldness.

  **Progress Criterion:** The theory that can handle **higher-order vagueness** without collapsing or regressing wins. Currently, both struggle, but Epistemicism (specifically Timothy Williamson's version) has a more formalized account of the "margin for error" principles that govern the higher-order boundaries. If she cannot formalize the "admissibility" constraint without invoking a sharp cutoff, your view gains abductive weight.

  ### 4. What Counts as Progress?
  Since you asked for concrete distinctions or theorems, here are three specific avenues that would move the needle, ranked from most to least likely to succeed:

  **A. The Tarski Test (Formal)**
  Stop arguing about "facts." Argue about the Tarski Biconditionals: $P \iff \text{True}(\ulcorner P \urcorner)$.
  *   **Ask her:** "Do you accept the Tarski biconditional for borderline cases?"
  *   **If she says No:** She has abandoned a core constraint on the concept of truth. You can argue that her 'supertruth' is not truth, but *validity* or *assertibility*. If you can prove that her 'true' behaves more like 'warrantedly assertible,' you reframe her view as a theory of *justification*, not truth.
  *   **If she says Yes:** She must explain how $P$ can be neither true nor false while $P \iff \text{True}(P)$ holds. This is a formal contradiction she must resolve.
  *   **Progress:** If you force her to admit 'supertruth' isn't 'truth' in the robust sense, you concede the semantic utility of her view while maintaining your metaphysical point.

  **B. The Margin for Error Theorem (Formal/Epistemic)**
  You mentioned margin-for-error. Push this formally.
  *   Williamson argues that knowledge requires safety (margin for error). If you know you are bald, you couldn't easily have been wrong (e.g., had one more hair).
  *   **The Challenge:** Ask her to model "admissibility" using a similar safety condition. If "admissible precisification" is itself vague, can we know which precisifications are admissible?
  *   **Progress:** If she admits we cannot know which precisifications are admissible, her view becomes an *epistemic* view about semantic rules, which converges significantly with your view. The distance between "unknowable boundary of the world" and "unknowable boundary of language" shrinks.

  **C. Experimental Semantics (Empirical)**
  This is the nuclear option for armchair metaphysicians.
  *   **The Question:** Do ordinary speakers treat borderline cases as *unknown* (Epistemic) or *indeterminate* (Supervaluationist)?
  *   **The Test:** Present subjects with a Sorites series. Ask: "Is this statement True, False, or Neither?" vs. "Is there a fact of the matter?"
  *   **Progress:** If data shows people treat borderline cases as "unknown" (e.g., they bet on them as if there is an outcome), Epistemicism is empirically supported. If they treat them as "gap-like" (refusing to bet), Supervaluationism wins. (Current data is mixed, but this moves the fight from intuition to data).

  ### 5. Final Verdict: Should Anything Move?
  Your hypothesis that "no argument can settle that" is correct **if** you are looking for a knockout blow. There is no *reductio* that kills either view without assuming premises the other side rejects.

  **However, something should move:** Your expectation of what a solution looks like.
  The honest answer is that Vagueness is likely a **trilemma**. You must give up one of three:
  1.  Classical Logic (Excluded Middle).
  2.  Classical Semantics (Bivalence/Tarski).
  3.  The claim that Vagueness is not just Ignorance.

  *   She gives up (2).
  *   You give up (3).
  *   (Subvaluationists/Paraconsistentists give up 1).

  **The Progress:** Stop trying to convince her there is a sharp boundary in the world. Instead, argue that **her semantic indeterminacy ultimately rests on epistemic limitations.**
  If she says "It is indeterminate which precisification is correct," ask: *"Is it indeterminate because there is no fact, or because we cannot access the fact of linguistic convention?"*
  If she admits that linguistic conventions are themselves fixed by usage facts that we might not fully grasp, her "semantic indecision" looks suspiciously like "epistemic limitation regarding semantic rules."

  **Recommendation:**
  Propose a truce based on **Domain Separation**.
  *   **For Logic and Metaphysics:** You win. Assume bivalence and sharp boundaries to keep the system clean.
  *   **For Linguistics and Communication:** She wins. Model the *usage* as if there are gaps, because that predicts speaker behavior better.

  Acknowledge that you are describing the **same phenomenon** (the Sorites) from two different levels of abstraction (Ontological vs. Semantic). The fight persists because you both think your level is fundamental. If you agree that metaphysics grounds semantics, but semantics describes our access, you aren't disagreeing about the world; you're disagreeing about which map is more useful for the current conversation.

  That isn't a surrender; it's a dissolution. And for a third two-hour fight, it might be the only way out.
