prompt: |-
  I have no academic training in philosophy — I read and think about it on my own — so please correct my framing where it's muddled, but take the question itself seriously.

  You are an epistemologist who specializes in the norms governing belief revision, especially what a person is entitled to do when something arrives that counts against something they believe. I want you to think carefully here, and to start by brainstorming on paper before you commit to anything: sketch the puzzle, sketch the candidate ways out, and only then assemble the list I ask for.

  Here is the puzzle that keeps snagging me. Suppose I know some ordinary thing — that I have lived at the same address for six years, say. Whatever I know is true. So any document, testimony, or measurement that appears to show otherwise must, somewhere along the line, be misleading; it cannot be a genuine window onto a fact that contradicts what I know, because there is no such fact. And if I am entitled to treat the counterevidence as misleading, then it looks as though I am entitled to set it aside — maybe even obliged to, since I would be basing my belief on something I take to be misleading. Generalize: knowing anything would license me to ignore all future evidence against it, which is the opposite of how I want to be. I have seen this nicknamed the dogmatism paradox.

  Before I go read anyone's proposed solution, I want the specification. Tell me what any adequate resolution of this puzzle has to deliver — the desiderata, with the case or consideration behind each. I am after:

  - the cases it must get right, including both cases where waving off the counterevidence is correct and cases where doing so is plainly wrong, with the case behind each;
  - the distinctions it cannot collapse — for instance between knowing a thing and being very confident of it, between ignoring evidence one has seen and failing to go looking for it, between knowing something and knowing that one knows it, between the first-person and the third-person standpoint;
  - the background results it must stay consistent with, such as fallibilism, and the plain fact that people do use "I know" to close a conversation;
  - the behaviours it must not license, in particular any general policy of discounting contrary evidence and the use of "I know" as a way to end an argument by fiat.

  Two things I want you to build in, because they are where my own thinking stalled. First, a graded version: replace "knows" with "is very confident — say 0.98" and tell me whether the paradox survives that substitution, and if it does, whether the resolution has to be the same one. Second, the group case: does the puzzle arise for a committee, a laboratory, or a whole field, and do the same requirements apply to them, or does the collective case need its own entry on the list?

  Then mark which of these are genuine requirements and which are merely the prejudices of one camp. Say which single requirement does the most work in ruling candidate solutions out, and whether some subset of the requirements cannot be jointly satisfied — if so, that joint failure is the result I want most, more than any scorecard.

  Finally, evaluate a half-formed idea of mine: that "I know" is really a promise to stop looking, and that the whole puzzle is about when that promise is binding. Tell me honestly whether that is a resolution or merely a redescription of the problem, and which desiderata it meets and which it fails. If you have room after that, add a short paragraph on which broad family of responses does best against the list — denying the step from knowing to "the counterevidence must be misleading," denying that I know that I know, separating knowledge from justified confidence, or something else — but keep it brief; the criteria are what I am after, not the scorecard.

  Please skip references and reading lists. I will not chase them down, and a name I cannot check does not help me.
