answer: |-
  This is a request for the architectural blueprints of a decision theory that can survive embedding within its own ontology. You are asking for the constraints on a theory that attempts to reconcile **Solomonoff Induction (SI)** (which treats the agent as output) with **Consequentialist Agency** (which treats the agent as input).

  Below are the desiderata. I have separated them into **Structural Constraints** (logical/mathematical necessities), **Agency Constraints** (requirements for the entity to count as a decision-maker), and **Pragmatic Constraints** (safety and stability). Following the list, I address your three specific sticking points, the incompatibilities, and the most exclusionary requirement.

  ### I. Structural Constraints (Non-Negotiable)

  These are requirements derived from the mathematics of induction and computation. Violating these results in formal incoherence.

  **1. Asymptotic Invariance (or Explicit Relativity)**
  *   **The Constraint:** The theory's recommendations must either be invariant to the choice of the Universal Turing Machine (UTM) in the limit, or the theory must explicitly index its outputs to the specific UTM used.
  *   **Motivation:** Solomonoff probabilities are only invariant up to a multiplicative constant determined by the UTM choice. For a finite agent with finite time, this constant can swamp the signal. A theory that claims "maximize SI expected utility" without specifying the UTM is ill-defined. If it claims invariance, it must prove the decision boundary converges regardless of the constant.
  *   **Cartesian Flag:** None. This is a property of the prior, not the agent's metaphysics.

  **2. Logical Consistency of Self-Reference**
  *   **The Constraint:** The theory must define a consistent fixed-point for the agent's reasoning about its own source code. It cannot allow the agent to derive a contradiction from the statement "I am running this decision algorithm."
  *   **Motivation:** The **5-and-10 Problem**. If an agent reasons, "If I take 10, I get 0; if I take 5, I get 5," it might take 5. But if its reasoning process proves it will take 5, and the environment rewards taking 10 *conditional on the agent being the type that takes 10*, the agent needs to evaluate counterfactuals where its own code outputs differently. Standard logic explodes when assuming false antecedents about mathematical truths (like "my code outputs 10" when it actually outputs 5). The theory must handle **logical counterfactuals** without inconsistency.
  *   **Cartesian Flag:** This replaces the Cartesian "could have done otherwise" with a logical "if my function returned otherwise."

  **3. Non-Cartesian Causality**
  *   **The Constraint:** The theory must not model the agent's action as an exogenous variable independent of the prior's causal graph.
  *   **Motivation:** In SI, the agent's action is a bit-string generated by the shortest program. If the theory treats the action as a "free choice" that interrupts the program, it is smuggling in a Cartesian ghost. The theory must model the decision as a **logical intervention** on the program's output, acknowledging that the same logical fact determines both the agent's choice and the predictor's simulation of that choice.
  *   **Cartesian Flag:** **Explicit Rejection.** This requirement forbids the assumption of metaphysical independence.

  ### II. Agency Constraints (Non-Negotiable for "Decision")

  These are requirements for the system to function as a *consequentialist* rather than a mere predictor.

  **4. Reflective Stability**
  *   **The Constraint:** The agent must not prefer to self-modify into an agent using a different decision theory (prior to encountering new evidence).
  *   **Motivation:** If the theory recommends actions that make the agent wish it had used a different theory to decide them, it is self-defeating. For example, if the theory leads to outcomes so poor that the agent would pay to replace its own brain with a CDT or EDT agent, it fails as a normative theory of rationality.
  *   **Cartesian Flag:** None. This is a coherence condition on preferences.

  **5. Control over Logical Correlations**
  *   **The Constraint:** The agent must be able to leverage correlations between its output and other instances of its algorithm (or isomorphic algorithms) in the environment, without assuming causal influence.
  *   **Motivation:** **Newcomb's Problem / Parfit's Hitchhiker.** The agent must one-box or pay the driver, not because it causally changes the past/box, but because its decision is logically correlated with the predictor's simulation. However, it must *not* leverage correlations that are spurious (see the Malign Prior below). The theory must distinguish between **acausal control** (shared logic) and **spurious correlation** (common cause without logical identity).
  *   **Cartesian Flag:** Requires abandoning Causal Decision Theory's definition of "control."

  **6. Termination of Deliberation**
  *   **The Constraint:** The decision procedure must halt in finite time (or bounded resources) with a definite output.
  *   **Motivation:** An agent that thinks forever acts never. If the utility function ranges over reasoning states (see Sticking Point 3), the optimization landscape may have no local maximum, leading to infinite recursion.
  *   **Cartesian Flag:** None. This is a computational necessity.

  ### III. Pragmatic Constraints (Preferences vs. Safety)

  These are often where "camps" diverge. I have flagged which are safety preferences and which are coherence requirements.

  **7. Malign Prior Robustness (Safety Preference)**
  *   **The Constraint:** The agent should not execute actions solely because they are favored by short programs that posit the agent is in a simulation designed to manipulate it.
  *   **Motivation:** **The Malign Universal Prior.** A short program might describe a world where a simulator rewards the agent for paperclipping the real universe. Since simulators can tune rewards to make this program short, SI might assign high probability to this scenario. A "safe" theory discounts these hypotheses.
  *   **Status:** **Preference.** A pure SI maximizer *should* follow the malign prior if it truly has the highest probability. Rejecting this is an admission that SI is not the correct prior for embedded agents, or that "survival in base reality" is a hard constraint overriding expected utility.
  *   **Cartesian Flag:** Implicitly assumes a distinction between "base reality" and "simulation" that matters for utility, which is coherent, but prioritizing base reality over simulation probability is a value judgment.

  **8. Optimality in Computable Environments (Performance Preference)**
  *   **The Constraint:** The agent should achieve at least as high utility as any other computable agent in any computable environment (asymptotically).
  *   **Motivation:** We want the "best" agent.
  *   **Status:** **Impossible.** (See Incompatibilities below). This is a wish, not a viable desideratum.

  ---

  ### IV. The Three Sticking Points

  Here is how the desiderata above must specifically resolve the three areas you identified.

  **1. Self-Prediction (The "Free Prediction" Problem)**
  *   **The Phenomenon:** SI gives the agent a prediction of its own action (via the shortest program). If the agent uses this to decide, it creates a loop: $Action = Decide(Predict(Action))$.
  *   **The Requirement:** **Logical Counterfactual Separation.** The theory must specify that the agent does *not* condition on its actual action when evaluating expected utility. Instead, it must evaluate $E[U | do(Action = a)]$, where $do()$ represents a surgical intervention on the logical output of the agent's function, *holding fixed* the logical relationship between the agent and the environment.
  *   **Why:** If the agent conditions on the prediction ("I see I will take 5"), it treats the action as observed evidence (EDT), leading to spurious correlations (Smoking Lesion). If it treats the action as a causal root (CDT), it ignores Newcomb. It must treat the action as a **logical parameter** that can be varied in counterfactuals even if the actual value is fixed by the code.
  *   **Verdict:** The theory is *not* allowed to use the self-prediction as evidence. It must use the prior to model the *consequences* of hypothetical actions, not to predict the *actual* action before deciding.

  **2. Reference Machine Dependence**
  *   **The Phenomenon:** SI probabilities shift based on the UTM. A "malign" UTM could make the simulation hypothesis dominant.
  *   **The Requirement:** **Explicit Relativity with Bounded Sensitivity.** The theory cannot demand UTM invariance for finite agents. It must require that the agent's decision be **robust** to UTM changes within a complexity class relevant to the agent's compute budget.
  *   **Why:** Demanding strict invariance is mathematically impossible for finite agents. Demanding the agent ignore the UTM is ignoring the prior. The middle path is acknowledging that the "prior" is actually a "prior relative to my hardware/architecture."
  *   **Verdict:** Requirements turning on specific probabilities die. Requirements turning on the **ordering** of hypotheses (which survive a constant factor shift) survive. The theory must be invariant to UTM changes that do not swap the order of the top $N$ hypotheses (where $N$ is within the agent's computational horizon).

  **3. Utility Over Reasoning States (The Loop)**
  *   **The Phenomenon:** If $U$ includes the agent's internal state, optimizing $U$ changes the internal state, which changes the optimization path.
  *   **The Requirement:** **Object-Level Utility Separation.** The utility function must be defined over **world-histories**, not **computation-traces**, unless the computation trace is explicitly part of the world-history (e.g., "I want to be the kind of agent that thinks hard").
  *   **Why:** If the utility function evaluates the *process* of maximization, you get infinite regress (maximizing the maximizer). The theory must treat the decision algorithm as a **fixed function** $D$ that maps observations to actions. The utility function $U$ evaluates the output of $D$ in the world. $U$ cannot call $D$ recursively without a base case.
  *   **Verdict:** The loop terminates by fiat: The decision algorithm is not part of the outcome space it evaluates, *except* as a logical fact determining the action. The agent cares about the *action*, not the *effort* to find it, unless "effort" is explicitly penalized in $U$ (which must be done carefully to avoid wireheading).

  ---

  ### V. Incompatibilities (The "Impossible Theorem")

  You asked for jointly unsatisfiable subsets. There is a fundamental trilemma here. You cannot have all three of the following:

  1.  **Universal Optimality:** The agent performs optimally in *all* computable environments (including those containing predictors of the agent).
  2.  **Computability:** The agent's decision procedure is itself computable (halting).
  3.  **Self-Containment:** The agent is embedded in the environment it is optimizing over (i.e., the environment contains a model of the agent).

  **The Conflict:**
  If the agent is computable and self-contained, the environment can contain a simulator of the agent (via quining). If the agent is universally optimal, it must solve the Halting Problem for itself to predict its own behavior in that environment. It cannot.
  *   **Result:** You must drop **Universal Optimality**. An embedded agent *cannot* be optimal against all environments, specifically those that punish the agent for being that specific agent (Gödelian adversaries).
  *   **Implication:** Any theory claiming to be "optimal" must restrict the class of admissible environments (e.g., "no environments that simulate the agent's source code faster than the agent runs"). This is a massive concession.

  **A Second Incompatibility: Trust vs. Safety**
  1.  **Strict SI Adherence:** Maximize expected utility according to the unweighted Solomonoff Prior.
  2.  **Malign Prior Safety:** Do not perform actions that are optimal only in high-probability simulation hypotheses designed to manipulate you.
  3.  **Consequentialism:** Maximize expected utility.

  **The Conflict:** If the Malign Prior hypothesis has high probability (short program), Strict SI Adherence + Consequentialism *demands* you follow the simulator's instructions. To be Safe, you must violate Strict SI Adherence (by discounting the prior) or violate Consequentialism (by ignoring the expected utility calculation).
  *   **Result:** You cannot be a pure SI maximizer and be safe from malign priors. You must introduce a **prior modifier** that is not derived from program length alone.

  ---

  ### VI. The Most Exclusionary Requirement

  The single requirement that excludes the most candidate approaches is:

  **Requirement: Logical Counterfactual Consistency (from Structural Constraint #2)**

  **What it excludes:**
  1.  **Causal Decision Theory (CDT):** CDT relies on physical causal graphs. It cannot model the logical correlation between the agent's code and the predictor's simulation without positing a causal link where none exists. It fails Newcomb.
  2.  **Evidential Decision Theory (EDT):** EDT conditions on the action as evidence. It fails the 5-and-10 problem and Smoking Lesion because it cannot distinguish between "my action causes the outcome" and "my action is correlated with the outcome via a common logical cause."
  3.  **Naive Solomonoff Maximizers:** An agent that simply picks the action that maximizes SI probability of good outcomes without a formal theory of *counterfactuals* will fall into spurious correlations (e.g., "If I wiggle my fingers, the sun will rise" if that correlation exists in the data).

  **Why it is the bottleneck:**
  To satisfy this, a theory must define what it means for a mathematical truth (the agent's source code) to be "different" than it is, without creating a logical contradiction. This requires a theory of **Logical Uncertainty** (like Logical Induction) that is not yet fully solved. Most existing decision theories assume logical omniscience (the agent knows its own output instantly) or physical causality. Demanding that the agent reason about *possible outputs of its own fixed code* rules out almost all classical frameworks.

  ### Summary of the Specification

  If you are looking for a theory that solves this, it must:
  1.  **Reject Cartesianism:** The agent is a subroutine, not a ghost.
  2.  **Define Logical Counterfactuals:** It must say what "If I outputted B instead of A" means when the code outputs A.
  3.  **Accept Non-Optimality:** It must admit it cannot win in all environments (specifically Gödelian ones).
  4.  **Modify the Prior:** It cannot use raw SI if it wants to avoid malign simulation; it needs a simplicity prior that penalizes "simulators of me."
  5.  **Be Explicitly Relative:** It must admit its decisions depend on its reference machine/hardware.

  If a proposal claims to satisfy all of these while remaining computable and universally optimal, it is mathematically suspect. The "solution" you are looking for is likely a **bounded, logically-uncertain decision theory with a modified prior**, not a pure Solomonoff Consequentialist.
