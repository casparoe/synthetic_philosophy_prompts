  # The Causal Touch Protocol (20-Minute Review)

  **Purpose:** To adjudicate proposals using collective terms ("culture," "institutions," "markets") without requiring micro-data or banning holistic heuristics.
  **Core Principle:** Collective forces are valid *only if* you can specify where they land on an individual's decision-making (the "Causal Touch").

  ### Step 1: Identify the Black Box (2 mins)
  Underline the collective term doing the explanatory work (e.g., "The Market," "Professional Culture," "The Union").
  *   **Action:** Write it down.

  ### Step 2: Classify the Ontology (5 mins)
  Determine how the proposal treats this term. It must fit one of these three readings:
  1.  **Aggregative (The Heap):** The term is shorthand for a sum of individual facts (e.g., "Demand" = sum of individual purchases).
  2.  **Structural (The Constraint):** The term is a relational pattern that limits or enables individual choices (e.g., "Class Structure" = limits who can apply to college).
  3.  **Reified (The Agent):** The term is treated as having its own beliefs, wants, or goals (e.g., "The Market *wants* stability").

  *   **Pass:** Applicant clearly identifies which reading they are using.
  *   **Fail:** Applicant conflates them (e.g., treats "Culture" as a constraint in paragraph 2 and an agent in paragraph 4). **→ Send to Chair.**

  ### Step 3: The Causal Touch Test (8 mins)
  **Question:** Does the explanation specify *how* this collective term affects an individual's incentives, information, or beliefs?
  *   **Constraint:** Nothing at the collective level pushes individuals around except *through* their own decision calculus.
  *   **No Micro-Data Clause:** If the applicant has no individual-level data, they must provide a *plausible inference chain* (e.g., "We cannot survey doctors, but prescribing logs show clustering consistent with peer-monitoring norms").

  *   **If Reading is Aggregative (1):** Does the proposal explain how individual actions sum to the outcome? (e.g., "Members voted" not just "Members wanted").
  *   **If Reading is Structural (2):** Does the proposal show how the structure changes the individual's payoff or options? (e.g., "Norms increase social cost of deviation").
  *   **If Reading is Reified (3):** Does the applicant explicitly acknowledge this is a *model/metaphor* and not a literal agent?
      *   **Yes:** → **Send to Chair (Values Call).** *Note: We do not ban Type 3, but funding heuristic reification is a policy choice.*
      *   **No:** → **Fail.** (Magic).

  ### Step 4: The Verdict (5 mins)
  *   **Fund:** Clear Ontology (1 or 2) + Clear Causal Touch + Plausible Inference (if no micro-data).
  *   **Reject:** No Causal Touch (Collective force acts like magic) OR Conflated Ontology.
  *   **Chair Review:** Type 3 (Reified) used explicitly as a metaphor OR Ontology is ambiguous but Causal Touch is strong.

  ***

  # Running the Protocol

  ### Case 1: Prescribing rates explained by a "local culture of prescribing."
  *   **Step 1 (Box):** "Local Culture."
  *   **Step 2 (Ontology):** Applicant defines it as **Reading 2 (Structural)**. "Culture" = shared norms and peer-monitoring networks among doctors in the region.
  *   **Step 3 (Touch):** Mechanism specified: Doctors deviate from the local norm at the cost of professional reputation (incentive change). No survey data, but referral network maps support the existence of the peer group.
  *   **Step 4 (Verdict):** **Fund.**
  *   **Reasoning:** It treats culture as a constraint on individuals, not a magic force. The lack of micro-data is bridged by network inference.

  ### Case 2: Firm adoption explained by its "position among similar firms."
  *   **Step 1 (Box):** "Position among similar firms" (Network/Isomorphism).
  *   **Step 2 (Ontology):** **Reading 2 (Structural).** Position = relational structure.
  *   **Step 3 (Touch):** Mechanism specified: Firms in central positions face higher legitimacy pressure; the *decision-maker* (CEO) adopts the practice to secure capital access (incentive change).
  *   **Step 4 (Verdict):** **Fund.**
  *   **Reasoning:** Clear structural constraint acting on individual decision-makers within the firm.

  ### Case 3: A union striking because its "members wanted higher wages."
  *   **Step 1 (Box):** "Union" (acting) / "Members" (wanting).
  *   **Step 2 (Ontology):** **Reading 1 (Aggregative).** The proposal treats the Union's action as the sum of Member desires.
  *   **Step 3 (Touch):** Mechanism specified: Members have a desire (wages).
      *   *Check:* Does it explain how individual wants become collective action? No. It assumes the transmission is automatic.
      *   *Constraint Check:* The protocol polices *Downward* Causation (Collective → Individual). This is *Upward* Causation (Individual → Collective). The "Causal Touch" rule does not trigger here because no collective force is pushing an individual.
  *   **Step 4 (Verdict):** **Fund.**
  *   **Reasoning:** It passes the Individualism check. It posits individuals with desires as the root cause. No "magic holism" is present.

  ***

  # The Annoyance

  **The Verdict that will annoy you:** **Case 3 (The Union).**

  **Why it annoys:**
  You are funding a tautology disguised as social science. "The Union struck because members wanted to" ignores the **Collective Action Problem**. Individual desire does not sum to collective action without organization (leadership, voting rules, strike funds, coercion). A proposal that ignores the *mechanism of aggregation* is theoretically bankrupt, yet my procedure approves it.

  **Where the Procedure Misfires:**
  The procedure is built to police the **Holism → Individualism** direction (the "Magic Culture" fight). It enforces the rule that *collective forces must touch individuals*.
  *   It succeeds at stopping "Culture made me do it" (Downward Magic).
  *   It fails to stop "We did it because we wanted to" (Upward Magic).

  By focusing exclusively on the *constraint* side of the individualism/holism dispute (how the macro limits the micro), the procedure neglects the *constitution* side (how the micro builds the macro). It validates **Methodological Individualism** (Case 3 passes) without validating **Social Mechanism** (Case 3 explains nothing). You will be funding a proposal that reduces a complex institutional phenomenon to folk psychology, simply because it didn't violate the "Downward Causation" rule.
