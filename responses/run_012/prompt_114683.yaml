answer: |-
  # DECISION TREE: IS KARMA MORAL DESERT?

  **Instructions:** Start at the top. Answer the question based on how you think karma *must* work to make sense. Follow the line to the next question or final position.

  ### 1. Does the karmic process require rebirth to balance the books, or can it be fully explained within a single lifetime (e.g., as character development)?
  *   **Single Lifetime** → Go to **Question 2**.
  *   **Rebirth Required** → Go to **Question 5**.

  ---

  ### 2. (Single Lifetime) Does the karmic order need someone running it (a judge, a lawgiver, a cosmic administrator), or is it a law with nobody behind it?
  *   **Someone Running It** → Go to **Question 3**.
  *   **Nobody Behind It** → Go to **Question 4**.

  ### 3. Is the unit of accountability the individual, or the family/group/nation?
  *   **Individual** → **POSITION 1: Secular Theism**
      *   *Diagnostic Case:* A child born with a painful lifelong condition.
      *   *Awkward Commitment:* You must claim the child is being judged for their own tiny sins, or that God is unjust.
  *   **Group/Nation** → **POSITION 2: National Karma**
      *   *Diagnostic Case:* A whole people said to be working off a shared debt.
      *   *Awkward Commitment:* Innocent individuals are punished for crimes committed by their ancestors or neighbors.

  ### 4. Is the link between how you acted and what happens to you desert-constituting (you *ought* to suffer), or merely causal (you *will* suffer, like burning a hand)?
  *   **Desert-Constituting** → **POSITION 3: Moral Universe Theory**
      *   *Diagnostic Case:* Someone who suffers terribly despite apparently living well.
      *   *Awkward Commitment:* You claim the universe has moral rules without a moral rule-maker to enforce them.
  *   **Merely Causal** → Go to **Question 4b**.

  ### 4b. Is the causal mechanism internal (psychology) or external (social reputation)?
  *   **Internal (Psychology)** → **POSITION 4: Character Ethics**
      *   *Diagnostic Case:* A person who does real harm and then genuinely reforms.
      *   *Awkward Commitment:* Cannot explain why good people get cancer or suffer genetic bad luck unrelated to character.
  *   **External (Social)** → **POSITION 5: Social Reputation**
      *   *Diagnostic Case:* A person who does real harm and then genuinely reforms.
      *   *Awkward Commitment:* Reduces karma to public opinion; offers no account for private guilt or hidden actions.

  ---

  ### 5. (Rebirth Required) Does the karmic order need someone running it (a judge, deity, or administrator), or is it a law with nobody behind it?
  *   **Someone Running It** → Go to **Question 6**.
  *   **Nobody Behind It** → Go to **Question 7**.

  ### 6. Is the mechanism exceptionless, or can it be interrupted (by insight, by grace, by someone handing their surplus merit over to you)?
  *   **Interruptible** → **POSITION 6: Ritualist Theism**
      *   *Diagnostic Case:* Merit earned by one person is ritually handed to another.
      *   *Awkward Commitment:* Makes morality a transaction where the rich can buy their way out of consequences.
  *   **Exceptionless** → **POSITION 7: Cosmic Bureaucracy**
      *   *Diagnostic Case:* A person who does real harm and then genuinely reforms.
      *   *Awkward Commitment:* The administrator is bound by the ledger and has no freedom to show mercy even if you change.

  ### 7. (Impersonal Law) Does karma need a persisting self that owns the deed and later collects, or can it run with no owner at all?
  *   **Persisting Self** → Go to **Question 8**.
  *   **No Owner (No-Self)** → Go to **Question 9**.

  ### 8. Is the unit the individual, or the family/group/nation?
  *   **Individual** → **POSITION 8: Hindu Orthodoxy**
      *   *Diagnostic Case:* A child born with a painful lifelong condition.
      *   *Awkward Commitment:* Hard to explain why families share fate if karma is strictly individual and self-contained.
  *   **Group/Nation** → **POSITION 9: Collective Rebirth**
      *   *Diagnostic Case:* A family or a whole people said to be working off a shared debt.
      *   *Awkward Commitment:* You suffer for deeds you didn't personally commit, which violates the intuition of individual justice.

  ### 9. Is the suffering of the "no-self" stream desert-constituting, or merely causal?
  *   **Desert-Constituting** → **POSITION 10: The Paradox (Invented)**
      *   *Diagnostic Case:* Someone who suffers terribly despite apparently living well.
      *   *Awkward Commitment:* **Incoherent:** Claims you "deserve" pain even though there is no "you" to deserve it.
  *   **Merely Causal** → Go to **Question 10**.

  ### 10. Is the mechanism exceptionless, or can it be interrupted (by insight/Nirvana)?
  *   **Interruptible** → **POSITION 11: Early Buddhist Soteriology**
      *   *Diagnostic Case:* A person who does real harm and then genuinely reforms.
      *   *Awkward Commitment:* Hard to motivate morality if no one is there to receive the reward or punishment in the end.
  *   **Exceptionless** → **POSITION 12: Karmic Fatalism**
      *   *Diagnostic Case:* Someone who suffers terribly despite apparently living well.
      *   *Awkward Commitment:* Makes spiritual effort pointless; you are locked into a script you cannot rewrite.

  ---

  ### NOTE ON INDISTINGUISHABLE POSITIONS
  **Positions 4 (Character Ethics) and 11 (Early Buddhist Soteriology)** often look identical in practice. Both view karma as causal rather than retributive, and both allow for change through insight. This tree separates them based on **Rebirth** (Question 1). If a theorist is vague about rebirth but insists on "no-self" and "causal law," this tree cannot separate them; they occupy the same logical space regarding desert.
