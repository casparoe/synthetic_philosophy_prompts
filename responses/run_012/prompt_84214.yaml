  # Diagnostic Instrument: The Anatomy of Competitive Traps

  **Instructions:** This tree is designed to diagnose the structure of a specific competitive situation. Begin at the **Root**. For each question, select the branch that best describes the **concrete case** you are analyzing, not the theory you prefer. Follow the path until you reach a leaf. The leaf indicates the diagnostic position that matches your answers.

  ---

  ### **Root: The Source of Pressure**
  **Question 1:** If you removed the current competitors and replaced them with entirely new agents, would the competitive pressure disappear, or would the new agents face the same pressure to compete?
  *   **Branch A (The pressure disappears):** The pressure comes from the specific choices of the current agents. *(Go to Node 2: Choice)*
  *   **Branch B (The pressure remains):** The pressure comes from the system replacing agents who fail to compete (evolutionary or market selection). *(Go to Node 2: Selection)*

  ---

  ### **Node 2: Choice**
  **Question 2:** Looking at the long-term trend in this case, does the competition degrade the overall quality of the outcome, or does it filter for better solutions?
  *   **Branch A (Filters for better solutions):** The competition is beneficial. *(Go to Node 3: Benefit)*
  *   **Branch B (Degrades outcome):** The competition creates a trap. *(Go to Node 3: Trap)*

  ### **Node 2: Selection**
  **Question 2:** Can the trap be fixed by changing the environment in which selection occurs, without requiring a single global coordinator?
  *   **Branch A (Yes, change the environment):** The trap is a feature of the selection environment. *(Leaf: **Selection-Theoretic View**)*
  *   **Branch B (No, environment is fixed):** The trap is inescapable without total coordination. *(Go to Node 3: Moloch)*

  ---

  ### **Node 3: Benefit**
  **Question 3:** Is the benefit of this competition a theoretical necessity of the process, or an observed empirical outcome?
  *   **Branch A (Theoretical necessity):** Competition acts as a discovery procedure that sorts preferences and rewards efficiency; the "race" is functional. *(Leaf: **Competition as Discovery**)*
  *   **Branch B (Observed outcome):** Empirically, competition in this domain tends to ratchet standards upward rather than down, despite fears. *(Leaf: **Race to the Top**)*

  ---

  ### **Node 3: Trap**
  **Question 3:** If the competition stopped, would the participants gain absolute value (everyone is richer/safer), or merely stop losing relative standing (everyone stays the same rank)?
  *   **Branch A (Gain absolute value):** The harm is absolute (total value is destroyed). *(Go to Node 4: Absolute)*
  *   **Branch B (Stop losing standing):** The harm is positional (status is redistributed). *(Go to Node 4: Positional)*

  ### **Node 3: Moloch** (From Selection Branch)
  **Question 3:** Is there a plausible single coordinator (a "singleton") that could escape this trap, or is the trap permanent?
  *   **Branch A (Singleton plausible):** Escape requires a global decision-maker. *(Leaf: **Moloch (Singleton Escape)**)*
  *   **Branch B (Trap permanent):** No single lever fixes it; the trap is a permanent feature of the system. *(Leaf: **Moloch (Permanent)**)*

  ---

  ### **Node 4: Absolute**
  **Question 4:** Do the primary costs fall on the competitors themselves, or on outsiders and future generations?
  *   **Branch A (Competitors themselves):** The participants bear the cost of their own competition. *(Go to Node 5: Participants)*
  *   **Branch B (Outsiders/Future):** The costs are externalities borne by third parties. *(Go to Node 5: Third Party)*

  ### **Node 4: Positional**
  **Question 4:** Is the metric being optimized a stable measure of value, or does the measure lose meaning as more people pursue it?
  *   **Branch A (Measure loses meaning):** The proxy decays as it is optimized (Goodhart's Law). *(Leaf: **Goodhart's Law Trap**)*
  *   **Branch B (Stable measure):** The metric is stable, but the cost of achieving status escalates. *(Leaf: **Positional Arms Race**)*
      *   *(Note: If this combination implies costs fall on third parties, mark as **Unnamed**: This view is rarely articulated because positional games are typically internal to the competitors.)*

  ---

  ### **Node 5: Participants**
  **Question 5:** If all other agents stopped competing, would you still be compelled to compete to avoid losing, or would you be relieved to stop?
  *   **Branch A (Relieved to stop):** You would stop if you knew they stopped; the barrier is fear or lack of trust. *(Leaf: **Security Dilemma**)*
  *   **Branch B (Compelled to compete):** You would still compete to gain an advantage; the barrier is individual incentive. *(Go to Node 6: Moloch)*

  ### **Node 5: Third Party**
  **Question 5:** Can a single authority effectively manage the resource, or must management be distributed?
  *   **Branch A (Single authority):** The solution requires privatization or state regulation. *(Leaf: **Tragedy of the Commons (State/Privatization)**)*
  *   **Branch B (Distributed management):** The solution requires polycentric or self-governing institutions. *(Leaf: **Tragedy of the Commons (Polycentric)**)*

  ---

  ### **Node 6: Moloch** (From Participants Branch)
  **Question 6:** Is there a plausible single coordinator (a "singleton") that could escape this trap, or is the trap permanent?
  *   **Branch A (Singleton plausible):** Escape requires a global decision-maker or hegemon. *(Leaf: **Moloch (Singleton Escape)**)*
  *   **Branch B (Trap permanent):** No single lever fixes it; the trap is a permanent feature of the system. *(Leaf: **Moloch (Permanent)**)*

  ---

  ### **Leaf Definitions & Unnamed Spaces**

  *   **Competition as Discovery:** The view that interjurisdictional or interfirm competition is not a trap but a discovery procedure that sorts preferences and rewards efficiency.
  *   **Race to the Top:** The empirical claim that races to the bottom rarely happen and that competition more often ratchets standards upward.
  *   **Selection-Theoretic View:** The view that such traps are features of evolutionary or market selection and cannot be repaired by changing incentives, only by changing the environment.
  *   **Tragedy of the Commons (State/Privatization):** The view that external costs require internalization via a central authority or property rights.
  *   **Tragedy of the Commons (Polycentric):** The view that external costs are best managed by self-governing communities denying the state/market dichotomy.
  *   **Security Dilemma:** The view that the trap is sustained by mutual fear and could be dissolved by reassurance rather than by enforcement.
  *   **Goodhart's Law Trap:** The view that escalation is driven by a shared metric whose validity decays as it is optimized.
  *   **Positional Arms Race:** The view that the total is fixed and competition only redistributes status at increasing cost.
  *   **Moloch (Singleton Escape):** The outcome is nobody's choice, no participant can escape, and only a global coordinator can fix it.
  *   **Moloch (Permanent):** The outcome is nobody's choice, and no single lever fixes it; the honest position is a diagnosis without a remedy.

  **Unnamed Leaves:**
  1.  **Selection + Benefit:** (Reached if Node 2 Selection -> Branch A). *Empty because this describes adaptive evolution rather than a trap; it is the null hypothesis of selection.*
  2.  **Positional + Third Party:** (Reached if Node 4 Positional -> Branch B + Third Party logic). *Unexplored because positional games usually internalize costs; if externalized, they collapse into Absolute Harm.*
  3.  **Participants + Contractible:** (If Node 5 Participants allowed a "Yes, we can bind ourselves" branch). *Unattractive because if binding is possible, the trap is merely a transaction cost problem, not a structural dilemma.*

  ---

  ### **Case Pathways**

  *   **Concert Audience (Standing):** Choice → Trap → Absolute (actually Positional in effect, but often felt as Absolute loss of view) → Participants → Compelled → Moloch. *(Note: Often diagnosed as Positional Arms Race if viewed as status/visibility).*
  *   **Antibiotics Overuse:** Choice → Trap → Absolute → Third Party → Commons (State or Polycentric). *(Alternatively: Selection → Moloch if focusing on bacterial evolution).*
  *   **Firms Shipping Early:** Choice → Trap → Absolute → Participants → Compelled → Moloch (or Security Dilemma if fear of being undercut drives it).
  *   **Costly Ornament:** Selection → No Env Fix → Moloch. *(Or Selection-Theoretic if environment can be changed).*
  *   **Credentialing Spiral:** Choice → Trap → Positional → Metric Decays → Goodhart's Law Trap.
  *   **Jurisdictional Competition:** Choice → Benefit → Theory → Competition as Discovery. *(Or Trap → Absolute → Third Party → Commons if viewed as Race to the Bottom).*
