answer: |-
  You and your friend have stumbled upon one of the most persistent and fertile disputes in moral philosophy and decision theory. The fact that you cannot easily defend it, yet cannot abandon it, is a testament to the strength of the intuition; it feels rational because, in a significant sense, it *is* rational, but it requires a broader definition of rationality than the one your friend is employing.

  Here is the carving you requested, rendered in the appropriate tongue.

  ### 1. Does it have an established name?

  Yes. In the literature of rational choice theory and moral philosophy, what you are describing is most precisely called **Resolute Choice**.

  The term was championed by the philosopher Edward McClennen in his work *Rationality and Dynamic Choice* (1990). It sits alongside David Gauthier's concept of **Constrained Maximisation** from *Morals by Agreement* (1986). Both describe an agent who adopts a plan *ex-ante* (before the specific details of the situation are known) and adheres to it *ex-post* (when the situation arises), even if breaking the plan would yield a locally superior outcome.

  Your friend's description—'precommitment with the commitment left out'—is a standard objection to this view, often levelled by proponents of **Sophisticated Choice**. A 'sophisticated' agent anticipates their own future weakness and only makes plans they know they will stick to. A 'resolute' agent, by contrast, makes the optimal plan and simply *resolves* to stick to it, relying on their will rather than external constraints.

  If you find 'Resolute Choice' too technical, or if you wish to emphasise the moral dimension over the game-theoretic one, I would coin the term **Ex-Ante Fidelity**. This captures the essence: you remain faithful to the decision made at the time of ignorance, rather than the impulse arising at the time of knowledge.

  ### 2. What makes it rational?

  Your friend argues that it is irrational to follow a rule when you know a better option exists in the specific case. This relies on **Act-Based Rationality**, which judges every decision in isolation. Your intuition relies on **Plan-Based Rationality** (or Dispositional Rationality).

  The rationality of Resolute Choice rests on three pillars:

  **The Blackmailer's Paradox**
  Consider your example of the blackmailer. If you are the sort of person who calculates costs and benefits *at the moment of demand*, you will pay (assuming the cost is less than the damage). However, because you are that sort of person, you will be blackmailed. If you are the sort of person who refuses on principle, you will never be blackmailed. You cannot simply choose to refuse *when the time comes* if you are a calculator, because the calculator in you will see the cost and pay. To avoid the blackmail, you must *be* a refuser, not just *act* like one. The rationality lies in cultivating the disposition, not in the isolated act.

  **Dynamic Consistency**
  If you abandon your rule every time the local reasons favour it, you render your past self's planning impotent. Your past self, behind the 'veil', knew best what was good for your life as a whole. Your present self has more information, but also more bias and immediate pressure. By deferring to the *ex-ante* rule, you prevent your present self from hijacking the long-term interests of your life. It is rational to trust the constitution you wrote when you were calm over the decree you issue when you are cornered.

  **Superrationality in One-Off Dealings**
  You mentioned behaving as though your conduct were a sample for strangers. This echoes Kant's Categorical Imperative and Douglas Hofstadter's concept of **Superrationality**. In certain logical structures (like Newcomb's Problem or the Prisoner's Dilemma), your choice is correlated with the outcome, even without causal contact. If you are rational, and the other party is rational, you will both reason similarly. By choosing cooperation, you 'predict' the other will do the same. Defecting for local gain signals that you are a defector, which logically precludes the benefits of being a cooperator.

  ### 3. Where does it come apart?

  You asked to distinguish this from precommitment, the veil of ignorance, and stubbornness. Here is the boundary work.

  **Vs. Precommitment (The Ulysses Pact)**
  Precommitment involves altering your options so that breaking the rule is impossible or prohibitively costly. Ulysses tied himself to the mast; he physically removed the option of steering towards the Sirens.
  *   **The Difference:** You explicitly stated, 'Nothing binds me... I could change my mind at any moment.' Precommitment changes the *world* (the available options); Resolute Choice changes the *will* (the selection mechanism). Precommitment is external; Resolute Choice is internal. Your friend calls this 'commitment left out' because there is no penalty for deviation. You call it rational because the penalty is the loss of integrity of the agent, which carries its own long-term costs.

  **Vs. The Veil of Ignorance**
  The Veil of Ignorance (Rawls/Harsanyi) is a heuristic for *selecting* principles. It asks: 'What rules would I choose if I didn't know my place in society?'
  *   **The Difference:** The Veil is a method of *legislation*; Resolute Choice is a method of *adjudication*. You used the Veil to pick the rule (the 'ex-ante' moment), but the practice you are defending is the adherence to that rule once the Veil is lifted. The Veil justifies the rule; Resolute Choice justifies following it when it hurts.

  **Vs. Plain Stubbornness**
  Stubbornness is the refusal to update one's view in the face of new, relevant information or reasons. It is often emotional or ego-driven.
  *   **The Difference:** Resolute Choice acknowledges the new information. You admit the local reasons 'plainly favour something else'. You do not ignore the reasons; you *override* them based on a higher-order reason (the integrity of the plan). Stubbornness says, 'I am right about the facts.' Resolute Choice says, 'I am bound by the procedure.' Stubbornness is a failure of reasoning; Resolute Choice is a strategy of reasoning.

  ### 4. A Proposed Name and its Edges

  While 'Resolute Choice' is the academic term, it feels somewhat dry for the moral weight you describe. If I were to coin a name that marks the edges of this specific mental manoeuvre, I would call it **Volitional Constancy**.

  **Volitional Constancy**
  *   **Definition:** The practice of adhering to a rule adopted under conditions of uncertainty, despite possessing later information that suggests a locally optimal deviation, without external binding mechanisms.
  *   **The Edge of Irrationality:** It becomes stubbornness if the *ex-ante* rule was poorly chosen or if the new information reveals a catastrophe the rule did not anticipate (e.g., keeping a promise that now results in death rather than mere inconvenience).
  *   **The Edge of Precommitment:** It stops being Volitional Constancy and becomes Precommitment if you arrange your environment to make breaking the rule impossible.
  *   **The Edge of Calculation:** It stops being Volitional Constancy and becomes Act-Based Rationality if you begin to calculate whether 'this is one of those times I should break the rule'. Once you calculate the exception, the constancy is broken.

  ### Conclusion

  Your friend is arguing from the perspective of **Act Utilitarianism** or **Causal Decision Theory**, which demands that every act maximise utility in its immediate context. You are arguing from **Rule Utilitarianism** or **Evidential Decision Theory**, which values the agent's disposition and the correlation between choices and outcomes.

  You are not confused. You are recognising that a rational life is not a series of disconnected maximisations, but a coherent narrative. To be the person who can make promises, resist blackmail, and cooperate with strangers, you must sometimes act against your immediate interest. That is not rule-worship; it is the price of admission to a society of trust, and indeed, to a coherent self.

  Stick to your guns, but perhaps invite your friend for breakfast; 2 a.m. is too late for such heavy lifting.
