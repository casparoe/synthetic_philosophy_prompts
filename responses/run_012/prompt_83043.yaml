  *Best approach:* Make the Safety Threshold hidden. You don't know if your Safety is enough. You can pay to know the *Leader's* safety. If you don't, you risk the group penalty. This forces the verification decision.

  Let's finalize the "Incumbent" role. They want the race to stall. They might spread FUD (Fear, Uncertainty, Doubt) about safety to trigger audits.

