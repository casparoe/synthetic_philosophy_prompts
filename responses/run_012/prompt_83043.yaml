          *   Do *not* name concepts until the debrief.
      *   **Constraints:** 18 students (mix of Phil/CS), projector + chairs only (no real money, no complex tech), 90 minutes.
      *   **Role:** Expert simulation designer for philosophy/policy + technical governance knowledge.
      *   **Output Requirements:**
          *   Brainstorming section (3 mechanisms, select one).
