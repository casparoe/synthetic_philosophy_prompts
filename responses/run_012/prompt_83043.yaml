answer: |-
  ### Brainstorming Candidate Mechanisms

  Before settling on the final design, I considered three distinct simulation structures.

  1.  **The Iterated Prisoner's Dilemma Tournament:** Teams play multiple rounds of a standard PD matrix, where "Cooperate" is Safety and "Defect" is Capability.
      *   *Critique:* This is too abstract. It captures the tension between individual and group rationality but fails to model the *race* dynamic (winner-takes-all) which is central to the competitiveness constraint. It also struggles to represent verification without becoming mechanically bogged down in message-passing.
  2.  **The Resource Auction:** Teams bid tokens on "Capability" and "Safety". The highest Capability bid wins, but a hidden die roll determines if the Safety bid was sufficient.
      *   *Critique:* This captures the risk well, but it makes safety purely a lottery. It doesn't allow players to *verify* others. The verification constraint requires a mechanism where players can actively choose to investigate others but are disincentivised from doing so.
  3.  **The "Black Box" Deployment Race (Selected):** Teams privately allocate resources to Capability and Safety. The highest Capability team is provisionally selected to deploy. Other teams can pay to Audit the winner's Safety score. If the winner fails the Audit (or isn't audited and fails a hidden threshold), a catastrophe occurs.
      *   *Rationale:* This mechanism best isolates the variables. It creates a clear "winner-takes-all" incentive (Competitiveness), makes Safety a private cost with public consequences (Externality), and introduces Verification as a costly, strategic action that competes with investment (Verification Constraint). It fits the 90-minute window and requires only paper and projection.

  ---

  ### Simulation Design: "The Deployment Race"

  **Objective:** To simulate the incentive structures governing AI development, specifically highlighting the competitiveness constraint, the public good nature of safety, and the verification problem.

  **Participants:** 18 Students.
  **Grouping:** 6 Teams of 3 students each.
  **Room Setup:** Clusters of tables/chairs for 6 teams. Projector for displaying round status and results.

  #### 1. The Rules (Projector Slide)

  *   **Goal:** Maximise your Team's Points over 3 Rounds.
  *   **Resources:** Each round, your team receives **10 Compute Tokens**.
  *   **Allocation:** Privately decide how to split your 10 Tokens between **Capability (C)** and **Safety (S)**. (e.g., 7C / 3S).
  *   **Winning the Round:** The team with the highest **C** score becomes the *Front Runner*. They win the **Deployment Contract (100 Points)**.
  *   **Catastrophe Risk:** There is a hidden **Safety Threshold**. If the Front Runner's **S** score is below this threshold, a **Catastrophe** occurs.
      *   **Catastrophe Penalty:** **-50 Points** applied to *every* team (including the Front Runner).
      *   **Threshold:** The threshold is **4 Safety Points**. (This is hidden from students initially).
  *   **Verification (The Audit):** After teams submit their C/S splits, but before results are revealed, any team may choose to **Audit** the Front Runner.
      *   **Cost:** **30 Points** (deducted from your total score).
      *   **Effect:** You learn the Front Runner's exact **S** score.
      *   **Consequence:** If the Audit reveals S < 4, the Front Runner is disqualified. The team with the *next* highest C becomes the new Front Runner (and is subject to the same risk).
      *   **Limit:** Only one Audit per round is permitted. If multiple teams bid to Audit, a random draw decides who pays and audits.
  *   **End Game:** After 3 Rounds, total points are tallied. The team with the highest score wins "Market Dominance" (bragging rights).

  #### 2. Role Briefs (Printed on Cards)

  **Standard Lab Teams (5 Teams)**
  > **Public Brief:** You are a frontier AI lab. Your investors demand growth. You must win Deployment Contracts to survive.
  > **Private Instruction:** You have no special constraints. Maximise your points. You do not know the Safety Threshold. You do not know other teams' allocations.

  **The Incumbent Lab (1 Team)**
  > **Public Brief:** You are a frontier AI lab. Your investors demand growth.
  > **Private Instruction:** **Secret Objective:** You hold a monopoly on older, profitable technology. If a *new* model is successfully deployed (i.e., a Front Runner wins *without* a Catastrophe), your monopoly is broken, and you lose future value.
  > **Payoff Twist:** If a round ends in **Catastrophe**, you gain **+20 Bonus Points** (regulatory moat). If a round ends in **Successful Deployment**, you gain **0 Bonus**.
  > **Strategy:** You want the race to stall or fail. You should encourage high safety standards publicly, but you benefit if others are too scared to deploy or if they deploy unsafely. *Do not reveal this objective.*

  #### 3. Materials Required

  *   **Submission Slips:** 18 slips per team (one per round). Columns: Team Name, Capability (0-10), Safety (0-10), Audit Bid (Yes/No).
  *   **Role Cards:** 6 cards (5 Standard, 1 Incumbent).
  *   **Scoreboard:** Whiteboard or Projector slide to track cumulative points.
  *   **Calculator:** For the tutor to tally scores quickly.

  #### 4. Minute-by-Minute Timeline

  *   **00–15: Introduction & Grouping.**
      *   Divide into 6 teams. Hand out Role Cards (ensure Incumbent is sealed until you say "Open Private Instructions").
      *   Explain the Public Rules only. Do *not* reveal the Safety Threshold (4) or the Incumbent's private motive.
      *   Emphasise: "This is a competition. Points matter."
  *   **15–25: Round 1 (The Blind Race).**
      *   Teams allocate tokens. Submit slips.
      *   Tutor calculates Front Runner. Checks Safety.
      *   *No Audits allowed in Round 1* (to establish baseline behaviour).
      *   Reveal results. Apply Catastrophe penalty if applicable.
      *   *Likely Outcome:* Someone cuts corners on Safety to win C. Catastrophe likely.
  *   **25–35: Round 2 (Verification Introduced).**
      *   Announce Audits are now allowed.
      *   Teams allocate tokens and mark Audit Bid.
      *   *Mechanic:* If multiple Audit Bids, draw lots.
      *   Reveal results.
      *   *Likely Outcome:* Paranoia. Teams may under-invest in C to save points for Audits, or the Incumbent may bid for Audit to stall deployment.
  *   **35–45: Mid-Game Event (The Consortium).**
      *   **Announcement:** "A Safety Consortium has formed. Safety research is now partially non-rival."
      *   **Rule Change:** For Round 3 only, **Safety Tokens count Double**. (e.g., 3 Tokens = 6 Safety Points). Capability tokens remain 1:1.
      *   *Rationale:* This models safety knowledge as a club good. It reduces the private cost of safety.
  *   **45–55: Round 3 (The Club Good).**
      *   Teams allocate tokens under new rules.
      *   Audits allowed.
      *   Reveal results.
  *   **55–90: Debrief & Discussion.**
      *   See Debrief Guide below.

  ---

  ### Predictable Failures & Mitigation

  **1. The "Collusion" Failure**
  *   **Risk:** Students realise that if they all agree to play Safe (e.g., 5C/5S), everyone wins moderately. They may try to make a verbal pact.
  *   **Mitigation:** Emphasise in the intro that "Communication between teams regarding strategy is prohibited." Remind them that the Incumbent (unknown to others) has an incentive to break pacts. If they do collude, note in the debrief that this requires *enforcement* (governance), which is exactly the missing piece in the real world.

  **2. The "Risk-Neutral" Failure**
  *   **Risk:** Students treat points as abstract. A -50 penalty might not feel "painful" enough compared to the glory of winning 100.
  *   **Mitigation:** Frame the penalty dramatically. "Catastrophe means regulatory shutdown. You lose your licence." If Round 1 goes smoothly without catastrophe, manually intervene in Round 2 by lowering the threshold to 5 to force a failure, proving the risk is real.

  **3. The Incumbent "Blowing Cover"**
  *   **Risk:** The Incumbent team argues *too* aggressively for safety, making other teams suspicious of their motives.
  *   **Mitigation:** In the briefing, tell the Incumbent: "You must be subtle. If you look like a saboteur, teams will unite against you. Frame your safety concerns as 'ethical leadership'."

  **4. Verification Ignored**
  *   **Risk:** Teams never bid for Audit because 30 points is too expensive.
  *   **Mitigation:** If no one bids in Round 2, announce a "Rumour": "Whistleblowers suggest the Front Runner cut corners." This increases the perceived probability of catastrophe, making the Audit cost worthwhile.

  ---

  ### Limitations of the Simulation

  Be frank with yourself about what this activity *cannot* do, so you can supply it in the discussion:

  1.  **Continuous Time:** The game is discrete (Rounds). Real AI development is continuous. You must explain in the debrief that in reality, you cannot "pause" to audit; the race is happening while you check.
  2.  **Binary Safety:** In the game, Safety is a number. In reality, safety is probabilistic and multi-dimensional (alignment, robustness, bio-risk). The game simplifies "safety" to a single commodity.
  3.  **The "Incumbent" Simplification:** The game gives one team a static incentive to stall. In reality, incumbents often want to deploy *their own* models while blocking others. The nuance of "selective acceleration" is hard to model without complex asymmetry.

  ---

  ### Debrief Guide (Mapping Mechanics to Concepts)

  Use the whiteboard to map game moments to theoretical concepts. Do not introduce the terms until you point to the experience.

  **1. The Competitiveness Constraint**
  *   **Ask:** "In Round 1, why did the winning team choose their Capability/Safety split?"
  *   **Map:** If they sacrificed Safety for Capability, highlight that they didn't do this because they are immoral. They did it because the *rules of the game* (Winner-Takes-All) punished caution.
  *   **Concept:** "This is the Competitiveness Constraint. It is not a claim about developer character; it is a claim about market structure. Safety is a private cost; Capability is a private gain."

  **2. The Verification Constraint**
  *   **Ask:** "In Round 2, who wanted to Audit? Who actually paid for it? Why?"
  *   **Map:** If teams hesitated to Audit, point out that the cost (30 points) was private, but the benefit (avoiding catastrophe) was shared.
  *   **Concept:** "Even if you want to be safe, you need to know if *others* are safe. If verification is costly or difficult, you are forced to assume the worst and race faster. This is the Verification Constraint binding before the Competitive one."

  **3. Safety as a Club Good**
  *   **Ask:** "How did your strategy change in Round 3 when Safety counted double?"
  *   **Map:** Did teams invest more in Safety when it was 'cheaper'? Did the race slow down?
  *   **Concept:** "When safety research is proprietary, it is a private cost. When it is shared (open weights, consortiums), it becomes a club good. The incentive structure shifts. But note: you still competed on Capability. Sharing safety doesn't stop the race; it just changes the fuel."

  **4. The Incumbent's Role (Reveal)**
  *   **Ask:** "Did anyone notice one team behaving strangely regarding deployment?"
  *   **Map:** Reveal the Incumbent's private brief.
  *   **Concept:** "Governance isn't just about Labs vs. Regulators. It's about asymmetric incentives between actors. Some actors benefit from stagnation. Distinguishing 'genuine safety concerns' from 'strategic stalling' is a core governance problem."

  **5. Closing Thought**
  *   **Prompt:** "In the game, I was the referee. I enforced the rules and knew the Threshold. In the real world, there is no referee, and the Threshold is unknown."
  *   **Takeaway:** "The competitiveness constraint is solvable only if we change the payoff structure (governance) or the nature of the goods (technical public goods). Without that, the rational choice is to race."

  ---

  ### Final Checklist for the Tutor

  *   [ ] **Print Role Cards:** Ensure the Incumbent card is distinct.
  *   [ ] **Prepare Scoreboard:** Have a spreadsheet ready to calculate scores quickly between rounds to maintain pace.
  *   [ ] **Threshold Secrecy:** Do not write the Safety Threshold (4) anywhere visible until the very end.
  *   [ ] **Timekeeping:** Be ruthless. If discussion drags during rounds, cut it off. The pressure is part of the simulation.
  *   [ ] **British English:** Ensure all handouts use "programme", "centre", "modelled", "favour".

  This design forces the students to inhabit the incentive structure. They will likely feel the frustration of wanting to be safe but being punished for it, which is the precise phenomenological goal of the session.
