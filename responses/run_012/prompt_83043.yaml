  *Simpler:* Verification is costly. If you don't verify, you risk the catastrophe. If you do verify, you lose resources to compete. This creates the bind. The "Verification Constraint" binds when the cost of verification is higher than the expected loss of the catastrophe *for the individual*, even if not for the group.
  *Actually, let's look at the prompt again:* "make that second constraint visible without my having to announce it."
