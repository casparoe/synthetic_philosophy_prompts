  **Joint Statement on Vagueness: An Adversarial Collaboration**

  **Preface**
  We, the undersigned, represent two dominant traditions in the philosophy of language: Epistemicism and Supervaluationism. For decades, our camps have talked past one another regarding the nature of vague predicates. This document records the results of a good-faith collaboration. We agree on the data and the structural problems, even if we diverge on metaphysical explanation. This statement is drafted by a neutral scribe to reflect positions both sides can endorse without concession on core doctrines.

  **1. Agreed Claims**

  1.  **The Sorites Phenomenon:** Both sides agree that Sorites paradoxes arise from plausible premises (e.g., removing one grain does not make a non-heap) leading to an implausible conclusion (one grain is a heap). Any adequate theory must explain why the premises seem true while blocking the conclusion.
  2.  **Borderline Cases:** There are cases where competent speakers, fully informed of non-semantic facts, hesitate to apply or withhold a predicate. This hesitation is a datum requiring explanation, not an error to be eliminated.
  3.  **Higher-Order Vagueness:** It is vague where the borderline cases begin. There is no sharp line between clear cases and borderline cases, nor between borderline cases and clear non-cases.
  4.  **The Definitely Operator:** Both sides accept a operator 'Definitely' (D) to mark clarity. If *p* is definitely true, it is not borderline.
  5.  **Penumbral Connections:** Logical connections between predicates must be preserved. If *x* is definitely red, *x* is definitely colored. Truth conditions must respect these dependencies even in borderline zones.
  6.  **Legal Vagueness:** In legal contexts (ordinances, statutes), vagueness creates genuine uncertainty regarding rights and obligations, leading to litigation costs regardless of the underlying metaphysics.
  7.  **Case Consensus:**
      *   (a) **Rideshare Ordinance:** Both agree it is currently indeterminate whether the ordinance applies to the borderline rideshare vehicle.
      *   (b) **3D-Printed House:** Both agree it is indeterminate whether the structure counts as a single-family home for tax purposes.
      *   (c) **The Heap:** Both agree that for some number *n*, it is unclear whether *n* grains constitute a heap.
  8.  **The Penumbral Lattice Model:** We agree on the formal definition: A vague predicate's extension is represented by a lattice of admissible precisifications; a sentence is supertrue if true on all precisifications, superfalse if false on all, and indeterminate otherwise; the definitely operator is a modal operator over the lattice.
      *   **Epistemicist Acceptance:** We accept this as a formal model of *epistemic alternatives*. The lattice represents possible worlds compatible with our knowledge, not semantic reality.
      *   **Epistemicist Rejection:** We reject the claim that the lattice represents genuine truth-value gaps or semantic indecision.
      *   **Supervaluationist Acceptance:** We accept this as a model of *semantic indecision*. The lattice represents admissible ways of making the language precise.
      *   **Supervaluationist Rejection:** We reject the claim that there is a single true precisification hidden within the lattice.

  **2. Disagreements Table**

  | Issue | Epistemicist Formulation | Supervaluationist Formulation | Crux |
  | :--- | :--- | :--- | :--- |
  | **(i) Sharp Boundary** | Bivalence entails a sharp boundary exists in reality; we are merely ignorant of its location. | There is no sharp boundary; truth-value gaps exist where no precisification settles the matter. | Is ignorance metaphysical or semantic? |
  | **(ii) Truth Values** | Borderline cases are strictly true or false; belief is unjustified. | Borderline cases lack a truth value; they are indeterminate. | Does bivalence hold for vague language? |
  | **(iii) Higher-Order Vagueness** | Higher-order vagueness is just deeper ignorance; the boundary of the boundary is sharp but unknown. | Higher-order vagueness threatens the model; if the set of precisifications is vague, the model collapses. | Can the boundary of the boundary be modeled? |
  | **(iv) Definitely Operator** | 'Definitely' is factive and generally obeys S4/S5 logic (DDp entails Dp; Dp entails DDp). | 'Definitely' is factive but S4 fails (Dp does not entail DDp) due to higher-order vagueness. | Does clarity iterate? |
  | **(v) Lattice Model Status** | The model is instrumental; it tracks knowledge states, not meaning constitutions. | The model is constitutive; it defines what truth means for vague language. | Is the model ontic or semantic? |
  | **(vi) Verbal Dispute** | The dispute is substantive; truth is bivalent. | The dispute is substantive; truth is supertruth. | Are we defining 'truth' differently? |

  **3. Cruxes and Predictive Tests**

  To move beyond stalemate, we identify specific tests where our theories yield different predictions regarding practice and meta-language.

  **Crux 1: The Rideshare Ordinance (Judicial Role)**
  *   **Shared Test:** A court must rule on the borderline rideshare vehicle.
  *   **Epistemicist Prediction:** The court *discovers* the correct application. There is a fact of the matter determined by social usage and intent, even if obscure. The ruling declares pre-existing truth.
  *   **Supervaluationist Prediction:** The court *creates* a sharp line. Since there was no fact of the matter, the ruling precisifies the language retroactively for future cases but acknowledges no prior truth.
  *   **Evidence Against Own View:**
      *   *Epistemicist:* If courts explicitly state they are legislating from the bench due to lack of fact, this undermines the discovery claim.
      *   *Supervaluationist:* If courts consistently treat prior usage as binding even in borderline zones without acknowledging discretion, this undermines the gap claim.
  *   **Moving the Debate:** Empirical study of judicial opinions regarding statutory interpretation in borderline cases.

  **Crux 2: The 3D-Printed House (Tax Fact)**
  *   **Shared Test:** Determining liability for tax exemption prior to any ruling.
  *   **Epistemicist Prediction:** There is a fact of the matter about the exemption status now. The taxpayer either owes the tax or does not, regardless of administrative confusion.
  *   **Supervaluationist Prediction:** There is no fact of the matter now. The liability is indeterminate until the tax authority stipulates a classification.
  *   **Evidence Against Own View:**
      *   *Epistemicist:* If tax authorities routinely waive penalties for borderline cases based on "reasonable uncertainty" rather than error, this suggests no prior fact existed.
      *   *Supervaluationist:* If taxpayers are held liable for "errors" in borderline zones where no clear rule existed, this suggests a fact was presumed.
  *   **Moving the Debate:** Analysis of tax code enforcement mechanisms regarding ambiguous structures.

  **Crux 3: The Penumbral Lattice Meta-Language**
  *   **Shared Test:** Is the set of admissible precisifications itself vague?
  *   **Epistemicist Prediction:** No. The set of admissible precisifications is sharp. Our ignorance about which precisification is correct does not make the set of options vague.
  *   **Supervaluationist Prediction:** Yes. To avoid a new sharp boundary around the precisifications, the set of admissible precisifications must itself be vague (higher-order vagueness).
  *   **Evidence Against Own View:**
      *   *Epistemicist:* If we cannot specify the constraints on admissibility without invoking further vague terms, the sharp set claim is untenable.
      *   *Supervaluationist:* If admitting vagueness in the precisifications makes the definition of supertruth incoherent, the model fails.
  *   **Moving the Debate:** Formal coherence of higher-order supervaluationary semantics.

  **Crux 4: The Sorites Series (Logic)**
  *   **Shared Test:** Validity of Modus Ponens across the series.
  *   **Epistemicist Prediction:** Modus Ponens is valid. One conditional premise in the series is false (at the sharp boundary).
  *   **Supervaluationist Prediction:** Modus Ponens is valid for supertruth, but fails for local truth preservation across borderline steps.
  *   **Evidence Against Own View:**
      *   *Epistemicist:* If we cannot identify which premise is false even in principle, the sharp boundary is occult.
      *   *Supervaluationist:* If logical inference becomes too weak to support ordinary reasoning, the theory is practically useless.
  *   **Moving the Debate:** Demonstrating whether the false conditional is identifiable or whether logic loss is tolerable.

  **4. Final Statement on Verbal Dispute and Semantic Indecision**

  We acknowledge that a portion of our dispute may be verbal, specifically concerning the definition of "truth." The Epistemicist defines truth as correspondence bivalent reality; the Supervaluationist defines truth as supertruth across precisifications. If we agree to distinguish "supertruth" from "truth," some friction dissolves. However, the metaphysical disagreement remains: does reality determine a unique extension for vague predicates, or does language underdetermine extension?

  Regarding the **Semantic Indecision View** (that vague predicates are underdetermined by convention):
  *   **Status:** This is the core of Supervaluationism. It is not a third position but the foundation of the Supervaluationist camp.
  *   **Compatibility:** The Epistemicist rejects semantic indecision as the *final* story, arguing indecision is merely epistemic limitation regarding conventions.
  *   **Impact on Statement:** This does not change the joint statement. Both sides agree that conventions underdetermine usage *from the speaker's perspective*. They disagree on whether this underdetermination is ontological (Supervaluationist) or epistemological (Epistemicist).

  We sign this statement acknowledging that while we share the map of the problem, we navigate the terrain differently. Future work must focus on the cruxes identified above rather than restating first principles.

  **Signed,**
  *The Epistemicist Representative*
  *The Supervaluationist Representative*
  *Neutral Scribe*
