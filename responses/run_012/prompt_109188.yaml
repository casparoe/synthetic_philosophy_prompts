prompt: |-
  Hey, I'm putting together a handout for a grad seminar on vagueness and I need something a bit unusual. Act as a philosopher of language who specializes in vagueness, and also as a neutral scribe. I want you to draft the joint statement of an adversarial colaboration between an epistemicist and a supervaluationist about vagueness. They've been arguing for years, mostly past each other, and I want the document they could both actually sign after a good-faith collaboration -- I want to see if teh two camps can agree on anything at all. Before you start writing, brainstorm a list of the key points of agreement and disagreement, then draft the statement. Think carefully about the wording of each disagreement so neither side would feel strawmanned. Take your time and work step by step.

  The document should have these parts:

  1. A numbered section of agreed claims. What can both sides sign? Include claims about the sorites paradox, borderline cases, higher-order vagueness, the definitely operator, penumbral connections between vague predicates, and the status of legal vagueness. They should agree on the data and on what needs explaining, even if they disagree on the explanation. Also include what they both accept about the following three cases: (a) the Rideshare Ordinance case -- a city ordinance says only taxicabs may pick up at the airport curb, and a rideshare driver's car is borderline; (b) the 3D-printed house case -- a property tax exemption for single-family homes is applied to a 3D-printed structure that shares a wall with a neighboring unit; (c) the classic sorites heap. And include what they both accept about the penumbral lattice model, which I'll define as follows: a vague predicate's extension is represented by a lattice of admissible precisifications; a sentence is supertrue if true on all precisifications, superfalse if false on all, and indeterminate otherwise; the definitely operator is a modal operator over the lattice. Say what each side accepts and rejects about this model.

  2. A disagreements table. Columns: issue; epistemicist's formulation (in wording they'd accept); supervaluationist's formulation (in wording they'd accept); crux. At least cover: (i) whether there is a sharp boundary in reality; (ii) whether borderline cases lack truth value or have an unknown truth value; (iii) whether higher-order vagueness is a problem for each view; (iv) whether the definitely operator is factive and whether it obeys the characteristic principles of S4 and S5 (i.e., whether definitely P entails definitely definitely P, and whether definitely P is entailed by definitely definitely P); (v) whether the penumbral lattice model is a good model; (vi) whether the dispute is partly verbal.

  3. A cruxes section. For each crux, give a shared test or case that both sides agree bears on it, and write down each side's prediction in advance. Use the three cases above plus the sorites series and the penumbral lattice meta-language question (is the set of admissible precisifications itself vague?). For each crux, also say what each side would count as evidence or argument against its own view, and whether there is anything both agree would actually move the debate. For example, for the Rideshare Ordinance, what would each side predict about whether a court can discover the correct answer versus create a sharp line? For the 3D-printed house, what would each predict about whether there's a fact of the matter about the tax exemption? For the penumbral lattice, what would each predict about the status of the meta-language?

  4. A short final section: if any part of the dispute is merely verbal, say which part and why. Also say whether the semantic indecision view -- the idea that vague predicates are underdetermined by our conventions, rather than having a hidden sharp cutoff or truth-value gaps -- is a third position or a version of one of the two, and whether it changes the joint statement.

  No citations, no bibliography, no reading list. You don't have web access, so don't pretend to cite sources, and don't quote any real text -- paraphrase. Keep it self-contained. Aim for something like 1200-1800 words. I'd really apreciate it.
