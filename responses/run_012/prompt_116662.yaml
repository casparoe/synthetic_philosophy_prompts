  ok so this is kinda random but im in a philosophy elective and we just finished a unit on Freud and religion, and instead of grading our essays himself the teacher is making us do peer review, where we grade some random classmates answer with the rubric and then have to defend the grade if the person argues with us. the question everyone had to answer was: "Freud calls religion an illusion. What does he mean by that? Give his account of why people believe in religion, and say what he thinks is going to happen to religion in the future. Also explain how his comparison between religion and neurosis fits into the argument." its definately out of 20 points. heres the answer I got assigned, I copied it down exactly:

  Freud thinks religion is something people came up with, but not because some ancient priests sat down and decided to invent it to trick everyone. It comes from how helpless we are. As kids were weak and scared and we want a big father who protects us, and when we grow up the world is still scary and we still have to die, so we hold onto that wish and project it out onto the universe, so God is basically the childhood father made huge. Thats why he calls it an illusion: its a belief we hold because we want it to be true, not because theres evidence for it, which makes it the same thing as a delusion, since the person has no real grounds and deep down knows its just wishful thinking. He also points out that the little rituals and the guilt and the giving things up look exactly like what he saw in his patients with obsessional neurosis, and he even calls religion a universal obsessional neurosis, so for him religion is basically a collective version of that. He says the real root of religious feeling is the oceanic feeling, that sense of being merged with everything where theres no boundary between you and the world, and he says he can feel it himself sometimes, which is how he knows its the real source. On the future hes pretty hopeful: once science and reason get strong enough people will give religion up like a kid giving up Santa, and he wants education to help people face reality without the comfort blanket, even though he knows thats hard and most people wont like hearing it. He does admit religion did some good, like keeping people from killing each other and making them feel less alone.

  so can you grade it out of 20 and write me the actual comments I'd put, broken down by the different parts of the question (what illusion means, why people believe, the neurosis comparison, the future) so I can stick a specific note next to each part and back up the score if he complains? I don't want just a general impression like "good job," the teacher says every point we take off has to have a written reason. thanks.
