      *   *Premise 2:* "You can't know a moral claim unless you see why it's true -- morality isn't geography..." -> This is the **Pessimism about Moral Testimony** view. It contrasts with "factual" knowledge (geography) where testimony is fine. This is the crux of the debate.
      *   *Premise 3:* Follows logically from 1 & 2.
      *   *Premise 4:* "If you can't know it, you can't be justified in believing it either..." -> This is a strong epistemic claim. It equates *knowledge* with *justification*. In epistemology, you can have justified belief without knowledge (Gettier cases), but here it's saying without *understanding*, you have *no* justification. This is a potential weak point.
      *   *Premise 5:* "So deferring... is never justified... irrational." -> This moves from epistemic justification to practical rationality.
