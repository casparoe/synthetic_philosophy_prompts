answer: |-
  This argument is a real philosophical position, not a trick your roommate made up. In academic circles, it's called **"Pessimism about Moral Testimony."** It's a serious view held by smart philosophers (like Sarah McGrath or Paul Bloomfield), but it is definitely not the settled law. It's one of the biggest fights in ethics right now.

  Here is the breakdown of where the argument breaks, why it looks convincing, and what you buy if you keep the parts you like.

  ### Where the Rot Starts: Step 4

  The argument looks solid because it flows smoothly, but the break happens at **Step 4**: *"And if you can't know it, you can't be justified in believing it either."*

  **Why it looks fine:**
  It sounds like common sense. If I can't explain *why* the bridge is safe, and I just say "I trust the engineer," do I *know* the bridge is safe? Maybe not. But Step 4 goes further: it says believing the bridge is safe is just a "guess with good manners." It implies that without deep understanding, you have zero reason to trust the expert.

  **Why it's broken:**
  It confuses **Knowledge** (deep understanding) with **Justification** (good reasons to believe).
  You can have good reasons to believe something without understanding the mechanics behind it.
  *   **Example:** You take medicine prescribed by a doctor. You don't know *why* the pill works (you can't explain the chemistry). You don't have "knowledge" of the cure in the deep sense. But you are perfectly **justified** in believing it will help you. It isn't a "guess." It's a rational bet based on the doctor's track record.

  If you cut the link at Step 4, the whole thing collapses. You can admit that listening to your grandmother didn't give you deep philosophical *knowledge* (Step 2), but insist that trusting her was still **rational and justified** (denying Step 4 and 5).

  ### How to Keep Step 2 (Your Preference)

  You said you'd rather keep Step 2 (*"Morality isn't geography... you have to see why it's true"*) than Step 5. You can do this, but you have to change how you view "learning from grandma."

  If you keep Step 2, you are agreeing with the "Pessimists." You are saying morality is more like **math** than geography.
  *   **Geography:** If I tell you "Paris is in France," you know it. You don't need to visit.
  *   **Math:** If I tell you "The derivative of X is Y," you don't really *know* it until you work through the equation yourself.

  If morality is like math, then your grandmother didn't hand you "moral facts." She handed you **moral training wheels.**

  **The "Scaffold" View:**
  When you were a kid, you couldn't grasp the complex "why" behind "don't steal." So your grandmother gave you the rule. You were justified in believing her because she was a reliable guide. But that belief was provisional. It was a placeholder until you were old enough to understand the *reasons* (fairness, harm, trust).

  **What this costs you:**
  If you keep Step 2, you have to admit that **moral maturity requires outgrowing testimony.**
  *   **The Cost:** You cannot stay in the "I trust my priest" phase forever. If you are an adult and you *only* believe stealing is wrong because the Bible says so, and you have no idea *why* stealing hurts people or breaks trust, then Step 5 actually *does* apply to you. You are being irrational *now*, even if you weren't irrational as a child.
  *   **The Payoff:** You get to keep the idea that morality is special. It requires personal engagement. You aren't just collecting moral facts like Pokémon cards; you have to digest them.

  ### Consensus vs. The Fight

  You asked for the lay of the land among people who actually work on this. Here is the honest split:

  **1. Where they agree:**
  Almost everyone agrees that **blind faith is weak.** Even the "Optimists" (who think testimony is fine) agree that a person who cannot explain *any* reasons for their moral views is less morally praiseworthy than someone who understands the reasons. Everyone agrees that understanding the "why" is the gold standard.

  **2. Where they are fighting:**
  *   **The Pessimists (Your Roommate's Camp):** They argue that relying on testimony actually *prevents* you from understanding. If you just accept the answer, your brain turns off. They think moral worth comes from the *struggle* to figure it out.
  *   **The Optimists (The Counter-Camp):** They argue this is elitist. They say, "Wait, so only philosophy professors can be moral?" They argue that trusting a community or a tradition is a valid way to access moral truth, especially for people who don't have the time or training to debate ethics all day. They say Step 2 is false: Morality *is* like geography in some ways. Some things are just true, and you can learn them from others.
  *   **The Middle Ground (Most Common):** Many philosophers think testimony is fine for **belief**, but not for **action**. You can believe your priest that "charity is good." But when you actually go out to give money, *you* need to be doing it because *you* think it's good, not just because you're obeying orders.

  ### Summary for Your Roommate

  Tell your roommate this:

  1.  **Step 4 is the weak link.** Trusting an expert isn't a "guess," even if I don't understand their expertise. I am justified in trusting my grandma without being a moral philosopher.
  2.  **I'm keeping Step 2, but rejecting Step 5.** I agree morality requires understanding. But that means my childhood beliefs were **training**, not final answers.
  3.  **The Conclusion is too strong.** There *can* be moral authority, but it's temporary. A legitimate moral authority is a teacher who helps you see the "why" for yourself, not a commander who demands you stop looking for the "why."

  If he says, "But you still don't *know* it," you say: "I don't have deep knowledge yet, but I'm rational to trust the source until I do. That's not irrational; that's how learning works."
