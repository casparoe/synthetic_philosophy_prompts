prompt: |-
  I'm in a reading group on formal epistemology and two of my friends have been going at each other for weeks over Aumann's agreement theorem. One of them, call her the Aumannian, says the theorem shows that two agents who share a prior and whose posteriors become common knowledge simply cannot rationally disagree, so any persistent disagreement among people who know each other's evidence and reasoning has to come from different priors, private information, or a failure of common knowledge. The other, call him the realist, says that's a mathematical curiosity that assumes away everything interesting: bounded rationality, heterogeneous priors, and the fact that you can never really know the other person is updating correctly. They keep talking past each other, and I want the document they should have produced after a good-faith adversarial collaboration: the joint statement they could both actually sign. Can you draft it for me?

  I'd like it to have a numbered list of claims both sides accept — about what the theorem says and doesn't say, what it assumes, and what it implies about persistent disagreement — then a table of the precise disagreements, with each side's position written in wording that side would accept as its own. I suspect one crux is whether common knowledge of rationality is a harmless idealization or a fatal one, and another is whether the theorem has any normative force for actual people who can't inspect each other's priors. For each crux, please give a concrete case or argument that both sides would agree bears on it, and write down what each side predicts about that case in advance. If part of their dispute is merely verbal, say which part and why.

  One more thing: we came up with a new case neither of them has seen. Two agents, A and B, share a prior and both know each other's likelihoods, but A has a private reason to distrust B's ability to conditionalize — she thinks B sometimes updates on the wrong proposition. They then learn each other's posteriors and learn that they disagree. Does Aumann's theorem apply here, or does the private distrust block the common-knowledge condition? What would each camp predict, and would either have to change its stated position? Please add a short section on that case at the end. Also, we're all philosophers, not economists, so keep the notation light and explain any formal idea in plain language.
