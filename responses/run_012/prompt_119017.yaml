  *   **Claim:** "That is a serious blow to verificationism and to anti-realist accounts of truth, which rested on the idea that truth is not evidence-transcendent."
      *   **Evaluation:** Correct. This accurately identifies the philosophical stakes and the "cost" of the paradox for anti-realism. (5 points)
  *   **Claim:** "If one insists on keeping the knowability principle, one would have to deny that there are any unknown truths at all..."
