      *   **Interventionist (INT):** Woodward-style manipulationism. $C$ causes $E$ iff an intervention on $C$ changes $E$ while holding other variables fixed (at *some* value, not necessarily actual). If $S_2$ is held open, intervening on $S_1$ changes $L$. So $S_1$ is a cause.
