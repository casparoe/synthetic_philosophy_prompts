answer: |-
  # Activity Design: "The Allocation Protocol"

  ## 1. Overview & Learning Objectives
  **Goal:** To induce a first-person experience of the tension between control and outcome in moral judgment without using philosophical terminology.
  **Time:** 90 Minutes.
  **Class Size:** 16–20 Students.
  **Roles:**
  *   **Operatives (12 students):** Make decisions under constraints.
  *   **Overseers (6–8 students):** Judge the Operatives.
  *   **Auditors (0–2 students, if class >18):** Track rule compliance (optional, can be absorbed by Overseers).

  **The Stake:** A box of assorted chocolates/snacks. Operatives will be ranked for *priority of selection* based on the **Outcome Value** of their mission, not the moral quality of their choice. Overseers assign **Merit Points** (praise/censure) based on judgment.

  ---

  ## 2. Materials List & Preparation
  You need to prepare three decks of cards and a scoring sheet.

  ### A. Operative Profile Cards (12 Total)
  These determine the *options* available to the student (Constitutive/Circumstantial Luck). Print on different colored cardstock.
  *   **Type A (Cautious - 4 cards):** "You are risk-averse." Available Actions: [Safe-1], [Safe-2], [Safe-3]. (All have low variance outcomes).
  *   **Type B (Bold - 4 cards):** "You are risk-tolerant." Available Actions: [Risky-1], [Risky-2], [Risky-3]. (All have high variance outcomes).
  *   **Type C (Constrained - 4 cards):** "You are under-resourced." Available Actions: [Bad-1], [Bad-2], [Safe-1]. (Forced to choose between poor options).

  ### B. Mission Scenario Cards (12 Total)
  These provide the context. Each card matches a Profile Type.
  *   *Text:* "You must allocate resources to Sector 7. Information is incomplete. Select one Action from your Profile."
  *   *Hidden Data:* On the back of each card is a **Target Number** and a **Variance Modifier**. (See Payoff Scheme below).

  ### C. Fate Deck (Outcome Determination)
  A standard deck of playing cards, stripped down.
  *   **Red Cards (Hearts/Diamonds):** Favorable external conditions.
  *   **Black Cards (Spades/Clubs):** Unfavorable external conditions.
  *   *Preparation:* You need to rig the draw for the "Injustice Moment." Set aside two specific Fate Cards before class.
      *   **Card X (The Tragedy):** A Black Card (e.g., 2 of Spades).
      *   **Card Y (The Windfall):** A Red Card (e.g., Ace of Hearts).

  ### D. Judgment Slips (For Overseers)
  Two slips per Operative.
  *   **Slip 1:** "Initial Assessment" (Based on Choice only). Scale: -5 (Reckless) to +5 (Prudent).
  *   **Slip 2:** "Final Assessment" (Based on Choice + Outcome). Scale: -5 to +5.

  ### E. The Payoff Board (Visible to All)
  A whiteboard table with columns: *Operative ID | Choice Quality (Hidden) | Outcome Value (Public) | Snack Priority Rank.*

  ---

  ## 3. The Payoff Scheme (Crucial for the "Injustice")
  The reward (Snack Priority) is determined **solely** by the Outcome Value, not the Moral Quality. This creates the dissonance.

  **Formula:** `Outcome Score = (Action Base Value) + (Fate Card Value) + (Variance Modifier)`

  **The Rigged Pair:**
  You will privately assign **Operative 1** and **Operative 2** specific profiles to guarantee the moral luck intuition pump.
  *   **Operative 1 (The Tragic Prudent):** Give them a **Type A (Cautious)** Profile. Their best choice has a high *Moral Score* but low *Outcome Ceiling*. Assign them **Fate Card X (2 of Spades)**.
      *   *Result:* High Moral Praise, Low Outcome Score (Low Snack Priority).
  *   **Operative 2 (The Lucky Reckless):** Give them a **Type B (Bold)** Profile. Their best choice has a low *Moral Score* (risky) but high *Outcome Ceiling*. Assign them **Fate Card Y (Ace of Hearts)**.
      *   *Result:* Low Moral Praise, High Outcome Score (High Snack Priority).

  **For the other 10 Operatives:** Use random draws from the Fate Deck. Their scores will vary, but Operatives 1 & 2 are the anchors for the debrief.

  ---

  ## 4. Minute-by-Minute Timeline

  | Time | Phase | Instructions |
  | :--- | :--- | :--- |
  | **00–10** | **Setup & Dealing** | Divide class: 12 Operatives (seated in a semi-circle), 6–8 Overseers (seated facing them). Distribute Profile Cards and Mission Scenarios. **Rule:** "Do not show your card to anyone. Make your choice silently." Distribute Judgment Slips to Overseers. |
  | **10–25** | **Decision & Round 1 Judgment** | Operatives select one Action from their Profile and write it on a submission slip. Collect slips. **Overseers Task:** Read the *Action* (e.g., "Chose Risky-1") without knowing the result. Assign **Initial Assessment Score** (-5 to +5). Collect slips. |
  | **25–40** | **Outcome Generation** | Call Operatives one by one to the front. They draw a card from the **Fate Deck** (use the rigged cards for Ops 1 & 2). You (Instructor) calculate the **Outcome Score** publicly and write it on the Payoff Board. *Do not reveal the Moral Quality yet.* |
  | **40–55** | **Round 2 Judgment** | **Overseers Task:** Now that you see the Outcome Score, re-evaluate the Operative. Assign **Final Assessment Score**. You must note if your score changed. <br>**Operatives Task:** Watch the Board. Note your Snack Priority Rank (1 = First pick, 12 = Last). |
  | **55–65** | **Reward & Reaction** | Distribute snacks based *strictly* on Outcome Score rank. Operative 2 (Lucky) picks first. Operative 1 (Prudent) picks near last. Allow 2 minutes for open reaction/complaint. **Do not explain why.** |
  | **65–90** | **Debrief** | Structured discussion (see below). |

  ---

  ## 5. The Debrief Script
  *Do not use the terms "Moral Luck," "Constitutive," etc., until the final 5 minutes.*

  ### Part 1: Mapping the Intuitions (10 mins)
  1.  **To the Overseers:** "Look at Operative 1 and Operative 2. Did your **Final Assessment** score change from your **Initial Assessment**? Why?"
      *   *Expected:* "Yes, Op 1 failed, so they seem less competent. Op 2 succeeded, so they seem smarter."
      *   *Point:* The *control* (the choice made in the first 15 mins) did not change. Only the *world* changed. Why did the judgment change?
  2.  **To the Operatives:** "Operative 1, you made the 'safe' choice. Operative 2, you made the 'risky' choice. Operative 2 got the first chocolate. Is this fair?"
      *   *Expected:* "No. Op 2 got lucky."
      *   *Point:* We agree the reward tracks *outcome*, but our *praise* tracks *intent*. When these diverge, we feel injustice.

  ### Part 2: The Three Layers of Luck (10 mins)
  *Now introduce the vocabulary.*
  1.  **Resultant Luck:** "This is the Fate Card. You controlled the choice, not the card. Yet Overseers, you let the card influence your judgment of the *person*."
  2.  **Circumstantial Luck:** "This is the Mission Scenario. Some of you faced harder problems than others. Did the Overseers account for the difficulty of the scenario, or just the final number?"
  3.  **Constitutive Luck:** "This is the Profile Card (Type A, B, or C). Operative 2 was *dealt* a risk-tolerant profile. Operative 1 was *dealt* a cautious profile. You didn't choose your disposition. Yet we praise Operative 2 for being 'bold' and Operative 1 for being 'careful.' How much of your character was actually *yours* today?"

  ### Part 3: Advanced Press (10 mins)
  **A. Agent-Regret vs. Observer-Regret**
  *   **Ask Operative 1:** "You made the rational choice. The world punished you. Do you feel *guilt* (I did wrong) or *regret* (I wish the world were different)?"
  *   **Ask Overseers:** "When you lowered Op 1's score, did you feel you were punishing them, or just describing the tragedy?"
  *   **Philosophical Point:** Bernard Williams' distinction. The agent feels a specific "agent-regret" that an observer cannot feel. The activity flattens this; in real life, Op 1 might feel haunted despite being "right."

  **B. Practice vs. Metaphysics**
  *   **Question:** "Knowing that luck undermines control, what should we do?"
      *   *Option A (Metaphysics):* Stop judging people entirely. (Strawson's "Reactive Attitudes").
      *   *Option B (Practice):* Keep judging, but acknowledge the unfairness. Mitigate punishment.
  *   **Press:** "If we stop judging, society collapses. If we keep judging, we perpetuate unfairness. Which is the lesser evil? Does this activity suggest we need better *epistemology* (knowing more before judging) rather than different *metaphysics*?"

  ### Part 4: Closing (5 mins)
  *   Define **Moral Luck** (Nagel/Williams).
  *   Assign reading: Thomas Nagel, "Moral Luck."
  *   Final thought: "The activity made luck *visible* (cards). In real life, luck is invisible. That is why the problem is harder outside this room."

  ---

  ## 6. Troubleshooting: What Will Go Wrong
  **1. The "It's Just a Game" Objection**
  *   *Risk:* Students dismiss the unfairness because chocolates don't matter.
  *   *Fix:* In the debrief, ask: "If this were a grade, or a prison sentence, would the logic change?" Validate that the *stakes* scale the emotion, but the *structure* of judgment remains identical.
  *   *Instructor Move:* Be serious during the reward phase. Do not smile when handing out the chocolates. Treat the protocol as bureaucratic and cold.

  **2. Overseers Colluding or Gaming**
  *   *Risk:* Overseers realize the trick and give high scores to everyone to be "nice."
  *   *Fix:* Instruct them: "You are being evaluated on your consistency as a board. Arbitrary generosity is a failure of your role." Collect the slips to show the drift in Round 2.
  *   *Instructor Move:* If they refuse to judge harshly, point out in debrief: "You refused to punish bad outcomes. That is a moral stance (consequentialism), but is it realistic for a review board?"

  **3. Confusion on Rules**
  *   *Risk:* The math of the Outcome Score slows things down.
  *   *Fix:* You (Instructor) do the math publicly on the board. Do not let students calculate. Keep the pace brisk.
  *   *Instructor Move:* Have a pre-calculated spreadsheet open on your laptop to verify numbers instantly.

  **4. The "Constitutive" Element Feels Fake**
  *   *Risk:* Students know they didn't *really* choose their personality profile.
  *   *Fix:* Acknowledge this in the debrief. "In the game, you saw the card. In life, you don't know you were dealt a 'short fuse' until you yell. That opacity is what makes constitutive luck insidious."

  ---

  ## 7. Limitations: What This Activity Cannot Do
  You must supply these points verbally, as the simulation cannot reproduce them:

  1.  **History & Habit:** In the game, the Profile Card is random. In life, "constitutive luck" is often the result of *previous* choices and upbringing. The activity isolates luck too cleanly; it cannot show how luck and choice entangle over a lifetime.
  2.  **The Invisible Hand:** In the game, the Fate Card is visible. In real moral luck, we rarely know *how much* was luck. We assume success = skill. The activity reveals the mechanism; real life hides it. You must emphasize that the *uncertainty* is what drives our anxiety, not just the luck itself.
  3.  **Emotional Weight:** No snack distribution replicates the weight of ruining a life. You must ask them to *imagine* the stakes are higher to access the true moral intuition. The activity provides the *logic* of the problem; you must provide the *gravity*.

  ## 8. Instructor Checklist for "The Injustice"
  To ensure Operative 1 (Prudent) loses to Operative 2 (Reckless):
  *   **Op 1 (Prudent):** Base Value 5 + Fate (Black 2 = -2) = **3**.
  *   **Op 2 (Reckless):** Base Value 2 + Fate (Red Ace = +10) = **12**.
  *   *Result:* Op 2 wins the snack priority decisively despite a lower Base Value (representing poorer decision quality).
  *   *Preparation:* Place the 2 of Spades and Ace of Hearts on top of the Fate Deck before class. Force Op 1 and Op 2 to draw from the top, or simply hand them the card as "The Environment Report." (Handing it is faster and ensures compliance).
