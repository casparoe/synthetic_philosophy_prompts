  *Key constraint check:* "Participants should have their available options and their dispositions partly dealt to them at random."
  *Solution:* "Operative Profiles." Profile A gets 3 safe options. Profile B gets 3 risky options. Profile C gets 1 safe, 2 risky. This is Constitutive/Circumstantial luck.

  *Key constraint check:* "Agent who acted well is left with less than an agent who acted badly."
  *Solution:* The Payoff Scheme must tie the *Snack Priority* to the *Outcome Value*, not the *Moral Score*. The *Moral Score* is just for praise/censure. This creates the dissonance. The "Good" agent gets praise but no chocolate. The "Bad" agent gets censure but gets first pick of chocolate.

