      *   **Introduction:** Acknowledge the difficulty. Define RC simply.
      *   **The Logic of RC:** Explain the "Mere Addition" or "Spectrum" argument. Use the A $\to$ Z continuum.
      *   **Transitivity:** Explain that if A $\ge$ B, B $\ge$ C... then A $\ge$ Z. Since each step looks "okay" (more people, slightly less quality, more total good), transitivity forces us to accept Z is okay. To reject Z, we must break the chain (deny transitivity). Explain "imprecise equality" or "incommensurability."
      *   **The NMRP Principle:**
