answer: |-
  This is a practical protocol designed for your specific constraints: limited staff, messy sources, and high community stakes. It is not a substitute for a PhD in history, but it is a firewall against "vibes-based" historiography.

  It divides the work into two distinct phases: **The Evidence Audit** (your job as research staff) and **The Interpretive Decision** (the Board's job).

  ### Part 1: The Afternoon Protocol (The Evidence Audit)

  This checklist is for pre-1900 claims. Run this on a single sheet of paper. If a step fails, you stop or downgrade the claim. You cannot skip steps.

  **Step 1: Provenance & Proximity (The "When and Who" Test)**
  *   **Question:** Is the source contemporary to the event (within 5 years), or is it memory/tradition?
  *   **Question:** Is the creator a direct witness, or repeating what they heard?
  *   **Pass:** Contemporary document OR direct witness account.
  *   **Fail:** Oral tradition recorded >20 years after the event; family lore without paper trail; items dated by pencil on the back (without corroborating physical evidence).
  *   **The Rule:** If the source is >20 years post-event, it is not *evidence of the event*. It is *evidence that people believed the story later*.
  *   **Stop Condition:** If you have *only* sources >20 years post-event, you cannot claim the event happened as fact. You can only claim "Tradition holds..."

  **Step 2: The Bias Vector (The "Who Benefits" Test)**
  *   **Question:** Does the source benefit from this claim being true?
  *   **Question:** Is the source hostile to the subject?
  *   **The Rule:**
      *   **Friendly Source claiming Virtue:** Low value. (e.g., A son saying his father was generous).
      *   **Hostile Source claiming Vice:** High value. (e.g., A rival newspaper saying the father was stingy).
      *   **Friendly Source admitting Vice (Admission Against Interest):** Very High value. (e.g., The son writing "Father was accused of theft, and while he said it was a loan, he did take the money.")
  *   **Stop Condition:** If your *only* source is a friendly source claiming virtue, and there is no corroboration, the claim is unproven.

  **Step 3: The Silence Test (The "Expected Record" Test)**
  *   **Question:** If this event happened, would we expect a paper trail?
  *   **High Expectation:** Land transfers, births/deaths, fires, crimes, large financial transactions.
  *   **Low Expectation:** Secret activities (Underground Railroad), private conversations, informal agreements.
  *   **The Rule:**
      *   If Expectation is **High** and Record is **Silent**: Evidence leans toward *Did Not Happen*.
      *   If Expectation is **Low** and Record is **Silent**: Evidence is *Neutral*. Silence is not proof of absence.
  *   **Stop Condition:** If the event requires a legal record (like a deed) and none exists, you cannot claim it happened as fact.

  **Step 4: Corroboration (The "One is None" Test)**
  *   **Question:** Is there a second independent source?
  *   **Definition of Independent:** Not a copy, not a reprint, not a family member repeating the same story.
  *   **The Rule:**
      *   **One Source:** Establishes that the *story exists*, not that the *event happened*.
      *   **Two+ Sources:** Can establish probability.
  *   **Stop Condition:** If you have only one source, and it fails Step 1 (not contemporary) or Step 2 (biased self-interest), the claim is **Legend**, not History.

  **Step 5: Physical Evidence Check**
  *   **Question:** Does the physical object (building, photo, artifact) definitively prove the claim, or is it consistent with *other* explanations?
  *   **The Rule:** A "false wall" could be a hiding spot, or it could be a cold cellar niche. A photo dated "1873" in pencil could be 1873 or 1923.
  *   **Stop Condition:** If the physical evidence has a common alternative explanation, it cannot carry the weight of the claim alone.

  ---

  ### Part 2: The Decision Matrix (Staff vs. Board)

  Once the Audit is done, you fill out this matrix. This separates *truth* from *policy*.

  | Evidence Verdict (Staff Decision) | Meaning | Who Decides Display? | Allowed Language |
  | :--- | :--- | :--- | :--- |
  | **Substantiated** | Meets Steps 1-4. Multiple sources or high-quality single source. | Staff | "This happened." |
  | **Plausible** | Meets some steps, lacks others. Biased source admits it, or physical evidence is strong but not definitive. | Staff (with Board notification) | "Evidence suggests..." / "Likely..." |
  | **Unproven / Legend** | Fails Steps 1 or 4. Only oral tradition or single biased source. | **Board** (Staff recommends "Legend") | "Local tradition says..." / "Story holds..." |
  | **Refuted** | Evidence proves it did *not* happen. | Staff | "Contrary to popular belief..." |

  **The Boundary Line:**
  *   **Your Job:** Determine which row of the matrix the claim falls into. The Board cannot argue you out of "Unproven" if the sources aren't there.
  *   **Their Job:** Decide if an "Unproven" story is still worth telling *as a story*. They can choose to display the UR house, but the label *must* reflect the "Unproven" status.

  ---

  ### Part 3: Case Study Runs

  Here is the protocol applied to your two scenarios.

  #### Case 1: The Underground Railroad House
  **The Claim:** The house was a stop on the Underground Railroad (1850s).
  **The Sources:**
  1.  Oral tradition recited at the County Fair starting in 1930.
  2.  The cellar has a "false wall" niche.
  3.  No papers, no diaries, no newspaper mentions from the 1850s.

  **The Audit:**
  *   **Step 1 (Proximity):** **FAIL.** The oral tradition starts 1930. The events are 1850s. That is an 80-year gap. No living witnesses in 1930. This is not evidence of the event; it is evidence of a 1930s story.
  *   **Step 2 (Bias):** **NEUTRAL.** The storytellers in 1930 gain community prestige from the claim. No hostile sources to weigh.
  *   **Step 3 (Silence):** **NEUTRAL.** UR activity was secret. We do not expect a paper trail. Silence does not disprove it.
  *   **Step 4 (Corroboration):** **FAIL.** One source (the oral tradition). The physical feature (cellar) is not a document.
  *   **Step 5 (Physical Evidence):** **FAIL.** A "false wall" in a pre-1900 cellar is architecturally consistent with storage niches, insulation shifts, or structural bracing. It is not definitive proof of hiding people.

  **Verdict:** **Unproven / Legend.**
  **Why you won't like this:** You probably want the UR designation. It's morally good and draws visitors. But the procedure forces you to admit you have no evidence from the time period.
  **Display Language:** You cannot say "This was a station." You must say: *"Local tradition since 1930 identifies this home as a stop on the Underground Railroad. While no contemporary records confirm this, the cellar features a niche consistent with hiding places."*
  **Authority:** You (Staff) declare it "Unproven." The Board can decide to keep the exhibit, but they cannot force you to change the label to "Fact."

  #### Case 2: The Founder's Misdeed
  **The Claim:** The Town Founder burned down a neighbor's mill to clear land competition in 1845.
  **The Sources:**
  1.  *History of Our County* (1902), written by the Founder's grandson.
  2.  Passage reads: *"Critics have often claimed my grandfather burned the Miller mill to secure his own site. This is a lie. He purchased the burnt remains from the Miller estate fairly, as the records show."*
  3.  No other sources exist. The Miller family left town.

  **The Audit:**
  *   **Step 1 (Proximity):** **FAIL.** Written 1902, event 1845. 57-year gap.
  *   **Step 2 (Bias):** **PASS (Crucial Step).** The source is the Founder's grandson (Friendly). He is trying to defend the family. However, he makes an **Admission Against Interest**. To deny the *arson*, he admits the *mill burned* and the *grandfather bought the land immediately after*. A friendly source denying a crime often confirms the circumstances surrounding it.
  *   **Step 3 (Silence):** **NEUTRAL.** Arson is a crime, but if no one was charged, no court record would exist.
  *   **Step 4 (Corroboration):** **FAIL.** Only one source.
  *   **Step 5 (Plausibility):** **PASS.** The grandson wouldn't invent the accusation if it wasn't already a known rumor in 1902. The specific detail (buying the burnt remains) suggests knowledge of the transaction.

  **Verdict:** **Plausible.**
  **Why this is hard:** This indicts your town's namesake. The Board will hate this.
  **The Nuance:** The protocol prevents you from saying "He definitely committed arson." But it allows you to say "The accusation was persistent enough that his own family felt compelled to deny it in 1902, admitting the mill burned and he profited."
  **Display Language:** *"In 1902, the Founder's descendant felt compelled to deny long-standing rumors that the Founder burned the Miller Mill. While arson was never proven, the family admitted the mill burned and the Founder purchased the land immediately after."*
  **Authority:** You (Staff) declare it "Plausible." The Board cannot force you to call it "Refuted" or "False" because the 1902 text admits the core circumstances.

  ---

  ### Part 4: What This Procedure Cannot Do

  I need to be straight with you about the limitations, or this will fail when the politics get hot.

  1.  **It Cannot Force the Board to Be Brave:** The Board can vote to remove the Founder's label entirely rather than display "Plausible." They can vote to spend money on a new plaque for the UR house that says "Station" anyway. Your power is to refuse to sign off on the research. If they override you, you need a disclaimer in the journal: *"Research staff classification: Legend. Board classification: Fact."*
  2.  **It Cannot Create Evidence:** If the only source is the 1930 oral history, this procedure will always result in "Legend." You cannot wish a second source into existence.
  3.  **It Cannot Solve "Silence" Ambiguity:** In the UR case, silence is neutral. In the Founder case, silence on the arson charge is neutral. You will often end up with "Plausible" or "Unproven" rather than "True" or "False." This frustrates people who want certainty.
  4.  **It Cannot Stop Donors:** If the person who donated the display case demands the UR label say "Fact," this procedure gives you the ammunition to say "No," but it doesn't stop them from threatening to pull the case. You need your Board to back the *process*, not just the *result*.

  ### Implementation Advice

  1.  **Print the Matrix:** Laminate the Decision Matrix. Keep it on the desk. When a Board member says, "But we *know* it was a UR station," point to Step 1. "The protocol says 1930 is too late for 1850s fact." Make the paper the bad guy.
  2.  **The "Legend" Category is Your Friend:** Don't treat "Legend" as "Fake." Treat it as "Cultural History." It allows you to keep the stories people love (UR house) without lying about the evidence. "This story tells us what the town valued in 1930" is a valid museum label.
  3.  **Pre-Approval:** Get the Board to vote on adopting this *procedure* before you evaluate any specific controversial claim. If they agree to the rules of the game beforehand, they can't cheat when they don't like the score.

  This system moves the argument from "I feel this is true" to "This source fails Step 1." It won't stop the politics, but it will stop the gaslighting of your own research.
