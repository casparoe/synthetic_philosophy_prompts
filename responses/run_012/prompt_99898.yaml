prompt: |-
  I run the research side of a small county historical society — two paid staff, a dozen volunteers, a quarterly journal, and exhibit labels for the little museum. Nobody on the team has any training in historiography, we're just people who like local history, and at this point we're deciding what to accept, reject, or hedge by vibes, which means whoever is loudest in the room, or whoever donated the display case, usually wins.

  What I want from you is a procedure we can actually run, in an afternoon, on a claim about something that happened here before about 1900. A checklist in order: what to ask first, what counts as a good enough answer at each step, when the procedure just stops with a no, and where it stops being a question about evidence at all and turns into a question about what we want to be true. It has to work on the kinds of sources we actually have, not the kinds in the textbooks: a county history from 1902 written by a man whose own family is in the story, a shoebox of letters with no dates and no envelopes, an obituary that may have been written by the deceased's daughter, a photograph someone insists is from 1873 because that's what's penciled on the back, an oral tradition that's been recited at the fair every year since 1930, and a single old newspaper clipping that is the only thing in existence about a whole event.

  Two things I'd like it to be honest about. First, our sources mostly disagree with each other, or there's only one of them — a huge share of what we deal with is a single document. So when is one source enough? When does silence in the record count as evidence that something didn't happen, versus just evidence that nobody bothered to write it down? And does a source being biased — a booster's history, a family's own account, a rival town's newspaper — make it useless, or does it depend on which way the bias pushes, so that a hostile source admitting something is worth more than a friendly one? I don't know how to think about any of that and I suspect there's a way.

  Second, several of these claims matter a lot to living people. Whether the town founder did something terrible to a neighboring settlement. Whether a certain house was a stop on the Underground Railroad. Whether a family's land was taken unfairly in the 1840s. Our board cares about feelings and I get it, but I want the procedure to keep three things seperate: what the evidence supports, what we'd like to be true, and what we might decide to say anyway for other reasons. And I want it to tell me which of those calls is mine to make and which ones have to go to the board, because right now everything goes to the board and it's a mess.

  Then run the procedure on two of these cases and show me the whole thing working. One: the Underground Railroad house, where all we have is the 1930 fair tradition plus a cellar with a false wall. Two: the founder, where the only source is the 1902 county history, written by a descendant, who mentions the event in passing while defending the family. I'd like at least one of those to come out in a way I won't like, so I can see the procedure isn't just going to ratify whatever we were already going to say. And be straight with me about what the procedure can't do — I don't want a fake algorithm that pretends everything is decidable, but I also don't want to be told it's a judgment call at every step, because then it's not a procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Research lead at a small county historical society (2 staff, 12 volunteers, quarterly journal, small museum).
      *   **Problem:** No formal historiography training. Decisions made by "vibes," loudest voice, or donor influence.
      *   **Goal:** A practical, afternoon-run procedure/checklist for evaluating pre-1900 historical claims.
      *   **Constraints:** Must work with *actual* messy sources (booster histories, undated letters, family obits, penciled photos, oral traditions, single clippings).
      *   **Key Issues to Address:**
          *   Single source sufficiency.
          *   Silence in the record (negative evidence).
          *   Bias (hostile vs. friendly sources).
          *   Separation of evidence, desire, and public relations (board decisions).
          *   Decision authority (Staff vs. Board).
      *   **Deliverables:**
          *   The Procedure/Checklist.
          *   Two Case Studies (Underground Railroad house, Founder's misdeed).
          *   One case must yield an uncomfortable result (not just ratifying preconceptions).
          *   Honest limitations of the procedure.

  2.  **Deconstruct the Historiography for Laypeople:**
      *   Academic historiography is too abstract. Needs to be operationalized.
      *   Core concepts needed: Provenance, Corroboration, Bias Analysis, Plausibility, Burden of Proof.
      *   Need a "Traffic Light" system or similar to make it actionable (Go, Caution, Stop).
      *   Need a clear distinction between *Historical Verdict* (Staff) and *Interpretive Policy* (Board).

  3.  **Drafting the Procedure (The "Afternoon Protocol"):**
      *   *Step 1: Source Inventory.* What do we actually have? (Physical object vs. story).
      *   *Step 2: Provenance & Dating.* Is it from the time? Who made it?
      *   *Step 3: The Bias Test.* Who benefits? Is it an admission against interest? (Crucial for the "biased source" question).
      *   *Step 4: Corroboration & Silence.* Is there a second source? If not, does silence matter? (Crucial for "single source" question).
      *   *Step 5: Plausibility.* Does it fit the context?
      *   *Step 6: The Verdict Matrix.* Separating Evidence, Desire, and Policy.

      *Refining the "Single Source" & "Silence" rules:*
      *   Single source is *never* enough for a definitive fact, but can be enough for "Tradition says..."
      *   Silence is only evidence if we *expect* a record (e.g., a land transfer, a major fire).
      *   Biased source: Friendly source = low weight for positive claims. Hostile source = high weight for negative claims (admission against interest).

      *Refining Authority:*
      *   Staff decides *what the evidence says*.
      *   Board decides *how we display it* (if evidence is weak but story is popular).

  4.  **Developing the Case Studies:**
      *   *Case 1: Underground Railroad (UR) House.*
          *   Sources: 1930 oral tradition, cellar with false wall.
          *   Historical reality check: UR was secretive. Lack of paper records is normal. But "false walls" are often just old construction. Oral tradition starting 1930 for 1850s events is shaky (80 years gap).
          *   Desired outcome: Probably "Unproven." This is often uncomfortable for museums that want the UR designation.
      *   *Case 2: The Founder's Misdeed.*
          *   Sources: 1902 County History by a descendant defending the family. Mentions the event in passing while refuting it or explaining it away.
          *   Historical reality check: A defender mentioning a negative event implies the event was known/alleged. If they say "Grandpa didn't burn the mill, he bought it," they admit the mill burned and changed hands suspiciously.
          *   Desired outcome: "Plausible/Probable." This might be uncomfortable because it indicts the founder.
      *   *Selection:* The prompt asks for one outcome the user "won't like." Usually, local societies *want* the UR story (heroic) and *don't want* the Founder's misdeed (shameful). So, I should make the UR story fail (Unproven) and the Founder story succeed (Substantiated/Plausible). Or vice versa. Let's make the UR story fail (common disappointment) and the Founder story remain ambiguous but lean towards "happened" based on the bias rule. Actually, the prompt says "I'd like at least one of those to come out in a way I won't like." I will make the UR story fail (no evidence) because that's the common trap, and the Founder story will be "Inconclusive but the allegation stands." Wait, let's make the Founder story *succeed* in proving the bad act, because that's harder for a board to swallow.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the difficulty. Validate their situation.
      *   **The Protocol:** Break it down into Steps 1-5. Use clear "Pass/Fail" criteria.
      *   **The Decision Matrix:** Clearly separate Evidence (Staff) from Narrative (Board).
      *   **Case Study 1 (UR House):** Apply the steps. Show where it fails (gap in time, architectural ambiguity). Result: "Legend, not History."
      *   **Case Study 2 (Founder):** Apply the steps. Show how the bias works *for* the claim (admission against interest). Result: "Likely True."
      *   **Limitations:** What the procedure can't fix (politics, funding, emotional attachment).

  6.  **Refining the "Bias" and "Silence" Rules (Self-Correction during drafting):**
      *   *Silence:* Be careful. Don't say "Silence = False." Say "Silence = Neutral unless record expected."
      *   *Bias:* Explicitly state: "A hostile source admitting a fact is gold. A friendly source claiming a virtue is copper."
      *   *Single Source:* "One source establishes the *claim exists*, not that the *event happened*."

  7.  **Final Review against Constraints:**
      *   Afternoon run? Yes, checklist format.
      *   Messy sources? Yes, addressed in protocol.
      *   Honest about limitations? Yes, final section.
      *   Authority split? Yes, Decision Matrix.
      *   Uncomfortable result? Yes, UR house likely gets downgraded.

  8.  **Tone:** Professional, empathetic, firm, practical. No academic jargon without explanation.

  *(Self-Correction on Case Studies)*: I need to ensure the Founder case uses the "1902 descendant" source effectively. If the descendant says "My grandfather was accused of X, but actually Y," the existence of the accusation is historical fact, and the details of X might be corroborated by the denial. I will structure it so the procedure forces the admission that the *act* likely happened, even if the *intent* is disputed. That's a nuanced "uncomfortable" truth.
  For the UR house, the "false wall" is often a cold cellar storage niche. The 1930 date is too late for direct memory. This should fail the "Corroboration" step.

