prompt: |-
  You are a philosopher working in bioethics and the philosophy of disability, with a strong background in population ethics and the metaphysics of harm. I am preparing a position statement for a workshop and I want an adversarial consistency audit of my views before I present them. Please think carefully and work through the package slowly rather than reacting to it impressionistically. Before you commit to a verdict, brainstorm: generate the candidate tensions you can see, including ones that may turn out to be merely apparent, and only then decide which are genuine. Do not flag every pair as a tension, and do not hedge by calling everything "in some tension." I want a discriminating audit, not a list. I do not need citations or references; engage with the substance.

  Here is my position as I would state it:

  1. I accept a principle of procreative beneficence, but in a deliberately weak form: prospective parents have a genuine reason — a reason, not an obligation — to select, among the children they could have, the one whose life can be expected to go best.

  2. I hold the social model of disability. The disadvantage that attaches to impairment is produced mostly by social arrangements — inaccessible environments, stigma, exclusion, the organization of work — rather than by impairment as such. In the same spirit, I think having a disability is a mere difference rather than a bad difference: it does not by itself make a life go worse.

  3. I am committed to not treating the products of injustice as natural constraints. Where a disadvantage exists only because of an unjust arrangement, I do not want my practical reasoning to take that disadvantage as a fixed fact about what kind of child to have, since reasoning that way is part of what keeps the arrangement in place.

  4. I accept a person-affecting view of harm: an action harms someone only if it makes that person worse off than they otherwise would have been, and no one is made worse off by the fact that a different possible child was brought into existence instead of them. I also think that the wrongness of an action in this domain tracks the harm it does.

  5. I hold a strong commitment to reproductive autonomy: no one should be coerced or pressured about these choices, and the state should stay out of them.

  6. A commitment that may or may not be load-bearing: the expected welfare of a child with a given condition depends substantially on how many other people have it. Accommodation, community, and familiarity are functions of prevalence, so the disadvantage associated with a condition tends to shrink as the condition becomes more common.

  7. And a verdict I keep arriving at: I think a parent who chooses to implant an embryo that will be deaf, when a hearing embryo is available, is doing something wrong — though I do not think it should be illegal, and I do not think such parents should be pressured out of the choice.

  What I want from you:

  First, a one-paragraph restatement of the package in your own words, to show that you have it.

  Second, the audit. Identify the genuine tensions. For each, say which commitments are pulling against each other, explain the mechanism of the conflict rather than just asserting that two views are opposed, rank the tensions by severity, and give the cheapest repair together with an honest statement of what that repair costs. Where a tension is merely apparent, say so explicitly and explain what makes it dissolve.

  Third, tell me which single revision would resolve the most, and whether that revision is one I should actually make or whether it would cost me something I care about more than consistency.

  Finally, flag any commitment that is doing no work in the package, or that you suspect I hold mainly because of the company I keep.

  Write in American English, and do not soften the audit to be polite. If the position is incoherent, say where.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher in bioethics/philosophy of disability, background in population ethics/metaphysics of harm.
      *   **Task:** Adversarial consistency audit of a provided position statement (7 points).
      *   **Constraints:**
          *   Think carefully, work slowly.
          *   Brainstorm candidate tensions first, then decide which are genuine.
          *   Do not flag every pair as a tension; be discriminating.
          *   Do not hedge ("in some tension").
          *   No citations/references; engage with substance.
          *   Output structure:
              1.  One-paragraph restatement.
              2.  Audit (genuine tensions, mechanisms, severity ranking, cheapest repair + cost).
              3.  Single best revision (resolve most vs. cost).
              4.  Flag idle commitments.
          *   Tone: American English, direct, not softened for politeness.

  2.  **Analyze the Position Statement (The "Package"):**
      *   (1) Weak Procreative Beneficence (PB): Reason, not obligation, to select the child with the best expected life.
      *   (2) Social Model of Disability (SMD) + Mere Difference View (MDV): Disability disadvantage is social, not intrinsic; disability is a mere difference, not a bad difference.
      *   (3) Anti-Naturalization of Injustice: Don't treat unjust disadvantages as fixed constraints in reasoning (to avoid perpetuating injustice).
      *   (4) Person-Affecting View (PAV) + Harm Tracking Wrongness: Harm requires making a specific person worse off than they would otherwise be. Non-identity problem accepted (choosing A instead of B doesn't harm B). Wrongness tracks harm.
      *   (5) Reproductive Autonomy: No coercion/pressure/state interference.
      *   (6) Prevalence-Dependent Welfare: Welfare of disabled children depends on prevalence (community/accommodation).
      *   (7) Verdict: Choosing deaf embryo over hearing is *wrong* (but not illegal/pressured).

  3.  **Brainstorming Candidate Tensions:**
      *   *T1: PB (1) vs. MDV (2).* If disability is a mere difference (not bad), why is there a reason to select the non-disabled child (who has the "best" life)? If deafness isn't a bad difference, the hearing life isn't necessarily "better."
      *   *T2: PB (1) vs. PAV (4).* PB usually relies on impersonal principles (better outcome overall). PAV says wrongness tracks harm to specific individuals. If choosing Deaf doesn't harm the Deaf child (because they wouldn't exist otherwise), PAV says it's not wrong. But (7) says it *is* wrong.
      *   *T3: MDV (2) vs. Verdict (7).* If disability is a mere difference, why is choosing it wrong? Usually, "wrong" implies making things worse. If deafness doesn't make life worse, choosing it shouldn't be wrong.
      *   *T4: Anti-Naturalization (3) vs. PB (1) & Verdict (7).* (3) says don't treat unjust disadvantages as fixed facts. PB (1) says select based on expected life quality. If expected life quality is lowered by injustice (stigma), using that to select against disability treats the injustice as a fixed fact. This seems like a direct clash.
      *   *T5: Autonomy (5) vs. Verdict (7).* (7) says it's wrong but shouldn't be pressured. This is the standard "morality vs. law" distinction. Not necessarily a tension, but needs checking. If it's wrong, why no pressure? (5) says no pressure. This seems consistent (moral wrongness doesn't entail legal coercion).
      *   *T6: Prevalence (6) vs. PB (1).* If welfare depends on prevalence, the "best" child changes based on what others do. PB usually assumes fixed welfare expectations.
      *   *T7: PAV (4) vs. Verdict (7).* This is the big one. (4) says wrongness tracks harm. (4) says choosing Deaf doesn't harm the Deaf child (non-identity). (7) says choosing Deaf is wrong. How can it be wrong if no one is harmed?

  4.  **Filtering for Genuine Tensions:**
      *   *T1 (PB vs. MDV):* Genuine. If deafness is a mere difference, the hearing life isn't objectively "better" in terms of welfare *intrinsically*. However, PB relies on "expected to go best." If social barriers make it go worse, PB selects against it. But MDV says it *shouldn't* make it go worse ideally. This links to T4.
      *   *T2 (PB vs. PAV):* PB is often impersonal. PAV is person-affecting. But (1) is weak ("reason"). (4) says wrongness tracks harm. (7) says it's wrong. So (4) + (7) requires harm. PAV says no harm in non-identity cases. This is a major clash.
      *   *T3 (MDV vs. Verdict):* If it's a mere difference, selecting against it implies it's a bad difference. Unless the "wrongness" comes from something else (e.g., violating PB). But if MDV is true, PB shouldn't favor hearing over deaf *intrinsically*.
      *   *T4 (Anti-Naturalization vs. PB/Verdict):* This is very sharp. (3) says don't use unjust disadvantages as reasons. (1) & (7) say use expected welfare (which includes unjust disadvantages) to judge the choice as wrong. If the disadvantage is due to stigma (per 2), and you select against stigma by selecting against the disabled child, you are accommodating the injustice rather than fighting it. This contradicts (3).
      *   *T5 (Autonomy vs. Verdict):* Not a tension. Moral wrongness without legal coercion is standard liberal theory.
      *   *T6 (Prevalence vs. PB):* Complicates PB, but doesn't contradict it. Just makes the calculation dynamic.
      *   *T7 (PAV vs. Verdict):* This is the metaphysical core. (4) defines harm/wrongness via counterfactual comparison. Non-identity blocks this. (7) asserts wrongness. This is the Non-Identity Problem explicitly embraced and then violated.

      *Selection for Audit:*
      1.  **The Non-Identity/Wrongness Clash (4 vs. 7):** This is the most glaring metaphysical inconsistency. (4) says wrongness tracks harm + PAV. PAV says no harm in selection cases. (7) says it's wrong.
      2.  **The Social Model/Injustice Clash (2 & 3 vs. 1 & 7):** If disadvantage is social (2) and we shouldn't treat unjust disadvantages as fixed (3), then selecting against disability based on expected welfare (1) reinforces the injustice. It treats the social barrier as a reason to exclude the person rather than a reason to remove the barrier.
      3.  **The Mere Difference/Best Life Clash (2 vs. 1):** If disability is a mere difference, there is no intrinsic reason to think the hearing life goes "best." The "best" calculation relies on the very disadvantages (2) claims are contingent/unjust.

      *Ranking:*
      1.  PAV vs. Verdict (Metaphysical incoherence).
      2.  Anti-Naturalization vs. PB/Verdict (Political/Ethical incoherence).
      3.  Mere Difference vs. PB (Conceptual friction, potentially resolvable via social facts).

  5.  **Drafting the Audit:**

      *   *Restatement:* Need to capture the liberal-social-modernist vibe. Trying to balance disability rights with intuitive parental duties, while holding a specific metaphysical view on harm.
      *   *Tension 1 (PAV vs. Verdict):* Mechanism: PAV + Non-Identity = No Harm. Wrongness tracks Harm. Therefore No Wrongness. Verdict says Wrongness. Repair: Drop PAV or drop Verdict. Cost: Dropping PAV opens impersonal harms (repugnant conclusion risks?). Dropping Verdict saves consistency but loses the intuitive judgment.
      *   *Tension 2 (Anti-Naturalization vs. PB):* Mechanism: (3) says don't let injustice drive selection. (1) & (7) say let expected welfare (driven by injustice per 2) drive selection/judgment. Repair: Restrict PB to intrinsic goods only. Cost: PB becomes empty because most welfare differences are social.
      *   *Tension 3 (Mere Difference vs. PB):* Mechanism: If mere difference, why is hearing "better"? Repair: Argue "better" is solely due to current unjust society. Cost: Collapses into Tension 2.

      *Refining the "Cheapest Repair":*
      For T1 (PAV): The cheapest repair is to abandon the claim that wrongness *strictly* tracks harm in procreative cases (accept impersonal principles for wrongness while keeping PAV for harm). Or, abandon the Verdict. Given the user wants to keep the Verdict, they must modify (4).
      For T2 (Injustice): The cheapest repair is to clarify that PB applies to *current* reality even if unjust, but (3) applies to *policy*. But (3) says "practical reasoning." So the repair is to weaken (3) to apply only to collective action, not individual selection. Cost: Betrays the radical impulse of (3).

      *Single Best Revision:*
      Drop the Person-Affecting View (4) constraint on wrongness. Allow that an action can be wrong because it brings about a worse state of affairs (impersonal) even if no specific person is harmed. This resolves the Non-Identity problem blocking (7).
      *Should they make it?* It costs them the metaphysical purity of PAV. But keeping PAV makes (7) indefensible. If (7) is the intuitive anchor, (4) must go.

      *Idle Commitments:*
      (6) Prevalence. It complicates things but doesn't resolve the contradictions. It's theoretical window dressing unless integrated into the PB calculation explicitly.
      (5) Autonomy. It's compatible with (7) (wrong but legal). It's doing work to shield from policy critiques, but not internal consistency work.

  6.  **Review against Constraints:**
      *   One paragraph restatement? Yes.
      *   Audit genuine tensions? Yes.
      *   Mechanism explained? Yes.
      *   Rank severity? Yes.
      *   Cheapest repair + cost? Yes.
      *   Single revision recommendation? Yes.
      *   Flag idle commitments? Yes.
      *   Tone: Direct, American English, no hedging.
      *   No citations? Yes.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Check T1:* Is it definitely genuine? Yes. (4) says wrongness tracks harm. (4) says PAV (no harm in non-identity). (7) says wrong. This is a straight contradiction.
      *   *Check T2:* Is it definitely genuine? (3) says "I do not want my practical reasoning to take that disadvantage as a fixed fact." (1) says "select... expected to go best." If "best" includes avoiding social stigma, (1) violates (3). Yes, genuine.
      *   *Check T3 (Mere Difference):* If I accept social model, I can accept hearing is "better" *here and now* without admitting deafness is *intrinsically* bad. So (2) and (1) are compatible *if* (1) is contingent on social facts. But this triggers (3). So T3 collapses into T2. I will treat them as one complex tension regarding the source of value.
      *   *Idle:* (6) is interesting. If prevalence reduces disadvantage, then selecting against disability reduces prevalence, which increases disadvantage for future disabled people. This creates a collective action problem. Does the user address this? No. It might be idle because it's not integrated into the decision procedure. I should flag it as underutilized or potentially destabilizing.
      *   *Tone Check:* Ensure I'm not being polite. "This is incoherent," "You cannot hold both," etc.

  8.  **Finalizing the Output Structure:**
      *   Restatement.
      *   Audit (Tension 1, Tension 2, Tension 3).
      *   Single Revision.
      *   Idle Commitments.

      *Wait, one nuance on (4):* "I also think that the wrongness of an action in this domain tracks the harm it does." This is the kill switch. If no harm (per PAV), no wrongness. But (7) says wrong. This is the strongest tension.
      *Nuance on (3):* "I do not want my practical reasoning to take that disadvantage as a fixed fact." This is a normative constraint on reasoning. (1) uses expected welfare (which includes disadvantage) as a reason. Direct conflict.

      *Let's write.*
answer: |-
  Your position attempts to synthesize a liberal disability rights framework with intuitive parental duties, grounded in a specific metaphysics of harm. You argue that while disability is a mere difference socially constructed as disadvantageous, parents still have a moral reason to select non-disabled children because current conditions make those lives go better. You maintain that selecting for disability is morally wrong due to these welfare deficits, yet you insist this wrongness does not stem from harming the child (since existence is not a harm compared to non-existence) and should not incur legal or social coercion. You aim to avoid reinforcing injustice by refusing to treat social barriers as natural, even as you use the existence of those barriers to justify selecting against the people who would face them.

  ### The Audit

  **1. The Metaphysical Contradiction (Person-Affecting View vs. Verdict)**
  *   **Commitments:** (4) vs. (7).
  *   **Mechanism:** This is a flat contradiction. Commitment (4) asserts two things: first, that harm requires making a specific person worse off than they would otherwise be (the person-affecting view); second, that wrongness tracks harm. In procreative selection cases, the non-identity problem applies: choosing a deaf embryo does not make the deaf child worse off than they would otherwise be, because the alternative is non-existence. Therefore, under (4), the action causes no harm. If wrongness tracks harm, the action cannot be wrong. Yet (7) asserts the action *is* wrong. You cannot maintain the definition of harm in (4) and the verdict in (7) simultaneously.
  *   **Severity:** Critical. This renders the core moral judgment indefensible within your own metaphysical framework.
  *   **Cheapest Repair:** Decouple wrongness from harm in procreative contexts. Allow that an action can be wrong because it produces a suboptimal state of affairs (impersonal principle) even if no specific person is harmed.
  *   **Cost:** You lose the metaphysical purity of the person-affecting view. You must accept that "wrongness" can exist without a victim, which opens the door to impersonal obligations you may find overly demanding or counterintuitive in other contexts.

  **2. The Political Contradiction (Anti-Naturalization vs. Procreative Beneficence)**
  *   **Commitments:** (3) vs. (1) and (7).
  *   **Mechanism:** Commitment (2) states that disadvantage is produced by social arrangements (injustice). Commitment (3) states you refuse to treat disadvantages arising from injustice as fixed facts in practical reasoning, because doing so perpetuates the injustice. However, Commitment (1) instructs parents to select the child expected to have the best life, and (7) judges parents wrong for not doing so. Since the "best life" calculation inevitably includes the social disadvantages identified in (2), following (1) requires treating those unjust disadvantages as fixed facts. You are using the existence of stigma and inaccessibility as a reason to prevent disabled people from existing, which is precisely the reasoning pattern (3) forbids.
  *   **Severity:** High. This undermines the coherence of your political stance. You are condemning the injustice while simultaneously advising parents to accommodate it via selection.
  *   **Cheapest Repair:** Restrict Commitment (3) to collective political action and policy, excluding individual procreative reasoning.
  *   **Cost:** This betrays the radical impulse of (3). It concedes that individual morality must accommodate injustice even while collective morality fights it, effectively admitting that disabled lives are legitimately selectable against so long as the state doesn't force the issue.

  **3. The Axiological Tension (Mere Difference vs. Best Life)**
  *   **Commitments:** (2) vs. (1).
  *   **Mechanism:** If disability is a "mere difference" (2), it does not intrinsically make a life go worse. Commitment (1) requires selecting the child whose life will go "best." If the difference is mere, there is no intrinsic basis for claiming the hearing life goes better than the deaf life. The only basis for claiming the hearing life is "better" is the contingent social disadvantage. This collapses back into Tension 2. If you insist the hearing life is better *even absent social disadvantage*, you contradict (2). If you insist it is better *only because of social disadvantage*, you contradict (3).
  *   **Severity:** Moderate. This is resolvable if you clarify that "best" is purely contingent on current social facts, but that solution triggers the Political Contradiction above.
  *   **Cheapest Repair:** Explicitly ground the "reason" in (1) solely in current social contingency, not intrinsic welfare.
  *   **Cost:** It makes the reason to select non-disabled children temporary and regrettable, rather than a stable moral principle. It weakens the force of (1).

  ### Single Best Revision

  **Revision:** Abandon the constraint in (4) that wrongness must track harm to a specific person.
  **Reasoning:** This resolves the Critical Metaphysical Contradiction immediately. It allows you to maintain that selecting for deafness is wrong (7) because it brings about a worse state of affairs (lower expected welfare), even if the specific child is not harmed by being created. This is the standard move in population ethics to solve the non-identity problem.
  **Should you make it?** Yes, if you want to keep verdict (7). You cannot keep (7) without this. However, you must accept the cost: you are abandoning the person-affecting view for procreative ethics. This costs you metaphysical consistency across domains (you might still want PAV for non-procreative harm), but it saves your position from incoherence. If you are unwilling to pay this cost, you must abandon verdict (7) and admit that selecting for deafness is not wrong, only perhaps regrettable.

  ### Idle Commitments

  **Commitment (6) (Prevalence-Dependent Welfare):** This is doing no work in your current package. You state that welfare depends on prevalence, but you do not integrate this into the calculation in (1) or the verdict in (7). If welfare shrinks as prevalence grows, then selecting against disability reduces prevalence, which increases disadvantage for future disabled people, potentially making the selection *more* wrong on utilitarian grounds. You mention this fact but fail to let it impact your moral reasoning. It appears to be included to signal alignment with disability community insights rather than to drive the argument.

  **Commitment (5) (Reproductive Autonomy):** This is not inconsistent with (7), but it is doing no heavy lifting in resolving the tensions. It serves as a shield against policy critiques but does not help reconcile the metaphysical or political contradictions in your moral reasoning. It is a standard liberal placeholder that allows you to hold a moralizing view without advocating for state coercion, but it does not explain *why* the action is wrong if no one is harmed.
