answer: |-
  "Wait," she said, her hand hovering over the mailbox slot. "Don't drop it."

  "It's two dollars," he said, envelope pinched between his fingers. "For a shot at a hundred thousand."

  "It's not a shot. It's an equation. Do the math out loud."

  He sighed. "Okay. Hundred thousand dollar prize. Hundred thousand invites. If everyone enters, the pot splits hundred ways. Each person gets one dollar."

  "And?"

  "And we pay two to enter. So if everyone enters, we each lose a dollar."

  "Exactly. So nobody should enter."

  "But nobody isn't going to happen. People are greedy. People don't read the fine print."

  "People who reason like us will read it. And if you reason like me, you have to ask: what should everyone who reasons like me do? Not what should *I* do. If the answer is 'enter,' then all of us enter, and we all lose. So the rational choice is to stay home."

  "That's logic-shaped nonsense," he said, shifting his weight. "You're pretending your decision controls strangers. It doesn't. My cheque doesn't reach into their pockets and stop them from mailing theirs."

  "It's not control. It's symmetry. We're running the same algorithm on the same data. If I output 'enter,' you output 'enter.' The correlation isn't magic; it's identity."

  "Correlation requires a common cause," he countered, voice tightening. "Sure, our reasoning is a common cause. But that doesn't give my action power over yours. It just means we're similar. If I drop this letter, it doesn't physically force you to drop yours. It just means we both decided to. I'm not responsible for your choice, only mine."

  "But you are responsible for the outcome of the group you belong to. If you're truly rational, you know there are others like you. If you defect, you're betting that you're the only one who won't. You're betting on being the sole clever person in a room full of suckers."

  "I'm betting on reality," he said. "Most people won't even open this letter. Half this list is probably just sweepstakes hunters who see 'cash' and stop reading. The other half might be philosophers, but how many philosophers actually think like you? Ten? Fifty? If fifty people stay home because of this theory, and ninety-nine thousand enter, I get a dollar and one cent. I still lose. But if only five thousand enter? I get twenty dollars. That's a tenfold return."

  "So you're admitting your profit depends on others being irrational?"

  "My profit depends on causality. My action changes my balance sheet. It doesn't change theirs. You're trying to solve a multi-agent problem by pretending it's a single-agent problem. It's wishful thinking. You want the world to be coordinated because it would be nicer if it were."

  "And you want the world to be isolated because it lets you off the hook," she shot back. "If there are enough of us, your way guarantees a loss for everyone like us. My way guarantees we don't play a losing game."

  "If there are enough of us," he emphasized. "That's the variable you're glossing over. How many people actually reason the way you do? Really? If it's just you, you should enter. You'd be the only one staying home while everyone else splits the pot, and you'd get nothing. If it's you and me, we both stay home, someone else wins. If it's fifty thousand of us, we save ourselves a dollar each. But you don't know the number."

  "Neither do you."

  "Exactly. So I have to act on the only thing I can control: my own cheque. If I enter, I gain potential upside. If I stay home based on a guess about how many superrationalists exist, I guarantee zero return."

  "But if you enter, you validate the loss," she said. "You become part of the tragedy."

  "I become part of the reality," he corrected. "Look, if you're right, then we're identical. So if I enter, you enter. If I stay, you stay. So why are you arguing? Just do what I do."

  "Because you're wrong."

  "Then prove it without assuming my hand moves when yours does."

  They stood silent for a moment, the metal box humming with the traffic noise behind them.

  "If I drop this," she said quietly, "I'm saying logic doesn't bind us. I'm saying we're alone."

  "If you don't," he said, "you're saying you know how many of us there are. And you don't."

  "Maybe I know there's at least one."

  "Then enter. Be the one."

  "If I enter, I'm hoping you're wrong. If I don't, I'm hoping you're right."

  He looked at the envelope, then at her. "That's not a strategy. That's a stalemate."

  "Then don't drop it."

  "I have to."

  "Then I won't."

  She pulled her hand back. He let the envelope slip. It vanished into the dark.
