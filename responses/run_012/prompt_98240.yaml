      *(Refining the "Sleight of Hand" point)*: It's not a trick in a negative sense. It's a genre constraint. Fiction *must* have a subject. Philosophy *questions* the subject. The novel's "solution" is to assert continuity where philosophy sees rupture. This is a thematic choice, not a logical proof.

