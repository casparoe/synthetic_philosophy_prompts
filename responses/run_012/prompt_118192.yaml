answer: |-
  ### Mechanism Brainstorming

  **Candidate 1: The Logistic Map ($x_{n+1} = 4x_n(1-x_n)$).**
  *   *Pros:* The canonical example of chaotic behavior in continuous systems.
  *   *Cons:* Arithmetic is too heavy for hand execution (squaring decimals, 3-digit multiplication). Students will spend the session fighting calculation errors rather than grappling with epistemic limits. The "noise" of arithmetic error will obscure the "signal" of sensitivity to initial conditions.
  *   *Verdict:* **Rejected.**

  **Candidate 2: The Modular Linear Congruence ($x_{n+1} = (3x_n + 1) \mod 17$).**
  *   *Pros:* Discrete, easy arithmetic.
  *   *Cons:* The state space is small (17 states). Students will quickly map the cycle and predict perfectly once the rule is known, destroying the lesson on unpredictability. It fails to model the *continuous* loss of precision required for the logarithmic horizon lesson.
  *   *Verdict:* **Rejected.**

  **Candidate 3: The Decimal Shift Engine ($x_{n+1} = 10x_n \mod 1$).**
  *   *Pros:* Trivial arithmetic (shift decimal point, drop leading digit). The $n$-th output is exactly the $n$-th decimal digit of the seed. This creates a direct, tangible link between "digits of precision known" and "steps into the future predicted." It perfectly models the logarithmic relationship: gaining 1 step of horizon requires 1 more digit of precision (a factor of 10 in accuracy).
  *   *Cons:* It is discontinuous.
  *   *Verdict:* **Selected.** The pedagogical clarity regarding information loss outweighs the topological simplicity. It isolates the epistemic constraint without computational friction.

  ---

  # Activity Design: The Generator Game

  ## 1. Setup and Materials
  *   **Room:** Ordinary classroom. Whiteboard.
  *   **Participants:** 16 students, divided into 4 groups of 4.
  *   **Materials per Group:**
      *   1 "Ledger" sheet (for recording predictions and costs).
      *   1 "Market" sheet (for purchasing precision).
      *   20 "Epistemic Credits" (paper tokens).
      *   1 Role Card: **Actuary** (assigned to one student per group).
      *   3 Role Cards: **Predictor** (assigned to the rest).
  *   **Facilitator Materials:**
      *   4 "Seed Cards" (each contains a specific 20-digit decimal number, e.g., $0.3819502884...$). These are fixed at the start and do not change. *Note: Choose seeds with no obvious repeating patterns (e.g., digits of $\pi$ or $\sqrt{2}$).*
      *   Whiteboard for global score tracking.

  ## 2. The Engine (The Rule)
  The system state is a number $x$ between 0 and 1.
  To advance the system one step:
  1.  Multiply $x$ by 10.
  2.  The **Output** is the integer part (the digit before the decimal).
  3.  The **New State** is the fractional part (the digits after the decimal).

  *Example:* State $0.381$. $\times 10 \to 3.81$. Output = **3**. New State = $0.81$.

  ## 3. Solvability and Payoff Structure
  To ensure the "Actuary" strategy (aggregate betting) outperforms the "Predictor" strategy (specific betting) over time, the costs must render deep prediction irrational.

  *   **Cost of Precision:** Predictors may buy digits of the initial Seed. Cost = **2 Credits per digit**.
      *   Buying 1 digit allows prediction of Step 1.
      *   Buying 5 digits allows prediction of Step 5.
  *   **Reward for Specific Prediction:** **10 Credits** for correctly predicting the exact Output of a specific step.
  *   **Reward for Actuary:** The Actuary does not buy digits. They bet on the **Distribution** over a block of 10 steps.
      *   Bet: "Each digit 0-9 will appear roughly once."
      *   Reward: **60 Credits** per 10-step block (averaging 6 per step) if the distribution is uniform (no digit appears more than 3 times).
  *   **Rational Horizon:**
      *   Step 1: Cost 2, Reward 10. Net +8. (Rational)
      *   Step 4: Cost 8, Reward 10. Net +2. (Rational)
      *   Step 5: Cost 10, Reward 10. Net 0. (Indifferent)
      *   Step 6: Cost 12, Reward 10. Net -2. (Irrational)
      *   *Result:* Predictors naturally stop at Step 5. The Actuary continues indefinitely with steady gains.

  ## 4. Timeline (90 Minutes)

  ### Phase 1: The Black Box (00:00 – 00:25)
  *   **00:00 – 00:05 (Instructions):**
      *   *Tell:* "You are observing a Generator. It produces a sequence of single digits (0-9). Your goal is to accumulate Credits."
      *   *Tell:* "You start with 20 Credits. You may bet on the next number. Cost to bet: 2 Credits. Reward for correct guess: 10 Credits."
      *   *Tell:* "You do not know how the Generator works. You only see the history."
      *   *Do Not Tell:* The rule. The existence of a 'Seed'. The word 'determinism'.
  *   **00:05 – 00:25 (Play):**
      *   Facilitator acts as the Generator for the whole room (using one master Seed).
      *   Write the Output on the board after each round.
      *   Groups discuss and place bets.
      *   *Expected Outcome:* Students look for patterns (1, 3, 5... or primes). They will fail. The sequence appears random. Scores will drop as they burn credits guessing.
      *   *Stop Condition:* After 10 rounds. Most groups should be low on credits.

  ### Phase 2: The White Box & The Market (00:25 – 01:10)
  *   **00:25 – 00:35 (The Reveal):**
      *   *Tell:* "The Generator is not random. It follows a strict law."
      *   *Tell:* (Write on board) "Rule: Multiply state by 10. Output the whole number. Keep the remainder."
      *   *Tell:* "Each group now receives a **Seed Card**. This is the exact initial state of your personal Generator."
      *   *Tell:* "You now have perfect knowledge of the Law and the Initial Condition."
      *   *Action:* Hand out the Seed Cards (e.g., $0.38195...$).
      *   *Action:* Reset Credits to 20.
  *   **00:35 – 00:45 (Calibration):**
      *   Ask groups to calculate the first 3 outputs together. Verify everyone gets it right.
      *   *Feeling:* Confidence. "Now we can predict forever."
  *   **00:45 – 01:10 (The Precision Market):**
      *   *Tell:* "There is a catch. The Seed Card is blurred. You can only see the first digit."
      *   *Tell:* "You may purchase visibility of further digits from the Facilitator. Cost: 2 Credits per digit."
      *   *Tell:* "Predictors: Bet on specific steps. Actuary: Bet on the 10-step distribution (Cost 0, Reward 60 if uniform)."
      *   *Action:* Groups play 20 rounds. Predictors must decide how many digits to buy to place their bets. The Actuary ignores the digits and tracks the count of 0-9s.
      *   *Expected Outcome:* Predictors buy 4-5 digits, predict steps 1-5 successfully, then stop because Step 6 costs more than the reward. They watch the Generator continue without them. The Actuary accumulates steady wealth.

  ### Phase 3: Debrief (01:10 – 01:30)
  *   **01:10 – 01:30 (Discussion):**
      *   Collect Ledgers. Project the data (or write on board).
      *   Map the experience to the four learning goals (see Debrief Script below).
      *   Introduce forbidden words now: **Determinism**, **Predictability**, **Chaos**.

  ## 5. Debrief Script & Mapping

  **Goal 1: Determinism $\neq$ Predictability**
  *   *Ask:* "In Phase 2, did the system change?" (No, same rule). "Did your knowledge change?" (Yes, rule revealed). "Could you predict the future?" (Only for 5 steps).
  *   *Point:* You held the Law. You held the Seed (partially). The future was fixed by the Seed, but *unavailable* to you. The system was deterministic (fixed future), but you were not able to predict it beyond a short horizon. These are not the same thing.

  **Goal 2: The Logarithmic Price**
  *   *Ask:* "Predictors, why did you stop betting at Step 6?"
  *   *Point:* To predict Step 6, you needed 6 digits. Cost 12. Reward 10. Loss.
  *   *Math:* To double your prediction time (from 5 steps to 10 steps), you needed 10 digits. Precision went from $10^{-5}$ to $10^{-10}$. You had to square your precision to double your time. This is not a linear trade-off; it is a brutal tax on knowledge.

  **Goal 3: Chaos is not Randomness**
  *   *Ask:* "Actuaries, did you win?" (Yes). "Why?"
  *   *Point:* You couldn't say *which* number comes next, but you could say *what the mix* of numbers would be. The system is lawless in detail, but lawful in aggregate. It is not random; it is statistically stable.

  **Goal 4: Description Dependence**
  *   *Ask:* "Is this system deterministic?"
  *   *Point:* If you describe the state as "The exact 20-digit number," yes. If you describe the state as "The distribution of digits," no (that description is probabilistic). Whether the world is deterministic depends on how finely you carve up the state space. You cannot read 'determinism' off the world; you assign it via your description.

  ## 6. Failure Modes & Mitigations

  1.  **Arithmetic Errors:** Students might miscalculate the shift (e.g., $0.38 \times 10 = 3.8$, output 3, new state $0.8$).
      *   *Mitigation:* During Calibration (00:35), walk around and verify every group's first 3 steps. Correct immediately.
  2.  **Early Rule Discovery:** A student might guess the "multiply by 10" rule in Phase 1.
      *   *Mitigation:* If they claim to know the rule, ask them to predict the next number. They can't, because they don't have the Seed. Use this to reinforce that knowing the *Law* is not enough without the *State*.
  3.  **Actuary Loss:** If the Seed has a weird patch (e.g., $0.11111...$) the Actuary might lose the distribution bet.
      *   *Mitigation:* Facilitator must pre-screen Seed Cards. Use digits of irrational numbers ($\pi, e, \sqrt{2}$) to guarantee uniform distribution over 10 steps.
  4.  **Predictors Overspend:** Students might buy 10 digits just to "win" regardless of cost.
      *   *Mitigation:* Emphasize in instructions that the goal is **Net Profit**, not just accuracy. "Bankruptcy ends your participation."

  ## 7. Honest Limits (Facilitator Notes)

  *Do not read this aloud to students. Use this to manage your own expectations and guide the final discussion nuances.*

  1.  **The Pre-Written Seed:** In this activity, the future is literally written on a card. This makes the "hidden variable" picture too easy. In real physics, there is no card. The state is a physical condition, not a number waiting to be read.
      *   *Debrief Note:* Acknowledge that real measurement doesn't just "reveal" a number; it interacts with the system. The card makes the determinism seem more "real" than it might be.
  2.  **No Model Error:** In the game, the Law is perfect. In science, the Law is always an approximation.
      *   *Debrief Note:* Real prediction fails both because we don't know the state (this game) AND because we don't know the true law (not modeled here).
  3.  **Computational Cost:** The game ignores the time/energy needed to calculate the steps.
      *   *Debrief Note:* In complex systems, even if you have the data, computing the future might take longer than the future itself arriving.
  4.  **Shadowing Lemma:** Students may ask, "If I calculate with round-off error, am I still close to the truth?"
      *   *Facilitator Check:* For this specific map, errors grow immediately. However, in continuous physical systems, the *Shadowing Lemma* suggests computed trajectories stay close to *some* true trajectory. This saves the math, but not the prediction (because you don't know *which* true trajectory you are shadowing). Do not press this unless asked; it is technical and risks confusing the main epistemic point.
  5.  **Agency and Responsibility:** The activity does not solve free will.
      *   *Debrief Note:* Whether this mechanical unpredictability grants "freedom" is a separate metaphysical question. Unpredictability to an agent is not the same as causal openness.

