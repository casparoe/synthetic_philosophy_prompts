          *   Solvability check (payoff table, rational strategy).
          *   Timeline (90 mins).
          *   Debrief (mapping moments to goals).
          *   Failure modes.
          *   Honest limits (what the activity *can't* do).
      *   **Constraints:** No computers, no calculators, no dice/cards (no genuine randomness), no specific citations/authors, no forbidden words before debrief.

  2.  **Brainstorming Mechanisms:**

      *   *Candidate 1: The Tent Map (Binary Shift).*
          *   Rule: $x_{n+1} = 2x_n \mod 1$. In binary, this just shifts the decimal point and drops the integer part.
          *   Pros: Extremely simple arithmetic (doubling). Clearly shows information loss (the first bit is lost each step).
          *   Cons: Binary might be tricky for some students comfortable only with decimals. "Mod 1" concept needs careful explanation without math jargon.
      *   *Candidate 2: The Logistic Map ($rx(1-x)$).*
          *   Rule: Quadratic iteration.
          *   Pros: Classic chaos example.
          *   Cons: Arithmetic is too heavy for hand calculation (squaring decimals, multiplying). Too slow for a 90-minute session with 16 students. Error propagation in calculation would swamp the theoretical error.
      *   *Candidate 3: The "Digit Drop" Map (Decimal Shift).*
          *   Rule: Take a number between 0 and 1. Multiply by 10. Keep the fractional part. The integer part is the "output" or "state" for that round.
          *   Example: $0.1234 \to 1.234 \to$ Output 1, New State $0.234$.
          *   Pros: Trivial arithmetic. Directly models the "shifting out" of information. Very clear connection between precision (digits known) and prediction horizon.
          *   Cons: It's technically the Bernoulli Map (base 10). It's discontinuous. But for the philosophical point, it's perfect.

      *   *Rejection:* Candidate 2 (Logistic Map).
          *   *Reason:* Computational burden. The goal is to feel the *epistemic* limit, not struggle with multiplication. If students spend 5 minutes calculating one step, they won't get enough iterations to feel the horizon shrink. Candidate 1 (Binary) is good, but Decimal (Candidate 3) is more intuitive for general undergraduates who might be rusty on binary. I will refine Candidate 3 to ensure it feels like a "system" and not just reading digits.

      *   *Selection:* **The Decimal Shift Engine (Base-10 Bernoulli Map).**
          *   *Justification:* It isolates the mechanism of information loss. $x_{n+1} = 10x_n \mod 1$. The $n$-th output is the $n$-th decimal digit of the initial seed. This makes the relationship between precision (number of digits known) and horizon (number of steps predictable) exactly linear in digits, which means logarithmic in precision value ($10^{-k}$). It is trivially hand-executable.

  3.  **Designing the Activity Structure:**

      *   **Phase 1: The Black Box (Ignorance).** Students try to predict the next number without knowing the rule. They will fail.
      *   **Phase 2: The White Box (Knowledge).** The rule is revealed. Now they know the *law*. But do they know the *future*? Only if they know the *seed* (initial state).
      *   **Precision Market:** Students can buy digits of the seed. Cost increases or is fixed per digit.
