          *   Let's make the "Statistician" win by accumulating steady points while predictors go bust trying to buy deep precision.

  5.  **Addressing the "Determinism depends on description" goal (Point 4):**
      *   Need a way to show that coarse-graining makes it deterministic/predictable.
