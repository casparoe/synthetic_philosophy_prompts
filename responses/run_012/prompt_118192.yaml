      *   **Deliverable:** Runnable activity + debrief (NOT a lecture outline).
      *   **Learning Goals (Felt, not heard):**
          1.  Determinism $\neq$ Predictability (law known, future unavailable).
          2.  Logarithmic loss of precision (1 digit $\to$ fixed steps; horizon $\propto$ log(precision)).
          3.  Aggregate behavior is predictable (chaos $\neq$ randomness).
