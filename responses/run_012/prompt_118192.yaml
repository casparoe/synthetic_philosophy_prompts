          *   Statistician Reward: 2 tokens per round for correctly calling the *frequency* (e.g., "All digits appear equally often").
          *   *Rational Choice:* If I want to predict Step 10, I need 10 digits. Cost = 10. Reward = 5. Loss = 5. Don't do it.
          *   If I want to predict Step 1, I need 1 digit. Cost = 1. Reward = 5. Gain = 4. Do it.
          *   This creates a "Prediction Horizon" where it stops being worth it.
          *   *Wait, the prompt asks for:* "precision converts into prediction time only logarithmically: one further digit of information about the present buys a fixed, small number of additional steps."
