      *   *Wait, Point 4 says:* "same goings-on can be described deterministically or indeterministically depending on how finely the state space is carved."
      *   *Implementation:* In the debrief, show that if we treat the state as "The specific 10-digit number," it's deterministic. If we treat the state as "The distribution of digits," it's stochastic. The *world* didn't change, the *description* did.

  6.  **Drafting the Timeline:**
      *   0-10: Intro & Setup (No forbidden words).
