  A hundred minds assess the risk, and each one **makes**; **the threshold breaks**.
  The benefit outweighs the cost, whatever it **takes**; **the threshold breaks**.

  The safest guess is silence, yet the loudest certainty **wakes**; **the threshold breaks**.

  Sometimes the cure is hidden here, whatever the **stakes**; **the threshold breaks**.

  Not malice drives the opening, but hope's asymmetric **mistakes**; **the threshold breaks**.

  As numbers swell, the chance of rest declines, no pause it **makes**; **the threshold breaks**.

  To wait for consensus is to freeze, a hand that nothing **takes**; **the threshold breaks**.

  I count myself among the wise, no special care it **makes**; **the threshold breaks**.
  And if I am the outlier, no warning it **awakes**; **the threshold breaks**.

  ***

  **Note on Form and Mechanics**
  This poem sacrifices the quantitative meter (*bahar*) of the traditional ghazal for English stress patterns, and it substitutes the poet's customary pen name in the *maqta* with a generic "I" to implicate the speaker as merely another agent in the pool. Philosophically, it treats the unilateral action as a binary event (the threshold breaks or it does not), whereas real-world scenarios often involve degrees of initiation that could mitigate the selection effect. Finally, the form enforces a lyrical unity through the refrain that contradicts the thematic fragmentation of the agents, an intentional irony suggesting that the outcome is unified even if the decision-making is not.
