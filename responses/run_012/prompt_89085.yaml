          6.  Evaluate four specific approaches against the list (Principle of Indifference, Symmetry/Group Invariance, Maximum Entropy, Subjective Bayesianism/No Rule).
          7.  Format: Table is fine for the evaluation.
      *   **Tone:** Professional, precise, suitable for a novelist doing research (clear, conceptual, not overly technical jargon without explanation).
      *   **Constraint:** Do not give a bibliography. Focus on the logical structure of the problem.

  2.  **Deconstruct the Core Problem:**
      *   The problem is "Reasoning from Ignorance" or "The Objective Prior Problem."
      *   In Bayesian terms: How do you set $P(H)$ when you have no data?
      *   Historical context: Laplace's Principle of Indifference, Keynes, Jaynes, Subjective Bayesians (Savage, de Finetti).
      *   Key paradoxes: Bertrand's Paradox, The Water-and-Wine Paradox, The Problem of Old Evidence (maybe less relevant here), The Reference Class Problem.

  3.  **Drafting the Desiderata (The List):**
      *   *User's List:* Invariance to units/coordinates, Invariance to partitioning (coarsening/refinement), No zero probabilities for possible events, Coherence (Dutch Book), Updating (Conditionalization), Definite numbers for continuous/unbounded spaces.
      *   *My Additions/Refinements:*
          *   **Coherence (Dutch Book):** Essential for betting plots.
          *   **Invariance (Transformation Groups):** The "units" constraint. Crucial for Bertrand's Paradox.
          *   **Partition Invariance:** The "carving up" constraint. Crucial for the paradox of the cube/numbers.
          *   **Regularit (No Zeros):** Important for learning (can't update on impossible things).
          *   **Consistency with Evidence (Likelihood Principle/Updating):** Must work with Bayes' theorem.
          *   **Computability/Definiteness:** The character needs a number to bet.
          *   **Empirical Calibration (optional but good):** Does it match long-run frequencies if known? (Maybe too frequentist).
          *   **Ignorance Representation:** Does it actually represent *ignorance* or does it smuggle in information?

      *   *Categorization:* Hard Constraints (Logic/Math) vs. Philosophical Camps (Interpretation).
          *   Hard: Coherence, Consistency (Logic), Updating.
          *   Camp/Debatable: Invariance (Jaynes vs. Subjectivists), Regularity (some allow zeros), Uniqueness (is there *one* right prior?).

  4.  **Identifying Incompatibilities (The Impossibility Results):**
      *   This is the crux of the "fraud vs. genius" plot.
      *   *The Big Conflict:* **Partition Invariance** vs. **Probability Axioms (Countable Additivity/Normalization)** vs. **Uniqueness.**
      *   *Bertrand's Paradox:* Shows that "Equally Likely" depends on how you parameterize (Partition/Invariance issue).
      *   *The Impossibility Theorem:* You cannot have a prior that is invariant under *all* transformations and satisfies standard probability axioms on an unbounded space (Improper priors).
      *   *Specific Conflict:* **Uniqueness** (One right answer) vs. **Invariance** (Different parameterizations yield different priors unless specific groups are chosen) vs. **Countable Additivity**.
      *   *Key Result:* There is no universal Principle of Indifference that satisfies all invariance requirements simultaneously without leading to contradictions (like $P(A) + P(not A) \neq 1$).
      *   *The "Killer" Constraint:* **Transformation Invariance** (or Parameterization Invariance). This is what kills Laplace's simple indifference.

  5.  **Evaluating the Four Approaches:**
      1.  **Classical Indifference (Laplace):** Fails Invariance (Bertrand's Paradox). Fails Continuous/Unbounded.
      2.  **Symmetry/Group Invariance (Jaynes):** Solves Bertrand's by picking the *right* symmetry group. Struggles with Uniqueness (which group?) and Improper Priors (integration issues).
      3.  **Maximum Entropy (MaxEnt):** Good for constraints. Fails if no constraints (reverts to Indifference). Depends on measure.
      4.  **Subjective/No Rule (Personalist):** Dodges the problem. Says "Ignorance is a state of mind, not a number." Fails the "Definite Number" requirement for the plot (unless she forces it).

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the stakes (plot validity).
      *   **Section 1: The Desiderata:** Table or List with Motivation and Status (Hard/Soft).
      *   **Section 2: The Conflicts:** Where the math breaks.
      *   **Section 3: The Killer Constraint.**
      *   **Section 4: Evaluation of Candidates:** Table format as requested.
      *   **Conclusion:** Advice for the novelist (how to frame the character's breakthrough or downfall).

  7.  **Drafting Content - Specific Considerations:**
      *   *Constraint 1: Coherence.* (Dutch Book). Hard constraint. If she loses sure money, she's a fraud.
      *   *Constraint 2: Parameterization Invariance.* (Units). Hard for physics, soft for pure stats. If she bets on length vs. area, she shouldn't contradict herself.
      *   *Constraint 3: Partition Invariance.* (Refinement). If I split "Red" into "Crimson" and "Scarlet," total probability of Red shouldn't change. Hard constraint logically, but often violated by indifference principles.
      *   *Constraint 4: Regularity.* (No zeros). Soft. Some say impossible events get zero. But for learning, need non-zero.
      *   *Constraint 5: Uniqueness.* (Objectivity). This is the character's claim. "The" solution. This is the most controversial. Subjectivists deny this is possible.
      *   *Constraint 6: Improper Priors.* (Unbounded). Can you integrate to 1? If not, it's not a probability distribution. Hard constraint for standard probability, but physicists ignore it.

      *   *The Conflict:* You can't have Uniqueness + Parameterization Invariance + Standard Probability Axioms on continuous unbounded spaces. (Reference: The problem of Jeffreys priors vs. Uniform priors).
      *   *The Killer:* **Parameterization Invariance.** It kills the naive "equal probability" idea immediately.

  8.  **Review against User Constraints:**
      *   "Not asking for a bibliography." -> Check.
      *   "Set out desiderata... cases... distinctions... constraints." -> Check.
      *   "Mark which are genuine constraints... which are tastes." -> Check.
      *   "Which requirements cannot be satisfied together." -> Check.
      *   "Which single requirement... would eliminate the most candidates." -> Check.
      *   "Close with... classical rule... symmetries... entropy... no rule." -> Check.
      *   "Table is fine." -> Check.

  9.  **Final Polish:**
      *   Ensure the distinction between "Hard" (Logic/Coherence) and "Soft" (Philosophical preference) is clear.
      *   Make sure the "Fraud vs. Genius" angle is supported. If she claims *Uniqueness* and *Invariance*, she is likely mathematically wrong unless she restricts the domain significantly.
      *   *Self-Correction on "Partition Invariance":* Technically, probability theory *requires* additivity. If you partition A into B and C, P(A) must equal P(B)+P(C). The problem with Indifference is that applying "Equal Probability" to different partitions yields different results. So the desideratum is "Consistency across Partitions," not just Additivity.
      *   *Refining the "Killer":* The demand for a **Unique, Objective Prior** that satisfies **Invariance** is the impossibility. I should highlight that.

  10. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is the specification you requested. It is structured to help you determine whether your character has found a loophole in mathematical logic or is simply unaware of the impossibility theorems that have stood for a century.

  ### I. The Desiderata of Reasoning from Ignorance

  These are the requirements any method claiming to generate probabilities from a state of ignorance must satisfy. I have categorized them as **Hard Constraints** (violations imply mathematical incoherence or guaranteed financial loss) or **Philosophical Camps** (violations imply the method belongs to a specific school of thought, e.g., Objective vs. Subjective Bayesianism).

  | Requirement | Specification | Motivating Case | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Coherence** | The assigned confidences must obey the axioms of probability (non-negativity, normalization, additivity). | **The Dutch Book:** If her probabilities violate these, a clever bettor can construct a set of bets that guarantees your character loses money, regardless of the outcome. | **Hard Constraint** |
  | **2. Updating Consistency** | When new evidence arrives, the new confidence must equal the old confidence conditional on that evidence (Bayes' Rule). | **Dynamic Coherence:** If she updates by any other rule, she can be Dutch-Booked over time. She must not throw away information or double-count it. | **Hard Constraint** |
  | **3. Regularity** | No non-empty possibility may be assigned probability zero. | **Learning from Surprise:** If she assigns zero to a possibility, no amount of evidence can ever raise its probability. She becomes dogmatic and unable to learn. | **Philosophical Camp** (Standard in strict Bayesianism; relaxed in some statistics) |
  | **4. Parameterization Invariance** | The verdict must not change if the unknown is described in different units or coordinates (e.g., length vs. volume, linear vs. log scale). | **The Water-and-Wine Paradox:** A mixture is between 1/2 and 1 water. Is the ratio of water-to-wine uniform? Or is the ratio of wine-to-water uniform? They yield different probabilities for the same physical state. | **Hard Constraint** (For physical claims); **Camp** (For abstract parameters) |
  | **5. Partition Invariance** | The verdict must not depend on how the space of possibilities is carved up (coarsened or refined). | **The Paradox of the Cube:** A factory makes cubes with side length 0–1cm. Is the probability the side is 0–0.5cm equal to 1/2? Or is the *area* uniform? Or the *volume*? "Equally likely" gives different answers for the same object. | **Hard Constraint** (Logically required); **Impossible** (See Section II) |
  | **6. Uniqueness (Objectivity)** | Two rational agents with the same ignorance must derive the *same* numbers. | **The Plot Requirement:** If the answer is opinion, she hasn't solved the problem; she has just expressed a preference. To testify under oath as an expert, the method must yield *the* answer, not *an* answer. | **Philosophical Camp** (Objective Bayesians require this; Subjective Bayesians deny it is possible) |
  | **7. Definiteness** | The method must return a definite number even when the range is continuous or unbounded. | **Betting:** You cannot place a bet on "undefined." To act, she needs a value, even for infinite spaces (e.g., the mass of a planet). | **Hard Constraint** (For action); **Mathematically Difficult** |

  ---

  ### II. The Incompatibilities (Where the Fraud is Exposed)

  You suspect several pairs stand in open conflict. You are correct. This is the engine of your plot. The problem of "Objective Priors" is widely considered unsolved precisely because the following triads cannot be satisfied simultaneously.

  **1. The Impossibility of Partition Invariance + Uniqueness + Standard Probability**
  If your character demands that "Ignorance" means "Assign equal probability to every alternative," she violates **Partition Invariance**.
  *   *The Conflict:* If I am ignorant about the length of a cube (0 to 1), I assign 0.5 to "length < 0.5". But if I am ignorant about the volume (0 to 1), I assign 0.125 to "volume < 0.125" (which corresponds to length < 0.5).
  *   *The Result:* She cannot claim her method yields a unique, objective number *and* respects the logic of partitions. One must give. If she keeps Uniqueness, she is mathematically inconsistent (Fraud). If she keeps Consistency, she admits there is no single "ignorance" prior (No Solution).

  **2. The Impossibility of Parameterization Invariance + Definiteness (on Unbounded Spaces)**
  On an unbounded space (e.g., "The mean of this distribution could be anything from $-\infty$ to $+\infty$"), a uniform distribution is impossible (it cannot sum to 1).
  *   *The Conflict:* To get **Definiteness**, she must use an "improper prior" (a function that integrates to infinity but works in ratios). To satisfy **Coherence** (Requirement 1), probabilities must sum to 1.
  *   *The Result:* She can have a method that works for betting (using ratios) or a method that is a valid probability distribution, but not both on unbounded domains.

  **3. The Conflict of Uniqueness vs. Information**
  To satisfy **Parameterization Invariance** (Requirement 4), one usually has to introduce a "measure" or a metric (a way of measuring distance between possibilities).
  *   *The Conflict:* Choosing a metric *is* information. If she claims to be "genuinely ignorant," she cannot justify choosing Euclidean distance over Log-Euclidean distance without smuggling in assumptions about the physical world.
  *   *The Result:* A truly unique solution requires a "view from nowhere," but invariance requires a specific geometric view.

  ### III. The Killer Constraint

  If you could keep only one requirement to eliminate the most candidates, it is **Requirement 4: Parameterization Invariance.**

  *   **Why:** This is the specific constraint that kills the "Classical Rule" (Laplace's Principle of Indifference). It is the mathematical formalization of the intuition that "nature doesn't care about your units."
  *   **Effect:** It immediately disqualifies any method that simply says "count the possibilities and divide." It forces the character to use Group Theory or Differential Geometry to find a prior that remains stable when the variables are transformed.
  *   **Plot Utility:** If your character claims to have solved the problem, her breakthrough must be a justification for why *one* parameterization is the "natural" one, or a mathematical trick that makes the probabilities invariant under transformation. If she ignores this, she is easily debunked by a rival statistician changing the units from meters to feet.

  ### IV. Evaluation of Candidate Methods

  Here is how the four major approaches fare against your specification. This should help you decide which "camp" your character is attacking or defending.

  | Method | Coherence | Invariance (Params/Partitions) | Uniqueness | Definiteness | Verdict for your Plot |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Classical Indifference** (Laplace) | **Pass** (on finite sets) | **Fail.** (Bertrand's Paradox). Yields different probabilities for the same event depending on description. | **Pass** (Claims one answer) | **Fail** (Undefined on unbounded/continuous spaces). | **Fraud.** Easy to debunk. She would lose bets where the opponent rephrases the proposition. |
  | **2. Symmetry / Group Invariance** (Jaynes) | **Pass** | **Pass** (By design). Uses transformation groups to find the one measure that is invariant. | **Conditional.** Unique *given* a chosen symmetry group. | **Pass** (Often yields "improper" priors that work for betting but aren't probabilities). | **Plausible Genius.** This is the strongest candidate for a "solution." The plot hole: Who chooses the group? If she claims the group is obvious, she may be hiding assumptions. |
  | **3. Maximum Entropy** (MaxEnt) | **Pass** | **Fail.** Depends on the choice of the "measure" (the baseline). Entropy is not invariant under coordinate change without a prior measure. | **Conditional.** Unique *given* constraints and a measure. | **Pass.** | **Half-Solution.** Good for "I know the average, but nothing else." Bad for "I know nothing." She would need to justify the baseline measure. |
  | **4. Subjective / No Rule** (Personalist) | **Pass** | **N/A.** (Denies the problem exists). Priors are opinions, not facts. | **Fail.** (Explicitly rejects uniqueness). | **Pass.** (You can have an opinion on anything). | **The Antagonist.** This view says your character is chasing a ghost. If this is true, her "ruining someone" is unethical because her numbers are just opinions sold as facts. |

  ### Summary for the Novelist

  If your character claims to have found **The Solution** (Uniqueness) that works on **Continuous Spaces** (Definiteness) and survives **Reparameterization** (Invariance), she is mathematically asserting something that most statisticians believe is impossible.

  *   **To make her a Genius:** She must have found a way to derive the "Natural Measure" (Requirement 4) from the structure of the problem itself, rather than assuming it. She must show that for *this specific class of problems*, the symmetry group is unique.
  *   **To make her a Fraud:** She is using Classical Indifference (Method 1) but ignoring Parameterization Invariance. She calculates odds based on "counting cases" in a continuous space without realizing that the "size" of a case depends on the coordinates used. When the defense attorney asks her to recalculate the odds using logarithmic units instead of linear ones, her numbers change, her coherence breaks, and the jury realizes she was betting with a rigged ruler.
