prompt: |-
  I'm writing a small internal grant application (six months, me plus maybe a grad student) and I want to turn a half-formed thought about consequentialist cluelessness into a real proposal, so I need you to help me frame it properly.

  The thought: I think the cluelessness debate keeps running two different complaints together. One is that we can't compute the far-future consequences of what we do — that's a fact about us and our limits. The other is that for lots of pairs of acts there may be no settled fact about the long-run value difference at all, because the difference depends on what later people choose to do with whatever we leave them, and that hasn't been decided yet. The standard replies — swap actual consequences for expected value over some enormous space of futures, or look for a dominance argument — strike me as only really engaging the first complaint. If the second one is right, it isn't an epistemic problem at all, and telling me to maximize expected value is answering a question I wasn't asking.

  So the question I want the proposal built around: for a given pair of ordinary acts, is the claim that their far-future value difference is unsettled — rather than merely unknown — coherent and defensible, and if it is, what's left of the expected-value response? I want it stated precisely enough that it could come out either way, not rigged.

  What I need from you: the precise question, why the usual replies don't settle it, what I'd actually do month by month (I was thinking of working through three structurally different cases — a donation, a vote, and funding a line of research — and seeing whether the indeterminacy claim survives in all, some, or none of them), what a good result looks like, what would count as the project failing, and whether six months is realistic or whether this is really a book. No bibliography, I'll put the references in myself.
reasoning: |-
  Here's a thinking process that leads to the suggested grant proposal:

  1.  **Analyze the Request:**
      *   **Goal:** Turn a half-formed philosophical thought about consequentialist cluelessness into a formal grant proposal (6 months, PI + grad student).
      *   **Core Idea:** Distinguish between two types of "cluelessness":
          1.  *Epistemic:* We can't know the consequences (computational limits).
          2.  *Metaphysical/Indeterminacy:* There *is* no fact of the matter about the value difference because it depends on future free choices/contingencies not yet settled.
      *   **Critique of Status Quo:** Standard replies (Expected Value, Dominance) address (1) but miss (2). If (2) is true, EV maximization is category-mistaken.
      *   **Requirements:**
          *   Precise research question (neutral framing).
          *   Explanation of why usual replies fail.
          *   Month-by-month work plan (3 case studies: donation, vote, research funding).
          *   Success/Failure criteria.
          *   Feasibility assessment (6 months vs. book).
          *   *Constraint:* No bibliography (user will add refs).

  2.  **Deconstruct the Core Philosophical Argument:**
      *   *The "Cluelessness" Problem:* Associated with Lenman, Greco, etc. Consequentialism demands we maximize good, but we can't predict the long-term future (butterfly effects).
      *   *The User's Twist:* It's not just that we *don't know* (epistemic); it's that the truth value of "Act A is better than Act B in the long run" might be *indeterminate* (metaphysical/semantic). This leans on open future views (Aristotelian, branching time, etc.).
      *   *The Stakes:* If indeterminate, Expected Value (EV) calculations presuppose a probability distribution over *determinate* outcomes. If outcomes aren't determinate, probabilities might be ill-defined (not just unknown).

  3.  **Drafting the Proposal Sections:**

      *   **Title:** Needs to be academic but punchy. "Metaphysical Cluelessness," "Indeterminacy in Consequentialist Evaluation."
      *   **Abstract/Summary:** Condense the core distinction.
      *   **Research Question:** Needs to be neutral. Not "Prove indeterminacy," but "Assess the coherence of indeterminacy."
      *   **Why Standard Replies Fail:** Explain why EV and Dominance assume bivalence/determinacy.
      *   **Methodology/Work Plan:** Break down the 6 months.
          *   Months 1-2: Theoretical groundwork (defining indeterminacy).
          *   Months 3-5: The three case studies (Donation, Vote, Research).
          *   Month 6: Synthesis and implications for EV.
      *   **Outcomes:** What does success look like? (A clear map of where indeterminacy holds). What does failure look like? (Collapsing back into mere epistemic uncertainty).
      *   **Feasibility:** Is 6 months enough? For a focused paper/argument, yes. For a whole new ethical system, no. Need to frame it as a targeted investigation.

  4.  **Refining the Philosophical Nuance (Self-Correction during drafting):**
      *   *Critique:* Is this just "free will"?
      *   *Correction:* It's about the *truth conditions* of counterfactuals regarding future contingents. If "If I donate, X happens in 200 years" has no truth value, then comparing Value(A) and Value(B) is problematic.
      *   *Critique:* Isn't EV just subjective credence?
      *   *Correction:* Even subjective credence requires a sample space of possible worlds. If the "worlds" themselves are metaphysically unsettled (not just unknown), does the probability space hold? The proposal needs to highlight this tension without getting bogged down in modal metaphysics jargon.
      *   *Feasibility Check:* 6 months is tight for a PI + Student. It's basically one solid paper. I need to make sure the scope doesn't explode. The three case studies are a good way to bound it.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Title:* "Metaphysical Cluelessness: Indeterminacy in Long-Term Consequentialist Evaluation."
      *   *Question:* "To what extent is the value difference between acts metaphysically indeterminate rather than merely epistemically opaque?"
      *   *Plan:*
          *   M1: Lit review + Formalizing the distinction.
          *   M2: Case 1 (Donation) - High leverage, long chain.
          *   M3: Case 2 (Vote) - Low individual impact, collective dependence.
          *   M4: Case 3 (Research) - Knowledge production, path dependence.
          *   M5: Analyzing the EV response against findings.
          *   M6: Writing/Polishing.
      *   *Success:* A published paper (or draft) that forces consequentialists to address metaphysics, not just epistemology.
      *   *Failure:* Showing that indeterminacy collapses into standard uncertainty. (This is actually a valid result, not a "failure" in science, but for a grant, "failure" means not answering the question). Let's define failure as "inconclusive" or "unable to distinguish the two complaints."

  6.  **Final Review against Constraints:**
      *   No bibliography? Check.
      *   6 months? Check.
      *   PI + Grad Student? Check.
      *   Precise question? Check.
      *   Why usual replies fail? Check.
      *   Success/Failure criteria? Check.

  7.  **Polishing the Tone:** Needs to sound like a grant application (persuasive, structured, feasible) but respect the philosophical depth. Avoid over-promising. Emphasize the *conceptual clarity* contribution.

      *(Self-Correction on Feasibility)*: 6 months is very short for deep metaphysics. I should advise the user to frame this as a "proof of concept" or a "targeted analysis" rather than a definitive solution to the open future. I will add a note about scope management.

      *(Refining the "Failure" condition)*: In philosophy, proving your initial hunch wrong is still success. I need to frame "failure" as *failing to make progress* or *failing to distinguish the concepts*, not necessarily proving indeterminacy false.

  8.  **Final Polish:** Organize into clear headings matching standard grant sections (Project Summary, Intellectual Merit, Work Plan, etc., though I'll use the user's requested structure).

      *Let's write it.*
answer: |-
  Here is a draft framework for your grant proposal. It is structured to meet standard internal grant requirements (clarity, feasibility, deliverables) while preserving the philosophical nuance of your argument.

  ### **Project Title**
  **Metaphysical Cluelessness: Distinguishing Epistemic Limits from Ontological Indeterminacy in Consequentialist Evaluation**

  ### **1. The Precise Research Question**
  *Standard formulation:* "Can we know the long-term consequences of our actions?"
  *Proposed formulation:* "For ordinary moral acts, is the axiological difference between alternatives **indeterminate** (lacking a truth value due to future contingents) rather than merely **unknown** (having a truth value beyond our epistemic reach), and does this distinction invalidate standard Expected Value (EV) modeling?"

  This framing is neutral. It allows for the conclusion that the "indeterminacy" claim is incoherent (collapsing back into standard epistemic uncertainty) or that it is robust (requiring a revision of consequentialist decision theory).

  ### **2. Intellectual Merit: Why Standard Replies Do Not Settle This**
  The proposal must demonstrate that existing literature addresses the *Epistemic Complaint* but bypasses the *Metaphysical Complaint*.

  *   **The Epistemic Complaint:** There is a fact of the matter about whether Act A produces more value than Act B over 200 years, but humans cannot compute it.
      *   *Standard Reply:* Use Expected Value (EV) over a credence distribution, or seek "robust" differences that hold across most plausible futures.
      *   *Why it fails the Metaphysical Complaint:* EV assumes a sample space of possible worlds where outcomes are determinate. If the future is "open" in a strong metaphysical sense (e.g., branching time, truth-value gaps for future contingents), there may be no fact of the matter to assign a probability *to*. You cannot maximize expected value over a set of outcomes that do not yet exist even as truth-apt propositions.
  *   **The Metaphysical Complaint:** The value difference depends on free choices or chaotic contingencies that are not yet settled facts.
      *   *Standard Reply:* Often ignores this, treating "uncertainty" as purely subjective credence.
      *   *Why this project is needed:* If the Metaphysical Complaint holds, the debate shifts from *how much information we have* to *what kind of things moral evaluations are*. This project tests whether the indeterminacy claim survives contact with specific, structurally distinct cases.

  ### **3. Work Plan (6 Months)**
  **Personnel:** PI (conceptual framework, EV analysis) + Grad Student (case study reconstruction, literature mapping).

  *   **Month 1: Conceptual Groundwork**
      *   **PI:** Formalize the distinction between "Unknown" (epistemic modality) and "Unsettled" (metaphysical/semantic modality). Define the conditions under which a value comparison lacks a truth value.
      *   **Student:** Map existing "cluelessness" arguments (e.g., Lenman, Greco, Greaves) to categorize which complaints they address.
      *   **Deliverable:** A shared working document defining the "Indeterminacy Thesis."

  *   **Month 2: Case Study 1 — The High-Leverage Donation**
      *   **Focus:** A large, one-off intervention (e.g., funding a specific AI safety project vs. global health).
      *   **Task:** Analyze the chain of dependence. Does the value difference hinge on specific future choices that are genuinely open?
      *   **Hypothesis:** High leverage may increase susceptibility to indeterminacy because the "branching" points are more significant.

  *   **Month 3: Case Study 2 — The Marginal Vote**
      *   **Focus:** A low-impact, collective action.
      *   **Task:** Determine if the indeterminacy here is merely epistemic (we don't know the margin) or metaphysical (the future political landscape is not a fixed fact).
      *   **Hypothesis:** This case may collapse back into epistemic uncertainty, serving as a control case.

  *   **Month 4: Case Study 3 — Funding a Line of Research**
      *   **Focus:** Path-dependent knowledge production.
      *   **Task:** Assess whether "leaving resources to future people" creates a value gap that is unsettled because the *recipients'* values are not yet fixed facts.
      *   **Hypothesis:** Strongest candidate for metaphysical indeterminacy (values evolve, not just facts).

  *   **Month 5: Stress-Testing the Expected Value Response**
      *   **Joint:** Take the findings from Months 2–4 and attempt to construct an EV model for each.
      *   **Task:** Identify exactly where the model breaks. Is it a lack of probabilities (epistemic) or a lack of well-defined outcomes (metaphysical)?
      *   **Deliverable:** Draft of the core argument section.

  *   **Month 6: Synthesis and Dissemination**
      *   **PI:** Finalize the argument regarding what is "left" of the EV response.
      *   **Student:** Prepare manuscript for submission (target: *Ethics*, *Philosophy & Phenomenological Research*, or similar).
      *   **Deliverable:** Complete manuscript draft.

  ### **4. Criteria for Success and Failure**
  In philosophy, "negative" results are still results. We define success and failure by *resolution*, not by proving the initial hunch correct.

  *   **Success (Strong):** The project demonstrates that in at least one case study (likely Research or Donation), the indeterminacy claim is coherent and defensible, and that standard EV responses commit a category mistake. (Result: A paper arguing for a revision of consequentialist decision theory).
  *   **Success (Moderate):** The project clarifies the distinction but shows that for *practical* decision-making, the indeterminacy collapses into epistemic uncertainty (e.g., via supervaluation or precisification). (Result: A paper clarifying the limits of the cluelessness objection).
  *   **Failure:** The project fails to distinguish the two complaints rigorously, resulting in a conflation of "we can't know" and "there is nothing to know." Or, the case studies prove too heterogeneous to draw a general conclusion about consequentialist evaluation.

  ### **5. Feasibility Assessment: Is Six Months Realistic?**
  *   **Verdict:** Yes, but only because the scope is tightly bounded.
  *   **Risk:** This topic easily expands into a book-length treatment of modal metaphysics and moral semantics.
  *   **Mitigation:** The proposal explicitly limits the scope to *three specific case studies* and one specific counter-argument (the EV response). We are not solving the "open future" problem; we are testing its impact on *consequentialist cluelessness*.
  *   **Role of Grad Student:** Crucial for feasibility. The student will handle the reconstruction of existing arguments and the initial drafting of the case studies, allowing the PI to focus on the core EV/Indeterminacy interface.
  *   **Deliverable Reality:** A 6-month timeline targets a single, high-quality journal article (8,000–10,000 words), not a monograph. This is appropriate for an internal seed grant.

  ### **6. Note on References**
  (To be inserted by PI): Key literature will include discussions on consequentialist cluelessness (Lenman, Greco), future contingents (Aristotle, Open Future views), and decision theory under indeterminacy (Weatherson, Bradley).

  ***

  ### **Advice for the PI (You)**
  *   **The "Book" Worry:** You asked if this is really a book. It *could* be, but only if you try to solve the metaphysics of the open future. If you treat the metaphysics as a *parameter* (i.e., "If the open future view is true, what happens to consequentialism?"), it is a paper. Keep the focus on the *ethical implication*, not the metaphysical proof.
  *   **The Grad Student:** Make sure the student knows philosophy of language/logic enough to handle "truth-value gaps." If they are purely empirical/social science, Month 1 will take three months.
  *   **The "So What?":** Reviewers will ask why this matters. The punchline is: If you are an Effective Altruist or long-termist, you are betting on EV calculations. If the metaphysics of the future makes those calculations ill-formed, the entire normative framework needs adjustment. That is the selling point.
