prompt: |-
  I would like you to act as a philosopher of language who has taught this material many times and also as a patient teacher, and to help me plan an explanation rather than give me one. In a fortnight I am running a two-hour session for a group of working computational linguists and NLP engineers who build conversational systems. They arrive with a cartoon of speech-act theory that they have absorbed second-hand: they will confidently tell you that a performative is an utterance that does something rather than describes something, and that "I promise" is the paradigm case. My aim is to carry them well past that cartoon, to the point where they can see why the distinction that motivates it gives way, and what replaces it. Before you draft anything, please think the whole problem through carefully and do some visible brainstorming about the dependency structure — what must be in place before each later idea can land, and where their existing intuitions will pull them off course.

  Build the plan around a single example that carries the session, and choose that example and defend the choice. It needs to present itself as a clean performative on first contact and then reveal a descriptive or truth-evaluable face, so that the audience feels the distinction strain and finally crack rather than merely being informed that it does. If you judge the obvious candidates — a promise, a bet, the christening of a ship — to be the wrong ones to carry it, say why and propose what to use instead. Tell me what the carrying example must conspicuously lack and why, and I would rather it not lean on ritual, officials, or a physical object to do its work.

  Then map the misconceptions in the order this particular audience will form them, giving the precise point in the sequence where each should be headed off. I expect at least the following: that performativity is simply emotional or expressive language; that it is signalled by a first-person present-tense verb, so that "I believe" and "I know" seem to qualify while "You are fired" and "This meeting is adjourned" do not; that constatives are true or false while performatives are only felicitous or infelicitous, which misses that constatives carry their own felicity conditions and can misfire in the same way; and that the illocutionary act — what one does in speaking — is the same as the perlocutionary effect — what one brings about by speaking, so that "I warned him" is conflated with "I alarmed him." Tell me where in the arc each of these should be intercepted, and how, and also what I should openly decline to settle in the room, so that I do not oversell a tidier picture than the material supports.

  I want the session to close by pressing the example into a case this audience cares about and cannot look up an answer to: a conversational system that emits "I promise to call you tomorrow," or a corporation that issues an apology through a template. Plan how to pose this so that it tests whether they have grasped what a speech act requires — uptake, standing, agency, commitment — rather than whether they can recite a taxonomy, and give me one closing question whose answer would show me whether the collapse of the distinction has genuinely landed rather than merely been noted.

  Please write the plan as continuous prose, in the manner of a letter or a long email: no headings, no bullet points, no numbered lists, no bold or italicised labels, and no tables. I want the reasoning to live in the sentences themselves rather than be carried by the formatting.
