answer: |-
  Dear Colleague

  It is a pleasure to collaborate on this syllabus, and I appreciate the ambition of your goal. You are asking these engineers to dismantle the very categorization schemes their models rely on, which is a delicate pedagogical task. If we move too fast, they will reject the philosophy as impractical metaphysics; if we move too slow, they will remain in the comfort of the cartoon. To succeed, we must structure the session not as a lecture on Austin but as a guided experiment where their own intuitions lead them into a trap they cannot escape without upgrading their framework. I have spent some time thinking about the dependency structure of this argument, because the order in which we introduce these concepts is just as important as the concepts themselves. We cannot begin by telling them the distinction collapses, because they need to feel the weight of the distinction before it can break. We must first let them build the house of speech-act theory using their existing intuitions, only then to show them that the load-bearing walls are made of glass. This means we need to start with their competence, validate their current model, and then introduce pressure points that cause structural failure. If we challenge the definition of a performative before they have agreed on what a constative is, we will lose them in terminology. Therefore, the session must begin by solidifying the cartoon they already hold, perhaps even sharpening it, so that when we eventually blur it, the loss of clarity feels like a discovery rather than a confusion.

  Regarding the carrying example, I have considered the usual suspects and I believe we must avoid them. You mentioned the promise, the bet, and the christening of a ship, and I agree we should set those aside. The promise is too entrenched as the paradigm case; it is the example they already have in their training data, and it reinforces the idea that performatives are a special class of magical verbs. The christening of a ship is too dependent on institutional ritual and physical objects, which allows the audience to compartmentalize performativity as something that only happens in courts or churches, far away from their chat interfaces. We need an example that feels mundane, interpersonal, and devoid of official ceremony, yet still strains under the weight of the performative-constative distinction. I propose we build the session around the utterance I predict. This choice requires some defense. On first contact, I predict looks like a clean performative. It follows the first-person present indicative active form that their cartoon identifies as the marker of performativity. It feels like an action, a staking of a claim, a commitment to a view of the future. However, unlike I promise, the content of a prediction is inherently truth-evaluable. If I say I predict it will rain, and it does not rain, my utterance is not just infelicitous or void; it is false. This example conspicuously lacks institutional authority or ritual backing. Anyone can predict, and no official standing is required, which prevents the engineers from dismissing the mechanics as a matter of social hierarchy. By using I predict, we force them to confront a utterance that acts (it performs the prediction) and describes (it posits a future state of affairs that can be true or false). This tension is where the distinction will crack.

  Now we must map the misconceptions they will bring into the room and decide precisely where to intercept them, because if we address them out of order, we risk reinforcing the errors we mean to correct. The first misconception they will hold is that performativity is simply emotional or expressive language, a way of venting feelings rather than conveying information. We must head this off immediately in the first twenty minutes, before we even introduce the carrying example. We can do this by contrasting I predict with an exclamation like Ouch. If they think performatives are just expressions of inner states, they will classify I predict as merely expressing hope or fear. We need to establish early that speech acts involve commitments and conventions, not just psychology. If we do not settle this now, every subsequent example will be dismissed as mere emoting. The second misconception is that performativity is signalled strictly by a first-person present-tense verb, so that I believe and I know seem to qualify while You are fired and This meeting is adjourned do not. We should intercept this right as we introduce the carrying example. When we put I predict on the board, we should immediately contrast it with The system predicts rain. If their theory relies on the grammatical person, the passive or third-person version should fail to be a performative. But intuitively, a forecast issued by a system is still a prediction. By showing that the action of predicting happens regardless of the grammatical subject, we loosen their grip on the verb form as the sole identifier. This prepares them to see that the action lies in the context and uptake, not the morphology.

  The third and most critical misconception is that constatives are true or false while performatives are only felicitous or infelicitous. This is the core dogma we are here to dismantle, and we must not address it until the audience feels the strain of the carrying example. If we tell them this is false too early, they will not believe us. We need to let them analyze I predict using their existing tools. They will want to say it is felicitous if I am sincere, but they will also want to say it is false if the weather stays dry. We let this contradiction sit in the room. We need them to realize that constatives carry their own felicity conditions, such as having evidence or standing, and can misfire in the same way performatives do. If I state that the earth is flat without evidence, I have not just said something false; I have violated the norms of stating. We should introduce this realization only after they have struggled with the truth-value of the prediction, perhaps in the middle of the second hour. This is the pivot point where the distinction begins to dissolve. The fourth misconception is that the illocutionary act, what one does in speaking, is the same as the perlocutionary effect, what one brings about by speaking. They will conflate I warned him with I alarmed him. We should intercept this near the end of the session, just before we move to the application phase. If they confuse the act with the effect, they will evaluate their conversational systems based on user emotion rather than communicative commitment. We need to show that a warning can be successfully issued even if the listener remains calm, just as a promise is kept even if the beneficiary is ungrateful. This distinction is vital for their engineering metrics, so it must be clarified before they attempt to apply the theory.

  There are also matters we must openly decline to settle in the room, or else we risk overselling a tidier picture than the material supports. We should not attempt to provide a definitive taxonomy of illocutionary forces. Austin himself abandoned the quest for a complete list, and if we offer them one, we reify the very categorization we are trying to soften. We must be comfortable leaving the boundaries of speech act types fuzzy. Similarly, we should not resolve the problem of skepticism regarding other minds. When we discuss whether a bot can apologize, we cannot solve the philosophical problem of machine consciousness. We must bracket that question and focus instead on the social and normative conditions of the act. If we try to solve consciousness, we will lose the thread of language. Our goal is to show them that the validity of the speech act depends on uptake and convention, not on the metaphysical status of the speaker. By declining to settle these deeper metaphysical questions, we keep the focus on the linguistic and social mechanics that are relevant to their work.

  For the closing segment, we need to press the example into a case they care about and cannot look up an answer to. I suggest we present them with a scenario where a conversational system emits I promise to call you tomorrow, followed by a scenario where a corporation issues an apology through a template generated by an algorithm. We must pose this so that it tests whether they have grasped what a speech act requires rather than whether they can recite a taxonomy. We should ask them to identify what is missing in the machine case that might render the act void, not in a moral sense, but in a linguistic one. Is it the lack of agency? The inability to feel regret? Or is it the lack of standing within a community of practice? We want them to see that if the user accepts the promise and relies on it, the speech act has occurred socially, regardless of the bot's internal state. This tests their grasp of uptake and convention over internal intent.

  Finally, I recommend one closing question whose answer would show you whether the collapse of the distinction has genuinely landed rather than merely been noted. Do not ask them to define a performative. Instead, ask them this: If a system says I state that the bridge is safe, and the bridge collapses, in what sense has the system failed? If they answer that the system lied, they are still thinking in constative terms. If they answer that the system broke a commitment, they are thinking in performative terms. If they answer that the system failed because the conditions for stating were not met, rendering the utterance void rather than false, then they have grasped the collapse. We want them to see that the truth of the statement and the felicity of the act are woven together so tightly that pulling one unravels the other. This question forces them to apply the dissolved distinction to a high-stakes engineering problem, confirming that the theory has moved from their heads to their hands. I hope this plan serves as a sturdy scaffold for your session, and I look forward to hearing how the structure holds under the weight of their questions.
