answer: |-
  Here is your Q&A battle plan. I've tailored these to the specific ideological fault lines in your room: the RL/PP crowd cares about *mechanism and utility*, while the Fodorians care about *metaphysics and causality*.

  ### Up-Front Concessions
  *Do this in your closing remarks or immediately after the talk. It disarms the "evasive" charge before they can level it.*

  1.  **Epistemic Access:** Concede that evolutionary history is often empirically opaque. Admit your theory is better at telling us *what content is* (metaphysics) than *how to find it* (methodology).
  2.  **AI Applicability:** Concede that your theory likely implies current RL agents have *no* genuine representational content (since they lack evolutionary history). Don't try to stretch teleosemantics to cover backprop; own the distinction between "engineered function" and "biological function."

  ---

  ### The 8 Objections (Ordered by Likelihood & Damage)

  #### 1. The "Learning Is Selection" Objection (RL Person)
  **The Objection:** "You say only evolutionary selection counts, not learning. But in RL, policy updates *are* a selection process over a loss landscape. The weights are 'selected' for reward maximization during the agent's lifetime. Why is phylogeny magic but ontogeny irrelevant? If a network learns to detect edges via backprop, why isn't that content-fixing?"
  **The Reply:** "Learning tunes the parameters, but it doesn't fix the *normative standard* for success. The loss function itself—the definition of 'reward'—is only intelligible relative to the system's evolutionary design to survive. Learning is the mechanism; evolution sets the telos."
  **The Soft Spot:** This risks sounding dualistic. If the mathematical structure of selection is identical in backprop and natural selection, your distinction looks arbitrary to a computationalist.

  #### 2. The "Decoder Readout" Objection (Predictive Processing)
  **The Objection:** "This seems scientifically idle. If I can train a linear probe to read out 'predator' from a neural activation pattern with 99% accuracy, that state *functions* as a predator representation for any downstream system. Why do I need to dig up fossils to tell me what the representation is?"
  **The Reply:** "A decoder tells you what the state *covaries* with, not what it *means*. A thermometer covaries with temperature, but its content isn't 'temperature' unless a consumer system uses it to regulate heat. You're identifying correlates; I'm identifying norms."
  **The Soft Spot:** PP researchers argue that for all scientific purposes, the correlate *is* the representation. You risk making content epiphenomenal to actual cognitive science practice.

  #### 3. The "Novelty" Objection (General Cognitive Science)
  **The Objection:** "I can represent a 'smartphone' or a 'quantum computer.' Evolution did not select my consumer systems to handle these stimuli. If content is fixed by selection history, how do I have false beliefs about things that didn't exist when my genes were selected?"
  **The Reply:** "Consumer systems are selected for *plasticity* and *generalization*, not specific stimuli. You represent a smartphone by recruiting circuits selected for 'hand-held artifact' or 'social tool.' The content is derived from the selected function of the consumer, even if the producer signal is novel."
  **The Soft Spot:** This stretches "selected function" until it snaps. If any generalization counts, you slide back into a functionalist view where the specific history matters less than the current capacity.

  #### 4. The "Indeterminacy of Function" Objection (Fodorian)
  **The Objection:** "Selection is coarse-grained. A neuron might have been selected to fire for 'red,' but it was also selected to fire for 'ripe fruit,' 'food,' or 'energy source.' Evolution doesn't carve content at the joints. How does selection pick *one* of these without a prior notion of content to guide the selection story?"
  **The Reply:** "The content is fixed by the *specific* consumption condition that drove the selection. If the organism died when it failed to eat red things specifically, the content is 'red food.' We look at the failure conditions in the history."
  **The Soft Spot:** Fodor will pounce: Failure conditions are just as indeterminate. Did it die because it missed red? Or because it missed calories? This is the classic "Disjunction Problem."

  #### 5. The "Causal Power of History" Objection (Fodorian)
  **The Objection:** "Content is supposed to explain behavior *now*. But your selection history is in the past. A molecule-for-molecule identical state with no history would behave the same. If history makes no causal difference to current dynamics, how can it constitute content?"
  **The Reply:** "Content isn't a causal force; it's a normative status. Asking how history causes behavior is like asking how being a 'husband' causes you to bring flowers. It's a status that makes the behavior evaluable, not a force that produces it."
  **The Soft Spot:** Fodorians want content to be part of the causal law of psychology. If content is merely normative/evaluative, they will argue it's not part of a scientific explanation of cognition.

  #### 6. The "Continuous Dynamics" Objection (Predictive Processing)
  **The Objection:** "PP treats the brain as continuous dynamical systems minimizing free energy. Your view requires discrete states with discrete selection histories. Are you saying every continuous gradient update needs an evolutionary story? This ontology doesn't match the physics of the brain."
  **The Reply:** "Teleosemantics applies to the *functional* states realized by the dynamics, not the physics itself. Just as software has discrete states despite running on continuous voltage, cognitive states have discrete content fixed by function."
  **The Soft Spot:** PP folks reject the software/hardware analogy. If the brain is truly continuous, your "discrete states" might be a fiction you're imposing on the system.

  #### 7. The "Triviality" Objection (Fodorian)
  **The Objection:** "Everything about the organism was selected for survival. If I say a state represents 'predator,' aren't I just saying 'this state helped grandma survive'? That reduces content to 'fitness,' which is trivial. It doesn't distinguish representing a predator from representing 'whatever keeps me alive.'"
  **The Reply:** "Not everything is selected directly. We distinguish proximate functions (what the mechanism does) from ultimate functions (survival). The consumer system was selected to *flee* when in state X. The content is 'predator,' the *value* is survival."
  **The Soft Spot:** Distinguishing proximate from ultimate function without circularity is the hardest technical part of teleosemantics. If they press on *how* we individuate the mechanism, you might struggle.

  #### 8. The "Selectionless Duplicate" Objection (The One You Hope Nobody Asks)
  **The Objection:** "Imagine a Swampman: a molecule-for-molecule duplicate of you pops into existence via cosmic ray accident. It has no evolutionary history. On your view, does it have representational content? If no, it can't think. If yes, history doesn't matter."
  **The Reply:** "I bite the bullet: It has no content. It has no genuine beliefs or desires, only simulacra. It behaves *as if* it thinks, but without a selection history, there is no norm for misrepresentation."
  **The Soft Spot:** This is intuitively repulsive to almost everyone (including many teleosemanticists). It makes your theory metaphysically robust but phenomenally alien. It risks making you look like you're prioritizing theory over intuition.

  ---

  ### Strategic Advice for the Room

  *   **For the RL Crowd:** Don't get bogged down in "proper function" jargon. Translate "selection history" into "optimization target." They understand loss functions. Frame evolutionary history as the *base loss function* that makes the local learning updates meaningful.
  *   **For the Fodorians:** Do not try to convince them teleology is real. They won't buy it. Instead, argue that *without* teleology, they cannot solve the problem of error (misrepresentation). If representation is just covariance (as they often argue against), error is impossible. Teleosemantics is the only game in town for normativity.
  *   **On the Learning Constraint:** This is your most vulnerable point. If they press hard on why learning doesn't count, consider a slight softening: "Learning history fixes *specific* contents within the *space* of contents made possible by evolutionary history." This keeps your core claim but acknowledges the RL reality.

  Good luck. Stand firm on the normativity; that's your wedge against the functionalists.
