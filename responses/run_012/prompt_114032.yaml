      *   *Drafting Objection 4 (Fodor):* "Triviality."
          *   *Refinement:* Everything contributes to fitness. Content becomes 'survival'.
      *   *Drafting Objection 5 (General):* "Novelty."
          *   *Refinement:* Humans think about smartphones. Evolution didn't select for that.
      *   *Drafting Objection 6 (PP):* "Continuous vs Discrete."
          *   *Refinement:* PP sees continuous prediction error. Teleosemantics needs discrete states.
      *   *Drafting Objection 7 (Fodor):* "Causal Power."
          *   *Refinement:* Fodor cares about causal laws. History isn't causal *now*.
      *   *Drafting Objection 8 (The Swampman):* "The Duplicate."
          *   *Refinement:* Molecule-for-molecule copy created 5 mins ago. No history. No content?

  5.  **Ordering by Likelihood and Damage:**
      1.  *Learning vs. Evolution (RL):* High likelihood, high damage. RL people live by learning.
      2.  *Decoder/Operationalist (PP):* High likelihood. Their definition of representation.
