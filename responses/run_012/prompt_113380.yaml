answer: |-
  **The Tyranny of the Long Run: Why Geometric Rationality is Prudence, Not Law**

  The dispute you describe lies at the heart of modern decision theory, pitting the orthodox Expected Utility Theory (EUT) against the insurgent 'ergodicity economics' or geometric rationality. The geometricians argue that in multiplicative environments—where wealth compounds over time—maximising the expected value of wealth (the ensemble average) is physically incoherent because it ignores the path-dependence of ruin. They propose that rational agents must maximise the expected logarithm of wealth, which equates to maximising the time-average growth rate. This is the mathematical engine behind the Kelly criterion.

  My verdict is definite: the strong claim that geometric rationality is a universal requirement of reason is false. While the geometric approach correctly identifies a physical error in how standard EUT is often applied to non-ergodic systems, it illicitly elevates a specific strategy for long-term survival into a dictate of rationality. Geometric rationality is best understood as a specific utility function—$U(w) = \ln w$—which is highly prudent for agents seeking indefinite growth, but it is not rationally obligatory. An agent who rejects it in favour of a different risk profile, a finite horizon, or non-wealth goals is not incoherent; they simply have different ends. To claim otherwise is to confuse the means of survival with the definition of the good.

  **The Physics of the Wager**

  To understand the appeal of the geometric view, one must appreciate the physicist's objection to standard expectation. In a typical coin toss where you win 50% or lose 40% of your current bankroll, the ensemble average (the average wealth of a million parallel universes after one toss) grows. However, the time average (the wealth of one person after a million tosses) collapses to zero. This is a non-ergodic system: the average over possibilities does not equal the average over time.

  Standard EUT, when applied naively to linear wealth, tells you to take this bet because the expected monetary value is positive. Geometric rationality points out that if you repeat this bet, you will almost surely go bankrupt. The 'almost surely' is key. In a multiplicative world, volatility is a tax on compounding. The logarithm captures this because $\mathbb{E}[\ln(w)]$ corresponds to the geometric mean, which dictates the actual trajectory of a single agent through time.

  This is a powerful correction to sloppy modelling. If an economist models a market using ensemble averages in a non-ergodic context, they are making a category error akin to using Newtonian mechanics at relativistic speeds. However, correcting a modelling error is not the same as establishing a moral or rational imperative. The geometric argument succeeds in showing that *if* your goal is to maximise long-run growth without ruin, *then* you should bet Kelly. It fails to prove that you *must* have that goal.

  **The St. Petersburg Paradox and the Nature of Utility**

  The St. Petersburg paradox is often cited as evidence against linear expected value and in favour of the logarithmic view. In this game, a coin is flipped until heads appears. If heads appears on the $n$-th toss, the payoff is $2^n$. The expected monetary value is infinite, yet no rational person would pay a large sum to play.

  Daniel Bernoulli resolved this in 1738 by proposing diminishing marginal utility, specifically suggesting a logarithmic utility of wealth. The geometric rationalists view this as vindication: the paradox shows that linear wealth is irrational. However, this interpretation is too strong. The paradox demonstrates only that utility functions must be bounded or concave to reflect human behaviour, not that they must be *logarithmic*.

  A utility function of $U(w) = \sqrt{w}$ or $U(w) = 1 - e^{-aw}$ also resolves the paradox. These functions imply different betting fractions than Kelly. If the St. Petersburg paradox merely proves that money has diminishing marginal value, it supports the general framework of EUT (maximise expected *utility*, not expected *wealth*), but it does not single out the logarithm as the unique rational function. To claim the logarithm is mandatory is to assert that the specific *rate* of diminishing returns in the log function is a law of logic, rather than a description of risk preference.

  **The Illicit Move from 'Almost Surely' to 'Obligatory'**

  The most philosophically suspect move in the geometric rationality argument is the transition from asymptotic dominance to present obligation. Defenders argue that because the Kelly strategy almost surely outperforms any other strategy as the number of bets $N \to \infty$, it is irrational to choose otherwise now.

  This relies on a fetishisation of the limit. In the real world, $N$ is never infinite. An agent has a finite horizon—a career, a lifespan, or a specific financial goal. In finite settings, a strategy that maximises geometric growth can still result in ruin, or in underperforming a bolder strategy that hits a specific target.

  Consider an agent who needs to double their money to save a life, and they have one chance to bet. A Kelly bettor might advise a fractional wager to protect the bankroll for future rounds. But if there are no future rounds, or if the 'future' is irrelevant compared to the immediate threshold, the Kelly prescription is suboptimal for the agent's actual utility. To tell this agent they are being *irrational* is to impose an external goal (infinite growth) upon them. Rationality is instrumental; it concerns the efficient pursuit of the agent's ends. If the end is not infinite compounding, the Kelly criterion is not the rational tool.

  Furthermore, the 'almost surely' claim hides the risk of ruin in the short run. Full Kelly betting has a 50% chance of halving your bankroll at some point. For many agents, a 50% drawdown is unacceptable, regardless of the long-run recovery. To label the avoidance of such drawdowns as 'incoherent' is to redefine rationality as 'aggressive growth optimisation', which is a substantive value judgement, not a logical truth.

  **Insurance, Negative EV, and the Scope of Rationality**

  Geometric rationality elegantly explains why we buy insurance. Insurance typically has negative expected monetary value (due to the insurer's margin). A linear EV maximiser should never buy it. A log-wealth maximiser will, because the utility loss of a catastrophe outweighs the small premium.

  However, standard EUT explains this equally well with a concave utility function. The geometrician claims an advantage here by deriving the concavity from the dynamics of growth rather than positing it axiomatically. Yet, this derivation only holds if the agent's utility is strictly tied to their own long-term wealth growth.

  What of the altruist? If I care about the total welfare of my community, my utility function might be linear in total social wealth, even if my personal exposure is multiplicative. If I am a venture capitalist investing other people's money, my personal utility might be tied to hitting a 'home run' to secure my reputation, even if the geometric growth of the fund is compromised. In these cases, rejecting the Kelly criterion is not incoherent; it is a reflection of a utility function that includes variables other than personal compounded wealth.

  The geometric rationalist might retort that if you go bust, you can help no one. This is the 'survival' argument. But survival is a constraint, not the whole of rationality. One can satisfy the survival constraint (by avoiding certain ruin) without adhering to the strict Kelly optimisation. This leads us to the practice of fractional Kelly.

  **Fractional Kelly and the Admission of Uncertainty**

  In practice, sophisticated bettors and investors rarely bet 'full Kelly'. They bet half-Kelly or quarter-Kelly. The theoretical justification is usually parameter uncertainty: we do not know the true edge or probabilities, and full Kelly is punishingly volatile if our estimates are wrong.

  If geometric rationality were a law of reason akin to the laws of probability, deviating from it would be akin to logical error. Yet, fractional Kelly is widely regarded as *more* prudent than full Kelly. This suggests that even among proponents, the 'optimal' geometric growth rate is recognised as too aggressive for actual human purposes.

  This admission undermines the strong claim. If the 'rationally required' bet size is too volatile for the very agents supposed to follow it, and if adjusting it downwards is considered wise, then the Kelly criterion is revealed as a benchmark for growth, not a boundary of coherence. It is a tool for calibrating risk, not a definition of reason.

  **The Verdict: Prudence, Not Obligation**

  The controversy stems from a conflation of three distinct layers: the physics of the process, the mathematics of optimisation, and the philosophy of action.

  1.  **Physics:** The geometricians are correct that in non-ergodic, multiplicative systems, ensemble averages are physically misleading for a single trajectory. Time averages matter more.
  2.  **Mathematics:** Maximising the expected logarithm of wealth is the correct method for maximising the asymptotic growth rate of a bankroll.
  3.  **Philosophy:** It does not follow that every rational agent must aim to maximise asymptotic growth rate.

  The strong claim of geometric rationality fails at the third layer. It attempts to derive an 'ought' (you ought to bet this way) from an 'is' (this is how wealth compounds). But the 'ought' depends entirely on the agent's terminal values. If an agent values stability over growth, or has a finite horizon, or cares about goods that cannot be compounded (like health or relationships), the logarithmic rule loses its normative force.

  The St. Petersburg paradox does not save the geometric view from this critique. It merely demonstrates that linear utility of money is untenable. It opens the door for concave utility functions, but it does not lock us into the logarithmic one.

  Therefore, we must conclude that geometric rationality is a powerful heuristic for a specific class of problems: repeated, multiplicative investments where the goal is long-term capital appreciation and ruin is to be avoided. In this domain, it is superior to naive expected value reasoning. But it is not a universal requirement of rationality. To treat it as such is to commit the 'long run fallacy', assuming that the limit behaviour of a system dictates the rational choice in the finite present.

  A retired physicist knows that a model is useful without being fundamental. Newton's laws are not fundamental truth, yet they are rational to use for building bridges. Similarly, the Kelly criterion is not the fundamental truth of decision theory, but it is rational to use for managing a portfolio. The error lies in mistaking the model for the law. Rationality is the alignment of action with values; geometric growth is merely one possible value among many. To demand it as the sole standard is not rigour; it is dogma.
