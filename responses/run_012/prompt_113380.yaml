      *   *Utility is Subjective:* If I need £1m for a life-saving operation, a 99% chance of £10m and 1% chance of £0 might be irrational even if EV is high. Kelly might say bet small. But if I *need* the big bet to reach the threshold, Kelly is "wrong" for *my* goals. This proves utility is goal-relative.
      *   *Insurance & Negative EV:* Kelly explains insurance (protecting the base). But standard EUT with concave utility also explains it. So Kelly isn't unique here.
      *   *Fractional Kelly:* Practitioners rarely bet full Kelly. Why? Because parameter uncertainty. If full Kelly were *rational law*, fractional would be *irrational*. The fact that fractional is often smarter undermines the "law" status.
