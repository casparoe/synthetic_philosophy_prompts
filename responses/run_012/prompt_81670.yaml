  My question: if Wittgenstein got dropped into 2025 and spent like two weeks online, what would he make of how religion happens on the internet now? Things like: livestreamed church services where everyone types amen in the chat, teens doing bible study on discord, prayer request bots, the whole "im deconstructing / leaving my religion" youtube genre, AI chatbots that give pastoral advice or write your prayers for you, and that whole genre of posts where people say they believe in science.

  Please dont just do the greatest hits from the Investigations, ive heard the beetle in a box thing a hundred times. Use the more in the weeds material instead: what he says about Frazers Golden Bough, where he pushes back on the idea that magic is just bad science (i feel like this maps really well onto how people explain online religion from the outside); the theology is grammar idea; the On Certainty stuff about hinges, like the things that have to sit unquestioned before inquiry can even get going; and the relative value vs absolute value distinction from his ethics lecture in the late 20s, which i think is basically why he thought you cant translate religious and ethical talk into factual talk without losing the whole point.

  Then i want at least one thing you think hed call a straight up confusion, and one thing hed actually respect or find interesting, and i want you to be clear about which parts are the texts forcing your hand vs. you guessing.

  Around 800 words, no citations needed (you cant look things up and neither can i, so just argue it out). And dont give me the boring "well it depends on the language game" answer, tell me what he would actually say.
