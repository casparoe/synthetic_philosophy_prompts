          *   *Consequence:* The student concludes Mackie says "neither factor is a cause." While some interpretations of INUS struggle with overdetermination, the reasoning provided is definitely wrong. Also, the student says Mackie agrees with Mill that "hunting for the cause is a mistake... for Mackie there is no cause at all." Mackie doesn't say there's no cause; he says our concept of cause is INUS.
