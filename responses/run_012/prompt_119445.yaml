          *   *Crucial Point:* In overdetermination cases (preemptive or symmetric), standard INUS analysis struggles. If $C_1$ is sufficient and $C_2$ is sufficient, and both occur. Is $C_1$ necessary for the *sufficient condition* $(C_1)$? Yes. Is $(C_1)$ necessary for $E$? No, because $(C_2)$ would have done it.
