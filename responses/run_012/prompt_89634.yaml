answer: |-
  ### Desiderata for a Theory of Neural Representation

  The following criteria constitute the standard for any theory claiming that neural network states are literal representations. A theory that fails a **Non-negotiable** requirement is inadequate. A theory that fails a **Camp Preference** requirement is not necessarily false, but is committed to a specific metaphysical stance (e.g., Naturalism, Interpretivism, Realism).

  #### I. Case Adjudication Requirements

  **1. The Tracking Requirement**
  *   **Criterion:** The theory must attribute representational content to states that reliably covary with a latent environmental variable *and* govern the system's response to that variable.
  *   **Motivation:** A network that learns to track a latent variable (e.g., object position) and acts on it is the paradigmatic case of representation. A theory that denies representation here is too skeptical; a theory that grants it without the behavioral link is too liberal.
  *   **Status:** **Non-negotiable.**

  **2. The Distributed Encoding Requirement**
  *   **Criterion:** The theory must allow content to be attributed to patterns of activity across multiple units, even when no single unit in the pattern carries that content individually.
  *   **Motivation:** Neural networks often encode features linearly across distributed subspaces (e.g., a direction in activation space) rather than in local "grandmother cells." A theory requiring localist encoding fails to describe actual architectures.
  *   **Status:** **Non-negotiable.**

  **3. The Behavioral Potency Requirement (The Inert Information Constraint)**
  *   **Criterion:** The theory must *withhold* representational status from states that carry information (in the Shannon sense or via linear decodability) but whose alteration leaves the system's input-output behavior unchanged.
  *   **Motivation:** A network may contain linearly decodable information about a property (e.g., the parity of the input) that is computationally irrelevant to its task. If mere decodability constituted representation, every physical state would represent infinitely many properties. Representation requires use, not just presence.
  *   **Status:** **Non-negotiable.** (This is the primary filter against pure informational semantics).

  **4. The Symmetry Non-Arbitrariness Requirement**
  *   **Criterion:** The theory must not attribute distinct contents to internal states in systems where the computational structure is perfectly symmetric with respect to those contents, unless the symmetry is broken by external causal history or specific architectural constraints.
  *   **Motivation:** In a network with permutation symmetry (e.g., swapping hidden units leaves the function unchanged), assigning unique content to one unit over another is arbitrary. A theory must explain why one assignment is factually correct rather than merely convenient.
  *   **Status:** **Preference of Realists.** (Interpretivists may accept arbitrariness as a feature of attribution; Realists require a fact of the matter).

  **5. The Interventional Isomorphism Requirement**
  *   **Criterion:** The theory must predict that intervening on a state posited to carry content $C$ will alter system behavior in a manner consistent with the system acting on $C$.
  *   **Motivation:** If a state represents "cat," clamping it to "dog" should induce dog-classification behavior. This links the content attribution to causal leverage, distinguishing representation from epiphenomenal byproducts.
  *   **Status:** **Non-negotiable.**

  #### II. Distinction Preservation Requirements

  **6. The Content-Role Separation Requirement**
  *   **Criterion:** The theory must distinguish the *semantic content* of a state (what it is about) from its *causal role* (what it does to downstream units).
  *   **Motivation:** Two states could play identical causal roles within the network but differ in content (e.g., due to different training histories or environmental connections). Conversely, identical content could be realized by different causal roles. Conflating the two reduces semantics to syntax.
  *   **Status:** **Preference of Functionalists.** (Structuralists may argue content is exhausted by causal role; Externalists require the separation).

  **7. The Vehicle-Content Independence Requirement**
  *   **Criterion:** The theory must distinguish the physical vehicle (the specific activation vector) from the content it carries, allowing for the possibility of multiple realizability.
  *   **Motivation:** The same feature (e.g., "stripes") might be encoded by different activation patterns in different networks or even different regions of the same network. The representation is the feature, not the specific voltage or float value.
  *   **Status:** **Non-negotiable.**

  **8. The Attribution Locus Clarity Requirement**
  *   **Criterion:** The theory must explicitly state whether representational content is a property intrinsic to the system (derived from its mechanism/history) or extrinsic (derived from an interpreter's stance).
  *   **Motivation:** Ambiguity here allows theories to slide between realism and instrumentalism. One must specify if the representation exists when no one is looking (System) or only when modeled (Interpreter).
  *   **Status:** **Preference of Camp.** (Naturalists demand System; Instrumentalists accept Interpreter).

  #### III. Structural Constraint Requirements

  **9. The Superpositional Recovery Requirement**
  *   **Criterion:** The theory must account for how distinct features are represented when the number of features exceeds the number of dimensions, requiring non-orthogonal, superposed encodings.
  *   **Motivation:** High-dimensional features are compressed into lower-dimensional layers. A theory relying on one-to-one mapping or orthogonal basis vectors fails to describe deep learning phenomena.
  *   **Status:** **Non-negotiable.**

  **10. The Polysemantic Tolerance Requirement**
  *   **Criterion:** The theory must allow a single physical unit (or subspace) to participate in the representation of multiple, semantically unrelated features simultaneously.
  *   **Motivation:** Individual neurons often respond to a mix of features (e.g., "dog" and "car" depending on context). A theory requiring semantic purity at the unit level is empirically falsified.
  *   **Status:** **Non-negotiable.**

  **11. The Causal Difference-Making Requirement**
  *   **Criterion:** The theory must ensure that the presence of the representational content makes a difference to the system's output, distinct from the mere physical presence of the activation.
  *   **Motivation:** This prevents representations from being epiphenomenal. If the content doesn't do work, it is a fiction.
  *   **Status:** **Preference of Causal Realists.** (Eliminativists and some Instrumentalists deny this is necessary or possible).

  ***

  ### Analysis of the Standard

  #### The Killer Constraint: The Behavioral Potency Requirement (3)
  This requirement eliminates the largest class of otherwise attractive theories, specifically **Pure Informational Semantics** (e.g., strict Dretskean accounts or mutual-information-based metrics). These theories are attractive because they are mathematically tractable and naturalistic; they define representation via covariance or mutual information. However, they fail the Inert Information Case. A network can have high mutual information between a hidden layer and a property that the network ignores for its task. If a theory counts this as representation, it overgenerates wildly, attributing content to every physical correlation. By demanding that representation be tied to *behavioral efficacy* (decodability is not enough; the decoder must be *used* by the system), this constraint forces a shift from passive information to active function. It kills any theory that cannot distinguish between a database that *holds* data and a processor that *uses* it.

  #### The Incompatible Pair: Causal Difference-Making (11) vs. Vehicle-Content Independence in Superposition (7 & 9)
  There is a profound tension between the demand that representations be **causally efficacious** and the demand that they be **independent of their physical vehicle** in the context of **superposition**.

  1.  **Causal Efficacy** requires that the *content* (e.g., "the presence of a curve") be what drives the behavior.
  2.  **Vehicle-Content Independence** (combined with **Superposition**) entails that the content is not localized to a specific physical unit but is spread across a subspace where dimensions are shared with other, unrelated contents (polysemanticity).

  **The Conflict:** If a representation is superposed, the physical activation causing the downstream effect is a sum of multiple feature vectors. The physical vehicle does not map 1:1 to the content. Therefore, the *causal power* resides in the physical activation (the sum), not in the specific content component (the vector projection). To say the *content* caused the effect is to commit a causal exclusion error: the physical activation already suffices to explain the effect. If you intervene to change the content, you necessarily change the physical vehicle, but you also necessarily perturb other superposed contents.

  Reconciling these requires explaining how a *component* of a physical state (the content) can be cited as the cause when the *whole* state (the vehicle) is the only thing physically interacting with downstream neurons. Satisfying **Causal Difference-Making** without violating the physical closure of the network (while respecting **Superposition**) is the hardest technical and philosophical hurdle. It suggests that either representations are epiphenomenal (violating 11) or they are not truly independent of their specific physical instantiation (violating 7).
