      *   **Topic:** Global History's ambition to tell the past from "everywhere at once" is self-undermining.
      *   **Core Argument:** The problem isn't just content (Eurocentrism) but *form* (narrative requires ranking significance, which implies a center/standpoint). A "view from nowhere" flattens history or smuggles in a center.
      *   **Proposal:** Drop the single synoptic story; write "layered, standpoint-declared histories."
      *   **Audience:**
          *   Majority: World/Global historians (anti-Eurocentrism, pro-narrative).
          *   Minority 1: Two Early Modernists (think "global" is anachronistic for their period).
