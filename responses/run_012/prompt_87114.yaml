  # Handout: Distinguishing Moral Bias from Moral Preference
  **Seminar: The Epistemology of Disagreement**

  ## Introduction
  When a moral judgment diverges from our own, we often dismiss it as a **bias** (a distortion to be corrected) rather than a **preference** (a taste to be tolerated). However, both biases and preferences share key features: they are non-inferential, recalcitrant to argument, socially patterned, and identity-constituting. This decision tree maps the philosophical commitments required to classify a judgment as one or the other.

  **Instructions:** Start at the Root. Follow the path that matches your theoretical commitments. At each leaf, you will find a position name, a test against the four case studies, and the "awkward commitment" inherent to that view.

  ---

  ## The Decision Tree

  ### Node 1: The Metaethical Threshold
  **Question:** *Is the disagreement ultimately resolvable by reason and evidence, or is it a clash of ultimate attitudes?*
  *   **(A) Resolvable:** There are moral facts (or truth-apt standards) that make one side correct. *(Go to Node 2)*
  *   **(B) Unresolvable:** Moral claims express attitudes, not facts; disagreement is like disagreeing about cuisine. *(Go to Node 5)*

  ### Node 2: The Locus of Error (Realist Branch)
  **Question:** *What makes a judgment erroneous: the **process** that produced it, or the **outcome** of ideal reflection?*
  *   **(A) Process:** A judgment is biased if it stems from a cause the agent cannot endorse as a reason (e.g., fatigue, disgust, order effects). *(Go to Node 3)*
  *   **(B) Outcome:** A judgment is biased only if it would not survive full information, calm, and consistency. *(Go to Node 4)*

  ### Node 3: The Etiological Distinction (Process View)
  **Question:** *Is the distorting factor identified by its **causal history** (e.g., upbringing, brain state) or its **evolutionary function** (e.g., mismatched instincts)?*
  *   **(A) Causal History:** Bias is any non-reason cause (e.g., class background, priming). *(Leaf 1)*
  *   **(B) Evolutionary Function:** Bias is a mechanism operating outside its selected domain (e.g., disgust applied to abstract rights). *(Leaf 2)*

  ### Node 4: The Procedural Distinction (Outcome View)
  **Question:** *Does the standard for idealization apply **symmetrically** to the judge's own stable convictions?*
  *   **(A) Symmetric:** If my stable convictions survive idealization, they are not bias, even if you disagree. *(Leaf 3)*
  *   **(B) Asymmetric:** We define idealization by *our* standards; their stable convictions are "false consciousness" or bias. *(Leaf 4)*

  ### Node 5: The Anti-Realist Distinction (Attitude View)
  **Question:** *If there are no moral facts, why do we distinguish 'bias' from 'preference' at all?*
  *   **(A) Political Settlement:** 'Bias' names divergences we have agreed to correct for social cohesion; 'preference' names those we tolerate. *(Leaf 5)*
  *   **(B) Expressive Projection:** 'Bias' is a courtesy term for preferences we dislike but cannot argue against; there is no real distinction. *(Leaf 6)*

  ### Node 6: The Symmetry Check (Cross-Cutting Diagnostic)
  *(Apply this to any Realist Leaf)*
  **Question:** *Do you reserve the label 'bias' primarily for opponents while exempting your own recalcitrant intuitions?*
  *   **(A) Yes:** Your position collapses into **Leaf 4** or **Leaf 5**.
  *   **(B) No:** Your position remains at **Leaf 1**, **Leaf 2**, or **Leaf 3**.

  ---

  ## The Leaves: Positions and Commitments

  ### Leaf 1: Etiological Realism
  *   **Path:** Resolvable → Process → Causal History → Symmetric.
  *   **View:** A judgment is biased if caused by factors the agent wouldn't accept as reasons (e.g., hunger, priming), regardless of stability.
  *   **Test Cases:**
      *   *Hunger:* **Bias** (causal distortion).
      *   *Class Convictions:* **Bias** (traceable to upbringing, not reason).
      *   *Disgust/Equality:* **Bias** (the disgust is a causal contaminant, even if overridden).
      *   *Food:* **Preference** (non-moral domain).
  *   **The Awkward Commitment:** "My own deepest, most stable moral convictions are likely biases if they were caused by my upbringing rather than my reasoning."

  ### Leaf 2: Evolutionary Mismatch Theory
  *   **Path:** Resolvable → Process → Evolutionary Function → Symmetric.
  *   **View:** Bias is a cognitive mechanism functioning outside its evolutionary domain (e.g., tribal instincts applied to global justice).
  *   **Test Cases:**
      *   *Hunger:* **Bias** (physiological state affecting cognitive function).
      *   *Class Convictions:* **Preference** (if class solidarity served an adaptive function, it's not a mismatch).
      *   *Disgust/Equality:* **Bias** (disgust is a pathogen-avoidance mechanism misfiring on social practices).
      *   *Food:* **Preference** (adaptive taste variation).
  *   **The Awkward Commitment:** "Most human moral intuitions are false because they were selected for tribal survival, not moral truth."

  ### Leaf 3: Idealization Proceduralism
  *   **Path:** Resolvable → Outcome → Symmetric.
  *   **View:** Bias is whatever vanishes under ideal reflection (full info, calm, consistency). If it survives, it is a valid moral truth, even if unique to you.
  *   **Test Cases:**
      *   *Hunger:* **Bias** (vanishes when rested).
      *   *Class Convictions:* **Preference** (if stable under reflection, it is a valid moral truth).
      *   *Disgust/Equality:* **Preference** (the reflective judgment of equality wins; the disgust is noise).
      *   *Food:* **Preference** (not subject to moral idealization).
  *   **The Awkward Commitment:** "A stable, reflective commitment to a moral atrocity is a 'true' moral judgment if the agent cannot be reasoned out of it."

  ### Leaf 4: Critical Realism (Asymmetric Proceduralism)
  *   **Path:** Resolvable → Outcome → Asymmetric.
  *   **View:** Bias is what fails *our* idealization standards. Opponents' stable convictions are 'false consciousness' or bias because their reflection is ideologically compromised.
  *   **Test Cases:**
      *   *Hunger:* **Bias**.
      *   *Class Convictions:* **Bias** (their reflection is constrained by class ideology).
      *   *Disgust/Equality:* **Bias** (if they feel disgust, their capacity for reflection is impaired).
      *   *Food:* **Preference**.
  *   **The Awkward Commitment:** "I am the measure of ideal reflection; your stability is delusion, while mine is truth."

  ### Leaf 5: Political Pragmatism
  *   **Path:** Unresolvable → Political Settlement.
  *   **View:** The distinction is not metaphysical but functional. 'Bias' is the label for divergences that threaten social cooperation; 'preference' is for those that don't.
  *   **Test Cases:**
      *   *Hunger:* **Bias** (unreliable agents disrupt coordination).
      *   *Class Convictions:* **Bias** (if they cause conflict) or **Preference** (if tolerated).
      *   *Disgust/Equality:* **Preference** (if kept private) or **Bias** (if it leaks into policy).
      *   *Food:* **Preference**.
  *   **The Awkward Commitment:** "We call your view 'biased' not because it is false, but because we have the power to enforce the label."

  ### Leaf 6: Error-Theoretic Nihilism
  *   **Path:** Unresolvable → Expressive Projection.
  *   **View:** All moral judgments are preferences. 'Bias' is merely a rhetorical weapon used to shame opponents. There is no fact of the matter.
  *   **Test Cases:**
      *   *Hunger:* **Preference** (just a different state of being).
      *   *Class Convictions:* **Preference**.
      *   *Disgust/Equality:* **Preference**.
      *   *Food:* **Preference**.
  *   **The Awkward Commitment:** "There is no difference between a judge swayed by a bribe and a judge swayed by principle, only different causes for different tastes."

  ---

  ## Empty and Problematic Leaves

  **1. The Incoherent Leaf: Anti-Realist Etiological Objectivism**
  *   **Path:** Unresolvable (Node 1B) + Process/Causal (Node 2A).
  *   **Diagnosis:** **Incoherent.** If there are no moral facts (Unresolvable), there can be no "distortion" of facts. You cannot claim a judgment is causally distorted *as a moral judgment* if moral judgments do not track truth. This position collapses into Leaf 5 (Political) or Leaf 1 (Realist).

  **2. The Unstable Leaf: Asymmetric Proceduralism (Leaf 4)**
  *   **Diagnosis:** **Merely Unattractive/Unstable.** While occupied (often by critical theorists or strong partisans), this position is vulnerable to the *Symmetry Check* (Node 6). If the agent cannot explain why *their* idealization is privileged without begging the question, the view collapses into Leaf 5 (Political Pragmatism). It claims to be Realist but functions Politically.

  ---

  ## Instrument Limitations: Where the Tree Fails

  **1. The "Disgust/Equality" Case (Conflicted Agent)**
  *   **Problem:** The tree struggles to separate the *intuition* (disgust) from the *judgment* (equality).
  *   **Failure:** **Leaf 1 (Etiological)** and **Leaf 3 (Procedural)** give opposite verdicts on the *intuition*, but agree on the *judgment*. Leaf 1 calls the disgust a bias; Leaf 3 calls it irrelevant noise. The tree separates the *theories*, but it does not help the agent decide what to do with the feeling. It diagnoses the disagreement but doesn't resolve the psychological conflict.

  **2. The "Class Convictions" Case (Stable but Caused)**
  *   **Problem:** This is the primary wedge between Leaf 1 and Leaf 3.
  *   **Failure:** The tree successfully separates them, but offers no arbiter. If a student asks, "But *is* it bias?", the tree answers, "That depends on whether you value Causal Purity or Procedural Stability." The instrument maps the disagreement but cannot solve it, as the choice between Node 2A and 2B is itself a fundamental philosophical rift.

  **3. The Symmetry Blindspot**
  *   **Problem:** Node 6 is a diagnostic, not a structural branch.
  *   **Failure:** In practice, most agents occupy **Leaf 4** (Asymmetric) while claiming to occupy **Leaf 3** (Symmetric). The tree assumes agents can accurately self-report their symmetry. It cannot detect self-deception, which is the primary engine of the bias/preference confusion in seminar discussions.

  ---

  ## Seminar Exercise (15 Minutes)
  1.  **Select a Case:** Pick one of the four test cases above.
  2.  **Navigate the Tree:** Determine where your *intuitive* classification of the case places you on the tree.
  3.  **Identify the Cost:** Read the "Awkward Commitment" at your leaf.
  4.  **Discuss:** Are you willing to pay that cost? If not, which branch must you prune?
