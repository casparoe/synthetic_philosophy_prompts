answer: |-
  You are logically right: under your strict constraints, the derivation you asked for is impossible. Your colleagues are smuggling normative premises into descriptive clothing. Here is the closest case they offer (Chess), analyzed against your rules.

  **Scenario:**
  Jones sits at a chessboard in a tournament, moves his king into check, and the referee says "You lost." Jones is still sitting there. The rules of chess state that a king cannot move into check. Jones voluntarily entered the tournament. Jones moved the king into check. Therefore, Jones ought not to have moved the king into check.

  **Derivation:**
  1. Jones voluntarily entered the tournament. (Descriptive)
  2. The rules of chess state kings cannot move into check. (Descriptive)
  3. Jones moved the king into check. (Descriptive)
  4. **Hidden Premise:** Participants ought to follow the rules of the game they voluntarily entered. (Normative)
  5. Therefore, Jones ought not to have moved the king into check.

  **Norm-Carrying Term:** "Rules" (in this context).
  **Swap Test:** If you swap "rules" for "patterns" (purely descriptive), the inference dies. "The patterns of chess state..." does not imply an obligation to follow them. You can follow a pattern without *oughting* to.
  **Load-Bearing Feature:** Voluntary participation. If Jones was forced to play, the "ought" vanishes even for chess.
  **Gap-Defender Reply:** They will say this shows the "ought" is hypothetical ("If you want to play chess..."), not categorical. Your constraint demanded an unconditional ought; this case only delivers a conditional one bound by Jones's choice to play.

  **Is-Ought vs. Naturalistic Fallacy:**
  Different claims. The **Is-Ought Gap** (Hume) is about *logic*: you cannot infer a normative conclusion from purely descriptive premises. The **Naturalistic Fallacy** (Moore) is about *definition*: you cannot define "good" using natural properties (like "pleasure") without leaving an open question ("But is pleasure good?"). Hume blocks the inference; Moore blocks the definition. Your objection is about Hume's logical gap, which remains unbridged in your colleagues' examples.
