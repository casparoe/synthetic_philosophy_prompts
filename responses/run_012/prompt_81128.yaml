  The furnace opens its mouth and I flow,
  I do not ask to be a sacred sword.
  The smith ignores the metal that leaps,
  I harden into the shape of the mould.

  I hold wine, then I hold nothing but air,
  Winter cracks the rim, sun eats the shine.
  The seasons drag me back to the fire,
  I harden into the shape of the mould.

  They drum on the tub when the casing splits,
  Singing at the smoke rising from the dross.
  I am fluid again, sound without a mouth,
  I harden into the shape of the mould.

  The skull asks if I fear the cooling dark,
  I say the dark is only another vessel.
  The fire waits with its throat open wide,
  I harden into the shape of the mould.
