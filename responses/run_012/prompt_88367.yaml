              *   **Model 2 (Pure Period):** Trust depends *only* on Wave.
                  *   Data: Every cell in Col 1 = 40. Every cell in Col 5 = 80.
                  *   Problem: If Col 1 is always 40, Row 1 (which has Col 1) will be lower than Row 5. This creates an Age effect artifact.
              *   **Model 3 (Pure Cohort):** Trust depends *only* on Cohort.
                  *   Data: Diagonals are constant. (A1,W1)=40, (A2,W2)=40... (A1,W5)=80...
                  *   Problem: This creates Age and Period artifacts.
              *   **Decision:** I will generate a table where **Row Means increase**, **Col Means increase**, and **Diagonal Means are constant**.
              *   Wait, if Diagonals are constant, there is no Cohort *change*.
              *   Better: Make the data fit a **Linear Trend** that can be attributed to any of the three.
              *   Let's use the classic "Perfect Confound" matrix.
              *   Cell(i,j) = $10 \times i + 10 \times j$. (i=Age, j=Wave).
              *   This implies Trust = Age + Period. Cohort is left out.
