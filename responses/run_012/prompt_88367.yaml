      *   Structure: Clear timeline.
      *   Philosophy/Soc Mix: Ensure the debrief speaks to both (causal mechanisms vs. categorization).

  *(Self-Correction during drafting)*: Wait, if Cell(i,j) = i + j, then Cohort (j-i) is *not* perfectly correlated with the Cell Value for *individuals*.
  *   Individual at (1,1) [Cohort 0] = 2.
