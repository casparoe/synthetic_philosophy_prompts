                  *   **Cohort Story:** This is the tricky one. If Value = Age + Period, then Cohort (Period - Age) is *not* the driver.
                  *   *Correction:* To make the Cohort story fit *equally well*, I need the values along the diagonal to be the *primary* driver, but arranged so it looks like Age/Period.
                  *   *Actually, the standard APC demonstration:* You cannot distinguish them statistically.
                  *   *Pedagogical trick:* Give them a table where **Row Means**, **Column Means**, and **Diagonal Means** all show a strong, identical gradient.
                  *   Let's try:
                      *   Cell(i,j) = $10 \times (i + j)$.
                      *   Row Means: Increase by 10 each row.
                      *   Col Means: Increase by 10 each col.
                      *   Diagonal Means (Cohorts): Cell(1,1)=20, Cell(2,2)=40, Cell(3,3)=60. Cohorts differ!
                      *   So:
                          *   Age Model: Trust = $f(\text{Age})$. (Fits perfectly).
                          *   Period Model: Trust = $f(\text{Period})$. (Fits perfectly).
                          *   Cohort Model: Trust = $f(\text{Cohort})$. (Fits perfectly).
                      *   Why? Because Age, Period, and Cohort are all perfectly correlated with the Cell Value in this specific monotonic setup.
                      *   Wait, are they?
                      *   Age Index: 1, 2, 3, 4, 5.
                      *   Period Index: 1, 2, 3, 4, 5.
                      *   Cohort Index (defined as Period - Age): 0, 0, 0... No.
                      *   Cohort Groups:
                          *   C1: (1,1), (2,2), (3,3)... Values: 20, 40, 60, 80, 100. (Trend!).
                          *   C2: (1,2), (2,3)... Values: 30, 50, 70, 90. (Trend!).
                      *   So, if I argue "Cohorts formed in later years trust more," that fits the data (C1 < C2 < C3).
                      *   If I argue "Older people trust more," that fits (Row 1 < Row 5).
                      *   If I argue "Times are getting better," that fits (Col 1 < Col 5).
                      *   **Yes.** This works. All three variables are perfectly correlated with the outcome in this specific matrix design.

  3.  **Drafting the Session Flow:**
      *   **0-10 mins:** Intro & Hook. No theory yet. Just "Here's data, tell me what's happening."
