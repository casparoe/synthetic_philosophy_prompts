      *   *Goal:* Create a table where Trust = f(Age) = f(Period) = f(Cohort).
      *   *Structure:* 5 Waves (Time), 5 Age Bands (Age). This creates 5 Cohorts diagonally.
      *   *Logic:*
          *   If it's an **Age Effect**: Trust increases as you move down the rows (older).
          *   If it's a **Period Effect**: Trust increases as you move across the columns (later time).
          *   If it's a **Cohort Effect**: Trust is constant along the diagonals (same birth cohort).
      *   *Constraint:* Age = Period - Cohort (roughly). $A = P - C$. This is the linear dependency. If I make the data perfectly additive, any model fits perfectly.
      *   *Drafting the Numbers:*
          *   Let Trust Score range 0-100.
          *   Let's make Trust *increase* with Age (older = more trusting).
          *   Let's make Trust *increase* with Period (later = more trusting).
          *   Let's make Trust *constant* for Cohort (if Age and Period move together, Cohort stays same).
          *   Wait, the prompt says "Headline pattern: younger bands score lower."
          *   Let's set it up so:
              *   Row 1 (Youngest): Low scores.
              *   Row 5 (Oldest): High scores.
              *   Col 1 (Earliest): Low scores.
              *   Col 5 (Latest): High scores.
              *   Diagonals (Cohorts): Constant scores.
      *   *Verification:*
          *   Wave 1: Age 20-25 (Cohort A), Age 26-30 (Cohort B)...
          *   Wave 2: Age 20-25 (Cohort B), Age 26-30 (Cohort C)...
          *   If Age 20-25 always scores 40, and Age 60+ always scores 80 -> **Age Effect**.
          *   If Wave 1 always averages 40, and Wave 5 always averages 80 -> **Period Effect**.
          *   If Cohort A (born 1980) always scores 40 regardless of when measured -> **Cohort Effect**.
      *   *Construction:*
          *   Let's define Cohort Value + Age Value = Score? No, that distinguishes them.
          *   I need the *perfect confound*.
          *   Let Score = $10 \times \text{AgeBandIndex} + 10 \times \text{WaveIndex}$.
          *   Wait, if Score depends on Age and Wave, Cohort is determined.
          *   To make them indistinguishable, the variation must be *collinear*.
          *   Simplest way: Make the table such that moving Right (Period) looks exactly like moving Down (Age).
          *   Table Structure: Rows = Age Bands (1=Young, 5=Old). Cols = Waves (1=Early, 5=Late).
          *   Cell Value = $10 \times (\text{Row} + \text{Col})$.
          *   Let's test:
              *   **Age Story:** Row 1 avg is lower than Row 5 avg. (True: Row 1 sums are lower).
              *   **Period Story:** Col 1 avg is lower than Col 5 avg. (True).
              *   **Cohort Story:** Diagonals (where Row+Col = constant) have constant values.
              *   Wait, if Value = Row + Col, then along a diagonal (Row increases, Col decreases), the sum is constant.
              *   Example: Row 1, Col 5 (Value 60). Row 2, Col 4 (Value 60). Row 3, Col 3 (Value 60).
              *   This means a specific Cohort (defined by Row+Col constant) has a *fixed* score across time.
              *   So:
                  *   Age effect: Older rows have higher numbers? Yes (Row 5 > Row 1).
                  *   Period effect: Later cols have higher numbers? Yes (Col 5 > Col 1).
                  *   Cohort effect: Diagonals are constant? Yes.
              *   *Correction:* Usually, APC data is presented as Cross-Sequential.
              *   Let's refine the numbers to be realistic (0-100 scale).
              *   Let's ensure the "Younger bands score lower" headline holds.
              *   Row 1 (Young): Values 30, 40, 50, 60, 70. Avg = 50.
