              *   Diagonal 1 (Cohort 1: Age 1/Wave 1 to Age 5/Wave 5? No, Cohort is fixed birth year).
              *   Cohort = Wave - Age.
              *   If I am Age 1 in Wave 1, I am Cohort 0. In Wave 2, I am Age 2.
