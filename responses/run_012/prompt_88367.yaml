      *   **Pedagogical Goal:** Inductive discovery. Students encounter the problem *before* getting the vocabulary. The "punch" should be the *identification problem* (Age-Period-Cohort APC), not just "need more data."
      *   **Specific Setup:** Groups of 3-4. Fictional dataset ("Harbury Social Attitudes Panel"). 5 waves, attitude scores by age band.
      *   **Key Constraint:** The data must support three conflicting causal stories (Age, Period, Cohort) equally well. I need to *verify* the numbers work for this.
      *   **Key Turn:** Students try to design a study to separate the stories, but naive fixes fail (APC constraint).
      *   **Specific Addition:** A role/prompt pushing the "reference class" question (birth year vs. shared event).
      *   **Debrief:** Map activity to social kinds literature (realism vs. nominalism, causal power vs. utility).
      *   **Risk Management:** What goes wrong? (e.g., someone knows "APC" already). What can't the activity do? (Normative/Political aspects of generations).

