answer: |-
  **The Omnistatic Foundation for Causal Accountability**
  **Grant Applicant Guidance Document (Rev. 14.2)**

  **1. What is the requisite temporal horizon for impact modeling?**
  Applicants must project consequences no less than 10,000 years into the future. While near-term outcomes (e.g., lives saved this fiscal year) are recorded in Section A, they are considered morally negligible compared to trajectory changes affecting non-actualized persons. You must account for potential downstream effects on civilization stability, technological development rates, and existential risk profiles. Please note that discounting future welfare based on temporal distance is prohibited; a life in the 8th millennium holds equal weight to a life today. If your project alters the timing of a birth by even a few minutes, you are responsible for the moral value of that specific resulting individual's entire lineage.

  **2. How do we account for chaotic divergence in causal chains?**
  The Foundation acknowledges the "butterfly effect" inherent in complex systems. Minor interventions may cascade into catastrophic or utopian outcomes via non-linear pathways. Applicants must submit a Chaos Sensitivity Analysis alongside their budget. This analysis should identify points where causal chains become epistemically opaque. Do not confuse standard risk (known probabilities) with structural cluelessness (unknown probabilities). If you cannot assign a probability distribution to the possibility that your malaria net distribution alters the outcome of a future war, you must mark this as "Unquantifiable Variance" rather than zero. We require evidence that you have attempted to model the unmodelable.

  **3. Is expected utility calculation mandatory if values are incomparable?**
  Yes. Section C requires a net expected utility figure. We recognize that when consequences extend into deep time, the expected value of any action tends toward infinity or undefined status, rendering ordinal ranking impossible. This is known as the Cluelessness Constraint. However, grant allocation requires comparability. Applicants must provide a best-estimate scalar value even if the underlying epistemic conditions do not support it. If you believe the calculation is meaningless, you must still complete the calculation and append a signed addendum stating that the figure is procedurally necessary but ontologically groundless.

  **4. What if the net value remains indeterminate after modeling?**
  If your analysis concludes that the action's goodness is fundamentally unknowable due to causal depth, you are ineligible for funding. The Foundation cannot disburse resources on actions where the moral valence cannot be attested. However, doing nothing also carries infinite unknown consequences. Therefore, applicants must demonstrate that their proposed action is *less* clueless than the counterfactual status quo. Please use Form 88-B (Attestation of Reduced Ignorance) to certify that your intervention narrows the cone of uncertainty, even if the absolute value remains hidden. Failure to distinguish between "doing harm" and "not knowing if you did harm" will result in immediate disqualification.

  **5. Who verifies the accuracy of long-term predictions?**
  No one. The Ethics Compliance Office does not validate future claims, as verification is temporally impossible. Instead, we audit the rigor of your speculation. You are required to act as if the calculation is possible while admitting in writing that it is not. This cognitive dissonance is a standard fiduciary duty. Submit all forms to the Department of Prospective Accountability. Do not contact us regarding paradoxes inherent in Section C.
