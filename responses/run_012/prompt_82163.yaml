prompt: |-
  I've got a small thing that's been bugging me and I think it's actually a real question. I'm on a team where a few of us have been pushing for a hard stop at 6pm, and last week my manager shut the whole thing down with "hard work never killed anyone" — case closed, stop being soft. I didn't have a comeback, so I've been turning it over since. The annoying part is that I'd just read a long piece about karoshi, the Japanese word for people dying from overwork (I think it's even an official category over there for compensation claims?), and a friend of mine keeps dragging in that old Weber thing about the Protestant work ethic, work as a calling, how for a few centuries the culture decided hard work was good for your soul. And separately there's the whole French 35-hour-week idea that shorter hours are a right rather than a favor you get for good behavior. So the same five words seem to be doing duty in all of that and I genuinely can't tell what they're claiming.

  What I want is a menu. Take "hard work never killed anyone" and lay out every precise claim it could be making, roughly from the trivial end to the loaded end: is it a causal claim about labor and mortality? A definitional one — whatever killed him, it wasn't the work, which sounds like it might be true by fiat and therefore say nothing? A prudential claim that work is good for you? A moral claim about what we owe? Or just a rhetorical move meaning "stop complaining"? For each reading, tell me what "work," "killed," and "never" would have to mean for it to be true, and give me a verdict: trivially true, substantive and defensible, or false. Be straight with me about the karoshi problem — if that's real then the literal reading looks dead on arrival and everything else starts to smell like a retreat into "well, that wasn't really work." Also tell me which readings are secretly the same claim in different clothes, since I suspect a couple of them are.

  Then: which reading did my manager most plausibly mean, and does that reading actually do the work he wanted it to — i.e. does any version of it show that wanting to leave at 6 is unreasonable or lazy? He also mentioned that he's done 60-hour weeks for years and he's fine, which I think is supposed to be evidence, so say something about what that does or doesn't support. And finally, which reading are the 35-hour-week people leaning on, and which one are the Weber people leaning on, because I suspect they're not using the same one and are talking past each other. Don't give me a reading list, I just want the menu and the verdicts, in plain language, like you're explaining it to someone who argues about this at lunch.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Question:** The user wants a breakdown of the phrase "hard work never killed anyone."
      *   **Context:** Manager used it to shut down a request for a hard stop at 6 PM. User knows about *karoshi* (death by overwork), Weber (Protestant work ethic), and the French 35-hour week.
      *   **Task:** Create a "menu" of interpretations for the phrase, ranging from trivial to loaded.
      *   **Specific Requirements:**
          *   Define "work," "killed," and "never" for each interpretation.
          *   Verdict for each: Trivially true, Substantive/Defensible, or False.
          *   Address the *karoshi* problem directly.
          *   Identify which readings are secretly the same.
          *   Analyze the manager's likely intent and whether it supports his conclusion (that leaving at 6 is lazy/unreasonable).
          *   Analyze the manager's anecdotal evidence (60-hour weeks).
          *   Identify which readings the 35-hour advocates and Weberians are using.
          *   **Tone:** Plain language, lunchtime argument style, no reading lists, straight talk.

  2.  **Deconstruct the Phrase ("Hard work never killed anyone"):**
      *   *Literal/Biological:* Does physical/mental exertion directly cause death? (Yes, stress, heart attacks, accidents).
      *   *Definitional:* If you died, was it *really* work? (No, it was a heart condition).
      *   *Metaphorical:* "Killed" means "harmed significantly" or "ruined your life."
      *   *Moral/Prudential:* Work is good for the soul; avoiding it is the real killer (boredom, poverty).
      *   *Rhetorical:* Shut up and get back to it.

  3.  **Drafting the Menu (Iterative Process):**

      *   *Reading 1: The Literal Causal Claim.* Work exertion $\rightarrow$ Death.
          *   Definitions: Work = labor; Killed = biological cessation; Never = not once ever.
          *   Verdict: False (thanks to *karoshi*).
      *   *Reading 2: The Definitional Dodge.* If you died, it wasn't "work" that killed you, it was your weak body.
          *   Definitions: Work = virtuous effort; Killed = direct cause; Never = by definition.
          *   Verdict: Trivially True (tautology), but useless.
      *   *Reading 3: The Comparative Risk Claim.* Work is safer than the alternative (poverty, idleness).
          *   Definitions: Work = employment; Killed = overall mortality risk; Never = rarely compared to not working.
          *   Verdict: Substantive but debatable (stress vs. poverty).
      *   *Reading 4: The Moral/Spiritual Claim.* Work saves the soul; idleness damns it.
          *   Definitions: Work = calling; Killed = spiritual death; Never = spiritual benefit always outweighs physical risk.
          *   Verdict: Defensible within a specific worldview (Weber), but not factual.
      *   *Reading 5: The Rhetorical Dismissal.* "Stop complaining."
          *   Definitions: Work = what I say; Killed = irrelevant; Never = shut up.
          *   Verdict: Effective power move, logically null.

      *   *Refining the "Secretly the Same" point:* Reading 2 (Definitional) and Reading 5 (Rhetorical) often collapse into each other. If you define work as "good," then bad outcomes aren't work.

  4.  **Addressing the *Karoshi* Problem:**
      *   Must be direct. Yes, it's real. Japan recognizes it. Stress cardiomyopathy, suicide from overwork, etc. This kills Reading 1.

  5.  **Analyzing the Manager:**
      *   *Intent:* He likely means Reading 5 (Rhetorical) backed by Reading 2 (Definitional). He's asserting authority, not making a medical claim.
      *   *Does it prove laziness?* No. It proves he values output over boundary. It doesn't address efficiency or burnout.
      *   *The 60-Hour Anecdote:* Survivor bias. "I smoked for 40 years and I'm fine" doesn't mean smoking is safe. It's N=1 evidence.

  6.  **Analyzing the Opposing Views (35-Hour vs. Weber):**
      *   *35-Hour (French):* Leaning on Reading 1 (Literal/Biological) and Reading 3 (Comparative Risk/Right to Rest). Work *can* kill, so we limit it.
      *   *Weber (Protestant Ethic):* Leaning on Reading 4 (Moral/Spiritual). Work is a calling; the risk is spiritual decay, not physical death.

  7.  **Review against Constraints:**
