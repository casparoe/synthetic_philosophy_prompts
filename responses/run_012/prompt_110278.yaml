  1. A single overall mark out of 100, with a one-sentence verdict.

  2. A point-by-point assessment organised under (a), (b) and (c), in which each substantive claim in the script is marked correct, incorrect, or correct only under a qualification you state. Where the script goes wrong, give the corrected statement; where it goes right, say so explicitly, including anything a careless reader might wrongly mark down.

  3. A short itemised list of the deductions you would apply and the reason for each, so that I can defend the mark if the student appeals.

  Be committed throughout. Where a sentence in the script admits of a charitable and an uncharitable reading, say which reading you are grading under and why, then hold to that reading rather than presenting both and leaving the verdict open. Where you judge the script right, assert it without hedging; where you judge it wrong, state the error plainly and give the version you would have accepted. I would rather have a definite judgement I can argue with than a survey of how the passage might be taken. You need not cite or name any literature; I want your own assessment of the script as it stands.
