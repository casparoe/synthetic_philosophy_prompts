prompt: |-
  I'm a novelist about two-thirds through a book, and one of my main characters is a mid-level State Department person who was in the room for the Libya decisions in 2011 — not the principals, the person who drafts the options memos and has to sit with the consequences. I need to get her head right, so I want to think through the 2011 Libya intervention using the R2P checklist, and I want the analysis to actually bite instead of turning into a morality play.

  Here's the episode as I understand it, and I'm happy to be told where I've got it wrong. Qaddafi's forces were closing on Benghazi in March 2011, he was making threats about what would happen to the people there, and the Security Council passed Resolution 1973 — ten votes in favor, none against, five abstentions (Brazil, China, Germany, India, Russia) — authorizing member states to take all necessary measures to protect civilians, excluding a foreign occupation force. NATO ran the air campaign, and within months the mandate was being read as license to remove Qaddafi, and the aftermath was what it was. Kosovo 1999 is the other case my character keeps flashing back to, since that's the one where the intervention happened without a Security Council mandate.

  What I want from you: take the precautionary criteria that got attached to the responsibility to protect — just cause, right intention, last resort, proportional means, reasonable prospects — and run Libya through them one at a time, with the understanding that these came out of a 2001 commission report and then got narrowed and partly displaced by the 2005 World Summit language that limits the whole thing to four mass atrocity crimes (genocide, war crimes, ethnic cleansing, crimes against humanity). I want to know what each criterion would have to mean to give a determinate answer in March 2011, and where it just doesn't. Last resort against whom, and by when? Proportional means measured against what baseline — deaths prevented, or the counterfactual political order? Right intention whose intention, when the coalition had several and they weren't identical? And reasonable prospects judged ex ante from what was actually knowable, not ex post from how it turned out.

  Then flip it: what does Libya do to the criteria? Did the case expose a flaw in the checklist, or did it expose that the checklist was never meant to be a decision procedure and everyone misused it? The Brazilian proposal from late 2011 — responsibility while protecting — is interesting to me because it tried to add sequencing and accountability rather than new criteria, and I want to know whether that actually fixes anything or just relocates the discretion to a different set of people.

  Finally, be honest about the limits. What can a theory built for one kind of case (Kosovo, Rwanda, Srebrenica) not tell us about a case where the intervention succeeds militarily and then the state comes apart anyway? And where does the theory have nothing to say that a novelist would want to know — the texture of the decision, the way a person in the room experiences the gap between the criteria on the page and the cable she actually has to write? I want alot of that gap.

  No need for citations, I'll handle those myself. I mostly want the mapping to be disciplined and the places where it breaks to be named out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist, 2/3 through a book.
      *   **Character:** Mid-level State Department official (drafts options memos, lives with consequences).
      *   **Topic:** 2011 Libya intervention through the lens of R2P (Responsibility to Protect) precautionary criteria.
      *   **Specific Constraints:**
          *   Avoid morality play; make the analysis "bite."
          *   Use the 2001 ICISS criteria (Just Cause, Right Intention, Last Resort, Proportional Means, Reasonable Prospects) but acknowledge the 2005 World Summit narrowing (four crimes).
          *   Determine what each criterion would have to mean to give a *determinate* answer in March 2011.
          *   Identify where the criteria fail or are indeterminate.
          *   Address "Right Intention" (whose intention?).
          *   Address "Reasonable Prospects" (ex ante knowledge, not ex post hindsight).
          *   Analyze the impact of Libya *on* the criteria (flaw in checklist vs. misuse).
          *   Discuss Brazil's "Responsibility While Protecting" (RwP) proposal (sequencing/accountability vs. discretion).
          *   **Crucial:** Be honest about limits. What can't theory tell us? What is the *texture* of the decision? The gap between criteria and the actual cable/memo.
      *   **Tone:** Disciplined, analytical, honest, nuanced, avoiding citations (user will handle those).

  2.  **Deconstruct the R2P Criteria in the Context of Libya (March 2011):**

      *   *Just Cause:* 2005 Summit limits this to genocide, war crimes, ethnic cleansing, crimes against humanity.
          *   *Challenge:* Was Qaddafi's threat ("Zanga Zanga," "house by house") imminent enough to count as crimes against humanity *before* they happened? Or was it suppression of a rebellion (civil war)?
          *   *Determinacy:* High on paper, low in practice. The threshold is "imminent."
      *   *Right Intention:* Primary purpose must be to halt human suffering.
          *   *Challenge:* The coalition (US, UK, France, Qatar, UAE) had mixed motives. France (Sarkozy) wanted political capital. UK/France wanted to prevent refugee flows. Rebels wanted regime change.
          *   *Determinacy:* Low. Whose intention counts? The UNSC voters or the executors?
      *   *Last Resort:* Non-military options exhausted.
          *   *Challenge:* Sanctions were fresh. Diplomacy was ongoing (AU proposals). But Benghazi was *days* away from falling.
          *   *Determinacy:* Time-bound. "Last resort before *what*?" Before the massacre, not before the war ends.
      *   *Proportional Means:* Scale/duration/intensity minimum necessary.
          *   *Challenge:* Protecting civilians vs. Toppling the regime. Air strikes on command centers vs. front lines.
          *   *Determinacy:* Ambiguous baseline. Proportional to the threat (massacre) or the political goal (stalemate)?
      *   *Reasonable Prospects:* Action must not make things worse.
          *   *Challenge:* Ex ante, could they know the state would collapse? They knew Qaddafi was brittle. Did they know the rebels were fragmented?
          *   *Determinacy:* High uncertainty. The "day after" is always the blind spot.

  3.  **Analyze the Impact of Libya on the Criteria (The "Flip"):**
      *   Did Libya break R2P? Or did it reveal R2P isn't a decision tree?
      *   *Argument:* R2P was never an algorithm. It's a framework for argumentation. Libya showed that "Protect Civilians" and "Regime Change" are operationally indistinguishable in civil war.
      *   *Brazil's RwP:* Tried to add monitoring and sequencing.
      *   *Critique:* It adds bureaucracy, not clarity. Who monitors the monitor? It relocates discretion to the Security Council (where veto power lies).

  4.  **Address the "Novelist's Gap" (Texture and Experience):**
      *   Theory deals in categories; bureaucrats deal in verbs and timelines.
      *   The memo isn't about "Just Cause"; it's about "Option 2b: No Fly Zone + Asset Freeze."
      *   The anxiety isn't moral; it's predictive. "If we write X, the General says Y happens."
      *   The gap: The criteria assume a clean line between humanitarianism and politics. The cable room knows that line is a fiction.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the character's position. She's not deciding *if*; she's framing *how*.
      *   **The Checklist (March 2011 Ex Ante):** Go through the 5 criteria. Focus on the *ambiguity* that allows for decision-making.
          *   *Just Cause:* The threshold of "imminence."
          *   *Right Intention:* The coalition of the willing vs. the Security Council.
          *   *Last Resort:* The clock vs. the diplomatic process.
          *   *Proportional Means:* The mission creep inherent in the mandate.
          *   *Reasonable Prospects:* The "Day After" blind spot.
      *   **The Flip (Libya's Impact on Theory):**
          *   R2P as a shield vs. a sword.
          *   The indistinguishability of protection and regime change.
          *   Brazil's RwP: Accountability vs. Veto politics.
      *   **The Limits (The Novelist's Gold):**
          *   Theory vs. Bureaucracy.
          *   The language of the memo (passive voice, conditional tense).
          *   The burden of prediction.
          *   The silence on state-building.

  6.  **Refining the Tone:**
      *   Avoid academic dryness. Use sharp, active language.
      *   Keep the focus on the *character's* cognitive load.
      *   Ensure the distinction between 2001 (ICISS) and 2005 (Summit) is clear but integrated.
      *   *Self-Correction during drafting:* Make sure I don't just say "it was complicated." I need to say *where* the complication breaks the logic. For example, on "Last Resort," specify that the time horizon compresses the criterion until it vanishes.

  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Disciplined mapping? Check.
      *   Named breakdowns? Check.
      *   Texture of the decision? Check.
      *   Brazil/RwP included? Check.

  8.  **Final Polish:** (Mental check of the "Mid-level State Dept" voice). She knows the rules are flexible. She knows the memo is a legal shield as much as a policy guide. Emphasize the *writing* of the options.

  *(Self-Correction)*: I need to make sure I don't get bogged down in the history of the intervention itself, but keep the focus on how the *criteria* interact with the *decision point*. The user knows the history; they want the analytical friction.

  *(Key Insight for the "Gap"):* The criteria assume a static world where you measure, then act. The character lives in a dynamic world where acting changes the measurement. The memo freezes a moving target.

  Let's write.
answer: |-
  This is the right way to approach it. If your character is drafting the options memos, she isn't asking "Is this moral?" She is asking, "If I write this sentence, what legal and political cover does it give the Secretary, and what trap does it set for the generals?"

  The R2P precautionary criteria (Just Cause, Right Intention, Last Resort, Proportional Means, Reasonable Prospects) were designed by the ICISS in 2001 as a moral compass. By 2005, the World Summit turned them into a political threshold limited to four crimes. By March 2011, they were being used as a legal shield for regime change.

  Here is the breakdown of how those criteria functioned in the room at that moment, where they broke, and what that feels like for the person holding the pen.

  ### 1. The Checklist Ex Ante (March 2011)

  To give a determinate answer, your character has to interpret ambiguity as certainty. That is her job.

  **Just Cause (Threshold)**
  *   **The Theory:** Serious and irreparable harm occurring or imminent. 2005 limits this to genocide, war crimes, ethnic cleansing, crimes against humanity.
  *   **The Libya Friction:** Qaddafi had not yet massacred Benghazi. He had threatened to. Does "imminent" mean hours? Days? Is a threat of a crime against humanity the same as the crime itself?
  *   **The Determinate Answer:** To authorize force, she has to write the memo as if the massacre is *already happening* or is *inevitable without intervention*. She must collapse the timeline. If she writes "Qaddafi *might* kill civilians," the legal counsel kills the option. If she writes "Qaddafi *will* kill civilians," she locks the US into a guarantee of outcome.
  *   **The Gap:** She knows intelligence is probabilistic. The memo must be categorical. The gap is between "high confidence" and "certainty."

  **Right Intention**
  *   **The Theory:** The primary purpose must be to halt human suffering. Regime change cannot be the primary goal.
  *   **The Libya Friction:** Whose intention? The Security Council (which voted for civilian protection)? The US/UK/France (who said Qaddafi must go)? The Rebels (who would not negotiate)?
  *   **The Determinate Answer:** She has to draft the mandate to exclude "occupation" and "regime change" explicitly, while knowing that protecting civilians in a civil war *requires* degrading the regime's command and control.
  *   **The Gap:** She is writing language she knows will be stretched. "All necessary measures to protect civilians" is functionally identical to "Air support for rebel advance" once the front line moves. She knows this. Her memo must pretend it isn't so.

  **Last Resort**
  *   **The Theory:** Every non-military option must be exhausted.
  *   **The Libya Friction:** Sanctions had been in place for days. The African Union was proposing a ceasefire roadmap. But Benghazi was days from falling.
  *   **The Determinate Answer:** "Last resort" becomes time-bound. It doesn't mean "all diplomacy failed"; it means "diplomacy cannot work fast enough to save Benghazi."
  *   **The Gap:** This turns a qualitative criterion into a logistical one. It's not about whether peace was possible; it's about whether it was possible *by Tuesday*. Your character knows that if the rebels hadn't been advancing so fast, the "Last Resort" box wouldn't have been checked. The urgency manufactures the necessity.

  **Proportional Means**
  *   **The Theory:** The scale, duration, and intensity of intervention should be the minimum necessary to secure the humanitarian objective.
  *   **The Libya Friction:** What is the baseline? Proportional to the threat (a massacre in one city) or the conflict (a nationwide civil war)? If you bomb Qaddafi's tanks outside Benghazi, he moves them to Tripoli. Do you bomb them there too?
  *   **The Determinate Answer:** The memo defines the "objective" narrowly (save Benghazi) but authorizes "means" broadly (enforce no-fly, strike command nodes).
  *   **The Gap:** Proportionality assumes a static defense. Libya was dynamic. To protect civilians effectively, you have to help one side win. Your character has to write "protect civilians" knowing the military planners interpret that as "degrade regime capacity."

  **Reasonable Prospects**
  *   **The Theory:** Action must not make things worse. There must be a plan for the aftermath.
  *   **The Libya Friction:** This is the biggest blind spot. Ex ante, Qaddafi looked brittle. The rebels looked like the only alternative. The risk of state collapse was known but discounted as "better than a massacre."
  *   **The Determinate Answer:** The memo focuses on the *military* prospect (can we stop the tanks?) not the *political* prospect (can we govern the country?).
  *   **The Gap:** The criteria ask for a reasonable prospect of *success*. Success at what? Stopping the killing? Yes. Building a state? No one knows. The memo isolates the military objective from the political outcome to make the "Yes" possible.

  ### 2. The Flip: What Libya Did to the Criteria

  Libya didn't expose a flaw in the checklist; it exposed that the checklist is not a decision procedure. It is a vocabulary for justification.

  **The Indistinguishability Problem**
  In Kosovo, you intervened against a state to protect a minority. In Libya, you intervened in a civil war to protect a rebellion. In a civil war, "protecting civilians" and "helping rebels win" are operationally the same thing. The criteria assume you can separate the humanitarian from the political. Libya proved you cannot. If your character is honest, she knows the checklist is a filter, not a map. It filters out the obviously illegal, but it doesn't guide the choice between two bad options.

  **Responsibility While Protecting (RwP)**
  Brazil's late-2011 proposal tried to fix this by adding sequencing and monitoring.
  *   **The Idea:** Strict sequencing (force only after diplomacy), enhanced monitoring (report back to the UNSC constantly), and accountability for consequences.
  *   **Does it fix it?** No. It relocates discretion.
  *   **The Friction:** Who monitors the monitor? If the US/NATO says "We had to strike that compound to protect civilians," and Brazil says "That was regime change," who decides? The Security Council. Which means the P5 veto returns.
  *   **For your character:** RwP would have made her job impossible. It requires a level of granular oversight that doesn't exist in a fast-moving air campaign. It turns the memo writer into a compliance officer for a war zone. It sounds responsible, but it effectively grants a veto to the abstainers (Russia, China, etc.) over tactical decisions.

  ### 3. The Limits: What Theory Can't Tell Your Character

  This is where the novel lives. The theory assumes a rational actor making a choice. Your character is a bureaucrat managing risk.

  **The Burden of Prediction**
  R2P asks: "Will this make things worse?"
  Your character asks: "What happens if I'm wrong?"
  Theory deals in probabilities. Memos deal in liabilities. If she writes "Reasonable prospects of stability," and the country collapses, that sentence is Exhibit A in a congressional hearing ten years later. She isn't analyzing the criteria; she is hedging against future blame. She uses the passive voice not to obscure, but to survive. *"It is assessed that..."* rather than *"I believe that..."*

  **The Silence on Exit**
  The criteria focus on *entry* (Just Cause, Last Resort). They are silent on *exit*.
  In 2011, the assumption was that once Qaddafi fell, the "international community" would handle the transition. Your character knows there is no "international community" capable of nation-building. She knows the UN special envoy is under-resourced. But the criteria don't require her to solve the peace. They only require her to justify the war. This creates a cognitive dissonance: she is authorizing a beginning she knows she cannot control the end of.

  **The Texture of the Cable**
  *   **The Criteria:** Abstract, moral, timeless.
  *   **The Cable:** Specific, legal, time-sensitive.
  *   **The Gap:** The criteria say "Right Intention." The cable says "UNSCR 1973 Paragraph 4."
  *   **The Experience:** She isn't wrestling with Kant. She is wrestling with the General Counsel. The General Counsel says, "You can't say 'regime change'." The Policy Director says, "But Qaddafi has to go." She has to find the phrase that satisfies both. She finds it in "protective mandate."
  *   **The Feeling:** It's not a moral triumph; it's a linguistic negotiation. She feels the weight of the words not because they are holy, but because they are binding. Once "all necessary measures" is typed and sent, men with bombs act on it. She knows that "protect civilians" will be interpreted by a pilot at 20,000 feet as "shoot anything that looks like a tank." She cannot control that interpretation, but she is responsible for the ambiguity that allowed it.

  **The "Day After" Void**
  R2P theory stops at the cessation of atrocities. It has no vocabulary for the vacuum.
  For your character, the horror isn't the intervention; it's the morning after Qaddafi dies. The theory told her she was saving Benghazi. It didn't tell her she was unleashing militias.
  The specific pain for her is realizing that the *success* of the criteria (stopping the massacre) enabled the *failure* of the state. She followed the checklist. She got the "Just Cause." She got the "Last Resort." And the country is gone.
  The theory implies that if you follow the rules, the outcome is legitimate. Libya taught the State Department that you can follow the rules and still break the world.

  **Summary for the Character's Head**
  She shouldn't view the R2P checklist as a moral guide she is failing or passing. She should view it as a set of containers she is trying to fill with enough liquid to hold, knowing the containers are cracked.
  *   She knows "Last Resort" is a fiction because time is short.
  *   She knows "Right Intention" is fractured because the coalition is mixed.
  *   She knows "Reasonable Prospects" is a guess about a future she can't see.

  Her anxiety comes from knowing that the criteria provide *legitimacy*, not *wisdom*. She is providing the legitimacy. She is not sure anyone has the wisdom. And she has to type the memo anyway.
