answer: |-
  Right. Take a breath. You're not trying to win the argument with your sister anymore; you're trying to help twelve people see why the argument exists in the first place. If you go in trying to prove her wrong, you'll lose the room. If you go in trying to prove her right, you'll lose yourself.

  Here is the plan for the ninety minutes.

  ### 1. The Order of Play
  You guessed right: **Disagreement before Fact.**

  If you start by asking "What is a fact?", you'll be bogged down in science and physics within ten minutes. They'll say facts are things you can measure, and then morality looks like rubbish immediately. You need them to feel the *weight* of the claim first.

  1.  **The Experience of Arguing:** Start with the feeling that the other person is *mistaken*, not just different.
  2.  **The Taste Model:** Introduce your sister's view (olives) as a way to explain away that feeling.
  3.  **The Breakdown:** Show where the Taste Model fails to explain our reactions.
  4.  **The Fact Claim:** Only then ask what kind of 'fact' could exist if it isn't a scientific one.

  **Why this order?** Because 'fact' is abstract. 'Being sure someone is wrong' is visceral. You need to hook them with the visceral bit before you ask them to analyse it.

  ### 2. The Case Study
  **The Carrier: Nan's Funeral.**
  **The Hook: The Christmas Argument.**

  Use the Christmas story for the first ten minutes only. It's your hook. It's honest, it's you, and it establishes the puzzle: "We were both shouting. Why shout about taste?" But then you must step away from it. It's too personal. If you keep using it, the class becomes about *you and your sister*, not the philosophy. They'll start taking sides based on whether they like you, not the logic.

  **Nan's Funeral carries the session.**
  Here's why: It removes the interpersonal conflict. No one in that room is the Uncle. No one is the grieving grandchild. It creates enough distance for them to think clearly.
  *   **It tests the 'Harm' principle:** When you asked "Who did it hurt?", nobody could answer. That is the perfect wedge. If morality is just about harm, and no one was harmed (clothes were gone, Nan was dead), then it wasn't wrong. But everyone *felt* it was wrong.
  *   **It tests the 'Taste' model:** Did the family say "We dislike the clothes being binnded" or "He shouldn't have done that"? There's a difference between "I don't like that" and "That isn't allowed".

  **What a case needs to work here:**
  *   **Consensus:** Almost everyone must agree on the initial intuition (e.g., "Yes, that was wrong"). If the room is split 50/50 on the case itself, you can't analyse *why* they think it.
  *   **No Legal Obviousness:** It can't be murder. Everyone knows murder is illegal. Throwing out clothes is morally dubious but legally fine. That gap is where the philosophy lives.
  *   **Low Stakes for Them:** They need to be observers, not participants.

  ### 3. The Run of Show (90 Minutes)

  **0–15 mins: The Hook (Christmas)**
  Tell them briefly about the shouting match. Don't give the verdict. Ask the room: "When you argue about something being unfair or wrong, does it feel like you're arguing about ice cream flavours, or does it feel like you're arguing about whether the kettle is boiling?"
  *   *Board work:* Write "Taste" on the left, "Fact" on the right. Get them to shout out where different arguments fit.

  **15–35 mins: The Sister's View (The Olive Test)**
  Explain the sister's position without calling it a theory. "Imagine morality is just like olives. If I say olives are vile, I'm telling you about me. If you say they're lovely, you're telling me about you. We aren't contradicting each other."
  Apply this to the Funeral. "If my Uncle says 'It was fine' and I say 'It was wrong', are we just stating our feelings? Like me liking olives and him hating them?"
  *   *Activity:* Ask them to turn to a neighbour and discuss: "If it's just taste, why did the family feel justified in telling him off?"

  **35–55 mins: The Breakdown (Where Taste Fails)**
  This is the crucial pivot. Bring them back.
  Ask: "If I say I hate olives, do I expect you to change your mind?" (No).
  "If I say what my Uncle did was wrong, do I expect him to change his mind?" (Yes).
  "We argue to *persuade*. You don't persuade someone to like olives. You persuade them they've made a mistake."
  Bring in the "Who was hurt?" question here. "If no one was hurt, why was it wrong? If it's a fact, what fact is it?"
  *   *Board work:* Draw a circle around 'Harm'. Ask if 'Wrongness' fits inside it or outside it.

  **55–75 mins: The Fact Claim (What would a moral fact look like?)**
  Now you can tackle the 'Fact' side. If it's not science (you can't measure wrongness with a ruler), what is it?
  Don't solve this. Just let them wrestle with it. "Is it a fact about human flourishing? Is it a fact about duty?"
  Acknowledge the difficulty. "This is why the shouting match happens. I think there's a fact there. She thinks I'm projecting feelings onto the universe."

  **75–90 mins: Synthesis and The Question**
  Summarise the stalemate. We act like there are facts, but we can't find them like scientific facts.
  Leave them with the final question (see below).

  ### 4. Misconceptions

  **Pre-existing (Theirs):**
  1.  **"Everyone's entitled to their opinion."**
      *   *Where it hits:* Around minute 20, when discussing the Olive Test.
      *   *How to head it off:* Don't let it pass. Say: "You're entitled to it, yes. But are you entitled to be *right*? If I say 2+2=5, I'm entitled to say it, but I'm mistaken. Which kind of opinion is morality?"
  2.  **"Morality is just Religion."**
      *   *Where it hits:* Minute 60, when discussing where facts come from.
      *   *How to head it off:* "Let's park God for today. Even atheists think murder is wrong. So where does that come from if not scripture?"
  3.  **"If it's not science, it's nonsense."**
      *   *Where it hits:* Minute 65.
      *   *How to head it off:* "Love isn't scientific. Beauty isn't scientific. Are they nonsense? Or just different kinds of truth?"

  **Self-Inflicted (Yours):**
  1.  **Thinking you need to solve it.**
      *   *Where it hits:* Minute 80. You'll feel the urge to tell them who's right (you or your sister).
      *   *How to head it off:* Remind yourself: Your job is to map the terrain, not build the house. Say explicitly: "I am not going to tell you the answer. I don't know it. Neither do the experts."
  2.  **Getting therapeutic.**
      *   *Where it hits:* Minute 10 (The Christmas story).
      *   *How to head it off:* Keep your story to 5 minutes max. Do not vent. Do not mention the ex. Keep it clinical: "We disagreed on X." If you get emotional, the class becomes about managing your feelings, not the philosophy.
  3.  **Letting the 'Ex-Vet' or 'Crossword Woman' dominate.**
      *   *Where it hits:* Throughout.
      *   *How to head it off:* Use the whiteboard. "That's a brilliant point, write it up there." Physically turn away from the dominant speaker to address the room.

  ### 5. The Final Question
  Do not ask: "Who thinks my sister is right?" (That's a vote, not understanding).
  Do not ask: "What did we learn?" (Too vague).

  **Ask this:**
  "Next time you see someone kicking a dog, and you feel angry... do you think you're discovering something about the world, or are you just projecting your own disgust?"

  **Why this works:** It forces them to apply the distinction to a visceral moment. If they say "Discovering", they've grasped the Realist position. If they say "Projecting", they've grasped the Expressivist one. If they say "I don't know", they've grasped the problem. Any of those is a win.

  ### 6. What to Skip (and Admit It)
  1.  **The History:** Do not mention Hume, Moore, or Ayer. You said you would, and you should. It adds nothing for 90 minutes.
      *   *Say:* "There are centuries of books on this. We're just looking at the thing itself, not the library."
  2.  **The Solution:** Admit you aren't solving it.
      *   *Say:* "I'm not going to convince you who's right today. If I could, I'd have won the argument on Christmas Eve." (Get the laugh, it breaks the tension).
  3.  **Definitions of 'Truth':** Don't get stuck on correspondence theory vs. coherence theory.
      *   *Say:* "Let's use 'fact' to mean 'something that's true regardless of what we think about it'. We won't dig deeper than that."

  ### A Note on the Manchester Mum
  Since your mum's in the front row, she'll smell a rat if you're posturing. Keep it proper. Don't try to be a university lecturer; be the person running the Tuesday club. If you get stuck, say "I'm not sure" and write it on the board. She'll respect the honesty more than the bluff.

  And for God's sake, don't bring up the ex. You said it yourself: it isn't helping. Keep the Christmas story about the *argument*, not the relationship.

  Good luck. Keep the chalk moving. If the room goes quiet, ask a question. If it gets too loud, draw a diagram. You'll be fine.
