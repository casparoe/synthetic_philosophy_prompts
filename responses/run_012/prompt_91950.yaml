answer: |-
  Dear Friend,

  It is a pleasure to engage with this proposal, for the reception-first account you describe possesses an elegant economy that explains why we can stand before a urinal or a snow shovel and agree that we are in the presence of art without needing to locate a specific moment of coronation or a hidden aesthetic property. By anchoring art status in the normative structure of our attention rather than in the object's intrinsic features or an institutional decree, you capture the phenomenological reality that art is something we do with objects, not merely something objects are. However, as you suspect, this elegance comes at the cost of exposure, and to map that exposure requires us to distinguish between tensions that can be absorbed by the theory's natural elasticity and those that threaten to snap its foundational commitments. I will arrange these challenges by their severity, moving from those that are merely awkward but survivable, to those that demand serious revision, and finally to those that, if they hold, would require abandoning the view entirely.

  We might begin with the cases that are merely awkward, which a committed defender can absorb with a qualification without altering the core machinery. Consider the conceptual work deliberately built to resist the very attention your view requires. There are pieces, such as certain strands of avant-garde silence or invisibility, that seem to command us not to look, or to recognize the futility of looking. If the norm of the practice is sustained attention for its own sake, these works appear to be paradoxes. Yet, a defender can argue that the practice of art is reflective enough to include attention to the failure of attention. In this case, the sustained attention is directed at the concept of resistance itself, or at the institutional conditions that allow the resistance to be registered as art. This is a manageable tension because it relies on the sophistication of the practitioners; it does not break the link between reception and status, it merely complicates what counts as attention. Similarly, the case of the object made and immediately destroyed, which your view seems to call art only by counterfactual courtesy, is awkward but not fatal. If no one ever attends to it, strictly speaking, your account says it is not art. A defender might concede this, biting the bullet that unperceived art is an oxymoron, or they might invoke a modal claim that the object belongs to a kind that *would* sustain attention were it encountered. While this risks making the theory less empirical, it does not yet collapse it, provided the counterfactual is grounded in the object's actual history of production rather than pure fantasy.

  Moving to challenges that would force a serious revision, we encounter the problem of over-inclusivity, illustrated by the community whose practice of reverent attention is directed at something we would not call art at all. If a religious group treats a relic, or a tribe treats a natural rock formation, with the exact normative stance you describe—sustained attention for its own sake—your account implies these are works of art. This is the boundary problem, and it is severe because it suggests your definition captures the genus of "sacred or valued object" rather than the species of "art." A defender cannot simply stipulate that the practice must be an "artistic" practice, for that renders the theory circular, defining art by the practice that treats things as art. To avoid this, you would need to revise the account to specify the *content* or *context* of the attention, perhaps by requiring that the attention be framed by a history of artistic production or a specific cultural lineage. But once you add that requirement, you are no longer purely reception-first; you are hybridizing your view with a historical or institutional account. This is a significant concession, as it admits that reception alone is insufficient to distinguish art from other forms of high valuation. A related pressure point arises with the forgery or the perfect duplicate. If I attend to a fake Van Gogh with the same sustained appreciation as the original, your view suggests the fake is art in that moment. Yet, most of us feel that once the forgery is revealed, something has gone wrong with its status, even if our perceptual experience remains identical. A reception theorist must argue that the practice of appreciation includes the norm of authenticity, so that discovering the history changes the reception itself. This is a plausible move, but it forces the theory to admit that the object's history, not just the current reception, constrains the practice. If the practice is governed by norms of truthfulness about origin, then the reception is not doing all the work; the history is. This requires a revision that integrates production-side constraints into a reception-side framework.

  Now we must confront the defeaters that are potentially decisive, the ones that should make you abandon the view if they cannot be resolved. The most threatening of these is the problem of the first art, or the art that precedes the practice. If an object is art only when there exists a practice of appreciative attention under which it counts as a candidate, then the very first work of art could not have been art, because the practice required to receive it did not yet exist. Practices are social and cumulative; they do not spring into being fully formed with the first object. To say the first cave painting was not art until a tradition formed around it is historically counterintuitive and ontologically unstable. A defender might try to argue that the act of making the first art simultaneously inaugurated the practice, but this stretches the notion of a "practice," which implies repetition and normativity over time. If you cannot account for the genesis of the practice without presupposing the art, the theory is circular in a temporal sense. This is a point where historical definitions of art, such as Jerrold Levinson's, do better, as they allow an object to be art by being intended for regard in ways prior artworks were regarded, even if no current practice exists. Your view struggles here because it makes art status dependent on a standing social reality that, by definition, lags behind the innovation.

  Even more damaging is the risk of unfalsifiability, which touches on your question about whether the account is quietly insulated. If the "appropriate practice" turns out to be just whatever practice confers art status, the theory becomes true by stipulation. You ask whether this is a real defect or the fate of any constitutive account of a practice-dependent kind. It is a real defect if the theory cannot specify the practice independently of the extension of the term "art." If you must point to existing artworks to identify the practice, and then point to the practice to identify artworks, you have not explained anything. A committed reception theorist must be able to describe the norms of appreciative attention without referencing the word "art," perhaps by appealing to broader human capacities for disinterested contemplation or emotional resonance. If they cannot do this, the theory is vacuous. This is a point of genuine contestation; some pragmatists argue that all such definitions are circular because art is an open concept, but if your goal is a constitutive account, this circularity is fatal. It renders the view unable to adjudicate borderline cases, which is the primary job of a theory of art.

  Finally, we must weigh your specific temptation regarding the fragility and revisability of art status. You are drawn to the idea that an object can cease to be art if the practice dies out. While this is consistent with your view, it commits you to saying that the Parthenon friezes would cease to be art if humanity lost the capacity to attend to them, or if a future culture viewed them solely as geological data. This is the ontological cost of your position. Most rival accounts, including institutional and historical ones, treat art status as more stable, arguing that once an object enters the artworld or is created with the right intention, it retains that status even if reception wanes. Your view makes art status contingent on continuous cultural maintenance. This is not logically impossible, but it clashes with the intuition that art has a durability that transcends the fluctuations of taste. If you accept this fragility, you must accept that art is not a property of the object or its history, but a transient state of relation between object and observer. This may be the truth, but it is a hard pill to swallow, for it implies that we do not discover art in the past so much as we create it anew by looking. If you are willing to pay that price, the view holds together better, but it isolates you from the common understanding that art is a discovery of value rather than a projection of attention.

  In verdict, the reception-first account is a powerful lens for understanding how art functions in the present moment, particularly for readymades and conceptual pieces where production-side theories stumble. However, it is not insulated from risk. The circularity worry is the most dangerous, as it threatens to turn the theory into a tautology unless you can independently characterize the practice of attention. The problem of the first art and the unattended object suggests the view is historically myopic, unable to account for the origins or the latent potential of artworks. The issues of forgery and over-inclusivity require you to import historical or contextual constraints that dilute the purity of the reception-first claim. If you are willing to revise the view into a hybrid account—where reception is necessary but constrained by history and production—it can survive the serious challenges. But if you hold to the strict claim that reception alone constitutes art status, the problems of the first art and unfalsifiability are likely decisive. The fragility claim is consistent but costly, separating you from the intuition of art's endurance. Ultimately, the view is not wrong so much as incomplete; it describes the life of art but not its birth or its death, and it risks defining the life of art in terms that are indistinguishable from the life of any other valued thing. A careful theorist would concede that reception is the medium in which art exists, but hesitate to call it the sole source of art's being.
