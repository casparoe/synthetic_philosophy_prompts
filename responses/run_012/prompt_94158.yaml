answer: |-
  # Q&A Prep Sheet: Diachronic Incommensurability & Value Constitution

  **Context:** Job Talk Defense
  **Core Claim:** Value rankings in hard cases are constituted diachronically by commitment, not discovered synchronically.
  **Audience:** Formal Epistemologists, Decision Theorists (incl. Revealed Preference), Kantian, Historian.

  ---

  ### 1. The "Truth-Maker" Objection (Highest Damage)
  **Who:** Formal Epistemologist / Metaphysician
  **Phrasing:** "You claim the agent can be *wrong* ex post about the value they constituted. But if the ranking didn't exist ante cedens, what are the truth-makers for these ex post evaluations? If there's no prior fact of the matter, aren't you just describing retrospective satisfaction or regret? How do you distinguish 'I made the wrong value true' from 'I wish I'd made the other one true' without smuggling in a realist standard you claim doesn't exist?"

  **2-Minute Reply:**
  "I grant the worry, but the distinction lies in the *integrity of the commitment*, not a prior metric. When I choose to stay for my parent, I'm not just satisfying a preference; I'm undertaking a project that generates new reasons—reasons of fidelity, care, and continuity.
  To be 'wrong' ex post isn't to fail a prior measurement; it's to fail to sustain the normative structure the choice initiated. If I take the job and immediately resent the parent, I haven't 'discovered' the job was better; I've failed to constitute the value of care that was only accessible through the commitment. The truth-maker is the *sustainability of the agency* involved in the choice. It's not arational because it's constrained by the requirements of practical identity over time, not just psychic states."

  **Concession:** Admit that this requires a robust theory of "practical identity" to avoid collapsing into subjectivism.
  **Soft Spot:** If they press on *what* constrains sustainability. If "sustainability" is just "can I live with it," you're back to psychology, not normativity.

  ### 2. The "Completeness Axiom" Objection (High Damage)
  **Who:** Decision Theorist / Preference Representation Specialist
  **Phrasing:** "Standard choice theory assumes a complete ordering to model rationality. You're suggesting the ordering is incomplete until the choice occurs. But if the choice *completes* the ordering, doesn't that make the choice function itself non-deterministic? How do you model this without violating the Weak Axiom of Revealed Preference? If I choose A, you say A becomes better. If I chose B, B would have become better. Doesn't this make the utility function path-dependent in a way that breaks representation?"

  **2-Minute Reply:**
  "It does break the standard *synchronic* representation, which is exactly my point. I'm arguing that the domain of the utility function is diachronic, not synchronic. You can't model this as a single choice node $t_1$. You need a sequence: Commitment at $t_1$ transforms the payoff structure at $t_2$.
  I'm not denying transitivity *within* a committed path. I'm denying that there is a single preference relation *across* divergent paths prior to entry. The 'violation' you see is a category error: you're applying a static map to a terrain that is built by walking. I'm proposing a dynamic model where the act of selection is a parameter in the utility function, not just an output of it."

  **Concession:** Concede that this requires a non-standard formal model (which you are currently working on).
  **Soft Spot:** If they ask for the formalism *now*. If you can't sketch the math, they'll dismiss it as hand-waving.

  ### 3. The "Revealed Preference" Objection (Medium-High Damage)
  **Who:** Hardline Revealed-Preference Theorist
  **Phrasing:** "This sounds like a confusion of normative language with behavioral description. If you choose to stay, you reveal a preference for staying. To say the value is 'created' is just poetic dressing for 'I chose it.' Why posit a metaphysical creation of value when 'revealed preference' explains the behavior without the ontological baggage?"

  **2-Minute Reply:**
  "Because revealed preference cannot account for *regret* or *error* in hard cases. If preference is defined solely by choice, I can never choose 'wrong.' But in the parent/job case, agents genuinely experience having made a mistake, not just a change in taste.
  Revealed preference flattens the normative landscape. My claim is that the choice has *normative authority* over future reasons. By staying, I make it true that I *ought* to prioritize the parent in future trade-offs. That 'ought' isn't revealed by the choice; it's instituted by it. You're describing the shadow; I'm describing the object casting it."

  **Concession:** Admit revealed preference works fine for 'easy' cases (ice cream flavors).
  **Soft Spot:** The hardliner doesn't care about "oughts." They will say your "normative authority" is unobservable and therefore meaningless to their project.

  ### 4. The "Existentialist Repackaging" Objection (Medium Damage)
  **Who:** Historian of Ethics
  **Phrasing:** "This sounds remarkably like Sartre's 'existence precedes essence' or Ruth Chang's work on 'normative powers.' Chang argues we can create reasons through commitment. What is the specific contribution here? Are you just applying Chang's parity view diachronically, or is there a metaphysical difference?"

  **2-Minute Reply:**
  "It's a metaphysical shift, not just a temporal one. Chang focuses on *parity* as a fourth value relation. I'm arguing that in these diachronic cases, *no value relation exists* prior to the choice. It's not that they are 'equal' or 'on a par'; it's that the ranking is indeterminate.
  Unlike Sartre, I'm not claiming radical freedom creates value ex nihilo. The *materials* (care, career) are real. The *weighting* is what's constituted. I'm offering a middle ground between Realism (the weight is there) and Existentialism (I put the weight there). The weight emerges from the interaction of the agent and the commitment over time."

  **Concession:** Acknowledge heavy debt to Chang regarding "normative powers."
  **Soft Spot:** If they press on the difference between "indeterminate ranking" and "parity." If you can't distinguish them sharply, it looks like terminological tweaking.

  ### 5. The "Kantian Constraint" Objection (Medium-Low Damage)
  **Who:** The Kantian
  **Phrasing:** "If the choice creates the value, where does the obligation come from? If I choose the job, does the obligation to the parent vanish? It seems you're making duty contingent on choice, which undermines the categorical nature of moral reasons. Caring for a parent isn't a project you opt into; it's a demand."

  **2-Minute Reply:**
  "I agree the *demand* exists antecedently—that's the incommensurability. Both options have normative pull. My claim is about the *resolution* of the conflict, not the existence of the duties.
  The choice doesn't erase the duty to the parent; it determines how that duty is instantiated in a life where I cannot be in two places. By choosing the job, I don't negate the value of care; I determine that, in this specific life, the value of professional contribution will be the lens through which I fulfill my general duties. The 'creation' is of the *hierarchy*, not the *obligations* themselves."

  **Concession:** Concede that some duties (perfect duties) might not be subject to this construction.
  **Soft Spot:** If they argue that the hierarchy *itself* is dictated by reason, not choice.

  ---

  ### The "Hope Nobody Asks" Question (Critical Vulnerability)
  **Who:** Anyone sharp enough to see the Euthyphro dilemma.
  **Phrasing:** "If the choice makes the value true, what constrains the choice? If nothing constrains it, it's arbitrary (and you said it's not arational). If something *does* constrain it—say, the 'better' option is the one that leads to a better life—doesn't that mean the 'better life' fact existed beforehand? You seem to be saying the choice creates the standard, but the standard judges the choice. Which is it?"

  **Why it's dangerous:** It attacks the coherence of the "constitutive" claim. If there's a standard to judge the choice, realism wins. If there's no standard, arbitrariness wins.
  **Prepared Defense (if asked):**
  "It's not a circle; it's a spiral. There are *pro tanto* reasons beforehand (parent needs help, job offers growth). These constrain the *eligibility* of options. But they don't determine the *ranking*. The choice selects which *pro tanto* reason becomes *decisive*. The ex post evaluation checks if the decisive reason was sustainable. The standard isn't prior; it's the *success conditions of the commitment itself*."
  *(Note: This is your weakest point. If they press on "success conditions," admit this is the frontier of the research project.)*

  ---

  ### General Strategy Notes
  *   **Tone:** Do not be defensive about the lack of formalism. Frame it as "The formalism follows the metaphysics, not vice versa."
  *   **The Revealed Preference Guy:** Do not try to convert him. Isolate his objection as "behavioral" vs. your "normative."
  *   **The Case:** Keep returning to the Parent/Job example. It grounds the abstraction. "In the room, right now, is there a fact about whether I should go to London or stay? I say no. But if I go, and fail to call, I am objectively failing the value I created."
  *   **Concession Strategy:** Concede on *scope*. This isn't about all choices (not about coffee vs. tea). It's about "identity-constituting" choices. This limits the damage to decision theory axioms.
