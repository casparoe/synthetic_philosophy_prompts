  | R4 | Conceptual Mediation | Emotion identification/category depends on concepts and language. | Retrospective naming; Cross-linguistic variation | Camp-specific | Judgementalism | Pure-Feeling |
  | R5 | Normative Assessability | Emotions are subject to rational criticism (fitting/unfitting, right/wrong). | Criticized feelings; Ascriptions can be wrong | Non-negotiable | Judgementalism / Perceptual | Pure-Feeling |
  | R6 | Contradictory Attitudes | Theory must allow simultaneous contradictory emotions toward one object. | Ambivalence (love/resent) | Non-negotiable | Neutral | Judgementalism |
  | R7 | Emotional Variety | Theory must cover non-survival, non-basic states (e.g., curiosity). | Curiosity, boredom, insight | Nice-to-have | Neutral | Basic Emotion |
  | R8 | Cognitive Dependence | Emotion type tracks appraisal/interpretation of situation, not just stimulus. | Same situation, different emotions | Camp-specific | Judgementalism | Pure-Feeling |
  | R9 | Behavioral Prediction | Emotion ascriptions must enable prediction and explanation of action. | Explanatory work requirement | Non-negotiable | Neutral | Neutral |
  | R10 | Ontological Status | Must explain why "emotion" is a useful category if not a biological natural kind. | Natural kind consideration | Camp-specific | Constructionist / Essentialist | Neutral |
  | R11 | Non-Linguistic Capacity | Theory must accommodate emotions in creatures without language/concepts. | Dog/rat cases | Non-negotiable* | Evolutionists | Judgementalism |

  *R11 is non-negotiable only if scope widens beyond adult humans.

  **Judgementalism:** Secures normativity and intentionality but struggles to explain recalcitrance without positing irrationality or split beliefs.
  **Perceptualism:** Accommodates recalcitrance as illusion and preserves normativity via fittingness, but lacks a clear perceptual organ.
  **Pure-Feeling:** Captures phenomenology and physiology but fails to explain intentionality, normativity, and cognitive differentiation.

