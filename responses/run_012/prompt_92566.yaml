answer: |-
  This is a classic case of a slogan doing too much work. "Extraordinary claims require extraordinary evidence" (ECREE) is philosophically porous; it sounds deep because it can mean almost anything. In your group, Person A and Person B weren't disagreeing about the slogan; they were using two different slogans that happen to share the same words.

  Here is a menu of five distinct interpretations of ECREE, ordered from the mathematically trivial to the substantively radical. You can print this out and ask A and B to point to the row they were actually standing on.

  ### The Menu of Interpretations

  #### 1. The Bayesian Tautology (The "Math" Reading)
  *   **What it asserts:** If a hypothesis ($H$) has a very low *prior probability* (it contradicts known laws), you need evidence ($E$) with a very high *likelihood ratio* ($P(E|H)$ is high, $P(E|\neg H)$ is low) to raise your *posterior probability* to a believable level.
  *   **Bayesian Status:** This is a **Theorem**. It falls directly out of Bayes' Theorem. It is not a separate rule; it is how probability works.
  *   **Truth Status:** **True** (by definition).
  *   **What "Extraordinary" attaches to:** The **Claim** (Low Prior) and the **Gap** (High Likelihood Ratio).
  *   **Belief vs. Burden:** About **Credence** (degrees of belief).
  *   **Verdict:** **Person A wins.**
      *   *Why:* Person A says the prior (levitation) is near zero. The evidence (testimony) has a high probability of existing even if the miracle didn't happen (people lie, hallucinate, etc.). Therefore, the likelihood ratio is too low to overcome the prior.
      *   *Person B:* Cannot use this. On this reading, the "extraordinary evidence" must be evidence that is *very unlikely to exist if the miracle didn't happen*. Mere testimony usually fails this test.

  #### 2. The Dialectical Rule (The "Don't Waste My Time" Reading)
  *   **What it asserts:** In a debate, the burden of proof shifts based on plausibility. If you make a normal claim, I assume it's true until proven otherwise. If you make a wild claim, you must do the work of proving it before I engage.
  *   **Bayesian Status:** **Separate Substantive Rule.** This is about social norms of argument, not math.
  *   **Truth Status:** **Plausible/Pragmatic.** It's a useful heuristic for conversation, even if not a law of logic.
  *   **What "Extraordinary" attaches to:** The **Claim** (implausibility triggers higher standards).
  *   **Belief vs. Burden:** About **Burden of Proof** (who speaks next).
  *   **Verdict:** **Person A wins.**
      *   *Why:* Person A is saying, "You haven't met the burden." Person B is trying to say, "I have met the burden," but on this reading, the *type* of burden is determined by A's assessment of the claim's weirdness.

  #### 3. The Qualitative Shift (The "Different Kind of Proof" Reading)
  *   **What it asserts:** As a claim moves further from normal experience, the *kind* of evidence required changes, not just the amount. Normal claims accept testimony; extraordinary claims require physical traces, instrumentation, or disinterested verification.
  *   **Bayesian Status:** **Separate Substantive Rule.** It asserts that testimony has a "ceiling" of probability it cannot pass, regardless of quantity.
  *   **Truth Status:** **Debatable.** Many philosophers argue testimony *can* support miracles if strong enough; others say testimony is inherently the "wrong kind" for physical violations.
  *   **What "Extraordinary" attaches to:** The **Evidence** (It must be physical/objective, not just human report).
  *   **Belief vs. Burden:** About **Acceptance** (what counts as valid proof).
  *   **Verdict:** **Person A wins.**
      *   *Why:* Person A dismisses the retreat story because it's *only* testimony. Person B's argument relies on testimony being sufficient, which this reading denies by definition.

  #### 4. Hume's Balancing Scale (The "Historical" Reading)
  *   **What it asserts:** A miracle is established only if the falsehood of the testimony would be *more miraculous* (more improbable) than the miracle itself. We weigh two probabilities: $P(\text{Miracle})$ vs. $P(\text{Testimony is False})$.
  *   **Bayesian Status:** **Substantive Rule (Historical).** This is Hume's specific formulation in *Enquiry Concerning Human Understanding*, Section X. It is roughly Bayesian but framed as a contest of improbabilities.
  *   **Truth Status:** **Plausible but Contested.** It depends on whether you think human deception is *always* more likely than a law of nature breaking.
  *   **What "Extraordinary" attaches to:** The **Gap** (The evidence must be more improbable to be false than the event is to occur).
  *   **Belief vs. Burden:** About **Rational Belief**.
  *   **Verdict:** **Toss-up (Leans A, but B has an opening).**
      *   *Why:* Person A assumes $P(\text{Testimony is False})$ is high (people lie). Person B argues that because witnesses staked lives/reputations, $P(\text{Testimony is False})$ drops dramatically. If B can make the falsehood *more* improbable than levitation, B wins on Hume's own terms.
      *   *Note:* This is the only reading where Person B is not obviously talking nonsense, provided they can prove the witnesses couldn't be mistaken or lying.

  #### 5. The Sociological Inversion (Person B's "Martyrdom" Reading)
  *   **What it asserts:** The "Extraordinary Evidence" is not the content of the testimony, but the *social fact* of the testimony. The fact that people are willing to die/suffer for a claim is itself an extraordinary event that requires explanation, and the best explanation is the truth of the claim.
  *   **Bayesian Status:** **Separate Substantive Rule.** It treats the *existence of believers* as the data point ($E$), not the *content of their speech*.
  *   **Truth Status:** **Risky / Often False.** This risks the **Argument from Credulity** (inferring truth from belief intensity). It ignores alternative explanations (mass hysteria, fraud, shared delusion).
  *   **What "Extraordinary" attaches to:** The **Evidence** (The social phenomenon of belief is the evidence).
  *   **Belief vs. Burden:** About **Inference to Best Explanation**.
  *   **Verdict:** **Person B wins (conditionally).**
      *   *Why:* This is the only reading that validates Person B's move. However, it is vulnerable. It asserts that "willingness to suffer" correlates with "truth." History suggests it correlates with "conviction," which is not the same thing.

  ---

  ### Two Specific Threads to Unpack in the Session

  #### 1. Is Person B committing a fallacy?
  Person B's move smells wrong to you because it flirts with the **Argument from Popularity** (*Ad Populum*) or **Argument from Incredulity**. However, strictly speaking, it is an **Inference to the Best Explanation (Abduction)**.
  *   **The Structure:** "Here is a phenomenon (people staking lives). Hypothesis 1: They are lying/deluded. Hypothesis 2: They saw a miracle. Hypothesis 2 explains the intensity of their commitment better than Hypothesis 1."
  *   **The Flaw:** It assumes that *false* beliefs cannot inspire extreme commitment. History is full of false beliefs people died for.
  *   **The Fix for B:** Person B needs to argue not just that they believed, but that they were in a *position to know* and had *nothing to gain* (disinterested witnesses). If B just argues from "they really believed it," it is a fallacy. If B argues from "they were skeptical experts who risked everything to report this," it is a valid (though still weak) probabilistic argument.

  #### 2. What did Hume actually mean? (Historical Flag)
  *   **Confidence Level:** High.
  *   **The Gist:** You are correct; Hume meant something closer to **Menu Item 4**. He was not calling for a "special kind" of magic evidence (Menu Item 3). He was calling for a **quantity of probability**.
  *   **The Quote:** "No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact which it endeavours to establish."
  *   **Implication:** Hume is arguing that human testimony is *always* less reliable than the uniform experience of laws of nature. Therefore, it is *always* more probable the witness is wrong than the law broke.
  *   **For the Group:** If Hume is right, Person A wins automatically. Person B's move only works if they can show that *this specific testimony* is more reliable than the law of gravity. Person B is trying to argue that "martyrdom" makes the testimony more reliable than gravity. That is the actual fight they should be having.

  ### Suggestion for the Handout
  When you circulate this, ask the group to vote on **Menu Item 1 vs. Menu Item 4**.
  *   If they choose **1**, the discussion becomes technical (Bayes, Priors, Likelihoods).
  *   If they choose **4**, the discussion becomes empirical (Is human deception more common than levitation?).
  *   If they choose **5**, they need to justify why "dying for a lie" is impossible.

  Person A is likely operating on **1 or 3**. Person B is operating on **5** but pretending it's **4**. Exposing that mismatch should stop the session from falling apart again.
