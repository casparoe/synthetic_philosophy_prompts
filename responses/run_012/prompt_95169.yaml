prompt: |-
  Hey so for civics I have to invent my own case instead of using the usual ones and I need help. Build me a thought experiment where two people get bossed around in exactly the same way at the same time — same demand, same person telling them, same thing happens if they say no — but one of them is unfree and the other one isn't, on the republican "nobody gets to boss you around at their own whim" reading of freedom. Rules for the case: it has to be an ordinary school / family / part time job thing, no slaves, no kind-hearted king, no prison, no evil boss who personally runs everything, and the power has to sit somewhere impersonal — a rule, a rota, an algorithm, a habit the place just has — so there's nobody in the story you can point at as the one holding it. Also the unfreedom can't come from anyone being scared or miserable about it, it has to count as unfreedom even if both of them are completely fine with the situation.

  Then tell me what each of the three readings says — the "nobody's physically stopping you" one, the "you're only free if you're running your own life" one, and the republican one — which single feature of the story is doing all the work, what happens if I take that feature out, and whether the fix is to stop the interference or to change who's allowed to interfere. Last bit: how would someone who only cares about the first reading try to say my case is cheating.

  One paragraph for the story, and keep everything after it under 200 words.
