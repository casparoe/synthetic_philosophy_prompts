      *(Drafting thought)*: Make sure not to use the word "AI". Use "mechanical intellect" or "fabricated mind". Don't use "s-risk". Use "catastrophe of suffering" or "risk of ruin."

      *(Drafting thought)*: Ensure the distinction between Bentham and Mill is clear in the Asymmetry section.

