      *   *Requirement 4: Intrapersonal vs. Interpersonal Aggregation.* The case: One person suffering 100 units of pain over time vs. 100 people suffering 1 unit each. This is the "confusing" one for the user. Needs to address whether time-slices aggregate like separate lives.
      *   *Requirement 5: Non-Collapse.* The theory shouldn't just be utilitarianism in disguise. It needs to preserve the distinctiveness of non-aggregative views (like contractualism) while accounting for the above.
