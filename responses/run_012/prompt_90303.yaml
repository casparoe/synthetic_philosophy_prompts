      Finally, the single requirement that does the most damage to otherwise attractive theories is the intrapersonal versus interpersonal distinction. It rules out simple hedonic utilitarianism, obviously, but it also rules out many sophisticated contractualist views that try to borrow aggregative tools from economics. If a theory treats individuals as containers for value, it struggles to explain why summing within a container is fine but summing across containers is not, unless it posits a very strong view of personal identity that many modern metaphysics reject. This requirement forces the theory to take a stand on the metaphysics of the self, which is a heavy burden for a moral theory to carry, and it eliminates any view that treats persons as mere locations of value rather than unified agents.

