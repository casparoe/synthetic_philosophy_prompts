      *Drafting text:*
      You are asking for the boundary conditions of a moral theory that navigates between strict non-aggregation and simple summing, and to provide that without resorting to a list format requires walking through the logical terrain as a continuous narrative. The first requirement any such theory must satisfy is grounded in the intuitive pull of the one-person-drowning-versus-five case, where almost everyone feels that saving the five is not just permissible but obligatory. This forces the theory to acknowledge that numbers sometimes count, meaning it cannot adopt a strict rule that says we must always save the identifiable individual regardless of how many others are at stake. If a theory cannot explain why the second drowning person adds moral weight to the situation, it fails to match our basic reflective equilibria about rescue cases, so the spec must include a mechanism for additive weight in cases of comparable harm.

      However, immediately following that is the second requirement, which comes from the case where a single person faces death while five others face merely minor inconveniences like headaches or ruined shoes. Here the intuition flips, and we feel the single person's claim is strong enough to beat the combined claims of the many. This forces the theory to incorporate a threshold or a weighting system where the severity of the harm matters more than the sheer quantity of sufferers. A theory that treats all harms as commensurable units on a single scale will fail here, because it would mandate sacrificing the one for the five even if the one loses their life and the five only lose a afternoon of comfort. So the spec requires a way to rank harms qualitatively such that sufficiently grave harms block the aggregation of lesser ones.

      This leads into the third requirement regarding harms that differ in kind, which complicates the idea of a single scale. Consider a case where you must choose between saving a life or preventing a large number of people from losing a leg. We care about numbers, but we also care about the kind of loss, and it is not obvious how many legs equal a life. The theory must provide a principle for comparing incommensurable values without simply reducing them to a common currency like utility, because doing so would violate the second requirement about trumping claims. The spec needs to account for why we hesitate to aggregate across certain qualitative boundaries, suggesting that the theory must have a lexically ordered hierarchy or a discontinuous value function rather than a smooth curve.

      The fourth requirement is the one you identified as most confusing, which concerns intrapersonal aggregation versus interpersonal aggregation. We generally accept that it is rational for one person to suffer a great deal now to avoid a greater suffering later, aggregating pain across time-slices of a single life, but we are much more hesitant to aggregate pain across different people. A theory needs to explain why the boundary of a person matters morally. If pain is bad, why does it matter whether ten units of pain are in one head or ten heads? The spec must demand an explanation for the moral significance of personal identity over time versus the separateness of persons. If the theory allows aggregation across time but not across people, it needs a metaphysical or moral justification for why the unity of a life permits summing while the plurality of lives restricts it, otherwise it looks like an arbitrary distinction.

      The fifth requirement is structural stability, specifically that the theory must not quietly collapse into do-the-most-good utilitarianism when nobody is looking. Many hybrid theories start with rights or claims but end up aggregating them in a way that reproduces utilitarian results in all but name. The spec requires that the non-aggregative core remain visible and operative, meaning there must be cases where the theory explicitly forbids maximizing the good in favor of honoring a specific claim. This is a methodological constraint ensuring the theory is actually distinct from the view it is trying to modify, preventing it from becoming a mere restatement of consequentialism with extra steps.

      Now looking at which of these are real constraints versus prejudices, the demand that numbers count sometimes and the demand that severe claims trump are both real moral intuitions that survive reflection, whereas the requirement that the theory not collapse into utilitarianism is more of a methodological preference for pluralism over monism. You might argue that if utilitarianism gets the right answer, we should not fear collapsing into it, but since you are looking for a contractualist-style spec, preserving the distinctiveness of the claim-based view is essential to the project. The prejudice to watch out for is the idea that intrapersonal aggregation is obviously permissible while interpersonal aggregation is obviously restricted, because some philosophers argue that the separateness of persons is morally irrelevant, making that intuition a potential bias rather than a hard constraint.

