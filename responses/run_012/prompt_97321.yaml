prompt: |-
  I sit on the risk panel of a small gaming operator; we vet new promotional games before launch, we meet monthly, individual decisions are worth up to a few hundred thousand pounds, and the panel includes a lawyer and a marketing director who will not follow a derivation, so whatever we adopt has to be something a junior analyst can execute and I can defend to the regulator. Our written policy has always been simply that we approve a game if our expected position is positive, and that has worked until now. Two proposals have broken it. In the first, a fair coin is tossed until the first head; if that occurs on toss n, our payout is a gain or loss of 2^n/n with alternating sign, so the probability-weighted terms we add are 1, −1/2, +1/3, −1/4 and so on. The second is the same game with the sign always positive and payout 2^n/n. In the first case the total depends on the order in which you add the terms, and by reordering them you can make it come out to any value you like; in the second the sum grows without bound.

  Please turn expected-value reasoning into a procedure the panel can actually run on any proposal: the questions to ask, in order; what counts as a sufficient answer at each step; where the procedure stops with a no; and where it has to hand the decision to a person because the issue is one of values rather than maths. I do not want a fudge that quietly changes the subject — if the honest verdict is that expected-value reasoning gives no answer here, the procedure should say so and then say what is to take its place. Then run it on both proposals, and on a third case of your choosing that it handles cleanly. Include at least one case where the procedure returns an answer the panel will not like, and state plainly what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**
      *   **Role:** Member of a risk panel for a small gaming operator.
      *   **Context:** Vetting new promotional games before launch. Monthly meetings. Individual decisions worth up to a few hundred thousand GBP.
      *   **Panel Composition:** Risk (me), Lawyer, Marketing Director.
      *   **Constraints:**
          *   Lawyer/Marketing won't follow complex derivations.
          *   Must be executable by a junior analyst.
          *   Must be defensible to a regulator.
          *   Current policy: "Approve if Expected Value (EV) is positive."
          *   Problem: Two proposals break the current policy (St. Petersburg-style variants with conditional convergence or divergence).
      *   **Task:** Create a step-by-step procedure (decision tree/flowchart style) for evaluating proposals based on EV reasoning, acknowledging its limits.
      *   **Requirements:**
          *   Questions to ask in order.
          *   Sufficient answers at each step.
          *   Stop conditions (No).
          *   Hand-off conditions (Values vs. Maths).
          *   No fudging (admit if EV fails).
          *   Apply procedure to the two provided proposals + one clean case + one "unpleasant answer" case.
          *   State plainly what the procedure *cannot* do.

  2.  **Analyze the Mathematical Problem:**
      *   *Proposal 1:* Fair coin, stop at first Head ($n$). Payout $X_n = (-1)^{n+1} \frac{2^n}{n}$. Probability $P(n) = (1/2)^n$.
          *   Term in EV sum: $P(n) \times X_n = (1/2)^n \times (-1)^{n+1} \frac{2^n}{n} = \frac{(-1)^{n+1}}{n}$.
          *   Series: $1 - 1/2 + 1/3 - 1/4 + \dots$ (Alternating Harmonic Series).
          *   Issue: Conditionally convergent. By Riemann Series Theorem, rearranging terms changes the sum. In a physical game, the order is fixed by $n$, so the sum *is* $\ln(2)$. However, the prompt claims "the total depends on the order in which you add the terms." This implies the prompt is highlighting the *mathematical instability* of conditional convergence as a risk metric, even if the physical process dictates an order. Actually, wait. In a game, $n$ is the random variable. The expectation is $\sum P(n) X_n$. The order of summation in the definition of Expectation is usually by the index of the random variable. So mathematically, $E[X] = \ln(2)$. *However*, from a risk management perspective, conditional convergence implies that the variance is infinite or undefined, and the Law of Large Numbers (LLN) does not apply in the standard way. The average payout over many plays won't necessarily converge to $\ln(2)$ quickly or stably.
          *   *Correction/Refinement:* The prompt says "In the first case the total depends on the order in which you add the terms...". This suggests the prompt treats the mathematical property of conditional convergence as a disqualifier for "Expected Value" as a stable metric. I need to respect the prompt's premise: if the series is not *absolutely* convergent, EV is unreliable for risk management.
      *   *Proposal 2:* Same game, payout $X_n = \frac{2^n}{n}$ (always positive).
          *   Term in EV sum: $(1/2)^n \times \frac{2^n}{n} = \frac{1}{n}$.
          *   Series: $1 + 1/2 + 1/3 + \dots$ (Harmonic Series).
          *   Issue: Diverges to infinity. EV = $+\infty$.
          *   Risk: You cannot fund infinite expected loss. Even if the probability of huge loss is low, the tail risk is unmanageable.
      *   *Core Issue:* Standard EV relies on the Law of Large Numbers (LLN). LLN requires finite mean (and usually finite variance for confidence intervals). If $\sum |P(n)X_n| = \infty$, the EV is not a robust predictor of long-term performance.

  3.  **Drafting the Procedure (The "Risk Protocol"):**
      *   *Goal:* Make it simple for Marketing/Legal, executable by Analyst, defensible to Regulator.
      *   *Step 1: Define the Random Variable.* (What are we paying?)
      *   *Step 2: Check for Absolute Convergence.* (Is $\sum P(x)|X(x)| < \infty$?) This is the crucial mathematical filter. If not, EV is mathematically undefined or unstable.
      *   *Step 3: Calculate EV.* (If Step 2 passes).
      *   *Step 4: Check Capital Adequacy / Ruin Probability.* (Even if EV is positive, can we survive the variance?)
      *   *Step 5: Regulatory/Reputational Check.* (Values judgment).

      *Refining Step 2:* Why Absolute Convergence? Because if $\sum |P(x)X(x)|$ diverges, the expectation is not well-defined in a way that guarantees stability (LLN fails). This addresses Proposal 1 (conditional convergence) and Proposal 2 (divergence).
      *Refining the "Hand-off":* If EV is positive but variance is huge, or if the game is mathematically sound but ethically dubious (e.g., preying on addicts), that's a values call.

  4.  **Developing the Test Cases:**
      *   *Case A (Proposal 1):* Alternating series. Conditionally convergent.
      *   *Case B (Proposal 2):* Positive harmonic series. Divergent.
      *   *Case C (Clean Case):* Standard slot or simple bet. Finite outcomes or exponentially decaying payouts.
      *   *Case D (Unpleasant Answer):* A game with Positive EV for the *operator* (so mathematically "approve"), but high volatility or ethical concerns that the procedure flags for human review, or perhaps a game where EV is positive but the probability of ruin is too high for the bankroll. Let's make it a game where EV is positive, but the "Value" hand-off triggers because the risk of a single catastrophic loss exceeds risk appetite, even if long-term EV is good. Or, better yet, a game where the EV is positive for the *player* (negative for operator) but Marketing wants it for acquisition. The prompt asks for "an answer the panel will not like." If the procedure says "No" to a high-EV (for operator) game because of tail risk, Marketing won't like it. Or if it says "Yes" to a game that feels predatory. Let's go with: A game with positive Operator EV, but the procedure flags the *variance* as requiring a capital reserve we don't have. So the verdict is "No" despite positive EV. Marketing hates this.

  5.  **Addressing the Constraints:**
      *   *Junior Analyst:* Needs clear formulas, not proofs.
      *   *Lawyer/Marketing:* Needs plain English "Pass/Fail" gates.
      *   *Regulator:* Needs to see we aren't relying on unstable math.
      *   *Honesty:* Must admit EV doesn't work for Proposals 1 & 2.

  6.  **Writing the Procedure (Iterative refinement):**
      *   *Name:* The "Stability-First Valuation Protocol" (SFVP).
      *   *Gate 1: Boundedness/Absolute Convergence.* Analyst calculates $\sum P_i |Payout_i|$. If infinite, STOP. EV is invalid.
      *   *Gate 2: Sign of EV.* If Gate 1 passes, calculate $\sum P_i Payout_i$. If negative (for operator), STOP (unless strategic loss approved).
      *   *Gate 3: Tail Risk/Capital.* Check max loss vs. bankroll.
      *   *Gate 4: Values.* Reputational/Regulatory risk.

      *Wait, Proposal 1 nuance:* In Proposal 1, the sum $\sum \frac{(-1)^{n+1}}{n}$ converges to $\ln(2)$. It is *not* divergent. It is *conditionally* convergent. The prompt says "the total depends on the order...". In the context of a game defined by $n$, the order is fixed. So $E[X] = \ln(2)$. *However*, the variance is infinite. $\sum P(n) X_n^2 = \sum (1/2)^n (2^n/n)^2 = \sum \frac{2^n}{n^2}$. This diverges. If variance is infinite, the Central Limit Theorem doesn't apply. The average won't converge normally. This makes EV a dangerous metric. The procedure must catch *infinite variance* or *lack of absolute convergence of the first moment*.
      *Actually, let's look closer at Proposal 1:*
      Term: $a_n = \frac{(-1)^{n+1}}{n}$.
      Absolute sum: $\sum |a_n| = \sum \frac{1}{n} = \infty$.
      So the First Moment is *not Absolutely Convergent*.
      Why does this matter? Feller (Probability theory) notes that if $\sum |x| P(x) = \infty$, the expectation is not well-defined in the Lebesgue sense, even if the Riemann sum converges conditionally. For risk management, we need Lebesgue integrability (Absolute Convergence). If $\sum P(x)|X(x)| = \infty$, the Law of Large Numbers does not hold. The long-run average is unstable.
      *Decision:* The procedure must require **Absolute Convergence of the First Moment**. This kills Proposal 1 and Proposal 2.

  7.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the failure of the old policy.
      *   **The Procedure:** Step-by-step, clear gates.
      *   **Application:** Run the three cases.
      *   **Limitations:** What this doesn't solve.

  8.  **Refining the "Unpleasant Answer":**
      *   I need a case where the math says "Go" (EV positive, stable), but the panel (Marketing) hates it, OR the math says "Stop" (EV positive but unstable/variance too high) and Marketing hates it.
      *   The prompt asks: "Include at least one case where the procedure returns an answer the panel will not like."
      *   Let's create a "Loss Leader" scenario. Marketing wants a game with Negative EV for us (Positive for player) to drive traffic. The old policy said "No" (EV must be positive). The new procedure should explicitly handle "Strategic Losses" as a Values Hand-off.
      *   *Better idea:* A game where EV is positive and stable, *but* the maximum possible loss in a single session exceeds our capital reserve. The math says "Profitable long term." The Risk Officer (me) says "We go bust before long term." The procedure should flag this. Marketing will hate it because it kills a profitable product.
      *   *Alternative:* A game where the EV is mathematically undefined (like Proposal 1), but Marketing argues "But the sum is ln(2)!" The procedure must say "No." This is an answer they won't like (killing a game that 'looks' profitable).
      *   *Selection:* I will use a "High-Variance Positive EV" case. Math says Yes, Capital Check says No. This highlights that EV $\neq$ Viability.

  9.  **Final Polish:**
      *   Tone: Professional, decisive, risk-aware.
      *   Clarity: Bullet points, bold text for decisions.
      *   Honesty: Explicitly state where math ends and judgment begins.

      *(Self-Correction during drafting)*: Make sure the distinction between Conditional and Absolute convergence is clear for the Analyst but simplified for the Panel.
      *Analyst Instruction:* "Calculate the sum of probabilities times the *absolute value* of the payout."
      *Panel Rule:* "If this sum is infinite, the game is mathematically unstable. Reject."

      *Regulator Defense:* "We do not rely on conditionally convergent expectations because they do not guarantee long-term stability under the Law of Large Numbers."

      *Let's check Proposal 1 again:*
      $P(n) = 1/2^n$. Payout $V(n) = (-1)^{n+1} 2^n / n$.
      $E[|V|] = \sum (1/2^n) * (2^n/n) = \sum 1/n = \infty$.
      So $E[|V|]$ diverges. The expectation is not absolutely convergent.
      Verdict: Fail Gate 1.

      *Proposal 2:*
      $P(n) = 1/2^n$. Payout $V(n) = 2^n / n$.
      $E[V] = \sum 1/n = \infty$.
      Verdict: Fail Gate 1 (and Gate 2).

      *Clean Case:*
      Standard coin toss. Win £10 (50%), Lose £5 (50%).
      $E[|V|] = 0.5*10 + 0.5*5 = 7.5$ (Finite).
      $E[V] = 0.5*10 - 0.5*5 = 2.5$ (Positive for player? No, need positive for operator).
      Let's say Operator Win £5, Lose £10.
      $E[Op] = 0.5*5 - 0.5*10 = -2.5$. (Reject).
      Let's say Operator Win £10, Lose £5.
      $E[Op] = 2.5$. (Pass).

      *Unpleasant Case:*
      "The Bank Breaker."
      Operator EV is +£10,000 per game.
      But 1 in 1 million chance of losing £50 million.
      Capital reserve is £10 million.
      Math (EV): Pass.
      Risk (Capital): Fail.
      Marketing: "But the EV is huge!"
      Procedure: "No."

      *Wait, one more thing:* The prompt asks to state plainly what the procedure *cannot* do.
      It cannot optimize for brand value. It cannot predict black swan correlations. It cannot replace ethical judgment.

      *Final check on constraints:* "Junior analyst can execute."
      The test for absolute convergence $\sum P_i |X_i| < \infty$ might be hard for infinite series for a junior.
      *Adjustment:* For infinite series, the Analyst must prove the tail decays faster than $1/n^2$ (for variance) or $1/n$ (for mean).
      *Simpler:* "If the game has infinite possible outcomes, Analyst must provide a convergence certificate from a qualified actuary/mathematician confirming $\sum P(x)|Payout(x)|$ is finite."
      *Actually, keep it simpler:* "If outcomes are unbounded, check if the Expected Absolute Payout is finite. If the series is harmonic or slower decaying, it fails."
      *Better:* I will write the procedure assuming the Analyst can use standard software or known series tests, but the *rule* is the Absolute Convergence Test.

      *Wait, Regulator aspect:* UK Gambling Commission (implied by £). They care about fairness and solvency. Relying on a conditionally convergent series is solvency risk. This is a strong defense.

      *Let's assemble.*

      **Structure:**
      1.  **Memorandum Header:** To Panel, From Risk, Subject: New Valuation Protocol.
      2.  **The Protocol (SFVP):** 4 Gates.
      3.  **Application to Cases:** 1, 2, 3 (Clean), 4 (Unpleasant).
      4.  **Limitations:** What this doesn't solve.

      *Refining the "Values" hand-off:*
      If Math passes, but the game is ethically grey (e.g., high speed, near misses), that's a values call.
      If Math fails (EV undefined), there is no hand-off. It's a hard No. The prompt says "where the procedure stops with a no; and where it has to hand the decision to a person because the issue is one of values rather than maths."
      So:
      Math Fail = Hard No.
      Math Pass + Strategic/Ethical issue = Hand-off.

      *Wait, Proposal 1:* The prompt says "In the first case the total depends on the order...". This implies the prompt considers the EV *undefined* or *unreliable*. My procedure should reflect this. If $\sum P|X| = \infty$, EV is undefined for risk purposes. Hard No.

