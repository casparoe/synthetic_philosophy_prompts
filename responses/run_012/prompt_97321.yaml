answer: |-
  **MEMORANDUM**

  **TO:** Risk Panel (Legal, Marketing, Risk)
  **FROM:** Risk Chair
  **SUBJECT:** New Protocol for Game Valuation (SFVP)
  **DATE:** 24 May 2024

  ### 1. Context and Problem
  Our current policy ("Approve if Expected Value is positive") is mathematically insufficient. It assumes the Law of Large Numbers will stabilize our returns. As demonstrated by the two recent proposals, a game can have a calculable "Expected Value" that never materializes in reality, or an infinite Expected Value that bankrupts us. 

  We cannot approve games where the mathematics of expectation is unstable. A regulator will not accept "the average converges eventually" if the variance is infinite or the sum is conditionally convergent. We need a procedure that a junior analyst can run, that Legal can defend, and that Marketing can understand.

  ### 2. The Stability-First Valuation Protocol (SFVP)

  This procedure replaces the simple "EV > 0" rule. It consists of four sequential gates. If a proposal fails any gate, the process stops unless a specific "Values Hand-off" is triggered.

  **Role:** Junior Risk Analyst (executes steps 1–3).
  **Role:** Risk Panel (reviews Step 4 and Hand-offs).

  #### Gate 1: The Absolute Convergence Test (Math Stability)
  *   **Question:** Is the *Expected Absolute Payout* finite?
  *   **Calculation:** Calculate $S = \sum [ P(\text{outcome}_i) \times | \text{Payout}_i | ]$.
      *   For finite outcomes: Sum the values.
      *   For infinite outcomes: The Analyst must demonstrate the series converges (e.g., terms decay faster than $1/n$).
  *   **Sufficient Answer:** "$S$ is a finite number."
  *   **Fail Condition:** $S$ is infinite or cannot be proven finite.
  *   **Verdict:** **HARD NO.** 
      *   *Reasoning:* If this sum diverges, the Expected Value is mathematically unstable. The long-term average will not converge reliably. We cannot price this risk.
      *   *Regulator Defense:* "We do not offer games where the statistical expectation is not absolutely integrable, as this violates prudent risk management standards."

  #### Gate 2: The Operator Edge Test (Commercial Viability)
  *   **Question:** Is the Expected Value (EV) positive for the *Operator*?
  *   **Calculation:** Calculate $E = \sum [ P(\text{outcome}_i) \times \text{Operator Profit}_i ]$. (Note: Profit = Stake - Payout).
  *   **Sufficient Answer:** "$E > 0$."
  *   **Fail Condition:** $E \le 0$.
  *   **Verdict:** **HARD NO** (Unless Values Hand-off triggered).
      *   *Reasoning:* A game with negative expectation is a guaranteed long-term loss.
      *   *Exception:* If Marketing requests a "Loss Leader" for acquisition, this triggers a **Values Hand-off** (see Step 4).

  #### Gate 3: The Ruin Check (Capital Adequacy)
  *   **Question:** Can we survive the worst-case scenario within a single reporting period?
  *   **Calculation:** Identify the Maximum Probable Loss (MPL) at 99.9% confidence over 1 month. Compare to Liquid Capital Reserve.
  *   **Sufficient Answer:** "MPL is less than 50% of Liquid Capital Reserve."
  *   **Fail Condition:** MPL exceeds threshold.
  *   **Verdict:** **HARD NO.**
      *   *Reasoning:* Positive EV is irrelevant if we go bankrupt before the "long run" arrives.

  #### Gate 4: The Values Hand-off (Human Judgment)
  *   **Trigger:** The game passes Gates 1–3, BUT:
      *   Marketing wants to approve a negative EV game (Loss Leader).
      *   Legal identifies reputational/regulatory risk (e.g., game mechanics resemble high-risk trading).
      *   The "Unpleasant Answer" (See Case 4 below).
  *   **Action:** The Analyst presents the math (Pass) and the Risk Flag. The Panel (Legal, Marketing, Risk) votes.
  *   **Verdict:** **Panel Decision.** Minutes must record the specific value judgment overriding or accepting the risk.

  ---

  ### 3. Application to Proposals

  Here is the SFVP applied to the two breaking proposals, one clean case, and one case where the procedure delivers an answer the panel will dislike.

  #### Case 1: The Alternating Game (Proposal 1)
  *   **Mechanics:** Coin toss until Head ($n$). Payout $(-1)^{n+1} \frac{2^n}{n}$. Prob $1/2^n$.
  *   **Gate 1 (Absolute Convergence):**
      *   Analyst calculates term magnitude: $(1/2^n) \times |(-1)^{n+1} \frac{2^n}{n}| = \frac{1}{n}$.
      *   Sum: $1 + 1/2 + 1/3 + \dots$ (Harmonic Series).
      *   Result: **Diverges to Infinity.**
  *   **Verdict:** **HARD NO.**
  *   **Panel Note:** Do not be swayed by the fact that the alternating sum equals $\ln(2)$. Because the absolute sum is infinite, the expectation is not stable. In a real-world run, our results will not converge to $\ln(2)$ predictably. The math does not give an answer we can bank on.

  #### Case 2: The Positive Divergent Game (Proposal 2)
  *   **Mechanics:** Coin toss until Head ($n$). Payout $\frac{2^n}{n}$. Prob $1/2^n$.
  *   **Gate 1 (Absolute Convergence):**
      *   Analyst calculates term magnitude: $(1/2^n) \times (\frac{2^n}{n}) = \frac{1}{n}$.
      *   Sum: Harmonic Series.
      *   Result: **Diverges to Infinity.**
  *   **Verdict:** **HARD NO.**
  *   **Panel Note:** The Expected Loss is infinite. We cannot fund this. It is not a matter of "high risk"; it is a mathematical impossibility to hedge.

  #### Case 3: The Clean Case (Standard Slot Logic)
  *   **Mechanics:** Player bets £10. 95% chance to lose £10. 5% chance to win £150 (Payout £160).
  *   **Gate 1 (Absolute Convergence):**
      *   Finite outcomes. Sum is obviously finite.
      *   Result: **PASS.**
  *   **Gate 2 (Operator Edge):**
      *   $E = (0.95 \times 10) + (0.05 \times -150) = 9.5 - 7.5 = +£2.00$.
      *   Result: **PASS.**
  *   **Gate 3 (Ruin Check):**
      *   Max loss is capped by player stake limits and bankroll.
      *   Result: **PASS.**
  *   **Verdict:** **APPROVE.**
  *   **Panel Note:** This is business as usual. The math is stable, the edge is clear, the risk is funded.

  #### Case 4: The "Bank Breaker" (The Unpleasant Answer)
  *   **Mechanics:** High-roller promo. Player bets £100k. 
      *   99.9% chance Operator wins £10k.
      *   0.1% chance Operator loses £5 Million.
  *   **Gate 1 (Absolute Convergence):**
      *   Finite outcomes.
      *   Result: **PASS.**
  *   **Gate 2 (Operator Edge):**
      *   $E = (0.999 \times 10,000) + (0.001 \times -5,000,000) = 9,990 - 5,000 = +£4,990$.
      *   Result: **PASS.** (Positive EV).
  *   **Gate 3 (Ruin Check):**
      *   Our Liquid Capital Reserve is £10 Million.
      *   A single loss is £5 Million (50% of reserve).
      *   If we run 1,000 of these, the probability of 2+ losses puts us near insolvency.
      *   Analyst flags: "Single event loss exceeds 20% of Capital Reserve."
      *   Result: **FAIL.**
  *   **Verdict:** **HARD NO.**
  *   **Why the Panel Won't Like It:** Marketing and Finance will argue the EV is strongly positive (+£5k per game). They will argue we can reinsure the tail risk. But the Procedure says No because the *volatility* threatens solvency before the *expectation* saves us. 
  *   **Defence:** "We are a small operator. We cannot absorb a 50% capital hit on a single coin flip, regardless of the odds. EV is a long-term metric; solvency is an immediate constraint."

  ---

  ### 4. What This Procedure Cannot Do

  I must be plain about the limits of this protocol so the Panel does not treat it as a oracle.

  1.  **It Cannot Value Brand Damage:** The procedure might approve a game (like Case 3) that is mathematically sound but predatory (e.g., targeting vulnerable players). That is a **Values Hand-off** to Legal and Marketing. The math will not tell you if a game is ethical.
  2.  **It Cannot Predict Correlation:** The Ruin Check assumes independent games. If a macroeconomic event causes all our high-rollers to lose simultaneously, the model underestimates ruin risk.
  3.  **It Cannot Justify "Strategic Losses":** If Marketing wants to run Case 2 (Infinite EV) as a publicity stunt, the math says "Impossible." If they want to run Case 4 (Positive EV, High Ruin Risk), the math says "Too Dangerous." If they insist, they must sign a **Risk Acceptance Form** acknowledging they are overriding the Risk Protocol. The procedure does not stop them, but it forces the decision into the open.
  4.  **It Cannot Fix Bad Data:** If the probability model provided by the game developer is wrong, the procedure passes garbage. The Analyst must verify the RNG certification, but that is outside this valuation logic.

  ### 5. Recommendation

  Adopt the SFVP immediately. 

  For the two current proposals (Case 1 and 2), the verdict is **Rejected**. Do not attempt to calculate the "order of summation" for Case 1. The lack of absolute convergence makes the metric useless for capital allocation. 

  For future proposals, if a game passes the math but fails the Ruin Check, do not bring it to the panel for a "maybe." Bring it as a "Request for Risk Override" requiring signed approval from the CEO, not just the Panel. This protects us from regulatory scrutiny regarding solvency.

  **Signed,**
  **Risk Chair**
