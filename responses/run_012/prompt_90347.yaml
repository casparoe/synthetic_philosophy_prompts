prompt: |-
  I work at a jobcentre-style welfare office and several times a day my job is to decide whether to start a sanction — cut someone's benefit for a few weeks — because they didn't do what the conditions say (missed a work-search appointment, turned down a job, didn't apply to enough places). I've got maybe fifteen minutes per case and no philosophy training, my supervisor has to sign off on anything unusual, and there's an appeals process, so I have to be able to write down why. Right now we basically go by the rulebook, which is "did they fail to comply, yes/no", and I've started to feel sick about it.

  I want you to turn the philosophical work on the 'undeserving poor' into a decision procedure I can actually run on a case, question by question, in order. Build it around three things I keep tripping over. First, the difference between desert in the strict sense — where someone only deserves blame if the failure was under their control and they had a real alternative — and reciprocity, where the claim is that support is owed to people who work and can be pulled from people who won't, whether or not they could. Second, the difference between me assessing what this person deserves and me assessing what the policy is justified in doing to them; I want those kept seperate even where they end up giving the same answer. Third, the way a category like 'undeserving' gets built administratively and quietly lumps together people who defrauded us, people who are just idle, people who are unlucky, and people who are ill or illiterate and can't navigate the forms — I want the procedure to force the case into one of those boxes or to say it can't.

  For each question, say what counts as a sufficient answer, which ones are factual and which are value judgments I'm not the right person to make, and exactly where the procedure should stop and hand the decision to a human instead of deciding. Then run it on three cases: a guy who missed two appointments because the letters went to an old adress, a woman who turned down a shift because it clashed with caring for her mother and didn't tell us in time, and someone who did apply for jobs but only ones he knew he'd never get — and be honest if the procedure says to sanction any of them. Tell me what the procedure can't do, where it'll misfire, and which of my questions it turns out never had a factual answer.

  And don't hedge. Take a definite position on whether the control condition should be built into the sanction rule and defend it, even if that makes the procedure harder to run and gives me answers I don't want.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Welfare office worker (jobcentre-style).
      *   **Task:** Create a decision procedure for sanctions based on philosophical work on the "undeserving poor."
      *   **Constraints:** 15 minutes per case, no philosophy training, supervisor sign-off for unusual cases, appeals process exists, must be written down.
      *   **Core Tensions to Address:**
          1.  *Desert vs. Reciprocity:* Control/Alternative (Desert) vs. Contribution/Compliance (Reciprocity).
          2.  *Individual Desert vs. Policy Justification:* Distinguish between "does this person deserve blame?" and "does the policy justify sanctioning them?"
          3.  *Administrative Categorization:* Force cases into specific boxes (Fraud, Idle, Unlucky, Incapacitated) or flag as indeterminate.
      *   **Requirements:**
          *   Question-by-question format.
          *   Specify sufficient answers, factual vs. value judgments, and stop-points (hand-off to human).
          *   Run on three specific cases (Wrong address, Carer conflict, Sham applications).
          *   Be honest about outcomes (even if sanctioning).
          *   Limitations/Misfires analysis.
          *   **Crucial:** Take a definite position on the "control condition" (no hedging). Defend it even if it makes the job harder.

  2.  **Philosophical Grounding & Position Taking:**
      *   *The Control Condition:* The prompt asks me to take a definite position.
      *   *Option A (Strict Reciprocity):* Sanction if rules broken, regardless of control. (Easier administratively, morally harsh).
      *   *Option B (Strict Desert):* Sanction *only* if failure was within control. (Morally robust, administratively difficult).
      *   *Decision:* I must take the morally robust position (Option B) because the user explicitly states they feel "sick about it" under the current "yes/no" rulebook. The prompt asks to turn philosophical work *on the undeserving poor* into a procedure. That literature (e.g., Stuart White, George Sher, Elizabeth Anderson) overwhelmingly argues that "desert" requires control. To ignore control is to punish the unlucky, which is the core philosophical critique of the "undeserving" label.
      *   *Defense:* Punishing someone for what they could not prevent is not justice; it is administrative violence. It undermines the legitimacy of the welfare state.
      *   *Integration:* The procedure must prioritize *Control* (Desert) before *Compliance* (Reciprocity). If Control is absent, Reciprocity claims fail.

  3.  **Drafting the Procedure (The "Control-First Sanction Protocol"):**
      *   *Structure:* Needs to be linear, fast (15 mins), and distinct on the three tensions.
      *   *Section 1: Categorization (The "Box" Problem).* Force the worker to identify *why* the failure happened before deciding *if* it's sanctionable.
      *   *Section 2: The Control Test (Desert).* Did they have a real alternative?
      *   *Section 3: The Policy Test (Reciprocity/Justification).* Even if they are blameworthy, does the policy goal justify the harm?
      *   *Section 4: The Hand-off.* Where does the worker stop?

      *Refining the Questions:*
      *   Q1: What is the specific failure? (Fact)
      *   Q2: Which Category does this fit? (Fraud, Idle, Unlucky, Incapacitated). This addresses the "administrative lumping" issue.
      *   Q3: The Control Condition. Could they have done otherwise? (Fact/Inference).
      *   Q4: The Policy Justification. Does sanctioning here actually promote work/compliance, or just punish? (Value/Policy).
      *   Q5: The Decision.

      *Stop Points:* If Q2 is "Unlucky" or "Incapacitated," stop. If Q3 is "No control," stop. If Q4 is "Policy mismatch," flag for supervisor.

  4.  **Running the Cases:**

      *   *Case 1: Wrong Address.*
          *   Failure: Missed appointment.
          *   Category: Unlucky (Administrative error/Mail).
          *   Control: No. He didn't know.
          *   Outcome: No Sanction.
      *   *Case 2: Carer Conflict.*
          *   Failure: Turned down job/shift.
          *   Category: Incapacitated (Social constraint/Caring duty) OR Idle (if she could have arranged care).
          *   Control: Nuanced. Did she have a choice? If no childcare, maybe no.
          *   Outcome: Likely No Sanction (if caring duty is recognized as a valid constraint), but requires supervisor check on "Good Reason."
      *   *Case 3: Sham Applications.*
          *   Failure: Non-compliance with search quality.
          *   Category: Idle (Strategic non-compliance).
          *   Control: Yes. He chose to apply for unreachable jobs.
          *   Outcome: Sanction warranted (under this strict desert view, because he *did* have control). *Self-Correction:* This is the hard pill to swallow. The user wants honesty. If he *could* have applied properly but chose not to, he meets the desert condition for blame.

  5.  **Addressing the Limitations & "Unanswerable Questions":**
      *   *Epistemic Limit:* We can't truly know someone's mind (Case 3).
      *   *Structural Limit:* The "Control" condition is hard to prove in 15 mins.
      *   *Policy Limit:* The worker isn't a policymaker (Q4 is hard).
      *   *The "Unanswerable":* "Could they have done otherwise?" is often counterfactual and unknowable.

  6.  **Refining the Tone:**
      *   Direct, professional, empathetic but firm.
      *   No hedging on the Control Condition.
      *   Acknowledge the difficulty of the worker's position.

  7.  **Final Review against Constraints:**
      *   15 mins feasible? Yes, if questions are sharp.
      *   Desert vs. Reciprocity separated? Yes (Section 2 vs. Section 3).
      *   Categories forced? Yes (Section 1).
      *   Definite position on Control? Yes (Built-in as a veto).
      *   Three cases run? Yes.
      *   Limitations discussed? Yes.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Make sure the distinction between Desert and Policy is clear.* Desert = Is *this person* blameworthy? Policy = Is *this rule* worth enforcing here?
      *   *Ensure the "Stop" points are clear.* If Control is missing, the procedure *must* halt the sanction.
      *   *Case 3 Analysis:* Be careful not to assume guilt, but based on the prompt ("only ones he knew he'd never get"), the premise implies intent. I must treat the premise as fact for the exercise.
      *   *The "Control" Defense:* I need to write a specific section defending why I built it this way, as requested ("Don't hedge... defend it").

  9.  **Final Polish:** Check word count and clarity. Ensure the "Administrative Categorization" requirement is met explicitly. (The four boxes: Fraud, Idle, Unlucky, Incapacitated).

  *(Self-Correction during drafting)*: I initially thought about letting the worker decide Policy Justification. But the prompt says "supervisor has to sign off on anything unusual." I should route "Policy Justification" failures to the supervisor, as the frontline worker enforces policy, they don't usually set it. However, the prompt asks for *my* procedure to help *them* decide. I will frame Q4 as "Does this sanction serve the stated goal?" If the answer is No, it goes to Supervisor/Exception.

  Let's finalize the Control Condition stance. The prompt asks me to "Take a definite position on whether the control condition should be built into the sanction rule." I will argue **Yes**. Without control, there is no moral desert. Punishing without control is merely causal management, not justice. This makes the worker's job harder but morally safer.

  Okay, ready to write.
answer: |-
  Here is the **Control-First Sanction Protocol (CFSP)**. It is designed to fit within a 15-minute window, separate moral desert from policy enforcement, and force administrative clarity on *why* a failure occurred.

  ### The Stance: The Control Condition
  You asked for no hedging. Here is the position this procedure is built on: **A sanction is morally illegitimate if the claimant lacked control over the failure.**

  Reciprocity (the idea that support requires contribution) is valid *only* if the person is capable of contributing. If a person cannot comply due to factors outside their will (illness, bad luck, structural barriers), they cannot be "undeserving" in the moral sense. Punishing them does not enforce reciprocity; it enforces obedience to causality. Therefore, **Control is a veto.** If the answer to "Could they have done otherwise?" is No, the sanction process stops immediately, regardless of the rulebook. This makes your job harder because you must investigate *capacity*, not just *compliance*, but it prevents you from administering injustice.

  ---

  ### The Procedure (CFSP v1.0)

  **Time Limit:** 15 Minutes.
  **Instruction:** Answer in order. If you hit a **STOP**, do not proceed. Document the reason code.

  #### Phase 1: Administrative Categorization
  *Goal: Prevent lumping distinct moral categories together.*

  **Q1: What is the specific technical failure?**
  *   *Type:* Factual.
  *   *Sufficient Answer:* Cite the specific rule clause (e.g., "Missed Appointment 14/05," "Refused Offer #203").
  *   *If unclear:* **STOP.** Request clarification from claimant. Do not sanction on ambiguity.

  **Q2: Which single box best explains the cause of failure?**
  *   *Type:* Value Judgment (Categorization).
  *   *Options:*
      1.  **Fraud:** Intentional deception for gain.
      2.  **Idle:** Capable of compliance, chose not to, no overriding barrier.
      3.  **Unlucky:** External event prevented compliance (mail loss, transport strike, illness onset).
      4.  **Incapacitated:** Internal/Structural barrier prevented compliance (illiteracy, caring duty, mental health, lack of childcare).
  *   *Sufficient Answer:* Selection of one box with one sentence of evidence.
  *   *Constraint:* You cannot select "Idle" if there is *any* evidence for "Unlucky" or "Incapacitated." Benefit of the doubt goes to the claimant.
  *   *If Box 3 (Unlucky) or Box 4 (Incapacitated):* **STOP.** Mark as "Good Reason / No Control." No Sanction.
  *   *If Box 1 (Fraud) or Box 2 (Idle):* Proceed to Q3.

  #### Phase 2: The Desert Test (Control)
  *Goal: Assess individual blameworthiness separate from policy.*

  **Q3: Did the claimant have a realistic alternative action available at the time?**
  *   *Type:* Factual/Inferential.
  *   *Sufficient Answer:* Yes/No.
      *   *Yes:* They could have called, emailed, attended, or applied differently without severe hardship.
      *   *No:* The cost of compliance was impossible (e.g., no money for bus fare, no one to watch mother).
  *   *Constraint:* "Inconvenient" counts as Yes. "Impossible" counts as No.
  *   *If No:* **STOP.** Mark as "No Control." No Sanction.
  *   *If Yes:* Proceed to Q4.

  #### Phase 3: The Policy Justification Test (Reciprocity)
  *Goal: Assess if the rule serves its purpose in this specific case.*

  **Q4: Does sanctioning this person actually promote the policy goal (employment/compliance), or does it create a barrier?**
  *   *Type:* Value Judgment (Policy Application).
  *   *Sufficient Answer:*
      *   *Promote:* Sanction will signal seriousness and correct behavior.
      *   *Barrier:* Sanction will make finding work harder (e.g., loss of phone credit, travel funds, housing stability).
  *   *If Barrier:* **STOP.** Flag for **Supervisor Review**. Do not sanction automatically. You are noting that the policy may be misfiring.
  *   *If Promote:* Proceed to Q5.

  #### Phase 4: Decision
  **Q5: Final Determination.**
  *   *If passed Q2, Q3, Q4:* **Sanction Recommended.**
  *   *Documentation:* You must write: "Category: [Idle/Fraud]. Control: [Yes]. Policy Goal: [Promoted]."

  ---

  ### Running the Cases

  Here is how the CFSP handles your three scenarios.

  #### Case 1: The Wrong Address
  *   **Q1 (Failure):** Missed two appointments.
  *   **Q2 (Category):** **Unlucky.** Letters went to old address. Claimant did not know.
  *   **Decision:** **STOP at Q2.**
  *   **Outcome:** **No Sanction.**
  *   **Reasoning:** This is not "Idle" behavior. It is administrative friction. Under the CFSP, you cannot categorize this as Idle/Fraud if "Unlucky" fits. The "Undeserving" label does not apply here.

  #### Case 2: The Carer
  *   **Q1 (Failure):** Turned down shift, didn't notify in time.
  *   **Q2 (Category):** **Incapacitated.** (Caring duty is a structural barrier similar to illness in this context).
      *   *Note:* If she *could* have arranged care but didn't, it would be Idle. If no care was available, it is Incapacitated.
      *   *Assumption:* Based on "clashed with caring," we assume no alternative care existed.
  *   **Decision:** **STOP at Q2.**
  *   **Outcome:** **No Sanction.**
  *   **Reasoning:** She lacked a real alternative. To sanction her is to punish her for the lack of social care infrastructure, not for her will.
  *   *Supervisor Note:* If your rulebook says "Caring is not Good Reason," the CFSP flags this for **Supervisor Review** at Q4 (Policy Justification), because sanctioning her creates a barrier (she loses money while caring), it does not promote employment.

  #### Case 3: The Sham Applicant
  *   **Q1 (Failure):** Applied for jobs, but only unreachable ones.
  *   **Q2 (Category):** **Idle.** (Assuming evidence shows he *knew* they were unreachable and did it to tick boxes).
  *   **Q3 (Control):** **Yes.** He had the capacity to apply for suitable jobs. He chose not to.
  *   **Q4 (Policy):** **Promote.** (Arguably). Sanctioning signals that box-ticking is insufficient.
  *   **Decision:** **Sanction Recommended.**
  *   **Outcome:** **Sanction.**
  *   **Reasoning:** This is the hard truth of the Control Condition. If he *could* have complied and *chose* not to, he is morally blameworthy under a reciprocity framework. He is "Idle," not "Unlucky." The CFSP does not protect him.

  ---

  ### Limitations and Misfires

  You asked for honesty about where this breaks.

  **1. The Epistemic Black Box (Case 3 Problem)**
  The procedure relies on Q2 and Q3 being answerable. They often aren't. In Case 3, how do you *know* he knew he'd never get the jobs?
  *   **The Misfire:** You will inevitably misclassify "Incapacitated" (e.g., undiagnosed cognitive decline) as "Idle."
  *   **The Unanswerable Question:** "Could they have done otherwise?" is a counterfactual. You cannot know what a person would have done in a different mental state or with different resources. You are judging *evidence of control*, not control itself.
  *   **Risk:** You will still sanction some people who lacked control, simply because they couldn't prove they lacked it within 15 minutes.

  **2. The Policy Justification Trap (Q4)**
  Q4 asks you to judge the policy. You are not a policymaker.
  *   **The Misfire:** If you answer "Barrier" too often, your supervisor will reject your exceptions. If you answer "Promote" too often, you revert to the rulebook you hate.
  *   **The Unanswerable Question:** "Does this sanction promote employment?" There is no data on your desk to answer this. It is a guess.
  *   **Risk:** This question might become a rubber stamp, rendering Phase 3 useless.

  **3. The Administrative Burden**
  *   **The Misfire:** The CFSP takes longer than 15 minutes if the claimant is complex.
  *   **The Risk:** You might rush Q2 (Categorization) to meet targets. If you rush Q2, the whole moral safeguard collapses.
  *   **The Fix:** If you cannot categorize in 15 minutes, the procedure mandates a **Stop** and a referral. This will increase your "pending" pile. Your management may not like this.

  ### Summary of What This Changes
  1.  **It stops you from punishing the Unlucky.** (Case 1 is safe).
  2.  **It forces you to recognize Care/Disability as Incapacity, not Idleness.** (Case 2 is safe).
  3.  **It forces you to admit when someone is just non-compliant.** (Case 3 is sanctioned).
  4.  **It separates your moral judgment from the rule.** You can write in the notes: "Category: Idle. Control: Yes. *Personal Note: Policy creates barrier, but rule requires sanction.*" This protects your conscience by distinguishing *what is just* from *what is required*.

  **Final Warning:** This procedure will reduce your sanction rate. It will increase your referral rate to supervisors. It will make you argue more with claimants about "Control." But it ensures that when you do sanction, you are punishing a choice, not a circumstance. That is the only defensible position.
