answer: |-
  Your diagnosis of the situation is astute, and your hypothesis regarding over-constraint is not only plausible but largely supported by the formal literature developed over the last two decades. The stalemate your reading group has encountered is not a failure of imagination or argumentative stamina; it is a structural feature of the problem space.

  Here is a diagnosis of the disagreement, an assessment of the over-constraint hypothesis, and a sketch of what genuine progress looks like in this domain.

  ### 1. The Nature of the Disagreement

  You ask whether this is a substantive disagreement about value, a verbal dispute about "betterness," a category error, or a clash of brute intuitions. The most accurate diagnosis is that it is a **coherence crisis within our pre-theoretic intuitions.**

  It is not merely verbal. While there is certainly ambiguity in how we use "better" when comparing populations of different sizes (is it better *for the world*, *for the average person*, or *simpliciter*?), the conflict persists even when definitions are stipulated. If you define "better" as "higher total welfare," you get the Repugnant Conclusion (RC). If you define it as "higher average welfare," you get the Sadistic Conclusion (preferring a population of miserable people to one of happy people if the miserable ones raise the average). The problem is not that you are talking past one another; it is that the concepts you are trying to reconcile pull in logically incompatible directions.

  It is not purely substantive in the standard sense, either. A substantive disagreement usually implies that there is a fact of the matter that one side has grasped and the other has missed. In population ethics, there is no independent access to the "truth" of these comparisons outside of our intuitions and the theories built to systematize them.

  Therefore, the split in your group reflects a divergence in **axiomatic prioritization**.
  *   **The Bullet-Biters** (Total Utilitarians) prioritize the **Principle of Equality** (a life is a life, regardless of when or where it is lived) and **Transitivity**. They accept that their intuition about the RC is the weak link.
  *   **The Framework-Skeptics** prioritize **Non-Elitism** (we shouldn't prefer a huge population of barely-worth-living lives) and **Mere Addition** (adding a happy life shouldn't make things worse). They conclude that the aggregative framework (summing or averaging welfare) is the weak link.

  The disagreement is substantive only in the sense that different members of your group are willing to sacrifice different foundational intuitions to preserve logical consistency.

  ### 2. Assessing the Over-Constraint Hypothesis

  Your hypothesis is correct: the impasse is driven by formal impossibility results. You are likely recalling the work of **Gustaf Arrhenius**, specifically his *Impossibility Theorems for Welfarist Axiologies* (and related work by Blackorby, Bossert, and Donaldson).

  **The Formal Reality**
  Arrhenius and others have demonstrated that no population axiology can satisfy a set of seemingly minimal adequacy conditions simultaneously. While the specific conditions vary by theorem, a representative set includes:
  1.  **Dominance:** If outcome A is better than B for some people and worse for none, A is better than B.
  2.  **Non-Elitism:** A very large population of lives with very high welfare is not worse than a small population of lives with extremely high welfare (avoiding a "reverse repugnance").
  3.  **Weak Non-Sadism:** It is not better to add a person with negative welfare than to add a person with positive welfare.
  4.  **Quality Addition:** There is some level of welfare such that adding a person with that welfare makes the outcome better, regardless of population size.
  5.  **Transitivity:** If A is better than B, and B is better than C, A is better than C.

  Arrhenius's results show that these conditions are inconsistent. You cannot have them all.

  **Does this bear the diagnostic weight you suggest?**
  Yes. This explains why your group has stalled. You are hunting for a theory that satisfies all these conditions because they all feel "too obvious to deny." The formal results prove that such a theory does not exist. The "long parade of attempted repairs" you described fails because every repair satisfies some conditions while violating others.
  *   **Total Utilitarianism** satisfies Dominance and Transitivity but violates Non-Elitism (yields RC).
  *   **Average Utilitarianism** avoids RC but violates Weak Non-Sadism (yields Sadistic Conclusion).
  *   **Critical-Level Views** avoid RC and Sadism but often violate Intuition of Neutrality (implying it is bad to add a happy life if it doesn't meet the critical threshold) or create discontinuities.
  *   **Person-Affecting Views** avoid RC but violate Transitivity or Dominance (due to the Non-Identity Problem).

  **Caveats and Contested Ground**
  It is crucial to flag where the literature is settled and where it is not.
  *   **Settled:** The existence of these impossibility theorems is mathematically settled within the specified formal frameworks. It is also settled that Total Utilitarianism entails the RC and Average Utilitarianism entails the Sadistic Conclusion.
  *   **Contested:** The *interpretation* of these theorems is highly contested. Some philosophers argue that the formal conditions do not perfectly capture the moral intuitions they represent. For example, one might argue that "Transitivity" is less sacred in moral betterness than in logic, or that "Mere Addition" is ambiguous. However, most working in the field accept that the theorems map the boundaries of the possible.

  Therefore, your hypothesis is not a misdescription. The debate is stalled because the participants are often trying to solve an over-constrained system without acknowledging that a constraint must be removed.

  ### 3. What Counts as Progress?

  If the problem is over-constraint, progress does not come from finding the "correct" theory that avoids all counterexamples. Progress comes from **axiomatic triage** or **framework shifting**.

  **A. Axiomatic Triage (The "Which Premise to Drop?" Approach)**
  Progress occurs when a theorist explicitly identifies which adequacy condition they are rejecting and provides a principled argument for why *that* intuition is the least trustworthy.
  *   *Example:* Parfit, in *Reasons and Persons*, leaned toward rejecting the intuition that the RC is repugnant (later softening this).
  *   *Example:* Some prioritarian views reject the idea that welfare is strictly additive, arguing that the moral value of welfare diminishes as total welfare rises.
  *   *Progress Marker:* A group member moves from saying "Theory X fails because of Counterexample Y" to "Theory X fails Counterexample Y because Condition Z is false, and here is why we should live without Condition Z."

  **B. Framework Shifting (The "Betterness vs. Permissibility" Approach)**
  You mentioned the possibility that the groups are answering different questions. This is a viable path out of the impasse.
  *   **Axiology vs. Deontology:** The RC is a problem for *axiologies* (theories of what is "better"). It may not be a problem for *deontological* theories (what we are "permitted" to do). Some philosophers (e.g., rights-based views, contractualism) argue that we should not rank outcomes as "better" or "worse" in the abstract but rather ask if bringing people into existence violates their rights or duties.
  *   **Incomparability:** Parfit's later work (and others like Chang) suggests that some populations are not "better" or "worse" but *incomparable*. If A and Z are incomparable, the RC dissolves because we are not committed to saying Z is better than A. This requires rejecting the **Completeness** condition (that any two outcomes can be compared).
  *   **Progress Marker:** The group agrees to stop looking for a ranking function and instead looks for a decision procedure or a rights-based constraint.

  **C. Decision-Theoretic Approaches**
  A more recent avenue (explored by Hilary Greaves, Toby Ord, and others) is to bypass the question of "what is better" and ask "what should we choose?" under uncertainty. If we are uncertain about which population ethic is correct, we might maximize *expected choice-worthiness*.
  *   **Progress Marker:** Shifting the debate from metaphysical betterness to practical rationality under moral uncertainty.

  ### 4. Recommendation for Your Group

  To break the stalemate, I recommend you change the prompt for your next session. Do not ask, "Which theory avoids the Repugnant Conclusion?" Ask, **"Which adequacy condition are we willing to formally reject?"**

  Present the group with the impossibility theorem (Arrhenius is the standard citation). Lay out the five or six conditions that cannot all be true. Ask each member to vote on which one they are willing to sacrifice.
  *   If someone sacrifices **Transitivity**, they are moving toward intransitive or vagueness-based views.
  *   If someone sacrifices **Mere Addition**, they are moving toward Critical-Level or Variable-Value views.
  *   If someone sacrifices **Completeness**, they are moving toward Incomparability views.
  *   If someone sacrifices **Non-Elitism**, they are biting the Repugnant Conclusion.

  This transforms the disagreement from a frustrating search for a non-existent object into a clear-eyed negotiation about which moral intuitions are most expendable.

  ### Summary Diagnosis

  1.  **Type of Disagreement:** A coherence crisis caused by inconsistent pre-theoretic intuitions, manifesting as substantive disagreement over which axioms to prioritize.
  2.  **Over-Constraint Hypothesis:** **Correct.** Formal impossibility theorems (Arrhenius et al.) confirm that no theory can satisfy all plausible conditions. The stalemate is rational.
  3.  **Path to Progress:** Abandon the search for a theory that satisfies all intuitions. Progress is defined by the explicit, justified rejection of specific adequacy conditions or a shift from axiology (betterness) to deontology (permissibility) or decision theory (choice under uncertainty).

  Your group has not failed; you have successfully mapped the boundaries of the possible. The next step is to decide where to build within those boundaries.
