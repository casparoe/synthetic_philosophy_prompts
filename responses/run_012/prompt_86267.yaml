answer: |-
  **1. The Distinction from Exception-Clause Generalism**
  Consider two situations that differ only slightly: in the first, I am candid with a friend about their appearance, and this is kind; in the second, I am candid with the same friend about the same appearance, but this is cruel. The generalist says candour is a positive reason that is merely *overridden* in the second case. You say candour is a positive reason in the first but a *negative* reason in the second. If the situations are nearly identical, what prevents your view from collapsing into the claim that we simply haven't found the precise exception clause yet? At what point does "holism" become indistinguishable from "complexity we haven't codified"?

  *   **Likely Answer:** She will argue that adding exception clauses makes the rule so complex it ceases to function as a guide or explanation, whereas holism captures the *shape* of moral thought.
  *   **Follow-up:** If the rule becomes too complex to state, does it still function as a *principle* in any meaningful sense, or have you just redefined "principle" to mean "the output of judgment" rather than "the input"?

  **2. The Acquisition of Moral Competence**
  If there are no principles to learn, how is moral knowledge transmitted? When a parent corrects a child, they usually appeal to a generalization ("We don't hit because it hurts"). If your view is correct, isn't every moral lesson essentially misleading, training the child to look for invariant rules that don't exist? How do we learn to judge well if we cannot learn *that* certain features matter?

  *   **Likely Answer:** She will likely compare it to learning a language or an art: we learn through exposure to examples and correcting mistakes, not by memorizing grammar rules first.
  *   **Follow-up:** But in language and art, there are techniques and structures that can be articulated after the fact. If a student asks *why* their judgment was wrong, and you cannot cite a principle, does "sensitivity" become a black box that cannot be taught, only caught?

  **3. Guidance for the Confused Agent**
  Principles often serve as heuristics for agents who lack perfect wisdom. If I am genuinely unsure what to do in a complex situation, your view seems to offer me no tool other than "look harder." What does particularism offer a person who is morally confused but lacks the developed sensitivity of the virtuous agent? Are they simply left without resources?

  *   **Likely Answer:** She will argue that principles often mislead the confused agent by blinding them to relevant nuances; true guidance comes from imagination and attention to the case, not subsumption under a rule.
  *   **Follow-up:** If principles are dangerous crutches that distort vision, why do moral codes and laws exist in almost every human society? Is humanity simply systematically mistaken about how to guide itself?

  **4. Falsifiability and Serious Objection**
  Generalists argue that if a feature like "causing pain" never counted in favour of an action anywhere, that would support their view. You might reply that we simply haven't seen the right context yet. What would count as a serious objection to your view that isn't just a restatement of the generalist intuition? Is there any empirical or conceptual evidence that could convince you that moral reasons are invariant?

  *   **Likely Answer:** She will likely say the view is an explanatory hypothesis about the structure of reasons; it would be undermined if we could successfully codify morality without loss of nuance.
  *   **Follow-up:** Given that no one has successfully codified morality yet, is your view protected from falsification simply by the current failure of generalism? How long must generalism fail before particularism is confirmed by default?

  **5. Consistency and Arbitrariness**
  A central demand of morality is consistency: treating like cases alike. If the moral valence of a feature depends entirely on the context, how do you guarantee consistency? If I perform an action based on feature F in case A, and refrain in case B because F counts against it, how can I demonstrate to others that I am not being arbitrary, given that the "context" can always be described differently?

  *   **Likely Answer:** She will argue that consistency is about responding correctly to reasons, not applying the same rule; like cases are alike in relevant respects, and holism explains *which* respects are relevant.
  *   **Follow-up:** But without a principle to define "relevant respects," isn't the claim that "these cases are relevantly different" just an assertion? How do we adjudicate disputes about relevance without appealing to a higher-order rule?

  **6. Moral Disagreement and Debate**
  When two people disagree morally, they typically argue by appealing to shared principles ("You say lying is wrong, but what about white lies?"). If we don't share principles because reasons are context-dependent, how is moral argument possible? Does debate not collapse into a clash of intuitions where neither side can appeal to a common standard?

  *   **Likely Answer:** She will suggest we argue by drawing analogies and highlighting features the other has overlooked, inviting them to "see" the case differently rather than forcing it under a rule.
  *   **Follow-up:** If I refuse to "see" it your way, and there is no principle to which I am rationally committed, is there any rational pressure on me to change my mind? Does this view risk making moral disagreement non-rational?

  **7. Justification to Others**
  When I am asked to justify my action ("Why did you deny that request?"), citing a principle ("Because it was unfair") is usually sufficient. On your view, citing a feature ("Because it was unfair") is incomplete, since unfairness might count in favour in another context. Does your view not make moral justification impossibly demanding, requiring me to explain the entire context to justify any single action?

  *   **Likely Answer:** She will argue that citing a reason is sufficient *in that context*; we don't need to list all the enabling conditions unless they are challenged.
  *   **Follow-up:** But if the reason's force is contingent on those enabling conditions, doesn't citing the reason alone risk misleading the listener about the actual basis of the action? Is moral communication inherently prone to error on your view?

  **8. Moral Progress**
  We often speak of moral progress, such as the shift away from slavery. Generalists describe this as recognizing that certain principles (like equality) apply more broadly than previously thought. How does your view account for moral progress? If there are no principles to extend, are we just saying that our sensitivities have changed?

  *   **Likely Answer:** She will say progress is a matter of seeing reasons that were always there but were obscured by bad ideology or lack of imagination.
  *   **Follow-up:** If the reasons were "always there," doesn't that imply a stable moral reality that principles could track? If principles can't track it, how do we ensure that our new "sensitivity" is actually progress and not just a different fashion?

  **9. The Status of "Default" Reasons**
  Some particularists allow that features have a "default" valence (e.g., pain is usually bad) even if it can switch. Do you accept default reasons? If so, doesn't that reintroduce a weak form of generalism that does most of the practical work? If not, isn't the moral world too chaotic for agents to navigate?

  *   **Likely Answer:** She may reject default reasons as a concession to generalism, insisting that even the "usual" case is context-dependent, or accept them as mere statistical generalizations with no normative force.
  *   **Follow-up:** If they have no normative force, why should I attend to them? If they are just statistical, does that reduce morality to a matter of probability rather than justification?

  **10. Explanation of Action**
  When we explain our own actions to ourselves, we often think, "I did X because of principle Y." If your view is true, is this self-understanding an illusion? Are we actually reasoning particularistically while *believing* we are reasoning generally, and if so, why does the illusion persist so stubbornly?

  *   **Likely Answer:** She will argue we are not illusioned but rather use principles as shorthand for complex patterns of reasons we have internalized.
  *   **Follow-up:** If they are just shorthand, can we ever expand the shorthand fully? If not, are we doomed to never fully understand the true basis of our own moral choices?
