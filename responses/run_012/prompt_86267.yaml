      *Re-evaluating the "Follow-up" constraint:* "Keyed to the answer she is most likely to give." This requires me to predict her philosophical moves (e.g., appealing to default reasons, analogy, the failure of codifiability).

      *Let's finalize the list.*
      1. Candour/Exceptions (Required)
      2. Learning (Required)
      3. Guidance/Confusion (Required)
