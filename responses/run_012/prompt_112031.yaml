answer: |-
  This is one of the deepest and most uncomfortable puzzles in ethics, and you have grasped the exact hinge point: **norms and expectations.** Your teacher and classmate are right. In philosophy, this is often discussed under "causation by omission" and "moral responsibility."

  You asked for concrete implications, not vague answers. Here is how you should apply the logic of the "gardener" to your own life, specifically regarding the bullying incident and the fear of infinite responsibility.

  ### 1. The "I Did Nothing" Defense is False (Under Specific Conditions)
  You asked if "I didn't do anything" is a valid defense. Based on the gardener example, the answer is **no**, provided two conditions are met. You are responsible for an omission if:
  1.  **You had the capacity to act:** You physically could have done something (called a teacher, stepped in, distracted the aggressor).
  2.  **There was a legitimate expectation of action:** This is the "gardener" part.

  In the bullying scenario, you need to ask: *Was there a norm that I violated?*
  In a high school environment, there is usually a tacit social contract among students that we do not let peers get harmed if we can safely prevent it. By standing there, you became part of the "audience" that makes bullying work. Bullies often rely on the silence of bystanders to validate their power.

  **Concrete Implication:** You cannot absolve yourself by saying "I didn't hit him." Your inaction was a *condition* for the bullying continuing. If all five of you had walked away or gotten help, the event likely would have stopped. Therefore, your "nothing" was a causal factor. You share responsibility not for the *attack*, but for the *success* of the attack.

  ### 2. How to Determine Your Level of Blame (The "Duty" Filter)
  You are worried about where to draw the line. If omissions count, are you to blame for everything? No. The "gardener" logic gives you a filter to decide when you are off the hook. You are **not** responsible for an omission if:

  *   **The Cost to You is Disproportionate:** The gardener is expected to water plants because it's easy. If watering the plants required the gardener to jump into a volcano, the duty vanishes. In the bullying case, if intervening meant you would have been physically beaten or severely harmed, your duty to act decreases. However, "getting awkward" or "risking social status" is usually not considered a high enough cost to override the duty to help a peer in distress.
  *   **There is No Special Relationship:** You are not responsible for the starving child on the other side of the world in the *same way* you are responsible for the kid in your grade. Why? Because the "norm" is weaker. You have no direct link, and you have no capacity to solve the root cause personally.
  *   **You Lack Knowledge:** If you didn't know the plants needed water, you aren't the cause of their death. If you didn't know the kid was being hurt (e.g., it happened behind your back), you have no blame. But you said you were "standing right there." You knew.

  **Concrete Implication:** You are more responsible for the kid in your grade than the kid in another country because of **proximity** and **capacity**. You could have actually changed the outcome in the hallway. You cannot easily change the outcome for the kid overseas. The "norm" applies strongly to the hallway, weakly to the overseas context. This prevents the "infinite responsibility" problem.

  ### 3. Why the Idea Doesn't Break Down (The "Limit" Principle)
  You asked if this idea stops being useful if you're responsible for everything you don't do. It only breaks down if you assume *all* omissions are equal. They aren't.

  Think of responsibility like a circle of light.
  *   **Inner Circle:** Things you directly do. (Highest responsibility).
  *   **Middle Circle:** Things you don't do, but promised to, or are expected to by your role (friend, student, bystander in a crisis). (High responsibility).
  *   **Outer Circle:** Things you don't do for strangers far away with no specific connection. (Low to No responsibility).

  The philosophy of omission is useful because it forces you to look at the **Middle Circle**. Most people try to pretend the Middle Circle doesn't exist. They say, "I only control my own hands." The gardener example proves that your *role* extends your control to things your hands aren't touching.

  **Concrete Implication:** Do not let the "kids on the other side of the world" argument paralyze you. That is a different category. Focus on the **Middle Circle**: people you interact with, communities you belong to, and situations where you are the only one who can help. That is where the "gardener" rule applies.

  ### 4. What To Do With The Guilt
  You said you feel awful. That feeling is actually the philosophical point working correctly. Guilt is the emotional signal that you violated a norm you believe in.

  *   **Don't argue with the metaphysics:** Do not try to convince yourself "I didn't cause it." You know now that inaction can be a cause. Fighting that fact will just make you cynical.
  *   **Accept the "Gardener" Status:** You were, in that moment, a gardener for that kid's safety. You had the water (your voice/help), you had the duty (fellow student/bystander), and you didn't water.
  *   **Convert Blame to Policy:** The point of assigning blame for omissions isn't to punish you forever; it's to update your "job description" for the future.

  **Concrete Action Plan:**
  1.  **Acknowledge:** Admit to yourself, "I did not physically hurt him, but my silence allowed it to continue. I am partly responsible for the environment that allowed that to happen."
  2.  **Repair (if possible):** If it is safe and appropriate, reach out to the kid. You don't have to say "I caused this." You can say, "I saw what happened and I'm sorry I didn't step in. I want to do better." This re-establishes the norm.
  3.  **Pre-commit:** Decide *now* what you will do next time. "If I see X, I will do Y." (e.g., "If I see someone getting cornered, I will walk up and ask them a fake question to break the tension," or "I will immediately find a teacher.")

  ### Summary
  *   **Is "I did nothing" a defense?** No. Not if you could have acted and there was a reasonable expectation that you should have.
  *   **Are you responsible for everything?** No. Responsibility scales with **proximity**, **capacity**, and **relationship**. You are responsible for the kid in the hallway, not the kid overseas.
  *   **What now?** Accept that your inaction was a causal factor. Use the guilt to define your "job description" for the future. You are not just a person who avoids doing bad things; you are a person who is expected to prevent bad things when you safely can.

  You are in the "Middle Circle." That is heavy, but it's also where being a good person actually happens.
