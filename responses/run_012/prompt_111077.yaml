answer: |-
  The phenomenon you have isolated is established, but it is frequently conflated with neighboring concepts in ways that blur the sharp edges you have correctly identified. The most precise psychological term for the state you describe is **Pluralistic Ignorance**. In organizational theory, the narrative arc you describe (a group undertaking an action no one wants) is known as **The Abilene Paradox**.

  However, neither term fully captures the specific *epistemic mechanism* you are highlighting: the inference of competence or assent specifically from the *absence of a signal*, absent a sequence of actions or a specific leader.

  Here is the definition, the boundaries, and the verdict on the stability of the arrangement, drawn as sharply as your observation demands.

  ### 1. The Name and Definition
  **Primary Term:** **Pluralistic Ignorance**
  **Organizational Variant:** **The Abilene Paradox**

  **Definition:** A situation in which a majority of group members privately reject a norm, proposal, or belief, but incorrectly assume that most others accept it. Consequently, they act in accordance with the perceived group norm (silence/agreement), thereby reinforcing the false perception for everyone else.

  **Your Specific Contribution:** You have isolated the *engine* of Pluralistic Ignorance in low-stakes or non-hierarchical settings. Often, Pluralistic Ignorance is explained by social pressure (fear of rejection). Your cases show it can arise purely from **epistemic uncertainty**: "I am unsure; everyone else is silent; therefore, they possess information I lack."

  ### 2. Drawing the Boundaries (What It Is Not)
  You asked to distinguish this from neighboring ideas. Here is the demarcation:

  *   **Vs. Groupthink:**
      *   *Groupthink* requires a drive for cohesion and often an identifiable leader whose preferences are known. Members self-censor to avoid conflict or exclusion.
      *   *Your Case:* There is no leader, no explicit pressure, and no desire for cohesion overriding analysis. The silence is not self-censorship to protect the group; it is a genuine misreading of the group's knowledge state.
      *   *Boundary:* If they stay quiet because they fear the Chair's wrath, it is Groupthink. If they stay quiet because they assume the Chair's silence implies the proposal is sound, it is Pluralistic Ignorance.

  *   **Vs. Information Cascades (Herding):**
      *   *Cascades* typically rely on a **sequence**. Person A acts; Person B sees A's action and ignores their own private signal to follow A.
      *   *Your Case:* You noted, "no one is following a choice, they are following a non-event." In many of your examples (reading a proposal simultaneously, a mailing list), the "signals" are effectively simultaneous.
      *   *Boundary:* If they wait to see who speaks first and then copy them, it is a Cascade. If they all look around, see no one speaking, and mutually interpret that silence as "all clear," it is Pluralistic Ignorance driven by a **Silence Heuristic**.

  *   **Vs. Preference Falsification (Kuran):**
      *   *Preference Falsification* is the *act* of misrepresenting one's views. It is the behavior, not the cause.
      *   *Your Case:* Preference falsification is the *result* of the Pluralistic Ignorance.
      *   *Boundary:* If I lie because I want to keep my job, that is Preference Falsification. If I lie because I genuinely think I am the only one who sees the error, that is Pluralistic Ignorance.

  *   **Vs. Collective Commitment to Unwanted Outcomes:**
      *   This implies a conscious negotiation where members agree to a suboptimal outcome for the sake of compromise.
      *   *Your Case:* There is no negotiation. The outcome is arrived at by default. No one "commits" to it; they drift into it.

  ### 3. The Inferential Step
  You asked for a name for the step: *taking the absence of dissent as evidence of assent.*

  In logic, this is the fallacy **_Argumentum ex Silentio_** (Argument from Silence).
  In social psychology, this is a specific application of **Social Proof** (Cialdini), specifically **Social Proof from Omission**.

  However, to name it sharply for your purposes, I propose: **The Presumption of Competent Silence.**
  This distinguishes it from simple conformity. The members are not assuming others *agree*; they are assuming others *know something they don't*. The silence is treated as a positive signal of review ("I have read this and found no error") rather than a null signal ("I have not read this" or "I am unsure").

  ### 4. Stability: Metastable, Not Stable
  You asked whether the arrangement is stable. It is **metastable**.

  In game theory terms, this is a **Nash Equilibrium** that is **Pareto-inferior**. Everyone is playing their best strategy given their (incorrect) belief about what others are doing. No single individual has an incentive to deviate *as long as the ignorance remains pluralistic*.

  *   **Why it ends abruptly:** The arrangement relies entirely on the **privacy of dissent**. It collapses the moment private doubt becomes **Common Knowledge**.
  *   **Common Knowledge:** For the group to change course, it is not enough for everyone to *know* the proposal is bad. Everyone must *know that everyone else knows* it is bad.
  *   **The Collapse:** When one person finally speaks, they do not just add a "no" vote. They shatter the epistemic barrier. Instantly, the five who privately objected realize they are a majority. The "verdict" flips from unanimous consent to unanimous rejection in seconds. This explains why the ending feels abrupt and why members insist afterwards they "always had doubts."

  ### 5. Boundary Cases
  You asked about indifference and the single speaker.

  *   **The Indifferent Member:**
      *   *Does it matter?* Yes. Indifference acts as **noise** that strengthens the signal of consent.
      *   *Verdict:* If a member is indifferent, their silence is technically "true" (they do not object). However, for the member who *does* object, that silence is misinterpreted as *active* approval. The presence of indifferent members makes the Pluralistic Ignorance more robust because it increases the volume of silence without increasing the volume of dissent.
  *   **The Single Speaker:**
      *   *Did they break the pattern?* Yes.
      *   *Verdict:* They are not an accident; they are a **focal point**. In a metastable system, a "trembling hand" (a random deviation) is all that is required to shift the equilibrium. By speaking, they convert the situation from Pluralistic Ignorance into a standard debate. Once the first objection is public, the cost of joining the objection drops to near zero for everyone else.

  ### Summary Verdict
  The pattern you have noticed is **Pluralistic Ignorance**, driven by a **Presumption of Competent Silence**.

  *   **It is not Groupthink** because it lacks coercive pressure or leadership deference.
  *   **It is not Herding** because it lacks a sequence of positive actions.
  *   **It is Stable** only so long as doubts remain private information.
  *   **It is Unstable** against public information (Common Knowledge).

  If you require a label to use in the wild that distinguishes it from the "soft" usage of Groupthink, I recommend using **The Abilene Paradox** for the organizational outcome, but explicitly defining the mechanism as **Epistemic Silence**: *the collective misinterpretation of silence as evidence of competence.* This captures your insight that the members are not following a person, but following a lack of events.
