      *   *Case Study 3 (The Untested):* The matriarch. The philosophical core.
      *   *The Verdict:* Elara decides on the main case. She chooses Fink or Mask. The prompt asks for a definite choice. I think choosing *Fink* is more dramatic for a collapse of honour. It means the honour was never real, it was contingent on not being tested. But choosing *Mask* is more tragic. Let's go with *Fink* for the main antagonist, but *Mask* for a sympathetic character, and the "Never Called" case needs a hard truth.
      *   *Refining the Metaphysics:* The prompt asks to explore the "never called" wrinkle. Is "would have honoured" a fact or a story? Elara needs to decide.
      *   *Ending:* Elara leaves. The town knows the verdict.

  5.  **Writing - Focus on Tense and POV:**
      *   Close third person (Elara).
      *   Present tense ("She walks," not "She walked").
      *   Keep it tight. 3-6 pages roughly 1500-3000 words.

  6.  **Developing the "Never Called" Case:**
      *   Let's call her Mrs. Vane. She died before the collapse. Her estate is untouched. Did she have the disposition? Elara must rule on whether her estate is liable for the collective debt based on counterfactual honour.
      *   If Elara rules "Yes," she treats dispositions as categorical bases (inner state exists regardless of stimulus).
      *   If Elara rules "No," she treats dispositions as conditional truths only verifiable by stimulus.
      *   Decision: Elara rules "No." It hurts more. It emphasizes the fragility of the social contract. Honour requires the test.

  7.  **Developing the Main Case (Fink vs Mask):**
      *   Character: Julian. The one who called the first debt.
      *   Situation: He guaranteed someone. They failed. He was called to pay. He refused.
      *   Why? Did he lack funds (Mask) or did the call make him resentful/protective (Fink)?
      *   Elara needs to find evidence of the *change*.
      *   Let's make it subtle. A diary, a conversation recorded.
      *   Actually, let's make the protagonist's verdict about the *town itself*. The town's disposition to be honest.
      *   No, keep it personal. Julian.
      *   Verdict: Fink. The demand destroyed the honour.

  8.  **Drafting - Scene Details:**
      *   The Office: Damp, smell of salt and old paper.
      *   The Ledger: Names crossed out.
      *   The Interview: Julian. He argues he was blocked (Mask). Elara sees the shift (Fink).
      *   The Untested: Mrs. Vane's portrait.

  9.  **Refining the Metaphysical Note:**
      *   Need to be honest about where fiction bends the philosophy.
      *   Dispositions in philosophy are often about natural kinds (solubility). Applying them to moral psychology (honour) is a category shift (anthropomorphizing dispositions).
      *   The "Never Called" case leans on the *Conditional Analysis* of dispositions vs. *Categorical Basis*.
      *   Defense/Accusation: Pick a character.

  10. **Review against Constraints:**
